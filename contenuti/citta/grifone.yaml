# La città viva, luogo 4: la Locanda del Grifone di Ferro (presso: grifone-di-ferro, area ponti-sospesi).
# L'attività della sala, le tre storie di rep.grifone (2 la storia di Brunella, 4 l'insegna, 6 la chiave,
# ognuna con il suo flag), la branda di chi ha la chiave e la carta dei Ponti. Il servizio (l'alloggio a
# pagamento, la cucina di Brunella, le canzoni e le storie per Liaren, la bacheca) sta già in
# contenuti/grifone.yaml, contenuti/allenamento.yaml e contenuti/aree/ponti-sospesi.yaml.
# Reputazione: le storie la portano a 3, 5 e 7; la sala la fa salire fino a 4, il bancone e le travi fino
# a 6 solo dopo pista.acciaio >= 8, così la chiave arriva sempre con Liaren salva e Ondrel morto.
# Liaren: con pista.acciaio da 1 a 4 è sparita, a 5 è a letto ferita. Le scene che la vogliono in sala
# escludono quei passi; la sala ha una variante senza di lei.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: una-sera-al-grifone
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Una sera al Grifone
    sommario: "La sera il Grifone di Ferro si riempie, e a Brunella due mani in più servono sempre."
    luogo: Locanda del Grifone di Ferro, la sala
    area: ponti-sospesi
    ripetibile: true
    requisiti: [conosci.liaren >= 1]
    testo: |
      La sera la sala del Grifone si riempie di mercanti del Mercato dei Nodi
      e di Raschiatori del turno lungo. Dragna Gro-Malog tiene il suo tavolo
      con i fogli dei turni, e accanto quattro Raschiatori giocano a Zekar
      con un mazzo così unto che le carte si attaccano fra loro.

      {origine apprendista-raschiatore} Quando passi, Dragna alza gli occhi
      dai fogli quanto basta per trovare il tuo nome in colonna.

      Brunella esce dalla cucina con tre scodelle per braccio e ti passa
      accanto guardandoti le mani, per vedere se sono libere.
    opzioni:
      - testo: "Servire ai tavoli mentre Liaren suona"
        descrizione: "Quando Liaren prende il samisen la sala si alza per il ritornello, e i vassoi devono passare lo stesso."
        immagine: personaggi/liaren-tarvelin
        requisiti: [rep.grifone < 4]
        quando: [pista.acciaio == 0]
        prova: { attributo: fisico, abilita: [atletica, galateo], difficolta: Media }
        successo:
          titolo: Le gambe di una ballerina
          testo: |
            Liaren attacca una canzone dei Raschiatori e la sala batte i piedi,
            mentre tu passi fra i tavoli con il vassoio e impari a girarti di
            fianco quando un boccale si alza per il ritornello. A fine sera non
            hai versato una goccia, e Brunella ti mette in mano la paga. Liaren ti
            indica alla sala con il manico del samisen e annuncia che hai le gambe
            di una ballerina.
          effetti: { monete: 2, rep.grifone: 0.5 }
        fallimento:
          titolo: La camicia del Raschiatore
          testo: |
            Al primo ritornello un Raschiatore si alza di scatto per battere le
            mani proprio mentre gli passi dietro, e il vassoio fa un mezzo giro in
            aria. Tre scodelle di zuppa finiscono sul pavimento e una sulla sua
            schiena, e la sala applaude più forte che per la canzone. Il
            Raschiatore, gocciolante, vuole sapere chi gli paga la camicia.

      - testo: "Servire ai tavoli"
        descrizione: "Stasera Liaren non c'è, e Brunella manda avanti la locanda da sola."
        immagine: personaggi/brunella-fennick
        requisiti: [rep.grifone < 4]
        quando: [pista.acciaio >= 1, pista.acciaio <= 5]
        prova: { attributo: fisico, abilita: [atletica, galateo], difficolta: Media }
        successo:
          titolo: La sala a voce bassa
          testo: |
            Porti le scodelle ai tavoli due alla volta, e stasera la sala mangia a
            voce bassa, come in una casa dove c'è un malato. A fine servizio
            Brunella conta le scodelle sporche e poi le monete, che ti mette in
            mano chiudendoti sopra le dita una alla volta. «Domani ancora» dice, e
            torna in cucina.
          effetti: { monete: 2, rep.grifone: 0.5 }
        fallimento:
          titolo: La scala
          testo: |
            Porti le scodelle con la testa altrove, e a metà sera sbagli tavolo
            due volte di fila finché Brunella ti prende il vassoio di mano. Più
            tardi la trovi seduta su una cassa in cucina, con il mestolo in grembo
            e gli occhi sulla scala che porta al piano di sopra. Quando ti vede
            torna ai fornelli e si mette a mescolare una pentola che non ne aveva
            bisogno.

      - testo: "Servire ai tavoli mentre Liaren suona"
        descrizione: "Liaren è tornata al samisen e suona seduta, e la sala ha più sete del solito."
        immagine: personaggi/liaren-tarvelin
        requisiti: [rep.grifone < 4]
        quando: [pista.acciaio >= 6]
        prova: { attributo: fisico, abilita: [atletica, galateo], difficolta: Media }
        successo:
          titolo: Il cenno del plettro
          testo: |
            Liaren suona seduta sullo sgabello alto, come fa da quando è tornata
            dall'Acciaieria, e attacca le canzoni dei Raschiatori una dopo l'altra. Tu passi
            fra i tavoli con il vassoio sopra le teste, e a fine sera Brunella ti mette in
            mano qualche moneta presa dal grembiule. Fra una canzone e l'altra Liaren alza
            il plettro verso di te come si alza un boccale.
          effetti: { monete: 2, rep.grifone: 0.5 }
        fallimento:
          titolo: Musica allegra
          testo: |
            A metà di una canzone un mercante ubriaco chiede ad alta voce qualcosa
            di allegro, e mentre ti giri a guardarlo il vassoio va per conto suo.
            Liaren smette di suonare per ridere, con una mano sul fianco, e dice
            al mercante che la musica allegra stasera l'hai fatta tu. Brunella
            intanto è già arrivata con lo straccio.

      - testo: "Mettere pace fra due Raschiatori"
        descrizione: "Due Raschiatori litigano su una partita di Zekar, e conviene mettersi in mezzo prima che si alzi Dragna."
        immagine: personaggi/dragna-gro-malog
        requisiti: [rep.grifone < 2]
        prova: { attributo: sociale, abilita: [intimidire, empatia], difficolta: Media }
        successo:
          titolo: Le sedie di Brunella
          testo: |
            Ti metti fra i due con le mani aperte e chiedi a quello più grosso
            quanto ha perso, e lui ammette che sono pochi spiccioli. Gli fai
            notare che una sedia rotta Brunella la mette sul conto, e costa di
            più. Il Raschiatore ci pensa contando sulle dita, poi si rimette a
            sedere, e al tavolo dei turni Dragna, già mezza in piedi, si
            riaccomoda.
          effetti: { rep.grifone: 0.5 }
        fallimento:
          titolo: La zuppa del vicino
          testo: |
            Quello più grosso ti scosta con una spinta che ti fa sedere sul tavolo
            accanto, in mezzo a una zuppa ancora calda. La lite finisce un momento
            dopo, quando Dragna si alza dal suo tavolo e i due si risiedono senza
            che lei abbia aperto bocca. Brunella ti porta uno straccio per i
            pantaloni e una zuppa nuova per il cliente.

      - testo: "Mettere pace fra due Raschiatori"
        descrizione: "Ormai in sala ti conoscono, e alle prime parole grosse qualcuno si gira a guardare te."
        immagine: personaggi/tenebra
        requisiti: [rep.grifone >= 2, rep.grifone < 4]
        prova: { attributo: sociale, abilita: [intimidire, empatia], difficolta: Media }
        successo:
          titolo: Un turno saltato
          testo: |
            Stavolta la lite è fra due della stessa squadra, per un turno saltato.
            Li fai sedere allo stesso tavolo e lasci parlare quello che è sceso da
            solo, e viene fuori che l'altro aveva la figlia con la febbre e si
            vergognava a dirlo. Alla fine si dividono un boccale, e Tenebra,
            vicino alla finestra, ti guarda con le vene che gli brillano piano
            sotto la pelle bruciata del viso.
          effetti: { rep.grifone: 0.5 }
        fallimento:
          titolo: D'accordo su di te
          testo: |
            Provi a far ragionare tutti e due insieme, e finisce che se la
            prendono con te, e su questo almeno vanno d'accordo. Tenebra si alza
            dal tavolo vicino alla finestra e resta in piedi senza dire una
            parola, e i due si risiedono. Torni al bancone con le orecchie che
            scottano.

      - testo: "Giocare a Zekar con chi torna dagli scavi"
        descrizione: "Al Grifone si gioca a puntate basse, e i Raschiatori dicono che a Zekar si leggono le pause."
        requisiti: [monete >= 3]
        prova: { attributo: mentale, abilita: [percezione, ingannare], difficolta: Media }
        successo:
          titolo: Il sopracciglio
          testo: |
            Si pesca dal mazzo comune cercando di arrivare più vicino possibile a
            venti senza superarlo. Il Raschiatore di fronte a te si gratta il
            sopracciglio ogni volta che ha una carta alta, e per educazione
            aspetti la quarta mano prima di approfittarne. Chiudi la serata con
            qualche moneta in più, mentre lui ti racconta, per consolarsi, che
            Liaren il Grifone l'ha vinto a Zekar.
          effetti: { monete: 4 }
        fallimento:
          titolo: Le facce
          testo: |
            Si pesca dal mazzo comune cercando di arrivare più vicino possibile a
            venti senza superarlo. La faccia del Raschiatore di fronte a te resta
            ferma per tutta la sera, mentre la tua a quanto pare racconta
            moltissimo. Perdi una bella manciata di monete in cinque mani, e lui
            le impila con cura e ti offre un sorso dal suo boccale, per
            educazione.
          effetti: { monete: -3 }

      - testo: "Aggiustare le imposte del piano di sopra"
        descrizione: "Nella locanda più antica di Qir-Azel c'è sempre un'imposta che sbatte, e Brunella paga in notti sul registro."
        immagine: personaggi/brunella-fennick
        requisiti: [rep.grifone < 4]
        prova: { attributo: fisico, abilita: [atletica, tecnologia], difficolta: Media }
        successo:
          titolo: I cardini nuovi
          testo: |
            La stanza con *Gufo* scritto a gesso sulla porta ha imposte che
            sbattono tutta la notte. Lavori sporgendoti sul vuoto della Cicatrice,
            con il vento che ti gonfia la camicia, e cambi i cardini arrugginiti
            con due presi dal magazzino. Brunella prova le imposte tre volte, come
            se non si fidasse né di te né di loro, poi scende a segnare una notte
            sul registro accanto al tuo nome.
          effetti: { alloggio.grifone: 1, rep.grifone: 0.5 }
        fallimento:
          titolo: Lo scalpello del nonno
          testo: |
            Ti sporgi sul vuoto per smontare il cardine di sopra, e mentre il
            cardine ti resta in mano lo scalpello scende nella Cicatrice girando
            su se stesso, finché lo perdi di vista. Per il resto della sera
            l'imposta la tiene chiusa un cuneo di legno. Brunella sospira che lo
            scalpello era di suo nonno, poi ammette che non è vero e ti versa la
            zuppa lo stesso.

      - testo: "Asciugare i boccali al bancone"
        descrizione: "Dietro il bancone con lo straccio in mano, le chiacchiere della sala ti passano davanti."
        esito:
          titolo: Dietro il bancone
          testo: |
            Asciughi boccali dietro il bancone finché la pila finisce, e da lì si
            sente tutta la sala, perché nessuno abbassa la voce davanti a uno con
            lo straccio in mano. Due Raschiatori discutono di un cunicolo che per
            uno è crollato e per l'altro no. A fine sera Brunella ti chiede che
            cosa hai sentito, e alla tua risposta annuisce come se lo sapesse già.
          pe: { percezione: 2 }
          effetti: { informazioni.voce: 1 }

      - testo: "Tenere il bancone mentre Liaren è in Gilda"
        descrizione: "La Casa dei Nodi vuole Liaren a un tavolo per tutto il pomeriggio, e il bancone lo lascia a te."
        immagine: personaggi/liaren-tarvelin
        requisiti: [rep.grifone >= 4, rep.grifone < 6]
        quando: [pista.acciaio >= 8]
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il sottobicchiere
          testo: |
            Liaren ti lascia il registro e la chiave della cassa, e sulla porta ti
            dice che a credito beve soltanto chi ha la faccia di uno che torna. A
            un mercante che vorrebbe pagare in promesse metti davanti il conto
            senza alzare gli occhi, come farebbe Brunella. Al suo ritorno Liaren
            controlla il registro e ti conta la paga sul legno, usando come
            sottobicchiere una lettera della Gilda.
          effetti: { monete: 5, rep.grifone: 0.5 }
        fallimento:
          titolo: La Volpe
          testo: |
            A metà pomeriggio dai la stanza della *Volpe* a due clienti diversi, e
            quando si incontrano sulla porta in mutande la discussione scende fino
            in sala, mutande comprese. Liaren rientra dalla Casa dei Nodi proprio
            in quel momento e sistema tutto con una battuta e una pinta offerta.
            Poi ti paga metà della giornata e ti spiega, serissima, che la Volpe
            porta sfortuna da sempre.
          effetti: { monete: 2 }

      - testo: "Rinforzare le travi sotto la sala"
        descrizione: "Quando passa un carro il pavimento vibra, e le travi sospese sul vuoto si raggiungono da una botola."
        immagine: ambientazione/locanda-del-grifone-di-ferro
        requisiti: [rep.grifone >= 4, rep.grifone < 6]
        quando: [pista.acciaio >= 8]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Sotto il pavimento
          testo: |
            Scendi da una botola della dispensa con una corda in vita e una borsa
            di cunei, e ti ritrovi a cavalcioni di una trave con la Cicatrice
            sotto gli stivali. Batti un cuneo e passi alla trave dopo, mentre di
            sopra Brunella ti grida di non guardare giù proprio quando stavi per
            farlo. La sera passa sul ponte un carro carico di ferro, e i boccali
            sul bancone restano fermi.
          effetti: { monete: 5, rep.grifone: 0.5 }
        fallimento:
          titolo: La borsa dei cunei
          testo: |
            Alla seconda trave il vento della Cicatrice ti fa girare su te stesso, e per
            tenerti al legno lasci andare la borsa dei cunei, che sparisce nella nebbia senza
            un rumore. Liaren e due Raschiatori ti tirano su di peso, e Brunella ti mette in
            mano una tazza di brodo che non riesci a tenere ferma. Quando passa un carro, i
            boccali sul bancone continuano a tremare.

      - testo: "Offrire un giro ai fabbri della tua strada"
        descrizione: "Certe sere salgono al Grifone i fabbri che ti conoscono da quando al bancone arrivavi con il mento."
        quando: [origine.figlio-della-citta-bassa >= 1]
        requisiti: [monete >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Facile }
        successo:
          titolo: Il tuo vicolo
          testo: |
            Paghi un giro al tavolo dei fabbri della tua strada. Il più vecchio ti
            chiama con il soprannome che avevi da ragazzino e racconta di quando sei
            caduto nella vasca del tempraggio, poi si parla del quartiere, di chi ha
            chiuso bottega e di chi ha preso un garzone che nessuno conosce.

            {conoscenze-della-strada Facile} Dove si conoscono anche i gatti, un
            garzone che nessuno conosce ce l'ha mandato qualcuno.
          effetti: { monete: -1, informazioni.voce: 2 }
        fallimento:
          titolo: La vasca del tempraggio
          testo: |
            Il più vecchio dei fabbri attacca la storia di quando sei caduto nella
            vasca del tempraggio, e gli altri lo correggono a ogni frase, rendendo
            la vasca più profonda e te più piccolo. La storia dura fino al secondo
            giro, e del quartiere non si parla più.
          effetti: { monete: -1 }

  # ------------------------------------------------------------ storia a 2 · la storia di Brunella
  - id: la-storia-di-brunella
    presso: grifone-di-ferro
    immagine: personaggi/brunella-fennick
    titolo: La storia di Brunella
    sommario: "A locanda chiusa Brunella impasta il pane dolce per il giorno dopo, e stasera ha voglia di compagnia."
    luogo: Locanda del Grifone di Ferro, la cucina, a notte fonda
    area: ponti-sospesi
    requisiti: [rep.grifone >= 2, grifone.brunella == 0, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      Dopo la chiusura la cucina del Grifone è l'unica stanza accesa, e ci
      arrivi seguendo l'odore del burro. Brunella sta in piedi su una
      cassetta per arrivare al tavolo infarinato, e quando ti affacci ti
      indica con il mento il catino e una seconda ciotola di pasta.

      «Il pane dolce del Maniero» dice. «Lo faccio di notte, che di giorno
      qui dentro non si respira. La ricetta era della vecchia cuoca dei
      Tarvelin, e la vecchia cuoca adesso sono io.» Piega la pasta con il
      palmo tenendo le dita alzate e ti rifà vedere il movimento più lento.

      {origine rampollo-dei-quartieri-alti} Nei salotti del pane dolce del
      Maniero si parlava con invidia, e non te lo immaginavi impastato di
      notte su una cassetta.

      Sulla mensola sopra il fornello c'è un cucchiaio di legno con il manico
      consumato e una tacca vicino alla punta, l'unico attrezzo senza un velo
      di farina.
    opzioni:
      - testo: "Chiederle come è arrivata al Maniero"
        descrizione: "Brunella sa tutto di tutti quelli che entrano al Grifone, e di sé non racconta quasi niente."
        costo: 0
        esito:
          titolo: La sguattera
          testo: |
            «Venivo da una fattoria sul Torvessa dove eravamo nove fratelli con
            una gallina sola» dice Brunella, piegando la pasta. «La gallina
            mangiava meglio di tutti.» Al Maniero l'avevano presa come sguattera,
            perché sotto i fornelli ci entrava intera, e ci è rimasta
            quarant'anni, fino a diventare la cuoca. «Il signor Ondrel voleva la
            cena alle sette, e alle sette la cena c'era. Non mi ha mai detto se
            era buona.»

      - testo: "Chiederle di Liaren bambina"
        descrizione: "La conosce da quando aveva i capelli troppo corti per legarli."
        costo: 0
        esito:
          titolo: Sotto il tavolo
          testo: |
            Da bambina Liaren scappava dalle lezioni di galateo e si nascondeva
            sotto il tavolo della cucina con un libro della biblioteca del padre,
            e Brunella diceva di no alla maestra senza voltarsi dai fornelli. A
            otto anni le ha insegnato a tagliare le cipolle, spostandole le dita
            sul coltello. «Adesso le taglia più in fretta di me, e ci piange anche
            meno» dice, con l'orgoglio di una madre.

      - testo: "Chiederle della notte in cui morì Maerith"
        descrizione: "Brunella era al Maniero quella notte, e sa più di quello che c'è scritto nel diario di Isvaro."
        quando: [pista.acciaio >= 6]
        costo: 0
        esito:
          titolo: Di Liaren
          testo: |
            Brunella smette di impastare e si pulisce le mani sul grembiule finché
            fra le dita non resta più farina, guardando il cucchiaio di legno
            sulla mensola. «Questa no. È di Liaren, e se un giorno vorrà
            raccontarla la racconterà lei. Io starò zitta anche quel giorno» dice
            con la voce di sempre, e riprende la pasta dal punto in cui l'aveva
            lasciata.

      - testo: "Chiederle perché ha seguito Liaren"
        descrizione: "Quarant'anni nella stessa cucina, e poi una locanda sopra il vuoto. Qualcosa l'ha convinta."
        esito:
          titolo: La porta della cucina
          testo: |
            Brunella copre le paste con un panno e solo allora risponde. Anni dopo che
            era andata via dal Maniero, Liaren si è presentata alla porta di servizio
            con i capelli corti, a dirle che si era comprata una locanda e che la
            zuppa non la sapeva fare. «Ho preso i miei coltelli e quel cucchiaio lì, e
            da quella sera al Maniero il pane dolce non l'ha più fatto nessuno.»
          pe: { empatia: 5 }
          imposta: { grifone.brunella: 1 }
          effetti: { rep.grifone: 1 }

      - testo: "Impastare come le cuoche del Maniero"
        descrizione: "Il pane dolce viene buono se lo si lavora finché le braccia protestano, e poi ancora un po'."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il cucchiaio della vecchia cuoca
          testo: |
            Pieghi la pasta con il palmo finché le braccia ti bruciano, perché
            Brunella ti guarda. Lei la tasta con due dita, poi ci gira dentro il
            cucchiaio di legno una volta sola, per buona sorte. Era della cuoca
            che le ha insegnato il mestiere, e la tacca vicino alla punta l'ha
            incisa la sera in cui ha seguito Liaren. «Domattina il primo pezzo è
            tuo» dice.
          imposta: { grifone.brunella: 1 }
          effetti: { rep.grifone: 1 }
        fallimento:
          titolo: Le pieghe svelte
          testo: |
            Quando le braccia si stancano cominci a schiacciare la pasta con le
            dita, come se ti avesse fatto un torto. Brunella ti toglie la ciotola
            e la rimette a posto con quattro pieghe svelte. «Se la tratti male, si
            stanca prima la pasta di te» dice, e ti manda a letto con una fetta di
            quello di ieri.

  # ------------------------------------------------------------ storia a 4 · l'insegna
  - id: l-insegna-del-grifone
    presso: grifone-di-ferro
    immagine: personaggi/liaren-tarvelin
    titolo: L'insegna del Grifone
    sommario: "Liaren ha steso l'insegna su due cavalletti, mentre sul bancone si accumulano le lettere della Gilda."
    luogo: Locanda del Grifone di Ferro, la sala, di mattina
    area: ponti-sospesi
    requisiti: [rep.grifone >= 4, grifone.insegna == 0, pista.acciaio >= 8]
    testo: |
      La mattina il Grifone è vuoto e odora di sapone. In mezzo alla sala c'è l'insegna, una
      tavola di quercia con un grifone nero su un fondo che un tempo era rosso; le fiamme della
      razzia le hanno mangiato un angolo, e della scritta resta *Locanda del Grifone di F*.

      Liaren è seduta a cavalcioni di una panca con il pennello asciutto, e sul bancone si
      accumulano le lettere con la cera verde della Casa dei Nodi. «La Gilda scrive ogni mattina»
      dice. «Vogliono che firmi e riaccenda la fornace, e mi offrono un amministratore e la sedia
      di mio padre nel consiglio. Con un mese di Acciaieria questa la rifaccio con un grifone
      dorato.»

      {origine mercante-dei-ponti} La cera verde la riconosci da lontano.

      Dalla porta della cucina Brunella guarda la vernice e torna dentro. «Tu che cosa terresti?»
      chiede Liaren, e si gira a guardarti.
    opzioni:
      - testo: "Chiederle che cosa ne pensa davvero dell'Acciaieria"
        descrizione: "La Gilda ne parla come di un affare, e Liaren finora ne ha parlato soltanto con il pennello."
        costo: 0
        esito:
          titolo: Il registro della paga
          testo: |
            «Penso che là dentro sono morti otto operai, e che la Gilda me ne
            scrive come di un guasto alla fornace» dice Liaren. Nel registro della
            paga, arrivato con la prima lettera, ha riconosciuto due famiglie
            della Città Bassa che vengono a bere qui il sabato. «Se firmo, domani
            la riaccendono con gente nuova, e il primo lingotto esce con il mio
            nome sopra.»

      - testo: "Dirle che potrebbe prendere i soldi e basta"
        descrizione: "L'Acciaieria può andare avanti senza di lei, e una rendita non chiede di sporcarsi le mani."
        costo: 0
        esito:
          titolo: Nemmeno un chiodo
          testo: |
            Liaren ti ascolta fino in fondo, e il pennello, che adesso ha intinto, le
            gocciola sul ginocchio. «Quei soldi li ha fatti un uomo che con l'aiuto di Vesh
            ha tolto di mezzo mia madre, e con i suoi soldi non ci compro nemmeno un chiodo
            per questa tavola» dice a voce piatta. «Però grazie di avermelo detto in
            faccia. Alle spalle me lo dicono tutti.»

      - testo: "Ridipingere l'insegna con lei"
        descrizione: "Per ridipingerla servono una mano ferma per il grifone e la pazienza di un copista per la scritta."
        prova: { attributo: sociale, abilita: [espressivita, tecnologia], difficolta: Media }
        successo:
          titolo: L'angolo bruciato
          testo: |
            Liaren ripassa il fondo rosso e tu il grifone, penna per penna, con il
            pennello più piccolo della cucina. Le lettere che mancano non le
            rifate, e sull'angolo bruciato Liaren passa una mano di vernice chiara
            perché il carbone non si sbricioli più. A mezzogiorno due Raschiatori
            vi aiutano a riappenderla, e Liaren porta la pila di lettere della
            Gilda in cucina, dove il fuoco è acceso.
          imposta: { grifone.insegna: 1 }
          effetti: { rep.grifone: 1 }
        fallimento:
          titolo: La coda
          testo: |
            Alla terza penna del grifone il pennello ti scappa e lascia sul fondo
            rosso una riga nera lunga una spanna, e a coprirla la allarghi. Liaren
            guarda la macchia a lungo con la testa piegata e dice che adesso il
            grifone ha una coda che prima non aveva. Ride, però per oggi mette giù
            il pennello.
          effetti: { scandalo: 0.5 }

      - testo: "Aiutarla a rispondere alla Casa dei Nodi"
        descrizione: "Liaren da sola risponderebbe alla Gilda con due righe e una parolaccia, e serve il modo giusto."
        immagine: fazioni/gilda-dei-mercanti
        prova: { attributo: mentale, abilita: [politica-ed-economia, galateo], difficolta: Media }
        successo:
          titolo: Il nome intero
          testo: |
            Scrivete la risposta al bancone, con Liaren che detta e tu che togli
            le parolacce. L'erede dei Tarvelin non firmerà, e la Gilda può
            trattare con lei qualunque altra cosa purché non riguardi la fornace,
            con la gratitudine che serve e nemmeno un grammo di più. Liaren firma
            con il suo nome intero, cosa che non faceva da anni, e manda la
            lettera alla Casa dei Nodi.
          imposta: { grifone.insegna: 1 }
          effetti: { rep.grifone: 1 }
        fallimento:
          titolo: Cortese e scortese
          testo: |
            Ogni volta che togli una parolaccia Liaren ne aggiunge due, e alla
            fine la lettera è così cortese da sembrare una presa in giro e così
            scortese da sembrare una dichiarazione di guerra. Liaren la rilegge ad
            alta voce imitando un segretario della Gilda, ride fino a tenersi il
            fianco e la butta nel camino insieme alla lettera arrivata stamattina.
          effetti: { scandalo: 0.5 }

      - testo: "Dirle di tenere tutto com'è"
        descrizione: "Forse il Grifone va bene così come la razzia l'ha lasciato, insegna bruciata compresa."
        esito:
          titolo: I nomi sulle assi
          testo: |
            Le dici che l'insegna bruciata racconta la notte della razzia meglio
            di qualunque grifone dorato. Liaren ci pensa con il pennello fra i
            denti, poi va alla finestra e legge i nomi incisi sulle assi,
            fermandosi un momento su quello di un Raschiatore non tornato
            dall'ultimo turno. Nel pomeriggio l'insegna torna sopra la porta con
            l'angolo bruciato, e la sera Brunella accende il camino con le lettere
            della Gilda.
          pe: { empatia: 5 }
          imposta: { grifone.insegna: 1 }
          effetti: { rep.grifone: 1 }

  # ------------------------------------------------------------ storia a 6 · la chiave
  - id: una-chiave-del-grifone
    presso: grifone-di-ferro
    immagine: personaggi/liaren-tarvelin
    titolo: Una chiave del Grifone
    sommario: "È tardi e la sala si svuota, e Liaren ti chiede di restare a chiuderla."
    luogo: Locanda del Grifone di Ferro, a chiusura
    area: ponti-sospesi
    requisiti: [rep.grifone >= 6, grifone.chiave == 0, pista.acciaio >= 8]
    testo: |
      Dopo l'ultima campana Liaren appende il samisen al chiodo dietro il
      bancone e non torna a sedersi. Brunella è già salita a dormire, e in
      sala resta soltanto un Raschiatore addormentato con la guancia sul
      tavolo.

      Dalla tasca Liaren tira fuori una chiave di ferro lunga quanto un dito,
      con un nastro azzurro sbiadito legato all'anello, e la posa sul bancone
      fra voi due. «Le chiavi del Grifone sono tre. Una è mia e una è di
      Brunella» dice. «Questa l'ho fatta fare il giorno che ho comprato la
      locanda, per mio fratello, così la sera poteva rientrare senza
      bussare.» Passa il pollice sul nastro. «È rimasta su un chiodo in
      cucina per sei anni, e Brunella la spolverava il sabato senza dirmi
      niente. A lui adesso non serve.»

      {empatia Media} Il nome del fratello l'ha tenuto fuori dalla frase con
      la stessa cura con cui Brunella teneva la chiave fuori dalla polvere.

      *Sei anni su un chiodo, e adesso la mette davanti a me.* Liaren indica
      il Raschiatore con il mento. «Qui chi ha la chiave chiude la sala, e
      stasera la chiudi tu. Lui si chiama Orso, e quando dorme così non lo
      sveglia neanche un ponte che crolla.» Si appoggia al bancone a braccia
      conserte, e aspetta.
    opzioni:
      - testo: "Chiederle perché proprio tu"
        descrizione: "In città ci sono Raschiatori che bevono qui da vent'anni, e la chiave poteva darla a uno di loro."
        costo: 0
        esito:
          titolo: La prima faccia
          testo: |
            «Perché quando mi hai tirata fuori dall'Acciaieria la prima faccia che
            ho visto era la tua» dice Liaren. «E perché Brunella ha detto di sì
            prima che finissi la domanda. In questa città ho un padre morto e un
            fratello che è meglio non nominare. Mi serve una locanda piena di
            gente, e qualcuno che la chiuda quando io non ce la faccio.»

      - testo: "Svegliarlo con le buone"
        descrizione: "Orso è un Raschiatore, e i Raschiatori si svegliano male."
        immagine: ambientazione/locanda-del-grifone-di-ferro
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La canzone a metà
          testo: |
            Ti siedi accanto a Orso e gli parli piano del vento sul ponte e della
            zuppa di domani, finché apre un occhio e ti chiede se è già mattina.
            Gli dici che il suo letto è più comodo del tavolo. Si alza da solo, ti
            dà sulla spalla una pacca che ti lascia il segno ed esce cantando
            sottovoce.
          segue: la-chiave-sul-bancone
        fallimento:
          titolo: Il caposquadra
          testo: |
            Gli posi una mano sulla spalla e lo chiami per nome. Orso si sveglia
            di colpo, ti scambia per il suo caposquadra, ti giura che il turno di
            domani lo fa lui e si riaddormenta sull'ultima parola. Dal bancone
            Liaren ride senza fare rumore e ti dice che la sala si chiude anche
            domani sera.
          effetti: { scandalo: 0.5 }

      - testo: "Portarlo a casa di peso"
        descrizione: "Abita in una baracca sul margine dei Ponti e pesa quanto una botte, ma una botte non scalcia."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La baracca sul margine
          testo: |
            Ti carichi un braccio di Orso sulle spalle, e a metà sala si sveglia
            abbastanza da aiutarti con le gambe. Lo porti fino alla sua baracca
            sul margine dei Ponti e lo lasci seduto sulla soglia con la chiave in
            mano, e lui ti fa ciao con la chiave. Quando torni, con la schiena che
            ti ricorda ogni passo, Liaren ha già spento metà delle lanterne.
          segue: la-chiave-sul-bancone
        fallimento:
          titolo: Sotto il tavolo
          testo: |
            Ti carichi un braccio di Orso sulle spalle, ma a metà sala ti cedono
            le gambe e finite tutti e due sotto un tavolo, con Orso che continua a
            dormire sopra il tuo braccio. Liaren vi guarda da sopra il bancone e
            dice che per stasera Orso dorme lì sotto con una coperta addosso.

      - testo: "Svegliarlo con la canzone della buonanotte"
        descrizione: "I Raschiatori chiudono le serate sempre con la stessa canzone, e chi la sente di solito va a casa."
        immagine: personaggi/liaren-tarvelin
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: L'ultimo verso
          testo: |
            Attacchi a voce bassa la canzone della corda che tiene e della moglie
            che aspetta in cima, e alla seconda strofa Liaren riprende il samisen
            dal chiodo e ti viene dietro. Al ritornello Orso alza la testa e
            l'ultimo verso lo canta con voi a occhi chiusi, stonato come una
            campana crepata. Poi si alza, vi augura la buonanotte con un inchino
            ed esce camminando dritto.
          segue: la-chiave-sul-bancone
        fallimento:
          titolo: Un'altra pinta
          testo: |
            Alla seconda strofa sbagli le parole e fai sposare la moglie con la
            corda. Orso si sveglia ridendo così forte che deve tenersi al tavolo e
            chiede un'altra pinta, e Liaren gliela versa, perché a una risata così
            non si dice di no. La sala resta aperta fino a tardi.
          effetti: { scandalo: 0.5 }

      - testo: "Aspettare che si svegli da solo"
        descrizione: "Prima o poi si sveglierà, e nel frattempo la sala si può mettere in ordine intorno a lui."
        costo: 2
        esito:
          titolo: L'alba
          testo: |
            Metti le sedie sui tavoli intorno a Orso senza fare rumore e spazzi la
            sala, poi ti siedi sul gradino della scala, che con il passare della
            notte diventa sempre più duro. Orso si sveglia quando filtra la luce
            grigia, vede la sala in ordine e ti chiede se hai chiuso tu. Gli dici
            di sì, e lui annuisce come se fosse la cosa più normale del mondo ed
            esce.
          pe: { resilienza: 5 }
          segue: la-chiave-sul-bancone

  - id: la-chiave-sul-bancone
    immagine: personaggi/liaren-tarvelin
    titolo: La chiave sul bancone
    tipo: seguito
    luogo: Locanda del Grifone di Ferro, a sala chiusa
    area: ponti-sospesi
    requisiti: [grifone.chiave == 0]
    testo: |
      Quando la sala è vuota Liaren chiude la porta d'ingresso con un solo
      giro di chiave. Poi prende dal bancone quella con il nastro azzurro e
      te la mette sul palmo, chiudendoti le dita sopra con le sue, che hanno
      i polpastrelli duri delle corde.

      {origine fuggiasco-di-ghoran} La prima sera al Grifone hai tastato la
      branda con il palmo prima di fidarti a stenderti, e adesso tieni la
      chiave allo stesso modo, come una cosa che potrebbero riprendersi.

      «Si entra dal retro, come quelli di casa» dice. «La branda al piano di
      sopra non la paghi più. Se di notte senti rumore in sala non scendere a
      guardare, perché sono io che non dormo.» Sale due gradini e si ferma.
      «Il nastro toglilo, se vuoi. Era di quando lui aveva dieci anni.»

      Sul bancone, sotto il mestolo appeso, Brunella ha lasciato una scodella
      coperta con un piatto. *Brunella sapeva già come sarebbe finita la
      serata.* Il samisen dondola appena sul suo chiodo, per lo spiffero
      delle finestre inchiodate.

      {furtivita Facile} Dal retro uno dei gradini della scala di servizio
      cigola, e ti conviene ricordarlo da subito.
    opzioni:
      - testo: "Tenere la chiave"
        descrizione: "Con il nastro o senza. Da stasera al Grifone entri dal retro."
        esito:
          titolo: Quelli di casa
          testo: |
            Infili la chiave con tutto il nastro nella tasca interna della giubba,
            e mentre mangi la zuppa fredda la senti contro il petto. Prima di
            salire spegni l'ultima lanterna. Dal piano di sopra arriva la voce di
            Liaren che canticchia piano, e smette quando arrivi in cima alle
            scale.
          imposta: { grifone.chiave: 1 }
          effetti: { rep.grifone: 1 }
      - testo: "Rifiutare con garbo"
        descrizione: "Quella chiave era di qualcun altro, e forse non spetta a te portarla."
        esito:
          titolo: Il chiodo in cucina
          testo: |
            Le dici che quella chiave è di qualcun altro, e aprire la mano ti
            costa più fatica del previsto. Liaren la riprende senza dire niente e
            va a riappenderla al chiodo della cucina, accanto ai mestoli. «Resta
            lì, allora. Brunella la spolvera il sabato, e io non le dico niente»
            dice dalla porta, e ti spinge davanti la scodella.

  # ------------------------------------------------------------ la branda di chi ha la chiave
  - id: la-tua-branda
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: La tua branda
    sommario: "Entri dal retro con la tua chiave, e la branda al piano di sopra ti aspetta."
    luogo: Locanda del Grifone di Ferro, la tua stanza
    area: ponti-sospesi
    ripetibile: true
    requisiti: [grifone.chiave >= 1]
    testo: |
      La porta del retro si apre con la tua chiave al secondo giro, perché la
      serratura ha le sue abitudini. In cucina il fuoco è coperto di cenere,
      e sul tavolo Brunella ti lascia sempre qualcosa sotto un panno. Sali al
      buio la scala di servizio scavalcando il gradino che cigola, fino alla
      tua stanza, quella con sulla porta il nome a gesso dell'animale che hai
      scelto tu.

      {origine figlio-del-circolo} Ti addormenti ascoltando il vento che sale
      dalla Cicatrice, come nel Bosco di Velthar ascoltavi quello fra gli
      alberi.
    opzioni:
      - testo: "Dormire fino a giorno"
        descrizione: "Una notte intera sotto il tetto del Grifone, con la porta che si apre al tuo giro di chiave."
        esito:
          titolo: L'odore del pane
          testo: |
            Ti togli gli stivali seduto sulla branda, e non ricordi di esserti
            steso. Ti sveglia l'odore del pane che sale dalle assi, e scendendo ti
            accorgi che le ferite tirano meno. Brunella ti chiede soltanto se il
            cuscino va bene, e anche se è pieno di paglia e di bitorzoli le dici
            di sì.
          effetti: { ferite: -1, tormento: -0.5 }

  # ------------------------------------------------------------ la carta
  - id: carta-il-grifone-ti-cerca
    immagine: personaggi/brunella-fennick
    titolo: Il Grifone ti cerca
    sommario: "Sul Ponte delle Mille Corde un ragazzino con un grembiule troppo lungo ti corre dietro chiamandoti per nome."
    luogo: Ponti Sospesi, il Ponte delle Mille Corde
    tipo: carta
    area: ponti-sospesi
    requisiti: [rep.grifone < 2, conosci.liaren >= 1]
    testo: |
      Sul Ponte delle Mille Corde i mercanti smontano i banchi, e un
      venditore di castagne tiene il fornello sopra una lastra di pietra, per
      paura del legno.

      {origine mercante-dei-ponti} Il giorno del Festival vendevi castagne
      anche tu, e la lastra di pietra non ti era venuta in mente.

      Un ragazzino con un grembiule che gli arriva alle caviglie ti raggiunge
      di corsa. «Mi manda Brunella» dice, tutto di seguito. «Sono tre giorni
      che non ti vede. Stasera c'è lo stufato.» Poi aggiunge, più piano, che
      c'è anche una botte da portare su dal Mercato dei Nodi.
    opzioni:
      - testo: "Andare a mangiare lo stufato"
        descrizione: "Il ragazzino ti fa strada, e Brunella a quanto pare ti tiene una scodella in caldo."
        esito:
          titolo: La scodella tenuta in caldo
          testo: |
            Il ragazzino ti fa strada fino al Grifone camminando all'indietro, per
            controllare che tu lo segua. In cucina Brunella ti guarda dalla testa
            ai piedi, come si controlla una consegna, poi tira fuori dal forno una
            scodella coperta con un piatto. Mentre mangi non ti chiede niente, e
            solo quando ti ha riempito la scodella la seconda volta vuole sapere
            dove sei stato.
          effetti: { rep.grifone: 0.5 }
      - testo: "Portare su la botte dal Mercato dei Nodi"
        descrizione: "Una botte di sidro da portare per il ponte in salita, con un ragazzino davanti a gridare di fare largo."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Fate largo
          testo: |
            La botte pesa più del ragazzino e di te messi insieme. La fai rotolare
            lungo il ponte frenandola con il piede a ogni discesa, mentre il
            ragazzino corre davanti a gridare di fare largo con una voce più
            grande di lui. Al Grifone Brunella ti fa trovare lo stufato e qualche
            moneta sul bordo della scodella, e il ragazzino racconta a tutta la
            cucina che la botte l'avete portata insieme.
          effetti: { monete: 2, rep.grifone: 0.5 }
        fallimento:
          titolo: Il mulo spaventato
          testo: |
            Alla prima discesa del ponte la botte ti scappa di mano e rotola via,
            e per fermarla contro un parapetto ci vogliono tre Raschiatori e un
            mulo spaventato. Arriva al Grifone ammaccata ma intera, e tu con un
            palmo spellato. Brunella ti mette davanti lo stufato lo stesso, con
            una striscia di tela per la mano.
      - testo: "Mandarle a dire che stasera non puoi"
        descrizione: "Il ragazzino ha fatto tutta quella strada di corsa, e almeno una castagna se la merita."
        costo: 0
        esito:
          titolo: Una castagna calda
          testo: |
            Compri una castagna calda per il ragazzino e gli dici di riferire a
            Brunella che stasera non puoi. Lui ci pensa su con la castagna fra le
            mani e ti chiede se può dirle che hai mangiato, e tu gli dici di sì
            anche se non è vero. Riparte di corsa, e a metà ponte si gira a farti
            un cenno.
