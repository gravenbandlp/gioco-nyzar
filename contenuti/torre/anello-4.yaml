# Il campanile rovescio, anello 4: il battito, piani 31-40 (docs/piano-torre.md, blocco 4). Ci si scende dalla scala
# della canna (sblocco.yaml, con torre.anello >= 3) o dalla terza porta tonda sotto l'ultima campana (anello-3-fondo.yaml).
# La ritirata e la sconfitta riportano alla Superficie e azzerano la profondità.
# - area `torre-anello-4`: soglia 9, tre stanze visibili, `rimescola: torre.discese`, `piani: 30`; venti stanze ripetibili:
#   piani 31-33 (profondità 0-2): il pavimento che pulsa, le sentinelle, la porta che legge, le vene della canna, i
#     piani di sopra, la scala che respira, le lapidi dei Portatori;
#   piani 34-36 (profondità 3-5): il pulsante, la nicchia del battito lento (il ristoro, solo a profondità 4-5), il libro
#     di metallo, gli specchi neri, il ponte sul battito, le catene del fondo, le sentinelle al varco;
#   piani 37-39 (profondità 6-8, anello-4-fondo.yaml): la sala delle quattro Maschere, il battito che manca, la pagina
#     bianca, la luce del sigillo, il Lettore lontano, l'ultimo giro.
#   Qui pesano tutte le negative; ogni stanza ha una prova Difficile, una Molto difficile o un combattimento, e una via
#   senza prova da 2 o 3 rintocchi con una negativa. Nelle stanze solo PE.
# - il cuore a profondità 9, il quarantesimo piano (anello-4-fondo.yaml): il Lettore in tre fasi, poi il leggio con Il
#   Manto del Battito e il frammento del sigillo (una volta sola), PE e lyssan; torre.anello almeno 4; la prima volta il
#   sigillo del quarantunesimo piano (sblocco.yaml).
# Il Lettore è il guardiano che legge le Maschere ai sigilli; la prosa lo tratta come chi legge una pagina, e il giocatore
# è la pagina. Non lo si dice mai apertamente.
# Origini: accolito-del-velo (le lapidi), allievo-di-torvessa (il libro di metallo), rampollo-dei-quartieri-alti (gli
# specchi neri), figlio-della-citta-bassa (le catene), apprendista-raschiatore (il battito che manca), mercante-dei-ponti
# (la pagina bianca), figlio-del-circolo (la luce del sigillo), fuggiasco-di-ghoran (il Lettore lontano).
aree:
  - id: torre-anello-4
    immagine: ambientazione/mito-salvaguardia-precursori
    nome: Il battito
    sommario: "Dal trentunesimo al quarantesimo piano il campanile scende verso il battito che si sente dalla cima. Qui le pareti pulsano."
    spedizione: { ritorno: superficie-fratturata, soglia: 9, stanze: 3, rimescola: torre.discese, piani: 30 }
    testo: |
      Sotto il trentesimo piano la fonderia finisce, e la canna torna stretta e buia come in cima. Le pareti qui non sono
      più di pietra. Sono di un metallo grigio e liscio che si gonfia e si sgonfia piano, a ogni battito, come il fianco
      di un animale addormentato.

      Il battito che sentivi dalla Campana adesso lo senti nei piedi e nei denti. Viene da poco più sotto.

colonna:
  - { contesto: area, id: torre-anello-4, musica: a-hundred-deaths, ambiente: temple-quiet }

storylet:
  # ================================================================ piani 31-33 (profondità 0-2)
  # ------------------------------------------------------------ il pavimento che pulsa
  - id: torre-4-il-pavimento-che-pulsa
    immagine: icone/heart-organ
    titolo: Il pavimento che pulsa
    sommario: "Il pavimento del piano si solleva a ogni battito come un petto che respira, e ricade."
    luogo: Il campanile rovescio, il battito
    area: torre-anello-4
    ripetibile: true
    requisiti: [profondita.torre-anello-4 <= 2]
    testo: |
      Il pavimento di questo piano è dello stesso metallo grigio delle pareti, e a ogni battito si solleva di un palmo
      come un petto che respira. Poi ricade. Chi ci cammina sopra deve seguire il ritmo, altrimenti il pavimento lo
      lancia come una coperta scossa.

      La porta di sotto è a venti passi, e i battiti arrivano ogni tre.
    opzioni:
      - testo: "Camminare a tempo con il battito"
        descrizione: "Tre passi fra un battito e l'altro, e fermi quando il pavimento si alza. Bisogna sentirlo arrivare."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: A tempo
          testo: |
            Cammini tre passi alla volta e ti fermi a ginocchia piegate quando il pavimento si solleva, come su una barca.
            Arrivi alla porta con il battito nelle gambe, e lo senti ancora mentre scendi.
          pe: { acrobazia: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Fuori tempo
          testo: |
            Un passo cade sul battito, e il pavimento ti lancia in aria. Ricadi sul fianco e scivoli fino alla parete da cui
            eri partit{o|a}.
          effetti: { ferite: 1 }
      - testo: "Restare fermi finché il battito non rallenta"
        descrizione: "Ogni tanto il battito rallenta e si calma. Bisogna aspettarlo senza farsi prendere dalla fretta."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Il battito lento
          testo: |
            Resti ferm{o|a} sulla soglia finché il battito non rallenta e il pavimento si solleva appena. Attraversi il piano
            camminando, come una strada qualunque.
          pe: { resilienza: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: La fretta
          testo: |
            Il battito non rallenta, e a forza di aspettarlo ti entra in testa e ti fa battere il cuore allo stesso ritmo.
          effetti: { tormento: 1 }
      - testo: "Attraversare carponi"
        descrizione: "A quattro zampe il pavimento non ti lancia. Ti sbatte, a ogni battito, ma non ti lancia."
        costo: 2
        esito:
          titolo: A quattro zampe
          testo: |
            Attraversi il piano a quattro zampe, e a ogni battito il pavimento ti sbatte contro le ginocchia e le mani.
            Arrivi alla porta con i palmi rossi e il battito che ti è entrato nelle ossa.
          effetti: { profondita.torre-anello-4: 1, ferite: 0.5, tormento: 0.5 }

  # ------------------------------------------------------------ le sentinelle
  - id: torre-4-le-sentinelle
    immagine: icone/guarded-tower
    titolo: Le sentinelle
    sommario: "Due figure di metallo grigio stanno ai lati della porta. Sul volto hanno quattro incavi vuoti, e li girano verso di te."
    luogo: Il campanile rovescio, il battito
    area: torre-anello-4
    ripetibile: true
    requisiti: [profondita.torre-anello-4 <= 2]
    testo: |
      Ai lati della porta del piano stanno due figure di metallo grigio alte come uomini e magre come lance. Al posto
      della faccia hanno una piastra liscia con quattro incavi a forma di maschera, tutti vuoti. Quando ti avvicini girano
      la piastra verso di te, e i quattro incavi si muovono come occhi che cercano.

      {tecnologia Difficile} Sono forme minori della Salvaguardia, fatte per controllare chi passa. Cercano una Maschera
      negli incavi, e finché non la trovano non si muovono.
    opzioni:
      - testo: "Affrontare le sentinelle"
        descrizione: "Sono due sentinelle svelte con le braccia che finiscono in lame, e combattono con calma per tutto il tempo che serve."
        combattimento: torre-le-sentinelle
        vittoria:
          titolo: Le piastre spente
          testo: |
            La seconda sentinella cade in ginocchio e resta così, con la piastra rivolta verso la porta e gli incavi immobili.
            Passi fra le due figure senza che si muovano.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        sconfitta:
          titolo: Respint{o|a}
          testo: |
            Le lame delle sentinelle ti respingono su per la scala un gradino dopo l'altro, senza fretta, finché non sei
            fuori dal loro piano. Poi tornano ai lati della porta.
      - testo: "Passare mentre ti leggono"
        descrizione: "Finché cercano la Maschera negli incavi non si muovono. Bisogna passare in quel tempo, piano."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Fra le due piastre
          testo: |
            Passi fra le sentinelle mentre i loro incavi ti cercano ancora la Maschera addosso, un passo lento alla volta.
            Quando smettono di cercare sei già sulla scala di sotto.
          pe: { furtivita: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Trovat{o|a}
          testo: |
            Gli incavi smettono di cercare prima che tu sia passat{o|a}, e una lama ti sfiora il fianco.
          effetti: { ferite: 1 }
      - testo: "Mostrare loro una Maschera che non è la tua"
        descrizione: "Una faccia qualunque, tenuta davanti al viso come una maschera. Le sentinelle cercano una forma, non una persona."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Molto difficile }
        successo:
          titolo: Un'altra faccia
          testo: |
            Ti metti davanti al viso le mani aperte in modo che sembrino una maschera, e le sentinelle si fermano a guardarla.
            Gli incavi esitano a lungo, e poi le due figure si scostano dalla porta.
          pe: { ingannare: 5 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: La faccia vera
          testo: |
            Le sentinelle guardano oltre le tue mani, dritte nella tua faccia vera, e alzano le lame.
          effetti: { ferite: 1 }
      - testo: "Aspettare che una delle due si volti"
        descrizione: "Ogni tanto una sentinella si gira verso la porta, e intanto il battito martella."
        costo: 3
        esito:
          titolo: L'attesa sulla scala
          testo: |
            Aspetti sulla scala finché una sentinella non si gira verso la porta, e passi dal suo lato mentre l'altra ti cerca.
            Per tutto il tempo il battito ti ha martellato le tempie.
          effetti: { profondita.torre-anello-4: 1, tormento: 1 }

  # ------------------------------------------------------------ la porta che legge
  - id: torre-4-la-porta-che-legge
    immagine: icone/crystal-eye
    titolo: La porta che legge
    sommario: "Una porta piccola con un occhio di cristallo al centro. Quando ti guarda, senti di essere letto riga per riga."
    luogo: Il campanile rovescio, il battito
    area: torre-anello-4
    ripetibile: true
    requisiti: [profondita.torre-anello-4 <= 2]
    testo: |
      La porta di questo piano è piccola e rotonda, con un occhio di cristallo grande come un pugno al centro. Quando ti
      fermi davanti l'occhio si accende di azzurro e ti guarda, e senti il suo sguardo scorrere su di te dall'alto in
      basso, lento. Ti sembra di essere una pagina, e che qualcuno ti stia leggendo riga per riga.

      Dove lo sguardo si ferma, ti torna in mente una cosa che avevi dimenticato.
    opzioni:
      - testo: "Lasciarsi leggere senza voltarsi"
        descrizione: "Lo sguardo scorre, e i ricordi tornano. Bisogna restare fermi fino all'ultima riga."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Molto difficile }
        successo:
          titolo: L'ultima riga
          testo: |
            Resti ferm{o|a} mentre lo sguardo scorre, e i ricordi ti tornano uno dopo l'altro e se ne vanno. Quando arriva
            all'ultima riga l'occhio si spegne, e la porta si apre.
          pe: { resilienza: 5 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Un ricordo di troppo
          testo: |
            A metà lettura torna un ricordo che avevi dimenticato apposta, e ti volti per non vederlo. L'occhio ricomincia da
            capo.
          effetti: { tormento: 1.5 }
      - testo: "Coprire l'occhio e forzare la porta"
        descrizione: "Una mano sul cristallo e l'altra sul bordo della porta. Senza l'occhio, è una porta come le altre."
        prova: { attributo: fisico, abilita: [atletica, tecnologia], difficolta: Difficile }
        successo:
          titolo: L'occhio coperto
          testo: |
            Copri l'occhio con la giubba e trovi il bordo della porta con le dita, e la porta cede quando smette di vederti.
            Passi senza essere stat{o|a} lett{o|a}.
          pe: { atletica: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: L'occhio sotto la giubba
          testo: |
            L'occhio ti vede anche attraverso la giubba, e la porta ti respinge con un colpo che ti sale fino alla spalla.
          effetti: { ferite: 1 }
      - testo: "Leggere l'occhio a tua volta"
        descrizione: "Se ti legge, si può leggere anche lui. Basta guardarlo con la stessa attenzione."
        costo: 3
        esito:
          titolo: Due che leggono
          testo: |
            Guardi l'occhio fisso come lui guarda te, e per un lungo momento vi leggete a vicenda. Alla fine è lui ad abbassare
            lo sguardo, e la porta si apre. Ti resta in testa una frase che non è tua, scritta in una lingua che non conosci.
          effetti: { profondita.torre-anello-4: 1, tormento: 1 }

  # ------------------------------------------------------------ le vene della canna
  - id: torre-4-le-vene-della-canna
    immagine: icone/heart-organ
    titolo: Le vene della canna
    sommario: "Lungo le pareti corrono tubi trasparenti pieni di un liquido grigio che scende verso il fondo a ogni battito."
    luogo: Il campanile rovescio, il battito
    area: torre-anello-4
    ripetibile: true
    requisiti: [profondita.torre-anello-4 <= 2]
    testo: |
      Lungo le pareti del piano corrono tubi di vetro grossi come un braccio, pieni di un liquido grigio e denso che scende
      verso il fondo a ogni battito, a spinte. Alcuni tubi sono crepati, e dalle crepe il liquido cola sul pavimento in
      pozze che fumano. Il passaggio verso la scala è pieno di pozze.

      {natura Difficile} È Marea, densa come in nessun altro posto. Le vene la portano giù, verso quello che batte.
    opzioni:
      - testo: "Passare fra le pozze senza toccarle"
        descrizione: "Le pozze sono tante e il passaggio è stretto. Un piede fuori posto, e la Marea sale lungo lo stivale."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Difficile }
        successo:
          titolo: Fra le pozze
          testo: |
            Passi fra le pozze di Marea con i piedi sulle isole di pavimento asciutto, e il fumo grigio ti sale intorno senza
            toccarti. Arrivi alla scala con le gambe pulite.
          pe: { acrobazia: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Un piede nella pozza
          testo: |
            Un piede finisce in una pozza, e la Marea ti sale lungo lo stivale fino al ginocchio, fredda come acqua di pozzo.
          effetti: { contaminazione: 1 }
      - testo: "Chiudere le vene crepate"
        descrizione: "Le vene hanno delle valvole alla base. Chiuse quelle crepate, le pozze smettono di crescere."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Le valvole
          testo: |
            Trovi le valvole alla base dei tubi crepati e le chiudi una dopo l'altra, e il liquido smette di colare. Le pozze
            si asciugano in fretta, e attraversi su un pavimento che fuma appena.
          pe: { tecnologia: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: La valvola che salta
          testo: |
            Una valvola salta via sotto le dita, e il tubo ti spruzza addosso un getto di Marea grigia.
          effetti: { contaminazione: 1 }
      - testo: "Attraversare in fretta, nel fumo"
        descrizione: "Senza guardare dove metti i piedi. Il fumo grigio sale dalle pozze, e qualche pozza la prendi."
        costo: 3
        esito:
          titolo: Nel fumo grigio
          testo: |
            Attraversi il piano di corsa, e il fumo delle pozze ti avvolge le gambe e sale fino alla bocca. Arrivi alla scala
            con un sapore di ferro e le caviglie fredde.
          effetti: { profondita.torre-anello-4: 1, contaminazione: 1 }

  # ------------------------------------------------------------ i piani di sopra
  - id: torre-4-i-piani-di-sopra
    immagine: icone/semi-closed-eye
    titolo: I piani di sopra
    sommario: "La porta di questo piano dà sulla scala delle corde, sul decimo piano, sulla fonderia. Il campanile ti mostra da dove sei venut{o|a}."
    luogo: Il campanile rovescio, il battito
    area: torre-anello-4
    ripetibile: true
    requisiti: [profondita.torre-anello-4 <= 2]
    testo: |
      Apri la porta del piano e dall'altra parte c'è la scala delle corde, con le corde di metallo che vibrano nel vuoto.
      La richiudi e la riapri, e c'è la cassa dell'Uditore, muta. Ogni volta che la apri la porta dà su un piano che hai
      già passato, come se il campanile volesse farti tornare indietro.

      {percezione Difficile} Sotto la soglia c'è un filo di luce grigia che resta uguale a ogni apertura.
    opzioni:
      - testo: "Aprire la porta finché non dà sul piano giusto"
        descrizione: "Prima o poi si apre sul piano di sotto. Bisogna aprirla e chiuderla senza perdere la testa."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Il piano giusto
          testo: |
            Apri e chiudi la porta una decina di volte, guardando passare la fonderia e la rete della Tessitrice,
            finché non si apre su una scala che scende nel grigio. Ci passi prima che cambi idea.
          pe: { resilienza: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: La scala delle corde
          testo: |
            A un certo punto non sai più se la porta dà sulla scala delle corde o se sei tu a essere tornat{o|a} lì. Ti siedi a
            terra finché la testa non smette di girare.
          effetti: { tormento: 1.5 }
      - testo: "Seguire il filo di luce sotto la soglia"
        descrizione: "La luce grigia sotto la soglia non cambia mai. Forse viene dal piano vero."
        prova: { attributo: mentale, abilita: percezione, difficolta: Difficile }
        successo:
          titolo: La luce che non cambia
          testo: |
            Apri la porta tenendo gli occhi sul filo di luce sotto la soglia, e non su quello che c'è dall'altra parte. Passi
            seguendo la luce, e quando alzi lo sguardo sei sulla scala di sotto.
          pe: { percezione: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: La luce che inganna
          testo: |
            Segui la luce, e ti ritrovi sul pianerottolo della fonderia con il calore in faccia. Ci metti un pezzo a tornare.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Passare dalla porta qualunque cosa ci sia dall'altra parte"
        descrizione: "Se il campanile ti rimanda su, tocca riscendere a piedi, e le gambe pagano."
        costo: 3
        esito:
          titolo: Indietro e giù
          testo: |
            Passi dalla porta sulla scala delle corde e riscendi, un giro dopo l'altro, finché la scala delle corde non diventa
            il grigio del battito senza che tu capisca quando. Arrivi al piano di sotto con le gambe che non ti reggono.
          effetti: { profondita.torre-anello-4: 1, ferite: 0.5, tormento: 0.5 }

  # ------------------------------------------------------------ la scala che respira
  - id: torre-4-la-scala-che-respira
    immagine: icone/stairs
    titolo: La scala che respira
    sommario: "I gradini di questo giro si allargano e si stringono a ogni battito, come costole."
    luogo: Il campanile rovescio, il battito
    area: torre-anello-4
    ripetibile: true
    requisiti: [profondita.torre-anello-4 <= 2]
    testo: |
      Per un giro intero i gradini sono fatti dello stesso metallo grigio delle pareti, e a ogni battito si allargano e si
      stringono come costole. Quando si stringono fra uno e l'altro si apre una fessura sul vuoto della canna, larga
      quanto un piede, che si chiude con uno schiocco appena i gradini tornano larghi.
    opzioni:
      - testo: "Scendere sui gradini quando sono larghi"
        descrizione: "Un gradino a ogni battito, quando le costole sono aperte. Fuori tempo, il piede finisce nella fessura."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Sulle costole
          testo: |
            Scendi un gradino a ogni battito, quando le costole si allargano, e il piede trova sempre il metallo. In fondo al
            giro senti la scala che continua a respirare alle tue spalle.
          pe: { acrobazia: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Il piede nella fessura
          testo: |
            Un piede finisce nella fessura quando si chiude, e lo schiocco ti stringe la caviglia come una tagliola.
          effetti: { ferite: 1.5 }
      - testo: "Bloccare le costole con una sbarra"
        descrizione: "Una sbarra di ferro fra due gradini, e la scala non si stringe più. Il metallo grigio è forte."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Molto difficile }
        successo:
          titolo: La sbarra fra le costole
          testo: |
            Infili una sbarra fra due gradini quando si allargano, e la scala si ferma aperta con un gemito di metallo.
            Scendi il giro intero mentre la sbarra si piega piano.
          pe: { tecnologia: 5 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: La sbarra piegata
          testo: |
            La scala piega la sbarra al primo battito, e un pezzo ti schizza contro lo stinco.
          effetti: { ferite: 1 }
      - testo: "Scendere lungo la parete, accanto ai gradini"
        descrizione: "Aggrappati alla parete che pulsa, con i piedi sul bordo dei gradini. Lento, e la parete è tiepida."
        costo: 3
        esito:
          titolo: La parete tiepida
          testo: |
            Scendi aggrappat{o|a} alla parete grigia, che a ogni battito ti spinge le mani come un petto, con i piedi sul bordo
            dei gradini. Arrivi in fondo con le dita che pulsano anche loro.
          effetti: { profondita.torre-anello-4: 1, tormento: 0.5, contaminazione: 0.5 }

  # ------------------------------------------------------------ le lapidi dei Portatori
  - id: torre-4-le-lapidi-dei-portatori
    immagine: icone/tied-scroll
    titolo: Le lapidi dei Portatori
    sommario: "Lungo la parete ci sono lapidi di metallo con incisi dei segni a forma di maschera. Sono di chi è arrivato fin qui prima di te."
    luogo: Il campanile rovescio, il battito
    area: torre-anello-4
    ripetibile: true
    requisiti: [profondita.torre-anello-4 <= 2]
    testo: |
      Lungo la parete della scala sono infisse delle lapidi di metallo in colonna, e su ogni lapide è inciso un segno
      a forma di maschera e una riga di scrittura dei Precursori. Sono tante, più di quante ne riesci a contare, e le più in
      basso hanno segni che non somigliano a nessuna delle quattro Maschere che conosci. L'ultima lapide è liscia, e aspetta.

      {origine accolito-del-velo} In Cripta ci sono tre nicchie per i Tre Portatori. Qui le nicchie sono molte di più, e
      nessuno in Cattedrale lo sa.
    opzioni:
      - testo: "Leggere le lapidi"
        descrizione: "Scrittura dei Precursori, riga dopo riga. Forse dicono come sono arrivati fin qui, e come sono andati oltre."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Molto difficile }
        successo:
          titolo: Quelli di prima
          testo: |
            Leggi le righe una per una, e capisci che ognuna dice soltanto un piano, il più basso a cui quella Maschera è
            arrivata. Nessuna dice più di quaranta. Scendi con la sensazione di avere una lapide che ti aspetta.
          pe: { accademiche: 5 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Righe senza senso
          testo: |
            Le righe non ti dicono niente, e più le guardi più ti sembra che parlino di te.
          effetti: { tormento: 1 }
      - testo: "Rendere omaggio come in Cripta"
        descrizione: "In Cripta davanti ai Tre Portatori si tocca la pietra e si dice il proprio nome. Forse qui è lo stesso."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Media }
        successo:
          titolo: Il proprio nome
          testo: |
            Tocchi le lapidi una dopo l'altra mentre scendi e dici il tuo nome a ognuna, come in Cripta. Quando arrivi
            all'ultima, quella liscia, il metallo è tiepido sotto le dita.
          pe: { empatia: 5 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Il nome che non esce
          testo: |
            Davanti all'ultima lapide il nome non ti esce, e resti lì con la mano sul metallo freddo finché non riesci a muoverti.
          effetti: { tormento: 0.5 }
      - testo: "Scendere senza guardarle"
        descrizione: "Sono tante, e parlano di gente che non c'è più. Lo sguardo sui gradini."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Lo sguardo basso
          testo: |
            Scendi con lo sguardo sui gradini, e le lapidi ti scorrono accanto come le pietre di un muro qualunque. Solo
            all'ultima ti volti senza volerlo, e la trovi ancora liscia.
          pe: { resilienza: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Lo sguardo che si alza
          testo: |
            A metà alzi lo sguardo su una lapide con un segno che somiglia alla tua Maschera, e resti a fissarla finché la
            testa non ti fa male.
          effetti: { tormento: 1 }
      - testo: "Scendere di corsa davanti alle lapidi"
        descrizione: "Senza leggerle e senza contarle. Le gambe vanno, e la testa resta indietro."
        costo: 2
        esito:
          titolo: Di corsa
          testo: |
            Scendi di corsa, e le lapidi ti passano accanto come la folla di un mercato. Arrivi in fondo con il fiato corto e
            l'impressione che qualcuno, alle tue spalle, abbia appena inciso un segno nuovo.
          effetti: { profondita.torre-anello-4: 1, tormento: 1 }

  # ================================================================ piani 34-36 (profondità 3-5)
  # ------------------------------------------------------------ il pulsante
  - id: torre-4-il-pulsante
    immagine: icone/heart-organ
    titolo: Il pulsante
    sommario: "Una massa di Marea grande come un toro si gonfia a ogni battito, e a ogni battito colpisce."
    luogo: Il campanile rovescio, il battito
    area: torre-anello-4
    ripetibile: true
    requisiti: [profondita.torre-anello-4 >= 3, profondita.torre-anello-4 <= 5]
    testo: |
      In mezzo al piano c'è una massa di Marea Grigia grande come un toro, senza forma fissa, che a ogni battito si gonfia
      del doppio e poi si sgonfia. Quando si gonfia allunga due braccia fino alle pareti, e tutto quello che trova lo
      schiaccia. Fra un battito e l'altro resta raccolta come un cane che dorme.

      {percezione Difficile} Si gonfia sempre allo stesso ritmo del pavimento. Fra un battito e l'altro è lenta.
    opzioni:
      - testo: "Affrontare il pulsante"
        descrizione: "Una massa di Marea che colpisce a ogni battito. Fra un battito e l'altro è lenta, e lì si colpisce."
        combattimento: torre-il-pulsante
        vittoria:
          titolo: Il battito spento
          testo: |
            L'ultimo colpo arriva fra due battiti, e la massa grigia non si gonfia più. Si sfa sul pavimento come neve sporca
            al sole, e passi in mezzo alla pozza che resta.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        sconfitta:
          titolo: Schiacciat{o|a}
          testo: |
            La massa si gonfia proprio quando le sei sopra, e ti schiaccia contro il pavimento. Ti trascini su per la scala con
            la Marea che ti cola dai vestiti.
      - testo: "Passare fra un battito e l'altro"
        descrizione: "Quando la massa è raccolta, il piano è libero. Bisogna partire appena si sgonfia."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Fra due battiti
          testo: |
            Parti appena la massa si sgonfia e sei alla porta quando torna a gonfiarsi. Le sue braccia sbattono contro lo
            stipite alle tue spalle.
          pe: { atletica: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Il battito in anticipo
          testo: |
            La massa si gonfia in anticipo, e un braccio grigio ti prende di striscio e ti lascia addosso una scia fredda.
          effetti: { ferite: 0.5, contaminazione: 1 }
      - testo: "Reggere il colpo e camminare"
        descrizione: "Il colpo arriva comunque. Con le gambe salde e la testa bassa, si cammina anche sotto."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Molto difficile }
        successo:
          titolo: Sotto il colpo
          testo: |
            Cammini dritto verso la porta, e quando la massa si gonfia e ti colpisce pianti i piedi e lasci che il colpo ti
            passi addosso. Arrivi alla porta con le costole che fanno male e le gambe ancora tue.
          pe: { resistenza: 5 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Il colpo pieno
          testo: |
            Il colpo ti prende in pieno e ti butta contro la parete, e la Marea ti si attacca addosso.
          effetti: { ferite: 1, contaminazione: 1 }
      - testo: "Passare rasente le pareti mentre si gonfia"
        descrizione: "Le braccia arrivano alle pareti, ma con meno forza. Rasente il muro, e la Marea che ti tocca."
        costo: 3
        esito:
          titolo: Rasente il muro
          testo: |
            Giri tutto il piano rasente alla parete, e a ogni battito le braccia grigie ti arrivano addosso deboli e fredde.
            Arrivi alla porta con la giubba bagnata di Marea.
          effetti: { profondita.torre-anello-4: 1, contaminazione: 1 }

  # ------------------------------------------------------------ la nicchia del battito lento (il ristoro)
  - id: torre-4-la-nicchia-del-battito-lento
    immagine: icone/mineral-heart
    titolo: La nicchia del battito lento
    sommario: "In una nicchia della scala il battito arriva lento e lontano, e accanto alla panca c'è una conca d'acqua."
    luogo: Il campanile rovescio, il battito
    area: torre-anello-4
    ripetibile: true
    requisiti: [profondita.torre-anello-4 >= 4, profondita.torre-anello-4 <= 5]
    testo: |
      In una nicchia della scala il metallo delle pareti torna pietra, e il battito arriva lento e lontano, come quello di
      qualcuno che dorme nella stanza accanto. C'è una panca di pietra con accanto una conca d'acqua limpida.
      Sulla panca qualcuno ha inciso la sagoma di una maschera, e sotto un segno solo.
    opzioni:
      - testo: "Fasciarsi le ferite"
        descrizione: "Un'ora sulla panca, con l'acqua limpida sulle ferite. Il tempo si paga."
        costo: 3
        esito:
          titolo: Le ferite fasciate
          testo: |
            Ti lavi le ferite con l'acqua della conca e le fasci con calma, sedut{o|a} sulla panca nel battito lento. Quando ti
            alzi le gambe ti reggono come non facevano da molti piani.
          effetti: { profondita.torre-anello-4: 1, ferite: -1.5 }
      - testo: "Dormire un'ora nel battito lento"
        descrizione: "La testa ha bisogno di sonno quanto il corpo. Qui il battito culla."
        costo: 3
        esito:
          titolo: Il sonno breve
          testo: |
            Ti stendi sulla panca e il battito lento ti addormenta in un momento. Sogni la Campana muta, e quando ti svegli le
            voci che ti erano rimaste in testa se ne sono andate.
          effetti: { profondita.torre-anello-4: 1, tormento: -1.5 }
      - testo: "Lavarsi la Marea di dosso"
        descrizione: "L'acqua della conca è limpida, l'unica cosa limpida da molti piani. Porta via un po' di grigio."
        costo: 3
        esito:
          titolo: L'acqua limpida
          testo: |
            Ti lavi le mani e la faccia nella conca, e l'acqua si fa grigia e torna limpida, come se la pietra la pulisse da
            sola. Ti senti più legger{o|a} di quando sei entrat{o|a}.
          effetti: { profondita.torre-anello-4: 1, contaminazione: -1 }
      - testo: "Bere e ripartire subito"
        descrizione: "Un sorso d'acqua e la scala. Il battito lento invita a restare, e il fondo è vicino."
        costo: 1
        esito:
          titolo: Un sorso
          testo: |
            Bevi dalla conca con le mani a coppa e riparti prima che il battito lento ti convinca a stenderti.
          effetti: { profondita.torre-anello-4: 1 }

  # ------------------------------------------------------------ il libro di metallo
  - id: torre-4-il-libro-di-metallo
    immagine: icone/open-book
    titolo: Il libro di metallo
    sommario: "Su un leggio enorme c'è un libro di metallo aperto, e le pagine girano da sole. In una pagina c'è il tuo nome."
    luogo: Il campanile rovescio, il battito
    area: torre-anello-4
    ripetibile: true
    requisiti: [profondita.torre-anello-4 >= 3, profondita.torre-anello-4 <= 5]
    testo: |
      In mezzo al piano c'è un leggio alto come un uomo, e sul leggio un libro di metallo aperto, con le pagine sottili come
      foglie di stagno. Le pagine girano da sole, una a ogni battito, e su ognuna c'è scritto qualcosa in una scrittura che
      cambia mentre la guardi. Su una pagina, per un momento, leggi il tuo nome.

      La porta di sotto si apre soltanto quando il libro arriva a una certa pagina.

      {origine allievo-di-torvessa} Nella biblioteca dell'Accademia c'è un libro che nessuno può prendere in prestito,
      perché legge chi lo apre. Il bibliotecario dice che è una leggenda, e tiene la chiave al collo.
    opzioni:
      - testo: "Trovare la pagina che apre la porta"
        descrizione: "Le pagine girano a ogni battito. Bisogna capire quale apre la porta, e fermare il libro lì."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Molto difficile }
        successo:
          titolo: La pagina giusta
          testo: |
            Guardi le pagine girare finché non riconosci il disegno di una porta tonda in un angolo, e quando torna appoggi la
            mano sul libro. Il libro si ferma, e la porta di sotto si apre.
          pe: { accademiche: 5 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: La pagina con il tuo nome
          testo: |
            Fermi il libro sulla pagina sbagliata, quella con il tuo nome, e per un momento ti sembra che sia il libro a leggere
            te. Ritiri la mano.
          effetti: { tormento: 1.5 }
      - testo: "Chiudere il libro"
        descrizione: "Un libro chiuso non gira le pagine. Bisogna chiuderlo, e tenerlo chiuso."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: Il libro chiuso
          testo: |
            Chiudi il libro con tutte e due le mani, e il metallo resiste come se qualcuno dall'altra parte stesse ancora
            leggendo. Quando si chiude la porta di sotto si apre, e il battito sembra più lontano.
          pe: { atletica: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Il libro che si riapre
          testo: |
            Il libro si riapre di colpo e le pagine di metallo ti tagliano le dita.
          effetti: { ferite: 1 }
      - testo: "Tenere il libro chiuso come quello della biblioteca"
        descrizione: "Il libro che legge chi lo apre si tiene chiuso con un dito sul taglio, senza guardarlo. Così diceva il bibliotecario."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Un dito sul taglio
          testo: |
            Chiudi il libro senza guardarlo e ci tieni un dito sul taglio, come diceva il bibliotecario, e le pagine smettono
            di girare. La porta si apre, e tu la passi con gli occhi chiusi.
          pe: { resilienza: 5 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Lo sguardo
          testo: |
            Un momento prima di chiuderlo guardi la pagina, e la pagina guarda te.
          effetti: { tormento: 1 }
      - testo: "Aspettare che il libro arrivi da solo alla pagina giusta"
        descrizione: "Prima o poi ci arriva. Le pagine sono tante, e su ognuna potrebbe esserci il tuo nome."
        costo: 3
        esito:
          titolo: Le pagine che girano
          testo: |
            Aspetti davanti al leggio mentre le pagine girano, e su molte leggi il tuo nome scritto in modi diversi. Quando la
            porta finalmente si apre, scendi con la sensazione di essere stat{o|a} lett{o|a} da cima a fondo.
          effetti: { profondita.torre-anello-4: 1, tormento: 1 }

  # ------------------------------------------------------------ gli specchi neri
  - id: torre-4-gli-specchi-neri
    immagine: icone/mirror-mirror
    titolo: Gli specchi neri
    sommario: "Le pareti del piano sono specchi neri. Ci vedi te stess{o|a}, com'eri la prima volta che sei sces{o|a} nella canna."
    luogo: Il campanile rovescio, il battito
    area: torre-anello-4
    ripetibile: true
    requisiti: [profondita.torre-anello-4 >= 3, profondita.torre-anello-4 <= 5]
    testo: |
      Le pareti del piano sono coperte di specchi di vetro nero, e in ogni specchio ci sei tu. Però non sei come adesso.
      Sei come la prima volta che hai messo piede sulla scala della canna, senza le ferite di questi piani e con gli occhi
      di chi non sa ancora cosa c'è sotto. Il tuo riflesso ti guarda, e scuote la testa.

      {origine rampollo-dei-quartieri-alti} Nei salotti dei Quartieri Alti gli specchi neri si usano per vedersi come ti
      vedono gli altri, senza i colori. Nessuno li tiene a lungo in casa.
    opzioni:
      - testo: "Guardare il proprio riflesso fino in fondo"
        descrizione: "Il riflesso è com'eri. Bisogna guardarlo senza voler tornare indietro."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Com'eri
          testo: |
            Guardi il riflesso fino in fondo, e alla fine è lui ad abbassare gli occhi. Gli specchi si spengono uno dopo
            l'altro, e la porta di sotto resta l'unica cosa illuminata.
          pe: { resilienza: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: La voglia di tornare
          testo: |
            Il riflesso ti fa venire voglia di risalire tutto e tornare com'eri, e resti davanti allo specchio finché la voglia
            non passa. Passa lentamente.
          effetti: { tormento: 1.5 }
      - testo: "Rompere gli specchi"
        descrizione: "Vetro nero, sottile. Si rompe, e i pezzi tagliano."
        prova: { attributo: fisico, abilita: [rissa, armi-da-mischia], difficolta: Difficile }
        successo:
          titolo: I pezzi neri
          testo: |
            Rompi gli specchi uno dopo l'altro, e il tuo riflesso si spezza in mille pezzi neri che cadono a terra senza rumore.
            Passi sopra i pezzi fino alla porta.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Il riflesso nei pezzi
          testo: |
            Ogni pezzo che cade mostra ancora il tuo riflesso, e i pezzi ti tagliano le mani.
          effetti: { ferite: 1, tormento: 0.5 }
      - testo: "Guardare gli specchi come in salotto"
        descrizione: "Lo specchio nero mostra come ti vedono gli altri. In salotto si guarda di sbieco, per non restarci."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, resilienza], difficolta: Media }
        successo:
          titolo: Di sbieco
          testo: |
            Guardi gli specchi di sbieco, come ti hanno insegnato da bambin{o|a}, e il riflesso non riesce a prenderti gli occhi.
            Attraversi il piano come un salotto pieno di gente che non ti interessa.
          pe: { galateo: 5 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Lo sguardo dritto
          testo: |
            Un riflesso ti prende lo sguardo dritto, e ti vedi come ti vedevano a casa.
          effetti: { tormento: 1 }
      - testo: "Attraversare con gli occhi chiusi"
        descrizione: "Senza guardare, con una mano sulla parete. Gli specchi ci saranno lo stesso."
        costo: 3
        esito:
          titolo: Gli occhi chiusi
          testo: |
            Attraversi il piano con gli occhi chiusi e una mano sullo specchio freddo, e senti il tuo riflesso camminarti accanto
            dall'altra parte del vetro. Quando apri gli occhi alla porta, ti sembra che ti abbia salutato.
          effetti: { profondita.torre-anello-4: 1, tormento: 1 }

  # ------------------------------------------------------------ il ponte sul battito
  - id: torre-4-il-ponte-sul-battito
    immagine: icone/rope-bridge
    titolo: Il ponte sul battito
    sommario: "Un ponte di metallo attraversa la canna sopra un pozzo da cui sale, a ogni battito, una folata d'aria calda."
    luogo: Il campanile rovescio, il battito
    area: torre-anello-4
    ripetibile: true
    requisiti: [profondita.torre-anello-4 >= 3, profondita.torre-anello-4 <= 5]
    testo: |
      Qui la scala attraversa la canna su un ponte di metallo grigio senza parapetto. Sotto il ponte la canna
      scende dritta nel buio, e dal buio sale a ogni battito una folata d'aria calda che solleva la polvere e ti spinge verso
      l'alto. Le folate sono così forti che il ponte vibra.
    opzioni:
      - testo: "Attraversare il ponte fra una folata e l'altra"
        descrizione: "Le folate arrivano con il battito. Fra l'una e l'altra il ponte sta fermo."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Fra due folate
          testo: |
            Attraversi il ponte a scatti, fermandoti piegat{o|a} sulle ginocchia a ogni folata e ripartendo appena passa. Arrivi
            dall'altra parte con la polvere negli occhi.
          pe: { atletica: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: La folata
          testo: |
            Una folata ti prende in piedi e ti spinge fuori dal ponte, e ti salvi aggrappandoti al bordo con le dita.
          effetti: { ferite: 1, tormento: 0.5 }
      - testo: "Attraversare sdraiat{o|a} sul ponte"
        descrizione: "Pancia a terra, la folata passa sopra. È lento, e il metallo vibra sotto la faccia."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Difficile }
        successo:
          titolo: Pancia a terra
          testo: |
            Attraversi il ponte strisciando, con le mani aggrappate ai bordi, e le folate ti passano sopra la schiena. Arrivi con
            il battito che ti è entrato nelle ossa della faccia.
          pe: { resistenza: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Il ponte che vibra
          testo: |
            A metà il ponte vibra così forte che le mani si staccano dai bordi, e una folata ti fa scivolare indietro.
          effetti: { ferite: 1 }
      - testo: "Aspettare che il battito rallenti e correre"
        descrizione: "Ogni tanto il battito rallenta. Allora le folate sono deboli, e il ponte si attraversa di corsa."
        costo: 3
        esito:
          titolo: La corsa sul ponte
          testo: |
            Aspetti all'inizio del ponte che il battito rallenti, e lo attraversi di corsa. L'ultima folata ti spinge
            nella schiena e ti butta lungo sul pavimento dall'altra parte.
          effetti: { profondita.torre-anello-4: 1, ferite: 0.5, tormento: 0.5 }

  # ------------------------------------------------------------ le catene del fondo
  - id: torre-4-le-catene-del-fondo
    immagine: icone/crossed-chains
    titolo: Le catene del fondo
    sommario: "Catene grosse come tronchi scendono dalle pareti verso il fondo, tese, come per tenere fermo qualcosa che batte."
    luogo: Il campanile rovescio, il battito
    area: torre-anello-4
    ripetibile: true
    requisiti: [profondita.torre-anello-4 >= 3, profondita.torre-anello-4 <= 5]
    testo: |
      Dalle pareti del piano partono catene grosse come tronchi, tese verso il fondo della canna, e a ogni battito si
      tendono di più e scricchiolano. La scala passa in mezzo a loro. Una catena si è spezzata e pende sul pianerottolo,
      e il pezzo che pende dondola a ogni battito come un pendolo.

      {origine figlio-della-citta-bassa} Alle cave della Città Bassa una catena che scricchiola così vuol dire che sotto
      c'è un carico che non dovrebbe esserci, e chi la sente si allontana.
    opzioni:
      - testo: "Passare sotto la catena che dondola"
        descrizione: "Il pezzo spezzato dondola a ogni battito. Bisogna passare quando è lontano."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Sotto il pendolo
          testo: |
            Passi sotto la catena quando dondola lontano, e sei già sulla scala quando torna indietro e sbatte contro il
            pianerottolo dove eri.
          pe: { acrobazia: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Il pendolo
          testo: |
            La catena torna prima di quanto pensassi e ti prende sulla spalla, e ti butta contro una catena tesa.
          effetti: { ferite: 1.5 }
      - testo: "Fermare la catena spezzata"
        descrizione: "Il pezzo che pende ha un gancio. Agganciato a una catena tesa, smette di dondolare."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il gancio
          testo: |
            Afferri il gancio quando la catena ti passa accanto e lo agganci a una catena tesa, e il pezzo spezzato si ferma
            con uno strappo. Passi sotto le catene immobili.
          pe: { tecnologia: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Il gancio che scivola
          testo: |
            Il gancio scivola, e la catena ti trascina con sé per due passi prima che tu riesca a mollarla.
          effetti: { ferite: 1 }
      - testo: "Leggere le catene come alle cave"
        descrizione: "Alle cave le catene si ascoltano, e si capisce quale cederà per prima. Quella da cui stare lontani."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La catena che cederà
          testo: |
            Ascolti le catene come alle cave, e senti quale scricchiola più delle altre. Passi dalla parte opposta, e la catena
            che avevi sentito cede un momento dopo, lontano da te.
          pe: { percezione: 5 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: La catena sbagliata
          testo: |
            Scegli la catena sbagliata da cui stare lontano, e quella giusta ti frusta l'aria accanto all'orecchio.
          effetti: { tormento: 0.5, ferite: 0.5 }
      - testo: "Arrampicarsi sulle catene tese"
        descrizione: "Sulle catene tese, fino alla scala di sotto. Scricchiolano, e a ogni battito si tendono."
        costo: 3
        esito:
          titolo: Sulle catene
          testo: |
            Scendi lungo una catena tesa come lungo un tronco inclinato, e a ogni battito la catena si tende sotto di te e ti
            scuote. Arrivi alla scala con le braccia che tremano.
          effetti: { profondita.torre-anello-4: 1, ferite: 1 }

  # ------------------------------------------------------------ le sentinelle al varco
  - id: torre-4-le-sentinelle-al-varco
    immagine: icone/guarded-tower
    titolo: Le sentinelle al varco
    sommario: "Il varco verso la scala è chiuso da due sentinelle con la piastra rivolta verso il basso, come in preghiera."
    luogo: Il campanile rovescio, il battito
    area: torre-anello-4
    ripetibile: true
    requisiti: [profondita.torre-anello-4 >= 3, profondita.torre-anello-4 <= 5]
    testo: |
      Il varco verso la scala di sotto è stretto, e lo chiudono due sentinelle con la piastra del volto rivolta verso il
      basso, come in preghiera. Sono immobili. Quando ti avvicini alzano la piastra insieme, e i quattro incavi vuoti si
      girano verso la tua Maschera.

      {percezione Difficile} Una delle due ha un incavo crepato, e da quella parte vede peggio.
    opzioni:
      - testo: "Affrontare le sentinelle"
        descrizione: "Due sentinelle nel varco stretto, ferme al loro posto per tutto lo scontro."
        combattimento: torre-le-sentinelle
        vittoria:
          titolo: Il varco libero
          testo: |
            Le due sentinelle cadono una sull'altra nel varco, con le piastre spente, e le scavalchi per scendere.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        sconfitta:
          titolo: Fuori dal varco
          testo: |
            Le lame delle sentinelle ti respingono fuori dal varco, e le due figure tornano in preghiera come se non fossi mai
            arrivat{o|a}.
      - testo: "Passare dal lato dell'incavo crepato"
        descrizione: "Da quella parte la sentinella vede peggio. Basta restare in quel lato, e piano."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Molto difficile }
        successo:
          titolo: Il lato cieco
          testo: |
            Passi rasente alla sentinella con l'incavo crepato, dal suo lato cieco, e i suoi incavi ti cercano dall'altra parte.
            Sei sulla scala prima che si accorga di essersi sbagliata.
          pe: { furtivita: 5 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: L'altra sentinella
          testo: |
            La sentinella con l'incavo crepato ti perde, e l'altra ti apre la manica con la lama.
          effetti: { ferite: 1 }
      - testo: "Restare immobili finché non tornano in preghiera"
        descrizione: "Se la Maschera resta ferma, forse la scambiano per una delle lapidi. Ferma come pietra."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Ferm{o|a} come pietra
          testo: |
            Resti immobile davanti al varco finché le sentinelle non abbassano la piastra e tornano in preghiera. Passi fra loro
            senza che alzino la testa.
          pe: { resilienza: 3 }
          effetti: { profondita.torre-anello-4: 1 }
        fallimento:
          titolo: Il tremito
          testo: |
            Dopo un lungo momento le gambe ti tremano, e le sentinelle alzano la piastra insieme.
          effetti: { tormento: 1 }
      - testo: "Forzare il passaggio di corsa"
        descrizione: "Fra le due lame, prima che si alzino del tutto. Qualcosa ti prenderanno."
        costo: 3
        esito:
          titolo: Fra le lame
          testo: |
            Ti butti nel varco di corsa mentre le sentinelle alzano la piastra, e le lame ti prendono di striscio sulle braccia.
            Sei sulla scala prima che si girino del tutto.
          effetti: { profondita.torre-anello-4: 1, ferite: 1 }
