# Il campanile rovescio, anello 2: le casse di risonanza, piani 11-20 (docs/piano-torre.md, blocco 2). Ci si scende
# dalla scala della canna (sblocco.yaml, con torre.anello >= 1) o dalla porta tonda sotto il fuso della Tessitrice
# (anello-1-fondo.yaml). La ritirata e la sconfitta riportano alla Superficie e azzerano la profondità.
# - area `torre-anello-2`: soglia 18, tre stanze visibili, `rimescola: torre.discese`, `piani: 10`, due stanze per
#   piano; ventinove stanze ripetibili:
#   piani 11-13 (profondità 0-5): la prima cassa, la porta che canta, gli orecchianti, il pozzo dell'eco, la galleria
#     delle conchiglie, il pavimento di timpani, la stanza sorda, la cassa allagata, le mute degli orecchianti (gli
#     orecchianti), il punto d'ascolto;
#   piani 14-16 (profondità 6-11): il risonatore, le voci dei suonatori, la nicchia del silenzio (il ristoro, solo a
#     profondità 8-11), la cassa crepata, le canne di vetro, il battaglio del tempo, gli orecchianti al buio,
#     lo sfiato, la sala dei diapason (il risonatore), la parete dei registri;
#   piani 17-19 (profondità 12-17, anello-2-fondo.yaml): la sala delle quattro voci (le Maschere), il nome ripetuto, il
#     timpano grande, le orecchie nel muro, il silenzio che pesa, la conca del battito, la gola della canna, le sacche
#     di suono, la cassa schiacciata.
#   La pressione dell'anello è il Tormento; ogni stanza ha una prova Difficile, una Molto difficile o un combattimento, e
#   una via senza prova da 2 o 3 rintocchi con una negativa. Nelle stanze solo PE.
# - il cuore a profondità 18, il ventesimo piano (anello-2-fondo.yaml): l'Uditore in due fasi, poi la cassa con La Cassa
#   Armonica (una volta sola), PE e lyssan; torre.anello almeno 2.
# Origini: accolito-del-velo (la porta che canta), mercante-dei-ponti (le conchiglie), apprendista-raschiatore (la
# stanza sorda), fuggiasco-di-ghoran (le voci), rampollo-dei-quartieri-alti (le canne di vetro), figlio-della-citta-bassa
# (il battaglio), allievo-di-torvessa (il nome ripetuto), figlio-del-circolo (il timpano grande).
aree:
  - id: torre-anello-2
    immagine: ambientazione/mito-salvaguardia-precursori
    nome: Le casse di risonanza
    sommario: "Dall'undicesimo al ventesimo piano il campanile si allarga in sale di metallo dove ogni suono rimbalza e torna più forte."
    spedizione: { ritorno: superficie-fratturata, soglia: 18, stanze: 3, rimescola: torre.discese, piani: 10, stanzePerPiano: 2, usura: true }
    testo: |
      Sotto il decimo piano la canna si allarga, e la scala scende attraverso sale rotonde di metallo nero,
      una sotto l'altra, come le casse di un organo rovesciato. Le pareti sono fatte di lastre curve che
      combaciano senza chiodi e senza saldature, e la giuntura fra una lastra e l'altra la trovi solo
      passandoci sopra l'unghia. Qui ogni suono rimbalza sulle pareti e torna indietro più forte di come è
      partito, e anche il tuo respiro ti arriva alle orecchie da tutte le parti.

      Il battito che sale dal fondo, nelle casse, diventa un rombo che senti nelle ossa del petto. Dopo
      qualche piano ti accorgi che il tuo cuore ha preso a battere al suo tempo.

colonna:
  - { contesto: area, id: torre-anello-2, musica: chapel-of-nyx, ambiente: temple-mystical }

storylet:
  # ================================================================ piani 11-13 (profondità 0-5)
  # ------------------------------------------------------------ la prima cassa
  - id: torre-2-la-prima-cassa
    immagine: icone/ringing-bell
    titolo: La prima cassa
    sommario: "Una sala rotonda di metallo dove ogni passo torna indietro dieci volte, più forte."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 <= 5]
    testo: |
      La scala entra in una sala rotonda con le pareti di metallo nero, curve come l'interno di una campana.
      Il metallo è battuto in lastre sottili senza una giuntura, e sotto le dita è freddo e un poco umido. Al
      primo passo il rumore dello stivale torna indietro dieci volte, sempre più forte, finché non riempie la
      sala. Le ultime ripetizioni arrivano da sotto il pavimento. Quando finalmente si spengono ti accorgi di
      aver trattenuto le spalle alte.

      La porta dall'altra parte è lontana trenta passi, e ognuno farà lo stesso rumore.
    opzioni:
      - testo: "Camminare senza rumore"
        descrizione: "Sulle punte, con il peso che si posa piano. Nella cassa anche il fruscio della giubba rimbomba."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Trenta passi muti
          testo: |
            Attraversi la sala sulle punte, un passo lento dopo l'altro, e la cassa ti restituisce soltanto un
            fruscio lontano. Il metallo sotto le suole cede appena a ogni passo, come la pelle di un tamburo.
            Alla porta ti accorgi che stavi contando i passi a fior di labbra.
          pe: { furtivita: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Il rimbombo
          testo: |
            Un tacco scivola sul metallo e il colpo torna indietro come una cannonata, dieci volte. Fra un'eco
            e l'altra senti un colpo più leggero del tuo, che viene da sotto il pavimento. Ti ritrovi in
            ginocchio con le mani sulle orecchie, e la porta è ancora lontana.
          effetti: { tormento: 1 }
      - testo: "Reggere il rumore e attraversare"
        descrizione: "Il suono fa male, ma non ferma le gambe. Bisogna avere la testa ferma per trenta passi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Molto difficile }
        successo:
          titolo: La testa ferma
          testo: |
            Cammini dritto verso la porta lasciando che la cassa rimbombi quanto vuole, e il suono ti passa
            attraverso senza trovare dove fermarsi. Dall'altra parte le orecchie ti fischiano sulla nota bassa
            della cassa, e la testa è tua.
          pe: { resilienza: 5 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Il rumore in testa
          testo: |
            A metà sala il rimbombo ti entra in testa e comincia a girare, e non sai più da che parte sia la
            porta. Torni indietro seguendo la parete con la mano. La parete è liscia per tutto il giro, e la
            mano non trova un segno per orientarsi finché non tocca lo stipite.
          effetti: { tormento: 1.5 }
      - testo: "Coprirsi le orecchie e correre"
        descrizione: "Trenta passi di corsa, con le mani sulle orecchie e i denti stretti."
        costo: 2
        esito:
          titolo: La corsa nel rombo
          testo: |
            Corri con le mani premute sulle orecchie, e la cassa ti insegue con il rumore dei tuoi stessi
            passi. Ogni passo ti sale anche dalle suole alle ginocchia, e le mani non lo fermano. Arrivi alla
            porta con la testa che ronza e la sensazione che qualcuno, più in basso, abbia sentito tutto.
          effetti: { profondita.torre-anello-2: 1, tormento: 1 }

  # ------------------------------------------------------------ la porta che canta
  - id: torre-2-la-porta-che-canta
    immagine: icone/door-ring-handle
    titolo: La porta che canta
    sommario: "Una porta di metallo senza maniglia, con una fessura all'altezza della bocca. Quando ci parli dentro, la porta risponde con una nota."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 <= 5]
    testo: |
      La porta del piano è una lastra dello stesso metallo nero delle pareti, senza cardini in vista e senza
      maniglia. All'altezza della bocca c'è una fessura stretta, e intorno alla fessura sono incise delle
      onde. I solchi sono profondi quanto un'unghia e hanno i bordi vivi, e il dito che ci passi sopra non
      trova una sbavatura. Quando ti avvicini per guardarci dentro, il fiato che ti esce dal naso fa vibrare
      la porta con una nota bassa che si spegne subito. Appoggi il palmo sul metallo, e la nota la senti
      ancora nelle dita quando l'orecchio non la sente più.

      {origine accolito-del-velo} In Cattedrale i portali della Cripta si aprivano un tempo con un canto,
      dicono i vecchi accoliti. Le parole si sono perse, e la melodia l'hanno tenuta per i vespri.
    opzioni:
      - testo: "Cantare nella fessura"
        descrizione: "La porta risponde a una nota. Bisogna trovare quella che la fa aprire, a orecchio."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: La nota giusta
          testo: |
            Canti nella fessura una nota dopo l'altra, salendo piano, finché la porta non risponde con la
            stessa nota e la tiene. Si apre verso l'interno con un sospiro di metallo. Il battente è spesso
            quanto una mano aperta e gira sui cardini nascosti senza un cigolio.
          pe: { espressivita: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: La nota stonata
          testo: |
            La nota che trovi è sbagliata, e la porta te la restituisce storta, così forte che ti fischiano le
            orecchie per tutta la scala.
          effetti: { tormento: 1 }
      - testo: "Ascoltare le note della porta"
        descrizione: "Ogni volta che ci respiri dentro la porta fa una nota. Se le note si capiscono, si capisce anche quale manca."
        prova: { attributo: mentale, abilita: percezione, difficolta: Difficile }
        successo:
          titolo: La nota che manca
          testo: |
            Soffi nella fessura più volte e ascolti, e a ogni soffio la porta fa una nota diversa della stessa
            scala. Le metti in fila dalla più bassa alla più alta, e ne manca una. Quando la fischi tu, la
            porta si apre.
          pe: { percezione: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Troppe note
          testo: |
            Le note si mescolano fra loro e con l'eco della scala, e a forza di ascoltarle non riesci più a
            distinguere la tua voce da quella della porta. Ti stacchi dalla fessura, e la porta fa un'ultima
            nota quando hai già smesso di soffiare.
          effetti: { tormento: 1 }
      - testo: "Cantare la melodia dei vespri"
        descrizione: "La melodia dei vespri viene da un canto che apriva le porte. Forse questa porta la conosce."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: I vespri
          testo: |
            Canti la melodia dei vespri a bocca chiusa, come la cantavi in Cattedrale, e la porta la riprende
            con te alla seconda nota. La canta più lenta di come la cantavate voi. Si apre prima che tu
            finisca, e la melodia continua a suonare nella sala anche dopo.
          pe: { espressivita: 5 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: La strofa dimenticata
          testo: |
            A metà ti manca una strofa, e la porta aspetta la nota che non arriva. Sotto il palmo il metallo
            resta teso e vibra appena, senza mai spegnersi. Quando smetti, ti resta la melodia in testa per
            tutto il piano.
          effetti: { tormento: 0.5 }
      - testo: "Forzare la porta con la lama nella fessura"
        descrizione: "La fessura è larga quanto una lama. La porta non gradirà."
        costo: 3
        esito:
          titolo: La porta che urla
          testo: |
            Infili la lama nella fessura e fai leva finché la porta non cede di un palmo, e intanto urla con
            una voce di metallo che ti entra nelle ossa. Passi di fianco nel varco con i denti che ti fanno
            male. Più tardi guardi la lama, e il filo è smussato per un dito nel punto che stava dentro la
            fessura.
          effetti: { profondita.torre-anello-2: 1, tormento: 1 }

  # ------------------------------------------------------------ gli orecchianti
  - id: torre-2-gli-orecchianti
    immagine: icone/sound-waves
    titolo: Gli orecchianti
    sommario: "Due creature pallide, senza occhi, con il corpo coperto di membrane tese, girano la testa verso il tuo respiro."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 <= 5]
    testo: |
      Al centro della cassa due creature pallide, grandi come cani da guardia, stanno accucciate sul metallo.
      Al posto degli occhi hanno pelle liscia, tirata sull'osso senza una piega, e su tutto il corpo hanno
      membrane sottili tese come la pelle di un tamburo che vibrano quando la sala vibra. Il pavimento sotto
      di loro è consumato in due cerchi lucidi della forma esatta dei loro corpi accucciati. Scendi gli ultimi
      gradini piano e ti dici che il rombo del battito copre il rumore dei tuoi passi. Quando metti piede sul
      pianerottolo le due teste si girano verso di te nello stesso momento.

      {natura Difficile} Sono cresciute nella Marea delle casse, e sentono tutto. Le membrane più grandi
      stanno sul dorso e restano girate verso il punto da cui arriva il suono. Un rumore lontano le porta via
      più in fretta di qualunque esca.
    opzioni:
      - testo: "Affrontare gli orecchianti"
        descrizione: "Le due creature sono cieche e svelte, e ti trovano dal rumore che fai. In combattimento se ne fa tanto."
        combattimento: torre-gli-orecchianti
        vittoria:
          titolo: Le membrane ferme
          testo: |
            Le membrane della seconda creatura smettono di vibrare, e la sala torna a rimbombare soltanto dei
            tuoi passi. Attraversi la cassa senza guardarle.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        sconfitta:
          titolo: Trovat{o|a}
          testo: |
            Le creature ti trovano a ogni passo, anche quando smetti di muoverti, perché il cuore fa rumore.
            Torni su per la scala con le gambe morse e loro che ti ascoltano andar via. Dal pianerottolo di
            sopra ti volti, e le membrane tremano ancora a ogni battito che fai.
      - testo: "Lanciare un sasso dall'altra parte della cassa"
        descrizione: "Un rumore lontano le porta via. Bisogna lanciare lontano, e poi muoversi senza rumore."
        prova: { attributo: fisico, abilita: [armi-da-distanza, furtivita], difficolta: Difficile }
        successo:
          titolo: Il sasso lontano
          testo: |
            Il sasso batte sul metallo in fondo alla sala, e la cassa lo moltiplica dieci volte. Le creature
            ci corrono sopra a quattro zampe, e tu sei già sulla scala di sotto. Dal primo gradino le vedi
            ancora chine con il muso sul punto dove è caduto.
          pe: { furtivita: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Il sasso vicino
          testo: |
            Il sasso cade troppo vicino, e le creature si girano verso il suono e poi verso di te. Una ti
            morde il braccio prima che tu riesca a tornare sulla scala. I denti sono piccoli e fitti, e il
            morso brucia più di quanto sanguini.
          effetti: { ferite: 1 }
      - testo: "Restare immobili finché non perdono interesse"
        descrizione: "Se non trovano un suono da seguire tornano a dormire. Bisogna fare meno rumore del proprio cuore."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Meno rumore del cuore
          testo: |
            Resti immobile sul pianerottolo, con il respiro lungo e lento, finché le creature non abbassano la
            testa e si riaccucciano. Le aggiri lungo la parete senza che si muovano. Quando passi alle loro
            spalle le membrane del dorso si girano piano verso di te, e la testa resta giù.
          pe: { resilienza: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Il cuore che batte
          testo: |
            Più resti ferm{o|a} più il cuore ti batte forte nelle orecchie, e a un certo punto le creature lo
            sentono anche loro. Arrivano insieme con un ticchettio di unghie sul metallo, e tu scappi su per
            la scala.
          effetti: { tormento: 0.5, ferite: 0.5 }
      - testo: "Aspettare che se ne vadano da sole"
        descrizione: "Ogni tanto escono dalla cassa a cacciare, quando decidono loro."
        costo: 3
        esito:
          titolo: L'attesa sulla scala
          testo: |
            Aspetti sedut{o|a} sui gradini finché le creature non si alzano e scendono a cacciare in un'altra
            cassa. Per tutto il tempo il rombo del battito ti riempie la testa, e ti alzi con le tempie che
            pulsano. Sul metallo dove stavano accucciate restano due chiazze umide che sanno di Marea.
          effetti: { profondita.torre-anello-2: 1, tormento: 1 }

  # ------------------------------------------------------------ il pozzo dell'eco
  - id: torre-2-il-pozzo-dell-eco
    immagine: icone/hole-ladder
    titolo: Il pozzo dell'eco
    sommario: "In mezzo al pavimento si apre un pozzo che scende nel buio. Dall'eco si capisce dove porta, se si sa ascoltare."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 <= 5]
    testo: |
      La scala qui si interrompe sul pavimento della cassa, e non riprende da nessuna parte. In mezzo al
      pavimento si apre un pozzo largo quanto un carro, e dal bordo partono tre gallerie che scendono nel buio
      con la stessa pendenza. Lungo il bordo del pozzo qualcuno ha inciso tre segni a forma di onda, uno per
      galleria. Il solco ha la stessa profondità dall'inizio alla fine, e in nessun punto la punta che l'ha
      inciso è scivolata.

      Quando parli sopra il pozzo, l'eco ti torna su a pezzi, da tre parti diverse. L'ultimo pezzo arriva
      molto dopo che hai chiuso la bocca, e ti sembra più basso della tua voce.
    opzioni:
      - testo: "Gridare nel pozzo e ascoltare l'eco"
        descrizione: "L'eco che torna più tardi viene da più in basso. È quella da seguire."
        prova: { attributo: mentale, abilita: percezione, difficolta: Difficile }
        successo:
          titolo: L'eco più lontana
          testo: |
            Gridi una parola sola e conti i battiti che l'eco ci mette a tornare da ogni galleria. Da destra
            ne passano due e dal centro quattro. L'ultima a tornare è quella di sinistra dopo nove battiti, e
            la scendi.
          pe: { percezione: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Tre echi
          testo: |
            Le tre eco tornano insieme e ti si confondono nelle orecchie. Scegli a caso, e la galleria scende
            per un tratto e poi piega e risale senza che tu senta cambiare la pendenza sotto i piedi. Ti
            riporta al pianerottolo da cui eri partit{o|a}.
          effetti: { tormento: 1 }
      - testo: "Leggere i segni incisi sul bordo"
        descrizione: "Su ogni galleria c'è un'onda diversa, e forse le onde indicano quale scende."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Molto difficile }
        successo:
          titolo: L'onda più lunga
          testo: |
            Le tre onde hanno la stessa altezza e lunghezze diverse, e la più lunga è la nota più bassa. Vale
            per le corde di un liuto, e qui vale per il metallo. Scendi dalla galleria della nota bassa, e il
            battito ti viene incontro.
          pe: { accademiche: 5 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Le onde mute
          testo: |
            Le onde non ti dicono niente, e a forza di guardarle ti sembra che si muovano. Ti dici che sono
            gli occhi stanchi, e scendi da una galleria qualsiasi. Ti ritrovi in cima alla cassa.
          effetti: { tormento: 0.5 }
      - testo: "Provare le gallerie una dopo l'altra"
        descrizione: "Una alla volta, finché una non scende. Le gambe pagano, e la testa anche."
        costo: 3
        esito:
          titolo: Tre gallerie
          testo: |
            Le provi tutte e tre, e la terza scende davvero. Le prime due salgono a spirale e ti rimettono sul
            bordo del pozzo, ogni volta da un lato diverso. Arrivi in fondo con le gambe dure e la tua voce
            che ti torna ancora nelle orecchie dal pozzo, a pezzi.
          effetti: { profondita.torre-anello-2: 1, tormento: 0.5 }

  # ------------------------------------------------------------ la galleria delle conchiglie
  - id: torre-2-la-galleria-delle-conchiglie
    immagine: icone/spiral-shell
    titolo: La galleria delle conchiglie
    sommario: "Le pareti della galleria sono coperte di conchiglie di metallo che ripetono le tue parole, cambiandole un poco."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 <= 5]
    testo: |
      La scala passa in una galleria bassa, e devi chinare la testa per entrarci. Le pareti sono coperte di
      conchiglie di metallo nero, grandi come mani aperte, che escono dalla parete senza una saldatura e hanno
      la bocca girata verso chi passa. A prima vista hanno tutte la stessa spirale, con gli stessi giri e le
      stesse costole. Quando dici qualcosa, le conchiglie te lo ripetono una dopo l'altra lungo la galleria, e
      a ogni conchiglia la frase cambia di una parola. In fondo arriva una frase che non hai mai detto.

      {origine mercante-dei-ponti} Ai Ponti c'è un gioco dei mercanti in cui un'offerta passa di bocca in
      bocca e arriva in fondo diversa. Vince chi capisce dove è cambiata.
    opzioni:
      - testo: "Non dire niente e passare"
        descrizione: "Le conchiglie ripetono anche i sospiri. Bisogna non sospirare per tutta la galleria."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: La galleria muta
          testo: |
            Attraversi la galleria con la bocca chiusa e i passi leggeri, e le conchiglie restano in silenzio.
            L'aria che ti esce dal naso sfiora il bordo delle conchiglie più vicine senza che rispondano. In
            fondo ti sembra che una di loro sussurri il tuo nome, piano.
          pe: { furtivita: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Un sospiro
          testo: |
            A metà galleria ti scappa un sospiro, e le conchiglie lo ripetono fino in fondo, trasformandolo in
            una parola che ti si pianta in testa e ci resta. È una parola corta, di due sillabe, in una lingua
            che non è la tua.
          effetti: { tormento: 1 }
      - testo: "Ascoltare la frase cambiata senza crederle"
        descrizione: "In fondo arriva una frase che non hai detto. Bisogna sentirla senza farla propria."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Una frase non tua
          testo: |
            Dici il tuo nome e ascolti le conchiglie trasformarlo in una frase lunga che parla di te. Dentro
            ci sono cose vere mescolate con altre che non hai mai fatto. Non le credi, e la frase ti scivola
            addosso mentre arrivi in fondo alla galleria.
          pe: { resilienza: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Una frase che resta
          testo: |
            La frase che arriva in fondo dice di te una cosa nuova, e ti sembra vera. Ci pensi per
            tutta la scala.
          effetti: { tormento: 1.5 }
      - testo: "Capire dove la frase cambia"
        descrizione: "Come nel gioco dei mercanti, si segue l'offerta di bocca in bocca per vedere dove la girano."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il gioco dei mercanti
          testo: |
            Dici una frase qualsiasi e segui le conchiglie una per una, finché non trovi quella che cambia la
            parola. È più storta delle altre, con la spirale che gira al contrario, e il metallo dentro la
            bocca è tiepido quando le infili un dito. Da lì in fondo le conchiglie ripetono soltanto quello
            che dici.
          pe: { percezione: 5 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Troppe bocche
          testo: |
            Le conchiglie sono troppe, e la parola cambia dove meno te lo aspetti. Una volta cambia in due
            conchiglie di fila, e un'altra volta torna alla parola di prima. In fondo arrivi con una frase in
            testa che non riesci a scacciare.
          effetti: { tormento: 0.5 }
      - testo: "Parlare da solo per coprirle"
        descrizione: "Se ripetono, che ripetano qualcosa di noioso come una conta."
        costo: 2
        esito:
          titolo: La conta
          testo: |
            Attraversi la galleria contando ad alta voce, e le conchiglie ti restituiscono numeri sempre più
            strani. Il sette torna indietro come otto, e poi come un numero che non sapresti scrivere. In
            fondo ti accorgi che non sai più quale numero viene dopo il nove.
          effetti: { profondita.torre-anello-2: 1, tormento: 1 }

  # ------------------------------------------------------------ il pavimento di timpani
  - id: torre-2-il-pavimento-di-timpani
    immagine: icone/sound-waves
    titolo: Il pavimento di timpani
    sommario: "Il pavimento della cassa è fatto di membrane grigie tese su telai di metallo. A ogni passo suonano come tamburi."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 <= 5]
    testo: |
      Il metallo del pavimento finisce due passi dopo la scala. Il resto della cassa è fatto di membrane
      grigie e lucide, tese su telai esagonali tutti della stessa misura, e attraverso le membrane si vede il
      buio della cassa di sotto. Sono spesse meno di un'unghia e hanno venature più scure che corrono da un
      lato all'altro dell'esagono. Quando ne premi una con la punta dello stivale suona come un tamburo, e
      cede sotto lo stivale come la pelle di un ventre. Ritiri il piede, e la membrana resta incavata ancora
      un momento prima di tornare tesa.

      I telai che reggono le membrane sono stretti come il bordo di un gradino. Sopra c'è uno strato di
      polvere grigia intatto, e da un capo all'altro della sala non c'è un'impronta.
    opzioni:
      - testo: "Camminare sui telai"
        descrizione: "Il metallo dei telai non suona. È largo quanto un piede, e storto."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: Sui telai
          testo: |
            Cammini da un telaio all'altro con le braccia aperte, e le membrane restano mute ai tuoi lati.
            Arrivi alla scala di sotto senza aver suonato una nota. Dietro di te, nella polvere dei telai,
            resta l'unica fila di impronte della sala.
          pe: { acrobazia: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Il piede nella membrana
          testo: |
            Il piede scivola dal telaio e finisce in mezzo a una membrana, che suona come un colpo di cannone
            e cede fino al ginocchio. Sotto, la gamba trova soltanto aria fredda. Ti tiri fuori con le
            orecchie che fischiano.
          effetti: { tormento: 1, ferite: 0.5 }
      - testo: "Correre sulle membrane senza fermarsi"
        descrizione: "Se il piede non resta, la membrana non fa in tempo a cedere. Suona lo stesso, e forte."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: Il rullo
          testo: |
            Corri sulle membrane senza mai fermarti, e il pavimento suona sotto di te come un rullo di
            tamburi. Ogni membrana ha una nota un poco diversa dalla vicina. Arrivi dall'altra parte prima che
            una membrana faccia in tempo a cedere, con il rullo che ti segue giù per la scala.
          pe: { atletica: 3 }
          effetti: { profondita.torre-anello-2: 1, tormento: 0.5 }
        fallimento:
          titolo: La membrana che cede
          testo: |
            Una membrana cede prima che il piede riparta, e ti ritrovi con la gamba nel buio fino all'anca. La
            membrana si stringe intorno alla coscia, e per liberarti la devi strappare con le mani. Ti tiri
            fuori a fatica, con la pelle grigia che ti si attacca ai calzoni.
          effetti: { ferite: 1, contaminazione: 0.5 }
      - testo: "Strisciare sulle membrane"
        descrizione: "Disteso, il peso si divide su più membrane. Suonano piano, e la pelle è fredda."
        costo: 3
        esito:
          titolo: Sulla pelle fredda
          testo: |
            Attraversi la cassa strisciando, con le braccia aperte sulle membrane, e il pavimento suona sotto
            di te come un tamburo battuto con le dita. Con la guancia sulla pelle fredda senti salire dalla
            cassa di sotto il battito del fondo. Arrivi in fondo con la giubba umida e un odore di Marea
            addosso.
          effetti: { profondita.torre-anello-2: 1, contaminazione: 0.5, tormento: 0.5 }

  # ------------------------------------------------------------ la stanza sorda
  - id: torre-2-la-stanza-sorda
    immagine: icone/gas-mask
    titolo: La stanza sorda
    sommario: "Una cassa dove si spegne anche il rumore dei propri passi, e dopo un po' non si capisce più da che parte sia il basso."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 <= 5]
    testo: |
      Questa cassa è rivestita di un materiale nero che sembra feltro bagnato, e appena entri ogni suono si
      spegne. Lo tocchi, e il dito affonda di una falange in una massa fibrosa e fredda che non ti lascia
      acqua sulla pelle. Non senti i tuoi passi, né il fruscio della giubba, e dopo un momento nemmeno il
      battito che sale dal fondo. Batti le mani una volta per provare, e il colpo lo senti nei palmi e non
      nelle orecchie. In questo silenzio le orecchie cominciano a inventarsi rumori, prima un fischio sottile
      e poi qualcosa che somiglia a una voce lontana.

      La porta di sotto è da qualche parte nel buio, e senza suoni non sai quanto sia lontana.
    opzioni:
      - testo: "Orientarsi con gli occhi"
        descrizione: "I segni azzurri lungo le pareti sono deboli, ma ci sono. Bisogna fidarsi solo di loro."
        prova: { attributo: mentale, abilita: percezione, difficolta: Difficile }
        successo:
          titolo: I segni deboli
          testo: |
            Segui i segni azzurri lungo la parete senza ascoltare le voci che le orecchie si inventano. Sono a
            un passo l'uno dall'altro e ti portano lungo la curva della cassa. Arrivi alla porta di sotto, e
            appena la passi il battito torna come un vecchio amico.
          pe: { percezione: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Le voci inventate
          testo: |
            Una voce che non c'è ti chiama da destra, e la segui per dieci passi prima di accorgerti che la
            porta era a sinistra. Quando ti fermi, la voce si ferma un passo dopo di te. Torni all'ingresso
            con il cuore che batte forte e muto.
          effetti: { tormento: 1 }
      - testo: "Fare i segni a mano dei Raschiatori"
        descrizione: "Nelle gallerie più rumorose i Raschiatori parlano con le mani, e contano i passi con le dita."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Le dita che contano
          testo: |
            Conti i passi sulle dita come nelle gallerie della Cicatrice, una mano per i dieci e l'altra per
            le unità. Ogni dito piegato è un passo che sai dove hai messo, e la stanza sorda smette di farti
            paura. Arrivi alla porta al passo quarantadue.
          pe: { resilienza: 5 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Il conto perso
          testo: |
            A un certo punto le dita si fermano e non ricordi più a che numero eri. Torni indietro seguendo la
            parete.
          effetti: { tormento: 0.5 }
      - testo: "Camminare a lungo con una mano sulla parete"
        descrizione: "La parete gira tutta intorno alla cassa. Prima o poi porta alla porta."
        costo: 3
        esito:
          titolo: Il giro lungo
          testo: |
            Cammini con la mano sul feltro bagnato della parete, e fai nel silenzio un giro intero della
            cassa. Sotto il palmo il feltro è sempre uguale, e a un certo punto non sai più a che giro sei.
            Quando la mano trova lo stipite della porta di sotto hai le orecchie che ronzano di un rumore
            inventato.
          effetti: { profondita.torre-anello-2: 1, tormento: 1 }

  # ------------------------------------------------------------ la cassa allagata
  - id: torre-2-la-cassa-allagata
    immagine: icone/sound-waves
    titolo: La cassa allagata
    sommario: "Il fondo della cassa è pieno d'acqua nera fino alla cintura, e a ogni battito l'acqua si increspa in cerchi."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 <= 5]
    testo: |
      La scala finisce dentro l'acqua. Il fondo di questa cassa è allagato fino all'altezza della cintura, e
      l'acqua è nera e immobile, con un odore di Marea che sale dalla superficie. La porta di sotto sta
      dall'altra parte della sala con la soglia sommersa. Qui il battito del fondo non arriva alle orecchie,
      perché l'acqua se lo prende tutto. Lo vedi sulla superficie, che a ogni colpo si increspa in cerchi
      fitti e regolari. Lungo le pareti i cerchi si rompono contro qualcosa che sta appena sotto il pelo
      dell'acqua, e disegnano una riga dritta che fa il giro della cassa.

      I cerchi non partono da un punto. Nascono tutti insieme contro le pareti e stringono verso il centro
      della cassa, dove si chiudono senza lasciare un'onda.

      {resistenza Media} L'acqua è molto più fredda dell'aria, e le gambe ci reggeranno poco. Chi ci entra
      deve uscirne in fretta.
    opzioni:
      - testo: "Guadare la cassa in fretta"
        descrizione: "L'acqua arriva alla cintura ed è gelata. Bisogna arrivare alla porta prima che le gambe si fermino."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: L'acqua alla cintura
          testo: |
            Entri nell'acqua e attraversi la cassa a passi lunghi, con le braccia alzate e il freddo che ti
            sale fino alle costole. A ogni battito i cerchi ti picchiano contro i fianchi da tutte le parti
            insieme. Esci sulla soglia di sotto fradic{io|ia}, con le gambe intorpidite e l'odore di Marea nei
            vestiti.
          pe: { atletica: 3 }
          effetti: { profondita.torre-anello-2: 1, contaminazione: 0.5 }
        fallimento:
          titolo: Sotto il pelo dell'acqua
          testo: |
            A metà sala un piede scivola sul fondo liscio e vai sotto. Sott'acqua il battito ti arriva in
            testa come un colpo di maglio, così forte che non sai più da che parte sia l'alto. Riemergi vicino
            alla scala da cui sei sces{o|a} e ci resti aggrappat{o|a} finché le orecchie non smettono di
            suonare.
          effetti: { tormento: 1 }
      - testo: "Camminare sul cornicione sommerso"
        descrizione: "Lungo le pareti i cerchi si rompono su qualcosa che sta appena sotto l'acqua. Bisogna vederlo bene per metterci i piedi."
        prova: { attributo: mentale, abilita: percezione, difficolta: Difficile }
        successo:
          titolo: Il cornicione
          testo: |
            Segui con gli occhi la riga dove i cerchi si rompono, e sotto il pelo dell'acqua il piede trova un
            cornicione largo quanto uno stivale. Lo percorri con la mano sulla parete e l'acqua alle caviglie.
            Il metallo del cornicione è liscio e pulito, e nel mezzo è consumato in un solco basso dove il
            piede ci sta giusto.
          pe: { percezione: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Il cornicione che finisce
          testo: |
            Il cornicione finisce dove l'acqua si fa più nera, e il piede trova il vuoto. Cadi nell'acqua fino
            al collo e il battito ti entra nelle orecchie da sotto. Torni alla scala a bracciate, con la testa
            che rimbomba.
          effetti: { tormento: 1 }
      - testo: "Avanzare piano con l'acqua alla cintura"
        descrizione: "Un passo alla volta, tastando il fondo. Ci vuole tempo, e l'acqua che sa di Marea è gelata."
        costo: 2
        esito:
          titolo: Un passo alla volta
          testo: |
            Attraversi la cassa tastando il fondo con la punta dello stivale, e ci metti molto. A ogni battito
            i cerchi ti stringono i fianchi e il freddo ti entra nelle ossa del bacino. Quando esci sulla
            soglia di sotto, l'acqua che ti cola dai calzoni lascia sul metallo delle chiazze che restano
            nere.
          effetti: { profondita.torre-anello-2: 1, contaminazione: 0.5, tormento: 0.5 }

  # ------------------------------------------------------------ le mute degli orecchianti
  - id: torre-2-le-mute-degli-orecchianti
    immagine: icone/sound-waves
    titolo: Le mute degli orecchianti
    sommario: "Il pavimento della cassa è coperto di pelli secche che scricchiolano. In mezzo, due orecchianti dormono sulle loro mute."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 <= 5]
    testo: |
      Il pavimento di questa cassa è coperto di pelli grigie sottili come carta oleata e ammucchiate
      in più strati. Sono mute di orecchianti. Ognuna è intera, con le membrane del dorso ancora tese sulle
      costole vuote e la pelle del muso tirata liscia dove dovrebbero esserci gli occhi. Quando ne tocchi una
      con la punta dello stivale scricchiola come una foglia secca, e la cassa porta lo scricchiolio fino in
      fondo. Al centro della sala due orecchianti dormono accucciati sul mucchio più alto. A ogni scricchiolio
      le membrane del loro dorso si girano verso il suono.

      Fra le mute corrono due sentieri di metallo nudo larghi una spanna, che dal mucchio al centro vanno uno
      alla scala e uno alla porta di sotto. Lungo i bordi dei sentieri le pelli sono schiacciate e lisce. A
      contarle, le mute sono centinaia, e hanno tutte la misura dei due che dormono.

      {natura Difficile} I sentieri sono le loro strade, battute a forza di passarci ogni giorno. Sul metallo
      nudo le loro zampe non fanno rumore.
    opzioni:
      - testo: "Affrontare gli orecchianti"
        descrizione: "Svegli sul loro mucchio, con le mute che scricchiolano a ogni tuo passo e a nessuno dei loro."
        combattimento: torre-gli-orecchianti
        vittoria:
          titolo: Il mucchio fermo
          testo: |
            Il secondo orecchiante si accascia sul mucchio, e per un poco le pelli intorno a lui scricchiolano
            mentre il corpo si assesta. Poi la cassa tace. Attraversi la sala sul sentiero nudo, e dietro di
            te le mute restano ferme.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        sconfitta:
          titolo: Lo scricchiolio
          testo: |
            Ogni tuo passo scricchiola sulle mute, e gli orecchianti ti trovano sempre prima che tu li veda.
            Torni su per la scala con le gambe morse. Da sopra senti le pelli scricchiolare ancora a lungo,
            mentre le due creature si risistemano sul mucchio.
      - testo: "Passare sul metallo fra le pelli"
        descrizione: "Fra una muta e l'altra resta qualche palmo di metallo nudo. Bisogna posare il piede solo lì, lontano dai sentieri."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Difficile }
        successo:
          titolo: Fra le pelli
          testo: |
            Attraversi la cassa posando il piede solo sul metallo nudo fra una muta e l'altra, a volte sulla
            punta soltanto. Una pelle ti sfiora la caviglia senza scricchiolare. Alla porta ti accorgi di
            avere i polpacci duri come legno.
          pe: { acrobazia: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: La pelle che si sbriciola
          testo: |
            Il tallone finisce su una muta, che si sbriciola con un rumore di carta strappata. Gli orecchianti
            alzano la testa insieme. Uno ti arriva addosso prima che tu sia tornat{o|a} sulla scala, e i denti
            fitti ti lasciano sul braccio una fila di buchi.
          effetti: { ferite: 1 }
      - testo: "Camminare sui loro sentieri"
        descrizione: "I sentieri di metallo nudo sono le loro strade, e lì non si fa rumore. Passano a un palmo dal mucchio dove dormono."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: Sulla loro strada
          testo: |
            Segui il sentiero nudo dalla scala fino al mucchio e da lì verso la porta, con il passo lento e
            corto delle bestie che lo battono ogni giorno. Passi a un palmo dai due che dormono. Le membrane
            si girano verso di te una dopo l'altra, e la testa resta giù finché non chiudi la porta.
          pe: { natura: 3 }
          effetti: { profondita.torre-anello-2: 1, tormento: 0.5 }
        fallimento:
          titolo: Troppo vicino
          testo: |
            Accanto al mucchio uno dei due apre la bocca senza alzare la testa, e il suo soffio caldo ti
            arriva sulla mano. Il passo ti si allunga da solo e il piede finisce su una muta. Torni alla scala
            con il ticchettio delle loro unghie alle spalle e le orecchie che fischiano.
          effetti: { tormento: 1 }
      - testo: "Correre sulle mute fino alla porta"
        descrizione: "La strada più corta, sopra le pelli che scricchiolano. Gli orecchianti si sveglieranno al primo passo."
        costo: 3
        esito:
          titolo: Di corsa sulle mute
          testo: |
            Corri dritt{o|a} alla porta e le mute ti si sbriciolano sotto gli stivali come foglie d'autunno.
            Gli orecchianti si svegliano al primo passo. Uno ti morde il polpaccio sulla soglia, e te lo
            scrolli di dosso sbattendogli la porta sul muso.
          effetti: { profondita.torre-anello-2: 1, ferite: 1 }

  # ------------------------------------------------------------ il punto d'ascolto
  - id: torre-2-il-punto-d-ascolto
    immagine: icone/spiral-shell
    titolo: Il punto d'ascolto
    sommario: "Una parete della cassa è un grande catino di metallo che raccoglie ogni suono in un punto solo. La strada per la porta ci passa in mezzo."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 <= 5]
    testo: |
      Una parete intera di questa cassa è un catino di metallo nero concavo e liscio come l'interno di un
      cucchiaio e largo quanto la facciata di una casa. Il catino raccoglie tutti i suoni della sala e li
      manda in un punto solo, a dieci passi dalla parete, proprio sulla strada fra la scala e la porta di
      sotto. Lo trovi quando ci passi con la testa. Lì dentro il fruscio della giubba diventa uno strappo, e
      il tuo cuore batte come un tamburo da parata. A un palmo di distanza la cassa torna a rimbombare come
      tutte le altre.

      Ti sposti fuori dal punto, e il colpo del tuo cuore continua a venire da lì per due battiti ancora.

      {percezione Difficile} Il punto non è largo e ha un bordo netto. Chi muove la testa piano lo sente
      cominciare, e può girargli intorno.
    opzioni:
      - testo: "Girare intorno al punto"
        descrizione: "Il punto ha un bordo netto. Bisogna sentirlo cominciare con la testa e girargli intorno senza entrarci."
        prova: { attributo: mentale, abilita: percezione, difficolta: Difficile }
        successo:
          titolo: Il bordo
          testo: |
            Avanzi piano e muovi la testa di un dito alla volta, e appena il fruscio della giubba si fa più
            forte torni indietro di un passo. Fai il giro del punto così, a mezzaluna. Arrivi alla porta senza
            aver sentito il tuo cuore più forte del solito.
          pe: { percezione: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Dentro il punto
          testo: |
            Sbagli il bordo di un passo e ci entri con tutta la testa. Il tuo stesso passo ti arriva nelle
            orecchie come un colpo di maglio, e il cuore subito dopo. Torni alla scala a tentoni, con le
            orecchie che fischiano.
          effetti: { tormento: 1 }
      - testo: "Attraversare il punto a testa ferma"
        descrizione: "La strada più corta passa nel punto. Lì dentro ogni suono è un colpo, e il più forte è il cuore."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Il tamburo del cuore
          testo: |
            Entri nel punto e ci resti il tempo di tre passi, mentre il tuo cuore ti batte nelle orecchie come
            un tamburo da parata. Lo lasci battere e continui a camminare. Dall'altra parte ti accorgi che hai
            serrato i pugni fino a farti male alle nocche.
          pe: { resilienza: 3 }
          effetti: { profondita.torre-anello-2: 1, tormento: 0.5 }
        fallimento:
          titolo: Il cuore ascoltato
          testo: |
            Nel punto il cuore ti batte così forte che ti fermi ad ascoltarlo, e più lo ascolti più accelera.
            Ne esci all'indietro e torni alla scala con le mani premute sulle orecchie.
          effetti: { tormento: 1.5 }
      - testo: "Passare rasente il catino"
        descrizione: "Lungo la parete concava il suono non si raccoglie. È la strada più lunga, e il metallo del catino rimanda ogni passo."
        costo: 2
        esito:
          titolo: Rasente il catino
          testo: |
            Fai il giro della sala con la spalla contro il catino, lontano dal punto. Il metallo concavo ti
            restituisce ogni passo dall'alto, e a metà giro non sai più se i passi che senti sono tuoi. Arrivi
            alla porta con le tempie che pulsano.
          effetti: { profondita.torre-anello-2: 1, tormento: 1 }

  # ================================================================ piani 14-16 (profondità 6-11)
  # ------------------------------------------------------------ il risonatore
  - id: torre-2-il-risonatore
    immagine: bestiario/salvaguardia-precursori
    titolo: Il risonatore
    sommario: "Una macchina a forma di diapason alta due uomini sta in mezzo alla cassa e vibra. Quando ti vede, apre la bocca."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 >= 6, profondita.torre-anello-2 <= 11]
    testo: |
      In mezzo alla cassa c'è una macchina alta due uomini, a forma di diapason, con le due punte che vibrano
      così in fretta da sembrare sfocate. Il fusto entra nel pavimento senza bulloni e senza saldature, e
      intorno alla base il metallo è increspato in cerchi fitti e bassi, come l'acqua di uno stagno dove è
      caduto un sasso. Sotto le punte, nel corpo della macchina, c'è una bocca rotonda chiusa da una grata. Le
      sbarre sono sottili e lucide, e l'aria della cassa ti lascia l'umido sulla faccia senza che su di loro
      ci sia un filo di ruggine. Quando entri nella sala la grata si apre, e dalla bocca esce la voce della
      Campana.

      {tecnologia Difficile} Le punte vibrano insieme, e sono state tagliate della stessa lunghezza fino allo
      spessore di un capello. Se una delle due smette, la macchina non riesce più a cantare.
    opzioni:
      - testo: "Affrontare il risonatore"
        descrizione: "Una macchina dura, con la voce della Campana in corpo. Più resti vicino, più la voce ti trova."
        combattimento: torre-il-risonatore
        vittoria:
          titolo: Il diapason muto
          testo: |
            L'ultimo colpo piega una punta del diapason, e la voce si rompe in un gracchio. La macchina resta
            in piedi, muta, con la punta storta che vibra ancora da sola. Quando passi accanto alla grata ne
            esce un'aria tiepida che sa di metallo bagnato.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        sconfitta:
          titolo: La voce in corpo
          testo: |
            La voce della Campana ti entra in testa e ci resta finché non ti trovi sulla scala, molti giri più
            su, senza ricordare come ci sei arrivat{o|a}. Hai le nocche sbucciate e la gola che brucia, e non
            ricordi di aver gridato.
      - testo: "Fermare una delle due punte"
        descrizione: "Se una punta smette di vibrare, l'altra resta sola. Bisogna arrivarci vicino, e toccarla."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La punta ferma
          testo: |
            Corri sotto la bocca e afferri una delle punte con la giubba avvolta intorno alle mani. La
            vibrazione ti sale fino ai denti, e poi la punta si ferma. La voce si spegne a metà, e passi.
            Quando apri le mani, la giubba ha un buco consumato largo due dita.
          pe: { tecnologia: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: La punta che scotta
          testo: |
            La punta vibra troppo forte per essere tenuta, e ti scivola dalle mani con un colpo che ti apre il
            palmo. Il taglio è dritto e pulito, e brucia come una scottatura. La voce ti insegue fino alla
            scala.
          effetti: { ferite: 1, tormento: 0.5 }
      - testo: "Ordinare alla macchina di tacere"
        descrizione: "Il Comando parla alla Salvaguardia nella sua lingua. Bisogna farsi sentire sopra la voce della Campana."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il silenzio ordinato
          testo: |
            Dici la formula e la parola ti esce più forte della voce della Campana. La grata della bocca si
            chiude, e le punte rallentano fino a vibrare piano. Il Mana della formula ti resta sulla lingua
            con un sapore di ferro. Passi accanto alla macchina come accanto a un mobile.
          pe: { magia: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: La voce più forte
          testo: |
            La formula affoga nella voce della Campana, e la voce ti risponde con un rintocco che ti piega in
            due.
          effetti: { tormento: 1.5 }
      - testo: "Passare tappandosi le orecchie"
        descrizione: "La voce arriverà comunque. Con le orecchie piene di stoffa arriva meno."
        costo: 3
        esito:
          titolo: La voce attraverso le ossa
          testo: |
            Attraversi la cassa con le orecchie tappate, e la voce della Campana ti arriva lo stesso, dalle
            ossa. La senti salire dai talloni attraverso il pavimento e arrivare al cranio da dietro. Per un
            piano intero ti resta in testa una nota che non è tua.
          effetti: { profondita.torre-anello-2: 1, tormento: 1.5 }

  # ------------------------------------------------------------ le voci dei suonatori
  - id: torre-2-le-voci-dei-suonatori
    immagine: ambientazione/mito-salvaguardia-precursori
    titolo: Le voci dei suonatori
    sommario: "Nella cassa ci sono soltanto voci, che chiamano dei nomi come a un appello."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 >= 6, profondita.torre-anello-2 <= 11]
    testo: |
      Nella cassa ci sono soltanto delle voci. Arrivano dalle pareti e chiamano dei nomi in una lingua che non
      conosci, uno dopo l'altro, come a un appello. Ogni voce è diversa dalle altre e chiama un nome solo
      prima di tacere. Dopo ogni nome c'è un silenzio sempre della stessa durata, e nessuno risponde. Ti dici
      che è un'eco che il metallo trattiene da molto tempo. Lungo le pareti il pavimento è consumato in una
      fila di conche basse e regolari, larghe il doppio di uno stivale.

      A ogni nome la porta di sotto si apre di un dito, e poi si richiude.

      {origine fuggiasco-di-ghoran} Al campo di Ghoran l'appello si fa ogni sera con il tamburo, e chi non
      risponde viene cercato. Qui nessuno è venuto a cercarli.
    opzioni:
      - testo: "Rispondere all'appello"
        descrizione: "Dopo ogni nome c'è un silenzio. Se qualcuno risponde, forse la porta resta aperta."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Difficile }
        successo:
          titolo: Presente
          testo: |
            Al nome successivo rispondi con una parola qualsiasi, e la porta si apre del tutto. Le voci
            tacciono per un momento, e poi riprendono l'appello da capo mentre scendi. Dalla scala senti che
            il primo nome del nuovo appello ha il suono della parola che hai detto tu.
          pe: { empatia: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Il nome sbagliato
          testo: |
            Rispondi al nome sbagliato, e le voci si zittiscono tutte insieme. Poi ricominciano a chiamare più
            forte un nome solo, quello a cui hai risposto, fino a riempirti la testa.
          effetti: { tormento: 1 }
      - testo: "Infilarsi nella porta quando si apre"
        descrizione: "Un dito di apertura a ogni nome. Bisogna essere lì, con il piede pronto, al momento giusto."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Molto difficile }
        successo:
          titolo: Il piede nella porta
          testo: |
            Ti metti accanto alla porta e al nome successivo ci infili il piede e la spalla, e il resto passa
            dopo. Il battente chiude con la forza di una morsa, e lo senti sulla spalla mentre passi. La porta
            si richiude alle tue spalle sul nome seguente.
          pe: { acrobazia: 5 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: La porta che si richiude
          testo: |
            La porta si richiude sul tuo piede prima che tu riesca a passare, e lo stivale ti resta
            schiacciato contro lo stipite per un nome intero. Quando si riapre, le dita in punta allo stivale
            non le senti più.
          effetti: { ferite: 1 }
      - testo: "Aspettare la fine dell'appello"
        descrizione: "Prima o poi i nomi finiranno, e forse allora la porta resterà aperta."
        costo: 3
        esito:
          titolo: La fine dell'appello
          testo: |
            Aspetti sedut{o|a} sul pavimento mentre le voci chiamano nomi su nomi. Ne conti più di trecento
            prima di smettere di contarli. Alla fine la porta resta aperta in un silenzio pieno, e scendi con
            in testa una lista di nomi che non capisci. Qualcuno di quei nomi ti sembra di ricordarlo, e non
            sai da dove.
          effetti: { profondita.torre-anello-2: 1, tormento: 1 }

  # ------------------------------------------------------------ la nicchia del silenzio (il ristoro)
  - id: torre-2-la-nicchia-del-silenzio
    immagine: icone/spiral-shell
    titolo: La nicchia del silenzio
    sommario: "Una nicchia rivestita di feltro, dove il rombo delle casse arriva come un mormorio lontano."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 >= 8, profondita.torre-anello-2 <= 11]
    testo: |
      Nella parete della scala si apre una nicchia bassa rivestita di feltro nero, con una panca di pietra e
      una conca d'acqua. La panca è di una pietra grigia e porosa, l'unica pietra in mezzo a tanto metallo, e
      il bordo è consumato in un avvallamento liscio dove ci si siede. L'acqua della conca è limpida e fredda,
      e sul fondo non c'è deposito. Appena ci entri il rombo delle casse diventa un mormorio lontano, come il
      mare dietro una collina. Sulla panca qualcuno ha inciso una spirale, e accanto un segno che somiglia a
      un orecchio chiuso.
    opzioni:
      - testo: "Restare al silenzio per un'ora"
        descrizione: "La testa ha bisogno del silenzio quanto le gambe del riposo. Qui il silenzio è buono."
        costo: 3
        esito:
          titolo: Un'ora di silenzio
          testo: |
            Ti siedi sulla panca con la schiena contro il feltro e lasci che il mormorio delle casse si
            allontani. Qui il feltro è asciutto e trattiene il calore della schiena. Quando ti alzi la testa è
            leggera, e le voci che ti erano rimaste dentro se ne sono andate.
          effetti: { profondita.torre-anello-2: 1, tormento: -1.5 }
      - testo: "Fasciarsi le ferite con l'acqua della conca"
        descrizione: "Un'ora sulla panca, con l'acqua fredda sulle ferite. Il tempo si paga."
        costo: 3
        esito:
          titolo: L'acqua fredda
          testo: |
            Ti lavi le ferite con l'acqua della conca e ti fasci con la stoffa che ti resta, sedut{o|a} nel
            mormorio. L'acqua è così fredda che il dolore diventa sordo appena la tocchi, e i tagli smettono
            di sanguinare. Quando riparti le fasce tirano, e le gambe ti reggono meglio di prima.
          effetti: { profondita.torre-anello-2: 1, ferite: -1.5 }
      - testo: "Bere e ripartire subito"
        descrizione: "Un sorso d'acqua e la scala. Il silenzio è bello, e fa venire voglia di restare."
        costo: 1
        esito:
          titolo: Un sorso
          testo: |
            Bevi dalla conca con le mani a coppa e riparti prima che il silenzio ti convinca a fermarti.
          effetti: { profondita.torre-anello-2: 1 }

  # ------------------------------------------------------------ la cassa crepata
  - id: torre-2-la-cassa-crepata
    immagine: icone/sound-waves
    titolo: La cassa crepata
    sommario: "Una crepa attraversa la parete della cassa, e dalla crepa esce un fischio che sale sempre più acuto."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 >= 6, profondita.torre-anello-2 <= 11]
    testo: |
      Una crepa lunga quanto un uomo attraversa la parete di questa cassa da cima a fondo, e dalla crepa esce
      un fischio. È appena udibile quando entri e sale piano verso l'acuto, mentre la cassa lo moltiplica
      finché non diventa una punta che ti entra nelle orecchie. I bordi della crepa sono netti e piegati verso
      la sala.

      Accanto alla crepa ci sono degli attrezzi abbandonati, un martello con il manico gonfio d'umido e un
      sacchetto di chiodi mangiati dalla ruggine. C'è anche una lastra di metallo della misura giusta. È dello
      stesso metallo nero delle pareti, senza un segno di ruggine, e ha già i fori per i chiodi.
    opzioni:
      - testo: "Chiudere la crepa con la lastra"
        descrizione: "La lastra ha i fori per i chiodi. Bisogna tenerla ferma contro il fischio e inchiodarla."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La crepa chiusa
          testo: |
            Appoggi la lastra sulla crepa e la inchiodi con gli attrezzi abbandonati, un chiodo dopo l'altro,
            mentre il fischio ti punge le orecchie. I chiodi entrano nel metallo nero senza fatica, e la cosa
            ti sembra strana solo più tardi. All'ultimo chiodo il fischio si spegne di colpo, e la cassa resta
            muta.
          pe: { tecnologia: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Il fischio più alto
          testo: |
            La lastra scivola prima del secondo chiodo, e il fischio sale fino a una nota che ti fa piegare in
            due. Il fischio copre tutto, e la lastra la senti cadere solo dal tremito nei piedi mentre esci
            dalla cassa a tentoni.
          effetti: { tormento: 1 }
      - testo: "Attraversare prima che il fischio salga troppo"
        descrizione: "Il fischio sale piano. Chi è svelto passa prima che diventi insopportabile."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: Prima della punta
          testo: |
            Corri attraverso la cassa mentre il fischio è ancora un lamento, e quando passi accanto alla crepa
            l'aria che ne esce ti arriva fredda sulla guancia. Sei sulla scala di sotto quando il fischio
            diventa una punta. Lo senti salire alle tue spalle per tutto il giro.
          pe: { atletica: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: La punta
          testo: |
            Il fischio diventa una punta quando sei a metà, e le gambe si fermano da sole. Ti trascini fuori
            dalla cassa con le mani sulle orecchie, e il fischio ti arriva lo stesso dentro i denti.
          effetti: { tormento: 1.5 }
      - testo: "Tappare la crepa con la giubba"
        descrizione: "Non durerà. Basta che duri il tempo di passare."
        costo: 2
        esito:
          titolo: La giubba nella crepa
          testo: |
            Infili la giubba nella crepa e il fischio si abbassa a un mormorio. La stoffa si gonfia verso di
            te e trema, spinta dall'aria che esce dalla parete. Attraversi la cassa di corsa, e quando la
            giubba vola via dalla crepa con un urlo sei già sulla scala e senti la schiena fredda.
          effetti: { profondita.torre-anello-2: 1, tormento: 0.5 }

  # ------------------------------------------------------------ le canne di vetro
  - id: torre-2-le-canne-di-vetro
    immagine: icone/sound-waves
    titolo: Le canne di vetro
    sommario: "Una foresta di canne di vetro sottili attraversa la cassa. La tua voce le fa vibrare, e quelle troppo vibrate si spezzano."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 >= 6, profondita.torre-anello-2 <= 11]
    testo: |
      La cassa è attraversata da canne di vetro sottili come dita, che scendono dal soffitto fino al pavimento
      e cantano appena con l'aria che si muove. Il vetro è verdastro e pieno di bollicine minuscole. Dove la
      canna entra nel pavimento non c'è una giunta, e il vetro diventa metallo nero nello spazio di un dito.
      Quando dici una parola le canne vicine vibrano, e una si incrina con un tintinnio. Sul pavimento ci sono
      schegge di vetro dappertutto, affilate come rasoi. Vicino alla soglia sono quasi tutte polvere, e più
      avanti la polvere resta solo a chiazze fra i pezzi interi.

      {origine rampollo-dei-quartieri-alti} Nei salotti dei Quartieri Alti si tiene il bicchiere di cristallo
      per lo stelo, perché il dito sul calice lo fa cantare. Qui non c'è stelo da tenere.
    opzioni:
      - testo: "Passare fra le canne senza un suono"
        descrizione: "Senza voce e senza urti. Il vetro sul pavimento scricchiola sotto gli stivali."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Fra il vetro
          testo: |
            Attraversi la cassa scansando le canne e posando i piedi dove il vetro è già polvere. Le canne
            cantano appena al tuo passaggio, ognuna con una nota sua, e nessuna si spezza. Dall'altra parte ti
            accorgi che hai i denti stretti.
          pe: { furtivita: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: La pioggia di vetro
          testo: |
            Una canna ti sfiora la spalla e si spezza, e le altre si spezzano dietro di lei a catena, in una
            pioggia di schegge. Il tintinnio dura molto più del tempo che il vetro ci mette a cadere. Ti copri
            la testa e torni indietro sanguinando.
          effetti: { ferite: 1.5 }
      - testo: "Spezzarle tutte con una nota sola"
        descrizione: "Una nota lunga e forte cantata dalla soglia spezza tutto il vetro insieme."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Molto difficile }
        successo:
          titolo: La nota che spezza
          testo: |
            Dalla soglia canti una nota sola e la tieni a lungo, e le canne cominciano a vibrare tutte insieme
            finché non si spezzano in un crollo di vetro. Aspetti che la polvere si posi, e attraversi su un
            tappeto di schegge. Dai monconi attaccati al soffitto la tua nota continua a scendere più bassa
            mentre passi.
          pe: { espressivita: 5 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: La voce che si rompe
          testo: |
            La voce ti si rompe prima del vetro, e una canna vicino alla soglia si incrina dalla base alla
            cima. Le altre ti restituiscono la nota rotta moltiplicata, e te la ritrovi in gola per tutto il
            piano.
          effetti: { tormento: 1 }
      - testo: "Tenerle ferme per lo stelo, come in salotto"
        descrizione: "Una canna tenuta in basso, dove nasce dal pavimento, non canta. Bisogna tenerle una per una mentre passi."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Per lo stelo
          testo: |
            Tieni ogni canna per la base mentre ci passi accanto, con due dita, come un bicchiere di cristallo
            a una cena di famiglia. Alla base il vetro ha il freddo del metallo, e sotto i polpastrelli la
            vibrazione si spegne. Nessuna canta, e arrivi dall'altra parte con le dita fredde.
          pe: { acrobazia: 5 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Il calice toccato
          testo: |
            Una canna la prendi troppo in alto, e canta. Le vicine rispondono, e una si spezza vicino al tuo
            orecchio.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Aprirsi la strada a colpi"
        descrizione: "Spezzarle una alla volta con l'elsa e passare in mezzo alle schegge."
        costo: 3
        esito:
          titolo: A colpi d'elsa
          testo: |
            Spezzi le canne una dopo l'altra con l'elsa, e ognuna si rompe con una nota diversa che ti resta
            in testa. Le canne sono cave, e da ognuna che rompi esce un soffio d'aria tiepida. Arrivi in fondo
            con le mani piene di tagli sottili e un concerto stonato nelle orecchie.
          effetti: { profondita.torre-anello-2: 1, ferite: 1, tormento: 0.5 }

  # ------------------------------------------------------------ il battaglio del tempo
  - id: torre-2-il-battaglio-del-tempo
    immagine: icone/ringing-bell
    titolo: Il battaglio del tempo
    sommario: "Un battaglio grande come un tronco colpisce la parete della cassa a tempo regolare. Fra un colpo e l'altro la sala si può attraversare."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 >= 6, profondita.torre-anello-2 <= 11]
    testo: |
      Un battaglio di metallo grande come un tronco pende al centro della cassa e colpisce la parete a tempo
      regolare, sempre nello stesso punto. Lì la parete è incavata in una conca profonda quanto un braccio e
      levigata come l'interno di un cucchiaio. Intorno alla conca il metallo nero non ha una crepa. A ogni
      colpo la cassa urla, e il pavimento trema sotto i piedi. La catena che regge il battaglio sale nel buio
      del soffitto, e da lassù non arriva un cigolio. Fra un colpo e l'altro c'è un silenzio breve, e la porta
      di sotto è proprio accanto al punto in cui il battaglio colpisce.

      {origine figlio-della-citta-bassa} Alle fucine i garzoni passano fra i magli contando i colpi a voce
      bassa, e chi perde il conto ci rimette una mano.
    opzioni:
      - testo: "Passare fra un colpo e l'altro"
        descrizione: "Il silenzio fra i colpi è breve. Bisogna partire subito dopo il colpo e non fermarsi."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Nel silenzio breve
          testo: |
            Parti appena il battaglio si stacca dalla parete e sei alla porta quando torna indietro. Il colpo
            urla alle tue spalle mentre scendi.
          pe: { atletica: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Il colpo vicino
          testo: |
            Parti tardi e il battaglio colpisce la parete accanto a te. Il suono ti butta a terra, e torni
            indietro con le orecchie che sanguinano appena. Per tutta la strada senti ogni cosa da un orecchio
            solo.
          effetti: { tormento: 1, ferite: 0.5 }
      - testo: "Contare i colpi come alle fucine"
        descrizione: "I magli delle fucine hanno un ritmo, e i garzoni lo contano. Anche questo ce l'ha."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il conto delle fucine
          testo: |
            Conti i colpi a voce bassa come facevano i garzoni, e al settimo ti accorgi che il battaglio salta
            un colpo ogni sette. Il conto torna preciso a ogni giro, senza un colpo di scarto. Passi in quel
            silenzio lungo camminando, e il colpo dopo arriva quando sei già sulla scala.
          pe: { percezione: 5 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Il battaglio non salta il colpo che aspettavi, e ti passa davanti a un palmo dalla faccia. Torni
            indietro con il cuore in gola.
          effetti: { tormento: 1 }
      - testo: "Fermare il battaglio con il peso del corpo"
        descrizione: "Appendersi al battaglio quando si stacca, e frenarlo prima che colpisca. È pesante come un tronco."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Molto difficile }
        successo:
          titolo: Il battaglio fermo
          testo: |
            Ti appendi al battaglio quando si stacca dalla parete e lo freni con tutto il peso, e si ferma a
            un palmo dal metallo. Sotto le mani è caldo, e continua a tirare verso la parete con una forza che
            non cala. La cassa resta muta mentre scendi, e il battaglio ricomincia dietro di te.
          pe: { resistenza: 5 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Portat{o|a} via
          testo: |
            Il battaglio ti porta con sé contro la parete, dentro la conca levigata, e il colpo ti scuote fino
            ai denti. Ti lasci cadere a terra e ti trascini via.
          effetti: { ferite: 1, tormento: 1 }
      - testo: "Aspettare accanto alla porta e passare a orecchie tappate"
        descrizione: "Rasente la parete, a orecchie tappate. I colpi arriveranno lo stesso, ma meno."
        costo: 3
        esito:
          titolo: Rasente il colpo
          testo: |
            Ti avvicini alla porta rasente la parete, fermandoti a ogni colpo con le mani sulle orecchie. A
            ogni colpo la parete ti trema contro la spalla. Arrivi alla porta al quinto colpo, e scendi con la
            testa piena di quel suono.
          effetti: { profondita.torre-anello-2: 1, tormento: 1 }

  # ------------------------------------------------------------ gli orecchianti al buio
  - id: torre-2-gli-orecchianti-al-buio
    immagine: icone/sound-waves
    titolo: Gli orecchianti al buio
    sommario: "In questa cassa i segni azzurri sono spenti. Nel buio, da qualche parte, si sentono membrane che vibrano."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 >= 6, profondita.torre-anello-2 <= 11]
    testo: |
      In questa cassa i segni azzurri sono spenti, e il buio è completo. Con la luce della scala alle spalle
      vedi che sulla parete vicina i segni ci sono ancora e sono interi. Quando ci passi accanto restano
      spenti. Da qualche parte, vicino al pavimento, si sente il fruscio delle membrane che vibrano, e poi un
      altro fruscio dall'altra parte. L'odore di Marea è più forte in basso, all'altezza delle ginocchia. Gli
      orecchianti cacciano a orecchio, e nel buio il vantaggio è tutto loro.

      {percezione Difficile} Sono due, e i loro fruscii non si spostano mai insieme. Uno sta fra te e la
      porta.
    opzioni:
      - testo: "Combattere nel buio"
        descrizione: "Due orecchianti, nel loro buio. Tu combatti a orecchio come loro, e loro sono più bravi."
        combattimento: torre-gli-orecchianti
        vittoria:
          titolo: Il silenzio nel buio
          testo: |
            Il secondo fruscio si spegne, e nella cassa resta soltanto il tuo respiro. Trovi la porta a
            tentoni e scendi verso la luce azzurra della scala. Alle tue spalle i segni della cassa restano
            spenti.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        sconfitta:
          titolo: Morsi nel buio
          testo: |
            Le creature ti mordono da parti che non vedi, e ogni volta che ti giri sono già altrove. Fra un
            morso e l'altro non fanno nessun rumore, e il fruscio lo senti solo dopo. Risali la scala a
            tentoni, con le gambe che sanguinano.
      - testo: "Muoversi senza rumore fino alla porta"
        descrizione: "Nel buio bisogna ricordare la sala come l'hai vista dalla soglia, e non far suonare niente."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Molto difficile }
        successo:
          titolo: A memoria
          testo: |
            Attraversi la cassa a memoria, un passo lento dopo l'altro, e passi a due palmi dall'orecchiante
            davanti alla porta senza che le sue membrane vibrino. Così vicino ne senti il calore, e il suo
            respiro va a tempo con il battito del fondo. Scendi a bocca chiusa e con il passo ancora lento.
          pe: { furtivita: 5 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Il passo sentito
          testo: |
            Un passo scricchiola, e le membrane vibrano tutte insieme. Torni indietro di corsa prima che i
            denti ti trovino.
          effetti: { tormento: 0.5, ferite: 0.5 }
      - testo: "Accendere una luce e passare in fretta"
        descrizione: "La luce non le ferma. Però si vede dove sono, e dove non sono."
        costo: 3
        esito:
          titolo: La luce in mano
          testo: |
            Accendi la lampada e attraversi la cassa di corsa, girando intorno agli orecchianti che si alzano
            al rumore. Le membrane restano girate verso i tuoi passi e mai verso la luce. Uno ti morde il
            polpaccio prima che tu arrivi alla porta, e lo scrolli via.
          effetti: { profondita.torre-anello-2: 1, ferite: 1 }

  # ------------------------------------------------------------ lo sfiato
  - id: torre-2-lo-sfiato
    immagine: icone/ringing-bell
    titolo: Lo sfiato
    sommario: "Dalla parete esce la bocca di un tubo che scarica nella cassa la voce della Campana, a colpi. Il colpo non muove l'aria, eppure chi lo prende finisce a terra."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 >= 6, profondita.torre-anello-2 <= 11]
    testo: |
      Nella parete di questa cassa si apre la bocca di un tubo largo quanto una botte, che arriva dalla canna.
      Ogni tanto il tubo scarica nella sala un colpo breve della voce della Campana che riempie la
      cassa da parete a parete e poi sparisce. Il colpo non muove l'aria. La polvere resta ferma e la fiamma
      della lampada non trema, eppure al primo colpo ti ritrovi con un ginocchio a terra e le orecchie che
      ronzano. La porta di sotto è dall'altra parte della sala, davanti alla bocca.

      Accanto alla bocca, nella parete, c'è un volante di metallo che governa una saracinesca. Davanti al tubo
      il pavimento di metallo è increspato in onde basse e dure come la sabbia battuta dal vento, e tutte le
      creste stanno dalla parte della porta.

      {tecnologia Difficile} La saracinesca chiude il tubo, e il volante gira solo nel silenzio fra un colpo e
      l'altro. Durante il colpo è duro come se fosse saldato.
    opzioni:
      - testo: "Chiudere la saracinesca"
        descrizione: "Il volante accanto alla bocca governa una saracinesca. Bisogna girarlo fra un colpo e l'altro, e capire da che parte."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La saracinesca chiusa
          testo: |
            Aspetti un colpo con la spalla contro la parete e poi giri il volante con tutte e due le mani, un
            raggio alla volta. Al terzo silenzio la saracinesca scende con un tonfo. Il colpo dopo arriva
            soffocato, come da dietro una porta, e attraversi la cassa sulle onde del pavimento.
          pe: { tecnologia: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Il volante dalla parte sbagliata
          testo: |
            Giri il volante dalla parte sbagliata e la saracinesca si apre del tutto. Il colpo che arriva ti
            stende sul pavimento, con le creste di metallo piantate nella schiena. Torni alla scala
            strisciando fra un colpo e l'altro.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Reggere i colpi e attraversare"
        descrizione: "Il colpo non spinge, eppure butta a terra chi non si tiene. Bisogna restare in piedi con le ginocchia morbide e camminare."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Difficile }
        successo:
          titolo: In piedi nella voce
          testo: |
            Attraversi la cassa a passi corti, e a ogni colpo pieghi le ginocchia e pianti i piedi fra le
            creste del pavimento. La voce ti passa attraverso dalle suole alla nuca. Arrivi alla porta in
            piedi, con le ginocchia che tremano per conto loro.
          pe: { resistenza: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: In ginocchio
          testo: |
            Al terzo colpo le ginocchia cedono e ti ritrovi a terra davanti alla bocca del tubo. Il colpo dopo
            ti arriva in faccia, e per un momento non senti più niente. Torni alla scala carponi, con un
            fischio in un orecchio solo.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Avanzare a sbalzi fra un colpo e l'altro"
        descrizione: "Un tratto per ogni silenzio, e a terra a ogni colpo con le mani sulle orecchie. Ci vuole tempo, e la voce arriva lo stesso."
        costo: 3
        esito:
          titolo: A sbalzi
          testo: |
            Attraversi la cassa un tratto alla volta, e a ogni colpo ti butti a terra con le mani premute
            sulle orecchie. Le creste del pavimento ti segnano i palmi. Arrivi alla porta con la voce della
            Campana che ti rimbomba ancora in testa, un colpo dopo l'altro, per tutta la scala.
          effetti: { profondita.torre-anello-2: 1, tormento: 1 }

  # ------------------------------------------------------------ la sala dei diapason
  - id: torre-2-la-sala-dei-diapason
    immagine: bestiario/salvaguardia-precursori
    titolo: La sala dei diapason
    sommario: "Le pareti della cassa sono coperte di rastrelliere con diapason di ogni misura. Il risonatore in mezzo alla sala si sveglia quando entri."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 >= 6, profondita.torre-anello-2 <= 11]
    testo: |
      Lungo le pareti di questa cassa corrono rastrelliere di metallo nero, e su ogni rastrelliera sono appesi
      dei diapason in fila. Il più piccolo starebbe in un pugno e il più grande è alto come un uomo, e ognuno
      pende dal suo gancio sopra un incavo sagomato a sua misura. Quando ne sfiori uno con l'unghia suona una
      nota pulita e lunga, e i vicini la riprendono piano. In mezzo alla sala c'è un risonatore alto due
      uomini, con il fusto piantato nel pavimento e la bocca chiusa da una grata. Appena metti piede nella
      cassa le sue punte cominciano a vibrare, e la grata si apre sulla voce della Campana.

      Nella rastrelliera più alta c'è un solo gancio vuoto. L'incavo sotto il gancio ha la sagoma di un
      diapason alto due uomini.

      {percezione Difficile} Quando la voce canta, uno dei diapason a metà parete risponde più forte di tutti
      gli altri, perché ha la sua stessa nota.
    opzioni:
      - testo: "Affrontare il risonatore"
        descrizione: "La macchina canta con la voce della Campana, e cento diapason le fanno eco dalle pareti."
        combattimento: torre-il-risonatore
        vittoria:
          titolo: Cento note
          testo: |
            Il colpo che gli spacca la grata strappa al risonatore una nota sola e altissima, e tutti i
            diapason delle rastrelliere la riprendono insieme. Quando la nota si spegne la macchina è ferma.
            Passi fra le rastrelliere, e quelli che sfiori vibrano ancora sotto le dita.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        sconfitta:
          titolo: L'eco delle rastrelliere
          testo: |
            La voce della Campana esce dalla grata e i diapason la ripetono da ogni parete, così che nella
            sala non c'è un punto dove non ti arrivi. Ti ritrovi sulla scala qualche giro più su, con le mani
            sulle orecchie. Il ronzio delle cento note ti resta in testa anche quando la scala torna muta.
      - testo: "Suonare il diapason con la sua nota"
        descrizione: "Sulle rastrelliere ce n'è uno con la stessa nota della voce. Suonati insieme, le due note si mangiano a vicenda."
        prova: { attributo: mentale, abilita: percezione, difficolta: Difficile }
        successo:
          titolo: Il gemello
          testo: |
            Batti i diapason con il pomo dell'arma uno dopo l'altro, ascoltando, finché uno a metà parete non
            canta la nota esatta della voce. Lo fai suonare forte, e la voce della Campana comincia a tremare
            a colpi sempre più lenti fino a spegnersi. Passi davanti al risonatore muto con il diapason
            gemello che ti vibra ancora in mano.
          pe: { percezione: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: La nota vicina
          testo: |
            Il diapason che scegli ha una nota appena più alta della voce. Le due note si urtano in un
            ondeggiare lento che ti fa girare la testa, e torni sulla scala con la nausea e le gambe molli.
          effetti: { tormento: 1 }
      - testo: "Correre sotto la voce fino alla porta"
        descrizione: "La porta è dietro il risonatore. Chi corre resta nella voce il meno possibile."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: Dentro la voce
          testo: |
            Corri verso la porta passando sotto la grata aperta, e la voce della Campana ti investe per il
            tempo di dieci passi. Arrivi alla soglia con la nota piantata dietro gli occhi, e ci resta per
            tutta la scala.
          pe: { atletica: 3 }
          effetti: { profondita.torre-anello-2: 1, tormento: 0.5 }
        fallimento:
          titolo: Il passo che si ferma
          testo: |
            Sotto la grata la voce ti prende alle ginocchia, e le gambe smettono di correre da sole. Torni
            indietro a quattro zampe, e i diapason delle rastrelliere ti cantano dietro la stessa nota finché
            non sei sulla scala.
          effetti: { tormento: 1.5 }
      - testo: "Passare rasente le rastrelliere"
        descrizione: "Lungo le pareti, lontano dalla grata, con le mani sui diapason perché non rispondano."
        costo: 3
        esito:
          titolo: Rasente il metallo
          testo: |
            Fai il giro della sala rasente le pareti, e con il palmo tieni ferma ogni fila di diapason che ti
            passa accanto. Sono tanti, e quelli che non arrivi a fermare cantano con la voce. Alla porta hai
            le mani intorpidite fino ai polsi e una nota in testa che ti accompagna per un piano intero.
          effetti: { profondita.torre-anello-2: 1, tormento: 1.5 }

  # ------------------------------------------------------------ la parete dei registri
  - id: torre-2-la-parete-dei-registri
    immagine: icone/sound-waves
    titolo: La parete dei registri
    sommario: "Una parete di canne di metallo suona un accordo che non cambia mai. Sotto le canne corre una fila di pomelli."
    luogo: Il campanile rovescio, le casse di risonanza
    area: torre-anello-2
    ripetibile: true
    requisiti: [profondita.torre-anello-2 >= 6, profondita.torre-anello-2 <= 11]
    testo: |
      Una parete intera di questa cassa è fatta di canne di metallo nero messe in fila per grandezza. Nella
      più larga ci starebbe un uomo in piedi, e la più stretta è grossa come un dito. Ognuna ha una bocca
      tagliata di sbieco a metà altezza, e da tutte esce un soffio continuo che suona. Le note insieme fanno
      un accordo fermo che dopo un poco senti nei denti più che nelle orecchie. Sotto le canne corre una fila
      di pomelli di metallo, uno per ogni canna. I loro gambi sono lucidi per il tratto che si può tirare
      fuori.
      La porta di sotto sta in fondo alla parete, dietro le canne più grandi.

      Una sola canna è muta. Se avvicini la mano alla sua bocca senti l'aria della cassa che ci entra dentro
      piano, senza fermarsi mai.

      {tecnologia Difficile} I pomelli chiudono il soffio delle canne come i registri di un organo. Chiuse le
      canne più grandi, l'accordo perde il fondo e smette di fare male.
    opzioni:
      - testo: "Chiudere i registri delle canne grandi"
        descrizione: "Ogni pomello chiude una canna. Bisogna capire quali sono quelli delle canne basse, e tirarli."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: L'accordo senza fondo
          testo: |
            Segui con gli occhi i tubi che salgono dai pomelli alle canne e tiri quelli delle più grandi, uno
            alla volta. A ogni registro l'accordo perde una nota bassa, e alla fine resta un fischio sottile
            che non fa male a nessuno. Mentre passi senti i pomelli rientrare da soli nella parete alle tue
            spalle, piano, ognuno con lo stesso scatto.
          pe: { tecnologia: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: La canna muta
          testo: |
            Tiri un pomello che non è di nessuna delle canne grandi, e la canna muta comincia a suonare. Fa
            una nota più bassa di tutte le altre, che senti nelle costole prima che nelle orecchie, e ti
            spinge fuori dalla cassa prima che tu riesca a rimettere a posto il pomello.
          effetti: { tormento: 1.5 }
      - testo: "Attraversare l'accordo con la testa ferma"
        descrizione: "L'accordo non cambia mai. Bisogna lasciarlo suonare e camminare fino alla porta."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: La testa ferma nell'accordo
          testo: |
            Cammini lungo la parete delle canne con gli occhi sulla porta, e l'accordo ti passa attraverso
            senza trovare appiglio. Davanti alle canne più grandi il soffio ti gonfia la giubba come una vela.
            Alla porta ti accorgi che stai canticchiando una delle note, e smetti.
          pe: { resilienza: 3 }
          effetti: { profondita.torre-anello-2: 1 }
        fallimento:
          titolo: Dentro l'accordo
          testo: |
            Davanti alle canne grandi l'accordo ti entra in testa e ci si sistema, e non riesci più a pensare
            ad altro che a quelle note. Torni alla scala con le mani premute sulle orecchie.
          effetti: { tormento: 1 }
      - testo: "Tirare i pomelli a manciate"
        descrizione: "Senza capire quali. Qualcuno chiuderà le canne giuste, e qualcuno no."
        costo: 2
        esito:
          titolo: A manciate
          testo: |
            Tiri i pomelli a manciate lungo tutta la parete, e a ogni strattone l'accordo cambia nota. Alla
            fine resta abbastanza basso da poter passare. Scendi con quelle note che ti cambiano in testa per
            un piano intero.
          effetti: { profondita.torre-anello-2: 1, tormento: 1 }
