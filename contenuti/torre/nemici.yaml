# I nemici del campanile rovescio (docs/piano-torre.md). Tarati con `npx tsx scripts/simula-fine.ts torre-` sul
# profilo «fine Campana» (Fisico 4, Armi da mischia 4, il Battente e le piastre del Campanaro): gregari fra il 55 e
# l'80%, ogni fase dei superboss fra il 35 e il 55%. Quel profilo batte il Campanaro quasi sempre: i nemici della torre
# stanno un gradino sopra. Le statistiche si cercano con `npx tsx scripts/strumenti/tara-nemici.ts`.
# - Anello 1, la scala delle corde: i rammendatori (in coppia), i rammendatori giovani (in tre), il suonatore impigliato (con la voce della
#   Campana), la Tessitrice in due fasi (sulla rete, senza rete).
# - Anello 2, le casse di risonanza: gli orecchianti (in coppia), il risonatore (con la voce della Campana), l'Uditore
#   in due fasi (nella cassa; nel silenzio, con la voce della Campana e la Maledizione).
# - Anello 3, la fonderia delle note: le scorie vive (in coppia), il versatore, la Colata in due fasi (nel crogiolo,
#   rappresa).
# - Anello 4, il battito: le sentinelle (in coppia), il pulsante, il Lettore in tre fasi (alla porta, senza volto, nel
#   battito con la Maledizione e la voce della Campana), ogni fase fra il 25 e il 40%.
nemici:
  # ------------------------------------------------------------ anello 1 · la scala delle corde
  - id: torre-rammendatore
    immagine: bestiario/salvaguardia-precursori
    nome: Rammendatore
    descrizione: "Una forma minore della Salvaguardia, un ragno di metallo nero grande come un cane da pastore. Corre lungo le corde della canna e le rammenda con un filo d'acciaio che gli esce dal ventre, e con lo stesso filo lega chi trova sulla sua strada."
    attacco: 7
    difesa: 4
    difesaMentale: 7
    pf: 21
    danno: 3
    riduzione: 6
    iniziativa: 4

  - id: torre-rammendatore-giovane
    immagine: bestiario/salvaguardia-precursori
    nome: Rammendatore giovane
    descrizione: "Un rammendatore appena uscito dal bozzolo, grande come un gatto, con le zampe ancora lucide e il filo d'acciaio sottile come un capello. Da solo scappa, ma i giovani girano sempre in tre e si muovono come una mano sola."
    attacco: 6
    difesa: 5
    difesaMentale: 6
    pf: 13
    danno: 4
    riduzione: 5
    iniziativa: 5

  - id: torre-suonatore-impigliato
    immagine: ambientazione/mito-salvaguardia-precursori
    nome: Suonatore impigliato
    descrizione: "Una figura di Marea Grigia rimasta presa fra le corde della canna, con le braccia ancora alzate come per tirarle. È la memoria di qualcuno che suonava la Campana e cadde, e combatte con la voce della Campana che gli è rimasta in gola."
    attacco: 8
    difesa: 4
    difesaMentale: 5
    pf: 29
    danno: 4
    riduzione: 4
    iniziativa: 3
    magia: 5
    energia: 6
    incantesimi: [campana-la-voce-della-campana]

  - id: torre-tessitrice-sulla-rete
    immagine: bestiario/salvaguardia-precursori
    nome: La Tessitrice, sulla rete
    descrizione: "Una forma della Salvaguardia che il Codex non conosce, un ragno con otto braccia sottili e una maschera bianca senza bocca, grande quanto una carrozza. Sta al centro della rete che chiude la canna sotto il nono piano e sente ogni filo che tocchi."
    attacco: 9
    difesa: 6
    difesaMentale: 8
    pf: 36
    danno: 3
    riduzione: 6
    iniziativa: 5

  - id: torre-tessitrice-senza-rete
    immagine: bestiario/salvaguardia-precursori
    nome: La Tessitrice, senza rete
    descrizione: "Con la rete strappata la Tessitrice combatte sul pavimento del decimo piano, appoggiata su sei braccia e con le altre due alzate. Le giunture sono scoperte, e ogni colpo che manca lascia sulla pietra un filo d'acciaio che ti si avvolge alle caviglie."
    attacco: 7
    difesa: 4
    difesaMentale: 8
    pf: 52
    danno: 3
    riduzione: 8
    iniziativa: 3

  # ------------------------------------------------------------ anello 2 · le casse di risonanza
  - id: torre-orecchiante
    immagine: icone/sound-waves
    nome: Orecchiante
    descrizione: "Una creatura pallida cresciuta nella Marea delle casse, grande come un cane da guardia e senza occhi. Su tutto il corpo ha membrane tese come la pelle di un tamburo, e caccia ascoltando i passi e il battito del cuore di chi passa."
    attacco: 7
    difesa: 5
    difesaMentale: 5
    pf: 18
    danno: 3
    riduzione: 6
    iniziativa: 5

  - id: torre-risonatore
    immagine: bestiario/salvaguardia-precursori
    nome: Risonatore
    descrizione: "Una macchina dei Precursori a forma di diapason, alta due uomini, con le due punte che vibrano così in fretta da sembrare sfocate. Sotto le punte ha una bocca chiusa da una grata, e dalla bocca esce la voce della Campana."
    attacco: 5
    difesa: 4
    difesaMentale: 8
    pf: 20
    danno: 3
    riduzione: 6
    iniziativa: 2
    magia: 6
    energia: 4
    incantesimi: [campana-la-voce-della-campana]

  - id: torre-uditore-nella-cassa
    immagine: ambientazione/mito-salvaguardia-precursori
    nome: L'Uditore, nella cassa
    descrizione: "Una massa di carne grigia grande quanto una casa, cresciuta per secoli dentro la cassa più grande del campanile e nutrita dal suono della Campana. Non ha occhi né bocca, e su tutto il corpo ha migliaia di membrane tese come timpani. Nella sua cassa sente ogni movimento prima che accada, e combatte con le corde e con i fasci di carne."
    attacco: 9
    difesa: 5
    difesaMentale: 7
    pf: 44
    danno: 3
    riduzione: 6
    iniziativa: 4

  - id: torre-uditore-nel-silenzio
    immagine: ambientazione/mito-salvaguardia-precursori
    nome: L'Uditore, nel silenzio
    descrizione: "Staccato dalla sua cassa l'Uditore è sordo, e la sordità lo fa impazzire. Si trascina sui fasci di carne e grida con la voce della Campana, che cerca i ricordi di chi gli sta intorno."
    attacco: 9
    difesa: 4
    difesaMentale: 9
    pf: 30
    danno: 3
    riduzione: 6
    iniziativa: 3
    magia: 7
    energia: 5
    incantesimi: [maledizione, campana-la-voce-della-campana]

  # ------------------------------------------------------------ anello 3 · la fonderia delle note
  - id: torre-scoria-viva
    immagine: icone/dig-hole
    nome: Scoria viva
    descrizione: "Un grumo di scoria nera grande come una botte, avanzo di secoli di colate, con il bronzo ancora caldo che brilla fra le crepe. Dentro il metallo si muove una nebbia grigia, la Marea presa nella colata mentre si raffreddava, e lo fa rotolare verso tutto quello che è vivo."
    attacco: 7
    difesa: 4
    difesaMentale: 6
    pf: 26
    danno: 3
    riduzione: 5
    iniziativa: 3

  - id: torre-versatore
    immagine: bestiario/salvaguardia-precursori
    nome: Versatore
    descrizione: "Una macchina della fonderia alta quanto una casa, su quattro gambe di ferro, che porta un crogiolo di bronzo fuso appeso a due braccia. Va da un forno a uno stampo e versa, e da quando nessuno le dice più dove versare lo fa su tutto quello che si muove."
    attacco: 7
    difesa: 4
    difesaMentale: 8
    pf: 36
    danno: 4
    riduzione: 8
    iniziativa: 2

  - id: torre-colata-nel-crogiolo
    immagine: ambientazione/mito-salvaguardia-precursori
    nome: La Colata, nel crogiolo
    descrizione: "Il bronzo fuso del crogiolo grande, che non si è mai raffreddato e si alza in una forma alta tre uomini. Sul petto e sulle braccia ha decine di facce, i fonditori che la Marea ha portato nel metallo, e cantano tutte insieme a bocca chiusa."
    attacco: 9
    difesa: 5
    difesaMentale: 8
    pf: 46
    danno: 3
    riduzione: 6
    iniziativa: 3

  - id: torre-colata-rappresa
    immagine: ambientazione/mito-salvaguardia-precursori
    nome: La Colata, rappresa
    descrizione: "Raffreddata di fuori, la Colata è una forma di metallo scuro e pesante, con le facce del coro chiuse nel bronzo come mosche nell'ambra. A ogni passo si crepa, e dalle crepe esce il bronzo ancora fuso di dentro."
    attacco: 8
    difesa: 3
    difesaMentale: 8
    pf: 42
    danno: 2
    riduzione: 9
    iniziativa: 2

  # ------------------------------------------------------------ anello 4 · il battito
  - id: torre-sentinella
    immagine: bestiario/salvaguardia-precursori
    nome: Sentinella del sigillo
    descrizione: "Una forma minore della Salvaguardia, alta come un uomo e magra come una lancia, con le braccia che finiscono in lame. Al posto della faccia ha una piastra liscia con quattro incavi a forma di maschera, e cerca negli incavi la Maschera di chi passa."
    attacco: 7
    difesa: 5
    difesaMentale: 8
    pf: 22
    danno: 2
    riduzione: 6
    iniziativa: 4

  - id: torre-pulsante
    immagine: ambientazione/mito-salvaguardia-precursori
    nome: Pulsante
    descrizione: "Una massa di Marea Grigia grande come un toro, senza forma fissa, che vive nel battito del fondo. A ogni battito si gonfia del doppio e allunga le braccia fino alle pareti, e fra un battito e l'altro resta raccolta come un cane che dorme."
    attacco: 8
    difesa: 3
    difesaMentale: 5
    pf: 47
    danno: 4
    riduzione: 6
    iniziativa: 2

  - id: torre-lettore-alla-porta
    immagine: bestiario/salvaguardia-precursori
    nome: Il Lettore, alla porta
    descrizione: "La forma della Salvaguardia che legge le Maschere ai sigilli, alta il doppio di un uomo, con un libro di metallo in mano e una piastra liscia al posto della faccia. Ha letto ogni passo che hai fatto nel campanile, e combatte sapendo che cosa farai."
    attacco: 8
    difesa: 6
    difesaMentale: 10
    pf: 33
    danno: 3
    riduzione: 8
    iniziativa: 4

  - id: torre-lettore-senza-volto
    immagine: bestiario/salvaguardia-precursori
    nome: Il Lettore, senza volto
    descrizione: "Senza la piastra il Lettore ha al posto della faccia un vuoto bianco come una pagina, e nel vuoto compaiono scritte le cose che hai fatto. È più svelto e più crudele, e ti aspetta dove stai andando."
    attacco: 9
    difesa: 5
    difesaMentale: 9
    pf: 40
    danno: 3
    riduzione: 7
    iniziativa: 5

  - id: torre-lettore-nel-battito
    immagine: ambientazione/mito-salvaguardia-precursori
    nome: Il Lettore, nel battito
    descrizione: "Il Lettore con la luce del sigillo nel petto. Il battito del fondo adesso è il suo, e a ogni battito cresce e la voce della Campana gli esce dal petto."
    attacco: 7
    difesa: 4
    difesaMentale: 10
    pf: 50
    danno: 3
    riduzione: 5
    iniziativa: 3
    magia: 7
    energia: 8
    incantesimi: [maledizione, campana-la-voce-della-campana]

