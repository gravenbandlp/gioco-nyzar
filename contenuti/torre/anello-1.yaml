# Il campanile rovescio, anello 1: la scala delle corde, piani 1-10 (docs/piano-torre.md, blocco 1). Ci si scende dalla
# scala della canna (sblocco.yaml). La ritirata e la sconfitta riportano alla Superficie e azzerano la profondità; il
# progresso fra gli anelli resta in torre.anello. A ogni discesa le stanze cambiano (`rimescola: torre.discese`).
# - area `torre-anello-1`: soglia 9, tre stanze visibili, venti stanze ripetibili in tre fasce di profondità:
#   piani 1-3 (profondità 0-2): la scala senza ringhiera, il ballatoio sospeso, le corde che suonano, i rammendatori,
#     la gabbia del montacarichi, il pianerottolo crollato, i segni azzurri;
#   piani 4-6 (profondità 3-5): la prima rete, il suonatore impigliato, il bozzolo, la nicchia dei suonatori (il
#     ristoro, solo a profondità 4-5), il contrappeso, la scala che oscilla, la campanella;
#   piani 7-9 (profondità 6-8, anello-1-fondo.yaml): la porta dei quattro volti (le Maschere), il filo d'argento, il
#     nido dei bozzoli, la corda sul vuoto, la trama, le sagome nella trama.
#   Ogni stanza ha una prova Difficile, una Molto difficile o un combattimento, e una via senza prova da 2 o 3 rintocchi
#   con Ferite, Tormento o Contaminazione. Nelle stanze solo PE.
# - il cuore a profondità 9, il decimo piano (anello-1-fondo.yaml): la Tessitrice in due fasi, poi il fuso con La Nota
#   Lunga (una volta sola), PE e lyssan; torre.anello almeno 1.
# Origini: apprendista-raschiatore (il pianerottolo), figlio-della-citta-bassa (il montacarichi), accolito-del-velo (i
# segni), figlio-del-circolo (la rete), fuggiasco-di-ghoran (il bozzolo), allievo-di-torvessa (la scala che oscilla),
# mercante-dei-ponti (la corda sul vuoto), rampollo-dei-quartieri-alti (le sagome).
aree:
  - id: torre-anello-1
    immagine: ambientazione/mito-salvaguardia-precursori
    nome: La scala delle corde
    sommario: "I primi dieci piani del campanile rovescio, con una scala a chiocciola senza ringhiera che gira intorno alla canna fra corde di metallo tese nel vuoto."
    spedizione: { ritorno: superficie-fratturata, soglia: 9, stanze: 3, rimescola: torre.discese, piani: 0 }
    testo: |
      La scala scende lungo la parete della canna, un giro dopo l'altro, e a ogni giro una porta bassa dà su
      un piano. I gradini sono lastre di metallo nero incastrate nella parete senza un bullone, e le porte
      sono basse e larghe il doppio di una porta di casa. Al centro del pozzo pendono corde di metallo grosse
      come un polso, tese fra le pareti e i ballatoi, e a ogni passo ne senti una vibrare da qualche parte
      sopra o sotto di te.

      I segni azzurri lungo i gradini si accendono quando ci passi accanto. Quelli dei piani più in basso
      restano spenti, e il battito che sale dal fondo è appena più forte di quanto fosse in cima.

colonna:
  - { contesto: area, id: torre-anello-1, musica: unsettling-paths, ambiente: dungeon }

storylet:
  # ================================================================ piani 1-3 (profondità 0-2)
  # ------------------------------------------------------------ la scala senza ringhiera
  - id: torre-1-la-scala-senza-ringhiera
    immagine: icone/stairs
    titolo: La scala senza ringhiera
    sommario: "Per un giro intero mancano i gradini a uno a uno, e quelli che restano sono larghi un piede."
    luogo: Il campanile rovescio, la scala delle corde
    area: torre-anello-1
    ripetibile: true
    requisiti: [profondita.torre-anello-1 <= 2]
    testo: |
      Per un giro intero la scala perde i gradini a uno a uno, come una bocca vecchia perde i denti. Quelli
      che restano sono larghi un piede e sporgono dalla parete senza appoggio. Fra l'uno e l'altro c'è il
      vuoto della canna. Dove un gradino manca resta nella parete il suo incastro, un buco squadrato con gli
      spigoli ancora vivi.

      Sotto di te le corde vibrano piano. Quando ne tocchi una con la punta dello stivale, il suono scende giù
      per il pozzo e ci mette molto a finire.
    opzioni:
      - testo: "Saltare da un gradino all'altro"
        descrizione: "Un passo lungo, poi un altro, senza fermarsi. Chi si ferma sul gradino sbagliato ci resta a pensare."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Il ritmo dei salti
          testo: |
            Trovi il ritmo al terzo salto, e da lì i gradini arrivano sotto i piedi quando li cerchi. Ognuno
            si muove appena nel suo incastro quando ci atterri, e tu sei già sul prossimo prima di sentirlo.
            In fondo al giro ti volti a guardarli e ti sembrano più distanti di come li hai saltati.
          pe: { atletica: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: La caviglia
          testo: |
            Un gradino si inclina sotto il tuo peso e la caviglia si piega con lui. Ti aggrappi alla parete
            con le unghie e resti lì finché il cuore non rallenta, poi torni indietro un salto alla volta.
            Quando ripassi accanto al gradino di prima lo trovi di nuovo dritto nel suo incastro.
          effetti: { ferite: 1 }
      - testo: "Scendere lungo una corda"
        descrizione: "Una delle corde passa vicino alla scala e scende dritta fino al giro di sotto. È di metallo, e il metallo scivola."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Molto difficile }
        successo:
          titolo: Le mani sul metallo
          testo: |
            Ti avvolgi le mani nella giubba e scendi a forza di braccia, con la corda che ronza contro il
            petto. La corda è un intreccio di fili d'acciaio, e attraverso la stoffa senti le spire passarti
            sotto le dita. Arrivi sul giro di sotto con le spalle che bruciano e le mani intere.
          pe: { resistenza: 5 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Le mani aperte
          testo: |
            A metà corda le mani scivolano e scendi di colpo per due braccia, prima di fermarti con le
            ginocchia. Risali sulla scala con i palmi scorticati. Alle tue spalle la corda continua a ronzare
            per un pezzo dopo che l'hai lasciata.
          effetti: { ferite: 1.5 }
      - testo: "Camminare piano contro la parete"
        descrizione: "Un gradino alla volta, con la schiena incollata alla pietra e lo sguardo lontano dal vuoto."
        costo: 2
        esito:
          titolo: Contro la pietra
          testo: |
            Scendi di lato, un gradino alla volta, con la schiena contro la parete e le mani aperte sulla
            pietra. La parete è liscia e fredda, senza una crepa dove infilare le dita. Ci metti il tempo di
            tre giri, e per tutto il tempo il vuoto ti tira per la giubba.
          effetti: { profondita.torre-anello-1: 1, tormento: 0.5 }

  # ------------------------------------------------------------ il ballatoio sospeso
  - id: torre-1-il-ballatoio-sospeso
    immagine: icone/rope-bridge
    titolo: Il ballatoio sospeso
    sommario: "La scala finisce su un ballatoio appeso a quattro corde, in mezzo alla canna. Una delle quattro è sfilacciata."
    luogo: Il campanile rovescio, la scala delle corde
    area: torre-anello-1
    ripetibile: true
    requisiti: [profondita.torre-anello-1 <= 2]
    testo: |
      Qui la scala smette di seguire la parete e finisce su un ballatoio rotondo, appeso in mezzo alla canna a
      quattro corde di metallo. Dall'altra parte del ballatoio la scala ricomincia. Il pavimento del ballatoio
      è una lastra di metallo nero traforata, e dai fori vedi le corde della canna scendere nel buio. Il
      ballatoio dondola appena sotto il tuo peso, e una delle quattro corde è sfilacciata vicino all'aggancio,
      con i fili d'acciaio aperti come una spazzola. Le punte dei fili rotti sono lucide e senza un velo di
      ruggine.

      {origine allievo-di-torvessa} All'Accademia ti hanno insegnato a contare i fili rotti di un cavo prima
      di fidarti. Qui ne manca più di un terzo.
    opzioni:
      - testo: "Attraversare dal lato opposto alla corda rotta"
        descrizione: "Se il peso sta lontano dalla corda sfilacciata, forse regge. Bisogna camminare leggeri e in fretta."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Difficile }
        successo:
          titolo: Leggero
          testo: |
            Attraversi lungo il bordo opposto, con il peso sulle punte. A ogni passo la corda sfilacciata
            scricchiola dall'altra parte del ballatoio. Il ballatoio si inclina appena verso di te e torna
            dritto quando metti piede sulla scala.
          pe: { acrobazia: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Lo scossone
          testo: |
            A metà strada la corda rotta perde un altro filo e il ballatoio si inclina di colpo. Il filo cade
            nella canna con un fischio che si allontana, e non lo senti toccare il fondo. Scivoli contro il
            parapetto e ci batti le costole, e torni indietro a quattro zampe.
          effetti: { ferite: 1 }
      - testo: "Bloccare l'aggancio prima di passare"
        descrizione: "L'aggancio ha una vite di fermo. Stringerla vuol dire lavorare sopra il vuoto con una mano sola."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La vite di fermo
          testo: |
            Trovi la vite sotto la ruggine e la stringi con il manico del coltello, mezzo giro alla volta.
            Sotto la crosta la filettatura è pulita e precisa, e la vite entra senza gioco. La corda smette di
            scricchiolare, e attraversi il ballatoio come una piazza.
          pe: { tecnologia: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: La vite che gira a vuoto
          testo: |
            La vite gira a vuoto, perché sotto la ruggine la filettatura è spanata. La corda perde un filo che
            ti passa accanto alla guancia come una frusta. Ti tocchi la faccia e le dita tornano rosse.
          effetti: { ferite: 1 }
      - testo: "Aspettare che il ballatoio smetta di dondolare"
        descrizione: "Seduto sull'ultimo gradino, finché il ballatoio non sta fermo. Poi una corsa."
        costo: 2
        esito:
          titolo: La corsa
          testo: |
            Aspetti sedut{o|a} a lungo sull'ultimo gradino. Ogni volta che il ballatoio sta per fermarsi una
            vibrazione delle corde lo rimette in moto, e alla fine si ferma del tutto. Lo attraversi di corsa.
            Dall'altra parte ti accorgi che hai le mani strette a pugno da quando sei partit{o|a}.
          effetti: { profondita.torre-anello-1: 1, tormento: 0.5 }

  # ------------------------------------------------------------ le corde che suonano
  - id: torre-1-le-corde-che-suonano
    immagine: icone/rope-coil
    titolo: Le corde che suonano
    sommario: "Una foresta di corde tese attraversa il piano. Ognuna, se la tocchi, manda una nota diversa giù per la canna."
    luogo: Il campanile rovescio, la scala delle corde
    area: torre-anello-1
    ripetibile: true
    requisiti: [profondita.torre-anello-1 <= 2]
    testo: |
      Il piano è attraversato da corde tese dal pavimento al soffitto, fitte come i fusti di un canneto.
      Quando ne sfiori una per caso manda una nota pulita, che scende giù per la canna e torna su più bassa.
      Da sotto qualcosa risponde con un fruscio di metallo.

      Fra le corde c'è un passaggio stretto che gira su se stesso, largo appena quanto le spalle. Alcune corde
      sono più scure delle altre e non vibrano. Sono coperte da uno strato opaco che cede appena sotto
      l'unghia, e ti dici che è il grasso e lo sporco di molti anni. Le corde chiare invece sono lucide
      all'altezza del petto, dove le mani di chi passava le hanno toccate per anni.
    opzioni:
      - testo: "Passare toccando solo le corde mute"
        descrizione: "Quelle scure non suonano. Bisogna riconoscerle al buio e infilarsi fra loro."
        prova: { attributo: mentale, abilita: percezione, difficolta: Difficile }
        successo:
          titolo: Il canneto muto
          testo: |
            Ti muovi da una corda scura all'altra appoggiandoci la spalla, e attraversi il piano senza una nota.
            Sotto, il fruscio resta lontano.
          pe: { percezione: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: La nota sbagliata
          testo: |
            Una corda chiara ti prende il gomito e manda una nota lunga, che ti entra nei denti. Il fruscio
            sale di un piano, e torni indietro prima che arrivi. Alle tue spalle il fruscio diventa un
            ticchettio di molte punte sottili sul metallo.
          effetti: { tormento: 1 }
      - testo: "Tenere ferme le corde con le mani"
        descrizione: "Una corda che non vibra non suona. Basta stringerla mentre passi, e stringerle tutte."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Molto difficile }
        successo:
          titolo: Le mani piene di corde
          testo: |
            Afferri ogni corda prima di sfiorarla e la stringi finché non sei passat{o|a}. Anche ferma ogni
            corda ti formicola nel palmo, e il formicolio ti sale fino al gomito. Dall'altra parte hai le dita
            intorpidite e il canneto alle spalle in silenzio.
          pe: { resistenza: 5 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Il ronzio
          testo: |
            Le corde ti vibrano nelle mani e il ronzio ti sale lungo le braccia fino alla testa. Le lasci
            andare tutte insieme, e il piano si riempie di note. Le note scendono nella canna una sopra
            l'altra, e da sotto il fruscio risponde a tutte.
          effetti: { tormento: 1 }
      - testo: "Tapparsi le orecchie e passare"
        descrizione: "Le note arriveranno comunque. Con le orecchie piene di stoffa arrivano meno."
        costo: 3
        esito:
          titolo: Il canneto che canta
          testo: |
            Ti infili due pezzi di stoffa nelle orecchie e attraversi il canneto senza badare alle corde. Le
            note ti arrivano lo stesso, dalle ossa invece che dalle orecchie, e le senti nella mascella prima
            che nella testa. Il fruscio di sotto ti segue per un piano.
          effetti: { profondita.torre-anello-1: 1, tormento: 1 }

  # ------------------------------------------------------------ i rammendatori
  - id: torre-1-i-rammendatori
    immagine: icone/spider-web
    titolo: I rammendatori
    sommario: "Due ragni di metallo nero stanno riparando una corda spezzata in mezzo al passaggio."
    luogo: Il campanile rovescio, la scala delle corde
    area: torre-anello-1
    ripetibile: true
    requisiti: [profondita.torre-anello-1 <= 2]
    testo: |
      In mezzo al passaggio una corda spezzata pende dal soffitto, e due ragni di metallo nero grandi come
      cani la stanno riparando. Dal ventre gli esce un filo d'acciaio sottile, e lo intrecciano con le zampe
      davanti mentre stanno appesi con quelle dietro. Il tratto che hanno già rifatto è lungo un braccio, e
      l'intreccio è così regolare che non vedi dove finisce la corda vecchia. Hanno una piccola maschera
      bianca senza bocca, come quella della Salvaguardia che i Raschiatori raccontano.

      {tecnologia Difficile} Rammendano solo quello che è rotto, e finché la corda non è finita non si
      accorgono di niente. Le zampe davanti ripetono sempre lo stesso giro, e il ticchettio delle punte tiene
      il tempo.
    opzioni:
      - testo: "Attaccare i ragni"
        descrizione: "Sono due, e duri come incudini. Mentre lavorano sono girati di spalle."
        combattimento: torre-i-rammendatori
        vittoria:
          titolo: Il filo che pende
          testo: |
            Il secondo ragno cade dalla corda con le zampe raccolte e resta a terra come un pugno chiuso. Il
            filo d'acciaio gli pende ancora dal ventre, e lo scavalchi per passare. Il filo continua a uscire
            piano, un dito alla volta, anche dopo che il ragno ha smesso di muoversi.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        sconfitta:
          titolo: Legat{o|a}
          testo: |
            Un ragno ti salta sulle spalle e l'altro ti gira intorno alle gambe con il filo. Il ragno sulle
            spalle è pesante e freddo, e le punte delle zampe ti trovano le cuciture della giubba. Ti liberi a
            colpi di coltello e risali la scala zoppicando, e loro tornano alla corda come se non fossi mai
            passat{o|a}.
      - testo: "Passare dietro di loro mentre lavorano"
        descrizione: "Sono occupati. Basta non fare rumore e non toccare la corda rotta."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Alle loro spalle
          testo: |
            Passi alle spalle dei ragni a un braccio di distanza, e il ticchettio delle loro zampe copre i
            tuoi passi. Da vicino il filo nuovo manda un odore di olio caldo. Non si voltano nemmeno quando
            sei già sulla scala.
          pe: { furtivita: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Il filo teso
          testo: |
            Inciampi in un filo che non avevi visto, e i due ragni si girano insieme, con le maschere bianche
            alla stessa altezza. Uno ti morde il polpaccio prima che tu riesca a tornare sulla scala. Il morso
            è di due punte d'acciaio che entrano ed escono senza strappare.
          effetti: { ferite: 1 }
      - testo: "Rompere un'altra corda per tenerli occupati"
        descrizione: "Se rammendano tutto ciò che è rotto, una corda spezzata più in là li porta lontano dal passaggio."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il lavoro nuovo
          testo: |
            Tagli una corda sottile in fondo al piano e la lasci cadere. La corda cade quasi senza rumore, e i
            ragni lasciano subito quella che stavano rammendando per correre verso la nuova. Il passaggio è
            libero, e dietro di te la corda vecchia resta a metà.
          pe: { tecnologia: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: La corda sbagliata
          testo: |
            La corda che tagli regge un pezzo del soffitto, e il soffitto ti piove addosso in sassi neri. I
            ragni arrivano a rammendare anche quello e ricuciono la crepa con il filo un sasso alla volta, e
            tu ti togli di mezzo con un sasso piantato nella spalla.
          effetti: { ferite: 1 }
      - testo: "Aspettare che finiscano la corda"
        descrizione: "Quando la corda sarà intera i ragni andranno altrove, e non è detto che sia presto."
        costo: 3
        esito:
          titolo: La corda intera
          testo: |
            Aspetti accucciat{o|a} sulla scala mentre i ragni intrecciano, filo dopo filo, finché la corda non
            è intera. Quando è finita la provano con una zampa, e la nota è uguale a quella delle altre. Se ne
            vanno su per la canna senza voltarsi, e le gambe ti si sono addormentate.
          effetti: { profondita.torre-anello-1: 1, tormento: 0.5 }

  # ------------------------------------------------------------ la gabbia del montacarichi
  - id: torre-1-la-gabbia-del-montacarichi
    immagine: icone/hole-ladder
    titolo: La gabbia del montacarichi
    sommario: "Una gabbia di metallo appesa a una catena è bloccata fra due piani, con la porta aperta sul vuoto."
    luogo: Il campanile rovescio, la scala delle corde
    area: torre-anello-1
    ripetibile: true
    requisiti: [profondita.torre-anello-1 <= 2]
    testo: |
      Una gabbia di metallo nero, grande quanto una stanza da letto, pende da una catena in mezzo alla canna.
      È bloccata fra due piani, con la porta aperta, e dentro c'è una leva rivolta verso il basso. Le sbarre
      sono fuse in un pezzo solo con il pavimento, e non c'è un chiodo da nessuna parte. Qui la scala è
      crollata per mezzo giro, e la gabbia è l'unico modo di scendere che vedi.

      {origine figlio-della-citta-bassa} Gli argani delle cave della Città Bassa li conosci fin da
      bambin{o|a}. Questo ha lo stesso freno a cricchetto, solo più grande.
    opzioni:
      - testo: "Rimettere in moto il montacarichi"
        descrizione: "La leva è bloccata. Il meccanismo sopra la gabbia si raggiunge dal tetto, sporgendosi."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il cricchetto
          testo: |
            Sblocchi il cricchetto con un colpo secco del tallone e la gabbia scende di un piano, lenta, con
            la catena che canta sopra di te. Si ferma da sola davanti a una porta bassa, con il pavimento
            allineato alla soglia senza un dito di scarto.
          pe: { tecnologia: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: La caduta di un braccio
          testo: |
            Il cricchetto salta tutto insieme e la gabbia cade per un braccio prima che il freno la riprenda.
            Lo strappo fa vibrare tutta la catena, e il suono sale nel buio di sopra e ci resta a lungo.
            Sbatti contro le sbarre, e risali sul pianerottolo con la testa che gira.
          effetti: { ferite: 1 }
      - testo: "Scendere lungo la catena"
        descrizione: "La catena ha maglie grandi come mani. Ci si scende come su una scala, se le braccia reggono."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: Maglia dopo maglia
          testo: |
            Scendi una maglia alla volta, con i piedi infilati negli anelli, fino al piano di sotto. Le maglie
            sono scure fuori e lucide dentro, dove si mordono l'una con l'altra. La catena ti lascia sulle
            mani un odore di ferro che non se ne va per ore.
          pe: { atletica: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: La maglia unta
          testo: |
            Una maglia è unta di qualcosa di nero e il piede ci scivola sopra. Resti appes{o|a} per le mani
            sopra il vuoto, e risali con le braccia che tremano. Sulla suola ti resta la roba nera, ancora
            tiepida.
          effetti: { ferite: 1, tormento: 0.5 }
      - testo: "Liberare il freno come alle cave"
        descrizione: "Il freno a cricchetto degli argani di casa si libera tirando il nottolino di lato, senza forzare."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Come a casa
          testo: |
            Tiri il nottolino di lato come ti ha insegnato tuo padre, e il freno si apre con un sospiro. Il
            nottolino è lungo quanto il tuo avambraccio e dietro ha la stessa molla di casa, solo più grossa.
            La gabbia scende piano fino al piano di sotto, come un carico di pietre che non deve rompersi.
          pe: { tecnologia: 5 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Un altro nottolino
          testo: |
            Il nottolino non è dove dovrebbe essere, e mentre lo cerchi la gabbia sobbalza e ti schiaccia le dita
            contro la sbarra.
          effetti: { ferite: 1 }
      - testo: "Saltare nella gabbia e lasciarla cadere"
        descrizione: "Se il peso è abbastanza, la gabbia scende da sola. Quanto e come, si vedrà."
        costo: 2
        esito:
          titolo: La gabbia che cade
          testo: |
            Salti dentro e la gabbia cade di colpo, la catena che urla, finché il freno non la ferma con uno
            strappo che ti butta in ginocchio. Mentre cadi i segni azzurri della parete si accendono in fila
            fra una sbarra e l'altra. Esci dalla porta un piano più in basso, con i denti che battono.
          effetti: { profondita.torre-anello-1: 1, ferite: 1 }

  # ------------------------------------------------------------ il pianerottolo crollato
  - id: torre-1-il-pianerottolo-crollato
    immagine: icone/dig-hole
    titolo: Il pianerottolo crollato
    sommario: "Il pianerottolo davanti alla porta del piano è crollato. Dall'altra parte del buco la scala continua."
    luogo: Il campanile rovescio, la scala delle corde
    area: torre-anello-1
    ripetibile: true
    requisiti: [profondita.torre-anello-1 <= 2]
    testo: |
      Il pianerottolo davanti alla porta del piano non c'è più. Al suo posto si apre un buco largo due passi
      lunghi, con i bordi di metallo strappati verso il basso come carta, e la scala continua dall'altra
      parte. Il metallo è spesso due dita. Ti dici che dall'alto è caduto qualcosa di molto pesante, anche se
      sui gradini di sopra non c'è un graffio.

      Sopra il buco, all'altezza della testa, corre una delle corde della canna. Più in là, contro la parete,
      la roccia è piena di crepe.
    opzioni:
      - testo: "Saltare il buco"
        descrizione: "Due passi lunghi con la rincorsa di tre gradini. Dall'altra parte il bordo è storto."
        prova: { attributo: fisico, abilita: atletica, difficolta: Molto difficile }
        successo:
          titolo: Il bordo storto
          testo: |
            Prendi la rincorsa e salti, e atterri con un piede sul bordo e l'altro nel vuoto. Il bordo storto
            si piega ancora un poco sotto il tuo peso. Ti butti in avanti e rotoli sui gradini, con il cuore
            in gola e niente di rotto.
          pe: { atletica: 5 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Il bordo
          testo: |
            Atterri corto, con le braccia sul bordo e le gambe nel vuoto. Per tutto il tempo che resti
            appes{o|a} dal buco sale un'aria tiepida che sa di metallo. Ti tiri su graffiandoti sul metallo
            strappato, ma dalla parte da cui eri partit{o|a}.
          effetti: { ferite: 1.5 }
      - testo: "Attraversare appes{o|a} alla corda"
        descrizione: "Una mano dopo l'altra, con le gambe che penzolano. La corda vibra a ogni presa."
        prova: { attributo: fisico, abilita: [acrobazia, resistenza], difficolta: Difficile }
        successo:
          titolo: Mano dopo mano
          testo: |
            Attraversi appes{o|a} alla corda, una mano dopo l'altra, e la corda manda una nota a ogni presa.
            Ogni nota è più alta di quella prima. Ti lasci cadere dall'altra parte, e la nota si allontana giù
            per la canna.
          pe: { acrobazia: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: La nota nelle mani
          testo: |
            A metà strada la corda vibra così forte che le dita si aprono da sole. Ti riprendi con un braccio
            solo e torni indietro, con la spalla che fa male a ogni respiro. Per un po' le dita ti formicolano
            tanto che non riesci a chiuderle.
          effetti: { ferite: 1, tormento: 0.5 }
      - testo: "Fare come sulle piattaforme"
        descrizione: "I Raschiatori passano i buchi delle impalcature saltando di traverso, verso il punto dove il bordo regge."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il passo di traverso
          testo: |
            Non salti dritto. Salti di traverso verso la parete, dove il bordo è ancora inchiodato alla
            roccia, come sulle impalcature della Cicatrice. I chiodi sono di un metallo senza ruggine e la
            roccia intorno non ha una crepa. Il metallo regge, e i tuoi vecchi istruttori sarebbero contenti.
          pe: { acrobazia: 5 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Il bordo che cede
          testo: |
            Il bordo che sulle impalcature avrebbe retto qui si piega sotto il piede. Ti aggrappi alla parete e torni
            indietro.
          effetti: { ferite: 1 }
      - testo: "Arrampicarsi lungo le crepe della parete"
        descrizione: "Lenti, aggrappati alla roccia. Le crepe tengono, ma tagliano."
        costo: 3
        esito:
          titolo: Le crepe
          testo: |
            Giri intorno al buco aggrappat{o|a} alle crepe della parete, con la faccia contro la roccia. I
            bordi delle crepe sono vivi e taglienti, e dentro la roccia è più chiara che fuori. Ci metti
            un'ora, e dall'altra parte ti guardi le mani tagliate in dieci punti.
          effetti: { profondita.torre-anello-1: 1, ferite: 1 }

  # ------------------------------------------------------------ i segni azzurri
  - id: torre-1-i-segni-azzurri
    immagine: icone/spiral-shell
    titolo: I segni azzurri
    sommario: "Tre porte su tre piani diversi, e i segni azzurri che dovrebbero dire quale piano è quale sono tutti uguali."
    luogo: Il campanile rovescio, la scala delle corde
    area: torre-anello-1
    ripetibile: true
    requisiti: [profondita.torre-anello-1 <= 2]
    testo: |
      La scala si divide in tre rami che scendono intorno alla canna, e ogni ramo finisce davanti a una porta.
      I gradini dei tre rami sono consumati allo stesso modo, con la stessa conca al centro e la stessa
      scheggia sul quinto. Sopra ogni porta i segni azzurri del piano sono gli stessi, e mentre li guardi
      cambiano posto. Dove un segno si è spostato la pietra resta liscia, senza un solco. Due porte, dicono i
      Raschiatori, in un posto così portano dove sei già stat{o|a}.

      {origine accolito-del-velo} I segni ricordano le lettere più vecchie dei registri del Velo, quelle che
      nessuno in Cattedrale sa più leggere ad alta voce.
    opzioni:
      - testo: "Leggere i segni mentre cambiano"
        descrizione: "Cambiano in un ordine. Se l'ordine si capisce, si capisce anche quale porta scende."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Difficile }
        successo:
          titolo: L'ordine dei segni
          testo: |
            Guardi i segni girare finché non vedi il punto in cui l'ordine si ripete, e lì una porta resta
            indietro di un passo. Scegli quella, e dietro trovi i gradini che scendono. Dopo un giro ti volti,
            e i segni sopra la porta sono fermi.
          pe: { accademiche: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: La porta di prima
          testo: |
            Scegli la porta che ti sembra giusta e ti ritrovi sul pianerottolo da cui eri partit{o|a}. Ci
            passi due volte prima di accorgertene, e la testa ti gira. Alla fine vedi nella polvere del primo
            gradino le tue impronte, due file una sopra l'altra.
          effetti: { tormento: 1 }
      - testo: "Ascoltare il battito da ogni porta"
        descrizione: "Il battito sale dal fondo. Dalla porta giusta deve arrivare più forte."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Difficile }
        successo:
          titolo: Il battito più forte
          testo: |
            Appoggi l'orecchio a ogni porta, e dalla terza il battito arriva più forte e più lento. Il metallo
            di quella porta è tiepido contro la guancia. Passi da quella, e il battito ti accompagna giù per
            un piano.
          pe: { percezione: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Tre battiti
          testo: |
            Da ogni porta senti un battito diverso, e a forza di ascoltarli ti entrano tutti e tre nella
            testa. Uno è più veloce del tuo cuore e uno più lento, e il terzo va al passo con il tuo. Torni
            sulla scala con le tempie che pulsano fuori tempo.
          effetti: { tormento: 1 }
      - testo: "Leggere i segni come nei registri"
        descrizione: "Nei registri del Velo quelle lettere si leggono dal basso in alto. Forse anche qui."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Dal basso in alto
          testo: |
            Leggi i segni dal basso in alto, come ti hanno insegnato in Cripta, e il nome del piano viene
            fuori da solo. Le lettere restano ferme finché non hai finito di leggerle, e scendi dalla porta
            giusta mormorandolo.
          pe: { accademiche: 5 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: La lettera mancante
          testo: |
            Una lettera non è nei registri, e senza di lei il nome non vuol dire niente. Ti fermi a guardarla
            finché gli occhi non bruciano. È l'unica che non cambia mai posto.
          effetti: { tormento: 0.5 }
      - testo: "Provarle tutte e tre"
        descrizione: "Una porta alla volta, finché una non scende. Le gambe pagano, e la testa anche."
        costo: 3
        esito:
          titolo: Tre volte
          testo: |
            Le provi una dopo l'altra. La prima e la seconda ti riportano in cima al ramo, e ogni volta il
            quinto gradino ha la stessa scheggia. La terza scende. Arrivi in fondo con le gambe dure e la
            sensazione di aver fatto tre volte la stessa scala.
          effetti: { profondita.torre-anello-1: 1, tormento: 0.5 }

  # ================================================================ piani 4-6 (profondità 3-5)
  # ------------------------------------------------------------ la prima rete
  - id: torre-1-la-prima-rete
    immagine: icone/spider-web
    titolo: La prima rete
    sommario: "Una rete di fili d'acciaio chiude la canna da parete a parete. Al centro qualcosa si muove sotto la luce azzurra."
    luogo: Il campanile rovescio, la scala delle corde
    area: torre-anello-1
    ripetibile: true
    requisiti: [profondita.torre-anello-1 >= 3, profondita.torre-anello-1 <= 5]
    testo: |
      Una rete di fili d'acciaio chiude la canna da parete a parete, e la scala ci passa attraverso. I fili
      sono sottili come capelli e tesi come corde d'arpa, e quando la luce azzurra dei segni ci batte sopra si
      vedono tutti insieme, a cerchi, intorno a un centro vuoto. Fra un cerchio e l'altro c'è sempre una
      spanna, dal bordo fino al centro, e la misura non cambia di un dito. Il centro vuoto è grande quanto una
      carrozza.

      {origine figlio-del-circolo} Nel Bosco di Velthar i ragni tessono i cerchi dall'esterno verso il centro,
      e lasciano un filo asciutto per camminarci sopra. Qualcuno ha fatto lo stesso, in metallo.
    opzioni:
      - testo: "Tagliare un varco nella rete"
        descrizione: "I fili sono d'acciaio, e l'acciaio si taglia con un colpo giusto. Ogni filo che si spezza suona."
        prova: { attributo: fisico, abilita: [armi-da-mischia, rissa], difficolta: Difficile }
        successo:
          titolo: Il varco
          testo: |
            Tagli i fili con colpi corti, e ognuno si spezza con una nota acuta. Il filo è così duro che ogni
            colpo ti scheggia appena la lama. Quando il varco è largo abbastanza ci passi di fianco, e i fili
            rotti si arricciano dietro di te.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Il filo che torna
          testo: |
            Un filo tagliato torna indietro come una frusta e ti apre il dorso della mano. Il taglio è così
            sottile che il sangue arriva solo dopo. La rete vibra tutta, e dal basso arriva un ticchettio che
            sale.
          effetti: { ferite: 1 }
      - testo: "Camminare sul filo asciutto"
        descrizione: "Uno dei raggi della rete è più spesso degli altri e porta dritto alla scala di sotto."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Molto difficile }
        successo:
          titolo: Sul raggio
          testo: |
            Cammini sul raggio più spesso con le braccia aperte, e la rete ondeggia sotto di te come acqua. Il
            raggio è ruvido sotto la suola, ed è l'unico filo della rete che non sia liscio. Arrivi dall'altra
            parte senza aver toccato un filo, e la rete torna ferma.
          pe: { acrobazia: 5 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Impigliat{o|a}
          testo: |
            Il piede scivola dal raggio e la gamba ti finisce fra i fili, che si stringono come dita. Ogni
            volta che tiri la gamba si stringono di più. Ti liberi tagliando, e risali con la gamba segnata da
            dieci righe rosse.
          effetti: { ferite: 1, tormento: 0.5 }
      - testo: "Cercare il filo dei ragni del Bosco"
        descrizione: "Il filo asciutto, quello che il ragno lascia per sé. Nel Bosco l'hai imparato da bambin{o|a}."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Il filo asciutto
          testo: |
            Lo trovi dove l'avresti cercato nel Bosco, un raggio appena più opaco degli altri, e lo segui fino
            alla scala di sotto. Sotto le dita è asciutto e ruvido, e i fili intorno luccicano di qualcosa di
            unto. Chi ha tessuto questa rete pensava come un ragno, e un ragno lo sai leggere.
          pe: { natura: 5 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Il filo bagnato
          testo: |
            Il raggio che scegli è quello sbagliato, e ti si attacca alla manica. Strappi la stoffa per liberarti.
          effetti: { tormento: 0.5 }
      - testo: "Scendere lungo la parete, sotto la rete"
        descrizione: "Dove la rete tocca la parete c'è un palmo di roccia libera. Un palmo."
        costo: 3
        esito:
          titolo: Il palmo di roccia
          testo: |
            Scendi aggrappat{o|a} alla parete, con la schiena che sfiora i fili, e per tutto il tempo la rete
            ti ronza alle spalle. Il palmo di roccia è liscio e consumato, e ti dici che altri sono scesi da
            qui prima di te. Arrivi di sotto con la giubba piena di tagli sottili e la nuca rigida.
          effetti: { profondita.torre-anello-1: 1, ferite: 0.5, tormento: 0.5 }

  # ------------------------------------------------------------ il suonatore impigliato
  - id: torre-1-il-suonatore-impigliato
    immagine: ambientazione/mito-salvaguardia-precursori
    titolo: Il suonatore impigliato
    sommario: "Fra le corde in mezzo alla canna è rimasta presa una figura di Marea Grigia, con le braccia alzate come per tirarle."
    luogo: Il campanile rovescio, la scala delle corde
    area: torre-anello-1
    ripetibile: true
    requisiti: [profondita.torre-anello-1 >= 3, profondita.torre-anello-1 <= 5]
    testo: |
      Fra le corde in mezzo alla canna, all'altezza del pianerottolo, è rimasta presa una figura di Marea
      Grigia. Ha le braccia alzate e le mani chiuse su due corde, come se stesse ancora suonando, e le gambe
      le pendono nel vuoto. Dove le mani stringono il metallo è opaco e coperto di goccioline, e le goccioline
      non cadono. Quando ti avvicini gira la testa verso di te, e dalla bocca le esce un rintocco basso. Le
      due corde che tiene vibrano con il rintocco, e intorno le altre restano ferme.

      {empatia Difficile} Sta ancora suonando la notte in cui è caduta, e tu per lei sei soltanto un punto in
      mezzo alla sua ultima nota.
    opzioni:
      - testo: "Affrontare il suonatore"
        descrizione: "Una memoria di Marea con la voce della Campana in gola. Le corde la tengono, e lei tiene le corde."
        combattimento: torre-il-suonatore-impigliato
        vittoria:
          titolo: L'ultima nota
          testo: |
            La figura si sfa a partire dalle mani, e le corde tornano dritte una dopo l'altra. Dove le mani le
            stringevano il metallo delle due corde resta opaco. Per ultimo resta il rintocco, e anche lui
            scende giù per la canna e si spegne.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        sconfitta:
          titolo: La voce in testa
          testo: |
            Il rintocco ti entra in testa e ci resta, e per un momento le tue mani stringono corde che non ci
            sono. Quando torni in te sei sulla scala, qualche giro più in alto, e non ricordi come ci sei
            arrivat{o|a}. Sui palmi hai due righe rosse di traverso, quelle di chi ha tirato una corda per
            ore.
      - testo: "Finire la nota per lei"
        descrizione: "La sua nota è rimasta a metà. Se qualcuno la finisce, forse la notte finisce anche per lei."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Difficile }
        successo:
          titolo: La nota finita
          testo: |
            Canti a bocca chiusa la nota che lei ha cominciato e la porti fino in fondo, e la figura abbassa
            le braccia. La nota è più bassa della tua voce, e per tenerla la senti vibrare in fondo al petto.
            La figura si scioglie fra le corde come nebbia al sole, e le corde smettono di vibrare.
          pe: { empatia: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: La nota sbagliata
          testo: |
            La voce ti si rompe a metà, e la figura risponde con un rintocco che ti fa piegare in due. Torni
            sulla scala tenendoti la testa, e intorno a te tutte le corde del piano suonano lo stesso
            rintocco.
          effetti: { tormento: 1 }
      - testo: "Passarle accanto senza ascoltarla"
        descrizione: "Il rintocco cerca le cose che ricordi. Bisogna avere la testa ferma."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Molto difficile }
        successo:
          titolo: La testa ferma
          testo: |
            Passi accanto alla figura contando i gradini ad alta voce, e il rintocco ti scivola addosso.
            Arrivi a sessanta con la voce roca. Quando sei di sotto la senti ancora suonare, ma la sua notte
            non è più la tua.
          pe: { resilienza: 5 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: La notte di un'altra
          testo: |
            A metà strada il rintocco ti porta via, e per un momento sei sulle corde anche tu nella notte in
            cui la Campana suonò. Hai sotto i palmi due corde che tirano verso l'alto, e il suono della
            Campana riempie la canna finché non senti altro. Torni in te a terra, sul pianerottolo, con le
            mani strette a pugno.
          effetti: { tormento: 1.5 }
      - testo: "Scendere dall'altra parte della canna"
        descrizione: "Mezzo giro di scala in più, sulla parete opposta, dove la voce arriva meno."
        costo: 3
        esito:
          titolo: Dall'altra parte
          testo: |
            Fai mezzo giro in più sulla parete opposta, e la voce della figura ti arriva lo stesso, attutita,
            come da una stanza chiusa. Da questa parte la vedi di spalle, e la sua testa resta girata verso il
            punto dove eri prima. Per un piano ti resta nelle orecchie un rintocco che non viene da nessuna
            parte.
          effetti: { profondita.torre-anello-1: 1, tormento: 1 }

  # ------------------------------------------------------------ il bozzolo
  - id: torre-1-il-bozzolo
    immagine: icone/spider-web
    titolo: Il bozzolo
    sommario: "In mezzo al pianerottolo c'è un bozzolo di fili d'acciaio grande come un uomo. Dentro qualcosa respira."
    luogo: Il campanile rovescio, la scala delle corde
    area: torre-anello-1
    ripetibile: true
    requisiti: [profondita.torre-anello-1 >= 3, profondita.torre-anello-1 <= 5]
    testo: |
      In mezzo al pianerottolo, appeso a un filo, c'è un bozzolo di fili d'acciaio lungo quanto un uomo. Le
      spire sono strette e pari, e i nodi che le chiudono stanno tutti dallo stesso lato. La porta del piano è
      dietro di lui, e per passare bisogna spostarlo. Dentro qualcosa si muove con un ritmo lento, e a ogni
      movimento i fili cigolano. Ogni movimento dura quanto un respiro. Ti dici che è il filo che si assesta
      nel freddo della canna, e il ritmo non cambia mai.

      {origine fuggiasco-di-ghoran} A Ghoran avvolgono così i morti prima di calarli nella Fossa, e i morti di
      Ghoran stanno fermi.
    opzioni:
      - testo: "Aprire il bozzolo"
        descrizione: "I fili si allentano dove sono annodati. Quello che c'è dentro, si vedrà."
        prova: { attributo: mentale, abilita: [medicina, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il respiro
          testo: |
            Sciogli i nodi uno alla volta, e il bozzolo si apre su una macchina piccola e rotta che soffia con
            un mantice e resta immobile. Il mantice si gonfia con lo stesso ritmo lento che sentivi da fuori,
            e la macchina è tiepida. La sposti da parte con delicatezza e passi.
          pe: { medicina: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Quello che c'era dentro
          testo: |
            Il nodo che tiri apre il bozzolo tutto insieme, e dentro c'è una nebbia grigia che ti viene
            addosso prima di dissolversi. È fredda sulla pelle e ti entra nel naso, e per un po' vedi grigio
            ai bordi degli occhi. Ti resta in bocca un sapore di ferro.
          effetti: { contaminazione: 1 }
      - testo: "Spingerlo da parte e passare"
        descrizione: "Pesa quanto un uomo, e il filo che lo regge è corto. Basta una spinta e un passo veloce."
        prova: { attributo: fisico, abilita: [atletica, rissa], difficolta: Difficile }
        successo:
          titolo: La spinta
          testo: |
            Spingi il bozzolo con la spalla e lo fai oscillare verso la canna. Contro la spalla è più pesante
            di quanto sembrava, e dentro qualcosa scivola tutto da un lato. Mentre torna indietro sei già
            oltre la porta, e lo senti sbattere contro lo stipite dietro di te.
          pe: { atletica: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Il ritorno
          testo: |
            Il bozzolo torna indietro più in fretta di quanto pensassi e ti prende in pieno petto. Ti ritrovi sedut{o|a} sulla
            scala, senza fiato.
          effetti: { ferite: 1 }
      - testo: "Scivolare sotto senza toccarlo"
        descrizione: "Fra il bozzolo e il pavimento c'è lo spazio di un corpo disteso. Se il bozzolo non si muove."
        costo: 2
        esito:
          titolo: Sotto il respiro
          testo: |
            Scivoli sotto il bozzolo sulla schiena, con il respiro di quella cosa a un palmo dalla faccia. Da
            sotto i fili sono più radi, e fra una spira e l'altra passa un'aria tiepida a ogni movimento.
            Arrivi dall'altra parte con la nuca fredda e la voglia di non voltarti.
          effetti: { profondita.torre-anello-1: 1, tormento: 1 }

  # ------------------------------------------------------------ la nicchia dei suonatori (il ristoro)
  - id: torre-1-la-nicchia-dei-suonatori
    immagine: icone/ringing-bell
    titolo: La nicchia dei suonatori
    sommario: "Una nicchia scavata nella parete, con una panca di pietra e una conca d'acqua che non si secca. Qui riposava chi suonava."
    luogo: Il campanile rovescio, la scala delle corde
    area: torre-anello-1
    ripetibile: true
    requisiti: [profondita.torre-anello-1 >= 4, profondita.torre-anello-1 <= 5]
    testo: |
      A metà del giro la parete si apre in una nicchia bassa, con una panca di pietra e una conca piena
      d'acqua che gocciola dal soffitto. Il sedile della panca è consumato in due avvallamenti lisci, e il
      bordo della conca è levigato dove ci si appoggiavano le mani. Sulla panca, incise nella pietra, ci sono
      decine di tacche a gruppi di nove. Le più vecchie sono smussate fin quasi a sparire, e le ultime hanno
      ancora gli spigoli vivi. Chi suonava la Campana si fermava qui a riposare, e contava i turni.

      Il battito arriva anche qui, ma la pietra lo smorza, e per la prima volta da quando sei sces{o|a} puoi
      sentire il tuo respiro.
    opzioni:
      - testo: "Fasciarsi e riposare sulla panca"
        descrizione: "Un'ora sulla pietra fredda, con l'acqua della conca sulle ferite. Il tempo si paga."
        costo: 3
        esito:
          titolo: La panca dei suonatori
          testo: |
            Ti lavi le ferite con l'acqua fredda della conca e ti stendi sulla panca. L'acqua sa di pietra, ed
            è così fredda che le ferite smettono di pulsare. Quando ti alzi le tacche sono ancora lì, a gruppi
            di nove, e ne aggiungi una con la punta del coltello.
          effetti: { profondita.torre-anello-1: 1, ferite: -1.5 }
      - testo: "Restare in silenzio ad ascoltare il proprio respiro"
        descrizione: "La testa ha bisogno di riposo quanto le gambe. Qui il battito arriva piano."
        costo: 3
        esito:
          titolo: Il proprio respiro
          testo: |
            Ti siedi con la schiena alla parete e ascolti il tuo respiro finché il battito non ti sembra più
            tuo. Le gocce cadono nella conca a intervalli regolari, e dopo un po' le conti senza volerlo.
            Quando ti alzi la testa è leggera, e le note delle corde arrivano da lontano.
          effetti: { profondita.torre-anello-1: 1, tormento: -1.5 }
      - testo: "Bere e ripartire subito"
        descrizione: "Un sorso d'acqua e la scala. Chi si siede rischia di non alzarsi."
        costo: 1
        esito:
          titolo: Un sorso
          testo: |
            Bevi dalla conca con le mani a coppa e riparti prima che le gambe si accorgano della panca.
          effetti: { profondita.torre-anello-1: 1 }

  # ------------------------------------------------------------ il contrappeso
  - id: torre-1-il-contrappeso
    immagine: icone/crossed-chains
    titolo: Il contrappeso
    sommario: "Un contrappeso di metallo grande come una botte attraversa la canna avanti e indietro, e il pianerottolo è sulla sua strada."
    luogo: Il campanile rovescio, la scala delle corde
    area: torre-anello-1
    ripetibile: true
    requisiti: [profondita.torre-anello-1 >= 3, profondita.torre-anello-1 <= 5]
    testo: |
      Appeso a una catena lunghissima, un contrappeso di metallo grande come una botte attraversa la canna da
      una parete all'altra e torna. Passa radente al pianerottolo, così vicino che l'aria che sposta ti tira
      per i capelli, e la porta del piano è proprio sulla sua strada. La catena sale nel buio oltre la luce
      dei segni azzurri, e gli anelli sono spessi come un pollice e lucidi dove sfregano l'uno contro l'altro.
      In tutta la sua lunghezza non c'è un punto di ruggine.

      Ogni volta che arriva in fondo alla corsa, il contrappeso batte contro la parete un colpo sordo. Dove
      batte il metallo della parete è scavato in una conca liscia, larga quanto il contrappeso e profonda un
      palmo, e intorno alla conca non c'è una crepa.
    opzioni:
      - testo: "Passare nell'attimo giusto"
        descrizione: "C'è un momento, dopo il colpo, in cui il contrappeso è lontano. Bisogna correre in quel momento."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Dopo il colpo
          testo: |
            Aspetti il colpo sordo e corri, e sei già oltre la porta quando il contrappeso torna e passa dove
            eri un momento prima. Lo senti sfiorare lo stipite con un raschio lungo, e il colpo che segue ti
            arriva attraverso il muro fin dentro le scapole.
          pe: { acrobazia: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Di striscio
          testo: |
            Parti un momento troppo tardi, e il contrappeso ti prende di striscio sulla spalla. Ti butta
            contro la parete, e da lì lo guardi tornare indietro. Il metallo che ti ha toccato era freddo come
            l'acqua di un pozzo, e il freddo ti resta nella spalla più a lungo della botta.
          effetti: { ferite: 1.5 }
      - testo: "Contare le oscillazioni"
        descrizione: "La catena è lunga, e un pendolo lungo ha un ritmo fisso. Chi lo conta sa quando correre."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Difficile }
        successo:
          titolo: Il ritmo del pendolo
          testo: |
            Conti cinque oscillazioni sui colpi del tuo polso, e alla sesta sai già quando arriverà. Passi
            camminando, e il contrappeso ti segue con il suo colpo sordo come un orologio.
          pe: { percezione: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Il contrappeso non tiene il ritmo che hai contato, perché a ogni giro rallenta di un niente. Te ne
            accorgi quando ti passa a un dito dalla faccia e l'aria ti chiude gli occhi. Quando li riapri ha
            ripreso tutta la sua corsa, e dalla catena non è venuto un suono.
          effetti: { tormento: 1 }
      - testo: "Fermare il contrappeso con la catena"
        descrizione: "La catena passa vicino alla scala. Afferrarla al momento giusto vuol dire rallentare una botte di ferro con le mani."
        costo: 3
        esito:
          titolo: La catena nelle mani
          testo: |
            Afferri la catena e ti ci appendi con tutto il peso, e il contrappeso rallenta e ti trascina per
            due passi sul pianerottolo. Gli anelli ti bruciano i palmi, e lungo la catena senti scendere da
            sopra uno strattone lento che tira dall'altra parte. Quando il contrappeso si ferma sei oltre la
            porta, con le braccia che non ti rispondono.
          effetti: { profondita.torre-anello-1: 1, ferite: 1 }

  # ------------------------------------------------------------ la scala che oscilla
  - id: torre-1-la-scala-che-oscilla
    immagine: icone/ladder
    titolo: La scala che oscilla
    sommario: "Per mezzo giro la scala non è attaccata alla parete. Pende da quattro corde, e oscilla."
    luogo: Il campanile rovescio, la scala delle corde
    area: torre-anello-1
    ripetibile: true
    requisiti: [profondita.torre-anello-1 >= 3, profondita.torre-anello-1 <= 5]
    testo: |
      Per mezzo giro la scala si stacca dalla parete e pende da quattro corde fissate in alto, come
      un'altalena di gradini. A ogni passo oscilla, e più oscilla più si allontana dal pianerottolo di sotto,
      che a un certo punto è a un salto di distanza e poco dopo è lontano due braccia. Le corde sono di
      metallo intrecciato e non hanno un filo spezzato, e i gradini appesi sono consumati sul bordo esterno,
      dove nessun piede ha ragione di posarsi.

      {origine allievo-di-torvessa} All'Accademia questo si chiama pendolo accoppiato. Il professore di
      meccanica lo disegnava sulla lavagna, ma senza nessuno sopra.
    opzioni:
      - testo: "Tenere la scala ferma con il peso"
        descrizione: "Muoversi piano, contro l'oscillazione, finché la scala non si calma da sola."
        prova: { attributo: fisico, abilita: [resistenza, acrobazia], difficolta: Difficile }
        successo:
          titolo: La scala ferma
          testo: |
            Sposti il peso contro ogni oscillazione, e la scala si calma un passo alla volta. Le quattro corde
            smettono di vibrare una dopo l'altra, e l'ultima si ferma solo quando metti il piede sul metallo
            del pianerottolo. Arrivi in fondo con le gambe piegate e il pianerottolo che ti aspetta fermo.
          pe: { resistenza: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: L'altalena
          testo: |
            Ogni volta che correggi l'oscillazione la peggiori, e alla fine la scala ti butta contro la
            parete. Torni su a fatica, con un livido sul fianco. Dietro di te la scala continua a oscillare a
            lungo, e nessuna delle quattro corde rallenta.
          effetti: { ferite: 1 }
      - testo: "Saltare quando la scala è più vicina"
        descrizione: "Lasciarla oscillare, aspettare il punto più vicino al pianerottolo, e saltare."
        prova: { attributo: fisico, abilita: atletica, difficolta: Molto difficile }
        successo:
          titolo: Il punto più vicino
          testo: |
            Lasci che la scala si allunghi verso il pianerottolo e salti nel punto più vicino, e atterri sul
            metallo con tutti e due i piedi. La scala torna indietro vuota, e al ritorno si spinge un palmo
            più lontano di quanto fosse arrivata con te sopra.
          pe: { atletica: 5 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Troppo presto
          testo: |
            Salti troppo presto e prendi il pianerottolo con lo stomaco. Ti tiri su con le braccia, ma la
            scala di ritorno ti colpisce le gambe e ti trascina indietro. Ti ritrovi appes{o|a} ai gradini,
            con il pianerottolo che si allontana di nuovo sotto i piedi.
          effetti: { ferite: 1.5 }
      - testo: "Calcolare l'oscillazione come alla lavagna"
        descrizione: "Il pendolo accoppiato ha un punto in cui le due oscillazioni si annullano. Il professore lo segnava con il gesso."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: Il punto del gesso
          testo: |
            Trovi il punto in cui le due oscillazioni si annullano e ti ci fermi. È a due gradini dal centro,
            dove le corde di sinistra e quelle di destra tirano con la stessa forza. La scala resta immobile
            sotto di te per il tempo di scendere, e il professore avrebbe chiesto chi ti ha suggerito.
          pe: { accademiche: 5 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: La lavagna sbagliata
          testo: |
            Le corde non sono uguali come sulla lavagna, e il punto che hai calcolato non c'è. La scala ti scuote
            finché non torni indietro.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Scendere aggrappat{o|a} alle corde che reggono la scala"
        descrizione: "Lasciare stare i gradini e scendere lungo una delle quattro corde, che almeno sta ferma."
        costo: 2
        esito:
          titolo: La corda ferma
          testo: |
            Scendi lungo la corda che regge l'angolo della scala, con i gradini che ti oscillano accanto. La
            corda non si scalda sotto le mani, e vibra appena con un ronzio che ti sale nei polsi. Arrivi in
            fondo con le mani bruciate e la testa che gira.
          effetti: { profondita.torre-anello-1: 1, ferite: 1 }

  # ------------------------------------------------------------ la campanella
  - id: torre-1-la-campanella
    immagine: icone/ringing-bell
    titolo: La campanella
    sommario: "Una campanella di bronzo è appesa sopra la porta del piano, con un filo teso che attraversa il pianerottolo."
    luogo: Il campanile rovescio, la scala delle corde
    area: torre-anello-1
    ripetibile: true
    requisiti: [profondita.torre-anello-1 >= 3, profondita.torre-anello-1 <= 5]
    testo: |
      Sopra la porta del piano è appesa una campanella di bronzo grande come un pugno, e un filo d'acciaio
      teso attraversa il pianerottolo all'altezza della caviglia, dal battaglio fino alla parete. Il filo è
      fissato alla parete con una goccia di una sostanza grigia e indurita, e il nodo intorno al battaglio è
      stretto e ordinato. Sul pavimento, intorno, il metallo è segnato da graffi a tre punte, fittissimi.
      Vicino al filo i graffi si addensano, e nessuno lo attraversa.

      {percezione Difficile} Dalla canna, appena sotto il bordo del pianerottolo, arriva il ticchettio di tre
      ragni che aspettano. Battono le zampe sul metallo a turno e poi stanno fermi.
    opzioni:
      - testo: "Scavalcare il filo"
        descrizione: "Un passo alto e lento, con il piede che non tocca niente. Il filo è sottile e il buio è tanto."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Il filo intatto
          testo: |
            Scavalchi il filo con un passo lungo e lento, e la campanella resta muta. Sotto, il ticchettio continua
            ad aspettare qualcuno che non arriva.
          pe: { furtivita: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Il tintinnio
          testo: |
            Il tallone sfiora il filo e la campanella suona una volta, piano. La nota resta nell'aria molto
            più a lungo di quanto possa durare in un bronzo così piccolo. Il ticchettio sale di colpo, e tu
            risali la scala di corsa prima che arrivi.
          effetti: { tormento: 0.5, ferite: 0.5 }
      - testo: "Togliere il battaglio alla campanella"
        descrizione: "Una campanella senza battaglio non suona. Ci si arriva in punta di piedi, sopra il filo."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La campanella muta
          testo: |
            Sfili il battaglio dal suo anello con due dita e te lo metti in tasca. È un cilindro di bronzo
            lungo un dito, con la punta consumata da un lato solo. Il filo resta teso sotto di te, e la
            campanella resta muta mentre lo calpesti.
          pe: { tecnologia: 3 }
          effetti: { profondita.torre-anello-1: 1 }
        fallimento:
          titolo: Il battaglio scivola
          testo: |
            Il battaglio ti scivola fra le dita e batte una volta contro il bordo. Il ticchettio sale, e tu ti butti
            indietro sulla scala.
          effetti: { tormento: 0.5, ferite: 0.5 }
      - testo: "Suonare la campanella e aspettarli"
        descrizione: "Sono in tre, e arriveranno comunque. Meglio che arrivino quando sei pront{o|a}."
        combattimento: torre-lo-sciame-dei-rammendatori
        vittoria:
          titolo: Tre ragni a terra
          testo: |
            L'ultimo ragno si rovescia sulla schiena con le zampe raccolte. Stacchi la campanella dal suo
            gancio e la lasci cadere nella canna, e la senti suonare per molti piani, sempre più piccola,
            senza che arrivi il colpo sul fondo.
          pe: { armi-da-mischia: 5 }
          effetti: { profondita.torre-anello-1: 1 }
        sconfitta:
          titolo: Tre contro uno
          testo: |
            I ragni arrivano da tre parti e ti legano le gambe prima che tu possa girarti. Il filo che ti
            stringe le caviglie è appiccicoso e tiepido, e si stacca dalla pelle con un rumore di carta. Ti
            liberi tagliando e risali la scala, con la campanella che suona ancora sopra la porta.
      - testo: "Tagliare il filo da lontano"
        descrizione: "Un sasso, o il coltello lanciato. La campanella suonerà una volta, e poi tutto dipende dalle gambe."
        costo: 3
        esito:
          titolo: Una volta sola
          testo: |
            Tagli il filo con un lancio del coltello e la campanella suona una volta sola. Prima che il
            ticchettio arrivi sei già oltre la porta, giù per la scala, con il fiato corto per un piano
            intero. Alle tue spalle lo senti arrivare sul pianerottolo e fermarsi lì, intorno al filo
            tagliato.
          effetti: { profondita.torre-anello-1: 1, ferite: 0.5, tormento: 0.5 }
