# Il bronzo della canna: il set di grado 5 dei guardiani del campanile rovescio (docs/piano-torre.md, approvato da Luca
# il 24 ottobre 2026). Un pezzo per guardiano, una volta sola (`avuto.<id> == 0` nel seguito che lo dà). L'aspetto sul
# ritratto sta in src/ui/ritratto/aspetti.ts (bronzoCampana, verderame, luce di cristallo). Niente bonus di set.
# - Piano 10, la Tessitrice: La Nota Lunga (spada lunga).
# - Piano 20, l'Uditore: La Cassa Armonica (armatura a piastre).
# - Piano 30, la Colata: La Bocca della Campana (scudo).
# - Piano 40, il Lettore: Il Manto del Battito (mantello, accessorio di grado 5) e il frammento del sigillo, che non
#   si indossa: nel Capitolo II servirà a portare la Maschera al grado 4 (docs/piano-torre.md).
oggetti:
  - id: torre-la-nota-lunga
    nome: La Nota Lunga
    immagine: icone/rune-sword
    descrizione: "Una spada lunga fusa nel bronzo delle campane, con la guardia piegata come il labbro di una campana e il pomo a campanella. Quando taglia l'aria lascia una nota che dura più del colpo, e lungo la scanalatura verde si accendono tre luci fredde."
    slot: arma
    base: spada-lunga
    grado: 5
    dadi: 2
    proprieta: { affilata: 2, penetrante: 1 }

  - id: torre-la-cassa-armonica
    nome: La Cassa Armonica
    immagine: icone/breastplate
    descrizione: "Piastre di bronzo da campana bordate di verderame, con il segno del rintocco inciso sul petto. I colpi ci risuonano dentro e si spengono prima di arrivare alle ossa, e i suoni che fanno male si fermano sul metallo."
    slot: armatura
    base: armatura-a-piastre
    grado: 5
    proprieta: { robusta: 1, lucida: true, talento: { resilienza: 1 } }

  - id: torre-la-bocca-della-campana
    nome: La Bocca della Campana
    immagine: icone/bell-shield
    descrizione: "Uno scudo a forma di campana, con l'anello in cima e il labbro svasato in fondo. Dalle due fasce in rilievo esce un filo di luce, e la Marea che lo tocca ci scivola sopra come acqua sul metallo caldo."
    slot: scudo
    base: scudo
    grado: 5
    dadi: 3
    proprieta: { schermata: true }

  - id: torre-il-manto-del-battito
    nome: Il Manto del Battito
    immagine: icone/cape
    descrizione: "Un mantello verde come il rame vecchio, con l'orlo che si accende e si spegne a tempo con il battito che sale dal fondo della canna. Chi lo porta sente quel battito anche quando le gambe cedono, e per un momento le gambe tengono."
    slot: accessorio
    grado: 5
    proprieta: { ultimoRespiro: true, rapida: 1, talento: { percezione: 1, atletica: 1 } }

  - id: torre-frammento-del-sigillo
    nome: Il frammento del sigillo
    immagine: icone/crystal-shine
    descrizione: "Una scheggia di metallo azzurro grande come un'unghia, staccata dal bordo della porta del quarantunesimo piano. È sempre calda, e quando la avvicini alla Maschera la Maschera vibra come una corda toccata."
    slot: nessuno
