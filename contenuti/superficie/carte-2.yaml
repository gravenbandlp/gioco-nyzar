# Superficie Fratturata, carte del mazzo (seconda parte): dieci incontri dalla tabella del master, riscritti.
# 18 il cavallo senza cavaliere (riportarlo a Dolovan Stroud alla Zanna Rotta o seguire le tracce del padrone;
# sup2.cavallo), 19 la reliquia intatta (il campo di forza una volta sola, con oggetto.campo-di-forza == 0),
# 21 l'uomo del Velo con la maschera liscia (una volta sola, sup2.velo), 22 la carovana ridotta (bende, tonico,
# un reperto da vendere, notizie; ripetibile), 24 il predone solitario (scontro predone-solitario; la sua storia
# una volta sola, con il seguito carta-sup2-gaddo e sup2.predone), 26 la pioggia leggera, 27 i rifugiati del
# casale (una volta sola, sup2.rifugiati: chi li aiuta li ritrova sotto i Ponti), 28 la spada lasciata sulla
# crosta della Marea (una volta sola, sup2.arma), 29 il cadavere recente, 31 i cervi nervosi.
# Nomi nuovi, che il Codex non dà: Gaddo (Raschiatore senza due dita), Brisa (la donna dei rifugiati).
# I numeri stanno solo negli effetti (docs/stile-dei-testi.md, regola 11).
quality:
  - { id: sup2.cavallo, nome: "Il cavallo senza cavaliere", categoria: stato, nascosta: true, descrizione: "1 quando hai riportato il cavallo senza cavaliere alla Zanna Rotta o hai trovato dove finiscono le orme del padrone." }
  - { id: sup2.velo, nome: "L'uomo del Velo alla pietra", categoria: stato, nascosta: true, descrizione: "1 se l'uomo del Velo con la maschera liscia ti ha risposto, 2 se si è chiuso davanti alle tue insistenze, 3 se gli hai messo le mani addosso." }
  - { id: sup2.predone, nome: "Gaddo", categoria: stato, nascosta: true, descrizione: "1 se hai ascoltato la storia di Gaddo e l'hai lasciato alla sua strada, 2 se gli hai dato qualche moneta, 3 se l'hai mandato a lavorare da Oda Krell." }
  - { id: sup2.rifugiati, nome: "I rifugiati del casale", categoria: stato, nascosta: true, descrizione: "1 se hai aiutato Brisa e la sua gente, che adesso vivono sotto i Ponti e si ricordano di te, 2 se li hai minacciati." }
  - { id: sup2.arma, nome: "La spada sulla crosta", categoria: stato, nascosta: true, descrizione: "1 quando hai raccolto la spada corta lasciata sulla crosta della Marea." }

storylet:
  # ================================================================ 18 · il cavallo senza cavaliere
  - id: carta-sup2-cavallo-senza-cavaliere
    tipo: carta
    area: superficie-fratturata
    immagine: icone/horse-head
    titolo: Il cavallo senza cavaliere
    sommario: "Un cavallo sellato cammina da solo sul sentiero, con la staffa destra accorciata per qualcuno che non c'è."
    luogo: Superficie Fratturata, il sentiero dei carri sotto le terrazze
    requisiti: [sup2.cavallo == 0]
    testo: |
      Sul sentiero, un tiro di sasso più avanti, un cavallo baio cammina al
      passo per conto suo. Ha ancora la sella e la bisaccia, e le redini gli
      strisciano fra le zampe. Sul fianco sinistro, all'altezza della
      staffa, il pelo è sporco di una polvere chiara come farina. Quando ti
      sente si ferma con le orecchie girate verso di te e non scappa, e vedi
      che la staffa destra è più corta della sinistra di tre buchi.

      {natura Media} Sulla Superficie una polvere così fine e chiara di
      solito è Marea posata e seccata, da non toccare a mani nude.
    opzioni:
      - testo: "Avvicinarlo con calma"
        descrizione: "Un cavallo spaventato si prende con la voce, e alla Zanna Rotta Dolovan Stroud paga chi riporta le bestie perse."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: La Zanna Rotta
          testo: |
            Gli parli piano finché smette di girare le orecchie, e ti segue fino
            in città con il muso contro la tua spalla. Alle Scuderie della Zanna
            Rotta Dolovan Stroud gli tasta le gambe prima di guardare te.
            Riconosce sotto la sella il marchio di una carovana di Laresh e ti
            paga il recupero, e il baio resta da lui finché qualcuno non viene a
            reclamarlo.
          pe: { addestrare-animali: 8 }
          effetti: { monete: 8 }
          imposta: { sup2.cavallo: 1 }
        fallimento:
          titolo: Il calcio
          testo: |
            Al terzo passo il cavallo si gira sulle zampe di dietro e ti prende di
            striscio con uno zoccolo sulla coscia, abbastanza da metterti a sedere
            sulla ghiaia. Quando ti rialzi è già lontano verso le terrazze, e per
            il resto della giornata zoppichi.
          effetti: { ferite: 1 }

      - testo: "Seguire le tracce del padrone"
        descrizione: "Gli zoccoli tornano indietro fino al punto in cui il cavallo era in due, e da lì bisogna leggere il terreno."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Gli stivali
          testo: |
            Risali le orme del baio fino a un punto di ghiaia smossa, da cui
            partono le orme di un uomo verso un anello di metallo mezzo sepolto,
            nella stessa polvere chiara del fianco del cavallo. Sul bordo, dove le
            orme finiscono, ci sono due stivali ancora allacciati, messi uno
            accanto all'altro. Poco più in là prendi una tracolla con un guscio
            sigillato avvolto nella lana.
          pe: { natura: 6 }
          effetti: { reperto.sigillato: 1, tormento: 1, racconto: 1 }
          imposta: { sup2.cavallo: 1 }
        fallimento:
          titolo: La polvere chiara
          testo: |
            Le orme si confondono con quelle di un branco di capre, e mentre
            cerchi di separarle finisci fino alle caviglie in una chiazza di
            polvere chiara, fredda come neve vecchia. Ne esci di corsa con la
            pelle che formicola, e sul sentiero il cavallo non c'è più.
          effetti: { contaminazione: 1.5 }

      - testo: "Lasciarlo alla sua strada"
        descrizione: "Il cavallo non è tuo. Prima o poi qualcuno verrà a cercarlo."
        costo: 0
        esito:
          titolo: Al passo
          testo: |
            Lo superi tenendoti largo, e quando ti volti il baio cammina di nuovo
            al passo verso le terrazze, con le redini fra le zampe.

  # ================================================================ 19 · la reliquia intatta
  - id: carta-sup2-reliquia-intatta
    tipo: carta
    area: superficie-fratturata
    immagine: icone/frozen-orb
    titolo: La reliquia intatta
    sommario: "Fra i detriti di un gradone c'è un oggetto senza un graffio, circondato di brina a mezzogiorno."
    luogo: Superficie Fratturata, i detriti ai piedi di un gradone di basalto
    testo: |
      Fra i detriti ai piedi di un gradone, mezzo incastrato fra due sassi,
      c'è un oggetto grande quanto un palmo, di un metallo grigio chiaro. È
      liscio e senza un graffio, e intorno la ghiaia ha una crosta di brina
      a mezzogiorno. Quando avvicini la mano senti il freddo prima di
      toccarlo, come davanti a una ghiacciaia aperta.

      {tecnologia Media} Un oggetto che consuma calore per stare intatto sta
      ancora lavorando.

      {origine allievo-di-torvessa} Il Mana intorno è immobile, tenuto a una
      mano di distanza, e di un oggetto che lo tiene fuori all'Accademia non
      hai mai sentito parlare.
    opzioni:
      - testo: "Staccarlo dai sassi"
        descrizione: "È incastrato e gela le dita, e va tenuto stretto finché i sassi non lo mollano."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Facile }
        successo:
          titolo: Avvolto nella lana
          testo: |
            Lo stringi a due mani e tiri mentre il freddo ti sale fino ai gomiti,
            finché i sassi cedono di colpo. Appena è fuori il metallo si chiude su
            se stesso con uno scatto in un guscio liscio, e lo avvolgi nella lana
            in fondo alla sacca, dove ti raffredda la schiena per un pezzo di
            strada.
          effetti: { reperto.sigillato: 1 }
        fallimento:
          titolo: Le dita bianche
          testo: |
            Il freddo ti morde le dita fino a togliere la sensibilità, e molli la
            presa prima di accorgertene. L'oggetto scivola più giù fra i sassi, e
            ti restano in mano una scaglia del bordo e le punte delle dita bianche
            fino a sera.
          effetti: { ferite: 0.5, reliquie.scheggia: 1 }

      - testo: "Studiarlo prima di toccarlo"
        descrizione: "Un oggetto che il tempo non tocca ha un motivo per non farsi toccare."
        quando: [oggetto.campo-di-forza == 0]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Difficile }
        successo:
          titolo: Il cerchio di brina
          testo: |
            La brina forma intorno un cerchio perfetto largo una mano, e al centro
            dell'oggetto c'è un incavo grande come un pollice. Capisci che è un
            disco fatto per stare sul petto, che per centocinquant'anni ha tenuto
            lontano tutto quello che gli cadeva addosso, e lo sollevi con un
            bastone per avvolgerlo nella giacca.
          pe: { tecnologia: 10 }
          effetti: { oggetto.campo-di-forza: 1 }
        fallimento:
          titolo: La spinta
          testo: |
            Tocchi l'incavo al centro, e l'aria davanti all'oggetto ti spinge
            indietro come una mano aperta sul petto, buttandoti di schiena sulla
            ghiaia. Quando ti rialzi il disco si è chiuso in un guscio liscio e
            freddo, e lo metti nella sacca insieme a un livido sulla scapola.
          effetti: { reperto.sigillato: 1, ferite: 0.5 }

      - testo: "Studiarlo prima di toccarlo"
        descrizione: "Il cerchio di brina lo conosci già dal disco, ma questo è fatto in un altro modo."
        quando: [oggetto.campo-di-forza >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Un parente lontano
          testo: |
            La brina fa un cerchio più stretto di quello del tuo disco, e
            sull'oggetto l'incavo non c'è. Lo prendi dal lato dove il freddo è più
            debole, e si chiude in un guscio senza strapparti la pelle delle dita,
            come un attrezzo senza firma su cui riconosci la mano di un fabbro.
          pe: { tecnologia: 5 }
          effetti: { reperto.sigillato: 1 }
        fallimento:
          titolo: Troppo freddo
          testo: |
            Lo giri per guardarne il fondo, e il freddo ti passa dalle dita alla
            testa, tanto che per un momento non ricordi dove stavi andando.
            L'oggetto si perde fra i sassi, e ti resta in mano una scheggia del
            bordo.
          effetti: { tormento: 1, reliquie.scheggia: 1 }

      - testo: "Lasciarlo dov'è"
        descrizione: "Ha aspettato fino a oggi senza di te."
        costo: 0
        esito:
          titolo: La brina
          testo: |
            Lo lasci fra i sassi e riprendi il sentiero soffiandoti sulle dita.
            Quando ti volti, dal gradone sale un filo di vapore bianco come da una
            tazza appena posata.

  # ================================================================ 21 · l'uomo del Velo alla pietra
  - id: carta-sup2-uomo-del-velo
    tipo: carta
    area: superficie-fratturata
    immagine: icone/hooded-figure
    titolo: L'uomo alla pietra incisa
    sommario: "Accanto a una pietra incisa un uomo del Velo con la maschera liscia conta i nodi di una cordicella."
    luogo: Superficie Fratturata, una pietra incisa sopra le terrazze basse
    requisiti: [sup2.velo == 0]
    testo: |
      Contro una pietra piantata in verticale sta un uomo in un mantello di
      buona lana, con una maschera liscia che gli copre fronte e occhi. Fa
      scorrere fra le dita i nodi di una cordicella e ogni tanto alza la
      testa verso le terrazze basse. «Non sei qui per caso» dice a voce bassa
      senza voltarsi.

      {percezione Media} Fra un nodo e l'altro lascia passare sempre lo
      stesso tempo, e ogni tanto aspetta più a lungo.

      {origine accolito-del-velo} In Cattedrale ti hanno insegnato a non
      chiedere che cosa c'è sotto l'altare, e ti ritrovi con la testa china.
    opzioni:
      - testo: "Fargli domande precise"
        descrizione: "Risponde soltanto a domande precise, e bisogna capire bene che cosa sta contando."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il conto
          testo: |
            Gli chiedi che cosa conta, e lui risponde. Sul gradone più basso c'è un
            anello spezzato che si gonfia a intervalli, e da una luna lui lo conta
            perché la pausa fra una volta e l'altra si allunga. Chi mette le mani
            sull'anello deve metterle nella pausa e mai mentre si gonfia. Non ti
            chiede perché lo volevi sapere, e questo ti mette addosso più freddo del
            vento.
          pe: { percezione: 6 }
          effetti: { informazioni.pettegolezzo: 1, rep.velo: 0.5 }
          imposta: { sup2.velo: 1 }
        fallimento:
          titolo: Domande sbagliate
          testo: |
            Le tue domande sono larghe, e lui le lascia cadere una dopo l'altra,
            mentre in cambio ti chiede il tuo nome e dove dormi in città, e tu
            rispondi prima di pensarci. Quando te ne vai sulla cordicella c'è un
            nodo nuovo, fatto mentre parlavi tu.
          effetti: { sospetto: 1 }
          imposta: { sup2.velo: 1 }

      - testo: "Insistere finché non parla"
        descrizione: "Alzare la voce e fargli capire che non te ne vai, anche se con il Velo funziona poco."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Difficile }
        successo:
          titolo: Il bordo interno
          testo: |
            Gli resti davanti, così vicino da sentire l'incenso vecchio del
            mantello, finché la cordicella si ferma. «Oggi, sulla strada degli
            scavi, cammina sul bordo esterno» dice. «Sul bordo interno la roccia è
            buona fino a domani, forse.» Poi per lui torni a essere una pietra
            come le altre.
          effetti: { informazioni.voce: 1 }
          imposta: { sup2.velo: 2 }
        fallimento:
          titolo: La seconda cordicella
          testo: |
            Più alzi la voce e più lui si fa immobile. Alla fine tira fuori una
            seconda cordicella più corta e ci fa un nodo guardandoti in faccia, e
            di quella cordicella sai soltanto che adesso c'è sopra anche il tuo
            nome.
          effetti: { sospetto: 1.5 }
          imposta: { sup2.velo: 2 }

      - testo: "Strappargli la cordicella"
        descrizione: "I nodi diranno quello che lui tace, ma il Velo ricorda chi mette le mani addosso ai suoi."
        esito:
          titolo: Il capo tagliato
          testo: |
            Afferri la cordicella, e l'uomo fa senza fretta un passo indietro
            dietro la pietra. Quando ci giri intorno non c'è più e non ha lasciato
            impronte. Ti resta in mano un pezzo di cordicella tagliato netto, con
            una fila di nodi che a qualcuno in città dirà qualcosa, e per qualche
            giorno le porte del Velo ti si chiudono un momento prima che tu ci
            arrivi.
          effetti: { informazioni.voce: 1, rep.velo: -0.5, sospetto: 1 }
          imposta: { sup2.velo: 3 }

      - testo: "Tirare dritto"
        descrizione: "Il Velo conta quello che vuole, e tu hai strada da fare."
        costo: 0
        esito:
          titolo: I nodi
          testo: |
            Gli passi davanti senza rallentare, e dietro di te senti le dita che
            riprendono a scorrere sui nodi. La nuca ti resta fredda fino alla
            curva.

  # ================================================================ 22 · la carovana ridotta
  - id: carta-sup2-carovana-ridotta
    tipo: carta
    area: superficie-fratturata
    immagine: icone/caravan
    titolo: La carovana ridotta
    sommario: "Due carri magri e cinque persone a piedi sulla pista di Laresh, con poca roba a prezzo fermo."
    luogo: Superficie Fratturata, la pista dei carri verso Laresh
    testo: |
      Sulla pista verso Laresh avanza una carovana, due carri tirati da buoi
      magri e cinque persone a piedi con le armi alla cintura. Si fermano
      senza una parola, con una donna anziana a cassetta e la balestra in
      grembo, e si fa avanti un uomo con la barba grigia e un orecchio solo.

      «Roba ne abbiamo poca» dice. «Però è roba onesta, e il prezzo è quello
      che dico la prima volta, perché a ripeterlo mi stanco.»

      {origine mercante-dei-ponti} Sui Ponti il prezzo detto una volta sola
      lo fa chi non può permettersi di trattare.
    opzioni:
      - testo: "Comprare bende"
        descrizione: "Rotoli bolliti e piegati nella carta. Costano poco meno che in città."
        requisiti: [monete >= 8]
        esito:
          titolo: Nella carta
          testo: |
            L'uomo con un orecchio solo tira fuori da una cassa un rotolo di bende
            piegato nella carta oleata e conta le monete due volte, la seconda
            muovendo le labbra. Dietro di lui la donna a cassetta ha già rimesso
            la balestra sotto il sedile.
          effetti: { monete: -8, bende: 1 }

      - testo: "Comprare un tonico"
        descrizione: "Una boccetta chiusa con la cera, che la donna tiene sotto il sedile con la balestra."
        requisiti: [monete >= 25]
        esito:
          titolo: La boccetta
          testo: |
            La donna si fa dare le monete prima di muoversi, poi tira fuori da
            sotto il sedile una boccetta scura con il tappo sigillato nella cera.
            La scuote vicino all'orecchio per sentire che è piena, e ti dice di
            berla tutta in una volta, perché a metà fa più male che bene.
          effetti: { monete: -25, tonico: 1 }

      - testo: "Vendere un reperto sigillato"
        descrizione: "Oda Krell lo pagherebbe di più, ma la baracca è lontana e la carovana paga subito."
        quando: [reperto.sigillato >= 1]
        esito:
          titolo: Il guscio sul carro
          testo: |
            L'uomo soppesa il guscio e lo annusa, poi ti offre meno di quanto vale
            sapendo che lo sai anche tu. Gli stringi lo stesso la mano, secca come
            la corteccia, e il guscio finisce in una cassetta piena di paglia
            insieme ad altri due.
          effetti: { reperto.sigillato: -1, monete: 4 }

      - testo: "Chiedere com'è la strada"
        descrizione: "Chi viaggia con i carri sa dove la Marea è salita negli ultimi giorni."
        esito:
          titolo: Le notizie della pista
          testo: |
            L'uomo si siede sul timone e ti racconta la strada da Laresh pietra
            per pietra. Due giorni fa una crepa vicino al guado ha cominciato a
            fumare grigio e ci hanno perso un bue, e le frecce bianche dopo il
            secondo gradone sono di nuovo girate, e chi le gira adesso lo fa per
            qualcosa di peggio di uno scherzo.
          effetti: { informazioni.voce: 1 }

      - testo: "Minacciarli"
        descrizione: "Sono in cinque, e la vecchia a cassetta non sbaglia la mira."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: La cassa lasciata indietro
          testo: |
            Invece di combattere si stringono intorno ai carri e arretrano, con la
            vecchia che ti tiene sotto tiro, e sulla pista lasciano una cassa con
            bende e un sacchetto di monete perché tu ti fermi ad aprirla. A Laresh
            e al Mercato dei Nodi, entro una settimana, la tua faccia la
            descrivono bene.
          effetti: { monete: 5, bende: 1, rep.gilda: -0.5, sospetto: 1 }
        fallimento:
          titolo: La fuga in ordine
          testo: |
            Al primo passo la vecchia ti pianta un dardo fra gli stivali, e il
            secondo ti apre la manica e un po' di braccio. Mentre ti tieni il
            gomito la carovana riparte senza correre, e a Laresh racconteranno che
            sulla pista c'è un predone in più.
          effetti: { ferite: 1, rep.gilda: -0.5 }

  # ================================================================ 24 · il predone solitario
  - id: carta-sup2-predone-solitario
    tipo: carta
    area: superficie-fratturata
    immagine: icone/robber
    titolo: Il predone solitario
    sommario: "Da dietro un masso esce un uomo solo con una lancia corta, tenuta come una scopa, e ti chiede la borsa."
    luogo: Superficie Fratturata, un masso a lato della strada degli scavi
    testo: |
      Da dietro un masso esce un uomo con una lancia corta tenuta troppo in alto,
      come una scopa. Porta una giubba di cuoio da Raschiatore e sulla spalla la
      cinghia vuota di una lanterna. «Fermo lì. Dammi la borsa e vai per la tua
      strada» dice, e gli occhi gli saltano al sentiero alle tue spalle, a
      controllare se arriva qualcun altro. Alla mano sinistra gli mancano due dita,
      e la cicatrice è ancora rosa.

      {origine apprendista-raschiatore} Lui la lanterna non ce l'ha più, e porta la
      cinghia come se il turno dovesse ricominciare domattina.
    opzioni:
      - testo: "Combattere"
        descrizione: "È solo e gli tremano le mani, ma quella punta fa male lo stesso."
        combattimento: predone-solitario
        vittoria:
          titolo: La lancia nella polvere
          testo: |
            Al secondo affondo la lancia gli vola via di mano, e scappa verso le
            terrazze stringendosi al petto la mano senza dita. Nella polvere restano
            la lancia e una sacca con qualche moneta e due frammenti di cristallo
            esausti, e a te un vago senso di colpa.
          effetti: { monete: 3, cristalli.frammento-esausto: 2 }
        sconfitta:
          titolo: La borsa
          testo: |
            È più disperato che bravo, ma la disperazione basta. Ti ritrovi in
            ginocchio con l'asta che ti preme sulla nuca, mentre una mano a cui
            mancano due dita ti sfila la borsa dalla cintura, e quando scappa si
            volta una volta come se volesse dire qualcosa.
          effetti: { monete: -4 }

      - testo: "Fargli paura"
        descrizione: "Ha più paura lui di te, e basta un passo avanti fatto con convinzione."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Facile }
        successo:
          titolo: Il passo avanti
          testo: |
            Fai un passo avanti e gli dici con calma dove gli finirà la lancia, e
            lui la guarda come se si accorgesse soltanto adesso di averla in mano.
            La lascia cadere e scappa giù per i gradoni, e ti accorgi solo allora
            che il cuore ti batteva forte quanto il suo.
          pe: { intimidire: 5 }
        fallimento:
          titolo: Il colpo storto
          testo: |
            Lui si spaventa troppo e ti viene addosso con un affondo storto che ti
            apre la manica e la pelle dell'avambraccio. Resta un momento a fissare
            il sangue, più spaventato di te, e scappa senza la lancia.
          effetti: { ferite: 0.5 }

      - testo: "Parlarci"
        descrizione: "La giubba è da Raschiatore e la cicatrice è recente, e prima di essere un predone era qualcos'altro."
        quando: [sup2.predone == 0]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La mano
          testo: |
            Tieni le mani in vista e gli chiedi delle dita, e la domanda lo prende
            così alla sprovvista che la punta della lancia scende di un palmo, e
            poi di un altro. Alla fine pianta l'asta nella ghiaia, ci si appoggia
            come a un bastone e ti dice il suo nome.

            {empatia Facile} Nessuno gliel'aveva ancora chiesto, e si guarda la
            mano quasi sorpreso che sia ancora sua.
          pe: { empatia: 5 }
          segue: carta-sup2-gaddo
        fallimento:
          titolo: Troppe domande
          testo: |
            Più parli e più lui si convince che lo stai trattenendo per qualcuno
            che arriva da dietro. Ti spinge indietro con la punta della lancia sul
            petto, dove ti resta un segno tondo e rosso, e scappa giù per i
            gradoni.
          effetti: { ferite: 0.5 }
      - testo: "Fargli credere che dietro arriva la scorta"
        descrizione: "Continua a guardare il sentiero alle tue spalle, e basta dargli un motivo."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Facile }
        successo:
          titolo: Quelli dietro
          testo: |
            Alzi un braccio verso il sentiero e chiami a gran voce un compagno
            immaginario, e il tempo di girarsi a guardare gli basta per decidere.
            Scappa giù per i gradoni, e la sacca che portava a tracolla resta
            impigliata in uno spuntone, con dentro due frammenti di cristallo
            esausti e una crosta di pane che lasci dov'è.
          pe: { ingannare: 5 }
          effetti: { cristalli.frammento-esausto: 2 }
        fallimento:
          titolo: Nessuno dietro
          testo: |
            Chiami il compagno immaginario con il tono che si usa per il cane a
            cena, e lui guarda il sentiero vuoto e capisce. Per la vergogna di
            essersi spaventato ti prende di striscio sul fianco con un affondo
            storto, e poi scappa lo stesso, con la sacca che gli sbatte sulla
            schiena.
          effetti: { ferite: 0.5 }

  - id: carta-sup2-gaddo
    tipo: seguito
    area: superficie-fratturata
    immagine: icone/robber
    titolo: Gaddo
    sommario: "Il predone si chiama Gaddo, e fino alla primavera scendeva nella Cicatrice con una squadra dei Ponti."
    luogo: Superficie Fratturata, un masso a lato della strada degli scavi
    testo: |
      Si chiama Gaddo e fino alla primavera scendeva nella Cicatrice con una
      squadra dei Ponti, finché una mattina la corda di quello sotto di lui
      si è sfilacciata e lui l'ha tenuta con la sinistra. Due dita sono
      rimaste fra la corda e la roccia, e con tre dita la corda non la tieni,
      così Dragna l'ha tolto dal foglio dei turni con una riga a penna.

      «Ha fatto bene» dice, e intanto racconta che è uscito dalle mura a
      cercare reperti senza trovarne, e da ieri non mangia. «Sei il primo che
      fermo, e speravo in uno più piccolo.»
    opzioni:
      - testo: "Dargli qualche moneta"
        descrizione: "Abbastanza per mangiare qualche giorno e per non dover fermare il prossimo che passa."
        requisiti: [monete >= 5]
        esito:
          titolo: Le monete nella mano buona
          testo: |
            Gli metti le monete nella mano buona e gliela chiudi con la tua. Gaddo
            deglutisce due volte, poi butta nella ghiaia la cinghia vuota della
            lanterna e si avvia verso la città con la lancia sotto il braccio, per
            rivenderla.
          effetti: { monete: -5, tormento: -0.5 }
          imposta: { sup2.predone: 2 }

      - testo: "Mandarlo da Oda Krell"
        descrizione: "Alla baracca di Oda serve qualcuno che porti i pesi e tenga accesa la stufa, e le dita bastano."
        esito:
          titolo: La strada della baracca
          testo: |
            Gli spieghi dov'è la baracca e gli dici di presentarsi con un po' di
            legna sulle spalle, perché Oda apprezza chi non arriva a mani vuote.
            Qualche giorno dopo, al Grifone, un Raschiatore ti racconta che Gaddo
            spacca legna da Oda Krell e ha imparato a bestemmiare come lei.
          effetti: { rep.raschiatori: 0.5, racconto: 1 }
          imposta: { sup2.predone: 3 }

      - testo: "Lasciarlo alla sua strada"
        descrizione: "Ti ha raccontato la sua storia, e non è detto che tu debba fare altro."
        costo: 0
        esito:
          titolo: Il masso
          testo: |
            Gli auguri buona fortuna e riprendi il sentiero. Quando ti volti Gaddo
            è ancora seduto contro il masso con la lancia sulle ginocchia, e
            guarda la strada da cui sei venuto.
          imposta: { sup2.predone: 1 }

  # ================================================================ 26 · la pioggia leggera
  - id: carta-sup2-pioggia-leggera
    tipo: carta
    area: superficie-fratturata
    immagine: icone/raining
    titolo: La pioggia leggera
    sommario: "Comincia una pioggia sottile e fredda che rende lucido il basalto e copre ogni altro rumore."
    luogo: Superficie Fratturata, i gradoni lungo la strada degli scavi
    testo: |
      Il cielo si chiude da ovest e comincia a cadere una pioggia sottile e
      fredda, così fitta che le terrazze lontane spariscono. Il basalto si fa
      lucido come una padella unta, e il rumore dell'acqua copre ogni altro
      suono, compresi i tuoi passi. Più avanti, dove il sentiero passa accanto
      a un anello di metallo, la pioggia sale in vapore, e intorno all'anello
      qualcosa di tondo luccica a terra, fermo come un sasso.

      {furtivita Media} Con questo rumore potresti passare accanto a un cane
      da guardia senza svegliarlo, e nemmeno tu sentiresti lui.
    opzioni:
      - testo: "Proseguire sotto l'acqua"
        descrizione: "Il basalto bagnato scivola, e il sentiero corre lungo il bordo dei gradoni."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Facile }
        successo:
          titolo: Fradicio ma in piedi
          testo: |
            Cammini piano, con il peso sui talloni e una mano vicina alla roccia,
            e arrivi dall'altra parte dei gradoni fradicio e con i polpacci che
            tremano, senza un piede in fallo.
          pe: { atletica: 5 }
        fallimento:
          titolo: Il gradone
          testo: |
            Su una lastra inclinata lo stivale parte da solo, e scendi un gradone
            intero sul fianco prima di aggrapparti a uno spuntone. Ti rialzi con
            il gomito sbucciato, e la pioggia si mette a cadere più forte, con un
            tempismo che ha qualcosa di personale.
          effetti: { ferite: 0.5 }

      - testo: "Aspettare sotto una sporgenza"
        descrizione: "Ci vuole tempo, ma sotto la roccia si sta all'asciutto."
        costo: 2
        esito:
          titolo: Sotto la sporgenza
          testo: |
            Ti siedi sotto una sporgenza con le ginocchia al petto, mangi quello
            che hai e a un certo punto ti addormenti. Ti svegli che ha smesso, con
            il collo rigido e la testa più leggera, e una lucertola grigia
            sistemata sul tuo stivale.
          effetti: { tormento: -0.5 }

      - testo: "Approfittare del rumore"
        descrizione: "I droni ciechi sentono i passi, e le cose tonde vicino all'anello sono droni che dormono."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Fra i droni che dormono
          testo: |
            Ti avvicini all'anello un passo per ogni raffica. Intorno al metallo
            stanno a terra una dozzina di sfere grandi come un pugno, con le linee
            incise spente e un filo di luce ancora in fondo, e alla base
            dell'anello trovi un guscio sigillato e qualche scaglia. Li prendi con
            due dita e torni indietro allo stesso modo.
          pe: { furtivita: 8 }
          effetti: { reperto.sigillato: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: La pausa nella pioggia
          testo: |
            A due passi dall'anello la pioggia si ferma di colpo, e il tuo stivale
            fa rumore nel fango. Una sfera si alza e ti insegue ronzando finché la
            pioggia non riprende, e ti lascia sulla spalla una bruciatura grande
            come una moneta.
          effetti: { ferite: 1 }

  # ================================================================ 27 · i rifugiati
  - id: carta-sup2-rifugiati
    tipo: carta
    area: superficie-fratturata
    immagine: icone/knapsack
    titolo: I rifugiati del casale
    sommario: "Una famiglia di sfollati va verso la città con tutto nei sacchi e gli orli dei vestiti grigi."
    luogo: Superficie Fratturata, il sentiero che sale dalle terrazze basse
    requisiti: [sup2.rifugiati == 0]
    testo: |
      Sul sentiero viene verso di te un gruppo di sette o otto persone con due
      bambini, al passo del più lento, con tutto quello che hanno nei sacchi e
      un uomo che porta sulla schiena una sedia impagliata. Si fermano, e una
      donna con il fazzoletto in testa si mette davanti agli altri con le mani
      aperte, perché tu le veda vuote. Hanno tutti l'orlo dei vestiti grigio
      di una polvere chiara che conosci.

      {origine fuggiasco-di-ghoran} Anche tu sei arrivato a Qir-Azel con
      quello che avevi addosso, e invidiavi chi aveva almeno un sacco da
      stringere al petto.
    opzioni:
      - testo: "Accompagnarli fino ai Ponti"
        descrizione: "Con loro si va piano, ma ai Ponti Sospesi c'è chi accoglie gente così."
        costo: 2
        esito:
          titolo: Il braciere di Mamma Tesh
          testo: |
            Cammini con loro fino alle mura e giù per i sottoponti, fino al
            braciere di Mamma Tesh. Per strada la donna con il fazzoletto, Brisa,
            ti racconta del pozzo del casale che una notte ha cominciato a fumare
            grigio. Mamma Tesh fa posto intorno all'elmo rovesciato senza chiedere
            niente, e prima che tu te ne vada Brisa ti stringe la mano con tutte e
            due le sue.
          effetti: { rep.ponti: 0.5, racconto: 1 }
          imposta: { sup2.rifugiati: 1 }

      - testo: "Dividere con loro le bende"
        descrizione: "Il bambino più piccolo cammina con i piedi fasciati di stracci, e gli stracci sono rossi."
        requisiti: [bende >= 1]
        esito:
          titolo: I piedi del bambino
          testo: |
            Ti inginocchi nella polvere e fasci i piedi del bambino, che stringe i
            pugni a ogni giro di benda. La donna con il fazzoletto si chiama Brisa
            e va ai Ponti, dove dormono quelli che non hanno dove dormire, e prima
            di ripartire ti dice da quale crepa è salita la nebbia e di chiedere
            di lei sotto le assi.
          effetti: { bende: -1, tormento: -0.5, informazioni.voce: 1 }
          imposta: { sup2.rifugiati: 1 }

      - testo: "Lasciarli passare"
        descrizione: "Hanno la loro strada e tu la tua."
        costo: 0
        esito:
          titolo: Il sentiero libero
          testo: |
            Ti fai da parte e ti sfilano davanti senza guardarti, con la sedia
            impagliata per ultima. Il bambino si volta una volta sola, quando sono
            già lontani.

      - testo: "Pretendere qualcosa per il passaggio"
        descrizione: "Sono stanchi e disarmati, ma chi ha poco da perdere a volte si difende male e forte."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Facile }
        successo:
          titolo: Il fazzoletto annodato
          testo: |
            La donna con il fazzoletto non discute. Si scioglie un nodo dall'orlo
            della manica e ti lascia cadere ai piedi un fazzoletto con dentro
            qualche moneta, poi porta gli altri intorno a te, larghi, tenendo il
            bambino per il polso. Ai Ponti, dove vanno a dormire, il tuo nome lo
            sapranno prima di sera.
          effetti: { monete: 3, tormento: 1.5, rep.ponti: -0.5 }
          imposta: { sup2.rifugiati: 2 }
        fallimento:
          titolo: La sedia
          testo: |
            L'uomo con la sedia se la sfila e te la rompe sulla spalla prima che
            tu finisca la frase. Mentre sei a terra fra le schegge di paglia gli
            altri ti passano accanto di corsa, e ai Ponti raccontano la storia per
            una settimana, con la sedia ogni volta più grossa.
          effetti: { ferite: 1, rep.ponti: -0.5 }
          imposta: { sup2.rifugiati: 2 }

  # ================================================================ 28 · l'arma abbandonata
  - id: carta-sup2-arma-abbandonata
    tipo: carta
    area: superficie-fratturata
    immagine: icone/drop-weapon
    titolo: La spada sulla polvere
    sommario: "Accanto a una pietra piatta c'è una spada corta unta di fresco, senza fodero, su una polvere di colore strano."
    luogo: Superficie Fratturata, una pietra piatta a due passi dal sentiero
    requisiti: [sup2.arma == 0]
    testo: |
      Accanto a una pietra piatta c'è una spada corta posata in terra, con
      la lama unta di fresco e l'impugnatura fasciata di cuoio nuovo, senza
      fodero. Intorno non ci sono sangue né segni di lotta, soltanto qualche
      orma che va e viene. Chi l'ha lasciata ci teneva, perché nessuno unge
      una lama da buttare. La polvere qui è più chiara di quella del
      sentiero, e vicino all'elsa forma una crosta sottile, incrinata come
      la pelle del latte.

      {origine rampollo-dei-quartieri-alti} Anche la tua spada corta è
      un'arma buona, e finora è servita soprattutto a impigliarsi nelle
      sedie.
    opzioni:
      - testo: "Raccoglierla subito"
        descrizione: "È lì ed è buona, ma la crosta chiara intorno all'elsa non promette niente di buono."
        esito:
          titolo: Il freddo alle caviglie
          testo: |
            La prendi per l'impugnatura, e la crosta sotto l'elsa si rompe come
            ghiaccio sottile, lasciando uscire una nebbia grigia che ti sale fino
            alle caviglie. Salti indietro con la spada in mano, e il freddo ti
            resta nelle ossa delle gambe fino a sera.
          effetti: { oggetto.spada-corta: 1, contaminazione: 1.5 }
          imposta: { sup2.arma: 1 }

      - testo: "Leggere le orme prima"
        descrizione: "Chi l'ha lasciata ha visto qualcosa, e le orme dicono da che parte prenderla."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il lato buono
          testo: |
            Il padrone della spada stava fermo vicino alla pietra, poi è saltato
            indietro ed è scappato, e da quel punto la polvere è chiara e
            crostosa, con la Marea che ci dorme sotto. Fai il giro dalla parte del
            terreno scuro e tiri a te la spada con un ramo secco, senza mettere
            piede sulla crosta.
          pe: { percezione: 6 }
          effetti: { oggetto.spada-corta: 1, informazioni.voce: 1 }
          imposta: { sup2.arma: 1 }
        fallimento:
          titolo: Nel mezzo
          testo: |
            Sei così attento alle orme che non guardi dove metti i piedi, e la
            crosta ti si rompe sotto lo stivale. Ti tiri fuori di corsa dalla
            nebbia grigia che sale fino al ginocchio, e la spada resta dov'è.
          effetti: { contaminazione: 1 }

      - testo: "Lasciarla dov'è"
        descrizione: "Chi l'ha lasciata aveva un motivo, e il motivo forse è ancora lì sotto."
        costo: 0
        esito:
          titolo: La pietra piatta
          testo: |
            Torni sul sentiero senza toccarla, e dopo qualche passo ti accorgi di
            camminare sul bordo esterno, il più lontano possibile dalla pietra.

  # ================================================================ 29 · il cadavere recente
  - id: carta-sup2-cadavere-recente
    tipo: carta
    area: superficie-fratturata
    immagine: icone/death-skull
    titolo: Il cadavere recente
    sommario: "In mezzo al sentiero c'è un uomo morto da poco, senza ferite che si vedano."
    luogo: Superficie Fratturata, il sentiero fra due gradoni
    testo: |
      In mezzo al sentiero c'è un uomo giovane disteso su un fianco, con un
      braccio allungato in avanti come per aggrapparsi alla ghiaia. Ha la
      sacca ancora a tracolla e gli stivali buoni, e nessuna ferita che si
      veda, soltanto i denti stretti in una smorfia. Più su un sasso rotola e
      si ferma, e ti ritrovi con una mano sull'arma.

      {medicina Media} Morto da meno di un'ora, perché le dita della mano
      allungata sono ancora morbide.

      {origine figlio-della-citta-bassa} Nei tuoi vicoli un morto con gli
      stivali buoni non resta calzato fino a sera.
    opzioni:
      - testo: "Esaminare il corpo"
        descrizione: "Un uomo non muore così senza un motivo, e il motivo potrebbe essere ancora qui intorno."
        prova: { attributo: mentale, abilita: [medicina, percezione], difficolta: Media }
        successo:
          titolo: Tre segni sulla nuca
          testo: |
            Sotto il colletto la pelle è ancora tiepida, e sulla nuca ha tre
            bruciature tonde in fila, piccole come monete, più una quarta sulla
            spalla. Le suole sono consumate in punta. Ha sentito i droni ciechi e
            si è messo a correre, e loro hanno seguito il rumore dei suoi passi
            fino a qui, e tu ti segni la direzione da cui è venuto.
          pe: { medicina: 6 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: La smorfia
          testo: |
            Lo guardi a lungo senza trovarci un taglio o un livido, e quella
            notte, appena chiudi gli occhi, rivedi la sua faccia con i denti
            stretti, e per un momento ti sembra la tua.
          effetti: { tormento: 1.5 }

      - testo: "Frugare nella sacca"
        descrizione: "A lui non serve più niente. A te qualcosa sì."
        esito:
          titolo: La roba di un morto
          testo: |
            Gli sfili la sacca da sotto il braccio, già rigido. Dentro ci sono una
            borsetta di monete e un rotolo di bende. In un fazzoletto ricamato con
            un'iniziale storta trovi due frammenti di cristallo, e il fazzoletto
            lo rimetti nella sacca accanto a lui.
          effetti: { monete: 4, bende: 1, cristalli.frammento-esausto: 2, tormento: 1 }

      - testo: "Lasciarlo dov'è"
        descrizione: "Qualcuno lo troverà, o la Superficie se lo terrà."
        costo: 0
        esito:
          titolo: La giacca
          testo: |
            Gli abbassi le palpebre e gli copri la faccia con la sua giacca.
            Riprendi il sentiero senza fare rumore, in punta di piedi come in una
            casa dove qualcuno dorme.

  # ================================================================ 31 · i cervi nervosi
  - id: carta-sup2-cervi-nervosi
    tipo: carta
    area: superficie-fratturata
    immagine: icone/deer
    titolo: I cervi nervosi
    sommario: "Un branco di cervi ti guarda senza scappare, finché il maschio guarda oltre la tua spalla."
    luogo: Superficie Fratturata, una fila di pini storti fra due terrazze
    testo: |
      Fra due terrazze, sotto una fila di pini storti, c'è un branco di sei o sette
      cervi con il mantello ingrigito dalla polvere. Ti vedono e restano dove sono, cosa
      che i cervi selvatici non fanno mai. Il maschio, con il palco spezzato da una
      parte, ti guarda a lungo, poi sposta gli occhi oltre la tua spalla e li tiene lì.
      All'improvviso il branco scatta e sparisce fra i pini, e resta un silenzio netto.

      {origine figlio-del-circolo} Il pelo ingrigito ti ricorda la volpe toccata dalla
      Marea che da bambino hai visto abbattere nel Bosco di Velthar.
    opzioni:
      - testo: "Voltarsi a guardare"
        descrizione: "Il cervo guardava qualcosa alle tue spalle, e bisogna voltarsi piano."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Mezzo battito
          testo: |
            Ti volti piano. A una ventina di passi c'è una sagoma di nebbia grigia
            alta come un uomo, con troppe articolazioni, che si volta insieme a te
            con mezzo battito di ritardo. Ti sposti di lato un passo alla volta, e
            lei ti imita sempre peggio finché perde il filo e si affloscia dentro
            una crepa.
          pe: { percezione: 8 }
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Il gesto rifatto
          testo: |
            Ti volti troppo in fretta, e la sagoma di nebbia grigia è già a un
            braccio da te. Alza la mano insieme a te, e quando la tua si ferma la
            sua continua fino a toccarti il polso. Corri fra i pini con il freddo
            fino alla spalla, e la manica resta grigia per giorni.
          effetti: { contaminazione: 1.5 }

      - testo: "Seguire i cervi"
        descrizione: "I cervi sanno dove la Marea non arriva, se gli si sta dietro fra le radici."
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: L'acqua dei cervi
          testo: |
            Segui le orme fresche giù per una gola stretta fino a una polla
            d'acqua chiara sotto una parete di basalto, dove i cervi bevono
            dall'altra parte e ti lasciano fare. Ti lavi le ferite con la schiena
            contro la roccia, finché il maschio alza la testa e il branco se ne
            va.
          pe: { atletica: 5 }
          effetti: { ferite: -0.5 }
        fallimento:
          titolo: Le radici
          testo: |
            Fra i pini il terreno è una rete di radici, e una ti piega la caviglia
            con un dolore bianco. Quando ti rialzi del branco non senti più
            nemmeno il rumore.
          effetti: { ferite: 0.5 }

      - testo: "Proseguire senza voltarsi"
        descrizione: "Qualunque cosa li abbia spaventati è alle tue spalle, e forse ti lascia andare."
        esito:
          titolo: Il freddo alla schiena
          testo: |
            Riprendi il sentiero a passo normale, anche se le gambe vorrebbero
            correre, con un freddo fra le scapole che se ne va piano. La sera,
            togliendoti la giacca, trovi la schiena grigia di una polvere chiara
            che non viene via con la spazzola.
          effetti: { contaminazione: 1 }
