# Superficie Fratturata, carte del mazzo (seconda parte): dieci incontri dalla tabella del master, riscritti.
# 18 il cavallo senza cavaliere (riportarlo a Dolovan Stroud alla Zanna Rotta o seguire le tracce del padrone;
# sup2.cavallo), 19 la reliquia intatta (il campo di forza una volta sola, con oggetto.campo-di-forza == 0),
# 21 l'uomo del Velo con la maschera liscia (una volta sola, sup2.velo), 22 la carovana ridotta (bende, tonico,
# un reperto da vendere, notizie; ripetibile), 24 il predone solitario (scontro predone-solitario; la sua storia
# una volta sola, con il seguito carta-sup2-gaddo e sup2.predone), 26 la pioggia leggera, 27 i rifugiati del
# casale (una volta sola, sup2.rifugiati: chi li aiuta li ritrova sotto i Ponti), 28 la spada lasciata sulla
# crosta della Marea (una volta sola, sup2.arma), 29 il cadavere recente, 31 i cervi nervosi.
# Nomi nuovi, che il Codex non dà: Gaddo (Raschiatore senza due dita), Brisa (la donna dei rifugiati).
# I numeri stanno solo negli effetti (docs/stile-dei-testi.md, regola 11).
quality:
  - { id: sup2.cavallo, nome: "Il cavallo senza cavaliere", categoria: stato, nascosta: true, descrizione: "1 quando hai riportato il cavallo senza cavaliere alla Zanna Rotta o hai trovato dove finiscono le orme del padrone." }
  - { id: sup2.velo, nome: "L'uomo del Velo alla pietra", categoria: stato, nascosta: true, descrizione: "1 se l'uomo del Velo con la maschera liscia ti ha risposto, 2 se si è chiuso davanti alle tue insistenze, 3 se gli hai messo le mani addosso." }
  - { id: sup2.predone, nome: "Gaddo", categoria: stato, nascosta: true, descrizione: "1 se hai ascoltato la storia di Gaddo e l'hai lasciato alla sua strada, 2 se gli hai dato qualche moneta, 3 se l'hai mandato a lavorare da Oda Krell." }
  - { id: sup2.rifugiati, nome: "I rifugiati del casale", categoria: stato, nascosta: true, descrizione: "1 se hai aiutato Brisa e la sua gente, che adesso vivono sotto i Ponti e si ricordano di te, 2 se li hai minacciati." }
  - { id: sup2.arma, nome: "La spada sulla crosta", categoria: stato, nascosta: true, descrizione: "1 quando hai raccolto la spada corta lasciata sulla crosta della Marea." }

storylet:
  # ================================================================ 18 · il cavallo senza cavaliere
  - id: carta-sup2-cavallo-senza-cavaliere
    tipo: carta
    area: superficie-fratturata
    immagine: icone/horse-head
    titolo: Il cavallo senza cavaliere
    sommario: "Un cavallo sellato cammina da solo sul sentiero, con le redini fra le zampe e la staffa destra accorciata per qualcuno che non c'è."
    luogo: Superficie Fratturata, il sentiero dei carri sotto le terrazze
    requisiti: [sup2.cavallo == 0]
    testo: |
      Sul sentiero, un tiro di sasso più avanti, un cavallo baio cammina al
      passo per conto suo. Ha ancora la sella, con una bisaccia legata
      dietro e una coperta arrotolata. Le redini gli strisciano fra le
      zampe, masticate in punta dove ci ha messo sopra lo zoccolo. Sul
      fianco sinistro, all'altezza della staffa, il pelo è sporco di una
      polvere chiara che sembra farina.

      {natura Media} Sulla Superficie una polvere così fine e così chiara di
      solito vuol dire Marea che si è posata e poi è seccata. Meglio non
      toccarla a mani nude.

      Quando ti sente alza la testa e si ferma, con le orecchie girate verso
      di te e una zampa di dietro appena sollevata. Non scappa e non ti
      viene incontro. La staffa destra è più corta della sinistra di tre
      buchi.

      {cavalcare Media} Chi l'ha accorciata cavalcava storto da anni, tutto
      sul fianco destro, come fa un uomo con una vecchia ferita che si è
      abituato a proteggere.

      *Stamattina qualcuno gli ha stretto il sottopancia.* Ti accorgi di
      avere già la mano tesa con il palmo in giù, come ti hanno insegnato da
      bambino con i cani dei vicini.
    opzioni:
      - testo: "Avvicinarlo con calma"
        descrizione: "Un cavallo spaventato si prende con la voce e con la pazienza. Alla Zanna Rotta Dolovan Stroud paga chi gli riporta le bestie perse."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: La Zanna Rotta
          testo: |
            Gli parli piano di cose senza importanza finché smette di girare le
            orecchie, poi raccogli le redini da terra senza strattonarle. Ti segue
            fino in città con il muso contro la tua spalla, e ogni tanto ti spinge
            con il naso per farti camminare più svelto. Alle Scuderie della Zanna
            Rotta Dolovan Stroud gli guarda i denti e gli tasta le gambe una per
            una prima di guardare te. Riconosce il marchio di una carovana di
            Laresh sotto la sella, e ti paga il recupero contando le monete sul
            palmo. Il baio resta da lui, finché qualcuno non viene a reclamarlo.

            {conoscenze-della-strada Media} Stroud ha pagato senza discutere, e
            uno stalliere che non discute il prezzo sa di aver fatto un buon
            affare.
          pe: { addestrare-animali: 8 }
          effetti: { monete: 8 }
          imposta: { sup2.cavallo: 1 }
        fallimento:
          titolo: Il calcio
          testo: |
            Al terzo passo il cavallo decide che sei troppo vicino. Si gira
            sulle zampe di dietro e ti prende con uno zoccolo sulla coscia, di
            striscio, abbastanza da metterti a sedere sulla ghiaia. Quando
            riesci a rialzarti è già lontano verso le terrazze, con le redini
            che saltano dietro di lui. Per il resto della giornata zoppichi, e
            la coscia ti fa male a ogni gradone.

            {resistenza Facile} Domani ci sarà un livido grande quanto uno
            zoccolo, con la forma del ferro ben disegnata in mezzo.
          effetti: { ferite: 1 }

      - testo: "Seguire le tracce del padrone"
        descrizione: "Gli zoccoli tornano indietro fino al punto in cui il cavallo era in due. Da lì in avanti bisogna leggere il terreno."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Gli stivali
          testo: |
            Risali le orme del baio fino a un punto in cui la ghiaia è
            smossa, e da lì partono le orme di un uomo che lascia il sentiero
            verso un anello di metallo mezzo sepolto. Intorno all'anello la
            polvere è chiara come quella sul fianco del cavallo. Le orme
            arrivano al bordo e finiscono. Sul bordo ci sono due stivali ancora
            allacciati, messi uno accanto all'altro.

            {resilienza Media} Allacciati, e messi in ordine. Nessuno si toglie
            gli stivali così per scappare. Ti si stringe la gola, e lasci che si
            stringa.

            Poco più in là c'è una tracolla con dentro un guscio sigillato avvolto
            nella lana. Prendi la tracolla. Gli stivali li lasci dove sono.
          pe: { natura: 6 }
          effetti: { reperto.sigillato: 1, tormento: 0.5, racconto: 1 }
          imposta: { sup2.cavallo: 1 }
        fallimento:
          titolo: La polvere chiara
          testo: |
            Le orme ti portano fuori dal sentiero e poi si confondono con quelle
            di un branco di capre selvatiche. Mentre cerchi di separarle ti
            ritrovi fino alle caviglie in una chiazza di polvere chiara, fredda
            come neve vecchia. Ne esci di corsa, con la pelle che formicola sotto
            le calze e un sapore di ferro che ti sale in bocca senza motivo. Il
            cavallo, quando torni sul sentiero, se n'è andato.
          effetti: { contaminazione: 1 }

      - testo: "Lasciarlo alla sua strada"
        descrizione: "Il cavallo non è tuo. Prima o poi qualcuno verrà a cercarlo."
        costo: 0
        esito:
          titolo: Al passo
          testo: |
            Lo superi tenendoti largo, e il baio ti guarda passare girando
            soltanto gli occhi, senza smettere di masticare il niente. Quando ti
            volti, dopo un tratto, cammina di nuovo al passo verso le terrazze,
            con le redini fra le zampe.

  # ================================================================ 19 · la reliquia intatta
  - id: carta-sup2-reliquia-intatta
    tipo: carta
    area: superficie-fratturata
    immagine: icone/frozen-orb
    titolo: La reliquia intatta
    sommario: "Fra i detriti di un gradone c'è un oggetto piccolo senza un graffio, e la ghiaia intorno è coperta di brina a mezzogiorno."
    luogo: Superficie Fratturata, i detriti ai piedi di un gradone di basalto
    testo: |
      Fra i detriti ai piedi di un gradone, dove la roccia si è sbriciolata
      in ghiaia nera, qualcosa manda un riflesso che non ha il colore del
      basalto. È un oggetto grande quanto un palmo, mezzo incastrato fra due
      sassi, di un metallo grigio chiaro che prende una sfumatura verde dove
      batte la luce. La superficie è liscia e senza un graffio, e intorno la
      ghiaia ha una crosta sottile di brina anche adesso che è mezzogiorno.

      Quando avvicini la mano senti il freddo prima ancora di toccarlo, come
      davanti alla porta aperta di una ghiacciaia. Poco più in là un anello
      di metallo è piegato a metà come una forcina, e i sassi intorno sono
      spaccati, mentre questo affare sembra uscito ieri da una bottega.

      {tecnologia Media} I Precursori facevano le cose per durare, ma il
      freddo è un'altra faccenda. Un oggetto che consuma calore per stare
      intatto sta ancora lavorando.

      {magia Difficile} Il Mana intorno è immobile, tenuto a distanza di una
      mano tutto in giro. L'oggetto non lo assorbe e non lo respinge del
      tutto, gli impedisce soltanto di avvicinarsi.

      {origine allievo-di-torvessa} Le prime formule che ti ha insegnato
      Temmerin servono tutte a chiamare il Mana dentro un cristallo. Di un
      oggetto che lo tiene fuori, all'Accademia, non hai sentito parlare
      nemmeno nei libri che si leggono in piedi, vicino allo scaffale.

      *Centocinquant'anni sotto la ghiaia e nemmeno un'ammaccatura.* Le dita
      ti si sono chiuse a pugno da sole, e non sai bene se per scaldarle o
      per tenerle lontane.
    opzioni:
      - testo: "Staccarlo dai sassi"
        descrizione: "È incastrato e gela le dita. Bisogna tenerlo stretto finché i sassi non lo mollano."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Facile }
        successo:
          titolo: Avvolto nella lana
          testo: |
            Lo stringi con tutte e due le mani e tiri, mentre il freddo ti sale
            fino ai gomiti e i denti ti si serrano da soli. I sassi cedono di
            colpo. Appena è fuori dalla ghiaia il metallo si chiude su se stesso
            con uno scatto e diventa un guscio liscio, senza fessure. Lo avvolgi
            in una pezza di lana e lo infili in fondo alla sacca, dove continua a
            raffreddarti la schiena per un pezzo di strada.
          effetti: { reperto.sigillato: 1 }
        fallimento:
          titolo: Le dita bianche
          testo: |
            Tiri, e il freddo ti morde le dita fino a togliere la sensibilità.

            {resistenza Facile fallita} Le mani decidono per conto loro che ne
            hanno abbastanza, e non ti consultano.

            Molli la presa prima di accorgertene. Quando riprovi, l'oggetto è
            scivolato più giù fra i sassi, e in mano ti resta soltanto una
            scaglia staccata dal bordo. Le punte delle dita restano bianche
            fino a sera, e poi bruciano.
          effetti: { ferite: 0.5, reliquie.scheggia: 1 }

      - testo: "Studiarlo prima di toccarlo"
        descrizione: "Un oggetto che il tempo non tocca ha un motivo per non farsi toccare. Capirlo richiede pazienza e qualche nozione dei Precursori."
        quando: [oggetto.campo-di-forza == 0]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Difficile }
        successo:
          titolo: Il cerchio di brina
          testo: |
            Ti accucci e lo guardi senza toccarlo. La brina intorno forma un
            cerchio perfetto largo una mano. Dentro il cerchio la ghiaia è più
            bassa, come spinta via. Al centro dell'oggetto c'è un incavo grande
            come un pollice, e il pollice ti prude dalla voglia di provarlo.
            Capisci che è un disco fatto per stare sul petto, e che per
            centocinquant'anni ha tenuto lontano tutto quello che gli cadeva
            addosso. Lo sollevi con un bastone e lo avvolgi nella giacca.
          pe: { tecnologia: 10 }
          effetti: { oggetto.campo-di-forza: 1 }
        fallimento:
          titolo: La spinta
          testo: |
            Tocchi l'incavo al centro per vedere che cosa fa, e l'aria davanti
            all'oggetto ti spinge indietro come una mano aperta sul petto. Finisci
            di schiena sulla ghiaia. Quando ti rialzi il disco si è chiuso in un
            guscio liscio e freddo, che non ha più niente da dirti. Ti tasti il
            petto, dove la spinta ti ha preso, e trovi il cuore che corre. Lo
            metti nella sacca lo stesso, insieme a un livido sulla scapola.
          effetti: { reperto.sigillato: 1, ferite: 0.5 }

      - testo: "Studiarlo prima di toccarlo"
        descrizione: "Il cerchio di brina lo conosci già, da quando hai trovato il disco. Questo però è fatto in un altro modo."
        quando: [oggetto.campo-di-forza >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Un parente lontano
          testo: |
            La brina fa un cerchio più stretto di quello del tuo disco, e
            sull'oggetto l'incavo non c'è. Lo prendi dal lato dove il freddo è più
            debole, e si chiude in un guscio senza strapparti la pelle delle
            dita. È come riconoscere la mano di un fabbro su un attrezzo che
            non ha firmato.

            {accademiche Media} Viene forse dalla stessa bottega. I Precursori a
            quanto pare avevano le loro abitudini, come tutti i buoni artigiani.
          pe: { tecnologia: 5 }
          effetti: { reperto.sigillato: 1 }
        fallimento:
          titolo: Troppo freddo
          testo: |
            Lo giri per guardarne il fondo, e il freddo ti passa dalle dita alla
            testa, dritto dietro gli occhi. Per un momento non ricordi dove stavi
            andando, e nemmeno da dove venivi. L'oggetto scivola fra i sassi e si
            perde, e ti resta in mano una scheggia del bordo.
          effetti: { tormento: 0.5, reliquie.scheggia: 1 }

      - testo: "Lasciarlo dov'è"
        descrizione: "Ha aspettato fino a oggi senza di te."
        costo: 0
        esito:
          titolo: La brina
          testo: |
            Lo lasci fra i sassi e riprendi il sentiero soffiandoti sulle dita,
            che ci mettono un pezzo a tornare tue. Quando ti volti, dal gradone
            sale un filo di vapore bianco come da una tazza appena posata.

  # ================================================================ 21 · l'uomo del Velo alla pietra
  - id: carta-sup2-uomo-del-velo
    tipo: carta
    area: superficie-fratturata
    immagine: icone/hooded-figure
    titolo: L'uomo alla pietra incisa
    sommario: "Accanto a una pietra piantata in verticale un uomo del Velo con la maschera liscia conta nodi su una cordicella e guarda le terrazze."
    luogo: Superficie Fratturata, una pietra incisa sopra le terrazze basse
    requisiti: [sup2.velo == 0]
    testo: |
      Accanto al sentiero c'è una pietra piantata in verticale, alta quanto
      un uomo, con dei segni incisi che il vento ha consumato fino a farli
      sembrare graffi. Contro la pietra sta un uomo in un mantello scuro di
      buona lana, senza un rammendo, così fermo che lo vedi solo quando sei
      a pochi passi. Una maschera liscia, senza fregi, gli copre la fronte e
      gli occhi e si ferma sopra il labbro. La bocca resta scoperta, con le
      labbra screpolate dal vento.

      Fra le dita fa scorrere uno alla volta i nodi di una cordicella, e ogni
      tanto si ferma per alzare la testa verso le terrazze basse. Quando
      arrivi vicino non si volta e piega appena la testa da una parte.

      {percezione Media} Conta con un ritmo preciso. Fra un nodo e l'altro
      lascia passare sempre lo stesso tempo, e ogni tanto aspetta più a
      lungo, con il pollice fermo sul nodo successivo.

      «Non sei qui per caso» dice a voce bassa, senza alzarla alla fine
      della frase. *Il Velo sulla Superficie non ci viene a pregare.* Le sue
      dita intanto continuano a contare.

      {origine accolito-del-velo} In Cattedrale ti hanno insegnato a non
      chiedere cosa c'è sotto l'altare, e la regola, senti, vale anche per
      quello che c'è sotto una maschera. Il corpo se la ricorda prima di te,
      e ti ritrovi con la testa china e la voce già bassa.
    opzioni:
      - testo: "Fargli domande precise"
        descrizione: "Risponde soltanto a quello che gli chiedi, e una domanda vaga la lascia cadere. Bisogna guardare bene che cosa sta contando."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il conto
          testo: |
            Gli chiedi che cosa conta, e lui risponde. Sul gradone più basso delle
            terrazze c'è un anello spezzato che respira, e lui da una luna conta
            ogni volta che si gonfia. Quando domandi a che cosa serve contarle, dice
            che fra una volta e l'altra c'è una pausa, e la pausa si allunga. Allora
            provi con la pausa, e con quello che succede in fondo. Ti dice che chi
            mette le mani sull'anello deve metterle nella pausa e mai mentre si
            gonfia, e torna a contare. Non ti chiede perché lo volevi sapere, e
            questo ti mette addosso più freddo del vento.
          pe: { percezione: 6 }
          effetti: { informazioni.pettegolezzo: 1, rep.velo: 0.5 }
          imposta: { sup2.velo: 1 }
        fallimento:
          titolo: Domande sbagliate
          testo: |
            Le tue domande sono larghe, e lui le lascia cadere una dopo
            l'altra. In cambio lui te ne fa qualcuna sul tuo nome e su dove
            dormi in città. Rispondi prima di pensarci.

            {ingannare Media fallita} Avresti potuto dargli un nome qualunque. Te
            ne viene in mente uno bellissimo mezz'ora dopo, sul sentiero.

            Quando te ne vai ti accorgi che sulla cordicella c'è un nodo nuovo, e
            che l'ha fatto mentre parlavi tu.
          effetti: { sospetto: 0.5 }
          imposta: { sup2.velo: 1 }

      - testo: "Insistere finché non parla"
        descrizione: "Alzare la voce e fargli capire che non te ne vai. Con il Velo di solito funziona poco."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Difficile }
        successo:
          titolo: Il bordo interno
          testo: |
            Gli resti davanti, troppo vicino, abbastanza da sentire l'odore di
            incenso vecchio che ha nel mantello, finché la cordicella si ferma.
            «Oggi, sulla strada degli scavi, cammina sul bordo esterno» dice. «Sul
            bordo interno la roccia è buona fino a domani, forse.» Poi gira la
            testa verso le terrazze, e da quel momento per lui sei una pietra come
            le altre.
          effetti: { informazioni.voce: 1 }
          imposta: { sup2.velo: 2 }
        fallimento:
          titolo: La seconda cordicella
          testo: |
            Più alzi la voce e più lui si fa immobile.

            {intimidire Difficile fallita} Gridare a una maschera è come gridare a
            un muro, con la differenza che il muro non prende nota.

            Alla fine tira fuori dal mantello una seconda cordicella più corta e
            ci fa un nodo guardandoti dritto in faccia. Poi la ripone e torna a
            contare sull'altra. Della prima non sai niente, e della seconda sai
            che adesso c'è sopra anche il tuo nome.
          effetti: { sospetto: 1 }
          imposta: { sup2.velo: 2 }

      - testo: "Strappargli la cordicella"
        descrizione: "I nodi diranno quello che lui tace. Il Velo però ha buona memoria per chi mette le mani addosso ai suoi."
        esito:
          titolo: Il capo tagliato
          testo: |
            Allunghi la mano e afferri la cordicella. L'uomo fa senza fretta un
            solo passo indietro e finisce dietro la pietra. Quando ci giri intorno
            non c'è più, e la ghiaia dall'altra parte non ha nemmeno un'impronta.
            Ti resta in mano un pezzo di cordicella tagliato netto, con una fila
            di nodi che a qualcuno in città dirà qualcosa. Per qualche giorno,
            quando passi davanti a una porta del Velo, la porta si chiude un
            momento prima.
          effetti: { informazioni.voce: 1, rep.velo: -0.5, sospetto: 0.5 }
          imposta: { sup2.velo: 3 }

      - testo: "Tirare dritto"
        descrizione: "Il Velo conta quello che vuole, e tu hai strada da fare."
        costo: 0
        esito:
          titolo: I nodi
          testo: |
            Gli passi davanti senza rallentare. Lui ti segue con la maschera per
            qualche passo, poi la gira di nuovo verso le terrazze, e dietro di te
            senti le dita che riprendono a scorrere sui nodi. La nuca ti resta
            fredda fino alla curva.

  # ================================================================ 22 · la carovana ridotta
  - id: carta-sup2-carovana-ridotta
    tipo: carta
    area: superficie-fratturata
    immagine: icone/caravan
    titolo: La carovana ridotta
    sommario: "Due carri magri e cinque persone a piedi sulla pista di Laresh. Hanno poca roba da vendere e la vendono a prezzo fermo."
    luogo: Superficie Fratturata, la pista dei carri verso Laresh
    testo: |
      Sulla pista dei carri che va verso Laresh avanza piano una piccola
      carovana, due carri coperti tirati da buoi così magri che gli si
      contano le costole, e intorno cinque persone a piedi con le armi alla
      cintura e la polvere fino alle ginocchia. Uno dei carri ha una ruota
      rifatta con un legno più chiaro, che cigola a ogni giro.

      Quando ti vedono rallentano fino a fermarsi senza dire una parola. Una
      donna anziana resta a cassetta con la balestra in grembo.

      {armi-da-distanza Media} La balestra è carica e la sicura è tolta. La
      vecchia tiene il dito lungo il fusto, lontano dal grilletto. L'ha
      usata abbastanza da non doverlo dimostrare a nessuno.

      Si fa avanti un uomo con la barba grigia tagliata corta e un orecchio
      solo, e prima di parlare si pulisce le mani sui pantaloni.

      «Roba ne abbiamo poca» dice. «Però è roba onesta, e il prezzo è quello
      che dico la prima volta, perché a ripeterlo mi stanco.» Ti guarda dalla
      testa agli stivali e si ferma sulle tue mani, per vedere dove le tieni.

      {conoscenze-della-strada Facile} Buoi magri e prezzo fermo. Hanno
      perso qualcosa per strada e devono rifarsi prima di Laresh, quindi lo
      sconto non te lo fanno.

      {origine mercante-dei-ponti} Sui Ponti il prezzo detto una volta sola
      lo fa chi non può permettersi di trattare, e hai imparato presto a non
      insistere con loro. Ti trovi a guardare la ruota rifatta invece della
      merce, perché ti dice quanto sono lontani da casa.
    opzioni:
      - testo: "Comprare bende"
        descrizione: "Rotoli bolliti e piegati nella carta. Costano poco meno che in città."
        requisiti: [monete >= 8]
        esito:
          titolo: Nella carta
          testo: |
            L'uomo con un orecchio solo tira fuori da una cassa un rotolo di bende
            piegato nella carta oleata e te lo mette in mano. Conta le monete due
            volte, la seconda muovendo le labbra. Dietro di lui la donna a
            cassetta ha già rimesso la balestra sotto il sedile, e adesso sbuccia
            una mela con lo stesso coltello di prima.
          effetti: { monete: -8, bende: 1 }

      - testo: "Comprare un tonico"
        descrizione: "Una boccetta chiusa con la cera, che la donna a cassetta tiene sotto il sedile insieme alla balestra."
        requisiti: [monete >= 25]
        esito:
          titolo: La boccetta
          testo: |
            La donna a cassetta si fa dare le monete prima di muoversi. Poi
            si china sotto il sedile e ne tira fuori una boccetta scura con il
            tappo sigillato nella cera. Prima di dartela la scuote vicino
            all'orecchio, per sentire che è piena, e ti dice di berla tutta in
            una volta, perché a metà fa più male che bene.

            {medicina Media} La cera del tappo è intatta e il fondo non ha
            depositi. Roba fatta bene, da qualcuno che sapeva le dosi.
          effetti: { monete: -25, tonico: 1 }

      - testo: "Vendere un reperto sigillato"
        descrizione: "Oda Krell lo pagherebbe di più, ma la baracca è lontana e la carovana paga subito."
        quando: [reperto.sigillato >= 1]
        esito:
          titolo: Il guscio sul carro
          testo: |
            L'uomo prende il guscio e lo soppesa, poi lo annusa. Ti offre meno di
            quanto vale, e sa benissimo che lo sai anche tu. Gli stringi la mano
            lo stesso, e la sua è secca e ruvida come la corteccia. Il guscio
            finisce in una cassetta piena di paglia insieme ad altri due uguali, e
            lui la chiude a chiave.
          effetti: { reperto.sigillato: -1, monete: 4 }

      - testo: "Chiedere com'è la strada"
        descrizione: "Chi viaggia con i carri sa dove la Marea è salita negli ultimi giorni, e lo dice volentieri a chi non ha fretta."
        esito:
          titolo: Le notizie della pista
          testo: |
            L'uomo si siede sul timone del carro e ti racconta la strada da
            Laresh fin qui, pietra per pietra. Due giorni fa una crepa vicino
            al guado ha cominciato a fumare grigio, e hanno perso un bue. Le
            frecce bianche sui sassi dopo il secondo gradone, dice, sono di
            nuovo girate, e chiunque sia a girarle non lo fa più per scherzo.

            {natura Media} Una crepa che fuma grigio vuol dire Marea che sale da
            sotto. Il bue se n'è accorto prima degli uomini, e l'ha pagata per
            tutti.
          effetti: { informazioni.voce: 1 }

      - testo: "Minacciarli"
        descrizione: "Sono stanchi e lontani da casa. Però sono cinque, e la vecchia a cassetta non ha l'aria di sbagliare la mira."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: La cassa lasciata indietro
          testo: |
            Non combattono. Si stringono intorno ai carri e arretrano tutti
            insieme, con la vecchia che ti tiene sotto tiro dal sedile finché non
            sono fuori portata. Sulla pista lasciano una cassa, perché tu ti fermi
            ad aprirla invece di seguirli, e ti fermi davvero. Dentro trovi bende
            e un sacchetto di monete. A Laresh e al Mercato dei Nodi, entro una
            settimana, la tua faccia la descrivono bene.
          effetti: { monete: 5, bende: 1, rep.gilda: -0.5, sospetto: 0.5 }
        fallimento:
          titolo: La fuga in ordine
          testo: |
            Al primo passo che fai verso i carri la vecchia ti pianta un dardo
            nella polvere fra gli stivali, e il secondo ti apre la manica e un po'
            di braccio. Il dolore arriva con un attimo di ritardo, caldo. Mentre
            ti tieni il gomito la carovana riparte senza correre, con gli uomini
            che camminano all'indietro. A Laresh racconteranno che sulla pista c'è
            un predone in più.
          effetti: { ferite: 1, rep.gilda: -0.5 }

  # ================================================================ 24 · il predone solitario
  - id: carta-sup2-predone-solitario
    tipo: carta
    area: superficie-fratturata
    immagine: icone/robber
    titolo: Il predone solitario
    sommario: "Da dietro un masso esce un uomo con una lancia corta e chiede la tua borsa. È solo, e la lancia la tiene come una scopa."
    luogo: Superficie Fratturata, un masso a lato della strada degli scavi
    testo: |
      Da dietro un masso a lato del sentiero esce un uomo con una lancia
      corta puntata verso di te. La tiene troppo in alto, con le mani strette
      vicine sull'asta, come si tiene una scopa. Porta una giubba di cuoio da
      Raschiatore con le toppe sui gomiti, e sulla spalla la cinghia vuota di
      una lanterna da scavo. Resta a sei o sette passi e non si avvicina.

      {armi-da-mischia Facile} Le mani troppo vicine e la punta troppo alta.
      Un affondo gli costerebbe mezzo passo e tutto l'equilibrio.

      «Fermo lì. Dammi la borsa e vai per la tua strada» dice. La voce
      tiene, ma gli occhi saltano da te al sentiero alle tue spalle e di
      nuovo a te, a controllare se dietro arriva qualcun altro. Alla mano
      sinistra gli mancano il medio e l'anulare, e la cicatrice è ancora
      rosa.

      {medicina Media} Rosa, e appena tirata. Sono passati pochi mesi, e chi
      l'ha ricucito l'ha fatto in fretta, con un filo grosso da sacco.

      {origine apprendista-raschiatore} Quella cinghia vuota la riconosci,
      perché una lanterna da scavo l'hai portata sulla spalla anche tu. La
      lanterna non c'è più, e lui continua a portare la cinghia come se il
      turno dovesse ricominciare domattina.

      *Uno che fa il predone da una settimana, al massimo.* Il pollice ti va
      lo stesso sull'impugnatura, perché la punta della lancia è affilata di fresco.
    opzioni:
      - testo: "Combattere"
        descrizione: "È solo e ha le mani che tremano. Basta poco perché scappi, ma quella punta fa male lo stesso."
        combattimento: predone-solitario
        vittoria:
          titolo: La lancia nella polvere
          testo: |
            Al primo affondo sbaglia la misura, e al secondo la lancia gli vola
            via di mano. Scappa verso le terrazze stringendosi la mano senza dita
            contro il petto, e tu resti con il braccio indolenzito e un vago senso di
            colpa che non sai dove mettere. Nella polvere restano la lancia e una
            sacca con dentro qualche moneta e due frammenti di cristallo esausti,
            raccolti chissà dove.
          effetti: { monete: 3, cristalli.frammento-esausto: 2 }
        sconfitta:
          titolo: La borsa
          testo: |
            È più disperato che bravo, ma la disperazione basta. Ti ritrovi in
            ginocchio con l'asta della lancia che ti preme sulla nuca, e una
            mano a cui mancano due dita ti sfila la borsa dalla cintura.
            Mentre scappa si volta una volta, come se volesse dire qualcosa,
            e poi corre più forte.

            {rissa Media fallita} Ti eri preparato a un uomo che sapeva
            combattere. Lui invece ti è venuto addosso con tutto il peso e senza
            nessuna tecnica, e la tua non è servita.
          effetti: { monete: -4 }

      - testo: "Fargli paura"
        descrizione: "Ha più paura lui di te. Basta un passo avanti fatto con convinzione."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Facile }
        successo:
          titolo: Il passo avanti
          testo: |
            Fai un passo avanti invece che indietro e gli dici, con calma, dove
            gli finirà la lancia. Lui la guarda come se si accorgesse soltanto
            adesso di averla in mano. La lascia cadere e se ne va di corsa giù per
            i gradoni, e a ogni salto si guarda alle spalle. Ti accorgi solo
            allora che il cuore ti batteva forte quanto il suo.
          pe: { intimidire: 5 }
        fallimento:
          titolo: Il colpo storto
          testo: |
            Fai il passo avanti, e lui si spaventa troppo. Ti viene addosso con un
            affondo storto che ti apre la manica e la pelle dell'avambraccio, poi
            resta un momento a fissare il sangue, più spaventato di te, e scappa
            senza la lancia. Il braccio pulsa, e la manica si fa scura e pesante.
          effetti: { ferite: 0.5 }

      - testo: "Parlarci"
        descrizione: "La giubba è da Raschiatore, e la cicatrice sulla mano è recente. Prima di essere un predone era qualcos'altro."
        quando: [sup2.predone == 0]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La mano
          testo: |
            Tieni le mani bene in vista e gli chiedi delle dita. La domanda lo
            prende alla sprovvista, e la punta della lancia scende di un palmo, e
            poi di un altro. Alla fine pianta l'asta nella ghiaia e ci si appoggia
            come a un bastone, e ti dice il suo nome.

            {empatia Facile} Nessuno gliel'aveva ancora chiesto. Lo capisci da
            come si guarda la mano, quasi sorpreso che sia ancora sua.
          pe: { empatia: 5 }
          segue: carta-sup2-gaddo
        fallimento:
          titolo: Troppe domande
          testo: |
            Più parli e più lui si convince che lo stai trattenendo per qualcuno
            che arriva da dietro. Ti punta la lancia al petto e ti spinge indietro
            di due passi, abbastanza forte da farti male, poi scappa giù per i
            gradoni con la lancia in mano. Sul petto, sotto la camicia, ti resta
            un segno tondo e rosso.
          effetti: { ferite: 0.5 }
      - testo: "Fargli credere che dietro arriva la scorta"
        descrizione: "Continua a guardare il sentiero alle tue spalle. Basta dargli un motivo per guardarlo ancora."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Facile }
        successo:
          titolo: Quelli dietro
          testo: |
            Alzi un braccio verso il sentiero alle tue spalle e chiami a gran voce
            un compagno immaginario, dicendogli di sbrigarsi. Lui sbianca e si
            gira a guardare, e il tempo di girarsi gli basta per decidere. Scappa
            giù per i gradoni con la lancia in mano. La sacca che teneva a
            tracolla gli si impiglia in uno spuntone di roccia e resta lì, e
            dentro ci sono due frammenti di cristallo esausti e una crosta di pane
            che decidi di lasciare dov'è, nel caso torni a riprenderla.
          pe: { ingannare: 5 }
          effetti: { cristalli.frammento-esausto: 2 }
        fallimento:
          titolo: Nessuno dietro
          testo: |
            Gridi verso il sentiero alle tue spalle, ma la voce ti esce troppo
            allegra.

            {ingannare Facile fallita} Hai chiamato il compagno immaginario con un
            nome vero, il primo che ti è venuto, e l'hai detto nel tono che si usa
            per chiamare il cane a cena.

            Lui guarda il sentiero vuoto e capisce. Per la vergogna di essersi
            spaventato ti viene addosso con un affondo storto che ti prende di
            striscio sul fianco, e poi scappa lo stesso, giù per i gradoni, con la
            sacca che gli sbatte sulla schiena.
          effetti: { ferite: 0.5 }

  - id: carta-sup2-gaddo
    tipo: seguito
    area: superficie-fratturata
    immagine: icone/robber
    titolo: Gaddo
    sommario: "Il predone si chiama Gaddo, e fino alla primavera scendeva nella Cicatrice con una squadra dei Ponti."
    luogo: Superficie Fratturata, un masso a lato della strada degli scavi
    testo: |
      Si chiama Gaddo. Fino alla primavera scendeva nella Cicatrice con una
      squadra dei Ponti, e una mattina, al quarto pianerottolo, la corda di
      quello sotto di lui si è sfilacciata. Lui l'ha tenuta con la sinistra
      finché gli altri non sono arrivati. Quello sotto è risalito sano. Due
      dita invece sono rimaste fra la corda e la roccia, e con tre dita la
      corda non la tieni, così Dragna l'ha tolto dal foglio dei turni con una
      riga a penna.

      {conoscenze-della-strada Media} Per una squadra dei Ponti un uomo che
      non tiene la corda è una spesa, e le spese si tagliano con una riga.

      «Ha fatto bene» dice, e lo dice come se l'avesse ripetuto molte volte
      per convincersene. «Uno con tre dita in squadra è uno in meno.» È
      uscito dalle mura a cercare reperti come fanno tutti, e non ha trovato
      niente. La lancia l'ha comprata con le ultime monete, e da ieri non
      mangia. Ride un poco, guardandola. «Sei il primo che fermo. Speravo in
      uno più piccolo.»

      Gli trema la mano buona, e la stringe sull'asta perché tu non lo veda.
    opzioni:
      - testo: "Dargli qualche moneta"
        descrizione: "Abbastanza per mangiare qualche giorno e per non dover fermare il prossimo che passa."
        requisiti: [monete >= 5]
        esito:
          titolo: Le monete nella mano buona
          testo: |
            Gli metti le monete nella mano buona e gliela chiudi con la tua. Gaddo
            le guarda a lungo senza dire niente, e deglutisce due volte. Poi si
            toglie la cinghia vuota della lanterna dalla spalla e la butta nella
            ghiaia, e si avvia verso la città con la lancia sotto il braccio, per
            rivenderla.
          effetti: { monete: -5, tormento: -0.5 }
          imposta: { sup2.predone: 2 }

      - testo: "Mandarlo da Oda Krell"
        descrizione: "Alla baracca di Oda serve qualcuno che porti i pesi e tenga accesa la stufa, e per quel lavoro le dita bastano."
        esito:
          titolo: La strada della baracca
          testo: |
            Gli spieghi dov'è la baracca, nella piega delle terrazze, e gli dici
            di presentarsi con un po' di legna sulle spalle, perché Oda apprezza
            chi non arriva a mani vuote. Gaddo ti fa ripetere la strada due volte,
            e la seconda volta la ripete con te, sottovoce. Qualche giorno dopo,
            al Grifone, un Raschiatore ti dice che Gaddo spacca legna da Oda Krell
            e ha imparato a bestemmiare come lei.
          effetti: { rep.raschiatori: 0.5, racconto: 1 }
          imposta: { sup2.predone: 3 }

      - testo: "Lasciarlo alla sua strada"
        descrizione: "Ti ha raccontato la sua storia. Non è detto che tu debba fare altro."
        costo: 0
        esito:
          titolo: Il masso
          testo: |
            Gli auguri buona fortuna, e la frase ti sembra più piccola del solito,
            e riprendi il sentiero. Gaddo resta seduto contro il masso con la
            lancia sulle ginocchia, e quando ti volti sta guardando la strada
            dalla parte da cui sei venuto.
          imposta: { sup2.predone: 1 }

  # ================================================================ 26 · la pioggia leggera
  - id: carta-sup2-pioggia-leggera
    tipo: carta
    area: superficie-fratturata
    immagine: icone/raining
    titolo: La pioggia leggera
    sommario: "Comincia a cadere una pioggia sottile e fredda, il basalto si fa lucido e il rumore dell'acqua copre tutto il resto."
    luogo: Superficie Fratturata, i gradoni lungo la strada degli scavi
    testo: |
      Il cielo si chiude da ovest senza fare rumore, e comincia a cadere una
      pioggia sottile e fredda, così fitta che le terrazze più lontane
      diventano grigie e poi spariscono. In poco tempo il basalto si fa
      lucido come una padella unta, e la polvere del sentiero diventa una
      fanghiglia che si attacca agli stivali.

      {resistenza Media fallita} Il freddo bagnato è il peggiore, e il tuo
      corpo lo sa benissimo. Comincia a battere i denti per conto suo, senza
      aspettare che tu glielo chieda.

      Il rumore della pioggia è uguale dappertutto e copre ogni altro suono,
      compreso quello dei tuoi passi. Ti tiri su il bavero, e l'acqua ti trova
      lo stesso e ti scende lungo la schiena fino alla cintura. Più avanti,
      dove il sentiero passa accanto a un anello di metallo, la pioggia che lo
      tocca sale in un vapore leggero, e intorno all'anello qualcosa di
      tondo luccica a terra, fermo come un sasso.

      {furtivita Media} Con questo rumore potresti passare accanto a un cane
      da guardia senza svegliarlo. Il guaio è che anche tu non sentiresti
      lui.
    opzioni:
      - testo: "Proseguire sotto l'acqua"
        descrizione: "Il basalto bagnato scivola, e il sentiero corre lungo il bordo dei gradoni."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Facile }
        successo:
          titolo: Fradicio ma in piedi
          testo: |
            Cammini piano, con il peso sui talloni e una mano sempre vicina alla
            roccia. Arrivi dall'altra parte dei gradoni bagnato fino alle ossa,
            con gli stivali che fanno rumore a ogni passo e i polpacci che tremano
            per la fatica di stare dritti, ma senza aver messo un piede in fallo.
          pe: { atletica: 5 }
        fallimento:
          titolo: Il gradone
          testo: |
            Su una lastra inclinata lo stivale parte da solo, e scendi un gradone
            intero sul fianco, prima di riuscire ad aggrapparti a uno spuntone. Ti
            rialzi con il gomito sbucciato e il fango fino al collo, e la pioggia,
            nel frattempo, si mette a cadere più forte, con un tempismo che ha
            qualcosa di personale.
          effetti: { ferite: 0.5 }

      - testo: "Aspettare sotto una sporgenza"
        descrizione: "Ci vuole tempo, ma sotto la roccia si sta all'asciutto e si riposano le gambe."
        costo: 2
        esito:
          titolo: Sotto la sporgenza
          testo: |
            Trovi una sporgenza di basalto abbastanza profonda e ti ci siedi sotto
            con le ginocchia al petto. Mangi quello che hai, guardi la pioggia che
            fa le righe davanti alla roccia, e a un certo punto ti addormenti
            senza accorgertene. Ti svegli che ha smesso, con il collo rigido e la
            testa più leggera di quando ti sei seduto. Una lucertola grigia si è
            sistemata sul tuo stivale e non ha nessuna intenzione di andarsene.
          effetti: { tormento: -0.5 }

      - testo: "Approfittare del rumore"
        descrizione: "I droni ciechi sentono i passi, e con questa pioggia i passi non si sentono. Le cose tonde vicino all'anello sono droni che dormono."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Fra i droni che dormono
          testo: |
            Ti avvicini all'anello mentre la pioggia batte, un passo per ogni
            raffica. Intorno al metallo stanno appoggiate a terra una dozzina
            di sfere grandi come un pugno, con le linee incise spente.

            {tecnologia Media} Spente, e non morte. Le linee hanno ancora un filo
            di luce in fondo, come le braci sotto la cenere, e aspettano un rumore
            per accendersi.

            Alla base dell'anello, fra le radici di metallo, c'è un guscio
            sigillato e qualche scaglia. Li prendi con due dita e torni
            indietro allo stesso modo.
          pe: { furtivita: 8 }
          effetti: { reperto.sigillato: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: La pausa nella pioggia
          testo: |
            Sei a due passi dall'anello quando la pioggia si ferma di colpo, e il
            tuo stivale fa rumore nel fango. Una sfera si alza da
            terra e si gira verso di te. Scappi, e la senti ronzare dietro la nuca
            finché la pioggia non riprende, e il ronzio ti resta nelle orecchie
            anche dopo. Il segno della bruciatura sulla spalla ha la forma di una
            moneta.
          effetti: { ferite: 1 }

  # ================================================================ 27 · i rifugiati
  - id: carta-sup2-rifugiati
    tipo: carta
    area: superficie-fratturata
    immagine: icone/knapsack
    titolo: I rifugiati del casale
    sommario: "Sette o otto persone con due bambini camminano verso la città con tutto quello che hanno nei sacchi, e hanno gli orli dei vestiti grigi."
    luogo: Superficie Fratturata, il sentiero che sale dalle terrazze basse
    requisiti: [sup2.rifugiati == 0]
    testo: |
      Sul sentiero viene verso di te un gruppo di persone che cammina piano,
      al passo del più lento. Sono sette o otto con due bambini, e portano
      tutto quello che hanno in sacchi legati con lo spago o stretti
      al petto. Un uomo ha sulla schiena una sedia impagliata, legata con una
      cinghia, e non sembra pesargli più del resto.

      {empatia Media} Di tutta la casa ha salvato una sedia, e la porta
      attento a non urtarla contro niente.

      {origine fuggiasco-di-ghoran} Anche tu sei arrivato a Qir-Azel con
      tutto quello che avevi addosso, e addosso non avevi quasi niente. Ti
      ricordi che i primi giorni guardavi con invidia chi aveva almeno un
      sacco da stringere al petto.

      Quando ti vedono si fermano, e nessuno parla. Una donna con il
      fazzoletto in testa si mette davanti agli altri con le braccia lungo i
      fianchi e le mani aperte, perché tu le veda vuote. Il bambino più
      piccolo si nasconde dietro le sue gonne e ti guarda con un occhio solo.
      Hanno tutti l'orlo dei vestiti grigio di una polvere chiara che conosci.

      *Questa polvere è salita da una crepa, e loro ci hanno camminato in
      mezzo.* Ti accorgi di aver fatto un passo indietro, e te ne vergogni un
      poco.
    opzioni:
      - testo: "Accompagnarli fino ai Ponti"
        descrizione: "Con loro si va piano. Ai Ponti Sospesi però c'è chi accoglie gente così, se qualcuno sa dove portarla."
        costo: 2
        esito:
          titolo: Il braciere di Mamma Tesh
          testo: |
            Cammini con loro fino alle mura, al passo del bambino, e poi giù per i
            sottoponti fino al braciere di Mamma Tesh. La donna con il fazzoletto
            si chiama Brisa, e durante la strada ti racconta del pozzo del casale,
            che una notte ha cominciato a fumare grigio. Mamma Tesh fa posto
            intorno all'elmo rovesciato senza chiedere niente, e il bambino si
            addormenta prima ancora di sedersi. Prima che tu te ne vada, Brisa ti
            stringe la mano con tutte e due le sue.
          effetti: { rep.ponti: 0.5, racconto: 1 }
          imposta: { sup2.rifugiati: 1 }

      - testo: "Dividere con loro le bende"
        descrizione: "Il bambino più piccolo cammina con i piedi fasciati di stracci, e gli stracci sono rossi."
        requisiti: [bende >= 1]
        esito:
          titolo: I piedi del bambino
          testo: |
            Ti inginocchi nella polvere e fasci i piedi del bambino, mentre lui ti
            guarda le mani senza dire niente e stringe i pugni a ogni giro di
            benda. La donna con il fazzoletto si chiama Brisa, e ti dice che vanno
            ai Ponti, dove dormono quelli che non hanno dove dormire. Ti dice
            anche da quale crepa è salita la nebbia, per girarle al largo. Se
            passi sotto le assi, dice, di chiedere di lei.
          effetti: { bende: -1, tormento: -0.5, informazioni.voce: 1 }
          imposta: { sup2.rifugiati: 1 }

      - testo: "Lasciarli passare"
        descrizione: "Hanno la loro strada e tu la tua."
        costo: 0
        esito:
          titolo: Il sentiero libero
          testo: |
            Ti fai da parte e li lasci passare. Ti sfilano davanti uno alla volta
            senza guardarti, e la sedia impagliata passa per ultima, ondeggiando
            sulla schiena dell'uomo. Il bambino si volta una volta sola, quando
            sono già lontani.

      - testo: "Pretendere qualcosa per il passaggio"
        descrizione: "Sono stanchi e non hanno armi. Hanno però poco da perdere, e chi ha poco da perdere a volte si difende male e forte."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Facile }
        successo:
          titolo: Il fazzoletto annodato
          testo: |
            La donna con il fazzoletto non discute. Si scioglie un nodo
            dall'orlo della manica e ti lascia cadere ai piedi un fazzoletto
            annodato con dentro qualche moneta, poi porta gli altri intorno a
            te, larghi, tenendo il bambino per il polso. Nessuno di loro si
            volta.

            {intimidire Facile} Non c'è stato bisogno di alzare la voce. Bastava
            essere armati davanti a gente che non lo è. Ai Ponti, dove vanno a
            dormire, il tuo nome lo sapranno prima di sera.
          effetti: { monete: 3, tormento: 1, rep.ponti: -0.5 }
          imposta: { sup2.rifugiati: 2 }
        fallimento:
          titolo: La sedia
          testo: |
            L'uomo con la sedia sulla schiena se la sfila e te la rompe sulla
            spalla prima che tu finisca la frase. Era una buona sedia, e lui la
            sacrifica senza esitare. Mentre sei a terra fra le schegge di paglia
            gli altri ti passano accanto di corsa, e la donna con il fazzoletto ti
            sputa vicino alla mano. Ai Ponti raccontano la storia per una
            settimana, e ogni volta la sedia è più grossa.
          effetti: { ferite: 1, rep.ponti: -0.5 }
          imposta: { sup2.rifugiati: 2 }

  # ================================================================ 28 · l'arma abbandonata
  - id: carta-sup2-arma-abbandonata
    tipo: carta
    area: superficie-fratturata
    immagine: icone/drop-weapon
    titolo: La spada sulla polvere
    sommario: "Accanto a una pietra piatta c'è una spada corta unta di fresco, senza il fodero. Intorno non c'è sangue, e la polvere ha un colore strano."
    luogo: Superficie Fratturata, una pietra piatta a due passi dal sentiero
    requisiti: [sup2.arma == 0]
    testo: |
      Accanto a una pietra piatta, a due passi dal sentiero, c'è una spada
      corta posata in terra e mezza coperta da un velo di polvere. È un'arma
      buona, con la lama unta di fresco e l'impugnatura fasciata di cuoio
      nuovo, e il fodero non c'è. Intorno non vedi sangue né segni di lotta,
      soltanto qualche orma che va e viene e un sasso spostato.

      {armi-da-mischia Facile} Lama corta, buon acciaio, il filo appena
      ripassato. Il padrone la teneva vicina, e la teneva bene.

      Ti accucci a guardarla senza toccarla. Chi l'ha lasciata ci teneva,
      perché nessuno unge una lama che ha intenzione di buttare via. La
      polvere qui è più chiara di quella del sentiero, e vicino all'elsa
      forma una crosta sottile che si è incrinata come la pelle del latte.

      {natura Media} Una crosta così si forma quando la Marea sale e poi si
      ritira, lasciando la polvere a seccare sopra, e di solito sotto ce n'è
      ancora un poco.

      {origine rampollo-dei-quartieri-alti} Anche la tua spada corta è
      un'arma buona, regalata per i diciott'anni, e finora è servita
      soprattutto a impigliarsi nelle sedie. Questa invece ha il cuoio
      dell'impugnatura consumato nel punto dove si stringe davvero.

      *Una spada così si dimentica soltanto quando si scappa.* Ti viene da
      guardarti alle spalle, e lo fai.
    opzioni:
      - testo: "Raccoglierla subito"
        descrizione: "È lì ed è buona, basta allungare la mano. La crosta chiara intorno all'elsa però non promette niente di buono."
        esito:
          titolo: Il freddo alle caviglie
          testo: |
            Ti chini e la prendi per l'impugnatura. La crosta sotto l'elsa si
            rompe come ghiaccio sottile, e dalla crepa esce una nebbia grigia che
            ti sale fino alle caviglie in un momento. Salti indietro con la spada
            in mano, e il salto ti viene più lungo di quanto avresti creduto. La
            nebbia torna giù da dove è venuta, e il freddo invece ti resta nelle
            ossa delle gambe fino a sera.
          effetti: { oggetto.spada-corta: 1, contaminazione: 1 }
          imposta: { sup2.arma: 1 }

      - testo: "Leggere le orme prima"
        descrizione: "Chi l'ha lasciata ha visto qualcosa. Le orme dicono da che parte stare per prenderla."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il lato buono
          testo: |
            Le orme raccontano tutto. Il padrone della spada stava fermo vicino
            alla pietra, poi ha fatto un salto all'indietro ed è scappato, e da
            quel punto la polvere è chiara e crostosa, con la Marea che ci dorme
            sotto. Fai il giro dalla parte dove il terreno è scuro e tiri a te la
            spada con un ramo secco, senza mettere un piede sulla crosta.
            L'impugnatura è ancora un poco tiepida, o forse te lo immagini.
          pe: { percezione: 6 }
          effetti: { oggetto.spada-corta: 1, informazioni.voce: 1 }
          imposta: { sup2.arma: 1 }
        fallimento:
          titolo: Nel mezzo
          testo: |
            Sei così attento alle orme che non guardi dove metti i piedi. La
            crosta ti si rompe sotto lo stivale, e la nebbia grigia sale
            fredda fino al ginocchio. Ti tiri fuori di corsa e lasci la spada
            dov'è, perché per prenderla adesso dovresti tornarci dentro.

            {percezione Media fallita} Le orme le avevi lette benissimo. La crosta
            sotto i tuoi piedi, invece, non l'avevi letta per niente.
          effetti: { contaminazione: 0.5 }

      - testo: "Lasciarla dov'è"
        descrizione: "Chi l'ha lasciata aveva un motivo, e il motivo forse è ancora lì sotto."
        costo: 0
        esito:
          titolo: La pietra piatta
          testo: |
            Ti rialzi e torni sul sentiero senza toccarla, anche se le dita ci
            mettono un momento a convincersi. Dopo qualche passo ti accorgi di
            camminare sul bordo esterno, il più lontano possibile dalla pietra.

  # ================================================================ 29 · il cadavere recente
  - id: carta-sup2-cadavere-recente
    tipo: carta
    area: superficie-fratturata
    immagine: icone/death-skull
    titolo: Il cadavere recente
    sommario: "In mezzo al sentiero c'è un uomo morto da poco, con la sacca a tracolla e nessuna ferita che si veda."
    luogo: Superficie Fratturata, il sentiero fra due gradoni
    testo: |
      In mezzo al sentiero c'è un uomo disteso su un fianco, con un braccio
      sotto il corpo e l'altro allungato in avanti, come se con l'ultimo
      passo avesse cercato di aggrapparsi alla ghiaia. Ha i vestiti in ordine
      e la sacca ancora a tracolla, e gli stivali sono buoni, risuolati da
      poco. Le mosche non l'hanno ancora trovato.

      {medicina Media} Morto da meno di un'ora. Le dita della mano allungata
      sono ancora morbide, e la pelle non ha preso il colore della cera.

      {origine figlio-della-citta-bassa} Nei vicoli dove sei cresciuto un
      morto con gli stivali buoni non resta calzato fino a sera. Questi sono
      ancora ai suoi piedi, e vuol dire che da qui non è passato nessuno,
      oppure che chi è passato aveva fretta di andarsene.

      È giovane, con la barba di qualche giorno. La faccia gli è rimasta
      tirata in una smorfia, con i denti stretti e gli occhi aperti, e non
      ha ferite che si vedano. Più su fra i gradoni un sasso rotola e si
      ferma. Il cuore ti salta in gola prima che tu capisca che era soltanto
      un sasso, e ti ritrovi con una mano già sull'arma.

      {rissa Facile} Le nocche sono pulite e la gola è intatta. Quello che
      l'ha ucciso non gli è mai arrivato a portata di pugno.
    opzioni:
      - testo: "Esaminare il corpo"
        descrizione: "Un uomo non muore così senza un motivo. Il motivo, se lo trovi, potrebbe essere ancora qui intorno."
        prova: { attributo: mentale, abilita: [medicina, percezione], difficolta: Media }
        successo:
          titolo: Tre segni sulla nuca
          testo: |
            Gli scosti il colletto, e la pelle sotto le dita è ancora tiepida.
            Sulla nuca ha tre bruciature tonde in fila, piccole come monete. Una
            quarta ce l'ha sulla spalla. Le suole sono consumate in punta, da chi
            corre. Ha sentito i droni ciechi e si è messo a correre, e loro hanno
            seguito il rumore dei suoi passi fino a qui. Ti segni la direzione da
            cui è venuto, per girarle al largo e per dirlo a chi la deve sapere.
          pe: { medicina: 6 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: La smorfia
          testo: |
            Lo guardi a lungo senza trovarci un taglio o un livido, e più lo
            guardi meno capisci. Alla fine ti rimane in testa soltanto la sua
            faccia. Quella notte, appena chiudi gli occhi, la rivedi con i denti
            stretti, e per un momento ti sembra la tua.
          effetti: { tormento: 1 }

      - testo: "Frugare nella sacca"
        descrizione: "A lui non serve più niente. A te qualcosa sì."
        esito:
          titolo: La roba di un morto
          testo: |
            Gli sfili la sacca da sotto il braccio, che è già rigido e non
            vuole lasciarla. Dentro trovi una borsetta con qualche moneta, un
            rotolo di bende e due frammenti di cristallo avvolti in un
            fazzoletto ricamato con un'iniziale.

            {empatia Media} Il ricamo è storto, fatto da una mano che imparava.
            Chi gliel'ha ricamato, da qualche parte, lo sta ancora aspettando.

            Il fazzoletto lo rimetti nella sacca e la sacca accanto a lui. La
            smorfia te la porti dietro per un pezzo di strada.
          effetti: { monete: 4, bende: 1, cristalli.frammento-esausto: 2, tormento: 0.5 }

      - testo: "Lasciarlo dov'è"
        descrizione: "Qualcuno lo troverà, o la Superficie se lo terrà."
        costo: 0
        esito:
          titolo: La giacca
          testo: |
            Gli abbassi le palpebre con due dita e gli copri la faccia con la sua
            giacca, poi riprendi il sentiero. Ti accorgi che stai camminando senza
            fare rumore, in punta di piedi come in una casa dove qualcuno dorme, e
            non sai perché.

  # ================================================================ 31 · i cervi nervosi
  - id: carta-sup2-cervi-nervosi
    tipo: carta
    area: superficie-fratturata
    immagine: icone/deer
    titolo: I cervi nervosi
    sommario: "Un branco di cervi ti guarda senza scappare. Poi il maschio guarda oltre la tua spalla, e scappano tutti insieme."
    luogo: Superficie Fratturata, una fila di pini storti fra due terrazze
    testo: |
      Più avanti, dove fra due terrazze crescono in fila alcuni pini storti,
      c'è un branco di sei o sette cervi con il mantello ingrigito dalla
      polvere. Stanno fermi con le orecchie dritte e le narici aperte. Ti
      vedono e restano dove sono, cosa che i cervi selvatici non fanno mai.

      {natura Facile} Un cervo che non scappa da un uomo ha visto qualcosa
      di peggio, e lo tiene d'occhio.

      {origine figlio-del-circolo} Il pelo ingrigito ti fa tornare in mente
      la volpe toccata dalla Marea che da bambino hai visto abbattere nel
      Bosco di Velthar. Questi però hanno ancora gli occhi limpidi, e
      respirano senza strappi.

      Il più grande, un maschio con il palco spezzato da una parte, ti guarda
      per un momento lungo. Poi sposta gli occhi oltre la tua spalla, verso
      qualcosa dietro di te, e li tiene lì. Senti la nuca farsi fredda, e le
      spalle ti salgono da sole verso le orecchie. All'improvviso i cervi scattano tutti
      insieme e spariscono fra i pini. Dopo resta un silenzio così netto che
      senti il cuoio della cintura scricchiolare appena ti muovi.

      {resilienza Media} Se ti volti di scatto, lo saprà. Qualunque cosa ci
      sia, è già lì da un po', e un momento in più non cambia niente.
    opzioni:
      - testo: "Voltarsi a guardare"
        descrizione: "Il cervo guardava qualcosa alle tue spalle. Bisogna voltarsi piano e tenere i nervi saldi."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Mezzo battito
          testo: |
            Ti volti piano. A una ventina di passi c'è una sagoma di nebbia
            grigia, alta come un uomo e con troppe articolazioni, che si volta
            insieme a te con mezzo battito di ritardo. Ti sposti di lato un passo
            alla volta, e lei ti imita sempre più male, finché perde il filo e si
            affloscia dentro una crepa. Ti accorgi di avere la camicia fradicia di
            sudore sotto la giacca. Adesso sai che aspetto ha una sagoma della
            Marea quando non ti ha ancora preso.
          pe: { percezione: 8 }
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Il gesto rifatto
          testo: |
            Ti volti troppo in fretta, e la sagoma di nebbia grigia che hai
            alle spalle è già a un braccio da te. Alza la mano insieme a te, e
            quando la tua si ferma la sua continua fino a toccarti il polso.
            Il freddo ti sale lungo il braccio fino alla spalla.

            {resilienza Media fallita} Avresti dovuto voltarti piano, e lo sapevi.
            Il corpo, però, ha preferito sapere subito.

            Corri fra i pini senza voltarti più, e la manica resta grigia per
            giorni.
          effetti: { contaminazione: 1 }

      - testo: "Seguire i cervi"
        descrizione: "I cervi sanno dove la Marea non arriva. Bisogna stargli dietro fra le radici dei pini."
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: L'acqua dei cervi
          testo: |
            Segui le orme fresche fra i pini, giù per una gola stretta, e arrivi a
            una polla d'acqua chiara sotto una parete di basalto. I cervi bevono
            dall'altra parte e ti lasciano fare, alzando la testa ogni tanto per
            controllare che tu sia ancora tranquillo. Ti lavi le ferite e ti siedi
            con la schiena contro la roccia. Quando il maschio con il palco
            spezzato alza la testa, il branco se ne va tutto insieme.
          pe: { atletica: 5 }
          effetti: { ferite: -0.5 }
        fallimento:
          titolo: Le radici
          testo: |
            I cervi sono più veloci di te, e fra i pini il terreno è una rete di
            radici. Ne prendi una con la punta dello stivale e la caviglia si
            piega con un dolore bianco e improvviso. Quando ti rialzi del branco
            non senti più nemmeno il rumore.
          effetti: { ferite: 0.5 }

      - testo: "Proseguire senza voltarsi"
        descrizione: "Qualunque cosa li abbia spaventati è alle tue spalle. Forse, se resti di spalle, ti lascia andare."
        esito:
          titolo: Il freddo alla schiena
          testo: |
            Riprendi il sentiero senza voltarti, a passo normale, anche se le
            gambe vorrebbero correre e tu non glielo permetti. Per un tratto lungo
            senti un freddo fra le scapole, come una finestra aperta dietro di te,
            e poi a poco a poco se ne va. La sera, togliendoti la giacca, trovi la
            schiena grigia di una polvere chiara che non viene via con la
            spazzola.
          effetti: { contaminazione: 0.5 }
