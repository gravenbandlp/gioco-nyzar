# Superficie Fratturata, il mazzo delle occasioni (primo gruppo, 17 ottobre 2026): tredici carte nuove.
# Ristoro (insolita, ripetibile, con rintocchi <= 30): la pozza calda. La capanna col fuoco acceso e il suo seguito
# sono stati tolti il 24 ottobre 2026: Luca ha tenuto un solo ristoro per zona.
# Tesori (insoliti, con pista.arena >= 5, spariscono quando hai l'oggetto): la capsula caduta (sf-tubo-della-capsula),
# il tumulo col guardiano (sf-corazza-del-tumulo), il cristallo nella fenditura (sf-cristallo-della-fenditura), le lame
# piantate (sf-lama-che-non-dorme).
# Agguati (inevitabili, comuni, ripetibili): la gola, la sagoma nella cenere, la terrazza che crolla, lo sciame che
# caccia, la taglia (solo con il Sospetto fra 2 e 6).
# Comuni: il baratto al crocevia, le lanterne sul sentiero, il pozzo che respira.
# Nessun nome nuovo. I numeri stanno solo negli effetti (docs/stile-dei-testi.md, regola 11).

storylet:
  # ================================================================ ristoro · la pozza calda
  - id: carta-sf-pozza-calda
    tipo: carta
    rarita: insolita
    area: superficie-fratturata
    immagine: icone/steam
    titolo: La pozza calda
    sommario: "Fra le colate di basalto l'acqua calda esce dalla roccia in tre polle, e una delle tre viene da dove passa la Marea."
    luogo: Superficie Fratturata, una conca fra le colate di basalto
    requisiti: [rintocchi <= 30]
    testo: |
      In una conca fra le colate di basalto l'acqua esce dalla roccia e fuma nell'aria fredda. Qualcuno ha
      raccolto le sorgenti in tre polle con il bordo di sassi lisci. Tutte e tre sono verdi e limpide fino al
      fondo. I Raschiatori dicono che sulla Superficie un'acqua calda su tre sale dal basso, dove passa la
      Marea. A guardarle le polle sono identiche.

      {natura Difficile} Guarda il muschio sui bordi. Dove l'acqua è toccata dalla Marea il muschio diventa
      grigio e smette di crescere.

      Le spalle ti fanno male soltanto a guardarle.
    opzioni:
      - testo: "Scegliere la polla pulita e immergerti"
        descrizione: "Un bagno lungo nell'acqua giusta ti rimette in piedi per giorni. In quella sbagliata ti porti via un po' di Marea."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: L'acqua giusta
          testo: |
            Giri intorno alle polle finché ne trovi una con il muschio verde fino
            all'acqua. Ti immergi fino al mento e resti lì finché le dita si
            raggrinziscono e la schiena si scioglie un nodo alla volta. Quando
            riparti cammini leggero come non ti succedeva da settimane.
          pe: { natura: 8 }
          effetti: { rintocchi: 13 }
        fallimento:
          titolo: Il formicolio
          testo: |
            Scegli la polla più calda, e per un'ora va benissimo. Poi la pelle
            comincia a formicolare sotto l'acqua e in bocca ti sale un sapore di
            ferro. Quando esci guardi il bordo, e il muschio è grigio. Il riposo
            l'hai preso lo stesso, insieme a quello che c'era nell'acqua.
          effetti: { rintocchi: 7, contaminazione: 1 }

      - testo: "Stenderti sulla roccia calda"
        descrizione: "Il basalto intorno alle polle è caldo come un forno spento. Si riposa meno, e non bisogna scegliere niente."
        esito:
          titolo: La roccia calda
          testo: |
            Ti stendi accanto alle polle con la sacca sotto la testa, e il calore
            ti entra nella schiena dal basso. Dormi un'ora senza sognare. Quando
            ti svegli il vapore è salito, e le polle sono ancora tutte uguali.
          effetti: { rintocchi: 5 }

      - testo: "Lasciar perdere"
        descrizione: "Una polla su tre è troppo per un bagno."
        costo: 0
        esito:
          titolo: L'odore di zolfo
          testo: |
            Lasci le polle al loro vapore e riprendi il sentiero. Per un pezzo
            l'odore di zolfo ti resta nei vestiti.

  # ================================================================ tesoro · la capsula caduta
  - id: carta-sf-capsula-caduta
    tipo: carta
    rarita: insolita
    area: superficie-fratturata
    immagine: icone/falling-star
    titolo: La capsula caduta
    sommario: "Stanotte una scia di luce è caduta dietro le terrazze. In fondo al solco c'è una capsula dei Precursori, e i predoni ci stanno già andando."
    luogo: Superficie Fratturata, un pianoro di ghiaia verso nord
    requisiti: [pista.arena >= 5, avuto.sf-tubo-della-capsula == 0]
    testo: |
      Stanotte hai visto una scia di luce bianca tagliare il cielo e spegnersi dietro le terrazze. Stamattina
      sul pianoro c'è un solco fresco nella ghiaia, e in fondo al solco fuma qualcosa di metallo. È una
      capsula dei Precursori ancora intera, con il guscio annerito e una fessura che pulsa di luce azzurra.

      Sulla cresta di fronte si muovono delle sagome. Sono sei o sette predoni che scendono verso il solco
      con calma, perché credono di essere soli.

      {atletica Media} Loro sono più vicini, ma devono passare dal ghiaione. Tu hai il pianoro dritto davanti.
    opzioni:
      - testo: "Correre alla capsula prima di loro"
        descrizione: "Il pianoro è lungo e la ghiaia scivola. Se arrivi per primo, loro trovano il solco vuoto."
        prova: { attributo: fisico, abilita: atletica, difficolta: Molto difficile }
        successo:
          titolo: Il guscio caldo
          testo: |
            Corri con la testa bassa e la ghiaia che ti schizza dietro i talloni.
            Arrivi al solco con la gola che brucia, e il primo predone è ancora
            sul ghiaione. Il guscio si apre al tocco. Dentro, in una sagoma di
            schiuma grigia, c'è un tubo di metallo con una presa a sei dita. Sei
            già lontan{o|a} quando loro arrivano al solco e cominciano a litigare.
          pe: { atletica: 12 }
          effetti: { oggetto.sf-tubo-della-capsula: 1 }
        fallimento:
          titolo: Il ghiaione era più corto
          testo: |
            A metà del pianoro la ghiaia ti scappa sotto un piede e finisci
            lung{o|a} disteso con le mani aperte sui sassi. Quando ti rialzi i
            predoni sono già intorno alla capsula. Uno ti tira un sasso per farti
            capire che la gara è finita, e ti prende sullo zigomo.
          effetti: { ferite: 1 }

      - testo: "Strappargliela con le armi"
        descrizione: "Sono tanti e si muovono in ordine. Mentre forzano la capsula, però, hanno le mani occupate."
        combattimento: sf-predoni-della-capsula
        vittoria:
          titolo: Gli attrezzi da scasso
          testo: |
            L'ultimo scappa su per il ghiaione e lascia nel solco gli attrezzi da
            scasso. La capsula l'hanno già aperta per te. Dentro, in una sagoma di
            schiuma grigia, c'è un tubo di metallo con una presa a sei dita,
            tiepido come un animale addormentato.
          effetti: { oggetto.sf-tubo-della-capsula: 1 }
        sconfitta:
          titolo: Il solco vuoto
          testo: |
            Ti lasciano nel solco con la testa che gira e la borsa più leggera.
            Quando riesci a rimetterti in piedi la capsula è vuota, e dei predoni
            resta soltanto la polvere che sale dal ghiaione.
          effetti: { monete: -10 }

      - testo: "Aspettare che se ne vadano e frugare nel solco"
        descrizione: "I predoni si portano via quello che si vede. Nella caduta qualche pezzo si sarà staccato."
        esito:
          titolo: Gli avanzi
          testo: |
            Resti dietro un masso finché i predoni ripartono con la capsula
            legata a una barella di lance. Nel solco trovi le schegge del guscio
            e un pezzo staccato nella caduta. È chiuso e pesante come un sasso di
            fiume.
          effetti: { reperto.sigillato: 1, reliquie.scheggia: 2 }

      - testo: "Lasciare la capsula ai predoni"
        descrizione: "Sei o sette sono troppi per una scatola di metallo."
        costo: 0
        esito:
          titolo: Chi arriva prima
          testo: |
            Torni sui tuoi passi e lasci il pianoro a chi ci è arrivato per primo.
            Dalla cresta li vedi chinarsi tutti insieme sul solco.

  # ================================================================ tesoro · il tumulo col guardiano
  - id: carta-sf-tumulo-col-guardiano
    tipo: carta
    rarita: insolita
    area: superficie-fratturata
    immagine: icone/robot-golem
    titolo: Il tumulo col guardiano
    sommario: "Intorno a un tumulo di pietre nere una macchina della Salvaguardia gira in tondo da tanto tempo che ha scavato un solco nella roccia."
    luogo: Superficie Fratturata, un tumulo di pietre sul crinale
    requisiti: [pista.arena >= 5, avuto.sf-corazza-del-tumulo == 0]
    testo: |
      Sul crinale c'è un tumulo di pietre nere alto due volte un uomo, con un'apertura bassa che guarda a est.
      Intorno al tumulo cammina una macchina di metallo con le gambe da insetto e una testa che si gira piano
      da una parte e dall'altra. Fa sempre lo stesso giro, e i suoi piedi hanno scavato nella roccia un solco
      profondo fino al ginocchio.

      {tecnologia Media} È una macchina della Salvaguardia, di quelle vecchie. Gira in tondo perché nessuno le
      ha mai detto di smettere, e l'apertura resta scoperta soltanto quando è dall'altra parte.

      Dall'apertura arriva il luccichio di un metallo lucidato.
    opzioni:
      - testo: "Abbattere il guardiano"
        descrizione: "È vecchio e lento, ma il suo metallo non si ammacca. Una volta che ti ha visto smette di girare intorno al tumulo e comincia a girare intorno a te."
        combattimento: sf-guardiano-del-tumulo
        vittoria:
          titolo: La lastra
          testo: |
            Il guardiano si piega sulle gambe e si ferma a metà del giro, con la
            testa ancora girata verso di te. Nel tumulo, su una lastra di pietra,
            c'è una corazza di scaglie grigie distesa come se qualcuno l'avesse
            appena tolta, senza un graffio. Del suo padrone resta soltanto la
            polvere.
          effetti: { oggetto.sf-corazza-del-tumulo: 1, reliquie.scheggia: 2 }
        sconfitta:
          titolo: Giù dal crinale
          testo: |
            Il guardiano ti colpisce con una zampa di traverso e ti butta giù dal
            crinale. Rotoli fra le pietre finché un cespuglio ti ferma. Quando
            alzi la testa, lassù la macchina ha già ripreso il suo giro.
          effetti: { tormento: 0.5 }

      - testo: "Passare quando è dall'altra parte"
        descrizione: "Bisogna contare il giro ed entrare nel tumulo quando la testa guarda dall'altra parte. Poi bisogna uscirne in tempo."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Molto difficile }
        successo:
          titolo: Il quarto giro
          testo: |
            Conti tre giri prima di muoverti. Al quarto entri carponi
            nell'apertura e sfili la corazza dalla lastra di pietra. Sei di nuovo
            fuori quando la testa di metallo spunta dall'altro lato del tumulo.
            Ti allontani strisciando sul crinale con la corazza stretta al petto,
            e dietro di te il passo del guardiano non cambia.
          pe: { furtivita: 12 }
          effetti: { oggetto.sf-corazza-del-tumulo: 1 }
        fallimento:
          titolo: La testa si gira prima
          testo: |
            Sei a metà strada quando la testa si gira prima del previsto, e il
            guardiano lascia il suo solco per la prima volta da chissà quanto. La
            zampa ti prende alla schiena mentre ti butti giù per il pendio. Ti
            apre la giubba e la pelle sotto.
          effetti: { ferite: 1.5 }

      - testo: "Raccogliere le scaglie nel solco"
        descrizione: "A forza di passare e ripassare la macchina perde scaglie di metallo. Si prendono quando è dall'altra parte del tumulo."
        esito:
          titolo: Le scaglie
          testo: |
            Aspetti che il guardiano giri dietro il tumulo e scendi nel solco a
            raccogliere quello che ha perso. Sono scaglie di metallo grigio, e una
            ha inciso sopra un segno che non conosci. Risali prima che la testa
            torni dalla tua parte.
          effetti: { reliquie.scheggia: 2, reliquie.frammento-inciso: 1 }

      - testo: "Lasciare il tumulo al suo guardiano"
        descrizione: "Ha fatto la guardia fin qui senza di te."
        costo: 0
        esito:
          titolo: Il giro
          testo: |
            Scendi dal crinale dalla parte opposta. Per un pezzo senti ancora il
            passo della macchina sulla roccia, sempre uguale.

  # ================================================================ tesoro · il cristallo nella fenditura
  - id: carta-sf-cristallo-nella-fenditura
    tipo: carta
    rarita: insolita
    area: superficie-fratturata
    immagine: icone/crystal-growth
    titolo: Il cristallo nella fenditura
    sommario: "In fondo a una fenditura azzurra pulsa un cristallo grande come un pugno, chiuso in una ghiera dei Precursori."
    luogo: Superficie Fratturata, una fenditura fra due terrazze
    requisiti: [pista.arena >= 5, avuto.sf-cristallo-della-fenditura == 0]
    testo: |
      Fra due terrazze la roccia si apre in una fenditura stretta da cui sale il bagliore azzurro delle crepe.
      A un braccio di profondità c'è un cristallo grande come un pugno, incastrato in una ghiera di metallo
      dei Precursori. Pulsa lento, e a ogni pulsazione la fenditura si illumina fino in fondo e poi torna
      buia. I bordi sono coperti da una polvere grigia e fine.

      {magia Media} Il cristallo è pieno fino a scoppiare, e il Mana che ne esce è grezzo. Chi lo strappa
      senza criterio si prende anche quello che c'è dietro.

      La polvere grigia sui bordi è Marea seccata.
    opzioni:
      - testo: "Aprire la ghiera"
        descrizione: "Bisogna capire dove la ghiera tiene il cristallo e allentarla senza spezzarlo, nel buio fra una pulsazione e l'altra."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Molto difficile }
        successo:
          titolo: I tre denti
          testo: |
            Trovi i tre denti della ghiera e li pieghi uno alla volta con la
            punta del coltello, aspettando ogni volta che la pulsazione passi. Al
            terzo il cristallo ti scivola nel palmo ancora tiepido. La
            fenditura si spegne del tutto. In mano il cristallo continua a battere
            piano, al ritmo del tuo polso.
          pe: { tecnologia: 12 }
          effetti: { oggetto.sf-cristallo-della-fenditura: 1 }
        fallimento:
          titolo: Il dente sbagliato
          testo: |
            Pieghi il dente sbagliato nel momento sbagliato. La pulsazione ti
            sale su per il braccio, e la fenditura sputa un soffio di polvere
            grigia che ti arriva in faccia. Il cristallo resta dov'è. Tu tossisci
            sul basalto con un sapore di ferro in bocca e le dita intorpidite fino
            al gomito.
          effetti: { contaminazione: 1.5 }

      - testo: "Raccogliere le schegge sul fondo"
        descrizione: "Negli anni il cristallo ha perso schegge, e sono cadute più in basso. Si pescano con un bastone senza avvicinare la faccia."
        esito:
          titolo: Le schegge
          testo: |
            Ti stendi sulla pancia e peschi nella fenditura con un ramo secco, a
            un braccio di distanza dalla polvere grigia. Ne tiri fuori qualche
            scheggia spenta e un cristallo più grosso, opaco, che non pulsa più.
          effetti: { cristalli.cristallo-sterile: 1, cristalli.frammento-esausto: 3 }

      - testo: "Lasciarlo pulsare"
        descrizione: "Un cristallo così pieno è meglio lasciarlo a chi sa che cosa fa."
        costo: 0
        esito:
          titolo: Il bagliore
          testo: |
            Ti allontani dalla fenditura. Per un tratto il bagliore azzurro ti
            segue sulle terrazze, poi una cresta lo nasconde.

  # ================================================================ tesoro · le lame piantate
  - id: carta-sf-lame-piantate
    tipo: carta
    rarita: insolita
    area: superficie-fratturata
    immagine: icone/sword-array
    titolo: Le lame piantate
    sommario: "Un altopiano irto di lame arrugginite piantate nella terra, e una sola continua a cantare quando il vento si ferma."
    luogo: Superficie Fratturata, un altopiano irto di lame
    requisiti: [pista.arena >= 5, avuto.sf-lama-che-non-dorme == 0]
    testo: |
      L'altopiano è irto di lame. Sono centinaia, piantate di punta nella terra a file storte, e la ruggine le
      ha mangiate quasi tutte fino all'elsa. Di chi le ha portate qui non sono rimaste nemmeno le ossa.
      Il vento passa fra le file e le fa vibrare con un ronzio basso.

      Quando il vento si ferma ne vibra ancora una sola. Sta da qualche parte in mezzo alle altre, e la sua
      nota sottile sale e scende.

      {magia Media} Qui il Mana è vecchio e stanco. In un punto però si muove ancora, e si muove verso di te.
    opzioni:
      - testo: "Cercare la lama che canta"
        descrizione: "Seguire la nota fra le file con le orecchie o con i sensi del Mana, senza farsi confondere dalle altre."
        prova: { attributo: mentale, abilita: [magia, percezione], difficolta: Molto difficile }
        successo:
          titolo: La nota si ferma
          testo: |
            Cammini fra le file finché la nota ti arriva da tutte e due le
            orecchie insieme. È una spada lunga con la lama pulita e l'elsa
            fasciata di cuoio nero, e la ruggine non l'ha toccata. Quando la sfili
            dalla terra la nota si ferma. Nella mano ti resta un formicolio che
            non se ne va.
          pe: { magia: 6, percezione: 6 }
          effetti: { oggetto.sf-lama-che-non-dorme: 1 }
        fallimento:
          titolo: Tutte insieme
          testo: |
            Segui la nota sbagliata, e poi un'altra ancora. Al tramonto sei in
            mezzo all'altopiano e tutte le lame vibrano insieme, e il ronzio ti
            entra nei denti. Te ne vai quasi di corsa. Per due notti, appena
            chiudi gli occhi, rivedi le file storte.
          effetti: { tormento: 1 }

      - testo: "Sfilare qualche elsa ai margini"
        descrizione: "Le lame sono marce, ma qualche elsa ha ancora i suoi fregi."
        esito:
          titolo: Le else
          testo: |
            Ai margini dell'altopiano le lame si spezzano appena le tiri, e ti
            restano in mano le else. Una ha un fregio inciso che la ruggine ha
            risparmiato. Le infili nella sacca e te ne vai senza entrare fra le
            file.
          effetti: { reliquie.frammento-inciso: 1, reliquie.scheggia: 1 }

      - testo: "Lasciare l'altopiano alle sue lame"
        descrizione: "Chi le ha piantate qui voleva che restassero."
        costo: 0
        esito:
          titolo: Il ronzio
          testo: |
            Giri al largo dell'altopiano. Il vento riprende, e il ronzio delle
            lame ti accompagna finché non scendi dall'altra parte.

  # ================================================================ agguato · la gola
  - id: carta-sf-la-gola
    tipo: carta
    inevitabile: true
    area: superficie-fratturata
    immagine: icone/cliff-crossing
    titolo: La gola
    sommario: "In una gola stretta cinque predoni con le balestre ti aspettano dall'alto, e chiedono il pedaggio."
    luogo: Superficie Fratturata, una gola fra due terrazze
    requisiti: [ferite < 6]
    testo: |
      Il sentiero scende in una gola stretta fra due pareti di basalto, e a metà strada un sasso rotola giù e
      si ferma davanti ai tuoi piedi. Sul bordo di destra ci sono tre uomini con le balestre armate e su
      quello di sinistra altri due. Hanno corazze di cuoio uguali e stanno distanziati come soldati.

      «Il pedaggio della gola» grida quello al centro. «Lasci quello che porti sul sasso piatto e passi.
      Oppure torni da dove sei venut{o|a}, se hai le gambe buone.»

      {armi-da-distanza Media} Ti tengono sotto tiro tutti e cinque. Per arrivare fin lassù devi risalire il
      canalone a sinistra, e li avrai addosso per tutta la salita.
    opzioni:
      - testo: "Risalire il canalone e combattere"
        descrizione: "In salita e sotto le balestre. Da vicino, però, una balestra serve a poco."
        costo: 0
        combattimento: sf-predoni-della-gola
        vittoria:
          titolo: Il sacco del pedaggio
          testo: |
            Arrivi in cima con le cosce che tremano, e da vicino le balestre non
            servono più. Quando due sono a terra gli altri scappano lungo il bordo
            e lasciano indietro il sacco del pedaggio. Dentro c'è quello che hanno
            preso a chi è passato prima di te.
          effetti: { monete: 18, bende: 1 }
        sconfitta:
          titolo: In fondo alla gola
          testo: |
            A metà del canalone un dardo ti prende alla coscia, e il resto della
            salita lo fai rotolando all'indietro. In fondo alla gola scendono a
            prendersi il pedaggio dalla tua borsa. Te ne lasciano una parte, per
            la prossima volta.
          effetti: { monete: -12 }

      - testo: "Lasciare il pedaggio sul sasso"
        descrizione: "Chiedono parecchio, e lo sanno. In cambio passi senza un graffio."
        costo: 0
        requisiti: [monete >= 15]
        esito:
          titolo: Sotto le balestre
          testo: |
            Conti le monete sul sasso piatto e ti allontani a passo lento. Uno
            scende con una corda a prenderle mentre gli altri ti tengono sotto
            tiro. Attraversi la gola sotto le balestre puntate, e nessuno dice
            più una parola.
          effetti: { monete: -15 }

      - testo: "Lasciare un reperto sul sasso"
        descrizione: "I predoni della Superficie sanno quanto paga Oda Krell per un guscio chiuso."
        costo: 0
        requisiti: [reperto.sigillato >= 1]
        esito:
          titolo: Il guscio sul sasso
          testo: |
            Posi il guscio sigillato sul sasso piatto. Quello al centro lo guarda
            dall'alto per un pezzo. Poi annuisce e fa abbassare le balestre. Passi
            la gola senza voltarti, e alle spalle senti la corda che scende.
          effetti: { reperto.sigillato: -1 }

      - testo: "Tornare indietro di corsa"
        descrizione: "Fuori tiro in pochi salti, se nessuno mira bene. Poi c'è da fare il giro largo."
        costo: 0
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Il giro largo
          testo: |
            Ti giri e corri a zig zag con la testa bassa. Due dardi si piantano
            nella ghiaia dove eri un momento prima. Fuori dalla gola ti fermi
            soltanto quando le pareti sono lontane. Il giro largo ti costa la
            mattina, e la borsa resta piena.
          pe: { atletica: 8 }
        fallimento:
          titolo: Il dardo sulla spalla
          testo: |
            Al terzo salto un dardo ti prende di striscio sulla spalla e ti fa
            girare su te stess{o|a}. Inciampi e cadi, e la borsa si apre sui sassi.
            Raccogli quello che puoi mentre le risate ti seguono fuori dalla gola.
          effetti: { ferite: 1, monete: -5 }

  # ================================================================ agguato · la sagoma nella cenere
  - id: carta-sf-sagoma-nella-cenere
    tipo: carta
    inevitabile: true
    area: superficie-fratturata
    immagine: icone/dust-cloud
    titolo: La sagoma nella cenere
    sommario: "In un campo di cenere accanto a una crepa una sagoma della Marea si alza a due passi da te e comincia a imitarti."
    luogo: Superficie Fratturata, un campo di cenere accanto a una crepa
    requisiti: [contaminazione < 6, ferite < 6]
    testo: |
      Il sentiero attraversa un campo di cenere grigia accanto a una crepa che fuma. La cenere arriva alle
      caviglie e attutisce i passi. A due passi da te la superficie si gonfia e si apre, e dalla cenere si alza
      una sagoma di nebbia grigia con troppe articolazioni. Ha la tua altezza. Quando alzi un braccio per
      ripararti lo alza anche lei, con mezzo battito di ritardo.

      {natura Facile} È una sagoma della Marea. Toccarla vuol dire portarsela addosso, e scappare nella cenere
      vuol dire mandarne giù parecchia.
    opzioni:
      - testo: "Affrontarla"
        descrizione: "È nebbia, ma i colpi la disfano. Ogni volta che ti tocca ti lascia qualcosa addosso."
        costo: 0
        combattimento: sf-sagoma-nella-cenere
        vittoria:
          titolo: La crosta grigia
          testo: |
            La sagoma si disfa sotto l'ultimo colpo e ricade nella cenere come
            farina. Dove si era alzata resta una crosta di cristallo grigio. Dentro
            la crosta ci sono una fibbia e una manciata di monete di qualcuno che
            è passato di qui prima di te.
          effetti: { monete: 10, cristalli.cristallo-sterile: 1 }
        sconfitta:
          titolo: Con i suoi occhi
          testo: |
            La sagoma ti si chiude addosso come un lenzuolo bagnato, e per un
            momento vedi il campo di cenere dall'alto. Ti ritrovi carponi oltre
            il bordo del campo, senza ricordare come ci sei arrivat{o|a}. La borsa è
            rimasta laggiù nella cenere.
          effetti: { monete: -8, contaminazione: 1 }

      - testo: "Scappare attraverso la cenere"
        descrizione: "La sagoma è lenta. La cenere che sollevi correndo però ti finisce in bocca."
        costo: 0
        esito:
          titolo: Sputare grigio
          testo: |
            Ti giri e corri, e la cenere si alza a nuvole intorno alle gambe. Ti
            entra in bocca e nel naso e sotto il colletto. La sagoma resta ferma a
            imitare la tua corsa sul posto. Fuori dal campo sputi grigio per un
            pezzo, e la pelle ti formicola fino a sera.
          effetti: { contaminazione: 1 }

      - testo: "Restare immobile finché si sfalda"
        descrizione: "Imita i tuoi gesti. Se non ne fai più nessuno, forse non sa che cosa fare."
        costo: 0
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Ferm{o|a}
          testo: |
            Abbassi il braccio piano e resti ferm{o|a}, con gli occhi sulla sagoma.
            Lei abbassa il braccio e resta ferma anche lei. Poi comincia a
            perdere forma dai bordi e ricade nella cenere un pezzo alla volta.
            Dove si era alzata trovi un paio di schegge di cristallo spento.
          pe: { resilienza: 8 }
          effetti: { cristalli.frammento-esausto: 2 }
        fallimento:
          titolo: La mano che trema
          testo: |
            Ti trema una mano, e la sagoma trema con te. Poi fa un passo che tu
            non hai fatto e ti passa attraverso. Per un attimo hai freddo dentro
            le ossa. Quando torna il caldo la sagoma è sparita e tu hai le labbra
            grigie.
          effetti: { contaminazione: 1.5 }

  # ================================================================ agguato · la terrazza che crolla
  - id: carta-sf-terrazza-che-crolla
    tipo: carta
    inevitabile: true
    area: superficie-fratturata
    immagine: icone/falling-rocks
    titolo: La terrazza che crolla
    sommario: "La lastra di basalto su cui cammini si spacca e comincia a scivolare verso il vuoto."
    luogo: Superficie Fratturata, il bordo di una terrazza di basalto
    requisiti: [ferite < 6]
    testo: |
      Cammini sul bordo di una terrazza di basalto quando senti sotto i piedi uno scricchiolio lungo, come di
      ghiaccio che si spacca. Una crepa corre davanti a te da una parte all'altra della lastra. Poi la lastra
      intera si inclina piano verso il vuoto, e la ghiaia comincia a scivolare giù.

      La roccia buona è a un salto di distanza, oltre la crepa. Alla tua destra sporge una radice secca che
      può reggere te. Con la sacca in spalla, però, si spezzerebbe.

      {acrobazia Difficile} Il salto si fa adesso. Fra un momento la lastra sarà troppo inclinata per darti
      la spinta.
    opzioni:
      - testo: "Saltare oltre la crepa"
        descrizione: "Due passi di rincorsa su una lastra che scende. Se va bene sei dall'altra parte con tutto quello che porti."
        costo: 0
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Molto difficile }
        successo:
          titolo: Dall'altra parte
          testo: |
            Prendi la rincorsa sulla lastra che scende e ti stacchi dal bordo.
            Atterri sulle mani e sulle ginocchia dall'altra parte, e alle tue
            spalle la lastra se ne va con un boato. Nella parete appena scoperta
            spunta l'angolo di un guscio di metallo, che stacchi con due colpi di
            tallone.
          pe: { acrobazia: 12 }
          effetti: { reperto.sigillato: 1 }
        fallimento:
          titolo: Con la frana
          testo: |
            La punta dello stivale arriva sul bordo buono, e il tallone no.
            Scivoli giù con la frana per un tratto lunghissimo e ti fermi su una
            cengia due terrazze più in basso. La sacca si è aperta nella caduta, e
            metà di quello che avevi è sparso fra i sassi o è sparito con la
            lastra.
          effetti: { ferite: 1.5, monete: -10 }

      - testo: "Correre indietro verso la parete"
        descrizione: "La lastra è attaccata alla parete da dove sei venut{o|a}. Bisogna risalirla mentre si inclina."
        costo: 0
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: Contro la parete
          testo: |
            Ti giri e risali la lastra a quattro zampe, con la ghiaia che ti
            scorre sotto le mani. Arrivi alla parete e ti ci incolli mentre la
            lastra si stacca e se ne va. Per un pezzo resti lì a guardare il
            polverone, e poi cerchi un'altra strada.
          pe: { atletica: 10 }
        fallimento:
          titolo: La ghiaia che scorre
          testo: |
            La ghiaia ti scorre sotto le mani più in fretta di quanto tu salga. Ti
            ritrovi a scivolare all'indietro e ti fermi contro uno spuntone, che
            ti prende nel fianco. Dalla tasca sfondata ti scappano le monete, e le
            senti rimbalzare giù per i gradoni.
          effetti: { ferite: 1, monete: -5 }

      - testo: "Aggrapparti alla radice e lasciare la sacca"
        descrizione: "La radice regge te e niente di più. Quello che porti nella sacca va giù con la lastra."
        costo: 0
        esito:
          titolo: La radice
          testo: |
            Ti sfili la sacca e ti butti sulla radice. La sacca scivola via con la
            lastra e sparisce nel polverone. Ti tiri su con le braccia che
            bruciano e le mani scorticate. Il resto della giornata lo passi a
            contare che cosa c'era dentro.
          effetti: { ferite: 0.5, monete: -6 }

  # ================================================================ agguato · lo sciame che caccia
  - id: carta-sf-sciame-che-caccia
    tipo: carta
    inevitabile: true
    area: superficie-fratturata
    immagine: icone/orbital
    titolo: Lo sciame che caccia
    sommario: "Sfere di metallo con un occhio di vetro rosso volano in formazione, e questa volta ti vedono."
    luogo: Superficie Fratturata, i gradoni alti sopra la strada degli scavi
    requisiti: [ferite < 6]
    testo: |
      Da dietro le terrazze arriva un ronzio più acuto di quello degli sciami che conosci. Sono sfere di
      metallo come quelle che dormono negli anelli, ma queste hanno un occhio di vetro rosso al centro e volano
      in formazione. Si fermano tutte insieme e gli occhi si girano verso di te. Poi lo sciame si apre a
      ventaglio per prenderti in mezzo.

      {tecnologia Media} Queste vedono, e cacciano tutto quello che si muove. Un reperto ancora chiuso però le
      attira più di te. Se ne lanci uno lontano gli vanno dietro tutte.
    opzioni:
      - testo: "Abbatterle"
        descrizione: "Sono veloci e mirano bene. Però sono poche, e il vetro dell'occhio si rompe."
        costo: 0
        combattimento: sf-sciame-che-caccia
        vittoria:
          titolo: Gli occhi spenti
          testo: |
            L'ultima sfera cade nella ghiaia con l'occhio rosso che si spegne
            piano. Raccogli quello che resta dello sciame prima che ne arrivino
            altre. Un occhio di vetro dei Precursori ancora intero, Oda Krell
            sa bene che cosa farsene.
          effetti: { parte.camera-1: 1, parte.nucleo-1: 1, reliquie.scheggia: 2 }
        sconfitta:
          titolo: Sotto la sporgenza
          testo: |
            Le sfere ti colpiscono da tutte le parti, sempre dove non guardi. Ne
            esci buttandoti giù da un gradone e strisciando sotto una sporgenza,
            e loro restano a ronzare lì fuori finché fa buio. Nella fuga la borsa
            ti si è aperta.
          effetti: { monete: -8 }

      - testo: "Nasconderti fra le rocce"
        descrizione: "Vedono quello che si muove. Bisogna sparire prima che il ventaglio si chiuda, e poi non muoversi più."
        costo: 0
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: La spaccatura
          testo: |
            Ti infili in una spaccatura della roccia e resti ferm{o|a} con la
            guancia contro il basalto. Lo sciame ti passa sopra due volte, così
            basso che senti l'aria smossa sulla nuca. Poi si ricompone in
            formazione e riparte verso nord.
          pe: { furtivita: 10 }
        fallimento:
          titolo: Il gomito
          testo: |
            Il gomito sporge dalla spaccatura, e basta quello. Le sfere ti
            stanano a colpi secchi come sassate. Ne esci correndo giù per i
            gradoni, con un taglio sopra l'occhio che non smette di sanguinare.
          effetti: { ferite: 1 }

      - testo: "Lanciare un reperto come esca"
        descrizione: "Lo sciame gli andrà dietro. Il guscio, però, non lo rivedi più."
        costo: 0
        requisiti: [reperto.sigillato >= 1]
        esito:
          titolo: L'esca
          testo: |
            Tiri il guscio sigillato più lontano che puoi giù per le terrazze. Lo
            sciame si gira a mezz'aria e gli va dietro tutto insieme. Quando le
            sfere si posano intorno al guscio tu sei già due terrazze più in là, e
            del reperto ti resta il segno sul palmo.
          effetti: { reperto.sigillato: -1 }

  # ================================================================ agguato · la taglia
  - id: carta-sf-la-taglia
    tipo: carta
    inevitabile: true
    area: superficie-fratturata
    immagine: icone/wanted-reward
    titolo: La taglia
    sommario: "Due cacciatori di taglie a cavallo ti fermano sulla pista con un foglio che porta il tuo nome."
    luogo: Superficie Fratturata, la pista dei carri sotto le terrazze
    requisiti: [sospetto >= 2, sospetto < 6, ferite < 6]
    testo: |
      Sulla pista dei carri ti vengono incontro due uomini a cavallo, al passo. Si fermano a pochi passi da te.
      Uno tiene una balestra appoggiata alla sella. L'altro tira fuori dalla giubba un foglio piegato in
      quattro e lo confronta con la tua faccia, senza fretta.

      «Il nome è il tuo, e la descrizione pure» dice. «La Caserma paga chi ti riporta in città, e non chiede
      in che stato. Per noi è uguale.»

      {ingannare Media} La descrizione sul foglio è vecchia, e loro ti conoscono soltanto da quella. Un nome
      diverso detto con sicurezza può bastare.
    opzioni:
      - testo: "Combattere"
        descrizione: "Sono due mestieranti, e fanno il loro lavoro bene. Però non si fanno ammazzare per un foglio."
        costo: 0
        combattimento: sf-cacciatori-di-taglie
        vittoria:
          titolo: Il foglio nella polvere
          testo: |
            Il primo scappa a piedi dietro al suo cavallo, e il secondo lo segue
            al galoppo. Il foglio è rimasto nella polvere. Lo bruci con
            l'acciarino e guardi il tuo nome diventare nero. Nella bisaccia caduta
            c'è l'anticipo che la Caserma gli aveva dato.
          effetti: { monete: 15, sospetto: -0.5 }
        sconfitta:
          titolo: Il palo di confine
          testo: |
            Ti legano i polsi e ti caricano di traverso su un cavallo. A metà
            strada per la città si mettono a litigare sulla parte. Alla fine si
            prendono la tua borsa e ti lasciano legat{o|a} a un palo di confine,
            dove a sera ti trova un carrettiere.
          effetti: { monete: -15 }

      - testo: "Pagare più della taglia"
        descrizione: "Un cacciatore di taglie lavora per chi paga meglio. Bisogna pagare meglio della Caserma."
        costo: 0
        requisiti: [monete >= 30]
        esito:
          titolo: Il foglio strappato
          testo: |
            Chiedi quanto vale il foglio e offri di più. Quello con il foglio
            conta le monete due volte e poi lo strappa in quattro davanti a te.
            Gli dici che alla Caserma possono raccontare che sei mort{o|a} nelle
            crepe. Lui dice che ci aveva già pensato.
          effetti: { monete: -30, sospetto: -0.5 }

      - testo: "Convincerli che cercano un altro"
        descrizione: "Un nome diverso, un mestiere diverso, una strada diversa. E nessuna esitazione."
        costo: 0
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Un altro nome
          testo: |
            Dici un nome che non è il tuo e racconti di un cugino che ti somiglia
            e che deve soldi a mezza città. Quello con il foglio ti guarda a
            lungo, poi lo ripiega. Ripartono al passo verso le terrazze, e il
            balestriere si volta due volte.
          pe: { ingannare: 10 }
        fallimento:
          titolo: Due nomi
          testo: |
            Ti fanno ripetere il nome, e la seconda volta non è uguale alla prima.
            Il balestriere scende da cavallo e ti colpisce con il calcio della
            balestra. Ti lasciano nella polvere con la borsa più leggera, e prima
            di andarsene ti dicono che il foglio lo tengono.
          effetti: { ferite: 1, monete: -8, sospetto: 0.5 }

  # ================================================================ comune · il baratto al crocevia
  - id: carta-sf-baratto-al-crocevia
    tipo: carta
    area: superficie-fratturata
    immagine: icone/trade
    titolo: Il baratto al crocevia
    sommario: "Al crocevia delle piste un uomo di Ghoran e una donna di Tuarmir litigano su uno scambio, e nessuno dei due vuole cedere per primo."
    luogo: Superficie Fratturata, il crocevia delle piste di Ghoran e di Tuarmir
    testo: |
      Dove la pista di Ghoran incrocia quella di Tuarmir due persone litigano sopra un sacco aperto. L'uomo di
      Ghoran ha le braccia nude e tatuate, e ai piedi una gabbia con due galline da combattimento. La donna di
      Tuarmir ha la maschera di stoffa abbassata sul collo e un sacco di funghi secchi. Si erano accordati per
      uno scambio, e adesso nessuno vuole cedere per primo.

      «Il peso era quello» dice l'uomo, e batte la mano sulla gabbia. La donna risponde senza alzare la voce
      che a Tuarmir i funghi si contano uno per uno.

      {conoscenze-della-strada Media} In città quel sacco vale più di tutte e due le galline. Lei lo sa, e
      lui no.
    opzioni:
      - testo: "Mediare fra i due"
        descrizione: "Ghoran pesa e Tuarmir conta. Bisogna trovare un modo che vada bene a tutti e due."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Pesati e contati
          testo: |
            Proponi di contare i funghi e poi di pesarli, così ognuno fa a modo
            suo. Ci vuole un'ora, e alla fine si stringono la mano sopra la
            gabbia. L'uomo ti dà qualche moneta per il disturbo. La donna ti dice
            dove passano le carovane di Tuarmir questa settimana.
          pe: { persuasione: 6 }
          effetti: { monete: 6, informazioni.voce: 1 }
        fallimento:
          titolo: Contro tutti e due
          testo: |
            Proponi una via di mezzo, e per la prima volta da quando sei
            arrivat{o|a} i due sono d'accordo, contro di te. L'uomo ti chiede chi
            ti ha chiamato e la donna si rimette la maschera. Al crocevia si
            ferma un carrettiere a godersi la scena.
          effetti: { scandalo: 0.5 }

      - testo: "Comprare il sacco e rivenderlo"
        descrizione: "Paghi l'uomo di Ghoran al posto dello scambio e ti tieni i funghi. La prima carovana che passa te li ricompra."
        requisiti: [monete >= 12]
        esito:
          titolo: Il sacco di funghi
          testo: |
            Paghi l'uomo, che se ne va con le sue galline e la borsa piena. La
            donna ti cede il sacco a un prezzo onesto, che vuol dire basso. Prima
            di sera passa una carovana diretta in città, e il carovaniere apre il
            sacco e lo annusa, e ti paga il prezzo della città senza discutere.
          effetti: { monete: 8 }

      - testo: "Dare ragione all'uomo di Ghoran"
        descrizione: "A Ghoran si pesa, e il peso è quello. I clan si ricordano di chi sta dalla loro parte."
        esito:
          titolo: Il peso è il peso
          testo: |
            Dici che il peso è il peso. La donna di Tuarmir ti guarda senza dire
            niente. Fa lo scambio e se ne va con la maschera tirata su. L'uomo ti dà una pacca sulla spalla che ti lascia il segno
            e ti regala qualche moneta.
          effetti: { rep.ghoran: 0.5, rep.tuarmir: -0.5, monete: 3 }

      - testo: "Dare ragione alla donna di Tuarmir"
        descrizione: "Un sacco di funghi di Tuarmir vale più di due galline. A Tuarmir lo sanno, e si ricordano di chi lo dice."
        esito:
          titolo: Uno per uno
          testo: |
            Dici all'uomo che quei funghi in città valgono più delle sue galline.
            Lui sputa per terra e accetta lo scambio di malavoglia. La donna ti
            ringrazia a voce bassa e ti dice su quale tratto di pista la Marea è
            salita negli ultimi giorni.
          effetti: { rep.tuarmir: 0.5, rep.ghoran: -0.5, informazioni.voce: 1 }

  # ================================================================ comune · le lanterne sul sentiero
  - id: carta-sf-lanterne-sul-sentiero
    tipo: carta
    area: superficie-fratturata
    immagine: icone/paper-lantern
    titolo: Le lanterne sul sentiero
    sommario: "Di notte una fila di lanterne accese scende lungo un sentiero che di giorno non c'è."
    luogo: Superficie Fratturata, le terrazze basse di notte
    testo: |
      Di notte, dalle terrazze basse, vedi una fila di lanterne accese che scende verso la pianura. Sono
      lanterne di carta oleata appese a pali storti, e segnano un sentiero. Quel pendio lo conosci bene, e di
      giorno lì c'è soltanto ghiaia.

      Le fiamme restano ferme anche se tira vento. In fondo alla fila, dove le lanterne finiscono, il buio è
      più fitto che altrove.

      {resilienza Media} Le gambe vorrebbero già scendere. È una voglia che non viene da te, e conviene saperlo
      prima di decidere.
    opzioni:
      - testo: "Seguire le lanterne"
        descrizione: "Scendere fino all'ultima e vedere dove porta il sentiero. Bisogna restare padroni dei propri passi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Il cerchio di sassi
          testo: |
            Scendi tenendo il conto delle lanterne, per non perderti nel loro
            ritmo. All'ultima il sentiero finisce davanti a un cerchio di sassi, e
            in mezzo al cerchio c'è un guscio di metallo posato su un panno. Lo
            prendi. Quando ti volti le lanterne si spengono una alla volta, dalla
            più lontana alla più vicina.
          pe: { resilienza: 8 }
          effetti: { reperto.sigillato: 1, racconto: 1 }
        fallimento:
          titolo: La cenere nelle tasche
          testo: |
            A metà strada perdi il conto, e da lì in poi non ricordi niente.
            All'alba ti svegli sulla ghiaia nuda con i piedi pieni di tagli. Dei
            pali e delle lanterne non c'è traccia, e le tasche sono piene di
            cenere fredda.
          effetti: { tormento: 1.5 }

      - testo: "Spegnerle una per una"
        descrizione: "Le fiamme non scaldano. Dentro ogni lanterna c'è qualcosa che brucia, e si può prendere."
        esito:
          titolo: Le schegge fredde
          testo: |
            Apri la prima lanterna e al posto dello stoppino trovi una scheggia di
            cristallo che brucia senza scaldare. La spegni fra due dita. Ne spegni
            altre sei prima che la mano cominci a tremarti, e non riesci a capire
            perché. Torni indietro al buio con le schegge in tasca.
          effetti: { cristalli.frammento-esausto: 4, cristalli.cristallo-sterile: 1, tormento: 0.5 }

      - testo: "Contarle e andartene"
        descrizione: "Al Grifone qualcuno vorrà sapere quante erano e dove scendevano."
        esito:
          titolo: Ventitré
          testo: |
            Le conti due volte, e sono sempre ventitré. Prendi nota
            dei sassi in cima e in fondo alla fila e torni sulla tua strada. Al
            Grifone di Ferro qualcuno si fa raccontare tutto e ti offre da bere.
          effetti: { informazioni.voce: 1, racconto: 1 }

  # ================================================================ comune · il pozzo che respira
  - id: carta-sf-pozzo-che-respira
    tipo: carta
    area: superficie-fratturata
    immagine: icone/well
    titolo: Il pozzo che respira
    sommario: "In mezzo a un pianoro c'è un pozzo perfettamente rotondo, e dal buio sale aria calda."
    luogo: Superficie Fratturata, un pianoro di basalto
    testo: |
      In mezzo a un pianoro di basalto c'è un pozzo perfettamente rotondo, largo quanto una porta. Il bordo è
      liscio come vetro e non ha carrucola. Dal buio sale un soffio d'aria calda con un odore di metallo
      bagnato. Ogni tanto il soffio si ferma e l'aria torna a scendere piano, e ti tira i capelli verso il
      basso.

      {tecnologia Media} Un pozzo così non l'ha scavato nessuno con il piccone. È un condotto dei Precursori,
      e laggiù qualcosa muove ancora l'aria.

      Accanto al bordo c'è un anello di ferro piantato nella roccia, buono per legarci una corda.
    opzioni:
      - testo: "Calarsi con la corda"
        descrizione: "Si scende finché la corda basta. Quando l'aria torna a scendere tira giù anche te."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: La camera tonda
          testo: |
            Leghi la corda all'anello e scendi puntando i piedi sulla parete.
            Dopo un tratto il condotto si allarga in una camera tonda, con una
            grata sul fondo da cui sale l'aria calda. Fra le sbarre della grata è
            incastrato un guscio sigillato, e accanto c'è un pezzo di carcassa.
            Risali con le braccia che tremano.
          pe: { atletica: 8 }
          effetti: { reperto.sigillato: 1, parte.involucro-1: 1 }
        fallimento:
          titolo: Il soffio che tira
          testo: |
            A metà discesa l'aria cambia verso e ti tira giù di colpo. La corda
            ti brucia i palmi e sbatti la spalla contro la parete. Quando l'aria
            torna a salire risali a forza di braccia, senza aver visto il fondo.
          effetti: { ferite: 1 }

      - testo: "Gettarci una moneta"
        descrizione: "Per sentire quanto è profondo. Una moneta sola, e si conta."
        requisiti: [monete >= 1]
        esito:
          titolo: La moneta che torna
          testo: |
            Lasci cadere una moneta e conti. Non la senti toccare il fondo. Dopo
            un po' il soffio sale più forte del solito e ti sputa ai piedi una
            moneta tiepida che non è la tua. Viene da un conio che non conosci, e
            ha un segno inciso al posto del profilo.
          effetti: { monete: -1, reliquie.frammento-inciso: 1 }

      - testo: "Segnarlo per Oda Krell"
        descrizione: "Oda paga bene i condotti che nessuno ha ancora svuotato, se le dici dove sono."
        esito:
          titolo: Il segno sulla mappa
          testo: |
            Prendi nota della posizione rispetto alle terrazze e a un anello
            inclinato poco lontano. Alla baracca Oda Krell ascolta tutto senza
            interromperti, poi ti chiede quanto era caldo il soffio e annuisce.
            Ti dice che quel condotto lo conosceva qualcuno che non è più tornato.
          effetti: { informazioni.pettegolezzo: 1, informazioni.voce: 1 }

oggetti:
  - id: sf-tubo-della-capsula
    nome: Tubo della capsula
    immagine: icone/ray-gun
    descrizione: "Un tubo di metallo grigio con una presa a sei dita che si scalda nella mano, trovato in una capsula caduta dei Precursori. Quando premi l'incavo sotto la presa sputa uno spillo che passa le corazze, e nella camera ne ricresce un altro."
    slot: arma
    base: balestra-leggera
    grado: 3
    dadi: 1
    proprieta: { affilata: 1, penetrante: 1 }

  - id: sf-corazza-del-tumulo
    nome: Corazza del tumulo
    immagine: icone/scale-mail
    descrizione: "Una corazza di scaglie grigie che non prendono ruggine, tolta dalla lastra di un tumulo sul crinale. Quando un colpo dovrebbe buttarti a terra le scaglie si serrano e ti tengono in piedi."
    slot: armatura
    base: cotta-di-maglia
    grado: 3
    dadi: 1
    proprieta: { ultimoRespiro: true }

  - id: sf-cristallo-della-fenditura
    nome: Cristallo della fenditura
    immagine: icone/crystal-growth
    descrizione: "Un cristallo grande come un pugno, tolto da una ghiera dei Precursori in fondo a una fenditura. Batte piano al ritmo del polso di chi lo tiene, e il Mana ci passa più docile."
    slot: accessorio
    grado: 3
    proprieta: { riserva: 1, talento: { magia: 1, tecnologia: 1 } }

  - id: sf-lama-che-non-dorme
    nome: Lama che non dorme
    immagine: icone/shard-sword
    descrizione: "Una spada lunga sfilata da un altopiano di lame arrugginite, l'unica che il tempo non ha toccato. Quando ferisce beve. Dopo ogni scontro la sua nota ti resta in testa fino a sera."
    slot: arma
    base: spada-lunga
    grado: 3
    dadi: 1
    proprieta: { affilata: 1, assetata: true }
    difetti: [inquieta]

