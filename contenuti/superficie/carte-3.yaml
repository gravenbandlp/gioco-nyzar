# La Superficie Fratturata, carte del mazzo (terzo gruppo): incontri 33, 34, 35, 36, 38, 39, 43, 45, 47, 48 della
# tabella del master, riscritti nella voce del gioco.
# Ripetibili così come sono: il pianoro delle ossa (la lettura della battaglia una volta sola), la bestia che scappa,
# l'erba alta, il ladro che non si vede.
# Uniche, o che cambiano dopo la prima volta (flag sup3.*): la trappola per la bestia (torna come carta a parte), le
# pagine di Ilde (con il seguito sul bordo della crepa), Tobia lo stagnino, il corriere della Caserma (torna a pagare se
# l'hai aiutato), il cane accanto al padrone (torna uguale se lo lasci stare, e ti ritrova se l'hai aiutato), la voce
# nel metallo (conta le volte e si fa più insistente), la maschera nella polvere.
# Nomi nuovi, che il Codex non dà: Ilde (cercatrice di vene), Tobia Gresso (stagnino di Laresh), Corrado Lusi
# (corriere della Caserma). I numeri stanno solo negli effetti (docs/stile-dei-testi.md, regola 11).
quality:
  - { id: sup3.campo-storia, nome: "Il pianoro delle ossa", categoria: stato, nascosta: true, descrizione: "1 se hai già letto la battaglia sul pianoro delle ossa." }
  - { id: sup3.trappola, nome: "La trappola per la bestia", categoria: stato, nascosta: true, descrizione: "1 se hai teso la trappola alla bestia che scappa, 2 quando sei tornato a vedere che cosa ha preso." }
  - { id: sup3.diario, nome: "Le pagine di Ilde", categoria: stato, nascosta: true, descrizione: "1 quando hai trovato le pagine del diario di Ilde." }
  - { id: sup3.viandante, nome: "Tobia lo stagnino", categoria: stato, nascosta: true, descrizione: "1 quando hai incontrato Tobia Gresso sulla strada di Laresh." }
  - { id: sup3.messaggero, nome: "Il corriere della Caserma", categoria: stato, nascosta: true, descrizione: "1 se hai aiutato Corrado Lusi a ritrovare la strada, 2 quando la storia è chiusa, 3 se l'hai minacciato." }
  - { id: sup3.cane, nome: "Il cane che aspetta", categoria: stato, nascosta: true, descrizione: "1 se hai lasciato il cane accanto al padrone, 2 se l'hai convinto a venire via, 3 se l'hai scacciato, 4 quando ti ha ritrovato." }
  - { id: sup3.voce, nome: "La voce nel metallo", categoria: stato, nascosta: true, descrizione: "Quante volte hai sentito la voce nel metallo che porti, e 99 quando hai smesso di sentirla." }
  - { id: sup3.maschera, nome: "La maschera nella polvere", categoria: stato, nascosta: true, descrizione: "1 quando hai trovato la maschera nella nicchia di basalto." }

storylet:
  # ================================================================ 33 · Campo di battaglia antico
  - id: carta-sup3-campo-di-battaglia
    immagine: icone/broken-shield
    titolo: Il pianoro delle ossa
    sommario: "Su un pianoro di ghiaia affiorano le armi e le ossa di uno scontro che nessuno ricorda."
    luogo: Superficie Fratturata, un pianoro di ghiaia sotto le terrazze
    tipo: carta
    area: superficie-fratturata
    testo: |
      Il sentiero scende su un pianoro di ghiaia grigia, e la prima cosa che senti sotto lo
      stivale è una costola. Le ossa affiorano dappertutto fra lame ridotte dalla ruggine a
      foglie secche, ammucchiate verso la crepa lungo una fila storta, e da un elmo
      rovesciato spunta un rametto grigio.

      {origine accolito-del-velo} Le mani ti si intrecciano davanti alla cintura come in
      Cattedrale, anche se non sai a chi pregavano questi.

      {accademiche Media} Nessun libro parla di una battaglia quassù, quindi è più vecchia
      dei libri, oppure chi l'ha vinta non sapeva scrivere.
    opzioni:
      - testo: "Frugare fra i resti"
        descrizione: "Le lame vecchie tagliano ancora sotto la ruggine, e la ghiaia nasconde le buche."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il pugno chiuso
          testo: |
            Smuovi la ghiaia con il coltello e vengono fuori schegge di metallo dei
            Precursori e qualche moneta dal conio consumato. In fondo alla fila uno
            scheletro stringe nel pugno un guscio di metallo liscio grande come una
            pera, e gli apri le dita una per una chiedendogli scusa.
          effetti: { reperto.sigillato: 1, reliquie.scheggia: 2, monete: 4 }
        fallimento:
          titolo: La lama sotto la ghiaia
          testo: |
            Infili la mano nella ghiaia verso una cosa che luccica, e il filo di
            una lama nascosta ti apre il palmo fino al polso. Quello che luccicava
            è una fibbia d'ottone, e te la porti via mentre ti fasci la mano
            chiedendoti se la ruggine fa male al sangue o se lo dicono le nonne.
          effetti: { ferite: 0.5, reliquie.scheggia: 1 }

      - testo: "Leggere la battaglia"
        descrizione: "Chi sa guardare capisce dai morti, rimasti dove sono caduti, da che parte stavano e verso dove guardavano."
        quando: [sup3.campo-storia == 0]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Difficile }
        successo:
          titolo: Verso la crepa
          testo: |
            Cammini lungo la fila con le mani dietro la schiena, come un maestro
            dell'Accademia. Gli scudi guardano tutti la crepa e le monete non
            hanno lo stampo di Qir-Azel. Dietro la fila restano i monconi di una
            palizzata, e capisci che difendevano un accampamento da prima che la
            città esistesse.
          pe: { accademiche: 10 }
          imposta: { sup3.campo-storia: 1 }
          effetti: { informazioni.pettegolezzo: 1, racconto: 1 }
        fallimento:
          titolo: Il conto che non torna
          testo: |
            Provi a contarli e ti perdi verso la quarantina, sempre dove due
            scheletri sono caduti abbracciati e non capisci di chi sia il braccio.
            Alla terza volta ti accorgi che stai contando a voce alta, e te ne
            vai.
          effetti: { tormento: 1 }

      - testo: "Passare oltre"
        descrizione: "I morti di quel pianoro hanno aspettato a lungo, e possono aspettare ancora."
        costo: 0
        esito:
          titolo: In punta di piedi
          testo: |
            Attraversi il pianoro lungo il bordo, dove le ossa sono poche, mettendo
            i piedi dove non scricchiola niente. Dal gradone ti volti una volta, e
            l'ultima cosa che vedi è l'elmo con il rametto.

  # ================================================================ 34 · Creatura fuggitiva
  - id: carta-sup3-creatura-fuggitiva
    immagine: icone/fox
    titolo: Quella che scappa
    sommario: "Fra i massi una bestia grigia ti guarda con una cosa lucida in bocca, e poi sparisce."
    luogo: Superficie Fratturata, un ghiaione fra due terrazze
    tipo: carta
    area: superficie-fratturata
    requisiti: [sup3.trappola != 1]
    testo: |
      Sul ghiaione fra due terrazze un sasso rotola da solo, e la mano ti va
      al coltello. Su un masso c'è una bestia color cenere grande come una
      volpe, con due chiazze azzurrine sulle spalle, che tiene in bocca una
      cosa lucida come una gatta porta i piccoli. Ti guarda con la testa
      piegata, poi con un salto sparisce verso una crepa.

      {natura Media} Le chiazze azzurrine sono pelo bruciato e ricresciuto, e
      questa bestia dorme vicino a una crepa.

      {origine figlio-del-circolo} Al Circolo hai imparato ad ascoltare le
      bestie, e questa non ha né paura né fame.
    opzioni:
      - testo: "Inseguirla"
        descrizione: "Corre veloce ma va verso casa, e sul ghiaione le caviglie si girano."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La tana
          testo: |
            La segui di masso in masso fino a una lastra di basalto sul bordo della
            crepa. La tana è foderata di erba secca e di tutto quello che luccica sulla
            Superficie. Fra bottoni e frammenti di cristallo c'è anche un pezzo di anello
            dei Precursori, e la bestia ti ringhia dal fondo mentre fai la cernita.
          pe: { atletica: 5 }
          effetti: { cristalli.frammento-esausto: 2, reliquie.scheggia: 1, monete: 3 }
        fallimento:
          titolo: Il ghiaione
          testo: |
            Al terzo salto il masso si muove e scendi sulla schiena per un tratto
            di ghiaione, fino a fermarti contro un gradone con la caviglia che
            pulsa. Dall'alto la bestia ti guarda con la cosa lucida ancora in
            bocca.
          effetti: { ferite: 0.5 }

      - testo: "Prepararle una trappola"
        descrizione: "Una bestia che raccoglie cose lucide torna per una cosa lucida, se il laccio è fatto bene."
        quando: [sup3.trappola == 0]
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Media }
        successo:
          titolo: Il laccio
          testo: |
            Sul suo passaggio fra due massi tendi un laccio con la corda più sottile
            che hai, legato basso a una radice morta, e per esca appoggi di taglio a
            un sasso una moneta lucidata con la manica. Quando ripasserai da qui
            saprai se ha abboccato.
          pe: { natura: 5 }
          imposta: { sup3.trappola: 1 }
        fallimento:
          titolo: Le dita nel laccio
          testo: |
            Il laccio ti scatta in mano mentre lo regoli e ti stringe due dita
            contro la radice. Mentre ti liberi, da qualche parte sopra di te la
            bestia fa un verso molto simile a una risata.
          effetti: { ferite: 0.5 }

      - testo: "Lasciarla andare"
        descrizione: "Non ti ha fatto niente, e ha l'aria di avere da fare."
        costo: 0
        esito:
          titolo: Fatti suoi
          testo: |
            Togli la mano dal coltello e riprendi il sentiero. Per un tratto ti
            sembra di sentire i sassi rotolare dietro di te, sempre alla stessa
            distanza, ma ogni volta che ti volti il ghiaione è vuoto.

  - id: carta-sup3-la-trappola
    immagine: icone/wolf-trap
    titolo: Il laccio teso
    sommario: "Torni al passaggio fra i massi, e la corda del laccio adesso è tesa."
    luogo: Superficie Fratturata, il ghiaione fra due terrazze
    tipo: carta
    area: superficie-fratturata
    requisiti: [sup3.trappola == 1]
    testo: |
      Riconosci il posto dalla radice morta, e la corda del laccio è tesa.
      La bestia grigia è distesa fra i due massi con una zampa posteriore
      presa nel nodo, e ti guarda con l'orecchio spezzato dritto senza
      agitarsi. La moneta dell'esca non c'è più, e accanto al muso c'è un
      cilindro di metallo grigio lungo un palmo, con due graffi di denti su
      un'estremità.

      {empatia Media} Non si agita perché ha già provato e ha capito che
      peggiora le cose, e adesso aspetta di vedere che tipo sei.
    opzioni:
      - testo: "Liberarla"
        descrizione: "Una bestia presa al laccio morde chi le tocca la zampa, se non capisce che cosa stai facendo."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: Il cilindro
          testo: |
            Le parli piano mentre allenti il nodo, e lei ti lascia fare con il
            muso sulla ghiaia. Libera, si allontana zoppicando, poi torna a
            posarti il cilindro accanto allo stivale e se ne va verso la crepa.
          pe: { addestrare-animali: 10 }
          imposta: { sup3.trappola: 2 }
          effetti: { reperto.sigillato: 1 }
        fallimento:
          titolo: Il morso
          testo: |
            Appena tocchi il nodo la bestia ti morde il polso, senza cattiveria ma
            quanto basta a farti lasciare la presa. Il laccio si allenta e lei è
            già lontana con il cilindro fra i denti prima che tu abbia finito di
            imprecare.
          imposta: { sup3.trappola: 2 }
          effetti: { ferite: 0.5 }

      - testo: "Prendere il cilindro e lasciarla lì"
        descrizione: "Il cilindro è a portata di mano, e il nodo la bestia lo rosicchierà da sola."
        esito:
          titolo: Il verso nella notte
          testo: |
            Raccogli il cilindro con il braccio teso e te ne vai con gli occhi
            della bestia sulla schiena. Quella notte ti sembra di sentire dal
            ghiaione un verso corto e ripetuto, e ti dici che il nodo l'avrà
            rosicchiato.
          imposta: { sup3.trappola: 2 }
          effetti: { reperto.sigillato: 1, tormento: 1 }

      - testo: "Tagliare la corda da lontano"
        descrizione: "Un colpo di coltello sulla corda, dalla parte della radice, e la bestia è libera con il suo tesoro."
        costo: 0
        esito:
          titolo: Via con il tesoro
          testo: |
            Tagli la corda dalla parte della radice con il braccio teso, e la
            bestia scatta via con il cilindro in bocca e il laccio ancora alla
            zampa, lasciandoti in mano mezzo metro di corda.
          imposta: { sup3.trappola: 2 }

  # ================================================================ 35 · Frammento di diario
  - id: carta-sup3-pagine-di-diario
    immagine: icone/notebook
    titolo: Pagine legate con lo spago
    sommario: "Sotto un sasso, qualche pagina di diario scritta da poco, con le frecce disegnate a margine."
    luogo: Superficie Fratturata, accanto a un ometto di sassi
    tipo: carta
    area: superficie-fratturata
    requisiti: [sup3.diario == 0]
    testo: |
      Sotto la pietra in cima all'ometto di una biforcazione c'è un fascio di
      pagine legate con lo spago da cucina, su carta buona dei Ponti, con una
      macchia di grasso su un angolo. La grafia è piccola e tonda e firma con
      una I sola. Frecce e sorgenti sono segnate a margine con le distanze in
      passi, e sull'ultima pagina le righe si fanno storte e si fermano a
      metà di una parola.

      {origine mercante-dei-ponti} La carta la riconosci al tatto, perché sui
      Ponti si vende a fogli a chi ha dei conti da tenere in ordine.
    opzioni:
      - testo: "Leggerle con calma"
        descrizione: "Appunti di strada scritti in fretta, utili a chi li sa leggere qui fuori."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Facile }
        successo:
          titolo: Gli appunti di Ilde
          testo: |
            Leggi tutto due volte, la seconda con il dito sotto le righe. La donna
            si chiama Ilde e cerca vene di cristallo per conto suo, sa che le frecce
            bianche sulle terrazze sono state girate e che a est c'è un campo di
            predoni che si sposta con la luna. Ti copi le frecce su un biglietto e
            rimetti le pagine sotto il sasso.
          pe: { percezione: 5 }
          imposta: { sup3.diario: 1 }
          effetti: { informazioni.voce: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: L'ultima riga
          testo: |
            Leggi le prime pagine in fretta per tornare sempre alla parola
            spezzata dell'ultima, e del resto ti rimane poco. Quella notte provi a
            finirla in tutti i modi possibili, e nessuno ti piace.
          imposta: { sup3.diario: 1 }
          effetti: { informazioni.voce: 1, tormento: 1 }

      - testo: "Seguire le frecce"
        descrizione: "L'ultima freccia punta a nord verso una crepa, a mezza giornata se i passi di Ilde sono come i tuoi."
        esito:
          titolo: I passi contati
          testo: |
            Segui le frecce contando i passi come li contava lei, che li faceva un
            po' più corti dei tuoi, e verso mezzogiorno hai imparato a correggere a
            occhio. L'ultima freccia ti porta sul bordo di una crepa azzurra.
          imposta: { sup3.diario: 1 }
          segue: carta-sup3-il-campo-di-ilde

      - testo: "Rimetterle sotto il sasso"
        descrizione: "Chi le ha lasciate potrebbe tornare a prenderle."
        costo: 0
        esito:
          titolo: Sotto il sasso
          testo: |
            Rileghi lo spago con il nodo che c'era e rimetti le pagine sotto la
            pietra. Poi prendi la strada di destra, che sulle pagine non c'era,
            sentendoti in colpa senza sapere bene verso chi.
          imposta: { sup3.diario: 1 }

  - id: carta-sup3-il-campo-di-ilde
    immagine: icone/rope-coil
    titolo: Il campo sul bordo
    sommario: "Dove finiscono le frecce di Ilde c'è un campo freddo, e una corda che scende nella crepa."
    luogo: Superficie Fratturata, il bordo di una crepa azzurra
    tipo: seguito
    area: superficie-fratturata
    testo: |
      Il campo di Ilde è un cerchio di sassi intorno alla cenere fredda, con
      una borsa di tela legata a un picchetto. Da un masso sul bordo scende
      nella crepa una corda sfilacciata fino a metà, dove sfrega sulla
      roccia. Quando ti sporgi a chiamare risponde una voce rauca di donna,
      Ilde, bloccata su una cengia da due notti con un piede rotto.

      {origine apprendista-raschiatore} Alla Cicatrice hai visto abbastanza
      corde sfilacciate da sentirle cedere prima che cedano.

      {resistenza Media} Scendere va bene, risalire con una donna sulla
      schiena è un'altra faccenda, e sulla corda di lei non conviene
      appoggiarsi.
    opzioni:
      - testo: "Scendere a prenderla"
        descrizione: "È la via più rischiosa, con la corda sfilacciata, il bagliore della crepa e una donna da portare su."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: La cengia
          testo: |
            Ti cali tenendo la corda lontano dal filo della roccia, nel bagliore
            azzurro. Trovi Ilde sulla cengia con il piede fasciato e la febbre,
            accanto a una placca dei Precursori staccata dalla parete, e lei ti lega
            alla cintura la placca e un guscio sigillato. In cima ride e piange e ti
            dice che la vena era buona.
          pe: { atletica: 10 }
          effetti: { reperto.sigillato: 1, parte.camera-1: 1, racconto: 1 }
        fallimento:
          titolo: Il fiato della crepa
          testo: |
            A metà discesa sale dal fondo una folata grigia che sa di ferro, e per
            un momento non sai più dov'è l'alto. Porti su Ilde lo stesso, sulla
            schiena, ma la sua placca resta giù.
          effetti: { ferite: 0.5, contaminazione: 1.5, racconto: 1 }

      - testo: "Calarle una corda nuova e tirarla su"
        descrizione: "Una corda tua legata bene, e la pazienza di tirarla su fino a sera."
        costo: 2
        esito:
          titolo: Fino a sera
          testo: |
            Le cali la tua corda e le spieghi due volte come legarsi sotto le
            ascelle, poi tiri con il piede puntato contro il masso fino al
            tramonto. Ilde ti regala le monete che ha e ti dice dove sono le altre
            vene della sua lista, tanto per un pezzo non ci arriva.
          effetti: { monete: 5, informazioni.pettegolezzo: 1, racconto: 1 }

      - testo: "Prendere la borsa e andartene"
        descrizione: "La borsa è legata al picchetto, e Ilde da laggiù non può vedere chi la prende."
        esito:
          titolo: Il picchetto
          testo: |
            Sciogli la borsa dal picchetto, con le monete di Ilde e un rotolo di
            bende pulite. Lei continua a chiamare mentre ti allontani finché la
            voce si spegne, e non torni indietro a vedere perché.
          effetti: { monete: 6, bende: 1, tormento: 1.5 }

  # ================================================================ 36 · Viandante in cerca di compagnia
  - id: carta-sup3-viandante
    immagine: icone/hiking
    titolo: Lo stagnino di Laresh
    sommario: "Un uomo con uno zaino di pentole ti viene incontro sul sentiero, contento di vedere qualcuno."
    luogo: Superficie Fratturata, la pista dei carri per Laresh
    tipo: carta
    area: superficie-fratturata
    requisiti: [sup3.viandante == 0]
    testo: |
      Lo senti prima di vederlo, perché a ogni passo la latta sbatte contro la
      latta. Sulla pista dei carri viene avanti un uomo basso con un cappello di
      paglia sfondato e uno zaino di pentole legate a grappolo.

      «Non pensavo di trovare anima viva, quassù» dice. «Tobia Gresso, stagnino,
      di Laresh. Laresh è di là, dico bene?» I carrettieri sono partiti senza di
      lui perché si è svegliato tardi, e lo racconta ridendo, con le mani
      aggrappate alle cinghie dello zaino.

      {furtivita Facile} Con quel rumore ogni predone delle terrazze sa dov'è da
      un'ora.
    opzioni:
      - testo: "Fare la strada con lui"
        descrizione: "Fino al bivio di Laresh è mezza giornata, e Tobia parla tanto ma in due si cammina più tranquilli."
        costo: 2
        esito:
          titolo: Il bivio
          testo: |
            Fate la strada insieme fino al bivio, e Tobia ti racconta quale mugnaio
            di Laresh annacqua il vino e chi paga in farina invece che in monete.
            Al bivio ti ripara la borraccia con una goccia di stagno e ti regala un
            vasetto dell'unguento di sua moglie. «Per le vesciche, dico bene? Io
            non lo uso mai.»
          pe: { conoscenze-della-strada: 5 }
          imposta: { sup3.viandante: 1 }
          effetti: { informazioni.voce: 2, unguento: 1 }

      - testo: "Scambiare due parole e proseguire"
        descrizione: "Gli basta qualcuno che lo ascolti. Il difficile sarà salutarlo."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Facile }
        successo:
          titolo: Le pentole in lontananza
          testo: |
            Lo lasci parlare mentre bevete dalla stessa borraccia, e al momento
            giusto gli chiedi dei carrettieri, che si fermano sempre allo stesso
            pozzo. Tobia si illumina e riparte, e senti le pentole finché il vento
            se le porta via.
          pe: { empatia: 5 }
          imposta: { sup3.viandante: 1 }
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Il miglio in più
          testo: |
            Ogni volta che provi a salutarlo Tobia attacca un'altra storia. Alla
            fine gli dici di lasciarti in pace con una voce più dura di quella che
            volevi, e lui si toglie il cappello e se ne va a testa bassa.
          imposta: { sup3.viandante: 1 }
          effetti: { tormento: 1 }

      - testo: "Guardargli le spalle prima di fidarti"
        descrizione: "Mentre lui parla tu guardi le rocce dietro di lui, perché se è un'esca chi la tiene è lì."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Le orme a est
          testo: |
            Lo ascolti annuendo e intanto passi in rassegna le rocce. Sul bordo
            della pista ci sono orme fresche di stivali chiodati dirette a est, e
            quando glielo dici Tobia per la prima volta sta zitto, poi ti dice dove
            ieri ne ha visti sei o sette con un carro senza mulo.
          pe: { percezione: 5 }
          imposta: { sup3.viandante: 1 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: I sassi sulla cresta
          testo: |
            Sulla cresta dietro di lui vedi due sagome ferme e tiri fuori l'arma
            prima di pensarci. Tobia scappa giù per la pista con un fracasso da
            cucina in fiamme, e le sagome sulla cresta sono due sassi.
          imposta: { sup3.viandante: 1 }
          effetti: { tormento: 1 }

  # ================================================================ 38 · Vegetazione insolitamente rigogliosa
  - id: carta-sup3-erba-alta
    immagine: icone/oasis
    titolo: L'erba alta
    sommario: "In una piega fra due terrazze c'è un prato verde con una polla d'acqua chiara."
    luogo: Superficie Fratturata, una piega fra due terrazze
    tipo: carta
    area: superficie-fratturata
    testo: |
      In una piega fra due terrazze, dove ti aspetti la solita ghiaia, l'erba
      ti arriva al ginocchio. In mezzo c'è un alberello dalle foglie argentate
      accanto a una polla così chiara che vedi i sassi sul fondo, e sopra
      l'acqua non vola un insetto. Fra le radici, appena sotto la terra, si
      vede la curva lucida di un anello di metallo.

      {natura Media} Un prato dove non ronza nemmeno un'ape beve da qualcosa
      che le bestie evitano, e le radici vanno tutte verso l'anello.
    opzioni:
      - testo: "Riposare all'ombra"
        descrizione: "Un sonno vero all'ombra, con l'acqua vicino, mentre l'erba intanto cresce."
        costo: 2
        esito:
          titolo: La sagoma nell'erba
          testo: |
            Dormi sotto l'alberello senza sognare e ti svegli con la schiena
            sciolta. Intorno al punto dove eri disteso l'erba è cresciuta di un
            dito e disegna la tua sagoma con le braccia aperte.
          effetti: { ferite: -0.5, tormento: -0.5 }

      - testo: "Bere alla polla"
        descrizione: "L'acqua è fresca e chiara, e sul fondo ogni tanto brilla qualcosa di azzurro."
        esito:
          titolo: L'acqua dolce
          testo: |
            Bevi a mani giunte un'acqua dolce e appena metallica, e il dolore alle
            gambe se ne va. Più tardi ti accorgi che le unghie hanno preso alla base
            una sfumatura grigia che non va via.

            {medicina Media} Il grigio alla base delle unghie è il primo posto dove
            la Marea si fa vedere.
          effetti: { ferite: -1, contaminazione: 1 }

      - testo: "Scavare fra le radici"
        descrizione: "Le radici stringono un anello dei Precursori sotto l'alberello, e la terra intorno è tiepida."
        prova: { attributo: mentale, abilita: [natura, tecnologia], difficolta: Media }
        successo:
          titolo: Il guscio tiepido
          testo: |
            Scavi dove la terra è più tiepida e sciogli una alla volta le radici
            avvolte all'anello. Sotto c'è un guscio sigillato grande come un pugno,
            caldo come una pietra al sole, e quando ti volti l'erba della piega
            comincia a ingiallire sulle punte.
          pe: { natura: 5 }
          effetti: { reperto.sigillato: 1 }
        fallimento:
          titolo: La linfa
          testo: |
            Tagli una radice per fare prima, e la linfa grigia che ne esce ti
            brucia il polso come ortica. Il guscio sotto l'anello lo vedi soltanto,
            perché le radici gli si stringono intorno appena provi a infilare le
            dita.
          effetti: { contaminazione: 1 }

      - testo: "Proseguire"
        descrizione: "Rimetti lo stivale e torni sulla ghiaia, dove almeno sai che cosa aspettarti."
        costo: 0
        esito:
          titolo: La ghiaia
          testo: |
            Ti riallacci lo stivale e risali sul gradone, e la ghiaia che torna a
            scricchiolare ti mette di buon umore, come una voce sgarbata che però
            conosci.

  # ================================================================ 39 · Messaggero di Qir-Azel
  - id: carta-sup3-messaggero
    immagine: icone/wax-seal
    titolo: Il corriere della Caserma
    sommario: "Un corriere della Caserma va di fretta con una borsa sigillata, sulla strada sbagliata."
    luogo: Superficie Fratturata, le frecce bianche sulle terrazze
    tipo: carta
    area: superficie-fratturata
    requisiti: [sup3.messaggero == 0]
    testo: |
      Accanto a una freccia bianca su un sasso c'è un uomo con il mantello
      della Caserma e una borsa di cuoio dal sigillo verde, con la mano sopra.
      «Sì, sì. Corrado Lusi, diretto a Laresh. La freccia dice di qua e il
      sole di là, e devo arrivare stasera.» Quassù qualcuno ha girato le
      frecce per scherzo.

      {origine figlio-della-citta-bassa} In Città Bassa davanti al mantello
      della Caserma si guarda altrove, e quassù un altrove non c'è.

      {intimidire Difficile} La mano sulla borsa trema, ma l'altra non lascia
      mai il fianco sinistro, dove il mantello fa una piega troppo dritta.
    opzioni:
      - testo: "Fargli due domande"
        descrizione: "Un corriere della Caserma sa cose che in città si vendono, se gliele chiedi con garbo e in fretta."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Quello che si sa in Caserma
          testo: |
            Gli parli come a un funzionario e lo chiami per titolo, e lui si
            ammorbidisce. Mentre gli indichi la direzione ti racconta chi ha
            chiesto udienza allo sceriffo questa settimana e quale carovana è
            stata fermata alla porta.
          imposta: { sup3.messaggero: 2 }
          effetti: { informazioni.pettegolezzo: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il nome sul registro
          testo: |
            Insisti una domanda di troppo, e Corrado fa un passo indietro con la
            mano sull'elsa. Ti chiede il nome e lo ripete due volte a mezza voce.
            «Sì, sì. Alla porta lo sapranno» dice, e se ne va impettito dalla parte
            sbagliata.
          imposta: { sup3.messaggero: 2 }
          effetti: { sospetto: 1 }

      - testo: "Rimetterlo sulla strada giusta"
        descrizione: "Le frecce sono girate, e se conosci le terrazze gli risparmi mezza giornata e una brutta figura."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Facile }
        successo:
          titolo: La pista dei carri
          testo: |
            Gli spieghi lo scherzo delle frecce, e Corrado invece di ridere se lo
            scrive su un taccuino, con la lingua fra i denti. Sotto ci scrive
            anche il tuo nome, e dice che al ritorno passerà di qui.
          pe: { natura: 5 }
          imposta: { sup3.messaggero: 1 }
          effetti: { rep.caserma: 0.5 }
        fallimento:
          titolo: Il gradone sbagliato
          testo: |
            Sei sicuro della strada finché il gradone non finisce nel vuoto.
            Tornando indietro Corrado scivola e finite in ginocchio contro la
            roccia, e quando ritrovate la pista lui ti ringrazia a denti stretti e
            se ne va zoppicando.
          imposta: { sup3.messaggero: 2 }
          effetti: { ferite: 0.5 }

      - testo: "Chiedergli la borsa"
        descrizione: "È solo e porta il soldo della Caserma, ma la Caserma si ricorda delle facce."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: Il borsellino
          testo: |
            Gli sbarri la strada con la mano sull'arma, e Corrado, pallido,
            stringe al petto la borsa sigillata e ti lancia il borsellino della
            cintura prima di scappare giù per i gradoni. La tua faccia però l'ha
            guardata bene.
          imposta: { sup3.messaggero: 3 }
          effetti: { monete: 8, sospetto: 1.5 }
        fallimento:
          titolo: La lama corta
          testo: |
            Corrado non scappa. Tira fuori una lama corta da sotto il mantello e te
            la passa sull'avambraccio con un gesto imparato nel cortile della
            Caserma, e mentre ti tieni il braccio lui si allontana di corsa.
          imposta: { sup3.messaggero: 3 }
          effetti: { ferite: 1, sospetto: 1 }

  - id: carta-sup3-il-messaggero-ritorna
    immagine: icone/envelope
    titolo: Il corriere torna da Laresh
    sommario: "Corrado Lusi torna da Laresh con un barattolo di vernice bianca e un debito da pagare."
    luogo: Superficie Fratturata, le frecce bianche sulle terrazze
    tipo: carta
    area: superficie-fratturata
    requisiti: [sup3.messaggero == 1]
    testo: |
      Accanto alla freccia bianca dove l'avevi incontrato, Corrado Lusi la sta
      ridipingendo dalla parte giusta, con il mantello impolverato fino alla
      vita e una goccia di vernice sul naso. La borsa è chiusa da un sigillo
      nuovo di ceralacca rossa, di Laresh.

      «Sì, sì, sei tu» dice, e tira fuori un borsellino, poi esita con la mano
      a mezz'aria. «Oppure ti racconto quello che ho sentito a Laresh. Allo
      sceriffo ho già detto il tuo nome, e quello non te lo leva nessuno.»

      {empatia Facile} Pagare gli costa meno che parlare, ma spera un poco che
      tu scelga le notizie.
    opzioni:
      - testo: "Accettare il borsellino"
        descrizione: "Quello che ti offre è poco per lui e qualcosa per te."
        costo: 0
        esito:
          titolo: Il debito pagato
          testo: |
            Prendi il borsellino e lui annuisce soddisfatto, poi torna in
            ginocchio davanti alla freccia, con la goccia di vernice sempre sul
            naso.
          imposta: { sup3.messaggero: 2 }
          effetti: { monete: 8, rep.caserma: 0.5 }

      - testo: "Farti raccontare Laresh"
        descrizione: "Un corriere della Caserma ascolta molto e ripete poco, ma questa volta ripete."
        costo: 0
        esito:
          titolo: Le notizie di Laresh
          testo: |
            Corrado si siede accanto alla freccia fresca e ti racconta a voce
            bassa quale mulino di Laresh ha smesso di macinare e chi è arrivato
            dal nord con un carro coperto. Poi si ricorda della fretta e si alza
            di scatto.
          imposta: { sup3.messaggero: 2 }
          effetti: { informazioni.pettegolezzo: 1, informazioni.voce: 1, rep.caserma: 0.5 }

  # ================================================================ 43 · Animale accanto al cadavere
  - id: carta-sup3-il-cane
    immagine: icone/sitting-dog
    titolo: Il cane che aspetta
    sommario: "Ai piedi di un gradone c'è un uomo morto, e accanto a lui un cane seduto."
    luogo: Superficie Fratturata, ai piedi di un gradone di basalto
    tipo: carta
    area: superficie-fratturata
    requisiti: [sup3.cane <= 1]
    testo: |
      Ai piedi di un gradone c'è un uomo disteso su un fianco, con le
      ginocchia raccolte al petto come si dorme al freddo e una fionda
      arrotolata al polso. Accanto a lui siede un cane magro color fango con
      un collare di corda, che va ad annusare la mano del padrone e torna a
      sedersi a guardarti senza ringhiare.

      {medicina Media} Sul corpo non c'è sangue. Forse è caduto dal gradone, e
      si è steso ad aspettare con una caviglia gonfia.

      {origine fuggiasco-di-ghoran} Nei recinti di Ghoran si dormiva così,
      raccolti contro il freddo.
    opzioni:
      - testo: "Avvicinarti piano, con la mano bassa"
        descrizione: "Un cane che fa la guardia a un morto accetta chi gli parla nel modo giusto e morde gli altri."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: Il riparo sotto la roccia
          testo: |
            Ti accucci e aspetti con il dorso della mano verso di lui. Il cane la
            annusa a lungo, poi ti porta al riparo del padrone sotto una sporgenza,
            dove trovi un fagotto, una borsa di monete e un guscio sigillato avvolto
            in un panno. Ti accompagna fino al bordo delle terrazze e torna indietro
            di corsa.
          pe: { addestrare-animali: 5 }
          imposta: { sup3.cane: 2 }
          effetti: { monete: 5, bende: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: I denti
          testo: |
            Allunghi la mano un momento troppo presto, e il cane ti morde il dorso
            senza un ringhio e torna a sedersi accanto al padrone. Ti allontani
            tenendoti la mano, e lui non ti guarda più, cosa che fa più male del
            morso.
          imposta: { sup3.cane: 1 }
          effetti: { ferite: 0.5 }

      - testo: "Seppellire l'uomo"
        descrizione: "Hai un sasso piatto e le mani per scavare, e il cane guarderà tutto."
        costo: 2
        esito:
          titolo: Il tumulo
          testo: |
            Scavi con il sasso e con le mani e ci adagi l'uomo con le mani
            incrociate sopra la fionda. Il cane guarda tutto senza muoversi, poi
            annusa il tumulo per tutta la lunghezza e ti accompagna fino al bordo
            delle terrazze.
          pe: { empatia: 5 }
          imposta: { sup3.cane: 2 }
          effetti: { racconto: 1, tormento: -0.5 }

      - testo: "Scacciare il cane e frugare il corpo"
        descrizione: "Il cane è magro e tu sei più grosso, ma difende il padrone e non ha più niente da perdere."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: Quello che aveva in tasca
          testo: |
            Gridi e batti i piedi, e il cane si ritira con il pelo dritto. Nelle
            tasche dell'uomo trovi un borsellino e una lettera mai spedita per una
            donna di Laresh, e quando te ne vai il cane torna al suo posto.
          imposta: { sup3.cane: 3 }
          effetti: { monete: 5, informazioni.voce: 1, tormento: 1 }
        fallimento:
          titolo: Il braccio
          testo: |
            Fai un passo avanti gridando, e il cane ti salta al braccio senza un
            verso e non molla finché non lo stacchi con l'altra mano. Poi torna a
            sedersi accanto al padrone, e la tua manica è rossa fino al gomito.
          imposta: { sup3.cane: 1 }
          effetti: { ferite: 1 }

      - testo: "Lasciarlo stare"
        descrizione: "È il suo posto e il suo padrone. Lo lasci com'è."
        costo: 0
        esito:
          titolo: Seduto
          testo: |
            Fai un largo giro intorno al gradone, piano come davanti a una casa in
            lutto. Il cane ti segue con gli occhi finché può, poi si stende accanto
            all'uomo con il muso sulle zampe.
          imposta: { sup3.cane: 1 }

  - id: carta-sup3-il-cane-ritorna
    immagine: icone/sniffing-dog
    titolo: Il collare di corda
    sommario: "Un cane con il collare di corda ti viene incontro fra i gradoni, e ti riconosce."
    luogo: Superficie Fratturata, un sentiero fra i gradoni
    tipo: carta
    area: superficie-fratturata
    requisiti: [sup3.cane == 2]
    testo: |
      Su un sentiero fra i gradoni ti viene incontro un cane color fango con
      il collare di corda. Ha messo su carne e ha un taglio rimarginato su un
      orecchio, e quando ti annusa gli stivali la coda gli si muove da sola.
      Sulla Superficie gira voce di un cane che va e viene dai campi dei
      Raschiatori. Poi fa qualche passo verso un gradone e si volta a
      guardarti, come quel giorno.

      {rissa Facile fallita} Il taglio è di un morso, e ti viene voglia di
      parlare con chi è stato, finché ti ricordi che è un cane.
    opzioni:
      - testo: "Andargli dietro"
        descrizione: "Sa dove sta andando. Tu no, e forse è meglio così."
        esito:
          titolo: La chiazza grigia
          testo: |
            Il cane ti porta per un giro largo che capisci solo quando vedi, più
            in basso, la chiazza di Marea sul sentiero dritto. Sotto una sporgenza
            tiene un osso rosicchiato e un guscio di metallo dissotterrato chissà
            dove, e ti lascia il guscio prima di andarsene con l'osso fra i denti.
          pe: { addestrare-animali: 5 }
          imposta: { sup3.cane: 4 }
          effetti: { reperto.sigillato: 1, racconto: 1 }

      - testo: "Dargli qualcosa da mangiare e salutarlo"
        descrizione: "Una crosta di pane e una grattata dietro le orecchie, poi ognuno per la sua strada."
        costo: 0
        esito:
          titolo: La crosta
          testo: |
            Gli dai la crosta che avevi in tasca e lui la prende con delicatezza,
            senza strapparla. Si lascia grattare dietro l'orecchio buono e riparte
            al trotto verso i campi dei Raschiatori, e ti accorgi che stai
            sorridendo da solo.
          imposta: { sup3.cane: 4 }
          effetti: { tormento: -0.5 }

  # ================================================================ 45 · Ladro invisibile imperfetto
  - id: carta-sup3-ladro-invisibile
    immagine: icone/invisible
    titolo: Il passo in più
    sommario: "Fra i massi qualcuno ti cammina accanto, e lo vedi soltanto quando si muove."
    luogo: Superficie Fratturata, un passaggio stretto fra i massi
    tipo: carta
    area: superficie-fratturata
    testo: |
      Nel passaggio stretto fra due massi la borsa alla cintura si sposta di
      lato, come sfiorata da un gomito, e senti un passo troppo vicino alle
      spalle. Nella striscia di luce fra le rocce una sagoma tremola come il
      caldo sopra un sasso, e la vedi solo quando si muove. Un altro passo, a
      sinistra, porta un odore di cipolla e di sudore. *I fantasmi non
      mangiano cipolle.* Una mano ti va alla borsa e l'altra all'arma.

      {conoscenze-della-strada Media} Un borseggiatore che si fa sentire è un
      borseggiatore nuovo, perché uno esperto sarebbe già lontano.
    opzioni:
      - testo: "Ascoltare dove posa i piedi"
        descrizione: "Sulla ghiaia anche chi non si vede fa rumore, e se sbagli è lui a prendere te."
        quando: [monete >= 6]
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il polso
          testo: |
            Chiudi gli occhi e ascolti la ghiaia. Il passo successivo arriva leggero
            da destra, allunghi la mano senza guardare e le dita ti si chiudono su
            un polso magro e sudato.
          segue: carta-sup3-ladro-scoperto
        fallimento:
          titolo: La borsa più leggera
          testo: |
            Ti giri verso un passo e il successivo arriva dall'altra parte. Senti
            un tocco alla cintura e una risatina che si allontana fra le rocce, e
            nella borsa, che ha il laccio sciolto, mancano abbastanza monete da
            farti male.
          effetti: { monete: -6, contaminazione: 0.5 }

      - testo: "Ascoltare dove posa i piedi"
        descrizione: "Sulla ghiaia anche chi non si vede fa rumore, e se sbagli è lui a prendere te."
        quando: [monete < 6]
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il polso
          testo: |
            Chiudi gli occhi e ascolti la ghiaia. Il passo successivo arriva leggero
            da destra, allunghi la mano senza guardare e le dita ti si chiudono su
            un polso magro e sudato.
          segue: carta-sup3-ladro-scoperto
        fallimento:
          titolo: La borsa vuota
          testo: |
            Ti giri verso un passo e il successivo arriva dall'altra parte. Senti
            un tocco alla cintura e uno sbuffo deluso, perché nella tua borsa c'è
            poco da prendere, poi per dispetto una spinta fra le scapole ti manda
            in ginocchio sulla ghiaia.
          effetti: { ferite: 0.5 }

      - testo: "Parlargli come se lo vedessi"
        descrizione: "Chi ruba nascosto non vuole farsi notare, e se capisce che l'hai notato forse si tratta."
        quando: [monete >= 6]
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: L'affare
          testo: |
            Guardi un punto a caso nell'aria e dici che la puzza di cipolla si sente
            fino a Laresh. Una voce di ragazzo ti risponde seccata dal punto
            accanto, e finisci per comprare la tua tranquillità con quello che sa
            dei campi dei Raschiatori.
          pe: { ingannare: 5 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: La borsa più leggera
          testo: |
            Parli con molta sicurezza al punto sbagliato dell'aria, e la risposta è
            un tocco leggero alla cintura dalla parte opposta. La borsa ha il
            laccio sciolto, e dentro mancano abbastanza monete da farti male.
          effetti: { monete: -6, contaminazione: 0.5 }

      - testo: "Parlargli come se lo vedessi"
        descrizione: "Chi ruba nascosto non vuole farsi notare, e se capisce che l'hai notato forse si tratta."
        quando: [monete < 6]
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: L'affare
          testo: |
            Guardi un punto a caso nell'aria e dici che la puzza di cipolla si sente
            fino a Laresh. Una voce di ragazzo ti risponde seccata dal punto
            accanto, e finisci per comprare la tua tranquillità con quello che sa
            dei campi dei Raschiatori.
          pe: { ingannare: 5 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: La spinta
          testo: |
            Parli con molta sicurezza al punto sbagliato dell'aria, e la risposta è
            un tocco alla cintura e uno sbuffo deluso, perché nella tua borsa c'è
            poco da prendere. Per dispetto una spinta ti manda con la spalla contro
            il masso.
          effetti: { ferite: 0.5 }

      - testo: "Stringere la borsa e allungare il passo"
        descrizione: "Con una mano sulla borsa e l'altra sull'arma esci dal passaggio, e perdi solo tempo."
        esito:
          titolo: Il passaggio stretto
          testo: |
            Esci dal passaggio di traverso, con la schiena contro la roccia e la
            borsa stretta nel pugno, come un granchio molto sospettoso. Il passo ti
            segue svogliato per un tratto, e alle terrazze arrivi con la borsa
            intatta.

  - id: carta-sup3-ladro-scoperto
    immagine: icone/invisible-face
    titolo: Il ragazzo con il disco
    sommario: "Il ladro che non si vede ha un polso magro, un disco dei Precursori sul petto e fretta di andarsene."
    luogo: Superficie Fratturata, un passaggio stretto fra i massi
    tipo: seguito
    area: superficie-fratturata
    testo: |
      Il polso che stringi si torce, e a ogni strattone l'aria si sfalda
      finché hai davanti un ragazzo magro con le guance rosse di fatica. Sul
      petto, legato con due cinghie, porta un disco dei Precursori grande come
      un piattino che manda lampi storti.

      «Va bene, capo, mi hai preso» dice, con una cipolla mezza mangiata nella
      mano libera. «Mollami il polso, che se mi tieni così mi si spegne del
      tutto.» Con il piede intanto cerca un appoggio per scattare.

      {rissa Facile} Il peso ce l'ha tutto sulla gamba sinistra, e la caviglia
      è a portata di stivale.
    opzioni:
      - testo: "Non mollarlo"
        descrizione: "Appena si libera sparisce di nuovo, quindi bisogna colpire dove l'aria non torna."
        combattimento: ladro-invisibile
        vittoria:
          titolo: Il disco incrinato
          testo: |
            Lo colpisci quando l'aria tremola, e alla terza volta il ragazzo finisce
            seduto sulla ghiaia con il disco che sfrigola e si spegne. Gli togli il
            disco e le monete di gente meno svelta di te, e quando gli fai segno di
            sparire lo fa a piedi e ben visibile.
          effetti: { reperto.sigillato: 1, monete: 4 }
        sconfitta:
          titolo: La risatina
          testo: |
            Si libera con uno strattone e ritorna aria. Ti arrivano gomitate e ginocchiate
            da dove non te le aspetti, mentre tu colpisci con impegno dei punti vuoti,
            finché ti ritrovi a terra con un ginocchio sbucciato e la sua risatina che si
            allontana.

      - testo: "Lasciarlo andare in cambio di quello che sa"
        descrizione: "Un ladro che gira per la Superficie sa chi passa e dove, e il disco può tenerselo."
        costo: 0
        esito:
          titolo: Quello che sa un ladro
          testo: |
            Gli lasci il polso, e lui ti dice quale carovana viaggia con le casse
            vuote per ingannare i predoni e quale squadra di Raschiatori nasconde
            il grezzo sotto il carro. Poi se ne va a piedi, con il disco spento e
            la cipolla in mano.
          effetti: { informazioni.pettegolezzo: 1, informazioni.voce: 1 }
      - testo: "Dirgli che il disco gli sta cuocendo il petto"
        descrizione: "Il disco ronza e manda lampi storti, e lui non sa che tu non ne capisci più di lui."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Le cinghie slacciate
          testo: |
            Guardi il disco con una smorfia e gli chiedi da quanto tempo gli fa
            male il petto, poi gli racconti di due Raschiatori che si sono portati
            addosso un reperto acceso per una settimana e di come sono finiti. Lui
            si slaccia le cinghie con dita che non gli obbediscono, ti mette il
            disco in mano e se ne va giù per il sentiero toccandosi lo sterno.
          pe: { ingannare: 6 }
          effetti: { reperto.sigillato: 1 }
        fallimento:
          titolo: Lo so, capo
          testo: |
            Gli dici che il disco gli sta cuocendo il petto, e lui ride con la bocca
            piena di cipolla. «Lo so, capo, scotta da tre giorni» dice, e approfitta
            della tua sorpresa per liberarsi e tornare aria.
          effetti: { ferite: 0.5 }


  # ================================================================ 47 · Voce nell'equipaggiamento
  - id: carta-sup3-la-voce
    immagine: icone/sound-waves
    titolo: La voce nel metallo
    sommario: "Una delle cose di metallo che porti addosso, mentre cammini, si mette a parlare."
    luogo: Superficie Fratturata, una cresta battuta dal vento
    tipo: carta
    area: superficie-fratturata
    requisiti: [sup3.voce == 0]
    testo: |
      Su una cresta battuta dal vento qualcosa di metallo che porti addosso
      manda un suono breve. Sembra la voce calma di una donna in fondo a un
      pozzo, e delle parole ti arriva solo il tono paziente di una maestra che
      spiega per la seconda volta. Quando ti fermi torna tutto zitto, e
      riparti camminando piano per non coprirla.

      {origine allievo-di-torvessa} Temmerin raramente risponde due volte alla
      stessa domanda, e ti accorgi di ascoltare questa voce con la schiena
      dritta, come in aula.

      {magia Media} Il Mana non parla così, e questa voce ha la regolarità di
      una cosa costruita.
    opzioni:
      - testo: "Cercare da dove viene"
        descrizione: "Una voce che esce dal metallo ha una ragione, da trovare prima che la testa ne inventi una."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: La polvere azzurra
          testo: |
            Fai e rifai la cresta, e la voce torna soltanto accanto alla crepa,
            dalla parte del bagliore. Il metallo che porti è tiepido da quel lato, e
            con il pollice ne viene via una polvere azzurra sottile come polline,
            che raccogli in un fazzoletto prima che la voce taccia per sempre.
          pe: { tecnologia: 10 }
          imposta: { sup3.voce: 99 }
          effetti: { reliquie.scheggia: 1 }
        fallimento:
          titolo: Un'ora sulla cresta
          testo: |
            Passi un'ora seduto in mezzo alla cresta a smontarti di dosso tutto il
            metallo, come un ambulante al mercato, e la voce non torna. Dopo un
            tratto, appena hai smesso di pensarci, dice una frase intera.
          effetti: { sup3.voce: 1, tormento: 1 }

      - testo: "Ascoltare finché non capisci le parole"
        descrizione: "Ti siedi sulla cresta e aspetti, finché la voce dirà qualcosa che si capisce."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Il conto
          testo: |
            Resti seduto finché la voce torna, e questa volta la capisci. Conta
            lentamente fino a un certo numero e ricomincia, e al terzo giro sai dove
            si ferma, e la voce tace come se avesse finito il suo lavoro.
          pe: { resilienza: 10 }
          imposta: { sup3.voce: 99 }
          effetti: { informazioni.pettegolezzo: 1, tormento: 1 }
        fallimento:
          titolo: Il numero
          testo: |
            La voce torna e conta, e tu conti con lei, finché ti accorgi che sei tu
            a contare a voce alta, da solo sulla cresta. Per tutta la sera, ogni
            volta che qualcosa tintinna, ti scopri a contare sottovoce.
          effetti: { sup3.voce: 1, tormento: 1.5 }

      - testo: "Fare finta di niente"
        descrizione: "Sarà stato il vento in una fibbia, e sulla Superficie succedono cose più strane."
        costo: 0
        esito:
          titolo: Il vento in una fibbia
          testo: |
            Ti dici che è stato il vento in una fibbia e riprendi a camminare, un
            po' più svelto del solito.
          effetti: { sup3.voce: 1 }

  - id: carta-sup3-la-voce-torna
    immagine: icone/echo-ripples
    titolo: La voce, di nuovo
    sommario: "La voce nel metallo è tornata, e questa volta non viene dallo stesso posto."
    luogo: Superficie Fratturata, sul bordo di una terrazza
    tipo: carta
    area: superficie-fratturata
    requisiti: [sup3.voce >= 1, sup3.voce < 99]
    testo: |
      Questa volta la voce arriva mentre mangi seduto sul bordo di una
      terrazza, e viene dalle monete, mentre l'ultima volta veniva dalla lama.
      È più vicina, con lo stesso tono paziente, e ti sembra di riconoscere
      qualche sillaba. La notte scorsa hai messo tutto il metallo in un
      mucchio lontano dalla coperta, e la voce ha parlato dal mucchio finché
      non ti sei addormentato.

      {espressivita Difficile} Le sillabe hanno il passo delle filastrocche
      che i maestri fanno ripetere in coro, perché chi parla vuole che
      qualcuno impari.
    opzioni:
      - testo: "Cercare da dove viene"
        descrizione: "Ormai la conosci un po', e seguendola con metodo forse capisci che cosa la fa parlare."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: La polvere azzurra
          testo: |
            Sposti le monete lontano dalla crepa e poi vicino, e capisci che
            parlano solo dalla parte del bagliore. Con il pollice ne viene via una
            polvere azzurra sottile come polline, che raccogli in un fazzoletto, e
            quando hai ripulito tutto il metallo la voce tace.
          pe: { tecnologia: 10 }
          imposta: { sup3.voce: 99 }
          effetti: { reliquie.scheggia: 1 }
        fallimento:
          titolo: La moneta che manca
          testo: |
            Ripulisci tutto quello che porti con la cura di un orafo, ma la voce
            torna da una moneta che non ricordi di avere, con un conio che non
            conosci, e la tieni perché buttarla ti sembra peggio.
          effetti: { sup3.voce: 1, tormento: 1 }

      - testo: "Ascoltare finché non capisci le parole"
        descrizione: "Le sillabe ormai si sentono, e ancora un poco forse si capisce che cosa dice."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Il conto
          testo: |
            Ti siedi con le monete nel palmo e lasci che la voce conti,
            lentamente, fino a un certo numero e poi da capo. Al terzo giro hai
            capito dove si ferma, e la voce tace per sempre.
          pe: { resilienza: 10 }
          imposta: { sup3.voce: 99 }
          effetti: { informazioni.pettegolezzo: 1, tormento: 1 }
        fallimento:
          titolo: Le sillabe
          testo: |
            Più ascolti e meno capisci, e a un certo punto ti sembra che la voce
            dica il tuo nome, poi un nome qualunque, e il secondo ti spaventa di
            più. Smetti quando è buio e il pane ti è caduto di mano chissà quando.
          effetti: { sup3.voce: 1, tormento: 1.5 }

      - testo: "Fare finta di niente, ancora"
        descrizione: "Hai già fatto finta di niente, e ha funzionato fino a oggi."
        costo: 0
        esito:
          titolo: Il pane secco
          testo: |
            Rimetti le monete nella borsa, stringi il laccio due volte e finisci il
            pane senza sentirne il sapore. Per tutto il pomeriggio cammini con la
            mano sulla borsa, senza sapere se per tenerla chiusa o per sentire se
            si muove.
          effetti: { sup3.voce: 1, tormento: 1 }

      - testo: "Gettare via il metallo"
        descrizione: "Buttare in una crepa tutto quello che parla sembra una buona idea, ma le monete sono monete."
        quando: [sup3.voce >= 3, monete >= 4]
        esito:
          titolo: Nella crepa
          testo: |
            Svuoti nella prima crepa le monete e le fibbie, e ascolti il tintinnio
            scendere nel bagliore finché la voce tace. Ti tiri su i pantaloni, che
            senza fibbia scendono, e per qualche giorno ti senti più leggero.
          imposta: { sup3.voce: 99 }
          effetti: { monete: -4, tormento: -0.5 }

  # ================================================================ 48 · Maschera attiva
  - id: carta-sup3-la-maschera
    immagine: icone/ceremonial-mask
    titolo: La maschera nella polvere
    sommario: "In una nicchia di basalto c'è una maschera di metallo intatta, con un riflesso che si muove troppo."
    luogo: Superficie Fratturata, una nicchia nel basalto
    tipo: carta
    area: superficie-fratturata
    requisiti: [sup3.maschera == 0]
    testo: |
      In una nicchia nel fianco di un gradone, mezza sepolta nella polvere,
      c'è una maschera di un metallo grigio con riflessi che girano come
      l'olio sull'acqua. Ha due fori per gli occhi e niente bocca, e intorno
      qualcuno ha disposto un cerchio di sassolini bianchi. Se ti avvicini, il
      riflesso scivola più del tuo passo.

      {origine accolito-del-velo} Il cerchio ha l'ordine di un altare, e in
      Cattedrale ti hanno insegnato a non chiedere cosa c'è sotto.

      {magia Difficile} Dentro il metallo un filo di Mana gira su se stesso,
      in attesa di un viso da cui guardare fuori.
    opzioni:
      - testo: "Indossarla"
        descrizione: "Sembra fatta per il tuo viso, ma quello che si vede da dentro lo paga la testa."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Le crepe come fiumi
          testo: |
            La maschera ti si appoggia sul viso fredda e leggera, e attraverso i
            fori le crepe diventano fiumi di luce sotto la terra, così che per un
            poco sai dove il terreno è vuoto e dove regge. Poi il metallo si scalda
            e te la togli, e nella nicchia la maschera è diventata opaca.
          pe: { percezione: 10, natura: 5 }
          imposta: { sup3.maschera: 1 }
          effetti: { tormento: 1 }
        fallimento:
          titolo: La presa
          testo: |
            Vedi le crepe accendersi sotto la terra come fiumi, e quando provi a
            toglierla la maschera non viene via. Si stacca da sola dopo un tempo
            che non sai misurare, e ti ritrovi in ginocchio con il sangue dal naso
            e la maschera opaca fra le mani.
          pe: { percezione: 10 }
          imposta: { sup3.maschera: 1 }
          effetti: { tormento: 1.5, contaminazione: 1 }

      - testo: "Studiarla senza toccarla"
        descrizione: "Con un bastoncino la si può girare e guardare i segni lasciati da chi l'ha fatta."
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: Il lavoro di un fabbro
          testo: |
            La giri con un bastoncino, tenendo il viso di lato. Sul bordo una fila
            di segni copia la scrittura dei Precursori senza capirla, e sulla fronte
            pulsa ancora una scheggia di cristallo. L'ha battuta un fabbro che
            sapeva lavorare il lyssan e che forse le Maschere dei racconti le aveva
            viste da vicino.
          pe: { accademiche: 10 }
          imposta: { sup3.maschera: 1 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: I fori degli occhi
          testo: |
            Ti chini a guardarla e resti a fissare i fori degli occhi più a lungo di
            quanto vorresti, perché dentro ti sembra di vedere un cielo di un colore
            che non sapresti nominare. Quando ti rialzi il sole è sceso di
            parecchio.
          imposta: { sup3.maschera: 1 }
          effetti: { tormento: 1 }

      - testo: "Coprirla di polvere e andare"
        descrizione: "Chi l'ha messa lì, con i sassolini intorno, voleva che restasse lì."
        costo: 0
        esito:
          titolo: La polvere
          testo: |
            Con il piede spingi la polvere sopra la maschera finché il riflesso
            sparisce, e lasci i sassolini dove sono. Sul gradone di sopra ti accorgi
            che cammini con il viso girato dall'altra parte, come per non farti
            riconoscere.
          imposta: { sup3.maschera: 1 }
