# La Superficie Fratturata: i reperti e il banco di Oda Krell (strato 3 dell'economia in forma ridotta, ottobre 2026).
# Il progetto completo è in docs/progetto-reperti.md; qui il banco sta nella baracca di Oda (baracca-di-oda), non in
# cantina. Le quality delle parti e del banco sono dichiarate in area.yaml; qui c'è solo la flag oda.conosciuta.
#
# IL GIRO
#   Battere le terrazze (terrazze-di-basalto) e le carte della Superficie danno reperto.sigillato.
#   Oda apre il reperto (sigillato -1) e tu scegli quale parte cercare. Prova riuscita, parte di grado 2; fallita,
#   parte di grado 1 e un danno (ferite, contaminazione o tormento 0.5). Oppure lo apre lei con calma (2 rintocchi
#   e qualche moneta) e ne escono una carcassa incrinata e un frammento inciso.
#   Le parti si montano sul banco una per famiglia (storylet aperto finché banco.<famiglia> == 0), con una prova di
#   Mentale + Tecnologia Facile, Media o Difficile per il grado 1, 2 o 3. Se fallisce la parte si rovina e
#   banco.stranezza sale di 1. Con quattro parti (banco.parti >= 4) il congegno si vende, e ogni vendita azzera il
#   banco. Smontare azzera il banco e rende tre schegge.
#
# PARTI E PUNTEGGI (g = grado montato)
#   involucro    stabilita +2g; al grado 3 anche stranezza +1. Un reliquie.meccanismo-spento si monta come involucro 1.
#   camera       potenza +2g; al grado 3 anche stranezza +1
#   impugnatura  potenza +g e stabilita +g
#   nucleo       stranezza +2g
# COPPIE CHE SI DISTURBANO (varianti delle opzioni con `quando` sulla parte già montata, nei due ordini)
#   camera 3 con involucro 1 (anche il meccanismo spento)   stabilita -2 in più
#   nucleo 3 con impugnatura 2                               stranezza +2 e stabilita -2 in più
#   Massimi senza fallimenti: stabilita 9 e potenza 9 (involucro, camera e impugnatura rari), stranezza 8.
#
# COMPRATORI (uno storylet ripetibile ciascuno, requisiti [banco.parti >= 4]; le fasce sono opzioni con requisiti
# sui punteggi, così il giocatore vede chiuse quelle che non raggiunge)
#   Orvald Temmerin (Accademia)        stab >= 4 e pot >= 4   monete 50, rep.accademia 0.5
#                                      stab >= 6 e pot >= 6   monete 100, rep.accademia 1, PE tecnologia 10
#                                      stab >= 8 e pot >= 8   monete 180, rep.accademia 1, PE tecnologia 20
#   Confraternita del Velo (Ottilia)   qualunque congegno     monete 20, tormento -1, contaminazione -1
#                                      stranezza >= 5         monete 35, tormento -2, contaminazione -1.5, rep.velo 0.5
#   Mercato delle Ombre (il vecchio    pot >= 4               monete 60, sospetto 0.5
#   Raschiatore dalle dita storte,     pot >= 6               monete 120, sospetto 1
#   lo stesso di informazioni.yaml)    pot >= 8               monete 220, sospetto 1
#   Dragna al Grifone                  nessun requisito       una camera rara oppure un nucleo raro, rep.raschiatori 0.5
#   Il Mercante della Memoria          in un altro file, di un altro autore
#
# RIPARAZIONE: Oda ripara ogni reperto guasto (guasto.<id>, creata dal build per ogni oggetto con `reperto`) con una
# parte comune e qualche moneta. BOTTEGA: banco-di-oda, in fondo al file (sigillati e parti a circa metà del valore).
#
# Oda Krell: chiude le frasi con «dico bene?» senza aspettare la risposta, non dice mai «Precursori» (sono «quelli di
# prima»), bussa con le nocche sulla gamba di legno, intagliata con una fila di lepri che corrono verso il piede.
# Fuma la stufa anche d'estate e beve cicoria bruciata. Niente grandi famiglie né segreti del Codex nella sua storia.
quality:
  - { id: oda.conosciuta, nome: "Conosci Oda Krell", categoria: stato, nascosta: true, descrizione: "1 dopo il primo incontro con Oda Krell nella sua baracca sulle terrazze." }

storylet:
  # ================================================================ 1 · l'incontro con Oda (tabella, 40 Eremita isolato)
  - id: oda-incontro
    presso: baracca-di-oda
    immagine: ambientazione/orlo-dei-rottami
    titolo: Una vecchia sulla soglia
    sommario: "In una piega delle terrazze fuma un comignolo, e sulla soglia di una baracca di ferrivecchi siede una vecchia."
    luogo: "Superficie Fratturata, la baracca di Oda Krell"
    area: superficie-fratturata
    requisiti: [oda.conosciuta == 0]
    testo: |
      Il fumo lo vedi prima della baracca, un filo grigio che sale diritto da
      una piega delle terrazze. Poi compaiono le lamiere lisce dei
      Precursori, inchiodate su travi di carro, e una porta di nave con
      l'oblò ancora al suo posto. Davanti alla porta, su uno sgabello, una
      donna anziana con una coperta sulle ginocchia guarda la pianura.

      Si gira con calma e ti squadra dal basso. Da sotto la coperta spunta
      una gamba di legno intagliata con molta più cura della baracca, una
      fila di lepri che corrono verso il piede. «Da queste parti non passa
      quasi nessuno» dice. «Chi passa ha fretta, e chi si ferma vuole
      qualcosa, dico bene?» Bussa due volte sulla gamba con le nocche. «Oda
      Krell. Ho raschiato per trent'anni, e adesso apro le cose che quelli di
      prima hanno chiuso, e le rimonto finché non fanno qualcosa.»

      {empatia Media} Quel *dico bene* le serve per tenersi compagnia, e la
      risposta non la aspetta.

      {origine apprendista-raschiatore} Trent'anni di piattaforme si vedono
      nei calli lucidi dove passa la corda, e lei ha guardato le tue mani
      prima della tua faccia.

      Dalla porta esce il caldo di una stufa accesa in pieno giorno, e Oda ti
      indica un secondo sgabello con il mento.
    opzioni:
      - testo: "Sederti e chiederle della strada"
        descrizione: "Oda conosce le terrazze sasso per sasso, e da molto tempo nessuno le chiede niente."
        esito:
          titolo: Le frecce girate
          testo: |
            Su uno sgabello che traballa, fatto per un'altra gamba, ascolti Oda
            parlare per un'ora buona con gli occhi sulla pianura. Ti dice quali
            frecce bianche sono state girate per scherzo, e che sul pianoro di
            ghiaia a ovest si è accampata una banda di predoni che la sera brucia
            lo sterco dei muli. «E chi brucia lo sterco ha fame, dico bene?»
          effetti: { informazioni.pettegolezzo: 1 }
          imposta: { oda.conosciuta: 1 }

      - testo: "Chiederle delle crepe"
        descrizione: "Una Raschiatrice vecchia legge la terra intorno alle crepe meglio di un maestro dell'Accademia."
        esito:
          titolo: Il lichene arancione
          testo: |
            Oda ti porta al bordo della piega, dove si apre una crepa, e ti mostra
            il lichene arancione che cresce dove la Marea Grigia sale spesso. «Se
            l'erba si piega verso la crepa, la crepa tira il fiato, e tu cammini
            dall'altra parte, dico bene?»

            {origine figlio-del-circolo} Al Circolo l'erba la guardavi per sapere
            dove passano le bestie, e Oda la guarda per la Marea.
          pe: { natura: 10 }
          imposta: { oda.conosciuta: 1 }

      - testo: "Spaccarle la legna"
        descrizione: "Accanto alla porta c'è una catasta di travi di carro da fare a pezzi, e Oda continua a guardarla."
        esito:
          titolo: Il regalo
          testo: |
            Fai a pezzi le travi con l'ascia di Oda e le impili sotto la tettoia
            dove lei ti dice, e poi le sposta lo stesso. Alla fine ti mette in
            mano un guscio di metallo grande come un pugno, chiuso su tutti i
            lati, che non ha mai aperto. «Portamelo quando vuoi e lo apriamo
            insieme, così torni, dico bene?»
          effetti: { reperto.sigillato: 1 }
          imposta: { oda.conosciuta: 1 }

      - testo: "Restare in piedi e chiedere i prezzi"
        descrizione: "Sei venuto per i reperti, e la conversazione si può fare un'altra volta."
        costo: 0
        esito:
          titolo: La porta di nave
          testo: |
            Oda ti ascolta fino in fondo, poi si stringe la coperta sulle
            ginocchia e torna a guardare la pianura. «I prezzi dipendono da quello
            che porti» dice, con la voce raffreddata di qualche grado. «Porta
            qualcosa, e ne parliamo.»

            {galateo Media} Ti ha offerto uno sgabello e tu l'hai trattata come
            una bancarella.
          imposta: { oda.conosciuta: 1 }

  # ================================================================ 2 · aprire un reperto sigillato
  - id: oda-aprire-reperto
    presso: baracca-di-oda
    immagine: icone/unlocking
    titolo: Il guscio sul banco
    sommario: "Oda apre i reperti sigillati sul suo banco e lascia a te la scelta di dove infilare la lama."
    luogo: "Superficie Fratturata, il banco di Oda Krell"
    area: superficie-fratturata
    ripetibile: true
    requisiti: [oda.conosciuta >= 1, reperto.sigillato >= 1]
    testo: |
      Oda stende sul banco un panno di lana rammendato, ci posa il reperto
      con la giuntura in alto e ti passa una lama piatta da vetraio dalla
      parte del manico. «Dentro di solito ci sono quattro cose, e intere non
      escono mai tutte» dice. «Se ne cerchi una, le altre vanno in briciole,
      dico bene?» Poi si siede accanto alla stufa con le mani aperte verso il
      fuoco.

      {magia Media} La giuntura è tiepida, perché dentro un filo di Mana gira
      ancora in tondo senza più niente da far girare.
    opzioni:
      - testo: "Cercare l'involucro"
        descrizione: "Il guscio esterno viene via intero soltanto a forza di braccia, e quando cede scatta come una tagliola."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il guscio intero
          testo: |
            Fai leva con tutto il peso finché il guscio si apre in due metà
            pulite. Dentro il resto è poltiglia, ma le metà combaciano ancora, e
            Oda le batte una contro l'altra come le pentole al mercato. «Metallo
            scuro, di quello buono» dice.
          effetti: { reperto.sigillato: -1, parte.involucro-2: 1 }
        fallimento:
          titolo: La tagliola
          testo: |
            Il guscio cede di colpo e si richiude sulle tue dita, e ti scappa una
            bestemmia del porto. Oda ti libera con un colpo di lama, ma il guscio
            si è incrinato da parte a parte. «Regge ancora, se non lo scuoti»
            dice, e ti passa uno straccio bagnato per le dita.
          effetti: { reperto.sigillato: -1, parte.involucro-1: 1, ferite: 0.5 }

      - testo: "Cercare la camera"
        descrizione: "La camera di cristallo sta al centro di una rete di fili sottili, e bisogna vedere dove tagliare."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La camera a vene
          testo: |
            Segui i fili con la punta della lama finché trovi quelli che portano
            alla camera, e la camera esce intera, un cilindro di cristallo grande
            come un pollice attraversato da vene di luce. Oda la guarda a lungo
            contro la finestra prima di rendertela.
          effetti: { reperto.sigillato: -1, parte.camera-2: 1 }
        fallimento:
          titolo: Il filo sbagliato
          testo: |
            Tagli il filo sbagliato, e dalla crepa nel cristallo esce una nebbia
            grigia che ti fa tossire a lungo mentre Oda apre la porta. La camera
            viene fuori opaca come il vetro di una stalla. «A saperla prendere,
            qualcosa fa ancora» dice Oda.
          effetti: { reperto.sigillato: -1, parte.camera-1: 1, contaminazione: 1 }

      - testo: "Cercare l'impugnatura"
        descrizione: "L'impugnatura è incastrata di traverso, e si sfila soltanto con le dita giuste nel momento giusto."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Una mano che non c'è più
          testo: |
            Senti l'impugnatura muoversi a scatti, con un ticchettio che segue un
            ritmo suo, e al terzo giro la sfili tutta d'un pezzo. È una presa di
            metallo per una mano più lunga della tua e con un dito in meno, e
            quando Oda ci appoggia la sua anche a lei i conti non tornano.
          effetti: { reperto.sigillato: -1, parte.impugnatura-2: 1 }
        fallimento:
          titolo: Il morso
          testo: |
            L'impugnatura scatta mentre hai ancora le dita nella fessura e ti
            morde il palmo, e il sangue cola sul panno di Oda, che lo guarda con
            disapprovazione. Riesci a tirare fuori mezzo manico, già rifatto da
            qualcuno con un pezzo di legno e due chiodi.
          effetti: { reperto.sigillato: -1, parte.impugnatura-1: 1, ferite: 0.5 }

      - testo: "Cercare il nucleo"
        descrizione: "Il nucleo sta in fondo a tutto e quando lo tocchi comincia a parlarti, quindi serve la testa a posto."
        prova: { attributo: mentale, abilita: [resilienza, magia], difficolta: Media }
        successo:
          titolo: La voce a metà
          testo: |
            In fondo al guscio c'è il nucleo, una pietra liscia grande come un uovo
            di quaglia, e appena la tocchi una voce comincia una frase che non arriva
            mai alla fine. Conti a mezza voce con gli occhi sulle mani finché è
            fuori, e Oda lo avvolge in uno straccio senza toccarlo.

            {resilienza Media} Sei arrivato a undici, e la voce non si è mai messa in
            mezzo.
          effetti: { reperto.sigillato: -1, parte.nucleo-2: 1 }
        fallimento:
          titolo: La stanza bianca
          testo: |
            Appena tocchi il nucleo la voce ti entra in testa, e per un momento sei in una
            stanza bianca senza porte, con la luce che viene dal pavimento. Torni con il
            nucleo in mano e Oda che ti scuote per una spalla, e la pietra si è fatta
            opaca.
          effetti: { reperto.sigillato: -1, parte.nucleo-1: 1, tormento: 1 }

      - testo: "Lasciarlo aprire a Oda"
        descrizione: "La via sicura di Oda costa un pomeriggio e qualche moneta, e rende poco."
        costo: 2
        requisiti: [monete >= 3]
        esito:
          titolo: Un pomeriggio alla stufa
          testo: |
            Oda lavora piano, con gli occhiali sulla punta del naso, raccontandoti
            di una squadra di Raschiatori che si perse per tre giorni a cento
            passi dall'uscita perché nessuno voleva ammettere di aver sbagliato
            strada. Verso sera sul panno ci sono una carcassa incrinata e un
            frammento inciso. «Poco, però sicuro» dice, intascando le monete.
          effetti: { reperto.sigillato: -1, monete: -3, parte.involucro-1: 1, reliquie.frammento-inciso: 1 }

  # ================================================================ 3 · montare il congegno: l'involucro
  - id: oda-montare-involucro
    presso: baracca-di-oda
    immagine: icone/cube
    titolo: Il guscio del congegno
    sommario: "Ogni congegno di Oda comincia da un involucro che tenga insieme il resto."
    luogo: "Superficie Fratturata, il banco di Oda Krell"
    area: superficie-fratturata
    ripetibile: true
    requisiti: [oda.conosciuta >= 1, banco.involucro == 0]
    testo: |
      In fondo al banco, sotto la finestra, Oda tiene un telo di cuoio e una
      morsa di legno, l'unico angolo della baracca senza polvere, ed è lì che
      nascono i congegni, cominciando dall'involucro. Ti passa un cacciavite
      con il manico d'osso e resta a guardarti da sopra la spalla, con
      l'alito che sa di cicoria bruciata. «Le viti di quelli di prima girano
      al contrario, e tutti se ne scordano la prima volta, dico bene?»

      {politica-ed-economia Media} All'Accademia comprano i congegni che
      reggono, e a reggere è soprattutto il guscio.
    opzioni:
      - testo: "Montare la carcassa incrinata"
        descrizione: "Un involucro comune, che si chiude senza fatica e regge finché non lo scuoti."
        quando: [parte.involucro-1 >= 1, banco.camera != 3]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Facile }
        successo:
          titolo: La carcassa chiusa
          testo: |
            Le viti girano al contrario, come ha detto Oda, e alla terza la mano
            smette di sbagliare verso. Sul telo la crepa sul fianco della carcassa si
            allarga appena e poi si ferma. «Regge» dice Oda, toccandola con un dito
            come si tocca un cane che morde.
          effetti: { parte.involucro-1: -1, banco.involucro: 1, banco.parti: 1, banco.stabilita: 2 }
        fallimento: &oda-fall-involucro-1
          titolo: La crepa
          testo: |
            Giri una vite nel verso giusto, che è quello sbagliato, e la crepa
            corre fino all'altro lato con un rumore di ghiaccio. Oda butta i pezzi
            nella cassa dei rottami.

            {magia Facile} Un po' di Mana è rimasto sul banco dove la crepa si è
            aperta, e da allora in quel punto il legno pizzica le dita.
          effetti: { parte.involucro-1: -1, banco.stranezza: 1 }

      - testo: "Montare la carcassa incrinata"
        descrizione: "La camera che pulsa dovrà stare in una carcassa incrinata, e Oda scuote la testa."
        quando: [parte.involucro-1 >= 1, banco.camera == 3]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Facile }
        successo:
          titolo: La crepa che batte
          testo: |
            A ogni battito della camera la crepa della carcassa si apre e si
            richiude come una bocca. Oda ci passa sopra un filo di rame a più
            giri. «Tiene insieme le parti, e basta» dice, e quando il congegno
            comincia a camminare verso il bordo ci mette sopra un sasso.
          effetti: { parte.involucro-1: -1, banco.involucro: 1, banco.parti: 1 }
        fallimento: *oda-fall-involucro-1

      - testo: "Montare il guscio di metallo scuro"
        descrizione: "Un involucro buono e pesante, con tante viti piccole."
        quando: [parte.involucro-2 >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il metallo scuro
          testo: |
            Ci vuole un'ora, una vite alla volta, con Oda che ti tiene ferma la
            lampada. L'ultima vite chiude il guscio con un suono pieno, da porta di
            cantina, e quando lo lasci cadere sul telo dentro niente si muove. Oda
            torna alla stufa bussando due volte sulla gamba di legno.
          effetti: { parte.involucro-2: -1, banco.involucro: 2, banco.parti: 1, banco.stabilita: 4 }
        fallimento:
          titolo: La vite spanata
          testo: |
            All'ultima vite il cacciavite scivola e la testa si spana. La forzi
            con la stizza nelle braccia, e il guscio si deforma quel tanto che
            basta perché le metà smettano di combaciare. Oda lo guarda di taglio
            contro la luce e lo mette nella cassa dei rottami senza commentare.
          effetti: { parte.involucro-2: -1, banco.stranezza: 1 }

      - testo: "Montare la cassa sigillata"
        descrizione: "Un involucro raro che si chiude da solo, e il difficile è convincerlo ad aprirsi."
        quando: [parte.involucro-3 >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La cassa che si chiude
          testo: |
            Dopo un pomeriggio di tentativi trovi il punto dove premere, e la
            cassa si apre come un fiore e si richiude da sola con un sospiro
            d'aria. «Quando ci metterai dentro il resto, si chiuderà su quello e
            non vorrà più lasciarlo andare» dice Oda.

            {empatia Difficile} Lo dice della cassa, e intanto guarda la mensola
            dei reperti che nessuno è più venuto a riprendere.
          effetti: { parte.involucro-3: -1, banco.involucro: 3, banco.parti: 1, banco.stabilita: 6, banco.stranezza: 1 }
        fallimento:
          titolo: Il sospiro
          testo: |
            Premi nel punto sbagliato e la cassa si chiude di scatto sulla punta
            del cacciavite, resistendo poi alla lama e alle preghiere di Oda, che
            somigliano molto a insulti. La sera Oda la mette fuori dalla porta,
            con il coperchio rivolto verso la pianura.
          effetti: { parte.involucro-3: -1, banco.stranezza: 1 }

      - testo: "Montare un meccanismo spento come involucro"
        descrizione: "Un meccanismo che in città hanno rimontato intero senza farlo andare, e che svuotato fa da carcassa comune."
        quando: [reliquie.meccanismo-spento >= 1, banco.camera != 3]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Facile }
        successo:
          titolo: Il meccanismo svuotato
          testo: |
            Oda ti aiuta a togliere gli ingranaggi che qualcuno in città ha
            rimesso a posto con tanta pazienza, e li allinea su uno straccio in
            ordine di grandezza. «In città li rimontano per venderli» dice, «e noi
            li smontiamo per farli andare.» Il guscio vuoto si chiude sul telo, e
            regge.
          effetti: { reliquie.meccanismo-spento: -1, banco.involucro: 1, banco.parti: 1, banco.stabilita: 2 }
        fallimento: &oda-fall-meccanismo
          titolo: L'ultimo ingranaggio
          testo: |
            All'ultimo ingranaggio il meccanismo si chiude su se stesso con uno
            scatto, e ritiri le dita appena in tempo. Resta un pezzo di metallo
            storto, che ogni tanto fa girare da solo l'unico ingranaggio rimasto.
          effetti: { reliquie.meccanismo-spento: -1, banco.stranezza: 1 }

      - testo: "Montare un meccanismo spento come involucro"
        descrizione: "La camera che pulsa è già sul banco, e un meccanismo svuotato è un guscio troppo sottile per lei."
        quando: [reliquie.meccanismo-spento >= 1, banco.camera == 3]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Facile }
        successo:
          titolo: Il guscio che trema
          testo: |
            Chiudi il meccanismo svuotato intorno alla camera, e a ogni battito
            del cristallo il guscio si gonfia e le viti si allentano di mezzo
            giro. Oda ci lega intorno un filo di rame con un nodo da Raschiatrice.
            «Starà insieme» dice, senza crederci molto.
          effetti: { reliquie.meccanismo-spento: -1, banco.involucro: 1, banco.parti: 1 }
        fallimento: *oda-fall-meccanismo

      - testo: "Chiedere a Oda che cosa ci vuole"
        descrizione: "Senza un involucro il banco resta vuoto, e Oda sa dove trovarne uno."
        quando: [parte.involucro-1 == 0, parte.involucro-2 == 0, parte.involucro-3 == 0, reliquie.meccanismo-spento == 0]
        costo: 0
        esito:
          titolo: Un guscio, prima di tutto
          testo: |
            Oda ti guarda le mani vuote. «Un involucro esce dai reperti sigillati,
            se lo cerchi con le braccia, oppure va bene uno di quei meccanismi
            spenti che rimontano in città. Senza un guscio il resto cade per
            terra, dico bene?»

  # ================================================================ 3 · montare il congegno: la camera
  - id: oda-montare-camera
    presso: baracca-di-oda
    immagine: icone/crystal-bars
    titolo: La camera di cristallo
    sommario: "La camera è il cuore del congegno, quella che gli dà la forza di fare qualcosa."
    luogo: "Superficie Fratturata, il banco di Oda Krell"
    area: superficie-fratturata
    ripetibile: true
    requisiti: [oda.conosciuta >= 1, banco.camera == 0]
    testo: |
      Oda tiene le camere di cristallo lontano dalla stufa, in una scatola
      da scarpe con il nome del calzolaio sul coperchio, e le tira fuori con
      due dita come si prendono le uova. «Il guscio tiene insieme il
      congegno, e la camera lo fa andare» dice. «Quanto più è viva, tanto
      più spinge.»

      {armi-da-distanza Media} Una cosa che spinge, chiusa in un tubo, si
      chiama in un altro modo, e infatti Oda la parola non la dice.
    opzioni:
      - testo: "Montare la camera spenta"
        descrizione: "Una camera comune e opaca, che si monta senza fatica e spinge poco."
        quando: [parte.camera-1 >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Facile }
        successo:
          titolo: Un poco di calore
          testo: |
            Colleghi i fili con la pinza, uno alla volta, finché il cristallo si
            fa appena lattiginoso e il congegno comincia a scaldarsi quanto basta
            per tenerci sopra le mani in una mattina fredda. Oda ci tiene sopra le
            sue davvero, e sospira come davanti a un piatto di minestra.
          effetti: { parte.camera-1: -1, banco.camera: 1, banco.parti: 1, banco.potenza: 2 }
        fallimento:
          titolo: Il vetro rotto
          testo: |
            La camera ti scivola dalla pinza unta e batte sullo spigolo del banco,
            incrinandosi con il suono acuto di un bicchiere. Dalla crepa esce un
            poco di luce che corre lungo i fili e si spegne dentro, e da allora il
            congegno, ogni tanto, si scalda per conto suo.
          effetti: { parte.camera-1: -1, banco.stranezza: 1 }

      - testo: "Montare la camera a vene"
        descrizione: "Una camera buona, con le vene di luce, da collegare nell'ordine giusto."
        quando: [parte.camera-2 >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Le vene accese
          testo: |
            Colleghi i fili seguendo le vene, che si accendono una dopo l'altra
            come lampade lungo una strada. All'ultimo il congegno ronza nei denti,
            e lo straccio accanto si sposta da solo di un dito verso la porta.
          effetti: { parte.camera-2: -1, banco.camera: 2, banco.parti: 1, banco.potenza: 4 }
        fallimento:
          titolo: Le vene spente
          testo: |
            Colleghi un filo nella vena sbagliata, e la luce si ritira dentro il
            cristallo come un animale nella tana. La camera resta grigia, e Oda da
            quel giorno la usa come fermacarte sopra una pila di ricevute che non
            ha mai riletto.
          effetti: { parte.camera-2: -1, banco.stranezza: 1 }

      - testo: "Montare la camera che pulsa ancora"
        descrizione: "Una camera rara che batte come un polso, e va tenuta ferma mentre la monti."
        quando: [parte.camera-3 >= 1, banco.involucro != 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il polso
          testo: |
            Tieni la camera nel palmo mentre colleghi i fili, e il battito ti sale
            lungo il braccio fino a confondersi con il tuo. Quando la sede si
            chiude il congegno si mette a pulsare con lei, e la fiamma della
            lampada si abbassa a ogni colpo, tanto che Oda si alza dallo sgabello
            a guardarlo.
          effetti: { parte.camera-3: -1, banco.camera: 3, banco.parti: 1, banco.potenza: 6, banco.stranezza: 1 }
        fallimento: &oda-fall-camera-3
          titolo: Il battito che si ferma
          testo: |
            A metà dei fili la camera ti scotta il palmo e la mano si apre da
            sola. Cade nella sede di traverso e si spegne con un ultimo colpo, e
            da allora nel congegno ogni tanto qualcosa batte una volta sola e si
            ferma.
          effetti: { parte.camera-3: -1, banco.stranezza: 1 }

      - testo: "Montare la camera che pulsa ancora"
        descrizione: "Oda te l'ha detto che la camera che pulsa è troppo forte per la carcassa incrinata."
        quando: [parte.camera-3 >= 1, banco.involucro == 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La carcassa che si apre
          testo: |
            Al primo battito della camera la crepa della carcassa si apre di un
            dito, al secondo si richiude, e il congegno scivola sul telo come una
            cosa viva con un rumore di mascelle. Oda ci stringe intorno una
            cinghia di cuoio e dice che funziona, con poca convinzione nella voce.
          effetti: { parte.camera-3: -1, banco.camera: 3, banco.parti: 1, banco.potenza: 6, banco.stranezza: 1, banco.stabilita: -2 }
        fallimento: *oda-fall-camera-3

      - testo: "Chiedere a Oda che cosa ci vuole"
        descrizione: "Senza una camera il congegno resta fermo, e Oda sa dove trovarne una."
        quando: [parte.camera-1 == 0, parte.camera-2 == 0, parte.camera-3 == 0]
        costo: 0
        esito:
          titolo: Una camera, per spingere
          testo: |
            Oda chiude la scatola di feltro vuota e ci batte sopra le nocche
            come per scusarsi con lei. «Le camere stanno in mezzo ai
            fili, dentro i reperti sigillati» dice. «Cercale con gli occhi,
            perché con le mani si rompono, dico bene?»

  # ================================================================ 3 · montare il congegno: l'impugnatura
  - id: oda-montare-impugnatura
    presso: baracca-di-oda
    immagine: icone/grab
    titolo: La presa
    sommario: "Un congegno senza impugnatura non lo tiene in mano nessuno, e quelli di prima avevano mani diverse dalle nostre."
    luogo: "Superficie Fratturata, il banco di Oda Krell"
    area: superficie-fratturata
    ripetibile: true
    requisiti: [oda.conosciuta >= 1, banco.impugnatura == 0]
    testo: |
      Sopra il banco Oda ha appeso una fila di impugnature smontate, ognuna
      al suo chiodo, e la sera le guarda come altri guardano i ritratti di
      famiglia. Ce n'è una con sei incavi per le dita, e un'altra lunga come
      un avambraccio che non si capisce da che parte vada presa.

      {armi-da-mischia Media} Quella lunga ha tutto il peso in cima, e una
      cosa fatta così serve a colpire.

      «Quelli di prima avevano le mani come volevano loro» dice Oda, alzando
      la sua, nodosa. «Noi abbiamo queste, e ci tocca adattarci.»
    opzioni:
      - testo: "Montare il manico rifatto"
        descrizione: "Un'impugnatura comune, rifatta da mani umane, che sta bene in mano e dà poco."
        quando: [parte.impugnatura-1 >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Facile }
        successo:
          titolo: Il manico di legno
          testo: |
            Il manico rifatto si incastra senza storie, perché qualcuno prima di
            te l'ha già adattato a una mano come la tua, e il legno è liscio
            proprio dove il palmo lo cerca. Oda ci passa sopra il pollice. «Chi
            l'ha rifatto sapeva lavorare il legno, e il resto no, dico bene?»
          effetti: { parte.impugnatura-1: -1, banco.impugnatura: 1, banco.parti: 1, banco.potenza: 1, banco.stabilita: 1 }
        fallimento:
          titolo: La spina storta
          testo: |
            Pianti storta la spina di rame e il manico si spacca lungo la
            venatura. Oda butta le due metà nella stufa, dove bruciano con una
            fiamma verdastra che non hai mai visto fare al legno.
          effetti: { parte.impugnatura-1: -1, banco.stranezza: 1 }

      - testo: "Montare l'impugnatura non umana"
        descrizione: "Un'impugnatura buona, fatta per una mano che non esiste più, da montare nel verso che si trova provando."
        quando: [parte.impugnatura-2 >= 1, banco.nucleo != 3]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il verso giusto
          testo: |
            Al terzo verso il palmo entra preciso negli incavi e la presa si
            scalda appena, e il congegno adesso lo puoi alzare e puntare. Quando
            lo punti verso la finestra Oda ti abbassa il braccio, come si fa con
            un bambino che indica uno sconosciuto.
          effetti: { parte.impugnatura-2: -1, banco.impugnatura: 2, banco.parti: 1, banco.potenza: 2, banco.stabilita: 2 }
        fallimento: &oda-fall-impugnatura-2
          titolo: Gli incavi
          testo: |
            Monti l'impugnatura al contrario, e le spine di rame si piegano dentro
            la sede. Oda deve spezzarla con un colpo secco, e al congegno resta
            una spina storta che sporge dal fianco e impiglia le maniche di chi
            passa.
          effetti: { parte.impugnatura-2: -1, banco.stranezza: 1 }

      - testo: "Montare l'impugnatura non umana"
        descrizione: "Il nucleo che ricorda è già nel congegno, e un'impugnatura per un'altra mano gli farà tornare in mente qualcosa."
        quando: [parte.impugnatura-2 >= 1, banco.nucleo == 3]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La mano che ricorda
          testo: |
            Appena stringi l'impugnatura il nucleo si sveglia, e per un momento la
            tua mano ha sei dita e sai dove andavano tutte. Poi ti conti le dita
            due volte, mentre il congegno si gira da solo verso un punto della
            pianura finché Oda non lo blocca nella morsa.
          effetti: { parte.impugnatura-2: -1, banco.impugnatura: 2, banco.parti: 1, banco.potenza: 2, banco.stranezza: 2 }
        fallimento: *oda-fall-impugnatura-2

      - testo: "Montare la presa a sei dita"
        descrizione: "Un'impugnatura rara, che si scalda quando la tieni e va convinta che la tua mano va bene."
        quando: [parte.impugnatura-3 >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Sei incavi
          testo: |
            Tieni la presa per un'ora, con il braccio che si addormenta, finché il
            pollice trova l'incavo giusto e la presa si scalda. Allora le spine di
            rame entrano nella sede, e dove punti il congegno l'aria trema appena,
            tanto che Oda ti chiede con gentilezza di non puntarlo verso di lei.
          effetti: { parte.impugnatura-3: -1, banco.impugnatura: 3, banco.parti: 1, banco.potenza: 3, banco.stabilita: 3 }
        fallimento:
          titolo: La presa fredda
          testo: |
            La presa si scalda finché ti brucia il palmo e la mano si apre da
            sola. Sul telo si raffredda di colpo e si copre di brina, e il
            congegno, dove l'ha toccato, ha preso a sudare acqua fredda.
          effetti: { parte.impugnatura-3: -1, banco.stranezza: 1 }

      - testo: "Chiedere a Oda che cosa ci vuole"
        descrizione: "Senza impugnatura il congegno non lo tiene in mano nessuno, e Oda sa dove cercarne una."
        quando: [parte.impugnatura-1 == 0, parte.impugnatura-2 == 0, parte.impugnatura-3 == 0]
        costo: 0
        esito:
          titolo: Una presa
          testo: |
            Oda indica la fila di impugnature appese ai chiodi, e si mette fra
            te e loro senza parere. «Quelle sono mie» dice. «La tua sta
            incastrata di traverso dentro un reperto sigillato, e per tirarla
            fuori ci vogliono dita svelte, dico bene?»

  # ================================================================ 3 · montare il congegno: il nucleo
  - id: oda-montare-nucleo
    presso: baracca-di-oda
    immagine: icone/glowing-artifact
    titolo: Il nucleo
    sommario: "Il nucleo fa fare al congegno cose che nessuno gli ha chiesto, e Oda lo monta per ultimo."
    luogo: "Superficie Fratturata, il banco di Oda Krell"
    area: superficie-fratturata
    ripetibile: true
    requisiti: [oda.conosciuta >= 1, banco.nucleo == 0]
    testo: |
      I nuclei Oda li tiene in una cassetta di piombo sotto il letto, e prima
      di aprirla si toglie l'anello di ferro dal mignolo. «A quelli di prima
      servivano per ricordare, e questi ricordano ancora, solo che hanno
      perso il filo» dice. Ti fa sedere con la schiena al muro, perché se ti
      gira la testa è meglio avere qualcosa dietro, e sul banco mette una
      pinzetta d'osso e un bicchiere d'acqua senza dirti a che cosa serve.

      {ingannare Media} Il silenzio sull'acqua è un trucco vecchio, per
      tenerti la testa sveglia.
    opzioni:
      - testo: "Montare il nucleo opaco"
        descrizione: "Un nucleo comune e quasi muto, che si monta senza fatica e fa fare al congegno cose piccole."
        quando: [parte.nucleo-1 >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Facile }
        successo:
          titolo: Le cose piccole
          testo: |
            Il nucleo opaco entra nella sede con uno scatto, e dopo un poco
            l'acqua nel bicchiere si mette a girare piano, sempre nello stesso
            verso. Oda la guarda girare e poi ne beve un sorso, come fosse acqua
            qualunque.
          effetti: { parte.nucleo-1: -1, banco.nucleo: 1, banco.parti: 1, banco.stranezza: 2 }
        fallimento:
          titolo: Il bicchiere
          testo: |
            Il nucleo ti sfugge dalla pinzetta e cade nel bicchiere, che si
            intorbida di colpo, e quando lo ripeschi è grigio come un sasso di
            fiume. Oda va a buttare l'acqua a venti passi dalla baracca,
            zoppicando più del solito per far vedere quanto le costa.
          effetti: { parte.nucleo-1: -1, banco.stranezza: 1 }

      - testo: "Montare il nucleo che sussurra"
        descrizione: "Un nucleo buono, con una voce che non finisce mai la frase, da montare senza ascoltarla."
        quando: [parte.nucleo-2 >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La voce nel congegno
          testo: |
            Monti il nucleo contando a voce alta per coprire il sussurro, e quando
            la sede si chiude il mormorio passa al congegno intero e lascia ogni
            frase a metà. Oda ci canticchia sopra, e a fine giornata ti sorprendi
            a finire la frase al posto suo.
          effetti: { parte.nucleo-2: -1, banco.nucleo: 2, banco.parti: 1, banco.stranezza: 4 }
        fallimento:
          titolo: La frase finita
          testo: |
            Ascolti la voce un momento di troppo, e la frase per una volta arriva
            in fondo, ma ti sfugge appena provi a ricordarla. Ti ritrovi con la
            schiena al muro e il bicchiere vuoto in mano, e il nucleo sul telo è
            opaco e zitto.
          effetti: { parte.nucleo-2: -1, banco.stranezza: 1 }

      - testo: "Montare il nucleo che ricorda"
        descrizione: "Un nucleo raro, e chi lo tiene in mano troppo a lungo ricorda posti dove non è mai stato."
        quando: [parte.nucleo-3 >= 1, banco.impugnatura != 2]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La piazza di pietra
          testo: |
            Monti il nucleo in fretta e senza guardarlo, e per un momento hai in
            testa una piazza di pietra bianca piena di gente alta, che se ne va
            lasciandoti una nostalgia che non sai a chi restituire. Il congegno
            resta acceso di una luce che non viene da nessuna parte.

            {accademiche Molto difficile} Nei pochi disegni rimasti le piazze dei
            Precursori sono sempre vuote.
          effetti: { parte.nucleo-3: -1, banco.nucleo: 3, banco.parti: 1, banco.stranezza: 6 }
        fallimento: &oda-fall-nucleo-3
          titolo: La piazza bianca
          testo: |
            Tieni il nucleo troppo a lungo e sei in una piazza di pietra bianca
            piena di gente alta, che si volta tutta insieme a guardarti. Torni
            quando Oda ti rovescia addosso il bicchiere d'acqua. Il nucleo sul
            telo è spaccato a metà, e per tutta la sera il congegno ti segue
            quando ti muovi.
          effetti: { parte.nucleo-3: -1, banco.stranezza: 1 }

      - testo: "Montare il nucleo che ricorda"
        descrizione: "Sul congegno c'è un'impugnatura fatta per una mano che non esiste più, e il nucleo che ricorda se ne ricorderà."
        quando: [parte.nucleo-3 >= 1, banco.impugnatura == 2]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La mano e la piazza
          testo: |
            Quando il nucleo entra nella sede l'impugnatura non umana si scalda
            come appena lasciata, e rivedi la piazza bianca dall'altezza giusta,
            con una mano a sei dita su quella presa. Il congegno cerca qualcosa
            verso la pianura senza trovarlo, finché Oda lo lega alla morsa.

            {empatia Difficile} Cerca come un cane la casa vecchia dopo un
            trasloco, e fa più pena che paura.
          effetti: { parte.nucleo-3: -1, banco.nucleo: 3, banco.parti: 1, banco.stranezza: 8, banco.stabilita: -2 }
        fallimento: *oda-fall-nucleo-3

      - testo: "Chiedere a Oda che cosa ci vuole"
        descrizione: "Senza un nucleo il congegno fa soltanto quello che deve, e Oda sa dove trovarne uno."
        quando: [parte.nucleo-1 == 0, parte.nucleo-2 == 0, parte.nucleo-3 == 0]
        costo: 0
        esito:
          titolo: Una cosa che ricorda
          testo: |
            Oda rimette la cassetta di piombo sotto il letto senza averla
            aperta, e si rinfila l'anello al mignolo. «I nuclei stanno in fondo
            ai reperti, sotto tutto il resto» dice. «Per tirarli fuori ci vuole
            la testa ferma, e le mani contano poco, dico bene?»

  # ================================================================ 4 · smontare il congegno
  - id: oda-smontare-congegno
    presso: baracca-di-oda
    immagine: icone/spanner
    titolo: Smontare il congegno
    sommario: "Quello che è montato si può smontare, però dalle parti montate escono soltanto schegge."
    luogo: "Superficie Fratturata, il banco di Oda Krell"
    area: superficie-fratturata
    ripetibile: true
    requisiti: [oda.conosciuta >= 1, banco.parti >= 1]
    testo: |
      Il congegno sta sul telo in fondo al banco, tenuto insieme dalle viti
      di quelli di prima e da qualche filo di rame, e Oda si rigira fra le
      dita il cacciavite senza passartelo. «Si può smontare, solo che le
      parti montate si abituano le une alle altre, e quello che si smonta
      torna diverso, dico bene?»

      {empatia Media} Le dispiace, e il cacciavite che non ti passa è tutto
      il discorso che farà sull'argomento.
    opzioni:
      - testo: "Smontare tutto"
        descrizione: "Il banco torna vuoto, e di quello che c'era restano poche schegge."
        esito:
          titolo: Il telo vuoto
          testo: |
            Togli le viti girandole al contrario, e le parti vengono via con un
            rumore di cosa strappata, troppo rovinate per montarle di nuovo. Oda
            le spazza in un mucchietto di schegge, e sul telo resta un alone scuro
            che lo straccio non toglie.
          effetti: { reliquie.scheggia: 3 }
          imposta: &oda-banco-vuoto { banco.involucro: 0, banco.camera: 0, banco.impugnatura: 0, banco.nucleo: 0, banco.parti: 0, banco.potenza: 0, banco.stabilita: 0, banco.stranezza: 0 }

  # ================================================================ 5 · far riparare un reperto guasto
  - id: oda-riparare-reperti
    presso: baracca-di-oda
    immagine: icone/auto-repair
    titolo: Le riparazioni di Oda
    sommario: "Per Oda un reperto guastato dorme soltanto, e si sveglia con il pezzo giusto."
    luogo: "Superficie Fratturata, la mensola sopra la stufa"
    area: superficie-fratturata
    ripetibile: true
    requisiti: [oda.conosciuta >= 1]
    testo: |
      Sulla mensola sopra la stufa Oda tiene i reperti da riparare, ognuno
      con un cartellino legato con lo spago, e alcuni stanno lì da anni
      perché nessuno è tornato a prenderli. «Si guastano quando li usi male,
      oppure quando li usi troppo, che è lo stesso» dice. «Dentro si è
      bruciato un pezzo, e si cambia con uno uguale di quelli che escono dai
      sigillati.» Aggiunge che il lavoro si paga, come se fosse un
      dettaglio.

      {origine mercante-dei-ponti} Dal banco sui Ponti conosci il trucco di
      dire il prezzo per ultimo, quando l'altro ha già deciso.
    opzioni:
      - testo: "Far riparare l'arma a impulsi"
        descrizione: "La fessura non si accende più, e Oda per cambiare la camera ne vuole una comune."
        quando: [guasto.arma-a-impulsi >= 1]
        requisiti: [parte.camera-1 >= 1, monete >= 6]
        esito:
          titolo: La fessura
          testo: |
            Oda svita il fondo del tubo, butta una camera nera come il carbone che
            si sbriciola sul banco e al suo posto sigilla con il grasso grigio la
            tua camera spenta. Quando ti rende l'arma la fessura si illumina verso
            le tue scarpe. «La prima volta punta a terra» dice Oda, e conta le
            monete.
          effetti: { parte.camera-1: -1, monete: -6, guasto.arma-a-impulsi: -1 }

      - testo: "Far riparare il respiratore"
        descrizione: "La maschera non si stringe più al viso, e serve un pezzo di carcassa per rifare il bordo."
        quando: [guasto.respiratore >= 1]
        requisiti: [parte.involucro-1 >= 1, monete >= 4]
        esito:
          titolo: Il bordo nuovo
          testo: |
            Oda taglia una striscia dalla tua carcassa incrinata e la piega a
            colpi di martello intorno al bordo della maschera. Poi te la appoggia
            sul viso senza avvertirti, e i bordi si muovono finché trovano la tua
            faccia, con l'aria che sa di pietra bagnata come la prima volta.
          effetti: { parte.involucro-1: -1, monete: -4, guasto.respiratore: -1 }

      - testo: "Far riparare il campo di forza"
        descrizione: "Il disco ha smesso di formicolare perché il nucleo si è addormentato, e uno comune basta a svegliarlo."
        quando: [guasto.campo-di-forza >= 1]
        requisiti: [parte.nucleo-1 >= 1, monete >= 6]
        esito:
          titolo: Il formicolio
          testo: |
            Oda apre il disco con la punta di un coltello, toglie un nucleo grigio
            come un dente cariato e ci mette il tuo nucleo opaco. Quando te lo
            appoggia sul petto il formicolio torna e ti scende fin dentro le ossa,
            e l'aria intorno a te si fa densa per un momento.
          effetti: { parte.nucleo-1: -1, monete: -6, guasto.campo-di-forza: -1 }

      - testo: "Far riparare il visore"
        descrizione: "La lente mostra le cose al loro posto come una lente qualunque, e ci vuole una camera nuova."
        quando: [guasto.visore >= 1]
        requisiti: [parte.camera-1 >= 1, monete >= 4]
        esito:
          titolo: Un attimo prima
          testo: |
            Oda sostituisce il cristallo dietro la lente con un pezzo limato della
            tua camera spenta e te la aggancia dietro l'orecchio. Attraverso la
            lente la vedi muoversi un attimo prima che si muova davvero, e quando
            ti scansi dal suo gomito ride con una risata da ragazza, la prima che
            le senti.
          effetti: { parte.camera-1: -1, monete: -4, guasto.visore: -1 }

      - testo: "Far riparare l'iniettore"
        descrizione: "L'ago non esce più dal cilindro, e la molla che lo spinge sta dentro un'impugnatura comune."
        quando: [guasto.iniettore >= 1]
        requisiti: [parte.impugnatura-1 >= 1, monete >= 4]
        esito:
          titolo: L'ago
          testo: |
            Oda smonta il manico rifatto e ne tiene soltanto la molla, una spirale
            di metallo precuriano nascosta dentro il legno. Nel cilindro l'ago
            torna a uscire e a rientrare da solo, e Oda, dopo averlo avvicinato al
            braccio per provarlo, te lo restituisce.

            {medicina Media} Un ago che esce da solo andrebbe pulito sulla fiamma
            ogni volta, ed è per questo che ci ha ripensato.
          effetti: { parte.impugnatura-1: -1, monete: -4, guasto.iniettore: -1 }

      - testo: "Far riparare la bacchetta"
        descrizione: "La punta biforcuta non si carica più, e Oda vuole una camera comune e una mattina di lavoro pagata."
        quando: [guasto.bacchetta-della-stretta-folgorante >= 1]
        requisiti: [parte.camera-1 >= 1, monete >= 6]
        esito:
          titolo: La scarica nera
          testo: |
            Oda apre il fusto contorto della bacchetta tenendola lontana dal corpo come
            una serpe, e al posto del cristallo crepato lega con il filo di rame la tua
            camera spenta. Quando la bacchetta torna nelle tue mani fra le due punte
            passa una scintilla nera, e Oda va a sedersi dall'altra parte della stanza.
          effetti: { parte.camera-1: -1, monete: -6, guasto.bacchetta-della-stretta-folgorante: -1 }

      - testo: "Far riparare il congegno di controllo"
        descrizione: "La corona di cristalli è spenta perché il nucleo al centro è stanco, e uno comune basta."
        quando: [guasto.congegno-di-controllo >= 1]
        requisiti: [parte.nucleo-1 >= 1, monete >= 6]
        esito:
          titolo: La corona
          testo: |
            Oda rigira il disco a lungo prima di aprirlo, e per una volta non fa
            domande. Quando ha messo il tuo nucleo opaco al centro e premi il
            pollice nella conca, la corona si riaccende un cristallo alla volta.

            {intimidire Media} Quel disco le fa paura, e la paura le ha tolto le
            domande di bocca.
          effetti: { parte.nucleo-1: -1, monete: -6, guasto.congegno-di-controllo: -1 }

      - testo: "Chiedere a Oda dei reperti sulla mensola"
        descrizione: "Di quelli che le hanno lasciato da riparare, Oda conosce la storia uno per uno."
        costo: 0
        esito:
          titolo: I cartellini
          testo: |
            Oda prende dalla mensola un reperto a forma di imbuto con un
            cartellino che dice soltanto *Berto*. «Me l'ha portato undici anni fa,
            e doveva tornare la settimana dopo» dice. «Io l'ho riparato in due
            giorni.»

            {empatia Facile} Della riparazione parla con orgoglio, e di Berto non
            dice niente, anche se un poco lo aspetta ancora.

  # ================================================================ 6 · battere le terrazze
  - id: battere-le-terrazze
    presso: terrazze-di-basalto
    immagine: ambientazione/rovine-dei-precursori
    titolo: Battere le terrazze
    sommario: "Sui gradoni di basalto i reperti affiorano per chi li sa vedere, e a volte bisogna scavare."
    luogo: "Superficie Fratturata, le terrazze di basalto"
    area: superficie-fratturata
    ripetibile: true
    testo: |
      Fra i gradoni di basalto che scendono verso la pianura si aprono
      canaloni di ghiaia dove l'acqua delle piogge porta giù quello che
      trova, e lì in mezzo i reperti sigillati affiorano come sassi di un
      colore sbagliato. Dove gli anelli di metallo dei Precursori spuntano
      dalla roccia la terra è smossa, perché è lì che scavano tutti, e sui
      sassi del bordo le frecce bianche dei Raschiatori indicano la strada
      degli scavi.

      {origine figlio-del-circolo} Quella terra l'hanno smossa uomini con le
      pale e la mano pesante, e nessuno ha richiuso le buche.
    opzioni:
      - testo: "Cercare con gli occhi"
        descrizione: "Si cammina piano lungo i canaloni guardando la ghiaia sasso per sasso, e gli occhi si stancano prima delle gambe."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il sasso sbagliato
          testo: |
            Dopo un'ora di ghiaia grigia ne vedi uno che stona, troppo regolare,
            con una riga sottile che gli fa il giro, ed è un reperto sigillato,
            tiepido al sole. Nella stessa ansa del canalone raccogli anche una
            scheggia incisa che l'acqua ha lisciato.
          effetti: { reperto.sigillato: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Gli occhi stanchi
          testo: |
            Guardi la ghiaia finché tutti i sassi ti sembrano reperti e nessuno lo
            è, e a un certo punto ti chiedi se il canalone l'hai già fatto. Torni
            con una scheggia sola, un mal di testa e il sospetto che un reperto ti
            sia rimasto sotto i piedi.
          effetti: { reliquie.scheggia: 1, tormento: 1 }

      - testo: "Scavare dove gli anelli affiorano"
        descrizione: "Intorno agli anelli i reperti stanno sotto la terra smossa, ma a volte dal buco sale la Marea."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: Sotto l'anello
          testo: |
            Scavi intorno all'anello più piccolo finché le unghie ti si spezzano
            su due reperti sigillati incastrati come uova in un nido, con intorno
            frammenti di cristallo esausti. Quando ti volti l'anello si è girato
            di un quarto, e non l'hai visto muoversi.

            {tecnologia Difficile} È un quarto di giro preciso da serratura. Forse
            quegli anelli girano piano quando nessuno li guarda.
          effetti: { reperto.sigillato: 2, cristalli.frammento-esausto: 2 }
        fallimento:
          titolo: La terra che cede
          testo: |
            Scavi sotto l'anello e la terra cede tutta insieme, e ti ritrovi nel
            buco fino alla cintura con una caviglia storta. Dal fondo sale un filo
            di nebbia grigia che ti arriva al petto prima che tu riesca a tirarti
            fuori, con un frammento di cristallo esausto in mano e la tosse.
          effetti: { cristalli.frammento-esausto: 1, ferite: 1, contaminazione: 1 }

      - testo: "Seguire le frecce dei Raschiatori"
        descrizione: "Le frecce bianche portano dove i Raschiatori hanno già scavato, per la strada lunga e sicura che lascia poco."
        costo: 2
        esito:
          titolo: Le frecce
          testo: |
            Segui le frecce bianche saltando quelle girate per scherzo,
            riconoscibili dal tratto di pennello, fino a uno scavo vecchio già
            passato al setaccio. Al tramonto hai un reperto sigillato che i
            Raschiatori avevano scartato per una crepa che, a guardarla meglio, è
            soltanto terra.
          effetti: { reperto.sigillato: 1 }

  # ================================================================ 7 · i compratori dei congegni
  - id: compratore-orvald
    presso: accademia-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: Un congegno per il seminterrato
    sommario: "Orvald Temmerin compra i congegni che funzionano, e li prova prima di pagarli."
    luogo: "Accademia di Torvessa, lo studio del preside"
    area: quartieri-alti
    ripetibile: true
    requisiti: [banco.parti >= 4]
    testo: |
      Orvald Temmerin libera un angolo della scrivania spingendo da parte una
      pila di mappe, mentre Pett, il corvo, scende dalla trave. Con un paio
      di guanti da maniscalco prende il congegno e lo gira verso la luce.
      «Trent'anni di scavi, e di roba che si accende ne ho vista parecchia»
      dice. «Quella che si spegne quando vuoi tu è molta meno.»

      {origine allievo-di-torvessa} In aula Temmerin non ti ha mai guardato
      così a lungo, e la cosa ti brucia un poco.

      {politica-ed-economia Media} Paga quello che regge, e il resto lo
      lascia ai compratori che fanno meno domande.
    opzioni:
      - testo: "Venderglielo come attrezzo"
        descrizione: "Il congegno regge e fa qualcosa, e per Orvald è un attrezzo da seminterrato pagato come tale."
        requisiti: [banco.stabilita >= 4, banco.potenza >= 4]
        esito:
          titolo: Sullo scaffale
          testo: |
            Il congegno ronza e si scalda senza spostarsi di un dito, e Orvald alla fine
            annuisce. Lo porta su uno scaffale del seminterrato, fra una lancia spezzata e un
            barattolo di occhi sotto spirito, e ti paga dalla cassetta della scrivania contando
            le monete due volte, mentre Pett gracchia sul conto.
          effetti: { monete: 50, rep.accademia: 0.5 }
          imposta: *oda-banco-vuoto

      - testo: "Farlo funzionare davanti a lui"
        descrizione: "Il congegno spinge forte e non si rompe, e Orvald vorrà vederlo lavorare e capire come."
        requisiti: [banco.stabilita >= 6, banco.potenza >= 6]
        esito:
          titolo: La lezione
          testo: |
            Accendi il congegno e la tazza sulla scrivania si sposta di una spanna
            da sola. Orvald ti fa spiegare come l'hai montato, parte per parte,
            scrivendo con la sinistra, e ti corregge due volte prima di pagarti
            bene e chiederti di portargliene un altro.

            {ingannare Media} La prima correzione l'ha sbagliata apposta, per
            vedere se avresti ceduto a un preside.
          pe: { tecnologia: 10 }
          effetti: { monete: 100, rep.accademia: 1 }
          imposta: *oda-banco-vuoto

      - testo: "Lasciarlo fra i trofei"
        descrizione: "Un congegno che obbedisce come questo Orvald non l'ha trovato in trent'anni di scavi."
        requisiti: [banco.stabilita >= 8, banco.potenza >= 8]
        esito:
          titolo: Fra i trofei
          testo: |
            Il congegno si accende quando lo tocchi e si spegne quando lo lasci, e
            intanto solleva la pila di mappe di un palmo senza spostare un foglio.
            Orvald resta in silenzio così a lungo che Pett gli becca l'orecchio,
            poi ti porta nel seminterrato, gli fa posto sul ripiano dei trofei e
            ti fa spiegare ogni vite per tutto il pomeriggio, prima di darti una
            borsa pesante.
          pe: { tecnologia: 20 }
          effetti: { monete: 180, rep.accademia: 1 }
          imposta: *oda-banco-vuoto

  - id: compratore-velo
    presso: cattedrale-del-velo
    immagine: personaggi/ottilia-sanvel
    titolo: Un congegno per la Cripta
    sommario: "La Confraternita del Velo prende qualunque congegno dei Precursori per murarlo sotto terra, e paga poco."
    luogo: "Cattedrale del Velo, la porta della sagrestia"
    area: quartieri-alti
    ripetibile: true
    requisiti: [banco.parti >= 4]
    testo: |
      Ottilia Sanvel guarda il congegno che le posi davanti alla cassa di
      legno chiaro, con le mani infilate nelle maniche, e chiama un accolito
      con un telo cerato e un paio di pinze da camino per farlo avvolgere
      senza chiedere che cosa sia. «La Madre vuole che smettano di fare
      quello che fanno» dice, e sulla tavoletta di cera scrive *congegno* e
      la data. Più in là Sorella Arva ha già aperto la cassetta delle
      offerte.

      {origine accolito-del-velo} Ottilia alza appena un sopracciglio e non
      chiede niente, che in Cattedrale è la prima cosa che si impara.
    opzioni:
      - testo: "Consegnarlo al Velo"
        descrizione: "Il Velo prende tutto per sigillarlo e paga poco, ma in cambio ti purifica."
        esito:
          titolo: Il telo cerato
          testo: |
            L'accolito porta via il congegno con le pinze giù per le scale della
            Cripta. Un altro, con le unghie mangiate fino alla carne, ti posa le
            mani sulle tempie e recita la Preghiera del Battito, e il ronzio che
            ti porti dietro dal banco di Oda si spegne. Sorella Arva ti conta
            l'offerta sul palmo.
          effetti: { monete: 20, tormento: -1, contaminazione: -1 }
          imposta: *oda-banco-vuoto

      - testo: "Mostrare a Ottilia quello che fa"
        descrizione: "Il congegno fa cose che non dovrebbe, e per una cosa così il Velo apre la porta della Cripta."
        requisiti: [banco.stranezza >= 5]
        esito:
          titolo: La porta della Cripta
          testo: |
            Accendi il congegno, e la fiamma delle candele si piega tutta verso di
            lui. Ottilia lo fa portare giù da due accoliti invece che da uno, poi
            ti tiene le mani sulle tempie per tutta la Preghiera del Battito, e
            solo allora ti accorgi che stavi tremando. Alla fine scrive il tuo
            nome sulla tavoletta, accanto alla data.
          effetti: { monete: 35, tormento: -2, contaminazione: -1.5, rep.velo: 0.5 }
          imposta: *oda-banco-vuoto

  - id: compratore-ombre
    presso: mercato-delle-ombre
    immagine: ambientazione/mercato-delle-ombre
    titolo: Un congegno che fa male
    sommario: "Al Mercato delle Ombre il vecchio dalle dita storte compra i congegni che possono ferire, come armi."
    luogo: "Mercato delle Ombre, il banco dei congegni"
    area: citta-bassa
    ripetibile: true
    requisiti: [banco.parti >= 4]
    testo: |
      Il compratore dei congegni è il vecchio Raschiatore con le dita storte,
      dietro un'asse con un fiore di carta in un vasetto. Passa i
      polpastrelli sul tuo congegno. «Questa roba la vogliono per una cosa
      sola» dice. «Quando fa male la vendo a chi la usa, e quando è innocua
      ne faccio un fermacarte.» Alle sue spalle un uomo con il cappuccio ha
      smesso di giocare a dadi, e su ogni soglia della piazza c'è un uomo
      seduto.

      {origine figlio-della-citta-bassa} L'uomo con il cappuccio ha una di
      quelle facce che nei vicoli si impara presto a dimenticare.
    opzioni:
      - testo: "Venderlo come arma da poco"
        descrizione: "Il congegno spinge abbastanza da far male, e il vecchio paga bene mentre qualcuno prende nota."
        requisiti: [banco.potenza >= 4]
        esito:
          titolo: Il pollice sulla camera
          testo: |
            Il vecchio tiene il pollice sulla camera finché il congegno gli scotta
            il dito, poi ti paga con monete di conî diversi impilate sull'asse.
            Quando risali la scala l'uomo con il cappuccio ti saluta con due dita,
            come si saluta un conoscente.

            {intimidire Facile} Vuol dire che si ricorderà la tua faccia, e che
            vuole che tu lo sappia.
          effetti: { monete: 60, sospetto: 1 }
          imposta: *oda-banco-vuoto

      - testo: "Fargli sentire il colpo"
        descrizione: "Il congegno spinge forte, e chi guarda la prova del vecchio se ne ricorderà."
        requisiti: [banco.potenza >= 6]
        esito:
          titolo: Il segno sul pilastro
          testo: |
            Il vecchio punta il congegno verso un pilastro, e sulla pietra resta
            un segno annerito grande come una mano, che fuma. I banchi vicini
            smettono di contrattare mentre ti paga con una colonna di monete che
            gli arriva al polso, e le facce che ti guardano risalire la scala sono
            più di quelle che ti hanno visto scendere.
          effetti: { monete: 120, sospetto: 1.5 }
          imposta: *oda-banco-vuoto

      - testo: "Aspettare il compratore che manda a chiamare"
        descrizione: "Un congegno così il vecchio non lo compra per sé, e manda un ragazzino a chiamare qualcuno."
        requisiti: [banco.potenza >= 8]
        esito:
          titolo: La donna con i guanti
          testo: |
            Aspetti un'ora su una cassa, finché arriva una donna con i guanti e la
            faccia coperta da un fazzoletto, che non dice il suo nome e non chiede
            il tuo. Soppesa il congegno senza accenderlo, e ti lascia sull'asse
            una borsa così pesante che la devi tenere con due mani.

            {origine rampollo-dei-quartieri-alti} Il suo profumo l'hai già sentito
            ai tavoli del Consiglio, il giorno del Festival.
          effetti: { monete: 220, sospetto: 1.5 }
          imposta: *oda-banco-vuoto

  - id: compratore-dragna
    presso: grifone-di-ferro
    immagine: personaggi/dragna-gro-malog
    titolo: Un congegno per le parti
    sommario: "Dragna prende i congegni per le squadre dei Raschiatori e in cambio dà i pezzi rari che le squadre portano su."
    luogo: "Locanda del Grifone di Ferro, il tavolo di Dragna"
    area: ponti-sospesi
    ripetibile: true
    requisiti: [banco.parti >= 4]
    testo: |
      Dragna Gro-Malog sposta il boccale e i fogli dei turni, batte due
      volte i monconi sul tavolo e gira il congegno con la mano buona.
      «Lavoro di Oda, si vede dalle legature di rame» dice. «Noi i congegni
      li smontiamo per cavarne i pezzi degli argani, e in cambio ho quello
      che le squadre portano su e nessuno sa montare, che a te serve più che
      a me.»

      {empatia Media} Le legature di Oda le riconosce come una calligrafia,
      e vederle le fa piacere.

      {origine apprendista-raschiatore} Sul foglio dei turni c'è anche il
      tuo nome, qualche riga più su.
    opzioni:
      - testo: "Prendere una camera rara"
        descrizione: "Una camera che pulsa ancora, di quelle che le squadre trovano una volta per stagione."
        esito:
          titolo: La camera nella paglia
          testo: |
            Dragna fa portare dal retro una scatola di latta, dove nella paglia
            c'è una camera di cristallo che batte come un polso e fa abbassare la
            lampada a ogni colpo. «Tienila lontano dalle carcasse incrinate» dice,
            scrivendo qualcosa accanto al tuo nome. «Oda te l'avrà già detto, e
            adesso te lo dico anch'io.»
          effetti: { parte.camera-3: 1, rep.raschiatori: 0.5 }
          imposta: *oda-banco-vuoto

      - testo: "Prendere un nucleo raro"
        descrizione: "Un nucleo che ricorda, avvolto nel piombo, che le squadre portano su e poi non vogliono intorno."
        esito:
          titolo: Il nucleo nel piombo
          testo: |
            Dragna spinge verso di te con la punta della penna un involto di
            piombo grande come un pugno. «Non aprirlo qui. L'ultimo che l'ha
            aperto al Grifone si è messo a parlare di una piazza bianca, e per due
            giorni non ha voluto scendere.» Accanto al tuo nome, sul foglio dei
            turni, traccia un segno piccolo a matita.
          effetti: { parte.nucleo-3: 1, rep.raschiatori: 0.5 }
          imposta: *oda-banco-vuoto

