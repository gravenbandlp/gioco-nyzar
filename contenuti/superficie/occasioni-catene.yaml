# La Superficie Fratturata: due mini-Cronache del mazzo, carte comuni in catena (docs/piano-superficie.md e le
# istruzioni sulle occasioni). Il passo N chiede <catena>.passo == N-1 e lo porta a N; un fallimento a metà non fa
# avanzare e costa una negativa; le opzioni a costo 0 rimandano e lasciano la carta in mano. Ogni esito che chiude
# imposta <catena>.fine e paga il premio intero in monete.
#
# LA CAROVANA DEI MUTI (carovana.passo 0-5, carovana.fine 1-3, il premio su ogni chiusura)
#   0  carta-sfc-carovana-acqua     l'accampamento: sedersi al fuoco, leggere la loro strada (natura o
#                                   percezione), dividere le provviste (monete) → passo 1.
#   1  carta-sfc-carovana-malato    il ragazzo con la febbre: curarlo (medicina), un tonico, portarlo a Laresh
#                                   (2 rintocchi) → passo 2.
#   2  carta-sfc-carovana-predoni   i predoni all'uscita della gola: combattere (predoni-disorganizzati, area.yaml),
#                                   pagare il passaggio, portarli fuori per la cresta (furtività o atletica) → passo 3.
#   3  carta-sfc-carovana-arrivo    il villaggio nella cenere, un luogo senza nome: spalare (atletica o
#                                   resistenza), guardare → passo 4.
#   4  carta-sfc-carovana-fine      restare a vedere (fine 1), avvisare la Caserma (fine 2), portare via le
#                                   cassapanche (fine 3) → passo 5.
#
# IL CARTOGRAFO CIECO (cartografo.passo 0-4, cartografo.fine 1-3, il premio su ogni chiusura)
#   0  carta-sfc-cartografo-gola      la gola a nord dei gradoni (percezione), o dall'alto (2 rintocchi), o con
#                                     un pettegolezzo → passo 1.
#   1  carta-sfc-cartografo-terrazze  le terrazze a passi (atletica o resistenza), con la cordicella (2 rintocchi),
#                                     o pagando un Raschiatore → passo 2.
#   2  carta-sfc-cartografo-ossa      il pianoro delle ossa a lame (percezione o accademiche), a gruppi
#                                     (2 rintocchi), o con la battaglia già letta (sup3.campo-storia) → passo 3.
#   3  carta-sfc-cartografo-fine      il passaggio sotto le terrazze: venderla alla Gilda (fine 1), tenerla
#                                     (fine 2), bruciarla con lui (fine 3) → passo 4.
#
# Nessun nome nuovo: la donna dai capelli grigi e il cartografo restano senza nome.
quality:
  - { id: carovana.passo, nome: "La carovana dei muti", categoria: stato, nascosta: true, descrizione: "A che punto sei con la carovana dei muti, da 0 a 5." }
  - { id: carovana.fine, nome: "Com'è finita con la carovana", categoria: stato, nascosta: true, descrizione: "0 se la storia è aperta, 1 se sei rimast{o|a} a guardare, 2 se hai avvisato la Caserma, 3 se hai portato via le cassapanche." }
  - { id: cartografo.passo, nome: "Il cartografo cieco", categoria: stato, nascosta: true, descrizione: "A che punto sei con la mappa del cartografo cieco, da 0 a 4." }
  - { id: cartografo.fine, nome: "Com'è finita con il cartografo", categoria: stato, nascosta: true, descrizione: "0 se la storia è aperta, 1 se avete venduto la mappa alla Gilda, 2 se l'hai tenuta, 3 se l'avete bruciata." }

storylet:
  # ================================================================ la carovana dei muti
  - id: carta-sfc-carovana-acqua
    tipo: carta
    area: superficie-fratturata
    immagine: icone/caravan
    titolo: La carovana dei muti
    sommario: "Fra due gradoni è accampata una carovana, e nessuno dei suoi parla."
    luogo: Superficie Fratturata, un'ansa riparata fra due gradoni
    requisiti: [carovana.passo == 0, carovana.fine == 0]
    testo: |
      Fra due gradoni di basalto è accampata una carovana di sei carri bassi, con i muli legati alle ruote.
      Intorno al fuoco siedono una ventina di persone di tutte le età. Nessuno parla, nemmeno i bambini che
      giocano con i sassi.

      Una donna con i capelli grigi si alza e ti porge una borraccia d'acqua. Ti guarda bere e poi torna a
      sedersi. Quando le chiedi da dove vengono, indica con il mento il sentiero alle tue spalle. Alla domanda
      su dove vanno indica un punto oltre le terrazze, dove le mappe della Gilda non segnano niente.

      {empatia Media} Tacciono come si tace in una casa dove qualcuno dorme, e di te non hanno paura.
    opzioni:
      - testo: "Sederti al fuoco con loro"
        descrizione: "Il pane lo dividono senza chiedere niente in cambio, e nemmeno il nome."
        esito:
          titolo: Il pane passato di mano
          testo: |
            Ti siedi al fuoco e mangi il pane che ti passano. Per la prima volta da giorni nessuno ti chiede
            niente, e le spalle ti si sciolgono da sole. Quando ti alzi la donna dai capelli grigi ti stringe
            il polso un momento. Domani la carovana riparte, e ha già deciso che ci sarai.
          effetti: { carovana.passo: 1, tormento: -0.5 }
      - testo: "Leggere la loro strada"
        descrizione: "I carri e i muli raccontano da dove vengono, se sai guardare le ruote e gli zoccoli."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il sale sotto la polvere
          testo: |
            Le ruote hanno la polvere rossa del Gradone, e sotto la polvere c'è una crosta di sale. I muli
            hanno gli zoccoli consumati da mesi di strada dritta. Vengono da lontano e non sono mai tornati
            indietro. La donna ti guarda girare intorno ai carri e non ti ferma.
          pe: { natura: 5 }
          effetti: { carovana.passo: 1, informazioni.voce: 1 }
        fallimento:
          titolo: L'ultimo carro
          testo: |
            Giri intorno ai carri con troppa curiosità, e quando allunghi la mano verso il telo dell'ultimo
            un uomo ti si mette davanti. Non dice niente e non serve. Torni al sentiero con la sensazione di
            aver frugato in casa d'altri.
          effetti: { sospetto: 0.5 }
      - testo: "Dividere le tue provviste"
        descrizione: "Hanno più bocche che pane. Quello che hai in sacca l'hai pagato in città."
        requisiti: [monete >= 5]
        esito:
          titolo: La sacca vuota
          testo: |
            Accanto al fuoco svuoti la sacca con le provviste comprate alla porta. I bambini
            aspettano che la donna dia il permesso e poi mangiano piano. Uno di loro ti mette in mano un sasso
            dipinto di rosso e torna a sedersi.
          effetti: { monete: -5, carovana.passo: 1, tormento: -1 }
      - testo: "Lasciarli al loro fuoco"
        costo: 0
        esito:
          testo: |
            Restituisci la borraccia e riprendi il sentiero. Quando ti volti dall'alto del gradone il fuoco è
            ancora acceso, e intorno nessuno si è mosso.

  - id: carta-sfc-carovana-malato
    tipo: carta
    area: superficie-fratturata
    immagine: icone/medical-pack
    titolo: Il malato sul carro
    sommario: "Sull'ultimo carro della carovana dei muti c'è un ragazzo con la febbre, e la carovana non si ferma."
    luogo: Superficie Fratturata, la pista dei carri
    requisiti: [carovana.passo == 1]
    testo: |
      Ritrovi la carovana sulla pista dei carri, più lenta dell'altra volta. Sull'ultimo carro, fra i sacchi,
      è disteso un ragazzo con la fronte lucida e le labbra screpolate. Sua madre cammina accanto alla ruota e
      gli bagna la bocca con un panno, perché la carovana non si ferma.

      La donna dai capelli grigi guarda te e poi il ragazzo. È la cosa più simile a una domanda che hai visto
      fare a uno di loro. Laresh è a mezza giornata di strada verso ovest, e la carovana va da un'altra parte.

      {medicina Facile} Ha la febbre alta da almeno tre giorni, e la tosse ha un suono umido. Su un carro che
      sobbalza non guarisce.
    opzioni:
      - testo: "Curarlo sul carro"
        descrizione: "Un decotto e qualche ora di attenzione, mentre le ruote sobbalzano. Bisogna sapere che cosa si fa."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: La febbre che scende
          testo: |
            Sali sul carro e gli tieni la testa sollevata per tutto il pomeriggio. Gli dai il decotto a sorsi
            piccoli e gli rinfreschi i polsi a ogni sosta dei muli. Al tramonto la febbre scende, e il ragazzo
            si addormenta con la mano stretta alla tua manica. La madre ti bacia le dita senza dire niente.
          pe: { medicina: 5 }
          effetti: { carovana.passo: 2 }
        fallimento:
          titolo: Il decotto sbagliato
          testo: |
            Il decotto lo fa vomitare, e la febbre sale invece di scendere. La madre ti riprende il panno di
            mano con gentilezza e da quel momento non ti guarda più. Scendi dal carro e cammini dietro la ruota
            fino a sera, con le mani che sanno ancora di erbe.
          effetti: { tormento: 1 }
      - testo: "Dargli il tuo tonico"
        descrizione: "Quello che tieni per le ferite serve anche a chi brucia di febbre."
        requisiti: [tonico >= 1]
        esito:
          titolo: Il colore che torna
          testo: |
            Gli fai bere il tonico un sorso alla volta, e dopo un'ora il ragazzo ha di nuovo colore sulle
            guance. Chiede da mangiare con un gesto. Sua madre ride senza voce, con la bocca aperta e gli occhi
            pieni.
          effetti: { tonico: -1, carovana.passo: 2, tormento: -0.5 }
      - testo: "Portarlo a Laresh"
        descrizione: "Mezza giornata con il ragazzo in spalla, e la levatrice del villaggio. Poi bisogna ritrovare la carovana."
        costo: 2
        esito:
          titolo: La strada per Laresh
          testo: |
            Te lo carichi sulla schiena e cammini fino a Laresh senza fermarti. La levatrice gli guarda la gola
            e lo mette a letto con una pezza bagnata in fronte. Quando torni sulla pista la carovana ha
            rallentato per aspettarti, e la madre ti prende la mano e se la tiene contro la guancia.
          pe: { resistenza: 5 }
          effetti: { carovana.passo: 2 }
      - testo: "Non adesso"
        costo: 0
        esito:
          testo: |
            Ti tieni in disparte e lasci passare i carri. L'ultimo ti sfila davanti con il ragazzo fra i sacchi
            e la madre accanto alla ruota.

  - id: carta-sfc-carovana-predoni
    tipo: carta
    area: superficie-fratturata
    immagine: icone/bandit
    titolo: I predoni dietro la carovana
    sommario: "Tre predoni hanno seguito la carovana dei muti, e all'uscita di una gola hanno deciso di prendersi un carro."
    luogo: Superficie Fratturata, una gola stretta fra due terrazze
    requisiti: [carovana.passo == 2]
    testo: |
      La carovana si è fermata per la prima volta, in una gola stretta fra due terrazze. All'uscita della gola
      aspettano tre predoni con le armature fatte di pezzi diversi. Li seguivano da giorni, e adesso si sono
      decisi.

      Il capo pianta la lancia nella ghiaia e grida che vuole un carro e poi la strada è libera. I muti non
      rispondono. Uomini e donne si mettono davanti ai carri a mani vuote.

      {intimidire Media} Il capo grida troppo per uno che è sicuro di sé. Gli altri due guardano lui invece
      della carovana.
    opzioni:
      - testo: "Combattere con loro"
        descrizione: "Sono tre e hanno armi vere. Se il primo cade, gli altri due ci pensano."
        combattimento: predoni-disorganizzati
        vittoria:
          titolo: La gola libera
          testo: |
            Il capo va giù per primo, e gli altri due scappano su per la terrazza lasciando la lancia nella
            ghiaia. Nella borsa del capo ci sono un po' di monete e un rotolo di bende. La carovana riparte
            subito, e la donna dai capelli grigi ti cammina accanto per un tratto.
          effetti: { carovana.passo: 3, monete: 10, bende: 1 }
        sconfitta:
          titolo: La bocca piena di ghiaia
          testo: |
            Ti ritrovi a terra con la ghiaia in bocca e la borsa più leggera. I predoni ridono e tornano al loro
            posto all'uscita della gola. La carovana non si muove. Aspetta, come se potesse aspettare per
            giorni.
          effetti: { monete: -5 }
      - testo: "Pagare il passaggio"
        descrizione: "Un carro vale più di quello che chiedono. Basta contare le monete nella mano del capo."
        requisiti: [monete >= 20]
        esito:
          titolo: Il prezzo della gola
          testo: |
            Vai dal capo e gli conti le monete nel palmo. Lui le soppesa e sputa per terra, poi strappa la
            lancia dalla ghiaia e si fa da parte. I carri passano uno alla volta, e i muti non guardano i
            predoni nemmeno quando li hanno accanto.
          effetti: { monete: -20, carovana.passo: 3 }
      - testo: "Portarli fuori per la cresta"
        descrizione: "Sopra la gola corre una cresta dove i carri passano a stento. Bisogna trovarla e non farsi sentire."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: La cresta
          testo: |
            Trovi il passaggio sulla cresta prima che faccia buio e porti su i carri a mano, un mulo alla volta,
            con gli zoccoli fasciati di stracci. All'alba la carovana è già dall'altra parte. I predoni stanno
            ancora aspettando all'uscita della gola.
          pe: { furtivita: 5 }
          effetti: { carovana.passo: 3 }
        fallimento:
          titolo: Il sasso che rotola
          testo: |
            A metà cresta un sasso ti scivola sotto lo stivale e rotola giù fino alla gola. I predoni alzano la
            testa, e tu scendi di corsa per riportare indietro i carri. Ti sbucci le mani sulla roccia, e la
            carovana torna a fermarsi dov'era.
          effetti: { ferite: 0.5 }
      - testo: "Allontanarti, per oggi"
        costo: 0
        esito:
          testo: |
            Ti allontani lungo la terrazza. Dall'alto vedi che i predoni e i muti restano fermi dove sono.

  - id: carta-sfc-carovana-arrivo
    tipo: carta
    area: superficie-fratturata
    immagine: icone/huts-village
    titolo: Il villaggio nella cenere
    sommario: "La carovana dei muti arriva in una conca che le mappe non segnano, dove un villaggio sepolto nella cenere la aspettava."
    luogo: Superficie Fratturata, una conca grigia oltre le terrazze
    requisiti: [carovana.passo == 3]
    testo: |
      Al quarto giorno la pista finisce in una conca grigia che sulle mappe della Gilda è uno spazio bianco. Il
      fondo è coperto di cenere fino alle ginocchia, e dalla cenere spuntano i tetti di un villaggio. Ci sono
      una ventina di case di pietra e un pozzo con la carrucola intatta.

      Davanti alla prima casa qualcuno ha spazzato via la cenere da poco. Sulla soglia ci sono tanti sgabelli
      quanti sono i muti, e accanto a ogni sgabello una brocca d'acqua fresca.

      I muti scendono dai carri senza fretta. La donna dai capelli grigi si siede sul primo sgabello e si toglie
      le scarpe.

      {percezione Media} Le brocche sono state riempite stamattina, e intorno alla casa non c'è nemmeno
      un'impronta.
    opzioni:
      - testo: "Aiutarli a spalare la cenere"
        descrizione: "La cenere arriva alle finestre, ed è fina come farina. Ci vogliono braccia buone e una gola che regge."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Le porte liberate
          testo: |
            Spali con loro fino a sera e ti leghi un fazzoletto sulla bocca. Sotto la cenere le porte sono intatte e
            i cardini non cigolano. Quando liberi la quarta casa i muti si fermano tutti insieme, e la donna ti
            porta da bere con le sue mani.
          pe: { resistenza: 5 }
          effetti: { carovana.passo: 4 }
        fallimento:
          titolo: La cenere in gola
          testo: |
            La cenere ti entra in gola e negli occhi, e a metà pomeriggio devi sederti sul bordo della conca a
            tossire. I muti continuano a spalare senza di te. Tossisci fino a sera, e la notte ti svegli con la
            bocca che sa di camino spento.
          effetti: { ferite: 0.5 }
      - testo: "Guardare che cosa fanno"
        descrizione: "Dal bordo della conca si vede tutto il villaggio, e loro non sembrano volerti in mezzo."
        esito:
          titolo: I lumi
          testo: |
            Resti sul bordo della conca fino al tramonto. Quando fa buio ogni muto entra in una casa diversa e
            accende un lume alla finestra, senza esitare sulla porta, come se ognuno sapesse qual è la sua. A
            mezzanotte il villaggio è tutto acceso.
          pe: { percezione: 5 }
          effetti: { carovana.passo: 4, racconto: 1 }
      - testo: "Restare sul bordo, per oggi"
        costo: 0
        esito:
          testo: |
            Ti siedi sul bordo della conca e guardi i muti che bevono dalle brocche. Ripartire adesso sarebbe
            come uscire da una stanza a metà di una frase.

  - id: carta-sfc-carovana-fine
    tipo: carta
    area: superficie-fratturata
    immagine: icone/medieval-village-01
    titolo: Quello che c'è sotto la cenere
    sommario: "Il villaggio nella cenere è quasi libero. In ogni casa c'è una cassapanca chiusa, e i muti non la aprono."
    luogo: Superficie Fratturata, il villaggio nella cenere
    requisiti: [carovana.passo == 4]
    testo: |
      Torni alla conca, e i muti hanno già liberato metà del villaggio. Le case hanno ancora i letti fatti e i
      vestiti appesi ai chiodi. In ogni casa c'è una cassapanca chiusa, e nessuno dei muti l'ha aperta.

      La donna dai capelli grigi siede sul suo sgabello e ti guarda come la prima sera. Tiene in grembo un mazzo
      di chiavi di ferro e non le usa.

      Fino alla porta della città ci sono due giorni di cammino, e lo sceriffo in Caserma vorrebbe sapere di un
      villaggio che le mappe non segnano. Intanto le cassapanche sono lì.

      {conoscenze-della-strada Media} Una cassapanca chiusa in una casa abbandonata vale quello che c'è dentro.
      Al mercato dei Ponti nessuno ti chiede da dove viene.
    opzioni:
      - testo: "Restare a vedere che cosa fanno"
        descrizione: "Sono arrivati fin qui senza una parola. Prima o poi faranno qualcosa, e tu vuoi esserci."
        esito:
          titolo: La lingua dei muti
          testo: |
            Resti tre giorni. La terza sera la donna apre la prima cassapanca davanti a te, e dentro ci sono
            attrezzi da campo e una borsa di monete vecchie. Ti mette in mano la borsa, perché a loro non serve.
            La mattina dopo li senti parlare per la prima volta, piano, in una lingua che non conosci.
          effetti: { monete: 350, racconto: 1, tormento: -0.5, carovana.passo: 5, carovana.fine: 1 }
      - testo: "Avvisare la Caserma"
        descrizione: "Un villaggio che le mappe non segnano, a quattro giorni dalla città, è una faccenda per lo sceriffo."
        esito:
          titolo: Il rapporto
          testo: |
            Fai due giorni di strada fino alla Caserma e racconti tutto al sergente di turno, che scrive ogni
            parola. Il furiere ti paga la ricompensa che la Guardia dà a chi segna un luogo nuovo sulle sue
            carte. La pattuglia che va alla conca trova le case aperte e la cenere spazzata, e nessuno dentro.
          effetti: { monete: 350, rep.caserma: 0.5, carovana.passo: 5, carovana.fine: 2 }
      - testo: "Portare via le cassapanche"
        descrizione: "I muti non le aprono e forse non le apriranno mai. Al mercato dei Ponti, invece, qualcuno le apre volentieri."
        esito:
          titolo: Di notte
          testo: |
            Di notte forzi tre cassapanche e ci trovi argento di casa e monete di un conio che non conosci.
            Al mercato dei Ponti vendi tutto in una mattina e nessuno fa domande. La donna dai capelli grigi ti
            ha visto caricare la sacca dal suo sgabello e non ti ha fermat{o|a}.
          effetti: { monete: 350, sospetto: 1, tormento: 1, carovana.passo: 5, carovana.fine: 3 }
      - testo: "Non ancora"
        costo: 0
        esito:
          testo: |
            Ti siedi su uno sgabello vuoto e bevi dalla brocca. La donna non dice niente, e le chiavi restano
            nel suo grembo.

  # ================================================================ il cartografo cieco
  - id: carta-sfc-cartografo-gola
    tipo: carta
    area: superficie-fratturata
    immagine: icone/treasure-map
    titolo: Il cartografo cieco
    sommario: "Sul bordo delle terrazze un vecchio con una benda sugli occhi vuole finire la sua mappa, e gli servono i tuoi occhi."
    luogo: Superficie Fratturata, una tenda sul bordo delle terrazze
    requisiti: [cartografo.passo == 0, cartografo.fine == 0]
    testo: |
      Sul bordo delle terrazze c'è una tenda di tela cerata. Davanti alla tenda un vecchio siede su uno
      sgabello da campo con un rotolo di carta sulle ginocchia e una benda di lino sugli occhi. Quando ti sente
      arrivare gira la testa dalla tua parte.

      «Stivali buoni e passo da città» dice. «Faccio carte della Superficie da quarant'anni, e due inverni fa
      ho perso la vista. Per finire questa mi mancano tre posti.» Srotola la mappa con dita che sanno dove
      stanno i bordi. «La gola a nord dei gradoni non l'ho mai vista. Me la descrivi tu? Pago a lavoro
      finito, come si fa con i rilevatori.»

      {accademiche Media} Le carte della Superficie le vende la Gilda, e nessuna è completa. Una carta intera,
      segnata a mano da chi la conosce, vale quanto un carro.
    opzioni:
      - testo: "Scendere nella gola e descrivergliela"
        descrizione: "Da vicino si vedono le cose che servono a una carta. Però il sentiero che scende è ripido."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La gola a matita
          testo: |
            Scendi fino al fondo della gola e torni con la testa piena di misure. Gli racconti il torrente
            secco sul fondo e la frana che chiude il lato nord. Lui disegna a occhi bendati mentre parli, e
            quando hai finito la gola sulla carta è proprio quella.
          pe: { percezione: 5 }
          effetti: { cartografo.passo: 1 }
        fallimento:
          titolo: Il sentiero ripido
          testo: |
            A metà discesa il sentiero ti scivola sotto i piedi e arrivi in fondo sedut{o|a} sulla ghiaia, con un
            ginocchio sbucciato. Della gola hai visto soprattutto il cielo. Il cartografo ascolta il racconto e
            ripone la matita senza segnare niente.
          effetti: { ferite: 0.5 }
      - testo: "Descrivergliela dall'alto"
        descrizione: "Dal bordo si vede quasi tutto, se lui ti fa le domande giuste."
        costo: 2
        esito:
          titolo: Le domande giuste
          testo: |
            Ti siedi sul bordo e lui ti fa una domanda alla volta, e vuole sapere anche da che parte batte il
            sole. Ci vuole tutto il pomeriggio. Alla fine la gola sulla carta ha i bordi incerti, e a
            lui va bene lo stesso.
          effetti: { cartografo.passo: 1 }
      - testo: "Raccontargli quello che sanno i Raschiatori"
        descrizione: "Al Grifone si parla anche della gola. Una voce verificata gli risparmia la tua fatica."
        requisiti: [informazioni.pettegolezzo >= 1]
        esito:
          titolo: Quello che si dice al Grifone
          testo: |
            Gli ripeti quello che hai sentito al Grifone, dove scendono le squadre e dove la frana ha chiuso il
            passaggio. Lui ti ferma due volte per farsi ripetere un nome. Poi disegna veloce, contento come uno
            che ha trovato una scorciatoia.
          effetti: { informazioni.pettegolezzo: -1, cartografo.passo: 1 }
      - testo: "Tornare un altro giorno"
        costo: 0
        esito:
          testo: |
            Gli dici che passerai un'altra volta. Lui annuisce e arrotola la carta. «Io resto qui, e la gola
            pure» dice.

  - id: carta-sfc-cartografo-terrazze
    tipo: carta
    area: superficie-fratturata
    immagine: icone/footsteps
    titolo: Le terrazze a passi
    sommario: "Il cartografo cieco ha bisogno delle terrazze di basalto misurate a passi, gradone per gradone."
    luogo: Superficie Fratturata, le terrazze di basalto
    requisiti: [cartografo.passo == 1]
    testo: |
      Il cartografo ti aspetta con la mappa già aperta e la gola disegnata a matita. «Adesso le terrazze di
      basalto» dice. «Quelle le ho viste, ma le ho viste male. Mi servono a passi, gradone per gradone.»

      Ti dà una cordicella con un nodo ogni dieci passi e ti fa ripetere tre volte come si contano. I gradoni
      scendono verso sud fino alla pianura, e sui sassi del bordo esterno ci sono le frecce bianche per chi va
      agli scavi.

      {atletica Facile} Sul bordo esterno la roccia è salda. Su quello interno il passo si accorcia senza che
      te ne accorga, e la misura viene sbagliata.
    opzioni:
      - testo: "Misurarle sul bordo esterno"
        descrizione: "Passo lungo e sempre uguale, dalla cima alla pianura. Le gambe devono reggere fino in fondo."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Gradone per gradone
          testo: |
            Scendi i gradoni con il passo di un soldato in marcia e fai un nodo alla cordicella a ogni salto di
            roccia. Torni al tramonto con le cosce che bruciano. Il cartografo ti fa ripetere i numeri due volte
            e li segna senza esitare.
          pe: { atletica: 5 }
          effetti: { cartografo.passo: 2 }
        fallimento:
          titolo: Il gradone storto
          testo: |
            Sul sesto gradone la roccia si sbriciola sotto il tallone e scivoli fino a quello di sotto. Ti
            rialzi con un fianco ammaccato e la cordicella annodata male. Con quei conti la carta verrebbe
            sbagliata, e devi dirglielo.
          effetti: { ferite: 0.5 }
      - testo: "Contarle con la cordicella, piano"
        descrizione: "Un nodo alla volta, senza fretta. Ci vuole il doppio del tempo."
        costo: 2
        esito:
          titolo: Un nodo alla volta
          testo: |
            Tendi la cordicella da un sasso all'altro e conti i nodi a voce alta, gradone dopo gradone. Due
            Raschiatori che salgono dagli scavi si fermano a guardarti e scuotono la testa. Al cartografo quei
            numeri lenti piacciono.
          effetti: { cartografo.passo: 2 }
      - testo: "Pagare un Raschiatore che le conosce"
        descrizione: "Le squadre fanno quei gradoni due volte al giorno. Uno di loro li sa a memoria, e chiede qualcosa per il disturbo."
        requisiti: [monete >= 10]
        esito:
          titolo: A memoria
          testo: |
            Il Raschiatore che fermi sulla strada degli scavi intasca le monete e recita i gradoni uno per uno
            come una filastrocca. Il cartografo lo ascolta con la testa inclinata e alla
            fine ride. «Questo li ha fatti a piedi tutti i giorni» dice.
          effetti: { monete: -10, cartografo.passo: 2 }
      - testo: "Rimandare"
        costo: 0
        esito:
          testo: |
            Gli restituisci la cordicella e dici che oggi non è giornata. Lui la arrotola intorno alle dita
            senza discutere.

  - id: carta-sfc-cartografo-ossa
    tipo: carta
    area: superficie-fratturata
    immagine: icone/crossed-bones
    titolo: Il pianoro contato a lame
    sommario: "Il cartografo cieco vuole il pianoro delle ossa misurato come lo misuravano le carte vecchie, a lame."
    luogo: Superficie Fratturata, il pianoro delle ossa
    requisiti: [cartografo.passo == 2]
    testo: |
      «Il pianoro delle ossa» dice il cartografo, e tocca un punto vuoto della mappa. «Lì i passi non bastano.
      Le carte vecchie lo misurano a lame, cioè contando le armi che affiorano lungo la fila dei morti. Chi
      l'ha fatto prima di me ha sbagliato il conto.»

      Il pianoro sta sotto le terrazze, e la ghiaia grigia è piena di ossa. Le armi sono ruggine e legno
      marcio, e molte si rompono quando le tocchi.

      {resilienza Media} Contare le lame vuol dire contare i morti. Dopo il centesimo la mano comincia a
      segnare più piano.
    opzioni:
      - testo: "Contare le lame una per una"
        descrizione: "Lungo tutta la fila, senza saltarne una. Bisogna riconoscere un'arma anche quando è solo ruggine."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il conto giusto
          testo: |
            Cammini lungo la fila con un carboncino e un pezzo di tela, e segni ogni lama con una tacca. Ne
            trovi molte più di quante ne dica la carta vecchia. Il cartografo ascolta il numero e resta zitto
            per un po', poi lo scrive in grande in mezzo al pianoro.
          pe: { accademiche: 5 }
          effetti: { cartografo.passo: 3 }
        fallimento:
          titolo: Le tacche
          testo: |
            A metà fila perdi il conto e ricominci, poi lo perdi di nuovo. Quando ti rialzi hai la tela piena di
            tacche che non vogliono dire niente. La notte sogni di contare, e a ogni numero c'è una faccia.
          effetti: { tormento: 1 }
      - testo: "Contarle a gruppi"
        descrizione: "Dieci alla volta, a colpo d'occhio. Viene meno preciso, ma lui si accontenta."
        costo: 2
        esito:
          titolo: Dieci alla volta
          testo: |
            Conti le lame a gruppi di dieci e fai un mucchietto di sassi per ogni gruppo. Ci vuole fino al
            tramonto. Il cartografo tocca i sassi uno per uno quando glieli porti in un fazzoletto, e annuisce.
          effetti: { cartografo.passo: 3 }
      - testo: "Usare quello che sai della battaglia"
        descrizione: "Hai già letto quel pianoro. Sai da che parte stavano e dove sono caduti."
        quando: [sup3.campo-storia >= 1]
        esito:
          titolo: Verso la crepa
          testo: |
            Gli racconti la battaglia come l'hai letta tu, con gli scudi rivolti alla crepa. Lui
            capisce subito perché il conto vecchio era sbagliato, e corregge la carta senza che tu debba
            tornare laggiù.
          effetti: { cartografo.passo: 3 }
      - testo: "Rimandare"
        costo: 0
        esito:
          testo: |
            Gli dici che il pianoro può aspettare. «Ha aspettato abbastanza anche prima» dice lui, e piega la
            mappa in quattro.

  - id: carta-sfc-cartografo-fine
    tipo: carta
    area: superficie-fratturata
    immagine: icone/scroll-unfurled
    titolo: Il passaggio che non c'è
    sommario: "La mappa del cartografo cieco è finita, e mostra sotto le terrazze un passaggio che nessuna carta segna."
    luogo: Superficie Fratturata, la tenda del cartografo
    requisiti: [cartografo.passo == 3]
    testo: |
      Il cartografo ha passato la notte a ripassare la mappa, e adesso ti chiede di guardarla al posto suo. Ci
      sono la gola, le terrazze contate a passi e il pianoro contato a lame. Messe insieme, le tre misure
      lasciano sotto le terrazze una striscia dritta e larga quanto una strada di carri, che nessuna carta della
      Gilda segna.

      «Allora c'è» dice, e si passa una mano sulla benda. «L'ho cercato per quarant'anni. La Gilda pagherebbe
      bene per una strada nuova. Qualcun altro pagherebbe di più perché nessuno la trovi.»

      {politica-ed-economia Media} Una strada che non passa dalle porte della Gilda non paga dazio. Toglierebbe
      alla Casa dei Nodi metà delle sue carovane.
    opzioni:
      - testo: "Venderla alla Gilda"
        descrizione: "Alla Casa dei Nodi una strada nuova si paga bene, e lui ti darà la tua parte."
        esito:
          titolo: La Casa dei Nodi
          testo: |
            Lo accompagni alla Casa dei Nodi. Un funzionario guarda la carta con la lente per un'ora e la paga
            senza contrattare. Sulla scala il cartografo conta la tua parte al tatto e te la mette in mano.
            Dice che quella strada adesso ha un padrone, e che almeno lui l'ha vista prima.
          effetti: { monete: 280, rep.gilda: 0.5, cartografo.passo: 4, cartografo.fine: 1 }
      - testo: "Tenerla"
        descrizione: "L'hai vista tu. Lui dice che una carta è di chi ha camminato i posti."
        esito:
          titolo: Di chi ha camminato
          testo: |
            Il cartografo arrotola la mappa e te la mette fra le mani. «È tua, perché i posti li hai camminati
            tu» dice. Poi ti dà anche la borsa che teneva da parte per chi gli faceva da occhi. La carta la
            tieni sul fondo della sacca, e la sera ogni tanto la apri.
          effetti: { monete: 280, racconto: 1, cartografo.passo: 4, cartografo.fine: 2 }
      - testo: "Bruciarla con lui"
        descrizione: "Una strada che nessuno conosce resta di nessuno. Lui l'ha cercata per una vita, ma forse preferisce così."
        esito:
          titolo: Il fuoco davanti alla tenda
          testo: |
            Accendete un fuoco davanti alla tenda. Lui tiene la carta sopra la fiamma con tutte e due le mani
            finché non gli scotta le dita. Poi ti paga quello che aveva promesso fino all'ultima moneta, perché
            un lavoro è un lavoro. Restate seduti accanto alla cenere fino a sera.
          effetti: { monete: 280, tormento: -1, cartografo.passo: 4, cartografo.fine: 3 }
      - testo: "Pensarci ancora"
        costo: 0
        esito:
          testo: |
            Gli dici che ci vuole pensare. Lui ripiega la carta e se la infila sotto la giacca, dalla parte del
            cuore.
