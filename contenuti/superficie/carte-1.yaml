# Superficie Fratturata, carte del mazzo (prima parte): dieci incontri dalla tabella del master, riscritti.
# 1 lo sciame di droni ciechi (scontro sciame-di-droni-ciechi; con osservatore.marchio 1 i droni ti lasciano
# passare), 3 il corpo mineralizzato (i "fermati", ripetibile), 4 la pozza che ricorda (bere imposta
# pozza.segno, e la seconda volta l'opzione cambia), 6 l'Osservatore senza volto (imposta osservatore.marchio;
# il visore una volta sola, con oggetto.visore == 0), 10 l'accampamento ancora caldo (le tracce portano al
# seguito carta-sup-accampamento-tracce, i carbonai di Pannion), 11 il cacciatore ferito, 13 la tempesta di
# cenere, 14 i predoni disorganizzati (scontro predoni-disorganizzati), 15 il vecchio viandante, 17 lo sciame
# di insetti. Tutte le carte possono ripetersi: gli incontri unici cambiano con quando sulle opzioni.
quality:
  - { id: pozza.segno, nome: "Il segno della pozza", categoria: stato, nascosta: true, descrizione: "1 se hai bevuto da una pozza che ricorda, e la Marea Grigia ti ha lasciato un segno chiaro sul labbro." }

storylet:
  # ================================================================ 1 · lo sciame di droni ciechi
  - id: carta-sup-sciame-di-droni
    tipo: carta
    area: superficie-fratturata
    immagine: icone/triorb
    titolo: Lo sciame cieco
    sommario: "Fra due anelli inclinati il metallo spinge fuori sfere che ronzano, e si voltano ogni volta che fai un passo."
    luogo: Superficie Fratturata, fra gli anelli inclinati di una terrazza
    testo: |
      Il sentiero passa fra due anelli di metallo piantati di sbieco nel
      basalto, e sulla loro superficie lucida tremano dei riflessi che
      all'inizio prendi per sole. Poi uno dei riflessi si stacca. È una sfera
      grande poco più di un pugno, segnata da linee incise che si accendono a
      intermittenza, e resta sospesa a mezz'aria correggendosi a scatti secchi,
      come una mosca contro un vetro. Dietro di lei il metallo ne spinge fuori
      un'altra, e poi altre ancora.

      {tecnologia Media} Le linee si accendono sempre nello stesso ordine,
      dall'alto in basso, come una guardia che ripete la parola d'ordine.

      Fai un passo e la sfera più vicina si gira verso di te. Ti schiarisci la
      gola e due o tre si avvicinano piano, con un ronzio sottile che ti entra
      nei denti. Le sfere non hanno occhi. Su una pietra lì accanto qualcuno
      ha dipinto in bianco una freccia e la parola *piano*, e la vernice è
      colata giù prima di asciugare.

      {furtivita Facile} Ghiaia sciolta da qui all'anello, e sotto la roccia
      nuda. Ogni passo avrà il suo rumore, a meno di appoggiare prima il
      tallone.

      *Sentono il passo.* Le gambe ti si sono già irrigidite da sole, e il
      ronzio nei denti non accenna a calare.
    opzioni:
      - testo: "Combattere lo sciame"
        descrizione: "Le sfere sono fragili, però il metallo continua a spingerne fuori finché qualcuno batte i piedi."
        combattimento: sciame-di-droni-ciechi
        vittoria:
          titolo: Metallo che tace
          testo: |
            L'ultima sfera la prendi in pieno mentre ti gira intorno, e cade
            sulla ghiaia con un rumore da pentolino. Le linee incise si spengono
            una dopo l'altra, e il silenzio che resta ti fischia nelle orecchie.
            Nell'anello più vicino si è aperta una fessura
            dove prima il metallo era liscio, e dentro c'è un guscio sigillato,
            tiepido come un uovo appena raccolto. Raccogli anche i pezzi delle
            sfere rotte, che hanno i bordi taglienti.
          effetti: { reperto.sigillato: 1, reliquie.scheggia: 2 }
        sconfitta:
          titolo: Il ronzio nei denti
          testo: |
            Le sfere ti colpiscono come sassi tirati da una fionda, e ogni colpo
            che dai a vuoto ne fa uscire altre dagli anelli. Alla fine corri
            giù per i gradoni senza guardare dove metti i piedi, con le braccia
            sopra la testa, e il ronzio ti segue per un bel tratto prima di
            spegnersi. Quella sera continui a
            sentirlo nelle otturazioni, anche dopo che hai smesso di pensarci.
          effetti: { tormento: 0.5 }

      - testo: "Allontanarsi a passi lenti"
        descrizione: "Un piede alla volta, con il peso sul tallone. Se un sasso si muove lo sentono anche loro."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Il peso sul tallone
          testo: |
            Appoggi prima il tallone e solo dopo la pianta, e fra un passo e
            l'altro conti fino a cinque. Le sfere ti girano intorno
            senza decidersi, e a metà strada una si posa sulla ghiaia accanto
            al tuo stivale e si spegne. Trattieni il fiato finché non ti brucia
            il petto. Quando sei fuori dagli anelli ti
            accorgi di avere ancora in mano una scheggia di metallo che hai
            raccolto senza volerlo, per tenere ferme le dita.
          pe: { furtivita: 8 }
          effetti: { reliquie.scheggia: 1 }
        fallimento:
          titolo: Il sasso sbagliato
          testo: |
            A metà strada un sasso ti rotola sotto la suola e batte contro un
            altro, con un tic piccolo e chiarissimo. Lo sciame si gira tutto
            insieme, come un branco di pesci, e ti arriva addosso prima che tu
            abbia finito di imprecare. Ne esci
            correndo, con le braccia sopra la testa e due lividi tondi sulla
            schiena, grandi quanto le sfere.
          effetti: { ferite: 1 }

      - testo: "Restare immobile finché se ne vanno"
        descrizione: "Se non sentono nessun passo si stancano presto. Bisogna vedere se ti stanchi prima tu."
        costo: 2
        prova: { attributo: fisico, abilita: resistenza, difficolta: Facile }
        successo:
          titolo: La statua
          testo: |
            Stai fermo con il peso su tutte e due le gambe e respiri dal naso,
            piano. Una sfera ti si ferma davanti alla faccia, poi se ne va. Il
            sole si sposta di un palmo. Una per volta le sfere tornano
            verso gli anelli e ci affondano dentro, come sassi nel fango, e
            l'ultima lascia aperta la fessura da cui è uscita. Quando finalmente
            muovi le dita intorpidite, dentro la fessura trovi un guscio
            sigillato incastrato di traverso.
          pe: { resistenza: 6 }
          effetti: { reperto.sigillato: 1 }
        fallimento:
          titolo: Il crampo
          testo: |
            Dopo un tempo lunghissimo ti prende un crampo al polpaccio, e la
            gamba si piega da sola, senza chiederti il parere. Basta quel mezzo
            passo. Lo sciame ti è
            addosso in un attimo, e te lo scrolli di dosso soltanto quando sei
            tre gradoni più in basso. Zoppichi, e il sangue di un taglio sul
            sopracciglio ti cola caldo negli occhi.
          effetti: { ferite: 1 }

      - testo: "Lasciare che ti riconoscano"
        descrizione: "Il segno dell'Osservatore ti formicola sotto la pelle da quando le sfere sono uscite."
        quando: [osservatore.marchio == 1]
        esito:
          titolo: Fatti da parte
          testo: |
            Cammini dritto verso gli anelli senza fare piano. Le sfere ti
            vengono incontro, si fermano a un palmo dalla tua faccia e le
            linee incise cambiano colore, tutte insieme, fino al bianco. Poi si
            scostano e ti lasciano un corridoio.

            {resilienza Media} Il segno brucia, e tu lo lasci bruciare. Ti
            hanno riconosciuto, e per oggi decidi di non chiederti come.

            Il segno sotto la pelle ti brucia finché non sei passato, e nell'anello
            alla tua sinistra si apre una fessura, con un guscio sigillato dentro,
            come una mano che ti porge qualcosa.
          effetti: { reperto.sigillato: 1, reliquie.scheggia: 1, tormento: 0.5 }
      - testo: "Contare i tempi del ronzio"
        descrizione: "Le sfere si girano verso ogni rumore. Se capisci quanto ci mettono a voltarsi, un sasso lanciato lontano può portarle via dall'anello."
        prova: { attributo: mentale, abilita: [percezione, tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il sasso sulla terrazza di sotto
          testo: |
            Resti fermo e conti sottovoce, con le labbra che si muovono appena.
            Fra un rumore e il giro delle sfere
            passa sempre lo stesso tempo, quello di due respiri lenti, e dopo il
            giro restano voltate finché non succede qualcos'altro. Allora
            raccogli un sasso piatto e lo lanci giù, sulla terrazza di sotto,
            con un movimento morbido del polso. Lo
            sciame scende dietro al rimbalzo tutto insieme, e tu hai il tempo di
            arrivare all'anello e infilare le dita nella fessura ancora aperta.
            Il guscio che ne tiri fuori è tiepido, e pesa più di quanto
            prometta la sua grandezza.
          pe: { percezione: 8 }
          effetti: { reperto.sigillato: 1 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Conti male, oppure le sfere non contano come te, e la seconda
            ipotesi ti piace ancora meno della prima. Il sasso piatto
            rimbalza sulla terrazza di sotto, e lo sciame invece di scendere si
            gira verso la mano che l'ha lanciato. Te lo ritrovi addosso prima di
            aver abbassato il braccio. Ne esci a gomitate giù per i gradoni, con
            una guancia aperta e le nocche spellate.
          effetti: { ferite: 1 }

      - testo: "Far suonare le monete sulla terrazza di sotto"
        descrizione: "Il metallo che tintinna fa più rumore di qualsiasi passo. Le monete però, laggiù fra le crepe, non le ritrovi più."
        requisiti: [monete >= 5]
        esito:
          titolo: Il prezzo del passaggio
          testo: |
            Prendi una manciata di monete e le lanci giù per i gradoni, larghe,
            perché tintinnino il più a lungo possibile. Lo sciame scende dietro
            al rumore come un branco di passeri dietro alle briciole, e resta
            laggiù a ronzare sopra le crepe dove le monete sono finite. Tu
            intanto arrivi all'anello e infili la mano nella fessura. Ne tiri
            fuori un guscio sigillato, e mentre te ne vai senti ancora, di
            sotto, l'ultima moneta che rotola.

            {conoscenze-della-strada Facile} Il pedaggio più caro della
            Superficie, e nessuno ti rilascia la ricevuta.
          effetti: { monete: -5, reperto.sigillato: 1 }


  # ================================================================ 3 · il corpo mineralizzato
  - id: carta-sup-un-fermato
    tipo: carta
    area: superficie-fratturata
    immagine: icone/stoned-skull
    titolo: Un fermato
    sommario: "In una piega della terrazza un Raschiatore è rimasto in piedi con il braccio teso, e la roccia gli è salita fino al cuore."
    luogo: Superficie Fratturata, una piega riparata lungo la strada degli scavi
    testo: |
      Lungo la strada degli scavi, in una piega della terrazza dove il vento
      non arriva, c'è un Raschiatore in piedi con un braccio teso in avanti. Ti
      ci vogliono parecchi passi per capire che è fuso nella roccia. Il
      basalto gli sale fino ai fianchi, e più in alto la carne ha preso lo
      stesso colore nero e lucido, tanto che la tuta da scavo e le ossa sono
      diventate un pezzo solo. Vene sottili di metallo gli corrono lungo il
      collo e luccicano quando sposti la testa. Il viso è stirato di lato in
      una smorfia, e la calotta del cranio è aperta in due.

      {medicina Media} La calotta si è aperta da dentro, con i bordi
      rivolti in fuori. La roccia è cresciuta finché le è servito spazio.

      I Raschiatori li chiamano fermati, e lungo questa strada ne trovano uno
      ogni tanto. *Stava andando da qualche parte, e aveva fretta.* Chi passa
      lascia un sasso ai loro piedi, per abitudine. Ai piedi di questo ce ne
      sono già tre, e su uno c'era un nome scritto col carbone, che la
      pioggia ha lavato via.

      {empatia Media} Quel nome l'ha scritto qualcuno che lo conosceva,
      ripassando le lettere due volte.
    opzioni:
      - testo: "Toccarlo"
        descrizione: "Il braccio teso è a portata di mano, e da vicino la roccia sembra più calda dell'aria."
        esito:
          titolo: Il passo che non finisce
          testo: |
            Appena le tue dita sfiorano il polso, nel petto del fermato si apre
            una crepa, piano, senza rumore. Il braccio teso si allunga ancora
            di un dito, la mano si apre a cercare qualcosa, e tu fai un salto
            indietro che ti porta contro la parete, con il cuore che ti batte
            in gola. Poi il corpo si sbriciola
            tutto insieme in frammenti neri e lisci. Fra i frammenti c'è un
            guscio sigillato che teneva stretto sotto il braccio.
          effetti: { reperto.sigillato: 1, reliquie.scheggia: 2, tormento: 0.5 }

      - testo: "Staccargli l'attrezzatura dalla cintura"
        descrizione: "Alla cintura gli è rimasto un attrezzo dei Precursori, fuso insieme al resto. Va tagliato lungo le vene di metallo, senza sbagliare."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Lungo le vene
          testo: |
            Le vene di metallo seguono un disegno, e la roccia intorno è più
            tenera. Ci lavori con la punta del coltello per un'ora buona, con il
            fiato trattenuto e una goccia di sudore che ti pende dal naso e non
            si decide a cadere. Alla fine l'attrezzo viene via intero, con
            un'impugnatura che non è fatta per una mano umana, e dietro c'è il
            guscio sigillato che il Raschiatore portava nella borsa. Il fermato
            resta in piedi, con il braccio teso, un poco più leggero.
          pe: { tecnologia: 8 }
          effetti: { parte.impugnatura-1: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: Polvere grigia
          testo: |
            Il coltello scivola fuori dalla vena e affonda nella roccia
            sbagliata. Il fermato si incrina dalla cintura in su e crolla, e da
            dentro esce uno sbuffo di polvere grigia che ti finisce dritto in
            gola. Tossisci per un pezzo, piegato in due fra i frammenti.

            {medicina Facile} Sputa, e poi sputa ancora. Quella polvere nei
            polmoni non ci deve restare.

            Ne raccogli qualcuno, quelli che hanno ancora un'incisione.
          effetti: { contaminazione: 1, reliquie.scheggia: 1 }

      - testo: "Esaminarlo senza toccarlo"
        descrizione: "Girargli intorno e guardarlo bene, da tutti i lati, finché si capisce che cosa stava facendo."
        prova: { attributo: mentale, abilita: [medicina, percezione], difficolta: Media }
        successo:
          titolo: Dove guardava
          testo: |
            Il fermato ha i piedi rivolti verso la strada e il busto girato verso una
            crepa poco più in là, che da qui manda un filo di luce azzurra. Si era
            voltato a guardarla quando la roccia l'ha preso, e quello che è salito dal
            basso è salito in fretta, perché le dita della mano tesa sono ancora
            aperte, senza il tempo di chiudersi. Ti accorgi che anche la tua mano, per
            conto suo, si è aperta. Ti segni la crepa a mente, e la racconterai a chi
            scende agli scavi.
          pe: { medicina: 8 }
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: La smorfia
          testo: |
            Ti avvicini al viso per vedere meglio le vene del collo, e resti a
            guardare la smorfia più del necessario. Da vicino gli occhi sono
            aperti, e dentro c'è la stessa roccia lucida del resto, che ti
            restituisce un riflesso piccolo e storto della tua faccia. Quella
            notte, quando chiudi i tuoi, li vedi ancora per un pezzo.
          effetti: { tormento: 1 }

      - testo: "Lasciare un sasso e andare avanti"
        descrizione: "Si fa così, da queste parti. Il sasso lo scegli tu."
        costo: 0
        esito:
          titolo: Il quarto sasso
          testo: |
            Scegli un sasso piatto e lo posi accanto agli altri tre, con la
            parte liscia in alto, e ti pulisci le dita sui calzoni. Ti sembra
            il minimo. Riprendi la strada e per
            un tratto senti sulla schiena il braccio teso del fermato, che
            indica sempre lo stesso punto davanti a sé.

  # ================================================================ 4 · la pozza che ricorda
  - id: carta-sup-la-pozza-che-ricorda
    tipo: carta
    area: superficie-fratturata
    immagine: icone/droplet-splash
    titolo: La pozza che ricorda
    sommario: "In fondo a una conca senza crepe c'è una pozza lattiginosa, ferma, che ti rimanda una sera della tua vita andata diversamente."
    luogo: Superficie Fratturata, una conca liscia fra due terrazze
    testo: |
      Il terreno si abbassa in una conca dai bordi lisci e senza crepe. In
      fondo c'è una pozza di liquido lattiginoso, ferma come una lastra, e
      sulla sua superficie non si specchiano né il cielo né la tua faccia.
      Mentre scendi verso il bordo i rumori si spengono uno dopo l'altro
      finché senti soltanto il sangue nelle orecchie, e gli ultimi a sparire
      sono i tuoi passi sulla ghiaia.

      {natura Media} Sul bordo non cresce niente, nemmeno il lichene che
      sulla Superficie attecchisce dappertutto. La Marea, quando ristagna,
      la conca se la tiene tutta per sé.

      Poi, senza preavviso, ti torna in mente una sera precisa. C'è la porta
      della prima casa che ricordi e c'è qualcuno sulla soglia che ti chiede
      di restare. Tu sai bene di aver detto di no. Nella pozza invece dici di
      sì, e la sera va avanti tranquilla con le parole giuste e una cena che
      non hai mai mangiato, coerente in ogni cosa fino al piatto sbeccato da
      un lato. *Questa vita l'ha vissuta qualcuno.* La superficie si increspa
      appena, nel punto in cui il tuo pensiero si è fermato.

      {resilienza Facile fallita} Dovresti tirarti indietro, e lo sai. Intanto
      sei sceso di un altro passo, e la ghiaia non ha fatto rumore.
    opzioni:
      - testo: "Lasciarsi andare al ricordo"
        descrizione: "Restare nella sera che non c'è stata e guardarla fino in fondo. Si capiscono delle cose, e alcune restano."
        esito:
          titolo: L'altra sera
          testo: |
            Ti siedi sul bordo e lasci che la sera vada avanti. Vedi la faccia
            di chi ti aveva chiesto di restare mentre ti ascolta, e capisci
            finalmente che cosa voleva dirti allora, con una chiarezza che non
            hai mai avuto e che ti stringe la gola. Quando la pozza torna ferma
            il sole è più basso, e hai le guance bagnate senza ricordare quando
            è cominciato. Ti
            rialzi con le gambe intorpidite, e la domanda su come sarebbe
            andata te la porti dietro per tutta la strada.
          pe: { empatia: 10 }
          effetti: { tormento: 0.5 }

      - testo: "Resistere"
        descrizione: "Tenere a mente quello che è successo davvero e tirarsi indietro, prima che la sera diventi tua."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Quello che è successo davvero
          testo: |
            Ti ripeti a mezza voce le parole che hai detto davvero quella sera,
            anche quelle sgarbate, soprattutto quelle. A poco a poco la porta e
            la cena si sfilacciano, e la pozza torna
            liscia e opaca. Ti accorgi di stringere i pugni tanto da avere i
            segni delle unghie nei palmi, e risali dalla conca senza voltarti,
            con l'impressione che per stavolta la pozza abbia rinunciato.
          pe: { resilienza: 10 }
        fallimento:
          titolo: La cena che non hai mangiato
          testo: |
            Ti tiri indietro troppo tardi. Quando risali dalla conca hai in bocca
            il sapore di una minestra che non hai mai assaggiato, buona, troppo
            salata da un lato, e per tutto il
            giorno, ogni volta che qualcuno ti rivolge la parola, ci metti un
            attimo a ricordare quale delle due vite stai facendo.
          effetti: { tormento: 1 }

      - testo: "Bere dalla pozza"
        descrizione: "Il liquido è fresco e ti tira verso di sé. Chi beve dalla Marea porta via qualcosa, e qualcosa ci lascia."
        quando: [pozza.segno == 0]
        esito:
          titolo: Il segno sul labbro
          testo: |
            Bevi dal palmo. Il liquido è freddo e senza sapore, e appena lo
            mandi giù il dolore delle ferite si scioglie come neve sul
            dorso della mano, e anche la sera dentro la pozza ti pesa di meno.
            Al primo ruscello ti guardi nell'acqua. Sul labbro di sotto ti è
            rimasto un segno chiaro, sottile, che non viene via strofinando e
            al freddo diventa un poco più bianco.

            {medicina Media} Le ferite si sono chiuse troppo in fretta. Quello
            che guarisce così in fretta lo paghi più avanti.
          effetti: { ferite: -1, tormento: -0.5, contaminazione: 1 }
          imposta: { pozza.segno: 1 }

      - testo: "Bere di nuovo"
        descrizione: "Il segno sul labbro si è fatto freddo appena hai visto la pozza. Lei, a quanto pare, ti conosce."
        quando: [pozza.segno >= 1]
        esito:
          titolo: La pozza ti viene incontro
          testo: |
            Non fai in tempo a chinarti che la superficie si solleva lenta
            verso la tua mano, con la confidenza di un cane che riconosce il
            padrone. Bevi, e il corpo ti si rimette a posto con uno
            scricchiolio di ossa che senti fin nei denti. Nella pozza la
            sera di prima è andata avanti di qualche ora, senza di te. Il
            segno sul labbro adesso arriva fino all'angolo della bocca.
          effetti: { ferite: -1.5, contaminazione: 1.5 }

  # ================================================================ 6 · l'Osservatore senza volto
  - id: carta-sup-l-osservatore
    tipo: carta
    area: superficie-fratturata
    immagine: icone/android-mask
    titolo: L'Osservatore senza volto
    sommario: "In mezzo al pianoro c'è una figura liscia e alta, senza faccia. Finché la guardi resta ferma."
    luogo: Superficie Fratturata, un pianoro di ghiaia sotto le terrazze
    testo: |
      Sul pianoro, a una cinquantina di passi, c'è una figura alta e liscia,
      ritta in mezzo alla ghiaia. Sembra ricavata da un solo blocco di
      materiale grigio chiaro senza giunture, e dove dovrebbe avere la faccia
      la superficie continua uguale, come il dorso di un cucchiaio.
      Finché la tieni d'occhio non si muove di un pollice.

      {tecnologia Difficile fallita} Cerchi una giuntura o una vite, qualunque
      prova che qualcuno l'abbia costruita. Trovi soltanto un principio di
      mal di testa.

      Ti chini a stringere la fibbia di uno stivale, e quando rialzi la testa
      la figura è più vicina, di un tratto che non sapresti misurare. La
      ghiaia intorno ai suoi piedi è intatta, e anche fra voi due resta
      liscia e senza orme. Una lucertola di roccia le passa fra i piedi e si
      accuccia nella sua ombra, l'unica del pianoro.

      {furtivita Media} Fra te e il bordo del pianoro ci sono cento passi di
      ghiaia scoperta, e nemmeno un sasso dietro cui sparire.

      A forza di guardarla ti sembra che sia lei a prendere le misure a te. Il
      sudore ti si raffredda sotto il colletto.
    opzioni:
      - testo: "Voltarle le spalle e proseguire"
        descrizione: "Se le volti le spalle forse ti lascia andare. Oppure ti segue."
        quando: [osservatore.marchio == 0]
        esito:
          titolo: Il contatto
          testo: |
            Cammini senza voltarti, e ogni volta che non resisti e ti giri la
            trovi più vicina. Alla fine smetti di girarti, e la nuca ti formicola
            come se ci fosse appoggiato un dito. Quando il pianoro è
            quasi finito la senti arrivare senza rumore, e due dita fredde e
            senza unghie ti toccano la tempia. Per un lungo momento ti
            vedi dall'alto, da molti punti insieme, mentre cammini su una
            ghiaia che ti conta i passi. Quando torni in te sei in ginocchio, e
            la figura è sparita.
          effetti: { tormento: 1, racconto: 1 }

      - testo: "Andarle incontro"
        descrizione: "Camminarle davanti e guardarla dove non ha la faccia. Qualunque cosa faccia, la farà a te."
        quando: [osservatore.marchio == 0]
        esito:
          titolo: Il marchio
          testo: |
            Le vai incontro a passo normale, anche se le ginocchia vorrebbero
            un passo diverso, e lei ti lascia arrivare. Da vicino è più alta di
            quanto sembrasse, e liscia fino a darti il capogiro.
            Si piega con un movimento senza articolazioni e ti appoggia il
            palmo sul dorso della mano. Il freddo ti entra sotto la pelle e ci
            resta, in un cerchio piccolo come una moneta. Quando sollevi la
            testa la figura si sta già allontanando, e il cerchio sulla mano,
            ogni tanto, si accende di un azzurro pallido.
          effetti: { tormento: 0.5 }
          imposta: { osservatore.marchio: 1 }

      - testo: "Lasciare che ti guardi"
        descrizione: "Ti ha già segnato una volta, e il cerchio sulla mano adesso è freddo. Ti riconosce."
        quando: [osservatore.marchio == 1]
        esito:
          titolo: Ti riconosce
          testo: |
            Resti dove sei, con le mani lungo i fianchi perché non sai dove
            altro metterle. La figura si ferma a un braccio da te e piega la
            testa liscia da una parte, come i cani quando sentono un fischio, e
            il cerchio sulla tua mano si accende. Poi apre un palmo che prima
            non aveva, e sul palmo c'è un guscio sigillato. Lo prendi, perché
            il palmo resta aperto finché non lo prendi, e la figura torna
            indietro sulla ghiaia senza lasciare impronte.
          effetti: { reperto.sigillato: 1, tormento: 0.5 }

      - testo: "Studiarla con calma"
        descrizione: "Non distogliere gli occhi e capire come è fatta. Ci vuole testa, e si rischia di vedere più di quanto si vorrebbe."
        quando: [oggetto.visore == 0]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: La lente
          testo: |
            Ti siedi sulla ghiaia e la guardi senza battere le palpebre più del
            necessario. Dopo un'ora vedi la cucitura di luce che le corre lungo
            il petto, e capisci che la figura registra tutto quello che vede e
            lo manda giù per le crepe azzurre, lungo i fili di luce che corrono
            sotto le terrazze fino al Nodo dei Precursori.

            {accademiche Difficile} Il Nodo dei Precursori, nei testi, è un nome
            in fondo a una mappa. Adesso sai che ci arrivano dei rapporti.

            Quando ti alzi le cade qualcosa ai piedi, una lente montata su un
            archetto di metallo, come si scarta un pezzo consumato.
          pe: { tecnologia: 10 }
          effetti: { oggetto.visore: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Registrato
          testo: |
            Ti sforzi di capire come è fatta, e dopo un po' gli occhi ti
            lacrimano. Batti le palpebre una volta sola, e la figura ti è
            davanti, alta sopra di te. Per un attimo sulla superficie liscia
            compare la tua faccia, che ti imita con un poco di ritardo e con
            un'aria più stanca della tua. Poi si
            volta e se ne va, e la tua faccia se la porta via con sé.
          effetti: { tormento: 1 }

      - testo: "Studiarla di nuovo"
        descrizione: "Della cucitura di luce sul petto sai già qualcosa. Si può imparare il resto, se ti lascia guardare."
        quando: [oggetto.visore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il verso in cui si gira
          testo: |
            Stavolta la guardi sapendo dove guardare. La cucitura di luce sul
            petto si accende sempre dal lato delle terrazze, e la figura si
            gira verso gli anelli di metallo ogni volta che lontano un drone
            si stacca dal suo. Ne ricavi abbastanza da farci una buona storia da
            vendere ai Raschiatori del Grifone, che la pagheranno in birra e in
            domande.
          pe: { tecnologia: 6 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Troppo a lungo
          testo: |
            Resti a guardarla finché la luce del pomeriggio cambia, e quando
            finalmente ti alzi hai la testa piena di ronzii e non ricordi più
            da che parte sei arrivato al pianoro. Per tornare sulla strada ti
            ci vuole molto più del dovuto, e per tutto il tempo hai la
            sensazione di camminare dentro un disegno.
          effetti: { tormento: 0.5 }

      - testo: "Andarsene senza fretta"
        descrizione: "Ti conosce, e forse ti lascia andare per conto tuo."
        quando: [osservatore.marchio == 1]
        costo: 0
        esito:
          titolo: Fino al bordo
          testo: |
            Ti avvii verso le terrazze a passo tranquillo. La figura ti segue a
            distanza fissa fino al bordo del pianoro, e lì si ferma. Quando ti
            volti per l'ultima volta è ancora al suo posto, con la testa
            liscia girata verso di te, e la lucertola di roccia di nuovo nella
            sua ombra. Alzi una mano, senza sapere bene perché.

  # ================================================================ 10 · l'accampamento ancora caldo
  - id: carta-sup-accampamento-ancora-caldo
    tipo: carta
    area: superficie-fratturata
    immagine: icone/campfire
    titolo: L'accampamento ancora caldo
    sommario: "Fra due spuntoni di roccia qualcuno ha lasciato il fuoco acceso e la cena a metà, ed è andato via in fretta."
    luogo: Superficie Fratturata, un riparo fra due spuntoni di roccia
    testo: |
      Fra due spuntoni di roccia trovi i resti di un accampamento. Il fuoco al
      centro è spento, ma quando avvicini la mano alla cenere senti ancora il
      calore della brace. Una pentola è rovesciata su un fianco, con la
      minestra seccata attaccata al fondo, e due coperte sono rimaste a terra.
      Una delle due è stata trascinata per qualche passo, e ha un lembo
      annodato a un cordino che qualcuno ha tirato a sé correndo.

      {conoscenze-della-strada Media} Chi vive di strada si porta via la
      pentola anche quando scappa. Questi sono gente che la sera, di solito,
      torna a dormire sotto un tetto.

      Accanto al fuoco la terra ha una crepa sottile, lunga quanto un braccio,
      e sui bordi c'è una patina chiara, simile a latte seccato. Intorno le
      impronte sono tante e confuse. Alcune vanno verso la strada, altre verso
      le terrazze basse. Su una pietra piatta è rimasta una tazza di latta con
      il manico riparato col fil di ferro, ancora mezza piena. *Hanno lasciato
      la tazza, e la tazza non si lascia.* Senza volerlo ti metti a guardare
      dove appoggi i piedi.

      {resistenza Media fallita} Ti accucci accanto alla brace per scaldarti
      le mani, e le ginocchia ti ricordano quanta strada hai fatto da
      stamattina, una per una.
    opzioni:
      - testo: "Seguire le tracce"
        descrizione: "Fra tante orme confuse ce ne saranno due che vanno davvero da qualche parte. Bisogna trovarle."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Le orme buone
          testo: |
            Le orme verso la strada sono vecchie, e quelle verso le terrazze
            basse sono di un mulo. Le orme buone sono quelle di una donna e di
            un ragazzo, che scappano di corsa nella direzione opposta al fuoco
            e girano intorno a un masso dove il ragazzo è caduto in ginocchio.
            Le segui giù per due gradoni fino a una sporgenza, con il passo
            leggero di chi non vuole spaventare nessuno, e lì sotto qualcuno
            trattiene il fiato.
          pe: { natura: 5 }
          segue: carta-sup-accampamento-tracce
        fallimento:
          titolo: Le orme sbagliate
          testo: |
            Segui una fila di orme che ti sembra chiara, e ne sei così contento
            che non ti fai domande. Ti porta in tondo
            fra i gradoni fino a una chiazza di nebbia grigia, bassa, ferma
            all'altezza delle caviglie. Te ne accorgi quando ci sei già dentro
            fino ai polpacci. Torni indietro di corsa, con il freddo che ti
            risale le gambe, e del campo non ritrovi più nemmeno il fumo.
          effetti: { contaminazione: 1 }

      - testo: "Aspettare che qualcuno torni"
        descrizione: "La tazza è mezza piena, e chi l'ha lasciata ci ripenserà. Ci vuole pazienza, e poi le parole giuste."
        costo: 2
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: Il ragazzo della coperta
          testo: |
            Verso sera dai gradoni scende un ragazzo magro, con la faccia nera
            di carbone, che striscia verso la coperta. Gli parli piano e senza
            alzarti, con le mani bene in vista sulle ginocchia. Ti racconta
            che fa il carbonaio a Pannion con la sorella
            maggiore, e che stanotte la crepa accanto al fuoco ha cominciato a
            fischiare e da sotto è salita una nebbia grigia, fredda. Si
            riprende la coperta e la tazza, e prima di andare ti dice da quali
            crepe girare al largo.
          pe: { empatia: 6 }
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Un sasso dal buio
          testo: |
            Verso sera senti dei passi sui gradoni, e ti alzi troppo in fretta.
            Dal buio arriva un sasso che ti prende sopra l'orecchio, poi i
            passi si allontanano di corsa. Passi la notte con un bernoccolo che
            pulsa. La mattina dopo la
            coperta è sparita, e anche la tazza.
          effetti: { ferite: 0.5 }

      - testo: "Frugare fra le loro cose"
        descrizione: "Chi è scappato ha lasciato tutto, e qualcosa di utile c'è. Nessuno te lo impedisce."
        esito:
          titolo: La roba degli altri
          testo: |
            Nella sacca sotto la coperta trovi un rotolo di bende pulite, una
            borsetta con qualche moneta e un cristallo esausto avvolto in uno
            straccio. Nient'altro dice chi fossero o perché siano scappati. La
            coperta vicino alla crepa è fredda e unta, e le mani, dopo averla
            spostata, ti pizzicano fino a sera.

            {galateo Media} Frugare nella roba altrui resta volgare anche
            quassù, e te lo ripeti intascando la borsetta.
          effetti: { bende: 1, monete: 3, cristalli.frammento-esausto: 1, contaminazione: 0.5 }

  - id: carta-sup-accampamento-tracce
    tipo: seguito
    area: superficie-fratturata
    immagine: icone/footprint
    titolo: Sotto la sporgenza
    sommario: "Le orme finiscono sotto una sporgenza di basalto, dove due carbonai di Pannion aspettano che passi la notte di ieri."
    luogo: Superficie Fratturata, sotto una sporgenza di basalto
    testo: |
      Sotto la sporgenza, nell'ombra, c'è una donna con le spalle larghe e la
      faccia rigata di nero, e dietro di lei un ragazzo con le ginocchia
      sbucciate. La donna tiene alzata una pala da carbone, e la pala trema.

      {armi-da-mischia Facile} La tiene come si tiene una pala, con la mano
      buona in basso. Il colpo arriverebbe di piatto, e lento.

      «Per il fumo di Pannion, sei una persona» dice quando ti vede bene, e
      la abbassa di colpo. «Ecco. Ecco, meno male.»

      Sono carbonai, e portavano il carbone in città sul carro. Stanotte la
      crepa accanto al fuoco si è messa a fischiare, e da sotto è salita una
      nebbia grigia che camminava sulla terra e faceva freddo alle caviglie. Il
      mulo ha strappato la cavezza e lei ha preso il ragazzo per il colletto.
      «Il carro è là, con tutto il carbone sopra» dice, e guarda verso il
      campo. «Ecco, senza il carro non torniamo a casa, e io là da sola non
      ci rimetto piede.»

      {empatia Facile} Quell'ecco le serve per tenersi in piedi. Lo dice
      ogni volta che la voce sta per cederle.

      Il ragazzo intanto ti fissa le mani, per vedere se hai un'arma, e si
      morde il labbro di sotto fino a farlo diventare bianco.
    opzioni:
      - testo: "Accompagnarli a riprendere il carro"
        descrizione: "Bisogna capire se la crepa ha smesso di respirare, e girarle intorno al punto giusto."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il carro dei carbonai
          testo: |
            Alla crepa ti chini a guardare la patina sui bordi, e vedi che si è
            già seccata. La nebbia è tornata giù da dove era salita. Fai fare ai
            carbonai il giro largo, dalla parte del vento, e il mulo lo
            ritrovate più avanti che bruca un cespuglio spinoso.

            {cavalcare Media} Si lascia prendere dal muso, se gli parli piano.
            Stanotte ha avuto più paura di tutti. La donna ti
            mette in mano qualche moneta annerita di carbone, e ti dice di
            chiedere di lei ai forni di Pannion, se mai ci passi.
          effetti: { monete: 5, informazioni.voce: 1 }
        fallimento:
          titolo: La crepa fischia ancora
          testo: |
            Giudichi la crepa spenta, e mentre sistemate i sacchi sul carro ricomincia
            a fischiare, un suono sottile da bollitore dimenticato sul fuoco. La
            nebbia sale fino alle ginocchia in un momento. Riuscite a portare via il
            carro lo stesso, tirandolo a braccia, ma per tutta la strada hai le gambe
            fredde e la pelle delle caviglie grigia come cenere. La donna ti paga lo
            stesso, borbottando che ecco, almeno il carbone c'è.
          effetti: { monete: 2, contaminazione: 1 }

      - testo: "Indicare loro la strada per la città"
        descrizione: "Il carro è loro, e lo vanno a prendere loro. Tu sai da che parte è la città."
        costo: 0
        esito:
          titolo: Da quella parte
          testo: |
            Indichi la strada degli scavi e le frecce bianche sui sassi,
            avvertendoli che qualcuna è girata per scherzo. La donna ascolta
            annuendo e ripete le tue indicazioni al ragazzo, come se lui fosse
            quello che deve ricordarle, e lui le ripete a sua volta, sbagliando
            la seconda. Quando ti volti, stanno ancora
            discutendo se tornare al carro.

  # ================================================================ 11 · il cacciatore ferito
  - id: carta-sup-cacciatore-ferito
    tipo: carta
    area: superficie-fratturata
    immagine: icone/bow-arrow
    titolo: Il cacciatore ferito
    sommario: "Seduto contro un anello di metallo c'è un cacciatore di lucertole con il fianco aperto, e continua a guardarti oltre la spalla."
    luogo: Superficie Fratturata, poco fuori dal sentiero, contro un anello mezzo sepolto
    testo: |
      Poco fuori dal sentiero, con la schiena contro un anello di metallo
      mezzo sepolto, c'è un uomo seduto in terra. Porta una giubba di pelle
      consumata ai gomiti e una fila di lacci da trappola appesi alla cintura,
      e si è fasciato il fianco alla meglio con la manica della camicia. La
      stoffa è nera di sangue fino al polso.

      {medicina Media} Il sangue è scuro e cola lento, quindi la vena grossa
      non è toccata. Ha ancora qualche ora, se smette di agitarsi.

      Quando ti vede prova a mettersi più dritto e ci riesce a metà. «Non ti
      fermare troppo, eh» dice, a denti stretti. Gli occhi gli scappano verso
      le terrazze alle tue spalle e poi tornano su di te. «Io non li ho cercati,
      capito? Sono loro che hanno trovato me.»

      {ingannare Media} Sul fatto di non averli cercati dice la verità. Su
      quello che c'è nel sacco ha già pronta un'altra storia.

      Ha le labbra bianche. Accanto alla mano destra c'è un sacco di tela
      chiuso con un nodo stretto, e lui ci tiene sopra il palmo. *Ha più
      paura per il sacco che per il fianco.* Dalla fasciatura il sangue gli
      gocciola sulla ghiaia con la regolarità di un rubinetto che perde.
    opzioni:
      - testo: "Medicargli la ferita"
        descrizione: "La ferita va pulita e chiusa, e lui deve stare fermo mentre lo fai."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: Il filo del laccio
          testo: |
            Lavi la ferita con l'acqua della tua borraccia e la chiudi con il
            filo di un laccio da trappola, mentre lui morde la cinghia della
            giubba e ti bestemmia contro a denti stretti, con educazione. Quando
            hai finito parla senza che tu gli chieda niente. Stava piantando un
            picchetto vicino all'anello, e al terzo colpo di mazzuolo dal
            metallo sono uscite delle sfere che gli sono arrivate addosso come
            sassi. Sotto il picchetto aveva
            trovato un guscio sigillato. «Tienilo tu, capito?» dice, e te lo
            spinge in mano. «Io non lo voglio più vedere.»
          pe: { medicina: 10 }
          effetti: { reperto.sigillato: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Fino alla strada
          testo: |
            Appena tocchi la fasciatura la ferita si riapre, e lui sviene con gli
            occhi rovesciati. Lo carichi in spalla e lo porti fino alla strada degli
            scavi, un passo alla volta, dove un carrettiere accetta di prenderlo su
            per pietà e per qualche bestemmia. Ti resta la schiena a pezzi e la
            camicia incollata di sangue non tuo.

            {resistenza Facile} Domani te lo ricorderanno le spalle, e i
            polpacci anche dopodomani.
          pe: { medicina: 3 }
          effetti: { ferite: 0.5 }

      - testo: "Dargli le tue bende"
        descrizione: "Con una fasciatura vera si rimette in piedi da solo, e magari ti dice qualcosa di utile."
        requisiti: [bende >= 1]
        esito:
          titolo: I lacci
          testo: |
            Si fascia da solo e stretto, con le mani che sanno farlo, e il
            colore gli torna sulla faccia a chiazze. Quando ha
            finito ti mostra i suoi lacci uno per uno e ti spiega dove si
            mettono per le lucertole di roccia, che escono a scaldarsi
            sulle lastre di metallo e tornano sempre per la stessa strada. Ti
            dice anche quali anelli non toccare, quelli lucidi come coltelli.
            «Così le prendi, capito?» Poi si alza appoggiandosi alla tua
            spalla e se ne va zoppicando verso la città, con il sacco stretto
            sotto il braccio.
          pe: { natura: 8 }
          effetti: { bende: -1, informazioni.voce: 1 }

      - testo: "Fargli dire che cosa l'ha ferito"
        descrizione: "Sta nascondendo qualcosa nel sacco, e chi l'ha ferito potrebbe essere ancora qui intorno. Lo vuoi sapere adesso."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Il sacco
          testo: |
            Gli metti un piede sul sacco e aspetti, senza dire niente, il che
            funziona meglio di qualunque cosa avresti potuto dire. Lui regge
            poco. Racconta
            delle sfere uscite dall'anello mentre piantava un picchetto, e che
            sono ancora lì dentro, e che basta battere i piedi per farle
            uscire. Poi scioglie il nodo e ti dà il guscio sigillato che aveva
            scavato. «Prenditelo, capito? Tanto porta male.» Lo lasci lì
            seduto, con il fianco che sanguina.
          effetti: { reperto.sigillato: 1, informazioni.voce: 1, tormento: 0.5 }
        fallimento:
          titolo: Le terrazze alte
          testo: |
            Più insisti, più lui si confonde. Prima parla di predoni, poi di un
            animale, e alla fine ti indica le terrazze alte per toglierti di torno,
            con un sollievo che avresti dovuto notare. Ci vai, e due gradoni più su
            batti il piede sul metallo sbagliato. Le sfere ti trovano subito, e ti
            inseguono fino al sentiero.
          effetti: { ferite: 1 }

      - testo: "Lasciarlo dov'è"
        descrizione: "Ha detto di non fermarti troppo. Lo prendi in parola."
        costo: 0
        esito:
          titolo: Il sacco in grembo
          testo: |
            Tiri dritto senza dire niente. Alla curva del sentiero ti volti, e
            lui si è tirato il sacco in grembo e ci tiene sopra tutte e due le
            mani, con la testa appoggiata all'anello. Ci ripensi per buona
            parte della strada, e ogni volta il sacco ti sembra più piccolo e
            lui più solo.
          effetti: { tormento: 0.5 }

  # ================================================================ 13 · la tempesta di cenere
  - id: carta-sup-tempesta-di-cenere
    tipo: carta
    area: superficie-fratturata
    immagine: icone/sandstorm
    titolo: La tempesta di cenere
    sommario: "Da sud arriva un muro di cenere che spegne il cielo, e dentro la cenere qualcuno litiga per un mulo."
    luogo: Superficie Fratturata, sulle terrazze aperte verso sud
    testo: |
      All'orizzonte, verso sud, si alza una colonna scura che all'inizio prendi
      per il fumo di un incendio. Poi si allarga e si abbassa, e capisci che è
      cenere portata dal vento, una massa compatta che avanza sulle terrazze
      più in fretta di un carro. Il cielo prende il colore di una pentola
      vecchia. I primi granelli ti si posano tiepidi sulle maniche, e
      quando ti passi la lingua sulle labbra sanno di ferro.

      {resistenza Media} Fra un'ora la cenere ti avrà incollato le ciglia,
      se non ti copri gli occhi adesso. La gola ha già cominciato a
      lamentarsi.

      Dopo poco la strada davanti a te si accorcia a una ventina di passi, poi
      a dieci. A sinistra c'è una sporgenza di basalto abbastanza bassa da
      ripararsi. Da qualche parte a destra, dentro la cenere, senti il raglio
      di un mulo e due voci che litigano su chi doveva legarlo e su come
      dividere la roba del Raschiatore. *Predoni, e con la refurtiva ancora
      sul basto.* Hai già la gola secca, e tossisci nel gomito.

      {conoscenze-della-strada Media} Litigano sulla spartizione prima di
      essere al sicuro. Dilettanti, e i dilettanti si spaventano presto e
      menano a caso.
    opzioni:
      - testo: "Ripararsi sotto la sporgenza"
        descrizione: "Rannicchiarsi sotto la roccia con la faccia coperta e aspettare che passi. Ci vuole il tempo che ci vuole."
        costo: 2
        esito:
          titolo: I segni sulla roccia
          testo: |
            Ti rannicchi sotto la sporgenza con la sciarpa sulla bocca e
            ascolti la cenere frusciare sulla roccia. Sulla parete, all'altezza
            degli occhi, ci sono i segni di chi si è riparato qui prima di te,
            tacche incise col coltello e qualche nome. C'è anche un cuore storto
            con due iniziali. Uno ha scritto che la
            crepa grande più a valle si è allargata. Quando la tempesta passa
            aggiungi la tua tacca e ti scuoti la cenere dai capelli.
          effetti: { informazioni.voce: 1, tormento: -0.5 }

      - testo: "Proseguire nella cenere"
        descrizione: "Tenere la direzione senza vedere niente. Se la perdi, le terrazze sono piene di crepe."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il vento sulla guancia
          testo: |
            Ti tieni il vento sulla guancia sinistra e conti i gradoni sotto i
            piedi, uno dopo l'altro. Ogni tanto ti fermi e tocchi la roccia per
            sentire da che parte scende. Quando la cenere si dirada sei sulla
            strada degli scavi, più avanti di dove contavi di essere, grigio da
            capo a piedi come una statua di cortile.
          pe: { natura: 8 }
        fallimento:
          titolo: In tondo
          testo: |
            A un certo punto il vento gira e tu non te ne accorgi. Cammini a
            lungo, convinto di andare dritto, e quando la cenere si dirada sei
            sull'orlo di una crepa azzurra con la punta degli stivali nel
            vuoto.

            {acrobazia Facile} Il peso indietro, subito. Le braccia fanno il resto
            prima che la testa abbia capito. Ci arrivi con una caviglia storta e in
            bocca il sapore di ferro che sale dalle crepe.
          effetti: { ferite: 0.5, contaminazione: 0.5 }

      - testo: "Avvicinarsi alle voci"
        descrizione: "Nella cenere ci vedi poco tu e ci vedono poco loro, e il mulo è legato male. Basta che non ragli troppo presto."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Il basto del mulo
          testo: |
            Arrivi alle spalle del mulo seguendo il raglio, mentre i due
            predoni litigano accucciati dietro un carro rovesciato. Sul basto
            c'è una borsa da Raschiatore, con la lampada da scavo ancora
            appesa. La sciogli piano, un nodo alla volta, mentre il mulo ti
            soffia sul collo con un certo interesse, e te la porti via nella
            cenere. Dentro ci
            sono qualche moneta e un guscio sigillato avvolto in un fazzoletto
            con le iniziali ricamate.
          effetti: { monete: 6, reperto.sigillato: 1 }
        fallimento:
          titolo: Il raglio
          testo: |
            Il mulo ti sente arrivare e raglia proprio mentre allunghi la mano
            sul basto. I due predoni saltano fuori dalla cenere menando colpi a
            caso, e uno dei colpi a caso ti prende sull'avambraccio. Scappi
            nella direzione opposta tenendoti il braccio, e loro restano lì a
            gridarsi dietro che era colpa dell'altro, e del mulo.
          effetti: { ferite: 1 }

  # ================================================================ 14 · i predoni disorganizzati
  - id: carta-sup-predoni-disorganizzati
    tipo: carta
    area: superficie-fratturata
    immagine: icone/bandit
    titolo: Predoni alle prime armi
    sommario: "Da dietro una roccia escono tre predoni con armature spaiate, e un quarto che spera di non essere visto."
    luogo: Superficie Fratturata, una sporgenza di roccia lungo il sentiero
    testo: |
      Da dietro una sporgenza di roccia escono tre figure, e dopo un momento
      una quarta, più indietro, che sembra sperare di non essere vista. Hanno
      armature messe insieme con pezzi diversi, uno spallaccio di cuoio da una
      parte e una piastra di ferro dall'altra, e lo scudo di quello davanti è
      il coperchio di un forno con la maniglia ancora attaccata. Le armi
      invece sono vere, anche se nessuno le ha mai pulite.

      {intimidire Media} Hanno paura tutti quanti, e il capo ne ha più degli
      altri, perché deve anche fingere di non averne.

      Si fermano a qualche passo da te e si guardano fra loro, finché quello
      del coperchio si fa avanti. «Resta lì dove sei» dice, e la voce gli sale
      di un tono a metà della frase. Gli altri due tengono le lance basse.
      Quello rimasto indietro è un ragazzo con la peluria sul labbro, e
      stringe una balestra senza dardo con tutte e due le mani. *Quel
      coperchio ha visto più arrosti che battaglie.* Il capo aspetta che tu
      faccia qualcosa, perché lui non sa bene che cosa fare.

      {armi-da-distanza Facile} Una balestra senza dardo spaventa soltanto
      chi non la guarda bene. Il ragazzo lo sa, e la tiene alta lo stesso.
    opzioni:
      - testo: "Combattere"
        descrizione: "Sono in tre e hanno poca voglia di menare le mani. Basta che uno scappi perché scappino tutti."
        combattimento: predoni-disorganizzati
        vittoria:
          titolo: Il coperchio
          testo: |
            Il primo che va giù trascina con sé il coraggio degli altri, e in
            poco tempo il sentiero è vuoto. Per terra restano il coperchio del
            forno, una lancia con la punta legata con lo spago e una borsa
            caduta nella fuga, con dentro qualche moneta e un rotolo di bende
            ancora nella carta. Del ragazzo con la balestra non c'è più
            traccia, e ti scopri a sperare che sia corso dritto a casa.
          effetti: { monete: 5, bende: 1 }
        sconfitta:
          titolo: Più fortunati che bravi
          testo: |
            Erano più di quanti ne sapessi gestire, e la fortuna stava dalla
            loro. Ti ritrovi seduto per terra con un livido sulla tempia e la
            borsa più leggera. Da lontano li senti ridere e darsi pacche sulle
            spalle, come se avessero vinto una guerra, e la cosa ti offende più
            del livido.
          effetti: { monete: -5 }

      - testo: "Spaventarli"
        descrizione: "Hanno più paura loro di te. Bisogna solo farglielo capire prima che il capo si convinca del contrario."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Indietro
          testo: |
            Fai un passo avanti invece che indietro e spieghi al capo che cosa
            farai al suo coperchio. Lo dici piano, aggiungendo qualche
            dettaglio di troppo. Il ragazzo con la balestra
            è il primo ad andarsene. Gli altri lo seguono a passo svelto
            guardandosi alle spalle, e il capo si ferma solo per lanciarti una
            borsetta, nel caso tu avessi intenzione di seguirli.
          pe: { intimidire: 8 }
          effetti: { monete: 3 }
        fallimento:
          titolo: Il coraggio del capo
          testo: |
            Il capo non può tirarsi indietro davanti agli altri, e lo sa. Ti
            viene addosso con il coperchio alzato e ti colpisce sulla spalla
            con l'asta della lancia, poi si spaventa di quello che ha fatto e
            scappa insieme a tutti gli altri. Ti resta un livido che si gonfia
            sotto la camicia e la soddisfazione, un poco storta, di averli
            fatti correre.
          effetti: { ferite: 1 }

      - testo: "Parlarci"
        descrizione: "Non sembrano predoni da molto tempo. Chi erano prima, forse, sa cose utili."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: I mulini fermi
          testo: |
            Bastano due domande sul coperchio perché il capo abbassi la lancia.
            Lavoravano ai mulini di Laresh, prima che il padrone li chiudesse
            per l'inverno, e da allora tentano la strada. Ti raccontano quali
            carovane viaggiano senza scorta, chi compra la roba dei Raschiatori
            senza fare domande, e dove la Gilda ha messo le guardie nuove. Poi
            ti chiedono se conosci un lavoro onesto in città.

            {politica-ed-economia Media} Mulini chiusi d'inverno vogliono dire
            farina più cara in primavera, e quel guadagno finirà al padrone.
          pe: { conoscenze-della-strada: 6 }
          effetti: { informazioni.pettegolezzo: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La mano del ragazzo
          testo: |
            Mentre parli con il capo, che annuisce a tutto, il ragazzo della
            balestra ti gira intorno. Te ne accorgi quando sono già spariti
            tutti e quattro dietro la roccia, e la tua borsa ha una cucitura
            aperta dove prima non c'era, tagliata con una certa eleganza.
          effetti: { monete: -3 }
      - testo: "Parlare al ragazzo con la balestra"
        descrizione: "Il capo non può tirarsi indietro davanti agli altri. Il ragazzo invece ha l'aria di uno che vorrebbe essere a casa."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La balestra senza dardo
          testo: |
            Lasci perdere il capo e ti rivolgi al ragazzo, con calma, per chiedergli
            se sua madre sa dov'è stamattina. Lui arrossisce fino alle orecchie, e la
            balestra gli scende di un palmo. Il capo prova a dire qualcosa e si
            accorge che gli altri due adesso guardano il ragazzo, e non più te. Se ne
            vanno così, borbottando, con il ragazzo per ultimo. Prima di sparire
            dietro la roccia lui torna indietro di corsa, ti mette in mano un rotolo
            di bende «per il disturbo» e ti dice sottovoce quale tratto di strada
            evitare domani.
          pe: { empatia: 6 }
          effetti: { bende: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Sopra la testa del capo
          testo: |
            Ti rivolgi al ragazzo, e il capo la prende come un'offesa, perché
            gli sei passato sopra la testa davanti a tutti. Ti spinge indietro
            con il coperchio del forno e tu inciampi in un sasso e
            finisci seduto nella polvere, con le gambe all'aria. Quando ti
            rialzi se ne sono andati ridendo, e ti fa male il gomito su cui sei
            caduto, e un poco anche l'orgoglio.
          effetti: { ferite: 0.5 }


  # ================================================================ 15 · il vecchio viandante
  - id: carta-sup-vecchio-viandante
    tipo: carta
    area: superficie-fratturata
    immagine: icone/pilgrim-hat
    titolo: Il vecchio viandante
    sommario: "Un vecchio con un bastone levigato ti viene incontro sul sentiero, e conosce la strada meglio di chiunque."
    luogo: Superficie Fratturata, sul sentiero fra due terrazze
    testo: |
      Sul sentiero ti viene incontro un vecchio con un passo lento che non
      cambia mai. Porta uno zaino piccolo e un bastone levigato dall'uso, e lo
      appoggia a terra ogni due passi alla stessa distanza, come se misurasse la
      strada. Quando ti incrocia si ferma, ti guarda dagli stivali alla faccia e
      accenna un saluto con il mento.

      {resistenza Facile} Un passo che non cambia mai arriva in fondo a
      qualunque strada. Le tue gambe, a guardarlo, si vergognano un poco.

      «Strada lunga, questa» dice, «e con chi non la conosce non è gentile per
      niente.» Ha la voce calma e la pelle del collo cotta dal sole, e una
      sciarpa di lana rossa rammendata con un filo azzurro. *Questo la strada
      l'ha fatta a piedi tutta, e più di una volta.* Batte due volte il
      bastone su un sasso piatto e aspetta senza fretta che tu dica qualcosa.

      {empatia Media} Gli fa piacere incontrare qualcuno, e cerca di non
      darlo troppo a vedere.
    opzioni:
      - testo: "Fare un tratto di strada con lui"
        descrizione: "Al suo passo si va piano, ma lui sa dove mettere i piedi e ha voglia di parlare."
        costo: 2
        esito:
          titolo: Le frecce girate
          testo: |
            Camminate insieme per mezza giornata, e lui ti mostra la strada
            come si mostra la casa a un ospite. «La strada, vedi» dice, e con il
            bastone ti indica le frecce bianche girate per scherzo, gli anelli
            che non vanno toccati e una lastra dove le lucertole si fermano a
            scaldarsi ogni mattina. «La strada te lo dice, se la guardi.» Al
            bivio per Laresh ti saluta e prende l'altra via, e per un pezzo
            senti ancora il bastone battere ogni due passi.
          pe: { conoscenze-della-strada: 10 }
          effetti: { informazioni.pettegolezzo: 1 }

      - testo: "Chiedergli come si legge la Superficie"
        descrizione: "Sa quali crepe sono sicure e quali no, e forse te lo insegna, se capisci in fretta."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Le crepe che fumano
          testo: |
            Si accuccia accanto a una crepa e ti fa mettere la mano sopra. «Se
            l'aria è calda, la strada è buona» dice. «Se è fredda, cambia
            strada.» Poi ti fa vedere la patina chiara sui bordi, e i licheni
            che crescono soltanto dalla parte da cui non sale niente. Ti fa
            ripetere tutto due volte, e alla seconda annuisce, soddisfatto
            come un maestro di scuola al primo giorno buono dell'anno.
          pe: { natura: 12 }
        fallimento:
          titolo: Il gradone che cede
          testo: |
            Ti spiega le crepe, e tu annuisci senza seguirlo davvero. Poco dopo
            metti il piede su un gradone che lui aveva appena indicato col
            bastone, e il bordo ti si sbriciola sotto la suola. Il vecchio ti
            tira su per il bavero con una forza che non ti aspettavi, e mentre
            ti massaggi la caviglia ti spiega tutto di nuovo, con pazienza.
          pe: { natura: 4 }
          effetti: { ferite: 0.5 }

      - testo: "Dividere con lui il pane"
        descrizione: "Sedersi su un sasso a mangiare qualcosa insieme, e per una volta riposare le gambe."
        esito:
          titolo: Il grasso di marmotta
          testo: |
            Vi sedete sullo stesso sasso e dividete il pane. Lui tira fuori un
            barattolo di latta e ti fa togliere lo stivale, poi ti spalma sul
            tallone un grasso che puzza di marmotta e brucia per un momento. Ti
            racconta di una carovana per Pannion che cerca chi sappia tenere in
            mano un'arma. Quando ti rimetti lo stivale il piede non fa più
            male.

            {medicina Facile} Grasso di marmotta e qualcosa di amaro sotto.
            Brucia perché pulisce, e il vecchio lo sa benissimo.
          effetti: { ferite: -0.5, informazioni.voce: 1 }

      - testo: "Tirare dritto"
        descrizione: "Di un vecchio solo sulla Superficie non ti fidi, e la mano resta vicino alla cintura."
        costo: 0
        esito:
          titolo: Strada lunga
          testo: |
            Gli passi accanto senza rispondere, con la mano vicino alla cintura.
            Lui si fa da parte sul sentiero e ti lascia passare. «Strada lunga»
            dice di nuovo alle tue spalle senza offendersi, e riprende a
            battere il bastone ogni due passi. Ti resta il dubbio di essere
            stato tu, il pericolo, sul sentiero.

  # ================================================================ 17 · lo sciame di insetti
  - id: carta-sup-sciame-di-insetti
    tipo: carta
    area: superficie-fratturata
    immagine: icone/fly
    titolo: Lo sciame color ruggine
    sommario: "Una nube di insetti ramati arriva sopra il gradone e ti si posa addosso, e su una lastra di metallo poco lontano si posa a migliaia."
    luogo: Superficie Fratturata, ai piedi di un gradone
    testo: |
      Il ronzio arriva prima dello sciame, così basso che per un poco lo
      scambi per il vento fra gli anelli. Poi sopra il gradone compare una
      nube color ruggine che si allunga e si stringe, e in un attimo ti è
      addosso. Sono insetti piccoli come chicchi di riso, con il dorso
      ramato, e per fortuna sembrano pungere di rado. Ti camminano sulle
      palpebre e ti entrano nel colletto, e quando apri la bocca per imprecare
      devi richiuderla in fretta.

      {resilienza Facile fallita} Ti dici che sono soltanto insetti. Uno ti
      entra in un orecchio, e smetti di dirtelo.

      Ai margini dello sciame le formiche di roccia scappano in fila verso le
      crepe. Più in là, su una lastra di metallo che affiora dalla ghiaia, gli
      insetti si posano a migliaia uno sull'altro, finché la lastra sembra
      coperta di pelliccia. *Il metallo è caldo, e a loro piace il caldo.* Ti
      tiri la sciarpa sulla faccia, e respiri attraverso la lana.

      {natura Media} Pungono quando si sentono schiacciati. Per il resto ti
      considerano un sasso che cammina, e non dei più caldi.
    opzioni:
      - testo: "Attraversare lo sciame"
        descrizione: "Testa bassa e passo lungo, finché si esce dall'altra parte."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Facile }
        successo:
          titolo: Dall'altra parte
          testo: |
            Tieni gli occhi socchiusi e conti i passi, con il ronzio che ti vibra
            nelle ossa del naso, e dopo una trentina lo sciame si dirada. Ti scuoti
            gli insetti dalla giacca a manate, e alcuni ti restano nelle pieghe dei
            vestiti fino a sera, quando li trovi mentre ti spogli e li fai volare
            fuori dalla finestra.
          pe: { resistenza: 5 }
        fallimento:
          titolo: Negli occhi
          testo: |
            Ti entrano due insetti in un occhio, che si chiude da solo e non ne
            vuole più sapere, e mentre ti strofini la
            faccia metti il piede in fallo e scivoli giù per un gradone. Ne
            esci dall'altra parte con una mano sbucciata e l'occhio rosso e
            gonfio, che lacrima per tutto il giorno.
          effetti: { ferite: 0.5 }

      - testo: "Coprirsi e aspettare che passi"
        descrizione: "Accucciarsi con la sciarpa sulla testa e lasciare che lo sciame vada per la sua strada. Si perde tempo."
        costo: 2
        esito:
          titolo: Sotto la sciarpa
          testo: |
            Ti accucci con la sciarpa tirata sulla testa e le mani nelle
            maniche, e aspetti. Il ronzio ti passa sopra per un tempo lungo,
            poi si allontana verso le crepe, dietro alle formiche. Quando ti
            rialzi hai le ginocchia rigide e un insetto ramato sul polsino, che
            se ne va per ultimo. La lastra di metallo poco lontano è di nuovo
            nuda e lucida.
          pe: { natura: 4 }

      - testo: "Andare a vedere la lastra"
        descrizione: "Dove gli insetti si ammucchiano il metallo è caldo, e il metallo caldo da queste parti funziona ancora."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il metallo caldo
          testo: |
            Spazzi via gli insetti con il dorso della mano, e sotto c'è una
            lastra tiepida segnata da una cucitura sottile, che sotto le dita
            vibra appena. La fai leva con il coltello lungo la cucitura e la
            lastra si apre di un dito. Dentro, incastrato nella sua sede, c'è
            un guscio sigillato, tiepido come il pane del mattino. Gli insetti
            ti salgono su per le braccia, e tu lasci fare.
          effetti: { reperto.sigillato: 1 }
        fallimento:
          titolo: Troppo a lungo nello sciame
          testo: |
            Cerchi la cucitura a tentoni sotto uno strato di insetti che non ti
            lascia vedere niente. Dopo un po' cominciano a pungere davvero. Ti
            allontani con le mani coperte di bolle rosse che pizzicano e
            pulsano, e per tutta la sera senti ancora qualcosa che ti cammina
            sulla pelle.
          effetti: { ferite: 0.5, tormento: 0.5 }
