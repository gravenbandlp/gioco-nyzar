# Superficie Fratturata, carte del mazzo (prima parte): dieci incontri dalla tabella del master, riscritti.
# 1 lo sciame di droni ciechi (scontro sciame-di-droni-ciechi; con osservatore.marchio 1 i droni ti lasciano
# passare), 3 il corpo mineralizzato (i "fermati", ripetibile), 4 la pozza che ricorda (bere imposta
# pozza.segno, e la seconda volta l'opzione cambia), 6 l'Osservatore senza volto (imposta osservatore.marchio;
# il visore una volta sola, con oggetto.visore == 0), 10 l'accampamento ancora caldo (le tracce portano al
# seguito carta-sup-accampamento-tracce, i carbonai di Pannion), 11 il cacciatore ferito, 13 la tempesta di
# cenere, 14 i predoni disorganizzati (scontro predoni-disorganizzati), 15 il vecchio viandante, 17 lo sciame
# di insetti. Tutte le carte possono ripetersi: gli incontri unici cambiano con quando sulle opzioni.
quality:
  - { id: pozza.segno, nome: "Il segno della pozza", categoria: stato, nascosta: true, descrizione: "1 se hai bevuto da una pozza che ricorda, e la Marea Grigia ti ha lasciato un segno chiaro sul labbro." }

storylet:
  # ================================================================ 1 · lo sciame di droni ciechi
  - id: carta-sup-sciame-di-droni
    tipo: carta
    area: superficie-fratturata
    immagine: icone/triorb
    titolo: Lo sciame cieco
    sommario: "Fra due anelli inclinati il metallo spinge fuori sfere che ronzano e si voltano a ogni tuo passo."
    luogo: Superficie Fratturata, fra gli anelli inclinati di una terrazza
    testo: |
      Il sentiero passa fra due anelli di metallo inclinati nel basalto, e uno
      dei riflessi sulla loro superficie si stacca. È una sfera grande come un
      pugno, con linee incise che si accendono, sospesa a mezz'aria mentre il
      metallo ne spinge fuori altre. Al tuo primo passo la più vicina si gira
      verso di te, con un ronzio che ti entra nei denti.

      {furtivita Facile} Ogni passo sulla ghiaia avrà il suo rumore, a meno di
      appoggiare prima il tallone.

      {origine allievo-di-torvessa} Conti le accensioni per abitudine, come
      all'Accademia, ma il ritmo è un altro.
    opzioni:
      - testo: "Combattere lo sciame"
        descrizione: "Le sfere sono fragili, però il metallo continua a spingerne fuori finché qualcuno batte i piedi."
        combattimento: sciame-di-droni-ciechi
        vittoria:
          titolo: Metallo che tace
          testo: |
            L'ultima sfera la prendi in pieno e cade sulla ghiaia con un rumore da
            pentolino, e le linee incise si spengono una dopo l'altra. Nell'anello
            più vicino si è aperta una fessura, e dentro c'è un guscio sigillato,
            tiepido come un uovo appena raccolto. Raccogli anche i pezzi taglienti
            delle sfere rotte.
          effetti: { reperto.sigillato: 1, reliquie.scheggia: 2 }
        sconfitta:
          titolo: Il ronzio nei denti
          testo: |
            Le sfere ti colpiscono come sassi da una fionda, e ogni colpo a vuoto
            ne fa uscire altre dagli anelli. Corri giù per i gradoni con le
            braccia sopra la testa, e quella sera il ronzio ce l'hai ancora nelle
            otturazioni.
          effetti: { tormento: 1 }

      - testo: "Allontanarsi a passi lenti"
        descrizione: "Un piede alla volta, con il peso sul tallone, perché ogni sasso che si muove lo sentono."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Il peso sul tallone
          testo: |
            Appoggi prima il tallone e poi la pianta, contando fino a cinque fra
            un passo e l'altro, e le sfere ti girano intorno senza decidersi.
            Fuori dagli anelli ti accorgi di stringere una scheggia di metallo che
            hai raccolto senza volerlo, per tenere ferme le dita.
          pe: { furtivita: 8 }
          effetti: { reliquie.scheggia: 1 }
        fallimento:
          titolo: Il sasso sbagliato
          testo: |
            A metà strada un sasso ti rotola sotto la suola con un tic piccolo e
            chiarissimo, e lo sciame si gira tutto insieme come un branco di
            pesci. Ne esci correndo, con due lividi tondi sulla schiena.
          effetti: { ferite: 1 }

      - testo: "Restare immobile finché se ne vanno"
        descrizione: "Se non sentono passi si stancano presto, forse prima di te."
        costo: 2
        prova: { attributo: fisico, abilita: resistenza, difficolta: Facile }
        successo:
          titolo: La statua
          testo: |
            Stai fermo con le braccia lungo i fianchi, e una sfera ti si ferma davanti
            alla faccia e se ne va. Il sole si sposta di un palmo prima che tornino
            tutte negli anelli, e l'ultima lascia aperta la fessura da cui è uscita, con
            dentro un guscio sigillato incastrato di traverso.
          pe: { resistenza: 6 }
          effetti: { reperto.sigillato: 1 }
        fallimento:
          titolo: Il crampo
          testo: |
            Dopo un tempo lunghissimo un crampo ti piega la gamba, e basta quel
            mezzo passo. Ti scrolli di dosso lo sciame tre gradoni più in basso,
            zoppicando, con il sangue di un taglio sul sopracciglio che ti cola
            negli occhi.
          effetti: { ferite: 1 }

      - testo: "Lasciare che ti riconoscano"
        descrizione: "Il segno dell'Osservatore ti formicola sotto la pelle da quando le sfere sono uscite."
        quando: [osservatore.marchio == 1]
        esito:
          titolo: Fatti da parte
          testo: |
            Cammini dritto verso gli anelli senza fare piano. Le sfere si fermano a
            un palmo dalla tua faccia, le linee incise diventano bianche tutte
            insieme, e si scostano per lasciarti un corridoio. Il segno sotto la
            pelle ti brucia finché non sei passato, e nell'anello alla tua sinistra
            si apre una fessura con un guscio sigillato dentro, come una mano che
            ti porge qualcosa.
          effetti: { reperto.sigillato: 1, reliquie.scheggia: 1, tormento: 1 }
      - testo: "Contare i tempi del ronzio"
        descrizione: "Le sfere si girano verso ogni rumore, e un sasso lanciato al momento giusto può portarle via."
        prova: { attributo: mentale, abilita: [percezione, tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il sasso sulla terrazza di sotto
          testo: |
            Conti sottovoce, e fra un rumore e il giro delle sfere passa sempre il
            tempo di contare fino a sei. Allora lanci un sasso piatto sulla
            terrazza di sotto, e mentre lo sciame scende dietro al rimbalzo tu
            infili le dita nella fessura ancora aperta dell'anello. Il guscio che
            ne tiri fuori è tiepido, e più pesante di quanto sembri.
          pe: { percezione: 8 }
          effetti: { reperto.sigillato: 1 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Conti male, o le sfere non contano come te, e invece di scendere
            dietro al sasso lo sciame si gira verso la mano che l'ha lanciato. Ne
            esci a gomitate giù per i gradoni, con una guancia aperta e le nocche
            spellate.
          effetti: { ferite: 1 }

      - testo: "Far suonare le monete sulla terrazza di sotto"
        descrizione: "Il metallo che tintinna fa più rumore di un passo, e le monete laggiù non le ritrovi più."
        requisiti: [monete >= 5]
        esito:
          titolo: Il prezzo del passaggio
          testo: |
            Lanci una manciata di monete giù per i gradoni, larghe, perché
            tintinnino a lungo, e lo sciame scende dietro al rumore come passeri
            dietro alle briciole. Intanto arrivi all'anello e tiri fuori dalla
            fessura un guscio sigillato, e mentre te ne vai senti ancora, di
            sotto, l'ultima moneta che rotola.
          effetti: { monete: -5, reperto.sigillato: 1 }


  # ================================================================ 3 · il corpo mineralizzato
  - id: carta-sup-un-fermato
    tipo: carta
    area: superficie-fratturata
    immagine: icone/stoned-skull
    titolo: Un fermato
    sommario: "In una piega della terrazza un Raschiatore è rimasto in piedi con il braccio teso, fuso nella roccia."
    luogo: Superficie Fratturata, una piega riparata lungo la strada degli scavi
    testo: |
      Lungo la strada degli scavi, in una piega della terrazza, c'è un
      Raschiatore in piedi con un braccio teso in avanti, fuso nella roccia
      fino ai fianchi. Più su la carne è diventata nera e lucida, con vene
      sottili di metallo lungo il collo e la calotta del cranio aperta in due.

      I Raschiatori li chiamano fermati, e chi passa lascia un sasso ai loro
      piedi, dove ce ne sono già tre.

      {origine apprendista-raschiatore} Gli cerchi sulla tuta il segno a gesso
      della squadra, per sapere a chi portare la notizia, e trovi soltanto
      roccia nera fino al colletto.
    opzioni:
      - testo: "Toccarlo"
        descrizione: "Il braccio teso è a portata di mano, e da vicino la roccia sembra più calda dell'aria."
        esito:
          titolo: Il passo che non finisce
          testo: |
            Appena gli sfiori il polso, nel petto del fermato si apre una crepa
            senza rumore e la mano tesa si apre a cercare qualcosa. Fai un salto
            indietro, e il corpo si sbriciola tutto insieme in frammenti neri e
            lisci, fra cui c'è il guscio sigillato che teneva sotto il braccio.
          effetti: { reperto.sigillato: 1, reliquie.scheggia: 2, tormento: 1 }

      - testo: "Staccargli l'attrezzatura dalla cintura"
        descrizione: "Alla cintura ha un attrezzo dei Precursori fuso con il resto, da tagliare lungo le vene di metallo."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Lungo le vene
          testo: |
            La roccia intorno alle vene di metallo è più tenera, e ci lavori con
            la punta del coltello per un'ora buona, con una goccia di sudore che
            ti pende dal naso. L'attrezzo viene via intero, con un'impugnatura che
            non è fatta per una mano umana, e dietro c'è il guscio sigillato che
            il Raschiatore portava nella borsa.
          pe: { tecnologia: 8 }
          effetti: { parte.impugnatura-1: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: Polvere grigia
          testo: |
            Il coltello scivola fuori dalla vena, e il fermato si incrina e crolla
            in uno sbuffo di polvere grigia che ti finisce in gola. Quando smetti
            di tossire raccogli fra i frammenti quelli che hanno ancora
            un'incisione.
          effetti: { contaminazione: 1.5, reliquie.scheggia: 1 }

      - testo: "Esaminarlo senza toccarlo"
        descrizione: "Girargli intorno finché si capisce che cosa stava facendo."
        prova: { attributo: mentale, abilita: [medicina, percezione], difficolta: Media }
        successo:
          titolo: Dove guardava
          testo: |
            Il fermato ha i piedi rivolti verso la strada e il busto girato verso una
            crepa poco più in là, che manda un filo di luce azzurra. Si era voltato a
            guardarla, e la roccia è salita così in fretta che le dita della mano tesa
            non hanno fatto in tempo a chiudersi. Ti segni la crepa a mente per chi
            scende agli scavi.
          pe: { medicina: 8 }
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: La smorfia
          testo: |
            Ti avvicini al viso più del necessario, e negli occhi aperti c'è la
            stessa roccia lucida del resto, che ti restituisce un riflesso piccolo
            e storto della tua faccia. Quella notte lo vedi ancora per un pezzo.
          effetti: { tormento: 1.5 }

      - testo: "Lasciare un sasso e andare avanti"
        descrizione: "Si fa così, da queste parti. Il sasso lo scegli tu."
        costo: 0
        esito:
          titolo: Il quarto sasso
          testo: |
            Posi un sasso piatto accanto agli altri tre, con la parte liscia in
            alto, e riprendi la strada sentendo per un tratto sulla schiena il
            braccio teso del fermato.

  # ================================================================ 4 · la pozza che ricorda
  - id: carta-sup-la-pozza-che-ricorda
    tipo: carta
    area: superficie-fratturata
    immagine: icone/droplet-splash
    titolo: La pozza che ricorda
    sommario: "In fondo a una conca senza crepe una pozza lattiginosa ti rimanda una sera della tua vita andata diversamente."
    luogo: Superficie Fratturata, una conca liscia fra due terrazze
    testo: |
      In fondo a una conca dai bordi lisci c'è una pozza di liquido
      lattiginoso, ferma come una lastra, e mentre scendi verso il bordo i
      rumori si spengono uno dopo l'altro.

      Poi ti torna in mente una sera precisa, la porta della prima casa che
      ricordi e qualcuno sulla soglia che ti chiede di restare, a cui hai
      detto di no. Nella pozza dici di sì, e la sera va avanti con una cena
      che non hai mai mangiato, fino al piatto sbeccato da un lato.

      {resilienza Facile fallita} Dovresti tirarti indietro, e intanto sei
      sceso di un altro passo.
    opzioni:
      - testo: "Lasciarsi andare al ricordo"
        descrizione: "Restare nella sera che non c'è stata e guardarla fino in fondo."
        esito:
          titolo: L'altra sera
          testo: |
            Lasci che la sera vada avanti, e guardando la faccia di chi ti aveva
            chiesto di restare capisci finalmente che cosa voleva dirti allora.
            Quando la pozza torna ferma il sole è più basso e hai le guance
            bagnate, e la domanda su come sarebbe andata te la porti dietro per
            tutta la strada.
          pe: { empatia: 10 }
          effetti: { tormento: 1 }

      - testo: "Resistere"
        descrizione: "Tenere a mente quello che è successo davvero, prima che la sera diventi tua."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Quello che è successo davvero
          testo: |
            Ti ripeti a mezza voce le parole sgarbate che hai detto davvero quella
            sera, finché la sera finta si sfilaccia e la pozza torna opaca. Risali
            dalla conca senza voltarti, con i segni delle unghie nei palmi.
          pe: { resilienza: 10 }
        fallimento:
          titolo: La cena che non hai mangiato
          testo: |
            Ti tiri indietro troppo tardi, e per tutto il giorno hai in bocca il
            sapore di una minestra mai assaggiata, troppo salata da un lato. Ogni
            volta che qualcuno ti parla ci metti un attimo a ricordare quale delle
            due vite stai facendo.
          effetti: { tormento: 1.5 }

      - testo: "Bere dalla pozza"
        descrizione: "Chi beve dalla Marea porta via qualcosa, e qualcosa ci lascia."
        quando: [pozza.segno == 0]
        esito:
          titolo: Il segno sul labbro
          testo: |
            Bevi dal palmo un liquido freddo e senza sapore, e il dolore delle
            ferite si scioglie come neve sul dorso della mano. Al primo ruscello
            ti guardi nell'acqua, e sul labbro di sotto ti è rimasto un segno
            chiaro e sottile che non viene via strofinando.
          effetti: { ferite: -1, tormento: -0.5, contaminazione: 1.5 }
          imposta: { pozza.segno: 1 }

      - testo: "Bere di nuovo"
        descrizione: "Il segno sul labbro si è fatto freddo appena hai visto la pozza, che a quanto pare ti conosce."
        quando: [pozza.segno >= 1]
        esito:
          titolo: La pozza ti viene incontro
          testo: |
            La superficie si solleva verso la tua mano come un cane che riconosce
            il padrone. Bevi, e il corpo ti si rimette a posto con uno
            scricchiolio di ossa, mentre il segno sul labbro si allunga fino
            all'angolo della bocca.
          effetti: { ferite: -1.5, contaminazione: 1.5 }

  # ================================================================ 6 · l'Osservatore senza volto
  - id: carta-sup-l-osservatore
    tipo: carta
    area: superficie-fratturata
    immagine: icone/android-mask
    titolo: L'Osservatore senza volto
    sommario: "In mezzo al pianoro c'è una figura liscia e alta, senza faccia. Finché la guardi resta ferma."
    luogo: Superficie Fratturata, un pianoro di ghiaia sotto le terrazze
    testo: |
      Sul pianoro, a una cinquantina di passi, c'è una figura alta e liscia,
      di un materiale grigio chiaro senza giunture, e dove dovrebbe avere la
      faccia la superficie continua uguale, come il dorso di un cucchiaio. Una
      lucertola di roccia le si accuccia nell'ombra. Resta ferma finché la
      tieni d'occhio, e quando ti chini a stringere la fibbia di uno stivale e
      rialzi la testa è più vicina, senza un'orma sulla ghiaia fra voi due.

      {furtivita Media} Fra te e il bordo del pianoro ci sono cento passi di
      ghiaia scoperta, e nemmeno un sasso dietro cui sparire.
    opzioni:
      - testo: "Voltarle le spalle e proseguire"
        descrizione: "Se le volti le spalle forse ti lascia andare, oppure ti segue."
        quando: [osservatore.marchio == 0]
        esito:
          titolo: Il contatto
          testo: |
            Cammini senza voltarti, e ogni volta che ti giri la trovi più vicina.
            Alla fine del pianoro due dita fredde e senza unghie ti toccano la
            tempia, e per un lungo momento ti vedi dall'alto, da molti punti
            insieme. Quando torni in te sei in ginocchio, e la figura è sparita.
          effetti: { tormento: 1.5, racconto: 1 }

      - testo: "Andarle incontro"
        descrizione: "Guardarla dove non ha la faccia, e qualunque cosa faccia la farà a te."
        quando: [osservatore.marchio == 0]
        esito:
          titolo: Il marchio
          testo: |
            Le vai incontro a passo normale e lei ti lascia arrivare. Da vicino è
            più alta di quanto sembrasse, e si piega senza articolazioni per
            appoggiarti il palmo sul dorso della mano, dove il freddo ti entra
            sotto la pelle e resta, in un cerchio piccolo come una moneta che ogni
            tanto si accende di azzurro pallido.
          effetti: { tormento: 1 }
          imposta: { osservatore.marchio: 1 }

      - testo: "Lasciare che ti guardi"
        descrizione: "Ti ha già segnato, e il cerchio sulla mano adesso è freddo."
        quando: [osservatore.marchio == 1]
        esito:
          titolo: Ti riconosce
          testo: |
            Resti dove sei, e la figura si ferma a un braccio da te e piega la
            testa liscia come un cane che sente un fischio, mentre il cerchio
            sulla tua mano si accende. Poi apre un palmo che prima non aveva e ti
            porge un guscio sigillato, e quando l'hai preso torna indietro sulla
            ghiaia senza lasciare impronte.
          effetti: { reperto.sigillato: 1, tormento: 1 }

      - testo: "Studiarla con calma"
        descrizione: "Capire come è fatta senza distogliere gli occhi, a rischio di vedere più del voluto."
        quando: [oggetto.visore == 0]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: La lente
          testo: |
            Dopo un'ora che la guardi vedi la cucitura di luce che le corre lungo
            il petto, e capisci che la figura registra tutto e lo manda giù per le
            crepe azzurre, lungo i fili di luce che corrono sotto le terrazze fino
            al Nodo dei Precursori. Quando ti alzi le cade ai piedi una lente
            montata su un archetto di metallo, come si scarta un pezzo consumato.
          pe: { tecnologia: 10 }
          effetti: { oggetto.visore: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Registrato
          testo: |
            Dopo un po' gli occhi ti lacrimano, e quando batti le palpebre la
            figura ti è davanti. Sulla superficie liscia compare la tua faccia,
            che ti imita con un poco di ritardo e un'aria più stanca, e la figura
            se la porta via quando se ne va.
          effetti: { tormento: 1.5 }

      - testo: "Studiarla di nuovo"
        descrizione: "Della cucitura di luce sai già qualcosa, e il resto si può imparare."
        quando: [oggetto.visore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il verso in cui si gira
          testo: |
            Stavolta sai dove guardare. La cucitura si accende sempre dal lato
            delle terrazze, e la figura si gira verso gli anelli ogni volta che
            lontano un drone si stacca dal suo, abbastanza per una storia che i
            Raschiatori del Grifone pagheranno in birra e in domande.
          pe: { tecnologia: 6 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Troppo a lungo
          testo: |
            Resti a guardarla finché la luce cambia, e quando ti alzi hai la testa
            piena di ronzii e non ricordi da che parte sei arrivato. Per tornare
            sulla strada ti ci vuole molto più del dovuto.
          effetti: { tormento: 1 }

      - testo: "Andarsene senza fretta"
        descrizione: "Ti conosce, e forse ti lascia andare per conto tuo."
        quando: [osservatore.marchio == 1]
        costo: 0
        esito:
          titolo: Fino al bordo
          testo: |
            Ti avvii a passo tranquillo, e la figura ti segue a distanza fissa
            fino al bordo del pianoro. Quando ti volti l'ultima volta è ancora lì,
            con la lucertola di roccia di nuovo nella sua ombra, e alzi una mano
            senza sapere perché.

  # ================================================================ 10 · l'accampamento ancora caldo
  - id: carta-sup-accampamento-ancora-caldo
    tipo: carta
    area: superficie-fratturata
    immagine: icone/campfire
    titolo: L'accampamento ancora caldo
    sommario: "Fra due spuntoni di roccia qualcuno ha lasciato il fuoco acceso e la cena a metà."
    luogo: Superficie Fratturata, un riparo fra due spuntoni di roccia
    testo: |
      Fra due spuntoni di roccia trovi i resti di un accampamento, con la
      brace ancora calda sotto la cenere e una coperta trascinata per qualche
      passo, tirata da un cordino. Vicino al fuoco la terra ha una crepa
      sottile con una patina chiara sui bordi, simile a latte seccato. Le
      impronte intorno sono tante e confuse, e su una pietra piatta è rimasta
      una tazza di latta mezza piena, con il manico riparato col fil di ferro.

      {origine fuggiasco-di-ghoran} Quando sei scappato da Ghoran hai lasciato
      anche tu tutto dov'era.
    opzioni:
      - testo: "Seguire le tracce"
        descrizione: "Fra tante orme confuse ce ne saranno due che vanno davvero da qualche parte."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Le orme buone
          testo: |
            Le orme verso la strada sono vecchie e quelle verso le terrazze basse
            sono di un mulo. Quelle buone sono di una donna e di un ragazzo, che
            scappano nella direzione opposta al fuoco, e le segui giù per due
            gradoni fino a una sporgenza dove qualcuno tira su col naso.
          pe: { natura: 5 }
          segue: carta-sup-accampamento-tracce
        fallimento:
          titolo: Le orme sbagliate
          testo: |
            Segui una fila di orme che ti sembra chiara, e ti porta in tondo fra i
            gradoni fino a una chiazza di nebbia grigia che ti arriva ai polpacci
            prima che tu te ne accorga. Torni indietro di corsa con il freddo
            nelle gambe, e del campo non ritrovi più nemmeno il fumo.
          effetti: { contaminazione: 1.5 }

      - testo: "Aspettare che qualcuno torni"
        descrizione: "La tazza è mezza piena, e chi l'ha lasciata ci ripenserà."
        costo: 2
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: Il ragazzo della coperta
          testo: |
            Verso sera dai gradoni scende un ragazzo magro con la faccia nera di
            carbone, e gli parli piano con le mani in vista sulle ginocchia. Fa il
            carbonaio a Pannion con la sorella, e stanotte la crepa accanto al
            fuoco si è messa a fischiare e ne è salita una nebbia grigia e fredda.
            Si riprende coperta e tazza e ti dice da quali crepe girare al largo.
          pe: { empatia: 6 }
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Un sasso dal buio
          testo: |
            Ti alzi troppo in fretta quando senti dei passi, e dal buio arriva un
            sasso che ti prende sopra l'orecchio. La mattina dopo la coperta e la
            tazza sono sparite.
          effetti: { ferite: 0.5 }

      - testo: "Frugare fra le loro cose"
        descrizione: "Chi è scappato ha lasciato tutto, e nessuno ti impedisce di frugare."
        esito:
          titolo: La roba degli altri
          testo: |
            Nella sacca sotto la coperta trovi un rotolo di bende pulite, una
            borsetta con qualche moneta e un cristallo esausto avvolto in uno
            straccio, e niente che dica chi fossero. La coperta vicino alla crepa
            è unta, e dopo averla spostata le mani ti pizzicano fino a sera.
          effetti: { bende: 1, monete: 3, cristalli.frammento-esausto: 1, contaminazione: 1 }

  - id: carta-sup-accampamento-tracce
    tipo: seguito
    area: superficie-fratturata
    immagine: icone/footprint
    titolo: Sotto la sporgenza
    sommario: "Sotto una sporgenza di basalto due carbonai di Pannion aspettano che passi la notte di ieri."
    luogo: Superficie Fratturata, sotto una sporgenza di basalto
    testo: |
      Sotto la sporgenza una donna dalla faccia rigata di nero tiene alzata una
      pala da carbone che trema, e dietro di lei c'è un ragazzo dalle ginocchia
      sbucciate. Abbassa la pala quando ti vede bene. «Per il fumo di Pannion,
      sei una persona. Ecco, meno male.»

      Stanotte dalla crepa vicino al fuoco è salita fischiando una nebbia
      grigia, e sono scappati lasciando il carro. «Senza il carro non torniamo
      a casa» dice, «e io là da sola ho paura di tornarci, ecco.»

      {origine figlio-della-citta-bassa} Da bambino guardavi i carbonai
      scaricare all'alba davanti alle fucine, gli unici più sporchi di te.
    opzioni:
      - testo: "Accompagnarli a riprendere il carro"
        descrizione: "Bisogna capire se la crepa ha smesso di fischiare, e girarle intorno al punto giusto."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il carro dei carbonai
          testo: |
            La patina sui bordi della crepa si è già seccata, e la nebbia è
            tornata giù. Fai fare ai carbonai il giro largo, dalla parte del
            vento, e ritrovate il mulo più avanti che bruca un cespuglio. La donna
            ti mette in mano qualche moneta annerita di carbone e ti dice di
            chiedere di lei ai forni di Pannion.
          effetti: { monete: 5, informazioni.voce: 1 }
        fallimento:
          titolo: La crepa fischia ancora
          testo: |
            Mentre sistemate i sacchi la crepa ricomincia a fischiare, e la nebbia
            sale fino alle ginocchia. Portate via il carro a braccia, e per tutta la
            strada hai le caviglie grigie come cenere. La donna ti paga lo stesso,
            borbottando che ecco, almeno il carbone c'è.
          effetti: { monete: 2, contaminazione: 1.5 }

      - testo: "Indicare loro la strada per la città"
        descrizione: "Il carro è loro, e tu sai da che parte è la città."
        costo: 0
        esito:
          titolo: Da quella parte
          testo: |
            Indichi la strada degli scavi e le frecce bianche, avvertendoli che
            qualcuna è girata per scherzo. La donna ripete le indicazioni al
            ragazzo, che le ripete a sua volta sbagliando la seconda, e quando ti
            volti stanno ancora discutendo se tornare al carro.

  # ================================================================ 11 · il cacciatore ferito
  - id: carta-sup-cacciatore-ferito
    tipo: carta
    area: superficie-fratturata
    immagine: icone/bow-arrow
    titolo: Il cacciatore ferito
    sommario: "Contro un anello di metallo siede un cacciatore di lucertole con il fianco aperto."
    luogo: Superficie Fratturata, poco fuori dal sentiero, contro un anello mezzo sepolto
    testo: |
      Poco fuori dal sentiero, con la schiena contro un anello di metallo, siede
      un cacciatore in giubba di pelle con una fila di lacci da trappola alla
      cintura e il fianco fasciato con la manica della camicia, nera di sangue.
      «Non ti fermare troppo, eh» dice a denti stretti, guardando alle tue
      spalle. «Io non li ho cercati, capito? Sono loro che hanno trovato me.»
      Tiene il palmo sopra un sacco di tela chiuso stretto.

      {origine accolito-del-velo} Le mani cercano le bende prima che tu abbia
      deciso di fermarti, come sotto la tenda del Festival.
    opzioni:
      - testo: "Medicargli la ferita"
        descrizione: "La ferita va pulita e chiusa, e lui deve stare fermo mentre lo fai."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: Il filo del laccio
          testo: |
            Lavi la ferita e la chiudi con il filo di un laccio da trappola,
            mentre lui morde la cinghia della giubba e ti bestemmia contro con
            educazione. Poi racconta da solo che al terzo colpo di mazzuolo su un
            picchetto vicino all'anello ne sono uscite delle sfere, e che sotto il
            picchetto aveva trovato un guscio sigillato. «Tienilo tu, capito?»
            dice, e te lo spinge in mano.
          pe: { medicina: 10 }
          effetti: { reperto.sigillato: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Fino alla strada
          testo: |
            Appena tocchi la fasciatura la ferita si riapre e lui sviene. Lo porti
            in spalla fino alla strada degli scavi, dove un carrettiere lo prende su
            per pietà, e ti resta la schiena a pezzi e la camicia incollata di
            sangue non tuo.
          pe: { medicina: 3 }
          effetti: { ferite: 0.5 }

      - testo: "Dargli le tue bende"
        descrizione: "Con una fasciatura vera si rimette in piedi da solo, e magari ti dice qualcosa di utile."
        requisiti: [bende >= 1]
        esito:
          titolo: I lacci
          testo: |
            Si fascia da solo e stretto, con mani che sanno farlo, e quando il
            colore gli torna in faccia ti mostra dove si mettono i lacci per le
            lucertole di roccia, che escono a scaldarsi sulle lastre di metallo e
            tornano sempre per la stessa strada. «Così le prendi, capito?» Poi se
            ne va zoppicando verso la città, con il sacco sotto il braccio.
          pe: { natura: 8 }
          effetti: { bende: -1, informazioni.voce: 1 }

      - testo: "Fargli dire che cosa l'ha ferito"
        descrizione: "Nasconde qualcosa nel sacco, e chi l'ha ferito potrebbe essere ancora qui intorno."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Il sacco
          testo: |
            Gli metti un piede sul sacco e aspetti senza dire niente, e lui regge
            poco. Racconta delle sfere uscite dall'anello mentre piantava un
            picchetto, che basta battere i piedi per far uscire di nuovo, e
            scioglie il nodo per darti il guscio sigillato che aveva scavato.
            «Prenditelo, capito? Tanto porta male.»
          effetti: { reperto.sigillato: 1, informazioni.voce: 1, tormento: 1 }
        fallimento:
          titolo: Le terrazze alte
          testo: |
            Più insisti e più lui si confonde, e alla fine ti manda verso le
            terrazze alte per toglierti di torno. Due gradoni più su batti il piede
            sul metallo sbagliato, e le sfere ti inseguono fino al sentiero.
          effetti: { ferite: 1 }

      - testo: "Lasciarlo dov'è"
        descrizione: "Ha detto di non fermarti troppo. Lo prendi in parola."
        costo: 0
        esito:
          titolo: Il sacco in grembo
          testo: |
            Tiri dritto e alla curva ti volti a guardarlo. Si è tirato il sacco in
            grembo e ci tiene sopra tutte e due le mani, con la testa appoggiata
            all'anello.
          effetti: { tormento: 1 }

  # ================================================================ 13 · la tempesta di cenere
  - id: carta-sup-tempesta-di-cenere
    tipo: carta
    area: superficie-fratturata
    immagine: icone/sandstorm
    titolo: La tempesta di cenere
    sommario: "Da sud arriva un muro di cenere, e dentro la cenere qualcuno litiga per un mulo."
    luogo: Superficie Fratturata, sulle terrazze aperte verso sud
    testo: |
      Verso sud si alza una colonna scura che si allarga e si abbassa, e
      capisci che è cenere portata dal vento. Il cielo prende il colore di una
      pentola vecchia, e presto la strada davanti a te si accorcia a dieci
      passi. A sinistra c'è una sporgenza di basalto. A destra, dentro la
      cenere, senti ragliare un mulo e due voci che litigano su chi doveva
      legarlo e su come dividere la roba del Raschiatore.

      {conoscenze-della-strada Media} Litigano sulla spartizione prima di
      essere al sicuro, e i dilettanti si spaventano presto e menano a caso.
    opzioni:
      - testo: "Ripararsi sotto la sporgenza"
        descrizione: "Rannicchiarsi sotto la roccia con la faccia coperta e aspettare che passi."
        costo: 2
        esito:
          titolo: I segni sulla roccia
          testo: |
            Ti rannicchi sotto la sporgenza con la sciarpa sulla bocca. Sulla
            parete chi si è riparato qui prima di te ha inciso tacche e nomi, e
            qualcuno ha scritto che la crepa grande più a valle si è allargata.
            Quando la tempesta passa aggiungi la tua tacca.
          effetti: { informazioni.voce: 1, tormento: -0.5 }

      - testo: "Proseguire nella cenere"
        descrizione: "Tenere la direzione senza vedere niente, su terrazze piene di crepe."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il vento sulla guancia
          testo: |
            Ti tieni il vento sulla guancia sinistra e conti i gradoni sotto i
            piedi. Quando la cenere si dirada sei sulla strada degli scavi, più
            avanti di quanto contavi, grigio da capo a piedi come una statua di
            cortile.
          pe: { natura: 8 }
        fallimento:
          titolo: In tondo
          testo: |
            Il vento gira e tu non te ne accorgi, e quando la cenere si dirada sei
            sull'orlo di una crepa azzurra con la punta degli stivali nel vuoto. Ti
            butti indietro in tempo, e ne esci con una caviglia storta.
          effetti: { ferite: 0.5, contaminazione: 1 }

      - testo: "Avvicinarsi alle voci"
        descrizione: "Nella cenere ci vedono poco anche loro, e il mulo è legato male."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Il basto del mulo
          testo: |
            Arrivi alle spalle del mulo seguendo il raglio, mentre i due predoni
            litigano dietro un carro rovesciato. Sciogli piano dal basto una borsa
            da Raschiatore, con il mulo che ti soffia sul collo, e te la porti via
            nella cenere. Dentro ci sono qualche moneta e un guscio sigillato
            avvolto in un fazzoletto ricamato.
          effetti: { monete: 6, reperto.sigillato: 1 }
        fallimento:
          titolo: Il raglio
          testo: |
            Il mulo raglia proprio mentre allunghi la mano sul basto, e i predoni
            saltano fuori menando colpi a caso, uno dei quali ti prende
            sull'avambraccio. Scappi tenendoti il braccio, e loro restano a
            gridarsi che era colpa dell'altro.
          effetti: { ferite: 1 }

  # ================================================================ 14 · i predoni disorganizzati
  - id: carta-sup-predoni-disorganizzati
    tipo: carta
    area: superficie-fratturata
    immagine: icone/bandit
    titolo: Predoni alle prime armi
    sommario: "Da dietro una roccia escono tre predoni con armature spaiate, e un quarto che spera di non essere visto."
    luogo: Superficie Fratturata, una sporgenza di roccia lungo il sentiero
    testo: |
      Da dietro una sporgenza escono tre figure, e una quarta che resta indietro. Lo scudo di quello davanti è il coperchio di
      un forno con la maniglia ancora attaccata. «Resta lì dove sei» dice lui, e la voce gli sale di un tono a metà della
      frase. Gli altri due tengono le lance basse, e quello rimasto indietro è un ragazzo che stringe una balestra senza
      dardo.

      {intimidire Media} Hanno paura tutti, e il capo più degli altri.

      {origine mercante-dei-ponti} Dai un prezzo per abitudine a ogni pezzo che hanno addosso, e la somma non arriva a un buon
      coltello.
    opzioni:
      - testo: "Combattere"
        descrizione: "Sono in tre con poca voglia di menare le mani, e se uno scappa scappano tutti."
        combattimento: predoni-disorganizzati
        vittoria:
          titolo: Il coperchio
          testo: |
            Il primo che va giù si porta via il coraggio degli altri, e il
            sentiero si svuota. Per terra restano il coperchio del forno e una
            borsa caduta nella fuga con dentro qualche moneta e un rotolo di
            bende, e del ragazzo con la balestra non c'è più traccia.
          effetti: { monete: 5, bende: 1 }
        sconfitta:
          titolo: Più fortunati che bravi
          testo: |
            Erano più di quanti ne sapessi gestire. Ti ritrovi seduto per terra
            con un livido sulla tempia e la borsa più leggera, mentre da lontano
            li senti darsi pacche sulle spalle come se avessero vinto una guerra.
          effetti: { monete: -5 }

      - testo: "Spaventarli"
        descrizione: "Hanno più paura loro di te. Bisogna solo farglielo capire prima che il capo si convinca del contrario."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Indietro
          testo: |
            Fai un passo avanti e spieghi piano al capo che cosa farai al suo
            coperchio, con qualche dettaglio di troppo. Il ragazzo con la balestra
            se ne va per primo e gli altri lo seguono, mentre il capo ti lancia
            una borsetta perché tu non li segua.
          pe: { intimidire: 8 }
          effetti: { monete: 3 }
        fallimento:
          titolo: Il coraggio del capo
          testo: |
            Il capo non può tirarsi indietro davanti agli altri, e ti colpisce
            sulla spalla con l'asta della lancia prima di spaventarsi di quello
            che ha fatto e scappare con tutti gli altri. Ti restano un livido
            sotto la camicia e la soddisfazione storta di averli fatti correre.
          effetti: { ferite: 1 }

      - testo: "Parlarci"
        descrizione: "Non sembrano predoni da molto tempo. Chi erano prima, forse, sa cose utili."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: I mulini fermi
          testo: |
            Bastano due domande sul coperchio perché il capo abbassi la lancia.
            Lavoravano ai mulini di Laresh, chiusi dal padrone per l'inverno, e ti
            raccontano quali carovane viaggiano senza scorta e dove la Gilda ha
            messo le guardie nuove, oltre a chi compra la roba dei Raschiatori
            senza domande. Poi ti chiedono se conosci un lavoro onesto in città.
          pe: { conoscenze-della-strada: 6 }
          effetti: { informazioni.pettegolezzo: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La mano del ragazzo
          testo: |
            Mentre il capo annuisce a tutto, il ragazzo della balestra ti gira
            intorno, e quando spariscono dietro la roccia la tua borsa ha una
            cucitura aperta tagliata con una certa eleganza.
          effetti: { monete: -3, tormento: 0.5 }
      - testo: "Parlare al ragazzo con la balestra"
        descrizione: "Il ragazzo ha l'aria di uno che vorrebbe essere a casa."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La balestra senza dardo
          testo: |
            Chiedi al ragazzo, con calma, se sua madre sa dov'è stamattina, e lui
            arrossisce fino alle orecchie mentre la balestra gli scende di un palmo.
            Adesso gli altri guardano lui, e se ne vanno borbottando. Prima di
            sparire il ragazzo torna indietro di corsa, ti mette in mano un rotolo
            di bende «per il disturbo» e ti dice sottovoce quale tratto di strada
            evitare domani.
          pe: { empatia: 6 }
          effetti: { bende: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Sopra la testa del capo
          testo: |
            Il capo la prende come un'offesa e ti spinge indietro con il coperchio
            del forno, e finisci seduto nella polvere. Quando ti rialzi se ne sono
            andati ridendo, e ti fanno male il gomito e un poco l'orgoglio.
          effetti: { ferite: 0.5 }


  # ================================================================ 15 · il vecchio viandante
  - id: carta-sup-vecchio-viandante
    tipo: carta
    area: superficie-fratturata
    immagine: icone/pilgrim-hat
    titolo: Il vecchio viandante
    sommario: "Un vecchio con un bastone levigato ti viene incontro sul sentiero, e conosce la strada meglio di chiunque."
    luogo: Superficie Fratturata, sul sentiero fra due terrazze
    testo: |
      Sul sentiero ti viene incontro un vecchio con un passo lento che non
      cambia mai, e un bastone levigato che appoggia a terra ogni due passi,
      come se misurasse la strada. Ha la pelle del collo cotta dal sole e una
      sciarpa di lana rossa rammendata con un filo azzurro, e ti saluta con il
      mento.

      «Strada lunga, questa» dice, «e con chi non la conosce non è gentile per
      niente.»

      {origine figlio-del-circolo} Ti ha guardato come al Circolo si guarda chi
      arriva dal sentiero, prima il fango sugli stivali e poi la faccia.
    opzioni:
      - testo: "Fare un tratto di strada con lui"
        descrizione: "Al suo passo si va piano, ma lui sa dove mettere i piedi e ha voglia di parlare."
        costo: 2
        esito:
          titolo: Le frecce girate
          testo: |
            Camminate insieme per mezza giornata, e lui ti mostra la strada come
            si mostra la casa a un ospite, indicandoti con il bastone gli anelli
            che non vanno toccati e la lastra dove le lucertole si scaldano ogni
            mattina. «La strada te lo dice, se la guardi.» Al bivio per Laresh
            prende l'altra via.
          pe: { conoscenze-della-strada: 10 }
          effetti: { informazioni.pettegolezzo: 1 }

      - testo: "Chiedergli come si legge la Superficie"
        descrizione: "Sa quali crepe sono sicure e quali no, e forse te lo insegna."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Le crepe che fumano
          testo: |
            Si accuccia accanto a una crepa e ti fa mettere la mano sopra. «Se
            l'aria è calda, la strada è buona» dice. «Se è fredda, cambia strada.»
            Poi ti mostra la patina chiara sui bordi e i licheni che crescono solo
            dalla parte da cui non sale niente, e alla seconda volta che ripeti
            tutto annuisce, soddisfatto.
          pe: { natura: 12 }
        fallimento:
          titolo: Il gradone che cede
          testo: |
            Annuisci senza seguirlo davvero, e poco dopo il bordo di un gradone
            che lui aveva appena indicato ti si sbriciola sotto la suola. Il
            vecchio ti tira su per il bavero con una forza inattesa, e ti spiega
            tutto di nuovo con pazienza.
          pe: { natura: 4 }
          effetti: { ferite: 0.5 }

      - testo: "Dividere con lui il pane"
        descrizione: "Sedersi su un sasso a mangiare qualcosa insieme, e per una volta riposare le gambe."
        esito:
          titolo: Il grasso di marmotta
          testo: |
            Dividete il pane sullo stesso sasso, e lui ti fa togliere lo stivale e
            ti spalma sul tallone un grasso che puzza di marmotta e brucia per un
            momento. Intanto ti racconta di una carovana per Pannion che cerca chi
            sappia tenere in mano un'arma, e quando ti rimetti lo stivale il piede
            non fa più male.
          effetti: { ferite: -0.5, informazioni.voce: 1 }

      - testo: "Tirare dritto"
        descrizione: "Di un vecchio solo sulla Superficie non ti fidi."
        costo: 0
        esito:
          titolo: Strada lunga
          testo: |
            Gli passi accanto con la mano vicino alla cintura, e lui si fa da
            parte. «Strada lunga» dice di nuovo alle tue spalle senza offendersi,
            e ti resta il dubbio che il pericolo sul sentiero fossi tu.

  # ================================================================ 17 · lo sciame di insetti
  - id: carta-sup-sciame-di-insetti
    tipo: carta
    area: superficie-fratturata
    immagine: icone/fly
    titolo: Lo sciame color ruggine
    sommario: "Una nube di insetti ramati ti si posa addosso, e a migliaia su una lastra di metallo poco lontano."
    luogo: Superficie Fratturata, ai piedi di un gradone
    testo: |
      Il ronzio arriva prima dello sciame, così basso che lo scambi per il
      vento fra gli anelli, poi sopra il gradone compare una nube color
      ruggine e in un attimo ti è addosso. Sono insetti piccoli come chicchi
      di riso, con il dorso ramato, che ti camminano sulle palpebre e ti
      entrano nel colletto. Più in là, su una lastra di metallo che affiora
      dalla ghiaia, si posano a migliaia finché la lastra sembra coperta di
      pelliccia.

      {natura Media} Pungono soltanto quando si sentono schiacciati, e a loro
      piace il caldo del metallo.
    opzioni:
      - testo: "Attraversare lo sciame"
        descrizione: "Testa bassa e passo lungo, finché si esce dall'altra parte."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Facile }
        successo:
          titolo: Dall'altra parte
          testo: |
            Tieni gli occhi socchiusi e conti i passi, e dopo una trentina lo
            sciame si dirada. Alcuni insetti ti restano nelle pieghe dei vestiti
            fino a sera, quando li fai volare fuori dalla finestra.
          pe: { resistenza: 5 }
        fallimento:
          titolo: Negli occhi
          testo: |
            Due insetti ti entrano in un occhio, e mentre ti strofini la faccia
            scivoli giù per un gradone. Ne esci con una mano sbucciata e l'occhio
            gonfio che lacrima per tutto il giorno.
          effetti: { ferite: 0.5 }

      - testo: "Coprirsi e aspettare che passi"
        descrizione: "Accucciarsi con la sciarpa sulla testa e lasciare che lo sciame passi, perdendo tempo."
        costo: 2
        esito:
          titolo: Sotto la sciarpa
          testo: |
            Ti accucci con la sciarpa sulla testa e le mani nelle maniche, e il
            ronzio ti passa sopra a lungo prima di allontanarsi verso le crepe.
            Quando ti rialzi la lastra poco lontano è di nuovo nuda e lucida.
          pe: { natura: 4 }

      - testo: "Andare a vedere la lastra"
        descrizione: "Dove gli insetti si ammucchiano il metallo è caldo, e da queste parti vuol dire che funziona."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il metallo caldo
          testo: |
            Spazzi via gli insetti e sotto c'è una lastra tiepida con una cucitura
            sottile che vibra appena. Fai leva con il coltello e la lastra si apre
            di un dito, e dentro, incastrato nella sua sede, c'è un guscio
            sigillato tiepido come il pane del mattino.
          effetti: { reperto.sigillato: 1 }
        fallimento:
          titolo: Troppo a lungo nello sciame
          testo: |
            Cerchi la cucitura a tentoni sotto uno strato di insetti, che dopo un
            po' cominciano a pungere davvero. Te ne vai con le mani coperte di
            bolle rosse che pulsano fino a sera.
          effetti: { ferite: 0.5, tormento: 1 }
