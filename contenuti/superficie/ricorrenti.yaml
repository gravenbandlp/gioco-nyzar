# La Superficie Fratturata: gli incontri che ritornano (tabella 5, 8, 46) e la Frattura che respira (9).
# Carte del mazzo della Superficie in più stadi, più tre storylet fissi alle terrazze di basalto.
# Nomi nuovi, che il Codex non dà: Edric Vasso (il Cavaliere, scorta dei carri del grano di Laresh) e Sorba
# (la sua cavalla).
#
# IL MERCANTE DELLA MEMORIA RESIDUA (5)
#   mercante.incontri  sale di 1 a ogni carta giocata (ogni opzione con costo).
#     0      carta-sup-mercante-primo    l'anello (racconto -1 → tormento -1), la lama (pe.armi-da-mischia → 0,
#                                        impugnatura-2), rifiutare, aggredirlo (sparisce, reperto -1).
#     1..3   carta-sup-mercante          uno scambio diverso per ogni visita (quando incontri == 1, 2, 3):
#                                        rep.grifone -1 → 2 reperti; pe.resilienza → 0 → tormento -1;
#                                        rep.raschiatori -1 → camera-3. Più rifiutare, aggredirlo e le vendite.
#     >= 4   carta-sup-mercante-scatola  il finale, finché mercante.scatola == 0.
#   mercante.scatola   0 chiusa e sul panno; 1 aperta (pe resilienza 20, racconto, tormento +1);
#                      2 lasciata a lui (nucleo-3). Da 1 in poi: carta-sup-mercante-dopo, ripetibile, con
#                      racconto -1 → tormento -1 e pe.tecnologia → 0 → 2 reperti.
#   Vendite del congegno di Oda (carte -mercante e -dopo): quando banco.parti >= 4; con banco.stranezza >= 4
#   un ricordo (pe 15 in un'abilità e tormento -1), con banco.stranezza >= 7 pe 30 e nucleo-3. Ogni vendita
#   azzera tutte le banco.*.
#   Con bambino.distrutto == 1 il Mercante si prende il ricordo del bambino (pe.empatia → 0, tormento -1,
#   bambino.distrutto 2).
#
# IL BAMBINO SENZA IMPRONTE (8)
#   bambino.stadio   quante volte l'hai accolto (0–3).
#   bambino.via      1 quando l'hai mandato via e non è tornato; bambino.rifiuti conta i rifiuti.
#   bambino.fine     0 aperta, 1 entrato in te, 2 tornato nella Marea, 3 rifiutato per sempre, 4 distrutto.
#   bambino.distrutto 1 se l'hai distrutto (la Marea lo registra; lo nota il Mercante), 2 dopo il Mercante.
#     carta-sup-bambino        stadio 0, rifiuti 0      accogli → stadio 1; rifiuta → via 1, rifiuti 1;
#                                                       colpisci (Media) → fine 4.
#     carta-sup-bambino-torna  via 1, rifiuti 1         torna una volta sola: accogli → stadio +1, via 0;
#                                                       rifiuta → fine 3; colpisci (Media) → fine 4.
#     carta-sup-bambino-2      stadio 1, via 0          tieni → stadio 2 (reperto, contaminazione);
#                                                       lascia (rifiuti 0) → via 1, rifiuti 1;
#                                                       lascia per sempre (rifiuti 1) → fine 3;
#                                                       colpisci (Media) → fine 4.
#     carta-sup-bambino-3      stadio 2, via 0          tieni → stadio 3 (camera-2, contaminazione);
#                                                       lascia come sopra; colpisci (Difficile).
#     carta-sup-bambino-fine   stadio 3, via 0          lascialo entrare (fine 1); riportalo alla Marea
#                                                       (Difficile, nucleo-3, fine 2); distruggilo
#                                                       (sagome-della-marea; se perdi entra lo stesso).
#   La carta -torna riporta il bambino allo stadio dopo quello in cui l'hai lasciato (stadio +1).
#
# IL CAVALIERE DELLA MAREA (46)
#   cavaliere.incontri sale a ogni carta giocata; cavaliere.memoria 0–3 i frammenti d'identità restituiti;
#   cavaliere.fine 0 aperta, 1 abbattuto (involucro-3, racconto), 2 finale dialogato.
#     carta-sup-cavaliere        incontri 0                 combatti, saluta (memoria 0 → 1), giragli al largo.
#     carta-sup-cavaliere-torna  incontri >= 1, memoria <= 2  combatti; saluta (0 → 1, Media); chiedigli della
#                                                       strada (1 → 2, Media); raccontagli chi era
#                                                       (2 → 3, Difficile); giragli al largo.
#     carta-sup-cavaliere-nome   memoria 3                  ti chiede di finirlo: lo fai (involucro-3) o lo
#                                                       mandi a casa (impugnatura-3). Racconto in tutti e due.
#   In fondo a -cavaliere e -torna: prendere in consegna il carico (Difficile, Galateo o Persuasione), una volta sola
#   (cavaliere.consegna): 2 reperti, la storia resta aperta; il fallimento costa ferite e tormento.
#
# LA FRATTURA CHE RESPIRA (9), alle terrazze di basalto
#   frattura.respiro (0–4) e frattura.spenta sono in area.yaml; frattura.premio è qui.
#     sup-frattura-che-respira   ripetibile, respiro < 4 e spenta 0: stabilizzarla (una prova per ogni
#                                passo, quando respiro == 0..3), distruggerla (spenta 1), andarsene.
#     sup-frattura-respiro-lungo respiro >= 4 e premio 0: la camera-3 o la lezione; a un'ora di cammino si
#                                accende il Nodo dei Precursori (la spedizione è di un altro file).
#     sup-frattura-cicatrice     ripetibile, spenta 1: le cose cadono due volte o nessuna.
quality:
  - { id: mercante.incontri, nome: "Il Mercante della Memoria Residua", categoria: stato, nascosta: true, descrizione: "Quante volte hai incontrato il mercante seduto sulla cassa. Alla quarta ti offre la scatola piccola." }
  - { id: mercante.scatola, nome: "La scatola del Mercante", categoria: stato, nascosta: true, descrizione: "La scatola piccola del Mercante, 0 se è ancora sul panno, 1 se l'hai aperta, 2 se gliel'hai lasciata chiusa." }
  - { id: bambino.stadio, nome: "Il bambino senza impronte", categoria: stato, nascosta: true, descrizione: "Quante volte hai accolto il bambino senza impronte, da 0 a 3." }
  - { id: bambino.via, nome: "Il bambino mandato via", categoria: stato, nascosta: true, descrizione: "1 se hai mandato via il bambino senza impronte e non l'hai ancora ritrovato." }
  - { id: bambino.rifiuti, nome: "I rifiuti al bambino", categoria: stato, nascosta: true, descrizione: "Quante volte hai mandato via il bambino senza impronte. Torna una volta sola." }
  - { id: bambino.fine, nome: "Com'è finita con il bambino", categoria: stato, nascosta: true, descrizione: "0 se la storia è aperta, 1 se l'hai fatto entrare, 2 se è tornato nella Marea, 3 se l'hai rifiutato per sempre, 4 se l'hai distrutto." }
  - { id: bambino.distrutto, nome: "La Marea ricorda il bambino", categoria: stato, nascosta: true, descrizione: "1 se hai distrutto il bambino senza impronte e la Marea l'ha registrato, 2 se poi il Mercante te ne ha preso il ricordo." }
  - { id: cavaliere.incontri, nome: "Il Cavaliere della Marea", categoria: stato, nascosta: true, descrizione: "Quante volte hai incontrato il Cavaliere della Marea sul sentiero." }
  - { id: cavaliere.memoria, nome: "Quello che il Cavaliere ricorda", categoria: stato, nascosta: true, descrizione: "I frammenti d'identità che hai restituito al Cavaliere della Marea, da 0 a 3. A 3 ricorda il suo nome." }
  - { id: cavaliere.consegna, nome: "Il carico del Cavaliere", categoria: stato, nascosta: true, descrizione: "1 se hai preso in consegna dal Cavaliere della Marea il foglio di carico e i gusci che aveva raccolto lungo la strada." }
  - { id: cavaliere.fine, nome: "Com'è finita con il Cavaliere", categoria: stato, nascosta: true, descrizione: "0 se la storia è aperta, 1 se l'hai abbattuto, 2 se gli hai restituito il nome e hai fatto quello che ti ha chiesto." }
  - { id: frattura.premio, nome: "Il dono della Frattura", categoria: stato, nascosta: true, descrizione: "1 se la Frattura stabilizzata ti ha già dato il suo dono." }

storylet:
  # ================================================================ il Mercante della Memoria Residua (5)
  - id: carta-sup-mercante-primo
    tipo: carta
    area: superficie-fratturata
    immagine: icone/wooden-crate
    titolo: Il mercante sulla cassa
    sommario: "Su un pianoro senza strade un uomo seduto su una cassa ti aspetta con delle cose che dice tue."
    luogo: Superficie Fratturata, un pianoro di ghiaia fra due terrazze
    requisiti: [mercante.incontri == 0]
    testo: |
      Su un pianoro di ghiaia, su una cassa intorno a cui non c'è nessuna orma,
      ti aspetta un uomo con una giacca di lana troppo leggera per la Superficie.
      Sul panno ci sono una lama annerita e un anello scheggiato, e una scatola
      piccola con un gancio d'ottone.

      «Finalmente» dice, come a un nipote in ritardo. «Sono cose tue, e te le
      posso rendere. Monete però non ne uso.»

      {origine mercante-dei-ponti} Ai Ponti si chiama baratto, e la Gilda ci
      metterebbe il dazio lo stesso.

      *Non hai mai portato un anello in vita tua.* Il pollice intanto cerca
      l'anulare.
    opzioni:
      - testo: "Riprendere l'anello"
        descrizione: "In cambio vuole una storia mai raccontata, che dopo sparirà anche dalla tua memoria."
        requisiti: [racconto >= 1]
        esito:
          titolo: L'anello scheggiato
          testo: |
            Gli racconti la storia e lui l'ascolta a occhi chiusi, muovendo le labbra.
            L'anello ti entra al dito sopra il segno chiaro di un anello portato a
            lungo. La sera, al Grifone, apri la bocca per raccontare qualcosa a Liaren
            e non ti viene in mente niente.
          effetti: { racconto: -1, tormento: -1, mercante.incontri: 1 }
      - testo: "Prendere la lama annerita"
        descrizione: "In cambio di quello che hai imparato con la spada ti dà una lama da buttare con un'impugnatura che vale."
        requisiti: [pe.armi-da-mischia >= 10]
        esito:
          titolo: Mani nuove
          testo: |
            «Soltanto l'ultimo tratto» dice, «quello che hai imparato da quando hai
            smesso di contare i lividi.» Ti dà la lama, bruciata fino al codolo, con
            un'impugnatura di metallo scuro fatta per una mano più lunga della tua.
            Quando provi a metterti in guardia ti senti goffo come il primo giorno.
          imposta: { pe.armi-da-mischia: 0 }
          effetti: { parte.impugnatura-2: 1, mercante.incontri: 1 }
      - testo: "Dirgli di no"
        descrizione: "Con garbo, anche se non sembra il tipo da offendersi né da arrendersi."
        esito:
          titolo: Alla prossima
          testo: |
            Gli dici che non ti serve niente, e lui annuisce come se gli avessi dato ragione e annoda il panno. «Allora alla prossima»
            dice. «Io resto da queste parti, e tu ci passi spesso.» Dal bordo del pianoro ti volti, e lui alza la mano in un saluto da
            vicino di casa.
          effetti: { mercante.incontri: 1 }
      - testo: "Aggredirlo"
        descrizione: "Un uomo solo in mezzo al nulla che sa cose tue, e se è un uomo teme le lame."
        esito:
          titolo: La cassa vuota
          testo: |
            Fai due passi verso di lui con la mano sull'arma, e lui sospira come davanti
            a un cliente insolvente. Al terzo passo sul pianoro resta soltanto la cassa.

            {magia Media} Dove stava l'uomo l'aria sa di cristallo spento, e il Mana è
            ancora piegato.

            Al ritorno ti accorgi che dalla sacca manca qualcosa, e non ricordi che
            cosa.
          effetti: { reperto.sigillato: -1, tormento: 1, mercante.incontri: 1 }

  - id: carta-sup-mercante
    tipo: carta
    area: superficie-fratturata
    immagine: icone/wooden-crate
    titolo: Di nuovo la cassa
    sommario: "Il mercante senza monete ha spostato la cassa, e ti saluta come se vi foste visti ieri."
    luogo: Superficie Fratturata, in mezzo al sentiero delle terrazze
    requisiti: [mercante.incontri >= 1, mercante.incontri <= 3]
    testo: |
      Stavolta la cassa sta in mezzo al sentiero, e l'uomo con la giacca di lana
      ti saluta per nome, un nome che non gli hai mai detto. Sul panno ci sono un
      bottone d'osso e una chiave che non apre nessun armadio tuo, accanto alla
      scatola piccola. Se sul banco di Oda c'è un congegno finito, lui lo sa già e
      te ne chiede per primo.

      {tecnologia Media} La cerniera della scatola è di un metallo che in città
      non lavora nessuno.

      «Ho pensato a quello che ti pesa e a quello che ti manca» dice, «e adesso
      facciamo pari.»
    opzioni:
      - testo: "Cedergli le sere al Grifone"
        descrizione: "Al Grifone si ricorderanno un po' meno di te, in cambio di due reperti sigillati ancora sporchi di terra."
        quando: [mercante.incontri == 1]
        requisiti: [rep.grifone >= 1]
        esito:
          titolo: Una sedia libera
          testo: |
            A metà del racconto di una sera al Grifone lui alza la mano perché gli
            basta, e ti dà due reperti avvolti in carta oleata. Quella sera Liaren ti
            porge la lista delle stanze come a un forestiero, e un Raschiatore con cui
            hai bevuto spesso ti chiede se sei nuovo in città.
          effetti: { rep.grifone: -1, reperto.sigillato: 2, mercante.incontri: 1 }
      - testo: "Lasciargli la paura"
        descrizione: "Si prende il ricordo che ti sveglia di notte e quello che ti ha insegnato a reggere la paura."
        quando: [mercante.incontri == 2]
        requisiti: [pe.resilienza >= 10]
        esito:
          titolo: Il giorno che non torna
          testo: |
            «Quello» dice, prima che tu abbia scelto quale. Ci pensi un'ultima volta,
            con le unghie nei palmi, finché la cosa si fa piccola e sparisce, e per
            giorni dormi fino all'alba. La prima volta che qualcosa ti spaventa
            davvero, però, tremi al buio come un ragazzo al primo turno di scavo.
          imposta: { pe.resilienza: 0 }
          effetti: { tormento: -1, mercante.incontri: 1 }
      - testo: "Cedergli il nome di un compagno"
        descrizione: "Dimenticherai un Raschiatore con cui hai diviso la corda, e lui te, per una camera rara."
        quando: [mercante.incontri == 3]
        requisiti: [rep.raschiatori >= 1]
        esito:
          titolo: Il polso tranquillo
          testo: |
            Dici un nome sapendo che è l'ultima volta, e il mercante ti chiude fra le
            dita una camera di cristallo che batte come un polso tranquillo. La
            settimana dopo, al Grifone, un uomo con la barba bruciata da una parte ti
            guarda a lungo, poi torna dai suoi.
          effetti: { rep.raschiatori: -1, parte.camera-3: 1, mercante.incontri: 1 }
      - &mercante-bambino
        testo: "Cedergli il bambino"
        descrizione: "Si prende quello che hai fatto sul ciglio del sentiero, e con lui quello che capivi della gente."
        quando: [bambino.distrutto == 1]
        requisiti: [pe.empatia >= 10]
        esito:
          titolo: Nessun bambino
          testo: |
            «Questo pesa più degli altri» dice, e per la prima volta non sorride. Glielo racconti dall'inizio, e lui ripiega il
            panno come un lenzuolo. Tornando in città non ricordi più perché eviti i bambini per la strada, e fai fatica a capire
            che cosa vogliono le persone quando tacciono.
          imposta: { pe.empatia: 0, bambino.distrutto: 2 }
          effetti: { tormento: -1, mercante.incontri: 1 }
      - testo: "Vendergli il congegno di Oda"
        descrizione: "Per il congegno strano sul banco ti rende un ricordo d'infanzia, e con lui un occhio più attento."
        quando: [banco.parti >= 4]
        requisiti: [banco.stranezza >= 4]
        esito:
          titolo: I sassi colorati
          testo: |
            Si porta il congegno all'orecchio, e il congegno, che da Oda ronzava
            sempre, tace. Poi ti tocca la fronte e ti torna in mente un'estate nel
            greto di un fiume a cercare sassi colorati con un amico che li trovava
            tutti, finché hai capito dove guardare.
          pe: { percezione: 15 }
          imposta: { banco.involucro: 0, banco.camera: 0, banco.impugnatura: 0, banco.nucleo: 0, banco.parti: 0, banco.potenza: 0, banco.stabilita: 0, banco.stranezza: 0 }
          effetti: { tormento: -1, mercante.incontri: 1 }
      - testo: "Vendergli il congegno per un'estate"
        descrizione: "Lo stesso congegno per un altro ricordo, che ti torna nelle gambe."
        quando: [banco.parti >= 4]
        requisiti: [banco.stranezza >= 4]
        esito:
          titolo: Il fosso
          testo: |
            Gira il congegno fra le mani come un melone al mercato, e sul congegno si
            accende una luce che da Oda non si era mai vista. In cambio ti restituisce
            il fosso dietro casa che da bambino nessuno riusciva a saltare, e tu che lo
            saltavi, una volta sola. Per un tratto di sentiero ti viene voglia di
            correre, e corri.
          pe: { atletica: 15 }
          imposta: { banco.involucro: 0, banco.camera: 0, banco.impugnatura: 0, banco.nucleo: 0, banco.parti: 0, banco.potenza: 0, banco.stabilita: 0, banco.stranezza: 0 }
          effetti: { tormento: -1, mercante.incontri: 1 }
      - testo: "Vendergli il congegno che non dovrebbe esistere"
        descrizione: "Per il congegno più strano uscito dal banco di Oda paga un ricordo intero e un nucleo raro."
        quando: [banco.parti >= 4]
        requisiti: [banco.stranezza >= 7]
        esito:
          titolo: Una notte intera
          testo: |
            Quando vede il congegno il mercante si alza in piedi senza sparire, per
            la prima volta. Ti posa sul palmo un nucleo grigio e ti restituisce una
            notte di febbre di quando eri piccolo, e adesso sai chi ti ha vegliato
            fino all'alba e che canzone cantava.
          pe: { resilienza: 30 }
          imposta: { banco.involucro: 0, banco.camera: 0, banco.impugnatura: 0, banco.nucleo: 0, banco.parti: 0, banco.potenza: 0, banco.stabilita: 0, banco.stranezza: 0 }
          effetti: { parte.nucleo-3: 1, mercante.incontri: 1 }
      - testo: "Dirgli di no"
        descrizione: "Con lui un no vale fino alla prossima volta."
        esito:
          titolo: Al caldo
          testo: |
            Scuoti la testa, e lui rimette le cose nel panno con la cura di un
            orologiaio. «Le cose tue non scappano, te le tengo io al caldo» dice.
            Andando via lo senti fischiettare una canzone che conosci senza sapere
            dove l'hai imparata.
          effetti: { mercante.incontri: 1 }
      - testo: "Aggredirlo"
        descrizione: "L'altra volta forse eri troppo lento, o forse a lui non si arriva."
        esito:
          titolo: Il coperchio alzato
          testo: |
            Stavolta la mano parte verso l'arma tardi e storta, e lui si alza e ti fa un mezzo inchino. Quando
            sbatti le palpebre sul sentiero c'è soltanto la cassa vuota. Per tutto il giorno metti i piedi con
            troppa cautela, e la sera nella sacca trovi lo spazio dove c'era qualcosa.
          effetti: { reperto.sigillato: -1, tormento: 1, mercante.incontri: 1 }

  - id: carta-sup-mercante-scatola
    tipo: carta
    area: superficie-fratturata
    immagine: icone/locked-box
    titolo: La scatola piccola
    sommario: "Sul panno del mercante c'è soltanto la scatola piccola, e stavolta il gancio è aperto."
    luogo: Superficie Fratturata, sull'orlo di una crepa azzurra
    requisiti: [mercante.incontri >= 4, mercante.scatola == 0]
    testo: |
      Il mercante ha messo la cassa sull'orlo di una crepa da cui sale il bagliore
      azzurro, e sul panno c'è soltanto la scatola piccola con il gancio aperto, e
      stavolta lui non sorride.

      «Questa è l'ultima cosa tua che ho» dice. «L'hai lasciata qui tu, la prima
      volta.» Gli ricordi che la prima volta era sul pianoro, e lui lascia
      correre. «La posso aprire per te, oppure me la tengo e te la pago bene.»

      *Del pianoro ti ricordi, e di niente prima.* Le dita ti vanno verso il
      gancio da sole.
    opzioni:
      - testo: "Aprire la scatola"
        descrizione: "Dentro c'è qualcosa che hai lasciato tu, e saperlo potrebbe costarti più di quanto vale."
        esito:
          titolo: La tua calligrafia
          testo: |
            Dentro c'è un foglio piegato in quattro, morbido come stoffa, con la tua
            calligrafia di una volta. C'è scritto *Non comprare niente da lui*, e
            sotto, con un altro inchiostro, *Ho comprato lo stesso*. Il mercante ride
            piano. In città lo rileggi, e sotto è comparsa una terza riga, *Va bene
            così*.
          pe: { resilienza: 20 }
          imposta: { mercante.scatola: 1 }
          effetti: { racconto: 1, tormento: 1.5, mercante.incontri: 1 }
      - testo: "Lasciargliela chiusa"
        descrizione: "Resta a lui con quello che c'è dentro, e ti paga con un nucleo raro che si ricorda le cose."
        esito:
          titolo: Pari
          testo: |
            Lui annuisce, la scatola sparisce nella cassa e al suo posto ti dà un
            nucleo grigio grande come una noce. «Adesso siamo pari» dice, per la prima
            volta. La notte sogni una stanza bassa con una finestra sul mare, e al
            risveglio sai il colore delle tende.
          imposta: { mercante.scatola: 2 }
          effetti: { parte.nucleo-3: 1, mercante.incontri: 1 }

  - id: carta-sup-mercante-dopo
    tipo: carta
    area: superficie-fratturata
    immagine: icone/wooden-crate
    titolo: Il mercante senza monete
    sommario: "Ritrovi la cassa e la giacca di lana, e ormai vi salutate come due che fanno affari da anni."
    luogo: Superficie Fratturata, all'ombra di un anello mezzo sepolto
    requisiti: [mercante.scatola >= 1]
    testo: |
      Lo trovi all'ombra di un anello di metallo mezzo sepolto, e ti fa spazio sul
      bordo della cassa come a un collega. Ha portato due tazze di latta e una
      brocca di tè freddo, e la sua tazza resterà piena fino alla fine. Ti chiede
      di Oda, che non ha mai visto, e sa della sua gamba di legno intagliata.

      {conoscenze-della-strada Media} Sa troppe cose per uno che in città non
      mette piede, e le notizie gliele porti tu.

      «Allora» dice, battendo due dita sul coperchio. «Cos'è che ti pesa oggi, e
      cos'è che ti manca?»
    opzioni:
      - testo: "Cedergli una storia"
        descrizione: "Una storia che tenevi per il Grifone, e con lei un po' di quello che ti tiene sveglio."
        requisiti: [racconto >= 1]
        esito:
          titolo: Una storia in meno
          testo: |
            Gliela racconti fino in fondo, e lui ride nei punti in cui avrebbe riso
            Liaren. Quando hai finito l'hai già dimenticata, e con lei un pensiero che
            da giorni ti tornava la notte. Sulla strada di casa ti scopri a
            canticchiare, cosa che non ti succedeva da un pezzo.
          effetti: { racconto: -1, tormento: -1 }
      - testo: "Cedergli quello che impari con le mani"
        descrizione: "Le ore al banco di Oda che non sono ancora diventate mestiere, pagate con due reperti sigillati."
        requisiti: [pe.tecnologia >= 10]
        esito:
          titolo: Dita goffe
          testo: |
            Ti fa aprire e chiudere le mani come un medico, poi ti posa sulle ginocchia
            due reperti sigillati. Il giorno dopo, da Oda, prendi un cacciavite dalla
            parte sbagliata e lo fissi senza capire, e lei ricomincia a spiegarti tutto
            da capo con la pazienza del primo giorno.
          imposta: { pe.tecnologia: 0 }
          effetti: { reperto.sigillato: 2 }
      - *mercante-bambino
      - testo: "Vendergli il congegno di Oda"
        descrizione: "Per il congegno strano ti rende un inverno d'infanzia, e con lui le mani di un meccanico."
        quando: [banco.parti >= 4]
        requisiti: [banco.stranezza >= 4]
        esito:
          titolo: La sveglia rotta
          testo: |
            Apre il congegno con le unghie, ci guarda dentro come in un pozzo e approva
            con un grugnito. In cambio ti rende un inverno passato da bambino sotto un
            tavolo a smontare una sveglia rotta, che poi hai rimontato con un pezzo in
            meno. Adesso ricordi dove andava quel pezzo.
          pe: { tecnologia: 15 }
          imposta: { banco.involucro: 0, banco.camera: 0, banco.impugnatura: 0, banco.nucleo: 0, banco.parti: 0, banco.potenza: 0, banco.stabilita: 0, banco.stranezza: 0 }
          effetti: { tormento: -1 }
      - testo: "Vendergli il congegno per una mattina al mercato"
        descrizione: "Lo stesso congegno per un altro ricordo, che ti torna sulla lingua."
        quando: [banco.parti >= 4]
        requisiti: [banco.stranezza >= 4]
        esito:
          titolo: Le uova della signora
          testo: |
            Il mercante scuote il congegno, che risponde con il suono di un dito
            bagnato sull'orlo di un bicchiere. Ti restituisce una mattina al mercato,
            da bambino, quando hai venduto a una signora una cesta di uova che aveva
            già comprato altrove. Ricordi le parole esatte che le hai detto, e ti viene
            da ridere.
          pe: { persuasione: 15 }
          imposta: { banco.involucro: 0, banco.camera: 0, banco.impugnatura: 0, banco.nucleo: 0, banco.parti: 0, banco.potenza: 0, banco.stabilita: 0, banco.stranezza: 0 }
          effetti: { tormento: -1 }
      - testo: "Vendergli il congegno che non dovrebbe esistere"
        descrizione: "Per il congegno più strano uscito dal banco di Oda paga un ricordo intero e un nucleo raro."
        quando: [banco.parti >= 4]
        requisiti: [banco.stranezza >= 7]
        esito:
          titolo: La prima luce
          testo: |
            Per la prima volta il mercante si toglie la giacca e ci avvolge il
            congegno, perché non prenda freddo. Ti posa in mano un nucleo grigio e ti
            tocca la fronte, e ti ricordi il primo Cristallo Conduttore acceso che hai
            visto, da piccolissimo, con il ronzio che ti entrava nei denti e che senti
            ancora in fondo alla mascella.
          pe: { magia: 30 }
          imposta: { banco.involucro: 0, banco.camera: 0, banco.impugnatura: 0, banco.nucleo: 0, banco.parti: 0, banco.potenza: 0, banco.stabilita: 0, banco.stranezza: 0 }
          effetti: { parte.nucleo-3: 1 }
      - testo: "Salutarlo e andare"
        descrizione: "Oggi hai le mani vuote, e lui lo sa già."
        costo: 0
        esito:
          testo: |
            Gli dici che oggi non hai niente da dargli, e lui alza la tazza di latta
            piena come per un brindisi, senza berne un sorso. Dieci passi più in là ti
            volti, e sta già guardando il sentiero dall'altra parte.

  # ================================================================ il Bambino senza impronte (8)
  - id: carta-sup-bambino
    tipo: carta
    area: superficie-fratturata
    immagine: icone/barefoot
    titolo: Il bambino sul ciglio
    sommario: "Seduto sul bordo del sentiero, con le ginocchia al petto, c'è un bambino che dice di essersi perso."
    luogo: Superficie Fratturata, il sentiero dei carri oltre l'ultima porta
    requisiti: [bambino.stadio == 0, bambino.rifiuti == 0, bambino.fine == 0]
    testo: |
      Sul ciglio del sentiero, oltre l'ultima porta, siede con le ginocchia al
      petto e gli occhi bassi un bambino di sette o otto anni, con due graffi
      sulle ginocchia che nessuno ha pulito.

      {origine figlio-della-citta-bassa} Nei vicoli della Città Bassa i bambini
      persi davvero ti guardano le mani, per vedere se c'è da mangiare.

      «Mi sono perso» dice, con una voce che trema sulla seconda parola. Viene
      verso di te sulla polvere del sentiero, che tiene l'impronta di ogni ruota
      passata da stamattina, e dove passa lui resta liscia. «Posso venire con te?»
      Poi, più piano, aggiunge «Ti conosco, vero?»
    opzioni:
      - testo: "Prenderlo per mano"
        descrizione: "È un bambino solo ed è quasi sera, le impronte possono aspettare."
        esito:
          titolo: Una mano fredda
          testo: |
            Gli tendi la mano e lui la prende subito, con le dita fredde come un sasso
            di fiume, e ti racconta di una casa con il pozzo e di una sorella che si
            chiama come una pianta. Quando ti volti un momento lo ritrovi seduto su un
            sasso dieci passi avanti. Fra te e il sasso ci sono soltanto le tue orme.
            «Torni, vero?» chiede, e dici di sì.
          pe: { empatia: 5 }
          effetti: { bambino.stadio: 1 }
      - testo: "Indicargli la strada per la città"
        descrizione: "Le porte sono vicine, e le guardie sanno cosa fare con un bambino perso."
        esito:
          titolo: Cento passi
          testo: |
            Gli indichi le mura e gli spieghi della porta e delle guardie, e lui
            annuisce a ogni parola come davanti a un maestro, però non si muove. Quando
            ti volti, molto più avanti, è ancora sul ciglio. Quella notte ti svegli due
            volte con la sensazione di averlo dimenticato da qualche parte, come un
            bagaglio.
          effetti: { tormento: 1, bambino.via: 1, bambino.rifiuti: 1 }
      - &bambino-colpire
        testo: "Colpirlo prima che si avvicini"
        descrizione: "Se ti sbagli te lo porterai dietro per sempre, e se hai ragione bisogna essere svelti."
        prova: { attributo: fisico, abilita: [rissa, armi-da-mischia], difficolta: Media }
        successo:
          titolo: Nebbia fra le dita
          testo: |
            Il colpo lo prende in pieno, e il bambino si apre come un sacco di farina
            in una nebbia grigia che odora di ozono e scivola verso la crepa più
            vicina. Per qualche giorno, quando incroci un bambino nei vicoli, guardi
            per terra prima di guardargli la faccia.
          effetti: { tormento: 1.5, bambino.fine: 4, bambino.distrutto: 1 }
        fallimento:
          titolo: Il respiro grigio
          testo: |
            Esiti un attimo di troppo, perché ha la faccia di un bambino, e il colpo
            arriva storto. Lui si sfa in una nebbia grigia che ti sale fino al viso
            prima di ritirarsi verso la crepa, e per due giorni hai in bocca un sapore
            di moneta che nemmeno il vino lava via.
          effetti: { contaminazione: 1.5, tormento: 1.5, bambino.fine: 4, bambino.distrutto: 1 }

  - id: carta-sup-bambino-torna
    tipo: carta
    area: superficie-fratturata
    immagine: icone/barefoot
    titolo: Di nuovo sul ciglio
    sommario: "Il bambino che avevi lasciato sul sentiero ti aspetta su un altro sentiero, seduto come allora."
    luogo: Superficie Fratturata, una cengia sulle terrazze
    requisiti: [bambino.via == 1, bambino.rifiuti == 1, bambino.fine == 0]
    testo: |
      Lo vedi da lontano, seduto sul bordo di una cengia con le ginocchia al petto
      e gli stessi graffi freschi, a mezza giornata di cammino da dove l'hai
      lasciato. Quando arrivi sorride come a chi alla fine è venuto.

      «Lo sapevo che passavi di qui» dice, e si sistema i capelli dietro
      l'orecchio. «Ieri sera hai mangiato la zuppa con il cavolo. Ti è piaciuta?»

      L'hai mangiata da solo, chiuso a chiave nella tua stanza.

      {resilienza Media} Ti ripeti a mezza voce che era una zuppa e basta, finché
      le mani smettono di cercare la cintura.
    opzioni:
      - testo: "Prenderlo con te, stavolta"
        descrizione: "Ha aspettato tanto, e forse il disagio era tuo e la colpa no."
        esito:
          titolo: Lo stesso passo
          testo: |
            Gli tendi la mano e lui la prende come se l'avesse sempre tenuta. Fino
            alle terrazze tiene il tuo passo senza sforzo e non chiede mai di fermarsi
            a bere, e a un certo punto ti accorgi di aver smesso di pensare alla
            zuppa.
          imposta: { bambino.via: 0 }
          effetti: { bambino.stadio: 1 }
      - testo: "Mandarlo via per sempre"
        descrizione: "Dirgli di no senza lasciare spazio, e forse quello che ti costa è il prezzo giusto."
        esito:
          titolo: Il bordo della cengia
          testo: |
            Glielo dici forte, perché lo senta anche quello che sta dietro di lui. Il bambino si
            spolvera le ginocchia e cammina fino al bordo della cengia, e oltre, come si scende un
            gradino, senza rumore di caduta. Quando ti affacci, sotto c'è soltanto la nebbia grigia
            che si ritira dentro una crepa.
          imposta: { bambino.via: 0 }
          effetti: { tormento: 1.5, bambino.fine: 3 }
      - *bambino-colpire

  - id: carta-sup-bambino-2
    tipo: carta
    area: superficie-fratturata
    immagine: icone/barefoot
    titolo: Il bambino che sa le strade
    sommario: "Il bambino ti aspetta fuori dalle mura ogni volta che esci, e conosce la Superficie meglio di un Raschiatore."
    luogo: Superficie Fratturata, appena fuori dall'ultima porta
    requisiti: [bambino.stadio == 1, bambino.via == 0, bambino.fine == 0]
    testo: |
      Fuori dall'ultima porta, seduto sul paracarro, il bambino ti saluta con
      tutto il braccio, e le guardie non lo guardano, come non si guarda un
      paracarro.

      Oggi ti porta per un sentiero fra due crepe azzurre, e ci passa saltellando
      senza sollevare polvere. Ti chiama con il nome che usava tua madre, e che a
      Qir-Azel nessuno conosce.

      {origine apprendista-raschiatore} Sulla Cicatrice ti hanno insegnato che fra
      due crepe azzurre non passa chi vuole tornare a cena.

      In fondo al sentiero c'è un guscio di metallo dei Precursori, e lui te lo
      indica come un cane con un osso.
    opzioni:
      - testo: "Tenerlo con te"
        descrizione: "Ti porta dove nessuno trova niente, e intorno a lui l'aria sa un po' di ozono."
        esito:
          titolo: Il guscio fra i sassi
          testo: |
            Raccogli il reperto e lui batte le mani. Al ritorno ti racconta di nuovo del pozzo e della
            sorella con le stesse parole, e alla porta si siede sul paracarro, perché dentro non entra.
            La sera trovi sul dorso della mano un alone grigio con la forma delle sue dita.
          effetti: { reperto.sigillato: 1, contaminazione: 1, bambino.stadio: 1 }
      - testo: "Lasciarlo sul paracarro"
        descrizione: "Prendere il reperto e dirgli che oggi vai da solo, anche se fa male a tutti e due."
        quando: [bambino.rifiuti == 0]
        esito:
          titolo: Il paracarro vuoto
          testo: |
            Gli dici che da oggi esci da solo. Lui non piange e non protesta, ti
            guarda con gli occhi chiari e annuisce, come quando gli spiegavi la strada
            per le guardie. Al ritorno il paracarro è vuoto, e la pietra è fredda dove
            dovrebbe essere ancora tiepida di sole.
          effetti: { reperto.sigillato: 1, tormento: 1, bambino.via: 1, bambino.rifiuti: 1 }
      - &bambino-lasciare-sempre
        testo: "Lasciarlo per l'ultima volta"
        descrizione: "L'hai già mandato via una volta e lui è tornato, però stavolta non ti seguirà."
        quando: [bambino.rifiuti >= 1]
        esito:
          titolo: Dietro le mura
          testo: |
            Glielo dici in fretta, guardando la porta invece di lui, prima di cambiare
            idea. Lui resta seduto, e stavolta non si alza. Quando ti volti dalla porta
            non c'è più, e sul paracarro resta un velo di polvere grigia che il vento si
            porta via a poco a poco.
          effetti: { tormento: 1.5, bambino.fine: 3 }
      - testo: "Colpirlo"
        descrizione: "Adesso sai che cos'è, e forse lui sa che lo sai."
        prova: { attributo: fisico, abilita: [rissa, armi-da-mischia], difficolta: Media }
        successo:
          titolo: Nebbia sul paracarro
          testo: |
            Lo colpisci mentre ti volta le spalle, ed è la cosa più difficile che hai
            fatto da quando sei a Qir-Azel. Si sfa in nebbia grigia senza un suono, e
            le guardie della porta non alzano nemmeno la testa. Al posto della mano che
            stringevi ti resta soltanto il freddo.
          effetti: { tormento: 1.5, reperto.sigillato: 1, bambino.fine: 4, bambino.distrutto: 1 }
        fallimento:
          titolo: Te lo aspettavi
          testo: |
            Lui si sposta un attimo prima del colpo e ti guarda con una delusione da
            adulto. Poi si sfa in nebbia e ti passa attraverso, fredda come acqua di
            pozzo, lasciandoti in ginocchio a tossire grigio con la sensazione precisa
            di essere stato perdonato.
          effetti: { contaminazione: 1.5, tormento: 1.5, bambino.fine: 4, bambino.distrutto: 1 }

  - id: carta-sup-bambino-3
    tipo: carta
    area: superficie-fratturata
    immagine: icone/barefoot
    titolo: Il bambino che non dorme
    sommario: "Il bambino ti sta sempre dietro e sa le cose che pensi."
    luogo: Superficie Fratturata, un riparo sotto una terrazza
    requisiti: [bambino.stadio == 2, bambino.via == 0, bambino.fine == 0]
    testo: |
      Ti riposi sotto una terrazza, e quando apri gli occhi lui è seduto accanto a
      te con la testa sulla tua spalla, che ti si gela.

      «Oggi hai pensato alla tua stanza, al letto che cigola e al fatto che lì
      dentro sei solo» dice. Ti stringe il braccio con le due mani, più forte di
      un bambino. «Io posso stare sempre con te. Dentro le mura non entro, però
      posso stare più vicino.»

      Dietro di lui, dove stamattina c'era solo ghiaia, affiora una camera di
      cristallo dei Precursori con le vene accese, messa lì come un regalo sul
      tavolo.
    opzioni:
      - testo: "Lasciarlo stare più vicino"
        descrizione: "Tenerlo e tenere la camera, e ogni volta qualcosa di te diventa grigio."
        esito:
          titolo: Più vicino
          testo: |
            Gli dici di sì, e lui chiude gli occhi contento. Raccogli la camera tiepida, e quando ti
            rialzi il bambino non è più accanto a te. Lo senti dentro l'orecchio, un respiro piccolo che
            non è il tuo, e le dita della mano destra ti restano grigie fino alle nocche.
          effetti: { parte.camera-2: 1, contaminazione: 1.5, tormento: 1, bambino.stadio: 1 }
      - testo: "Allontanarlo"
        descrizione: "Staccargli le mani dal braccio e dirgli di andare, mentre dentro di te qualcosa protesta."
        quando: [bambino.rifiuti == 0]
        esito:
          titolo: Le mani staccate
          testo: |
            Gli stacchi le mani dal braccio un dito alla volta, e ci vuole più forza
            del previsto. Lui si alza e se ne va verso la luce, voltandosi una volta
            sola. La camera di cristallo adesso è spenta e piena di crepe, e appena
            provi a sollevarla ti si sbriciola in mano.
          effetti: { tormento: 1.5, bambino.via: 1, bambino.rifiuti: 1 }
      - *bambino-lasciare-sempre
      - testo: "Colpirlo"
        descrizione: "È aggrappato al tuo braccio e ti legge i pensieri, quindi lo saprà un attimo prima di te."
        prova: { attributo: fisico, abilita: [rissa, armi-da-mischia], difficolta: Difficile }
        successo:
          titolo: Il braccio libero
          testo: |
            Non ci pensi, e forse per questo ci riesci. Il colpo parte dal braccio che lui stringe, e il bambino si sfa contro
            la roccia in una nebbia grigia che cola giù verso la ghiaia. Raccogli la camera di cristallo, e le vene di luce si
            accendono al ritmo del tuo polso.
          effetti: { parte.camera-2: 1, tormento: 1.5, bambino.fine: 4, bambino.distrutto: 1 }
        fallimento:
          titolo: Lo sapeva
          testo: |
            Lui lo sa prima che tu muova il braccio, e stringe. La stretta ti entra
            nella carne come acqua gelata e la nebbia grigia ti sale fino alla gola
            prima di scivolare via. Resti a terra a lungo con la spalla che non
            risponde, e la camera di cristallo è sparita.
          effetti: { contaminazione: 1.5, tormento: 1.5, bambino.fine: 4, bambino.distrutto: 1 }

  - id: carta-sup-bambino-fine
    tipo: carta
    area: superficie-fratturata
    immagine: icone/barefoot
    titolo: Dove fa caldo
    sommario: "Il bambino ti aspetta sull'orlo di una crepa, e stavolta ti chiede una cosa sola."
    luogo: Superficie Fratturata, sull'orlo di una crepa azzurra
    requisiti: [bambino.stadio >= 3, bambino.via == 0, bambino.fine == 0]
    testo: |
      Lui è davanti a te, sull'orlo di una crepa azzurra. Adesso potrebbe avere
      dieci anni, e ha i tuoi zigomi e il tuo modo di stare su una gamba sola
      quando aspetti.

      «Fuori fa freddo» dice, e ti mostra le mani, trasparenti fino al polso. «Ci
      ho provato a stare fuori, per te, ma è faticoso. Fammi stare dentro, dove
      fai caldo tu, e non sarai mai più solo.»

      *Lo vuoi, almeno un poco, ed è questo che ti spaventa.* Dalla crepa la Marea
      sale in una nebbia bassa, e gli arriva già alle caviglie.
    opzioni:
      - testo: "Lasciarlo entrare"
        descrizione: "Non sarai più solo, e il prezzo lo paghi nel corpo, per sempre."
        quando: [mutazione.sangue-grigio == 0]
        esito:
          titolo: Il sangue grigio
          testo: |
            Apri le braccia e lui ci entra come si entra in acqua, senza schizzi. Senti freddo fino alle ossa, poi un caldo da coperta
            tirata fino al mento. Tornando ti tagli un dito con la fibbia della sacca, e il sangue esce scuro e si rapprende subito.
            Quella notte, nella tua stanza, non ti senti solo.
          effetti: { mutazione.sangue-grigio: 1, contaminazione: 1.5, tormento: -1, bambino.fine: 1 }
      - testo: "Lasciarlo entrare"
        descrizione: "Non sarai più solo, e la Marea che hai già nel sangue gli fa posto e ne porta altra."
        quando: [mutazione.sangue-grigio >= 1]
        esito:
          titolo: C'era già posto
          testo: |
            Apri le braccia e lui ci entra senza fatica, perché la Marea che hai nel sangue lo riconosce e gli fa
            spazio. Tornando in città hai le labbra grigie, e devi fermarti due volte con le mani sulle
            ginocchia, come un vecchio. Quella notte, però, nella tua stanza non ti senti solo.
          effetti: { contaminazione: 2, tormento: -1, bambino.fine: 1 }
      - testo: "Riportarlo alla Marea"
        descrizione: "Convincerlo a tornare da dove è venuto, che è come dire addio a uno che ti somiglia."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: Il nucleo nella nebbia
          testo: |
            Ti siedi con lui sull'orlo della crepa e gli parli della casa con il pozzo
            che non esiste e della sorella con il nome di una pianta. Alla fine ti
            stringe la mano e scende nella Marea come in un bagno caldo. Sul bordo resta
            un nucleo grigio e freddo, che ti fa tornare in mente cortili con un pozzo
            dove non sei mai stato.
          effetti: { parte.nucleo-3: 1, racconto: 1, tormento: 1, bambino.fine: 2 }
        fallimento:
          titolo: Ancora no
          testo: |
            Gli parli, e lui scuote la testa a ogni frase. Quando provi a portarlo
            all'orlo si aggrappa a te con una forza che ti piega le ginocchia, e la
            Marea ti sale fino alla vita prima che tu riesca a strapparti via. Lui resta
            sull'orlo e, mentre scappi, ti dice con gentilezza che ti aspetta.
          effetti: { contaminazione: 1.5, tormento: 1.5 }
      - testo: "Distruggerlo"
        descrizione: "Adesso ti somiglia troppo per essere fragile, e la Marea che lo tiene insieme si difenderà."
        combattimento: sagome-della-marea
        vittoria:
          titolo: Due ombre sull'orlo
          testo: |
            Quando alzi l'arma il bambino si apre in due figure di nebbia dalle troppe articolazioni, che stanno sulle
            gambe come ci stai tu. Le abbatti una alla volta, e ognuna, prima di sfarsi, ti guarda con gli occhi chiari.
            Sull'orlo trovi un guscio di metallo scuro ancora tiepido, e la crepa sotto di te si chiude di un dito.
          effetti: { parte.involucro-2: 1, racconto: 1, tormento: 1.5, bambino.fine: 4, bambino.distrutto: 1 }
        sconfitta:
          titolo: Dentro comunque
          testo: |
            Le due figure di nebbia ti atterrano e ti restano sopra, leggere come
            lenzuola stese, e la nebbia ti entra in bocca. Quando riapri gli occhi
            sei solo sull'orlo, e quel soffio piccolo è tornato, più vicino, dietro
            gli occhi. Per giorni ti sembra di camminare in due.
          effetti: { contaminazione: 1.5, tormento: 1.5, bambino.fine: 1 }

  # ================================================================ il Cavaliere della Marea (46)
  - id: carta-sup-cavaliere
    tipo: carta
    area: superficie-fratturata
    immagine: icone/black-knight-helm
    titolo: L'armatura che cammina
    sommario: "Sul sentiero viene avanti un'armatura con le crepe piene di luce lattiginosa, e si ferma ad aspettare."
    luogo: Superficie Fratturata, il sentiero lungo il bordo delle terrazze
    requisiti: [cavaliere.incontri == 0, cavaliere.fine == 0]
    testo: |
      Prima di vederlo senti il suo passo pesante salire dalla curva. È
      un'armatura completa di un modello che a Qir-Azel non si fa più, e dalle
      crepe delle piastre trasuda una luce lattiginosa.

      A cinque passi da te si ferma senza toccare la spada lunga al fianco e
      inclina l'elmo. Nella fessura della visiera c'è il vuoto, eppure ti sta
      guardando. Sullo spallaccio sinistro, sotto la ruggine, qualcuno ha dipinto
      una spiga di grano.

      {accademiche Difficile} Una spiga sullo spallaccio era il segno delle scorte
      dei carri del grano di Laresh, una generazione fa.
    opzioni:
      - &cavaliere-combattere
        testo: "Sfoderare l'arma"
        descrizione: "È lento, ma ogni suo colpo vale due dei tuoi, e la Marea lo tiene in piedi."
        combattimento: cavaliere-della-marea
        vittoria:
          titolo: La spiga sullo spallaccio
          testo: |
            Cade in ginocchio prima di cadere del tutto, come un uomo che chiede un
            ultimo momento, e la luce lattiginosa esce dalle crepe in un filo sottile.
            L'armatura si affloscia vuota sul sentiero, e il pettorale, quando lo
            sollevi, si richiude da solo intorno alla tua mano con uno scatto morbido.
          effetti: { parte.involucro-3: 1, racconto: 1, cavaliere.fine: 1, cavaliere.incontri: 1 }
        sconfitta:
          titolo: Il piatto della spada
          testo: |
            Ti colpisce due volte con il piatto della lama, e la seconda ti stende sulla
            ghiaia. Resti a terra con il sangue in bocca ad aspettare il terzo colpo,
            che non arriva, mentre il cavaliere rinfodera e riprende il sentiero.

            {rissa Facile} Ti ha colpito di piatto apposta, perché con il filo a
            quest'ora saresti in fondo a una crepa.
          effetti: { cavaliere.incontri: 1 }
      - testo: "Salutarlo come si saluta un soldato"
        descrizione: "Il pugno sul petto come le guardie alle porte, se dentro c'è ancora un uomo che se lo ricorda."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Facile }
        fallimento:
          titolo: La spalla
          testo: |
            Ti batti il pugno sul petto troppo in fretta, e il cavaliere legge il gesto
            come un'intenzione. La luce nelle crepe si accende di colpo, e lui ti passa
            accanto e ti sposta con la spalla corazzata, come si sgombera la strada da
            un ubriaco, lasciandoti seduto nella ghiaia con il gomito sbucciato.
          effetti: { ferite: 0.5, cavaliere.incontri: 1 }
        successo:
          titolo: Il pugno sullo spallaccio
          testo: |
            Ti batti il pugno sul petto come le guardie al cambio del turno. Il
            cavaliere resta immobile tanto a lungo che cominci a sentirti ridicolo, poi
            si porta il pugno chiuso sulla spiga dello spallaccio, un saluto che la
            guardia cittadina non usa, e prosegue per la sua strada.
          pe: { empatia: 5 }
          effetti: { cavaliere.memoria: 1, cavaliere.incontri: 1 }
      - &cavaliere-evitare
        testo: "Girargli al largo"
        descrizione: "Scendere di una terrazza e lasciarlo passare, perché il sentiero è suo e lui ci tornerà."
        esito:
          titolo: La terrazza di sotto
          testo: |
            Ti cali alla terrazza di sotto con la schiena contro la roccia e lo lasci passare sopra la tua
            testa. Il passo pesante si ferma proprio sopra di te per un lungo momento prima di allontanarsi.
            Quando risali, le sue impronte nella ghiaia tornano nella direzione da cui era venuto.
          effetti: { cavaliere.incontri: 1 }
      - &cavaliere-consegna
        testo: "Prendere in consegna il suo carico"
        descrizione: "Una scorta risponde a chi riceve il grano alle porte, se gli parli con le formule della Gilda."
        quando: [cavaliere.consegna == 0]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Difficile }
        successo:
          titolo: Il foglio di carico
          testo: |
            Ti metti dritto in mezzo al sentiero e gli chiedi il foglio di carico
            con le parole degli scrivani della Gilda. Il cavaliere tira fuori da
            fra le piastre un foglio così consumato che si legge solo la spiga del
            timbro, e con il foglio ti mette in mano due gusci sigillati raccolti
            lungo la strada, come la merce caduta dai carri. Firmi, e lui riprende
            il suo sentiero.
          pe: { galateo: 10 }
          effetti: { reperto.sigillato: 2, cavaliere.incontri: 1 }
          imposta: { cavaliere.consegna: 1 }
        fallimento:
          titolo: Uno che vuole il carico
          testo: |
            Sbagli una parola della formula, e per il cavaliere diventa la richiesta di un ladro di grano. La luce nelle crepe
            si accende di colpo, e il piatto della spada ti prende sulla spalla e poi sulle costole. Ti lascia nella ghiaia a
            tossire e riprende la sua strada senza voltarsi.
          effetti: { ferite: 1.5, tormento: 1, cavaliere.incontri: 1 }


  - id: carta-sup-cavaliere-torna
    tipo: carta
    area: superficie-fratturata
    immagine: icone/black-knight-helm
    titolo: Il Cavaliere della Marea
    sommario: "Il cavaliere con le crepe lattiginose fa la sentinella sul tuo sentiero."
    luogo: Superficie Fratturata, una sella fra due terrazze
    requisiti: [cavaliere.incontri >= 1, cavaliere.memoria <= 2, cavaliere.fine == 0]
    testo: |
      Lo trovi in una sella fra due terrazze. Fa avanti e indietro per venti passi
      con l'andatura di una sentinella, e quando ti vede si ferma e gira l'elmo
      verso di te, la spada sempre nel fodero. Ai margini del suo tratto ha
      piantato nella ghiaia una fila di sassi dritti, come i paletti che segnano
      una strada di carri.

      {cavalcare Media} Cammina come si porta a passo un cavallo sudato per
      tenerlo caldo, da uomo che ha passato la vita in sella.

      *Ti ha riconosciuto, e non sai da che cosa.* Il cavaliere aspetta con la
      testa inclinata.
    opzioni:
      - *cavaliere-combattere
      - testo: "Fargli il suo saluto"
        descrizione: "Il pugno sulla spalla sinistra come fa lui, e lui guarda bene come lo fai."
        quando: [cavaliere.memoria == 0]
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La risposta
          testo: |
            Ti porti il pugno alla spalla sinistra e lo tieni fermo, come fa lui. Il
            cavaliere risponde con lo stesso gesto e china appena l'elmo, che fra
            soldati vuol dire *riconosciuto*. Poi riprende la sua ronda, e al giro
            successivo, passando, ti fa spazio sul sentiero.
          pe: { empatia: 5 }
          effetti: { cavaliere.memoria: 1, cavaliere.incontri: 1 }
        fallimento:
          titolo: Il gesto sbagliato
          testo: |
            Sbagli qualcosa nel gesto e lui se ne accorge. La luce nelle crepe si accende, e il cavaliere ti
            viene addosso con la spalla e ti lascia seduto nella ghiaia, con la sacca rovesciata due passi più
            in là e un livido che comincia a scaldarsi sotto la giubba.
          effetti: { ferite: 0.5, cavaliere.incontri: 1 }
      - testo: "Chiedergli dove porta la strada"
        descrizione: "I paletti di sasso e la spiga sullo spallaccio chiedono le domande che si fanno a una scorta."
        quando: [cavaliere.memoria == 1]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Verso ovest
          testo: |
            Gli chiedi dove va la strada che sta segnando, e il cavaliere alza il
            braccio verso ovest, puntato su Laresh come l'ago di una bussola. Poi si
            china e con la punta del guanto incide nella ghiaia un carro con una spiga
            e un cavallo con una macchia bianca sul muso. Accanto scrive quattro
            lettere storte, *SORB*, e resta chino a guardarle.
          pe: { empatia: 5 }
          effetti: { cavaliere.memoria: 1, cavaliere.incontri: 1 }
        fallimento:
          titolo: La domanda di troppo
          testo: |
            Gli fai troppe domande e troppo in fretta, e il cavaliere si porta le mani
            all'elmo come per tenerlo fermo. La luce lattiginosa trabocca dalle crepe e
            ti bagna le mani di un freddo appiccicoso. Quando riesci a pulirtele lui è
            già lontano, e cammina storto.
          effetti: { contaminazione: 1, cavaliere.incontri: 1 }
      - testo: "Raccontargli chi era"
        descrizione: "Una scorta dei carri del grano di Laresh e una cavalla di nome Sorba, da mettere insieme senza sbagliare."
        quando: [cavaliere.memoria == 2]
        prova: { attributo: sociale, abilita: [empatia, persuasione, espressivita], difficolta: Difficile }
        successo:
          titolo: Il nome della cavalla
          testo: |
            Gli parli dei carri del grano che vanno da Laresh alle porte, delle scorte
            con la spiga sullo spallaccio e di una cavalla di nome Sorba, con la
            macchia bianca sul muso. Al nome della cavalla il cavaliere si siede
            pesantemente sul ciglio del sentiero, con l'elmo fra le mani, e quando ti
            allontani non si è ancora alzato.
          pe: { empatia: 10 }
          effetti: { cavaliere.memoria: 1, cavaliere.incontri: 1 }
        fallimento:
          titolo: Un altro uomo
          testo: |
            Mescoli le cose che sai con quelle che ti immagini, e il racconto viene fuori sbagliato, la storia di un altro. Il cavaliere ascolta
            fino in fondo, poi scuote piano l'elmo, e la luce nelle crepe si abbassa come una lampada a cui manca l'olio. Riprende la ronda senza
            più guardarti.
          effetti: { tormento: 1, cavaliere.incontri: 1 }
      - *cavaliere-evitare
      - *cavaliere-consegna

  - id: carta-sup-cavaliere-nome
    tipo: carta
    area: superficie-fratturata
    immagine: icone/black-knight-helm
    titolo: Edric Vasso
    sommario: "Il cavaliere ti aspetta seduto su un paracarro con l'elmo in grembo, e adesso sa come si chiama."
    luogo: Superficie Fratturata, il bivio della vecchia strada per Laresh
    requisiti: [cavaliere.memoria >= 3, cavaliere.fine == 0]
    testo: |
      Lo trovi al bivio della vecchia strada per Laresh, seduto su un paracarro
      con l'elmo sulle ginocchia. Sotto c'è una faccia bianca come il latte, con
      due occhi grigi da uomo stanco.

      «Edric Vasso» dice, con una voce lenta. «Scorta dei carri del grano, terza
      fila. Sorba era la mia cavalla. Sotto la strada si era aperta una crepa
      con la luce dentro, e sono sceso a guardare. Da allora cammino, e ogni
      notte dimentico qualcosa. Domani dimenticherò il nome della cavalla.» Ti
      porge l'elmo con le due mani. «Finiscimi adesso, finché so chi sono.»
    opzioni:
      - testo: "Fare quello che chiede"
        descrizione: "Si inginocchierà e ti mostrerà il punto fra la gorgiera e lo spallaccio, senza difendersi."
        esito:
          titolo: Terza fila
          testo: |
            Si inginocchia sulla strada di Laresh e ti indica il punto fra la gorgiera e lo spallaccio. Dice ancora una volta
            «Sorba» a mezza voce, poi chiude gli occhi, e basta un colpo. La luce si disperde nel vento, e il pettorale
            dell'armatura vuota si richiude caldo intorno alla tua mano. Per tutto il ritorno ripeti il nome della cavalla,
            per non dimenticarlo.
          pe: { resilienza: 15 }
          effetti: { parte.involucro-3: 1, racconto: 1, tormento: 1, cavaliere.fine: 2 }
      - testo: "Dirgli di andare a casa"
        descrizione: "Laresh è a ovest e la strada la conosce, e quello che si portava dietro lo lascia a te."
        esito:
          titolo: Quello che aveva raccolto
          testo: |
            Gli dici che a Laresh i carri passano ancora, e che qualcuno si ricorderà di
            una scorta che non è tornata. Lui ti mette in mano una borsa di cuoio con
            dentro la camera di cristallo che vide nella crepa il giorno in cui scese a
            guardare, e che batte ancora come un polso. «L'ho tenuta abbastanza» dice.
            Si rimette l'elmo e prende la strada di Laresh.
          pe: { empatia: 15 }
          effetti: { parte.camera-3: 1, racconto: 1, tormento: -1, cavaliere.fine: 2 }

  # ================================================================ la Frattura che respira (9)
  - id: sup-frattura-che-respira
    presso: terrazze-di-basalto
    area: superficie-fratturata
    ripetibile: true
    immagine: ambientazione/rovine-dei-precursori
    titolo: La Frattura che respira
    sommario: "Su un gradone delle terrazze respira un anello dei Precursori spezzato, e lo spazio intorno non sta fermo."
    luogo: Le terrazze di basalto, un gradone fuori dalla strada degli scavi
    requisiti: [frattura.respiro < 4, frattura.spenta == 0]
    testo: |
      Sul gradone più basso, lontano dalle frecce bianche, l'aria trema come sopra
      un fuoco, ed è fredda. Dalla roccia affiora un anello di metallo spezzato in
      due, e intorno lo spazio sbaglia, i passi suonano un momento dopo il piede e
      un sasso che rotola dal gradone di sopra cade due volte. Dal centro sale un
      respiro lungo e regolare, con una pausa in fondo.

      {origine allievo-di-torvessa} Nessuna lezione di Temmerin ha mai parlato di
      un anello come questo, e ti prudono le dita di contare le pause.

      *Questa cosa si sta svegliando.* Ti si rizza il pelo delle braccia.
    opzioni:
      - testo: "Aiutarla a riprendere il ritmo"
        descrizione: "Il respiro ha un ritmo che il meccanismo sotto il metallo segue, e per toccarlo bisogna capirlo."
        quando: [frattura.respiro == 0]
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: La pausa giusta
          testo: |
            Conti a mezza voce fino a trovare la pausa, e nella pausa appoggi le mani sulle
            due metà dell'anello. L'espiro successivo arriva intero, e il sasso che stava
            cadendo dal gradone cade una volta sola. Ai tuoi piedi la roccia ha sputato
            fuori una scaglia di metallo fitta di segni.
          effetti: { frattura.respiro: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il momento sbagliato
          testo: |
            Appoggi le mani nel momento sbagliato, e l'anello inspira con uno strappo e
            tira dentro un po' di te, un freddo che ti sale dai polsi ai denti. Quando
            togli le mani hai le unghie grigie, e sul gradone ci sono due volte le tue
            orme.
          effetti: { contaminazione: 1.5 }
      - testo: "Raddrizzare le due metà"
        descrizione: "Le facce del taglio non combaciano di un dito, e si spostano soltanto mentre espira."
        quando: [frattura.respiro == 1]
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: Un dito
          testo: |
            Aspetti l'espiro con la spalla contro la metà più piccola e spingi quando l'aria esce. Il metallo
            scivola di un dito con un suono di campana lontana, e le facce del taglio si guardano dritte. Dalla
            fessura rotola fuori un reperto sigillato, caldo come pane appena sfornato.
          effetti: { frattura.respiro: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: Due volte
          testo: |
            Spingi un battito troppo presto, e l'anello ti ricaccia indietro. Cadi sulla
            roccia, e un attimo dopo cadi ancora nello stesso punto senza esserti
            rialzato, e il gomito si ricorda tutte e due le cadute. Ti allontani con le
            orecchie che ronzano.
          effetti: { contaminazione: 1, ferite: 0.5 }
      - testo: "Pulire i segni sul metallo"
        descrizione: "Sul bordo interno corre un'incisione coperta di terra, e chi la libera deve sapere dove fermarsi."
        quando: [frattura.respiro == 2]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: La linea accesa
          testo: |
            Gratti via la terra con la punta del coltello, e dove il metallo resta pulito l'incisione si accende di un azzurro tenue. A metà capisci che i
            segni vanno letti in una direzione sola e lasci coperto l'ultimo. Il suono dell'anello rallenta e si fa più profondo, e nella terra grattata
            trovi un frammento inciso con gli stessi segni.
          effetti: { frattura.respiro: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: La frase sbagliata
          testo: |
            Scopri un segno di troppo, e l'incisione si accende tutta insieme in un
            lampo bianco. Per un'ora vedi i segni dappertutto, e la sera, quando chiudi
            gli occhi, ricominciano, in fila, sempre nello stesso ordine.
          effetti: { contaminazione: 1, tormento: 1 }
      - testo: "Respirare con lei"
        descrizione: "Manca soltanto il ritmo giusto, il tuo, se resti vicino abbastanza a lungo senza avere paura."
        quando: [frattura.respiro == 3]
        prova: { attributo: mentale, abilita: [tecnologia, resilienza], difficolta: Media }
        successo:
          titolo: Insieme
          testo: |
            Ti siedi dentro l'anello e lasci che il tuo petto vada con il suo, lento, finché il mondo
            intorno smette di sbagliare un pezzo alla volta. Quando ti alzi hai le gambe intorpidite e in
            tasca un reperto sigillato che non ricordi di aver raccolto.
          effetti: { frattura.respiro: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: Senza fiato
          testo: |
            A un certo punto l'anello inspira e tu no, e non riesci più a ricominciare.
            Ti trascini fuori a carponi, con il petto chiuso, e riprendi aria soltanto
            sul gradone di sopra, con la guancia contro la pietra calda.
          effetti: { contaminazione: 1.5, tormento: 1 }
      - testo: "Spaccare l'anello"
        descrizione: "Fermi per sempre quello che si sveglia sotto la roccia e ti porti via quello che si stacca."
        esito:
          titolo: L'ultimo respiro
          testo: |
            Infili la leva fra le due metà e ci butti sopra tutto il peso. L'anello
            inspira a lungo per l'ultima volta e dentro qualcosa si spezza con un
            rumore di vetro, e lo spazio torna fermo di colpo. Ti ritrovi in ginocchio
            con il naso che sanguina, e raccogli dalla roccia spaccata quello che è
            venuto via.
          imposta: { frattura.spenta: 1 }
          effetti: { reperto.sigillato: 2, reliquie.scheggia: 3, contaminazione: 1.5 }
      - testo: "Andarsene"
        costo: 0
        esito:
          testo: |
            Ti allontani sul bordo esterno del gradone, dove la roccia è salda. Dietro
            di te il respiro continua, con la sua pausa in fondo, e i tuoi passi ti
            seguono un momento dopo.

  - id: sup-frattura-respiro-lungo
    presso: terrazze-di-basalto
    area: superficie-fratturata
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il respiro lungo
    sommario: "Ora che la Frattura respira piano, l'anello ha qualcosa per te."
    luogo: Le terrazze di basalto, il gradone della Frattura
    requisiti: [frattura.respiro >= 4, frattura.premio == 0]
    testo: |
      L'aria sopra l'anello è ferma e limpida, e sul taglio delle due metà, che
      adesso combaciano, corre una linea azzurra sottile come un capello. Quando
      ti avvicini l'anello si ferma a metà dell'espiro, e dalla roccia affiora
      una camera di cristallo che pulsa con le stesse pause.

      Poi senti sotto i piedi un tremito lungo che corre dentro la roccia verso
      sud. A un'ora di cammino, in fondo a una conca dove le squadre mangiano
      all'ombra di un blocco di metallo grigio, sale una luce azzurra che si
      accende e si spegne come un polso a riposo. Il blocco è un'altra struttura
      dei Precursori, e si è appena svegliato.

      {origine figlio-del-circolo} Il Circolo ti ha insegnato ad ascoltare il
      Bosco di Velthar, e il tremito verso sud lo ascolti allo stesso modo, come
      il passo di una bestia grande appena uscita dalla tana.
    opzioni:
      - testo: "Prendere la camera"
        descrizione: "Te la sta offrendo, una camera rara che batte ancora."
        esito:
          titolo: Il polso nella mano
          testo: |
            La camera è calda e pesa più di quanto sembra. Quando la sollevi l'anello
            espira piano e la luce si ritira, e mentre risali i gradoni la camera ti
            batte nel palmo insieme al cuore. Verso sud la conca continua a pulsare
            d'azzurro anche dopo il tramonto.
          effetti: { parte.camera-3: 1, racconto: 1, frattura.premio: 1 }
      - testo: "Lasciargliela e ascoltare"
        descrizione: "La camera resta dov'è, e tu resti a guardare come funziona una cosa dei Precursori quando funziona."
        esito:
          titolo: Come funziona
          testo: |
            Lasci la camera dov'è e ti siedi sul bordo. Per tutto il pomeriggio guardi
            la luce che va dall'anello verso sud, finché capisci dove passa e perché,
            come il giro dell'acqua in un mulino. Al tramonto la camera torna sotto la
            roccia, e al suo posto resta un frammento inciso.
          pe: { tecnologia: 15, magia: 10 }
          effetti: { reliquie.frammento-inciso: 1, racconto: 1, tormento: -0.5, frattura.premio: 1 }

  - id: sup-frattura-cicatrice
    presso: terrazze-di-basalto
    area: superficie-fratturata
    ripetibile: true
    immagine: ambientazione/rovine-dei-precursori
    titolo: La Frattura spenta
    sommario: "Dove respirava la Frattura c'è un anello spaccato, e lo spazio intorno sbaglia senza più ritmo."
    luogo: Le terrazze di basalto, il gradone della Frattura
    requisiti: [frattura.spenta == 1]
    testo: |
      Sul gradone basso l'anello spezzato è ancora lì, con la fessura che hai
      aperto tu e i bordi anneriti. Il suono lungo non c'è più, e lo spazio sbaglia
      a caso, tanto che un sasso caduto dal gradone di sopra arriva a terra due
      volte e il successivo mai. I Raschiatori hanno spostato le frecce bianche più
      in alto, e qualcuno ha scritto con il gesso sulla roccia *qui no*.

      {resilienza Media fallita} L'hai fatto tu, e ogni volta che torni ti strofini
      le mani sulle brache come la prima.
    opzioni:
      - testo: "Lasciar cadere una scheggia"
        descrizione: "Può cadere due volte o nessuna, e la seconda non fa rumore."
        requisiti: [reliquie.scheggia >= 1]
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La seconda scheggia
          testo: |
            Lasci cadere la scheggia dal palmo aperto, e un attimo dopo il primo
            rimbalzo cade di nuovo, a un dito, senza rumore. Le raccogli tutte e due
            prima che il gradone ci ripensi. Sono identiche fino alle scheggiature, e
            una è leggermente più fredda.
          effetti: { reliquie.scheggia: 1 }
        fallimento:
          titolo: Nessuna
          testo: |
            Lasci cadere la scheggia e non la senti arrivare, e non la trovi né la
            prima volta né la seconda, anche se resti chino a cercarla finché ti fa
            male la schiena. La sera ti accorgi che il palmo ha ancora il segno dei
            suoi spigoli.
          effetti: { reliquie.scheggia: -1, tormento: 1 }
      - testo: "Frugare fra i detriti"
        descrizione: "Intorno all'anello la roccia è piena di schegge, ma lo spazio sbaglia anche sotto le mani."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Facile }
        successo:
          titolo: Con le mani svelte
          testo: |
            Frughi fra i detriti con le mani svelte, ritirandole ogni volta che l'aria
            trema, e riempi a metà il fazzoletto di schegge di metallo e di vetro
            precuriano prima che il vento cominci a soffiare da due parti.
          effetti: { reliquie.scheggia: 2 }
        fallimento:
          titolo: Due volte la stessa mano
          testo: |
            Allunghi la mano verso una scheggia e la mano ci arriva due volte di
            seguito, e la seconda si apre sul bordo tagliente. Ti fasci con il
            fazzoletto e te ne vai senza niente, con il sangue che ti scende fino al
            gomito.
          effetti: { ferite: 0.5, contaminazione: 1 }
      - testo: "Andarsene"
        costo: 0
        esito:
          testo: |
            Risali al gradone delle frecce bianche senza voltarti. Dietro di te un
            sasso cade due volte, e poi più niente per un pezzo.
