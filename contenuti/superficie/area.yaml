# La Superficie Fratturata: il quarto hub, fuori città (2 ottobre 2026).
# Ci si va con la mappa, senza gabella, fin dall'inizio. Il mazzo è quello della Superficie (contenuti/superficie/
# carte-*.yaml e ricorrenti.yaml): le carte "ovunque" della città qui non arrivano (area `fuori`).
# Luoghi: la baracca di Oda Krell (reperti e banco, reperti.yaml), le terrazze di basalto (la Frattura che respira,
# gli scavi dei Raschiatori, il Nodo dei Precursori), e tre luoghi che compaiono con le storie che portano fuori
# città: la riva del Torvessa (Roccia di Wren), la pianura del sud (Palude Acquanera), la strada del nord
# (Capomozzo). Il villaggio storto è una spedizione (villaggio.yaml).
aree:
  - id: superficie-fratturata
    immagine: ambientazione/superficie-fratturata
    nome: Superficie Fratturata
    fuori: true
    sommario: "Fuori dalle mura la crosta del mondo è spezzata, e sotto i piedi dormono le macchine dei Precursori."
    testo: |
      Oltre l'ultima porta della città la strada lastricata dura cento passi,
      poi diventa un sentiero di carri e alla fine soltanto un'idea di
      sentiero. La terra intorno si piega in terrazze di basalto e si apre in
      crepe da cui sale un bagliore azzurro, e dalle crepe sale a chiazze la
      Marea Grigia, che dove ieri non c'era oggi può arrivarti alla vita.

      Sulla Superficie le cose si trovano, e fuori dalle mura le mani restano
      più vicine alla cintura.
    negozi: [banco-di-oda]

luoghi:
  - id: baracca-di-oda
    area: superficie-fratturata
    nome: La baracca di Oda Krell
    immagine: ambientazione/orlo-dei-rottami
    sommario: "Una vecchia Raschiatrice vive fra i ferrivecchi a mezza giornata dalle mura e apre i reperti meglio di chiunque."
    testo: |
      La baracca sta in una piega delle terrazze al riparo dal vento, fatta di lamiere precuriane e travi di
      carri. Oda Krell ci vive da sola da quando ha smesso di scendere negli scavi, con una gamba di legno
      intagliata con più cura della baracca. Apre i reperti sigillati e ripara i congegni, e in cambio vuole
      compagnia e qualche moneta, in quest'ordine.
    negozi: [banco-di-oda]

  - id: terrazze-di-basalto
    area: superficie-fratturata
    nome: Le terrazze di basalto
    immagine: ambientazione/rovine-dei-precursori
    sommario: "Gradoni di roccia nera a sud dei Ponti, dove passa la strada degli scavi."
    testo: |
      A sud dei Ponti Sospesi la roccia scende verso la pianura in gradoni neri alti quanto un uomo, su cui
      affiorano anelli di metallo che il tempo non ha toccato. I Raschiatori fanno la strada degli scavi sul
      bordo esterno, senza mai appoggiare la mano sugli anelli, e qualcuno ha girato per scherzo le frecce
      bianche dipinte sui sassi per Vhar'Ul.

  - id: riva-del-torvessa
    area: superficie-fratturata
    nome: La riva del Torvessa
    immagine: ambientazione/roccia-di-wren
    sommario: "Il fiume a nord-est della città, con la Roccia di Wren in mezzo all'ansa."
    requisiti: [pista.sepolcro == 4]
    testo: |
      A nord-est della città il Torvessa si allarga in un'ansa melmosa, e la riva diventa un sentiero fra
      rovi e orti abbandonati. Dalla foschia sull'acqua spunta la Roccia di Wren, nera, con la capanna in
      cima, e i pescatori tirano le barche in secca molto prima di arrivarci.

  - id: pianura-del-sud
    area: superficie-fratturata
    nome: La pianura del sud
    immagine: ambientazione/palude-acquanera
    sommario: "Erba gialla e rasa fino ai pini, e oltre i pini il fango della Palude Acquanera."
    requisiti: [pista.tribu == 2]
    testo: |
      All'uscita sud della Città Bassa comincia una pianura d'erba gialla pettinata dal vento, dove sotto
      l'erba si vedono ancora i solchi dei campi abbandonati. Dove finiscono i pini il terreno cede, e da
      lì in avanti è palude.

  - id: strada-del-nord
    area: superficie-fratturata
    nome: La strada del nord
    immagine: ambientazione/rovolungo
    sommario: "Due giorni e mezzo di colline e di costa fino a Rovolungo e Capomozzo."
    requisiti: [pista.capomozzo >= 1, pista.capomozzo <= 4]
    testo: |
      La strada del nord passa fra i campi e le colline finché sulla destra compare il mare grigio. Sulla
      costa c'è un pino storto dove tutti legano i cavalli, e dietro il pino il roveto di Rovolungo e l'isola
      di Capomozzo.

quality:
  # ------------------------------------------------------------ i reperti e le parti (reperti.yaml)
  - { id: reperto.sigillato, immagine: icone/locked-box, nome: Reperto sigillato, categoria: bene, famiglia: Parti dei Precursori, valore: 6, descrizione: "Un pezzo di macchina dei Precursori chiuso in un guscio che non si apre con le mani. Oda Krell sa che cosa c'è dentro, o almeno sa come scoprirlo." }
  - { id: parte.involucro-1, immagine: icone/cube, nome: Carcassa incrinata, categoria: bene, famiglia: Parti dei Precursori, valore: 8, descrizione: "Un involucro comune. Tiene insieme un congegno, finché non lo scuoti troppo." }
  - { id: parte.involucro-2, immagine: icone/cube, nome: Guscio di metallo scuro, categoria: bene, famiglia: Parti dei Precursori, valore: 20, descrizione: "Un involucro buono e pesante, che dà Stabilità al congegno." }
  - { id: parte.involucro-3, immagine: icone/cubeforce, nome: Cassa sigillata, categoria: bene, famiglia: Parti dei Precursori, valore: 45, descrizione: "Un involucro raro, che si chiude da solo intorno a quello che ci metti. Molta Stabilità e un poco di Stranezza." }
  - { id: parte.camera-1, immagine: icone/crystal-bars, nome: Camera spenta, categoria: bene, famiglia: Parti dei Precursori, valore: 8, descrizione: "Una camera di cristallo comune, opaca. Dà un poco di Potenza." }
  - { id: parte.camera-2, immagine: icone/crystal-bars, nome: Camera a vene, categoria: bene, famiglia: Parti dei Precursori, valore: 20, descrizione: "Una camera di cristallo buona, attraversata da vene di luce. Dà Potenza." }
  - { id: parte.camera-3, immagine: icone/crystal-growth, nome: Camera che pulsa ancora, categoria: bene, famiglia: Parti dei Precursori, valore: 45, descrizione: "Una camera di cristallo rara, che batte come un polso. Molta Potenza, e una carcassa incrinata non la regge." }
  - { id: parte.impugnatura-1, immagine: icone/grab, nome: Manico rifatto, categoria: bene, famiglia: Parti dei Precursori, valore: 8, descrizione: "Un'impugnatura comune, rifatta da mani umane. Un poco di Potenza e di Stabilità." }
  - { id: parte.impugnatura-2, immagine: icone/robot-grab, nome: Impugnatura non umana, categoria: bene, famiglia: Parti dei Precursori, valore: 20, descrizione: "Un'impugnatura buona, fatta per una mano che non esiste più. Potenza e Stabilità." }
  - { id: parte.impugnatura-3, immagine: icone/mechanical-arm, nome: Presa a sei dita, categoria: bene, famiglia: Parti dei Precursori, valore: 45, descrizione: "Un'impugnatura rara, con sei incavi per le dita, che si scalda quando la tieni. Molta Potenza e Stabilità." }
  - { id: parte.nucleo-1, immagine: icone/glowing-artifact, nome: Nucleo opaco, categoria: bene, famiglia: Parti dei Precursori, valore: 8, descrizione: "Un nucleo comune. Dà al congegno un poco di Stranezza." }
  - { id: parte.nucleo-2, immagine: icone/glowing-artifact, nome: Nucleo che sussurra, categoria: bene, famiglia: Parti dei Precursori, valore: 20, descrizione: "Un nucleo buono. Dà Stranezza, e se lo avvicini all'orecchio senti una voce che non finisce mai la frase." }
  - { id: parte.nucleo-3, immagine: icone/mineral-heart, nome: Nucleo che ricorda, categoria: bene, famiglia: Parti dei Precursori, valore: 45, descrizione: "Un nucleo raro. Dà molta Stranezza, e chi lo tiene in mano troppo a lungo si ricorda di posti dove non è mai stato." }

  # ------------------------------------------------------------ il congegno sul banco di Oda (reperti.yaml)
  - { id: banco.involucro, nome: "Involucro montato", categoria: stato, nascosta: true, descrizione: "Il grado dell'involucro sul banco di Oda, da 0 a 3." }
  - { id: banco.camera, nome: "Camera montata", categoria: stato, nascosta: true, descrizione: "Il grado della camera sul banco di Oda, da 0 a 3." }
  - { id: banco.impugnatura, nome: "Impugnatura montata", categoria: stato, nascosta: true, descrizione: "Il grado dell'impugnatura sul banco di Oda, da 0 a 3." }
  - { id: banco.nucleo, nome: "Nucleo montato", categoria: stato, nascosta: true, descrizione: "Il grado del nucleo sul banco di Oda, da 0 a 3." }
  - { id: banco.parti, nome: "Parti montate", categoria: stato, nascosta: true, descrizione: "Quante delle quattro parti del congegno sono montate. Con quattro il congegno è finito e si può vendere." }
  - { id: banco.potenza, nome: "Potenza del congegno", categoria: stato, nascosta: true, descrizione: "Quanto il congegno sul banco può fare." }
  - { id: banco.stabilita, nome: "Stabilità del congegno", categoria: stato, nascosta: true, descrizione: "Quanto il congegno sul banco regge senza rompersi." }
  - { id: banco.stranezza, nome: "Stranezza del congegno", categoria: stato, nascosta: true, descrizione: "Quanto il congegno sul banco fa cose che non dovrebbe." }

  # ------------------------------------------------------------ flag condivise fra i file della Superficie
  - { id: frattura.respiro, nome: "La Frattura che respira", categoria: stato, nascosta: true, descrizione: "Quanto hai stabilizzato la Frattura che respira, da 0 a 4. A 4 si apre il Nodo dei Precursori." }
  - { id: frattura.spenta, nome: "Hai spento la Frattura", categoria: stato, nascosta: true, descrizione: "1 se hai distrutto la Frattura che respira invece di stabilizzarla." }
  - { id: osservatore.marchio, nome: "Il marchio dell'Osservatore", categoria: stato, nascosta: true, descrizione: "1 se l'Osservatore senza volto ti ha segnato, e le macchine dei Precursori ti riconoscono." }

frammenti:
  - id: superficie-fratturata
    titolo: Ciò che resta del mondo
    area: superficie-fratturata
    immagine: ambientazione/superficie-fratturata
    testo: |
      La Superficie Fratturata è quello che resta del mondo dopo la Caduta dei
      Precursori, un continente spezzato in gole e altopiani dove il Mana
      grezzo corre nelle crepe. Il calendario civile conta gli anni dalla
      Caduta, e Qir-Azel, fondata nel 110, è il principale centro abitato
      della Superficie.
  - id: le-crepe-azzurre
    titolo: Le crepe azzurre
    area: superficie-fratturata
    immagine: ambientazione/cristalli-conduttori
    testo: |
      Il terreno della Superficie è percorso da fratture che emettono un
      bagliore azzurro. C'è chi dice che la crosta si stia ricomponendo e chi
      che qualcosa nel profondo cerchi di risalire, e sulle mappe della Gilda
      le crepe più larghe sono segnate in rosso.
  - id: i-villaggi-della-superficie
    titolo: I villaggi
    area: superficie-fratturata
    immagine: ambientazione/laresh
    testo: |
      Fuori da Qir-Azel la gente vive in villaggi isolati. Pannion sta a nord-est nel fumo dei carbonai e
      Tuarmir in una gola dove il sole arriva due ore al giorno, mentre Laresh vive di mulini e di campi e
      Ghoran dei gladiatori ha fatto un mestiere. Le carovane che li collegano viaggiano in gruppo e pagano
      bene chi sa tenere in mano un'arma.

# ------------------------------------------------------------ nemici della Superficie (carte, ricorrenti, spedizioni)
nemici:
  - id: drone-cieco
    immagine: bestiario/salvaguardia-precursori
    nome: Drone cieco
    descrizione: "Una sfera di metallo grande poco più di un pugno, con linee incise che si accendono a intermittenza. Sente il passo invece di vederlo."
    attacco: 3
    difesa: 3
    difesaMentale: 5
    pf: 3
    danno: 1
    iniziativa: 4

  - id: sagoma-della-marea
    immagine: ambientazione/marea-grigia
    nome: Sagoma della Marea
    descrizione: "Un corpo di nebbia grigia con troppe articolazioni, che imita i tuoi gesti con mezzo battito di ritardo."
    attacco: 3
    difesa: 2
    difesaMentale: 2
    pf: 6
    danno: 1
    iniziativa: 2
    tratti: [eco]

  - id: predone
    immagine: ambientazione/superficie-fratturata
    nome: Predone
    descrizione: "Un'armatura fatta di pezzi diversi e un'arma tenuta meglio della paura. Se le cose si mettono male scappa."
    attacco: 2
    difesa: 2
    difesaMentale: 2
    pf: 5
    danno: 1
    iniziativa: 2
    puoFuggire: true

  - id: cavaliere-della-marea
    immagine: ambientazione/marea-grigia
    nome: Il Cavaliere della Marea
    descrizione: "Un'armatura completa attraversata da venature lattiginose. Dentro c'è ancora qualcuno, e combatte come combatteva da vivo."
    attacco: 5
    difesa: 4
    difesaMentale: 3
    pf: 16
    danno: 2
    riduzione: 2
    iniziativa: 1

  - id: ladro-invisibile
    immagine: ambientazione/superficie-fratturata
    nome: Il ladro che non si vede
    descrizione: "Una distorsione dell'aria con le mani svelte. Lo vedi soltanto quando si muove."
    attacco: 2
    difesa: 5
    difesaMentale: 3
    pf: 5
    danno: 0
    iniziativa: 5
    puoFuggire: true

  - id: custode-del-nodo
    immagine: bestiario/salvaguardia-precursori
    nome: Il custode del Nodo
    descrizione: "Una macchina della Salvaguardia alta due volte un uomo, con quattro braccia che finiscono in attrezzi. Tratta chi entra come un errore da correggere."
    attacco: 5
    difesa: 4
    difesaMentale: 6
    pf: 14
    danno: 1
    riduzione: 2
    iniziativa: 2

scontri:
  - { id: sciame-di-droni-ciechi, nome: "Lo sciame di droni ciechi", nemici: [drone-cieco, drone-cieco], feriteSconfitta: 2 }
  - { id: sagome-della-marea, nome: "Le sagome della Marea", nemici: [sagoma-della-marea, sagoma-della-marea], feriteSconfitta: 3 }
  - { id: il-cuore-del-villaggio, nome: "Il cuore del villaggio storto", nemici: [sagoma-della-marea, sagoma-della-marea, sagoma-della-marea], feriteSconfitta: 3 }
  - { id: predoni-disorganizzati, nome: "I predoni", nemici: [predone, predone, predone], feriteSconfitta: 2 }
  - { id: predone-solitario, nome: "Il predone solitario", nemici: [predone], feriteSconfitta: 2 }
  - { id: cavaliere-della-marea, nome: "Il Cavaliere della Marea", nemici: [cavaliere-della-marea], feriteSconfitta: 4 }
  - { id: ladro-invisibile, nome: "Il ladro che non si vede", nemici: [ladro-invisibile], feriteSconfitta: 2 }
  - { id: custode-del-nodo, nome: "Il custode del Nodo", nemici: [custode-del-nodo, drone-cieco], feriteSconfitta: 4 }
