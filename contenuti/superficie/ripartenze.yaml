# Le ripartenze dalla Superficie Fratturata: le spedizioni fuori città si possono riprendere da qui, senza tornare
# in città, quando la storia è già partita (le scene di partenza con Galdrick, Dolovan e Dragna restano in città).
# La strada del nord riporta alla tappa di Capomozzo in corso (pista.capomozzo da 1 a 4), la strada degli scavi ai
# siti dei Raschiatori già visitati. Le opzioni di ogni tappa compaiono con `quando`; i costi sono quelli delle
# partenze dalla città.
storylet:
  - id: riprendere-la-strada-del-nord
    presso: strada-del-nord
    immagine: ambientazione/rovolungo
    titolo: Riprendere la strada del nord
    sommario: "La strada per Capomozzo la conosci già, e da qui si parte senza passare dalla porta della città."
    luogo: Superficie Fratturata, la strada del nord
    area: superficie-fratturata
    ripetibile: true
    requisiti: [pista.capomozzo >= 1, pista.capomozzo <= 4]
    testo: |
      Il sentiero dei carri piega verso nord fra due colline basse, e da lì in poi la strada la conosci a
      memoria, dalla fontana senza secchio al gelso storto del bivio per Pannion dove si fermano a pisciare
      tutti i carrettieri. Le ruote hanno scavato nel sentiero due solchi profondi quanto una mano, e in mezzo
      ai solchi cresce l'erba.

      Più avanti ti incrocia un carrettiere che torna dalla costa. «Ancora lassù?» dice, e non aspetta la
      risposta. Sul carro ha una cesta di granchi vivi che gratta sotto una tela bagnata, e la tela lascia
      nella polvere una fila di gocce.

      {origine fuggiasco-di-ghoran} Quando hai sentito le ruote alle spalle sei uscit{o|a} dal sentiero prima
      ancora di voltarti, come nei primi giorni dopo Ghoran. Rientri sulla strada con le orecchie calde, anche
      se il carrettiere guardava soltanto i suoi granchi.
    opzioni:
      - testo: "Tornare al roveto di Rovolungo"
        descrizione: "Due giorni e mezzo a piedi fino al muro di spine."
        quando: [pista.capomozzo == 1]
        esito:
          titolo: Il muro di spine
          testo: |
            Cammini fra le colline finché sulla destra non compare il mare, grigio come lo hai lasciato, quasi
            che nessuno si fosse preso la briga di cambiarlo. Il secondo giorno dormi sotto il pino storto,
            con il rumore delle onde che non smette mai. A mezzogiorno del terzo sei davanti al roveto, con le
            sue spine lunghe un dito e la punta scura. Le vecchie croste sulle mani cominciano a tirare prima
            ancora che tu tocchi una spina.
          vai: rovolungo
      - testo: "Tornare alla fortezza di Capomozzo"
        descrizione: "Fino alla costa e poi oltre il ponte di corda, come l'altra volta."
        quando: [pista.capomozzo == 2]
        esito:
          titolo: La costa
          testo: |
            Due giorni e mezzo di colline e poi di costa, con il sale che ti si secca sulle labbra e che
            lecchi via senza pensarci, sapendo che è peggio. Il roveto ti lascia passare dalla solita stuoia
            di rami, e il ponte di corda cigola sotto i piedi come la prima volta. In cima all'isola la
            palizzata di relitti ti aspetta con le porte socchiuse. Le chiglie che la reggono sono nere di
            catrame.
          vai: capomozzo
      - testo: "Scendere sotto la fortezza"
        descrizione: "Fino al ponte di corda, e poi la scala che gira dentro la roccia."
        quando: [pista.capomozzo == 3]
        esito:
          titolo: La scala nella roccia
          testo: |
            La strada è sempre quella, fino al ponte che dondola sopra le onde e ti costringe a camminare a
            gambe larghe. Sull'isola nessuno ti ferma, e un paio di orchi alzano appena la testa. Dietro
            l'altare della chiesa senza tetto la scala scende nella roccia viva, con i gradini consumati al
            centro. Le lanterne che qualcuno appende per chi al buio non ci vede sono ancora accese, una ogni
            dieci gradini.
          vai: sotto-capomozzo
      - testo: "Tornare nelle rovine sotto l'isola"
        descrizione: "A piedi la strada è lunga, e laggiù serve arrivare riposati."
        quando: [pista.capomozzo == 4]
        costo: 2
        esito:
          titolo: Le gambe pesanti
          testo: |
            Cammini due giorni e mezzo fra le colline e la costa. La seconda notte dormi sotto una barca
            rovesciata che sa di catrame e ti lascia il suo odore nei capelli fino al mattino. Quando arrivi
            al roveto hai le vesciche aperte. Scendendo verso la porta di pietra pensi alla Marea ferma in
            fondo al corridoio e alle lanterne che qualcuno, laggiù, continua a tenere accese.
          vai: cuore-di-capomozzo
      - testo: "Andare a cavallo fino a Rovolungo"
        descrizione: "Il cavallo conosce la strada, e arrivi con le gambe fresche."
        quando: [pista.capomozzo == 1]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: A cavallo sulla costa
          testo: |
            Il cavallo prende la strada del nord al trotto e a ogni bivio tira dalla parte giusta prima che tu
            glielo chieda. Sbuffa ogni volta che ti sistemi in sella, e le orecchie gli vanno indietro finché
            non stai ferm{o|a}. Dormi una notte sola sotto il pino storto, e a metà del secondo giorno lo
            leghi davanti al muro di spine con una bracciata d'erba sotto il muso.
          vai: rovolungo
      - testo: "Andare a cavallo fino alla fortezza"
        descrizione: "Il cavallo resta legato al pino storto, il resto lo fai a piedi."
        quando: [pista.capomozzo == 2]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il pino storto
          testo: |
            A cavallo la costa arriva un giorno prima, piena di gabbiani che litigano per lo stesso pesce
            morto. Lo leghi al pino storto davanti al roveto e prosegui a piedi fino al ponte di corda, che
            sotto il tuo peso si abbassa di una spanna. Poi sali su per l'isola verso il vociare degli orchi.
          vai: capomozzo
      - testo: "Andare a cavallo fino alla scala"
        descrizione: "Il cavallo resta legato al pino storto, il resto lo fai a piedi."
        quando: [pista.capomozzo == 3]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il pino storto
          testo: |
            A cavallo la costa arriva un giorno prima. Lo leghi al pino storto davanti al roveto con una
            bracciata d'erba, e attraversi il ponte di corda tenendoti alle funi ruvide di sale. Sull'isola
            vai dritto alla chiesa senza tetto, dove la scala scende nella roccia.
          vai: sotto-capomozzo
      - testo: "Andare a cavallo fino alle rovine"
        descrizione: "Arrivi un giorno prima e con meno vesciche."
        quando: [pista.capomozzo == 4]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 1
        esito:
          titolo: La nebbia del secondo giorno
          testo: |
            Il cavallo prende la costa al trotto. Il secondo giorno dal mare sale la nebbia e non vedi più
            nemmeno le sue orecchie, e lui ti porta fino al roveto senza che tu debba cercare la strada. Lo
            lasci legato al pino storto con la criniera bagnata di nebbia, e scendi a piedi verso la porta di
            pietra con le gambe ancora buone.
          vai: cuore-di-capomozzo

  - id: riprendere-la-strada-degli-scavi
    presso: terrazze-di-basalto
    immagine: ambientazione/rovine-dei-precursori
    titolo: La strada degli scavi
    sommario: "Le frecce bianche sui sassi portano agli scavi dei Raschiatori. Quelli dove sei già sces{o|a} li ritrovi da sol{o|a}."
    luogo: Superficie Fratturata, le terrazze di basalto
    area: superficie-fratturata
    ripetibile: true
    requisiti: [raschiatore >= 1, pista.acciaio >= 8]
    testo: |
      Sulle terrazze le frecce bianche dei Raschiatori si dividono in tre direzioni. Sono dipinte su sassi
      piatti che chiunque può girare con un piede, e su ogni sasso c'è il nome del sito scritto a gesso con la
      grafia squadrata di Dragna. La strada di un sito dove sei già stat{o|a} la ritrovi anche senza il foglio
      dei turni del Grifone.

      Ti siedi su un gradone a mangiare un pezzo di pane. *Quella per Vhar'Ul l'hanno girata di nuovo.* La
      rimetti a posto con la punta dello stivale, e sotto il sasso il basalto è più chiaro dove la pioggia non
      è arrivata.

      {mezzanotte} Accanto a te c'è un secondo pezzo di pane, posato su un fazzoletto piegato in quattro come
      lo pieghi tu. Ha già il segno di un morso e le briciole sono fresche, ma sulle terrazze non c'è nessuno.
      Quando allunghi la mano ti accorgi che il morso ha la forma dei tuoi denti.

      {origine apprendista-raschiatore} La prima freccia che hai tracciato da sol{o|a} un caposquadra te l'ha
      fatta rifare due volte, perché la punta era troppo corta per chi torna su stanco.
    opzioni:
      - testo: "Andare a Vhar'Ul"
        descrizione: "Verso sud, oltre gli ultimi anelli, fino al portello mezzo interrato."
        quando: [rovine.vhar-ul >= 1]
        esito:
          titolo: Il portello
          testo: |
            Scendi le terrazze verso sud contando gli anelli di metallo. Sul più grande ritrovi il sasso in
            equilibrio che avevi lasciato l'altra volta, e ti fa un piacere sciocco che nessuno l'abbia
            buttato giù. Il portello di Vhar'Ul è mezzo interrato come sempre e non ha un graffio, mentre la
            baracca della Gilda accanto ha le assi più grigie dell'ultima volta. Dentro le paratie battono
            piano con il tuo passo.
          imposta: { vhar-ul.nodo: 0 }
          vai: vhar-ul
      - testo: "Andare al Laboratorio di Calibrazione"
        descrizione: "Due giorni a sud-est, fino alla collina di vetro."
        quando: [rovine.calibrazione >= 1]
        esito:
          titolo: La collina di vetro
          testo: |
            Cammini due giorni verso sud-est, fra crepe da saltare e pianori di ghiaia dove il vento ti
            riempie la bocca di polvere. Al tramonto la collina di vetro ti restituisce il sole negli occhi.
            Davanti alla crepa dell'ingresso le ceneri del tuo fuoco dell'altra volta sono ancora lì bagnate
            dalla rugiada. I sassi intorno sono dove li avevi messi.

            {origine allievo-di-torvessa} All'Accademia tarare un cristallo vuol dire un pomeriggio chino su
            un supporto d'ottone. Là dentro si taravano macchine che a Torvessa non si sanno costruire, e ti
            torna la voglia di prendere appunti con il vento che ti strappa le pagine.
          vai: laboratorio-di-calibrazione
      - testo: "Andare a Mahr-Kel"
        descrizione: "Un giorno e mezzo a sud-ovest, nelle terre basse."
        quando: [rovine.mahr-kel >= 1]
        esito:
          titolo: Il filo di vapore
          testo: |
            La strada per le terre basse scende per un giorno e mezzo, e l'aria si fa calda e ferma, tanto che
            la camicia ti si attacca alla schiena già a metà mattina. Riconosci la spaccatura da lontano per
            il filo di vapore che sale dritto. I paletti della prima squadra sono ancora piantati intorno, con
            il cartello di latta che il vento non ha finito di leggere e i chiodi che gli hanno lasciato sotto
            due righe di ruggine.
          vai: mahr-kel
      - testo: "Lasciare le frecce dove sono"
        descrizione: "Non oggi."
        inquieta: "Non oggi, anche se stanotte le hai sognate girate tutte verso le mura."
        costo: 0
        esito:
          titolo: Il pane
          testo: |
            Finisci il pane e scuoti le briciole dalle ginocchia, e un passero delle terrazze scende subito a
            controllare che tu non ne abbia dimenticata nessuna. Le frecce restano lì, tre dita bianche
            puntate verso il sud, e tu torni verso le mura con il vento alle spalle.
