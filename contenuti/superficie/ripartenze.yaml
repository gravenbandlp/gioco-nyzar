# Le ripartenze dalla Superficie Fratturata: le spedizioni fuori città si possono riprendere da qui, senza tornare
# in città, quando la storia è già partita (le scene di partenza con Galdrick, Dolovan e Dragna restano in città).
# La strada del nord riporta alla tappa di Capomozzo in corso (pista.capomozzo da 1 a 4), la strada degli scavi ai
# siti dei Raschiatori già visitati. Le opzioni di ogni tappa compaiono con `quando`; i costi sono quelli delle
# partenze dalla città.
storylet:
  - id: riprendere-la-strada-del-nord
    presso: strada-del-nord
    immagine: ambientazione/rovolungo
    titolo: Riprendere la strada del nord
    sommario: "La strada per Capomozzo la conosci già, e da qui si parte senza passare dalla porta della città."
    luogo: Superficie Fratturata, la strada del nord
    area: superficie-fratturata
    ripetibile: true
    requisiti: [pista.capomozzo >= 1, pista.capomozzo <= 4]
    testo: |
      Il sentiero dei carri piega verso nord fra due colline basse, e da lì
      in poi la strada la conosci a memoria, con la fontana senza secchio a
      metà della prima giornata e il cartello di Laresh che qualcuno ha girato
      verso il mare, magari per mandare i forestieri a bagnarsi i piedi. Ti fermi sul ciglio a stringere le cinghie dello
      zaino. Le gambe ricordano la fatica dell'altra volta prima di te, e
      cominciano a protestare in anticipo.

      {resistenza Facile} Lasciale protestare. Il primo giorno fanno sempre
      così, poi al secondo si stancano anche di lamentarsi e camminano e
      basta.

      Più avanti un carrettiere che torna dalla costa ti incrocia e alza il
      mento verso nord. «Ancora lassù?» dice, e non aspetta la risposta. Sul
      carro ha una cesta di granchi vivi coperta da una tela bagnata, e la
      cesta gratta per tutto il tempo che ci mette a sparire dietro la
      collina.

      {conoscenze-della-strada Media} Granchi vivi che viaggiano verso la
      città all'alba senza scorta. In città c'è un oste che li paga bene se arrivano
      prima di quelli degli altri, e quel vecchio ci guadagna più di quanto
      il suo carro lasci credere.
    opzioni:
      - testo: "Tornare al roveto di Rovolungo"
        descrizione: "Due giorni e mezzo a piedi fino al muro di spine."
        quando: [pista.capomozzo == 1]
        esito:
          titolo: Il muro di spine
          testo: |
            Cammini fra le colline finché sulla destra non compare il mare,
            grigio come lo hai lasciato, quasi che nessuno si fosse preso la
            briga di cambiarlo. Il secondo giorno dormi sotto il pino storto,
            con il rumore delle onde che non smette mai. A mezzogiorno del
            terzo sei davanti al roveto, e le vecchie croste sulle mani
            cominciano a tirare prima ancora che tu tocchi una spina.

            {medicina Facile} Sono guarite male perché le hai grattate. Lo sai
            tu e lo sanno loro.
          vai: rovolungo
      - testo: "Tornare alla fortezza di Capomozzo"
        descrizione: "Fino alla costa e poi oltre il ponte di corda, come l'altra volta."
        quando: [pista.capomozzo == 2]
        esito:
          titolo: La costa
          testo: |
            Due giorni e mezzo di colline e poi di costa, con il sale che ti si
            secca sulle labbra e che lecchi via senza pensarci, sapendo che è
            peggio. Il roveto ti lascia passare dalla solita stuoia di rami, il
            ponte di corda cigola sotto i piedi come la prima volta, e in cima
            all'isola la palizzata di relitti ti aspetta con le porte
            socchiuse.
          vai: capomozzo
      - testo: "Scendere sotto la fortezza"
        descrizione: "Fino al ponte di corda, e poi la scala che gira dentro la roccia."
        quando: [pista.capomozzo == 3]
        esito:
          titolo: La scala nella roccia
          testo: |
            La strada è sempre quella, fino al ponte che dondola sopra le
            onde e ti costringe a camminare a gambe larghe. Sull'isola nessuno
            ti ferma, e un paio di orchi alzano appena la testa. Dietro
            l'altare della chiesa senza tetto la scala scende nella roccia, e
            le lanterne che qualcuno appende per chi al buio non ci vede sono
            ancora accese, una ogni dieci gradini.
          vai: sotto-capomozzo
      - testo: "Tornare nelle rovine sotto l'isola"
        descrizione: "A piedi la strada è lunga, e laggiù serve arrivare riposati."
        quando: [pista.capomozzo == 4]
        costo: 2
        esito:
          titolo: Le gambe pesanti
          testo: |
            Cammini due giorni e mezzo fra le colline e la costa, e la seconda
            notte dormi sotto una barca rovesciata che sa di catrame e ti lascia
            il suo odore nei capelli fino al mattino. Quando arrivi al roveto
            hai le vesciche aperte, e scendendo verso la porta di pietra pensi
            alla Marea ferma in fondo al corridoio e alle lanterne che
            qualcuno, laggiù, continua a tenere accese.

            {resistenza Media fallita} I piedi hanno deciso di non essere più
            tuoi. Li porti giù per i gradini come due bagagli presi in prestito.
          vai: cuore-di-capomozzo
      - testo: "Andare a cavallo fino a Rovolungo"
        descrizione: "Il cavallo conosce la strada, e arrivi con le gambe fresche."
        quando: [pista.capomozzo == 1]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: A cavallo sulla costa
          testo: |
            Il cavallo prende la strada del nord al trotto e a ogni bivio tira
            dalla parte giusta prima che tu glielo chieda, e sbuffa ogni volta
            che ti sistemi in sella. Dormi una notte sola, sotto il pino storto,
            e a metà del secondo giorno lo leghi davanti al muro di spine con
            una bracciata d'erba sotto il muso.

            {cavalcare Facile} Ha imparato la strada meglio di te. Lascia le
            redini lente e fallo lavorare.
          vai: rovolungo
      - testo: "Andare a cavallo fino alla fortezza"
        descrizione: "Il cavallo resta legato al pino storto, il resto lo fai a piedi."
        quando: [pista.capomozzo == 2]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il pino storto
          testo: |
            A cavallo la costa arriva un giorno prima, piena di gabbiani che
            litigano per lo stesso pesce morto. Lo leghi al pino storto davanti
            al roveto e prosegui a piedi fino al ponte, e poi su per l'isola
            verso il vociare degli orchi.
          vai: capomozzo
      - testo: "Andare a cavallo fino alla scala"
        descrizione: "Il cavallo resta legato al pino storto, il resto lo fai a piedi."
        quando: [pista.capomozzo == 3]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il pino storto
          testo: |
            A cavallo la costa arriva un giorno prima. Lo leghi al pino storto
            davanti al roveto con una bracciata d'erba, attraversi il ponte di
            corda tenendoti alle funi e sull'isola vai dritto alla chiesa senza
            tetto, dove la scala scende nella roccia.

            {acrobazia Facile} Sul ponte tieni il peso basso e non guardare le
            onde. Le funi ti reggono anche se tu non ci credi.
          vai: sotto-capomozzo
      - testo: "Andare a cavallo fino alle rovine"
        descrizione: "Arrivi un giorno prima e con meno vesciche."
        quando: [pista.capomozzo == 4]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 1
        esito:
          titolo: La nebbia del secondo giorno
          testo: |
            Il cavallo prende la costa al trotto, e il secondo giorno, quando
            dal mare sale la nebbia e non vedi più nemmeno le sue orecchie, ti
            porta fino al roveto senza che tu debba cercare la strada. Lo lasci
            legato al pino storto e scendi a piedi verso la porta di pietra,
            con le gambe ancora buone.
          vai: cuore-di-capomozzo

  - id: riprendere-la-strada-degli-scavi
    presso: terrazze-di-basalto
    immagine: ambientazione/rovine-dei-precursori
    titolo: La strada degli scavi
    sommario: "Le frecce bianche sui sassi portano agli scavi dei Raschiatori. Quelli dove sei già sceso li ritrovi da solo."
    luogo: Superficie Fratturata, le terrazze di basalto
    area: superficie-fratturata
    ripetibile: true
    requisiti: [raschiatore >= 1, pista.acciaio >= 8]
    testo: |
      Sulle terrazze le frecce bianche dei Raschiatori si dividono in tre
      direzioni, e su ogni sasso qualcuno ha aggiunto a gesso il nome del
      sito, con la grafia squadrata di Dragna o con quella di chi l'ha copiata
      male e ha messo l'apostrofo dove gli pareva. Il foglio dei turni al
      Grifone serve per sapere chi scende e quando, ma la strada di un sito
      dove sei già stato la ritrovi anche da qui.

      {percezione Facile} Sul sasso di Vhar'Ul il gesso è sbavato da una
      parte sola, quella dove l'hanno preso con la mano per girarlo. Sulle
      altre due frecce la pioggia ha lavorato in pace.

      Ti siedi su un gradone a mangiare un pezzo di pane, e intanto guardi
      le frecce. *Quella per Vhar'Ul l'hanno girata
      di nuovo.* La rimetti a posto con la punta dello stivale.

      {conoscenze-della-strada Media fallita} Chi gira le frecce dei
      Raschiatori lo fa per uno scherzo o per un motivo, e tu non sapresti
      dire quale dei due. Mastichi il pane e decidi che è uno scherzo.
    opzioni:
      - testo: "Andare a Vhar'Ul"
        descrizione: "Verso sud, oltre gli ultimi anelli, fino al portello mezzo interrato."
        quando: [rovine.vhar-ul >= 1]
        esito:
          titolo: Il portello
          testo: |
            Scendi le terrazze verso sud contando gli anelli di metallo, e sul
            più grande ritrovi il sasso in equilibrio che avevi lasciato l'altra
            volta, e ti fa un piacere sciocco che nessuno l'abbia buttato giù.
            Il portello di Vhar'Ul è mezzo interrato come sempre, con la
            baracca della Gilda accanto, e dentro le paratie battono piano,
            con il tuo passo.
          imposta: { vhar-ul.nodo: 0 }
          vai: vhar-ul
      - testo: "Andare al Laboratorio di Calibrazione"
        descrizione: "Due giorni a sud-est, fino alla collina di vetro."
        quando: [rovine.calibrazione >= 1]
        esito:
          titolo: La collina di vetro
          testo: |
            Cammini due giorni verso sud-est, fra crepe da saltare e pianori di
            ghiaia dove il vento ti riempie la bocca di polvere. La sputi, e
            un'ora dopo la ritrovi fra i denti. Al tramonto la collina di vetro ti
            restituisce il sole negli occhi, e davanti alla crepa dell'ingresso
            le ceneri del tuo fuoco dell'altra volta sono ancora lì, bagnate
            dalla rugiada.
          vai: laboratorio-di-calibrazione
      - testo: "Andare a Mahr-Kel"
        descrizione: "Un giorno e mezzo a sud-ovest, nelle terre basse."
        quando: [rovine.mahr-kel >= 1]
        esito:
          titolo: Il filo di vapore
          testo: |
            La strada per le terre basse scende per un giorno e mezzo, e l'aria
            si fa calda e ferma, tanto che la camicia ti si attacca alla
            schiena già a metà mattina. Riconosci la spaccatura da lontano, per
            il filo di vapore che sale dritto, e i paletti della prima squadra
            sono ancora piantati intorno, con il cartello di latta che il vento
            non ha finito di leggere.
          vai: mahr-kel
      - testo: "Lasciare le frecce dove sono"
        descrizione: "Non oggi."
        costo: 0
        esito:
          titolo: Il pane
          testo: |
            Finisci il pane e scuoti le briciole dalle ginocchia, e un passero
            delle terrazze scende subito a controllare che tu non ne abbia
            dimenticata nessuna. Le frecce restano lì, tre dita bianche puntate
            verso il sud, e tu torni verso le mura con il vento alle spalle.
