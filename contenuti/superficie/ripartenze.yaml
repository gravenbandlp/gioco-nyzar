# Le ripartenze dalla Superficie Fratturata: le spedizioni fuori città si possono riprendere da qui, senza tornare
# in città, quando la storia è già partita (le scene di partenza con Galdrick, Dolovan e Dragna restano in città).
# La strada del nord riporta alla tappa di Capomozzo in corso (pista.capomozzo da 1 a 4), la strada degli scavi ai
# siti dei Raschiatori già visitati. Le opzioni di ogni tappa compaiono con `quando`; i costi sono quelli delle
# partenze dalla città.
storylet:
  - id: riprendere-la-strada-del-nord
    presso: strada-del-nord
    immagine: ambientazione/rovolungo
    titolo: Riprendere la strada del nord
    sommario: "Conosci già la strada per Capomozzo, e da qui parti senza ripassare dalla porta della città."
    luogo: Superficie Fratturata, la strada del nord
    area: superficie-fratturata
    ripetibile: true
    requisiti: [pista.capomozzo >= 1, pista.capomozzo <= 4]
    testo: |
      Il sentiero dei carri piega verso nord fra due colline basse, e da lì la
      strada la conosci a memoria, fino al gelso storto del bivio per Pannion. Le
      gambe ricordano la fatica dell'altra volta e cominciano a protestare in
      anticipo.

      {origine fuggiasco-di-ghoran} Quando senti le ruote di un carro alle spalle
      esci dal sentiero prima ancora di voltarti, come nei primi giorni dopo Ghoran.

      Il carrettiere che ti supera porta in città una cesta di granchi vivi sotto
      una tela bagnata, e alzando il mento verso nord ti chiede se vai ancora lassù.
    opzioni:
      - testo: "Tornare al roveto di Rovolungo"
        descrizione: "Due giorni e mezzo a piedi fino al muro di spine."
        quando: [pista.capomozzo == 1]
        esito:
          titolo: Il muro di spine
          testo: |
            Cammini fra le colline finché sulla destra compare il mare, e dopo una
            notte sotto il pino storto, a mezzogiorno del terzo giorno, sei
            davanti al roveto, con le vecchie croste sulle mani che già tirano.
          vai: rovolungo
      - testo: "Tornare alla fortezza di Capomozzo"
        descrizione: "Fino alla costa e poi oltre il ponte di corda, come l'altra volta."
        quando: [pista.capomozzo == 2]
        esito:
          titolo: La costa
          testo: |
            Due giorni e mezzo di colline e poi di costa, con il sale che ti si
            secca sulle labbra. Il roveto ti lascia passare dalla solita stuoia di
            rami e il ponte di corda cigola come la prima volta. In cima all'isola
            la palizzata di relitti ti aspetta con le porte socchiuse.
          vai: capomozzo
      - testo: "Scendere sotto la fortezza"
        descrizione: "Fino al ponte di corda, e poi la scala che gira dentro la roccia."
        quando: [pista.capomozzo == 3]
        esito:
          titolo: La scala nella roccia
          testo: |
            La strada è sempre quella, fino al ponte che dondola sopra le onde.
            Sull'isola nessuno ti ferma, e un paio di orchi alzano appena la
            testa. Dietro l'altare della chiesa senza tetto la scala scende nella
            roccia, con le lanterne ancora accese, una ogni dieci gradini.
          vai: sotto-capomozzo
      - testo: "Tornare nelle rovine sotto l'isola"
        descrizione: "A piedi la strada è lunga, e laggiù serve arrivare riposati."
        quando: [pista.capomozzo == 4]
        costo: 2
        esito:
          titolo: Le gambe pesanti
          testo: |
            Due giorni e mezzo fra le colline e la costa, e la seconda notte una
            barca rovesciata che ti lascia l'odore di catrame nei capelli.
            Scendendo verso la porta di pietra pensi alla Marea ferma in fondo al
            corridoio e alle lanterne che qualcuno, laggiù, tiene ancora accese.
          vai: cuore-di-capomozzo
      - testo: "Andare a cavallo fino a Rovolungo"
        descrizione: "Il cavallo conosce la strada, e arrivi con le gambe fresche."
        quando: [pista.capomozzo == 1]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: A cavallo sulla costa
          testo: |
            Il cavallo prende la strada del nord al trotto e a ogni bivio tira
            dalla parte giusta prima che tu glielo chieda. Dormi una notte sola,
            sotto il pino storto, e a metà del secondo giorno lo leghi davanti al
            muro di spine con una bracciata d'erba sotto il muso.
          vai: rovolungo
      - testo: "Andare a cavallo fino alla fortezza"
        descrizione: "Il cavallo resta legato al pino storto, il resto lo fai a piedi."
        quando: [pista.capomozzo == 2]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il pino storto
          testo: |
            A cavallo la costa arriva un giorno prima. Lo leghi al pino storto
            davanti al roveto e prosegui a piedi fino al ponte, e poi su per
            l'isola verso il vociare degli orchi.
          vai: capomozzo
      - testo: "Andare a cavallo fino alla scala"
        descrizione: "Il cavallo resta legato al pino storto, il resto lo fai a piedi."
        quando: [pista.capomozzo == 3]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il pino storto
          testo: |
            A cavallo la costa arriva un giorno prima. Lo leghi al pino storto
            davanti al roveto e prosegui a piedi. Attraversato il ponte di corda,
            sull'isola vai dritto alla chiesa senza tetto, dove la scala scende
            nella roccia.
          vai: sotto-capomozzo
      - testo: "Andare a cavallo fino alle rovine"
        descrizione: "Arrivi un giorno prima e con meno vesciche."
        quando: [pista.capomozzo == 4]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 1
        esito:
          titolo: La nebbia del secondo giorno
          testo: |
            Il cavallo prende la costa al trotto, e il secondo giorno, quando dal
            mare sale una nebbia che ti nasconde perfino le sue orecchie, ti porta
            fino al roveto da solo. Lo lasci legato al pino storto e scendi a
            piedi verso la porta di pietra.
          vai: cuore-di-capomozzo

  - id: riprendere-la-strada-degli-scavi
    presso: terrazze-di-basalto
    immagine: ambientazione/rovine-dei-precursori
    titolo: La strada degli scavi
    sommario: "Le frecce bianche sui sassi portano agli scavi dei Raschiatori, e quelli che conosci li ritrovi da solo."
    luogo: Superficie Fratturata, le terrazze di basalto
    area: superficie-fratturata
    ripetibile: true
    requisiti: [raschiatore >= 1, pista.acciaio >= 8]
    testo: |
      Sulle terrazze le frecce bianche dei Raschiatori si dividono in tre
      direzioni, ognuna con il nome del sito scritto a gesso nella grafia
      squadrata di Dragna. La strada di un sito dove sei già stato la ritrovi
      anche senza passare dal foglio dei turni al Grifone.

      {origine apprendista-raschiatore} La prima freccia che hai tracciato da
      solo un caposquadra te l'ha fatta rifare due volte, perché la punta era
      troppo corta per chi torna su stanco.

      Con la punta dello stivale rimetti a posto la freccia per Vhar'Ul, che
      qualcuno ha girato di nuovo.
    opzioni:
      - testo: "Andare a Vhar'Ul"
        descrizione: "Verso sud, oltre gli ultimi anelli, fino al portello mezzo interrato."
        quando: [rovine.vhar-ul >= 1]
        esito:
          titolo: Il portello
          testo: |
            Scendi le terrazze verso sud contando gli anelli di metallo, e sul più
            grande ritrovi il sasso in equilibrio che avevi lasciato l'altra
            volta. Il portello di Vhar'Ul è mezzo interrato come sempre, con la
            baracca della Gilda accanto, e dentro le paratie battono piano.
          imposta: { vhar-ul.nodo: 0 }
          vai: vhar-ul
      - testo: "Andare al Laboratorio di Calibrazione"
        descrizione: "Due giorni a sud-est, fino alla collina di vetro."
        quando: [rovine.calibrazione >= 1]
        esito:
          titolo: La collina di vetro
          testo: |
            Cammini due giorni verso sud-est, fra crepe da saltare e pianori di ghiaia
            dove il vento ti riempie la bocca di polvere. Al tramonto la collina di vetro
            ti restituisce il sole negli occhi, e davanti alla crepa dell'ingresso ci
            sono ancora le ceneri del tuo fuoco dell'altra volta.

            {origine allievo-di-torvessa} Là dentro si taravano macchine che
            all'Accademia di Torvessa nessuno sa costruire.
          vai: laboratorio-di-calibrazione
      - testo: "Andare a Mahr-Kel"
        descrizione: "Un giorno e mezzo a sud-ovest, nelle terre basse."
        quando: [rovine.mahr-kel >= 1]
        esito:
          titolo: Il filo di vapore
          testo: |
            La strada per le terre basse scende per un giorno e mezzo, e l'aria si
            fa calda e ferma, tanto che la camicia ti si attacca alla schiena.
            Riconosci la spaccatura da lontano per il filo di vapore che sale
            dritto, con intorno i paletti della prima squadra ancora piantati.
          vai: mahr-kel
      - testo: "Lasciare le frecce dove sono"
        descrizione: "Non oggi."
        costo: 0
        esito:
          titolo: Il pane
          testo: |
            Finisci il pane e scuoti le briciole dalle ginocchia, e un passero
            delle terrazze scende subito a controllare. Le frecce restano lì a
            puntare verso sud, e tu torni verso le mura con il vento alle spalle.
