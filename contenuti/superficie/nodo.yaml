# Il Nodo dei Precursori, spedizione della Superficie Fratturata. Si apre quando la Frattura che respira è
# stabilizzata del tutto (frattura.respiro 4): l'ingresso è alle terrazze di basalto. Le stanze vanno in
# ordine secondo la profondità:
# 0 la soglia spenta (37), 1 la galleria esterna (il macchinario in attesa, 25, o la sfera fra i detriti, 12),
# 2 l'interno (lo sciame, 41, o l'aria storta, 44), 3 il pozzo delle linee (stanza nuova) o l'aria storta,
# se non l'hai già passata. Il cuore è il dispositivo attivo (50), che riporta sulle terrazze in ogni ramo e
# non si chiude: la spedizione si può rifare. La prima attivazione riuscita (nodo-precursori.attivato) dà
# l'arma a impulsi e una camera rara; dopo, parti buone e reperti sigillati.
# Senza combattere: lo sciame si aggira con qualche moneta che rotola; al custode si porge una scheggia per la sua
# fila (Sociale, Difficile, la scheggia si perde comunque).
# Una stanza superata non ricompare nella stessa visita (src/motore/spedizioni.ts).
quality:
  - { id: nodo-precursori.attivato, nome: Hai acceso il dispositivo del Nodo, categoria: stato, nascosta: true, descrizione: "1 se hai attivato il dispositivo in fondo al Nodo dei Precursori, e lui ti ha misurato la mano." }

aree:
  - id: nodo-dei-precursori
    immagine: ambientazione/rovine-dei-precursori
    nome: Nodo dei Precursori
    sommario: "In una conca vicino alla Frattura che respira, un blocco di metallo dei Precursori spento da sempre si è acceso."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Il Nodo sta in fondo a una conca delle terrazze, a un'ora di cammino
      dalla Frattura che respira, un corpo di metallo grigio mezzo affondato
      nella roccia che per i Raschiatori è stato un sasso fra i sassi. Da
      quando la Frattura ha smesso di sussultare, sul fianco sud salgono
      linee di luce fredda, mentre il lato dell'ingresso resta spento.
      Dentro, i corridoi scendono verso il fondo della conca, e più si va giù
      più le linee si fanno fitte.

storylet:
  # ------------------------------------------------------------ l'ingresso, alle terrazze di basalto
  - id: nodo-la-luce-nella-conca
    presso: terrazze-di-basalto
    immagine: ambientazione/rovine-dei-precursori
    titolo: La luce nella conca
    sommario: "In fondo a una conca delle terrazze il blocco di metallo dove i Raschiatori si fermavano a mangiare adesso è acceso."
    luogo: Superficie Fratturata, l'orlo dell'ultima terrazza
    area: superficie-fratturata
    ripetibile: true
    requisiti: [frattura.respiro >= 4]
    testo: |
      Dall'orlo dell'ultima terrazza la roccia scende in una conca, e in
      fondo c'è il Nodo, il blocco di metallo grigio dove le squadre dei
      Raschiatori si fermavano a mangiare all'ombra. Adesso sul fianco sud
      corrono linee di luce azzurra che salgono dalla roccia e ripartono dal
      basso, e sul lato rimasto spento si apre una fessura scura alta quanto
      un uomo.

      {percezione Media fallita} Provi a contare le linee e alla nona perdi
      il conto, e alla terza volta decidi che è una cosa da guardare e
      basta.
    opzioni:
      - testo: "Scendere fino al Nodo"
        descrizione: "Il fianco della conca è ripido ma ha buoni appigli, e dentro non è sceso nessuno."
        quando: [nodo-precursori.attivato == 0]
        esito:
          titolo: La fessura
          testo: |
            Scendi tenendoti alle sporgenze del basalto, e a dieci passi dal Nodo
            il vento smette del tutto, tanto che senti soltanto i tuoi stivali
            sulla ghiaia. La fessura dal lato spento è larga quanto le tue spalle,
            e dentro è buio.
          vai: nodo-dei-precursori
      - testo: "Tornare al Nodo"
        descrizione: "La strada la conosci, e il Nodo, a quanto pare, conosce te."
        quando: [nodo-precursori.attivato >= 1]
        esito:
          titolo: La linea che scende
          testo: |
            Scendi nella conca per la strada dell'altra volta, e ai piedi del Nodo
            una linea si stacca dalla sequenza e corre giù fino all'altezza della
            tua testa, accesa finché non sei entrato. *Mi ha riconosciuto, come il
            cane di un vicino.* Ti passi il pollice sul dorso della mano, dove il
            dispositivo ti ha misurato.
          vai: nodo-dei-precursori

  # ------------------------------------------------------------ 0 · la soglia (37)
  - id: nodo-la-soglia-spenta
    immagine: ambientazione/rovine-dei-precursori
    titolo: La soglia spenta
    sommario: "Dal lato dell'ingresso il Nodo è ancora una rovina spenta di superfici lisce e silenziose."
    luogo: Nodo dei Precursori, il vestibolo
    area: nodo-dei-precursori
    ripetibile: true
    requisiti: [profondita.nodo-dei-precursori == 0]
    testo: |
      Oltre la fessura comincia un vestibolo di metallo grigio, con le pareti
      piegate in angoli troppo esatti per essere stati tagliati a mano. Qui
      il Nodo è spento e l'aria è ferma. Sul pavimento un Raschiatore ha
      scritto col gesso *vuoto, niente da prendere*, e il vestibolo finisce
      contro una parete liscia senza porte né maniglie.

      {conoscenze-della-strada Facile} Fra Raschiatori *vuoto* vuol dire che
      chi l'ha scritto si è già preso quello che poteva.
    opzioni:
      - testo: "Cercare la giuntura nella parete"
        descrizione: "Se c'è un passaggio c'è anche il punto dove si apre, e ci vogliono occhio e dita leggere."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La giuntura
          testo: |
            Passi i polpastrelli sulla parete di fondo finché senti una linea più
            sottile di un capello, e quando ci premi il pollice la parete si apre
            in due senza un suono su una galleria che scende. Sul bordo è
            incastrata una scheggia di metallo, che ti viene via al primo
            strattone.
          effetti: { profondita.nodo-dei-precursori: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il bordo
          testo: |
            La giuntura la trovi con il polpastrello dell'indice, che ci scivola
            contro e si apre fino all'unghia su un bordo più affilato di un
            rasoio. Il dolore arriva quando il sangue è già gocciolato sul gesso,
            proprio sulla parola *vuoto*, e la parete è ancora chiusa.
          effetti: { ferite: 0.5 }
      - testo: "Arrampicarti fino alla feritoia in alto"
        descrizione: "In cima alla parete c'è una fessura dove passa un braccio, e ci si sale per tirare."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La leva
          testo: |
            Sali puntando gli stivali negli angoli della parete, infili
            l'avambraccio nella feritoia e tiri, e sotto di te la parete di fondo
            si apre in due mentre resti appeso per una mano come un salame in
            dispensa. Ti lasci cadere e atterri in piedi, con un'eleganza che non
            vedrà nessuno.
          effetti: { profondita.nodo-dei-precursori: 1 }
        fallimento:
          titolo: Gli angoli lisci
          testo: |
            A metà parete lo stivale scivola sull'angolo e scendi di colpo
            battendo il mento. Il rumore rimbalza nel vestibolo molto più a lungo
            del dovuto, e con la lingua fai il giro dei denti, che per fortuna ci
            sono ancora tutti.
          effetti: { ferite: 1 }
      - testo: "Aspettare che la parete si apra da sola"
        descrizione: "Adesso che il Nodo è sveglio qualcosa dovrà pure uscire di qui."
        costo: 2
        esito:
          titolo: L'attesa
          testo: |
            Ti siedi contro la parete di fondo e aspetti finché ti si addormentano
            i piedi. Alla fine la parete si apre dietro la tua schiena e cadi
            lungo disteso in una galleria in discesa, mentre una sfera di metallo
            grande come un pugno ti passa sopra la faccia ed esce verso le
            terrazze.
          effetti: { profondita.nodo-dei-precursori: 1 }

  # ------------------------------------------------------------ 1 · la galleria esterna (25, 12)
  - id: nodo-il-macchinario-in-attesa
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il macchinario in attesa
    sommario: "A metà della galleria affiora dal pavimento una macchina dei Precursori intatta, spenta da poco."
    luogo: Nodo dei Precursori, la galleria esterna
    area: nodo-dei-precursori
    ripetibile: true
    requisiti: [profondita.nodo-dei-precursori == 1]
    testo: |
      A metà della galleria il pavimento si apre su una macchina che ci
      affonda per metà, fatta di blocchi di metallo incastrati, ognuno con
      una faccia in più di quanto l'occhio si aspetti. Sul blocco più grande
      c'è un pannello liscio con sei incavi in fila della misura di un
      polpastrello, e sulla macchina non c'è la polvere che copre il resto
      della galleria.

      {tecnologia Difficile} Sei incavi, e una mano ha cinque dita, quindi
      chi l'ha costruita ne aveva una in più, oppure voleva due mani.
    opzioni:
      - testo: "Studiare come sono incastrati i blocchi"
        descrizione: "I blocchi si incastrano secondo una regola, e capirla vuol dire capire dove guardare."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: La regola dei blocchi
          testo: |
            Giri intorno alla macchina contando le facce, e capisci che ogni
            blocco ne ha una in più di quello su cui poggia. L'ultimo, in cima, ne
            ha una in meno, e al suo posto c'è una placca incisa che si stacca con
            la punta del coltello.
          effetti: { profondita.nodo-dei-precursori: 1, reliquie.frammento-inciso: 1 }
          pe: { accademiche: 5 }
        fallimento:
          titolo: Le facce
          testo: |
            Conti le facce dei blocchi una volta e poi un'altra, e ogni volta il
            numero è diverso, finché arrivi a un numero che non sai pronunciare.
            Ti siedi sul pavimento con le tempie che pulsano e aspetti che la
            galleria smetta di piegarsi ai bordi dello sguardo.
          effetti: { tormento: 1 }
      - testo: "Premere gli incavi del pannello"
        descrizione: "Se la macchina fa qualcosa, non è detto che ti piaccia."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: Il cassetto
          testo: |
            Appoggi negli incavi le cinque dita della destra e il pollice della
            sinistra, e il pannello si scalda come una stretta di mano. Il blocco
            gira di un quarto e dal fianco esce un cassetto con un guscio
            sigillato e un nucleo opaco, che rientra appena li hai presi.
          effetti: { profondita.nodo-dei-precursori: 1, reperto.sigillato: 1, parte.nucleo-1: 1 }
        fallimento:
          titolo: La scarica
          testo: |
            Premi gli incavi uno alla volta, e al quinto il pannello ti
            restituisce una scarica che ti sale fino alla spalla e ti chiude la
            mano a pugno. Ti restano un sapore di ferro in bocca e una macchia
            grigia sul dorso della mano che non va via a sfregarla.
          effetti: { ferite: 0.5, contaminazione: 1.5 }
      - testo: "Passarle accanto rasente il muro"
        descrizione: "Senza toccarla, anche se la macchina occupa quasi tutto il passaggio."
        costo: 2
        esito:
          titolo: Rasente il muro
          testo: |
            Passi di fianco fra la macchina e la parete, con la pancia in dentro e
            le braccia alzate, fermandoti ogni volta che la manica sfiora il
            metallo. Dall'altra parte ti sbatti la camicia come se la macchina ti
            avesse sporcato.
          effetti: { profondita.nodo-dei-precursori: 1 }

  - id: nodo-la-sfera-fra-i-detriti
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sfera fra i detriti
    sommario: "Fra i detriti c'è una sfera liscia grande quanto una testa, e quando ti avvicini una linea si accende."
    luogo: Nodo dei Precursori, la galleria esterna
    area: nodo-dei-precursori
    ripetibile: true
    requisiti: [profondita.nodo-dei-precursori == 1]
    testo: |
      In un tratto della galleria il soffitto ha ceduto, e il pavimento è
      coperto di detriti di metallo e di pietre fuse in grumi di vetro nero.
      In mezzo c'è una sfera grande quanto una testa, attraversata da linee
      sottili, e accanto un guanto da scavo con dentro un biglietto
      illeggibile. Quando fai un passo verso la sfera una linea si accende e
      si spegne, come una palpebra che trema nel sonno.

      {furtivita Media} La linea si è accesa al rumore del passo, e il vetro
      nero scricchiola sotto la suola.
    opzioni:
      - testo: "Toccarla"
        descrizione: "Si è accesa da sola quando ti sei avvicinato, e con una mano sopra potrebbe svegliarsi del tutto."
        prova: { attributo: mentale, abilita: [tecnologia, resilienza], difficolta: Media }
        successo:
          titolo: La sfera che segue
          testo: |
            Appoggi il palmo sulla sfera e le linee si accendono tutte insieme. La sfera si solleva senza un suono e ti segue
            a due passi di distanza, illuminandoti gli stivali per tutta la discesa con la discrezione di un cameriere di
            buona casa, finché alla biforcazione torna verso i detriti.
          effetti: { profondita.nodo-dei-precursori: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: La linea bianca
          testo: |
            Appoggi il palmo sulla sfera e una sola linea si accende sotto le
            dita, così calda che senti l'odore della pelle bruciata prima del
            dolore. Sul palmo ti resta un segno sottile e dritto, con la pelle
            grigia intorno.

            {medicina Media} Una bruciatura vera fa le vesciche e diventa rossa, e
            questa resta piatta e grigia.
          effetti: { ferite: 0.5, contaminazione: 1 }
      - testo: "Studiarla senza toccarla"
        descrizione: "Le linee hanno un ordine, e per guardarle da vicino basta un po' di pazienza."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Facile }
        successo:
          titolo: Il disegno delle linee
          testo: |
            Ti accovacci accanto alla sfera e segui le linee con gli occhi. Il
            disegno si ripete sei volte, e in ogni ripetizione c'è un punto più
            scuro, consumato dall'uso come la maniglia di una porta, che ti dice
            dove mettere le dita la prossima volta.
          effetti: { profondita.nodo-dei-precursori: 1 }
          pe: { tecnologia: 10 }
        fallimento:
          titolo: Dietro le palpebre
          testo: |
            Segui le linee finché non cominciano a muoversi per conto loro, anche
            sul nero dietro le palpebre. Ti rimetti in piedi barcollando, e per
            un'ora buona eviti di guardare le crepe del soffitto.
          effetti: { tormento: 1 }
      - testo: "Staccarla dai detriti e portarla via"
        descrizione: "È incastrata nella pietra fusa e pesa, ma Oda Krell saprebbe che cosa farne."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: Il guscio di dentro
          testo: |
            Fai leva con il coltello nella pietra fusa finché la sfera si stacca,
            e mentre la giri si apre lungo una linea su un guscio di metallo scuro
            e pesante, che viene via con un clic. Lasci la sfera aperta fra i
            detriti e ti carichi il guscio sulla spalla.
          effetti: { profondita.nodo-dei-precursori: 1, parte.involucro-2: 1 }
        fallimento:
          titolo: Il vetro nero
          testo: |
            Tiri la sfera con tutte e due le mani, e la pietra fusa si spezza in
            schegge di vetro nero che ti finiscono nei palmi, mentre la sfera
            resta dov'era. Una linea si accende e si spegne, e ti viene il
            sospetto irragionevole che ti stia prendendo in giro.
          effetti: { ferite: 1 }

  # ------------------------------------------------------------ 2 · l'interno (41; 44 anche a 3)
  - id: nodo-lo-sciame
    immagine: bestiario/salvaguardia-precursori
    titolo: Lo sciame
    sommario: "Dalle crepe di una sala bassa escono a decine sfere ronzanti che sentono il passo."
    luogo: Nodo dei Precursori, la sala delle crepe
    area: nodo-dei-precursori
    ripetibile: true
    requisiti: [profondita.nodo-dei-precursori == 2]
    testo: |
      Dalle crepe del pavimento di una sala bassa escono sfere grandi poco più
      di un pugno, che restano sospese con un ronzio leggero e si girano tutte
      verso di te quando sposti il peso. Oltre lo sciame c'è l'apertura che
      scende, e a metà strada uno stivale da Raschiatore rimasto lì, con i
      lacci ancora annodati.

      {tecnologia Difficile} Si sono girate quando hai spostato il peso e non
      quando hai respirato, quindi qualunque cosa le avverta passa dai piedi.

      {origine apprendista-raschiatore} Cerchi sul gambale un nome inciso, per
      accendergli una lanterna sul Ponte dei Morti.
    opzioni:
      - testo: "Attraversare piano, un passo alla volta"
        descrizione: "Movimenti lenti e controllati, perché lo sciame si gira verso ogni cosa che si muove in fretta."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Al passo delle crepe
          testo: |
            Sposti un piede alla volta contando fino a dieci fra un passo e
            l'altro, mentre le sfere ti passano così vicino che senti l'aria
            muoversi. A metà sala ti chini sullo stivale e ci trovi due schegge
            precuriane che il proprietario non tornerà a prendere.
          effetti: { profondita.nodo-dei-precursori: 1, reliquie.scheggia: 2 }
        fallimento:
          titolo: Il ginocchio
          testo: |
            A metà sala il ginocchio ti cede di un dito, e le sfere ti arrivano
            addosso tutte insieme come sassi di fionda. Torni indietro di corsa
            con le braccia sopra la testa, e sull'imbocco rientrano nelle crepe
            una dopo l'altra, con un ordine da processione.
          effetti: { ferite: 1 }
      - testo: "Studiare che cosa le fa girare"
        descrizione: "Si girano tutte insieme, e capire che cosa le avverte costa tempo e nervi."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il pavimento
          testo: |
            Guardi lo sciame a lungo dall'imbocco, e capisci che le sfere sentono
            il pavimento quando un piede ci preme sopra. Cammini allora sulle
            crepe, dove il pavimento è già rotto e non trasmette niente, e in una
            trovi un guscio sigillato perso da chissà quale sfera.
          effetti: { profondita.nodo-dei-precursori: 1, reperto.sigillato: 1 }
          pe: { percezione: 10 }
        fallimento:
          titolo: Il prurito
          testo: |
            Resti immobile tanto a lungo che ti viene un prurito sulla caviglia, e
            quando ti gratti con l'altro piede lo sciame ti è addosso. Ti ritiri
            nella galleria con un taglio sullo zigomo, e la caviglia,
            naturalmente, adesso non prude più.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Farti strada fra le sfere"
        descrizione: "Sono piccole e si spaccano, ma arrivano tutte insieme."
        combattimento: sciame-di-droni-ciechi
        vittoria:
          titolo: Il pavimento di gusci
          testo: |
            Ne prendi una al volo e la sbatti contro il muro, e le altre ti
            vengono addosso. Colpisci alla cieca con un braccio sopra la testa
            finché il pavimento è coperto di gusci aperti che scricchiolano come
            noci, e in uno trovi un nucleo opaco.
          effetti: { profondita.nodo-dei-precursori: 1, parte.nucleo-1: 1, reliquie.scheggia: 1 }
        sconfitta:
          titolo: Per ogni sfera, due
          testo: |
            Per ogni sfera che spacchi ne escono due dalle crepe, e alla fine ti
            ritiri nella galleria con le mani sopra la testa e il sangue che ti
            scende in un occhio. Lo sciame resta sull'imbocco a ronzare finché non
            smetti di muoverti anche tu.
          effetti: { contaminazione: 1 }
      - testo: "Restare fermo e lasciarti guardare"
        descrizione: "L'Osservatore senza volto ti ha segnato, e le macchine dei Precursori, dicono, se ne accorgono."
        quando: [osservatore.marchio == 1]
        esito:
          titolo: Riconosciuto
          testo: |
            Resti fermo con le braccia lungo i fianchi, e una sfera ti passa una
            luce verde sulla fronte mentre il segno dell'Osservatore ti formicola
            sotto la pelle. Poi lo sciame si apre in un corridoio largo quanto le
            tue spalle, e la sfera ti lascia cadere ai piedi una placca incisa.
          effetti: { profondita.nodo-dei-precursori: 1, reliquie.frammento-inciso: 1 }
      - testo: "Far rotolare qualche moneta sul pavimento"
        descrizione: "Lo sciame si gira verso ogni cosa che tocca il pavimento, e una moneta che rotola lo tocca a lungo."
        requisiti: [monete >= 3]
        esito:
          titolo: La moneta che gira
          testo: |
            Fai rotolare qualche moneta verso il lato sinistro della sala, e lo
            sciame le segue fino alla crepa dove l'ultima cade. Tu intanto
            attraversi rasente il muro di destra e nello stivale del Raschiatore
            trovi una scheggia precuriana, mentre le sfere aspettano ancora sopra
            la crepa che la moneta si muova.
          effetti: { profondita.nodo-dei-precursori: 1, monete: -3, reliquie.scheggia: 1 }


  - id: nodo-l-aria-storta
    immagine: ambientazione/cristalli-conduttori
    titolo: L'aria storta
    sommario: "In un corridoio del Nodo l'aria si piega senza scaldare, e chi ci passa attraverso vede un'altra cosa."
    luogo: Nodo dei Precursori, un corridoio interno
    area: nodo-dei-precursori
    ripetibile: true
    requisiti: [profondita.nodo-dei-precursori >= 2, profondita.nodo-dei-precursori <= 3]
    testo: |
      A metà del corridoio l'aria fredda davanti a te si deforma come sopra
      una pietra al sole d'agosto, e la manica che ci infili sembra più lunga
      di quanto sia. Prima del punto storto ci sono tre sassi in fila, il
      segno con cui i Raschiatori dicono di fermarsi, e dopo i tre ce n'è un
      quarto, più piccolo, messo da un'altra mano.

      {magia Media} Qui il Mana si piega su se stesso come una pagina girata
      male.

      {origine apprendista-raschiatore} Nel codice dei sassi, che hai imparato
      prima dei nodi della corda, un quarto sasso non c'è.
    opzioni:
      - testo: "Passarci attraverso"
        descrizione: "Chi ci passa vede qualcosa, e quello che ti resta addosso dipende dalla testa che hai."
        prova: { attributo: mentale, abilita: [resilienza, magia], difficolta: Media }
        successo:
          titolo: Com'era
          testo: |
            Fai un passo dentro l'aria storta e il corridoio cambia, con le pareti
            lucide attraversate da linee fitte come la trama di una stoffa e in
            fondo una fila di sfere che scivola in ordine verso il basso. Al
            secondo passo torna tutto grigio, e ti resta in bocca un sapore di
            metallo.
          effetti: { profondita.nodo-dei-precursori: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il secondo passo
          testo: |
            Il corridoio lucido ti si apre davanti per un battito, ma il secondo
            passo non arriva, e quando ti tiri indietro hai le dita intorpidite e
            un dolore sordo dietro gli occhi. La parte che ti preoccupa è che lo
            rimpiangi.
          effetti: { contaminazione: 1.5, tormento: 1 }
      - testo: "Usare quello che si vede per trovare la strada"
        descrizione: "Se di là il corridoio è intero si vedono anche le porte di allora, per chi guarda in fretta."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Difficile }
        successo:
          titolo: La porta di allora
          testo: |
            Infili la testa nell'aria storta e la ritiri subito, più volte, come
            un bambino che spia da una porta socchiusa, finché noti nella parete
            di sinistra una porta che nel corridoio spento non c'è. Lì trovi una
            giuntura, e dietro una nicchia con una camera di cristallo opaca e un
            guscio sigillato.
          effetti: { profondita.nodo-dei-precursori: 1, parte.camera-1: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: Il muro di adesso
          testo: |
            Vedi la porta per un battito nella parete di sinistra e ci vai
            incontro senza aspettare il battito dopo, e di qua dall'aria storta il
            muro ti prende in piena faccia. Ti rialzi con il naso che sanguina
            davanti a una parete liscia e intera.
          effetti: { ferite: 1 }
      - testo: "Girarle intorno, rasente il muro"
        descrizione: "Il punto storto non occupa tutto il corridoio, e contro la parete resta una spanna d'aria dritta."
        costo: 2
        esito:
          titolo: Una spanna d'aria
          testo: |
            Ti appiattisci contro la parete e avanzi di lato con la guancia sul
            metallo freddo e l'aria storta a un palmo dal naso, e a metà strada la
            spalla destra ti formicola. In fondo aggiungi un quinto sasso alla
            fila, senza sapere bene perché, e chi verrà dopo avrà un enigma in
            più.
          effetti: { profondita.nodo-dei-precursori: 1 }

  # ------------------------------------------------------------ 3 · il pozzo delle linee
  - id: nodo-il-pozzo-delle-linee
    immagine: ambientazione/cristalli-conduttori
    titolo: Il pozzo delle linee
    sommario: "Una rampa senza parapetto scende intorno a un pozzo verso il fondo del Nodo, dove corrono tutte le linee."
    luogo: Nodo dei Precursori, il pozzo
    area: nodo-dei-precursori
    ripetibile: true
    requisiti: [profondita.nodo-dei-precursori == 3]
    testo: |
      Il corridoio finisce sull'orlo di un pozzo largo quanto un'aia, con
      intorno una rampa senza parapetto. Le linee di luce si raccolgono sul
      fondo in un chiarore azzurro che pulsa piano. A un dente della parete è
      legata una corda da Raschiatore con un nodo ogni braccio, e il
      cartellino di latta dice *quarantadue*, mentre sporgendoti ne conti
      quarantuno.

      {origine allievo-di-torvessa} I cristalli del banco dell'Accademia, il
      giorno del Festival, si ripetevano con la stessa pazienza.

      {conoscenze-della-strada Media} Un Raschiatore che scrive un numero e ne
      lega uno di meno di solito ha tagliato l'ultimo pezzo per tenerselo.
    opzioni:
      - testo: "Seguire la sequenza delle linee"
        descrizione: "Le linee scendono in un ordine preciso, e sulla rampa conviene sapere dove portano."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Tre brevi e una lunga
          testo: |
            Guardi le linee finché ne prendi il ritmo di tre brevi e una lunga, e
            la lunga corre sempre sul tratto di rampa dove il metallo regge. A
            metà discesa, in una nicchia dove la sequenza si ferma, trovi una
            placca incisa appoggiata come un piattino lasciato per l'ospite.
          effetti: { profondita.nodo-dei-precursori: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il tratto liscio
          testo: |
            Ti fidi troppo presto della sequenza, e il tratto di rampa dove metti
            il piede è liscio come ghiaccio. Scivoli fino alla spira di sotto
            battendo il fianco sull'orlo, e quando ti sei tirato su a forza di
            unghie il fianco ti fa male a ogni passo.
          effetti: { ferite: 1 }
      - testo: "Calarti con la corda dei Raschiatori"
        descrizione: "Un nodo ogni braccio su una corda vecchia, e dritto giù si fa prima, se regge."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Quarantuno nodi
          testo: |
            Ti cali nodo dopo nodo, contandoli per tenere la testa occupata, con
            la rampa che ti passa davanti a ogni spira. Al quarantunesimo la corda
            finisce tagliata netta, a un'altezza da cui si salta, e dove atterri
            raccogli una scheggia lucida persa forse il giorno che qualcuno ha
            tagliato la corda.
          effetti: { profondita.nodo-dei-precursori: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: La corda vecchia
          testo: |
            A metà discesa la corda comincia a sfilacciarsi sotto le tue mani, e risali più in
            fretta di quanto sei sceso, con le fibre che saltano una dopo l'altra. Arrivi
            sull'orlo con i palmi scorticati e resti disteso finché le mani non smettono di
            tremare.
          effetti: { ferite: 0.5 }
      - testo: "Scendere la rampa per intero"
        descrizione: "Giro dopo giro, rasente la parete, con il vuoto sempre dalla stessa parte."
        costo: 2
        esito:
          titolo: Giro dopo giro
          testo: |
            Scendi la rampa con la spalla contro la parete e il vuoto a destra, e dopo il
            decimo giro smetti di contarli. Arrivi in fondo con le ginocchia che tremano e
            la sensazione di essere sceso più in basso di quanto sia profonda la conca.
          effetti: { profondita.nodo-dei-precursori: 1 }

  # ------------------------------------------------------------ il cuore (50) · si rifà a ogni spedizione
  - id: nodo-il-dispositivo
    immagine: ambientazione/cristalli-conduttori
    titolo: Il dispositivo
    sommario: "In fondo al pozzo c'è la macchina che ha acceso il Nodo, e in una nicchia aspetta un custode con quattro braccia."
    luogo: Nodo dei Precursori, il fondo del pozzo
    area: nodo-dei-precursori
    requisiti: [profondita.nodo-dei-precursori >= 4]
    testo: |
      In fondo al Nodo c'è una sala rotonda, aperta in alto sul pozzo. Al
      centro, piantato nel pavimento, c'è un blocco di metallo liscio alto
      quanto due uomini, con le facce attraversate da linee che si accendono
      lente dal basso verso l'alto e da lì corrono sulle pareti e salgono nel
      pozzo.

      Fai un passo verso il blocco e la luce cambia. *Si è accorto di me, e
      si sta preparando.* Al secondo passo le linee si spengono tutte e si
      riaccendono in un ordine diverso, raccolte sulla faccia che hai
      davanti, all'altezza del tuo petto.

      In una nicchia dietro il blocco c'è una macchina della Salvaguardia
      ripiegata su se stessa, con quattro braccia che finiscono in attrezzi e
      tengono le ginocchia come un vecchio seduto al sole. Quando le linee si
      riordinano, la sua testa liscia e senza bocca si gira di un dito verso
      di te. Davanti alla nicchia ci sono pezzi di sfere smontati e messi in
      fila per grandezza, senza un dito di spazio sbagliato.

      {origine fuggiasco-di-ghoran} A Ghoran, prima della bilancia, vi
      mettevano in fila così, e cerchi senza volerlo il posto dove saresti
      finito tu.

      {galateo Difficile} Davanti a chi mette in ordine si tengono le mani in
      vista, come davanti a un magistrato.
    opzioni:
      - testo: "Mettere le mani sulle linee"
        descrizione: "La faccia accesa è all'altezza delle tue mani, e attivarlo vuol dire lasciargli fare quello per cui l'hanno costruito."
        quando: [nodo-precursori.attivato == 0, oggetto.arma-a-impulsi == 0]
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: La mappa sotto la Superficie
          testo: |
            Appoggi i palmi sulla faccia accesa e dal blocco sale una mappa, con
            Qir-Azel aggrappata alla Cicatrice e, sotto la Superficie, decine di
            punti accesi. Uno è il Nodo, e uno più a sud deve essere Vhar'Ul. Poi
            un raggio ti misura la mano e accanto al Nodo si accende un punto
            nuovo. Il blocco si apre su un tubo di metallo dall'impugnatura troppo
            lunga e una camera di cristallo.
          imposta: { nodo-precursori.attivato: 1 }
          effetti: { oggetto.arma-a-impulsi: 1, parte.camera-3: 1, informazioni.segreto: 1, racconto: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il freddo nei gomiti
          testo: |
            Le linee ti salgono su per i polsi troppo in fretta e ai gomiti
            diventano un freddo che fa male. Stacchi le mani tirando con tutto il
            corpo mentre il custode apre due braccia, e sulle terrazze ti accorgi
            che sotto la pelle degli avambracci ti è rimasta una trama grigia.

            {medicina Media} La trama segue le vene, e ti consigli con fermezza di
            non provare a raschiarla.
          effetti: { ferite: 1, contaminazione: 1.5 }
          vai: superficie-fratturata
      - testo: "Rimettere le mani sulle linee"
        descrizione: "Il dispositivo ti ha già misurato, e se si ricorda di te è più facile, ma nel vano ci sarà meno."
        quando: [nodo-precursori.attivato >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: Il tuo punto sulla mappa
          testo: |
            La mappa si apre più in fretta della prima volta, con il tuo punto
            accanto al Nodo e intorno altri nuovi, e ti fa un piacere stupido,
            come trovare il proprio nome su un registro. Il vano si apre da solo
            su un guscio sigillato e una camera di cristallo, e li prendi senza
            che il custode alzi la testa.
          effetti: { parte.camera-2: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La trama grigia
          testo: |
            Questa volta la mappa non si apre, e le linee ti salgono su per i
            polsi come la prima volta che le hai toccate. Stacchi le mani mentre
            il custode apre due braccia, e risali il pozzo con gli avambracci
            rigidi e una trama grigia sotto la pelle che ci mette giorni a
            sbiadire.
          effetti: { ferite: 0.5, contaminazione: 1.5 }
          vai: superficie-fratturata
      - testo: "Studiarlo da lontano"
        descrizione: "Le linee si riordinano quando ti avvicini, e guardare come lo fanno da lontano è più sicuro."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le varianti
          testo: |
            Ti siedi fuori dal punto dove le linee cominciano a riordinarsi e le
            guardi per ore, finché trovi la regola delle varianti e te la scrivi
            sul polsino con il carbone. Quando ti alzi prendi il guscio più
            piccolo in fondo alla fila, e il custode ti lascia fare.
          effetti: { reperto.sigillato: 1, informazioni.pettegolezzo: 1 }
          pe: { tecnologia: 10 }
          vai: superficie-fratturata
        fallimento:
          titolo: Troppo vicino
          testo: |
            Guardi le sequenze finché ti restano negli occhi anche da chiusi, e ti
            accorgi di esserti avvicinato senza volerlo. Le linee si riordinano
            verso di te e il custode si alza, molto più alto di quanto prometteva,
            e te ne vai camminando all'indietro fino alla rampa.
          effetti: { tormento: 1.5, ferite: 0.5 }
          vai: superficie-fratturata
      - testo: "Affrontare il custode"
        descrizione: "Si sveglia se tocchi la sua fila di pezzi, e ha quattro braccia e una sfera che gli gira intorno."
        combattimento: custode-del-nodo
        vittoria:
          titolo: Le quattro braccia
          testo: |
            Butti per terra un pezzo della fila, e il custode si dispiega dalla
            nicchia con colpi precisi, che cercano di rimetterti a posto.

            {rissa Media} Le braccia di sotto colpiscono sempre dopo quelle di
            sopra, e in mezzo c'è mezzo battito.

            Cade con il rumore di una dispensa che crolla, e risali con un guscio
            sigillato e un'impugnatura fatta per una mano che non esiste più.
          effetti: { parte.impugnatura-2: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Rimesso a posto
          testo: |
            Il custode ti solleva con due braccia e con le altre due ti raddrizza
            il collo e ti sistema il braccio lungo il fianco, come un attrezzo
            rimesso sullo scaffale. Risali con il braccio che non risponde e la
            sfera che ti accompagna educata fino all'orlo.
          effetti: { contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Andartene"
        descrizione: "Il dispositivo resterà acceso anche senza di te, e il custode per ora non si è mosso."
        costo: 0
        esito:
          titolo: La rampa
          testo: |
            Guardi le linee riordinarsi ancora una volta e riprendi la rampa. A
            metà salita la luce è già tornata a salire dal basso verso l'alto come
            se tu non fossi mai passato, e sulle terrazze esci con le tasche
            vuote.
          vai: superficie-fratturata
      - testo: "Porgergli un pezzo per la sua fila"
        descrizione: "Il custode mette in ordine i pezzi per grandezza, e se gliene porti uno nel modo sbagliato corregge te."
        requisiti: [reliquie.scheggia >= 1]
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Difficile }
        successo:
          titolo: Al suo posto
          testo: |
            Ti fermi davanti alla nicchia alla distanza che si tiene davanti a un
            magistrato, con le mani in vista, e posi la scheggia nella fila fra
            due pezzi che la stringono appena. Il custode la sposta di un dito.
            Dopo un tempo lungo apre un vano nel petto e ti posa davanti agli
            stivali due gusci sigillati e una placca incisa in ordine di
            grandezza.
          effetti: { reliquie.scheggia: -1, reperto.sigillato: 2, reliquie.frammento-inciso: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Fuori posto
          testo: |
            Posi la scheggia nel punto sbagliato, e il custode si dispiega dalla
            nicchia, la rimette dove andava e poi rimette a posto anche te,
            raddrizzandoti la schiena finché non scricchiola. Risali con il collo
            rigido e una trama grigia sotto le unghie.
          effetti: { reliquie.scheggia: -1, ferite: 1, contaminazione: 1.5 }
          vai: superficie-fratturata
      - testo: "Contare il segnale come al banco dell'Accademia"
        descrizione: "Le linee si ripetono con la pazienza dei cristalli del banco dell'Accademia, e chi prende il tempo forse viene riconosciuto."
        quando: [origine.allievo-di-torvessa >= 1, nodo-precursori.attivato == 0, oggetto.arma-a-impulsi == 0]
        prova: { attributo: mentale, abilita: [magia, accademiche], difficolta: Difficile }
        successo:
          titolo: Le dita sul tempo
          testo: |
            Conti le linee come le note dei cristalli e appoggi i palmi al
            battito. Dal blocco sale una mappa con Qir-Azel aggrappata alla
            Cicatrice e, sotto la Superficie, decine di punti accesi, fra cui il
            Nodo e, più a sud, Vhar'Ul. Un raggio ti misura la mano, e il vano che
            si apre contiene un tubo dall'impugnatura troppo lunga e una camera di
            cristallo. Risalendo ripeti la sequenza per Temmerin.
          imposta: { nodo-precursori.attivato: 1 }
          effetti: { oggetto.arma-a-impulsi: 1, parte.camera-3: 1, informazioni.segreto: 1, racconto: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Fuori tempo
          testo: |
            Conti, ma al momento di toccare il blocco cambia sequenza sotto le tue
            mani, come un insegnante che cambia domanda quando hai la risposta
            pronta. Le linee ti salgono gelide fino ai gomiti, e stacchi le mani
            mentre il custode apre due braccia. Sulle terrazze trovi sotto la
            pelle degli avambracci una trama grigia che segue le vene.
          effetti: { ferite: 1, contaminazione: 1.5 }
          vai: superficie-fratturata
      - testo: "Guardarlo dalla rampa, come si fa con la Salvaguardia"
        descrizione: "Nelle rovine un Raschiatore guarda le macchine della Salvaguardia restando vicino alla scala, e la rampa è a pochi passi."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il primo gradino
          testo: |
            Ti siedi sul primo tratto della rampa, con un piede già sulla salita
            come ti hanno insegnato, e guardi il blocco finché trovi la regola
            delle varianti. Il custode non ti degna di uno sguardo, e prima di
            salire scendi di due passi a prendere il guscio più piccolo in fondo
            alla fila, senza voltargli le spalle.
          effetti: { reperto.sigillato: 1, informazioni.pettegolezzo: 1 }
          pe: { tecnologia: 10 }
          vai: superficie-fratturata
        fallimento:
          titolo: Un passo di troppo
          testo: |
            Dalla rampa le sequenze si vedono male, e scendi di un passo e poi di
            un altro, quello che sulle piattaforme ti avrebbe fatto sgridare. Le
            linee si riordinano verso di te e il custode si alza in piedi, e
            risali la rampa all'indietro.
          effetti: { tormento: 1.5, ferite: 0.5 }
          vai: superficie-fratturata
