# Il Nodo dei Precursori, spedizione della Superficie Fratturata. Si apre quando la Frattura che respira è
# stabilizzata del tutto (frattura.respiro 4): l'ingresso è alle terrazze di basalto. Le stanze vanno in
# ordine secondo la profondità:
# 0 la soglia spenta (37), 1 la galleria esterna (il macchinario in attesa, 25, o la sfera fra i detriti, 12),
# 2 l'interno (lo sciame, 41, o l'aria storta, 44), 3 il pozzo delle linee (stanza nuova) o l'aria storta,
# se non l'hai già passata. Il cuore è il dispositivo attivo (50), che riporta sulle terrazze in ogni ramo e
# non si chiude: la spedizione si può rifare. La prima attivazione riuscita (nodo-precursori.attivato) dà
# l'arma a impulsi e una camera rara; dopo, parti buone e reperti sigillati.
# Senza combattere: lo sciame si aggira con qualche moneta che rotola; al custode si porge una scheggia per la sua
# fila (Sociale, Difficile, la scheggia si perde comunque).
# Una stanza superata non ricompare nella stessa visita (src/motore/spedizioni.ts).
quality:
  - { id: nodo-precursori.attivato, nome: Hai acceso il dispositivo del Nodo, categoria: stato, nascosta: true, descrizione: "1 se hai attivato il dispositivo in fondo al Nodo dei Precursori, e lui ti ha misurato la mano." }

aree:
  - id: nodo-dei-precursori
    immagine: ambientazione/rovine-dei-precursori
    nome: Nodo dei Precursori
    sommario: "Un blocco di metallo dei Precursori in una conca delle terrazze, a un'ora di cammino dalla Frattura che respira. È stato spento per tutto il tempo che i Raschiatori ricordano, e adesso è acceso."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Il Nodo sta in fondo a una conca delle terrazze di basalto, a un'ora di
      cammino dalla Frattura che respira, ed è stato un sasso fra i sassi per
      tutto il tempo che i Raschiatori ricordano. È un corpo di metallo
      grigio mezzo affondato nella roccia, con gli spigoli tagliati così
      netti che il vento ci scivola sopra senza fare rumore. Le squadre di
      passaggio ci mangiavano all'ombra, e qualcuno ci ha provato a lasciare
      le iniziali con la punta del coltello, senza riuscire a fare un graffio.

      Da quando la Frattura ha smesso di sussultare, sul fianco rivolto a sud
      corrono linee di luce fredda che partono dal punto dove il metallo
      entra nella roccia e salgono a sequenze regolari fino in cima. Di notte,
      dalle terrazze, si vede la conca accendersi di un azzurro tenue, con il
      ritmo di un polso a riposo. Dal lato dell'ingresso il metallo è ancora
      grigio e spento.

      Dentro, i corridoi scendono verso il fondo della conca, e più si va giù
      più le linee si fanno fitte.

storylet:
  # ------------------------------------------------------------ l'ingresso, alle terrazze di basalto
  - id: nodo-la-luce-nella-conca
    presso: terrazze-di-basalto
    immagine: ambientazione/rovine-dei-precursori
    titolo: La luce nella conca
    sommario: "A un'ora di cammino dalla Frattura, in fondo a una conca delle terrazze, il blocco di metallo dove i Raschiatori si fermavano a mangiare adesso è acceso."
    luogo: Superficie Fratturata, l'orlo dell'ultima terrazza
    area: superficie-fratturata
    ripetibile: true
    requisiti: [frattura.respiro >= 4]
    testo: |
      Dall'orlo dell'ultima terrazza, a un'ora di cammino dalla Frattura, la
      roccia scende in una conca larga quanto la piazza di un mercato. In
      fondo alla conca c'è il Nodo, il blocco di metallo grigio dove le
      squadre dei Raschiatori si fermavano a mangiare all'ombra. Adesso sul
      fianco rivolto a sud corrono linee di luce azzurra, che salgono dalla
      roccia a sequenze regolari, si spengono in cima e ripartono dal basso.

      {percezione Media fallita} Provi a contare le linee per capire la
      sequenza e alla nona perdi il conto. Alla terza volta decidi che è una
      cosa da guardare e basta.

      Sul sasso piatto da cui si guarda la conca qualcuno ha inciso con un
      chiodo una tacca per ogni notte di guardia. Le ultime tre sono più
      profonde delle altre, e l'ultima è storta, fatta da una mano che
      tremava o che aveva soltanto freddo. *La Frattura si è calmata, e qui
      sotto si è svegliato lui.* In basso, sul lato dove il metallo è
      rimasto spento, si apre una fessura scura alta quanto un uomo.

      {atletica Facile} Il fianco della conca è ripido, ma il basalto ha
      spigoli buoni per le mani. Le gambe hanno già scelto da dove scendere,
      e aspettano soltanto te.
    opzioni:
      - testo: "Scendere fino al Nodo"
        descrizione: "Il fianco della conca è ripido ma ha buoni appigli. Da quando si è acceso, dentro non è sceso nessuno."
        quando: [nodo-precursori.attivato == 0]
        esito:
          titolo: La fessura
          testo: |
            Scendi lungo il fianco della conca tenendoti alle sporgenze del
            basalto, e più ti avvicini meno senti il vento. A dieci passi dal
            Nodo smette del tutto, e d'un tratto senti soltanto i tuoi stivali
            sulla ghiaia e il respiro che ti si è fatto corto senza una
            ragione. Le linee salgono a sequenze sul fianco sud, mentre il
            lato dell'ingresso è grigio e opaco come è sempre stato. La fessura
            è larga quanto le tue spalle, e dentro è buio.
          vai: nodo-dei-precursori
      - testo: "Tornare al Nodo"
        descrizione: "La strada la conosci. E il Nodo, a quanto pare, conosce te."
        quando: [nodo-precursori.attivato >= 1]
        esito:
          titolo: La linea che scende
          testo: |
            Scendi nella conca per la strada dell'altra volta. Quando arrivi ai
            piedi del Nodo una delle linee sul fianco sud si stacca dalla
            sequenza e corre giù fino all'altezza della tua testa, e lì resta
            accesa finché non sei entrato. Le altre continuano a salire come
            prima, senza badare a te. *Mi ha riconosciuto, come il cane di un
            vicino.* Ti passi il pollice sul dorso della mano, dove il
            dispositivo ti ha misurato, e la pelle è fredda.
          vai: nodo-dei-precursori

  # ------------------------------------------------------------ 0 · la soglia (37)
  - id: nodo-la-soglia-spenta
    immagine: ambientazione/rovine-dei-precursori
    titolo: La soglia spenta
    sommario: "Dal lato dell'ingresso il Nodo è ancora una rovina spenta, fatta di superfici lisce, e dentro non si sente niente."
    luogo: Nodo dei Precursori, il vestibolo
    area: nodo-dei-precursori
    ripetibile: true
    requisiti: [profondita.nodo-dei-precursori == 0]
    testo: |
      Oltre la fessura comincia un vestibolo di metallo grigio, con le pareti
      che si piegano verso l'alto in angoli troppo esatti per essere stati
      tagliati a mano. Non ci sono saldature né chiodi, e la luce che entra
      dalla fessura ci scivola sopra senza trovare un graffio. Qui il Nodo è
      spento, e delle linee che salgono sul fianco sud, di qua dalla parete,
      non si vede traccia.

      {tecnologia Media} Nessun fabbro di Qir-Azel saprebbe piegare una
      lastra così senza lasciare il segno del martello. Chi ha fatto queste
      pareti le ha fatte nascere con quegli angoli, e ne andava fiero.

      L'aria è ferma. Fa così silenzio che senti il cuore nelle orecchie e il
      fruscio della camicia quando respiri. Sul pavimento, accanto alla
      fessura, un Raschiatore ha scritto col gesso *vuoto, niente da
      prendere*, e accanto ha lasciato il mozzicone di gesso, consumato
      finché non stava più fra le dita. Il vestibolo finisce contro una
      parete liscia dove non si vedono porte né maniglie.

      {conoscenze-della-strada Facile} Fra Raschiatori *vuoto* vuol dire che
      chi l'ha scritto si è già preso quello che poteva. Il mozzicone è per
      chi arriva dopo.
    opzioni:
      - testo: "Cercare la giuntura nella parete"
        descrizione: "Se c'è un passaggio, c'è anche il punto dove si apre. Ci vogliono occhio e dita leggere."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La giuntura
          testo: |
            Passi i polpastrelli sulla parete di fondo, un palmo alla volta,
            finché sotto le dita non senti una linea più sottile di un capello.
            Ci premi sopra il pollice e la parete si apre in due senza un suono,
            scorrendo dentro se stessa, su una galleria che scende. Sul bordo
            della giuntura è rimasta incastrata una scheggia di metallo che
            qualcuno prima di te non è riuscito a tirare via. A te viene via al
            primo strattone, e ne sei più soddisfatto di quanto la cosa
            meriterebbe.
          effetti: { profondita.nodo-dei-precursori: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il bordo
          testo: |
            La giuntura la trovi nel modo peggiore, con il polpastrello
            dell'indice che ci scivola contro. Il bordo è più affilato di un
            rasoio e ti apre il dito fino all'unghia senza che tu senta niente.
            Lo senti dopo, quando il sangue è già gocciolato sul gesso del
            Raschiatore, proprio sulla parola *vuoto*, e la parete davanti a te
            è ancora chiusa. Ti succhi il dito, con la polvere del gesso sulla
            lingua, e aspetti che smetta di pulsare.
          effetti: { ferite: 0.5 }
      - testo: "Arrampicarti fino alla feritoia in alto"
        descrizione: "In cima alla parete c'è una fessura dove passa un braccio. Ci si sale, e poi si tira."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La leva
          testo: |
            Sali puntando gli stivali negli angoli della parete, che sono lisci
            ma almeno sono tanti, e arrivi alla feritoia con le braccia che
            tremano. Ci infili l'avambraccio fino al gomito e tiri. Qualcosa
            dentro scatta, e sotto di te la parete di fondo si apre in due
            mentre tu resti appeso per una mano come un salame in dispensa. Ti
            lasci cadere, e in qualche modo atterri in piedi, con un'eleganza
            che non vedrà mai nessuno.
          effetti: { profondita.nodo-dei-precursori: 1 }
        fallimento:
          titolo: Gli angoli lisci
          testo: |
            A metà parete lo stivale scivola sull'angolo, e scendi tutto d'un
            pezzo battendo prima il ginocchio e poi il mento. Il rumore rimbalza
            nel vestibolo e va avanti molto più a lungo di quanto dovrebbe.
            Quando finalmente smette ti accorgi che stavi trattenendo il fiato,
            e che hai la bocca piena di sangue. Con la lingua fai il giro dei
            denti, e per fortuna ci sono ancora tutti.
          effetti: { ferite: 1 }
      - testo: "Aspettare che la parete si apra da sola"
        descrizione: "Prima o poi qualcosa uscirà di qui, adesso che il Nodo è sveglio. Ci vuole pazienza."
        costo: 2
        esito:
          titolo: L'attesa
          testo: |
            Ti siedi contro la parete di fondo con le ginocchia al petto e
            aspetti, mentre fuori dalla fessura la luce cambia due volte e a te
            si addormenta prima un piede e poi l'altro. Alla
            fine, senza nessun preavviso, la parete si apre in due dietro la tua
            schiena e tu cadi lungo disteso in una galleria in discesa. Una
            sfera di metallo grande come un pugno ti passa sopra la faccia ed
            esce verso le terrazze, e la parete si richiude ai tuoi piedi.
          effetti: { profondita.nodo-dei-precursori: 1 }

  # ------------------------------------------------------------ 1 · la galleria esterna (25, 12)
  - id: nodo-il-macchinario-in-attesa
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il macchinario in attesa
    sommario: "A metà della galleria affiora dal pavimento una macchina dei Precursori intatta. Sembra spenta da poco."
    luogo: Nodo dei Precursori, la galleria esterna
    area: nodo-dei-precursori
    ripetibile: true
    requisiti: [profondita.nodo-dei-precursori == 1]
    testo: |
      La galleria scende in una curva larga, e a metà curva il pavimento si
      apre su una macchina che ci affonda dentro per metà. È fatta di blocchi
      di metallo incastrati gli uni negli altri, ognuno con una faccia in più
      di quanto l'occhio si aspetti. Il metallo non ha una vite né un segno di
      ruggine. La tocchi con il dorso della mano, e il metallo ha la
      temperatura dell'aria. Sul blocco più grande c'è un pannello liscio con
      sei incavi in fila, della misura di un polpastrello.

      {tecnologia Difficile} Sei incavi, e una mano di dita ne ha cinque.
      Chi l'ha costruita ne aveva una in più, oppure voleva che ci si
      mettessero due mani.

      Sulla macchina e sul pavimento intorno non c'è polvere, mentre il resto
      della galleria ne è coperto. Ti fa pensare a un cavallo legato
      fuori da una locanda, fermo da ore, che drizza le orecchie a ogni porta
      che si apre.

      {addestrare-animali Media} Se è un cavallo, è uno che non ha mai visto
      il padrone andarsene davvero. Ti avvicineresti piano e di lato, con le
      mani bene in vista.

      {origine figlio-del-circolo} Al Circolo un animale che aspetta il
      padrone lo riconoscevi dalle orecchie, sempre girate verso la porta.
      Questa cosa le orecchie non le ha, e ti scopri a cercargliele lo stesso
      fra un blocco e l'altro.
    opzioni:
      - testo: "Studiare come sono incastrati i blocchi"
        descrizione: "Si incastrano secondo una regola. Capire la regola vuol dire capire dove guardare."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: La regola dei blocchi
          testo: |
            Giri intorno alla macchina contando le facce dei blocchi, e dopo un
            po' la regola salta fuori da sola, perché ogni blocco ha una faccia
            in più di quello su cui poggia. L'ultimo, in cima, ne ha una in
            meno, e al posto della faccia mancante c'è una placca incisa che si
            stacca con la punta del coltello. La metti via con cura, avvolta
            nel fazzoletto, come un dente da latte. Oltre la
            macchina la galleria continua a scendere.
          effetti: { profondita.nodo-dei-precursori: 1, reliquie.frammento-inciso: 1 }
          pe: { accademiche: 5 }
        fallimento:
          titolo: Le facce
          testo: |
            Conti le facce dei blocchi una volta e poi un'altra, e ogni volta il
            numero è diverso. A un certo punto ti accorgi che stai contando a
            voce alta e che sei arrivato a un numero che non sai pronunciare. Ti
            siedi sul pavimento con le tempie che pulsano, e aspetti che la
            galleria smetta di piegarsi ai bordi dello sguardo. L'indice con
            cui contavi è ancora alzato, e lo abbassi con un certo imbarazzo.
          effetti: { tormento: 0.5 }
      - testo: "Premere gli incavi del pannello"
        descrizione: "Il pannello ha sei incavi della misura di un dito. Se la macchina fa qualcosa, non è detto che ti piaccia."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: Il cassetto
          testo: |
            Appoggi negli incavi le cinque dita della mano destra e il pollice
            della sinistra, e il pannello si scalda sotto i polpastrelli,
            tiepido come una stretta di mano. Il blocco gira su se stesso di
            un quarto con un sospiro d'aria, e dal fianco esce un
            cassetto lungo quanto un avambraccio. Dentro, in un letto di polvere
            grigia, ci sono un guscio sigillato e un nucleo opaco. Li prendi, e
            il cassetto rientra prima che tu abbia tolto la mano del tutto.
          effetti: { profondita.nodo-dei-precursori: 1, reperto.sigillato: 1, parte.nucleo-1: 1 }
        fallimento:
          titolo: La scarica
          testo: |
            Premi gli incavi uno alla volta, e al quinto il pannello ti
            restituisce una scarica che ti sale fino alla spalla e ti chiude la
            mano a pugno. Il blocco gira di un quarto e torna indietro. Per un
            pezzo hai in bocca un sapore di ferro, e sul dorso della mano una
            macchia grigia che non va via a sfregarla, e che sfreghi lo
            stesso ogni volta che ci ripensi.
          effetti: { ferite: 0.5, contaminazione: 1 }
      - testo: "Passarle accanto rasente il muro"
        descrizione: "Senza toccarla. La galleria è stretta, e la macchina occupa quasi tutto il passaggio."
        costo: 2
        esito:
          titolo: Rasente il muro
          testo: |
            Ti metti di fianco e passi fra la macchina e la parete con la pancia
            in dentro e le braccia alzate, un passo laterale alla volta. Ci metti
            molto più del necessario, perché ogni volta che la manica sfiora il
            metallo ti fermi ad aspettare. Dall'altra parte la galleria si
            allarga, e ti ritrovi a sbatterti la camicia con più energia di
            quanta ne serva, come se la macchina ti avesse lasciato addosso
            della polvere che non aveva.
          effetti: { profondita.nodo-dei-precursori: 1 }

  - id: nodo-la-sfera-fra-i-detriti
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sfera fra i detriti
    sommario: "Fra pezzi di metallo e pietre fuse insieme c'è una sfera liscia grande quanto una testa. Quando ti avvicini una delle sue linee si accende."
    luogo: Nodo dei Precursori, la galleria esterna
    area: nodo-dei-precursori
    ripetibile: true
    requisiti: [profondita.nodo-dei-precursori == 1]
    testo: |
      In un tratto della galleria il soffitto ha ceduto, chissà quanto tempo
      fa, e il pavimento è coperto di detriti metallici e di pietre fuse
      insieme in grumi di vetro nero. In mezzo ai detriti c'è una sfera quasi
      perfetta, grande quanto una testa, con la superficie attraversata da
      linee sottili che si intrecciano. La sfera è immobile, e non fa nessun
      rumore.

      Quando fai un passo verso di lei una delle linee si accende appena e si
      spegne, come una palpebra che trema nel sonno. Ti fermi con il piede a
      mezz'aria, e il polpaccio comincia subito a protestare.

      {furtivita Media} La linea si è accesa al rumore del passo. Se ti
      avvicini di nuovo, metti i piedi dove non c'è vetro nero, che
      scricchiola sotto la suola.

      Accanto alla sfera, mezzo sepolto, c'è un guanto da scavo con le dita
      consumate sulla punta, e qualcuno ci ha infilato dentro un biglietto
      arrotolato che l'umido ha reso illeggibile.

      {empatia Media} Un biglietto infilato in un guanto si lascia per
      qualcuno che deve passare di qui. Ti viene da sperare che sia passato
      davvero, e che il guanto l'abbia soltanto dimenticato.
    opzioni:
      - testo: "Toccarla"
        descrizione: "Si è accesa da sola quando ti sei avvicinato. Con una mano sopra potrebbe svegliarsi del tutto."
        prova: { attributo: mentale, abilita: [tecnologia, resilienza], difficolta: Media }
        successo:
          titolo: La sfera che segue
          testo: |
            Appoggi il palmo sulla sfera. Le linee si accendono tutte insieme
            sotto la tua mano, e la sfera si solleva da terra senza un suono e
            resta a mezz'aria all'altezza del tuo petto. Quando ti muovi ti
            segue a due passi di distanza, illuminandoti gli stivali per tutta
            la discesa con la discrezione di un cameriere di buona casa. Dove la galleria si biforca si ferma, e torna verso i
            detriti soltanto dopo che hai scelto la tua strada.
          effetti: { profondita.nodo-dei-precursori: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: La linea bianca
          testo: |
            Appoggi il palmo sulla sfera, e una sola linea si accende sotto le
            tue dita. È bianca, e così calda che senti l'odore della pelle
            bruciata prima del dolore. Ritiri la mano di scatto, e la sfera
            torna spenta. Sul palmo ti resta un segno sottile e dritto, e
            intorno al segno la pelle ha preso un colore grigio che non ti
            piace per niente.

            {medicina Media} Una bruciatura vera fa le vesciche e diventa rossa.
            Questa resta piatta e grigia, ed è la cosa peggiore che potesse
            fare.
          effetti: { ferite: 0.5, contaminazione: 0.5 }
      - testo: "Studiarla senza toccarla"
        descrizione: "Le linee hanno un ordine, e per guardarle da vicino basta un po' di pazienza."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Facile }
        successo:
          titolo: Il disegno delle linee
          testo: |
            Ti accovacci accanto alla sfera e segui le linee con gli occhi,
            tenendo le mani sulle ginocchia. Si intrecciano secondo un disegno
            che si ripete sei volte, e in ogni ripetizione c'è un punto dove si
            toccano e la superficie è un poco più scura, consumata dall'uso
            come la maniglia di una porta. Quando ti alzi hai le
            gambe intorpidite, e in testa un'idea di dove mettere le dita la
            prossima volta che una di queste cose ti capita fra le mani.
          effetti: { profondita.nodo-dei-precursori: 1 }
          pe: { tecnologia: 10 }
        fallimento:
          titolo: Dietro le palpebre
          testo: |
            Segui le linee finché non cominciano a muoversi per conto loro, e
            quando sbatti le palpebre continuano a muoversi anche lì, sul nero
            dietro gli occhi. Ti rimetti in piedi barcollando, e ti ci vuole un
            pezzo prima che il pavimento della galleria torni dritto. Anche
            dopo, per un'ora buona, eviti di guardare le crepe del soffitto.
          effetti: { tormento: 0.5 }
      - testo: "Staccarla dai detriti e portarla via"
        descrizione: "È incastrata nella pietra fusa, e pesa. Oda Krell saprebbe che cosa farne."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: Il guscio di dentro
          testo: |
            Fai leva con il coltello e poi con le dita nella pietra fusa intorno
            alla sfera, finché non si stacca con un rumore di vetro rotto. Pesa
            quanto un secchio d'acqua. Mentre la giri per metterla nella
            bisaccia si apre lungo una delle linee, e dentro c'è un secondo
            guscio di metallo scuro, pesante, che viene via con un clic. Lasci
            la sfera aperta fra i detriti e ti carichi il guscio sulla spalla,
            dove comincia subito a farsi sentire.
          effetti: { profondita.nodo-dei-precursori: 1, parte.involucro-2: 1 }
        fallimento:
          titolo: Il vetro nero
          testo: |
            Tiri la sfera con tutte e due le mani, e la pietra fusa intorno si
            spezza in schegge di vetro nero che ti finiscono nei palmi. La sfera
            resta dov'era. Una linea si accende e si spegne, e ti viene il
            sospetto, del tutto irragionevole, che ti stia prendendo in giro.
            Ti siedi sui detriti e ti levi le schegge dai palmi una per una con
            la punta del coltello.
          effetti: { ferite: 1 }

  # ------------------------------------------------------------ 2 · l'interno (41; 44 anche a 3)
  - id: nodo-lo-sciame
    immagine: bestiario/salvaguardia-precursori
    titolo: Lo sciame
    sommario: "Dalle crepe di una sala bassa esce un ronzio sottile, e con il ronzio le sfere, a decine. Sentono il passo."
    luogo: Nodo dei Precursori, la sala delle crepe
    area: nodo-dei-precursori
    ripetibile: true
    requisiti: [profondita.nodo-dei-precursori == 2]
    testo: |
      La galleria sbocca in una sala bassa con il pavimento attraversato da
      crepe sottili, e dalle crepe arriva un ronzio così leggero che all'inizio
      lo scambi per il vento di fuori. Poi dalle fessure escono le sfere, una
      dopo l'altra, grandi poco più di un pugno, con le linee incise che si
      accendono e si spengono a intermittenza. Restano sospese a mezz'aria, a
      distanza uguale l'una dall'altra, e oscillano appena.

      {rissa Media} Sono piccole, e una cosa piccola che vola si spacca con
      un colpo solo. Il guaio è che di mani ne hai due, e le sfere non hai
      ancora finito di contarle.

      Sposti il peso da un piede all'altro, e tutte le sfere si girano verso
      di te nello stesso momento. Il ronzio sale di un tono. *Se resto fermo
      abbastanza, forse mi prendono per una crepa anch'io.* Oltre lo sciame
      c'è l'apertura che scende, e per terra, a metà strada, c'è uno stivale
      da Raschiatore rimasto lì da solo, con i lacci ancora annodati.

      {tecnologia Difficile} Si sono girate quando hai spostato il peso, e
      quando hai respirato no. Qualunque cosa le avverta, passa dai piedi.

      {origine apprendista-raschiatore} Gli occhi ti vanno al gambale dello
      stivale, a cercarci un nome inciso, come se dovessi dire tu a qualcuno
      quale lanterna accendere sul Ponte dei Morti. Sul cuoio non c'è
      niente, e il sollievo che provi ti fa vergognare un poco.
    opzioni:
      - testo: "Attraversare piano, un passo alla volta"
        descrizione: "Movimenti lenti e controllati. Lo sciame si gira verso ogni cosa che si muove in fretta."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Al passo delle crepe
          testo: |
            Sposti un piede alla volta, appoggiando prima il tallone e poi la
            pianta, e fra un passo e l'altro conti fino a dieci. Lo sciame ti
            gira intorno senza decidersi, con le sfere che ti passano così
            vicino alla faccia che senti l'aria muoversi. A metà sala ti chini
            sullo stivale, perché dentro ci sono due schegge precuriane e il
            proprietario non tornerà a prenderle. Esci dall'altra parte con i
            polpacci che bruciano e la camicia incollata alla schiena, e solo
            lì ti ricordi di respirare con la bocca.
          effetti: { profondita.nodo-dei-precursori: 1, reliquie.scheggia: 2 }
        fallimento:
          titolo: Il ginocchio
          testo: |
            A metà sala il ginocchio ti cede di un dito, e lo sciame te lo fa
            pagare. Le sfere ti arrivano addosso tutte insieme, sbattendo
            contro le costole come sassi tirati con la fionda, e tu torni
            indietro di corsa con le braccia sopra la testa. Sull'imbocco della
            galleria si fermano, e una dopo l'altra rientrano nelle crepe con
            un ordine da processione. Tu ti tasti le costole, contandole.
          effetti: { ferite: 1 }
      - testo: "Studiare che cosa le fa girare"
        descrizione: "Si girano tutte insieme, e qualcosa le avverte. Capirlo prima di passare costa tempo e nervi."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il pavimento
          testo: |
            Resti immobile sull'imbocco della sala e guardi lo sciame a lungo.
            Le sfere sentono il pavimento, e quando un piede ci preme sopra lo
            sentono tutte insieme. Allora cammini sulle crepe, dove il
            pavimento è già rotto e non trasmette niente, e lo sciame
            resta sospeso a fissare il punto da cui sei partito. In una crepa
            trovi un guscio sigillato, perso da chissà quale sfera, e lo
            raccogli senza staccare i piedi dalla crepa.
          effetti: { profondita.nodo-dei-precursori: 1, reperto.sigillato: 1 }
          pe: { percezione: 10 }
        fallimento:
          titolo: Il prurito
          testo: |
            Resti immobile a guardarle tanto a lungo che ti viene un prurito
            sulla caviglia, e alla fine ti gratti con l'altro piede. Lo sciame
            ti è addosso prima che tu abbia rimesso giù il tallone. Ti ritiri
            nella galleria con un taglio sullo zigomo e le sfere che ti ronzano
            dietro le orecchie, e lì aspetti che il cuore rallenti. La
            caviglia, naturalmente, adesso non prude più.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Farti strada fra le sfere"
        descrizione: "Sono piccole e si spaccano. Il guaio è che arrivano tutte insieme."
        combattimento: sciame-di-droni-ciechi
        vittoria:
          titolo: Il pavimento di gusci
          testo: |
            Ne prendi una al volo e la sbatti contro il muro, e le altre ti
            vengono addosso tutte insieme. Il resto è un lavoro lungo e
            rumoroso, con un braccio sopra la testa e l'altro che colpisce alla
            cieca. Quando l'ultima sfera cade il pavimento della sala è coperto
            di gusci aperti, che scricchiolano sotto gli stivali come gusci di
            noce. Ne frughi qualcuno prima di proseguire, con le nocche
            spellate, e in uno trovi un nucleo opaco che si stacca tirando.
          effetti: { profondita.nodo-dei-precursori: 1, parte.nucleo-1: 1, reliquie.scheggia: 1 }
        sconfitta:
          titolo: Per ogni sfera, due
          testo: |
            Le sfere ti arrivano da tutte le parti, e per ognuna che spacchi ne
            escono due dalle crepe. Alla fine ti ritiri nella galleria con le
            mani sopra la testa e il sangue che ti scende in un occhio. Lo
            sciame si ferma sull'imbocco e resta lì a ronzare, a distanza
            uguale, finché non smetti di muoverti anche tu. Ti asciughi
            l'occhio con la manica, piano, perché anche quel gesto è un
            movimento.
          effetti: { contaminazione: 0.5 }
      - testo: "Restare fermo e lasciarti guardare"
        descrizione: "L'Osservatore senza volto ti ha segnato. Le macchine dei Precursori, dicono, se ne accorgono."
        quando: [osservatore.marchio == 1]
        esito:
          titolo: Riconosciuto
          testo: |
            Resti fermo con le braccia lungo i fianchi. Una sfera si stacca
            dallo sciame e ti si ferma davanti alla faccia, e una luce verde ti
            passa sulla fronte mentre il segno dell'Osservatore ti formicola
            sotto la pelle, caldo come un livido fresco. Le linee della sfera
            si accendono tutte insieme.
            Poi lo sciame si apre in due e lascia un corridoio largo quanto le
            tue spalle, e la sfera ti lascia cadere ai piedi una placca incisa
            prima di tornare con le altre.
          effetti: { profondita.nodo-dei-precursori: 1, reliquie.frammento-inciso: 1 }
      - testo: "Far rotolare qualche moneta sul pavimento"
        descrizione: "Lo sciame si gira verso ogni cosa che tocca il pavimento. Una moneta che rotola lo tocca a lungo, e laggiù fra le crepe ci resta."
        requisiti: [monete >= 3]
        esito:
          titolo: La moneta che gira
          testo: |
            Ti chini sull'imbocco e fai rotolare una moneta di taglio verso il
            lato sinistro della sala, poi un'altra, più forte, con il piccolo
            dispiacere di chi le monete le ha sempre contate. Lo sciame si gira
            dietro alla prima e si accalca sulla seconda, che gira su se stessa a
            lungo prima di cadere in una crepa. Tu intanto attraversi sul lato
            destro, rasente il muro. A metà strada frughi nello stivale del
            Raschiatore e ci trovi una scheggia precuriana. Quando arrivi
            all'apertura che scende, le sfere sono ancora sopra la crepa, ad
            aspettare che la moneta si muova di nuovo.
          effetti: { profondita.nodo-dei-precursori: 1, monete: -3, reliquie.scheggia: 1 }


  - id: nodo-l-aria-storta
    immagine: ambientazione/cristalli-conduttori
    titolo: L'aria storta
    sommario: "In un corridoio del Nodo l'aria si piega come sopra una pietra al sole, e non scalda. Chi ci passa attraverso vede un'altra cosa."
    luogo: Nodo dei Precursori, un corridoio interno
    area: nodo-dei-precursori
    ripetibile: true
    requisiti: [profondita.nodo-dei-precursori >= 2, profondita.nodo-dei-precursori <= 3]
    testo: |
      A metà del corridoio l'aria davanti a te si deforma, come sopra una
      pietra lasciata al sole d'agosto, e il fondo del corridoio ondeggia e si
      stira. Allunghi la mano, e il calore che ti aspetti non arriva. L'aria
      lì dentro ha la temperatura di tutto il resto, e la manica che ci infili
      sembra più lunga di quanto sia.

      {magia Media} Qui il Mana si piega su se stesso come una pagina girata
      male, e da sotto la piega si legge ancora quella di prima.

      Sul pavimento, appena prima del punto storto, qualcuno ha messo tre
      sassi in fila, il segno con cui i Raschiatori dicono di fermarsi. Dopo i
      tre sassi ce n'è un quarto, più piccolo, messo da un'altra mano. *Nel
      codice un quarto sasso non c'è, e allora chi l'ha messo che cosa voleva
      dire?* Il corridoio prosegue oltre, e passarci attraverso è la strada
      più corta.

      {acrobazia Media} Contro la parete l'aria sembra dritta per una spanna.
      Ci passa un corpo, se il corpo si ricorda di tenere la pancia in
      dentro per tutto il tempo.

      {origine apprendista-raschiatore} Il codice dei sassi te l'hanno fatto
      imparare prima ancora dei nodi della corda, e il quarto sasso ti dà
      fastidio come una parola sbagliata in un ritornello che sai a memoria.
      Lo sposti con la punta dello stivale, poi lo rimetti dov'era.
    opzioni:
      - testo: "Passarci attraverso"
        descrizione: "Chi ci passa vede qualcosa. Quello che ti resta addosso dopo dipende dalla testa che hai."
        prova: { attributo: mentale, abilita: [resilienza, magia], difficolta: Media }
        successo:
          titolo: Com'era
          testo: |
            Fai un passo dentro l'aria storta, e il corridoio cambia. Le pareti
            sono lucide e intere, attraversate da linee di luce fitte come la
            trama di una stoffa, e il pavimento è così pulito da specchiarti
            gli stivali. In fondo una fila di sfere scivola in ordine verso il
            basso, ciascuna con un cristallo acceso dentro. Al secondo passo
            torna tutto grigio e spento, e a te resta in bocca un sapore di
            metallo insieme alla voglia di raccontarlo a qualcuno. Ti guardi
            gli stivali, che sono di nuovo i tuoi, con il fango della conca
            ancora sulle punte.
          effetti: { profondita.nodo-dei-precursori: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il secondo passo
          testo: |
            Fai un passo dentro l'aria storta, e il corridoio intero e lucido ti
            si apre davanti per il tempo di un respiro. Il secondo passo non
            arriva. Resti fermo a metà, con un piede di qua e uno di là, e
            quando finalmente ti tiri indietro hai le dita intorpidite e un
            dolore sordo dietro gli occhi. Davanti a te il corridoio è di nuovo
            grigio, e ti scopri a rimpiangerlo lucido, che è la parte che ti
            preoccupa di più.
          effetti: { contaminazione: 1, tormento: 0.5 }
      - testo: "Usare quello che si vede per trovare la strada"
        descrizione: "Se di là il corridoio è intero, si vedono anche le porte di allora. Bisogna guardare bene e in fretta."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Difficile }
        successo:
          titolo: La porta di allora
          testo: |
            Infili la testa nell'aria storta e la ritiri subito, più volte di
            seguito, come un bambino che spia da una porta socchiusa, e ogni
            volta per un battito vedi il corridoio intero.
            Alla fine noti nella parete di sinistra una porta che nel corridoio
            spento non c'è. Tasti il muro in quel punto e trovi una giuntura, e
            dietro una nicchia dove sono rimasti una camera di cristallo opaca e
            un guscio sigillato, coperti di polvere grigia.
          effetti: { profondita.nodo-dei-precursori: 1, parte.camera-1: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: Il muro di adesso
          testo: |
            Vedi la porta per un battito, nella parete di sinistra, e ci vai
            incontro senza aspettare il battito dopo. Di qua dall'aria storta la
            porta non c'è, e il muro ti prende in piena faccia. Ti rialzi con il
            naso che sanguina davanti a una parete liscia e intera, dove della
            tua testa non è rimasto nemmeno il segno.

            {resistenza Facile} Il naso è gonfio ma dritto. Sputi, respiri con
            la bocca per un po', e le gambe reggono.
          effetti: { ferite: 1 }
      - testo: "Girarle intorno, rasente il muro"
        descrizione: "Il punto storto non occupa tutto il corridoio. Contro la parete resta una spanna d'aria dritta."
        costo: 2
        esito:
          titolo: Una spanna d'aria
          testo: |
            Ti appiattisci contro la parete e avanzi di lato, una spanna alla
            volta, con la guancia sul metallo freddo e l'aria storta che ti
            ondeggia a un palmo dal naso. A metà strada la spalla destra ti
            formicola, perché ci sei passato più vicino di quanto credevi.
            Quando arrivi in fondo aggiungi un quinto sasso alla fila, senza
            sapere bene perché, e ti sembra comunque la cosa giusta. Chi verrà
            dopo avrà un enigma in più, e tu un piccolo segreto con il quarto
            sasso.
          effetti: { profondita.nodo-dei-precursori: 1 }

  # ------------------------------------------------------------ 3 · il pozzo delle linee
  - id: nodo-il-pozzo-delle-linee
    immagine: ambientazione/cristalli-conduttori
    titolo: Il pozzo delle linee
    sommario: "Una rampa senza parapetto gira intorno a un pozzo che scende al fondo del Nodo, e tutte le linee di luce corrono verso il basso."
    luogo: Nodo dei Precursori, il pozzo
    area: nodo-dei-precursori
    ripetibile: true
    requisiti: [profondita.nodo-dei-precursori == 3]
    testo: |
      Il corridoio finisce sull'orlo di un pozzo largo quanto un'aia, e
      intorno al pozzo una rampa senza parapetto scende girando lungo la
      parete. Qui il Nodo è acceso del tutto. Le linee di luce fredda partono
      dall'alto e scendono a sequenze regolari verso il fondo, dove si
      raccolgono in un chiarore azzurro che pulsa piano. Ti accorgi di avere
      accordato il respiro al chiarore, e lo sposti apposta di mezzo tempo.

      {origine allievo-di-torvessa} Il giorno del Festival i cristalli del
      banco dell'Accademia hanno vibrato tutti insieme, con una nota breve
      che si ripeteva. Queste linee hanno lo stesso modo paziente di
      ripetersi, e i polpastrelli ti formicolano come quel giorno.

      {acrobazia Facile fallita} Ti sporgi a guardare il fondo, e le
      ginocchia decidono per conto loro che sporgersi è stata una pessima
      idea. Fai un passo indietro senza averlo chiesto.

      A un dente della parete, sull'orlo, è legata una corda da Raschiatore
      con un nodo ogni braccio, che scende dritta nel buio fra le spire della
      rampa. Qualcuno ci ha appeso un cartellino di latta con scritto
      *quarantadue*, e tu, sporgendoti, ne conti quarantuno.

      {conoscenze-della-strada Media} Un Raschiatore che scrive un numero e
      ne lega uno di meno o non sa contare, o ha tagliato l'ultimo pezzo
      per tenerselo. Li hai conosciuti tutti e due, e il secondo è più
      comune.
    opzioni:
      - testo: "Seguire la sequenza delle linee"
        descrizione: "Le linee scendono in un ordine preciso. Sulla rampa conviene sapere dove portano."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Tre brevi e una lunga
          testo: |
            Guardi le linee scendere finché non ne prendi il ritmo di tre brevi
            e una lunga. La lunga corre sempre sul tratto di rampa dove il
            metallo regge, e tu scendi tenendoti sulla linea lunga. A metà
            discesa, in una nicchia dove la sequenza si ferma, trovi una placca
            incisa appoggiata con cura di piatto, come un piattino lasciato
            per l'ospite. Arrivi in fondo con il chiarore azzurro sulla faccia
            e il ritmo delle linee che ti batte ancora nei piedi.
          effetti: { profondita.nodo-dei-precursori: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il tratto liscio
          testo: |
            Credi di aver capito la sequenza e ti fidi troppo presto. Il tratto
            di rampa su cui metti il piede è liscio come ghiaccio, e scivoli
            fino alla spira di sotto battendo il fianco sull'orlo. Ti tiri su
            aggrappato con le unghie, e quando torni in cima la sequenza è
            cambiata e il fianco ti fa male a ogni respiro. Ti siedi sull'orlo
            con la mano premuta sulle costole, aspettando che il pozzo smetta
            di girare.
          effetti: { ferite: 1 }
      - testo: "Calarti con la corda dei Raschiatori"
        descrizione: "Un nodo ogni braccio, e la corda è vecchia. Dritto giù si fa prima, se regge."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Quarantuno nodi
          testo: |
            Ti cali nodo dopo nodo, con la corda che gira piano su se stessa e
            la rampa che ti passa davanti a ogni spira, e conti i nodi per
            tenere la testa occupata. Al quarantunesimo la corda finisce tagliata
            netta, e il fondo del pozzo è a un'altezza da cui si salta.
            Salti, e le ginocchia se ne lamentano. Per terra, dove atterri,
            raccogli una scheggia lucida che qualcuno ha perso proprio lì,
            forse il giorno che ha tagliato la corda.
          effetti: { profondita.nodo-dei-precursori: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: La corda vecchia
          testo: |
            A metà discesa la corda comincia a sfilacciarsi sotto le tue mani, e
            risali più in fretta di quanto sei sceso, con le fibre che saltano
            una dopo l'altra. Arrivi sull'orlo con i palmi scorticati e il
            cuore in gola, e resti lì disteso a guardare il soffitto finché
            le mani non smettono di tremare. La corda, sotto di te, adesso ha un nodo in meno.
          effetti: { ferite: 0.5 }
      - testo: "Scendere la rampa per intero"
        descrizione: "Giro dopo giro, rasente la parete. È lunga, e il vuoto sta sempre dalla stessa parte."
        costo: 2
        esito:
          titolo: Giro dopo giro
          testo: |
            Scendi la rampa giro dopo giro, con la spalla sinistra contro la
            parete e il vuoto sempre a destra, mentre le linee di luce ti
            scorrono accanto verso il basso, più svelte di te. Dopo il decimo
            giro smetti di contarli, e la spalla sinistra si è sporcata di
            una polvere grigia che non sapevi ci fosse. Arrivi in fondo con le ginocchia che
            tremano e la sensazione precisa di essere sceso molto più in basso
            di quanto sia profonda la conca.
          effetti: { profondita.nodo-dei-precursori: 1 }

  # ------------------------------------------------------------ il cuore (50) · si rifà a ogni spedizione
  - id: nodo-il-dispositivo
    immagine: ambientazione/cristalli-conduttori
    titolo: Il dispositivo
    sommario: "In fondo al pozzo c'è la macchina che ha acceso il Nodo. Le sue linee cambiano ordine quando ti avvicini, e in una nicchia una macchina con quattro braccia aspetta."
    luogo: Nodo dei Precursori, il fondo del pozzo
    area: nodo-dei-precursori
    requisiti: [profondita.nodo-dei-precursori >= 4]
    testo: |
      In fondo al Nodo c'è una sala rotonda, aperta in alto sul pozzo intorno
      a cui gira la rampa. Al centro, piantata nel pavimento, c'è la
      struttura da cui partono tutte le linee. È un blocco di metallo liscio
      alto quanto due uomini, con le facce attraversate da linee che si
      illuminano lentamente in sequenze regolari, dal basso verso l'alto, e
      da lì corrono sulle pareti e salgono nel pozzo. La luce è fredda e
      pulsa con un ritmo costante.

      Fai un passo verso il blocco, e la luce cambia intensità. Al secondo
      passo le linee si spengono tutte e si riaccendono in un ordine diverso,
      raccolte sulla faccia che hai davanti, all'altezza del tuo petto. *Si è
      accorto di me, e si sta preparando.* Tutto succede senza un rumore, e
      senti il sangue che ti batte nelle orecchie.

      {resilienza Media fallita} Il sangue nelle orecchie lo senti tu, e ti
      viene il sospetto che lo senta anche lui. Le mani ti si chiudono a
      pugno e poi si riaprono, perché non sanno cosa fare.

      In una nicchia della parete, dietro il blocco, c'è una macchina della
      Salvaguardia ripiegata su se stessa, alta in piedi due volte un uomo,
      con quattro braccia che finiscono in attrezzi e tengono le ginocchia
      come un vecchio seduto al sole. Quando le linee si riordinano la sua
      testa, una piastra liscia senza bocca, si gira di un dito verso di te.
      Per terra, davanti alla nicchia, ci sono pezzi di sfere smontati e
      messi in fila per grandezza, dal più grosso al più piccolo, senza
      un dito di spazio sbagliato.

      {origine fuggiasco-di-ghoran} A Ghoran, prima della bilancia, vi
      mettevano in fila allo stesso modo, dal più grosso al più piccolo. Ti
      accorgi di aver cercato con gli occhi il punto della fila dove saresti
      finito tu, e distogli lo sguardo.

      {galateo Difficile} Davanti a chi mette in ordine si sta come davanti
      a un magistrato, a una certa distanza, con le mani in vista. La fila
      è la sua scrivania, e sulla scrivania di un altro non si appoggia
      niente senza permesso.
    opzioni:
      - testo: "Mettere le mani sulle linee"
        descrizione: "La faccia accesa è all'altezza delle tue mani. Attivarlo vuol dire lasciargli fare quello per cui l'hanno costruito."
        quando: [nodo-precursori.attivato == 0, oggetto.arma-a-impulsi == 0]
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: La mappa sotto la Superficie
          testo: |
            Appoggi i palmi sulla faccia accesa, e le linee ti corrono sotto le
            dita e su per i polsi, fredde. Dal blocco sale una luce che si
            allarga sopra la sala e diventa una mappa. Riconosci la Cicatrice,
            un buco nero nel mezzo, e Qir-Azel aggrappata al bordo. Tutto
            intorno, sotto la Superficie, ci sono decine di punti accesi legati
            da linee che corrono verso la Cicatrice come radici verso l'acqua.
            Uno è il Nodo, e uno più a sud deve essere Vhar'Ul. Cerchi d'istinto
            la tua strada di casa, come su ogni mappa, e non la trovi.

            Poi un raggio ti misura la mano dito per dito, e accanto al Nodo si
            accende un punto che prima non c'era. La faccia del blocco si apre
            su un vano stretto, e dentro c'è un tubo di metallo con
            un'impugnatura fatta per dita più lunghe delle tue, accanto a una
            camera di cristallo che pulsa. Il custode non si muove. Risali il
            pozzo con le due cose strette al petto, e quando esci sulle
            terrazze il cielo è già scuro.
          imposta: { nodo-precursori.attivato: 1 }
          effetti: { oggetto.arma-a-impulsi: 1, parte.camera-3: 1, informazioni.segreto: 1, racconto: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il freddo nei gomiti
          testo: |
            Appoggi i palmi sulla faccia accesa, e le linee ti salgono su per i
            polsi più in fretta di quanto riesci a seguirle. Ai gomiti la luce
            diventa un freddo che fa male, e riesci a staccare le mani soltanto
            tirando con tutto il corpo. Nella nicchia il custode ha aperto due
            braccia, e tu non aspetti di vedere le altre due. Risali il pozzo di
            corsa, e sulle terrazze ti accorgi che sotto la pelle degli
            avambracci ti è rimasta una trama grigia.

            {medicina Media} La trama segue le vene da vicino, appena sotto la
            pelle, dove si potrebbe raschiare. Ti consigli con fermezza di non
            provarci.
          effetti: { ferite: 1, contaminazione: 1.5 }
          vai: superficie-fratturata
      - testo: "Rimettere le mani sulle linee"
        descrizione: "Il dispositivo ti ha già misurato una volta. Se si ricorda di te è più facile, ma nel vano ci sarà meno."
        quando: [nodo-precursori.attivato >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: Il tuo punto sulla mappa
          testo: |
            Appoggi i palmi sulla faccia accesa, e la mappa si apre sopra la
            sala più in fretta della prima volta. Accanto al Nodo c'è ancora il
            tuo punto, e intorno ce ne sono di nuovi che non ricordavi. Ti fa
            un piacere stupido, quello di trovare il proprio nome su un
            registro. Il vano
            si apre da solo. Dentro ci sono un guscio sigillato e una camera di
            cristallo attraversata da vene di luce, e li prendi senza che il
            custode alzi la testa dalle ginocchia.
          effetti: { parte.camera-2: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La trama grigia
          testo: |
            Questa volta la mappa non si apre, e le linee ti salgono su per i
            polsi come la prima volta che le hai toccate. Il freddo ti arriva ai
            gomiti prima che tu riesca a staccare le mani, e il custode apre due
            braccia nella nicchia. Risali il pozzo senza voltarti, con gli
            avambracci rigidi e una trama grigia sotto la pelle che ci mette
            giorni a sbiadire. Per tutti quei giorni dormi con le maniche
            abbassate.
          effetti: { ferite: 0.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Studiarlo da lontano"
        descrizione: "Le linee si riordinano quando ti avvicini. Guardare come lo fanno, senza toccare, è più sicuro."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le varianti
          testo: |
            Ti siedi sul pavimento a qualche passo dal blocco, fuori dal punto
            dove le linee cominciano a riordinarsi, e le guardi per ore. Le
            sequenze si ripetono con delle varianti, e le varianti hanno una
            regola, che ti scrivi sul polsino con il carbone prima che ti scappi
            di mente. Quando ti alzi prendi il guscio più piccolo dalla fila
            davanti alla nicchia, e il custode ti lascia fare, forse perché il
            più piccolo, in fondo alla fila, non lo conta nessuno.
          effetti: { reperto.sigillato: 1, informazioni.pettegolezzo: 1 }
          pe: { tecnologia: 10 }
          vai: superficie-fratturata
        fallimento:
          titolo: Troppo vicino
          testo: |
            Guardi le sequenze finché le linee non ti restano negli occhi anche
            quando li chiudi, e a un certo punto ti accorgi di esserti avvicinato
            senza volerlo. Le linee si riordinano verso di te, e il custode si
            alza in piedi, e in piedi è molto più alto di quanto prometteva.
            Te ne vai camminando all'indietro fino alla rampa, e la salita la
            fai con le linee che ti ballano davanti agli occhi.
          effetti: { tormento: 1, ferite: 0.5 }
          vai: superficie-fratturata
      - testo: "Affrontare il custode"
        descrizione: "Si sveglia se tocchi la sua fila di pezzi. Ha quattro braccia, e una sfera che gli gira intorno."
        combattimento: custode-del-nodo
        vittoria:
          titolo: Le quattro braccia
          testo: |
            Prendi un pezzo dalla fila e lo butti per terra, e il custode si
            dispiega dalla nicchia tutto in una volta, con una sfera che gli si
            stacca dal petto e ti gira intorno. Combatte con colpi precisi e
            ripetuti, che cercano di rimetterti a posto più che di farti male.

            {rissa Media} Le braccia di sotto colpiscono sempre dopo quelle di
            sopra, mai insieme. Fra le une e le altre c'è un buco largo quanto
            un respiro, e ci entri.

            Quando cade fa il rumore di una dispensa che crolla. Da uno dei
            quattro attrezzi stacchi un'impugnatura fatta per una mano che non
            esiste più, e risali il pozzo con quella e con un guscio sigillato.
          effetti: { parte.impugnatura-2: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Rimesso a posto
          testo: |
            Il custode ti prende per le spalle con due braccia e ti solleva da
            terra, e con le altre due ti raddrizza il collo e ti sistema il
            braccio sinistro lungo il fianco, come si rimette a posto un
            attrezzo sullo scaffale. Poi ti posa ai piedi della rampa e torna
            nella nicchia. Risali il pozzo con il braccio che non risponde e la
            sfera che ti accompagna fino all'orlo, educata, a due passi di
            distanza.
          effetti: { contaminazione: 0.5 }
          vai: superficie-fratturata
      - testo: "Andartene"
        descrizione: "Il dispositivo resterà acceso anche senza di te. Il custode, per ora, non si è mosso."
        costo: 0
        esito:
          titolo: La rampa
          testo: |
            Guardi le linee riordinarsi ancora una volta all'altezza del tuo
            petto. Poi ti giri e riprendi la rampa. A metà salita ti volti, e in
            fondo al pozzo la luce è tornata a salire dal basso verso l'alto,
            regolare, come se tu non fossi mai passato. Esci sulle terrazze con
            le tasche vuote e la sensazione di aver lasciato a metà una
            conversazione, di quelle in cui l'altro aspetta che sia tu a
            parlare.
          vai: superficie-fratturata
      - testo: "Porgergli un pezzo per la sua fila"
        descrizione: "Il custode mette in ordine i pezzi per grandezza. Se gliene porti uno nel modo giusto forse ti tratta come uno che rimette a posto le cose, e se sbagli il custode corregge te."
        requisiti: [reliquie.scheggia >= 1]
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Difficile }
        successo:
          titolo: Al suo posto
          testo: |
            Giri al largo del blocco con passi lenti e le mani bene in vista, e
            ti fermi davanti alla nicchia alla distanza a cui ci si ferma davanti
            a un magistrato. Poi ti chini e posi la scheggia nella fila, fra due
            pezzi di sfera che la stringono appena. Il custode allunga un braccio
            e la sposta di un dito. Dopo un tempo lungo apre un vano che ha nel
            petto, ne tira fuori due gusci sigillati e una placca incisa e te li
            posa davanti agli stivali, allineati per grandezza. Li raccogli
            nello stesso ordine, perché ti sembra il minimo. Risali il pozzo
            senza che lui alzi la testa dalle ginocchia.
          effetti: { reliquie.scheggia: -1, reperto.sigillato: 2, reliquie.frammento-inciso: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Fuori posto
          testo: |
            Posi la scheggia nella fila, ma nel punto sbagliato, o con la mano
            sbagliata. Il custode si dispiega dalla nicchia tutto in una volta.
            Rimette la scheggia dove andava, e poi rimette a posto anche te, con
            due braccia che ti stringono le spalle e altre due che ti
            raddrizzano la schiena finché non scricchiola. Ti posa ai piedi della
            rampa e torna a sedersi. La scheggia resta nella sua fila, e tu
            risali con il collo rigido e una trama grigia sotto le unghie. Per
            un paio di giorni stai seduto più dritto del solito, e non per
            scelta tua.
          effetti: { reliquie.scheggia: -1, ferite: 1, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Contare il segnale come al banco dell'Accademia"
        descrizione: "Le linee si ripetono con la pazienza dei cristalli del banco, il giorno del Festival. Se prendi il tempo prima di toccare, forse il blocco ti riconosce come uno che ascolta."
        quando: [origine.allievo-di-torvessa >= 1, nodo-precursori.attivato == 0, oggetto.arma-a-impulsi == 0]
        prova: { attributo: mentale, abilita: [magia, accademiche], difficolta: Difficile }
        successo:
          titolo: Le dita sul tempo
          testo: |
            Ti fermi a un passo dal blocco e conti le linee a mezza voce, come
            hai imparato a contare le note dei cristalli, finché le dita non
            battono il tempo da sole contro la coscia. Solo allora appoggi i
            palmi sulla faccia accesa, nel momento esatto del battito, e le
            linee ti salgono sui polsi fredde e lente. Dal blocco sale
            una luce che diventa una mappa, con la Cicatrice nel mezzo e
            Qir-Azel aggrappata al bordo, e sotto la Superficie decine di
            punti accesi legati da linee che corrono verso la Cicatrice. Uno è
            il Nodo, e uno più a sud deve essere Vhar'Ul.

            Un raggio ti misura la mano dito per dito, e accanto al Nodo si
            accende un punto nuovo. La faccia del blocco si apre su un vano
            stretto, con dentro un tubo di metallo dall'impugnatura troppo
            lunga per le tue dita e una camera di cristallo che pulsa. Risali
            il pozzo con tutte e due le cose strette al petto, e sulle terrazze
            il cielo è già scuro. Temmerin vorrà sapere la sequenza, e tu te
            la ripeti fino in cima per non perderla.
          imposta: { nodo-precursori.attivato: 1 }
          effetti: { oggetto.arma-a-impulsi: 1, parte.camera-3: 1, informazioni.segreto: 1, racconto: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Fuori tempo
          testo: |
            Conti, e al momento di toccare il blocco cambia sequenza sotto le
            tue mani, come un insegnante che cambia domanda quando hai la
            risposta pronta. Le linee ti salgono su per i polsi più in fretta
            di quanto riesci a seguirle, e ai gomiti diventano un freddo che fa
            male. Stacchi le mani tirando con tutto il corpo, mentre nella
            nicchia il custode apre due braccia. Risali il pozzo di corsa, e
            sulle terrazze trovi sotto la pelle degli avambracci una trama
            grigia che segue le vene.
          effetti: { ferite: 1, contaminazione: 1.5 }
          vai: superficie-fratturata
      - testo: "Guardarlo dalla rampa, come si fa con la Salvaguardia"
        descrizione: "Nelle rovine, quando c'è una macchina della Salvaguardia, un Raschiatore resta vicino alla scala e guarda da lì. Il custode è nella nicchia, e la rampa è a pochi passi."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il primo gradino
          testo: |
            Ti siedi sul primo tratto della rampa, con un piede già sulla
            salita come ti hanno insegnato, e guardi il blocco da lì. Le
            sequenze si ripetono con delle varianti, e le varianti hanno una
            regola, che ti scrivi sul polsino con il carbone. Il custode non ti
            degna di uno sguardo finché resti sulla rampa. Prima di salire
            scendi di due passi, prendi il guscio più piccolo in fondo alla
            fila e torni indietro senza voltargli le spalle.

            {furtivita Facile} Due passi avanti e due indietro, con i talloni
            che non toccano terra. Le gambe se li ricordano dai turni sulle
            piattaforme.
          effetti: { reperto.sigillato: 1, informazioni.pettegolezzo: 1 }
          pe: { tecnologia: 10 }
          vai: superficie-fratturata
        fallimento:
          titolo: Un passo di troppo
          testo: |
            Dalla rampa le sequenze si vedono male, e scendi di un passo per
            guardarle meglio, poi di un altro, che è quello che sulle
            piattaforme ti avrebbe fatto sgridare. Le linee si riordinano verso
            di te, e il custode si alza in piedi. Risali la rampa all'indietro,
            con le linee che ti ballano davanti agli occhi anche quando sei già
            sulle terrazze.
          effetti: { tormento: 1, ferite: 0.5 }
          vai: superficie-fratturata
