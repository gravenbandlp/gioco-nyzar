# Il villaggio storto, spedizione della Superficie Fratturata (tabella degli incontri, 49 Villaggio instabile).
# Ci si entra dallo storylet "Un villaggio in lontananza" (Superficie, ripetibile, senza requisiti).
# Le stanze vanno in fasce di profondità, e una stanza superata non ricompare nella stessa visita:
# 0 l'arrivo (la porta troppo alta; 20 l'ombra fuori tempo, che vale anche a 1), 1 la piazzetta (23 il pozzo;
# 32 il vento fra le case, che vale da 1 a 3), 2 dentro le case (16 lo specchio, la tavola apparecchiata),
# 3 l'ultima strada (30 l'uomo che ti aspettava). Il cuore a 4 è il centro del villaggio (42 l'altare, 2 le
# sagome): si può rifare, e la prima vittoria rende di più (villaggio.vinto). Ogni ramo riporta in Superficie.
# In fondo al cuore, congedarsi come un ospite (Sociale, Difficile): camera-2 e un reperto, senza toccare villaggio.vinto.
quality:
  - { id: villaggio.vinto, nome: Hai aperto l'altare del villaggio storto, categoria: stato, nascosta: true, descrizione: "1 dopo la prima vittoria sulle sagome al centro del villaggio storto. Le visite seguenti rendono meno." }

aree:
  - id: villaggio-storto
    immagine: ambientazione/laresh
    nome: Il villaggio storto
    sommario: "Un villaggio che sulle mappe della Gilda non c'è, con le case in piedi e le porte socchiuse. Non ci abita nessuno, e più ci resti più le misure delle cose ti sembrano sbagliate."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Il villaggio è una trentina di case di pietra e di legno strette
      intorno a una strada sola, con gli orti sul retro e un campanile basso
      nel mezzo. Le case sono in piedi e hanno i tetti a posto. Le porte sono
      socchiuse e qualche finestra è aperta, con i gerani secchi sui
      davanzali. Per la strada non passa nessuno, e non abbaia nemmeno un
      cane.

      Da vicino le misure non tornano. Una casa che sembrava a dieci passi ne
      chiede trenta. Sulla stessa strada c'è una porta più alta di quanto
      serva a un uomo, e accanto una finestra stretta come una feritoia.
      Niente è sbagliato al punto da poterlo indicare con il dito, e l'occhio
      continua a correggere quello che vede e a tornarci sopra, finché le
      tempie non cominciano a pulsarti piano.

      Sui muri, all'altezza di un bambino, qualcuno ha disegnato con il gesso
      una fila di omini che si tengono per mano. Contandoli da sinistra sono
      undici, e da destra dodici.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: villaggio-in-lontananza
    immagine: ambientazione/laresh
    titolo: Un villaggio in lontananza
    sommario: "Dal bordo di un pianoro di ghiaia si vede un villaggio con le case in piedi, in un punto dove le mappe della Gilda non segnano niente."
    luogo: Superficie Fratturata, sul bordo di un pianoro di ghiaia
    area: superficie-fratturata
    ripetibile: true
    testo: |
      Dal bordo di un pianoro di ghiaia, dove il sentiero dei carri piega
      verso le terrazze, vedi un villaggio in fondo alla conca. Sono una
      trentina di case con i tetti interi e un campanile basso, e intorno ci
      sono gli orti, divisi da muretti a secco tirati su a mano, pietra per
      pietra, da gente che aveva tempo e pazienza. Le porte sono socchiuse e
      qualche finestra è aperta. Dai camini non esce fumo, e per la strada non
      passa nessuno.

      Sulle mappe della Gilda, in questo punto, c'è soltanto il segno della
      ghiaia.

      {origine mercante-dei-ponti} Le mappe della Gilda le hai viste
      stendere sui banchi dei Ponti abbastanza volte da sapere come si
      fanno. Dove i cartografi non sono passati di persona mettono la
      ghiaia, che si disegna in fretta e nessuno va mai a controllare.

      {accademiche Media fallita} Dovresti ricordare qualcosa sui villaggi
      scomparsi della Superficie, letto in un almanacco della Gilda. Ricordi
      soltanto la copertina, che era verde come quel cancelletto.

      In fondo alla discesa c'è un cancelletto di legno dipinto di verde,
      con la vernice ancora lucida. *Qualcuno l'ha ridipinto quest'anno.* Il
      vento risale la conca e ti porta un odore leggero di ozono, quello dei
      temporali che poi non arrivano.

      {resistenza Facile} Le gambe hanno già fatto il conto della discesa e
      lo trovano ragionevole. La nuca, invece, non è d'accordo.
    opzioni:
      - testo: "Scendere verso il villaggio"
        descrizione: "Le case sembrano a un quarto d'ora di cammino, e la discesa è facile."
        costo: 1
        esito:
          titolo: La discesa
          testo: |
            Apri il cancelletto verde, che gira sui cardini senza un cigolio,
            e scendi verso le case. Le avevi stimate a un quarto d'ora di
            cammino. Dopo mezz'ora sono ancora lì e hanno la stessa grandezza.
            Cominci a contare i sassi del sentiero per avere almeno un numero
            che torni. Quando finalmente le raggiungi hai le gambe dure come dopo
            una salita. Ti volti a guardare il pianoro, e il cancelletto è
            molto più vicino di quanto dovrebbe.
          vai: villaggio-storto
      - testo: "Girarci al largo"
        descrizione: "Il sentiero dei carri passa oltre la conca, e le case restano dove sono."
        costo: 0
        esito:
          titolo: Al largo
          testo: |
            Riprendi il sentiero dei carri e tieni il villaggio sulla
            sinistra, in fondo alla conca, finché una piega del terreno non lo
            nasconde. Per un buon tratto continui a voltarti, con la scusa di
            controllare il sentiero. Le spalle ti si sciolgono soltanto quando
            il vento gira e l'odore di ozono se ne va.
      - testo: "Scendere tenendo il conto come al banco"
        descrizione: "Una mappa che segna la ghiaia dove ci sono trenta case ha sbagliato i conti. Al banco i conti sbagliati si rifanno a voce alta, una voce alla volta."
        quando: [origine.mercante-dei-ponti >= 1]
        costo: 1
        esito:
          titolo: Il conto delle case
          testo: |
            Apri il cancelletto verde e scendi contando a mezza voce, come
            quando rifai i conti di un fornitore che ti ha già imbrogliato
            una volta. Conti i passi, poi i sassi del sentiero, e infine le
            case, che a ogni curva sono una in più o una in meno. Il conto non
            torna mai, e tu lo segni lo stesso, per avere qualcosa da
            contestare. Quando arrivi alle prime case hai le gambe pesanti e una
            colonna di cifre in testa che non si somma. Il cancelletto, alle
            tue spalle, è molto più vicino di quanto dovrebbe.
          pe: { percezione: 2 }
          vai: villaggio-storto

  # ------------------------------------------------------------ 0 · l'arrivo
  - id: villaggio-la-porta-alta
    immagine: ambientazione/laresh
    titolo: La porta troppo alta
    sommario: "La prima casa della strada ha una porta alta il doppio di un uomo, e accanto una finestra stretta come una mano."
    luogo: Il villaggio storto, all'inizio della strada
    area: villaggio-storto
    ripetibile: true
    requisiti: [profondita.villaggio-storto == 0]
    testo: |
      La strada entra nel villaggio fra due muretti a secco, e la prima casa
      sta sulla destra, intonacata di bianco. La porta è socchiusa ed è alta
      il doppio di un uomo, con l'architrave così in su che per guardarlo
      devi alzare il mento. Accanto c'è una finestra stretta quanto una mano
      aperta, con le imposte spalancate. Sulla soglia sono appaiati due
      zoccoletti da bambino, di legno, con le punte rivolte verso la strada.

      {empatia Facile} Li ha messi lì una madre, la sera, perché il bambino
      la mattina li trovasse pronti. Le punte verso la strada vogliono dire
      che fuori c'era qualcosa da fare.

      Dal muretto alla porta ci sono dieci passi, a occhio. Ne fai dieci e la
      porta è ancora lontana, e il piede cerca un appoggio che non c'è, come
      quando una scala ha un gradino in meno di quelli che ti aspettavi.

      {acrobazia Media fallita} Il tuo equilibrio, che di solito sa dove
      sta il pavimento, ti chiede educatamente di fermarti finché non lo
      ritrova.
    opzioni:
      - testo: "Contare i passi a voce alta"
        descrizione: "Se le misure sbagliano, almeno il conto lo tieni tu."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Trentuno
          testo: |
            Conti a voce alta, con gli occhi sulla punta degli stivali, e la
            tua voce in quella strada vuota suona come quella di un maestro
            davanti a una classe assente. Al trentunesimo passo la mano ti
            trova lo stipite di legno ruvido. Ti volti, e il muretto da cui sei
            partito è a dieci passi giusti. Ti tieni a mente il trentuno e
            prosegui lungo la strada senza ricontare.
          effetti: { profondita.villaggio-storto: 1 }
        fallimento:
          titolo: Il conto che scappa
          testo: |
            Arrivato a venti ti accorgi di aver detto diciotto due volte, e
            ricominci. La terza volta che ricominci sei di nuovo al muretto,
            con la gola secca e la porta lontana come prima. Ti siedi sui sassi
            finché il cuore non smette di correre, e per prudenza non conti
            nemmeno i battiti.
          effetti: { tormento: 1 }
      - testo: "Guardare dentro la porta socchiusa"
        descrizione: "La stanza dietro la porta è in ombra. Dovrebbe essere piccola, come la casa."
        prova: { attributo: mentale, abilita: percezione, difficolta: Facile }
        successo:
          titolo: Il fermaporta
          testo: |
            Spingi la porta con due dita. Dentro c'è una cucina qualunque, con
            il focolare spento e le sedie in ordine, e a tenere aperta la porta
            c'è una scheggia di metallo precuriano grande come un mattone. Qui
            la usavano per questo, perché in una casa di campagna una cosa
            pesante trova sempre un lavoro. La sollevi, e la porta resta aperta lo
            stesso. Esci dal retro su un vicolo che porta più dentro il
            villaggio.

            {armi-da-mischia Media} Pesa quanto un mattone e ha uno spigolo
            vivo. In mancanza d'altro, è un argomento che si fa ascoltare.
          effetti: { profondita.villaggio-storto: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: La cucina lunga
          testo: |
            Dentro c'è una cucina con il focolare sulla parete di fondo, e la
            parete di fondo è più lontana di quanto la casa sia lunga. Mentre
            la guardi si allontana ancora, di un palmo alla volta. Ti tiri
            indietro e urti gli zoccoletti, che rotolano in strada, e li
            rimetti a posto con le mani che tremano, le punte verso la strada,
            come li avevi trovati.
          effetti: { tormento: 1 }
      - testo: "Fare il giro dietro gli orti"
        descrizione: "Lontano dalla strada le case sono soltanto muri. Il giro però è lungo, e i muretti sono alti."
        costo: 2
        esito:
          titolo: Gli orti
          testo: |
            Scavalchi il muretto e passi dietro le case, fra file di cavoli
            andati a seme e pali da fagioli senza fagioli. In un orto c'è uno
            spaventapasseri con il cappello di paglia legato sotto il mento,
            perché il vento non glielo porti via. Dall'altra parte i muretti
            sono più alti di come sembravano dalla strada, e due volte ti
            sbucci le mani sui sassi per tirarti su. Rientri sulla strada più
            avanti, dove le case si fanno fitte, con i palmi che bruciano.
          effetti: { profondita.villaggio-storto: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 0–1 · fra le case
  - id: villaggio-l-ombra-fuori-tempo
    immagine: ambientazione/marea-grigia
    titolo: L'ombra fuori tempo
    sommario: "Fra due case, sul muro in pieno sole, un'ombra si sposta per conto suo."
    luogo: Il villaggio storto, un vicolo fra due case
    area: villaggio-storto
    ripetibile: true
    requisiti: [profondita.villaggio-storto <= 1]
    testo: |
      Il vicolo fra le due case è largo quanto un carro, e da un muro
      all'altro è tesa una corda da bucato con tre camicie e una calza sola,
      rigide di polvere. L'altra calza, chissà, l'avrà cercata qualcuno per
      tutta una mattina. Il sole batte sul muro di destra, e ci vedi la tua
      ombra accanto a quella della corda.

      Più in là, fra le pietre, un'altra ombra scivola lungo il muro senza
      niente che la proietti, alta quanto un uomo e un poco curva. Quando la
      guardi dritta non c'è più, e restano soltanto le pietre irregolari e i
      giochi del sole. La nuca però ti si è già gelata, e la mano è andata
      da sola alla cintura.

      {armi-da-mischia Facile} Se fosse un uomo, sarebbe a sei passi, con il
      fianco sinistro scoperto. Il problema è tutto in quel se.
    opzioni:
      - testo: "Tirare dritto senza voltarsi"
        descrizione: "Un'ombra è un'ombra. Basta convincersene fino in fondo al vicolo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: In fondo al vicolo
          testo: |
            Tieni gli occhi sulla fine del vicolo e cammini al passo di sempre,
            che a sentirlo da fuori non è proprio quello di sempre. Con la coda
            dell'occhio la vedi ancora due volte un passo dietro di te, e
            riesci a non guardarla. In fondo il vicolo sbuca su una strada più
            larga, dove il sole è uguale per tutti. Ti accorgi di avere i pugni
            chiusi e li apri.
          effetti: { profondita.villaggio-storto: 1 }
        fallimento:
          titolo: Voltarsi
          testo: |
            A metà vicolo ti volti di scatto. Il muro è vuoto, e la tua ombra ci
            arriva un momento dopo di te, come se avesse dovuto rincorrerti. Da
            lì in avanti non riesci più a staccarle gli occhi di dosso, e torni
            all'imbocco del vicolo camminando all'indietro, sbattendo la
            schiena contro la corda del bucato.
          effetti: { tormento: 1 }
      - testo: "Colpire l'ombra sul muro"
        descrizione: "Se c'è qualcosa, se ne accorgerà. Se non c'è niente, il villaggio sentirà il rumore."
        prova: { attributo: fisico, abilita: [armi-da-mischia, rissa], difficolta: Facile }
        successo:
          titolo: La crepa
          testo: |
            Colpisci il muro dove l'ombra si è fermata, e la pietra si apre in
            una crepa. L'ombra ci scivola dentro come acqua in uno scolo. Nella
            crepa resta incastrata una scheggia di metallo grigio, tiepida, che
            stacchi con la punta delle dita. Il rumore del colpo rotola fra le
            case, e alle finestre non si affaccia nessuno, il che in un
            villaggio dovrebbe consolarti e invece no.
          effetti: { profondita.villaggio-storto: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il muro
          testo: |
            Colpisci il muro, e il muro ti restituisce il colpo fino al gomito.
            Dell'ombra non c'è più traccia. Il rumore rotola lungo il vicolo e
            torna indietro dalle case di fondo più forte di prima e un poco in
            ritardo. Una finestra al primo piano sbatte da sola. Ti massaggi il
            polso aspettando che qualcuno si affacci.

            {medicina Facile} Le ossa sono intere. Le dita si chiudono tutte,
            anche l'anulare, che lo fa controvoglia.
          effetti: { ferite: 0.5 }
      - testo: "Seguire l'ombra fra le case"
        descrizione: "Ci perdi tempo, e l'ombra conosce il villaggio meglio di te."
        costo: 2
        esito:
          titolo: Dietro l'ombra
          testo: |
            La segui da un muro all'altro per vicoli che girano sempre a
            sinistra, e dopo il quarto giro a sinistra dovresti essere tornato
            al punto di partenza. La perdi spesso, e ogni volta la ritrovi un
            po' più avanti. Quando smetti il sole si è spostato di una spanna,
            e sei più dentro il villaggio di quanto avresti voluto. Ti fa male
            la testa, sopra l'occhio destro, come quando hai letto troppo a
            lungo a lume di candela.
          effetti: { profondita.villaggio-storto: 1, tormento: 1 }

  # ------------------------------------------------------------ 1 · la piazzetta
  - id: villaggio-il-pozzo
    immagine: ambientazione/laresh
    titolo: Il pozzo della piazzetta
    sommario: "In una piazzetta c'è un pozzo con la carrucola ancora al suo posto, e l'acqua che sale è limpidissima."
    luogo: Il villaggio storto, la piazzetta del pozzo
    area: villaggio-storto
    ripetibile: true
    requisiti: [profondita.villaggio-storto == 1]
    testo: |
      La strada si allarga in una piazzetta lastricata, con un pozzo nel
      mezzo. Il bordo è di pietra consumata dalle mani, lisciata in due
      punti precisi dove generazioni di gomiti si sono appoggiate ad
      aspettare il secchio, e sopra c'è una carrucola arrugginita con il
      secchio appeso. Al bordo è legata una tazza di latta con una
      catenella, e un anello rotto della catenella è stato sostituito con un
      giro di spago.

      Cali il secchio quasi senza volerlo, per abitudine. Lo senti toccare
      l'acqua molto in basso, con un suono chiaro e pieno, e quando lo tiri
      su è colmo di un'acqua così limpida che il fondo del secchio sembra
      asciutto. L'acqua è senza odore, e anche il secchio ha perso il suo.
      Hai la gola secca da quando sei sceso dal pianoro.

      {origine figlio-del-circolo} Nel Bosco di Velthar l'acqua buona sa
      sempre di foglie marce o di sasso, e il Circolo
      insegna ai bambini a diffidare delle fonti che non sanno di niente.
      Questa, avvicinata al naso, non sa nemmeno di acqua.

      {resistenza Media fallita} La lingua ti si è incollata al palato e
      la gola fa un rumore di carta. Il corpo ha già deciso di bere, e ti
      lascia l'onore di fingere che decida tu.

      {natura Media} Un pozzo così fondo dovrebbe sapere di pietra e di
      muschio, e un secchio vecchio dovrebbe sapere di ruggine. Quando
      l'acqua toglie l'odore alle cose, non è soltanto acqua.
    opzioni:
      - testo: "Bere e riposare sul bordo"
        descrizione: "Sulla Superficie l'acqua pulita è rara. Questa forse è troppo pulita."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Acqua di pozzo
          testo: |
            Ne bevi un sorso e aspetti, con la lingua attenta come quella di un
            assaggiatore, poi ne bevi un altro. È acqua fredda di pozzo e
            basta, e ti scende in gola come una cosa giusta in un posto
            sbagliato. Ti siedi sul bordo con la schiena al sole. Mentre
            riposi, dall'altra parte della piazzetta una porta si richiude
            piano, e tu decidi che è stato il vento. Quando riparti le gambe ti
            reggono meglio.
          effetti: { profondita.villaggio-storto: 1, ferite: -0.5 }
        fallimento:
          titolo: Il sapore
          testo: |
            Al primo sorso l'acqua non ha sapore. Al secondo ti lascia in bocca
            il ferro e l'ozono, e sulla lingua una patina grigia che non va via
            nemmeno sputando. Resti piegato sul bordo del pozzo finché la nausea
            non passa, e intanto guardi la tua faccia nel secchio, che ti
            guarda a sua volta con un'aria preoccupata.

            {medicina Media} Lo stomaco si è chiuso per tempo. Quello che è
            passato è poco, ma la Marea si conta a sorsi.
          effetti: { contaminazione: 1 }
      - testo: "Calare il secchio fino al fondo"
        descrizione: "La corda è lunga. Nei pozzi, a volte, finisce quello che la gente perde."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Quello che c'era in fondo
          testo: |
            Lasci correre la corda finché il secchio non tocca qualcosa di
            duro, e lo fai strisciare sul fondo a lungo prima che si impigli.
            Tirarlo su ti costa la pelle dei palmi e un dolore sordo fra le
            scapole. Dentro, nell'acqua limpida, c'è un guscio di metallo
            grande come un pugno, senza una giuntura, che gocciola sul
            lastricato. Te lo metti nella bisaccia e attraversi la piazzetta.
          effetti: { profondita.villaggio-storto: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La corda lunga
          testo: |
            La corda continua a scendere molto oltre il punto in cui il secchio
            aveva toccato l'acqua, e oltre la lunghezza che un pozzo può avere,
            e la carrucola gira con un cigolio paziente. Quando ti decidi a
            tirarla su ci metti tanto da avere le braccia di pietra. Il secchio
            arriva pieno di una nebbia grigia che trabocca lenta dal bordo e si
            sfilaccia fra le tue dita.
          effetti: { tormento: 1, contaminazione: 1 }
      - testo: "Attraversare la piazzetta senza fermarsi"
        descrizione: "Il pozzo resta dov'è, e la sete te la tieni."
        costo: 2
        esito:

          titolo: La sete
          testo: |
            Rimetti il secchio sul bordo e attraversi la piazzetta con la sete
            che ti gratta la gola, e la lingua che si ostina a cercare saliva
            dove non ce n'è. Dietro di te il secchio gocciola sul lastricato
            con un ritmo regolare. Arrivato all'angolo ti accorgi che le gocce
            continuano, e che il secchio ormai dovrebbe essere vuoto da un
            pezzo.
          effetti: { profondita.villaggio-storto: 1 }

  # ------------------------------------------------------------ 1–3 · le strade sotto il campanile
  - id: villaggio-il-vento-fra-le-case
    immagine: ambientazione/laresh
    titolo: Il vento fra le case
    sommario: "Il vento fra le case fa un suono lungo che somiglia a una voce. Dal campanile arrivano i rintocchi di una campana ferma."
    luogo: Il villaggio storto, una strada stretta sotto il campanile
    area: villaggio-storto
    ripetibile: true
    requisiti: [profondita.villaggio-storto >= 1, profondita.villaggio-storto <= 3]
    testo: |
      La strada si stringe fra case alte, e il vento della Superficie ci
      entra di traverso. Fra le grondaie e gli spigoli dei muri diventa un
      suono lungo che sale e scende come una canzone tenuta a bocca
      chiusa. A tratti sembra una voce lontana che chiama, e ogni volta
      che ti fermi per capire le parole il suono cambia di poco e resta
      incomprensibile.

      {espressivita Media} Ha una melodia, e la melodia ha un ritornello
      che torna ogni sette folate. Somiglia a una ninna nanna cantata da
      qualcuno che ha dimenticato le parole.

      Sopra i tetti si vede il campanile. La campana è ferma nella sua cella,
      e a ogni folata ti arriva lo stesso un rintocco basso. Su un davanzale
      c'è una fila di vasi di basilico secco, e uno ha un cartellino scritto
      a mano, *di Mirta, non toccare*, rispettato da tutti, compreso chi
      avrebbe dovuto annaffiarlo.

      {percezione Facile} Il rintocco arriva una frazione prima della
      folata, come se il vento gli corresse dietro.
    opzioni:
      - testo: "Tapparsi le orecchie e passare oltre"
        descrizione: "È il vento. Basta non starlo a sentire."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Facile }
        successo:
          titolo: Le dita nelle orecchie
          testo: |
            Ti premi le dita nelle orecchie e cammini contando i passi, con i
            gomiti alti come un bambino che non vuole sentire la predica. Il
            suono attutito ti arriva lo stesso, e ti pare che rallenti quando
            rallenti tu. Lo lasci dietro l'angolo. Per un pezzo ti resta nelle
            orecchie un fischio sottile, e quello almeno è soltanto tuo.
          effetti: { profondita.villaggio-storto: 1 }
        fallimento:
          titolo: Il ritornello
          testo: |
            Ti tappi le orecchie, e il suono ti arriva dall'interno, dalle ossa
            del cranio, più chiaro di prima. Ti scopri a canticchiarlo a bocca
            chiusa, perfettamente intonato. Smetti soltanto
            quando ti mordi la lingua apposta, e ti ritrovi fermo nel punto da
            cui eri partito, con il sapore del sangue in bocca.
          effetti: { tormento: 1 }
      - testo: "Fermarsi ad ascoltare"
        descrizione: "Potrebbe essere soltanto il vento, oppure dire qualcosa che vale la pena sapere."
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: La sillaba
          testo: |
            Resti fermo con la schiena al muro e ascolti a lungo, finché il
            freddo della pietra non ti passa attraverso la giubba. Il suono
            nasce nelle fessure fra le case, accordate come le canne di un
            organo, e il rintocco viene da sotto il campanile, dalla terra. La
            voce ripete sempre la stessa sillaba, l'inizio di un nome che non
            arriva mai alla fine. Te la tieni a mente per chi saprà farne
            qualcosa, e prosegui.

            {magia Difficile} Le fessure non si sono allargate da sole con gli
            anni. Qualcosa le ha tirate alla misura giusta, una per una, perché
            il vento dicesse quella sillaba e nessun'altra.
          effetti: { profondita.villaggio-storto: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il tuo nome
          testo: |
            Ascolti, e dopo un poco la voce pronuncia il tuo nome con la
            cadenza che usi tu, quella un po' strascicata della sera. Rispondi
            prima di potertelo impedire. Il vento cala di colpo, e la strada
            resta in silenzio, con il tuo «sì» che non ha ancora finito di
            rimbalzare fra le case.
          effetti: { tormento: 1.5 }
      - testo: "Fare il giro sottovento"
        descrizione: "Dietro le case il vento non entra. Ci sono muretti da scavalcare e orti da attraversare."
        costo: 2
        esito:
          titolo: Sottovento
          testo: |
            Giri dietro le case, dove l'aria è ferma e il suono arriva soltanto
            come un ronzio lontano. Scavalchi muretti e attraversi orti pieni di
            erbacce, e a un certo punto resti con il piede infilato in un
            secchio sepolto fra i cavoli, messo lì da qualcuno con un senso
            dell'umorismo che non condividi. Rientri sulla strada più avanti,
            con una caviglia che protesta a ogni passo.
          effetti: { profondita.villaggio-storto: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · dentro le case
  - id: villaggio-lo-specchio
    immagine: ambientazione/marea-grigia
    titolo: Lo specchio in ritardo
    sommario: "In una casa con la porta socchiusa c'è uno specchio incrinato, e il tuo riflesso si muove un attimo dopo di te."
    luogo: Il villaggio storto, una camera da letto
    area: villaggio-storto
    ripetibile: true
    requisiti: [profondita.villaggio-storto == 2]
    testo: |
      La porta socchiusa dà su una camera da letto, con il letto rifatto e
      una cassapanca ai piedi. Sopra la cassapanca è appeso uno specchio
      grande quanto un'anta d'armadio, incrinato in diagonale da un angolo
      all'altro. Nella cornice qualcuno ha infilato un rametto di lavanda
      secca e un biglietto, *ricordati il pane*, con la grafia frettolosa di
      chi lo scriveva tutte le mattine e tutte le mattine se ne dimenticava.

      {galateo Facile} In una camera da letto altrui si entra bussando,
      anche quando la casa è vuota e i padroni non torneranno. Bussa sullo
      stipite, almeno con due nocche, per decenza.

      Lo specchio ti mostra mentre entri. Quando alzi una mano il riflesso
      la alza a sua volta, con un ritardo minimo, il tempo di un battito di
      palpebre. Ti fermi, e il riflesso si ferma un attimo dopo di te. *Lo
      fa apposta per vedere se te ne accorgi.* Dietro il riflesso, nello
      specchio, il letto è disfatto.

      {resilienza Media fallita} Il riflesso deglutisce dopo di te. Adesso
      che ci pensi, anche la tua gola ti sembra muoversi un poco in
      ritardo rispetto a quando l'hai deciso.
    opzioni:
      - testo: "Passare davanti allo specchio senza guardarlo"
        descrizione: "È uno specchio rotto in una casa vuota. Si attraversa la stanza e si va oltre."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Facile }
        successo:
          titolo: La porta sul retro
          testo: |
            Attraversi la stanza con gli occhi fissi sulle assi del pavimento, e
            con la coda dell'occhio vedi il riflesso camminare accanto a te, un
            passo indietro. La porta sul retro dà su un cortile e il cortile su
            un'altra strada, più vicina al campanile. Esci senza voltarti a
            vedere se il riflesso ha finito di attraversare.
          effetti: { profondita.villaggio-storto: 1 }
        fallimento:
          titolo: Fermo
          testo: |
            A metà stanza ti fermi per vedere quanto ci mette il riflesso a
            fermarsi. Ci mette un poco di più ogni volta che riprovi, e tu
            riprovi più volte di quanto sarebbe saggio. Esci dalla porta da cui
            sei entrato, e solo in strada ti accorgi che stai ancora alzando e
            abbassando la mano.
          effetti: { tormento: 1 }
      - testo: "Studiare il ritardo"
        descrizione: "Un ritardo si misura. Se lo misuri, forse capisci da dove viene."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La cassapanca
          testo: |
            Muovi la mano a scatti e conti, con la serietà di un agrimensore.
            Il ritardo cresce di poco ogni volta che resti fermo davanti allo
            specchio, e cala quando ti allontani. Il punto in cui è più lungo
            sta proprio sopra la cassapanca. La apri, e fra le lenzuola piegate
            c'è un guscio di metallo freddo, chiuso senza una giuntura. Lo
            prendi, e nello specchio il riflesso ci mette un po' a prenderlo.
          effetti: { profondita.villaggio-storto: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: In anticipo
          testo: |
            Muovi la mano a scatti e conti, e a un certo punto il conto non
            torna più. Il riflesso ha abbassato la mano mentre la tua è ancora
            alzata, e aspetta paziente che tu lo raggiunga. Resti così, con il
            braccio a mezz'aria e il sudore che ti si gela sulla nuca, finché
            non trovi il coraggio di abbassarlo e di uscire.
          effetti: { tormento: 1.5 }
      - testo: "Rompere lo specchio"
        descrizione: "Un colpo e via, anche se il vetro è spesso e taglia."
        esito:
          titolo: I pezzi
          testo: |
            Lo colpisci con il gomito, e lo specchio cade a pezzi sulla
            cassapanca. Ogni pezzo ti mostra un frammento di faccia, e ogni
            frammento si gira verso di te un attimo dopo. Per il resto nella
            stanza tutto resta com'era, compreso il biglietto del pane, che
            adesso pende storto dalla cornice vuota. Esci dal retro con un
            taglio sull'avambraccio che sanguina più di quanto dovrebbe.
          effetti: { profondita.villaggio-storto: 1, ferite: 0.5 }

  - id: villaggio-la-tavola-apparecchiata
    immagine: ambientazione/laresh
    titolo: La tavola apparecchiata
    sommario: "In una cucina la tavola è apparecchiata per quattro, e dalla zuppiera sale ancora il vapore."
    luogo: Il villaggio storto, la cucina di una casa
    area: villaggio-storto
    ripetibile: true
    requisiti: [profondita.villaggio-storto == 2]
    testo: |
      La cucina ha le imposte aperte e la tavola apparecchiata per quattro,
      con le sedie scostate come se la famiglia si fosse alzata un momento
      prima. In mezzo c'è una zuppiera, e dalla tacca del mestolo nel
      coperchio sale un filo di vapore. Il pane è tagliato a fette spesse.
      Una delle scodelle è stata rotta e rimessa insieme con due graffe di
      metallo, e l'hanno apparecchiata lo stesso, a capotavola.

      {empatia Media} A capotavola si mette la scodella di chi comanda, e
      qui comandava qualcuno che teneva più alla scodella che al servizio
      buono. Forse era stata un regalo di nozze.

      Una delle sedie ha lo schienale alto fino alla trave del soffitto.
      Nella stanza c'è odore di cipolla e di brodo, e la bocca ti si
      riempie di saliva prima che la testa abbia deciso qualcosa.

      {origine fuggiasco-di-ghoran} La mano prende una fetta di pane prima
      che tu le dia il permesso, e te la infila in tasca per dopo, come il
      giorno del Festival. Te ne accorgi soltanto quando la tasca comincia a
      pesare, e la lasci dov'è.

      {resistenza Facile fallita} Quand'è stata l'ultima volta che hai
      mangiato una cosa calda? Lo stomaco lo sa con precisione, e te lo sta
      dicendo ad alta voce.
    opzioni:
      - testo: "Sedersi a mangiare"
        descrizione: "È zuppa calda, e ne hai bisogno. Viene da una cucina dove non cucina nessuno."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: Zuppa di cipolle
          testo: |
            Ti siedi davanti alla scodella con le graffe, perché è quella che
            sembra aspettare qualcuno. La zuppa è calda e salata al punto
            giusto, ed è la zuppa che ti facevano da bambino, con la crosta di
            pane sopra, e non ricordavi di ricordarla. Mangi fino in
            fondo, raschiando il cucchiaio sulle graffe. Quando ti alzi anche
            le altre tre scodelle sono vuote, e ti senti meglio di quanto
            vorresti.
          effetti: { profondita.villaggio-storto: 1, ferite: -0.5 }
        fallimento:
          titolo: Il brodo grigio
          testo: |
            Al terzo cucchiaio il brodo ti lascia in bocca il sapore metallico
            della Marea. Sputi nella scodella, e quello che sputi è grigio e
            lento. Passi un brutto quarto d'ora piegato sull'acquaio, a
            chiedere scusa al tuo stomaco, e quando ti tiri su la zuppiera ha
            ripreso a fumare come prima.
          effetti: { contaminazione: 1.5 }
      - testo: "Frugare nella credenza"
        descrizione: "Le famiglie tengono le cose buone in alto, dietro i barattoli."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il barattolo dello zucchero
          testo: |
            Dietro i barattoli della farina ce n'è uno di latta con la scritta
            *zucchero*. Dentro, al posto dello zucchero, ci sono due schegge di
            metallo precuriano avvolte in uno straccio, il tesoretto di casa,
            nascosto nel primo posto dove guarderebbe un ladro.

            {conoscenze-della-strada Facile} In tutte le case del mondo il
            barattolo dello zucchero è il primo che si apre. Questa gente era
            onesta, e si fidava dei vicini.

            Le prendi chiedendo scusa a mezza voce a nessuno in particolare, ed
            esci dalla porta che dà sul vicolo.
          effetti: { profondita.villaggio-storto: 1, reliquie.scheggia: 2 }
        fallimento:
          titolo: Il cassetto
          testo: |
            Apri il cassetto in basso, e il cassetto è più profondo della
            credenza. Ci infili il braccio fino al gomito, poi fino alla spalla,
            con la guancia premuta contro il legno, senza toccare il fondo.
            Qualcosa ti dà due colpetti gentili sul dorso della mano, per dirti
            di smettere. Ritiri il braccio così in fretta che ti sbucci le
            nocche sul bordo.
          effetti: { tormento: 1 }
      - testo: "Uscire dalla porta sul retro"
        descrizione: "Lasci la zuppa a chi l'ha preparata, e passi in fretta."
        costo: 2
        esito:
          titolo: Le sedie
          testo: |
            Giri intorno alla tavola tenendoti lontano dalle sedie, soprattutto
            da quella alta, e apri la porta sul retro. Mentre la richiudi, alle
            tue spalle, senti le sedie strisciare sul pavimento una dopo
            l'altra, e poi il tintinnio di un mestolo contro la zuppiera. Il
            vicolo dietro la casa sale verso il campanile, e tu lo risali senza
            voltarti.
          effetti: { profondita.villaggio-storto: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · l'ultima strada
  - id: villaggio-l-uomo-che-ti-aspettava
    immagine: ambientazione/laresh
    titolo: L'uomo che ti aspettava
    sommario: "Un uomo del villaggio ti viene incontro sollevato, come se ti aspettasse da ore."
    luogo: Il villaggio storto, l'ultima strada prima del centro
    area: villaggio-storto
    ripetibile: true
    requisiti: [profondita.villaggio-storto == 3]
    testo: |
      Sull'ultima strada prima del centro, dove le case si diradano, una
      porta si apre ed esce un uomo sulla cinquantina, in maniche di camicia,
      con un grembiule da fornaio e la farina fino ai gomiti. Ti viene
      incontro a passo deciso, e quando ti è vicino lo senti sospirare forte,
      sollevato, come uno che ha appena ritrovato le chiavi.

      «Finalmente» dice. Si ferma a un passo da te e ti guarda bene, dalla
      fronte agli stivali, come per confermare una cosa che sapeva già.
      «Pensavo che fossi già passato. Ti aspettavo da stamattina, io. Ti ho
      tenuto da parte la tua roba, eh, come d'accordo.»

      {ingannare Media} Non mente. È peggio, perché ci crede fino in fondo,
      e ogni «eh» è una porta che ti tiene aperta perché tu ci entri.

      Sulla spalla della camicia ha una toppa cucita a punti larghi, e
      guardandola ti viene un prurito alla spalla, nello stesso punto.

      {origine figlio-della-citta-bassa} Nei vicoli chi ti saluta come un
      vecchio amico di solito vuole qualcosa, e tu hai imparato presto a
      dimenticare le facce. Questa non l'hai mai vista, eppure i suoi occhi
      ti riconoscono con una sicurezza che ti fa sudare le mani.

      {percezione Difficile} Sotto la farina, le unghie sono grigie fino
      alla radice. Lui non se n'è accorto, o non sa più che non è normale.
    opzioni:
      - testo: "Chiedergli per chi ti ha preso"
        descrizione: "È un uomo che parla volentieri. Magari sa anche che cosa è successo al villaggio."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il fornaio
          testo: |
            Glielo chiedi piano, e lui si mette a ridere pulendosi le mani sul
            grembiule e ti risponde che ti ha preso per te, eh, per chi
            dovrebbe prenderti. Mentre ti accompagna verso il centro ti parla
            del pozzo, che un mattino ha cominciato a dare un'acqua troppo
            buona, e dei vicini, che uno alla volta hanno smesso di uscire di
            casa. Ne parla come si parla del tempo, senza abbassare la voce.
            All'ultimo angolo si ferma con le mani nel grembiule e ti dice che
            da lì in avanti ci vai da solo, come d'accordo.

            {empatia Media} Ha paura, e la tiene in un posto dove non riesce
            più a trovarla. Ti accompagna fin qui perché è l'ultima cosa che
            si ricorda di dover fare.

          effetti: { profondita.villaggio-storto: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Le risposte prima
          testo: |
            Cominci a chiedergli chi crede che tu sia, e lui ti risponde prima
            che tu finisca la domanda. La seconda volta risponde prima che tu la
            cominci, e alla terza restate zitti tutti e due, lui con la pazienza
            di un fornaio che aspetta la lievitazione, tu con la bocca aperta
            su una domanda che non ha più senso fare. Ti allontani di qualche
            passo, e lui torna verso la sua porta.
          effetti: { tormento: 1 }
      - testo: "Stare al gioco"
        descrizione: "Se ti ha tenuto da parte qualcosa, tanto vale prenderlo. Basta non sbagliare la parte."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: La tua roba
          testo: |
            Gli dici che hai fatto tardi per la strada, e lui annuisce come se
            lo sapesse già. Rientra in casa e torna con un fagotto di tela
            legato con lo spago e chiuso da un doppio nodo. «La tua roba, eh.
            Controlla pure.» Dentro c'è un guscio di metallo chiuso, pesante
            per la sua grandezza. Lo ringrazi come si ringrazia un vecchio
            amico, e lui ti indica la fine della strada, dove le case
            finiscono.
          effetti: { profondita.villaggio-storto: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La mano sulla faccia
          testo: |
            Sbagli una parola, o forse il modo di dirla, e lui smette di
            sorridere. Si avvicina e ti mette una mano sulla faccia, con il
            pollice sullo zigomo, come si fa con un bambino per sentire se ha la
            febbre. Ha le dita fredde, e grigie sotto la farina. Non riesci a
            muoverti, e il tuo corpo non sembra nemmeno volerlo. Quando ti
            lascia andare la pelle ti brucia dove ti ha toccato, e lui è già
            rientrato.
          effetti: { contaminazione: 1 }
      - testo: "Tenerlo a distanza e passare oltre"
        descrizione: "Lui conosce te, e tu non conosci lui. Meglio non fermarsi."
        costo: 2
        esito:
          titolo: Come d'accordo
          testo: |
            Gli dici che si sbaglia e lo superi con la mano sulla cintura. Lui
            ti segue per un tratto e ti parla alle spalle, offeso come un amico
            lasciato ad aspettare, e ti elenca le cose che ti ha tenuto da
            parte, una per una, senza mai dire quali siano. Smette soltanto
            all'ultimo angolo, dove la strada si apre. «Allora ci vediamo dopo»
            ti dice. «Come d'accordo.» Davanti a te c'è il centro del villaggio.
          effetti: { profondita.villaggio-storto: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · il centro del villaggio
  - id: villaggio-il-centro
    immagine: ambientazione/marea-grigia
    titolo: Il centro del villaggio
    sommario: "Le strade del villaggio finiscono tutte su uno spiazzo di terra nuda, con un altare di pietra scura nel mezzo."
    luogo: Il villaggio storto, il centro
    area: villaggio-storto
    requisiti: [profondita.villaggio-storto >= 4]
    testo: |
      Il centro del villaggio è uno spiazzo di terra battuta dove arrivano
      tutte le strade. Il campanile, che da fuori stava nel mezzo, qui non
      c'è. La terra è dura e crepata, senza un filo d'erba. Nel mezzo c'è
      una struttura bassa simile a un altare, di pietra scura, attraversata
      da venature lattiginose che si muovono appena sotto la superficie.
      Avvicinandoti senti una pressione alla testa, dietro gli occhi, come un
      pensiero che vuole venire fuori e non trova la strada. Sul piano
      dell'altare ci sono incisioni irregolari, e lo sguardo non riesce a
      seguirle fino in fondo perché cambiano posto mentre le guardi.

      {origine accolito-del-velo} In Cattedrale ti hanno insegnato a non
      chiedere che cosa c'è sotto l'altare. Questo non è un altare del Velo,
      e le ginocchia vogliono piegarsi lo stesso, ed è la cosa che ti
      spaventa di più.

      {magia Media} Il Mana qui gira in tondo intorno all'altare, come
      l'acqua intorno a uno scarico. Tutto il villaggio, con le sue
      distanze sbagliate, scivola verso quel punto.

      Intorno all'altare l'aria si increspa. Per il tempo di un passo vedi
      il villaggio intero e pulito, con la gente sulle soglie e il fumo dai
      camini, e poi torna com'era. Dalla foschia lattiginosa che sale dalla
      terra prendono forma tre corpi. Uno ha un braccio con troppe
      articolazioni e un altro ha due profili sovrapposti sulla stessa
      faccia. Il terzo si muove prima di avere finito di formarsi. Quando
      alzi la mano la alzano anche loro con un attimo di ritardo, piegando
      il polso dalla parte sbagliata. *Stanno imparando da me.* Ai piedi
      dell'altare, sulla terra dura, c'è una tazza di latta uguale a quella
      del pozzo.

      {rissa Media} Copiano, e chi copia arriva sempre dopo. Il polso
      piegato al contrario è un'articolazione che non regge un colpo
      dritto.
    opzioni:
      - testo: "Affrontare le sagome"
        descrizione: "Sono tre e copiano ogni tuo gesto. Lo copiano male, e forse è lì che si colpiscono."
        quando: [villaggio.vinto == 0]
        combattimento: il-cuore-del-villaggio
        vittoria:
          titolo: L'altare aperto
          testo: |
            L'ultima sagoma si disfa a metà di un tuo gesto, mentre ancora
            cerca di ripeterlo, e la foschia ricade sulla terra come farina.
            Colpisci l'altare finché la pietra scura non si apre lungo una
            venatura. Dentro c'è un nucleo dei Precursori che manda una luce
            lattiginosa, con intorno altri pezzi di macchina e un paio di gusci
            chiusi. Sulle facce interne le incisioni stanno ferme, e le ricopi
            su un lembo di camicia prima che ricomincino a muoversi.

            {tecnologia Media} I pezzi intorno al nucleo hanno gli attacchi
            ancora lucidi. Facevano parte di una macchina sola, smontata con
            cura da qualcuno che sapeva dove mettere le mani.

            Esci dal villaggio con le mani che formicolano e la camicia
            strappata. Al cancelletto verde ti volti, e dal centro arriva un
            rumore lento di pietra che si richiude.
          effetti: { parte.nucleo-3: 1, parte.camera-2: 1, reperto.sigillato: 2, informazioni.segreto: 1, racconto: 1, contaminazione: 1 }
          imposta: { villaggio.vinto: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Le tue mosse
          testo: |
            Le sagome imparano in fretta. Alla fine ti parano i colpi con le
            tue parate e ti colpiscono con i tuoi colpi, solo un attimo dopo,
            compreso il vizio di abbassare la guardia a sinistra, che fino a
            oggi non sapevi di avere. Ti ritrovi a terra con la bocca
            piena di polvere grigia. Invece di finirti si stendono intorno a
            te, nella tua stessa posizione, e restano così. Ti trascini via
            carponi, e arrivi al cancelletto verde senza sapere quanto tempo è
            passato.
          effetti: { tormento: 1, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Affrontare le sagome"
        descrizione: "L'altare che avevi aperto si è richiuso, e le sagome sono tornate. Dentro la pietra, stavolta, troverai meno."
        quando: [villaggio.vinto >= 1]
        combattimento: il-cuore-del-villaggio
        vittoria:
          titolo: Quello che è ricresciuto
          testo: |
            Le sagome si disfano una dopo l'altra, e l'ultima ti saluta con il
            tuo stesso gesto, un attimo dopo che l'hai fatto tu. Apri di
            nuovo l'altare lungo la stessa venatura, e le mani trovano il punto
            da sole. Il nucleo che c'è dentro è più piccolo dell'altra volta e
            ancora tenero ai bordi, come un frutto colto in anticipo, e accanto
            c'è un solo guscio chiuso. Li prendi e te ne vai senza voltarti,
            perché sai già che cosa vedresti.
          effetti: { parte.nucleo-2: 1, reperto.sigillato: 1, contaminazione: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Ti conoscono
          testo: |
            Stavolta le sagome sanno già come ti muovi, e ti anticipano invece
            di inseguirti. Finisci a terra con la faccia nella polvere grigia,
            e loro si stendono accanto a te nella stessa posa, ad aspettare che
            ti rialzi. Ti rialzi molto più tardi, con un fianco che pulsa e la
            polvere fin dentro le orecchie, e risali fino al cancelletto verde
            tenendoti ai muri.
          effetti: { tormento: 1, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Mettere le mani sull'altare"
        descrizione: "La pietra dà qualcosa a chi la tocca, e qualcosa si prende in cambio. Ci vuole una testa salda."
        prova: { attributo: mentale, abilita: [resilienza, magia], difficolta: Difficile }
        successo:
          titolo: Quello che l'altare dà
          testo: |
            Appoggi i palmi sulla pietra, e le venature lattiginose ti salgono
            incontro come pesci al pelo dell'acqua. La pressione alla testa si
            apre di colpo, con il sollievo di uno starnuto trattenuto troppo a
            lungo, e le sagome si inginocchiano tutte insieme, in ritardo.
            Quando stacchi le mani hai fra le dita un nucleo dei Precursori che
            prima non c'era, tiepido, che sussurra mezze parole. Sotto le
            unghie ti è rimasta una polvere grigia che non si lava. Esci dal
            villaggio camminando piano, e le case ti lasciano passare.

            {resilienza Difficile} Le mezze parole cercano di finire le frasi
            dentro la tua testa. Per ora riesci a lasciarle a metà.
          effetti: { parte.nucleo-2: 1, contaminazione: 1.5, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Quello che l'altare prende
          testo: |
            Appoggi i palmi sulla pietra, e la pietra non ti lascia più andare.
            Le venature grigie ti salgono sotto la pelle dei polsi, fredde come
            acqua di pozzo. Per un tempo lunghissimo nella testa hai soltanto la
            pressione, senza un pensiero, nemmeno il tuo nome. Quando riesci a
            staccarti cadi all'indietro sulla terra dura, e le sagome cadono
            con te, nella stessa posa. Scappi, e ti fermi solo al cancelletto
            verde, con le vene dei polsi ancora troppo chiare.
          effetti: { contaminazione: 1.5, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Seguire le incisioni con lo sguardo"
        descrizione: "Le incisioni cambiano posto mentre le guardi. Se riesci a starci dietro, forse ti mostrano qualcosa."
        prova: { attributo: mentale, abilita: [magia, accademiche], difficolta: Media }
        successo:
          titolo: Il villaggio com'era
          testo: |
            Segui una linea incisa e poi un'altra, e lasci che la pressione
            alla testa faccia quello che vuole. Vedi il villaggio pieno di
            gente, con il fornaio sulla porta della bottega e una donna che
            chiama Mirta da una finestra, alzando la voce come si fa alla
            terza chiamata. Poi vedi il pozzo che una notte si riempie di acqua
            limpidissima, e sotto il pozzo, molto più in basso, una sala dei
            Precursori intera, con il metallo lucido e una macchina che ripete
            il villaggio casa per casa, a memoria. Torni in te in ginocchio,
            con il naso che sanguina e le sagome inginocchiate intorno, e te ne
            vai con quella sala chiara in testa.

            {accademiche Difficile} Le cronache della Gilda parlano di sale dei
            Precursori sotto la Superficie che continuano a lavorare da sole.
            Nessuna parla di una sala che si è messa a ricordare.
          effetti: { informazioni.segreto: 1, tormento: 1.5 }
          vai: superficie-fratturata
        fallimento:
          titolo: Le linee
          testo: |
            Le incisioni scappano a ogni sguardo, e tu le insegui finché non ti
            accorgi di tracciarle con il dito sulla terra, e poi con l'unghia
            sul dorso della mano, fino a farla sanguinare, con la cura di un
            copista. Le sagome fanno lo stesso sulle loro mani, che non
            sanguinano. Te ne vai di corsa, e per tutta la strada fino al
            cancelletto le linee ti restano stampate negli occhi.
          effetti: { tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Voltare le spalle e andarsene"
        descrizione: "L'altare non ti chiede niente. Puoi andartene da dove sei venuto."
        costo: 0
        esito:
          titolo: Il cancelletto verde
          testo: |
            Volti le spalle all'altare, e le sagome voltano le spalle a te, un
            attimo dopo. Riprendi la strada da cui sei venuto e la trovi più
            corta di come la ricordavi, con le case che ti scorrono accanto
            senza farsi notare, educate come vicini che hanno deciso di non
            salutare. Al cancelletto verde ti accorgi di avere le spalle sciolte per
            la prima volta da ore, e ti viene quasi da ridere.
          vai: superficie-fratturata
      - testo: "Congedarti come un ospite"
        descrizione: "Le sagome copiano ogni tuo gesto. Se fai quello di un ospite che ringrazia e se ne va, forse lo copia anche il villaggio. Bisogna farlo bene, perché lo rifanno uguale."
        prova: { attributo: sociale, abilita: [galateo, persuasione, espressivita], difficolta: Difficile }
        successo:
          titolo: Il dono dell'ospite
          testo: |
            Ti togli la polvere dalle maniche e ti inchini verso l'altare, con
            calma, come si ringrazia la padrona di casa alla fine di una cena.
            Dici ad alta voce che è stato un piacere e che la strada del ritorno
            la conosci, e ti sorprendi a pensarlo un poco davvero. Le tre
            sagome si inchinano con un attimo di ritardo, piegate dalla parte
            sbagliata. Poi la pietra scura si apre da sola lungo una venatura,
            e dentro ci sono una camera di cristallo attraversata da vene di
            luce e un guscio sigillato. Li prendi ringraziando ancora, e le case
            ti lasciano passare fino al cancelletto verde.

            {galateo Media} Un ospite che se ne va bene riceve il dono di
            commiato. Il villaggio è vuoto da chissà quanto, ma le buone
            maniere se le ricorda meglio dei suoi abitanti.
          effetti: { parte.camera-2: 1, reperto.sigillato: 1, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'inchino sbagliato
          testo: |
            Ti inchini, ma a metà ti viene il dubbio di averlo cominciato dalla
            parte sbagliata, e le sagome copiano anche il dubbio. Si piegano e si
            raddrizzano, e ogni volta lo fanno un po' più vicine a te, con la
            premura di padroni di casa che non ti lasceranno andare senza il
            dolce. Quando una ti posa la mano sulla nuca per accompagnare
            l'inchino fino in fondo, il freddo della Marea ti scende lungo la
            schiena. Esci dal villaggio camminando curvo, e al cancelletto
            verde ti raddrizzi a fatica.
          effetti: { tormento: 1.5, contaminazione: 1.5 }
          vai: superficie-fratturata
      - testo: "Aprire l'altare come un reperto"
        descrizione: "Sulle piattaforme i reperti chiusi si aprono lungo la giuntura che si muove, mai dove sembra più facile. Quelle venature si muovono, e una sarà la giuntura."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: La giuntura
          testo: |
            Giri intorno all'altare finché non trovi la venatura che si muove
            meno delle altre, e ci infili la punta della lama come in un
            reperto delle piattaforme. La pietra scura si apre di un dito, con
            uno sbuffo di foschia lattiginosa che ti prende in faccia prima che
            tu riesca a voltarla. Dentro c'è un nucleo dei Precursori tiepido,
            che sussurra mezze parole. Lo tiri fuori con due dita, e le sagome
            si inginocchiano tutte insieme, in ritardo, come apprendisti che
            hanno visto fare il lavoro giusto.

            {tecnologia Media} Il nucleo era tenuto in sede da un incastro a
            pressione, roba che sulla Cicatrice si vede solo nei reperti
            migliori. Chi l'ha messo lì contava di tornare a prenderlo.

            Esci dal villaggio con gli occhi che bruciano e una polvere grigia
            sotto le unghie che non si lava.
          pe: { tecnologia: 5 }
          effetti: { parte.nucleo-2: 1, contaminazione: 1.5, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La giuntura sbagliata
          testo: |
            Infili la lama nella venatura che ti sembrava giusta, e la venatura
            si chiude sulla lama e poi sulle dita. Il freddo della Marea ti
            sale sotto la pelle dei polsi, e per un tempo lunghissimo non
            riesci a tirare via la mano. Quando finalmente la pietra ti lascia
            cadi all'indietro sulla terra dura, e le sagome cadono con te,
            nella stessa posa. Scappi fino al cancelletto verde, con le vene
            dei polsi troppo chiare.
          effetti: { contaminazione: 1.5, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ascoltare il villaggio come si ascolta il Bosco"
        descrizione: "Al Circolo un posto si ascolta prima di guardarlo. Il villaggio ha un suo respiro, e passa tutto da quella pietra."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Sotto il pozzo
          testo: |
            Ti siedi sulla terra dura a occhi chiusi e lasci che la
            pressione alla testa salga, come nel Bosco quando aspetti che gli
            uccelli si dimentichino di te. Il villaggio respira piano, e ogni
            volta l'aria passa sotto l'altare. Lo segui giù, sotto il pozzo, fino a
            una sala dei Precursori intera, con il metallo lucido e una
            macchina che ripete il villaggio casa per casa, a memoria, compresi
            i gerani secchi sui davanzali. Torni in te con il naso che sanguina
            e le sagome sedute intorno, a occhi chiusi come te.

            {natura Media} Nessuna pianta cresce qui perché la macchina si
            ricorda le case e si è dimenticata dell'erba.
          pe: { natura: 5 }
          effetti: { informazioni.segreto: 1, tormento: 1.5 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il sonno del villaggio
          testo: |
            Ti siedi e ascolti, e dopo un poco ti accorgi che stai respirando
            con il villaggio, lento come un uomo che dorme, e che le sagome
            fanno lo stesso con te. Ti alzi di scatto e corri fino al
            cancelletto verde, e per tutta la strada devi ricordarti di
            decidere tu dove mettere i piedi, un passo alla volta, come si fa
            con un animale da tenere a bada.
          effetti: { tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Benedire il villaggio e prendere congedo"
        descrizione: "Le sagome copiano ogni gesto. Il Velo ha un gesto per congedarsi dalle case dei morti, e qui nessuno l'ha mai fatto."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [empatia, accademiche], difficolta: Difficile }
        successo:
          titolo: La benedizione delle case
          testo: |
            Alzi la mano verso l'altare e dici le parole che il Velo usa per
            le case rimaste vuote, a voce bassa, senza saltare l'inchino. Le
            sagome alzano la mano un attimo dopo di te e piegano il polso
            dalla parte sbagliata. L'inchino invece lo fanno giusto. La pietra
            scura si apre da sola lungo una venatura, e dentro ci sono una
            camera di cristallo attraversata da vene di luce e un guscio
            sigillato. Li prendi come si prende un'offerta lasciata sul
            sagrato, e le case ti lasciano passare fino al cancelletto verde.

            {empatia Media} Nessuno aveva mai salutato questa gente. Il
            villaggio aspettava soltanto che qualcuno lo facesse.
          pe: { empatia: 5 }
          effetti: { parte.camera-2: 1, reperto.sigillato: 1, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Le parole a metà
          testo: |
            A metà della benedizione le parole ti si impastano in bocca, come
            la sera del Festival sotto il palco, e le sagome copiano anche
            l'esitazione. Si piegano e si raddrizzano sempre più vicine, finché
            una ti posa la mano sulla nuca per accompagnare l'inchino fino in
            fondo, e il freddo della Marea ti scende lungo la schiena. Esci dal
            villaggio camminando curvo, e al cancelletto verde ti raddrizzi a
            fatica.
          effetti: { tormento: 1.5, contaminazione: 1.5 }
          vai: superficie-fratturata
