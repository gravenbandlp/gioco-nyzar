# Il villaggio storto, spedizione della Superficie Fratturata (tabella degli incontri, 49 Villaggio instabile).
# Ci si entra dallo storylet "Un villaggio in lontananza" (Superficie, ripetibile, senza requisiti).
# Le stanze vanno in fasce di profondità, e una stanza superata non ricompare nella stessa visita:
# 0 l'arrivo (la porta troppo alta; 20 l'ombra fuori tempo, che vale anche a 1), 1 la piazzetta (23 il pozzo;
# 32 il vento fra le case, che vale da 1 a 3), 2 dentro le case (16 lo specchio, la tavola apparecchiata),
# 3 l'ultima strada (30 l'uomo che ti aspettava). Il cuore a 4 è il centro del villaggio (42 l'altare, 2 le
# sagome): si può rifare, e la prima vittoria rende di più (villaggio.vinto). Ogni ramo riporta in Superficie.
# In fondo al cuore, congedarsi come un ospite (Sociale, Difficile): camera-2 e un reperto, senza toccare villaggio.vinto.
quality:
  - { id: villaggio.vinto, nome: Hai aperto l'altare del villaggio storto, categoria: stato, nascosta: true, descrizione: "1 dopo la prima vittoria sulle sagome al centro del villaggio storto. Le visite seguenti rendono meno." }

aree:
  - id: villaggio-storto
    immagine: ambientazione/laresh
    nome: Il villaggio storto
    sommario: "Un villaggio vuoto che sulle mappe della Gilda non c'è, dove le misure delle cose sembrano sbagliate."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Una trentina di case di pietra e di legno, con i tetti a posto, stanno
      strette intorno a una strada sola e a un campanile basso, e per la
      strada non passa nessuno. Da vicino le misure non tornano, perché una
      casa che sembrava a dieci passi ne chiede trenta e l'occhio continua a
      correggere quello che vede finché le tempie non pulsano. Sui muri c'è
      una fila di omini a gesso che si tengono per mano, undici contati da
      sinistra e dodici da destra.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: villaggio-in-lontananza
    immagine: ambientazione/laresh
    titolo: Un villaggio in lontananza
    sommario: "Dal bordo di un pianoro si vede un villaggio intatto, dove le mappe della Gilda non segnano niente."
    luogo: Superficie Fratturata, sul bordo di un pianoro di ghiaia
    area: superficie-fratturata
    ripetibile: true
    testo: |
      Dal bordo del pianoro, dove il sentiero dei carri piega verso le
      terrazze, vedi in fondo alla conca una trentina di case con i tetti
      interi e un campanile basso. Dai camini non esce fumo, e sulle mappe
      della Gilda qui c'è soltanto il segno della ghiaia.

      {origine mercante-dei-ponti} Ai Ponti lo sanno tutti che i cartografi
      mettono la ghiaia dove non sono passati di persona.

      In fondo alla discesa c'è un cancelletto con la vernice verde ancora
      lucida. *Qualcuno l'ha ridipinto quest'anno.* Il vento risale la conca
      con un odore leggero di ozono.
    opzioni:
      - testo: "Scendere verso il villaggio"
        descrizione: "Le case sembrano a un quarto d'ora di cammino, e la discesa è facile."
        costo: 1
        esito:
          titolo: La discesa
          testo: |
            Il cancelletto verde gira senza un cigolio. Le case che avevi stimato
            a un quarto d'ora dopo mezz'ora hanno ancora la stessa grandezza.
            Quando le raggiungi hai le gambe dure come dopo una salita, e il
            cancelletto è molto più vicino di quanto dovrebbe.
          vai: villaggio-storto
      - testo: "Girarci al largo"
        descrizione: "Il sentiero dei carri passa oltre la conca, e le case restano dove sono."
        costo: 0
        esito:
          titolo: Al largo
          testo: |
            Riprendi il sentiero dei carri e tieni il villaggio sulla sinistra
            finché una piega del terreno non lo nasconde. Continui a voltarti per
            un buon tratto, e le spalle ti si sciolgono soltanto quando il vento
            gira e l'odore di ozono se ne va.
      - testo: "Scendere tenendo il conto come al banco"
        descrizione: "Una mappa che segna ghiaia al posto di trenta case ha sbagliato i conti, da rifare a voce alta."
        quando: [origine.mercante-dei-ponti >= 1]
        costo: 1
        esito:
          titolo: Il conto delle case
          testo: |
            Scendi contando a mezza voce, come quando rifai i conti di un
            fornitore che ti ha già imbrogliato. Le case a ogni curva sono una in
            più o una in meno, e segni lo stesso il conto che non torna, per avere
            qualcosa da contestare. Arrivi con le gambe pesanti, e il cancelletto
            alle tue spalle è molto più vicino di quanto dovrebbe.
          pe: { percezione: 2 }
          vai: villaggio-storto

  # ------------------------------------------------------------ 0 · l'arrivo
  - id: villaggio-la-porta-alta
    immagine: ambientazione/laresh
    titolo: La porta troppo alta
    sommario: "La prima casa ha una porta alta il doppio di un uomo e una finestra stretta come una mano."
    luogo: Il villaggio storto, all'inizio della strada
    area: villaggio-storto
    ripetibile: true
    requisiti: [profondita.villaggio-storto == 0]
    testo: |
      La prima casa, intonacata di bianco, ha una porta socchiusa alta il
      doppio di un uomo e accanto una finestra stretta quanto una mano
      aperta. Sulla soglia sono appaiati due zoccoletti da bambino con le
      punte verso la strada.

      {empatia Facile} Li ha messi lì una madre, la sera, perché il bambino
      la mattina li trovasse pronti.

      Dal muretto alla porta ci sono dieci passi, a occhio. Ne fai dieci e la
      porta è ancora lontana, come su una scala con un gradino in meno.
    opzioni:
      - testo: "Contare i passi a voce alta"
        descrizione: "Se le misure sbagliano, almeno il conto lo tieni tu."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Trentuno
          testo: |
            Conti a voce alta con gli occhi sugli stivali, come un maestro davanti
            a una classe assente. Al trentunesimo passo la mano trova lo stipite,
            e quando ti volti il muretto è a dieci passi giusti.
          effetti: { profondita.villaggio-storto: 1 }
        fallimento:
          titolo: Il conto che scappa
          testo: |
            Arrivato a venti ti accorgi di aver detto diciotto due volte, e
            ricominci. La terza volta che ricominci sei di nuovo al muretto, con
            la gola secca e la porta lontana come prima.
          effetti: { tormento: 1 }
      - testo: "Guardare dentro la porta socchiusa"
        descrizione: "La stanza dietro la porta è in ombra e dovrebbe essere piccola, come la casa."
        prova: { attributo: mentale, abilita: percezione, difficolta: Facile }
        successo:
          titolo: Il fermaporta
          testo: |
            Spingi la porta con due dita. Dentro c'è una cucina qualunque, e a
            tenere aperta la porta c'è una scheggia di metallo precuriano grande
            come un mattone, perché in campagna una cosa pesante trova sempre un
            lavoro. La sollevi, ed esci dal retro su un vicolo che porta più
            dentro il villaggio.
          effetti: { profondita.villaggio-storto: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: La cucina lunga
          testo: |
            Dentro c'è una cucina con il focolare su una parete di fondo più
            lontana di quanto la casa sia lunga, che si allontana ancora mentre la
            guardi. Indietreggiando urti gli zoccoletti, e li rimetti a posto con
            le mani che tremano, le punte verso la strada.
          effetti: { tormento: 1 }
      - testo: "Fare il giro dietro gli orti"
        descrizione: "Lontano dalla strada le case sono soltanto muri, però il giro è lungo e i muretti alti."
        costo: 2
        esito:
          titolo: Gli orti
          testo: |
            Scavalchi il muretto e passi dietro le case, fra cavoli andati a seme
            e uno spaventapasseri con il cappello di paglia legato sotto il mento.
            I muretti sono più alti di come sembravano, e rientri sulla strada più
            avanti con i palmi sbucciati.
          effetti: { profondita.villaggio-storto: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 0–1 · fra le case
  - id: villaggio-l-ombra-fuori-tempo
    immagine: ambientazione/marea-grigia
    titolo: L'ombra fuori tempo
    sommario: "Fra due case, sul muro in pieno sole, un'ombra si sposta per conto suo."
    luogo: Il villaggio storto, un vicolo fra due case
    area: villaggio-storto
    ripetibile: true
    requisiti: [profondita.villaggio-storto <= 1]
    testo: |
      Nel vicolo fra le due case è tesa una corda da bucato con tre camicie
      e una calza sola, rigide di polvere. Sul muro in pieno sole un'ombra
      alta quanto un uomo, un poco curva, scivola fra le pietre senza niente
      che la proietti, e quando la guardi dritta non c'è più. La mano ti è
      già andata alla cintura.

      {armi-da-mischia Facile} Se fosse un uomo sarebbe a sei passi con il
      fianco sinistro scoperto, e il problema è tutto in quel se.
    opzioni:
      - testo: "Tirare dritto senza voltarsi"
        descrizione: "Un'ombra è un'ombra, basta convincersene fino in fondo al vicolo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: In fondo al vicolo
          testo: |
            Tieni gli occhi sulla fine del vicolo e cammini al passo di sempre, o
            quasi. Con la coda dell'occhio la vedi due volte un passo dietro di te
            e riesci a non guardarla, eppure solo sulla strada larga ti accorgi di
            avere i pugni chiusi.
          effetti: { profondita.villaggio-storto: 1 }
        fallimento:
          titolo: Voltarsi
          testo: |
            A metà vicolo ti volti di scatto. Il muro è vuoto, e la tua ombra ci
            arriva un momento dopo di te, come se avesse dovuto rincorrerti. Torni
            all'imbocco del vicolo camminando all'indietro, senza staccarle gli
            occhi di dosso, e sbatti la schiena contro la corda del bucato.
          effetti: { tormento: 1 }
      - testo: "Colpire l'ombra sul muro"
        descrizione: "Se c'è qualcosa se ne accorgerà, e se non c'è niente il villaggio sentirà il rumore."
        prova: { attributo: fisico, abilita: [armi-da-mischia, rissa], difficolta: Facile }
        successo:
          titolo: La crepa
          testo: |
            Colpisci il muro dove l'ombra si è fermata, e la pietra si apre in una
            crepa in cui l'ombra scivola come acqua in uno scolo. Nella crepa
            resta incastrata una scheggia tiepida di metallo grigio. Alle finestre
            non si affaccia nessuno.
          effetti: { profondita.villaggio-storto: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il muro
          testo: |
            Colpisci il muro, e il muro ti restituisce il colpo fino al gomito.
            Dell'ombra non c'è più traccia, e il rumore torna indietro dalle case
            di fondo più forte e un poco in ritardo, mentre una finestra al primo
            piano sbatte da sola. Ti massaggi il polso, e l'anulare si chiude
            controvoglia.
          effetti: { ferite: 0.5 }
      - testo: "Seguire l'ombra fra le case"
        descrizione: "Ci perdi tempo, e l'ombra conosce il villaggio meglio di te."
        costo: 2
        esito:
          titolo: Dietro l'ombra
          testo: |
            La segui per vicoli che girano sempre a sinistra, e dopo il quarto
            giro dovresti essere al punto di partenza. Invece sei più dentro il
            villaggio di quanto avresti voluto, con un dolore sopra l'occhio
            destro.
          effetti: { profondita.villaggio-storto: 1, tormento: 1 }

  # ------------------------------------------------------------ 1 · la piazzetta
  - id: villaggio-il-pozzo
    immagine: ambientazione/laresh
    titolo: Il pozzo della piazzetta
    sommario: "In una piazzetta c'è un pozzo con la carrucola ancora al suo posto, e l'acqua che sale è limpidissima."
    luogo: Il villaggio storto, la piazzetta del pozzo
    area: villaggio-storto
    ripetibile: true
    requisiti: [profondita.villaggio-storto == 1]
    testo: |
      La strada si allarga in una piazzetta con un pozzo nel mezzo, il bordo
      lisciato dai gomiti di chi aspettava il secchio e una tazza di latta
      legata con una catenella. Cali il secchio quasi per abitudine e lo
      tiri su colmo di un'acqua così limpida che il fondo sembra asciutto,
      senza odore. Hai la gola secca da quando sei sceso dal pianoro.

      {origine figlio-del-circolo} Il Circolo insegna ai bambini a diffidare
      delle fonti che non sanno di niente.

      {natura Media} Un pozzo così fondo dovrebbe sapere di pietra, e il
      secchio ha perso perfino il suo odore di ruggine.
    opzioni:
      - testo: "Bere e riposare sul bordo"
        descrizione: "Sulla Superficie l'acqua pulita è rara, e questa forse è troppo pulita."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Acqua di pozzo
          testo: |
            Ne bevi un sorso con la lingua attenta di un assaggiatore, poi un
            altro, ed è acqua fredda di pozzo e basta. Mentre riposi sul bordo,
            dall'altra parte della piazzetta una porta si richiude piano, e decidi
            che è stato il vento. Quando riparti le gambe ti reggono meglio.
          effetti: { profondita.villaggio-storto: 1, ferite: -0.5 }
        fallimento:
          titolo: Il sapore
          testo: |
            Al primo sorso l'acqua non ha sapore. Al secondo ti lascia in bocca il
            ferro e l'ozono, e sulla lingua una patina grigia che non va via
            nemmeno sputando. Resti piegato sul bordo del pozzo finché la nausea
            non passa, a guardare la tua faccia nel secchio, che ti guarda
            preoccupata.
          effetti: { contaminazione: 1 }
      - testo: "Calare il secchio fino al fondo"
        descrizione: "La corda è lunga, e nei pozzi a volte finisce quello che la gente perde."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Quello che c'era in fondo
          testo: |
            Lasci correre la corda finché il secchio non tocca qualcosa di duro, e
            lo fai strisciare sul fondo finché non si impiglia. Tirarlo su ti
            costa la pelle dei palmi. Dentro, nell'acqua limpida, c'è un guscio di
            metallo grande come un pugno, senza una giuntura.
          effetti: { profondita.villaggio-storto: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La corda lunga
          testo: |
            La corda continua a scendere molto oltre il punto in cui il secchio
            aveva toccato l'acqua, oltre la lunghezza che un pozzo può avere.
            Quando ti decidi a tirarla su hai le braccia di pietra, e il secchio
            arriva pieno di una nebbia grigia che trabocca lenta e si sfilaccia
            fra le tue dita.
          effetti: { tormento: 1, contaminazione: 1 }
      - testo: "Attraversare la piazzetta senza fermarsi"
        descrizione: "Il pozzo resta dov'è, e la sete te la tieni."
        costo: 2
        esito:

          titolo: La sete
          testo: |
            Rimetti il secchio sul bordo e attraversi la piazzetta con la sete che
            ti gratta la gola. Dietro di te il secchio gocciola sul lastricato con
            un ritmo regolare, e all'angolo ti accorgi che le gocce continuano,
            anche se ormai dovrebbe essere vuoto da un pezzo.
          effetti: { profondita.villaggio-storto: 1 }

  # ------------------------------------------------------------ 1–3 · le strade sotto il campanile
  - id: villaggio-il-vento-fra-le-case
    immagine: ambientazione/laresh
    titolo: Il vento fra le case
    sommario: "Fra le case il vento fa un suono che somiglia a una voce, e dal campanile suona una campana ferma."
    luogo: Il villaggio storto, una strada stretta sotto il campanile
    area: villaggio-storto
    ripetibile: true
    requisiti: [profondita.villaggio-storto >= 1, profondita.villaggio-storto <= 3]
    testo: |
      La strada si stringe fra case alte, e il vento, entrando di traverso,
      diventa un suono lungo che sale e scende come una canzone a bocca
      chiusa, a tratti simile a una voce che chiama. Sopra i tetti la campana
      è ferma nella sua cella, eppure a ogni folata ti arriva un rintocco
      basso.

      Su un davanzale, fra i vasi di basilico secco, uno ha un cartellino
      scritto a mano, *di Mirta, non toccare*, rispettato da tutti, compreso
      chi doveva annaffiarlo.
    opzioni:
      - testo: "Tapparsi le orecchie e passare oltre"
        descrizione: "È il vento, e basta non starlo a sentire."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Facile }
        successo:
          titolo: Le dita nelle orecchie
          testo: |
            Ti premi le dita nelle orecchie e cammini contando i passi, con i
            gomiti alti come un bambino che non vuole sentire la predica. Il suono
            attutito rallenta quando rallenti tu, però lo lasci dietro l'angolo, e
            per un pezzo ti resta nelle orecchie un fischio sottile tutto tuo.
          effetti: { profondita.villaggio-storto: 1 }
        fallimento:
          titolo: Il ritornello
          testo: |
            Ti tappi le orecchie, e il suono ti arriva dalle ossa del cranio, più
            chiaro di prima. Ti scopri a canticchiarlo a bocca chiusa con
            un'intonazione perfetta e smetti soltanto quando ti mordi la lingua
            apposta, fermo nel punto da cui eri partito.
          effetti: { tormento: 1 }
      - testo: "Fermarsi ad ascoltare"
        descrizione: "Potrebbe essere il vento, oppure dire qualcosa che vale la pena sapere."
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: La sillaba
          testo: |
            Resti con la schiena al muro e ascolti finché il freddo della pietra
            non ti passa la giubba. Il suono nasce nelle fessure fra le case,
            accordate come le canne di un organo, e la voce ripete sempre la
            stessa sillaba, l'inizio di un nome che non arriva mai alla fine.

            {magia Difficile} Qualcosa ha tirato le fessure una per una alla
            misura giusta, perché il vento dicesse quella sillaba.
          effetti: { profondita.villaggio-storto: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il tuo nome
          testo: |
            Ascolti, e dopo un poco la voce pronuncia il tuo nome con la cadenza
            un po' strascicata che usi tu la sera. Rispondi prima di potertelo
            impedire, e il vento cala di colpo, con il tuo «sì» che rimbalza
            ancora fra le case.
          effetti: { tormento: 1.5 }
      - testo: "Fare il giro sottovento"
        descrizione: "Dietro le case il vento tace, e ci sono muretti da scavalcare e orti da attraversare."
        costo: 2
        esito:
          titolo: Sottovento
          testo: |
            Giri dietro le case, dove il suono arriva come un ronzio lontano. Fra
            gli orti infili il piede in un secchio sepolto fra i cavoli, messo lì
            da qualcuno con un senso dell'umorismo che non condividi, e rientri
            sulla strada con una caviglia che protesta.
          effetti: { profondita.villaggio-storto: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · dentro le case
  - id: villaggio-lo-specchio
    immagine: ambientazione/marea-grigia
    titolo: Lo specchio in ritardo
    sommario: "In una casa vuota c'è uno specchio incrinato, e il tuo riflesso si muove un attimo dopo di te."
    luogo: Il villaggio storto, una camera da letto
    area: villaggio-storto
    ripetibile: true
    requisiti: [profondita.villaggio-storto == 2]
    testo: |
      La porta socchiusa dà su una camera da letto con il letto rifatto, e
      sopra la cassapanca è appeso uno specchio grande quanto un'anta
      d'armadio, incrinato in diagonale, con un biglietto infilato nella
      cornice, *ricordati il pane*.

      Quando alzi una mano il riflesso la alza un battito di palpebre dopo
      di te, e quando ti fermi si ferma in ritardo. *Lo fa apposta per
      vedere se te ne accorgi.* Dietro il riflesso, nello specchio, il letto
      è disfatto.

      {resilienza Media fallita} Il riflesso deglutisce dopo di te, e adesso
      anche la tua gola ti sembra in ritardo.
    opzioni:
      - testo: "Passare davanti allo specchio senza guardarlo"
        descrizione: "È uno specchio rotto in una casa vuota, e la stanza si attraversa in pochi passi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Facile }
        successo:
          titolo: La porta sul retro
          testo: |
            Attraversi la stanza con gli occhi fissi sulle assi del pavimento, e
            con la coda dell'occhio vedi il riflesso camminare accanto a te, un
            passo indietro. La porta sul retro dà su un cortile e il cortile su
            un'altra strada, più vicina al campanile.
          effetti: { profondita.villaggio-storto: 1 }
        fallimento:
          titolo: Fermo
          testo: |
            A metà stanza ti fermi per vedere quanto ci mette il riflesso a
            fermarsi, e ogni volta che riprovi ci mette un poco di più. Esci dalla
            porta da cui sei entrato, e solo in strada ti accorgi che stai ancora
            alzando e abbassando la mano.
          effetti: { tormento: 1 }
      - testo: "Studiare il ritardo"
        descrizione: "Un ritardo si misura, e misurandolo forse capisci da dove viene."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La cassapanca
          testo: |
            Muovi la mano a scatti e conti, con la serietà di un agrimensore,
            finché capisci che il ritardo è più lungo proprio sopra la cassapanca.
            La apri, e fra le lenzuola piegate c'è un guscio di metallo freddo
            senza una giuntura, che il riflesso ci mette un po' a prendere.
          effetti: { profondita.villaggio-storto: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: In anticipo
          testo: |
            Muovi la mano a scatti e conti, finché il conto non torna più. Il
            riflesso ha abbassato la mano mentre la tua è ancora alzata, e aspetta
            paziente che tu lo raggiunga. Resti con il braccio a mezz'aria finché
            non trovi il coraggio di abbassarlo e di uscire.
          effetti: { tormento: 1.5 }
      - testo: "Rompere lo specchio"
        descrizione: "Un colpo e via, anche se il vetro è spesso e taglia."
        esito:
          titolo: I pezzi
          testo: |
            Lo colpisci con il gomito, e lo specchio cade a pezzi sulla
            cassapanca. Ogni pezzo ti mostra un frammento di faccia che si gira
            verso di te un attimo dopo, mentre il biglietto del pane pende storto
            dalla cornice vuota. Esci dal retro con un taglio sull'avambraccio che
            sanguina più di quanto dovrebbe.
          effetti: { profondita.villaggio-storto: 1, ferite: 0.5 }

  - id: villaggio-la-tavola-apparecchiata
    immagine: ambientazione/laresh
    titolo: La tavola apparecchiata
    sommario: "In una cucina la tavola è apparecchiata per quattro, e dalla zuppiera sale ancora il vapore."
    luogo: Il villaggio storto, la cucina di una casa
    area: villaggio-storto
    ripetibile: true
    requisiti: [profondita.villaggio-storto == 2]
    testo: |
      La cucina ha la tavola apparecchiata per quattro, con le sedie
      scostate come se la famiglia si fosse appena alzata e un filo di
      vapore che sale dalla zuppiera. A capotavola c'è una scodella rimessa
      insieme con due graffe di metallo, e una delle sedie ha lo schienale
      alto fino alla trave.

      {origine fuggiasco-di-ghoran} La mano infila in tasca una fetta di
      pane prima che tu le dia il permesso, come il giorno del Festival.

      {resistenza Facile fallita} Quand'è stata l'ultima volta che hai
      mangiato una cosa calda? Il corpo lo sa, e te lo ricorda ad alta voce.
    opzioni:
      - testo: "Sedersi a mangiare"
        descrizione: "È zuppa calda e ne hai bisogno, anche se viene da una cucina dove non cucina nessuno."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: Zuppa di cipolle
          testo: |
            Ti siedi davanti alla scodella con le graffe, perché è quella che
            sembra aspettare qualcuno. È la zuppa che ti facevano da bambino, con
            la crosta di pane sopra, e non ricordavi di ricordarla. Quando ti alzi
            anche le altre tre scodelle sono vuote, e ti senti meglio di quanto
            vorresti.
          effetti: { profondita.villaggio-storto: 1, ferite: -0.5 }
        fallimento:
          titolo: Il brodo grigio
          testo: |
            Al terzo cucchiaio il brodo ti lascia in bocca il sapore metallico
            della Marea, e quello che sputi è grigio e lento. Passi un brutto
            quarto d'ora piegato sull'acquaio, e quando ti tiri su la zuppiera ha
            ripreso a fumare.
          effetti: { contaminazione: 1.5 }
      - testo: "Frugare nella credenza"
        descrizione: "Le famiglie tengono le cose buone in alto, dietro i barattoli."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il barattolo dello zucchero
          testo: |
            Dietro i barattoli della farina ce n'è uno di latta con la scritta
            *zucchero*, e dentro, avvolte in uno straccio, ci sono due schegge di
            metallo precuriano, il tesoretto di casa nascosto nel primo posto dove
            guarderebbe un ladro. Le prendi chiedendo scusa a mezza voce a nessuno
            in particolare, ed esci dalla porta che dà sul vicolo.
          effetti: { profondita.villaggio-storto: 1, reliquie.scheggia: 2 }
        fallimento:
          titolo: Il cassetto
          testo: |
            Apri il cassetto in basso, e il cassetto è più profondo della
            credenza. Ci infili il braccio fino alla spalla senza toccare il
            fondo, finché qualcosa ti dà due colpetti gentili sul dorso della mano
            per dirti di smettere. Ritiri il braccio così in fretta che ti sbucci
            le nocche.
          effetti: { tormento: 1 }
      - testo: "Uscire dalla porta sul retro"
        descrizione: "Lasci la zuppa a chi l'ha preparata, e passi in fretta."
        costo: 2
        esito:
          titolo: Le sedie
          testo: |
            Giri intorno alla tavola tenendoti lontano dalla sedia alta e apri la
            porta sul retro. Mentre la richiudi senti le sedie strisciare sul
            pavimento una dopo l'altra, e poi il tintinnio di un mestolo contro la
            zuppiera. Risali il vicolo verso il campanile senza voltarti.
          effetti: { profondita.villaggio-storto: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · l'ultima strada
  - id: villaggio-l-uomo-che-ti-aspettava
    immagine: ambientazione/laresh
    titolo: L'uomo che ti aspettava
    sommario: "Un uomo del villaggio ti viene incontro sollevato, come se ti aspettasse da ore."
    luogo: Il villaggio storto, l'ultima strada prima del centro
    area: villaggio-storto
    ripetibile: true
    requisiti: [profondita.villaggio-storto == 3]
    testo: |
      Sull'ultima strada prima del centro esce da una porta un uomo sulla
      cinquantina, con un grembiule da fornaio e la farina fino ai gomiti, e
      ti viene incontro sollevato come uno che ha ritrovato le chiavi.

      «Finalmente» dice. «Ti aspettavo da stamattina, io. Ti ho tenuto da
      parte la tua roba, eh, come d'accordo.»

      {ingannare Media} Ci crede fino in fondo, e ogni «eh» è una porta che
      ti tiene aperta perché tu ci entri.

      {origine figlio-della-citta-bassa} Nei vicoli chi ti saluta come un
      vecchio amico di solito vuole qualcosa, e questa faccia non l'hai mai
      vista.
    opzioni:
      - testo: "Chiedergli per chi ti ha preso"
        descrizione: "È un uomo che parla volentieri, e forse sa che cosa è successo al villaggio."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il fornaio
          testo: |
            Lui ride della domanda e dice che ti ha preso per te, eh, per chi
            dovrebbe prenderti. Accompagnandoti verso il centro ti parla del
            pozzo, che un mattino ha cominciato a dare un'acqua troppo buona, e
            dei vicini che uno alla volta hanno smesso di uscire di casa.
            All'ultimo angolo ti dice che da lì ci vai da solo, come d'accordo.

          effetti: { profondita.villaggio-storto: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Le risposte prima
          testo: |
            Cominci a chiedergli chi crede che tu sia, e lui risponde prima che tu
            finisca. La seconda volta risponde prima che tu cominci, e alla terza
            restate zitti tutti e due, lui con la pazienza di un fornaio che
            aspetta la lievitazione, finché ti allontani.
          effetti: { tormento: 1 }
      - testo: "Stare al gioco"
        descrizione: "Se ti ha tenuto da parte qualcosa tanto vale prenderlo, purché tu non sbagli la parte."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: La tua roba
          testo: |
            Gli dici che hai fatto tardi per la strada, e lui torna da casa con un
            fagotto di tela chiuso da un doppio nodo. «La tua roba, eh. Controlla
            pure.» Dentro c'è un guscio di metallo chiuso, pesante per la sua
            grandezza, e lui ti indica la fine della strada.
          effetti: { profondita.villaggio-storto: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La mano sulla faccia
          testo: |
            Sbagli una parola, o il modo di dirla, e lui smette di sorridere. Ti
            mette una mano sulla faccia con il pollice sullo zigomo, come per
            sentire se un bambino ha la febbre, e le sue dita grigie sotto la
            farina ti tengono fermo. Quando ti lascia andare la pelle ti brucia
            dove ti ha toccato.
          effetti: { contaminazione: 1 }
      - testo: "Tenerlo a distanza e passare oltre"
        descrizione: "Lui sa chi sei e tu di lui ignori tutto, meglio passare oltre."
        costo: 2
        esito:
          titolo: Come d'accordo
          testo: |
            Gli dici che si sbaglia e lo superi con la mano sulla cintura. Lui ti
            segue per un tratto, offeso come un amico lasciato ad aspettare,
            elencandoti le cose che ti ha tenuto da parte senza mai dire quali
            siano, e si ferma all'ultimo angolo, sul centro del villaggio. «Allora
            ci vediamo dopo, come d'accordo.»
          effetti: { profondita.villaggio-storto: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · il centro del villaggio
  - id: villaggio-il-centro
    immagine: ambientazione/marea-grigia
    titolo: Il centro del villaggio
    sommario: "Le strade del villaggio finiscono tutte su uno spiazzo di terra nuda con un altare di pietra scura."
    luogo: Il villaggio storto, il centro
    area: villaggio-storto
    requisiti: [profondita.villaggio-storto >= 4]
    testo: |
      Tutte le strade finiscono in uno spiazzo di terra crepata. In mezzo
      sta un altare basso di pietra scura, attraversato da venature
      lattiginose che si muovono appena, e le incisioni sul piano cambiano
      posto mentre le guardi.

      {origine accolito-del-velo} Questo non è un altare del Velo, e le
      ginocchia vogliono piegarsi lo stesso.

      Per il tempo di un passo vedi il villaggio intero e pulito, con il
      fumo dai camini, poi torna com'era. Dalla foschia prendono forma tre
      corpi, uno con un braccio dalle troppe articolazioni e uno con due
      profili sulla stessa faccia. Quando alzi la mano la alzano anche loro,
      un attimo dopo, piegando il polso dalla parte sbagliata. Ai piedi
      dell'altare c'è una tazza di latta uguale a quella del pozzo.

      {rissa Media} Chi copia arriva sempre dopo, e un polso piegato al
      contrario non regge un colpo dritto.
    opzioni:
      - testo: "Affrontare le sagome"
        descrizione: "Sono tre e copiano ogni tuo gesto, ma lo copiano male, e forse è lì che si colpiscono."
        quando: [villaggio.vinto == 0]
        combattimento: il-cuore-del-villaggio
        vittoria:
          titolo: L'altare aperto
          testo: |
            L'ultima sagoma si disfa a metà di un tuo gesto, e la foschia ricade
            sulla terra come farina. Colpisci l'altare finché la pietra si apre
            lungo una venatura, e dentro trovi un nucleo dei Precursori che manda
            luce lattiginosa, con intorno pezzi di macchina e un paio di gusci
            chiusi. Te ne vai, e alle tue spalle la pietra si richiude con un
            rumore lento.
          effetti: { parte.nucleo-3: 1, parte.camera-2: 1, reperto.sigillato: 2, informazioni.segreto: 1, racconto: 1, contaminazione: 1 }
          imposta: { villaggio.vinto: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Le tue mosse
          testo: |
            Le sagome imparano in fretta e alla fine ti colpiscono con i tuoi
            colpi, compreso il vizio di abbassare la guardia a sinistra, che non
            sapevi di avere. Ti ritrovi a terra con la bocca piena di polvere
            grigia, e invece di finirti si stendono intorno a te nella tua stessa
            posa. Ti trascini via carponi fino al cancelletto verde.
          effetti: { tormento: 1, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Affrontare le sagome"
        descrizione: "L'altare si è richiuso e le sagome sono tornate, e dentro la pietra stavolta troverai meno."
        quando: [villaggio.vinto >= 1]
        combattimento: il-cuore-del-villaggio
        vittoria:
          titolo: Quello che è ricresciuto
          testo: |
            Le sagome si disfano una dopo l'altra, e l'ultima ti saluta con il tuo
            stesso gesto, un attimo dopo. Apri di nuovo l'altare lungo la stessa
            venatura. Il nucleo che c'è dentro è più piccolo dell'altra volta e
            ancora tenero ai bordi, come un frutto colto in anticipo, e accanto
            c'è un solo guscio chiuso.
          effetti: { parte.nucleo-2: 1, reperto.sigillato: 1, contaminazione: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Ti conoscono
          testo: |
            Stavolta le sagome sanno già come ti muovi, e ti anticipano invece di
            inseguirti. Finisci a terra con la faccia nella polvere grigia, e loro
            si stendono accanto a te nella stessa posa. Ti rialzi molto più tardi,
            con un fianco che pulsa, e risali fino al cancelletto verde tenendoti
            ai muri.
          effetti: { tormento: 1, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Mettere le mani sull'altare"
        descrizione: "La pietra dà qualcosa a chi la tocca e si prende qualcosa in cambio, e ci vuole una testa salda."
        prova: { attributo: mentale, abilita: [resilienza, magia], difficolta: Difficile }
        successo:
          titolo: Quello che l'altare dà
          testo: |
            Appoggi i palmi sulla pietra, e le venature lattiginose ti salgono
            incontro come pesci al pelo dell'acqua. La pressione alla testa si
            apre di colpo e le sagome si inginocchiano tutte insieme, in ritardo.
            Quando stacchi le mani hai fra le dita un nucleo dei Precursori
            tiepido che sussurra mezze parole, e sotto le unghie una polvere
            grigia che non si lava.
          effetti: { parte.nucleo-2: 1, contaminazione: 1.5, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Quello che l'altare prende
          testo: |
            Appoggi i palmi sulla pietra, e la pietra non ti lascia più andare. Le
            venature grigie ti salgono sotto la pelle dei polsi, e per un tempo
            lunghissimo nella testa non hai nemmeno il tuo nome. Quando riesci a
            staccarti cadi all'indietro e scappi fino al cancelletto verde, con le
            vene dei polsi troppo chiare.
          effetti: { contaminazione: 1.5, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Seguire le incisioni con lo sguardo"
        descrizione: "Le incisioni cambiano posto mentre le guardi, e se riesci a starci dietro forse ti mostrano qualcosa."
        prova: { attributo: mentale, abilita: [magia, accademiche], difficolta: Media }
        successo:
          titolo: Il villaggio com'era
          testo: |
            Segui le linee incise una dopo l'altra. Vedi il villaggio pieno di
            gente, con una donna che chiama Mirta da una finestra. Poi il pozzo
            che una notte si riempie di acqua limpidissima, e sotto il pozzo,
            molto più in basso, una sala dei Precursori intera, con una macchina
            che ripete il villaggio casa per casa, a memoria. Torni in te in
            ginocchio, con il naso che sanguina.
          effetti: { informazioni.segreto: 1, tormento: 1.5 }
          vai: superficie-fratturata
        fallimento:
          titolo: Le linee
          testo: |
            Le incisioni scappano a ogni sguardo, e tu le insegui finché non ti
            accorgi di tracciarle con l'unghia sul dorso della mano, fino a farla
            sanguinare, con la cura di un copista. Le sagome fanno lo stesso sulle
            loro mani, che non sanguinano. Te ne vai di corsa, con le linee
            stampate negli occhi.
          effetti: { tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Voltare le spalle e andarsene"
        descrizione: "L'altare non ti chiede niente, e puoi andartene da dove sei venuto."
        costo: 0
        esito:
          titolo: Il cancelletto verde
          testo: |
            Volti le spalle all'altare, e le sagome voltano le spalle a te, un
            attimo dopo. La strada del ritorno è più corta di come la ricordavi, e
            al cancelletto verde ti accorgi di avere le spalle sciolte per la prima
            volta da ore.
          vai: superficie-fratturata
      - testo: "Congedarti come un ospite"
        descrizione: "Le sagome copiano tutto, anche il congedo di un ospite che ringrazia, purché fatto bene."
        prova: { attributo: sociale, abilita: [galateo, persuasione, espressivita], difficolta: Difficile }
        successo:
          titolo: Il dono dell'ospite
          testo: |
            Ti togli la polvere dalle maniche e ti inchini verso l'altare, come si
            ringrazia la padrona di casa alla fine di una cena. Le tre sagome si
            inchinano con un attimo di ritardo, piegate dalla parte sbagliata, e
            la pietra scura si apre da sola lungo una venatura. Dentro ci sono una
            camera di cristallo attraversata da vene di luce e un guscio
            sigillato, e le case ti lasciano passare.
          effetti: { parte.camera-2: 1, reperto.sigillato: 1, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'inchino sbagliato
          testo: |
            Ti inchini, ma a metà ti viene il dubbio di aver cominciato dalla
            parte sbagliata, e le sagome copiano anche il dubbio. Si piegano
            sempre più vicine, con la premura di padroni di casa che non ti
            lasciano andare senza il dolce, finché una ti posa la mano sulla nuca.
            Il freddo della Marea ti scende lungo la schiena, e te lo porti
            dietro, curvo, fino al cancelletto verde.
          effetti: { tormento: 1.5, contaminazione: 1.5 }
          vai: superficie-fratturata
      - testo: "Aprire l'altare come un reperto"
        descrizione: "Sulle piattaforme un reperto si apre lungo la giuntura che si muove, e una di quelle venature si muove."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: La giuntura
          testo: |
            Trovi la venatura che si muove meno delle altre e ci infili la punta
            della lama come in un reperto delle piattaforme. La pietra si apre di
            un dito con uno sbuffo di foschia che ti prende in faccia, e dentro
            c'è un nucleo dei Precursori tiepido che sussurra mezze parole. Quando
            lo tiri fuori le sagome si inginocchiano, in ritardo, come apprendisti
            che hanno visto fare il lavoro giusto.
          pe: { tecnologia: 5 }
          effetti: { parte.nucleo-2: 1, contaminazione: 1.5, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La giuntura sbagliata
          testo: |
            Infili la lama nella venatura che ti sembrava giusta, e la venatura si
            chiude sulla lama e poi sulle dita. Quando la pietra finalmente ti
            lascia cadi all'indietro, e scappi fino al cancelletto verde con le
            vene dei polsi troppo chiare.
          effetti: { contaminazione: 1.5, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ascoltare il villaggio come si ascolta il Bosco"
        descrizione: "Al Circolo un posto si ascolta prima di guardarlo, e il respiro di questo villaggio passa da quella pietra."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Sotto il pozzo
          testo: |
            Ti siedi sulla terra dura a occhi chiusi, come nel Bosco quando aspetti
            che gli uccelli si dimentichino di te. Il villaggio respira piano, e
            l'aria scende sotto l'altare fino a una sala dei Precursori, più in
            basso del pozzo, dove una macchina ripete il villaggio casa per casa, a
            memoria, compresi i vasi di basilico secco. Torni in te con il naso che
            sanguina e le sagome sedute intorno.
          pe: { natura: 5 }
          effetti: { informazioni.segreto: 1, tormento: 1.5 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il sonno del villaggio
          testo: |
            Ti siedi e ascolti, e dopo un poco ti accorgi che respiri con il
            villaggio, lento come un uomo che dorme, e che le sagome fanno lo
            stesso con te. Corri fino al cancelletto verde, e per tutta la strada
            devi ricordarti di decidere tu dove mettere i piedi.
          effetti: { tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Benedire il villaggio e prendere congedo"
        descrizione: "Il Velo ha un gesto per congedarsi dalle case dei morti, e qui nessuno l'ha mai fatto."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [empatia, accademiche], difficolta: Difficile }
        successo:
          titolo: La benedizione delle case
          testo: |
            Alzi la mano verso l'altare e dici a voce bassa le parole che il Velo
            usa per le case rimaste vuote. Le sagome alzano la mano un attimo
            dopo, con il polso storto, e l'inchino lo fanno giusto. La pietra si
            apre lungo una venatura, e dentro trovi una camera di cristallo
            attraversata da vene di luce e un guscio sigillato, come un'offerta
            lasciata sul sagrato.
          pe: { empatia: 5 }
          effetti: { parte.camera-2: 1, reperto.sigillato: 1, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Le parole a metà
          testo: |
            A metà della benedizione le parole ti si impastano in bocca, come la
            sera del Festival sotto il palco, e le sagome copiano anche
            l'esitazione. Si piegano sempre più vicine, finché una ti posa la mano
            sulla nuca e il freddo della Marea ti scende lungo la schiena. Al
            cancelletto verde ti raddrizzi a fatica.
          effetti: { tormento: 1.5, contaminazione: 1.5 }
          vai: superficie-fratturata
