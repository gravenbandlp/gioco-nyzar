# Frammenti del Codex dei Ponti Sospesi: la Gilda e il Patto, i Custodi, il Mercato dei Nodi e le sue botteghe,
# la gente sopra e sotto le assi. Solo voci pubbliche; quelle che cambiano con le piste hanno i loro requisiti.
frammenti:
  # ------------------------------------------------------------ la storia delle corde
  - id: ps-le-tiracorde
    titolo: Le tiracorde
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      Nei primi anni dopo la Fondazione Qir-Azel era un arcipelago di
      piattaforme isolate, e per passare dall'una all'altra serviva chi
      sapesse tendere una fune sopra il vuoto. Le tiracorde capirono presto
      di poter decidere quanto costava attraversare la città. Nelle famiglie
      più vecchie dei Ponti si racconta di tiracorde analfabete che il
      giorno del Patto firmarono con un nodo di fune al posto del nome.

  - id: ps-il-patto-delle-corde
    titolo: Il Patto delle Corde
    area: ponti-sospesi
    immagine: fazioni/gilda-dei-mercanti
    testo: |
      Nel 118 D.C. i Cordani, venuti dalle tiracorde, i Malgrani del legname e
      i Tarvelin dell'acciaio firmarono nella Casa dei Nodi il Patto delle
      Corde. Era un accordo di non aggressione fra rivali che si stimavano
      poco, e divideva i ponti in settori con un'unica scala di tasse sui
      carichi. Da quella firma nacque la Gilda dei Mercanti delle Corde, che
      oggi tutti chiamano soltanto la Gilda.

  - id: ps-una-cooperativa-di-artigiani
    titolo: Una cooperativa di artigiani
    area: ponti-sospesi
    immagine: fazioni/gilda-dei-mercanti
    testo: |
      Il Patto si presentava come una cooperativa di artigiani, e in meno di
      dieci anni era diventato il monopolio di Qir-Azel. I primi a farne le
      spese furono i Raschiatori, perché le rotte dei Cristalli Conduttori si
      trattavano ormai con chi li trasportava sui ponti, e la rivalità non
      diventò mai guerra aperta. Da allora, alla Casa dei Nodi, quando si
      parla della Città Bassa la parola che torna più spesso è *contenere*.

  - id: ps-tre-ponti-in-una-notte
    titolo: Tre ponti in una notte
    area: ponti-sospesi
    immagine: ambientazione/cicatrice-del-mondo
    testo: |
      Il Patto resse per nove anni, finché una notte d'autunno del 127 D.C.
      tre ponti principali presero fuoco nello stesso momento. Il Mille Corde
      bruciò fino a metà e resse, gli altri due crollarono nella Cicatrice.
      Nessuna famiglia rivendicò l'incendio. Nelle cronache della Biblioteca
      si legge: «Per sette giorni la città non ebbe vincitori. Quando ne ebbe
      uno, non era nessuno dei combattenti.»

  - id: ps-gli-incidenti-edilizi
    titolo: Gli incidenti edilizi
    area: ponti-sospesi
    immagine: fazioni/confraternita-del-velo
    testo: |
      Durante la Guerra delle Corde le bande in livrea delle famiglie si
      battevano sulle assi, e i Raschiatori ne approfittarono per riprendersi
      dai magazzini quello che la Gilda aveva confiscato loro. La settima
      notte la Madre del Velo chiuse i capifamiglia nel vecchio Santuario, e
      dopo tre giorni ne uscirono con il Patto rinnovato e il Velo come
      garante, con diritto di veto. Le cronache ufficiali parlano ancora di
      una settimana di incidenti edilizi.

  - id: ps-legno-e-metallo
    titolo: Legno e metallo
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      I primi ponti di Qir-Azel erano di legno rinforzato con il metallo delle
      rovine dei Precursori. Il legname veniva da Pannion, il primo villaggio
      legato alla città da un accordo di fornitura, e arriva ancora da lì con
      il carbone per le forge. Sul Mille Corde si riconoscono le assi rifatte
      dopo l'incendio del 127, più chiare delle altre e inchiodate con un
      ferro diverso.

  # ------------------------------------------------------------ la Gilda
  - id: ps-un-male-necessario
    titolo: Un male necessario
    area: ponti-sospesi
    immagine: fazioni/gilda-dei-mercanti
    testo: |
      La Gilda dei Mercanti controlla i ponti e le passerelle sospese, e a
      ogni passaggio fra un distretto e l'altro riscuote un dazio che chiama
      tassa di manutenzione e sicurezza. Il Velo ne disprezza l'avidità e non
      riesce a farne a meno. Alla Casa dei Nodi lo dicono senza imbarazzo:
      «Senza di noi la città collassa in tre giorni. Lo sappiamo, e lo
      facciamo pesare.»

  - id: ps-il-sovrintendente
    titolo: Il Sovrintendente
    area: ponti-sospesi
    immagine: ambientazione/quartieri-alti
    testo: |
      Le decisioni operative della Gilda spettano al Sovrintendente, eletto
      ogni cinque anni per mediare fra gli interessi privati e quelli della
      città. Oggi è Tarquin Cordani, il cui nonno fu il primo a ricoprire la
      carica. Crede che il commercio possa servire la città oltre che il
      profitto, e sa di sedere fra gente che la pensa in un altro modo. Quando
      si arrabbia lo si capisce solo dalle mani, che restano ferme sul tavolo.

  - id: ps-il-grembiule-in-consiglio
    titolo: Il grembiule in consiglio
    area: ponti-sospesi
    immagine: personaggi/irsa-valbrun
    testo: |
      Irsa Valbrun è l'unica donna nel consiglio interno della Gilda, e si
      presenta alla Casa dei Nodi con il grembiule da bottega sopra un
      panciotto pulito. Parla per l'ala pragmatica, che vuole i prezzi alla
      portata della gente e si oppone ai dazi che fanno chiudere le botteghe
      piccole. La Confraternita del Velo la considera l'unico appoggio
      affidabile dentro la Gilda, e questo le dà una libertà che gli altri
      consiglieri non hanno.

  - id: ps-le-carovane
    titolo: Tre giorni, dieci giorni
    area: ponti-sospesi
    immagine: ambientazione/laresh
    testo: |
      Le carovane del circondario scaricano sui Ponti il grano di Laresh e il
      legname di Pannion. Chi viene da fuori per vendere deve registrarsi
      alla Gilda, e ogni carico va pesato e bollato prima di toccare un
      banco. Fra un timbro e l'altro le locande si riempiono, e fra i
      mercanti di carovana gira un detto: «Ci fermiamo tre giorni. Ne restano
      sempre dieci.»

  - id: ps-il-timbro-della-gilda
    titolo: Il timbro della Gilda
    area: ponti-sospesi
    immagine: ambientazione/cristalli-conduttori
    testo: |
      I Cristalli Conduttori registrati passano dalla Gilda dei Mercanti, che
      ci applica le sue gabelle e ne garantisce la qualità con un timbro,
      anche se fra i Raschiatori si dice che la regolarità dipenda da chi lo
      mette. Quello che la Gilda non timbra scende al Mercato delle Ombre,
      dove si paga di più e si fanno meno domande. Le gemme che la gente
      appende sopra le porte per devozione di solito non hanno timbro.

  # ------------------------------------------------------------ i Custodi e i ponteggiatori
  - id: ps-varn-kett
    titolo: I ponti sono un regno
    area: ponti-sospesi
    immagine: personaggi/varn-kett
    testo: |
      Varn Kett ha servito vent'anni nella milizia prima che il
      Sovrintendente lo assumesse per mettere disciplina fra i riscossori
      della Gilda, che allora arrotondavano quasi tutti. Sotto di lui i conti
      dei pedaggi sono diventati affidabili, e chi bara se lo ritrova davanti
      il giorno dopo. Ricorda i nomi di conversazioni vecchie di anni, e ai
      riscossori nuovi ripete: «I ponti sono un regno. Chi vuole entrarci
      paga il pedaggio.»

  - id: ps-lira-demos
    titolo: Pratica notarile
    area: ponti-sospesi
    immagine: personaggi/lira-demos
    testo: |
      Lira Demos tiene l'archivio dei dazi alla Casa dei Nodi e conosce la
      contabilità dei ponti meglio di chiunque altro, compresi i trucchi dei
      riscossori disonesti. È una mezzelfa dagli occhi verdi con fili di rame
      intrecciati nei capelli. Aiuta gratis i piccoli mercanti a difendersi
      da chi arrotonda. A un bottegaio in lacrime ha detto una volta: «I
      conti del ponte non sono un gioco di prestigio. Sono pratica notarile.»

  - id: ps-ormun-pell
    titolo: Le suole di Ormun Pell
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      Ormun Pell guida i ponteggiatori della Gilda da vent'anni. È un nano
      massiccio con la barba raccolta in una fascia di cuoio, e cammina piano
      perché sente le vibrazioni delle funi attraverso le suole e sa dire se
      una corda va cambiata entro l'anno o entro la settimana. Ai nuovi
      insegna così: «Un ponte che cade è una sciagura. Un ponte che cade dopo
      aver avvisato è un'opportunità. Imparate la differenza.»

  - id: ps-il-passo
    titolo: Il passo
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      Dove le strutture sono più instabili la Gilda manda i ponteggiatori,
      una ventina di uomini che cambiano le assi marce appesi alle funi, a
      qualunque ora. Molti sono ex galeotti o orfani e vivono di paghe
      piccole. Il regolamento della Casa dei Nodi concede loro soltanto il
      passo, il diritto di non pagare la gabella per andare a lavorare, a
      patto di avere il nome sul ruolo e di presentarsi quando li chiamano.

  - id: ps-maedric-holl
    titolo: Il custode della nebbia
    area: ponti-sospesi
    requisiti: [pista.registro < 1]
    immagine: personaggi/maedric-holl
    testo: |
      Maedric Holl è il supervisore notturno dei Custodi di Passaggio e fa i
      suoi turni al Ponte dei Morti, quando la nebbia sale dalla Cicatrice. È
      pallido, con gli occhi acquosi e un mantello cerato, e parla così piano
      che a due passi non lo si sente. L'indirizzo che ha lasciato alla Casa
      dei Nodi non corrisponde a nessuna porta, e nessun collega è mai
      riuscito a seguirlo fino a casa.

  - id: ps-il-custode-nuovo
    titolo: Il custode nuovo
    area: ponti-sospesi
    requisiti: [pista.registro >= 5]
    immagine: ambientazione/ponte-dei-morti
    testo: |
      Dopo Maedric Holl il turno di notte al Ponte dei Morti è andato a Teo
      Marsan, un ragazzo con la barba rada e una grafia grande da scolaro.
      Conta le casse di ogni carro tre volte prima di scriverle sul registro.
      Sui Ponti si dice che di notte, adesso, passi soltanto quello che è in
      regola, e sotto le assi c'è chi chiede a che ora il ragazzo vada a
      dormire, con la borsa in mano.

  # ------------------------------------------------------------ il Mercato dei Nodi e le botteghe
  - id: ps-mercato-dei-nodi
    titolo: Chi ti guarda mentre paghi
    area: ponti-sospesi
    immagine: ambientazione/mercato-dei-nodi
    testo: |
      Il Mercato dei Nodi occupa le piattaforme del Ponte delle Mille Corde, e
      per molti forestieri Qir-Azel è soltanto questo. Ci si vendono le stoffe
      della Conceria Kasselt, le pozioni di alchimisti più o meno affidabili e
      i pezzi dei Precursori, e molti mercanti mettono i borseggi nel conto
      del mese. Fra i banchi si ripete: «Tutto si vende. Quasi tutto si
      compra. Il prezzo dipende da chi ti guarda mentre paghi.»

  - id: ps-nodo-d-ossidiana
    titolo: Il serpente sull'insegna
    area: ponti-sospesi
    immagine: ambientazione/nodo-d-ossidiana
    testo: |
      Il Nodo d'Ossidiana si affaccia sul Mercato dei Nodi con una facciata
      stretta di pietra chiara venata di verde, sotto un'insegna a forma di
      serpente alato con due gemme opache al posto degli occhi. Dentro il
      rumore del mercato si attenua di colpo, e dal bancone un corvo nero
      guarda i clienti uno per uno. Ambrin Qell saluta quelli nuovi con un
      invito: «Entra. Lasciati cercare prima di cercare tu.»

  - id: ps-ambrin-qell
    titolo: Gli anni di Ambrin Qell
    area: ponti-sospesi
    immagine: personaggi/ambrin-qell
    testo: |
      Ambrin Qell ha lunghi capelli rossi e occhi azzurri, e c'è chi gli dà
      trent'anni e chi cinquanta. Si dice che usi un incantesimo per restare
      giovane, e quando la voce gli arriva lui sorride e cambia argomento.
      Conosce la provenienza di ogni pezzo della bottega, scrive pergamene
      magiche su commissione e tiene il Nodo come un piccolo museo in cui gli
      oggetti esposti funzionano ancora.

  - id: ps-dispensa-di-gramm
    titolo: Bevi questa tisana
    area: ponti-sospesi
    requisiti: [colpo.dispensa == 0, pista.pelle < 4]
    immagine: ambientazione/dispensa-di-gramm
    testo: |
      La Dispensa di Gramm è l'erboristeria di Nestor Gramm sul Mercato dei
      Nodi. Nestor è basso e tozzo, con uno straccio sempre nella tasca
      destra del grembiule, e non fa credito a nessuno. Nel retro prepara
      rimedi più cari delle tisane del banco, fra cui pozioni rare che il
      Velo tiene in scorta per i casi gravi. A chi esita risponde: «Te lo
      dico io quando la tua domanda è una richiesta. Tu nel frattempo bevi
      questa tisana.»

  - id: ps-la-boutique
    titolo: Una questione di principio
    area: ponti-sospesi
    requisiti: [pista.pelle < 5]
    immagine: ambientazione/mercato-dei-nodi
    testo: |
      Sul Mercato dei Nodi la Boutique di Isotta Cordani vende tessuti
      pregiati. Isotta è della famiglia del Sovrintendente e fa pagare il
      doppio ai Malgrani e a chiunque compri per loro. All'emissario che
      venne a protestare rispose: «Per voi il prezzo è doppio. È una
      questione di principio. Vi ricordo che potete andare altrove.»

  - id: ps-corin-ashdale
    titolo: Una serata fra amici
    area: ponti-sospesi
    requisiti: [pista.corin < 6]
    immagine: personaggi/corin-ashdale
    testo: |
      Corin Ashdale è un mercante della Gilda che si vede più spesso al
      Grifone di Ferro che alla Casa dei Nodi. Presta piccole somme ai
      commercianti minori senza tenere il conto, e regala pettegolezzi con
      la stessa generosità con cui paga da bere. Dopo il terzo bicchiere lo
      dice ad alta voce: «Sapete cosa mi piacerebbe? Una serata, fra amici.
      Solo questo.»

  # ------------------------------------------------------------ la gente dei Ponti
  - id: ps-i-sottoponti
    titolo: Quelli che non vengono contati
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      Fra le reti tese sotto le travi dei Ponti vive gente che i registri
      della Gilda non contano, dai ladri ai bambini senza famiglia ai mutati
      lievi della Marea Grigia. Di sopra quasi nessuno li vede, anche se il
      fumo dei loro fuochi sale fra le fessure del tavolato. Ogni tanto da
      quelle fessure sale una lenza con un amo di ferro, e torna giù con una
      borsa che non era sua.

  - id: ps-il-capitano
    titolo: Il Capitano
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      Sulla piattaforma più larga dei sottoponti, al riparo di un pilone del
      Ponte delle Mille Corde, Mamma Tesh tiene acceso un braciere ricavato
      da un elmo rovesciato. Lo chiama il Capitano e racconta di averlo
      ripescato da una rete la notte in cui il ponte bruciò. Vive sotto le
      travi da più tempo di chiunque altro, e intorno al suo fuoco il posto
      si paga con una storia o con un favore.

  - id: ps-le-case-appese
    titolo: Quattro corde per casa
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      Ai margini del reticolo le case appese di legno e lamiera stanno sotto
      le travi come nidi di vespe, ognuna tenuta da quattro corde che i
      padroni controllano a mano ogni sera. Quando una casa perde la corda
      dell'angolo verso il vuoto, il vento la sbatte contro la trave maestra
      con un colpo sordo, e i vicini accorrono a dare consigli tutti insieme
      mentre qualcuno cerca una corda nuova.

  - id: ps-le-chiatte-a-fune
    titolo: Le chiatte a fune
    area: ponti-sospesi
    immagine: ambientazione/cicatrice-del-mondo
    testo: |
      A valle del Ponte delle Mille Corde, dove la Cicatrice si stringe, le
      chiatte scorrono ad argano su funi d'acciaio grosse come un polso e
      portano dall'altra parte quello che sulle assi non passerebbe, come la
      pietra da taglio o il lyssan grezzo. Molti argani vecchi godono del
      privilegio di fune, che risale al Patto delle Corde e permette al
      padrone di portare la propria merce senza pagare la gabella.
