# Frammenti del Codex dei Ponti Sospesi: la Gilda e il Patto, i Custodi, il Mercato dei Nodi e le sue botteghe,
# la gente sopra e sotto le assi. Solo voci pubbliche; quelle che cambiano con le piste hanno i loro requisiti.
frammenti:
  # ------------------------------------------------------------ la storia delle corde
  - id: ps-le-tiracorde
    titolo: Le tiracorde
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      Nei primi anni dopo la Fondazione Qir-Azel era un arcipelago di
      piattaforme isolate, costruite su livelli diversi di roccia e di
      metallo. Per passare dall'una all'altra serviva qualcuno che sapesse
      gettare una fune e tenderla sopra il vuoto, e quel mestiere aveva un
      nome suo, le tiracorde. Quando capirono che nessuno poteva attraversare
      la città senza di loro, capirono anche di poter decidere quanto far
      costare l'attraversamento. Nelle famiglie più vecchie dei Ponti si
      racconta ancora di tiracorde che non sapevano scrivere e che, il giorno
      del Patto, firmarono con un nodo di fune al posto del nome.

  - id: ps-il-patto-delle-corde
    titolo: Il Patto delle Corde
    area: ponti-sospesi
    immagine: fazioni/gilda-dei-mercanti
    testo: |
      Nel 118 D.C. tre famiglie principali si sedettero allo stesso tavolo
      nella Casa dei Nodi, appena finita di costruire, e firmarono quello che
      oggi si chiama il Patto delle Corde. I Cordani venivano dalle tiracorde.
      I Malgrani avevano il legname delle segherie, i Tarvelin l'acciaio. Era
      un accordo di non aggressione fra rivali che si stimavano poco. Ogni
      famiglia avrebbe controllato un settore dei ponti senza toccare quello
      delle altre, se non dichiarandolo apertamente, e ogni carico sarebbe
      stato tassato secondo una scala comune. Da quella firma nacque la Gilda
      dei Mercanti delle Corde, che oggi in città tutti chiamano soltanto la
      Gilda.

  - id: ps-una-cooperativa-di-artigiani
    titolo: Una cooperativa di artigiani
    area: ponti-sospesi
    immagine: fazioni/gilda-dei-mercanti
    testo: |
      Il Patto si presentava come una cooperativa di artigiani, e in meno di
      dieci anni era diventato il monopolio di Qir-Azel. Ogni mercante e ogni
      bottegaio doveva registrarsi alla Gilda e pagarle una commissione
      mensile per lavorare in regola. I primi a farne le spese furono i
      Raschiatori. Le rotte dei Cristalli Conduttori si trattavano ormai con
      chi li trasportava, e i trasporti passavano per i ponti. I Raschiatori
      non avevano modo di vincere, e la rivalità non diventò mai guerra
      aperta. Da quegli anni, nelle stanze della Casa dei Nodi, quando si
      parla della Città Bassa la parola che torna più spesso è *contenere*.

  - id: ps-tre-ponti-in-una-notte
    titolo: Tre ponti in una notte
    area: ponti-sospesi
    immagine: ambientazione/cicatrice-del-mondo
    testo: |
      Per nove anni il Patto resse, anche se le tre famiglie ormai parlavano
      ciascuna una lingua sua. Una notte d'autunno del 127 D.C. tre ponti
      principali presero fuoco nello stesso momento. Il Ponte delle Mille
      Corde bruciò fino a metà e resse, mentre gli altri due crollarono nella
      Cicatrice fra le scintille e le funi spezzate. Nessuna delle famiglie
      rivendicò l'incendio. Si accusarono a vicenda in pubblico e ognuna
      mostrò le sue prove, che non combaciavano con quelle delle altre. Nelle
      cronache della Biblioteca si legge: «Per sette giorni la città non ebbe
      vincitori. Quando ne ebbe uno, non era nessuno dei combattenti.»

  - id: ps-gli-incidenti-edilizi
    titolo: Gli incidenti edilizi
    area: ponti-sospesi
    immagine: fazioni/confraternita-del-velo
    testo: |
      Durante la Guerra delle Corde le bande in livrea delle tre famiglie si
      battevano nei vicoli e sulle assi, e le merci si ammucchiavano ai bordi
      della Cicatrice. I Raschiatori forzarono i magazzini abbandonati e si
      ripresero quello che la Gilda aveva confiscato loro negli anni. La
      settima notte intervenne la Confraternita del Velo. La Madre del Velo
      chiuse i capifamiglia nel vecchio Santuario per tre giorni, e quando
      uscirono il Patto era stato rinnovato con il Velo come garante e un
      diritto di veto sulle decisioni che toccano la città. Nessuno fu punito.
      Le cronache ufficiali parlano ancora oggi di una settimana di incidenti
      edilizi.

  - id: ps-legno-e-metallo
    titolo: Legno e metallo
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      I primi ponti di Qir-Azel, negli anni dopo la Fondazione, furono
      costruiti a strati. Si cominciava con il legno, e poi lo si rinforzava
      con il metallo recuperato dalle rovine dei Precursori. Il legname veniva
      da Pannion, il primo villaggio legato alla città da un accordo di
      fornitura, e arriva ancora da lì insieme al carbone per le forge. Il
      Ponte dei Morti è uno dei pochi tutti di metallo, perché è anche uno dei
      più vecchi. Sulle campate del Mille Corde chi ha l'occhio allenato
      distingue ancora le assi rifatte dopo l'incendio del 127, più chiare
      delle altre e inchiodate con un ferro diverso.

  # ------------------------------------------------------------ la Gilda
  - id: ps-un-male-necessario
    titolo: Un male necessario
    area: ponti-sospesi
    immagine: fazioni/gilda-dei-mercanti
    testo: |
      La Gilda dei Mercanti controlla i ponti e le passerelle sospese, e a
      ogni passaggio fra un distretto e l'altro riscuote un dazio che chiama
      tassa di manutenzione e sicurezza. Nessuno la ama, e tutti sanno che
      senza di lei le merci non arriverebbero a destinazione. I sacerdoti del
      Velo ne disprezzano l'avidità e non riescono a farne a meno. La
      Confraternita ha provato più volte a imporle dei controlli morali, senza
      intaccarne l'autonomia. Alla Casa dei Nodi lo sanno da sempre, e lo
      dicono senza imbarazzo: «Senza di noi la città collassa in tre giorni.
      Lo sappiamo, e lo facciamo pesare.»

  - id: ps-il-sovrintendente
    titolo: Il Sovrintendente
    area: ponti-sospesi
    immagine: ambientazione/quartieri-alti
    testo: |
      Il consiglio interno della Gilda riunisce i rappresentanti delle
      famiglie più influenti, ma le decisioni operative spettano al
      Sovrintendente, eletto ogni cinque anni per mediare fra gli interessi
      privati e quelli della città. Oggi la carica è di Tarquin Cordani, il
      cui nonno fu il primo a ricoprirla. Porta sempre una camicia bianca e i
      polsini con i piccoli sigilli di casa, e ascolta con calma. Crede
      davvero che il commercio possa servire la città oltre che il profitto, e
      sa di sedere in mezzo a gente che la pensa in un altro modo. Quando si
      arrabbia lo si capisce solo dalle mani, che restano ferme sopra il
      tavolo.

  - id: ps-il-grembiule-in-consiglio
    titolo: Il grembiule in consiglio
    area: ponti-sospesi
    immagine: personaggi/irsa-valbrun
    testo: |
      Irsa Valbrun è l'unica donna nel consiglio interno della Gilda, e alla
      Casa dei Nodi si presenta con il grembiule da bottega sopra un panciotto
      pulito. Ai consiglieri più rigidi la cosa fa storcere il naso, mentre al
      Sovrintendente Cordani, a quanto si dice, piace molto. In consiglio
      parla per l'ala pragmatica, quella che vuole i prezzi alla portata della
      gente e si oppone ai dazi che fanno chiudere le botteghe piccole. Anche
      chi le vota contro rispetta la qualità del suo lavoro. La Confraternita
      del Velo la considera l'unico appoggio affidabile dentro la Gilda, e da
      questa stima Irsa ricava una libertà che gli altri consiglieri non
      hanno.

  - id: ps-le-carovane
    titolo: Tre giorni, dieci giorni
    area: ponti-sospesi
    immagine: ambientazione/laresh
    testo: |
      Le carovane del circondario scaricano sui Ponti il grano di Laresh e il
      legname di Pannion, e i loro padroni passano dal gabbiotto dei Custodi
      prima ancora di cercarsi un letto. Chi viene da fuori per vendere deve
      registrarsi alla Gilda come chiunque altro, e scopre presto che la
      licenza ha tempi suoi e che ogni carico va pesato e bollato prima di
      toccare un banco. Le giornate si allungano fra un timbro e l'altro, e
      intanto le locande dei Ponti si riempiono. Fra i mercanti di carovana
      gira un detto: «Ci fermiamo tre giorni. Ne restano sempre dieci.»

  - id: ps-il-timbro-della-gilda
    titolo: Il timbro della Gilda
    area: ponti-sospesi
    immagine: ambientazione/cristalli-conduttori
    testo: |
      I Cristalli Conduttori registrati passano dalla Gilda dei Mercanti, che
      ci applica le sue gabelle e ne garantisce la qualità con un timbro.
      Sulla carta un cristallo timbrato è un cristallo sicuro. Fra i
      Raschiatori corre da anni la voce che la regolarità dei timbri dipenda
      molto da chi li mette e dall'ora in cui li mette. Quello che la Gilda
      non timbra scende al Mercato delle Ombre, dove si paga di più e si fanno
      meno domande. Le piccole gemme che la gente appende sopra le porte di
      casa, per devozione, di solito sono senza timbro, e a nessuno viene in
      mente di cercarlo.

  # ------------------------------------------------------------ i Custodi e i ponteggiatori
  - id: ps-varn-kett
    titolo: I ponti sono un regno
    area: ponti-sospesi
    immagine: personaggi/varn-kett
    testo: |
      Varn Kett ha servito vent'anni nella milizia di Qir-Azel prima che il
      Sovrintendente lo assumesse di persona per mettere disciplina fra i
      riscossori della Gilda, che allora arrotondavano quasi tutti. Sotto di
      lui i conti dei pedaggi della Casa dei Nodi sono diventati affidabili
      per la prima volta in dieci anni. Chi paga in tempo ha il suo rispetto,
      e chi bara se lo ritrova davanti il giorno dopo. Ricorda le date e i
      nomi di conversazioni vecchie di anni, e non ha bisogno di controllare
      prima di contraddire qualcuno. Al primo richiamo dell'anno lo ripete ai
      riscossori nuovi: «I ponti sono un regno. Chi vuole entrarci paga il
      pedaggio.»

  - id: ps-lira-demos
    titolo: Pratica notarile
    area: ponti-sospesi
    immagine: personaggi/lira-demos
    testo: |
      Lira Demos tiene l'archivio dei dazi alla Casa dei Nodi e conosce la
      contabilità dei ponti meglio di chiunque altro nella Gilda, comprese le
      eccezioni di stagione e i trucchi dei riscossori disonesti. È una
      mezzelfa dagli occhi verdi, con fili di rame sottilissimi intrecciati
      nei capelli castani, e al cinturino porta una scatola di tasselli incisi
      che usa per segnare i registri. Aiuta spesso i piccoli mercanti a
      difendersi da chi arrotonda. Non chiede compensi e non promette niente
      per iscritto. A un bottegaio in lacrime ha detto una volta: «I conti del
      ponte non sono un gioco di prestigio. Sono pratica notarile.»

  - id: ps-ormun-pell
    titolo: Le suole di Ormun Pell
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      Ormun Pell è il caposquadra dei ponteggiatori della Gilda da vent'anni.
      È un nano massiccio che suda anche d'inverno, e tiene la barba raccolta
      in una fascia di cuoio perché non si impigli nei cavi. Cammina piano
      perché sente le vibrazioni delle funi attraverso le suole, e da quelle
      sa dire se una corda va cambiata entro l'anno o entro la settimana. Il
      martello non se lo toglie dalla cintura nemmeno per dormire. Per lui un
      ponte che cede è anche un appalto nuovo, e ai nuovi lo insegna così: «Un
      ponte che cade è una sciagura. Un ponte che cade dopo aver avvisato è
      un'opportunità. Imparate la differenza.»

  - id: ps-il-passo
    titolo: Il passo
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      Dove le strutture sono più instabili la Gilda manda le squadre dei
      ponteggiatori, una ventina di uomini fissi che cambiano le assi marce
      appesi alle funi, a qualunque ora. Molti sono ex galeotti o orfani, e
      più di uno ha imparato a firmare in cella. Vivono di paghe piccole e di
      qualche tangente. Il regolamento della Casa dei Nodi concede loro una
      cosa sola, che sulle assi chiamano il passo. Chi lavora sui ponti non
      paga la gabella per andare a lavorare, a patto di avere il nome sul
      ruolo della squadra e di presentarsi quando lo chiamano, di notte come
      con la pioggia.

  - id: ps-maedric-holl
    titolo: Il custode della nebbia
    area: ponti-sospesi
    requisiti: [pista.registro < 1]
    immagine: personaggi/maedric-holl
    testo: |
      Maedric Holl è il supervisore notturno dei Custodi di Passaggio, e fa i
      suoi turni al Ponte dei Morti nelle ore in cui la nebbia sale dalla
      Cicatrice. È pallido, con gli occhi acquosi e le labbra sottili, e porta
      sempre un mantello cerato che lo ripara dall'umido. Parla piano, e a due
      passi di distanza già non lo si sente. Fra i riscossori si dice che di
      notte i ponti diventino un'altra cosa e che Holl li conosca meglio di
      tutti. L'indirizzo che ha lasciato alla Casa dei Nodi non corrisponde a
      nessuna porta, e nessun collega è riuscito a seguirlo fino a casa.

  - id: ps-il-custode-nuovo
    titolo: Il custode nuovo
    area: ponti-sospesi
    requisiti: [pista.registro >= 5]
    immagine: ambientazione/ponte-dei-morti
    testo: |
      Dopo Maedric Holl il turno di notte al Ponte dei Morti la Gilda l'ha
      dato a Teo Marsan, un ragazzo con la barba rada e una grafia grande da
      scolaro. Ferma ogni carro e conta le casse tre volte prima di scriverle
      sul registro, e i carrettieri hanno imparato a mettersi in fila e ad
      aspettare. Sui Ponti si dice che di notte, adesso, passi soltanto quello
      che è in regola, e non tutti ne sono contenti. Sotto le assi c'è chi
      chiede in giro a che ora il ragazzo vada a dormire, e lo chiede con la
      borsa in mano.

  # ------------------------------------------------------------ il Mercato dei Nodi e le botteghe
  - id: ps-mercato-dei-nodi
    titolo: Chi ti guarda mentre paghi
    area: ponti-sospesi
    immagine: ambientazione/mercato-dei-nodi
    testo: |
      Il Mercato dei Nodi occupa le piattaforme del Ponte delle Mille Corde, e
      per molti forestieri Qir-Azel è soltanto questo. Ci si vendono le stoffe
      della Conceria Kasselt e le pozioni di alchimisti più o meno affidabili,
      accanto a pezzi dei Precursori passati di mano in mano sotto la
      tassazione blanda dei Custodi. I borseggi fanno talmente parte della
      vita del bazaar che molti mercanti li mettono nel conto delle perdite
      previste del mese. Fra i banchi si ripete un detto: «Tutto si vende.
      Quasi tutto si compra. Il prezzo dipende da chi ti guarda mentre paghi.»

  - id: ps-nodo-d-ossidiana
    titolo: Il serpente sull'insegna
    area: ponti-sospesi
    immagine: ambientazione/nodo-d-ossidiana
    testo: |
      Il Nodo d'Ossidiana si affaccia sul Mercato dei Nodi con una facciata
      stretta e alta di pietra chiara venata di verde. L'insegna è un serpente
      alato intagliato, con due gemme opache al posto degli occhi, e qualche
      cliente giura di averle viste seguirlo mentre passava. Appena varcata la
      porta il rumore del mercato si attenua di colpo, forse per merito di un
      Cristallo Conduttore tenuto in bottega. Il bancone è ricavato da un
      unico tronco scavato, e sopra c'è sempre lo stesso corvo nero, fermo,
      che guarda i clienti uno per uno. Ambrin Qell saluta quelli nuovi con un
      invito: «Entra. Lasciati cercare prima di cercare tu.»

  - id: ps-ambrin-qell
    titolo: Gli anni di Ambrin Qell
    area: ponti-sospesi
    immagine: personaggi/ambrin-qell
    testo: |
      Ambrin Qell ha lunghi capelli rossi e occhi azzurri, e sembra molto più
      giovane dell'età che gli si attribuisce. Alcuni clienti gli danno
      trent'anni e altri cinquanta, e il numero non si ferma mai su una cifra.
      C'è chi sostiene che usi qualche incantesimo per restare giovane, senza
      saper dire quale. Quando la voce gli arriva all'orecchio Ambrin sorride,
      poi cambia argomento. Conosce la provenienza di ogni pezzo della bottega
      e la racconta volentieri a chi gliela chiede. Scrive anche pergamene
      magiche su commissione, e tiene il Nodo come un piccolo museo in cui gli
      oggetti esposti, a differenza di quelli dei musei, funzionano ancora.

  - id: ps-dispensa-di-gramm
    titolo: Bevi questa tisana
    area: ponti-sospesi
    requisiti: [colpo.dispensa == 0, pista.pelle < 4]
    immagine: ambientazione/dispensa-di-gramm
    testo: |
      La Dispensa di Gramm è l'erboristeria di Nestor Gramm sul Mercato dei
      Nodi. Nestor è basso e tozzo, porta un grembiule grigio macchiato e
      tiene sempre uno straccio nella tasca destra. Diffida di ogni cliente e
      non fa credito a nessuno, ed è metodico fino a complicare le cose più
      semplici. Dal banco vende tisane e balsami. Nel retro prepara rimedi più
      cari, fra cui alcune pozioni rare che la Confraternita del Velo tiene in
      scorta per i casi gravi. A chi esita davanti al banco risponde sempre
      allo stesso modo: «Te lo dico io quando la tua domanda è una richiesta.
      Tu nel frattempo bevi questa tisana.»

  - id: ps-la-boutique
    titolo: Una questione di principio
    area: ponti-sospesi
    requisiti: [pista.pelle < 5]
    immagine: ambientazione/mercato-dei-nodi
    testo: |
      Fra le botteghe che si affacciano sul Mercato dei Nodi c'è la Boutique
      di Isotta Cordani, della famiglia del Sovrintendente, che vende tessuti
      pregiati e abiti con ricami minuti. Isotta veste come un'insegna della
      propria bottega e dice quello che pensa nel momento stesso in cui lo
      pensa. In città è nota soprattutto per una regola che applica senza
      eccezioni, e che le è costata più di un nemico. Ai Malgrani, e a
      chiunque compri per loro, fa pagare il doppio. All'emissario che una
      volta venne a protestare rispose: «Per voi il prezzo è doppio. È una
      questione di principio. Vi ricordo che potete andare altrove.»

  - id: ps-corin-ashdale
    titolo: Una serata fra amici
    area: ponti-sospesi
    requisiti: [pista.corin < 6]
    immagine: personaggi/corin-ashdale
    testo: |
      Corin Ashdale è un mercante della Gilda che si vede più spesso al
      Grifone di Ferro che alla Casa dei Nodi. Ha lineamenti regolari e il
      pallore di uno che dorme poco, e veste panciotti ricamati con il
      fazzoletto al taschino. Presta piccole somme ai commercianti minori
      senza tenere il conto del rientro, e molti lo considerano un
      benefattore. Conosce ogni pettegolezzo di Qir-Azel e lo regala con la
      stessa generosità con cui paga da bere. Alla Gilda tutti sanno quanto
      desideri farsi degli amici veri, e dopo il terzo bicchiere lo dice lui
      stesso ad alta voce: «Sapete cosa mi piacerebbe? Una serata, fra amici.
      Solo questo.»

  # ------------------------------------------------------------ la gente dei Ponti
  - id: ps-i-sottoponti
    titolo: Quelli che non vengono contati
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      Fra le reti tese sotto le travi dei Ponti vive gente che i registri
      della Gilda non contano. Ci sono ladri e mendicanti. Ci sono anche
      bambini rimasti senza famiglia e mutati lievi della Marea Grigia che in
      città non hanno trovato un altro posto. Di sopra quasi nessuno li vede,
      anche se il fumo dei loro fuochi sale fra le fessure del tavolato.
      Alcuni ponteggiatori della Gilda chiudono un occhio sui loro spostamenti
      in cambio di qualche favore, e la cosa non si discute in pubblico. Dalle
      fessure ogni tanto sale una lenza con un amo di ferro, e torna giù con
      una borsa che non era sua.

  - id: ps-il-capitano
    titolo: Il Capitano
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      Sulla piattaforma più larga dei sottoponti, riparata dal vento da un
      pilone del Ponte delle Mille Corde, Mamma Tesh tiene acceso un braciere
      ricavato da un elmo di ferro rovesciato. Lo chiama il Capitano e lo
      rimprovera quando fa troppo fumo. Racconta di averlo ripescato da una
      rete la notte in cui il ponte bruciò, quando il ferro scottava ancora.
      Vive sotto le travi da più tempo di chiunque altro, e intorno al suo
      fuoco il posto si paga con una storia o con un favore. Quaggiù l'inverno
      arriva prima che di sopra, e senza il Capitano molti andrebbero a
      dormire al freddo.

  - id: ps-le-case-appese
    titolo: Quattro corde per casa
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      Ai margini del reticolo le case appese di legno e lamiera stanno sotto
      le travi come nidi di vespe. Ognuna è tenuta da quattro corde, e ogni
      sera i padroni di casa le controllano una per una con la mano. Chi abita
      sui Ponti da anni riconosce dal cigolio una corda buona da una che
      cederà entro l'inverno. Quando una casa perde la corda dell'angolo verso
      il vuoto, il vento la sbatte contro la trave maestra con un colpo sordo
      che si sente nei denti, e i vicini corrono sulla passerella più vicina a
      dare consigli tutti insieme, mentre qualcuno va a cercare una corda
      nuova.

  - id: ps-le-chiatte-a-fune
    titolo: Le chiatte a fune
    area: ponti-sospesi
    immagine: ambientazione/cicatrice-del-mondo
    testo: |
      A valle del Ponte delle Mille Corde, dove la Cicatrice si stringe, dalle
      due sponde partono i cavi delle chiatte. Sono funi d'acciaio grosse come
      un polso, e lungo ciascuna scorre una piattaforma di tavole tirata ad
      argano, che porta dall'altra parte quello che sulle assi non passerebbe,
      come la pietra da taglio o il lyssan grezzo. All'alba l'approdo è pieno
      di carri e di uomini in cerca di una giornata. Molti argani vecchi
      godono del privilegio di fune, che risale al Patto delle Corde e
      permette a chi possiede l'argano di portare la propria merce sulla
      propria fune senza pagare la gabella.
