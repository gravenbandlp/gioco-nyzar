# Frammenti del Codex della Città Bassa: botteghe, locande, gente del quartiere, Scuri e Raschiatori, cimitero.
# Solo informazioni pubbliche, con i nomi del gioco; i requisiti li tolgono quando le piste cambiano persone e luoghi.
frammenti:
  # ------------------------------------------------------------ fabbri e botteghe
  - id: cb-fucina-dei-due-mastini
    titolo: Due cani che non abbaiano
    area: citta-bassa
    immagine: ambientazione/fucina-dei-due-mastini
    testo: |
      La Fucina dei Due Mastini è un edificio basso di pietra grezza in
      Città Bassa, annerito dal fumo fino alle grondaie, con un mastino
      ringhiante inciso sull'insegna di ferro. Davanti alla porta stanno
      distesi due cani dal pelo rosso scuro che non abbaiano mai, e chi non
      è gradito se ne accorge prima di entrare. Bram Halgast accoglie i
      clienti nuovi sempre con la stessa frase: «Se siete qui per perdere
      tempo, la porta è alle vostre spalle.»

  - id: cb-bram-halgast
    titolo: Tollerato per necessità
    area: citta-bassa
    immagine: personaggi/bram-halgast
    testo: |
      Bram Halgast è volgare e dopo il tramonto beve fino a notte fonda, e
      Qir-Azel lo sopporta perché le sue armi sono le migliori della città.
      La Confraternita del Velo non lo ama e la Gilda dei Mercanti lo evita,
      mentre Irsa Valbrun gli compra il grezzo con regolarità e lo paga
      sempre in tempo. Ogni pezzo che esce dalla fucina porta inciso il
      segno di un martello di pietra.

  - id: cb-armeria-di-irsa
    titolo: Prima le mani
    area: citta-bassa
    immagine: ambientazione/armeria-di-irsa
    testo: |
      L'Armeria di Irsa è un solido edificio di legno a due piani, con una
      fila di armi fissate accanto alla porta perché nessuno debba chiedere
      che cosa si vende. Irsa Valbrun non ha una forgia e rifinisce al banco
      sotto la scala il grezzo che le arriva da Bram Halgast. Ai clienti
      nuovi fa domande dirette, e dalle risposte decide se vendere: «Prima
      ti guardo e poi ti vendo, mai il contrario.»

  - id: cb-irsa-valbrun
    titolo: Il grembiule alla Casa dei Nodi
    area: citta-bassa
    immagine: personaggi/irsa-valbrun
    testo: |
      Irsa Valbrun è l'unica donna nel consiglio interno della Gilda dei
      Mercanti, e alle riunioni della Casa dei Nodi si presenta con il
      grembiule da bottega sopra un panciotto pulito. Parla per i prezzi alla
      portata della gente e per gli artigiani indipendenti, e il Velo la
      considera l'unico appoggio affidabile dentro la Gilda. Per i clienti
      che non le piacciono tiene a portata di mano un'arma carissima, da
      guardare finché non se ne vanno da soli.

  - id: cb-conceria-kasselt
    titolo: Le seconde occasioni
    area: citta-bassa
    immagine: ambientazione/conceria-kasselt
    testo: |
      La Conceria Kasselt fa alcuni dei migliori lavori in cuoio della regione,
      e non lo negano nemmeno i clienti che Gunter Kasselt ha cacciato a male
      parole. Gunter ha le mani tinte dalla concia e lavora più ore di
      qualunque suo operaio. Rifornisce l'Armeria di Irsa e prepara lavori
      speciali per la Cattedrale del Velo. La sua regola la conoscono tutti:
      «Lavoro pulito o non lavoro. Le seconde occasioni le si dà al pellame,
      non agli operai.»

  - id: cb-mulino-malgrani
    titolo: L'unico in piedi
    area: citta-bassa
    requisiti: [pista.pelle < 7]
    immagine: ambientazione/mulino-malgrani
    testo: |
      Il Mulino Malgrani, dove la Città Bassa scende verso il Torvessa, è
      l'unico mulino ancora in funzione, perché in cinque anni gli altri tre
      sono bruciati in incendi che le cronache non collegano fra loro. Lo
      manda avanti Anselmo Brey, che starnutisce per la farina e ha
      abbassato il prezzo per la gente in coda. Nelle osterie si dice: «Tre
      mulini bruciati in cinque anni. Il caso esiste, ma a Qir-Azel ha
      cattivo gusto.»

  - id: cb-emporio-tamberlo
    titolo: Tutto il resto è interferenza
    area: citta-bassa
    immagine: ambientazione/emporio-generale
    testo: |
      L'Emporio Tamberlo è una delle botteghe più antiche della Città Bassa,
      dove si compra quello che la Gilda non si prende la briga di vendere.
      Oddo Tamberlo sta dietro il bancone con il panciotto scuro e i baffi
      curati, bonario con i clienti e geloso delle figlie fino al ridicolo,
      e la sera beve al Grifone di Ferro raccontando sempre gli stessi
      aneddoti. Di sé dice: «Faccio il mio mestiere e le mie figlie. Tutto
      il resto è interferenza.»

  - id: cb-figlie-di-tamberlo
    titolo: Il grembiule rosso
    area: citta-bassa
    immagine: personaggi/elsa-tamberlo
    testo: |
      Al bancone dell'Emporio Tamberlo lavorano le due figlie di Oddo. Elsa,
      la maggiore, ha i capelli bruni e un grembiule rosso che la sorella le
      ruba un giorno sì e uno no, e da qualche tempo la si nomina insieme a
      Rennick Dole. Rilla, la minore, ha i capelli rossi, e quando entra un
      cliente giovane Elsa la spedisce nel retro a contare la merce. «Mia
      sorella attira l'attenzione. Io attiro i conti che tornano» dice Elsa.

  - id: cb-zanna-rotta
    titolo: Un nome più gentile
    area: citta-bassa
    immagine: ambientazione/scuderie-della-zanna-rotta
    testo: |
      Dolovan Stroud, che tiene le Scuderie della Zanna Rotta, ha fatto il
      cacciatore per metà della vita, e una lontana ascendenza elfica lo fa
      sembrare più giovane. Odia gli orchi, che gli hanno ucciso troppe
      delle persone che amava, e passa allo sceriffo quello che sa dei
      movimenti delle tribù. Con i cavalli è gentile come con poche persone.
      «Il mio cavallo si chiama Squash. Significa schiacciare. È un nome più
      gentile di altri che avevo in mente.»

  # ------------------------------------------------------------ locande
  - id: cb-locanda-di-ilka
    titolo: Sotto la Vecchia Luce
    area: citta-bassa
    immagine: ambientazione/locanda-di-ilka
    testo: |
      La Locanda di Ilka è uno degli edifici più antichi di Qir-Azel, un
      solo piano dipinto con i motivi dei carri olvari, e sull'insegna c'è
      la Vecchia Luce fra tende e carri attorno al falò dei primi
      viaggiatori. La sala è calda, e dalle pareti pendono tessuti con
      montagne e mari che pochi avventori hanno mai visto. Il sidro lo
      fermentano in casa, e il piatto più amato sono le patate speziate con
      la salsa di erbe.

  - id: cb-ilka-dravec
    titolo: La voce dei vecchi miti
    area: citta-bassa
    immagine: personaggi/ilka-dravec
    testo: |
      Ilka Dravec è la matriarca della famiglia ed è quasi cieca, e i suoi
      occhi lattiginosi si accendono soltanto quando ci batte sopra la luce
      del fuoco. Porta una treccia bianca lungo la schiena e racconta i miti
      antichi con una voce roca, e conosce qualche parola della lingua dei
      Precursori che nessuno le ha mai sentito spiegare. Per gli avventori
      di lunga data è un oracolo di quartiere, da consultare prima di una
      decisione importante.

  - id: cb-besk-dravec
    titolo: Lo dico una volta sola
    area: citta-bassa
    immagine: personaggi/besk-dravec
    testo: |
      Besk Dravec, la figlia minore di Ilka, manda avanti la locanda della
      madre e studia magia all'Accademia di Torvessa con Orvald Temmerin. È
      seria finché non ti conosce, e la sera apre i quaderni sul tavolo di
      cucina per chi vuole studiare con lei. Con chi tratta Ilka come una
      curiosità da fiera diventa scortese in fretta: «Mia madre è anziana. Lo
      dico una volta sola, poi me ne occupo io.»

  - id: cb-paladino-stanco
    titolo: La birra al posto della spada
    area: citta-bassa
    immagine: personaggi/ettore-castaldi
    testo: |
      La Birreria del Paladino Stanco è il locale di Ettore Castaldi, cugino
      della Rappresentante. Era un paladino promettente del Grande Albero
      Rosso finché nel 145 D.C. il Santuario non bruciò e la sua fede cominciò
      a vacillare. Ha appeso l'armatura al muro, e da allora produce birra e
      idromele con la cura che metteva nei riti. A un avventore inquieto ha
      detto: «Ho deposto la spada. Verso la birra. Sono ancora utile a
      qualcuno.»

  # ------------------------------------------------------------ la Maison des Lunes
  - id: cb-segnali-della-maison
    titolo: Due dita sulla cintura
    area: citta-bassa
    immagine: personaggi/tachek
    testo: |
      Alla Maison des Lunes lavorano tre buttafuori. Churl Bra'aak presidia
      la porta e ai clienti molesti dice una parola sola, «Fuori». Tachek
      gira per il salone con una mazza imbottita alla cintura, mentre Kanat,
      alto più di due metri, fa rispettare le regole con più rumore. Fra le
      ragazze e i buttafuori corrono segnali silenziosi. Due dita di Tachek
      sulla cintura vogliono dire che è in allerta, e il pugno chiuso lungo
      la coscia che ha già deciso.

  - id: cb-ragazze-della-maison
    titolo: Liberi di reinventarsi
    area: citta-bassa
    immagine: ambientazione/maison-des-lunes
    testo: |
      Fra le ragazze della Maison des Lunes la più anziana è Gretchen, dalla
      risata profonda. Amica di Nerissa Dalvane da molti anni, manda avanti la
      casa quando la padrona è altrove, e alle più giovani risponde molto con
      il tono e poco con le parole. Laure, la più minuta, sogna di aprire un
      locale suo e intanto regala quello che risparmia ai poveri della Città
      Bassa. Del perché abbia lasciato Ghoran, Gretchen dice soltanto: «Quando
      viaggiamo, siamo liberi di reinventarci.»

  # ------------------------------------------------------------ gli Scuri
  - id: cb-scuri
    titolo: Rompere le abitudini
    area: citta-bassa
    requisiti: [pista.pelle < 6]
    immagine: fazioni/scuri
    testo: |
      Gli Scuri sono una rete di bande attive a Qir-Azel e nei villaggi del
      circondario, da Pannion a Tuarmir, che collaborano solo quando
      conviene. Evitano il sangue e preferiscono il ricatto e la truffa, per
      avere una presa sulle persone che contano. In città la banda fa capo a
      Mirko Vesh, che si fa vedere poco. A un nuovo socio ha spiegato il
      metodo così: «Le gambe le lasciamo intere. Rompiamo le abitudini, che
      rende di più.»

  - id: cb-nihali-cuzan
    titolo: Far credere di aver perso
    area: citta-bassa
    requisiti: [pista.pelle < 6]
    immagine: personaggi/nihali-cuzan
    testo: |
      Nihali Cuzan organizza le partite di carte alla Pignatta Grassa. È un
      mezzelfo alto e magro che fuma di continuo, con vestiti di seconda mano
      sempre stirati e mani curate al millimetro, perché il suo mestiere sta
      lì. Bara con giudizio e lascia vincere qualcuno ogni tanto, così che le
      perdite degli altri sembrino sfortuna. Dopo l'ultimo giro, a chi gli
      chiede come sia andata, risponde: «Vincere mi annoia. Far credere di
      aver perso è più divertente.»

  - id: cb-rozalia-marga
    titolo: Firmare come voi
    area: citta-bassa
    requisiti: [pista.pelle < 6]
    immagine: personaggi/rozalia-marga
    testo: |
      Rozalia Marga copia firme e contratti nel retrobottega della Pignatta
      Grassa, e si vanta di non aver mai prodotto un falso che sia stato
      smascherato. Sul banco tiene una piccola biblioteca di firme cittadine
      ordinate per famiglia e per mestiere. Chi le prova che un suo
      documento è falso riceve, qualche settimana dopo, un documento ancora
      più convincente che sostiene il contrario. «Non firmo per voi. Firmo
      come voi. È diverso, e costa il doppio.»

  - id: cb-squiggor-ironfist
    titolo: Mi pagano per altre cose
    area: citta-bassa
    requisiti: [squiggor < 2, pista.pelle < 6]
    immagine: personaggi/squiggor-ironfist
    testo: |
      Squiggor Ironfist è il picchiatore di fiducia degli Scuri, un uomo
      massiccio coperto di cicatrici, con l'occhio sinistro sotto una benda
      nera. Riscuote i prestiti scaduti e accompagna i capi quando serve una
      presenza fisica, e si dice che non abbia mai tradito un compagno. Da
      sobrio è quasi muto, mentre da ubriaco canticchia ritornelli olvari che
      non ricorda mai per intero. Ai curiosi risponde: «Non parlo molto. Mi
      pagano per altre cose.»

  - id: cb-gaia-acari
    titolo: Il cappuccio blu
    area: citta-bassa
    requisiti: [pista.pelle < 6]
    immagine: personaggi/gaia-acari
    testo: |
      Gaia Acari è una ragazzina della Città Bassa, con un cappuccio blu
      scuro che le copre mezzo viso. Conosce a memoria i passaggi sotto i
      ponti, e la si vede correre fra i tavoli della Pignatta Grassa o, la
      sera, alla Locanda di Ilka e al Grifone di Ferro. A chi le chiede se
      non abbia paura dei guai alza le spalle: «Se mi prendono, mi prendono.
      Se no, sono ancora qui.»

  # ------------------------------------------------------------ i Raschiatori
  - id: cb-raschiatori
    titolo: Raschiare per vivere
    area: citta-bassa
    immagine: fazioni/raschiatori
    testo: |
      I Raschiatori sono nati come minatori improvvisati e cacciatori di
      rottami, e oggi sono la corporazione disordinata senza la quale
      Qir-Azel morirebbe di freddo e di buio. Raschiano quello che trovano,
      il metallo come le ossa, senza mai scavare a fondo, perché dopo poche
      centinaia di metri le rovine dei Precursori diventano instabili. Molti
      portano mutazioni leggere, come occhi che brillano al buio. I
      cittadini li disprezzano e non possono farne a meno, e lo sanno
      entrambe le parti.

  - id: cb-quattro-titoli
    titolo: I quattro titoli
    area: citta-bassa
    immagine: personaggi/dragna-gro-malog
    testo: |
      Fra i Raschiatori, che leggi scritte non ne hanno, si tramandano
      quattro titoli. Tenebra parla per tutti in Consiglio. Gli altri tre
      sono Ferro e Argento, e per ultimo Fiamma. Chi li porta non dà ordini,
      e il titolo dura finché chi lo porta torna vivo. Dragna Gro-Malog è
      Ferro da nove anni, il mandato più lungo che si ricordi. I Quattro
      dividono il bottino fra loro, e una parte va sempre ai bambini della
      Città Bassa.

  - id: cb-tenebra
    titolo: Una volta di meno
    area: citta-bassa
    immagine: personaggi/tenebra
    testo: |
      Tenebra è il capo dei Raschiatori, anche se ufficialmente i Quattro
      Scavatori un capo non ce l'hanno, e siede per loro nel Consiglio di
      Qir-Azel. È alto e scavato, con il volto in parte bruciato dal Mana
      corrotto, e parla a voce bassa pesando ogni parola. Alle reclute
      insegna a riconoscere la paura invece di scacciarla: «La paura è la
      sola cosa che ti tiene vivo là sotto. Chi la perde, torna su una volta
      di meno.»

  - id: cb-pozzi-ciechi
    titolo: I pozzi ciechi
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    testo: |
      Gli accessi ufficiali alle profondità li sorveglia la Confraternita del
      Velo, che prende la sua quota di ogni spedizione e impone la
      purificazione a chi risale. Molti Raschiatori conoscono anche i pozzi
      ciechi, scavati di nascosto da contrabbandieri e da squadre che non
      vogliono dividere il bottino con nessuno. Ogni tanto la Guardia ne trova
      uno e lo fa richiudere, e qualche settimana dopo all'osteria si discute
      di quello nuovo.

  # ------------------------------------------------------------ il cimitero
  - id: cb-registri-di-gundo
    titolo: La sola forma di rispetto
    area: citta-bassa
    immagine: personaggi/gundo-marl
    testo: |
      Per venticinque anni il cimitero di Qir-Azel l'ha tenuto Gundo Marl, un
      becchino con la schiena curva e il passo zoppo che compilava i registri
      funebri con una precisione da far invidia ai sacerdoti, e conosceva a
      memoria anche le sepolture rimaste senza lapide. La notte della razzia è
      sparito dalla sua casetta, e da allora le fosse le scava il garzone. Di
      sé diceva: «Tengo i registri puntuali. È la sola forma di rispetto che
      ho da offrire.»

  - id: cb-cripta-di-idrian-sollen
    titolo: La cripta del cappellano
    area: citta-bassa
    requisiti: [pista.sepolcro == 0]
    immagine: ambientazione/cripta-di-idrian-sollen
    testo: |
      In fondo al cimitero, addossata al muro di cinta, c'è la cripta di
      Idrian Sollen, il cappellano morto nell'incendio del Santuario nel 145
      D.C., un edificio quadrato di pietra coperto dei simboli del Grande
      Albero Rosso e chiuso da una porta di pietra. Ogni anno,
      nell'anniversario dell'incendio, il sommo sacerdote del Velo vi
      celebra una messa privata. Finché c'era, Gundo Marl la preparava da
      solo, e dopo aver acceso le candele usciva prima che la cerimonia
      cominciasse.

  # ------------------------------------------------------------ il quartiere
  - id: cb-sera-in-citta-bassa
    titolo: Il lavoro comincia a quell'ora
    area: citta-bassa
    immagine: ambientazione/citta-bassa
    testo: |
      Di sera i Quartieri Alti sbarrano le porte, e sulle terrazze gli
      obelischi di cristallo ronzano per tenere lontane dai ponti le creature
      della Marea. In Città Bassa a quell'ora il lavoro comincia. Rientrano i
      Raschiatori dalle rovine e sotto le strade aprono i banchi del Mercato
      delle Ombre, mentre la Maison des Lunes accoglie chi vuole essere
      dimenticato per una notte.

  - id: cb-contenere
    titolo: Contenere
    area: citta-bassa
    immagine: fazioni/gilda-dei-mercanti
    testo: |
      Quando nel 118 D.C. le famiglie dei ponti firmarono il Patto delle
      Corde, le rotte dei Cristalli Conduttori cominciarono a trattarsi con la
      Gilda che possedeva i ponti, e non più con chi li scavava. I Raschiatori
      della Città Bassa furono fra i primi a pagarne il conto, e ogni carico
      che sale dal quartiere paga ancora la gabella all'imbocco dei Ponti.
      Alla Casa dei Nodi, quando si parla della Città Bassa, torna una parola
      sola, *contenere*.

