# Frammenti del Codex della Città Bassa: botteghe, locande, gente del quartiere, Scuri e Raschiatori, cimitero.
# Solo informazioni pubbliche, con i nomi del gioco; i requisiti li tolgono quando le piste cambiano persone e luoghi.
frammenti:
  # ------------------------------------------------------------ fabbri e botteghe
  - id: cb-fucina-dei-due-mastini
    titolo: Due cani che non abbaiano
    area: citta-bassa
    immagine: ambientazione/fucina-dei-due-mastini
    testo: |
      La Fucina dei Due Mastini sta in Città Bassa, abbastanza lontana dal
      bazaar dei Ponti perché il suo martello non debba coprire le voci dei
      mercanti. È un edificio basso di pietra grezza, annerito dal fumo fino
      alle grondaie, con un mastino ringhiante inciso a colpi profondi
      sull'insegna di ferro. Davanti alla porta stanno distesi due cani dal
      pelo rosso scuro, che alzano la testa verso chi arriva e non abbaiano
      mai, e chi non è gradito se ne accorge prima di entrare. Bram Halgast
      accoglie i clienti nuovi sempre con la stessa frase: «Se siete qui per
      perdere tempo, la porta è alle vostre spalle.»

  - id: cb-bram-halgast
    titolo: Tollerato per necessità
    area: citta-bassa
    immagine: personaggi/bram-halgast
    testo: |
      Bram Halgast è volgare e si arrabbia in fretta, e dopo il tramonto
      beve fino a notte fonda. Qir-Azel lo sopporta perché le sue armi
      sono le migliori della città. La Confraternita del Velo non lo ama e
      la Gilda dei Mercanti preferisce evitarlo, mentre Irsa Valbrun gli
      compra il grezzo con regolarità e lo paga sempre in tempo, cosa che
      in Città Bassa fa di lei una cliente rara. Ogni pezzo che esce dalla
      fucina porta inciso il segno di un martello di pietra. Ai vicini
      capita di sentirlo battere anche nelle ore in cui la bottega
      dovrebbe essere chiusa.

  - id: cb-armeria-di-irsa
    titolo: Prima le mani
    area: citta-bassa
    immagine: ambientazione/armeria-di-irsa
    testo: |
      L'Armeria di Irsa è un solido edificio di legno a due piani, con una
      fila di armi fissate accanto alla porta perché nessuno debba chiedere
      che cosa si vende. Al piano terra le armature stanno davanti e le armi
      dietro, mentre gli oggetti minori pendono dalle travi. Sotto la scala
      c'è il banco da lavoro, coperto di anelli di maglia e di strisce di
      cuoio. Irsa Valbrun non ha una forgia e rifinisce il grezzo che le
      arriva da Bram Halgast. Ai clienti nuovi fa domande dirette, e dalle
      risposte decide se vendere o congedarli. Lei lo dice così: «Prima ti
      guardo e poi ti vendo, mai il contrario.»

  - id: cb-irsa-valbrun
    titolo: Il grembiule alla Casa dei Nodi
    area: citta-bassa
    immagine: personaggi/irsa-valbrun
    testo: |
      Irsa Valbrun è l'unica donna nel consiglio interno della Gilda dei
      Mercanti, e alle riunioni della Casa dei Nodi si presenta con il
      grembiule da bottega sopra un panciotto pulito. Nella Gilda parla per
      chi vuole i prezzi alla portata della gente e per gli artigiani
      indipendenti, che un dazio sbagliato può far chiudere in una stagione.
      La Confraternita del Velo la considera l'unico appoggio affidabile
      dentro la Gilda. Vende meno di quanto potrebbe, perché preferisce un
      cliente che torna a uno che paga il doppio. Per quelli che non le
      piacciono tiene a portata di mano un'arma carissima, da guardare finché
      non se ne vanno da soli.

  - id: cb-conceria-kasselt
    titolo: Le seconde occasioni
    area: citta-bassa
    immagine: ambientazione/conceria-kasselt
    testo: |
      La Conceria Kasselt fa alcuni dei migliori lavori in cuoio della
      regione, e nessun cliente lo nega, nemmeno quelli che Gunter Kasselt ha
      cacciato a male parole. Gunter è basso e tarchiato, con le sopracciglia
      spesse e le mani tinte dalla concia, e lavora più ore di qualunque suo
      operaio. Gli operai durano poco, e ai pochi che restano paga bene. La
      conceria rifornisce di cuoio l'Armeria di Irsa e ogni tanto prepara
      lavori speciali per la Cattedrale del Velo, commissionati sempre di
      persona e mai attraverso terzi. La sua regola la conoscono tutti: «Lavoro
      pulito o non lavoro. Le seconde occasioni le si dà al pellame, non agli
      operai.»

  - id: cb-mulino-malgrani
    titolo: L'unico in piedi
    area: citta-bassa
    requisiti: [pista.pelle < 7]
    immagine: ambientazione/mulino-malgrani
    testo: |
      Il Mulino Malgrani sta dove la Città Bassa scende verso il Torvessa,
      un edificio di pietra blu con la ruota che gira giorno e notte. È
      l'unico mulino ancora in funzione nella regione, perché negli ultimi
      cinque anni gli altri tre sono bruciati, in incendi che le cronache
      ufficiali non collegano fra loro. Lo manda avanti Anselmo Brey, che
      starnutisce di continuo per la farina che si porta dietro fino a
      casa. Ha abbassato il prezzo della farina, e la propria provvigione
      insieme, per la gente in coda con i sacchetti. Nelle osterie si
      dice: «Tre mulini bruciati in cinque anni. Il caso esiste, ma a
      Qir-Azel ha cattivo gusto.»

  - id: cb-emporio-tamberlo
    titolo: Tutto il resto è interferenza
    area: citta-bassa
    immagine: ambientazione/emporio-generale
    testo: |
      L'Emporio Tamberlo è una delle botteghe più antiche della Città
      Bassa, e per il quartiere è il posto dove si compra quello che la
      Gilda non si prende la briga di vendere, dagli utensili alle stoffe
      fino alle conserve. Oddo Tamberlo sta dietro il bancone con il
      panciotto scuro e i baffi curati, bonario con i clienti e geloso
      delle figlie fino al ridicolo. Quando si arrabbia in bottega gli
      abituali aspettano cinque minuti, che di solito bastano. La sera
      beve al Grifone di Ferro e racconta sempre gli stessi aneddoti. Di
      sé dice: «Faccio il mio mestiere e le mie figlie. Tutto il resto è
      interferenza.»

  - id: cb-figlie-di-tamberlo
    titolo: Il grembiule rosso
    area: citta-bassa
    immagine: personaggi/elsa-tamberlo
    testo: |
      Al bancone dell'Emporio Tamberlo lavorano le due figlie di Oddo. La
      maggiore, Elsa, ha i capelli bruni e tiene i conti meglio del padre,
      con un piccolo grembiule rosso che la sorella le ruba un giorno sì e
      uno no, e che lei si riprende ogni volta. Da qualche tempo in città
      la si nomina insieme a Rennick Dole, quello della Segheria. Rilla,
      la minore, ha i capelli rossi e porta sempre un nastro più del
      necessario, e quando entra un cliente giovane Elsa la spedisce nel
      retro a contare la merce. Per ogni occasione Elsa ha una battuta
      pronta: «Mia sorella attira l'attenzione. Io attiro i conti che
      tornano.»

  - id: cb-zanna-rotta
    titolo: Un nome più gentile
    area: citta-bassa
    immagine: ambientazione/scuderie-della-zanna-rotta
    testo: |
      Dolovan Stroud, che tiene le Scuderie della Zanna Rotta, ha fatto il
      cacciatore per metà della vita, e una lontana ascendenza elfica lo
      fa sembrare più giovane dei suoi anni. Odia gli orchi più di
      qualunque altra cosa al mondo, perché da cacciatore ha visto morire
      per mano loro troppe delle persone che amava. Conosce le tribù del
      circondario e passa allo sceriffo quello che sa dei loro movimenti.
      Con i cavalli è gentile come con poche persone. A chi glielo chiede,
      Dolovan spiega: «Il mio cavallo si chiama Squash. Significa
      schiacciare. È un nome più gentile di altri che avevo in mente.»

  # ------------------------------------------------------------ locande
  - id: cb-locanda-di-ilka
    titolo: Sotto la Vecchia Luce
    area: citta-bassa
    immagine: ambientazione/locanda-di-ilka
    testo: |
      La Locanda di Ilka è uno degli edifici più antichi di Qir-Azel, un
      solo piano dipinto con i motivi dei carri olvari. Sull'insegna c'è
      la Vecchia Luce fra tende e carri attorno al falò dei primi
      viaggiatori, là dove oggi sorge la città. Dentro la sala è calda e
      piena di tavolini e sgabelli, e dalle pareti pendono tessuti
      colorati con montagne e mari che pochi avventori hanno mai visto. La
      strada è appartata, e i forestieri ci capitano di rado. Il sidro lo
      fermentano in casa, e il piatto più amato sono le patate speziate,
      che arrivano in tavola con una salsa di erbe dal sapore deciso.

  - id: cb-ilka-dravec
    titolo: La voce dei vecchi miti
    area: citta-bassa
    immagine: personaggi/ilka-dravec
    testo: |
      Ilka Dravec è la matriarca della famiglia ed è quasi cieca. I suoi
      occhi lattiginosi si accendono soltanto quando ci batte sopra la
      luce del fuoco. Porta un mantello ricamato a fiori sbiaditi e una
      treccia bianca che le scende lungo la schiena. Racconta i miti
      antichi con una voce roca e spezzata, e conosce qualche parola della
      lingua dei Precursori, che nessuno le ha mai sentito spiegare. Per
      gli avventori che la frequentano da anni è un oracolo di quartiere,
      da consultare prima di una decisione importante. Ride di rado, con
      un suono basso e improvviso che fa voltare mezza sala.

  - id: cb-besk-dravec
    titolo: Lo dico una volta sola
    area: citta-bassa
    immagine: personaggi/besk-dravec
    testo: |
      Besk Dravec, la figlia minore di Ilka, manda avanti la locanda della
      madre e studia magia all'Accademia di Torvessa con Orvald Temmerin. Ha i
      capelli scuri raccolti a coda e gli occhi grigi, ed è seria finché non
      ti conosce. Quando entra un viaggiatore che sa di magia gli si avvicina
      senza imbarazzo e gli chiede come ha imparato, e la sera apre i quaderni
      sul tavolo di cucina per chi vuole studiare con lei. Con chi tratta Ilka
      come una curiosità da fiera diventa scortese in fretta. A un avventore
      troppo curioso l'hanno sentita dire: «Mia madre è anziana. Lo dico una
      volta sola, poi me ne occupo io.»

  - id: cb-paladino-stanco
    titolo: La birra al posto della spada
    area: citta-bassa
    immagine: personaggi/ettore-castaldi
    testo: |
      La Birreria del Paladino Stanco è il locale di Ettore Castaldi, cugino
      della Rappresentante. Era un paladino del Grande Albero Rosso, e c'era
      chi lo diceva promettente, finché nel 145 D.C. il Santuario non bruciò e
      la sua fede cominciò a vacillare. Ha appeso l'armatura al muro, e da
      allora produce birra e idromele con la cura che metteva nei riti, e dei
      tempi di fermentazione parla più volentieri che del Consiglio. Tiene la
      barba curata come ai tempi dell'addestramento e ascolta i clienti senza
      giudicarli. A un avventore inquieto ha detto: «Ho deposto la spada.
      Verso la birra. Sono ancora utile a qualcuno.»

  # ------------------------------------------------------------ la Maison des Lunes
  - id: cb-segnali-della-maison
    titolo: Due dita sulla cintura
    area: citta-bassa
    immagine: personaggi/tachek
    testo: |
      Alla Maison des Lunes lavorano tre buttafuori. Churl Bra'aak
      presidia la porta e ai clienti molesti di solito dice una parola
      sola, «Fuori». Tachek veste scuro e gira per il salone con l'aria di
      un ospite tranquillo e una mazza imbottita alla cintura. Kanat, alto
      più di due metri e coperto di tatuaggi, fa rispettare le regole con
      più rumore, e qualche cliente abituale aspetta i suoi turni per
      vederlo lavorare. Fra le ragazze e i buttafuori corre un sistema di
      segnali silenziosi. Due dita di Tachek sulla cintura vogliono dire
      che è in allerta, e il pugno chiuso lungo la coscia che ha già
      deciso.

  - id: cb-ragazze-della-maison
    titolo: Liberi di reinventarsi
    area: citta-bassa
    immagine: ambientazione/maison-des-lunes
    testo: |
      Fra le ragazze della Maison des Lunes la più anziana è Gretchen, sempre
      truccata con cura e con una risata profonda e musicale. È amica di
      Nerissa Dalvane da molti anni e manda avanti la casa quando la padrona è
      altrove. Le più giovani le chiedono consiglio, e lei risponde a metà,
      molto con il tono e poco con le parole. Laure, la più minuta, sogna di
      mettere da parte abbastanza per aprire un locale suo, e intanto regala
      quello che risparmia ai poveri della Città Bassa. Del perché abbia
      lasciato Ghoran, Gretchen dice soltanto: «Quando viaggiamo, siamo liberi
      di reinventarci.»

  # ------------------------------------------------------------ gli Scuri
  - id: cb-scuri
    titolo: Rompere le abitudini
    area: citta-bassa
    requisiti: [pista.pelle < 6]
    immagine: fazioni/scuri
    testo: |
      Gli Scuri sono una rete di bande attive a Qir-Azel e nei villaggi del
      circondario, da Pannion a Tuarmir, che collaborano fra loro solo quando
      conviene e litigano spesso. Evitano il sangue quando possono e
      preferiscono il ricatto e la truffa. Quello che cercano è una presa
      sulle persone che contano, così da non dover mai temere un giudice. In
      città la banda fa capo a Mirko Vesh, che si fa vedere poco e lascia
      parlare gli altri. A un nuovo socio d'affari ha spiegato il metodo con
      una frase che gira ancora per la Città Bassa: «Le gambe le lasciamo
      intere. Rompiamo le abitudini, che rende di più.»

  - id: cb-nihali-cuzan
    titolo: Far credere di aver perso
    area: citta-bassa
    requisiti: [pista.pelle < 6]
    immagine: personaggi/nihali-cuzan
    testo: |
      Nihali Cuzan organizza le partite di carte alla Pignatta Grassa. È un
      mezzelfo alto e magro, dai lineamenti affilati, che fuma di continuo e
      sputa catarro nero senza vergognarsene. Porta vestiti di seconda mano
      sempre stirati e scarpe lucide, e ha le mani curate al millimetro,
      perché il suo mestiere sta lì. Bara con giudizio e lascia vincere
      qualcuno ogni tanto, così che le perdite degli altri sembrino sfortuna,
      e quando le carte non sono sul tavolo si dice che alleggerisca qualche
      borsa. Dopo l'ultimo giro, a chi gli chiede come sia andata, risponde:
      «Vincere mi annoia. Far credere di aver perso è più divertente.»

  - id: cb-rozalia-marga
    titolo: Firmare come voi
    area: citta-bassa
    requisiti: [pista.pelle < 6]
    immagine: personaggi/rozalia-marga
    testo: |
      Rozalia Marga copia firme e contratti nel retrobottega della
      Pignatta Grassa, e si vanta di non aver mai prodotto un falso che
      sia stato smascherato. Ha una piuma d'oca dietro l'orecchio e le
      dita macchiate d'inchiostro, che lava per principio una volta alla
      settimana. Sul suo banco tiene una piccola biblioteca di firme
      cittadine ordinate per famiglia e per mestiere, che passa per
      l'archivio più ordinato della banda. Chi le prova che un suo
      documento è falso riceve, qualche settimana dopo, un documento
      ancora più convincente che sostiene il contrario. Ai committenti
      spiega: «Non firmo per voi. Firmo come voi. È diverso, e costa il
      doppio.»

  - id: cb-squiggor-ironfist
    titolo: Mi pagano per altre cose
    area: citta-bassa
    requisiti: [squiggor < 2, pista.pelle < 6]
    immagine: personaggi/squiggor-ironfist
    testo: |
      Squiggor Ironfist è il picchiatore di fiducia degli Scuri, un uomo
      massiccio coperto di cicatrici, con l'occhio sinistro nascosto da una
      benda nera consunta. Veste pesante anche d'estate e tiene le mani in
      tasca quando non gli servono. Riscuote i prestiti scaduti e accompagna i
      capi quando serve una presenza fisica, e fuori dalla Pignatta Grassa non
      parla mai di lavoro. Si dice che non abbia mai tradito un compagno. Da
      sobrio è quasi muto, mentre da ubriaco canticchia ritornelli olvari che
      non ricorda mai per intero. Ai curiosi risponde: «Non parlo molto. Mi
      pagano per altre cose.»

  - id: cb-gaia-acari
    titolo: Il cappuccio blu
    area: citta-bassa
    requisiti: [pista.pelle < 6]
    immagine: personaggi/gaia-acari
    testo: |
      Gaia Acari è una ragazzina minuta della Città Bassa con le
      lentiggini sul naso. Porta un cappuccio blu scuro che le copre mezzo
      viso e una tunica scura troppo larga per lei. Conosce a memoria i
      passaggi sotto i ponti e gli orari di chiusura delle botteghe. La si
      vede correre fra i tavoli della Pignatta Grassa, e la sera la si
      trova alla Locanda di Ilka o al Grifone di Ferro, dove la sua lingua
      svelta fa storcere la bocca alle vecchie olvare. Quando le chiedono
      se non abbia paura di finire nei guai, alza le spalle: «Se mi
      prendono, mi prendono. Se no, sono ancora qui. Funziona così.»

  # ------------------------------------------------------------ i Raschiatori
  - id: cb-raschiatori
    titolo: Raschiare per vivere
    area: citta-bassa
    immagine: fazioni/raschiatori
    testo: |
      I Raschiatori sono nati come minatori improvvisati e cacciatori di
      rottami, e oggi sono la corporazione disordinata senza la quale
      Qir-Azel morirebbe di freddo e di buio. Il nome viene dal loro modo
      di sopravvivere. Raschiano quello che trovano, il metallo come le
      ossa, senza mai riuscire a scavare a fondo, perché dopo poche
      centinaia di metri le rovine dei Precursori diventano instabili.
      Molti portano mutazioni leggere, come occhi che brillano al buio o
      vene che pulsano di luce sotto la pelle. Vivono quasi tutti in Città
      Bassa. I cittadini li disprezzano e non possono farne a meno, e lo
      sanno entrambe le parti.

  - id: cb-quattro-titoli
    titolo: I quattro titoli
    area: citta-bassa
    immagine: personaggi/dragna-gro-malog
    testo: |
      I Raschiatori non hanno una gerarchia né leggi scritte. Hanno
      quattro titoli, che si tramandano fra i veterani. Il più noto è
      Tenebra, che parla per tutti in Consiglio. Gli altri tre sono Ferro
      e Argento, e per ultimo Fiamma. Chi li porta non dà ordini e tiene
      in equilibrio un mestiere che non conosce altra legge che quella
      della sopravvivenza. Un titolo si guadagna per merito e per
      resistenza, e dura finché chi lo porta torna vivo.
      Dragna Gro-Malog è Ferro da nove anni, il mandato più lungo che si
      ricordi. I Quattro dividono il bottino a modo loro, e una parte va
      sempre ai bambini della Città Bassa.

  - id: cb-tenebra
    titolo: Una volta di meno
    area: citta-bassa
    immagine: personaggi/tenebra
    testo: |
      Tenebra è il capo dei Raschiatori, anche se ufficialmente i Quattro
      Scavatori un capo non ce l'hanno, e siede per loro nel Consiglio di
      Qir-Azel. È alto e scavato, con il volto in parte bruciato dal Mana
      corrotto e vene che gli brillano piano sotto la pelle. Indossa
      un'armatura silenziosa di cuoio con piastre annerite, e parla a voce
      bassa pesando ogni parola. Della Confraternita del Velo diffida,
      mentre rispetta la Gilda dei Mercanti finché paga. Alle reclute
      insegna a riconoscere la paura invece di scacciarla: «La paura è la
      sola cosa che ti tiene vivo là sotto. Chi la perde, torna su una
      volta di meno.»

  - id: cb-pozzi-ciechi
    titolo: I pozzi ciechi
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    testo: |
      Gli accessi ufficiali alle profondità sono sorvegliati dalla
      Confraternita del Velo, che prende la sua quota di ogni spedizione
      regolare e impone la purificazione a chi risale. Molti Raschiatori della
      Città Bassa conoscono anche altre strade, i pozzi ciechi, scavati di
      nascosto dai contrabbandieri e dalle squadre che non vogliono dividere
      il bottino con nessuno. Ogni tanto la Guardia ne trova uno e lo fa
      richiudere, e qualche settimana dopo i Raschiatori discutono all'osteria
      di quello nuovo. Per la legge scavarne uno è un reato, e chi ci viene
      sorpreso resta sotto gli occhi della Guardia per un pezzo.

  # ------------------------------------------------------------ il cimitero
  - id: cb-registri-di-gundo
    titolo: La sola forma di rispetto
    area: citta-bassa
    immagine: personaggi/gundo-marl
    testo: |
      Per venticinque anni il cimitero di Qir-Azel l'ha tenuto Gundo Marl, un
      becchino con la schiena curva e il passo zoppo, che compilava i registri
      funebri con una precisione da far invidia ai sacerdoti. Conosceva a
      memoria ogni lapide, e anche le sepolture rimaste senza lapide. Portava
      la tunica grigia del mestiere e parlava poco, sempre rivolto al registro
      che aveva davanti. La notte della razzia è sparito dalla sua casetta, e
      da allora le fosse le scava il garzone. Di sé diceva: «Tengo i registri
      puntuali. È la sola forma di rispetto che ho da offrire.»

  - id: cb-cripta-di-idrian-sollen
    titolo: La cripta del cappellano
    area: citta-bassa
    requisiti: [pista.sepolcro == 0]
    immagine: ambientazione/cripta-di-idrian-sollen
    testo: |
      In fondo al cimitero, addossata al muro di cinta, c'è la cripta di
      Idrian Sollen, il cappellano morto nell'incendio del Santuario nel
      145 D.C. È un edificio quadrato di pietra, di circa sei metri per
      lato, coperto dei simboli del Grande Albero Rosso e chiuso da una
      porta di pietra. Per i fedeli della Città Bassa è il cuore del
      cimitero, più delle cappelle delle famiglie ricche. Ogni anno,
      nell'anniversario dell'incendio, il sommo sacerdote del Velo vi
      celebra una messa privata. Finché c'era, Gundo Marl la preparava da
      solo, e dopo aver acceso le candele usciva prima che la cerimonia
      cominciasse.

  # ------------------------------------------------------------ il quartiere
  - id: cb-sera-in-citta-bassa
    titolo: Il lavoro comincia a quell'ora
    area: citta-bassa
    immagine: ambientazione/citta-bassa
    testo: |
      Di sera i Quartieri Alti sbarrano le porte, e sulle terrazze gli
      obelischi di cristallo cominciano a ronzare per tenere lontane dai ponti
      le creature della Marea. In Città Bassa a quell'ora il lavoro comincia.
      Rientrano i Raschiatori dalle rovine, e sotto le strade i venditori del
      Mercato delle Ombre aprono la merce sui banchi. Le osterie si riempiono
      di voci, e la Maison des Lunes accoglie chi vuole essere dimenticato per
      una notte. Alla Birreria del Paladino Stanco la luce resta accesa fino a
      tardi, e alla Locanda di Ilka i vecchi olvari bevono sidro vicino al
      fuoco.

  - id: cb-contenere
    titolo: Contenere
    area: citta-bassa
    immagine: fazioni/gilda-dei-mercanti
    testo: |
      Quando nel 118 D.C. le famiglie dei ponti firmarono il Patto delle
      Corde, le rotte dei Cristalli Conduttori cominciarono a trattarsi con
      chi li trasportava e non più con chi li scavava. A trasportarli erano i
      ponti, e i ponti erano della Gilda. I Raschiatori della Città Bassa
      furono fra i primi a pagarne il conto, e una lite aperta non avevano
      modo di vincerla. Ancora oggi ogni carico che sale dal quartiere paga la
      gabella all'imbocco dei Ponti. Da quel decennio, nelle stanze della Casa
      dei Nodi, quando si parla della Città Bassa torna più spesso di altre
      una parola sola, *contenere*.

