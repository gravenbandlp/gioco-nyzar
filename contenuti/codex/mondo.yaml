# Frammenti del Codex sul mondo in generale: storia, miti, culti, cristalli, domini e villaggi del circondario.
# Senza `area`, compaiono ovunque. Solo contenuto pubblico; i fatti che la trama cambia hanno requisiti.
frammenti:
  # ------------------------------------------------------------ dalla Caduta alla Fondazione
  - id: mn-la-caduta
    titolo: Il suono prima della frattura
    immagine: ambientazione/rovine-dei-precursori
    testo: |
      Nessuno sa con precisione come avvenne la Caduta, e i pochi testi
      sopravvissuti mescolano il mito alla testimonianza. In pochi giorni i
      Precursori si estinsero e il continente si spezzò in gole e altopiani
      sospesi, mentre la Marea Grigia compariva per la prima volta. Chi abitava
      la Superficie mutò in fretta, e da quella trasformazione discendono le
      razze di oggi, dagli umani ai dragonidi. I superstiti che lasciarono un
      racconto parlano tutti di un suono basso e prolungato, sempre lo stesso,
      che precedette la frattura di poche ore. Da allora quel suono non è più
      stato udito, e della Caduta non esiste una sola testimonianza scritta
      prima della Caduta stessa.

  - id: mn-era-del-silenzio
    titolo: Imparare a tacere
    immagine: ambientazione/marea-grigia
    testo: |
      Per i vent'anni che seguirono la Caduta il cielo restò opaco e la Marea
      Grigia coprì gran parte del mondo. I superstiti si rifugiarono nelle
      caverne e nelle rovine, e mangiavano quello che trovavano nelle dispense
      dei Precursori, in contenitori sigillati in un modo che i superstiti non
      capivano. I diari di quegli anni, raccolti dalla Biblioteca dal 110
      D.C. in poi, descrivono comunità che parlavano a bassa voce e solo per il
      necessario. Di notte, o vicino alle aperture, si taceva del tutto. Uno di
      quei diari lo spiega così: «Non si parlava perché parlare attirava
      qualcosa. Quel qualcosa, oggi, non lo si nomina più.»

  - id: mn-prima-luce
    titolo: Caldo per conto suo
    immagine: ambientazione/cristalli-conduttori
    testo: |
      Vent'anni dopo la Caduta i superstiti cominciarono, ognuno per conto
      proprio, a recuperare i primi Cristalli Conduttori ancora attivi, e
      capirono con il tempo che alcuni si potevano riaccendere. Più di una
      comunità fu distrutta dalla Dissonanza del Mana provocata da un mago
      inesperto. Attorno a chi sapeva usare i cristalli nacquero i primi
      insediamenti, una comunità per cristallo e un mago per comunità, e su
      quel modello si reggono ancora i rapporti fra Qir-Azel e i suoi
      villaggi. Una cronaca della Biblioteca ricorda il primo che ne tenne uno
      acceso in mano: «Sapeva solo che era caldo, e che era caldo per conto
      suo.»

  - id: mn-bagliore-di-talrhan
    titolo: Il bagliore di Talrhan
    testo: |
      Nel 70 D.C. un bagliore scarlatto squarciò le nubi sopra le pianure di
      Talrhan, visibile a giorni di cammino. Chi si avvicinò, settimane dopo,
      raccontò di un Albero colossale con la
      chioma che ardeva senza consumarsi e le radici intrecciate alle rovine
      dei Precursori. Nelle stesse settimane gran parte della Marea Grigia si
      ritirò dalle pianure abitate, e i cristalli cominciarono a rispondere ai
      maghi con una forza mai vista. Fu allora che la loro energia ebbe il nome
      di Mana, mentre prima si parlava soltanto di *forza dei cristalli*. Una
      testimonianza raccolta a Talrhan nel 73 dice che quel giorno il cielo «si
      aprì come una bocca».

  - id: mn-cuore-del-mondo
    titolo: Il Cuore del Mondo
    immagine: fazioni/confraternita-del-velo
    testo: |
      I fedeli chiamano il Grande Albero Rosso il Cuore del Mondo. Secondo la
      dottrina del Velo le sue radici corrono sotto tutta la Superficie
      Fratturata, e ogni scintilla di Mana è un riflesso del suo potere. Le sue
      foglie rosse, quando toccano terra, purificano il suolo corrotto dalla
      Marea. Gli zeloti dei Quartieri Alti credono che alla fine del mondo le
      radici solleveranno le città sopra la Marea Grigia. Eppure nessuno ha mai
      detto di averlo raggiunto. Talrhan sta oltre i confini conosciuti, in
      una regione di deserti e voragini, e nella Biblioteca di Qir-Azel non c'è un solo diario
      di pellegrino che racconti il viaggio.

  - id: mn-guerra-del-cristallo
    titolo: Si combatté per la luce
    immagine: ambientazione/cristalli-conduttori
    testo: |
      Dopo il 70 D.C. i cristalli divennero molto più potenti, e la pace fra
      le comunità della Superficie durò poco. Le prime rapine contro le
      carovane altrui sono dell'83, e nell'85 tre comunità si allearono per
      togliere a una quarta i suoi conduttori maggiori. Seguirono quindici anni
      di guerra. Le comunità sconfitte furono disperse e i loro nomi cancellati
      dagli archivi delle vincitrici, che più tardi distrussero quasi tutti i
      propri diari, quando capirono di aver fatto ciò di cui accusavano i
      Precursori. La guerra finì per esaurimento intorno al 100 D.C. La
      Biblioteca ne conserva una riga: «Si combatté per la luce. Lo si fece al
      buio.»

  - id: mn-catalogo-di-mirhal
    titolo: Il catalogo di Mirhal
    immagine: ambientazione/marea-grigia
    testo: |
      Negli anni della Guerra del Cristallo furono documentate le prime
      mutazioni causate dalla Marea Grigia negli uomini e nelle bestie. Le pelli
      diventavano squamose e gli occhi si velavano per sempre, e certi
      superstiti avevano una fame che niente saziava o ricordi che tornavano a
      galla sbagliati. Il primo catalogo lo compilò nel 95 D.C. una
      mineralogista scampata alla comunità di Mirhal, che di quella comunità è
      l'unica traccia rimasta. Sulle sue pagine si regge ancora il manuale di
      sopravvivenza dei Raschiatori veterani, e chi lo ha studiato riconosce
      una mutazione leggera prima ancora che il compagno se ne accorga.

  - id: mn-veggente-del-ferro
    titolo: Il Veggente si è girato
    immagine: ambientazione/cicatrice-del-mondo
    testo: |
      Fra le pietre dove oggi sorgono i Quartieri Alti alcuni dei primi coloni
      sentirono un battito salire dal terreno, e un uomo lo interpretò per
      primo come una chiamata. Lo si ricorda come il Veggente del Ferro, e
      nessuna fonte ne conserva il nome. Per i cronisti del Velo era un
      profeta cieco venuto dal Sud, per gli studiosi della Biblioteca un
      ingegnere scampato a una città dei Precursori. La Confraternita non lo
      riconosce come figura storica e ne recita la preghiera. Quando un cristallo collassa
      o si apre una fenditura attorno alla Cicatrice, i Raschiatori
      dicono che «il Veggente si è girato nel sonno», e lo dicono con paura.

  - id: mn-fondazione
    titolo: Dove c'era luce
    immagine: ambientazione/qir-azel
    testo: |
      Nel 110 D.C. un gruppo di maghi e mercanti, con i sopravvissuti delle
      comunità sciolte dalla guerra, si fermò sulle sponde della Cicatrice del
      Mondo per restarci. Il sito era instabile e la voragine mandava folate di
      Marea, e chi si opponeva lasciò il gruppo entro il primo anno. Vinse una
      ragione pratica, perché lungo la Strada Antica le rovine restituivano
      conduttori intatti in quantità mai vista altrove. I maghi misero in conto
      i rischi, e ai sopravvissuti, quasi sempre, li spiegarono a trasloco
      fatto. Un detto attribuito ai fondatori: «Sceglievamo se costruire dove
      c'era acqua, o dove c'era luce. Abbiamo scelto la luce. L'acqua ce la
      siamo guadagnata dopo.»

  # ------------------------------------------------------------ i primi quarant'anni di Qir-Azel
  - id: mn-prima-breccia
    titolo: I vapori azzurri
    immagine: ambientazione/marea-grigia
    testo: |
      Nel 115 D.C. crollò un intero livello del Labirinto di Darn-Morakh. La
      squadra di Raschiatori scesa quella mattina non tornò, e la città se ne
      accorse solo quando dai pozzi-ascensore della Città Bassa cominciarono a
      salire vapori azzurrastri. Era Marea Grigia nella sua forma più
      volatile, e quando la Confraternita del Velo dichiarò l'emergenza era
      passata una notte e centinaia di persone l'avevano respirata. Per dieci
      giorni i contaminati passarono a gruppi dal vecchio Santuario, e alcuni
      ne uscirono cambiati. Da allora è il Velo a decidere chi è ancora
      cittadino, e le guardie dei pozzi sanno a memoria i Protocolli di Pozzo
      scritti in quel decennio.

  - id: mn-rito-delle-maschere
    titolo: Quattro discesero
    immagine: ambientazione/cicatrice-del-mondo
    testo: |
      Nel 130 D.C. una voce antica parlò in sogno, nella stessa notte, a tre
      abitanti di Qir-Azel, e indicò loro il Labirinto di Darn-Morakh come
      luogo di un rito di cui fino ad allora si leggeva soltanto negli archivi
      precuriani. Quando il gruppo scese erano in quattro. Il quarto si era
      presentato all'imbocco della Strada Antica senza essere stato chiamato,
      e Selara Vyn lo aveva accolto senza chiedergli il nome. La discesa durò
      diciassette giorni e la risalita uno solo. Riemersero Kael Dareth,
      Selara ed Eren Solmir, con il volto cambiato, e del quarto dissero
      soltanto che era rimasto laggiù.

  - id: mn-kael-dareth
    titolo: La bocca cucita
    testo: |
      Kael Dareth era un guerriero solitario, con gli occhi color rame e una
      cicatrice che gli tagliava la bocca fino alla guancia, e portava due
      lame di acciaio dei Precursori che cantavano quando le estraeva. Dal
      Labirinto tornò con le pupille di metallo liquido e una voce che, se la
      alzava, faceva tremare le pietre. Da allora parlò ancora meno, e quando
      la Confraternita gli offrì un ruolo nelle cerimonie rifiutò senza
      spiegazioni. In Cattedrale il suo ritratto ha la bocca cucita con fili
      d'oro, e i paladini lo invocano prima di dover tacere quello che hanno
      visto. Se sia ancora vivo, il Velo non lo dice.

  - id: mn-selara-vyn
    titolo: Il germoglio inerte
    testo: |
      Prima del Rito Selara Vyn era una guaritrice del Circolo di Velthar dai
      capelli bianco-latte, e fu lei a convincere gli altri a scendere. Tornò con un bracciale di corteccia pietrificata che
      non riusciva a togliere, e da quel giorno tutto ciò che toccava
      appassiva, dai fiori che teneva in mano al pane sulla sua tavola. La
      accoglievano lo stesso come una santa, perché bastava che restasse tre
      giorni in un villaggio per attenuare le mutazioni leggere. Il Velo la
      invoca nelle veglie dei moribondi. Le ultime notizie, del 148 D.C., la
      danno in un villaggio a est della Cicatrice che da allora non risponde
      più ai messaggeri.

  - id: mn-eclisse-di-sangue
    titolo: Tre giorni di cielo rosso
    testo: |
      Una mattina d'inizio inverno del 133 D.C. il cielo sopra la Superficie
      Fratturata si tinse di un rosso uniforme, e restò così per tre giorni.
      Nello stesso momento si spensero i Cristalli Conduttori, a Qir-Azel e in
      ogni villaggio fino al Bosco di Velthar. Gli incantatori dissero di aver
      perso il filo, perché le formule restavano sulla pagina senza rispondere. Nei pozzi la Marea Grigia salì fino ai confini
      della Città Bassa. Il quarto giorno la luce tornò, e dalla scalinata del
      vecchio Santuario un sacerdote del Velo disse alla folla: «Per tre giorni
      pregammo senza luce. Quando la luce tornò, non era più la stessa luce.»

  - id: mn-fiamma-che-dorme
    titolo: La Fiamma che dorme
    immagine: ambientazione/cicatrice-del-mondo
    testo: |
      Alcuni Raschiatori e qualche vedetta dei Ponti Sospesi raccontano che al
      secondo giorno dell'Eclisse di Sangue dal centro del Labirinto di
      Darn-Morakh salì una colonna di luce azzurra, dritta, che illuminò da
      sotto il cielo rosso e poi si spense. Le cronache ufficiali non la
      riportano e da allora non è più comparsa. Sulla durata i testimoni
      discordano.
      Dicono però tutti che fu silenziosa, e che finché durò smisero di
      sentire i propri pensieri. La chiamarono la Fiamma senza sapere perché.
      Uno di loro ha lasciato scritto: «La vidi una sola volta, e da allora
      dormo come si dorme accanto a qualcosa che potrebbe svegliarsi.»

  - id: mn-notte-dei-sussurri
    titolo: Il suolo che parla
    immagine: ambientazione/evento-notte-dei-sussurri
    testo: |
      Nella notte di tempesta del 137 D.C. la Marea Grigia salì sopra i Ponti
      Sospesi e lambì il vecchio Santuario, senza uccidere nessuno. Nei giorni
      dopo molti abitanti dei Quartieri Alti raccontarono di voci metalliche
      che salivano dal suolo a sillabe brevi e regolari, e qualcuno giurò di
      aver sentito il proprio nome. Il Velo lo dichiarò un miracolo del Grande
      Albero Rosso. Il Ferro dei Raschiatori di allora disse in pubblico che le
      voci venivano dal Labirinto, e da quella notte alcuni veterani smisero
      di scendere. Una testimone senza nome lo raccontò così: «Mio fratello
      dormì. Io no. Lo sento ancora, certe notti, quando il vento gira da est.»

  - id: mn-occhio-nel-cristallo
    titolo: L'occhio che segue
    immagine: ambientazione/mito-occhio-nel-cristallo
    testo: |
      Alcuni Raschiatori giurano che i cristalli più antichi del Labirinto, se
      guardati al buio, mostrino dentro un occhio che segue chi guarda. Ha
      l'iride scura, e la pupilla batte insieme al cristallo. Nessuno è mai
      riuscito a estrarne uno intero. Il cristallo implode con un suono cavo e
      lascia nell'aria, per giorni, un fumo lattiginoso che sa di metallo
      dolce. Intorno al 140 D.C. Mirn il Sordo ne vendette un frammento al
      mercato nero, e poco dopo cominciò a perdere il senno. Di quella vendita
      disse soltanto: «Lo vendetti. Pesava più di prima.» Da allora, raccontano
      i compagni, non chiuse più occhio fino alla cella della Cattedrale dove
      morì.

  - id: mn-circolo-del-respiro
    titolo: Viandanti che hanno smesso di chiedere
    immagine: fazioni/circolo-di-velthar
    testo: |
      Nel 140 D.C. una distesa di alberi antichi cominciò a rigenerarsi da sola
      sulle rovine di una città dei Precursori, a un giorno di cammino da
      Qir-Azel. Le radici assorbivano i cristalli esausti e la Marea Grigia dei
      recessi, e la restituivano come linfa luminescente. Vi si trasferì un
      piccolo gruppo di druidi scampati alla Guerra del Cristallo, che si
      chiamavano viandanti che hanno smesso di chiedere, e presero a riunirsi
      a spirale attorno a una fenditura calda del terreno. Il primo Maestro del Circolo lo diceva così:
      «Un dio non ci serviva. Ci serviva un metodo, e lo abbiamo trovato sotto
      le radici.»

  # ------------------------------------------------------------ il 145
  - id: mn-notti-cucite
    titolo: Le Notti Cucite
    immagine: ambientazione/evento-notti-cucite-145
    testo: |
      Nel 145 D.C., per un mese, un assassino che in città chiamavano il
      Cucitore uccise venticinque persone e le ricompose come offerte.
      Qir-Azel conosceva le risse e le rapine finite male, ma un conto così
      non l'aveva mai visto, e la Guardia non sapeva da dove cominciare.
      L'ultima notte il Cucitore prese lo sceriffo Ivo Carstan in un vicolo
      della Città Bassa. Ferito nello scontro, lasciò una traccia di sangue
      che le guardie seguirono fino alla Roccia di Wren, sul Torvessa. Lassù
      trovarono l'intagliatore di uccelli Osric Wren, morto ai piedi di un
      altare scavato sotto la sua capanna.

  - id: mn-incendio-del-santuario
    titolo: Le colonne di ferro fuso
    requisiti: [pista.capomozzo < 4, oggetto.diario-di-aurenne == 0]
    immagine: ambientazione/cattedrale-del-velo
    testo: |
      Pochi mesi dopo le Notti Cucite un incendio devastò la parte
      settentrionale di Qir-Azel e distrusse il Santuario della Confraternita
      del Velo. Fra le colonne di legno e di ferro fuso morì il cappellano
      Idrian Sollen, che la città amava. Le indagini non sono mai state chiuse.
      Il Velo parlò di una prova divina, molti sospettarono un sabotaggio o un
      Cristallo Conduttore corrotto, e ancora oggi chi sia stato non si sa.
      Sulle ceneri sorse in cinque anni la Cattedrale. Qualche fedele, dopo
      quella notte, alla fede dell'Albero non è più tornato, ed Ettore
      Castaldi ha appeso l'armatura al muro.

  - id: mn-culto-dell-antico
    titolo: Un testimone da interrogare
    testo: |
      Pochi mesi dopo l'incendio del Santuario, ai margini della Superficie
      Fratturata, cominciò a girare un sermone non firmato. Teneva al centro il Grande Albero Rosso e lo descriveva come un testimone antico,
      la memoria viva del mondo che fu, invece che come un dio. Un dio si
      adora, e un testimone si interroga. Da quella differenza nacque il Culto
      dell'Antico, che al posto delle preghiere di lode pratica l'ascolto delle
      correnti di Mana. Nel 147 D.C.
      la Confraternita del Velo lo dichiarò sovversivo e ne cacciò i
      predicatori dai Quartieri Alti. In Città Bassa nessuno li ha cacciati, e
      il movimento continua a crescere.

  # ------------------------------------------------------------ la Cicatrice, le rovine, i cristalli
  - id: mn-labirinto
    titolo: Morire incompleti
    immagine: ambientazione/rovine-dei-precursori
    testo: |
      Lungo la Strada Antica che scende nel Labirinto di Darn-Morakh si
      incontrano obelischi incisi da chi è passato prima, e alcune iscrizioni
      sono firmate con il nome del Labirinto stesso. Come e quando vengano
      scritte non si sa, e i graffi sembrano freschi su pietra vecchia di
      millenni. Quando una parte del Labirinto si riorganizza, chi si trovava
      dentro e ne esce vivo di solito non ricorda niente, e dopo un certo
      numero di discese la gola si fa roca per sempre. La più nota delle
      iscrizioni Dragna Gro-Malog la fa imparare alle reclute prima della loro
      prima discesa: «Discendere è fatale; non discendere è morire incompleti.»

  - id: mn-cicatrice
    titolo: Le notti scure
    immagine: ambientazione/cicatrice-del-mondo
    testo: |
      La luce che sale dalla Cicatrice del Mondo pulsa a cicli irregolari.
      Può durare minuti o ore, e a volte sparisce per giorni interi. Le notti in cui
      la voragine resta scura la città dorme male, e il Velo officia riti che
      non erano in calendario. Avvicinarsi all'orlo senza permesso si può
      ancora. I bambini di Qir-Azel imparano presto a riconoscere chi ci è
      stato troppo vicino, da un tremito alla mano sinistra e dagli occhi che
      non reggono a lungo la stessa cosa. I Raschiatori dicono: «I forestieri
      credono di vedere un'aurora. Noi sappiamo cos'è. È qualcuno che, sotto,
      sta accendendo le lampade.»

  - id: mn-dissonanza
    titolo: Quando un cristallo muore
    immagine: ambientazione/cristalli-conduttori
    testo: |
      Con l'uso i Cristalli Conduttori si incrinano e si esauriscono, e
      qualche volta collassano liberando un'onda di energia instabile che i
      maghi chiamano Dissonanza del Mana. Cosa accada davvero quando un
      cristallo muore non lo sa nessuno. Chi gli stava troppo vicino ne resta
      segnato per settimane, con le mani che tremano e i sogni che tornano
      uguali ogni notte, e per questo le officine dei maghi più anziani hanno
      muri di pietra molto più spessi del necessario. A margine di un registro
      della Biblioteca un mago ha scritto: «Tutto ciò che ancora vive a Ny'Zar
      lo si deve a loro. Del resto non tengo il conto.»

  - id: mn-salvaguardia
    titolo: Le tre forme
    immagine: ambientazione/mito-salvaguardia-precursori
    testo: |
      I Raschiatori veterani chiamano Salvaguardia le macchine dei Precursori
      che sorvegliano le rovine dall'interno, e ne distinguono tre forme
      ricorrenti. Il ragno-sacrificale ha quattro braccia e una maschera bianca
      senza bocca, con due fessure rosse al posto degli occhi. Il busto
      deformato è metà carne e metà metallo ossidato, e dalla schiena gli
      escono spine di ferro come radici rovesciate. La figura ruotata cammina
      all'indietro con la testa girata, e annusa la paura da una fessura
      verticale nella maschera. Nessuna attacca con furia, e tutte si muovono
      lente, come se aspettassero da tempo. La regola di mestiere è chiudere la
      spedizione prima di incontrarne una.

  # ------------------------------------------------------------ gli altri domini
  - id: mn-alto-regno
    titolo: Le pietre calde
    testo: |
      Dell'Alto Regno, il dominio dei canyon e delle grotte cristalline, si sa
      quel poco che raccontano i pellegrini che giurano di esserci caduti
      verso l'alto in sogno. Parlano di meduse celesti fra i picchi, i cui
      lampi le tribù leggono come un oroscopo, e alcuni sono tornati con un
      frammento di pietra in tasca. La Biblioteca ne custodisce sette, e
      cinque si comportano come pietre qualunque. Le altre
      due, nelle notti di luna chiara, al tatto sembrano scaldarsi. Su una
      lastra di micascisto le tribù del Picco hanno inciso: «Disegna un cerchio
      attorno a ciò che vuoi proteggere, e un triangolo attorno a ciò che vuoi
      sapere.»

  - id: mn-regno-profondo
    titolo: Le bottiglie spiaggiate
    immagine: ambientazione/regno-profondo
    testo: |
      Dal Regno Profondo non torna nessuno, e quel poco che Qir-Azel ne sa
      arriva per vie traverse, con le ossa di creature mai classificate e le
      bottiglie spiaggiate dalle ultime correnti. Lo descrivono come un mondo
      di mari interni senza fondale, diviso in piani di pressione come una
      città in quartieri, dove la luce arriva di rado e filtrata. I suoi
      abitanti venerano le balene-spirito, cetacei traslucidi grandi come
      cattedrali, e ne festeggiano le migrazioni come stagioni religiose. Da
      una bottiglia arenata sulla Cicatrice viene la frase di un cantore:
      «Quaggiù pregare significa trattenere il respiro. Significa fidarsi che
      la corrente sappia dove stiamo andando.»

  # ------------------------------------------------------------ i villaggi del circondario
  - id: mn-ghoran
    titolo: A Ghoran si pesa
    immagine: ambientazione/ghoran
    testo: |
      A Ghoran le leggi di Qir-Azel valgono solo sulla carta, e l'unica
      autorità sono i clan, che riconoscono Ragh Kor'Nul, un uomo con un occhio
      solo e una voce profonda come una miniera. Sotto l'arena dei gladiatori
      ce n'è una seconda, la Fossa del Seme, più antica del villaggio, con
      pareti che nessun martello scheggia e radici nere che palpitano quando ci
      si versa sopra del sangue. I clan ci combattono soltanto per le dispute
      fra famiglie, e Ragh non ci scende da diciannove anni. Fra i mercanti di
      carovana si dice: «A Ghoran non si compra. Si pesa. Tutto. Anche tu,
      mentre guardi.»

  - id: mn-laresh
    titolo: La terra che beve
    immagine: ambientazione/laresh
    testo: |
      Il grano di Laresh, una varietà resistente coltivata da generazioni, fa
      quasi tutto il pane di Qir-Azel. Le estati nel villaggio sono lunghe, e
      in autunno le nebbie arrivano presto. Di notte sui
      campi galleggiano fiammelle azzurre all'altezza di un uomo, e i
      contadini dicono che sono i morti venuti a custodire il raccolto. Al
      mulino centrale lavora Old Marrek, cieco da bambino, che distingue il
      grano buono da quello bruciato dalla sola vibrazione della macina. Lui
      ne dà un'altra spiegazione: «Se la terra beve sangue, allora qualcuno ha
      pagato per il pane che mangi.»

  - id: mn-tuarmir
    titolo: Un fungo da non guardare
    immagine: ambientazione/tuarmir
    testo: |
      A Tuarmir dicono che a certe ore il vento porti visioni, e i forestieri
      rispondono che sono le spore dei funghi sacri, il che probabilmente è
      vero. Nel villaggio le due spiegazioni convivono, e nessuna è mai stata
      dichiarata vincente. La raccolta la guida Madre Cerya, l'erborista cieca.
      Secondo i vecchi perse la vista a nove anni, per aver guardato un fungo
      che era meglio lasciar stare, e da allora riconosce le erbe al tatto e
      all'odore e cammina nella gola senza inciampare mai. Quando dice che un
      raccolto va lasciato in pace, il villaggio obbedisce.

  - id: mn-pannion
    titolo: Il Vecchio
    testo: |
      Pannion sta su un'altura di terra rossa fra le sequoie minori, ed è stato
      il primo villaggio legato a Qir-Azel da un accordo di fornitura. Manda in
      città il legname per i ponti e il carbone per le forge, e nelle sue
      strade si respira sempre fumo. Di notte i boscaioli accendono lanterne
      lungo i pontili per guidare a casa gli spiriti della foresta. Al centro
      del villaggio sorge il Vecchio Albero, un totem annerito dal fumo e alto
      come una casa, che secondo i boscaioli cresce ancora di qualche dito ogni
      decennio. Il caposquadra Darrin Huld gli si rivolge per nome quando deve
      prendere una decisione difficile.

  # ------------------------------------------------------------ usanze
  - id: mn-zekar
    titolo: Stare al momento giusto
    testo: |
      Zekar è il gioco di carte più diffuso a Qir-Azel, e si gioca in due.
      Ognuno pesca dal mazzo comune carte da uno a dieci, e vince il round chi
      si avvicina di più a venti senza superarlo. A fare la differenza sono le
      quattro carte laterali, scelte prima della partita per correggere il
      totale una volta sola. Chi gioca sul
      serio legge l'avversario dalle pause più che dalle carte. Si dice che
      Liaren Tarvelin abbia vinto il Grifone di Ferro a una partita di Zekar, e
      lei non smentisce. Ai tavoli si ripete un adagio: «Stare al momento
      giusto è più importante che arrivare a venti.»
