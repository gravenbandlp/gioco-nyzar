# Frammenti del Codex sul mondo in generale: storia, miti, culti, cristalli, domini e villaggi del circondario.
# Senza `area`, compaiono ovunque. Solo contenuto pubblico; i fatti che la trama cambia hanno requisiti.
frammenti:
  # ------------------------------------------------------------ dalla Caduta alla Fondazione
  - id: mn-la-caduta
    titolo: Il suono prima della frattura
    immagine: ambientazione/rovine-dei-precursori
    testo: |
      Nessuno sa con precisione come avvenne la Caduta, e i pochi testi
      sopravvissuti mescolano il mito alla testimonianza. In pochi giorni i
      Precursori si estinsero e il continente si spezzò in gole e altopiani
      sospesi, mentre la Marea Grigia compariva per la prima volta e chi
      abitava la Superficie mutava nelle razze di oggi. I superstiti parlano
      tutti di un suono basso e prolungato che precedette la frattura di poche
      ore, e che da allora non si è più udito.

  - id: mn-era-del-silenzio
    titolo: Imparare a tacere
    immagine: ambientazione/marea-grigia
    testo: |
      Per vent'anni dopo la Caduta il cielo restò opaco e la Marea Grigia coprì
      gran parte del mondo. I superstiti si rifugiarono nelle caverne e nelle
      rovine, vivendo delle dispense sigillate dei Precursori. I diari di
      quegli anni descrivono comunità che parlavano a bassa voce e solo per il
      necessario. Uno lo spiega così: «Non si parlava perché parlare attirava
      qualcosa. Quel qualcosa, oggi, non lo si nomina più.»

  - id: mn-prima-luce
    titolo: Caldo per conto suo
    immagine: ambientazione/cristalli-conduttori
    testo: |
      Vent'anni dopo la Caduta i superstiti cominciarono a recuperare i primi
      Cristalli Conduttori, e capirono che alcuni si potevano riaccendere,
      anche se più di una comunità fu distrutta dalla Dissonanza del Mana
      provocata da un mago inesperto. Attorno a chi sapeva usarli nacquero i
      primi insediamenti, una comunità per cristallo. Una cronaca ricorda il
      primo che ne tenne uno acceso in mano: «Sapeva solo che era caldo, e
      che era caldo per conto suo.»

  - id: mn-bagliore-di-talrhan
    titolo: Il bagliore di Talrhan
    testo: |
      Nel 70 D.C. un bagliore scarlatto squarciò le nubi sopra le pianure di
      Talrhan, visibile a giorni di cammino. Chi si avvicinò raccontò di un
      Albero colossale con la chioma che ardeva senza consumarsi e le radici
      intrecciate alle rovine dei Precursori. Nelle stesse settimane la Marea
      Grigia si ritirò dalle pianure abitate, e i cristalli cominciarono a
      rispondere ai maghi con una forza mai vista. Fu allora che la loro
      energia prese il nome di Mana.

  - id: mn-cuore-del-mondo
    titolo: Il Cuore del Mondo
    immagine: fazioni/confraternita-del-velo
    testo: |
      I fedeli chiamano il Grande Albero Rosso il Cuore del Mondo. Secondo il Velo le sue
      radici corrono sotto tutta la Superficie Fratturata, e le sue foglie rosse purificano il
      suolo corrotto dalla Marea. Eppure nessuno ha mai detto di averlo raggiunto. Talrhan sta
      in una regione di deserti e voragini oltre i confini conosciuti, e nella Biblioteca di
      Qir-Azel non c'è un solo diario di pellegrino che racconti il viaggio.

  - id: mn-guerra-del-cristallo
    titolo: Si combatté per la luce
    immagine: ambientazione/cristalli-conduttori
    testo: |
      Dopo il 70 D.C. i cristalli divennero più potenti, e la pace durò poco.
      Nell'85 tre comunità si allearono per togliere a una quarta i suoi
      conduttori, e seguirono quindici anni di guerra. Le vincitrici
      cancellarono dagli archivi i nomi delle sconfitte, e più tardi
      distrussero i propri diari, quando capirono di aver fatto ciò di cui
      accusavano i Precursori. La Biblioteca ne conserva una riga: «Si combatté
      per la luce. Lo si fece al buio.»

  - id: mn-catalogo-di-mirhal
    titolo: Il catalogo di Mirhal
    immagine: ambientazione/marea-grigia
    testo: |
      Negli anni della Guerra del Cristallo si documentarono le prime mutazioni
      causate dalla Marea Grigia, dalle pelli squamose agli occhi velati per
      sempre. Il primo catalogo lo compilò nel 95 D.C. una mineralogista
      scampata alla comunità di Mirhal, di cui è l'unica traccia rimasta. Sulle
      sue pagine si regge ancora il manuale dei Raschiatori veterani, che
      riconoscono una mutazione leggera prima che il compagno se ne accorga.

  - id: mn-veggente-del-ferro
    titolo: Il Veggente si è girato
    immagine: ambientazione/cicatrice-del-mondo
    testo: |
      Fra le pietre dove oggi sorgono i Quartieri Alti alcuni dei primi coloni sentirono
      un battito salire dal terreno, e un uomo lo interpretò per primo come una chiamata.
      Lo si ricorda come il Veggente del Ferro, e nessuna fonte ne conserva il nome.
      Quando un cristallo collassa o si apre una fenditura attorno alla Cicatrice, i
      Raschiatori dicono con paura che «il Veggente si è girato nel sonno».

  - id: mn-fondazione
    titolo: Dove c'era luce
    immagine: ambientazione/qir-azel
    testo: |
      Nel 110 D.C. un gruppo di maghi e mercanti si fermò con i sopravvissuti
      sulle sponde della Cicatrice. Il sito era instabile, ma lungo la Strada
      Antica le rovine restituivano conduttori intatti in quantità mai vista.
      I maghi misero in conto i rischi, e ai sopravvissuti li spiegarono a
      trasloco fatto. Un detto dei fondatori: «Sceglievamo se costruire dove
      c'era acqua, o dove c'era luce. Abbiamo scelto la luce. L'acqua ce la
      siamo guadagnata dopo.»

  # ------------------------------------------------------------ i primi quarant'anni di Qir-Azel
  - id: mn-prima-breccia
    titolo: I vapori azzurri
    immagine: ambientazione/marea-grigia
    testo: |
      Nel 115 D.C. crollò un intero livello del Labirinto di Darn-Morakh, e
      dai pozzi-ascensore della Città Bassa cominciarono a salire vapori
      azzurrastri, Marea Grigia nella sua forma più volatile. Quando il Velo
      dichiarò l'emergenza centinaia di persone l'avevano respirata, e alcune
      uscirono cambiate dai dieci giorni passati nel vecchio Santuario. Da
      allora è il Velo a decidere chi è ancora cittadino, e le guardie dei
      pozzi sanno a memoria i Protocolli di Pozzo scritti in quel decennio.

  - id: mn-rito-delle-maschere
    titolo: Quattro discesero
    immagine: ambientazione/cicatrice-del-mondo
    testo: |
      Nel 130 D.C. una voce antica parlò in sogno a tre abitanti della città
      e indicò loro il Labirinto di Darn-Morakh come luogo di un rito.
      Scesero in quattro, perché un quarto si era presentato all'imbocco
      della Strada Antica senza essere chiamato, e Selara Vyn lo aveva
      accolto senza chiedergli il nome. La discesa durò diciassette giorni e
      la risalita uno solo. Riemersero Kael Dareth, Selara ed Eren Solmir, e
      del quarto dissero che era rimasto laggiù.

  - id: mn-kael-dareth
    titolo: La bocca cucita
    testo: |
      Kael Dareth era un guerriero con gli occhi color rame e una cicatrice
      che gli tagliava la bocca, armato di due lame dei Precursori che
      cantavano quando le estraeva. Dal Labirinto tornò con le pupille di
      metallo liquido e una voce che, se la alzava, faceva tremare le pietre,
      e da allora parlò ancora meno. In Cattedrale il suo ritratto ha la
      bocca cucita con fili d'oro. Se sia ancora vivo, il Velo non lo dice.

  - id: mn-selara-vyn
    titolo: Il germoglio inerte
    testo: |
      Prima del Rito Selara Vyn era una guaritrice del Circolo di Velthar, e fu lei a convincere gli altri a scendere. Tornò
      con un bracciale di corteccia pietrificata che non si toglieva, e tutto ciò che toccava appassiva. La accoglievano
      come una santa, perché bastava che restasse tre giorni in un villaggio per attenuare le mutazioni. Le ultime notizie,
      del 148 D.C., la danno in un villaggio a est della Cicatrice che non risponde più ai messaggeri.

  - id: mn-eclisse-di-sangue
    titolo: Tre giorni di cielo rosso
    testo: |
      Un mattino d'inverno del 133 D.C. il cielo sopra la Superficie Fratturata si tinse di rosso per tre giorni. Insieme si
      spensero i Cristalli Conduttori, da Qir-Azel fino al Bosco di Velthar, e le formule degli incantatori restavano sulla
      pagina senza rispondere. Il quarto giorno la luce tornò, e dalla scalinata del vecchio Santuario un sacerdote del Velo
      disse: «Per tre giorni pregammo senza luce. Quando la luce tornò, non era più la stessa luce.»

  - id: mn-fiamma-che-dorme
    titolo: La Fiamma che dorme
    immagine: ambientazione/cicatrice-del-mondo
    testo: |
      Alcuni Raschiatori e qualche vedetta dei Ponti raccontano che al secondo
      giorno dell'Eclisse di Sangue dal Labirinto salì una colonna di luce
      azzurra, che illuminò da sotto il cielo rosso. I testimoni dicono che fu
      silenziosa, e che finché durò smisero di sentire i propri pensieri. La
      chiamarono la Fiamma senza sapere perché. Uno ha lasciato scritto: «La
      vidi una sola volta, e da allora dormo come si dorme accanto a qualcosa
      che potrebbe svegliarsi.»

  - id: mn-notte-dei-sussurri
    titolo: Il suolo che parla
    immagine: ambientazione/evento-notte-dei-sussurri
    testo: |
      Nella notte di tempesta del 137 D.C. la Marea Grigia salì sopra i Ponti
      Sospesi e lambì il vecchio Santuario, senza uccidere nessuno. Molti
      abitanti dei Quartieri Alti raccontarono poi di voci metalliche che
      salivano dal suolo, e qualcuno giurò di aver sentito il proprio nome. Il
      Velo lo dichiarò un miracolo del Grande Albero Rosso, mentre il Ferro dei
      Raschiatori disse che le voci venivano dal Labirinto, e da quella notte
      alcuni veterani smisero di scendere.

  - id: mn-occhio-nel-cristallo
    titolo: L'occhio che segue
    immagine: ambientazione/mito-occhio-nel-cristallo
    testo: |
      Alcuni Raschiatori giurano che i cristalli più antichi del Labirinto,
      guardati al buio, mostrino dentro un occhio che segue chi guarda. Nessuno
      è mai riuscito a estrarne uno intero, perché il cristallo implode e
      lascia nell'aria un fumo che sa di metallo dolce. Intorno al 140 D.C.
      Mirn il Sordo ne vendette un frammento al mercato nero, e cominciò a
      perdere il senno. Di quella vendita disse: «Lo vendetti. Pesava più di
      prima.»

  - id: mn-circolo-del-respiro
    titolo: Viandanti che hanno smesso di chiedere
    immagine: fazioni/circolo-di-velthar
    testo: |
      Nel 140 D.C. una distesa di alberi antichi cominciò a rigenerarsi sulle rovine di una città dei
      Precursori, e le radici restituivano come linfa luminescente la Marea Grigia che assorbivano. Vi
      si trasferì un gruppo di druidi che si chiamavano viandanti che hanno smesso di chiedere e si
      riunivano a spirale attorno a una fenditura calda. Il primo Maestro del Circolo diceva: «Un dio
      non ci serviva. Ci serviva un metodo, e lo abbiamo trovato sotto le radici.»

  # ------------------------------------------------------------ il 145
  - id: mn-notti-cucite
    titolo: Le Notti Cucite
    immagine: ambientazione/evento-notti-cucite-145
    testo: |
      Nel 145 D.C., per un mese, un assassino che in città chiamavano il
      Cucitore uccise venticinque persone e le ricompose come offerte.
      L'ultima notte prese lo sceriffo Ivo Carstan in un vicolo della Città
      Bassa e, ferito nello scontro, lasciò una traccia di sangue che le
      guardie seguirono fino alla Roccia di Wren, sul Torvessa. Lassù
      trovarono l'intagliatore di uccelli Osric Wren, morto ai piedi di un
      altare scavato sotto la sua capanna.

  - id: mn-incendio-del-santuario
    titolo: Le colonne di ferro fuso
    requisiti: [pista.capomozzo < 4, oggetto.diario-di-aurenne == 0]
    immagine: ambientazione/cattedrale-del-velo
    testo: |
      Pochi mesi dopo le Notti Cucite un incendio distrusse la parte
      settentrionale di Qir-Azel e il Santuario del Velo, e fra le colonne di
      ferro fuso morì il cappellano Idrian Sollen, che la città amava. Il Velo
      parlò di una prova divina e molti sospettarono un sabotaggio, ma chi sia
      stato non si sa. Sulle ceneri sorse in cinque anni la Cattedrale. Qualche
      fedele dell'Albero non è più tornato, ed Ettore Castaldi ha appeso
      l'armatura al muro.

  - id: mn-culto-dell-antico
    titolo: Un testimone da interrogare
    testo: |
      Pochi mesi dopo l'incendio del Santuario cominciò a girare ai margini della Superficie Fratturata un sermone non firmato, che
      descriveva il Grande Albero Rosso come un testimone antico. Un dio si adora, e un testimone si interroga. Da quella differenza nacque
      il Culto dell'Antico, che invece di lodare ascolta le correnti di Mana. Nel 147 D.C. il Velo ne cacciò i predicatori dai Quartieri
      Alti, ma in Città Bassa il movimento continua a crescere.

  # ------------------------------------------------------------ la Cicatrice, le rovine, i cristalli
  - id: mn-labirinto
    titolo: Morire incompleti
    immagine: ambientazione/rovine-dei-precursori
    testo: |
      Lungo la Strada Antica che scende nel Labirinto di Darn-Morakh si
      incontrano obelischi incisi da chi è passato prima, e alcune iscrizioni
      portano la firma del Labirinto stesso, in graffi che sembrano freschi su
      pietra vecchia di millenni. Chi esce vivo da una parte del Labirinto che
      si riorganizza di solito non ricorda niente. La più nota delle iscrizioni
      Dragna Gro-Malog la fa imparare alle reclute prima della prima discesa:
      «Discendere è fatale; non discendere è morire incompleti.»

  - id: mn-cicatrice
    titolo: Le notti scure
    immagine: ambientazione/cicatrice-del-mondo
    testo: |
      La luce che sale dalla Cicatrice del Mondo pulsa a cicli irregolari e a volte
      sparisce per giorni, e nelle notti scure la città dorme male. I bambini di
      Qir-Azel imparano presto a riconoscere chi è stato troppo vicino all'orlo, da
      un tremito alla mano sinistra e dagli occhi che non reggono a lungo la stessa
      cosa. I Raschiatori dicono: «I forestieri credono di vedere un'aurora. Noi
      sappiamo cos'è. È qualcuno che, sotto, sta accendendo le lampade.»

  - id: mn-dissonanza
    titolo: Quando un cristallo muore
    immagine: ambientazione/cristalli-conduttori
    testo: |
      Con l'uso i Cristalli Conduttori si incrinano e si esauriscono, e
      qualche volta collassano liberando un'onda di energia instabile che i
      maghi chiamano Dissonanza del Mana. Chi gli stava troppo vicino ne resta
      segnato per settimane, con le mani che tremano e i sogni che tornano
      uguali ogni notte. A margine di un registro della Biblioteca un mago ha
      scritto: «Tutto ciò che ancora vive a Ny'Zar lo si deve a loro. Del
      resto non tengo il conto.»

  - id: mn-salvaguardia
    titolo: Le tre forme
    immagine: ambientazione/mito-salvaguardia-precursori
    testo: |
      I Raschiatori chiamano Salvaguardia le macchine dei Precursori che
      sorvegliano le rovine, e ne distinguono tre forme. Il ragno-sacrificale
      ha quattro braccia e una maschera bianca senza bocca. Il busto
      deformato è metà carne e metà metallo ossidato, con spine di ferro
      sulla schiena. La figura ruotata cammina all'indietro con la testa
      girata e annusa la paura. Nessuna ha fretta, e la regola di mestiere è
      chiudere la spedizione prima di incontrarne una.

  # ------------------------------------------------------------ gli altri domini
  - id: mn-alto-regno
    titolo: Le pietre calde
    testo: |
      Dell'Alto Regno, il dominio dei canyon e delle grotte cristalline,
      parlano solo i pellegrini che giurano di esserci caduti verso l'alto in
      sogno, e alcuni sono tornati con un frammento in tasca. La Biblioteca ne
      custodisce sette, e due di questi nelle notti di luna chiara si scaldano
      al tatto. Su una lastra di micascisto le tribù del Picco hanno inciso:
      «Disegna un cerchio attorno a ciò che vuoi proteggere, e un triangolo
      attorno a ciò che vuoi sapere.»

  - id: mn-regno-profondo
    titolo: Le bottiglie spiaggiate
    immagine: ambientazione/regno-profondo
    testo: |
      Dal Regno Profondo non torna nessuno, e quel poco che Qir-Azel ne sa
      arriva con le ossa di creature sconosciute e le bottiglie spiaggiate.
      Lo descrivono come un mondo di mari interni senza fondale, diviso in
      piani di pressione, i cui abitanti venerano le balene-spirito, cetacei
      traslucidi grandi come cattedrali. Da una bottiglia arenata sulla
      Cicatrice viene la frase di un cantore: «Quaggiù pregare significa
      tenere il respiro, e fidarsi che la corrente sappia dove stiamo
      andando.»

  # ------------------------------------------------------------ i villaggi del circondario
  - id: mn-ghoran
    titolo: A Ghoran si pesa
    immagine: ambientazione/ghoran
    testo: |
      A Ghoran le leggi di Qir-Azel valgono solo sulla carta, e comandano i
      clan, che riconoscono Ragh Kor'Nul, un uomo con un occhio solo e una voce
      profonda come una miniera. Sotto l'arena c'è la Fossa del Seme, con
      radici nere che palpitano quando ci si versa sopra del sangue, e Ragh non
      ci scende da diciannove anni. Fra i mercanti si dice: «A Ghoran non si
      compra. Si pesa. Tutto. Anche tu, mentre guardi.»

  - id: mn-laresh
    titolo: La terra che beve
    immagine: ambientazione/laresh
    testo: |
      Il grano di Laresh fa quasi tutto il pane di Qir-Azel. Le estati sono
      lunghe, e di notte sui campi galleggiano fiammelle azzurre, che i
      contadini dicono siano i morti venuti a custodire il raccolto. Al
      mulino centrale lavora Old Marrek, cieco da bambino, che distingue il
      grano buono da quello bruciato dalla vibrazione della macina. Lui ne dà
      un'altra spiegazione: «Se la terra beve sangue, allora qualcuno ha
      pagato per il pane che mangi.»

  - id: mn-tuarmir
    titolo: Un fungo da non guardare
    immagine: ambientazione/tuarmir
    testo: |
      A Tuarmir dicono che a certe ore il vento porti visioni, e i forestieri
      rispondono che sono le spore dei funghi sacri, il che probabilmente è
      vero. La raccolta la guida Madre Cerya, l'erborista cieca, che secondo i
      vecchi perse la vista a nove anni per aver guardato un fungo che era
      meglio lasciar stare. Riconosce le erbe al tatto e all'odore, e quando
      dice che un raccolto va lasciato in pace il villaggio obbedisce.

  - id: mn-pannion
    titolo: Il Vecchio
    testo: |
      Pannion sta su un'altura fra le sequoie minori, ed è stato il primo
      villaggio a rifornire Qir-Azel. Manda in città il legname per i ponti e
      il carbone per le forge, e di notte i boscaioli accendono lanterne per
      guidare a casa gli spiriti della foresta. Al centro sorge il Vecchio
      Albero, un totem annerito dal fumo che secondo i boscaioli cresce ancora,
      e il caposquadra Darrin Huld gli parla per nome quando deve prendere una
      decisione difficile.

  # ------------------------------------------------------------ usanze
  - id: mn-zekar
    titolo: Stare al momento giusto
    testo: |
      Zekar, il gioco di carte più diffuso a Qir-Azel, si gioca in due. Ognuno
      pesca dal mazzo comune carte da uno a dieci, e vince la mano chi si
      avvicina di più a venti senza superarlo. Le quattro carte laterali,
      scelte prima della partita, correggono il totale una volta sola. Si dice
      che Liaren Tarvelin abbia vinto il Grifone a una partita, e lei non
      smentisce. Ai tavoli: «Stare al momento giusto è più importante che
      arrivare a venti.»
