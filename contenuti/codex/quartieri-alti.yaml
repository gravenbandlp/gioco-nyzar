# Frammenti del Codex dei Quartieri Alti: casate, Consiglio e Municipio, Casa dei Nodi, Accademia, Biblioteca,
# Teatro, Caserma, manieri e locande della terrazza alta. Solo contenuto pubblico; i fatti che la trama cambia hanno requisiti.
frammenti:
  # ------------------------------------------------------------ la terrazza
  - id: qa-pendolo-della-campana
    titolo: Il pendolo della campana grande
    area: quartieri-alti
    immagine: ambientazione/quartieri-alti
    testo: |
      I Quartieri Alti occupano la terrazza più alta di Qir-Azel, affacciata a
      ovest sulla Cicatrice. Le strade sono lastricate di pietra chiara, e la
      sera le lanterne a cristalli gettano un riflesso dorato sui vetri e sui
      tetti di rame. Quassù il giorno lo scandiscono le campane delle ore
      sacre, e fra un rintocco e l'altro si sentono soltanto i canti dei
      chierici e il passo delle guardie del Velo, che girano in coppia senza
      parlarsi. In Città Bassa del quartiere danno una descrizione più breve,
      che nessuno pronuncia senza sarcasmo: «Quassù il sangue non si sente. Si
      sente solo il pendolo della campana grande.»

  - id: qa-obelischi
    titolo: Il ronzio della sera
    area: quartieri-alti
    immagine: ambientazione/cristalli-conduttori
    testo: |
      Fra le case dei Quartieri Alti si alzano obelischi di pietra con un
      cristallo conduttore incastonato in cima. Di giorno passano per
      ornamenti, e le signore ci fanno ombra ai cagnolini. Al calare della sera
      cominciano a ronzare a bassa voce, e le creature minori della Marea che
      risalgono dalla Cicatrice si tengono lontane dalla terrazza e dai ponti
      che le stanno sotto. Gli abitanti lo attribuiscono alla fede, i
      Raschiatori alla corrente. I bambini del quartiere scoprono presto che
      appoggiando l'orecchio alla pietra si sentono formicolare i denti, e le
      governanti hanno rinunciato a proibirlo da molti anni.

  - id: qa-daino-zoppo
    titolo: Si arriva stanchi
    area: quartieri-alti
    immagine: ambientazione/quartieri-alti
    testo: |
      La Locanda del Daino Zoppo sta a pochi passi dalla porta nord, ed è il
      primo riparo per chi entra in città da quel lato, i mercanti di Laresh
      come i pellegrini dei villaggi. Ha stanze comode al piano di sopra e una
      sala che serve piatti caldi a ogni ora, e sull'insegna c'è un cerbiatto
      bianco intagliato. Sotto il portico l'oste tiene una lavagna con i nomi
      di chi ha perso al tavolo e non ha pagato, e un nome che ci resta fino a
      sera arriva nei salotti prima della cena. Fra i viandanti si dice: «Al
      Daino Zoppo si arriva stanchi. È l'unica cosa che ti chiedono.»

  - id: qa-arena-chiusa
    titolo: Le mura più vecchie
    area: quartieri-alti
    requisiti: [pista.arena == 0]
    immagine: ambientazione/cristalli-conduttori
    testo: |
      Al limitare nord-ovest dei Quartieri Alti sorge l'Arena, più antica dei
      palazzi che le sono cresciuti intorno. Le mura di pietra sono rinforzate
      con archi e nervature di metallo strappate alle rovine dei Precursori, e
      nei canali fra un blocco e l'altro scorre una luce azzurrina che non si
      spegne mai. È chiusa da anni, e il portone ha le borchie lucide soltanto
      all'altezza di una mano, perché i ragazzi del quartiere si sfidano a
      toccarlo di notte. I vecchi ricordano che ogni volta che ha riaperto la
      città ha scommesso su tutto, perfino sul tempo.

  # ------------------------------------------------------------ Consiglio e Municipio
  - id: qa-sette-seggi
    titolo: Sette seggi
    area: quartieri-alti
    requisiti: [pista.pelle < 5]
    immagine: fazioni/consiglio-di-qir-azel
    testo: |
      Il Consiglio di Qir-Azel si riunisce in Municipio e ha sette seggi. Ci
      siedono la Rappresentante Julia Castaldi e lo sceriffo Toren Galdrick,
      Padre Aurelio Vantes per il Velo, Tarquin Cordani per la Gilda dei
      Mercanti e Tenebra per i Raschiatori, insieme ai capi delle casate
      Malgrani e Tarvelin. Le rivalità bloccano quasi ogni decisione, e il lavoro di tutti
      i giorni finisce delegato alla Gilda o alla Caserma. Le licenze sul grano
      volute da Julia sono la frattura più aperta degli ultimi anni. Lei
      stessa, in privato, la mette così: «Qir-Azel la conteniamo, più che
      rappresentarla. È il massimo che si riesca a ottenere con sette seggi.»

  - id: qa-julia-castaldi
    titolo: La toga e le scarpe da strada
    area: quartieri-alti
    immagine: personaggi/julia-castaldi
    testo: |
      Julia Castaldi porta i capelli tagliati di netto sopra le orecchie e,
      sotto la toga della Rappresentante, un paio di scarpe da camminata. Non
      si presenta mai come una nobile, anche quando lo è, e nel Consiglio di
      Qir-Azel questo vale già come dichiarazione politica. Detesta le
      perifrasi e i sussurri d'anticamera. Quando ascolta guarda
      l'interlocutore negli occhi senza interromperlo, e quando risponde lo fa
      in poche frasi. Alle sedute arriva con le pratiche già lette. Ha aperto
      la sessione di primavera con queste parole: «La chiarezza è il primo
      dovere di chi rappresenta. Tutto il resto viene dopo, e costa meno.»

  - id: qa-municipio
    titolo: Dalla seconda campana
    area: quartieri-alti
    immagine: ambientazione/quartieri-alti
    testo: |
      Il Municipio ha le porte più grandi di Qir-Azel e un'anticamera dove si
      aspetta su una panca di legno consumata nel mezzo. Gli impiegati
      ricevono dalla seconda campana in poi, un nome alla volta, e la mattina
      finisce sempre prima della lista. Il primo impiegato, Tullio Merga,
      inforca gli occhiali appesi alla cordicella soltanto per i nomi
      difficili, e sotto di sé tiene un cuscino ricamato che sulla panca
      nessuno ha. Nei Quartieri Alti si dice che in Municipio si discuta e che
      le decisioni vere si prendano in Cattedrale. Tullio lo sente ripetere
      ogni mattina dalla panca, e intanto continua a chiamare i nomi.

  # ------------------------------------------------------------ Gilda e Casa dei Nodi
  - id: qa-casa-dei-nodi
    titolo: Due porte che si chiudono da dentro
    area: quartieri-alti
    immagine: fazioni/gilda-dei-mercanti
    testo: |
      La Casa dei Nodi, poco lontano dalla Cattedrale, è un intrico di catene e
      di terrazze sospese che sembrano reggersi a vicenda. È la sede della
      Gilda dei Mercanti e dei Custodi di Passaggio, e ne custodisce
      l'archivio dei dazi. Qui nel 118 D.C. le famiglie dei ponti firmarono il
      Patto delle Corde, e i gradini della scalinata sono consumati al centro
      dalle scarpe dei mercanti venuti dopo. Le riunioni che contano si tengono
      al terzo piano, nell'unica sala con due porte che si chiudono da dentro.
      Sotto il portico un uomo vende alberi genealogici, e a chi paga trova
      sempre un antenato fra i firmatari.

  - id: qa-sovrintendente-cordani
    titolo: Resto comunque
    area: quartieri-alti
    testo: |
      Tarquin Cordani guida la Gilda dei Mercanti come Sovrintendente, una
      carica che si rinnova per elezione ogni cinque anni. Porta una camicia
      bianca sempre fresca e un panciotto su misura, e quando si arrabbia lo si
      capisce soltanto dalle mani, che smettono di muoversi sopra il tavolo.
      Sa di essere un idealista in mezzo a gente che non lo è. Il levriero di
      famiglia, Decoro, ruba i guanti alle signore sulla scalinata, e il
      valletto tiene in tasca una mancia apposta. A Irsa Valbrun, una sera,
      Tarquin ha detto: «Il commercio può servire la città oltre che il
      profitto. Tre seggi di questa Casa lo negano apertamente. Resto
      comunque.»

  # ------------------------------------------------------------ i Castaldi
  - id: qa-maniero-castaldi
    titolo: Qui dormo
    area: quartieri-alti
    immagine: fazioni/famiglia-castaldi
    testo: |
      Il Maniero Castaldi è fra le case più sobrie dei Quartieri Alti, tre
      piani di pietra chiara sopra un seminterrato di magazzini, con un fico
      antico al centro del cortile interno. La facciata non porta stemmi
      vistosi, soltanto il sigillo della casata inciso sopra il portone, due
      bilance incrociate sopra un cerchio aperto. Le porte si aprono nei giorni
      di consiglio e restano chiuse il resto del tempo, perché chi ha affari da
      trattare con la Rappresentante deve andare in Municipio. La regola l'ha
      voluta lei: «Le udienze le faccio in Municipio. Qui dormo, e a volte
      penso.»

  - id: qa-casata-castaldi
    titolo: Promesse e alleanze
    area: quartieri-alti
    immagine: fazioni/famiglia-castaldi
    testo: |
      Fra le casate fondatrici di Qir-Azel i Castaldi sono la più costante,
      anche se non la più ricca. In quarant'anni non hanno mai cambiato
      bandiera né si sono legati ad alleanze che potessero tenerli in ostaggio,
      e alle faide della Gilda hanno sempre guardato da fuori. È per questo che
      Julia ha potuto farsi eleggere Rappresentante senza che la sua
      candidatura sembrasse un'imposizione. La casata ha amici a Laresh e a
      Pannion, e un detto che in famiglia attribuiscono al nonno di Julia: «La
      nostra casata firma promesse, e le mantiene. Le alleanze le lasciamo
      firmare agli altri.»

  - id: qa-cene-di-consiglio
    titolo: Di Stato, mai dei Castaldi
    area: quartieri-alti
    immagine: personaggi/marella-castaldi
    testo: |
      Nei giorni di consiglio Marella Castaldi, cognata della Rappresentante,
      apre il Maniero alle altre casate e decide chi viene invitato e dove si
      siede. Veste con sobrietà raffinata e parla con un'eleganza che fa
      sembrare caute anche le sue battute, e quando in famiglia manca un
      accordo è lei a mediare. A tavola vale una regola sola, che ripete agli
      ospiti nuovi prima della minestra, e cioè che si parla di Stato e mai dei
      Castaldi. Intanto i servitori si passano gli ordini con un sistema di
      segnali muti inventato dal maggiordomo, e nessuna conversazione viene
      interrotta da un piatto.

  - id: qa-quintus-vael
    titolo: La spada ai ricevimenti
    area: quartieri-alti
    immagine: personaggi/quintus-vael
    testo: |
      Quintus Vael comanda la guardia dei Castaldi, cinque uomini fissi al
      Maniero che ha addestrato di persona. Ha i capelli grigi corti e sotto il
      mento la cicatrice lasciata da un orco vent'anni fa, e in ogni stanza
      conta le porte prima delle persone. Quando la Rappresentante va in
      Municipio è lui a decidere il percorso e la scorta, e lo sceriffo
      Galdrick, che lo conosce dalle campagne contro le tribù, non discute.
      Indossa l'armatura di cuoio anche ai ricevimenti, e a Marella, che
      glielo faceva notare, ha risposto: «Le ricezioni vorrebbero che mi
      togliessi la spada, e io non la tolgo. Ringraziatemi quando capirete il
      perché.»

  # ------------------------------------------------------------ Tarvelin e Malgrani
  - id: qa-maniero-tarvelin
    titolo: Il giardino chiuso
    area: quartieri-alti
    requisiti: [pista.acciaio < 4]
    immagine: ambientazione/maniero-tarvelin
    testo: |
      Il Maniero Tarvelin è la residenza più silenziosa dei Quartieri Alti. Il
      giardino, che un tempo era il vanto della casa, è chiuso da una decina
      d'anni per un lutto, e il cancello è tenuto da una catena che
      arrugginisce senza che nessuno la tocchi. Ondrel Tarvelin ci riceve
      soltanto per gli affari della Gilda. Con la figlia Liaren non si parla da
      anni, e lei al Maniero non ha più messo piede. Di lui si ricorda una
      frase detta alla colata del mattino, all'Acciaieria: «Il lyssan
      riconosce chi lo forgia. Le persone, no.»

  - id: qa-maniero-malgrani
    titolo: Mai gli stessi ospiti
    area: quartieri-alti
    requisiti: [pista.pelle < 7]
    immagine: ambientazione/maniero-malgrani
    testo: |
      Il Maniero Malgrani sta nella parte settentrionale dei Quartieri Alti,
      oltre il giro delle ronde, fra pini contorti. Il cancello di ferro
      battuto porta un alloro dorato, e nel cortile le statue degli antenati
      sono consumate dalla pioggia. Nell'atrio i busti di famiglia cominciano
      da Brandano, il padre di Ottone, e dalla moglie Vermilia. Ottone riceve
      molto e mai gli stessi ospiti due volte, perché ogni cena gli serve a
      legare qualcuno a qualcos'altro. Si dice che le decisioni importanti le
      prenda in giardino, con i suoi tre cani da caccia, e che la finestra del
      suo studio resti accesa fino a tardi.

  - id: qa-maniero-malgrani-venduto
    titolo: Un cartello sull'alloro
    area: quartieri-alti
    requisiti: [pista.pelle >= 7]
    immagine: ambientazione/maniero-malgrani
    testo: |
      Dopo la condanna di Ottone il Maniero Malgrani è passato al Comune, che
      lo ha messo in vendita con tutto quello che c'era dentro, dai busti
      dell'atrio agli specchi dei saloni. Le guardie in livrea verde hanno
      perso il posto, e Lucia Malgrani è partita per Ghoran, dove i figli
      stavano già con la zia Urtilia. Il Consiglio vorrebbe farne un istituto
      di studi. Per adesso sull'alloro dorato del cancello è appeso un
      cartello del Comune, e i passanti rallentano per leggerlo anche quando
      lo sanno a memoria.

  - id: qa-lucia-malgrani
    titolo: Io osservo
    area: quartieri-alti
    requisiti: [pista.pelle < 7]
    immagine: personaggi/lucia-malgrani
    testo: |
      Lucia Malgrani è più giovane del marito e attaccata alle tradizioni
      quanto lui. Vive quasi sempre chiusa nelle stanze private del Maniero con
      i tre figli piccoli, veste tessuti scuri dai ricami minuti e con gli
      ospiti parla solo per dovere. L'unica uscita che si concede con
      regolarità è il Teatro delle Meraviglie, dove siede nel palco di famiglia
      e ride di rado. Chi l'ha conosciuta da ragazza la ricorda più allegra. A
      Isotta Cordani, in uno dei loro rari incontri, ha spiegato la sua casa
      così: «Mio marito riceve. Io osservo. Le due cose, sommate, fanno una
      casa.»

  # ------------------------------------------------------------ Accademia e Biblioteca
  - id: qa-seminterrato
    titolo: Il resto della scuola viene dopo
    area: quartieri-alti
    immagine: ambientazione/accademia-di-torvessa
    testo: |
      L'Accademia di Torvessa è la scuola della città, con le aule ai piani
      alti e la collezione del preside nel seminterrato. Orvald Temmerin ha
      passato trent'anni negli scavi e ha accettato la presidenza a una
      condizione, che il seminterrato restasse suo. Laggiù tiene le armi e i
      trofei delle sue spedizioni, e la sera ci scende a rimetterli in ordine.
      Riceve i genitori degli allievi una volta al mese. A chi gli domanda a
      che cosa serva il seminterrato risponde con la stessa frase, una delle
      poche che ripete volentieri: «Ho accettato la presidenza per tenere
      aperto il seminterrato. Il resto della scuola viene dopo.»

  - id: qa-tobol-aspern
    titolo: Mappe esatte
    area: quartieri-alti
    immagine: personaggi/tobol-aspern
    testo: |
      Il cartografo Tobol Aspern è uno gnomo anziano con gli occhiali tondi e
      le cravatte più vistose dei Quartieri Alti, e sulla spalla gli sta un
      geco verde di nome Whisp. Le sue mappe costano più di quelle di
      chiunque altro, e si vendono lo stesso, perché segnano anche i sentieri
      che non stanno sulle altre. È il migliore amico di Orvald Temmerin e ci
      litiga quasi ogni giorno, di solito per un sentiero che uno dei due ha
      percorso trent'anni fa. A chi tratta sul prezzo risponde sempre: «La
      mappa costa. La precisione costa di più. Le mie costano entrambe le
      cose.»

  - id: qa-scaffali-sigillati
    titolo: Cera nera e nastro rosso
    area: quartieri-alti
    immagine: ambientazione/biblioteca-di-qir-azel
    testo: |
      La Biblioteca di Qir-Azel è archivio pubblico ai piani bassi e archivio
      chiuso a quelli alti. Al secondo piano interi corridoi hanno gli scaffali
      sigillati con la cera nera della Confraternita e un nastro rosso passato
      fra le maniglie, e su ogni sigillo è impresso l'Albero. Per quegli
      scaffali non c'è un catalogo da consultare. Il Velo li apre soltanto su
      richiesta motivata e agli studiosi che ritiene adatti, e le richieste
      passano dal bancone del bibliotecario, che le legge con il monocolo e di
      solito le rimanda indietro con una domanda di storia.

  - id: qa-ulric-stanne
    titolo: Chiedimi cosa cerchi
    area: quartieri-alti
    immagine: personaggi/ulric-stanne
    testo: |
      Ulric Stanne, il bibliotecario, ha passato da un pezzo i settant'anni.
      Porta una barba bianca lunga che si pettina con le dita mentre legge e
      un panciotto rosso fuori moda da decenni. È stato avventuriero e non lo
      nasconde. Ignora con cortesia la maggior parte dei lettori, ma con chi
      sa un po' di storia o di mitologia parla per due ore di fila, e alla fine
      gli apre i materiali che cerca. Dietro la scrivania tiene un liuto con
      una corda rotta e lo suona soltanto dopo la chiusura. Ai nuovi lettori
      dice: «Chiedimi cosa cerchi. Può darsi che ce l'abbia, e può darsi che
      non te lo dia.»

  - id: qa-mattias-crenn
    titolo: Gli appunti
    area: quartieri-alti
    immagine: personaggi/mattias-crenn
    testo: |
      Mattias Crenn ha lo studio al primo piano della Biblioteca, in mezzo alle
      mappe arrotolate e alle schegge di pietra precuriana. È uno studioso
      che da trent'anni legge la lingua dei Precursori come pochi altri in
      città. Ha scritto cinque
      monografie, e due sono state pubblicate. Al secondo bicchiere comincia a
      lamentarsi di quanto poco gli si riconosca, al terzo cita a memoria le
      pagine respinte. Ulric Stanne, il suo migliore amico, dopo ogni rifiuto
      gli prepara una cena con il vino buono. Mattias riassume la faccenda
      così: «Una città intera mi deve un riconoscimento. Si tiene il
      riconoscimento. Io mi tengo gli appunti.»

  - id: qa-trascrizioni-di-eren
    titolo: Il resto non mi appartiene
    area: quartieri-alti
    immagine: ambientazione/biblioteca-di-qir-azel
    testo: |
      La Biblioteca conserva le trascrizioni di Eren Solmir, il più giovane
      dei tre che risalirono dal Labirinto con le Maschere. Si dice che sia
      stato il primo a decifrare i simboli incisi sulle pareti di Darn-Morakh.
      I fogli si interrompono a metà dopo il Rito, ed Eren non li completò mai.
      «Ho capito quello che dovevo capire» avrebbe detto. «Il resto non mi
      appartiene.» Per altri cinque anni venne a leggere al tavolo lungo senza
      dormire, e al suo passaggio le lanterne si accendevano da sole. Dal 137
      D.C. non se ne hanno notizie. A chi gli chiese dove fosse andato, Padre
      Aurelio Vantes rispose: «È dove ha sempre voluto essere.»

  # ------------------------------------------------------------ Teatro
  - id: qa-teatro
    titolo: Quassù si ride
    area: quartieri-alti
    immagine: ambientazione/teatro-delle-meraviglie
    testo: |
      Il Teatro delle Meraviglie ha una platea per le famiglie dei Quartieri
      Alti e un loggione per tutti gli altri, e i cartelloni all'ingresso
      cambiano di continuo. Il padrone, Orazio Belcanto, ha con Liaren
      Tarvelin una rivalità di palco di cui nessuno dei due ricorda l'origine.
      Si racconta che anni fa abbiano provato a cantare in duetto davanti al
      pubblico, e che le loro versioni di quella serata non coincidano
      in un solo dettaglio. Isotta Cordani, che dal suo palco non perde una
      prima, l'ha detto meglio di tutti: «Quassù si ride per cose che giù
      sarebbero condanne.»

  - id: qa-orazio-belcanto
    titolo: Una pessima coreografia
    area: quartieri-alti
    immagine: personaggi/orazio-belcanto
    testo: |
      Orazio Belcanto possiede il Teatro delle Meraviglie e ci fa quasi tutto
      da sé, dai cartelloni alle parti principali. Porta un anello a ogni
      dito, e l'unico che serve a qualcosa è quello con il sigillo del Teatro.
      Parla un tono sopra la sua voce naturale e ammette la propria vanità con
      un candore che gli fa perdonare quasi tutto. Recluta bardi di continuo e
      paga bene chi resiste fino alla fine della stagione, che di solito è
      meno della metà. A un cronista che gli chiedeva quanto fosse vera una
      sua commedia ha risposto: «La verità è una pessima coreografia. Per
      fortuna gestisco un teatro, mica un tribunale.»

  # ------------------------------------------------------------ Caserma
  - id: qa-caserma
    titolo: Tornare alla luce
    area: quartieri-alti
    immagine: ambientazione/guarnigione-di-qir-azel
    testo: |
      La Guarnigione di Qir-Azel, che in città chiamano la Caserma, è la sede
      dello sceriffo e il cortile dove la Guardia cittadina e i Raschiatori si
      addestrano insieme. L'accordo è vecchio quanto il mastio, e i due corpi
      lo pagano conoscendosi un po' troppo bene. Due guardie bardate
      presidiano la porta giorno e notte, e sotto il cortile ci sono le celle.
      Dragna Gro-Malog, il Ferro dei Raschiatori, addestra qui le reclute, e
      ai turni del mattino ripete sempre le stesse parole: «Imparare a
      sopravvivere ai tunnel non basta. Bisogna anche imparare a tornare a
      sorridere alla luce.»

  - id: qa-galdrick-e-il-cucitore
    titolo: L'uomo che fermò il Cucitore
    area: quartieri-alti
    immagine: personaggi/toren-galdrick
    testo: |
      Durante le Notti Cucite Toren Galdrick era il vice del capitano della
      Guardia, e il Cucitore uccise il suo capitano. Galdrick raccolse i pochi
      uomini ancora in piedi e tenne le strade fino all'alba, e una settimana
      dopo la città lo confermò sceriffo con un'elezione d'emergenza. Da
      allora siede in Consiglio. La storia la imparano i bambini a scuola e la
      ricamano i veterani nelle taverne, e lui non la conferma né la smentisce.
      Ascolta e cambia discorso. Chi prova a comprarlo se ne va senza una
      risposta, e Galdrick si ricorda il suo nome per sempre.
