# Frammenti del Codex dei Quartieri Alti: casate, Consiglio e Municipio, Casa dei Nodi, Accademia, Biblioteca,
# Teatro, Caserma, manieri e locande della terrazza alta. Solo contenuto pubblico; i fatti che la trama cambia hanno requisiti.
frammenti:
  # ------------------------------------------------------------ la terrazza
  - id: qa-pendolo-della-campana
    titolo: Il pendolo della campana grande
    area: quartieri-alti
    immagine: ambientazione/quartieri-alti
    testo: |
      I Quartieri Alti occupano la terrazza più alta di Qir-Azel, affacciata a
      ovest sulla Cicatrice. Il giorno lo scandiscono le campane delle ore
      sacre, e fra un rintocco e l'altro si sente il passo delle guardie del
      Velo, che girano in coppia senza parlarsi. In Città Bassa ne danno una
      descrizione sarcastica: «Quassù il sangue non si sente. Si sente solo il
      pendolo della campana grande.»

  - id: qa-obelischi
    titolo: Il ronzio della sera
    area: quartieri-alti
    immagine: ambientazione/cristalli-conduttori
    testo: |
      Fra le case dei Quartieri Alti si alzano obelischi di pietra con un
      cristallo conduttore in cima. Di giorno passano per ornamenti, ma la sera
      ronzano, e le creature minori della Marea che risalgono dalla Cicatrice
      si tengono lontane dalla terrazza. Gli abitanti lo attribuiscono alla
      fede, i Raschiatori alla corrente. I bambini scoprono presto che
      appoggiando l'orecchio alla pietra si sentono formicolare i denti.

  - id: qa-daino-zoppo
    titolo: Si arriva stanchi
    area: quartieri-alti
    immagine: ambientazione/quartieri-alti
    testo: |
      La Locanda del Daino Zoppo, a pochi passi dalla porta nord, è il primo
      riparo per chi entra in città da quel lato. Sotto il portico l'oste
      tiene una lavagna con i nomi di chi ha perso al tavolo e non ha pagato,
      e un nome che ci resta fino a sera arriva nei salotti prima della cena.
      Fra i viandanti si dice: «Al Daino Zoppo si arriva stanchi. È l'unica
      cosa che ti chiedono.»

  - id: qa-arena-chiusa
    titolo: Le mura più vecchie
    area: quartieri-alti
    requisiti: [pista.arena == 0]
    immagine: ambientazione/cristalli-conduttori
    testo: |
      Al limitare nord-ovest dei Quartieri Alti sorge l'Arena, più antica dei
      palazzi intorno, con le mura rinforzate da nervature di metallo dei
      Precursori in cui scorre una luce azzurrina. È chiusa da anni, e il
      portone ha le borchie lucide soltanto all'altezza di una mano, perché i
      ragazzi si sfidano a toccarlo di notte. I vecchi ricordano che ogni
      volta che ha riaperto la città ha scommesso su tutto.

  # ------------------------------------------------------------ Consiglio e Municipio
  - id: qa-sette-seggi
    titolo: Sette seggi
    area: quartieri-alti
    requisiti: [pista.pelle < 5]
    immagine: fazioni/consiglio-di-qir-azel
    testo: |
      Il Consiglio di Qir-Azel si riunisce in Municipio e ha sette seggi. Ci siedono la
      Rappresentante Julia Castaldi e lo sceriffo Toren Galdrick, Padre Aurelio Vantes
      per il Velo, Tarquin Cordani per la Gilda dei Mercanti e Tenebra per i Raschiatori,
      insieme ai capi delle casate Malgrani e Tarvelin. Le rivalità bloccano quasi ogni
      decisione, e Julia in privato la mette così: «Qir-Azel la conteniamo, più che
      rappresentarla. È il massimo che si riesca a ottenere con sette seggi.»

  - id: qa-julia-castaldi
    titolo: La toga e le scarpe da strada
    area: quartieri-alti
    immagine: personaggi/julia-castaldi
    testo: |
      Julia Castaldi porta i capelli tagliati di netto sopra le orecchie e,
      sotto la toga della Rappresentante, un paio di scarpe da camminata. Non
      si presenta mai come una nobile, e in Consiglio questo vale già come
      dichiarazione politica. Ha aperto la sessione di primavera così: «La
      chiarezza è il primo dovere di chi rappresenta. Tutto il resto viene
      dopo, e costa meno.»

  - id: qa-municipio
    titolo: Dalla seconda campana
    area: quartieri-alti
    immagine: ambientazione/quartieri-alti
    testo: |
      Il Municipio ha le porte più grandi di Qir-Azel e un'anticamera con una
      panca di legno consumata nel mezzo. Gli impiegati ricevono dalla seconda
      campana, un nome alla volta, e la mattina finisce sempre prima della
      lista. Il primo impiegato, Tullio Merga, siede su un cuscino ricamato
      che sulla panca nessuno ha. Nei Quartieri Alti si dice che in Municipio
      si discuta e che le decisioni vere si prendano in Cattedrale.

  # ------------------------------------------------------------ Gilda e Casa dei Nodi
  - id: qa-casa-dei-nodi
    titolo: Due porte che si chiudono da dentro
    area: quartieri-alti
    immagine: fazioni/gilda-dei-mercanti
    testo: |
      La Casa dei Nodi, poco lontano dalla Cattedrale, è un intrico di catene e
      di terrazze sospese, sede della Gilda dei Mercanti e dei Custodi di
      Passaggio. Qui nel 118 D.C. fu firmato il Patto delle Corde. Le riunioni
      che contano si tengono al terzo piano, nell'unica sala con due porte che
      si chiudono da dentro. Sotto il portico un uomo vende alberi genealogici,
      e a chi paga trova sempre un antenato fra i firmatari.

  - id: qa-sovrintendente-cordani
    titolo: Resto comunque
    area: quartieri-alti
    testo: |
      Tarquin Cordani guida la Gilda dei Mercanti come Sovrintendente, una
      carica elettiva che dura cinque anni. Quando si arrabbia lo si capisce
      soltanto dalle mani, che smettono di muoversi sopra il tavolo. Il
      levriero di famiglia, Decoro, ruba i guanti alle signore sulla
      scalinata. A Irsa Valbrun, una sera, Tarquin ha detto: «Il commercio
      può servire la città oltre che il profitto. Tre seggi di questa Casa
      lo negano apertamente. Resto comunque.»

  # ------------------------------------------------------------ i Castaldi
  - id: qa-maniero-castaldi
    titolo: Qui dormo
    area: quartieri-alti
    immagine: fazioni/famiglia-castaldi
    testo: |
      Il Maniero Castaldi è fra le case più sobrie dei Quartieri Alti, tre
      piani di pietra chiara con un fico antico nel cortile e, sopra il
      portone, il sigillo delle due bilance incrociate su un cerchio aperto. Le
      porte si aprono soltanto nei giorni di consiglio. La regola l'ha voluta
      la Rappresentante: «Le udienze le faccio in Municipio. Qui dormo, e a
      volte penso.»

  - id: qa-casata-castaldi
    titolo: Promesse e alleanze
    area: quartieri-alti
    immagine: fazioni/famiglia-castaldi
    testo: |
      Fra le casate fondatrici di Qir-Azel i Castaldi sono la più costante,
      anche se non la più ricca. In quarant'anni non hanno mai cambiato
      bandiera e alle faide della Gilda hanno sempre guardato da fuori, ed è
      per questo che Julia ha potuto farsi eleggere senza che sembrasse
      un'imposizione. In famiglia attribuiscono un detto al nonno di Julia:
      «La nostra casata firma promesse, e le mantiene. Le alleanze le
      lasciamo firmare agli altri.»

  - id: qa-cene-di-consiglio
    titolo: Di Stato, mai dei Castaldi
    area: quartieri-alti
    immagine: personaggi/marella-castaldi
    testo: |
      Nei giorni di consiglio Marella Castaldi, cognata della Rappresentante,
      apre il Maniero alle altre casate e decide chi viene invitato e dove si
      siede. Quando in famiglia manca un accordo è lei a mediare. A tavola, lo
      ripete agli ospiti nuovi prima della minestra, si parla di Stato e mai
      dei Castaldi, mentre i servitori si passano gli ordini con segnali muti
      inventati dal maggiordomo.

  - id: qa-quintus-vael
    titolo: La spada ai ricevimenti
    area: quartieri-alti
    immagine: personaggi/quintus-vael
    testo: |
      Quintus Vael comanda la guardia dei Castaldi, cinque uomini che ha
      addestrato di persona. Ha sotto il mento la cicatrice di un orco, e in
      ogni stanza conta le porte prima delle persone. A Marella, che gli faceva
      notare la spada ai ricevimenti, ha risposto: «Le ricezioni vorrebbero che
      mi togliessi la spada, e io non la tolgo. Ringraziatemi quando capirete
      il perché.»

  # ------------------------------------------------------------ Tarvelin e Malgrani
  - id: qa-maniero-tarvelin
    titolo: Il giardino chiuso
    area: quartieri-alti
    requisiti: [pista.acciaio < 4]
    immagine: ambientazione/maniero-tarvelin
    testo: |
      Il Maniero Tarvelin è la residenza più silenziosa dei Quartieri Alti. Il
      giardino è chiuso da una decina d'anni per un lutto, con una catena al
      cancello che arrugginisce senza che nessuno la tocchi. Ondrel Tarvelin ci
      riceve soltanto per gli affari della Gilda, e la figlia Liaren non ci ha
      più messo piede. Di lui si ricorda una frase detta all'Acciaieria: «Il
      lyssan riconosce chi lo forgia. Le persone, no.»

  - id: qa-maniero-malgrani
    titolo: Mai gli stessi ospiti
    area: quartieri-alti
    requisiti: [pista.pelle < 7]
    immagine: ambientazione/maniero-malgrani
    testo: |
      Il Maniero Malgrani sta nella parte settentrionale dei Quartieri Alti,
      fra pini contorti, dietro un cancello di ferro battuto con un alloro
      dorato. Nell'atrio i busti di famiglia cominciano da Brandano, il padre
      di Ottone, e dalla moglie Vermilia. Ottone riceve molto e mai gli stessi
      ospiti due volte, perché ogni cena gli serve a legare qualcuno a
      qualcos'altro.

  - id: qa-maniero-malgrani-venduto
    titolo: Un cartello sull'alloro
    area: quartieri-alti
    requisiti: [pista.pelle >= 7]
    immagine: ambientazione/maniero-malgrani
    testo: |
      Dopo la condanna di Ottone il Maniero Malgrani è passato al Comune, che
      lo ha messo in vendita con tutto quello che c'era dentro. Lucia
      Malgrani è partita per Ghoran, dove i figli stavano già con la zia
      Urtilia. Il Consiglio vorrebbe farne un istituto di studi, e intanto
      sull'alloro dorato del cancello è appeso un cartello del Comune che i
      passanti rallentano a leggere anche quando lo sanno a memoria.

  - id: qa-lucia-malgrani
    titolo: Io osservo
    area: quartieri-alti
    requisiti: [pista.pelle < 7]
    immagine: personaggi/lucia-malgrani
    testo: |
      Lucia Malgrani è più giovane del marito e attaccata alle tradizioni
      quanto lui. Vive quasi sempre chiusa nelle stanze private del Maniero con
      i tre figli piccoli, e l'unica uscita che si concede è il Teatro delle
      Meraviglie, dove siede nel palco di famiglia e ride di rado. A Isotta
      Cordani ha spiegato la sua casa così: «Mio marito riceve. Io osservo. Le
      due cose, sommate, fanno una casa.»

  # ------------------------------------------------------------ Accademia e Biblioteca
  - id: qa-seminterrato
    titolo: Il resto della scuola viene dopo
    area: quartieri-alti
    immagine: ambientazione/accademia-di-torvessa
    testo: |
      L'Accademia di Torvessa ha le aule ai piani alti e la collezione del
      preside nel seminterrato. Orvald Temmerin ha passato trent'anni negli
      scavi e ha accettato la presidenza a condizione che il seminterrato
      restasse suo, e la sera ci scende a riordinare i trofei delle sue
      spedizioni. A chi gli domanda perché risponde sempre: «Ho accettato la
      presidenza per tenere aperto il seminterrato. Il resto della scuola
      viene dopo.»

  - id: qa-tobol-aspern
    titolo: Mappe esatte
    area: quartieri-alti
    immagine: personaggi/tobol-aspern
    testo: |
      Il cartografo Tobol Aspern è uno gnomo anziano con le cravatte più
      vistose dei Quartieri Alti e un geco verde di nome Whisp sulla spalla.
      Le sue mappe costano più delle altre perché segnano anche i sentieri
      che le altre non hanno, e a chi tratta sul prezzo risponde: «La mappa
      costa. La precisione costa di più. Le mie costano entrambe le cose.»
      Con Orvald Temmerin, il suo migliore amico, litiga quasi ogni giorno.

  - id: qa-scaffali-sigillati
    titolo: Cera nera e nastro rosso
    area: quartieri-alti
    immagine: ambientazione/biblioteca-di-qir-azel
    testo: |
      La Biblioteca di Qir-Azel è archivio pubblico ai piani bassi e archivio
      chiuso a quelli alti. Al secondo piano interi corridoi hanno gli scaffali
      sigillati con la cera nera della Confraternita e un nastro rosso fra le
      maniglie, e non hanno catalogo. Il Velo li apre soltanto su richiesta
      motivata, e le richieste passano dal bancone del bibliotecario, che di
      solito le rimanda indietro con una domanda di storia.

  - id: qa-ulric-stanne
    titolo: Chiedimi cosa cerchi
    area: quartieri-alti
    immagine: personaggi/ulric-stanne
    testo: |
      Ulric Stanne, il bibliotecario, ha passato da un pezzo i settant'anni e
      si pettina la barba bianca con le dita mentre legge. È stato avventuriero
      e non lo nasconde. Ignora con cortesia quasi tutti i lettori, ma con chi
      sa un po' di storia parla per due ore di fila e alla fine gli apre i
      materiali che cerca. Ai nuovi dice: «Chiedimi cosa cerchi. Può darsi che
      ce l'abbia, e può darsi che non te lo dia.»

  - id: qa-mattias-crenn
    titolo: Gli appunti
    area: quartieri-alti
    immagine: personaggi/mattias-crenn
    testo: |
      Mattias Crenn ha lo studio al primo piano della Biblioteca e da
      trent'anni legge la lingua dei Precursori come pochi altri in città.
      Delle sue cinque monografie ne sono state pubblicate due. Ulric Stanne,
      il suo migliore amico, dopo ogni rifiuto gli prepara una cena con il
      vino buono, e al terzo bicchiere Mattias la riassume così: «Una città
      intera mi deve un riconoscimento. Si tiene il riconoscimento. Io mi
      tengo gli appunti.»

  - id: qa-trascrizioni-di-eren
    titolo: Il resto non mi appartiene
    area: quartieri-alti
    immagine: ambientazione/biblioteca-di-qir-azel
    testo: |
      La Biblioteca conserva le trascrizioni di Eren Solmir, il più giovane dei
      tre che risalirono dal Labirinto con le Maschere e, si dice, il primo a
      decifrare i simboli incisi a Darn-Morakh. I fogli si interrompono a metà
      dopo il Rito. «Ho capito quello che dovevo capire» avrebbe detto. «Il
      resto non mi appartiene.» Venne a leggere al tavolo lungo per altri
      cinque anni, poi dal 137 D.C. sparì. Padre Aurelio Vantes dice soltanto:
      «È dove ha sempre voluto essere.»

  # ------------------------------------------------------------ Teatro
  - id: qa-teatro
    titolo: Quassù si ride
    area: quartieri-alti
    immagine: ambientazione/teatro-delle-meraviglie
    testo: |
      Il Teatro delle Meraviglie ha una platea per le famiglie dei Quartieri
      Alti e un loggione per tutti gli altri. Il padrone, Orazio Belcanto, ha
      con Liaren Tarvelin una rivalità di palco di cui nessuno dei due ricorda
      l'origine. Isotta Cordani, che dal suo palco non perde una prima, ha
      detto del Teatro la cosa più giusta: «Quassù si ride per cose che giù
      sarebbero condanne.»

  - id: qa-orazio-belcanto
    titolo: Una pessima coreografia
    area: quartieri-alti
    immagine: personaggi/orazio-belcanto
    testo: |
      Orazio Belcanto possiede il Teatro delle Meraviglie e ci fa quasi tutto
      da sé, dai cartelloni alle parti principali. Porta un anello a ogni dito
      e ammette la propria vanità con un candore che gli fa perdonare quasi
      tutto. A un cronista che gli chiedeva quanto fosse vera una sua commedia
      ha risposto: «La verità è una pessima coreografia. Per fortuna gestisco
      un teatro, mica un tribunale.»

  # ------------------------------------------------------------ Caserma
  - id: qa-caserma
    titolo: Tornare alla luce
    area: quartieri-alti
    immagine: ambientazione/guarnigione-di-qir-azel
    testo: |
      La Guarnigione di Qir-Azel, che in città chiamano la Caserma, è la sede
      dello sceriffo, e nel suo cortile la Guardia cittadina e i Raschiatori
      si addestrano insieme. Sotto il cortile ci sono le celle. Dragna
      Gro-Malog, il Ferro dei Raschiatori, addestra qui le reclute e ai turni
      del mattino ripete: «Imparare a sopravvivere ai tunnel non basta.
      Bisogna anche imparare a tornare a sorridere alla luce.»

  - id: qa-galdrick-e-il-cucitore
    titolo: L'uomo che fermò il Cucitore
    area: quartieri-alti
    immagine: personaggi/toren-galdrick
    testo: |
      Durante le Notti Cucite Toren Galdrick era il vice del capitano della
      Guardia, e quando il Cucitore uccise il capitano raccolse i pochi uomini
      ancora in piedi e tenne le strade fino all'alba. Una settimana dopo la
      città lo confermò sceriffo. La storia la ricamano i veterani nelle
      taverne, e lui non la conferma né la smentisce. Chi prova a comprarlo se
      ne va senza risposta, e Galdrick se ne ricorda il nome per sempre.
