# Frammenti del Codex fuori dalle mura: le rovine minori, la Marea, le tribù e i villaggi della Superficie
# Fratturata, più qualche voce per le spedizioni fuori città. Solo informazioni pubbliche del Codex.
frammenti:
  # ------------------------------------------------------------ le rovine minori del circondario
  - id: sf-anello-del-camminatore
    titolo: Il cerchio dei cani
    area: superficie-fratturata
    immagine: ambientazione/superficie-fratturata
    testo: |
      Tre giorni di marcia a nord-ovest di Qir-Azel, ai margini del Rovolungo,
      nove pietre nere alte fino al ginocchio formano un cerchio quasi
      perfetto, e dentro l'erba non ricresce. I Raschiatori non hanno mai
      trovato l'ingresso a quello che dovrebbe esserci sotto. Un mandriano
      racconta: «Il mio cane entrò nel cerchio e iniziò a girare. Lo tirai
      fuori per la corda, e per due giorni non smise di girare finché non
      cadde stecchito.»

  - id: sf-carcasse-di-korith
    titolo: Le costole della bestia
    area: superficie-fratturata
    immagine: ambientazione/gradone-rosso
    testo: |
      Nell'ultima conca prima del Gradone Rosso affiorano tre archi di
      metallo nero in fila, ciascuno più piccolo del precedente. I
      Raschiatori li chiamano Carcasse di Korith, dal nome di un cartografo
      dei Precursori, e hanno smesso di scavarci attorno quando le pale hanno
      cominciato a vibrare nelle mani. Dal quaderno di scavo: «La ruggine non
      le tocca. Spazzi la polvere e sotto trovi il lucido di un coltello
      fresco di mola.»

  - id: sf-conca-degli-specchi
    titolo: Lo specchio di giorno
    area: superficie-fratturata
    immagine: ambientazione/rovine-dei-precursori
    testo: |
      Fra le radici della vecchia Pannion c'è una vasca circolare di pietra
      liscia scolpita in un blocco solo. Alla luce del sole chi si affaccia
      vede sconosciuti in fogge mai viste, e soltanto sotto la luna l'acqua
      rimanda il volto giusto. Una pellegrina di Pannion avverte: «Mi
      affacciai di giorno e vidi una donna che non ero io. Non andate nella
      conca prima del tramonto.»

  - id: sf-costola-di-drago
    titolo: La costola che canta
    area: superficie-fratturata
    immagine: ambientazione/superficie-fratturata
    testo: |
      Sulle alture aride a sud di Ghoran escono dal fianco di una collina
      dodici metri di metallo nero e curvo, come la costola di una creatura
      più grande della collina. Vibra giorno e notte, troppo in basso per
      l'orecchio, e fa male a chi resta vicino a lungo. Un veterano dei
      Raschiatori: «Se ci appoggi un coltello, il coltello canta. Se ci
      appoggi la fronte, smetti di pensare per un po'.»

  - id: sf-forno-della-nonna
    titolo: La stanza calda
    area: superficie-fratturata
    immagine: ambientazione/tuarmir
    testo: |
      Sulla strada di Tuarmir restano le pareti di una piccola camera di
      pietra mezzo interrata, che in ogni stagione restano tiepide come un
      forno spento da poco. I carbonai che ci si riparano nelle notti di
      vento la chiamano Forno della Nonna, e ne escono tutti con la stessa
      storia. Uno di loro: «Sognai un bambino seduto a un tavolo, che mi
      guardava. La seconda notte aveva un altro volto. La terza non ci sono
      tornato.»

  - id: sf-gradinata-cieca
    titolo: L'ottavo gradino
    area: superficie-fratturata
    immagine: ambientazione/rovine-dei-precursori
    testo: |
      Nei pressi del Bosco della Forca sette gradini di pietra grigia levigata
      scendono nella terra, e dove dovrebbe esserci l'ottavo c'è un buio
      uniforme che la luce delle torce non attraversa. I Raschiatori ci hanno
      calato corde e sonde, e niente torna indietro tale e quale. Un diario di
      scavo racconta di una corda calata per venti metri e tirata su asciutta,
      senza più il piombo che aveva in fondo.

  - id: sf-lacrima-pietrificata
    titolo: La goccia che non cade
    area: superficie-fratturata
    immagine: ambientazione/cristalli-conduttori
    testo: |
      Fra il Sito Mahr-Kel e Tuarmir, conficcata in una collina di torba, c'è
      una formazione cristallina a forma di goccia lunga quanto un cavallo,
      così gelata che la mano si stacca da sola. Le falene ci girano intorno
      in spirali sempre più strette. Un cercatore di torba l'ha messo a
      verbale: «Quando si posano sulla pietra cadono morte. Ogni volta che
      torno, attorno c'è uno strato di ali.»

  - id: sf-lente-del-sornione
    titolo: Lo specchio che mente
    area: superficie-fratturata
    immagine: ambientazione/gradone-rosso
    testo: |
      Oltre l'orlo settentrionale del Gradone Rosso sta mezzo interrato in un
      campo un disco di vetro dei Precursori largo quattro metri. I contadini
      lo chiamano il Sornione, perché riflette un cielo diverso da quello che
      sta sopra la testa. Al Velo uno stagionale di Velthar ha deposto: «Mi
      specchiai a mezzogiorno e vidi un cielo notturno con due stelle che non
      conosco. Non torno più al campo del Sornione.»

  - id: sf-pozzo-senzanome
    titolo: Quello a cui manca il suono
    area: superficie-fratturata
    immagine: ambientazione/ghoran
    testo: |
      Oltre il Gradone Rosso, verso Ghoran, si apre un pozzo dalle pareti
      vetrificate. Lo trovarono i pastori cercando una pecora, e il bambino
      che ci calarono risalì dicendo che dentro c'era «silenzio fitto, come
      dentro una pancia». Sulle mappe dei Raschiatori è il Senzanome, perché
      sulle pareti non c'è una sola lettera dei Precursori. Da un quaderno di
      scavo: «Lasciammo cadere un sasso e contammo fino a cento, due volte.
      Non sentimmo mai toccare il fondo.»

  - id: sf-soglia-di-mara
    titolo: L'arco senza muri
    area: superficie-fratturata
    immagine: ambientazione/roccia-di-wren
    testo: |
      Sul crinale di una collina a est della Roccia di Wren si alza un arco di
      pietra nera alto quattro metri, senza muri ai lati e lontano da ogni
      strada, che la gente della zona chiama Soglia di Mara. Chi ci passa
      sotto al tramonto torna con la stessa storia. Un mercante l'ha messa a
      verbale: «Per tre battiti di cuore sentii odore di pioggia salata e di
      un fuoco di legna.»

  - id: sf-spina-dell-eco
    titolo: L'eco che sbaglia
    area: superficie-fratturata
    immagine: ambientazione/superficie-fratturata
    testo: |
      Sulla pianura fra il Bosco di Velthar e il Rovolungo si vede da lontano
      la Spina dell'Eco, un pilastro di pietra nera alto sei metri su cui le
      frecce rimbalzano senza scheggiarlo. La Spina restituisce le voci dopo
      nove battiti, con una cadenza diversa. Un cantore ambulante ha deposto
      al Velo: «Gridai un nome e contai i battiti. Al nono sentii la mia voce
      tornare indietro, ma cantava un'altra parola.»

  - id: sf-stele-dei-naviganti
    titolo: Le ombre che indicano
    area: superficie-fratturata
    immagine: ambientazione/foresta-strisciante
    testo: |
      A sud-ovest di Qir-Azel, al di là della Foresta Strisciante, sette
      colonne basse di pietra grigia stanno allineate in pianura. Non portano
      iscrizioni leggibili, e le loro ombre cadono tutte nella stessa
      direzione a ogni ora e in ogni stagione. Il rapporto della Biblioteca
      del 142 D.C. si chiude così: «Le sette ombre cadono sempre nella stessa
      direzione, ostinate come dita puntate.»

  - id: sf-tamburi-di-fondo
    titolo: Quello che bussa di sotto
    area: superficie-fratturata
    immagine: ambientazione/palude-acquanera
    testo: |
      I cacciatori di anguille della Palude Acquanera evitano un punto del
      guado segnato con tre paletti rossi piantati a triangolo. A mezzanotte
      esatta, sotto il muschio, qualcuno bussa tre volte, e per qualche minuto
      il muschio sotto i piedi resta tiepido. Nessuno ha voglia di scavare per
      vedere che cosa ci sia sotto, e chi conosce la palude a mezzanotte da
      quel punto si allontana.

  - id: sf-volta-dell-aculeo
    titolo: Il buco che fischia
    area: superficie-fratturata
    immagine: ambientazione/laresh
    testo: |
      Fra i rovi a ovest di Laresh, nella Conca dei Rovi, si apre un foro
      circolare largo un braccio, con i bordi vetrificati, e i sassi che ci
      tirano dentro non fanno rumore. Per i Raschiatori è la cima sfondata di
      una cupola dei Precursori. A Laresh un'anziana racconta che una notte
      all'anno ne esce un fischio lungo, che suo padre chiamava il fischio
      dell'aculeo.

  # ------------------------------------------------------------ la Marea, la Cicatrice, le macchine
  - id: sf-teorie-della-marea
    titolo: Le teorie della Marea
    area: superficie-fratturata
    immagine: ambientazione/marea-grigia
    testo: |
      Che cosa sia la Marea Grigia non lo sa nessuno. Per la Teoria delle
      Scorie, la preferita della Gilda, è il residuo dei cristalli conduttori
      esauriti. I cronisti più anziani parlano di Disgregazione Memetica,
      memorie dei Precursori andate in cortocircuito con la Caduta, e così
      spiegano perché la Marea colpisca prima la mente. Per gli zeloti del
      Grande Albero Rosso è una punizione. Un frate ha scritto: «È il respiro
      dei Precursori che non hanno mai smesso di morire.»

  - id: sf-cicatrice-da-lontano
    titolo: Le lampade di sotto
    area: superficie-fratturata
    immagine: ambientazione/cicatrice-del-mondo
    testo: |
      Per molti viaggiatori Qir-Azel si riconosce prima delle sue mura, dai
      bagliori simili ad aurore che salgono dalla Cicatrice del Mondo. La
      luce pulsa a cicli irregolari e a volte sparisce per giorni, e in
      quelle notti la città dorme male. I Raschiatori dicono a chi arriva da
      fuori: «I forestieri credono di vedere un'aurora. Noi sappiamo che è
      qualcuno che, sotto, sta accendendo le lampade.»

  - id: sf-forme-della-salvaguardia
    titolo: Tre forme note
    area: superficie-fratturata
    immagine: ambientazione/mito-salvaguardia-precursori
    testo: |
      I Raschiatori veterani distinguono tre forme della Salvaguardia, le
      macchine dei Precursori che sorvegliano le rovine. Il ragno-sacrificale
      ha quattro braccia di metallo e una maschera bianca senza bocca. Il
      busto deformato è metà carne e metà metallo ossidato, con spine di ferro
      sulla schiena. La figura ruotata ha la testa girata all'indietro e
      cammina a ritroso. Nessuna attacca con rabbia, e che cosa salvaguardino
      non si è mai capito.

  # ------------------------------------------------------------ le tribù orchesche
  - id: sf-spiumatori
    titolo: Uccelli crudi
    area: superficie-fratturata
    immagine: ambientazione/gradone-rosso
    testo: |
      Gli Spiumatori sono la tribù orchesca più vicina a Qir-Azel e la meno
      aggressiva delle cinque, e vivono nelle grotte sul versante ovest del
      Gradone Rosso. Il nome viene dagli uccelli selvatici che mangiano
      crudi. Al confine orientale si contendono la caccia con Fondobosco.
      Ilvaena Sorathe li liquida così: «Sono i meno temibili. Il che, per
      orchi, significa che a volte non ti uccidono.»

  - id: sf-nove-chiodi
    titolo: Una lama per ogni carovana
    area: superficie-fratturata
    immagine: fazioni/tribu-nove-chiodi
    testo: |
      I Nove Chiodi del Bosco della Forca sono la più metodica delle cinque
      tribù. Tengono vedette sulle rotte fra Qir-Azel e Laresh, conoscono le
      ore dei convogli e con il metallo rubato si fabbricano armi. Ilvaena
      Sorathe, che li insegue da anni, lo ha spiegato in Municipio: «Ogni
      carovana persa diventa una lama nuova nella loro armeria. È una lezione
      che si impara pagandola due volte.»

  - id: sf-fondobosco
    titolo: La tribù che si divora
    area: superficie-fratturata
    immagine: fazioni/tribu-fondobosco
    testo: |
      A est del Gradone Rosso comincia Fondobosco, la foresta più vasta della
      regione, dove vive la tribù orchesca più numerosa. Almeno tre famiglie
      se ne contendono il comando, e per sola massa Fondobosco potrebbe
      schiacciare Qir-Azel, se non fosse per quelle faide. Ilvaena Sorathe la
      mette così: «Sono i più numerosi, ma si odiano da soli. È l'unica
      fortuna che Qir-Azel possa rivendicare nei loro confronti.»

  # ------------------------------------------------------------ i villaggi
  - id: sf-lanterne-di-pannion
    titolo: Le lanterne sui pontili
    area: superficie-fratturata
    testo: |
      Pannion sorge su un'altura di terra rossa fra sequoie minori, con case
      di legno scuro e resina. Il villaggio taglia il legname per i ponti di
      Qir-Azel e cuoce il carbone per le sue forge. Di notte i boscaioli
      accendono lanterne lungo i pontili che escono verso il bosco, per
      guidare a casa gli spiriti della foresta, perché a Pannion si dice che
      un bosco senza luci finisca per perdersi.

  - id: sf-fossa-del-seme
    titolo: L'arena sotto l'arena
    area: superficie-fratturata
    immagine: ambientazione/ghoran
    testo: |
      A Ghoran, sotto l'arena dei gladiatori, ce n'è una seconda più antica
      del villaggio, la Fossa del Seme. Dal pavimento escono radici nere che
      palpitano quando ci cola sopra del sangue. I clan ci combattono di
      rado, per chiudere le dispute più gravi, e i forestieri non sono
      ammessi. Fra i carovanieri si dice: «A Ghoran non si compra. Si pesa.
      Tutto. Anche tu, mentre guardi.»

  # ------------------------------------------------------------ le spedizioni fuori città
  - id: sf-vhar-ul
    titolo: Quello che non gradisce
    area: vhar-ul
    immagine: ambientazione/rovine-dei-precursori
    testo: |
      Vhar'Ul è un ingresso secondario alle rovine dei Precursori, fra le
      scarpate di basalto a sud della città, e prende il nome dalle prime
      sillabe dell'iscrizione sul portale. Quarant'anni fa una spedizione
      arrivò al terzo livello e trovò strutture di metallo che pulsavano
      ancora, e il supervisore Arelan Dorr fece richiudere il cancello. Il
      manuale dei Raschiatori lo cita come esempio: «Non tutte le macchine
      dei Precursori gradiscono di essere svegliate. Vhar'Ul gradisce meno
      della maggior parte.»

  - id: sf-mahr-kel
    titolo: I condotti che non si spengono
    area: mahr-kel
    immagine: ambientazione/regno-profondo
    testo: |
      Il Sito Mahr-Kel fu scoperto trentacinque anni fa nelle terre a
      sud-ovest. Le prime squadre ne annotarono la profondità e gli
      esperimenti incompiuti sui corpi viventi, finché i vapori tossici delle
      difese convinsero la Gilda a dichiararlo instabile. I sensori in
      superficie dicono che i condotti di raffreddamento non si sono mai
      spenti. Dal manuale dei Raschiatori: «Aveva iniziato a costruire
      qualcosa prima di venire interrotto.»

  - id: sf-laboratorio-di-calibrazione
    titolo: Perfettamente precisi
    area: laboratorio-di-calibrazione
    immagine: ambientazione/rovine-dei-precursori
    testo: |
      Il Laboratorio di Calibrazione era un centro secondario dei Precursori,
      dove gli strumenti di misura venivano tarati finché uscivano
      perfettamente precisi. È fatto per gli strumenti più che per chi li
      porta, e nelle sue camere cubiche il riverbero dura a lungo. Quando il
      sito fu abbandonato alcuni sistemi di calibrazione rimasero accesi
      senza più istruzioni, e da allora misurano chiunque passi.

  - id: sf-roccia-di-wren
    titolo: Lo Scoglio
    area: roccia-di-wren
    immagine: ambientazione/roccia-di-wren
    testo: |
      La Roccia di Wren è una lingua di pietra nera che esce dalle acque
      melmose del Torvessa. Prende il nome da Osric Wren, l'intagliatore di
      uccelli che ci viveva e che nel 145 si rivelò il Cucitore delle Notti
      Cucite. L'ultima notte la Guardia seguì fin lì la traccia di sangue
      dello sceriffo Ivo Carstan, diede fuoco alla casa e buttò le scale nel
      fiume. I pescatori la chiamano lo Scoglio e ci passano alla larga.

  - id: sf-spacca-ossa
    titolo: Quello che si tiene insieme
    area: palude-acquanera
    requisiti: [pista.tribu < 3]
    immagine: fazioni/tribu-spacca-ossa
    testo: |
      Gli Spacca-ossa sono la più piccola delle cinque tribù. Bolgrum, il
      capotribù, governa più con il peso che con le parole, e sceglie lui il
      successore, così che nella Palude Acquanera il comando passa senza
      sangue. Con lui c'è Skarr, che mangia carne d'orco quando non trova di
      meglio. Ilvaena Sorathe: «Sono i più piccoli e i più uniti. Nella palude
      si tiene insieme quello che sulla terra ferma si sfalda.»

  - id: sf-vermi-carogna
    titolo: Quel che striscia sotto le sequoie
    area: foresta-strisciante
    immagine: bestiario/verme-carogna
    testo: |
      I vermi carogna vivono sotto le radici delle sequoie della Foresta
      Strisciante, che ha preso il nome da loro. Sono lunghi quanto un uomo,
      con una bocca rotonda di denti aguzzi e tentacoli dal veleno
      paralizzante, e quando mancano le carogne attaccano chi gira da solo. I
      cacciatori restano sui sentieri segnati: «Il bosco in sé non ti vuole
      male. Quello che striscia nel sottosuolo non perdona i passi distratti.»

  - id: sf-rovolungo
    titolo: La costa che si conosce meno
    area: rovolungo
    requisiti: [pista.capomozzo < 3]
    immagine: personaggi/zagrath
    testo: |
      Il Rovolungo corre lungo la costa settentrionale, un muro di rovi e di
      cardi dietro cui si sente il mare, ed è la parte della regione che a
      Qir-Azel si conosce meno. Nel nord vive il mezzogre Zagrath, che gira
      fra le cinque tribù barattando la merce rubata alle carovane con alcol
      e notizie. Odia gli elfi, e Ilvaena Sorathe l'ha affrontato più volte
      senza che nessuno dei due l'abbia mai spuntata.

  - id: sf-capomozzo
    titolo: Il covo migliore
    area: capomozzo
    requisiti: [pista.capomozzo < 3]
    immagine: fazioni/tribu-capomozzo
    testo: |
      Le cinque tribù concordano soltanto sul fatto che gli orchi di Capomozzo
      hanno il covo migliore, fra scogliere che rendono difficile lo sbarco e
      passaggi nella roccia che solo loro conoscono. Balthog il Prescelto li
      guida con un titolo più religioso che politico, e il suo braccio destro
      Dorbak è caduto a Qir-Azel la sera delle Foglie Alate. Ilvaena Sorathe:
      «Tutti i covi degli orchi sono difficili. Quello di Capomozzo ti resta
      addosso anche dopo esserne tornato.»
