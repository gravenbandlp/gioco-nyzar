# Frammenti del Codex fuori dalle mura: le rovine minori, la Marea, le tribù e i villaggi della Superficie
# Fratturata, più qualche voce per le spedizioni fuori città. Solo informazioni pubbliche del Codex.
frammenti:
  # ------------------------------------------------------------ le rovine minori del circondario
  - id: sf-anello-del-camminatore
    titolo: Il cerchio dei cani
    area: superficie-fratturata
    immagine: ambientazione/superficie-fratturata
    testo: |
      Tre giorni di marcia a nord-ovest di Qir-Azel, ai margini del Rovolungo,
      nove pietre nere alte fino al ginocchio affiorano in un cerchio quasi
      perfetto. Sono annerite come da un fuoco antico, e dentro il cerchio
      l'erba non ricresce. I Raschiatori del giro corto le hanno segnate sulla
      mappa senza mai trovare l'ingresso a quello che dovrebbe esserci sotto.
      Le persone ci girano al largo, e gli animali che ci entrano si
      comportano in modo strano. Un mandriano: «Il mio cane entrò nel cerchio.
      Iniziò a girare. Lo tirai fuori per la corda e per due giorni non smise
      di girare lo stesso, finché non cadde stecchito.»

  - id: sf-carcasse-di-korith
    titolo: Le costole della bestia
    area: superficie-fratturata
    immagine: ambientazione/gradone-rosso
    testo: |
      Nell'ultima conca prima della scarpata del Gradone Rosso affiorano tre
      archi di metallo nero in fila perfetta, ciascuno più piccolo del
      precedente. I Raschiatori li segnano sui rilievi come Carcasse di
      Korith, dal nome di un cartografo dei Precursori citato nei frammenti
      della Biblioteca. La curvatura fa pensare a una macchina o a una nave
      molto più grande, sepolta sotto. Si è scavato attorno con cautela, e si
      è smesso quando le pale, a venti palmi di profondità, hanno cominciato a
      vibrare nelle mani. Dal quaderno di scavo: «La ruggine non le tocca.
      Spazzi la polvere e sotto trovi lo stesso lucido di un coltello buono,
      fresco di mola.»

  - id: sf-conca-degli-specchi
    titolo: Lo specchio di giorno
    area: superficie-fratturata
    immagine: ambientazione/rovine-dei-precursori
    testo: |
      Fra le radici della vecchia Pannion, dove il bosco si è ripreso le case
      di legno, c'è una vasca circolare di pietra liscia larga tre metri,
      scolpita in un blocco solo. L'acqua è limpida e si beve senza danno.
      Alla luce del sole, però, chi si affaccia vede persone sconosciute
      vestite in fogge mai viste, intente a lavori incomprensibili. Soltanto
      di notte, sotto la luna, l'acqua rimanda il volto giusto. Una pellegrina
      di Pannion: «Mi affacciai di giorno e vidi una donna che non ero io. Mi
      affacciai di notte e finalmente mi vidi. Non andate nella conca prima
      del tramonto.»

  - id: sf-costola-di-drago
    titolo: La costola che canta
    area: superficie-fratturata
    immagine: ambientazione/superficie-fratturata
    testo: |
      Sulle alture aride a sud di Ghoran, dal fianco di una collina escono
      dodici metri di metallo nero e curvo, come l'arco di una nave rovesciata
      o la costola di una creatura più grande della collina. Le armi non lo
      scalfiscono e il tempo non lo corrode. I Raschiatori che l'hanno toccato
      riferiscono tutti che vibra alla stessa frequenza giorno e notte, troppo
      in basso per l'orecchio e abbastanza forte da far male a chi resta
      vicino a lungo. Nessuno ha mai scavato per capire quanto continui. Un
      veterano: «Se ci appoggi un coltello, il coltello canta. Se ci appoggi
      la fronte, smetti di pensare per un po'.»

  - id: sf-forno-della-nonna
    titolo: La stanza calda
    area: superficie-fratturata
    immagine: ambientazione/tuarmir
    testo: |
      Sulla strada di Tuarmir, dove il sentiero piega per evitare un dosso,
      restano le pareti di una piccola camera di pietra mezzo interrata. Il
      tetto è crollato da generazioni. Le pareti rimaste sono tiepide d'estate
      e d'inverno, alla temperatura di un forno spento da poco, e i carbonai
      che ci si riparano nelle notti di vento la chiamano Forno della Nonna.
      Ne escono tutti con la stessa storia, raccontata ognuno con un nome
      diverso. Un carbonaio: «Sognai un bambino seduto a un tavolo, che mi
      guardava. La seconda notte aveva un altro volto. La terza non ci sono
      tornato.»

  - id: sf-gradinata-cieca
    titolo: L'ottavo gradino
    area: superficie-fratturata
    immagine: ambientazione/rovine-dei-precursori
    testo: |
      Tre giorni di marcia a ovest di Qir-Azel, nei pressi del Bosco della
      Forca, sette gradini di pietra grigia levigata scendono nella terra. Al
      settimo la rampa finisce. Il vano della discesa prosegue dritto, ma dove
      dovrebbe esserci l'ottavo gradino c'è un buio uniforme che la luce delle
      torce non attraversa. I Raschiatori ci hanno calato corde e sonde, e i
      loro registri dicono tutti che quello che entra nel buio non torna
      indietro tale e quale. Un diario di scavo racconta di una corda calata
      per venti metri e tirata su asciutta, senza più il piombo che aveva in
      fondo.

  - id: sf-lacrima-pietrificata
    titolo: La goccia che non cade
    area: superficie-fratturata
    immagine: ambientazione/cristalli-conduttori
    testo: |
      Fra il Sito Mahr-Kel e Tuarmir, conficcata di traverso nel fianco di
      una collina di torba, c'è una formazione cristallina a forma di goccia,
      lunga quanto un cavallo. È trasparente al margine e lattiginosa al
      centro, e al tatto è così gelata che la mano si stacca da sola dopo
      pochi secondi. La torba intorno resta asciutta e tiepida per dieci
      passi. I cercatori di torba la evitano. Le falene invece ci girano
      intorno in spirali sempre più strette, e un cercatore l'ha messo a
      verbale: «Quando si posano sulla pietra, cadono morte come piombo. Ogni
      volta che torno, attorno c'è uno strato di ali.»

  - id: sf-lente-del-sornione
    titolo: Lo specchio che mente
    area: superficie-fratturata
    immagine: ambientazione/gradone-rosso
    testo: |
      In un campo oltre l'orlo settentrionale del Gradone Rosso sta mezzo
      interrato un disco di vetro dei Precursori largo quattro metri e spesso
      più di un palmo. La superficie non ha una screpolatura ed è gelata anche
      d'estate. I contadini di un cascinale vicino lo chiamano il Sornione,
      perché sembra ridere di chiunque lo guardi. Riflette un cielo diverso da
      quello che sta sopra la testa di chi guarda, e cambia con l'ora senza
      mai concordare. Al Velo uno stagionale di Velthar ha deposto: «Mi
      specchiai a mezzogiorno e vidi un cielo notturno con due stelle che non
      conosco. Non torno più al campo del Sornione.»

  - id: sf-pozzo-senzanome
    titolo: Quello a cui manca il suono
    area: superficie-fratturata
    immagine: ambientazione/ghoran
    testo: |
      Oltre il Gradone Rosso, verso Ghoran, si apre un pozzo verticale dalle
      pareti vetrificate, lisce come uno specchio. Lo trovarono i pastori di
      Ghoran cercando una pecora, e ci calarono un nipote di sei anni, che
      risalì dicendo che dentro c'era «silenzio fitto, come dentro una
      pancia». Ogni cosa calata nel pozzo torna su più fredda di quando è
      scesa. Sulle mappe dei Raschiatori è segnato come Senzanome, perché
      sulle pareti non c'è una sola lettera dei Precursori. Da un quaderno di
      scavo: «Lasciammo cadere un sasso e contammo fino a cento, poi fino a
      cento di nuovo. Non sentimmo mai toccare il fondo.»

  - id: sf-soglia-di-mara
    titolo: L'arco senza muri
    area: superficie-fratturata
    immagine: ambientazione/roccia-di-wren
    testo: |
      Sul crinale di una collina a est della Roccia di Wren si alza un arco di
      pietra nera alto quattro metri, perfettamente a piombo. Non ha muri ai
      lati, e lassù non è mai passata una strada vera. La gente della zona lo
      chiama Soglia di Mara, dal nome di una vecchia che lo battezzò così
      tanto tempo fa che il motivo si è perso. Chi ci passa sotto al tramonto
      torna con la stessa storia, raccontata con parole diverse. Un mercante
      di passaggio ha messo a verbale: «Per tre battiti di cuore sentii odore
      di pioggia salata e di un fuoco di legna che bruciava da qualche parte.»

  - id: sf-spina-dell-eco
    titolo: L'eco che sbaglia
    area: superficie-fratturata
    immagine: ambientazione/superficie-fratturata
    testo: |
      Sulla pianura fra il Bosco di Velthar e il Rovolungo si vede da molto
      lontano la Spina dell'Eco, un pilastro di pietra nera alto sei metri,
      ritto come un dito puntato. Le frecce ci rimbalzano sopra e la pietra
      non si scheggia, e chi ha provato a scavare ai suoi piedi ha colpito
      dopo un palmo qualcosa di duro che non viene su. La Spina è nota per le
      voci, che restituisce dopo nove battiti con una cadenza diversa. Un
      cantore ambulante ha deposto al Velo: «Gridai un nome e contai i
      battiti. Al nono battito sentii la mia voce tornare indietro, ma cantava
      un'altra parola.»

  - id: sf-stele-dei-naviganti
    titolo: Le ombre che indicano
    area: superficie-fratturata
    immagine: ambientazione/foresta-strisciante
    testo: |
      Due giorni e mezzo a sud-ovest di Qir-Azel, al di là della Foresta
      Strisciante, sette colonne basse di pietra grigia stanno allineate in
      pianura con una precisione tale che la prima e la settima sembrano
      ricavate l'una dall'altra. Non portano iscrizioni leggibili e non
      sostengono niente. Le si nota per le ombre, che cadono tutte nella
      stessa direzione a ogni ora del giorno e in ogni stagione. La Biblioteca
      ci mandò una campagna di rilevamento nel 142 D.C., e il rapporto si
      chiude con questa riga: «Le sette ombre cadono sempre nella stessa
      direzione, ostinate come dita puntate.»

  - id: sf-tamburi-di-fondo
    titolo: Quello che bussa di sotto
    area: superficie-fratturata
    immagine: ambientazione/palude-acquanera
    testo: |
      I cacciatori di anguille della Palude Acquanera evitano un punto preciso
      del guado sull'orlo settentrionale, e l'hanno segnato con tre paletti
      rossi piantati a triangolo. A mezzanotte esatta, sotto il muschio,
      qualcuno bussa tre volte. Sono colpi sordi e distanziati, come quelli di
      una mano che vuole farsi sentire senza sapere che ora sia. Per qualche
      minuto dopo i colpi il muschio sotto i piedi resta tiepido, e poi per un
      giorno intero non succede niente. Nessuno ha voglia di scavare per
      vedere se sotto ci sia una pietra o una camera. Chi conosce la palude
      segue una regola sola, e a mezzanotte da quel punto si allontana.

  - id: sf-volta-dell-aculeo
    titolo: Il buco che fischia
    area: superficie-fratturata
    immagine: ambientazione/laresh
    testo: |
      Fra i rovi a ovest di Laresh, in un avvallamento che le mappe vecchie
      chiamano Conca dei Rovi, si apre nel terreno un foro circolare largo un
      braccio. I bordi sono vetrificati, come se la pietra fosse stata fusa e
      poi raffreddata in fretta. Chi si sporge non vede il fondo, e i sassi
      che i ragazzi del villaggio ci tirano dentro non fanno rumore. Per i
      Raschiatori è la cima sfondata di una cupola dei Precursori. A Laresh
      un'anziana racconta che una notte all'anno ne esce un fischio: «Acuto,
      lungo come un richiamo. Poi più niente per dodici mesi. Mio padre lo
      chiamava il fischio dell'aculeo.»

  # ------------------------------------------------------------ la Marea, la Cicatrice, le macchine
  - id: sf-teorie-della-marea
    titolo: Le teorie della Marea
    area: superficie-fratturata
    immagine: ambientazione/marea-grigia
    testo: |
      Che cosa sia la Marea Grigia non lo sa nessuno, e alla Biblioteca le
      teorie accreditate sono tre. Per la Teoria delle Scorie è il residuo dei
      cristalli conduttori esauriti, ed è la preferita della Gilda dei
      Mercanti perché non chiama in causa niente di metafisico. I cronisti più
      anziani parlano di Disgregazione Memetica, cioè di memorie dei
      Precursori andate in cortocircuito con la Caduta, e così spiegano perché
      la Marea colpisca prima la mente. Per gli zeloti del Grande Albero Rosso
      è una punizione. Un frate cronista ha scritto: «È memoria corrotta, il
      respiro dei Precursori che non hanno mai smesso di morire.»

  - id: sf-cicatrice-da-lontano
    titolo: Le lampade di sotto
    area: superficie-fratturata
    immagine: ambientazione/cicatrice-del-mondo
    testo: |
      Per gran parte dei viaggiatori Qir-Azel si riconosce prima delle sue
      mura. Dalla Cicatrice del Mondo salgono bagliori simili ad aurore e
      spire di luce che si vedono a miglia di distanza. La luce non è
      costante. Pulsa a cicli irregolari, dura minuti oppure ore, e a volte
      sparisce per giorni interi. Nelle notti in cui la Cicatrice resta scura
      la città dorme male e i sacerdoti del Velo celebrano riti fuori
      calendario. Sui margini i Raschiatori hanno un detto per chi arriva da
      fuori: «I forestieri credono di vedere un'aurora. Noi sappiamo cos'è. È
      qualcuno che, sotto, sta accendendo le lampade.»

  - id: sf-forme-della-salvaguardia
    titolo: Tre forme note
    area: superficie-fratturata
    immagine: ambientazione/mito-salvaguardia-precursori
    testo: |
      I Raschiatori veterani distinguono tre forme ricorrenti della
      Salvaguardia, le macchine dei Precursori che sorvegliano le rovine
      dall'interno. Il ragno-sacrificale ha quattro braccia che finiscono in
      innesti di metallo e una maschera bianca senza bocca, con due fessure
      rosse al posto degli occhi. Il busto deformato è metà carne e metà
      metallo ossidato, con lunghe spine di ferro che gli escono dalla
      schiena, e il terreno vibra al suo passaggio. La figura ruotata ha la
      testa girata all'indietro e cammina a ritroso con una precisione
      innaturale. Nessuna attacca con rabbia. Si muovono lente, come se
      aspettassero da sempre, e che cosa salvaguardino di preciso non si è mai
      capito.

  # ------------------------------------------------------------ le tribù orchesche
  - id: sf-spiumatori
    titolo: Uccelli crudi
    area: superficie-fratturata
    immagine: ambientazione/gradone-rosso
    testo: |
      Gli Spiumatori sono la tribù orchesca più vicina a Qir-Azel e vivono
      nelle grotte sul versante ovest del Gradone Rosso. Fra le cinque tribù
      sono i meno aggressivi. Il nome viene dagli uccelli selvatici grandi
      come gazze che prendono con i lacci e mangiano crudi, appena tolti dal
      nido. Non hanno un capo stabile, e decidono di volta in volta i
      capi-clan più anziani, con accordi che durano poco. Al confine orientale
      si contendono la caccia con Fondobosco. Ilvaena Sorathe li liquida così:
      «Sono i meno temibili. Il che, per orchi, significa che a volte non ti
      uccidono.»

  - id: sf-nove-chiodi
    titolo: Una lama per ogni carovana
    area: superficie-fratturata
    immagine: fazioni/tribu-nove-chiodi
    testo: |
      Fra le cinque tribù del circondario i Nove Chiodi del Bosco della Forca
      sono la più metodica. Tengono vedette fisse sulle rotte fra Qir-Azel e
      Laresh, preparano gli assalti con giorni d'anticipo e conoscono a
      memoria le ore di passaggio dei convogli e i carichi che portano. Con
      il metallo rubato si fabbricano armi e armature, rinforzano gli scudi
      con le piastre staccate dai carri e alzano palizzate di legno e ferro
      attorno agli accampamenti. Ilvaena Sorathe, che li insegue da anni, lo
      ha spiegato in Municipio: «Ogni carovana persa diventa una lama nuova
      nella loro armeria. È una lezione che si impara pagandola due volte.»

  - id: sf-fondobosco
    titolo: La tribù che si divora
    area: superficie-fratturata
    immagine: fazioni/tribu-fondobosco
    testo: |
      A est del Gradone Rosso comincia Fondobosco, la foresta più vasta della
      regione, con i tronchi coperti di muschio scuro. Ci vive la tribù
      orchesca più numerosa del circondario, che porta lo stesso nome. Almeno
      tre famiglie se ne contendono il comando, e ogni anno qualcuno prova a
      prenderselo e qualcun altro lo ammazza prima che ci riesca. Per sola
      massa Fondobosco potrebbe schiacciare Qir-Azel, e se finora non è
      successo la città lo deve alle sue faide. Ilvaena Sorathe la mette così:
      «Sono i più numerosi, ma si odiano da soli. È l'unica fortuna che
      Qir-Azel possa rivendicare nei loro confronti.»

  # ------------------------------------------------------------ i villaggi
  - id: sf-lanterne-di-pannion
    titolo: Le lanterne sui pontili
    area: superficie-fratturata
    testo: |
      Pannion sorge su un'altura di terra rossa fra sequoie minori, dove la
      linfa solidificata luccica al sole come vetro colato. Le case sono di
      legno scuro e resina, con i tetti spioventi per le piogge di scintille
      che certe notti d'estate attraversano il cielo. Il villaggio taglia il
      legname per i ponti di Qir-Azel e cuoce il carbone per le sue forge. Di
      notte i boscaioli accendono lanterne lungo i pontili che escono verso il
      bosco, un'usanza di cui nessuno ricorda l'inizio. Servono a guidare a
      casa gli spiriti della foresta, perché a Pannion si dice che un bosco
      senza luci finisca per perdersi.

  - id: sf-fossa-del-seme
    titolo: L'arena sotto l'arena
    area: superficie-fratturata
    immagine: ambientazione/ghoran
    testo: |
      A Ghoran, sotto l'arena dei gladiatori, ce n'è una seconda più antica
      del villaggio, che i clan chiamano la Fossa del Seme. Chi l'abbia
      scavata non si sa. Le pareti sono di una pietra che nessun martello
      scheggia, e dal pavimento escono radici nere spesse quanto un braccio
      che palpitano quando ci cola sopra del sangue. I clan ci combattono di
      rado, per chiudere le dispute più gravi fra le famiglie. I forestieri
      non sono ammessi, e chi ci è sceso ed è risalito vivo a Ghoran viene
      trattato da parente di clan. Fra i carovanieri si dice: «A
      Ghoran non si compra. Si pesa. Tutto. Anche tu, mentre guardi.»

  # ------------------------------------------------------------ le spedizioni fuori città
  - id: sf-vhar-ul
    titolo: Quello che non gradisce
    area: vhar-ul
    immagine: ambientazione/rovine-dei-precursori
    testo: |
      Vhar'Ul è un ingresso secondario alle rovine dei Precursori, incassato
      fra le scarpate di basalto a sud della città, e prende il nome dalle
      prime sillabe dell'iscrizione sul portale. Quarant'anni fa, ai tempi
      della cartografia del sottosuolo, ci scese una delle prime spedizioni
      ufficiali, che arrivò al terzo livello e trovò strutture di metallo che
      pulsavano ancora. Poi il supervisore Arelan Dorr fece richiudere il
      cancello, e da allora il sito è rimasto sigillato. Il manuale operativo
      dei Raschiatori lo cita come esempio: «Non tutte le macchine dei
      Precursori gradiscono di essere svegliate. Vhar'Ul gradisce meno della
      maggior parte.»

  - id: sf-mahr-kel
    titolo: I condotti che non si spengono
    area: mahr-kel
    immagine: ambientazione/regno-profondo
    testo: |
      Il Sito Mahr-Kel fu scoperto trentacinque anni fa nelle terre a
      sud-ovest, e registrato con la parola incisa più volte sulle sue paratie
      d'ingresso. Le prime squadre ne annotarono la grande profondità e gli
      esperimenti incompiuti sui corpi viventi. La spedizione si fermò quando
      le difese passive spinsero fuori una nube di vapori tossici e una porta
      si chiuse sul braccio di un Raschiatore, e la Gilda dichiarò il sito
      instabile. I condotti di raffreddamento però non si sono mai spenti,
      come dicono i sensori lasciati in superficie. Dal manuale dei
      Raschiatori: «Aveva iniziato a costruire qualcosa prima di venire
      interrotto.»

  - id: sf-laboratorio-di-calibrazione
    titolo: Perfettamente precisi
    area: laboratorio-di-calibrazione
    immagine: ambientazione/rovine-dei-precursori
    testo: |
      Il Laboratorio di Calibrazione era un centro secondario dei Precursori,
      dove gli strumenti di misura, dai droni alle microsonde, venivano tarati
      finché uscivano perfettamente precisi. L'architettura pensa agli
      strumenti più che a chi li porta, con tunnel stretti per farli passare,
      camere perfettamente cubiche dove il riverbero dura a lungo e superfici
      lisce fatte per non trattenere la polvere. Quando il sito fu abbandonato
      alcuni sistemi di calibrazione rimasero accesi senza più parametri né
      istruzioni, e da allora misurano chiunque passi. Sulle schede dei
      Raschiatori lo si descrive come una rovina fredda e silenziosa, dove le
      macchine vogliono ancora fare il loro lavoro.

  - id: sf-roccia-di-wren
    titolo: Lo Scoglio
    area: roccia-di-wren
    immagine: ambientazione/roccia-di-wren
    testo: |
      La Roccia di Wren è una lingua di pietra nera, verticale, che esce dalle
      acque melmose del Torvessa all'estremità nord-est del fiume. Prende il
      nome da Osric Wren, l'intagliatore di uccelli che ci viveva in una
      capanna a due piani e che nel 145 si rivelò il Cucitore delle Notti
      Cucite. L'ultima notte la Guardia seguì fino alle scale della Roccia la
      traccia di sangue lasciata dallo sceriffo Ivo Carstan. Le guardie
      diedero fuoco alla casa e prima di andarsene buttarono le scale nel
      fiume, perché nessuno ci salisse più. Da allora i pescatori la chiamano
      lo Scoglio e tirano in secca le barche molto prima di arrivarci.

  - id: sf-spacca-ossa
    titolo: Quello che si tiene insieme
    area: palude-acquanera
    requisiti: [pista.tribu < 3]
    immagine: fazioni/tribu-spacca-ossa
    testo: |
      Gli Spacca-ossa sono la più piccola delle cinque tribù del circondario.
      Bolgrum, il capotribù, governa più con il peso che con le parole. Si
      pronuncia di rado, e quando lo fa la tribù prende le sue frasi per
      legge. La Palude Acquanera è uno dei pochi territori orcheschi dove il
      comando passa senza spargimento di sangue, perché chi verrà dopo Bolgrum
      lo sceglie lui prima di morire, e tutti si adeguano. Con lui c'è Skarr,
      che mangia carne d'orco quando non trova di meglio. Ilvaena Sorathe:
      «Sono i più piccoli e i più uniti. Nella palude si tiene insieme quello
      che sulla terra ferma si sfalda.»

  - id: sf-vermi-carogna
    titolo: Quel che striscia sotto le sequoie
    area: foresta-strisciante
    immagine: bestiario/verme-carogna
    testo: |
      I vermi carogna vivono nei recessi della Foresta Strisciante, sotto le
      radici delle sequoie, e il bosco ha preso il nome da loro. Sono lunghi
      quanto un uomo e pallidi, con una bocca rotonda di denti aguzzi e una
      corona di tentacoli che assaggiano l'aria. Mangiano carogne, ma quando
      ne mancano attaccano chi gira da solo. Il veleno dei tentacoli impedisce
      ogni movimento volontario per il tempo che serve al verme per cominciare
      a mangiare. I cacciatori restano sui sentieri segnati e ripetono un
      detto: «Il bosco in sé non ti vuole male. Quello che striscia nel
      sottosuolo non perdona i passi distratti.»

  - id: sf-rovolungo
    titolo: La costa che si conosce meno
    area: rovolungo
    requisiti: [pista.capomozzo < 3]
    immagine: personaggi/zagrath
    testo: |
      Il Rovolungo corre lungo la costa settentrionale, un muro di rovi e di
      cardi dietro cui si sente il mare, e la mattina la nebbia marina ci
      resta impigliata fino a tardi. A Qir-Azel è la parte della regione che
      si conosce meno. Ci vanno pochi cacciatori, e quei pochi tornano con
      storie che non combaciano. Nel nord del Rovolungo vive il mezzogre
      Zagrath, che da lì gira fra le cinque tribù con la merce rubata alle
      carovane e la baratta con alcol e notizie. Odia gli elfi più di ogni
      altra cosa, e Ilvaena Sorathe l'ha affrontato più volte senza che
      nessuno dei due l'abbia mai spuntata.

  - id: sf-capomozzo
    titolo: Il covo migliore
    area: capomozzo
    requisiti: [pista.capomozzo < 3]
    immagine: fazioni/tribu-capomozzo
    testo: |
      Le cinque tribù del circondario sono d'accordo su una cosa sola, ed è
      che gli orchi di Capomozzo hanno il covo migliore, fra scogliere che
      rendono difficile lo sbarco e passaggi nella roccia che la tribù conosce
      a menadito. Balthog il Prescelto la guida con un titolo più religioso
      che politico, sostenuto da liturgie che gli orchi si tramandano senza
      più conoscerne il significato. Il suo braccio destro Dorbak è caduto a
      Qir-Azel la sera delle Foglie Alate. Ilvaena Sorathe: «Tutti i covi
      degli orchi sono difficili. Quello di Capomozzo è difficile in un modo
      che ti resta addosso anche dopo esserne tornato.»
