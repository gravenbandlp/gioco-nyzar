# Crisi della Contaminazione (Regolamento v0.4 §5 e integrazione, 5.5).
# Chi accetta non entra in un'area di penalità: la Marea lo cambia. Lo storylet
# scelta-mutazione mostra due mutazioni a caso fra quelle che non ha ancora.
# Più le carte della fascia 5–7.

storylet:
  - id: crisi-contaminazione
    titolo: Il sapore del ferro
    tipo: crisi
    area: citta-bassa
    requisiti: [contaminazione >= 8]
    immagine: ambientazione/marea-grigia
    sommario: "La Marea che ti porti addosso è arrivata dove il Velo non può più limitarsi a contenerla."
    testo: |
      Da qualche giorno fai fatica a tenere insieme due pensieri, e il sapore
      di ferro sotto la lingua resta anche quando mangi. Stamattina lo
      specchio ti ha restituito due occhi di un grigio che non riconosci, con
      un riflesso metallico sul fondo, e hai passato il pollice sul vetro nel
      caso la macchia fosse lì.

      {medicina Facile} Le pupille rispondono alla luce in ritardo, e la mano
      sinistra trema da sola. Il tuo corpo ha smesso di difendersi dalla
      Marea e comincia a farle posto.

      Ieri un accolito velato ti ha fermato sul Ponte delle Mille Corde, ti
      ha guardato gli occhi e la mano sinistra e ti ha detto di presentarti
      prima di sera alla Cripta della Cattedrale, per una purificazione
      straordinaria che il Velo fa pagare a peso d'oro.

      I Raschiatori sanno che un cristallo carico ceduto al Velo alimenta il
      rito al posto delle monete. Chi non ha né l'uno né le altre lascia che
      la Marea finisca il suo lavoro, e di solito ne esce vivo e cambiato,
      come certi veterani che al Grifone di Ferro nessuno fissa troppo a
      lungo.

      {origine apprendista-raschiatore} Sulle piattaforme la storia del
      cristallo ceduto al Velo la raccontano a tavola, di solito quelli che
      un cristallo carico in tasca non l'hanno mai avuto.
    opzioni:
      - testo: "Pagare la purificazione straordinaria"
        costo: 0
        requisiti: [monete >= 150]
        descrizione: "Un'offerta pesante al Velo, e una notte nella sala più bassa della Cripta."
        esito:
          titolo: La sala più bassa
          immagine: ambientazione/cattedrale-del-velo
          testo: |
            Gli accoliti ti portano giù in una stanza senza finestre, e per tutta
            la notte, steso su una lastra di pietra, ti lavano con un'acqua di
            resina recitando la Preghiera del Battito. Verso l'alba, da dietro una
            tenda, parla una voce di donna con un secondo sussurro sotto le
            parole. Quando risali hai la testa sgombra, e il sapore di ferro è
            sceso in fondo alla gola.
          effetti: { monete: -150 }
          imposta: { contaminazione: 4 }
      - testo: "Cedere un cristallo carico al Velo"
        costo: 0
        requisiti: [cristalli.cristallo-carico >= 1]
        descrizione: "Il cristallo alimenta il rito al posto delle monete, e alla fine del rito non ne resta niente."
        esito:
          titolo: Il cristallo spento
          immagine: ambientazione/cristalli-conduttori
          testo: |
            L'accolito incastona il cristallo in un bracciale di rame e te lo
            chiude al polso. Per tutta la notte il cristallo ronza contro la pelle
            e si spegne piano, mentre i pensieri ti tornano uno alla volta,
            nell'ordine in cui li avevi persi. All'alba l'accolito getta il
            cristallo opaco in una cesta dove ce ne sono già molti altri, con il
            gesto distratto che si usa per i torsoli.
          effetti: { cristalli.cristallo-carico: -1 }
          imposta: { contaminazione: 4 }
      - testo: "Lasciare che la Marea finisca il suo lavoro"
        costo: 0
        descrizione: "Niente monete e niente cristalli. Aspetti in casa che passi la febbre, e ne uscirai cambiato."
        esito:
          titolo: La febbre
          testo: |
            Non ti presenti alla Cripta. Rientri prima del tramonto e ti stendi
            sul letto con le scarpe ai piedi, dopo aver sprangato la porta. La
            febbre arriva con il buio, e dietro le palpebre chiuse vedi una luce
            grigia che non viene dalla finestra.
          segue: scelta-mutazione

  - id: scelta-mutazione
    titolo: Quello che la Marea lascia
    tipo: seguito
    area: citta-bassa
    mostra: 2
    immagine: ambientazione/marea-grigia
    sommario: "La febbre della Marea arriva al culmine, e il tuo corpo comincia a cambiare."
    testo: |
      Verso mezzanotte la febbre arriva al culmine. Il lenzuolo è fradicio,
      e senti la Marea muoversi sotto la pelle e cercare un punto dove
      fermarsi a lavorare, come se bussasse piano dall'interno delle
      costole. Dalla strada arrivano i passi della ronda, e tu li usi per
      contare il tempo fra un'ondata e l'altra. Uno dei due strascica il
      piede destro, e dopo il terzo giro gli vuoi quasi bene.

      I Raschiatori più vecchi dicono che la Marea cambia un corpo una volta
      sola, e che chi resta lucido fino in fondo può ancora spingerla un
      poco da una parte o dall'altra, come una barca con il remo. Tu sei
      lucido abbastanza. La senti premere in due punti diversi, e sai che
      puoi lasciarle soltanto uno dei due.

      {natura Media} La Marea si ferma dove il corpo cede già, con la
      pazienza delle muffe. Se il punto glielo offri tu, il resto del corpo
      lo lascia stare.

      {origine figlio-del-circolo} Ti torna in mente la volpe che da bambino
      hai visto abbattere nel Bosco di Velthar, con il suo odore di ferro
      caldo. Adesso quell'odore lo senti sul cuscino, e viene da te.

      *Meglio sceglierlo adesso, finché so ancora contare fino a due.* Tieni
      gli occhi aperti e aspetti che la prossima ondata passi.
    opzioni:
      - testo: "La luce negli occhi"
        costo: 0
        requisiti: [mutazione.occhi-luminescenti == 0]
        descrizione: "Al buio le tue iridi manderanno una luce grigia. Vedrai meglio (+1 a Percezione) e ti vedranno prima (−1 a Furtività)."
        esito:
          titolo: Occhi luminescenti
          testo: |
            All'alba, allo specchio, a prima vista non noti niente. Poi chiudi le
            imposte, e nella penombra i tuoi occhi si accendono della stessa luce
            grigia che manda la Marea quando risale dalla Cicatrice. Vedi sul
            soffitto una ragnatela che avresti giurato di aver tolto a primavera.
            Chi entra vede due punti di luce all'altezza del tuo viso, e nei
            vicoli impari a tenere lo sguardo basso.
          effetti: { mutazione.occhi-luminescenti: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Il fuoco sotto i polsi"
        costo: 0
        requisiti: [mutazione.vene-di-luce == 0]
        descrizione: "Le vene dei polsi brilleranno quando sei agitato. Avrai più fiato (+2 Energia) e meno credito nei salotti (−1 a Galateo)."
        esito:
          titolo: Vene di luce
          testo: |
            Te ne accorgi quando il vicino bussa per chiederti se stai bene. Il
            cuore ti salta in gola, e sotto la pelle dei polsi le vene si
            accendono di una luce perlacea che pulsa con il battito e si spegne
            quando ti calmi. Quella luce porta una forza che prima non avevi, però
            nei salotti buoni la gente ti guarda i polsi invece della faccia.
          effetti: { mutazione.vene-di-luce: 1 }
          imposta: { contaminazione: 3 }
      - testo: "La scorza"
        costo: 0
        requisiti: [mutazione.pelle-increspata == 0]
        descrizione: "Sulle spalle la pelle diventerà spessa come scorza. Ti proteggerà (+1 alla riduzione del danno) e ti irrigidirà (−1 ad Acrobazia)."
        esito:
          titolo: Pelle increspata
          testo: |
            La pelle ti tira sulle spalle fin dalle prime ore del mattino, e allo
            specchio la trovi grigia e rugosa dalle scapole ai gomiti, dura come
            la scorza di un albero vecchio. Se ci passi sopra un coltello, la lama
            scivola via lasciando appena un graffio bianco. Piegare le braccia
            sopra la testa invece ti costa fatica, e quando ti arrampichi senti la
            pelle nuova resistere a ogni movimento.
          effetti: { mutazione.pelle-increspata: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Una voce nuova"
        costo: 0
        requisiti: [mutazione.gola-roca == 0]
        descrizione: "La voce ti diventerà bassa e graffiata. Metterai paura più facilmente (+1 a Intimidire) e convincerai con più fatica (−1 a Persuasione)."
        esito:
          titolo: Gola roca
          testo: |
            Al mattino provi a chiamare il padrone di casa, e dalla gola ti esce
            un suono basso e graffiato, come una lama trascinata sulla pietra. Il
            padrone, sulle scale, decide che non aveva niente da dirti. Da allora
            la gente si volta quando parli e al mercato i venditori abbassano il
            prezzo prima che tu abbia finito la frase, però anche le parole più
            gentili ti escono minacciose.
          effetti: { mutazione.gola-roca: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Il sangue che la Marea riconosce"
        costo: 0
        requisiti: [mutazione.sangue-grigio == 0]
        descrizione: "Il sangue ti diventerà scuro. La Marea ti scivolerà addosso (Contaminazione per esposizione dimezzata) e reggerai un colpo in meno (−1 PF)."
        esito:
          titolo: Sangue grigio
          testo: |
            Te ne accorgi la prima volta che ti tagli, pulendo una scheggia dal
            palmo. Il sangue esce quasi grigio e si rapprende prima di colare. Da
            quel giorno, quando attraversi una sacca di Marea, senti la nebbia
            sfiorarti e passare oltre come se ti conoscesse. Il corpo però è più
            debole, e una ferita che una volta avresti ignorato adesso ti
            costringe a sederti.
          effetti: { mutazione.sangue-grigio: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Il silenzio nei pensieri"
        costo: 0
        requisiti: [mutazione.mente-silenziosa == 0]
        descrizione: "Una parte dei tuoi pensieri si spegnerà. Avrai meno paura (+1 a Resilienza) e capirai peggio quella degli altri (−1 a Empatia)."
        esito:
          titolo: Mente silenziosa
          testo: |
            Ti svegli riposato, e ci metti un po' a capire che cosa manca. La voce
            che di notte ti elencava tutto quello che poteva andare storto si è
            zittita, e al suo posto c'è una calma piatta. Da allora guardi i
            Raschiatori tremare prima di un turno senza capirne il motivo, e
            quando un'amica ti racconta un suo dispiacere la ascolti come si
            ascolta la pioggia.
          effetti: { mutazione.mente-silenziosa: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Mani di lega"
        costo: 0
        requisiti: [mutazione.unghie-di-metallo == 0]
        descrizione: "Avrai unghie di lega. A mani nude colpirai più duro (+1 al danno) e nessuno ti darà la mano (−1 a Galateo)."
        esito:
          titolo: Unghie di metallo
          testo: |
            Le unghie cominciano a farti male verso l'alba, e con la luce le trovi
            grigie e lucide come la lega dei reperti dei Precursori. Picchiettate
            sul tavolo mandano un suono metallico, e con un'unghia riesci a
            incidere il legno. Un pugno dato bene adesso lascia il segno, però
            alla prima stretta di mano vedi l'altro ritrarre le dita e guardarsi
            il palmo.
          effetti: { mutazione.unghie-di-metallo: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Il ronzio dei cristalli"
        costo: 0
        requisiti: [mutazione.orecchio-per-il-mana == 0]
        descrizione: "Sentirai sempre i cristalli (+1 dado a Magia fuori dal combattimento), e ogni Dissonanza ti costerà 1 Tormento invece di ½."
        esito:
          titolo: Orecchio per il Mana
          testo: |
            All'alba comincia un ronzio lontano, e ci metti un'ora a capire che
            viene dalle lanterne della strada e da ogni cristallo carico nel
            raggio di cento passi. Ognuno ha la sua nota, e quella della lanterna
            sotto casa è appena calante.

            Gli incantesimi ti vengono incontro con una facilità nuova, però ogni
            volta che la magia ti sfugge di mano il ronzio diventa un fischio in
            testa.
          effetti: { mutazione.orecchio-per-il-mana: 1 }
          imposta: { contaminazione: 3 }

  # ------------------------------------------------------------ carte della fascia 5–7

  - id: carta-contaminazione-cantina
    titolo: La cantina crollata
    tipo: carta
    area: ovunque
    requisiti: [contaminazione >= 5, contaminazione < 8]
    immagine: fazioni/raschiatori
    sommario: "Un vecchio Raschiatore sa di un cristallo carico in una cantina piena di Marea. A te, dice, cambia poco."
    testo: |
      Il vecchio Raschiatore ti si siede accanto grattandosi le macchie
      argentate dei veterani sul dorso delle mani.

      «Ce l'hai già addosso, si vede» dice. «Un po' in più ti cambia poco.
      Dico bene?»

      In fondo alla sua strada è crollata una cantina, e sotto le macerie,
      in una sacca di Marea, ha visto brillare un cristallo carico. Alla sua
      età resta in cima alle scale, e il cristallo te lo regala volentieri.

      {ingannare Media} Sul cristallo dice il vero, però a regalarlo gli si
      stringe la bocca.

      {origine allievo-di-torvessa} All'Accademia un cristallo carico lo
      toccavate solo con il fazzoletto.
    opzioni:
      - testo: "Scendere fino in fondo"
        descrizione: "Attraversare la sacca e liberare il cristallo, a costo di un po' di Marea in più."
        esito:
          titolo: Nella nebbia
          testo: |
            La sacca si vede già dalle scale, una nebbia lattiginosa ferma a mezz'altezza. La attraversi con il
            colletto tirato sul naso, e il cristallo, incastrato fra due travi e caldo al tatto, ti prende più tempo
            del previsto. Quando risali le scale ti sembrano più lunghe dell'andata, e hai la testa piena di pensieri
            che non riesci a finire. In tasca il cristallo ronza contro la coscia.
          effetti: { contaminazione: 1.5, cristalli.cristallo-carico: 1 }
      - testo: "Fermarti sul bordo della sacca"
        descrizione: "Lavorare dal bordo con un bastone, senza entrare nella nebbia. Si trova meno, e si respira meno Marea."
        esito:
          titolo: Dal bordo
          testo: |
            Scendi fino al punto in cui comincia la nebbia e non fai un passo di
            più. Lavorando con un bastone dal bordo tiri fuori dalle macerie due
            cristalli sterili, mentre quello carico resta laggiù a brillare. Il
            vecchio ti aspetta in cima alle scale, scuote la testa quando vede che
            cosa porti e ti batte lo stesso una mano sulla spalla.
          effetti: { contaminazione: 1, cristalli.cristallo-sterile: 2 }

  - id: carta-contaminazione-muschi
    titolo: I muschi di Tuarmir
    tipo: carta
    area: ovunque
    requisiti: [contaminazione >= 5, contaminazione < 8]
    immagine: ambientazione/tuarmir
    sommario: "Una raccoglitrice di Tuarmir vende i muschi del Velo, e secondo lei a te bastano i fumi."
    testo: |
      La raccoglitrice viene da Tuarmir e porta al collo la maschera di
      stoffa impregnata d'erbe del suo villaggio. Sul telo ha steso i muschi
      umidi della gola, gli stessi che il Velo le compra per i riti di
      purificazione pagandoli poco.

      Vede che la tua mano sinistra trema appena. «A te bastano i fumi»
      dice, e si offre di prepararli lei, oppure di venderti per pochi
      spiccioli il muschio da preparare da solo.

      {politica-ed-economia Media fallita} Provi a fare il conto di quanto
      ci guadagna il Velo, e il conto si perde a metà strada.
    opzioni:
      - testo: "Farti preparare i fumi"
        requisiti: [monete >= 20]
        descrizione: "Il prezzo di una preparazione, e un'ora con la testa sotto un telo."
        esito:
          titolo: Sotto il telo
          testo: |
            La raccoglitrice brucia il muschio in un braciere di coccio e ti fa
            respirare il fumo amaro sotto un telo, con una mano sulla tua nuca,
            canticchiando per far passare il tempo. Quando togli il telo il sapore
            di ferro sotto la lingua si è fatto più lontano.
          effetti: { monete: -20, contaminazione: -1 }
      - testo: "Comprare il muschio e prepararlo da solo"
        requisiti: [monete >= 5]
        descrizione: "Pochi spiccioli per una manciata di muschio. Il resto dipende da quello che sai delle erbe."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: La brace coperta
          testo: |
            Fai seccare il muschio sulla finestra per un giorno, poi lo bruci a
            piccole dosi coprendo la brace perché faccia fumo senza prendere
            fuoco. Alla terza dose il sapore di ferro comincia a ritirarsi, e
            adesso sai come si fa.
          effetti: { monete: -5, contaminazione: -1 }
        fallimento:
          titolo: Fumo nero
          testo: |
            Bruci il muschio troppo in fretta, e la stanza si riempie di un fumo
            nero che ti fa tossire fino a sera e che il vicino commenta dal
            pianerottolo. Il sapore di ferro resta dov'era.
          effetti: { monete: -5, scandalo: 0.5 }
