# Crisi della Contaminazione (Regolamento v0.4 §5 e integrazione, 5.5).
# Chi accetta non entra in un'area di penalità: la Marea lo cambia. Lo storylet
# scelta-mutazione mostra due mutazioni a caso fra quelle che non ha ancora.
# Più le carte della fascia 5–7.

storylet:
  - id: crisi-contaminazione
    titolo: Il sapore del ferro
    tipo: crisi
    area: citta-bassa
    requisiti: [contaminazione >= 8]
    immagine: ambientazione/marea-grigia
    sommario: "La Marea che ti porti addosso è arrivata al punto in cui il Velo non può più limitarsi a contenerla."
    testo: |
      Da qualche giorno fai fatica a tenere insieme due pensieri. Cominci una frase e a metà l'hai già persa,
      e sotto la lingua hai un sapore di ferro che resta anche quando mangi. Stamattina lo specchio ti ha
      restituito due occhi grigi con un riflesso metallico sul fondo.

      Ieri un accolito velato ti ha fermato sul Ponte delle Mille Corde e ti ha guardato a lungo gli occhi e
      la mano sinistra. Ha scritto qualcosa sul suo registro e ti ha detto di presentarti alla Cripta della
      Cattedrale prima di sera. A questo punto non basta più l'offerta di tutti i giorni.

      {origine accolito-del-velo} L'accolito del Ponte non l'avevi mai visto, e se ti ha riconosciuto non l'ha
      dato a vedere. Di quello che succede nella Cripta a chi ha gli occhi grigi ti hanno insegnato a non
      chiedere, e adesso che ti riguarda la regola ti sembra meno saggia.
    opzioni:
      - testo: "Lasciare che la Marea finisca il suo lavoro"
        costo: 0
        descrizione: "Ti chiudi in casa ad aspettare che passi la febbre, e quando sarà passata non sarai più come prima."
        esito:
          titolo: La febbre
          testo: |
            Non ti presenti alla Cripta. Rientri a casa prima del tramonto e
            sprangi la porta, poi ti stendi sul letto senza spogliarti, con le
            scarpe ai piedi, che a slacciarle non ce la fai e comunque non ti
            sembra più importante. La febbre arriva con il buio e ti sale lungo la
            schiena, e dietro le palpebre chiuse vedi una luce grigia che non
            viene dalla finestra.
          segue: scelta-mutazione

  - id: scelta-mutazione
    titolo: Quello che la Marea lascia
    tipo: seguito
    area: citta-bassa
    mostra: 2
    immagine: ambientazione/marea-grigia
    sommario: "La febbre della Marea arriva al culmine, e il tuo corpo comincia a cambiare."
    testo: |
      Verso mezzanotte la febbre arriva al culmine. Il lenzuolo è fradicio, e quando chiudi gli occhi la
      stanza si riempie di una nebbia lattiginosa che riaprendoli non trovi più. Senti la Marea muoversi sotto
      la pelle e cercare un punto dove fermarsi a lavorare.

      I Raschiatori più vecchi dicono che la Marea cambia un corpo una volta sola e per sempre, ma chi resta
      lucido fino in fondo può ancora spingerla un poco da una parte o dall'altra. Tu sei lucid{o|a}
      abbastanza. La senti premere in due punti diversi del corpo, e puoi lasciarle soltanto uno dei due.

      {natura Media} La Marea si ferma dove il corpo cede già. Se il punto glielo offri tu, il resto del corpo
      lo lascia stare.

      {origine figlio-del-circolo} Ti torna in mente la volpe che da bambin{o|a} hai visto abbattere nel Bosco
      di Velthar, con il suo odore di ferro caldo e di pelo bruciato. Adesso quell'odore lo senti sul cuscino,
      e viene da te.

      *Meglio sceglierlo adesso, finché so ancora contare fino a due.* Tieni gli occhi aperti e aspetti che
      passi la prossima ondata.
    opzioni:
      - testo: "La luce negli occhi"
        costo: 0
        requisiti: [mutazione.occhi-luminescenti == 0]
        descrizione: "Al buio le tue iridi manderanno una luce grigia. Vedrai meglio (+1 a Percezione) e ti vedranno prima (−1 a Furtività)."
        esito:
          titolo: Occhi luminescenti
          testo: |
            All'alba ti avvicini allo specchio e a prima vista non noti niente.
            Poi chiudi le imposte, e nella penombra i tuoi occhi si accendono di
            una luce grigia e fredda, la stessa che manda la Marea quando risale
            dalla Cicatrice al tramonto. Vedi le venature del legno sul soffitto e
            la polvere sospesa nell'aria. Chi entra nella stanza vede prima di
            tutto due punti di luce all'altezza del tuo viso, e nei vicoli di
            Qir-Azel impari presto a tenere lo sguardo basso.
          effetti: { mutazione.occhi-luminescenti: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Il fuoco sotto i polsi"
        costo: 0
        requisiti: [mutazione.vene-di-luce == 0]
        descrizione: "Le vene dei polsi e del collo brilleranno quando sei agitat{o|a}. Avrai più fiato nei momenti difficili (+2 Energia) e meno credito nei salotti (−1 a Galateo)."
        esito:
          titolo: Vene di luce
          testo: |
            Il cuore ti salta in gola, e sotto la pelle dei polsi le vene si
            accendono di una luce perlacea che pulsa al ritmo del battito. Nei
            giorni seguenti scopri che quella luce porta con sé una riserva di
            forza che prima non avevi. Chi ti incontra nei salotti buoni, però,
            guarda i tuoi polsi invece della tua faccia e ti porge la mano con
            esitazione.
          effetti: { mutazione.vene-di-luce: 1 }
          imposta: { contaminazione: 3 }
      - testo: "La scorza"
        costo: 0
        requisiti: [mutazione.pelle-increspata == 0]
        descrizione: "Sulle spalle e sulle braccia la pelle diventerà spessa e rugosa. Ti proteggerà dai colpi (+1 alla riduzione del danno) e ti renderà più rigido (−1 ad Acrobazia)."
        esito:
          titolo: Pelle increspata
          testo: |
            La pelle ti tira sulle spalle fin dalle prime ore del mattino. Quando
            ti guardi allo specchio la trovi grigia e rugosa dalle scapole ai
            gomiti, dura al tatto come la scorza di un albero vecchio. Se ci passi
            sopra un coltello, la lama scivola via lasciando appena un graffio
            bianco. Piegare le braccia sopra la testa invece ti costa fatica, e
            quando ti arrampichi senti la pelle nuova tendersi e resistere a ogni
            movimento.
          effetti: { mutazione.pelle-increspata: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Una voce nuova"
        costo: 0
        requisiti: [mutazione.gola-roca == 0]
        descrizione: "La voce ti diventerà bassa e graffiata. Metterai paura più facilmente (+1 a Intimidire) e convincerai con più fatica (−1 a Persuasione)."
        esito:
          titolo: Gola roca
          testo: |
            Al mattino provi a chiamare il padrone di casa, e dalla gola ti esce
            un suono basso e graffiato che non riconosci, come una lama trascinata
            sulla pietra. Il padrone di casa, sulle scale, decide che non aveva
            niente da dirti. Nei giorni seguenti noti che la gente si volta quando
            parli, e che al mercato i venditori abbassano il prezzo prima che tu
            abbia finito la frase. Quando invece provi a chiedere un favore con
            garbo, anche le parole più gentili ti escono minacciose.
          effetti: { mutazione.gola-roca: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Il sangue che la Marea riconosce"
        costo: 0
        requisiti: [mutazione.sangue-grigio == 0]
        descrizione: "Il tuo sangue diventerà scuro e denso. La Marea ti scivolerà addosso (Contaminazione per esposizione dimezzata), e il corpo reggerà un colpo in meno (−1 PF)."
        esito:
          titolo: Sangue grigio
          testo: |
            Te ne accorgi la prima volta che ti tagli, pulendo una scheggia dal
            palmo. Il sangue esce quasi grigio e si rapprende sulla pelle prima di
            arrivare a colare, e tu resti a guardarlo con la scheggia ancora fra
            le dita. Da quel giorno, quando attraversi una sacca di Marea, senti
            la nebbia sfiorarti e passare oltre come se ti conoscesse. Il corpo
            però è più debole di prima.
          effetti: { mutazione.sangue-grigio: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Il silenzio nei pensieri"
        costo: 0
        requisiti: [mutazione.mente-silenziosa == 0]
        descrizione: "Una parte dei tuoi pensieri si spegnerà. Avrai meno paura (+1 a Resilienza) e capirai peggio quella degli altri (−1 a Empatia)."
        esito:
          titolo: Mente silenziosa
          testo: |
            Ti svegli riposat{o|a} come non ti capitava da mesi. Ci metti un po' a
            capire che cosa manca, poi lo trovi. La voce che di notte ti elencava
            tutto quello che poteva andare storto si è zittita, e al suo posto c'è
            una calma piatta. Nei giorni seguenti guardi i Raschiatori tremare
            prima di un turno di scavo e non ne capisci il motivo. Quando un'amica
            ti racconta un suo dispiacere, ti accorgi di ascoltarla come si
            ascolta la pioggia.
          effetti: { mutazione.mente-silenziosa: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Mani di lega"
        costo: 0
        requisiti: [mutazione.unghie-di-metallo == 0]
        descrizione: "Le unghie diventeranno dure e grigie come una lega dei Precursori. Colpirai più forte a mani nude (+1 al danno) e nessuno vorrà stringerti la mano (−1 a Galateo)."
        esito:
          titolo: Unghie di metallo
          testo: |
            Le unghie cominciano a farti male verso l'alba, come se te le stessero
            strappando. Quando la luce entra dalla finestra le trovi grigie e
            lucide, con il riflesso della lega che si vede sui reperti dei
            Precursori. Con un'unghia riesci a incidere il legno, e un pugno dato
            bene adesso lascia il segno. Alla prima stretta di mano, però, vedi
            l'altro ritrarre le dita e guardarsi il palmo.
          effetti: { mutazione.unghie-di-metallo: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Il ronzio dei cristalli"
        costo: 0
        requisiti: [mutazione.orecchio-per-il-mana == 0]
        descrizione: "Sentirai i cristalli attraverso i muri, sempre. La magia ti verrà più facile fuori dal combattimento (+1 dado a Magia) e ogni Dissonanza ti costerà 1 Tormento invece di ½."
        esito:
          titolo: Orecchio per il Mana
          testo: |
            Poco prima dell'alba comincia un ronzio lontano, che cresce finché non
            riesci più a ignorarlo. Ci metti un'ora a capire che viene dalle
            lanterne della strada e da ogni cristallo carico nel raggio di cento
            passi.

            Quando provi un incantesimo le correnti del Mana ti vengono incontro
            con una facilità che non conoscevi. Di notte però il ronzio continua,
            e ogni volta che la magia ti sfugge di mano lo senti diventare un
            fischio dentro la testa.
          effetti: { mutazione.orecchio-per-il-mana: 1 }
          imposta: { contaminazione: 3 }

  # ------------------------------------------------------------ carte della fascia 5–7

  - id: carta-contaminazione-cantina
    titolo: La cantina crollata
    tipo: carta
    area: ovunque
    requisiti: [contaminazione >= 5, contaminazione < 8]
    immagine: fazioni/raschiatori
    sommario: "Un vecchio Raschiatore sa dove c'è un cristallo carico, in una cantina piena di Marea. Secondo lui, a te ormai cambia poco."
    testo: |
      Il vecchio Raschiatore ti si siede accanto senza chiedere il permesso e ti guarda negli occhi più a
      lungo del dovuto.

      «La Marea ce l'hai già addosso, si vede dagli occhi» dice. «Un po' in più ti cambia poco, eh? Senti,
      avrei un lavoretto.»

      Dopo le ultime piogge è crollata una cantina in fondo alla sua strada, e sotto le macerie si è aperta
      una sacca piccola con dentro un cristallo carico. Alla sua età lui non scende più, e te lo regala se hai
      il fegato di andarlo a prendere.

      {origine allievo-di-torvessa} All'Accademia un cristallo carico si passa di mano con cautela, come una
      tazza troppo piena. Sentirlo regalare fra due chiacchiere ti fa venire voglia di chiedere chi l'ha
      caricato.
    opzioni:
      - testo: "Scendere fino in fondo"
        descrizione: "Attraversare la sacca e liberare il cristallo carico. Ne esci con un cristallo in tasca e con un po' di Marea in più."
        esito:
          titolo: Nella nebbia
          testo: |
            La sacca si vede già dalle scale, una nebbia lattiginosa ferma a mezz'altezza con un riflesso metallico.
            Il cristallo è incastrato fra due travi ed è caldo al tatto, e liberarlo ti prende più tempo del
            previsto. Quando risali le scale ti sembrano più lunghe dell'andata, e hai la testa piena di pensieri che
            non riesci a finire. In tasca il cristallo ronza contro la coscia.
          effetti: { contaminazione: 1.5, cristalli.cristallo-carico: 1 }
      - testo: "Fermarti sul bordo della sacca"
        descrizione: "Lavorare dal bordo con un bastone, senza entrare nella nebbia. Si trova meno, e si respira meno Marea."
        esito:
          titolo: Dal bordo
          testo: |
            Scendi fino al punto in cui comincia la nebbia e non fai un passo di
            più. Lavorando con un bastone dal bordo della sacca, tiri fuori dalle
            macerie due cristalli sterili. Il cristallo carico resta laggiù a
            brillare. Il vecchio ti aspetta in cima alle scale appoggiato allo
            stipite. Scuote la testa quando vede che cosa porti. Poi ti batte una
            mano sulla spalla lo stesso.
          effetti: { contaminazione: 1, cristalli.cristallo-sterile: 2 }
      - testo: "Comprargli l'infuso dei Raschiatori"
        requisiti: [monete >= 25]
        descrizione: "Nella cantina non scendi. Il vecchio però ha in casa l'infuso amaro che i Raschiatori bevono quando risalgono, e lo vende caro."
        esito:
          titolo: L'infuso amaro
          testo: |
            Il vecchio brontola che il cristallo resterà alla Marea, poi tira fuori
            da sotto il letto una bottiglia scura. L'infuso ha il gusto della
            corteccia bagnata, e te lo fa bere a sorsi piccoli mentre conta le monete. Dopo
            un'ora il sapore di ferro sotto la lingua si è ritirato.
          effetti: { monete: -25, contaminazione: -1 }

  - id: carta-contaminazione-muschi
    titolo: I muschi di Tuarmir
    tipo: carta
    area: ovunque
    requisiti: [contaminazione >= 5, contaminazione < 8]
    immagine: ambientazione/tuarmir
    sommario: "Una raccoglitrice di Tuarmir vende i muschi che il Velo usa nei suoi riti. Per chi ha addosso poca Marea, dice, bastano i fumi."
    testo: |
      La raccoglitrice viene da Tuarmir e porta ancora al collo la maschera di stoffa impregnata d'erbe che al
      suo villaggio si indossa per uscire. Ha steso su un telo i muschi umidi della gola e ogni tanto li bagna
      con una fiaschetta. Dice che il Velo compra gli stessi muschi per i riti di purificazione e poi li
      rivende cari.

      «A te per adesso bastano i fumi» dice, e si offre di prepararli lei per pochi spiccioli. Altrimenti ti
      vende il muschio perché tu li prepari da sol{o|a}, se sai come si fa. «Se no, fidati, è meglio che li
      prepari io.»
    opzioni:
      - testo: "Farti preparare i fumi"
        requisiti: [monete >= 20]
        descrizione: "Il prezzo di una preparazione, e un'ora con la testa sotto un telo."
        esito:
          titolo: Sotto il telo
          testo: |
            La raccoglitrice brucia il muschio in un braciere di coccio e ti fa
            respirare il fumo sotto un telo, con la testa china, finché non ti
            lacrimano gli occhi, mentre lei ti tiene una mano sulla nuca e
            canticchia qualcosa per far passare il tempo. Il fumo è amaro e ha
            l'odore della pietra bagnata. Quando togli il telo il sapore di ferro
            sotto la lingua si è fatto più lontano.
          effetti: { monete: -20, contaminazione: -1 }
      - testo: "Comprare il muschio e prepararlo da sol{o|a}"
        requisiti: [monete >= 5]
        descrizione: "Pochi spiccioli per una manciata di muschio. Il resto dipende da quello che sai delle erbe."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: La brace coperta
          testo: |
            Fai seccare il muschio sulla finestra per un giorno, poi lo bruci a
            piccole dosi come ti ha spiegato lei, coprendo la brace perché faccia
            fumo senza prendere fuoco. Alla terza dose il sapore di ferro comincia
            a ritirarsi, e tu respiri con calma per la prima volta da giorni. Ti è
            costato poco, e adesso sai come si fa.
          effetti: { monete: -5, contaminazione: -1 }
        fallimento:
          titolo: Fumo nero
          testo: |
            Bruci il muschio troppo in fretta, e la stanza si riempie di un fumo
            nero che ti fa tossire fino a sera e che il vicino annusa dal
            pianerottolo, con un commento che attraversa la porta intero. Il
            sapore di ferro resta dov'era.
          effetti: { monete: -5, scandalo: 0.5 }
      - testo: "Farti fare il rito intero di Tuarmir"
        requisiti: [monete >= 35]
        descrizione: "Due sere sotto il telo, con il muschio buono e le parole che si dicono al suo villaggio."
        esito:
          titolo: Due sere sotto il telo
          testo: |
            La raccoglitrice ti fa tornare due sere di fila. Brucia il muschio
            buono, quello che tiene in un sacchetto a parte, e intanto dice piano
            parole del suo villaggio che non ti traduce. La seconda sera, quando
            togli il telo, il sapore di ferro sotto la lingua è sparito quasi del
            tutto.
          effetti: { monete: -35, contaminazione: -2 }
