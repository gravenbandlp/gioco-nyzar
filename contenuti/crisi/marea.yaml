# Crisi della Contaminazione (Regolamento v0.4 §5 e integrazione, 5.5).
# Chi accetta non entra in un'area di penalità: la Marea lo cambia. Lo storylet
# scelta-mutazione mostra due mutazioni a caso fra quelle che non ha ancora.
# Più le carte della fascia 5–7.

storylet:
  - id: crisi-contaminazione
    titolo: Il sapore del ferro
    tipo: crisi
    area: citta-bassa
    requisiti: [contaminazione >= 8]
    immagine: ambientazione/marea-grigia
    sommario: "La Marea che ti porti addosso è arrivata al punto in cui il Velo non può più limitarsi a contenerla."
    testo: |
      Da qualche giorno fai fatica a tenere insieme due pensieri. Cominci
      una frase e a metà l'hai già persa, e il sapore di ferro sotto la
      lingua resta anche quando mangi, perfino il pane della colazione, che
      di ferro non avrebbe motivo di sapere. Stamattina lo specchio ti ha
      restituito due occhi di un grigio che non riconosci, con un riflesso
      metallico sul fondo. *Monete lasciate troppo a lungo sotto la
      pioggia.* Hai passato il pollice sul vetro, nel caso la macchia fosse
      lì.

      {medicina Facile} Le pupille rispondono alla luce in ritardo, e la
      mano sinistra trema anche quando la tieni ferma sul tavolo. Il tuo
      corpo ha smesso di difendersi dalla Marea e comincia a farle posto.

      Ieri un accolito velato ti ha fermato sul Ponte delle Mille Corde e ti
      ha guardato a lungo gli occhi e la mano sinistra. Poi ha scritto
      qualcosa sul suo registro, leccando la punta dello stilo prima di ogni
      parola, e ti ha detto di presentarti alla Cripta della Cattedrale
      prima di sera. Chi arriva a questo punto non può più cavarsela con
      l'offerta di tutti i giorni. Il Velo officia allora una purificazione
      straordinaria nella sala più bassa della Cripta, e la fa pagare a peso
      d'oro.

      {conoscenze-della-strada Media} Il registro dell'accolito non serve a
      salvarti. Serve a ricordare al Velo chi deve passare alla cassa entro
      sera, e chi invece si può dare per perso.

      {origine accolito-del-velo} L'accolito del Ponte non l'avevi mai visto,
      e se ha riconosciuto in te uno della Cattedrale non l'ha dato a vedere.
      Della sala più bassa della Cripta ti hanno insegnato a non chiedere, e
      adesso che la domanda ti riguarda la regola ti sembra meno saggia.

      I Raschiatori conoscono un'altra via. Un cristallo carico ceduto al
      Velo alimenta il rito al posto delle monete, perché il campo che ti
      ripulisce deve pur bere da qualche parte. Chi non ha né l'uno né le
      altre lascia che la Marea finisca il suo lavoro. Di solito ne esce
      vivo e cambiato, come certi veterani dei turni di scavo che al Grifone
      di Ferro nessuno fissa troppo a lungo, un po' per educazione e un po'
      per paura di riconoscersi.

      {origine apprendista-raschiatore} Sulle piattaforme la storia del
      cristallo ceduto al Velo la raccontano a tavola, di solito quelli che
      un cristallo carico in tasca non l'hanno mai avuto. Ti tornano in mente
      le mani dei veterani, e ti guardi le tue.
    opzioni:
      - testo: "Pagare la purificazione straordinaria"
        costo: 0
        requisiti: [monete >= 150]
        descrizione: "Un'offerta pesante al Velo, e una notte nella sala più bassa della Cripta."
        esito:
          titolo: La sala più bassa
          immagine: ambientazione/cattedrale-del-velo
          testo: |
            Gli accoliti ti fanno scendere oltre la sala dell'offerta, per una
            scala più stretta che odora di calce fresca, fino a una stanza senza
            finestre. Ti stendono su una lastra di pietra grigia, che ti ruba il
            calore della schiena in pochi minuti, e per tutta la notte ti lavano
            con un'acqua di resina, recitando a turno la Preghiera del Battito.
            Uno degli accoliti sbaglia sempre lo stesso verso e ricomincia da
            capo. Verso l'alba, da dietro una tenda, parla una voce di donna con
            un secondo sussurro sotto le parole, e gli accoliti tacciono.

            {magia Media} Appena lei parla, il Mana della stanza si raccoglie
            verso la tenda tutto insieme, e ti accorgi che per tutta la notte le
            preghiere degli accoliti l'avevano soltanto tenuto in caldo.

            Quando risali hai la testa sgombra, e il sapore di ferro è sceso in
            fondo alla gola. Il Velo, come sempre, si guarda bene dal parlare di
            guarigione.
          effetti: { monete: -150 }
          imposta: { contaminazione: 4 }
      - testo: "Cedere un cristallo carico al Velo"
        costo: 0
        requisiti: [cristalli.cristallo-carico >= 1]
        descrizione: "Il cristallo alimenta il rito al posto delle monete, e alla fine del rito non ne resta niente."
        esito:
          titolo: Il cristallo spento
          immagine: ambientazione/cristalli-conduttori
          testo: |
            L'accolito prende il cristallo con le mani fasciate e lo incastona in
            un bracciale di rame, che poi ti chiude al polso, stringendo la fibbia
            di un buco più del necessario. Per tutta la notte il cristallo ronza
            contro la pelle e si scalda, mentre la sua luce si fa sempre più
            fioca. Tu intanto senti la testa schiarirsi un pensiero alla volta,
            nell'ordine in cui li avevi persi.

            All'alba il cristallo è opaco e freddo. L'accolito ti sfila il
            bracciale e getta il cristallo spento in una cesta dove ce ne sono
            già molti altri, con il gesto distratto che si usa per i torsoli.
          effetti: { cristalli.cristallo-carico: -1 }
          imposta: { contaminazione: 4 }
      - testo: "Lasciare che la Marea finisca il suo lavoro"
        costo: 0
        descrizione: "Niente monete e niente cristalli. Ti chiudi in casa ad aspettare che passi la febbre, e quando sarà passata non sarai più come prima."
        esito:
          titolo: La febbre
          testo: |
            Non ti presenti alla Cripta. Rientri a casa prima del tramonto e
            sprangi la porta, poi ti stendi sul letto senza spogliarti, con le
            scarpe ai piedi, che a slacciarle non ce la fai e comunque non ti
            sembra più importante. La febbre arriva con il buio e ti sale lungo la
            schiena, e dietro le palpebre chiuse vedi una luce grigia che non
            viene dalla finestra.
          segue: scelta-mutazione

  - id: scelta-mutazione
    titolo: Quello che la Marea lascia
    tipo: seguito
    area: citta-bassa
    mostra: 2
    immagine: ambientazione/marea-grigia
    sommario: "La febbre della Marea arriva al culmine, e il tuo corpo comincia a cambiare."
    testo: |
      Verso mezzanotte la febbre arriva al culmine. Il lenzuolo è fradicio
      di sudore, e ogni volta che chiudi gli occhi la stanza si riempie di
      una nebbia lattiginosa che riaprendoli non trovi più. Senti la Marea
      muoversi sotto la pelle e cercare un punto dove fermarsi a lavorare, e
      a tratti ti pare che bussi, piano, dall'interno delle costole. Dalla
      strada arrivano i passi della ronda, e tu li usi per contare il tempo
      fra un'ondata di febbre e l'altra. Uno dei due di ronda strascica il
      piede destro, e dopo il terzo giro gli vuoi quasi bene. Hai sete, ma
      la brocca sul tavolo è troppo lontana.

      {resistenza Facile fallita} Il corpo valuta la distanza fra il letto e
      la brocca e la trova eccessiva. La sete, decide, può aspettare. Dopo
      un poco smetti di pensarci anche tu.

      I Raschiatori più vecchi dicono che la Marea cambia un corpo una volta
      sola, e per sempre. Dicono anche che chi resta lucido fino in fondo
      può ancora spingerla un poco da una parte o dall'altra, come si spinge
      una barca con il remo. Tu sei lucido abbastanza. La senti premere in
      due punti diversi del corpo, e sai che puoi lasciarle soltanto uno dei
      due.

      {natura Media} La Marea si ferma dove il corpo cede già, con la
      pazienza delle muffe. Se il punto glielo offri tu, il resto del corpo
      lo lascia stare.

      {origine figlio-del-circolo} Ti torna in mente la volpe che da bambino
      hai visto abbattere nel Bosco di Velthar, con il suo odore di ferro
      caldo e di pelo bruciato. Adesso quell'odore lo senti sul cuscino, e
      viene da te.

      *Meglio sceglierlo adesso, finché so ancora contare fino a due.* Tieni
      gli occhi aperti e aspetti che la prossima ondata passi.
    opzioni:
      - testo: "La luce negli occhi"
        costo: 0
        requisiti: [mutazione.occhi-luminescenti == 0]
        descrizione: "Al buio le tue iridi manderanno una luce grigia. Vedrai meglio (+1 a Percezione) e ti vedranno prima (−1 a Furtività)."
        esito:
          titolo: Occhi luminescenti
          testo: |
            All'alba ti avvicini allo specchio e a prima vista non noti niente.
            Poi chiudi le imposte, e nella penombra i tuoi occhi si accendono di
            una luce grigia e fredda, la stessa che manda la Marea quando risale
            dalla Cicatrice al tramonto. Vedi le venature del legno sul soffitto e
            la polvere sospesa nell'aria. Nell'angolo c'è una ragnatela che
            avresti giurato di aver tolto a primavera. Chi entra nella stanza vede
            prima di tutto due punti di luce all'altezza del tuo viso, e nei
            vicoli di Qir-Azel impari presto a tenere lo sguardo basso.

            {furtivita Facile} Al buio adesso sei una lanterna che cammina.
            Conviene abituarsi a guardarsi i piedi, e a girare gli angoli con gli
            occhi socchiusi.
          effetti: { mutazione.occhi-luminescenti: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Il fuoco sotto i polsi"
        costo: 0
        requisiti: [mutazione.vene-di-luce == 0]
        descrizione: "Le vene dei polsi e del collo brilleranno quando sei agitato. Avrai più fiato nei momenti difficili (+2 Energia) e meno credito nei salotti (−1 a Galateo)."
        esito:
          titolo: Vene di luce
          testo: |
            Te ne accorgi quando il vicino bussa alla porta per chiederti se stai
            bene, e dalla voce si capisce che spera in un sì per tornarsene a
            letto. Il cuore ti salta in gola, e sotto la pelle dei polsi le vene
            si accendono di una luce perlacea che pulsa al ritmo del battito. Si
            spengono da sole quando ti calmi. Nei giorni seguenti scopri che
            quella luce porta con sé una riserva di forza che prima non avevi. Chi
            ti incontra nei salotti buoni, però, guarda i tuoi polsi invece della
            tua faccia e ti porge la mano con esitazione.
          effetti: { mutazione.vene-di-luce: 1 }
          imposta: { contaminazione: 3 }
      - testo: "La scorza"
        costo: 0
        requisiti: [mutazione.pelle-increspata == 0]
        descrizione: "Sulle spalle e sulle braccia la pelle diventerà spessa e rugosa. Ti proteggerà dai colpi (+1 alla riduzione del danno) e ti renderà più rigido (−1 ad Acrobazia)."
        esito:
          titolo: Pelle increspata
          testo: |
            La pelle ti tira sulle spalle fin dalle prime ore del mattino. Quando
            ti guardi allo specchio la trovi grigia e rugosa dalle scapole ai
            gomiti, dura al tatto come la scorza di un albero vecchio. Ti gratti
            una spalla per abitudine, e le unghie fanno un rumore secco di
            corteccia. Se ci passi sopra un coltello, la lama scivola via
            lasciando appena un graffio bianco. Piegare le braccia sopra la testa
            invece ti costa fatica, e quando ti arrampichi senti la pelle nuova
            tendersi e resistere a ogni movimento.

            {acrobazia Media fallita} Provi a toccarti le punte dei piedi, per
            vedere. Le punte dei piedi restano dove sono, a una distanza che ieri
            non c'era.
          effetti: { mutazione.pelle-increspata: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Una voce nuova"
        costo: 0
        requisiti: [mutazione.gola-roca == 0]
        descrizione: "La voce ti diventerà bassa e graffiata. Metterai paura più facilmente (+1 a Intimidire) e convincerai con più fatica (−1 a Persuasione)."
        esito:
          titolo: Gola roca
          testo: |
            Al mattino provi a chiamare il padrone di casa, e dalla gola ti esce
            un suono basso e graffiato che non riconosci, come una lama trascinata
            sulla pietra. Bevi un sorso d'acqua e ti schiarisci la voce, e la voce
            resta quella. Il padrone di casa, sulle scale, decide che non aveva
            niente da dirti. Nei giorni seguenti noti che la gente si volta quando
            parli, e che al mercato i venditori abbassano il prezzo prima che tu
            abbia finito la frase. Quando invece provi a chiedere un favore con
            garbo, anche le parole più gentili ti escono minacciose.

            {intimidire Facile} Non serve più alzare la voce. Basta usarla, e
            lasciare che gli altri facciano il resto da soli.
          effetti: { mutazione.gola-roca: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Il sangue che la Marea riconosce"
        costo: 0
        requisiti: [mutazione.sangue-grigio == 0]
        descrizione: "Il tuo sangue diventerà scuro e denso. La Marea ti scivolerà addosso (Contaminazione per esposizione dimezzata), e il corpo reggerà un colpo in meno (−1 PF)."
        esito:
          titolo: Sangue grigio
          testo: |
            Te ne accorgi la prima volta che ti tagli, pulendo una scheggia dal
            palmo. Il sangue esce quasi grigio e si rapprende sulla pelle prima di
            arrivare a colare, e tu resti a guardarlo con la scheggia ancora fra
            le dita. Da quel giorno, quando attraversi una sacca di Marea, senti
            la nebbia sfiorarti e passare oltre come se ti conoscesse. Il corpo
            però è più debole di prima. Ti stanchi in fretta, e una ferita che una
            volta avresti ignorato adesso ti costringe a sederti.
          effetti: { mutazione.sangue-grigio: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Il silenzio nei pensieri"
        costo: 0
        requisiti: [mutazione.mente-silenziosa == 0]
        descrizione: "Una parte dei tuoi pensieri si spegnerà. Avrai meno paura (+1 a Resilienza) e capirai peggio quella degli altri (−1 a Empatia)."
        esito:
          titolo: Mente silenziosa
          testo: |
            Ti svegli riposato come non ti capitava da mesi. Ci metti un po' a
            capire che cosa manca, poi lo trovi. La voce che di notte ti
            elencava tutto quello che poteva andare storto si è zittita, e al
            suo posto c'è una calma piatta. Nei giorni seguenti guardi i
            Raschiatori tremare prima di un turno di scavo e non ne capisci il
            motivo. Quando un'amica ti racconta un suo dispiacere, ti accorgi
            di ascoltarla come si ascolta la pioggia.

            {empatia Media fallita} Lei a un certo punto smette di parlare e ti
            guarda. Tu annuisci, perché ti sembra il momento, e lei raccoglie lo
            scialle e se ne va prima del previsto.
          effetti: { mutazione.mente-silenziosa: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Mani di lega"
        costo: 0
        requisiti: [mutazione.unghie-di-metallo == 0]
        descrizione: "Le unghie diventeranno dure e grigie come una lega dei Precursori. Colpirai più forte a mani nude (+1 al danno) e nessuno vorrà stringerti la mano (−1 a Galateo)."
        esito:
          titolo: Unghie di metallo
          testo: |
            Le unghie cominciano a farti male verso l'alba, come se te le
            stessero strappando. Quando la luce entra dalla finestra le trovi
            grigie e lucide, con il riflesso della lega che si vede sui reperti
            dei Precursori. Picchiettate sul tavolo mandano un suono metallico,
            e continui a tamburellare per il gusto di sentirlo finché il vicino
            batte sul muro.
            Con un'unghia riesci a incidere il legno, e un pugno dato bene
            adesso lascia il segno. Alla prima stretta di mano, però, vedi
            l'altro ritrarre le dita e guardarsi il palmo.
          effetti: { mutazione.unghie-di-metallo: 1 }
          imposta: { contaminazione: 3 }
      - testo: "Il ronzio dei cristalli"
        costo: 0
        requisiti: [mutazione.orecchio-per-il-mana == 0]
        descrizione: "Sentirai i cristalli attraverso i muri, sempre. La magia ti verrà più facile fuori dal combattimento (+1 dado a Magia) e ogni Dissonanza ti costerà 1 Tormento invece di ½."
        esito:
          titolo: Orecchio per il Mana
          testo: |
            Poco prima dell'alba comincia un ronzio lontano, che cresce finché
            non riesci più a ignorarlo. Ci metti un'ora a capire che viene dalle
            lanterne della strada e da ogni cristallo carico nel raggio di cento
            passi. Ognuno ha la sua nota, e quella della lanterna sotto casa è
            appena calante, cosa che da oggi ti darà fastidio per sempre.

            {magia Facile} Il Mana ha sempre fatto questo rumore. Prima eri tu a
            non avere l'orecchio, e adesso non hai più le palpebre.

            Quando provi un incantesimo le correnti del Mana ti vengono incontro
            con una facilità che non conoscevi. Di notte però il ronzio continua,
            e ogni volta che la magia ti sfugge di mano lo senti diventare un
            fischio dentro la testa.
          effetti: { mutazione.orecchio-per-il-mana: 1 }
          imposta: { contaminazione: 3 }

  # ------------------------------------------------------------ carte della fascia 5–7

  - id: carta-contaminazione-cantina
    titolo: La cantina crollata
    tipo: carta
    area: ovunque
    requisiti: [contaminazione >= 5, contaminazione < 8]
    immagine: fazioni/raschiatori
    sommario: "Un vecchio Raschiatore sa dove c'è un cristallo carico, in una cantina piena di Marea. Secondo lui, a te ormai cambia poco."
    testo: |
      Il vecchio Raschiatore ti si siede accanto senza chiedere il permesso.
      Ha la barba grigia e, sul dorso delle mani, le macchie argentate che i
      veterani dei turni si portano addosso dopo troppi anni di scavo, e
      mentre parla se le gratta con il pollice, come se dovessero venire via
      prima o poi. Ti guarda negli occhi un po' più a lungo del dovuto, e a
      te viene voglia di abbassarli.

      {percezione Facile} Ti sta guardando il grigio in fondo all'iride, e
      da come lo cerca si capisce che sa benissimo dove trovarlo.

      «Ce l'hai già addosso, si vede» dice. «Un po' in più, a questo punto,
      ti cambia poco. Dico bene? Ti cambia poco.»

      Dopo le ultime piogge, racconta, è crollata una cantina in fondo alla
      sua strada, e sotto le macerie si è aperta una sacca piccola. Lui ci
      ha visto brillare un cristallo carico, ma alla sua età non scende più
      da nessuna parte, e si batte il ginocchio per fartelo sentire. Te lo
      regala volentieri, basta che tu abbia il fegato di andarlo a prendere.

      {ingannare Media} Sul cristallo dice la verità. Riguardo al volentieri
      un po' meno, perché a regalarlo gli si stringe la bocca.

      {origine allievo-di-torvessa} All'Accademia un cristallo carico si
      prende con il fazzoletto e si passa di mano con cautela, come una tazza
      troppo piena. Sentirlo regalare così, fra due chiacchiere, ti fa venire
      voglia di chiedere chi l'ha caricato.
    opzioni:
      - testo: "Scendere fino in fondo"
        descrizione: "Attraversare la sacca e liberare il cristallo carico. Ne esci con un cristallo in tasca e con un po' di Marea in più."
        esito:
          titolo: Nella nebbia
          testo: |
            La sacca si vede già dalle scale, una nebbia lattiginosa ferma a
            mezz'altezza con un riflesso metallico. La attraversi con il colletto
            tirato sul naso e la bocca chiusa più a lungo che puoi, e quando non
            ce la fai più prendi l'aria a piccoli sorsi, per educazione. Il cristallo è incastrato fra due travi ed è
            caldo al tatto, e liberarlo ti prende più tempo del previsto. Quando
            risali le scale ti sembrano più lunghe dell'andata, e hai la testa
            piena di pensieri che non riesci a finire. *Sono gli stessi gradini.*
            In tasca il cristallo ronza contro la coscia.
          effetti: { contaminazione: 1, cristalli.cristallo-carico: 1 }
      - testo: "Fermarti sul bordo della sacca"
        descrizione: "Lavorare dal bordo con un bastone, senza entrare nella nebbia. Si trova meno, e si respira meno Marea."
        esito:
          titolo: Dal bordo
          testo: |
            Scendi fino al punto in cui comincia la nebbia e non fai un passo di
            più. Lavorando con un bastone dal bordo della sacca, tiri fuori dalle
            macerie due cristalli sterili. Il cristallo carico resta laggiù a
            brillare. Il vecchio ti aspetta in cima alle scale appoggiato allo
            stipite. Scuote la testa quando vede che cosa porti. Poi ti batte una
            mano sulla spalla lo stesso.
          effetti: { contaminazione: 0.5, cristalli.cristallo-sterile: 2 }

  - id: carta-contaminazione-muschi
    titolo: I muschi di Tuarmir
    tipo: carta
    area: ovunque
    requisiti: [contaminazione >= 5, contaminazione < 8]
    immagine: ambientazione/tuarmir
    sommario: "Una raccoglitrice di Tuarmir vende i muschi che il Velo usa nei suoi riti. Per chi ha addosso poca Marea, dice, bastano i fumi."
    testo: |
      La raccoglitrice viene da Tuarmir e porta ancora al collo, abbassata,
      la maschera di stoffa impregnata d'erbe che al suo villaggio si
      indossa per uscire. Ha steso su un telo i muschi umidi della gola e
      ogni tanto li bagna con una fiaschetta, la stessa da cui, quando crede
      che nessuno guardi, beve anche lei. Dice che sono gli stessi muschi
      che il Velo compra per i riti di purificazione, e che il Velo li paga
      poco e li rivende cari.

      {natura Facile} Muschio di gola, cresciuto dove la roccia suda. Al
      tatto deve essere freddo anche d'estate, e questo lo è.

      Vede che la tua mano sinistra trema appena e capisce prima che tu apra
      bocca. «A te bastano i fumi» dice, e ti offre di prepararli lei per
      pochi spiccioli, oppure di venderti il muschio perché tu li prepari da
      solo, se sai come si fa. «Se no, è meglio che paghi me. Fidati. Meglio
      me.»

      {politica-ed-economia Media fallita} Provi a fare il conto di quanto
      ci guadagna il Velo sopra di lei. Il conto si perde a metà strada,
      insieme al resto dei tuoi pensieri di questi giorni.
    opzioni:
      - testo: "Farti preparare i fumi"
        requisiti: [monete >= 20]
        descrizione: "Il prezzo di una preparazione, e un'ora con la testa sotto un telo."
        esito:
          titolo: Sotto il telo
          testo: |
            La raccoglitrice brucia il muschio in un braciere di coccio e ti fa
            respirare il fumo sotto un telo, con la testa china, finché non ti
            lacrimano gli occhi, mentre lei ti tiene una mano sulla nuca e
            canticchia qualcosa per far passare il tempo. Il fumo è amaro e ha
            l'odore della pietra bagnata. Quando togli il telo il sapore di ferro
            sotto la lingua si è fatto più lontano.
          effetti: { monete: -20, contaminazione: -1 }
      - testo: "Comprare il muschio e prepararlo da solo"
        requisiti: [monete >= 5]
        descrizione: "Pochi spiccioli per una manciata di muschio. Il resto dipende da quello che sai delle erbe."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: La brace coperta
          testo: |
            Fai seccare il muschio sulla finestra per un giorno, poi lo bruci a
            piccole dosi come ti ha spiegato lei, coprendo la brace perché faccia
            fumo senza prendere fuoco. Alla terza dose il sapore di ferro comincia
            a ritirarsi, e tu respiri con calma per la prima volta da giorni. Ti è
            costato poco, e adesso sai come si fa.
          effetti: { monete: -5, contaminazione: -1 }
        fallimento:
          titolo: Fumo nero
          testo: |
            Bruci il muschio troppo in fretta, e la stanza si riempie di un fumo
            nero che ti fa tossire fino a sera e che il vicino annusa dal
            pianerottolo, con un commento che attraversa la porta intero. Il
            sapore di ferro resta dov'era.
          effetti: { monete: -5 }
