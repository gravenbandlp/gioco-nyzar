# Crisi del Sospetto e dello Scandalo, con le loro aree di penalità
# (Regolamento v0.4 §5 e integrazione): prigione (carcere interrato della Caserma)
# e ostracismo (i sottoponti, sotto i Ponti Sospesi). Più le carte della fascia 5–7.

aree:
  - id: prigione
    nome: Prigione
    immagine: ambientazione/guarnigione-di-qir-azel
    penalita: true
    testo: |
      Le celle della Caserma stanno sotto il cortile dove la Guardia e i Raschiatori si addestrano insieme.
      Dal soffitto ti arrivano i colpi sordi dell'addestramento, sempre alle stesse ore.

      Nella tua cella hai un pagliericcio e un secchio, e una finestrella a bocca di lupo dà sul cortile
      all'altezza degli stivali. Il muro sotto la finestrella è sempre umido, e la calce si stacca a scaglie
      quando ci appoggi la schiena.

      In fondo al corridoio c'è l'unica lanterna, e sotto il carceriere annota ogni sera sul registro la
      condotta dei detenuti.

      Da qui si esce quando la Caserma decide che il tuo nome può tornare in strada, e intanto conviene che il
      carceriere ti trovi in ordine.

  - id: ostracismo
    nome: Ostracismo
    immagine: ambientazione/ponti-sospesi
    penalita: true
    testo: |
      Sopra la tua testa passa il Ponte delle Mille Corde, che da quaggiù conosci per il rumore. In città il
      tuo nome è diventato una barzelletta, così sei sces{o|a} dove nessuno chiede chi sei.

      I sottoponti sono una città appesa sotto l'altra, e le sue case sono teli cerati legati alle travi. Le
      funi che reggono le piattaforme sono annodate da mani diverse, e nessuna è nuova. Quaggiù i mutati della
      Marea vivono insieme a gente caduta in disgrazia come te.

      Per tornare di sopra ti serve che la città trovi un altro argomento. Intanto devi restare viv{o|a} e
      farti un posto fra chi abita le travi.

quality:
  - { id: recupero.prigione, nome: Buona condotta, categoria: stato, descrizione: "Le righe buone che il carceriere ha scritto su di te nel registro del carcere. A quindici, la Caserma è pronta a lasciarti andare." }
  - { id: recupero.ostracismo, nome: Oblio, categoria: stato, descrizione: "Quanto la città si è dimenticata di te mentre vivevi sotto i Ponti. A quindici, puoi tornare di sopra." }
  - { id: debito.scuri, immagine: fazioni/scuri, nome: Debito con gli Scuri, categoria: stato, descrizione: "Gli Scuri ti hanno tirato fuori dal carcere della Caserma, e il tuo nome è finito nel registro dei favori da riscuotere che Rozalia Marga tiene per loro." }

storylet:
  # ------------------------------------------------------------ Sospetto

  - id: crisi-sospetto
    titolo: Il mandato
    tipo: crisi
    area: citta-bassa
    requisiti: [sospetto >= 8]
    immagine: personaggi/toren-galdrick
    sommario: "La Caserma ha scritto il tuo nome per intero su un foglio con il sigillo dello sceriffo."
    testo: |
      Due guardie della Caserma con il cappuccio di maglia aspettano all'angolo della tua strada e guardano la
      tua porta, e le gambe ti rallentano da sole. La maglia è scura di grasso alle giunture, e quando una
      delle due gira la testa gli anelli frusciano sul colletto.

      Il sergente che le comanda ti raggiunge prima che tu possa cambiare direzione. Ha in mano un foglio con
      il sigillo dello sceriffo Toren Galdrick, e sul foglio c'è il tuo nome per intero, con due righe di
      motivi e uno spazio bianco per quelli che troveranno. La ceralacca è rossa e intera, e la carta ha
      ancora le pieghe nette.

      «La Caserma vuole sentirti oggi, e per oggi intendo prima di cena» dice grattandosi il collo. «Poi vedi
      tu.»

      {conoscenze-della-strada Facile} Quel «vedi tu» vuol dire che il sergente aspetta qualcosa da te. Un
      sergente che vuole arrestarti non ti lascia il pomeriggio libero per pensarci.

      {origine figlio-della-citta-bassa} In Città Bassa un foglio con quel sigillo l'hai visto arrivare a più
      di una porta, e chi lo riceveva spariva per un mese e tornava più magro.

      A Qir-Azel un'accusa si può ancora far dimenticare, se sai a chi rivolgerti e che cosa sei dispost{o|a}
      a perdere.
    opzioni:
      - testo: "Consegnare un nome degli Scuri"
        costo: 0
        quando: [pista.pelle < 6]
        descrizione: "Puoi darle il corriere che porta i cristalli non registrati dalla Pignatta al Mercato delle Ombre."
        esito:
          titolo: Un nome per un altro
          immagine: fazioni/scuri
          testo: |
            Dici il nome a bassa voce e aggiungi l'ora e la strada, e la bocca ti resta amara come dopo un
            vino cattivo. Il sergente lo scrive nello spazio bianco sotto il tuo. Poi cancella il tuo con due
            righe dritte e così calcate che la carta si incide, aiutandosi con il bordo di un'unghia.

            Due sere dopo il corriere viene preso con il sacco addosso. Alla Pignatta Grassa Mauro Scrocco ha
            cominciato a chiedere chi l'abbia venduto, a voce così alta che lo sente mezza sala, e a ognuno
            versa un dito di vino in più.
          effetti: { rep.scuri: -2, rep.caserma: 1 }
          imposta: { sospetto: 4 }
      - testo: "Consegnare un nome degli ultimi Scuri"
        costo: 0
        quando: [pista.pelle >= 6]
        descrizione: "Dopo il rogo della Pignatta c'è ancora chi porta cristalli non registrati al Mercato delle Ombre, e la Caserma vuole anche gli ultimi degli Scuri."
        esito:
          titolo: Un nome per un altro
          immagine: fazioni/scuri
          testo: |
            Dici il nome a bassa voce e aggiungi l'ora e la strada, e ti accorgi di aver abbassato gli occhi.
            È un ricettatore che dopo il rogo della Pignatta ha continuato a passare cristalli al Mercato
            delle Ombre, come se nessuno gli avesse detto che Mirko Vesh è morto. Il sergente lo scrive nello
            spazio bianco sotto il tuo, poi cancella il tuo con due righe dritte e soffia sulla carta perché
            l'inchiostro non sbavi.

            Due sere dopo il ricettatore viene preso con il sacco addosso.
          effetti: { rep.scuri: -2, rep.caserma: 1 }
          imposta: { sospetto: 4 }
      - testo: "Bruciare il tuo contatto nell'ombra"
        costo: 0
        quando: [fazione.scuri < 3]
        requisiti: [contatto-ombra >= 1]
        descrizione: "Dai alla Caserma la porta che usi per scendere al Mercato delle Ombre. Chi te l'ha insegnata non vorrà più vederti."
        esito:
          titolo: Una porta murata
          immagine: ambientazione/mercato-delle-ombre
          testo: |
            Descrivi la porta al sergente, e anche il colpo da battere e la parola da dire. Lui si fa ripetere
            il colpo due volte e lo batte piano con le nocche sul foglio.

            Una settimana dopo passi davanti al vicolo e trovi la porta murata con mattoni ancora freschi.
            Nelle commessure la malta è grigia e morbida, e si vedono i segni della cazzuola. Ti accorgi di
            aver allungato il passo solo quando sei in fondo al vicolo. L'uomo che ti aveva insegnato la
            strada non si fa più trovare, e le voci della Città Bassa dicono che il Mercato ha già cambiato
            stanza.
          effetti: { contatto-ombra: -1 }
          imposta: { sospetto: 4 }
      - testo: "Seguire il sergente in Caserma"
        costo: 0
        quando: [pista.pelle < 4]
        descrizione: "Nessun accordo e nessun nome. Scendi nelle celle del piano interrato e aspetti che la Caserma si stanchi di te."
        esito:
          titolo: Il piano interrato
          testo: |
            Il sergente ti accompagna fino al portone della Caserma, nei Quartieri Alti. Al banco ti tolgono
            la cintura e i lacci degli stivali, e un uomo massiccio con il naso rotto più volte ti porta giù
            nelle celle, reggendo la lanterna. Sulle scale ti tieni i calzoni con una mano, e i piedi ti
            ballano negli stivali. Più scendi e più l'aria si fa fredda e sa di calce bagnata.

            La porta di quercia si chiude alle tue spalle. Il carceriere apre lo spioncino, ti guarda un
            momento e dice che si chiama Borso.
          vai: prigione
      - testo: "Seguire il sergente in Caserma"
        costo: 0
        quando: [pista.pelle >= 4]
        descrizione: "Nessun accordo e nessun nome. Scendi nelle celle del piano interrato e aspetti che la Caserma si stanchi di te."
        esito:
          titolo: Il piano interrato
          testo: |
            Il sergente ti accompagna fino al portone della Caserma, nei Quartieri Alti. Al banco ti tolgono
            la cintura e i lacci degli stivali, e il carceriere nuovo ti porta giù nelle celle reggendo la
            lanterna. Scende un gradino alla volta per via del ginocchio rigido, e ogni gradino la luce si
            sposta un poco più in basso sulle pietre umide.

            La porta di quercia si chiude alle tue spalle. Il carceriere apre lo spioncino, ti guarda un
            momento e ti dice che qui sotto, da quando le chiavi vecchie se ne sono andate con Borso, si conta
            tutto due volte.
          vai: prigione

  - id: prigione-cortile
    titolo: I secchi del cortile
    area: prigione
    ripetibile: true
    luogo: Cortile della Caserma
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "All'alba il carceriere fa lavorare nel cortile chi vuole una riga buona nel registro."
    testo: |
      Chi vuole lavora nel cortile finché le reclute non hanno finito l'addestramento del mattino, e chi
      lavora bene si guadagna una riga buona nel registro del carceriere. Oggi bisogna portare l'acqua dalla
      cisterna agli abbeveratoi delle stalle, un secchio per mano. I secchi sono di doghe cerchiate di ferro e
      hanno il manico di corda, e pieni tirano le spalle verso terra. Quando l'acqua scroscia negli
      abbeveratoi i cavalli alzano la testa dalla paglia. Le reclute ti guardano passare, e una di loro ha
      imbottito l'elmo con una calza di lana a righe.

      Dragna Gro-Malog è appoggiata al muro con i fogli dei turni e non ti degna di un'occhiata.

      {origine apprendista-raschiatore} Il tuo nome l'ha scritto lei sui fogli dei turni più di una volta. Che
      adesso non alzi gli occhi può essere un favore o un giudizio, e non sai quale bruci di più.
    opzioni:
      - testo: "Portare i secchi fino all'ultima campana"
        descrizione: "Il lavoro è lungo, e il carceriere conta i viaggi."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Facile }
        successo:
          titolo: Una riga buona
          testo: |
            Porti l'ultimo secchio mentre suona la campana e le reclute rompono le righe. Hai le spalle in
            fiamme e le mani segnate dai manici, e quando provi ad aprirle le dita restano piegate a uncino.
            Negli abbeveratoi l'acqua arriva all'orlo e trema ancora. La recluta con la calza nell'elmo ti fa
            un cenno col mento, da collega. Il carceriere ti riaccompagna in cella e, prima di chiudere,
            scrive qualcosa nel registro con un mozzicone di matita.
          effetti: { recupero.prigione: 1 }
        fallimento:
          titolo: Sugli stivali
          testo: |
            A metà mattina un secchio ti scivola e si rovescia sugli stivali di una recluta, che ti insulta
            davanti a tutto il cortile con parole che alla sua età non dovrebbe ancora conoscere. Per il resto
            della mattina i suoi stivali sciaguattano a ogni passo. Finisci il turno lo stesso, zoppicando. Il
            carceriere scrive nel registro anche oggi, ma la riga è più corta.
          effetti: { recupero.prigione: 0.5 }

  - id: prigione-borso
    titolo: La scatola di latta
    area: prigione
    ripetibile: true
    requisiti: [pista.pelle < 4]
    luogo: Carcere della Caserma
    immagine: personaggi/borso
    sommario: "La sera Borso conta le monete in una scatola di latta, al tavolo in fondo al corridoio."
    testo: |
      La sera, finito il rancio, Borso siede al tavolo in fondo al corridoio sotto l'unica lanterna. Tira
      fuori da sotto il grembiule una scatola di latta con il coperchio ammaccato e conta le monete
      impilandole per dieci. Allinea le pile sul tavolo con il pollice, lungo una venatura del legno. Nella
      cella in fondo Karn, un tagliagole degli Scuri preso sui tetti della Città Bassa, smette di fischiare
      appena le sente tintinnare.

      {origine fuggiasco-di-ghoran} Il modo in cui si curva sulle monete l'hai visto nei recinti di Ghoran, in
      chi aveva qualcosa che i sorveglianti non dovevano trovare.

      {conoscenze-della-strada Media} Karn non fischia più perché ascolta, e ascolta perché qualcuno fuori gli
      ha chiesto di farlo.

      È il momento della giornata in cui Borso è più disposto ad ascoltare, e quello che pensa di te finisce
      nel registro.
    opzioni:
      - testo: "Parlargli attraverso lo spioncino"
        descrizione: "Borso non è un uomo di conversazione. Devi trovare le parole giuste, e poche."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Ghoran
          testo: |
            Gli domandi di dove viene, e dopo un silenzio così lungo che credi non ti abbia sentito Borso
            nomina Ghoran, la città dei mercati di schiavi. Lo dice senza alzare gli occhi, con la mano ferma
            sopra una pila. Poi torna a contare le monete, e tu lasci cadere il discorso.

            Quando ti porta il rancio, la mattina dopo, nella scodella c'è un pezzo di pane in più. Nel
            registro, alla voce che ti riguarda, ha scritto *tranquillo*.
          effetti: { recupero.prigione: 1 }
        fallimento:
          titolo: Lo spioncino
          testo: |
            Borso ti lascia parlare un poco, senza alzare gli occhi dalle pile. Poi si alza, viene fino alla
            tua porta con il suo passo pesante e chiude lo spioncino senza dire una parola, e lo sportello di
            ferro batte nel telaio. Lo senti tornare al tavolo e ricominciare a contare dall'inizio. A metà
            sbaglia e riparte, e ti pare colpa tua.

            Quella sera nel registro, alla tua voce, non compare nessuna riga nuova.
          effetti: { recupero.prigione: 0.5 }

  - id: prigione-il-carceriere-nuovo
    titolo: Il carceriere nuovo
    area: prigione
    ripetibile: true
    requisiti: [pista.pelle >= 4]
    luogo: Carcere della Caserma
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "Dopo la fuga di Borso le chiavi le tiene un sergente anziano, che la sera ripara le cinghie al tavolo in fondo al corridoio."
    testo: |
      Da quando Borso è scappato, le chiavi del carcere le tiene un sergente anziano che la Caserma ha tolto
      dalle mura per un ginocchio rigido. La sera siede sotto l'unica lanterna del corridoio con il ginocchio
      alzato su uno sgabello, e ripara le cinghie degli elmi con un punteruolo e lo spago cerato. Il cuoio
      delle cinghie è vecchio e crepato dove la fibbia lo piega. Lui fa i buchi nuovi a un dito dai vecchi e
      li ricuce con punti fitti e tutti uguali.

      Il registro dei detenuti è lo stesso di prima, con le pagine di Borso in fondo, e il sergente lo tiene
      aperto accanto alle cinghie. Le righe di Borso si fermano a metà di una settimana, e sotto comincia una
      mano più piccola e più dritta. Quello che pensa di te finisce lì, una riga alla volta.
    opzioni:
      - testo: "Parlargli attraverso lo spioncino"
        descrizione: "Il sergente lavora piano e ascolta volentieri, se trovi l'argomento giusto."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il ginocchio
          testo: |
            Gli chiedi del ginocchio, e lui ti racconta di una scala delle mura gelata, di un inverno di molti
            anni fa e di un cerusico che voleva tagliare. Parla senza smettere di cucire, battendo il tempo
            con il punteruolo sul tavolo, e alla fine ride da solo di una cosa che non ti ha detto.

            La mattina dopo nella scodella c'è un pezzo di pane in più ancora tiepido. Nel registro, alla voce
            che ti riguarda, ha scritto *ragionevole*.
          effetti: { recupero.prigione: 1 }
        fallimento:
          titolo: Lo spago
          testo: |
            Il sergente ti ascolta per un po' con il punteruolo fermo a mezz'aria. «Senti, a quest'ora le
            chiacchiere mi fanno sbagliare i punti» dice, e torna alla cinghia senza aggiungere altro. Per
            qualche minuto si sente solo lo spago cerato che fruscia nel cuoio. Poi lo senti sciogliere un
            nodo venuto storto.

            Quella sera nel registro, alla tua voce, non compare nessuna riga nuova.
          effetti: { recupero.prigione: 0.5 }

  - id: prigione-verbale
    titolo: Il verbale d'accusa
    area: prigione
    ripetibile: true
    luogo: Carcere della Caserma
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "Prima dell'interrogatorio il sergente ti lascia leggere il verbale. Se ci trovi un errore, la tua pratica si accorcia."
    testo: |
      Un vice-sceriffo ti porta il verbale d'accusa e te lo lascia per un'ora prima dell'interrogatorio, con
      una candela di sego. Sono quattro fogli fitti nella lingua di scartoffie che la Gilda ha insegnato a
      mezza città, dove nessuno va da nessuna parte e tutti «si recano». Ci sono le ore e i luoghi, e le firme
      delle guardie che ti hanno visto. L'inchiostro è passato dall'altra parte della carta, e sul margine del
      primo foglio qualcuno ha disegnato un gatto seduto.

      {origine allievo-di-torvessa} All'Accademia hai passato notti su trattati scritti peggio di questo. Qui
      almeno l'autore è uno solo, e non si è mai riletto.

      Le accuse sono tante. Chi le ha scritte aveva fretta, e uno scrivano che ha fretta sbaglia.
    opzioni:
      - testo: "Cercare le contraddizioni"
        descrizione: "Confrontare le ore con i luoghi e le firme con i turni di guardia, finché qualcosa non torna."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Un'ora di troppo
          testo: |
            Al terzo foglio, con la candela ridotta a un dito, lo trovi. Una guardia giura di averti visto sul
            Ponte delle Mille Corde alla stessa ora in cui un'altra ti mette in Città Bassa, e le due firme
            sono dello stesso turno. All'interrogatorio lo fai notare con calma e tieni il dito sulle due
            firme. Il vice-sceriffo rilegge due volte muovendo le labbra, poi sfila il terzo foglio dal
            verbale, lo piega in quattro e se lo mette in tasca.
          effetti: { recupero.prigione: 1 }
        fallimento:
          titolo: La lingua delle scartoffie
          testo: |
            Leggi e rileggi, ma fra i commi e le formule ti perdi prima della fine del primo foglio, e ogni
            «suddetto» ti rimanda indietro. Il sego della candela cola sul tavolo e si rapprende in una crosta
            bianca. Il gatto sul margine, intanto, ti guarda. All'interrogatorio rispondi a tutte le domande
            senza sbagliare e senza guadagnare terreno.
          effetti: { recupero.prigione: 0.5 }

  - id: prigione-uscita
    titolo: La porta di quercia
    area: prigione
    requisiti: [recupero.prigione >= 15, pista.pelle < 4]
    luogo: Carcere della Caserma
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "Il registro di Borso è pieno di righe buone. La Caserma è pronta a lasciarti andare, e non sei {il solo|la sola} a saperlo."
    testo: |
      Da una settimana il sergente non ti chiama più all'interrogatorio, e alla tua voce il registro di Borso
      è pieno di righe buone. Le scrive la sera sotto l'unica lanterna del corridoio, con una penna che gratta
      così forte che la senti dalla cella. Per uscire serve la firma di qualcuno che risponda di te, oppure
      qualche giorno di lavoro sui Ponti, perché la Caserma presta i detenuti ai Custodi di Passaggio della
      Gilda per riparare le corde. «Firma o braccia» ha riassunto Borso.

      Più tardi trovi sul vassoio del rancio un biglietto piegato e senza firma. La carta è spessa e liscia, e
      un angolo è unto di grasso di cucina. Proprio in quell'angolo c'è disegnata a inchiostro una pentola
      panciuta, e alla Pignatta Grassa sanno sempre chi sta per uscire.

      Nel pomeriggio Borso ti dice che chi ha un invito per i Quartieri Alti può uscire dal portone
      principale, dopo aver firmato la promessa di buona condotta nell'ufficio dello sceriffo.

      {origine rampollo-dei-quartieri-alti} In famiglia una promessa di buona condotta firmata dallo sceriffo
      la leggerebbero come un necrologio. Ti consola poco che almeno la firmeresti con la grafia inclinata il
      giusto che ti hanno insegnato da bambin{o|a}.
    opzioni:
      - testo: "Presentarti allo sceriffo"
        descrizione: "Toren Galdrick ti riceve nel suo ufficio. Firmi davanti a lui la promessa di buona condotta ed esci dal portone principale, nei Quartieri Alti."
        quando: [galdrick.via == 0]
        requisiti: [invito >= 1]
        esito:
          titolo: Il portone principale
          immagine: personaggi/toren-galdrick
          testo: |
            Lo sceriffo è un uomo imponente, con la pelle scura e la testa rasata. Ti mette davanti la
            promessa di buona condotta, aspetta che tu la legga fino in fondo e ti guarda firmare. La sedia
            davanti alla scrivania è bassa, e per firmare devi alzare il gomito fino al bordo del piano.

            «La tua pratica resta sul mio taccuino» dice mentre ripone la penna. «Se torni qui sotto, la
            prossima volta una firma non basta.»

            Fuori c'è la luce dei Quartieri Alti, così forte dopo le celle che ti lacrimano gli occhi, e senti
            l'odore dell'incenso che scende dalla Cattedrale.
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { galateo: 10 }
          vai: quartieri-alti
      - testo: "Firmare davanti al sergente di turno"
        descrizione: "Lo sceriffo è a Ghoran. La promessa di buona condotta la firmi davanti al sergente di turno, ed esci dal portone principale, nei Quartieri Alti."
        quando: [galdrick.via == 1]
        requisiti: [invito >= 1]
        esito:
          titolo: Il portone principale
          immagine: ambientazione/guarnigione-di-qir-azel
          testo: |
            Il sergente di turno ti riceve nell'ufficio dello sceriffo, in piedi accanto alla scrivania,
            perché sulla sedia di Galdrick nessuno si siede finché lui è a Ghoran. Legge il tuo nome due volte
            e lo confronta con una lista che tiene sotto il calamaio. La lista è scritta fitta e ha i margini
            anneriti dalle dita. Poi ti mette davanti la promessa di buona condotta e ti guarda firmare.

            «Lo sceriffo, quando torna, rilegge tutte le pratiche» dice, soffiando sull'inchiostro. «Se la tua
            gli ricapita sul tavolo, ti chiama lui.» Resta in piedi accanto alla sedia vuota per tutto il
            tempo, e tu con lui.
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { galateo: 10 }
          vai: quartieri-alti
      - testo: "Farti tirare fuori dagli Scuri"
        descrizione: "Rispondi al biglietto della Pignatta. Gli Scuri sanno come si esce da una cella senza firmare niente, e poi se lo ricordano."
        esito:
          titolo: Un ordine con il sigillo giusto
          immagine: personaggi/rozalia-marga
          testo: |
            La notte dopo una guardia che non hai mai visto apre la tua cella con un foglio in mano. È un
            ordine di scarcerazione con il sigillo dello sceriffo e la firma del sergente, così perfetti che
            il sergente stesso li giurerebbe suoi. Sotto il pollice la cera del sigillo è ancora morbida.

            Alla Pignatta Grassa Mauro Scrocco ti versa da bere e non ti fa pagare. «Adesso sei sul registro
            dei favori di Rozalia, {amico mio|amica mia}» dice, «e quando lei ti manda a chiamare, tu vieni.»
          effetti: { rep.scuri: 1, debito.scuri: 1 }
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { conoscenze-della-strada: 10 }
          vai: citta-bassa
      - testo: "Scontare il resto sui Ponti"
        descrizione: "Qualche giorno a riparare corde per i Custodi di Passaggio, sotto gli occhi di una guardia. Poi ti lasciano andare dove hai finito il lavoro."
        esito:
          titolo: Corde nuove
          immagine: ambientazione/ponti-sospesi
          testo: |
            Per cinque giorni sostituisci le funi sfilacciate sotto il Ponte delle Mille Corde, appes{o|a} a
            un'imbracatura, mentre una guardia della Caserma fuma sulla piattaforma di sopra e ti tiene
            d'occhio. La canapa nuova arriva in rotoli catramati che ti lasciano le mani nere fino ai polsi.
            Il Custode di Passaggio che dirige i lavori sa riconoscere dal cigolio una corda buona da una che
            cederà, e alla fine lo impari anche tu. Quella buona sotto il carico fa una nota bassa e sempre
            uguale, e quella che cederà scricchiola a scatti.

            L'ultimo giorno la guardia spegne la pipa, ti restituisce la cintura e se ne torna in Caserma
            senza voltarsi.
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { atletica: 10 }
          vai: ponti-sospesi

  # La stessa uscita dopo la fuga di Borso con le chiavi della Caserma (pista.pelle >= 4): un carceriere nuovo,
  # Galdrick tornato da Ghoran, e il biglietto della Pignatta solo finché la Pignatta c'è (pista.pelle < 6).
  - id: prigione-uscita-chiavi-nuove
    titolo: La porta di quercia
    area: prigione
    requisiti: [recupero.prigione >= 15, pista.pelle >= 4]
    luogo: Carcere della Caserma
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "Il registro del carceriere è pieno di righe buone, e la Caserma è pronta a lasciarti andare."
    testo: |
      Da una settimana il sergente non ti chiama più all'interrogatorio, e alla tua voce il registro del
      carceriere è pieno di righe buone. Stamattina il carceriere nuovo ha cercato la tua pratica su tre
      pagine sbagliate e poi ti ha detto che è arrivata in fondo. Per uscire serve la firma di qualcuno che
      risponda di te, oppure qualche giorno sui Ponti a riparare corde per i Custodi di Passaggio. «Firma o
      braccia» ha riassunto. «Con Borso si faceva così, e io non vedo perché cambiare.»

      Da quando le chiavi vecchie se ne sono andate con Borso, il fabbro della Caserma cambia una serratura al
      giorno. Ogni mattina il corridoio si sveglia con i colpi del suo martello, e sulle porte già rifatte le
      bandelle di ferro nuovo luccicano contro il legno scuro.
    opzioni:
      - testo: "Presentarti allo sceriffo"
        descrizione: "Toren Galdrick ti riceve nel suo ufficio. Firmi davanti a lui la promessa di buona condotta ed esci dal portone principale, nei Quartieri Alti."
        requisiti: [invito >= 1]
        esito:
          titolo: Il portone principale
          immagine: personaggi/toren-galdrick
          testo: |
            Lo sceriffo ti riceve seduto alla scrivania, con il cappuccio di maglia abbassato sulle spalle, e
            non si alza. Sul tavolo accanto al calamaio c'è un anello di ferro vuoto, di quelli che reggono le
            chiavi. Ogni tanto ci posa sopra la mano, piano, senza guardarlo. Il ferro è consumato lucido in
            un punto solo, dove le chiavi sfregavano.

            «La tua pratica resta sul mio taccuino» dice mentre ripone la penna. «Se torni qui sotto, la
            prossima volta una firma non basta.»
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { galateo: 10 }
          vai: quartieri-alti
      - testo: "Farti tirare fuori dagli Scuri"
        descrizione: "Gli Scuri hanno le chiavi vecchie della Caserma, e sanno ancora quali porte aprono."
        quando: [pista.pelle < 6]
        esito:
          titolo: Le chiavi vecchie
          immagine: personaggi/rozalia-marga
          testo: |
            La notte dopo la tua porta si apre senza rumore. Sulla soglia c'è una guardia che non hai mai
            visto, con un anello di chiavi vecchie infilato al polso, e ti fa segno di seguirla. Le chiavi
            sono fasciate una per una con strisce di stoffa, e lungo il corridoio non tintinnano mai.

            Alla Pignatta Grassa Mauro Scrocco ti versa da bere e non ti fa pagare, e il vino gratis ti va di
            traverso. «Adesso sei sul registro dei favori di Rozalia, {amico mio|amica mia}» dice, «e quando
            lei ti manda a chiamare, tu vieni.»
          effetti: { rep.scuri: 1, debito.scuri: 1 }
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { conoscenze-della-strada: 10 }
          vai: citta-bassa
      - testo: "Scontare il resto sui Ponti"
        descrizione: "Qualche giorno a riparare corde per i Custodi di Passaggio, sotto gli occhi di una guardia. Poi ti lasciano andare dove hai finito il lavoro."
        esito:
          titolo: Corde nuove
          immagine: ambientazione/ponti-sospesi
          testo: |
            Per cinque giorni sostituisci le funi sfilacciate sotto il Ponte delle Mille Corde, appes{o|a} a
            un'imbracatura, mentre una guardia della Caserma fuma sulla piattaforma di sopra e ti tiene
            d'occhio. La canapa nuova arriva in rotoli catramati che ti lasciano le mani nere fino ai polsi.
            Il Custode di Passaggio che dirige i lavori sa riconoscere dal cigolio una corda buona da una che
            cederà, e alla fine lo impari anche tu. Quella buona sotto il carico fa una nota bassa e sempre
            uguale, e quella che cederà scricchiola a scatti.

            L'ultimo giorno la guardia spegne la pipa, ti restituisce la cintura e se ne torna in Caserma
            senza voltarsi.
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { atletica: 10 }
          vai: ponti-sospesi

  # ------------------------------------------------------------ Scandalo

  - id: crisi-scandalo
    titolo: Il tuo nome sul ponte
    tipo: crisi
    area: citta-bassa
    requisiti: [scandalo >= 8]
    immagine: ambientazione/mercato-dei-nodi
    sommario: "Il tuo nome passa di bocca in bocca per tutta Qir-Azel, e a ogni passaggio la storia si allunga."
    testo: |
      Te ne accorgi al Mercato dei Nodi, quando il venditore di funi ti ripete il prezzo più forte perché lo
      sentano anche i banchi vicini. Ai banchi vicini le mani che contavano le matasse si fermano a metà. Da
      qualche giorno il tuo nome gira per Qir-Azel insieme alle tue ultime figuracce. Nelle osterie della
      Città Bassa ci hanno fatto sopra una strofa, e nei Quartieri Alti la raccontano a cena.

      Il fornitore che ti faceva credito ha cambiato idea, e una lettera che aspettavi è tornata indietro con
      il sigillo intatto. Sulla cera non c'è nemmeno il segno di un'unghia.

      {origine mercante-dei-ponti} Ai Ponti il credito è la prima cosa che se ne va e l'ultima che torna.
      Anche tu l'hai negato dal tuo banco a gente con una brutta storia, e adesso ti tornano in mente le loro
      facce.

      Una storia così si spegne in fretta se la città trova di meglio da raccontare. Qualcuno che ti stima può
      anche metterci la faccia per te e rimetterci un poco. Chi non ha né l'una né l'altro sparisce sotto i
      Ponti Sospesi e aspetta che la città si dimentichi.
    opzioni:
      - testo: "Dare in pasto un pettegolezzo migliore"
        costo: 0
        requisiti: [informazioni.pettegolezzo >= 2]
        descrizione: "Due pettegolezzi verificati, fatti girare nei posti giusti. La città ha bisogno di una storia, e può anche non essere la tua."
        esito:
          titolo: Un'altra storia
          testo: |
            Scegli con cura a chi raccontare le due storie, perché certe bocche portano più lontano di altre.
            Tre giorni dopo te le senti raccontare al Mercato dei Nodi da gente a cui non le hai mai dette, e
            ognuna ha un particolare in più.

            Ti rimane addosso una sensazione sgradevole, quella di chi ha spostato un peso sulle spalle di un
            vicino. Il tuo nome, intanto, ha smesso di girare.
          effetti: { informazioni.pettegolezzo: -2 }
          imposta: { scandalo: 4 }
      - testo: "Chiedere al Velo di coprirti"
        costo: 0
        requisiti: [rep.velo >= 1]
        descrizione: "Padre Vantes può farsi vedere al tuo fianco sui gradini della Cattedrale. È un favore che la Confraternita non dimentica."
        esito:
          titolo: Una mano sul braccio
          immagine: personaggi/padre-vantes
          testo: |
            Dopo la funzione della sera Padre Aurelio Vantes scende con te i gradini della Cattedrale, davanti
            alla folla che esce. Ha l'abitudine di toccare chi gli parla, e ti tiene la mano sul braccio per
            tutta la scalinata, parlandoti come a un fedele di vecchia data. La pietra dei gradini è scavata
            al centro da secoli di passi, e lui ti guida lungo il bordo dove la folla vi vede meglio.

            In città non serve altro. Alla Cattedrale però ogni favore finisce negli archivi di Ottilia
            Sanvel, e il tuo adesso è scritto lì.
          effetti: { rep.velo: -2 }
          imposta: { scandalo: 4 }
      - testo: "Chiedere alla Gilda di coprirti"
        costo: 0
        requisiti: [rep.gilda >= 1]
        descrizione: "Un funzionario della Casa dei Nodi può accompagnarti per il Mercato e far sapere che i tuoi conti sono in ordine."
        esito:
          titolo: I conti in ordine
          immagine: fazioni/gilda-dei-mercanti
          testo: |
            Il funzionario della Casa dei Nodi ti accompagna lungo il Mercato dei Nodi a metà mattina, quando
            i banchi sono più affollati. Si ferma da ogni mercante che ti ha negato credito e gli ricorda, con
            la cortesia della Gilda, che i tuoi conti sono in regola.

            I mercanti capiscono al volo, e il credito torna. Più d'uno apre il libro dei conti davanti a voi
            e passa la penna su una riga. La Casa dei Nodi però registra ogni favore che fa, e adesso ne ha
            uno a tuo nome.
          effetti: { rep.gilda: -2 }
          imposta: { scandalo: 4 }
      - testo: "Chiedere ai Castaldi di coprirti"
        costo: 0
        requisiti: [rep.castaldi >= 1]
        descrizione: "Marella Castaldi decide chi siede alle cene del Maniero nei giorni di consiglio. Un posto a quella tavola chiude molte bocche."
        esito:
          titolo: Un posto a tavola
          immagine: personaggi/marella-castaldi
          testo: |
            Marella Castaldi ti fa sedere alla cena del giorno di consiglio, due posti più in là della
            Rappresentante, sotto gli occhi delle famiglie dei Quartieri Alti. Non accenna mai alla tua
            storia, e nessuno dei commensali ha il coraggio di farlo al posto suo. Le posate sono d'argento
            pieno, e il coltello pesa tanto che ti tira il polso a ogni taglio.

            Il giorno dopo la tua storia vale molto meno. Marella ti congeda senza sorridere. «A questa tavola
            si parla di Stato e mai dei Castaldi» ti ricorda, «e da stasera, mi perdoni, lei è un favore dei
            Castaldi, che un giorno le chiederemo di ricambiare.»
          effetti: { rep.castaldi: -2 }
          imposta: { scandalo: 4 }
      - testo: "Chiedere alla Maison di coprirti"
        costo: 0
        requisiti: [rep.maison >= 1]
        descrizione: "Nerissa Dalvane conosce i pettegolezzi di mezza città e sa come correggerli. La discrezione della Maison, però, ha un prezzo."
        esito:
          titolo: La versione della Maison
          immagine: personaggi/nerissa-dalvane
          testo: |
            Nerissa Dalvane ti ascolta nel salotto rosso della Maison des Lunes senza interromperti, girando
            piano il cucchiaino nella tazza senza mai berne. Il velluto della tua poltrona è liso sui
            braccioli, dove tanti prima di te hanno stretto le dita. Poi Nerissa ti dice a voce bassa che la
            tua storia ha un buco, e che a riempirlo ci penserà la Maison.

            Nei giorni seguenti i clienti della Maison cominciano a raccontarne un'altra versione più noiosa e
            più credibile, e le due storie si consumano a vicenda. Alla Maison però il tuo nome è finito fra
            quelli che le devono qualcosa.
          effetti: { rep.maison: -2 }
          imposta: { scandalo: 4 }
      - testo: "Sparire sotto i Ponti"
        costo: 0
        descrizione: "Niente da spendere e nessuno da cui farti coprire. Scendi fra le travi dei sottoponti e aspetti che la città trovi un altro argomento."
        esito:
          titolo: Fra le travi
          testo: |
            Scendi per una scala di corda dietro un banco del Mercato dei Nodi, dove nessun Custode di
            Passaggio guarda. Sotto le assi c'è un'altra città fatta di reti e di tela cerata, e sopra la tua
            testa il Mercato rimbomba come un tamburo. Il vento della Cicatrice ti arriva addosso senza niente
            che lo fermi, e i denti ti battono prima che tu te ne accorga.

            Una donna seduta davanti a un braciere ti squadra e ti fa segno di sederti. Qui nessuno ha sentito
            la strofa delle osterie.
          vai: ostracismo

  - id: ostracismo-reti
    titolo: Le reti sotto il Mercato
    area: ostracismo
    ripetibile: true
    luogo: Sottoponti
    immagine: ambientazione/mercato-dei-nodi
    sommario: "Sotto il Mercato dei Nodi le reti raccolgono quello che cade dai banchi. Chi ci arriva prima se lo tiene."
    testo: |
      Sotto il Mercato dei Nodi gli abitanti dei sottoponti hanno teso reti larghe fra le travi, e ci finisce
      dentro quello che cade dai banchi di sopra, di solito mele ammaccate e rocchetti di filo. Le reti sono
      di canapa annodata a mano con maglie larghe quanto un pugno, e ogni nodo è stato rifatto tante volte che
      è grosso il doppio della corda. Quello che passa fra le maglie scende nella Cicatrice, e non lo senti
      mai arrivare in fondo.

      {origine figlio-del-circolo} Nel Bosco di Velthar hai camminato su rami più stretti di queste travi, con
      il muschio sotto invece della Cicatrice. Il corpo si ricorda l'equilibrio e la testa fa fatica a stargli
      dietro.

      Per arrivarci si cammina sulle travi nere di catrame a braccia larghe, fidandosi dei nodi di chi le ha
      legate. Chi riporta qualcosa lo divide con il braciere comune e si guadagna un posto vicino al fuoco.
    opzioni:
      - testo: "Camminare fino alle reti"
        descrizione: "Una trave, il vento di traverso e niente sotto per un bel tratto."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Facile }
        successo:
          titolo: Un sacco pieno
          testo: |
            Arrivi alla rete più lontana e ci trovi una forma di formaggio quasi intera, rotolata giù da un
            banco durante la notte, con l'impronta di un morso di topo su un fianco. La crosta è umida e la
            rete ci ha stampato sopra il disegno delle maglie. Torni sulla passerella con il sacco in spalla,
            e al braciere qualcuno ti fa posto senza che tu debba chiederlo.
          effetti: { recupero.ostracismo: 1 }
        fallimento:
          titolo: Mezza trave
          testo: |
            A metà trave una raffica ti piega sulle ginocchia e resti aggrappat{o|a} al legno finché non
            passa, con il cuore che batte nelle orecchie e le unghie piantate nel catrame. Sotto di te la rete
            più vicina si gonfia nel vento e poi ricade vuota. Torni indietro con le mani vuote. Al braciere
            nessuno ti prende in giro, e qualcuno ti passa lo stesso una mela ammaccata.
          effetti: { recupero.ostracismo: 0.5 }

  - id: ostracismo-braciere
    titolo: Il braciere di Mamma Tesh
    area: ostracismo
    ripetibile: true
    luogo: Sottoponti
    immagine: ambientazione/ponti-sospesi
    sommario: "La sera, intorno al braciere di Mamma Tesh, ognuno paga il suo posto con una storia o con un favore."
    testo: |
      Sulla piattaforma più larga dei sottoponti, al riparo di un pilone del Ponte delle Mille Corde, Mamma
      Tesh tiene acceso un braciere ricavato da un vecchio elmo. L'elmo è capovolto su tre pietre, e il ferro
      all'interno è nero di fuliggine fino all'orlo. Mamma Tesh lo chiama il Capitano e lo rimprovera quando
      fa troppo fumo. Vive sotto le travi da più tempo di chiunque altro. La sera ci si siede intorno al fuoco
      e ognuno paga il posto portando legna o notizie da sopra. Chi non porta niente si siede lontano, dove il
      vento della Cicatrice arriva pieno.
    opzioni:
      - testo: "Guadagnarti un posto vicino al fuoco"
        descrizione: "Raccontare bene una storia, oppure sapere a chi chiedere quello che manca."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, espressivita], difficolta: Media }
        successo:
          titolo: Vicino al fuoco
          testo: |
            Racconti la storia di come sei finit{o|a} quaggiù e la racconti in modo da far ridere anche te,
            con le pause dove servono e la tua faccia peggiore nel punto giusto. Mamma Tesh ride più forte di
            tutti e mostra i tre denti che le restano. Poi batte due volte la mano sull'asse accanto a sé.
            «Qua, qua, che il Capitano scalda meglio da questa parte» dice. L'asse è tiepida, e quando ti
            siedi il calore ti arriva dritto sulle ginocchia.
          effetti: { recupero.ostracismo: 1 }
        fallimento:
          titolo: In fondo al cerchio
          testo: |
            La storia ti esce storta, e a metà ti accorgi che nessuno ascolta più e senti il caldo salirti
            alle orecchie. Qualcuno sbadiglia senza nemmeno coprirsi la bocca. Resti in fondo al cerchio, dove
            il calore arriva appena e lo spiffero sale dalle fessure delle assi. Mamma Tesh però ti passa la
            scodella per ultimo, piena come quella degli altri.
          effetti: { recupero.ostracismo: 0.5 }

  - id: ostracismo-assi
    titolo: Quello che passa fra le assi
    area: ostracismo
    ripetibile: true
    luogo: Sottoponti
    immagine: ambientazione/ponti-sospesi
    sommario: "Dal sottoponte si sente tutto quello che si dice sul Ponte delle Mille Corde. Anche di te."
    testo: |
      Se ti stendi su un tavolato sotto il Ponte delle Mille Corde senti ogni parola che si dice di sopra. Le
      assi sono vecchie e dalle fessure passano i prezzi del Mercato, le liti dei carrettieri e i pettegolezzi
      dei Quartieri Alti portati dalle serve, che si fermano a chiacchierare sull'unica asse che non
      scricchiola. Quando ci rotola sopra un carro la polvere scende dalle fessure in fili sottili e ti
      finisce negli occhi. Ogni tanto passa anche il tuo nome.

      Con pazienza puoi capire chi continua a raccontare la tua storia e quando la gente comincia a
      stancarsene.
    opzioni:
      - testo: "Ascoltare il ponte"
        descrizione: "Distinguere le voci, ricordare chi dice cosa e seguire la tua storia mentre si consuma."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Un'altra storia di sopra
          testo: |
            Dopo mezza giornata sul tavolato, con la schiena indolenzita dalle assi e un ragno che ti ha
            scelto come casa, hai capito due cose. La tua storia la tiene viva un solo venditore di funi, che
            la racconta a ogni cliente, e da ieri sul ponte si parla soprattutto di un carico di sale sparito
            dai magazzini della Casa dei Nodi. Le serve ne parlano sottovoce proprio sull'asse che non
            scricchiola, e così le senti meglio di tutti. Il tuo nome passa sempre più di rado.
          effetti: { recupero.ostracismo: 1 }
        fallimento:
          titolo: Voci confuse
          testo: |
            Il vento copre metà delle parole e i carretti l'altra metà. Senti il tuo nome un paio di volte, ma
            non riesci a capire chi lo dice né in che tono, e ogni volta ti immagini il peggio. Scendi dal
            tavolato con il collo indolenzito e il segno delle fessure stampato sulla guancia.
          effetti: { recupero.ostracismo: 0.5 }

  - id: ostracismo-uscita
    titolo: Un altro argomento
    area: ostracismo
    requisiti: [recupero.ostracismo >= 15]
    luogo: Sottoponti
    immagine: ambientazione/ponti-sospesi
    sommario: "Sul ponte non si parla più di te. È il momento di tornare di sopra."
    testo: |
      Stamattina hai ascoltato il ponte per un'ora e il tuo nome non è passato nemmeno una volta. Nelle
      osterie adesso cantano del sale sparito dalla Casa dei Nodi. La città ha un altro argomento, e tu ti
      scopri quasi offes{o|a}.

      Mamma Tesh se n'è accorta prima di te. Ti ha lavato la camicia buona nel secchio della pioggia e l'ha
      stesa ad asciugare vicino al Capitano, così adesso sa un poco di fumo. «Be', è ora che torni di sopra»
      dice. «Scegli bene la scala, eh, che se ricadi quaggiù ricominci dal fondo del cerchio.»

      La scala di corda dietro il Mercato porta dritta al Ponte delle Mille Corde, in mezzo alla gente. Le
      funi dei carrettieri scendono fino alla Città Bassa, dove nessuno ti ha mai cantato una strofa. Con un
      invito per i Quartieri Alti puoi presentarti lassù vestit{o|a} di nuovo.

      {origine rampollo-dei-quartieri-alti} Lassù nessuno ti chiederà dove sei stat{o|a}, perché nei Quartieri
      Alti chi sparisce per qualche settimana è sempre stato in campagna. L'hai sentito dire anche tu di altri
      a cena.
    opzioni:
      - testo: "Risalire sul Ponte delle Mille Corde"
        descrizione: "In pieno giorno e a faccia scoperta, in mezzo ai banchi che ridevano di te."
        esito:
          titolo: A faccia scoperta
          immagine: ambientazione/ponti-sospesi
          testo: |
            Sbuchi da dietro il banco del venditore di funi a mezzogiorno, con la camicia pulita e le mani
            ancora nere di corda, e la luce ti colpisce gli occhi come un secchio d'acqua. Lui ti riconosce e
            apre la bocca, poi la richiude. Dopo le travi dei sottoponti il tavolato del ponte ti pare largo e
            fermo sotto i piedi. Attraversi il Mercato dei Nodi senza fretta, e nessuno intona la strofa delle
            osterie.
          imposta: { scandalo: 3, recupero.ostracismo: 0 }
          pe: { resilienza: 10 }
          vai: ponti-sospesi
      - testo: "Scendere per le funi fino alla Città Bassa"
        descrizione: "Le funi dei carrettieri calano fino alle rocce bluastre della Città Bassa. È una discesa lunga, ma in fondo nessuno ti aspetta."
        esito:
          titolo: Giù per le funi
          immagine: ambientazione/citta-bassa
          testo: |
            Ti cali lungo le funi dei carrettieri con i piedi incrociati sulla corda, come ti hanno insegnato
            sotto le travi. La fune è grossa quanto un polso e lucida di grasso nei tratti dove scorrono le
            carrucole. A metà discesa senti già i martelli della Città Bassa, e le mani non tremano più come
            la prima volta. La roccia è bluastra e calda sotto le suole, e quando la tocchi nessuno si volta a
            guardarti.
          imposta: { scandalo: 3, recupero.ostracismo: 0 }
          pe: { acrobazia: 10 }
          vai: citta-bassa
      - testo: "Presentarti ai Quartieri Alti"
        descrizione: "Con l'invito in tasca e un abito nuovo, ti fai vedere alle campane della sera come se non fossi mai sparit{o|a}."
        requisiti: [invito >= 1]
        esito:
          titolo: Alle campane della sera
          immagine: ambientazione/quartieri-alti
          testo: |
            Spendi quello che hai per un abito decente e sali ai Quartieri Alti all'ora delle campane della
            sera, quando tutti escono a farsi vedere. La stoffa nuova ha ancora le pieghe del banco del sarto,
            e il colletto ti gratta il collo a ogni saluto. Saluti per nome le persone che ti avevano chiuso
            la porta, e loro, colte di sorpresa, ti rispondono. Nessuno ti chiede dove sei stat{o|a}, e tu ti
            tieni le mani nere di corda dietro la schiena.
          imposta: { scandalo: 3, recupero.ostracismo: 0 }
          pe: { galateo: 10 }
          vai: quartieri-alti

  # ------------------------------------------------------------ carte della fascia 5–7

  - id: carta-sospetto-cassetta
    titolo: Una cassetta da tenere
    tipo: carta
    area: ovunque
    requisiti: [sospetto >= 5, sospetto < 8, pista.pelle < 6]
    immagine: personaggi/mauro-scrocco
    sommario: "Mauro Scrocco ha una cassetta da nascondere, e secondo lui la casa di chi è già sorvegliato è il posto più sicuro."
    testo: |
      Un garzone ti porta un invito di Mauro Scrocco, che ti riceve alla Pignatta Grassa con un bicchiere già
      versato. La sala è bassa e le travi del soffitto sono nere di fumo di cucina.

      «Lo sa mezza città che ti tengono d'occhio, {amico mio|amica mia}» dice facendo girare il vino. «Però
      una casa che la Caserma ha già rivoltato per un po' non la guarda più nessuno. Non c'è niente di più
      riposante, {amico mio|amica mia}.»

      Sotto il tavolo spinge verso di te con il piede una cassetta di legno chiusa con un lucchetto, da tenere
      qualche settimana senza aprirla e senza fare domande. Il legno è vecchio e segnato sui bordi, e il
      lucchetto è nuovo e ancora unto d'olio.
    opzioni:
      - testo: "Prendere la cassetta"
        descrizione: "Una buona ricompensa e la gratitudine degli Scuri. Se la Caserma bussa, però, la cassetta è in casa tua."
        esito:
          titolo: Sotto il pavimento
          testo: |
            Nascondi la cassetta sotto un'asse del pavimento, e rimetti i chiodi con il tacco dello stivale.
            Un chiodo resta storto e sporge appena, e ogni volta che ci passi sopra lo senti sotto la suola.
            La notte, quando giri nel letto, ti pare di sentirla. Due volte in una settimana incroci la stessa
            guardia all'angolo della tua strada, e la seconda volta ti saluta.

            Mauro ti manda le monete in un sacchetto di spezie, con un biglietto di ringraziamento scritto da
            un'altra mano. Per giorni le monete sanno di cannella.
          effetti: { monete: 15, rep.scuri: 0.5, sospetto: 1.5 }
      - testo: "Rimandare indietro la cassetta"
        descrizione: "Hai già abbastanza guardie alla porta. Mauro la prenderà male, anche se continuerà a chiamarti amico mio."
        esito:
          titolo: Gentilezza
          testo: |
            Spingi la cassetta indietro con il piede, e il legno raschia sul pavimento. «Peccato, {amico
            mio|amica mia}. Me lo segno, eh, che io mi segno tutto» dice Mauro. Poi sorride e ti riempie di
            nuovo il bicchiere fino all'orlo, così che tu non possa alzarlo senza versarlo. Ti accompagna fino
            alla porta tenendoti una mano sulla spalla, e parla d'altro per tutto il tragitto.
          effetti: { rep.scuri: -0.5 }
      - testo: "Pagare Mauro per un amico in Caserma"
        descrizione: "La cassetta resta a lui. In cambio Mauro conosce un sergente che perde volentieri le carte, a pagamento."
        requisiti: [monete >= 20]
        esito:
          titolo: Una carta persa
          testo: |
            Spingi la cassetta indietro e posi una borsa sul tavolo. Mauro la soppesa senza aprirla, e dal
            suono delle monete capisce il resto. «Questo sì che è parlare, {amico mio|amica mia}» dice. «Il
            sergente del turno di notte ha la memoria corta, se lo aiuti.» Nei giorni dopo la guardia
            all'angolo della tua strada non si vede più.
          effetti: { monete: -20, sospetto: -1 }

  - id: carta-sospetto-due-parole
    titolo: Due parole in Caserma
    tipo: carta
    area: ovunque
    requisiti: [sospetto >= 5, sospetto < 8]
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "Un vice-sceriffo ti propone di passare in Caserma a chiarire la tua posizione, finché sei in tempo."
    testo: |
      Un vice-sceriffo ti affianca per strada e cammina al tuo passo come se foste vecchi conoscenti. È
      giovane, ha l'armatura troppo lucida e parla guardando davanti a sé. Le cinghie di cuoio sono ancora
      rigide e scricchiolano a ogni passo.

      «Il tuo nome è sulla lista dello sceriffo, diciamo verso il fondo» dice. «Se passi in Caserma e rispondi
      a qualche domanda magari scende ancora, e se ci porti qualcosa di utile scende di sicuro.»

      All'angolo si ferma e ti lascia andare avanti da sol{o|a}. Sai dove trovarlo, e lui sa dove trovare te.
    opzioni:
      - testo: "Rispondere alle domande del sergente"
        descrizione: "Un'ora al banco della Caserma, a raccontare la tua versione senza contraddirti."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Più in basso nella lista
          testo: |
            Il sergente ti fa sedere e scrive mentre parli, con la lingua fra i denti. La penna gratta forte e
            ogni tanto buca la carta. A ogni risposta fa una domanda in più, e tu le reggi tutte con le mani
            ferme sulle ginocchia. Alla fine gira il foglio verso di te perché tu firmi, e intanto borbotta
            che almeno tu non gli hai fatto perdere tempo.
          effetti: { sospetto: -1 }
        fallimento:
          titolo: Una domanda di troppo
          testo: |
            Alla terza domanda ti contraddici su un orario, e il sergente se ne accorge subito. Ti senti il
            sudore freddo sotto le ascelle. Lui resta zitto e scrive più a lungo di quanto abbia parlato tu, e
            nella stanza si sente solo la penna. Esci dalla Caserma senza sapere se la tua posizione sia
            migliorata o peggiorata.
          effetti: { sospetto: 0.5 }
      - testo: "Portare qualche voce di vicolo"
        requisiti: [informazioni.voce >= 3]
        descrizione: "Tre voci raccolte in giro valgono qualcosa, per una Caserma che conta i passi degli Scuri."
        esito:
          titolo: Voci utili
          testo: |
            Il vice-sceriffo ascolta le tue voci in un angolo del cortile, annuendo a ognuna con la serietà di
            uno scolaro. Alle sue spalle la Guardia e i Raschiatori si addestrano insieme, e i colpi delle
            armi ti costringono ad alzare la voce. Due le conosceva già, e la terza lo fa sorridere fino alle
            orecchie. Ti riaccompagna al portone e ti dice che per un po', diciamo, non vedrai guardie sotto
            casa tua.
          effetti: { informazioni.voce: -3, sospetto: -1 }
      - testo: "Saldare le ammende arretrate"
        requisiti: [monete >= 30]
        descrizione: "Sul tuo foglio ci sono multe mai pagate. Chi salda tutto allo sportello torna in fondo alla lista."
        esito:
          titolo: Il registro pulito
          testo: |
            Allo sportello della Caserma un furiere conta le monete due volte e timbra ogni multa con un colpo
            secco che fa saltare il calamaio. Poi tira una riga sul tuo foglio e lo sposta in fondo alla pila.
            Il vice-sceriffo, che passa di lì per caso, ti fa un cenno con la testa e non si ferma.
          effetti: { monete: -30, sospetto: -2 }

  - id: carta-scandalo-farsa
    titolo: Una parte per te
    tipo: carta
    area: ovunque
    requisiti: [scandalo >= 5, scandalo < 8]
    immagine: personaggi/orazio-belcanto
    sommario: "Orazio Belcanto vuole mettere in scena la tua storia al Teatro delle Meraviglie. Paga bene, e ti offre anche la parte."
    testo: |
      Orazio Belcanto ti ferma in mezzo alla strada con tutte e due le mani, e ogni dito porta un anello. È
      l'impresario del Teatro delle Meraviglie e parla come se recitasse anche adesso.

      «La tua storia la conosce tutta la città, e la racconta male» dice. «È materia buona sprecata in bocca
      ai dilettanti. Io ne faccio una farsa in tre atti.»

      Ti mette in mano un biglietto profumato. La carta è spessa e bordata d'oro, e il profumo ti resta sulle
      dita per tutto il giorno. Paga chi gli porta i dettagli giusti, e il doppio a chi ha il coraggio di
      interpretare sé stesso.
    opzioni:
      - testo: "Raccontargli tutto"
        descrizione: "Una buona paga per i dettagli. Poi la città riderà di te a teatro, e con i dettagli giusti."
        esito:
          titolo: Tutto esaurito
          testo: |
            Orazio ti ascolta e prende appunti con una matita d'argento. Ride nei punti sbagliati e alla fine
            ti paga sull'unghia. Due settimane dopo la farsa è in cartellone, e per tutta la stagione si fa
            sempre il tutto esaurito. La sera della prima le risate si sentono fin dalla strada. Da allora la
            gente per strada ti saluta con le battute del secondo atto.
          effetti: { monete: 20, scandalo: 1.5 }
      - testo: "Recitare la tua parte"
        descrizione: "Salire sul palco del Teatro delle Meraviglie e fare di te stesso un personaggio."
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: Applausi
          testo: |
            Sul palco scopri che sai prenderti in giro meglio di chiunque altro. Le gambe ti tremano fino alla
            seconda battuta, poi smettono. Le lampade della ribalta ti scaldano la faccia e oltre la loro luce
            il pubblico è solo un rumore. Ride con te dall'inizio alla fine, e al terzo atto ti applaude.
            Orazio ti paga il doppio come promesso e, stringendoti le maniche con le dita inanellate, ti
            chiede se hai altre disgrazie da raccontare. La storia ormai gira lo stesso, ma adesso è una
            commedia.
          effetti: { monete: 40, scandalo: 1 }
        fallimento:
          titolo: Fischi
          testo: |
            A metà del primo atto dimentichi una battuta, e la bocca ti si asciuga di colpo. Dal buio oltre le
            lampade della ribalta non arriva un suggerimento. Il pubblico capisce che stai soffrendo davvero,
            e ride più forte che mai. Orazio ti paga lo stesso, perché la serata è stata un successo. «Ma che
            importa la battuta! Hanno visto una disgrazia vera, e quella non la recita nessuno!» esclama.
          effetti: { monete: 20, scandalo: 1.5 }
      - testo: "Comprargli la storia perché non la metta in scena"
        requisiti: [monete >= 30]
        descrizione: "Orazio vende tutto, anche il silenzio. Con un'altra farsa in cartellone la città riderà di qualcun altro."
        esito:
          titolo: Un'altra farsa
          testo: |
            Orazio conta le monete con le dita inanellate e sospira come se gli strappassi un figlio. Poi
            strappa il biglietto profumato e promette che la tua storia non salirà mai sul suo palco. I pezzi
            di carta cadono sul selciato e il profumo resta nell'aria ancora un poco. Il mese dopo in
            cartellone c'è la farsa di un consigliere che ha sposato due volte la stessa vedova, e la città
            ride di lui.
          effetti: { monete: -30, scandalo: -1 }

  - id: carta-scandalo-feriti
    titolo: Le cure pubbliche
    tipo: carta
    area: ovunque
    requisiti: [scandalo >= 5, scandalo < 8]
    immagine: fazioni/confraternita-del-velo
    sommario: "Il Velo cerca braccia per le cure pubbliche della Cattedrale. Una buona azione, sotto gli occhi di tutti."
    testo: |
      Sulla porta di una cappella è inchiodato un avviso della Confraternita del Velo, sopra altri fogli più
      vecchi che l'umidità ha gonfiato e scolorito. Padre Vantes cerca volontari per le cure pubbliche della
      settimana, quando la Cattedrale apre le porte a chi non può pagare un medico. Servono braccia per le
      barelle e monete per le bende.

      In fondo una riga aggiunta a mano, con un inchiostro più fresco del resto, avverte che i nomi dei
      volontari e dei benefattori saranno letti alla liturgia della sera, davanti a tutta la navata.

      {origine accolito-del-velo} Le cure pubbliche le conosci dalla parte delle barelle, e quella riga l'ha
      voluta qualcuno che conosce i fedeli meglio delle ferite. Un nome letto in navata porta più offerte di
      una predica.
    opzioni:
      - testo: "Portare le barelle"
        descrizione: "Una giornata intera fra i feriti, sotto gli occhi della città."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Facile }
        successo:
          titolo: Il tuo nome in navata
          testo: |
            Passi la giornata fra barelle e bacinelle, e l'acqua delle bacinelle è già rosa prima di
            mezzogiorno. Alla sera hai le maniche macchiate fino al gomito e le braccia che tremano quando
            alzi il cucchiaio. Un vecchio Raschiatore ti stringe la mano per averlo tenuto fermo mentre gli
            cucivano la gamba, con una stretta che ti fa male alle nocche. Alla liturgia leggono il tuo nome,
            e chi ti conosceva per la tua storia adesso ti conosce anche per questa.
          effetti: { scandalo: -1, rep.velo: 0.5 }
        fallimento:
          titolo: "Riconosciut{o|a}"
          testo: |
            A metà mattina una donna in fila ti riconosce e lo dice ad alta voce, indicandoti con il mento
            perché ha le mani occupate da un bambino. Per il resto del giorno i feriti ti guardano più di
            quanto guardino le sorelle. Finisci il lavoro comunque, con le maniche bagnate fino al gomito.
            Alla liturgia leggono il tuo nome, e dalla navata sale una risatina.
          effetti: { scandalo: 0.5 }
      - testo: "Pagare le bende"
        requisiti: [monete >= 25]
        descrizione: "Un'offerta generosa, e il tuo nome letto fra quelli dei benefattori."
        esito:
          titolo: Fra i benefattori
          testo: |
            Lasci l'offerta a una sorella con i capelli rasati, che la conta sull'abaco e scrive il tuo nome
            in un registro. Le palline dell'abaco sono di legno scuro e consumate lucide nel mezzo. Alla
            liturgia della sera il tuo nome viene letto fra quelli dei benefattori, subito dopo un mercante
            della Gilda che ha dato il doppio e che si volta a vedere chi sei.
          effetti: { monete: -25, scandalo: -1 }
      - testo: "Pagare un'intera giornata di cure"
        requisiti: [monete >= 40]
        descrizione: "Le bende e il pane per chi aspetta, tutto a tuo nome. Padre Vantes leggerà il tuo nome per primo."
        esito:
          titolo: Il primo nome
          testo: |
            Padre Vantes prende l'offerta con tutte e due le mani e ti chiede due volte come si scrive il tuo
            nome. Alla liturgia lo legge per primo, da solo, prima della lista dei benefattori, e la navata si
            volta a guardarti. Sotto la volta il tuo nome torna indietro dall'eco una seconda volta. Uscendo,
            una donna che ti indicava per strada ti stringe la mano.
          effetti: { monete: -40, scandalo: -2 }
