# Crisi del Sospetto e dello Scandalo, con le loro aree di penalità
# (Regolamento v0.4 §5 e integrazione): prigione (carcere interrato della Caserma)
# e ostracismo (i sottoponti, sotto i Ponti Sospesi). Più le carte della fascia 5–7.

aree:
  - id: prigione
    nome: Prigione
    immagine: ambientazione/guarnigione-di-qir-azel
    penalita: true
    testo: |
      Le celle della Caserma stanno al piano interrato, sotto il cortile dove
      la Guardia e i Raschiatori si addestrano, e gli ordini del sergente
      scendono fin qui dalle grate di sfiato. La tua cella misura quattro passi
      per tre, e la porta di quercia ha uno spioncino che si apre soltanto da
      fuori. In fondo al corridoio, sotto l'unica lanterna, il carceriere
      annota ogni sera nel registro la condotta dei detenuti. Si esce quando la
      Caserma decide che il tuo nome può tornare in strada.

  - id: ostracismo
    nome: Ostracismo
    immagine: ambientazione/ponti-sospesi
    penalita: true
    testo: |
      Sopra la tua testa passa il Ponte delle Mille Corde, e da quaggiù lo
      conosci per il rumore delle ruote sulle assi. In città il tuo nome è
      diventato una barzelletta, così sei sceso dove nessuno chiede chi sei.
      Fra le travi la gente ha teso reti e tavolati, e da uno all'altro si
      passa su passerelle larghe una spanna. Quaggiù conta se sai tenerti a
      una corda e se dividi quello che trovi, e per tornare di sopra ti serve
      che la città trovi un altro argomento.

quality:
  - { id: recupero.prigione, nome: Buona condotta, categoria: stato, descrizione: "Le righe buone che il carceriere ha scritto su di te nel registro del carcere. A quattro, la Caserma è pronta a lasciarti andare." }
  - { id: recupero.ostracismo, nome: Oblio, categoria: stato, descrizione: "Quanto la città si è dimenticata di te mentre vivevi sotto i Ponti. A quattro, puoi tornare di sopra." }
  - { id: debito.scuri, immagine: fazioni/scuri, nome: Debito con gli Scuri, categoria: stato, descrizione: "Gli Scuri ti hanno tirato fuori dal carcere della Caserma, e il tuo nome è finito nel registro dei favori da riscuotere che Rozalia Marga tiene per loro." }

storylet:
  # ------------------------------------------------------------ Sospetto

  - id: crisi-sospetto
    titolo: Il mandato
    tipo: crisi
    area: citta-bassa
    requisiti: [sospetto >= 8]
    immagine: personaggi/toren-galdrick
    sommario: "La Caserma ha scritto il tuo nome per intero su un foglio con il sigillo dello sceriffo."
    testo: |
      Li vedi prima che loro vedano te, e le gambe rallentano da sole. Due
      guardie della Caserma con il cappuccio di maglia sono ferme all'angolo
      della tua strada e guardano la tua porta.

      Il sergente che le comanda ti raggiunge prima che tu possa cambiare
      direzione. Ha in mano un foglio con il sigillo dello sceriffo Toren
      Galdrick, e sul foglio c'è il tuo nome per intero, seguito da due righe
      di motivi e da uno spazio bianco per quelli che troveranno. *Lo spazio
      bianco è la parte che ti piace meno.* Galdrick non arresta mai in fretta,
      e se un foglio esce dal suo ufficio la pratica è pronta.

      «La Caserma vuole sentirti oggi, e per oggi intendo prima di cena» dice
      il sergente, grattandosi il collo sotto il cappuccio. «Poi vedi tu.»

      {conoscenze-della-strada Facile} Quel «vedi tu» è un prezzo. Un sergente
      che vuole arrestarti non ti lascia il pomeriggio libero.

      {origine figlio-della-citta-bassa} In Città Bassa un foglio con quel
      sigillo l'hai visto arrivare a più di una porta, e chi lo riceveva
      spariva per un mese.

      A Qir-Azel un'accusa si può ancora far dimenticare, se sai a chi
      rivolgerti e che cosa sei disposto a perdere. Altrimenti, al piano
      interrato della Caserma c'è una cella libera.
    opzioni:
      - testo: "Pagare il sergente"
        costo: 0
        requisiti: [monete >= 80]
        descrizione: "Una tangente sostanziosa, perché il foglio finisca in fondo a un cassetto invece che sul tavolo dello sceriffo."
        esito:
          titolo: In fondo al cassetto
          testo: |
            Il sergente soppesa la borsa sul palmo come un fornaio pesa la pasta, poi
            piega il foglio in quattro e se lo infila nella giubba. «Le pratiche si
            perdono, vedi tu» dice. «I cassetti sono quelli che sono.»

            Le guardie all'angolo se ne vanno prima di sera. Lo sceriffo non sa
            niente, e ti conviene che resti così, perché Galdrick chi prova a
            comprarlo non lo dimentica.
          effetti: { monete: -80 }
          imposta: { sospetto: 4 }
      - testo: "Consegnare un nome degli Scuri"
        costo: 0
        quando: [pista.pelle < 6]
        descrizione: "Puoi dare alla Caserma il corriere che porta i cristalli non registrati dalla Pignatta al Mercato delle Ombre."
        esito:
          titolo: Un nome per un altro
          immagine: fazioni/scuri
          testo: |
            Dici il nome a bassa voce e aggiungi dove e quando trovarlo, e la
            bocca ti resta amara. Il sergente lo scrive nello spazio bianco e
            cancella il tuo con due righe dritte.

            Due sere dopo il corriere viene preso con il sacco addosso. Alla
            Pignatta Grassa Mauro Scrocco ha cominciato a chiedere chi l'abbia
            venduto, a voce così alta che lo sente mezza sala.
          effetti: { rep.scuri: -2, rep.caserma: 1 }
          imposta: { sospetto: 4 }
      - testo: "Consegnare un nome degli ultimi Scuri"
        costo: 0
        quando: [pista.pelle >= 6]
        descrizione: "Dopo il rogo della Pignatta qualcuno porta ancora cristalli al Mercato delle Ombre, e la Caserma vuole anche lui."
        esito:
          titolo: Un nome per un altro
          immagine: fazioni/scuri
          testo: |
            Dici il nome e aggiungi dove e quando trovarlo. È un ricettatore che
            dopo il rogo della Pignatta ha continuato a passare cristalli al Mercato
            delle Ombre, come se nessuno gli avesse detto che Mirko Vesh è morto. Il
            sergente lo scrive nello spazio bianco e cancella il tuo. Due sere dopo
            lo prendono con il sacco addosso, e al Mercato chi vende ti guarda le
            mani prima della faccia.
          effetti: { rep.scuri: -2, rep.caserma: 1 }
          imposta: { sospetto: 4 }
      - testo: "Bruciare il tuo contatto nell'ombra"
        costo: 0
        quando: [fazione.scuri < 3]
        requisiti: [contatto-ombra >= 1]
        descrizione: "Dai alla Caserma la porta per il Mercato delle Ombre. Chi te l'ha insegnata non vorrà più vederti."
        esito:
          titolo: Una porta murata
          immagine: ambientazione/mercato-delle-ombre
          testo: |
            Descrivi al sergente la porta e il colpo da battere, e lui prende nota
            con una calligrafia rotonda da scolaro e ti fa firmare in fondo alla
            pagina.

            Una settimana dopo trovi la porta murata con mattoni ancora freschi.
            L'uomo che ti aveva insegnato la strada non si fa più trovare, e in
            Città Bassa dicono che il Mercato ha già cambiato stanza.
          effetti: { contatto-ombra: -1 }
          imposta: { sospetto: 4 }
      - testo: "Seguire il sergente in Caserma"
        costo: 0
        quando: [pista.pelle < 4]
        descrizione: "Nessun accordo e nessun nome. Scendi nelle celle e aspetti che la Caserma si stanchi di te."
        esito:
          titolo: Il piano interrato
          testo: |
            Il sergente ti accompagna fino al portone della Caserma, nei Quartieri
            Alti. Al banco ti tolgono la cintura e i lacci degli stivali, e un uomo
            massiccio con il naso rotto più volte e un grembiule di cuoio sopra la
            divisa ti porta giù nelle celle, mentre tu ti tieni i calzoni con una
            mano. Dallo spioncino ti guarda un momento e dice che si chiama Borso.
          vai: prigione
      - testo: "Seguire il sergente in Caserma"
        costo: 0
        quando: [pista.pelle >= 4]
        descrizione: "Nessun accordo e nessun nome. Scendi nelle celle e aspetti che la Caserma si stanchi di te."
        esito:
          titolo: Il piano interrato
          testo: |
            Al banco della Caserma ti tolgono la cintura e i lacci degli stivali, e
            il carceriere nuovo, un uomo anziano con un ginocchio rigido, ti porta
            giù nelle celle e prova tre chiavi prima di trovare quella della tua
            porta. Dallo spioncino ti spiega, senza cattiveria, che da quando le
            chiavi vecchie se ne sono andate con Borso qui sotto si conta tutto due
            volte.
          vai: prigione

  - id: prigione-cortile
    titolo: I secchi del cortile
    area: prigione
    ripetibile: true
    luogo: Cortile della Caserma
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "All'alba il carceriere fa lavorare nel cortile chi vuole una riga buona nel registro."
    testo: |
      All'alba il carceriere mette in fila i detenuti nel corridoio. Chi vuole
      lavora nel cortile finché le reclute non hanno finito l'addestramento, e
      chi lavora bene si guadagna una riga buona nel registro. Oggi bisogna
      portare l'acqua agli abbeveratoi delle stalle, un secchio per mano.
      Dragna Gro-Malog, appoggiata al muro con i fogli dei turni, non ti degna
      di un'occhiata.

      {origine apprendista-raschiatore} Il tuo nome l'ha scritto lei sui fogli
      dei turni più di una volta, e il suo silenzio può essere un favore
      oppure un giudizio.
    opzioni:
      - testo: "Portare i secchi fino all'ultima campana"
        descrizione: "Il lavoro è lungo, e il carceriere conta i viaggi."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Facile }
        successo:
          titolo: Una riga buona
          testo: |
            Porti l'ultimo secchio mentre suona la campana e le reclute rompono le
            righe, con le dita che restano piegate a uncino sui manici. La recluta
            con la calza nell'elmo ti fa un cenno col mento da collega, e il
            carceriere scrive qualcosa nel registro.
          effetti: { recupero.prigione: 1 }
        fallimento:
          titolo: Sugli stivali
          testo: |
            A metà mattina un secchio ti scivola e si rovescia sugli stivali di
            una recluta, che ti insulta davanti a tutto il cortile. Finisci il
            turno lo stesso, e la riga nel registro, oggi, è più corta.
          effetti: { recupero.prigione: 0.5 }

  - id: prigione-borso
    titolo: La scatola di latta
    area: prigione
    ripetibile: true
    requisiti: [pista.pelle < 4]
    luogo: Carcere della Caserma
    immagine: personaggi/borso
    sommario: "La sera Borso conta le monete in una scatola di latta, al tavolo in fondo al corridoio."
    testo: |
      La sera Borso siede al tavolo, tira fuori una scatola di latta e conta
      le monete impilandole per dieci. Le conta due volte e le rimette via,
      senza spenderle mai. In fondo al corridoio Karn, un tagliagole degli
      Scuri, smette di fischiare appena sente tintinnare le monete.

      {conoscenze-della-strada Media} Karn ascolta perché qualcuno fuori gli
      ha chiesto di farlo.

      {origine fuggiasco-di-ghoran} Le spalle curve a fare da muro sulle
      monete le hai viste nei recinti di Ghoran.

      È il momento in cui Borso è più disposto ad ascoltare, e quello che
      pensa di te finisce nel registro.
    opzioni:
      - testo: "Parlargli attraverso lo spioncino"
        descrizione: "Borso non è un uomo di conversazione. Devi trovare le parole giuste, e poche."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Ghoran
          testo: |
            Della scatola non gli chiedi niente. Gli domandi di dove viene, e dopo un
            lungo silenzio Borso nomina Ghoran, a voce bassa.

            {empatia Media} Ha detto Ghoran come si dice il nome di un morto in
            famiglia, e qualcuno di suo, laggiù, c'è ancora.

            La mattina dopo nella scodella c'è un pezzo di pane in più, e nel
            registro, alla tua voce, Borso ha scritto *tranquillo*.
          effetti: { recupero.prigione: 1 }
        fallimento:
          titolo: Lo spioncino
          testo: |
            Borso ti lascia parlare un poco, poi si alza, viene fino alla tua
            porta e chiude lo spioncino senza una parola. Lo senti ricominciare a
            contare dall'inizio. Quella sera nel registro, alla tua voce, non
            compare nessuna riga nuova.
          effetti: { recupero.prigione: 0.5 }

  - id: prigione-il-carceriere-nuovo
    titolo: Il carceriere nuovo
    area: prigione
    ripetibile: true
    requisiti: [pista.pelle >= 4]
    luogo: Carcere della Caserma
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "Dopo la fuga di Borso le chiavi le tiene un sergente anziano che la sera ripara cinghie."
    testo: |
      Da quando Borso è scappato, le chiavi del carcere le tiene un sergente
      anziano tolto dalle mura per un ginocchio rigido. La sera siede al tavolo
      con il registro aperto accanto e il ginocchio alzato su uno sgabello, e
      ripara le cinghie degli elmi con lo spago cerato.

      {medicina Media} Il ginocchio è gonfio sopra la rotula, e un'umidità come
      questa per lui è una condanna più lunga della tua.

      *Uno che lavora fino a tardi senza che nessuno glielo chieda ha voglia di
      parlare.* Quello che pensa di te finisce nel registro.
    opzioni:
      - testo: "Parlargli attraverso lo spioncino"
        descrizione: "Il sergente lavora piano e ascolta volentieri, se trovi l'argomento giusto."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il ginocchio
          testo: |
            Gli chiedi del ginocchio, e lui ti racconta di una scala delle mura
            gelata e di un cerusico che voleva tagliare, senza smettere di cucire.
            La mattina dopo nella scodella c'è un pezzo di pane in più, e nel
            registro, alla tua voce, ha scritto *ragionevole*.
          effetti: { recupero.prigione: 1 }
        fallimento:
          titolo: Lo spago
          testo: |
            Il sergente ti ascolta un po' con il punteruolo a mezz'aria, poi ti dice
            con la cortesia stanca di un nonno che a quest'ora le chiacchiere gli
            fanno sbagliare i punti. Quella sera nel registro, alla tua voce, non
            compare nessuna riga nuova.
          effetti: { recupero.prigione: 0.5 }

  - id: prigione-verbale
    titolo: Il verbale d'accusa
    area: prigione
    ripetibile: true
    luogo: Carcere della Caserma
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "Prima dell'interrogatorio il sergente ti lascia leggere il verbale. Se ci trovi un errore, la tua pratica si accorcia."
    testo: |
      Un vice-sceriffo ti lascia il verbale d'accusa per un'ora prima
      dell'interrogatorio. Sono quattro fogli fitti nella lingua di
      scartoffie della Gilda, dove nessuno va da nessuna parte e tutti *si
      recano*, con le ore e i luoghi firmati dalle guardie che ti hanno
      visto.

      {politica-ed-economia Media} Molte accuse sono lì per fare numero nel
      rendiconto che lo sceriffo porta al Consiglio.

      {origine allievo-di-torvessa} All'Accademia hai passato notti su
      trattati scritti peggio di questo.

      Chi ha scritto queste accuse aveva fretta, e uno scrivano che ha fretta
      sbaglia.
    opzioni:
      - testo: "Cercare le contraddizioni"
        descrizione: "Confrontare le ore con i luoghi e le firme con i turni di guardia, finché qualcosa non torna."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Un'ora di troppo
          testo: |
            Al terzo foglio, con la candela ridotta a un dito, trovi una guardia che
            ti vede sul Ponte delle Mille Corde alla stessa ora in cui un'altra,
            dello stesso turno, ti mette in Città Bassa. All'interrogatorio lo fai
            notare con calma, e il vice-sceriffo, dopo aver riletto due volte
            muovendo le labbra, sfila il terzo foglio e se lo mette in tasca.
          effetti: { recupero.prigione: 1 }
        fallimento:
          titolo: La lingua delle scartoffie
          testo: |
            Fra i commi e le formule ti perdi prima della fine del primo foglio, e
            ogni *suddetto* ti rimanda indietro. All'interrogatorio rispondi a tutto
            senza sbagliare e senza guadagnare terreno.
          effetti: { recupero.prigione: 0.5 }

  - id: prigione-uscita
    titolo: La porta di quercia
    area: prigione
    requisiti: [recupero.prigione >= 4, pista.pelle < 4]
    luogo: Carcere della Caserma
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "La Caserma è pronta a lasciarti andare, e non sei il solo a saperlo."
    testo: |
      Stamattina Borso ti ha detto che la tua pratica è arrivata in fondo. Per
      uscire serve la firma di qualcuno che risponda di te, oppure qualche
      giorno di lavoro sui Ponti, dove la Caserma presta i detenuti ai Custodi
      di Passaggio per riparare le corde. «Firma o braccia» ha riassunto. Chi
      ha un invito per i Quartieri Alti può uscire dal portone principale dopo
      aver firmato la promessa di buona condotta nell'ufficio dello sceriffo.

      Con il rancio è arrivato un biglietto senza firma, con una pentola
      panciuta disegnata in un angolo. Alla Pignatta Grassa sanno sempre chi
      sta per uscire.

      {percezione Media} Il biglietto è passato per le mani di chi porta il
      rancio, quindi gli Scuri, qui sotto, hanno almeno un paio di mani.

      {origine rampollo-dei-quartieri-alti} Una promessa di buona condotta
      firmata nell'ufficio dello sceriffo, in famiglia, la leggerebbero come un
      necrologio.
    opzioni:
      - testo: "Presentarti allo sceriffo"
        descrizione: "Firmi davanti a Toren Galdrick la promessa di buona condotta ed esci dal portone principale, nei Quartieri Alti."
        quando: [galdrick.via == 0]
        requisiti: [invito >= 1]
        esito:
          titolo: Il portone principale
          immagine: personaggi/toren-galdrick
          testo: |
            Lo sceriffo è un uomo imponente, con la pelle scura e la testa rasata, e
            parla lentamente, scegliendo ogni parola come se dovesse pagarla. Ti
            guarda firmare la promessa.

            «Il tuo nome resta nelle mie carte» dice mentre ripone la penna. «Vedi di
            non darmi motivo di rileggerle.»

            Fuori la luce dei Quartieri Alti, dopo tanti giorni di celle, ti fa
            lacrimare gli occhi.
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { galateo: 10 }
          vai: quartieri-alti
      - testo: "Firmare davanti al sergente di turno"
        descrizione: "Con lo sceriffo a Ghoran firmi davanti al sergente di turno, ed esci dal portone principale nei Quartieri Alti."
        quando: [galdrick.via == 1]
        requisiti: [invito >= 1]
        esito:
          titolo: Il portone principale
          immagine: ambientazione/guarnigione-di-qir-azel
          testo: |
            Il sergente di turno ti riceve in piedi nell'ufficio dello sceriffo,
            perché sulla sedia di Galdrick nessuno si siede finché lui è a Ghoran,
            e ti guarda firmare la promessa di buona condotta.

            «Lo sceriffo, quando torna, rilegge tutto» dice, soffiando
            sull'inchiostro. «Vedi di non dargli motivo di fermarsi sul tuo nome.»

            Fuori la luce dei Quartieri Alti, dopo tanti giorni di celle, ti fa
            lacrimare gli occhi.
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { galateo: 10 }
          vai: quartieri-alti
      - testo: "Farti tirare fuori dagli Scuri"
        descrizione: "Rispondi al biglietto della Pignatta. Gli Scuri sanno farti uscire senza firmare niente, e poi se lo ricordano."
        esito:
          titolo: Un ordine con il sigillo giusto
          immagine: personaggi/rozalia-marga
          testo: |
            La notte dopo una guardia sconosciuta apre la tua cella con un ordine
            di scarcerazione falsificato alla perfezione, che accanto al timbro
            porta un'impronta di pollice piccola, di dita sottili. Esci dalla
            porta delle cucine e scendi in Città Bassa. Alla Pignatta Grassa Mauro
            Scrocco ti versa da bere gratis e ti dice che adesso il tuo nome sta
            in un registro che Rozalia tiene molto in ordine.
          effetti: { rep.scuri: 1, debito.scuri: 1 }
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { conoscenze-della-strada: 10 }
          vai: citta-bassa
      - testo: "Scontare il resto sui Ponti"
        descrizione: "Qualche giorno a riparare corde per i Custodi di Passaggio sotto gli occhi di una guardia, poi sei libero."
        esito:
          titolo: Corde nuove
          immagine: ambientazione/ponti-sospesi
          testo: |
            Per cinque giorni sostituisci le funi sotto il Ponte delle Mille
            Corde, appeso a un'imbracatura, mentre una guardia fuma sulla
            piattaforma. Il Custode di Passaggio che dirige i lavori riconosce dal
            cigolio una corda che cederà, e alla fine lo impari anche tu. Le prime
            notti dormi con i palmi rivolti all'aria. L'ultimo giorno la guardia
            ti restituisce la cintura e torna in Caserma senza voltarsi.
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { atletica: 10 }
          vai: ponti-sospesi

  # La stessa uscita dopo la fuga di Borso con le chiavi della Caserma (pista.pelle >= 4): un carceriere nuovo,
  # Galdrick tornato da Ghoran, e il biglietto della Pignatta solo finché la Pignatta c'è (pista.pelle < 6).
  - id: prigione-uscita-chiavi-nuove
    titolo: La porta di quercia
    area: prigione
    requisiti: [recupero.prigione >= 4, pista.pelle >= 4]
    luogo: Carcere della Caserma
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "Il registro del carceriere è pieno di righe buone, e la Caserma è pronta a lasciarti andare."
    testo: |
      Stamattina il carceriere nuovo, dopo averla cercata su tre pagine
      sbagliate, ti ha detto che la tua pratica è arrivata in fondo. Per uscire
      serve la firma di qualcuno che risponda di te, oppure qualche giorno di
      lavoro sui Ponti, dove la Caserma presta i detenuti ai Custodi di
      Passaggio per riparare le corde. «Firma o braccia» ha riassunto. «Con
      Borso si faceva così.» Chi ha un invito per i Quartieri Alti può uscire
      dal portone principale dopo aver firmato la promessa di buona condotta
      davanti allo sceriffo, che adesso le uscite le firma tutte di persona.

      Da quando le chiavi vecchie se ne sono andate con Borso, il fabbro della
      Caserma cambia una serratura al giorno.

      {tecnologia Media} Le serrature nuove sono a tre leve. Una al giorno,
      però, vuol dire che per un mese qualche porta resta quella di prima.
    opzioni:
      - testo: "Presentarti allo sceriffo"
        descrizione: "Firmi davanti a Toren Galdrick la promessa di buona condotta ed esci dal portone principale, nei Quartieri Alti."
        requisiti: [invito >= 1]
        esito:
          titolo: Il portone principale
          immagine: personaggi/toren-galdrick
          testo: |
            Lo sceriffo non si alza dalla scrivania. Accanto al calamaio c'è un
            anello di ferro vuoto, di quelli che reggono le chiavi, e ogni tanto ci
            posa sopra la mano.

            Ti guarda firmare la promessa. «Il tuo nome resta nelle mie carte» dice.
            «Vedi di non darmi motivo di rileggerle.»

            Fuori la luce dei Quartieri Alti, dopo tanti giorni di celle, ti fa
            lacrimare gli occhi.
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { galateo: 10 }
          vai: quartieri-alti
      - testo: "Farti tirare fuori dagli Scuri"
        descrizione: "Con il rancio è arrivato un biglietto della Pignatta. Gli Scuri hanno le chiavi vecchie della Caserma."
        quando: [pista.pelle < 6]
        esito:
          titolo: Le chiavi vecchie
          immagine: personaggi/rozalia-marga
          testo: |
            La notte dopo la tua porta si apre, e sulla soglia c'è una guardia
            sconosciuta con al polso un anello di chiavi vecchie. La tua serratura
            il fabbro non ha fatto in tempo a cambiarla. Scendi in Città Bassa
            dalla porta delle cucine. Alla Pignatta Grassa Mauro Scrocco ti versa
            da bere e ti dice che il tuo nome sta in un registro che Rozalia tiene
            in ordine.
          effetti: { rep.scuri: 1, debito.scuri: 1 }
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { conoscenze-della-strada: 10 }
          vai: citta-bassa
      - testo: "Scontare il resto sui Ponti"
        descrizione: "Qualche giorno a riparare corde per i Custodi di Passaggio sotto gli occhi di una guardia, poi sei libero."
        esito:
          titolo: Corde nuove
          immagine: ambientazione/ponti-sospesi
          testo: |
            Per cinque giorni sostituisci le funi sotto il Ponte delle Mille
            Corde, appeso a un'imbracatura, mentre una guardia fuma sulla
            piattaforma. Il Custode di Passaggio che dirige i lavori riconosce dal
            cigolio una corda che cederà, e alla fine lo impari anche tu. Le prime
            notti dormi con i palmi rivolti all'aria. L'ultimo giorno la guardia
            ti restituisce la cintura e torna in Caserma senza voltarsi.
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { atletica: 10 }
          vai: ponti-sospesi

  # ------------------------------------------------------------ Scandalo

  - id: crisi-scandalo
    titolo: Il tuo nome sul ponte
    tipo: crisi
    area: citta-bassa
    requisiti: [scandalo >= 8]
    immagine: ambientazione/mercato-dei-nodi
    sommario: "Il tuo nome passa di bocca in bocca per tutta Qir-Azel, e a ogni passaggio la storia si allunga."
    testo: |
      Te ne accorgi al Mercato dei Nodi, quando il venditore di funi ti dice il
      prezzo e poi lo ripete più forte perché lo sentano anche i banchi vicini.
      Da qualche giorno il tuo nome gira per Qir-Azel insieme alle tue ultime
      figuracce. Nelle osterie della Città Bassa ci hanno fatto sopra una
      strofa, e nei Quartieri Alti la raccontano a cena, abbassando la voce quel
      tanto che basta perché i domestici la sentano lo stesso.

      {espressivita Media} La strofa, a essere onesti, è ben fatta, con una rima
      interna sul tuo nome che ti sarebbe piaciuta, se il nome fosse stato di un
      altro.

      Le porte hanno cominciato a chiudersi. Il fornitore che ti faceva credito
      ha cambiato idea, e una lettera che aspettavi è tornata indietro con il
      sigillo intatto.

      {origine mercante-dei-ponti} Ai Ponti il credito è la prima cosa che se ne
      va e l'ultima che torna, e dal tuo banco l'hai negato anche tu.

      Una storia così si spegne in fretta se la città trova qualcosa di meglio
      da raccontare, o se ci si mette a tavola la gente giusta, e qualcuno che
      ti stima può anche metterci la faccia per te. Chi non ha niente da
      spendere sparisce sotto i Ponti Sospesi e aspetta che la città si
      dimentichi.
    opzioni:
      - testo: "Offrire cene e regali"
        costo: 0
        requisiti: [monete >= 60]
        descrizione: "Una bella somma spesa in cene e regali, finché chi rideva di te non si ritrova tuo ospite."
        esito:
          titolo: Il conto delle cene
          testo: |
            Per sette giorni inviti a cena, una alla volta, le persone che
            parlavano di te, e a chi non accetta mandi una bottiglia buona. Chi ha
            bevuto il tuo vino fa fatica a ridere di te il giorno dopo. Il conto è
            salato, ma la strofa delle osterie si canta sempre meno e il fornitore
            ti ha rimandato un biglietto molto cortese.
          effetti: { monete: -60 }
          imposta: { scandalo: 4 }
      - testo: "Dare in pasto un pettegolezzo migliore"
        costo: 0
        requisiti: [informazioni.pettegolezzo >= 2]
        descrizione: "Due pettegolezzi verificati nei posti giusti. La città ha bisogno di una storia, e può anche non essere la tua."
        esito:
          titolo: Un'altra storia
          testo: |
            Scegli con cura a chi raccontarle, la lavandaia del Mercato per i Ponti e
            il barbiere per la Città Bassa. Nel giro di tre giorni al Mercato dei Nodi
            non si parla d'altro, e il tuo nome smette di girare. Ti resta addosso la
            sensazione di chi ha spostato un peso sulle spalle di un vicino.
          effetti: { informazioni.pettegolezzo: -2 }
          imposta: { scandalo: 4 }
      - testo: "Chiedere al Velo di coprirti"
        costo: 0
        requisiti: [rep.velo >= 1]
        descrizione: "Padre Vantes può farsi vedere al tuo fianco sulla scalinata della Cattedrale. La Confraternita non dimentica i favori."
        esito:
          titolo: Una mano sul braccio
          immagine: personaggi/padre-vantes
          testo: |
            Dopo la funzione della sera Padre Aurelio Vantes scende con te i
            gradini della Cattedrale davanti alla folla che esce, con la mano sul
            tuo braccio per tutta la scalinata, e ti parla come a un fedele di
            vecchia data. Senti gli sguardi cambiare idea, e in città non serve
            altro. Alla Cattedrale però ogni favore finisce negli archivi di
            Ottilia Sanvel, e il tuo adesso è scritto lì.
          effetti: { rep.velo: -2 }
          imposta: { scandalo: 4 }
      - testo: "Chiedere alla Gilda di coprirti"
        costo: 0
        requisiti: [rep.gilda >= 1]
        descrizione: "Un funzionario della Gilda può accompagnarti per il Mercato e garantire che i tuoi conti sono in ordine."
        esito:
          titolo: I conti in ordine
          immagine: fazioni/gilda-dei-mercanti
          testo: |
            Il funzionario della Casa dei Nodi, con due manicotti di tela sopra le
            maniche di seta, ti accompagna lungo il Mercato a metà mattina e si
            ferma da ogni mercante che ti ha negato credito per ricordargli, con
            la cortesia della Gilda, che i tuoi conti sono in regola. Il credito
            torna, ma la Casa dei Nodi registra ogni favore che fa, e adesso ne ha
            uno a tuo nome.
          effetti: { rep.gilda: -2 }
          imposta: { scandalo: 4 }
      - testo: "Chiedere ai Castaldi di coprirti"
        costo: 0
        requisiti: [rep.castaldi >= 1]
        descrizione: "Marella Castaldi decide chi siede alle cene del Maniero, e un posto a quella tavola chiude molte bocche."
        esito:
          titolo: Un posto a tavola
          immagine: personaggi/marella-castaldi
          testo: |
            Marella Castaldi ti fa sedere alla cena del giorno di consiglio, due
            posti più in là della Rappresentante, al posto degli amici di
            famiglia, e non accenna mai alla tua storia. Congedandoti, ti ricorda
            senza sorridere che a quella tavola si parla di Stato e mai dei
            Castaldi, e che da stasera tu sei una faccenda dei Castaldi.
          effetti: { rep.castaldi: -2 }
          imposta: { scandalo: 4 }
      - testo: "Chiedere alla Maison di coprirti"
        costo: 0
        requisiti: [rep.maison >= 1]
        descrizione: "Nerissa Dalvane conosce i pettegolezzi di mezza città e sa correggerli, ma la discrezione della Maison ha un prezzo."
        esito:
          titolo: La versione della Maison
          immagine: personaggi/nerissa-dalvane
          testo: |
            Nerissa Dalvane ti ascolta nel salotto rosso della Maison des Lunes
            girando il cucchiaino nella tazza, poi ti dice che la tua storia ha un
            buco e che la gente dimentica volentieri quello che non torna. Presto
            i clienti della Maison ne raccontano una versione più noiosa e più
            credibile. Nerissa non ti chiede niente in cambio. Il tuo nome, però,
            è finito fra quelli che le devono qualcosa.
          effetti: { rep.maison: -2 }
          imposta: { scandalo: 4 }
      - testo: "Sparire sotto i Ponti"
        costo: 0
        descrizione: "Niente da spendere e nessuno che ti copra. Scendi fra le travi e aspetti che la città cambi argomento."
        esito:
          titolo: Fra le travi
          testo: |
            Scendi per una scala di corda dietro un banco del Mercato dei Nodi,
            dove nessun Custode guarda. Sotto le assi c'è un'altra città fatta di
            reti e di tela cerata, e il vento della Cicatrice ti arriva addosso
            senza niente che lo fermi. Una donna seduta davanti a un braciere ti
            fa segno di sederti, e qui nessuno ha sentito la strofa delle osterie.
          vai: ostracismo

  - id: ostracismo-reti
    titolo: Le reti sotto il Mercato
    area: ostracismo
    ripetibile: true
    luogo: Sottoponti
    immagine: ambientazione/mercato-dei-nodi
    sommario: "Sotto il Mercato dei Nodi le reti raccolgono quello che cade dai banchi. Chi ci arriva prima se lo tiene."
    testo: |
      Sotto il Mercato dei Nodi gli abitanti dei sottoponti hanno teso reti fra
      una trave e l'altra, e ci finisce dentro quello che cade dai banchi,
      dalle mele ammaccate alle monete. Per arrivarci bisogna camminare sulle
      travi con le braccia larghe. Chi riporta qualcosa lo divide con il
      braciere comune e si guadagna un posto più vicino al fuoco.

      {acrobazia Media} La parte buona della trave è quella più scura, ancora
      unta di catrame.

      {origine figlio-del-circolo} Nel Bosco di Velthar hai camminato su rami
      più stretti di queste travi, con il muschio sotto invece della Cicatrice.
    opzioni:
      - testo: "Camminare fino alle reti"
        descrizione: "Una trave, il vento di traverso e niente sotto per un bel tratto."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Facile }
        successo:
          titolo: Un sacco pieno
          testo: |
            Nella rete più lontana trovi una forma di formaggio quasi intera, con
            l'impronta di un morso di topo su un fianco. Al braciere qualcuno ti
            fa posto senza che tu debba chiederlo.
          effetti: { recupero.ostracismo: 1 }
        fallimento:
          titolo: Mezza trave
          testo: |
            A metà trave una raffica ti piega sulle ginocchia, e resti aggrappato
            con le unghie piantate nel catrame finché non passa. Torni con le mani
            vuote, e al braciere qualcuno ti passa lo stesso una mela ammaccata.
          effetti: { recupero.ostracismo: 0.5 }

  - id: ostracismo-braciere
    titolo: Il braciere di Mamma Tesh
    area: ostracismo
    ripetibile: true
    luogo: Sottoponti
    immagine: ambientazione/ponti-sospesi
    sommario: "La sera, intorno al braciere di Mamma Tesh, ognuno paga il suo posto con una storia o con un favore."
    testo: |
      Sulla piattaforma più larga dei sottoponti, riparata da un pilone del
      Ponte delle Mille Corde, Mamma Tesh tiene acceso un braciere ricavato da
      un vecchio elmo rovesciato, che chiama il Capitano e rimprovera quando fa
      troppo fumo. È una donna piccola, con le mani annerite. La sera ognuno
      paga il suo posto intorno al fuoco portando legna o notizie da sopra, e
      chi non porta niente si siede più lontano, dove il vento della Cicatrice
      arriva pieno.

      {resistenza Facile} Più lontano vuol dire due passi, e quaggiù due passi
      sono la differenza fra dormire e restare svegli a tremare.
    opzioni:
      - testo: "Guadagnarti un posto vicino al fuoco"
        descrizione: "Raccontare bene una storia, oppure sapere a chi chiedere quello che manca."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, espressivita], difficolta: Media }
        successo:
          titolo: Vicino al fuoco
          testo: |
            Racconti come sei finito quaggiù, in modo da far ridere anche te, con la
            tua faccia peggiore nel punto giusto. Mamma Tesh ride più forte di tutti,
            mostrando i tre denti che le restano, e batte la mano sull'asse accanto a
            sé. «Qua, qua, che il Capitano scalda meglio da questa parte» dice. Nei
            giorni seguenti la gente dei sottoponti ti saluta per nome.
          effetti: { recupero.ostracismo: 1 }
        fallimento:
          titolo: In fondo al cerchio
          testo: |
            La storia ti esce storta, e a metà nessuno ascolta più. Resti in fondo
            al cerchio, dove il calore arriva appena, ma Mamma Tesh ti passa la
            scodella per ultimo, piena come quella degli altri.
          effetti: { recupero.ostracismo: 0.5 }

  - id: ostracismo-assi
    titolo: Quello che passa fra le assi
    area: ostracismo
    ripetibile: true
    luogo: Sottoponti
    immagine: ambientazione/ponti-sospesi
    sommario: "Dal sottoponte si sente tutto quello che si dice sul Ponte delle Mille Corde. Anche di te."
    testo: |
      Se ti stendi su un tavolato proprio sotto il Ponte delle Mille Corde, fra
      le fessure larghe un dito passa ogni parola che si dice di sopra, dai
      prezzi del Mercato ai pettegolezzi che le serve dei Quartieri Alti si
      scambiano fermandosi sempre sull'unica asse che non scricchiola. Ogni
      tanto passa anche il tuo nome. Ascoltando con pazienza puoi capire chi
      continua a raccontare la tua storia e quando la gente comincia a
      stancarsene.
    opzioni:
      - testo: "Ascoltare il ponte"
        descrizione: "Distinguere le voci, ricordare chi dice cosa e seguire la tua storia mentre si consuma."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Un'altra storia di sopra
          testo: |
            Dopo mezza giornata sul tavolato, con la schiena indolenzita e un ragno
            che ti ha scelto come casa, hai capito che la tua storia la tiene viva un
            solo venditore di funi. Da ieri sul ponte si parla soprattutto di un
            carico di sale sparito dai magazzini della Casa dei Nodi, e il tuo nome
            passa sempre più di rado.
          effetti: { recupero.ostracismo: 1 }
        fallimento:
          titolo: Voci confuse
          testo: |
            Il vento copre metà delle parole e i carretti l'altra metà. Senti il
            tuo nome un paio di volte senza capire chi lo dice né in che tono, e
            ogni volta immagini il peggio.
          effetti: { recupero.ostracismo: 0.5 }

  - id: ostracismo-uscita
    titolo: Un altro argomento
    area: ostracismo
    requisiti: [recupero.ostracismo >= 4]
    luogo: Sottoponti
    immagine: ambientazione/ponti-sospesi
    sommario: "Sul ponte non si parla più di te. È il momento di tornare di sopra."
    testo: |
      Stamattina hai ascoltato il ponte e il tuo nome non è passato nemmeno una
      volta. Nelle osterie cantano una strofa nuova sul sale sparito dalla Casa
      dei Nodi, e il venditore di funi ha trovato un altro cliente da prendere
      in giro, tanto che ti scopri quasi offeso.

      Mamma Tesh se n'è accorta prima di te, e ti ha lavato la camicia buona.
      «Di sopra si torna una volta sola» dice, «quindi scegli bene la scala, che
      qua, se torni, ricominci dal fondo del cerchio.»

      Per risalire c'è la scala di corda dietro il Mercato, oppure ci sono le
      funi dei carrettieri, che scendono fino alla Città Bassa. Con un invito
      per i Quartieri Alti puoi anche presentarti lassù vestito di nuovo.

      {origine rampollo-dei-quartieri-alti} Nei Quartieri Alti chi sparisce per
      qualche settimana è sempre stato in campagna, e nessuno chiede altro.
    opzioni:
      - testo: "Risalire sul Ponte delle Mille Corde"
        descrizione: "In pieno giorno e a faccia scoperta, in mezzo ai banchi che ridevano di te."
        esito:
          titolo: A faccia scoperta
          immagine: ambientazione/ponti-sospesi
          testo: |
            Sbuchi da dietro il banco del venditore di funi a mezzogiorno, con la
            camicia pulita e le mani ancora nere di corda. Lui ti riconosce e apre
            la bocca, poi la richiude. Attraversi il Mercato dei Nodi senza
            fretta, e nessuno intona la strofa delle osterie.
          imposta: { scandalo: 3, recupero.ostracismo: 0 }
          pe: { resilienza: 10 }
          vai: ponti-sospesi
      - testo: "Scendere per le funi fino alla Città Bassa"
        descrizione: "Le funi dei carrettieri calano fino alle rocce della Città Bassa, dove nessuno ti aspetta."
        esito:
          titolo: Giù per le funi
          immagine: ambientazione/citta-bassa
          testo: |
            Ti cali lungo le funi dei carrettieri con i piedi incrociati sulla
            corda, come ti hanno insegnato sotto le travi, e le mani non tremano
            più come la prima volta. Quando tocchi la roccia calda della Città
            Bassa nessuno si volta a guardarti.
          imposta: { scandalo: 3, recupero.ostracismo: 0 }
          pe: { acrobazia: 10 }
          vai: citta-bassa
      - testo: "Presentarti ai Quartieri Alti"
        descrizione: "Con l'invito in tasca e un abito nuovo, ti fai vedere alle campane della sera come se niente fosse."
        requisiti: [invito >= 1]
        esito:
          titolo: Alle campane della sera
          immagine: ambientazione/quartieri-alti
          testo: |
            Spendi quello che hai per un abito decente e sali ai Quartieri Alti
            all'ora delle campane della sera. Saluti per nome chi ti aveva chiuso
            la porta, e loro, colti di sorpresa, ti rispondono. Nessuno ti chiede
            dove sei stato, e tu tieni le mani nere di corda dietro la schiena.
          imposta: { scandalo: 3, recupero.ostracismo: 0 }
          pe: { galateo: 10 }
          vai: quartieri-alti

  # ------------------------------------------------------------ carte della fascia 5–7

  - id: carta-sospetto-cassetta
    titolo: Una cassetta da tenere
    tipo: carta
    area: ovunque
    requisiti: [sospetto >= 5, sospetto < 8, pista.pelle < 6]
    immagine: personaggi/mauro-scrocco
    sommario: "Mauro Scrocco ha una cassetta da nascondere, e secondo lui la casa di un sorvegliato è la più sicura."
    testo: |
      Mauro Scrocco ti riceve alla Pignatta Grassa, al suo tavolo, con un
      bicchiere già versato e un vestito color zafferano.

      «Lo sa mezza città, amico mio, che ti tengono d'occhio» dice. «Però una
      casa che la Caserma ha già rivoltato non la guarda più nessuno.»

      Con il piede spinge verso di te, sotto il tavolo, una cassetta chiusa
      con un lucchetto, e ti chiede di tenerla qualche settimana senza
      aprirla.

      {percezione Media} La cassetta striscia sulle assi con un rumore
      pesante, e dentro niente si muove, come se fosse piena di metallo
      impacchettato con cura.
    opzioni:
      - testo: "Prendere la cassetta"
        descrizione: "Una buona ricompensa e la gratitudine degli Scuri. Se la Caserma bussa, però, la cassetta è in casa tua."
        esito:
          titolo: Sotto il pavimento
          testo: |
            Nascondi la cassetta sotto un'asse del pavimento e rimetti i chiodi con
            il tacco dello stivale. Due volte in una settimana incroci la stessa
            guardia all'angolo della tua strada, e la seconda volta ti saluta. Mauro
            ti manda le monete in un sacchetto di spezie, e per giorni sanno di
            cannella.
          effetti: { monete: 15, rep.scuri: 0.5, sospetto: 1.5 }
      - testo: "Rimandare indietro la cassetta"
        descrizione: "Hai già abbastanza guardie alla porta. Mauro la prenderà male, anche se continuerà a chiamarti amico mio."
        esito:
          titolo: Gentilezza
          testo: |
            Spingi la cassetta indietro con il piede, e Mauro la guarda tornare
            come si guarda un piatto rimandato in cucina. Poi sorride, ti riempie
            il bicchiere fino all'orlo e ti accompagna alla porta con una mano
            sulla spalla che pesa più del necessario.
          effetti: { rep.scuri: -0.5 }

  - id: carta-sospetto-due-parole
    titolo: Due parole in Caserma
    tipo: carta
    area: ovunque
    requisiti: [sospetto >= 5, sospetto < 8]
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "Un vice-sceriffo ti propone di passare in Caserma a chiarire la tua posizione, finché sei in tempo."
    testo: |
      Un vice-sceriffo ti affianca per strada e cammina al tuo passo, come se
      foste vecchi conoscenti. È giovane, con l'armatura troppo lucida e un
      taglietto da rasoio sotto il mento.

      {armi-da-mischia Facile} La spada che porta al fianco non è mai uscita da
      una sala d'armi.

      «Il tuo nome è sulla lista dello sceriffo, diciamo verso il fondo, per
      adesso» dice. «Se passi in Caserma e rispondi a qualche domanda, magari
      scende ancora. Se ci porti qualcosa di utile, scende di sicuro.»
      All'angolo ti lascia andare avanti da solo.
    opzioni:
      - testo: "Rispondere alle domande del sergente"
        descrizione: "Un'ora al banco della Caserma, a raccontare la tua versione senza contraddirti."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Più in basso nella lista
          testo: |
            Il sergente scrive mentre parli, con la lingua fra i denti, e a ogni
            risposta fa una domanda in più, e tu le reggi tutte. Alla fine gira il
            foglio verso di te perché tu firmi, e borbotta che almeno tu non gli
            hai fatto perdere tempo.
          effetti: { sospetto: -1 }
        fallimento:
          titolo: Una domanda di troppo
          testo: |
            Alla terza domanda ti contraddici su un orario, e il sergente se ne
            accorge subito. Resta zitto e scrive più a lungo di quanto abbia parlato
            tu, ed esci senza sapere se la tua posizione sia migliorata.
          effetti: { sospetto: 0.5 }
      - testo: "Portare qualche voce di vicolo"
        requisiti: [informazioni.voce >= 3]
        descrizione: "Tre voci raccolte in giro valgono qualcosa, per una Caserma che conta i passi degli Scuri."
        esito:
          titolo: Voci utili
          testo: |
            Il vice-sceriffo ascolta le tue voci in un angolo del cortile con la
            serietà di uno scolaro. Due le conosceva già, ma la terza lo fa
            sorridere fino alle orecchie. Ti riaccompagna al portone e ti dice che
            per un po', diciamo, non vedrai guardie sotto casa tua.
          effetti: { informazioni.voce: -3, sospetto: -1 }

  - id: carta-scandalo-farsa
    titolo: Una parte per te
    tipo: carta
    area: ovunque
    requisiti: [scandalo >= 5, scandalo < 8]
    immagine: personaggi/orazio-belcanto
    sommario: "Orazio Belcanto vuole mettere in scena la tua storia al Teatro delle Meraviglie, e ti offre anche la parte."
    testo: |
      Orazio Belcanto, l'impresario del Teatro delle Meraviglie, ti ferma
      prendendoti le maniche, un anello per dito.

      «La tua storia la conosce tutta la città, e la città la racconta male»
      dice. «È materia buona sprecata in bocca ai dilettanti. Io ne faccio una
      farsa in tre atti e la racconto bene.»

      Spiega che paga chi gli porta i dettagli giusti e il doppio a chi ha il
      coraggio di interpretare sé stesso.

      {politica-ed-economia Media} Una farsa sul tuo nome riempie il teatro per
      una stagione, e a lui frutta molto più di quanto offre a te.
    opzioni:
      - testo: "Raccontargli tutto"
        descrizione: "Una buona paga per i dettagli. Poi la città riderà di te a teatro, e con i dettagli giusti."
        esito:
          titolo: Tutto esaurito
          testo: |
            Orazio ti ascolta ridendo nei punti sbagliati e ti paga sull'unghia.
            Due settimane dopo la farsa è in cartellone con il tutto esaurito, e la
            gente per strada ti saluta con le battute del secondo atto.
          effetti: { monete: 20, scandalo: 1.5 }
      - testo: "Recitare la tua parte"
        descrizione: "Fare di te stesso un personaggio sul palco. Se il pubblico ride con te, forse smette di ridere di te."
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: Applausi
          testo: |
            Sul palco scopri che sai prenderti in giro meglio di chiunque altro, e
            dopo la seconda battuta le gambe smettono di tremare. Il pubblico ride
            con te fino al terzo atto e poi ti applaude. Orazio ti paga il doppio
            come promesso e ti chiede se hai altre disgrazie da raccontare.
          effetti: { monete: 40, scandalo: 1 }
        fallimento:
          titolo: Fischi
          testo: |
            A metà del primo atto dimentichi una battuta, e il pubblico capisce che
            stai soffrendo davvero e ride più forte che mai. Orazio ti paga lo stesso,
            perché la serata è stata un successo, e ti dice che gli attori veri si
            trovano, le disgrazie vere molto meno.
          effetti: { monete: 20, scandalo: 1.5 }

  - id: carta-scandalo-feriti
    titolo: Le cure pubbliche
    tipo: carta
    area: ovunque
    requisiti: [scandalo >= 5, scandalo < 8]
    immagine: fazioni/confraternita-del-velo
    sommario: "Il Velo cerca braccia per le cure pubbliche della Cattedrale. Una buona azione, sotto gli occhi di tutti."
    testo: |
      Sulla porta di una cappella è inchiodato un avviso della Confraternita
      del Velo. Padre Vantes cerca volontari per le cure pubbliche della
      settimana, quando la Cattedrale apre le porte a chi non può pagare un
      medico, e servono braccia per le barelle e monete per le bende. In
      fondo, con lettere più grandi, l'avviso promette che i nomi dei
      volontari e dei benefattori saranno letti alla liturgia della sera.

      {origine accolito-del-velo} Le cure pubbliche le conosci dalla parte
      delle barelle. In Cattedrale nessuno lo dice ad alta voce, ma un nome
      letto in navata porta più offerte di una predica.
    opzioni:
      - testo: "Portare le barelle"
        descrizione: "Una giornata intera fra i feriti, sotto gli occhi della città."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Facile }
        successo:
          titolo: Il tuo nome in navata
          testo: |
            Passi la giornata fra barelle e bacinelle, e alla sera hai le maniche
            macchiate fino al gomito. Un vecchio Raschiatore ti stringe la mano per
            averlo tenuto fermo mentre gli cucivano la gamba. Alla liturgia leggono
            il tuo nome, e chi ti conosceva per la tua storia adesso ti conosce
            anche per questa.
          effetti: { scandalo: -1, rep.velo: 0.5 }
        fallimento:
          titolo: Riconosciuto
          testo: |
            A metà mattina una donna in fila ti riconosce e lo dice ad alta voce,
            e per il resto del giorno i feriti guardano te più delle sorelle.
            Finisci il lavoro comunque. Alla liturgia leggono il tuo nome, e dalla
            navata sale una risatina.
          effetti: { scandalo: 0.5 }
      - testo: "Pagare le bende"
        requisiti: [monete >= 25]
        descrizione: "Un'offerta generosa, e il tuo nome letto fra quelli dei benefattori."
        esito:
          titolo: Fra i benefattori
          testo: |
            Lasci l'offerta a una sorella con i capelli rasati, che scrive il tuo
            nome in un registro. Alla liturgia della sera lo leggono fra quelli
            dei benefattori, subito dopo un mercante della Gilda che ha dato il
            doppio e si volta a vedere chi sei.
          effetti: { monete: -25, scandalo: -1 }
