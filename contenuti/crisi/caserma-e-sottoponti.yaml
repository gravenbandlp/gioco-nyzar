# Crisi del Sospetto e dello Scandalo, con le loro aree di penalità
# (Regolamento v0.4 §5 e integrazione): prigione (carcere interrato della Caserma)
# e ostracismo (i sottoponti, sotto i Ponti Sospesi). Più le carte della fascia 5–7.

aree:
  - id: prigione
    nome: Prigione
    immagine: ambientazione/guarnigione-di-qir-azel
    penalita: true
    testo: |
      Le celle della Caserma stanno al piano interrato, sotto il cortile dove
      la Guardia e i Raschiatori si addestrano insieme. Di giorno senti sopra
      la testa i passi delle reclute e gli ordini del sergente d'addestramento,
      che scendono fin qui attraverso le grate di sfiato con un leggero
      ritardo, e a volte ti scopri a raddrizzare la schiena per un
      comando già finito. Di notte resta soltanto l'acqua che cola lungo il
      muro, insieme alla tosse umida di qualcuno due celle più in là, che dopo
      due notti riconosci senza volerlo.

      La tua cella misura quattro passi per tre. Ci sono un pagliericcio e un
      secchio, e in alto una finestrella a bocca di lupo che dà sul cortile
      all'altezza degli stivali. La porta è di quercia borchiata, e lo
      spioncino si apre soltanto da fuori.

      In fondo al corridoio, sotto l'unica lanterna, c'è il tavolo del
      carceriere, con il registro dove ogni sera annota la condotta dei
      detenuti, una riga per nome. Chi tiene le chiavi impara presto le
      abitudini e le bugie di ciascuno, e qui sotto la voce si alza di rado.
      Da una delle celle, ogni sera, qualcuno fischia la stessa canzone e
      sbaglia sempre la nota alta, finché il carceriere non batte sulla sua
      porta.

      Da qui si esce quando la Caserma decide che il tuo nome può tornare in
      strada. Fino ad allora conviene che il carceriere ti trovi sempre in
      ordine.

  - id: ostracismo
    nome: Ostracismo
    immagine: ambientazione/ponti-sospesi
    penalita: true
    testo: |
      Sopra la tua testa passa il Ponte delle Mille Corde, e da quaggiù lo
      conosci per il rumore. Senti le ruote dei carretti sulle assi e le voci
      dei Custodi di Passaggio che chiedono la gabella all'imbocco. Di sopra
      nessuno guarda in basso, e anche tu, quando ci camminavi, non ti sei
      mai chiesto che cosa ci fosse sotto. In città il tuo nome è diventato
      una barzelletta e le porte a cui bussavi restano chiuse, così sei sceso
      dove nessuno chiede chi sei.

      I sottoponti sono una città appesa sotto l'altra. Fra le travi maestre
      la gente ha teso reti da pesca e tavolati di recupero, e ci ha costruito
      sopra ripari di tela cerata e lamiera che il vento fa sbattere tutta la
      notte. Da un riparo all'altro si passa su passerelle larghe una spanna,
      con una mano sempre sulla fune, e le prime volte ti tremano le
      ginocchia. Quaggiù vivono mendicanti e mutati della Marea insieme a
      gente caduta in disgrazia come te. Qualcuno ha inchiodato sulla sua tela
      cerata una targa d'ottone con un numero civico e ci tiene che il suo
      riparo si chiami così. Dal fondo della Cicatrice sale un vento che sa di
      ferro.

      Qui sotto non importa che cosa si racconta di te sul ponte. Conta se
      sai tenerti a una corda e se dividi quello che trovi. Per tornare di
      sopra ti serve che la città trovi un altro argomento, e intanto devi
      restare vivo e farti un posto fra chi abita le travi.

quality:
  - { id: recupero.prigione, nome: Buona condotta, categoria: stato, descrizione: "Le righe buone che il carceriere ha scritto su di te nel registro del carcere. A quattro, la Caserma è pronta a lasciarti andare." }
  - { id: recupero.ostracismo, nome: Oblio, categoria: stato, descrizione: "Quanto la città si è dimenticata di te mentre vivevi sotto i Ponti. A quattro, puoi tornare di sopra." }
  - { id: debito.scuri, immagine: fazioni/scuri, nome: Debito con gli Scuri, categoria: stato, descrizione: "Gli Scuri ti hanno tirato fuori dal carcere della Caserma, e il tuo nome è finito nel registro dei favori da riscuotere che Rozalia Marga tiene per loro." }

storylet:
  # ------------------------------------------------------------ Sospetto

  - id: crisi-sospetto
    titolo: Il mandato
    tipo: crisi
    area: citta-bassa
    requisiti: [sospetto >= 8]
    immagine: personaggi/toren-galdrick
    sommario: "La Caserma ha scritto il tuo nome per intero su un foglio con il sigillo dello sceriffo."
    testo: |
      Li vedi prima che loro vedano te, e le gambe rallentano da sole. Sono
      due guardie della Caserma con il cappuccio di maglia, ferme all'angolo
      della tua strada, e guardano la tua porta. Una delle due mastica un
      filo di paglia e l'altra ha un cerotto sul mento, da rasatura
      frettolosa. Da giorni ti pare di ritrovare le stesse facce dovunque vai,
      al banco della locanda e sui ponti, e adesso sai di non esserti
      sbagliato.

      {furtivita Media fallita} Avresti potuto girare l'angolo prima, o
      passare dal cortile del vicino. Lo pensi adesso, mentre il sergente ti
      ha già visto e ti viene incontro.

      Il sergente che le comanda ti raggiunge prima che tu possa cambiare
      direzione. Ha in mano un foglio con il sigillo dello sceriffo Toren
      Galdrick, e sul foglio c'è il tuo nome scritto per intero, seguito da due
      righe di motivi e da uno spazio bianco per quelli che troveranno. *Lo
      spazio bianco è la parte che ti piace meno.* Lo sceriffo lavora da anni
      sulle sue liste e non arresta mai in fretta. Se un foglio esce dal suo
      ufficio con quel sigillo, vuol dire che la tua pratica è pronta.

      Il sergente non ti mette le mani addosso. «La Caserma vuole sentirti
      oggi, e per oggi intendo prima di cena» dice, grattandosi il collo sotto
      il cappuccio. «Poi vedi tu.» Ti lascia il tempo di capire che cosa
      significa.

      {conoscenze-della-strada Facile} Quel «vedi tu» è un prezzo. Un sergente
      che vuole arrestarti non ti lascia il pomeriggio libero per pensarci.

      {origine figlio-della-citta-bassa} In Città Bassa un foglio con quel
      sigillo l'hai visto arrivare a più di una porta, e chi lo riceveva di
      solito spariva per un mese e tornava più magro. Le guardie della tua
      strada, poi, hanno sempre avuto una memoria lunga per le facce come la
      tua.

      A Qir-Azel un'accusa si può ancora far dimenticare, se sai a chi
      rivolgerti e che cosa sei disposto a perdere. In alternativa, al piano
      interrato della Caserma c'è una cella libera, e il pensiero ti fa
      sentire già addosso l'umido dei muri.
    opzioni:
      - testo: "Pagare il sergente"
        costo: 0
        requisiti: [monete >= 80]
        descrizione: "Una tangente sostanziosa, perché il foglio finisca in fondo a un cassetto invece che sul tavolo dello sceriffo."
        esito:
          titolo: In fondo al cassetto
          testo: |
            Il sergente conta le monete senza toglierle dalla borsa, pesandole sul
            palmo, come un fornaio pesa la pasta. Poi piega il foglio in quattro e se
            lo infila nella giubba. «Le pratiche si perdono, vedi tu» dice. «In
            Caserma ne arrivano tante, e i cassetti sono quelli che sono.»

            Le due guardie all'angolo se ne vanno prima di sera. Lo sceriffo
            non sa niente di questo accordo, e ti conviene che resti così,
            perché a Qir-Azel si dice che Galdrick chi prova a comprarlo se lo
            segna e non lo dimentica. La borsa, adesso, ti batte leggera contro
            il fianco.
          effetti: { monete: -80 }
          imposta: { sospetto: 4 }
      - testo: "Consegnare un nome degli Scuri"
        costo: 0
        quando: [pista.pelle < 6]
        descrizione: "La Caserma vuole gli Scuri più di quanto voglia te. Puoi darle il corriere che porta i cristalli non registrati dalla Pignatta al Mercato delle Ombre."
        esito:
          titolo: Un nome per un altro
          immagine: fazioni/scuri
          testo: |
            Dici il nome a bassa voce e aggiungi l'ora e la strada, e la bocca
            ti resta amara come dopo un vino cattivo. Il sergente lo scrive
            nello spazio bianco sotto il tuo, poi cancella il tuo con due righe
            dritte, aiutandosi con il bordo di un'unghia.

            Due sere dopo il corriere viene preso con il sacco addosso. Alla
            Pignatta Grassa Mauro Scrocco ha cominciato a chiedere chi l'abbia
            venduto, a voce così alta che lo sente mezza sala, e a ognuno versa
            un dito di vino in più.
          effetti: { rep.scuri: -2, rep.caserma: 1 }
          imposta: { sospetto: 4 }
      - testo: "Consegnare un nome degli ultimi Scuri"
        costo: 0
        quando: [pista.pelle >= 6]
        descrizione: "Dopo il rogo della Pignatta c'è ancora chi porta cristalli non registrati al Mercato delle Ombre, e la Caserma vuole anche gli ultimi degli Scuri."
        esito:
          titolo: Un nome per un altro
          immagine: fazioni/scuri
          testo: |
            Dici il nome a bassa voce e aggiungi l'ora e la strada, e ti accorgi di
            aver abbassato gli occhi. È un ricettatore che dopo il rogo della Pignatta
            ha continuato a passare cristalli al Mercato delle Ombre, come se nessuno
            gli avesse detto che Mirko Vesh è morto. Il sergente lo scrive nello
            spazio bianco sotto il tuo, poi cancella il tuo con due righe dritte.

            Due sere dopo il ricettatore viene preso con il sacco addosso. Al
            Mercato delle Ombre la porta cambia stanza un'altra volta, e per
            qualche giorno chi ci vende ti guarda le mani prima della faccia.
          effetti: { rep.scuri: -2, rep.caserma: 1 }
          imposta: { sospetto: 4 }
      - testo: "Bruciare il tuo contatto nell'ombra"
        costo: 0
        requisiti: [contatto-ombra >= 1]
        descrizione: "Dai alla Caserma la porta che usi per scendere al Mercato delle Ombre. Chi te l'ha insegnata non vorrà più vederti."
        esito:
          titolo: Una porta murata
          immagine: ambientazione/mercato-delle-ombre
          testo: |
            Descrivi la porta al sergente, e anche il colpo da battere e la
            parola da dire. Lui prende nota con una calligrafia rotonda da
            scolaro e ti fa firmare in fondo alla pagina. La penna gratta, e
            la tua firma viene più storta del solito.

            Una settimana dopo passi davanti al vicolo e trovi la porta murata
            con mattoni ancora freschi, e ti accorgi di aver trattenuto il fiato
            solo quando sei in fondo al vicolo. L'uomo che ti aveva insegnato la
            strada non si fa più trovare, e le voci della Città Bassa dicono che
            il Mercato ha già cambiato stanza.
          effetti: { contatto-ombra: -1 }
          imposta: { sospetto: 4 }
      - testo: "Seguire il sergente in Caserma"
        costo: 0
        quando: [pista.pelle < 4]
        descrizione: "Nessun accordo e nessun nome. Scendi nelle celle del piano interrato e aspetti che la Caserma si stanchi di te."
        esito:
          titolo: Il piano interrato
          testo: |
            Il sergente ti accompagna fino al portone della Caserma, nei Quartieri
            Alti. Due guardie in armatura pesante lo presidiano giorno e notte, e una
            delle due sbadiglia dentro l'elmo. Al banco ti tolgono la cintura e i
            lacci degli stivali, e un uomo massiccio con il naso rotto più volte ti
            porta giù nelle celle, reggendo la lanterna. Porta un grembiule di cuoio
            sopra la divisa e una clava corta alla cintura. Sulle scale ti tieni i
            calzoni con una mano, e i piedi ti ballano negli stivali.

            {rissa Facile} Il naso gliel'hanno rotto in tanti, e lui è ancora
            in piedi. Quelli che glielo hanno rotto, probabilmente, meno.

            La porta di quercia si chiude alle tue spalle. Il carceriere apre
            lo spioncino, ti guarda un momento e dice che si chiama Borso.
          vai: prigione
      - testo: "Seguire il sergente in Caserma"
        costo: 0
        quando: [pista.pelle >= 4]
        descrizione: "Nessun accordo e nessun nome. Scendi nelle celle del piano interrato e aspetti che la Caserma si stanchi di te."
        esito:
          titolo: Il piano interrato
          testo: |
            Il sergente ti accompagna fino al portone della Caserma, nei Quartieri
            Alti. Due guardie in armatura pesante lo presidiano giorno e notte. Al
            banco ti tolgono la cintura e i lacci degli stivali, e il carceriere nuovo
            ti porta giù nelle celle, reggendo la lanterna. È un uomo anziano con un
            ginocchio rigido e un mazzo di chiavi nuove e lucide alla cintura, che
            tintinnano a ogni passo zoppo. Sulle scale ti tieni i calzoni con una
            mano, e i piedi ti ballano negli stivali. Davanti alla tua porta il
            carceriere prova tre chiavi prima di trovare quella giusta.

            La porta di quercia si chiude alle tue spalle. Il carceriere apre
            lo spioncino, ti guarda un momento e ti dice che qui sotto, da
            quando le chiavi vecchie se ne sono andate con Borso, si conta
            tutto due volte. Lo dice senza cattiveria, come si spiega la
            regola di un gioco.
          vai: prigione

  - id: prigione-cortile
    titolo: I secchi del cortile
    area: prigione
    ripetibile: true
    luogo: Cortile della Caserma
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "All'alba il carceriere fa lavorare nel cortile chi vuole una riga buona nel registro."
    testo: |
      All'alba il carceriere apre le celle una alla volta e mette i detenuti in
      fila nel corridoio, e tu sbatti gli occhi alla luce grigia come una
      talpa. Chi vuole lavora nel cortile finché le reclute non hanno finito
      l'addestramento del mattino, e chi lavora bene si guadagna una riga
      buona nel registro del carceriere. Oggi bisogna portare l'acqua dalla
      cisterna agli abbeveratoi delle stalle, un secchio per mano, da un capo
      all'altro del cortile. Le reclute ti guardano passare fra un assalto e
      l'altro, e una di loro ha imbottito l'elmo con una calza di lana a
      righe.

      {resistenza Facile} Il primo viaggio è facile, il decimo lo senti nei
      reni. Tieni i secchi bassi e le braccia dritte, e lascia lavorare le
      gambe.

      Dragna Gro-Malog è appoggiata al muro con i fogli dei turni in mano, si
      inumidisce il pollice per voltare pagina e non ti degna di un'occhiata.

      {origine apprendista-raschiatore} Ti conosce bene, perché il tuo nome
      l'ha scritto lei sui fogli dei turni più di una volta. Che adesso non
      alzi gli occhi può essere un favore oppure un giudizio, e non sai
      decidere quale dei due ti brucia di più.
    opzioni:
      - testo: "Portare i secchi fino all'ultima campana"
        descrizione: "Il lavoro è lungo, e il carceriere conta i viaggi."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Facile }
        successo:
          titolo: Una riga buona
          testo: |
            Porti l'ultimo secchio mentre suona la campana e le reclute
            rompono le righe. Hai le spalle in fiamme e le mani segnate dai
            manici, e quando provi ad aprirle le dita restano piegate a
            uncino. La recluta con la calza nell'elmo ti fa un cenno col mento,
            da collega. Il carceriere ti riaccompagna in cella e, prima di
            chiudere, scrive qualcosa nel registro con un mozzicone di matita.
          effetti: { recupero.prigione: 1 }
        fallimento:
          titolo: Sugli stivali
          testo: |
            A metà mattina un secchio ti scivola e si rovescia sugli stivali di
            una recluta, che ti insulta davanti a tutto il cortile con un
            vocabolario sorprendente per la sua età. Finisci il turno lo
            stesso, zoppicando. Il carceriere scrive nel registro anche
            oggi, ma la riga è più corta.
          effetti: { recupero.prigione: 0.5 }

  - id: prigione-borso
    titolo: La scatola di latta
    area: prigione
    ripetibile: true
    requisiti: [pista.pelle < 4]
    luogo: Carcere della Caserma
    immagine: personaggi/borso
    sommario: "La sera Borso conta le monete in una scatola di latta, al tavolo in fondo al corridoio."
    testo: |
      La sera, quando il rancio è finito, Borso siede al tavolo in fondo al
      corridoio sotto l'unica lanterna. Tira fuori da sotto il grembiule una
      scatola di latta e conta le monete che ci tiene dentro,
      impilandole per dieci. Le conta due volte, poi le rimette via. Non le
      spende mai in niente, nemmeno nel tabacco che i detenuti gli offrono
      per un secchio d'acqua in più. Nella cella in fondo Karn, un
      tagliagole degli Scuri che le guardie hanno preso sui tetti della Città
      Bassa, smette di fischiare appena sente tintinnare le monete.

      {origine fuggiasco-di-ghoran} Il modo in cui si curva sulle monete, con
      le spalle a fare da muro, l'hai visto nei recinti di Ghoran, in chi
      aveva qualcosa che i sorveglianti non dovevano trovare. Lì però nessuno
      impilava per dieci, perché nessuno ci arrivava.

      {conoscenze-della-strada Media} Karn non fischia più perché ascolta, e
      ascolta perché qualcuno fuori gli ha chiesto di farlo. Un tagliagole
      non si interessa ai risparmi di un carceriere per curiosità.

      Dal tuo spioncino lo vedi di profilo, con le labbra che si muovono sui
      numeri. *Nessuno conta due volte dei soldi che non ha intenzione di
      spendere.* È il momento della giornata in cui Borso è più disposto ad
      ascoltare, e quello che pensa di te finisce nel registro.

      {accademiche Facile fallita} Ti metti a contare con lui per abitudine
      e alla terza pila hai già perso il conto, mentre lui continua senza
      esitare.
    opzioni:
      - testo: "Parlargli attraverso lo spioncino"
        descrizione: "Borso non è un uomo di conversazione. Devi trovare le parole giuste, e poche."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Ghoran
          testo: |
            Della scatola non gli chiedi niente. Gli domandi di dove viene, e dopo un
            silenzio così lungo che credi non ti abbia sentito Borso nomina Ghoran, la
            città dei mercati di schiavi. Lo dice a voce bassa, senza alzare gli occhi
            dalle pile. Poi torna a contare le monete, e tu lasci cadere il discorso.

            {empatia Media} Ha detto Ghoran come si dice il nome di un morto in
            famiglia. Qualcuno di suo, laggiù, c'è ancora.

            Quando ti porta il rancio, la mattina dopo, nella scodella c'è un
            pezzo di pane in più. Nel registro, alla voce che ti riguarda, ha
            scritto *tranquillo*.
          effetti: { recupero.prigione: 1 }
        fallimento:
          titolo: Lo spioncino
          testo: |
            Borso ti lascia parlare un poco, senza alzare gli occhi dalle pile.
            Poi si alza, viene fino alla tua porta con il suo passo pesante e
            chiude lo spioncino senza dire una parola. Lo senti tornare
            al tavolo e ricominciare a contare dall'inizio. A metà sbaglia e
            riparte, e ti pare colpa tua.

            Quella sera nel registro, alla tua voce, non compare nessuna riga
            nuova.
          effetti: { recupero.prigione: 0.5 }

  - id: prigione-il-carceriere-nuovo
    titolo: Il carceriere nuovo
    area: prigione
    ripetibile: true
    requisiti: [pista.pelle >= 4]
    luogo: Carcere della Caserma
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "Dopo la fuga di Borso le chiavi le tiene un sergente anziano, che la sera ripara le cinghie al tavolo in fondo al corridoio."
    testo: |
      Da quando Borso è scappato, le chiavi del carcere le tiene un sergente
      anziano che la Caserma ha tolto dalle mura perché ha un ginocchio
      rigido. La sera siede al tavolo sotto l'unica lanterna del corridoio
      e ripara le cinghie degli elmi con un punteruolo e un rocchetto di
      spago cerato. Ogni tanto alza il ginocchio malato su uno sgabello e
      soffia piano fra i denti.

      {medicina Media} Il ginocchio è gonfio sopra la rotula, e lui lo tiene
      dritto per non piegarlo. Un'umidità come questa, per un ginocchio così,
      è una condanna più lunga della tua.

      Il registro dei detenuti è lo stesso di prima, con le pagine di Borso
      ancora in fondo, e il sergente lo tiene aperto accanto alle cinghie.
      Scrive poco e con calma, una riga alla volta. Dal tuo spioncino lo vedi di
      profilo mentre infila lo spago nella cruna al terzo tentativo. *Uno che
      lavora fino a tardi senza che nessuno glielo chieda ha voglia di parlare.*
      Quello che pensa di te finisce nel registro come prima.
    opzioni:
      - testo: "Parlargli attraverso lo spioncino"
        descrizione: "Il sergente lavora piano e ascolta volentieri, se trovi l'argomento giusto."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il ginocchio
          testo: |
            Gli chiedi del ginocchio, e lui ti racconta di una scala delle mura
            gelata, di un inverno di molti anni fa e di un cerusico che voleva
            tagliare. Parla senza smettere di cucire, battendo il tempo con il
            punteruolo sul tavolo, e alla fine ride da solo di una cosa che non
            ti ha detto.

            La mattina dopo nella scodella c'è un pezzo di pane in più. Nel
            registro, alla voce che ti riguarda, ha scritto *ragionevole*.
          effetti: { recupero.prigione: 1 }
        fallimento:
          titolo: Lo spago
          testo: |
            Il sergente ti ascolta per un po' con il punteruolo fermo a mezz'aria. Poi
            ti dice che a quest'ora le chiacchiere gli fanno sbagliare i punti, con la
            cortesia stanca di un nonno, e torna alla cinghia senza aggiungere altro.
            Dopo qualche minuto lo senti sciogliere un nodo venuto storto.

            Quella sera nel registro, alla tua voce, non compare nessuna riga
            nuova.
          effetti: { recupero.prigione: 0.5 }

  - id: prigione-verbale
    titolo: Il verbale d'accusa
    area: prigione
    ripetibile: true
    luogo: Carcere della Caserma
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "Prima dell'interrogatorio il sergente ti lascia leggere il verbale. Se ci trovi un errore, la tua pratica si accorcia."
    testo: |
      Un vice-sceriffo ti porta il verbale d'accusa e te lo lascia per
      un'ora, come vuole la regola, prima di chiamarti all'interrogatorio.
      Sono quattro fogli fitti, scritti in quella lingua di scartoffie che la
      Gilda ha insegnato a mezza città, dove nessuno va da nessuna parte
      e tutti «si recano». La candela è corta, e dopo mezz'ora gli occhi ti
      bruciano. Ci sono le ore e i luoghi, con i nomi delle guardie che ti
      hanno visto e la firma di ciascuna. Su un margine qualcuno ha
      disegnato un gatto, e poi ha provato a cancellarlo con il pollice.

      {politica-ed-economia Media} Ogni accusa in più è una riga in più nel
      rendiconto del mese, e ogni riga allo sceriffo vale qualcosa davanti al
      Consiglio. Le hanno messe per fare numero.

      {origine allievo-di-torvessa} All'Accademia hai passato notti su
      trattati scritti peggio di questo, con le note a margine di tre maestri
      che non andavano d'accordo fra loro. Qui almeno l'autore è uno solo, e
      non si è mai riletto.

      Le accuse sono tante. Chi le ha scritte aveva fretta, e uno scrivano
      che ha fretta sbaglia.
    opzioni:
      - testo: "Cercare le contraddizioni"
        descrizione: "Confrontare le ore con i luoghi e le firme con i turni di guardia, finché qualcosa non torna."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Un'ora di troppo
          testo: |
            Al terzo foglio, con la candela ridotta a un dito, lo trovi. Una guardia
            giura di averti visto sul Ponte delle Mille Corde alla stessa ora in cui
            un'altra ti mette in Città Bassa, e le due firme sono dello stesso turno.
            All'interrogatorio lo fai notare con calma. Il vice-sceriffo rilegge due
            volte muovendo le labbra, poi cancella mezza pagina con due righe
            incrociate.
          effetti: { recupero.prigione: 1 }
        fallimento:
          titolo: La lingua delle scartoffie
          testo: |
            Leggi e rileggi, ma fra i commi e le formule ti perdi prima della fine del
            primo foglio, e ogni «suddetto» ti rimanda indietro. Il gatto sul margine,
            intanto, ti guarda. All'interrogatorio rispondi a tutte le domande senza
            sbagliare e senza guadagnare terreno.
          effetti: { recupero.prigione: 0.5 }

  - id: prigione-uscita
    titolo: La porta di quercia
    area: prigione
    requisiti: [recupero.prigione >= 4, pista.pelle < 4]
    luogo: Carcere della Caserma
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "Il registro di Borso è pieno di righe buone. La Caserma è pronta a lasciarti andare, e non sei il solo a saperlo."
    testo: |
      Da una settimana il sergente non ti chiama più all'interrogatorio, e il
      registro di Borso alla tua voce è pieno di righe buone. Stamattina il
      carceriere ti ha detto che la tua pratica è arrivata in fondo. Per
      uscire serve la firma di qualcuno che risponda di te, oppure qualche
      giorno di lavoro per la Gilda sui Ponti, che la Caserma presta i detenuti
      ai Custodi di Passaggio per le riparazioni delle corde. «Firma o
      braccia» ha riassunto Borso, con la stessa voce con cui annuncia il
      rancio. «Le braccia la Gilda le prende sempre.»

      {empatia Facile} Lo dice come una cosa da niente, però sulla parola
      braccia la voce gli si è abbassata. Ne ha visti tanti tornare dalla
      Gilda con le mani rovinate, e tu non saresti il primo.

      Più tardi, con il rancio, trovi sul vassoio un biglietto piegato senza
      firma, e lo tieni in mano più a lungo del necessario, finché la carta non
      ti si inumidisce fra le dita. In un angolo c'è disegnata a inchiostro una
      pentola panciuta, e alla Pignatta Grassa sanno sempre chi sta per uscire.

      {percezione Media} Un biglietto senza firma che arriva con il rancio è
      passato per le mani di qualcuno che porta il rancio. Gli
      Scuri, qui sotto, hanno almeno un paio di mani.

      Nel pomeriggio Borso torna con una notizia. Chi ha
      un invito per i Quartieri Alti può uscire dal portone principale, ma
      prima deve firmare la promessa di buona condotta nell'ufficio dello
      sceriffo, al primo piano.

      {origine rampollo-dei-quartieri-alti} Una promessa di buona condotta
      firmata nell'ufficio dello sceriffo, in famiglia, la leggerebbero come
      un necrologio. Ti consola poco pensare che almeno la firmeresti con la
      grafia che ti hanno insegnato da bambino, inclinata il giusto.
    opzioni:
      - testo: "Presentarti allo sceriffo"
        descrizione: "Toren Galdrick ti riceve nel suo ufficio. Firmi davanti a lui la promessa di buona condotta ed esci dal portone principale, nei Quartieri Alti."
        quando: [galdrick.via == 0]
        requisiti: [invito >= 1]
        esito:
          titolo: Il portone principale
          immagine: personaggi/toren-galdrick
          testo: |
            Lo sceriffo è un uomo imponente, con la pelle scura e la testa
            rasata. Ti riceve con il cappuccio di maglia abbassato sulle spalle
            e parla poco, lentamente, scegliendo ogni parola come se dovesse
            pagarla. Ti mette davanti la promessa di buona
            condotta, aspetta che tu la legga fino in fondo e ti guarda firmare.

            «Il tuo nome resta nelle mie carte» dice mentre ripone la penna.
            «Vedi di non darmi motivo di rileggerle.»

            Le guardie del portone si scostano per farti passare. Fuori c'è la
            luce dei Quartieri Alti, così forte dopo le celle che ti lacrimano
            gli occhi, e senti l'odore dell'incenso. Lo respiri a fondo, anche
            se l'incenso non ti è mai piaciuto.
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { galateo: 10 }
          vai: quartieri-alti
      - testo: "Firmare davanti al sergente di turno"
        descrizione: "Lo sceriffo è a Ghoran. La promessa di buona condotta la firmi davanti al sergente di turno, ed esci dal portone principale, nei Quartieri Alti."
        quando: [galdrick.via == 1]
        requisiti: [invito >= 1]
        esito:
          titolo: Il portone principale
          immagine: ambientazione/guarnigione-di-qir-azel
          testo: |
            Il sergente di turno ti riceve nell'ufficio dello sceriffo, in piedi
            accanto alla scrivania, perché sulla sedia di Galdrick nessuno si
            siede finché lui è a Ghoran. Legge il tuo nome due volte e lo
            confronta con una lista che tiene sotto il calamaio, poi ti mette
            davanti la promessa di buona condotta e ti guarda firmare.

            «Lo sceriffo, quando torna, rilegge tutto» dice, soffiando
            sull'inchiostro. «Vedi di non dargli motivo di fermarsi sul tuo.»
            Resta in piedi accanto alla sedia vuota per tutto il tempo, e tu
            con lui.

            Le guardie del portone si scostano per farti passare. Fuori c'è la
            luce dei Quartieri Alti, così forte dopo le celle che ti lacrimano
            gli occhi, e senti l'odore dell'incenso.
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { galateo: 10 }
          vai: quartieri-alti
      - testo: "Farti tirare fuori dagli Scuri"
        descrizione: "Rispondi al biglietto della Pignatta. Gli Scuri sanno come si esce da una cella senza firmare niente, e poi se lo ricordano."
        esito:
          titolo: Un ordine con il sigillo giusto
          immagine: personaggi/rozalia-marga
          testo: |
            La notte dopo una guardia che non hai mai visto apre la tua cella
            con un foglio in mano. È un ordine di scarcerazione con il sigillo
            dello sceriffo e la firma del sergente, così perfetti che il
            sergente stesso li giurerebbe suoi. In fondo al foglio, accanto al
            timbro, c'è una macchia d'inchiostro che sembra un'impronta di
            pollice.

            {percezione Media} È un'impronta piccola, di dita sottili. Chi ha
            fatto questo foglio lo firma anche quando non dovrebbe.

            Esci dalla porta delle cucine, fra i pentoloni ancora tiepidi e un
            gatto che non si scompone, e scendi le scale fino alla Città Bassa
            senza che nessuno ti fermi. Alla Pignatta Grassa Mauro Scrocco ti
            versa da bere e non ti fa pagare. Il tuo nome, dice, adesso è
            scritto in un registro che Rozalia tiene molto in ordine.
          effetti: { rep.scuri: 1, debito.scuri: 1 }
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { conoscenze-della-strada: 10 }
          vai: citta-bassa
      - testo: "Scontare il resto sui Ponti"
        descrizione: "Qualche giorno a riparare corde per i Custodi di Passaggio, sotto gli occhi di una guardia. Poi ti lasciano andare dove hai finito il lavoro."
        esito:
          titolo: Corde nuove
          immagine: ambientazione/ponti-sospesi
          testo: |
            Per cinque giorni sostituisci le funi sfilacciate sotto il Ponte
            delle Mille Corde, appeso a un'imbracatura, mentre una guardia della
            Caserma fuma sulla piattaforma di sopra e ti tiene d'occhio. Il
            Custode di Passaggio che dirige i lavori sa riconoscere dal cigolio
            una corda buona da una che cederà, e alla fine lo impari anche tu.
            Le prime due notti le mani ti bruciano tanto che dormi con i palmi
            rivolti all'aria.

            {atletica Facile fallita} Il Custode si issa lungo la corda con le
            gambe e risparmia le mani. Tu ci provi il terzo giorno, e le gambe
            ti fanno sapere che preferiscono penzolare.

            L'ultimo giorno la guardia spegne la pipa, ti restituisce la cintura
            e se ne torna in Caserma senza voltarsi.
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { atletica: 10 }
          vai: ponti-sospesi

  # La stessa uscita dopo la fuga di Borso con le chiavi della Caserma (pista.pelle >= 4): un carceriere nuovo,
  # Galdrick tornato da Ghoran, e il biglietto della Pignatta solo finché la Pignatta c'è (pista.pelle < 6).
  - id: prigione-uscita-chiavi-nuove
    titolo: La porta di quercia
    area: prigione
    requisiti: [recupero.prigione >= 4, pista.pelle >= 4]
    luogo: Carcere della Caserma
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "Il registro del carceriere è pieno di righe buone, e la Caserma è pronta a lasciarti andare."
    testo: |
      Da una settimana il sergente non ti chiama più all'interrogatorio, e il
      registro del carceriere alla tua voce è pieno di righe buone.
      Stamattina il carceriere nuovo ti ha detto che la tua pratica è arrivata
      in fondo, dopo averla cercata su tre pagine sbagliate. Per uscire serve
      la firma di qualcuno che risponda di te, oppure qualche giorno di lavoro
      per la Gilda sui Ponti, che la Caserma presta i detenuti ai Custodi di
      Passaggio per le riparazioni delle corde. «Firma o braccia» ha
      riassunto, come se leggesse un cartello appeso al muro. «Con Borso si
      faceva così, e io non vedo perché cambiare.»

      {politica-ed-economia Facile} Scommetteresti che la Gilda paga la Caserma
      per ogni detenuto che le presta, e che la Caserma non lo scrive da nessuna
      parte. Le braccia, in questa città, hanno sempre un compratore.

      Da quando le chiavi vecchie se ne sono andate con lui, il fabbro della
      Caserma cambia una serratura al giorno, e il carceriere si porta dietro
      il mazzo nuovo anche quando va al pozzo.

      {tecnologia Media} Le serrature nuove sono di quelle a tre leve, con la
      molla rinforzata. Il fabbro lavora bene, però una al giorno vuol dire che
      per un mese qualche porta resta quella di prima. Nel pomeriggio torna con
      una notizia. Chi ha un invito per i Quartieri Alti può uscire dal portone
      principale, ma prima deve firmare la promessa di buona condotta davanti
      allo sceriffo, che adesso le uscite le firma tutte di persona.
    opzioni:
      - testo: "Presentarti allo sceriffo"
        descrizione: "Toren Galdrick ti riceve nel suo ufficio. Firmi davanti a lui la promessa di buona condotta ed esci dal portone principale, nei Quartieri Alti."
        requisiti: [invito >= 1]
        esito:
          titolo: Il portone principale
          immagine: personaggi/toren-galdrick
          testo: |
            Lo sceriffo ti riceve seduto alla scrivania, con il cappuccio di
            maglia abbassato sulle spalle, e non si alza. Sul tavolo accanto al
            calamaio c'è un anello di ferro vuoto, di quelli che reggono le
            chiavi, e ogni tanto ci posa sopra la mano, piano, senza guardarlo.

            {empatia Media} Lo tiene lì per ricordarsi di una fiducia che ha dato alla
            persona sbagliata, e se lo ricorda ogni volta che lo tocca. Ti mette
            davanti la promessa di buona condotta, aspetta che tu la legga fino in
            fondo e ti guarda firmare.

            «Il tuo nome resta nelle mie carte» dice mentre ripone la penna.
            «Vedi di non darmi motivo di rileggerle.»

            Le guardie del portone si scostano per farti passare. Fuori c'è la
            luce dei Quartieri Alti, così forte dopo le celle che ti lacrimano
            gli occhi, e senti l'odore dell'incenso.
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { galateo: 10 }
          vai: quartieri-alti
      - testo: "Farti tirare fuori dagli Scuri"
        descrizione: "Con il rancio è arrivato un biglietto senza firma, con una pentola panciuta disegnata in un angolo. Gli Scuri hanno le chiavi vecchie della Caserma, e sanno ancora quali porte aprono."
        quando: [pista.pelle < 6]
        esito:
          titolo: Le chiavi vecchie
          immagine: personaggi/rozalia-marga
          testo: |
            La notte dopo la tua porta si apre senza rumore. Sulla soglia c'è
            una guardia che non hai mai visto, con un anello di chiavi vecchie
            infilato al polso, e ti fa segno di seguirla. La serratura della tua
            cella, a quanto pare, il carceriere nuovo non ha fatto in tempo a
            cambiarla. Il cuore ti batte così forte che ti pare lo debbano
            sentire fino al cortile.

            Esci dalla porta delle cucine e scendi le scale fino alla Città
            Bassa senza che nessuno ti fermi. Alla Pignatta Grassa Mauro Scrocco
            ti versa da bere e non ti fa pagare, e il vino gratis ti va di
            traverso. Il tuo nome, dice, adesso è scritto in un registro che
            Rozalia tiene molto in ordine.
          effetti: { rep.scuri: 1, debito.scuri: 1 }
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { conoscenze-della-strada: 10 }
          vai: citta-bassa
      - testo: "Scontare il resto sui Ponti"
        descrizione: "Qualche giorno a riparare corde per i Custodi di Passaggio, sotto gli occhi di una guardia. Poi ti lasciano andare dove hai finito il lavoro."
        esito:
          titolo: Corde nuove
          immagine: ambientazione/ponti-sospesi
          testo: |
            Per cinque giorni sostituisci le funi sfilacciate sotto il Ponte
            delle Mille Corde, appeso a un'imbracatura, mentre una guardia della
            Caserma fuma sulla piattaforma di sopra e ti tiene d'occhio. Il
            Custode di Passaggio che dirige i lavori sa riconoscere dal cigolio
            una corda buona da una che cederà, e alla fine lo impari anche tu.
            Le prime due notti le mani ti bruciano tanto che dormi con i palmi
            rivolti all'aria.

            L'ultimo giorno la guardia spegne la pipa, ti restituisce la cintura
            e se ne torna in Caserma senza voltarsi. Ti resta la cintura in
            mano, e per un momento non ricordi più come si allaccia.
          imposta: { sospetto: 3, recupero.prigione: 0 }
          pe: { atletica: 10 }
          vai: ponti-sospesi

  # ------------------------------------------------------------ Scandalo

  - id: crisi-scandalo
    titolo: Il tuo nome sul ponte
    tipo: crisi
    area: citta-bassa
    requisiti: [scandalo >= 8]
    immagine: ambientazione/mercato-dei-nodi
    sommario: "Il tuo nome passa di bocca in bocca per tutta Qir-Azel, e a ogni passaggio la storia si allunga."
    testo: |
      Te ne accorgi al Mercato dei Nodi, quando il venditore di funi ti dice il
      prezzo e poi lo ripete più forte perché lo sentano anche i banchi vicini.
      Da qualche giorno il tuo nome gira per Qir-Azel insieme alle tue ultime
      figuracce, e la storia si allunga a ogni passaggio. Nelle osterie della
      Città Bassa ci hanno fatto sopra una strofa. Nei Quartieri Alti la
      raccontano a cena, abbassando la voce quel tanto che basta perché i
      domestici la sentano lo stesso. Un ragazzo ti cammina dietro per un tratto
      imitando il tuo passo, e sua madre non lo richiama. Da quel momento ti
      accorgi di camminare con le spalle un po' più curve, e non sai se lo fai
      per non somigliare all'imitazione o perché il ragazzo aveva visto giusto.

      {espressivita Media} La strofa, a essere onesti, è anche ben fatta. Ha
      una rima interna sul tuo nome che ti sarebbe piaciuta, se il nome
      fosse stato di un altro.

      {resilienza Media fallita} Ti ripeti che fra una settimana nessuno se
      ne ricorderà. Lo stomaco ha deciso di crederci soltanto a stomaco
      vuoto, e stasera salta la cena.

      Le porte hanno cominciato a chiudersi. Il fornitore che ti faceva credito
      ha cambiato idea, e una lettera che aspettavi è tornata indietro con il
      sigillo intatto. Prima di entrare in una bottega ti scopri a contare le
      monete nella tasca, due volte. Sui Ponti si dice che il prezzo dipende da
      chi ti guarda mentre paghi, e adesso ti guardano tutti, perfino il
      cane del venditore di funi.

      {origine mercante-dei-ponti} Ai Ponti il credito è la prima cosa che se
      ne va e l'ultima che torna. Dal tuo banco l'hai negato anche tu, a gente
      che sul momento ti sembrava una brutta storia, e adesso ti tornano in
      mente le loro facce una per una.

      Una storia così si spegne in fretta se la città trova qualcosa di meglio
      da raccontare, o se ci si mette a tavola la gente giusta. Qualcuno che ti
      stima può anche metterci la faccia per te, e rimetterci un poco. Chi non
      ha niente da spendere di solito sparisce sotto i Ponti Sospesi, dove
      nessuno legge i nomi, e aspetta che la città si dimentichi.
    opzioni:
      - testo: "Offrire cene e regali"
        costo: 0
        requisiti: [monete >= 60]
        descrizione: "Una bella somma spesa in cene e regali, finché chi rideva di te non si ritrova tuo ospite."
        esito:
          titolo: Il conto delle cene
          testo: |
            Per sette giorni inviti a cena, una alla volta, le persone che
            parlavano di te, e a forza di sorridere ti fa male la mascella. Il
            fegato, alla quinta sera, comincia a mandarti lettere di protesta. A
            chi non accetta mandi una bottiglia buona. Chi è stato tuo ospite fa
            fatica a ridere di te il giorno dopo, e chi ha bevuto il tuo vino
            preferisce cambiare argomento.

            Il conto è salato. La strofa delle osterie però si canta sempre
            meno, e il fornitore ti ha rimandato un biglietto molto cortese,
            con una sbavatura d'inchiostro dove ha esitato sul saluto.
          effetti: { monete: -60 }
          imposta: { scandalo: 4 }
      - testo: "Dare in pasto un pettegolezzo migliore"
        costo: 0
        requisiti: [informazioni.pettegolezzo >= 2]
        descrizione: "Due pettegolezzi verificati, fatti girare nei posti giusti. La città ha bisogno di una storia, e può anche non essere la tua."
        esito:
          titolo: Un'altra storia
          testo: |
            Scegli con cura a chi raccontare le due storie, perché certe bocche
            portano più lontano di altre.

            {conoscenze-della-strada Media} La lavandaia del Mercato per i Ponti, il
            barbiere per la Città Bassa. Le serve dei Quartieri Alti arrivano da sole,
            basta lasciarle origliare. Nel giro di tre giorni al Mercato dei Nodi non
            si parla d'altro, e le stesse persone che ridevano di te adesso abbassano
            la voce su qualcun altro.

            Ti rimane addosso una sensazione sgradevole, quella di chi ha
            spostato un peso sulle spalle di un vicino. Il tuo nome, intanto,
            ha smesso di girare.
          effetti: { informazioni.pettegolezzo: -2 }
          imposta: { scandalo: 4 }
      - testo: "Chiedere al Velo di coprirti"
        costo: 0
        requisiti: [rep.velo >= 1]
        descrizione: "Padre Vantes può farsi vedere al tuo fianco sui gradini della Cattedrale. È un favore che la Confraternita non dimentica."
        esito:
          titolo: Una mano sul braccio
          immagine: personaggi/padre-vantes
          testo: |
            Dopo la funzione della sera Padre Aurelio Vantes scende con te i
            gradini della Cattedrale, davanti alla folla che esce. Ha l'abitudine
            di toccare chi gli parla, e ti tiene la mano sul braccio per tutta la
            scalinata, parlandoti come a un fedele di vecchia data. La sua mano
            è calda e asciutta, e senti gli sguardi della folla scivolarti
            addosso e cambiare idea.

            In città non serve altro. Alla Cattedrale però ogni favore finisce
            negli archivi di Ottilia Sanvel, e il tuo adesso è scritto lì.
          effetti: { rep.velo: -2 }
          imposta: { scandalo: 4 }
      - testo: "Chiedere alla Gilda di coprirti"
        costo: 0
        requisiti: [rep.gilda >= 1]
        descrizione: "Un funzionario della Casa dei Nodi può accompagnarti per il Mercato e far sapere che i tuoi conti sono in ordine."
        esito:
          titolo: I conti in ordine
          immagine: fazioni/gilda-dei-mercanti
          testo: |
            Il funzionario della Casa dei Nodi ti accompagna lungo il Mercato
            dei Nodi a metà mattina, quando i banchi sono più affollati. Ha le
            maniche di seta protette da due manicotti di tela, per l'inchiostro.
            Si ferma da ogni mercante che ti ha negato credito e gli ricorda,
            con la cortesia della Gilda, che i tuoi conti sono in regola.

            I mercanti capiscono al volo, e il credito torna. La Casa dei Nodi
            però registra ogni favore che fa, e adesso ne ha uno a tuo nome.
          effetti: { rep.gilda: -2 }
          imposta: { scandalo: 4 }
      - testo: "Chiedere ai Castaldi di coprirti"
        costo: 0
        requisiti: [rep.castaldi >= 1]
        descrizione: "Marella Castaldi decide chi siede alle cene del Maniero nei giorni di consiglio. Un posto a quella tavola chiude molte bocche."
        esito:
          titolo: Un posto a tavola
          immagine: personaggi/marella-castaldi
          testo: |
            Marella Castaldi ti fa sedere alla cena del giorno di consiglio, due
            posti più in là della Rappresentante, sotto gli occhi delle famiglie
            dei Quartieri Alti. Non accenna mai alla tua storia, e nessuno dei
            commensali ha il coraggio di farlo al posto suo.

            {galateo Media} Due posti più in là della Rappresentante è il posto
            degli amici di famiglia. Marella ti ha messo lì perché lo vedano
            tutti, e perché lo veda anche tu.

            Il giorno dopo la tua storia vale molto meno. Marella, congedandoti,
            ti ricorda senza sorridere che a quella tavola si parla di Stato e
            mai dei Castaldi, e che da stasera tu sei una faccenda dei Castaldi.
          effetti: { rep.castaldi: -2 }
          imposta: { scandalo: 4 }
      - testo: "Chiedere alla Maison di coprirti"
        costo: 0
        requisiti: [rep.maison >= 1]
        descrizione: "Nerissa Dalvane conosce i pettegolezzi di mezza città e sa come correggerli. La discrezione della Maison, però, ha un prezzo."
        esito:
          titolo: La versione della Maison
          immagine: personaggi/nerissa-dalvane
          testo: |
            Nerissa Dalvane ti ascolta nel salotto rosso della Maison des Lunes
            senza interromperti, girando piano il cucchiaino nella tazza senza
            mai berne. Poi ti dice che la tua storia ha un buco, e che la gente
            dimentica più volentieri quello che non torna.

            Nei giorni seguenti i clienti della Maison cominciano a raccontarne
            un'altra versione più noiosa e più credibile, e le due storie si
            consumano a vicenda. Nerissa non ti chiede niente in cambio. Alla
            Maison però il tuo nome è finito fra quelli che le devono qualcosa.
          effetti: { rep.maison: -2 }
          imposta: { scandalo: 4 }
      - testo: "Sparire sotto i Ponti"
        costo: 0
        descrizione: "Niente da spendere e nessuno da cui farti coprire. Scendi fra le travi dei sottoponti e aspetti che la città trovi un altro argomento."
        esito:
          titolo: Fra le travi
          testo: |
            Scendi per una scala di corda dietro un banco del Mercato dei Nodi,
            dove nessun Custode di Passaggio guarda. Sotto le assi c'è un'altra
            città fatta di reti e di tela cerata. Il vento della Cicatrice ti
            arriva addosso senza niente che lo fermi, e i denti ti battono
            prima che tu te ne accorga.

            Una donna seduta davanti a un braciere ti squadra e ti fa segno di
            sederti. Qui nessuno ha sentito la strofa delle osterie.

            {resistenza Facile fallita} Il freddo trova subito tutte le
            cuciture della giubba, e scopri di averne più di quante pensassi.
          vai: ostracismo

  - id: ostracismo-reti
    titolo: Le reti sotto il Mercato
    area: ostracismo
    ripetibile: true
    luogo: Sottoponti
    immagine: ambientazione/mercato-dei-nodi
    sommario: "Sotto il Mercato dei Nodi le reti raccolgono quello che cade dai banchi. Chi ci arriva prima se lo tiene."
    testo: |
      Sotto il Mercato dei Nodi gli abitanti dei sottoponti hanno teso reti
      larghe fra una trave e l'altra, e ci finisce dentro tutto quello che cade
      dai banchi di sopra. Sono mele ammaccate e rocchetti di filo, a volte una
      moneta e una volta, dicono, un anello con la pietra, che chi lo racconta
      indica sempre al dito di qualcun altro. Le reti però sono lontane dalle
      passerelle e oscillano a ogni raffica, e a guardarle ti si contraggono le
      dita dei piedi.

      {acrobazia Media} Le travi hanno una parte buona e una parte marcia, e
      la buona è quella più scura, dove il legno è ancora unto di catrame.
      Metti i piedi lì e tieni le ginocchia morbide.

      {origine figlio-del-circolo} Nel Bosco di Velthar hai camminato su rami
      più stretti di queste travi, anche se sotto c'era il muschio e non la
      Cicatrice. Il corpo si ricorda l'equilibrio, e la testa fa fatica a
      stargli dietro.

      Per arrivarci bisogna camminare sulle travi con le braccia larghe e
      fidarsi dei nodi di chi le ha legate. Chi riporta qualcosa lo divide con
      il braciere comune e si guadagna un posto più vicino al fuoco.
    opzioni:
      - testo: "Camminare fino alle reti"
        descrizione: "Una trave, il vento di traverso e niente sotto per un bel tratto."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Facile }
        successo:
          titolo: Un sacco pieno
          testo: |
            Arrivi alla rete più lontana e ci trovi una forma di formaggio
            quasi intera, rotolata giù da un banco durante la notte, con
            l'impronta di un morso di topo su un fianco. Torni sulla passerella
            con il sacco in spalla, e al braciere qualcuno ti fa posto senza che
            tu debba chiederlo.
          effetti: { recupero.ostracismo: 1 }
        fallimento:
          titolo: Mezza trave
          testo: |
            A metà trave una raffica ti piega sulle ginocchia e resti
            aggrappato al legno finché non passa, con il cuore che batte nelle
            orecchie e le unghie piantate nel catrame. Torni indietro con le
            mani vuote. Al braciere nessuno ti prende in giro, e qualcuno ti
            passa lo stesso una mela ammaccata.
          effetti: { recupero.ostracismo: 0.5 }

  - id: ostracismo-braciere
    titolo: Il braciere di Mamma Tesh
    area: ostracismo
    ripetibile: true
    luogo: Sottoponti
    immagine: ambientazione/ponti-sospesi
    sommario: "La sera, intorno al braciere di Mamma Tesh, ognuno paga il suo posto con una storia o con un favore."
    testo: |
      Sulla piattaforma più larga dei sottoponti, dove un pilone del Ponte delle
      Mille Corde fa da riparo contro il vento, Mamma Tesh tiene acceso un
      braciere ricavato da un vecchio elmo rovesciato, che lei chiama il
      Capitano e rimprovera a mezza voce quando fa troppo fumo. È una donna
      piccola, con le mani annerite, che ha vissuto sotto le travi più a lungo
      di chiunque altro. La sera ci si siede intorno al fuoco e ognuno paga il
      suo posto come può. Qualcuno porta legna, qualcun altro racconta cosa ha
      sentito di sopra. Chi non porta niente si siede più lontano, dove il vento
      della Cicatrice arriva pieno.

      {resistenza Facile} Più lontano vuol dire due passi. Due passi, quaggiù,
      sono la differenza fra dormire e restare svegli a tremare.
    opzioni:
      - testo: "Guadagnarti un posto vicino al fuoco"
        descrizione: "Raccontare bene una storia, oppure sapere a chi chiedere quello che manca."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, espressivita], difficolta: Media }
        successo:
          titolo: Vicino al fuoco
          testo: |
            Racconti la storia di come sei finito quaggiù, e la racconti in modo da
            far ridere anche te, con le pause dove servono e la tua faccia peggiore
            nel punto giusto. Mamma Tesh ride più forte di tutti, mostrando i tre
            denti che le restano, poi batte due volte la mano sull'asse accanto a sé.
            «Qua, qua, che il Capitano scalda meglio da questa parte» dice. Nei giorni
            seguenti la gente dei sottoponti ti saluta per nome, e il tuo nome quaggiù
            non ha niente a che fare con quello che si dice sul ponte.
          effetti: { recupero.ostracismo: 1 }
        fallimento:
          titolo: In fondo al cerchio
          testo: |
            La storia ti esce storta, e a metà ti accorgi che nessuno ascolta
            più e senti il caldo salirti alle orecchie. Qualcuno sbadiglia
            senza nemmeno coprirsi la bocca. Resti in fondo al
            cerchio, dove il calore arriva appena. Mamma Tesh però ti passa la
            scodella per ultimo, piena come quella degli altri.
          effetti: { recupero.ostracismo: 0.5 }

  - id: ostracismo-assi
    titolo: Quello che passa fra le assi
    area: ostracismo
    ripetibile: true
    luogo: Sottoponti
    immagine: ambientazione/ponti-sospesi
    sommario: "Dal sottoponte si sente tutto quello che si dice sul Ponte delle Mille Corde. Anche di te."
    testo: |
      Se ti stendi su un tavolato proprio sotto il Ponte delle Mille Corde,
      senti ogni parola che si dice di sopra. Le assi sono vecchie e le fessure
      larghe un dito, e fra una fessura e l'altra passano i prezzi del Mercato,
      le liti dei carrettieri e i pettegolezzi dei Quartieri Alti portati giù
      dalle serve, che per chiacchierare si fermano sempre sulla stessa asse,
      l'unica che non scricchiola. Ogni tanto passa anche il tuo nome.

      {furtivita Facile} Da quaggiù senti tutto, e nessuno di sopra pensa
      mai di abbassare la voce sopra un pavimento.

      Ascoltando con pazienza puoi capire chi continua a raccontare la tua
      storia e quando la gente comincia a stancarsene.
    opzioni:
      - testo: "Ascoltare il ponte"
        descrizione: "Distinguere le voci, ricordare chi dice cosa e seguire la tua storia mentre si consuma."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Un'altra storia di sopra
          testo: |
            Dopo mezza giornata sul tavolato, con la schiena indolenzita dalle assi e
            un ragno che ti ha scelto come casa, hai capito due cose. La tua storia la
            tiene viva un solo venditore di funi, che la racconta a ogni cliente, e da
            ieri sul ponte si parla soprattutto di un carico di sale sparito dai
            magazzini della Casa dei Nodi. Il tuo nome passa sempre più di rado.
          effetti: { recupero.ostracismo: 1 }
        fallimento:
          titolo: Voci confuse
          testo: |
            Il vento copre metà delle parole e i carretti l'altra metà. Senti il
            tuo nome un paio di volte, ma non riesci a capire chi lo dice né in
            che tono, e ogni volta ti immagini il peggio. Scendi dal tavolato
            con il collo indolenzito.
          effetti: { recupero.ostracismo: 0.5 }

  - id: ostracismo-uscita
    titolo: Un altro argomento
    area: ostracismo
    requisiti: [recupero.ostracismo >= 4]
    luogo: Sottoponti
    immagine: ambientazione/ponti-sospesi
    sommario: "Sul ponte non si parla più di te. È il momento di tornare di sopra."
    testo: |
      Stamattina hai ascoltato il ponte per un'ora intera e il tuo nome non è
      passato nemmeno una volta. La strofa delle osterie l'hanno sostituita con
      un'altra, sul sale sparito dalla Casa dei Nodi, e il venditore di funi ha
      trovato un nuovo cliente da prendere in giro. La città ha un altro
      argomento, e tu ti scopri quasi offeso.

      {espressivita Facile} La strofa nuova ha la stessa musica della tua.
      Nelle osterie cambiano le parole, e la melodia resta.

      Mamma Tesh se n'è accorta prima di te. Ti ha lavato la camicia buona nel
      secchio della pioggia e l'ha stesa ad asciugare su una fune, al vento
      della Cicatrice. «Di sopra si torna una volta sola» dice, «quindi scegli
      bene la scala, che qua, se torni, ricominci dal fondo del cerchio.» Quando
      te la infili, la camicia è rigida di vento e ti sembra più larga di quanto
      ricordassi.

      {resistenza Media} Sei dimagrito. Le spalle si sono fatte dure a forza
      di funi, e la pancia è sparita a forza di scodelle mezze vuote.

      Ci sono tre modi per risalire. La scala di corda dietro il Mercato porta
      dritta al Ponte delle Mille Corde, in mezzo alla gente. Le funi dei
      carrettieri scendono fino alla Città Bassa, dove nessuno ti ha mai
      cantato una strofa. E se hai ancora un invito per i Quartieri Alti, puoi
      presentarti lassù vestito di nuovo.

      {origine rampollo-dei-quartieri-alti} Lassù nessuno ti chiederà dove
      sei stato, perché nei Quartieri Alti chi sparisce per qualche settimana
      è sempre stato in campagna. Lo sai perché l'hai sentito dire di altri, a
      cena, con lo stesso sorriso educato.
    opzioni:
      - testo: "Risalire sul Ponte delle Mille Corde"
        descrizione: "In pieno giorno e a faccia scoperta, in mezzo ai banchi che ridevano di te."
        esito:
          titolo: A faccia scoperta
          immagine: ambientazione/ponti-sospesi
          testo: |
            Sbuchi da dietro il banco del venditore di funi a mezzogiorno, con
            la camicia pulita e le mani ancora nere di corda, e la luce ti
            colpisce gli occhi come un secchio d'acqua. Lui ti riconosce e apre
            la bocca, poi la richiude. Attraversi il Mercato dei Nodi senza
            fretta, e nessuno intona la strofa delle osterie.
          imposta: { scandalo: 3, recupero.ostracismo: 0 }
          pe: { resilienza: 10 }
          vai: ponti-sospesi
      - testo: "Scendere per le funi fino alla Città Bassa"
        descrizione: "Le funi dei carrettieri calano fino alle rocce bluastre della Città Bassa. È una discesa lunga, ma in fondo nessuno ti aspetta."
        esito:
          titolo: Giù per le funi
          immagine: ambientazione/citta-bassa
          testo: |
            Ti cali lungo le funi dei carrettieri con i piedi incrociati sulla
            corda, come ti hanno insegnato sotto le travi. A metà discesa senti
            già i martelli della Città Bassa, e le mani non tremano più come la
            prima volta. Quando tocchi la roccia calda nessuno si volta a
            guardarti.
          imposta: { scandalo: 3, recupero.ostracismo: 0 }
          pe: { acrobazia: 10 }
          vai: citta-bassa
      - testo: "Presentarti ai Quartieri Alti"
        descrizione: "Con l'invito in tasca e un abito nuovo, ti fai vedere alle campane della sera come se non fossi mai sparito."
        requisiti: [invito >= 1]
        esito:
          titolo: Alle campane della sera
          immagine: ambientazione/quartieri-alti
          testo: |
            Spendi quello che hai per un abito decente e sali ai Quartieri Alti
            all'ora delle campane della sera, quando tutti escono a farsi
            vedere. Saluti per nome le persone che ti avevano chiuso la porta, e
            loro, colte di sorpresa, ti rispondono. Nessuno ti chiede dove sei
            stato, e tu ti tieni le mani nere di corda dietro la schiena.
          imposta: { scandalo: 3, recupero.ostracismo: 0 }
          pe: { galateo: 10 }
          vai: quartieri-alti

  # ------------------------------------------------------------ carte della fascia 5–7

  - id: carta-sospetto-cassetta
    titolo: Una cassetta da tenere
    tipo: carta
    area: ovunque
    requisiti: [sospetto >= 5, sospetto < 8, pista.pelle < 6]
    immagine: personaggi/mauro-scrocco
    sommario: "Mauro Scrocco ha una cassetta da nascondere, e secondo lui la casa di chi è già sorvegliato è il posto più sicuro."
    testo: |
      Un garzone della Pignatta Grassa ti porta un invito di Mauro Scrocco, e
      Mauro ti riceve al suo tavolo con un bicchiere già versato. Ha la pancia
      che arriva prima di lui e un vestito color zafferano, e parla abbastanza
      forte da farsi sentire dai tavoli vicini, anche quando le cose che dice
      non dovrebbe sentirle nessuno. Il vino è buono, ed è proprio questo a
      metterti in guardia.

      «Lo sa mezza città, amico mio, che ti tengono d'occhio» dice Mauro
      facendo girare il vino nel bicchiere. «Però una casa che la Caserma ha
      già rivoltato da tutte le parti, per un po', non la guarda più nessuno.
      È la cosa più riposante del mondo, amico mio, una casa già perquisita.»

      Con il piede spinge verso di te, sotto il tavolo, una cassetta di legno
      chiusa con un lucchetto, e ti chiede di tenerla qualche settimana senza
      aprirla e senza domandargli che cosa contiene.

      {percezione Media} La cassetta striscia sulle assi con un rumore
      pesante, e dentro qualcosa non si muove. Dev'essere metallo, molto
      metallo impacchettato con cura.
    opzioni:
      - testo: "Prendere la cassetta"
        descrizione: "Una buona ricompensa e la gratitudine degli Scuri. Se la Caserma bussa, però, la cassetta è in casa tua."
        esito:
          titolo: Sotto il pavimento
          testo: |
            Nascondi la cassetta sotto un'asse del pavimento, e rimetti i chiodi con
            il tacco dello stivale. La notte, quando giri nel letto, ti pare di
            sentirla. Due volte in una settimana incroci la stessa guardia all'angolo
            della tua strada, e la seconda volta ti saluta.

            Mauro ti manda le monete in un sacchetto di spezie, con un biglietto
            di ringraziamento scritto da un'altra mano. Per giorni le monete
            sanno di cannella.
          effetti: { monete: 15, rep.scuri: 0.5, sospetto: 1 }
      - testo: "Rimandare indietro la cassetta"
        descrizione: "Hai già abbastanza guardie alla porta. Mauro la prenderà male, anche se continuerà a chiamarti amico mio."
        esito:
          titolo: Gentilezza
          testo: |
            Spingi la cassetta indietro con il piede. Mauro la guarda tornare
            verso di lui come si guarda un piatto rimandato in cucina. Poi
            sorride e ti riempie di nuovo il bicchiere fino all'orlo, così che
            tu non possa alzarlo senza versarlo. Ti accompagna fino alla porta
            tenendoti una mano sulla spalla, e la mano pesa più del necessario.
          effetti: { rep.scuri: -0.5 }

  - id: carta-sospetto-due-parole
    titolo: Due parole in Caserma
    tipo: carta
    area: ovunque
    requisiti: [sospetto >= 5, sospetto < 8]
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "Un vice-sceriffo ti propone di passare in Caserma a chiarire la tua posizione, finché sei in tempo."
    testo: |
      Un vice-sceriffo ti affianca per strada e cammina al tuo passo per un
      tratto, come se foste vecchi conoscenti. È giovane, con l'armatura
      troppo lucida e un taglietto da rasoio ancora fresco sotto il mento, e
      parla guardando davanti a sé. Il cuore ti accelera prima che tu decida
      se ce n'è motivo.

      {armi-da-mischia Facile} La spada che porta al fianco non ha un graffio
      sull'elsa. Non l'ha mai sguainata fuori da una sala d'armi.

      «Il tuo nome è sulla lista dello sceriffo, diciamo verso il fondo, per
      adesso» dice. «Se passi in Caserma e rispondi a qualche domanda, magari
      scende ancora. Se ci porti qualcosa di utile, scende di sicuro.»

      Si ferma all'angolo e ti lascia andare avanti da solo. Sai dove trovarlo,
      e lui sa dove trovare te.
    opzioni:
      - testo: "Rispondere alle domande del sergente"
        descrizione: "Un'ora al banco della Caserma, a raccontare la tua versione senza contraddirti."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Più in basso nella lista
          testo: |
            Il sergente ti fa sedere e scrive mentre parli, con la lingua fra i
            denti. A ogni risposta fa una domanda in più, e tu le reggi tutte
            con le mani ferme sulle ginocchia. Alla fine gira il foglio
            verso di te perché tu firmi, e intanto borbotta che almeno tu non
            gli hai fatto perdere tempo.
          effetti: { sospetto: -1 }
        fallimento:
          titolo: Una domanda di troppo
          testo: |
            Alla terza domanda ti contraddici su un orario, e il sergente se ne
            accorge subito. Ti senti il sudore freddo sotto le ascelle. Lui resta
            zitto e scrive più a lungo di quanto abbia parlato tu. Esci dalla Caserma
            senza sapere se la tua posizione sia migliorata o peggiorata.
          effetti: {}
      - testo: "Portare qualche voce di vicolo"
        requisiti: [informazioni.voce >= 3]
        descrizione: "Tre voci raccolte in giro valgono qualcosa, per una Caserma che conta i passi degli Scuri."
        esito:
          titolo: Voci utili
          testo: |
            Il vice-sceriffo ascolta le tue voci in un angolo del cortile,
            annuendo a ognuna con la serietà di uno scolaro. Due le conosceva
            già, e la terza lo fa sorridere fino alle orecchie.
            Ti riaccompagna al portone e ti dice che per un po', diciamo, non
            vedrai guardie sotto casa tua.
          effetti: { informazioni.voce: -3, sospetto: -1 }

  - id: carta-scandalo-farsa
    titolo: Una parte per te
    tipo: carta
    area: ovunque
    requisiti: [scandalo >= 5, scandalo < 8]
    immagine: personaggi/orazio-belcanto
    sommario: "Orazio Belcanto vuole mettere in scena la tua storia al Teatro delle Meraviglie. Paga bene, e ti offre anche la parte."
    testo: |
      Orazio Belcanto ti ferma in mezzo alla strada con tutte e due le mani,
      e ogni dito porta un anello. È l'impresario del Teatro delle Meraviglie e
      parla con la voce un poco più alta del naturale, come se recitasse anche
      adesso.

      «La tua storia la conosce tutta la città, e la città la racconta male»
      dice. «È materia, materia buona sprecata in bocca ai dilettanti. Io ne
      faccio una farsa in tre atti e la racconto bene.» Ha l'alito dolce di
      pastiglie alla menta, e ti tiene ancora per le maniche.

      Ti mette in mano un biglietto da visita profumato e ti spiega che paga
      chi gli porta i dettagli giusti, e il doppio a chi ha il coraggio di
      interpretare sé stesso. Il profumo del biglietto ti resta sulle dita
      per tutta la mattina.

      {politica-ed-economia Media} Una farsa sul tuo nome riempie il teatro
      per una stagione, e a lui frutta molto più di quanto offre a te. Ti
      sta comprando a prezzo di saldo.
    opzioni:
      - testo: "Raccontargli tutto"
        descrizione: "Una buona paga per i dettagli. Poi la città riderà di te a teatro, e con i dettagli giusti."
        esito:
          titolo: Tutto esaurito
          testo: |
            Orazio ti ascolta prendendo appunti con una matita d'argento, ride nei
            punti sbagliati e ti paga sull'unghia. Due settimane dopo la farsa è in
            cartellone, e per tutta la stagione si fa sempre il tutto esaurito. Da
            allora la gente per strada ti saluta con le battute del secondo atto.
          effetti: { monete: 20, scandalo: 1 }
      - testo: "Recitare la tua parte"
        descrizione: "Salire sul palco del Teatro delle Meraviglie e fare di te stesso un personaggio. Se il pubblico ride con te, forse smette di ridere di te."
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: Applausi
          testo: |
            Sul palco scopri che sai prenderti in giro meglio di chiunque altro.
            Le gambe ti tremano fino alla seconda battuta, poi smettono. Il
            pubblico ride con te dall'inizio alla fine, e al terzo atto ti
            applaude. Orazio ti paga il doppio come promesso e, stringendoti le
            maniche con le dita inanellate, ti chiede se hai altre disgrazie da
            raccontare. La storia ormai gira lo stesso, ma adesso è una
            commedia.
          effetti: { monete: 40, scandalo: 0.5 }
        fallimento:
          titolo: Fischi
          testo: |
            A metà del primo atto dimentichi una battuta, e la bocca ti si asciuga di
            colpo. Il pubblico capisce che stai soffrendo davvero, e ride più forte
            che mai. Orazio ti paga lo stesso, perché la serata è stata un successo, e
            ti dice che gli attori veri si trovano, mentre le disgrazie vere no.
          effetti: { monete: 20, scandalo: 1 }

  - id: carta-scandalo-feriti
    titolo: Le cure pubbliche
    tipo: carta
    area: ovunque
    requisiti: [scandalo >= 5, scandalo < 8]
    immagine: fazioni/confraternita-del-velo
    sommario: "Il Velo cerca braccia per le cure pubbliche della Cattedrale. Una buona azione, sotto gli occhi di tutti."
    testo: |
      Sulla porta di una cappella è inchiodato un avviso della Confraternita
      del Velo. Padre Vantes cerca volontari per le cure pubbliche della
      settimana, quando la Cattedrale apre le porte a chi non può pagare un
      medico. Servono braccia per portare le barelle e per tenere fermi i
      feriti mentre le sorelle li ricuciono, e servono monete per le bende.

      In fondo all'avviso c'è una riga aggiunta a mano, con un inchiostro più
      scuro e le lettere più grandi del resto. I nomi dei volontari e dei
      benefattori saranno letti alla liturgia della sera, davanti a tutta la
      navata.

      {origine accolito-del-velo} Le cure pubbliche le conosci dalla parte
      delle barelle, e la riga in fondo l'ha voluta qualcuno che conosce i
      fedeli meglio delle ferite. In Cattedrale nessuno lo dice ad alta voce,
      ma un nome letto in navata porta più offerte di una predica.

      {atletica Facile} Una barella si porta con le gambe, tenendo la
      schiena dritta. Dopo la decima, comunque, la schiena dirà la sua.
    opzioni:
      - testo: "Portare le barelle"
        descrizione: "Una giornata intera fra i feriti, sotto gli occhi della città."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Facile }
        successo:
          titolo: Il tuo nome in navata
          testo: |
            Passi la giornata fra barelle e bacinelle, e alla sera hai le maniche
            macchiate fino al gomito e le braccia che tremano quando alzi il
            cucchiaio. Un vecchio Raschiatore ti stringe la mano per averlo tenuto
            fermo mentre gli cucivano la gamba, con una stretta che ti fa male alle
            nocche. Alla liturgia leggono il tuo nome, e chi ti conosceva per la tua
            storia adesso ti conosce anche per questa.
          effetti: { scandalo: -1, rep.velo: 0.5 }
        fallimento:
          titolo: Riconosciuto
          testo: |
            A metà mattina una donna in fila ti riconosce e lo dice ad alta
            voce, indicandoti con il mento perché ha le mani occupate da un
            bambino, e per il resto del giorno i feriti ti guardano più di
            quanto guardino le sorelle. Finisci il lavoro comunque. Alla liturgia
            leggono il tuo nome, e dalla navata sale una risatina.
          effetti: {}
      - testo: "Pagare le bende"
        requisiti: [monete >= 25]
        descrizione: "Un'offerta generosa, e il tuo nome letto fra quelli dei benefattori."
        esito:
          titolo: Fra i benefattori
          testo: |
            Lasci l'offerta a una sorella con i capelli rasati, che la conta
            sull'abaco e scrive il tuo nome in un registro. Alla liturgia della
            sera il tuo nome viene letto fra quelli dei benefattori, subito dopo
            un mercante della Gilda che ha dato il doppio e che si volta a
            vedere chi sei.
          effetti: { monete: -25, scandalo: -1 }
