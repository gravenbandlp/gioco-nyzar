# Crisi delle Ferite e del Tormento, con le aree di penalità della Cattedrale del Velo
# (Regolamento v0.4, sezione 5 e integrazione): convalescenza (infermeria e Giardini della
# Linfa) e delirio (celle della Cattedrale). In fondo le carte della fascia 5–7.

aree:
  - id: convalescenza
    nome: Convalescenza
    immagine: ambientazione/cattedrale-del-velo
    penalita: true
    testo: |
      L'infermeria della Cattedrale del Velo occupa la navata laterale a nord,
      con le brande in due file così vicine che fra l'una e l'altra passa
      appena un catino. Le cure le dirige Padre Aurelio Vantes, con l'accolita
      Nadja Oresca che porta la minestra, mentre le dimissioni le decide da
      sola Ottilia Sanvel, la monaca responsabile. Da una porta bassa in fondo
      si esce nei Giardini della Linfa di Sorella Giulia. Finché Ottilia non
      firma il tuo congedo, il portone per te resta chiuso.

  - id: delirio
    nome: Delirio
    immagine: fazioni/confraternita-del-velo
    penalita: true
    testo: |
      Le celle della Cattedrale stanno sotto il chiostro, in fondo a dodici
      gradini, sei stanze strette imbiancate a calce dove il Velo tiene chi ha
      visto o sentito troppo. In una come la tua morì Mirn il Sordo. Il giorno
      passa con le campane delle ore sacre. All'alba Ottilia Sanvel fa
      esercitare nel corridoio novizi e ricoverati, e la sera a volte Sorella
      Celia suona il liuto per le celle. Padre Vantes, che tiene la chiave,
      scende ogni giorno a guardare dalla grata.

quality:
  - { id: recupero.convalescenza, nome: Recupero in convalescenza, categoria: stato, descrizione: "Quanto ti sei rimesso in forze nell'infermeria della Cattedrale. Quando arriva a 4, Ottilia Sanvel può firmare il tuo congedo." }
  - { id: recupero.delirio, nome: Recupero dal delirio, categoria: stato, descrizione: "Quanta calma hai ritrovato nelle celle della Cattedrale. Quando arriva a 4, Padre Vantes può riaprirti la porta." }

storylet:
  # ================================================================ FERITE
  - id: crisi-ferite
    titolo: Il corpo non regge più
    tipo: crisi
    area: citta-bassa
    requisiti: [ferite >= 8]
    immagine: ambientazione/dispensa-di-gramm
    sommario: "Le ferite si sono sommate l'una all'altra, e stamattina le gambe non ti reggono."
    testo: |
      Ti svegli sul pavimento e non ricordi di esserti sdraiato. La camicia è
      incollata al fianco dove la ferita si è riaperta durante la notte, e
      quando la stacchi ti esce un verso che non sapevi di avere. Le bende di
      ieri sera sono già scure.

      {medicina Facile} Il bordo della ferita è caldo e gonfio, e il rosso si
      allarga verso l'ombelico. Questa non si chiude più da sola.

      {origine fuggiasco-di-ghoran} A Ghoran un corpo messo così lo spingevano
      in fondo alla fila, perché sulla bilancia valeva meno.

      *Domani mi fermo, l'ho detto anche ieri e l'altro ieri.* Adesso bisogna
      scegliere in fretta, prima che le gambe decidano per te.

      Nel retro della Dispensa di Gramm tengono una pasta nera per i casi
      gravi che chiude le ferite in una notte. Costa cara, e alla Dispensa non
      si fa credito. Puoi anche stringere i denti e rimetterti in piedi da
      solo, bruciando in pochi giorni la forza messa da parte con mesi di
      fatica. Infine c'è l'infermeria della Cattedrale del Velo, che dopo la
      razzia accoglie chiunque arrivi in barella e ti rimette in sesto gratis,
      anche se a decidere quando potrai uscire saranno i sacerdoti.
    opzioni:
      - testo: "Pagare Nestor Gramm"
        immagine: personaggi/nestor-gramm
        costo: 0
        quando: [pista.pelle < 4, colpo.dispensa == 0]
        requisiti: [monete >= 40]
        descrizione: "Trascinarti fino alla Dispensa e contare il prezzo sul bancone. Nessuno sa cosa ci sia nella pasta nera."
        esito:
          titolo: La pasta nera
          testo: |
            Nestor ti guarda la ferita senza toccarla e conta le monete due volte.
            La pasta che ti spalma sul fianco puzza di zolfo e brucia fino a farti
            lacrimare. «Stanotte dormi seduto» dice, «perché se ti sdrai si
            riapre, e io la stessa ferita la ricucio una volta sola.» Il mattino
            dopo la febbre è scesa, e per due giorni i cani ti seguono per strada.
          effetti: { monete: -40 }
          imposta: { ferite: 4 }
      - testo: "Pagare la pasta nera al garzone della Dispensa"
        immagine: ambientazione/dispensa-di-gramm
        costo: 0
        quando: [colpo.dispensa >= 1]
        requisiti: [monete >= 40]
        descrizione: "I barattoli di Nestor Gramm sono rimasti alla Dispensa, e il suo garzone li vende allo stesso prezzo."
        esito:
          titolo: La pasta nera
          testo: |
            Alla porta del vicolo ti apre il garzone, con il grembiule di Nestor
            che gli arriva alle caviglie. Conta le monete due volte, come faceva
            il padrone, e ti spalma sul fianco una pasta che puzza di zolfo e
            brucia fino a farti lacrimare. «Il padrone diceva che la prima notte
            si dorme seduti» recita. Il mattino dopo la febbre è scesa e riesci a
            stare in piedi.
          effetti: { monete: -40 }
          imposta: { ferite: 4 }
      - testo: "Pagare la pasta nera al garzone della Dispensa"
        immagine: ambientazione/dispensa-di-gramm
        costo: 0
        quando: [pista.pelle >= 4, colpo.dispensa == 0]
        requisiti: [monete >= 40]
        descrizione: "I barattoli di Nestor Gramm sono rimasti alla Dispensa, e il suo garzone li vende allo stesso prezzo."
        esito:
          titolo: La pasta nera
          testo: |
            Alla porta del vicolo ti apre il garzone, con il grembiule di Nestor
            che gli arriva alle caviglie. Conta le monete due volte, come faceva
            il padrone, e ti spalma sul fianco una pasta che puzza di zolfo e
            brucia. «Il padrone diceva che la prima notte si dorme seduti» recita.
            Il mattino dopo la febbre è scesa e riesci a stare in piedi.
          effetti: { monete: -40 }
          imposta: { ferite: 4 }
      - testo: "Stringere i denti"
        costo: 0
        requisiti: [pe.resistenza >= 10]
        descrizione: "Chiuderti in casa e rimetterti in piedi da solo. Perdi tutti i PE accumulati in Resistenza."
        esito:
          titolo: Tre giorni di febbre
          testo: |
            Passi tre giorni sulla branda con una brocca d'acqua e le imposte
            chiuse, e nel mezzo della febbre parli con persone che non ci sono.
            Quando finalmente ti alzi le ferite si sono chiuse, ma il fiato che
            avevi guadagnato con mesi di fatica se n'è andato con la febbre.
          imposta: { ferite: 4, pe.resistenza: 0 }
      - testo: "Farti portare in Cattedrale"
        immagine: ambientazione/cattedrale-del-velo
        costo: 0
        descrizione: "Lasciare che due portatori del Velo ti carichino su una barella. In infermeria resterai finché non ti dimettono."
        esito:
          titolo: In barella
          testo: |
            Due portatori del Velo ti portano su per le scale dei Quartieri Alti,
            e uno dei due conta i gradini a mezza voce per tenere il passo. Quando
            riapri gli occhi sei sotto una volta di pietra, e una voce calma legge
            il tuo nome da una tavoletta di cera.
          vai: convalescenza

  - id: convalescenza-giro
    titolo: Il giro del mattino
    area: convalescenza
    ripetibile: true
    immagine: personaggi/padre-vantes
    sommario: "Padre Vantes passa fra le brande e oggi vuole vederti camminare fino all'altare."
    testo: |
      Padre Vantes arriva con il giro del mattino, un uomo snello dagli occhi
      grigio chiaro, e si ferma alla tua branda ad ascoltarti il polso a occhi
      chiusi. «Oggi voglio vederti camminare fino all'altare e ritorno» dice.
      «Senza appoggiarti alle colonne, per favore.»

      In fondo alla navata il cristallo rosso sull'altare pulsa al ritmo delle
      ore, e da qui sembra molto più lontano di sessanta passi.

      {origine allievo-di-torvessa} Pulsa con una regolarità che all'Accademia
      farebbe invidia a qualunque banco di prova.
    opzioni:
      - testo: "Camminare fino all'altare"
        descrizione: "Sono sessanta passi all'andata e altrettanti al ritorno, con tutti i ricoverati che ti guardano dalle brande."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Facile }
        successo:
          titolo: All'altare e ritorno
          testo: |
            Arrivi all'altare con la fronte bagnata e torni indietro più piano
            di come sei partito, con il cristallo rosso che ti pulsa alle
            spalle. Padre Vantes annuisce e scrive qualcosa sulla tua
            tavoletta.
          effetti: { recupero.convalescenza: 1 }
        fallimento:
          titolo: A metà navata
          testo: |
            A metà navata le ginocchia cedono senza chiederti il permesso e ti ritrovi
            seduto sulla pietra fredda, e tre ricoverati guardano altrove con impegno.
            Il novizio ti riaccompagna alla branda, e Vantes ti dice che domani ci
            riproverete.
          effetti: { recupero.convalescenza: 0.5 }

  - id: convalescenza-giardini
    titolo: Fra le aiuole della Linfa
    area: convalescenza
    ripetibile: true
    immagine: personaggi/sorella-giulia
    sommario: "Sorella Giulia ha bisogno di qualcuno che scelga le foglie buone per gli impiastri dell'infermeria."
    testo: |
      Nei Giardini della Linfa le foglie mandano una luce tenue. Sorella Giulia
      cammina fra le aiuole con il palmo aperto, e un passero le si posa sulla
      mano. Ti fa sedere accanto a un cesto di foglie da dividere, le sane per
      gli impiastri e quelle con la ruggine da bruciare.

      {natura Media} La ruggine comincia dal rovescio, lungo la nervatura.

      {origine figlio-del-circolo} Quel palmo aperto al Circolo lo insegnano ai
      bambini, per gli uccelli del Bosco.

      «Gli uccelli le distinguono subito» dice, e ti chiede di provare a
      guardarle come farebbero loro.
    opzioni:
      - testo: "Scegliere le foglie"
        descrizione: "Separare le foglie sane da quelle malate, una per una, sotto lo sguardo paziente di Sorella Giulia."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Il cesto giusto
          testo: |
            Alla fine del pomeriggio hai due mucchi ordinati e le dita verdi fino alle
            nocche. Sorella Giulia ne controlla una manciata e sposta una sola foglia.
            Stanotte, con l'impiastro sul fianco, dormi fino all'alba.
          effetti: { recupero.convalescenza: 1 }
        fallimento:
          titolo: La ruggine
          testo: |
            Sorella Giulia rovescia il tuo mucchio buono sul tavolo e ne tira
            fuori una dozzina di foglie arrugginite. Te le mostra una per una
            con pazienza e senza rimproveri, girandole controluce. Intanto il
            pomeriggio è passato lo stesso.
          effetti: { recupero.convalescenza: 0.5 }

  - id: convalescenza-corsia
    titolo: Il carrettiere della quarta branda
    area: convalescenza
    ripetibile: true
    immagine: personaggi/nadja-oresca
    sommario: "Nadja Oresca ha un ricoverato che rifiuta la minestra e spera che tu riesca a convincerlo."
    testo: |
      Nadja Oresca passa con la pentola e ti mette in mano una scodella calda.
      «Il carrettiere della quarta branda non mangia da due giorni» dice. «Si
      è rotto una gamba e si è convinto che non camminerà più. A me non dà
      retta perché porto il velo. A te magari sì.»

      L'uomo della quarta branda guarda il soffitto e fa finta di dormire.

      {empatia Facile} Fa finta male, con gli occhi aperti, e si vergogna di
      volere qualcuno accanto.

      {origine figlio-della-citta-bassa} Ti torna in mente il vecchio del
      carro del Festival, che chiamava tutti ragazzo mio.
    opzioni:
      - testo: "Parlare con il carrettiere"
        descrizione: "Sederti sul bordo della sua branda con la scodella e trovare le parole giuste."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Facile }
        successo:
          titolo: Mezza scodella
          testo: |
            Gli racconti delle tue ferite e di come ti sei rialzato, aggiungendone
            una inventata che suona meglio delle vere. Dopo un po' si tira su e
            mangia mezza scodella, e Nadja ti ringrazia con un proverbio in lingua
            antica che nessuno dei due capisce.
          effetti: { recupero.convalescenza: 1 }
        fallimento:
          titolo: La schiena voltata
          testo: |
            Il carrettiere si gira dall'altra parte senza risponderti, e la
            branda geme sotto di lui. Torni alla tua con la scodella ancora
            piena e la mangi tu, visto che ormai è fredda.
          effetti: { recupero.convalescenza: 0.5 }

  - id: convalescenza-uscita
    titolo: Il congedo di Ottilia
    area: convalescenza
    ripetibile: true
    requisiti: [recupero.convalescenza >= 4]
    immagine: personaggi/ottilia-sanvel
    sommario: "Ottilia Sanvel è venuta a firmare il tuo congedo e vuole sapere dove andrai."
    testo: |
      Ottilia Sanvel arriva alla tua branda, legge la tavoletta di cera e ti
      guarda le mani e le caviglie.

      {rissa Media} Ti guarda come un istruttore d'armi, le mani per la presa
      e le caviglie per l'appoggio.

      {origine accolito-del-velo} L'ultima volta che ti ha guardato così sei
      tornato dalla Città Bassa in barella.

      «Il letto serve a qualcun altro» dice, firmando il congedo. «Non tornare
      qui entro un mese.»

      Sorella Giulia si affaccia dalla porta dei Giardini con un fagotto di
      foglie per la Dispensa di Gramm. Una scala scende in Città Bassa, e il
      portico dà sui Quartieri Alti.
    opzioni:
      - testo: "Scendere a piedi in Città Bassa"
        descrizione: "Sono più di trecento gradini. Le gambe dovrebbero reggerti."
        esito:
          titolo: I trecento gradini
          testo: |
            Scendi la scala un gradino alla volta, e a metà ti fermi con la mano sul
            corrimano senza sederti. *Se mi siedo, mi riportano su in barella.* In
            fondo ti accoglie il fumo delle fucine, e non ti è mai sembrato così
            buono.
          imposta: { ferite: 3, recupero.convalescenza: 0 }
          pe: { resistenza: 10 }
          vai: citta-bassa
      - testo: "Portare le foglie a Nestor Gramm"
        descrizione: "Il fagotto di Sorella Giulia va alla Dispensa di Gramm, e lungo la strada lei ti spiega le foglie."
        quando: [pista.pelle < 4, colpo.dispensa == 0]
        esito:
          titolo: Il fagotto di Giulia
          testo: |
            Lungo la strada Sorella Giulia ti spiega quali foglie calmano la
            febbre e quali fermano il sangue. Alla Dispensa Nestor Gramm annusa il
            fagotto con il naso quasi dentro le foglie, poi ti fa un cenno che da
            lui vale come un ringraziamento.
          imposta: { ferite: 3, recupero.convalescenza: 0 }
          pe: { natura: 10 }
          vai: ponti-sospesi
      - testo: "Portare le foglie alla Dispensa di Gramm"
        descrizione: "Il fagotto di Sorella Giulia va alla Dispensa di Gramm, dove adesso al banco c'è il garzone di Nestor."
        quando: [colpo.dispensa >= 1]
        esito:
          titolo: Il fagotto di Giulia
          testo: |
            Lungo la strada Sorella Giulia ti spiega quali foglie calmano la
            febbre e quali fermano il sangue. Alla Dispensa il garzone annusa il
            fagotto come faceva Nestor, poi si fa ripetere le spiegazioni e se le
            segna sul grembiule con un carboncino, sbagliando l'ortografia di due
            foglie su tre.
          imposta: { ferite: 3, recupero.convalescenza: 0 }
          pe: { natura: 10 }
          vai: ponti-sospesi
      - testo: "Portare le foglie alla Dispensa di Gramm"
        descrizione: "Il fagotto di Sorella Giulia va alla Dispensa di Gramm, dove adesso al banco c'è il garzone di Nestor."
        quando: [pista.pelle >= 4, colpo.dispensa == 0]
        esito:
          titolo: Il fagotto di Giulia
          testo: |
            Lungo la strada Sorella Giulia ti spiega quali foglie calmano la
            febbre e quali fermano il sangue. Alla Dispensa il garzone annusa il
            fagotto come faceva Nestor, poi si fa ripetere le spiegazioni e se le
            segna con un carboncino sul grembiule, che ormai è più scritto che
            pulito.
          imposta: { ferite: 3, recupero.convalescenza: 0 }
          pe: { natura: 10 }
          vai: ponti-sospesi
      - testo: "Uscire dal portico sui Quartieri Alti"
        requisiti: [invito >= 1]
        descrizione: "Padre Vantes ti accompagna fuori insieme a una famiglia di benefattori venuta a visitare i feriti."
        esito:
          titolo: I benefattori
          testo: |
            Padre Vantes ti presenta ai benefattori come uno dei feriti che la
            loro offerta ha rimesso in piedi. Ringrazi con la schiena dritta e gli
            occhi bassi il giusto, e la signora ti stringe la mano con il guanto,
            che poi si pulisce sulla gonna.

            {origine rampollo-dei-quartieri-alti} La signora ti conosce di vista
            dai salotti, e il guanto se lo pulisce lo stesso, soltanto più in
            fretta.
          imposta: { ferite: 3, recupero.convalescenza: 0 }
          pe: { galateo: 10 }
          vai: quartieri-alti

  # ================================================================ TORMENTO
  - id: crisi-tormento
    titolo: Le voci restano
    tipo: crisi
    area: citta-bassa
    requisiti: [tormento >= 8]
    immagine: ambientazione/mito-occhio-nel-cristallo
    sommario: "Da tre notti non dormi, e le voci che senti non smettono più quando apri gli occhi."
    testo: |
      Da tre notti non dormi. Quando chiudi gli occhi senti sillabe brevi e
      regolari che arrivano da sotto il pavimento, e quando li riapri
      continuano ancora per qualche momento. Stamattina hai contato due volte
      le monete della borsa e ti sono venuti due numeri diversi, e a una
      donna che ti chiedeva la strada hai risposto con parole che non erano
      tue.

      {magia Difficile} Le sillabe hanno un passo, come una formula recitata
      da chi non sa più cosa voglia dire. Il Mana sotto il pavimento vibra
      alla stessa cadenza.

      Sotto i Ponti vive un vecchio Raschiatore che parla tutto il giorno con
      qualcuno che non c'è, e dicono che anche lui all'inizio sbagliava a
      contare le monete.

      {origine apprendista-raschiatore} Sulle piattaforme il nome di Mirn il
      Sordo si dice a bassa voce, e chi risale dai tunnel con le voci nelle
      orecchie lo guardano tutti allo stesso modo.

      Il Velo tiene veglie di notte per chi porta pesi che non si vedono, e
      un'offerta generosa compra un sacerdote che resta sveglio accanto a te
      fino all'alba. Puoi anche affrontare le voci con la disciplina che ti
      sei costruito, e consumarla tutta in una notte. Oppure puoi fare come
      Mirn il Sordo, e lasciare che la Confraternita ti chiuda in una cella
      della Cattedrale finché le voci non tacciono.
    opzioni:
      - testo: "Pagare una veglia al Velo"
        immagine: fazioni/confraternita-del-velo
        costo: 0
        requisiti: [monete >= 50]
        descrizione: "Lasciare l'offerta nella cassetta della Cattedrale e passare la notte in navata con un sacerdote che veglia per te."
        esito:
          titolo: La notte in navata
          testo: |
            Il sacerdote è giovane, con la voce roca di un raffreddore che cerca di
            non far sentire, e recita la preghiera della notte senza fretta,
            riprendendo dal punto esatto ogni volta che si ferma a bere. Verso l'alba
            ti accorgi che le voci tacciono da un'ora, e che ti eri addormentato con
            la testa contro la colonna.
          effetti: { monete: -50 }
          imposta: { tormento: 4 }
      - testo: "Affrontare le voci da solo"
        costo: 0
        requisiti: [pe.resilienza >= 10]
        descrizione: "Sederti al buio e ascoltare le voci finché si stancano. Perdi tutti i PE accumulati in Resilienza."
        esito:
          titolo: La notte al buio
          testo: |
            Resti seduto al buio con la schiena contro il muro e ascolti le voci
            senza rispondere, anche quando a notte fonda cominciano a chiamarti
            per nome. Una alla volta si allontanano. All'alba hai il collo rigido,
            e la disciplina che avevi messo da parte l'hai spesa tutta.
          imposta: { tormento: 4, pe.resilienza: 0 }
      - testo: "Consegnarti alla Confraternita"
        immagine: ambientazione/cattedrale-del-velo
        costo: 0
        descrizione: "Chiedere al Velo una cella e lasciare che ti chiudano dentro. Uscirai quando lo deciderà Padre Vantes."
        esito:
          titolo: Dodici gradini
          testo: |
            Due accoliti velati ti accompagnano sotto il chiostro senza toccarti.
            Conti i gradini ad alta voce, poi chiedi all'accolito se sono davvero
            dodici, e lui te lo conferma paziente, come avrà fatto con tanti altri
            prima di te. Dietro di te la porta si chiude con un rumore di ferro.
          vai: delirio

  - id: delirio-campane
    titolo: Le campane delle ore
    area: delirio
    ripetibile: true
    immagine: ambientazione/cattedrale-del-velo
    sommario: "Le campane delle ore sacre attraversano la volta, e se le conti tutte il giorno torna in piedi."
    testo: |
      Dalla feritoia vedi un rettangolo di cielo che cambia colore, e il
      resto del tempo lo scandiscono le campane delle ore sacre.

      {accademiche Facile fallita} Delle ore sacre ti torna in mente soltanto
      la compieta, perché suona come una cosa da mangiare.

      Un accolito ti ha lasciato un pezzo di carbone, e sotto le tacche del
      ricoverato di prima hai cominciato una fila tua. Il problema sono le
      voci, che fra un rintocco e l'altro contano anche loro, con numeri che
      non tornano mai con i tuoi.
    opzioni:
      - testo: "Contare le ore di un giorno intero"
        descrizione: "Segnare sulla parete ogni rintocco dall'alba alla compieta, senza perderne nessuno."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Facile }
        successo:
          titolo: Una fila completa
          testo: |
            La sera la tua fila di tacche è completa e coincide con quella del
            ricoverato di prima, tacca per tacca. Ti addormenti prima
            dell'ultima campana.
          effetti: { recupero.delirio: 1 }
        fallimento:
          titolo: Tacche in più
          testo: |
            Verso il pomeriggio ti accorgi di avere segnato tacche anche per
            rintocchi che nessuno ha suonato. Le cancelli con il pollice, che
            si annerisce di carbone, e ricominci da capo, più piano di prima.
          effetti: { recupero.delirio: 0.5 }

  - id: delirio-corridoio
    titolo: Il corridoio all'alba
    area: delirio
    ripetibile: true
    immagine: personaggi/ottilia-sanvel
    sommario: "All'alba Ottilia Sanvel fa esercitare nel corridoio i novizi e i ricoverati che stanno in piedi."
    testo: |
      All'alba Ottilia Sanvel scende nel corridoio con i novizi per una
      sequenza di movimenti lenti che servono a pregare e a combattere. Il
      più giovane ha ancora il segno del cuscino su una guancia, e i
      ricoverati che se la sentono si mettono in fondo alla fila.

      «Il respiro va con le braccia» dice Ottilia, senza alzare la voce. «La
      mente lasciatela dove sta, e vedrete che vi segue da sola.»

      {acrobazia Facile} Il peso va sul piede dietro, e il ginocchio non si
      blocca mai. Il corpo se lo ricorda meglio della testa.
    opzioni:
      - testo: "Seguire la sequenza"
        descrizione: "Muovere le braccia come dice Ottilia, dal primo movimento all'ultimo, senza perdere l'equilibrio."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Facile }
        successo:
          titolo: Fino all'ultimo movimento
          testo: |
            Arrivi in fondo alla sequenza insieme ai novizi, con il sudore che
            ti si raffredda sulla nuca. Per tutto il tempo hai sentito soltanto
            il fruscio delle maniche, e Ottilia ti rivolge un cenno breve prima di
            risalire.
          effetti: { recupero.delirio: 1 }
        fallimento:
          titolo: Fuori tempo
          testo: |
            A metà sequenza le voci tornano a contarti i movimenti, uno avanti a
            te, e il gomito urta il muro. Ottilia ti rimette in fila con una mano
            pesante sulla spalla, e fino alla fine resti un movimento indietro.
          effetti: { recupero.delirio: 0.5 }

  - id: delirio-liuto
    titolo: Il liuto in fondo al corridoio
    area: delirio
    ripetibile: true
    immagine: personaggi/sorella-celia
    sommario: "La sera Sorella Celia suona per le celle, e chiede ai ricoverati di cantare il ritornello con lei."
    testo: |
      La sera Sorella Celia porta il liuto in fondo al corridoio e si siede
      sull'ultimo gradino, con un nastro stretto al polso che Ottilia le ha
      già fatto togliere due volte. Attacca un inno del Velo con un
      ritornello che torna uguale a ogni strofa.

      «Il ritornello lo cantate voi» dice verso le grate. «Non importa se
      siete stonati, qui dentro l'importante è arrivare alla fine insieme.»

      {espressivita Media} È un inno scritto per chi non sa cantare. Il
      ritornello scende di un tono alla fine, e basta aspettarlo.
    opzioni:
      - testo: "Cantare il ritornello"
        descrizione: "Tenere la voce sul ritornello di Celia per tutto l'inno, anche quando le altre voci ti coprono."
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Insieme fino alla fine
          testo: |
            Alla terza strofa le celle cantano tutte insieme, e tu con loro,
            stonato quanto gli altri. Quando Celia smette di suonare il
            corridoio resta in silenzio fino al mattino.
          effetti: { recupero.delirio: 1 }
        fallimento:
          titolo: Un'altra melodia
          testo: |
            A metà dell'inno ti accorgi che stai cantando una melodia diversa, che
            nessuno ti ha insegnato e che la gola conosce a memoria. Celia
            rallenta e aspetta che tu ritrovi la sua.
          effetti: { recupero.delirio: 0.5 }

  - id: delirio-uscita
    titolo: La porta aperta
    area: delirio
    ripetibile: true
    requisiti: [recupero.delirio >= 4]
    immagine: personaggi/padre-vantes
    sommario: "Padre Vantes è sceso con la chiave, e stavolta la gira nella serratura."
    testo: |
      Padre Vantes apre la porta e si siede sulla panca accanto a te, con due
      dita sul tuo polso finché il battito rallenta.

      «Quando dubiti, tocca» dice. «Così ti ricordi di non essere solo nella
      stanza. Le voci le senti ancora?»

      Rispondi di no, e ti accorgi che è vero. *Allora è così che suona una
      stanza con dentro due persone.* Vantes lascia la porta aperta. Dal
      chiostro una strada scende in Città Bassa e un'altra porta ai Ponti
      Sospesi, e lì dietro Ottilia Sanvel tiene gli archivi minori.
    opzioni:
      - testo: "Tornare in Città Bassa"
        descrizione: "Tornare fra le fucine e il rumore, con la testa finalmente sgombra."
        esito:
          titolo: Il martello della Città Bassa
          testo: |
            In Città Bassa il martello delle fucine batte come sempre, e qualcuno ti
            urta senza chiedere scusa. Per la prima volta da giorni riesci a sentirlo
            senza contare i colpi.
          imposta: { tormento: 3, recupero.delirio: 0 }
          pe: { resilienza: 10 }
          vai: citta-bassa
      - testo: "Tornare sui Ponti Sospesi"
        descrizione: "Tornare dove il vento non smette mai, e imparare ad ascoltare soltanto quello che c'è davvero."
        esito:
          titolo: Il cigolio delle corde
          testo: |
            Sui Ponti il vento fa cigolare le corde di continuo, e per un momento
            ti irrigidisci. Poi ascolti meglio, e distingui il cigolio di una
            corda buona da quello di una che cederà, senza che le voci si
            confondano più con il resto.
          imposta: { tormento: 3, recupero.delirio: 0 }
          pe: { percezione: 10 }
          vai: ponti-sospesi
      - testo: "Passare una mattina negli archivi"
        requisiti: [invito >= 1]
        descrizione: "Ottilia Sanvel ti concede una mattina fra gli archivi minori prima di lasciarti uscire nei Quartieri Alti."
        esito:
          titolo: Gli archivi minori
          testo: |
            Ottilia ti fa sedere a un tavolo con un registro di atti del Velo
            vecchi di vent'anni, che odora di polvere e di colla di pesce.
            Leggi fino a mezzogiorno, e le righe restano ferme sulla pagina per
            tutto il tempo.
          imposta: { tormento: 3, recupero.delirio: 0 }
          pe: { accademiche: 10 }
          vai: quartieri-alti

  # ================================================================ CARTE DELLA FASCIA 5–7
  - id: carta-ferite-cassa
    titolo: Una cassa da portare
    tipo: carta
    area: ovunque
    requisiti: [ferite >= 5, ferite < 8]
    immagine: fazioni/gilda-dei-mercanti
    sommario: "Un mercante della Gilda ha perso il facchino e paga bene chi gli porta una cassa in cima alla scala."
    testo: |
      Un mercante della Gilda con i polsini di pizzo sta accanto a una cassa
      di lamiera abbandonata dal facchino. Guarda le bende che ti spuntano
      dalla manica e decide di non averle viste. «Ti pago bene per portarla
      in cima alla scala» dice, «e molto meno se mi aiuti soltanto a
      caricarla sul carretto.»

      {resistenza Media} Fino in cima ce la fai, e il conto lo paghi stasera,
      quando ti sfili la camicia.

      {origine mercante-dei-ponti} Se un collega della Gilda ti vede caricare
      quella cassa, al Mercato dei Nodi lo sapranno entro sera.
    opzioni:
      - testo: "Portarla in cima alla scala"
        descrizione: "Una buona paga, e una ferita che quasi certamente si riapre."
        esito:
          titolo: In cima alla scala
          testo: |
            Arrivi in cima con la cassa sulle spalle e la camicia bagnata, con le
            gambe che tremano sull'ultimo gradino. Il mercante ti paga senza contare.
            Solo più tardi ti accorgi che la benda sul fianco è diventata rossa.
          effetti: { monete: 15, ferite: 1 }
      - testo: "Aiutarlo a caricarla sul carretto"
        descrizione: "Una paga più magra per uno sforzo breve, che però ti tira i punti."
        esito:
          titolo: Sul carretto
          testo: |
            Sollevate la cassa in due e la fate scivolare sul pianale, e il mercante
            sbuffa più di te. Ti dà qualche moneta, e tu senti i punti tirare per il
            resto della giornata.
          effetti: { monete: 6, ferite: 0.5 }
      - testo: "Lasciar perdere"
        costo: 0
        descrizione: "Declinare con un cenno e proseguire per la tua strada."
        esito:
          testo: |
            Scuoti la testa e prosegui, con il fianco che ringrazia. Dietro di
            te il mercante ha già fermato qualcun altro.
          effetti: {}

  - id: carta-ferite-bende
    titolo: La borsa delle bende
    tipo: carta
    area: ovunque
    requisiti: [ferite >= 5, ferite < 8]
    immagine: fazioni/confraternita-del-velo
    sommario: "Una novizia del Velo gira la città con una borsa di bende, e si ferma quando vede come cammini."
    testo: |
      Il Velo manda i novizi a medicare chi non arriva in Cattedrale. Questa
      ha il velo corto dei primi anni, e quando ti vede zoppicare si ferma.
      «Posso cambiarti le bende per un'offerta» dice. «Se invece mi aiuti con
      il giro di oggi, ti medico alla fine senza chiederti niente.»

      {percezione Media} Le crocette sull'elenco nella sua borsa sono di due
      matite diverse, e solo una segna i nomi di oggi.

      {origine accolito-del-velo} Il giro con la borsa di bende l'hai fatto
      anche tu dopo la razzia, e lei non ti riconosce.
    opzioni:
      - testo: "Lasciare un'offerta"
        requisiti: [monete >= 12]
        descrizione: "Un'offerta per la cassetta della Cattedrale e bende pulite subito."
        esito:
          titolo: Bende pulite
          testo: |
            Ti medica seduta sul bordo di una fontana, con le mani svelte e fredde, e
            intanto ti chiede se hai mangiato. Mette le monete in un sacchetto a parte
            e ti benedice prima di proseguire il giro.
          effetti: { monete: -12, ferite: -1 }
      - testo: "Aiutarla nel giro dei feriti"
        descrizione: "Seguirla di casa in casa per reggerle i catini e tenere fermi i pazienti mentre lei li medica."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Il giro completo
          testo: |
            Impari in fretta come si tiene fermo un braccio e dove si stringe una
            benda, e a non guardare in faccia chi urla. Alla fine del giro la novizia
            ti medica con cura e ti lascia anche un vasetto di unguento avanzato.
          effetti: { ferite: -1 }
        fallimento:
          titolo: Il catino rovesciato
          testo: |
            Alla terza casa rovesci un catino sul pavimento di una vedova, che vi
            caccia tutti e due con la scopa in mano. La novizia ti cambia le bende lo
            stesso, in fretta, sul gradino di fuori.
          effetti: { ferite: -0.5, scandalo: 0.5 }

  - id: carta-tormento-vento
    titolo: Le notti di vento da est
    tipo: carta
    area: ovunque
    requisiti: [tormento >= 5, tormento < 8]
    immagine: ambientazione/evento-notte-dei-sussurri
    sommario: "Un vecchio Raschiatore paga chi gli tiene compagnia nelle notti di vento da est, e racconta cosa sente."
    testo: |
      Il vecchio ha le mani nodose dei Raschiatori e una sciarpa avvolta tre
      volte intorno al collo. Ha smesso di scendere dopo la Notte dei Sussurri, e
      da allora nelle notti di vento da est non riesce a dormire da solo.

      «Stanotte il vento gira» dice, con una manciata di monete sul palmo che gli
      trema. «Ti pago per restare sveglio con me fino all'alba ad ascoltare cosa
      ho sentito quella notte. Ti avverto però che dopo le voci le senti anche
      tu.»

      {empatia Media} Ha più paura di restare solo che delle voci, e si vergogna
      di chiedere.
    opzioni:
      - testo: "Restare con lui fino all'alba"
        descrizione: "Una paga per la notte e tutta la storia del vecchio, fino a quello che sente ancora."
        esito:
          titolo: Fino all'alba
          testo: |
            Il vecchio parla fino all'alba di sillabe brevi e di pause regolari, e
            del giorno in cui la voce ha detto il suo nome. Verso le quattro si
            addormenta a metà frase e si risveglia per finirla. Ti lascia le monete
            sul tavolo, e per tutta la mattina senti ancora il ritmo di quelle pause.
          effetti: { monete: 10, informazioni.voce: 1, tormento: 1.5 }
      - testo: "Restare fino a mezzanotte"
        descrizione: "Una paga più magra e mezza storia. Il resto lo lasci al vento."
        esito:
          titolo: Mezza storia
          testo: |
            A mezzanotte ti alzi e lui non prova a trattenerti. Ti dà qualche
            moneta contandola due volte, poi ricomincia a raccontare da solo
            a mezza voce, rivolto alla finestra.
          effetti: { monete: 4, tormento: 1 }
      - testo: "Rifiutare"
        costo: 0
        descrizione: "Augurargli la buona notte e lasciarlo al suo vento."
        esito:
          testo: |
            Il vecchio richiude la mano sulle monete e annuisce, senza
            rancore. Lo lasci davanti alla porta a guardare verso est.
          effetti: {}

  - id: carta-tormento-liuto
    titolo: Una liturgia in piazza
    tipo: carta
    area: ovunque
    requisiti: [tormento >= 5, tormento < 8]
    immagine: personaggi/sorella-celia
    sommario: "Sorella Celia accompagna col liuto una liturgia all'aperto, e per un'ora la piazza si ferma ad ascoltare."
    testo: |
      Nella piazza più vicina il Velo celebra una liturgia all'aperto per i
      morti della razzia, e la gente si ferma per il liuto di Sorella Celia
      più che per la preghiera. Sotto la musica le voci che ti seguono da
      giorni arrivano più deboli.

      {resilienza Media} Il liuto ha una pausa lunga ogni tre battute che le
      voci non sanno seguire, e ti ci puoi appoggiare come a un muro.

      All'ingresso un accolito tiene una cassetta per le offerte e un cesto
      di candele votive, e sbadiglia dentro il velo convinto che nessuno se
      ne accorga.
    opzioni:
      - testo: "Restare fino alla fine della liturgia"
        descrizione: "Ascoltare tutto l'inno di Celia e lasciare che la musica copra il resto."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: L'ultima nota
          testo: |
            Quando Celia suona l'ultima nota ti accorgi che le voci hanno
            smesso da un pezzo, e che stavi canticchiando. Resti in piazza anche
            dopo che la gente se n'è andata.
          effetti: { tormento: -1 }
        fallimento:
          titolo: Fuori dalla musica
          testo: |
            A metà dell'inno le voci trovano il ritmo del liuto e cominciano a
            seguirlo, mezza battuta indietro. Te ne vai prima della fine, ma
            per qualche ora sei stato meglio.
          effetti: { tormento: -0.5 }
      - testo: "Accendere una candela votiva"
        requisiti: [monete >= 10]
        descrizione: "Una piccola offerta per una candela davanti alla statua dell'Albero."
        esito:
          titolo: La candela
          testo: |
            Accendi la candela e la guardi consumarsi mentre Celia suona, con
            la cera calda sulle dita. La fiamma resta dritta anche
            quando si alza il vento.
          effetti: { monete: -10, tormento: -0.5 }
