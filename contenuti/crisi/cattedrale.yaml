# Crisi delle Ferite e del Tormento, con le aree di penalità della Cattedrale del Velo
# (Regolamento v0.4, sezione 5 e integrazione): convalescenza (infermeria e Giardini della
# Linfa) e delirio (celle della Cattedrale). In fondo le carte della fascia 5–7.

aree:
  - id: convalescenza
    nome: Convalescenza
    immagine: ambientazione/cattedrale-del-velo
    penalita: true
    testo: |
      L'infermeria della Cattedrale del Velo occupa la navata laterale a nord.
      Dopo la razzia i sacerdoti hanno tolto le panche e hanno messo le brande
      in due file lunghe, così vicine che fra l'una e l'altra passa appena un
      catino. Sopra ogni branda c'è un chiodo, e al chiodo è appesa una
      tavoletta di cera con il nome del ricoverato; su quella della branda
      accanto il nome vecchio è stato lisciato col pollice e quello nuovo
      scritto sopra, perché la cera costa e i letti si liberano in fretta.
      L'incenso della navata copre a fatica l'odore dell'aceto con cui gli
      accoliti lavano le bende.

      Da una porta bassa in fondo alla navata si esce nei Giardini della Linfa,
      dove il Velo coltiva piante bioluminescenti per i riti e per gli
      unguenti. Anche di giorno le foglie mandano una luce tenue. Sorella
      Giulia, che cura i Giardini, lascia camminare i convalescenti fra le
      aiuole purché tengano le mani in tasca.

      Le cure le dirige Padre Aurelio Vantes, che passa fra le brande due volte
      al giorno e a ciascuno posa una mano sul braccio mentre gli parla.
      L'accolita Nadja Oresca cambia le bende e porta la minestra con le vesti
      sempre spiegazzate. Le dimissioni invece spettano a Ottilia Sanvel, la
      monaca responsabile, che le decide da sola e senza spiegarle a nessuno.

      Ti hanno dato la branda accanto alla terza colonna, e di notte la
      pietra della colonna è l'unica cosa fresca che la tua mano riesce a
      trovare. Finché Ottilia non firma il tuo congedo, il portone della
      Cattedrale per te resta chiuso.

  - id: delirio
    nome: Delirio
    immagine: fazioni/confraternita-del-velo
    penalita: true
    testo: |
      Le celle della Cattedrale si trovano sotto il chiostro, lungo un
      corridoio di pietra grigia dove si scende per dodici gradini. Sono sei
      stanze strette con le pareti imbiancate a calce. In ognuna c'è una panca
      di legno con sopra una coperta, e in alto una feritoia così stretta che
      dalla panca si vede solo il cielo. Le porte hanno una grata all'altezza
      degli occhi, e la notte un accolito le chiude dall'esterno. La calce,
      se la fissi troppo a lungo, sembra muoversi appena, come la pelle del
      latte quando si raffredda.

      Qui il Velo tiene chi ha visto o sentito troppo. I Raschiatori ricordano
      ancora Mirn il Sordo, che la Confraternita prese in custodia quando
      cominciò a ripetere frasi in una lingua sconosciuta, e che morì in una
      cella come la tua. Gli accoliti non ne parlano volentieri.

      Il giorno passa con le campane delle ore sacre, che arrivano attutite
      attraverso la volta. All'alba Ottilia Sanvel fa esercitare nel corridoio
      i novizi e chi fra i ricoverati riesce a stare in piedi. La sera, qualche
      volta, Sorella Celia porta il liuto in fondo al corridoio e suona per le
      celle. Padre Vantes, che tiene la chiave, scende una volta al giorno a
      guardare dalla grata.

      Le voci che ti hanno portato fin qui sono scese con te un gradino più
      indietro, e la prima notte hai l'impressione che la strada la
      conoscessero già. *Quattro pareti, e restano quattro anche se le
      riconti.* Adesso almeno puoi contare anche loro contro un muro che
      sta fermo.

quality:
  - { id: recupero.convalescenza, nome: Recupero in convalescenza, categoria: stato, descrizione: "Quanto ti sei rimesso in forze nell'infermeria della Cattedrale. Quando arriva a 4, Ottilia Sanvel può firmare il tuo congedo." }
  - { id: recupero.delirio, nome: Recupero dal delirio, categoria: stato, descrizione: "Quanta calma hai ritrovato nelle celle della Cattedrale. Quando arriva a 4, Padre Vantes può riaprirti la porta." }

storylet:
  # ================================================================ FERITE
  - id: crisi-ferite
    titolo: Il corpo non regge più
    tipo: crisi
    area: citta-bassa
    requisiti: [ferite >= 8]
    immagine: ambientazione/dispensa-di-gramm
    sommario: "Le ferite si sono sommate l'una all'altra, e stamattina le gambe non ti reggono."
    testo: |
      Ti svegli sul pavimento e non ricordi di esserti sdraiato. La camicia è
      incollata al fianco nel punto dove la ferita si è riaperta durante la
      notte, e quando la stacchi ti esce un verso che non sapevi di avere.
      Quando provi ad alzarti la stanza gira due volte prima di
      fermarsi, e le bende che hai cambiato ieri sera sono già scure. Hai la
      febbre alta e la bocca asciutta.

      {medicina Facile} Il bordo della ferita è caldo e gonfio, e il rosso si
      allarga verso l'ombelico. Questa non si chiude più da sola.

      {origine fuggiasco-di-ghoran} A Ghoran un corpo messo così lo
      spingevano in fondo alla fila, perché sulla bilancia valeva meno. Il
      pensiero ti arriva prima della febbre, e ti fa stringere i denti più
      del dolore.

      In città lo sanno tutti che un corpo messo così peggiora ogni giorno che
      passa, e tu hai tirato avanti troppo a lungo. *Domani mi fermo, l'ho
      detto anche ieri e l'altro ieri.* Adesso bisogna scegliere in fretta,
      prima che le gambe decidano per te.

      Nel retro della Dispensa di Gramm tengono una pasta nera per i casi
      gravi, che chiude le ferite in una notte. Costa cara, e alla Dispensa
      non si fa credito a nessuno. Puoi anche stringere i denti e
      rimetterti in piedi da solo, bruciando in pochi giorni la forza che hai
      messo da parte con mesi di fatica.

      {resistenza Media fallita} Le gambe ti fanno sapere, con molta
      educazione, che la decisione di stringere i denti non spetta a te.

      Infine c'è la Cattedrale del Velo, dove dopo la razzia l'infermeria
      accoglie chiunque arrivi in barella. Lì ti rimettono in sesto senza
      chiederti un soldo, ma ci vuole tempo, e a decidere quando potrai uscire
      saranno i sacerdoti.
    opzioni:
      - testo: "Pagare Nestor Gramm"
        immagine: personaggi/nestor-gramm
        costo: 0
        quando: [pista.pelle < 4, colpo.dispensa == 0]
        requisiti: [monete >= 40]
        descrizione: "Trascinarti fino al vicolo dietro la Dispensa e contare il prezzo sul bancone. La pasta nera funziona, anche se nessuno sa cosa ci mette dentro."
        esito:
          titolo: La pasta nera
          testo: |
            Nestor ti guarda la ferita a lungo senza toccarla, con gli occhi
            sfocati che per una volta mettono a fuoco, poi conta le monete due
            volte. La pasta che ti spalma sul fianco puzza di zolfo
            e brucia fino a farti lacrimare. «Stanotte dormi seduto» dice,
            mentre rimette il barattolo sotto il bancone, «perché se ti sdrai si
            riapre, e io la stessa ferita la ricucio una volta sola.»

            Il mattino dopo la febbre è scesa e riesci a stare in piedi. Ti
            resta addosso l'odore di zolfo, e per due giorni i cani ti
            seguono per strada.
          effetti: { monete: -40 }
          imposta: { ferite: 4 }
      - testo: "Pagare la pasta nera al garzone della Dispensa"
        immagine: ambientazione/dispensa-di-gramm
        costo: 0
        quando: [colpo.dispensa >= 1]
        requisiti: [monete >= 40]
        descrizione: "I barattoli di Nestor Gramm sono rimasti sotto il bancone della Dispensa, e il suo garzone li vende allo stesso prezzo, senza fare credito."
        esito:
          titolo: La pasta nera
          testo: |
            Alla porta del vicolo ti apre il garzone, con il grembiule di
            Nestor che gli arriva alle caviglie. Conta le monete due volte,
            come gli ha insegnato il padrone, e poi tira fuori il barattolo da
            sotto il bancone. La pasta che ti spalma sul fianco puzza di zolfo
            e brucia fino a farti lacrimare. «Il padrone diceva che la prima
            notte si dorme seduti» dice, scandendo le parole come una lezione
            imparata a memoria, «perché a sdraiarsi si riapre.» Poi si gratta
            la testa e aggiunge che il padrone diceva anche altre cose, ma
            quelle non se le ricorda.

            Il mattino dopo la febbre è scesa e riesci a stare in piedi.
          effetti: { monete: -40 }
          imposta: { ferite: 4 }
      - testo: "Pagare la pasta nera al garzone della Dispensa"
        immagine: ambientazione/dispensa-di-gramm
        costo: 0
        quando: [pista.pelle >= 4, colpo.dispensa == 0]
        requisiti: [monete >= 40]
        descrizione: "I barattoli di Nestor Gramm sono rimasti sotto il bancone della Dispensa, e il suo garzone li vende allo stesso prezzo, senza fare credito."
        esito:
          titolo: La pasta nera
          testo: |
            Alla porta del vicolo ti apre il garzone, con il grembiule di
            Nestor che gli arriva alle caviglie. Conta le monete due volte,
            come gli ha insegnato il padrone, e poi tira fuori il barattolo da
            sotto il bancone. La pasta che ti spalma sul fianco puzza di zolfo
            e brucia fino a farti lacrimare. «Il padrone diceva che la prima
            notte si dorme seduti» dice, scandendo le parole come una lezione
            imparata a memoria, «perché a sdraiarsi si riapre.» Ha le unghie
            mangiate fino alla carne, e il barattolo gli trema un poco in mano.

            Il mattino dopo la febbre è scesa e riesci a stare in piedi.
          effetti: { monete: -40 }
          imposta: { ferite: 4 }
      - testo: "Stringere i denti"
        costo: 0
        requisiti: [pe.resistenza >= 10]
        descrizione: "Chiuderti in casa e rimetterti in piedi da solo. Perdi tutti i PE accumulati in Resistenza."
        esito:
          titolo: Tre giorni di febbre
          testo: |
            Passi tre giorni sulla branda con una brocca d'acqua e le imposte
            chiuse, a guardare la luce della fessura che attraversa il
            pavimento e poi torna indietro. La febbre sale fino al secondo
            giorno e poi cala, e nel mezzo parli con persone che non ci sono.
            Quando finalmente ti alzi le ferite si sono chiuse, ma il fiato che
            avevi guadagnato con mesi di fatica se n'è andato con la febbre.
          imposta: { ferite: 4, pe.resistenza: 0 }
      - testo: "Farti portare in Cattedrale"
        immagine: ambientazione/cattedrale-del-velo
        costo: 0
        descrizione: "Lasciare che due portatori del Velo ti carichino su una barella. In infermeria resterai finché non ti dimettono."
        esito:
          titolo: In barella
          testo: |
            Due portatori del Velo ti sollevano senza fare domande e ti portano
            su per le scale dei Quartieri Alti. Il cielo sopra di te oscilla a
            ogni gradino, e uno dei due conta i gradini a mezza voce per tenere
            il passo. Quando riapri gli occhi sei sotto una volta di pietra, e
            una voce calma legge il tuo nome da una tavoletta di cera.
          vai: convalescenza

  - id: convalescenza-giro
    titolo: Il giro del mattino
    area: convalescenza
    ripetibile: true
    immagine: personaggi/padre-vantes
    sommario: "Padre Vantes passa fra le brande e oggi vuole vederti camminare fino all'altare."
    testo: |
      Padre Vantes arriva con il giro del mattino, seguito da un novizio che
      porta il catino. È un uomo snello dagli occhi grigio chiaro, e al collo
      porta soltanto il sigillo del Velo. Si ferma alla tua branda, ti posa due
      dita sul polso e ascolta a lungo il battito, a occhi chiusi.

      «Oggi voglio vederti camminare fino all'altare e ritorno» dice, e con la
      mano libera ti indica la navata. «Senza appoggiarti alle colonne, per
      favore. Se cadi ti rialziamo noi» aggiunge, mentre il novizio ti porge il
      braccio e subito lo ritira.

      In fondo alla navata il cristallo rosso sull'altare pulsa al ritmo delle
      ore, e da qui sembra molto più lontano di sessanta passi. Le gambe
      cominciano a fare il conto prima ancora che tu metta i piedi a terra.

      {origine allievo-di-torvessa} Il cristallo dell'altare pulsa con una
      regolarità che all'Accademia farebbe invidia a qualunque banco di
      prova. Ti viene da chiederti chi l'abbia tagliato, e se Temmerin l'abbia
      mai visto da vicino.

      {atletica Facile} Passi corti e il peso sui talloni. Le colonne sono
      lì apposta per tentarti, e tu non guardarle.
    opzioni:
      - testo: "Camminare fino all'altare"
        descrizione: "Sono sessanta passi all'andata e altrettanti al ritorno, con tutti i ricoverati che ti guardano dalle brande."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Facile }
        successo:
          titolo: All'altare e ritorno
          testo: |
            Arrivi all'altare con la fronte bagnata e torni indietro più piano
            di come sei partito, con il cristallo rosso che ti pulsa alle
            spalle. Padre Vantes annuisce e scrive qualcosa sulla tua
            tavoletta.
          effetti: { recupero.convalescenza: 1 }
        fallimento:
          titolo: A metà navata
          testo: |
            A metà navata le ginocchia cedono senza chiederti il permesso e ti ritrovi
            seduto sulla pietra fredda, e tre ricoverati guardano altrove con impegno.
            Il novizio ti riaccompagna alla branda, e Vantes ti dice che domani ci
            riproverete.
          effetti: { recupero.convalescenza: 0.5 }

  - id: convalescenza-giardini
    titolo: Fra le aiuole della Linfa
    area: convalescenza
    ripetibile: true
    immagine: personaggi/sorella-giulia
    sommario: "Sorella Giulia ha bisogno di qualcuno che scelga le foglie buone per gli impiastri dell'infermeria."
    testo: |
      Nei Giardini della Linfa le foglie mandano una luce tenue anche a
      mezzogiorno. Sorella Giulia cammina lenta fra le aiuole con il palmo
      aperto, e un passero le si posa sulla mano senza che lei lo guardi. Ha
      i capelli biondo cenere tagliati corti per non impigliarsi nei rami, e le
      maniche macchiate di linfa.

      Ti fa sedere su una cassetta accanto a un cesto di foglie appena colte.
      Sono tiepide al tatto, e dopo qualche minuto ti ritrovi i polpastrelli
      tinti di una luce verdina che non va via strofinandoli sui calzoni.
      Quelle sane servono per gli impiastri dell'infermeria, mentre quelle
      che hanno preso la ruggine vanno bruciate. A un occhio poco allenato
      sembrano tutte uguali.

      {natura Media} La ruggine comincia dal rovescio, lungo la nervatura,
      con puntini più scuri della luce. Le foglie sane, girate, brillano
      anche di sotto.

      {origine figlio-del-circolo} Sorella Giulia tiene il palmo aperto e il
      polso morbido, come al Circolo si insegna ai bambini per gli uccelli
      del Bosco. Ti chiedi dove l'abbia imparato, e se lei si
      stia chiedendo la stessa cosa di te.

      «Gli uccelli le distinguono subito» dice. «Tu prova a guardarle come
      farebbero loro, e lascia stare quelle di cui non sei sicuro.»
    opzioni:
      - testo: "Scegliere le foglie"
        descrizione: "Separare le foglie sane da quelle malate, una per una, sotto lo sguardo paziente di Sorella Giulia."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Il cesto giusto
          testo: |
            Alla fine del pomeriggio hai due mucchi ordinati e le dita verdi fino alle
            nocche. Sorella Giulia ne controlla una manciata e sposta una sola foglia.
            Stanotte, con l'impiastro sul fianco, dormi fino all'alba.
          effetti: { recupero.convalescenza: 1 }
        fallimento:
          titolo: La ruggine
          testo: |
            Sorella Giulia rovescia il tuo mucchio buono sul tavolo e ne tira
            fuori una dozzina di foglie arrugginite. Te le mostra una per una
            con pazienza e senza rimproveri, girandole controluce. Intanto il
            pomeriggio è passato lo stesso.
          effetti: { recupero.convalescenza: 0.5 }

  - id: convalescenza-corsia
    titolo: Il carrettiere della quarta branda
    area: convalescenza
    ripetibile: true
    immagine: personaggi/nadja-oresca
    sommario: "Nadja Oresca ha un ricoverato che rifiuta la minestra e spera che tu riesca a convincerlo."
    testo: |
      Nadja Oresca passa con la pentola della minestra e si ferma accanto a te
      più del necessario. Ha le vesti spiegazzate e un anello di rame che
      dimentica sempre di togliere, e sulla manica una macchia di minestra
      di ieri.

      «Il carrettiere della quarta branda non mangia da due giorni, sai» dice
      a bassa voce, e intanto si gira l'anello intorno al dito. «Si è rotto
      una gamba cadendo dal Ponte del Conciatore e si è convinto che non
      camminerà più. A me non dà retta perché porto il velo, sai com'è. A
      te magari sì, visto che anche tu sei qui dentro.»

      {origine figlio-della-citta-bassa} Un carrettiere con la gamba rotta ti
      riporta in mente il vecchio del carro del Festival, quello con le mani
      nere di resina che chiamava ragazzo mio chiunque avesse meno di
      cinquant'anni. Chissà se anche lui, adesso, rifiuta la minestra da
      qualche parte.

      Ti mette in mano una scodella calda e resta ad aspettare. L'uomo della
      quarta branda guarda il soffitto e fa finta di dormire.

      {empatia Facile} Fa finta male, con gli occhi aperti. Vuole che
      qualcuno si sieda accanto a lui, e si vergogna di volerlo.
    opzioni:
      - testo: "Parlare con il carrettiere"
        descrizione: "Sederti sul bordo della sua branda con la scodella e trovare le parole giuste."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Facile }
        successo:
          titolo: Mezza scodella
          testo: |
            Gli racconti delle tue ferite e di come ti sei rialzato, e ne
            aggiungi una inventata che suona meglio delle vere. Dopo un po'
            si tira su a sedere e mangia mezza scodella. Nadja ti ringrazia
            con un proverbio in lingua antica che nessuno dei due capisce.
          effetti: { recupero.convalescenza: 1 }
        fallimento:
          titolo: La schiena voltata
          testo: |
            Il carrettiere si gira dall'altra parte senza risponderti, e la
            branda geme sotto di lui. Torni alla tua con la scodella ancora
            piena e la mangi tu, visto che ormai è fredda.
          effetti: { recupero.convalescenza: 0.5 }

  - id: convalescenza-uscita
    titolo: Il congedo di Ottilia
    area: convalescenza
    ripetibile: true
    requisiti: [recupero.convalescenza >= 4]
    immagine: personaggi/ottilia-sanvel
    sommario: "Ottilia Sanvel è venuta a firmare il tuo congedo e vuole sapere dove andrai."
    testo: |
      Ottilia Sanvel arriva alla tua branda senza farsi annunciare. È bassa e
      robusta, con i capelli corti e la tunica nera stretta dalla cintura del
      suo rango. Legge la tavoletta di cera appesa al chiodo, poi ti guarda le
      mani e le caviglie.

      {origine accolito-del-velo} L'ultima volta che ti ha guardato così ti ha
      messo in mano una borsa di bende e ti ha mandato in Città Bassa, con
      l'ordine di tornare quando le avresti finite. Sei tornato in barella, e
      lei non lo commenta, cosa che ti pesa più di un rimprovero.

      {rissa Media} Ti guarda dove guarderebbe un istruttore d'armi, le
      mani per la presa e le caviglie per l'appoggio. Chi guarda così ha
      insegnato a combattere, o l'ha imparato molto bene.

      «Sei guarito abbastanza» dice. «Il letto serve a qualcun altro. Padre
      Vantes chiede se hai un posto dove andare, e io chiedo soltanto che tu
      non torni qui entro un mese.»

      Firma il congedo con uno stilo e lo stacca dalla tavoletta.

      {galateo Facile fallita} Accenni un inchino e ti fermi a metà, perché
      non sai se a una monaca del suo rango si fa. Ottilia aspetta che tu
      decida, senza aiutarti.

      Mentre raccogli le tue cose, Sorella Giulia si affaccia dalla porta dei
      Giardini con un fagotto di foglie legato con lo spago e chiede se
      qualcuno scende verso il Mercato dei Nodi. In fondo alla navata il
      portone è aperto, e l'aria che entra da fuori è fredda e piena di fumo,
      quasi troppa per i polmoni dopo tanti giorni di incenso. Da lì una
      scala scende verso la Città Bassa mentre l'altra porta alle piazze dei
      Quartieri Alti.
    opzioni:
      - testo: "Scendere a piedi in Città Bassa"
        descrizione: "Sono più di trecento gradini. Le gambe dovrebbero reggerti."
        esito:
          titolo: I trecento gradini
          testo: |
            Scendi la scala un gradino alla volta, e a metà ti fermi a
            riprendere fiato ma non ti siedi. *Se mi siedo, mi riportano su in
            barella.* In fondo ti accoglie il fumo delle fucine, e non ti è mai
            sembrato così buono. Le gambe hanno retto fino all'ultimo gradino.
          imposta: { ferite: 3, recupero.convalescenza: 0 }
          pe: { resistenza: 10 }
          vai: citta-bassa
      - testo: "Portare le foglie a Nestor Gramm"
        descrizione: "Il fagotto di Sorella Giulia va alla Dispensa di Gramm, sul Mercato dei Nodi. Lungo la strada lei ti spiega a cosa serve ogni foglia."
        quando: [pista.pelle < 4, colpo.dispensa == 0]
        esito:
          titolo: Il fagotto di Giulia
          testo: |
            Sorella Giulia ti accompagna fino al portone e intanto ti spiega
            quali foglie calmano la febbre e quali fermano il sangue. Sui Ponti
            Nestor Gramm apre il fagotto e ne annusa il contenuto a lungo, con
            il naso quasi dentro le foglie. Poi ti fa un cenno che da lui vale
            come un ringraziamento.
          imposta: { ferite: 3, recupero.convalescenza: 0 }
          pe: { natura: 10 }
          vai: ponti-sospesi
      - testo: "Portare le foglie alla Dispensa di Gramm"
        descrizione: "Il fagotto di Sorella Giulia va alla Dispensa di Gramm, sul Mercato dei Nodi, dove adesso al banco c'è il garzone di Nestor. Lungo la strada lei ti spiega a cosa serve ogni foglia."
        quando: [colpo.dispensa >= 1]
        esito:
          titolo: Il fagotto di Giulia
          testo: |
            Sorella Giulia ti accompagna fino al portone e intanto ti spiega
            quali foglie calmano la febbre e quali fermano il sangue. Sui Ponti
            il garzone della Dispensa apre il fagotto e ne annusa il contenuto
            a lungo, come faceva Nestor. Poi ti chiede di ripetergli quello che
            ti ha detto Giulia, e se lo segna sul grembiule con un carboncino,
            sbagliando l'ortografia di due foglie su tre.
          imposta: { ferite: 3, recupero.convalescenza: 0 }
          pe: { natura: 10 }
          vai: ponti-sospesi
      - testo: "Portare le foglie alla Dispensa di Gramm"
        descrizione: "Il fagotto di Sorella Giulia va alla Dispensa di Gramm, sul Mercato dei Nodi, dove adesso al banco c'è il garzone di Nestor. Lungo la strada lei ti spiega a cosa serve ogni foglia."
        quando: [pista.pelle >= 4, colpo.dispensa == 0]
        esito:
          titolo: Il fagotto di Giulia
          testo: |
            Sorella Giulia ti accompagna fino al portone e intanto ti spiega
            quali foglie calmano la febbre e quali fermano il sangue. Sui Ponti
            il garzone della Dispensa apre il fagotto e ne annusa il contenuto
            a lungo, come faceva Nestor. Poi ti chiede di ripetergli quello che
            ti ha detto Giulia, e se lo segna sul grembiule con un carboncino.
            Il grembiule, ormai, è più scritto che pulito.
          imposta: { ferite: 3, recupero.convalescenza: 0 }
          pe: { natura: 10 }
          vai: ponti-sospesi
      - testo: "Uscire dal portico sui Quartieri Alti"
        requisiti: [invito >= 1]
        descrizione: "Padre Vantes ti accompagna fuori insieme a una famiglia di benefattori venuta a visitare i feriti."
        esito:
          titolo: I benefattori
          testo: |
            Padre Vantes ti presenta ai benefattori come uno dei feriti che la
            loro offerta ha rimesso in piedi. Ringrazi con le parole giuste e
            nel modo in cui si ringrazia quassù, con la schiena dritta e gli
            occhi bassi il giusto, e la signora ti stringe la mano con il
            guanto, che poi si pulisce di nascosto sulla gonna.

            {origine rampollo-dei-quartieri-alti} La signora la conosci di
            vista dai salotti, e dal modo in cui la guardi capisce che la
            conosci. Il guanto se lo pulisce lo stesso, soltanto più in fretta.
          imposta: { ferite: 3, recupero.convalescenza: 0 }
          pe: { galateo: 10 }
          vai: quartieri-alti

  # ================================================================ TORMENTO
  - id: crisi-tormento
    titolo: Le voci restano
    tipo: crisi
    area: citta-bassa
    requisiti: [tormento >= 8]
    immagine: ambientazione/mito-occhio-nel-cristallo
    sommario: "Da tre notti non dormi, e le voci che senti non smettono più quando apri gli occhi."
    testo: |
      Da tre notti non dormi. Ogni volta che chiudi gli occhi senti sillabe
      brevi e regolari che arrivano da sotto il pavimento, e quando li riapri
      continuano ancora per qualche respiro. Stamattina hai contato due volte
      le monete della borsa e ti sono venuti due numeri diversi. *Dipende da
      chi le conta, io oppure loro.* Una donna ti ha chiesto la strada, e tu
      le hai risposto con parole che non erano tue.

      {magia Difficile} Le sillabe hanno un passo, come una formula recitata
      da chi non sa più cosa voglia dire. Il Mana sotto il pavimento vibra
      alla stessa cadenza, e tu lo senti nei denti.

      Hai visto abbastanza della città per sapere dove porta questa strada.
      Sotto i Ponti vive un vecchio Raschiatore che parla tutto il giorno con
      qualcuno che non c'è, e dicono che anche lui all'inizio sbagliava a
      contare le monete.

      {origine apprendista-raschiatore} Sulle piattaforme il nome di Mirn il
      Sordo si dice a bassa voce, e chi risale dai tunnel con le voci nelle
      orecchie lo guardano tutti allo stesso modo. Adesso ti accorgi di
      guardarti così anche tu.

      {resilienza Media fallita} Ti dici che tu sei diverso. Lo dici ad alta
      voce, e qualcuno sotto il pavimento ti dà ragione.

      Il Velo tiene veglie di notte per chi porta pesi che non si vedono.
      Un'offerta generosa compra un sacerdote che resta sveglio
      accanto a te fino all'alba, e la sua preghiera ricuce il sonno. Puoi
      anche affrontare le voci con la disciplina che ti sei costruito, e
      consumarla tutta in una notte. Oppure puoi fare quello che fecero con
      Mirn il Sordo, e lasciare che la Confraternita ti chiuda in una cella
      della Cattedrale finché le voci non tacciono.
    opzioni:
      - testo: "Pagare una veglia al Velo"
        immagine: fazioni/confraternita-del-velo
        costo: 0
        requisiti: [monete >= 50]
        descrizione: "Lasciare l'offerta nella cassetta della Cattedrale e passare la notte in navata con un sacerdote che veglia per te."
        esito:
          titolo: La notte in navata
          testo: |
            Il sacerdote è giovane, ha la voce roca e un raffreddore che cerca di non
            far sentire. Si siede accanto a te sulla panca e recita la preghiera della
            notte senza fretta, e quando si ferma per bere ricomincia dal punto esatto
            in cui aveva smesso. Verso l'alba ti accorgi che le voci hanno taciuto da
            un'ora, e che ti eri addormentato con la testa contro la colonna.
          effetti: { monete: -50 }
          imposta: { tormento: 4 }
      - testo: "Affrontare le voci da solo"
        costo: 0
        requisiti: [pe.resilienza >= 10]
        descrizione: "Sederti al buio e ascoltare le voci finché si stancano. Perdi tutti i PE accumulati in Resilienza."
        esito:
          titolo: La notte al buio
          testo: |
            Resti seduto al buio con la schiena contro il muro e le ascolti
            senza rispondere, anche quando a notte fonda cominciano a chiamarti
            per nome. Una alla volta le voci si allontanano, come passanti che
            hanno perso interesse. All'alba sei svuotato, con il collo rigido e
            le mani strette sulle ginocchia, e la disciplina che avevi messo da
            parte l'hai spesa tutta stanotte.
          imposta: { tormento: 4, pe.resilienza: 0 }
      - testo: "Consegnarti alla Confraternita"
        immagine: ambientazione/cattedrale-del-velo
        costo: 0
        descrizione: "Chiedere al Velo una cella e lasciare che ti chiudano dentro. Uscirai quando lo deciderà Padre Vantes."
        esito:
          titolo: Dodici gradini
          testo: |
            Due accoliti velati ti accompagnano sotto il chiostro senza
            toccarti. Conti i gradini ad alta voce e sono dodici, poi lo
            chiedi all'accolito e lui ti conferma che sono dodici, gentile,
            come l'avrà confermato a tanti altri prima di te. Dietro di te la
            porta si chiude con un rumore di ferro.
          vai: delirio

  - id: delirio-campane
    titolo: Le campane delle ore
    area: delirio
    ripetibile: true
    immagine: ambientazione/cattedrale-del-velo
    sommario: "Le campane delle ore sacre attraversano la volta, e se le conti tutte il giorno torna a stare in piedi."
    testo: |
      Dalla feritoia vedi un rettangolo di cielo che cambia colore, e certe
      ore ti pare che cambi anche forma, più lungo al mattino e più stretto
      verso sera, anche se sai benissimo che la pietra non si muove. Il resto
      del tempo lo scandiscono le campane delle ore sacre, che arrivano
      attutite attraverso la volta del corridoio.

      {accademiche Facile fallita} Dovresti sapere quante sono le ore sacre e
      come si chiamano. Ti torna in mente soltanto la compieta, perché suona
      come una cosa da mangiare.

      Un accolito ti ha lasciato un pezzo di carbone. Sulla parete accanto
      alla panca il ricoverato di prima ha tracciato file di tacche, e tu hai
      cominciato una fila tua. *Chissà se anche a lui contavano dietro.* Il
      problema sono le voci, che tra un rintocco e l'altro contano anche
      loro, in una lingua che non conosci e con numeri che non tornano mai
      con i tuoi.
    opzioni:
      - testo: "Contare le ore di un giorno intero"
        descrizione: "Segnare sulla parete ogni rintocco dall'alba alla compieta, senza perderne nessuno."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Facile }
        successo:
          titolo: Una fila completa
          testo: |
            La sera la tua fila di tacche è completa e coincide con quella del
            ricoverato di prima, tacca per tacca. Ti addormenti prima
            dell'ultima campana.
          effetti: { recupero.delirio: 1 }
        fallimento:
          titolo: Tacche in più
          testo: |
            Verso il pomeriggio ti accorgi di avere segnato tacche anche per
            rintocchi che nessuno ha suonato. Le cancelli con il pollice, che
            si annerisce di carbone, e ricominci da capo, più piano di prima.
          effetti: { recupero.delirio: 0.5 }

  - id: delirio-corridoio
    titolo: Il corridoio all'alba
    area: delirio
    ripetibile: true
    immagine: personaggi/ottilia-sanvel
    sommario: "All'alba Ottilia Sanvel fa esercitare nel corridoio i novizi, e anche chi fra i ricoverati riesce a stare in piedi."
    testo: |
      All'alba l'accolito apre le porte e Ottilia Sanvel scende nel corridoio
      con i novizi. Insegna una sequenza di movimenti lenti che servono per
      pregare e per combattere, e che lei chiama con un solo nome. I novizi
      si mettono in fila lungo il muro, e il più giovane ha ancora il segno
      del cuscino stampato su una guancia. I ricoverati che se la sentono si
      mettono in fondo.

      «Il respiro va con le braccia» dice Ottilia, senza alzare la voce. «La
      mente lasciatela dove sta, e vedrete che vi segue da sola.»

      Nel corridoio c'è appena lo spazio per allargare le braccia senza
      toccare il vicino, e quando provi ad alzarle le spalle scricchiolano
      come se da settimane nessuno le usasse.

      {acrobazia Facile} Il peso va sul piede dietro, e il ginocchio non si
      blocca mai. Il corpo se lo ricorda meglio della testa.
    opzioni:
      - testo: "Seguire la sequenza"
        descrizione: "Muovere le braccia al ritmo del respiro, dal primo movimento all'ultimo, senza perdere l'equilibrio."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Facile }
        successo:
          titolo: Fino all'ultimo movimento
          testo: |
            Arrivi in fondo alla sequenza insieme ai novizi, con il sudore che
            ti si raffredda sulla nuca. Per tutto il tempo hai sentito soltanto
            il tuo respiro, e Ottilia ti rivolge un cenno breve prima di
            risalire.
          effetti: { recupero.delirio: 1 }
        fallimento:
          titolo: Fuori tempo
          testo: |
            A metà sequenza le voci tornano a contarti i movimenti, uno avanti
            a te, e perdi il ritmo. Il gomito urta il muro. Ottilia ti rimette
            in fila con una mano pesante sulla spalla, e fino alla fine resti
            un movimento indietro.
          effetti: { recupero.delirio: 0.5 }

  - id: delirio-liuto
    titolo: Il liuto in fondo al corridoio
    area: delirio
    ripetibile: true
    immagine: personaggi/sorella-celia
    sommario: "La sera Sorella Celia suona per le celle, e chiede ai ricoverati di cantare il ritornello con lei."
    testo: |
      La sera Sorella Celia porta il liuto in fondo al corridoio e si siede
      sull'ultimo gradino. Ha i capelli castani raccolti sotto il velo e un
      nastro stretto al polso che Ottilia le ha già fatto togliere due volte.
      Accorda lo strumento senza guardarlo, poi attacca un inno del Velo con
      un ritornello che torna uguale a ogni strofa.

      «Il ritornello lo cantate voi» dice a voce alta verso le grate. «Non
      importa se siete stonati, qui dentro l'importante è arrivare alla
      fine insieme.»

      Da una cella in fondo qualcuno comincia a cantare fuori tempo, con
      molta convinzione.

      {espressivita Media} È un inno facile, scritto per chi non sa cantare.
      Il ritornello scende di un tono alla fine, e basta aspettarlo.
    opzioni:
      - testo: "Cantare il ritornello"
        descrizione: "Tenere la voce sul ritornello di Celia per tutto l'inno, anche quando le altre voci provano a cantare sopra la tua."
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Insieme fino alla fine
          testo: |
            Alla terza strofa le celle cantano tutte insieme, e tu con loro,
            stonato quanto gli altri. Quando Celia smette di suonare il
            corridoio resta in silenzio fino al mattino.
          effetti: { recupero.delirio: 1 }
        fallimento:
          titolo: Un'altra melodia
          testo: |
            A metà dell'inno ti accorgi che stai cantando una melodia diversa,
            che nessuno ti ha insegnato e che la gola conosce a memoria. Ti
            si gela la schiena. Celia rallenta e aspetta che tu ritrovi la
            sua.
          effetti: { recupero.delirio: 0.5 }

  - id: delirio-uscita
    titolo: La porta aperta
    area: delirio
    ripetibile: true
    requisiti: [recupero.delirio >= 4]
    immagine: personaggi/padre-vantes
    sommario: "Padre Vantes è sceso con la chiave, e stavolta la gira nella serratura."
    testo: |
      Padre Vantes scende i dodici gradini con la chiave in mano. Guarda
      dalla grata come ogni giorno, poi apre la porta ed entra nella cella.
      Si siede sulla panca accanto a te e ti tiene due dita sul polso finché
      il battito rallenta. Ha le dita fresche e asciutte, da uomo che non
      ha fretta.

      {empatia Media} Il polso lo sente per te più che per sé. Vuole che tu
      ti accorga di avere un corpo, e che il corpo è tuo.

      «Quando dubiti, tocca» dice. «Ai novizi lo insegno il primo giorno,
      perché così ti ricordi di non essere solo nella stanza. Adesso le voci
      le senti ancora?»

      Rispondi di no, e ti accorgi che è vero. *Allora è così che suona una
      stanza con dentro due persone e basta.* Le orecchie ti ronzano appena,
      come dopo una campana suonata troppo vicino. Vantes annuisce e lascia la
      porta aperta dietro di sé. In cima alla scala il chiostro è pieno di
      luce. Da lì una strada scende verso la Città Bassa e un'altra porta ai
      Ponti Sospesi, mentre dietro il chiostro Ottilia Sanvel tiene gli
      archivi minori della Cattedrale.
    opzioni:
      - testo: "Tornare in Città Bassa"
        descrizione: "Tornare fra le fucine e il rumore, con la testa finalmente sgombra."
        esito:
          titolo: Il martello della Città Bassa
          testo: |
            In Città Bassa il martello delle fucine batte come sempre, e qualcuno ti
            urta senza chiedere scusa. Per la prima volta da giorni riesci a sentirlo
            senza contare i colpi.
          imposta: { tormento: 3, recupero.delirio: 0 }
          pe: { resilienza: 10 }
          vai: citta-bassa
      - testo: "Tornare sui Ponti Sospesi"
        descrizione: "Tornare dove il vento non smette mai, e imparare ad ascoltare soltanto quello che c'è davvero."
        esito:
          titolo: Il cigolio delle corde
          testo: |
            Sui Ponti il vento fa cigolare le corde di continuo, e per un
            momento il cuore ti si stringe. Poi ascolti meglio. Adesso sai
            distinguere il cigolio di una corda buona da quello di una che
            cederà, e le voci non si confondono più con il resto.
          imposta: { tormento: 3, recupero.delirio: 0 }
          pe: { percezione: 10 }
          vai: ponti-sospesi
      - testo: "Passare una mattina negli archivi"
        requisiti: [invito >= 1]
        descrizione: "Ottilia Sanvel ti concede una mattina fra gli archivi minori prima di lasciarti uscire nei Quartieri Alti."
        esito:
          titolo: Gli archivi minori
          testo: |
            Ottilia ti fa sedere a un tavolo con un registro di atti del Velo
            vecchi di vent'anni, che odora di polvere e di colla di pesce.
            Leggi fino a mezzogiorno, e le righe restano ferme sulla pagina per
            tutto il tempo.
          imposta: { tormento: 3, recupero.delirio: 0 }
          pe: { accademiche: 10 }
          vai: quartieri-alti

  # ================================================================ CARTE DELLA FASCIA 5–7
  - id: carta-ferite-cassa
    titolo: Una cassa da portare
    tipo: carta
    area: ovunque
    requisiti: [ferite >= 5, ferite < 8]
    immagine: fazioni/gilda-dei-mercanti
    sommario: "Un mercante della Gilda ha perso il facchino e paga bene chi gli porta una cassa in cima alla scala."
    testo: |
      Un mercante della Gilda sta in piedi accanto a una cassa di lamiera
      chiusa con due catenacci. Il facchino che doveva portarla se n'è andato
      a metà strada, e il mercante guarda i passanti uno per uno cercando
      qualcuno con le spalle larghe. Ha i polsini di pizzo e le scarpe
      infangate fino alla fibbia.

      {origine mercante-dei-ponti} Il tipo lo conosci dalla Gilda, quelli con
      i polsini di pizzo che trattano da facchino chiunque abbia l'aria di
      averne bisogno, anche un collega con la licenza. Se ti vede caricare
      quella cassa, al Mercato dei Nodi lo sapranno entro sera.

      Si ferma su di te. Guarda le bende che ti spuntano dalla manica e poi
      decide di non averle viste. «Ti pago bene per portarla in cima alla
      scala» dice, «e molto meno se mi aiuti soltanto a caricarla sul carretto.»

      La cassa è pesante, e il fianco ti manda una fitta di avvertimento
      solo a guardarla, perché le tue ferite non sono ancora chiuse.

      {resistenza Media} Fino in cima ce la fai. Il conto lo paghi stasera,
      quando ti sfili la camicia.
    opzioni:
      - testo: "Portarla in cima alla scala"
        descrizione: "Una buona paga, e una ferita che quasi certamente si riapre."
        esito:
          titolo: In cima alla scala
          testo: |
            Arrivi in cima con la cassa sulle spalle e la camicia bagnata, con le
            gambe che tremano sull'ultimo gradino. Il mercante ti paga senza contare.
            Solo più tardi ti accorgi che la benda sul fianco è diventata rossa.
          effetti: { monete: 15, ferite: 1 }
      - testo: "Aiutarlo a caricarla sul carretto"
        descrizione: "Una paga più magra per uno sforzo breve, che però ti tira i punti."
        esito:
          titolo: Sul carretto
          testo: |
            Sollevate la cassa in due e la fate scivolare sul pianale, e il mercante
            sbuffa più di te. Ti dà qualche moneta, e tu senti i punti tirare per il
            resto della giornata.
          effetti: { monete: 6, ferite: 0.5 }
      - testo: "Lasciar perdere"
        costo: 0
        descrizione: "Declinare con un cenno e proseguire per la tua strada."
        esito:
          testo: |
            Scuoti la testa e prosegui, con il fianco che ringrazia. Dietro di
            te il mercante ha già fermato qualcun altro.
          effetti: {}

  - id: carta-ferite-bende
    titolo: La borsa delle bende
    tipo: carta
    area: ovunque
    requisiti: [ferite >= 5, ferite < 8]
    immagine: fazioni/confraternita-del-velo
    sommario: "Una novizia del Velo fa il giro della città con una borsa di bende, e si ferma quando vede come cammini."
    testo: |
      Dopo la razzia il Velo manda i novizi in giro per la città a medicare
      chi non riesce ad arrivare fino in Cattedrale. Questa è una ragazza con
      il velo corto dei primi anni e una borsa di tela a tracolla, piena di
      bende arrotolate e di vasetti di unguento. Ha le guance rosse per la
      salita e le scarpe di qualcuno con il piede più grande.

      {origine accolito-del-velo} Il giro con la borsa di bende l'hai fatto
      anche tu dopo la razzia, e riconosci le guance rosse della salita e le
      scarpe prestate. Lei invece non riconosce te, e ti tratta come un ferito
      qualunque, cosa giusta che ti punge lo stesso.

      Ti vede zoppicare e si ferma. «Fammi vedere» dice, e senza aspettare la
      risposta ti solleva la manica. «Posso cambiarti le bende per
      un'offerta. Se invece mi aiuti con il giro di oggi, ti medico alla
      fine senza chiederti niente.»

      Nella borsa, fra le bende, c'è un elenco di nomi e di indirizzi scritto
      fitto. Accanto a qualche nome c'è una crocetta a matita, e ti chiedi se
      voglia dire guarito o morto mentre lei ti tiene ancora il polso.

      {percezione Media} Le crocette sono di due matite diverse. Una è
      appuntita e l'altra spuntata, e quella spuntata segna i nomi più in
      basso, quelli di oggi.
    opzioni:
      - testo: "Lasciare un'offerta"
        requisiti: [monete >= 12]
        descrizione: "Un'offerta per la cassetta della Cattedrale e bende pulite subito."
        esito:
          titolo: Bende pulite
          testo: |
            Ti medica seduta sul bordo di una fontana, con le mani svelte e fredde, e
            intanto ti chiede se hai mangiato. Mette le monete in un sacchetto a parte
            e ti benedice prima di proseguire il giro.
          effetti: { monete: -12, ferite: -1 }
      - testo: "Aiutarla nel giro dei feriti"
        descrizione: "Seguirla di casa in casa per reggerle i catini e tenere fermi i pazienti mentre lei li medica."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Il giro completo
          testo: |
            Impari in fretta come si tiene fermo un braccio e dove si stringe una
            benda, e a non guardare in faccia chi urla. Alla fine del giro la novizia
            ti medica con cura e ti lascia anche un vasetto di unguento avanzato.
          effetti: { ferite: -1 }
        fallimento:
          titolo: Il catino rovesciato
          testo: |
            Alla terza casa rovesci un catino sul pavimento di una vedova, che vi
            caccia tutti e due con la scopa in mano. La novizia ti cambia le bende lo
            stesso, in fretta, sul gradino di fuori.
          effetti: { ferite: -0.5 }

  - id: carta-tormento-vento
    titolo: Le notti di vento da est
    tipo: carta
    area: ovunque
    requisiti: [tormento >= 5, tormento < 8]
    immagine: ambientazione/evento-notte-dei-sussurri
    sommario: "Un vecchio Raschiatore paga chi gli tiene compagnia nelle notti di vento da est, e racconta cosa sente."
    testo: |
      Il vecchio ha le mani nodose dei Raschiatori e una sciarpa avvolta tre
      volte intorno al collo. Ha smesso di scendere tredici anni fa, dopo la
      Notte dei Sussurri. Da allora nelle notti di vento da est non riesce a
      dormire da solo.

      «Stanotte il vento gira» dice, e ti mostra una manciata di monete sul palmo
      aperto. «Ti pago per restare sveglio con me fino all'alba. Io ti
      racconto cosa ho sentito quella notte e cosa sento ancora adesso, e tu
      mi ascolti e basta. Ti avverto però che dopo le voci le senti anche
      tu.» Le monete gli tremano un poco sul palmo.

      {empatia Media} Ha più paura di restare solo che delle voci. Il
      prezzo che offre è quello di un uomo che si vergogna di chiedere.
    opzioni:
      - testo: "Restare con lui fino all'alba"
        descrizione: "Una paga per la notte e tutta la storia, con quello che il vecchio sente ancora nelle notti di vento."
        esito:
          titolo: Fino all'alba
          testo: |
            Il vecchio parla fino all'alba di sillabe brevi e di pause
            regolari, e del giorno in cui la voce ha detto il suo nome. Verso
            le quattro si addormenta a metà frase, e si risveglia per finirla. Quando
            se ne va ti lascia le monete sul tavolo. Tu, per tutta la mattina,
            senti ancora il ritmo di quelle pause.
          effetti: { monete: 10, informazioni.voce: 1, tormento: 1 }
      - testo: "Restare fino a mezzanotte"
        descrizione: "Una paga più magra e mezza storia. Il resto lo lasci al vento."
        esito:
          titolo: Mezza storia
          testo: |
            A mezzanotte ti alzi e lui non prova a trattenerti. Ti dà qualche
            moneta contandola due volte, poi ricomincia a raccontare da solo
            a mezza voce, rivolto alla finestra.
          effetti: { monete: 4, tormento: 0.5 }
      - testo: "Rifiutare"
        costo: 0
        descrizione: "Augurargli la buona notte e lasciarlo al suo vento."
        esito:
          testo: |
            Il vecchio richiude la mano sulle monete e annuisce, senza
            rancore. Lo lasci davanti alla porta a guardare verso est.
          effetti: {}

  - id: carta-tormento-liuto
    titolo: Una liturgia in piazza
    tipo: carta
    area: ovunque
    requisiti: [tormento >= 5, tormento < 8]
    immagine: personaggi/sorella-celia
    sommario: "Sorella Celia accompagna col liuto una liturgia all'aperto, e per un'ora la piazza si ferma ad ascoltare."
    testo: |
      Nella piazza più vicina il Velo celebra una liturgia all'aperto per i
      morti della razzia. Il sacerdote che la guida parla piano, ma accanto a
      lui Sorella Celia suona il liuto, e la gente si ferma per lei più che
      per la preghiera. Qualcuno fra i presenti accenna il ritornello a bocca
      chiusa.

      Da giorni le voci ti seguono ovunque vai. Qui sotto la musica arrivano
      più deboli, e a tratti smetti di sentirle.

      {resilienza Media} Il liuto ha un ritmo che le voci non sanno seguire,
      con una pausa lunga ogni tre battute, e in quella pausa ti puoi
      appoggiare come a un muro.

      All'ingresso della piazza un accolito tiene una cassetta per le offerte
      e un cesto di candele votive, e a ogni ritornello sbadiglia dentro il
      velo convinto che nessuno se ne accorga.
    opzioni:
      - testo: "Restare fino alla fine della liturgia"
        descrizione: "Ascoltare tutto l'inno di Celia e lasciare che la musica copra il resto."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: L'ultima nota
          testo: |
            Quando Celia suona l'ultima nota ti accorgi che le voci hanno
            smesso da un pezzo, e che stavi canticchiando. Resti in piazza anche
            dopo che la gente se n'è andata.
          effetti: { tormento: -1 }
        fallimento:
          titolo: Fuori dalla musica
          testo: |
            A metà dell'inno le voci trovano il ritmo del liuto e cominciano a
            seguirlo, mezza battuta indietro. Te ne vai prima della fine, ma
            per qualche ora sei stato meglio.
          effetti: { tormento: -0.5 }
      - testo: "Accendere una candela votiva"
        requisiti: [monete >= 10]
        descrizione: "Una piccola offerta per una candela davanti alla statua dell'Albero."
        esito:
          titolo: La candela
          testo: |
            Accendi la candela e la guardi consumarsi mentre Celia suona, con
            la cera calda sulle dita. La fiamma resta dritta anche
            quando si alza il vento.
          effetti: { monete: -10, tormento: -0.5 }
