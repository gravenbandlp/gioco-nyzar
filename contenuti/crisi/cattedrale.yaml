# Crisi delle Ferite e del Tormento, con le aree di penalità della Cattedrale del Velo
# (Regolamento v0.4, sezione 5 e integrazione): convalescenza (infermeria e Giardini della
# Linfa) e delirio (celle della Cattedrale). In fondo le carte della fascia 5–7.

aree:
  - id: convalescenza
    nome: Convalescenza
    immagine: ambientazione/cattedrale-del-velo
    penalita: true
    testo: |
      L'infermeria della Cattedrale del Velo occupa la navata laterale a nord. Da una porta in fondo si esce
      nei Giardini della Linfa, dove il Velo coltiva piante bioluminescenti per i riti e gli unguenti.

      Le cure le dirige Padre Aurelio Vantes, che passa fra le brande due volte al giorno e posa a ciascuno
      una mano sul braccio. Le dimissioni le decide da sola Ottilia Sanvel, e finché lei non firma il tuo
      congedo il portone della Cattedrale per te resta chiuso.

  - id: delirio
    nome: Delirio
    immagine: fazioni/confraternita-del-velo
    penalita: true
    testo: |
      Le celle della Cattedrale stanno sotto il chiostro, lungo un corridoio di pietra grigia in fondo a
      dodici gradini. Sono sei stanze strette imbiancate a calce, dove il Velo tiene chi ha visto o sentito
      troppo.

      All'alba Ottilia Sanvel fa esercitare nel corridoio i novizi e i ricoverati che stanno in piedi. Qualche
      sera Sorella Celia porta il liuto in fondo al corridoio e suona per le celle. Padre Vantes tiene la
      chiave e scende una volta al giorno a guardare dalla grata.

quality:
  - { id: recupero.convalescenza, nome: Recupero in convalescenza, categoria: stato, descrizione: "Quanto ti sei rimess{o|a} in forze nell'infermeria della Cattedrale. Quando arriva a 15, Ottilia Sanvel può firmare il tuo congedo." }
  - { id: recupero.delirio, nome: Recupero dal delirio, categoria: stato, descrizione: "Quanta calma hai ritrovato nelle celle della Cattedrale. Quando arriva a 15, Padre Vantes può riaprirti la porta." }

storylet:
  # ================================================================ FERITE
  - id: crisi-ferite
    titolo: Il corpo non regge più
    tipo: crisi
    area: citta-bassa
    requisiti: [ferite >= 8]
    immagine: ambientazione/dispensa-di-gramm
    sommario: "Le ferite si sono sommate l'una all'altra, e stamattina le gambe non ti reggono."
    testo: |
      Ti svegli sul pavimento e non ricordi di esserti sdraiat{o|a}. Nella notte la ferita si è riaperta e la
      camicia ti si è incollata al fianco. Hai la febbre alta.

      {origine fuggiasco-di-ghoran} A Ghoran un corpo messo così lo spingevano in fondo alla fila, perché
      sulla bilancia valeva meno. Il pensiero ti fa stringere i denti più del dolore.

      Bisogna scegliere prima che le gambe decidano per te. Puoi stringere i denti e rimetterti in piedi da
      sol{o|a}, bruciando in pochi giorni la forza messa da parte con mesi di fatica.

      Oppure c'è l'infermeria della Cattedrale del Velo, che dopo la razzia accoglie chiunque arrivi in
      barella. Lì ti curano gratis, ma ci vuole tempo e quando uscire lo decidono i sacerdoti.
    opzioni:
      - testo: "Stringere i denti"
        costo: 0
        requisiti: [pe.resistenza >= 10]
        descrizione: "Chiuderti in casa e rimetterti in piedi da sol{o|a}. Perdi tutti i PE accumulati in Resistenza."
        esito:
          titolo: Tre giorni di febbre
          testo: |
            Passi tre giorni sulla branda con una brocca d'acqua e le imposte
            chiuse, a guardare la luce della fessura che attraversa il
            pavimento e poi torna indietro. La febbre sale fino al secondo
            giorno e poi cala, e nel mezzo parli con persone che non ci sono.
            Quando finalmente ti alzi le ferite si sono chiuse, ma il fiato che
            avevi guadagnato con mesi di fatica se n'è andato con la febbre.
          imposta: { ferite: 4, pe.resistenza: 0 }
      - testo: "Farti portare in Cattedrale"
        immagine: ambientazione/cattedrale-del-velo
        costo: 0
        descrizione: "Lasciare che due portatori del Velo ti carichino su una barella. In infermeria resterai finché non ti dimettono."
        esito:
          titolo: In barella
          testo: |
            Due portatori del Velo ti sollevano senza fare domande e ti portano su
            per le scale dei Quartieri Alti. Quando riapri gli occhi sei sotto una
            volta di pietra, e una voce calma legge il tuo nome da una tavoletta
            di cera.
          vai: convalescenza

  - id: convalescenza-giro
    titolo: Il giro del mattino
    area: convalescenza
    ripetibile: true
    immagine: personaggi/padre-vantes
    sommario: "Padre Vantes passa fra le brande e oggi vuole vederti camminare fino all'altare."
    testo: |
      Padre Vantes arriva con il giro del mattino, seguito da un novizio con il catino. È un uomo snello dagli
      occhi grigio chiaro e al collo porta soltanto il sigillo del Velo. Si ferma alla tua branda e ti ascolta
      il polso a lungo, a occhi chiusi.

      «Oggi voglio vederti camminare fino all'altare e ritorno» dice.

      In fondo alla navata il cristallo rosso sull'altare pulsa al ritmo delle ore, e da qui sembra molto più
      lontano di sessanta passi.

      {origine allievo-di-torvessa} All'Accademia qualunque banco di prova invidierebbe la regolarità di quel
      cristallo. Ti chiedi se Temmerin l'abbia mai visto da vicino.
    opzioni:
      - testo: "Camminare fino all'altare"
        descrizione: "Sono sessanta passi all'andata e altrettanti al ritorno, con tutti i ricoverati che ti guardano dalle brande."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Facile }
        successo:
          titolo: All'altare e ritorno
          testo: |
            Arrivi all'altare con la fronte bagnata e torni indietro più piano
            di come sei partit{o|a}, con il cristallo rosso che ti pulsa alle
            spalle. Padre Vantes annuisce e scrive qualcosa sulla tua
            tavoletta.
          effetti: { recupero.convalescenza: 1 }
        fallimento:
          titolo: A metà navata
          testo: |
            A metà navata le ginocchia cedono senza chiederti il permesso e ti ritrovi
            sedut{o|a} sulla pietra fredda, e tre ricoverati guardano altrove con impegno.
            Il novizio ti riaccompagna alla branda, e Vantes ti dice che domani ci
            riproverete.
          effetti: { recupero.convalescenza: 0.5 }

  - id: convalescenza-giardini
    titolo: Fra le aiuole della Linfa
    area: convalescenza
    ripetibile: true
    immagine: personaggi/sorella-giulia
    sommario: "Sorella Giulia ha bisogno di qualcuno che scelga le foglie buone per gli impiastri dell'infermeria."
    testo: |
      Nei Giardini della Linfa le foglie mandano una luce tenue anche a mezzogiorno. Sorella Giulia cammina
      lenta fra le aiuole con il palmo aperto, e un passero le si posa sulla mano.

      Ti fa sedere accanto a un cesto di foglie appena colte. Quelle sane servono per gli impiastri
      dell'infermeria e quelle con la ruggine vanno bruciate, ma sembrano tutte uguali.

      {natura Media} La ruggine comincia dal rovescio lungo la nervatura, mentre le foglie sane brillano anche
      di sotto.

      {origine figlio-del-circolo} Sorella Giulia tiene il palmo aperto e il polso morbido come al Circolo si
      insegna ai bambini con gli uccelli del Bosco, e ti chiedi dove l'abbia imparato.

      «Gli uccelli le distinguono subito» dice. «Prova a guardarle come farebbero loro, e lascia stare quelle
      di cui non sei sicur{o|a}.»
    opzioni:
      - testo: "Scegliere le foglie"
        descrizione: "Separare le foglie sane da quelle malate, una per una, sotto lo sguardo paziente di Sorella Giulia."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Il cesto giusto
          testo: |
            Alla fine del pomeriggio hai due mucchi ordinati e le dita verdi fino alle
            nocche. Sorella Giulia ne controlla una manciata e sposta una sola foglia.
            Stanotte, con l'impiastro sul fianco, dormi fino all'alba.
          effetti: { recupero.convalescenza: 1 }
        fallimento:
          titolo: La ruggine
          testo: |
            Sorella Giulia rovescia il tuo mucchio buono sul tavolo e ne tira
            fuori una dozzina di foglie arrugginite. Te le mostra una per una
            con pazienza e senza rimproveri, girandole controluce. Intanto il
            pomeriggio è passato lo stesso.
          effetti: { recupero.convalescenza: 0.5 }

  - id: convalescenza-corsia
    titolo: Il carrettiere della quarta branda
    area: convalescenza
    ripetibile: true
    immagine: personaggi/nadja-oresca
    sommario: "Nadja Oresca ha un ricoverato che rifiuta la minestra e spera che tu riesca a convincerlo."
    testo: |
      Nadja Oresca passa con la pentola della minestra e si ferma accanto a te più del necessario, girandosi
      intorno al dito un anello di rame che dimentica sempre di togliere.

      «Il carrettiere della quarta branda non mangia da due giorni, sai» dice a bassa voce. «Si è rotto una
      gamba cadendo dal Ponte del Conciatore e si è convinto che non camminerà più. A me non dà retta perché
      porto il velo, sai com'è. A te magari sì.»

      {origine figlio-della-citta-bassa} Il carrettiere ti riporta in mente il vecchio del carro del Festival,
      che aveva le mani nere di resina e chiamava ragazzo mio chiunque avesse meno di cinquant'anni.

      Ti mette in mano una scodella calda e resta ad aspettare. L'uomo della quarta branda guarda il soffitto
      e fa finta di dormire.
    opzioni:
      - testo: "Parlare con il carrettiere"
        descrizione: "Sederti sul bordo della sua branda con la scodella e trovare le parole giuste."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Facile }
        successo:
          titolo: Mezza scodella
          testo: |
            Gli racconti delle tue ferite e di come ti sei rialzat{o|a}, e ne
            aggiungi una inventata che suona meglio delle vere. Dopo un po'
            si tira su a sedere e mangia mezza scodella. Nadja ti ringrazia
            con un proverbio in lingua antica che nessuno dei due capisce.
          effetti: { recupero.convalescenza: 1 }
        fallimento:
          titolo: La schiena voltata
          testo: |
            Il carrettiere si gira dall'altra parte senza risponderti, e la
            branda geme sotto di lui. Torni alla tua con la scodella ancora
            piena e la mangi tu, visto che ormai è fredda.
          effetti: { recupero.convalescenza: 0.5 }

  - id: convalescenza-uscita
    titolo: Il congedo di Ottilia
    area: convalescenza
    ripetibile: true
    requisiti: [recupero.convalescenza >= 15]
    immagine: personaggi/ottilia-sanvel
    sommario: "Ottilia Sanvel è venuta a firmare il tuo congedo e vuole sapere dove andrai."
    testo: |
      Ottilia Sanvel arriva alla tua branda senza farsi annunciare. Legge la tavoletta di cera appesa al
      chiodo e ti guarda le mani e le caviglie.

      {origine accolito-del-velo} L'ultima volta ti ha mandato in Città Bassa con una borsa di bende. Sei
      tornat{o|a} in barella, e lei non lo commenta.

      «Il letto serve a qualcun altro. Padre Vantes chiede se hai un posto dove andare, e io chiedo soltanto
      che tu non torni qui entro un mese.»

      Firma il congedo e lo stacca dalla tavoletta. Mentre raccogli le tue cose, Sorella Giulia si affaccia
      dalla porta dei Giardini con un fagotto di foglie e chiede se qualcuno scende verso il Mercato dei Nodi.
    opzioni:
      - testo: "Scendere a piedi in Città Bassa"
        descrizione: "Sono più di trecento gradini. Le gambe dovrebbero reggerti."
        esito:
          titolo: I trecento gradini
          testo: |
            Scendi la scala un gradino alla volta, e a metà ti fermi con
            la mano sul corrimano, ma non ti siedi. *Se mi siedo, mi riportano su in
            barella.* In fondo ti accoglie il fumo delle fucine, e non ti è mai
            sembrato così buono. Le gambe hanno retto fino all'ultimo gradino.
          imposta: { ferite: 3, recupero.convalescenza: 0 }
          pe: { resistenza: 10 }
          vai: citta-bassa
      - testo: "Portare le foglie a Nestor Gramm"
        descrizione: "Il fagotto di Sorella Giulia va alla Dispensa di Gramm, sul Mercato dei Nodi. Lungo la strada lei ti spiega a cosa serve ogni foglia."
        quando: [pista.pelle < 4, colpo.dispensa == 0]
        esito:
          titolo: Il fagotto di Giulia
          testo: |
            Sorella Giulia ti accompagna fino al portone e intanto ti spiega
            quali foglie calmano la febbre e quali fermano il sangue. Sui Ponti
            Nestor Gramm apre il fagotto e ne annusa il contenuto a lungo, con
            il naso quasi dentro le foglie. Poi ti fa un cenno che da lui vale
            come un ringraziamento.
          imposta: { ferite: 3, recupero.convalescenza: 0 }
          pe: { natura: 10 }
          vai: ponti-sospesi
      - testo: "Portare le foglie alla Dispensa di Gramm"
        descrizione: "Il fagotto di Sorella Giulia va alla Dispensa di Gramm, sul Mercato dei Nodi, dove adesso al banco c'è il garzone di Nestor."
        quando: [colpo.dispensa >= 1]
        esito:
          titolo: Il fagotto di Giulia
          testo: |
            Sorella Giulia ti accompagna fino al portone e intanto ti spiega
            quali foglie calmano la febbre e quali fermano il sangue. Sui Ponti
            il garzone della Dispensa apre il fagotto e ne annusa il contenuto
            a lungo, come faceva Nestor. Poi ti chiede di ripetergli quello che
            ti ha detto Giulia, e se lo segna sul grembiule con un carboncino,
            sbagliando l'ortografia di due foglie su tre.
          imposta: { ferite: 3, recupero.convalescenza: 0 }
          pe: { natura: 10 }
          vai: ponti-sospesi
      - testo: "Portare le foglie alla Dispensa di Gramm"
        descrizione: "Il fagotto di Sorella Giulia va alla Dispensa di Gramm, sul Mercato dei Nodi, dove adesso al banco c'è il garzone di Nestor."
        quando: [pista.pelle >= 4, colpo.dispensa == 0]
        esito:
          titolo: Il fagotto di Giulia
          testo: |
            Sorella Giulia ti accompagna fino al portone e intanto ti spiega quali
            foglie calmano la febbre e quali fermano il sangue. Sui Ponti il
            garzone della Dispensa apre il fagotto e ne annusa il contenuto a
            lungo, come faceva Nestor. Poi ti chiede di ripetergli quello che ti
            ha detto Giulia, e se lo segna sul grembiule con un carboncino.
          imposta: { ferite: 3, recupero.convalescenza: 0 }
          pe: { natura: 10 }
          vai: ponti-sospesi
      - testo: "Uscire dal portico sui Quartieri Alti"
        requisiti: [invito >= 1]
        descrizione: "Padre Vantes ti accompagna fuori insieme a una famiglia di benefattori venuta a visitare i feriti."
        esito:
          titolo: I benefattori
          testo: |
            Padre Vantes ti presenta ai benefattori come uno dei feriti che la
            loro offerta ha rimesso in piedi. Ringrazi con le parole giuste e
            nel modo in cui si ringrazia quassù, con la schiena dritta e gli
            occhi bassi il giusto, e la signora ti stringe la mano con il
            guanto, che poi si pulisce di nascosto sulla gonna.

            {origine rampollo-dei-quartieri-alti} La signora la conosci di
            vista dai salotti, e dal modo in cui la guardi capisce che la
            conosci. Il guanto se lo pulisce lo stesso, soltanto più in fretta.
          imposta: { ferite: 3, recupero.convalescenza: 0 }
          pe: { galateo: 10 }
          vai: quartieri-alti

  # ================================================================ TORMENTO
  - id: crisi-tormento
    titolo: Le voci restano
    tipo: crisi
    area: citta-bassa
    requisiti: [tormento >= 8]
    immagine: ambientazione/mito-occhio-nel-cristallo
    sommario: "Da tre notti non dormi, e le voci che senti non smettono più quando apri gli occhi."
    testo: |
      Da tre notti non dormi. Quando chiudi gli occhi senti sillabe brevi e regolari salire da sotto il
      pavimento, e continuano anche quando li riapri. Stamattina hai contato due volte le monete della borsa e
      ti sono venuti due numeri diversi.

      {origine apprendista-raschiatore} Sulle piattaforme il nome di Mirn il Sordo si dice a bassa voce, e
      tutti guardano allo stesso modo chi risale dai tunnel con le voci nelle orecchie. Adesso ti guardi così
      anche tu.

      Puoi affrontare le voci con la disciplina che ti sei costruit{o|a} e consumarla tutta in una notte.
      Oppure puoi fare come Mirn il Sordo, e
      lasciare che la Confraternita ti chiuda in una cella della Cattedrale finché le voci tacciono.
    opzioni:
      - testo: "Affrontare le voci da sol{o|a}"
        costo: 0
        requisiti: [pe.resilienza >= 10]
        descrizione: "Sederti al buio e ascoltare le voci finché si stancano. Perdi tutti i PE accumulati in Resilienza."
        esito:
          titolo: La notte al buio
          testo: |
            Resti sedut{o|a} al buio con la schiena contro il muro e le ascolti
            senza rispondere, anche quando a notte fonda cominciano a chiamarti
            per nome. Una alla volta le voci si allontanano, come passanti che
            hanno perso interesse. All'alba sei svuotat{o|a}, con il collo rigido e
            le mani strette sulle ginocchia, e la disciplina che avevi messo da
            parte l'hai spesa tutta stanotte.
          imposta: { tormento: 4, pe.resilienza: 0 }
      - testo: "Consegnarti alla Confraternita"
        immagine: ambientazione/cattedrale-del-velo
        costo: 0
        descrizione: "Chiedere al Velo una cella e lasciare che ti chiudano dentro. Uscirai quando lo deciderà Padre Vantes."
        esito:
          titolo: Dodici gradini
          testo: |
            Due accoliti velati ti accompagnano sotto il chiostro senza
            toccarti. Conti i gradini ad alta voce e sono dodici, poi lo
            chiedi all'accolito e lui ti conferma che sono dodici, gentile,
            come l'avrà confermato a tanti altri prima di te. Dietro di te la
            porta si chiude con un rumore di ferro.
          vai: delirio

  - id: delirio-campane
    titolo: Le campane delle ore
    area: delirio
    ripetibile: true
    immagine: ambientazione/cattedrale-del-velo
    sommario: "Le campane delle ore sacre attraversano la volta, e se le conti tutte il giorno torna a stare in piedi."
    testo: |
      Dalla feritoia vedi un rettangolo di cielo che cambia colore, e a certe ore ti pare che cambi anche
      forma. Il resto del tempo lo scandiscono le campane delle ore sacre, che arrivano attutite attraverso la
      volta del corridoio.

      Un accolito ti ha lasciato un pezzo di carbone. Sulla parete accanto alla panca il ricoverato di prima
      ha tracciato file di tacche, e tu hai cominciato una fila tua. Il problema sono le voci, che fra un
      rintocco e l'altro contano anche loro in una lingua che non conosci, con numeri che non tornano mai con
      i tuoi.
    opzioni:
      - testo: "Contare le ore di un giorno intero"
        descrizione: "Segnare sulla parete ogni rintocco dall'alba alla compieta, senza perderne nessuno."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Facile }
        successo:
          titolo: Una fila completa
          testo: |
            La sera la tua fila di tacche è completa e coincide con quella del
            ricoverato di prima, tacca per tacca. Ti addormenti prima
            dell'ultima campana.
          effetti: { recupero.delirio: 1 }
        fallimento:
          titolo: Tacche in più
          testo: |
            Verso il pomeriggio ti accorgi di avere segnato tacche anche per
            rintocchi che nessuno ha suonato. Le cancelli con il pollice, che
            si annerisce di carbone, e ricominci da capo, più piano di prima.
          effetti: { recupero.delirio: 0.5 }

  - id: delirio-corridoio
    titolo: Il corridoio all'alba
    area: delirio
    ripetibile: true
    immagine: personaggi/ottilia-sanvel
    sommario: "All'alba Ottilia Sanvel fa esercitare nel corridoio i novizi, e anche chi fra i ricoverati riesce a stare in piedi."
    testo: |
      All'alba l'accolito apre le porte e Ottilia Sanvel scende nel corridoio con i novizi. Insegna una
      sequenza di movimenti lenti che servono per pregare e per combattere, e i ricoverati che se la sentono
      si mettono in fondo.

      «Il respiro va con le braccia» dice Ottilia. «Alla testa non pensate. Contate i movimenti, e il resto
      viene da sé.»

      Nel corridoio c'è appena lo spazio per allargare le braccia, e quando provi ad alzarle ti scricchiolano
      le spalle.
    opzioni:
      - testo: "Seguire la sequenza"
        descrizione: "Muovere le braccia come dice Ottilia, dal primo movimento all'ultimo, senza perdere l'equilibrio."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Facile }
        successo:
          titolo: Fino all'ultimo movimento
          testo: |
            Arrivi in fondo alla sequenza insieme ai novizi, con il sudore che
            ti si raffredda sulla nuca. Per tutto il tempo hai sentito soltanto
            il fruscio delle maniche, e Ottilia ti rivolge un cenno breve prima di
            risalire.
          effetti: { recupero.delirio: 1 }
        fallimento:
          titolo: Fuori tempo
          testo: |
            A metà sequenza le voci tornano a contarti i movimenti, uno avanti
            a te, e perdi il ritmo. Il gomito urta il muro. Ottilia ti rimette
            in fila con una mano pesante sulla spalla, e fino alla fine resti
            un movimento indietro.
          effetti: { recupero.delirio: 0.5 }

  - id: delirio-liuto
    titolo: Il liuto in fondo al corridoio
    area: delirio
    ripetibile: true
    immagine: personaggi/sorella-celia
    sommario: "La sera Sorella Celia suona per le celle, e chiede ai ricoverati di cantare il ritornello con lei."
    testo: |
      La sera Sorella Celia porta il liuto in fondo al corridoio e si siede sull'ultimo gradino. Accorda senza
      guardare e attacca un inno del Velo con un ritornello che torna uguale a ogni strofa.

      «Il ritornello lo cantate voi» dice verso le grate. «Non importa se siete stonati, qui dentro
      l'importante è arrivare alla fine insieme.»

      Da una cella in fondo qualcuno comincia a cantare fuori tempo, con molta convinzione.

      {espressivita Media} È un inno scritto per chi non sa cantare, e il ritornello scende di un tono alla
      fine.
    opzioni:
      - testo: "Cantare il ritornello"
        descrizione: "Tenere la voce sul ritornello di Celia per tutto l'inno, anche quando le altre voci provano a cantare sopra la tua."
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Insieme fino alla fine
          testo: |
            Alla terza strofa le celle cantano tutte insieme, e tu con loro,
            stonato quanto gli altri. Quando Celia smette di suonare il
            corridoio resta in silenzio fino al mattino.
          effetti: { recupero.delirio: 1 }
        fallimento:
          titolo: Un'altra melodia
          testo: |
            A metà dell'inno ti accorgi che stai cantando una melodia diversa,
            che nessuno ti ha insegnato e che la gola conosce a memoria. Ti
            si gela la schiena. Celia rallenta e aspetta che tu ritrovi la
            sua.
          effetti: { recupero.delirio: 0.5 }

  - id: delirio-uscita
    titolo: La porta aperta
    area: delirio
    ripetibile: true
    requisiti: [recupero.delirio >= 15]
    immagine: personaggi/padre-vantes
    sommario: "Padre Vantes è sceso con la chiave, e stavolta la gira nella serratura."
    testo: |
      Padre Vantes scende i dodici gradini con la chiave in mano, e oggi apre la cella ed entra. Si siede
      accanto a te sulla panca e ti tiene due dita sul polso finché il battito rallenta.

      «Quando dubiti, tocca» dice. «Così ti ricordi di non essere sol{o|a} nella stanza. Adesso le voci le
      senti ancora?»

      Rispondi di no, e ti accorgi che è vero. Vantes esce e lascia la porta aperta. Dal chiostro una strada
      scende verso la Città Bassa e un'altra porta ai Ponti Sospesi, e dietro il chiostro Ottilia Sanvel tiene
      gli archivi minori della Cattedrale.
    opzioni:
      - testo: "Tornare in Città Bassa"
        descrizione: "Tornare fra le fucine e il rumore, con la testa finalmente sgombra."
        esito:
          titolo: Il martello della Città Bassa
          testo: |
            In Città Bassa il martello delle fucine batte come sempre, e qualcuno ti
            urta senza chiedere scusa. Per la prima volta da giorni riesci a sentirlo
            senza contare i colpi.
          imposta: { tormento: 3, recupero.delirio: 0 }
          pe: { resilienza: 10 }
          vai: citta-bassa
      - testo: "Tornare sui Ponti Sospesi"
        descrizione: "Tornare dove il vento non smette mai, e imparare ad ascoltare soltanto quello che c'è davvero."
        esito:
          titolo: Il cigolio delle corde
          testo: |
            Sui Ponti il vento fa cigolare le corde di continuo, e per un
            momento il cuore ti si stringe. Poi ascolti meglio. Adesso sai
            distinguere il cigolio di una corda buona da quello di una che
            cederà, e le voci non si confondono più con il resto.
          imposta: { tormento: 3, recupero.delirio: 0 }
          pe: { percezione: 10 }
          vai: ponti-sospesi
      - testo: "Passare una mattina negli archivi"
        requisiti: [invito >= 1]
        descrizione: "Ottilia Sanvel ti concede una mattina fra gli archivi minori prima di lasciarti uscire nei Quartieri Alti."
        esito:
          titolo: Gli archivi minori
          testo: |
            Ottilia ti fa sedere a un tavolo con un registro di atti del Velo
            vecchi di vent'anni, che odora di polvere e di colla di pesce.
            Leggi fino a mezzogiorno, e le righe restano ferme sulla pagina per
            tutto il tempo.
          imposta: { tormento: 3, recupero.delirio: 0 }
          pe: { accademiche: 10 }
          vai: quartieri-alti

  # ================================================================ CARTE DELLA FASCIA 5–7
  - id: carta-ferite-cassa
    titolo: Una cassa da portare
    tipo: carta
    area: ovunque
    requisiti: [ferite >= 5, ferite < 8]
    immagine: fazioni/gilda-dei-mercanti
    sommario: "Un mercante della Gilda ha perso il facchino e paga bene chi gli porta una cassa in cima alla scala."
    testo: |
      Un mercante della Gilda con i polsini di pizzo sta in piedi accanto a una cassa di lamiera chiusa con
      due catenacci. Il facchino se n'è andato a metà strada, e lui cerca fra i passanti qualcuno con le
      spalle larghe.

      {origine mercante-dei-ponti} Il tipo lo conosci dalla Gilda, uno che tratta da facchino anche un collega
      con la licenza. Se ti vede caricare quella cassa, al Mercato dei Nodi lo sapranno entro sera.

      Si ferma su di te e decide di non vedere le bende che ti spuntano dalla manica. «Ti pago bene per
      portarla in cima alla scala» dice, «e molto meno se mi aiuti soltanto a caricarla sul carretto.»

      Le tue ferite però non sono ancora chiuse.
    opzioni:
      - testo: "Portarla in cima alla scala"
        descrizione: "Una buona paga, e una ferita che quasi certamente si riapre."
        esito:
          titolo: In cima alla scala
          testo: |
            Arrivi in cima con la cassa sulle spalle e la camicia bagnata, con le
            gambe che tremano sull'ultimo gradino. Il mercante ti paga senza contare.
            Solo più tardi ti accorgi che la benda sul fianco è diventata rossa.
          effetti: { monete: 15, ferite: 1 }
      - testo: "Aiutarlo a caricarla sul carretto"
        descrizione: "Una paga più magra per uno sforzo breve, che però ti tira i punti."
        esito:
          titolo: Sul carretto
          testo: |
            Sollevate la cassa in due e la fate scivolare sul pianale, e il mercante
            sbuffa più di te. Ti dà qualche moneta, e tu senti i punti tirare per il
            resto della giornata.
          effetti: { monete: 6, ferite: 0.5 }
      - testo: "Lasciar perdere"
        costo: 0
        descrizione: "Declinare con un cenno e proseguire per la tua strada."
        esito:
          testo: |
            Scuoti la testa e prosegui, con il fianco che ringrazia. Dietro di
            te il mercante ha già fermato qualcun altro.
          effetti: {}
      - testo: "Farti mandare dal cerusico della Gilda"
        requisiti: [monete >= 20]
        descrizione: "Il mercante ha visto le bende. Il cerusico che cura i facchini della Gilda costa caro, ma lavora bene."
        esito:
          titolo: Il cerusico dei facchini
          testo: |
            Il mercante ti scrive due righe su un biglietto e ti indica una porta
            dietro il Mercato dei Nodi. Il cerusico legge il biglietto, si fa
            pagare prima di guardarti e poi ti rifà i punti uno per uno, senza
            fretta. Quando esci il fianco tira molto meno.
          effetti: { monete: -20, ferite: -1 }

  - id: carta-ferite-bende
    titolo: La borsa delle bende
    tipo: carta
    area: ovunque
    requisiti: [ferite >= 5, ferite < 8]
    immagine: fazioni/confraternita-del-velo
    sommario: "Una novizia del Velo fa il giro della città con una borsa di bende, e si ferma quando vede come cammini."
    testo: |
      Dopo la razzia il Velo manda i novizi per la città a medicare chi non riesce ad arrivare in Cattedrale.
      Questa è una ragazza con il velo corto dei primi anni e una borsa di tela piena di bende e di vasetti di
      unguento. Ha le guance rosse per la salita e le scarpe di qualcuno con il piede più grande.

      {origine accolito-del-velo} Il giro con la borsa di bende l'hai fatto anche tu dopo la razzia. Lei
      invece non ti riconosce e ti tratta come un ferito qualunque, e un poco ti punge.

      Ti vede zoppicare e ti solleva la manica senza chiedere. «Posso cambiarti le bende per un'offerta» dice.
      «Se invece mi aiuti con il giro di oggi, ti medico alla fine senza chiederti niente.»
    opzioni:
      - testo: "Lasciare un'offerta"
        requisiti: [monete >= 12]
        descrizione: "Un'offerta per la cassetta della Cattedrale e bende pulite subito."
        esito:
          titolo: Bende pulite
          testo: |
            Ti medica seduta sul bordo di una fontana, con le mani svelte e fredde, e
            intanto ti chiede se hai mangiato. Mette le monete in un sacchetto a parte
            e ti benedice prima di proseguire il giro.
          effetti: { monete: -12, ferite: -1 }
      - testo: "Aiutarla nel giro dei feriti"
        descrizione: "Seguirla di casa in casa per reggerle i catini e tenere fermi i pazienti mentre lei li medica."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Il giro completo
          testo: |
            Impari in fretta come si tiene fermo un braccio e dove si stringe una
            benda, e a non guardare in faccia chi urla. Alla fine del giro la novizia
            ti medica con cura e ti lascia anche un vasetto di unguento avanzato.
          effetti: { ferite: -1 }
        fallimento:
          titolo: Il catino rovesciato
          testo: |
            Alla terza casa rovesci un catino sul pavimento di una vedova, che vi
            caccia tutti e due con la scopa in mano. La novizia ti cambia le bende lo
            stesso, in fretta, sul gradino di fuori.
          effetti: { ferite: -0.5, scandalo: 0.5 }
      - testo: "Comprarle l'unguento e farti medicare a fondo"
        requisiti: [monete >= 25]
        descrizione: "Nella borsa ha un vasetto d'unguento buono, di quelli che in Cattedrale si danno ai feriti gravi. Si paga a parte."
        esito:
          titolo: L'unguento buono
          testo: |
            La novizia apre il vasetto con i denti perché ha le mani occupate. Ti
            pulisce le ferite una per una e le copre con l'unguento. L'unguento
            prima brucia e poi rinfresca. Quando ha finito ti rifà le bende strette e ti
            raccomanda di non sollevare niente per una settimana.
          effetti: { monete: -25, ferite: -2 }

  - id: carta-tormento-vento
    titolo: Le notti di vento da est
    tipo: carta
    area: ovunque
    requisiti: [tormento >= 5, tormento < 8]
    immagine: ambientazione/evento-notte-dei-sussurri
    sommario: "Un vecchio Raschiatore paga chi gli tiene compagnia nelle notti di vento da est, e racconta cosa sente."
    testo: |
      Il vecchio ha le mani nodose dei Raschiatori. Ha smesso di scendere tredici anni fa, dopo la Notte dei
      Sussurri, e da allora nelle notti di vento da est non riesce a dormire da solo.

      «Stanotte il vento gira» dice mostrandoti una manciata di monete. «Ti pago per restare svegli{o|a} con
      me fino all'alba ad ascoltare cosa ho sentito quella notte e cosa sento ancora. Però dopo le voci le
      senti anche tu.»

      {empatia Media} Ha più paura di restare solo che delle voci, e offre il prezzo di chi si vergogna di
      chiedere.
    opzioni:
      - testo: "Restare con lui fino all'alba"
        descrizione: "Una paga per la notte e tutta la storia, con quello che il vecchio sente ancora nelle notti di vento."
        esito:
          titolo: Fino all'alba
          testo: |
            Il vecchio parla fino all'alba di sillabe brevi e di pause
            regolari, e del giorno in cui la voce ha detto il suo nome. Verso
            le quattro si addormenta a metà frase, e si risveglia per finirla. Quando
            se ne va ti lascia le monete sul tavolo. Tu, per tutta la mattina,
            senti ancora il ritmo di quelle pause.
          effetti: { monete: 10, informazioni.voce: 1, tormento: 1.5 }
      - testo: "Restare fino a mezzanotte"
        descrizione: "Una paga più magra e mezza storia. Il resto lo lasci al vento."
        esito:
          titolo: Mezza storia
          testo: |
            A mezzanotte ti alzi e lui non prova a trattenerti. Ti dà qualche
            moneta contandola due volte, poi ricomincia a raccontare da solo
            a mezza voce, rivolto alla finestra.
          effetti: { monete: 4, tormento: 1 }
      - testo: "Rifiutare"
        costo: 0
        descrizione: "Augurargli la buona notte e lasciarlo al suo vento."
        esito:
          testo: |
            Il vecchio richiude la mano sulle monete e annuisce, senza
            rancore. Lo lasci davanti alla porta a guardare verso est.
          effetti: {}
      - testo: "Pagare una veglia in Cattedrale per tutti e due"
        requisiti: [monete >= 20]
        descrizione: "In Cattedrale si paga un accolito perché vegli e preghi fino all'alba. Con qualcuno sveglio accanto, il vento si sente meno."
        esito:
          titolo: La veglia
          testo: |
            L'accolito vi fa sedere su una panca della cappella laterale e accende
            una lampada. Prega a mezza voce per tutta la notte, senza mai alzare il
            tono. Il vecchio si addormenta prima di mezzanotte con la testa sulla
            tua spalla, e poco dopo dormi anche tu, senza voci.
          effetti: { monete: -20, tormento: -1 }

  - id: carta-tormento-liuto
    titolo: Una liturgia in piazza
    tipo: carta
    area: ovunque
    requisiti: [tormento >= 5, tormento < 8]
    immagine: personaggi/sorella-celia
    sommario: "Sorella Celia accompagna col liuto una liturgia all'aperto, e per un'ora la piazza si ferma ad ascoltare."
    testo: |
      Nella piazza più vicina il Velo celebra una liturgia all'aperto per i morti della razzia. Il sacerdote
      parla piano, ma accanto a lui Sorella Celia suona il liuto, e la gente si ferma per lei più che per la
      preghiera.

      Da giorni le voci ti seguono ovunque. Sotto la musica arrivano più deboli, e a tratti smetti di
      sentirle.

      {resilienza Media} Il liuto ha una pausa lunga ogni tre battute che le voci non sanno seguire, e in
      quella pausa ti puoi appoggiare come a un muro.

      All'ingresso della piazza un accolito tiene una cassetta per le offerte e un cesto di candele votive.
    opzioni:
      - testo: "Restare fino alla fine della liturgia"
        descrizione: "Ascoltare tutto l'inno di Celia e lasciare che la musica copra il resto."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: L'ultima nota
          testo: |
            Quando Celia suona l'ultima nota ti accorgi che le voci hanno
            smesso da un pezzo, e che stavi canticchiando. Resti in piazza anche
            dopo che la gente se n'è andata.
          effetti: { tormento: -1 }
        fallimento:
          titolo: Fuori dalla musica
          testo: |
            A metà dell'inno le voci trovano il ritmo del liuto e cominciano a
            seguirlo, mezza battuta indietro. Te ne vai prima della fine, ma
            per qualche ora sei stato meglio.
          effetti: { tormento: -0.5 }
      - testo: "Accendere una candela votiva"
        requisiti: [monete >= 10]
        descrizione: "Una piccola offerta per una candela davanti alla statua dell'Albero."
        esito:
          titolo: La candela
          testo: |
            Accendi la candela e la guardi consumarsi mentre Celia suona, con
            la cera calda sulle dita. La fiamma resta dritta anche
            quando si alza il vento.
          effetti: { monete: -10, tormento: -0.5 }
      - testo: "Chiedere a Celia di suonare ancora, per te"
        requisiti: [monete >= 30]
        descrizione: "Un'offerta grande alla cassetta, e Celia resta in piazza dopo la liturgia a suonare l'inno da capo."
        esito:
          titolo: L'inno da capo
          testo: |
            L'accolito porta la tua offerta a Celia, che ti guarda un momento e
            poi si siede sul gradino della fontana. Suona di nuovo l'inno più
            lentamente. Ad ascoltarla ci siete tu e un cane che si è fermato. Alla
            fine della seconda volta le voci non tornano, e restano lontane per
            giorni.
          effetti: { monete: -30, tormento: -2 }
