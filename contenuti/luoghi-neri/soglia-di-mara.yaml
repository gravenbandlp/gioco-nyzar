# La Soglia di Mara (docs/piano-superficie.md, «Le nove spedizioni dei luoghi neri»). Un arco di pietra nera alto
# quattro metri, a piombo e senza muri, sul crinale di una collina a est della Roccia di Wren (codex
# sf-soglia-di-mara). È una porta di servizio: chi ci passa sotto al tramonto è per tre battiti dentro la Campana,
# sotto una scogliera della costa grigia a nord-est (la pioggia salata, il fuoco di legna). La spedizione scende nel
# crinale cavo, sotto la soglia, fino a un secondo arco uguale al primo, e non arriva mai alla Campana: la vede per
# tre battiti, e non si dice che cos'è.
# Ci si entra da `soglia-di-mara-il-crinale` (Superficie, ripetibile, traccia.mara >= 3).
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 la scala dai gradini lunghi o l'acqua di mare sul pianerottolo, 1 gli armadi stretti o lo sgabello della
# vecchia, 2 i granchi del sale (scontro) o le pompe, 3 il cerchio dei nove incavi o il fumo di legna; i tre
# battiti nel corridoio valgono da 1 a 3.
# Il cuore a 4 è la soglia di sotto (`soglia-di-mara-la-soglia-di-sotto`, misura.mara == 0): il portinaio con la
# cerata grigia (boss), oppure rifare il suo gesto, il Comando, o presentarsi come uno del turno (Difficili). La
# vittoria dà misura.mara, la Cerata del portinaio (grado 2) e parti dei Precursori. Dopo,
# `soglia-di-mara-tre-battiti-di-la` (ripetibile, misura.mara >= 1) rende meno: si passa di nuovo e si afferra
# quello che si trova nei tre battiti.
# La misura, per chi scrive la Campana: la chiave del passaggio è un gesto. Al tramonto si appoggia il palmo
# sinistro aperto sul pilastro di sinistra, all'altezza della spalla, e si passa sotto l'arco a occhi chiusi,
# contando i tre battiti. Chi lo fa resta dall'altra parte per tutto il tempo che tiene gli occhi chiusi (nel
# gioco, qui, non li tiene chiusi più di tre battiti). Di là si sono visti una parete di pietra nera bagnata, la
# pioggia salata che cade da una fessura in alto, il mare vicinissimo, un fuoco di legna di mare acceso in un
# braciere di ferro senza nessuno intorno, e nel pavimento un fascio di condotti che arrivano da sud-ovest.
# Lo sgabello, la pipa e lo scialle nella stanza della vecchia lasciano intendere che Mara scendeva qui. Non si dice.
# Il segno che lega i luoghi neri: il cerchio di nove incavi con uno inciso più a fondo (vedi lente-del-sornione.yaml),
# qui con dentro il segno della porta (la seconda pietra dell'Anello), e il condotto che va a nord-est.
aree:
  - id: soglia-di-mara
    immagine: ambientazione/roccia-di-wren
    nome: La Soglia di Mara
    sommario: "Sotto l'arco senza muri il crinale è cavo. Una scala scende nella collina, e più si scende più l'aria sa di mare."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Sotto la Soglia di Mara la collina è cava. Una scala dai gradini lunghi scende dentro il crinale, e
      dalle pareti di pietra nera trasuda un'acqua che asciugando lascia croste bianche. Le croste si
      sbriciolano sotto le dita e sulla lingua sanno di sale. Più in basso l'aria si fa umida e sa di mare,
      anche se il mare è a giorni di cammino. Ti dici che dentro la collina passa una falda salata, e che la
      pietra la tira su da secoli.

      Ogni tanto dal buio arriva un soffio di vento bagnato con l'odore di un fuoco di legna. È più tiepido
      dell'aria della scala e viene sempre dal basso. Dura tre battiti, e poi la collina torna asciutta.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: soglia-di-mara-il-crinale
    presso: i-luoghi-neri
    immagine: ambientazione/roccia-di-wren
    titolo: L'arco sul crinale
    sommario: "Sul crinale a est della Roccia di Wren un arco di pietra nera sta dritto come un filo a piombo, senza muri ai lati e senza strada."
    luogo: Superficie Fratturata, il crinale a est della Roccia di Wren
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.mara >= 3]
    testo: |
      Il crinale corre sopra il Torvessa, e da lassù si vede verso ovest la Roccia di Wren, una lingua di
      pietra nera che esce dall'acqua melmosa. Sulla gobba più alta sta un arco di pietra nera alto due volte
      un uomo e dritto a piombo, senza muri ai lati. Ogni pilastro è un blocco solo senza giunture, e
      l'architrave ci posa sopra senza un filo di malta. Ai piedi dell'arco la pietra della soglia è consumata
      nel mezzo, dove passavano molti piedi. Ti dici che è un vecchio segno di confine dei pastori, fatto
      grande per vederlo da lontano. Eppure sull'erba intorno all'arco, per una decina di passi, non c'è lo
      sterco di una capra né la tana di una talpa.

      {natura Media} Il vento sa di fiume, eppure sotto l'arco l'erba è coperta di una polvere bianca che sa
      di sale.

      {origine figlio-della-citta-bassa} In Città Bassa le madri spaventano i bambini con la Roccia di Wren e
      con il Cucitore che ci viveva. Da quassù sembra soltanto un dito nero.

      Il sole cala dietro la Roccia, e la tua ombra si allunga sull'erba fino ad attraversare la soglia.
    opzioni:
      - testo: "Passare sotto l'arco al tramonto"
        descrizione: "Tre battiti di pioggia salata, dicono. Bisogna reggerli e tenere gli occhi aperti, perché dopo si deve guardare dove si mettono i piedi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Tre battiti
          testo: |
            Passi sotto l'arco con l'ultimo sole negli occhi, e per tre battiti di cuore sei al buio sotto una
            pioggia salata, con il rumore del mare dappertutto. Poi sei di nuovo sul crinale con i capelli
            bagnati e le labbra che sanno di sale, e il vento ti gela la pioggia addosso. Dietro di te la
            pietra della soglia si è sollevata di un palmo da una parte, e sotto c'è una scala che scende
            nella collina.
          pe: { resilienza: 2 }
          vai: soglia-di-mara
        fallimento:
          titolo: In ginocchio
          testo: |
            Per tre battiti la pioggia salata ti entra negli occhi e in bocca, e quando torni sul crinale sei
            in ginocchio sull'erba, con i capelli fradici e il cuore che non trova il passo. Nelle orecchie ti
            resta un rumore di risacca, e il fiume là sotto scorre senza fare onde. Il sole è tramontato, e la
            soglia è una pietra come un'altra.
          effetti: { tormento: 0.5 }
      - testo: "Cercare la giuntura ai piedi dei pilastri"
        descrizione: "Una pietra consumata nel mezzo è stata calpestata da molti piedi. Chi passava di qui andava da qualche parte, e forse andava sotto."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La pietra che si alza
          testo: |
            Giri intorno alla soglia a quattro zampe, con la guancia sull'erba, finché vedi la fessura sottile
            che corre lungo il bordo della pietra consumata. È dritta e larga quanto un'unghia, e dentro non
            c'è terra né una radice. Ci infili la lama e fai leva, e la pietra si solleva da una parte,
            leggera come un coperchio. Sotto c'è una scala che scende nella collina, e dal buio sale un'aria
            umida che sa di alga.
          pe: { percezione: 2 }
          vai: soglia-di-mara
        fallimento:
          titolo: La lama spezzata
          testo: |
            Infili la lama nella prima fessura che trovi e fai leva con tutto il peso. La punta si spezza con
            uno schiocco, e ti apri il pollice sul filo. La punta resta incastrata nella crepa, e la pietra
            intorno non ha nemmeno un graffio. Lasci il crinale con il pollice in bocca e la soglia chiusa
            come prima.
          effetti: { ferite: 0.5 }
      - testo: "Salire a cavallo e lasciar fare il cavallo"
        descrizione: "Le bestie non passano sotto l'arco. Dove il cavallo si ferma, sotto c'è il vuoto."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il cavallo che non passa
          testo: |
            Sali il crinale a cavallo, e a dieci passi dall'arco il cavallo si pianta e non c'è verso di farlo
            andare avanti. Tiene le orecchie piatte all'indietro e ha il collo bagnato di sudore, anche se la
            salita è stata breve. Batte uno zoccolo sulla terra, sempre nello stesso punto, e la terra suona
            vuota. Scavi lì, e la pala trova il bordo della pietra della soglia, che si solleva su una scala
            che scende nella collina.
          vai: soglia-di-mara
      - testo: "Scavare sotto la soglia con la pala"
        descrizione: "Sotto una pietra c'è terra, e sotto la terra si vedrà. Ci vuole tutta la sera."
        costo: 2
        esito:
          titolo: La pala sotto la soglia
          testo: |
            Scavi accanto alla pietra della soglia fino a sera, con le mani che si riempiono di vesciche.
            Sotto l'erba la terra è nera e grassa, e più in basso la pala trova soltanto pietra liscia,
            tagliata in verticale come il fianco di un pozzo. Quando ci passi sotto con la pala, la pietra si
            solleva da sola di un palmo, e sotto c'è una scala che scende nella collina. Ti siedi un momento
            sul bordo a guardarti le mani, prima di scendere.
          effetti: { ferite: 0.5 }
          vai: soglia-di-mara

  # ------------------------------------------------------------ 0 · la scala e l'acqua di mare
  - id: soglia-di-mara-la-scala-lunga
    immagine: ambientazione/rovine-dei-precursori
    titolo: La scala dai gradini lunghi
    sommario: "La scala scende nel crinale con gradini alti la metà del tuo ginocchio e lunghi il doppio di un passo."
    luogo: La Soglia di Mara, la scala nel crinale
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 0]
    testo: |
      La scala scende dritta nella pietra nera del crinale, con gradini fatti per gambe più lunghe delle tue.
      Ognuno è lungo il doppio di un passo, e il piede non sa mai se farne uno o due. I gradini sono tagliati
      nella roccia viva senza un giunto, e negli angoli l'umido che trasuda dalle pareti lascia croste bianche
      asciugando. Sui bordi la pietra è lucida di umido, e nel mezzo è consumata come sulla soglia. Ti dici
      che chi l'ha scavata voleva una pendenza dolce per portare giù dei pesi, e te lo ripeti per qualche
      gradino.

      {atletica Media} Con due passi corti per gradino il corpo trova il ritmo da solo. Se per tre gradini di
      fila provi a farne uno solo, il ginocchio ti tradisce.

      Dal basso sale un'aria che sa di alga, e la fiamma della lanterna si inclina verso la cima della scala.
    opzioni:
      - testo: "Trovare il passo della scala"
        descrizione: "La scala ha un ritmo, e chi la scendeva lo teneva a memoria. Bisogna prenderlo con le gambe."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Due passi per gradino
          testo: |
            Due passi corti per ogni gradino, e dopo una ventina di gradini le gambe vanno da sole, con il
            tonfo regolare degli stivali che torna su dalle pareti. L'eco arriva un poco in ritardo, e quando
            ti fermi a riprendere fiato continua ancora per due tonfi. In fondo la scala si allarga in un
            pianerottolo.
          pe: { atletica: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il gradino umido
          testo: |
            Sbagli il passo su un bordo lucido e scendi tre gradini sul fondoschiena, con la lanterna alta per
            non romperla. Il bordo è viscido di un umido che sa di sale, e asciugando ti lascia le dita
            bianche. Ti rialzi con un fianco che pulsa, e risali a sederti in cima.
          effetti: { ferite: 0.5 }
      - testo: "Scendere nel mezzo, dove la pietra è consumata"
        descrizione: "Dove sono passati tutti, la pietra è più ruvida e il piede tiene. Basta mettere i piedi dove li mettevano loro."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Le impronte nella pietra
          testo: |
            Nel mezzo dei gradini la pietra è consumata in due conche lunghe, e tu metti gli stivali lì
            dentro, uno per conca. Ogni conca è più lunga del tuo stivale di un buon palmo, e il fondo è più
            ruvido della pietra intorno. Sono troppo lontane fra loro e ti tocca allungare il passo, ma il
            piede tiene, e arrivi in fondo senza scivolare una volta.
          pe: { percezione: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il passo degli altri
          testo: |
            Le conche consumate sono troppo distanti per le tue gambe, e a forza di allungarti ti ritrovi a
            gambe larghe su due gradini con la lanterna che dondola. La luce che oscilla manda la tua ombra su
            e giù per le pareti bagnate. Risali piano con la sensazione di essere ridicol{o|a}, anche se non
            ti guarda nessuno.
          effetti: { tormento: 1 }
      - testo: "Scendere seduti, un gradino alla volta"
        descrizione: "Un gradino, una spinta, un altro gradino. Lento, e i pantaloni ne usciranno peggio di te."
        costo: 2
        esito:
          titolo: "Sedut{o|a}"
          testo: |
            Scendi la scala sedut{o|a}, un gradino alla volta, con la lanterna fra le ginocchia. Ci vuole
            molto, e l'umido della pietra ti passa nei pantaloni e poi nelle ossa. Da così vicino vedi che gli
            spigoli dei gradini non hanno una scheggia dopo tutto quel tempo. In fondo ti alzi tutt{o|a}
            rigid{o|a}, con un dolore alla schiena che ti accompagnerà per un pezzo.
          effetti: { profondita.soglia-di-mara: 1, ferite: 0.5 }

  - id: soglia-di-mara-l-acqua-di-mare
    immagine: ambientazione/marea-grigia
    titolo: L'acqua di mare
    sommario: "Il pianerottolo è allagato fino alla caviglia, e l'acqua è salata. Sul fondo, fra le croste di sale, c'è un granchio morto."
    luogo: La Soglia di Mara, il pianerottolo allagato
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 0]
    testo: |
      A metà della scala c'è un pianerottolo allagato fino alla caviglia. L'acqua è fredda e limpida, e sul
      fondo una crosta bianca scricchiola sotto gli stivali. Ti bagni un dito e lo porti alla lingua, ed è
      salata da bruciare le labbra screpolate. In un angolo c'è un granchio morto a pancia all'aria, con le
      zampe ancora piegate.

      {natura Facile} È un granchio di mare, di quelli che i pescatori vendono a cesti. Il mare più vicino è a
      giorni di cammino, eppure è morto da poco. Gli occhi sono ancora lucidi, e non ha l'odore che prende un
      granchio dopo un giorno all'aria.

      Ti dici che qualcuno l'avrà portato giù per mangiarlo e l'avrà perso, ma nella crosta del fondo non c'è
      un'impronta oltre alle tue. L'acqua esce da una fessura nella parete in fondo, accanto a una porta bassa
      incrostata di sale.
    opzioni:
      - testo: "Seguire l'acqua fino alla fessura"
        descrizione: "L'acqua di mare non nasce in una collina. Dove entra, c'è un passaggio."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La fessura
          testo: |
            Guadi fino alla fessura e ci passi le dita sopra. L'acqua esce a gruppi di tre piccoli sbuffi, e
            ogni sbuffo è più freddo di quello prima. Accanto alla fessura gratti via il sale dal bordo della
            porta bassa. Si stacca a scaglie spesse un dito che sotto le unghie si sbriciolano, e la porta si
            apre su un corridoio asciutto.
          pe: { natura: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il granchio
          testo: |
            Ti chini per guardare il granchio da vicino, e una zampa si muove. Fai un salto all'indietro e
            finisci sedut{o|a} nell'acqua gelata, e la crosta del fondo ti si rompe sotto le mani in schegge
            che tagliano. Quando ti rialzi il granchio è fermo come prima, a pancia all'aria.
          effetti: { tormento: 1 }
      - testo: "Attraversare l'acqua e forzare la porta"
        descrizione: "Acqua gelata alle caviglie e una porta incrostata di sale. Il freddo passa, la porta si vedrà."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il sale che cede
          testo: |
            Attraversi l'acqua a passo deciso, con il gelo che ti sale dalle caviglie alle ginocchia, e dai
            una spallata alla porta bassa. Il sale del bordo si spacca come zucchero cotto, e sotto il sale la
            porta è di metallo grigio e non ha cardini che tu riesca a vedere. Si apre su un corridoio
            asciutto.
          pe: { resistenza: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: I piedi gelati
          testo: |
            Dai tre spallate alla porta con i piedi nell'acqua gelata, e la porta non si muove. A ogni colpo
            ti torna un suono sordo, e dal bordo non si stacca nemmeno una scaglia di sale. Quando ti arrendi
            non senti più le dita dei piedi, e risali la scala a scaldarle con le mani.
          effetti: { ferite: 0.5 }
      - testo: "Svuotare il pianerottolo con l'elmo"
        descrizione: "Un elmo, una scodella, qualsiasi cosa tenga l'acqua. Si butta giù per la scala, e intanto la fessura continua a dare."
        costo: 2
        esito:
          titolo: Il secchio
          testo: |
            Butti l'acqua giù per la scala con la scodella da campo finché il pianerottolo resta bagnato e
            basta. Ogni scodellata scende gorgogliando per i gradini, e intanto dalla fessura l'acqua continua
            a uscire a sbuffi regolari. Hai le maniche fradice e le mani screpolate dal sale. La porta bassa,
            senza l'acqua davanti, si apre con una spinta.
          effetti: { profondita.soglia-di-mara: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · gli armadi e lo sgabello
  - id: soglia-di-mara-gli-armadi
    immagine: ambientazione/rovine-dei-precursori
    titolo: Gli armadi stretti
    sommario: "Lungo un corridoio c'è una fila di armadi di metallo alti e stretti, ognuno con il suo gancio dentro. Uno solo è chiuso."
    luogo: La Soglia di Mara, il corridoio degli armadi
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 1]
    testo: |
      Lungo il corridoio corre una fila di armadi di metallo stretti e alti il doppio di un uomo. Il metallo è
      grigio e asciutto, e nonostante l'umido della scala non ha un segno di ruggine. Negli armadi aperti ci
      sono soltanto un gancio e una mensola per gli stivali, e il gancio sta più in alto di dove arriva la tua
      mano. Ti dici che sono gli armadi di una squadra di sterratori. L'ultimo armadio è chiuso, e sullo
      sportello ha una placca con una mano incisa a palmo aperto, più larga della tua di due dita.

      {origine apprendista-raschiatore} Al Ponte dei Morti le squadre lasciano la roba nelle cassette e la
      riprendono al ritorno. Qui nessuno l'ha ripresa.

      {tecnologia Media} La placca è tiepida e aspetta una mano, forse una qualunque. Sotto le dita ronza
      appena, ed è la sola cosa calda in tutto il corridoio.
    opzioni:
      - testo: "Appoggiare la mano sulla placca"
        descrizione: "Una mano incisa chiede una mano. La tua è più piccola, e forse basta."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Lo sportello
          testo: |
            Appoggi il palmo sulla mano incisa, e la placca si scalda sotto la pelle finché lo sportello
            scatta. Le dita incise arrivano oltre le tue di una falange intera. Dentro, sulla mensola, c'è un
            guscio di metallo chiuso e un paio di stivali lunghi come il tuo braccio, grigi di sale. Prendi il
            guscio e lasci gli stivali al loro padrone.
          pe: { tecnologia: 2 }
          effetti: { profondita.soglia-di-mara: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La scossa
          testo: |
            La placca ti morde il palmo con una scossa che ti sale fino al gomito. Ritiri la mano e per un po'
            le dita ti si aprono e chiudono per conto loro. Sulla pelle ti resta il disegno rosso della mano
            incisa, che sparisce prima che tu arrivi in fondo al corridoio.
          effetti: { ferite: 0.5 }
      - testo: "Frugare negli armadi aperti"
        descrizione: "Vuoti, a prima vista. Negli armadi lasciati in fretta qualcosa resta sempre in fondo alla mensola."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: In fondo alla mensola
          testo: |
            Passi la mano al buio su una mensola dopo l'altra, e sulle prime non c'è nemmeno la polvere che
            lascia una suola. In fondo alla settima trovi una scheggia di metallo lucido, rotonda come una
            moneta e bucata nel mezzo. In fondo al corridoio c'è un passaggio che prosegue, e lo prendi con la
            scheggia in tasca.
          pe: { percezione: 2 }
          effetti: { profondita.soglia-di-mara: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Lo sportello che sbatte
          testo: |
            Uno sportello ti si richiude sulle dita con un colpo che rimbomba per tutto il corridoio. Il
            rimbombo passa da un armadio all'altro lungo tutta la fila e torna indietro più piano. Aspetti con
            la mano stretta sotto l'ascella che il rimbombo finisca, e ti accorgi che stai aspettando anche
            che qualcuno venga a vedere.
          effetti: { ferite: 0.5 }
      - testo: "Passare oltre senza toccare niente"
        descrizione: "Gli armadi sono di qualcuno. Il corridoio va avanti lo stesso."
        costo: 2
        esito:
          titolo: La fila degli armadi
          testo: |
            Passi davanti agli armadi uno dopo l'altro senza toccarli, e ti accorgi di contarli. Sono
            trentasei, e gli sportelli aperti stanno tutti allo stesso angolo, a mezzo palmo dal muro. Dopo
            l'ultimo il corridoio gira, e per un tratto ti sembra di sentire alle spalle il rumore di uno
            sportello che si apre piano.
          effetti: { profondita.soglia-di-mara: 1, tormento: 1 }

  - id: soglia-di-mara-lo-sgabello
    immagine: ambientazione/roccia-di-wren
    titolo: Lo sgabello della vecchia
    sommario: "In una nicchia del corridoio c'è uno sgabello di legno, una pipa di coccio e uno scialle piegato."
    luogo: La Soglia di Mara, la nicchia dello sgabello
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 1]
    testo: |
      In una nicchia del corridoio c'è uno sgabello da mungitura rivolto verso il basso. Ha tre gambe di legno
      e il sedile lucido, consumato al centro da lunghe ore di peso. Accanto ci sono una pipa di coccio con il
      fornello annerito e uno scialle piegato in quattro. Sono cose della gente di sopra, lasciate qui da
      molto, e la lana dello scialle si è indurita di umido e ha macchie bianche di sale. Sulla parete
      all'altezza di chi siede ci sono file di tacche graffiate a gruppi di sette. Le prime in alto sono quasi
      lisce, e le ultime più in basso hanno ancora i bordi netti.

      {empatia Media} Chi si sedeva qui veniva spesso e restava a lungo, con lo scialle per il freddo. Lo
      scialle è piegato con cura, da qualcuno che pensava di tornare.
    opzioni:
      - testo: "Sedersi sullo sgabello e guardare dove guardava lei"
        descrizione: "Lo sgabello guarda in una direzione precisa. Chi lo ha messo lì voleva vedere qualcosa."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La vista dallo sgabello
          testo: |
            Ti siedi sullo sgabello, che scricchiola sotto il tuo peso ma regge, e guardi giù per il
            corridoio. Lo sgabello è basso, e da qui sotto la luce si vede soltanto piegando un poco la testa.
            In fondo c'è una lama di luce arancione che scende da una fessura del soffitto e si posa sul
            pavimento, la luce del tramonto di sopra. Chi sedeva qui contava i tramonti. Lasci lo scialle
            piegato com'era e scendi verso la luce.
          pe: { empatia: 2 }
          effetti: { profondita.soglia-di-mara: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Lo sgabello che cede
          testo: |
            Ti siedi, e una gamba dello sgabello si spezza sotto di te. Il legno è marcio dentro e si
            sbriciola fra le dita come pane secco. Finisci per terra con lo scialle in testa e un odore di
            tabacco vecchio nel naso, e ci metti un po' a rimettere tutto com'era.
          effetti: { tormento: 1 }
      - testo: "Guardare nel fornello della pipa"
        descrizione: "Una pipa lasciata a metà ha ancora dentro quello che si fumava. A volte anche altro."
        prova: { attributo: mentale, abilita: [percezione, medicina], difficolta: Media }
        successo:
          titolo: La conchiglia
          testo: |
            Nel fornello, sotto la cenere secca, c'è una conchiglia piccola e bianca, avvolta in un pezzo di
            carta da tabacco. È sottile come un'unghia, e dentro ha ancora un poco di sabbia umida. Sulla
            Superficie non c'è mare per giorni di cammino. La rimetti nella pipa, e con la pipa lasci lì anche
            la voglia di sapere chi l'aveva raccolta.
          pe: { percezione: 2 }
          effetti: { profondita.soglia-di-mara: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La cenere
          testo: |
            Soffi nel fornello per pulirlo e ti arriva in faccia una nuvola di cenere vecchia, con un sapore
            di tabacco bruciato e di alga. Tossisci a lungo piegat{o|a} in due, e la pipa ti scivola di mano e
            si scheggia sul pavimento.
          effetti: { tormento: 1 }
      - testo: "Lasciare le sue cose e proseguire"
        descrizione: "Sono le cose di qualcuno che non tornerà a prenderle. Il corridoio scende ancora."
        costo: 2
        esito:
          titolo: Le tacche
          testo: |
            Passi davanti alla nicchia senza toccare niente, e per scrupolo conti le tacche sulla parete. Sono
            così tante che a metà perdi il conto e ricominci. Le ultime file sono graffiate più leggere e più
            storte delle prime. Quando ti decidi a proseguire hai la testa piena di gruppi di sette.
          effetti: { profondita.soglia-di-mara: 1, tormento: 1 }

  # ------------------------------------------------------------ 1–3 · i tre battiti nel corridoio
  - id: soglia-di-mara-i-tre-battiti
    immagine: ambientazione/marea-grigia
    titolo: I tre battiti
    sommario: "Nel corridoio, a intervalli, il buio cambia odore. Per tre battiti c'è il vento bagnato e il mare, e poi la collina torna asciutta."
    luogo: La Soglia di Mara, il corridoio lungo
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara >= 1, profondita.soglia-di-mara <= 3]
    testo: |
      Il corridoio scende piano e a lungo, e a metà arriva il primo soffio. Per tre battiti sei in un vento
      bagnato che sa di pioggia salata e di mare vicino, e senti sulla faccia l'acqua che cade dall'alto. Poi
      torni nel corridoio asciutto con i capelli gocciolanti. Ti dici che è uno sfiato, una corrente che sale
      da qualche grotta, e te lo ripeti mentre ti asciughi la faccia con la manica. Le pareti intorno sono
      asciutte, e le gocce che ti cadono dai capelli fanno sulla pietra le sole macchie scure. Il secondo
      soffio arriva dopo un poco ed è più lungo del primo.

      {resilienza Media} Il corridoio resta lo stesso mentre il resto si sposta, e a te basta camminare dritto
      contando i passi a voce bassa.
    opzioni:
      - testo: "Continuare a camminare durante i soffi"
        descrizione: "Tre battiti si reggono. Il corridoio sotto i piedi resta, anche quando la testa dice di no."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Dritto
          testo: |
            Al soffio successivo tieni gli occhi sulla lanterna e cammini, un passo per battito, e quando il
            corridoio torna sei tre passi più avanti. Durante il soffio la fiamma si piega tutta da una parte,
            e nel corridoio torna dritta. Lo rifai a ogni soffio. In fondo al corridoio arrivi con la giubba
            fradicia e la testa sgombra.
          pe: { resilienza: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il mare in testa
          testo: |
            Al quarto soffio ti fermi, e quando il corridoio torna non sai più da che parte stavi andando.
            Alla luce della lanterna le due direzioni sono identiche, con la stessa pietra nera e lo stesso
            buio in fondo. Il rumore del mare ti resta nelle orecchie, e cammini nella direzione sbagliata
            finché non ritrovi le tue impronte bagnate.
          effetti: { tormento: 1 }
      - testo: "Correre fra un soffio e l'altro"
        descrizione: "I soffi arrivano a intervalli. Nel mezzo il corridoio è asciutto, e si può correre."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Fra i soffi
          testo: |
            Aspetti la fine di un soffio e corri, e quando arriva il successivo ti fermi contro la parete con
            la testa bassa. Sotto la guancia la pietra cambia, da asciutta a bagnata e poi di nuovo asciutta.
            Riparti appena il soffio finisce. Al quinto scatto il corridoio finisce, e ti appoggi a uno
            stipite con le mani sulle ginocchia.
          pe: { atletica: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il soffio a metà corsa
          testo: |
            Un soffio ti prende a metà corsa, e per tre battiti corri su una pietra bagnata che non è quella
            del corridoio. È coperta di alghe che scivolano sotto le suole, e il mare è così vicino che lo
            senti battere sotto i piedi. Quando torni inciampi nel pavimento vero, che è più in basso di un
            dito, e cadi lung{o|a}.
          effetti: { ferite: 0.5 }
      - testo: "Sedersi e lasciar passare i soffi"
        descrizione: "Seduti contro la parete, con la lanterna fra le ginocchia, i soffi passano sopra. Si perde tempo."
        costo: 2
        esito:
          titolo: Contro la parete
          testo: |
            Ti siedi contro la parete e lasci passare i soffi uno dopo l'altro, con gli occhi chiusi e la
            lanterna fra le ginocchia. Ne conti undici, e ognuno ti lascia sulla faccia un velo d'acqua più
            fredda del precedente. Quando ti rialzi hai la giubba incrostata di sale e un rumore di risacca
            che ti resta nella testa per il resto della discesa.
          effetti: { profondita.soglia-di-mara: 1, tormento: 1 }

  # ------------------------------------------------------------ 2 · i granchi del sale e le pompe
  - id: soglia-di-mara-i-granchi-del-sale
    immagine: bestiario/salvaguardia-precursori
    titolo: I granchi del sale
    sommario: "In una sala bassa due gusci di metallo incrostati di sale raschiano il pavimento con le pinze. Quando ti sentono, smettono."
    luogo: La Soglia di Mara, la sala bassa
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 2]
    testo: |
      La sala è bassa e larga, con il pavimento coperto di sale, e il soffitto bianco di sale lo tocchi
      alzando il braccio. Due gusci di metallo a sei zampe raschiano il sale con le pinze e lo ammucchiano in
      cumuli contro le pareti. Sono grandi come uno scudo e fatti di un metallo grigio senza ruggine, e le
      giunture delle zampe sono lucide d'uso. Ti dici che sono macchine da pulizia, lasciate a lavorare da chi
      se n'è andato. Quando la tua lanterna entra nella sala si fermano con le pinze alzate, e nel silenzio
      senti il sale che scivola ancora giù dai cumuli.

      {rissa Media} Sono bassi, e un calcio da sotto li rovescia. Le zampe si piegano soltanto in avanti, e un
      guscio rovesciato non si raddrizza in fretta.

      Lungo la parete di destra i cumuli fanno una specie di corridoio alto fino al petto.
    opzioni:
      - testo: "Affrontare i granchi"
        descrizione: "Due gusci bassi e due pinze ciascuno. Da sotto si rovesciano."
        combattimento: soglia-di-mara-granchi-del-sale
        vittoria:
          titolo: A pancia all'aria
          testo: |
            Il secondo granchio resta a pancia all'aria in mezzo al sale, con le zampe che si muovono sempre
            più piano. Sotto il guscio ci sono ingranaggi minuti che restano tiepidi ancora per poco. Gli
            stacchi le pinze e il pezzo di macchina che porta sulla schiena, e attraversi la sala fra i cumuli
            bianchi.
          effetti: { profondita.soglia-di-mara: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: Le pinze
          testo: |
            Le pinze ti trovano le caviglie, e una ti stringe il polpaccio finché non lasci la lanterna. La
            morsa non stringe più del necessario, e si apre appena la lanterna tocca terra. Torni indietro
            zoppicando, e i granchi riprendono a raschiare il sale come se non fossi mai entrat{o|a}.
      - testo: "Passare dietro i cumuli di sale"
        descrizione: "I cumuli lungo la parete sono alti fino al petto. Chi si tiene basso dietro il sale non si vede."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Dietro il sale
          testo: |
            Passi chinat{o|a} dietro i cumuli, con la lanterna coperta dalla mano, e i granchi riprendono a
            raschiare dopo un poco. Il sale dei cumuli è pressato e squadrato in cima a spigoli vivi. Senti le
            pinze grattare dall'altra parte del sale per tutto il tragitto. In fondo alla sala c'è una porta,
            e la passi senza fare rumore.
          pe: { furtivita: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il cumulo che frana
          testo: |
            Sfiori un cumulo con la spalla, e il sale ti frana addosso con un fruscio lungo. Dall'altra parte
            il raschio smette di colpo. I granchi ti sono sopra in un momento, e scappi dalla porta da cui sei
            entrat{o|a} con un taglio sul polso.
          effetti: { ferite: 0.5 }
      - testo: "Gettare il sale in mezzo alla sala e passare"
        descrizione: "Raschiano il sale e lo ammucchiano. Se ne trovano dell'altro in mezzo alla sala, forse hanno da fare."
        costo: 2
        esito:
          titolo: Il lavoro dei granchi
          testo: |
            Prendi il sale da un cumulo a manciate e lo spargi in mezzo alla sala. I granchi si buttano sul
            sale nuovo e si mettono a raschiarlo, e tu passi lungo la parete. Di passaggio uno ti pizzica la
            caviglia per scrupolo e torna al lavoro. Quando arrivi alla porta il cumulo che hai intaccato è
            già tornato com'era.
          effetti: { profondita.soglia-di-mara: 1, ferite: 0.5 }

  - id: soglia-di-mara-le-pompe
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le pompe
    sommario: "In una sala allagata quattro pistoni di metallo battono lenti e rimandano l'acqua salata su per un condotto. Uno è fermo, e l'acqua sale."
    luogo: La Soglia di Mara, la sala delle pompe
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 2]
    testo: |
      Nella sala delle pompe quattro pistoni grandi come tronchi d'albero si alzano e si abbassano lenti, e a
      ogni colpo rimandano l'acqua salata su per un condotto nel soffitto. Sopra l'acqua il loro metallo è
      liscio e asciutto senza una goccia d'olio, e il colpo di ogni discesa ti arriva nel petto attraverso
      l'acqua. Uno dei quattro è fermo a metà corsa. Dove dovrebbe pompare, l'acqua è salita fino alla vita, e
      la porta dall'altra parte della sala è mezza sommersa. Ti dici che servono a tenere asciutta la collina,
      e che il mare ci arriva da qualche falda. Sulla superficie galleggia una pellicola di sale, e a ogni
      colpo si increspa in cerchi che arrivano fino a te.

      {tecnologia Media} Il pistone fermo ha la leva di sblocco sul fianco, sott'acqua. Qualcuno l'ha fermato,
      oppure il sale l'ha incastrato. Intorno alla guarnizione c'è una crosta bianca spessa un dito, e sulla
      crosta non c'è il segno di un attrezzo.
    opzioni:
      - testo: "Sbloccare il pistone fermo"
        descrizione: "La leva è sott'acqua, sul fianco del pistone. Bisogna trovarla al tatto, e sapere da che parte tirarla."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il quarto pistone
          testo: |
            Trovi la leva al tatto, con la faccia a un dito dall'acqua. Ha l'impugnatura troppo larga per una
            mano sola, e la tiri verso di te con tutte e due. Il pistone riparte con un colpo che ti scuote le
            ossa, e in poco l'acqua cala fino alle ginocchia. Attraversi la sala fino alla porta, e dalla
            soglia senti i quattro pistoni battere di nuovo allo stesso tempo.
          pe: { tecnologia: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: La leva sbagliata
          testo: |
            Tiri la leva dalla parte sbagliata, e un altro pistone si ferma. Con due pistoni fermi il colpo
            cambia tempo, e l'acqua ti spinge contro le gambe a ondate lente. Sale di un palmo mentre torni
            indietro, e arrivi alla scala fradici{o|a} fino al collo e con i denti che battono.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare a nuoto fino alla porta"
        descrizione: "L'acqua arriva alla vita, e alla porta di più. Si passa sotto con l'aria nei polmoni, e il freddo non aiuta."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: Sotto la porta
          testo: |
            Guadi fino alla porta e ti immergi, con gli occhi aperti nel sale che brucia, e passi sotto
            l'architrave a bracciate. Sott'acqua il colpo dei pistoni è molto più forte, e ti batte nel petto
            a ogni bracciata. Dall'altra parte riemergi in un corridoio dove l'acqua arriva alle caviglie, e
            resti a lungo appoggiat{o|a} al muro a sputare acqua salata.
          pe: { atletica: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: L'architrave
          testo: |
            Sott'acqua sbagli la misura e batti la testa contro l'architrave. Con la testa che ti rimbomba
            vedi un chiarore anche dall'altra parte della porta, dove non c'è nessuna lanterna. Riemergi dalla
            parte da cui eri partit{o|a}, con un bernoccolo che cresce e la bocca piena di sale, e torni alla
            scala a tossire.
          effetti: { ferite: 1 }
      - testo: "Aspettare che le pompe abbassino l'acqua"
        descrizione: "Tre pistoni su quattro lavorano ancora. Prima o poi l'acqua scende, e intanto si aspetta al freddo."
        costo: 2
        esito:
          titolo: L'attesa nell'acqua
          testo: |
            Aspetti sulla scala con l'acqua alle caviglie, e i tre pistoni che lavorano abbassano l'acqua di
            un dito alla volta. Sulla parete l'acqua che cala lascia una riga bianca di sale dopo l'altra. Ci
            vuole tanto che a un certo punto ti accorgi di battere il tempo con il piede. Quando la porta è
            libera hai le gambe intirizzite fino all'anca.
          effetti: { profondita.soglia-di-mara: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · il cerchio delle nove tacche e il fumo
  - id: soglia-di-mara-il-cerchio-dei-nove
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il cerchio sotto la fessura
    sommario: "Sotto una fessura del soffitto, sul pavimento, è inciso un cerchio di nove incavi."
    luogo: La Soglia di Mara, la sala del cerchio
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 3]
    testo: |
      In una sala tonda una lama di luce scende da una fessura del soffitto e si posa su un cerchio inciso nel
      pavimento, largo quanto un tavolo da osteria e con nove incavi lungo il bordo. Il solco del cerchio è
      profondo un dito e ha il fondo lucido, senza la crosta di sale che copre il resto della pietra. Otto
      incavi sono lisci. Il nono è più profondo e porta il segno di una porta, un arco su due pilastri, che
      manda una luce arancione che non viene dalla fessura. Ti dici che è il tramonto riflesso da qualche vena
      di quarzo, e lo ripeti anche quando la lama di luce si sposta e l'incavo resta acceso uguale. Dal centro
      del cerchio parte un condotto di metallo che entra sotto la parete di nord-est. Il suo metallo è
      asciutto in mezzo a pietre che trasudano.

      {accademiche Difficile} Se gli altri otto incavi sono altri posti, questo cerchio è una mappa senza
      nomi.
    opzioni:
      - testo: "Ricopiare il cerchio sul quaderno"
        descrizione: "Nove incavi con una porta in quello profondo, e un condotto che va verso nord-est. Alla Biblioteca qualcuno saprà leggerli."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: Il disegno
          testo: |
            Ricopi il cerchio incavo per incavo, disegni la porta dentro quello profondo e segni il condotto
            con una freccia. La matita scorre male sulla carta, che l'umido della sala ha reso molle. Mentre
            finisci, la lama di luce arriva sull'incavo della porta, e da sotto il pavimento ti arriva per tre
            battiti il rumore lontano del mare.
          pe: { accademiche: 2 }
          effetti: { profondita.soglia-di-mara: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: La luce sulla mano
          testo: |
            Mentre disegni, la lama di luce ti passa sulla mano, e per tre battiti la mano non è più nella
            sala. La ritiri bagnata e gelata fino al polso, con un velo di sale sulla pelle e sotto le unghie
            granelli di una sabbia scura che nella sala non c'è. Per un'ora non riesci a tenere la matita.
          effetti: { tormento: 1 }
      - testo: "Seguire il condotto fino alla parete"
        descrizione: "Il condotto va sotto la parete di nord-est. Dove va lui va qualcosa, e forse anche la strada."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La nota nel condotto
          testo: |
            Segui il condotto fino alla parete, dove entra in una fessura e vibra piano, con una nota bassa
            che senti nei denti. Appoggi il palmo sul metallo, e la nota ti sale nel braccio fino alla spalla
            con un tempo lungo e regolare. Accanto alla fessura un passaggio stretto prosegue verso il basso,
            e l'aria che ne esce sa di fumo.
          pe: { percezione: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il freddo della fessura
          testo: |
            Infili le dita nella fessura sotto la parete, e il filo d'aria che ne esce è così freddo che te le
            lascia bianche e insensibili. Intorno alle dita l'aria fischia appena, una nota sola che smette
            quando le ritiri. Torni indietro a scaldartele sotto le ascelle.
          effetti: { ferite: 0.5 }
      - testo: "Cercare l'incavo che riconosci"
        descrizione: "Questo cerchio l'hai già visto sotto il Sornione. Laggiù l'incavo profondo aveva un occhio."
        quando: [misura.sornione >= 1]
        esito:
          titolo: Due segni
          testo: |
            Trovi sul cerchio l'incavo dove sotto il Sornione c'era l'occhio. Qui è liscio e poco profondo, e
            sotto le dita resta freddo. L'incavo della porta invece è tiepido, e quando ci passi sopra la mano
            la luce arancione ti colora le nocche. Ricopi tutto sul quaderno, i due segni uno accanto
            all'altro, e prosegui.
          effetti: { profondita.soglia-di-mara: 1, informazioni.segreto: 1 }
      - testo: "Aspettare che la luce passi e proseguire"
        descrizione: "La luce scivola sul pavimento. Quando è passata la sala è soltanto una sala."
        costo: 2
        esito:
          titolo: Il tramonto di sotto
          testo: |
            Aspetti contro la parete che la lama di luce passi sull'incavo della porta e vada oltre. Quando ci
            passa sopra ti arriva addosso un soffio di pioggia salata da nessuna parte, e ti lascia
            fradici{o|a}. Nel soffio c'è anche l'odore di un fuoco di legna acceso molto vicino. Poi la sala
            si spegne, e prosegui con la giubba che gocciola.
          effetti: { profondita.soglia-di-mara: 1, ferite: 0.5 }

  - id: soglia-di-mara-il-fumo
    immagine: ambientazione/roccia-di-wren
    titolo: Il fumo di legna
    sommario: "Più giù l'aria sa di un fuoco di legna acceso da qualche parte. Il fumo esce da una grata nel muro, a sbuffi di tre."
    luogo: La Soglia di Mara, il passaggio del fumo
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 3]
    testo: |
      Il passaggio si stringe e l'aria comincia a sapere di fuoco di legna. Il fumo esce caldo e grigio a
      sbuffi di tre da una grata nel muro, e ogni sbuffo ti lascia sulle labbra un pizzico di salsedine. La
      grata ha maglie quadre larghe due dita, e le sbarre restano fredde anche mentre il fumo ci passa in
      mezzo caldo. Ti dici che il fuoco sarà più in fondo, in qualche camera che la lanterna non raggiunge.
      Oltre la grata c'è solo buio senza nessun fuoco, e nemmeno il rosso di una brace. Il passaggio prosegue
      nel fumo, che si fa più fitto.

      {natura Media} È legno di mare sbiancato e salato dalle onde, e fuma più del legno di bosco. Lo
      riconosci dal fumo, che ha un fondo amaro di alga.
    opzioni:
      - testo: "Attraversare il fumo con un panno sulla bocca"
        descrizione: "Un panno bagnato sulla bocca e gli occhi socchiusi. Il fumo è fitto, e il passaggio è lungo."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Difficile }
        successo:
          titolo: Nel fumo
          testo: |
            Bagni il fazzoletto nell'acqua della borraccia e te lo leghi sulla bocca, e cammini nel fumo con
            una mano sulla parete. La pietra sotto la mano è tiepida e umida, e a ogni sbuffo si scalda ancora
            un poco. Gli occhi ti bruciano a ogni sbuffo, e tu continui a contare i passi. Quando il fumo si
            dirada sei davanti a una porta alta, e dietro la porta c'è una sala grande.
          pe: { resistenza: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: La tosse
          testo: |
            A metà passaggio la tosse ti piega in due, e torni indietro a tentoni con gli occhi chiusi e la
            mano sulla parete. Fuori dal fumo sputi grigio per un pezzo, e nella saliva ci sono granelli di
            sale che ti graffiano la gola.
          effetti: { ferite: 0.5 }
      - testo: "Seguire gli sbuffi e passare negli intervalli"
        descrizione: "Il fumo arriva a sbuffi di tre. Fra un gruppo e l'altro l'aria si schiarisce, e si va avanti di corsa."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Gli intervalli
          testo: |
            Conti gli sbuffi alla grata finché ne prendi il tempo. Ogni tre sbuffi c'è una pausa lunga quanto
            venti battiti del tuo cuore, e non cambia mai. Nella pausa corri, e nel fumo ti fermi con la
            faccia contro il muro. In quattro pause arrivi davanti a una porta alta, e dietro la porta c'è una
            sala grande.
          pe: { percezione: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il conto del fumo
          testo: |
            Sbagli il conto, e lo sbuffo ti prende in faccia a metà corsa. È più caldo di quanto ti aspettavi,
            e ti lascia la pelle del viso tesa come dopo una giornata al sole. Torni indietro con gli occhi
            pieni di lacrime e il sapore della salsedine in gola, e aspetti che passi.
          effetti: { tormento: 1 }
      - testo: "Aspettare che il fumo si diradi"
        descrizione: "Prima o poi anche questo fuoco si abbassa. Si aspetta, e il fumo intanto si attacca ai vestiti."
        costo: 2
        esito:
          titolo: L'odore addosso
          testo: |
            Aspetti sedut{o|a} fuori dal fumo finché gli sbuffi si fanno radi e leggeri, e passi. Gli sbuffi
            non smettono mai del tutto, e anche quando sono soltanto un filo arrivano a gruppi di tre.
            Dall'altra parte c'è una porta alta. I vestiti ti puzzano di legna di mare, e l'odore resterà per
            giorni anche lavandoli.
          effetti: { profondita.soglia-di-mara: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · la soglia di sotto
  - id: soglia-di-mara-la-soglia-di-sotto
    immagine: bestiario/salvaguardia-precursori
    titolo: La soglia di sotto
    sommario: "In fondo al crinale c'è un secondo arco di pietra nera, uguale a quello di sopra. Accanto all'arco, appoggiato a un bastone, aspetta il portinaio."
    luogo: La Soglia di Mara, la sala dell'arco
    area: soglia-di-mara
    requisiti: [profondita.soglia-di-mara >= 4, misura.mara == 0]
    testo: |
      La sala è alta come una navata, e in mezzo c'è un arco di pietra nera uguale a quello del crinale. Ha le
      stesse misure e lo stesso filo a piombo, e i due pilastri salgono dalla base alla volta senza una
      giuntura. Da una fessura del soffitto scende la luce arancione del tramonto, che scivola sul pavimento
      verso la soglia. Fin quaggiù il tramonto non dovrebbe arrivare, e ti dici che la fessura sale dritta
      fino al crinale per una via che da qui non si vede.

      Accanto al pilastro di sinistra c'è il portinaio. È alto il doppio di te e sottile come un palo sotto la
      cerata grigia, e si appoggia a un bastone lungo quanto lui. Sul pilastro, all'altezza della sua spalla,
      la pietra ha una chiazza larga quanto un palmo più liscia e più scura del resto. Quando la luce tocca la
      soglia il portinaio ci appoggia il palmo sinistro e abbassa la testa. Per tre battiti l'arco si riempie
      di pioggia salata e poi torna pietra, e sul pavimento davanti alla soglia restano gocce che sanno di
      mare. Il portinaio alza la testa e si gira verso di te.

      {origine accolito-del-velo} Al Velo il verbale del mercante che passò sotto l'arco è finito fra le
      deposizioni senza seguito.

      {percezione Media} Quando abbassa la testa chiude le fessure della maschera tutte e due nello stesso
      momento, e passa la soglia a occhi chiusi.
    opzioni:
      - testo: "Affrontare il portinaio"
        descrizione: "È alto il doppio di te, e il bastone arriva lontano. Sotto la cerata, però, è sottile come un palo."
        combattimento: soglia-di-mara-il-portinaio
        vittoria:
          titolo: La porta di Mara
          testo: |
            Il portinaio si piega sul bastone e scivola giù lungo il pilastro, e la cerata grigia gli si
            affloscia addosso. Quando la luce torna sulla soglia appoggi il palmo sinistro sul pilastro di
            sinistra all'altezza della spalla, dove la pietra è più liscia e resta fredda sotto la mano. Poi
            passi sotto l'arco a occhi chiusi, contando i battiti.

            Al primo battito c'è la pioggia salata che cade fredda da una fessura in alto. Al secondo senti il
            mare vicinissimo che batte a colpi lunghi, e sotto le mani c'è una parete di pietra nera bagnata.
            Al terzo apri gli occhi di un filo e vedi un braciere di ferro con dentro un fuoco di legna di
            mare. È acceso senza nessuno intorno, e il fumo sa di sale. Nel pavimento bagnato corre un fascio
            di condotti che arrivano da sud-ovest. Poi sei sotto l'arco di sotto con la cerata in mano. Sei
            fradici{o|a}, e l'acqua che ti cola dai capelli è salata.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.mara: 1, oggetto.soglia-di-mara-cerata-del-portinaio: 1, parte.involucro-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Il bastone
          testo: |
            Il bastone del portinaio arriva da lontano, e arriva sempre. Al terzo colpo sei per terra davanti
            alla soglia, e lui ti spinge fuori dalla sala con la punta, piano, come si spazza la soglia di
            casa. In tutto lo scontro non ha cambiato passo, e l'unico rumore che ha fatto è quello del
            bastone sulla pietra. Risali il crinale con le costole che ti fanno male a ogni gradino lungo.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Rifare il suo gesto accanto a lui"
        descrizione: "Il palmo sul pilastro, la testa bassa, gli occhi chiusi. Chi lo fa come lui forse passa come lui, e bisogna farlo uguale."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Difficile }
        successo:
          titolo: "Un{o|a} del turno"
          testo: |
            Aspetti il tramonto accanto al portinaio, e quando la luce tocca la soglia appoggi come lui il
            palmo sinistro sul pilastro all'altezza della spalla e chiudi gli occhi. Accanto a te la sua
            cerata fruscia una volta quando abbassa la testa insieme a te. Lui non si muove, e tu passi sotto
            l'arco contando i battiti.

            Al primo battito c'è la pioggia salata che cade fredda da una fessura in alto. Al secondo senti il
            mare vicinissimo che batte a colpi lunghi, e sotto le mani c'è una parete di pietra nera bagnata.
            Al terzo apri gli occhi di un filo e vedi un braciere di ferro con dentro un fuoco di legna di
            mare. È acceso senza nessuno intorno, e il fumo sa di sale. Nel pavimento bagnato corre un fascio
            di condotti che arrivano da sud-ovest. Poi sei sotto l'arco di sotto, fradici{o|a}. Il portinaio
            ti porge una cerata grigia presa da un gancio sulla parete, come si fa con uno del turno che
            torna.
          pe: { percezione: 5 }
          effetti: { misura.mara: 1, oggetto.soglia-di-mara-cerata-del-portinaio: 1, parte.involucro-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il gesto sbagliato
          testo: |
            Appoggi la mano sul pilastro troppo in basso, e il portinaio se ne accorge prima di te. Sotto le
            dita la pietra è ruvida, e la chiazza liscia è un palmo più su. Il bastone ti prende sotto le
            costole e ti butta contro la parete, e lui resta lì a guardarti finché non esci dalla sala
            strisciando. Risali il crinale senza la porta.
          effetti: { ferite: 2, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ordinare al portinaio di farsi da parte"
        descrizione: "La formula del Comando parla alle macchine dei Precursori. Un portinaio obbedisce a chi ha il diritto di dargli ordini."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Da parte
          testo: |
            Dici la formula, e il portinaio si fa da parte di un passo e china la testa. Resta così con il
            bastone stretto al petto, e non si muove nemmeno quando gli passi accanto. Appoggi il palmo
            sinistro sul pilastro all'altezza della spalla e passi a occhi chiusi.

            Al primo battito c'è la pioggia salata che cade fredda da una fessura in alto. Al secondo senti il
            mare vicinissimo che batte a colpi lunghi, e sotto le mani c'è una parete di pietra nera bagnata.
            Al terzo apri gli occhi di un filo e vedi un braciere di ferro con dentro un fuoco di legna di
            mare. È acceso senza nessuno intorno, e il fumo sa di sale. Nel pavimento bagnato corre un fascio
            di condotti che arrivano da sud-ovest. Poi sei sotto l'arco di sotto, e il portinaio ti porge una
            cerata grigia presa da un gancio.
          pe: { magia: 5 }
          effetti: { misura.mara: 1, oggetto.soglia-di-mara-cerata-del-portinaio: 1, parte.involucro-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'ordine a metà
          testo: |
            La formula ti si spezza a metà, e il portinaio sente soltanto l'inizio di un ordine. Le fessure
            della maschera si chiudono e si riaprono una volta. Poi alza il bastone e ti spinge fuori dalla
            sala a colpi secchi sulle spalle, senza fretta. Risali il crinale con la testa che ti pulsa e le
            spalle livide.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Presentarti al portinaio come uno del turno"
        descrizione: "Un portinaio fa passare chi ha il diritto di passare. Bisogna presentarsi come uno che quel diritto ce l'ha, senza esitare."
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Difficile }
        successo:
          titolo: Il cambio del turno
          testo: |
            Ti fermi davanti al portinaio a due passi giusti, con la schiena dritta, e gli fai un cenno breve
            con la testa, da collega. Lui ti guarda per il tempo di un respiro e abbassa la testa della stessa
            misura. Quando la luce tocca la soglia ti mostra il gesto, e tu lo rifai uguale, con il palmo
            sinistro sul pilastro e gli occhi chiusi.

            Al primo battito c'è la pioggia salata che cade fredda da una fessura in alto. Al secondo senti il
            mare vicinissimo che batte a colpi lunghi, e sotto le mani c'è una parete di pietra nera bagnata.
            Al terzo apri gli occhi di un filo e vedi un braciere di ferro con dentro un fuoco di legna di
            mare. È acceso senza nessuno intorno, e il fumo sa di sale. Nel pavimento bagnato corre un fascio
            di condotti che arrivano da sud-ovest. Poi sei sotto l'arco di sotto, e il portinaio ti porge una
            cerata grigia presa da un gancio.
          pe: { galateo: 5 }
          effetti: { misura.mara: 1, oggetto.soglia-di-mara-cerata-del-portinaio: 1, parte.involucro-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'estraneo
          testo: |
            Al secondo passo ti tremano le mani, e il portinaio lo vede. Ti mette la punta del bastone sul
            petto e ti spinge indietro senza fretta e senza fermarsi, fino alla porta della sala e oltre. La
            punta preme sempre con la stessa forza, e quando ci metti contro le mani non cede di un dito.
            Risali il crinale con un livido tondo sullo sterno e la sensazione di essere stat{o|a}
            cacciat{o|a} da casa d'altri.
          effetti: { ferite: 1, scandalo: 1 }
          vai: superficie-fratturata
      - testo: "Tornare su senza passare"
        descrizione: "L'arco resta dov'è, e il portinaio pure. La scala riporta al crinale."
        costo: 0
        esito:
          titolo: Il crinale di sera
          testo: |
            Guardi la luce scivolare sulla soglia un'ultima volta e torni indietro per il corridoio dei soffi
            e la sala del sale. Sulla scala lunga l'odore di mare cala a ogni gradino, e in cima l'aria è
            asciutta. Quando esci sul crinale è sera, e gli stracci sul pilastro di sinistra si muovono in un
            vento che viene dal fiume.
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo · tre battiti di là
  - id: soglia-di-mara-tre-battiti-di-la
    immagine: bestiario/salvaguardia-precursori
    titolo: Tre battiti di là
    sommario: "La porta la conosci, e di là ci sono tre battiti per prendere qualcosa."
    luogo: La Soglia di Mara, la sala dell'arco
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara >= 4, misura.mara >= 1]
    testo: |
      Il portinaio è di nuovo accanto al pilastro di sinistra, con una cerata grigia nuova e il bastone
      appoggiato alla spalla. La cerata ha ancora le pieghe dritte di quando stava ripiegata, e nelle pieghe
      non c'è sale. Quando entri gira la testa e ti guarda le mani, e continua a guardarle mentre attraversi
      la sala. La luce del tramonto scivola sul pavimento verso la soglia, e sul gancio accanto all'arco pende
      un'altra cerata ripiegata con cura.

      {percezione Media} Nei tre battiti di là la mano arriva soltanto a un passo di distanza, e accanto al
      braciere c'erano cose posate per terra. Erano tutte asciutte sotto la pioggia salata.
    opzioni:
      - testo: "Passare e afferrare quello che c'è"
        descrizione: "Il gesto lo conosci. Di là hai tre battiti, e devi tenere gli occhi chiusi per i primi due."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Quello che hai preso
          testo: |
            Fai il gesto e passi a occhi chiusi, e al terzo battito allunghi la mano verso il braciere. Il
            fuoco ti scalda il polso mentre afferri quello che trovi. Torni sotto l'arco di sotto
            fradici{o|a}, con un guscio di metallo incrostato di sale in una mano e nell'altra un pezzo di
            cassa grigia. Il guscio stava accanto al fuoco ed è freddo. Il portinaio ti guarda e non dice
            niente.
          pe: { acrobazia: 2 }
          effetti: { reperto.sigillato: 1, parte.involucro-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La mano vuota
          testo: |
            Apri gli occhi un battito troppo presto, e il mare ti entra in bocca. Sott'acqua la luce del
            braciere arriva verde e tremolante, e il sale ti brucia gli occhi. Torni sotto l'arco tossendo e a
            mani vuote, con le dita scottate dal ferro del braciere.
          effetti: { ferite: 1 }
          vai: superficie-fratturata
      - testo: "Abbattere di nuovo il portinaio"
        descrizione: "Sotto la cerata nuova c'è lo stesso corpo sottile. Dentro, qualcosa si può smontare."
        combattimento: soglia-di-mara-il-portinaio
        vittoria:
          titolo: La cerata nuova
          testo: |
            Il portinaio scivola giù lungo il pilastro come l'altra volta. Sotto la cerata nuova il petto si
            apre lungo una giuntura sottile, e gli sfili un pezzo di macchina che si stacca intero. In mano
            resta tiepido, e sul metallo non c'è una vite. Lasci il portinaio sdraiato sotto l'arco, nella
            luce che passa.
          effetti: { parte.involucro-2: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Spazzato via
          testo: |
            Il bastone ti spinge fuori dalla sala come la prima volta, senza
            fretta. Risali il crinale con le costole doloranti.
          effetti: { tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Passare per tre battiti e tornare"
        descrizione: "Il gesto lo conosci, e il mare di là vale la fatica di guardarlo."
        costo: 0
        esito:
          titolo: Il mare
          testo: |
            Fai il gesto e passi, e per tre battiti stai sotto la pioggia salata, con il mare che batte
            vicino. Fra un colpo e l'altro senti la risacca che tira i sassi. Poi torni, e risali il crinale
            con i capelli fradici e il sale sulle labbra.
          vai: superficie-fratturata

nemici:
