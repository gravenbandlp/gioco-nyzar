oggetti:
  - id: soglia-di-mara-cerata-del-portinaio
    nome: Cerata del portinaio
    immagine: icone/cloak
    descrizione: "Una cappa di tela grigia dei Precursori, fatta per un corpo alto il doppio e accorciata alla meglio per il tuo. L'acqua ci scivola sopra senza bagnarla, e la tela non fruscia quando ti muovi."
    slot: armatura
    base: cuoio-rinforzato
    grado: 2
    dadi: 1
    proprieta: { silenziosa: true }

glossario:
  - id: soglia-di-mara
    nome: Soglia di Mara
    tipo: luogo
    sottotitolo: Un luogo nero sul crinale a est della Roccia di Wren
    testo: "Un arco di pietra nera alto quattro metri e dritto come un filo a piombo, senza muri ai lati, su un crinale dove non è mai passata una strada. Il nome viene da una vecchia di nome Mara, e il motivo si è perso. Chi ci passa sotto al tramonto racconta di tre battiti di pioggia salata e di un fuoco di legna."

colonna:
