oggetti:
  - id: forno-della-nonna-piastrina
    nome: Piastrina della mano aperta
    immagine: icone/open-palm
    descrizione: "Una piastrina di metallo grande come un palmo, con incisa una mano dalle dita lunghe. Era sul tavolo dell'operatore del Forno, e resta tiepida anche d'inverno. Le macchine dei Precursori, a volte, esitano un momento davanti a chi la porta."
    slot: accessorio
    grado: 2
    proprieta: { talento: { tecnologia: 1, resilienza: 1 } }

glossario:
  - id: forno-della-nonna-mena
    nome: Mena
    tipo: personaggio
    sottotitolo: "Carbonaia di Pannion, sulla strada di Tuarmir"
    testo: "Carbonaia di Pannion, magra, con un fazzoletto rosso in testa e quasi nessun dente. Dorme al Forno della Nonna da quarant'anni, ci lascia il carbone buono come offerta e ne fa rispettare le regole a chiunque ci passi la notte. La prima regola è che lì si dorme e basta."
    requisiti: []
