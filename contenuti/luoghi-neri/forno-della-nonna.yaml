    descrizione: "La foschia del tavolo che si alza e prende la forma di chi lavorava allo scambiatore, alta il doppio di un uomo, senza faccia. Ricorda soltanto il suo lavoro, e chi le si avvicina diventa parte del lavoro."
    attacco: 5
    difesa: 5
    difesaMentale: 4
    pf: 13
    danno: 3
    riduzione: 3
    iniziativa: 3
