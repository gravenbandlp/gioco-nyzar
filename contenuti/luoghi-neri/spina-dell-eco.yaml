# La Spina dell'Eco (docs/piano-superficie.md, «Le nove spedizioni dei luoghi neri»). Un pilastro di pietra nera
# alto sei metri sulla pianura fra il Bosco di Velthar e il Rovolungo, che restituisce le voci dopo nove battiti con
# un'altra parola (codex sf-spina-dell-eco). In superficie resta canone la scena del Circolo con Voren
# (`circolo-la-spina-dell-eco`, la parola di quattro sillabe, circolo.parola): il pilastro è vuoto come un camino e
# scende più giù di quanto sia alto, e la spedizione scende lì dentro. Sotto c'è la voce dello strumento: un cantore
# di ferro che riceve le voci dal camino e le ricanta su, e che quando nessuno grida canta il richiamo dentro una
# bocca di metallo rivolta a nord-est. Da laggiù, molto tempo dopo, risponde una nota bassa.
# Ci si entra da `spina-dell-eco-la-pianura` (Superficie, ripetibile, traccia.spina >= 3); chi ha la parola del
# Circolo (circolo.parola >= 1) può dirla alla Spina, e la riconosce sulla parete dei nomi e davanti al cantore.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 il camino dei pioli o le voci vecchie, 1 le canne o la parete dei nomi, 2 i ripetitori (scontro) o la stanza
# muta, 3 il cerchio dei nove incavi o la membrana; il soffio dei nove battiti vale da 1 a 3.
# Il cuore a 4 è la voce (`spina-dell-eco-la-voce`, misura.spina == 0): il cantore di ferro (boss), oppure cantare il
# richiamo con lui, l'Eco, o dire la parola del Circolo (Difficili). La vittoria dà misura.spina, la Canna della
# voce (grado 2) e parti dei Precursori. Dopo, `spina-dell-eco-la-voce-che-resta` (ripetibile, misura.spina >= 1)
# rende meno.
# La misura, per chi scrive la Campana: il richiamo è un canto di tre note che scendono, senza parole, con l'ultima
# tenuta per nove battiti. Cantato nella bocca rivolta a nord-est, dopo un'attesa lunga torna da laggiù una nota
# bassa che si sente nei denti più che nelle orecchie. Il «ritardo di nove battiti» della Spina è il tempo che la
# voce impiega a scendere fino al cantore e a tornare su.
# Il segno che lega i luoghi neri: il cerchio di nove incavi con uno inciso più a fondo (vedi lente-del-sornione.yaml),
# qui con dentro la riga fra due onde (la quarta pietra dell'Anello); il condotto che va a nord-est è una canna di
# metallo che vibra. La nota bassa che torna dalla bocca di nord-est è la stessa della Costola.
aree:
  - id: spina-dell-eco
    immagine: ambientazione/superficie-fratturata
    nome: La Spina dell'Eco
    sommario: "Il pilastro nero della pianura è vuoto come un camino, e scende sotto terra molto più di quanto sia alto."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Dentro la Spina dell'Eco la pietra nera è liscia come l'interno di una conchiglia, e la mano non ci
      trova una giuntura. Il pilastro continua sotto la pianura in un pozzo dritto con i pioli nella parete. I
      pioli sono di un metallo chiaro che non ha preso ruggine, e in fondo partono gallerie basse piene di
      canne di metallo che vibrano appena quando ci passi accanto.

      Ogni parola che dici qui sotto torna indietro. A volte torna dopo nove battiti con un'altra parola
      dentro, e a volte da una galleria dove non sei ancora stat{o|a}.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: spina-dell-eco-la-pianura
    presso: i-luoghi-neri
    immagine: ambientazione/superficie-fratturata
    titolo: Il pilastro sulla pianura
    sommario: "Sulla pianura del nord la Spina dell'Eco sta ritta come un dito puntato."
    luogo: Superficie Fratturata, la pianura fra il Bosco di Velthar e il Rovolungo
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.spina >= 3]
    testo: |
      La pianura è gialla d'erba secca fino all'orizzonte, chiusa da un lato dal Bosco di Velthar. In mezzo
      sta la Spina, un pilastro di pietra nera alto quanto tre uomini e liscio dalla base alla cima, senza una
      giuntura. Le cavallette saltano nell'erba fino a una decina di passi dal pilastro, e più vicino l'erba è
      ferma. Ai suoi piedi la terra è smossa da vecchi scavi. Le buche hanno i bordi franati e l'erba
      ricresciuta sui mucchi di terra, e la pietra sopra di loro non ha un graffio. In fondo a una buca
      luccica qualcosa di duro.

      Accanto alla buca c'è un cerchio di sassi anneriti, e fra la cenere fredda e indurita dalla pioggia c'è
      un plettro di corno spezzato in due.

      {origine figlio-del-circolo} Il Circolo insegna ad ascoltare prima di parlare, e qui la pianura è così
      zitta che senti il sangue nelle orecchie.

      {percezione Difficile} Il vento gira intorno al pilastro e non fischia nemmeno dove la pietra fa
      spigolo. Da sotto la buca sale invece un sussurro regolare, come di una pentola che bolle piano.
    opzioni:
      - testo: "Scavare la buca fino a quello che è duro"
        descrizione: "Sotto un palmo di terra c'è qualcosa che la pala non sposta."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: L'anello
          testo: |
            Allarghi la buca intorno alla cosa dura, e la pala scopre un coperchio di pietra nera grande come
            una ruota di carro, con un anello di metallo incassato. Sotto la terra l'anello è lucido e non ha
            un filo di ruggine. Ci infili la leva e tiri finché il coperchio si sposta di lato con un rumore
            di macina. Sotto c'è il buio dentro il pilastro, e una fila di pioli che scende.
          pe: { atletica: 2 }
          vai: spina-dell-eco
        fallimento:
          titolo: La terra che torna
          testo: |
            Scavi fino a sera, e la terra secca della pianura ti frana nella buca a ogni palata. È asciutta
            come farina anche a un braccio di profondità, dove dovrebbe cominciare a essere umida. Quando
            smetti hai le spalle a pezzi e la buca è larga come prima, e torni indietro con la pala sulla
            spalla.
          effetti: { ferite: 0.5 }
      - testo: "Gridare e ascoltare da dove torna la voce"
        descrizione: "La voce torna dopo nove battiti. Se torna da sotto, da qualche parte c'è un passaggio per il suono, e forse anche per un corpo."
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: Il nono battito
          testo: |
            Gridi il tuo nome e conti con l'orecchio a terra. Al nono battito la voce torna con un'altra
            parola, e torna da sotto la buca, da un punto preciso dove la terra suona vuota. A dire la parola
            che non capisci è la tua voce. Scavi lì, e trovi il bordo di un coperchio di pietra nera con un
            anello incassato. Quando lo sposti, sotto c'è una fila di pioli che scende.
          pe: { percezione: 2 }
          vai: spina-dell-eco
        fallimento:
          titolo: La parola sbagliata
          testo: |
            Gridi il tuo nome, e al nono battito ti torna con la tua voce il nome di un altro. È un nome che
            non hai mai sentito, e la tua voce lo pronuncia senza esitare. Lo senti ripetere nella testa per
            tutta la strada del ritorno, e a sera ti volti due volte quando qualcuno lo dice in una locanda.
          effetti: { tormento: 0.5 }
      - testo: "Arrivare a cavallo e cercare dove il cavallo non va"
        descrizione: "Sulla pianura un cavallo si vede da lontano e vede lontano. Dove sotto è vuoto, gli zoccoli lo sentono."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Lo zoccolo
          testo: |
            Giri intorno al pilastro al passo, e il cavallo si rifiuta di mettere gli zoccoli sulla terra
            smossa. Tiene le orecchie girate verso il pilastro per tutto il giro, e non le muove nemmeno
            quando lo chiami. Batte lo zoccolo sempre nello stesso punto, e la terra suona vuota. Scavi lì, e
            sotto un palmo trovi un coperchio di pietra nera con un anello incassato. Quando lo sposti, sotto
            c'è una fila di pioli che scende.
          vai: spina-dell-eco
      - testo: "Passare la notte alla Spina e aspettare"
        descrizione: "Di notte la pianura tace, e il sussurro da sotto si sente meglio. Il freddo della notte, però, non lo ferma nessuno."
        costo: 2
        esito:
          titolo: Il sussurro di notte
          testo: |
            Accendi il fuoco nel cerchio di sassi e aspetti. La fiamma piega verso il pilastro anche quando il
            vento viene dall'altra parte, e ti dici che sotto deve esserci un vuoto che tira l'aria. A notte
            fonda il sussurro da sotto la buca si fa chiaro, e ti porta fino al punto dove la terra copre un
            coperchio di pietra nera con un anello. All'alba lo hai liberato, e hai le mani e i piedi gelati.
          effetti: { ferite: 0.5 }
          vai: spina-dell-eco
      - testo: "Dire alla Spina la parola di quattro sillabe"
        descrizione: "Con Voren la Spina ti ha restituito il nome di una città."
        quando: [circolo.parola >= 1]
        esito:
          titolo: La risposta subito
          testo: |
            Dici le quattro sillabe a voce alta, con la cadenza lenta che ti ha insegnato la Spina. Questa
            volta la Spina non te le restituisce, e dopo nove battiti la pianura è ancora zitta. Poi la terra
            intorno alla buca trema e si apre in un cerchio largo come una ruota di carro, su un coperchio di
            pietra nera che si sposta da solo. Sotto c'è una fila di pioli che scende nel buio.
          vai: spina-dell-eco

  # ------------------------------------------------------------ 0 · il camino e le voci vecchie
  - id: spina-dell-eco-il-camino
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il camino dei pioli
    sommario: "Dentro il pilastro una fila di pioli di metallo scende dritta nel buio. Le voci passano su e giù per il camino."
    luogo: La Spina dell'Eco, dentro il pilastro
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 0]
    testo: |
      Dentro il pilastro scende un camino largo quanto un pozzo, con pioli di metallo fatti per gambe più
      lunghe delle tue. Fra un piolo e l'altro c'è più di un braccio, e il metallo non ha un filo di ruggine
      anche dove la pioggia entra dall'alto. I pioli sono freddi e restano freddi anche dopo che ci hai chiuso
      sopra la mano. Sopra di te il cerchio di cielo si rimpicciolisce a ogni piolo. Il camino è pieno di voci
      che salgono da sotto e scendono dall'alto come uccelli in un fienile.

      {atletica Media} I pioli sono lontani ma asciutti. Scendi con le braccia e lascia riposare le gambe, che
      a cercare il piolo dopo si stancano prima.
    opzioni:
      - testo: "Scendere a braccia, piolo dopo piolo"
        descrizione: "Pioli lontani e buio sotto. Le braccia fanno il lavoro, e la testa conta i pioli."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: In fondo al camino
          testo: |
            Scendi a braccia, con i piedi che cercano il piolo dopo e lo trovano sempre un poco più in basso
            del previsto. Conti sessantadue pioli, e da un pezzo sei sotto il livello della pianura. In fondo
            il camino si allarga in una stanza tonda, e le voci si fanno più chiare.
          pe: { atletica: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il piolo mancato
          testo: |
            Al trentesimo piolo il piede trova il vuoto, e resti appes{o|a} per le mani con il cuore in gola.
            Il camino ti rimanda il tuo grido due volte, e la seconda volta arriva da sotto. Risali piolo per
            piolo fino al cerchio di cielo, e ti siedi sull'erba a guardarti le mani.
          effetti: { ferite: 0.5 }
      - testo: "Scendere ascoltando da dove vengono le voci"
        descrizione: "Le voci salgono da sotto. Dove sono più forti, il camino si apre."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La finestra nel camino
          testo: |
            Scendi piano con l'orecchio teso, e a metà camino le voci da sotto si fanno più forti da un lato
            solo. Lì la parete ha una finestra stretta, con il bordo tagliato netto nella pietra, e dalla
            finestra arriva un'aria più tiepida di quella del camino. La finestra dà su una galleria che
            scende in pendenza, con le canne di metallo lungo il soffitto.
          pe: { percezione: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Le voci di sopra
          testo: |
            Segui le voci, e a metà camino ti accorgi che stai seguendo quelle che scendono dall'alto. Risali
            senza volerlo verso il cerchio di cielo, che si allarga sopra di te a ogni piolo, e quando te ne
            accorgi hai le braccia di legno.
          effetti: { tormento: 1 }
      - testo: "Calare la corda nel camino e scendere appesi"
        descrizione: "Una corda legata al primo piolo, e giù."
        costo: 2
        esito:
          titolo: La corda nel camino
          testo: |
            Leghi la corda al primo piolo e ti cali nel camino, con la lanterna appesa alla cintura che sbatte
            contro la pietra. Ogni colpo della lanterna torna su dal fondo un poco dopo. La corda basta per un
            pezzo, e il resto lo fai sui pioli con le braccia già stanche. In fondo ti siedi per terra prima
            di guardarti intorno.
          effetti: { profondita.spina-dell-eco: 1, ferite: 0.5 }

  - id: spina-dell-eco-le-voci-vecchie
    immagine: ambientazione/marea-grigia
    titolo: Le voci vecchie
    sommario: "In fondo al camino c'è una stanza tonda dove le voci di chi ha gridato alla Spina girano ancora, una sull'altra."
    luogo: La Spina dell'Eco, la stanza in fondo al camino
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 0]
    testo: |
      In fondo al camino c'è una stanza tonda con le pareti a spirale, dove girano le voci di chi ha gridato
      alla Spina negli anni. La pietra è liscia come l'interno di una conchiglia, e le voci ti passano a un
      palmo dalla faccia senza muovere l'aria. Un bambino chiama la madre e un uomo bestemmia, e una donna
      ripete tre volte un nome, sempre più piano. Qualche voce usa parole che in città non si dicono più.

      {empatia Media} La donna dei tre nomi salutava qualcuno che non avrebbe rivisto. Abbassa la voce ogni
      volta perché lo sa già.

      La spirale stringe verso il centro e finisce su un'apertura bassa.
    opzioni:
      - testo: "Attraversare la stanza senza ascoltare"
        descrizione: "Sono voci di altri. Si passa in mezzo e si guarda l'apertura in fondo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: In mezzo alle voci
          testo: |
            Attraversi la stanza con gli occhi sull'apertura, e le voci ti girano intorno come la gente in un
            mercato. Il bambino passa e ripassa, e chiama ogni volta con la stessa voce rotta. Arrivi
            all'apertura bassa e la passi chinat{o|a}, e dall'altra parte le voci restano indietro.
          pe: { resilienza: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il bambino
          testo: |
            A metà stanza il bambino chiama la madre proprio accanto al tuo orecchio, e ti volti a cercarlo.
            All'altezza della tua cintura non c'è nessuno. Quando ti riscuoti sei di nuovo sotto il camino, e
            non ricordi di essere tornat{o|a} indietro.
          effetti: { tormento: 1 }
      - testo: "Rispondere alla donna dei tre nomi"
        descrizione: "Una voce che saluta aspetta un saluto. Se qualcuno risponde, forse la voce smette di girare."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Media }
        successo:
          titolo: Il saluto
          testo: |
            Quando la voce della donna ti passa accanto rispondi al saluto, piano, con il nome che lei dice.
            La voce si ferma nel mezzo della stanza e si spegne, e il nome che hai detto non torna indietro.
            Le altre voci girano più larghe e ti lasciano una strada fino all'apertura bassa.
          pe: { empatia: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il nome nella spirale
          testo: |
            Rispondi con il nome che lei dice, e la stanza se lo prende. Adesso in mezzo alle altre gira anche
            la tua voce, e la senti passare ogni volta che fai un passo. È la tua voce di adesso, con il fiato
            corto della discesa. Torni sotto il camino a tapparti le orecchie.
          effetti: { tormento: 1 }
      - testo: "Strisciare lungo il bordo della spirale"
        descrizione: "Lungo il bordo le voci sono più deboli. Il bordo è basso, e si passa sui gomiti."
        costo: 2
        esito:
          titolo: Sui gomiti
          testo: |
            Strisci lungo il bordo della spirale con la faccia contro la pietra, dove le voci arrivano spente.
            Contro la guancia la pietra trema appena a ogni voce che passa. Ci metti molto, e i gomiti te li
            sbucci tutti e due. All'apertura bassa ti tiri su con le orecchie che fischiano.
          effetti: { profondita.spina-dell-eco: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · le canne e la parete dei nomi
  - id: spina-dell-eco-le-canne
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le canne
    sommario: "Una galleria piena di canne di metallo di ogni grossezza. Le voci ci corrono dentro, e ogni canna va in un posto diverso."
    luogo: La Spina dell'Eco, la galleria delle canne
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 1]
    testo: |
      Lungo le pareti e sul soffitto della galleria corrono canne di metallo, alcune grosse come un dito e
      altre come una botte. Non hanno saldature né ribattini, e dove una canna si divide in due la
      biforcazione è fusa in un pezzo solo. Dentro ci corrono le voci, e se appoggi l'orecchio a una canna
      senti passare una parola. A ogni bivio le canne si dividono, e la galleria con loro.

      {tecnologia Media} Le canne grosse portano lontano e le sottili vicino. La galleria giusta è quella dove
      le grosse vanno in giù.
    opzioni:
      - testo: "Seguire le canne più grosse"
        descrizione: "Le canne grosse vanno lontano. Dove vanno tutte insieme, c'è il centro."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Le canne grosse
          testo: |
            Al primo bivio segui le canne grosse, e al secondo pure, finché la galleria scende in una sala
            dove le canne grosse si infilano tutte nel pavimento. Dove entrano nella pietra non c'è una
            fessura, e il pavimento intorno vibra sotto gli stivali. Accanto c'è una scala a chiocciola.
          pe: { tecnologia: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il bivio cieco
          testo: |
            Segui una canna che ti sembrava grossa, e la galleria finisce contro un muro dove la canna si
            infila e sparisce. Il muro è della stessa pietra nera della galleria e non ha un segno di
            chiusura. Torni indietro contando i bivii, e ne conti uno in più di quelli che avevi fatto.
          effetti: { tormento: 1 }
      - testo: "Ascoltare le canne e seguire le voci che scendono"
        descrizione: "Le voci della Spina vanno giù. Se ne segui una con l'orecchio, ti porta dove va lei."
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: Una parola che scende
          testo: |
            Appoggi l'orecchio a una canna a ogni bivio, e segui una parola che corre verso il basso, sempre
            la stessa. È una parola di due sillabe che non capisci, e passa ogni volta con la stessa voce. Al
            quarto bivio la parola si infila nel pavimento con tutte le altre, accanto a una scala a
            chiocciola.
          pe: { percezione: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: L'orecchio
          testo: |
            Appoggi l'orecchio a una canna proprio mentre ci passa un grido, e il grido ti entra nella testa
            come un chiodo. Per un'ora senti tutto da una parte sola, e dalla parte sorda ti resta un fischio
            sottile.
          effetti: { ferite: 0.5 }
      - testo: "Segnare i bivii con il gesso e provarli tutti"
        descrizione: "Un bivio alla volta, e il gesso sul muro. Lento, ma il gesso non sbaglia."
        costo: 2
        esito:
          titolo: Il gesso
          testo: |
            Segni ogni bivio con il gesso e li provi uno dopo l'altro. Sulla pietra nera il gesso fatica a
            prendere, e devi ripassare ogni freccia due volte. Quando trovi la scala a chiocciola hai
            consumato il gesso fino alle dita, e i muri della galleria sono pieni delle tue frecce.
          effetti: { profondita.spina-dell-eco: 1, tormento: 1 }

  - id: spina-dell-eco-la-parete-dei-nomi
    immagine: ambientazione/rovine-dei-precursori
    titolo: La parete dei nomi
    sommario: "Una parete lunga è coperta di segni incisi a gruppi, come parole. Ogni tanto un gruppo si accende, e da una canna passa una voce."
    luogo: La Spina dell'Eco, la parete dei nomi
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 1]
    testo: |
      Su un lato di una galleria dritta la parete è coperta di segni incisi a piccoli gruppi, come parole in
      una lingua che non conosci. I solchi sono profondi e con il fondo lucido, e in nessuno c'è una sbavatura
      o un colpo sbagliato. I gruppi salgono più in alto di dove arriva la lanterna. Sotto ogni gruppo esce
      dal muro una canna sottile. Ogni tanto un gruppo si accende di una luce fioca, e dalla sua canna una
      voce ripete sempre la stessa cosa.

      {accademiche Media} Sono nomi, scritti come quelli sopra le porte dei Precursori. I gruppi hanno
      lunghezze diverse, e per quanto ne conti nessuno si ripete.

      In fondo alla galleria c'è una porta senza maniglia, della stessa pietra nera della parete.
    opzioni:
      - testo: "Leggere i gruppi di segni"
        descrizione: "Se sono nomi, uno sarà il nome di questo posto. E la porta in fondo forse lo vuole sentire."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Il gruppo accanto alla porta
          testo: |
            Il gruppo di segni accanto alla porta si accende più spesso degli altri. Lo guardi a lungo, e la
            canna sotto ripete tre sillabe senza senso. Le ripeti tu ad alta voce, e la porta in fondo alla
            galleria si apre di lato. Scorre dentro la parete senza un rumore, ed è spessa quanto il tuo
            braccio.
          pe: { accademiche: 2 }
          effetti: { profondita.spina-dell-eco: 1, informazioni.voce: 1 }
        fallimento:
          titolo: I segni che si accendono
          testo: |
            Segui i gruppi uno dopo l'altro, e a un certo punto si accendono tutti insieme e tutte le canne
            parlano. La luce fioca di tutti i gruppi basta a farti vedere la galleria fino in fondo, e le voci
            si coprono l'una con l'altra. Ti ritrovi sedut{o|a} per terra con le mani sulle orecchie, e la
            porta in fondo resta chiusa.
          effetti: { tormento: 1 }
      - testo: "Trovare un'altra strada intorno alla porta"
        descrizione: "Le porte dei Precursori hanno sempre accanto un passaggio stretto e scomodo per chi le ripara."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Il passaggio di servizio
          testo: |
            Accanto alla porta, dietro un fascio di canne, c'è un buco nel muro largo quanto un corpo di
            traverso. I bordi sono lisci e squadrati, tagliati apposta per chi doveva passarci. Ti ci infili e
            strisci fra le canne che vibrano, e sbuchi dall'altra parte della porta.
          pe: { acrobazia: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Fra le canne
          testo: |
            Ti infili fra le canne, e una ti passa una voce dritta nell'orecchio proprio mentre resti
            incastrat{o|a} con la spalla. La voce dice una parola sola e la ripete finché non ti liberi. Ci
            metti un pezzo a liberarti, e lasci un brandello di manica fra le canne.
          effetti: { ferite: 0.5 }
      - testo: "Riconoscere la parola di Voren"
        descrizione: "Sulla parete c'è un gruppo di quattro segni che hai già visto, sulla porta della fenditura o nella tua testa."
        quando: [circolo.parola >= 1]
        esito:
          titolo: Quattro segni
          testo: |
            Fra tutti i gruppi ce n'è uno di quattro segni, e quando si accende la sua canna dice le quattro
            sillabe che la Spina ha detto a te e a Voren. I quattro segni sono incisi alla stessa profondità
            degli altri, e sotto le dita il solco è tiepido. Lo tocchi con due dita, e la porta in fondo alla
            galleria si apre senza un suono. Il nome di quella città qui è scritto accanto agli altri, come un
            indirizzo fra tanti.
          effetti: { profondita.spina-dell-eco: 1, informazioni.voce: 1 }
      - testo: "Aspettare che la porta si apra per qualcun altro"
        descrizione: "Le voci passano. Prima o poi una passa dalla porta, e la porta la lascia passare."
        costo: 2
        esito:
          titolo: La voce che passa
          testo: |
            Aspetti sedut{o|a} davanti alla porta, e il freddo del pavimento ti sale piano nella schiena.
            Quando un gruppo di segni accanto alla porta si accende, la porta si apre per lasciar passare una
            voce. Ci passi anche tu di corsa, e la porta si richiude a un dito dalla tua schiena.
          effetti: { profondita.spina-dell-eco: 1, tormento: 1 }

  # ------------------------------------------------------------ 1–3 · il soffio dei nove battiti
  - id: spina-dell-eco-il-soffio
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il soffio dei nove battiti
    sommario: "In una galleria lunga, ogni nove battiti, arriva da sotto un soffio d'aria che ti spinge indietro."
    luogo: La Spina dell'Eco, la galleria lunga
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco >= 1, profondita.spina-dell-eco <= 3]
    testo: |
      La galleria scende lunga e dritta, e ogni nove battiti da sotto arriva un soffio d'aria che ti spinge
      indietro di un passo. Il soffio è tiepido e sa di metallo. Il pavimento è rigato per il lungo da solchi
      sottili, tutti nella direzione del soffio, e ti dici che in fondo ci sarà qualcosa che pompa l'aria come
      il mantice di una fucina. Fra un soffio e l'altro l'aria è ferma e la galleria è zitta, e i nove battiti
      passano in fretta.

      {espressivita Facile} Nove battiti sono una strofa corta. I cantori ci contano sopra senza pensarci.
    opzioni:
      - testo: "Avanzare piegati contro il soffio"
        descrizione: "Con un piede avanti e il peso giusto, il soffio passa sopra la schiena. Lungo, e faticoso."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: "Piegat{o|a}"
          testo: |
            Avanzi piegat{o|a}, e a ogni soffio pianti il piede e lasci che ti passi sulla schiena. Ogni
            soffio ti tira i vestiti verso l'alto e ti lascia sulla nuca un tepore che non va via subito. Fra
            un soffio e l'altro fai otto passi. In fondo alla galleria ti raddrizzi con la schiena che
            scricchiola.
          pe: { resistenza: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il soffio in faccia
          testo: |
            Un soffio ti prende dritto, e ti butta indietro di tre passi fino a sederti per terra. La parola
            che porta dentro ti arriva in faccia gridata. Ci riprovi due volte, e alla terza torni indietro
            con le orecchie che fischiano.
          effetti: { ferite: 0.5 }
      - testo: "Contare i battiti e correre fra un soffio e l'altro"
        descrizione: "Nove battiti sono abbastanza per un tratto di corsa, se si parte al momento giusto."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: La strofa
          testo: |
            Conti a mezza voce come il cantore della locanda, e al primo battito parti di corsa. All'ottavo ti
            fermi contro la parete, e il soffio ti passa accanto e si porta via l'ultima parola della strofa.
            In sei strofe arrivi in fondo alla galleria.
          pe: { espressivita: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Fuori tempo
          testo: |
            Perdi il conto al sesto battito, quando la galleria ti rimanda il cinque con un'altra voce. Il
            soffio ti trova in piena corsa. Finisci contro la parete con la spalla, e torni al punto da cui
            eri partit{o|a} a massaggiartela.
          effetti: { ferite: 0.5 }
      - testo: "Avanzare a carponi lungo il pavimento"
        descrizione: "Rasente al pavimento il soffio passa più alto. Si va piano, e le ginocchia ne fanno le spese."
        costo: 2
        esito:
          titolo: A carponi
          testo: |
            Avanzi a carponi, e i soffi ti passano sopra la testa uno dopo l'altro, ognuno con la sua parola.
            Sotto i palmi senti i solchi del pavimento, tutti nella direzione del soffio. In fondo alla
            galleria hai le ginocchia sbucciate e una ventina di parole che non sai togliere dalla testa.
          effetti: { profondita.spina-dell-eco: 1, tormento: 1 }

  # ------------------------------------------------------------ 2 · i ripetitori e la stanza muta
  - id: spina-dell-eco-i-ripetitori
    immagine: bestiario/salvaguardia-precursori
    titolo: I ripetitori
    sommario: "Dalle canne di una sala pendono due macchine lunghe come braccia, di bronzo. Quando parli ti rispondono con la tua voce, e poi si muovono."
    luogo: La Spina dell'Eco, la sala dei ripetitori
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 2]
    testo: |
      Da due canne che scendono dal soffitto pendono due macchine di bronzo segmentate come lamprede. Il
      bronzo è verde soltanto nelle giunture fra un segmento e l'altro, e sul resto è lucido e senza graffi.
      In punta hanno una bocca tonda piena di denti di metallo. Quando entri restano ferme, e le senti ronzare
      piano dentro il bronzo finché ti scappa un colpo di tosse. Le due macchine tossiscono con la tua tosse e
      si staccano dalle canne.

      {furtivita Media} Sentono e non vedono, e sulle bocche non c'è niente che somigli a un occhio. Se resti
      in silenzio contro la parete, sei soltanto un pezzo di muro.
    opzioni:
      - testo: "Affrontare i ripetitori"
        descrizione: "Due lamprede di bronzo con la bocca piena di denti. Sono sottili, e un colpo pieno le spezza."
        combattimento: spina-dell-eco-ripetitori
        vittoria:
          titolo: Il bronzo spezzato
          testo: |
            L'ultimo ripetitore si spezza in due sul pavimento e dice ancora una parola con la tua voce,
            sempre più piano. Il pezzo che vibrava dietro la bocca è una lamina sottile arrotolata su se
            stessa, e fra le dita trema ancora. Lo stacchi insieme alla bocca di metallo, e attraversi la
            sala.
          effetti: { profondita.spina-dell-eco: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: La tua voce
          testo: |
            I denti ti trovano il braccio e la spalla, e intanto i ripetitori gridano con la tua voce. Gridano
            il tuo dolore un battito dopo di te, e più forte. Esci dalla sala camminando all'indietro, e loro
            tornano ad appendersi alle canne.
      - testo: "Passare contro la parete senza un suono"
        descrizione: "Sentono e non vedono. Bisogna passare senza toccare niente, e senza tossire."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Un pezzo di muro
          testo: |
            Ti togli gli stivali e passi contro la parete sulle calze, con la bocca chiusa e la lanterna
            spenta. Il pavimento è bagnato e gelido sotto i piedi. I ripetitori girano la testa verso ogni
            goccia che cade, e a te non la girano mai.
          pe: { furtivita: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il ginocchio
          testo: |
            Il ginocchio ti scricchiola a metà sala, e i due ripetitori lo ripetono insieme, più forte. Ti
            saltano addosso, e scappi dalla parte da cui sei venut{o|a} con un morso sul polpaccio. Il morso è
            una fila di buchi tondi tutti uguali.
          effetti: { ferite: 0.5 }
      - testo: "Gettare un sasso nell'angolo e passare dall'altra parte"
        descrizione: "Sentono. Un sasso che rotola in un angolo fa un rumore, e loro vanno a ripeterlo."
        costo: 2
        esito:
          titolo: Il sasso
          testo: |
            Getti un sasso nell'angolo, e i ripetitori ci si buttano sopra ripetendo il rumore del sasso. Lo
            ripetono tutto, dal primo colpo all'ultimo rotolare, anche dopo che il sasso si è fermato. Passi
            dall'altra parte di corsa, e uno torna indietro in tempo per morderti la mano che tiene la
            lanterna.
          effetti: { profondita.spina-dell-eco: 1, ferite: 0.5 }

  - id: spina-dell-eco-la-stanza-muta
    immagine: ambientazione/rovine-dei-precursori
    titolo: La stanza muta
    sommario: "In una stanza foderata di feltro grigio non c'è nessun suono, nemmeno quello dei tuoi passi."
    luogo: La Spina dell'Eco, la stanza muta
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 2]
    testo: |
      La stanza è foderata di un feltro grigio spesso un palmo, dal pavimento al soffitto, e dentro non c'è
      nessun suono. Le fibre del feltro sono più sottili di un capello e non sanno di lana né di polvere. Dopo
      un poco cominci a sentire il sangue che ti scorre nelle orecchie, e poi un fischio sottile che viene da
      dentro la testa. In fondo alla stanza, appena visibile nel feltro, c'è una porta.

      {resilienza Media} Il silenzio non ti fa niente. È la testa che riempie il vuoto, e la testa la puoi
      zittire.
    opzioni:
      - testo: "Attraversare il silenzio senza fermarsi"
        descrizione: "È soltanto silenzio. Si attraversa contando i passi, che non si sentono."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il fischio
          testo: |
            Cammini verso la porta contando i passi a mente, e lasci che il fischio fischi. A metà stanza ti
            sembra di sentire qualcuno che ti chiama per nome da dietro, e non ti volti. La porta si apre su
            una scala che scende, e sulla scala il primo rumore che senti è il tuo piede.
          pe: { resilienza: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il nome nel silenzio
          testo: |
            A metà stanza ti senti chiamare da dietro e ti volti, e dietro di te c'è soltanto il feltro
            grigio. Sul feltro non è rimasta nemmeno l'impronta dei tuoi passi. Ti volti tante volte che perdi
            la porta, e torni fuori dalla parte da cui eri entrat{o|a} con il cuore che batte forte.
          effetti: { tormento: 1 }
      - testo: "Seguire il filo d'aria fino alla porta"
        descrizione: "Senza suoni restano le altre cose. Un filo d'aria sulla pelle, per esempio, che va dalla porta a te."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il filo d'aria
          testo: |
            Ti bagni un dito e lo tieni alto, e senti un filo d'aria fresca che viene dal fondo della stanza.
            Sa di pietra bagnata ed è l'unica cosa che si muove nella stanza. Lo segui a occhi chiusi fino
            alla porta, che si apre su una scala che scende.
          pe: { percezione: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il feltro
          testo: |
            Segui il filo d'aria, e ti porta contro la parete di feltro, dove il feltro si apre su un buco che
            non va da nessuna parte. Ci infili il braccio fino al gomito e trovi soltanto altro feltro a
            strati fitti. Torni indietro con la polvere grigia nei capelli e le orecchie piene di fischi.
          effetti: { tormento: 1 }
      - testo: "Cantare forte per tutto il tragitto"
        descrizione: "Se il silenzio si mangia il suono, bisogna fare più suono di quanto ne mangi. Arrivi in fondo senza voce."
        costo: 2
        esito:
          titolo: Senza voce
          testo: |
            Canti a squarciagola la prima canzone che ti viene in mente, e non senti una nota. Senti la gola
            che vibra e le labbra che si muovono, e nelle orecchie c'è soltanto il fischio. Arrivi alla porta
            con la gola in fiamme, e per il resto della discesa parli con un filo di voce.
          effetti: { profondita.spina-dell-eco: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · il cerchio delle nove tacche e la membrana
  - id: spina-dell-eco-il-cerchio-dei-nove
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il cerchio delle canne
    sommario: "In una sala tonda un cerchio di nove incavi è inciso nel pavimento."
    luogo: La Spina dell'Eco, la sala del cerchio
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 3]
    testo: |
      Nel pavimento di una sala tonda è inciso un cerchio largo quanto un tavolo da osteria, con nove incavi
      lungo il bordo. Otto sono lisci, e il fondo è lucidato da qualcosa che ci è passato sopra per molto
      tempo e sempre nello stesso verso. Il nono è più profondo e porta una riga dritta fra due onde, che
      manda una luce bianca a tempo con le voci. Le voci quaggiù arrivano così deboli che non le capisci, e la
      luce le segue lo stesso. Dal centro esce una canna di metallo grossa come un braccio, che corre bassa
      sul pavimento fino alla parete di nord-est.

      {percezione Media} La canna grossa vibra di una nota lunga e senza parole. È l'unica cosa nella sala che
      non segue il tempo delle voci.
    opzioni:
      - testo: "Ricopiare il cerchio sul quaderno"
        descrizione: "Nove incavi, una riga fra due onde e una canna che va verso nord-est. Alla Biblioteca qualcuno saprà leggerli."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: Il disegno
          testo: |
            Ricopi il cerchio incavo per incavo, con la riga fra le due onde dentro quello profondo e una
            freccia lunga per la canna. Mentre disegni il segno pulsa piano, e a ogni impulso la matita lascia
            un tratto più scuro. Alla fine ti accorgi che la matita ha seguito il suo tempo senza che tu lo
            decidessi.
          pe: { accademiche: 2 }
          effetti: { profondita.spina-dell-eco: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: La luce bianca
          testo: |
            Appoggi la mano sull'incavo profondo per tenere fermo il foglio, e la luce bianca ti sale nel
            braccio con una nota che senti nei denti. Attraverso il palmo vedi in controluce le ossa delle
            dita. Per un'ora la mano ti trema troppo per scrivere.
          effetti: { tormento: 1 }
      - testo: "Seguire la canna grossa fino alla parete"
        descrizione: "La canna va a nord-est. Accanto a lei, dove entra nella parete, ci sarà un passaggio per chi la ripara."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La nota lunga
          testo: |
            Segui la canna fino alla parete con una mano sopra, e la nota che vibra dentro ti sale fino alla
            spalla. Il metallo è tiepido e non ha una saldatura per tutta la lunghezza. Dove la canna entra
            nel muro c'è una porticina bassa, e dietro la porticina una scala scende ancora.
          pe: { percezione: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: La vibrazione
          testo: |
            Tieni la mano sulla canna troppo a lungo, e la vibrazione ti entra nelle ossa del braccio fino a
            farti battere i denti. Quando la stacchi la mano continua a tremare a tempo con la canna. Torni
            indietro con il braccio intorpidito e senza aver visto la porticina.
          effetti: { ferite: 0.5 }
      - testo: "Cercare l'incavo che riconosci"
        descrizione: "Questo cerchio l'hai già visto sotto la Soglia di Mara. Laggiù l'incavo profondo aveva una porta."
        quando: [misura.mara >= 1]
        esito:
          titolo: Due segni
          testo: |
            Trovi sul cerchio l'incavo dove sotto la Soglia c'era la porta. Laggiù era il più profondo dei
            nove, e qui è liscio e poco profondo, e sotto le dita resta freddo. Ricopi tutto sul quaderno, i
            due segni uno accanto all'altro, e prosegui.
          effetti: { profondita.spina-dell-eco: 1, informazioni.segreto: 1 }
      - testo: "Passare oltre il cerchio senza toccarlo"
        descrizione: "Il cerchio resta dov'è. Per scavalcare la canna bisogna passarle sopra, e vibra."
        costo: 2
        esito:
          titolo: La canna sotto i piedi
          testo: |
            Scavalchi la canna grossa con un salto, e quando atterri la vibrazione ti sale dalle suole fino
            alle ginocchia. Mentre le passi sopra senti sulle gambe che è più calda dell'aria della sala.
            Prosegui con una nota nei denti che non ti lascia fino in fondo alla discesa.
          effetti: { profondita.spina-dell-eco: 1, tormento: 1 }

  - id: spina-dell-eco-la-membrana
    immagine: ambientazione/rovine-dei-precursori
    titolo: La membrana
    sommario: "Una lamina di metallo sottile e larga come una vela chiude la galleria. Ogni nove battiti vibra, e il pavimento con lei."
    luogo: La Spina dell'Eco, la membrana
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 3]
    testo: |
      La galleria è chiusa da una lamina di metallo sottile come la carta, tesa su un telaio da parete a
      parete. La lamina è lucida e senza un'ammaccatura, e il telaio è fissato alla pietra con viti grosse
      come un pollice. Ogni nove battiti vibra tutta con un rombo basso che scuote il pavimento. Davanti alla
      lamina la polvere si è disposta in righe parallele, spinte dal rombo sempre negli stessi punti. Fra la
      lamina e la parete di destra c'è uno spiraglio stretto da cui si vede una luce.

      {tecnologia Difficile} La lamina è un orecchio o una bocca. Una mano sopra la ferma per un battito, e
      con lei tutto quello che passa da qui.
    opzioni:
      - testo: "Passare di fianco nello spiraglio"
        descrizione: "Di fianco e con le braccia alzate, nel tempo fra un rombo e l'altro. Se arriva il rombo mentre sei dentro, lo senti tutto."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Lo spiraglio
          testo: |
            Aspetti il rombo e ti infili subito dopo, di fianco, con le braccia sopra la testa e la guancia
            contro la parete. La lamina ti passa a un dito dal naso, e ci vedi la tua faccia storta dalla
            curva del metallo. Esci dall'altra parte al settimo battito, e la lamina vibra alle tue spalle
            mentre ti allontani.
          pe: { acrobazia: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il rombo addosso
          testo: |
            Resti incastrat{o|a} a metà spiraglio, e il rombo ti arriva addosso con la lamina a un dito dal
            petto. Lo senti passare nelle costole e nei denti, e ti esce sangue dal naso. Torni indietro di
            fianco, piano, con le orecchie che ronzano.
          effetti: { ferite: 0.5 }
      - testo: "Fermare la lamina con il palmo e passarle sotto"
        descrizione: "Una mano sulla lamina, e per un battito tace. Il telaio in basso lascia lo spazio per un corpo, se si è svelti."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il palmo sulla lamina
          testo: |
            Appoggi il palmo sulla lamina proprio quando comincia a vibrare, e il rombo muore sotto la mano.
            Il metallo è più freddo della pietra intorno e sotto il palmo non si scalda. Per un battito la
            galleria è zitta, e tu ti butti sotto il telaio e rotoli dall'altra parte prima che la lamina
            riparta. Sul telaio, dove l'hai toccata, la lamina ha lasciato cadere una scheggia lucida.
          pe: { tecnologia: 2 }
          effetti: { profondita.spina-dell-eco: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: La mano che vibra
          testo: |
            Appoggi il palmo sulla lamina, e la vibrazione invece di fermarsi ti entra nel braccio fino ai
            denti. Ti stacchi con la mano che trema e la testa che rimbomba, e la lamina continua come prima.
            Sul palmo ti resta per un'ora un reticolo di righe rosse sottili.
          effetti: { tormento: 1 }
      - testo: "Allentare il telaio e aspettare"
        descrizione: "Il telaio ha delle viti. Lento, e ogni nove battiti la lamina ti rimbomba nelle mani."
        costo: 2
        esito:
          titolo: Le viti
          testo: |
            Allenti le viti del telaio una alla volta, e a ogni rombo devi togliere le mani. Le viti non hanno
            ruggine e girano lisce, e ognuna è lunga quanto la tua mano. Quando la lamina si affloscia
            abbastanza da passarle sotto, hai le dita gonfie e i polsi che ti dolgono.
          effetti: { profondita.spina-dell-eco: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · la voce
  - id: spina-dell-eco-la-voce
    immagine: bestiario/salvaguardia-precursori
    titolo: La voce
    sommario: "In fondo alla Spina un cantore di ferro riceve le voci dal camino e le ricanta su."
    luogo: La Spina dell'Eco, la sala della voce
    area: spina-dell-eco
    requisiti: [profondita.spina-dell-eco >= 4, misura.spina == 0]
    testo: |
      La sala è una cupola di pietra nera dove scende dall'alto il camino della Spina. Sulla parete di
      nord-est si apre una bocca di metallo larga come un portone, fatta a imbuto, che sparisce nella roccia.
      Il metallo non ha una giuntura né un ribattino, e il bordo è lucido mentre la pietra intorno è velata di
      polvere.

      In mezzo alla sala sta il cantore di ferro, alto il doppio di te e coperto di grate tonde dalle spalle
      alle ginocchia. Le grate sono decine, ciascuna larga un palmo e fatta di lamelle sottili.

      Dal camino scende una voce, il nome di qualcuno gridato lassù. Il cantore la prende con le grate e la
      ricanta su con la cadenza lenta della Spina e un'altra parola dentro. Quando il camino tace canta verso
      la bocca di nord-est tre note che scendono, con l'ultima tenuta a lungo. Finché la nota dura la polvere
      del pavimento si muove in cerchi intorno ai suoi piedi.

      {origine figlio-del-circolo} Al Circolo ti hanno insegnato a distinguere una voce dall'altra anche nel
      vento. Questa cadenza la riconosceresti fra mille.

      {origine accolito-del-velo} In cripta le testimonianze della Notte dei Sussurri dicono che le voci del
      suolo cantavano con questa cadenza lenta.

      {espressivita Media} L'ultima nota dura nove battiti, quanti la Spina ne mette a restituire una voce in
      superficie. È un richiamo, e chi lo canta aspetta una risposta.

      Dalla bocca non torna niente. Finito il richiamo il cantore si volta verso di te, e tutte le grate si
      aprono insieme con lo scatto di una sola serratura.
    opzioni:
      - testo: "Affrontare il cantore di ferro"
        descrizione: "Decine di bocche e una voce sola, che fa male. Il corpo dietro le grate è fatto per stare fermo, non per battersi."
        combattimento: spina-dell-eco-il-cantore-di-ferro
        vittoria:
          titolo: Il richiamo
          testo: |
            Il cantore cade in ginocchio e le grate gli si chiudono una dopo l'altra, con un rumore di
            imposte. Prima che l'ultima si chiuda ne esce il richiamo, tre note che scendono, e l'ultima la
            tiene per nove battiti. Le canti anche tu piano finché ti restano in gola, e poi le canti dentro
            la bocca di nord-est. Il metallo dell'imbuto si prende la tua voce e la porta via più grave di
            come l'hai cantata.

            Aspetti, e aspetti ancora, finché dalla bocca torna una nota bassa, così lontana che la senti nei
            denti più che nelle orecchie. Dal petto del cantore stacchi un nucleo che ti mormora fra le dita e
            una canna sottile che vibra ancora. Il ferro del petto è freddo, e il nucleo invece è tiepido.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.spina: 1, oggetto.spina-dell-eco-canna-della-voce: 1, parte.nucleo-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: La voce che fa male
          testo: |
            Il cantore apre tutte le grate insieme e ti canta addosso il tuo nome, con la tua voce, così forte
            che ti cade la lama. Le lamelle vibrano tanto che il pavimento ti formicola sotto le suole. Risali
            il camino sui pioli con le orecchie che sanguinano e il tuo nome che ti rimbalza in testa, e sulla
            pianura non senti più niente fino a sera, nemmeno il vento nell'erba.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Cantare il richiamo insieme a lui"
        descrizione: "Tre note che scendono, e l'ultima tenuta per nove battiti. Se lo canti giusto, forse il cantore ti sente come uno dei suoi."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: Due voci
          testo: |
            Quando il cantore riprende il richiamo attacchi con lui la prima nota, e poi la seconda, e la
            terza la tieni per nove battiti senza che la voce ti tremi. La sua voce ti vibra nello sterno
            insieme alla tua. Poi canti di nuovo, da sol{o|a}, dentro la bocca di nord-est, e l'imbuto si
            prende la voce senza rimandarne indietro niente.

            Aspetti, e aspetti ancora, finché dalla bocca torna una nota bassa, così lontana che la senti nei
            denti più che nelle orecchie. Il cantore apre una grata sul petto con lo scatto di un chiavistello
            e ti lascia prendere un nucleo che mormora e una canna sottile che vibra ancora.
          pe: { espressivita: 5 }
          effetti: { misura.spina: 1, oggetto.spina-dell-eco-canna-della-voce: 1, parte.nucleo-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La nota stonata
          testo: |
            Alla terza nota la voce ti si spezza, e il cantore ti rimanda la nota stonata con decine di bocche
            insieme. Tutte la stonano nello stesso punto in cui l'hai stonata tu. Ti ritrovi sui pioli del
            camino senza ricordare di esserci salit{o|a}, con il sangue che ti cola da un orecchio e il
            richiamo storpiato in testa.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Leggere la memoria della sala con l'Eco"
        descrizione: "La formula dell'Eco legge la memoria di un luogo. Questa sala non ha fatto altro che ricordare voci."
        incantesimo: eco
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La prima volta
          testo: |
            Dici la formula, e la sala ti mostra la prima volta che il cantore ha cantato il richiamo, con la
            sala nuova e la bocca lucida. Il ferro del cantore è chiaro come appena battuto, e le grate gli
            coprono il petto senza un vuoto. Impari le tre note da lì, e l'ultima la tieni nove battiti come
            allora.

            Aspetti, e aspetti ancora, finché dalla bocca torna una nota bassa, così lontana che la senti nei
            denti più che nelle orecchie. Prima di risalire prendi da una nicchia accanto alla bocca un nucleo
            che mormora e una canna sottile che vibra ancora.
          pe: { magia: 5 }
          effetti: { misura.spina: 1, oggetto.spina-dell-eco-canna-della-voce: 1, parte.nucleo-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Tutte le voci
          testo: |
            La formula ti apre la memoria della sala tutta in una volta, e ti arrivano addosso tutte le voci
            che sono passate di qui, una sull'altra. Le più recenti gridano nomi dal camino, e le più vecchie
            sono così basse che le senti nelle ossa. Ti ritrovi sulla pianura sdraiat{o|a} sull'erba, con le
            mani sulle orecchie e la gola secca.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Dire la parola di quattro sillabe al cantore"
        descrizione: "Detta qui sotto, è una parola che lui conosce."
        quando: [circolo.parola >= 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Difficile }
        successo:
          titolo: Il nome della città
          testo: |
            Dici le quattro sillabe con la cadenza lenta della Spina, e il cantore si ferma con le grate
            aperte. Le lamelle smettono di vibrare tutte nello stesso momento. Poi canta il richiamo, e
            stavolta lo canta verso di te, tre note che scendono e l'ultima tenuta per nove battiti, finché lo
            hai imparato. Lo canti tu dentro la bocca di nord-est.

            Aspetti, e aspetti ancora, finché dalla bocca torna una nota bassa, così lontana che la senti nei
            denti più che nelle orecchie. Il cantore apre una grata sul petto e ti lascia prendere un nucleo
            che mormora e una canna sottile che vibra ancora.
          pe: { espressivita: 5 }
          effetti: { misura.spina: 1, oggetto.spina-dell-eco-canna-della-voce: 1, parte.nucleo-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La parola nel posto sbagliato
          testo: |
            Sbagli la cadenza, e il cantore ti restituisce le quattro sillabe con la tua voce, storpiate, da
            tutte le bocche insieme. Ogni bocca le storpia sulla stessa sillaba. Risali il camino con quel
            nome storto in testa, e sulla pianura ti sembra di sentirlo anche nel vento.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Tornare su senza farsi sentire"
        descrizione: "Il cantore resta dov'è, e il camino riporta alla pianura."
        costo: 0
        esito:
          titolo: I pioli
          testo: |
            Esci dalla sala camminando all'indietro senza dire una parola, e tieni gli occhi sul cantore
            finché la cupola sparisce sotto i tuoi piedi. Risali il camino piolo dopo piolo. Mentre sali senti
            scendere una voce gridata dalla pianura, e dopo un poco risalire con un'altra parola dentro.
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo · la voce, le altre volte
  - id: spina-dell-eco-la-voce-che-resta
    immagine: bestiario/salvaguardia-precursori
    titolo: La voce, di nuovo
    sommario: "Il cantore di ferro è di nuovo in piedi davanti alla bocca di nord-est. Il richiamo lo sai, e la bocca risponde ancora."
    luogo: La Spina dell'Eco, la sala della voce
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco >= 4, misura.spina >= 1]
    testo: |
      Il cantore di ferro è di nuovo in piedi, con qualche grata in meno sul petto. Dove mancano le grate il
      petto è chiuso da una lamiera liscia, senza un segno di martello. Ricanta su le voci del camino come
      prima, e quando il camino tace canta il richiamo verso la bocca di nord-est. Ti accorgi di cantarlo con
      lui a bocca chiusa, e il tuo nono battito cade insieme al suo.

      {percezione Media} Nella nicchia accanto alla bocca ci sono di nuovo pezzi lucidi, portati lì mentre
      nessuno guarda. La polvere davanti alla nicchia è intatta, e non c'è un'impronta.
    opzioni:
      - testo: "Abbattere di nuovo il cantore"
        descrizione: "Ha meno grate dell'altra volta. Dentro ci sarà meno da prendere, ma qualcosa c'è."
        combattimento: spina-dell-eco-il-cantore-di-ferro
        vittoria:
          titolo: Le grate in meno
          testo: |
            Il cantore cade in ginocchio con il richiamo a metà. La nota rimasta a metà gira nella cupola per
            qualche battito e poi si perde nella bocca di nord-est. Dal petto stacchi un nucleo più piccolo di
            quello dell'altra volta e un guscio chiuso, e risali il camino prima che le grate ricomincino a
            muoversi.
          effetti: { parte.nucleo-2: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Il tuo nome
          testo: |
            Il cantore ti canta addosso il tuo nome con tutte le bocche, e
            risali il camino con le orecchie che fischiano.
          effetti: { tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Cantare il richiamo e prendere dalla nicchia"
        descrizione: "Mentre il cantore canta verso la bocca non guarda la nicchia. Bisogna cantare con lui, e allungare la mano al momento giusto."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: La nicchia
          testo: |
            Canti il richiamo con il cantore, e sulla nota lunga allunghi la mano alla nicchia. Prendi due
            pezzi lucidi e un guscio chiuso. Sono tiepidi, mentre il metallo della nicchia è freddo, e quando
            la nota finisce sei già sui pioli.
          pe: { espressivita: 2 }
          effetti: { reliquie.frammento-inciso: 2, reperto.sigillato: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La nota corta
          testo: |
            Tieni la nota lunga un battito di meno, e il nono battito il cantore lo canta da solo. Poi si
            volta verso di te con le grate aperte. Risali a mani vuote con un ronzio in testa, che sui pioli
            ha ancora la cadenza lenta della Spina.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ascoltare la risposta e risalire"
        descrizione: "La bocca di nord-est risponde ancora. Basta aspettare."
        costo: 0
        esito:
          titolo: La nota bassa
          testo: |
            Ti siedi contro la parete e aspetti con il cantore. La pietra è liscia e fredda contro la schiena,
            e lui resta girato verso la bocca per tutta l'attesa con le grate socchiuse. Finito il richiamo, e
            passata un'attesa lunga, la nota bassa torna dalla bocca di nord-est, e te la senti nei denti
            mentre risali il camino.
          vai: superficie-fratturata

