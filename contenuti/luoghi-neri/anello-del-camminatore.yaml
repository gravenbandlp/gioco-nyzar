# L'Anello del Camminatore, spedizione dei luoghi neri (docs/piano-superficie.md, «Le nove spedizioni dei luoghi
# neri»). Nove pietre nere ai margini del Rovolungo, tre giorni a nord-ovest di Qir-Azel (codex sf-anello-del-camminatore):
# dentro il cerchio l'erba non cresce e gli animali girano. Sotto c'è il quadrante, un disco di metallo grande come
# una piazza che gira da prima della Caduta, e il Camminatore, la macchina che lo spinge camminandoci sopra.
# Le nove pietre sono nove tasti, e ognuna porta il segno di uno dei nove luoghi neri. Nessun testo lo spiega: chi
# gioca vede i segni, e qualcuno lo riconosce (le sette righe delle Stele, i tre punti dei Tamburi).
#
# Ingresso `anello-del-camminatore-il-cerchio` (Superficie, ripetibile, traccia.anello >= 3): due vie con prova
# (chi fallisce resta fuori dal cerchio), il cavallo a costo 0, la corda del mandriano a costo 2.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
#   0 le nove pietre, il cane che gira;
#   1 la scala che gira;
#   1–3 le trottole (combattimento contro due gregari);
#   2 i pozzi dei tasti, il corridoio che torna;
#   3 le ossa in tondo, l'orlo del quadrante.
# Il cuore a 4 è il quadrante (`anello-del-camminatore-il-quadrante`, misura.anello == 0): il Camminatore (boss),
# oppure la sbarra fra i denti (Tecnologia), il Comando, il passo accanto a lui (Resilienza o Percezione), tutte
# Difficili; per il Figlio del Circolo il passo si conta come quello del cervo (Natura, Difficile). La vittoria dà
# misura.anello, il Perno del quadrante e parti dei Precursori; chi fallisce torna in Superficie senza misura.
# Dopo, `anello-del-camminatore-il-quadrante-riparte` (ripetibile, misura.anello >= 1) rende meno.
#
# L'ordine delle nove pietre, cioè la misura dell'Anello (per chi scrive la Campana Sepolta). Ogni pietra ha il
# segno di un luogo, e il quadrante le accende una dopo l'altra in quest'ordine:
#   1 il cerchio (l'Anello stesso), 2 la porta (Soglia di Mara), 3 la mano aperta (Forno della Nonna),
#   4 la riga fra due onde (Spina dell'Eco), 5 l'occhio (Lente del Sornione), 6 la punta (Volta dell'Aculeo),
#   7 i tre punti (Tamburi di Fondo), 8 le sette righe (Stele dei Naviganti), 9 l'arco curvo (Costola di Drago).
# Si comincia da qui, si entra, ci si fa riconoscere, si chiama, si danno l'ora, la data, il conto e la direzione,
# e per ultima si batte la nota. Nella prosa l'ordine si legge per segni, senza dire a che cosa servono.
aree:
  - id: anello-del-camminatore
    immagine: ambientazione/rovine-dei-precursori
    nome: L'Anello del Camminatore
    sommario: "Nove pietre nere in cerchio ai margini del Rovolungo, con un disco di terra nuda nel mezzo."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Sotto il disco di terra nuda la roccia è scavata a cerchi concentrici come gli anelli di un tronco. Le
      pareti di metallo scuro e caldo corrono tutte in curva, e non vedi mai più in là di una ventina di
      passi. Le lastre delle pareti combaciano senza un chiodo né una saldatura, e sul metallo non c'è un filo
      di ruggine.

      Dal centro arriva un rumore regolare di metallo su metallo, e ogni colpo arriva dopo lo stesso tempo del
      precedente. Quando ti fermi ad ascoltarlo, il corpo continua a girare un poco verso destra per conto
      suo.

colonna:
  - { contesto: area, id: anello-del-camminatore, musica: unsettling-paths, ambiente: cave }

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: anello-del-camminatore-il-cerchio
    presso: i-luoghi-neri
    immagine: ambientazione/rovolungo
    titolo: Il cerchio dei cani
    sommario: "Ai margini del Rovolungo nove pietre nere stanno in cerchio intorno a un disco di terra dove l'erba non cresce."
    luogo: Superficie Fratturata, ai margini del Rovolungo
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.anello >= 3]
    testo: |
      Il terzo giorno di marcia verso nord-ovest le colline si abbassano e compare la macchia scura del
      Rovolungo, con i rovi piegati dal vento di mare. Sul suo bordo, in un prato d'erba gialla, nove pietre
      nere alte fino al ginocchio chiudono un disco di terra nuda, liscia come se qualcuno la spazzasse ogni
      mattina. L'erba arriva fino alle pietre e lì si ferma con un taglio netto. Ti dici che sotto la terra ci
      sarà uno strato di roccia dove l'erba non mette radici. Nel prato ci sono tracce di zoccoli e di pecore,
      e tutte girano al largo a una decina di passi dalle pietre.

      Sulla cima consumata della prima pietra si legge ancora un segno inciso, un arco curvo come una costola.
      La pietra è un basalto a grana fine, e sotto la mano è tiepida anche sul lato in ombra. Al centro del
      disco la terra ha una leggera depressione.

      {origine figlio-del-circolo} Al Circolo i bambini imparano presto a riconoscere i posti dove le bestie
      non entrano, e a starne fuori anche loro. Qui i piedi ti si fermano da soli davanti alla prima pietra.
    opzioni:
      - testo: "Attraversare il cerchio contando i passi"
        descrizione: "Dal bordo al centro sono dieci passi. Il cane del mandriano ha perso il conto e ha girato fino a morire."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Dieci passi
          testo: |
            Conti a mezza voce con gli occhi sulla depressione al centro, e al quarto passo il corpo comincia
            a tirarti verso destra con la pazienza di una corrente. Correggi il passo ogni volta, contando più
            forte. Al decimo sei nel mezzo, e sotto gli stivali la terra suona vuota. Scavi con le mani un
            palmo di polvere fine e trovi una lastra di metallo tiepida e senza un graffio, che si abbassa da
            sola appena ci metti sopra il peso.
          pe: { resilienza: 2 }
          vai: anello-del-camminatore
        fallimento:
          titolo: Il giro largo
          testo: |
            Al sesto passo perdi il conto, e quando lo ritrovi sei di nuovo sul bordo, con la prima pietra
            alle spalle e le gambe che hanno camminato un giro intero senza chiederti il permesso. Nella
            polvere del disco le tue impronte disegnano un cerchio regolare intorno al centro. Ti siedi
            nell'erba alta fuori dal cerchio, finché il prato non smette di girarti intorno.
          effetti: { tormento: 0.5 }
      - testo: "Scavare sotto la pietra più annerita"
        descrizione: "Una pietra è più nera delle altre, come se ci avessero acceso il fuoco contro. Sotto le pietre, di solito, c'è qualcosa."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il cunicolo
          testo: |
            Scavi accanto alla pietra con il segno del cerchio, la più nera delle nove, e a un braccio di
            profondità la terra lascia il posto a una parete di metallo liscio. La terra intorno è umida, e il
            metallo non ha un filo di ruggine. Lo segui scavando di lato con le unghie piene di terra, finché
            non trovi un'apertura stretta come una tana di tasso. Ci passi di spalle, e dall'altra parte c'è
            un corridoio che scende curvando.
          pe: { atletica: 2 }
          vai: anello-del-camminatore
        fallimento:
          titolo: La pala che gira
          testo: |
            Scavi per un'ora, e il manico della pala ti ruota fra le mani a ogni colpo, come una vite che
            cerca il suo verso. Alla fine ti sfugge e ti batte sullo zigomo. Ti rimane un livido caldo, e
            sotto la pietra soltanto terra.
          effetti: { ferite: 0.5 }
      - testo: "Guardare dove si ferma il cavallo"
        descrizione: "Un cavallo non entra dove le bestie girano. Si ferma prima, e dove si ferma lo sa meglio di te."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il cavallo puntato
          testo: |
            Porti il cavallo intorno al cerchio al passo, con le redini lente. Si ferma da solo davanti alla
            pietra con il segno del cerchio, le orecchie in avanti e il muso basso, e non vuole fare un passo
            né avanti né indietro. Sotto la tua mano ha il collo bagnato di sudore. Lo leghi a un cespuglio di
            rovo e vai dritto dove guardava lui, al centro del disco. Sotto un palmo di polvere c'è una lastra
            di metallo che si abbassa appena ci sali sopra.
          vai: anello-del-camminatore
      - testo: "Legarsi una corda in vita, come il mandriano"
        descrizione: "Una corda legata a un rovo fuori dal cerchio. Se cominci a girare, la corda ti riporta indietro. Ci vuole tempo, e la corda stringe."
        costo: 2
        esito:
          titolo: La corda
          testo: |
            Leghi un capo della corda al rovo più grosso e l'altro alla cintura, e ti avvii verso il centro.
            La corda si tende tre volte e tre volte ti riporta al bordo, segnandoti i fianchi, finché non
            impari a camminare tenendola tesa con la mano come un cane al guinzaglio. Al centro trovi una
            lastra di metallo sotto la polvere, e quando ci sali sopra si abbassa con te.
          effetti: { tormento: 0.5 }
          vai: anello-del-camminatore

  # ------------------------------------------------------------ 0 · le nove pietre e il cane
  - id: anello-del-camminatore-le-nove-pietre
    immagine: ambientazione/rovine-dei-precursori
    titolo: Sotto le nove pietre
    sommario: "La prima sala sotto il cerchio è rotonda, e dal soffitto scendono le radici delle nove pietre, lisce come colonne."
    luogo: L'Anello del Camminatore, la sala sotto il cerchio
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore == 0]
    testo: |
      La lastra si ferma in una sala rotonda grande quanto il cerchio di sopra, con le pareti di metallo scuro
      che curvano senza una giuntura. Dal soffitto scendono nove cilindri di pietra nera, uno sotto ogni
      pietra del prato, e finiscono a mezz'aria poco sopra la tua testa. Ognuno porta inciso lo stesso segno
      della sua pietra. Lassù i segni sono smussati dal vento, e quaggiù hanno ancora gli spigoli vivi del
      primo giorno. La porta per scendere è chiusa da una grata fitta con sopra il segno del cerchio.

      {tecnologia Media} Sono tasti che si premono dall'alto quando qualcuno cammina sul prato, e quaggiù
      scendono a spingere qualcosa. Ogni cilindro corre in un foro del soffitto con il gioco di un capello, e
      il bordo del foro è lucido dove la pietra lo ha strisciato.

      Nella sala non c'è un granello di polvere, e l'aria sa di metallo caldo. Il cilindro del cerchio è più
      basso degli altri, e il pavimento sotto è consumato a forma di piede.
    opzioni:
      - testo: "Premere il cilindro del cerchio"
        descrizione: "È più basso degli altri, e qualcuno ci ha messo i piedi sotto molte volte. Basta capire come lo spingeva."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La grata
          testo: |
            Ti metti dove il pavimento è consumato, alzi le mani sotto il cilindro e spingi verso l'alto
            invece che verso il basso. Il cilindro sale di un dito con uno scatto, e la grata scorre di lato
            dentro la parete senza un cigolio. Oltre c'è un corridoio che scende in curva, e dal fondo arriva
            un rumore regolare di metallo su metallo.
          pe: { tecnologia: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: Il cilindro sbagliato
          testo: |
            Spingi il cilindro del cerchio, e si muove quello accanto, con i tre punti. La sala intera fa
            mezzo giro su se stessa con un ronzio basso, e tu con lei, e quando si ferma la grata è dalla
            parte opposta. Ti siedi per terra con le orecchie che fischiano, ad aspettare che le pareti
            restino ferme.
          effetti: { tormento: 1 }
      - testo: "Forzare la grata con il coltello"
        descrizione: "Le grate si forzano. Questa ha le sbarre fitte e un bordo che non si vede."
        prova: { attributo: fisico, abilita: [atletica, armi-da-mischia], difficolta: Media }
        successo:
          titolo: Il bordo
          testo: |
            Infili la lama fra la grata e lo stipite e fai leva con tutto il corpo, e alla terza spinta la
            grata cede di un palmo con un sospiro d'aria calda. Il bordo è sottile e affilato. Ti ci infili di
            fianco strisciando la giubba sul metallo, e dall'altra parte c'è un corridoio che scende.
          pe: { atletica: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: La lama storta
          testo: |
            La grata non si muove, e la lama si piega con un rumore secco che rimbalza per la sala. Il
            contraccolpo ti apre il palmo sulla base del pollice. Te lo fasci con un lembo della camicia,
            guardando i cilindri che ti stanno sopra come denti.
          effetti: { ferite: 0.5 }
      - testo: "Passare dalla fessura sopra la grata"
        descrizione: "Fra la grata e il soffitto c'è uno spazio dove passa un corpo magro. Bisogna arrampicarsi su un cilindro e lasciarsi cadere dall'altra parte."
        costo: 2
        esito:
          titolo: La fessura
          testo: |
            Ti arrampichi sul cilindro più vicino abbracciandolo come un palo della cuccagna, e la pietra
            sotto le braccia è liscia e tiepida. Da lì ti allunghi fino alla fessura sopra la grata. Passi di
            spalle e ti lasci cadere dall'altra parte, e atterri male su una caviglia. Il corridoio comincia
            lì, e scende.
          effetti: { profondita.anello-del-camminatore: 1, ferite: 0.5 }

  - id: anello-del-camminatore-il-cane-che-gira
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il cane che gira
    sommario: "In una sala bassa un cane magro gira in tondo sullo stesso cerchio di polvere, e non si ferma quando lo chiami."
    luogo: L'Anello del Camminatore, una sala bassa
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore == 0]
    testo: |
      Nella sala accanto c'è un bastardo grigio con le costole che si contano, e gira. Fa sempre lo stesso
      cerchio con il muso basso e la coda fra le zampe, e nella polvere ha già scavato un solco profondo due
      dita. Il solco è tondo e regolare, e il cane non ne mette fuori una zampa nemmeno quando inciampa. Al
      collo ha una cordicella rosicchiata.

      {addestrare-animali Media} Ha paura di fermarsi, e quando rallenta guarda il soffitto e riprende. Lo
      fermerebbe la voce del padrone, e da come ti guarda potresti esserlo anche tu.

      Il soffitto è basso e liscio, e lassù non c'è niente da guardare. Oltre il cerchio del cane, dall'altra
      parte della sala, scende una rampa.
    opzioni:
      - testo: "Fermarlo con la voce e con le mani"
        descrizione: "Un cane che gira da giorni ha bisogno di qualcuno che gli dica che può smettere."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: "Sedut{o|a}"
          testo: |
            Ti accucci sul bordo del suo cerchio e lo chiami basso, con il tono che si usa quando in tasca c'è
            un pezzo di formaggio. Al terzo giro rallenta, e al quarto ti viene incontro e si siede contro il
            tuo ginocchio, tremando. Lo tieni finché non smette. Poi ti segue fino alla rampa e lì si sdraia
            con il muso sulle zampe, deciso a non andare oltre.
          pe: { addestrare-animali: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: Il morso
          testo: |
            Allunghi la mano per prenderlo alla cordicella, e lui ti morde senza nemmeno guardarti, poi
            riprende il giro come se niente fosse. Ti rialzi con il polso che sanguina e il segno di quattro
            denti sul dorso della mano. Il cane passa sulle gocce del tuo sangue al giro dopo, e non le
            annusa.
          effetti: { ferite: 0.5 }
      - testo: "Sollevarlo di peso e portarlo via"
        descrizione: "È pelle e ossa. Lo si prende in braccio e lo si porta dove la sala non lo tira."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il peso morto
          testo: |
            Lo prendi al volo mentre passa e te lo stringi al petto, e lui scalcia per tutta la sala con una
            forza che un cane così magro non dovrebbe avere. In cima alla rampa smette di colpo e ti lecca il
            mento. Lo lasci accucciato lì in cima e scendi da sol{o|a}.
          pe: { atletica: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: Il giro con lui
          testo: |
            Lo prendi in braccio, e appena hai i piedi dentro il suo cerchio cominci a girare anche tu. Fai
            tre giri con il cane stretto al petto prima di riuscire a buttarti fuori, e cadi su un fianco
            mentre il cane riprende a girare per conto suo. Nel solco le tue impronte restano accanto alle
            sue.
          effetti: { tormento: 1 }
      - testo: "Lasciarlo girare e prendere la rampa"
        descrizione: "Non puoi salvare tutto quello che trovi qui sotto. La rampa è libera."
        costo: 2
        esito:
          titolo: Il rumore delle zampe
          testo: |
            Giri intorno alla sala rasente al muro, lontano dal cerchio del cane, e prendi la rampa senza
            voltarti. Il rumore delle sue zampe sulla polvere ti segue regolare per un pezzo. Anche quando non
            lo senti più continui a contarlo.
          effetti: { profondita.anello-del-camminatore: 1, tormento: 1 }

  # ------------------------------------------------------------ 1 · la scala che gira
  - id: anello-del-camminatore-la-scala-che-gira
    immagine: ambientazione/rovine-dei-precursori
    titolo: La scala che gira
    sommario: "Una scala a chiocciola scende intorno a un pozzo. I gradini ruotano piano sotto i piedi, ognuno con la sua velocità."
    luogo: L'Anello del Camminatore, la scala a chiocciola
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore == 1]
    testo: |
      Il corridoio finisce sull'orlo di un pozzo largo una decina di passi, e lungo la parete scende una scala
      a chiocciola senza ringhiera. Ogni gradino è una lastra di metallo spessa due dita che gira lenta su se
      stessa, ciascuna a una velocità diversa. Sul metallo non c'è un segno d'olio, e nessuno lo unge da
      chissà quanto tempo. A guardarli tutti insieme viene la nausea, e il fondo del pozzo non si vede.

      {acrobazia Media} I gradini girano tutti nello stesso verso. Se scendi contro il giro i piedi trovano
      l'appoggio da soli, e infatti il bordo di ogni lastra è consumato proprio da quel lato.
    opzioni:
      - testo: "Scendere a passi corti, contro il giro"
        descrizione: "Un piede alla volta, sempre contro il verso dei gradini. Ci vuole equilibrio."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Contro il giro
          testo: |
            Scendi un gradino alla volta con la mano destra sulla parete, e i piedi si oppongono al giro come
            su una barca che rolla. Sotto il palmo la parete è tiepida e liscia, e per tutta la discesa non
            trovi una giuntura. A metà ti accorgi che stai canticchiando per tenere il tempo. In fondo il
            pavimento è fermo, e ci resti un momento in piedi a godertelo.
          pe: { acrobazia: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: Il gradino veloce
          testo: |
            Un gradino gira più svelto degli altri e ti porta via il piede. Scivoli per cinque o sei gradini
            sul fianco e ti aggrappi alla parete con le unghie, finché non ti fermi su uno che gira piano.
            Resti lì sdraiat{o|a} mentre il gradino ti porta in tondo, e a ogni giro vedi passare il pozzo e
            poi la parete. Risali fino al corridoio con il gomito sbucciato.
          effetti: { ferite: 0.5 }
      - testo: "Scendere a occhi chiusi, contando"
        descrizione: "Quello che fa girare la testa sono gli occhi. Senza gli occhi restano i piedi e il conto."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Al buio
          testo: |
            Chiudi gli occhi e scendi contando i gradini con la parete sotto il palmo. Senza vederli i gradini
            sono soltanto un pavimento che si muove un poco, come la tolda di un traghetto sul Torvessa. Al
            buio senti meglio il fruscio sottile che viene da ogni lastra, e ognuna ha la sua nota. Al
            centoventesimo il piede trova il fondo, e riapri gli occhi.
          pe: { resilienza: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: Gli occhi aperti
          testo: |
            A metà conto apri gli occhi per controllare, e il pozzo ti gira intorno come l'acqua in un imbuto.
            Ti siedi sul gradino con le mani piatte sul metallo tiepido, e nei palmi senti il gradino che ti
            porta in tondo. Risali a gattoni e piano, finché il corridoio non è di nuovo dritto davanti a te.
          effetti: { tormento: 1 }
      - testo: "Calarsi con la corda nel pozzo"
        descrizione: "La scala gira, il pozzo invece è fermo. Una corda legata in cima e giù per il vuoto."
        costo: 2
        esito:
          titolo: La corda nel pozzo
          testo: |
            Leghi la corda all'ultimo gradino fermo e ti cali nel vuoto centrale, lontano dalla scala.
            Scendendo vedi le lastre da sotto, e i perni che le reggono sono lucidi come se li avessero
            montati ieri. La corda finisce prima del fondo, e l'ultimo tratto lo fai saltando nel buio.
            Atterri su un pavimento di metallo con un rumore che rimbomba fino in cima.
          effetti: { profondita.anello-del-camminatore: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1–3 · le trottole
  - id: anello-del-camminatore-le-trottole
    immagine: bestiario/salvaguardia-precursori
    titolo: Le trottole
    sommario: "In un corridoio largo due trottole di metallo grandi come la testa di un cane girano sulla punta, ferme nello stesso posto."
    luogo: L'Anello del Camminatore, un corridoio largo
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore >= 1, profondita.anello-del-camminatore <= 3]
    testo: |
      Dove il corridoio si allarga girano due trottole di metallo grandi come la testa di un cane. Stanno in
      equilibrio sulla punta e hanno sul bordo una corona di lame sottili. Il pavimento ronza sotto le suole,
      e sopra quel ronzio c'è quello più acuto delle lame che tagliano l'aria. Intorno alle punte il metallo
      del pavimento è segnato da centinaia di cerchi sottili che si accavallano.

      {armi-da-mischia Media} Girano verso destra, e chi colpisce da sinistra va contro il filo delle lame. Il
      punto debole è la punta che tocca terra, perché tutto il peso poggia lì.

      Quando fai un passo avanti le trottole fanno insieme un passo verso di te.
    opzioni:
      - testo: "Abbattere le trottole"
        descrizione: "Due, con le lame sul bordo. Si colpiscono da sinistra, alla punta."
        combattimento: anello-del-camminatore-trottole
        vittoria:
          titolo: Le punte
          testo: |
            La seconda trottola si inclina e rotola sul fianco. Per terra gira ancora un poco e sempre più
            lenta, come una moneta. Raccogli i pezzi che si sono staccati dal bordo. Le lame sono spesse
            quanto un'unghia e non hanno una tacca, e il filo ti incide il polpastrello appena ne stringi una.
            Il ronzio del pavimento continua, e adesso che sono ferme le due trottole sembrano giocattoli.
          effetti: { profondita.anello-del-camminatore: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: I graffi in tondo
          testo: |
            Le trottole ti girano intorno e ti tagliano le gambe a strisce, finché non arretri fino alla curva
            del corridoio. Lì si fermano e tornano al loro posto. Riprendono a girare sulla punta una accanto
            all'altra, ognuna nel punto esatto del pavimento da cui era partita.
      - testo: "Passare quando girano lontano"
        descrizione: "Si spostano insieme. Se una va da una parte, anche l'altra ci va."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il passo laterale
          testo: |
            Fai un passo a destra, e le trottole vengono a destra. Fra le due resta sempre la stessa distanza,
            come se le tenesse insieme un'asta che non vedi. Ne fai un altro e un altro ancora, finché non le
            hai portate contro la parete. Poi scatti a sinistra e corri, e quando si girano verso di te sei
            già oltre la curva.
          pe: { furtivita: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: La lama sullo stinco
          testo: |
            Scatti troppo presto, e una delle due ti taglia la strada. La lama ti apre lo stivale e la pelle
            sotto, e il taglio è così netto che lì per lì senti soltanto un filo di freddo. La riga sottile
            comincia a sanguinare un momento dopo. Torni indietro zoppicando fino alla curva del corridoio.
          effetti: { ferite: 0.5 }
      - testo: "Prendere il condotto basso sotto il corridoio"
        descrizione: "Sotto il pavimento c'è un condotto per l'aria. È stretto e caldo, e le trottole lì non arrivano."
        costo: 2
        esito:
          titolo: Il condotto caldo
          testo: |
            Sollevi una piastra del pavimento e ti infili a pancia in giù nel condotto che corre sotto il
            corridoio. L'aria è calda come quella di una stalla d'inverno e non sa di niente. Sopra di te il
            ronzio delle trottole passa e ripassa, e una volta resta fermo sopra la tua schiena finché non
            ricominci a strisciare. Quando esci dall'altra parte hai la camicia fradicia e le ginocchia
            scorticate.
          effetti: { profondita.anello-del-camminatore: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · i pozzi dei tasti e il corridoio che torna
  - id: anello-del-camminatore-i-pozzi-dei-tasti
    immagine: ambientazione/rovine-dei-precursori
    titolo: I pozzi dei tasti
    sommario: "Nove pozzi verticali scendono dal soffitto in fila curva, uno per pietra. In fondo a ciascuno c'è un pistone con un segno."
    luogo: L'Anello del Camminatore, la galleria dei pozzi
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore == 2]
    testo: |
      La galleria segue la curva del cerchio, e lungo la parete interna si aprono nove pozzi larghi quanto le
      spalle di un uomo. In ognuno scende un pistone di metallo nero con un segno sulla testa. I segni sono
      incisi a fondo e hanno ancora i bordi vivi. Riconosci il cerchio e i tre punti delle pietre di sopra.
      Più avanti trovi una punta e un occhio, e su un altro pistone sette righe in fila. I pistoni sono fermi
      ad altezze diverse, forse secondo il peso dell'ultima bestia che è passata sopra ogni pietra.

      {accademiche Difficile} Sette colonne a sud-ovest oltre la Foresta Strisciante, tre colpi sotto il guado
      nord della Palude Acquanera. Ti tornano in mente i nomi neri dei registri della Biblioteca, e il conto
      torna fin troppo.

      Da ogni pozzo un'asta va verso il centro, e dopo l'ultimo la galleria scende.
    opzioni:
      - testo: "Seguire le aste fino a dove vanno"
        descrizione: "Nove aste che partono dai pistoni e vanno tutte nello stesso posto. Basta seguirne una."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Le nove aste
          testo: |
            Segui l'asta del cerchio lungo un condotto basso con la lampada fra i denti, e a un certo punto le
            altre otto la raggiungono una per una, come affluenti di un fiume. Finiscono tutte insieme in un
            giunto grosso quanto un barile. In mezzo a tutto quel metallo caldo il giunto è freddo sotto il
            palmo. Oltre il giunto c'è una rampa.
          pe: { tecnologia: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: Il pistone che scende
          testo: |
            Ti infili in un pozzo per vedere dove va l'asta, e il pistone sopra la tua testa scende di colpo
            di un braccio. Qualcuno sul prato ha calpestato una pietra. Esci in tempo con il cuoio della
            giubba strappato sulla spalla e il cuore in gola. Il pistone resta giù ancora un poco, e poi
            risale al suo posto senza fare rumore.
          effetti: { ferite: 0.5 }
      - testo: "Ricopiare i nove segni"
        descrizione: "I segni sono nove e sono chiari. Qualcuno alla Biblioteca saprà che farne, se li porti fuori interi."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Nove segni
          testo: |
            Ricopi i segni sul quaderno uno per pozzo, nell'ordine in cui li trovi lungo la galleria. Le teste
            dei pistoni sono tiepide, e quando ci appoggi il quaderno per scrivere la carta si incurva appena.
            Al settimo ti accorgi che l'ordine dei pozzi non è quello delle pietre di sopra, e lo scrivi a
            margine. In fondo alla galleria una rampa scende.
          pe: { accademiche: 2 }
          effetti: { profondita.anello-del-camminatore: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: I segni che girano
          testo: |
            Ricopi i segni, e quando rileggi il quaderno sono capovolti tutti tranne il cerchio. Ti dici che è
            colpa della luce e del quaderno tenuto di traverso. Ricominci da capo con il quaderno dritto
            davanti agli occhi, e i segni si capovolgono di nuovo. Lasci perdere con la mano che ti trema.
          effetti: { tormento: 1 }
      - testo: "Strisciare sotto le aste fino in fondo"
        descrizione: "Le aste corrono basse sotto la galleria. Ci si passa sotto, piano, sperando che sul prato non passi nessuno."
        costo: 2
        esito:
          titolo: Sotto le aste
          testo: |
            Strisci sotto le aste lungo tutta la galleria con la faccia sul metallo tiepido. Con l'orecchio
            contro il pavimento senti ogni tanto un colpo sordo e lontano, che è un'asta che si muove in
            un'altra parte della galleria. A metà un'asta scende di un dito sopra la tua schiena e risale, e
            tu resti immobile come una lucertola finché non smette. In fondo alla galleria trovi la rampa che
            scende.
          effetti: { profondita.anello-del-camminatore: 1, tormento: 1 }

  - id: anello-del-camminatore-il-corridoio-che-torna
    immagine: ambientazione/marea-grigia
    titolo: Il corridoio che torna
    sommario: "Un corridoio curvo scende verso il centro. Dopo un giro intero ti ritrovi davanti alla stessa macchia sulla parete."
    luogo: L'Anello del Camminatore, il corridoio a spirale
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore == 2]
    testo: |
      Il corridoio scende in spirale con la parete interna che curva sempre a destra, e la pendenza è quella
      leggera di una strada di collina. All'altezza della spalla c'è una macchia scura sul metallo, come
      l'impronta di una mano unta. Cammini per un giro intero, e la macchia è di nuovo lì, uguale. Ti dici che
      in una spirale i giri si somigliano tutti, e che chi è passato prima di te si è appoggiato sempre nello
      stesso punto. Al secondo giro ci appoggi sopra la tua mano, e combacia.

      Dal centro arriva sempre il rumore di metallo alla stessa distanza di prima, e intanto le ginocchia ti
      dicono che sei sces{o|a} parecchio.
    opzioni:
      - testo: "Cercare la pendenza vera"
        descrizione: "Il corridoio finge di scendere. Da qualche parte scende davvero, e il pavimento lo sa."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La biglia
          testo: |
            Posi a terra un sasso rotondo e lo guardi rotolare. Va contro il senso della spirale, cioè in
            salita per quello che ti dicono le gambe, e si ferma contro la parete esterna davanti a una
            giuntura che non avevi visto. La spingi, e si apre su una scala dritta che scende davvero. Dal
            primo gradino il rumore di metallo è più vicino.
          pe: { percezione: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: La terza volta
          testo: |
            Alla terza volta che trovi la macchia ti siedi accanto, e ti accorgi che il segno della tua mano
            adesso è fresco. Lo tocchi con un dito, e il segno è ancora tiepido. Torni indietro di corsa fino
            all'inizio del corridoio, e ci metti meno di quanto ti aspettavi.
          effetti: { tormento: 1 }
      - testo: "Correre contro il verso della spirale"
        descrizione: "Se il corridoio ti riporta indietro, si va nel verso opposto, e in fretta, prima che se ne accorga."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Controcorrente
          testo: |
            Corri verso sinistra contro la curva, e il corridoio si fa pesante come una salita dopo pranzo.
            Passi accanto alla macchia una volta e poi un'altra, e al terzo giro non la trovi più. Tieni duro
            finché le cosce non bruciano, e d'un tratto la parete si apre su un passaggio dritto in discesa,
            dove prima c'era soltanto metallo.
          pe: { atletica: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: Il fiato corto
          testo: |
            Corri finché le gambe ti reggono, e il rumore di metallo dal centro non si avvicina e non si
            allontana mai. Quando ti fermi a prendere aria con le mani sulle ginocchia la macchia è davanti a
            te, all'altezza della spalla. Ci metti molto a tornare indietro, con un crampo che ti morde il
            polpaccio.
          effetti: { ferite: 0.5 }
      - testo: "Segnare la parete con il gesso a ogni passo"
        descrizione: "Una riga di gesso ogni dieci passi, e se torni su una riga lo sai subito. Ci vuole la pazienza di un muratore."
        costo: 2
        esito:
          titolo: Il gesso
          testo: |
            Tracci una riga di gesso ogni dieci passi, numerandole. Le righe tornano, ma sempre con un numero
            più alto, come se qualcuno le ricopiasse avanti a te. Il gesso che hai in mano intanto si consuma
            più in fretta di quanto vorrebbe il conto delle righe. Alla trentesima trovi una giuntura nella
            parete esterna, e dietro c'è una scala dritta. Per tutta la discesa continui a contare per dieci.
          effetti: { profondita.anello-del-camminatore: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · le ossa in tondo e l'orlo del quadrante
  - id: anello-del-camminatore-le-ossa-in-tondo
    immagine: ambientazione/marea-grigia
    titolo: Le ossa in tondo
    sommario: "Su un pianerottolo largo le ossa di molte bestie stanno in fila lungo un cerchio, tutte con la testa nello stesso verso."
    luogo: L'Anello del Camminatore, il pianerottolo delle ossa
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore == 3]
    testo: |
      Sul pianerottolo, lungo un cerchio tracciato nel metallo, ci sono in fila le ossa di molte bestie, dalle
      lepri alle capre. Hanno tutte il muso nello stesso verso, come se fossero cadute camminando. Le ossa
      sono bianche e pulite, e nessun dente le ha rosicchiate. Nell'aria calda non c'è nessun odore. Ti
      spieghi la cosa con il caldo del metallo, perché deve averle seccate prima che una bestia qualsiasi
      arrivasse a mangiarle. In mezzo c'è quello che resta di un uomo con una giacca di lana di pecora e una
      bisaccia a tracolla.

      {empatia Media} Era un mandriano e ha seguito le sue bestie fin qui. Il suo cane gli sta ai piedi, dove
      stanno i cani buoni.

      Oltre il cerchio una rampa scende verso il rumore di metallo.
    opzioni:
      - testo: "Capire da dove passa il cerchio"
        descrizione: "Le bestie sono morte sulla stessa linea. Basta non metterci i piedi sopra, e per questo bisogna vederla."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: La linea
          testo: |
            Guardi come sono cadute le bestie, e la linea viene fuori da sola, un cerchio sottile segnato nel
            metallo da un graffio più chiaro. Ogni bestia ha l'ultima zampa posata proprio sul graffio. Lo
            scavalchi con un passo lungo, come si scavalca una pozzanghera. Nella bisaccia del mandriano c'è
            un frammento di metallo inciso che teneva avvolto in una pezza, e lo prendi chiedendogli scusa.
          pe: { natura: 2 }
          effetti: { profondita.anello-del-camminatore: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il passo storto
          testo: |
            Metti il piede sulla linea senza vederla, e le gambe cominciano a portarti lungo il cerchio,
            dietro alle capre. Ti butti di lato prima del terzo passo e finisci sulle ossa, che si rompono
            sotto di te. Anche da terra le gambe tirano verso il cerchio, e devi aspettare che smettano. Ti
            rialzi con le mani piene di polvere bianca.
          effetti: { tormento: 1 }
      - testo: "Attraversare in fretta tenendo la testa ferma"
        descrizione: "La linea tira chi si distrae. Si attraversa guardando un punto solo, senza pensare alle bestie."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Un punto solo
          testo: |
            Fissi l'imbocco della rampa e ci vai dritto, contando i passi. Quando passi la linea senti le
            gambe tirare piano verso destra, e le lasci tirare senza ascoltarle. La tirata dura tre passi e
            poi smette di colpo, come una corrente quando esci dal filo del fiume. Ti volti soltanto in cima
            alla rampa, e il mandriano è sempre lì con il suo cane ai piedi.
          pe: { resilienza: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: La fila
          testo: |
            A metà ti scappa lo sguardo sulle capre, e i piedi ti portano in fila con loro. Il passo ti mette
            nel vuoto fra due capre, dove c'è posto giusto per una persona. Fai mezzo giro del cerchio prima
            di riuscire a sederti per terra, e da sedut{o|a} torni fuori strisciando, con la nausea delle sere
            in cui hai bevuto troppo.
          effetti: { tormento: 1 }
      - testo: "Fare il giro largo lungo la parete"
        descrizione: "Lontano dalle ossa, rasente al muro. Il pianerottolo è largo, e il muro è rovente."
        costo: 2
        esito:
          titolo: Il muro rovente
          testo: |
            Fai il giro del pianerottolo con la schiena contro la parete, che è calda come un forno di pane.
            La camicia ti si incolla alla pelle e poi al metallo, e a ogni passo la devi staccare. Le ossa
            restano alla tua destra per tutto il tempo, e a un certo punto ti accorgi che anche tu cammini con
            il muso nel loro verso. Alla rampa hai una scottatura sulle scapole.
          effetti: { profondita.anello-del-camminatore: 1, ferite: 0.5 }

  - id: anello-del-camminatore-l-orlo-del-quadrante
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'orlo del quadrante
    sommario: "La rampa finisce sul bordo di un disco di metallo grande come una piazza, che gira lento. Per arrivare al centro bisogna salirci sopra."
    luogo: L'Anello del Camminatore, l'orlo del quadrante
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore == 3]
    testo: |
      La rampa finisce su una cengia, e un braccio più in basso gira il quadrante. È un disco di metallo
      grande come una piazza e inciso di linee dal bordo al centro, che gira lento verso destra con un rumore
      di macina. Le linee hanno gli spigoli arrotondati dall'usura, e nel fondo la polvere di metallo si è
      raccolta in strisce lucide. Ti viene in mente che anche una ruota di mulino, se nessuno la ferma, va
      avanti per anni. Lungo il bordo passano nove placche alte quanto un uomo, ognuna con il segno di una
      pietra. Dal disco sale un vento caldo che sa di ferro limato.

      {atletica Media} Il bordo va più svelto del centro, e chi salta giù deve correre per qualche passo nel
      verso del disco.

      Al centro qualcosa di alto si muove in tondo.
    opzioni:
      - testo: "Saltare sul disco e correre con lui"
        descrizione: "Un salto di un braccio su un pavimento che gira. Si atterra correndo, nel suo verso."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il salto
          testo: |
            Aspetti che passi una placca e salti subito dietro, e atterri correndo con le braccia larghe. Il
            disco ti porta per un tratto come la corrente porta una barca, finché non trovi il passo. Poi
            cammini verso il centro lungo una delle linee incise, e il rumore di macina ti sale dalle suole
            fino ai denti. La placca ti protegge dal vento caldo che viene dal mezzo.
          pe: { atletica: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: La placca
          testo: |
            Salti nel momento sbagliato, e la placca che arriva ti prende in pieno sulla spalla e ti butta
            contro la cengia. Il disco non rallenta di niente per l'urto. Ti tiri su a fatica e resti
            sedut{o|a} sulla rampa a guardarlo girare, con il braccio che non si alza oltre la testa.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare la placca giusta e salirci sopra"
        descrizione: "Le placche passano in ordine. Una ha in cima una sporgenza dove sta un piede, e il tempo per salirci è poco."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il gradino del cerchio
          testo: |
            Guardi passare le placche per tre giri, e la terza volta vedi che quella con il cerchio ha sul
            retro un gradino consumato. Il gradino è scavato a conca da un piede che ci si è appoggiato sempre
            nello stesso punto. Quando passa ci metti il piede sopra con calma, e ti lasci portare. Dal
            gradino una fila di appigli scende fino al disco, dalla parte del centro.
          pe: { percezione: 2 }
          effetti: { profondita.anello-del-camminatore: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il gradino sbagliato
          testo: |
            Metti il piede sulla placca sbagliata, che non ha gradini, e scivoli giù fino al disco con le
            unghie che non fanno presa sul metallo. Sbatti il mento sull'orlo del disco. La placca prosegue il
            suo giro senza di te, e tu risali sulla cengia con il sapore del sangue in bocca.
          effetti: { ferite: 0.5 }
      - testo: "Calarsi sul disco con la corda e lasciarsi trascinare"
        descrizione: "Una corda dalla cengia, e il disco ti trascina finché non molli. Sul metallo, a pancia in giù."
        costo: 2
        esito:
          titolo: "Trascinat{o|a}"
          testo: |
            Ti cali con la corda sul disco e lasci che ti trascini, sdraiat{o|a} sul metallo inciso, mentre la
            corda ti segna le mani. Sotto la guancia le linee sono calde e vibrano del rumore di macina.
            Quando molli rotoli per tre volte su te stess{o|a} e ti fermi su una linea che va verso il centro.
            La segui carponi, con la testa che continua a girare per conto suo.
          effetti: { profondita.anello-del-camminatore: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · il quadrante
  - id: anello-del-camminatore-il-quadrante
    immagine: bestiario/salvaguardia-precursori
    titolo: Il quadrante
    sommario: "Al centro del disco cammina il Camminatore, una macchina alta il doppio di un uomo che spinge il quadrante con i suoi passi."
    luogo: L'Anello del Camminatore, il centro del quadrante
    area: anello-del-camminatore
    requisiti: [profondita.anello-del-camminatore >= 4, misura.anello == 0]
    testo: |
      Al centro del quadrante il metallo si alza in un mozzo, e intorno al mozzo cammina il Camminatore. È una
      macchina alta il doppio di un uomo, con tre gambe lunghe e un corpo stretto come una botte, e con due
      braccia spinge una sbarra infilata nel mozzo. A ogni passo il disco gira di un dito, e sotto le sue
      gambe si è scavato un solco profondo fino al ginocchio. Le gambe sono consumate e tonde in fondo, e il
      resto del corpo non ha un graffio. Provi a calcolare quanti passi servono a consumare il metallo fino a
      quella profondità, e smetti prima di arrivare a un numero.

      Sul mozzo ci sono in cerchio i nove segni delle pietre, ognuno con accanto una piccola lastra di vetro
      scuro. Quando il Camminatore passa davanti a un segno la lastra si scalda e si spegne, in un ordine
      diverso da quello del giro.

      {tecnologia Difficile} È una sequenza che si ripete a ogni giro. Se il Camminatore si ferma, le lastre
      restano accese nell'ordine giusto finché non riparte.

      {origine apprendista-raschiatore} Sulle piattaforme ti insegnano prima di tutto a non metterti mai fra
      una macchina e il suo lavoro, e tu sei già in mezzo.

      Il Camminatore gira la testa verso di te senza smettere di camminare.
    opzioni:
      - testo: "Fermare il Camminatore"
        descrizione: "Tre gambe e due braccia sulla sbarra. Ha camminato tutta la vita, e non ha mai dovuto difendersi."
        combattimento: anello-del-camminatore-quadrante
        vittoria:
          titolo: L'ordine delle pietre
          testo: |
            Il Camminatore cade su un ginocchio con un rumore di campana incrinata, e il quadrante rallenta e
            si ferma per la prima volta da prima della Caduta. Nel silenzio che resta ti fischiano le
            orecchie. Sul mozzo le lastre si accendono una dopo l'altra e restano accese. La prima è quella
            del cerchio. Vengono poi la porta e la mano aperta, e dopo la riga fra due onde. Si accendono
            l'occhio e la punta, e infine i tre punti e le sette righe. L'ultima è l'arco curvo come una
            costola. Ricopi l'ordine sul quaderno due volte, per sicurezza.

            Dal ginocchio del Camminatore si stacca il perno su cui girava, un cilindro di metallo grande come
            un pugno, fermo in mezzo a tutto quello che ancora vibra. Lo prendi insieme a quello che resta dei
            suoi pannelli.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.anello: 1, oggetto.anello-del-camminatore-perno: 1, parte.impugnatura-3: 1, reliquie.frammento-inciso: 2, bottino.parti-di-drone: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Nel solco
          testo: |
            Il Camminatore ti spinge nel suo solco con un braccio, e la gamba che viene dopo ti passa sopra.
            Ti schiaccia senza fretta e senza cambiare passo, con lo stesso peso che mette sul metallo da
            sempre. Ti trascini fuori dal mozzo con le costole che scricchiolano. Risali al prato in un tempo
            che non sapresti dire, e per due giorni il letto ti gira verso destra quando chiudi gli occhi.
          effetti: { tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Infilare la sbarra fra i denti del mozzo"
        descrizione: "Se il disco si blocca, il Camminatore si ferma."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La sbarra
          testo: |
            Conti i passi del Camminatore, e fra il quinto e il sesto infili la sbarra fra due denti del
            mozzo. Il disco si ferma con uno strattone che ti arriva fino alle spalle, e la sbarra si piega
            appena e tiene. Il Camminatore resta con una gamba alzata, e sul mozzo le lastre si accendono una
            dopo l'altra e restano accese. La prima è quella del cerchio. Seguono la porta e la mano aperta,
            poi la riga fra due onde. Si accendono l'occhio e la punta, e infine i tre punti e le sette righe.
            L'ultima è l'arco curvo come una costola. Ricopi l'ordine sul quaderno due volte.

            Il perno su cui girava il Camminatore è saltato fuori dal suo ginocchio per il contraccolpo. Lo
            raccogli con i pannelli che si sono staccati dal mozzo.
          pe: { tecnologia: 5 }
          effetti: { misura.anello: 1, oggetto.anello-del-camminatore-perno: 1, parte.impugnatura-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La sbarra che salta
          testo: |
            Infili la sbarra un passo troppo tardi, e il mozzo te la strappa di mano e la scaglia contro di
            te. Ti prende di piatto sul petto e ti lascia un livido largo quanto una mano. Il Camminatore non
            si ferma nemmeno, e il suo passo resta lo stesso di prima. Risali al prato tenendoti le costole,
            senza aver visto l'ordine.
          effetti: { ferite: 2, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ordinargli di fermarsi"
        descrizione: "Il Comando parla alle macchine dei Precursori nella loro lingua. Questa cammina da sempre, e nessuno le ha mai detto di smettere."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Fermo
          testo: |
            Dici la formula, e la parola ti esce in una lingua che non è la tua e ti lascia in bocca un sapore
            di rame. Il Camminatore finisce il passo che aveva cominciato e si ferma, con le braccia sulla
            sbarra, come un mulo che ha sentito la voce del padrone. Sul mozzo le lastre si accendono una dopo
            l'altra e restano accese. La prima è quella del cerchio. Seguono la porta e la mano aperta, poi la
            riga fra due onde. Si accendono l'occhio e la punta, e infine i tre punti e le sette righe.
            L'ultima è l'arco curvo come una costola.

            Quando ti avvicini il Camminatore ti porge il perno del suo ginocchio, piegandosi fino a terra, e
            si siede nel solco.
          pe: { magia: 5 }
          effetti: { misura.anello: 1, oggetto.anello-del-camminatore-perno: 1, parte.impugnatura-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La parola che gira
          testo: |
            La formula ti si avvita in bocca e ne esce rovesciata. Il Camminatore allunga il passo, e il
            rumore di macina sale di tono mentre il quadrante accelera fino a buttarti giù. Rotoli fino
            all'orlo, e risali al prato con la testa che gira e una parola sulla lingua che non sai dire.
          effetti: { tormento: 2, ferite: 1 }
          vai: superficie-fratturata
      - testo: "Camminargli accanto per un giro intero"
        descrizione: "Al suo fianco, nel solco, allo stesso passo."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Difficile }
        successo:
          titolo: Un giro intero
          testo: |
            Entri nel solco accanto al Camminatore, e il fondo è liscio e tiepido sotto le suole. Cammini con
            lui un passo per ogni suo passo, con gli occhi sulle lastre. La prima è quella del cerchio.
            Seguono la porta e la mano aperta, poi la riga fra due onde. Si scaldano l'occhio e la punta, e
            infine i tre punti e le sette righe. L'ultima è l'arco curvo come una costola.

            Quando esci dal solco il Camminatore si ferma per la prima volta e ti guarda. Poi si china e ti
            lascia sul bordo il perno del suo ginocchio, e riprende a camminare zoppicando.
          pe: { resilienza: 5 }
          effetti: { misura.anello: 1, oggetto.anello-del-camminatore-perno: 1, parte.impugnatura-3: 1, reliquie.frammento-inciso: 2, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il passo perso
          testo: |
            Al terzo segno perdi il passo, e il solco ti prende. Cammini dietro al Camminatore per non sai
            quanti giri, con le gambe che vanno per conto loro. I tuoi piedi cadono ogni volta nelle orme
            consumate dei suoi. Alla fine inciampi e cadi fuori dal solco. Risali al prato senza l'ordine, e
            per giorni ti svegli in piedi accanto al letto.
          effetti: { tormento: 2 }
          vai: superficie-fratturata
      - testo: "Contare il suo passo come quello del cervo"
        descrizione: "Al Circolo si impara a seguire un cervo contando i suoi passi finché non sono anche i tuoi."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, resilienza], difficolta: Difficile }
        successo:
          titolo: Il passo del cervo
          testo: |
            Al centesimo passo il Camminatore diventa per te un animale con il suo sentiero, e tu ci entri
            accanto. Il suo passo ha la cadenza lunga e uguale di un cervo che va all'acqua. Da lì leggi le
            lastre una per una mentre si scaldano. La prima è quella del cerchio. Seguono la porta e la mano
            aperta, poi la riga fra due onde. Si scaldano l'occhio e la punta, e infine i tre punti e le sette
            righe. L'ultima è l'arco curvo come una costola.

            Quando esci dal solco il Camminatore si ferma e ti guarda. Poi si china e ti lascia sul bordo il
            perno del suo ginocchio, e riprende a camminare zoppicando.
          pe: { natura: 5 }
          effetti: { misura.anello: 1, oggetto.anello-del-camminatore-perno: 1, parte.impugnatura-3: 1, reliquie.frammento-inciso: 2, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il cervo che ti porta
          testo: |
            Conti, e a un certo punto ti accorgi che stai contando i tuoi passi dentro il solco dietro di lui.
            Il numero a cui sei arrivat{o|a} è molto più alto di cento. Ne esci cadendo, molti giri dopo.
            Risali al prato senza l'ordine, e per giorni ti svegli in piedi accanto al letto.
          effetti: { tormento: 2 }
          vai: superficie-fratturata
      - testo: "Risalire senza toccare niente"
        descrizione: "Il Camminatore non ti ha chiesto niente. La rampa è alle tue spalle, e il prato è in cima."
        costo: 0
        esito:
          titolo: Il prato
          testo: |
            Torni indietro sul disco verso l'orlo, mentre il Camminatore continua il suo giro. Risali la rampa
            e la scala, e quando esci sul prato è sera. Il rumore di metallo non si sente più, e nei talloni
            ti resta il suo passo. Le nove pietre sono tiepide. Ti siedi fuori dal cerchio a guardare le lepri
            che arrivano al bordo e girano.
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo · il quadrante che riparte
  - id: anello-del-camminatore-il-quadrante-riparte
    immagine: bestiario/salvaguardia-precursori
    titolo: Il quadrante che riparte
    sommario: "Il Camminatore ha ripreso a camminare, zoppo. Il quadrante gira più piano, e intorno al mozzo si è accumulato quello che il disco perde."
    luogo: L'Anello del Camminatore, il centro del quadrante
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore >= 4, misura.anello >= 1]
    testo: |
      Il Camminatore gira di nuovo intorno al mozzo, zoppo della gamba a cui manca il perno. Il quadrante va a
      scatti, e il rumore di macina adesso va fuori tempo, con due colpi ravvicinati prima di ogni pausa. A
      ogni scatto dal mozzo cadono pezzi di metallo che si ammucchiano nel solco davanti alle sue gambe. Sono
      lucidi e senza ruggine, con le linee incise ancora nitide sul lato di sopra. Le lastre si scaldano
      ancora nell'ordine che hai sul quaderno.

      {tecnologia Media} Adesso il disco si consuma da solo, e il Camminatore spinge avanti nel solco quello
      che perde.

      Quando ti vede gira la testa verso di te senza smettere di zoppicare.
    opzioni:
      - testo: "Fermarlo un'altra volta"
        descrizione: "È zoppo, ma è sempre alto il doppio di te. Nel solco c'è quello che il disco ha perso."
        combattimento: anello-del-camminatore-quadrante
        vittoria:
          titolo: Lo spazzino
          testo: |
            Il Camminatore si siede nel solco e smette di spingere. Raccogli dal mucchio quello che si può
            portare via, mentre il quadrante si ferma con un lamento lungo. I pezzi sono caldi e hanno i bordi
            spezzati di fresco. Quando sei sulla rampa lo senti rialzarsi e riprendere, un passo zoppo alla
            volta.
          effetti: { parte.impugnatura-2: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Nel solco
          testo: |
            Ti butta nel solco con un braccio, e il mucchio di metallo ti rotola addosso con un rumore di
            pentole rovesciate. I pezzi hanno i bordi vivi di una rottura recente. Ne esci tagliat{o|a} in
            dieci punti e risali al prato a mani vuote.
          effetti: { tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Raccogliere dal solco fra un passo e l'altro"
        descrizione: "Il mucchio è davanti alle sue gambe. Si prende quello che si può mentre la gamba è alzata."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Difficile }
        successo:
          titolo: Fra un passo e l'altro
          testo: |
            Aspetti che alzi la gamba zoppa, ti butti nel solco e prendi a piene mani, e ne esci prima che la
            gamba torni giù. Il metallo che prendi è caldo, e ogni pezzo porta su un lato le linee incise del
            disco. Lo fai tre volte. Il Camminatore non si volta nemmeno.
          pe: { acrobazia: 2 }
          effetti: { parte.involucro-2: 1, reliquie.scheggia: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La gamba che scende
          testo: |
            La gamba zoppa scende prima del previsto e ti pesta il piede. Ti
            liberi tirando, e risali al prato zopp{o|a} quanto lui.
          effetti: { ferite: 1 }
          vai: superficie-fratturata
      - testo: "Lasciarlo camminare e risalire"
        descrizione: "Hai già quello che ti serviva. Lui ha ancora il suo lavoro."
        costo: 0
        esito:
          titolo: Il lavoro
          testo: |
            Lo guardi fare un giro intero, con il quadrante che scatta a ogni passo zoppo, e poi risali. Il
            giro gli costa più tempo di prima, e quando torna davanti a te il mucchio nel solco è cresciuto di
            qualche pezzo. Sul prato le lepri arrivano al bordo del cerchio e girano, come prima.
          vai: superficie-fratturata

