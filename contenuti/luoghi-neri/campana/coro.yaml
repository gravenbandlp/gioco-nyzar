# La Campana Sepolta, strato 3: il coro (campana.strato 2 → 3). Si arriva dal cuore delle canne
# (`campana-canne-l-accordatore`) o, dopo una ritirata, dall'ingresso sulla costa grigia (sblocco.yaml).
# La sala degli operatori: gli stalli in file come il coro di una chiesa, tutti rivolti verso la parete di fondo, e
# la Marea Grigia come memoria corrotta dell'ultima notte, con le figure che ripetono i gesti del turno e il bambino
# al tavolo dei sogni del Forno della Nonna, che ha una faccia diversa a ogni sguardo. Qui le negative principali
# sono la Contaminazione e il Tormento.
# - area `campana-coro`: undici stanze ripetibili, in fasce di profondità (una stanza superata non ricompare nella
#   stessa visita): 0 le prime file (gli stalli occupati, la coperta) o la porta di sotto (la fila mandata giù,
#   combattimento con gli operatori); 1 il bambino al tavolo (la trottola, il nome del Forno) o la tazza sul bracciolo
#   (il ripiano dei nove indicatori, il ragno-sacrificale); da 1 a 3 l'operatore con le mani sulle orecchie, dove la
#   Marea è più fitta; 2 la volta (il cielo della notte del suono, le due stelle del Sornione) o il corridoio dei turni
#   (la lanterna di Pannion, gli operatori); 3 il registro dei colpi (il conto dei Tamburi) o il bambino di nuovo
#   (più grande, sorvegliato dal ragno); 4 la parete di fondo (le nove grate, le crepe) o lo stallo alto (la voce
#   degli ordini).
# - Il cuore a 5 è `campana-coro-la-capoturno`: la memoria di chi comandava il turno, nello stallo alto. Vie: lo
#   scontro, il nome del Forno (Difficile), il leggio (Tecnologia, Difficile), il Comando (Magia, Difficile). Chi
#   vince prende la verga della Capoturno con la formula del Rintocco (campana.formula), un nucleo raro e un segreto,
#   e scende alla camera del batacchio (campana.strato 3). Chi perde torna in Superficie e lo strato è da rifare.
# - Misure: il nome del Forno (il bambino al tavolo, la Capoturno), il cielo del Sornione (la volta), il conto dei
#   Tamburi (il registro). Dono: Pannion (la lanterna nel corridoio dei turni). Origini: il Rampollo (le prime file, lo
#   stallo alto, con un'opzione), l'Allievo di Torvessa (la tazza, la volta con un'opzione, la Capoturno).
# - La questione aperta resta aperta: gli operatori contano all'indietro da molto prima, guardano il cielo, mandano la
#   gente sotto; la Marea è più fitta dove il suono batteva più forte, e le crepe partono dalla parete della Campana.
aree:
  - id: campana-coro
    immagine: ambientazione/marea-grigia
    nome: Il coro
    sommario: "La sala degli operatori della Campana, con gli stalli in file rivolti verso una parete nera."
    spedizione: { ritorno: superficie-fratturata, soglia: 5, stanze: 3 }
    testo: |
      In fondo alla foresta di canne una scala a chiocciola di metallo nero scende nella roccia e sbuca in una
      sala lunga e bassa, con il soffitto a volta. Sulla scala i tuoi passi suonano fino all'ultimo gradino, e
      quando posi il piede sul pavimento della sala non li senti più. Gli stalli sono disposti in file rivolte
      alla parete di fondo, come il coro di una chiesa. Sono dello stesso metallo della scala e non hanno una
      saldatura o un chiodo, e ogni sedile è lucido nel punto dove si appoggiava la schiena.

      Fra le file ristagna la Marea Grigia. Dove è più densa prende la forma di persone sedute ai loro posti,
      che girano la testa verso la parete e alzano le mani tutte insieme. Quando le riabbassano la Marea
      intorno si increspa appena e torna liscia.

# La musica dello strato (come le altre aree in contenuti/audio.yaml).
colonna:
  - { contesto: area, id: campana-coro, musica: our-wounds-our-crown, ambiente: astral-plane }

storylet:
  # ------------------------------------------------------------ 0 · le prime file
  - id: campana-coro-le-prime-file
    immagine: ambientazione/marea-grigia
    titolo: Le prime file
    sommario: "Le file di stalli più vicine alla scala sono quasi tutte occupate da figure di Marea."
    luogo: Il coro, le prime file
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 0]
    testo: |
      Gli stalli sono di metallo nero con lo schienale alto e i braccioli lisci, e la Marea che ci ristagna
      intorno non ha lasciato un segno di ruggine. In quasi ogni stallo siede una figura di Marea Grigia con
      le mani sui braccioli. Ogni tanto una si raddrizza e gira la testa verso la parete, poi torna giù senza
      un suono. Su uno stallo vuoto c'è una coperta piegata, di lana grossa che lungo le pieghe si è fatta
      dura e scolorita.

      {percezione Difficile} Le figure si raddrizzano sempre nello stesso ordine, dalla fila in fondo a quella
      davanti. Quella notte una notizia è passata di bocca in bocca.

      {origine rampollo-dei-quartieri-alti} Gli stalli davanti hanno i braccioli più larghi. Anche quaggiù i
      posti buoni stavano davanti.

      Per arrivare alla scaletta devi passare fra due figure sedute così vicine che ti sfiorerebbero le
      ginocchia. Da un palmo di distanza senti il freddo che mandano, e quando si muovono la Marea intorno
      alle loro caviglie non si increspa.
    opzioni:
      - testo: "Passare fra le figure senza toccarle"
        descrizione: "Di fianco, in punta di piedi, con le braccia strette al corpo."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Di fianco
          testo: |
            Ti metti di fianco e passi un piede alla volta, con le braccia strette al petto e la schiena
            contro lo schienale della fila davanti. Il metallo è freddo attraverso la giubba. A metà una delle
            due figure si raddrizza e gira la testa, e la sua faccia grigia ti passa a un palmo dal naso senza
            vederti. Da così vicino vedi che ha le labbra socchiuse e ferme su una parola lasciata a metà. Poi
            torna giù, e tu arrivi alla scaletta con le gambe rigide.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Il ginocchio
          testo: |
            Il tuo ginocchio sfiora quello della figura seduta, e il freddo ti entra nella gamba fino
            all'anca. La figura non si volta. A un tratto ti sembra di essere sedut{o|a} al suo posto, con le
            mani sui braccioli e la parete davanti, e con una notizia che arriva dalla fila dietro e si
            avvicina a ogni fila. Torni indietro zoppicando, con la gamba grigia fino al ginocchio e la pelle
            che non senti più sotto le dita.
          effetti: { contaminazione: 1 }
      - testo: "Sederti in uno stallo vuoto e aspettare il loro turno"
        descrizione: "Quando si raddrizzano guardano tutte la parete. Se aspetti quel momento, nessuno guarda te."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Molto difficile }
        successo:
          titolo: Quando si raddrizzano
          testo: |
            Ti siedi accanto alla coperta piegata e aspetti, con le mani sulle ginocchia per tenerle ferme. Il
            sedile è liscio e incavato al centro, dove qualcuno si è seduto per anni sempre nello stesso modo.
            La notizia arriva dalla fila in fondo e le figure si raddrizzano una dopo l'altra. Quando tocca
            alle due della tua fila ti alzi e passi in mezzo a loro mentre guardano la parete.
          pe: { resilienza: 3 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: La notizia
          testo: |
            Aspetti troppo. Quando la notizia arriva alla tua fila ti raddrizzi anche tu e giri la testa verso
            la parete insieme alle altre, e non sai più perché ti sei sedut{o|a}. Molto più tardi ti scuote il
            freddo della coperta sotto la mano. La lana è umida e rigida come una cosa rimasta in cantina. Ti
            alzi con la testa piena di una paura che non è tua e con il collo indolenzito dalla parte della
            parete.
          effetti: { tormento: 1 }
      - testo: "Attraversare la fila facendoti largo"
        descrizione: "Le figure non pesano niente. Il freddo che lasciano, invece, resta addosso."
        costo: 2
        esito:
          titolo: In mezzo a loro
          testo: |
            Passi in mezzo alle figure con le braccia avanti, e le figure si sfanno al tuo passaggio e si
            ricompongono dietro di te come fumo. A ogni spalla che tocchi ti entra un pezzo di qualcun altro.
            Da una prendi una fretta che non sai dove portare, e da un'altra un nome detto a voce bassa e un
            gusto di sale. Arrivi alla scaletta con le dita grigie fino alle nocche e la testa che ronza, e
            dietro di te le figure sono di nuovo sedute con le mani sui braccioli.
          effetti: { profondita.campana-coro: 1, contaminazione: 1, tormento: 1 }

  # ------------------------------------------------------------ 0 · la porta di sotto
  - id: campana-coro-la-porta-di-sotto
    immagine: icone/door
    titolo: La porta di sotto
    sommario: "Sul fianco della sala c'è una porta bassa con i gradini che scendono."
    luogo: Il coro, la porta di sotto
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 0]
    testo: |
      Sul fianco sinistro della sala, fra due colonne, una porta bassa dà su gradini che scendono nella
      roccia. È così bassa che chi entra deve chinare la testa, e le figure la chinano tutte nello stesso
      punto. Davanti la Marea Grigia ha preso la forma di una lunga fila di persone con i fagotti e i bambini
      in braccio. Due figure con le maniche strette degli operatori la spingono verso i gradini.

      {empatia Difficile} Spingono senza cattiveria, come si porta via la gente da una casa che brucia, e uno
      dei due continua a voltarsi verso la sala.

      Sui gradini la Marea scende in un velo sottile e la fila ci entra senza rallentare. Da laggiù non risale
      nessun rumore di passi. La strada verso il fondo del coro passa davanti alla porta.
    opzioni:
      - testo: "Farti largo fra gli operatori"
        descrizione: "Due figure di Marea con le maniche strette, e una voce che ti cerca dentro la testa."
        combattimento: campana-gli-operatori
        vittoria:
          titolo: La fila che ricomincia
          testo: |
            Le due figure si sfanno sotto i colpi e restano a terra come due pozze grigie, e la fila si ferma.
            La gente di Marea resta con i fagotti a mezz'aria e i bambini fermi in braccio. Poi le pozze si
            alzano di nuovo più basse di prima e tornano a spingere la gente verso i gradini. Passi davanti
            alla porta prima che si accorgano di te un'altra volta, e alle tue spalle la fila riprende a
            scendere.
          effetti: { profondita.campana-coro: 1 }
        sconfitta:
          titolo: Giù con gli altri
          testo: |
            Le due figure ti prendono per le spalle e ti spingono nella fila, e la fila ti porta giù per i
            gradini insieme ai fagotti e ai bambini di Marea. I gradini sono lisci e bagnati, e sotto le suole
            non ne senti mai il bordo. Ti fermi dieci gradini più sotto con la schiena contro la roccia e la
            Marea fino alle ginocchia. Più in basso la fila continua a scendere, e tu risali carponi senza
            guardare dove va.
          effetti: { contaminazione: 0.5 }
      - testo: "Metterti in fila con gli altri"
        descrizione: "Gli operatori spingono chi è in fila verso i gradini. Chi sta attento al momento giusto passa oltre la porta."
        prova: { attributo: mentale, abilita: [resilienza, empatia], difficolta: Difficile }
        successo:
          titolo: Una spinta
          testo: |
            Ti metti in coda dietro una donna di Marea con un fagotto più grande di lei, e cammini al suo
            passo corto. Quando arrivi alla porta una mano grigia ti preme fra le scapole con decisione quasi
            gentile, e il freddo ti passa attraverso la giubba. Tu fai un passo di lato invece di scendere.
            L'operatore si volta verso la sala e non ti guarda più.
          pe: { empatia: 3 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: I gradini
          testo: |
            La mano grigia ti spinge più forte di quanto ti aspetti, e i piedi vanno giù per i gradini prima
            che tu possa decidere. Ti fermi contro la roccia nella Marea fino alla cintura, con le braccia
            strette al petto come se tenessi un fagotto anche tu. Ci metti un pezzo a ricordarti che non stai
            scappando da niente.
          effetti: { contaminazione: 1 }
      - testo: "Girare dietro le colonne, dentro la Marea fitta"
        descrizione: "Dietro le colonne nessuno spinge, perché la Marea è così densa che non ci si vede."
        costo: 3
        esito:
          titolo: Dietro le colonne
          testo: |
            Dietro le colonne la Marea è densa come latte, e ci cammini dentro fino al petto a tentoni, con la
            mano sinistra sulla pietra. La colonna sotto le dita è liscia e senza una giuntura per tutto il
            giro. Ne esci dall'altra parte della porta con i vestiti grigi fino al collo e una gamba che ha
            battuto contro uno spigolo e non ti ha avvisato.
          effetti: { profondita.campana-coro: 1, ferite: 0.5, contaminazione: 1 }

  # ------------------------------------------------------------ 1 · il bambino al tavolo
  - id: campana-coro-il-bambino-al-tavolo
    immagine: icone/spinning-top
    titolo: Il bambino al tavolo
    sommario: "A metà del coro, fra due file di stalli, c'è un tavolo piccolo con una sedia."
    luogo: Il coro, il tavolo del bambino
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 1]
    testo: |
      A metà del coro le file si aprono intorno a un tavolo piccolo, con il piano di metallo nero e una sedia
      sola. Ci siede un bambino di Marea Grigia che fa girare una trottola di metallo nero e la rilancia con
      due dita quando rallenta. La trottola ronza sul piano con una nota sottile, e intorno al tavolo la Marea
      si è ritirata in un cerchio pulito. Ogni volta che lo guardi ha un'altra faccia. Adesso ha le
      lentiggini, e un momento dopo è magra con le orecchie a sventola.

      {resilienza Difficile} È il bambino dei sogni del Forno della Nonna, e qui sei svegli{o|a}.

      Per proseguire devi passargli accanto, e quando ti avvicini la trottola cambia suono. La nota si abbassa
      a ogni tuo passo, e quando ti fermi non torna su.
    opzioni:
      - testo: "Dirgli il nome di Nan'Ireth"
        descrizione: "Al Forno della Nonna hai preso il nome con cui un'operatrice si faceva riconoscere dalle macchine."
        requisiti: [misura.forno >= 1]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: Un nome di casa
          testo: |
            Lo dici piano, chinat{o|a} sul tavolo, con le tre sillabe nell'ordine che hai sentito al Forno. Il
            bambino ferma la trottola con il palmo e alza la testa, nello stesso modo in cui si alza la testa
            a un nome di casa. Per la prima volta la faccia gli resta uguale mentre lo guardi. Poi indica il
            fondo del coro con il mento e torna alla sua trottola, e la nota torna sottile.
          pe: { empatia: 5 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Il nome storto
          testo: |
            Il nome ti esce storto, con l'accento nel posto sbagliato. Il bambino lascia cadere la trottola,
            che rotola sotto il tavolo e lì continua a girare su un fianco, e la Marea delle file intorno si
            stringe verso di te. Ti ritiri con le mani gelate fino ai polsi e la sensazione di aver chiamato
            qualcuno che non doveva sentirsi chiamare così.
          effetti: { tormento: 1, contaminazione: 0.5 }
      - testo: "Rilanciare la trottola quando rallenta"
        descrizione: "Due dita sul gambo, al momento giusto. La trottola è piccola e gira storta."
        prova: { attributo: fisico, abilita: [acrobazia, rissa], difficolta: Difficile }
        successo:
          titolo: Il colpo di dita
          testo: |
            Aspetti che la trottola cominci a ondeggiare e la rilanci con due dita, prima di lui. Il metallo è
            freddo e pesa più di quanto dica la sua misura, e la trottola riparte dritta con una nota pulita.
            Il bambino ti guarda con una faccia nuova e stupita, e si fa da parte con la sedia per lasciarti
            passare, come si fa con chi ha vinto il turno.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Il gambo
          testo: |
            Il gambo della trottola è affilato come una lama, e ti apre il polpastrello. Il sangue cade sul
            tavolo e diventa grigio prima di fermarsi, e sul metallo le gocce non si allargano. Il bambino ti
            guarda succhiarti il dito, con una faccia che non ti è mai piaciuta, e la trottola continua a
            girare da sola senza rallentare.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Passare oltre senza guardarlo in faccia"
        descrizione: "Se non lo guardi non cambia faccia. Gli occhi però vanno dove vogliono."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Molto difficile }
        successo:
          titolo: Gli occhi bassi
          testo: |
            Tieni gli occhi sulle tue scarpe e conti i passi, e passi accanto al tavolo sentendo la trottola
            girare all'altezza del gomito. Il ronzio ti passa vicino all'orecchio e poi alle spalle, e lui non
            ti ferma. Quando ti volti dieci passi più avanti la trottola gira ancora sul piano, e la sedia è
            vuota.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Una faccia di troppo
          testo: |
            A metà strada gli occhi si alzano da soli, e il bambino ha la tua faccia com'era a quell'età.
            Torni indietro fino alla fila di prima senza ricordarti di averlo deciso, e la nota della trottola
            ti segue per tutto il tratto.
          effetti: { tormento: 1 }
      - testo: "Tirare dritto, con gli occhi bassi e le mani in tasca"
        descrizione: "Il tavolo è in mezzo al passaggio, e lui è sempre lì. Lo superi e basta, e la testa paga dopo."
        costo: 2
        esito:
          titolo: La trottola dietro le spalle
          testo: |
            Gli passi accanto senza fermarti, con le mani in tasca, e la trottola cambia suono a ogni tuo
            passo fino a fare il suono di una campana piccola. Il suono ti segue per tutta la fila dopo, e lo
            senti sempre dallo stesso lato anche quando ti giri. Quando smette ti lascia nella testa un vuoto
            grigio dove prima c'era qualcosa che sapevi.
          effetti: { profondita.campana-coro: 1, tormento: 1, contaminazione: 1 }

  # ------------------------------------------------------------ 1 · la tazza sul bracciolo
  - id: campana-coro-la-tazza
    immagine: icone/coffee-mug
    titolo: La tazza sul bracciolo
    sommario: "Uno stallo più grande degli altri ha un ripiano con nove vetri spenti."
    luogo: Il coro, lo stallo del ripiano
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 1]
    testo: |
      Uno stallo più grande degli altri ha davanti un ripiano di metallo nero con una fila di vetri spenti e
      piccole leve. Sul ripiano non c'è un granello di polvere, e le leve stanno dritte nelle loro scanalature
      senza un filo di ruggine. Su un bracciolo c'è una tazza di terracotta con il manico riattaccato e un
      fondo grigio e secco. La colla del manico si è ritirata e lascia vedere la frattura.

      Sugli schienali sopra di te corre un ragno-sacrificale della Salvaguardia con quattro braccia e la
      maschera bianca senza bocca. Passa da uno stallo all'altro senza toccare mai i sedili, e gli innesti
      delle braccia ticchettano sul metallo a ogni appoggio.

      {tecnologia Difficile} I vetri sono nove indicatori, e solo l'ultimo ha ancora una piccola luce rossa.

      {origine allievo-di-torvessa} Orvald Temmerin direbbe che il ripiano serviva a guardare e le leve sono
      venute dopo. La volta seguente direbbe il contrario.

      {mezzanotte} La tazza sul bracciolo è tiepida anche se il fondo è secco. Sul manico, nella polvere, c'è
      l'impronta fresca di un pollice piccolo come quello di un bambino.
    opzioni:
      - testo: "Aspettare che il ragno scenda, e affrontarlo"
        descrizione: "Quattro braccia e una maschera senza bocca. È svelto, e sugli schienali è a casa sua."
        combattimento: campana-il-ragno-del-coro
        vittoria:
          titolo: Il ragno fra i sedili
          testo: |
            Il ragno scende dagli schienali e finisce incastrato fra due sedili, con le braccia piegate al
            contrario e la maschera che ticchetta. Le giunture sono di un metallo chiaro senza segni d'usura,
            e cedono una alla volta con uno schiocco secco. Smette di muoversi solo quando gli spezzi
            l'ultima. La tazza, sul bracciolo, non si è mossa di un dito.
          effetti: { profondita.campana-coro: 1 }
        sconfitta:
          titolo: Dall'alto
          testo: |
            Il ragno ti cade addosso dagli schienali e ti inchioda fra due stalli, con la maschera bianca
            contro la faccia. La maschera è liscia e fredda, e dove dovrebbe esserci la bocca senti sotto la
            guancia una vibrazione leggera e continua. Quando ti lascia andare sei di nuovo vicin{o|a} alla
            scala, e non sai chi ti ci abbia trascinato.
          effetti: { contaminazione: 0.5 }
      - testo: "Spegnere l'ultima luce del ripiano"
        descrizione: "Una luce sola è rimasta accesa, e il ragno gira sempre intorno a quello stallo. Forse le due cose si tengono."
        inquieta: "Una luce sola è rimasta accesa, e il ragno gira sempre intorno a quello stallo. Forse le due cose si tengono, e la luce, quando ti avvicini, si fa un poco più forte."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: La luce rossa
          testo: |
            Trovi la leva sotto il nono vetro e la abbassi piano con il pollice finché non senti lo scatto
            nella guida. La luce rossa si spegne, e sopra di te il ragno si ferma a metà passo e si accuccia
            su uno schienale con le braccia raccolte. Gli innesti smettono di ticchettare. Sul ripiano dietro
            la leva c'è un piccolo cilindro di cristallo che ti metti in tasca, ed è più freddo del metallo
            intorno.
          pe: { tecnologia: 3 }
          effetti: { profondita.campana-coro: 1, parte.camera-2: 1 }
        fallimento:
          titolo: La leva sbagliata
          testo: |
            La leva che abbassi accende tutti e nove i vetri insieme. Il ragno scende dagli schienali con un
            salto solo e ti apre la spalla con un innesto prima che tu riesca a ripararti dietro lo stallo. Da
            lì lo senti camminare avanti e indietro sopra la tua testa finché i vetri non si spengono.
          effetti: { ferite: 1 }
      - testo: "Passare carponi sotto il ripiano"
        descrizione: "Sotto il ripiano c'è un varco basso, pieno di Marea. Il ragno guarda in alto, non in basso."
        inquieta: "Sotto il ripiano c'è un varco basso, pieno di Marea. Il ragno guarda in alto, e ogni tanto la maschera senza bocca si gira verso le tue ginocchia."
        costo: 3
        esito:
          titolo: Carponi
          testo: |
            Ti metti carponi e passi sotto il ripiano, dentro la Marea che lì sotto è ferma da secoli e si è
            fatta spessa come colla. Sopra la testa senti il ticchettio del ragno che va avanti e indietro
            sugli schienali, e non si ferma mai sopra di te. Ne esci dall'altra parte con le mani grigie fino
            ai gomiti e un taglio sul palmo, lasciato da un vetro caduto che non avevi visto.
          effetti: { profondita.campana-coro: 1, ferite: 1, contaminazione: 0.5 }

  # ------------------------------------------------------------ 1-3 · le mani sulle orecchie
  - id: campana-coro-le-mani-sulle-orecchie
    immagine: icone/screaming
    titolo: Le mani sulle orecchie
    sommario: "In un angolo del coro la Marea è così fitta che arriva al petto."
    luogo: Il coro, l'angolo verso la Campana
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro >= 1, profondita.campana-coro <= 3]
    testo: |
      Nell'angolo dove le file finiscono contro la roccia la Marea Grigia è così fitta che ti arriverebbe al
      petto. Qui un paio di stalli hanno lo schienale piegato all'indietro, e il metallo nero si è aperto
      lungo la piega in una fessura dai bordi lucidi. In mezzo c'è un operatore di Marea accucciato, con le
      mani premute sulle orecchie e la fronte contro le ginocchia. Ogni tanto tutto il suo corpo sobbalza per
      un colpo che sente soltanto lui.

      {natura Difficile} L'angolo guarda dritto verso la camera della Campana, e la Marea si è addensata dove
      il suono batteva più forte.

      La roccia della parete è piena di schegge di cristallo, e tutte sporgono dalla stessa parte. Di lì passa
      la via più corta verso il fondo del coro.
    opzioni:
      - testo: "Attraversare la Marea fitta dell'angolo"
        descrizione: "Una decina di passi dentro la Marea più densa che tu abbia mai visto. Il corpo deve reggere fino in fondo."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Dieci passi
          testo: |
            Entri nella Marea con i denti stretti e la attraversi contando i passi a mezza voce, con il freddo
            che sale dalle gambe al petto. È così densa che a ogni passo devi spingerla con le cosce. Passi
            accanto all'operatore accucciato, che sobbalza proprio mentre gli sei vicin{o|a}, e senti il colpo
            anche tu nelle ossa come un'eco lontana. I denti ti battono insieme una volta sola. Esci
            dall'altra parte tremando, ma in piedi.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: A metà
          testo: |
            A metà le gambe smettono di sentire il pavimento e ti ritrovi in ginocchio nella Marea, accanto
            all'operatore, con le mani sulle orecchie come lui. Da lì il colpo lo senti anche tu, e arriva
            sempre dallo stesso lato. Torni indietro a forza di braccia, e la pelle delle mani resta grigia
            per tutto il giorno.
          effetti: { contaminazione: 1 }
      - testo: "Toccare la spalla dell'operatore"
        descrizione: "È l'unica figura del coro che non fa quello che fanno gli altri. Forse si accorge di te."
        prova: { attributo: sociale, abilita: empatia, difficolta: Molto difficile }
        successo:
          titolo: Il segno
          testo: |
            Gli posi la mano sulla spalla, e la spalla è fredda e vera sotto le dita fino alla cucitura della
            manica stretta. L'operatore alza la testa senza togliere le mani dalle orecchie e ti guarda con
            gli occhi spalancati e fermi. Con il gomito ti indica un passaggio fra la roccia e l'ultimo
            stallo, dove la Marea è bassa. Poi torna a nascondere la faccia.
          pe: { empatia: 5 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Il colpo
          testo: |
            Quando lo tocchi il colpo che sente lui arriva intero anche a te, e ti spacca la testa dalla nuca
            agli occhi. È una nota sola e così bassa che ti vibra nei denti. Ti ritrovi sedut{o|a} sul
            pavimento, lontano dall'angolo, con un fischio che non se ne va.
          effetti: { tormento: 1 }
      - testo: "Girare largo, lungo la roccia"
        descrizione: "Lungo la parete di roccia la Marea è più bassa. La roccia, in compenso, è piena di schegge di cristallo."
        costo: 2
        esito:
          titolo: Lungo la roccia
          testo: |
            Giri l'angolo con la schiena contro la roccia, dove la Marea arriva solo alle caviglie, e le
            schegge di cristallo nella pietra ti tagliano la giubba e la pelle sotto. Le schegge vibrano
            appena contro la schiena ogni volta che l'operatore sobbalza, e ogni volta ti sobbalza il cuore.
            Alla fine ti fanno male le mani a forza di stringere.
          effetti: { profondita.campana-coro: 1, ferite: 1, contaminazione: 0.5 }

  # ------------------------------------------------------------ 2 · la volta
  - id: campana-coro-la-volta
    immagine: icone/night-sky
    titolo: La volta
    sommario: "In questo punto il soffitto del coro si alza in una cupola di vetro scuro piena di stelle."
    luogo: Il coro, sotto la cupola
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 2]
    testo: |
      Qui la volta si alza in una cupola di vetro scuro con dentro punti di luce disposti come le stelle
      d'estate. Il vetro è di un pezzo solo, e da un bordo all'altro non vedi una saldatura. La cupola gira
      piano e te ne accorgi solo dalle stelle vicino al bordo, che scivolano dietro la cornice e riemergono
      dall'altra parte. Non senti nessun rumore di ingranaggi, e sotto le suole il pavimento è fermo. Fra due
      stalli, alla base della cupola, c'è una ruota di metallo nero con le razze consumate dalle mani.

      Sotto la cupola le figure di Marea stanno fra gli stalli con la faccia all'insù, e una tende il braccio
      verso un punto preciso del vetro.

      {percezione Media} Il braccio punta sempre allo stesso posto anche mentre la cupola gira, e lì adesso
      c'è soltanto vetro scuro.
    opzioni:
      - testo: "Fermare la cupola sull'ora delle due stelle"
        descrizione: "Al Sornione hai visto il cielo della notte del suono, con le due stelle che oggi mancano."
        requisiti: [misura.sornione >= 1]
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Difficile }
        successo:
          titolo: L'ora del suono
          testo: |
            Giri la ruota finché sopra di te non c'è il cielo che hai visto al Sornione. Le due stelle si
            accendono nel vetro, la grande bianca bassa sopra il nord-est e la piccola rossa due dita più in
            alto, sull'ultima ora prima dell'alba. Le figure abbassano la testa tutte insieme e corrono ai
            loro stalli, e mentre corrono le due stelle si spengono una dopo l'altra. Al loro posto torna il
            vetro scuro. Fra gli stalli vuoti resta una corsia libera, e la prendi.
          pe: { accademiche: 5 }
          effetti: { profondita.campana-coro: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il cielo sbagliato
          testo: |
            La ruota ti scappa di mano e la cupola gira troppo, e in un momento sopra di te scorrono cielo
            dopo cielo, troppe notti per contarle. Le figure gridano senza voce con la bocca spalancata verso
            il vetro. Ti ritrovi in ginocchio con le mani sugli occhi e un gusto di ferro in bocca, e la ruota
            gira ancora da sola finché non rallenta.
          effetti: { tormento: 1, contaminazione: 0.5 }
      - testo: "Seguire il braccio teso"
        descrizione: "La figura indica sempre lo stesso punto. Sotto quel punto, sul pavimento, ci sarà pure qualcosa."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Molto difficile }
        successo:
          titolo: La pietra consumata
          testo: |
            Tracci con gli occhi la linea dal braccio al soffitto e poi giù, fino al pavimento. Lì la pietra è
            consumata da un sentiero di passi largo una spalla e profondo un dito, che solo anni di
            andirivieni scavano in una pietra così dura. Il sentiero va verso il fondo del coro passando fra
            gli stalli dove la Marea è più bassa.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: In su
          testo: |
            Guardi in su troppo a lungo, e quando riabbassi gli occhi ti accorgi che hai ancora la faccia
            all'insù come le figure, e non sai da quanto. Intorno alle tue caviglie la Marea si è raccolta in
            un anello fermo, uguale a quello che hanno loro. Il collo ti fa male per ore.
          effetti: { tormento: 1 }
      - testo: "Passare sotto la cupola a testa bassa"
        descrizione: "Le figure guardano in alto. Tu guarda in basso, e cammina."
        costo: 2
        esito:
          titolo: A testa bassa
          testo: |
            Attraversi lo spazio sotto la cupola con gli occhi sui piedi, in mezzo alle figure in piedi, e le
            urti con le spalle perché nessuna si sposta. A ogni urto la figura ondeggia e torna dritta con la
            faccia rivolta allo stesso punto del vetro. Dall'altra parte ti accorgi che stai ancora tenendo la
            testa piegata, e che non riesci a raddrizzarla del tutto.
          effetti: { profondita.campana-coro: 1, tormento: 1, contaminazione: 1 }
      - testo: "Leggere la cupola come gli astrolabi dell'Accademia"
        descrizione: "All'Accademia di Torvessa ci sono strumenti che fanno girare il cielo. Questo è più grande, ma la regola dovrebbe essere la stessa."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Difficile }
        successo:
          titolo: Il polo
          testo: |
            Cerchi il punto intorno a cui gira tutto, il polo della cupola, e lo trovi in una stella fioca che
            resta ferma mentre le altre le girano intorno. Da lì conti le stelle fino al punto indicato dal
            braccio. Sul pavimento, sotto quel punto, la pietra è consumata da un sentiero di passi che va
            verso il fondo del coro. Orvald Temmerin sarebbe contento, e poi ti chiederebbe perché.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Il polo che scappa
          testo: |
            Il polo non sta fermo come negli strumenti dell'Accademia, e ogni volta che credi di averlo
            trovato scivola di qualche grado verso il bordo. Ti gira la testa, e la Marea intorno alle
            caviglie sale un poco mentre conti. Quando abbassi gli occhi ti copre già le stringhe.
          effetti: { tormento: 0.5, contaminazione: 0.5 }

  # ------------------------------------------------------------ 2 · il corridoio dei turni
  - id: campana-coro-il-corridoio-dei-turni
    immagine: icone/old-lantern
    titolo: Il corridoio dei turni
    sommario: "Un corridoio stretto dietro gli stalli, dove gli operatori si davano il cambio."
    luogo: Il coro, il corridoio dei turni
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 2]
    testo: |
      Dietro le ultime file corre un corridoio stretto, con i ganci alle pareti e qualche mantello grigio
      ancora appeso. I ganci sono di metallo nero e lucidi come appena fusi, e i mantelli che reggono hanno
      l'orlo sfilacciato e le spalle mangiate dalla muffa. Era il passaggio dei turni, e la Marea lo riempie
      di figure che arrivano da una parte e smontano dall'altra. Si scansano fra loro con pazienza, e a te non
      lasciano spazio. Nel pavimento corrono due solchi paralleli, uno per chi andava e uno per chi tornava.

      {conoscenze-della-strada Difficile} Un cambio turno ha sempre un orario morto fra chi esce e chi arriva.
      Il guaio è che qui l'orario è fermo alla notte del suono.

      In fondo al corridoio una lanterna vuota pende da un gancio sopra la porta.
    opzioni:
      - testo: "Accendere una lanterna alla maniera di Pannion"
        descrizione: "A Pannion le lanterne sui pontili guidano a casa gli spiriti della foresta. Qui di spiriti ce ne sono, e una casa ce l'avevano."
        requisiti: [dono.pannion >= 1]
        prova: { attributo: mentale, abilita: [natura, resilienza], difficolta: Media }
        successo:
          titolo: La lanterna sul gancio
          testo: |
            Accendi lo stoppino e appendi la lanterna al primo gancio, alta, come le lanterne che a Pannion
            stanno sui pontili per guidare a casa gli spiriti. La fiamma sale dritta e gialla nell'aria ferma,
            e sul metallo dei ganci si accende una fila di riflessi. Le figure del corridoio si fermano e si
            voltano verso la luce una dopo l'altra, poi si mettono in fila sotto il gancio con la stessa
            pazienza di prima. Il corridoio dietro di loro è vuoto.
          pe: { natura: 3 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Lo stoppino
          testo: |
            Lo stoppino non prende nell'aria fredda della Marea, e a ogni tentativo la fiammella si piega
            verso il basso e si fa azzurra. Le figure più vicine si voltano a guardarla mentre muore. Quando
            muore del tutto tornano a passarti davanti, più fitte di prima.
          effetti: { tormento: 0.5 }
      - testo: "Aprirti la strada fra quelli del cambio"
        descrizione: "Due operatori di Marea si accorgono di te e smettono di andare e venire."
        combattimento: campana-gli-operatori
        vittoria:
          titolo: Il cambio saltato
          testo: |
            I due operatori si sfanno contro il muro, fra i mantelli appesi, e le altre figure si fermano per
            la prima volta da quando le guardi. Restano a metà del passo, con un piede alzato e il peso in
            avanti. Passi in mezzo a loro finché sono ferme, con i mantelli grigi che ti sfiorano le spalle e
            ti lasciano sulla giubba una polvere umida.
          effetti: { profondita.campana-coro: 1 }
        sconfitta:
          titolo: Fuori turno
          testo: |
            Gli operatori ti respingono fino alla fila di stalli, e la voce che usano ti resta nella testa a
            ripetere un orario che non capisci. Ha sempre le stesse sillabe e la stessa cadenza, e ti accorgi
            di muovere le labbra insieme a lei. Le figure del corridoio riprendono ad andare e venire.
          effetti: { tormento: 0.5 }
      - testo: "Aspettare l'orario morto"
        descrizione: "Prima o poi il corridoio resta vuoto per un momento. Bisogna esserci quando succede."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Molto difficile }
        successo:
          titolo: Il momento vuoto
          testo: |
            Ti appiattisci fra due mantelli appesi e aspetti, contando le figure che passano. La stoffa che ti
            tocca la faccia è umida e ti lascia il sale sulle labbra. Quando l'ultima di un turno svolta
            l'angolo e la prima dell'altro deve ancora comparire, il corridoio resta vuoto il tempo di dieci
            passi, e tu ne fai dodici.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Il turno dopo
          testo: |
            Esci un passo troppo presto, e ti trovi in mezzo al turno che arriva. Le figure ti passano
            attraverso una dopo l'altra, e ognuna ti lascia addosso un poco del suo freddo. Dopo la decima non
            senti più le dita, e nessuna di loro ha rallentato.
          effetti: { contaminazione: 1 }
      - testo: "Passare in mezzo a loro, spalla contro spalla"
        descrizione: "Il corridoio è stretto e le figure non si fermano. Prendi la tua parte di freddo e vai avanti."
        costo: 3
        esito:
          titolo: Spalla contro spalla
          testo: |
            Ti metti nel corridoio con il turno che smonta e cammini con loro, spalla contro spalla, al loro
            passo lento. Dopo pochi passi i tuoi piedi trovano da soli il solco del pavimento. Arrivi in fondo
            con le braccia grigie e la testa piena di un'unica voglia, quella di andare a dormire in un letto
            che non hai mai visto.
          effetti: { profondita.campana-coro: 1, contaminazione: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 3 · il registro dei colpi
  - id: campana-coro-il-registro-dei-colpi
    immagine: icone/abacus
    titolo: Il registro dei colpi
    sommario: "Su una parete laterale del coro corrono colonne di segni incisi, fitte come le righe di un libro di conti."
    luogo: Il coro, la parete del registro
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 3]
    testo: |
      Lungo una parete laterale corrono colonne di segni incisi nella pietra nera per tutta la lunghezza del
      coro. Ogni colonna comincia con un segno largo e prosegue con segni sempre più piccoli, e ognuna è più
      corta della precedente. I segni delle prime colonne hanno i bordi smussati e lucidi, e quelli delle
      ultime sono ancora taglienti. Davanti all'ultima una figura di Marea incide segni nuovi con un
      punteruolo. Il punteruolo morde la pietra con un raschio secco, e quando la figura lo stacca nel solco
      non resta polvere.

      {tecnologia Difficile} I segni sono un conto che scende e riparte da capo a ogni colonna, e qualcuno lo
      teneva da molto prima della notte del suono.
    opzioni:
      - testo: "Confrontare l'ultima colonna con il conto dei Tamburi"
        descrizione: "Sotto la Palude Acquanera hai copiato il conto dei colpi che restano, e da allora ne togli tre ogni notte."
        requisiti: [misura.tamburi >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Difficile }
        successo:
          titolo: Lo stesso numero
          testo: |
            Conti i segni dell'ultima colonna dal fondo, con il dito sulla pietra, e arrivi al conto copiato
            ai Tamburi, meno i colpi delle notti passate. È lo stesso. Sotto il polpastrello gli ultimi solchi
            hanno i bordi vivi e tagliano un poco. La figura incide il segno successivo, e per la prima volta
            il conto della parete e quello della palude non sono più un ricordo. La figura abbassa il
            punteruolo e si fa da parte, e dietro di lei la parete ha una porta stretta.
          pe: { tecnologia: 5 }
          effetti: { profondita.campana-coro: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il conto che scappa
          testo: |
            Perdi il conto due volte, e la seconda la figura gira il punteruolo verso di te. Ti incide sul
            dorso della mano un segno piccolo e netto prima che tu riesca a ritirarla, e il segno resta
            grigio. Quando lo guardi da vicino vedi che ha la forma esatta dell'ultimo segno della colonna.
          effetti: { tormento: 1, contaminazione: 0.5 }
      - testo: "Leggere le colonne dall'inizio"
        descrizione: "Tutte le colonne, dalla prima. Un registro tenuto così a lungo dice anche quando è cominciato."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Molto difficile }
        successo:
          titolo: La prima colonna
          testo: |
            Risali le colonne fino alla prima, quella vicino alla scala, che ha un segno largo inciso da una
            mano diversa da tutte le altre. Il solco è più profondo e più regolare, e i bordi sono lisci come
            quelli di un gradino. Qualcuno ha cominciato a contare molto prima di chiunque fosse seduto nel
            coro quella notte. In fondo alla parete trovi la porta stretta da cui passava chi teneva il
            registro.
          pe: { accademiche: 5 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Colonne
          testo: |
            Le colonne ti si confondono davanti agli occhi, e a un certo punto ti accorgi che stai contando
            all'indietro ad alta voce. Il numero a cui sei arrivato non ricordi di averlo mai saputo. La
            figura con il punteruolo si è girata ad ascoltarti.
          effetti: { tormento: 1 }
      - testo: "Passare dietro la figura che incide"
        descrizione: "È tutta presa dal suo conto. Basta passarle alle spalle senza farle sbagliare un segno."
        costo: 2
        esito:
          titolo: Alle sue spalle
          testo: |
            Le passi alle spalle mentre incide, così vicino che senti il raschio del punteruolo nei denti e
            vedi la sua mano tremare a ogni colpo. Al segno successivo la figura si ferma, come se avesse
            perso il conto per colpa tua, e la Marea intorno a lei si gonfia e ti viene dietro per un tratto.
            Quando ti volti il punteruolo è ancora fermo sulla pietra.
          effetti: { profondita.campana-coro: 1, contaminazione: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · il bambino, di nuovo
  - id: campana-coro-il-bambino-di-nuovo
    immagine: icone/spinning-top
    titolo: Il bambino, di nuovo
    sommario: "Vicino alla parete di fondo il bambino di Marea è seduto a un altro tavolo."
    luogo: Il coro, il secondo tavolo
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 3]
    testo: |
      Quasi sotto la parete di fondo c'è un altro tavolo piccolo, e sulla sedia c'è di nuovo il bambino. Ha la
      trottola ferma davanti e la faccia di un ragazzo più grande, con la prima ombra di barba. Le ginocchia
      gli arrivano sotto il piano del tavolo, che per lui adesso è troppo basso, e sulla trottola c'è un velo
      di polvere. Sullo schienale accanto è accucciato un ragno-sacrificale della Salvaguardia con due braccia
      abbassate verso di lui, come una balia sopra una culla. Le altre due braccia stanno piantate sullo
      schienale, e gli innesti hanno lasciato nel metallo quattro graffi lucidi.

      {armi-da-mischia Media} Il ragno tiene le giunture scoperte e il peso sulla sinistra. Se scende,
      scenderà da quella parte.
    opzioni:
      - testo: "Togliere il ragno da sopra il bambino"
        descrizione: "Il ragno sorveglia il tavolo e non si muove da lì. Bisogna farlo scendere."
        combattimento: campana-il-ragno-del-coro
        vittoria:
          titolo: La culla vuota
          testo: |
            Il ragno scende dalla sinistra come previsto e cade fra gli stalli con la maschera spaccata. La
            maschera continua a ticchettare ancora un poco, sempre più piano. Il ragazzo non ha guardato lo
            scontro. Ha ripreso a far girare la trottola, e ha di nuovo la faccia di un bambino piccolo.
          effetti: { profondita.campana-coro: 1 }
        sconfitta:
          titolo: Le braccia del ragno
          testo: |
            Il ragno ti prende con due braccia e ti tiene sollevat{o|a} sopra il tavolo, a guardare il ragazzo
            che fa girare la trottola. Gli innesti ti stringono sotto le ascelle con la presa ferma e attenta
            di chi tiene in braccio un bambino. Ti tiene così finché non ti lascia cadere fra le file, e ti
            rialzi con la Marea nei vestiti.
          effetti: { contaminazione: 0.5 }
      - testo: "Sederti davanti a lui e aspettare"
        descrizione: "Al primo tavolo giocava. Qui sembra che aspetti qualcuno."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Difficile }
        successo:
          titolo: La trottola spinta
          testo: |
            Ti siedi per terra davanti al tavolo, con le ginocchia al mento, e aspetti. La Marea ti bagna i
            calzoni fino alle cosce. Dopo un tempo lungo il ragazzo spinge la trottola verso di te con un
            dito, e la trottola si ferma sul bordo del tavolo senza cadere. Il ragno sopra di lui ritira le
            braccia. Ti alzi piano, gli lasci la trottola sul tavolo e passi.
          pe: { empatia: 3 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Nessuno
          testo: |
            Aspetti, e lui guarda attraverso di te verso la scala, dove deve arrivare qualcuno che non sei tu.
            Ogni tanto si sporge un poco sulla sedia e poi torna dritto. Il ragno scende di un braccio, e te
            ne vai prima che scenda del tutto, con la testa piena di un'attesa che non ti appartiene.
          effetti: { tormento: 1 }
      - testo: "Passare dietro gli stalli, lontano dal tavolo"
        descrizione: "Dietro gli stalli c'è un passaggio stretto e buio. Il ragno lo vede lo stesso, ma è lontano dal bambino."
        costo: 3
        esito:
          titolo: Dietro gli stalli
          testo: |
            Passi dietro gli stalli piegat{o|a} in due, e il ragno ti segue dagli schienali senza mai lasciare
            il bambino. Lo senti spostarsi sopra di te a scatti, un innesto alla volta. A metà allunga un
            braccio e ti graffia la schiena, una volta sola, come per ricordarti dove sei. Arrivi in fondo con
            la camicia appiccicata alla pelle.
          effetti: { profondita.campana-coro: 1, ferite: 1, contaminazione: 0.5 }

  # ------------------------------------------------------------ 4 · la parete di fondo
  - id: campana-coro-la-parete-di-fondo
    immagine: icone/cracked-glass
    titolo: La parete di fondo
    sommario: "La parete verso cui guardano tutti gli stalli è una lastra nera con nove grate in cerchio."
    luogo: Il coro, la parete di fondo
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 4]
    testo: |
      La parete verso cui guardano gli stalli è una lastra di metallo nero alta come tre case, con nove grate
      rotonde disposte in cerchio. Non vedi una giuntura in tutta la lastra, e il metallo ha la stessa grana
      dal pavimento fino in cima. Dietro c'è la camera della Campana, e la senti vicina dalle suole, con un
      tremito lento che sale fino alle ginocchia e poi si ferma. Dalle grate cola lenta la Marea Grigia, e dal
      centro del cerchio partono crepe sottili come in un piatto colpito con il dorso di un cucchiaio. Verso
      il centro le crepe si allargano quanto un dito, e i loro bordi sono lucidi e taglienti.

      {accademiche Molto difficile} Le grate seguono l'ordine delle nove pietre dell'Anello del Camminatore.
      Da qui le misure entravano, o uscivano.

      Appoggi il palmo alla lastra fra due crepe, e il metallo non si scalda sotto la mano per quanto ce la
      tieni.
    opzioni:
      - testo: "Leggere da che parte cola la Marea"
        descrizione: "La Marea cola dalle grate e si allarga. Da qualche parte deve restare un passaggio asciutto."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: Il bordo asciutto
          testo: |
            Guardi la Marea allargarsi e capisci che cola sempre verso le file, mai verso il lato destro della
            parete, dove il pavimento sale di un dito. Cammini su quel dito di pietra asciutta fino in fondo,
            con la lastra crepata a un palmo dalla spalla. Il metallo ronza piano a ogni passo, e il ronzio ti
            resta nella clavicola anche dopo.
          pe: { natura: 3 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: La pozza
          testo: |
            Scegli il lato sbagliato, e la Marea ti arriva alle ginocchia prima che tu te ne accorga. È più
            fredda di quella delle file e sotto la superficie si muove in correnti lente che ti tirano verso
            la parete. Esci dalla pozza con le gambe grigie e una nota bassa nelle orecchie, quella che passa
            attraverso la lastra.
          effetti: { contaminazione: 1 }
      - testo: "Arrampicarti sulle crepe fino alla grata più alta"
        descrizione: "Le crepe offrono appigli, e la grata più alta è asciutta. Sono tre case di metallo liscio."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Molto difficile }
        successo:
          titolo: La grata alta
          testo: |
            Sali con le dita nelle crepe e le punte dei piedi sugli orli delle grate, e la lastra vibra sotto
            le mani a ogni appiglio. Dalla grata più alta vedi tutto il coro con le sue file di stalli, e da
            quassù le figure di Marea sono tutte girate verso di te. Una cornice di pietra porta allo stallo
            alto, e ci scendi sopra con le dita che tremano.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Lo scivolone
          testo: |
            Una crepa ti si chiude sulle dita come una bocca, e quando le liberi perdi l'appiglio. Scivoli
            lungo la lastra fino alla Marea, con i palmi aperti dagli orli delle grate. Quando guardi in su la
            crepa è di nuovo aperta.
          effetti: { ferite: 1 }
      - testo: "Passare sotto le grate, dentro la Marea che cola"
        descrizione: "È la strada più corta, ed è anche la più sporca. La Marea qui è fresca."
        costo: 3
        esito:
          titolo: Sotto le grate
          testo: |
            Passi sotto le nove grate con la testa bassa e la Marea densa e fredda che ti cola sulle spalle e
            sulla nuca. Ogni grata ha la sua nota, e le senti tutte e nove una dopo l'altra mentre passi,
            dalla più acuta alla più bassa. L'ultima ti arriva nello sterno. Dall'altra parte ti scrolli come
            un cane bagnato, e la Marea non viene via.
          effetti: { profondita.campana-coro: 1, contaminazione: 1.5, tormento: 0.5 }

  # ------------------------------------------------------------ 4 · lo stallo alto
  - id: campana-coro-lo-stallo-alto
    immagine: ambientazione/marea-grigia
    titolo: Lo stallo alto
    sommario: "In fondo al coro uno stallo più alto degli altri sta su una pedana, con un leggio davanti."
    luogo: Il coro, lo stallo alto
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 4]
    testo: |
      In fondo al coro uno stallo più alto degli altri sta su una pedana di tre gradini, con un leggio di
      metallo davanti. Il primo gradino è consumato al centro in una conca liscia, e gli altri due sono quasi
      intatti. Il piano del leggio è vuoto e lucido nei due punti dove qualcuno ci appoggiava le mani. Lo
      stallo è vuoto, eppure dalla pedana arriva una voce bassa di donna che dà ordini in una lingua che non
      conosci, e a ogni ordine le figure delle file si muovono insieme.

      {empatia Difficile} La voce ripete le stesse cose e si incrina sempre nello stesso punto. Chi parlava
      aveva paura e non voleva che gli altri lo sentissero.

      Fra un ordine e l'altro, dallo stallo vuoto, arriva il cigolio di un sedile su cui qualcuno si sposta.
    opzioni:
      - testo: "Salire sulla pedana e rispondere alla voce"
        descrizione: "Una voce che dà ordini si aspetta qualcuno che risponda. Nella lingua giusta sarebbe meglio, ma il tono conta."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Difficile }
        successo:
          titolo: Agli ordini
          testo: |
            Sali i tre gradini e rispondi a voce alta, con il tono svelto di un sottoposto che ha capito
            l'ordine e sta già andando. La voce si interrompe, e per tutto il coro le figure restano ferme a
            metà del gesto. Poi dice una parola sola diversa dalle altre, e le figure delle file davanti a te
            si fanno da parte, come per lasciar passare qualcuno del turno.
          pe: { persuasione: 3 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Fuori posto
          testo: |
            Rispondi, e la voce si ferma. Le figure delle file si girano tutte insieme verso la pedana dove
            stai tu, e per la prima volta nessuna guarda la parete. Ti scendono addosso con il freddo di cento
            spalle. Ti ritrovi ai piedi della pedana con la testa che ronza, e sopra di te la voce ha ripreso
            dall'ordine di prima.
          effetti: { tormento: 1, contaminazione: 0.5 }
      - testo: "Passare sotto la pedana mentre le figure si muovono"
        descrizione: "A ogni ordine le file si muovono insieme. In quel momento nessuna guarda in basso."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Molto difficile }
        successo:
          titolo: Fra un ordine e l'altro
          testo: |
            Aspetti un ordine, e mentre le file si muovono ti infili sotto la pedana, nello spazio fra i
            gradini e la parete. Lì sotto la Marea non arriva, e il metallo dei gradini ti porta nella schiena
            ogni parola della voce. Al secondo ordine sei già dall'altra parte, con la lastra crepata alle
            spalle e la voce che continua sopra di te.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: L'ordine sbagliato
          testo: |
            Ti muovi un ordine troppo tardi, e le figure si fermano proprio mentre sei in mezzo alla corsia.
            Ti passano attraverso una dopo l'altra per tornare ai loro posti. A ogni figura che passa la voce
            si fa più vicina, finché la senti dentro l'orecchio.
          effetti: { contaminazione: 1 }
      - testo: "Attraversare le file mentre si muovono"
        descrizione: "Le figure cambiano posto a ogni ordine. In mezzo al cambio ci si passa, e ci si prende quello che capita."
        costo: 2
        esito:
          titolo: In mezzo al cambio
          testo: |
            Ti butti nelle file al primo ordine e cammini contro corrente, mentre le figure ti scorrono
            intorno e attraverso. Una ti prende per il braccio e ti fa girare su te stess{o|a}, e un'altra ti
            spinge contro uno stallo con la forza di una porta sbattuta. Lo spigolo del bracciolo ti entra nel
            fianco, e quando ti rialzi le figure sono già tornate ai loro posti.
          effetti: { profondita.campana-coro: 1, ferite: 1, contaminazione: 1 }
      - testo: "Salutare la padrona del posto come si deve"
        descrizione: "Nei salotti dei Quartieri Alti si entra salutando per prima la persona seduta più in alto. Qui la regola non dovrebbe essere diversa."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: L'inchino alla pedana
          testo: |
            Ti fermi ai piedi dei gradini e fai l'inchino corto e preciso che si deve alla padrona di casa,
            con gli occhi sullo stallo vuoto. La voce si interrompe a metà di un ordine, e nel silenzio dallo
            stallo arriva il cigolio di chi si raddrizza sul sedile. Poi le file davanti a te si aprono, come
            si apre una sala quando entra un ospite annunciato.
          pe: { galateo: 3 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: L'inchino storto
          testo: |
            L'inchino ti viene troppo profondo, come quello che si fa a una persona in lutto, e la voce si
            incrina nel suo punto solito. Le figure delle file ti si stringono intorno senza un suono e così
            fitte che il freddo ti arriva da ogni lato insieme.
          effetti: { tormento: 0.5, contaminazione: 0.5 }

  # ------------------------------------------------------------ 5 · il cuore · la Capoturno
  - id: campana-coro-la-capoturno
    immagine: ambientazione/marea-grigia
    titolo: La Capoturno
    sommario: "Nello stallo alto la voce degli ordini ha preso un corpo. La Capoturno è tornata al suo posto, e nella sua notte tu sei {l'intruso|l'intrusa}."
    luogo: Il coro, lo stallo alto
    area: campana-coro
    requisiti: [campana.strato == 2, profondita.campana-coro >= 5]
    testo: |
      Quando torni davanti alla pedana lo stallo alto è occupato. La Marea Grigia ci si è raccolta come
      l'acqua in una conca e ha preso la forma di una donna seduta, alta il doppio di una donna vera, con una
      verga di metallo nero sulle ginocchia. Lo stallo ha la sua misura. Il sedile ti arriva alla cintura, e
      sui braccioli il metallo è consumato in due solchi lisci dove si posavano mani grandi il doppio delle
      tue. La faccia le cambia a ogni sguardo, e la voce è quella che dava ordini al coro.

      Ai piedi della pedana c'è il tavolo con il bambino e la trottola.

      La Capoturno si alza, e la Marea le scivola giù dalle spalle senza un fruscio e torna a salire. Le
      figure del coro si voltano tutte verso la parete, e lei alza la verga verso le nove grate per dare il
      segnale. Poi abbassa la testa e ti vede.

      {rissa Difficile} È lenta, e la verga le allunga il braccio di due passi buoni. Il guaio vero è la voce,
      che ti entra nella testa da dietro gli occhi.

      {origine allievo-di-torvessa} All'Accademia la Disgregazione Memetica si studia come un'ipotesi, una
      riga sotto la Teoria delle Scorie. Qui ce l'hai davanti, e ti sembra una cosa vissuta.

      *Nella sua notte {l'intruso|l'intrusa} sono io.* Le dita ti si chiudono da sole sull'arma, e il bambino
      ferma la trottola.
    opzioni:
      - testo: "Affrontare la Capoturno"
        descrizione: "Una donna di Marea alta il doppio di te, con una verga di metallo nero e una voce che ti cerca i ricordi."
        combattimento: campana-la-capoturno
        vittoria:
          titolo: La fine del turno
          testo: |
            La Capoturno si sfa dalle mani in su, e di lei resta per ultima la voce, che dice un ordine a metà
            e si ferma nel suo punto solito. Tutte le figure del coro si siedono insieme, come alla fine di un
            turno lungo, e restano ferme. La Marea scende dagli stalli e si posa sul pavimento in uno strato
            basso e uniforme.

            Raccogli la verga. Pesa più di quanto dica il suo spessore, e il peso sta tutto verso la punta.
            Sull'impugnatura ci sono nove tacche, e lungo il fusto una riga di segni incisi che non sai
            leggere e che ti resta in bocca come una parola. Dietro lo stallo alto, nella lastra, si è aperta
            una porta bassa.
          pe: { armi-da-mischia: 5, resilienza: 5 }
          imposta: { campana.strato: 3 }
          effetti: { oggetto.campana-verga-della-capoturno: 1, campana.formula: 1, parte.nucleo-3: 1, informazioni.segreto: 1 }
          vai: campana-batacchio
        sconfitta:
          titolo: Fuori dal turno
          testo: |
            La voce ti entra nella testa e ti trova un ricordo dopo l'altro, e li mette in fila e li conta
            all'indietro. Quando torni in te sei sulla scala a chiocciola, e dopo un tempo che non sai sugli
            scogli della Ripamuta con le onde che si rompono senza rumore. Ti tremano le mani, e quando provi
            a contarti le dita il conto ti esce all'indietro. Il coro ti aspetta da capo, con tutte le sue
            file.
          effetti: { tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Chiamarla Nan'Ireth"
        descrizione: "Al Forno della Nonna hai preso il nome con cui un'operatrice si faceva riconoscere dalle macchine. Forse era il suo."
        requisiti: [misura.forno >= 1]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Difficile }
        successo:
          titolo: Il nome
          testo: |
            Dici il nome di Nan'Ireth forte e chiaro, come un ordine. La Capoturno si ferma con la verga
            alzata, e il bambino al tavolo alza la testa insieme a lei, con la stessa faccia. Per qualche
            battito le due facce restano ferme, e nessuna delle due cambia più. Lei abbassa la verga e te la
            porge dall'impugnatura, come si passa un attrezzo a chi prende il turno dopo. Poi si siede, e si
            sfa piano dentro lo stallo.

            Sull'impugnatura della verga ci sono nove tacche più consumate del resto del metallo, e lungo il
            fusto una riga di segni incisi. Dietro lo stallo alto, nella lastra, si è aperta una porta bassa.
          pe: { persuasione: 5, empatia: 5 }
          imposta: { campana.strato: 3 }
          effetti: { oggetto.campana-verga-della-capoturno: 1, campana.formula: 1, parte.nucleo-3: 1, informazioni.segreto: 1 }
          vai: campana-batacchio
        fallimento:
          titolo: Il nome di un altro
          testo: |
            Il nome le arriva addosso come un insulto, o forse è il nome di qualcun altro, e la voce si alza
            fino a riempire il coro. Le figure negli stalli si girano verso di te tutte insieme. Ti ritrovi
            fuori sugli scogli della Ripamuta senza ricordare la risalita, con il sangue nelle orecchie e
            tutto il coro da rifare.
          effetti: { ferite: 2, tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Spegnere il leggio"
        descrizione: "Il turno della Capoturno va avanti da secoli, e qualcosa lo tiene acceso. Il leggio ha leve come il ripiano del coro."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il leggio spento
          testo: |
            Ti butti sotto il leggio mentre la verga ti passa sopra la testa, e trovi le leve dove le avevano
            gli altri ripiani. Hanno l'impugnatura grossa quanto il tuo polso e sono lucide in cima, dove le
            toccava una mano più grande della tua. Le abbassi tutte, una dopo l'altra. La voce si spegne a
            metà di un ordine. La Capoturno resta ferma con la verga alzata, poi si affloscia nello stallo
            come un mantello vuoto e la verga ti cade ai piedi.

            Sull'impugnatura ci sono nove tacche, e lungo il fusto una riga di segni incisi. Dietro lo stallo
            alto, nella lastra, si è aperta una porta bassa.
          pe: { tecnologia: 10 }
          imposta: { campana.strato: 3 }
          effetti: { oggetto.campana-verga-della-capoturno: 1, campana.formula: 1, parte.nucleo-3: 1, informazioni.segreto: 1 }
          vai: campana-batacchio
        fallimento:
          titolo: La leva che accende
          testo: |
            La leva che abbassi accende il leggio, e la voce della Capoturno esce da tutte le nove grate
            insieme. Il metallo del ripiano ti vibra sotto i palmi e si scalda fino a scottarti la pelle.
            Della risalita non ti resta niente. Ti svegli sugli scogli della Ripamuta con le mani bruciate e
            il coro da rifare.
          effetti: { ferite: 2, tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Ordinarle di smontare dal turno"
        descrizione: "La formula del Comando parla alle macchine dei Precursori nella loro lingua. La Capoturno è un ricordo, e prendeva ordini anche lei."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Smontare
          testo: |
            La formula ti esce dalla bocca nella lingua delle macchine, e la Capoturno si ferma a metà di un
            passo. Ti lascia nei denti una vibrazione che dura più delle parole. Lei abbassa la verga e la
            posa sul leggio con cura, parallela al bordo. Poi si siede nello stallo e chiude gli occhi che
            cambiano, e il coro intero si siede con lei.

            Prendi la verga dal leggio. Sull'impugnatura ci sono nove tacche, e lungo il fusto una riga di
            segni incisi. Dietro lo stallo alto, nella lastra, si è aperta una porta bassa.
          pe: { magia: 10 }
          imposta: { campana.strato: 3 }
          effetti: { oggetto.campana-verga-della-capoturno: 1, campana.formula: 1, parte.nucleo-3: 1, informazioni.segreto: 1 }
          vai: campana-batacchio
        fallimento:
          titolo: Due ordini
          testo: |
            La formula e la voce della Capoturno si scontrano a metà strada, e in mezzo ci sei tu. Le senti
            tutte e due dentro il cranio finché non senti più niente. Ti risvegli sugli scogli della Ripamuta
            con il naso che sanguina e il coro da rifare, e il sangue sul mento è già secco.
          effetti: { ferite: 2, tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
