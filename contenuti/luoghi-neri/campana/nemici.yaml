# I nemici della Campana Sepolta (docs/piano-superficie.md, blocco 8), oltre quelli delle quest di fazione.
# Tarati con `npx tsx scripts/simula-fine.ts campana-` sul profilo «fine contenuti» (Fisico 4, Armi da mischia 4,
# Spadone di Uzgreth, cotta di maglia): gregari fra il 60 e l'85%, guardiani degli strati 1-3 fra il 35 e il 55%,
# le tre fasi del Campanaro fra il 15 e il 35% ciascuna. Contro «fine capitolo» quasi tutto è Molto difficile o
# Impossibile. La leva principale è la riduzione, con PF alti e danno basso: il personaggio ha pochi PF e due colpi
# pieni lo stendono.
# - Strato 1, gli sfiati: i pulitori incrostati (in coppia), la murena degli sfiati, lo Spurgatore (guardiano).
# - Strato 2, le canne: i picchiatori (in coppia), le eco delle canne (in coppia, con la voce della Campana),
#   l'Accordatore (guardiano, con la Maledizione).
# - Strato 3, il coro: gli operatori di Marea (in coppia), il ragno-sacrificale del coro, la Capoturno (guardiano).
# - Strato 4, la camera del batacchio: la figura ruotata, il busto deformato, e il Campanaro in tre fasi, la quarta
#   forma della Salvaguardia (sulle catene, a terra, nella voce), oltre il massimo di prima (attacco 5, PF 30).
nemici:
  # ------------------------------------------------------------ strato 1 · gli sfiati
  - id: campana-pulitore-incrostato
    immagine: bestiario/salvaguardia-precursori
    nome: Pulitore incrostato
    descrizione: "Una macchina bassa e larga come una botte coricata, fatta per grattare il sale dalle pareti degli sfiati. Il sale ha vinto da un pezzo, e adesso la macchina è coperta di cirripedi fino alle giunture e gratta tutto quello che si muove."
    attacco: 5
    difesa: 3
    difesaMentale: 6
    pf: 12
    danno: 3
    riduzione: 4
    iniziativa: 2

  - id: campana-murena-degli-sfiati
    immagine: icone/drowning
    nome: Murena degli sfiati
    descrizione: "Una murena lunga quanto una barca, bianca come la pancia di un pesce morto, cresciuta al buio nell'acqua salata delle gallerie. Ha la Marea nel sangue e i denti rivolti all'indietro, e quando morde non lascia."
    attacco: 7
    difesa: 5
    difesaMentale: 3
    pf: 14
    danno: 4
    riduzione: 2
    iniziativa: 4
    tratti: [animale]

  - id: campana-spurgatore
    immagine: bestiario/salvaguardia-precursori
    nome: Lo Spurgatore
    descrizione: "La macchina che teneva liberi gli sfiati della Campana, grande come un carro da fieno, con due bracci a raschietto e una pompa sul dorso che sputa acqua di mare. Il sale le ha costruito addosso una scogliera, e la scogliera cammina."
    attacco: 6
    difesa: 4
    difesaMentale: 7
    pf: 32
    danno: 3
    riduzione: 5
    iniziativa: 2

  # ------------------------------------------------------------ strato 2 · le canne
  - id: campana-picchiatore
    immagine: icone/pipe-organ
    nome: Picchiatore delle canne
    descrizione: "Una macchina sottile su quattro zampe a uncino, che corre lungo le canne e le batte con un martelletto per sentire se sono ancora accordate. Batte anche le persone, con lo stesso orecchio attento."
    attacco: 5
    difesa: 4
    difesaMentale: 6
    pf: 11
    danno: 3
    riduzione: 4
    iniziativa: 3

  - id: campana-eco-delle-canne
    immagine: icone/sound-waves
    nome: Eco delle canne
    descrizione: "Un suono rimasto chiuso in una canna così a lungo da prendere forma, e adesso è una sagoma tremolante d'aria piegata. Si sente prima di vederla, e quello che dice ti entra nella testa da dietro."
    attacco: 4
    difesa: 5
    difesaMentale: 6
    pf: 10
    danno: 2
    riduzione: 3
    iniziativa: 3
    tratti: [eco]
    magia: 4
    energia: 3
    incantesimi: [campana-la-voce-della-campana]

  - id: campana-accordatore
    immagine: bestiario/salvaguardia-precursori
    nome: L'Accordatore
    descrizione: "Una macchina alta quanto le canne più basse, su sei zampe sottili, con le braccia che finiscono in martelli fasciati di feltro diventato ferro. Accordava le canne della Campana, e da quando nessuno gli dice più quale nota sia giusta le accorda su quella che fa più male."
    attacco: 7
    difesa: 4
    difesaMentale: 7
    pf: 34
    danno: 2
    riduzione: 5
    iniziativa: 3
    magia: 6
    energia: 6
    incantesimi: [maledizione]

  # ------------------------------------------------------------ strato 3 · il coro
  - id: campana-operatore-di-marea
    immagine: ambientazione/marea-grigia
    nome: Operatore di Marea
    descrizione: "Una figura di Marea Grigia con la forma di uno degli operatori che sedevano nel coro, ferma alla notte del suono. Ripete i gesti del suo turno, e quando trova qualcuno al suo posto lo scaccia."
    attacco: 5
    difesa: 4
    difesaMentale: 6
    pf: 11
    danno: 2
    riduzione: 3
    iniziativa: 2
    tratti: [eco]
    magia: 5
    energia: 2
    incantesimi: [campana-la-voce-della-campana]

  - id: campana-ragno-del-coro
    immagine: ambientazione/mito-salvaguardia-precursori
    nome: Ragno-sacrificale del coro
    descrizione: "Una delle tre forme note della Salvaguardia, con quattro braccia che finiscono in innesti di metallo e la maschera bianca senza bocca. Corre sugli stalli del coro senza toccare i sedili, come se ci fosse ancora seduto qualcuno."
    attacco: 7
    difesa: 5
    difesaMentale: 6
    pf: 15
    danno: 3
    riduzione: 3
    iniziativa: 4

  - id: campana-capoturno
    immagine: ambientazione/marea-grigia
    nome: La Capoturno
    descrizione: "La memoria di chi comandava il turno nella notte del suono. È fatta di Marea, alta il doppio di una donna. Ha una faccia che cambia a ogni sguardo e la voce di chi dà ordini da tutta la vita, e nella sua notte sei tu l'intruso."
    attacco: 5
    difesa: 4
    difesaMentale: 8
    pf: 32
    danno: 2
    riduzione: 5
    iniziativa: 3
    tratti: [eco]
    magia: 6
    energia: 6
    incantesimi: [campana-la-voce-della-campana, maledizione]

  # ------------------------------------------------------------ strato 4 · la camera del batacchio
  - id: campana-figura-ruotata
    immagine: ambientazione/mito-salvaguardia-precursori
    nome: Figura ruotata della camera
    descrizione: "Una delle tre forme note della Salvaguardia, con la testa girata all'indietro e le ginocchia piegate al contrario. Cammina a ritroso fra le catene della Campana con una precisione che non sbaglia un passo."
    attacco: 7
    difesa: 5
    difesaMentale: 7
    pf: 16
    danno: 3
    riduzione: 3
    iniziativa: 4

  - id: campana-busto-deformato
    immagine: ambientazione/mito-salvaguardia-precursori
    nome: Busto deformato della camera
    descrizione: "Una delle tre forme note della Salvaguardia. È metà carne e metà metallo ossidato, con le spine di ferro che gli escono dalla schiena. Si trascina sulle braccia, e il pavimento della camera vibra a ogni suo passo."
    attacco: 7
    difesa: 3
    difesaMentale: 6
    pf: 24
    danno: 3
    riduzione: 5
    iniziativa: 1

  - id: campana-campanaro-sulle-catene
    immagine: bestiario/salvaguardia-precursori
    nome: Il Campanaro, sulle catene
    descrizione: "La quarta forma della Salvaguardia, appesa alle catene della Campana come un pipistrello di ferro. Ha sei braccia lunghe che finiscono in ganci da corda e una maschera bianca con la bocca, l'unica che si sia mai vista. Scende dalle catene più svelto di quanto tu riesca a guardarlo."
    attacco: 7
    difesa: 5
    difesaMentale: 7
    pf: 34
    danno: 2
    riduzione: 5
    iniziativa: 4

  - id: campana-campanaro-a-terra
    immagine: bestiario/salvaguardia-precursori
    nome: Il Campanaro, a terra
    descrizione: "Caduto dalle catene, il Campanaro si è strappato dal petto le piastre rotte e ha preso il contrappeso del batacchio con quattro braccia. È lento e pesante, e ogni colpo che manca crepa il pavimento."
    attacco: 6
    difesa: 3
    difesaMentale: 7
    pf: 50
    danno: 2
    riduzione: 6
    iniziativa: 2

  - id: campana-campanaro-nella-voce
    immagine: ambientazione/mito-salvaguardia-precursori
    nome: Il Campanaro, nella voce
    descrizione: "Il Campanaro ha aperto la bocca della maschera, e dalla bocca esce la voce della Campana. Le braccia gli pendono inerti, e combatte con il suono, che ti cerca dentro la testa e trova le cose che ricordi."
    attacco: 6
    difesa: 4
    difesaMentale: 9
    pf: 34
    danno: 2
    riduzione: 5
    iniziativa: 3
    magia: 6
    energia: 8
    incantesimi: [maledizione, campana-la-voce-della-campana]

scontri:
  - { id: campana-i-pulitori, nome: "I pulitori incrostati", nemici: [campana-pulitore-incrostato, campana-pulitore-incrostato], feriteSconfitta: 3 }
  - { id: campana-la-murena, nome: "La murena degli sfiati", nemici: [campana-murena-degli-sfiati], feriteSconfitta: 3 }
  - { id: campana-lo-spurgatore, nome: "Lo Spurgatore", nemici: [campana-spurgatore], feriteSconfitta: 4 }
  - { id: campana-i-picchiatori, nome: "I picchiatori delle canne", nemici: [campana-picchiatore, campana-picchiatore], feriteSconfitta: 3 }
  - { id: campana-le-eco, nome: "Le eco delle canne", nemici: [campana-eco-delle-canne, campana-eco-delle-canne], feriteSconfitta: 3 }
  - { id: campana-l-accordatore, nome: "L'Accordatore", nemici: [campana-accordatore], feriteSconfitta: 4 }
  - { id: campana-gli-operatori, nome: "Gli operatori di Marea", nemici: [campana-operatore-di-marea, campana-operatore-di-marea], feriteSconfitta: 3 }
  - { id: campana-il-ragno-del-coro, nome: "Il ragno-sacrificale del coro", nemici: [campana-ragno-del-coro], feriteSconfitta: 3 }
  - { id: campana-la-capoturno, nome: "La Capoturno", nemici: [campana-capoturno], feriteSconfitta: 4 }
  - { id: campana-la-figura-ruotata, nome: "La figura ruotata", nemici: [campana-figura-ruotata], feriteSconfitta: 3 }
  - { id: campana-il-busto-deformato, nome: "Il busto deformato", nemici: [campana-busto-deformato], feriteSconfitta: 3 }
  - { id: campana-il-campanaro-sulle-catene, nome: "Il Campanaro sulle catene", nemici: [campana-campanaro-sulle-catene], feriteSconfitta: 4 }
  - { id: campana-il-campanaro-a-terra, nome: "Il Campanaro a terra", nemici: [campana-campanaro-a-terra], feriteSconfitta: 4 }
