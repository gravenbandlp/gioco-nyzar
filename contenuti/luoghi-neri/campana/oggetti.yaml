# Le ricompense della Campana Sepolta: i primi oggetti di grado 5 del gioco, un accessorio di grado 3, una formula
# precuriana nuova e la voce della Campana, che usano soltanto i nemici.
# - La conchiglia sorda (accessorio, grado 3): lo Spurgatore, cuore degli sfiati.
# - La Sordina (scudo, grado 5): l'Accordatore, cuore delle canne.
# - La verga della Capoturno (arma per chi usa la magia, con Riserva, grado 5): la Capoturno, cuore del coro, che
#   lascia anche la formula del Rintocco (campana.formula), da studiare sulla costa grigia con Magia 4.
# - Il Battente (arma, grado 5) e le piastre del Campanaro (armatura, grado 5): il Campanaro.
# I punti rispettano lo schema Oggetto (src/motore/contenuto.ts): punti ≤ grado + numero di difetti.
oggetti:
  - id: campana-conchiglia-sorda
    nome: La conchiglia sorda
    immagine: icone/nautilus-shell
    descrizione: "Una conchiglia di metallo nero grande come un pugno, cresciuta dentro uno sfiato della Campana o fatta per stare lì, non si capisce. Appesa vicino all'orecchio si mangia i suoni che fanno male e lascia passare le voci."
    slot: accessorio
    grado: 3
    proprieta: { lucida: true, talento: { resilienza: 1 } }

  - id: campana-la-sordina
    nome: La Sordina
    immagine: icone/bell-shield
    descrizione: "Il disco di metallo nero che chiudeva la bocca della canna più grande, con le cinghie di cuoio che ci hai messo tu. Quando lo colpiscono non suona, e il colpo muore lì dentro senza arrivarti al braccio."
    slot: scudo
    base: scudo
    grado: 5
    dadi: 3
    proprieta: { ultimoRespiro: true }

  - id: campana-verga-della-capoturno
    nome: La verga della Capoturno
    immagine: icone/crystal-wand
    descrizione: "Una verga di metallo nero lunga come un avambraccio, con nove tacche sull'impugnatura, che la Capoturno teneva in mano nella notte del suono. Tiene dentro il Mana come una brocca l'acqua, e la testa di chi la stringe resta ferma. Chi è stato nel coro la riconosce."
    slot: arma
    base: mazza
    grado: 5
    proprieta: { riserva: 3, lucida: true, talento: { magia: 1 } }
    difetti: [riconoscibile]

  - id: campana-il-battente
    nome: Il Battente
    immagine: icone/warhammer
    descrizione: "Un martello ricavato dal contrappeso del batacchio, con il manico di una catena della Campana raddrizzata a colpi. Quando colpisce si sente una nota bassa che resta nelle ossa di chi lo tiene, e più sei ferito più la nota si fa forte."
    slot: arma
    base: martello-da-guerra
    grado: 5
    dadi: 2
    proprieta: { affilata: 2, penetrante: 1, ostinata: true }
    difetti: [inquieta]

  - id: campana-piastre-del-campanaro
    nome: Le piastre del Campanaro
    immagine: icone/breastplate
    descrizione: "Le piastre nere del petto del Campanaro, rimontate su cuoio da un'armatura che non le merita. Fermano i colpi e anche il suono, e la sera pesano il doppio."
    slot: armatura
    base: armatura-a-piastre
    grado: 5
    dadi: 2
    proprieta: { robusta: 1, lucida: true }
    difetti: [stancante]

incantesimi:
  - id: campana-il-rintocco
    nome: Il Rintocco
    tradizione: precuriane
    livello: 4
    uso: [combattimento]
    immagine: icone/ringing-bell
    descrizione: "La formula che la Capoturno teneva scritta sulla verga, una parola sola detta con tutta la gola. Un colpo di suono su tutti i nemici, un tiro contro la Resistenza di ciascuno, danno pari al margine più 2. Ogni lancio costa mezza tacca di Tormento."
    tipo: area
    difesa: resistenza
    danno: 2
    prezzo: { tormento: 0.5 }

  - id: campana-la-voce-della-campana
    nome: La voce della Campana
    tradizione: precuriane
    livello: 1
    uso: [combattimento]
    soloNemici: true
    immagine: icone/sound-waves
    descrizione: "Un pezzo del suono della Campana, che entra dalle orecchie e cerca i ricordi. Danno pari al margine più 1 contro Resilienza."
    tipo: attacco
    difesa: resilienza
    danno: 1
