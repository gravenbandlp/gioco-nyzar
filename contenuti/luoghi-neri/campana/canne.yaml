# La Campana Sepolta, strato 2: le canne (campana.strato 1 → 2). Si arriva dal cuore degli sfiati
# (`campana-sfiati-lo-spurgatore`, sfiati.yaml) o, dopo una ritirata, dall'ingresso sulla costa grigia
# (`campana-la-strada-della-ripamuta`, sblocco.yaml, con campana.strato == 1).
# - area `campana-canne`: la caverna delle canne, i condotti della voce della Campana. Qui la negativa principale è
#   il Tormento. Undici stanze ripetibili, tutte con `campana.strato == 1`, in fasce di profondità (una stanza
#   superata non ricompare nella stessa visita):
#   0 la scala che sale dagli sfiati (Atletica, Resilienza), il primo ponte di catena (Acrobazia, i picchiatori);
#   1 le incisioni sulle canne (Accademiche, Percezione), la foresta che urla (Resilienza, Resistenza, il dono di
#     Tuarmir), e da 1 a 3 il silenzio improvviso (Percezione, Resilienza, l'opzione del Figlio del Circolo);
#   2 la canna spaccata (Tecnologia, Atletica, la nota della Costola), chi parla forte (Furtività, le eco, il richiamo
#     della Spina, l'opzione dell'Accolito del Velo);
#   3 il nido dei picchiatori (Furtività, i picchiatori), la nota che svuota (Resilienza, Medicina);
#   4 le eco in fila (Magia, le eco), la canna maestra (Atletica, Percezione).
#   Ogni stanza ha una via senza prova a 2 o 3 rintocchi con Tormento e Ferite.
# - il cuore `campana-canne-l-accordatore` a profondità 5: l'Accordatore ai piedi della canna maestra. Vie: lo scontro
#   (`campana-l-accordatore`), la nota della Costola cantata (misura.costola, Sociale + Espressività, Difficile), i freni
#   delle zampe (Tecnologia, Difficile), il Comando (Difficile). La vittoria dà la Sordina, campana.strato 2 e porta al
#   coro; la sconfitta riporta in Superficie con lo strato da rifare.
# - Misure: la nota della Costola (la canna spaccata e il cuore), la voce della Spina (chi parla forte).
#   Dono: Tuarmir (la foresta che urla, la maschera d'erbe). Origini: figlio-del-circolo (il silenzio, con
#   un'opzione), accolito-del-velo (chi parla forte, con un'opzione; la nota che svuota).
aree:
  - id: campana-canne
    immagine: ambientazione/gradone-rosso
    nome: Le canne
    sommario: "Sopra gli sfiati si apre una caverna senza soffitto visibile, piena di canne di metallo nero alte come torri."
    spedizione: { ritorno: superficie-fratturata, soglia: 5, stanze: 3 }
    testo: |
      La scala di ferro sale a lungo dagli sfiati e ti lascia su una cengia di basalto, in una caverna così
      alta che la lanterna non ne trova il soffitto. Le canne salgono dal buio del fondo. Sono centinaia di
      tubi di metallo nero alti come campanili, così fitti che fra l'uno e l'altro passa appena un uomo.
      Appoggi il palmo alla più vicina. Il metallo è freddo e liscio, e per tutta l'altezza che la lanterna
      riesce a raggiungere non ha un punto di ruggine. La scala che hai appena salito ti ha lasciato le mani
      rosse.

      Da dentro viene una nota bassa e sempre uguale che senti più nei denti che nelle orecchie, e ogni tanto
      una canna vicina la riprende più alta e te la spinge nella testa. Sulla cengia la polvere di basalto è
      disposta in righe sottili e parallele, tutte girate verso le canne. Ti dici che è la vibrazione a
      pettinarla così da chissà quanto tempo.

colonna:
  - { contesto: area, id: campana-canne, musica: the-light-that-failed, ambiente: hellish-dungeon-ii }

storylet:
  # ------------------------------------------------------------ 0 · la scala e il primo ponte
  - id: campana-canne-la-scala-di-ferro
    immagine: icone/pipe-organ
    titolo: La scala di ferro
    sommario: "Una scala a chiocciola di ferro arrugginito sale dagli sfiati lungo la prima canna. A ogni giro il suono è più forte."
    luogo: Le canne, la scala che sale dagli sfiati
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 0]
    testo: |
      La scala gira intorno alla prima canna come un tralcio intorno a un palo, fissata al metallo nero con
      collari di ferro che i Precursori non avrebbero mai messo. I collari sono stretti con bulloni da
      carpentiere, e la ruggine li ha gonfiati fino a spaccare i dadi. Dove alcuni hanno ceduto la scala pende
      nel vuoto. Sotto ogni collare il metallo della canna è lucido e senza un graffio, anche se il ferro lo
      stringe da generazioni.

      Più sali, più la nota della canna ti passa dai gradini alle suole. Il corrimano vibra così fitto che
      dopo un giro la mano ti formicola fino al polso.

      {atletica Difficile} A occhio sono trecento gradini, e i primi cento li hai già fatti negli sfiati. I
      polpacci sono duri, e conviene salire con le braccia quanto con le gambe.
    opzioni:
      - testo: "Salire di slancio i giri rotti"
        descrizione: "Dove la scala pende bisogna saltare. Il ferro regge, se non ci resti sopra troppo."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: In cima ai giri
          testo: |
            Salti i tratti che pendono senza guardare in basso e atterri ogni volta un gradino più su di
            quanto avevi previsto. Il ferro si piega un poco sotto gli stivali a ogni atterraggio, e torna su
            appena lo lasci. In cima la scala finisce su una passerella di lamiera rivettata che corre fra le
            canne. Ti tremano le ginocchia, e la nota adesso ti arriva anche dalle ringhiere.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il collare che cede
          testo: |
            Il collare a cui ti aggrappi si apre come una mano stanca, e scivoli per mezzo giro di scala con
            la schiena sui gradini. Ti fermi contro la canna, che vibra contro la tua guancia finché non ti
            tiri su. Quando apri il pugno ci trovi il bullone del collare, mangiato dalla ruggine fino a metà
            dello spessore.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Salire piano, con la nota addosso"
        descrizione: "Un gradino alla volta, senza fretta, lasciando che il suono passi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Molto difficile }
        successo:
          titolo: Il suono che passa
          testo: |
            Smetti di combattere la nota e la lasci entrare, come si lascia passare un'onda restando fermi.
            Sali i giri contando i collari invece dei gradini. Ce n'è uno ogni dodici passi, e a ogni collare
            la nota cambia appena d'altezza. In cima le mani tremano ancora, ma la testa è tua.
          pe: { resilienza: 3 }
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: A metà scala
          testo: |
            A metà scala la nota trova un punto dietro gli occhi e ci si pianta. Ti siedi sui gradini con la
            fronte sulle ginocchia, e il ferro ti porta la vibrazione su per la schiena fino alla nuca. Quando
            riesci a rialzarti hai perso il conto dei giri e la voglia di salire.
          effetti: { tormento: 1 }
      - testo: "Salire a forza di braccia, senza fermarti"
        descrizione: "Trecento gradini tutti di fila, con la nota nelle ossa. Arrivi in cima, e a pezzi."
        costo: 2
        esito:
          titolo: Trecento gradini
          testo: |
            Sali senza fermarti, con le braccia sulle ringhiere e la testa bassa, e in cima ti lasci cadere
            sulla passerella. Hai i palmi pieni di scaglie di ruggine, strappate alle ringhiere a ogni presa.
            Il cuore ti batte nelle tempie a un ritmo diverso da quello della canna, e i due ritmi litigano a
            lungo prima che tu riesca a rimetterti in piedi.
          effetti: { profondita.campana-canne: 1, ferite: 1, tormento: 1 }

  - id: campana-canne-il-primo-ponte
    immagine: icone/crossed-chains
    titolo: Il primo ponte di catena
    sommario: "Un ponte di catene tese fra due canne, sopra un vuoto senza fondo. Sulla canna di fronte qualcosa batte il metallo con un martelletto."
    luogo: Le canne, il primo ponte
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 0]
    testo: |
      Il ponte è fatto di tre catene tese fra la tua canna e quella di fronte, una per i piedi e due per le
      mani. Gli anelli sono di ferro battuto a mano, e alle canne li tengono morse a vite. Dal buio di sotto
      la nota sale più forte, e le catene tremano fitte nella luce della lanterna. A metà una delle catene per
      le mani è rattoppata con una corda di canapa. La canapa è diventata grigia e dura d'umido, e il nodo si
      è stretto tanto che non se ne distinguono più i giri.

      Sulla canna di fronte due macchine sottili corrono su e giù sulle zampe a uncino, e ogni tanto battono
      il metallo con un martelletto e si fermano ad ascoltare. Battono ogni volta a un palmo dal colpo di
      prima, e dove un colpo suona diverso tornano a batterlo una seconda volta.

      {acrobazia Difficile} Se tieni il peso basso e i piedi di traverso, basta la catena di sotto.
    opzioni:
      - testo: "Passare il ponte di traverso, piano"
        descrizione: "Il peso basso, i piedi sulla catena di sotto, le mani leggere su quelle di sopra."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Difficile }
        successo:
          titolo: Di traverso
          testo: |
            Passi il ponte con i piedi di traverso e le mani appena appoggiate, e le catene oscillano meno di
            quanto temevi. Le due macchine battono le loro canne senza voltarsi, e da vicino senti che i loro
            colpi hanno tutti la stessa altezza. Dall'altra parte trovi una passerella che porta più dentro la
            foresta.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: La corda di canapa
          testo: |
            Metti la mano sulla corda di canapa e la corda si sfilaccia sotto le dita in fili secchi che
            cadono nel buio. Resti appes{o|a} alla catena di sotto con le gambe nel vuoto finché non riesci a
            tornare indietro. Le macchine sulla canna di fronte hanno smesso di battere, e restano ferme con
            il martelletto alzato e girate verso di te.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Affrontare le due macchine sulla canna"
        descrizione: "Sono sottili e svelte, e il martelletto colpisce dove sente vuoto. Ma sono due sole."
        combattimento: campana-i-picchiatori
        vittoria:
          titolo: Le macchine che non battono più
          testo: |
            La seconda macchina cade nel vuoto battendo il martelletto contro ogni catena che incontra, e la
            senti suonare per molto tempo prima che smetta. La prima resta incastrata fra la canna e il ponte,
            con le zampe che grattano il metallo nero senza lasciarci un segno. Passi oltre senza voltarti a
            guardarla.
          effetti: { profondita.campana-canne: 1 }
        sconfitta:
          titolo: Il martelletto
          testo: |
            Il martelletto ti trova le costole dove l'armatura non arriva, e ogni colpo suona dentro di te
            come dentro una canna. I colpi sono leggeri e precisi, e ognuno cade a un palmo da quello di
            prima. Torni indietro sulla cengia trascinandoti sulle catene, e le macchine riprendono a battere
            il metallo dal punto dove si erano interrotte.
          effetti: { tormento: 0.5 }
      - testo: "Aspettare che le macchine se ne vadano, e correre"
        descrizione: "Prima o poi scendono a battere un'altra canna. Il ponte, intanto, dondola."
        costo: 2
        esito:
          titolo: La corsa sulle catene
          testo: |
            Aspetti aggrappat{o|a} alla tua canna per un tempo lunghissimo, con la nota che ti entra nelle
            braccia. Le macchine scendono a spirale battendo la loro canna fino al buio, e i colpi si fanno
            sempre più piccoli senza smettere mai. Allora corri sul ponte, e a metà la corda di canapa cede.
            Arrivi dall'altra parte con una mano sola e una spalla che non vuole più alzarsi.
          effetti: { profondita.campana-canne: 1, ferite: 1, tormento: 1 }

  # ------------------------------------------------------------ 1 · dentro la foresta
  - id: campana-canne-le-incisioni
    immagine: icone/compass
    titolo: Le canne incise
    sommario: "Una fila di canne più basse, ognuna incisa alla base con un segno e una linea. Le linee puntano tutte fuori dalla caverna."
    luogo: Le canne, la fila incisa
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 1]
    testo: |
      La passerella costeggia una fila di canne più basse, e ognuna ha inciso alla base una figura dei
      Precursori da cui esce una linea dritta. Il solco è profondo quanto un'unghia e ha i bordi vivi come
      appena tagliati, mentre la passerella che gli corre davanti è un'unica crosta di ruggine. Nove linee
      puntano verso punti diversi della parete, e molte altre vanno più lontano. Le segui con gli occhi fin
      dove arriva la lanterna, e nessuna devia di un dito.

      {accademiche Difficile} È una rosa dei venti con dei luoghi al posto dei venti. Una figura somiglia a
      una costola, un'altra a un arco senza muri.

      {origine accolito-del-velo} In Cattedrale le campane si suonano perché la gente venga. Qui nove canne
      portano il suono verso chi doveva sentirlo, e tante altre verso chi non conosci.
    opzioni:
      - testo: "Leggere la rosa delle canne"
        descrizione: "Nove linee verso i nove luoghi neri, e le altre verso posti che sulle carte non ci sono."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Difficile }
        successo:
          titolo: Verso chi doveva sentire
          testo: |
            Ricopi le figure su un pezzo di carta appoggiato al ginocchio, e la mano ti salta a ogni
            vibrazione della passerella. Alla fine le nove linee ti tornano tutte. Sono i nove luoghi neri,
            ognuno con la sua canna. Le altre linee vanno verso est, oltre le carte della Gilda, e una scende
            dritta nel pavimento. Segui l'ultima canna della fila, che porta più dentro.
          pe: { accademiche: 3 }
          effetti: { profondita.campana-canne: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Le linee che si confondono
          testo: |
            Più guardi le linee più si incrociano, e a un certo punto ti accorgi che stai seguendo il tremolio
            della lanterna sul metallo e non le incisioni. Sulla carta che tieni sul ginocchio hai tracciato
            righe che non corrispondono a nessuna figura. Ti gira la testa, e la nota ti si infila nel
            capogiro come un dito in una ferita.
          effetti: { tormento: 1 }
      - testo: "Seguire la linea che scende"
        descrizione: "Una linea sola punta nel pavimento invece che fuori. Dove va, va la strada."
        prova: { attributo: mentale, abilita: percezione, difficolta: Molto difficile }
        successo:
          titolo: La linea che scende
          testo: |
            La linea che scende continua sotto la ruggine della passerella, e la segui grattando con il tacco.
            Dove la ruggine si stacca il solco riappare lucido e con i bordi netti. La linea ti porta a una
            scaletta nascosta dietro una canna, che scende di un piano fino a un ponte più largo.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: La ruggine
          testo: |
            Gratti la ruggine con il tacco per un pezzo, e sotto c'è altra ruggine a strati spessi come la
            corteccia di un albero vecchio. Quando ti rialzi la passerella ti sembra più stretta di prima, e
            le canne più vicine. Ti dici che da chin{o|a} la lanterna illuminava meno.
          effetti: { tormento: 0.5 }
      - testo: "Passare la fila tappandoti le orecchie"
        descrizione: "Le canne basse cantano più forte. Con le mani sulle orecchie non guardi dove metti i piedi."
        costo: 2
        esito:
          titolo: Le mani sulle orecchie
          testo: |
            Passi la fila con le mani sulle orecchie e i gomiti larghi, e la nota ti arriva lo stesso,
            attraverso le ossa del cranio. Inciampi due volte sui rivetti della passerella, che sporgono di un
            dito dalla lamiera. In fondo alla fila hai le ginocchia sbucciate e un fischio nell'orecchio
            sinistro che non va più via.
          effetti: { profondita.campana-canne: 1, ferite: 1, tormento: 1 }

  - id: campana-canne-la-foresta-che-urla
    immagine: icone/screaming
    titolo: La foresta che urla
    sommario: "Un tratto dove le canne sono così fitte che il suono rimbalza dall'una all'altra senza uscire. L'aria stessa trema."
    luogo: Le canne, il tratto fitto
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 1]
    testo: |
      Qui le canne crescono fitte come in un canneto, e la passerella si infila fra loro in un corridoio
      stretto. Se allarghi i gomiti tocchi il metallo da tutte e due le parti. Il suono rimbalza da una canna
      all'altra, e dopo dieci passi non capisci più da dove arriva. La lanterna ti trema in mano, e dietro il
      vetro anche la fiamma si piega a tempo con la nota.

      Sulla passerella c'è una macchia scura e secca, e accanto un orecchino d'osso. È un anello levigato con
      il foro consumato dall'uso, e sta a due dita dall'orlo della macchia.

      {medicina Media} La macchia è sangue vecchio, uscito dalle orecchie di qualcuno che si è fermato qui
      troppo a lungo. Le gocce sono cadute in due gruppi distanti quanto è larga una testa, e nessuna è
      schizzata perché chi sanguinava stava fermo.
    opzioni:
      - testo: "Attraversare tenendo la testa sgombra"
        descrizione: "Pensare a una cosa sola, e camminare. Il suono cerca le teste piene."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Una cosa sola
          testo: |
            Scegli una cosa sola a cui pensare, il rumore della pioggia sul tetto di una casa dove hai dormito
            bene, e la tieni stretta fino in fondo al corridoio. Il suono ti scivola addosso. Quando esci
            dalle canne fitte hai ancora nelle orecchie la pioggia, e non ricordi più quale casa fosse.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il punto della macchia
          testo: |
            A metà corridoio ti fermi, e ti accorgi di esserti fermat{o|a} soltanto quando vedi la macchia
            scura sotto i tuoi piedi. Torni indietro camminando all'indietro, con il naso che sanguina e le
            gocce che cadono accanto a quelle vecchie.
          effetti: { tormento: 1 }
      - testo: "Correre fino in fondo"
        descrizione: "Il corridoio sembra senza fine. Le gambe però sono più svelte della testa."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Molto difficile }
        successo:
          titolo: Fino in fondo
          testo: |
            Corri con la testa bassa e i gomiti stretti, e la passerella ti rimbomba sotto i piedi. Il suono
            ti insegue e non ti raggiunge. In fondo al corridoio ti appoggi a una canna più larga, che per
            fortuna sta zitta. Sotto il palmo il suo metallo è immobile, e solo adesso ti accorgi che tutte le
            altre vibravano.
          pe: { resistenza: 3 }
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: La passerella che gira
          testo: |
            La passerella fa una curva che non avevi visto, e la spalla va a sbattere contro una canna. La
            canna suona per il colpo con una nota più bassa delle altre, e le canne vicine la raccolgono una
            dopo l'altra. Il suono ti butta in ginocchio, e torni indietro a carponi.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Passare dentro il corridoio a occhi chiusi"
        descrizione: "Tre rintocchi di cammino con la nota in testa, una mano sulla ringhiera."
        costo: 3
        esito:
          titolo: A occhi chiusi
          testo: |
            Cammini con gli occhi chiusi e la mano sulla ringhiera, e la nota ti riempie la testa fino a non
            lasciare posto a nient'altro. Conti i montanti della ringhiera sotto la mano per non perdere il
            filo, e verso il quaranta non sai più a che numero sei. Esci dal corridoio con il sangue che ti
            cola da un orecchio e un sapore di ferro in bocca che non è il tuo.
          effetti: { profondita.campana-canne: 1, ferite: 0.5, tormento: 1.5 }
      - testo: "Metterti nelle orecchie il muschio sordo di Tuarmir"
        descrizione: "Madre Cerya te l'ha dato per quando avresti sentito la stessa nota da un'altra parte."
        requisiti: [dono.tuarmir >= 1]
        prova: { attributo: mentale, abilita: [natura, resilienza], difficolta: Media }
        successo:
          titolo: Il muschio della Sella
          testo: |
            Apri il sacchetto di tela e ti infili nelle orecchie due ciuffi di muschio grigioverde, fine come
            capelli. Lassù alla grata i raccoglitori fanno lo stesso. Il muschio è ancora umido, e dentro
            l'orecchio lo senti fresco. La nota arriva attutita, lontana come la voce di qualcuno in un'altra
            stanza, e attraversi il corridoio da un capo all'altro senza fermarti nemmeno sopra la macchia
            scura.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il ciuffo che cade
          testo: |
            A metà corridoio un ciuffo di muschio ti scivola fuori dall'orecchio, e per cercarlo ti fermi
            proprio dove non dovresti. Lo ritrovi accanto all'orecchino d'osso, e ti accorgi di averlo
            guardato a lungo senza raccoglierlo. Torni indietro con il muschio in mano e il naso che sanguina.
          effetti: { tormento: 0.5 }

  - id: campana-canne-il-silenzio
    immagine: icone/silence
    titolo: Il silenzio
    sommario: "Di colpo tutte le canne tacciono insieme. Il silenzio dura, e non si sa quanto durerà."
    luogo: Le canne, nel mezzo della foresta
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne >= 1, profondita.campana-canne <= 3]
    testo: |
      La nota si spegne tutta insieme in ogni canna. Nel silenzio che resta senti il sangue nelle orecchie e
      lo sfrigolio dello stoppino, e le passerelle smettono di vibrare. La ruggine che pioveva di continuo
      dalle ringhiere si ferma, e nella luce della lanterna una scaglia sola finisce di scendere. Molto in
      basso una goccia cade nell'acqua, e il tonfo risale lungo le canne e ti arriva due volte.

      Resti ferm{o|a} a lungo con un piede alzato, finché il ginocchio comincia a tremarti.

      {percezione Difficile} A sinistra le canne sono ferme, mentre a destra una ronza ancora appena, come un
      gatto che fa finta di dormire.

      {origine figlio-del-circolo} Nel Bosco di Velthar gli uccelli tacciono tutti insieme prima della
      grandine, e ti hanno insegnato a cercare un riparo in quel momento.
    opzioni:
      - testo: "Andare dove le canne ronzano ancora"
        descrizione: "Dove la nota resta accesa la strada è usata. Nel tratto spento qualcosa sta aspettando."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Difficile }
        successo:
          titolo: La canna che ronza
          testo: |
            Vai verso la canna che ronza ancora, piano, con l'orecchio teso. Quando ci appoggi il palmo il
            metallo è appena tiepido, e le canne ferme intorno sono fredde. Il ronzio ti porta fuori dal
            tratto fermo. Quando la nota riparte, tutta insieme, sei già due ponti più avanti, e ti ritrovi a
            ringraziarla.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Dalla parte sbagliata
          testo: |
            Scegli le canne ferme, e quando la nota riparte ti esplode addosso da tutte insieme. Ti ritrovi
            stes{o|a} sulla passerella senza sapere quanto ci sei rimast{o|a}. Accanto alla tua mano la
            lanterna ha consumato un dito di stoppino.
          effetti: { tormento: 1 }
      - testo: "Restare fermo finché il suono torna"
        descrizione: "Restare immobili e zitti a reggere il silenzio. Il difficile è tenerlo vuoto dai pensieri."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Molto difficile }
        successo:
          titolo: Il silenzio retto
          testo: |
            Resti immobile, e nel silenzio ti tornano in mente cose che non volevi, una dopo l'altra, finché
            non smettono. Le lasci passare con gli occhi fissi sulle scaglie di ruggine intorno a un rivetto
            della ringhiera. Quando la nota riparte la accogli quasi con sollievo, e riprendi il cammino con
            la testa più leggera.
          pe: { resilienza: 3 }
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: I pensieri
          testo: |
            Nel silenzio i pensieri arrivano tutti insieme, e non riesci a mandarli via. Quando la nota
            riparte sei sedut{o|a} con la schiena contro una canna e le unghie piantate nei palmi. Aprendo le
            mani ci trovi i segni delle unghie, rossi di sangue.
          effetti: { tormento: 1 }
      - testo: "Camminare nel silenzio senza fermarti"
        descrizione: "Tre rintocchi di cammino nel vuoto del suono, sperando di essere lontano quando torna."
        costo: 3
        esito:
          titolo: Quando torna
          testo: |
            Cammini nel silenzio a passo svelto, e i tuoi stivali sulla passerella fanno un rumore enorme. Le
            canne ferme ti rimandano ogni colpo di tacco un poco in ritardo, e per un tratto ti sembra che
            qualcuno ti venga dietro con la tua stessa andatura. Quando la nota torna ti prende alle spalle, e
            cadi in avanti battendo il mento sul ferro. Ti rialzi più avanti di dove volevi, con un dente che
            dondola.
          effetti: { profondita.campana-canne: 1, ferite: 1, tormento: 0.5 }
      - testo: "Cercare il riparo, come prima della grandine"
        descrizione: "Nel Bosco, quando tutto tace, ci si mette sotto qualcosa. Qui il riparo sono le canne più larghe."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: Sotto la canna larga
          testo: |
            Ti infili nello spazio fra due canne larghe come ci si infila sotto una radice, e aspetti. Lo
            spazio è largo appena quanto le tue spalle, e l'aria lì in mezzo sa di metallo freddo. Quando la
            nota riparte ti passa sopra la testa senza toccarti. Esci dal riparo e prosegui, con la sensazione
            di aver fatto la cosa giusta per il motivo giusto.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il riparo sbagliato
          testo: |
            Le canne larghe sono le più rumorose, e quando la nota riparte ti schiaccia fra le due come fra
            due mani. Esci dal riparo con le orecchie che fischiano e sulla guancia il segno rosso del metallo
            contro cui eri premut{o|a}.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ 2 · la canna spaccata e le voci
  - id: campana-canne-la-canna-spaccata
    immagine: icone/pipes
    titolo: La canna spaccata
    sommario: "Una canna larga come una torre ha una spaccatura lunga dal basso all'alto. Dentro si può salire, e il suono che ne esce è stonato."
    luogo: Le canne, la canna spaccata
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 2]
    testo: |
      La passerella finisce contro una canna più larga delle altre, spaccata in verticale da una fenditura
      dove entra un uomo di fianco. I lembi del metallo nero sono piegati verso l'esterno, come se qualcosa
      fosse uscito da dentro. Il metallo è spesso tre dita, e sul taglio è nero fino al cuore senza una vena
      di ruggine. Ti dici che è stata l'acqua degli sfiati, gelata dentro la canna in qualche inverno lontano,
      perché il ghiaccio spinge sempre verso fuori. Sulla parete interna una fila di pioli di ferro sale nel
      buio.

      Dalla fenditura esce una nota storta, più alta delle altre, che le canne vicine riprendono male.

      {tecnologia Difficile} La canna è stonata perché è aperta. Se la si accordasse sulle altre, smetterebbe
      di cantare. I lembi sono piegati senza una crepa, e il metallo si può ancora riportare a posto.
    opzioni:
      - testo: "Salire dentro la canna, sui pioli"
        descrizione: "Dentro il suono è più forte e lo spazio stretto, ma i pioli portano in alto."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Molto difficile }
        successo:
          titolo: Dentro la canna
          testo: |
            Sali i pioli dentro la canna con la nota che ti rimbalza intorno da tutte le parti, e ti sembra di
            essere la lingua di una bocca che parla. Ogni piolo è piantato nel metallo nero dentro un anello
            di ruggine, e intorno all'anello il nero è intatto. In alto la fenditura si apre su un ponte di
            catena. Ne esci con le orecchie piene e le mani rosse di ruggine.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il piolo
          testo: |
            Un piolo ti resta in mano, e scivoli giù per la canna con la schiena contro il metallo che vibra.
            Nel punto dove entrava nel metallo nero il ferro del piolo si è consumato fino a diventare sottile
            come un chiodo. Esci dalla fenditura da dove eri entrat{o|a}, e il suono ti rimane nei denti per
            un'ora.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Raddrizzare i lembi della spaccatura"
        descrizione: "Se la canna si chiude abbastanza smette di stonare, e le altre si calmano. Serve forza nelle mani e un'idea di dove spingere."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: I lembi accostati
          testo: |
            Trovi il punto dove il metallo cede, e con la spalla e una sbarra di ferro accosti i lembi quanto
            basta. Il metallo nero si piega senza un cigolio, e dove la sbarra ha fatto leva non resta nemmeno
            un segno. La nota storta si abbassa e si confonde con le altre. Le canne intorno smettono di
            tremare, e passi oltre per il ponte dall'altra parte.
          pe: { tecnologia: 3 }
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il lembo che torna
          testo: |
            Il lembo cede di un dito e poi torna indietro di colpo, e la sbarra ti sfugge di mano. Cade dentro
            la fenditura e la senti battere sui pioli fino in fondo, un colpo per piolo. La canna risponde con
            una nota così storta che ti piega le ginocchia.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Cantare la nota della Costola alla canna"
        descrizione: "La nota della Costola la sai fare con la gola, bassa fino a far male."
        requisiti: [misura.costola >= 1]
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Difficile }
        successo:
          titolo: La nota giusta
          testo: |
            Appoggi la fronte alla canna e canti la nota della Costola a bocca chiusa, finché ti vibra nei
            denti. La nota entra nel metallo, e la canna spaccata smette di stonare e la prende. Poi tace del
            tutto, e tacciono anche le tre canne vicine. Nel silenzio la fenditura si richiude di un palmo, e
            sotto la fronte senti i lembi muoversi senza nessun rumore. I pioli dentro ti portano su senza
            fatica.
          pe: { espressivita: 5 }
          effetti: { profondita.campana-canne: 1, cristalli.cristallo-carico: 1 }
        fallimento:
          titolo: La nota fuori tempo
          testo: |
            Attacchi la nota quando la canna sta già cantando, e le due note si scontrano. Dallo scontro le
            canne vicine ricavano una terza nota che non era di nessuna delle due. La gola ti brucia, e per un
            po' riesci soltanto a tossire sull'orlo della passerella.
          effetti: { tormento: 0.5 }
      - testo: "Infilarti nella fenditura senza pensarci"
        descrizione: "Due rintocchi dentro una canna che stona, con le mani sui pioli arrugginiti."
        costo: 2
        esito:
          titolo: La canna stonata
          testo: |
            Ti infili nella fenditura e sali alla cieca, con il metallo che ti graffia le spalle e la nota
            storta che ti entra nella testa da dietro. I pioli sono bagnati di condensa e ognuno ti lascia sul
            palmo una riga di ruggine. Esci in alto su un ponte di catena, e per un pezzo non riesci a
            ricordare da che parte sei venut{o|a}.
          effetti: { profondita.campana-canne: 1, ferite: 1, tormento: 1 }

  - id: campana-canne-chi-parla-forte
    immagine: icone/echo-ripples
    titolo: Chi parla forte
    sommario: "Una piazza di ferro sospesa fra le canne. Quando ci metti piede, le canne ripetono il rumore dei tuoi passi, e poi anche altro."
    luogo: Le canne, la piazza sospesa
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 2]
    testo: |
      Le passerelle si incontrano su una piattaforma rotonda di ferro appesa alle canne con dodici catene. Il
      ferro è fatto di lastre sovrapposte e inchiodate, e ogni lastra ha un po' di gioco sui suoi chiodi.
      Quando ci metti piede le canne ripetono il tuo passo più tardi e più forte. Conti il ritardo senza
      volerlo, e viene sempre uguale, il tempo di un battito e mezzo.

      Ti scappa un colpo di tosse che le canne ripetono più volte, e ogni volta un poco più basso del tuo. Da
      una delle bocche esce una sagoma d'aria che trema. Attraverso la sagoma le catene dietro si vedono
      storte, come attraverso l'aria sopra una brace.

      {furtivita Difficile} Qui il rumore è il nemico, e si passa dove le catene tengono il ferro più fermo.

      {origine accolito-del-velo} In Cattedrale ti hanno insegnato a parlare a bassa voce, e adesso ti sembra
      una regola scritta da qualcuno che era stato qui.
    opzioni:
      - testo: "Attraversare la piazza senza un suono"
        descrizione: "Sulle punte, lungo il bordo, senza toccare le catene. Le canne non ripetono quello che non sentono."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Senza un suono
          testo: |
            Passi lungo il bordo con il peso sulle punte, e metti i piedi soltanto sulle lastre agganciate
            alle catene, che non si muovono. La piattaforma non dice niente. La sagoma d'aria resta sospesa
            davanti alla sua canna, girata dalla parte sbagliata. Dall'altra parte della piazza una scala
            scende verso un piano più basso.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il ferro che parla
          testo: |
            Una lastra si muove sui suoi chiodi, e il ferro geme sotto il piede. Le canne ripetono il gemito
            dieci volte. Le sagome escono da tre bocche insieme, e scappi indietro prima che ti arrivino, con
            il gemito del ferro che ti segue per un pezzo.
          effetti: { tormento: 1 }
      - testo: "Affrontare le sagome d'aria"
        descrizione: "Sono suoni rimasti chiusi troppo a lungo. Si colpiscono, ma parlano dentro la testa."
        combattimento: campana-le-eco
        vittoria:
          titolo: Le bocche vuote
          testo: |
            Le sagome si sfaldano una dopo l'altra in un colpo di vento che sa di metallo, e le loro canne
            restano mute. Dove erano sospese l'aria rimane fredda per un po', e ci passi in mezzo con la pelle
            d'oca sulle braccia. Attraversi la piazza con le orecchie che ronzano, e scendi la scala
            dall'altra parte.
          effetti: { profondita.campana-canne: 1 }
        sconfitta:
          titolo: Le voci dentro
          testo: |
            Le sagome non ti colpiscono le braccia. Ti parlano nella testa con la tua voce, e dicono cose che
            non hai mai detto a nessuno. Le canne intorno le ripetono ad alta voce una dopo l'altra. Torni
            indietro sulla passerella tenendoti la testa fra le mani.
          effetti: { tormento: 0.5 }
      - testo: "Dare alle canne il richiamo della Spina"
        descrizione: "La Spina dell'Eco restituisce sempre lo stesso richiamo. È la voce a cui la Campana risponde, e forse queste canne la riconoscono."
        requisiti: [misura.spina >= 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Difficile }
        successo:
          titolo: Il richiamo
          testo: |
            Dai alla piazza il richiamo della Spina, con tutta la voce che hai. Le canne lo ripetono tutte
            insieme una volta sola e senza nessun ritardo, poi tacciono. Le sagome rientrano nelle loro bocche
            come cani richiamati, e il ferro della piazza smette di vibrare. Nel silenzio una catena si
            abbassa e ti fa da scala.
          pe: { espressivita: 5 }
          effetti: { profondita.campana-canne: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il richiamo storpiato
          testo: |
            Ti si incrina la voce a metà del richiamo, e le canne ti restituiscono dieci volte la parte
            storpiata, ogni volta più forte. All'ultima ripetizione l'incrinatura ha preso il posto del
            richiamo intero. Le sagome escono tutte insieme, e scappi giù dalla passerella da dove sei
            venut{o|a}.
          effetti: { tormento: 1 }
      - testo: "Correre attraverso la piazza"
        descrizione: "Due rintocchi di corsa, con le canne che ripetono ogni passo e le sagome dietro."
        costo: 2
        esito:
          titolo: La corsa
          testo: |
            Corri attraverso la piazza, e ogni passo ti torna indietro dalle canne raddoppiato. Le lastre ti
            saltano sotto gli stivali sui loro chiodi. Una sagoma d'aria ti passa attraverso il petto e ti
            lascia un freddo che non se ne va. Arrivi alla scala con le gambe che tremano e un gemito tuo
            nelle orecchie.
          effetti: { profondita.campana-canne: 1, ferite: 0.5, tormento: 1.5 }
      - testo: "Recitare la litania a bassa voce, come in Cattedrale"
        descrizione: "Un accolito sa pregare con le labbra e senza la voce. Le canne non ripetono quello che non sentono."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: mentale, abilita: [resilienza, accademiche], difficolta: Difficile }
        successo:
          titolo: La litania senza voce
          testo: |
            Attraversi la piazza recitando la litania della sera con le labbra sole, come ai vespri quando la
            Madre passava fra i banchi. Le canne non trovano niente da ripetere. Passi a un braccio da una
            sagoma, che resta ferma davanti alla sua bocca. Arrivi alla scala dall'altra parte e ti accorgi di
            aver finito la litania esattamente sull'ultimo gradino.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: La parola che scappa
          testo: |
            A metà litania ti scappa una parola a voce alta, e le canne la ripetono fino a farla diventare
            un'altra. È una parola che nella litania non c'è. Torni indietro di corsa con le sagome alle
            spalle.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ 3 · più in basso
  - id: campana-canne-il-nido-dei-picchiatori
    immagine: icone/pipe-organ
    titolo: Il nido dei picchiatori
    sommario: "Un ripiano fra le canne pieno di macchine sottili accucciate. Alcune dormono, altre battono il metallo per sentire chi arriva."
    luogo: Le canne, il ripiano dei picchiatori
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 3]
    testo: |
      Il ponte scende su un ripiano di ferro incastrato fra quattro canne e pieno di macchine sottili, decine,
      accucciate sulle zampe a uncino come granchi in una cesta. Quasi tutte sono ferme. Tengono il
      martelletto appoggiato al ripiano, e sotto ogni martelletto il ferro è consumato in una piccola conca
      lucida. Due battono il metallo a turno e ascoltano la risposta, e mentre una batte l'altra resta
      immobile con il corpo girato verso il colpo.

      {tecnologia Molto difficile} Dall'eco capiscono dove c'è un vuoto, e per loro una persona è un vuoto che
      si muove.

      Sul bordo del ripiano c'è uno scalpello abbandonato, con il manico di legno annerito dall'umido.
    opzioni:
      - testo: "Passare in mezzo alle macchine ferme"
        descrizione: "Fra un colpo di martelletto e l'altro, quando le due sveglie ascoltano altrove."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Fra un colpo e l'altro
          testo: |
            Conti i colpi dei martelletti e ti muovi nelle pause, un passo per pausa, fra le zampe delle
            macchine ferme. Da vicino senti che anche quelle ferme vibrano appena, a tempo con la nota. Una ti
            sfiora la caviglia con un uncino e non si sveglia. In fondo al ripiano una scala di ferro scende
            ancora.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il colpo sulla caviglia
          testo: |
            Il martelletto ti trova la caviglia nel buio con un colpo leggero, e dal suono che fa ti sente.
            Mezzo ripiano si sveglia insieme, e torni indietro sul ponte con la caviglia gonfia e le macchine
            che battono le canne dietro di te.
          effetti: { ferite: 1 }
      - testo: "Affrontare le due macchine sveglie"
        descrizione: "Prima che sveglino le altre. Sono due, e svelte."
        combattimento: campana-i-picchiatori
        vittoria:
          titolo: Il ripiano fermo
          testo: |
            Le due macchine sveglie cadono fra le altre senza svegliarle, perché le hai prese prima che
            finissero di battere. Una resta con il martelletto alzato a metà del colpo. Attraversi il ripiano
            in punta di piedi, e prendi lo scalpello abbandonato passando.
          effetti: { profondita.campana-canne: 1, parte.impugnatura-2: 1 }
        sconfitta:
          titolo: Tutto il nido
          testo: |
            Al rumore della lotta il nido si sveglia, e le macchine ti salgono addosso a decine. Gli uncini ti
            si piantano nei vestiti, e ogni martelletto ti batte in un punto diverso del corpo. Ti butti giù
            dal ripiano sul ponte di sotto, e torni indietro zoppicando.
          effetti: { tormento: 0.5 }
      - testo: "Fermare i martelletti dall'interno"
        descrizione: "Le macchine hanno un punto dove il martelletto si attacca. Se lo trovi, le spegni senza combattere."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Molto difficile }
        successo:
          titolo: Il perno
          testo: |
            Trovi il perno del martelletto sulla prima macchina sveglia e lo sfili con lo scalpello
            abbandonato. Il perno è lungo un dito e liscio, e dopo tutti quei colpi non ha un segno d'usura.
            La seconda macchina si gira verso il rumore, e sfili anche il suo. Passi in mezzo al nido zitto
            con due perni in tasca.
          pe: { tecnologia: 5 }
          effetti: { profondita.campana-canne: 1, parte.camera-2: 1 }
        fallimento:
          titolo: Il perno sbagliato
          testo: |
            Sfili il perno sbagliato e la macchina invece di spegnersi comincia a battere più forte, sempre
            sullo stesso punto del ripiano. Il nido si sveglia, e torni indietro sul ponte con un uncino
            piantato nella manica.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Calarti dal ripiano lungo una canna"
        descrizione: "Due rintocchi aggrappato al metallo nero che vibra, lontano dal nido."
        costo: 2
        esito:
          titolo: Lungo la canna
          testo: |
            Ti cali lungo il fianco di una canna aggrappat{o|a} ai rivetti, con la nota che ti passa nelle
            braccia fino ai gomiti. Sopra di te i martelletti continuano a battere, e ogni colpo ti arriva due
            volte perché lo portano il ripiano e la canna. Tocchi il ripiano di sotto con le mani che non si
            aprono più, e devi aspettare un pezzo prima di riuscire a staccare le dita dal metallo.
          effetti: { profondita.campana-canne: 1, ferite: 1, tormento: 1 }

  - id: campana-canne-la-nota-che-svuota
    immagine: icone/sound-waves
    titolo: La nota che svuota
    sommario: "Una canna canta una nota così bassa che non si sente. Chi passa vicino si ferma, e dimentica perché era venuto."
    luogo: Le canne, la canna bassa
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 3]
    testo: |
      Questa canna non si sente. Intorno le trema la polvere, e il ferro della passerella ti ronza sotto le
      suole. A tre passi dalla bocca, seduto contro la ringhiera, c'è un Raschiatore morto da anni con la
      lanterna in grembo e lo zaino chiuso. Ha gli occhi aperti e le mani sulle ginocchia, e nessuna ferita.
      L'aria secca gli ha tirato la pelle sugli zigomi senza farla marcire, e la polvere che ha sulle spalle
      trema come quella della passerella. Ti dici che si è fermato a riposare e che il freddo l'ha preso nel
      sonno. La lanterna che tiene in grembo ha bruciato lo stoppino fino all'ultimo filo.

      {medicina Molto difficile} La fame e il freddo non c'entrano. Si è seduto e ha smesso di pensare.

      {origine accolito-del-velo} I novizi più vecchi dicevano che nella Caduta la gente ha dimenticato il
      mondo di prima in una notte. Davanti a quest'uomo la frase ti sembra meno una metafora.
    opzioni:
      - testo: "Passare davanti alla canna con la testa piena"
        descrizione: "Contare, recitare, ricordare a voce bassa qualsiasi cosa. La nota cerca le teste vuote."
        prova: { attributo: mentale, abilita: [resilienza, accademiche], difficolta: Difficile }
        successo:
          titolo: La testa piena
          testo: |
            Passi davanti alla canna recitando sottovoce i nomi delle vie della Città Bassa uno dopo l'altro,
            e la nota non trova spazio. Il ferro ronza così forte che le dita dei piedi ti formicolano dentro
            gli stivali. Al di là ti fermi a riprendere il filo, e ti accorgi di aver saltato una via che
            adesso non riesci più a ricordare.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: "Sedut{o|a}"
          testo: |
            Ti ritrovi sedut{o|a} accanto al Raschiatore, con la schiena contro la ringhiera e le mani sulle
            ginocchia, senza sapere da quanto. Hai sulle spalle un velo di polvere che prima non c'era. Ti
            alzi con uno strappo e scappi indietro, piangendo senza motivo.
          effetti: { tormento: 1.5 }
      - testo: "Chiudere la bocca della canna con lo zaino del morto"
        descrizione: "Una canna tappata canta più piano. Bisogna arrivare alla bocca e restarci il tempo di farlo."
        prova: { attributo: mentale, abilita: [medicina, tecnologia], difficolta: Molto difficile }
        successo:
          titolo: Lo zaino nella bocca
          testo: |
            Ti avvicini alla bocca della canna tenendo il polso del morto, per sentire il tuo battito contro
            la sua pelle fredda e ricordarti chi dei due è vivo. Infili lo zaino nella bocca e la nota cala.
            Sulla passerella la polvere smette di tremare e si posa. Prima di andare chiudi gli occhi al
            Raschiatore, tenendo giù con il pollice le palpebre rigide finché restano chiuse, e gli prendi la
            piastrina.
          pe: { medicina: 3 }
          effetti: { profondita.campana-canne: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: La bocca vuota
          testo: |
            Arrivi alla bocca della canna e lo zaino ti cade di mano, perché non ricordi più perché lo tenevi.
            Ti riprendi con la fronte contro il metallo freddo che ti vibra fino ai denti, e torni indietro a
            fatica.
          effetti: { tormento: 1 }
      - testo: "Passare di corsa, con le mani sulle orecchie"
        descrizione: "Tre rintocchi di corsa davanti a una nota che non si sente. Le mani sulle orecchie servono a poco, e fanno compagnia."
        costo: 3
        esito:
          titolo: Il pezzo che manca
          testo: |
            Corri davanti alla canna con le mani sulle orecchie, che servono a poco perché la nota ti sale
            dalle suole. Al di là ti fermi con il cuore in gola. Più tardi, cercando di ricordare il nome di
            tua madre, ti accorgi che ti ci vuole un momento di troppo per trovarlo.
          effetti: { profondita.campana-canne: 1, ferite: 0.5, tormento: 1.5 }

  # ------------------------------------------------------------ 4 · davanti alla canna maestra
  - id: campana-canne-le-eco-in-fila
    immagine: icone/echo-ripples
    titolo: Le eco in fila
    sommario: "Sulla passerella che porta alla canna maestra le sagome d'aria aspettano in fila, una davanti a ogni bocca."
    luogo: Le canne, la passerella delle bocche
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 4]
    testo: |
      L'ultima passerella corre dritta verso il centro della caverna, e lungo il percorso le canne hanno le
      bocche rivolte verso di lei, una dopo l'altra. Le bocche sono tutte all'altezza della tua testa e
      distano sette passi l'una dall'altra, senza uno scarto per tutta la fila. Davanti a ogni bocca trema una
      sagoma d'aria, ferma come una sentinella. La luce della lanterna le attraversa piegandosi, e sulla
      lamiera dietro ognuna resta una chiazza d'ombra senza bordi. Più avanzi più l'aria si fa fredda. In
      fondo, più alta di tutte, si vede la canna maestra, e accanto qualcosa che si muove su zampe lunghe.

      {magia Difficile} Le sagome sono fatte di Mana piegato dal suono. Il Mana si raddrizza, se qualcuno gli
      dà un'altra forma. Lo senti tirare verso le bocche da cui è uscito.
    opzioni:
      - testo: "Raddrizzare il Mana delle sagome"
        descrizione: "Con la magia, una sagoma alla volta, finché la passerella resta libera."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il Mana dritto
          testo: |
            Tocchi il Mana di ogni sagoma come si tocca una corda storta, e una dopo l'altra le sagome si
            sciolgono in un filo di vento. Dove ognuna era sospesa resta sulla lamiera un velo di brina, che
            sparisce in pochi battiti. La passerella rimane libera fino alla canna maestra.
          pe: { magia: 5 }
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il Mana che torna
          testo: |
            Il Mana della prima sagoma ti torna indietro piegato, e ti entra dalle dita fino alle tempie. Le
            dita ti restano curve nella stessa piega del Mana, e per un po' non riesci a raddrizzarle. Ti
            trovi in ginocchio sulla passerella, e le sagome hanno fatto un passo avanti.
          effetti: { tormento: 1 }
      - testo: "Aprirti la strada a colpi"
        descrizione: "Due sagome si staccano dalle bocche e ti vengono incontro. Le altre aspettano di vedere."
        combattimento: campana-le-eco
        vittoria:
          titolo: La passerella libera
          testo: |
            Le due sagome si sfaldano, e le altre rientrano nelle loro bocche come se avessero visto
            abbastanza. Passando davanti alle bocche senti dentro ogni canna un suono basso che si allontana
            verso il fondo. Cammini fino in fondo alla passerella con le orecchie che ronzano.
          effetti: { profondita.campana-canne: 1 }
        sconfitta:
          titolo: In fila con loro
          testo: |
            Le sagome ti parlano nella testa con la voce di qualcuno che conosci, e finisci in ginocchio. La
            voce ha gli stessi difetti di quella vera, e fa le stesse pause a metà frase. Torni indietro sulla
            passerella, e per un pezzo ti sembra di sentirle seguirti.
          effetti: { tormento: 0.5 }
      - testo: "Passare in mezzo alle sagome"
        descrizione: "Due rintocchi fra le bocche, con le sagome che ti attraversano a una a una."
        costo: 2
        esito:
          titolo: Attraverso le sagome
          testo: |
            Passi in mezzo alle sagome senza fermarti, e ognuna ti attraversa con un freddo diverso. Una ha il
            freddo dell'acqua di pozzo, un'altra quello del ferro d'inverno. Alla fine della passerella ti
            accorgi che hai lasciato indietro qualcosa, e solo dopo un pezzo capisci che è un ricordo, e che
            non sai quale.
          effetti: { profondita.campana-canne: 1, ferite: 0.5, tormento: 1.5 }

  - id: campana-canne-la-canna-maestra
    immagine: icone/pipe-organ
    titolo: La canna maestra
    sommario: "Al centro della caverna c'è la canna più grande, con la bocca chiusa da un disco nero."
    luogo: Le canne, l'impalcatura della canna maestra
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 4]
    testo: |
      La canna maestra è larga quanto una piazza e sale fino al buio. La sua bocca, all'altezza dei tuoi
      occhi, è chiusa da un disco di metallo nero grande come una ruota di mulino. Fra il disco e l'orlo della
      bocca non passerebbe la lama di un coltello. Intorno corre un'impalcatura di ferro a più piani, e
      dall'alto arrivano colpi sordi a intervalli regolari che fanno vibrare tutta la foresta. Li conti per un
      po', e ogni colpo esce un poco più alto di quello prima.

      {atletica Difficile} L'impalcatura sale a scatti, un piano dopo l'altro. Le scale di legno fra un piano
      e l'altro sono nere e spugnose, ma i montanti di ferro reggono e si salgono a forza di braccia.
    opzioni:
      - testo: "Salire l'impalcatura dai montanti"
        descrizione: "Le scale sono marce. I montanti di ferro reggono, ma le braccia devono fare tutto."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Sui montanti
          testo: |
            Sali dai montanti a forza di braccia, un piano dopo l'altro, e i colpi si fanno più vicini a ogni
            piano. Ogni colpo ti arriva nelle mani dal ferro dei montanti un attimo prima che all'orecchio.
            All'ultimo piano ti affacci sopra un ripiano largo. Chi batte è lì, ai piedi del disco nero.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: La scala marcia
          testo: |
            Ti fidi di una scala per un piano solo, e la scala si piega sotto il tuo peso come carta bagnata.
            Cadi sul piano di sotto con un colpo che ti toglie la voglia di risalire per un pezzo. Fra le dita
            ti restano schegge di legno molle che si sbriciolano appena le stringi.
          effetti: { ferite: 1 }
      - testo: "Aggirare la canna dal lato dei colpi"
        descrizione: "Da dove si sente, si arriva. Il lato dei colpi ha un passaggio che chi batte usa ogni giorno."
        prova: { attributo: mentale, abilita: percezione, difficolta: Molto difficile }
        successo:
          titolo: Il passaggio usato
          testo: |
            Giri intorno alla canna verso i colpi e trovi una rampa di ferro lucidata dall'uso, dove la
            ruggine non attacca. Il consumo ha scavato nel ferro due solchi paralleli larghi una spanna,
            troppo distanti fra loro per essere i passi di una persona. Sali la rampa con il ferro che ti
            risponde a ogni passo. In cima c'è un ripiano largo, e chi batte ti volta le spalle.
          pe: { percezione: 3 }
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il lato sbagliato
          testo: |
            Giri dalla parte sbagliata, e la canna ti nasconde i colpi finché non li hai sopra la testa. Un
            pezzo di impalcatura si stacca e ti sfiora una spalla. Lo senti cadere a lungo, e quando tocca il
            fondo il suo colpo si confonde con quelli di sopra. Torni indietro con la spalla pesta e le
            orecchie che fischiano.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Salire le scale marce, una dopo l'altra"
        descrizione: "Tre rintocchi di salita sulle scale che cedono, aggrappandoti a quello che c'è."
        costo: 3
        esito:
          titolo: Le scale che cedono
          testo: |
            Le scale cedono una dopo l'altra sotto gli stivali in una poltiglia di legno nero, e ogni volta ti
            aggrappi ai montanti di ferro oppure alle catene. In cima hai le mani spellate e un fianco livido,
            e i colpi ti arrivano da così vicino che li senti nelle unghie.
          effetti: { profondita.campana-canne: 1, ferite: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · l'Accordatore
  - id: campana-canne-l-accordatore
    immagine: bestiario/salvaguardia-precursori
    titolo: L'Accordatore
    sommario: "Ai piedi del disco nero che chiude la canna maestra, una macchina su sei zampe batte il metallo con i suoi martelli."
    luogo: Le canne, il ripiano della canna maestra
    area: campana-canne
    requisiti: [campana.strato == 1, profondita.campana-canne >= 5]
    testo: |
      Il ripiano gira tutto intorno alla canna maestra. Davanti al disco nero che ne chiude la bocca c'è una
      macchina sottile su sei zampe piantate nel ferro, alta quanto le canne più basse. Le braccia finiscono
      in martelli fasciati di qualcosa che un tempo era feltro e che adesso ha la durezza del ferro. Batte il
      disco e ascolta, poi batte ancora.

      A ogni colpo tutta la foresta risponde, e la nota che torna indietro è un poco più alta e più dolorosa
      di prima. La senti salire per le canne dal fondo della caverna fino a qui, e arrivarti nei denti per
      ultima.

      {tecnologia Difficile} Ogni zampa ha un freno per stare ferma mentre batte. Se i freni si chiudono tutti
      insieme, la macchina resta piantata dov'è. I sei tiranti dei freni si riuniscono sotto il ventre.

      {espressivita Media} Sta cercando una nota sempre più in alto, come un musicista che ha perso il la e
      non si arrende.

      Accanto alle zampe gli operatori hanno lasciato delle chiavi lunghe e un'asta con nove tacche. Le chiavi
      sono allineate in ordine di lunghezza sotto una polvere spessa un dito. La macchina smette di battere e
      gira verso di te la testa piatta, e i martelli si alzano tutti insieme.
    opzioni:
      - testo: "Affrontare l'Accordatore"
        descrizione: "Ha sei zampe e martelli pesanti, e una nota che ti cerca la testa. Si muove meno di quanto colpisce."
        combattimento: campana-l-accordatore
        vittoria:
          immagine: icone/bell-shield
          titolo: La Sordina
          testo: |
            L'ultima zampa si piega, e l'Accordatore cade contro il disco nero con un colpo che fa tacere
            tutta la foresta. Nel silenzio stacchi il disco dalla bocca della canna, e la canna resta muta,
            con la sua bocca aperta sul buio. Il disco è leggero e non suona quando lo batti, e il colpo ti
            muore sotto le nocche senza arrivarti al polso. Gli monti due cinghie di cuoio e te lo leghi al
            braccio.

            Dietro la canna maestra una scala scende verso una luce grigia.
          pe: { armi-da-mischia: 5, resilienza: 5 }
          imposta: { campana.strato: 2 }
          effetti: { oggetto.campana-la-sordina: 1, parte.camera-3: 1, reliquie.meccanismo-spento: 1 }
          vai: campana-coro
        sconfitta:
          titolo: La nota più alta
          testo: |
            I martelli ti prendono alla schiena e alla testa, e l'Accordatore trova la sua nota proprio su di
            te. Della discesa non ti resta niente. Ti ritrovi sulla spiaggia ai piedi della Ripamuta con la
            marea che ti arriva ai fianchi e le orecchie che sanguinano. Il sale dell'acqua ti brucia nei
            tagli, e le canne sono ancora da attraversare tutte.
          effetti: { tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Cantare la nota della Costola al disco"
        descrizione: "La nota della Costola è quella che l'Accordatore ha perso. Se la sente, forse smette di cercare."
        requisiti: [misura.costola >= 1]
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Difficile }
        successo:
          immagine: icone/bell-shield
          titolo: Il la ritrovato
          testo: |
            Appoggi la bocca al disco nero mentre i martelli scendono e canti la nota della Costola con tutta
            la gola. Il disco ti trema contro le labbra finché vibra alla stessa altezza della nota. La nota
            entra nel metallo, e l'Accordatore si ferma con i martelli a mezz'aria. Poi ripete piano la nota
            sul disco, e si accuccia sulle sei zampe come un vecchio che si siede.

            Stacchi il disco dalla bocca della canna, e la canna resta muta. Gli monti due cinghie e te lo
            leghi al braccio. Dietro la canna maestra una scala scende verso una luce grigia.
          pe: { espressivita: 5, resilienza: 5 }
          imposta: { campana.strato: 2 }
          effetti: { oggetto.campana-la-sordina: 1, parte.camera-3: 1, reliquie.meccanismo-spento: 1 }
          vai: campana-coro
        fallimento:
          titolo: La nota sbagliata
          testo: |
            Attacchi la nota un attimo dopo il martello, e le due note si spezzano l'una contro l'altra.
            L'Accordatore ti batte come si batte una canna stonata, con molta attenzione. I colpi ti cadono
            lungo il fianco a un palmo l'uno dall'altro, e dopo ognuno la macchina si ferma ad ascoltare. Ti
            risvegli sulla spiaggia ai piedi della Ripamuta, e le canne sono da rifare.
          effetti: { ferite: 2, tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Chiudere i freni delle sei zampe"
        descrizione: "Un freno per zampa, comandati insieme da una leva sotto il ventre. Bisogna arrivarci fra un martello e l'altro."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          immagine: icone/bell-shield
          titolo: Le sei zampe
          testo: |
            Ti butti sotto il ventre della macchina fra un colpo e l'altro e trovi la leva dei freni. È dura,
            e quando cede scatta con un rumore secco. Le sei zampe si piantano nel ferro tutte insieme, e i
            martelli battono l'aria senza arrivare a niente. L'Accordatore resta lì, piantato, a cercare una
            nota che non trova.

            Stacchi il disco dalla bocca della canna maestra e te lo leghi al braccio con due cinghie. Dietro
            la canna una scala scende verso una luce grigia.
          pe: { tecnologia: 5, resilienza: 5 }
          imposta: { campana.strato: 2 }
          effetti: { oggetto.campana-la-sordina: 1, parte.camera-3: 1, reliquie.meccanismo-spento: 1 }
          vai: campana-coro
        fallimento:
          titolo: La leva
          testo: |
            La leva è dura, e mentre ci tiri sopra un martello ti trova la spalla. Ricordi la leva che si
            sposta di un dito e torna indietro, e il resto lo ricordi a pezzi. Ti risvegli sulla spiaggia ai
            piedi della Ripamuta con un braccio che non si alza, e le canne da attraversare di nuovo.
          effetti: { ferite: 2, tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Ordinargli di fermarsi"
        descrizione: "La formula del Comando parla alla Salvaguardia nella sua lingua. L'Accordatore ascolta tutto."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          immagine: icone/bell-shield
          titolo: L'ordine
          testo: |
            Dici la formula, e la parola ti esce in una lingua che la foresta riprende e porta lontano. Dalle
            canne più lontane la parola torna indietro ancora intera. L'Accordatore abbassa i martelli. Resta
            in piedi davanti al disco, in attesa di un ordine successivo che non gli dai.

            Stacchi il disco dalla bocca della canna maestra e te lo leghi al braccio con due cinghie. Dietro
            la canna una scala scende verso una luce grigia.
          pe: { magia: 5, resilienza: 5 }
          imposta: { campana.strato: 2 }
          effetti: { oggetto.campana-la-sordina: 1, parte.camera-3: 1, reliquie.meccanismo-spento: 1 }
          vai: campana-coro
        fallimento:
          titolo: La foresta risponde
          testo: |
            Dici la formula, e la foresta la ripete cento volte, ognuna storta in un modo diverso.
            L'Accordatore alza i martelli, e il primo ti prende mentre stai ancora ascoltando le ripetizioni.
            Ti risvegli sulla spiaggia ai piedi della Ripamuta, con la formula che ti gira in testa e le canne
            da rifare.
          effetti: { ferite: 2, tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
