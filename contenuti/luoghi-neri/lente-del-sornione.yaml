    sottotitolo: Un luogo nero oltre l'orlo nord del Gradone Rosso
    testo: "Un disco di vetro dei Precursori largo quattro metri, mezzo affondato in un campo accanto a un cascinale. Riflette un cielo diverso da quello vero, con due stelle che nessuno conosce. I contadini lo chiamano il Sornione perché sembra ridere di chi lo guarda."

