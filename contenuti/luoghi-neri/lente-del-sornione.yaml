# La Lente del Sornione (docs/piano-superficie.md, «Le nove spedizioni dei luoghi neri»). Un disco di vetro dei
# Precursori largo quattro metri, mezzo interrato in un campo oltre l'orlo nord del Gradone Rosso, accanto a un
# cascinale (codex sf-lente-del-sornione). Il disco è il tappo di una canna verticale larga come una torre: sotto
# c'è un occhio rivolto in alto che mostra il cielo com'era la notte del suono, con due stelle che oggi non ci sono.
# Ci si entra da `lente-del-sornione-il-campo` (Superficie, ripetibile, traccia.sornione >= 3).
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 la rampa sotto il vetro o la paratia brinata, 1 gli specchi o la stanza delle lastre, 2 gli occhi di guardia
# (scontro) o la stanza del turno, 3 il cerchio dei nove incavi o la ruota del ticchettio; il cielo sotto i
# piedi vale da 1 a 3.
# Il cuore a 4 è l'occhio (`lente-del-sornione-l-occhio`, misura.sornione == 0): il compasso che misura il cielo
# (boss), oppure copiare le stelle senza fare ombra (Difficile), il Comando, e per l'Allievo di Torvessa il conto
# delle ore sul quadrante. La vittoria dà misura.sornione, il Vetro delle due stelle (grado 3) e parti dei
# Precursori. Dopo, `lente-del-sornione-l-occhio-che-resta` (ripetibile, misura.sornione >= 1) rende meno.
# La misura, per chi scrive la Campana: nell'occhio la stella più grande è bianca e sta bassa sopra il nord-est,
# a un palmo dall'orlo; la più piccola, rossa, le sta sopra di due dita sulla stessa verticale. Sul quadrante
# intorno all'occhio le due stelle cadono sulla tacca dell'ultima ora prima dell'alba: è l'ora del suono.
# Il segno che lega i luoghi neri (fissato con le altre spedizioni): un cerchio di nove incavi con un incavo inciso
# più a fondo, e in quell'incavo il segno proprio del luogo, qui un occhio (lo stesso della quinta pietra
# dell'Anello). Dal centro parte un condotto verso nord-est, dove sta la Campana, che vibra con una nota bassa.
# Lo stesso cerchio è sotto la Soglia di Mara (la porta) e sotto la Spina dell'Eco (la riga fra due onde).
aree:
  - id: lente-del-sornione
    immagine: ambientazione/rovine-dei-precursori
    nome: La Lente del Sornione
    sommario: "Sotto il disco di vetro del campo c'è una canna di metallo larga come una torre, e una rampa che scende a spirale verso un occhio rivolto in alto."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Sotto il Sornione la terra è vuota. Il disco di vetro chiude in alto una canna di metallo grigio così
      profonda che la luce non arriva in fondo. Le pareti sono lisce e senza una saldatura, e la mano ci
      scivola sopra senza trovare un chiodo. Da sopra scende un chiarore azzurro di luna anche a mezzogiorno,
      e sulle pareti si muovono ombre di stelle che il cielo vero non ha. Ti dici che sono riflessi del vetro,
      e intanto cerchi fra loro le costellazioni che conosci e non ne trovi nessuna.

      Una rampa senza parapetto scende a spirale lungo la parete. È larga quanto un carro, con il metallo
      zigrinato a righe fitte che tiene bene la suola, e dal bordo la spirale gira su se stessa finché la luce
      azzurra non basta più. Fa un freddo asciutto da cantina, e dal fondo sale un ticchettio lento.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: lente-del-sornione-il-campo
    presso: i-luoghi-neri
    immagine: ambientazione/gradone-rosso
    titolo: Il campo del Sornione
    sommario: "Oltre l'orlo nord del Gradone Rosso, dietro un cascinale, un disco di vetro mezzo affondato nel campo riflette un cielo di notte in pieno giorno."
    luogo: Superficie Fratturata, il cascinale oltre l'orlo nord del Gradone Rosso
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.sornione >= 3]
    testo: |
      Il cascinale sta su una gobba di terra rossa oltre l'orlo nord del Gradone Rosso, con i muri di sasso a
      secco e un noce davanti all'aia. In mezzo al campo di stoppie c'è il Sornione. L'aratro gli ha girato
      intorno per anni, e i solchi fanno un cerchio largo e storto che non arriva mai al vetro. Il cane della
      contadina ti accompagna fino all'ultimo solco e lì si siede, con le orecchie basse.

      È un grande disco di vetro affondato per metà nella terra e inclinato verso nord. Il sole di mezzogiorno
      ci batte sopra senza fare riflesso, e dentro il vetro è una notte fitta di stelle. Ti dici che sono
      bolle d'aria rimaste nel vetro quando l'hanno colato, e che il sole ci si accende dentro.

      {percezione Media} Le stelle nel vetro non stanno dove le conosci. Ci cerchi le figure del cielo
      d'estate e non ne trovi una intera, e due stelle vicine all'orlo di nord-est non le hai mai viste in
      nessun cielo.

      {origine allievo-di-torvessa} Orvald Temmerin tiene sul tavolo una lente dei Precursori grande come
      un'unghia e non lascia che nessuno la tocchi. Questa è larga come la sua aula, e nessuno l'ha mai chiusa
      a chiave.
    opzioni:
      - testo: "Scavare lungo il bordo del vetro"
        descrizione: "Il vetro continua sotto terra. Da qualche parte il bordo diventa una parete, e una parete fatta da qualcuno ha una porta."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Il portello
          testo: |
            Scavi lungo il bordo con la pala del cascinale, e a due braccia di profondità il vetro diventa
            metallo grigio, così freddo che le mani ti si intorpidiscono sul manico. Fra i due non c'è
            giuntura, e non trovi il punto in cui finisce l'uno e comincia l'altro. Più giù la pala batte su
            un portello stretto e alto, con una maniglia fatta per dita più lunghe delle tue. Si apre verso
            l'interno, e da sotto sale un'aria gelata che sa di neve.
          pe: { atletica: 2 }
          vai: lente-del-sornione
        fallimento:
          titolo: La terra rossa
          testo: |
            La terra del campo è dura come un mattone cotto in superficie, e sotto si sbriciola e frana un
            poco nella buca a ogni palata. A sera hai le mani piene di vesciche e una buca che il cane della
            contadina annusa con disprezzo. Lasci la pala appoggiata al noce e rimandi lo scavo a un altro
            giorno.
          effetti: { ferite: 0.5 }
      - testo: "Farsi portare in cantina dalla contadina"
        descrizione: "Chi costruisce una casa accanto a una cosa del genere scava anche una cantina. Bisogna sapere che cosa ci ha trovato."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Il vino buono
          testo: |
            La contadina ti squadra a lungo, poi prende la lanterna e ti porta giù per una scala di pietra. La
            cantina è fresca, con le botti in fila contro una parete di metallo grigio. Le pietre intorno sono
            verdi di umido, e il metallo è asciutto e senza una macchia di muffa. Suo nonno ci ha trovato una
            porta, ti dice. Ci ha messo davanti le botti del vino buono, perché lì il vino non va mai a male.
            Sposta due botti con te e ti lascia la lanterna.
          pe: { empatia: 2 }
          vai: lente-del-sornione
        fallimento:
          titolo: Il cane
          testo: |
            La contadina ti ascolta finché nomini la cantina, poi chiama il cane con un fischio. Il cane ti
            accompagna fino alla strada a mezzo passo da te, e ogni volta che rallenti ti appoggia i denti sul
            polpaccio senza stringere. Sulla strada si ferma e torna indietro trotterellando, senza voltarsi.
          effetti: { sospetto: 0.5 }
      - testo: "Arrivare a cavallo e lasciar scegliere il cavallo"
        descrizione: "Le bestie girano al largo dei posti neri. Un cavallo sente dove il campo è vuoto sotto gli zoccoli."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Gli zoccoli piantati
          testo: |
            Giri intorno al campo al passo, con le redini lente. Il cavallo tiene il collo girato lontano dal
            vetro per tutto il giro e non vuole avvicinarsi. A un punto preciso del margine pianta gli zoccoli
            e sbuffa dal naso. Lì, sotto un palmo di terra, la pala trova un portello di metallo grigio, e il
            portello si apre verso l'interno appena lo liberi.
          vai: lente-del-sornione
      - testo: "Aspettare la notte sulle stoppie"
        descrizione: "Di notte il vetro mostra un cielo di giorno, dice la contadina. Forse di notte mostra anche da dove si entra."
        costo: 2
        esito:
          titolo: La riga di luce
          testo: |
            Aspetti il buio sedut{o|a} sulle stoppie, con la giubba chiusa fino al mento. A mezzanotte il
            disco si accende dell'azzurro di una mattina presto, e i grilli del campo tacciono tutti insieme.
            Lungo il bordo, sotto la terra, una riga di luce disegna la sagoma di un portello. Scavi al buio
            con le dita intirizzite, e il portello si apre verso l'interno.
          effetti: { ferite: 0.5 }
          vai: lente-del-sornione
      - testo: "Misurare l'inclinazione come all'Accademia"
        descrizione: "Orvald dice che una lente si capisce dall'angolo. Questa pende verso nord, e il suo occhio sta dove l'angolo porta."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: L'angolo
          testo: |
            Pianti due bastoni sull'orlo del disco e tendi uno spago fra le punte, come avete fatto cento
            volte nel cortile dell'Accademia con le lenti piccole. La pendenza è di un dito ogni palmo, e non
            cambia di un capello da un capo all'altro del disco. Prolunghi la linea sotto terra con la pala, e
            a tre braccia trovi un portello di metallo grigio nel punto esatto che lo spago indicava. Il
            portello si apre verso l'interno appena lo tocchi.
          pe: { tecnologia: 2 }
          vai: lente-del-sornione
        fallimento:
          titolo: Il vetro gelato
          testo: |
            Per tenere fermo lo spago appoggi il palmo sul vetro, e il gelo ti morde la pelle come un ferro
            rovente. Il sole ci batte sopra da ore, e il vetro non ha preso un filo del suo calore. Quando
            stacchi la mano ti resta sul vetro un pezzetto di pelle, e la linea sotto terra non la prolunghi
            più per oggi.
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ 0 · la rampa e la paratia
  - id: lente-del-sornione-la-rampa
    immagine: ambientazione/rovine-dei-precursori
    titolo: La rampa sotto il vetro
    sommario: "Una rampa senza parapetto scende a spirale lungo la parete della canna, coperta da una brina dura come lo zucchero."
    luogo: La Lente del Sornione, sotto il vetro
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 0]
    testo: |
      Dal portello esci su una rampa senza parapetto che gira lungo la parete della canna. È larga due passi,
      e per tutto il giro che vedi non ha una giuntura. Dall'alto il Sornione manda giù una luce da notte di
      luna, e sotto i piedi la rampa è coperta di brina dura. Lungo la parete corre una fila di borchie
      all'altezza di una spalla molto più alta della tua. Fra una borchia e l'altra ci sono tre passi, e la
      brina le ha lasciate scoperte.

      {acrobazia Media} Sul lato del vuoto la brina pende verso il basso e i piedi ci scivolano. Contro la
      parete la presa è migliore, perché lì la brina è granulosa e scricchiola sotto la suola.

      Dal fondo della canna sale il ticchettio, lento come un orologio di campagna, e fra un colpo e l'altro
      conti fino a sei.
    opzioni:
      - testo: "Scendere con la spalla contro la parete"
        descrizione: "I piedi di traverso, la spalla sul metallo gelato, un giro dopo l'altro."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La spalla alla parete
          testo: |
            Scendi con la spalla contro il metallo e i piedi di traverso, un giro dopo l'altro, e ogni tanto
            la giubba ti resta incollata al gelo per un momento. Al terzo giro la brina finisce su una linea
            netta che corre tutta intorno alla canna, e sotto la rampa è asciutta. Il ticchettio sotto di te
            si fa più chiaro.
          pe: { acrobazia: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Lo scivolone
          testo: |
            Al primo giro il piede ti parte verso il vuoto. Ti salvi aggrappandoti all'orlo della rampa con
            tutte e due le mani, e risali in ginocchio fino al portello con le dita spellate dal gelo. Per
            tutto il tempo che resti appes{o|a} dal basso non sale nessun rumore, nemmeno quello della brina
            che hai fatto cadere.
          effetti: { ferite: 0.5 }
      - testo: "Seguire le borchie della parete"
        descrizione: "Qualcuno scendeva qui con la mano sulle borchie. Dove teneva la mano, forse, metteva anche i piedi."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: I tondi asciutti
          testo: |
            Le borchie sono appena tiepide, e ogni tanto una è più calda delle altre. Sotto la borchia calda
            la brina della rampa si è sciolta in un tondo asciutto, e tu metti i piedi lì, di tondo in tondo,
            fino in fondo alla prima spirale. I tondi sono lontani un passo e mezzo dei tuoi, e devi allungare
            la gamba a ogni passo.
          pe: { percezione: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: La borchia che gira
          testo: |
            Una borchia ti gira sotto la mano con uno scatto, e per tutta la canna corre un suono acuto di
            vetro toccato con l'unghia. Ti siedi sulla rampa ad aspettare che smetta, senza sapere che cosa
            hai messo in moto. Quando smette, la brina intorno ai tuoi piedi è piena di crepe sottili.
          effetti: { tormento: 1 }
      - testo: "Calare la corda e scendere appeso"
        descrizione: "Una corda legata al maniglione del portello e giù lungo la parete. Basta che la corda sia abbastanza lunga."
        costo: 2
        esito:
          titolo: La corda corta
          testo: |
            Leghi la corda al maniglione del portello e ti cali lungo la parete, con i piedi che cercano la
            rampa del giro di sotto. Il metallo della parete è così liscio che le suole non ci fanno presa. La
            corda finisce prima della rampa. L'ultimo tratto lo fai saltando, e la caviglia te lo fa pagare
            per il resto della discesa.
          effetti: { profondita.lente-del-sornione: 1, ferite: 0.5 }

  - id: lente-del-sornione-la-paratia-brinata
    immagine: ambientazione/rovine-dei-precursori
    titolo: La paratia brinata
    sommario: "Al primo giro la rampa entra nella parete sotto un arco basso, chiuso da una paratia coperta di brina spessa un dito."
    luogo: La Lente del Sornione, il primo giro della rampa
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 0]
    testo: |
      Al primo giro la rampa entra nella parete sotto un arco basso, chiuso da una paratia di metallo coperta
      di brina. La paratia combacia con l'arco così bene che la brina passa dall'una all'altro senza una riga.
      Il freddo ti entra nelle ossa delle mani, e quando sbatti le palpebre senti la brina scricchiolare sulle
      ciglia. Al centro della paratia c'è una ruota con sei raggi grossi come un polso, incrostata di ghiaccio
      fino al mozzo.

      {tecnologia Media} Lungo il bordo sinistro la brina è più sottile, e sotto deve passare qualcosa di
      tiepido che lavora ancora.
    opzioni:
      - testo: "Girare la ruota a forza"
        descrizione: "Il ghiaccio cede prima delle mani, se le mani tengono abbastanza."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: La ruota
          testo: |
            Ti avvolgi le mani nelle maniche e tiri la ruota con tutto il peso. Il ghiaccio si spacca intorno
            al mozzo con un colpo secco e la ruota gira liscia e senza un cigolio, perché il perno sotto il
            ghiaccio non ha un granello di ruggine. La paratia scivola di lato con un soffio di aria più
            calda, e dall'altra parte la rampa riprende a scendere.
          pe: { resistenza: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Le dita bianche
          testo: |
            Tiri finché le dita diventano bianche e insensibili, e la ruota resta dov'è. Dal ghiaccio non si
            stacca neppure una scaglia. Torni al portello a scaldarti le mani sotto le ascelle, e per un'ora
            le dita ti pungono come se ci fossero dentro mille spilli.
          effetti: { ferite: 0.5 }
      - testo: "Cercare quello che passa sotto la brina sottile"
        descrizione: "Lungo il bordo sinistro passa qualcosa di tiepido. Le paratie dei Precursori hanno sempre un meccanismo, e un meccanismo scalda."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il canale tiepido
          testo: |
            Gratti la brina sottile con la lama e scopri un canale nel metallo, con dentro una barra che si
            muove appena. La barra è tiepida e scorre avanti e indietro di un dito, con il passo del
            ticchettio che sale dal fondo. La spingi con il pollice dove è più calda, e la paratia scivola di
            lato senza che tu tocchi la ruota.
          pe: { tecnologia: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: La lama incollata
          testo: |
            Gratti la brina, e la lama si incolla al metallo gelato e ci resta attaccata. La stacchi tirando
            con tutte e due le mani, e il contraccolpo ti manda a sbattere contro la parete dell'arco. Sul
            filo della lama resta una striscia di brina che non si scioglie nemmeno quando ci soffi sopra.
          effetti: { ferite: 0.5 }
      - testo: "Sciogliere il ghiaccio con l'olio della lanterna"
        descrizione: "Un filo d'olio acceso intorno al mozzo. Si brucia l'olio, e un poco anche le mani."
        costo: 2
        esito:
          titolo: L'olio acceso
          testo: |
            Versi un filo d'olio intorno al mozzo e ci dai fuoco. Il ghiaccio si scioglie lento e gocciola
            nella fiamma, e il fumo sale dritto lungo la canna perché qui sotto l'aria non si muove. Quando la
            ruota finalmente gira hai una scottatura sul dorso della mano e la lanterna mezza vuota per il
            resto della discesa.
          effetti: { profondita.lente-del-sornione: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · gli specchi e le lastre
  - id: lente-del-sornione-gli-specchi
    immagine: ambientazione/rovine-dei-precursori
    titolo: Gli specchi della canna
    sommario: "Più in basso la luce del vetro scende di specchio in specchio lungo la parete."
    luogo: La Lente del Sornione, la canna degli specchi
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 1]
    testo: |
      Più in basso la luce del Sornione da sola non arriva, e scende da uno specchio all'altro. Sono dischi
      lucidi incassati di sbieco nella parete, e ognuno manda la luce del precedente un giro più giù. Sulla
      loro faccia non c'è un granello di polvere, mentre la rampa sotto di loro ne è coperta. Uno è storto e
      la manda contro il metallo nudo, e da lì in giù la rampa sparisce nel buio.

      {tecnologia Media} Lo specchio storto ha sul retro un perno con una tacca, e la tacca sta un quarto di
      giro fuori posto. Qualcuno l'ha girato apposta, o il freddo l'ha fatto saltare.

      Ti dici che è stato il freddo, perché quaggiù non scende nessuno da molto tempo. Sul metallo nudo, dove
      batte la luce storta, la parete è scolorita in un tondo chiaro.
    opzioni:
      - testo: "Raddrizzare lo specchio"
        descrizione: "Lo specchio ha un perno con una tacca, e sta sospeso sopra il vuoto."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La luce che torna
          testo: |
            Ti sporgi sul vuoto con una mano sulla borchia più vicina e giri il perno fino alla tacca. Il
            perno gira duro e preciso, senza un filo di gioco. Lo specchio si raddrizza con uno scatto, e la
            luce azzurra scende di nuovo giro dopo giro, accendendo la rampa fin dove arriva lo sguardo.
          pe: { tecnologia: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il lampo
          testo: |
            Giri il perno dalla parte sbagliata, e lo specchio ti manda in faccia tutta la luce della canna in
            un colpo solo. La luce non scalda, e la pelle della faccia ti resta fredda. Resti a lungo
            sedut{o|a} sulla rampa con le mani sugli occhi, e quando li riapri ci vedi dentro due stelle che
            non se ne vanno.
          effetti: { tormento: 1 }
      - testo: "Scendere al buio con la mano sulle borchie"
        descrizione: "Al buio ci si muove a memoria. La memoria qui è quella delle borchie."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: A memoria
          testo: |
            Scendi al buio contando le borchie sotto le dita, tre passi fra una e l'altra, e non pensi a
            quanto sia profondo il vuoto alla tua destra. Le borchie sono consumate sul lato alto, dove una
            mano più grande della tua si appoggiava scendendo. Al quarto giro la luce dello specchio
            successivo ti viene incontro dal basso.
          pe: { resilienza: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il vuoto a destra
          testo: |
            A metà giro perdi il conto delle borchie, e il vuoto alla tua destra comincia a sembrarti più
            vicino a ogni passo. Da quella parte sale un filo d'aria fredda che ti tocca la guancia destra, e
            dall'altra l'aria è ferma. Torni su camminando all'indietro, con la schiena contro la parete, fino
            alla luce.
          effetti: { tormento: 1 }
      - testo: "Accendere la lanterna e scendere piano"
        descrizione: "Una lanterna fa luce. Negli specchi, però, la luce di una lanterna non resta ferma."
        costo: 2
        esito:
          titolo: Cento lanterne
          testo: |
            Accendi la lanterna, e gli specchi della canna la raccolgono tutti insieme e te la rimandano da
            cento parti. Scendi in mezzo a cento lanterne che si muovono con te. Le più lontane si muovono un
            poco dopo di te, e ti dici che è la strada lunga che fa la luce. Quando arrivi in basso hai un mal
            di testa che ti batte dietro gli occhi.
          effetti: { profondita.lente-del-sornione: 1, tormento: 1 }

  - id: lente-del-sornione-le-lastre
    immagine: ambientazione/rovine-dei-precursori
    titolo: La stanza delle lastre
    sommario: "Una stanza lunga nella parete della canna, con scaffali pieni di lastre di vetro sottili come fogli. Su ognuna c'è un cielo."
    luogo: La Lente del Sornione, la stanza delle lastre
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 1]
    testo: |
      Una porta nella parete della canna dà su una stanza lunga e stretta, con scaffali di metallo fino al
      soffitto. Il soffitto è alto il doppio di quello di una casa, e gli ultimi ripiani li raggiungeva
      soltanto chi non aveva bisogno di una scala. Sugli scaffali ci sono migliaia di lastre di vetro sottili
      come fogli, ognuna nella sua scanalatura. Ne sollevi una contro la luce e dentro c'è un cielo di notte
      inciso a punti minuscoli, con stelle che non conosci. La lastra non ha un graffio, e sul bordo della
      scanalatura da cui l'hai tolta la polvere è alta un dito.

      {origine allievo-di-torvessa} All'Accademia una sola lastra dei Precursori si studia per un anno intero.
      Qui nessuno le ha mai contate.

      In fondo alla stanza un'altra porta riporta sulla rampa più in basso.
    opzioni:
      - testo: "Cercare dove finiscono le lastre"
        descrizione: "Se ogni lastra è una notte, l'ultima lastra è l'ultima notte che qualcuno ha guardato."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La fila a metà
          testo: |
            Segui l'ordine delle scanalature da uno scaffale all'altro, e l'ordine ti porta fino in fondo alla
            stanza. Ogni dieci scanalature c'è un segno inciso, e i segni crescono di uno alla volta. L'ultima
            fila è piena solo a metà. Dopo l'ultima lastra ci sono scanalature vuote, con la polvere dentro,
            per tutti gli scaffali che restano.
          pe: { accademiche: 2 }
          effetti: { profondita.lente-del-sornione: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Mille cieli
          testo: |
            Sollevi una lastra dopo l'altra finché i cieli cominciano a somigliarsi tutti, e poi a muoversi.
            Le dita ti si sono intorpidite a forza di tenere il vetro freddo. Esci dalla porta da cui sei
            entrat{o|a} con le stelle ancora attaccate agli occhi.
          effetti: { tormento: 1 }
      - testo: "Sfilare una lastra senza far cadere la fila"
        descrizione: "Una lastra di vetro dei Precursori vale qualcosa anche sui Ponti. Sono sottili, e stanno strette."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Una notte in tasca
          testo: |
            Sfili piano una lastra dalla sua scanalatura con due dita, e le vicine restano ferme. La lastra
            esce con un fruscio lungo e sottile, e in mano non pesa quasi niente. La avvolgi nel fazzoletto e
            te la metti contro il petto, sotto la giubba. Il vetro è freddo e non si scalda, e lo senti per
            tutta la discesa.
          pe: { acrobazia: 2 }
          effetti: { profondita.lente-del-sornione: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il domino
          testo: |
            La lastra si incastra a metà e tu tiri più forte, e la fila intera si piega come un mazzo di
            carte. Ne prendi al volo due e le altre si spaccano sul pavimento, e una scheggia ti apre il dorso
            della mano. Il rumore esce dalla porta e scende per la canna, e lo senti andare giù giro dopo
            giro.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare la stanza senza toccare niente"
        descrizione: "Le lastre restano dove sono. La porta in fondo riporta sulla rampa."
        costo: 2
        esito:
          titolo: Fra gli scaffali
          testo: |
            Attraversi la stanza con le mani in tasca, girando di fianco fra gli scaffali dove il passaggio si
            stringe. Lì le lastre ti passano a un dito dalla faccia, e ne senti il freddo sulla pelle. Quando
            esci dalla porta in fondo ti accorgi di aver contato le file sottovoce per tutto il tempo, e il
            numero non ti esce più dalla testa.
          effetti: { profondita.lente-del-sornione: 1, tormento: 1 }

  # ------------------------------------------------------------ 1–3 · il cielo sotto i piedi
  - id: lente-del-sornione-il-cielo-sotto-i-piedi
    immagine: ambientazione/marea-grigia
    titolo: Il cielo sotto i piedi
    sommario: "Per un tratto la rampa è di vetro, e attraverso il vetro, sotto i tuoi piedi, si vedono le stelle."
    luogo: La Lente del Sornione, la rampa di vetro
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione >= 1, profondita.lente-del-sornione <= 3]
    testo: |
      Per un giro intero la rampa diventa di vetro, senza un gradino nel punto dove comincia. Sotto i tuoi
      piedi ci sono le stelle del Sornione con le due che non conosci vicino all'orlo. Stanno così in basso
      che il corpo si convince di camminare sul soffitto del mondo. Dal bordo della rampa si vede che il vetro
      è spesso un palmo, e sotto non c'è niente che lo regga.

      {resilienza Media} Le gambe vogliono piegarsi, ma il pavimento regge e alla testa tocca soltanto
      crederci. Ti ripeti che le stelle stanno dentro il vetro e non sotto.

      Le stelle sotto il vetro non tremolano come quelle vere. Stanno ferme e nitide anche quando il
      ticchettio dal fondo ti arriva nelle suole.
    opzioni:
      - testo: "Camminare guardando le stelle"
        descrizione: "Le stelle stanno ferme, e il vetro regge. Se la testa accetta tutte e due le cose, il resto viene da sé."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Sul soffitto del mondo
          testo: |
            Cammini sul vetro con gli occhi aperti e le stelle sotto i piedi, e dopo una decina di passi il
            corpo smette di protestare e le ginocchia tornano a piegarsi da sole. A metà giro ti fermi
            addirittura a guardare le due stelle sconosciute, e ti sembrano più vicine del resto, come
            lanterne appese più in basso.
          pe: { resilienza: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: La caduta che non viene
          testo: |
            A metà giro il corpo decide che stai cadendo e ti butta a terra a braccia aperte. Resti
            sdraiat{o|a} sul vetro con la guancia contro il freddo finché la testa non torna al suo posto. Con
            l'orecchio sul vetro il ticchettio si sente più forte, e arriva da molto più in basso delle
            stelle. Poi risali gattonando dove c'è il metallo.
          effetti: { tormento: 1 }
      - testo: "Correre fino al metallo"
        descrizione: "Un giro di vetro si fa di corsa, con gli occhi sulla parete e il fiato corto."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Di corsa
          testo: |
            Corri lungo il vetro con gli occhi sulla parete, e le stelle sotto di te diventano una striscia
            chiara che non guardi. Le suole battono sul vetro con un suono pieno che la canna non ripete.
            Arrivi al metallo con il cuore in gola e le ginocchia che tremano, ma dall'altra parte.
          pe: { atletica: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il piede sul vuoto
          testo: |
            A metà corsa guardi giù senza volerlo, e il piede ti si pianta da solo come davanti a un
            precipizio. Cadi in avanti sulle mani e scivoli sul vetro per due passi, e torni indietro con i
            palmi sbucciati. Sul vetro dove sei scivolat{o|a} non resta un segno.
          effetti: { ferite: 0.5 }
      - testo: "Passare strisciando con gli occhi chiusi"
        descrizione: "A occhi chiusi il vetro è soltanto un pavimento freddo. Lungo, e freddo."
        costo: 2
        esito:
          titolo: Il pavimento freddo
          testo: |
            Chiudi gli occhi e passi strisciando, con la pancia sul vetro e le mani avanti a cercare il
            metallo. Il vetro è così liscio che le dita non trovano una giuntura per tutto il giro. Ci vuole
            molto, e il freddo ti entra nelle ossa del petto. Quando riapri gli occhi sei dall'altra parte, e
            le stelle te le senti ancora sotto la pelle.
          effetti: { profondita.lente-del-sornione: 1, tormento: 1 }

  # ------------------------------------------------------------ 2 · gli occhi di guardia e la stanza del turno
  - id: lente-del-sornione-gli-occhi-di-guardia
    immagine: bestiario/salvaguardia-precursori
    titolo: Gli occhi di guardia
    sommario: "Due dischi di vetro cerchiati di metallo galleggiano nella canna. Raccolgono la luce del Sornione e la stringono in un punto che brucia."
    luogo: La Lente del Sornione, la canna a metà
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 2]
    testo: |
      A metà della canna galleggiano sopra il vuoto due dischi di vetro cerchiati di metallo, larghi quanto
      uno scudo e senza niente che li tenga su. Ti dici che dalla parete partiranno dei fili troppo sottili
      per vederli. Quando entri nella loro luce si girano verso di te, e la luce azzurra del Sornione si
      stringe nel vetro in un punto bianco. Sul gradino davanti ai tuoi piedi la brina sfrigola e fuma, e
      lascia sul metallo un segno nero e tondo, largo un pollice.

      {armi-da-distanza Media} Ruotano su un anello lento a girarsi, e fra un colpo e l'altro ci mettono
      quanto una balestra da ricaricare. L'anello cigola a ogni scatto, e dal cigolio capisci da che parte si
      stanno girando.

      Dove la parete fa ombra la luce non arriva, e lungo quella striscia larga un braccio la brina è intatta.
    opzioni:
      - testo: "Rompere gli occhi di guardia"
        descrizione: "Sono due, e fra un colpo e l'altro sono lenti. Il vetro si rompe, se lo colpisci prima che lui colpisca te."
        combattimento: lente-del-sornione-occhi-di-guardia
        vittoria:
          titolo: I cocci
          testo: |
            Il secondo disco si spacca a mezz'aria e cade nella canna con un tintinnio lungo, giro dopo giro,
            finché non lo senti più. Il primo è caduto sulla rampa. Dentro l'anello il meccanismo è un nodo di
            ruote dentate piccolissime, e due girano ancora quando le tocchi. Gli stacchi l'anello di metallo
            e quello che resta del suo meccanismo, e te li metti nel sacco.
          effetti: { profondita.lente-del-sornione: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: Il punto bianco
          testo: |
            Il punto bianco ti trova prima sulla spalla e poi sul braccio, e la giubba ti prende fuoco in due
            posti. Risali la rampa di corsa fino all'ombra, e spegni la giubba battendola contro la parete.
            Dall'ombra guardi i due dischi che tornano a girarsi verso il vuoto nello stesso momento.
      - testo: "Passare nell'ombra della parete"
        descrizione: "Dove la parete fa ombra la luce non arriva, e senza luce gli occhi di guardia sono soltanto vetro."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Nell'ombra
          testo: |
            Scendi con la schiena contro la parete, dentro la striscia d'ombra, un passo alla volta. La parete
            alle tue spalle è gelata, e il freddo ti passa attraverso la giubba. I due dischi girano piano
            cercandoti nella luce, e tu passi sotto di loro senza che il punto bianco si accenda.
          pe: { furtivita: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il gomito nella luce
          testo: |
            Ti esce un gomito dall'ombra, e un attimo dopo la manica ti fuma. Ti butti indietro contro la
            parete e risali piano, con il braccio stretto al petto e l'odore di stoffa bruciata nel naso.
            Sulla manica resta un buco tondo dai bordi netti.
          effetti: { ferite: 0.5 }
      - testo: "Coprirsi con la giubba e correre"
        descrizione: "Una giubba sulla testa e una corsa lungo la rampa. La giubba brucerà."
        costo: 2
        esito:
          titolo: La giubba bruciata
          testo: |
            Ti tiri la giubba sulla testa e corri giù per la rampa. Sotto la stoffa non vedi niente, e dietro
            di te senti l'anello che cigola a ogni scatto. Il punto bianco ti segue e la stoffa ti fuma sulle
            spalle, e quando arrivi fuori dalla loro luce ti tocca strapparti la giubba di dosso e pestarla
            con i piedi.
          effetti: { profondita.lente-del-sornione: 1, ferite: 0.5 }

  - id: lente-del-sornione-la-stanza-del-turno
    immagine: ambientazione/rovine-dei-precursori
    titolo: La stanza del turno
    sommario: "Una stanza tonda con una sedia alta il doppio di una sedia, rivolta verso una finestrella che guarda dentro la canna."
    luogo: La Lente del Sornione, la stanza del turno
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 2]
    testo: |
      Una porta bassa dà su una stanza tonda con una sola sedia di metallo, alta il doppio del normale e
      rivolta verso una finestrella sulla canna. Sul bracciolo destro quattro solchi lisci segnano le dita che
      ci hanno tamburellato sopra. Ai piedi della sedia c'è una ciotola di semi neri, secchi da prima della
      Caduta. La ciotola è di metallo e non ha un graffio, e i semi dentro sono leggeri e vuoti.

      {empatia Media} Chi stava qui faceva un turno lungo e mangiava semi per tenersi sveglio. Non ti
      aspettavi di riconoscerti in un Precursore.

      La finestrella ha il vetro opaco di polvere, tranne un tondo lucido all'altezza della fronte di chi
      stava seduto. Da lì si vede il fondo della canna, dove qualcosa riflette le stelle.
    opzioni:
      - testo: "Guardare dalla finestrella"
        descrizione: "Lui guardava sempre lo stesso punto. Bisogna salire sulla sedia per vedere quello che vedeva."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Quello che guardava
          testo: |
            Ti arrampichi sulla sedia e appoggi la fronte alla finestrella. In fondo alla canna c'è una conca
            di vetro nero piena di stelle e rivolta verso l'alto. Intorno all'orlo cammina piano una cosa con
            le gambe lunghe. Ogni tanto si ferma e appoggia una punta sull'orlo, poi riprende a camminare.
            Prendi a mente la strada più corta per arrivarci, e scendi dalla sedia con le gambe che penzolano.
          pe: { percezione: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: La sedia alta
          testo: |
            Ti arrampichi sulla sedia e il metallo liscio ti scivola sotto le ginocchia. Cadi di schiena sul
            pavimento e la ciotola dei semi si rovescia. I semi si spargono dappertutto, e mentre li cerchi
            uno a uno nelle giunture del pavimento ti senti un{o|a} che ha rotto qualcosa in casa d'altri.
          effetti: { ferite: 0.5 }
      - testo: "Sederti al suo posto e aspettare"
        descrizione: "Una stanza fatta per aspettare insegna qualcosa a chi aspetta. Anche quello che si aspettava."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Il turno
          testo: |
            Ti siedi sul bordo della sedia e tamburelli con le dita nei solchi del bracciolo, che sono troppo
            distanti per la tua mano. Dopo un poco le dita prendono da sole il passo del ticchettio che sale
            dal fondo, e ti accorgi che la finestrella è montata su una cerniera. La apri, e dietro c'è una
            scaletta di servizio che scende dritta verso il fondo.
          pe: { empatia: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il sonno
          testo: |
            Ti siedi ad aspettare e il freddo ti addormenta. Ti svegli di soprassalto con il collo rigido e la
            bocca impastata, e con la sensazione di aver mancato il cambio del turno. Per un pezzo non ricordi
            da che parte sei venut{o|a}.
          effetti: { tormento: 1 }
      - testo: "Tornare sulla rampa e proseguire"
        descrizione: "La sedia resta a chi l'ha consumata. La rampa scende comunque."
        costo: 2
        esito:
          titolo: I semi
          testo: |
            Esci dalla stanza e riprendi la rampa, che qui si fa stretta e ripida e ha il bordo sul vuoto
            arrotondato dall'usura. Ti accorgi soltanto più in basso di avere in tasca uno dei semi neri, e di
            non ricordare di averlo preso. Lo getti nel vuoto, e non lo senti arrivare in fondo.
          effetti: { profondita.lente-del-sornione: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · il cerchio delle nove tacche e la ruota
  - id: lente-del-sornione-il-cerchio-dei-nove
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il cerchio dei nove incavi
    sommario: "Sul pavimento di un pianerottolo è inciso un cerchio di nove incavi. Uno è più profondo degli altri, e dentro c'è un occhio."
    luogo: La Lente del Sornione, il pianerottolo del cerchio
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 3]
    testo: |
      Sul pavimento del pianerottolo è inciso un cerchio largo quanto un tavolo da osteria con nove incavi
      lungo il bordo. L'incisione è profonda un dito e ha gli spigoli ancora vivi. Otto incavi sono lisci,
      mentre il nono è più profondo e porta il segno di un occhio aperto che manda la luce azzurra del
      Sornione. Dal centro parte un condotto di metallo che sparisce sotto la parete verso nord-est.

      {accademiche Difficile} Dicono i mandriani che anche le pietre nere dell'Anello del Camminatore sono
      nove. Forse c'è un incavo per ogni posto.

      Ti dici che il nono incavo è più profondo perché è stato usato più degli altri. Intorno al condotto la
      polvere del pianerottolo è disposta in righe sottili e parallele, come la sabbia su una pelle di
      tamburo.
    opzioni:
      - testo: "Ricopiare il cerchio sul quaderno"
        descrizione: "Nove incavi con un occhio in quello profondo, e un condotto che va da qualche parte. Qualcuno alla Biblioteca saprà che farsene."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: Il disegno
          testo: |
            Ricopi il cerchio sul quaderno incavo per incavo, con la lampada appoggiata al pavimento, e
            disegni l'occhio dentro quello profondo. Misuri il diametro a palmi e lo scrivi a margine. Il
            condotto lo ricopi due volte, perché la prima ti è venuto storto. Poi riprendi la rampa con il
            quaderno sotto il braccio.
          pe: { accademiche: 2 }
          effetti: { profondita.lente-del-sornione: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: L'occhio acceso
          testo: |
            Mentre disegni appoggi il palmo sull'incavo dell'occhio, e la luce ti sale nel braccio fino alla
            spalla, fredda. Sulla pagina resta l'ultima riga tirata storta fino al bordo. Per un'ora la mano
            ti trema troppo per tenere la matita, e il disegno resta a metà.
          effetti: { tormento: 1 }
      - testo: "Seguire il condotto con la lanterna"
        descrizione: "Il condotto va sotto la parete. Quello che i Precursori hanno posato con tanta cura porta sempre da qualche parte."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La nota nel condotto
          testo: |
            Segui il condotto fino alla parete, e sotto la parete trovi una fessura stretta da cui esce un
            filo d'aria. La luce della lanterna ci entra per un palmo e poi non trova più niente. Il condotto
            ci entra e vibra piano, con una nota bassa che ti arriva nei denti prima che nelle orecchie.
            Accanto alla fessura una porticina riporta sulla rampa, più giù.
          pe: { percezione: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: La fessura
          testo: |
            Infili le dita nella fessura sotto la parete per sentire dove va il condotto, e il filo d'aria che
            ne esce è così freddo che ti lascia le punte delle dita bianche e insensibili per tutto il
            pomeriggio. Finché le tieni dentro dalla fessura arriva una nota bassa, e smette appena le togli.
          effetti: { ferite: 0.5 }
      - testo: "Cercare l'incavo che riconosci"
        descrizione: "Hai già visto questo cerchio sotto la Spina dell'Eco. Laggiù l'incavo profondo aveva una riga fra due onde."
        quando: [misura.spina >= 1]
        esito:
          titolo: Due segni
          testo: |
            Trovi sul cerchio l'incavo dove sotto la Spina c'era la riga fra due onde. Qui è liscio e poco
            profondo, e sotto le dita resta freddo. Fra un incavo e l'altro c'è la stessa distanza che ricordi
            da laggiù. Ricopi tutto sul quaderno senza fretta, i due segni uno accanto all'altro, e riprendi
            la rampa.
          effetti: { profondita.lente-del-sornione: 1, informazioni.segreto: 1 }
      - testo: "Girare intorno al cerchio senza calpestarlo"
        descrizione: "Il cerchio resta dov'è. Il pianerottolo è stretto, e il bordo è sul vuoto."
        costo: 2
        esito:
          titolo: Sul bordo
          testo: |
            Giri intorno al cerchio sul filo del pianerottolo, con i talloni sul vuoto e la schiena dritta
            come un soldato. Da sotto i talloni sale l'aria fredda della canna, e il ticchettio adesso è
            vicino. Una volta dall'altra parte ti accorgi che le gambe ti tremano, e lasci che tremino prima
            di riprendere la discesa.
          effetti: { profondita.lente-del-sornione: 1, ferite: 0.5 }

  - id: lente-del-sornione-la-ruota-del-ticchettio
    immagine: ambientazione/rovine-dei-precursori
    titolo: La ruota del ticchettio
    sommario: "Il ticchettio viene da una ruota dentata grande come una macina, che chiude la rampa e gira di un dente a ogni colpo."
    luogo: La Lente del Sornione, la ruota
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 3]
    testo: |
      Il ticchettio viene da qui. Una ruota dentata grande come una macina chiude la rampa da parete a vuoto e
      gira di un dente a ogni colpo secco. È dello stesso metallo grigio della canna e non ha un punto di
      ruggine, e l'asse entra nella parete senza boccola e senza un filo di grasso. Ti dici che è lo
      scappamento di qualcosa che gira più in basso, uguale a quelli degli orologi dei campanili, e che chi
      l'ha montata l'ha fatta per durare. Fra un dente e l'altro ci sta un corpo di traverso, e il colpo ti
      arriva nelle suole prima che nelle orecchie. Oltre la ruota la rampa scende verso una luce che non è più
      azzurra.

      {atletica Media} Viene un colpo ogni due battiti di cuore, e si entra al primo per uscire al secondo. Lo
      spazio fra i denti è giusto per un corpo, e le spalle vanno tenute strette.
    opzioni:
      - testo: "Passare fra i denti al tempo giusto"
        descrizione: "Un dente, un battito, un passo. Bisogna contare con il corpo, perché la testa arriva tardi."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Fra i denti
          testo: |
            Conti due colpi a voce bassa, e al terzo ti infili fra due denti di traverso. La ruota gira con te
            dentro, e il metallo ti passa a un dito dal naso con un odore secco di pietra focaia e nessun
            odore di grasso. Al colpo dopo esci dall'altra parte e ti trovi sulla rampa, con le ginocchia
            molli e la giubba intera.
          pe: { atletica: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il dente
          testo: |
            Entri un momento in ritardo, e il dente successivo ti prende la spalla e ti spinge fuori dalla
            ruota come una mano impaziente. Finisci sulla rampa dalla parte da cui eri venut{o|a}, con il
            braccio che ti formicola fino alle dita. La ruota non ha perso il tempo nemmeno quando ti ha
            preso, e il dente che ti ha spinto passa oltre senza un segno.
          effetti: { ferite: 0.5 }
      - testo: "Bloccare la ruota con un cuneo"
        descrizione: "Un cuneo di ferro fra due denti, e la ruota si ferma. Fermarla però vuol dire fermare quello che gira sotto."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il cuneo
          testo: |
            Trovi il punto dove i denti si toccano con l'asse e ci infili il cuneo al momento giusto. La ruota
            si ferma con un gemito lungo, e per la prima volta da quando sei sces{o|a} la canna è in silenzio.
            Nel silenzio senti da sotto la rampa un rumore lento di metallo che rallenta e si ferma anche lui,
            molto più in basso. Passi dall'altra parte con calma, e prima di andare togli il cuneo. Il
            ticchettio riprende dietro di te.
          pe: { tecnologia: 2 }
          effetti: { profondita.lente-del-sornione: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il cuneo che salta
          testo: |
            Il cuneo resiste un colpo solo e poi schizza via, e ti passa accanto all'orecchio prima di sparire
            nella canna. Lo senti battere sulla parete sempre più piccolo e sempre più lontano, e il colpo del
            fondo non arriva. La ruota riprende a girare come se niente fosse, e a te resta un ronzio
            nell'orecchio sinistro.
          effetti: { tormento: 1 }
      - testo: "Aspettare il dente rotto"
        descrizione: "Su una ruota così vecchia c'è sempre un dente scheggiato, e dove manca un dente c'è più spazio. Basta aspettare che passi."
        costo: 2
        esito:
          titolo: Il giro lungo
          testo: |
            Ti siedi davanti alla ruota e la guardi girare finché passa un dente scheggiato a metà. La
            scheggiatura ha i bordi lisciati dal tempo, ed è l'unico segno di usura che trovi su tutta la
            ruota. Ci vuole un giro intero e lunghissimo prima che torni. Quando il dente rotto torna ti
            infili nel suo spazio e passi, ma il freddo dell'attesa ti è rimasto nelle ginocchia.
          effetti: { profondita.lente-del-sornione: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · l'occhio
  - id: lente-del-sornione-l-occhio
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'occhio
    sommario: "In fondo alla canna c'è una conca di vetro nero rivolta verso l'alto, piena del cielo di una notte. Intorno all'orlo cammina il compasso."
    luogo: La Lente del Sornione, il fondo della canna
    area: lente-del-sornione
    requisiti: [profondita.lente-del-sornione >= 4, misura.sornione == 0]
    testo: |
      In fondo alla canna la rampa finisce su un anello di metallo largo come una piazza, e nel mezzo c'è
      l'occhio. È una conca di vetro nero rivolta verso l'alto con dentro un cielo di notte fermo. Le due
      stelle che non conosci stanno basse verso nord-est, una sopra l'altra. Il vetro non rimanda la luce
      della lanterna, e sopra l'orlo l'aria è così fredda che ti si appanna il fiato. Ti dici che è smalto
      sotto vetro, un cielo dipinto da un artigiano molto paziente.

      Intorno all'orlo corre un quadrante a tacche fitte, e sopra cammina il compasso. Ha due gambe di metallo
      lunghe come lance e in cima un corpo piccolo, e ogni tanto si china sul vetro a misurare la distanza fra
      due stelle. Dove le punte si posano a ogni passo il metallo dell'orlo ha due solchi lucidi, scavati da
      un cammino che si ripete sempre uguale. Quando la tua ombra tocca l'orlo, il corpo si gira verso di te.

      {accademiche Media} Le stelle dentro l'occhio sono un orologio fermo, e il quadrante dice a che ora si è
      fermato. Le tacche sono troppe per le ore di una notte, e ognuna deve valere una frazione d'ora.

      {furtivita Difficile} L'occhio prende luce dall'alto, e il compasso misura soltanto le ombre. Chi si
      tiene basso dietro l'orlo non fa ombra sul vetro.

      {origine accolito-del-velo} Le deposizioni dei superstiti della Caduta conservate in cripta parlano
      tutte del suono, e nessuna del cielo.

      Sulla parete in fondo c'è una rastrelliera di lenti piccole, messe in fila per grandezza e senza un
      granello di polvere. Accanto alla rastrelliera il condotto del cerchio dei nove incavi entra nel muro.
    opzioni:
      - testo: "Affrontare il compasso"
        descrizione: "Due gambe lunghe come lance e una punta che misura quello che tocca. Il corpo sta lassù fra le gambe, lontano dalla tua lama."
        combattimento: lente-del-sornione-il-compasso
        vittoria:
          titolo: Il cielo di quella notte
          testo: |
            Il compasso si piega su una gamba e cade di traverso sull'orlo, e la punta graffia il vetro con un
            suono lungo. La lente in cima al corpo continua a girare a scatti verso le due stelle, e poi si
            ferma. La stella più grande è bianca e sta bassa sopra il nord-est, a un palmo dall'orlo, e la più
            piccola, rossa, le sta sopra di due dita. Sul quadrante cadono tutte e due sulla tacca dell'ultima
            ora prima dell'alba. Il graffio della punta resta sul vetro, sottile come un capello, e sotto il
            graffio le stelle non si sono mosse. Ricopi sul quaderno il quadrante con la sua tacca e le due
            stelle, e prima di andare sviti dalla testa del compasso la lente con cui misurava, ancora fredda.

            {accademiche Media} Le cronache dicono che il suono venne poche ore prima della frattura, e adesso
            sai anche a che ora.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.sornione: 1, oggetto.lente-del-sornione-vetro-delle-due-stelle: 1, parte.camera-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Misurato
          testo: |
            La punta del compasso ti trova al fianco e ti misura due volte, e ogni volta lascia un taglio. I
            due tagli sono paralleli e lunghi uguali, a un dito l'uno dall'altro. Risali la rampa piegat{o|a}
            su te stess{o|a}, con il ticchettio che ti insegue giro dopo giro, e quando esci dal portello
            sulle stoppie è già notte e nel vetro c'è il sole.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Copiare il cielo senza fare ombra"
        descrizione: "Chi sta basso dietro l'orlo non fa ombra sul vetro. Bisogna restare basso a lungo, e il compasso passa vicino."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Dietro l'orlo
          testo: |
            Ti muovi carponi dietro l'orlo, sotto il filo della luce, e il compasso ti passa sopra la testa
            con una gamba e poi con l'altra. Le punte si posano a un palmo dalle tue mani, e a ogni passo il
            metallo dell'orlo vibra appena. La stella più grande è bianca e sta bassa sopra il nord-est, a un
            palmo dall'orlo, e la più piccola, rossa, le sta sopra di due dita. Sul quadrante cadono tutte e
            due sulla tacca dell'ultima ora prima dell'alba. Ricopi tutto, e strisciando via prendi dalla
            rastrelliera una lente piccola e una camera di cristallo che le sta accanto. Quando metti la lente
            in tasca è fredda, e lo resta per tutta la risalita.
          pe: { furtivita: 5 }
          effetti: { misura.sornione: 1, oggetto.lente-del-sornione-vetro-delle-due-stelle: 1, parte.camera-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'ombra sul vetro
          testo: |
            Alzi la testa di un dito per vedere meglio, e la tua ombra cade sull'occhio. Il compasso si gira
            senza un rumore, e l'unica cosa che senti è l'orlo che vibra sotto le sue punte sempre più vicino.
            La punta ti apre la schiena dalla spalla al fianco prima che tu riesca a buttarti sulla rampa.
            Risali senza aver copiato niente, con le stelle negli occhi.
          effetti: { ferite: 2, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ordinare al compasso di fermarsi"
        descrizione: "La formula del Comando parla alle macchine dei Precursori. Questa misura da prima della Caduta, e forse aspetta qualcuno che le dica di smettere."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Ferma
          testo: |
            Dici la formula, e la parola ti esce in una lingua che non è la tua. Il Mana ti lascia la lingua
            fredda e un sapore di ferro in bocca. Il compasso si ferma con una gamba sollevata e resta così,
            come un airone in uno stagno. La stella più grande è bianca e sta bassa sopra il nord-est, a un
            palmo dall'orlo, e la più piccola, rossa, le sta sopra di due dita. Sul quadrante cadono sulla
            tacca dell'ultima ora prima dell'alba. Ricopi tutto con calma, e dalla rastrelliera prendi una
            lente piccola e una camera di cristallo. Quando risali il compasso è ancora fermo con la gamba
            alzata, e la lente in cima al suo corpo ti segue finché la rampa non gira.
          pe: { magia: 5 }
          effetti: { misura.sornione: 1, oggetto.lente-del-sornione-vetro-delle-due-stelle: 1, parte.camera-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La formula spezzata
          testo: |
            La formula ti si spezza in bocca, e il compasso sente soltanto la prima metà. Si gira verso di te
            e si mette a misurarti con calma dalla testa ai piedi. Le punte ti si posano ai lati degli stivali
            e risalgono a scatti, con un clic secco a ogni tacca, e alla seconda misura la punta ti entra
            nella coscia. Risali la canna trascinando la gamba, senza le stelle.
          effetti: { ferite: 1.5, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Leggere l'ora sul quadrante come all'Accademia"
        descrizione: "Un quadrante è un quadrante. All'Accademia te ne hanno fatti leggere a centinaia, e il compasso misura le stelle, non chi conta le tacche."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il conto delle tacche
          testo: |
            Resti ferm{o|a} sulla rampa fuori dall'orlo e conti le tacche del quadrante a distanza, come ti ha
            insegnato Orvald con le lenti del cortile. Le tacche stanno a un'unghia l'una dall'altra, e le
            conti a gruppi di dieci tenendo la matita in aria davanti agli occhi. La stella più grande è
            bianca e sta bassa sopra il nord-est, a un palmo dall'orlo, e la più piccola, rossa, le sta sopra
            di due dita. Cadono tutte e due sulla tacca dell'ultima ora prima dell'alba. Quando il compasso è
            dall'altra parte dell'occhio prendi dalla rastrelliera una lente piccola e una camera di
            cristallo, e risali.
          pe: { accademiche: 5 }
          effetti: { misura.sornione: 1, oggetto.lente-del-sornione-vetro-delle-due-stelle: 1, parte.camera-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Conti le tacche due volte e ti tornano due ore diverse, lontane una tacca sola. Per contarle la
            terza volta fai un passo di troppo. La tua ombra tocca l'orlo, e il compasso ti è addosso prima
            che tu abbia finito il conto. Risali la canna con un taglio sul braccio e due ore sbagliate in
            testa.
          effetti: { ferite: 1.5, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Tornare su senza toccare niente"
        descrizione: "L'occhio resta dov'è, e il compasso pure. La rampa riporta al campo."
        costo: 0
        esito:
          titolo: La lunga salita
          testo: |
            Guardi l'occhio un'ultima volta dalla rampa, con il compasso che gira piano sull'orlo, e cominci a
            risalire. La salita è più lunga della discesa. Provi a contare i giri della rampa, e a metà ti
            accorgi di aver perso il conto. Quando esci dal portello sulle stoppie, la contadina è sull'aia e
            ti guarda arrivare.
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo · l'occhio, le altre volte
  - id: lente-del-sornione-l-occhio-che-resta
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'occhio, di nuovo
    sommario: "Il compasso si è rimesso in piedi e cammina di nuovo intorno all'occhio. Il cielo di quella notte è sempre lì."
    luogo: La Lente del Sornione, il fondo della canna
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione >= 4, misura.sornione >= 1]
    testo: |
      In fondo alla canna l'occhio è come lo hai lasciato, con le due stelle basse sopra il nord-est. Il
      compasso si è rimesso in piedi con una gamba raddrizzata alla meglio e più corta dell'altra, e cammina
      sull'orlo zoppicando appena. Dove la gamba si era piegata c'è una fascia di metallo più chiaro, stretta
      intorno alla piega e ancora senza un graffio. La rastrelliera delle lenti si è riempita a metà.
      Sull'anello di metallo, oltre alle tue, non c'è nessuna impronta.

      {tecnologia Media} Qualcosa qui sotto ripara quello che rompi, con meno pezzi di prima. La fascia è
      lavorata pulita e senza rifinitura, e la gamba ci ha perso un palmo di lunghezza.
    opzioni:
      - testo: "Abbattere di nuovo il compasso"
        descrizione: "Zoppica, e il corpo è sempre piccolo e lontano. Dentro, forse, c'è ancora qualcosa da prendere."
        combattimento: lente-del-sornione-il-compasso
        vittoria:
          titolo: La gamba corta
          testo: |
            Il compasso cade sulla gamba corta e non si rialza, e nella caduta la fascia della riparazione si
            apre. Dentro il metallo è ancora lucido di lavorazione. Nel corpo trovi una camera di cristallo
            più piccola di quella dell'altra volta e un guscio chiuso, e li prendi prima che qualcosa venga a
            ripararlo.
          effetti: { parte.camera-2: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: La punta
          testo: |
            Anche zoppo, il compasso misura bene. La punta ti trova due volte,
            e risali la canna premendoti la mano sul fianco.
          effetti: { tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Svuotare la rastrelliera strisciando dietro l'orlo"
        descrizione: "Le lenti nuove sono lì, accanto al muro. Bisogna restare bassi, come la prima volta."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Le lenti nuove
          testo: |
            Strisci dietro l'orlo con il compasso che zoppica sopra di te, e arrivi alla rastrelliera. Il
            passo zoppo batte lungo e corto sull'orlo, e tu impari quel tempo strisciando. Le lenti nuove sono
            ancora tiepide di lavorazione, in una canna dove tutto il resto è freddo. Ne prendi due e un
            guscio chiuso che sta sul ripiano più basso, e risali senza fare ombra.
          pe: { furtivita: 2 }
          effetti: { reliquie.frammento-inciso: 2, reperto.sigillato: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'ombra
          testo: |
            Il compasso zoppica proprio dove non te lo aspetti, e la tua ombra gli finisce sotto la punta. La
            gamba corta lo fa pendere di lato, e la punta ti arriva da un'altezza che non avevi calcolato. Ti
            graffia la spalla, e risali a mani vuote con la manica tagliata in una riga dritta.
          effetti: { ferite: 1 }
          vai: superficie-fratturata
      - testo: "Guardare le stelle e risalire"
        descrizione: "Il cielo di quella notte lo conosci già. A volte basta guardarlo."
        costo: 0
        esito:
          titolo: Due stelle
          testo: |
            Resti sulla rampa a guardare le due stelle per un tempo che non misuri, e poi risali giro dopo
            giro fino al campo. L'aria sopra il vetro ti ha lasciato le ginocchia rigide di freddo, e per i
            primi giri della rampa le senti scricchiolare. Fuori è sera, e nel cielo vero le due stelle non ci
            sono.
          vai: superficie-fratturata

