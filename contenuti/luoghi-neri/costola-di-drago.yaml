# La Costola di Drago, spedizione di un luogo nero (docs/piano-superficie.md, «Le nove spedizioni dei luoghi neri»).
# Sulle alture aride a sud di Ghoran l'arco di metallo nero che esce dal fianco di una collina è la punta di una
# canna di risonanza lunga quanto la collina, che vibra giorno e notte sulla stessa nota bassa (codex
# sf-costola-di-drago). In fondo alla canna l'accordatore, una macchina con le braccia a martello, la batte per
# tenerla sulla nota. La misura del luogo è la nota (misura.costola): il diapason di metallo nero che l'accordatore
# tiene nella culla e che, battuto, la ripete.
# - Ingresso: `costola-di-drago-la-collina` (Superficie, traccia.costola >= 3), ripetibile.
# - Stanze in fasce di profondità (una stanza superata non ricompare nella stessa visita):
#   0 la crepa sotto l'arco o il cerchio di ossa; 1 la galleria degli scavatori o la volta che piove;
#   1-2 gli scrostatori (combattimento contro gregari); 2 il portello nella canna o la sala dei contrappesi;
#   3 dentro la canna o la piastra dei nove incavi.
# - Cuore a 4: `costola-di-drago-l-accordatore` (misura.costola == 0), boss o prove Difficili; la vittoria dà la
#   nota, il martello d'accordatura e reliquie. Poi `costola-di-drago-la-culla-vuota` (misura.costola >= 1),
#   ripetibile, rende parti e reperti.
# Il segno che lega il luogo agli altri: un cerchio di nove incavi con uno inciso più a fondo, sulla piastra del
# corridoio e sulla culla del diapason. Il condotto sigillato che esce dalla camera dell'accordatore porta la nota
# altrove, sotto la Superficie. I Tamburi di Fondo bussano sulla stessa nota.
aree:
  - id: costola-di-drago
    immagine: ambientazione/rovine-dei-precursori
    nome: La Costola di Drago
    sommario: "La costola che si vede da fuori è la punta di una canna lunga quanto la collina, e la canna vibra sempre sulla stessa nota."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Sotto l'arco di metallo nero la collina è cava. La costola che si vede da fuori è la punta di una canna
      larga come la navata di una chiesa, che scende nella terra e sparisce nel buio. Per tutto il tratto che
      la lampada riesce a illuminare il metallo non ha una saldatura né un chiodo, e la terra si è sbriciolata
      contro il suo fianco senza intaccarlo. Il metallo vibra giorno e notte su una nota troppo bassa per
      l'orecchio, e la senti nei denti e nelle ginocchia quando stai ferm{o|a}.

      Nella terra a un palmo dalla canna corrono le tracce dei topi, e nessuna sale sul metallo. Sul metallo
      la polvere si dispone in linee sottili che si spostano piano.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: costola-di-drago-la-collina
    presso: i-luoghi-neri
    immagine: ambientazione/ghoran
    titolo: La collina dove le capre non salgono
    sommario: "Sulle alture aride a sud di Ghoran un arco di metallo nero esce dal fianco di una collina."
    luogo: Superficie Fratturata, le alture aride a sud di Ghoran
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.costola >= 3]
    testo: |
      Le capre dei pastori pascolano dappertutto tranne che su una collina sola. Dal suo fianco esce un arco
      di metallo nero curvo come la costola di una bestia sepolta, e intorno l'erba è quasi rasa. Sull'arco
      non c'è un punto di ruggine né una macchia di licheni, e i sassi intorno ne sono coperti fino in cima.
      Le capre più vicine pascolano con il muso rivolto dall'altra parte, e quando il vento gira verso la
      collina alzano la testa tutte insieme.

      Dove il metallo entra nella collina la terra si è aperta in una crepa. Sul bordo qualcuno ha lasciato
      una lattina con dentro due palline di cera gialla e il coperchio legato con uno spago. Lo spago è
      sbiadito dal sole, e la cera porta ancora l'impronta di due dita.

      {origine fuggiasco-di-ghoran} Dai recinti di Ghoran queste alture si vedevano a sud, gialle fino
      all'orizzonte. Nessuno scappava da questa parte perché quassù non c'è acqua, e adesso sai che c'era
      anche un'altra ragione.

      Appoggi il palmo sull'arco, e il metallo è fresco anche dove lo batte il sole. Ti ronza fino al gomito.
    opzioni:
      - testo: "Calarsi nella crepa"
        descrizione: "La crepa scende ripida lungo il metallo. Bisogna tenersi alla terra, perché chi tocca la canna se ne pente."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Lungo il metallo
          testo: |
            Scendi con la schiena contro la terra e i piedi puntati sulle radici secche, senza mai toccare il
            metallo. A un palmo dalla spalla la polvere sulla canna si dispone in linee sottili che si
            spostano piano mentre scendi. Dopo una decina di braccia la crepa si allarga, e sotto di te si
            apre il buio della collina cava, con la canna che ci corre dentro.
          pe: { atletica: 2 }
          vai: costola-di-drago
        fallimento:
          titolo: La mano sul metallo
          testo: |
            A metà discesa la terra ti cede sotto il piede e ti aggrappi all'arco. La vibrazione ti sale nel
            braccio fino alla spalla, e per non lasciare la presa risali. Resti sedut{o|a} sull'erba a
            scuoterti la mano finché non smette di formicolare. Intorno all'arco le cavallette hanno smesso di
            saltare, e riprendono soltanto quando ti allontani.
          effetti: { ferite: 0.5 }
      - testo: "Cercare dove la terra è smossa"
        descrizione: "La cera l'ha lasciata uno che è sceso, e chi scende lascia una strada."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: I gradini scavati
          testo: |
            Giri intorno all'arco a passi corti, e sul lato in ombra trovi una fila di gradini scavati nella
            terra con la punta di una pala, mezzi coperti dall'erba. Sono corti e fitti e ognuno tiene appena
            mezzo piede, come se chi li ha scavati avesse avuto fretta di finire. Scendono accanto al metallo
            senza toccarlo, fino al buio della collina cava.
          pe: { percezione: 2 }
          vai: costola-di-drago
        fallimento:
          titolo: Terra uguale
          testo: |
            La terra intorno all'arco è rasa e asciutta dappertutto. Dopo un'ora di giri ti accorgi di aver
            stretto i denti per tutto il tempo. Ti fa male la mascella, e scendi dalla collina a riposarla. A
            metà discesa la mascella si scioglie da sola, nel punto preciso dove ricomincia l'erba alta.
          effetti: { tormento: 0.5 }
      - testo: "Legare il cavallo all'arco e scendere con la corda"
        descrizione: "Il cavallo non vuole avvicinarsi al metallo. Legato al ginepro più vicino, però, tiene una corda meglio di un uomo."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: La corda tesa
          testo: |
            Il cavallo si ferma a trenta passi dall'arco e non c'è verso di portarlo più avanti. La pelle del
            collo gli trema a ondate, e non smette nemmeno quando gli metti la mano sul muso. Leghi la corda
            alla sella e lo lasci lì, con le orecchie basse, e ti cali nella crepa con la corda tesa fino al
            buio della collina cava.
          vai: costola-di-drago
      - testo: "Allargare la crepa con la pala"
        descrizione: "Ci vuole il pomeriggio, e la terra secca viene via facile. La nota però non si ferma mentre scavi."
        costo: 2
        esito:
          titolo: Il pomeriggio di pala
          testo: |
            Scavi fino a quando il sole tocca le colline, con la cera nelle orecchie e un fazzoletto sulla
            bocca contro la polvere. Con la cera la nota non la senti, e la senti lo stesso nel manico della
            pala. Alla fine la crepa è larga abbastanza per scendere in piedi, e scendi.
          vai: costola-di-drago

  # ------------------------------------------------------------ 0 · la crepa e il cerchio di ossa
  - id: costola-di-drago-la-crepa
    immagine: ambientazione/rovine-dei-precursori
    titolo: La crepa sotto l'arco
    sommario: "In fondo alla crepa la terra fa un gomito stretto contro il metallo."
    luogo: La Costola di Drago, il fondo della crepa
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago == 0]
    testo: |
      In fondo alla crepa la terra fa un gomito contro il metallo. Per andare avanti strisci in un cunicolo
      basso quanto un forno, con la curva nera della canna a un palmo dalla faccia. Il metallo è così vicino
      che ne senti il fresco sulla pelle, e le labbra ti formicolano.

      {acrobazia Media} Sui gomiti e sulle punte dei piedi il corpo passa senza toccare niente, se tieni il
      sedere basso.

      Oltre il gomito si vede una luce grigia. Sulla terra battuta chi è passato prima di te ha lasciato una
      striscia liscia larga quanto una schiena.
    opzioni:
      - testo: "Strisciare senza toccare la canna"
        descrizione: "Un palmo di spazio fra la terra e il metallo. Basta restare dentro quel palmo."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Sui gomiti
          testo: |
            Strisci sui gomiti con la guancia contro la terra, e il metallo ti passa accanto all'orecchio
            senza sfiorarti. Per tutto il tratto l'orecchio da quel lato ti si tappa, e l'altro sente soltanto
            il tuo respiro. Dall'altra parte del gomito ti alzi in una cavità più larga, con la canna che
            continua a scendere nel buio.
          pe: { acrobazia: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: La spalla sul metallo
          testo: |
            A metà del gomito la spalla tocca la canna, e la nota ti entra nelle ossa fino alla mascella.
            Torni indietro di schiena, con la spalla che ronza, e ti serve un po' prima di riprovare. Sulla
            giubba la polvere si è disposta in righe sottili nel punto che ha toccato il metallo.
          effetti: { ferite: 0.5 }
      - testo: "Seguire la striscia di chi è passato"
        descrizione: "Una schiena ha già fatto questa strada. Dove lei è passata, ci si passa."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La strada di un altro
          testo: |
            La striscia liscia gira larga dove il cunicolo si stringe, e passa sotto una radice che da sopra
            non vedevi. Chi l'ha lasciata è rimasto sempre a un palmo e mezzo dalla canna anche nelle curve.
            La segui, e arrivi dall'altra parte del gomito senza mai avvicinarti al metallo.
          pe: { percezione: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: La striscia che torna
          testo: |
            La striscia gira su se stessa e torna verso l'uscita. Nell'ultimo tratto si allarga, come se chi
            l'ha lasciata si fosse girato a fatica nel cunicolo. Ci ha rinunciato, e tu te ne accorgi quando
            hai già la luce del giorno sulla faccia.
          effetti: { tormento: 0.5 }
      - testo: "Scavare il gomito e allargarlo"
        descrizione: "Con la pala e le mani il gomito si allarga. Ci vuole tempo, e la terra è piena della nota."
        costo: 2
        esito:
          titolo: La terra che trema
          testo: |
            Scavi stes{o|a} su un fianco, una manciata di terra alla volta, e ogni manciata ti trema in mano
            come un pugno di api. Più scavi verso il metallo e più la terra è fresca. Quando il gomito è largo
            abbastanza hai le dita intorpidite fino alle nocche.
          effetti: { profondita.costola-di-drago: 1, ferite: 0.5 }

  - id: costola-di-drago-il-cerchio-di-ossa
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il cerchio di ossa
    sommario: "In una cavità accanto alla canna le ossa di capra sono disposte in cerchi perfetti. Nessuno le ha messe così."
    luogo: La Costola di Drago, la prima cavità
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago == 0]
    testo: |
      La prima cavità è larga come un'aia, e la canna ne attraversa il soffitto in diagonale. Per terra ci
      sono molte ossa di capra lisce come sapone, disposte in cerchi concentrici intorno al punto dove la
      canna è più vicina al suolo. Fra i cerchi la terra è pulita. Le ossa non hanno segni di denti, e i
      cerchi sono a un passo l'uno dall'altro fino quasi alle pareti.

      In mezzo alle ossa c'è un collare di cuoio con un campanaccio di latta che non suona più. Il cuoio è
      secco e spaccato, e il batacchio è fermo contro la latta in una crosta di ruggine.

      Dall'altra parte delle ossa, lungo la canna, la cavità continua in discesa.
    opzioni:
      - testo: "Camminare sulle linee pulite"
        descrizione: "Fra un cerchio e l'altro la terra è ferma, perché la nota lì non arriva."
        prova: { attributo: mentale, abilita: [tecnologia, natura], difficolta: Media }
        successo:
          titolo: Dove la terra è ferma
          testo: |
            Cammini sulle linee di terra pulita fra un cerchio e l'altro, dove la nota non arriva e le suole
            restano ferme. In certi tratti la linea è così stretta che metti un piede davanti all'altro,
            tallone contro punta. Arrivi dall'altra parte senza aver toccato un osso, e i denti ti si
            sciolgono per la prima volta da quando sei sces{o|a}.
          pe: { tecnologia: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: Il cerchio che si sposta
          testo: |
            La linea pulita si sposta sotto i tuoi piedi mentre ci cammini, e ti ritrovi in mezzo alle ossa
            che tremano. Le ossa ti battono contro gli stivali con un ticchettio fitto e uguale. Torni al
            bordo della cavità con le caviglie che ronzano.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare le ossa a occhi bassi"
        descrizione: "Sono ossa di capra. Basta non pensare a quanto ci hanno messo a disporsi così."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Le ossa che tintinnano
          testo: |
            Attraversi le ossa guardandoti gli stivali, e le senti tintinnare piano a ogni passo, come
            stoviglie in una cassa. Sono leggere e vuote dentro, e sotto la suola si spostano senza rompersi.
            Dall'altra parte non ti volti. Il campanaccio di latta resta dov'era.
          pe: { resilienza: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: Il campanaccio
          testo: |
            A metà strada calpesti il campanaccio, e il campanaccio suona per la prima volta da chissà quanti
            anni. È un suono sottile e storto, sopra la nota. Le ossa più vicine smettono di tremare finché il
            suono non si spegne. Torni indietro di corsa senza sapere bene perché.
          effetti: { tormento: 0.5 }
      - testo: "Girare largo lungo la parete"
        descrizione: "La parete è lontana dalla canna, e il giro è lungo. Si arriva dall'altra parte con le mani sporche."
        costo: 2
        esito:
          titolo: Lungo la parete
          testo: |
            Giri intorno alla cavità con la spalla contro la parete. La terra si sbriciola e ti riempie il
            colletto, e l'ultimo cerchio di ossa passa a due passi dai tuoi piedi. Arrivi dall'altra parte con
            la polvere fin dentro le orecchie, e una crosta di terra secca che ti gratta il collo per tutto il
            resto della discesa.
          effetti: { profondita.costola-di-drago: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · la galleria e la volta che piove
  - id: costola-di-drago-la-galleria
    immagine: ambientazione/rovine-dei-precursori
    titolo: La galleria degli scavatori
    sommario: "Lungo la canna corre una galleria puntellata con travi di ginepro. Qualcuno ha scavato fin qui, e poi si è fermato."
    luogo: La Costola di Drago, la galleria lungo la canna
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago == 1]
    testo: |
      Lungo la canna corre una galleria scavata a mano e puntellata con travi di ginepro storte. A ogni
      sussulto le travi lasciano cadere un filo di polvere. Il ginepro è grigio e spaccato per lungo, e
      accanto il metallo della canna non ha un graffio. Sul pavimento le impronte di stivali chiodati e i
      solchi di una carriola si fermano davanti a un mucchio di terra franata. Vicino alla frana le impronte
      sono più fonde, di uno che spingeva la carriola piena.

      {tecnologia Media} Le travi le ha messe uno che sapeva il mestiere, ma per un terreno fermo. Qui il
      terreno balla, e i cunei si sono allentati tutti nello stesso verso.

      Dietro la frana la galleria continua, e sotto il soffitto resta un braccio di buio.
    opzioni:
      - testo: "Rimettere in sesto i puntelli e passare"
        descrizione: "I cunei si sono allentati tutti nello stesso verso. Basta ribatterli all'incontrario."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: I cunei ribattuti
          testo: |
            Ribatti i cunei con il manico del coltello, uno per trave, all'incontrario di come li ha spinti la
            nota. Il ginepro è secco fino al cuore, e a ogni colpo ne cade una scaglia grigia. Le travi
            smettono di perdere polvere. Sposti la terra della frana quanto basta per passare, e la galleria
            continua lungo la canna.
          pe: { tecnologia: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: La trave che scende
          testo: |
            Ribatti il primo cuneo, e la trave scende di un dito con un gemito di legno. Ti tiri indietro
            mentre una lingua di terra ti copre gli stivali, e aspetti che la galleria smetta di tremare più
            del solito. La terra nuova arriva fino alla canna, e sul metallo scivola via senza lasciare un
            segno.
          effetti: { ferite: 0.5 }
      - testo: "Strisciare sopra la frana"
        descrizione: "Fra la terra e il soffitto c'è un braccio di buio. Un braccio basta, se non ci si ferma."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Sopra la frana
          testo: |
            Ti infili fra la frana e il soffitto e strisci sulla terra smossa, con la lampada spinta avanti a
            mano. Il soffitto ti sfiora la nuca, e a ogni sussulto della canna ti lascia cadere la terra nel
            colletto. Dall'altra parte scivoli giù sul sedere fino ai solchi della carriola. Da lì i solchi
            ricominciano a scendere.
          pe: { atletica: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: La terra in bocca
          testo: |
            A metà frana la terra sotto la pancia scivola indietro e ti porta con sé. Ti ritrovi ai piedi del
            mucchio con la bocca piena di terra, e sputi per un bel pezzo. La terra sa di ferro, e ti
            scricchiola fra i denti anche dopo.
          effetti: { ferite: 0.5 }
      - testo: "Scavare la frana come avrebbero fatto loro"
        descrizione: "La carriola è ancora lì. Gli scavatori hanno lasciato il lavoro a metà, e lo finisci tu."
        costo: 2
        esito:
          titolo: Il lavoro a metà
          testo: |
            Riempi la carriola e la vai a svuotare in fondo alla galleria tante volte da perdere il conto,
            finché la frana non è un mucchio basso. La ruota della carriola è di legno pieno e cigola a ogni
            giro sul mozzo asciutto. Sul fondo trovi una pala con il manico spezzato e un sacchetto di cuoio
            con dentro un pezzo di pane diventato pietra. La nota ti ha tenuto compagnia per tutto il tempo.
          effetti: { profondita.costola-di-drago: 1, tormento: 0.5 }

  - id: costola-di-drago-la-volta-che-piove
    immagine: ambientazione/rovine-dei-precursori
    titolo: La volta che piove
    sommario: "In una sala bassa la vibrazione stacca i sassi dal soffitto. Cadono di continuo, e cadono a tempo."
    luogo: La Costola di Drago, la sala della ghiaia
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago == 1]
    testo: |
      La sala è bassa e lunga, e la canna la attraversa sopra la tua testa come una trave di casa. Dal
      soffitto piove ghiaia che rimbalza sulla canna e copre il pavimento fino alla caviglia. I sassi sono
      tondi e tutti della misura di un'unghia, e sul metallo dove rimbalzano non resta un segno. Dall'altra
      parte si vede un'apertura nera.

      {percezione Media} I sassi non cadono a caso. Ne vengono giù tre, poi c'è una pausa lunga quanto un
      passo e poi altri tre.

      Ti tiri il cappuccio sulla testa, e un sasso ti colpisce la spalla prima che tu abbia finito.
    opzioni:
      - testo: "Passare nelle pause"
        descrizione: "Tre sassi e una pausa. Un passo per ogni pausa, e si arriva dall'altra parte."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Un passo per pausa
          testo: |
            Conti i sassi a mezza voce e fai un passo in ogni pausa, come in un ballo di paese dove il
            musicista è sordo. Il conto non sbaglia mai, e dopo i primi dieci passi i piedi lo tengono da
            soli. Arrivi all'apertura nera con un solo livido sul polso, e la sala continua a piovere alle tue
            spalle.
          pe: { percezione: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Al quarto passo sbagli il conto, e tre sassi ti arrivano in testa uno dopo l'altro. Torni indietro
            con le mani sul cappuccio e un bernoccolo che cresce sotto la stoffa. Dietro di te la ghiaia
            riprende a cadere tre sassi alla volta senza perdere un colpo.
          effetti: { ferite: 0.5 }
      - testo: "Correre a testa bassa"
        descrizione: "Sono sassolini. Fanno male, ma la sala è lunga soltanto trenta passi."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Trenta passi
          testo: |
            Corri con le braccia sopra la testa e la ghiaia che ti scricchiola sotto gli stivali. Ti prendi
            quattro sassi sui gomiti e uno sulla nuca, e all'apertura nera ti fermi a contarli. Il sasso che
            ti è rimasto nel cappuccio è freddo e liscio come se l'avesse lavorato un fiume.
          pe: { atletica: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: La ghiaia sotto i piedi
          testo: |
            La ghiaia ti scivola sotto gli stivali al terzo passo, e cadi in ginocchio sotto la pioggia di
            sassi. Torni indietro a carponi con le braccia sulla testa. Sulle ginocchia ti restano due file di
            piccoli lividi tondi.
          effetti: { ferite: 0.5 }
      - testo: "Passare sotto la canna, dove i sassi rimbalzano lontano"
        descrizione: "Proprio sotto la canna i sassi rimbalzano via. Il metallo però è a un palmo dalla testa."
        costo: 2
        esito:
          titolo: Sotto la trave
          testo: |
            Cammini curv{o|a} proprio sotto la canna, dove i sassi rimbalzano sul metallo e cadono più in là.
            Ci vuole poco, e per tutto il tempo la nota ti preme sulla nuca come una mano. A un palmo dalla
            testa il metallo è asciutto e freddo, e la ghiaia ci rimbalza sopra senza un graffio. Arrivi
            all'apertura nera con un ronzio dietro gli occhi che ti dura fino alla sala dopo.
          effetti: { profondita.costola-di-drago: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 1–2 · gli scrostatori
  - id: costola-di-drago-gli-scrostatori
    immagine: bestiario/salvaguardia-precursori
    titolo: Gli scrostatori
    sommario: "Sulla canna camminano due macchine piatte come scarafaggi, che grattano via la polvere dal metallo. Ti scambiano per una crosta."
    luogo: La Costola di Drago, il dorso della canna
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago >= 1, profondita.costola-di-drago <= 2]
    testo: |
      Qui la canna corre a mezza altezza, e sul suo dorso camminano due macchine piatte e larghe come scudi,
      con sei zampe sottili e una fila di lame corte sotto la pancia. Grattano il metallo e lasciano dietro di
      sé una striscia lucida. Un passo dopo di loro la polvere ricomincia a posarsi sulla striscia in linee
      sottili. Le zampe battono sul metallo un ticchettio fitto che si sente sopra la nota.

      {armi-da-mischia Media} La pancia la mostrano soltanto quando si alzano sulle zampe, ed è il momento di
      colpire.

      Quando passi sotto la canna la prima macchina gira su se stessa e scende verso di te con le lame che
      grattano l'aria.
    opzioni:
      - testo: "Affrontare gli scrostatori"
        descrizione: "Sono due, e mostrano la pancia quando si alzano per colpire."
        combattimento: costola-di-drago-scrostatori
        vittoria:
          titolo: Le zampe ferme
          testo: |
            Il secondo scrostatore cade sulla schiena con le zampe che grattano l'aria, e piano piano smette.
            Gli stacchi una lama dalla pancia, e sotto la lama c'è un pezzo di macchina che si stacca con un
            clic. La lama è corta e leggera, e il filo è consumato in una curva uguale a quella della canna.
          effetti: { profondita.costola-di-drago: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: Grattato via
          testo: |
            Gli scrostatori ti salgono addosso uno dopo l'altro e ti grattano come grattano la canna, con la
            stessa pazienza. Riesci a rotolare via sotto il metallo e ti allontani strisciando, con la giubba
            a brandelli. Quando ti volti sono già tornati sul dorso della canna, e grattano nel punto dove li
            avevi interrotti.
      - testo: "Restare fermi contro la terra"
        descrizione: "Puliscono il metallo e lasciano stare la terra. Chi resta contro la terra forse non è una crosta."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Non una crosta
          testo: |
            Ti appiattisci contro la parete di terra e resti ferm{o|a}, con la lampada coperta. Lo scrostatore
            ti arriva a un palmo e ti tasta la manica con una zampa fredda e leggera, due volte nello stesso
            punto. Poi torna sulla canna. Li lasci lavorare e passi oltre quando ti voltano la schiena.
          pe: { furtivita: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: La manica
          testo: |
            Lo scrostatore ti tasta la manica, e la manica si muove. Le lame ti aprono la stoffa e un po' di
            pelle sotto, e torni indietro di corsa con il braccio stretto al petto. I tagli sono dritti e
            paralleli, alla distanza delle lame.
          effetti: { ferite: 0.5 }
      - testo: "Tirare un sasso sulla canna più avanti"
        descrizione: "Un sasso che batte sul metallo è una crosta nuova. Se vanno a pulirla, il passaggio resta libero."
        costo: 2
        esito:
          titolo: La crosta nuova
          testo: |
            Tiri sassi sulla canna più avanti finché uno non ci resta incastrato, e gli scrostatori ci corrono
            sopra tutti e due. Passi sotto il metallo mentre grattano. Il sasso lo tolgono in pochi colpi, e
            poi continuano a grattare il punto pulito. Uno dei sassi però ti è rimbalzato sulla fronte, e te
            ne accorgi quando ti cola il sangue in un occhio.
          effetti: { profondita.costola-di-drago: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · il portello e i contrappesi
  - id: costola-di-drago-il-portello
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il portello nella canna
    sommario: "Sul fianco della canna c'è un portello rotondo, chiuso. Batte insieme alla nota, e la nota non si ferma mai."
    luogo: La Costola di Drago, il portello
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago == 2]
    testo: |
      Più in basso la galleria finisce contro il fianco della canna, dove il metallo ha un portello rotondo
      con una maniglia ad anello. Il portello trema nel telaio e batte un colpo sordo a intervalli lunghi.
      Dall'interno arriva la nota, più forte di prima. Il telaio è largo due braccia ed entra nella canna
      senza una saldatura, e la maniglia ti arriva all'altezza del petto.

      {espressivita Media} Il portello batte fuori tempo. La canna canta una nota sola e il portello le va
      dietro con mezzo battito di ritardo, come un cantore stonato in un coro di paese.

      Sulla maniglia c'è un nodo di corda vecchia, una canapa che si sfalda appena la tocchi. Qualcuno l'ha
      tagliato di netto.
    opzioni:
      - testo: "Aprirlo quando il colpo si ferma"
        descrizione: "Fra un colpo e l'altro il portello è fermo. Basta tirare in quel momento."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: Fuori tempo
          testo: |
            Tieni il tempo battendo il piede, come quando aspetti la tua entrata in una canzone, e tiri la
            maniglia nella pausa. Il portello è spesso una spanna e si apre senza resistenza sotto due dita.
            Dentro c'è il buio della canna, e la nota ti viene incontro come un vento caldo.
          pe: { espressivita: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: Il colpo nel polso
          testo: |
            Tiri nel momento sbagliato, e il portello ti restituisce il colpo nella maniglia. Il polso ti si
            piega all'indietro, e per un pezzo non riesci a chiudere la mano. Nel telaio il portello riprende
            a battere, sempre mezzo battito dopo la nota.
          effetti: { ferite: 0.5 }
      - testo: "Cercare il fermo del telaio"
        descrizione: "Un portello che trema ha un fermo allentato. Stringerlo vuol dire farlo stare zitto."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il fermo
          testo: |
            Sotto il bordo del telaio trovi un perno che sporge di un dito, e lo spingi dentro con il palmo.
            Il perno entra fino in fondo con uno scatto, e sotto le dita senti il telaio fermarsi. Il portello
            smette di battere e si apre da solo, piano, come una porta che aspettava soltanto il permesso.
          pe: { tecnologia: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: Il perno caldo
          testo: |
            Il perno che trovi sotto il bordo è caldo come una pentola sul fuoco, e lo lasci andare con un
            urlo. Ti succhi il pollice per un pezzo, sedut{o|a} davanti al portello che continua a battere. A
            due dita dal perno la canna è fresca come prima.
          effetti: { ferite: 0.5 }
      - testo: "Legare la maniglia e tirare da lontano"
        descrizione: "Chi è venuto prima ha fatto così, e la corda l'ha dovuta tagliare. Qualcosa vorrà dire."
        costo: 2
        esito:
          titolo: La corda tagliata
          testo: |
            Leghi una corda alla maniglia accanto al nodo vecchio e tiri da dieci passi. Il portello si apre
            di colpo e la nota ti arriva addosso tutta insieme, e ti siedi per terra senza volerlo. Per
            qualche battito non senti più le tue mani sulla corda. Capisci perché l'altro ha tagliato la
            corda, e quando ti rialzi fai lo stesso.
          effetti: { profondita.costola-di-drago: 1, tormento: 1 }

  - id: costola-di-drago-i-contrappesi
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sala dei contrappesi
    sommario: "Dal soffitto pendono pesi di metallo grandi come campane, appesi a catene, che oscillano piano. Tengono ferma la canna."
    luogo: La Costola di Drago, la sala dei contrappesi
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago == 2]
    testo: |
      In una sala alta la canna passa sotto una fila di pesi grandi come campane, appesi a catene che salgono
      oltre la luce della lampada. Ognuno poggia sulla canna con un cuscinetto di feltro e oscilla appena
      nello stesso verso. Le maglie delle catene sono lunghe quanto un avambraccio e lisce di usura dove si
      toccano, e in tutta la sala non c'è una macchia di ruggine. Il pavimento lontano è coperto di schegge di
      pietra, e per passare resta solo il dorso della canna.

      Quando un peso si sposta il feltro fa sulla canna un tonfo basso, che arriva ai piedi prima che alle
      orecchie.

      Uno dei pesi è più basso degli altri e ha il feltro consumato fino al metallo.
    opzioni:
      - testo: "Camminare sul dorso della canna fra i pesi"
        descrizione: "Il dorso è largo quanto una trave. Ci si cammina chinati, con i pesi che oscillano a un palmo."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: La trave che canta
          testo: |
            Cammini sul dorso della canna con le braccia larghe e le ginocchia molli, e la nota ti sale su per
            le gambe. Ti chini sotto ogni peso nel momento in cui si sposta, e il feltro ti passa sopra la
            nuca così vicino che ti muove i capelli. Dall'altra parte scendi su una sporgenza di roccia, e ti
            tremano le cosce.
          pe: { acrobazia: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: Il peso basso
          testo: |
            Il peso basso ti prende alla spalla mentre ti chini, e ti spinge giù dal dorso. Ti aggrappi al
            bordo della canna con le dita, e mentre resti appes{o|a} il metallo ti vibra sotto i polpastrelli
            fino ai denti. Torni su a fatica, dalla parte da cui eri partit{o|a}.
          effetti: { ferite: 0.5 }
      - testo: "Capire il giro dei pesi"
        descrizione: "Oscillano tutti nello stesso verso e con lo stesso ritmo. Chi lo conosce passa senza chinarsi."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il giro
          testo: |
            Guardi i pesi oscillare per un po', e capisci che si spostano uno dopo l'altro come una fila di
            danzatori. Ogni peso parte quando quello prima arriva in cima alla corsa, e le catene
            scricchiolano tutte sulla stessa battuta. Cammini dietro l'onda e resti sempre nel varco che hanno
            appena lasciato, e arrivi dall'altra parte senza chinare la testa una volta.
          pe: { tecnologia: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: Fuori dal giro
          testo: |
            Parti con l'onda e la perdi al terzo peso, che ti passa davanti al naso con un soffio d'aria
            fredda. Torni indietro con il cuore che batte forte, e ti siedi a guardare i pesi da lontano. Da
            lì vedi che il peso basso arriva sempre un poco dopo gli altri.
          effetti: { tormento: 0.5 }
      - testo: "Calarsi sul pavimento e risalire dall'altra parte"
        descrizione: "Sotto ci sono le schegge, e una corda lunga. Si arriva, con qualche taglio."
        costo: 2
        esito:
          titolo: Le schegge
          testo: |
            Ti cali con la corda fra le schegge di pietra, che hanno gli spigoli vivi come vetro rotto, e
            attraversi la sala dal basso. Le schegge hanno il grigio delle pareti e sopra non c'è un filo di
            polvere. Per risalire dall'altra parte ti tagli i palmi due volte, e sopra di te i pesi continuano
            a oscillare sulla loro battuta.
          effetti: { profondita.costola-di-drago: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · dentro la canna e la piastra dei nove incavi
  - id: costola-di-drago-dentro-la-canna
    immagine: ambientazione/rovine-dei-precursori
    titolo: Dentro la canna
    sommario: "Dentro la canna la nota riempie tutto. Le parole scivolano via dalla testa, una alla volta."
    luogo: La Costola di Drago, dentro la canna
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago == 3]
    testo: |
      Dentro, la canna è un tunnel rotondo di metallo nero che scende con la stessa pendenza di fuori. Le
      pareti non hanno una saldatura, e il metallo non rimanda la luce della lampada. Qui la nota non si sente
      con le orecchie. Ti riempie la testa da dentro, e dopo pochi passi le parole cominciano a scivolarti
      via. Cerchi il nome della lampada che hai in mano e non lo trovi.

      {resilienza Media} Le parole tornano se le dici forte, perché la testa ha bisogno di sentirsele.

      Sul fondo curvo del tunnel la polvere è disposta in anelli tutti uguali, uno ogni passo. In fondo al
      tunnel pulsa piano una luce rossiccia.
    opzioni:
      - testo: "Dire forte i nomi delle cose"
        descrizione: "Lampada, corda, coltello. Se la testa li perde, la voce li tiene."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: I nomi
          testo: |
            Cammini dicendo a voce alta il nome di tutto quello che porti, e alla fine anche il tuo. La voce
            ti torna dal metallo storta e lunga, e ogni volta che la senti la testa si rimette in fila. L'eco
            del tuo nome arriva più tardi di quella delle altre parole. Arrivi alla luce rossiccia senza aver
            perso niente.
          pe: { resilienza: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: La parola persa
          testo: |
            A metà tunnel non trovi più la parola per la cosa che ti pende dalla cintura. La tocchi e ne senti
            il manico e la lama, e la parola resta lontana lo stesso. Torni indietro fino al portello, e lì la
            parola ti torna in bocca, e ti viene quasi da piangere per il sollievo.
          effetti: { tormento: 1 }
      - testo: "Correre fino in fondo prima di perdersi"
        descrizione: "Più si resta dentro, più si perde. Allora si resta dentro poco."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Fino alla luce
          testo: |
            Corri giù per la pendenza con le braccia larghe per non scivolare, e la nota ti insegue senza
            raggiungerti. Le scarpe battono sul metallo e non fanno nessun rumore che tu riesca a sentire.
            Arrivi alla luce rossiccia senza fiato e con tutte le parole al loro posto, o quasi.
          pe: { resistenza: 3 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: La pendenza
          testo: |
            Il metallo è più liscio di quanto credevi, e a metà corsa i piedi ti partono. Scivoli sul fianco
            per un tratto lungo con la guancia contro la canna, e la vibrazione ti entra nelle ossa della
            faccia. Quando ti fermi non sai più da che parte sei venut{o|a}, e ti trascini fuori a tentoni.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Tapparsi le orecchie con la cera e camminare piano"
        descrizione: "La cera della lattina non ferma la nota. Ferma tutto il resto, e così la testa ha meno da perdere."
        costo: 2
        esito:
          titolo: La cera
          testo: |
            Ti infili la cera nelle orecchie e cammini piano, con una mano sul metallo. Senti soltanto il
            sangue che ti batte nelle tempie, e sotto il sangue la nota. Il metallo vibra contro il palmo a
            ondate lente che non seguono il tuo passo, e quando arrivi alla luce rossiccia non ricordi più
            come hai fatto ad arrivarci.
          effetti: { profondita.costola-di-drago: 1, tormento: 1 }

  - id: costola-di-drago-i-nove-incavi
    immagine: ambientazione/rovine-dei-precursori
    titolo: La piastra dei nove incavi
    sommario: "Sul fianco della canna c'è una piastra con nove incavi in cerchio. Uno è più profondo degli altri."
    luogo: La Costola di Drago, la piastra
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago == 3]
    testo: |
      Dove la canna si allarga, sul suo fianco è fissata una piastra di metallo più chiaro grande come una
      porta. Il bordo segue la curva della canna così bene che l'unghia non trova la fessura. Al centro ci
      sono nove incavi in cerchio, e uno è inciso più a fondo degli altri. Intorno corre una fila di segni
      minuti dei Precursori, e dal centro parte una linea incisa che scende lungo la canna. Il metallo intorno
      è coperto di polvere, e nei solchi dei segni non ce n'è un granello.

      {percezione Media} Lo stesso cerchio c'è in piccolo su ogni bullone della piastra, e su ognuno è più
      profondo lo stesso incavo.
    opzioni:
      - testo: "Leggere i segni intorno al cerchio"
        descrizione: "I segni dei Precursori si ripetono. Chi ne ha visti abbastanza riconosce almeno le parole che tornano."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La parola che torna
          testo: |
            Copi i segni sul quaderno e li conti, con la mano che vibra insieme al metallo. Uno torna nove
            volte, una per incavo. Un altro compare una volta sola, accanto all'incavo più profondo. Seguendo
            la linea incisa verso il basso trovi un frammento di metallo staccato dalla piastra, con gli
            stessi segni. Il bordo della frattura è lucido e netto, e la piastra intorno non ha il segno di un
            urto.
          pe: { accademiche: 2 }
          effetti: { profondita.costola-di-drago: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Segni fitti
          testo: |
            I segni sono così fitti che dopo un poco ti si confondono davanti agli occhi, e la nota ti entra
            nelle tempie. Quando abbassi lo sguardo sul quaderno le righe che hai copiato non somigliano più a
            quelle della piastra. Lasci il quaderno mezzo vuoto e ti siedi con la testa fra le mani.
          effetti: { tormento: 0.5 }
      - testo: "Seguire la linea incisa"
        descrizione: "La linea parte dal centro del cerchio e scende lungo la canna. Porta da qualche parte."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La linea
          testo: |
            Segui la linea con il dito lungo il metallo per un tratto lungo, finché non sparisce sotto una
            lastra che si solleva con una spinta. Sotto c'è una scala a pioli che scende verso la luce
            rossiccia, e i pioli sono distanti fra loro più di quanto le tue gambe vorrebbero.
          pe: { percezione: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: Il dito che trema
          testo: |
            La linea ti trema sotto il dito come una corda pizzicata, e a un certo punto non sai più se la
            segui o se è lei che si sposta. Ti ritrovi davanti alla piastra dove eri partit{o|a}, con il
            polpastrello intorpidito che ci mette un pezzo a tornare a sentire.
          effetti: { tormento: 0.5 }
      - testo: "Lasciar perdere la piastra e scendere lungo la canna"
        descrizione: "I segni restano dove sono. La strada verso il fondo è lunga, e la nota cresce."
        costo: 2
        esito:
          titolo: Verso il fondo
          testo: |
            Lasci la piastra e scendi lungo la canna, appoggiando le mani sul metallo dove la terra è troppo
            ripida. La nota cresce a ogni passo finché la senti anche nelle unghie. La fiamma della lampada si
            piega verso il basso anche dove l'aria è ferma. In fondo c'è una luce rossiccia che pulsa.
          effetti: { profondita.costola-di-drago: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · l'accordatore
  - id: costola-di-drago-l-accordatore
    immagine: bestiario/salvaguardia-precursori
    titolo: L'accordatore
    sommario: "In fondo alla canna una macchina dalle braccia lunghe batte il metallo con martelli fasciati di feltro."
    luogo: La Costola di Drago, la camera in fondo alla canna
    area: costola-di-drago
    requisiti: [profondita.costola-di-drago >= 4, misura.costola == 0]
    testo: |
      La canna finisce in una camera rotonda e alta come una torre. In mezzo c'è una macchina alta tre volte
      un uomo, con sei braccia sottili che finiscono in martelli fasciati di feltro grigio, e batte la canna
      un braccio alla volta con una pazienza da campanaro. Le giunture delle braccia girano senza un cigolio.
      Dove i martelli cadono la canna ha sei conche lucide profonde quanto un dito, e le ha scavate il feltro
      a forza di battere.

      Al centro, su un piedistallo, c'è una culla di metallo chiaro con un cerchio di nove incavi sul bordo, e
      uno è più profondo degli altri. Nella culla un diapason di metallo nero risponde a ogni colpo con la
      stessa nota, più chiara.

      {tecnologia Difficile} La macchina ascolta il diapason e corregge la canna sulla sua nota. Se il
      diapason esce dalla culla, la macchina perde la nota e ne cercherà il motivo.

      {origine apprendista-raschiatore} Alle piattaforme i vecchi dicono che ogni rovina ha la sua cosa da non
      toccare. Stavolta è quella che sei venut{o|a} a prendere.

      Dietro la macchina esce dalla camera un condotto di metallo sigillato, largo quanto un pozzo. Sul suo
      fianco la polvere si dispone in linee che puntano tutte nella stessa direzione, lontano dalla camera.
    opzioni:
      - testo: "Prendere il diapason e affrontare l'accordatore"
        descrizione: "Quando il diapason esce dalla culla, i martelli smettono di battere la canna e cercano te. Sono sei, e lunghi."
        combattimento: costola-di-drago-accordatore
        vittoria:
          titolo: La nota in mano
          testo: |
            L'ultimo braccio cade sul pavimento con il martello ancora fasciato, e la macchina si piega su se
            stessa come un ombrello chiuso. Batti il diapason contro il palmo e lui ripete la nota pulita e la
            tiene a lungo. La nota ti resta nelle ossa della mano anche quando ha smesso di suonare. Stacchi
            uno dei martelli dal braccio caduto, e dalla culla raccogli i frammenti della piastra di fondo.

            {accademiche Media} Il condotto sigillato porta la nota da qualche parte. Una macchina che accorda
            non ha bisogno di un condotto, a meno che la nota non serva a qualcosa più in là.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.costola: 1, oggetto.costola-di-drago-martello-d-accordatura: 1, reliquie.frammento-inciso: 2, parte.impugnatura-3: 1, bottino.parti-di-drone: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Il colpo di feltro
          testo: |
            Un martello ti prende al fianco, e il feltro non attutisce niente. Il secondo ti piega in due.
            Lasci cadere il diapason, e la macchina lo rimette nella culla con una delicatezza che ti fa più
            male del colpo. Le braccia tornano alla canna senza fretta, e il ritmo riprende dal colpo in cui
            si era interrotto. Risali la canna strisciando, e quando esci dalla collina è notte.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Sfilare il diapason fra un colpo e l'altro"
        descrizione: "La macchina ascolta il diapason solo quando batte. Fra due colpi c'è un momento in cui non ascolta niente."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Fra due colpi
          testo: |
            Conti i colpi fino a trovare il ritmo, e al momento giusto sfili il diapason e ci metti al posto
            suo il manico del coltello. La macchina batte la canna e ascolta il manico. Poi continua a battere
            un po' più piano, ingannata. Il diapason è più freddo dell'aria della camera e ti intorpidisce le
            dita che lo stringono. Esci dalla camera con il diapason stretto al petto e un frammento della
            culla che si è staccato nella fretta. Il martello che hai visto rotolare sotto il piedistallo,
            rotto da chissà quanto, te lo porti via.
          pe: { tecnologia: 5 }
          effetti: { misura.costola: 1, oggetto.costola-di-drago-martello-d-accordatura: 1, reliquie.frammento-inciso: 2, parte.impugnatura-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il colpo sbagliato
          testo: |
            Sfili il diapason un colpo troppo tardi. La macchina perde la nota e si gira, e un martello ti
            prende sulla spalla. Il diapason ti cade di mano e torna da solo nella culla, come un cane che
            torna al padrone. Risali la canna tenendoti il braccio, e alle tue spalle i colpi riprendono
            regolari prima che tu sia uscit{o|a} dalla camera.
          effetti: { ferite: 2, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Cantare la nota al posto del diapason"
        descrizione: "La macchina ascolta una nota sola. Se la trova nella tua gola, forse non si accorge che il diapason è uscito dalla culla."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: La gola che vibra
          testo: |
            Cerchi la nota con la voce, giù in fondo al petto, finché il diapason non ti risponde. Le costole
            ti vibrano dall'interno e i denti ti battono piano gli uni contro gli altri. Lo prendi senza
            smettere di cantare. La macchina gira la testa verso di te e continua a battere la canna, un poco
            più piano, e tu esci dalla camera camminando all'indietro con la gola in fiamme. Sulla soglia
            raccogli un martello caduto e un frammento della culla.
          pe: { espressivita: 5 }
          effetti: { misura.costola: 1, oggetto.costola-di-drago-martello-d-accordatura: 1, reliquie.frammento-inciso: 2, parte.impugnatura-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La voce che si rompe
          testo: |
            La voce ti si rompe a metà della nota. Le braccia della macchina si girano tutte verso di te, e il
            primo martello ti prende sotto le costole. Lasci il diapason e scappi su per la canna. La gola ti
            ronza ancora sulla nota rotta, e per due giorni parli soltanto a gesti.
          effetti: { ferite: 1.5, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ordinargli di continuare senza il diapason"
        descrizione: "La formula del Comando parla alle macchine nella loro lingua. Questa ha un lavoro solo, e forse accetta di farlo a memoria."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: A memoria
          testo: |
            Dici la formula, e la parola esce in una lingua che ti graffia il palato. La macchina si ferma con
            sei martelli alzati, e nella camera si sente soltanto il diapason che si spegne nella culla. Poi
            riprende a battere la canna senza guardare la culla. Prendi il diapason, e lei non si volta. Ti
            porti via anche un martello di ricambio appeso al piedistallo, insieme a un frammento della culla.
          pe: { magia: 5 }
          effetti: { misura.costola: 1, oggetto.costola-di-drago-martello-d-accordatura: 1, reliquie.frammento-inciso: 2, parte.impugnatura-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La formula stonata
          testo: |
            La formula ti si spezza a metà, e la macchina sente soltanto il rumore. Le braccia si alzano tutte
            insieme verso di te. Scappi prima di vedere dove cadono. Per tutta la canna senti i martelli
            battere il pavimento alle tue spalle, e ogni colpo ti sale dalle suole fino alle ginocchia.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo la misura · la culla vuota (ripetibile)
  - id: costola-di-drago-la-culla-vuota
    immagine: bestiario/salvaguardia-precursori
    titolo: La culla vuota
    sommario: "L'accordatore batte ancora la canna, a orecchio, con un braccio rifatto alla meglio. La culla del diapason è vuota."
    luogo: La Costola di Drago, la camera in fondo alla canna
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago >= 4, misura.costola >= 1]
    testo: |
      Nella camera in fondo alla canna l'accordatore batte ancora senza il diapason. Gli scrostatori gli hanno
      rifatto un braccio più corto degli altri con pezzi che non combaciano del tutto, e la giuntura nuova
      scatta a ogni colpo. Adesso batte a orecchio e la nota sbanda un poco prima di tornare al suo posto. La
      culla al centro è vuota, e nel cerchio dei nove incavi si è posata la polvere.

      {tecnologia Media} Intorno al piedistallo la macchina tiene pezzi di ricambio in file ordinate. Ogni
      pezzo ha il suo posto, e dove ne manca uno il posto resta vuoto nella fila.

      Il diapason nella tua bisaccia risponde piano a ogni colpo.
    opzioni:
      - testo: "Affrontare di nuovo l'accordatore"
        descrizione: "Ha un braccio rifatto alla meglio. Gli altri martelli sono quelli di sempre."
        combattimento: costola-di-drago-accordatore
        vittoria:
          titolo: I pezzi di ricambio
          testo: |
            La macchina cade sul fianco con il braccio corto che batte ancora il pavimento, a colpi sempre più
            radi. Riempi la bisaccia con i pezzi di ricambio che teneva intorno alla culla, ed esci prima che
            gli scrostatori vengano a rimetterla in piedi.
          effetti: { parte.impugnatura-2: 1, reperto.sigillato: 1, reliquie.scheggia: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: A orecchio
          testo: |
            Anche a orecchio i martelli sanno dove sei. Risali la canna a
            carponi, e la nota ti accompagna fino all'erba gialla della
            collina.
          vai: superficie-fratturata
      - testo: "Prendere i ricambi mentre batte"
        descrizione: "La macchina guarda la canna. I pezzi stanno ai suoi piedi, e ai piedi non guarda."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Ai suoi piedi
          testo: |
            Strisci fra le braccia della macchina mentre batte, e raccogli quello che sta nelle file più
            vicine. I martelli ti passano sopra la schiena, e lo spostamento d'aria ti solleva la giubba. Esci
            con un reperto chiuso e qualche scheggia, e la macchina non ha perso un colpo.
          pe: { furtivita: 3 }
          effetti: { reperto.sigillato: 1, reliquie.scheggia: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il braccio corto
          testo: |
            Il braccio corto è più svelto degli altri, e ti prende sul dorso della mano. Lasci cadere tutto e
            risali la canna con la mano stretta sotto l'ascella e le nocche che si gonfiano.
          effetti: { ferite: 1 }
          vai: superficie-fratturata
      - testo: "Lasciarla lavorare e risalire"
        descrizione: "La nota è già tua. La camera può restare com'è."
        costo: 0
        esito:
          titolo: Il lavoro degli altri
          testo: |
            Guardi la macchina battere la canna per un po', con il braccio corto che arriva sempre un momento
            dopo, e risali. Nella bisaccia il diapason risponde soltanto ai colpi giusti e tace quando la nota
            sbanda. Alle tue spalle la nota sbanda e torna al suo posto, ogni volta.
          vai: superficie-fratturata

