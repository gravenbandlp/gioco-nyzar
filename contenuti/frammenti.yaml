# Frammenti del Codex: brevi voci mostrate a margine, come i trafiletti di Fallen London.
# Solo informazioni pubbliche. `area` limita il frammento a un'area; senza, compare ovunque.
frammenti:
  # ------------------------------------------------------------ Città Bassa
  - id: detto-del-martello
    titolo: Il detto del martello
    area: citta-bassa
    immagine: ambientazione/citta-bassa
    testo: |
      La Città Bassa si stende su un altopiano a est, dove la roccia prende
      sfumature bluastre e dalle fenditure sale un calore costante. Ci vivono
      i Raschiatori e gli artigiani che riforniscono i Ponti. Il detto del
      distretto è anche il più esatto: «Quaggiù il martello batte sempre. Se
      smette di battere, è perché qualcuno è morto.»

  - id: pignatta-grassa
    titolo: Carte truccate, conversazioni sicure
    area: citta-bassa
    requisiti: [pista.pelle < 6]
    immagine: ambientazione/pignatta-grassa
    testo: |
      Taverna della Città Bassa che lo sceriffo Galdrick sconsiglia ai
      visitatori, ed è anche per questo che resta piena. In molti credono che
      a comandare gli Scuri sia l'oste Mauro Scrocco, che abbraccia i clienti
      al primo incontro, mentre il loro vero capo si nasconde a vista tra i
      tavoli. Lo sceriffo aspetta un passo falso.

  - id: acciaieria-lyssan
    titolo: L'Acciaieria dei Tarvelin
    area: citta-bassa
    requisiti: [pista.acciaio < 3]
    immagine: ambientazione/acciaieria-di-qir-azel
    testo: |
      L'Acciaieria dei Tarvelin è l'unico impianto della regione che raffina
      il lyssan, il metallo dei Precursori che reagisce al Mana e cambia
      colore sotto riti errati. Ondrel Tarvelin la dirige di persona. Ottone
      Malgrani vorrebbe comprarla, e in città si dice che la partita vera
      comincerà quando passerà all'erede, Liaren.

  - id: orlo-dei-rottami
    titolo: La spiaggia dei rottami
    area: citta-bassa
    immagine: ambientazione/orlo-dei-rottami
    testo: |
      Lingua di terra battuta sotto il margine ovest della Città Bassa, sul
      bordo della Cicatrice. Ci arrivano, venduti a peso, i pezzi precuriani
      sfregiati, i cristalli sterili scartati dai Raschiatori e i carichi
      delle spedizioni fallite, che una decina di spazzini della Gilda smista
      e rivende. Di notte la Guardia ci passa di rado.

  - id: mercato-delle-ombre
    titolo: Il segreto peggio custodito
    area: citta-bassa
    immagine: ambientazione/mercato-delle-ombre
    testo: |
      Piazza sotterranea della Città Bassa, sotto luci verdognole che fanno
      sembrare malati anche i clienti sani. Ci si vendono reliquie proibite
      e Cristalli Conduttori non registrati. Il mercato cambia stanza ogni
      pochi mesi; gli Scuri ne amministrano i punti che contano e lo
      sceriffo finge di non sapere dove sia l'ingresso.

  - id: maison-des-lunes
    titolo: Discrezione, eleganza, protezione
    area: citta-bassa
    immagine: ambientazione/maison-des-lunes
    testo: |
      Casa di piacere in legno all'angolo tra Via del Salmone e Via dei Rasoi,
      con le tende sempre chiuse e una catena di bronzo accanto alla porta,
      *Ospiti Benvenuti*. La dirige Nerissa Dalvane, che non alza mai la voce;
      all'ingresso la halfling Sara Beck chiude le armi in un armadio. Qui
      decidono le ragazze, anche quando costa un cliente.

  - id: cristallo-spento
    titolo: Tre porte dopo il cristallo spento
    area: citta-bassa
    immagine: ambientazione/cristalli-conduttori
    testo: |
      Via dei Rasoi fa un gomito attorno a un vecchio cristallo conduttore
      esaurito, una scheggia opaca alta due uomini che nessuno ha mai rimosso.
      In Città Bassa molte indicazioni cominciano con «tre porte dopo il
      cristallo spento», e di solito chi le dà non aggiunge altro.

  - id: segheria-di-qir-azel
    titolo: Le lame fino a notte
    area: citta-bassa
    requisiti: [pista.pelle < 7]
    immagine: ambientazione/segheria-di-qir-azel
    testo: |
      Tra i primi edifici della Fondazione, la Segheria di Qir-Azel lavora il
      legname del circondario su concessione dei Malgrani, e tutti la
      chiamano Segheria Malgrani. Un cristallo conduttore romboidale muove le
      lame fino a notte e la segatura si posa su mezzo isolato. La gestisce
      Rennick Dole con il socio Marko Thessel.

  # ------------------------------------------------------------ Ponti Sospesi
  - id: livello-dei-ponti
    titolo: Il Livello dei Ponti
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      Reticolo di travi e piattaforme appese sopra il centro di Qir-Azel, fra
      le due sponde della Cicatrice del Mondo, cuore commerciale della città.
      Molte famiglie vivono ai margini, in case di legno e metallo sopra il
      vuoto. La via principale è il Ponte delle Mille Corde. Detto della
      Gilda: «Una corda, qui, può essere un ponte o un cappio.»

  - id: ponte-dei-morti
    titolo: Una luce per ogni nome
    area: ponti-sospesi
    immagine: ambientazione/ponte-dei-morti
    testo: |
      Antico ponte metallico, tra i primi della città. I Raschiatori vi
      appendono lanterne con piccoli Cristalli Conduttori, una per ogni
      compagno disperso nel Labirinto di Darn-Morakh, e la luce dura finché
      regge il cristallo, di solito per anni. Alcune lanterne hanno un nome
      proprio anche se il compagno è scomparso da decenni.

  - id: grifone-di-ferro
    titolo: Niente schiavi al seguito
    area: ponti-sospesi
    immagine: ambientazione/locanda-del-grifone-di-ferro
    testo: |
      La Locanda del Grifone di Ferro è la prima di Qir-Azel in cui un
      Raschiatore possa sedersi senza occhiate storte. La proprietaria, Liaren
      Tarvelin, suona il samisen; in cucina comanda la halfling Brunella
      Fennick. Chi entra con schiavi al seguito esce con un occhio nero, e la
      regola la fa rispettare Dragna Gro-Malog, il Ferro dei Raschiatori.

  - id: custodi-di-passaggio
    titolo: Licenza, commissione, registro
    area: ponti-sospesi
    immagine: fazioni/gilda-dei-mercanti
    testo: |
      I Custodi di Passaggio sono i funzionari della Gilda dei Mercanti che
      riscuotono i dazi sui ponti e ne curano la manutenzione, ciascuno con
      qualche guardia. Si paga una gabella a ogni passaggio fra i distretti,
      e ogni mercante paga licenza e commissione mensile; chi commercia
      senza licenza viene multato e poi bandito. L'ispettore Varn Kett non
      prende appunti e non sbaglia una riga.

  # ------------------------------------------------------------ Quartieri Alti
  - id: cattedrale-del-velo
    titolo: Ciò che non si smentisce
    area: quartieri-alti
    immagine: ambientazione/cattedrale-del-velo
    testo: |
      Eretta sulle ceneri del Santuario bruciato nel 145 D.C., la Cattedrale
      del Velo fu inaugurata il primo giorno d'autunno del 150, la sera della
      razzia. Le pareti, in parte organiche, sono fuse a segmenti metallici
      dei Precursori, e sull'altare un cristallo rosso pulsa con le ore
      canoniche. Nella Cripta officia la Madre del Velo, che nessuno ha mai
      visto in volto.

  - id: famiglia-malgrani
    titolo: Nemici e investimenti
    area: quartieri-alti
    requisiti: [pista.pelle < 6]
    immagine: fazioni/famiglia-malgrani
    testo: |
      Casata della prima ondata, i Malgrani controllano mulini e segherie di
      Qir-Azel, e mezza città è in debito con loro. Il capofamiglia Ottone
      siede in Consiglio e vorrebbe chiudere la Maison des Lunes per decoro.
      Negli ultimi anni sono bruciati tre mulini concorrenti. Motto di casa:
      «Mio padre li aveva chiamati nemici. Io li chiamo investimenti.»

  # ------------------------------------------------------------ ovunque
  - id: marea-grigia
    titolo: Oltre
    immagine: ambientazione/marea-grigia
    testo: |
      Nebbia lattiginosa dal riflesso metallico, che odora di ozono e di
      ferro. La Marea Grigia colpisce prima la mente e poi il corpo, e chi la
      respira muore in fretta oppure muta. Un Cristallo Conduttore al polso
      protegge fino a un certo punto, e chi torna dalle profondità passa dai
      riti di purificazione del Velo, che ogni autunno segna il limite
      dell'esplorato con una parola, *oltre*.

  - id: razzia-delle-foglie-alate
    titolo: La sera delle Foglie Alate
    immagine: ambientazione/evento-razzia-festival-150
    testo: |
      Il primo giorno d'autunno del 150 D.C., al tramonto del Festival delle
      Foglie Alate, gli orchi del circondario assaltarono Qir-Azel. Il
      capoguerra, su un cinghiale corazzato mutato dalla Marea, cadde presso
      la porta nord, e la stessa sera comparvero tre macchine della
      Salvaguardia dei Precursori, trovate spente sulle grondaie il mattino
      dopo. Morirono circa cinquanta persone in una notte.
