# Frammenti del Codex: brevi voci mostrate a margine, come i trafiletti di Fallen London.
# Solo informazioni pubbliche. `area` limita il frammento a un'area; senza, compare ovunque.
frammenti:
  # ------------------------------------------------------------ Città Bassa
  - id: detto-del-martello
    titolo: Il detto del martello
    area: citta-bassa
    immagine: ambientazione/citta-bassa
    testo: |
      La Città Bassa si stende su un altopiano a est, dove la roccia prende
      sfumature bluastre e le fenditure emanano un calore costante. Vi abitano
      Raschiatori, fabbri, alchimisti e gran parte di chi alimenta il mercato
      dei Ponti. Case basse di pietra grezza e lamiera; fumo e scintille
      giorno e notte. Il detto più ripetuto del distretto è anche il più
      esatto: «Quaggiù il martello batte sempre. Se smette di battere, è
      perché qualcuno è morto.»

  - id: pignatta-grassa
    titolo: Carte truccate, conversazioni sicure
    area: citta-bassa
    immagine: ambientazione/pignatta-grassa
    testo: |
      Taverna della Città Bassa che lo sceriffo Galdrick sconsiglia ai
      visitatori; gli abitanti rispettano il consiglio con una certa
      curiosità, ed è questo che la tiene viva. L'oste, Mauro Scrocco, parla
      forte, abbraccia al primo incontro e accoglie tutti con un tono che molti
      scambiano per simpatia. Molti credono sia lui a comandare gli Scuri. È
      un equivoco che qualcuno ha interesse a coltivare. Lo sceriffo raccoglie
      prove. Aspetta il passo falso.

  - id: acciaieria-lyssan
    titolo: Il lyssan si convince
    area: citta-bassa
    immagine: ambientazione/acciaieria-di-qir-azel
    testo: |
      L'Acciaieria dei Tarvelin è l'unico luogo della regione in cui si
      raffina il lyssan, il metallo dei Precursori che reagisce al Mana e
      cambia colore se sottoposto a riti errati. Gli operai lavorano
      mascherati; la colata è azzurrastra. Ondrel Tarvelin la dirige di
      persona e non ne ha mai delegato il controllo a estranei. Ottone
      Malgrani vorrebbe comprarla. In città si dice che la vera partita
      comincerà quando l'erede, Liaren, la riceverà.

  - id: orlo-dei-rottami
    titolo: La spiaggia dei rottami
    area: citta-bassa
    immagine: ambientazione/orlo-dei-rottami
    testo: |
      Lingua di terra battuta sotto il margine ovest della Città Bassa, fra
      l'ultima fila di baracche e il bordo della Cicatrice. Vi scendono, a
      peso, gli scarti dei Raschiatori: pezzi precuriani sfregiati, cristalli
      sterili, carichi falliti. Una decina di spazzini autorizzati dalla Gilda
      separa e rivende. Di giorno è solo sporco. Di notte le baracche cambiano
      padrone, e la Guardia ci passa di rado, mai a sorpresa. «Quel che la
      città lascia cadere, qui qualcuno lo riprende.»

  - id: mercato-delle-ombre
    titolo: Il segreto peggio custodito
    area: citta-bassa
    immagine: ambientazione/mercato-delle-ombre
    testo: |
      Piazza sotterranea della Città Bassa, rischiarata da luci verdognole,
      dove si vendono reliquie proibite, frammenti precuriani senza timbro di
      Gilda e Cristalli Conduttori non registrati. Ha più di un ingresso, e
      ogni due o tre mesi cambia stanza. Gli Scuri ne amministrano i punti che
      contano; la Confraternita del Velo ne tollera l'esistenza; lo sceriffo
      finge di non sapere dove sia l'ingresso principale. Detto dei
      frequentatori: «Il primo prezzo è sempre una domanda.»

  - id: maison-des-lunes
    titolo: Discrezione, eleganza, protezione
    area: citta-bassa
    immagine: ambientazione/maison-des-lunes
    testo: |
      Casa di piacere all'angolo tra Via del Salmone e Via dei Rasoi: tre
      piani di legno, tende sempre chiuse, nessuna insegna. Accanto alla porta
      pende una catena di bronzo con inciso «Ospiti Benvenuti». La dirige
      Nerissa Dalvane, che non alza mai la voce. All'ingresso la halfling Sara
      Beck spiega le regole della casa e ritira le armi in un armadio chiuso a
      chiave. La regola principale è una, e Nerissa la fa rispettare anche
      quando costa un cliente: le ragazze decidono.

  - id: cristallo-spento
    titolo: Tre porte dopo il cristallo spento
    area: citta-bassa
    immagine: ambientazione/cristalli-conduttori
    testo: |
      Via dei Rasoi non taglia mai dritto: fa un gomito di novanta gradi
      attorno a un vecchio cristallo conduttore esaurito, una scheggia opaca
      alta come due uomini che nessuno si è mai preso la briga di rimuovere.
      In Città Bassa lo si usa come riferimento, e molte indicazioni
      cominciano allo stesso modo: «tre porte dopo il cristallo spento». Chi le
      dà, di solito, non aggiunge altro. Chi le riceve, di solito, non chiede.

  - id: segheria-di-qir-azel
    titolo: Lo spaccalegna che non dorme
    area: citta-bassa
    immagine: ambientazione/segheria-di-qir-azel
    testo: |
      Tra i primi edifici sorti dopo la Fondazione, la Segheria di Qir-Azel
      lavora il legname grezzo dei boschi del circondario sotto concessione
      della famiglia Malgrani; in città tutti la chiamano Segheria Malgrani. Un
      cristallo conduttore romboidale muove il canale e le lame fino a notte.
      La gestiscono il responsabile, Rennick Dole, e il socio Marko Thessel. I
      vicini si lamentano del rumore. Nessuno ha ancora osato portare la causa
      davanti a un giudice dei Malgrani.

  # ------------------------------------------------------------ Ponti Sospesi
  - id: livello-dei-ponti
    titolo: Il Livello dei Ponti
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      Reticolo di travi, corde e piattaforme sopra il centro di Qir-Azel, fra
      le due sponde della Cicatrice del Mondo: il cuore commerciale della
      città. Il vento porta odore di ferro, fumo e resina; le lanterne di Mana
      ondeggiano notte e giorno; molte famiglie vivono in case di legno e
      metallo appese ai margini, come nidi sopra il vuoto. Il Ponte delle
      Mille Corde, la via principale, vibra di continuo. Detto della Gilda:
      «Una corda, qui, può essere un ponte o un cappio.»

  - id: ponte-dei-morti
    titolo: Una luce per ogni nome
    area: ponti-sospesi
    immagine: ambientazione/ponte-dei-morti
    testo: |
      Antico ponte metallico, tra i primi costruiti, a cui i Raschiatori
      appendono lanterne con piccoli Cristalli Conduttori per i compagni
      dispersi nel Labirinto di Darn-Morakh. La luce brucia finché regge il
      cristallo, di solito anni. Ogni squadra cura le proprie lanterne;
      alcune hanno ormai un nome proprio, anche se chi ricordavano non c'è più
      da decenni. Quando se ne appende una nuova si dice: «Una lanterna per
      nome. Una lanterna per ciò che pensavi di sapere di lui.»

  - id: grifone-di-ferro
    titolo: Niente schiavi al seguito
    area: ponti-sospesi
    immagine: ambientazione/locanda-del-grifone-di-ferro
    testo: |
      La Locanda del Grifone di Ferro è il punto fermo dei Raschiatori, la
      prima di Qir-Azel in cui uno di loro possa sedersi senza occhiate
      storte. La proprietaria, Liaren Tarvelin, suona il samisen quando ne ha
      voglia; in cucina comanda la halfling Brunella Fennick. Chi entra con
      schiavi al seguito ne esce con un occhio nero, senza discussione. La
      regola la fa rispettare Dragna Gro-Malog, il Ferro dei Raschiatori,
      anche con quelli della sua squadra.

  - id: custodi-di-passaggio
    titolo: Licenza, commissione, registro
    area: ponti-sospesi
    immagine: fazioni/gilda-dei-mercanti
    testo: |
      I Custodi di Passaggio sono i funzionari della Gilda dei Mercanti che
      sorvegliano i ponti, riscuotono i dazi e ne amministrano la
      manutenzione, ciascuno con un piccolo contingente di guardie. Ogni
      passaggio fra i distretti paga la sua gabella, ogni mercante la sua
      licenza e la sua commissione mensile. Chi commercia senza viene multato,
      bandito o, come si dice sui ponti, perso di vista. L'ispettore Varn Kett
      non prende appunti. Si dice che non abbia mai sbagliato una riga.

  # ------------------------------------------------------------ Quartieri Alti
  - id: cattedrale-del-velo
    titolo: Ciò che non si smentisce
    area: quartieri-alti
    immagine: ambientazione/cattedrale-del-velo
    testo: |
      Eretta in cinque anni sulle ceneri del Santuario bruciato nel 145 D.C.,
      la Cattedrale del Velo è stata inaugurata il primo giorno d'autunno del
      150, la sera stessa della razzia. Le pareti sono in parte organiche,
      fuse a segmenti metallici dei Precursori; sull'altare un cristallo rosso
      pulsa al ritmo delle ore canoniche. Sotto l'altare c'è la Cripta, dove
      officia la Madre del Velo, che nessuno ha mai visto in volto. «Qui la
      verità è quello che si decide di non smentire.»

  - id: famiglia-malgrani
    titolo: Nemici e investimenti
    area: quartieri-alti
    immagine: fazioni/famiglia-malgrani
    testo: |
      Casata della prima ondata, i Malgrani controllano tutti i mulini e le
      segherie di Qir-Azel, e con essi la filiera del grano e del legname;
      mezza città è in debito con loro. Il capofamiglia Ottone siede in
      Consiglio per la Gilda, porta panciotti ricamati e vorrebbe far chiudere
      la Maison des Lunes per decoro. Negli ultimi anni tre mulini concorrenti
      sono bruciati: accuse diffuse, prove nessuna. Motto di casa: «Mio padre
      li aveva chiamati nemici. Io li chiamo investimenti.»

  # ------------------------------------------------------------ ovunque
  - id: marea-grigia
    titolo: Oltre
    immagine: ambientazione/marea-grigia
    testo: |
      Nebbia lattiginosa dal riflesso metallico, che odora di ozono e di
      ferro. La Marea Grigia colpisce prima la mente, poi il corpo: uccide in
      fretta, oppure muta. Protegge, fino a un certo punto, un Cristallo
      Conduttore portato in un bracciale o in un amuleto. Chi torna dalle
      profondità passa dai riti di purificazione del Velo. Ogni autunno la
      Confraternita affigge i bollettini delle sacche risalite, e segna il
      limite dell'esplorato con una parola sola: oltre.

  - id: razzia-delle-foglie-alate
    titolo: La sera delle Foglie Alate
    immagine: ambientazione/evento-razzia-festival-150
    testo: |
      Il primo giorno d'autunno del 150 D.C., al tramonto del Festival delle
      Foglie Alate, cinque tribù orchesche assaltarono Qir-Azel insieme: cosa
      mai accaduta a memoria d'uomo. Un capoguerra in sella a un cinghiale
      corazzato, mutato dalla Marea, fu abbattuto presso la porta nord; tre
      macchine della Salvaguardia dei Precursori comparvero in superficie. I
      morti furono circa cinquanta. Molti orchi, braccati, preferirono
      gettarsi nella Cicatrice piuttosto che farsi catturare.
