# Frammenti del Codex: brevi voci mostrate a margine, come i trafiletti di Fallen London.
# Solo informazioni pubbliche. `area` limita il frammento a un'area; senza, compare ovunque.
frammenti:
  # ------------------------------------------------------------ Città Bassa
  - id: detto-del-martello
    titolo: Il detto del martello
    area: citta-bassa
    immagine: ambientazione/citta-bassa
    testo: |
      La Città Bassa si stende su un altopiano a est, dove la roccia prende
      sfumature bluastre e dalle fenditure sale un calore costante. Ci vivono
      i Raschiatori e buona parte di chi rifornisce il mercato dei Ponti, dai
      fabbri agli alchimisti. Le case basse sono di pietra grezza e lamiera, e
      il fumo delle fucine non si ferma nemmeno di notte. Il detto più
      ripetuto del distretto è anche il più esatto: «Quaggiù il martello batte
      sempre. Se smette di battere, è perché qualcuno è morto.»

  - id: pignatta-grassa
    titolo: Carte truccate, conversazioni sicure
    area: citta-bassa
    immagine: ambientazione/pignatta-grassa
    testo: |
      Taverna della Città Bassa che lo sceriffo Galdrick sconsiglia ai
      visitatori; gli abitanti ascoltano il consiglio con una certa curiosità,
      ed è anche per questo che il locale resta pieno. L'oste Mauro Scrocco
      parla forte e abbraccia i clienti al primo incontro, con un'allegria che
      molti scambiano per simpatia. In molti credono che sia lui a comandare
      gli Scuri, mentre il loro vero capo si nasconde a vista tra i tavoli. Lo
      sceriffo raccoglie prove e aspetta un passo falso.

  - id: acciaieria-lyssan
    titolo: L'Acciaieria dei Tarvelin
    area: citta-bassa
    immagine: ambientazione/acciaieria-di-qir-azel
    testo: |
      L'Acciaieria dei Tarvelin è l'unico impianto della regione in cui si
      raffina il lyssan, il metallo dei Precursori che reagisce al Mana e
      cambia colore se sottoposto a riti errati. Gli operai lavorano con la
      maschera, e la colata ha un colore azzurrastro che i bambini del
      quartiere vanno a guardare dal cancello, finché qualcuno li scaccia.
      Ondrel Tarvelin la
      dirige di persona e non ne ha mai affidato il controllo a estranei.
      Ottone Malgrani vorrebbe comprarla, e in città si dice che la vera
      partita comincerà quando l'erede, Liaren, la riceverà.

  - id: orlo-dei-rottami
    titolo: La spiaggia dei rottami
    area: citta-bassa
    immagine: ambientazione/orlo-dei-rottami
    testo: |
      Lingua di terra battuta sotto il margine ovest della Città Bassa, fra
      l'ultima fila di baracche e il bordo della Cicatrice. Ci arrivano,
      venduti a peso, i pezzi precuriani sfregiati e i cristalli sterili che i
      Raschiatori scartano, con i carichi delle spedizioni fallite. Una decina
      di spazzini autorizzati dalla Gilda li smista e rivende. Di giorno è
      solo sporco. Di notte le baracche cambiano padrone, e la Guardia ci
      passa di rado e mai a sorpresa. Detto della riva: «Quel che la città
      lascia cadere, qui qualcuno lo riprende.»

  - id: mercato-delle-ombre
    titolo: Il segreto peggio custodito
    area: citta-bassa
    immagine: ambientazione/mercato-delle-ombre
    testo: |
      Piazza sotterranea della Città Bassa, rischiarata da luci verdognole
      sotto cui anche i clienti in buona salute sembrano malati. Ci
      si vendono reliquie proibite e frammenti precuriani senza timbro di
      Gilda, oltre ai Cristalli Conduttori non registrati. Ha più di un
      ingresso e ogni due o tre mesi cambia stanza. Gli Scuri ne amministrano
      i punti che contano e la Confraternita del Velo ne tollera l'esistenza.
      Lo sceriffo finge di non sapere dove sia l'ingresso principale. Tra i
      frequentatori si dice: «Il primo prezzo è sempre una domanda.»

  - id: maison-des-lunes
    titolo: Discrezione, eleganza, protezione
    area: citta-bassa
    immagine: ambientazione/maison-des-lunes
    testo: |
      Casa di piacere in legno, su tre piani, all'angolo tra Via del Salmone e
      Via dei Rasoi. Non ha insegna e tiene le tende sempre chiuse; accanto
      alla porta pende una catena di bronzo con la scritta «Ospiti Benvenuti».
      La dirige Nerissa Dalvane, che non alza mai la voce. All'ingresso la
      halfling Sara Beck spiega le regole della casa e chiude le armi dei
      clienti in un armadio. La regola principale è che decidono le ragazze, e
      Nerissa la fa rispettare anche quando le costa un cliente.

  - id: cristallo-spento
    titolo: Tre porte dopo il cristallo spento
    area: citta-bassa
    immagine: ambientazione/cristalli-conduttori
    testo: |
      Via dei Rasoi non corre dritta. Fa un gomito di novanta gradi attorno a
      un vecchio cristallo conduttore esaurito, una scheggia opaca alta due
      uomini che nessuno si è mai preso la briga di rimuovere. In Città Bassa
      lo si usa come punto di riferimento, e molte indicazioni cominciano allo
      stesso modo: «tre porte dopo il cristallo spento». Di solito chi le dà
      non aggiunge altro, e chi le riceve non fa domande.

  - id: segheria-di-qir-azel
    titolo: Le lame fino a notte
    area: citta-bassa
    immagine: ambientazione/segheria-di-qir-azel
    testo: |
      Tra i primi edifici sorti dopo la Fondazione, la Segheria di Qir-Azel
      lavora il legname grezzo dei boschi del circondario sotto concessione
      della famiglia Malgrani, e in città tutti la chiamano Segheria Malgrani.
      Un cristallo conduttore romboidale muove il canale e le lame fino a
      notte, e la segatura si posa sui davanzali di mezzo isolato. La
      gestisce il responsabile Rennick Dole insieme al socio Marko
      Thessel. I vicini si lamentano del rumore, ma finora nessuno ha portato
      la causa davanti a un giudice dei Malgrani.

  # ------------------------------------------------------------ Ponti Sospesi
  - id: livello-dei-ponti
    titolo: Il Livello dei Ponti
    area: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    testo: |
      Reticolo di travi e piattaforme tenute dalle corde sopra il centro di
      Qir-Azel, fra le due sponde della Cicatrice del Mondo. È il cuore
      commerciale della città. Il vento porta odore di ferro e di resina, e le
      lanterne di Mana ondeggiano notte e giorno. Molte famiglie vivono ai
      margini, in case di legno e metallo appese sopra il vuoto, e il bucato
      steso fra una casa e l'altra ogni tanto finisce nella Cicatrice. La via
      principale è il Ponte delle Mille Corde, che vibra di continuo. Detto
      della Gilda: «Una corda, qui, può essere un ponte o un cappio.»

  - id: ponte-dei-morti
    titolo: Una luce per ogni nome
    area: ponti-sospesi
    immagine: ambientazione/ponte-dei-morti
    testo: |
      Antico ponte metallico, tra i primi costruiti in città. I Raschiatori vi
      appendono lanterne con piccoli Cristalli Conduttori, una per ogni
      compagno disperso nel Labirinto di Darn-Morakh. La luce dura finché
      regge il cristallo, di solito per anni. Ogni squadra cura le proprie
      lanterne, e alcune hanno ormai un nome proprio, anche se il compagno che
      ricordavano è scomparso da decenni. Quando se ne appende una nuova si
      dice: «Una lanterna per nome. Una lanterna per ciò che pensavi di sapere
      di lui.»

  - id: grifone-di-ferro
    titolo: Niente schiavi al seguito
    area: ponti-sospesi
    immagine: ambientazione/locanda-del-grifone-di-ferro
    testo: |
      La Locanda del Grifone di Ferro è il punto fermo dei Raschiatori, la
      prima di Qir-Azel in cui uno di loro possa sedersi senza ricevere
      occhiate storte. La proprietaria, Liaren Tarvelin, suona il samisen
      quando ne ha voglia; in cucina comanda la halfling Brunella Fennick. Chi
      entra con schiavi al seguito ne esce con un occhio nero. A far
      rispettare la regola ci pensa Dragna Gro-Malog, il Ferro dei
      Raschiatori, anche con gli uomini della sua squadra.

  - id: custodi-di-passaggio
    titolo: Licenza, commissione, registro
    area: ponti-sospesi
    immagine: fazioni/gilda-dei-mercanti
    testo: |
      I Custodi di Passaggio sono i funzionari della Gilda dei Mercanti che
      riscuotono i dazi sui ponti e ne curano la manutenzione. Ognuno ha ai
      suoi ordini un piccolo contingente di guardie, e sui ponti li si
      riconosce da lontano perché hanno le uniche scarpe lucide. Ogni
      passaggio fra i
      distretti paga la sua gabella, e ogni mercante paga la licenza e una
      commissione mensile. Chi commercia senza licenza viene multato e poi
      bandito; chi insiste, come si dice sui ponti, viene perso di vista.
      L'ispettore Varn Kett non prende appunti, e si dice che non abbia mai
      sbagliato una riga.

  # ------------------------------------------------------------ Quartieri Alti
  - id: cattedrale-del-velo
    titolo: Ciò che non si smentisce
    area: quartieri-alti
    immagine: ambientazione/cattedrale-del-velo
    testo: |
      Eretta in cinque anni sulle ceneri del Santuario bruciato nel 145 D.C.,
      la Cattedrale del Velo è stata inaugurata il primo giorno d'autunno del
      150, la sera stessa della razzia. Le pareti sono in parte organiche,
      fuse a segmenti metallici dei Precursori. Sull'altare un cristallo rosso
      pulsa al ritmo delle ore canoniche. Sotto l'altare si trova la Cripta,
      dove officia la Madre del Velo, che nessuno ha mai visto in volto. In
      città si dice: «Qui la verità è quello che si decide di non smentire.»

  - id: famiglia-malgrani
    titolo: Nemici e investimenti
    area: quartieri-alti
    immagine: fazioni/famiglia-malgrani
    testo: |
      Casata della prima ondata, i Malgrani controllano tutti i mulini e le
      segherie di Qir-Azel, e con essi la filiera del grano e del legname;
      mezza città è in debito con loro. Il capofamiglia Ottone, che porta
      panciotti ricamati, siede in Consiglio per la Gilda e vorrebbe far
      chiudere la Maison des Lunes per decoro. Negli ultimi anni sono bruciati
      tre mulini concorrenti, e molti ne accusano i Malgrani senza avere
      prove. Motto di casa: «Mio padre li aveva chiamati nemici. Io li chiamo
      investimenti.»

  # ------------------------------------------------------------ ovunque
  - id: marea-grigia
    titolo: Oltre
    immagine: ambientazione/marea-grigia
    testo: |
      Nebbia lattiginosa dal riflesso metallico, che odora di ozono e di
      ferro. La Marea Grigia colpisce prima la mente e poi il corpo, e chi la
      respira muore in fretta oppure muta. Un Cristallo Conduttore portato in
      un bracciale o in un amuleto protegge fino a un certo punto. Chi torna
      dalle profondità passa dai riti di purificazione del Velo, anche se
      secondo i Raschiatori l'odore di ozono resta nei capelli per giorni.
      Ogni autunno
      la Confraternita affigge i bollettini delle sacche risalite e segna il
      limite dell'esplorato con una sola parola, *oltre*.

  - id: razzia-delle-foglie-alate
    titolo: La sera delle Foglie Alate
    immagine: ambientazione/evento-razzia-festival-150
    testo: |
      Il primo giorno d'autunno del 150 D.C., al tramonto del Festival delle
      Foglie Alate, cinque tribù orchesche assaltarono Qir-Azel insieme, cosa
      mai accaduta a memoria d'uomo. Un capoguerra in sella a un cinghiale
      corazzato, mutato dalla Marea, fu abbattuto presso la porta nord. La
      stessa sera comparvero in superficie tre macchine della Salvaguardia dei
      Precursori. I morti furono circa cinquanta. Molti orchi, braccati,
      preferirono gettarsi nella Cicatrice piuttosto che farsi catturare.
