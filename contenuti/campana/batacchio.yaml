# La Campana Sepolta, strato 4: la camera del batacchio (campana.strato 3 → 4). Si entra dal cuore del coro
# (`campana-coro-la-capoturno`, coro.yaml) o dalla Superficie (`campana-la-strada-della-ripamuta`, sblocco.yaml).
# - area `campana-batacchio`: undici stanze ripetibili in fasce di profondità (una stanza superata non ricompare
#   nella stessa visita): 0 la scala intorno alla catena o la figura ruotata ai suoi piedi; 1 le crepe del pavimento
#   o le radici nere (il dono di Ghoran); 2 il busto deformato o il freno del batacchio; il contatore sull'orlo della
#   Campana vale da 1 a 3; 3 sotto la bocca o la passerella delle catene (un'altra figura ruotata); 4 il nido del
#   Campanaro o l'ultimo cancello, che si apre con l'ordine dell'Anello.
# - Le misure: l'ordine dell'Anello (il cancello, la terza fase del Campanaro, la scelta), il conto dei Tamburi (il
#   contatore). Origini: apprendista-raschiatore (la scala), fuggiasco-di-ghoran (le radici), figlio-della-citta-bassa
#   (il freno), accolito-del-velo (il cuore).
# - Il cuore a 5 è il Campanaro, la quarta forma della Salvaguardia, in tre fasi di fila: `campana-batacchio-il-
#   campanaro` (sulle catene), poi i seguiti `campana-batacchio-il-campanaro-a-terra` e `campana-batacchio-il-campanaro-
#   nella-voce`. Ogni fase si vince combattendo o con una via Difficile (il freno, il Comando, la Sordina, il pozzo,
#   l'ordine dell'Anello, la conchiglia sorda). Chi perde una fase qualsiasi torna in Superficie con Tormento e
#   Contaminazione, e lo strato da rifare. Chi vince la terza prende il Battente e le piastre del Campanaro, e
#   campana.strato va a 4.
# - Poi la scelta (`campana-batacchio-la-scelta`): zittire la Campana (campana.scelta 1) o lasciarla armata (2).
#   Le conseguenze si vedono in parte nelle scene dopo (sblocco.yaml); il resto è per il Capitolo II.
aree:
  - id: campana-batacchio
    immagine: ambientazione/mito-salvaguardia-precursori
    nome: La camera del batacchio
    sommario: "Oltre il coro della Ripamuta una scala scende fino alla Campana, attorno a una catena grossa come un tronco."
    spedizione: { ritorno: superficie-fratturata, soglia: 5, stanze: 3 }
    testo: |
      Oltre la parete di fondo del coro una scala di metallo nero scende nel buio girando
      intorno a una catena grossa come il tronco di una quercia, che vibra con una nota
      sola. Dal fondo sale un'aria fredda, con l'odore del mare e del ferro bagnato.

      A ogni giro la caverna si allarga, finché le pareti spariscono e restano le catene,
      sei, parallele nel buio a qualche decina di passi l'una dall'altra, e reggono tutte la
      stessa cosa.

colonna:
  - { contesto: area, id: campana-batacchio, musica: a-hundred-deaths, ambiente: hellish-dungeon-ii }

storylet:
  # ------------------------------------------------------------ 0 · la scala intorno alla catena
  - id: campana-batacchio-la-scala-della-catena
    immagine: icone/crossed-chains
    titolo: La scala intorno alla catena
    sommario: "La scala gira intorno alla catena e scende nel buio. A metà mancano i gradini per un giro intero."
    luogo: La camera del batacchio, la scala della catena
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 0]
    testo: |
      A metà discesa la scala si interrompe, e per un giro intero restano soltanto i perni piegati verso il basso, con la scala che riprende dieci uomini più sotto. La
      catena è a portata di braccio, con le maglie grandi quanto una porta, e sul perno più vicino è legato un nastro di stoffa grigia.

      {origine apprendista-raschiatore} Le catene dell'argano le hai imparate a toccare con il palmo aperto, per sentire se stanno per muoversi, e questa vibra sempre.
    opzioni:
      - testo: "Scendere lungo la catena"
        descrizione: "Di maglia in maglia per dieci uomini di vuoto, con la nota della catena nelle mani."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Di maglia in maglia
          testo: |
            Scendi abbracciato al metallo, una maglia alla volta, contando ad alta
            voce, e le maglie sono diciannove.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { atletica: 3 }
        fallimento:
          titolo: La maglia liscia
          testo: |
            Alla quarta maglia la mano scivola sul metallo, lisciato come vetro
            dalle dita di altri, e risali ai perni a forza di spalle con un
            braccio solo.
          effetti: { ferite: 1 }
      - testo: "Cercare la scala di servizio"
        descrizione: "Chi lavorava quaggiù non scendeva aggrappato alle catene. Da qualche parte c'è una scala per gli operatori."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Molto difficile }
        successo:
          titolo: I pioli nella catena
          testo: |
            Dentro ogni maglia, verso la parete, ci sono due pioli consumati da
            molte suole, e scendi come su una scala a pioli sentendoti stupido.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { percezione: 3 }
        fallimento:
          titolo: I perni piegati
          testo: |
            Ti sporgi sul vuoto con la lanterna finché una folata dal basso te la
            spegne, e resti abbracciato a un perno finché riesci a riaccenderla.
          effetti: { tormento: 1 }
      - testo: "Calarti con la corda"
        descrizione: "Una corda annodata a un perno, e giù nel vuoto. La corda la lasci lì."
        costo: 2
        esito:
          titolo: La corda che resta
          testo: |
            Ti cali dal perno del nastro grigio, e a metà la corda gira e ti
            sbatte due volte contro la catena con la stessa spalla. Arrivi in
            fondo con il palmo scorticato.
          effetti: { profondita.campana-batacchio: 1, ferite: 1, tormento: 1 }
      - testo: "Calarti con il nodo dei turni"
        descrizione: "Sulle piattaforme ti hanno insegnato il nodo che si scioglie da sotto. La corda torna con te."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il nodo dei turni
          testo: |
            Fai intorno al perno il nodo dei turni, che tiene finché il peso tira,
            e in fondo uno strappo dal basso ti fa cadere addosso la corda
            arrotolata come un serpente stanco.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { atletica: 3 }
        fallimento:
          titolo: Il nodo che non tiene
          testo: |
            Il nodo scivola a metà discesa, e ti ritrovi appeso alla catena con
            le gambe nel vuoto. Risali ai perni con le braccia che non vogliono
            più saperne.
          effetti: { ferite: 1 }

  # ------------------------------------------------------------ 0 · la figura ruotata
  - id: campana-batacchio-la-figura-ruotata
    immagine: ambientazione/mito-salvaguardia-precursori
    titolo: La figura ai piedi della scala
    sommario: "In fondo alla scala una figura ruotata cammina all'indietro intorno all'attacco della catena senza sbagliare un passo."
    luogo: La camera del batacchio, ai piedi della scala
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 0]
    testo: |
      Dove la scala finisce, la catena entra in un anello murato nel pavimento. Intorno all'anello cammina a ritroso una figura della Salvaguardia
      alta e sottile, con la testa girata all'indietro e le ginocchia piegate al contrario, e i suoi piedi hanno scavato nel pavimento un solco
      profondo una spanna, dove sono sparse delle monetine di rame consumate.
    opzioni:
      - testo: "Affrontarla"
        descrizione: "È svelta e non sbaglia i passi. La testa girata le mostra dove sei stato, mai dove vai."
        combattimento: campana-la-figura-ruotata
        vittoria:
          titolo: Il solco vuoto
          testo: |
            La figura cade di schiena nel suo solco e ci resta, con le ginocchia
            al contrario piegate verso il soffitto, e scavalchi l'anello senza
            guardare la maschera.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { armi-da-mischia: 3 }
        sconfitta:
          titolo: Il colpo all'indietro
          testo: |
            Ti colpisce senza voltarsi, con un braccio che si piega dalla parte
            sbagliata, e ti manda a sbattere contro i primi gradini.
      - testo: "Camminarle dietro"
        descrizione: "Se lei guarda indietro, tu le stai davanti. Basta andare al suo passo, e non sbagliarne uno."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Molto difficile }
        successo:
          titolo: Al suo passo
          testo: |
            Ti metti davanti a lei e cammini al suo passo guardandola, finché al terzo giro esci dal solco
            dalla parte del pozzo.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { furtivita: 3 }
        fallimento:
          titolo: Il passo sbagliato
          testo: |
            Inciampi in una monetina del solco e la figura si ferma, e il colpo ti
            prende al fianco prima che tu torni sulla scala.
          effetti: { ferite: 1 }
      - testo: "Aspettare sulla scala che si allontani"
        descrizione: "Il giro prima o poi la porterà dall'altra parte della catena."
        costo: 3
        esito:
          titolo: Il conto dei giri
          testo: |
            Conti i giri seduto sul gradino più basso, immobile quando la maschera
            ti cerca, e al cinquantesimo trovi il buco e scendi.
          effetti: { profondita.campana-batacchio: 1, ferite: 0.5, tormento: 1 }

  # ------------------------------------------------------------ 1 · le crepe
  - id: campana-batacchio-le-crepe
    immagine: ambientazione/regno-profondo
    titolo: Le crepe del pavimento
    sommario: "Il pavimento è spaccato in crepe che partono da un punto sotto la Campana e corrono fino alle pareti."
    luogo: La camera del batacchio, il pavimento
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 1]
    testo: |
      Il pavimento di basalto è spaccato in crepe che partono da sotto la bocca della Campana e si allargano come i raggi di una ruota fino alle pareti. Nelle più larghe
      ci entra una gamba, e sul fondo hanno acqua di mare nera e ferma.

      {tecnologia Molto difficile} I bordi sono fusi verso l'esterno, e chi ha battuto qui lo ha fatto dal centro, con un colpo solo.
    opzioni:
      - testo: "Attraversare saltando fra le crepe"
        descrizione: "Di lastra in lastra, sul basalto liscio, con l'acqua nera sotto."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Le lastre
          testo: |
            Salti di lastra in lastra con le braccia larghe, e ogni lastra si
            muove sotto il peso con un suono di piatti impilati.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { acrobazia: 3 }
        fallimento:
          titolo: La gamba nella crepa
          testo: |
            Una lastra si inclina e la gamba ti finisce in una crepa fino al
            ginocchio, in un'acqua densa come l'olio che ti lascia il polpaccio
            grigio fino a sera.
          effetti: { ferite: 0.5, contaminazione: 1 }
      - testo: "Leggere dove portano le crepe"
        descrizione: "Una crepa segue la forma del colpo che l'ha aperta, e all'indietro porta al punto più solido."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Molto difficile }
        successo:
          titolo: Il raggio più stretto
          testo: |
            Segui all'indietro il raggio più stretto, dove la roccia ha tenuto
            meglio, e arrivi al centro della camera su una striscia di basalto
            intero.

            {accademiche Difficile} Le crepe continuano oltre le pareti, nella
            roccia della costa, e fin dove arrivino non si può sapere da qui.
          effetti: { profondita.campana-batacchio: 1, reliquie.frammento-inciso: 1 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: Il raggio sbagliato
          testo: |
            Il raggio che scegli si allarga a metà strada e finisce nell'acqua nera. Torni indietro sulle tue orme con la sensazione che sotto i
            piedi qualcosa si sia mosso.
          effetti: { tormento: 1 }
      - testo: "Camminare lungo la parete"
        descrizione: "Dove le crepe entrano nella roccia sono più strette, ma il giro è lungo e la parete bagnata."
        costo: 2
        esito:
          titolo: Il giro lungo
          testo: |
            Fai il giro della camera con la mano sulla parete bagnata, scavalcando
            le crepe dove si stringono, e dopo ore arrivi dall'altra parte con le
            dita bianche di sale.
          effetti: { profondita.campana-batacchio: 1, ferite: 1, contaminazione: 1 }

  # ------------------------------------------------------------ 1 · le radici nere (il dono di Ghoran)
  - id: campana-batacchio-le-radici-nere
    immagine: icone/ceiling-barnacle
    titolo: Le radici nere
    sommario: "Dalla parete sud escono radici nere che palpitano con la nota della Campana e chiudono il passaggio al pozzo."
    luogo: La camera del batacchio, la parete sud
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 1]
    testo: |
      Dalla parete sud escono radici nere grosse come un braccio, che chiudono
      il passaggio verso il pozzo e palpitano piano con la nota della catena.
      Quando una goccia di sangue ti cola sul polso da un graffio, la radice
      più vicina si piega verso di lei.

      {origine fuggiasco-di-ghoran} A Ghoran si raccontava delle radici nere
      sotto l'arena che bevono il sangue di chi combatte, e il polso ti si
      ritira da solo nella manica.
    opzioni:
      - testo: "Passare in mezzo e lasciarle bere"
        descrizione: "Si spostano per il sangue. Bisogna dargliene abbastanza, e non di più."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Il prezzo del passaggio
          testo: |
            Ti riapri il taglio sul polso e cammini nel mezzo, e le radici si scostano al passaggio della mano e ti
            si chiudono dietro. Dall'altra parte ti fasci il polso stringendo la benda fra i denti.
          effetti: { profondita.campana-batacchio: 1, ferite: 0.5 }
          pe: { resistenza: 3 }
        fallimento:
          titolo: Troppo sangue
          testo: |
            A metà le radici ti si stringono intorno alla caviglia, e torni
            indietro pallido, a colpi di coltello, con il polso che non smette di
            sanguinare.
          effetti: { ferite: 1.5 }
      - testo: "Cercare dove le radici non arrivano"
        descrizione: "Una pianta che cerca il sangue cresce verso il caldo. Dove la roccia è fredda, forse, lascia un varco."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Molto difficile }
        successo:
          titolo: Il varco freddo
          testo: |
            Dove l'acqua delle crepe tiene fredda la roccia le radici si fanno
            rade, e passi carponi in un varco largo quanto le spalle.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { natura: 3 }
        fallimento:
          titolo: Il caldo delle radici
          testo: |
            Il varco che scegli è tiepido, e una radice ti si avvolge al braccio
            finché non la tagli, sputandoti addosso un liquido scuro.
          effetti: { ferite: 0.5, contaminazione: 1 }
      - testo: "Aprirti la strada a colpi d'arma"
        descrizione: "Sono radici, e le radici si tagliano. Quanto ci vuole, e quanto sangue chiedono, si vedrà."
        costo: 2
        esito:
          titolo: A colpi d'arma
          testo: |
            Ogni radice tagliata si contorce e schizza linfa scura, e quelle
            intorno si piegano verso le tue braccia. Passi dall'altra parte con le
            maniche fradice e le braccia segnate da cerchi rossi.
          effetti: { profondita.campana-batacchio: 1, ferite: 1.5 }
      - testo: "Farti riconoscere dalle radici della Fossa"
        descrizione: "Sei risalito vivo dal Seme sotto la Fossa, e a Ghoran chi ne risale è parente dei clan."
        requisiti: [dono.ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza, intimidire], difficolta: Media }
        successo:
          titolo: Il parente dei clan
          testo: |
            Ti sciogli dal polso il filo di rame del clan e lo tieni nel palmo aperto finché una goccia di sangue non ci cade sopra. Le radici battono più piano e si aprono in un passaggio largo quanto un uomo.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { resistenza: 3 }
        fallimento:
          titolo: La seconda pesata
          testo: |
            Le radici ti assaggiano il sangue e non si aprono, e passi in mezzo a
            fatica con le braccia segnate fino alle spalle.
          effetti: { profondita.campana-batacchio: 1, ferite: 1 }

  # ------------------------------------------------------------ 1-3 · il contatore
  - id: campana-batacchio-il-contatore
    immagine: icone/ringing-bell
    titolo: Il contatore
    sommario: "Dalla balconata si vede da vicino l'orlo della Campana, dove corre una fila di segni che a mezzanotte cambia."
    luogo: La camera del batacchio, la balconata dell'orlo
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio >= 1, profondita.campana-batacchio <= 3]
    testo: |
      Una balconata stretta sporge fino a un passo dall'orlo della Campana, un
      muro curvo di metallo nero che si perde nel buio. Sull'orlo, all'altezza
      del petto, corre una fila di segni incisi grandi quanto una mano.

      {accademiche Difficile} Sono numeri dei Precursori, e tutta la fila è un
      numero solo, lunghissimo.
    opzioni:
      - testo: "Confrontarlo con il conto dei Tamburi"
        descrizione: "Il conto copiato ai Tamburi scende di tre colpi a notte, e se torna sai cosa conta la Campana."
        requisiti: [misura.tamburi >= 1]
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Difficile }
        successo:
          titolo: Lo stesso numero
          testo: |
            Togli tre colpi per ogni notte passata dal conto dei Tamburi e confronti i segni uno per uno, e tornano. Il battente sotto la palude conta per la Campana, colpo dopo colpo. Con il foglio in mano trovi la scala che scende.

            {resilienza Difficile} Un conto alla rovescia si fa per qualcosa che deve arrivare, oppure per qualcosa da fare quando arriva lo zero.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { accademiche: 5 }
        fallimento:
          titolo: I segni che ballano
          testo: |
            I segni ti si confondono davanti agli occhi, e il mal di testa ti
            accompagna per tutta la discesa, che non riesci a trovare.
          effetti: { tormento: 1 }
      - testo: "Leggere la fila di segni"
        descrizione: "È un numero dei Precursori. Leggerlo intero chiede tempo, e la balconata è stretta."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Molto difficile }
        successo:
          titolo: Il numero intero
          testo: |
            Lo leggi intero, tre volte, muovendo le labbra. Poi scrivi il numero
            sulla carta della Gilda, e accanto il segno che hai visto cambiare.
            Dalla balconata parte una scaletta che scende sul lato dell'orlo.
          effetti: { profondita.campana-batacchio: 1, informazioni.segreto: 1 }
          pe: { accademiche: 3 }
        fallimento:
          titolo: La ringhiera
          testo: |
            Ti sporgi troppo e la ringhiera cede sotto il gomito. Ti aggrappi
            all'orlo della Campana, e il ronzio ti resta nelle ossa delle mani per
            ore.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Scendere dalla balconata senza guardare l'orlo"
        descrizione: "Il numero resta dov'è. La scaletta di servizio è arrugginita, e scende comunque."
        costo: 2
        esito:
          titolo: La scaletta
          testo: |
            Scendi per la scaletta di servizio con gli occhi sui pioli, finché uno
            cede sotto lo stivale e arrivi in fondo con un ginocchio sbucciato.
          effetti: { profondita.campana-batacchio: 1, ferite: 1, tormento: 1 }

  # ------------------------------------------------------------ 2 · il busto deformato
  - id: campana-batacchio-il-busto
    immagine: ambientazione/mito-salvaguardia-precursori
    titolo: Il busto sulla passerella
    sommario: "Sulla passerella intorno al pozzo si trascina sulle braccia un busto della Salvaguardia di carne e metallo."
    luogo: La camera del batacchio, la passerella del pozzo
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 2]
    testo: |
      Intorno al pozzo corre una passerella di metallo larga quanto un carro, e
      a metà del giro un busto della Salvaguardia si trascina sulle braccia, con
      le spine di ferro che gli escono dalla schiena e la metà di carne grigia e
      lucida d'acqua. Ogni volta che si sposta, la passerella vibra fino ai tuoi
      piedi.

      {rissa Media} Occupa la passerella per tutta la larghezza, con le spine
      sulla schiena e le braccia a difendere il davanti.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "È lento e pesante, e la riduzione delle piastre gli fa da corazza. Bisogna colpire forte, e a lungo."
        combattimento: campana-il-busto-deformato
        vittoria:
          titolo: Le spine nel pozzo
          testo: |
            Il busto si accascia sul bordo della passerella e il suo peso lo
            trascina nel pozzo, dove il mare se lo prende senza un tonfo.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { armi-da-mischia: 3 }
        sconfitta:
          titolo: Il pugno di ferro
          testo: |
            Un braccio del busto ti prende in pieno petto e ti stende, e lui si
            trascina via senza fretta, come se avesse finito un lavoro.
      - testo: "Saltargli oltre la schiena"
        descrizione: "Fra una spina e l'altra c'è spazio per un piede, con un salto preciso."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Molto difficile }
        successo:
          titolo: In mezzo alle spine
          testo: |
            Appoggi lo stivale sul gomito del busto e salti fra due spine, che ti
            strappano la manica, e atterri dall'altra parte su un ginocchio.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { atletica: 3 }
        fallimento:
          titolo: La spina nella coscia
          testo: |
            Lo stivale scivola sul metallo bagnato e una spina ti entra nella
            coscia, e il busto ti scrolla indietro da dove eri venuto.
          effetti: { ferite: 1.5 }
      - testo: "Aspettare che si trascini via"
        descrizione: "Gira intorno al pozzo, come tutto quaggiù. Prima o poi libera la strada."
        costo: 3
        esito:
          titolo: Il giro del busto
          testo: |
            Aspetti contro la parete che il busto faccia il giro del pozzo, e quando ti passa davanti la passerella vibra tanto che ti battono i denti.
          effetti: { profondita.campana-batacchio: 1, ferite: 0.5, tormento: 1 }

  # ------------------------------------------------------------ 2 · il freno
  - id: campana-batacchio-il-freno
    immagine: icone/big-gear
    titolo: Il freno del batacchio
    sommario: "Due ganasce di metallo nero grandi come case tengono fermo il batacchio, e la leva ha il manico consumato."
    luogo: La camera del batacchio, il freno
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 2]
    testo: |
      Il batacchio pende dentro la Campana, lungo quanto l'albero di una nave,
      stretto a metà da due ganasce di metallo nero come dalle mascelle di un
      cane. Da una ganascia scende fino alla passerella un braccio che finisce in
      una leva, con il manico consumato in due incavi lucidi.

      {tecnologia Difficile} Qualcuno ha chiuso il freno a mano da qui, dopo che
      la Campana aveva cominciato a suonare.

      {origine figlio-della-citta-bassa} Alle fucine il manico del maglio si
      consuma in anni, e questi incavi li ha fatti una mano sola, in una notte.
    opzioni:
      - testo: "Leggere il freno"
        descrizione: "Come si chiude, quando è stato chiuso, e da dove si passa senza toccarlo."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: La leva tirata
          testo: |
            Seguendo il braccio del freno trovi, nascosta nell'ombra della ganascia, la passatoia degli operatori. Accanto alla leva c'è un cerchio di nove incavi con i segni dei posti neri, girati nel
            verso contrario a quello delle pietre dell'Anello.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: Il braccio che si muove
          testo: |
            Il braccio del freno scende di un dito sotto la tua mano e sopra di te
            le ganasce scricchiolano, e ti allontani in fretta.
          effetti: { tormento: 1 }
      - testo: "Arrampicarti sul braccio del freno"
        descrizione: "Dal braccio alla ganascia, e dalla ganascia alla passerella di sopra. È metallo liscio e bagnato."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Molto difficile }
        successo:
          titolo: Sopra le ganasce
          testo: |
            Sali lungo il braccio a forza di gambe e dalla ganascia salti sulla passerella di sopra, dove il batacchio nero è a un passo
            e manda un freddo da blocco di ghiaccio.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { atletica: 3 }
        fallimento:
          titolo: La caduta sulla passerella
          testo: |
            Il metallo bagnato non tiene, e scivoli giù lungo il braccio fino ad
            atterrare di schiena sulla passerella, con un colpo che ti lascia
            intontito.
          effetti: { ferite: 1 }
      - testo: "Passare sotto le ganasce"
        descrizione: "C'è spazio, se ti abbassi. Sopra di te, il freno che tiene il batacchio."
        costo: 2
        esito:
          titolo: Sotto le ganasce
          testo: |
            Passi sotto le ganasce piegato in due, con il metallo nero a un palmo
            dalla nuca. A metà le ganasce scricchiolano e ti butti in avanti,
            sbucciandoti le mani sulla passerella.
          effetti: { profondita.campana-batacchio: 1, ferite: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · sotto la bocca
  - id: campana-batacchio-la-bocca
    immagine: ambientazione/regno-profondo
    titolo: Sotto la bocca
    sommario: "La strada per la piattaforma passa sotto la bocca della Campana, dove non si sente niente."
    luogo: La camera del batacchio, sotto la bocca
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 3]
    testo: |
      Per una ventina di passi la passerella corre sotto la bocca della Campana,
      dove non arriva nessun suono e quando batti le mani non le senti. Fuori
      dalla bocca, sull'orlo del pozzo, c'è una cornice di roccia larga un piede,
      bagnata dagli spruzzi.

      {resilienza Difficile} Il silenzio lì sotto si porta via quello che hai in
      testa, e bisogna passare in fretta tenendosi stretti i pensieri.
    opzioni:
      - testo: "Passare sotto la bocca"
        descrizione: "Venti passi di silenzio. Bisogna arrivare in fondo ricordandosi perché ci si è entrati."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Difficile }
        successo:
          titolo: Venti passi
          testo: |
            Cammini sotto la bocca dicendoti ad alta voce il tuo nome, senza
            sentirlo. Al decimo passo ti scordi perché sei lì e al dodicesimo te
            ne ricordi. Quando esci, il mare ti torna nelle orecchie tutto in una
            volta.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { resilienza: 5 }
        fallimento:
          titolo: Il nome che manca
          testo: |
            A metà ti fermi senza sapere più che cosa stai facendo sulla
            passerella, e torni indietro verso la luce della lanterna. Fuori dal
            silenzio ci metti un pezzo a ricordarti come ti chiami.
          effetti: { tormento: 1.5 }
      - testo: "Camminare sulla cornice del pozzo"
        descrizione: "Fuori dalla bocca, sulla roccia bagnata, con il mare sotto. Lì almeno i suoni ci sono."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Molto difficile }
        successo:
          titolo: La cornice
          testo: |
            Cammini sulla cornice con la schiena contro la roccia e gli spruzzi in
            faccia, e il rumore del mare ti tiene compagnia fino alla piattaforma.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { acrobazia: 3 }
        fallimento:
          titolo: Lo spruzzo
          testo: |
            Un'onda sale più alta delle altre e ti investe, e resti appeso alla cornice per le mani con l'acqua salata negli occhi, finché risali
            dalla parte da cui eri venuto.
          effetti: { ferite: 1, contaminazione: 0.5 }
      - testo: "Correre sotto la bocca a occhi chiusi"
        descrizione: "Venti passi di corsa. Quello che il silenzio si prende, se lo prende in fretta."
        costo: 2
        esito:
          titolo: La corsa nel silenzio
          testo: |
            Corri a occhi chiusi contando i passi, ed esci con la sensazione di
            aver perso qualcosa. Per giorni ti mancherà il nome di una persona che
            conoscevi bene.
          effetti: { profondita.campana-batacchio: 1, tormento: 2 }

  # ------------------------------------------------------------ 3 · la passerella delle catene
  - id: campana-batacchio-la-passerella-delle-catene
    immagine: icone/crossed-chains
    titolo: La passerella delle catene
    sommario: "Una passerella sospesa passa fra le sei catene, e su una cammina a testa in giù un'altra figura ruotata."
    luogo: La camera del batacchio, fra le catene
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 3]
    testo: |
      Una passerella sospesa attraversa il vuoto fra le sei catene, appesa a
      cavi che cantano piano sotto i piedi. Sulla catena più vicina una figura
      ruotata della Salvaguardia va su e giù a testa in giù, a ritroso, a un
      tiro di sasso dalla passerella.

      {furtivita Difficile} Guarda in alto quando scende e in basso quando
      sale, ed è allora che si passa.
    opzioni:
      - testo: "Affrontarla sulla passerella"
        descrizione: "Sulla passerella non c'è spazio per girarle intorno. Né per lei, né per te."
        combattimento: campana-la-figura-ruotata
        vittoria:
          titolo: La figura nel vuoto
          testo: |
            La figura perde la presa e cade nel vuoto senza un suono, e attraversi
            la passerella che ondeggia con le mani strette ai cavi.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { armi-da-mischia: 3 }
        sconfitta:
          titolo: La passerella che ondeggia
          testo: |
            La figura ti colpisce dall'alto e la passerella si piega di lato, e
            resti aggrappato ai cavi finché non riprende a salire.
      - testo: "Passare mentre sale"
        descrizione: "Quando sale guarda il pozzo, e la passerella le resta alle spalle. Bisogna essere svelti, e leggeri."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Il momento giusto
          testo: |
            Aspetti che la figura cominci a salire e attraversi di corsa sulle
            punte, e quando torna a scendere sei già contro la roccia dall'altra
            parte.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { furtivita: 3 }
        fallimento:
          titolo: I cavi che cantano
          testo: |
            I cavi cantano più forte del previsto e la figura scende verso di te
            più svelta di come saliva. Torni indietro di corsa, con un colpo di
            striscio sulla schiena.
          effetti: { ferite: 1 }
      - testo: "Attraversare appeso sotto la passerella"
        descrizione: "Mano dopo mano, sotto il piano della passerella, dove la figura non guarda mai."
        costo: 3
        esito:
          titolo: Mano dopo mano
          testo: |
            Ti cali sotto la passerella e la attraversi appeso ai traversi, mano
            dopo mano, con il vuoto sotto i piedi, e arrivi dall'altra parte con
            le braccia che tremano fino al mattino dopo.
          effetti: { profondita.campana-batacchio: 1, ferite: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 4 · il nido del Campanaro
  - id: campana-batacchio-il-nido
    immagine: icone/ringing-bell
    titolo: Il nido fra le catene
    sommario: "Fra le catene, in alto, c'è un nido di cose appese che tintinnano, e sopra il nido qualcosa dorme."
    luogo: La camera del batacchio, sotto il nido
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 4]
    testo: |
      Fra due catene, in alto, qualcuno ha intrecciato un nido di fili di metallo largo come un carro, da cui pendono decine di tazze e chiavi legate a un filo ciascuna, e perfino una scarpa da bambino con la fibbia. Quando l'aria del pozzo sale
      tintinnano tutte insieme. Sopra il nido, ripiegato fra le maglie, c'è un corpo lungo e magro che non si muove.

      {percezione Difficile} Le cose appese sono tutte degli operatori, e chi le ha raccolte le ha appese dove la Campana le sente.
    opzioni:
      - testo: "Passare sotto il nido senza un rumore"
        descrizione: "Sotto il nido, lungo la catena, con le cose appese a un palmo dalla testa."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Sotto il nido
          testo: |
            Piegato in due, passi sotto il nido mentre tazze e chiavi ti sfiorano i capelli senza suonare.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { furtivita: 3 }
        fallimento:
          titolo: La tazza
          testo: |
            La spalla urta una tazza e lassù un braccio lungo si scioglie dalle
            maglie, e resti nascosto dietro la catena finché non torna al suo
            posto.
          effetti: { tormento: 1, ferite: 0.5 }
      - testo: "Staccare la scarpa da bambino"
        descrizione: "È la cosa più piccola e più bassa del nido. Allunghi la mano, e intanto guardi dove porta il filo."
        prova: { attributo: mentale, abilita: [percezione, empatia], difficolta: Molto difficile }
        successo:
          titolo: La scarpa
          testo: |
            Sciogli il filo dalla fibbia senza farla suonare. Dove il filo saliva
            verso il nido, fra due maglie, c'è il passaggio per la piattaforma, e
            metti la scarpa nello zaino senza saperne bene il motivo.
          effetti: { profondita.campana-batacchio: 1, reliquie.frammento-inciso: 1 }
          pe: { empatia: 3 }
        fallimento:
          titolo: Il filo che tira
          testo: |
            Il filo è legato a tutti gli altri, e quando lo tiri il nido suona
            intero e il corpo lassù si scuote mentre scappi giù lungo la catena.
          effetti: { tormento: 1.5 }
      - testo: "Passare lontano, dall'altra catena"
        descrizione: "Il giro lungo, sulla catena più lontana dal nido, con le maglie bagnate."
        costo: 3
        esito:
          titolo: L'altra catena
          testo: |
            Passi sull'altra catena di maglia in maglia, così lentamente che la
            lanterna si consuma fino al fondo, e arrivi con le mani in carne viva.
          effetti: { profondita.campana-batacchio: 1, ferite: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 4 · l'ultimo cancello
  - id: campana-batacchio-l-ultimo-cancello
    immagine: icone/key-lock
    titolo: L'ultimo cancello
    sommario: "La piattaforma sotto la Campana è chiusa da un cancello nero con nove incavi al posto della serratura."
    luogo: La camera del batacchio, il cancello della piattaforma
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 4]
    testo: |
      La passerella finisce contro un cancello di metallo nero alto il doppio di te, che al posto della serratura ha un cerchio di nove incavi con i segni dei posti neri, dalla porta della Soglia all'occhio del Sornione. L'arco curvo della Costola è scavato più a fondo degli altri.

      {accademiche Difficile} Nove incavi e nove pietre all'Anello del Camminatore, e l'ordine lo conosci.
    opzioni:
      - testo: "Dare le misure nell'ordine dell'Anello"
        descrizione: "Si comincia dal cerchio e si finisce con la nota, una misura per incavo, nell'ordine delle nove pietre."
        requisiti: [misura.anello >= 1]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Difficile }
        successo:
          titolo: Nove incavi
          testo: |
            Tocchi il cerchio per primo e fai il gesto della Soglia davanti alla porta. Poi dici il nome di Nan'Ireth alla mano aperta e vai avanti incavo dopo incavo, fino all'arco curvo, dove canti la nota della Costola. Il cancello si apre verso l'interno senza un cigolio.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { accademiche: 5 }
        fallimento:
          titolo: L'ordine sbagliato
          testo: |
            Al sesto incavo esiti, e le sbarre vibrano tutte insieme con una nota
            che ti arriva nelle tempie mentre gli incavi si svuotano, e devi
            ricominciare da capo.
          effetti: { tormento: 1 }
      - testo: "Forzare il meccanismo"
        descrizione: "Dietro le sbarre si vedono i perni del cancello. Con la lama giusta e molta pazienza, forse."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Molto difficile }
        successo:
          titolo: Il perno
          testo: |
            Infili la lama fra le sbarre e spingi il perno un capello alla volta,
            finché si sblocca con uno scatto che ti passa per il braccio e il
            cancello si apre quanto basta a passarci di fianco.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: La lama spezzata
          testo: |
            La lama si spezza contro il perno e il cancello vibra con una nota che
            ti fa lacrimare gli occhi, a lungo.
          effetti: { tormento: 1, ferite: 0.5 }
      - testo: "Arrampicarti oltre il cancello"
        descrizione: "In cima le sbarre finiscono in punte. Sopra le punte c'è la volta, e in mezzo uno spazio stretto."
        costo: 3
        esito:
          titolo: Le punte
          testo: |
            Passi fra le punte delle sbarre e la volta strisciando sulla pancia, e
            una punta ti apre la giubba e la pelle dal fianco alla schiena.
          effetti: { profondita.campana-batacchio: 1, ferite: 1.5 }

  # ------------------------------------------------------------ il cuore · il Campanaro, prima fase (sulle catene)
  - id: campana-batacchio-il-campanaro
    immagine: ambientazione/mito-salvaguardia-precursori
    titolo: Il Campanaro
    sommario: "Oltre il cancello c'è la piattaforma sotto la Campana, e fra le catene si scioglie una forma della Salvaguardia."
    luogo: La camera del batacchio, la piattaforma
    area: campana-batacchio
    requisiti: [campana.strato == 3, profondita.campana-batacchio >= 5]
    testo: |
      Oltre il cancello una piattaforma rotonda sporge sul pozzo. La Campana nera pende dalla volta con la bocca in giù, grande quanto la navata della Cattedrale del Velo, e la reggono sei catene che salgono nel buio. Dentro la
      bocca il batacchio sta fermo fra le ganasce del freno, e la leva è sulla piattaforma, a dieci passi da te. Sull'orlo corre la fila di segni del contatore, e mentre la guardi un segno cambia.

      Fra le catene qualcosa si scioglie dalle maglie. Prima vedi le braccia, sei, lunghe il doppio delle tue, che finiscono in ganci da corda. Poi il corpo, magro come una scala a pioli, e per ultima la maschera bianca, uguale a
      quella del ragno-sacrificale ma con una bocca, che tiene chiusa. *È il campanaro, e aspetta l'ordine di suonare.* Le gambe ti hanno già portato mezzo passo indietro.

      {origine accolito-del-velo} Al Velo ti hanno insegnato a non chiedere che cosa c'è sotto l'altare. Qui sotto c'è una campana, e qualcuno che le fa la guardia da prima della Caduta.

      Il Campanaro scende lungo una catena a testa in giù senza nessuna fretta, e si ferma a mezza altezza fra te e il freno, con i ganci aperti.
    opzioni:
      - testo: "Affrontarlo sulle catene"
        descrizione: "Risale le maglie più svelto di te e attacca con sei braccia. È la prima di tre volte."
        combattimento: campana-il-campanaro-sulle-catene
        vittoria:
          titolo: Il Campanaro cade
          testo: |
            Gli tagli tre ganci uno dopo l'altro, finché il Campanaro perde la presa e cade sulla piattaforma di schiena, con un colpo che fa tremare il pozzo
            e le piastre del petto che si aprono in una crepa. Poi si gira sulle braccia che gli restano e si rialza più basso e più largo di prima, con la
            maschera rivolta verso il freno.
          pe: { armi-da-mischia: 5 }
          segue: campana-batacchio-il-campanaro-a-terra
        sconfitta:
          titolo: I ganci
          testo: |
            I ganci ti prendono da tre parti insieme e il Campanaro ti porta in
            alto fra le catene, poi ti lascia andare sopra il pozzo. Il mare ti
            risputa sugli scogli ai piedi della Ripamuta, e ci metti tre giorni a
            tornare verso la città. La camera del batacchio è tutta da rifare.
          effetti: { tormento: 2, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Scuotere le catene con il freno"
        descrizione: "Se apri e chiudi di colpo le ganasce le catene sobbalzano, e chi ci sta appeso cade."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Lo scatto
          testo: |
            Corri alla leva e la tiri, e le ganasce si aprono di un dito e si
            richiudono. Le catene sobbalzano tutte insieme, e il batacchio oscilla
            fermandosi a un dito dal metallo. Il Campanaro vola giù dalle maglie e
            batte il petto sulla piattaforma, che gli si apre in una crepa, poi si
            rialza più basso e più largo di prima, con la maschera rivolta verso
            il freno.
          pe: { tecnologia: 5 }
          segue: campana-batacchio-il-campanaro-a-terra
        fallimento:
          titolo: La leva che sfugge
          testo: |
            La leva ti sfugge di mano e torna su con uno schianto. Le catene
            sobbalzano dalla parte sbagliata e il Campanaro ti cade addosso con
            tutti i ganci. Il mare ti risputa dal pozzo sugli scogli fuori
            dall'arco con una spalla fuori posto, e la camera del batacchio è da
            rifare.
          effetti: { ferite: 2, tormento: 2, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Ordinargli di scendere"
        descrizione: "Il Comando parla alla Salvaguardia nella sua lingua, e questa forma l'ha sentita più di tutte."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: L'ordine
          testo: |
            Dici la formula in una lingua che non conosci, e il Campanaro si ferma
            con i ganci aperti. Scende piano fino alla piattaforma, come gli hai
            ordinato, e si posa davanti a te, finché la maschera si gira verso il
            freno e l'ordine finisce lì. Un momento dopo ti viene addosso
            camminando sulle braccia.
          pe: { magia: 5 }
          segue: campana-batacchio-il-campanaro-a-terra
        fallimento:
          titolo: La risposta da dentro la maschera
          testo: |
            Il Campanaro risponde con un'altra formula, detta da dentro la
            maschera chiusa, e la tua ti torna indietro rovesciata. Ti ritrovi nel
            pozzo, e quando il mare ti risputa sugli scogli ai piedi della
            Ripamuta la camera del batacchio è da rifare.
          effetti: { ferite: 1, tormento: 2, contaminazione: 1.5 }
          vai: superficie-fratturata

  # ------------------------------------------------------------ il Campanaro, seconda fase (a terra)
  - id: campana-batacchio-il-campanaro-a-terra
    tipo: seguito
    immagine: bestiario/salvaguardia-precursori
    titolo: Il contrappeso
    sommario: "Caduto dalle catene, il Campanaro strappa dal freno il contrappeso del batacchio e lo fa girare sopra la piattaforma."
    luogo: La camera del batacchio, la piattaforma
    area: campana-batacchio
    requisiti: [campana.strato == 3]
    testo: |
      Il Campanaro si raddrizza sulla piattaforma, con due braccia rotte che gli
      pendono dalle spalle. Afferra con gli altri quattro ganci il contrappeso
      del freno, un blocco di metallo grande come un carro, e lo strappa via.

      Poi lo fa girare. Il contrappeso passa a un palmo dalla piattaforma, e dove
      la sfiora il metallo si apre in crepe a raggiera.

      {atletica Media} A ogni giro il peso gli porta via l'equilibrio, e per un
      momento lo lascia voltato dall'altra parte.

      Il pozzo è a tre passi dietro di lui, con il mare che sale e scende senza
      rumore.
    opzioni:
      - testo: "Affrontarlo a terra"
        descrizione: "È lento, e ogni colpo che manca crepa la piattaforma. Quelli che non manca, però, non si rialzano."
        combattimento: campana-il-campanaro-a-terra
        vittoria:
          titolo: La maschera che si apre
          testo: |
            Lo colpisci ogni volta che il contrappeso finisce il giro, sempre
            nello stesso punto del fianco, finché le piastre cedono. Il Campanaro
            lascia andare il contrappeso, che rotola oltre l'orlo e sparisce nel
            pozzo senza un tonfo. Lui cade in ginocchio. Per la prima volta la
            maschera si muove, e la bocca si apre.
          pe: { armi-da-mischia: 5 }
          segue: campana-batacchio-il-campanaro-nella-voce
        sconfitta:
          titolo: Il contrappeso
          testo: |
            Il contrappeso ti prende di striscio, e di striscio basta a mandarti
            oltre l'orlo. Il mare ti risputa sugli scogli ai piedi della Ripamuta
            con le costole rotte, e la camera del batacchio è da rifare.
          effetti: { tormento: 2, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Parare il contrappeso con la Sordina"
        descrizione: "La Sordina non suona quando la colpiscono, e il colpo lo regge il tuo braccio."
        requisiti: [oggetto.campana-la-sordina >= 1]
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Il colpo che muore
          testo: |
            Ti pianti sulla piattaforma con la Sordina alzata, e il contrappeso ci
            batte contro in pieno, morendo nel disco senza un suono. Il Campanaro
            resta sbilanciato con il peso fermo davanti a sé, e una spallata basta
            perché il contrappeso se lo porti oltre l'orlo. Risale dal pozzo
            grondando, con la bocca della maschera aperta.
          pe: { resistenza: 5 }
          segue: campana-batacchio-il-campanaro-nella-voce
        fallimento:
          titolo: Il braccio
          testo: |
            La Sordina tiene, ma il braccio sotto il disco cede e voli nel pozzo.
            Il mare ti risputa sugli scogli ai piedi della Ripamuta, e la camera
            del batacchio è da rifare.
          effetti: { ferite: 2, tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Fargli portare il contrappeso nel pozzo"
        descrizione: "A ogni giro il peso lo tira verso l'orlo. Se lo schivi all'ultimo dalla parte del pozzo, lo porta giù."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Molto difficile }
        successo:
          titolo: Il giro di troppo
          testo: |
            Aspetti il contrappeso sull'orlo del pozzo e ti butti di lato
            all'ultimo, e il suo peso si porta dietro il Campanaro oltre l'orlo.
            Poi i ganci tornano su dal buio uno alla volta, e il Campanaro risale
            grondando, con la bocca della maschera aperta.
          pe: { acrobazia: 5 }
          segue: campana-batacchio-il-campanaro-nella-voce
        fallimento:
          titolo: Troppo tardi
          testo: |
            Ti butti di lato un battito troppo tardi, e il contrappeso ti prende
            la gamba e ti trascina oltre l'orlo. Il mare ti risputa sugli scogli
            ai piedi della Ripamuta, e la camera del batacchio è da rifare.
          effetti: { ferite: 2, tormento: 2, contaminazione: 1 }
          vai: superficie-fratturata

  # ------------------------------------------------------------ il Campanaro, terza fase (nella voce)
  - id: campana-batacchio-il-campanaro-nella-voce
    tipo: seguito
    immagine: ambientazione/mito-salvaguardia-precursori
    titolo: La voce
    sommario: "Il Campanaro ha aperto la bocca, e dalla bocca esce la voce della Campana."
    luogo: La camera del batacchio, l'orlo del pozzo
    area: campana-batacchio
    requisiti: [campana.strato == 3]
    testo: |
      Il Campanaro sta in ginocchio sull'orlo del pozzo con la bocca della maschera aperta. Ne esce una voce senza parole che cambia
      tono a ogni battito e non viene da lui. Viene dalla Campana, e passa per la sua bocca come l'acqua in un tubo.

      La voce ti entra nella testa e ti porta via la strada di casa, poi il nome di qualcuno a cui volevi bene. Sta cercando le nove
      misure che hai in testa.

      {tecnologia Molto difficile} È la Campana che si prova la gola, e sull'orlo il contatore ha preso a cambiare più in fretta.
    opzioni:
      - testo: "Affrontarlo nella voce"
        descrizione: "Dieci passi fino alla maschera, con la voce che ti porta via i ricordi, e poi colpire la bocca."
        combattimento: campana-il-campanaro-nella-voce
        vittoria:
          titolo: La bocca spaccata
          testo: |
            Ti avvicini un passo alla volta con la voce che ti scava, e colpisci
            la maschera finché la bocca non si spacca e il suono si ferma a metà.
            Il Campanaro resta inginocchiato sull'orlo, con le braccia distese
            sulla piattaforma come corde lasciate cadere. Gli stacchi il martello
            dalla cintura e le piastre dal petto, e il contatore torna a cambiare
            piano.
          imposta: { campana.strato: 4 }
          effetti: { oggetto.campana-il-battente: 1, oggetto.campana-piastre-del-campanaro: 1, parte.impugnatura-3: 1, cristalli.cristallo-carico: 4, reperto.sigillato: 2 }
          pe: { armi-da-mischia: 10, resilienza: 5 }
          segue: campana-batacchio-la-scelta
        sconfitta:
          titolo: Quello che resta
          testo: |
            Cadi a tre passi dalla maschera, e la voce si prende quello che trova.
            Ti risvegli sugli scogli ai piedi della Ripamuta senza sapere come ci
            sei arrivato, con qualcosa che ti manca e non riesci a nominare, e la
            camera del batacchio è da rifare.
          effetti: { tormento: 2.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Dare alla Campana le nove misure nell'ordine dell'Anello"
        descrizione: "La Campana ascoltava l'operatore che dava le misure nell'ordine giusto, e il Campanaro tira soltanto le catene."
        requisiti: [misura.anello >= 1]
        prova: { attributo: mentale, abilita: [accademiche, resilienza], difficolta: Difficile }
        successo:
          titolo: Il nuovo operatore
          testo: |
            Dai alla Campana le misure nell'ordine delle nove pietre, dal cerchio
            dell'Anello fino alla nota della Costola cantata a bocca chiusa, con
            in mezzo il nome di Nan'Ireth. La voce lascia la bocca del Campanaro e
            torna nel metallo, e lui si ripiega e non si muove più. Gli stacchi il
            martello e le piastre dal petto, e il contatore torna a cambiare
            piano.
          imposta: { campana.strato: 4 }
          effetti: { oggetto.campana-il-battente: 1, oggetto.campana-piastre-del-campanaro: 1, parte.impugnatura-3: 1, cristalli.cristallo-carico: 4, reperto.sigillato: 2 }
          pe: { accademiche: 10, resilienza: 5 }
          segue: campana-batacchio-la-scelta
        fallimento:
          titolo: L'ordine perso
          testo: |
            Alla sesta misura la voce ti porta via la settima e l'ordine si
            spezza. Il suono ti riempie la testa fino a farti cadere, e ti
            risvegli sugli scogli fuori dall'arco con la camera del batacchio da
            rifare.
          effetti: { ferite: 2, tormento: 2, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Arrivare alla maschera con la conchiglia sorda"
        descrizione: "Se la conchiglia degli sfiati regge, arrivi alla bocca con la testa ancora tua."
        requisiti: [oggetto.campana-conchiglia-sorda >= 1]
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Difficile }
        successo:
          titolo: La bocca chiusa
          testo: |
            Ti premi la conchiglia sull'orecchio e cammini verso la maschera, e la
            voce ti arriva attutita, come da dietro un muro. Davanti al Campanaro
            gli chiudi la bocca della maschera con le mani, e il suono si spegne
            mentre lui si ripiega su se stesso. Gli stacchi il martello dalla
            cintura e le piastre dal petto, e il contatore torna a cambiare piano.
          imposta: { campana.strato: 4 }
          effetti: { oggetto.campana-il-battente: 1, oggetto.campana-piastre-del-campanaro: 1, parte.impugnatura-3: 1, cristalli.cristallo-carico: 4, reperto.sigillato: 2 }
          pe: { resilienza: 10 }
          segue: campana-batacchio-la-scelta
        fallimento:
          titolo: La conchiglia piena
          testo: |
            A metà strada la conchiglia si riempie di suono, e da quel momento ti
            fa male il doppio. Cadi in ginocchio davanti alla maschera e ti
            risvegli sugli scogli ai piedi della Ripamuta, con la camera del
            batacchio da rifare.
          effetti: { ferite: 2, tormento: 2, contaminazione: 1 }
          vai: superficie-fratturata

  # ------------------------------------------------------------ la scelta
  - id: campana-batacchio-la-scelta
    tipo: seguito
    immagine: ambientazione/regno-profondo
    titolo: La leva del freno
    sommario: "La Campana è intera, e il contatore sull'orlo continua a scendere. Sulla leva del freno c'è un cerchio di nove incavi."
    luogo: La camera del batacchio, la leva del freno
    area: campana-batacchio
    requisiti: [campana.strato == 4, campana.scelta == 0]
    testo: |
      Il Campanaro non si muove più. Nella camera resta il mare che sale e scende nel pozzo senza rumore, e sopra di te la
      Campana, intera. Sull'orlo il contatore cambia un segno, piano, come ha fatto ogni notte da prima che ci fosse
      Qir-Azel.

      Sulla leva del freno c'è un altro cerchio di nove incavi, con gli stessi segni del cancello girati nel verso opposto, e
      il più profondo è l'arco curvo della Costola. Lo guardi a lungo, finché capisci. Le nove misure date nell'ordine
      dell'Anello aprono, e date a rovescio, cominciando dalla nota, chiudono il freno per sempre e spengono il contatore.

      {tecnologia Difficile} Un freno chiuso così non si riapre, e gli organi sparsi sotto la Superficie resterebbero al loro
      posto a servire una campana muta.

      Ti siedi con la schiena contro la leva. Se la Campana ha annunciato la Caduta, zittirla vuol dire spegnere l'unico
      allarme che la Superficie abbia mai avuto, mentre il contatore conta verso qualcosa che arriverà comunque. Se l'ha
      provocata, lasciarla armata vuol dire aspettare che il conto arrivi in fondo e che suoni di nuovo. Dagli sfiati al coro
      le prove che hai trovato puntano da tutte e due le parti.

      {origine mercante-dei-ponti} Ai Ponti un affare si chiude davanti a un testimone, e questo lo chiudi da solo sotto la
      scogliera.
    opzioni:
      - testo: "Zittire la Campana"
        descrizione: "Le nove misure a rovescio, sulla leva. Il contatore si ferma, e se qualcosa arriverà nessuno lo annuncerà."
        esito:
          titolo: Il freno chiuso
          testo: |
            Dai le misure alla leva a rovescio, dalla nota della Costola al
            cerchio tracciato con il dito. La leva si abbassa da sola e le ganasce
            si serrano sul batacchio con un colpo che senti nei denti, mentre
            lungo l'orlo i segni del contatore si spengono uno dopo l'altro.
            Quando esci dall'arco è notte, e ai piedi della scogliera, per la
            prima volta, le onde fanno rumore.
          imposta: { campana.scelta: 1 }
          pe: { resilienza: 5, tecnologia: 5 }
          vai: superficie-fratturata
      - testo: "Lasciarla armata"
        descrizione: "La Campana resta com'è, con il freno chiuso a mano e il contatore che scende fino a quando suonerà."
        esito:
          titolo: Il contatore che scende
          testo: |
            Lasci la leva com'è, con il freno chiuso dalla mano che lo ha tirato quella notte, e il
            Campanaro in ginocchio sull'orlo. Il contatore cambia un segno, e quando lo confronti
            con il conto dei Tamburi, meno tre colpi per ogni notte passata, i due numeri tornano.
            Quando esci dall'arco è notte, e ai piedi della scogliera le onde continuano a rompersi
            in silenzio.
          imposta: { campana.scelta: 2 }
          pe: { accademiche: 5, resilienza: 5 }
          vai: superficie-fratturata
