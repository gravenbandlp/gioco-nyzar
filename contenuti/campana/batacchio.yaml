# La Campana Sepolta, strato 4: la camera del batacchio (campana.strato 3 → 4). Si entra dal cuore del coro
# (`campana-coro-la-capoturno`, coro.yaml) o dalla Superficie (`campana-la-strada-della-ripamuta`, sblocco.yaml).
# - area `campana-batacchio`: undici stanze ripetibili in fasce di profondità (una stanza superata non ricompare
#   nella stessa visita): 0 la scala intorno alla catena o la figura ruotata ai suoi piedi; 1 le crepe del pavimento
#   o le radici nere (il dono di Ghoran); 2 il busto deformato o il freno del batacchio; il contatore sull'orlo della
#   Campana vale da 1 a 3; 3 sotto la bocca o la passerella delle catene (un'altra figura ruotata); 4 il nido del
#   Campanaro o l'ultimo cancello, che si apre con l'ordine dell'Anello.
# - Le misure: l'ordine dell'Anello (il cancello, la terza fase del Campanaro, la scelta), il conto dei Tamburi (il
#   contatore). Origini: apprendista-raschiatore (la scala), fuggiasco-di-ghoran (le radici), figlio-della-citta-bassa
#   (il freno), accolito-del-velo (il cuore).
# - Il cuore a 5 è il Campanaro, la quarta forma della Salvaguardia, in tre fasi di fila: `campana-batacchio-il-
#   campanaro` (sulle catene), poi i seguiti `campana-batacchio-il-campanaro-a-terra` e `campana-batacchio-il-campanaro-
#   nella-voce`. Ogni fase si vince combattendo o con una via Difficile (il freno, il Comando, la Sordina, il pozzo,
#   l'ordine dell'Anello, la conchiglia sorda). Chi perde una fase qualsiasi torna in Superficie con Tormento e
#   Contaminazione, e lo strato da rifare. Chi vince la terza prende il Battente e le piastre del Campanaro, e
#   campana.strato va a 4.
# - Poi la scelta (`campana-batacchio-la-scelta`): zittire la Campana (campana.scelta 1) o lasciarla armata (2).
#   Le conseguenze si vedono in parte nelle scene dopo (sblocco.yaml); il resto è per il Capitolo II.
aree:
  - id: campana-batacchio
    immagine: ambientazione/mito-salvaguardia-precursori
    nome: La camera del batacchio
    sommario: "In fondo alla Ripamuta, oltre il coro, una scala gira intorno a una catena grossa come un tronco e scende fino alla Campana."
    spedizione: { ritorno: superficie-fratturata, soglia: 5, stanze: 3 }
    testo: |
      Oltre la parete di fondo del coro comincia una scala di metallo nero che
      gira intorno a una catena, e la catena è grossa come il tronco di una
      quercia. Scende nel buio per un tratto che la lanterna non arriva a
      illuminare, e vibra con una nota sola che ti sale dalla mano fino alla
      spalla.

      Dal fondo arriva un'aria fredda, con l'odore del mare e del ferro bagnato. A ogni giro
      della scala la caverna si allarga, finché le pareti spariscono e resta
      soltanto la catena, con altre catene uguali che scendono parallele nel
      buio a qualche decina di passi. Sono sei, e reggono tutte la stessa cosa.
      Ti fermi a contarle due volte, aggrappato al corrimano, perché la prima
      volta la mano ti tremava troppo per tenere il conto.

colonna:
  - { contesto: area, id: campana-batacchio, musica: a-hundred-deaths, ambiente: hellish-dungeon-ii }

storylet:
  # ------------------------------------------------------------ 0 · la scala intorno alla catena
  - id: campana-batacchio-la-scala-della-catena
    immagine: icone/crossed-chains
    titolo: La scala intorno alla catena
    sommario: "La scala gira intorno alla catena e scende nel buio. A metà mancano i gradini per un giro intero."
    luogo: La camera del batacchio, la scala della catena
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 0]
    testo: |
      A metà discesa la scala si interrompe. Mancano i gradini per un giro
      intero, strappati dai loro attacchi, e restano soltanto i perni piegati
      verso il basso. Sotto, a una caduta di dieci uomini, la scala riprende.
      La catena è lì accanto, a portata di braccio, con le maglie grandi
      quanto una porta di casa.

      Sul perno più vicino è legato un nastro di stoffa grigia, sbiadito, con
      un nodo da pacco regalo fatto con cura.

      {atletica Difficile} Le maglie hanno il bordo largo un palmo. Si scende di maglia in maglia aggrappandosi con le mani e con le ginocchia, purché la catena resti ferma.

      {origine apprendista-raschiatore} Alle piattaforme della Cicatrice le
      catene dell'argano le hai imparate a toccare con il palmo aperto, per
      sentire se stanno per muoversi. Questa vibra sempre, e il palmo non sa
      più che cosa aspettarsi.
    opzioni:
      - testo: "Scendere lungo la catena"
        descrizione: "Di maglia in maglia per dieci uomini di vuoto, con la nota della catena nelle mani."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Di maglia in maglia
          testo: |
            Scendi abbracciato al metallo, una maglia alla volta, con la nota
            della catena che ti entra nelle ginocchia. Quando metti il piede sul
            primo gradino intero ti accorgi di aver contato le maglie ad alta
            voce, e che erano diciannove.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { atletica: 3 }
        fallimento:
          titolo: La maglia liscia
          testo: |
            Alla quarta maglia la mano scivola sul metallo, che è liscio come il
            vetro dove le dita di altri l'hanno consumato prima di te. Ti
            riprendi con un braccio solo, e risali a forza di spalle fino ai
            perni, con la spalla che brucia.
          effetti: { ferite: 1 }
      - testo: "Cercare la scala di servizio"
        descrizione: "Chi lavorava quaggiù non scendeva aggrappato alle catene. Da qualche parte c'è una scala per gli operatori."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Molto difficile }
        successo:
          titolo: I pioli nella catena
          testo: |
            La trovi guardando la catena da vicino. Dentro ogni maglia, sul lato
            che dà verso la parete, ci sono due pioli di metallo nero consumati
            al centro da molte suole. Scendi tranquillo come su una scala a pioli,
            e ti senti stupido per un buon tratto.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { percezione: 3 }
        fallimento:
          titolo: I perni piegati
          testo: |
            Cerchi a lungo sulla parete e sui perni, sporgendoti sul vuoto con la
            lanterna. Una folata dal basso te la spegne, e resti al buio
            abbracciato a un perno finché non riesci a riaccenderla con le dita
            che tremano.
          effetti: { tormento: 1 }
      - testo: "Calarti con la corda"
        descrizione: "Una corda annodata a un perno, e giù nel vuoto. La corda la lasci lì."
        costo: 2
        esito:
          titolo: La corda che resta
          testo: |
            Annodi la corda al perno del nastro grigio e ti cali nel vuoto. A
            metà la corda gira su se stessa, e tu con lei, e sbatti contro la
            catena due volte con la stessa spalla. Arrivi in fondo con il palmo
            scorticato e la corda che dondola sopra di te.
          effetti: { profondita.campana-batacchio: 1, ferite: 1, tormento: 1 }
      - testo: "Calarti con il nodo dei turni"
        descrizione: "Sulle piattaforme ti hanno insegnato il nodo che si scioglie da sotto. La corda torna con te."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il nodo dei turni
          testo: |
            Fai il nodo dei turni intorno al perno, quello che tiene finché il
            peso tira e si scioglie con uno strappo dal basso. In fondo dai lo
            strappo, e la corda ti cade addosso arrotolata come un serpente
            stanco.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { atletica: 3 }
        fallimento:
          titolo: Il nodo che non tiene
          testo: |
            Il nodo scivola a metà discesa, e ti ritrovi appeso alla catena con
            le gambe nel vuoto. Risali ai perni con le braccia che non vogliono
            più saperne.
          effetti: { ferite: 1 }

  # ------------------------------------------------------------ 0 · la figura ruotata
  - id: campana-batacchio-la-figura-ruotata
    immagine: ambientazione/mito-salvaguardia-precursori
    titolo: La figura ai piedi della scala
    sommario: "In fondo alla scala una figura ruotata cammina all'indietro intorno all'attacco della catena senza sbagliare un passo."
    luogo: La camera del batacchio, ai piedi della scala
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 0]
    testo: |
      Dove la scala finisce, la catena entra in un anello di metallo murato nel
      pavimento. Intorno all'anello cammina una figura della Salvaguardia alta e sottile, con la testa girata all'indietro e le ginocchia piegate al
      contrario. Va a ritroso, un giro dopo l'altro, e i suoi piedi hanno
      scavato nel pavimento un solco profondo una spanna.

      {rissa Difficile} Gira sempre nello stesso verso, e la fessura della
      maschera guarda il punto da cui viene. Chi le sta davanti è al sicuro
      solo finché lei non si ferma.

      {percezione Media} Nel solco, a intervalli uguali, ci sono delle
      monetine di rame, così consumate che non si legge più il conio.
    opzioni:
      - testo: "Affrontarla"
        descrizione: "È svelta e non sbaglia i passi. La testa girata la fa vedere dove sei stato, mai dove stai andando."
        combattimento: campana-la-figura-ruotata
        vittoria:
          titolo: Il solco vuoto
          testo: |
            La figura cade di schiena nel suo solco e ci resta, con le ginocchia
            al contrario piegate verso il soffitto. Ti tremano le braccia per un
            pezzo. Scavalchi l'anello della catena senza guardare la maschera.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { armi-da-mischia: 3 }
        sconfitta:
          titolo: Il colpo all'indietro
          testo: |
            Ti colpisce senza voltarsi, con un braccio che si piega dalla parte
            sbagliata, e ti manda a sbattere contro i primi gradini. Risali
            carponi di qualche giro e aspetti che riprenda a camminare.
      - testo: "Camminarle dietro"
        descrizione: "Se lei guarda indietro, tu le stai davanti. Basta andare al suo passo, e non sbagliarne uno."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Molto difficile }
        successo:
          titolo: Al suo passo
          testo: |
            Ti metti davanti a lei e cammini al suo passo, voltato a guardarla,
            con il solco sotto i piedi. Al secondo giro trovi il ritmo, e al
            terzo esci dal solco dalla parte del pozzo. Alle tue spalle lei continua a girare intorno alla catena.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { furtivita: 3 }
        fallimento:
          titolo: Il passo sbagliato
          testo: |
            Inciampi in una monetina del solco, e la figura si ferma. La fessura
            della maschera si apre su di te, e il colpo ti prende al fianco prima
            che tu riesca a tornare sulla scala.
          effetti: { ferite: 1 }
      - testo: "Aspettare sulla scala che si allontani"
        descrizione: "Il giro prima o poi la porterà dall'altra parte della catena."
        costo: 3
        esito:
          titolo: Il conto dei giri
          testo: |
            Resti seduto sul gradino più basso a contare i giri. Ogni volta che
            la figura passa dalla tua parte la fessura della maschera ti cerca, e
            tu smetti di muoverti. Al cinquantesimo giro trovi il buco e scendi,
            con il collo rigido e le dita indolenzite a forza di contare.
          effetti: { profondita.campana-batacchio: 1, ferite: 0.5, tormento: 1 }

  # ------------------------------------------------------------ 1 · le crepe
  - id: campana-batacchio-le-crepe
    immagine: ambientazione/regno-profondo
    titolo: Le crepe del pavimento
    sommario: "Il pavimento della camera è spaccato in crepe che partono tutte da un punto sotto la Campana e corrono fino alle pareti."
    luogo: La camera del batacchio, il pavimento
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 1]
    testo: |
      Il pavimento è di basalto lisciato, e le crepe lo attraversano tutte
      nella stessa direzione. Partono da un punto al centro della camera, proprio sotto la bocca della Campana, e si allargano come i raggi di una ruota fino alle pareti,
      dove entrano nella roccia e spariscono. Alcune sono larghe un dito. Altre
      sono abbastanza larghe da infilarci una gamba, e sul fondo hanno acqua di
      mare ferma, nera, che non si muove nemmeno quando ci getti un sasso.

      {tecnologia Molto difficile} I bordi delle crepe sono fusi verso
      l'esterno. Chi ha battuto qui lo ha fatto dal centro, con un colpo
      solo, e la roccia si è aperta tutta insieme.

      {acrobazia Difficile fallita} Le gambe guardano le crepe più larghe e
      decidono che preferiscono restare dove sono.
    opzioni:
      - testo: "Attraversare saltando fra le crepe"
        descrizione: "Di lastra in lastra, sul basalto liscio, con l'acqua nera sotto."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Le lastre
          testo: |
            Salti da una lastra all'altra con le braccia larghe, e ogni lastra si
            muove appena sotto il tuo peso, con un suono di piatti impilati.
            Arrivi dall'altra parte con le ginocchia che tremano e le suole
            bagnate di un'acqua che non ricordi di aver toccato.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { acrobazia: 3 }
        fallimento:
          titolo: La gamba nella crepa
          testo: |
            Una lastra si inclina sotto il piede, e la gamba ti finisce in una
            crepa fino al ginocchio. L'acqua nera è gelida e densa come l'olio.
            Ti tiri fuori a forza di braccia, e il polpaccio ti resta grigio fino
            a sera.
          effetti: { ferite: 0.5, contaminazione: 1 }
      - testo: "Leggere dove portano le crepe"
        descrizione: "Una crepa che parte da un colpo segue la forma del colpo. Seguendola all'indietro si arriva al punto più solido."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Molto difficile }
        successo:
          titolo: Il raggio più stretto
          testo: |
            Segui all'indietro il raggio più stretto, quello dove la roccia ha
            tenuto meglio, e cammini dritto verso il centro della camera su una
            striscia di basalto intero. Tutto intorno il pavimento è spaccato come
            un piatto battuto sul bordo di un tavolo.

            {accademiche Difficile} Le crepe continuano oltre le pareti, nella
            roccia della costa. Fin dove arrivino non c'è modo di saperlo da qui.
          effetti: { profondita.campana-batacchio: 1, reliquie.frammento-inciso: 1 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: Il raggio sbagliato
          testo: |
            Il raggio che scegli si allarga a metà strada e finisce in una crepa
            piena d'acqua nera. Torni indietro sulle tue orme con la sensazione che sotto i piedi qualcosa si sia mosso, e non riesci a togliertela.
          effetti: { tormento: 1 }
      - testo: "Camminare lungo la parete"
        descrizione: "Dove le crepe entrano nella roccia sono più strette. Il giro è lungo, e la parete è bagnata."
        costo: 2
        esito:
          titolo: Il giro lungo
          testo: |
            Fai il giro della camera con la mano sulla parete bagnata, scavalcando
            le crepe dove entrano nella roccia. Ci metti ore. Arrivi dall'altra
            parte con le dita bianche di sale e i piedi fradici di acqua nera.
          effetti: { profondita.campana-batacchio: 1, ferite: 1, contaminazione: 1 }

  # ------------------------------------------------------------ 1 · le radici nere (il dono di Ghoran)
  - id: campana-batacchio-le-radici-nere
    immagine: icone/ceiling-barnacle
    titolo: Le radici nere
    sommario: "Dalla parete sud escono radici nere, lisce, che palpitano con la nota della Campana e chiudono il passaggio verso il pozzo."
    luogo: La camera del batacchio, la parete sud
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 1]
    testo: |
      Dalla parete sud escono radici nere grosse come un braccio, lisce, senza
      corteccia. Attraversano il passaggio verso il pozzo in un intrico fitto, e
      palpitano piano con la nota della catena, tutte insieme. Dove ti sei
      graffiato scendendo, una goccia di sangue ti cola sul polso. La radice più
      vicina si piega verso la goccia.

      {natura Difficile} Queste radici vengono da lontano, da sud, attraverso la
      roccia. Nessuna pianta che conosci cresce al buio così.

      {origine fuggiasco-di-ghoran} Nei recinti di Ghoran si raccontava della
      Fossa sotto l'arena, con le radici nere che bevono il sangue di chi
      combatte. Le stesse radici sono arrivate fin qui, e il polso ti si ritira
      da solo dentro la manica.
    opzioni:
      - testo: "Passare in mezzo e lasciarle bere"
        descrizione: "Si spostano per il sangue. Bisogna dargliene abbastanza, e non di più."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Il prezzo del passaggio
          testo: |
            Ti apri il taglio sul polso con la punta del coltello e cammini nel
            mezzo. Le radici si scostano al passaggio della mano e ti si chiudono
            dietro. Dall'altra parte stringi la benda con i denti. Hai la testa leggera e la mano fredda fino al gomito.
          effetti: { profondita.campana-batacchio: 1, ferite: 0.5 }
          pe: { resistenza: 3 }
        fallimento:
          titolo: Troppo sangue
          testo: |
            Le radici bevono più in fretta di quanto riesci a camminare, e a metà
            ti si stringono intorno alla caviglia. Ti liberi a colpi di coltello e
            torni indietro pallido, con le gambe molli e il polso che non smette
            di sanguinare.
          effetti: { ferite: 1.5 }
      - testo: "Cercare dove le radici non arrivano"
        descrizione: "Una pianta che cerca il sangue cresce verso il caldo. Dove la roccia è fredda, forse, lascia un varco."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Molto difficile }
        successo:
          titolo: Il varco freddo
          testo: |
            Lungo il pavimento, dove l'acqua delle crepe tiene fredda la roccia, le
            radici si fanno sottili e rade. Passi carponi in un varco largo quanto
            le spalle, con il ventre sul basalto gelato.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { natura: 3 }
        fallimento:
          titolo: Il caldo delle radici
          testo: |
            Il varco che scegli è tiepido, e le radici ti trovano subito. Una ti
            si avvolge al braccio e ti stringe finché non la tagli. Il taglio
            sputa un liquido scuro che ti resta sulla pelle.
          effetti: { ferite: 0.5, contaminazione: 1 }
      - testo: "Aprirti la strada a colpi d'arma"
        descrizione: "Sono radici, e le radici si tagliano. Quanto ci vuole, e quanto sangue chiedono, si vedrà."
        costo: 2
        esito:
          titolo: A colpi d'arma
          testo: |
            Tagli una radice alla volta, e ogni radice tagliata si contorce e
            schizza linfa scura. Quelle intorno si piegano verso le tue braccia
            ancora prima che tu abbia finito. Passi dall'altra parte con le
            maniche fradice e le braccia segnate da cerchi rossi.
          effetti: { profondita.campana-batacchio: 1, ferite: 1.5 }
      - testo: "Farti riconoscere dalle radici della Fossa"
        descrizione: "Sei sceso fino al Seme sotto la Fossa e ne sei risalito vivo, e a Ghoran chi ne risale è parente dei clan. Le radici di laggiù battevano già a tempo con questo colpo."
        requisiti: [dono.ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza, intimidire], difficolta: Media }
        successo:
          titolo: Il parente dei clan
          testo: |
            Ti sciogli dal polso il filo di rame del clan e lo tieni nel palmo aperto, come davanti alla bilancia di Ghoran, finché una goccia di sangue non ci cade sopra. Le radici battono più piano e si aprono in un passaggio largo quanto un uomo. Ti si richiudono dietro con calma.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { resistenza: 3 }
        fallimento:
          titolo: La seconda pesata
          testo: |
            Le radici ti assaggiano il sangue e non si aprono. Ti tocca passare
            in mezzo a fatica, e quando arrivi dall'altra parte hai le braccia
            segnate fino alle spalle.
          effetti: { profondita.campana-batacchio: 1, ferite: 1 }

  # ------------------------------------------------------------ 1-3 · il contatore
  - id: campana-batacchio-il-contatore
    immagine: icone/ringing-bell
    titolo: Il contatore
    sommario: "Da una balconata si vede l'orlo della Campana da vicino. Sull'orlo corre una fila di segni, e a mezzanotte uno cambia."
    luogo: La camera del batacchio, la balconata dell'orlo
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio >= 1, profondita.campana-batacchio <= 3]
    testo: |
      Una balconata stretta sporge dalla parete fino a un passo dall'orlo della
      Campana. Da qui il metallo nero è un muro curvo che sale e si perde nel
      buio, e sull'orlo, all'altezza del tuo petto, corre una fila di segni
      incisi, ciascuno grande quanto una mano. Sulla ringhiera c'è appoggiata una
      tazza di metallo, rovesciata, come lasciata ad asciugare.

      {accademiche Difficile} Sono numeri, scritti come li scrivevano i
      Precursori. Li leggi a fatica uno alla volta, e capisci che tutta la fila
      è un numero solo, lunghissimo.

      {tecnologia Molto difficile fallita} Non capisci dove stia il meccanismo
      che li cambia. Le mani vorrebbero smontare l'orlo per scoprirlo, e la
      testa le ferma appena in tempo.
    opzioni:
      - testo: "Confrontarlo con il conto dei Tamburi"
        descrizione: "Il conto copiato ai Tamburi scende di tre colpi a notte. Se torna con questo, sai che cosa conta la Campana."
        requisiti: [misura.tamburi >= 1]
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Difficile }
        successo:
          titolo: Lo stesso numero
          testo: |
            Tiri fuori il foglio con il conto dei Tamburi, togli tre colpi per ogni notte passata e confronti i segni uno per uno. Tornano. Il battente sotto la palude conta per lei, colpo dopo colpo. Lasci la balconata con il foglio stretto in mano, e trovi da solo la scala che scende.

            {resilienza Difficile} Un conto alla rovescia si fa per qualcosa che
            deve arrivare. Oppure per qualcosa che si deve fare quando arriva lo
            zero.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { accademiche: 5 }
        fallimento:
          titolo: I segni che ballano
          testo: |
            I segni ti si confondono davanti agli occhi, e più li confronti più
            ti sembrano diversi. Ti viene un mal di testa che parte dalla nuca e
            ti resta addosso per tutta la discesa che non riesci a trovare.
          effetti: { tormento: 1 }
      - testo: "Leggere la fila di segni"
        descrizione: "È un numero dei Precursori. Leggerlo intero chiede tempo, e la balconata è stretta."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Molto difficile }
        successo:
          titolo: Il numero intero
          testo: |
            Lo leggi intero, tre volte, muovendo le labbra. Poi scrivi il numero
            sulla carta della Gilda, e accanto il segno che hai visto cambiare.
            Dalla balconata parte una scaletta che scende sul lato dell'orlo.
          effetti: { profondita.campana-batacchio: 1, informazioni.segreto: 1 }
          pe: { accademiche: 3 }
        fallimento:
          titolo: La ringhiera
          testo: |
            Ti sporgi troppo per leggere gli ultimi segni, e la ringhiera cede
            sotto il gomito. Riesci ad aggrapparti all'orlo della Campana, che
            vibra sotto le dita. Il ronzio ti resta nelle ossa delle mani per ore.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Scendere dalla balconata senza guardare l'orlo"
        descrizione: "Il numero resta dov'è. La scaletta di servizio è arrugginita, e scende comunque."
        costo: 2
        esito:
          titolo: La scaletta
          testo: |
            Scendi per la scaletta di servizio con gli occhi sui pioli. La ruggine
            ti si sbriciola fra le dita, e un piolo ti cede sotto lo stivale. Sei
            in fondo con un ginocchio sbucciato, e i segni dell'orlo ti restano
            negli occhi lo stesso.
          effetti: { profondita.campana-batacchio: 1, ferite: 1, tormento: 1 }

  # ------------------------------------------------------------ 2 · il busto deformato
  - id: campana-batacchio-il-busto
    immagine: ambientazione/mito-salvaguardia-precursori
    titolo: Il busto sulla passerella
    sommario: "La passerella che gira intorno al pozzo è bloccata da un busto della Salvaguardia che si trascina sulle braccia, con il suo corpo di carne e di metallo."
    luogo: La camera del batacchio, la passerella del pozzo
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 2]
    testo: |
      Intorno al pozzo corre una passerella di metallo larga quanto un carro.
      A metà del giro c'è un busto della Salvaguardia, appoggiato sulle braccia,
      con le spine di ferro che gli escono dalla schiena come radici rovesciate.
      La metà di carne è grigia e lucida d'acqua. Ogni volta che si sposta la
      passerella vibra fino ai tuoi piedi, e sotto il pozzo la superficie del
      mare trema in cerchi.

      {rissa Media} Si muove piano, ma la passerella è sua per tutta la
      larghezza. Le spine coprono la schiena, e il davanti lo difendono le
      braccia.

      {medicina Difficile} La carne non è morta. Non è nemmeno viva come la
      intendi tu, e non sanguina dove il metallo la morde.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "È lento e pesante, e la riduzione delle piastre gli fa da corazza. Bisogna colpire forte, e a lungo."
        combattimento: campana-il-busto-deformato
        vittoria:
          titolo: Le spine nel pozzo
          testo: |
            Il busto si accascia sul bordo della passerella, e il suo peso lo
            trascina giù nel pozzo. Il mare se lo prende senza un tonfo. Resti a
            guardare i cerchi sull'acqua finché le braccia ti smettono di
            tremare.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { armi-da-mischia: 3 }
        sconfitta:
          titolo: Il pugno di ferro
          testo: |
            Un braccio del busto ti prende in pieno petto e ti stende sulla
            passerella. Rotoli indietro fino alla parete mentre lui si trascina
            via, senza fretta, come se avesse finito un lavoro.
      - testo: "Saltargli oltre la schiena"
        descrizione: "Le spine sono alte, ma fra una spina e l'altra c'è spazio per un piede. Basta un salto preciso."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Molto difficile }
        successo:
          titolo: In mezzo alle spine
          testo: |
            Prendi la rincorsa sulla passerella che vibra, appoggi lo stivale sul
            gomito del busto e salti fra due spine. Una ti strappa la manica.
            Atterri dall'altra parte su un ginocchio e ti rialzi correndo, senza
            voltarti.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { atletica: 3 }
        fallimento:
          titolo: La spina nella coscia
          testo: |
            Lo stivale scivola sul metallo bagnato, e una spina ti entra nella
            coscia. Il busto si scrolla, e ti ritrovi sulla passerella dalla
            parte da cui eri venuto, con la gamba che sanguina.
          effetti: { ferite: 1.5 }
      - testo: "Aspettare che si trascini via"
        descrizione: "Gira intorno al pozzo, come tutto quaggiù. Prima o poi libera la strada."
        costo: 3
        esito:
          titolo: Il giro del busto
          testo: |
            Ti siedi contro la parete e aspetti. Il busto fa il giro del pozzo una volta sola, molto lentamente. Quando ti passa davanti la passerella vibra sotto
            di te così forte che ti battono i denti. Appena si allontana passi anche tu, con la testa che rimbomba.
          effetti: { profondita.campana-batacchio: 1, ferite: 0.5, tormento: 1 }

  # ------------------------------------------------------------ 2 · il freno
  - id: campana-batacchio-il-freno
    immagine: icone/big-gear
    titolo: Il freno del batacchio
    sommario: "Due ganasce di metallo nero grandi come case tengono fermo il batacchio. La leva che le chiude ha un manico consumato dalle mani."
    luogo: La camera del batacchio, il freno
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 2]
    testo: |
      Il batacchio pende dentro la Campana, lungo quanto l'albero di una nave,
      e due ganasce di metallo nero lo stringono a metà come le mascelle di un
      cane. Da una delle ganasce scende fino alla passerella un braccio di
      metallo, e il braccio finisce in una leva. Il manico è fatto per mani più
      grandi delle tue, e nel punto dove si stringe il metallo è consumato in due
      incavi lucidi.

      {tecnologia Difficile} Il freno si chiude a mano, da qui. Qualcuno ha tirato
      questa leva dopo che la Campana aveva cominciato a suonare.

      {origine figlio-della-citta-bassa} Alle fucine il manico del maglio si
      consuma dove lo tiene il fabbro più vecchio, e si riconosce da quello chi
      lavora lì da più anni. Questi incavi li ha fatti una mano sola, in una
      notte sola.
    opzioni:
      - testo: "Leggere il freno"
        descrizione: "Come si chiude, quando è stato chiuso, e da dove si passa senza toccarlo."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: La leva tirata
          testo: |
            Segui il braccio del freno fino alla ganascia e trovi la passatoia
            che usavano gli operatori, nascosta nella sua ombra. Accanto alla leva c'è un cerchio di nove incavi con i segni dei posti neri, girati nel verso contrario a quello delle pietre dell'Anello.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: Il braccio che si muove
          testo: |
            Appoggi la mano sul braccio del freno per seguirlo, e il braccio
            scende di un dito sotto il tuo peso. Sopra di te le ganasce
            scricchiolano. Ti allontani in fretta, e non riesci più a toglierti
            dalle orecchie quello scricchiolio.
          effetti: { tormento: 1 }
      - testo: "Arrampicarti sul braccio del freno"
        descrizione: "Dal braccio alla ganascia, e dalla ganascia alla passerella di sopra. È metallo liscio e bagnato."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Molto difficile }
        successo:
          titolo: Sopra le ganasce
          testo: |
            Sali lungo il braccio a forza di gambe, e dalla ganascia salti sulla
            passerella di sopra. Da lassù il batacchio nero è a un passo da te. Senti il freddo che manda, come da un blocco di ghiaccio.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { atletica: 3 }
        fallimento:
          titolo: La caduta sulla passerella
          testo: |
            Il metallo bagnato non tiene. Scivoli giù lungo il braccio e atterri
            sulla passerella di schiena, e il colpo ti svuota i polmoni per un
            momento che dura troppo.
          effetti: { ferite: 1 }
      - testo: "Passare sotto le ganasce"
        descrizione: "C'è spazio, se ti abbassi. Sopra di te, il freno che tiene il batacchio."
        costo: 2
        esito:
          titolo: Sotto le ganasce
          testo: |
            Passi sotto le ganasce piegato in due, con il metallo nero a un palmo
            dalla nuca. A metà le ganasce scricchiolano, e ti butti in avanti
            senza pensare. Ti sbucci le mani sulla passerella, e il cuore non ti
            torna al suo posto per un bel pezzo.
          effetti: { profondita.campana-batacchio: 1, ferite: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · sotto la bocca
  - id: campana-batacchio-la-bocca
    immagine: ambientazione/regno-profondo
    titolo: Sotto la bocca
    sommario: "La strada per la piattaforma passa proprio sotto la bocca della Campana, sopra il pozzo. Lì sotto non si sente niente."
    luogo: La camera del batacchio, sotto la bocca
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 3]
    testo: |
      La passerella passa sotto la bocca della Campana, e per una ventina di
      passi hai sopra la testa il buio dentro il metallo. Lì sotto non arriva
      nessun suono. Senti il mare muoversi nel pozzo soltanto dalle gocce che ti
      bagnano la faccia, e quando batti le mani non senti le mani. Anche il cuore,
      che fino a un momento fa ti batteva nelle orecchie, è sparito.

      {resilienza Difficile} Il silenzio lì sotto si porta via quello che hai
      in testa, a pezzi piccoli. Bisogna passare in fretta, tenendosi stretti i
      pensieri.

      {acrobazia Molto difficile} Fuori dalla bocca, sull'orlo del pozzo, c'è
      una cornice di roccia larga un piede, bagnata dagli spruzzi.
    opzioni:
      - testo: "Passare sotto la bocca"
        descrizione: "Venti passi di silenzio. Bisogna arrivare in fondo ricordandosi perché ci si è entrati."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Difficile }
        successo:
          titolo: Venti passi
          testo: |
            Cammini sotto la bocca dicendoti ad alta voce il tuo nome, senza
            sentirlo. Al decimo passo ti scordi perché sei lì, e al dodicesimo te
            ne ricordi. Quando esci dal silenzio il mare ti torna nelle orecchie
            tutto in una volta, e ti appoggi alla ringhiera finché passa.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { resilienza: 5 }
        fallimento:
          titolo: Il nome che manca
          testo: |
            A metà ti fermi, e non sai più che cosa stai facendo sulla passerella.
            Torni indietro, perché indietro c'è la luce della lanterna. Fuori dal
            silenzio ti siedi per terra, e ci metti un pezzo a ricordarti come ti
            chiami.
          effetti: { tormento: 1.5 }
      - testo: "Camminare sulla cornice del pozzo"
        descrizione: "Fuori dalla bocca, sulla roccia bagnata, con il mare sotto. Lì almeno i suoni ci sono."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Molto difficile }
        successo:
          titolo: La cornice
          testo: |
            Cammini sulla cornice di fianco, con la schiena contro la roccia e gli
            spruzzi in faccia. Il mare nel pozzo fa rumore, qui fuori dalla bocca,
            e quel rumore ti tiene compagnia fino alla piattaforma.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { acrobazia: 3 }
        fallimento:
          titolo: Lo spruzzo
          testo: |
            Un'onda nel pozzo sale più alta delle altre e ti investe. Il piede
            scivola, e resti appeso alla cornice per le mani mentre l'acqua salata ti brucia gli occhi. Risali a fatica dalla parte da cui eri venuto.
          effetti: { ferite: 1, contaminazione: 0.5 }
      - testo: "Correre sotto la bocca a occhi chiusi"
        descrizione: "Venti passi di corsa. Quello che il silenzio si prende, se lo prende in fretta."
        costo: 2
        esito:
          titolo: La corsa nel silenzio
          testo: |
            Corri a occhi chiusi, contando i passi con le dita. Esci dall'altra
            parte e ti accorgi di aver perso qualcosa per strada, senza sapere
            che cosa. Per giorni ti mancherà il nome di una persona che conoscevi
            bene, sulla punta della lingua.
          effetti: { profondita.campana-batacchio: 1, tormento: 2 }

  # ------------------------------------------------------------ 3 · la passerella delle catene
  - id: campana-batacchio-la-passerella-delle-catene
    immagine: icone/crossed-chains
    titolo: La passerella delle catene
    sommario: "Una passerella sospesa passa fra le sei catene della Campana. Su una catena, a testa in giù, cammina un'altra figura ruotata."
    luogo: La camera del batacchio, fra le catene
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 3]
    testo: |
      Una passerella sospesa attraversa il vuoto fra le sei catene, appesa a
      cavi di metallo che cantano piano quando ci metti il piede. Sulla catena
      più vicina, a testa in giù, cammina una figura ruotata della Salvaguardia.
      Va su e giù lungo le maglie a ritroso, e la passerella le passa sotto a
      un tiro di sasso.

      {furtivita Difficile} Quando scende guarda in alto, e quando sale guarda
      in basso. Il momento giusto per passare è quando sale.

      {resistenza Media fallita} Le ginocchia si sono fatte di stoffa, e la
      passerella non è il posto migliore per farglielo notare.
    opzioni:
      - testo: "Affrontarla sulla passerella"
        descrizione: "Sulla passerella non c'è spazio per girarle intorno. Né per lei, né per te."
        combattimento: campana-la-figura-ruotata
        vittoria:
          titolo: La figura nel vuoto
          testo: |
            La figura perde la presa sulla catena e cade nel vuoto senza un
            suono, le ginocchia al contrario piegate verso l'alto. La passerella
            ondeggia a lungo. La attraversi con le mani strette ai cavi.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { armi-da-mischia: 3 }
        sconfitta:
          titolo: La passerella che ondeggia
          testo: |
            La figura scende dalla catena e ti colpisce dall'alto, e la
            passerella si piega di lato. Resti aggrappato ai cavi finché lei non
            riprende a salire, poi torni indietro carponi.
      - testo: "Passare mentre sale"
        descrizione: "Quando sale guarda il pozzo, e la passerella le resta alle spalle. Bisogna essere svelti, e leggeri."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Il momento giusto
          testo: |
            Aspetti che la figura cominci a salire e attraversi di corsa, sulle
            punte, con i cavi che cantano sotto i piedi. Quando lei torna a
            scendere sei già dall'altra parte, schiacciato contro la roccia.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { furtivita: 3 }
        fallimento:
          titolo: I cavi che cantano
          testo: |
            I cavi cantano più forte del previsto, e la figura si ferma a metà
            catena. Scende verso di te più svelta di come saliva. Torni indietro
            di corsa, e un colpo di striscio ti apre la schiena.
          effetti: { ferite: 1 }
      - testo: "Attraversare appeso sotto la passerella"
        descrizione: "Mano dopo mano, sotto il piano della passerella, dove la figura non guarda mai."
        costo: 3
        esito:
          titolo: Mano dopo mano
          testo: |
            Ti cali sotto la passerella e la attraversi appeso ai traversi, mano
            dopo mano, con il vuoto sotto i piedi e il mare nel pozzo che non fa
            rumore. Arrivi dall'altra parte con le braccia che ti tremano fino al
            mattino dopo.
          effetti: { profondita.campana-batacchio: 1, ferite: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 4 · il nido del Campanaro
  - id: campana-batacchio-il-nido
    immagine: icone/ringing-bell
    titolo: Il nido fra le catene
    sommario: "In alto fra le catene c'è un nido di cose appese, che tintinnano piano. Sopra il nido, ripiegato, qualcosa dorme."
    luogo: La camera del batacchio, sotto il nido
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 4]
    testo: |
      Fra due catene, in alto, qualcuno ha intrecciato un nido di fili di
      metallo largo come un carro, e dal nido pendono decine di cose legate a un
      filo ciascuna. Ci sono tazze e chiavi, e un pettine con i denti radi. Fra le altre cose c'è anche una scarpa da bambino, piccola, con la fibbia. Quando l'aria del pozzo sale tintinnano piano tutte insieme, con il suono di un campanello alla porta.

      Sopra il nido, ripiegato su se stesso fra le maglie, c'è un corpo lungo e
      magro che non si muove.

      {percezione Difficile} Le cose appese sono tutte degli operatori. Chi le
      ha raccolte le ha appese dove la Campana le sente.

      {furtivita Molto difficile fallita} I piedi vogliono correre. Sopra di te
      quella cosa dorme, e i piedi non hanno nessuna intenzione di svegliarla.
    opzioni:
      - testo: "Passare sotto il nido senza un rumore"
        descrizione: "Sotto il nido, lungo la catena. Un passo alla volta, con le cose appese a un palmo dalla testa."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Sotto il nido
          testo: |
            Passi sotto il nido piegato in due, un passo alla volta. Le tazze e le chiavi ti sfiorano i capelli senza suonare. Lassù il corpo
            ripiegato resta fermo. Dall'altra parte ti accorgi di avere i pugni
            chiusi così stretti che le unghie ti hanno lasciato il segno.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { furtivita: 3 }
        fallimento:
          titolo: La tazza
          testo: |
            La spalla urta una tazza, e la tazza suona contro le altre. Lassù il
            corpo ripiegato si muove appena, e un braccio lungo si scioglie dalle
            maglie. Torni indietro di corsa e ti nascondi dietro la catena finché
            il braccio non torna al suo posto.
          effetti: { tormento: 1, ferite: 0.5 }
      - testo: "Staccare la scarpa da bambino"
        descrizione: "È la cosa più piccola del nido, e la più bassa. Allunghi la mano, e intanto guardi dove porta il filo."
        prova: { attributo: mentale, abilita: [percezione, empatia], difficolta: Molto difficile }
        successo:
          titolo: La scarpa
          testo: |
            Sciogli il filo dalla fibbia senza farla suonare. La scarpa è di
            cuoio duro e ha una suola consumata da un piede che correva. Dove il
            filo saliva verso il nido, fra due maglie, c'è il passaggio per la
            piattaforma. Metti la scarpa nello zaino senza saperne bene il motivo.
          effetti: { profondita.campana-batacchio: 1, reliquie.frammento-inciso: 1 }
          pe: { empatia: 3 }
        fallimento:
          titolo: Il filo che tira
          testo: |
            Il filo è legato a tutti gli altri. Quando lo tiri, tutto il nido
            suona insieme, e lassù il corpo si scuote. Scappi giù lungo la catena,
            e il tintinnio ti segue fino in fondo.
          effetti: { tormento: 1.5 }
      - testo: "Passare lontano, dall'altra catena"
        descrizione: "Il giro lungo, sulla catena più lontana dal nido. Le maglie sono bagnate, e l'altezza è quella che è."
        costo: 3
        esito:
          titolo: L'altra catena
          testo: |
            Passi sull'altra catena, di maglia in maglia, con il nido che tintinna
            alle tue spalle a ogni folata. Ci metti tanto che la lanterna si
            consuma fino al fondo. Arrivi dall'altra parte con le mani in carne
            viva e la testa piena di campanelli.
          effetti: { profondita.campana-batacchio: 1, ferite: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 4 · l'ultimo cancello
  - id: campana-batacchio-l-ultimo-cancello
    immagine: icone/key-lock
    titolo: L'ultimo cancello
    sommario: "La piattaforma sotto la Campana è chiusa da un cancello di metallo nero, con nove incavi in fila al posto della serratura."
    luogo: La camera del batacchio, il cancello della piattaforma
    area: campana-batacchio
    ripetibile: true
    requisiti: [campana.strato == 3, profondita.campana-batacchio == 4]
    testo: |
      La passerella finisce contro un cancello di metallo nero, alto il doppio di
      te, con le sbarre così fitte che ci passa appena una mano. Al posto della serratura ha un cerchio di nove incavi, ciascuno con un segno inciso sul fondo. Riconosci la porta della Soglia e l'occhio del Sornione, e poi gli altri sette segni dei posti neri. L'arco curvo della Costola è scavato più a fondo degli altri.

      {accademiche Difficile} Nove incavi e nove pietre all'Anello del
      Camminatore. L'ordine conta, e tu lo conosci.

      {intimidire Media fallita} Il cancello non ha paura di te, e la tua spalla
      lo ha capito prima di provarci.
    opzioni:
      - testo: "Dare le misure nell'ordine dell'Anello"
        descrizione: "Si comincia dal cerchio e si finisce con la nota, una misura per incavo, nell'ordine delle nove pietre."
        requisiti: [misura.anello >= 1]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Difficile }
        successo:
          titolo: Nove incavi
          testo: |
            Tocchi il cerchio per primo e fai il gesto della Soglia davanti alla porta. Poi dici il nome di Nan'Ireth alla mano aperta e vai avanti incavo dopo incavo, fino all'arco curvo, dove canti la nota della Costola. Il cancello si apre verso l'interno senza un cigolio.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { accademiche: 5 }
        fallimento:
          titolo: L'ordine sbagliato
          testo: |
            Al sesto incavo esiti, e il cancello lo sente. Le sbarre vibrano
            tutte insieme con una nota che ti arriva nelle tempie, e gli incavi si
            svuotano. Devi ricominciare da capo, un'altra volta, con il mal di
            testa.
          effetti: { tormento: 1 }
      - testo: "Forzare il meccanismo"
        descrizione: "Dietro le sbarre si vedono i perni del cancello. Con la lama giusta e molta pazienza, forse."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Molto difficile }
        successo:
          titolo: Il perno
          testo: |
            Infili la lama fra le sbarre e trovi il perno che tiene il cancello,
            e lo spingi un capello alla volta. Si sblocca con uno scatto che ti
            passa per il braccio. Il cancello si apre di quanto basta a passarci
            di fianco.
          effetti: { profondita.campana-batacchio: 1 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: La lama spezzata
          testo: |
            La lama si spezza contro il perno, e il cancello vibra con una nota
            che ti fa lacrimare gli occhi. Ti siedi contro le sbarre ad aspettare
            che smetta, con il moncone della lama in mano.
          effetti: { tormento: 1, ferite: 0.5 }
      - testo: "Arrampicarti oltre il cancello"
        descrizione: "In cima le sbarre finiscono in punte. Sopra le punte c'è la volta, e in mezzo uno spazio stretto."
        costo: 3
        esito:
          titolo: Le punte
          testo: |
            Ti arrampichi sulle sbarre e passi fra le punte e la volta strisciando
            sulla pancia. Una punta ti apre la giubba e la pelle sotto, dal
            fianco alla schiena. Ti lasci cadere dall'altra parte e resti a terra
            a guardare la Campana dal basso.
          effetti: { profondita.campana-batacchio: 1, ferite: 1.5 }

  # ------------------------------------------------------------ il cuore · il Campanaro, prima fase (sulle catene)
  - id: campana-batacchio-il-campanaro
    immagine: ambientazione/mito-salvaguardia-precursori
    titolo: Il Campanaro
    sommario: "Oltre il cancello c'è la piattaforma sotto la Campana. Fra le sei catene si scioglie dalle maglie una forma della Salvaguardia che nessuno ha mai visto."
    luogo: La camera del batacchio, la piattaforma
    area: campana-batacchio
    requisiti: [campana.strato == 3, profondita.campana-batacchio >= 5]
    testo: |
      Oltre il cancello una piattaforma rotonda sporge sul pozzo, e da lì la
      vedi intera per la prima volta. La Campana pende dalla volta con la bocca in giù. È nera e liscia, grande quanto la navata della Cattedrale del Velo, e la reggono sei catene che salgono nel buio. Dentro la bocca il batacchio
      sta fermo fra le ganasce del freno. Sotto, il mare entra nel pozzo e ne
      esce senza fare rumore. Sull'orlo corre la fila di segni del contatore, e
      mentre la guardi un segno cambia.

      {tecnologia Difficile} La leva del freno sta sulla piattaforma, a dieci
      passi da te. Le sei catene passano tutte per il freno prima di salire alla
      volta.

      Fra le catene qualcosa si scioglie dalle maglie. Prima vedi le braccia,
      sei, lunghe il doppio delle tue, che si staccano una alla volta e finiscono
      in ganci da corda. Poi il corpo, magro come una scala a pioli, e per ultima
      la maschera bianca, uguale a quella del ragno-sacrificale tranne che per
      una cosa. Questa maschera ha una bocca, e la tiene chiusa. *È il campanaro,
      e aspetta l'ordine di suonare.* Le gambe ti hanno già portato mezzo passo
      indietro senza chiederti il permesso.

      {resilienza Molto difficile fallita} La bocca è chiusa, e il corpo ti dice
      di non aspettare che si apra.

      {origine accolito-del-velo} Al Velo ti hanno insegnato a non chiedere che
      cosa c'è sotto l'altare. Qui sotto c'è una campana, e qualcuno che le fa la
      guardia da prima della Caduta.

      Il Campanaro scende lungo una catena a testa in giù senza nessuna fretta, e si ferma a mezza altezza fra te e il freno, con i ganci aperti.
    opzioni:
      - testo: "Affrontarlo sulle catene"
        descrizione: "Scende e risale lungo le maglie più svelto di te, e le sei braccia arrivano da sei parti. È la prima di tre volte."
        combattimento: campana-il-campanaro-sulle-catene
        vittoria:
          titolo: Il Campanaro cade
          testo: |
            Gli tagli due ganci e poi un terzo, finché il Campanaro perde la presa sulla catena. Cade sulla piattaforma di schiena con un colpo che fa tremare
            il pozzo, e le piastre del petto gli si aprono in una crepa. Per un
            momento resta fermo. Poi si gira sulle braccia che gli restano e si rialza più basso e più largo di prima, con la maschera rivolta verso il freno.
          pe: { armi-da-mischia: 5 }
          segue: campana-batacchio-il-campanaro-a-terra
        sconfitta:
          titolo: I ganci
          testo: |
            I ganci ti prendono da tre parti insieme e ti sollevano dalla
            piattaforma. Il Campanaro ti porta in alto fra le catene e ti lascia
            andare sopra il pozzo, e l'acqua ti inghiotte senza un tonfo. Il mare
            ti risputa sugli scogli ai piedi della Ripamuta. Ci metti tre giorni a
            tornare verso la città, e la camera del batacchio è tutta da rifare.
          effetti: { tormento: 2, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Scuotere le catene con il freno"
        descrizione: "Le sei catene passano dal freno. Se apri e chiudi le ganasce di colpo le catene sobbalzano, e chi ci sta appeso cade. Il batacchio resta libero per il tempo di uno scatto."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Lo scatto
          testo: |
            Corri alla leva e la tiri, e le ganasce si aprono di un dito e si
            richiudono. Le sei catene sobbalzano tutte insieme. Il batacchio
            oscilla di un niente e si ferma a un dito dal metallo. Il Campanaro
            vola giù dalle maglie e batte sulla piattaforma con il petto, che gli
            si apre in una crepa. Si rialza più basso e più largo di prima, con
            la maschera rivolta verso il freno.
          pe: { tecnologia: 5 }
          segue: campana-batacchio-il-campanaro-a-terra
        fallimento:
          titolo: La leva che sfugge
          testo: |
            La leva ti sfugge di mano a metà corsa e torna su con uno schianto.
            Le catene sobbalzano dalla parte sbagliata, e il Campanaro ti cade
            addosso con tutti i ganci. Ti ritrovi nel pozzo, e il mare ti risputa
            sugli scogli fuori dall'arco con una spalla fuori posto. Tre giorni
            dopo sei sulla Superficie, e la camera del batacchio è da rifare.
          effetti: { ferite: 2, tormento: 2, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Ordinargli di scendere"
        descrizione: "La formula del Comando parla alla Salvaguardia nella sua lingua. Questa forma la lingua l'ha sentita più di tutte le altre."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: L'ordine
          testo: |
            Dici la formula, e la parola ti esce in una lingua che non conosci. Il
            Campanaro si ferma con i ganci aperti. Scende fino alla piattaforma
            piano, come gli hai ordinato, e si posa davanti a te con due braccia
            ripiegate. Poi la maschera si gira verso il freno, e l'ordine finisce
            lì. Un momento dopo ti viene addosso camminando sulle braccia.
          pe: { magia: 5 }
          segue: campana-batacchio-il-campanaro-a-terra
        fallimento:
          titolo: La risposta da dentro la maschera
          testo: |
            Il Campanaro risponde alla formula con un'altra formula, detta da
            dentro la maschera chiusa, e la tua ti torna indietro rovesciata. Ti
            ritrovi in ginocchio, e poi nel pozzo. Il mare ti risputa sugli scogli
            ai piedi della Ripamuta, e la camera del batacchio è da rifare.
          effetti: { ferite: 1, tormento: 2, contaminazione: 1.5 }
          vai: superficie-fratturata

  # ------------------------------------------------------------ il Campanaro, seconda fase (a terra)
  - id: campana-batacchio-il-campanaro-a-terra
    tipo: seguito
    immagine: bestiario/salvaguardia-precursori
    titolo: Il contrappeso
    sommario: "Caduto dalle catene, il Campanaro strappa dal freno il contrappeso del batacchio e lo fa girare sopra la piattaforma."
    luogo: La camera del batacchio, la piattaforma
    area: campana-batacchio
    requisiti: [campana.strato == 3]
    testo: |
      Il Campanaro si raddrizza sulla piattaforma con quattro braccia, e le
      altre due gli pendono rotte dalle spalle. Si gira verso il freno. Dal
      braccio del freno, appeso a una catena corta, pende il contrappeso, un
      blocco di metallo nero grande come un carro di fieno. Il Campanaro lo
      afferra con quattro ganci e lo strappa dal suo attacco, e il freno
      scricchiola fino alla volta.

      Poi lo fa girare. Il contrappeso passa a un palmo dalla piattaforma, e dove
      la sfiora il metallo si apre in crepe a raggiera, uguali a quelle del
      pavimento della camera.

      {tecnologia Difficile} Le ganasce tengono anche senza contrappeso, per
      adesso. Ogni colpo che manca la piattaforma, però, arriva fino al freno.

      {atletica Media} Il contrappeso è pesante, e a ogni giro porta via
      l'equilibrio a chi lo regge. Fra un giro e l'altro c'è un momento in cui
      il Campanaro è tutto voltato dall'altra parte.

      Il pozzo è a tre passi dietro di lui, nero, con il mare che sale e scende
      senza rumore. Ti asciughi le mani sulla giubba, e restano bagnate lo
      stesso.
    opzioni:
      - testo: "Affrontarlo a terra"
        descrizione: "È lento, e ogni colpo che manca crepa la piattaforma. Quelli che non manca, però, non si rialzano."
        combattimento: campana-il-campanaro-a-terra
        vittoria:
          titolo: La maschera che si apre
          testo: |
            Lo colpisci ogni volta che il contrappeso finisce il giro, sempre
            nello stesso punto del fianco, finché le piastre cedono. Il Campanaro
            lascia andare il contrappeso, che rotola oltre l'orlo e sparisce nel
            pozzo senza un tonfo. Lui cade in ginocchio. Per la prima volta la
            maschera si muove, e la bocca si apre.
          pe: { armi-da-mischia: 5 }
          segue: campana-batacchio-il-campanaro-nella-voce
        sconfitta:
          titolo: Il contrappeso
          testo: |
            Il contrappeso ti prende di striscio, e di striscio basta. Voli oltre
            l'orlo della piattaforma e nel pozzo, e il mare ti risputa sugli
            scogli ai piedi della Ripamuta con le costole rotte. Ci metti tre
            giorni a tornare verso la città, e la camera del batacchio è da
            rifare.
          effetti: { tormento: 2, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Parare il contrappeso con la Sordina"
        descrizione: "Il disco nero che chiudeva la canna più grande non suona quando lo colpiscono. Bisogna reggere il colpo con il tuo braccio."
        requisiti: [oggetto.campana-la-sordina >= 1]
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Il colpo che muore
          testo: |
            Ti pianti sulla piattaforma con la Sordina alzata, e il contrappeso ci
            batte contro in pieno. Il colpo muore nel disco senza un suono, e ti
            arriva al braccio come una spinta. Il Campanaro resta sbilanciato con
            il peso fermo davanti a sé. Lo spingi con la spalla, e il contrappeso
            se lo porta oltre l'orlo. Il Campanaro risale dal pozzo grondando, e
            la maschera ha la bocca aperta.
          pe: { resistenza: 5 }
          segue: campana-batacchio-il-campanaro-nella-voce
        fallimento:
          titolo: Il braccio
          testo: |
            Il contrappeso ti arriva sulla Sordina e il disco tiene, ma il braccio
            sotto il disco cede. Voli nel pozzo, e il mare ti risputa sugli scogli
            ai piedi della Ripamuta. Tre giorni dopo sei sulla Superficie, e la
            camera del batacchio è da rifare.
          effetti: { ferite: 2, tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Fargli portare il contrappeso nel pozzo"
        descrizione: "A ogni giro il peso lo tira verso l'orlo. Se lo schivi all'ultimo dalla parte del pozzo, il giro dopo lo porta giù."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Molto difficile }
        successo:
          titolo: Il giro di troppo
          testo: |
            Aspetti il contrappeso sull'orlo del pozzo e ti butti di lato
            all'ultimo. Il blocco nero passa dove eri un attimo prima, e il suo
            peso si porta dietro il Campanaro oltre l'orlo. Poi i ganci tornano
            su dal buio uno alla volta, e il Campanaro risale grondando, con la
            bocca della maschera aperta.
          pe: { acrobazia: 5 }
          segue: campana-batacchio-il-campanaro-nella-voce
        fallimento:
          titolo: Troppo tardi
          testo: |
            Ti butti di lato un battito troppo tardi. Il contrappeso ti prende la
            gamba e ti trascina con sé oltre l'orlo. Il mare ti risputa sugli
            scogli ai piedi della Ripamuta, e ci metti tre giorni a tornare. La
            camera del batacchio è da rifare.
          effetti: { ferite: 2, tormento: 2, contaminazione: 1 }
          vai: superficie-fratturata

  # ------------------------------------------------------------ il Campanaro, terza fase (nella voce)
  - id: campana-batacchio-il-campanaro-nella-voce
    tipo: seguito
    immagine: ambientazione/mito-salvaguardia-precursori
    titolo: La voce
    sommario: "Il Campanaro ha aperto la bocca, e dalla bocca esce la voce della Campana."
    luogo: La camera del batacchio, l'orlo del pozzo
    area: campana-batacchio
    requisiti: [campana.strato == 3]
    testo: |
      Il Campanaro sta in ginocchio sull'orlo del pozzo, con le braccia
      abbandonate lungo il corpo. La bocca della maschera è aperta, nera, larga
      quanto un pugno. Ne esce una voce senza parole, che cambia tono a ogni
      battito e non viene dalla gola di una macchina. Viene dalla Campana sopra
      di voi, e passa per la bocca del Campanaro come l'acqua passa in un tubo.

      Senti la voce entrarti nella testa, e ti accorgi che stai perdendo delle
      cose. Prima la strada di casa, poi il nome di qualcuno a cui volevi bene.

      {resilienza Difficile} Tieni stretto un ricordo qualsiasi e non lasciarlo andare. Finché ce l'hai, la voce non ti ha preso tutto.

      {tecnologia Molto difficile} La voce non è il suono della Campana. È la
      Campana che si prova la gola, come un cantore prima di attaccare. Sull'orlo
      i segni del contatore hanno preso a cambiare più in fretta.

      Le nove misure ce le hai in testa, e la voce sta cercando proprio quelle.
      Il Campanaro non si muove. Combatte con la voce, e la voce non ha bisogno
      di braccia.
    opzioni:
      - testo: "Affrontarlo nella voce"
        descrizione: "Dieci passi fino alla maschera, con il suono che ti porta via i ricordi a ogni passo. Poi bisogna colpire la bocca."
        combattimento: campana-il-campanaro-nella-voce
        vittoria:
          titolo: La bocca spaccata
          testo: |
            Ti avvicini un passo alla volta con la voce che ti scava, e colpisci
            la maschera finché la bocca non si spacca. Il suono si ferma a metà.
            Il Campanaro si piega in avanti e resta inginocchiato sull'orlo, con
            le braccia distese sulla piattaforma come corde lasciate cadere.

            Gli stacchi dalla cintura il martello con cui batteva l'orlo della
            Campana, e dal petto le piastre che hanno retto ai tuoi colpi. Sopra
            di te la Campana tace, e il contatore torna a cambiare piano.
          imposta: { campana.strato: 4 }
          effetti: { oggetto.campana-il-battente: 1, oggetto.campana-piastre-del-campanaro: 1, parte.impugnatura-3: 1, cristalli.cristallo-carico: 4, reperto.sigillato: 2 }
          pe: { armi-da-mischia: 10, resilienza: 5 }
          segue: campana-batacchio-la-scelta
        sconfitta:
          titolo: Quello che resta
          testo: |
            Cadi a tre passi dalla maschera, e la voce si prende quello che
            trova. Ti risvegli sugli scogli ai piedi della Ripamuta e per un
            giorno intero non sai come ci sei arrivato. Quando torni sulla
            Superficie ti manca qualcosa che non riesci a nominare, e la camera
            del batacchio è da rifare.
          effetti: { tormento: 2.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Dare alla Campana le nove misure nell'ordine dell'Anello"
        descrizione: "Chi dava le misure nell'ordine giusto era l'operatore, e la Campana ascoltava lui. Il Campanaro è soltanto quello che tira le catene."
        requisiti: [misura.anello >= 1]
        prova: { attributo: mentale, abilita: [accademiche, resilienza], difficolta: Difficile }
        successo:
          titolo: Il nuovo operatore
          testo: |
            Ti volti verso la Campana e le dai le misure nell'ordine delle nove
            pietre. Cominci dal cerchio dell'Anello, tracciato con il dito sul
            metallo, e finisci con la nota della Costola, cantata a bocca chiusa.
            In mezzo c'è il nome di Nan'Ireth, detto con tutta la gola. La voce
            lascia la bocca del Campanaro e torna nel metallo. Il Campanaro si
            ripiega su se stesso sull'orlo del pozzo e non si muove più.

            Gli stacchi dalla cintura il martello con cui batteva l'orlo, e dal
            petto le piastre. Il contatore torna a cambiare piano.
          imposta: { campana.strato: 4 }
          effetti: { oggetto.campana-il-battente: 1, oggetto.campana-piastre-del-campanaro: 1, parte.impugnatura-3: 1, cristalli.cristallo-carico: 4, reperto.sigillato: 2 }
          pe: { accademiche: 10, resilienza: 5 }
          segue: campana-batacchio-la-scelta
        fallimento:
          titolo: L'ordine perso
          testo: |
            Alla sesta misura la voce ti porta via la settima, e l'ordine si
            spezza. La Campana non ti riconosce. Il suono ti riempie la testa
            fino a farti cadere, e ti risvegli sugli scogli fuori dall'arco. La
            camera del batacchio è da rifare.
          effetti: { ferite: 2, tormento: 2, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Arrivare alla maschera con la conchiglia sorda"
        descrizione: "La conchiglia degli sfiati si mangia i suoni che fanno male. Se regge, arrivi alla bocca con la testa ancora tua."
        requisiti: [oggetto.campana-conchiglia-sorda >= 1]
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Difficile }
        successo:
          titolo: La bocca chiusa
          testo: |
            Ti premi la conchiglia sull'orecchio e cammini verso la maschera. La
            voce ti arriva attutita, come da dietro un muro, e i ricordi restano
            dove sono. Davanti al Campanaro gli chiudi la bocca della maschera con
            le mani, e il suono si spegne. Lui si ripiega su se stesso e non si
            muove più.

            Gli stacchi dalla cintura il martello con cui batteva l'orlo, e dal
            petto le piastre. Il contatore torna a cambiare piano.
          imposta: { campana.strato: 4 }
          effetti: { oggetto.campana-il-battente: 1, oggetto.campana-piastre-del-campanaro: 1, parte.impugnatura-3: 1, cristalli.cristallo-carico: 4, reperto.sigillato: 2 }
          pe: { resilienza: 10 }
          segue: campana-batacchio-la-scelta
        fallimento:
          titolo: La conchiglia piena
          testo: |
            La conchiglia si riempie di suono a metà strada, e da quel momento ti
            fa male il doppio. Cadi in ginocchio davanti alla maschera, e ti
            risvegli sugli scogli ai piedi della Ripamuta. La camera del batacchio
            è da rifare.
          effetti: { ferite: 2, tormento: 2, contaminazione: 1 }
          vai: superficie-fratturata

  # ------------------------------------------------------------ la scelta
  - id: campana-batacchio-la-scelta
    tipo: seguito
    immagine: ambientazione/regno-profondo
    titolo: La leva del freno
    sommario: "La Campana è intera, e il contatore sull'orlo continua a scendere. Sulla leva del freno c'è un cerchio di nove incavi."
    luogo: La camera del batacchio, la leva del freno
    area: campana-batacchio
    requisiti: [campana.strato == 4, campana.scelta == 0]
    testo: |
      Il Campanaro non si muove più. Nella camera resta il mare che sale e scende
      nel pozzo senza rumore, e sopra di te la Campana, intera. Sull'orlo il
      contatore cambia un segno, piano, come ha fatto ogni notte da prima che ci
      fosse Qir-Azel.

      Sulla leva del freno c'è un altro cerchio di nove incavi, con gli stessi
      segni del cancello girati nel verso opposto. Quello più profondo è l'arco
      curvo della Costola. Lo guardi a lungo, finché capisci. Le nove misure date
      nell'ordine dell'Anello aprono. Date a rovescio, cominciando dalla nota,
      chiudono il freno per sempre e spengono il contatore.

      {tecnologia Difficile} Un freno chiuso così non si riapre. Gli organi
      sparsi sotto la Superficie resterebbero al loro posto a servire una
      campana muta.

      Ti siedi con la schiena contro la leva. Se la Campana ha annunciato la
      Caduta, zittirla vuol dire spegnere l'unico allarme che la Superficie abbia
      mai avuto, mentre il contatore conta verso qualcosa che arriverà comunque.
      Se l'ha provocata, lasciarla armata vuol dire aspettare che il conto arrivi
      in fondo e che suoni di nuovo. Dagli sfiati al coro le prove che hai trovato puntano da tutte e due le parti.

      {origine mercante-dei-ponti} Ai Ponti un affare si chiude davanti a un
      testimone, con la stretta di mano e la ricevuta. Questo lo chiudi da solo sotto la scogliera, e nessuno firmerà niente.

      *In un caso o nell'altro, nessuno saprà mai che sei stato tu.* La lanterna
      si sta consumando, e la strada per risalire è lunga.
    opzioni:
      - testo: "Zittire la Campana"
        descrizione: "Le nove misure a rovescio, sulla leva del freno. Il freno si chiude per sempre, e il contatore si ferma. Se qualcosa dovesse arrivare, nessuno lo annuncerà."
        esito:
          titolo: Il freno chiuso
          testo: |
            Dai le misure alla leva a rovescio, dall'ultima pietra dell'Anello
            alla prima. Canti la nota della Costola davanti all'arco curvo, e
            per ultimo tracci il cerchio con il dito. La leva si abbassa da sola,
            e le ganasce si serrano sul batacchio con un colpo che senti nei denti
            e che la camera non restituisce. I segni del contatore si spengono uno
            dopo l'altro lungo l'orlo, fino all'ultimo.

            Mentre risali provi a canticchiare la nota della Costola, e la gola
            non la trova più.

            Risali tutta la Ripamuta senza fermarti. Quando esci dall'arco è
            notte, e ai piedi della scogliera, per la prima volta, le onde fanno
            rumore.
          imposta: { campana.scelta: 1 }
          pe: { resilienza: 5, tecnologia: 5 }
          vai: superficie-fratturata
      - testo: "Lasciarla armata"
        descrizione: "La Campana resta com'è, con il freno chiuso a mano e il contatore che scende. Quando arriverà in fondo, suonerà."
        esito:
          titolo: Il contatore che scende
          testo: |
            Ti alzi e lasci la leva com'è, con il freno chiuso come l'ha lasciato
            la mano che lo ha tirato quella notte. Il Campanaro resta in ginocchio
            sull'orlo del pozzo.

            Prima di andare guardi l'orlo della Campana un'ultima volta. Il
            contatore cambia un segno mentre lo guardi, e tu lo scrivi sul retro
            della carta della Gilda accanto al conto che hai copiato ai Tamburi,
            meno tre colpi per ogni notte passata da allora. I due numeri tornano, colpo per colpo.

            Risali la Ripamuta senza fermarti. Quando esci dall'arco è notte, e ai
            piedi della scogliera le onde continuano a rompersi in silenzio.
          imposta: { campana.scelta: 2 }
          pe: { accademiche: 5, resilienza: 5 }
          vai: superficie-fratturata
