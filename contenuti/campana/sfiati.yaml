# La Campana Sepolta, strato 1: gli sfiati della Ripamuta (campana.strato 0 → 1). Docs/piano-superficie.md, blocco 8.
# Ci si entra dall'ingresso sulla costa grigia (sblocco.yaml), oltre l'arco nero ai piedi della scogliera. La
# ritirata riporta alla Superficie e azzera la profondità.
# - area `campana-sfiati`: undici stanze ripetibili in fasce di profondità (una stanza superata non ricompare nella
#   stessa visita, src/motore/spedizioni.ts):
#   0 la seconda porta (misura.mara) o la galleria dei cirripedi (i pulitori);
#   1 il condotto del soffio (misura.aculeo) o la chiusa della marea (dono.laresh, Old Marrek e la macina);
#   2 il basalto fuso (il primo indizio: le colate vanno tutte verso l'esterno) o la pozza nera (la murena);
#   2-3 le sette bocche (misura.stele, l'ombra in più della settima Stele indica la galleria giusta);
#   3 la nicchia del turno (i pulitori) o il pozzo del soffio (opzione d'origine dell'apprendista raschiatore);
#   4 la sala delle pompe (la murena) o i bracci rotti.
#   Ogni stanza ha una prova Difficile, una Molto difficile o un combattimento, e una via senza prova da 2 o 3
#   rintocchi con Ferite, Tormento o Contaminazione.
# - il cuore `campana-sfiati-lo-spurgatore` a profondità 5: lo scontro `campana-lo-spurgatore`, o la valvola dello
#   spurgo (Tecnologia, Difficile), il Comando (Difficile), il soffio lungo dell'Aculeo (misura.aculeo, Difficile).
#   Chi passa: campana.strato 1, la conchiglia sorda, una cassa sigillata e due cristalli carichi dalla nicchia ai
#   piedi della scala, e `vai: campana-canne`. Chi perde torna in Superficie con Tormento e Contaminazione, e lo
#   strato è da rifare.
# Origini: mercante-dei-ponti (le sette bocche, la nicchia del turno), apprendista-raschiatore (il pozzo del soffio,
# i bracci rotti).
aree:
  - id: campana-sfiati
    immagine: ambientazione/rovine-dei-precursori
    nome: Gli sfiati della Ripamuta
    sommario: "Oltre l'arco nero, gallerie nel basalto dove la marea entra ed esce e passa il soffio della Campana."
    spedizione: { ritorno: superficie-fratturata, soglia: 5, stanze: 3 }
    testo: |
      Oltre l'arco la scogliera si apre in una galleria bassa, scavata nel
      basalto con una precisione che nessun piccone ha mai avuto. La marea ci
      entra ed esce due volte al giorno, lasciando sulle pareti una riga di
      sale all'altezza del petto.

      Più avanti l'aria si muove a soffi lunghi che sanno di mare chiuso e di
      metallo caldo, e le onde là fuori non le hai più sentite.

colonna:
  - { contesto: area, id: campana-sfiati, musica: the-light-that-failed, ambiente: cave }

storylet:
  # ------------------------------------------------------------ 0 · la seconda porta (misura.mara)
  - id: campana-sfiati-la-seconda-porta
    immagine: ambientazione/rovine-dei-precursori
    titolo: La seconda porta
    sommario: "Cento passi dopo l'arco, una lastra di metallo nero chiude la galleria fino quasi al pavimento."
    luogo: Gli sfiati della Ripamuta, la seconda porta
    area: campana-sfiati
    ripetibile: true
    requisiti: [campana.strato == 0, profondita.campana-sfiati == 0]
    testo: |
      Cento passi dopo l'arco la galleria finisce contro una lastra di
      metallo nero che non arriva al pavimento, e dalla fessura l'acqua
      entra ed esce con la marea. Nel mezzo c'è un incavo a forma di mano
      aperta, con un dito in più, e ti accorgi di averci messo la mano senza
      deciderlo.

      {tecnologia Difficile} La lastra scorre di lato dentro la parete, come
      dice la riga di ruggine lungo lo stipite.
    opzioni:
      - testo: "Far scorrere la lastra"
        descrizione: "Dentro lo stipite c'è un meccanismo, e un meccanismo si può convincere."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Di lato
          testo: |
            Trovi con le unghie una scanalatura nascosta dal sale e spingi la
            lastra di lato con tutte e due le mani. Scorre dentro la parete senza
            un rumore, e dall'altra parte la galleria continua, più fredda.
          pe: { tecnologia: 3 }
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: Le dita
          testo: |
            La lastra scorre di colpo per un palmo e torna indietro, prendendoti
            le dita nella fessura quanto basta perché le unghie diventino nere.
          effetti: { ferite: 1 }
      - testo: "Passare sotto, con l'acqua"
        descrizione: "La fessura è larga abbastanza per un corpo, ma non sai quanto sia lunga sott'acqua."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Molto difficile }
        successo:
          titolo: Il sale negli occhi
          testo: |
            Ti tiri sotto la lastra con le mani sul fondo, una presa dopo l'altra,
            e riemergi dall'altra parte con il sale negli occhi e la lampada
            spenta, da riaccendere con le dita che tremano.
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: La risacca
          testo: |
            A metà la marea tira indietro e ti riporta fuori come una mano che ti
            prende per la cintura, sbattendoti la schiena contro il bordo della
            lastra.
          effetti: { ferite: 1 }
      - testo: "Fare il gesto della Soglia"
        descrizione: "La porta sotto la scogliera si apre come l'arco di Mara, e questa lastra è dello stesso metallo."
        requisiti: [misura.mara >= 1]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Difficile }
        successo:
          titolo: La porta che riconosce
          testo: |
            Rifai il gesto della Soglia, e per tre battiti senti odore di fuoco di
            legna prima che la lastra si ritiri da sola. Sullo stipite il sale
            copriva un segno inciso, e lo ricalchi prima di passare.
          pe: { accademiche: 5 }
          effetti: { profondita.campana-sfiati: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il gesto sbagliato
          testo: |
            Fai il gesto, e l'odore di fuoco di legna arriva e se ne va senza che
            la lastra si muova. Ti resta in bocca per tutta la sera.
          effetti: { tormento: 0.5 }
      - testo: "Aspettare la bassa marea e strisciare sotto"
        descrizione: "Con la marea al minimo la fessura resta mezza vuota, ma il fondo è pieno di gusci."
        costo: 3
        esito:
          titolo: I gusci
          testo: |
            Ti infili nella fessura sulla pancia con la bassa marea, e i gusci dei
            cirripedi ti aprono i gomiti e le ginocchia mentre la lastra ti passa
            sulla nuca.
          effetti: { profondita.campana-sfiati: 1, ferite: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 0 · la galleria dei cirripedi (i pulitori)
  - id: campana-sfiati-la-galleria-dei-cirripedi
    immagine: icone/ceiling-barnacle
    titolo: La galleria dei cirripedi
    sommario: "Un budello basso coperto di cirripedi con il guscio aperto, e più avanti qualcosa che gratta."
    luogo: Gli sfiati della Ripamuta, la galleria dei cirripedi
    area: campana-sfiati
    ripetibile: true
    requisiti: [campana.strato == 0, profondita.campana-sfiati == 0]
    testo: |
      Qui la galleria diventa un budello basso e storto, coperto di cirripedi che
      a ogni soffio si chiudono tutti insieme con un rumore di grandine. Più
      avanti qualcosa gratta la roccia con pazienza, e si ferma quando ti fermi
      tu.

      {percezione Difficile} Su un tratto di parete i cirripedi sono stati
      raschiati via in strisce larghe una spanna, fresche, che vengono verso di
      te.
    opzioni:
      - testo: "Andare incontro a quello che gratta"
        descrizione: "Due macchine basse e lente, incrostate di sale fino alle giunture."
        combattimento: campana-i-pulitori
        vittoria:
          titolo: I raschietti fermi
          testo: |
            La seconda macchina si ferma con il raschietto alzato, inclinata
            contro la parete, e il budello oltre di loro è pulito fino alla roccia
            nera.
          effetti: { profondita.campana-sfiati: 1 }
        sconfitta:
          titolo: Raschiato
          testo: |
            I raschietti ti prendono a turno sulle gambe e sulla schiena, con la
            stessa cura che mettono sulle pareti, e torni indietro carponi fino
            all'arco.
      - testo: "Passare fra i gusci senza toccarli"
        descrizione: "Fra un soffio e l'altro i cirripedi sono lame aperte, e il budello è stretto."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Difficile }
        successo:
          titolo: Di fianco
          testo: |
            Avanzi di fianco con le braccia strette al corpo, fermandoti a ogni
            soffio, mentre le macchine passano dall'altra parte senza girarsi.
            Esci con un solo taglio, sul dorso della mano.
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: La grandine
          testo: |
            I gusci si chiudono sulla tua spalla al soffio, e ti strappi via
            lasciando un pezzo di manica alla roccia mentre le macchine si
            voltano.
          effetti: { ferite: 1 }
      - testo: "Strisciare nell'acqua sotto le macchine"
        descrizione: "Sul fondo corre un rigagnolo di mare gelato, poco profondo, dove le macchine passano sopra."
        costo: 2
        esito:
          titolo: Nel rigagnolo
          testo: |
            Avanzi sui gomiti nel rigagnolo mentre una macchina ti passa sopra
            sfiorandoti la schiena, ed esci fradicio con un graffio dalla spalla
            al fianco.
          effetti: { profondita.campana-sfiati: 1, ferite: 1, tormento: 1 }

  # ------------------------------------------------------------ 1 · il condotto del soffio (misura.aculeo)
  - id: campana-sfiati-il-condotto-del-soffio
    immagine: ambientazione/regno-profondo
    titolo: Il condotto del soffio
    sommario: "Una galleria rotonda e liscia, che il soffio della Campana attraversa portando via quello che trova."
    luogo: Gli sfiati della Ripamuta, il condotto del soffio
    area: campana-sfiati
    ripetibile: true
    requisiti: [campana.strato == 0, profondita.campana-sfiati == 1]
    testo: |
      La galleria si fa rotonda e liscia come l'interno di un tubo da stufa,
      e sale piano verso un buio da cui scende aria fredda. Il sale qui non
      fa in tempo a posarsi. Quando arriva il soffio ti chiude le orecchie e
      ti schiaccia contro la parete finché non è passato.

      {resistenza Difficile} Dura più di quanto si possa stare senza aria. Se
      ti prende in mezzo alla galleria ti porta dove va lui.
    opzioni:
      - testo: "Correre fra un soffio e l'altro"
        descrizione: "La galleria sale per un bel pezzo, da fare tutta prima del soffio successivo."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Molto difficile }
        successo:
          titolo: La corsa
          testo: |
            Parti appena il soffio finisce e corri in salita, e il soffio dopo ti
            trova già oltre la curva, aggrappato a una sporgenza.
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: Portato indietro
          testo: |
            Il soffio ti prende a metà salita e ti rimanda giù rotolando, fino
            alla curva di prima, con un ginocchio gonfio e la bocca piena di sale.
          effetti: { ferite: 1 }
      - testo: "Contare il tempo fra i soffi"
        descrizione: "Se il soffio torna sempre allo stesso ritmo, il ritmo si può imparare."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Difficile }
        successo:
          titolo: Il ritmo
          testo: |
            Appoggiato alla parete conti sei soffi di fila e trovi una pausa lunga
            ogni tre. La aspetti e sali, e arrivi in cima mentre il soffio dopo
            comincia appena a fischiare.
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Ti sembra di aver capito il ritmo, ma il soffio arriva in anticipo e
            ti schiaccia contro la parete finché il conto non te lo ricordi più.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Aspettare la pausa del fischio"
        descrizione: "La Volta dell'Aculeo fischia una notte all'anno, e questo soffio viene dalla stessa macchina."
        requisiti: [misura.aculeo >= 1]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Difficile }
        successo:
          titolo: La stessa durata
          testo: |
            Ogni soffio dura quanto il fischio dell'Aculeo, e la pausa ha la stessa
            misura. Sali contando sottovoce, e quando il soffio passa sei già in una
            nicchia a sentirlo salire verso la cima della scogliera. *Questa macchina
            vuole che la si senta lassù.* Il pensiero ti resta addosso mentre
            riprendi a salire.
          pe: { accademiche: 5 }
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: Fuori tempo
          testo: |
            La durata è giusta, l'attacco no. Il soffio parte mezzo battito
            prima di quanto pensavi, e ti fa sbattere la testa contro la volta
            della galleria.
          effetti: { tormento: 0.5 }
      - testo: "Avanzare aggrappato alle giunture"
        descrizione: "Le pareti hanno giunture sottili, dove le dita entrano e reggono finché reggono."
        costo: 3
        esito:
          titolo: Le giunture
          testo: |
            Sali di giuntura in giuntura, appiattito contro la parete a ogni
            soffio, e arrivi in cima con due unghie spezzate e le braccia che non
            ti obbediscono più.
          effetti: { profondita.campana-sfiati: 1, ferite: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 1 · la chiusa della marea (dono.laresh)
  - id: campana-sfiati-la-chiusa
    immagine: icone/big-gear
    titolo: La chiusa della marea
    sommario: "Una paratia di metallo nero sbarra la galleria, e accanto gira una ruota grande come quella di un mulino."
    luogo: Gli sfiati della Ripamuta, la chiusa della marea
    area: campana-sfiati
    ripetibile: true
    requisiti: [campana.strato == 0, profondita.campana-sfiati == 1]
    testo: |
      La galleria finisce contro una paratia di metallo nero alta tre uomini.
      Accanto gira piano una ruota dentata grande come quella di un mulino,
      con le pale nell'acqua del mare, e a ogni giro la paratia sale di un
      dito e riscende. Fra due denti gira da chissà quanto lo scheletro di un
      gabbiano.

      {tecnologia Difficile} La paratia è legata alla marea e si apre del
      tutto soltanto al colmo, per poco.
    opzioni:
      - testo: "Bloccare la ruota con la paratia aperta"
        descrizione: "Se la ruota si ferma al punto giusto la paratia resta su, e il punto giusto va trovato."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il cuneo
          testo: |
            Al colmo, con la paratia alta, infili fra i denti della ruota un cuneo
            di metallo preso dal fondo. La ruota si ferma con un gemito e passi
            sotto curvo, poi togli il cuneo da lontano con una corda.
          pe: { tecnologia: 3 }
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: Il braccio nella ruota
          testo: |
            Il cuneo scivola, e la ruota si porta dietro la tua manica per mezzo
            giro prima che la stoffa si strappi. Resti seduto nell'acqua a
            guardarti il polso che si gonfia.
          effetti: { ferite: 1 }
      - testo: "Salire sulle pale fino all'architrave"
        descrizione: "Una pala dopo l'altra, con la ruota che ti porta su fino al bordo della paratia."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Molto difficile }
        successo:
          titolo: In cima alla ruota
          testo: |
            Ti lasci portare su dalle pale una dopo l'altra, e in cima ti butti
            sul bordo della paratia e ti cali nell'acqua fonda dall'altra parte.
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: La pala bagnata
          testo: |
            Il piede parte sulle alghe della pala, e la ruota ti spinge sott'acqua
            per tutto il tempo che ci mette a passare.
          effetti: { ferite: 1 }
      - testo: "Ascoltare la ruota come la ascolterebbe Old Marrek"
        descrizione: "Il mugnaio cieco di Laresh sente dalla macina quando il grano è macinato."
        requisiti: [dono.laresh >= 1]
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il dente che manca
          testo: |
            Appoggi l'orecchio al metallo come Old Marrek alla macina. A ogni giro
            la ruota fa un rumore diverso dove manca un dente, subito prima che la
            paratia salga, e al quarto giro sei già passato.
          pe: { percezione: 5 }
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: Troppo rumore
          testo: |
            L'acqua copre ogni altro rumore, e passi sotto la paratia nel momento
            sbagliato, sentendola scendere sulla schiena.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare il colmo e passare a nuoto"
        descrizione: "Quando l'acqua è alta la paratia si apre del tutto, e l'acqua passa con te."
        costo: 2
        esito:
          titolo: Con l'acqua
          testo: |
            Al colmo ti lasci prendere dalla corrente sotto la paratia, che ti
            sbatte contro un muro e ti lascia in un pozzo buio senza sapere dove
            sia l'alto.
          effetti: { profondita.campana-sfiati: 1, ferite: 1, tormento: 1 }

  # ------------------------------------------------------------ 2 · il basalto fuso (il primo indizio)
  - id: campana-sfiati-il-basalto-fuso
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il basalto fuso
    sommario: "Una sala rotonda dove la roccia si è fusa ed è colata in onde lucide, tutte rivolte dalla stessa parte."
    luogo: Gli sfiati della Ripamuta, la sala del basalto fuso
    area: campana-sfiati
    ripetibile: true
    requisiti: [campana.strato == 0, profondita.campana-sfiati == 2]
    testo: |
      Qui il basalto delle pareti si è fuso ed è colato, rapprendendosi in
      onde lucide come vetro scuro, tutte rivolte verso l'uscita a mare. In
      terra, presa nel basalto fino alla caviglia, c'è una scarpa piccola e
      vuota, di un materiale grigio e morbido.

      {accademiche Difficile} Le colate puntano lontano da un punto più in
      basso, verso l'interno della scogliera, da dove è venuto il calore.
    opzioni:
      - testo: "Leggere le colate"
        descrizione: "La roccia fusa si è fermata nel momento in cui si è raffreddata, e quel momento è rimasto scritto."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Difficile }
        successo:
          titolo: Verso l'esterno
          testo: |
            Segui le colate con le dita e capisci che le ha spinte un calore solo,
            arrivato in un colpo dal basso e dall'interno, dove sta la Campana. In
            un angolo stacchi con il coltello una scheggia di metallo nero rimasta
            presa nel vetro, con un segno inciso.
          pe: { accademiche: 3 }
          effetti: { profondita.campana-sfiati: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il vetro tagliente
          testo: |
            Il bordo di una colata ti apre il polpastrello come un rasoio, e per
            un momento la sala ti gira intorno con tutte le sue onde ferme.
          effetti: { tormento: 0.5, ferite: 0.5 }
      - testo: "Attraversare la sala sulle onde di vetro"
        descrizione: "Il passaggio è in alto, e le onde rapprese ci salgono come gradini lisci."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Molto difficile }
        successo:
          titolo: I gradini lisci
          testo: |
            Sali sulle onde di vetro a piedi nudi, perché le suole scivolano e la
            pelle tiene, e in cima ti rimetti gli stivali con le piante dei piedi
            che bruciano di freddo.
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: La scivolata
          testo: |
            A metà salita il piede parte sul vetro e scivoli giù per tutta l'onda,
            fino alla scarpa piccola, dove resti un po' a guardare il soffitto.
          effetti: { ferite: 1 }
      - testo: "Tirare dritto senza guardare la scarpa"
        descrizione: "Il varco dall'altra parte è dove le colate sono più spesse, e bisogna passare nel vetro."
        costo: 2
        esito:
          titolo: In mezzo al vetro
          testo: |
            Attraversi la sala dritto verso il varco, e il vetro scuro ti taglia
            gli stivali e poi le caviglie. Passi accanto alla scarpa senza
            guardarla, e te la ritrovi davanti agli occhi per tutto il resto della
            galleria.
          effetti: { profondita.campana-sfiati: 1, ferite: 1, tormento: 1 }

  # ------------------------------------------------------------ 2 · la pozza nera (la murena)
  - id: campana-sfiati-la-pozza-nera
    immagine: icone/drowning
    titolo: La pozza nera
    sommario: "Una vasca d'acqua ferma sotto una pellicola grigia, e sotto la pellicola qualcosa di bianco che si muove."
    luogo: Gli sfiati della Ripamuta, la pozza nera
    area: campana-sfiati
    ripetibile: true
    requisiti: [campana.strato == 0, profondita.campana-sfiati == 2]
    testo: |
      Il pavimento sparisce sotto una vasca d'acqua ferma, coperta da una
      pellicola grigia che si rompe a ogni goccia e torna a chiudersi. Il
      passaggio riprende sull'altra sponda a trenta passi, e lungo il bordo
      corre una cornice di pietra larga un piede. Sotto la pellicola, ogni
      tanto, passa una cosa lunga e bianca.

      {natura Difficile} I fili grigi sono Marea viva, e la cosa bianca ci
      nuota dentro da abbastanza tempo da averla nel sangue.
    opzioni:
      - testo: "Aspettarla sulla cornice con l'arma in mano"
        descrizione: "Una murena lunga quanto una barca, con i denti rivolti all'indietro, e una cornice larga un piede."
        combattimento: campana-la-murena
        vittoria:
          titolo: La cosa bianca
          testo: |
            La murena esce dall'acqua tre volte, e alla terza la prendi dietro la
            testa. Si dibatte sulla cornice finché non smette, e arrivi all'altra
            sponda con le mani che puzzano di pesce e di Marea.
          effetti: { profondita.campana-sfiati: 1 }
        sconfitta:
          titolo: I denti all'indietro
          testo: |
            La murena ti prende alla gamba e i denti rivolti all'indietro non
            lasciano. Ti liberi con l'acqua grigia al collo, e torni indietro
            zoppicando con la Marea che pizzica nelle ferite.
          effetti: { contaminazione: 0.5 }
      - testo: "Passare sulla cornice senza farti sentire"
        descrizione: "Trenta passi su una pietra larga un piede, sopra l'acqua dove nuota lei."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Sui talloni
          testo: |
            Cammini sulla cornice di fianco, il peso sui talloni e la schiena
            contro la roccia, e a metà la cosa bianca ti passa sotto lentamente.
            Sull'altra sponda ti accorgi di avere i pugni chiusi da trenta passi.
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: Lo schizzo
          testo: |
            Un sasso si stacca dalla cornice e cade nell'acqua, e la murena ti
            apre il polpaccio prima che tu riesca a tornare indietro. La ferita ha
            un orlo grigiastro che non ti piace.
          effetti: { ferite: 1, contaminazione: 0.5 }
      - testo: "Gettarle da mangiare e attraversare a nuoto"
        descrizione: "Le razioni gettate lontano, dall'altra parte della vasca, e poi si nuota."
        costo: 3
        esito:
          titolo: Le razioni
          testo: |
            Getti la carne secca nell'angolo opposto e ti butti in acqua allo
            schiocco dei denti. Arrivi senza razioni, con la pellicola grigia
            sulle labbra e un sapore amaro che dura tutto il giorno.
          effetti: { profondita.campana-sfiati: 1, ferite: 0.5, contaminazione: 1 }

  # ------------------------------------------------------------ 2-3 · le sette bocche (misura.stele)
  - id: campana-sfiati-le-sette-bocche
    immagine: ambientazione/regno-profondo
    titolo: Le sette bocche
    sommario: "Una caverna allagata fino alle ginocchia, e nella parete di fondo sette gallerie che partono a raggiera, tutte uguali."
    luogo: Gli sfiati della Ripamuta, le sette bocche
    area: campana-sfiati
    ripetibile: true
    requisiti: [campana.strato == 0, profondita.campana-sfiati >= 2, profondita.campana-sfiati <= 3]
    testo: |
      L'acqua fredda ti arriva alle ginocchia in una caverna dai bordi che la
      lampada non trova. Nella parete di fondo si aprono a raggiera sette
      gallerie uguali, ognuna con un segno diverso sull'architrave, e da una
      sola per volta arriva il soffio.

      {percezione Difficile} Il soffio cambia bocca in un giro sempre uguale.

      {origine mercante-dei-ponti} Sui Ponti cercavi la strada dei carri
      carichi, e qui di carri non ne passano da secoli.
    opzioni:
      - testo: "Seguire la direzione dell'ombra in più"
        descrizione: "Nella notte di luna nuova la settima Stele proietta un'ombra in più, e sai dove punta."
        requisiti: [misura.stele >= 1]
        prova: { attributo: mentale, abilita: [natura, accademiche], difficolta: Difficile }
        successo:
          titolo: L'ombra in più
          testo: |
            Ti orienti come sotto le Stele, e la direzione dell'ombra in più cade sulla quarta bocca da sinistra, sotto il segno a sette righe
            dell'ottava pietra dell'Anello. La galleria scende dritta e asciutta per la prima volta da quando sei qui sotto.
          pe: { natura: 5 }
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: Il nord perso
          testo: |
            Sotto la scogliera il nord non sai più dove sia, e senza il nord
            l'ombra in più non indica niente. Dopo cento passi nella bocca che
            scegli l'acqua ti arriva al petto.
          effetti: { ferite: 0.5 }
      - testo: "Seguire il soffio"
        descrizione: "Il soffio va verso la Campana o ne viene, e sa la strada."
        prova: { attributo: mentale, abilita: percezione, difficolta: Molto difficile }
        successo:
          titolo: La bocca che respira per ultima
          testo: |
            Conti tre volte il giro del soffio, e una bocca soffia sempre per
            ultima, più forte. Ti ci infili appena tace, e la galleria scende
            verso l'interno lasciandoti l'acqua alle spalle.
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: In tondo
          testo: |
            Segui il soffio da una bocca all'altra, e dopo un'ora sei ancora nella
            caverna davanti alla stessa bocca, con le gambe fredde fino alle
            anche.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Provarle una per una"
        descrizione: "Sette gallerie e una sola giusta, e quelle sbagliate sono piene d'acqua."
        costo: 3
        esito:
          titolo: Sei gallerie sbagliate
          testo: |
            Entri in sei gallerie e torni indietro sei volte, con l'acqua sempre
            più alta, e la settima la prendi quasi a nuoto. Ne esci con le dita
            bianche e rugose come quelle di un annegato.
          effetti: { profondita.campana-sfiati: 1, ferite: 0.5, tormento: 1 }

  # ------------------------------------------------------------ 3 · la nicchia del turno (i pulitori)
  - id: campana-sfiati-la-nicchia-del-turno
    immagine: ambientazione/rovine-dei-precursori
    titolo: La nicchia del turno
    sommario: "Una nicchia asciutta sopra la riga del sale, con un giaciglio di metallo e una coperta piegata."
    luogo: Gli sfiati della Ripamuta, la nicchia del turno
    area: campana-sfiati
    ripetibile: true
    requisiti: [campana.strato == 0, profondita.campana-sfiati == 3]
    testo: |
      Due braccia sopra la riga del sale la parete si apre in una nicchia
      asciutta. Dentro c'è un giaciglio di metallo nero corto come per un
      ragazzo, con sopra una coperta grigia piegata e una tazza capovolta, e
      dalla galleria di sotto arriva il rumore di qualcosa che gratta.

      {origine mercante-dei-ponti} La coperta non ha cuciture. Ai Ponti la
      venderesti tre volte, e alla terza sapresti ancora meno che cos'è.
    opzioni:
      - testo: "Aspettare quello che gratta, dall'alto della nicchia"
        descrizione: "Due pulitori incrostati risalgono la galleria, e dalla nicchia li vedi arrivare."
        combattimento: campana-i-pulitori
        vittoria:
          titolo: Dall'alto
          testo: |
            Li colpisci dall'alto, dove le giunture del dorso non hanno la crosta,
            e il secondo cade di fianco nell'acqua grattando il vuoto sempre più
            piano. Prima di andare rimetti dritta la tazza sul giaciglio, senza
            sapere perché.
          effetti: { profondita.campana-sfiati: 1 }
        sconfitta:
          titolo: Giù dalla nicchia
          testo: |
            Il primo pulitore ti tira giù per la caviglia e il secondo ti è sopra
            prima che tu ti alzi. Scappi verso l'arco lasciando nell'acqua la
            lampada di riserva.
      - testo: "Cercare nella nicchia la strada del turno"
        descrizione: "Chi dormiva qui scendeva al lavoro per una strada più corta di quella dell'acqua."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Difficile }
        successo:
          titolo: La botola
          testo: |
            Sotto il giaciglio c'è una botola della misura di un ragazzo, su una
            scala stretta che scende asciutta lontano da quello che gratta. Sul
            primo gradino trovi un guscio di metallo scuro rimasto intatto, e te
            lo porti via.
          effetti: { profondita.campana-sfiati: 1, parte.involucro-2: 1 }
        fallimento:
          titolo: Il rumore
          testo: |
            Frughi troppo a lungo e con troppo rumore, e uno dei pulitori ti
            lascia un solco nel braccio prima che tu riesca a ricacciarlo giù.
          effetti: { ferite: 1 }
      - testo: "Scendere di corsa oltre la cosa che gratta"
        descrizione: "Saltare giù dall'altra parte e correre nell'acqua prima che le macchine si girino."
        costo: 2
        esito:
          titolo: Di corsa
          testo: |
            Salti giù e corri nell'acqua alta, e un raschietto ti porta via di
            striscio la giubba e un po' di pelle. Ti fermi cento passi più avanti,
            piegato in due, ad ascoltare se ti seguono.
          effetti: { profondita.campana-sfiati: 1, ferite: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · il pozzo del soffio
  - id: campana-sfiati-il-pozzo-del-soffio
    immagine: ambientazione/regno-profondo
    titolo: Il pozzo del soffio
    sommario: "Un pozzo verticale da cui scende il soffio, con il passaggio che prosegue molto più su."
    luogo: Gli sfiati della Ripamuta, il pozzo del soffio
    area: campana-sfiati
    ripetibile: true
    requisiti: [campana.strato == 0, profondita.campana-sfiati == 3]
    testo: |
      La galleria finisce in fondo a un pozzo rotondo che sale dritto nel
      buio fino a un'apertura, con anelli di metallo nero sulle pareti a un
      braccio l'uno dall'altro. A ogni soffio l'aria scende dall'alto a
      premerti sulle spalle. Sul fondo, nell'acqua bassa, c'è una lampada da
      operatore ancora intera.

      {origine apprendista-raschiatore} Sulle piattaforme della Cicatrice si
      sale così, e le mani cercano un moschettone che qui non c'è.
    opzioni:
      - testo: "Salire anello dopo anello"
        descrizione: "Un braccio alla volta, fermandoti a ogni soffio, senza nessuno in cima a tirarti su."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: In cima
          testo: |
            Sali un anello alla volta, e a ogni soffio ti fermi con le braccia
            infilate fino al gomito e la fronte contro il metallo. In cima resti
            sdraiato sul bordo a sentire il soffio che ti passa accanto.
          pe: { atletica: 3 }
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: Il soffio a metà
          testo: |
            A metà pozzo il soffio ti strappa una mano dall'anello e poi l'altra,
            e scivoli giù di tre anelli prima di riprenderne uno. Scendi con la
            spalla che fa male a ogni movimento.
          effetti: { ferite: 1 }
      - testo: "Chiudere la grata del soffio"
        descrizione: "Sotto l'acqua del fondo c'è una grata, e se resta chiusa il soffio passa da un'altra parte."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Molto difficile }
        successo:
          titolo: La grata chiusa
          testo: |
            Tiri la leva sott'acqua finché la grata si chiude con un colpo che
            senti nei piedi. Il soffio cambia strada, e sali nel pozzo fermo
            sentendolo passare lontano per un altro condotto.
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: La grata aperta
          testo: |
            Quando la leva cede la grata si apre del tutto, e il soffio
            raddoppiato ti butta nell'acqua sopra la lampada dell'operatore, che
            si rompe sotto di te.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Salire a forza di braccia, senza fermarti"
        descrizione: "A forza, senza aspettare i soffi."
        costo: 3
        esito:
          titolo: A forza
          testo: |
            Sali senza fermarti e incassi i soffi a denti stretti, e in cima hai
            le mani aperte in due punti e una spalla che non sale più sopra
            l'orecchio.
          effetti: { profondita.campana-sfiati: 1, ferite: 1.5 }
      - testo: "Salire come sulle piattaforme della Cicatrice"
        descrizione: "Un anello alla volta, con una corda di sicurezza fatta con la cintura, come sui Ponti."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: La cintura
          testo: |
            A ogni sosta ti leghi all'anello con la cintura, e il soffio ti
            schiaccia senza staccarti. In cima ridi da solo per la prima volta da
            quando sei qui sotto.
          pe: { atletica: 3 }
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: La fibbia
          testo: |
            Al terzo soffio la fibbia si apre e la cintura vola giù, e torni in
            fondo a riprenderla con i calzoni che scendono.
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ 4 · la sala delle pompe (la murena)
  - id: campana-sfiati-la-sala-delle-pompe
    immagine: icone/cog
    titolo: La sala delle pompe
    sommario: "Due file di cilindri neri alti come alberi, e in mezzo la traccia di qualcosa che passa."
    luogo: Gli sfiati della Ripamuta, la sala delle pompe
    area: campana-sfiati
    ripetibile: true
    requisiti: [campana.strato == 0, profondita.campana-sfiati == 4]
    testo: |
      Due file di cilindri di metallo nero salgono fino alla volta come
      tronchi potati e battono piano, facendo tremare l'acqua sul pavimento.
      Fra loro il sale è raschiato via in una striscia larga quanto un carro,
      e lungo la parete di destra un canale d'acqua nera ogni tanto si gonfia
      senza rompersi.

      {rissa Difficile} Qualunque cosa passi di qui pesa quanto un carro
      carico, e fra i cilindri passa dritta.
    opzioni:
      - testo: "Affrontare quello che sale dal canale"
        descrizione: "Nel canale d'acqua nera c'è qualcosa di bianco e lungo che ti ha già sentito."
        combattimento: campana-la-murena
        vittoria:
          titolo: Nel canale
          testo: |
            La murena ti cade addosso uscendo dal canale in un'onda sola. Alla
            seconda uscita la aspetti, e quando smette di muoversi il canale torna
            liscio.
          effetti: { profondita.campana-sfiati: 1 }
        sconfitta:
          titolo: L'onda bianca
          testo: |
            La murena ti trascina nel canale per il braccio, e ne esci con la
            manica a brandelli e un morso che sanguina grigio.
          effetti: { contaminazione: 0.5 }
      - testo: "Nasconderti fra i cilindri e aspettare"
        descrizione: "Se qualcosa passa di qui ogni giorno, meglio vederlo prima che lui veda te."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Lo scoglio che cammina
          testo: |
            Dopo un'ora fra i cilindri vedi passare lungo la striscia uno scoglio
            coperto di cirripedi, con sei zampe corte e una pompa sul dorso, e lo
            segui da lontano verso il fondo della sala.
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: Il cilindro che batte
          testo: |
            Il cilindro a cui sei appoggiato batte e ti scaraventa in mezzo alla
            striscia, e il momento per aspettare è passato.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Correre lungo la striscia fino al fondo"
        descrizione: "La strada più corta è quella pulita. È anche quella dove passa lui."
        costo: 2
        esito:
          titolo: Sulla striscia
          testo: |
            A metà della striscia il canale si gonfia e un'onda grigia ti butta in
            ginocchio, e arrivi in fondo bagnato fino alle ossa, con la pelle che
            pizzica dappertutto.
          effetti: { profondita.campana-sfiati: 1, ferite: 1, contaminazione: 1 }

  # ------------------------------------------------------------ 4 · i bracci rotti
  - id: campana-sfiati-i-bracci-rotti
    immagine: icone/crab-claw
    titolo: I bracci rotti
    sommario: "Una galleria laterale chiusa a metà da un mucchio di bracci di macchina spezzati, alto fino al soffitto."
    luogo: Gli sfiati della Ripamuta, la galleria dei bracci rotti
    area: campana-sfiati
    ripetibile: true
    requisiti: [campana.strato == 0, profondita.campana-sfiati == 4]
    testo: |
      In una galleria laterale sono ammucchiati a centinaia bracci di
      macchina spezzati, consumati fino al moncone, in un mucchio che arriva
      al soffitto e chiude metà del passaggio, tenuto insieme dai cristalli
      di sale.

      {percezione Molto difficile} I bracci in cima sono più nuovi di quelli
      in fondo, perché qualcosa li cambia ancora e butta qui i vecchi.

      {origine apprendista-raschiatore} Ai Ponti i picconi rotti si portano
      su e si rifondono, e qui nessuno è mai venuto a chiedere il conto.
    opzioni:
      - testo: "Arrampicarti sopra il mucchio"
        descrizione: "Il passaggio libero è in alto, oltre bracci tenuti insieme dal sale finché il sale tiene."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: Sopra i bracci
          testo: |
            Sali di sbieco mettendo i piedi sulle giunture e mai sui raschietti.
            In cima passi strisciando sotto il soffitto, e scendi su cristalli che
            si rompono come zucchero.
          effetti: { profondita.campana-sfiati: 1 }
        fallimento:
          titolo: La frana
          testo: |
            Un braccio ti si sfila sotto il piede e la frana ti trascina giù, con
            un raschietto spezzato piantato nella coscia che togli con un gemito.
          effetti: { ferite: 1 }
      - testo: "Smontare un varco nel mucchio"
        descrizione: "Ogni braccio ha una giuntura che si apre, uno alla volta, senza far crollare il resto."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Molto difficile }
        successo:
          titolo: Il varco
          testo: |
            Sfili i bracci dal basso aprendo le giunture con la punta del
            coltello, e il mucchio si assesta sopra il varco senza cadere. Uno ha
            l'impugnatura intatta, fatta per mani più lunghe delle tue, e te la
            porti via.
          effetti: { profondita.campana-sfiati: 1, parte.impugnatura-2: 1 }
        fallimento:
          titolo: Il mucchio che scende
          testo: |
            Sfili il braccio sbagliato, e il mucchio scende di un palmo con un
            rumore di ossa, chiudendo la galleria come prima.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Infilarti nel varco più basso"
        descrizione: "Sul fondo c'è un buco stretto pieno di punte, dove si passa lasciando un po' di pelle."
        costo: 3
        esito:
          titolo: Fra le punte
          testo: |
            Ti tiri a forza di gomiti fra i monconi del buco più basso, e le punte
            ti trovano dalla nuca ai talloni. Esci con la camicia a strisce e un
            ticchettio di sale nelle orecchie.
          effetti: { profondita.campana-sfiati: 1, ferite: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 5 · il cuore · lo Spurgatore
  - id: campana-sfiati-lo-spurgatore
    immagine: bestiario/salvaguardia-precursori
    titolo: Lo Spurgatore
    sommario: "In fondo agli sfiati, una conca dove arriva tutta l'acqua e uno scoglio che si alza."
    luogo: Gli sfiati della Ripamuta, la conca dello spurgo
    area: campana-sfiati
    requisiti: [campana.strato == 0, profondita.campana-sfiati >= 5]
    testo: |
      Tutti gli sfiati scendono qui, in una conca larga quanto una piazza con
      un palmo d'acqua salata sul fondo e bocche di condotti di ogni misura
      nelle pareti, che secondo la marea sputano l'acqua oppure la bevono.
      Dall'altra parte una scala di metallo nero sale verso un'apertura da cui
      arriva un suono basso e continuo, che senti più nei denti che nelle
      orecchie.

      In mezzo alla conca c'è uno scoglio coperto di cirripedi, alto due volte
      un uomo. Quando entri nell'acqua si alza su sei zampe corte, e due
      bracci a raschietto si aprono ai lati come le chele di un granchio. Sul
      dorso, fra i cirripedi, una pompa comincia a battere.

      {tecnologia Difficile} È la macchina che teneva puliti gli sfiati. Lo fa
      ancora a modo suo, e adesso la cosa da pulire sei tu.

      {rissa Media} I bracci sono lenti a richiudersi. Fra un colpo e l'altro
      c'è il tempo di entrare sotto, dove la crosta è più sottile.

      Il sale ti brucia nelle crepe delle mani, e ti accorgi di aver contato
      le zampe due volte.
    opzioni:
      - testo: "Affrontare lo Spurgatore"
        descrizione: "Una macchina grande come un carro sotto una crosta di sale, che non si stanca mai."
        combattimento: campana-lo-spurgatore
        vittoria:
          titolo: Lo scoglio che si ferma
          testo: |
            Colpisci sotto i bracci dove la crosta si è crepata, e dentro lo
            Spurgatore qualcosa cede con un rumore di vetro. La pompa batte ancora
            due volte e lo scoglio si accascia su un fianco.

            Nella nicchia asciutta ai piedi della scala prendi una cassa
            sigillata, due cristalli ancora carichi e una conchiglia di metallo
            nero che, all'orecchio, spegne il suono della scala.
          pe: { resistenza: 5 }
          imposta: { campana.strato: 1 }
          effetti: { oggetto.campana-conchiglia-sorda: 1, parte.involucro-3: 1, cristalli.cristallo-carico: 2 }
          vai: campana-canne
        sconfitta:
          titolo: Portato via dalla marea
          testo: |
            Un raschietto ti butta in un condotto che sta bevendo, e il mare ti
            porta via. Riemergi fuori dall'arco con la bocca piena di sale e le
            costole che scricchiolano, e gli sfiati da rifare.
          effetti: { tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Mandarlo a spurgare un condotto"
        descrizione: "Se un condotto si intasa davanti ai suoi occhi, forse va a pulirlo e ti lascia la scala."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il condotto intasato
          testo: |
            Intasi con alghe e gusci il condotto più vicino alla scala, e lo
            Spurgatore ci si appoggia con tutto il corpo sparando acqua, senza
            voltarsi mentre passi.

            Nella nicchia asciutta ai piedi della scala prendi una cassa
            sigillata, due cristalli ancora carichi e una conchiglia di metallo
            nero che, all'orecchio, spegne il suono della scala.
          pe: { tecnologia: 5 }
          imposta: { campana.strato: 1 }
          effetti: { oggetto.campana-conchiglia-sorda: 1, parte.involucro-3: 1, cristalli.cristallo-carico: 2 }
          vai: campana-canne
        fallimento:
          titolo: La pompa
          testo: |
            Lo Spurgatore guarda te, con le mani ancora piene di alghe, e il getto
            della pompa ti butta contro la parete e poi nella corrente. Ti ritrovi
            sulla spiaggia muta, con tutti gli sfiati da rifare.
          effetti: { ferite: 2, tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Ordinare alla macchina di fermarsi"
        descrizione: "Il Comando parla alla Salvaguardia, ma questa macchina ha più sale che memoria."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: In ginocchio nell'acqua
          testo: |
            Dici la formula in una lingua che non è la tua, e lo Spurgatore si
            accuccia nell'acqua con la pompa che rallenta. Passi tanto vicino da
            toccarne la crosta.

            Nella nicchia asciutta ai piedi della scala prendi una cassa
            sigillata, due cristalli ancora carichi e una conchiglia di metallo
            nero che, all'orecchio, spegne il suono della scala.
          pe: { magia: 5 }
          imposta: { campana.strato: 1 }
          effetti: { oggetto.campana-conchiglia-sorda: 1, parte.involucro-3: 1, cristalli.cristallo-carico: 2 }
          vai: campana-canne
        fallimento:
          titolo: Il sale nella voce
          testo: |
            La formula ti si rompe in gola e il getto della pompa ti prende al
            petto, giù per un condotto fino al mare sotto la scogliera. Lo strato
            è da rifare dall'arco.
          effetti: { ferite: 2, tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Aspettare il soffio lungo dell'Aculeo"
        descrizione: "Ogni giorno quaggiù arriva il soffio lungo dell'Aculeo, e lo Spurgatore deve pulire il condotto grande."
        requisiti: [misura.aculeo >= 1]
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Sotto la pancia
          testo: |
            Quando arriva il soffio lungo lo Spurgatore si gira immobile verso il
            condotto grande, e gli passi sotto la pancia fino alla scala prima che
            il soffio finisca.

            Nella nicchia asciutta ai piedi della scala prendi una cassa
            sigillata, due cristalli ancora carichi e una conchiglia di metallo
            nero che, all'orecchio, spegne il suono della scala.
          pe: { acrobazia: 5 }
          imposta: { campana.strato: 1 }
          effetti: { oggetto.campana-conchiglia-sorda: 1, parte.involucro-3: 1, cristalli.cristallo-carico: 2 }
          vai: campana-canne
        fallimento:
          titolo: Il soffio finisce
          testo: |
            Il soffio finisce mentre sei ancora sotto la macchina, e la pancia
            dello Spurgatore ti schiaccia contro il fondo finché non sgusci in un
            condotto. La corrente ti riporta al mare, e lo strato è da rifare.
          effetti: { ferite: 2, tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
