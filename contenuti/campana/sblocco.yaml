# La Campana Sepolta (docs/piano-superficie.md, blocco 8): lo sblocco sulla Superficie, l'ingresso con le ripartenze,
# la formula della verga e le due scene dopo la scelta. Le quality condivise della spedizione stanno qui.
# - Luogo `campana-la-costa-grigia` (Superficie, compare con le nove misure): la colonna propria è quella
#   dell'annuncio, «Our Wounds, Our Crown» con l'ambiente «Astral Plane».
# - `campana-le-nove-misure` (non ripetibile, nove misura.<luogo> >= 1 e campana.annuncio == 0): le nove misure
#   messe insieme su una lastra della terrazza più alta indicano la Ripamuta, una scogliera della costa grigia a
#   nord-est oltre il Rovolungo. campana.annuncio 1.
# - `campana-la-strada-della-ripamuta` (ripetibile, campana.annuncio >= 1 e campana.strato <= 3): l'ingresso e le
#   ripartenze. A piedi (due rintocchi) o a cavallo (uno), verso lo strato raggiunto: campana.strato 0 gli sfiati,
#   1 le canne, 2 il coro, 3 la camera del batacchio. Gli strati sono in sfiati.yaml, canne.yaml, coro.yaml,
#   batacchio.yaml; ogni ritirata e ogni sconfitta riporta sulla Superficie con lo strato da rifare.
# - `campana-la-formula-della-verga` (ripetibile, campana.formula >= 1): la formula del Rintocco incisa sulla verga
#   della Capoturno, che si impara con Magia 4 e una prova Molto difficile.
# - Dopo la scelta (campana.scelta 1 zittita, 2 armata, nella camera del batacchio): `campana-il-rumore-delle-onde`
#   e `campana-il-conto-che-scende`, una sola volta (campana.epilogo). Due frammenti del Codex per la Ripamuta e il
#   Campanaro, uno per ciascuna scelta.
# - Glossario: solo i nomi nuovi della spedizione (la Ripamuta, lo Spurgatore, l'Accordatore, la Capoturno, il
#   Campanaro), con i requisiti per non anticiparli.
quality:
  - { id: campana.annuncio, nome: "Le nove misure messe insieme", categoria: stato, nascosta: true, descrizione: "1 quando hai messo insieme le nove misure e hai saputo dove sta la Campana." }
  - { id: campana.strato, immagine: icone/ringing-bell, nome: "La Campana Sepolta", categoria: stato, descrizione: "Quanti strati della Campana sotto la Ripamuta ti sei lasciato alle spalle, dagli sfiati alla camera del batacchio." }
  - { id: campana.scelta, nome: "Che cosa hai fatto della Campana", categoria: stato, nascosta: true, descrizione: "1 se hai zittito la Campana, 2 se l'hai lasciata armata." }
  - { id: campana.epilogo, nome: "Dopo la Ripamuta", categoria: stato, nascosta: true, descrizione: "1 quando hai visto che cosa è cambiato sulla costa dopo la tua scelta." }
  - { id: campana.formula, nome: "La formula della verga", categoria: stato, nascosta: true, descrizione: "1 quando hai la verga della Capoturno con la formula del Rintocco incisa sopra." }

luoghi:
  - id: campana-la-costa-grigia
    area: superficie-fratturata
    nome: La costa grigia
    immagine: ambientazione/capomozzo
    sommario: "Oltre il Rovolungo la costa sale in scogliere che sulle carte della Gilda non hanno nome. Le nove misure portano lassù."
    requisiti: [misura.costola >= 1, misura.tamburi >= 1, misura.aculeo >= 1, misura.anello >= 1, misura.forno >= 1, misura.stele >= 1, misura.sornione >= 1, misura.mara >= 1, misura.spina >= 1]
    testo: |
      Oltre il roveto di Rovolungo il sentiero dei pescatori continua verso nord-est per una giornata ancora, fra
      i ginepri piegati dal vento e le scogliere che salgono a ogni promontorio. Sulle carte della Gilda questo
      tratto di costa è una linea senza nomi. I pescatori lo conoscono bene, e quando ci passano in barca tengono il
      largo e smettono di parlare finché la scogliera più nera non è alle loro spalle.

colonna:
  - { contesto: luogo, id: campana-la-costa-grigia, musica: our-wounds-our-crown, ambiente: astral-plane }

storylet:
  # ------------------------------------------------------------ lo sblocco · le nove misure
  - id: campana-le-nove-misure
    presso: campana-la-costa-grigia
    immagine: ambientazione/regno-profondo
    titolo: Le nove misure
    sommario: "Nove cose prese in nove posti neri, che da sole non dicono niente. Stanotte le metti sulla stessa pietra."
    luogo: Superficie Fratturata, la terrazza più alta
    area: superficie-fratturata
    requisiti: [misura.costola >= 1, misura.tamburi >= 1, misura.aculeo >= 1, misura.anello >= 1, misura.forno >= 1, misura.stele >= 1, misura.sornione >= 1, misura.mara >= 1, misura.spina >= 1, campana.annuncio == 0]
    testo: |
      Aspetti la notte sulla terrazza di basalto più alta, a nord della città,
      dove il vento arriva pulito dalla costa e le luci di Qir-Azel restano
      alle spalle. Su una lastra piatta grande come un tavolo da osteria stendi la carta della Gilda e ci metti sopra quello che hai portato via dai nove posti neri. Il conto copiato ai Tamburi e la data dell'Aculeo stanno sullo stesso foglio, scritti con due grafie diverse, perché la seconda volta ti tremava la mano. Il nome di Nan'Ireth e il richiamo della Spina non si appoggiano su una pietra, e te li ripeti a fior di labbra. Il gesto della Soglia lo fai una volta sola, piano, per vedere se la mano lo ricorda ancora.

      Per ultime metti nove pietruzze in cerchio nell'ordine dell'Anello, e su ognuna graffi con il coltello il segno del suo posto, dal cerchio fino all'arco curvo della Costola.

      Poi tiri le righe sulla carta della Gilda. La prima parte dalla settima
      Stele e segue l'ombra in più. La seconda parte dal punto del cielo dove
      le due stelle del Sornione stavano quella notte. Si incontrano oltre il
      Rovolungo, sulla costa a nord-est, dove il cartografo ha scritto in
      lettere piccole una parola sola, *Ripamuta*, senza disegnare una strada.

      {accademiche Difficile} Due righe bastano per trovare un punto. Le altre
      sette misure servono a quello che si fa dopo, quando ci si arriva davanti.

      {origine apprendista-raschiatore} Sui Ponti i vecchi segnano con una croce
      i posti dove non si torna. Tu di croci ne hai nove sulla stessa carta, e
      stanotte puntano tutte dalla stessa parte.

      La nota della Costola ce l'hai in gola da settimane, e non l'hai mai cantata all'aperto.
    opzioni:
      - testo: "Cantare la nota della Costola"
        descrizione: "La nota della Costola, cantata qui sotto il cielo aperto. Se le righe dicono il vero, laggiù qualcosa la sente."
        esito:
          titolo: La risposta
          testo: |
            Appoggi le mani sulla lastra e canti la nota della Costola a bocca chiusa. Esce bassa, così bassa che la senti nei denti prima che nelle orecchie, e si allarga sulla terrazza. Conti i battiti senza volerlo, come alla
            Spina. Al nono battito la lastra ti vibra sotto i palmi con la stessa
            nota, che arriva da nord-est e da sotto la terra, debole come un
            carro che passa lontano su un ponte di legno.

            A mezzanotte togli tre colpi dal conto dei Tamburi, come fai ogni notte da quando l'hai copiato, e per la prima volta ti chiedi verso che cosa scenda.

            Raccogli le pietruzze una alla volta, e ti accorgi di farlo nell'ordine dell'Anello. Le nove misure sono i pezzi di uno strumento
            fatto per suonare e farsi sentire da tutta la Superficie, e quello
            strumento sta ancora contando. *Una campana d'allarme, sepolta sotto
            la costa.* La strada del nord la conosci fino a Rovolungo, e da lì in
            avanti la porta la riga sulla carta.
          imposta: { campana.annuncio: 1 }
          pe: { accademiche: 5, percezione: 5 }

  # ------------------------------------------------------------ l'ingresso e le ripartenze
  - id: campana-la-strada-della-ripamuta
    presso: campana-la-costa-grigia
    immagine: ambientazione/capomozzo
    titolo: La strada della Ripamuta
    sommario: "Due giorni e mezzo fino al roveto di Rovolungo, e poi una giornata di scogliere verso nord-est, fino al punto dove le onde smettono di fare rumore."
    luogo: Superficie Fratturata, la costa grigia oltre il Rovolungo
    area: superficie-fratturata
    ripetibile: true
    requisiti: [campana.annuncio >= 1, campana.strato <= 3]
    testo: |
      Oltre il roveto di Rovolungo il sentiero dei pescatori sale sulle
      scogliere e corre verso nord-est per una giornata intera, fra cespugli di
      ginepro e reti stese su pali che nessuno viene più a ritirare. La
      Ripamuta la riconosci da lontano. È una scogliera di basalto nero più alta
      delle altre, a picco sull'acqua. Ai suoi piedi le onde si rompono senza
      fare rumore. Fino a cento passi prima senti la risacca. Poi fai ancora
      dieci passi, e il mare continua a muoversi in silenzio sotto di te.

      {natura Media} Sulla scogliera non c'è un nido. I gabbiani della costa le
      girano intorno larghi e vanno a posarsi più avanti.

      {origine figlio-della-citta-bassa} Alle fucine della Città Bassa un rumore
      che smette di colpo vuol dire che si è rotto un maglio, e che qualcuno si è
      fatto male. Le orecchie si mettono a cercare il grido da sole.

      In fondo al sentiero, dove la scogliera tocca l'acqua, c'è l'arco di
      pietra nera. Ti stringi le cinghie dello zaino una dopo l'altra, con più
      cura del necessario.
    opzioni:
      # ------------------------------------------------ strato 0 · gli sfiati
      - testo: "Scendere all'arco della Ripamuta"
        descrizione: "Tre giorni a piedi, l'ultimo sulle scogliere. All'arco si arriva con la bassa marea e il sole basso."
        quando: [campana.strato == 0]
        costo: 2
        esito:
          titolo: L'arco nella scogliera
          testo: |
            Scendi l'ultimo tratto aggrappato alle radici dei ginepri e arrivi
            all'arco con la bassa marea, mentre il sole tocca l'acqua. È uguale
            all'arco della Soglia di Mara, piantato a piombo nella roccia senza muri ai lati.
            Appoggi il palmo sinistro sul pilastro di sinistra all'altezza della spalla, e passi sotto l'arco a occhi chiusi contando tre battiti.

            Quando li riapri sei nella stanza che alla Soglia hai visto per tre battiti soltanto. La parete nera è bagnata dalla pioggia salata che scende da una fessura in alto, e in un braciere di ferro brucia un fuoco di legna di mare, senza nessuno intorno. Dal pavimento escono i condotti che arrivano da sud-ovest. Oltre il braciere una galleria scende verso il buio, e l'odore del sale ti viene incontro.
          vai: campana-sfiati
      - testo: "Andare a cavallo fino alla Ripamuta"
        descrizione: "In sella la costa passa più in fretta. L'ultimo tratto lo fai a piedi."
        quando: [campana.strato == 0]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 1
        esito:
          titolo: Il cavallo sulla scogliera
          testo: |
            Il cavallo fa la costa al passo lungo, e sulla scogliera si ferma da
            solo dove il sentiero diventa roccia. Lo leghi a un ginepro, lontano
            dall'orlo. Quando ti allontani non ti guarda andare, perché tiene le
            orecchie dritte verso il mare che non fa rumore. Sotto l'arco fai il gesto della Soglia, con il palmo sinistro sul pilastro e gli occhi chiusi per tre battiti, e ti ritrovi accanto al braciere che brucia senza nessuno.
          vai: campana-sfiati
      # ------------------------------------------------ strato 1 · le canne
      - testo: "Tornare alle canne"
        descrizione: "Gli sfiati li hai già pagati. Oltre lo Spurgatore la galleria sale verso il suono."
        quando: [campana.strato == 1]
        costo: 2
        esito:
          titolo: Oltre lo Spurgatore
          testo: |
            Fai il gesto della Soglia con la mano che ormai lo sa da sola, e
            attraversi gli sfiati con la bassa marea per la strada che conosci.
            Lo Spurgatore è dove l'hai lasciato, un mucchio di sale e di ferro
            con l'acqua che ci passa in mezzo. Oltre il suo corpo la galleria
            sale, e dall'alto arriva il suono delle canne, che ti si posa sui
            denti come la sabbia.
          vai: campana-canne
      - testo: "Tornare alle canne a cavallo"
        descrizione: "Il cavallo resta legato al ginepro, e tu arrivi all'arco con le gambe fresche."
        quando: [campana.strato == 1]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 1
        esito:
          titolo: Le gambe fresche
          testo: |
            Leghi il cavallo allo stesso ginepro dell'altra volta, che ha ancora
            la corteccia scortecciata dalla cavezza. Sotto l'arco fai il gesto, e
            gli sfiati li passi in fretta, tenendoti alla parete dove l'acqua è
            più bassa. Lo Spurgatore non si muove più. Oltre il suo corpo ti
            aspetta il suono delle canne.
          vai: campana-canne
      # ------------------------------------------------ strato 2 · il coro
      - testo: "Tornare nel coro"
        descrizione: "Gli sfiati e le canne, e poi la scala che sale verso la sala degli operatori."
        quando: [campana.strato == 2]
        costo: 2
        esito:
          titolo: Le canne che tacciono
          testo: |
            Attraversi gli sfiati con la bassa marea e la foresta delle canne con
            le mani sulle orecchie. Dove è caduto l'Accordatore le canne tacciono
            tutte, e il silenzio ti fa camminare più svelto del suono. In cima
            alla scala la Marea Grigia sta ferma fra gli stalli del coro, alta
            fino al ginocchio, e ti aspetta come l'acqua ferma di una vasca.
          vai: campana-coro
      - testo: "Tornare nel coro a cavallo"
        descrizione: "Il cavallo al ginepro, e tu con le forze intere per la scala del coro."
        quando: [campana.strato == 2]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 1
        esito:
          titolo: La scala del coro
          testo: |
            Il cavallo resta al ginepro con la bisaccia aperta. Tu passi gli
            sfiati e le canne senza fermarti, contando i passi per non sentire il
            resto, e arrivi in cima alla scala con le gambe ancora buone. Il coro
            è come l'hai lasciato, con la Marea ferma fra gli stalli.
          vai: campana-coro
      # ------------------------------------------------ strato 3 · la camera del batacchio
      - testo: "Scendere alla camera del batacchio"
        descrizione: "Tre strati da attraversare prima di arrivare dove l'hai lasciata. La Campana non si è mossa."
        quando: [campana.strato == 3]
        costo: 2
        esito:
          titolo: La catena che scende
          testo: |
            Attraversi gli sfiati e le canne, e poi il coro, a passi lenti, come
            in una casa dove è morto qualcuno. Nel coro gli
            stalli sono vuoti e la Marea si apre al tuo passaggio. Oltre la parete
            di fondo comincia la scala che gira intorno alla catena, e la catena
            vibra sotto la mano con una nota sola, tenuta da prima che tu nascessi.
          vai: campana-batacchio
      - testo: "Scendere alla camera del batacchio a cavallo"
        descrizione: "Il cavallo ti risparmia la costa. Il resto lo fai con le tue gambe."
        quando: [campana.strato == 3]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 1
        esito:
          titolo: Il ginepro e la catena
          testo: |
            Leghi il cavallo al ginepro, e gli dai una pacca sul collo che serve
            più a te che a lui. Poi scendi attraverso i tre strati che conosci fino alla scala che
            gira intorno alla catena. Appoggi la mano
            sul metallo, che vibra con la sua nota sola.
          vai: campana-batacchio

  # ------------------------------------------------------------ la formula della verga
  - id: campana-la-formula-della-verga
    presso: campana-la-costa-grigia
    immagine: icone/ringing-bell
    titolo: La formula della verga
    sommario: "Sulla verga della Capoturno, sotto le nove tacche, c'è una riga incisa più fine delle altre. Si dice con tutta la gola."
    luogo: Superficie Fratturata, la costa grigia
    area: superficie-fratturata
    ripetibile: true
    requisiti: [campana.formula >= 1, incantesimo.campana-il-rintocco == 0]
    testo: |
      Ti siedi sulla scogliera con la verga della Capoturno sulle ginocchia, al
      riparo di un ginepro, e passi il pollice sulla riga incisa sotto le nove
      tacche. I segni sono fitti e piccoli, scavati da una punta molto più sottile
      di un coltello. Quando li guardi troppo a lungo si muovono, e si mettono in
      una forma che quasi capisci.

      {magia Difficile} È una formula di una parola sola, da dire con tutta la gola.
      Prende il suono dal petto di chi la dice e lo restituisce come lo
      restituiva la Campana, e il prezzo lo paga la testa.

      In basso le onde continuano a rompersi in silenzio.
    opzioni:
      - testo: "Imparare la formula"
        descrizione: "Ci vuole Magia 4 e una gola che regga. La Capoturno la diceva ogni notte del suo turno."
        requisiti: [magia >= 4]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Molto difficile }
        successo:
          titolo: La parola sola
          testo: |
            Dici la riga a mezza voce, poi con tutta la gola. Al terzo tentativo
            la parola ti esce da sola e bassissima, e il ginepro accanto a te perde
            gli aghi tutti insieme. Ti resta in bocca un sapore di ferro, e per un'ora
            le orecchie ti fischiano.
          effetti: { incantesimo.campana-il-rintocco: 1, tormento: 1 }
        fallimento:
          titolo: La gola chiusa
          testo: |
            La parola ti si ferma in gola a metà e torna indietro, e per tutta la
            sera parli con una voce che non è la tua. La riga sulla verga resta
            dov'era.
          effetti: { tormento: 0.5 }
      - testo: "Rimettere via la verga"
        descrizione: "La formula resta sulla verga finché non torni a cercarla."
        costo: 0
        esito:
          titolo: Nello zaino
          testo: |
            Avvolgi la verga nella tela e la rimetti nello zaino, con le tacche
            verso il basso. Il vento della costa ti asciuga il sudore sul collo.

  # ------------------------------------------------------------ dopo la scelta · zittita
  - id: campana-il-rumore-delle-onde
    presso: campana-la-costa-grigia
    immagine: ambientazione/capomozzo
    titolo: Il rumore delle onde
    sommario: "Torni in cima alla Ripamuta qualche giorno dopo, per vedere che cosa resta di quello che hai fatto là sotto."
    luogo: Superficie Fratturata, in cima alla Ripamuta
    area: superficie-fratturata
    requisiti: [campana.scelta == 1, campana.epilogo == 0]
    testo: |
      Torni sulla scogliera qualche giorno dopo, quando le ferite hanno smesso
      di aprirsi la notte. Dal sentiero dei pescatori senti la risacca, e
      continui a sentirla anche quando arrivi sopra l'arco. Ai piedi della
      Ripamuta le onde si rompono con il rumore di tutte le altre. Un gabbiano si
      posa sull'orlo a pochi passi da te e ci resta.

      Canti la nota della Costola verso il mare, a bocca chiusa. Ti esce più alta di come la ricordavi, e il basalto sotto le mani non risponde.

      {resilienza Difficile} Lo strumento più grande della Superficie adesso tace
      per mano tua. Se qualcosa dovesse arrivare un'altra volta, nessuno lo
      sentirà annunciare.

      {origine fuggiasco-di-ghoran} A Ghoran, quando un tamburo del campo tace,
      qualcuno se ne accorge sempre e va a vedere chi è morto. Qui non viene
      nessuno, e la cosa ti mette addosso un freddo che con il vento non c'entra.

      Al tramonto, lontano a sud-ovest, sopra la linea delle colline si accende il
      bagliore della Cicatrice, uguale a ogni sera. Ti torna in mente il detto
      dei Raschiatori sulle lampade di sotto.

      {percezione Molto difficile} Stasera la luce pulsa piano e regolare, e ti
      sembra di poterle contare i battiti.
    opzioni:
      - testo: "Restare a guardare finché fa buio"
        descrizione: "Le onde fanno rumore. Ascoltarle è la cosa più semplice che tu abbia fatto da settimane."
        costo: 0
        esito:
          titolo: Il buio sulla costa
          testo: |
            Resti seduto finché il bagliore lontano diventa l'unica luce, con il
            rumore del mare sotto i piedi. Quando ti alzi hai le gambe
            intorpidite e le guance fredde, e scendi per il sentiero dei
            pescatori senza voltarti.
          imposta: { campana.epilogo: 1 }
          pe: { resilienza: 5 }

  # ------------------------------------------------------------ dopo la scelta · armata
  - id: campana-il-conto-che-scende
    presso: campana-la-costa-grigia
    immagine: ambientazione/capomozzo
    titolo: Il conto che scende
    sommario: "Torni in cima alla Ripamuta qualche giorno dopo. Le onde non fanno ancora rumore, e il conto dei Tamburi continua a scendere."
    luogo: Superficie Fratturata, in cima alla Ripamuta
    area: superficie-fratturata
    requisiti: [campana.scelta == 2, campana.epilogo == 0]
    testo: |
      Torni sulla scogliera qualche giorno dopo, quando le ferite hanno smesso
      di aprirsi la notte. Dal sentiero dei pescatori senti la risacca, poi fai
      dieci passi e la risacca sparisce, come la prima volta. Ai piedi della
      Ripamuta le onde si rompono bianche e mute.

      Canti la nota della Costola a bocca chiusa, con le mani sul basalto. La nota ti scende nelle ossa, e dopo nove battiti la scogliera la restituisce più forte di come l'hai data.

      {tecnologia Difficile} La Campana è armata, e fa il suo lavoro senza bisogno
      di nessuno. Il contatore scende da solo. Quando arriverà in fondo la Campana
      suonerà anche senza un Campanaro che tiri le catene.

      {origine apprendista-raschiatore} Ai turni sulla Cicatrice ti hanno insegnato
      a lasciare le cose come le hai trovate, se non sai a che cosa servono.
      Adesso sai a che cosa serve, e l'hai lasciata lo stesso.

      A mezzanotte togli tre colpi dal conto dei Tamburi alla luce della lanterna, come ogni notte. Lontano a sud-ovest, sopra la linea delle colline, il
      bagliore della Cicatrice pulsa come ogni notte.
    opzioni:
      - testo: "Contare quanti colpi restano"
        descrizione: "Il conto lo tieni da settimane. Quello che non sai è che cosa succede quando finisce."
        costo: 0
        esito:
          titolo: I colpi che restano
          testo: |
            Rifai il conto sul retro della carta della Gilda finché due conti di
            fila non tornano uguali. Poi pieghi la carta in
            quattro e la metti nella tasca interna, dove la senti contro il petto
            quando cammini. Scendi per il sentiero dei pescatori mentre il mare,
            sotto, continua a non fare rumore.
          imposta: { campana.epilogo: 1 }
          pe: { accademiche: 5 }

frammenti:
  - id: campana-la-ripamuta
    titolo: La scogliera muta
    area: superficie-fratturata
    immagine: ambientazione/capomozzo
    requisiti: [campana.annuncio >= 1]
    testo: |
      Una giornata di cammino oltre il Rovolungo, sulla costa grigia a nord-est
      di Qir-Azel, una scogliera di basalto nero scende a picco sul mare. I
      pescatori la chiamano Ripamuta, perché ai suoi piedi le onde si rompono
      senza rumore per un tratto lungo un tiro di fionda. I gabbiani non ci fanno
      il nido, e le barche passano al largo. Un pescatore di Rovolungo: «Mio
      nonno diceva che lì sotto il mare ascolta. Io so soltanto che da quelle parti
      si sta zitti e si rema svelti.»

  - id: campana-la-quarta-forma
    titolo: La forma con la bocca
    area: superficie-fratturata
    immagine: ambientazione/mito-salvaguardia-precursori
    requisiti: [campana.strato >= 4]
    testo: |
      Alle tre forme note della Salvaguardia se ne aggiunge una quarta, vista
      una sola volta sotto la Ripamuta. Chi l'ha vista la chiama Campanaro. Sta
      appesa alle catene della Campana con sei braccia lunghe che finiscono in
      ganci da corda, e porta una maschera bianca come quella del ragno, con una
      differenza che basta a riconoscerla. È l'unica forma della Salvaguardia con
      una bocca, e dalla bocca esce la voce della Campana.

  - id: campana-zittita
    titolo: Il mare che torna a farsi sentire
    area: superficie-fratturata
    immagine: ambientazione/capomozzo
    requisiti: [campana.scelta == 1]
    testo: |
      Sotto la Ripamuta le onde hanno ripreso a fare rumore. I pescatori di
      Rovolungo dicono che una notte, all'improvviso, la risacca si è sentita
      fino al largo, e che i cani della costa hanno abbaiato fino all'alba. Sul perché, alla costa, si fanno due conti diversi. Alcuni dicono che la scogliera è
      guarita. Altri pensano che si sia addormentata qualcosa che faceva la
      guardia.

  - id: campana-armata
    titolo: Il conto dei Tamburi
    area: superficie-fratturata
    immagine: ambientazione/regno-profondo
    requisiti: [campana.scelta == 2]
    testo: |
      Sotto la Ripamuta le onde continuano a rompersi senza rumore, e ogni mezzanotte il battente dei Tamburi bussa tre colpi, e il conto scende. Lo strumento dei
      Precursori sepolto sotto la costa è intero e armato, e conta da solo.
      Quando il conto arriverà in fondo la Campana suonerà di nuovo, con lo
      stesso suono basso e prolungato che i superstiti sentirono poche ore prima
      della Caduta. Che cosa porterà quel suono, una seconda volta, è la domanda
      che resta.

glossario:
  - id: campana-ripamuta
    nome: Ripamuta
    tipo: luogo
    sottotitolo: "La scogliera muta della costa grigia"
    testo: "Scogliera di basalto nero sulla costa grigia, una giornata di cammino a nord-est del Rovolungo. Ai suoi piedi le onde si rompono senza fare rumore, i gabbiani non ci fanno il nido e i pescatori passano al largo senza parlare. Sotto la scogliera, oltre un arco di pietra nera, c'è la Campana."
    requisiti: [campana.annuncio >= 1]

  - id: campana-spurgatore
    nome: Spurgatore
    tipo: creatura
    sottotitolo: "La macchina degli sfiati"
    testo: "La macchina dei Precursori che teneva liberi dal sale gli sfiati della Campana, sotto la Ripamuta. È grande come un carro da fieno, con due bracci a raschietto e una pompa che sputa acqua di mare, e il sale le ha costruito addosso una crosta di scogliera."
    requisiti: [campana.annuncio >= 1]

  - id: campana-accordatore
    nome: Accordatore
    tipo: creatura
    sottotitolo: "La macchina delle canne"
    testo: "La macchina dei Precursori che accordava le canne della Campana. Corre fra le canne su sei zampe sottili e le batte con martelli di feltro diventato ferro. Da quando nessuno le dice più quale nota sia giusta, le accorda tutte su quella che fa più male."
    requisiti: [campana.strato >= 1]

  - id: campana-capoturno
    nome: Capoturno
    tipo: creatura
    sottotitolo: "La memoria del coro"
    testo: "Una figura di Marea Grigia nella sala degli operatori della Campana, alta il doppio di una donna, con la faccia che cambia a ogni sguardo. È la memoria di chi comandava il turno nella notte del suono, ferma a quella notte, e la difende da chiunque entri nel coro."
    requisiti: [campana.strato >= 2]

  - id: campana-campanaro
    nome: Campanaro
    tipo: creatura
    sottotitolo: "La quarta forma della Salvaguardia"
    testo: "La forma della Salvaguardia che vive appesa alle catene della Campana, sotto la Ripamuta. Ha sei braccia lunghe che finiscono in ganci da corda e una maschera bianca con la bocca, l'unica fra le forme conosciute. I Raschiatori veterani, prima della Campana, ne conoscevano soltanto tre."
    requisiti: [campana.strato >= 3]
