# La Campana Sepolta (docs/piano-superficie.md, blocco 8): lo sblocco sulla Superficie, l'ingresso con le ripartenze,
# la formula della verga e le due scene dopo la scelta. Le quality condivise della spedizione stanno qui.
# - Luogo `campana-la-costa-grigia` (Superficie, compare con le nove misure): la colonna propria è quella
#   dell'annuncio, «Our Wounds, Our Crown» con l'ambiente «Astral Plane».
# - `campana-le-nove-misure` (non ripetibile, nove misura.<luogo> >= 1 e campana.annuncio == 0): le nove misure
#   messe insieme su una lastra della terrazza più alta indicano la Ripamuta, una scogliera della costa grigia a
#   nord-est oltre il Rovolungo. campana.annuncio 1.
# - `campana-la-strada-della-ripamuta` (ripetibile, campana.annuncio >= 1 e campana.strato <= 3): l'ingresso e le
#   ripartenze. A piedi (due rintocchi) o a cavallo (uno), verso lo strato raggiunto: campana.strato 0 gli sfiati,
#   1 le canne, 2 il coro, 3 la camera del batacchio. Gli strati sono in sfiati.yaml, canne.yaml, coro.yaml,
#   batacchio.yaml; ogni ritirata e ogni sconfitta riporta sulla Superficie con lo strato da rifare.
# - `campana-la-formula-della-verga` (ripetibile, campana.formula >= 1): la formula del Rintocco incisa sulla verga
#   della Capoturno, che si impara con Magia 4 e una prova Molto difficile.
# - Dopo la scelta (campana.scelta 1 zittita, 2 armata, nella camera del batacchio): `campana-il-rumore-delle-onde`
#   e `campana-il-conto-che-scende`, una sola volta (campana.epilogo). Due frammenti del Codex per la Ripamuta e il
#   Campanaro, uno per ciascuna scelta.
# - Glossario: solo i nomi nuovi della spedizione (la Ripamuta, lo Spurgatore, l'Accordatore, la Capoturno, il
#   Campanaro), con i requisiti per non anticiparli.
quality:
  - { id: campana.annuncio, nome: "Le nove misure messe insieme", categoria: stato, nascosta: true, descrizione: "1 quando hai messo insieme le nove misure e hai saputo dove sta la Campana." }
  - { id: campana.strato, immagine: icone/ringing-bell, nome: "La Campana Sepolta", categoria: stato, descrizione: "Quanti strati della Campana sotto la Ripamuta ti sei lasciato alle spalle, dagli sfiati alla camera del batacchio." }
  - { id: campana.scelta, nome: "Che cosa hai fatto della Campana", categoria: stato, nascosta: true, descrizione: "1 se hai zittito la Campana, 2 se l'hai lasciata armata." }
  - { id: campana.epilogo, nome: "Dopo la Ripamuta", categoria: stato, nascosta: true, descrizione: "1 quando hai visto che cosa è cambiato sulla costa dopo la tua scelta." }
  - { id: campana.formula, nome: "La formula della verga", categoria: stato, nascosta: true, descrizione: "1 quando hai la verga della Capoturno con la formula del Rintocco incisa sopra." }

luoghi:
  - id: campana-la-costa-grigia
    area: superficie-fratturata
    nome: La costa grigia
    immagine: ambientazione/capomozzo
    sommario: "Oltre il Rovolungo la costa sale in scogliere senza nome, e le nove misure portano lassù."
    requisiti: [misura.costola >= 1, misura.tamburi >= 1, misura.aculeo >= 1, misura.anello >= 1, misura.forno >= 1, misura.stele >= 1, misura.sornione >= 1, misura.mara >= 1, misura.spina >= 1]
    testo: |
      Oltre il roveto di Rovolungo il sentiero dei pescatori continua verso nord-est per una giornata, fra ginepri
      piegati dal vento e scogliere sempre più alte. Sulle carte della Gilda questo tratto di costa non ha nomi, e i
      pescatori che ci passano in barca tengono il largo e smettono di parlare finché la scogliera più nera non è
      alle loro spalle.

colonna:
  - { contesto: luogo, id: campana-la-costa-grigia, musica: our-wounds-our-crown, ambiente: astral-plane }

storylet:
  # ------------------------------------------------------------ lo sblocco · le nove misure
  - id: campana-le-nove-misure
    presso: campana-la-costa-grigia
    immagine: ambientazione/regno-profondo
    titolo: Le nove misure
    sommario: "Nove cose prese in nove posti neri, che stanotte metti sulla stessa pietra."
    luogo: Superficie Fratturata, la terrazza più alta
    area: superficie-fratturata
    requisiti: [misura.costola >= 1, misura.tamburi >= 1, misura.aculeo >= 1, misura.anello >= 1, misura.forno >= 1, misura.stele >= 1, misura.sornione >= 1, misura.mara >= 1, misura.spina >= 1, campana.annuncio == 0]
    testo: |
      Aspetti la notte sulla terrazza di basalto più alta, a nord della città, e su una lastra grande come un tavolo da osteria stendi la carta della Gilda con sopra quello che hai portato via dai nove posti neri. Il conto dei Tamburi e la data dell'Aculeo stanno sullo stesso foglio, in due grafie diverse, perché la seconda volta ti tremava la mano. Il nome di Nan'Ireth e il richiamo della Spina li ripeti a fior di labbra, e intorno metti nove pietruzze in cerchio nell'ordine dell'Anello.

      Poi tiri le righe sulla carta. La prima parte dalla settima Stele e segue l'ombra in più, la seconda dal punto del cielo dove stavano le due stelle del Sornione quella notte. Si incontrano oltre il Rovolungo, sulla costa a nord-est, dove il cartografo ha scritto in lettere piccole una parola sola, *Ripamuta*, senza disegnare una strada.

      {accademiche Difficile} Due righe bastano per trovare un punto. Le altre sette misure servono a quello che si fa dopo, quando ci si arriva davanti.

      {origine apprendista-raschiatore} Sui Ponti i vecchi segnano con una croce i posti dove non si torna. Tu ne hai nove sulla stessa carta, e stanotte puntano tutte dalla stessa parte.

      La nota della Costola ce l'hai in gola da settimane, e non l'hai mai cantata all'aperto.
    opzioni:
      - testo: "Cantare la nota della Costola"
        descrizione: "La nota della Costola, cantata sotto il cielo aperto, perché laggiù qualcosa la senta."
        esito:
          titolo: La risposta
          testo: |
            Canti la nota della Costola a bocca chiusa, e al nono battito la lastra ti risponde sotto i palmi, debole, da nord-est e da sotto la terra.

            A mezzanotte togli tre colpi dal conto dei Tamburi, e per la prima volta ti chiedi verso che cosa scenda. *Una campana d'allarme, sepolta sotto la costa.* Le nove misure sono i pezzi di uno strumento che sta ancora
            contando.
          imposta: { campana.annuncio: 1 }
          pe: { accademiche: 5, percezione: 5 }

  # ------------------------------------------------------------ l'ingresso e le ripartenze
  - id: campana-la-strada-della-ripamuta
    presso: campana-la-costa-grigia
    immagine: ambientazione/capomozzo
    titolo: La strada della Ripamuta
    sommario: "Due giorni e mezzo fino a Rovolungo e una giornata di scogliere, fino a dove le onde non fanno rumore."
    luogo: Superficie Fratturata, la costa grigia oltre il Rovolungo
    area: superficie-fratturata
    ripetibile: true
    requisiti: [campana.annuncio >= 1, campana.strato <= 3]
    testo: |
      Oltre Rovolungo il sentiero dei pescatori corre sulle scogliere per una
      giornata, fra reti stese su pali che nessuno ritira più. La Ripamuta è la
      scogliera di basalto nero più alta, e ai suoi piedi, dove la roccia tocca
      l'acqua, c'è un arco di pietra nera. Fino a cento passi prima senti la
      risacca, poi il mare continua a muoversi in silenzio e i gabbiani le
      girano al largo.

      {origine figlio-della-citta-bassa} Alle fucine della Città Bassa un rumore
      che smette di colpo vuol dire che qualcuno si è fatto male, e le orecchie
      cercano il grido da sole.
    opzioni:
      # ------------------------------------------------ strato 0 · gli sfiati
      - testo: "Scendere all'arco della Ripamuta"
        descrizione: "Tre giorni a piedi, l'ultimo sulle scogliere, per arrivare all'arco con la bassa marea."
        quando: [campana.strato == 0]
        costo: 2
        esito:
          titolo: L'arco nella scogliera
          testo: |
            Scendi aggrappato ai ginepri e arrivi con la bassa marea all'arco, uguale a quello della Soglia di Mara, e ci passi sotto a occhi chiusi con il palmo sinistro sul pilastro, contando tre battiti.

            Quando li riapri sei nella stanza intravista alla Soglia, dove un fuoco di legna di mare brucia in un braciere senza nessuno intorno. Oltre il braciere una galleria scende verso il buio.
          vai: campana-sfiati
      - testo: "Andare a cavallo fino alla Ripamuta"
        descrizione: "In sella la costa passa più in fretta, e l'ultimo tratto lo fai a piedi."
        quando: [campana.strato == 0]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 1
        esito:
          titolo: Il cavallo sulla scogliera
          testo: |
            Il cavallo fa la costa al passo lungo e si ferma da solo dove il sentiero diventa roccia. Lo leghi a un ginepro, e lui tiene le orecchie dritte verso il mare muto. Sotto l'arco fai il gesto della Soglia e ti ritrovi
            accanto al braciere che brucia senza nessuno.
          vai: campana-sfiati
      # ------------------------------------------------ strato 1 · le canne
      - testo: "Tornare alle canne"
        descrizione: "Gli sfiati li hai già pagati, e oltre lo Spurgatore la galleria sale verso il suono."
        quando: [campana.strato == 1]
        costo: 2
        esito:
          titolo: Oltre lo Spurgatore
          testo: |
            Fai il gesto della Soglia con la mano che ormai lo sa da sola e
            attraversi gli sfiati con la bassa marea. Oltre lo Spurgatore, un
            mucchio di sale e di ferro dove l'hai lasciato, la galleria sale verso
            il suono delle canne.
          vai: campana-canne
      - testo: "Tornare alle canne a cavallo"
        descrizione: "Il cavallo resta legato al ginepro, e tu arrivi all'arco con le gambe fresche."
        quando: [campana.strato == 1]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 1
        esito:
          titolo: Le gambe fresche
          testo: |
            Leghi il cavallo allo stesso ginepro, con la corteccia ancora segnata
            dalla cavezza, e passi gli sfiati in fretta tenendoti alla parete.
            Oltre lo Spurgatore ti aspetta il suono delle canne.
          vai: campana-canne
      # ------------------------------------------------ strato 2 · il coro
      - testo: "Tornare nel coro"
        descrizione: "Gli sfiati e le canne, e poi la scala che sale verso la sala degli operatori."
        quando: [campana.strato == 2]
        costo: 2
        esito:
          titolo: Le canne che tacciono
          testo: |
            Attraversi gli sfiati con la bassa marea e le canne con le mani sulle
            orecchie, finché dove è caduto l'Accordatore tacciono tutte. In cima
            alla scala la Marea Grigia ti aspetta ferma fra gli stalli del coro,
            come l'acqua di una vasca.
          vai: campana-coro
      - testo: "Tornare nel coro a cavallo"
        descrizione: "Il cavallo al ginepro, e tu con le forze intere per la scala del coro."
        quando: [campana.strato == 2]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 1
        esito:
          titolo: La scala del coro
          testo: |
            Lasci il cavallo al ginepro e passi gli sfiati e le canne senza
            fermarti, contando i passi. In cima alla scala il coro è come l'hai
            lasciato, con la Marea ferma fra gli stalli.
          vai: campana-coro
      # ------------------------------------------------ strato 3 · la camera del batacchio
      - testo: "Scendere alla camera del batacchio"
        descrizione: "Tre strati da attraversare fino a dove hai lasciato la Campana, che non si è mossa."
        quando: [campana.strato == 3]
        costo: 2
        esito:
          titolo: La catena che scende
          testo: |
            Attraversi i tre strati a passi lenti, come in una casa dove è morto
            qualcuno. Oltre la parete di fondo del coro la scala gira intorno alla
            catena, che vibra sotto la mano con una nota sola, tenuta da prima che
            tu nascessi.
          vai: campana-batacchio
      - testo: "Scendere alla camera del batacchio a cavallo"
        descrizione: "Il cavallo ti risparmia la costa. Il resto lo fai con le tue gambe."
        quando: [campana.strato == 3]
        requisiti: [chiave.cavalcatura >= 1]
        costo: 1
        esito:
          titolo: Il ginepro e la catena
          testo: |
            Leghi il cavallo al ginepro con una pacca sul collo che serve più a te che a lui. Poi
            scendi i tre strati fino alla scala intorno alla catena, che vibra sotto la mano con
            la sua nota sola.
          vai: campana-batacchio

  # ------------------------------------------------------------ la formula della verga
  - id: campana-la-formula-della-verga
    presso: campana-la-costa-grigia
    immagine: icone/ringing-bell
    titolo: La formula della verga
    sommario: "Sotto le nove tacche della verga della Capoturno c'è una riga incisa più fine delle altre."
    luogo: Superficie Fratturata, la costa grigia
    area: superficie-fratturata
    ripetibile: true
    requisiti: [campana.formula >= 1, incantesimo.campana-il-rintocco == 0]
    testo: |
      Ti siedi sulla scogliera al riparo di un ginepro, con la verga della Capoturno
      sulle ginocchia, e passi il pollice sulla riga incisa sotto le nove tacche. I
      segni sono fitti e piccoli, e se li guardi troppo a lungo si mettono in una
      forma che quasi capisci.

      {magia Difficile} È una formula di una parola sola, da dire con tutta la gola.
      Restituisce il suono come faceva la Campana, e il prezzo lo paga la testa.
    opzioni:
      - testo: "Imparare la formula"
        descrizione: "Ci vuole Magia 4 e una gola che regga, come quella della Capoturno."
        requisiti: [magia >= 4]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Molto difficile }
        successo:
          titolo: La parola sola
          testo: |
            Al terzo tentativo la parola ti esce da sola e bassissima, e il ginepro
            accanto a te perde gli aghi tutti insieme. Ti restano in bocca un sapore
            di ferro e nelle orecchie un fischio che dura un'ora.
          effetti: { incantesimo.campana-il-rintocco: 1, tormento: 1 }
        fallimento:
          titolo: La gola chiusa
          testo: |
            La parola ti si ferma in gola a metà, e per tutta la sera parli con
            una voce che non è la tua.
          effetti: { tormento: 0.5 }
      - testo: "Rimettere via la verga"
        descrizione: "La formula resta sulla verga finché non torni a cercarla."
        costo: 0
        esito:
          titolo: Nello zaino
          testo: |
            Avvolgi la verga nella tela e la rimetti nello zaino, mentre il vento
            della costa ti asciuga il sudore sul collo.

  # ------------------------------------------------------------ dopo la scelta · zittita
  - id: campana-il-rumore-delle-onde
    presso: campana-la-costa-grigia
    immagine: ambientazione/capomozzo
    titolo: Il rumore delle onde
    sommario: "Qualche giorno dopo torni in cima alla Ripamuta, a vedere che cosa resta di quello che hai fatto."
    luogo: Superficie Fratturata, in cima alla Ripamuta
    area: superficie-fratturata
    requisiti: [campana.scelta == 1, campana.epilogo == 0]
    testo: |
      Torni sulla scogliera qualche giorno dopo, quando le ferite hanno smesso di aprirsi la notte. Senti la risacca dal sentiero dei pescatori
      e continui a sentirla anche sopra l'arco, dove le onde si rompono con il rumore di tutte le altre. Un gabbiano si posa sull'orlo a pochi
      passi da te e ci resta.

      Canti la nota della Costola verso il mare, a bocca chiusa. Ti esce più alta di come la ricordavi, e il basalto sotto le mani non risponde.

      {resilienza Difficile} Lo strumento più grande della Superficie adesso tace per mano tua. Se qualcosa dovesse arrivare un'altra volta,
      nessuno lo sentirà annunciare.

      {origine fuggiasco-di-ghoran} A Ghoran, quando un tamburo del campo tace, qualcuno va sempre a vedere chi è morto. Qui non viene nessuno,
      e ti prende un freddo che con il vento non c'entra.

      Al tramonto, lontano a sud-ovest, sopra le colline si accende il bagliore della Cicatrice, uguale a ogni sera.

      {percezione Molto difficile} Stasera la luce pulsa piano e regolare, e ti sembra di poterle contare i battiti.
    opzioni:
      - testo: "Restare a guardare finché fa buio"
        descrizione: "Le onde fanno rumore, e ascoltarle è la cosa più semplice che tu abbia fatto da settimane."
        costo: 0
        esito:
          titolo: Il buio sulla costa
          testo: |
            Resti seduto finché il bagliore lontano è l'unica luce, con il rumore
            del mare sotto i piedi, e scendi per il sentiero dei pescatori senza
            voltarti.
          imposta: { campana.epilogo: 1 }
          pe: { resilienza: 5 }

  # ------------------------------------------------------------ dopo la scelta · armata
  - id: campana-il-conto-che-scende
    presso: campana-la-costa-grigia
    immagine: ambientazione/capomozzo
    titolo: Il conto che scende
    sommario: "Qualche giorno dopo, in cima alla Ripamuta, le onde non fanno ancora rumore e il conto dei Tamburi scende."
    luogo: Superficie Fratturata, in cima alla Ripamuta
    area: superficie-fratturata
    requisiti: [campana.scelta == 2, campana.epilogo == 0]
    testo: |
      Torni sulla scogliera qualche giorno dopo, quando le ferite hanno smesso di aprirsi la notte. Dal sentiero dei pescatori senti la risacca, poi fai dieci passi e sparisce come
      la prima volta, mentre ai piedi della Ripamuta le onde si rompono bianche e mute.

      Canti la nota della Costola a bocca chiusa, con le mani sul basalto, e dopo nove battiti la scogliera te la restituisce più forte.

      {tecnologia Difficile} La Campana è armata e il contatore scende da solo. Quando arriverà in fondo suonerà anche senza un Campanaro che tiri le catene.

      {origine apprendista-raschiatore} Ai turni sulla Cicatrice ti hanno insegnato a lasciare le cose come le hai trovate, se non sai a che cosa servono. Adesso lo sai, e l'hai
      lasciata lo stesso.

      A mezzanotte togli tre colpi dal conto dei Tamburi alla luce della lanterna, mentre lontano a sud-ovest il bagliore della Cicatrice pulsa come ogni notte.
    opzioni:
      - testo: "Contare quanti colpi restano"
        descrizione: "Il conto lo tieni da settimane, ma non sai che cosa succede quando finisce."
        costo: 0
        esito:
          titolo: I colpi che restano
          testo: |
            Rifai il conto sul retro della carta della Gilda finché due conti di
            fila tornano uguali, poi la pieghi nella tasca interna, dove la senti
            contro il petto. Scendi per il sentiero mentre il mare, sotto,
            continua a non fare rumore.
          imposta: { campana.epilogo: 1 }
          pe: { accademiche: 5 }

frammenti:
  - id: campana-la-ripamuta
    titolo: La scogliera muta
    area: superficie-fratturata
    immagine: ambientazione/capomozzo
    requisiti: [campana.annuncio >= 1]
    testo: |
      Una giornata oltre il Rovolungo, sulla costa grigia a nord-est di Qir-Azel,
      una scogliera di basalto nero scende a picco sul mare. I pescatori la
      chiamano Ripamuta, perché ai suoi piedi le onde si rompono senza rumore per
      un tiro di fionda, e ci passano al largo. Un pescatore di Rovolungo: «Mio
      nonno diceva che lì sotto il mare ascolta. Io so soltanto che da quelle parti
      si sta zitti e si rema svelti.»

  - id: campana-la-quarta-forma
    titolo: La forma con la bocca
    area: superficie-fratturata
    immagine: ambientazione/mito-salvaguardia-precursori
    requisiti: [campana.strato >= 4]
    testo: |
      Alle tre forme note della Salvaguardia se ne aggiunge una quarta, vista una
      sola volta sotto la Ripamuta, che chi l'ha vista chiama Campanaro. Sta
      appesa alle catene della Campana con sei braccia lunghe che finiscono in
      ganci da corda, e porta una maschera bianca come quella del ragno, con in
      più una bocca da cui esce la voce della Campana.

  - id: campana-zittita
    titolo: Il mare che torna a farsi sentire
    area: superficie-fratturata
    immagine: ambientazione/capomozzo
    requisiti: [campana.scelta == 1]
    testo: |
      Sotto la Ripamuta le onde hanno ripreso a fare rumore. I pescatori di Rovolungo dicono che una notte la risacca si è sentita fino al largo e i cani della
      costa hanno abbaiato fino all'alba. Alcuni dicono che la scogliera è guarita, altri che si è addormentata qualcosa che faceva la guardia.

  - id: campana-armata
    titolo: Il conto dei Tamburi
    area: superficie-fratturata
    immagine: ambientazione/regno-profondo
    requisiti: [campana.scelta == 2]
    testo: |
      Sotto la Ripamuta le onde continuano a rompersi senza rumore, e ogni mezzanotte il battente dei Tamburi bussa tre colpi e il conto scende. Lo strumento dei
      Precursori sepolto sotto la costa è intero e armato, e conta da solo. Quando arriverà in fondo la Campana suonerà di nuovo, con lo stesso suono basso che i
      superstiti sentirono poche ore prima della Caduta.

glossario:
  - id: campana-ripamuta
    nome: Ripamuta
    tipo: luogo
    sottotitolo: "La scogliera muta della costa grigia"
    testo: "Scogliera di basalto nero sulla costa grigia, una giornata a nord-est del Rovolungo. Ai suoi piedi le onde si rompono senza rumore e i pescatori passano al largo in silenzio. Sotto, oltre un arco di pietra nera, c'è la Campana."
    requisiti: [campana.annuncio >= 1]

  - id: campana-spurgatore
    nome: Spurgatore
    tipo: creatura
    sottotitolo: "La macchina degli sfiati"
    testo: "La macchina dei Precursori che teneva liberi dal sale gli sfiati della Campana. Grande come un carro da fieno, ha due bracci a raschietto e una pompa che sputa acqua di mare, e il sale le ha costruito addosso una crosta di scogliera."
    requisiti: [campana.annuncio >= 1]

  - id: campana-accordatore
    nome: Accordatore
    tipo: creatura
    sottotitolo: "La macchina delle canne"
    testo: "La macchina dei Precursori che accordava le canne della Campana, su sei zampe sottili e con martelli di feltro diventato ferro. Da quando nessuno le dice quale nota sia giusta, le accorda tutte su quella che fa più male."
    requisiti: [campana.strato >= 1]

  - id: campana-capoturno
    nome: Capoturno
    tipo: creatura
    sottotitolo: "La memoria del coro"
    testo: "Una figura di Marea Grigia nella sala degli operatori della Campana, alta il doppio di una donna, con la faccia che cambia a ogni sguardo. È la memoria di chi comandava il turno nella notte del suono, e difende quella notte dagli intrusi."
    requisiti: [campana.strato >= 2]

  - id: campana-campanaro
    nome: Campanaro
    tipo: creatura
    sottotitolo: "La quarta forma della Salvaguardia"
    testo: "La forma della Salvaguardia appesa alle catene della Campana, con sei braccia che finiscono in ganci da corda e una maschera bianca con la bocca, l'unica fra le forme conosciute. Prima della Campana i Raschiatori veterani ne conoscevano soltanto tre."
    requisiti: [campana.strato >= 3]
