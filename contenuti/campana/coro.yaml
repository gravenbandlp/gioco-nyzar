# La Campana Sepolta, strato 3: il coro (campana.strato 2 → 3). Si arriva dal cuore delle canne
# (`campana-canne-l-accordatore`) o, dopo una ritirata, dall'ingresso sulla costa grigia (sblocco.yaml).
# La sala degli operatori: gli stalli in file come il coro di una chiesa, tutti rivolti verso la parete di fondo, e
# la Marea Grigia come memoria corrotta dell'ultima notte, con le figure che ripetono i gesti del turno e il bambino
# al tavolo dei sogni del Forno della Nonna, che ha una faccia diversa a ogni sguardo. Qui le negative principali
# sono la Contaminazione e il Tormento.
# - area `campana-coro`: undici stanze ripetibili, in fasce di profondità (una stanza superata non ricompare nella
#   stessa visita): 0 le prime file (gli stalli occupati, la coperta) o la porta di sotto (la fila mandata giù,
#   combattimento con gli operatori); 1 il bambino al tavolo (la trottola, il nome del Forno) o la tazza sul bracciolo
#   (il ripiano dei nove indicatori, il ragno-sacrificale); da 1 a 3 l'operatore con le mani sulle orecchie, dove la
#   Marea è più fitta; 2 la volta (il cielo della notte del suono, le due stelle del Sornione) o il corridoio dei turni
#   (la lanterna di Pannion, gli operatori); 3 il registro dei colpi (il conto dei Tamburi) o il bambino di nuovo
#   (più grande, sorvegliato dal ragno); 4 la parete di fondo (le nove grate, le crepe) o lo stallo alto (la voce
#   degli ordini).
# - Il cuore a 5 è `campana-coro-la-capoturno`: la memoria di chi comandava il turno, nello stallo alto. Vie: lo
#   scontro, il nome del Forno (Difficile), il leggio (Tecnologia, Difficile), il Comando (Magia, Difficile). Chi
#   vince prende la verga della Capoturno con la formula del Rintocco (campana.formula), un nucleo raro e un segreto,
#   e scende alla camera del batacchio (campana.strato 3). Chi perde torna in Superficie e lo strato è da rifare.
# - Misure: il nome del Forno (il bambino al tavolo, la Capoturno), il cielo del Sornione (la volta), il conto dei
#   Tamburi (il registro). Dono: Pannion (la lanterna nel corridoio dei turni). Origini: il Rampollo (le prime file, lo
#   stallo alto, con un'opzione), l'Allievo di Torvessa (la tazza, la volta con un'opzione, la Capoturno).
# - La questione aperta resta aperta: gli operatori contano all'indietro da molto prima, guardano il cielo, mandano la
#   gente sotto; la Marea è più fitta dove il suono batteva più forte, e le crepe partono dalla parete della Campana.
aree:
  - id: campana-coro
    immagine: ambientazione/marea-grigia
    nome: Il coro
    sommario: "La sala degli operatori della Campana, dove la Marea Grigia ripete ancora l'ultima notte."
    spedizione: { ritorno: superficie-fratturata, soglia: 5, stanze: 3 }
    testo: |
      In fondo alla foresta di canne una scala scende in una sala lunga e
      bassa, piena di stalli in file rivolti verso la parete di fondo come in
      un coro di chiesa. Fra le file ristagna la Marea Grigia, che dove è più
      densa prende la forma di persone sedute ai loro posti. In fondo, a un
      tavolo piccolo, siede un bambino.

      Le mani ti vanno da sole alle maniche, a tirarle giù fino ai polsi.

# La musica dello strato (come le altre aree in contenuti/audio.yaml).
colonna:
  - { contesto: area, id: campana-coro, musica: our-wounds-our-crown, ambiente: astral-plane }

storylet:
  # ------------------------------------------------------------ 0 · le prime file
  - id: campana-coro-le-prime-file
    immagine: ambientazione/marea-grigia
    titolo: Le prime file
    sommario: "Le file più vicine alla scala, quasi tutte occupate da figure di Marea."
    luogo: Il coro, le prime file
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 0]
    testo: |
      Le prime file sono le più affollate, e in quasi ogni stallo una figura di
      Marea con le spalle curve ogni tanto si raddrizza a guardare la parete.
      Su uno stallo vuoto c'è una coperta piegata. Per passare alla fila dopo
      devi infilarti fra due figure sedute, ginocchio contro ginocchio.

      {percezione Difficile} Si raddrizzano sempre dalla fila in fondo a quella
      davanti, come per una notizia passata di bocca in bocca.

      {origine rampollo-dei-quartieri-alti} Gli stalli davanti hanno i
      braccioli più larghi, perché anche quaggiù i posti buoni stavano davanti.
    opzioni:
      - testo: "Passare fra le figure senza toccarle"
        descrizione: "Di fianco, in punta di piedi, con le braccia strette al corpo."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Di fianco
          testo: |
            Passi di fianco un piede alla volta. A metà una figura si raddrizza, e
            la sua faccia grigia ti passa a un palmo dal naso senza vederti.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Il ginocchio
          testo: |
            Il ginocchio sfiora quello di una figura e il freddo ti sale fino
            all'anca. Per un momento sei seduto al suo posto, ad aspettare una
            notizia dalla fila dietro.
          effetti: { contaminazione: 1 }
      - testo: "Sederti in uno stallo vuoto e aspettare il loro turno"
        descrizione: "Quando si raddrizzano guardano tutte la parete, e nessuno guarda te."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Molto difficile }
        successo:
          titolo: Quando si raddrizzano
          testo: |
            Ti siedi accanto alla coperta piegata e aspetti. Quando la notizia
            arriva e le due figure della tua fila si raddrizzano a guardare la
            parete, passi in mezzo.
          pe: { resilienza: 3 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: La notizia
          testo: |
            Aspetti troppo, e quando la notizia arriva ti raddrizzi anche tu a
            guardare la parete, con la testa piena di una paura che non è tua.
          effetti: { tormento: 1 }
      - testo: "Attraversare la fila facendoti largo"
        descrizione: "Le figure sono leggere come fumo, e il freddo che lasciano resta addosso."
        costo: 2
        esito:
          titolo: In mezzo a loro
          testo: |
            Le figure si sfanno al tuo passaggio come fumo, e da ogni spalla che
            tocchi ti entra un pezzo di qualcun altro. Arrivi alla scaletta con le
            dita grigie.
          effetti: { profondita.campana-coro: 1, contaminazione: 1, tormento: 1 }

  # ------------------------------------------------------------ 0 · la porta di sotto
  - id: campana-coro-la-porta-di-sotto
    immagine: icone/door
    titolo: La porta di sotto
    sommario: "Una porta bassa sul fianco della sala, e davanti una fila di gente di Marea in attesa."
    luogo: Il coro, la porta di sotto
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 0]
    testo: |
      Sul fianco della sala una porta bassa dà su gradini che scendono nella
      roccia, e la strada verso il fondo del coro ci passa davanti. La Marea
      ha preso la forma di una lunga fila di persone con i fagotti in spalla
      e i bambini in braccio, che due operatori dalle maniche strette
      spingono giù con gesti svelti. Quando la fila finisce ricomincia da
      capo.

      {empatia Difficile} Spingono come si spinge la gente via da una casa
      che brucia. Uno dei due continua a voltarsi verso la sala.
    opzioni:
      - testo: "Farti largo fra gli operatori"
        descrizione: "Due figure di Marea con le maniche strette e una voce che ti cerca nella testa."
        combattimento: campana-gli-operatori
        vittoria:
          titolo: La fila che ricomincia
          testo: |
            Le due figure si sfanno in pozze grigie che si rialzano più basse e
            tornano a spingere la fila, e passi davanti alla porta prima che si
            accorgano di te.
          effetti: { profondita.campana-coro: 1 }
        sconfitta:
          titolo: Giù con gli altri
          testo: |
            Gli operatori ti spingono nella fila, che ti porta giù per dieci
            gradini con i fagotti di Marea. Risali carponi con la Marea fino alle
            ginocchia.
          effetti: { contaminazione: 0.5 }
      - testo: "Metterti in fila con gli altri"
        descrizione: "Gli operatori spingono la fila verso i gradini, ma chi sceglie il momento passa oltre."
        prova: { attributo: mentale, abilita: [resilienza, empatia], difficolta: Difficile }
        successo:
          titolo: Una spinta
          testo: |
            In coda dietro una donna con un fagotto più grande di lei, alla porta
            senti una mano grigia premerti fra le scapole con decisione quasi
            gentile. Fai un passo di lato invece di scendere.
          pe: { empatia: 3 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: I gradini
          testo: |
            La mano grigia spinge più forte del previsto, e scendi i gradini prima
            di decidere. Ti fermi nella Marea fino alla cintura, e ci metti un
            pezzo a ricordare che non stai scappando da niente.
          effetti: { contaminazione: 1 }
      - testo: "Girare dietro le colonne, dentro la Marea fitta"
        descrizione: "Dietro le colonne nessuno spinge, perché la Marea è così densa che non ci si vede."
        costo: 3
        esito:
          titolo: Dietro le colonne
          testo: |
            Cammini a tentoni nella Marea densa come latte, con la mano sulla
            pietra, ed esci oltre la porta grigio fino al collo.
          effetti: { profondita.campana-coro: 1, ferite: 0.5, contaminazione: 1 }

  # ------------------------------------------------------------ 1 · il bambino al tavolo
  - id: campana-coro-il-bambino-al-tavolo
    immagine: icone/spinning-top
    titolo: Il bambino al tavolo
    sommario: "A metà del coro, a un tavolo piccolo, un bambino di Marea fa girare una trottola."
    luogo: Il coro, il tavolo del bambino
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 1]
    testo: |
      A metà del coro, a un tavolo piccolo, un bambino di Marea Grigia fa
      girare una trottola di metallo nero, e quando rallenta la rilancia con
      due dita. Ogni volta che lo guardi ha un'altra faccia, adesso magra con
      le orecchie a sventola. Per proseguire devi passargli accanto, e quando
      ti avvicini la trottola cambia suono.

      {resilienza Difficile} È il bambino dei sogni del Forno della Nonna, e
      qui sei sveglio. Questo dovrebbe consolarti, e la nuca la pensa in un
      altro modo.
    opzioni:
      - testo: "Dirgli il nome di Nan'Ireth"
        descrizione: "Al Forno della Nonna hai preso il nome con cui un'operatrice si faceva riconoscere dalle macchine."
        requisiti: [misura.forno >= 1]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: Un nome di casa
          testo: |
            Lo dici piano, e il bambino alza la testa come a un nome di casa. Per
            la prima volta la faccia gli resta uguale, e con il mento ti indica il
            fondo del coro.
          pe: { empatia: 5 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Il nome storto
          testo: |
            Il nome ti esce con l'accento sbagliato. La trottola rotola sotto il
            tavolo, e la Marea intorno si stringe verso di te.
          effetti: { tormento: 1, contaminazione: 0.5 }
      - testo: "Rilanciare la trottola quando rallenta"
        descrizione: "Due dita sul gambo al momento giusto, ma la trottola è piccola e gira storta."
        prova: { attributo: fisico, abilita: [acrobazia, rissa], difficolta: Difficile }
        successo:
          titolo: Il colpo di dita
          testo: |
            Appena la trottola ondeggia la rilanci con due dita prima di lui, e il
            bambino si fa da parte come con chi ha vinto il turno.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Il gambo
          testo: |
            Il gambo è affilato come una lama e ti apre il polpastrello, e il
            sangue diventa grigio prima di toccare il tavolo.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Passare oltre senza guardarlo in faccia"
        descrizione: "Gli passi accanto tenendo gli occhi bassi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Molto difficile }
        successo:
          titolo: Gli occhi bassi
          testo: |
            Tieni gli occhi sulle scarpe e passi accanto al tavolo, con la
            trottola che gira all'altezza del gomito. Quando ti volti, dieci passi
            più avanti, la sedia è vuota.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Una faccia di troppo
          testo: |
            A metà gli occhi si alzano da soli, e il bambino ha la tua faccia,
            com'era a quell'età. Torni alla fila di prima senza averlo deciso.
          effetti: { tormento: 1 }
      - testo: "Tirare dritto, con gli occhi bassi e le mani in tasca"
        descrizione: "Il tavolo è in mezzo al passaggio, e la testa paga dopo."
        costo: 2
        esito:
          titolo: La trottola dietro le spalle
          testo: |
            La trottola cambia suono a ogni tuo passo e ti segue per tutta la fila
            dopo. Quando smette ti lascia un vuoto grigio dove prima c'era
            qualcosa che sapevi.
          effetti: { profondita.campana-coro: 1, tormento: 1, contaminazione: 1 }

  # ------------------------------------------------------------ 1 · la tazza sul bracciolo
  - id: campana-coro-la-tazza
    immagine: icone/coffee-mug
    titolo: La tazza sul bracciolo
    sommario: "Uno stallo con un ripiano di vetri spenti, una tazza sul bracciolo e un ragno sugli schienali."
    luogo: Il coro, lo stallo del ripiano
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 1]
    testo: |
      Uno stallo più grande degli altri ha davanti un ripiano di metallo nero
      con nove vetri spenti e piccole leve, e sul bracciolo una tazza di
      terracotta con il manico riattaccato. Sopra la tua testa, da uno
      schienale all'altro, corre un ragno-sacrificale della Salvaguardia con
      quattro braccia e la maschera bianca senza bocca.

      {tecnologia Difficile} I nove vetri sono indicatori, e solo l'ultimo ha
      ancora in fondo una piccola luce rossa.

      {origine allievo-di-torvessa} Orvald Temmerin direbbe che un ripiano così
      serviva a guardare, e la volta seguente direbbe il contrario.
    opzioni:
      - testo: "Aspettare che il ragno scenda, e affrontarlo"
        descrizione: "Quattro braccia e una maschera senza bocca, e sugli schienali è a casa sua."
        combattimento: campana-il-ragno-del-coro
        vittoria:
          titolo: Il ragno fra i sedili
          testo: |
            Il ragno finisce incastrato fra due sedili con le braccia piegate al
            contrario. La tazza, sul bracciolo, non si è mossa di un dito.
          effetti: { profondita.campana-coro: 1 }
        sconfitta:
          titolo: Dall'alto
          testo: |
            Il ragno ti cade addosso e ti inchioda fra due stalli con la maschera
            contro la faccia. Quando ti lascia sei di nuovo vicino alla scala,
            senza sapere come.
          effetti: { contaminazione: 0.5 }
      - testo: "Spegnere l'ultima luce del ripiano"
        descrizione: "Il ragno gira sempre intorno allo stallo con l'ultima luce accesa."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: La luce rossa
          testo: |
            Abbassi con il pollice la leva sotto il nono vetro, e la luce rossa si
            spegne mentre il ragno si accuccia su uno schienale. Dietro la leva
            trovi un piccolo cilindro di cristallo, e te lo metti in tasca.
          pe: { tecnologia: 3 }
          effetti: { profondita.campana-coro: 1, parte.camera-2: 1 }
        fallimento:
          titolo: La leva sbagliata
          testo: |
            La leva accende tutti e nove i vetri, e il ragno scende con un salto
            solo e ti apre la spalla.
          effetti: { ferite: 1 }
      - testo: "Passare carponi sotto il ripiano"
        descrizione: "Sotto il ripiano c'è un varco basso pieno di Marea, e il ragno guarda in alto."
        costo: 3
        esito:
          titolo: Carponi
          testo: |
            Passi carponi nella Marea ferma da secoli, spessa come colla, ed esci
            con le mani grigie fino ai gomiti e un taglio sul palmo.
          effetti: { profondita.campana-coro: 1, ferite: 1, contaminazione: 0.5 }

  # ------------------------------------------------------------ 1-3 · le mani sulle orecchie
  - id: campana-coro-le-mani-sulle-orecchie
    immagine: icone/screaming
    titolo: Le mani sulle orecchie
    sommario: "Nell'angolo verso la Campana, un operatore di Marea accucciato con le mani sulle orecchie."
    luogo: Il coro, l'angolo verso la Campana
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro >= 1, profondita.campana-coro <= 3]
    testo: |
      In un angolo contro la roccia la Marea è così fitta che ti arriverebbe
      al petto, ed è la via più corta verso il fondo. In mezzo c'è un
      operatore accucciato con le mani premute sulle orecchie, che ogni tanto
      sobbalza per un colpo che sente soltanto lui.

      {natura Difficile} L'angolo guarda dritto verso la camera della Campana,
      e la Marea si è fermata dove il suono batteva più forte.
    opzioni:
      - testo: "Attraversare la Marea fitta dell'angolo"
        descrizione: "Una decina di passi nella Marea più densa che tu abbia mai visto."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Dieci passi
          testo: |
            Attraversi a denti stretti contando i passi, con il freddo che sale al petto, e quando l'operatore sobbalza senti il colpo anche tu, nelle
            ossa.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: A metà
          testo: |
            A metà le gambe cedono, e ti ritrovi in ginocchio accanto
            all'operatore con le mani sulle orecchie come lui.
          effetti: { contaminazione: 1 }
      - testo: "Toccare la spalla dell'operatore"
        descrizione: "È l'unica figura del coro che non fa quello che fanno gli altri."
        prova: { attributo: sociale, abilita: empatia, difficolta: Molto difficile }
        successo:
          titolo: Il segno
          testo: |
            La spalla è fredda e vera. L'operatore alza la testa e con il gomito
            ti indica un passaggio fra la roccia e l'ultimo stallo, dove la Marea
            è bassa.
          pe: { empatia: 5 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Il colpo
          testo: |
            Il colpo che sente lui arriva intero anche a te e ti spacca la testa
            dalla nuca agli occhi. Ti ritrovi seduto lontano dall'angolo, con un
            fischio che non se ne va.
          effetti: { tormento: 1 }
      - testo: "Girare largo, lungo la roccia"
        descrizione: "Lungo la roccia la Marea è più bassa, ma la pietra è piena di schegge di cristallo."
        costo: 2
        esito:
          titolo: Lungo la roccia
          testo: |
            Giri l'angolo con la schiena contro la roccia, e le schegge di
            cristallo ti tagliano la giubba e la pelle sotto. Ogni volta che
            l'operatore sobbalza, ti sobbalza il cuore.
          effetti: { profondita.campana-coro: 1, ferite: 1, contaminazione: 0.5 }

  # ------------------------------------------------------------ 2 · la volta
  - id: campana-coro-la-volta
    immagine: icone/night-sky
    titolo: La volta
    sommario: "Una cupola di vetro scuro piena di stelle, e le figure di Marea che la guardano."
    luogo: Il coro, sotto la cupola
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 2]
    testo: |
      Qui la volta si alza in una cupola di vetro scuro piena di punti di
      luce, come un cielo d'estate, che gira così piano da accorgersene solo
      guardando il bordo. Sotto, le figure di Marea guardano in su, e una
      tende il braccio verso un punto preciso del vetro.

      {percezione Media} Il braccio punta sempre allo stesso posto, anche
      mentre la cupola gira, e in quel posto adesso c'è soltanto vetro
      scuro.
    opzioni:
      - testo: "Fermare la cupola sull'ora delle due stelle"
        descrizione: "Al Sornione hai visto il cielo della notte del suono, con le due stelle che oggi mancano."
        requisiti: [misura.sornione >= 1]
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Difficile }
        successo:
          titolo: L'ora del suono
          testo: |
            Giri a mano la ruota sotto il bordo della cupola finché il punto indicato dal braccio arriva dove il Sornione mette le due stelle, e nel vetro si accendono la grande bianca sopra il nord-est e la piccola rossa due dita più in alto. Le figure corrono
            ai loro stalli tutte insieme mentre le stelle si spengono, e fra gli stalli resta una corsia libera.
          pe: { accademiche: 5 }
          effetti: { profondita.campana-coro: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il cielo sbagliato
          testo: |
            La ruota ti scappa di mano e sopra di te scorrono troppe notti, mentre
            le figure gridano senza voce.
          effetti: { tormento: 1, contaminazione: 0.5 }
      - testo: "Seguire il braccio teso"
        descrizione: "La figura indica sempre lo stesso punto, e sotto quel punto qualcosa ci sarà."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Molto difficile }
        successo:
          titolo: La pietra consumata
          testo: |
            Segui la linea dal braccio al soffitto e poi giù, fino a un sentiero
            di passi consumato nella pietra che va verso il fondo del coro.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: In su
          testo: |
            Guardi in su troppo a lungo, e quando riabbassi gli occhi ti accorgi
            di aver tenuto la faccia all'insù come le figure, senza sapere per
            quanto.
          effetti: { tormento: 1 }
      - testo: "Passare sotto la cupola a testa bassa"
        descrizione: "Le figure guardano in alto, e tu guardi in basso e cammini."
        costo: 2
        esito:
          titolo: A testa bassa
          testo: |
            Attraversi con gli occhi sui piedi, urtando con le spalle figure che
            non si spostano. Dall'altra parte ti accorgi che non riesci a
            raddrizzare del tutto la testa.
          effetti: { profondita.campana-coro: 1, tormento: 1, contaminazione: 1 }
      - testo: "Leggere la cupola come gli astrolabi dell'Accademia"
        descrizione: "All'Accademia di Torvessa ci sono strumenti che fanno girare il cielo, e la regola dovrebbe essere la stessa."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Difficile }
        successo:
          titolo: Il polo
          testo: |
            Trovi il polo intorno a cui gira tutto e da lì conti fino al punto del
            braccio, sotto cui un sentiero di passi consumati va verso il fondo.
            Orvald Temmerin sarebbe contento, e poi ti chiederebbe perché.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Il polo che scappa
          testo: |
            Il polo non sta fermo come negli strumenti dell'Accademia, e mentre lo
            cerchi ti gira la testa e la Marea ti sale lungo le caviglie.
          effetti: { tormento: 0.5, contaminazione: 0.5 }

  # ------------------------------------------------------------ 2 · il corridoio dei turni
  - id: campana-coro-il-corridoio-dei-turni
    immagine: icone/old-lantern
    titolo: Il corridoio dei turni
    sommario: "Il corridoio dove gli operatori si davano il cambio, pieno di figure che vanno e vengono."
    luogo: Il coro, il corridoio dei turni
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 2]
    testo: |
      Dietro le ultime file corre un corridoio stretto, con ganci alle pareti
      e qualche mantello grigio appeso. Era il passaggio dei turni, e la
      Marea lo riempie di figure che arrivano e smontano senza lasciarti
      spazio. In fondo una lanterna vuota pende da un gancio sopra la porta.

      {conoscenze-della-strada Difficile} Un cambio turno ha sempre un orario
      morto fra chi esce e chi arriva. Qui però l'orario è fermo alla notte
      del suono.
    opzioni:
      - testo: "Accendere una lanterna alla maniera di Pannion"
        descrizione: "A Pannion le lanterne sui pontili guidano a casa gli spiriti della foresta."
        requisiti: [dono.pannion >= 1]
        prova: { attributo: mentale, abilita: [natura, resilienza], difficolta: Media }
        successo:
          titolo: La lanterna sul gancio
          testo: |
            Appendi la lanterna accesa al primo gancio, alta, come sui pontili di
            Pannion. Le figure si voltano verso la luce e si mettono in fila sotto
            il gancio, lasciando vuoto il corridoio.
          pe: { natura: 3 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Lo stoppino
          testo: |
            Lo stoppino non prende nell'aria fredda della Marea, e quando la
            fiammella muore le figure tornano a passarti davanti, più fitte di
            prima.
          effetti: { tormento: 0.5 }
      - testo: "Aprirti la strada fra quelli del cambio"
        descrizione: "Due operatori di Marea si accorgono di te e smettono di andare e venire."
        combattimento: campana-gli-operatori
        vittoria:
          titolo: Il cambio saltato
          testo: |
            I due operatori si sfanno contro il muro fra i mantelli appesi, e le
            altre figure si fermano per la prima volta. Passi in mezzo a loro
            finché sono ferme.
          effetti: { profondita.campana-coro: 1 }
        sconfitta:
          titolo: Fuori turno
          testo: |
            Gli operatori ti respingono fino agli stalli, e la loro voce ti resta
            in testa a ripetere un orario che non capisci.
          effetti: { tormento: 0.5 }
      - testo: "Aspettare l'orario morto"
        descrizione: "Prima o poi il corridoio resta vuoto per un momento, e bisogna esserci."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Molto difficile }
        successo:
          titolo: Il momento vuoto
          testo: |
            Aspetti appiattito fra due mantelli, contando le figure. Fra la fine
            di un turno e l'inizio dell'altro il corridoio resta vuoto il tempo di
            dieci passi, e tu ne fai dodici.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Il turno dopo
          testo: |
            Esci un passo troppo presto, e il turno che arriva ti passa attraverso
            una figura dopo l'altra, lasciandoti addosso il suo freddo.
          effetti: { contaminazione: 1 }
      - testo: "Passare in mezzo a loro, spalla contro spalla"
        descrizione: "Il corridoio è stretto, e le figure non si fermano per te."
        costo: 3
        esito:
          titolo: Spalla contro spalla
          testo: |
            Cammini con il turno che smonta, al suo passo lento, e arrivi in fondo
            con le braccia grigie e la voglia di dormire in un letto che non hai
            mai visto.
          effetti: { profondita.campana-coro: 1, contaminazione: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 3 · il registro dei colpi
  - id: campana-coro-il-registro-dei-colpi
    immagine: icone/abacus
    titolo: Il registro dei colpi
    sommario: "Una parete incisa di colonne di segni, fitte come un libro di conti, con l'ultima colonna ancora aperta."
    luogo: Il coro, la parete del registro
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 3]
    testo: |
      Su una parete laterale corrono colonne di segni incisi nella pietra
      nera, ognuna cominciata con un segno largo e più corta della precedente.
      Davanti all'ultima una figura di Marea tiene alzato un punteruolo e
      incide un segno nuovo, sempre nello stesso punto.

      {tecnologia Difficile} È un conto che scende, ripreso da capo a ogni
      colonna, e chi lo teneva lo teneva da molto prima della notte del suono.
    opzioni:
      - testo: "Confrontare l'ultima colonna con il conto dei Tamburi"
        descrizione: "Sotto la Palude Acquanera hai copiato il conto dei colpi che restano, e ne togli tre ogni notte."
        requisiti: [misura.tamburi >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Difficile }
        successo:
          titolo: Lo stesso numero
          testo: |
            Conti i segni dell'ultima colonna dal fondo e arrivi al conto dei Tamburi, meno i colpi delle notti passate. È lo stesso. La
            figura abbassa il punteruolo e si fa da parte, e dietro di lei c'è una porta stretta.
          pe: { tecnologia: 5 }
          effetti: { profondita.campana-coro: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il conto che scappa
          testo: |
            Perdi il conto due volte, e alla seconda la figura ti incide sul dorso
            della mano un segno piccolo e netto, che resta grigio.
          effetti: { tormento: 1, contaminazione: 0.5 }
      - testo: "Leggere le colonne dall'inizio"
        descrizione: "Un registro tenuto così a lungo dice anche quando è cominciato."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Molto difficile }
        successo:
          titolo: La prima colonna
          testo: |
            Risali fino alla prima colonna, il cui segno largo è inciso da una
            mano diversa dalle altre, molto prima di quella notte. In fondo alla
            parete trovi la porta stretta di chi teneva il registro.
          pe: { accademiche: 5 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Colonne
          testo: |
            Le colonne ti si confondono davanti agli occhi, finché ti accorgi che
            stai contando all'indietro ad alta voce e la figura si è girata ad
            ascoltarti.
          effetti: { tormento: 1 }
      - testo: "Passare dietro la figura che incide"
        descrizione: "È tutta presa dal suo conto, e basta non farle sbagliare un segno."
        costo: 2
        esito:
          titolo: Alle sue spalle
          testo: |
            Le passi alle spalle così vicino che senti il raschio del punteruolo
            nei denti, e la figura si ferma come se avesse perso il conto. La
            Marea intorno a lei ti viene dietro per un tratto.
          effetti: { profondita.campana-coro: 1, contaminazione: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · il bambino, di nuovo
  - id: campana-coro-il-bambino-di-nuovo
    immagine: icone/spinning-top
    titolo: Il bambino, di nuovo
    sommario: "Vicino alla parete di fondo, il bambino a un altro tavolo e il ragno sopra di lui."
    luogo: Il coro, il secondo tavolo
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 3]
    testo: |
      Quasi sotto la parete di fondo il bambino siede a un altro tavolo, con la
      trottola ferma e la faccia di un ragazzo più grande, con la prima ombra di
      barba. Sullo schienale accanto è accucciato un ragno-sacrificale della
      Salvaguardia, con due braccia abbassate verso di lui come una balia sopra una
      culla.

      {armi-da-mischia Media} Il ragno ha il peso tutto sulla sinistra. Se scende,
      scenderà da quella parte.
    opzioni:
      - testo: "Togliere il ragno da sopra il bambino"
        descrizione: "Il ragno sorveglia il tavolo e non si muove da lì."
        combattimento: campana-il-ragno-del-coro
        vittoria:
          titolo: La culla vuota
          testo: |
            Il ragno scende dalla sinistra e cade fra gli stalli con la maschera
            spaccata, mentre il ragazzo, che non ha guardato, riprende a far
            girare la trottola.
          effetti: { profondita.campana-coro: 1 }
        sconfitta:
          titolo: Le braccia del ragno
          testo: |
            Il ragno ti tiene sollevato sopra il tavolo con due braccia, a
            guardare il ragazzo che fa girare la trottola, poi ti lascia cadere
            fra le file.
          effetti: { contaminazione: 0.5 }
      - testo: "Sederti davanti a lui e aspettare"
        descrizione: "Al primo tavolo giocava. Qui sembra che aspetti qualcuno."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Difficile }
        successo:
          titolo: La trottola spinta
          testo: |
            Ti siedi per terra davanti al tavolo e aspetti a lungo. Alla fine il
            ragazzo spinge la trottola verso di te con un dito, e il ragno sopra
            di lui ritira le braccia. Gli lasci la trottola sul tavolo e passi.
          pe: { empatia: 3 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Nessuno
          testo: |
            Lui guarda attraverso di te verso la scala, dove aspetta qualcun
            altro, e te ne vai prima che il ragno scenda con la testa piena di
            un'attesa non tua.
          effetti: { tormento: 1 }
      - testo: "Passare dietro gli stalli, lontano dal tavolo"
        descrizione: "Dietro gli stalli c'è un passaggio stretto e buio, lontano dal bambino."
        costo: 3
        esito:
          titolo: Dietro gli stalli
          testo: |
            Passi dietro gli stalli piegato in due, e il ragno ti segue dagli
            schienali senza lasciare il bambino. A metà ti graffia la schiena una
            volta sola, come per ricordarti dove sei.
          effetti: { profondita.campana-coro: 1, ferite: 1, contaminazione: 0.5 }

  # ------------------------------------------------------------ 4 · la parete di fondo
  - id: campana-coro-la-parete-di-fondo
    immagine: icone/cracked-glass
    titolo: La parete di fondo
    sommario: "La parete verso cui guardano gli stalli, una lastra nera crepata con nove grate da cui cola la Marea."
    luogo: Il coro, la parete di fondo
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 4]
    testo: |
      La parete verso cui guardano gli stalli è una lastra di metallo nero
      alta come tre case, con nove grate rotonde in cerchio da cui cola
      lenta la Marea. Dietro c'è la camera della Campana, e la lastra è
      attraversata da crepe sottili che partono dal centro, come un piatto
      colpito con il dorso di un cucchiaio.

      {accademiche Molto difficile} Nove grate nell'ordine delle nove pietre
      dell'Anello del Camminatore. Da qui le misure entravano, o uscivano.
    opzioni:
      - testo: "Leggere da che parte cola la Marea"
        descrizione: "La Marea cola dalle grate e si allarga, ma da qualche parte resterà un passaggio asciutto."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: Il bordo asciutto
          testo: |
            La Marea cola sempre verso le file e mai verso destra, dove il
            pavimento sale di un dito, e su quel dito di pietra asciutta arrivi in
            fondo.
          pe: { natura: 3 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: La pozza
          testo: |
            Scegli il lato sbagliato e la Marea ti arriva alle ginocchia. Esci
            dalla pozza con le gambe grigie e nelle orecchie la nota bassa che
            passa attraverso la lastra.
          effetti: { contaminazione: 1 }
      - testo: "Arrampicarti sulle crepe fino alla grata più alta"
        descrizione: "Le crepe offrono appigli e la grata più alta è asciutta, ma sono tre case di metallo liscio."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Molto difficile }
        successo:
          titolo: La grata alta
          testo: |
            Sali con le dita nelle crepe e i piedi sugli orli delle grate, e dalla
            più alta vedi una cornice di pietra che porta allo stallo alto. Ci
            scendi con le dita che tremano.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Lo scivolone
          testo: |
            Una crepa ti si chiude sulle dita come una bocca, e quando le liberi
            scivoli lungo la lastra fino alla Marea, con i palmi aperti dagli orli
            delle grate.
          effetti: { ferite: 1 }
      - testo: "Passare sotto le grate, dentro la Marea che cola"
        descrizione: "È la strada più corta e la più sporca, perché qui la Marea è fresca."
        costo: 3
        esito:
          titolo: Sotto le grate
          testo: |
            Passi sotto le nove grate a testa bassa, con la Marea fredda che ti cola sulla
            nuca. Dall'altra parte ti scrolli come un cane bagnato, e la Marea non viene
            via.
          effetti: { profondita.campana-coro: 1, contaminazione: 1.5, tormento: 0.5 }

  # ------------------------------------------------------------ 4 · lo stallo alto
  - id: campana-coro-lo-stallo-alto
    immagine: ambientazione/marea-grigia
    titolo: Lo stallo alto
    sommario: "Uno stallo vuoto su una pedana, da cui arriva comunque una voce che dà ordini."
    luogo: Il coro, lo stallo alto
    area: campana-coro
    ripetibile: true
    requisiti: [campana.strato == 2, profondita.campana-coro == 4]
    testo: |
      In fondo al coro uno stallo più alto degli altri sta su una pedana di tre gradini,
      con un leggio di metallo davanti e sopra un paio di guanti da lavoro. Lo stallo è
      vuoto, eppure ne arriva una voce bassa e ferma di donna che dà ordini in una lingua
      che non conosci, e a ogni ordine le file si muovono insieme.

      {empatia Difficile} A metà la voce si incrina appena, sempre nello stesso punto. Chi
      parlava aveva paura, e non voleva che gli altri lo sentissero.
    opzioni:
      - testo: "Salire sulla pedana e rispondere alla voce"
        descrizione: "Una voce che dà ordini si aspetta una risposta, e il tono conta più della lingua."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Difficile }
        successo:
          titolo: Agli ordini
          testo: |
            Sali i tre gradini e rispondi a voce alta, con il tono svelto di un sottoposto che
            ha capito. La voce dice una parola diversa dalle altre, e le file si fanno da parte
            come per uno del turno.
          pe: { persuasione: 3 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: Fuori posto
          testo: |
            Rispondi, e le figure si girano tutte insieme verso la pedana. Ti
            scendono addosso con il freddo di cento spalle, e ti ritrovi ai suoi
            piedi con la testa che ronza.
          effetti: { tormento: 1, contaminazione: 0.5 }
      - testo: "Passare sotto la pedana mentre le figure si muovono"
        descrizione: "A ogni ordine le file si muovono insieme, e in quel momento nessuna guarda in basso."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Molto difficile }
        successo:
          titolo: Fra un ordine e l'altro
          testo: |
            Mentre le file si muovono ti infili sotto la pedana contro la parete,
            e al secondo ordine sei già dall'altra parte.
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: L'ordine sbagliato
          testo: |
            Ti muovi un ordine troppo tardi, e le figure tornano ai loro posti
            passandoti attraverso una dopo l'altra.
          effetti: { contaminazione: 1 }
      - testo: "Attraversare le file mentre si muovono"
        descrizione: "Le figure cambiano posto a ogni ordine, e in mezzo al cambio si prende quello che capita."
        costo: 2
        esito:
          titolo: In mezzo al cambio
          testo: |
            Cammini controcorrente nelle file, e una figura ti fa girare su te
            stesso mentre un'altra ti spinge contro uno stallo con la forza di una
            porta sbattuta.
          effetti: { profondita.campana-coro: 1, ferite: 1, contaminazione: 1 }
      - testo: "Salutare la padrona del posto come si deve"
        descrizione: "Nei salotti dei Quartieri Alti si saluta per prima la persona seduta più in alto."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: L'inchino alla pedana
          testo: |
            Ti fermi ai piedi dei gradini e fai l'inchino corto e preciso che si deve alla
            padrona di casa. La voce si interrompe a metà di un ordine, e le file si
            aprono come per un ospite annunciato.
          pe: { galateo: 3 }
          effetti: { profondita.campana-coro: 1 }
        fallimento:
          titolo: L'inchino storto
          testo: |
            L'inchino ti viene troppo profondo, come davanti a una persona in
            lutto, e la voce si incrina nel suo punto solito. Le figure ti si
            stringono intorno senza un suono.
          effetti: { tormento: 0.5, contaminazione: 0.5 }

  # ------------------------------------------------------------ 5 · il cuore · la Capoturno
  - id: campana-coro-la-capoturno
    immagine: ambientazione/marea-grigia
    titolo: La Capoturno
    sommario: "Nello stallo alto la voce degli ordini ha preso un corpo, e nella sua notte tu sei l'intruso."
    luogo: Il coro, lo stallo alto
    area: campana-coro
    requisiti: [campana.strato == 2, profondita.campana-coro >= 5]
    testo: |
      Quando torni davanti alla pedana lo stallo alto è occupato. La Marea
      Grigia ci si è raccolta come l'acqua in una conca e ha preso la forma di
      una donna seduta, alta il doppio di una donna vera, con i guanti da
      lavoro alle mani e una verga di metallo nero sulle ginocchia. Ha una
      faccia che cambia a ogni sguardo e la voce bassa e ferma che dava ordini
      al coro. Ai piedi della pedana il bambino, al suo tavolo, ha di nuovo la
      faccia tonda della prima volta.

      La Capoturno si alza. Tutte le figure si voltano verso la parete nello
      stesso momento, e lei alza la verga verso le nove grate come per dare il
      segnale. Poi abbassa la testa e ti vede.

      {rissa Difficile} È alta e lenta, e la verga arriva lontano. Il guaio
      vero è la voce, che entra nella testa senza passare dalle orecchie.

      {resilienza Difficile fallita} Ti accorgi che stai contando all'indietro
      sottovoce, senza sapere da quale numero hai cominciato.

      {origine allievo-di-torvessa} All'Accademia la Disgregazione Memetica si
      studia come un'ipotesi da esame. Davanti a lei ti sembra una cosa che
      qualcuno ha vissuto.

      *Nella sua notte l'intruso sono io.* Le dita ti si chiudono sull'arma da
      sole, e il bambino ferma la trottola.
    opzioni:
      - testo: "Affrontare la Capoturno"
        descrizione: "Alta il doppio di te, con una verga nera e una voce che ti cerca i ricordi."
        combattimento: campana-la-capoturno
        vittoria:
          titolo: La fine del turno
          testo: |
            La Capoturno si sfa dalle mani in su, e di lei resta la voce, che dice
            un ordine a metà e si ferma. La verga cade sulla pedana e le figure
            del coro si siedono, come alla fine di un turno lungo.

            Raccogli la verga, che ha nove tacche sull'impugnatura e una riga di
            segni incisi lungo il fusto. Dietro lo stallo si è aperta una porta
            bassa.
          pe: { armi-da-mischia: 5, resilienza: 5 }
          imposta: { campana.strato: 3 }
          effetti: { oggetto.campana-verga-della-capoturno: 1, campana.formula: 1, parte.nucleo-3: 1, informazioni.segreto: 1 }
          vai: campana-batacchio
        sconfitta:
          titolo: Fuori dal turno
          testo: |
            La voce ti entra nella testa, mette in fila i tuoi ricordi e li conta
            all'indietro. Quando torni in te sei sugli scogli della Ripamuta, con
            le onde che si rompono senza rumore e il coro da rifare.
          effetti: { tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Chiamarla Nan'Ireth"
        descrizione: "Al Forno della Nonna hai preso il nome di un'operatrice che le macchine riconoscevano, e forse era il suo."
        requisiti: [misura.forno >= 1]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Difficile }
        successo:
          titolo: Il nome
          testo: |
            Dici il nome di Nan'Ireth come un ordine. La Capoturno si ferma con la verga
            alzata e il bambino alza la testa con la stessa faccia. Poi ti porge la verga
            dall'impugnatura, come a chi prende il turno dopo, e si sfa piano dentro lo
            stallo.

            La verga ha nove tacche sull'impugnatura e una riga di segni incisi lungo il
            fusto. Dietro lo stallo si è aperta una porta bassa.
          pe: { persuasione: 5, empatia: 5 }
          imposta: { campana.strato: 3 }
          effetti: { oggetto.campana-verga-della-capoturno: 1, campana.formula: 1, parte.nucleo-3: 1, informazioni.segreto: 1 }
          vai: campana-batacchio
        fallimento:
          titolo: Il nome di un altro
          testo: |
            Il nome le arriva addosso come un insulto, e la voce si alza fino a
            riempire il coro. Ti ritrovi sugli scogli della Ripamuta con il sangue
            nelle orecchie e tutto il coro da rifare.
          effetti: { ferite: 2, tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Spegnere il leggio"
        descrizione: "Il turno della Capoturno va avanti da secoli, e il leggio ha leve come il ripiano."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il leggio spento
          testo: |
            Ti butti sotto il leggio mentre la verga ti passa sopra la testa e
            abbassi le leve. La voce si spegne a metà di un ordine, e la Capoturno
            si affloscia nello stallo come un mantello vuoto lasciandoti cadere la
            verga ai piedi.

            La verga ha nove tacche sull'impugnatura e una riga di segni incisi
            lungo il fusto. Dietro lo stallo si è aperta una porta bassa.
          pe: { tecnologia: 10 }
          imposta: { campana.strato: 3 }
          effetti: { oggetto.campana-verga-della-capoturno: 1, campana.formula: 1, parte.nucleo-3: 1, informazioni.segreto: 1 }
          vai: campana-batacchio
        fallimento:
          titolo: La leva che accende
          testo: |
            La leva accende il leggio invece di spegnerlo, e la voce della Capoturno
            esce da tutte e nove le grate. Ti svegli sugli scogli della Ripamuta,
            con le mani bruciate e il coro da rifare.
          effetti: { ferite: 2, tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Ordinarle di smontare dal turno"
        descrizione: "La formula del Comando parla alle macchine dei Precursori, e anche la Capoturno prendeva ordini."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Smontare
          testo: |
            La formula ti esce nella lingua delle macchine, e la Capoturno si
            ferma a metà di un passo. Posa la verga sul leggio con cura e si siede
            nello stallo, e il coro intero si siede con lei.

            Prendi la verga, che ha nove tacche sull'impugnatura e una riga di
            segni incisi lungo il fusto. Dietro lo stallo, nella lastra, si è
            aperta una porta bassa.
          pe: { magia: 10 }
          imposta: { campana.strato: 3 }
          effetti: { oggetto.campana-verga-della-capoturno: 1, campana.formula: 1, parte.nucleo-3: 1, informazioni.segreto: 1 }
          vai: campana-batacchio
        fallimento:
          titolo: Due ordini
          testo: |
            La formula e la voce della Capoturno si scontrano a metà strada, con
            te in mezzo. Ti risvegli sugli scogli della Ripamuta con il naso che
            sanguina e il coro da rifare.
          effetti: { ferite: 2, tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
