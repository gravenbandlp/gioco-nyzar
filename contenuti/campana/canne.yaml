# La Campana Sepolta, strato 2: le canne (campana.strato 1 → 2). Si arriva dal cuore degli sfiati
# (`campana-sfiati-lo-spurgatore`, sfiati.yaml) o, dopo una ritirata, dall'ingresso sulla costa grigia
# (`campana-la-strada-della-ripamuta`, sblocco.yaml, con campana.strato == 1).
# - area `campana-canne`: la caverna delle canne, i condotti della voce della Campana. Qui la negativa principale è
#   il Tormento. Undici stanze ripetibili, tutte con `campana.strato == 1`, in fasce di profondità (una stanza
#   superata non ricompare nella stessa visita):
#   0 la scala che sale dagli sfiati (Atletica, Resilienza), il primo ponte di catena (Acrobazia, i picchiatori);
#   1 le incisioni sulle canne (Accademiche, Percezione), la foresta che urla (Resilienza, Resistenza, il dono di
#     Tuarmir), e da 1 a 3 il silenzio improvviso (Percezione, Resilienza, l'opzione del Figlio del Circolo);
#   2 la canna spaccata (Tecnologia, Atletica, la nota della Costola), chi parla forte (Furtività, le eco, il richiamo
#     della Spina, l'opzione dell'Accolito del Velo);
#   3 il nido dei picchiatori (Furtività, i picchiatori), la nota che svuota (Resilienza, Medicina);
#   4 le eco in fila (Magia, le eco), la canna maestra (Atletica, Percezione).
#   Ogni stanza ha una via senza prova a 2 o 3 rintocchi con Tormento e Ferite.
# - il cuore `campana-canne-l-accordatore` a profondità 5: l'Accordatore ai piedi della canna maestra. Vie: lo scontro
#   (`campana-l-accordatore`), la nota della Costola cantata (misura.costola, Sociale + Espressività, Difficile), i freni
#   delle zampe (Tecnologia, Difficile), il Comando (Difficile). La vittoria dà la Sordina, campana.strato 2 e porta al
#   coro; la sconfitta riporta in Superficie con lo strato da rifare.
# - Misure: la nota della Costola (la canna spaccata e il cuore), la voce della Spina (chi parla forte).
#   Dono: Tuarmir (la foresta che urla, la maschera d'erbe). Origini: figlio-del-circolo (il silenzio, con
#   un'opzione), accolito-del-velo (chi parla forte, con un'opzione; la nota che svuota).
aree:
  - id: campana-canne
    immagine: ambientazione/gradone-rosso
    nome: Le canne
    sommario: "Sopra gli sfiati, una caverna di canne di metallo nero alte come torri, dove la voce della Campana fa male."
    spedizione: { ritorno: superficie-fratturata, soglia: 5, stanze: 3 }
    testo: |
      La scala degli sfiati ti lascia su una cengia di basalto, in una caverna così alta
      che la lanterna non ne trova il soffitto. Dal buio salgono a centinaia canne di
      metallo nero larghe quanto un pozzo, unite da ponti di catena mangiati dalla
      ruggine.

      Dentro suona una nota bassa e sempre uguale, che senti più nei denti che nelle
      orecchie, e ti accorgi che stringi la mascella da quando sei arrivato.

colonna:
  - { contesto: area, id: campana-canne, musica: the-light-that-failed, ambiente: hellish-dungeon-ii }

storylet:
  # ------------------------------------------------------------ 0 · la scala e il primo ponte
  - id: campana-canne-la-scala-di-ferro
    immagine: icone/pipe-organ
    titolo: La scala di ferro
    sommario: "Una scala a chiocciola arrugginita sale lungo la prima canna."
    luogo: Le canne, la scala che sale dagli sfiati
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 0]
    testo: |
      La scala gira intorno alla prima canna, fissata con collari di ferro che i
      Precursori non avrebbero mai messo, e dove i collari hanno ceduto pende nel
      vuoto. Sul quarto giro qualcuno ha lasciato un guanto di cuoio infilato in
      un collare, con le dita verso l'alto.

      {resilienza Molto difficile} Il guanto indica la strada, o chi lo ha
      lasciato voleva le mani libere per tapparsi le orecchie. Tutte e due le
      cose ti sembrano ragionevoli.
    opzioni:
      - testo: "Salire di slancio i giri rotti"
        descrizione: "Dove la scala pende si salta, e il ferro regge se non ti fermi."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: In cima ai giri
          testo: |
            Salti i tratti che pendono senza guardare in basso e arrivi in cima,
            su una passerella fra le canne, con le ginocchia che tremano.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il collare che cede
          testo: |
            Il collare a cui ti aggrappi si apre come una mano stanca, e scivoli
            per mezzo giro di scala con la schiena sui gradini.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Salire piano, con la nota addosso"
        descrizione: "Un gradino alla volta, senza fretta, lasciando che il suono passi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Molto difficile }
        successo:
          titolo: Il suono che passa
          testo: |
            Lasci passare la nota come un'onda, contando i collari invece dei
            gradini, e arrivi in cima con le mani che tremano e la testa ancora
            tua.
          pe: { resilienza: 3 }
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: A metà scala
          testo: |
            A metà la nota ti si pianta dietro gli occhi, e resti seduto sui
            gradini finché non hai perso il conto dei giri e la voglia di salire.
          effetti: { tormento: 1 }
      - testo: "Salire a forza di braccia, senza fermarti"
        descrizione: "Trecento gradini di fila, per arrivare in cima a pezzi."
        costo: 2
        esito:
          titolo: Trecento gradini
          testo: |
            Sali senza fermarti a forza di braccia, e in cima ti lasci cadere
            sulla passerella con il cuore che batte nelle tempie, fuori tempo con
            la canna.
          effetti: { profondita.campana-canne: 1, ferite: 1, tormento: 1 }

  - id: campana-canne-il-primo-ponte
    immagine: icone/crossed-chains
    titolo: Il primo ponte di catena
    sommario: "Un ponte di catene sopra il vuoto, e sulla canna di fronte un martelletto che batte."
    luogo: Le canne, il primo ponte
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 0]
    testo: |
      Il ponte è fatto di tre catene tese sopra il buio fino alla canna di
      fronte, e a metà una di quelle per le mani è rattoppata con una corda di
      canapa ormai nera. Sulla canna di fronte due macchine sottili corrono su
      e giù sulle zampe a uncino, e ogni tanto battono il metallo con un
      martelletto e ascoltano.

      {acrobazia Difficile} Se tieni il peso basso e i piedi di traverso, la
      catena di sotto basta da sola.
    opzioni:
      - testo: "Passare il ponte di traverso, piano"
        descrizione: "Il peso basso e i piedi sulla catena di sotto."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Difficile }
        successo:
          titolo: Di traverso
          testo: |
            Passi con i piedi di traverso e le mani appena appoggiate, senza che
            le macchine si voltino, e dall'altra parte una passerella porta più
            dentro la foresta.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: La corda di canapa
          testo: |
            La corda di canapa si sfilaccia sotto le dita, e torni indietro appeso
            alla catena di sotto con le macchine ferme a guardarti.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Affrontare le due macchine sulla canna"
        descrizione: "Sottili e svelte, con un martelletto che colpisce dove sente vuoto."
        combattimento: campana-i-picchiatori
        vittoria:
          titolo: Le macchine che non battono più
          testo: |
            La seconda macchina cade nel vuoto battendo il martelletto su ogni catena
            che incontra. La prima resta incastrata fra la canna e il ponte, e passi
            oltre.
          effetti: { profondita.campana-canne: 1 }
        sconfitta:
          titolo: Il martelletto
          testo: |
            Il martelletto ti trova le costole dove l'armatura non arriva, e ogni
            colpo ti suona dentro come in una canna. Torni sulla cengia
            trascinandoti sulle catene.
          effetti: { tormento: 0.5 }
      - testo: "Aspettare che le macchine se ne vadano, e correre"
        descrizione: "Prima o poi scendono a battere un'altra canna, e il ponte intanto dondola."
        costo: 2
        esito:
          titolo: La corsa sulle catene
          testo: |
            Aspetti a lungo aggrappato alla canna e corri appena le macchine
            scendono. A metà la corda di canapa cede, e arrivi con una spalla che
            non vuole più alzarsi.
          effetti: { profondita.campana-canne: 1, ferite: 1, tormento: 1 }

  # ------------------------------------------------------------ 1 · dentro la foresta
  - id: campana-canne-le-incisioni
    immagine: icone/compass
    titolo: Le canne incise
    sommario: "Una fila di canne basse, incise alla base con segni e linee."
    luogo: Le canne, la fila incisa
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 1]
    testo: |
      La passerella costeggia una fila di canne più basse, ognuna con un segno
      dei Precursori inciso alla base e una linea dritta che ne esce. Ne conti
      nove che puntano verso punti diversi della parete, e molte altre che
      vanno più lontano.

      {accademiche Difficile} È una rosa dei venti con dei luoghi al posto dei
      venti. Una figura somiglia a una costola, un'altra a un arco senza muri.

      {origine accolito-del-velo} In Cattedrale le campane chiamano la gente.
      Queste nove canne portavano il suono a chi doveva sentirlo.
    opzioni:
      - testo: "Leggere la rosa delle canne"
        descrizione: "Nove linee verso i luoghi neri, e altre verso posti che sulle carte non ci sono."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Difficile }
        successo:
          titolo: Verso chi doveva sentire
          testo: |
            Ricopi le figure sulla carta appoggiata al ginocchio, e le nove linee ti
            tornano, una per ognuno dei luoghi neri. Le altre vanno a est, oltre le carte
            della Gilda, e una scende nel pavimento. Segui l'ultima canna della fila, che
            porta più dentro.
          pe: { accademiche: 3 }
          effetti: { profondita.campana-canne: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Le linee che si confondono
          testo: |
            Più guardi le linee più si incrociano, finché ti accorgi che stai
            seguendo il tremolio della lanterna e la nota ti si infila nel
            capogiro.
          effetti: { tormento: 1 }
      - testo: "Seguire la linea che scende"
        descrizione: "Una sola linea punta nel pavimento, e dove va lei va la strada."
        prova: { attributo: mentale, abilita: percezione, difficolta: Molto difficile }
        successo:
          titolo: La linea che scende
          testo: |
            Segui la linea sotto la ruggine grattando con il tacco, fino a una
            scaletta nascosta dietro una canna che scende su un ponte più largo.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: La ruggine
          testo: |
            Gratti la ruggine con il tacco per un pezzo, e sotto c'è altra
            ruggine, mentre la passerella ti sembra sempre più stretta.
          effetti: { tormento: 0.5 }
      - testo: "Passare la fila tappandoti le orecchie"
        descrizione: "Le canne basse cantano più forte, e con le mani sulle orecchie non guardi i piedi."
        costo: 2
        esito:
          titolo: Le mani sulle orecchie
          testo: |
            La nota ti arriva lo stesso attraverso le ossa del cranio, e in fondo
            alla fila hai le ginocchia sbucciate e un fischio nell'orecchio
            sinistro.
          effetti: { profondita.campana-canne: 1, ferite: 1, tormento: 1 }

  - id: campana-canne-la-foresta-che-urla
    immagine: icone/screaming
    titolo: La foresta che urla
    sommario: "Un tratto di canne così fitte che il suono rimbalza dall'una all'altra senza uscire."
    luogo: Le canne, il tratto fitto
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 1]
    testo: |
      Qui le canne crescono fitte come in un canneto, e la passerella passa fra
      loro in un corridoio largo una spalla, dove il suono rimbalza finché non
      capisci più da che parte arriva. Sul ferro c'è una macchia scura e secca,
      e accanto un orecchino d'osso.

      {medicina Media} È sangue vecchio, uscito dalle orecchie di qualcuno che
      si è fermato qui troppo a lungo.
    opzioni:
      - testo: "Attraversare tenendo la testa sgombra"
        descrizione: "Pensare a una cosa sola e camminare, perché il suono cerca le teste piene."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Una cosa sola
          testo: |
            Pensi soltanto alla pioggia sul tetto di una casa dove hai dormito
            bene, fino in fondo al corridoio, e quando esci non ricordi più quale
            casa fosse.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il punto della macchia
          testo: |
            A metà ti fermi, e te ne accorgi solo quando vedi la macchia scura
            sotto i piedi. Torni sui tuoi passi camminando all'indietro, con il
            naso che sanguina.
          effetti: { tormento: 1 }
      - testo: "Correre fino in fondo"
        descrizione: "Il corridoio sembra senza fine, ma le gambe sono più svelte della testa."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Molto difficile }
        successo:
          titolo: Fino in fondo
          testo: |
            Corri a testa bassa e il suono ti insegue senza raggiungerti, fino a
            una canna più larga che per fortuna sta zitta.
          pe: { resistenza: 3 }
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: La passerella che gira
          testo: |
            La spalla sbatte contro una canna in una curva che non avevi visto, il
            suono del colpo ti butta in ginocchio e torni indietro a carponi.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Passare dentro il corridoio a occhi chiusi"
        descrizione: "Tre rintocchi di cammino con la nota in testa, una mano sulla ringhiera."
        costo: 3
        esito:
          titolo: A occhi chiusi
          testo: |
            Cammini a occhi chiusi con la mano sulla ringhiera, ed esci con il
            sangue che ti cola da un orecchio e un sapore di ferro in bocca.
          effetti: { profondita.campana-canne: 1, ferite: 0.5, tormento: 1.5 }
      - testo: "Metterti nelle orecchie il muschio sordo di Tuarmir"
        descrizione: "Madre Cerya te l'ha dato alla Sella per quando avresti risentito questa nota."
        requisiti: [dono.tuarmir >= 1]
        prova: { attributo: mentale, abilita: [natura, resilienza], difficolta: Media }
        successo:
          titolo: Il muschio della Sella
          testo: |
            Ti infili nelle orecchie due ciuffi di muschio grigioverde, come i
            raccoglitori alla grata, e la nota arriva lontana mentre attraversi il
            corridoio senza fermarti.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il ciuffo che cade
          testo: |
            A metà un ciuffo ti scivola fuori dall'orecchio, e ti fermi a cercarlo
            proprio dove non dovresti. Torni indietro con il naso che sanguina.
          effetti: { tormento: 0.5 }

  - id: campana-canne-il-silenzio
    immagine: icone/silence
    titolo: Il silenzio
    sommario: "Di colpo tutte le canne tacciono insieme, e non si sa quanto durerà."
    luogo: Le canne, nel mezzo della foresta
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne >= 1, profondita.campana-canne <= 3]
    testo: |
      La nota si spegne in ogni canna tutta insieme, e nel silenzio senti il
      sangue nelle orecchie e lo sfrigolio dello stoppino. Resti fermo con un
      piede alzato.

      {percezione Difficile} A sinistra le canne sono ferme, a destra una ronza
      ancora appena, come un gatto che finge di dormire.

      {origine figlio-del-circolo} Nel Bosco di Velthar gli uccelli tacciono
      tutti insieme prima della grandine, e ti hanno insegnato a cercare un
      riparo.
    opzioni:
      - testo: "Andare dove le canne ronzano ancora"
        descrizione: "Dove la nota resta accesa, la strada è usata."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Difficile }
        successo:
          titolo: La canna che ronza
          testo: |
            Vai piano verso la canna che ronza ancora, e quando la nota riparte
            sei già due ponti più avanti, quasi grato di sentirla.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Dalla parte sbagliata
          testo: |
            Scegli le canne ferme, e quando la nota riparte ti esplode addosso da
            tutte insieme. Ti ritrovi steso sulla passerella senza sapere da
            quanto.
          effetti: { tormento: 1 }
      - testo: "Restare fermo finché il suono torna"
        descrizione: "Restare immobili e zitti, tenendo il silenzio vuoto dai pensieri."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Molto difficile }
        successo:
          titolo: Il silenzio retto
          testo: |
            Nel silenzio ti tornano in mente cose che non volevi finché non
            smettono, e quando la nota riparte la accogli quasi con sollievo.
          pe: { resilienza: 3 }
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: I pensieri
          testo: |
            Nel silenzio i pensieri arrivano tutti insieme e non riesci a mandarli
            via. Quando la nota riparte sei seduto contro una canna, con le unghie
            piantate nei palmi.
          effetti: { tormento: 1 }
      - testo: "Camminare nel silenzio senza fermarti"
        descrizione: "Tre rintocchi di cammino nel vuoto del suono, sperando di essere lontano quando torna."
        costo: 3
        esito:
          titolo: Quando torna
          testo: |
            La nota torna alle spalle e ti butta in avanti sulla passerella, e ti
            rialzi con un dente che dondola.
          effetti: { profondita.campana-canne: 1, ferite: 1, tormento: 0.5 }
      - testo: "Cercare il riparo, come prima della grandine"
        descrizione: "Nel Bosco, quando tutto tace, ci si mette sotto qualcosa."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: Sotto la canna larga
          testo: |
            Ti infili fra due canne larghe come sotto una radice, e quando la nota
            riparte ti passa sopra la testa senza toccarti.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il riparo sbagliato
          testo: |
            Le canne larghe sono le più rumorose, e quando la nota riparte ti
            schiaccia fra le due come fra due mani, lasciandoti un fischio nelle
            orecchie.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ 2 · la canna spaccata e le voci
  - id: campana-canne-la-canna-spaccata
    immagine: icone/pipes
    titolo: La canna spaccata
    sommario: "Una canna larga come una torre, spaccata per il lungo, da cui esce un suono stonato."
    luogo: Le canne, la canna spaccata
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 2]
    testo: |
      La passerella finisce contro una canna più larga delle altre, spaccata in
      verticale da una fenditura dove entra un uomo di fianco, con i lembi
      piegati verso l'esterno. Dentro dei pioli salgono verso un altro ponte, e
      ne esce una nota storta che le canne vicine riprendono male.

      {tecnologia Difficile} È stonata perché è aperta. Se la si accordasse
      sulle altre, smetterebbe di cantare.
    opzioni:
      - testo: "Salire dentro la canna, sui pioli"
        descrizione: "Dentro il suono è più forte, ma i pioli portano in alto."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Molto difficile }
        successo:
          titolo: Dentro la canna
          testo: |
            Sali i pioli con la nota che ti rimbalza intorno ed esci su un ponte
            di catena, con le mani rosse di ruggine.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il piolo
          testo: |
            Un piolo ti resta in mano e scivoli giù con la schiena contro il
            metallo che vibra, fino a dove eri entrato.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Raddrizzare i lembi della spaccatura"
        descrizione: "Chiusa abbastanza, la canna smette di stonare, ma serve forza nelle mani."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: I lembi accostati
          testo: |
            Con la spalla e una sbarra di ferro accosti i lembi quanto basta. La
            nota storta si confonde con le altre, e passi oltre per il ponte.
          pe: { tecnologia: 3 }
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il lembo che torna
          testo: |
            Il lembo torna indietro di colpo strappandoti la sbarra di mano, e la
            canna risponde con una nota così storta che ti piega le ginocchia.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Cantare la nota della Costola alla canna"
        descrizione: "La nota della Costola è quella giusta per tutte queste canne."
        requisiti: [misura.costola >= 1]
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Difficile }
        successo:
          titolo: La nota giusta
          testo: |
            Canti la nota della Costola a bocca chiusa, con la fronte sulla canna. La canna spaccata la prende e tace insieme alle vicine, e i pioli ti portano su senza
            fatica.
          pe: { espressivita: 5 }
          effetti: { profondita.campana-canne: 1, cristalli.cristallo-carico: 1 }
        fallimento:
          titolo: La nota fuori tempo
          testo: |
            Attacchi la nota mentre la canna sta già cantando, e le due note si scontrano lasciandoti a tossire sull'orlo della passerella.
          effetti: { tormento: 0.5 }
      - testo: "Infilarti nella fenditura senza pensarci"
        descrizione: "Due rintocchi dentro una canna che stona, con le mani sui pioli arrugginiti."
        costo: 2
        esito:
          titolo: La canna stonata
          testo: |
            Sali alla cieca nella fenditura, con il metallo che ti graffia le
            spalle, ed esci su un ponte di catena senza ricordare da che parte sei
            venuto.
          effetti: { profondita.campana-canne: 1, ferite: 1, tormento: 1 }

  - id: campana-canne-chi-parla-forte
    immagine: icone/echo-ripples
    titolo: Chi parla forte
    sommario: "Una piazza di ferro sospesa fra canne che ripetono il rumore dei tuoi passi, e poi anche altro."
    luogo: Le canne, la piazza sospesa
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 2]
    testo: |
      Le passerelle si incontrano su una piattaforma rotonda di ferro, appesa
      alle canne con dodici catene, e le canne ripetono il rumore di ogni tuo
      passo un po' più forte. Ti scappa un colpo di tosse, e da una delle
      bocche esce una sagoma d'aria che trema.

      {furtivita Difficile} Qui si passa lungo il bordo, dove le catene tengono
      il ferro più fermo.

      {origine accolito-del-velo} In Cattedrale ti hanno insegnato a parlare a
      bassa voce, una regola che adesso sembra scritta da qualcuno che era
      stato qui.
    opzioni:
      - testo: "Attraversare la piazza senza un suono"
        descrizione: "Sulle punte, lungo il bordo, perché le canne ripetono solo quello che sentono."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Senza un suono
          testo: |
            Passi lungo il bordo sulle punte, e la piattaforma non dice niente.
            Dall'altra parte una scala scende a un piano più basso.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il ferro che parla
          testo: |
            Il ferro geme sotto un piede, le canne lo ripetono dieci volte e le
            sagome escono da tre bocche insieme. Scappi indietro prima che ti
            arrivino.
          effetti: { tormento: 1 }
      - testo: "Affrontare le sagome d'aria"
        descrizione: "Suoni rimasti chiusi troppo a lungo, che parlano dentro la testa."
        combattimento: campana-le-eco
        vittoria:
          titolo: Le bocche vuote
          testo: |
            Le sagome si sfaldano in un colpo di vento che sa di metallo, e scendi
            la scala dall'altra parte con le orecchie che ronzano.
          effetti: { profondita.campana-canne: 1 }
        sconfitta:
          titolo: Le voci dentro
          testo: |
            Le sagome ti parlano nella testa con la tua voce, e torni indietro
            tenendoti la testa fra le mani.
          effetti: { tormento: 0.5 }
      - testo: "Dare alle canne il richiamo della Spina"
        descrizione: "La Spina dell'Eco dà la voce a cui la Campana risponde."
        requisiti: [misura.spina >= 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Difficile }
        successo:
          titolo: Il richiamo
          testo: |
            Le canne ripetono il richiamo della Spina una volta sola e tacciono.
            Le sagome rientrano come cani richiamati, e una catena si abbassa a
            farti da scala.
          pe: { espressivita: 5 }
          effetti: { profondita.campana-canne: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il richiamo storpiato
          testo: |
            Ti si incrina la voce a metà, le canne restituiscono la parte
            storpiata dieci volte più forte e scappi con le sagome alle spalle.
          effetti: { tormento: 1 }
      - testo: "Correre attraverso la piazza"
        descrizione: "Due rintocchi di corsa, con le canne che ripetono ogni passo e le sagome dietro."
        costo: 2
        esito:
          titolo: La corsa
          testo: |
            Ogni passo ti torna indietro raddoppiato, e una sagoma ti passa
            attraverso il petto lasciandoti un freddo che non se ne va.
          effetti: { profondita.campana-canne: 1, ferite: 0.5, tormento: 1.5 }
      - testo: "Recitare la litania a bassa voce, come in Cattedrale"
        descrizione: "Un accolito sa pregare con le labbra senza la voce."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: mentale, abilita: [resilienza, accademiche], difficolta: Difficile }
        successo:
          titolo: La litania senza voce
          testo: |
            Reciti la litania della sera muovendo soltanto le labbra, e le canne
            non trovano niente da ripetere.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: La parola che scappa
          testo: |
            A metà ti scappa una parola a voce alta, e le canne la ripetono fino a
            farla diventare un'altra mentre torni indietro di corsa.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ 3 · più in basso
  - id: campana-canne-il-nido-dei-picchiatori
    immagine: icone/pipe-organ
    titolo: Il nido dei picchiatori
    sommario: "Un ripiano pieno di macchine sottili accucciate, due delle quali sveglie."
    luogo: Le canne, il ripiano dei picchiatori
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 3]
    testo: |
      Il ponte scende su un ripiano di ferro fra quattro canne, pieno di
      macchine sottili accucciate sulle zampe a uncino, ammucchiate come
      granchi in una cesta. Due battono il metallo a turno con il martelletto e
      ascoltano la risposta. Sul bordo c'è uno scalpello abbandonato, il manico
      consumato da una mano non umana.

      {tecnologia Molto difficile} Dall'eco capiscono dove c'è un vuoto, e per
      loro una persona è un vuoto che si muove.
    opzioni:
      - testo: "Passare in mezzo alle macchine ferme"
        descrizione: "Fra un colpo di martelletto e l'altro, quando le due sveglie ascoltano altrove."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Fra un colpo e l'altro
          testo: |
            Ti muovi un passo alla volta fra un colpo di martelletto e l'altro, e
            in fondo al ripiano trovi una scala che scende ancora.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il colpo sulla caviglia
          testo: |
            Il martelletto ti trova la caviglia nel buio, e mezzo ripiano si
            sveglia insieme mentre torni zoppicando sul ponte.
          effetti: { ferite: 1 }
      - testo: "Affrontare le due macchine sveglie"
        descrizione: "Vanno fermate prima che sveglino le altre, e sono svelte."
        combattimento: campana-i-picchiatori
        vittoria:
          titolo: Il ripiano fermo
          testo: |
            Le prendi prima che finiscano di battere, e cadono fra le altre senza
            svegliarle. Attraversi il ripiano in punta di piedi e prendi lo
            scalpello abbandonato passando.
          effetti: { profondita.campana-canne: 1, parte.impugnatura-2: 1 }
        sconfitta:
          titolo: Tutto il nido
          testo: |
            Al rumore della lotta il nido si sveglia e le macchine ti salgono
            addosso a decine. Ti butti sul ponte di sotto e torni indietro
            zoppicando.
          effetti: { tormento: 0.5 }
      - testo: "Fermare i martelletti dall'interno"
        descrizione: "Sfilato il perno del martelletto, le macchine si spengono senza combattere."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Molto difficile }
        successo:
          titolo: Il perno
          testo: |
            Con lo scalpello abbandonato sfili il perno del martelletto alle due
            macchine sveglie e passi in mezzo al nido zitto con i perni in tasca.
          pe: { tecnologia: 5 }
          effetti: { profondita.campana-canne: 1, parte.camera-2: 1 }
        fallimento:
          titolo: Il perno sbagliato
          testo: |
            Sfili il perno sbagliato, e la macchina comincia a battere più forte.
            Il nido si sveglia, e torni sul ponte con un uncino piantato nella
            manica.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Calarti dal ripiano lungo una canna"
        descrizione: "Due rintocchi aggrappato al metallo nero che vibra, lontano dal nido."
        costo: 2
        esito:
          titolo: Lungo la canna
          testo: |
            Ti cali lungo una canna aggrappato ai rivetti, e quando tocchi il
            ripiano di sotto le dita non vogliono più staccarsi dal metallo.
          effetti: { profondita.campana-canne: 1, ferite: 1, tormento: 1 }

  - id: campana-canne-la-nota-che-svuota
    immagine: icone/sound-waves
    titolo: La nota che svuota
    sommario: "Una canna canta una nota che non si sente, e chi passa vicino dimentica perché era venuto."
    luogo: Le canne, la canna bassa
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 3]
    testo: |
      Questa canna canta così basso che non la senti, e la polvere le trema intorno.
      A tre passi dalla bocca, seduto contro la ringhiera, c'è un Raschiatore morto
      da anni, con gli occhi aperti e lo zaino ancora chiuso.

      {medicina Molto difficile} Nessuna ferita, e non è morto di fame né di freddo.
      Si è seduto, ha smesso di pensare e non ha più ricominciato.

      {origine accolito-del-velo} I novizi più vecchi dicevano che nella Caduta la
      gente ha dimenticato il mondo di prima in una notte, e davanti a quest'uomo ti
      sembra meno una metafora.
    opzioni:
      - testo: "Passare davanti alla canna con la testa piena"
        descrizione: "Recitare a voce bassa qualsiasi cosa, perché la nota cerca le teste vuote."
        prova: { attributo: mentale, abilita: [resilienza, accademiche], difficolta: Difficile }
        successo:
          titolo: La testa piena
          testo: |
            Recitando sottovoce i nomi delle vie della Città Bassa passi oltre, e
            solo dopo ti accorgi di aver dimenticato una via.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Seduto
          testo: |
            Ti ritrovi seduto accanto al Raschiatore, con le mani sulle ginocchia,
            senza sapere da quanto. Ti alzi con uno strappo e scappi indietro,
            piangendo senza motivo.
          effetti: { tormento: 1.5 }
      - testo: "Chiudere la bocca della canna con lo zaino del morto"
        descrizione: "Una canna tappata canta più piano."
        prova: { attributo: mentale, abilita: [medicina, tecnologia], difficolta: Molto difficile }
        successo:
          titolo: Lo zaino nella bocca
          testo: |
            Ti avvicini alla bocca tenendo il polso del morto, per ricordarti dal
            battito chi dei due è vivo, e ci infili lo zaino finché la nota cala.
            Prima di andare chiudi gli occhi al Raschiatore e gli prendi la
            piastrina.
          pe: { medicina: 3 }
          effetti: { profondita.campana-canne: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: La bocca vuota
          testo: |
            Arrivi alla bocca e lo zaino ti cade di mano, perché non ricordi più a
            cosa serviva, e torni indietro a fatica.
          effetti: { tormento: 1 }
      - testo: "Passare di corsa, con le mani sulle orecchie"
        descrizione: "Tre rintocchi di corsa, con le mani sulle orecchie che servono a poco."
        costo: 3
        esito:
          titolo: Il pezzo che manca
          testo: |
            Al di là ti fermi con il cuore in gola. Più tardi, cercando il nome di
            tua madre, ti ci vuole un momento di troppo per trovarlo.
          effetti: { profondita.campana-canne: 1, ferite: 0.5, tormento: 1.5 }

  # ------------------------------------------------------------ 4 · davanti alla canna maestra
  - id: campana-canne-le-eco-in-fila
    immagine: icone/echo-ripples
    titolo: Le eco in fila
    sommario: "Sulla passerella della canna maestra, una sagoma d'aria davanti a ogni bocca."
    luogo: Le canne, la passerella delle bocche
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 4]
    testo: |
      L'ultima passerella corre dritta verso la canna maestra, e davanti a ogni
      bocca lungo il percorso trema una sagoma d'aria, ferma come una
      sentinella. Accanto alla canna qualcosa si muove su zampe lunghe.

      {magia Difficile} Le sagome sono Mana piegato dal suono, e il Mana si
      raddrizza se qualcuno gli dà un'altra forma.
    opzioni:
      - testo: "Raddrizzare il Mana delle sagome"
        descrizione: "Con la magia, una sagoma alla volta, finché la passerella resta libera."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il Mana dritto
          testo: |
            Tocchi il Mana di ogni sagoma come una corda storta, e una dopo
            l'altra si sciolgono in un filo di vento fino alla canna maestra.
          pe: { magia: 5 }
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il Mana che torna
          testo: |
            Il Mana della prima sagoma ti torna indietro piegato e ti sale dalle
            dita alle tempie. Ti trovi in ginocchio, e le sagome hanno fatto un
            passo avanti.
          effetti: { tormento: 1 }
      - testo: "Aprirti la strada a colpi"
        descrizione: "Due sagome ti vengono incontro, mentre le altre stanno a vedere."
        combattimento: campana-le-eco
        vittoria:
          titolo: La passerella libera
          testo: |
            Le due sagome si sfaldano, e le altre rientrano nelle bocche come se
            avessero visto abbastanza. Arrivi in fondo alla passerella con le
            orecchie che ronzano.
          effetti: { profondita.campana-canne: 1 }
        sconfitta:
          titolo: In fila con loro
          testo: |
            Le sagome ti mettono in ginocchio con la voce di qualcuno che conosci,
            e torni indietro sentendole dietro di te per un pezzo.
          effetti: { tormento: 0.5 }
      - testo: "Passare in mezzo alle sagome"
        descrizione: "Due rintocchi fra le bocche, con le sagome che ti attraversano a una a una."
        costo: 2
        esito:
          titolo: Attraverso le sagome
          testo: |
            Ognuna delle sagome ti attraversa con un freddo diverso, e in fondo
            alla passerella ti accorgi di aver lasciato indietro un ricordo, senza
            sapere quale.
          effetti: { profondita.campana-canne: 1, ferite: 0.5, tormento: 1.5 }

  - id: campana-canne-la-canna-maestra
    immagine: icone/pipe-organ
    titolo: La canna maestra
    sommario: "La canna più grande, chiusa da un disco nero e circondata da un'impalcatura."
    luogo: Le canne, l'impalcatura della canna maestra
    area: campana-canne
    ripetibile: true
    requisiti: [campana.strato == 1, profondita.campana-canne == 4]
    testo: |
      La canna maestra è larga quanto una piazza e sale fino al buio, con la
      bocca chiusa da un disco di metallo nero grande come una ruota di
      mulino. Intorno sale un'impalcatura di ferro a più piani dalle scale
      marce, e dall'alto arrivano colpi sordi e regolari che fanno vibrare
      tutta la foresta.

      {percezione Molto difficile} I colpi arrivano tutti dallo stesso lato.
      Chi batte ha bisogno di vedere la bocca chiusa.
    opzioni:
      - testo: "Salire l'impalcatura dai montanti"
        descrizione: "I montanti reggono, ma le braccia devono fare tutto."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Sui montanti
          testo: |
            Sali dai montanti a forza di braccia fino all'ultimo piano, dove chi
            batte sta ai piedi del disco nero.
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: La scala marcia
          testo: |
            Ti fidi di una scala per un piano solo, e la scala si piega come carta
            bagnata facendoti cadere sul piano di sotto.
          effetti: { ferite: 1 }
      - testo: "Aggirare la canna dal lato dei colpi"
        descrizione: "Il lato dei colpi ha un passaggio che chi batte usa ogni giorno."
        prova: { attributo: mentale, abilita: percezione, difficolta: Molto difficile }
        successo:
          titolo: Il passaggio usato
          testo: |
            Giri verso i colpi e trovi una rampa di ferro lucidata dall'uso, che
            porta a un ripiano largo dove chi batte ti volta le spalle.
          pe: { percezione: 3 }
          effetti: { profondita.campana-canne: 1 }
        fallimento:
          titolo: Il lato sbagliato
          testo: |
            Giri dalla parte sbagliata, e un pezzo di impalcatura si stacca e ti
            pesta una spalla prima che tu capisca da dove vengono i colpi.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Salire le scale marce, una dopo l'altra"
        descrizione: "Tre rintocchi di salita sulle scale che cedono, aggrappandoti a quello che c'è."
        costo: 3
        esito:
          titolo: Le scale che cedono
          testo: |
            Le scale cedono una dopo l'altra e ti aggrappi a quello che resta,
            fino in cima, con le mani spellate.
          effetti: { profondita.campana-canne: 1, ferite: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · l'Accordatore
  - id: campana-canne-l-accordatore
    immagine: bestiario/salvaguardia-precursori
    titolo: L'Accordatore
    sommario: "Ai piedi del disco nero, una macchina su sei zampe accorda le canne sulla nota che fa più male."
    luogo: Le canne, il ripiano della canna maestra
    area: campana-canne
    requisiti: [campana.strato == 1, profondita.campana-canne >= 5]
    testo: |
      Il ripiano gira intorno alla canna maestra come un ballatoio. Davanti al disco
      nero c'è una macchina alta quanto le canne più basse, su sei zampe piantate nel
      ferro come chiodi, con le braccia che finiscono in martelli fasciati di
      qualcosa che un tempo era feltro. Batte il disco e ascolta. A ogni colpo la
      foresta risponde con una nota più alta e più dolorosa della precedente.

      {tecnologia Difficile} Ogni zampa ha un freno, per stare ferma mentre batte. Se
      i freni si chiudono tutti insieme, la macchina resta piantata dov'è.

      {espressivita Media} Sta cercando una nota, ogni colpo un poco più in alto,
      come un musicista che ha perso il la e non si arrende.

      Accanto alle zampe gli operatori hanno lasciato i loro attrezzi, fra cui
      un'asta con nove tacche. *Qui qualcuno decideva quale nota fosse giusta.* La
      macchina smette di battere e gira verso di te la testa piatta, con i martelli
      alzati.
    opzioni:
      - testo: "Affrontare l'Accordatore"
        descrizione: "Martelli pesanti e una nota che ti cerca la testa, ma si muove poco."
        combattimento: campana-l-accordatore
        vittoria:
          immagine: icone/bell-shield
          titolo: La Sordina
          testo: |
            L'ultima zampa si piega, e l'Accordatore cade contro il disco nero con
            un colpo che fa tacere la foresta. Stacchi il disco dalla canna
            maestra, ormai muta. È leggero e non suona quando lo batti, e te lo
            leghi al braccio con due cinghie di cuoio.

            Dietro la canna una scala scende verso una luce grigia.
          pe: { armi-da-mischia: 5, resilienza: 5 }
          imposta: { campana.strato: 2 }
          effetti: { oggetto.campana-la-sordina: 1, parte.camera-3: 1, reliquie.meccanismo-spento: 1 }
          vai: campana-coro
        sconfitta:
          titolo: La nota più alta
          testo: |
            I martelli ti prendono alla schiena e alla testa. Ti risvegli sulla
            spiaggia ai piedi della Ripamuta con le orecchie che sanguinano, e le
            canne sono ancora tutte da attraversare.
          effetti: { tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Cantare la nota della Costola al disco"
        descrizione: "La nota della Costola è quella che l'Accordatore ha perso."
        requisiti: [misura.costola >= 1]
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Difficile }
        successo:
          immagine: icone/bell-shield
          titolo: Il la ritrovato
          testo: |
            Appoggi la bocca al disco nero mentre i martelli scendono e canti la nota della Costola con tutta la gola. L'Accordatore si ferma con i
            martelli a mezz'aria, poi ripete piano la nota sul disco e si accuccia come un vecchio che si siede.

            Stacchi il disco dalla canna maestra e te lo leghi al braccio con due cinghie. Dietro la canna una scala scende verso una luce grigia.
          pe: { espressivita: 5, resilienza: 5 }
          imposta: { campana.strato: 2 }
          effetti: { oggetto.campana-la-sordina: 1, parte.camera-3: 1, reliquie.meccanismo-spento: 1 }
          vai: campana-coro
        fallimento:
          titolo: La nota sbagliata
          testo: |
            Attacchi la nota un attimo dopo il martello, e l'Accordatore ti batte con molta attenzione, come una canna
            stonata. Ti risvegli sulla spiaggia ai piedi della Ripamuta, con le canne da rifare.
          effetti: { ferite: 2, tormento: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Chiudere i freni delle sei zampe"
        descrizione: "Un freno per zampa, comandati da una leva sotto il ventre."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          immagine: icone/bell-shield
          titolo: Le sei zampe
          testo: |
            Ti butti sotto il ventre della macchina fra un colpo e l'altro e tiri
            la leva dei freni. Le sei zampe si piantano nel ferro, e l'Accordatore
            resta lì a battere l'aria.

            Stacchi il disco dalla canna maestra e te lo leghi al braccio con due
            cinghie. Dietro la canna una scala scende verso una luce grigia.
          pe: { tecnologia: 5, resilienza: 5 }
