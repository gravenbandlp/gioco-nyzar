negozi:
  - id: banco-di-grusk
    immagine: personaggi/grusk
    nome: Il banco di Grusk
    testo: "Grusk pesa la merce su una bilancia storta e non chiede da dove viene. Paga poco, però subito."
    compra:
      - { quality: informazioni.voce, prezzo: 1 }
      - { quality: informazioni.pettegolezzo, prezzo: 5 }
      - { quality: informazioni.segreto, prezzo: 25 }
      - { quality: cristalli.frammento-esausto, prezzo: 1 }
      - { quality: cristalli.cristallo-sterile, prezzo: 5 }
      - { quality: reliquie.scheggia, prezzo: 1 }
      - { quality: reliquie.frammento-inciso, prezzo: 5 }

  - id: dispensa-di-gramm
    immagine: ambientazione/dispensa-di-gramm
    nome: La Dispensa di Gramm
    testo: "Dalla porta principale la Dispensa di Gramm vende erbe e infusi, ma alcuni clienti preferiscono entrare dal vicolo sul retro. Chi sta al banco ti guarda prima le mani, e solo dopo la faccia."
    vende:
      - { quality: bende, prezzo: 10 }
      - { quality: tonico, prezzo: 30 }
      - { quality: unguento, prezzo: 25 }
      - { quality: estratto-di-energia, prezzo: 60 }

  - id: armeria-di-irsa
    immagine: ambientazione/armeria-di-irsa
    nome: Armeria di Irsa
    testo: "«Prima ti guardo. Poi ti vendo.» Irsa Valbrun non ha una forgia, e le armi che vende le assembla con il metallo grezzo di Bram Halgast e il cuoio della Conceria Kasselt."
    vende:
      - { quality: oggetto.pugnale, prezzo: 10 }
      - { quality: oggetto.spada-corta, prezzo: 30 }
      - { quality: oggetto.mazza, prezzo: 40 }
      - { quality: oggetto.spada-lunga, prezzo: 60 }
      - { quality: oggetto.giaco-imbottito, prezzo: 15 }
      - { quality: oggetto.cuoio-rinforzato, prezzo: 50 }
      - { quality: oggetto.cotta-di-maglia, prezzo: 150 }
      - { quality: oggetto.lancia, prezzo: 25 }
      - { quality: oggetto.coltelli-da-lancio, prezzo: 15 }
      - { quality: oggetto.arco-corto, prezzo: 30 }
      - { quality: oggetto.balestra-leggera, prezzo: 60 }
      - { quality: oggetto.scudo, prezzo: 20 }
      - { quality: oggetto.scudo-pesante, prezzo: 60 }

  - id: fucina-dei-due-mastini
    nome: La Fucina dei Due Mastini
    immagine: ambientazione/fucina-dei-due-mastini
    testo: "Bram Halgast firma il suo lavoro con un martello di pietra inciso. Vende armi pesanti a chi ha le braccia per portarle."
    vende:
      - { quality: oggetto.ascia-da-battaglia, prezzo: 50 }
      - { quality: oggetto.ascia-bipenne, prezzo: 100 }
      - { quality: oggetto.martello-da-guerra, prezzo: 110 }
      - { quality: oggetto.spadone, prezzo: 120 }
      - { quality: oggetto.balestra-pesante, prezzo: 150 }
      - { quality: oggetto.armatura-a-piastre, prezzo: 400 }

  - id: nodo-d-ossidiana
    nome: Il Nodo d'Ossidiana
    immagine: ambientazione/nodo-d-ossidiana
    testo: "La bottega di Ambrin Qell al Mercato dei Nodi. Un corvo sul bancone tiene d'occhio chi entra. «Entra. Lasciati cercare prima di cercare tu.»"
    compra:
      - { quality: bottino.simbolo-del-grande-albero, prezzo: 100 }
      - { quality: bottino.collana-d-oro, prezzo: 60 }
      - { quality: bottino.tunica-di-seta, prezzo: 150 }
      - { quality: bottino.parti-di-drone, prezzo: 40 }
      - { quality: cristalli.frammento-esausto, prezzo: 1 }
      - { quality: cristalli.cristallo-sterile, prezzo: 5 }
      - { quality: cristalli.cristallo-sterile, prezzo: 6, requisiti: [rep.nodo >= 3] }
      - { quality: cristalli.cristallo-sterile, prezzo: 7, requisiti: [rep.nodo >= 7] }
      - { quality: cristalli.cristallo-carico, prezzo: 25 }
      - { quality: cristalli.cristallo-carico, prezzo: 30, requisiti: [rep.nodo >= 3] }
      - { quality: cristalli.cristallo-carico, prezzo: 35, requisiti: [rep.nodo >= 7] }
    vende:
      - { quality: estratto-di-energia, prezzo: 60 }
      - { quality: cella, prezzo: 300 }

  - id: emporio-tamberlo
    nome: L'Emporio Tamberlo
    immagine: ambientazione/emporio-generale
    testo: "Oddo Tamberlo vende un po' di tutto, dai finimenti alle zappe, e conta il resto due volte. Sul bancone c'è sempre una torta di Berta sotto una campana di vetro, e non è in vendita."
    # Con topi >= 2 Oddo non ti fa entrare (piste/topi.yaml), e la bottega resta chiusa anche dal bazar dell'area.
    vende:
      - { quality: bende, prezzo: 8, requisiti: [topi < 2] }
      - { quality: unguento, prezzo: 22, requisiti: [topi < 2] }
      - { quality: oggetto.pugnale, prezzo: 10, requisiti: [topi < 2] }
      - { quality: oggetto.giaco-imbottito, prezzo: 14, requisiti: [topi < 2] }
      - { quality: oggetto.scudo, prezzo: 18, requisiti: [topi < 2] }
