# Capomozzo, i sotterranei (pista.capomozzo 3 → 4): il livello I sotto la fortezza di Balthog, scavato nei
# primi anni dopo la Caduta dal culto di Nhar'Kael (verbale D1–D15). Ci arrivano due scale, la spirale della
# chiesa e quella dietro il trono di Balthog: l'area non dice da quale si scende.
#
# - `verso-i-sotterranei-di-capomozzo` (pista 3, ripetibile, Scuderie della Zanna Rotta): il rientro dopo una
#   ritirata. Sta in città come quelli di capomozzo-forte e capomozzo-cuore, perché la ritirata riporta in
#   Città Bassa e da lì la fortezza a pista 3 non si raggiunge.
# - area `sotto-capomozzo`: sei stanze ripetibili (D1, D4, D7, D9–D10, D11–D12, D14), in ordine secondo la
#   profondità: 0 la sala dei banchetti o il corridoio degli alloggi, 1 la prigione (la porta col lucchetto),
#   2 il terreno di caccia o la cappella, 3 la sala della guerra, accanto alla sala della ricerca del cuore.
#   Una stanza superata non ricompare nella stessa visita (src/motore/spedizioni.ts).
# - storie non ripetibili: i cuccioli (D3, `cuccioli`), la tana del Pungitore con il corpo di Druzk (D8, dopo
#   il terreno di caccia: la prigione azzera `capomozzo.caccia`, il terreno di caccia lo porta a 1),
#   Zagrath nell'harem (D2, facoltativa), Isvaro negli alloggi (D4a, solo con isvaro 1), gli alloggi di
#   Aurenne (D5, dà il diario ed è richiesta dal cuore).
# - cuore `garin-e-kessa` (D15): in ogni ramo pista.capomozzo 4 e giù per la scala verso il livello II.
# - `la-guerra-privata` (Grifone): chi ha battuto Zagrath lo racconta a Ilvaena.
quality:
  - { id: capomozzo.zagrath, nome: Zagrath nell'harem, categoria: stato, nascosta: true, descrizione: "1 battuto e fuggito, 2 evitato o andato male." }
  - { id: capomozzo.ilvaena, nome: Hai raccontato Zagrath a Ilvaena, categoria: stato, nascosta: true }
  - { id: capomozzo.druzk, nome: Il corpo di Druzk, categoria: stato, nascosta: true, descrizione: "Hai preso le cose di Druzk, chiavi comprese." }
  - { id: capomozzo.isvaro, nome: Hai trovato Isvaro a Capomozzo, categoria: stato, nascosta: true }
  - { id: capomozzo.alloggi, nome: Gli alloggi di Aurenne, categoria: stato, nascosta: true }
  - { id: capomozzo.caccia, nome: Hai attraversato il terreno di caccia, categoria: stato, nascosta: true, descrizione: "1 se in questa visita sei passato dal terreno di caccia e non dalla cappella, perché la tana del Pungitore sta dietro la tenda di liane. La prigione lo azzera." }

aree:
  - id: sotto-capomozzo
    immagine: ambientazione/capomozzo
    nome: I sotterranei di Capomozzo
    sommario: "Sotto la fortezza di Balthog c'è un livello scavato nella roccia da un culto, nei primi anni dopo la Caduta. Gli orchi ci hanno appeso le lanterne, e qualcuno ci abita ancora."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      In fondo alla scala c'è un corridoio basso che sa di grasso vecchio, e poco
      più in là ci sbocca un'altra scala scavata nella roccia, che sale verso la
      fortezza. Il soffitto passa a un palmo dalla tua testa. Questo livello l'ha
      scavato a colpi di scalpello, senza nessuna fretta, il culto che nei primi
      anni dopo la Caduta si era rifugiato sull'isola, e gli orchi ci hanno
      piantato nei muri dei ganci di ferro storti per appenderci le lanterne. A
      ogni gancio è annodato un nastrino bianco, e a quest'ora è accesa una
      lanterna su tre.

      Le porte sono di assi inchiodate alla meglio, e nessuna chiude bene. Da nord
      arriva il colpo regolare delle onde contro la roccia, e dal fondo di un
      corridoio una risata roca di donna che si interrompe di colpo. Ti accorgi
      che cammini sul bordo delle suole per non fare rumore, e la lingua ti si
      secca contro il palato.

storylet:
  # ------------------------------------------------------------ 3 · il rientro dopo una ritirata
  - id: verso-i-sotterranei-di-capomozzo
    presso: scuderie-della-zanna-rotta
    immagine: ambientazione/scuderie-della-zanna-rotta
    titolo: Di nuovo verso Capomozzo
    sommario: "Sotto la fortezza di Balthog, in fondo alla scala nella roccia, le lanterne degli orchi sono ancora accese."
    luogo: Città Bassa, Scuderie della Zanna Rotta
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.capomozzo == 3]
    testo: |
      Dolovan Stroud è seduto su un secchio rovesciato davanti alle Scuderie e
      ingrassa una sella con un pezzo di stoffa, a cerchi lenti, sempre nello
      stesso verso. Accanto a lui Squash, il suo cavallo da guerra, mangia la
      paglia del box vicino attraverso le sbarre, e nessuno dei due sembra
      preoccuparsene. Quando gli dici dove torni, Dolovan non alza la testa.

      {cavalcare Media} Squash mangia dal box del vicino perché sa di poterlo
      fare. È un cavallo che è stato in guerra ed è tornato, e da allora la
      paglia degli altri gli spetta di diritto.

      «Prima la fortezza e adesso ci vai sotto» dice. «Alla prossima mi racconti
      che scavi.» Passa la stoffa su un'impuntura scucita e ci si ferma sopra con
      il pollice, come su una ferita vecchia. «Il prezzo è sempre quello. Gli
      orchi non sono diventati più simpatici.»

      Ti fanno già male i polpacci, a pensare alla strada. Sono due giorni e mezzo
      fino alla costa e al ponte di corda, e poi c'è la scala che gira dentro la
      roccia fino alle lanterne.

      {resistenza Facile fallita} I polpacci si ricordano dell'ultima volta
      meglio di te, e cominciano a lamentarsi già qui, sul selciato delle
      Scuderie, con tutta la strada ancora da fare.
    opzioni:
      - testo: "Partire a piedi"
        descrizione: "Due giorni e mezzo, e le gambe la strada se la ricordano."
        esito:
          titolo: A piedi
          testo: |
            Parti all'alba e cammini due giorni e mezzo, prima fra le colline e poi
            lungo la costa, con il sale che ti si secca sulle labbra e una
            vescica nuova che nasce sul tallone il secondo giorno. Il roveto ti
            lascia passare dalla solita stuoia di rami, e il ponte di corda lo
            attraversi guardando le assi e mai le onde. Nella fortezza tieni la testa
            bassa fino alla scala nella roccia, e scendi i suoi tre giri con la mano
            sinistra sulla parete, contando i nastrini bianchi.
          vai: sotto-capomozzo
      - testo: "Andare a cavallo"
        descrizione: "A cavallo la costa arriva un giorno prima."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il pino storto
          testo: |
            A cavallo la costa arriva un giorno prima. Lo lasci legato al pino storto
            davanti al roveto, con una bracciata d'erba davanti e una pacca sul
            collo che ti serve più che a lui, e il resto lo fai
            a piedi, dal tunnel di cardi fino al ponte e poi su per l'isola. La scala
            nella roccia ti aspetta con una lanterna accesa ogni tre, e scendi tenendoti
            al muro.
          vai: sotto-capomozzo
      - testo: "Affittare un cavallo da Dolovan"
        descrizione: "Il prezzo è sempre quello."
        requisiti: [monete >= 10]
        costo: 0
        esito:
          titolo: Non Squash
          testo: |
            Dolovan conta le monete senza guardarle e ti indica con il mento il pezzato
            del box in fondo. «Non Squash» dice. «Squash agli orchi non lo porto più.»
            Il pezzato è lento e testardo, e a ogni ponticello si ferma a pensarci,
            ma la costa arriva un giorno prima. Lo leghi al pino storto davanti al
            roveto e prosegui a piedi fino alla scala nella roccia, e da lì giù, fra
            i nastrini bianchi.
          effetti: { monete: -10 }
          vai: sotto-capomozzo

  # ------------------------------------------------------------ le stanze (ripetibili, tre a caso)
  - id: sotto-la-sala-dei-banchetti
    immagine: bestiario/orco
    titolo: La sala dei banchetti
    sommario: "Sei porte storte su una sala bassa, e un vecchio orco che accende le lanterne contandole sulle dita."
    luogo: Sotterranei di Capomozzo, la sala dei banchetti
    area: sotto-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo == 0]
    testo: |
      In fondo alla scala c'è una sala lunga e bassa, con un tavolo di pietra
      tagliato nella roccia e i sedili consumati nel mezzo, dove i cultisti si
      sedevano più spesso. Gli orchi ci hanno buttato sopra dei tappeti di pelo di
      cinghiale, che adesso marciscono ammucchiati in un angolo. Sulla sala si
      aprono sei porte di legno inchiodate alla meglio, tutte un po' storte.

      Fra le porte si muove un orco vecchio e curvo che porta una pertica e un
      secchio d'olio. Accende una lanterna e si ferma a contarle sulle dita, e
      ogni volta ricomincia da capo, perché alla mano sinistra gli manca il
      mignolo. Fra te e la porta che ti serve ci sono tre lanterne, e lui sta
      andando da quella parte.

      {empatia Media} Ricomincia da capo senza arrabbiarsi mai. Qualcuno gli ha
      lasciato questo lavoro perché nessun altro lo voleva, e lui lo fa con
      scrupolo, perché ha paura di perderlo.

      {furtivita Media} Quando conta si guarda le dita, e per tutto quel
      tempo la sala alle sue spalle smette di esistere. Più si avvicina al
      mignolo, più a lungo la guarda.
    opzioni:
      - testo: "Passargli alle spalle"
        descrizione: "È vecchio, e quando conta si guarda le dita."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il mignolo
          testo: |
            Aspetti che arrivi alla quarta lanterna, quella dove sbaglia sempre. Mentre
            lui si guarda la mano sinistra e muove le labbra, passi rasente il muro
            opposto con gli stivali che sfiorano appena la pietra. Dalla soglia ti volti
            a guardarlo. Ha ricominciato da uno, e sta accendendo di nuovo la prima
            lanterna, che era già accesa, con la stessa cura della prima volta.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: La pertica
          testo: |
            A metà strada un tappo di sughero ti scricchiola sotto la suola. Il vecchio
            si gira più in fretta di quanto ti aspettassi e ti cala la pertica sulla
            spalla due volte, gridando in orchesco qualcosa che suona più come un
            rimprovero che come un allarme. Torni di corsa in fondo alla scala con la
            spalla che pulsa, e lui ricomincia a contare. Ti tocca ammettere che
            per un vecchio con una pertica ha un polso notevole.
          effetti: { ferite: 0.5 }
      - testo: "Fargli credere di essere uno degli ospiti"
        descrizione: "Gli ospiti di quaggiù sono umani, e al buio inciampano. Lui è abituato a fargli luce."
        prova: { attributo: sociale, abilita: [ingannare, persuasione, galateo], difficolta: Media }
        successo:
          titolo: La luce per l'ospite
          testo: |
            Gli vai incontro senza nasconderti e gli chiedi in tono seccato perché il
            corridoio sia al buio. Il vecchio abbassa la testa e borbotta delle scuse.
            Poi ti accompagna fino alla porta tenendo alta la pertica con la lanterna
            appesa in cima, perché tu veda dove metti i piedi. Sulla soglia aspetta
            una mancia che non arriva, e torna alle sue lanterne senza offendersi.
            Ti dispiace un poco, e la mano ti va alla tasca quando lui è già
            lontano.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: L'odore
          testo: |
            Ti avvicini parlando forte, e il vecchio ti annusa da tre passi con la testa
            inclinata, le narici larghe che si aprono e si chiudono. Poi scuote la testa e dice in un comune pieno di sassi «tu non
            puzzi di sotto». Si mette a gridare verso le porte, e tu torni in fondo alla
            scala con le spalle contro il muro, ad aspettare che qualcuno gli dica di
            stare zitto.
          effetti: { tormento: 0.5 }
      - testo: "Chiudere gli sportelli delle lanterne"
        descrizione: "Se le lanterne gli si spengono alle spalle, dovrà tornare indietro a riaccenderle."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il conto che non torna
          testo: |
            Gli sportelli di latta scorrono in una guida unta, e basta un dito, con
            un fruscio che sembra una cosa da niente anche a te. Chiudi
            le due lanterne più lontane mentre lui ti dà la schiena. Il vecchio si volta
            e vede il buio dove aveva appena acceso. Si guarda le dita con aria offesa e
            torna indietro a riaccenderle, e la strada fino alla porta resta libera per
            il tempo che ti serve.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: La latta calda
          testo: |
            Lo sportello della seconda lanterna è rovente e si incastra a metà, e le
            dita lo capiscono un attimo dopo di quanto avrebbero dovuto. Quando
            lo tiri ti bruci i polpastrelli, e la latta sbatte con un rumore che
            rimbomba per tutta la sala. Il vecchio arriva con la pertica alzata, e tu ti
            ritiri in fondo alla scala soffiandoti sulle dita. Dall'ultimo gradino lo
            senti borbottare mentre riapre lo sportello e ricomincia il conto da capo, a
            voce più alta di prima.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare in fondo alla scala che finisca il giro"
        descrizione: "Prima o poi le lanterne finiscono. Lui, a giudicare da come conta, forse no."
        costo: 2
        esito:
          titolo: Seduto sul gradino
          testo: |
            Ti siedi sull'ultimo gradino al buio e lo guardi fare il giro delle
            lanterne, ricominciando da capo ogni volta che arriva al mignolo che non
            c'è. Ci mette quasi un'ora. A un certo punto ti accorgi che stai contando
            sottovoce anche tu e che sbagli nello stesso punto, pur avendo tutte le
            dita al loro posto. Quando finalmente
            sparisce in un corridoio laterale, attraversi la sala con le gambe
            intorpidite e la testa piena di numeri.
          effetti: { profondita.sotto-capomozzo: 1, tormento: 0.5 }

  - id: sotto-il-corridoio-degli-alloggi
    immagine: ambientazione/capomozzo
    titolo: Il corridoio degli alloggi
    sommario: "Tre stanze da letto lungo un corridoio stretto, e dal fondo arrivano passi pesanti che vanno e vengono."
    luogo: Sotterranei di Capomozzo, gli alloggi
    area: sotto-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo == 0]
    testo: |
      Il corridoio è stretto, con tre porte sullo stesso lato e una lanterna sola
      in fondo. Nella prima stanza c'è un letto di buona fattura con gli angoli
      delle coperte tirati, e sul comò una pila di carte ferma sotto una scheggia
      d'ossidiana. La seconda ha il letto sfatto, e sul comodino un piatto di pane
      e salmone affumicato mangiato a metà ha cominciato a fare la muffa. Ai piedi
      del letto, sopra un mucchio di camicie da uomo, ci sono due maschere bianche
      lisce, senza tratti. Nella terza stanza le coperte sono piene di peli grigi
      e neri a chiazze, e accanto al letto qualcuno ha ammucchiato decine di zampe
      d'uccello con gli artigli all'insù.

      {percezione Media} La calligrafia sulle carte è minuta e pende tutta a
      destra. L'hai già vista da qualche parte, ed è di quelle che si
      ricordano.

      Dal fondo del corridoio arrivano passi pesanti. Si avvicinano fino alla
      lanterna e lì si fermano un momento prima di tornare indietro.

      {furtivita Facile} I passi vanno e vengono sempre allo stesso ritmo. Fra
      un giro e l'altro c'è il tempo di entrare in una stanza sola.
    opzioni:
      - testo: "Leggere le carte sotto l'ossidiana"
        descrizione: "Una calligrafia minuta che pende tutta a destra. L'hai già vista."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le brutte copie
          testo: |
            Sono brutte copie di lettere, tutte allo stesso destinatario. Ognuna
            comincia con *Padre*, e la riga dopo è cancellata con tanta forza da bucare
            la carta. In quella che è andata più avanti Isvaro chiede le chiavi
            dell'Acciaieria, e in cambio promette di tacere sulla morte della madre.

            {empatia Media} Le righe cancellate sono tutte la seconda, quella
            dopo *Padre*. Ogni volta c'era qualcosa che voleva dire prima del
            ricatto, e ogni volta ha cambiato idea.

            Rimetti le carte sotto l'ossidiana nello stesso ordine e passi oltre prima
            che tornino i passi.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: Sotto il letto
          testo: |
            Le carte sono tante e la calligrafia è fitta, e quando alzi la testa i passi
            sono già alla porta. Ti butti sotto il letto e ci resti con la guancia sulla
            pietra, mentre un paio di piedi d'orco nudi si fermano a un braccio dalla
            tua faccia e ci restano a lungo, con le unghie gialle e un callo sul
            mignolo che non dimenticherai. Quando se ne vanno hai le dita intorpidite
            e un foglio stropicciato in mano, e non ricordi di averlo preso.
          effetti: { tormento: 0.5 }
      - testo: "Mettere una delle maschere bianche"
        descrizione: "Gli orchi hanno visto scendere parecchi mascherati, e non li hanno visti risalire. Forse le maschere gli fanno ancora paura."
        prova: { attributo: sociale, abilita: [ingannare, intimidire, espressivita], difficolta: Media }
        successo:
          titolo: Il mascherato
          testo: |
            La maschera sa di sudore vecchio, e i buchi degli occhi sono un po' troppo
            larghi. Esci nel corridoio e vai incontro ai passi. L'orco che arriva è
            giovane, con una lancia più alta di lui, e quando ti vede si appiattisce
            contro il muro e abbassa gli occhi fino a terra. Gli passi davanti senza
            fretta, e lui resta fermo come un attaccapanni finché non sei passato. Dopo l'angolo ti
            togli la maschera e la appendi a un gancio, perché addosso non la vuoi
            più, e ti strofini la faccia con la manica fino a farla bruciare.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: I mascherati
          testo: |
            L'orco che arriva si ferma e ti guarda a lungo con la testa piegata. «I
            mascherati sono tutti giù» dice in un comune spezzato, «e da giù non torna
            nessuno.» Poi ti viene addosso con la lancia. Scappi strappandoti la
            maschera dalla faccia, e la punta della lancia ti apre la manica e un po' di
            braccio prima che tu giri l'angolo. La maschera ti resta in mano, e la
            butti via come se scottasse.
          effetti: { ferite: 0.5 }
      - testo: "Chiuderti nella stanza delle zampe d'uccello"
        descrizione: "È quella che puzza di più. Ci entra soltanto chi è costretto."
        costo: 2
        esito:
          titolo: Le zampe
          testo: |
            Ti chiudi dentro con la schiena contro la porta e respiri attraverso la
            manica. I passi arrivano e si fermano proprio qui fuori, e qualcuno annusa
            forte, due volte, prima di andarsene. Resti un pezzo al buio fra le zampe
            d'uccello, che a guardarle bene sono tutte zampe sinistre, e quando esci
            l'odore di muffa ti viene dietro per tre corridoi.

            {accademiche Difficile fallita} Da qualche parte hai letto che cosa
            significa una collezione di zampe sinistre. Del libro ricordi soltanto
            che aveva la copertina verde.
          effetti: { profondita.sotto-capomozzo: 1, tormento: 0.5 }

  - id: sotto-il-terreno-di-caccia
    immagine: ambientazione/marea-grigia
    titolo: Il terreno di caccia
    sommario: "Una caverna dal pavimento liscio come un ciottolo, una tenda di liane sul mare e una cosa a forma di cono che ti aspetta."
    luogo: Sotterranei di Capomozzo, la caverna sul mare
    area: sotto-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo == 2]
    testo: |
      Il corridoio sbocca in una caverna naturale, umida, che a est finisce in una
      grande apertura sul mare coperta da una tenda di liane. Il pavimento è
      liscio come un ciottolo di fiume, levigato da qualcosa che ci striscia sopra
      da anni, e gli stivali ci scivolano. Su una trave piantata all'imbocco
      qualcuno ha scritto col carbone, in una calligrafia minuta che pende a
      destra, *Pungitore*, e sotto *non entrare*.

      {acrobazia Media fallita} Il pavimento è liscio come un ciottolo, e i tuoi
      stivali lo hanno capito prima di te. Resti in piedi più per orgoglio che
      per equilibrio.

      Fra le liane si muove una forma conica alta quanto un uomo, del colore
      dell'acqua profonda verso sera. Sulla sua superficie si accendono uno dopo
      l'altro decine di piccoli occhi rossi, e due tentacoli lunghi si srotolano
      sul pavimento verso di te. Uno finisce in un pungiglione e l'altro in un
      grumo lucido che si apre e si chiude.

      {natura Media} Per terra ci sono penne di gabbiano, tutte strappate dal
      lato delle ali. Una cosa che caccia uccelli guarda quello che si muove in
      fretta, e il resto lo lascia stare.

      {origine figlio-del-circolo} Al Circolo ti hanno insegnato ad ascoltare
      una bestia prima di guardarla. Questa non respira, o lo fa così piano
      che il mare la copre, e la cosa ti mette addosso un freddo che con
      l'umidità della caverna non c'entra.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "Ha due tentacoli e decine di occhi. Il corpo però sta fermo, e un corpo fermo si colpisce."
        combattimento: pungitore
        vittoria:
          titolo: Il cono vuoto
          testo: |
            Il pungiglione ti cerca la faccia e il grumo ti cerca le gambe, e tu resti
            in mezzo finché non trovi la giuntura dove i tentacoli entrano nel corpo. Lì
            il metallo è sottile. Il colpo la apre, e dal cono esce un liquido scuro che
            puzza di olio di pesce. Gli occhi rossi si spengono a uno a uno, dal basso
            verso l'alto, e la forma si affloscia fra le liane come un otre vuoto. Ti
            pulisci le mani sui calzoni, e l'odore resta lo stesso.
          imposta: { capomozzo.caccia: 1 }
          effetti: { profondita.sotto-capomozzo: 1 }
        sconfitta:
          titolo: Il grumo
          testo: |
            Il grumo ti si attacca al polpaccio e comincia a tirare, e senti la gamba
            farsi fredda dal ginocchio in giù, come se ci stesse bevendo dentro. Lo
            tagli via con tre colpi e scappi nel corridoio zoppicando. Il cono non ti segue. Torna fra le liane, e i suoi
            occhi si spengono a uno a uno mentre aspetta il prossimo gabbiano.
      - testo: "Correre lungo la parete, fra le liane"
        descrizione: "Lungo il bordo la roccia è ruvida, e le liane forse reggono un uomo."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Le liane
          testo: |
            Ti aggrappi alle liane e corri lungo la parete con i piedi sulla roccia del
            bordo, dove il cono non ha levigato niente. Il pungiglione colpisce una
            volta nel punto dov'eri un momento prima e strappa un ciuffo di foglie.
            Dall'altra parte salti giù nel corridoio e ti volti, e lui sta ancora
            guardando il punto sbagliato con tutti i suoi occhi. Hai le mani verdi
            di linfa e un sorriso che non riesci a toglierti.
          imposta: { capomozzo.caccia: 1 }
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: Il pavimento liscio
          testo: |
            A metà una liana si stacca, e finisci sul pavimento liscio e scivoli verso
            il centro senza poterti fermare. Il pungiglione ti prende alla spalla. Il
            veleno brucia come aceto in una ferita, e ti trascini fuori dalla caverna
            con le unghie sulla pietra finché il pavimento torna ruvido sotto le dita.
            Nel corridoio ti tasti la spalla, che sotto la camicia è già gonfia e
            scotta al tatto.

            {medicina Media} Il veleno resta dove è entrato e non sale verso il
            collo. Farà male per un giorno, e poi passerà, se non ci metti le mani.
          effetti: { ferite: 0.5 }
      - testo: "Capire come caccia"
        descrizione: "Per terra ci sono penne di gabbiano. Una cosa che caccia uccelli guarda quello che si muove."
        prova: { attributo: mentale, abilita: [natura, tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il mantello
          testo: |
            Lo osservi a lungo da dietro lo spigolo. Gli occhi si accendono soltanto
            verso quello che si muove in fretta. Sfili il mantello e lo butti verso
            l'apertura, dove il vento del mare lo prende e lo fa sbattere fra le liane.
            Il cono ci si avventa con tutti e due i tentacoli, e tu attraversi la
            caverna a passo lento, quasi in punta di piedi, e il mantello glielo lasci.
            Era un buon mantello, e quaggiù hai trovato il primo che l'abbia
            apprezzato davvero.
          imposta: { capomozzo.caccia: 1 }
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: Troppo lento
          testo: |
            Ti muovi piano, convinto che guardi soltanto quello che corre, e ti sbagli.
            Gli occhi rossi si girano verso di te tutti insieme, e il pungiglione ti
            sfiora il collo con un ronzio d'ape. Ti ritiri nel corridoio con il cuore in
            gola e una riga di fuoco sotto l'orecchio che non smette di pulsare. Le
            penne di gabbiano per terra, adesso, ti sembrano molto meno pittoresche.
          effetti: { ferite: 0.5 }
      - testo: "Passare di corsa e lasciarti pungere"
        descrizione: "La caverna è larga venti passi. Il pungiglione arriva una volta, forse due."
        costo: 2
        esito:
          titolo: Venti passi
          testo: |
            Conti fino a tre due volte, perché la prima non ti convince, e attraversi
            di corsa, con le braccia sopra la testa e gli
            stivali che slittano sulla pietra liscia. Il pungiglione ti prende due volte
            alla schiena, e il grumo ti sfiora una caviglia senza riuscire ad
            attaccarsi. Dall'altra parte ti appoggi al muro e aspetti che il bruciore
            della schiena diventi sopportabile, contando con le dita i buchi nuovi nella
            camicia.
          imposta: { capomozzo.caccia: 1 }
          effetti: { profondita.sotto-capomozzo: 1, ferite: 0.5 }

  - id: sotto-la-prigione
    immagine: fazioni/tribu-capomozzo
    titolo: La prigione
    sommario: "Sei celle con le porte di ferro, una gabbia di spuntoni sopra un braciere freddo e una porta chiusa con un lucchetto grosso come un pugno."
    luogo: Sotterranei di Capomozzo, la prigione
    area: sotto-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo == 1]
    testo: |
      La prigione occupa una stanza lunga. Sul lato sud ci sono sei celle con le
      porte di ferro aperte, e sui muri delle celle i prigionieri hanno contato i
      giorni a tacche, cinque alla volta con la sbarra di traverso. Dal soffitto
      pende una gabbia irta di spuntoni sopra un braciere freddo, e contro la
      parete nord c'è una vergine di ferro con lo sportello socchiuso. Oltre un
      arco basso si vede la tana del carceriere, un nido di stracci e di pelli di
      cinghiale accanto a un bancone con gli attrezzi appesi in ordine, ciascuno
      al suo chiodo. Sul piano del bancone qualcuno ha inciso a punta di coltello
      un nome in lettere comuni e storte, *Druzk*, fra due chiazze lucide
      dove il legno è stato consumato dai gomiti.

      {empatia Media} Chi ha inciso quel nome ha imparato a scrivere tardi e
      soltanto quello. Ci passava le sere chino sopra, con i gomiti ai due
      lati, a fare la guardia all'unica parola che sapeva.

      {origine fuggiasco-di-ghoran} Le tacche a cinque con la sbarra di
      traverso le facevi anche tu, sul palo del recinto, con l'unghia del
      pollice. Ti accorgi di averne contate tre file prima di riuscire a
      staccare gli occhi dal muro.

      La porta in fondo è chiusa con un lucchetto grosso come un pugno, e le
      chiavi non sono appese da nessuna parte.

      {rissa Facile} Il lucchetto è robusto, il legno intorno ai cardini molto
      meno. Una spalla decisa sa sempre dove colpire una porta d'orco.
    opzioni:
      - testo: "Aprire il lucchetto con un attrezzo del carceriere"
        descrizione: "Sul bancone c'è un uncino sottile con la punta piegata. È fatto per altri lavori, ma una serratura la apre lo stesso."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: L'uncino
          testo: |
            È un lucchetto d'orco fatto per resistere alle spallate più che alle dita.
            Infili l'uncino e senti le leve una per una, come denti sotto la lingua,
            finché l'ultima cede con uno scatto che ti risale fino al gomito. Prima di andare rimetti l'uncino al suo
            chiodo, perché chi l'ha appeso lì ci teneva. Oltre la porta comincia un
            corridoio basso che puzza di mare, e lo prendi con la lanterna coperta.
          imposta: { capomozzo.caccia: 0 }
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: La punta spezzata
          testo: |
            L'uncino si spezza dentro il lucchetto, e la punta resta incastrata fra le
            leve. Provi a tirarla fuori con le unghie finché ti sanguina un dito.
            Rimetti al suo chiodo il manico dell'uncino rotto, senza sapere bene perché,
            e torni indietro con il dito avvolto in un lembo di camicia. Mentre torni
            verso la sala ti succhi il dito, che sa di ruggine, e ti chiedi se Druzk
            si sarebbe arrabbiato di più per il lucchetto o per l'uncino.
          effetti: { ferite: 0.5 }
      - testo: "Scardinare la porta"
        descrizione: "Il lucchetto è robusto. I cardini li hanno montati gli orchi."
        prova: { attributo: fisico, abilita: [atletica, resistenza, rissa], difficolta: Media }
        successo:
          titolo: I cardini
          testo: |
            I cardini sono fissati con chiodi di nave piantati nel legno marcio. Ci dai
            di spalla tre volte, e alla terza il legno si apre intorno ai chiodi con un
            rumore umido. La porta resta appesa di sbieco al lucchetto, e ci passi sotto
            piegato in due, con la spalla che ti ronza. Quando sei già nel corridoio
            dall'altra parte, il lucchetto intatto dondola ancora sul suo anello, fiero
            di aver fatto il suo dovere.
          imposta: { capomozzo.caccia: 0 }
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: La spalla
          testo: |
            Ci dai di spalla finché la spalla ti manda una fitta fino all'orecchio, e la
            porta si limita a tremare. Il rumore rimbomba per tutte le celle. Ti
            massaggi il braccio sotto la gabbia di spuntoni, in ascolto, con l'eco che
            ti torna dalle sei celle aperte. Poi torni indietro prima di scoprire se
            qualcuno ha sentito, con il braccio stretto al fianco come un'ala rotta.
          effetti: { ferite: 0.5 }
      - testo: "Aprire con le chiavi di Druzk"
        descrizione: "Le hai prese dal collo del carceriere, nella tana del Pungitore. Una dovrebbe essere questa."
        requisiti: [capomozzo.druzk >= 1]
        esito:
          titolo: La chiave giusta
          testo: |
            Provi le chiavi una dopo l'altra, e la settima gira con un rumore pulito, da
            serratura tenuta bene. A giudicare dal grasso, Druzk ungeva il lucchetto
            anche quando di prigionieri non ce n'erano più. Sul bancone, accanto al suo
            nome inciso, c'è un chiodo vuoto della misura giusta. Per un momento pensi
            di appenderci il mazzo, al suo posto. Poi lo rimetti alla cintura, dove
            tintinna a ogni passo come tintinnava a lui.
          imposta: { capomozzo.caccia: 0 }
          effetti: { profondita.sotto-capomozzo: 1 }
      - testo: "Strisciare dal buco nell'ultima cella"
        descrizione: "Nell'ultima cella le tacche sono più fitte, e sotto la branda c'è un buco nel muro."
        costo: 2
        esito:
          titolo: Le tacche
          testo: |
            Nell'ultima cella le tacche arrivano fino al soffitto, e sotto la branda
            qualcuno ha scavato nel muro un buco largo appena una spalla. Ci strisci
            dentro sui gomiti, con la roccia che ti graffia la schiena, e dopo un tempo
            lunghissimo sbuchi in un corridoio dall'altra parte. A metà strada, nel
            buio, la mano ti finisce su un mucchio di ossa piccole. La ritiri
            subito, e continui a strisciare tenendola stretta al petto.

            {resilienza Media} Sono ossa di topo, messe in mucchio con cura da
            chi ha scavato il buco. La domanda di chi le abbia spolpate la
            rimandi a un altro giorno, e continui a strisciare.
          imposta: { capomozzo.caccia: 0 }
          effetti: { profondita.sotto-capomozzo: 1, ferite: 0.5 }

  - id: sotto-la-cappella
    immagine: ambientazione/mito-regina-ali-spezzate
    titolo: La cappella di Nhar'Kael
    sommario: "Una statua di donna gravida con la testa d'uccello, un altare nero coperto di cenere e una trentina di maschere bianche per terra."
    luogo: Sotterranei di Capomozzo, la cappella
    area: sotto-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo == 2]
    testo: |
      Le porte di pietra della cappella sono scolpite con donne gravide di ogni
      razza, e dal loro ventre escono a forza di artigli bestie con le zampe
      snodate. Dentro, due fontane d'acqua scura fanno la schiuma ai lati
      dell'ingresso, e dai bracieri appesi sale un fumo rosso che tinge tutta la
      sala del colore di una ferita. In fondo, su una pedana, c'è la statua di una
      donna di tre metri all'ultimo mese di gravidanza, con la testa d'uccello dal
      becco lungo e tre occhi, e due zampe artigliate al posto dei piedi. Dalle
      scapole le escono due ali spezzate, di piume scolpite che a metà diventano
      lamine di metallo. In ogni mano artigliata tiene un coltello ricurvo. Uno
      brilla di una luce arancione e l'altro di un azzurro freddo.

      {magia Media} I due coltelli brillano di luce propria. Il Mana dentro
      quello arancione è caldo e quello dentro l'azzurro è gelido, e da qui
      tutti e due ti pizzicano i denti.

      Sull'altare nero ai suoi piedi c'è un mucchio di cenere con dentro schegge
      d'osso. Intorno sono sparse per terra una trentina di maschere bianche senza
      tratti. Alcune sono spaccate, altre si sono fuse nel marmo, e una sola è
      ancora intatta e pulita in cima al mucchio. Mentre guardi, una si solleva
      da terra e comincia a girare piano su se stessa.

      {resilienza Media fallita} Il fumo rosso ti entra negli occhi, e per un
      momento la statua ti sembra più vicina di quanto fosse prima. Fai un
      passo indietro e ti vergogni subito di averlo fatto.

      {origine accolito-del-velo} In Cattedrale hai imparato a non chiedere
      cosa c'è sotto l'altare. Questo è il primo altare davanti al quale la
      regola ti sembra un favore, e le labbra cominciano da sole la preghiera
      della sera, quella che Padre Vantes dice dal palco.

      {origine apprendista-raschiatore} Sulle piattaforme, quando uno risale
      dai tunnel e sente voci che non smettono, si fa il nome di Mirn il Sordo
      e poi si cambia discorso. La maschera che gira non fa ancora nessun
      rumore, e tu ti ritrovi a tendere l'orecchio lo stesso.
    opzioni:
      - testo: "Affrontare le ombre dietro le maschere"
        descrizione: "Dietro ogni maschera che si alza prende forma un'ombra. Per ora sono due."
        combattimento: senzavolto
        vittoria:
          titolo: La fibbia
          testo: |
            Colpisci dove dovrebbe esserci una faccia, e il fumo nero si strappa come
            stoffa bagnata. Le maschere cadono una dopo l'altra e si spaccano sul marmo,
            e i sussurri si interrompono a metà parola. Passando accanto all'altare vedi
            luccicare nella cenere una fibbia di bronzo con l'Albero inciso sopra, di
            quelle che chiudono le vesti bianche dei sacerdoti. *La bara di Sollen non
            l'hanno rubata per tenerla.* Ti metti la fibbia in tasca, e mentre
            attraversi la cappella senza voltarti verso la statua la senti fredda
            contro la coscia a ogni passo.
          effetti: { profondita.sotto-capomozzo: 1 }
        sconfitta:
          titolo: I sussurri
          testo: |
            Le ombre fredde ti passano attraverso, e a ogni passaggio ti portano via
            qualcosa di piccolo, il nome di una via della Città Bassa o il sapore del
            pane del mattino. Scappi dalla cappella con le mani sulle orecchie, e nel
            corridoio ti fermi a ripeterti ad alta voce come ti chiami, per sicurezza,
            finché la voce non torna tua. Poi, per scrupolo, ripeti anche il nome
            della via dove abiti, e lo trovi.
      - testo: "Scacciarli con l'esorcismo"
        descrizione: "La Liturgia dell'Albero ha parole per ciò che non dovrebbe restare. Qui non dovrebbe restare niente."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le parole
          testo: |
            Dici le parole della Liturgia, e la voce ti esce più ferma di come ti senti.
            A ogni frase le ombre dietro le maschere si fanno più sottili, finché il
            fumo rosso dei bracieri ci passa attraverso. Le maschere cadono sul marmo
            una dopo l'altra, con il rumore leggero dei piatti impilati. Passi accanto
            all'altare con la testa bassa e non guardi la statua, anche se la nuca
            ti dice che lei sta guardando te.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: Mezza formula
          testo: |
            A metà formula la voce ti si incrina, e il Mana ti torna indietro come uno
            schiaffo dietro gli occhi. Le maschere girano più in fretta e sussurrano
            tutte insieme. Esci dalla cappella camminando all'indietro, con il sapore
            del sangue in bocca e la formula che ti si ripete in testa sbagliata, sempre
            allo stesso punto, come una canzone imparata male da bambino.
          effetti: { tormento: 0.5 }
      - testo: "Recitare a mente qualcosa che sai bene"
        descrizione: "I sussurri cercano un posto vuoto nella testa. Basta non lasciargliene."
        prova: { attributo: mentale, abilita: [resilienza, accademiche], difficolta: Media }
        successo:
          titolo: La tabellina del sette
          testo: |
            Ti scegli la cosa più noiosa che sai, la tabellina del sette, e te la ripeti
            a mente mentre cammini in mezzo alle maschere. I sussurri ci sbattono contro
            e scivolano via, perché nella tabellina del sette non c'è niente da
            prendere. Al sette per nove sbagli e ricominci da capo, ma ormai sei
            alla porta in fondo, con la nuca fredda e i numeri ancora in bocca.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: Il posto vuoto
          testo: |
            A un certo punto perdi il filo, e in quel buco i sussurri entrano tutti
            insieme. Per un momento sei sicuro di avere una maschera sulla faccia, e ti
            tocchi il viso con tutte e due le mani per controllare. Torni nel corridoio
            a passi lunghi, e per un pezzo continui a toccarti la faccia con la punta
            delle dita, il naso, le sopracciglia, la cicatrice piccola sul mento che
            ti sei fatto chissà quando.
          effetti: { tormento: 0.5 }
      - testo: "Parlare alle maschere come a delle persone"
        descrizione: "Prima della maschera avevano un nome e una casa. Forse a qualcuno torna in mente."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Faccia in giù
          testo: |
            Ti fermi in mezzo alla cappella e parli alle maschere a voce bassa, come si
            parla ai malati con la febbre. Gli dici che la donna che li ha portati
            quaggiù li ha dati in pasto alla statua, e che adesso possono smettere di
            farle la guardia. Una maschera smette di girare e si posa a terra con la
            faccia in giù, poi un'altra, piano, con la stanchezza dei malati quando
            la febbre scende. Esci mentre le ultime stanno ancora scendendo.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: Il coro
          testo: |
            Appena apri bocca le maschere si girano verso di te e ti rispondono con la
            tua voce, ripetendo le tue parole un momento dopo di te, con il tuo
            stesso accento e la stessa esitazione sulle doppie. Ti zittisci, e loro
            continuano lo stesso. Esci dalla cappella camminando all'indietro, e per
            tutto il corridoio senti la tua voce che ti segue, sempre più piano, finché
            non sai più se sono loro o se stai parlando ancora tu.
          effetti: { tormento: 0.5 }
      - testo: "Coprirti le orecchie e correre"
        descrizione: "La porta in fondo è a trenta passi. Trenta passi si fanno anche senza ascoltare."
        costo: 2
        esito:
          titolo: Trenta passi
          testo: |
            Ti premi le mani sulle orecchie e corri lungo le colonne, con gli occhi
            bassi sul pavimento. I sussurri passano lo stesso attraverso le dita, e ti
            arrivano sotto forma di prurito dietro gli occhi. Dall'altra parte ti
            appoggi allo stipite e resti lì finché il prurito si calma abbastanza da
            lasciarti camminare. Le mani, quando le togli dalle orecchie, hanno lasciato
            il segno delle unghie sulle tempie, otto mezzelune rosse che ci mettono
            un'ora a sparire.
          effetti: { profondita.sotto-capomozzo: 1, tormento: 0.5 }

  - id: sotto-la-sala-della-guerra
    immagine: ambientazione/evento-razzia-festival-150
    titolo: La sala della guerra
    sommario: "Una lavagna con Qir-Azel disegnata a gesso strada per strada. Dalla stanza accanto arrivano due voci che litigano."
    luogo: Sotterranei di Capomozzo, la sala della guerra
    area: sotto-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo == 3]
    testo: |
      Un tavolo grande occupa quasi tutta la stanza, con le sedie spinte indietro
      di traverso e una tazza di stagno rovesciata in una pozza secca di vino.
      Sulla parete nord c'è una lavagna, e sopra c'è Qir-Azel disegnata a gesso
      con una pazienza da miniaturista, i ponti contati uno per uno e la Cicatrice
      tratteggiata. Le frecce arrivano dalla costa, e alcune salgono da sotto la
      città. Ai margini ci sono appunti in due calligrafie. Una è minuta e
      pendente. L'altra è grossa, e chi l'ha usata ha spezzato il gesso tre volte.

      {percezione Media fallita} La calligrafia minuta ti ricorda qualcosa, e
      non sai cosa. In compenso ti ricordi benissimo che non bevi da ore.

      Dalla porta sul fondo arrivano le voci di un uomo e di una donna, smorzate
      dal legno. Litigano, e ogni tanto una sedia stride sul pavimento.

      {intimidire Media} Il gesso spezzato tre volte è di uno che se la prende
      con le cose quando non può prendersela con le persone. Di là, adesso,
      una persona l'ha trovata.

      {origine figlio-della-citta-bassa} Chi ha disegnato la Città Bassa ci ha
      camminato di notte, perché sa quali vicoli finiscono contro un muro e
      li ha segnati con una crocetta. Uno è quello dove da bambino ti
      nascondevi dalle guardie, e vederlo a gesso in questa stanza ti fa
      venire la pelle d'oca sulle braccia.

      {origine mercante-dei-ponti} I ponti sono contati giusti uno per uno,
      scale di raccordo comprese. Chi li ha disegnati li ha attraversati più
      volte senza fretta, come quei clienti che guardano tanto e comprano
      poco, e magari si è fermato anche al tuo banco.
    opzioni:
      - testo: "Leggere gli appunti"
        descrizione: "La calligrafia minuta la conosci. Quella grossa è di un orco che ha imparato a scrivere tardi."
        prova: { attributo: mentale, abilita: [accademiche, percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il titano dormiente
          testo: |
            Gli appunti sono in comune. Quelli grossi sono sgrammaticati e quelli minuti
            precisi, e sul bordo della lavagna i due gessi sono consumati in modo
            diverso, uno ridotto a un'unghia e l'altro quasi intero. Parlano di
            una seconda razzia fra poche settimane, con tutte le tribù chiamate
            alle armi e le Colate dell'Ira che salgono da sotto la città. In cima
            alla lavagna, in lettere più grandi delle altre, c'è scritto *prima
            domare il titano dormiente*. *La vasca dell'Aula dell'Ira è asciutta, e quaggiù non
            lo sa ancora nessuno.* Ti allontani dalla lavagna piano, per non far
            stridere niente.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: La sedia
          testo: |
            Ti avvicini per leggere e il ginocchio urta una sedia, che stride sulla
            pietra. Le voci di là si zittiscono di colpo. Resti piegato sotto il tavolo
            con le ginocchia contro il petto, a fissare la pozza di vino secco, finché l'uomo
            dice qualcosa di sgarbato e la donna ricomincia a rispondergli. Della
            lavagna ti restano in mente soltanto le frecce, e l'odore acido del vino
            secco sotto il naso.
          effetti: { tormento: 0.5 }
      - testo: "Passare oltre rasente il muro"
        descrizione: "Di là sono occupati a litigare. Finché litigano, non ascoltano."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Rasente il muro
          testo: |
            Passi lungo il muro con la schiena alla lavagna, mettendo i piedi dove il
            gesso caduto non scricchiola. Di là l'uomo alza la voce sul nome di Isvaro,
            e la donna lo zittisce con una parola sola che non capisci. Sei già
            accanto alla porta sul fondo quando di là una sedia si rovescia, e l'uomo
            impreca contro la sedia e contro la paga. Ti trovi d'accordo con lui
            almeno sulla paga.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: Il gesso
          testo: |
            Il gesso caduto ti scricchiola sotto lo stivale come zucchero, e di là le
            voci si fermano a metà di una parola. La porta si apre di un dito e si
            richiude. Torni indietro di corsa per il corridoio da cui sei venuto, con
            il cuore in gola, e ti fermi soltanto quando di là ricominciano a litigare. Ti appoggi al muro ad
            aspettare che il cuore rallenti, con il gesso ancora attaccato alla suola.
          effetti: { tormento: 0.5 }
      - testo: "Nasconderti sotto il tavolo e ascoltare"
        descrizione: "Di là stanno litigando su qualcuno che conosci. Vale la pena sentire chi."
        costo: 2
        esito:
          titolo: Sotto il tavolo
          testo: |
            Ti infili sotto il tavolo fra le gambe delle sedie e resti lì a lungo, con
            le ginocchia contro il petto. Di là parlano di Isvaro e di soldi, e poi di
            una donna che chiamano pazza a mezza voce. Quando finalmente esci hai i
            crampi alle gambe e il gesso nei capelli, e delle due voci di là sai
            abbastanza da riconoscerle al buio.

            {empatia Media} Pazza la chiamano tutti e due, ma l'uomo lo dice con
            paura e la donna con invidia.
          effetti: { profondita.sotto-capomozzo: 1, tormento: 0.5 }

  # ------------------------------------------------------------ i cuccioli (una volta sola)
  - id: le-gabbie-dei-cuccioli
    immagine: bestiario/orco
    titolo: Le gabbie dei cuccioli
    sommario: "Una dozzina di gabbie di assi lungo le pareti. In tre c'è qualcosa di verde che ringhia."
    luogo: Sotterranei di Capomozzo, la nursery
    area: sotto-capomozzo
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo >= 1, cuccioli == 0]
    testo: |
      La stanza è più calda delle altre e puzza di paglia marcia e di piscio.
      Lungo le pareti ci sono una dozzina di gabbie basse, fatte di assi grezze
      inchiodate con chiodi di nave, e quasi tutte sono vuote. In tre c'è qualcosa
      che si muove. Sono cuccioli d'orco alti mezzo metro, con la pelle verde
      smorta e gli occhi gialli iniettati di sangue, e il più grande ha un
      orecchio mangiato a metà, da un fratello, a giudicare dai segni dei denti.

      Appena ti vedono si buttano contro le sbarre e ringhiano, con una voce a
      metà fra quella di un bambino e quella di un cane. Sul pavimento fra le
      gabbie ci sono ossa spolpate e una ciotola sola, rovesciata. Li tengono
      affamati e insieme perché imparino a strapparsi il cibo di mano, e quelli
      che crescono diventano guerrieri.

      {addestrare-animali Media} Ringhiano come cani legati troppo corti, con
      più paura che rabbia. Una bestia così non si avvicina alla mano che le
      sta sopra, e la mano che le sta sotto la annusa per prima.

      Il più piccolo smette di ringhiare per primo. Ti guarda con la testa piegata
      e allunga una mano fra le sbarre, aperta, con il palmo in su. *Vuole da
      mangiare, o vuole vedere se mordi.* Le dita ti vanno da sole alla tasca dove
      tieni la carne secca. Accanto alla porta, appesa a un chiodo con un pezzo di
      spago, c'è la chiave delle gabbie.

      {resistenza Facile fallita} Lo stomaco si mette a brontolare all'idea
      della carne secca, con un tempismo che non ti fa onore davanti a tre
      bambini affamati.
    opzioni:
      - testo: "Dar loro da mangiare e aprire le gabbie"
        descrizione: "Carne secca, una gabbia alla volta, e le mani lontane dai denti."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: Tre parti uguali
          testo: |
            Spezzi la carne secca in tre parti uguali, perché hai visto la ciotola sola,
            e apri le gabbie una alla volta cominciando dal più piccolo. Ognuno prende
            il suo pezzo e corre in un angolo a mangiarlo con la faccia verso il muro.
            Poi escono dalla porta in fila, il più grande per ultimo, e li senti correre
            verso il rumore del mare. Il più piccolo si ferma sulla soglia e ti guarda
            ancora un momento con la testa piegata, come per ricordarsi la tua
            faccia, e poi corre dietro agli altri.
          imposta: { cuccioli: 1 }
          effetti: { racconto: 1 }
        fallimento:
          titolo: I denti
          testo: |
            Apri la prima gabbia e il più grande ti salta sul braccio prima che tu abbia
            tirato fuori la carne. Ha già i denti di un adulto. Te lo stacchi di dosso e
            lui scappa dalla porta, e gli altri due lo seguono appena apri le loro
            gabbie, senza toccare la carne che gli hai buttato dentro. Ti fasci il
            braccio con un lembo di camicia, e la ciotola resta rovesciata dov'era.
            Il morso è una mezzaluna piccola e profonda, e lo guardi più a lungo di
            quanto vorresti.
          imposta: { cuccioli: 1 }
          effetti: { ferite: 0.5 }
      - testo: "Aprire le gabbie da lontano"
        descrizione: "Con la chiave legata in cima a una lancia rotta. Poi quello che fanno è affar loro."
        esito:
          titolo: Un braccio e mezzo
          testo: |
            In un angolo trovi una lancia rotta, ci leghi la chiave in cima con lo spago
            e apri le gabbie una per una, tenendoti a un braccio e mezzo dalle sbarre. I
            cuccioli escono ringhiando, ti girano intorno due volte annusandoti gli
            stivali e poi spariscono dalla porta, verso il rumore del mare. Rimetti la
            chiave al suo chiodo con lo spago come l'hai trovata. Anche la lancia
            rotta torna nel suo angolo, perché qui dentro ogni cosa ha già il suo
            posto.
          imposta: { cuccioli: 1 }
      - testo: "Lasciarli dove sono"
        descrizione: "Fuori di qui non durerebbero un giorno. E non sono affari tuoi."
        esito:
          titolo: La ciotola
          testo: |
            Raddrizzi la ciotola rovesciata e ci metti dentro tutta la carne secca che
            hai in tasca. Poi esci e richiudi la porta. Da dietro il legno senti i
            ringhi che ricominciano, tre voci che si azzuffano intorno a una ciotola
            sola. Resti fermo nel corridoio ad ascoltarli finché smettono, e non
            sai dire se è un buon segno. Quando
            riparti ti accorgi di avere ancora in mano lo spago della chiave, e lo lasci
            cadere per terra.
          imposta: { cuccioli: 2 }
      - testo: "Dividere la carne come si faceva nei recinti"
        descrizione: "Una ciotola sola per tre, perché imparino a strapparsela di mano. A Ghoran tenevano così anche gli schiavi giovani, e tu sai come si fa a non litigare."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Tre mucchi
          testo: |
            La ciotola sola la conosci. Nei recinti di Ghoran ai ragazzi ne
            davano una ogni cinque, perché imparassero chi era il più forte
            prima ancora di essere venduti, e tu avevi imparato a mangiare di
            spalle e in fretta, con un gomito alzato. Le spalle ti si curvano
            ancora adesso, al ricordo. Dividi la carne secca in tre mucchi uguali
            sulle assi e ne spingi uno dentro ogni gabbia con la punta dello
            stivale, lontano dalle sbarre degli altri.

            I cuccioli mangiano ognuno nel suo angolo, con la faccia verso il
            muro. Quando apri le gabbie escono in fila, il più grande per
            ultimo, e corrono verso il rumore del mare. Il più piccolo si ferma
            sulla soglia e ti guarda ancora con la testa piegata.
          effetti: { racconto: 1 }
          imposta: { cuccioli: 1 }
      - testo: "Accucciarti e porgere la mano da sotto"
        descrizione: "Al Circolo hai imparato che una bestia spaventata si avvicina a chi sta più in basso di lei. Questi hanno le mani, e la paura è la stessa."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Facile }
        successo:
          titolo: Più in basso
          testo: |
            Ti accucci finché la testa ti arriva sotto le sbarre e resti lì,
            con le ginocchia che protestano e la carne secca sul palmo aperto,
            come al Circolo ti hanno insegnato con le bestie che hanno paura.
            Il più piccolo arriva per primo e ti annusa le dita a lungo prima di
            prendere il suo pezzo. Gli altri due lo guardano mangiare e poi si
            avvicinano anche loro, ringhiando sempre meno.

            Apri le gabbie senza alzarti. Escono in fila, il più grande per
            ultimo, e corrono verso il rumore del mare. Il più piccolo si ferma
            sulla soglia e ti guarda con la testa piegata, come per ricordarsi
            la tua faccia, e poi corre dietro agli altri.
          imposta: { cuccioli: 1 }
          effetti: { racconto: 1 }
        fallimento:
          titolo: Le mani
          testo: |
            Ti accucci sotto le sbarre, e per un po' sembra funzionare. Poi il
            più grande si accorge che sei a portata di braccio e ti afferra il
            polso con tutte e due le mani, e i denti arrivano subito dopo. Te lo
            stacchi di dosso e apri le gabbie in fretta, e i tre spariscono
            dalla porta senza toccare la carne. Il morso è una mezzaluna piccola
            e profonda, e al Circolo nessuno ti aveva parlato di bestie che
            usano le mani.
          imposta: { cuccioli: 1 }
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ la tana del Pungitore (una volta sola)
  - id: la-tana-del-pungitore
    immagine: ambientazione/rovine-dei-precursori
    titolo: La tana del Pungitore
    sommario: "Dietro la tenda di liane il pavimento è coperto di carcasse vuote. Uno dei morti è un orco con la spada ancora in mano."
    luogo: Sotterranei di Capomozzo, la tana del Pungitore
    area: sotto-capomozzo
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo >= 3, capomozzo.caccia == 1, capomozzo.druzk == 0]
    testo: |
      Oltre il terreno di caccia, dove la caverna fa una curva verso il mare, c'è
      la tana. Il pavimento è coperto da centinaia di carcasse di gabbiani e di
      falchi pescatori, e fra gli uccelli ci sono una decina di orchi. Sono tutti
      vuoti. La pelle si è seccata intorno alle ossa, e dentro non è rimasto
      niente, come in un uovo bevuto da un buco.

      {medicina Media} Non vedi ferite da taglio né ossa rotte. Ognuno ha un
      solo buco piccolo e netto, e da lì è stato portato via tutto quello
      che non era pelle e ossa.

      Uno degli orchi è più grosso degli altri. Ha ancora addosso un'armatura di
      pelle di cinghiale cucita a strati, con le borchie fatte di chiodi di nave,
      e la mano stretta sull'elsa di una spada larga e ricurva. Sulla lama
      qualcuno ha inciso *Druzk* a punta di coltello, in lettere comuni tutte
      storte. Al collo porta un anello di ferro con una dozzina di chiavi da
      carceriere.

      {armi-da-mischia Media} La spada è larga, ricurva, con il filo tenuto
      bene e una tacca vicino all'elsa. Chi l'ha usata parava più di quanto
      colpisse, e alla fine non gli è bastato.

      L'odore dei gabbiani morti ti arriva tutto insieme, e cominci a respirare dalla bocca. Dall'apertura
      sul mare arriva il fruscio delle liane, e a ogni fruscio ti giri a guardare
      l'apertura, con la mano che va alla cintura prima che tu glielo chieda.
    opzioni:
      - testo: "Sfilargli l'armatura a forza"
        descrizione: "La pelle secca si è incollata al cuoio. Bisogna tirare, e tirare forte."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Strato per strato
          testo: |
            Punti un piede sul petto del morto e tiri, e l'armatura viene via con un
            rumore di carta strappata. La spada invece non la vuole lasciare. Gli apri
            le dita una per una, e sono leggere come rametti secchi, e ti scusi con
            lui sottovoce senza sapere perché. Prendi anche le
            chiavi, ed esci dalla tana con l'armatura sotto il braccio prima che le
            liane si muovano di nuovo.
          imposta: { capomozzo.druzk: 1 }
          effetti: { oggetto.spada-di-druzk: 1, oggetto.armatura-di-druzk: 1 }
        fallimento:
          titolo: Il padrone di casa
          testo: |
            Tiri troppo forte, l'armatura si strappa via di colpo e tu cadi all'indietro
            fra i gabbiani secchi con un rumore di paglia. Dall'apertura sul mare entra
            il Pungitore. Afferri la spada e le chiavi e corri, e il pungiglione ti
            prende alla coscia proprio sulla soglia. L'armatura te la trascini dietro
            per una cinghia fino al corridoio zoppicando, mentre la gamba ti diventa
            calda e pesante come un sacco di sabbia bagnata.
          imposta: { capomozzo.druzk: 1 }
          effetti: { oggetto.spada-di-druzk: 1, oggetto.armatura-di-druzk: 1, ferite: 1 }
      - testo: "Tagliare le cinghie con calma"
        descrizione: "Le cinghie sono di cuoio, e il cuoio si taglia. Bisogna sapere dove finisce lui e dove comincia l'armatura."
        prova: { attributo: mentale, abilita: [medicina, percezione], difficolta: Media }
        successo:
          titolo: Le cinghie
          testo: |
            Hai visto abbastanza morti per sapere dove la pelle si stacca da sola. Tagli
            le cinghie sotto le ascelle e lungo i fianchi, e l'armatura si apre come un
            guscio. La spada gliela sfili dalla mano girandogli il polso piano, anche se
            a lui ormai non importa, e le chiavi gliele togli per ultime, dalla testa,
            come una collana. Gli chiudi la mano vuota sul petto, perché ti sembra
            più ordinato così, e a Druzk l'ordine piaceva.
          imposta: { capomozzo.druzk: 1 }
          effetti: { oggetto.spada-di-druzk: 1, oggetto.armatura-di-druzk: 1 }
        fallimento:
          titolo: Dentro
          testo: |
            Tagli una cinghia di troppo, e il torace del morto si apre insieme
            all'armatura. Dentro è vuoto e pulito, liscio come l'interno di una
            conchiglia. Prendi tutto quello che c'è da prendere senza guardare più giù,
            e ti accorgi di aver camminato all'indietro soltanto quando sei di nuovo nel
            corridoio. Resti appoggiato al muro, con l'armatura fra i
            piedi, finché le dita non tornano a chiudersi bene. Di quell'interno pulito e
            lucido ti ricorderai più a lungo che di tutto il resto.
          imposta: { capomozzo.druzk: 1 }
          effetti: { oggetto.spada-di-druzk: 1, oggetto.armatura-di-druzk: 1, tormento: 1 }
      - testo: "Prendere tutto con le mani nel marcio"
        descrizione: "Senza tecnica e senza fretta. Ci vuole il tempo che ci vuole, e lo stomaco deve reggere."
        costo: 2
        esito:
          titolo: Il tempo che ci vuole
          testo: |
            Ti inginocchi fra i gabbiani e lavori a mani nude, slacciando quello che si
            slaccia e strappando il resto, e ogni poco il fruscio delle liane
            ti fa voltare. Ci metti un'ora, e a metà ti fermi a vomitare in un angolo,
            con discrezione, lontano dal lavoro. Esci con l'armatura fra le braccia, la spada
            infilata nella cintura e le chiavi al collo, e con un odore addosso che ti
            resta per due giorni.
          imposta: { capomozzo.druzk: 1 }
          effetti: { oggetto.spada-di-druzk: 1, oggetto.armatura-di-druzk: 1, tormento: 0.5 }
      - testo: "Spogliarlo come una carcassa sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice le carcasse si aprono in fretta dalle giunture, senza guardarle in faccia. Questa è soltanto più piccola."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, resistenza], difficolta: Facile }
        successo:
          titolo: Dalle giunture
          testo: |
            Cominci dalle giunture, come sulle piattaforme, dove una carcassa
            non si guarda in faccia e si smonta dal punto in cui i pezzi si
            toccano. Le fibbie dell'armatura sono di ferro arrugginito e
            cedono con un colpo di pugnale ciascuna. La spada la liberi
            facendo leva sull'elsa, e le chiavi le sfili per ultime. Le mani
            lavorano con il ritmo dei turni lunghi, e la testa intanto resta
            sull'apertura, dove le liane frusciano.

            {resistenza Facile} Lo stomaco tiene. Sulle piattaforme ha visto di
            peggio, e se lo ricorda prima di te.
          imposta: { capomozzo.druzk: 1 }
          effetti: { oggetto.spada-di-druzk: 1, oggetto.armatura-di-druzk: 1 }
        fallimento:
          titolo: Il guscio
          testo: |
            Fai leva su una giuntura che non è una giuntura, e il torace del
            morto si apre insieme all'armatura. Dentro è vuoto e liscio come
            una conchiglia, e sulle piattaforme una carcassa non è mai così
            pulita. Prendi tutto e torni nel corridoio a passi lunghi,
            e ti serve un bel po' prima che le mani smettano di tremare.
          imposta: { capomozzo.druzk: 1 }
          effetti: { oggetto.spada-di-druzk: 1, oggetto.armatura-di-druzk: 1, tormento: 1 }

  # ------------------------------------------------------------ Zagrath nell'harem (facoltativa)
  - id: zagrath-nell-harem
    immagine: personaggi/zagrath
    titolo: L'harem di Dorbak
    sommario: "Da dietro una porta arrivano un odore di aceto e di fiori marci e una risata di donna che fa tremare le assi."
    luogo: Sotterranei di Capomozzo, l'harem di Dorbak
    area: sotto-capomozzo
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo >= 1, capomozzo.zagrath == 0]
    testo: |
      La stanza puzza di aceto e di fiori marci, così forte che ti lacrimano gli
      occhi, e ci metti un momento a capire che quell'odore è un profumo. Lo
      portano quattro orchesse grosse e sgraziate, con collane di denti e le
      guance dipinte di rosso, sedute in cerchio fra decine di cuscini bitorzoluti
      e di pellicce di cavallo. Erano le mogli di Dorbak, il capoguerra che
      cavalcava il cinghiale corazzato alla razzia del Festival, e da quando è
      morto a Qir-Azel nessuno viene più a trovarle.

      {empatia Media} Il profumo se lo mettono per qualcuno che non viene più.
      Lo rimettono ogni mattina, e ogni mattina ne mettono un po' di più.

      Al centro del cerchio siede un uomo enorme che è mezzo orco e mezzo ogre,
      con la pelle grigia e spessa e il naso rotto tante volte che non ha più una
      direzione. Porta soltanto un paio di brache di cuoio sfilacciate e un
      amuleto d'ossa. Una delle orchesse gli pettina i capelli con un pettine
      d'osso, un'altra lo imbocca con dei datteri. Contro i cuscini c'è un arco
      lungo più alto di te, con una faretra di frecce nere.

      {armi-da-distanza Media} Un arco così colpisce lontano, e da vicino
      diventa una trave scomoda. Fra te e lui ci sono dieci passi di cuscini,
      e lui ha la bocca piena.

      *Zagrath, con l'arco lungo quanto Ilvaena.* Lui ti fissa con gli occhi
      piccoli, più offeso che sorpreso, e si toglie un dattero di bocca.

      «Hai scelto il momento sbagliato per morire» dice con la voce impastata, e
      allunga la mano verso l'arco. Le quattro orchesse si girano verso di te
      tutte insieme, e quella col pettine lo stringe come un coltello.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "È mezzo nudo e ha la bocca piena di datteri. Una delle vedove però ha già preso la mazza."
        combattimento: zagrath
        vittoria:
          titolo: Dillo all'elfa
          testo: |
            Tira due frecce prima che tu arrivi ai cuscini, e la seconda ti passa così
            vicino che senti le piume. Da vicino l'arco non gli serve più, e la vedova
            con la mazza finisce lunga sulle pellicce. Quando Zagrath cade in ginocchio
            sanguina dal naso per l'ennesima volta, e ride.

            «Dillo all'elfa» dice, e sputa un dente. «Dille che questa per noi due conta
            zero. Lei qui non c'era.» Le orchesse gli si buttano addosso a strillare, e
            lui ne approfitta per strisciare fuori dalla porta sul retro con l'arco in
            mano. Lo lasci andare, perché ti duole un fianco e i cuscini sono
            morbidi. Sul pavimento, delle sue frecce nere ne restano tre.
          imposta: { capomozzo.zagrath: 1 }
          effetti: { racconto: 1 }
        sconfitta:
          titolo: Le frecce nere
          testo: |
            La prima freccia ti prende alla spalla prima che tu abbia fatto tre passi, e
            la seconda ti inchioda il mantello allo stipite. Lo strappi e scappi nel
            corridoio, con le orchesse che ti tirano dietro i cuscini e Zagrath che ride
            sdraiato, senza nemmeno alzarsi. Quando ti volti, la porta è chiusa con il
            chiavistello, e da dietro il legno arriva il rumore di qualcuno che mastica
            un dattero.
          imposta: { capomozzo.zagrath: 2 }
      - testo: "Raccontare alle vedove come è morto Dorbak"
        descrizione: "Il giorno del Festival Dorbak è caduto alla porta nord, davanti a mezza città. Loro non c'erano, e nessuno gliel'ha mai raccontato."
        prova: { attributo: sociale, abilita: [empatia, espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Il capoguerra
          testo: |
            Alzi le mani vuote e cominci a raccontare il giorno del Festival e il
            cinghiale corazzato di Dorbak, e di come è caduto alla porta nord senza
            fare un passo indietro. Ci metti un po' di quello che si racconta in città
            e parecchio di quello che vogliono sentire, e la voce ti si alza da sola
            sulle parti migliori. La più vecchia comincia a piangere
            a voce altissima, le altre le vanno dietro, e in mezzo al lamento si
            ricordano che sui cuscini del marito c'è un estraneo. Zagrath a una cosa del
            genere non era preparato. Raccoglie l'arco e se ne va borbottando, e nessuno
            bada a te quando passi oltre.
          imposta: { capomozzo.zagrath: 2 }
        fallimento:
          titolo: Il pettine
          testo: |
            Cominci a parlare di Dorbak, e la più giovane delle vedove ti tira il
            pettine in faccia prima che tu arrivi al cinghiale. Come è morto non lo
            vogliono sentire da uno che stava dall'altra parte. Zagrath tende l'arco
            ridendo, e la freccia ti apre il fianco mentre ti butti fuori dalla porta.
            Nel corridoio ti premi la mano sulla ferita, e il sangue ti passa fra le
            dita mentre da dentro senti le vedove che ricominciano a pettinarlo.

            {medicina Facile} La freccia è entrata e uscita, e ha preso la carne
            sopra l'anca. Premi forte e conta fino a cento, e poi conta di nuovo.
          imposta: { capomozzo.zagrath: 2 }
          effetti: { ferite: 2 }
      - testo: "Parlargli della bilancia di Ghoran"
        descrizione: "Lui la gente la vende ai mercanti di Ghoran. Tu su quella bilancia ci sei salito, e ne sei sceso con le tue gambe."
        requisiti: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [intimidire, ingannare], difficolta: Media }
        successo:
          titolo: La bilancia
          testo: |
            Gli dici che a Ghoran sei salito sulla bilancia anche tu, e che dalla
            bilancia sei sceso da solo, senza chiedere il permesso a nessuno. Lo dici
            piano guardandogli le mani invece della faccia, come guardavi i sorveglianti
            dei recinti, e la voce ti esce più bassa e più ferma di quanto ti senti.
            Zagrath smette di masticare. Poi si sdraia di nuovo sui cuscini
            con la faccia verso il muro, e una delle orchesse ti indica la porta con il
            pettine.
          imposta: { capomozzo.zagrath: 2 }
        fallimento:
          titolo: Il doppio
          testo: |
            Zagrath ti ascolta e si mette a ridere piano, poi sempre più forte. «Uno
            scappato da Ghoran» dice, «vale il doppio a riportarcelo.» Le orchesse ti
            vengono addosso tutte insieme, e la vedova con la mazza ti prende alle
            costole mentre le altre ti tirano per i vestiti. Ti liberi soltanto
            lasciando nelle loro mani mezza camicia e un po' di pelle del collo, e
            arrivi alla porta piegato in due. Da dietro la porta Zagrath ti grida
            quanto varresti a Ghoran, e le orchesse ridono a ogni cifra. La cosa che
            ti brucia di più, mentre ti tieni le costole, è che sono cifre basse.
          imposta: { capomozzo.zagrath: 2 }
          effetti: { ferite: 2 }
      - testo: "Richiudere la porta"
        descrizione: "Nessuno si è ancora alzato dai cuscini. Puoi sempre fingere di avere sbagliato stanza."
        esito:
          titolo: Stanza sbagliata
          testo: |
            Chiedi scusa a voce alta, come in una locanda dove hai sbagliato camera,
            e richiudi la porta con le buone maniere di un ospite. Da
            dentro arriva una risata grassa di Zagrath, poi quelle delle orchesse, e
            nessuno si alza. Prima di andartene incidi una croce sul legno con la punta
            del coltello, per ricordarti di non riaprirla, e l'odore di aceto ti resta
            nei vestiti per tutto il corridoio.
          imposta: { capomozzo.zagrath: 2 }
      - testo: "Trattare con lui come con un cliente dei Ponti"
        descrizione: "Zagrath baratta merce rubata con alcol e notizie. Le notizie dei Ponti le hai, e un mercante non comincia mai un affare con le armi in mano."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il prezzo del sale
          testo: |
            Ti siedi sul cuscino più vicino alla porta, come al banco ti siedi
            dalla parte della strada, e gli dici che le carovane del sale
            quest'anno salgono a Qir-Azel con il doppio della scorta. Gli dici
            anche quali banchi dei Ponti comprano senza chiedere da dove
            arriva la roba, e lì cambi un nome o due, per prudenza. Zagrath
            ascolta masticando, con la mano ferma a mezza strada dall'arco.

            «Un mercante» dice alla fine, come si dice di un animale raro, e
            sputa il nocciolo di un dattero sui cuscini. «Vattene, mercante.
            Questa te la lascio gratis.» Le orchesse ridono, e quella col
            pettine ti apre la porta con un inchino storto.

            {ingannare Media} I nomi che hai cambiato erano quelli giusti da
            cambiare. Se domani li va a cercare, troverà due banchi chiusi da
            anni e un vecchio sordo.
          imposta: { capomozzo.zagrath: 2 }

  # ------------------------------------------------------------ Zagrath raccontato a Ilvaena
  - id: la-guerra-privata
    presso: grifone-di-ferro
    immagine: personaggi/ilvaena-sorathe
    titolo: La guerra privata
    sommario: "Ilvaena Sorathe è al tavolo d'angolo del Grifone, con l'arco senza corda appoggiato al muro. Le hanno detto che sei stato a Capomozzo."
    luogo: Locanda del Grifone di Ferro, la sera
    area: ponti-sospesi
    requisiti: [capomozzo.zagrath == 1, capomozzo.ilvaena == 0]
    testo: |
      Ilvaena Sorathe ha preso il tavolo d'angolo, come la sera della cena, con
      l'arco senza corda appoggiato al muro e la faretra sulla sedia accanto. Ha
      di nuovo il fango sugli stivali fino al ginocchio, e mangia lo stufato di
      Brunella con l'attenzione che si dà ai lavori difficili. Quando ti vede
      sposta la faretra con un piede, e la sedia è tua. Sul tavolo, accanto alla
      scodella, c'è una corda d'arco nuova arrotolata, che lei tocca ogni tanto
      con il pollice.

      {armi-da-distanza Facile} Una corda nuova si monta quando la vecchia ha
      tirato troppo, o quando si ha in mente un tiro preciso. Ilvaena la
      tocca come si tocca un conto ancora da saldare.

      «Mi dicono che sei stato a Capomozzo» dice senza alzare gli occhi dalla
      scodella. «Mi dicono anche che sei tornato. Questa è la parte interessante.»

      {empatia Media} Lo dice come una battuta, e intanto ha smesso di
      masticare.

      Brunella ti mette davanti un boccale senza chiederti cosa vuoi e resta lì
      con lo strofinaccio in mano, perché le storie le piacciono quanto a Liaren.
      Ilvaena posa il cucchiaio. *Il mezzo ogre glielo devo raccontare bene, o non
      me lo perdona.* Ti guarda e aspetta, con il mento appoggiato sul pugno.
    opzioni:
      - testo: "Raccontarle di Zagrath"
        descrizione: "Dei cuscini e delle vedove di Dorbak, e di quello che ti ha detto in ginocchio."
        esito:
          titolo: Conta zero
          testo: |
            Le racconti dell'harem e dei datteri, e Ilvaena ride così forte che al
            bancone due Raschiatori si girano. Poi le racconti lo scontro, e smette di
            ridere. Quando arrivi alle parole di Zagrath in ginocchio si tocca la
            cicatrice sotto la clavicola senza accorgersene. Dietro di te Brunella
            smette di strofinare il bancone.

            «Ha ragione lui» dice alla fine, girando il cucchiaio nella scodella. «Conta
            zero.» Beve un sorso lungo e posa il boccale con cura, al centro esatto del
            cerchio umido che aveva lasciato sul legno. «Però adesso so che sanguina dal
            naso come tutti gli altri» dice, e alza il boccale verso di te. «Grazie.
            Glielo ricorderò, la prossima volta.»
          imposta: { capomozzo.ilvaena: 1 }

  # ------------------------------------------------------------ Isvaro negli alloggi (solo se è fuggito)
  - id: isvaro-negli-alloggi
    immagine: ambientazione/capomozzo
    titolo: Il pagliericcio
    sommario: "In un ripostiglio in fondo a un corridoio laterale c'è qualcuno che dorme fra i sacchi, con gli stivali ancora ai piedi."
    luogo: Sotterranei di Capomozzo, un ripostiglio
    area: sotto-capomozzo
    requisiti: [pista.capomozzo == 3, isvaro == 1, profondita.sotto-capomozzo >= 1, capomozzo.isvaro == 0]
    testo: |
      In fondo a un corridoio laterale c'è un ripostiglio con la porta
      accostata, e dentro c'è odore di vino. Su una cassa ci sono quattro
      bottiglie vuote in fila per altezza, con l'etichetta in fuori. Isvaro
      Tarvelin dorme su un pagliericcio steso fra i sacchi di farina, con gli
      stivali ancora ai piedi.

      {percezione Facile} Le bottiglie le ha allineate uno che beve da solo e
      vuole che sembri una cerimonia. Sono di un vino buono, e a quaggiù non
      ci sono arrivate per caso.

      È più magro di quando è scappato dalla fornace dell'Acciaieria, e la barba
      gli è cresciuta a chiazze. Dorme con un coltello in mano, e quando la tua
      ombra gli passa sulla faccia apre gli occhi di colpo e lo alza. Ti
      riconosce. Il coltello resta a mezz'aria un momento, e poi torna giù piano
      sul pagliericcio.

      {rissa Facile} Il coltello trema. Un colpo secco sul polso e cadrebbe fra
      i sacchi, e dalla faccia che fa lui lo sa meglio di te.

      {origine allievo-di-torvessa} Quando all'Accademia si parla di gare
      d'arco qualcuno finisce sempre per fare il suo nome, e poi abbassa la
      voce. Te lo immaginavi più alto, e soprattutto più asciutto.

      {origine rampollo-dei-quartieri-alti} Nei salotti dei Quartieri Alti il
      funerale di Maerith Tarvelin lo raccontano ancora, con il figlio che
      maledice il padre davanti a tutti. Hai sentito quella storia a tre cene
      diverse, e lui in nessuna aveva le bottiglie in fila sulla cassa.

      «Tu» dice, con la voce impastata e un sorriso che gli viene storto. «Ti
      prego, non dirlo a Kessa. Se sa che sono tornato mi riporta giù da
      lei.» Si mette a sedere, e le bottiglie tintinnano. «Io giù non
      ci voglio tornare.»
    opzioni:
      - testo: "Chiedergli di Aurenne"
        descrizione: "Nel diario la chiamava la sua amata. Adesso ha paura di scendere da lei."
        esito:
          titolo: Il ponte
          testo: |
            «Sta sul ponte, al livello di sotto, dove le macchine dei Precursori
            guardano nel buio» dice Isvaro, e si stringe le ginocchia al petto. «Sale
            soltanto per parlare con la statua della cappella, e poi torna giù senza
            guardare nessuno.» Si guarda la mano sinistra e la apre e la chiude.
            «L'ultima volta che mi ha toccato aveva già quella mano nuova. Era fredda
            come una pietra di fiume.»

            Quando esci si è già girato verso il muro, con le ginocchia ancora
            strette al petto e gli stivali sporchi sulla farina. *Gli ho lasciato il coltello, e
            lui non se n'è nemmeno accorto.* Richiudi la porta piano, come si fa nelle
            stanze dei malati.
          imposta: { capomozzo.isvaro: 1 }
      - testo: "Lasciarlo dormire e andartene"
        descrizione: "Non sei sceso fin qui per lui. E Kessa, a quanto pare, lo cerca già abbastanza."
        esito:
          titolo: La porta accostata
          testo: |
            Gli lasci il coltello e le bottiglie e richiudi la porta come l'hai trovata,
            accostata. Da dentro lo senti ridere piano e poi tirare su col naso, e poi
            più niente. Nel corridoio la lanterna in fondo fa fumo, e lo stoppino
            andrebbe tagliato, e ti accorgi di pensarci con un'attenzione
            esagerata, pur di non pensare a lui. Resti un momento con la mano sulla maniglia, poi te ne
            vai prima che lui dica qualcos'altro.
          imposta: { capomozzo.isvaro: 1 }
      - testo: "Parlargli dell'Accademia"
        descrizione: "Isvaro è cresciuto all'Accademia di Torvessa, nei corridoi dove studi tu. Da lì si arriva ad Aurenne con meno fatica."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Il bersaglio di paglia
          testo: |
            Gli dici che studi a Torvessa, e che il bersaglio di paglia in
            fondo al cortile è ancora quello delle gare. Isvaro ride con il
            naso, senza aprire la bocca. «C'è ancora il buco al centro?» chiede,
            e non aspetta la risposta. Per un po' parla del cortile e dei
            refettori freddi, a voce bassa, con le mani che si cercano fra le
            ginocchia. Quando arrivi ad Aurenne continua a parlare con un altro
            tono, più piatto.

            «Sta sul ponte, al livello di sotto, dove le macchine dei Precursori
            guardano nel buio» dice, e si stringe le ginocchia al petto. «Sale
            soltanto per parlare con la statua della cappella. L'ultima volta
            che mi ha toccato aveva già quella mano nuova, fredda come una
            pietra di fiume.» Quando esci si è già girato verso il muro, e tu
            richiudi la porta piano, come si fa nelle stanze dei malati.
          imposta: { capomozzo.isvaro: 1 }

  # ------------------------------------------------------------ gli alloggi di Aurenne (una volta sola, richiesta dal cuore)
  - id: gli-alloggi-di-aurenne
    immagine: ambientazione/mito-regina-ali-spezzate
    titolo: La stanza pulita
    sommario: "In fondo a un corridoio c'è l'unica porta del livello con i cardini oliati, e dietro una stanza con le lenzuola di seta."
    luogo: Sotterranei di Capomozzo, gli alloggi di Aurenne
    area: sotto-capomozzo
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo >= 1, capomozzo.alloggi == 0]
    testo: |
      È l'unica porta di tutto il livello con i cardini oliati, e si apre senza un
      rumore. Dentro c'è una stanza grande e pulita, e dopo le tane degli orchi il
      pulito ti mette a disagio. A nord c'è un letto di buona fattura con le
      lenzuola di seta color crema, rimboccate strette. A sud una scrivania e una
      sedia stanno sotto una lanterna appesa che non fa fumo, perché qualcuno ne
      ha pareggiato lo stoppino con le forbici.

      Sulla parete accanto al letto c'è uno specchio alto, girato contro il muro.
      Sul pavimento, sotto lo specchio, ci sono dei capelli lunghi e sottili, e
      alla luce della lanterna hanno il colore dell'argento. Ti si gela la nuca, e
      ti torna in mente *Mawrak'Thur*, la parola che la Città Bassa ripete
      sottovoce dalla sera del Festival.

      {resilienza Media fallita} La nuca resta gelata anche dopo, e ti scopri
      a non voltare le spalle allo specchio, come se girato contro il muro
      potesse vederti lo stesso.

      Sulla scrivania non c'è niente fuori posto. In un angolo, girato verso il
      letto, c'è un uccellino di legno intagliato a mano, grande quanto un
      pollice, a cui manca un'ala. La punta del becco è consumata a forza di
      toccarla. Tutto il resto deve stare nei cassetti.

      {empatia Media} Un uccellino con un'ala sola, girato verso il cuscino
      perché sia l'ultima cosa da vedere prima di dormire. In una stanza così
      ordinata è l'unica cosa che qualcuno ha amato.
    opzioni:
      - testo: "Frugare nella scrivania"
        descrizione: "Tre cassetti e nessuna serratura. Chi dorme qui non ha paura dei ladri."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Facile }
        successo:
          titolo: Il quaderno di stoffa
          testo: |
            Nel cassetto di mezzo, sotto una pila di fazzoletti piegati in quattro, c'è
            un quaderno dalla copertina di stoffa azzurra, consumata agli angoli. La
            prima pagina è scritta in una calligrafia tonda da ragazzina, con un
            cerchietto al posto del puntino sulle *i*, e comincia con *Caro Albero*.
            Le ultime sono in una grafia dritta e appuntita che sembra di un'altra
            persona. Te lo infili sotto la giubba e richiudi il cassetto com'era, con
            i fazzoletti piegati di nuovo in quattro.
          imposta: { capomozzo.alloggi: 1 }
          effetti: { oggetto.diario-di-aurenne: 1 }
        fallimento:
          titolo: I passi nel corridoio
          testo: |
            Il quaderno lo trovi nel cassetto di mezzo, sotto i fazzoletti, ma mentre lo
            sfogli arrivano dei passi nel corridoio. Ti butti dietro il letto e resti lì
            con la guancia sulla seta, mentre qualcuno si ferma sulla soglia a guardare
            dentro e poi se ne va senza entrare. Ti rialzi con il quaderno stretto al
            petto e le ginocchia che tremano, e sulla seta resta l'impronta della tua
            guancia.
          imposta: { capomozzo.alloggi: 1 }
          effetti: { oggetto.diario-di-aurenne: 1, tormento: 0.5 }
      - testo: "Sederti sul letto e guardare la stanza da lì"
        descrizione: "Lo specchio girato, l'uccellino rivolto al cuscino. Da sdraiati si vedono cose diverse."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Facile }
        successo:
          titolo: Il cuscino
          testo: |
            Ti siedi sul bordo del letto, e la seta è fredda sotto le mani. Da qui
            l'uccellino di legno è l'ultima cosa che si vede prima di spegnere la
            lanterna, e lo specchio girato è l'unica che non si vede mai. Infili la mano
            sotto il cuscino senza pensarci, come faresti nel tuo letto. C'è un
            quaderno dalla copertina di stoffa azzurra, consumata agli angoli, con la
            prima pagina scritta in una calligrafia tonda da ragazzina.
          imposta: { capomozzo.alloggi: 1 }
          effetti: { oggetto.diario-di-aurenne: 1 }
        fallimento:
          titolo: La seta
          testo: |
            Ti siedi sul letto e la seta scivola, e per non cadere ti aggrappi al
            lenzuolo e lo tiri via per metà. Sotto il cuscino, scoperto, c'è un quaderno
            dalla copertina di stoffa azzurra. Lo prendi, poi passi un tempo lunghissimo a
            rifare il letto con gli angoli tirati come li avevi trovati. Non ci riesci,
            e alla fine lo lasci com'è, con un angolo che pende, sapendo che chiunque
            dorma qui se ne accorgerà al primo sguardo.
          imposta: { capomozzo.alloggi: 1 }
          effetti: { oggetto.diario-di-aurenne: 1, tormento: 0.5 }
      - testo: "Cercare dove si nasconde un quaderno di preghiere"
        descrizione: "In Cattedrale le novizie tengono il quaderno delle preghiere sotto il materasso, dalla parte della testa. Questa stanza è ordinata come una cella del Velo."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Sotto il materasso
          testo: |
            La stanza ti ricorda il dormitorio delle novizie, con le lenzuola
            tirate e niente fuori posto, e lì le cose che contano si tengono
            sotto il materasso, dalla parte della testa. Sollevi l'angolo del
            letto. C'è un quaderno dalla copertina di stoffa azzurra, consumata
            agli angoli. La prima pagina è scritta in una calligrafia tonda da
            ragazzina e comincia con *Caro Albero*, come le preghiere scritte
            che le novizie lasciano nella cassetta della Cripta. Le ultime
            pagine hanno una grafia dritta e appuntita, di un'altra persona.

            Rimetti a posto l'angolo del lenzuolo e ti infili il quaderno sotto
            la giubba. Ti viene da fare il segno dell'Albero come in dormitorio, e
            lo fai a metà.
          effetti: { oggetto.diario-di-aurenne: 1 }
          imposta: { capomozzo.alloggi: 1 }

  # ------------------------------------------------------------ il cuore · 3 → 4
  - id: garin-e-kessa
    immagine: ambientazione/rovine-dei-precursori
    titolo: Garin e Kessa
    sommario: "Nella sala della ricerca un mercenario e una maga litigano su Isvaro, e dalla stanza accanto senti tutto."
    luogo: Sotterranei di Capomozzo, la sala della ricerca
    area: sotto-capomozzo
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo >= 4, capomozzo.alloggi >= 1]
    testo: |
      Dalla sala della guerra, con la spalla contro lo stipite, senti le voci
      chiare attraverso il legno della porta.

      «Cercare Isvaro, adesso» dice l'uomo con una voce bassa da caserma, e una
      sedia stride sotto di lui. «Senti, Kessa, quel mezzelfo non vale la pelle
      che ci lasciamo. Io sono qui per la paga, e la paga non basta più.»

      «Isvaro ha pensato la razzia dalla prima freccia all'ultima» risponde la
      donna, piano, pesando ogni parola prima di lasciarla andare. «Aurenne ci ha
      dato un compito, Garin.»

      «Aurenne è pazza» dice lui. «Hai visto cos'ha fatto a quelli con le
      maschere, e cosa fa con quell'aggeggio. Senti, mettiamola così. Il tuo
      mezzelfo è in una fossa di Qir-Azel, e i vermi gli stanno già facendo
      festa.»

      «Ripetilo e ti brucio la lingua» dice lei, e di là cala un silenzio breve e
      sgradevole.

      Spingi la porta. La sala è piena di tavolette di pietra coperte di rune
      aguzze e di pezzi di bassorilievo staccati a scalpello, e sulle mensole ci
      sono picconi e spazzole da scavo. Garin è un uomo massiccio con l'elmo
      ammaccato e una tunica verde lisa sopra la maglia, e imbraccia uno scudo di
      ferro dipinto con una faccia che urla. Davanti a lui Kessa, con la pelle
      ambrata e un mantello chiaro, stringe un bastone che manda bagliori viola, e
      ai suoi piedi un gatto bianco ti guarda senza scomporsi.

      {magia Media} Il bagliore viola del bastone va e viene con il respiro di
      Kessa. Quando lei si arrabbia, il bastone se ne accorge prima di Garin.

      {origine allievo-di-torvessa} All'Accademia ti hanno insegnato a
      guardare le mani di chi lancia, e il bastone solo dopo. Le mani di Kessa
      sono ferme, molto più ferme delle tue il primo anno, e la cosa non ti
      consola.

      Si girano insieme verso di te. Garin alza lo scudo e guarda prima Kessa e
      poi te, facendo i conti.

      {rissa Media} Lo scudo è alto, ma il peso ce l'ha sul piede di dietro,
      quello verso l'uscita. Chi si prepara a combattere lo porta
      avanti.
    opzioni:
      - testo: "Affrontarli tutti e due"
        descrizione: "Uno scudo grande come una porta e una maga con il fuoco in mano. Garin però ha già guardato la porta due volte."
        combattimento: garin-e-kessa
        vittoria:
          titolo: La faccia che urla
          testo: |
            Kessa apre il fuoco per prima, e la fiammata viola ti brucia le sopracciglia
            e incendia una mensola di pergamene. Garin ti viene addosso dietro lo scudo
            con passo pesante e metodico, e ci vuole tempo prima che lo scudo si abbassi
            di un palmo. Quando finalmente cade, finisce lungo disteso sopra la faccia
            dipinta. Kessa brucia fino all'ultimo, finché il bastone le scivola di mano
            e si spegne.

            Il gatto bianco esce dalla porta senza correre, con la coda dritta, come
            uno che ha un appuntamento altrove. Sul tavolo, fra le tavolette
            annerite, c'è un foglio di Kessa con il disegno preciso di un disco rotondo
            coronato di cristalli, e sotto, nella sua calligrafia, *risponde soltanto a
            lei*. Dietro le mensole una scala scende nel buio, e dal basso sale un'aria
            fredda che sa di ferro bruciato.
          imposta: { garin-e-kessa: 1, pista.capomozzo: 4 }
          effetti: { racconto: 1 }
          vai: cuore-di-capomozzo
        sconfitta:
          titolo: Il fuoco viola
          testo: |
            Il fuoco di Kessa ti prende al petto e ti butta contro le mensole, che ti
            rovesciano addosso picconi e tavolette. Garin non ti finisce. Abbassa lo
            scudo, prende Kessa per un braccio e la trascina fuori verso la scala che
            risale alla fortezza, e lei si lascia trascinare con il gatto in braccio,
            guardando indietro verso di te finché non sparisce.

            Ti rialzi dopo un tempo che non sai misurare, con l'odore dei capelli
            bruciati nel naso e una mano che non si chiude bene, e la guardi a lungo
            prima di provarci di nuovo. Dietro le mensole
            rovesciate c'è una scala che scende nel buio, e dal basso sale un'aria
            fredda che sa di ferro bruciato.
          imposta: { garin-e-kessa: 3, pista.capomozzo: 4 }
          effetti: { tormento: 1 }
          vai: cuore-di-capomozzo
      - testo: "Metterli uno contro l'altro"
        descrizione: "Garin vuole andarsene vivo e Kessa vuole il suo mezzelfo. Bisogna che lo dicano ad alta voce prima che lei ti bruci."
        prova: { attributo: sociale, abilita: [persuasione, ingannare, empatia], difficolta: Difficile }
        successo:
          titolo: Siamo in due
          testo: |
            Parli a Garin e non a lei. Gli dici che di sopra la strada è libera e che a
            Qir-Azel nessuno corre dietro a un mercenario che si arrende. Garin ti
            ascolta con lo scudo alzato. Poi lo abbassa e si sposta di fianco a te,
            davanti a Kessa. «Senti, Kessa» dice. «Adesso siamo in due.» Lei guarda a
            lungo Garin e poi il gatto, e alla fine posa il bastone sul tavolo, con
            il viola che si spegne piano come una brace.

            Li chiudi in due celle della prigione e spranghi le porte da fuori. Mentre
            lo fai Garin ti parla del disco rotondo e antico con cui Aurenne comanda le
            macchine del livello di sotto. «Quando la Guardia viene a prenderci» dice
            dalla cella, «dille di portare il pane.» Torni nella sala della ricerca,
            dove dietro le mensole una scala scende nel buio.
          imposta: { garin-e-kessa: 2, pista.capomozzo: 4 }
          effetti: { racconto: 1 }
          vai: cuore-di-capomozzo
        fallimento:
          titolo: Vuole dividerci
          testo: |
            Parli a Garin, ma Kessa capisce prima di lui dove vuoi arrivare. «Vuole
            dividerci, Garin» dice, e il bastone le si accende in mano. Garin esita un
            momento di troppo e poi alza lo scudo dalla sua parte. Il fuoco ti arriva
            addosso di lato, e mentre rotoli dietro il tavolo li senti uscire di corsa
            verso la scala che risale alla fortezza. Ti rialzi con la manica bruciata
            e il braccio sotto pieno di vesciche fino al gomito, e il fuoco viola ci
            mette troppo a spegnersi, e lo soffochi alla fine contro il pavimento. Dietro
            le mensole c'è un'altra scala, che scende nel buio.
          imposta: { garin-e-kessa: 3, pista.capomozzo: 4 }
          effetti: { ferite: 2 }
          vai: cuore-di-capomozzo
      - testo: "Farli arrendere"
        descrizione: "Sei arrivato fin qui attraverso tutta la fortezza, e loro lo sanno. Bisogna soltanto farglielo pesare."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Difficile }
        successo:
          titolo: Lo scudo per terra
          testo: |
            Per un po' non dici niente. Prendi uno sgabello, ti siedi davanti alla porta
            da cui dovrebbero uscire e appoggi le mani sul tavolo, bene in vista. Poi
            gli racconti con calma la strada che hai fatto, dal ponte di corda sopra le
            onde fino alla fortezza di Balthog, e quante porte hai aperto per arrivare
            qui. Non alzi mai la voce, e a un certo punto ti accorgi che è proprio
            questo a funzionare. Garin posa lo scudo per primo, piano, con la faccia dipinta verso il
            pavimento. Kessa resiste un momento in più, finché il gatto le si struscia
            contro la caviglia e lei abbassa il bastone.

            Li chiudi in due celle della prigione e spranghi le porte. Garin, da dietro
            le sbarre, ti racconta del disco rotondo e antico con cui Aurenne comanda le
            macchine del livello di sotto. Dietro le mensole della sala della ricerca
            una scala scende nel buio.
          imposta: { garin-e-kessa: 2, pista.capomozzo: 4 }
          effetti: { racconto: 1 }
          vai: cuore-di-capomozzo
        fallimento:
          titolo: La porta
          testo: |
            Garin ti ascolta e per un momento abbassa lo scudo, ma Kessa ha già acceso
            il bastone. La fiammata viola esplode sul tavolo davanti a te, e mentre ti
            ripari dietro il piano rovesciato Garin la afferra per il mantello e la
            trascina fuori. Li senti correre su per i corridoi, sempre più lontano,
            mentre ti batti le mani sui vestiti che non smettono di fumare. Ti rialzi
            con le mani piene di vesciche e la faccia che tira, senza sopracciglia
            per qualche settimana, e dietro le mensole trovi una scala che scende.
          imposta: { garin-e-kessa: 3, pista.capomozzo: 4 }
          effetti: { ferite: 2 }
          vai: cuore-di-capomozzo
      - testo: "Dire a Kessa dove dorme Isvaro"
        descrizione: "L'hai visto nel ripostiglio in fondo al corridoio, con le bottiglie in fila. Kessa lo cerca da giorni."
        requisiti: [capomozzo.isvaro >= 1]
        esito:
          titolo: Gli stivali addosso
          testo: |
            «Isvaro è nel ripostiglio in fondo al corridoio» dici dalla porta, «su un
            pagliericcio, con gli stivali addosso.» Kessa ti guarda come si guarda
            un cane che parla, poi prende in braccio il gatto e ti passa accanto di
            corsa senza bruciare nessuno, e per un attimo le vedi in faccia una cosa
            che somiglia al sollievo. Garin resta solo con lo scudo alzato, e lo
            abbassa piano.

            «Senti, io me ne vado di sopra» dice, e si sistema l'elmo con due dita. «Tu
            però stai attento al disco rotondo che lei porta al collo. Con quello le
            macchine di sotto fanno quello che vuole lei.» Ti passa accanto rasente il
            muro, e dietro le mensole resta la scala che scende nel buio.
          imposta: { garin-e-kessa: 3, pista.capomozzo: 4 }
          vai: cuore-di-capomozzo
      - testo: "Lasciarli passare"
        descrizione: "La porta è una sola e ci sei tu davanti. Se ti sposti, forse se ne vanno e basta."
        esito:
          titolo: La porta libera
          testo: |
            Ti sposti di lato e tieni le mani bene in vista, con il cuore che ti
            batte più forte di quanto vorresti. Garin capisce per primo,
            prende Kessa per il gomito e la tira verso l'uscita, e lei si lascia
            portare, con il gatto che le trotterella dietro e gli occhi fissi su di te
            finché non è fuori. Sulla soglia Garin si ferma e si volta a mezzo. «Senti»
            dice, «se scendi, guarda il disco rotondo che lei porta al collo. Con quello
            comanda le macchine.» Poi spariscono tutti e due verso la scala che risale
            alla fortezza, e dietro le mensole resta l'altra scala, quella che scende
            nel buio.
          imposta: { garin-e-kessa: 3, pista.capomozzo: 4 }
          vai: cuore-di-capomozzo
      - testo: "Offrire a Garin una paga migliore"
        descrizione: "Garin è qui per la paga, e la paga non basta più. Nei Quartieri Alti un uomo con quello scudo trova lavoro in una settimana, se ha la lettera giusta in tasca."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: La lettera giusta
          testo: |
            Parli a Garin come a casa tua si parla a un capitano della guardia
            che si vuole assumere, e gli guardi lo scudo prima della faccia.
            Gli dici che nei Quartieri Alti le famiglie pagano bene
            chi sa stare in piedi davanti a una porta, e che la lettera per
            presentarlo la scrivi tu, con il sigillo, appena siete di sopra.
            Garin si sistema l'elmo con due dita. «Senti, Kessa» dice, e si
            sposta di fianco a te. «Adesso siamo in due.» Lei guarda il gatto, e
            alla fine posa il bastone sul tavolo, con il viola che si spegne
            piano.

            Li chiudi in due celle della prigione e spranghi le porte. Garin,
            dalla cella, ti parla del disco rotondo e antico con cui Aurenne
            comanda le macchine del livello di sotto, e ti chiede due volte
            della lettera. Dietro le mensole della sala della ricerca una scala
            scende nel buio.
          imposta: { garin-e-kessa: 2, pista.capomozzo: 4 }
          effetti: { racconto: 1 }
          vai: cuore-di-capomozzo
        fallimento:
          titolo: Il sigillo
          testo: |
            Garin ti ascolta con interesse fino al sigillo, poi Kessa ride
            senza allegria. «Ti offre una lettera, Garin. Io ti
            ho dato la paga.» Il bastone le si accende in mano, e Garin alza lo
            scudo dalla sua parte e ti guarda come per scusarsi. Il fuoco viola ti
            arriva addosso mentre rotoli dietro il tavolo, e li senti correre
            su per la scala che risale alla fortezza. Ti rialzi con il braccio
            pieno di vesciche fino al gomito, e dietro le mensole trovi
            un'altra scala, che scende nel buio.
          imposta: { garin-e-kessa: 3, pista.capomozzo: 4 }
          effetti: { ferite: 2 }
          vai: cuore-di-capomozzo
