# Capomozzo, i sotterranei (pista.capomozzo 3 → 4): il livello I sotto la fortezza di Balthog, scavato nei
# primi anni dopo la Caduta dal culto di Nhar'Kael (verbale D1–D15). Ci arrivano due scale, la spirale della
# chiesa e quella dietro il trono di Balthog: l'area non dice da quale si scende.
#
# - `verso-i-sotterranei-di-capomozzo` (pista 3, ripetibile, Scuderie della Zanna Rotta): il rientro dopo una
#   ritirata. Sta in città come quelli di capomozzo-forte e capomozzo-cuore, perché la ritirata riporta in
#   Città Bassa e da lì la fortezza a pista 3 non si raggiunge.
# - area `sotto-capomozzo`: sei stanze ripetibili (D1, D4, D7, D9–D10, D11–D12, D14), in ordine secondo la
#   profondità: 0 la sala dei banchetti o il corridoio degli alloggi, 1 la prigione (la porta col lucchetto),
#   2 il terreno di caccia o la cappella, 3 la sala della guerra, accanto alla sala della ricerca del cuore.
#   Una stanza superata non ricompare nella stessa visita (src/motore/spedizioni.ts).
# - storie non ripetibili: i cuccioli (D3, `cuccioli`), la tana del Pungitore con il corpo di Druzk (D8, dopo
#   il terreno di caccia: la prigione azzera `capomozzo.caccia`, il terreno di caccia lo porta a 1),
#   Zagrath nell'harem (D2, facoltativa), Isvaro negli alloggi (D4a, solo con isvaro 1), gli alloggi di
#   Aurenne (D5, dà il diario ed è richiesta dal cuore).
# - cuore `garin-e-kessa` (D15): in ogni ramo pista.capomozzo 4 e giù per la scala verso il livello II.
# - `la-guerra-privata` (Grifone): chi ha battuto Zagrath lo racconta a Ilvaena.
quality:
  - { id: capomozzo.zagrath, nome: Zagrath nell'harem, categoria: stato, nascosta: true, descrizione: "1 battuto e fuggito, 2 evitato o andato male." }
  - { id: capomozzo.ilvaena, nome: Hai raccontato Zagrath a Ilvaena, categoria: stato, nascosta: true }
  - { id: capomozzo.druzk, nome: Il corpo di Druzk, categoria: stato, nascosta: true, descrizione: "Hai preso le cose di Druzk, chiavi comprese." }
  - { id: capomozzo.isvaro, nome: Hai trovato Isvaro a Capomozzo, categoria: stato, nascosta: true }
  - { id: capomozzo.alloggi, nome: Gli alloggi di Aurenne, categoria: stato, nascosta: true }
  - { id: capomozzo.caccia, nome: Hai attraversato il terreno di caccia, categoria: stato, nascosta: true, descrizione: "1 se in questa visita sei passato dal terreno di caccia e non dalla cappella, perché la tana del Pungitore sta dietro la tenda di liane. La prigione lo azzera." }

aree:
  - id: sotto-capomozzo
    immagine: ambientazione/capomozzo
    nome: I sotterranei di Capomozzo
    sommario: "Sotto la fortezza, un livello scavato nella roccia da un culto dopo la Caduta, dove qualcuno abita ancora."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      In fondo alla scala c'è un corridoio basso che sa di grasso vecchio. Questo
      livello l'ha scavato a scalpello il culto che dopo la Caduta si era
      rifugiato sull'isola, e gli orchi ci hanno piantato nei muri ganci di ferro
      per le lanterne, ognuno con un nastrino bianco. Da nord arriva il colpo
      regolare delle onde, e dal fondo di un corridoio una risata roca di donna.

storylet:
  # ------------------------------------------------------------ 3 · il rientro dopo una ritirata
  - id: verso-i-sotterranei-di-capomozzo
    presso: scuderie-della-zanna-rotta
    immagine: ambientazione/scuderie-della-zanna-rotta
    titolo: Di nuovo verso Capomozzo
    sommario: "Sotto la fortezza di Balthog, in fondo alla scala nella roccia, le lanterne degli orchi sono ancora accese."
    luogo: Città Bassa, Scuderie della Zanna Rotta
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.capomozzo == 3]
    testo: |
      Dolovan Stroud ingrassa una sella davanti alle Scuderie, seduto su un
      secchio rovesciato, mentre il suo cavallo da guerra Squash mangia la paglia
      del box vicino. Non alza la testa quando gli dici dove torni.

      «Prima la fortezza e adesso ci vai sotto. Alla prossima mi racconti che
      scavi. Il prezzo è sempre quello, perché gli orchi non sono diventati più
      simpatici.»
    opzioni:
      - testo: "Partire a piedi"
        descrizione: "Due giorni e mezzo, e le gambe la strada se la ricordano."
        esito:
          titolo: A piedi
          testo: |
            Cammini due giorni e mezzo lungo la costa, con il sale sulle labbra e una
            vescica nuova sul tallone, e il ponte di corda lo attraversi guardando le
            assi e mai le onde. Nella fortezza tieni la testa bassa fino alla scala
            nella roccia, e la scendi contando i nastrini bianchi.
          vai: sotto-capomozzo
      - testo: "Andare a cavallo"
        descrizione: "A cavallo la costa arriva un giorno prima."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il pino storto
          testo: |
            A cavallo la costa arriva un giorno prima. Lo lasci legato al pino storto
            davanti al roveto con una pacca sul collo, che serve più a te che a lui, e
            fai il resto a piedi fino alla scala nella roccia, dove è accesa una
            lanterna ogni tre.
          vai: sotto-capomozzo
      - testo: "Affittare un cavallo da Dolovan"
        descrizione: "Il prezzo è sempre quello."
        requisiti: [monete >= 10]
        costo: 0
        esito:
          titolo: Non Squash
          testo: |
            Dolovan conta le monete senza guardarle e ti indica il pezzato del box in
            fondo. «Non Squash. Squash agli orchi non lo porto più.» Il pezzato si
            ferma a pensarci a ogni ponticello, ma la costa arriva un giorno prima.
          effetti: { monete: -10 }
          vai: sotto-capomozzo

  # ------------------------------------------------------------ le stanze (ripetibili, tre a caso)
  - id: sotto-la-sala-dei-banchetti
    immagine: bestiario/orco
    titolo: La sala dei banchetti
    sommario: "Sei porte storte su una sala bassa, e un vecchio orco che accende le lanterne contandole sulle dita."
    luogo: Sotterranei di Capomozzo, la sala dei banchetti
    area: sotto-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo == 0]
    testo: |
      In fondo alla scala c'è una sala lunga e bassa, con un tavolo tagliato nella
      roccia e sei porte di legno storte. Fra le porte si muove un orco vecchio e
      curvo con una pertica e un secchio d'olio, che accende le lanterne e si
      ferma a contarle sulle dita, ricominciando ogni volta da capo perché alla
      mano sinistra gli manca il mignolo. Tre lanterne ti separano dalla porta che
      ti serve, e lui sta andando da quella parte.
    opzioni:
      - testo: "Passargli alle spalle"
        descrizione: "È vecchio, e quando conta si guarda le dita."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il mignolo
          testo: |
            Aspetti che arrivi alla quarta lanterna, quella dove sbaglia sempre, e
            mentre lui si guarda la mano sinistra passi rasente il muro opposto. Dalla
            soglia lo vedi ricominciare da uno e riaccendere con cura la prima lanterna,
            che era già accesa.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: La pertica
          testo: |
            A metà strada un tappo di sughero ti scricchiola sotto la suola. Il vecchio
            si gira più in fretta di quanto ti aspettassi e ti cala la pertica sulla
            spalla due volte, gridando in orchesco qualcosa che suona più come un
            rimprovero che come un allarme, e torni di corsa in fondo alla scala.
          effetti: { ferite: 0.5 }
      - testo: "Fargli credere di essere uno degli ospiti"
        descrizione: "Gli ospiti di quaggiù sono umani, e al buio inciampano. Lui è abituato a fargli luce."
        prova: { attributo: sociale, abilita: [ingannare, persuasione, galateo], difficolta: Media }
        successo:
          titolo: La luce per l'ospite
          testo: |
            Gli vai incontro senza nasconderti e gli chiedi in tono seccato perché il
            corridoio sia al buio. Il vecchio borbotta delle scuse e ti accompagna
            fino alla porta tenendo alta la pertica con la lanterna, perché tu veda
            dove metti i piedi. Sulla soglia aspetta una mancia che non arriva, e
            torna alle sue lanterne senza offendersi.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: L'odore
          testo: |
            Il vecchio ti annusa da tre passi con la testa inclinata, poi scuote la testa e dice in un comune pieno di sassi «tu
            non puzzi di sotto». Si mette a gridare verso le porte, e tu torni in fondo alla scala ad aspettare che qualcuno gli
            dica di stare zitto.
          effetti: { tormento: 1 }
      - testo: "Chiudere gli sportelli delle lanterne"
        descrizione: "Se le lanterne gli si spengono alle spalle, dovrà tornare indietro a riaccenderle."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il conto che non torna
          testo: |
            Gli sportelli di latta scorrono in una guida unta, e basta un dito per
            chiudere le due lanterne più lontane mentre lui ti dà la schiena. Quando si
            volta e vede il buio dove aveva appena acceso, torna indietro a riaccenderle
            guardandosi le dita con aria offesa, e la strada fino alla porta resta
            libera.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: La latta calda
          testo: |
            Lo sportello della seconda lanterna è rovente e si incastra a metà, e quando
            lo tiri ti bruci i polpastrelli e la latta sbatte con un rumore che rimbomba
            per tutta la sala. Il vecchio arriva con la pertica alzata, e ti ritiri in
            fondo alla scala soffiandoti sulle dita.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare in fondo alla scala che finisca il giro"
        descrizione: "Prima o poi le lanterne finiscono. Lui, a giudicare da come conta, forse no."
        costo: 2
        esito:
          titolo: Seduto sul gradino
          testo: |
            Ti siedi sull'ultimo gradino al buio e lo guardi fare il giro delle
            lanterne, ricominciando da capo ogni volta che arriva al mignolo che non
            c'è. Ci mette quasi un'ora, e a un certo punto ti accorgi che stai
            contando sottovoce anche tu e che sbagli nello stesso punto. Quando
            sparisce in un corridoio laterale attraversi la sala con le gambe
            intorpidite.
          effetti: { profondita.sotto-capomozzo: 1, tormento: 1 }

  - id: sotto-il-corridoio-degli-alloggi
    immagine: ambientazione/capomozzo
    titolo: Il corridoio degli alloggi
    sommario: "Tre stanze da letto lungo un corridoio stretto, e dal fondo arrivano passi pesanti che vanno e vengono."
    luogo: Sotterranei di Capomozzo, gli alloggi
    area: sotto-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo == 0]
    testo: |
      Il corridoio stretto ha tre porte sullo stesso lato e una lanterna in
      fondo. Dietro la prima c'è un letto rifatto, e sul comò una pila di carte
      sotto una scheggia d'ossidiana. Nella seconda, sul letto sfatto, ci sono
      due maschere bianche senza tratti sopra un mucchio di camicie da uomo.
      Nell'ultima le coperte sono piene di peli grigi, e accanto al letto sono
      ammucchiate decine di zampe d'uccello.

      {percezione Media} La calligrafia delle carte è minuta e pende tutta a
      destra, e l'hai già vista.

      Dal fondo arrivano passi pesanti che si avvicinano fino alla lanterna e
      tornano indietro.
    opzioni:
      - testo: "Leggere le carte sotto l'ossidiana"
        descrizione: "Una calligrafia minuta che pende tutta a destra. L'hai già vista."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le brutte copie
          testo: |
            Sono brutte copie di lettere, tutte allo stesso destinatario. Ognuna
            comincia con *Padre*, e la riga dopo è cancellata con tanta forza da bucare
            la carta. In quella che è andata più avanti Isvaro chiede le chiavi
            dell'Acciaieria, e in cambio promette di tacere sulla morte della madre.
            Rimetti le carte sotto l'ossidiana nello stesso ordine prima che tornino i
            passi.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: Sotto il letto
          testo: |
            Quando alzi la testa dalle carte i passi sono già alla porta. Ti butti sotto
            il letto, mentre due piedi d'orco nudi si fermano a un braccio dalla tua
            faccia e ci restano a lungo, e quando se ne vanno ti ritrovi in mano un
            foglio stropicciato che non ricordi di aver preso.
          effetti: { tormento: 1 }
      - testo: "Mettere una delle maschere bianche"
        descrizione: "Gli orchi hanno visto scendere parecchi mascherati e non li hanno visti risalire."
        prova: { attributo: sociale, abilita: [ingannare, intimidire, espressivita], difficolta: Media }
        successo:
          titolo: Il mascherato
          testo: |
            La maschera sa di sudore vecchio. Esci nel corridoio e vai incontro ai passi, e l'orco
            che arriva con una lancia più alta di lui si appiattisce contro il muro e abbassa gli
            occhi finché non sei passato. Dopo l'angolo appendi la maschera a un gancio e ti
            strofini la faccia con la manica fino a farla bruciare.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: I mascherati
          testo: |
            L'orco che arriva ti guarda a lungo con la testa piegata. «I mascherati sono
            tutti giù» dice in un comune spezzato, «e da giù non torna nessuno.» Poi ti
            viene addosso con la lancia, e la punta ti apre la manica e un po' di
            braccio prima che tu giri l'angolo strappandoti la maschera dalla faccia.
          effetti: { ferite: 0.5 }
      - testo: "Chiuderti nella stanza delle zampe d'uccello"
        descrizione: "È quella che puzza di più. Ci entra soltanto chi è costretto."
        costo: 2
        esito:
          titolo: Le zampe
          testo: |
            Ti chiudi dentro con la schiena contro la porta e il naso nella manica. I
            passi si fermano proprio qui fuori, e qualcuno annusa forte, due volte,
            prima di andarsene. Resti un pezzo al buio fra le zampe d'uccello, che a
            guardarle bene sono tutte zampe sinistre, e quando esci l'odore di muffa
            ti viene dietro per tre corridoi.
          effetti: { profondita.sotto-capomozzo: 1, tormento: 1 }

  - id: sotto-il-terreno-di-caccia
    immagine: ambientazione/marea-grigia
    titolo: Il terreno di caccia
    sommario: "Una caverna sul mare dal pavimento liscio, e una cosa a forma di cono che ti aspetta."
    luogo: Sotterranei di Capomozzo, la caverna sul mare
    area: sotto-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo == 2]
    testo: |
      La caverna si apre a est sul mare dietro una tenda di liane, con il
      pavimento levigato da qualcosa che ci striscia sopra. Su una trave qualcuno
      ha scritto col carbone *Pungitore*, e sotto *non entrare*, nella calligrafia
      minuta che pende a destra.

      Fra le liane si muove una forma conica con decine di occhi rossi. Due
      tentacoli si srotolano verso di te, uno con un pungiglione e l'altro con un
      grumo lucido che si apre e si chiude.

      {origine figlio-del-circolo} Al Circolo si ascolta una bestia prima di
      guardarla, e questa non fa rumori che il mare non copra.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "Ha due tentacoli e decine di occhi. Il corpo però sta fermo, e un corpo fermo si colpisce."
        combattimento: pungitore
        vittoria:
          titolo: Il cono vuoto
          testo: |
            Il pungiglione ti cerca la faccia e il grumo le gambe, finché trovi la
            giuntura dove i tentacoli entrano nel corpo e il metallo è sottile. Il colpo
            la apre, e dal cono esce un liquido scuro che puzza di olio di pesce, mentre
            gli occhi rossi si spengono a uno a uno.
          imposta: { capomozzo.caccia: 1 }
          effetti: { profondita.sotto-capomozzo: 1 }
        sconfitta:
          titolo: Il grumo
          testo: |
            Il grumo ti si attacca al polpaccio e comincia a tirare, e senti la gamba farsi fredda dal ginocchio in giù.
            Lo tagli via con tre colpi e scappi nel corridoio zoppicando, mentre il cono torna fra le liane ad aspettare
            il prossimo gabbiano.
      - testo: "Correre lungo la parete, fra le liane"
        descrizione: "Lungo il bordo la roccia è ruvida, e le liane forse reggono un uomo."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Le liane
          testo: |
            Ti aggrappi alle liane e corri lungo la parete con i piedi sulla roccia del
            bordo, dove il cono non ha levigato niente. Il pungiglione colpisce una
            volta nel punto dov'eri un momento prima, e dall'altra parte, quando ti
            volti, lui sta ancora guardando il punto sbagliato con tutti i suoi occhi.
          imposta: { capomozzo.caccia: 1 }
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: Il pavimento liscio
          testo: |
            A metà una liana si stacca, e scivoli sul pavimento liscio verso il centro
            senza poterti fermare. Il pungiglione ti prende alla spalla con un
            bruciore d'aceto in una ferita, e ti trascini fuori con le unghie sulla
            pietra. Nel corridoio ti tasti la spalla gonfia, che scotta al tatto.
          effetti: { ferite: 0.5 }
      - testo: "Capire come caccia"
        descrizione: "Per terra ci sono penne di gabbiano. Una cosa che caccia uccelli guarda quello che si muove."
        prova: { attributo: mentale, abilita: [natura, tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il mantello
          testo: |
            Lo osservi a lungo da dietro lo spigolo, finché capisci che gli occhi si
            accendono soltanto verso quello che si muove in fretta. Sfili il mantello e
            lo butti verso l'apertura, dove il vento lo fa sbattere fra le liane, e
            mentre il cono ci si avventa con tutti e due i tentacoli tu attraversi la
            caverna a passo lento, lasciandogli il tuo mantello migliore.
          imposta: { capomozzo.caccia: 1 }
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: Troppo lento
          testo: |
            Ti muovi piano, convinto che guardi soltanto quello che corre, e ti sbagli.
            Gli occhi rossi si girano verso di te tutti insieme, e il pungiglione ti
            sfiora il collo lasciandoti sotto l'orecchio una riga di fuoco che non
            smette di pulsare.
          effetti: { ferite: 0.5 }
      - testo: "Passare di corsa e lasciarti pungere"
        descrizione: "La caverna è larga venti passi. Il pungiglione arriva una volta, forse due."
        costo: 2
        esito:
          titolo: Venti passi
          testo: |
            Attraversi di corsa con le braccia sopra la testa e gli stivali che slittano
            sulla pietra liscia. Il pungiglione ti prende due volte alla schiena e il
            grumo ti sfiora una caviglia senza attaccarsi, e dall'altra parte ti appoggi
            al muro ad aspettare che il bruciore diventi sopportabile.
          imposta: { capomozzo.caccia: 1 }
          effetti: { profondita.sotto-capomozzo: 1, ferite: 0.5 }

  - id: sotto-la-prigione
    immagine: fazioni/tribu-capomozzo
    titolo: La prigione
    sommario: "Sei celle aperte, una gabbia di spuntoni e una porta chiusa con un lucchetto grosso come un pugno."
    luogo: Sotterranei di Capomozzo, la prigione
    area: sotto-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo == 1]
    testo: |
      Sul lato sud della prigione ci sono sei celle con le porte aperte, e sui
      muri i prigionieri hanno contato i giorni a tacche di cinque, con la sbarra
      di traverso. Oltre un arco basso c'è la tana del carceriere, con gli
      attrezzi appesi sopra un bancone dove è inciso a punta di coltello un nome,
      *Druzk*.

      {origine fuggiasco-di-ghoran} Le tacche a cinque con la sbarra le facevi
      anche tu, sul palo del recinto, con l'unghia del pollice.

      La porta in fondo è chiusa con un lucchetto grosso come un pugno, e le
      chiavi non si vedono.
    opzioni:
      - testo: "Aprire il lucchetto con un attrezzo del carceriere"
        descrizione: "Sul bancone c'è un uncino sottile con la punta piegata, buono anche per una serratura."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: L'uncino
          testo: |
            Infili l'uncino e senti le leve una per una, come denti sotto la lingua, finché l'ultima cede con uno
            scatto. Prima di andare rimetti l'uncino al suo chiodo, perché chi l'ha appeso lì ci teneva, e oltre la
            porta prendi un corridoio basso che puzza di mare.
          imposta: { capomozzo.caccia: 0 }
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: La punta spezzata
          testo: |
            L'uncino si spezza dentro il lucchetto, e la punta resta incastrata fra le
            leve. Provi a tirarla fuori con le unghie finché ti sanguina un dito, poi
            rimetti al suo chiodo il manico rotto, senza sapere bene perché, e torni
            indietro succhiandoti il dito che sa di ruggine.
          effetti: { ferite: 0.5 }
      - testo: "Scardinare la porta"
        descrizione: "Il lucchetto è robusto. I cardini li hanno montati gli orchi."
        prova: { attributo: fisico, abilita: [atletica, resistenza, rissa], difficolta: Media }
        successo:
          titolo: I cardini
          testo: |
            I cardini sono fissati con chiodi di nave piantati nel legno marcio. Ci dai
            di spalla tre volte, e alla terza il legno si apre intorno ai chiodi con un
            rumore umido. La porta resta appesa di sbieco al lucchetto intatto, e ci
            passi sotto piegato in due.
          imposta: { capomozzo.caccia: 0 }
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: La spalla
          testo: |
            Ci dai di spalla finché la spalla ti manda una fitta fino all'orecchio, e la
            porta si limita a tremare. Il rumore rimbomba per tutte le celle, e torni
            indietro prima di scoprire se qualcuno ha sentito, con il braccio stretto al
            fianco.
          effetti: { ferite: 0.5 }
      - testo: "Aprire con le chiavi di Druzk"
        descrizione: "Le hai prese dal collo del carceriere, nella tana del Pungitore. Una dovrebbe essere questa."
        requisiti: [capomozzo.druzk >= 1]
        esito:
          titolo: La chiave giusta
          testo: |
            Provi le chiavi una dopo l'altra, e la settima gira con il rumore pulito di
            una serratura che Druzk ungeva anche quando di prigionieri non ce n'erano
            più. Sul bancone, accanto al suo nome, c'è un chiodo vuoto della misura
            giusta, ma il mazzo te lo rimetti alla cintura.
          imposta: { capomozzo.caccia: 0 }
          effetti: { profondita.sotto-capomozzo: 1 }
      - testo: "Strisciare dal buco nell'ultima cella"
        descrizione: "Nell'ultima cella le tacche sono più fitte, e sotto la branda c'è un buco nel muro."
        costo: 2
        esito:
          titolo: Le tacche
          testo: |
            Nell'ultima cella le tacche arrivano fino al soffitto, e sotto la branda
            c'è un buco nel muro largo appena una spalla. Ci strisci dentro sui gomiti,
            e a metà strada la mano ti finisce su un mucchio di ossa di topo messe in
            ordine da chi ha scavato. Sbuchi in un corridoio dall'altra parte tenendo
            la mano stretta al petto.
          imposta: { capomozzo.caccia: 0 }
          effetti: { profondita.sotto-capomozzo: 1, ferite: 0.5 }

  - id: sotto-la-cappella
    immagine: ambientazione/mito-regina-ali-spezzate
    titolo: La cappella di Nhar'Kael
    sommario: "Una statua gravida con la testa d'uccello, un altare di cenere e una trentina di maschere bianche."
    luogo: Sotterranei di Capomozzo, la cappella
    area: sotto-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo == 2]
    testo: |
      Nella cappella i bracieri fanno un fumo rosso. Sulla pedana in fondo c'è la
      statua di una donna gravida alta tre metri, con la testa d'uccello e due ali
      spezzate di piume e lamine di metallo, e in ogni mano un coltello ricurvo.

      Sull'altare c'è un mucchio di cenere e schegge d'osso, e intorno sono sparse
      una trentina di maschere bianche. Mentre le guardi, una si solleva da terra.

      {origine accolito-del-velo} Qui le labbra ti cominciano da sole la preghiera
      della sera.

      {origine apprendista-raschiatore} Sulle piattaforme, a chi risale sentendo
      voci, si nomina Mirn il Sordo e si cambia discorso.
    opzioni:
      - testo: "Affrontare le ombre dietro le maschere"
        descrizione: "Dietro ogni maschera che si alza prende forma un'ombra. Per ora sono due."
        combattimento: senzavolto
        vittoria:
          titolo: La fibbia
          testo: |
            Colpisci dove dovrebbe esserci una faccia, e il fumo nero si strappa come
            stoffa bagnata mentre le maschere si spaccano sul marmo. Nella cenere
            dell'altare luccica una fibbia di bronzo con l'Albero inciso, di quelle che
            chiudono le vesti bianche dei sacerdoti. *La bara di Sollen non l'hanno
            rubata per tenerla.* Te la metti in tasca senza voltarti verso la statua.
          effetti: { profondita.sotto-capomozzo: 1 }
        sconfitta:
          titolo: I sussurri
          testo: |
            Le ombre fredde ti passano attraverso, e a ogni passaggio ti portano via
            qualcosa di piccolo, il nome di una via della Città Bassa o il sapore del
            pane del mattino. Scappi con le mani sulle orecchie, e nel corridoio ti
            ripeti ad alta voce come ti chiami finché la voce non torna tua.
      - testo: "Scacciarli con l'esorcismo"
        descrizione: "La Liturgia dell'Albero ha parole per ciò che non dovrebbe restare. Qui non dovrebbe restare niente."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le parole
          testo: |
            Dici le parole della Liturgia, e a ogni frase le ombre dietro le maschere si
            fanno più sottili, finché il fumo rosso ci passa attraverso. Le maschere
            cadono sul marmo una dopo l'altra, con il rumore leggero dei piatti
            impilati, e passi accanto all'altare con la testa bassa senza guardare la
            statua.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: Mezza formula
          testo: |
            A metà formula la voce ti si incrina, e il Mana ti torna indietro come uno
            schiaffo dietro gli occhi. Esci dalla cappella camminando all'indietro, con
            il sapore del sangue in bocca e la formula che ti si ripete in testa
            sbagliata, sempre allo stesso punto.
          effetti: { tormento: 1 }
      - testo: "Recitare a mente qualcosa che sai bene"
        descrizione: "I sussurri cercano un posto vuoto nella testa. Basta non lasciargliene."
        prova: { attributo: mentale, abilita: [resilienza, accademiche], difficolta: Media }
        successo:
          titolo: La tabellina del sette
          testo: |
            Ti ripeti a mente la cosa più noiosa che sai, la tabellina del sette, mentre
            cammini in mezzo alle maschere. I sussurri ci sbattono contro e scivolano
            via, perché nella tabellina del sette non c'è niente da prendere, e al sette
            per nove sbagli e ricominci, ma ormai sei alla porta in fondo.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: Il posto vuoto
          testo: |
            A un certo punto perdi il filo, e in quel buco i sussurri entrano tutti
            insieme. Per un momento sei sicuro di avere una maschera sulla faccia, e
            torni nel corridoio a passi lunghi toccandoti il naso e la cicatrice
            piccola sul mento.
          effetti: { tormento: 1 }
      - testo: "Parlare alle maschere come a delle persone"
        descrizione: "Prima della maschera avevano un nome e una casa. Forse a qualcuno torna in mente."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Faccia in giù
          testo: |
            Parli alle maschere a voce bassa, come ai malati con la febbre, e gli dici
            che la donna che li ha portati quaggiù li ha dati in pasto alla statua e
            che adesso possono smettere di farle la guardia. Una dopo l'altra le
            maschere smettono di girare e si posano a terra con la faccia in giù, e
            quando esci le ultime stanno ancora scendendo.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: Il coro
          testo: |
            Appena apri bocca le maschere ti rispondono con la tua voce, ripetendo le
            tue parole un momento dopo di te, con la stessa esitazione sulle doppie. Ti
            zittisci, e loro continuano lo stesso. Esci camminando all'indietro, e per
            tutto il corridoio la tua voce ti segue sempre più piano.
          effetti: { tormento: 1 }
      - testo: "Coprirti le orecchie e correre"
        descrizione: "La porta in fondo è a trenta passi. Trenta passi si fanno anche senza ascoltare."
        costo: 2
        esito:
          titolo: Trenta passi
          testo: |
            Ti premi le mani sulle orecchie e corri lungo le colonne con gli occhi
            bassi. I sussurri passano lo stesso attraverso le dita e ti arrivano come un
            prurito dietro gli occhi, e quando togli le mani ti restano sulle tempie
            otto mezzelune rosse lasciate dalle unghie.
          effetti: { profondita.sotto-capomozzo: 1, tormento: 1 }

  - id: sotto-la-sala-della-guerra
    immagine: ambientazione/evento-razzia-festival-150
    titolo: La sala della guerra
    sommario: "Una lavagna con Qir-Azel disegnata a gesso strada per strada. Dalla stanza accanto arrivano due voci che litigano."
    luogo: Sotterranei di Capomozzo, la sala della guerra
    area: sotto-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo == 3]
    testo: |
      Sulla parete nord una lavagna mostra Qir-Azel disegnata a gesso strada per
      strada, con i ponti contati e frecce che arrivano dalla costa e da sotto la
      città. Gli appunti ai margini sono di due mani, una minuta che pende a
      destra e una grande che ha spezzato il gesso tre volte.

      {origine figlio-della-citta-bassa} Fra i vicoli segnati con una crocetta c'è
      quello dove ti nascondevi dalle guardie.

      {origine mercante-dei-ponti} I ponti sono contati giusti, scale di raccordo
      comprese.

      Dalla porta sul fondo arrivano le voci di un uomo e di una donna che
      litigano.
    opzioni:
      - testo: "Leggere gli appunti"
        descrizione: "La calligrafia minuta la conosci. Quella grossa è di un orco che ha imparato a scrivere tardi."
        prova: { attributo: mentale, abilita: [accademiche, percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il titano dormiente
          testo: |
            Gli appunti grossi sono sgrammaticati e quelli minuti precisi. Parlano di una
            seconda razzia fra poche settimane, con tutte le tribù chiamate alle armi e le
            Colate dell'Ira che salgono da sotto la città, e in cima alla lavagna c'è scritto
            *prima domare il titano dormiente*. *La vasca dell'Aula dell'Ira è asciutta, e
            quaggiù non lo sa ancora nessuno.* Ti allontani dalla lavagna piano, per non far
            stridere niente.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: La sedia
          testo: |
            Ti avvicini per leggere e il ginocchio urta una sedia, che stride sulla pietra.
            Le voci di là si zittiscono di colpo, e resti piegato sotto il tavolo a fissare
            la pozza di vino secco finché l'uomo dice qualcosa di sgarbato e la donna
            ricomincia a rispondergli. Della lavagna ti restano in mente soltanto le frecce.
          effetti: { tormento: 1 }
      - testo: "Passare oltre rasente il muro"
        descrizione: "Di là sono occupati a litigare. Finché litigano, non ascoltano."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Rasente il muro
          testo: |
            Passi lungo il muro mettendo i piedi dove il gesso caduto non scricchiola.
            Di là l'uomo alza la voce sul nome di Isvaro, e la donna lo zittisce con
            una parola sola. Sei già alla porta sul fondo quando una sedia si rovescia
            e l'uomo impreca contro la sedia e contro la paga, e ti trovi d'accordo con
            lui almeno sulla paga.
          effetti: { profondita.sotto-capomozzo: 1 }
        fallimento:
          titolo: Il gesso
          testo: |
            Il gesso caduto ti scricchiola sotto lo stivale come zucchero, e di là le voci si fermano a metà
            di una parola. La porta si apre di un dito e si richiude, e torni indietro di corsa per il
            corridoio da cui sei venuto, fermandoti soltanto quando di là ricominciano a litigare.
          effetti: { tormento: 1 }
      - testo: "Nasconderti sotto il tavolo e ascoltare"
        descrizione: "Di là stanno litigando su qualcuno che conosci. Vale la pena sentire chi."
        costo: 2
        esito:
          titolo: Sotto il tavolo
          testo: |
            Ti infili sotto il tavolo fra le gambe delle sedie e resti lì a lungo, con
            le ginocchia contro il petto. Di là parlano di Isvaro e di soldi, e poi di
            una donna che lui chiama pazza con paura e lei con invidia. Quando esci
            hai i crampi alle gambe, e delle due voci sai abbastanza da riconoscerle
            al buio.
          effetti: { profondita.sotto-capomozzo: 1, tormento: 1 }

  # ------------------------------------------------------------ i cuccioli (una volta sola)
  - id: le-gabbie-dei-cuccioli
    immagine: bestiario/orco
    titolo: Le gabbie dei cuccioli
    sommario: "Una dozzina di gabbie di assi lungo le pareti. In tre c'è qualcosa di verde che ringhia."
    luogo: Sotterranei di Capomozzo, la nursery
    area: sotto-capomozzo
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo >= 1, cuccioli == 0]
    testo: |
      La stanza è più calda delle altre e puzza di paglia marcia. Delle gabbie
      basse lungo le pareti solo tre sono occupate, da cuccioli d'orco alti mezzo
      metro che appena ti vedono si buttano contro le sbarre e ringhiano, con una
      voce a metà fra quella di un bambino e quella di un cane. Il più grande ha
      un orecchio mangiato a metà da un fratello. Fra le gabbie c'è una ciotola
      sola, rovesciata, perché imparino a strapparsi il cibo di mano.

      {addestrare-animali Media} Ringhiano con più paura che rabbia, come cani
      legati troppo corti.

      Il più piccolo smette di ringhiare per primo e allunga fra le sbarre una
      mano aperta. *Vuole da mangiare, o vuole vedere se mordi.* Le dita ti vanno
      da sole alla tasca della carne secca. Accanto alla porta, appesa a un chiodo
      con un pezzo di spago, c'è la chiave delle gabbie.
    opzioni:
      - testo: "Dar loro da mangiare e aprire le gabbie"
        descrizione: "Carne secca, una gabbia alla volta, e le mani lontane dai denti."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: Tre parti uguali
          testo: |
            Spezzi la carne secca in tre parti uguali e apri le gabbie una alla volta,
            cominciando dal più piccolo. Ognuno mangia il suo pezzo in un angolo, poi
            escono in fila verso il rumore del mare, e il più piccolo si ferma sulla
            soglia a guardarti con la testa piegata, come per ricordarsi la tua
            faccia.
          imposta: { cuccioli: 1 }
          effetti: { racconto: 1 }
        fallimento:
          titolo: I denti
          testo: |
            Apri la prima gabbia e il più grande ti salta sul braccio, con i denti già
            da adulto. Te lo stacchi di dosso e lui scappa dalla porta, e gli altri due
            lo seguono appena apri le loro gabbie, senza toccare la carne. Il morso è
            una mezzaluna piccola e profonda.
          imposta: { cuccioli: 1 }
          effetti: { ferite: 0.5 }
      - testo: "Aprire le gabbie da lontano"
        descrizione: "Con la chiave legata in cima a una lancia rotta. Poi quello che fanno è affar loro."
        esito:
          titolo: Un braccio e mezzo
          testo: |
            Leghi la chiave in cima a una lancia rotta e apri le gabbie una per una,
            tenendoti a un braccio e mezzo dalle sbarre. I cuccioli escono ringhiando,
            ti girano intorno due volte annusandoti gli stivali e poi spariscono dalla
            porta, verso il rumore del mare. Rimetti la chiave al suo chiodo, come l'hai
            trovata.
          imposta: { cuccioli: 1 }
      - testo: "Lasciarli dove sono"
        descrizione: "Fuori di qui non durerebbero un giorno. E non sono affari tuoi."
        esito:
          titolo: La ciotola
          testo: |
            Raddrizzi la ciotola e ci metti dentro tutta la carne secca che hai in
            tasca prima di richiudere la porta. Da dietro il legno senti tre voci che
            si azzuffano intorno a una ciotola sola, e resti nel corridoio ad
            ascoltarle finché smettono, senza sapere se è un buon segno.
          imposta: { cuccioli: 2 }
      - testo: "Dividere la carne come si faceva nei recinti"
        descrizione: "A Ghoran tenevano così anche gli schiavi giovani, e tu sai come si fa a non litigare."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Tre mucchi
          testo: |
            La ciotola sola la conosci. Nei recinti di Ghoran ai ragazzi ne davano
            una ogni cinque, perché imparassero chi era il più forte, e tu avevi
            imparato a mangiare di spalle con un gomito alzato. Dividi la carne
            secca in tre mucchi uguali e ne spingi uno dentro ogni gabbia, e
            quando apri escono in fila, il più grande per ultimo, verso il rumore
            del mare.
          effetti: { racconto: 1 }
          imposta: { cuccioli: 1 }
      - testo: "Accucciarti e porgere la mano da sotto"
        descrizione: "Al Circolo hai imparato che una bestia spaventata si avvicina a chi sta più in basso di lei."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Facile }
        successo:
          titolo: Più in basso
          testo: |
            Ti accucci sotto le sbarre con la carne secca sul palmo aperto, come
            al Circolo con le bestie che hanno paura. Il più piccolo arriva per
            primo e ti annusa le dita prima di prendere il suo pezzo, e gli altri
            due lo seguono ringhiando sempre meno. Quando apri le gabbie escono in
            fila verso il rumore del mare, e il più piccolo si ferma sulla soglia
            a guardarti.
          imposta: { cuccioli: 1 }
          effetti: { racconto: 1 }
        fallimento:
          titolo: Le mani
          testo: |
            Per un po' sembra funzionare, poi il più grande ti afferra il polso
            con tutte e due le mani e i denti arrivano subito dopo. Te lo stacchi
            di dosso e apri le gabbie in fretta, e i tre spariscono senza toccare
            la carne. Al Circolo nessuno ti aveva parlato di bestie che usano le
            mani.
          imposta: { cuccioli: 1 }
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ la tana del Pungitore (una volta sola)
  - id: la-tana-del-pungitore
    immagine: ambientazione/rovine-dei-precursori
    titolo: La tana del Pungitore
    sommario: "Dietro le liane c'è un pavimento di carcasse vuote, e un orco con la spada ancora in mano."
    luogo: Sotterranei di Capomozzo, la tana del Pungitore
    area: sotto-capomozzo
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo >= 3, capomozzo.caccia == 1, capomozzo.druzk == 0]
    testo: |
      Oltre il terreno di caccia, dove la caverna fa una curva verso il mare, c'è la tana. Il pavimento è
      coperto di carcasse di gabbiani, e fra gli uccelli giacciono una decina di orchi vuoti, con la pelle
      seccata intorno alle ossa come un uovo bevuto da un buco.

      Uno è più grosso degli altri, con un'armatura di pelle di cinghiale cucita a strati e la mano
      stretta sull'elsa di una spada larga e ricurva su cui è inciso *Druzk* in lettere storte. Al collo
      porta un anello di ferro con una dozzina di chiavi da carceriere.

      Dall'apertura sul mare arriva il fruscio delle liane, e a ogni fruscio ti giri a guardare.
    opzioni:
      - testo: "Sfilargli l'armatura a forza"
        descrizione: "La pelle secca si è incollata al cuoio. Bisogna tirare, e tirare forte."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Strato per strato
          testo: |
            Punti un piede sul petto del morto e tiri, e l'armatura viene via con un
            rumore di carta strappata. La spada non la vuole lasciare, e gli apri le
            dita una per una, leggere come rametti secchi, scusandoti sottovoce.
            Prendi anche le chiavi ed esci prima che le liane si muovano di nuovo.
          imposta: { capomozzo.druzk: 1 }
          effetti: { oggetto.spada-di-druzk: 1, oggetto.armatura-di-druzk: 1 }
        fallimento:
          titolo: Il padrone di casa
          testo: |
            Tiri troppo forte, e cadi all'indietro fra i gabbiani secchi con l'armatura
            in mano e un rumore di paglia. Dall'apertura sul mare entra il Pungitore.
            Afferri la spada e le chiavi e corri, e il pungiglione ti prende alla coscia
            proprio sulla soglia, mentre ti trascini dietro l'armatura per una cinghia.
          imposta: { capomozzo.druzk: 1 }
          effetti: { oggetto.spada-di-druzk: 1, oggetto.armatura-di-druzk: 1, ferite: 1 }
      - testo: "Tagliare le cinghie con calma"
        descrizione: "Le cinghie sono di cuoio, e il cuoio si taglia. Bisogna sapere dove finisce lui e dove comincia l'armatura."
        prova: { attributo: mentale, abilita: [medicina, percezione], difficolta: Media }
        successo:
          titolo: Le cinghie
          testo: |
            Tagli le cinghie sotto le ascelle e lungo i fianchi, e l'armatura si apre
            come un guscio. La spada gliela sfili girandogli piano il polso, e le chiavi
            gliele togli per ultime, dalla testa, come una collana. Gli chiudi la mano
            vuota sul petto, perché a Druzk l'ordine piaceva.
          imposta: { capomozzo.druzk: 1 }
          effetti: { oggetto.spada-di-druzk: 1, oggetto.armatura-di-druzk: 1 }
        fallimento:
          titolo: Dentro
          testo: |
            Tagli una cinghia di troppo, e il torace del morto si apre insieme
            all'armatura. Dentro è pulito come l'interno di una conchiglia. Prendi tutto
            senza guardare più giù, e ti accorgi di aver camminato all'indietro soltanto
            quando sei di nuovo nel corridoio.
          imposta: { capomozzo.druzk: 1 }
          effetti: { oggetto.spada-di-druzk: 1, oggetto.armatura-di-druzk: 1, tormento: 1.5 }
      - testo: "Prendere tutto con le mani nel marcio"
        descrizione: "Senza tecnica e senza fretta, ci vuole il tempo che ci vuole e un naso che regge."
        costo: 2
        esito:
          titolo: Il tempo che ci vuole
          testo: |
            Lavori a mani nude fra i gabbiani, slacciando quello che si slaccia e strappando
            il resto, e ogni poco il fruscio delle liane ti fa voltare. Ci metti un'ora e a
            metà vomiti in un angolo, lontano dal lavoro. Esci con l'armatura e la spada fra
            le braccia e le chiavi al collo, e con un odore addosso che ti resta per due
            giorni.
          imposta: { capomozzo.druzk: 1 }
          effetti: { oggetto.spada-di-druzk: 1, oggetto.armatura-di-druzk: 1, tormento: 1 }
      - testo: "Spogliarlo come una carcassa sulle piattaforme"
        descrizione: "Sulle piattaforme le carcasse si aprono in fretta dalle giunture, senza guardarle in faccia."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, resistenza], difficolta: Facile }
        successo:
          titolo: Dalle giunture
          testo: |
            Cominci dalle giunture, come sulle piattaforme, dove una carcassa si
            smonta dal punto in cui i pezzi si toccano. Le fibbie arrugginite
            cedono con un colpo di pugnale ciascuna. Poi liberi la spada facendo
            leva sull'elsa e sfili le chiavi per ultime, mentre la testa resta
            sull'apertura dove frusciano le liane.
          imposta: { capomozzo.druzk: 1 }
          effetti: { oggetto.spada-di-druzk: 1, oggetto.armatura-di-druzk: 1 }
        fallimento:
          titolo: Il guscio
          testo: |
            Fai leva su una giuntura che non è una giuntura, e il torace del morto
            si apre insieme all'armatura. Dentro è liscio come una conchiglia, e
            sulle piattaforme una carcassa non è mai così pulita. Ti serve un bel
            po' prima che le mani smettano di tremare.
          imposta: { capomozzo.druzk: 1 }
          effetti: { oggetto.spada-di-druzk: 1, oggetto.armatura-di-druzk: 1, tormento: 1.5 }

  # ------------------------------------------------------------ Zagrath nell'harem (facoltativa)
  - id: zagrath-nell-harem
    immagine: personaggi/zagrath
    titolo: L'harem di Dorbak
    sommario: "Da dietro una porta arrivano odore di aceto e di fiori marci e una risata di donna."
    luogo: Sotterranei di Capomozzo, l'harem di Dorbak
    area: sotto-capomozzo
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo >= 1, capomozzo.zagrath == 0]
    testo: |
      La stanza puzza di aceto e fiori marci, ed è il profumo di quattro orchesse
      grosse con le guance dipinte di rosso, sedute in cerchio fra cuscini e
      pellicce di cavallo. Erano le mogli di Dorbak, il capoguerra del cinghiale
      corazzato morto alla razzia del Festival, e da allora nessuno viene più a
      trovarle.

      {empatia Media} Il profumo è per qualcuno che non viene più, e ogni mattina
      ne mettono un po' di più.

      In mezzo siede un mezzo ogre enorme, con il naso rotto tante volte che non
      ha più una direzione. Un'orchessa lo pettina con un pettine d'osso e
      un'altra lo imbocca con dei datteri.

      *Zagrath, con l'arco lungo quanto Ilvaena.* Lui si toglie un dattero di
      bocca. «Hai scelto il momento sbagliato per morire» dice con la voce
      impastata, e allunga la mano verso l'arco, mentre quella col pettine lo
      stringe come un coltello.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "È mezzo nudo e ha la bocca piena di datteri. Una delle vedove però ha già preso la mazza."
        combattimento: zagrath
        vittoria:
          titolo: Dillo all'elfa
          testo: |
            Tira due frecce prima che tu arrivi ai cuscini, poi da vicino l'arco non gli
            serve più. Quando Zagrath cade in ginocchio sanguina dal naso e ride. «Dillo
            all'elfa. Dille che questa per noi due conta zero, perché lei qui non
            c'era.» Le orchesse gli si buttano addosso a strillare, e lui ne approfitta
            per strisciare fuori dalla porta sul retro con l'arco in mano, e tu lo lasci
            andare.
          imposta: { capomozzo.zagrath: 1 }
          effetti: { racconto: 1 }
        sconfitta:
          titolo: Le frecce nere
          testo: |
            La prima freccia ti prende alla spalla prima che tu abbia fatto tre passi, e
            la seconda ti inchioda il mantello allo stipite. Lo strappi e scappi nel
            corridoio, con le orchesse che ti tirano dietro i cuscini e Zagrath che ride
            sdraiato, senza nemmeno alzarsi.
          imposta: { capomozzo.zagrath: 2 }
      - testo: "Raccontare alle vedove come è morto Dorbak"
        descrizione: "Il giorno del Festival Dorbak è caduto alla porta nord, e nessuno l'ha mai raccontato alle vedove."
        prova: { attributo: sociale, abilita: [empatia, espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Il capoguerra
          testo: |
            Alzi le mani vuote e racconti di come Dorbak è caduto alla porta nord senza
            fare un passo indietro, con parecchio di quello che le vedove vogliono
            sentire. La più vecchia comincia a piangere a voce altissima e le altre le
            vanno dietro, finché si ricordano che sui cuscini del marito c'è un
            estraneo e Zagrath raccoglie l'arco e se ne va borbottando.
          imposta: { capomozzo.zagrath: 2 }
        fallimento:
          titolo: Il pettine
          testo: |
            Cominci a parlare di Dorbak, e la più giovane delle vedove ti tira il
            pettine in faccia, perché come è morto non lo vogliono sentire da uno che
            stava dall'altra parte. Zagrath tende l'arco ridendo, e la freccia ti apre
            il fianco mentre ti butti fuori dalla porta. Nel corridoio ti premi la
            mano sulla ferita, con il sangue che passa fra le dita.
          imposta: { capomozzo.zagrath: 2 }
          effetti: { ferite: 2 }
      - testo: "Parlargli della bilancia di Ghoran"
        descrizione: "Lui la gente la vende ai mercanti di Ghoran, e tu da quella bilancia sei sceso con le tue gambe."
        requisiti: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [intimidire, ingannare], difficolta: Media }
        successo:
          titolo: La bilancia
          testo: |
            Gli dici che a Ghoran sei salito sulla bilancia anche tu, e che ne sei sceso
            da solo senza chiedere il permesso a nessuno. Lo dici piano, guardandogli le
            mani come guardavi i sorveglianti dei recinti. Zagrath smette di masticare,
            poi si sdraia sui cuscini con la faccia verso il muro, e una delle orchesse
            ti indica la porta con il pettine.
          imposta: { capomozzo.zagrath: 2 }
        fallimento:
          titolo: Il doppio
          testo: |
            Zagrath si mette a ridere. «Uno scappato da Ghoran vale il doppio a
            riportarcelo.» Le orchesse ti vengono addosso, e la vedova con la mazza
            ti prende alle costole. Ti liberi lasciando nelle loro mani mezza
            camicia, mentre Zagrath ti grida dietro quanto varresti a Ghoran.
          imposta: { capomozzo.zagrath: 2 }
          effetti: { ferite: 2 }
      - testo: "Richiudere la porta"
        descrizione: "Nessuno si è ancora alzato dai cuscini. Puoi sempre fingere di avere sbagliato stanza."
        esito:
          titolo: Stanza sbagliata
          testo: |
            Chiedi scusa a voce alta, come in una locanda dove hai sbagliato camera, e
            richiudi la porta. Da dentro arriva una risata grassa di Zagrath, poi
            quelle delle orchesse, e nessuno si alza. Prima di andartene incidi una
            croce sul legno con la punta del coltello, per ricordarti di non riaprirla.
          imposta: { capomozzo.zagrath: 2 }
      - testo: "Trattare con lui come con un cliente dei Ponti"
        descrizione: "Zagrath baratta merce rubata con alcol e notizie, e le notizie dei Ponti le hai tu."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il prezzo del sale
          testo: |
            Ti siedi sul cuscino più vicino alla porta, come al banco ti siedi
            dalla parte della strada, e gli racconti che le carovane del sale
            salgono con il doppio della scorta e quali banchi dei Ponti comprano
            senza chiedere da dove arriva la roba. «Un mercante» dice Zagrath,
            come si dice di un animale raro, e sputa il nocciolo di un dattero.
            «Vattene, mercante. Questa te la lascio gratis.»
          imposta: { capomozzo.zagrath: 2 }

  # ------------------------------------------------------------ Zagrath raccontato a Ilvaena
  - id: la-guerra-privata
    presso: grifone-di-ferro
    immagine: personaggi/ilvaena-sorathe
    titolo: La guerra privata
    sommario: "Ilvaena Sorathe è al tavolo d'angolo del Grifone, e le hanno detto che sei stato a Capomozzo."
    luogo: Locanda del Grifone di Ferro, la sera
    area: ponti-sospesi
    requisiti: [capomozzo.zagrath == 1, capomozzo.ilvaena == 0]
    testo: |
      Ilvaena Sorathe ha preso il tavolo d'angolo, con l'arco senza corda
      appoggiato al muro e il fango sugli stivali fino al ginocchio, e quando ti
      vede sposta la faretra dalla sedia con un piede. Accanto alla scodella c'è
      una corda d'arco nuova arrotolata, che tocca ogni tanto con il pollice.

      «Mi dicono che sei stato a Capomozzo» dice senza alzare gli occhi. «Mi
      dicono anche che sei tornato. Questa è la parte interessante.»

      Brunella ti mette davanti un boccale e resta lì con lo strofinaccio in mano,
      perché le storie le piacciono. *Il mezzo ogre glielo devo raccontare bene, o
      non me lo perdona.* Ilvaena posa il cucchiaio e aspetta.
    opzioni:
      - testo: "Raccontarle di Zagrath"
        descrizione: "Dei cuscini e delle vedove di Dorbak, e di quello che ti ha detto in ginocchio."
        esito:
          titolo: Conta zero
          testo: |
            Le racconti dell'harem e dei datteri, e Ilvaena ride così forte che al
            bancone due Raschiatori si girano, finché arrivi alle parole di Zagrath in
            ginocchio e lei si tocca la cicatrice sotto la clavicola. «Ha ragione lui,
            conta zero. Però adesso so che sanguina dal naso come tutti gli altri.»
            Alza il boccale verso di te. «Glielo ricorderò, la prossima volta.»
          imposta: { capomozzo.ilvaena: 1 }

  # ------------------------------------------------------------ Isvaro negli alloggi (solo se è fuggito)
  - id: isvaro-negli-alloggi
    immagine: ambientazione/capomozzo
    titolo: Il pagliericcio
    sommario: "In un ripostiglio in fondo a un corridoio laterale qualcuno dorme fra i sacchi, con gli stivali ai piedi."
    luogo: Sotterranei di Capomozzo, un ripostiglio
    area: sotto-capomozzo
    requisiti: [pista.capomozzo == 3, isvaro == 1, profondita.sotto-capomozzo >= 1, capomozzo.isvaro == 0]
    testo: |
      In fondo a un corridoio laterale c'è un ripostiglio che sa di vino, con
      quattro bottiglie vuote in fila per altezza su una cassa. Isvaro Tarvelin
      dorme su un pagliericcio fra i sacchi di farina, con gli stivali ai piedi
      e un coltello in mano, più magro di quando è scappato dalla fornace
      dell'Acciaieria. Quando la tua ombra gli passa sulla faccia apre gli occhi
      e alza il coltello. Ti riconosce, e lo riabbassa piano.

      {origine allievo-di-torvessa} All'Accademia, quando si parla di gare
      d'arco, qualcuno fa sempre il suo nome e poi abbassa la voce.

      {origine rampollo-dei-quartieri-alti} Nei salotti dei Quartieri Alti
      raccontano ancora il funerale di Maerith Tarvelin, con il figlio che
      maledice il padre davanti a tutti.

      «Tu» dice, con la voce impastata. «Ti prego, non dirlo a Kessa. Se sa che
      sono tornato mi riporta giù da lei, e io giù non ci voglio tornare.»
    opzioni:
      - testo: "Chiedergli di Aurenne"
        descrizione: "Nel diario la chiamava la sua amata. Adesso ha paura di scendere da lei."
        esito:
          titolo: Il ponte
          testo: |
            «Sta sul ponte, al livello di sotto, dove le macchine dei Precursori guardano nel
            buio» dice Isvaro. «Sale soltanto per parlare con la statua della cappella. L'ultima
            volta che mi ha toccato aveva già quella mano nuova, fredda come una pietra di
            fiume.» Quando esci si è già girato verso il muro, e richiudi la porta piano, come
            nelle stanze dei malati.
          imposta: { capomozzo.isvaro: 1 }
      - testo: "Lasciarlo dormire e andartene"
        descrizione: "Non sei sceso fin qui per lui. E Kessa, a quanto pare, lo cerca già abbastanza."
        esito:
          titolo: La porta accostata
          testo: |
            Gli lasci il coltello e le bottiglie e richiudi la porta come l'hai trovata, accostata. Da
            dentro lo senti ridere piano e poi tirare su col naso. Nel corridoio la lanterna in fondo
            fa fumo, e ti accorgi di pensare allo stoppino da tagliare con un'attenzione esagerata, pur
            di non pensare a lui.
          imposta: { capomozzo.isvaro: 1 }
      - testo: "Parlargli dell'Accademia"
        descrizione: "Isvaro è cresciuto all'Accademia di Torvessa, e da lì si arriva ad Aurenne con meno fatica."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Il bersaglio di paglia
          testo: |
            Gli dici che studi a Torvessa, e Isvaro ti chiede del bersaglio di
            paglia in fondo al cortile. Quando arrivi ad Aurenne il tono gli si fa
            piatto. «Sta sul ponte di sotto, dove le macchine dei Precursori
            guardano nel buio. Sale solo per parlare con la statua della cappella,
            e l'ultima volta che mi ha toccato aveva già la mano nuova, fredda
            come una pietra di fiume.»
          imposta: { capomozzo.isvaro: 1 }

  # ------------------------------------------------------------ gli alloggi di Aurenne (una volta sola, richiesta dal cuore)
  - id: gli-alloggi-di-aurenne
    immagine: ambientazione/mito-regina-ali-spezzate
    titolo: La stanza pulita
    sommario: "L'unica porta del livello con i cardini oliati, e dietro una stanza con le lenzuola di seta."
    luogo: Sotterranei di Capomozzo, gli alloggi di Aurenne
    area: sotto-capomozzo
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo >= 1, capomozzo.alloggi == 0]
    testo: |
      È l'unica porta del livello con i cardini oliati, e dietro c'è una stanza
      grande e pulita che, dopo le tane degli orchi, ti mette a disagio. C'è un
      letto con le lenzuola di seta color crema rimboccate strette, e una
      scrivania sotto una lanterna dallo stoppino pareggiato con le forbici.
      Accanto al letto c'è uno specchio alto, girato contro il muro, e sul
      pavimento sotto lo specchio dei capelli lunghi color argento. Ti torna in
      mente *Mawrak'Thur*, la parola che la Città Bassa ripete sottovoce dalla
      sera del Festival.

      Sulla scrivania, girato verso il letto, c'è un uccellino di legno intagliato
      a cui manca un'ala, con la punta del becco consumata a forza di toccarla.
    opzioni:
      - testo: "Frugare nella scrivania"
        descrizione: "Tre cassetti e nessuna serratura. Chi dorme qui non ha paura dei ladri."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Facile }
        successo:
          titolo: Il quaderno di stoffa
          testo: |
            Nel cassetto di mezzo, sotto una pila di fazzoletti piegati in quattro, c'è
            un quaderno dalla copertina di stoffa azzurra, consumata agli angoli. La
            prima pagina comincia con *Caro Albero* in una calligrafia tonda da
            ragazzina, e le ultime sono in una grafia dritta e appuntita che sembra di
            un'altra persona. Te lo infili sotto la giubba e richiudi il cassetto
            com'era.
          imposta: { capomozzo.alloggi: 1 }
          effetti: { oggetto.diario-di-aurenne: 1 }
        fallimento:
          titolo: I passi nel corridoio
          testo: |
            Trovi il quaderno nel cassetto di mezzo, sotto i fazzoletti, ma mentre lo
            sfogli arrivano dei passi nel corridoio. Ti butti dietro il letto con la
            guancia sulla seta, mentre qualcuno si ferma sulla soglia a guardare dentro
            e poi se ne va, e ti rialzi con il quaderno stretto al petto.
          imposta: { capomozzo.alloggi: 1 }
          effetti: { oggetto.diario-di-aurenne: 1, tormento: 1 }
      - testo: "Sederti sul letto e guardare la stanza da lì"
        descrizione: "Lo specchio girato, l'uccellino rivolto al cuscino. Da sdraiati si vedono cose diverse."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Facile }
        successo:
          titolo: Il cuscino
          testo: |
            Ti siedi sul bordo del letto. Da qui l'uccellino di legno è l'ultima cosa
            che si vede prima di spegnere la lanterna, e lo specchio girato è l'unica
            che non si vede mai. Infili la mano sotto il cuscino senza pensarci, come
            nel tuo letto, e trovi un quaderno dalla copertina di stoffa azzurra.
          imposta: { capomozzo.alloggi: 1 }
          effetti: { oggetto.diario-di-aurenne: 1 }
        fallimento:
          titolo: La seta
          testo: |
            La seta scivola, e per non cadere tiri via il lenzuolo per metà, scoprendo
            sotto il cuscino un quaderno dalla copertina di stoffa azzurra. Lo prendi, e
            dopo aver provato a lungo a rifare il letto lo lasci con un angolo che pende,
            sapendo che chi dorme qui se ne accorgerà.
          imposta: { capomozzo.alloggi: 1 }
          effetti: { oggetto.diario-di-aurenne: 1, tormento: 1 }
      - testo: "Cercare dove si nasconde un quaderno di preghiere"
        descrizione: "In Cattedrale le novizie tengono il quaderno delle preghiere sotto il materasso, dalla parte della testa."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Sotto il materasso
          testo: |
            La stanza ti ricorda il dormitorio delle novizie, dove le cose che
            contano si tengono sotto il materasso, dalla parte della testa.
            Sollevi l'angolo del letto e trovi un quaderno dalla copertina di
            stoffa azzurra, che comincia con *Caro Albero* in una calligrafia
            tonda da ragazzina, come le preghiere che le novizie lasciano nella
            cassetta della Cripta. Te lo infili sotto la giubba e fai a metà il
            segno dell'Albero.
          effetti: { oggetto.diario-di-aurenne: 1 }
          imposta: { capomozzo.alloggi: 1 }

  # ------------------------------------------------------------ il cuore · 3 → 4
  - id: garin-e-kessa
    immagine: ambientazione/rovine-dei-precursori
    titolo: Garin e Kessa
    sommario: "Nella sala della ricerca un mercenario e una maga litigano su Isvaro, e dalla stanza accanto senti tutto."
    luogo: Sotterranei di Capomozzo, la sala della ricerca
    area: sotto-capomozzo
    requisiti: [pista.capomozzo == 3, profondita.sotto-capomozzo >= 4, capomozzo.alloggi >= 1]
    testo: |
      Dalla sala della guerra senti le voci attraverso la porta.

      «Cercare Isvaro, adesso» dice l'uomo con una voce bassa da caserma. «Senti,
      Kessa, quel mezzelfo non vale la pelle che ci lasciamo. Io sono qui per la
      paga, e la paga non basta più.»

      «Isvaro ha pensato la razzia dalla prima freccia all'ultima» risponde la
      donna, pesando ogni parola. «Aurenne ci ha dato un compito, Garin.»

      «Aurenne è pazza, hai visto cos'ha fatto a quelli con le maschere e cosa fa
      con quell'aggeggio. Il tuo mezzelfo è in una fossa di Qir-Azel, e i vermi
      gli stanno già facendo festa.»

      «Ripetilo e ti brucio la lingua» dice lei.

      Spingi la porta su una sala piena di tavolette di pietra coperte di rune.
      Garin è un uomo massiccio con l'elmo ammaccato e uno scudo di ferro dipinto
      con una faccia che urla. Davanti a lui Kessa stringe un bastone che manda
      bagliori viola, e ai suoi piedi un gatto bianco ti guarda senza scomporsi.

      {origine allievo-di-torvessa} All'Accademia ti hanno insegnato a guardare le
      mani di chi lancia, e quelle di Kessa sono molto più ferme delle tue il
      primo anno.

      {rissa Media} Garin alza lo scudo, ma tiene il peso sul piede di dietro,
      quello verso l'uscita.
    opzioni:
      - testo: "Affrontarli tutti e due"
        descrizione: "Uno scudo come una porta e una maga col fuoco in mano, ma Garin guarda già l'uscita."
        combattimento: garin-e-kessa
        vittoria:
          titolo: La faccia che urla
          testo: |
            Kessa apre il fuoco per prima, e la fiammata viola ti brucia le
            sopracciglia. Garin ti viene addosso dietro lo scudo, e quando lui cade
            Kessa brucia fino all'ultimo, finché il bastone le scivola di mano. Sul
            tavolo c'è un suo foglio con il disegno di un disco coronato di cristalli, e
            sotto *risponde soltanto a lei*. Dietro le mensole una scala scende nel
            buio.
          imposta: { garin-e-kessa: 1, pista.capomozzo: 4 }
          effetti: { racconto: 1 }
          vai: cuore-di-capomozzo
        sconfitta:
          titolo: Il fuoco viola
          testo: |
            Il fuoco di Kessa ti prende al petto e ti butta contro le mensole. Garin
            non ti finisce, e trascina Kessa per un braccio verso la scala che risale
            alla fortezza, mentre lei si lascia portare con il gatto in braccio,
            guardandoti finché non sparisce. Ti rialzi con l'odore dei capelli
            bruciati nel naso, e dietro le mensole rovesciate c'è una scala che
            scende nel buio.
          imposta: { garin-e-kessa: 3, pista.capomozzo: 4 }
          effetti: { tormento: 1.5 }
          vai: cuore-di-capomozzo
      - testo: "Metterli uno contro l'altro"
        descrizione: "Garin vuole andarsene vivo e Kessa vuole il suo mezzelfo, e bisogna che lo dicano ad alta voce."
        prova: { attributo: sociale, abilita: [persuasione, ingannare, empatia], difficolta: Difficile }
        successo:
          titolo: Siamo in due
          testo: |
            Dici a Garin che a Qir-Azel nessuno corre dietro a un mercenario che si
            arrende. «Senti, Kessa. Adesso siamo in due» dice lui, e Kessa guarda il
            gatto e posa il bastone.

            Li chiudi in due celle, e Garin ti parla del disco con cui Aurenne comanda
            le macchine di sotto. «Quando la Guardia viene a prenderci, dille di
            portare il pane.» Dietro le mensole una scala scende nel buio.
          imposta: { garin-e-kessa: 2, pista.capomozzo: 4 }
          effetti: { racconto: 1 }
          vai: cuore-di-capomozzo
        fallimento:
          titolo: Vuole dividerci
          testo: |
            Kessa capisce prima di Garin dove vuoi arrivare. «Vuole dividerci, Garin»
            dice, con il bastone che le si accende in mano, e Garin alza lo scudo dalla
            sua parte. Il fuoco ti arriva addosso di lato, e mentre rotoli dietro il
            tavolo li senti uscire di corsa verso la scala che risale alla fortezza.
            Dietro le mensole c'è un'altra scala, che scende nel buio.
          imposta: { garin-e-kessa: 3, pista.capomozzo: 4 }
          effetti: { ferite: 2 }
          vai: cuore-di-capomozzo
      - testo: "Farli arrendere"
        descrizione: "Sei arrivato fin qui attraverso tutta la fortezza, e loro lo sanno. Bisogna soltanto farglielo pesare."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Difficile }
        successo:
          titolo: Lo scudo per terra
          testo: |
            Ti siedi davanti alla porta con le mani in vista e racconti con calma la strada dal
            ponte di corda fino a qui. Garin posa lo scudo per primo, Kessa quando il gatto le si
            struscia contro la caviglia.

            Li chiudi in due celle, e Garin ti racconta del disco con cui Aurenne comanda le
            macchine di sotto. Dietro le mensole una scala scende nel buio.
          imposta: { garin-e-kessa: 2, pista.capomozzo: 4 }
          effetti: { racconto: 1 }
          vai: cuore-di-capomozzo
        fallimento:
          titolo: La porta
          testo: |
            Garin per un momento abbassa lo scudo, ma Kessa ha già acceso il bastone,
            e la fiammata viola esplode sul tavolo davanti a te. Mentre ti ripari
            dietro il piano rovesciato Garin la trascina fuori per il mantello. Ti
            rialzi con le mani piene di vesciche e senza sopracciglia per qualche
            settimana, e dietro le mensole trovi una scala che scende.
          imposta: { garin-e-kessa: 3, pista.capomozzo: 4 }
          effetti: { ferite: 2 }
          vai: cuore-di-capomozzo
      - testo: "Dire a Kessa dove dorme Isvaro"
        descrizione: "L'hai visto nel ripostiglio in fondo al corridoio, con le bottiglie in fila. Kessa lo cerca da giorni."
        requisiti: [capomozzo.isvaro >= 1]
        esito:
          titolo: Gli stivali addosso
          testo: |
            Dalla porta dici che Isvaro è nel ripostiglio in fondo al corridoio, e
            Kessa prende in braccio il gatto e ti passa accanto di corsa. «Senti,
            stai attento al disco che lei porta al collo» ti dice Garin prima di
            andarsene di sopra rasente il muro. «Con quello le macchine di sotto
            fanno quello che vuole lei.» Dietro le mensole resta la scala che scende
            nel buio.
          imposta: { garin-e-kessa: 3, pista.capomozzo: 4 }
          vai: cuore-di-capomozzo
      - testo: "Lasciarli passare"
        descrizione: "La porta è una sola e ci sei tu davanti. Se ti sposti, forse se ne vanno e basta."
        esito:
          titolo: La porta libera
          testo: |
            Ti sposti di lato con le mani in vista. Garin capisce per primo e tira
            Kessa per il gomito verso l'uscita, con il gatto che le trotterella dietro.
            Sulla soglia si volta a mezzo. «Senti, se scendi, guarda il disco che lei
            porta al collo. Con quello comanda le macchine.» Poi spariscono verso la
            scala che risale alla fortezza, e dietro le mensole resta quella che scende
            nel buio.
          imposta: { garin-e-kessa: 3, pista.capomozzo: 4 }
          vai: cuore-di-capomozzo
      - testo: "Offrire a Garin una paga migliore"
        descrizione: "Garin è qui per la paga, e nei Quartieri Alti uno scudo come il suo trova lavoro in una settimana."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: La lettera giusta
          testo: |
            Parli a Garin come a casa tua si parla a un capitano da assumere, e
            gli prometti una lettera con il sigillo di famiglia. «Senti, Kessa.
            Adesso siamo in due» dice Garin, e lei posa il bastone.

            Li chiudi in due celle, e Garin ti parla del disco con cui Aurenne
            comanda le macchine di sotto, chiedendoti due volte della lettera.
            Dietro le mensole una scala scende nel buio.
          imposta: { garin-e-kessa: 2, pista.capomozzo: 4 }
          effetti: { racconto: 1 }
          vai: cuore-di-capomozzo
        fallimento:
          titolo: Il sigillo
          testo: |
            Kessa ride senza allegria. «Ti offre una lettera, Garin. Io ti ho dato
            la paga.» Garin alza lo scudo dalla sua parte, guardandoti come per
            scusarsi, e il fuoco viola ti prende mentre rotoli dietro il tavolo.
            Ti rialzi con il braccio pieno di vesciche, e dietro le mensole trovi
            un'altra scala, che scende nel buio.
          imposta: { garin-e-kessa: 3, pista.capomozzo: 4 }
          effetti: { ferite: 2 }
          vai: cuore-di-capomozzo
