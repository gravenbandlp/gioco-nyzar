# La pista "Acciaio e Ira" (pista.acciaio), passi 0 → 3: Ondrel al Grifone di Ferro, la sparizione di
# Liaren e la lettera di Isvaro, l'arrivo davanti all'Acciaieria. Più una carta della Città Bassa.
storylet:
  # ------------------------------------------------------------ 0 → 1 · Ondrel al Grifone
  - id: ondrel-al-grifone
    presso: grifone-di-ferro
    immagine: personaggi/ondrel-tarvelin
    titolo: L'ultimatum
    sommario: "A metà sera Ondrel Tarvelin entra al Grifone sbattendo la porta, a cercare la figlia davanti a tutti."
    luogo: Locanda del Grifone di Ferro, di sera
    area: ponti-sospesi
    requisiti: [pista.tribu >= 4, pista.acciaio == 0]
    testo: |
      A metà sera il Grifone è pieno fino alle scale, e i Raschiatori del
      turno lungo giocano a dadi fra due tavoli. Sopra il bancone è appeso il
      mestolo ammaccato che la mattina del Festival è arrivato sulla testa del
      padre di Liaren dopo un pentolone di stufato.

      La porta sbatte contro il muro e la sala si zittisce un tavolo alla
      volta. Sulla soglia c'è Ondrel Tarvelin, pallido, nelle vesti scure di
      buon taglio, con un bastone nero dal puntale d'acciaio. «Liaren
      Tarvelin» dice, come se leggesse il nome da un registro. «Domattina
      all'alba parte una carrozza per Laresh, con un posto pagato a tuo nome.
      È l'ultima volta che te lo offro.»

      Poi vede te e viene al tuo tavolo, con un velo di fuliggine sul polsino
      che arriva fino all'anello dei Tarvelin. «Tu eri con quella masnada di
      spacconi che al Festival ha voluto fare bella mostra di sé contro gli
      orchi» dice. «Una banda di combinaguai attira soltanto altre disgrazie.»
      Il pomo del bastone, sotto le sue dita, trema appena.

      {medicina Media} Quel tremito arriva a ondate, come in chi non dorme da
      giorni.

      {origine apprendista-raschiatore} Al tavolo dei dadi due hanno fatto
      turno con te sulle piattaforme, e quando Ondrel dice *combinaguai* il
      più vecchio si gira ad aspettare la tua risposta.
    opzioni:
      - testo: "Rispondergli davanti a tutta la sala"
        descrizione: "La sala ascolta, e in trent'anni Ondrel Tarvelin non ha mai detto una parola sbagliata. Tocca a te trovare quella giusta."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Il boccale sul tavolo
          testo: |
            Gli ricordi, senza alzare la voce, che la sera della razzia le guardie
            erano poche e gli orchi tanti, e alla fine un Raschiatore batte il
            boccale sul tavolo e dopo di lui tutti gli altri.

            «Per me, da oggi, sei morta» dice Ondrel alla figlia. «Proprio come
            tua madre.» Esce lasciando la porta aperta, e Liaren va a chiuderla e
            ci resta appoggiata con la fronte.
          effetti: { pista.acciaio: 1 }
        fallimento:
          titolo: Una parola di troppo
          testo: |
            Cominci bene, poi ti scappa una parola grossa e Ondrel la raccoglie al
            volo. «Ecco come parlano gli eroi del Festival» dice alla sala,
            battendo il puntale.

            «Per me, da oggi, sei morta» dice poi alla figlia. «Proprio come tua
            madre.» Esce senza chiudere la porta, e Liaren ci resta appoggiata con
            la fronte finché Brunella non le mette una mano sulla schiena.
          effetti: { pista.acciaio: 1, scandalo: 1 }
      - testo: "Metterti fra lui e Liaren"
        descrizione: "È un vecchio con un bastone. Mettergli le mani addosso è facile, e domattina alla Casa dei Nodi lo sapranno tutti."
        esito:
          titolo: Il polso del vecchio
          testo: |
            Quando Ondrel alza il bastone verso la figlia gli prendi il polso a
            mezz'aria, un fascio d'ossa nel buon panno. Lui ti guarda la mano come
            una macchia sul vestito, poi si libera con uno strattone.

            «Per me, da oggi, sei morta» dice alla figlia. «Proprio come tua
            madre.» Esce, e Liaren chiude la porta e ci resta appoggiata con la
            fronte.
          effetti: { pista.acciaio: 1, rep.tarvelin: -1 }
      - testo: "Lasciare che sia Liaren a rispondere"
        descrizione: "È la sua locanda, e la mattina del Festival se l'è cavata da sola con un pentolone."
        esito:
          titolo: Il mestolo sul muro
          testo: |
            Liaren esce da dietro il bancone e si pianta davanti al padre. «Questa è la
            mia locanda, e qui tu non sei il benvenuto» dice, «e il mestolo è ancora
            appeso lassù, se ti serve.»

            «Per me, da oggi, sei morta, proprio come tua madre» dice Ondrel. Liaren gli
            chiude la porta dietro con un colpo che fa tremare le lanterne, e ci resta
            appoggiata con la fronte.
          effetti: { pista.acciaio: 1 }
      - testo: "Guardarlo bene mentre parla"
        descrizione: "Un uomo che da trent'anni pesa ogni parola stasera ha sbattuto una porta. Vale la pena di guardargli le mani."
        prova: { attributo: mentale, abilita: [percezione, medicina], difficolta: Media }
        successo:
          titolo: La fuliggine sul polsino
          testo: |
            Ha le occhiaie di tre notti senza sonno e la fuliggine del polsino
            così fresca che lascia un segno grigio sul tuo tavolo; mentre parla
            guarda due volte la porta, come se contasse il tempo che gli resta.

            «Per me, da oggi, sei morta» dice Ondrel a Liaren. «Proprio come tua
            madre.» Esce in fretta, e Liaren gli chiude la porta alle spalle.
          effetti: { pista.acciaio: 1, informazioni.voce: 1 }
        fallimento:
          titolo: I bottoni
          testo: |
            Lo guardi troppo, e Ondrel se ne accorge a metà frase. «Hai finito di
            contarmi i bottoni?» chiede, e al tavolo dei dadi qualcuno ride di te.

            Poi torna dalla figlia e le dice: «Per me, da oggi, sei morta, proprio
            come tua madre.» Esce lasciando la porta aperta, e Liaren va a
            chiuderla con le spalle che le tremano.
          effetti: { pista.acciaio: 1, tormento: 0.5 }
      - testo: "Salutarlo come si saluta un consigliere della Gilda"
        descrizione: "Alla Casa dei Nodi l'hai visto firmare con i polsini bianchi e le dita pulite. Stasera ha la fuliggine fino all'anello."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: I polsini della Casa dei Nodi
          testo: |
            Lo saluti con il titolo e l'inchino della Casa dei Nodi, e Ondrel
            guarda la licenza della Gilda prima della tua faccia. La fuliggine che
            gli arriva all'anello è fresca.

            {politica-ed-economia Media} Chi si sporca al forno di persona ha
            licenziato i capisquadra, o non si fida più di loro.

            Poi dice alla figlia che per lui è morta, come sua madre, ed esce
            lasciando la porta aperta.
          effetti: { pista.acciaio: 1, informazioni.voce: 1 }
      - testo: "Rispondergli con le maniere dei Casati"
        descrizione: "Nei Quartieri Alti si insegna a dodici anni come si zittisce un vecchio senza alzare la voce. Basta ricordargli dove si trova."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il cognome intero
          testo: |
            Gli fai l'inchino dei saloni per i consiglieri della Gilda e gli
            chiedi, con la voce dei pranzi del Consiglio, se i Tarvelin sbrighino
            ormai gli affari di famiglia nelle locande dei Ponti. Al tavolo dei
            dadi qualcuno tossisce per non ridere.

            Ondrel si volta verso la figlia. «Per me, da oggi, sei morta» dice.
            «Proprio come tua madre.» Esce senza chiudersi la porta alle spalle.
          effetti: { pista.acciaio: 1 }

  # ------------------------------------------------------------ 1 → 2 · la taverniera scomparsa
  - id: la-taverniera-scomparsa
    presso: grifone-di-ferro
    immagine: personaggi/brunella-fennick
    titolo: La taverniera scomparsa
    sommario: "La mattina dopo la colazione non è pronta, e nella stanza di Liaren il letto è intatto."
    luogo: Locanda del Grifone di Ferro, il retrobottega
    area: ponti-sospesi
    requisiti: [pista.acciaio == 1]
    testo: |
      La mattina dopo dalla cucina del Grifone non arriva nessun odore, e i
      Raschiatori seduti ad aspettare fissano la porta. Brunella ti viene
      incontro asciugandosi sul grembiule le mani già asciutte e ti porta nel
      retrobottega, dove il samisen di riserva pende da un chiodo sopra i
      sacchi di farina.

      «Liaren non ha fatto la colazione, e non era mai successo, nemmeno il
      giorno dopo il Festival» dice. «Il letto è fatto, e stanotte non ci ha
      dormito nessuno.» Tira fuori dal grembiule un foglio di pergamena
      accartocciato e poi lisciato con il palmo. «Era per terra accanto al
      letto. È di suo fratello Isvaro, ed è scritto in elfico.»

      Su un angolo c'è l'impronta di un pollice sporco di nero.

      {percezione Media} Il nero è grasso e si sbriciola sotto l'unghia,
      fuliggine di forno come quella che ieri sera Ondrel aveva sul polsino.
    opzioni:
      - testo: "Leggere la lettera da te"
        descrizione: "L'elfico scritto in fretta è difficile, ma chi l'ha studiato un poco ci arriva."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Alla porta delle consegne
          testo: |
            Isvaro scrive che il padre potrebbe avere a che fare con gli orchi
            della razzia, e che dalle autorità non vuole andare, perché Ondrel ne
            uscirebbe pulito con qualche mazzetta. Le dà appuntamento
            all'Acciaieria a mezzanotte, alla porta delle consegne, dove si bussa
            due volte e poi tre, e dopo una pausa ancora una volta. Sotto la firma
            ha sottolineato *non tardare*.
          pe: { accademiche: 5 }
          segue: la-storia-dei-tarvelin
        fallimento:
          titolo: Il cesto del pane
          testo: |
            Alla seconda riga ti perdi, e Brunella ti riprende il foglio e lo legge
            lei, piano.

            Isvaro scrive che il padre potrebbe c'entrare con gli orchi e che non
            vuole andare dalle autorità, perché Ondrel le comprerebbe. Dà appuntamento
            a mezzanotte alla porta delle consegne dell'Acciaieria, dove si bussa due
            volte e poi tre, e dopo una pausa ancora una volta.
          segue: la-storia-dei-tarvelin
          effetti: { tormento: 0.5 }
      - testo: "Chiedere a Brunella di leggerla"
        descrizione: "Dice che l'elfico lo legge piano, una riga alla volta, ma lo legge."
        esito:
          titolo: Gli occhiali di Brunella
          testo: |
            Brunella inforca gli occhiali, con una stanghetta legata con lo spago,
            e traduce piano.

            Isvaro scrive che il padre potrebbe c'entrare con gli orchi e che non
            vuole andare dalle autorità, perché Ondrel le comprerebbe. Dà
            appuntamento a mezzanotte alla porta delle consegne dell'Acciaieria,
            dove si bussa due volte e poi tre, e dopo una pausa ancora una volta.
          segue: la-storia-dei-tarvelin
      - testo: "Leggere la lettera come un compito d'elfico"
        descrizione: "All'Accademia l'elfico si traduce a voce alta davanti a Temmerin, e quel nome è inciso su un banco."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Il banco della terza aula
          testo: |
            *Isvaro* è inciso su un banco della terza aula dell'Accademia, e la
            lettera la traduci a voce alta come davanti a Temmerin. Il padre,
            scrive, potrebbe c'entrare con gli orchi della razzia, e le autorità
            Ondrel le comprerebbe. Dà appuntamento alla sorella a mezzanotte alla
            porta delle consegne dell'Acciaieria, dove si bussa due volte e poi
            tre, e dopo una pausa ancora una volta.
          pe: { accademiche: 5 }
          segue: la-storia-dei-tarvelin

  - id: la-storia-dei-tarvelin
    presso: grifone-di-ferro
    immagine: ambientazione/maniero-tarvelin
    titolo: I figli di Ondrel
    tipo: seguito
    luogo: Locanda del Grifone di Ferro, il retrobottega
    area: ponti-sospesi
    requisiti: [pista.acciaio == 1]
    testo: |
      Brunella, seduta su un sacco di farina, ti racconta dei Tarvelin.

      Isvaro, mezzelfo, è nato un anno prima di Liaren in una casa dove
      nessuno aveva sangue elfico. Maerith non disse mai chi fosse il padre,
      e Ondrel mandò il bambino a crescere all'Accademia di Torvessa. Da
      grandi i fratelli litigarono e Isvaro colpì Liaren in faccia, per un
      motivo che lei non ha mai detto.

      {origine rampollo-dei-quartieri-alti} Nei salotti questa storia la
      raccontano ancora, abbassando la voce sulla parola *mezzelfo*.

      Dieci anni fa Maerith morì, di febbre secondo la città. Al funerale
      Isvaro gridò che Ondrel l'aveva spinta giù dalla scogliera, il vecchio
      quasi gli spaccò la mascella col bastone, e Isvaro sparì da Qir-Azel.

      «Se torna adesso, non porta niente di buono» dice Brunella. Lo sceriffo
      Galdrick è partito per Ghoran, e al sergente di turno la lettera non la
      vuole far leggere.
    opzioni:
      - testo: "Prometterle che la riporterai a casa"
        descrizione: "Non sai che cosa troverai all'Acciaieria. Brunella però ha bisogno di sentirtelo dire."
        esito:
          titolo: Due notti sul registro
          testo: |
            Glielo prometti, e Brunella annuisce come se le avessi detto il prezzo
            delle uova, ma si alza dal sacco più svelta di come ci si era seduta.
            Ti spiega la strada per l'Acciaieria, in Città Bassa, sotto la
            ciminiera più alta della città. Poi segna due notti accanto al tuo
            nome sul registro, e quando torni in sala è già ai fornelli.
          effetti: { indizio.lettera-isvaro: 1, pista.acciaio: 1, alloggio.grifone: 2 }
      - testo: "Accettare i soldi della cassa"
        descrizione: "Brunella ha già contato la cassa sul coperchio di una botte. Dice che Liaren farebbe lo stesso."
        esito:
          titolo: Il conto della cassa
          testo: |
            Le monete sono in pile ordinate, le più consumate sotto e quelle
            lucide sopra, e Brunella te le spinge verso la mano con il dorso delle
            dita. «Sono della cassa» dice. «Liaren te le avrebbe date lo stesso, e
            più in fretta di me.» Ti spiega la strada per l'Acciaieria, in Città
            Bassa, sotto la ciminiera più alta della città, e torna in cucina.
          effetti: { indizio.lettera-isvaro: 1, pista.acciaio: 1, monete: 20 }
      - testo: "Chiederle com'era Isvaro da ragazzo"
        descrizione: "Se lo troverai, ti conviene sapere che faccia ha e che cosa sa fare."
        esito:
          titolo: Le gare d'arco
          testo: |
            Era un ragazzo alto e magro, con le orecchie a punta, e all'Accademia vinceva
            tutte le gare d'arco. «Se ha un arco in mano, non stargli davanti» dice
            Brunella, e ti spiega la strada per l'Acciaieria, sotto la ciminiera più alta
            della Città Bassa.

            {armi-da-distanza Media} Un arciere così, se ti aspetta, ti aspetta in alto e
            con la luce alle spalle.
          pe: { empatia: 5 }
          effetti: { indizio.lettera-isvaro: 1, pista.acciaio: 1 }

  # ------------------------------------------------------------ 2 → 3 · davanti all'Acciaieria
  - id: davanti-all-acciaieria
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: L'Acciaieria chiusa
    sommario: "Le persiane sono sprangate e nel cortile non c'è un operaio, eppure la ciminiera dei Tarvelin fuma come nei giorni di colata."
    luogo: Acciaieria dei Tarvelin, Città Bassa
    area: citta-bassa
    requisiti: [pista.acciaio == 2]
    testo: |
      L'Acciaieria dei Tarvelin occupa un isolato intero ai piedi della sua
      ciminiera, con le persiane sprangate e il cancello chiuso da una
      catena nuova. Dalla ciminiera sale un fumo denso, ma dentro non si
      sente un martello. Una donna che stende il bucato alla finestra di
      fronte ti dice che da due settimane non entra e non esce nessuno, a
      parte il vecchio la sera tardi.

      Lungo il muro di cinta, dalla parte del forno, in mezzo al rombo senti
      delle voci gutturali ridere nella lingua della notte della razzia, e
      ti stacchi dal muro di un passo senza volerlo.

      Sul retro, in un vicolo, c'è una porta di ferro bassa con la scritta
      *consegne*; accanto al cancello c'è la porticina degli operai, con una
      serratura vecchia, e sul tetto della sala dei clienti un lucernaio
      scoperto.
    opzioni:
      - testo: "Bussare alla porta delle consegne"
        descrizione: "Il segnale della lettera era per Liaren. Qualcuno, dentro, potrebbe aspettarlo ancora."
        requisiti: [indizio.lettera-isvaro >= 1]
        esito:
          titolo: La spranga
          testo: |
            Bussi alla porta di ferro due volte e poi tre, e dopo una pausa ancora
            una volta. Per un po' non succede niente, poi una spranga scorre nei
            ganci e la porta si apre di un palmo su un corridoio buio che puzza di
            cenere bagnata, dove dei passi pesanti si allontanano verso il rombo
            del forno. Ti infili dentro e accosti la porta.
          imposta: { pista.acciaio: 3 }
          vai: acciaieria
      - testo: "Salire al lucernaio"
        descrizione: "Dalla grondaia della casa accanto al tetto della sala dei clienti c'è un salto di due braccia."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il vetro scoperto
          testo: |
            Sali dalla grondaia della casa accanto e salti sul tetto della sala
            dei clienti, dove una lastra del lucernaio si solleva con la punta del
            coltello. Ti cali appeso al telaio in una sala al buio, con le spade
            alle pareti e le vetrine coperte da teli, e atterri su un tappeto. Dal
            fondo dell'edificio arrivano il rombo del forno e, di tanto in tanto,
            una risata.
          imposta: { pista.acciaio: 3 }
          vai: acciaieria
        fallimento:
          titolo: La grondaia
          testo: |
            A metà salita la grondaia si stacca da un gancio e ti lascia appeso
            per le mani, e sul tetto la lastra del lucernaio ti scivola dalle dita
            e si rompe di sotto. Il rombo del forno copre tutto. Ti cali fra i
            vetri rotti e atterri male su una caviglia, in una sala piena di spade
            appese.
          imposta: { pista.acciaio: 3 }
          effetti: { ferite: 0.5 }
          vai: acciaieria
      - testo: "Forzare la porticina degli operai"
        descrizione: "La serratura è vecchia, ma in strada c'è gente da tenere buona mentre lavori."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Uno pagato a giornata
          testo: |
            Al secondo colpo di spalla la serratura salta, e intorno hai già un
            capannello di vicini con la donna del bucato in prima fila. Racconti,
            sbadigliando, che la famiglia ti paga a giornata perché il vecchio
            Tarvelin non apre, e i vicini si disperdono delusi. La donna del
            bucato ti chiede di dire al vecchio che il suo fumo le annerisce le
            lenzuola.
          imposta: { pista.acciaio: 3 }
          vai: acciaieria
        fallimento:
          titolo: Il capannello
          testo: |
            La serratura cede, ma il capannello che ti si forma intorno non ha
            voglia di andarsene. Un garzone giura di averti visto combattere al
            Festival, e una vecchia vuole sapere chi ti paga; le rispondi male e
            ti infili dentro. Mentre accosti la porta senti il ragazzo che corre
            verso il mercato a raccontarlo.
          imposta: { pista.acciaio: 3 }
          effetti: { sospetto: 1, scandalo: 1 }
          vai: acciaieria
      - testo: "Entrare dallo scivolo del carbone"
        descrizione: "Da bambino, d'inverno, rubavi da lì il carbone dei Tarvelin, e sai dove dare il colpo."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Lo scivolo
          testo: |
            Lo sportello di ferro del carbone, a filo del selciato, si apre come
            quando eri bambino, con un colpo secco nell'angolo in basso. Scivoli
            giù sulla schiena, con la polvere nera nel colletto, e finisci su un
            mucchio di carbone in un ripostiglio accanto alla sala dei clienti.
            Dal fondo arrivano il rombo del forno e, ogni tanto, una risata.
          imposta: { pista.acciaio: 3 }
          vai: acciaieria
      - testo: "Salire al lucernaio come su un'impalcatura"
        descrizione: "Con tre appigli sempre fermi, come sui ponteggi della Cicatrice, una grondaia di città non fa paura."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Tre appigli
          testo: |
            Provi la grondaia con due strattoni, come le funi prima di ogni turno,
            e trovi il gancio allentato. Sali dal lato buono, con tre appigli
            sempre fermi, e salti sul tetto. La lastra del lucernaio si solleva
            con la punta del coltello, e ti cali in una sala al buio con le spade
            appese. Dal fondo arrivano il rombo del forno e, ogni tanto, una
            risata.
          imposta: { pista.acciaio: 3 }
          vai: acciaieria

  # ------------------------------------------------------------ carta della pista
  - id: carta-due-settimane-di-fumo
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Due settimane di fumo
    sommario: "Al lavatoio una donna strizza la camicia del marito, fonditore all'Acciaieria, che da due settimane non torna a casa."
    tipo: carta
    area: citta-bassa
    requisiti: [pista.acciaio >= 1, pista.acciaio <= 2]
    testo: |
      Dal lavatoio della Città Bassa la ciminiera dei Tarvelin si vede tutta,
      con il suo pennacchio grigio. Una donna, Gisella, strizza una camicia
      da uomo anche se l'acqua ne esce limpida da un pezzo. Suo marito fa il
      fonditore all'Acciaieria da vent'anni, e da due settimane non torna a
      casa; il primo giorno è arrivato un biglietto firmato da Ondrel
      Tarvelin, *commessa urgente, gli operai dormono in fabbrica*, e poi
      niente, nemmeno la paga.

      {origine figlio-della-citta-bassa} Quando al lavatoio le donne parlano
      del sapone così forte, a qualcuna è successa una disgrazia e le altre
      le fanno la guardia.
    opzioni:
      - testo: "Parlare con Gisella"
        descrizione: "Strizza quella camicia da troppo tempo. Forse aspetta soltanto che qualcuno le chieda del marito."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Una voce dal cortile
          testo: |
            Gisella ti fa posto sul bordo della vasca senza smettere di strizzare. Tre
            sere fa è andata al cancello dell'Acciaieria e ha chiamato il marito per nome
            finché le è venuta la voce roca, e dal cortile le ha risposto qualcuno in una
            lingua che non era la nostra, e dopo un momento ha sentito ridere. «Il mio
            Doro non ride mai, nemmeno all'osteria» dice.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: La camicia bagnata
          testo: |
            Gisella ti ascolta con la camicia ferma fra le mani, poi ti chiede se
            ti manda il vecchio Tarvelin, e prima che tu possa rispondere
            raccoglie i panni e se ne va. Le altre donne restano a guardarti, con
            le mani nell'acqua, finché non te ne vai anche tu.
          effetti: { scandalo: 0.5 }
      - testo: "Lasciarle qualche moneta per la settimana"
        descrizione: "La paga non è arrivata, e le monete arrivano prima delle domande."
        requisiti: [monete >= 5]
        esito:
          titolo: Il biglietto
          testo: |
            Gisella guarda le monete a lungo prima di prenderle, poi tira fuori il
            biglietto del primo giorno, piegato in otto. La firma di Ondrel
            Tarvelin ha lo svolazzo del casato, ma la riga è storta e l'inchiostro
            ha fatto una macchia dove la penna si è fermata. «Sono vent'anni che
            il mio Doro lavora per lui» dice Gisella, «e io non l'ho mai visto
            scrivere storto.»
          effetti: { monete: -5, informazioni.voce: 1 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: "Prosegui oltre il lavatoio, e dietro di te Gisella immerge di nuovo la camicia nell'acqua fredda."
      - testo: "Sederti accanto a lei come al capezzale"
        descrizione: "Il Velo insegna a stare vicino a chi aspetta notizie, senza fare domande. Si comincia dalle mani, e le sue sono gelate."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Le mani nell'acqua
          testo: |
            Ti siedi sul bordo della vasca e le prendi la camicia dalle mani, come
            in Cattedrale si prende la ciotola a chi ha vegliato. Tre sere fa è
            andata al cancello dell'Acciaieria e ha chiamato il marito fino a
            perdere la voce, e dal cortile qualcuno le ha risposto in un'altra
            lingua, ridendo. «Il mio Doro non ride mai, nemmeno all'osteria» dice.
          effetti: { informazioni.voce: 1 }
