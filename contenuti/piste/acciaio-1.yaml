# La pista "Acciaio e Ira" (pista.acciaio), passi 0 → 3: Ondrel al Grifone di Ferro, la sparizione di
# Liaren e la lettera di Isvaro, l'arrivo davanti all'Acciaieria. Più una carta della Città Bassa.
storylet:
  # ------------------------------------------------------------ 0 → 1 · Ondrel al Grifone
  - id: ondrel-al-grifone
    presso: grifone-di-ferro
    immagine: personaggi/ondrel-tarvelin
    titolo: L'ultimatum
    sommario: "A metà sera la porta del Grifone sbatte contro il muro. Ondrel Tarvelin è tornato a cercare la figlia, davanti a tutta la sala."
    luogo: Locanda del Grifone di Ferro, di sera
    area: ponti-sospesi
    requisiti: [pista.tribu >= 4, pista.acciaio == 0]
    testo: |
      A metà sera il Grifone è pieno fino alle scale, e il caldo dei corpi
      ha appannato i vetri dal di dentro. I Raschiatori del turno lungo
      giocano a dadi su una coperta stesa fra due tavoli, mentre Brunella
      gira fra le sedie con la pentola della zuppa. Sopra il bancone, appeso
      a due chiodi, c'è il mestolo ammaccato che, a sentire i Raschiatori, la
      mattina del Festival è arrivato sulla testa del padre di Liaren subito
      dopo un pentolone di stufato, e sul cartellino che ci ha legato Liaren
      qualcuno ha scritto a carbone *non in vendita*.

      La porta sbatte contro il muro e la sala si zittisce un tavolo alla
      volta, dal più vicino all'ingresso fino all'ultimo, dove uno continua a
      ridere da solo finché il vicino non gli dà una gomitata. Sulla soglia
      c'è Ondrel Tarvelin, pallido, nelle vesti scure di buon taglio che porta
      sempre uguali, con un bastone di legno nero dal puntale d'acciaio. Batte
      il puntale sulle assi prima di parlare. «Liaren Tarvelin» dice, come se
      leggesse il nome da un registro. «Domattina all'alba parte una carrozza
      per Laresh, e c'è un posto pagato a tuo nome. È l'ultima volta che te lo
      offro.»

      {galateo Facile} Un consigliere della Gilda che chiama la figlia con
      il cognome intero davanti ai Raschiatori di una locanda. A casa sua
      questo si chiama ripudiare qualcuno con le buone maniere.

      Liaren posa il boccale che stava asciugando. «Non potevi aspettare
      domani, vero? Tu non puoi mai aspettare domani» dice, e dal tavolo dei
      dadi parte una risatina che si spegne subito.

      Ondrel però ha visto te. Viene al tuo tavolo, e da vicino gli senti
      addosso un odore di carbone, mentre sul polsino destro ha un velo di
      fuliggine che arriva fino all'anello con il sigillo dei Tarvelin. «Tu
      eri con quella masnada di spacconi che al Festival ha voluto fare bella
      mostra di sé contro gli orchi» dice. «Potevate far bruciare mezza città,
      e adesso la città vi offre da bere. Una banda di combinaguai attira
      soltanto altre disgrazie.» Le mani ti si chiudono sul bordo del tavolo
      per conto loro. *Ha fretta di farla partire.* Il pomo del bastone,
      sotto le sue dita, trema appena.

      {medicina Media} Il tremito della vecchiaia è sempre uguale, e questo
      invece arriva a ondate. È il tremito di un uomo che non dorme da giorni
      e tira avanti a forza di nervi.

      {origine apprendista-raschiatore} Al tavolo dei dadi ci sono due che
      hanno fatto turno con te sulle piattaforme, e quando Ondrel dice
      *combinaguai* il più vecchio gira la testa verso di te. Aspetta di
      vedere se rispondi, e intanto tiene i dadi chiusi nel pugno.
    opzioni:
      - testo: "Rispondergli davanti a tutta la sala"
        descrizione: "La sala ascolta, e in trent'anni Ondrel Tarvelin non ha mai detto una parola sbagliata. Tocca a te trovare quella giusta."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Il boccale sul tavolo
          testo: |
            Gli ricordi che la sera della razzia le guardie erano
            poche e gli orchi tanti, e che chi c'era non aveva il tempo di
            aspettare il permesso della Caserma. Lo dici senza alzare la voce,
            e ti accorgi a metà che la voce ti sta reggendo meglio delle
            gambe. Quando hai finito un Raschiatore batte il boccale sul
            tavolo, e dopo di lui lo fanno tutti gli altri.

            Ondrel aspetta che il rumore si spenga. Poi si gira verso Liaren e
            le parla piano in elfico, e lei gli risponde nella stessa lingua
            con una sfilza di parole che fa arrossire l'unico elfo seduto al
            bancone.

            «Per me, da oggi, sei morta» dice Ondrel. «Proprio come tua madre.»

            {empatia Facile} L'ha detto a lei, ma guardava la porta. Era una
            frase preparata per strada, e l'ha detta tutta senza fermarsi per non
            cambiarla.

            Esce lasciando la porta aperta alle sue spalle. Liaren va a
            chiuderla e ci resta appoggiata con la fronte, mentre le spalle le
            tremano.
          effetti: { pista.acciaio: 1 }
        fallimento:
          titolo: Una parola di troppo
          testo: |
            Cominci bene, poi ti scappa una parola grossa e Ondrel la raccoglie
            al volo, con la destrezza di trent'anni passati ai tavoli della
            Gilda. «Ecco come parlano gli eroi del Festival» dice alla sala
            battendo il puntale, e al tavolo dei dadi qualcuno abbassa gli
            occhi. Senti il collo che ti si scalda fino alle orecchie.

            Il vecchio torna dalla figlia e le parla in elfico, a voce bassa.
            Lei gli risponde forte nella stessa lingua, e dal tono capisci
            anche le parole che non conosci.

            «Per me, da oggi, sei morta» dice Ondrel. «Proprio come tua madre.»

            Esce senza chiudere la porta, e l'aria fredda dei Ponti entra a
            prendersi il posto lasciato da lui. Liaren va a chiuderla lei, e ci
            resta appoggiata con la fronte finché Brunella non le mette una
            mano sulla schiena.
          effetti: { pista.acciaio: 1, scandalo: 0.5 }
      - testo: "Metterti fra lui e Liaren"
        descrizione: "È un vecchio con un bastone. Mettergli le mani addosso è facile, e domattina alla Casa dei Nodi lo sapranno tutti."
        esito:
          titolo: Il polso del vecchio
          testo: |
            Quando Ondrel alza il bastone verso la figlia ti alzi anche tu, e
            la sedia cade all'indietro con un rumore che nessuno raccoglie. Gli
            prendi il polso a mezz'aria. È sottile e leggero, un fascio di ossa
            dentro una manica di buon panno, e per un momento hai paura di
            fargli male. Lui ti guarda la mano come guarderebbe una macchia sul
            vestito.

            {rissa Molto facile} Basterebbe stringere un po' di più. Il corpo lo
            sa e te lo propone, e tu fai finta di non averlo sentito.

            Poi parla a Liaren in elfico sopra la tua spalla, e lei gli
            risponde nella stessa lingua senza abbassare la voce. Ondrel libera
            il polso con uno strattone e si tira giù la manica.

            «Per me, da oggi, sei morta» dice Ondrel alla figlia, senza più
            guardarti. «Proprio come tua madre.»

            Esce lasciando la porta aperta alle sue spalle. Liaren va a
            chiuderla e ci resta appoggiata con la fronte, e per un pezzo in
            sala nessuno ha il coraggio di ricominciare a parlare.
          effetti: { pista.acciaio: 1, rep.tarvelin: -1 }
      - testo: "Lasciare che sia Liaren a rispondere"
        descrizione: "È la sua locanda, ed è suo padre. Dicono che la mattina del Festival se la sia cavata da sola, con un pentolone."
        esito:
          titolo: Il mestolo sul muro
          testo: |
            Resti seduto con le mani attorno al boccale, e Liaren esce da
            dietro il bancone e si pianta davanti al padre a braccia
            incrociate, con lo strofinaccio ancora sulla spalla. «Questa è la mia locanda, e
            qui tu non sei il benvenuto» dice. «Il mestolo è ancora appeso
            lassù, se ti serve.» Dalla sala parte una risata, e Ondrel diventa
            ancora più pallido.

            Ondrel le parla a voce bassa in elfico. Lei gli risponde nella
            stessa lingua, abbastanza forte perché l'unico elfo seduto al
            bancone arrossisca e si metta a fissare il fondo del boccale.

            «Per me, da oggi, sei morta» dice Ondrel, battendo il puntale sulle
            assi una volta sola. «Proprio come tua madre.»

            Liaren chiude la porta dietro di lui con un colpo che fa tremare le
            lanterne, e ci resta appoggiata con la fronte finché non smette di
            piangere. La sala aspetta che smetta, e soltanto dopo qualcuno
            ritira i dadi.
          effetti: { pista.acciaio: 1 }
      - testo: "Guardarlo bene mentre parla"
        descrizione: "Un uomo che da trent'anni pesa ogni parola stasera ha sbattuto una porta. Vale la pena di guardargli le mani."
        prova: { attributo: mentale, abilita: [percezione, medicina], difficolta: Media }
        successo:
          titolo: La fuliggine sul polsino
          testo: |
            Lo lasci parlare e intanto lo guardi. Ha le occhiaie scure di tre
            notti senza sonno, e le dita gli tremano sul pomo del bastone. La
            fuliggine del polsino è fresca, e quando si appoggia al tuo tavolo
            lascia sul legno un segno grigio. Mentre parla con la figlia gira
            due volte gli occhi verso la porta.

            {percezione Media} Un uomo che teme di essere seguito guarda la
            porta da cui è entrato. Lui guarda quella da cui deve uscire, e
            conta il tempo che gli resta.

            Poi le dice qualcosa in elfico, e lei gli risponde nella stessa
            lingua.

            «Per me, da oggi, sei morta» dice Ondrel. «Proprio come tua madre.»

            Esce in fretta, e Liaren va a chiudere la porta e ci resta
            appoggiata con la fronte. Tu resti a guardare il segno grigio sul
            tavolo finché Brunella non passa a pulirlo con lo straccio.
          effetti: { pista.acciaio: 1, informazioni.voce: 1 }
        fallimento:
          titolo: I bottoni
          testo: |
            Lo guardi troppo, e Ondrel se ne accorge a metà frase. «Hai finito
            di contarmi i bottoni?» chiede, e al tavolo dei dadi qualcuno ride
            di te. Senti la bocca che ti si secca mentre cerchi qualcosa da
            rispondere, e l'unica cosa che ti viene in mente è che i bottoni
            sono sei, e uno è di un altro colore.

            Il vecchio torna dalla figlia e le parla in elfico, e lei gli
            risponde a tono nella stessa lingua.

            «Per me, da oggi, sei morta» dice Ondrel. «Proprio come tua madre.»

            Esce lasciando la porta aperta, e Liaren va a chiuderla con le
            spalle che le tremano. Per il resto della sera i Raschiatori
            giocano a dadi senza contare i punti ad alta voce.
          effetti: { pista.acciaio: 1 }
      - testo: "Salutarlo come si saluta un consigliere della Gilda"
        descrizione: "Alla Casa dei Nodi l'hai visto firmare con i polsini bianchi e le dita pulite. Stasera ha la fuliggine fino all'anello."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: I polsini della Casa dei Nodi
          testo: |
            Ti alzi e lo saluti con il titolo che gli spetta alla Casa dei
            Nodi, con l'inchino corto che si usa sulle scale e non nei saloni,
            e Ondrel guarda la licenza della Gilda che porti alla cintura
            prima di guardarti in faccia. Per un momento non sa che cosa
            risponderti. Lassù l'hai visto firmare i contratti del lyssan con i
            polsini bianchi, e il carbone lo lasciava ai capisquadra. Stasera
            la fuliggine gli arriva all'anello, ed è fresca.

            {politica-ed-economia Media} Un consigliere che si sporca le mani
            al forno di persona ha licenziato i capisquadra, oppure non si fida
            più di loro. Alla Casa dei Nodi tutte e due le cose si pagano care.

            Si volta verso la figlia e le parla in elfico, e lei gli risponde
            nella stessa lingua.

            «Per me, da oggi, sei morta» dice Ondrel. «Proprio come tua madre.»

            Esce lasciando la porta aperta. Liaren va a chiuderla e ci resta
            appoggiata con la fronte, mentre le spalle le tremano.
          effetti: { pista.acciaio: 1, informazioni.voce: 1 }
      - testo: "Rispondergli con le maniere dei Casati"
        descrizione: "Nei Quartieri Alti si insegna a dodici anni come si zittisce un vecchio senza alzare la voce. Basta ricordargli dove si trova."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il cognome intero
          testo: |
            Ti alzi, gli fai l'inchino che nei saloni si riserva ai consiglieri
            della Gilda, e lo chiami con il cognome intero, come lui ha appena
            chiamato la figlia. Poi gli chiedi, con la voce dei pranzi del
            Consiglio, se i Tarvelin abbiano preso l'abitudine di sbrigare gli
            affari di famiglia nelle locande dei Ponti, perché in tal caso
            qualcuno dovrà avvertire le altre famiglie. Al tavolo dei dadi
            qualcuno tossisce per non ridere.

            {galateo Facile} Lo hai messo davanti a tutta la sala nel posto in
            cui l'avrebbero messo i salotti domani. Lui lo sa, e sa anche che
            hai ragione.

            Ondrel si volta verso la figlia e le parla piano in elfico, e lei
            gli risponde nella stessa lingua senza abbassare la voce.

            «Per me, da oggi, sei morta» dice Ondrel. «Proprio come tua madre.»

            Esce lasciando la porta aperta alle sue spalle. Liaren va a
            chiuderla e ci resta appoggiata con la fronte, mentre le spalle le
            tremano.
          effetti: { pista.acciaio: 1 }

  # ------------------------------------------------------------ 1 → 2 · la taverniera scomparsa
  - id: la-taverniera-scomparsa
    presso: grifone-di-ferro
    immagine: personaggi/brunella-fennick
    titolo: La taverniera scomparsa
    sommario: "La mattina dopo la colazione non è pronta, per la prima volta da che Brunella si ricordi. Nella stanza di Liaren il letto è intatto."
    luogo: Locanda del Grifone di Ferro, il retrobottega
    area: ponti-sospesi
    requisiti: [pista.acciaio == 1]
    testo: |
      La mattina dopo scendi le scale e ti accorgi subito che manca qualcosa,
      prima ancora di capire che cosa. Il camino è acceso e i tavoli sono
      apparecchiati, ma dalla cucina non arriva nessun odore, e i Raschiatori
      seduti ad aspettare fissano la porta della cucina come si fissa un
      pozzo. Lo stomaco, che si era alzato con l'idea del pane caldo, ci resta
      male prima di te.

      Brunella ti viene incontro prima che tu arrivi in fondo alle scale. Si
      asciuga le mani sul grembiule pulito e continua ad asciugarle anche
      quando sono già asciutte. «Vieni di là» dice. «Un momento solo.»

      {empatia Facile} Il grembiule è pulito perché stamattina non ha
      cucinato. Si sta asciugando le mani per avere qualcosa da fare con le
      mani.

      Il retrobottega è una stanza lunga piena di botti e di sacchi di
      farina, con una branda pieghevole contro il muro e il samisen di
      riserva appeso a un chiodo, con una corda nuova e le altre vecchie.
      Brunella chiude la porta e ci si appoggia con la schiena.

      «Liaren non ha fatto la colazione» dice. «In tutti questi anni non è
      mai successo, nemmeno il giorno dopo il Festival. Ho bussato alla sua
      stanza, e quando non ha risposto sono entrata. Il letto è fatto, e
      stanotte non ci ha dormito nessuno.» Fruga nella tasca del grembiule e
      tira fuori un foglio di pergamena accartocciato e poi lisciato con il
      palmo. «Era per terra accanto al letto. È di suo fratello Isvaro, ed è
      scritto in elfico.»

      Il foglio ti passa fra le dita ancora tiepido della sua tasca. La
      grafia è stretta e inclinata, tirata in fretta. In fondo c'è un nome
      solo. *Ieri sera il padre, stanotte il fratello.* La pergamena ha
      l'odore della cera di candela, e su un angolo c'è l'impronta di un
      pollice sporco di nero.

      {percezione Media} Il nero del pollice è grasso e si sbriciola sotto
      l'unghia. È fuliggine di forno, e somiglia parecchio a quella che ieri
      sera Ondrel aveva sul polsino.

      {accademiche Media fallita} Dovresti riconoscere almeno la forma delle
      lettere. Riconosci soltanto che chi le ha scritte aveva fretta, e
      questo lo sapevi già.
    opzioni:
      - testo: "Leggere la lettera da te"
        descrizione: "L'elfico scritto in fretta è difficile, ma chi l'ha studiato un poco ci arriva."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Alla porta delle consegne
          testo: |
            Isvaro apre la lettera con un *salve, sorella* pieno di riccioli e
            poi va al punto. Scrive che il loro padre potrebbe avere a che
            fare con i guai che Qir-Azel ha avuto con gli orchi, e che non vuole
            andare dalle autorità, perché Ondrel ne uscirebbe pulito con qualche
            mazzetta sottobanco. Le dà appuntamento all'Acciaieria a
            mezzanotte, alla porta delle consegne, dove bisogna bussare due
            volte e poi tre, e dopo una pausa ancora una volta.

            Le raccomanda di non dirlo a nessuno, perché i *bifolchi* di
            quaggiù penserebbero subito che sono coinvolti anche loro, e
            accenna ad altre complicazioni di cui vuole parlarle di persona.
            Sopra la firma ha scritto *non tardare*, e l'ha sottolineato due
            volte.

            {ingannare Media} Un fratello che scrive alla sorella dopo dieci
            anni di silenzio e le chiede soprattutto di non dirlo a nessuno. La
            frase sui bifolchi è l'unica che suona sincera.
          pe: { accademiche: 5 }
          segue: la-storia-dei-tarvelin
        fallimento:
          titolo: Il cesto del pane
          testo: |
            Alla seconda riga ti perdi fra lettere che si somigliano tutte, e
            alla terza ti accorgi di tenere il foglio un po' storto. Brunella
            ti riprende il foglio senza commentare e lo legge lei, piano,
            muovendo le labbra. L'elfico gliel'ha insegnato Liaren da ragazzina, dice,
            quando le lettere per suo fratello all'Accademia gliele portava lei
            nel cesto del pane.

            Isvaro scrive che il loro padre potrebbe avere a che fare con gli
            orchi, e che non vuole andare dalle autorità, perché Ondrel se la
            caverebbe con qualche mazzetta. Dà appuntamento alla sorella
            all'Acciaieria, a mezzanotte, alla porta delle consegne, dove
            bisogna bussare due volte e poi tre, e dopo una pausa ancora una
            volta. Le chiede di non parlarne con nessuno e di non tardare.
          segue: la-storia-dei-tarvelin
      - testo: "Chiedere a Brunella di leggerla"
        descrizione: "Dice che l'elfico lo legge piano, una riga alla volta, ma lo legge."
        esito:
          titolo: Gli occhiali di Brunella
          testo: |
            Brunella tira fuori dal grembiule un paio di occhiali con una
            stanghetta legata con lo spago, e se li sistema sul naso due volte
            prima che stiano dritti. L'elfico gliel'ha insegnato Liaren da
            ragazzina, dice, quando le lettere per suo fratello all'Accademia
            gliele portava lei nel cesto del pane. Poi legge a voce bassa, una
            riga alla volta, traducendo.

            Isvaro scrive che il loro padre potrebbe avere a che fare con gli
            orchi della razzia, e che non vuole andare dalle autorità, perché
            Ondrel se la caverebbe con qualche mazzetta. Dà appuntamento alla
            sorella all'Acciaieria, a mezzanotte, alla porta delle consegne,
            dove bisogna bussare due volte e poi tre, e dopo una pausa ancora
            una volta. Le chiede di non parlarne con nessuno e di non tardare.
            Brunella si toglie gli occhiali e li tiene in mano chiusi, mentre con
            il pollice continua a girare il nodo dello spago.
          segue: la-storia-dei-tarvelin
      - testo: "Leggere la lettera come un compito d'elfico"
        descrizione: "All'Accademia l'elfico si traduce a voce alta, una riga alla volta, davanti a Temmerin. E quel nome è inciso su un banco della terza aula."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Il banco della terza aula
          testo: |
            Il nome in fondo lo conosci prima di leggere la lettera. *Isvaro* è
            inciso con la punta di un coltello su un banco della terza aula,
            all'Accademia, accanto a un arco disegnato bene. Traduci a voce
            alta come fai davanti a Temmerin. Isvaro scrive che il padre
            potrebbe avere a che fare con gli orchi della razzia, e che dalle
            autorità non vuole andare, perché Ondrel ne uscirebbe pulito con
            qualche mazzetta. Dà appuntamento alla sorella all'Acciaieria, a
            mezzanotte, alla porta delle consegne. Bisogna bussare due volte e
            poi tre, e dopo una pausa ancora una volta.

            Sopra la firma Isvaro ha sottolineato due volte *non tardare*.
            Brunella ti guarda come si guarda un dottore che ha appena letto
            una ricetta.

            {accademiche Facile} L'arco sul banco era disegnato bene davvero,
            con la corda tesa e la freccia incoccata. Chi l'ha inciso, a
            lezione, pensava a tutt'altro.
          pe: { accademiche: 5 }
          segue: la-storia-dei-tarvelin

  - id: la-storia-dei-tarvelin
    presso: grifone-di-ferro
    immagine: ambientazione/maniero-tarvelin
    titolo: I figli di Ondrel
    tipo: seguito
    luogo: Locanda del Grifone di Ferro, il retrobottega
    area: ponti-sospesi
    requisiti: [pista.acciaio == 1]
    testo: |
      Brunella si siede su un sacco di farina, che sbuffa una nuvola bianca
      sotto di lei, e per la prima volta da quando la conosci la vedi senza
      niente da fare con le mani. Le tiene in grembo una sopra l'altra
      e non sa bene dove metterle. «Ti racconto dei Tarvelin» dice. «Così
      almeno sai in mezzo a chi ti metti.»

      Isvaro è nato un anno prima di Liaren, mezzelfo, in una casa dove né il
      padre né la madre avevano una goccia di sangue elfico. Per mesi a
      Qir-Azel non si parlò d'altro, e al Maniero Ondrel gridava tanto che
      dalle cucine si sentiva ogni parola. La signora Maerith non disse mai
      chi fosse il padre, e Ondrel se la tenne in casa lo stesso, per
      testardaggine. Il bambino lo mandarono a crescere lontano dalla
      famiglia, all'Accademia di Torvessa. Alla madre vietarono di andarlo a
      trovare.

      {galateo Media} Un figlio che non somiglia al padre, nei Casati, si
      sistema in silenzio con una balia in campagna. Mandarlo all'Accademia
      voleva dire che tutta Qir-Azel sapeva dove trovarlo, e Ondrel voleva
      che lo sapesse.

      {origine rampollo-dei-quartieri-alti} Questa storia nei salotti la
      raccontano ancora, quando i Tarvelin non sono invitati, abbassando la
      voce sulla parola *mezzelfo* come se fosse una parolaccia. Da bambino
      la sentivi da sotto il tavolo, e sentirla da Brunella, con la farina
      sulle ginocchia, ti fa uno strano effetto.

      «Liaren l'ha scoperto a dieci anni, o forse a dodici. Andava a
      trovarlo di nascosto con il pane e le castagne.» Da grandi litigarono,
      e Isvaro la colpì in faccia. Il motivo Brunella non l'ha mai saputo, e
      Liaren non ne ha mai voluto parlare.

      Dieci anni fa morì Maerith, e in città dissero una febbre. Al funerale
      Isvaro gridò davanti a tutti che suo padre l'aveva spinta giù dalla
      scogliera, e Ondrel per poco non gli spaccò la mascella con il
      bastone. Isvaro lo maledisse e sparì, e da allora Liaren non è mai
      riuscita a ritrovarlo.

      {accademiche Media fallita} Cerchi di ricordare da che parte della
      città stia la scogliera del Maniero dei Tarvelin. Ti torna in mente
      soltanto una mappa con una macchia di vino proprio da quelle parti.

      «Mi dispiace per quello che ha passato quel ragazzo» dice Brunella, e
      si pulisce dal ginocchio una farina che non c'è. «Però ha l'animo
      storto, e se torna adesso non porta niente di buono. Galdrick è
      partito per Ghoran, e al sergente di turno questa lettera non la
      faccio leggere. Non so a chi altro chiedere.»

      {origine fuggiasco-di-ghoran} Al nome di Ghoran ti si stringono le
      spalle, e te ne accorgi solo quando Brunella ha già ricominciato a
      parlare. Uno sceriffo che va a Ghoran di sua volontà, e ne parlano
      come di un viaggio qualunque.
    opzioni:
      - testo: "Prometterle che la riporterai a casa"
        descrizione: "Non sai che cosa troverai all'Acciaieria. Brunella però ha bisogno di sentirtelo dire."
        esito:
          titolo: Due notti sul registro
          testo: |
            Glielo prometti, e Brunella annuisce come se le avessi detto il
            prezzo delle uova, ma si alza dal sacco più svelta di come ci si
            era seduta. Ti spiega la strada. L'Acciaieria sta in Città
            Bassa, è un edificio grande di pietra con la ciminiera più alta di
            tutta la città, e non puoi sbagliarti.

            Poi esce dal retrobottega, apre il registro sul bancone e segna due
            notti accanto al tuo nome con la sua grafia tonda. Quando torni in
            sala i Raschiatori hanno davanti la colazione, e Brunella è già ai
            fornelli.

            {empatia Media} Le hai dato una cosa da fare, e lei l'ha presa con
            tutte e due le mani. La promessa adesso resta a te, da mantenere.
          effetti: { indizio.lettera-isvaro: 1, pista.acciaio: 1, alloggio.grifone: 2 }
      - testo: "Accettare i soldi della cassa"
        descrizione: "Brunella ha già contato la cassa sul coperchio di una botte. Dice che Liaren farebbe lo stesso."
        esito:
          titolo: Il conto della cassa
          testo: |
            Le monete sono in pile ordinate come le scodelle sullo scaffale,
            le più consumate sotto e quelle lucide sopra. Brunella te le spinge
            verso la mano con il dorso delle dita, e quando le prendi sembra
            sollevata.

            {conoscenze-della-strada Facile} È l'incasso di una sera buona.
            Stasera al Grifone il resto lo conteranno con più attenzione del
            solito.

            «Sono della cassa» dice. «Liaren te le avrebbe date lo stesso, e
            più in fretta di me.» Ti spiega la strada per l'Acciaieria, in
            Città Bassa, sotto la ciminiera più alta della città. Poi torna in
            cucina, e dopo poco dalla porta socchiusa arriva l'odore del pane.
          effetti: { indizio.lettera-isvaro: 1, pista.acciaio: 1, monete: 20 }
      - testo: "Chiederle com'era Isvaro da ragazzo"
        descrizione: "Se lo troverai, ti conviene sapere che faccia ha e che cosa sa fare."
        esito:
          titolo: Le gare d'arco
          testo: |
            Brunella ci pensa un po' prima di rispondere, e intanto guarda il
            samisen appeso al chiodo come se Isvaro fosse lì dietro. Era un
            ragazzo alto e magro, dice, con le orecchie a punta che da piccolo
            nascondeva sotto i capelli. Parlava poco e ascoltava tutto, e quando Liaren gli
            portava il pane lo divideva in due parti uguali con il coltello.

            All'Accademia vinceva tutte le gare d'arco, e i maestri dicevano
            che non sbagliava mai un colpo. «Se ha un arco in mano, non stargli
            davanti» dice, e ti spiega la strada per l'Acciaieria, sotto la
            ciminiera più alta della Città Bassa.

            {armi-da-distanza Media} Un arciere che non sbaglia mai sceglie
            prima di tutto da dove tirare. Se ti aspetta, ti aspetta in alto e
            con la luce alle spalle.
          pe: { empatia: 5 }
          effetti: { indizio.lettera-isvaro: 1, pista.acciaio: 1 }

  # ------------------------------------------------------------ 2 → 3 · davanti all'Acciaieria
  - id: davanti-all-acciaieria
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: L'Acciaieria chiusa
    sommario: "Le persiane sono sprangate e nel cortile non c'è un operaio. La ciminiera dei Tarvelin però fuma come nei giorni di colata."
    luogo: Acciaieria dei Tarvelin, Città Bassa
    area: citta-bassa
    requisiti: [pista.acciaio == 2]
    testo: |
      L'Acciaieria dei Tarvelin occupa un isolato intero ai piedi della sua
      ciminiera, e da qualunque vicolo tu arrivi te la trovi davanti. Sulla
      facciata le vetrine della sala dei clienti sono coperte da persiane di
      legno sprangate dall'interno, come tutte le finestre dei due piani, e
      il cancello del cortile è chiuso con una catena nuova, ancora lucida,
      passata intorno a un lucchetto vecchio. Dalla ciminiera sale un fumo
      denso. Sotto il fumo non si sente un martello, e nemmeno la voce di un
      caposquadra.

      {tecnologia Media} Una fornace accesa senza nessuno al maglio è una
      fornace che fonde e basta. Qualcuno là dentro sta colando, e non vuole
      che il rumore dei martelli lo dica in giro.

      Una donna stende il bucato su una corda tesa fra due finestre di
      fronte, con le lenzuola già grigie prima di asciugarsi, e quando vede
      che guardi l'Acciaieria ti parla dall'alto con una molletta fra i
      denti. Da due settimane là dentro non entra e non esce
      nessuno, a parte il vecchio la sera tardi, dice, eppure il forno va
      giorno e notte. «Il vecchio starà
      facendo qualcosa di grosso per la Gilda. Quando lavora alle cose grosse
      non vuole gente intorno.»

      Giri intorno al muro di cinta fino alla parte del forno. Il rombo della
      fornace passa attraverso la pietra, e in mezzo al rombo ogni tanto
      senti delle voci gutturali che ridono in una lingua sentita la notte
      della razzia. Le spalle ti si irrigidiscono prima che tu abbia finito
      di riconoscerla. *Orchi, a due vicoli dal mercato.* Senza volerlo ti
      stacchi dal muro di un passo, come se la pietra scottasse.

      {resilienza Media fallita} L'ultima volta che hai sentito quelle
      risate c'era il fuoco sui tetti. Il cuore se lo ricorda benissimo, e
      per un po' decide di battere per conto suo.

      Sul retro, in un vicolo stretto, c'è una porta di ferro bassa con la
      scritta *consegne* dipinta a mano e la *n* rovesciata. Accanto al
      cancello c'è la porticina degli operai, con una serratura vecchia, e
      sul tetto della sala dei clienti c'è un lucernaio che nessuno si è
      preso la briga di coprire.
    opzioni:
      - testo: "Bussare alla porta delle consegne"
        descrizione: "Il segnale della lettera era per Liaren. Qualcuno, dentro, potrebbe aspettarlo ancora."
        requisiti: [indizio.lettera-isvaro >= 1]
        esito:
          titolo: La spranga
          testo: |
            Nel vicolo dietro la fornace non passa nessuno. Bussi alla porta di
            ferro due volte e poi tre, e dopo una pausa bussi ancora una
            volta. Per un po' non succede niente. Poi dall'altra parte una
            spranga scorre nei ganci, e la porta si apre di un palmo con un
            cigolio lungo.

            Dietro non c'è nessuno. C'è un corridoio buio che puzza di cenere
            bagnata, e in fondo dei passi pesanti si allontanano verso il
            rombo del forno. Chi ha aperto aspettava qualcun altro, oppure non
            gli importa chi entra.

            {furtivita Media} Passi pesanti e senza fretta, che non si voltano.
            Se ti muovi quando si muovono loro, il rombo del forno copre anche
            i tuoi.

            Ti infili dentro e accosti la porta alle tue spalle, piano, finché
            la spranga non tocca il gancio.
          imposta: { pista.acciaio: 3 }
          vai: acciaieria
      - testo: "Salire al lucernaio"
        descrizione: "Dalla grondaia della casa accanto al tetto della sala dei clienti c'è un salto di due braccia."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il vetro scoperto
          testo: |
            Sali dalla grondaia della casa accanto, con le tegole che
            scricchiolano sotto le suole, e salti sul tetto della sala dei
            clienti. Il telaio del lucernaio è vecchio, e una lastra si solleva
            con la punta del coltello. Sotto c'è la sala al buio, con le spade
            appese alle pareti e le vetrine coperte da teli. Ti cali appeso al
            telaio e atterri su un tappeto piegando le ginocchia.

            Resti accucciato ad ascoltare, con il cuore che ci mette un po' più
            delle ginocchia a calmarsi. Dal fondo dell'edificio arrivano il
            rombo del forno e, di tanto in tanto, una risata.
          imposta: { pista.acciaio: 3 }
          vai: acciaieria
        fallimento:
          titolo: La grondaia
          testo: |
            A metà salita la grondaia si stacca da un gancio e ti lascia appeso
            per le mani, con il gomito che sbatte contro il muro. Arrivi sul
            tetto con la manica strappata e il braccio che pulsa, e la lastra
            del lucernaio ti scivola dalle dita e si rompe sul pavimento di
            sotto.

            Resti fermo a lungo, con le ginocchia sul telaio, ma nessuno viene a
            guardare, perché il rombo del forno copre tutto. Alla fine ti cali
            fra i vetri rotti e atterri male su una caviglia, in una sala piena
            di spade appese.

            {resistenza Facile} La caviglia regge. Fa male, ti avverte che farà
            più male domani, e intanto regge.
          imposta: { pista.acciaio: 3 }
          effetti: { ferite: 0.5 }
          vai: acciaieria
      - testo: "Forzare la porticina degli operai"
        descrizione: "La serratura è vecchia, ma in strada c'è gente, e un eroe del Festival che scassina l'Acciaieria dei Tarvelin fa notizia. Bisogna tenerli buoni mentre lavori."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Uno pagato a giornata
          testo: |
            Al secondo colpo di spalla la serratura salta, e in un momento hai
            intorno un capannello di vicini con la donna del bucato in prima
            fila. Racconti che la famiglia ti paga a giornata per dare
            un'occhiata, perché il vecchio Tarvelin non risponde alla porta e
            potrebbe essersi sentito male. Lo dici sbadigliando e grattandoti
            la nuca, con la noia di un garzone pagato poco e male, e i vicini
            tornano alle loro porte uno alla volta, delusi.

            La donna del bucato è l'ultima ad andarsene. Prima di rientrare ti
            raccomanda di dire al vecchio che il suo fumo le annerisce le
            lenzuola.
          imposta: { pista.acciaio: 3 }
          vai: acciaieria
        fallimento:
          titolo: Il capannello
          testo: |
            La serratura cede, ma il capannello che ti si forma intorno non ha
            nessuna voglia di andarsene. Un ragazzo con il grembiule da garzone
            giura di averti visto combattere al Festival, e una vecchia
            vuole sapere chi ti paga. Le rispondi male, lei se lo segna con
            un sorriso stretto, e tu ti infili dentro.

            Mentre accosti la porta senti il ragazzo che corre verso il mercato
            a raccontarlo, e la vecchia che ripete a chi arriva la tua
            descrizione, aggiungendo ogni volta qualcosa.
          imposta: { pista.acciaio: 3 }
          effetti: { sospetto: 0.5, scandalo: 0.5 }
          vai: acciaieria
      - testo: "Entrare dallo scivolo del carbone"
        descrizione: "Da bambino, d'inverno, il carbone dei Tarvelin lo rubavi da lì. Lo sportello si apre dal basso, se sai dove dare il colpo."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Lo scivolo
          testo: |
            Sul fianco dell'Acciaieria, a filo del selciato, c'è ancora lo
            sportello di ferro dove scaricano il carbone. Da bambino ci venivi
            d'inverno con un sacco e altri due della tua strada, e lo sportello
            si apriva con un colpo secco nell'angolo in basso, dove il cardine
            è storto. Si apre ancora nello stesso modo al primo colpo, e ti
            viene da ridere da solo in mezzo alla strada.

            {furtivita Facile} Nessuno guarda in basso. La gente guarda le
            finestre e le porte, mai uno sportello del carbone a filo del
            selciato.

            Ti cali
            sulla schiena giù per lo scivolo, con la polvere nera che ti entra
            nel colletto, e finisci su un mucchio di carbone in un ripostiglio
            buio accanto alla sala dei clienti.

            Resti fermo nel buio ad ascoltare. Dal fondo dell'edificio arrivano
            il rombo del forno e, ogni tanto, una risata.
          imposta: { pista.acciaio: 3 }
          vai: acciaieria
      - testo: "Salire al lucernaio come su un'impalcatura"
        descrizione: "Sulle piattaforme della Cicatrice si sale con tre appigli sempre fermi e il peso sui talloni. Una grondaia di città non fa più paura di un ponteggio sul vuoto."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Tre appigli
          testo: |
            Prima di salire provi la grondaia con due strattoni, come ti hanno
            insegnato a provare le funi prima di ogni turno, e trovi il gancio
            allentato prima che sia lui a trovare te. Sali dal lato buono, con
            tre appigli sempre fermi, e il salto fino al tetto della sala dei
            clienti è più corto di tanti che hai fatto sopra la Cicatrice.

            {atletica Facile} Una tegola di città sta ferma dove la metti. Sulle
            piattaforme ti sei abituato a peggio.

            La lastra del lucernaio si solleva con la punta del coltello. Ti
            cali appeso al telaio in una sala al buio, con le spade alle pareti
            e le vetrine coperte da teli, e atterri su un tappeto piegando le
            ginocchia. Dal fondo dell'edificio arrivano il rombo del forno e,
            ogni tanto, una risata.
          imposta: { pista.acciaio: 3 }
          vai: acciaieria

  # ------------------------------------------------------------ carta della pista
  - id: carta-due-settimane-di-fumo
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Due settimane di fumo
    sommario: "Al lavatoio una donna strizza la camicia del marito, fonditore all'Acciaieria. Da due settimane la ciminiera fuma e lui non torna a casa."
    tipo: carta
    area: citta-bassa
    requisiti: [pista.acciaio >= 1, pista.acciaio <= 2]
    testo: |
      Dal lavatoio dove le donne della Città Bassa sciacquano i panni la
      ciminiera dei Tarvelin si vede tutta, alta sopra i tetti, con un
      pennacchio di fumo grigio che il vento piega verso il fiume. Una donna
      con le maniche rimboccate strizza una camicia da uomo da quando sei
      arrivato, sempre la stessa. L'acqua che ne esce ormai è limpida da
      un pezzo. La vicina ti dice senza che tu lo chieda che si chiama
      Gisella, e che suo marito fa il fonditore all'Acciaieria da vent'anni.

      {empatia Facile} La camicia è pulita da un pezzo. È di lui, e finché
      la strizza Gisella ha una ragione per restare qui a guardare la
      ciminiera.

      Da due settimane il marito non torna a casa. Il primo giorno è passato
      un ragazzo con un biglietto firmato da Ondrel Tarvelin, dove c'era
      scritto *commessa urgente, gli operai dormono in fabbrica*, e da allora
      non si è visto più nessuno. Neanche la paga della settimana è arrivata.

      {politica-ed-economia Media} Una commessa urgente paga gli
      straordinari, e chi paga gli straordinari non si dimentica la paga
      della settimana. Questa commessa la paga qualcuno che non passa dalla
      cassa.

      Gisella immerge la camicia nell'acqua e ricomincia a strizzarla, mentre
      le altre donne parlano d'altro a voce alta, del prezzo del sapone e di
      una cognata, e intanto la guardano.

      {origine figlio-della-citta-bassa} I lavatoi della Città Bassa li
      conosci da quando ci giocavi sotto le vasche. Quando le donne parlano
      del sapone così forte, vuol dire che a qualcuna è successa una
      disgrazia, e le altre le fanno la guardia.
    opzioni:
      - testo: "Parlare con Gisella"
        descrizione: "Strizza quella camicia da troppo tempo. Forse aspetta soltanto che qualcuno le chieda del marito."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Una voce dal cortile
          testo: |
            Gisella ti lascia sederti sul bordo della vasca, e si sposta un
            poco per farti posto senza smettere di strizzare. Tre sere fa è andata
            al cancello dell'Acciaieria e ha chiamato il marito per nome,
            forte, finché le è venuta la voce roca. Dal cortile le ha risposto
            qualcuno in una lingua che non era la nostra, e dopo un momento ha
            sentito ridere.

            «Il mio Doro non ride mai, nemmeno all'osteria» dice, e torna a
            strizzare la camicia.

            {resilienza Media} Gisella sa benissimo di chi era quella risata.
            Ha deciso di tenerselo in bocca, perché detto ad alta voce diventerebbe vero.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: La camicia bagnata
          testo: |
            Gisella ti ascolta con la camicia ferma fra le mani, e l'acqua le
            gocciola sui piedi senza che se ne accorga. Poi ti chiede se ti
            manda il vecchio Tarvelin, e prima che tu possa rispondere
            raccoglie i panni nella cesta e se ne va con la camicia bagnata
            sulla spalla. Le altre donne smettono di parlare e restano a
            guardarti, con le mani nell'acqua, finché non te ne sei andato anche
            tu dal lavatoio.
          effetti: {}
      - testo: "Lasciarle qualche moneta per la settimana"
        descrizione: "La paga non è arrivata, e le monete arrivano prima delle domande."
        requisiti: [monete >= 5]
        esito:
          titolo: Il biglietto
          testo: |
            Gisella guarda le monete a lungo prima di prenderle, poi le mette in
            tasca e tira fuori il biglietto del primo giorno, piegato in otto.
            La firma di Ondrel Tarvelin è in fondo, con lo svolazzo del casato,
            ma la riga è storta e l'inchiostro ha fatto una macchia dove la
            penna si è fermata.

            «Vent'anni che lavora per lui» dice Gisella. «Non l'ho mai visto
            scrivere storto.» Si riprende il biglietto e lo ripiega lungo le
            stesse pieghe.

            {percezione Media} La macchia è dove la penna ha esitato, sulla
            prima lettera del nome. Chi ha firmato ci ha pensato su, o qualcuno
            gli teneva la mano.
          effetti: { monete: -5, informazioni.voce: 1 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: "Prosegui oltre il lavatoio. Dietro di te Gisella immerge di nuovo la camicia nell'acqua fredda, e le altre ricominciano a parlare del sapone."
      - testo: "Sederti accanto a lei come al capezzale"
        descrizione: "Il Velo insegna a stare vicino a chi aspetta notizie, senza fare domande. Si comincia dalle mani, e le sue sono gelate."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Le mani nell'acqua
          testo: |
            Ti siedi sul bordo della vasca e le prendi la camicia dalle mani,
            piano, come in Cattedrale si prende la ciotola a chi ha vegliato
            tutta la notte. La strizzi tu una volta sola e gliela rendi. Le
            dita di Gisella sono bianche e gonfie d'acqua fredda, e per un po'
            non dice niente. Tre sere fa è andata al cancello dell'Acciaieria e
            ha chiamato il marito per nome, finché le è venuta la voce roca.
            Dal cortile le ha risposto qualcuno in una lingua che non era la
            nostra, e dopo un momento ha sentito ridere.

            «Il mio Doro non ride mai, nemmeno all'osteria» dice.

            {medicina Facile} Le mani le si scalderanno in un'ora. Il resto
            avrà bisogno di più tempo, e di una notizia.
          effetti: { informazioni.voce: 1 }
