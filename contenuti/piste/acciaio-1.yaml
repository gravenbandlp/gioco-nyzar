# La pista "Acciaio e Ira" (pista.acciaio), passi 0 → 3: Ondrel al Grifone di Ferro, la sparizione di
# Liaren e la lettera di Isvaro, l'arrivo davanti all'Acciaieria. Più una carta della Città Bassa.
storylet:
  # ------------------------------------------------------------ 0 → 1 · Ondrel al Grifone
  - id: ondrel-al-grifone
    presso: grifone-di-ferro
    immagine: personaggi/ondrel-tarvelin
    titolo: L'ultimatum
    sommario: "A metà sera la porta del Grifone sbatte contro il muro. Ondrel Tarvelin è tornato a cercare la figlia, davanti a tutta la sala."
    luogo: Locanda del Grifone di Ferro, di sera
    area: ponti-sospesi
    requisiti: [pista.tribu >= 4, pista.acciaio == 0]
    testo: |
      I Raschiatori del turno lungo giocano a dadi su una coperta stesa fra due tavoli, e Brunella gira con la
      pentola della zuppa. I dadi sono d'osso e sulla lana rimbalzano senza fare rumore.

      La porta sbatte contro il muro e la sala si zittisce un tavolo alla volta. Sulla soglia c'è Ondrel
      Tarvelin, pallido, con le solite vesti scure e un bastone nero dal puntale d'acciaio. «Liaren Tarvelin»
      dice, come se leggesse un registro. «Domattina all'alba parte una carrozza per Laresh con un posto
      pagato a tuo nome. È l'ultima volta che te lo offro.»

      Poi Ondrel vede te e viene al tuo tavolo. Da vicino sa di carbone, e sul polsino destro ha un velo di
      fuliggine che arriva fino all'anello con il sigillo dei Tarvelin. Il resto della veste è spazzolato con
      cura fino all'orlo. «Lei era con quella masnada di spacconi del Festival» dice. «Avreste potuto far
      bruciare mezza città, e adesso la città vi offre da bere. Non gradisco che dei combinaguai frequentino
      mia figlia.» Sotto le sue dita il pomo del bastone trema appena.

      {medicina Media} Il tremito della vecchiaia è sempre uguale, e questo arriva a ondate. È quello di un
      uomo che non dorme da giorni e tira avanti a forza di nervi.

      {origine apprendista-raschiatore} Al tavolo dei dadi ci sono due che hanno fatto turno con te sulle
      piattaforme. Quando Ondrel dice *combinaguai* il più vecchio si gira verso di te e aspetta di vedere se
      rispondi.
    opzioni:
      - testo: "Rispondergli davanti a tutta la sala"
        descrizione: "La sala ascolta, e in trent'anni Ondrel Tarvelin non ha mai detto una parola sbagliata. Tocca a te trovare quella giusta."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Il boccale sul tavolo
          testo: |
            Gli ricordi che la sera della razzia le guardie erano poche e gli orchi tanti, e che chi c'era non
            aveva il tempo di aspettare il permesso della Caserma. Al tavolo dei dadi uno dei Raschiatori posa
            il boccale sul tavolo con un colpo secco, e un altro fa lo stesso.

            «Per me, da oggi, sei morta» dice Ondrel. «Proprio come tua madre.»

            Esce lasciando la porta aperta alle sue spalle. Liaren va a chiuderla e ci resta appoggiata con la
            fronte, mentre le spalle le tremano.
          effetti: { pista.acciaio: 1 }
        fallimento:
          titolo: Una parola di troppo
          testo: |
            Cominci bene, poi ti scappa una parola grossa e Ondrel la raccoglie al volo, con la destrezza di
            trent'anni passati ai tavoli della Gilda. «Ecco come parlano gli eroi del Festival» dice alla sala
            battendo il puntale, e al tavolo dei dadi qualcuno abbassa gli occhi. Sulle assi il puntale
            d'acciaio lascia un'ammaccatura chiara.

            «Per me, da oggi, sei morta» dice Ondrel. «Proprio come tua madre.»

            Esce senza chiudere la porta, e dai Ponti entra un'aria fredda che fa piegare le fiamme delle
            candele su tutti i tavoli.
          effetti: { pista.acciaio: 1, scandalo: 1 }
      - testo: "Metterti fra lui e Liaren"
        descrizione: "È un vecchio con un bastone. Mettergli le mani addosso è facile, e domattina alla Casa dei Nodi lo sapranno tutti."
        esito:
          titolo: Il polso del vecchio
          testo: |
            Quando Ondrel alza il bastone verso la figlia ti alzi anche tu, e la sedia cade all'indietro con
            un rumore che nessuno raccoglie. Gli prendi il polso a mezz'aria. È un polso magro e duro, e sotto
            le tue dita il battito corre come quello di chi ha fatto le scale di corsa.

            Ondrel libera il polso con uno strattone e si tira giù la manica fino a coprire il polsino.

            «Per me, da oggi, sei morta» dice Ondrel alla figlia, senza più guardarti. «Proprio come tua
            madre.»

            Esce lasciando la porta aperta alle sue spalle.
          effetti: { pista.acciaio: 1, rep.tarvelin: -1 }
      - testo: "Lasciare che sia Liaren a rispondere"
        descrizione: "È la sua locanda, ed è suo padre. Dicono che la mattina del Festival se la sia cavata da sola, con un pentolone."
        esito:
          titolo: Il mestolo sul muro
          testo: |
            Resti sedut{o|a} con le mani attorno al boccale, e Liaren esce da dietro il bancone e si pianta
            davanti al padre a braccia incrociate, con lo strofinaccio ancora sulla spalla. «Questa è la mia
            locanda, e qui tu non sei il benvenuto» dice. Ha la voce bassa e ferma, e sulla coperta nessuno
            raccoglie più i dadi.

            «Per me, da oggi, sei morta» dice Ondrel, battendo il puntale sulle assi una volta sola. «Proprio
            come tua madre.»

            Liaren chiude la porta dietro di lui con un colpo che fa tremare le lanterne, e ci resta
            appoggiata con la fronte finché non smette di piangere.
          effetti: { pista.acciaio: 1 }
      - testo: "Guardarlo bene mentre parla"
        descrizione: "Un uomo che da trent'anni pesa ogni parola stasera ha sbattuto una porta. Vale la pena di guardargli le mani."
        prova: { attributo: mentale, abilita: [percezione, medicina], difficolta: Media }
        successo:
          titolo: La fuliggine sul polsino
          testo: |
            Ha le occhiaie scure di tre notti senza sonno, e le dita gli tremano sul pomo del bastone. Sotto
            la mascella ha un taglietto da rasoio, di chi si è sbarbato in fretta e con la mano che non stava
            ferma. Mentre parla con la figlia gira due volte gli occhi verso la porta.

            {percezione Media} Un uomo che teme di essere seguito guarda la porta da cui è entrato. Lui guarda
            quella da cui deve uscire, e conta il tempo che gli resta.

            «Per me, da oggi, sei morta» dice Ondrel. «Proprio come tua madre.»

            Esce in fretta, e Liaren va a chiudere la porta e ci resta appoggiata con la fronte.
          effetti: { pista.acciaio: 1, informazioni.voce: 1 }
        fallimento:
          titolo: I bottoni
          testo: |
            Lo guardi troppo, e Ondrel se ne accorge a metà frase. «Ha finito di contarmi i bottoni?» chiede,
            e al tavolo dei dadi qualcuno ride di te. I bottoni sono d'osso nero e salgono fitti fino al
            mento.

            Il vecchio torna dalla figlia e le parla in elfico, e lei gli risponde a tono nella stessa lingua.
            Delle loro parole capisci soltanto il tono, che sale a ogni battuta.

            «Per me, da oggi, sei morta» dice Ondrel. «Proprio come tua madre.»

            Esce lasciando la porta aperta, e Liaren va a chiuderla con le spalle che le tremano.
          effetti: { pista.acciaio: 1, tormento: 0.5 }
      - testo: "Salutarlo come si saluta un consigliere della Gilda"
        descrizione: "Alla Casa dei Nodi l'hai visto firmare con i polsini bianchi e le dita pulite. Stasera ha la fuliggine fino all'anello."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: I polsini della Casa dei Nodi
          testo: |
            Ti alzi e lo saluti con il titolo che gli spetta alla Casa dei Nodi, con l'inchino corto che si
            usa sulle scale e non nei saloni, e Ondrel guarda la licenza della Gilda che porti alla cintura
            prima di guardarti in faccia. Lassù l'hai visto firmare i contratti del lyssan con i polsini
            bianchi, e il carbone lo lasciava ai capisquadra. Stasera la fuliggine gli arriva all'anello ed è
            fresca, ancora lucida di grasso nella piega della stoffa.

            «Per me, da oggi, sei morta» dice Ondrel. «Proprio come tua madre.»

            Esce lasciando la porta aperta. Liaren va a chiuderla e ci resta appoggiata con la fronte, mentre
            le spalle le tremano.
          effetti: { pista.acciaio: 1, informazioni.voce: 1 }
      - testo: "Rispondergli con le maniere dei Casati"
        descrizione: "Nei Quartieri Alti si insegna a dodici anni come si zittisce un vecchio senza alzare la voce. Basta ricordargli dove si trova."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il cognome intero
          testo: |
            Ti alzi, gli fai l'inchino che nei saloni si riserva ai consiglieri della Gilda, e lo chiami con
            il cognome intero, come lui ha appena chiamato la figlia. Poi gli chiedi, con la voce dei pranzi
            del Consiglio, se i Tarvelin abbiano preso l'abitudine di sbrigare gli affari di famiglia nelle
            locande dei Ponti, perché in tal caso qualcuno dovrà avvertire le altre famiglie. Ondrel non
            risponde subito, e per la prima volta da quando è entrato il bastone gli resta fermo in mano.

            «Per me, da oggi, sei morta» dice Ondrel. «Proprio come tua madre.»

            Esce lasciando la porta aperta alle sue spalle. Liaren va a chiuderla e ci resta appoggiata con la
            fronte, mentre le spalle le tremano.
          effetti: { pista.acciaio: 1 }

  # ------------------------------------------------------------ 1 → 2 · la taverniera scomparsa
  - id: la-taverniera-scomparsa
    presso: grifone-di-ferro
    immagine: personaggi/brunella-fennick
    titolo: La taverniera scomparsa
    sommario: "La mattina dopo la colazione non è pronta, per la prima volta da che Brunella si ricordi. Nella stanza di Liaren il letto è intatto."
    luogo: Locanda del Grifone di Ferro, il retrobottega
    area: ponti-sospesi
    requisiti: [pista.acciaio == 1]
    testo: |
      Brunella ti viene incontro prima che tu arrivi in fondo alle scale e ti porta nel retrobottega, fra i
      sacchi di farina e le botti. Dalla cucina accanto stamattina non arriva l'odore del pane.

      «Liaren non ha fatto la colazione» dice. «In tutti questi anni non è mai successo, nemmeno il giorno
      dopo il Festival. Sono entrata nella sua stanza e il letto è fatto, perché stanotte non ci ha dormito
      nessuno.» Dalla tasca del grembiule tira fuori una pergamena accartocciata e poi lisciata con il palmo.
      «Era per terra accanto al letto. È di suo fratello Isvaro, ed è scritta in elfico.»

      La pergamena ha ancora le pieghe bianche dove l'hanno stretta nel pugno. La scrittura è fitta e scende
      inclinata verso il margine destro, come quella di chi scrive in fretta. In fondo c'è un nome solo, e su
      un angolo c'è l'impronta di un pollice sporco di nero.

      {percezione Media} Il nero del pollice è grasso e si sbriciola sotto l'unghia. È fuliggine di forno,
      come quella che ieri sera Ondrel aveva sul polsino.
    opzioni:
      - testo: "Leggere la lettera da te"
        descrizione: "L'elfico scritto in fretta è difficile, ma chi l'ha studiato un poco ci arriva."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Alla porta delle consegne
          testo: |
            Isvaro apre la lettera con un *salve, sorella* pieno di riccioli e poi va al punto. Scrive che il
            loro padre potrebbe avere a che fare con i guai che Qir-Azel ha avuto con gli orchi, e che non
            vuole andare dalle autorità, perché Ondrel ne uscirebbe pulito con qualche mazzetta sottobanco. Le
            dà appuntamento all'Acciaieria a mezzanotte, alla porta delle consegne, dove bisogna bussare due
            volte e poi tre, e dopo una pausa ancora una volta.

            Sopra la firma ha scritto *non tardare*, e l'ha sottolineato due volte con tanta forza che la
            penna ha inciso la pergamena.
          pe: { accademiche: 5 }
          segue: la-storia-dei-tarvelin
        fallimento:
          titolo: Il cesto del pane
          testo: |
            Brunella ti riprende il foglio senza commentare. Si mette gli occhiali che tiene nella tasca del
            grembiule e lo legge lei, piano, muovendo le labbra.

            Isvaro scrive che il loro padre potrebbe avere a che fare con gli orchi, e che non vuole andare
            dalle autorità, perché Ondrel se la caverebbe con qualche mazzetta. Dà appuntamento alla sorella
            all'Acciaieria, a mezzanotte, alla porta delle consegne, dove bisogna bussare due volte e poi tre,
            e dopo una pausa ancora una volta. Le chiede di non parlarne con nessuno e di non tardare.
          segue: la-storia-dei-tarvelin
          effetti: { tormento: 0.5 }
      - testo: "Chiedere a Brunella di leggerla"
        descrizione: "Dice che l'elfico lo legge piano, una riga alla volta, ma lo legge."
        esito:
          titolo: Gli occhiali di Brunella
          testo: |
            Brunella si mette sul naso un paio di occhiali con la montatura di filo di ferro e legge piano,
            una riga alla volta, con il dito sotto le parole.

            Isvaro scrive che il loro padre potrebbe avere a che fare con gli orchi della razzia, e che non
            vuole andare dalle autorità, perché Ondrel se la caverebbe con qualche mazzetta. Dà appuntamento
            alla sorella all'Acciaieria, a mezzanotte, alla porta delle consegne, dove bisogna bussare due
            volte e poi tre, e dopo una pausa ancora una volta. Le chiede di non parlarne con nessuno e di non
            tardare.
          segue: la-storia-dei-tarvelin
      - testo: "Leggere la lettera come un compito d'elfico"
        descrizione: "All'Accademia l'elfico si traduce a voce alta, una riga alla volta, davanti a Temmerin. E quel nome è inciso su un banco della terza aula."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Il banco della terza aula
          testo: |
            Il nome in fondo lo conosci prima di leggere la lettera. *Isvaro* è inciso con la punta di un
            coltello su un banco della terza aula, all'Accademia, accanto a un arco disegnato bene. Le lettere
            del banco sono strette e profonde, e la *v* ha lo stesso uncino di quella sulla pergamena. Traduci
            a voce alta come fai davanti a Temmerin. Isvaro scrive che il padre potrebbe avere a che fare con
            gli orchi della razzia, e che dalle autorità non vuole andare, perché Ondrel ne uscirebbe pulito
            con qualche mazzetta. Dà appuntamento alla sorella all'Acciaieria, a mezzanotte, alla porta delle
            consegne. Bisogna bussare due volte e poi tre, e dopo una pausa ancora una volta.
          pe: { accademiche: 5 }
          segue: la-storia-dei-tarvelin

  - id: la-storia-dei-tarvelin
    presso: grifone-di-ferro
    immagine: ambientazione/maniero-tarvelin
    titolo: I figli di Ondrel
    tipo: seguito
    luogo: Locanda del Grifone di Ferro, il retrobottega
    area: ponti-sospesi
    requisiti: [pista.acciaio == 1]
    testo: |
      Brunella si siede su un sacco di farina, e per la prima volta da quando la conosci non ha niente da fare
      con le mani. Le tiene ferme sul grembiule, una sopra l'altra. «Ti racconto dei Tarvelin» dice. «Così
      almeno sai in mezzo a chi ti metti.»

      Isvaro è nato mezzelfo un anno prima di Liaren, da due genitori senza una goccia di sangue elfico. La
      signora Maerith non disse mai chi fosse il padre, e Ondrel se la tenne in casa per testardaggine. Il
      bambino lo mandarono a crescere all'Accademia di Torvessa.

      {origine rampollo-dei-quartieri-alti} Nei salotti questa storia la raccontano ancora quando i Tarvelin
      non ci sono, abbassando la voce su *mezzelfo*. Da bambin{o|a} la sentivi da sotto il tavolo.

      «Liaren l'ha scoperto a dieci anni, o forse a dodici. Andava a trovarlo di nascosto con il pane e le
      castagne.» Da grandi litigarono, e Isvaro la colpì in faccia.

      Dieci anni fa Maerith morì, di una febbre secondo la città. Al funerale Isvaro gridò che il padre
      l'aveva spinta giù dalla scogliera, e Ondrel per poco non gli spaccò la mascella con il bastone. Isvaro
      lo maledisse e sparì, e Liaren non l'ha più ritrovato.

      «Mi dispiace per quel ragazzo» dice Brunella. «Però ha l'animo storto, e se torna adesso non porta
      niente di buono. Galdrick è partito per Ghoran, e al sergente di turno questa lettera non la faccio
      leggere. Non so a chi altro chiedere.»

      {origine fuggiasco-di-ghoran} Al nome di Ghoran ti si stringono le spalle. Qui uno sceriffo ci va di sua
      volontà, e ne parlano come di un viaggio qualunque.
    opzioni:
      - testo: "Prometterle che la riporterai a casa"
        descrizione: "Non sai che cosa troverai all'Acciaieria. Brunella però ha bisogno di sentirtelo dire."
        esito:
          titolo: Due notti sul registro
          testo: |
            Glielo prometti, e Brunella annuisce come se le avessi detto il prezzo delle uova, ma si alza dal
            sacco più svelta di come ci si era seduta. L'Acciaieria sta in Città Bassa, dice. È un edificio
            grande di pietra con la ciminiera più alta di tutta la città, e non puoi sbagliarti.

            Poi esce dal retrobottega, apre il registro sul bancone e segna due notti accanto al tuo nome con
            la sua grafia tonda. Prima di chiudere il registro soffia sull'inchiostro, perché le due righe non
            si stampino sulla pagina di fronte.
          effetti: { indizio.lettera-isvaro: 1, pista.acciaio: 1, alloggio.grifone: 2 }
      - testo: "Accettare i soldi della cassa"
        descrizione: "Brunella ha già contato la cassa sul coperchio di una botte. Dice che Liaren farebbe lo stesso."
        esito:
          titolo: Il conto della cassa
          testo: |
            Le monete sono in pile ordinate come le scodelle sullo scaffale, le più consumate sotto e quelle
            lucide sopra. Brunella te le spinge verso la mano con il dorso delle dita, e quando le prendi
            sembra sollevata.

            «Sono della cassa» dice. «Liaren te le avrebbe date lo stesso, e più in fretta di me.» Ti spiega
            la strada per l'Acciaieria, in Città Bassa, sotto la ciminiera più alta della città. Poi torna in
            cucina, e dopo poco dalla porta socchiusa arrivano l'odore del pane e il colpo sordo dell'impasto
            battuto sul tavolo.
          effetti: { indizio.lettera-isvaro: 1, pista.acciaio: 1, monete: 20 }
      - testo: "Chiederle com'era Isvaro da ragazzo"
        descrizione: "Se lo troverai, ti conviene sapere che faccia ha e che cosa sa fare."
        esito:
          titolo: Le gare d'arco
          testo: |
            Era un ragazzo alto e magro, dice, con le orecchie a punta che da piccolo nascondeva sotto i
            capelli.

            All'Accademia vinceva tutte le gare d'arco, e i maestri dicevano che non sbagliava mai un colpo.
            «Se ha un arco in mano, non stargli davanti» dice, e con due dita tira indietro una corda che non
            c'è fino all'orecchio. Poi ti spiega la strada per l'Acciaieria, sotto la ciminiera più alta della
            Città Bassa.
          pe: { empatia: 5 }
          effetti: { indizio.lettera-isvaro: 1, pista.acciaio: 1 }

  # ------------------------------------------------------------ 2 → 3 · davanti all'Acciaieria
  - id: davanti-all-acciaieria
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: L'Acciaieria chiusa
    sommario: "Le persiane sono sprangate e nel cortile non c'è un operaio. La ciminiera dei Tarvelin però fuma come nei giorni di colata."
    luogo: Acciaieria dei Tarvelin, Città Bassa
    area: citta-bassa
    requisiti: [pista.acciaio == 2]
    testo: |
      L'Acciaieria dei Tarvelin occupa un isolato intero ai piedi della sua ciminiera, da cui sale un fumo
      denso. Il fumo sale dritto e nero, e intorno alla bocca della ciminiera non gira nemmeno un piccione.
      Dall'edificio però non si sente un martello, né la voce di un caposquadra.

      Dalla finestra di fronte una donna stende il bucato, e quando vede che guardi l'Acciaieria ti parla con
      una molletta fra i denti. Da due settimane là dentro non entra e non esce nessuno, a parte il vecchio la
      sera tardi, eppure il forno va giorno e notte.

      Quando appoggi il palmo al muro la pietra è tiepida anche dal lato in ombra. Il rombo della fornace
      passa attraverso la pietra e ti arriva nelle ossa del polso, e ogni tanto ci senti dentro voci gutturali
      che ridono nella lingua della notte della razzia.

      Nel vicolo sul retro c'è una porta di ferro bassa con la scritta *consegne* dipinta a mano e la *n*
      rovesciata. Accanto al cancello c'è la porticina degli operai con una serratura vecchia, e sul tetto
      della sala dei clienti c'è un lucernaio scoperto.
    opzioni:
      - testo: "Bussare alla porta delle consegne"
        descrizione: "Il segnale della lettera era per Liaren. Qualcuno, dentro, potrebbe aspettarlo ancora."
        requisiti: [indizio.lettera-isvaro >= 1]
        esito:
          titolo: La spranga
          testo: |
            Bussi alla porta di ferro due volte e poi tre, e dopo una pausa bussi ancora una volta. Poi
            dall'altra parte una spranga scorre nei ganci, e la porta si apre di un palmo con un cigolio
            lungo.

            Dietro non c'è nessuno. C'è un corridoio buio che puzza di cenere bagnata, e in fondo dei passi
            pesanti si allontanano verso il rombo del forno. Sulla pietra i passi non hanno il colpo secco del
            tacco.

            Ti infili dentro e accosti la porta alle tue spalle, piano, finché la spranga non tocca il gancio.
          imposta: { pista.acciaio: 3 }
          vai: acciaieria
      - testo: "Salire al lucernaio"
        descrizione: "Dalla grondaia della casa accanto al tetto della sala dei clienti c'è un salto di due braccia."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il vetro scoperto
          testo: |
            Sali dalla grondaia della casa accanto, con le tegole che scricchiolano sotto le suole, e salti
            sul tetto della sala dei clienti. Il vetro del lucernaio è velato di fuliggine, e il telaio è così
            vecchio che una lastra si solleva con la punta del coltello. Sotto c'è la sala al buio, con le
            spade appese alle pareti e le vetrine coperte da teli. Ti cali appes{o|a} al telaio e atterri su
            un tappeto piegando le ginocchia.

            Dal fondo dell'edificio arrivano il rombo del forno e, di tanto in tanto, una risata.
          imposta: { pista.acciaio: 3 }
          vai: acciaieria
        fallimento:
          titolo: La grondaia
          testo: |
            A metà salita la grondaia si stacca da un gancio e ti lascia appes{o|a} per le mani, con il gomito
            che sbatte contro il muro. Arrivi sul tetto con la manica strappata e il braccio che pulsa, e la
            lastra del lucernaio ti scivola dalle dita e si rompe sul pavimento di sotto. Dal fondo
            dell'edificio la risata si interrompe, e dopo un po' riprende.

            Alla fine ti cali fra i vetri rotti e atterri male su una caviglia, in una sala piena di spade
            appese.
          imposta: { pista.acciaio: 3 }
          effetti: { ferite: 0.5 }
          vai: acciaieria
      - testo: "Forzare la porticina degli operai"
        descrizione: "La serratura è vecchia, ma in strada c'è gente, e un eroe del Festival che scassina l'Acciaieria dei Tarvelin fa notizia."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Uno pagato a giornata
          testo: |
            Al secondo colpo di spalla la serratura salta, e in un momento hai intorno un capannello di vicini
            con la donna del bucato in prima fila. Racconti che la famiglia ti paga a giornata per dare
            un'occhiata, perché il vecchio Tarvelin non risponde alla porta e potrebbe essersi sentito male.
            Lo dici sbadigliando e grattandoti la nuca, con la noia di un garzone pagato poco e male, e i
            vicini tornano alle loro porte uno alla volta, delusi. Dalla porticina aperta esce un fiato d'aria
            calda che sa di carbone.
          imposta: { pista.acciaio: 3 }
          vai: acciaieria
        fallimento:
          titolo: Il capannello
          testo: |
            La serratura cede, ma il capannello che ti si forma intorno non ha nessuna voglia di andarsene. Un
            ragazzo con il grembiule da garzone giura di averti visto combattere al Festival, e una vecchia
            vuole sapere chi ti paga. Le rispondi male, lei se lo segna con un sorriso stretto, e tu ti infili
            dentro.

            Mentre accosti la porta senti il ragazzo che corre verso il mercato a raccontarlo, e la vecchia
            che ripete a chi arriva la tua descrizione, aggiungendo ogni volta qualcosa.
          imposta: { pista.acciaio: 3 }
          effetti: { sospetto: 1, scandalo: 1 }
          vai: acciaieria
      - testo: "Entrare dallo scivolo del carbone"
        descrizione: "Da bambin{o|a}, d'inverno, il carbone dei Tarvelin lo rubavi da lì. Lo sportello si apre dal basso, se sai dove dare il colpo."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Lo scivolo
          testo: |
            Sul fianco dell'Acciaieria, a filo del selciato, c'è ancora lo sportello di ferro dove scaricano
            il carbone. Il cardine di sotto è storto come quando eri bambin{o|a}, e lo sportello cede al primo
            colpo di tallone.

            Ti cali sulla schiena giù per lo scivolo, con la polvere nera che ti entra nel colletto, e finisci
            su un mucchio di carbone in un ripostiglio buio accanto alla sala dei clienti.

            Dal fondo dell'edificio arrivano il rombo del forno e, ogni tanto, una risata.
          imposta: { pista.acciaio: 3 }
          vai: acciaieria
      - testo: "Salire al lucernaio come su un'impalcatura"
        descrizione: "Sulle piattaforme della Cicatrice si sale con tre appigli sempre fermi e il peso sui talloni."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Tre appigli
          testo: |
            Prima di salire provi la grondaia con due strattoni, come ti hanno insegnato a provare le funi
            prima di ogni turno, e trovi il gancio allentato prima che sia lui a trovare te. Sali tenendo
            sempre tre appigli e il peso sui talloni, e le tegole sotto di te non si muovono.

            La lastra del lucernaio si solleva con la punta del coltello. Ti cali appes{o|a} al telaio in una
            sala al buio, con le spade alle pareti e le vetrine coperte da teli, e atterri su un tappeto
            piegando le ginocchia. Dal fondo dell'edificio arrivano il rombo del forno e, ogni tanto, una
            risata.
          imposta: { pista.acciaio: 3 }
          vai: acciaieria

  # ------------------------------------------------------------ carta della pista
  - id: carta-due-settimane-di-fumo
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Due settimane di fumo
    sommario: "Al lavatoio una donna strizza la camicia del marito, fonditore all'Acciaieria. Da due settimane la ciminiera fuma e lui non torna a casa."
    tipo: carta
    area: citta-bassa
    requisiti: [pista.acciaio >= 1, pista.acciaio <= 2]
    testo: |
      Al lavatoio l'acqua scende nelle vasche da una canaletta di ferro, e il bordo di pietra è consumato
      liscio dove le donne sbattono i panni. Da quando sei arrivat{o|a} una donna strizza sempre la stessa
      camicia da uomo. Ha il collo bruciacchiato in due punti e le maniche lise ai polsi, come quelle di chi
      lavora davanti a un forno. La vicina ti dice che la donna si chiama Gisella e che suo marito fa il
      fonditore all'Acciaieria da vent'anni.

      Il marito non torna a casa da due settimane. Il primo giorno è passato un ragazzo con un biglietto
      firmato da Ondrel Tarvelin, *commessa urgente, gli operai dormono in fabbrica*, e da allora più niente.

      Gisella rimette la camicia nell'acqua e ricomincia a strizzarla, mentre le altre donne parlano forte del
      prezzo del sapone e la guardano.

      {origine figlio-della-citta-bassa} I lavatoi li conosci da quando ci giocavi sotto le vasche. Quando le
      donne parlano del sapone così forte, a qualcuna è successa una disgrazia e le altre le fanno la guardia.
    opzioni:
      - testo: "Parlare con Gisella"
        descrizione: "Strizza quella camicia da troppo tempo. Forse aspetta soltanto che qualcuno le chieda del marito."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Una voce dal cortile
          testo: |
            Gisella ti lascia sederti sul bordo della vasca, e si sposta un poco per farti posto senza
            smettere di strizzare. Tre sere fa è andata al cancello dell'Acciaieria e ha chiamato il marito
            per nome, forte, finché le è venuta la voce roca. Dal cortile le ha risposto qualcuno in una
            lingua che non era la nostra, e dopo un momento ha sentito ridere. Mentre lo racconta l'acqua che
            cola dalla camicia è ancora grigia di fuliggine.

            «Il mio Doro non ride mai, nemmeno all'osteria» dice, e torna a strizzare la camicia.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: La camicia bagnata
          testo: |
            Gisella ti ascolta con la camicia ferma fra le mani, e l'acqua le gocciola sui piedi senza che se
            ne accorga. Poi ti chiede se ti manda il vecchio Tarvelin, e prima che tu possa rispondere
            raccoglie i panni nella cesta e se ne va con la camicia bagnata sulla spalla. Le altre donne
            smettono di parlare e restano a guardarti con le mani nell'acqua, finché non te ne sei andat{o|a}
            anche tu dal lavatoio.
          effetti: { scandalo: 0.5 }
      - testo: "Lasciarle qualche moneta per la settimana"
        descrizione: "La paga non è arrivata, e le monete arrivano prima delle domande."
        requisiti: [monete >= 5]
        esito:
          titolo: Il biglietto
          testo: |
            Gisella guarda le monete a lungo prima di prenderle con le dita rosse d'acqua fredda. Poi le mette
            in tasca e tira fuori il biglietto del primo giorno, piegato in otto. La firma di Ondrel Tarvelin
            è in fondo, con lo svolazzo del casato, ma la riga è storta e l'inchiostro ha fatto una macchia
            dove la penna si è fermata.

            «Vent'anni che lavora per lui» dice Gisella. «Non l'ho mai visto scrivere storto.» Si riprende il
            biglietto e lo ripiega lungo le stesse pieghe.
          effetti: { monete: -5, informazioni.voce: 1 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: "Prosegui oltre il lavatoio. Dietro di te Gisella immerge di nuovo la camicia nell'acqua fredda, e le altre ricominciano a parlare del sapone."
      - testo: "Sederti accanto a lei come al capezzale"
        descrizione: "Il Velo insegna a stare vicino a chi aspetta notizie, senza fare domande. Si comincia dalle mani, e le sue sono gelate."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Le mani nell'acqua
          testo: |
            Ti siedi sul bordo della vasca e le prendi la camicia dalle mani, piano, come in Cattedrale si
            prende la ciotola a chi ha vegliato tutta la notte. Ha le mani gelate e i polpastrelli raggrinziti
            dall'acqua. Tre sere fa è andata al cancello dell'Acciaieria e ha chiamato il marito per nome,
            finché le è venuta la voce roca. Dal cortile le ha risposto qualcuno in una lingua che non era la
            nostra, e dopo un momento ha sentito ridere.

            «Il mio Doro non ride mai, nemmeno all'osteria» dice.
          effetti: { informazioni.voce: 1 }
