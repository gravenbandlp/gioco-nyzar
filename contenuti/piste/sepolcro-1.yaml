# La pista del Sepolcro violato, prima parte: dall'avviso sulla bacheca alla Biblioteca (pista 0 → 4),
# più le ricerche in Biblioteca, ripetibili.
storylet:
  # ------------------------------------------------------------ 0 → 1 · l'avviso
  - id: sepolcro-avviso
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Un avviso con il sigillo
    sommario: "Sulla bacheca del Grifone di Ferro c'è un foglio con il sigillo della Caserma. Lo sceriffo cerca persone fidate."
    luogo: Locanda del Grifone di Ferro, la bacheca
    area: ponti-sospesi
    requisiti: [prologo == 0, pista.sepolcro == 0]
    testo: |
      Sulla bacheca delle Richieste di Aiuto, fra un'offerta di pelli di ratto
      e un foglio che cerca il quinto uomo per una squadra di scavo, c'è un
      avviso nuovo. È fissato con un chiodo per angolo e scritto su carta
      buona, di quella che ai Ponti si vede solo sui contratti della Gilda.

      {origine apprendista-raschiatore} Il foglio della squadra di scavo lo
      conosci, perché è appeso lì da giorni e ogni sera quelli della squadra
      bevono al tavolo sotto, girati verso la porta. Una squadra che cerca il
      quinto uomo così a lungo ha perso il quarto da poco.

      Lo sceriffo Toren Galdrick cerca persone fidate per far luce sulla
      profanazione avvenuta al Cimitero di Qir-Azel nella notte della razzia.
      Chi è disposto si presenti al cimitero della Città Bassa e chieda di lui.
      Sotto, in una grafia più minuta, ha firmato anche Padre Aurelio Vantes.

      Brunella Fennick passa con un vassoio di scodelle vuote e si ferma
      accanto a te. «L'ha appeso lui all'alba, con il batticarne della cucina,
      perché un martello non ce l'avevo» dice. «Poi mi ha chiesto scusa per i
      buchi nel legno, e intanto guardava il muro. Grosso com'è, per quattro
      chiodi non sapeva dove mettere le mani.»
    opzioni:
      - testo: "Staccare l'avviso e andare al cimitero"
        descrizione: "Il cimitero è in Città Bassa. Lo sceriffo, a quanto pare, ti aspetta lì."
        esito:
          titolo: Il foglio in tasca
          testo: |
            Stacchi l'avviso un chiodo alla volta e lo pieghi in quattro, attento
            a non strappare la carta buona. Dal bancone Liaren Tarvelin ti vede e
            alza il mento, come per dirti che ha capito dove stai andando.

            Mentre scendi verso il Ponte del Pesce senti il foglio frusciare nella
            tasca a ogni passo, e ogni tanto ci metti la mano sopra per
            controllare che ci sia ancora.
          effetti: { pista.sepolcro: 1 }
      - testo: "Chiedere in sala che cosa si dice del cimitero"
        descrizione: "Al Grifone tutti sanno qualcosa, e Liaren sa chi sa di più."
        esito:
          titolo: Lanterne fra le tombe
          testo: |
            Liaren Tarvelin asciuga un boccale e lo guarda controluce più a lungo
            del necessario. «Gli orchi presi vivi l'hanno detto anche allo
            sceriffo, che dovevano andare al cimitero» dice. «Chiedi a quello col
            naso rotto, vicino al camino. Quella notte guidava un carro di rape
            lungo il muro.»

            Il carrettiere parla con il naso che fischia a ogni parola, e prima di
            cominciare si guarda intorno due volte. Mentre la piazza bruciava ha
            visto lanterne coperte muoversi fra le tombe, e davanti a tutte una
            figura più bassa delle altre, avvolta in qualcosa di scuro.
          effetti: { pista.sepolcro: 1, informazioni.voce: 1 }
      - testo: "Chiedere ai carrettieri del Mercato dei Nodi"
        descrizione: "Chi porta merci di notte lungo il muro del cimitero passa dal Mercato dei Nodi all'alba, e con un mercante dei Ponti parla volentieri."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il carro di rape
          testo: |
            Al Mercato dei Nodi i carrettieri fanno colazione in piedi accanto ai
            muli, e ti salutano con il mezzo cenno che si riserva a chi ha la
            licenza della Gilda e potrebbe ricordarsene. Uno di loro, con il naso
            rotto che fischia a ogni parola, la notte della razzia guidava un
            carro di rape lungo il muro del cimitero.

            Mentre la piazza bruciava ha visto lanterne coperte muoversi fra le
            tombe, e davanti a tutte una figura più bassa delle altre, avvolta in
            qualcosa di scuro.
          effetti: { pista.sepolcro: 1, informazioni.voce: 1 }

  # ------------------------------------------------------------ 1 → 2 · il cimitero
  - id: sepolcro-cimitero
    presso: cimitero-di-qir-azel
    immagine: ambientazione/cimitero-di-qir-azel
    titolo: La lastra forzata
    sommario: "Al Cimitero di Qir-Azel lo sceriffo ti aspetta davanti alla cripta del vecchio cappellano, insieme al sacerdote che l'ha trovata aperta."
    luogo: Cimitero di Qir-Azel, la cripta del cappellano
    area: citta-bassa
    requisiti: [pista.sepolcro == 1]
    testo: |
      Il Cimitero di Qir-Azel sta dietro un muro di pietra blu, e si entra dal cancello a nord.

      Lo sceriffo ti aspetta davanti a una costruzione quadrata di pietra coperta di simboli del
      Grande Albero Rosso. La lastra dell'ingresso è stata forzata con una leva, e sul bordo i graffi
      sono chiari nella pietra scura. Toren Galdrick è un uomo grosso dalla pelle scura, con la testa
      rasata e il cappuccio di maglia abbassato sulle spalle. Dal cancello due vedove lo stanno
      guardando, e lui parla alla lastra più che a te.

      «Sei venuto. Bene» dice. «Detto questo, meglio essere chiari. Questa faccenda la sbrigo anche
      con due guardie, e mi serve vedere come lavori prima di darti cose più grosse.»

      Accanto a lui c'è un sacerdote magro, con i paramenti scuri e gli occhi grigi. Padre Aurelio
      Vantes ti prende il polso con due dita mentre ti ringrazia, e si scusa di averti fatto venire
      fin qui.

      {medicina Facile} Un'abitudine da infermeria. Mentre ti ringraziava ti ha contato i battiti, e
      il risultato se lo tiene per sé.

      La cripta l'ha trovata lui, il mattino dopo la razzia. Quel mattino anche Gundo Marl, il
      becchino, non c'era più.

      {origine figlio-della-citta-bassa} Da bambino Gundo Marl ti cacciava dal cimitero agitando la
      pala, e zoppicava così piano che restavi sempre due passi avanti, forse perché lui voleva così.
      Adesso il cimitero ti sembra più grande, senza nessuno che ti corra dietro.
    opzioni:
      - testo: "Leggere le impronte"
        descrizione: "Davanti alla cripta il terreno è morbido, e sotto le orme delle guardie si vedono quelle più vecchie."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Due misure di piede
          testo: |
            Sotto le orme chiodate delle guardie ce ne sono altre più vecchie di
            piedi larghi e scalzi, con le dita divaricate, uguali a quelle che la
            sera del Festival hai visto nel fango. In mezzo corre una fila di orme
            più piccole, uno stivale stretto con il tacco basso, che va dritta
            alla lastra senza mai esitare.

            Galdrick si china accanto a te, e le ginocchia gli scricchiolano.
            «Orchi, e uno che orco non è» dice, e si pulisce le dita sui calzoni.
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Fango
          testo: |
            Guardi a lungo, ma davanti alla cripta sono passate troppe guardie
            con gli stivali chiodati, e per te è tutto fango. Quando ti rialzi
            hai le ginocchia bagnate e niente da dire, e il fango ha già
            cominciato a seccarsi sulla stoffa.

            Galdrick aspetta a braccia conserte, senza fretta. Poi ti indica un
            tratto di terra vicino al muro, dove le guardie non sono passate, e
            si sposta di lato per lasciarti la luce.
          effetti: { tormento: 0.5 }
      - testo: "Cercare il punto del muro dove sono entrati"
        descrizione: "Quella notte il cancello era chiuso. Da qualche parte hanno scavalcato, e un muro tiene i segni meglio del fango."
        prova: { attributo: fisico, abilita: [atletica, natura], difficolta: Media }
        successo:
          titolo: Dall'altra parte del muro
          testo: |
            Segui il muro dall'interno finché trovi il punto, dietro un cespuglio
            di bosso spezzato. In cima c'è fango secco con il segno di unghie
            lunghe. Dall'altra parte c'è un vicolo cieco. Dove sono atterrati
            conti le zolle schiacciate da cinque o sei corpi pesanti, e accanto la
            traccia leggera di uno che è sceso senza appoggiarsi.

            Quando ridiscendi Galdrick allunga la mano per aiutarti nell'ultimo
            salto, poi la ritira prima che tu la prenda, come se non fosse sicuro
            di doverla offrire.
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Le mani graffiate
          testo: |
            La pietra del muro è umida, e a metà salita il piede ti scivola. Arrivi a
            terra sui palmi, che si sbucciano sulla ghiaia del vialetto, e le vedove al
            cancello si portano la mano alla bocca insieme.

            Galdrick ti aiuta a rialzarti senza commentare. «Cinque o sei orchi, dal
            vicolo dietro il bosso» dice. «I miei li hanno contati il primo giorno.» Ti
            succhi il sangue dal pollice, che sa di ghiaia, e lo segui verso la cripta.
          effetti: { pista.sepolcro: 1, ferite: 0.5 }
      - testo: "Parlare con chi abita accanto al muro"
        descrizione: "Le case della Città Bassa danno sul cimitero, e la notte della razzia nessuno dormiva."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La finestra sul cimitero
          testo: |
            Nella casa che dà sul muro abita una donna anziana con in braccio un
            gatto senza coda, e per un po' parla solo del gatto, compreso quello
            che il gatto pensa dei vicini. Poi ti racconta che la notte della
            razzia le campane non la lasciavano dormire, e che dalla finestra ha
            visto lanterne coperte muoversi fra le tombe. Erano grossi e
            camminavano piegati, e davanti a tutti andava uno più piccolo, avvolto
            in qualcosa di scuro, senza lanterna, che sapeva dove andare.

            Di Gundo dice che quella sera la sua candela si è spenta presto come
            tutte le sere, e che al mattino non ha sentito la pala.
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Imposte chiuse
          testo: |
            Bussi a tre porte. Alla prima una donna con le mani bagnate ti chiede
            se sei della Caserma, e quando dici di no ti chiude lo stesso. Alle
            altre due non apre nessuno, anche se da dietro l'uscio senti
            scricchiolare un'asse del pavimento.

            Torni da Galdrick con le mani vuote, e appena hai girato l'angolo
            senti alle tue spalle un'imposta che si riapre.
          effetti: { sospetto: 1 }
      - testo: "Pagare il garzone delle fosse"
        descrizione: "Un ragazzo con la pala in spalla scava qui da giorni."
        requisiti: [monete >= 3]
        esito:
          titolo: La memoria del garzone
          testo: |
            Ti porta davanti alla cripta e con il manico della pala ti indica dove
            il fango ha tenuto le orme, larghe quelle degli orchi e una fila più
            piccola in mezzo, e il punto del muro da cui sono scesi.

            Su Gundo si stringe nelle spalle. «Il vecchio mi pagava il venerdì, e
            questo venerdì non c'era» dice, e si calca il berretto fino alle
            orecchie.
          effetti: { pista.sepolcro: 1, monete: -3 }
      - testo: "Chiedere a Padre Vantes che cosa ha visto"
        descrizione: "A chi gli reggeva le bende nella tenda dei feriti parla più volentieri che allo sceriffo."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il freddo sui gradini
          testo: |
            Quel mattino, ti racconta, la lastra era già spostata e davanti
            all'ingresso c'erano orme di piedi scalzi e larghi, con in mezzo una
            fila più piccola, uno stivale stretto che andava dritto alla cripta.

            Sui gradini ha sentito un freddo che con la stagione non c'entrava, e
            prima di scendere ha recitato la preghiera dei morti due volte, la
            seconda per sé. «Padre Sollen era severo con gli accoliti» aggiunge,
            guardando la lastra. «Ma nessuno di noi gli avrebbe augurato di essere
            tirato fuori così.»
          effetti: { pista.sepolcro: 1, rep.velo: 0.5 }
      - testo: "Leggere le orme come nel Bosco"
        descrizione: "Al Circolo si impara a seguire una traccia prima di imparare a scrivere. Il fango del cimitero è più facile del sottobosco."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura], difficolta: Facile }
        successo:
          titolo: Il passo leggero
          testo: |
            Sotto quelle chiodate delle guardie ci sono piedi larghi e scalzi, con
            le dita divaricate, e in mezzo una fila di stivali stretti dal tacco
            basso che va dritta alla lastra.

            Galdrick si china accanto a te e guarda prima le orme e poi le tue
            mani, che non hanno toccato terra. «Orchi, e insieme a loro uno che
            orco non è» dice, con le ginocchia che gli scricchiolano.
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Troppi stivali
          testo: |
            Nel Bosco una traccia la cancella la pioggia, e qui l'hanno
            cancellata gli stivali chiodati delle guardie, che fanno più danni.
            Giri due volte attorno alla cripta, piegato, finché ti fa male la
            schiena.

            Galdrick aspetta a braccia conserte, senza fretta. Poi ti indica un
            tratto di terra vicino al muro, dove le guardie non sono passate, e
            si sposta di lato per lasciarti la luce.
          effetti: { tormento: 0.5 }
      - testo: "Chiedere ai ragazzi del vicolo dietro il muro"
        descrizione: "In ogni vicolo della Città Bassa c'è un ragazzo che di notte non dorme e guarda tutto da un tetto."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada], difficolta: Facile }
        successo:
          titolo: Dal tetto della stalla
          testo: |
            Nel vicolo dietro il muro trovi tre ragazzi seduti sul tetto di una
            stalla, con le gambe a penzoloni. Ti guardano dall'alto con sospetto
            finché non dici due parole nel gergo del tuo vecchio vicolo, e allora
            il più piccolo scende per la grondaia.

            Hanno visto cinque o sei sagome grosse scavalcare il muro dietro il
            bosso, piegate, con le lanterne coperte, e davanti a tutte una più
            piccola, avvolta in qualcosa di scuro, che è scesa dal muro senza
            appoggiare le mani.

            Di Gundo dice che quella sera la sua candela si è spenta presto, come
            tutte le sere.
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Uno di fuori
          testo: |
            I ragazzi sul tetto della stalla ti ascoltano, poi si guardano fra
            loro. Il gergo è giusto ma vecchio di qualche anno, e per loro
            questo fa di te uno di fuori che finge. Il più grande ti chiede se
            sei della Caserma, e quando dici di no si mette a ridere.

            Scendono dall'altra parte del tetto e spariscono. Mentre torni da
            Galdrick senti alle tue spalle una voce che imita la tua, e la
            imita abbastanza bene.
          effetti: { sospetto: 1 }

  # ------------------------------------------------------------ 2 → 3 · la cripta
  - id: sepolcro-cripta
    presso: cimitero-di-qir-azel
    immagine: ambientazione/cripta-di-idrian-sollen
    titolo: Sotto la lastra
    sommario: "Galdrick fa togliere la lastra della cripta di Idrian Sollen. Dalle scale sale un freddo da cantina, e in fondo qualcosa si muove."
    luogo: Cimitero di Qir-Azel, la cripta di Idrian Sollen
    area: citta-bassa
    requisiti: [pista.sepolcro == 2]
    testo: |
      Due guardie fanno leva con un piede di porco, e la lastra si sposta di
      lato con un rumore lungo, da macina. Dalle scale sale un freddo da
      cantina con un odore di terra chiusa, e la tua mano va da sola alla
      cintura. Galdrick accende una lanterna, ne dà un'altra a te e scende per
      primo, un gradino alla volta, con la spada ancora nel fodero.

      Sotto, la stanza è più grande di quanto sembri da fuori. In mezzo c'è un
      sarcofago di pietra chiara, e lungo le pareti si aprono le nicchie dei
      sacerdoti più vecchi.

      Quattro nicchie sono vuote, perché i loro morti stanno in piedi in mezzo
      alla stanza. Hanno la carne grigia e asciutta sulle ossa e una luce
      rossa in fondo alle orbite. Quando la lanterna li prende emettono un
      sibilo freddo e si voltano insieme, con un movimento troppo sciolto per
      dei cadaveri.

      Galdrick sfila la spada. «Due li tengo io» dice senza voltarsi. «Gli
      altri due sono tuoi. Detto questo, se vuoi tornare su, il momento è
      adesso.» In cima alle scale le guardie alzano gli scudi, e la porta
      resta aperta alle tue spalle.
    opzioni:
      - testo: "Affrontare i due morti che restano"
        descrizione: "Due contro uno, al buio, con la lanterna appoggiata sui gradini."
        immagine: bestiario/wight
        combattimento: cripta-dei-sommi
        vittoria:
          titolo: Ossa sul pavimento
          testo: |
            Il secondo morto ti viene addosso con le dita lunghe e grigie, e dove
            ti sfiora la pelle si raffredda e diventa insensibile. Lo colpisci
            finché la luce nelle orbite si spegne e le ossa si afflosciano sul
            pavimento con un rumore di fascina.

            Dall'altra parte della stanza Galdrick ha già finito, e pulisce la
            lama sull'orlo del mantello. Ti guarda e annuisce una volta sola, poi
            prende la lanterna e va verso il sarcofago.
          segue: sepolcro-sarcofago
        sconfitta:
          titolo: In cima alle scale
          testo: |
            Il morto ti prende alla gola e ti schiaccia contro la parete, e il freddo ti entra nelle ossa finché i denti battono da
            soli.

            Giù, Galdrick ha finito da solo. Prima di sera un'altra guardia ti porta un lasciapassare per i Quartieri Alti con la
            sua firma e un sacco di tela con dentro il nucleo di una delle macchine della razzia, che lo sceriffo ti chiede di
            portare alla Biblioteca appena ti reggi in piedi.
          imposta: { invito: 1 }
          effetti: { pista.sepolcro: 1 }
      - testo: "Scacciarli con l'esorcismo"
        descrizione: "La Liturgia dell'Albero ha parole per ciò che non dovrebbe restare, e vanno dette tutte senza sbagliarne una."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le parole della Liturgia
          testo: |
            Alzi la mano aperta e dici le parole della Liturgia, quelle che si
            imparano per i funerali sperando di non doverle mai usare sul serio.
            La luce nelle orbite dei due morti più vicini si fa piccola come la
            brace di una pipa e si spegne, e loro cadono dove sono.

            Quando è finita lo sceriffo si tocca la fronte con il segno
            dell'Albero, in fretta, quasi di nascosto.
          segue: sepolcro-sarcofago
        fallimento:
          titolo: La parola sbagliata
          testo: |
            A metà della seconda riga la lingua ti si inceppa, e il Mana ti torna
            indietro come una frustata dietro gli occhi. Galdrick chiama giù le
            guardie, e quando la stanza torna ferma sei seduto sui gradini con il
            sangue al naso e una spalla che non si alza.

            Prima di sera una guardia ti porta un lasciapassare per i Quartieri
            Alti con la firma dello sceriffo e un sacco di tela con il nucleo di
            una delle macchine della razzia, da portare alla Biblioteca.
          imposta: { invito: 1 }
          effetti: { pista.sepolcro: 1, ferite: 1.5, tormento: 1 }
      - testo: "Tenere la porta e la lanterna"
        descrizione: "Qualcuno deve restare sui gradini con la luce alta mentre Galdrick e le guardie scendono. Se la lanterna cade, là sotto non vede più nessuno."
        prova: { attributo: fisico, abilita: [resistenza, resilienza], difficolta: Media }
        successo:
          titolo: La luce alta
          testo: |
            Resti sui gradini con la lanterna sopra la testa, e Galdrick chiama
            giù le guardie. Per tutto lo scontro tieni il braccio teso, anche
            quando comincia a tremare e il sibilo dei morti ti entra nelle
            orecchie e ci resta. Uno dei quattro tenta le scale, e lo respingi con
            il tacco dello stivale senza abbassare la luce.

            Quando l'ultimo cade il braccio non vuole più scendere, e devi
            abbassarlo aiutandoti con l'altra mano.
          segue: sepolcro-sarcofago
        fallimento:
          titolo: La lanterna
          testo: |
            Il sibilo dei morti ti entra nelle orecchie e ti scende nelle
            ginocchia, e a un certo punto la lanterna non è più nella tua mano.
            Rotola giù per i gradini e si spegne. Quando riaccendono la luce sei
            seduto sul primo gradino, con il collo freddo dove ti ha preso e un
            taglio sulla fronte che non ricordi di esserti fatto.

            Prima di sera una guardia ti porta un lasciapassare per i Quartieri
            Alti e un sacco di tela con il nucleo di una delle macchine della
            razzia, da portare alla Biblioteca.
          imposta: { invito: 1 }
          effetti: { pista.sepolcro: 1, ferite: 1.5, tormento: 1 }
      - testo: "Tornare su"
        descrizione: "Le gambe hanno deciso prima di te. Lo sceriffo ha detto che il momento era adesso, e tu lo prendi in parola."
        esito:
          titolo: Fra le guardie
          testo: |
            Risali i gradini all'indietro, senza staccare gli occhi dalla luce
            rossa, e ti fermi fuori fra le guardie.

            Quando lo sceriffo risale ha il mantello strappato e il fiato corto, e
            non ti dice niente.

            Prima di sera però ti manda una guardia con un lasciapassare per i
            Quartieri Alti e un sacco di tela con il nucleo di una delle macchine
            della razzia, da portare alla Biblioteca.
          imposta: { invito: 1 }
          effetti: { pista.sepolcro: 1, tormento: 1.5 }
      - testo: "Fare l'uomo della scala, come nelle rovine"
        descrizione: "Nelle rovine c'è sempre uno che resta in cima alla scala con la luce alta, e chi è sotto risale verso di lui."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: L'uomo della scala
          testo: |
            Ti pianti sul terzo gradino con la lanterna sopra la testa e il gomito
            bloccato contro il muro, come sulle piattaforme, dove il peso della
            luce deve scaricarsi sull'osso del braccio. Galdrick chiama giù le
            guardie. Per tutto lo scontro la luce non trema, e quando uno dei
            morti tenta le scale lo respingi con il tacco senza abbassarla.

            Quando l'ultimo morto cade, Galdrick alza gli occhi verso la lanterna
            e ti dice che i Raschiatori li riconosce da come tengono il gomito.
          segue: sepolcro-sarcofago
      - testo: "Fare da muro in fondo alle scale"
        descrizione: "Qualcuno deve stare piantato fra i morti e i gradini, con la lanterna alle spalle."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza], difficolta: Facile }
        successo:
          titolo: Il muro
          testo: |
            Posi la lanterna sul gradino alle tue spalle e ti pianti in fondo alle
            scale a gambe larghe, mentre Galdrick chiama giù le guardie. Uno dei
            morti viene verso la luce e ti trova in mezzo. Dove le sue dita ti
            prendono il braccio la pelle diventa fredda e insensibile, e tu resti
            dove sei finché le guardie non lo prendono alle spalle.

            Galdrick ti guarda a lungo il braccio, e quando arriva alla faccia non
            ti chiede da dove vieni.
          segue: sepolcro-sarcofago
        fallimento:
          titolo: Il freddo nelle ginocchia
          testo: |
            Il primo morto ti arriva addosso con le dita lunghe, e il freddo ti
            entra nelle ginocchia prima che nelle braccia. Cadi sui gradini e la
            lanterna rotola giù e si spegne. Quando riaccendono la luce sei seduto
            sul primo gradino, con il collo freddo dove ti ha preso e un taglio
            sulla fronte che non ricordi di esserti fatto.

            Prima di sera una guardia ti porta un lasciapassare per i Quartieri
            Alti e un sacco di tela con il nucleo di una delle macchine della
            razzia, da portare alla Biblioteca.
          imposta: { invito: 1 }
          effetti: { pista.sepolcro: 1, ferite: 1.5, tormento: 1 }

  - id: sepolcro-sarcofago
    presso: cimitero-di-qir-azel
    immagine: ambientazione/cripta-di-idrian-sollen
    titolo: Il sarcofago vuoto
    tipo: seguito
    luogo: Cimitero di Qir-Azel, nella cripta
    area: citta-bassa
    requisiti: [pista.sepolcro == 2]
    testo: |
      Il coperchio di pietra è stato spostato di traverso, e sopra c'è inciso
      il nome di Padre Idrian Sollen, cappellano di Qir-Azel, con una foglia
      dell'Albero sotto le date. Dentro non c'è niente, a parte qualche filo
      del sudario impigliato a una scheggia e l'ombra scura che il corpo ha
      lasciato sul fondo in cinque anni.

      Dietro la nicchia più vecchia una guardia trova una tunica nera da
      cerimonia, buttata in un angolo. È di stoffa fine, con le maniche
      strette, e quando la guardia la alza contro la luce ti accorgi che a un
      orco non arriverebbe alla vita.

      {origine rampollo-dei-quartieri-alti} Le cuciture rivoltate verso
      l'interno sono un vezzo dei sarti dei Quartieri Alti, e almeno una
      giacca così l'hai avuta anche tu. Chi ne lascia una in un angolo di una
      cripta, di solito, ne ha altre nell'armadio.

      Lo sceriffo si rimette il cappuccio di maglia e ti parla guardando il
      muro. «Ti faccio avere un lasciapassare per i Quartieri Alti e per la
      Caserma» dice. «Detto questo, mi serve un favore. Le tre macchine della
      razzia le abbiamo trovate il mattino dopo sulle grondaie, spente, con
      le braccia ripiegate. In Caserma abbiamo il nucleo di una, e alla
      Biblioteca gli studiosi stanno esaminando le altre due. Portaglielo
      tu.»
    opzioni:
      - testo: "Prendere il nucleo"
        descrizione: "Un pezzo di macchina dei Precursori e un lasciapassare per salire dove si sale solo su invito."
        costo: 0
        esito:
          titolo: Il nucleo
          testo: |
            Il nucleo te lo consegnano in Caserma la mattina dopo, avvolto in una
            coperta da cavallo dentro un sacco di tela. È una sfera di metallo grande
            come un cavolo, più pesante di quanto sembri, con incisioni fitte che si
            vedono solo controluce.

            Alla porta dei Quartieri Alti le guardie leggono il lasciapassare e ti
            fanno passare con il sacco, e una delle due ti chiama per nome, cosa che
            non sai bene se prendere come un complimento.
          imposta: { indizio.tunica-nera: 1, invito: 1 }
          effetti: { rep.caserma: 1, racconto: 1, pista.sepolcro: 1 }

  # ------------------------------------------------------------ 3 → 4 · la Biblioteca
  - id: biblioteca-il-nucleo
    presso: biblioteca-di-qir-azel
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: Il nucleo della macchina
    sommario: "Alla Biblioteca di Qir-Azel il vecchio bibliotecario ti aspettava. Sul suo tavolo ci sono già i pezzi delle altre macchine della razzia."
    luogo: Biblioteca di Qir-Azel
    area: quartieri-alti
    requisiti: [pista.sepolcro == 3]
    testo: |
      La Biblioteca di Qir-Azel è immersa in una luce color ambra, filtrata dalle grandi vetrate
      opache. Gli scaffali salgono fino alle travi, e dalla tromba della scala si vedono quelli del
      secondo piano, con le ante sigillate dalla cera nera della Confraternita. Su quelli bassi un
      cartellino scritto a mano prega di non appoggiare il cappello.

      Dietro un bancone di legno scuro, chino su una pila di libri, c'è un vecchio con la barba
      bianca lunga e un panciotto rosso passato di moda da decenni. Quando ti vede sobbalza, si
      sistema il monocolo e ti fa cenno di avvicinarti, svelto per la sua età. «Ah, eccoti, giusto in
      tempo» dice Ulric Stanne. «Non vedevo effettivamente l'ora.»

      {galateo Facile} Il panciotto era di gran moda una quarantina d'anni fa, e chi lo porta ancora
      lo fa per fedeltà.

      Posi il sacco sul tavolo, accanto alla testa di metallo di un'altra macchina e a un cristallo
      conduttore che getta sul legno un bagliore blu, e la spalla ti ringrazia. Dal primo piano
      scende Mattias Crenn, uno studioso stempiato con gli occhiali spessi e le vesti piene di
      polvere.

      In fondo alla sala, a un tavolo da solo, siede un monaco enorme con il saio chiuso fino al
      collo. Padre Walter, della Confraternita del Velo, tiene le mani appoggiate su un libro chiuso
      e ti saluta con un cenno lento della testa.
    opzioni:
      - testo: "Chiedere che cosa c'era nei nuclei"
        descrizione: "Ulric e Mattias li studiano da giorni, e a Ulric si legge in faccia che ha qualcosa da dire."
        immagine: personaggi/ulric-stanne
        requisiti: [biblioteca.nucleo == 0]
        costo: 0
        esito:
          titolo: L'ultimo ordine
          testo: |
            «Mattias e io ci abbiamo passato tre giorni, con Orvald Temmerin
            dell'Accademia» dice Ulric, e tamburella due dita sulla testa di
            metallo. «Le memorie erano quasi tutte cancellate. L'ultima istruzione
            però è rimasta effettivamente intera, e dice “Ascoltate gli ordini di
            Balthog il Prescelto, qualunque essi siano”. Gliel'hanno mandata da
            fuori, con un dispositivo che imita i Precursori, e chi l'ha mandata
            non siamo riusciti a rintracciarlo.»

            Secondo Mattias, per dare ordini a tre macchine così, e da lontano, ci
            vuole una volontà enorme. «Se dietro c'è Balthog» dice, «allora
            Balthog è tutt'altro che il bruto di cui ridono alla Pignatta.»
          imposta: { biblioteca.nucleo: 1 }
          segue: biblioteca-il-nucleo
      - testo: "Sedersi al tavolo di Padre Walter"
        descrizione: "Il monaco sta leggendo di cinque anni fa, quando in città c'era il Cucitore."
        immagine: personaggi/padre-walter
        requisiti: [biblioteca.cucitore == 0]
        costo: 0
        esito:
          titolo: Le Notti Cucite
          testo: |
            Nel 145, per un mese, un assassino che chiamavano il Cucitore uccise
            venticinque persone e le ricompose come offerte. L'ultima notte prese
            lo sceriffo Ivo Carstan in un vicolo, e le guardie seguirono il sangue
            fino alle scale della Roccia di Wren, un isolotto di roccia nera
            all'estremità nord-est del Torvessa.

            Lassù abitava Osric Wren, un intagliatore di uccelli, e le guardie
            salirono temendo di trovarlo fra le vittime. Wren era il Cucitore.
            Sotto la capanna c'era un altare dedicato a un Demone Uccello, e ai
            suoi piedi c'era Wren, morto, dopo essersi cavato gli occhi e tagliato
            la lingua come ultima offerta.
          imposta: { biblioteca.cucitore: 1 }
          effetti: { tormento: 1 }
          segue: biblioteca-il-nucleo
      - testo: "Chiedere del sarcofago di Padre Sollen"
        descrizione: "Nella cripta faceva un freddo che non c'entrava con la stagione. Walter è uno che queste cose le sente."
        immagine: personaggi/padre-walter
        requisiti: [biblioteca.sarcofago == 0, indizio.tunica-nera == 0]
        costo: 0
        esito:
          titolo: La stessa aria
          testo: |
            Walter apre le mani sul libro. Il mattino dopo la razzia Padre Vantes
            è sceso nella cripta e ha sentito un freddo che con la stagione non
            aveva niente a che fare, e ha mandato a chiamare lui. Nel 145 era
            stato Walter a esaminare l'altare della Roccia prima che lo
            distruggessero, e quell'aria se la ricorda ancora.

            «Fredda e paziente» dice, e posa di nuovo le mani sul libro. «Sopra il
            sarcofago di Padre Sollen ho sentito qualcosa di molto simile, e io
            non sono uno che esagera.»
          imposta: { biblioteca.sarcofago: 1 }
          segue: biblioteca-il-nucleo
      - testo: "Chiedere del sarcofago di Padre Sollen"
        descrizione: "Nella cripta faceva un freddo che non c'entrava con la stagione, e in un angolo c'era una tunica nera."
        immagine: personaggi/padre-walter
        requisiti: [biblioteca.sarcofago == 0, indizio.tunica-nera >= 1]
        costo: 0
        esito:
          titolo: La stessa aria
          testo: |
            Walter apre le mani sul libro. Il mattino dopo la razzia Padre Vantes
            è sceso nella cripta e ha sentito un freddo che con la stagione non
            aveva niente a che fare, e ha mandato a chiamare lui. Nel 145 era
            stato Walter a esaminare l'altare della Roccia, e quell'aria se la
            ricorda ancora. «Fredda e paziente» dice, e posa di nuovo le mani sul
            libro. «Sopra il sarcofago di Padre Sollen ho sentito qualcosa di
            molto simile.»

            Quando racconti della tunica nera, Ulric ti fa ripetere com'erano le
            maniche e misura nell'aria una spalla con le mani. «Spalle così
            strette» dice. «Un elfo, o un mezzelfo. Un orco ci infilerebbe a
            stento un braccio.» Walter annuisce piano e torna a guardare il libro
            chiuso.
          imposta: { biblioteca.sarcofago: 1 }
          segue: biblioteca-il-nucleo
      - testo: "Decidere di andare a vedere la Roccia di Wren"
        descrizione: "L'altare del 145 e il sarcofago di adesso hanno la stessa aria."
        immagine: ambientazione/roccia-di-wren
        requisiti: [biblioteca.nucleo == 1, biblioteca.cucitore == 1, biblioteca.sarcofago == 1]
        esito:
          titolo: Una strada lungo il fiume
          testo: |
            Lo dici ad alta voce prima di averlo deciso del tutto, e Ulric ti
            guarda da sopra il monocolo. Walter non prova a fermarti. Ti spiega
            che nel 145 le scale le hanno distrutte, e che i pescatori del
            Torvessa girano alla larga dalla Roccia anche di giorno.

            Ulric ti stringe la mano e la tiene un po' più del necessario. «Torna
            a raccontarmelo, che ci tengo effettivamente molto» dice.
          effetti: { pista.sepolcro: 1, informazioni.segreto: 1 }
      - testo: "Raccontare dei cristalli del banco"
        descrizione: "La sera del Festival i cristalli dell'Accademia hanno vibrato tutti insieme, poco prima che le macchine scendessero dai tetti."
        immagine: personaggi/ulric-stanne
        quando: [origine.allievo-di-torvessa >= 1, biblioteca.nucleo == 0]
        costo: 0
        esito:
          titolo: La stessa nota
          testo: |
            Racconti del banco dell'Accademia e dei sei cristalli che hanno
            vibrato insieme poco prima che le macchine calassero dalle grondaie.
            Nelle memorie dei nuclei è rimasta intera soltanto l'ultima
            istruzione, “Ascoltate gli ordini di Balthog il Prescelto, qualunque
            essi siano”, mandata da fuori con un dispositivo che imita i
            Precursori. I tuoi cristalli l'hanno raccolta per caso.

            Mattias si toglie gli occhiali e dice che per tenere in fila tre
            macchine da lontano ci vuole una volontà enorme, e che il Balthog di
            cui ridono alla Pignatta una volontà così non ce l'avrebbe.
          imposta: { biblioteca.nucleo: 1 }
          effetti: { informazioni.voce: 1 }
          segue: biblioteca-il-nucleo
      - testo: "Salutare Padre Walter come un confratello"
        descrizione: "In Cattedrale Walter lo vedi passare ogni mattina, e non parla quasi con nessuno. Davanti a un accolito del Velo, forse, parla."
        immagine: personaggi/padre-walter
        quando: [origine.accolito-del-velo >= 1, biblioteca.cucitore == 0]
        costo: 0
        esito:
          titolo: Fra noi vecchi
          testo: |
            Walter ti riconosce dal modo in cui fai il segno dell'Albero, svelto,
            come lo insegna Ottilia ai novizi nel corridoio all'alba, e ti fa
            sedere accanto a sé invece che di fronte.

            Nel 145, ti racconta, il Cucitore uccise venticinque persone e le
            ricompose come offerte, e l'ultima notte prese lo sceriffo Ivo
            Carstan. Le guardie seguirono il sangue fino alla Roccia di Wren, dove
            Osric Wren intagliava uccelli. Sotto la capanna c'era un altare a un
            Demone Uccello, e Wren ci era morto davanti, con gli occhi cavati e la
            lingua tagliata.

            «L'altare l'ho esaminato io» dice, e posa le mani sul libro chiuso.
          imposta: { biblioteca.cucitore: 1 }
          segue: biblioteca-il-nucleo

  # ------------------------------------------------------------ ripetibile · le ricerche
  - id: ricerche-in-biblioteca
    presso: biblioteca-di-qir-azel
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: Una giornata fra gli scaffali
    sommario: "Ulric Stanne ti lascia un posto al tavolo lungo, se prometti di non leccarti le dita per girare le pagine."
    luogo: Biblioteca di Qir-Azel, la sala di lettura
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.sepolcro >= 4]
    testo: |
      Ulric Stanne ti dà un posto al tavolo lungo, sotto il lampadario
      grande, e ti fa promettere di non leccarti le dita per girare le
      pagine.

      Lungo la parete di fondo gli scaffali dell'archivio pubblico arrivano
      alla balaustra del primo piano, e su uno qualcuno ha appuntato un
      biglietto che chiede chi abbia preso in prestito il terzo volume degli
      annali della Gilda.

      {origine mercante-dei-ponti} Alla Casa dei Nodi gli annali della Gilda
      si leggono con un esattore seduto accanto, e qui stanno su uno
      scaffale aperto, sotto il cartellino del cappello. Prima di sfilarne
      uno ti guardi alle spalle, per abitudine.

      Gli scaffali sigillati stanno al secondo piano, e da qui si vede
      soltanto la ringhiera. Al tavolo accanto uno studente dorme su un
      atlante aperto, con la guancia appoggiata sulla Cicatrice e un filo di
      bava che minaccia il Torvessa.
    opzioni:
      - testo: "Cercare fra i registri e le cronache"
        descrizione: "Gli annali della Gilda e i verbali del Consiglio sono pieni di polvere, e ogni tanto anche di qualcosa che vale la pena sapere."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Una nota a margine
          testo: |
            Verso sera, in un registro di dazi del 148, trovi una nota a margine
            scritta da un'altra mano. Chiede conto di un carico di cristalli
            passato due volte dalla Casa dei Nodi con due pesi diversi. La ricopi
            sul tuo foglio, e Ulric, passando, la legge da sopra la tua spalla e
            fa un piccolo verso con la gola, quello che fa quando il vino è buono.
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Le illustrazioni
          testo: |
            Ti capita sotto mano una cronaca delle Notti Cucite con le tavole
            dei ritrovamenti, e prima di chiuderla ne hai guardate troppe. Il
            resto della giornata lo passi sulla stessa pagina di un atlante,
            senza riuscire a leggerla, e ogni volta che chiudi gli occhi le
            tavole sono ancora lì.
          effetti: { tormento: 1 }
      - testo: "Aiutare Ulric a rimettere a posto i volumi"
        descrizione: "Il carrello dei libri resi aspetta da tre giorni, e Ulric lo guarda con rancore."
        esito:
          titolo: Il carrello
          testo: |
            Spingi il carrello fra gli scaffali per tutto il pomeriggio, e
            Ulric ti cammina accanto indicandoti i posti con il dito. Intanto
            racconta, perché raccontare gli piace, e fra un aneddoto sulle sue
            spedizioni di gioventù e una lamentela sul prezzo della colla ti
            dice che al primo piano due studiosi non si parlano più da quando
            la Gilda ha finanziato uno solo dei due. Lo dice abbassando la
            voce, con evidente soddisfazione.
          effetti: { informazioni.voce: 1 }
