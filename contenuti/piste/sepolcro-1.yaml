# La pista del Sepolcro violato, prima parte: dall'avviso sulla bacheca alla Biblioteca (pista 0 → 4),
# più le ricerche in Biblioteca, ripetibili.
storylet:
  # ------------------------------------------------------------ 0 → 1 · l'avviso
  - id: sepolcro-avviso
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Un avviso con il sigillo
    sommario: "Sulla bacheca del Grifone di Ferro c'è un foglio con il sigillo della Caserma. Lo sceriffo cerca persone fidate."
    luogo: Locanda del Grifone di Ferro, la bacheca
    area: ponti-sospesi
    requisiti: [prologo == 0, pista.sepolcro == 0]
    testo: |
      Sulla bacheca delle Richieste di Aiuto, accanto a un foglio che cerca il
      quinto uomo per una squadra di scavo, c'è un avviso nuovo su carta buona,
      di quella dei contratti della Gilda. In fondo c'è il sigillo di cera
      della Caserma.

      {politica-ed-economia Media} Se la Caserma spende carta della Gilda per
      un avviso da locanda, o la faccenda preme a qualcuno in alto o lo
      sceriffo il foglio se l'è pagato di tasca sua.

      {origine apprendista-raschiatore} Il foglio della squadra di scavo è
      appeso lì da giorni, e una squadra che cerca il quinto uomo così a lungo
      ha perso il quarto da poco.

      Lo sceriffo Toren Galdrick cerca persone fidate per far luce sulla
      profanazione avvenuta al Cimitero di Qir-Azel nella notte della razzia, e
      chi è disposto si presenti al cimitero della Città Bassa. Sotto, in una
      grafia più minuta, ha firmato anche Padre Aurelio Vantes. *Della paga non
      parla nessuno dei due.* Lo rileggi muovendo le labbra.

      Brunella Fennick si ferma accanto a te con un vassoio di scodelle vuote.
      «L'ha appeso lui all'alba, con il batticarne della cucina» dice. «Poi mi
      ha chiesto scusa per i buchi nel legno, e intanto guardava il muro.»

      {empatia Facile} Lo racconta con tenerezza, come si racconterebbe di un
      orso che ha imparato a chiedere permesso.
    opzioni:
      - testo: "Staccare l'avviso e andare al cimitero"
        descrizione: "Il cimitero è in Città Bassa. Lo sceriffo, a quanto pare, ti aspetta lì."
        esito:
          titolo: Il foglio in tasca
          testo: |
            Stacchi l'avviso un chiodo alla volta e lo pieghi in quattro, attento
            a non strappare la carta buona, e dal bancone Liaren Tarvelin alza il
            mento come per dirti che ha capito dove vai. Scendendo verso il Ponte
            del Pesce ci metti sopra la mano ogni tanto, per controllare che sia
            ancora in tasca.
          effetti: { pista.sepolcro: 1 }
      - testo: "Chiedere in sala che cosa si dice del cimitero"
        descrizione: "Al Grifone tutti sanno qualcosa, e Liaren sa chi sa di più."
        esito:
          titolo: Lanterne fra le tombe
          testo: |
            «Gli orchi presi vivi l'hanno detto anche allo sceriffo, che dovevano
            andare al cimitero» dice Liaren Tarvelin. «Chiedi a quello col naso
            rotto, vicino al camino.»

            Il carrettiere, con il naso che fischia, quella notte guidava un carro
            di rape lungo il muro. Mentre la piazza bruciava ha visto lanterne
            coperte muoversi fra le tombe, con davanti una figura più bassa delle
            altre, avvolta in qualcosa di scuro.
          effetti: { pista.sepolcro: 1, informazioni.voce: 1 }
      - testo: "Chiedere ai carrettieri del Mercato dei Nodi"
        descrizione: "I carrettieri che di notte costeggiano il cimitero all'alba sono al Mercato dei Nodi, e con un mercante parlano."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il carro di rape
          testo: |
            I carrettieri ti salutano con il mezzo cenno riservato a chi ha la
            licenza della Gilda. Uno, con il naso rotto che fischia, la notte
            della razzia guidava un carro di rape lungo il muro, e ha visto
            lanterne coperte muoversi fra le tombe con davanti una figura più
            bassa delle altre, avvolta in qualcosa di scuro. Te lo racconta per la
            promessa di un prezzo onesto sulle rape.
          effetti: { pista.sepolcro: 1, informazioni.voce: 1 }

  # ------------------------------------------------------------ 1 → 2 · il cimitero
  - id: sepolcro-cimitero
    presso: cimitero-di-qir-azel
    immagine: ambientazione/cimitero-di-qir-azel
    titolo: La lastra forzata
    sommario: "Al Cimitero di Qir-Azel lo sceriffo e il sacerdote ti aspettano davanti alla cripta forzata del vecchio cappellano."
    luogo: Cimitero di Qir-Azel, la cripta del cappellano
    area: citta-bassa
    requisiti: [pista.sepolcro == 1]
    testo: |
      Il Cimitero di Qir-Azel sta dietro un muro di pietra blu, con le cripte dei ricchi lungo il
      muro e le lapidi fra gli alberi. Sulle fosse comuni della razzia la terra è ancora scura, e su
      una qualcuno ha lasciato un fiore di carta in una tazza sbeccata.

      Lo sceriffo ti aspetta davanti a una costruzione quadrata di pietra coperta di simboli del
      Grande Albero Rosso, con la lastra forzata da una leva. Toren Galdrick è un uomo grosso dalla
      pelle scura, con la testa rasata e il cappuccio di maglia abbassato sulle spalle. Dal cancello
      due vedove lo guardano, e lui parla alla lastra più che a te. «Sei venuto. Bene» dice. «Detto
      questo, la faccenda la sbrigo anche con due guardie, e mi serve vedere come lavori.»

      Padre Aurelio Vantes ti prende il polso con due dita mentre ti ringrazia.

      {medicina Facile} Ti ha contato i battiti, e il risultato se lo tiene per sé.

      La cripta l'ha trovata lui, il mattino dopo la razzia, e quel mattino anche Gundo Marl, il
      becchino, non c'era più. Nella sua casetta il letto è rifatto e il mantello appeso al chiodo.

      {origine figlio-della-citta-bassa} Da bambino Gundo Marl ti cacciava dal cimitero agitando la
      pala, e zoppicava così piano che restavi sempre due passi avanti.
    opzioni:
      - testo: "Leggere le impronte"
        descrizione: "Davanti alla cripta il terreno è morbido, e sotto le orme delle guardie si vedono quelle più vecchie."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Due misure di piede
          testo: |
            Sotto le orme chiodate delle guardie ce ne sono altre più vecchie di
            piedi larghi e scalzi, come quelle viste nel fango la sera del
            Festival, e in mezzo corre una fila più piccola, uno stivale stretto
            dal tacco basso che va dritto alla lastra.

            Galdrick si china accanto a te. «Orchi, e uno che orco non è. Lo
            pensavo anch'io, e adesso lo pensiamo in due.»
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Fango
          testo: |
            Davanti alla cripta sono passate troppe guardie con gli stivali
            chiodati, e per te è tutto fango. Galdrick aspetta a braccia conserte,
            poi ti indica un tratto di terra vicino al muro, dove le guardie non
            sono passate, e si sposta di lato per lasciarti la luce.
          effetti: { tormento: 0.5 }
      - testo: "Cercare il punto del muro dove sono entrati"
        descrizione: "Quella notte il cancello era chiuso, e un muro tiene i segni meglio del fango."
        prova: { attributo: fisico, abilita: [atletica, natura], difficolta: Media }
        successo:
          titolo: Dall'altra parte del muro
          testo: |
            Dietro un cespuglio di bosso spezzato trovi il punto, e in cima al
            muro c'è fango secco con il segno di unghie lunghe. Nel vicolo cieco
            dall'altra parte le zolle sono schiacciate da cinque o sei corpi
            pesanti, e accanto c'è la traccia leggera di uno che è sceso senza
            appoggiarsi.

            {atletica Media} Saltare da quest'altezza senza appoggiare le mani
            vuol dire avere gambe leggere e parecchia pratica.
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Le mani graffiate
          testo: |
            A metà salita il piede ti scivola sulla pietra umida, e arrivi a terra sui
            palmi mentre le vedove al cancello si portano la mano alla bocca. Galdrick
            ti aiuta a rialzarti senza commentare, e ti dice che gli orchi erano
            cinque o sei e sono entrati dal vicolo dietro il bosso, perché i suoi li
            hanno contati il primo giorno.
          effetti: { pista.sepolcro: 1, ferite: 0.5 }
      - testo: "Parlare con chi abita accanto al muro"
        descrizione: "Le case della Città Bassa danno sul cimitero, e la notte della razzia nessuno dormiva."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La finestra sul cimitero
          testo: |
            Nella casa sul muro una donna anziana con un gatto senza coda ti
            racconta che quella notte, dalla finestra, ha visto lanterne coperte
            fra le tombe. Erano grossi e camminavano piegati, e davanti a tutti
            andava uno più piccolo, avvolto in qualcosa di scuro, che sapeva dove
            andare. Di Gundo dice che la sua candela si è spenta presto come
            sempre, e al mattino non ha sentito la pala.
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Imposte chiuse
          testo: |
            Alla prima porta una donna con le mani bagnate ti chiede se sei della
            Caserma, e quando dici di no ti chiude lo stesso. Alle altre due non
            apre nessuno, e torni da Galdrick a mani vuote mentre alle tue spalle
            un'imposta si riapre.
          effetti: { sospetto: 1 }
      - testo: "Pagare il garzone delle fosse"
        descrizione: "Il garzone delle fosse ha visto la cripta prima delle guardie, e per qualche moneta se la ricorda meglio."
        requisiti: [monete >= 3]
        esito:
          titolo: La memoria del garzone
          testo: |
            Il garzone ha un berretto troppo grande, che si toglie per prendere le
            monete. Con il manico della pala ti indica dove il fango ha tenuto le
            orme, larghe quelle degli orchi e una fila più piccola in mezzo, e il
            punto del muro da cui sono scesi. Su Gundo si stringe nelle spalle.
            «Il vecchio mi pagava il venerdì, e questo venerdì non c'era» dice.
          effetti: { pista.sepolcro: 1, monete: -3 }
      - testo: "Chiedere a Padre Vantes che cosa ha visto"
        descrizione: "La cripta l'ha trovata lui, e a chi gli reggeva le bende nella tenda dei feriti parla volentieri."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il freddo sui gradini
          testo: |
            Vantes ti prende da parte come in Cattedrale quando ti affida un
            ferito. Quel mattino la lastra era già spostata, e davanti c'erano
            orme di piedi scalzi e larghi con in mezzo quelle di uno stivale
            stretto. Sui gradini ha sentito un freddo che con la stagione non
            c'entrava. «Padre Sollen era severo con gli accoliti, ma nessuno di
            noi gli avrebbe augurato di essere tirato fuori così.»
          effetti: { pista.sepolcro: 1, rep.velo: 0.5 }
      - testo: "Leggere le orme come nel Bosco"
        descrizione: "Al Circolo impari a seguire una traccia prima che a scrivere."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura], difficolta: Facile }
        successo:
          titolo: Il passo leggero
          testo: |
            Ti accucci senza appoggiare le ginocchia, come ti hanno insegnato per
            non sporcare la traccia. Sotto le orme chiodate delle guardie ci sono
            piedi larghi e scalzi, e in mezzo una fila di stivali stretti che va
            dritta alla lastra.

            Galdrick guarda le tue mani, che non hanno toccato terra. «Orchi, e
            uno che orco non è. Lo pensavo anch'io, e adesso lo pensiamo in due.»
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Troppi stivali
          testo: |
            Qui la traccia l'hanno cancellata gli stivali chiodati delle guardie,
            peggio della pioggia nel Bosco. Galdrick aspetta a braccia conserte,
            poi ti indica un tratto di terra vicino al muro, dove le guardie non
            sono passate, e si sposta di lato per lasciarti la luce.
          effetti: { tormento: 0.5 }
      - testo: "Chiedere ai ragazzi del vicolo dietro il muro"
        descrizione: "In ogni vicolo della Città Bassa c'è un ragazzo che di notte guarda tutto da un tetto."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada], difficolta: Facile }
        successo:
          titolo: Dal tetto della stalla
          testo: |
            Sul tetto di una stalla dietro il muro tre ragazzi ti guardano storto
            finché non dici due parole nel gergo del tuo vecchio vicolo. Quella
            notte hanno visto cinque o sei sagome grosse scavalcare il muro dietro
            il bosso, e davanti una più piccola, avvolta in qualcosa di scuro, che
            è scesa senza appoggiare le mani. Di Gundo sanno che la sua candela si
            è spenta presto, come sempre.
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Uno di fuori
          testo: |
            I ragazzi ti ascoltano e si guardano fra loro, perché il tuo gergo è
            giusto ma vecchio di qualche anno. Il più grande ti chiede se sei
            della Caserma, e alla tua risposta si mette a ridere prima di sparire
            con gli altri dall'altra parte del tetto. Mentre torni da Galdrick
            qualcuno alle tue spalle imita la tua voce, e abbastanza bene.
          effetti: { sospetto: 1 }

  # ------------------------------------------------------------ 2 → 3 · la cripta
  - id: sepolcro-cripta
    presso: cimitero-di-qir-azel
    immagine: ambientazione/cripta-di-idrian-sollen
    titolo: Sotto la lastra
    sommario: "Galdrick fa togliere la lastra della cripta di Idrian Sollen, e in fondo alle scale qualcosa si muove."
    luogo: Cimitero di Qir-Azel, la cripta di Idrian Sollen
    area: citta-bassa
    requisiti: [pista.sepolcro == 2]
    testo: |
      Due guardie fanno leva con un piede di porco e la lastra si sposta con
      un rumore da macina, lasciando salire un freddo da cantina. Galdrick ti
      dà una lanterna e scende per primo, con la spada nel fodero e il pollice
      sulla guardia.

      Accanto allo sgabello di Gundo la cera è colata in strati sui gradini, e
      in fondo, fra le nicchie dei sacerdoti più vecchi, c'è un sarcofago di
      pietra chiara.

      Quattro nicchie sono vuote, perché i loro morti stanno in piedi in mezzo
      alla stanza, con la carne grigia sulle ossa e una luce rossa nelle
      orbite. Quando la lanterna li prende sibilano e si voltano insieme, e il
      sudore ti si raffredda sulla nuca.

      Galdrick sfila la spada e ti dice senza voltarsi che due li tiene lui e
      gli altri due sono tuoi. «Detto questo, se vuoi tornare su, il momento è
      adesso.»
    opzioni:
      - testo: "Affrontare i due morti che restano"
        descrizione: "Due contro uno, al buio, con la lanterna appoggiata sui gradini."
        immagine: bestiario/wight
        combattimento: cripta-dei-sommi
        vittoria:
          titolo: Ossa sul pavimento
          testo: |
            Il secondo morto ti viene addosso con le dita lunghe e grigie, e dove
            ti sfiora la pelle diventa fredda e insensibile. Lo colpisci finché la
            luce nelle orbite si spegne e le ossa si afflosciano sul pavimento con
            un rumore di fascina. Dall'altra parte della stanza Galdrick pulisce
            già la lama sull'orlo del mantello, ti fa un cenno e va verso il
            sarcofago.
          segue: sepolcro-sarcofago
        sconfitta:
          titolo: In cima alle scale
          testo: |
            Il morto ti schiaccia contro la parete, e il freddo ti entra nelle ossa finché la lanterna cade. Ti risvegli in cima
            alle scale, con una guardia che ti chiama con un nome che non è il tuo, e giù Galdrick ha finito da solo. Prima di
            sera una guardia ti porta un lasciapassare per i Quartieri Alti e il nucleo di una macchina, da portare alla
            Biblioteca.
          imposta: { invito: 1 }
          effetti: { pista.sepolcro: 1 }
      - testo: "Scacciarli con l'esorcismo"
        descrizione: "La Liturgia dell'Albero ha parole per ciò che non dovrebbe restare, e vanno dette tutte senza sbagliarne una."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le parole della Liturgia
          testo: |
            Dici le parole della Liturgia, quelle che si imparano per i funerali
            sperando di non doverle mai usare. La voce ti trema sulla prima riga,
            ma la luce nelle orbite dei due morti più vicini si fa piccola come la
            brace di una pipa e si spegne. Galdrick approfitta dell'esitazione
            degli altri due, e alla fine si tocca la fronte con il segno
            dell'Albero, quasi di nascosto.
          segue: sepolcro-sarcofago
        fallimento:
          titolo: La parola sbagliata
          testo: |
            A metà formula la lingua ti si inceppa, e il Mana ti torna indietro
            come una frustata. Il morto più vicino ti stringe il collo, e quando
            le guardie hanno finito sei seduto sui gradini con il sangue al naso.
            Prima di sera una guardia ti porta un lasciapassare per i Quartieri
            Alti e il nucleo di una macchina, da portare alla Biblioteca.
          imposta: { invito: 1 }
          effetti: { pista.sepolcro: 1, ferite: 1.5, tormento: 1 }
      - testo: "Tenere la porta e la lanterna"
        descrizione: "Qualcuno deve tenere la luce alta sui gradini mentre Galdrick e le guardie scendono."
        prova: { attributo: fisico, abilita: [resistenza, resilienza], difficolta: Media }
        successo:
          titolo: La luce alta
          testo: |
            Resti sui gradini con la lanterna sopra la testa mentre Galdrick
            chiama giù le guardie, e tieni il braccio teso per tutto lo scontro,
            anche quando comincia a tremare. Uno dei morti tenta le scale, e lo
            respingi con il tacco senza abbassare la luce. Quando l'ultimo cade,
            il braccio devi abbassarlo aiutandoti con l'altra mano.
          segue: sepolcro-sarcofago
        fallimento:
          titolo: La lanterna
          testo: |
            Il sibilo dei morti ti scende nelle ginocchia, e la lanterna rotola
            giù e si spegne. Nel buio un morto risale fino a te, e quando le
            guardie riaccendono la luce sei seduto sul primo gradino con il collo
            freddo e un taglio sulla fronte. Prima di sera una guardia ti porta un
            lasciapassare per i Quartieri Alti e il nucleo di una macchina, da
            portare alla Biblioteca.
          imposta: { invito: 1 }
          effetti: { pista.sepolcro: 1, ferite: 1.5, tormento: 1 }
      - testo: "Tornare su"
        descrizione: "Lo sceriffo ha detto che il momento era adesso, e le gambe lo prendono in parola."
        esito:
          titolo: Fra le guardie
          testo: |
            Risali i gradini all'indietro, e da fuori ascolti il sibilo dei morti
            e i colpi della spada di Galdrick con le unghie piantate nei palmi.
            Quando lo sceriffo risale, con il mantello strappato, non ti dice
            niente. Prima di sera però ti manda una guardia con un lasciapassare
            per i Quartieri Alti e il nucleo di una macchina, da portare alla
            Biblioteca.
          imposta: { invito: 1 }
          effetti: { pista.sepolcro: 1, tormento: 1.5 }
      - testo: "Fare l'uomo della scala, come nelle rovine"
        descrizione: "Sulle piattaforme sei stato per mesi quello che tiene la luce in cima alla scala."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: L'uomo della scala
          testo: |
            Ti pianti sul terzo gradino con la lanterna sopra la testa e il gomito
            bloccato contro il muro come sulle piattaforme, mentre Galdrick chiama
            giù le guardie. La luce non trema, e il sibilo lo conti come contavi i
            colpi di piccone che salivano dal pozzo. Quando l'ultimo morto cade,
            Galdrick ti dice che i Raschiatori li riconosce da come tengono il
            gomito.
          segue: sepolcro-sarcofago
      - testo: "Fare da muro in fondo alle scale"
        descrizione: "A Ghoran hai imparato a restare in piedi quando gli altri vogliono vederti cadere."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza], difficolta: Facile }
        successo:
          titolo: Il muro
          testo: |
            Ti pianti in fondo alle scale a gambe larghe, mentre Galdrick chiama
            giù le guardie. Uno dei morti viene verso la luce e ti trova in mezzo,
            e dove le sue dita ti prendono il braccio la pelle diventa fredda, ma
            resti dove sei finché le guardie non lo prendono alle spalle. Quando
            l'ultimo cade, Galdrick ti guarda il braccio e non ti chiede da dove
            vieni.
          segue: sepolcro-sarcofago
        fallimento:
          titolo: Il freddo nelle ginocchia
          testo: |
            Il primo morto ti arriva addosso, e il freddo ti entra nelle ginocchia
            prima che nelle braccia. La lanterna rotola giù e si spegne, e quando
            le guardie riaccendono la luce sei seduto sul primo gradino con un
            taglio sulla fronte. Prima di sera una guardia ti porta un
            lasciapassare per i Quartieri Alti e il nucleo di una macchina, da
            portare alla Biblioteca.
          imposta: { invito: 1 }
          effetti: { pista.sepolcro: 1, ferite: 1.5, tormento: 1 }

  - id: sepolcro-sarcofago
    presso: cimitero-di-qir-azel
    immagine: ambientazione/cripta-di-idrian-sollen
    titolo: Il sarcofago vuoto
    tipo: seguito
    luogo: Cimitero di Qir-Azel, nella cripta
    area: citta-bassa
    requisiti: [pista.sepolcro == 2]
    testo: |
      Galdrick appoggia la lanterna sul sarcofago. Sul coperchio spostato è
      inciso il nome di Padre Idrian Sollen, cappellano di Qir-Azel, e
      dentro restano qualche filo del sudario e l'ombra che il corpo ha
      lasciato in cinque anni.

      Dietro la nicchia più vecchia una guardia trova una tunica nera da
      cerimonia dalle maniche strette, che a un orco non arriverebbe alla
      vita, e Galdrick la piega come una bandiera.

      {origine rampollo-dei-quartieri-alti} Le cuciture rivoltate
      all'interno sono un vezzo dei sarti dei Quartieri Alti, e una giacca
      così l'avevi anche tu.

      «Ti faccio avere un lasciapassare per i Quartieri Alti» dice Galdrick
      fuori, guardando il muro. «Detto questo, mi serve un favore. In
      Caserma abbiamo il nucleo di una delle macchine della razzia, e le
      altre due le studiano alla Biblioteca. Portaglielo tu.» Poi aggiunge
      che hai lavorato bene, così in fretta che quasi non lo senti.
    opzioni:
      - testo: "Prendere il nucleo"
        descrizione: "Un pezzo di macchina dei Precursori e un lasciapassare per salire dove si sale solo su invito."
        costo: 0
        esito:
          titolo: Il nucleo
          testo: |
            Il nucleo te lo consegnano in Caserma la mattina dopo, avvolto in una
            coperta da cavallo dentro un sacco di tela. È una sfera di metallo grande
            come un cavolo, più pesante di quanto sembri, con incisioni fitte che si
            vedono solo controluce. Alla porta dei Quartieri Alti le guardie leggono
            il lasciapassare e ti fanno passare con il sacco.
          imposta: { indizio.tunica-nera: 1, invito: 1 }
          effetti: { rep.caserma: 1, racconto: 1, pista.sepolcro: 1 }

  # ------------------------------------------------------------ 3 → 4 · la Biblioteca
  - id: biblioteca-il-nucleo
    presso: biblioteca-di-qir-azel
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: Il nucleo della macchina
    sommario: "Alla Biblioteca di Qir-Azel il vecchio bibliotecario ti aspetta, con i pezzi delle altre macchine sul tavolo."
    luogo: Biblioteca di Qir-Azel
    area: quartieri-alti
    requisiti: [pista.sepolcro == 3]
    testo: |
      La Biblioteca di Qir-Azel è immersa in una luce color ambra, e dai lampadari pendono cristalli
      luminescenti che ogni tanto sfarfallano tutti insieme. Gli scaffali del secondo piano hanno le
      ante sigillate con la cera nera della Confraternita, e su quelli bassi un cartellino scritto a
      mano prega di non appoggiare il cappello.

      Dietro un bancone di legno scuro c'è un vecchio con la barba bianca lunga e un panciotto rosso
      passato di moda da decenni, che si sistema il monocolo e ti fa cenno di avvicinarti. «Ah,
      eccoti, giusto in tempo» dice Ulric Stanne. «Non vedevo effettivamente l'ora.»

      Posi il sacco sul tavolo, accanto alla testa di metallo di un'altra macchina e a un cristallo
      conduttore che getta sul legno un bagliore blu. Dal primo piano scende Mattias Crenn, uno
      studioso stempiato con gli occhiali spessi, che prima di guardarti si pulisce le lenti sulla
      manica. In fondo alla sala, da solo a un tavolo, Padre Walter della Confraternita del Velo, un
      monaco enorme con il saio chiuso fino al collo, tiene le mani su un libro chiuso e ti saluta
      con un cenno lento della testa.

      {rissa Media} Sotto il saio ci sono spalle da scaricatore. Se un giorno qualcuno va
      accompagnato fuori dalla Biblioteca, sai già a chi lo chiederanno.
    opzioni:
      - testo: "Chiedere che cosa c'era nei nuclei"
        descrizione: "Ulric e Mattias li studiano da giorni, e a Ulric si legge in faccia che ha qualcosa da dire."
        immagine: personaggi/ulric-stanne
        requisiti: [biblioteca.nucleo == 0]
        costo: 0
        esito:
          titolo: L'ultimo ordine
          testo: |
            «Le memorie erano quasi tutte cancellate» dice Ulric. «L'ultima
            istruzione però è rimasta effettivamente intera, e dice “Ascoltate gli
            ordini di Balthog il Prescelto, qualunque essi siano”. Gliel'hanno
            mandata da fuori, con un dispositivo che imita i Precursori.»

            Mattias dice che per comandare tre macchine da lontano ci vuole una
            volontà enorme, e che allora Balthog è tutt'altro che il bruto di cui
            ridono alla Pignatta.
          imposta: { biblioteca.nucleo: 1 }
          segue: biblioteca-il-nucleo
      - testo: "Sedersi al tavolo di Padre Walter"
        descrizione: "Il monaco sta leggendo di cinque anni fa, quando in città c'era il Cucitore."
        immagine: personaggi/padre-walter
        requisiti: [biblioteca.cucitore == 0]
        costo: 0
        esito:
          titolo: Le Notti Cucite
          testo: |
            Nel 145, racconta Padre Walter, il Cucitore uccise venticinque
            persone, ultimo lo sceriffo Ivo Carstan, e le ricompose come offerte.
            Alla Roccia di Wren, sotto la capanna dell'intagliatore Osric Wren, le
            guardie trovarono un altare a un Demone Uccello, e lui, che era il
            Cucitore, ci era morto davanti con gli occhi cavati e la lingua
            tagliata. Bruciarono la casa e distrussero le scale.
          imposta: { biblioteca.cucitore: 1 }
          effetti: { tormento: 1 }
          segue: biblioteca-il-nucleo
      - testo: "Chiedere del sarcofago di Padre Sollen"
        descrizione: "Nella cripta faceva un freddo che non c'entrava con la stagione. Walter è uno che queste cose le sente."
        immagine: personaggi/padre-walter
        requisiti: [biblioteca.sarcofago == 0, indizio.tunica-nera == 0]
        costo: 0
        esito:
          titolo: La stessa aria
          testo: |
            Padre Vantes ha sentito nella cripta un freddo che con la stagione non
            c'entrava e ha mandato a chiamare Walter, che nel 145 aveva esaminato
            l'altare della Roccia. «Fredda e paziente» dice Walter. «Sopra il
            sarcofago di Padre Sollen ho sentito un'aria molto simile, e io non
            sono uno che esagera.»

            Ulric si toglie il monocolo e lo pulisce sul panciotto per un tempo
            lunghissimo.
          imposta: { biblioteca.sarcofago: 1 }
          segue: biblioteca-il-nucleo
      - testo: "Chiedere del sarcofago di Padre Sollen"
        descrizione: "Nella cripta faceva un freddo che non c'entrava con la stagione, e in un angolo c'era una tunica nera."
        immagine: personaggi/padre-walter
        requisiti: [biblioteca.sarcofago == 0, indizio.tunica-nera >= 1]
        costo: 0
        esito:
          titolo: La stessa aria
          testo: |
            Walter ti spiega che Padre Vantes l'ha chiamato per il freddo della
            cripta, perché nel 145 l'altare della Roccia l'aveva esaminato lui.
            «Un'aria fredda e paziente, e sopra il sarcofago di Padre Sollen ne ho
            sentita una molto simile.»

            Quando racconti della tunica, Ulric misura una spalla nell'aria.
            «Spalle così strette sono di un elfo, o di un mezzelfo. Un orco ci
            infilerebbe a stento un braccio.»
          imposta: { biblioteca.sarcofago: 1 }
          segue: biblioteca-il-nucleo
      - testo: "Decidere di andare a vedere la Roccia di Wren"
        descrizione: "L'altare del 145 e il sarcofago hanno la stessa aria, e la Roccia è sul Torvessa fuori città."
        immagine: ambientazione/roccia-di-wren
        requisiti: [biblioteca.nucleo == 1, biblioteca.cucitore == 1, biblioteca.sarcofago == 1]
        esito:
          titolo: Una strada lungo il fiume
          testo: |
            Lo dici ad alta voce prima di averlo deciso, e Walter non prova a
            fermarti. Ti spiega che nel 145 le scale le hanno distrutte, e che i
            pescatori del Torvessa girano alla larga dalla Roccia anche di giorno.
            Mattias ti scrive su un foglietto la strada lungo il fiume, e Ulric ti
            stringe la mano più del necessario. «Torna a raccontarmelo, che ci
            tengo effettivamente molto» dice.
          effetti: { pista.sepolcro: 1, informazioni.segreto: 1 }
      - testo: "Raccontare dei cristalli del banco"
        descrizione: "La sera del Festival i cristalli dell'Accademia hanno vibrato insieme, poco prima che scendessero le macchine."
        immagine: personaggi/ulric-stanne
        quando: [origine.allievo-di-torvessa >= 1, biblioteca.nucleo == 0]
        costo: 0
        esito:
          titolo: La stessa nota
          testo: |
            Racconti dei cristalli del banco che hanno vibrato insieme prima che
            le macchine calassero dalle grondaie, e Mattias prende appunti sul
            polsino. «Orvald ce l'aveva accennato, effettivamente, a modo suo»
            dice Ulric. Nei nuclei è rimasta intera solo l'ultima istruzione,
            “Ascoltate gli ordini di Balthog il Prescelto, qualunque essi siano”,
            mandata da fuori con un dispositivo che imita i Precursori, e i tuoi
            cristalli l'hanno raccolta per caso.
          imposta: { biblioteca.nucleo: 1 }
          effetti: { informazioni.voce: 1 }
          segue: biblioteca-il-nucleo
      - testo: "Salutare Padre Walter come un confratello"
        descrizione: "In Cattedrale Walter non parla quasi con nessuno, e un accolito del Velo è un'eccezione possibile."
        immagine: personaggi/padre-walter
        quando: [origine.accolito-del-velo >= 1, biblioteca.cucitore == 0]
        costo: 0
        esito:
          titolo: Fra noi vecchi
          testo: |
            Walter ti riconosce dal segno dell'Albero, svelto come lo insegna
            Ottilia ai novizi.

            Nel 145 il Cucitore uccise venticinque persone, ultimo lo sceriffo Ivo
            Carstan. Alla Roccia di Wren, sotto la capanna di Osric Wren, le
            guardie trovarono un altare a un Demone Uccello, e lui, che era il
            Cucitore, ci era morto davanti.

            «L'altare l'ho esaminato io, e in Cattedrale ne parliamo solo fra
            vecchi» dice.
          imposta: { biblioteca.cucitore: 1 }
          segue: biblioteca-il-nucleo

  # ------------------------------------------------------------ ripetibile · le ricerche
  - id: ricerche-in-biblioteca
    presso: biblioteca-di-qir-azel
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: Una giornata fra gli scaffali
    sommario: "Ulric Stanne ti lascia un posto al tavolo lungo, se non ti lecchi le dita per girare le pagine."
    luogo: Biblioteca di Qir-Azel, la sala di lettura
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.sepolcro >= 4]
    testo: |
      Ulric Stanne ti dà un posto al tavolo lungo e ti fa promettere di non
      leccarti le dita per girare le pagine. Gli scaffali dell'archivio
      pubblico salgono fino alla balaustra, e al tavolo accanto uno studente
      dorme su un atlante, con la guancia sulla Cicatrice.

      {origine mercante-dei-ponti} Alla Casa dei Nodi gli annali della Gilda
      si leggono con un esattore seduto accanto, e qui stanno su uno
      scaffale aperto. Prima di sfilarne uno ti guardi alle spalle.

      {resistenza Media fallita} La luce ambra fa venire sonno, e lo
      studente sull'atlante comincia a sembrarti un esempio da seguire.
    opzioni:
      - testo: "Cercare fra i registri e le cronache"
        descrizione: "Fra la polvere degli annali della Gilda e dei verbali del Consiglio, ogni tanto, c'è qualcosa che vale la pena sapere."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Una nota a margine
          testo: |
            In un registro di dazi del 148 trovi una nota su un carico di
            cristalli passato due volte dalla Casa dei Nodi con due pesi diversi.
            Ulric fa il piccolo verso di gola che fa quando il vino è buono.

            {conoscenze-della-strada Media} Due pesi per lo stesso carico vuol
            dire che il dazio l'hanno pagato sul leggero, e il resto è sceso al
            porto per un'altra strada.
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Le illustrazioni
          testo: |
            Ti capita sotto mano una cronaca delle Notti Cucite con le tavole dei
            ritrovamenti, e il resto della giornata lo passi sulla stessa pagina
            di un atlante, con quelle tavole ancora davanti agli occhi.
          effetti: { tormento: 1 }
      - testo: "Aiutare Ulric a rimettere a posto i volumi"
        descrizione: "Il carrello dei libri resi aspetta da tre giorni, e Ulric lo guarda con rancore."
        esito:
          titolo: Il carrello
          testo: |
            Spingi il carrello fra gli scaffali per tutto il pomeriggio, e Ulric,
            indicandoti i posti con il dito, fra un aneddoto di gioventù e una
            lamentela sul prezzo della colla ti dice che al primo piano due
            studiosi non si parlano più da quando la Gilda ne ha finanziato uno
            solo. Lo dice abbassando la voce, con evidente soddisfazione.
          effetti: { informazioni.voce: 1 }
