# Capomozzo, prima parte (pista.capomozzo 0 → 2): Galdrick alla Caserma e la strada per la costa, la
# spedizione nel Rovolungo (C1–C9 del verbale) e il cuore nella tana di Borgoth (C6–C7).
#
# - `la-strada-per-capomozzo` (0 → 1): Galdrick, tornato da Ghoran da pochi giorni, mette in fila quello che sai e ti
#   manda a Rovolungo. A piedi, a cavallo (chiave.cavalcatura, un rintocco in meno) o con una guida.
# - `tornare-a-rovolungo` (pista 1, ripetibile): il rientro dalla Caserma dopo una ritirata.
# - area `rovolungo`: sette stanze ripetibili, in ordine secondo la profondità: 0 l'entrata nascosta nel muro
#   di spine, 1 dentro i tunnel (il tunnel di cardi, il Buco Ululante, il nido dei profughi o le cucce), 2 sulla
#   scogliera (i posti di guardia o il ponte di corda). Una stanza superata non ricompare nella stessa visita
#   (src/motore/spedizioni.ts). La grotta del Ghermitore sotto il Buco (facoltativa, si chiude quando prendi il
#   respiratore) si apre dopo che in questa visita sei passato dal Buco (rovolungo.buco), e il cuore
#   `borgoth-e-cenerascura`, a cento passi dal ponte, si apre a profondità 3.
# - Il cuore porta a due seguiti con le parole di Borgoth (`borgoth-parla`, `borgoth-e-gli-alleati`) se lo
#   vinci o lo calmi; negli altri rami se ne va verso Fondobosco. In ogni ramo `borgoth` (1 morto, 2 legato
#   e interrogato, 3 andato via), pista.capomozzo 2 e `vai: capomozzo`.
quality:
  - { id: rovolungo.buco, nome: Hai visto il Buco Ululante, categoria: stato, nascosta: true, descrizione: "1 se in questa visita sei passato dal Buco Ululante, e allora si apre la grotta del Ghermitore. L'entrata nascosta lo azzera." }

aree:
  - id: rovolungo
    immagine: ambientazione/rovolungo
    nome: Rovolungo
    sommario: "La macchia di rovi lungo la costa settentrionale. Da Qir-Azel sono due giorni e mezzo di cammino, e gli orchi ci hanno scavato dentro le loro gallerie fino al ponte di corda per Capomozzo."
    spedizione: { ritorno: superficie-fratturata, soglia: 3, stanze: 3 }
    testo: |
      Dopo due giorni e mezzo di cammino superi una catena di colline basse
      e spoglie, e il sentiero piega verso nord, incontro al vento. Il vento
      viene dal mare e ti porta il sale fino in gola, e gli alberi crescono
      tutti storti dalla stessa parte, con i rami tirati verso l'interno. Poi
      gli alberi finiscono e comincia il Rovolungo.

      È un muro di rovi e di cardi alto come una casa, che corre lungo la
      costa fin dove arriva lo sguardo. Le spine sono lunghe un dito e
      bagnate dalla nebbia che sale dal mare la mattina e la sera. Dietro il
      muro senti le onde che si rompono sugli scogli, anche se il mare da
      qui resta nascosto.

      Fra le spine del primo rovo è rimasto impigliato un galleggiante da
      rete, una palla di vetro verde grande come un pugno, che una mareggiata
      deve aver portato fin quassù. Dentro c'è una lumaca che ci è entrata da
      piccola e adesso è troppo grossa per uscire. Ti accorgi che stai già
      cercando un varco con gli occhi, e che le mani ti sono finite sotto le
      ascelle per conto loro, lontano dalle spine.

storylet:
  # ------------------------------------------------------------ 0 → 1 · Galdrick alla Caserma
  - id: la-strada-per-capomozzo
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: La strada per Capomozzo
    sommario: "Galdrick è tornato da Ghoran con trenta mercenari e non ha ancora trovato il tempo di farsi la barba. Sul suo tavolo ci sono le tue carte, messe in fila."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo
    area: quartieri-alti
    requisiti: [pista.acciaio >= 8, pista.sepolcro >= 7, pista.capomozzo == 0]
    testo: |
      Galdrick è tornato da Ghoran da pochi giorni, e gli si legge ancora
      addosso. Ha gli stivali grigi del fango dei clan e la barba di una
      settimana, e nel cortile, sotto la finestra, una trentina di mercenari
      con la faccia cotta dal sole litiga ancora con il furiere per le brande.
      Sul muro dell'ufficio il calendario è fermo al giorno della sua
      partenza, perché in sua assenza nessuno si è preso la responsabilità di
      girare la pagina, e lui da quando è tornato non ci ha ancora messo mano.

      {politica-ed-economia Media} Le lance di Ghoran vogliono la paga anche
      nei mesi in cui dormono. Se Galdrick le ha portate fin qui a spese della
      città, ha più paura di quanto gli piacerebbe far vedere.

      Il tavolo è coperto dal rapporto sulla cripta di Sollen e dal diario di
      Isvaro, che si è fatto prestare appena sei entrato e che tiene aperto
      sulle mappe. Galdrick li rilegge davanti a te muovendo le labbra, e
      ogni tanto si ferma su una riga e ci passa sopra l'unghia del pollice,
      come per grattarla via dalla carta.

      «Ho messo in fila quello che mi hai portato» dice, con i pollici nella
      cintura. «Dalla Biblioteca è sparita ogni riga su Capomozzo, e il
      mezzelfo se ne vanta nel suo diario. La sua donna, Aurenne, tiene in
      pugno gli orchi e cerca un Costruttore sotto la fortezza. Nelle mappe
      gli orchi sono quattrocento.» Ripete il numero sottovoce e si gratta
      la barba che non ha avuto il tempo di farsi.

      Batte un dito sulla carta della costa nord, dove il Rovolungo è un
      tratteggio di spine e Capomozzo una macchia d'inchiostro nel mare. «Da
      Ghoran ho portato trenta lance, e mi servono tutte sulle mura. Una
      squadra sulla costa la vedono arrivare da un giorno di distanza, una
      persona sola forse no. Sono due giorni e mezzo di cammino. Voglio sapere
      che cosa c'è su quell'isola prima che quelli dell'isola vengano da noi.»

      {empatia Media} Mentre parla guarda i mercenari dalla finestra, e sta
      già contando quanti ne tornerebbero indietro da una squadra mandata
      sull'isola. Il conto gli è venuto male, e allora ha pensato a te.

      *Ti sta chiedendo di andarci da solo, e lo sa benissimo.* Lo stomaco ti
      si stringe, e intanto le dita hanno già cominciato a contare le fibbie
      dello zaino.
    opzioni:
      - testo: "Partire a piedi"
        descrizione: "Due giorni e mezzo di strada verso nord, con le razioni della Caserma nello zaino."
        esito:
          titolo: Due giorni e mezzo
          testo: |
            Il furiere ti riempie lo zaino di gallette e di carne secca, e ti
            fa firmare la ricevuta per ogni galletta, seguendo la penna con la
            punta della lingua fra i denti. Esci dalla porta nord all'alba. Il
            primo giorno cammini fra i campi, il secondo fra colline sempre più
            spoglie, e la notte dormi con la schiena contro una roccia e il
            mantello tirato fin sopra le orecchie.

            {resistenza Facile fallita} I piedi ti presentano il conto già la
            prima sera. Alla seconda hanno smesso di lamentarsi, e la cosa ti
            preoccupa di più.

            La mattina del terzo giorno il vento comincia a sapere di sale. A
            mezzogiorno hai le vesciche ai talloni, e davanti a te, alto come
            una casa, c'è il muro di spine del Rovolungo.
          effetti: { pista.capomozzo: 1 }
          vai: rovolungo
      - testo: "Partire a cavallo"
        descrizione: "In sella la costa è più vicina, e alle vesciche ci pensa il cavallo."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: In sella
          testo: |
            Il cavallo prende la strada del nord prima al passo e poi al
            trotto, e le colline ti scorrono accanto senza che le gambe se ne
            accorgano. Dormi una notte sola all'aperto, con le redini legate al
            polso, e il cavallo ti sbuffa nell'orecchio ogni volta che un gufo
            si fa sentire, per ricordarti chi dei due fa la guardia. A metà del
            secondo giorno l'aria diventa salmastra e gli alberi cominciano a
            piegarsi verso l'interno. Leghi il cavallo a un pino storto lontano
            dai rovi, e mentre ti allontani lui ti guarda masticando. Dal muso
            sembra già pentito di averti portato fin qui.
          effetti: { pista.capomozzo: 1 }
          vai: rovolungo
      - testo: "Farti accompagnare da una guida"
        descrizione: "Una dei mercenari di Ghoran cacciava foche su quella costa. Vuole il suo prezzo, e conosce le scorciatoie."
        requisiti: [monete >= 20]
        esito:
          titolo: Hagra
          testo: |
            Si chiama Hagra, ha la faccia segnata da tre righe di argilla secca
            e mastica resina dalla mattina alla sera. Conta le monete due volte
            e le fa sparire nello stivale.

            {conoscenze-della-strada Facile} Nello stivale sinistro, quello
            con la suola nuova. Chi tiene i soldi nella scarpa che consuma meno
            ha già camminato con gente di cui non si fidava.

            Ti porta per sentieri da capre che
            sulla carta di Galdrick non ci sono, e la notte ti fa dormire in
            una grotta asciutta, dove i cacciatori lasciano la legna pronta per
            chi viene dopo.

            «Ai rovi ti lascio, eh» dice il terzo giorno, sputando la resina.
            «Le foche le cacciavo io. Gli orchi li lascio a te, eh.»

            Arrivi al muro di spine con le gambe riposate e il sapore della sua
            resina in bocca, perché la sera prima te ne ha offerto un pezzo e
            rifiutare sembrava scortese. Quando ti volti lei è già un puntino
            sulla collina.
          effetti: { monete: -20, ferite: -0.5, pista.capomozzo: 1 }
          vai: rovolungo
      - testo: "Parlare a Hagra nella lingua dei clan"
        descrizione: "Fra i mercenari di Galdrick c'è una che cacciava foche su quella costa. Parla come si parlava fuori dai recinti di Ghoran."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Hagra
          testo: |
            Si chiama Hagra, ha la faccia segnata da tre righe di argilla secca
            e mastica resina. Quando le chiedi la strada nella lingua dei clan
            smette di masticare e ti guarda i polsi, dove i ferri dei recinti
            lasciano un segno che non va più via. I polsi, sotto il suo sguardo,
            ti prudono come il primo giorno fuori dai recinti. Le dici da dove
            vieni senza abbassare gli occhi.

            «Da uno scappato dalla bilancia la paga non si prende, eh» dice, e
            sputa la resina vicino al tuo stivale, con precisione, perché tu
            capisca che è un onore. Ti porta per sentieri da capre che sulla carta di
            Galdrick non ci sono, e la notte ti fa dormire in una grotta
            asciutta con la legna già pronta. Al muro di spine ti lascia con
            una pacca sulla spalla, e quando ti volti è già un puntino sulla
            collina.
          effetti: { ferite: -0.5, pista.capomozzo: 1 }
          vai: rovolungo

  # ------------------------------------------------------------ 1 · rientrare dopo una ritirata
  - id: tornare-a-rovolungo
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/rovolungo
    titolo: Di nuovo verso Rovolungo
    sommario: "Il ponte per Capomozzo è ancora là, oltre i rovi. Il furiere della Caserma ti riempie lo zaino un'altra volta."
    luogo: Guarnigione di Qir-Azel, il cortile
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.capomozzo == 1]
    testo: |
      Nel cortile della Caserma i mercenari di Ghoran hanno imparato a
      mettersi in fila per il rancio. Quelli che non ci riescono ancora
      pelano patate sotto il portico con il furiere che li
      sorveglia dalla porta del magazzino, e uno di loro sbuccia ogni patata
      in un'unica striscia lunga, per orgoglio, mentre il suo vicino ne fa
      sparire metà con la buccia. Galdrick ti vede dalla finestra
      dell'ufficio e non scende. Alza due dita verso di te, e capisci che ti
      sta chiedendo se sull'isola sono ancora tutti al loro posto. Dietro di
      lui, sul muro, qualcuno ha finalmente girato la pagina del calendario.

      {galateo Media} Due dita alzate da una finestra, a un sottoposto. A un
      pari si scende in cortile. Con te Galdrick non ha ancora deciso cosa
      sei, e preferisce non doverlo dire a voce.

      Il furiere ti riempie di nuovo lo zaino di gallette senza farti firmare
      niente, e alla Caserma questo è quanto di più vicino a un
      incoraggiamento. La strada la conosci già. Sono due giorni e mezzo
      verso nord fino al muro di spine. Ti tasti le croste sul dorso delle mani,
      dove i rovi ti hanno lasciato il segno la prima volta, e senti la pelle
      che tira.

      {resistenza Media fallita} Le ginocchia si ricordano le gallerie dei
      rovi meglio di te, e la schiena si informa con garbo se il viaggio sia
      proprio necessario.
    opzioni:
      - testo: "Ripartire a piedi"
        descrizione: "Le stesse colline e lo stesso vento, e le vesciche dove le avevi."
        esito:
          titolo: Di nuovo al muro di spine
          testo: |
            Due giorni e mezzo di colline e di vento, e le vesciche si riaprono
            negli stessi punti della prima volta. A mezzogiorno del terzo giorno
            il muro di spine è grigio di nebbia come lo hai lasciato, e il
            galleggiante di vetro verde è ancora impigliato al primo rovo con
            la sua lumaca dentro, un po' più grossa e un po' più rassegnata. Ti
            stringi la cintura e cerchi con gli occhi il punto dove le impronte
            degli orchi spariscono nei rovi.
          vai: rovolungo
      - testo: "Ripartire a cavallo"
        descrizione: "Il cavallo la strada se la ricorda meglio di te."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Al trotto
          testo: |
            Il cavallo riconosce la strada prima di te e a ogni bivio tira dalla
            parte giusta. Dormi una notte sola sotto un pino, e a metà del
            secondo giorno sei già davanti al muro di spine, con il galleggiante
            di vetro verde impigliato al primo rovo e la sua lumaca dentro. Leghi il cavallo
            allo stesso pino storto della prima volta, e lui si mette a brucare
            dove aveva lasciato, con la soddisfazione di un cliente abituale.
          vai: rovolungo

  # ------------------------------------------------------------ le stanze (ripetibili, in ordine di profondità)
  # 0 · l'entrata nascosta
  - id: rovolungo-entrata-nascosta
    immagine: ambientazione/rovolungo
    titolo: L'entrata nascosta
    sommario: "Vicino alla riva i rovi si fanno ancora più fitti. Le impronte degli orchi arrivano fino al muro di spine e lì finiscono."
    luogo: Rovolungo, vicino alla riva
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 0]
    testo: |
      Vicino alla riva il roveto si fa ancora più fitto, e i cardi crescono in
      mezzo ai rovi fino a sei metri d'altezza, più dei pini storti che li
      circondano. Il rumore delle onde arriva da ovest, oltre il muro, così
      vicino che ti aspetti gli spruzzi in faccia. La nebbia del mattino ha
      lasciato su ogni spina una goccia d'acqua, e quando il vento passa le
      gocce cadono tutte insieme con un rumore di pioggia breve.

      Ai piedi del muro le impronte degli orchi si affollano in un punto e poi
      spariscono, come se fossero entrati nei rovi senza scostarli. Accanto
      c'è un mucchietto di piume di gabbiano spennate con cura, e un osso
      spolpato piantato dritto nella terra, con i segni dei denti tutto
      intorno. Un orco ha passato qui molte ore di guardia senza niente da
      fare.

      {percezione Media} Le piume sono divise in due mucchietti, quelle
      bianche da una parte e quelle grigie dall'altra. Anche la noia, quando
      dura abbastanza, finisce per mettere ordine.

      {furtivita Facile} A una decina di passi dal muro c'è una macchia di
      ginestre, l'unico riparo fra qui e i pini. Se dovessi aspettare
      qualcuno, è lì dietro che lo aspetteresti.

      Ti pulisci le mani bagnate sui calzoni, e ti accorgi che stai
      trattenendo il fiato per sentire meglio.
    opzioni:
      - testo: "Cercare il passaggio"
        descrizione: "Gli orchi entrano da qualche parte, e di sicuro non si aprono la strada con i denti."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La stuoia
          testo: |
            Passi le dita lungo il muro una spanna alla volta, finché un pezzo
            di roveto ti si muove sotto la mano più leggero del resto. È una
            stuoia di rametti e di rovi intrecciati, legata con lo spago di
            budello e fatta così bene che a due passi non la distingui dal
            resto. Qualcuno ci ha messo la pazienza che si mette in un cesto
            da regalare. La sollevi da un lato. Sotto si apre un tunnel alto
            due metri che entra nel roveto, con il pavimento di terra battuta.
          effetti: { profondita.rovolungo: 1 }
          imposta: { rovolungo.buco: 0 }
        fallimento:
          titolo: Le spine
          testo: |
            Infili le mani nei rovi dove le impronte finiscono e tasti alla
            cieca, e le spine bagnate entrano nella carne con una facilità che
            ti sorprende. Quando ritiri le mani hai i dorsi rigati di sangue e
            una spina spezzata sotto l'unghia del pollice.

            {medicina Facile} Una spina bagnata sotto l'unghia fa il pus entro
            domani, se resta dentro. Va tolta adesso, e senza lamentarsi
            troppo.

            Te la togli con i denti, seduto nell'erba, mentre dall'altra parte
            le onde continuano a rompersi.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che passi un orco"
        descrizione: "Prima o poi qualcuno esce, o rientra. Basta stare dove non guarda."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il secchio di vongole
          testo: |
            Ti acquatti dietro un cespuglio di ginestre e aspetti. Dopo un'ora
            dal muro esce un orco con un secchio di vongole, che solleva un
            pezzo di roveto con una mano sola e se lo lascia ricadere alle
            spalle, e va verso gli scogli brontolando. Al ritorno ha il secchio
            pieno e i piedi bagnati fino alle caviglie, e rientra dallo stesso
            punto senza guardarsi intorno. Conti fino a cento, poi vai a
            sollevare il roveto anche tu.
          effetti: { profondita.rovolungo: 1 }
          imposta: { rovolungo.buco: 0 }
        fallimento:
          titolo: La ginestra
          testo: |
            Ti acquatti dietro un cespuglio di ginestre, e il cespuglio è pieno
            di api. Resisti finché puoi. Quando scappi via agitando le braccia,
            l'orco con il secchio di vongole che stava uscendo dal muro ti
            guarda passare a bocca aperta, poi lascia il secchio e corre dentro
            a chiamare gli altri. Ti rintani fra i pini con la faccia gonfia e
            aspetti che le voci si calmino, contando le punture con la lingua
            dall'interno della guancia.
          effetti: { ferite: 0.5 }
      - testo: "Dare fuoco ai rovi"
        descrizione: "Le spine sono secche in cima. Più in basso un po' meno."
        esito:
          titolo: Il fumo
          testo: |
            Accendi un ciuffo di erba secca e lo spingi fra i rovi. I rovi
            bagnati di nebbia fanno soltanto un fumo bianco e denso, che sale
            dritto sopra il roveto, e dall'altra parte del muro qualcuno
            comincia a gridare in orchesco. Spegni tutto a calci e corri a
            nasconderti fra i pini, e ci resti fino a sera con il cuore in gola
            e gli occhi che lacrimano. Il fumo ti è entrato nei vestiti, e per
            tutto il pomeriggio odori come una salsiccia dimenticata sul fuoco.
          effetti: { tormento: 0.5 }
      - testo: "Tagliarti un varco con il coltello"
        descrizione: "Spina per spina, a forza di polso. Il roveto è largo, e il coltello è corto."
        costo: 2
        esito:
          titolo: A forza di polso
          testo: |
            Tagli un ramo alla volta e lo tiri indietro con la manica avvolta
            intorno alla mano, e il roveto si richiude dietro di te quasi alla
            stessa velocità. Dopo un'ora sbuchi in un tunnel di terra battuta,
            alto due metri, scavato dagli orchi dentro i rovi. Hai le braccia
            graffiate fino ai gomiti e una spina nella guancia, che trovi
            soltanto quando sorridi di sollievo. Il coltello, intanto, ha perso
            il filo, e te lo fa capire alla prima radice che provi a tagliare.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }
          imposta: { rovolungo.buco: 0 }

  # 1 · dentro i tunnel
  - id: rovolungo-tunnel-di-cardi
    immagine: ambientazione/rovolungo
    titolo: Il tunnel di cardi
    sommario: "Un tunnel scavato nei rovi, così basso che si cammina piegati. Sulla terra battuta c'è un solco largo, lasciato da qualcosa di grosso trascinato da poco."
    luogo: Rovolungo, i tunnel
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 1]
    testo: |
      Il tunnel serpeggia in mezzo ai rovi e alle ortiche, alto quanto basta
      a un orco che cammini curvo. Le pareti sono di spine intrecciate, e il
      soffitto lascia passare una luce verdastra, a chiazze. Il pavimento è
      di terriccio battuto, con qualche ciuffo d'erba cresciuto proprio in
      mezzo al passaggio, dove lo pestano tutti.

      Le impronte sono tante, quasi tutte di piedi nudi con le dita larghe.
      In mezzo alle impronte corre un solco largo un braccio, liscio, che va
      verso destra e si perde dietro la curva. Su una spina all'altezza del
      ginocchio è rimasto impigliato un ciuffo di crini neri con un riflesso
      verde, simile a quello del dorso di uno scarabeo.

      {cavalcare Media} Sono crini di coda lunghi e spessi, come quelli dei
      cavalli da tiro dei Casati. Nessun cavallo con quella coda entra da
      solo in un buco dove tu cammini piegato.

      {natura Facile} Le impronte nude sono di orchi, e le più profonde
      stanno ai lati del solco, dove chi tirava affondava i talloni.

      Cammini piegato in due, e dopo venti passi senti già il collo che
      protesta e il sudore che ti cola nelle orecchie. Una lumaca, a
      un palmo dalla tua faccia, va nella stessa direzione e sembra più
      comoda di te.
    opzioni:
      - testo: "Leggere il solco"
        descrizione: "Una cosa trascinata lascia segni diversi da una cosa che cammina."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La slitta
          testo: |
            Ti accovacci sul solco. Ai bordi ci sono i segni di due stanghe di
            legno, e in mezzo un pelo lungo e nero, da coda di cavallo. Gli
            zoccoli non hanno mai toccato terra. Hanno trascinato un cavallo
            grande e privo di sensi su una slitta di rami, non più di qualche
            giorno fa. Ti viene in mente, senza motivo, la fatica che si fa a
            spostare un ubriaco addormentato. *Chi si porta un cavallo svenuto
            attraverso un roveto ha in mente qualcosa di preciso.* Il solco va
            verso il mare.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: Le ortiche
          testo: |
            Ti abbassi a guardare il solco da vicino e perdi l'equilibrio, e la
            mano che metti avanti finisce dritta in un cespo di ortiche. Il
            bruciore sale fino al gomito, e sul dorso della mano ti spuntano
            bollicine bianche che pizzicano a ogni movimento. Ti succhi le dita
            imprecando sottovoce per un pezzo, in tutte le lingue che conosci e
            in un paio che stai inventando, e quando torni a guardare il solco
            ti sembra un solco qualunque.
          effetti: { ferite: 0.5 }
      - testo: "Andare avanti carponi, senza rumore"
        descrizione: "Più in basso il tunnel è più largo, e le voci arrivano prima dei piedi."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Carponi
          testo: |
            Ti metti carponi e avanzi con i palmi sulla terra battuta, che a
            quest'altezza è fresca e odora di funghi. Alla seconda curva senti
            delle voci di orchi nel tunnel accanto, separato dal tuo da un palmo
            di spine, e resti fermo finché non si allontanano. Uno dei due
            racconta qualcosa che fa ridere l'altro fino a tossire.

            {empatia Facile} Ridono come due sentinelle a fine turno, con la
            voglia di sentirsi a casa almeno per il tempo di una storia sporca.

            Riparti con le ginocchia impolverate e una lumaca schiacciata sul
            palmo.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: Il ramo secco
          testo: |
            Il ginocchio trova un ramo secco, e il ramo si spezza con uno
            schiocco netto. Dal tunnel accanto una voce gutturale fa una
            domanda, e una lancia entra fra le spine a una spanna dalla tua
            spalla. Ti appiattisci a terra trattenendo il fiato. Quando la lancia
            si ritira ha un filo del tuo mantello sulla punta, e tu hai un
            graffio lungo tutto il braccio. Dall'altra parte qualcuno brontola
            che sono stati i topi, e l'altro gli dà ragione per non alzarsi.
          effetti: { ferite: 0.5 }
      - testo: "Tirare dritto, piegato in due"
        descrizione: "Il tunnel finisce da qualche parte. Intanto la schiena si arrangia."
        costo: 2
        esito:
          titolo: La schiena
          testo: |
            Avanzi piegato in due per un tempo che ti sembra lunghissimo, con le
            spine che ti si impigliano nei capelli a ogni passo. Quando il
            tunnel finalmente si allarga e puoi raddrizzarti, la schiena fa un
            rumore che non le avevi mai sentito fare, e per un po' resti con le
            mani sui fianchi a guardare il cielo a strisce sopra i rovi,
            aspettando che le vertebre tornino ciascuna al suo posto.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }

  - id: rovolungo-buco-ululante
    immagine: ambientazione/rovolungo
    titolo: Il Buco Ululante
    sommario: "Tre tunnel finiscono in una sala di rovi. In fondo c'è un buco nel terreno, e dal buco sale il rumore del mare."
    luogo: Rovolungo, il Buco Ululante
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 1]
    testo: |
      Tre tunnel di cardi sbucano in una camera larga, simile a una caverna
      fatta di rovi. Il soffitto è così fitto che del cielo restano soltanto
      poche strisce, e il terriccio del pavimento è pestato e duro come
      un'aia. A ovest, vicino alla parete, si apre nel terreno un buco largo
      quanto un pozzo.

      Dal buco sale il vento del mare, e quando arriva l'onda sale anche un
      ululato lungo che cresce e si spegne insieme al rumore dell'acqua là
      sotto. Gli orchi hanno messo intorno all'orlo un cerchio di sassi.
      Accanto al cerchio, legato a un paletto con un pezzo di rete, c'è un
      gabbiano morto, e poco più in là un secondo paletto con la rete vuota.

      {natura Media} Un gabbiano legato sopra un buco che dà sul mare è
      un'esca, o un'offerta. Il secondo paletto vuoto dice che qualcosa, là
      sotto, l'ha già accettata.

      {resistenza Media fallita} Gli ululati ti entrano nello sterno e ci
      restano un po' più a lungo uno dell'altro, e lo stomaco, che non ha
      voce in capitolo, si chiude a pugno lo stesso.

      Ogni volta che il buco ulula ti si drizzano i peli delle braccia, e dopo
      un po' ti accorgi che stai respirando al ritmo delle onde.
    opzioni:
      - testo: "Scegliere il tunnel giusto"
        descrizione: "Da qui partono tre strade, e una sola va verso il mare."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il solco
          testo: |
            Giri intorno alla sala chinato sul terreno. Due tunnel hanno
            soltanto impronte vecchie, pestate da altre impronte. Nel terzo
            corre verso il mare il solco pulito di una slitta, e sui bordi
            ci sono gocce scure di resina, cadute dalle torce di chi lo ha
            percorso di notte. Ne raccogli una con l'unghia, ed è ancora
            morbida, e l'odore di pino ti resta sulle dita per un pezzo. Lo
            imbocchi con il vento del buco alle spalle.
          effetti: { profondita.rovolungo: 1 }
          imposta: { rovolungo.buco: 1 }
        fallimento:
          titolo: Il giro largo
          testo: |
            Scegli il tunnel con più impronte, e dopo un'ora esatta il tunnel ti
            riporta nella sala del buco, dall'altra parte. Gli orchi lo usano
            per fare il giro delle guardie, e a metà strada ha perfino una
            nicchia per pisciare, che riconosci dall'odore molto prima di
            vederla. Ti siedi un momento accanto al cerchio di sassi, e il vento
            del buco ti soffia in faccia a ogni onda finché ti viene il mal di
            testa.
          effetti: { tormento: 0.5 }
          imposta: { rovolungo.buco: 1 }
      - testo: "Calarti nel buco per guardare giù"
        descrizione: "La parete del pozzo è di roccia, con qualche appiglio. Bastano pochi metri."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La grotta
          testo: |
            Scendi con la schiena contro una parete e i piedi contro l'altra,
            finché il pozzo si apre sopra una grotta di mare. Una ventina di
            metri più sotto l'acqua sale e scende fra pareti che scintillano, e
            a sud c'è una sporgenza di roccia appena sopra le onde. Sulla
            sporgenza vedi delle ossa e un luccichio di metallo. Nell'acqua
            sotto la sporgenza gira in tondo una cosa grossa e lucida.

            {tecnologia Difficile} Quella cosa nuota con un ritmo troppo
            regolare per una bestia. Ogni giro dura uguale al precedente, come
            un ingranaggio che qualcuno ha dimenticato di fermare.

            Risali più in fretta di quanto sei sceso.
          effetti: { profondita.rovolungo: 1 }
          imposta: { rovolungo.buco: 1 }
        fallimento:
          titolo: L'appiglio
          testo: |
            Un appiglio ti resta in mano e scivoli per due metri con la schiena
            contro la roccia, prima che il piede trovi una sporgenza. Resti lì
            appeso sopra il buio, con il vento che ti sale fra le gambe e il
            rumore dell'acqua sempre più forte, e per un momento lungo pensi
            soltanto al piede e alla sporgenza. Quando riesci a risalire hai la
            camicia strappata e la schiena scorticata dalle spalle ai fianchi.
          effetti: { ferite: 0.5 }
          imposta: { rovolungo.buco: 1 }
      - testo: "Passare oltre senza guardare il buco"
        descrizione: "Lungo la parete opposta, con gli occhi sui piedi."
        costo: 2
        esito:
          titolo: Il colpo di metallo
          testo: |
            Attraversi la sala tenendoti contro la parete opposta, con gli occhi
            sui piedi, e a ogni ululato lo stomaco ti si contrae da solo. A metà
            ti fermi senza volerlo, perché dal buco, in mezzo al rumore del
            mare, ti è sembrato di sentire un colpo di metallo contro la roccia.
            Ti dici che sarà stata una catena, o qualunque altra cosa con un
            nome normale. Riprendi a camminare più svelto, e non ti volti fino al
            tunnel.
          effetti: { profondita.rovolungo: 1, tormento: 0.5 }
          imposta: { rovolungo.buco: 1 }

  - id: rovolungo-nido-dei-profughi
    immagine: bestiario/orco
    titolo: Il nido dei profughi
    sommario: "Una camera bassa e piena di fumo, con nove giacigli di felci. Una decina di orchi magri, con le piume nei capelli, litiga intorno al fuoco."
    luogo: Rovolungo, il nido dei profughi
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 1]
    testo: |
      La camera è rotonda, larga nove metri, con il soffitto di rovi così
      basso che il fumo non trova la strada per uscire e ristagna a mezz'aria.
      In mezzo c'è una fossa per il fuoco da cui sale ancora un filo grigio.
      Lungo le pareti sono disposti nove giacigli di foglie e di felci
      intrecciate, e in quasi tutti c'è qualcuno.

      Sono una decina di orchi, magri, con le piume di uccello intrecciate nei
      capelli. *Spiumatori, la tribù del Gradone Rosso.* Due
      litigano a voce bassa per un gabbiano crudo e lo tirano ciascuno dalla
      sua parte. Un altro, seduto in disparte, intreccia con cura una piuma
      nella treccia di una ragazza orca, che tiene gli occhi chiusi e lo
      lascia fare.

      {empatia Media} La ragazza tiene gli occhi chiusi perché, finché li
      tiene chiusi, la camera può essere un'altra. Quello che le intreccia la
      piuma lo sa, e va piano apposta.

      Nessuno ha un'arma in mano. Le lance però sono tutte appoggiate al muro,
      a portata di braccio, e il tuo sguardo ci torna sopra ogni volta che
      qualcuno si muove.

      {rissa Media} Sono magri e stanchi, e quelli che litigano per il
      gabbiano hanno già speso le forze. Il pericolo vero sono le lance, e
      il primo che arriva al muro.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Sono tanti e affamati, e anche stanchi. Le lance stanno al muro."
        combattimento: nido-dei-profughi
        vittoria:
          titolo: Il gabbiano
          testo: |
            Il primo che ti arriva addosso ha la lancia girata al contrario, e
            dopo di lui gli altri esitano. Quando due sono a terra il resto
            scappa nei tunnel e lascia il gabbiano conteso in mezzo alla camera.
            Rimane soltanto la ragazza con la treccia, seduta sul suo giaciglio
            con la piuma nuova fra i capelli, che ti guarda senza muoversi
            finché non sei uscito dall'altra parte. Nel tunnel ti accorgi che
            hai ancora le nocche chiuse, e che fanno fatica ad aprirsi.
          effetti: { profondita.rovolungo: 1 }
        sconfitta:
          titolo: Nel fumo
          testo: |
            Sono troppi, e nel fumo non capisci da dove arrivano. Una lancia ti
            prende di striscio sul fianco e un'altra ti batte sulla nuca con il
            manico, e ti ritrovi carponi nel tunnel mentre loro ridono e ti
            tirano dietro le ossa del gabbiano. Nessuno ti insegue, perché hanno
            più paura di quello che c'è oltre il ponte che di te. Ti tocchi la
            nuca, e le dita tornano indietro appiccicose.
      - testo: "Parlare con loro"
        descrizione: "Hanno lasciato la loro tribù e hanno paura di Balthog. Chi ha paura, a volte, ha voglia di raccontarla."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Quelli che passano il ponte
          testo: |
            Entri con le mani aperte e ti siedi vicino al fuoco, e dopo un lungo
            silenzio un vecchio con mezzo orecchio comincia a parlare in un
            comune storpiato. Dopo la razzia sono scesi dal Gradone a chiedere
            asilo a Balthog, e Balthog li tiene qui. Ogni tre o quattro notti
            vengono gli orchi di Capomozzo e ne portano via due oltre il ponte,
            dalla *Mawrak'Thur*, e quelli non tornano.

            {conoscenze-della-strada Media} Un capo che accoglie dei profughi
            e poi lascia che glieli portino via due alla volta li ha messi da
            parte per qualcun altro, e il vecchio lo sa benissimo.

            «Eravamo venti. Adesso siamo dieci» dice il vecchio, e dopo un
            momento, con lo stesso tono, ti chiede se hai del pane.
          effetti: { profondita.rovolungo: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il pane
          testo: |
            Entri con le mani aperte, e il vecchio con mezzo orecchio ti chiede
            se hai del pane. Quando dici di no, la ragazza con la treccia prende
            una lancia dal muro, e dopo di lei la prendono anche gli altri. Esci
            all'indietro con una punta di lancia che ti segue fino al tunnel, e
            lì ti punge la coscia, una volta sola, per avvertimento. Dietro di
            te il vecchio continua a parlare del pane, a nessuno in particolare.
          effetti: { ferite: 0.5 }
      - testo: "Dare loro le tue razioni"
        descrizione: "Le gallette della Caserma e la carne secca. La strada del ritorno la farai con la cintura stretta."
        costo: 2
        esito:
          titolo: Dieci parti uguali
          testo: |
            Svuoti lo zaino sul pavimento e ti tiri indietro. Per un momento
            nessuno si muove. Poi il vecchio con mezzo orecchio divide le
            gallette in dieci parti uguali con un coltello di selce, e mentre
            gli altri mangiano a testa bassa ti fa cenno di passare. La ragazza
            con la treccia mette da parte metà della sua parte, nascosta sotto
            le felci. I giorni dopo li cammini con la cintura stretta di due
            buchi e le gambe molli.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }

  - id: rovolungo-cucce-dei-cinghiali
    immagine: bestiario/cinghiale-crudele-mutato
    titolo: Le cucce dei cinghiali
    sommario: "Quattro cinghiali da guerra incatenati ai pali, e un passaggio stretto in mezzo. Le catene sono lunghe quasi abbastanza."
    luogo: Rovolungo, le cucce dei cinghiali
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 1]
    testo: |
      La stanza puzza di stalla chiusa e di pelo bagnato. Pavimento e pareti
      sono coperti di setole scure, e dappertutto ci sono ossa rosicchiate,
      alcune così grosse che preferisci non chiederti di che bestia fossero.
      Lungo le pareti sono piantati una dozzina di pali di legno, scortecciati
      all'altezza del muso.

      A quattro pali sono incatenati quattro cinghiali da guerra, alti fino
      alla vita di un uomo, con le zanne cerchiate di ferro. Appena ti vedono
      si buttano in avanti tutti insieme, e le catene si tendono a un passo
      dal sentiero che attraversa la stanza. Uno dei quattro ha un campanaccio
      da capra legato al collo, e ogni volta che tira il campanaccio suona
      allegro come in un pascolo. Qualcuno, fra gli orchi, deve averlo
      trovato divertente, e nessuno ha avuto il coraggio di toglierlo.

      {addestrare-animali Media} Il più grosso si butta sempre per primo, e
      gli altri tre gli vanno dietro mezzo passo più tardi. Se si calma lui,
      si calmano tutti.

      {armi-da-mischia Facile fallita} Le zanne cerchiate di ferro sono
      lunghe più del tuo coltello. Il confronto ti mette di cattivo umore, e
      non ti suggerisce niente di utile.

      Il passaggio in mezzo è largo due passi. Senti il cuore che batte nella
      gola, e le ginocchia che non hanno nessuna voglia di muoversi.
    opzioni:
      - testo: "Calmarli con la voce"
        descrizione: "Anche una bestia da guerra si può calmare, se chi le parla non ha paura."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: La cantilena
          testo: |
            Ti fermi a distanza e parli piano, sempre con la stessa cantilena,
            senza guardarli negli occhi. Il più grosso smette di tirare per
            primo, poi gli altri. Passi in mezzo con la stessa voce e lo stesso
            passo, e quello con il campanaccio ti annusa la mano senza morderla.
            Sulla soglia ti accorgi che stai ancora cantilenando, e che la
            cantilena è una ninna nanna che non ricordavi di sapere. Non
            ricordi nemmeno chi te l'ha cantata, e per un pezzo, nel tunnel,
            ci provi.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: La zanna
          testo: |
            Parli piano, ma la voce ti trema e le bestie lo sentono subito. Il
            più grosso si butta in avanti con tutto il peso finché il palo si
            piega, e la zanna cerchiata di ferro ti prende la coscia di striscio
            prima che tu riesca a tirarti indietro. Torni al tunnel zoppicando,
            con il campanaccio che suona alle tue spalle allegro come prima,
            del tutto indifferente alla tua coscia.
          effetti: { ferite: 0.5 }
      - testo: "Parlare loro con il Richiamo"
        descrizione: "Nella lingua che il Circolo insegna ai bambini, anche un cinghiale da guerra si sente chiamare."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il nome
          testo: |
            Dici le parole del Richiamo a bassa voce, e i quattro cinghiali
            alzano il muso nello stesso momento. Uno alla volta si accucciano ai
            piedi dei pali, con le orecchie girate verso di te e il fiato che
            fuma nell'aria fredda della stanza. Passi in mezzo senza fretta, e
            il campanaccio resta muto per tutto il tempo.

            {magia Media} Il Richiamo ti lascia in bocca il sapore del
            sottobosco, e per qualche passo senti ancora i quattro cuori grossi
            e lenti che battono dietro di te.

            Dall'altra parte ti tremano le mani, e le infili sotto le ascelle.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: La paura
          testo: |
            A metà della formula la voce ti si incrina, e i cinghiali sentono
            soltanto la tua paura. Si buttano in avanti tutti e quattro insieme,
            e un palo esce dal terreno di una spanna. Ti tiri indietro
            inciampando nelle ossa e ti sbucci i palmi sul pavimento duro. Dal
            tunnel li senti grugnire ancora a lungo, mentre ti togli le setole
            dai graffi una alla volta e ripeti la formula a mezza voce, giusta,
            adesso che non serve più.
          effetti: { ferite: 0.5 }
      - testo: "Passare fuori dalla portata delle catene"
        descrizione: "Lungo la parete c'è una striscia dove le zanne non arrivano. È stretta."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Rasente il muro
          testo: |
            Studi le catene e vedi che lungo la parete nord c'è una striscia di
            terra dove nessuna zanna arriva, larga quanto un piede. Ci passi di
            fianco, con la schiena contro i rovi e le spine che ti si piantano
            nella giubba, mentre i cinghiali si sfiancano a tirare a un palmo
            dai tuoi stivali. Il fiato del più vicino ti scalda le ginocchia.
            Dall'altra parte ti stacchi dal muro una spina alla volta.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: Il palmo in meno
          testo: |
            La striscia lungo la parete è più stretta di quanto sembrava. A metà
            il piede ti scivola sulle setole, e il cinghiale più vicino ti
            arriva addosso con il muso prima che la catena lo fermi e ti butta
            contro i rovi. Esci dall'altra parte con un livido sul fianco e la
            giubba piena di spine, e ti siedi un momento a tirarle via, mentre
            il fianco comincia a cambiare colore sotto la camicia.
          effetti: { ferite: 0.5 }
      - testo: "Lanciare le ossa e passare mentre litigano"
        descrizione: "Di ossa ce ne sono tante, e i cinghiali sono quattro. Basta lanciarle bene."
        costo: 2
        esito:
          titolo: Le ossa
          testo: |
            Raccogli le ossa più grosse e le lanci in fondo alla stanza, una
            dopo l'altra. I cinghiali si girano a contendersele, e tu passi in
            mezzo. L'ultimo osso lo lanci male, e quello con il campanaccio si
            gira di nuovo verso di te un attimo prima che tu sia fuori dalla sua
            portata, con il campanaccio che suona a festa. La zanna ti lascia un
            taglio lungo e pulito sul polpaccio.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }

  # 2 · sulla scogliera
  - id: rovolungo-posti-di-guardia
    immagine: ambientazione/rovolungo
    titolo: I posti di guardia
    sommario: "Due casotti di rovi e di legno di mare, sulla scogliera. Ci dovrebbe essere qualcuno di guardia, e sono vuoti."
    luogo: Rovolungo, sulla scogliera
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 2]
    testo: |
      Il tunnel sbuca all'aperto sul bordo della scogliera, e dopo tanta
      penombra la luce ti costringe a socchiudere gli occhi. Ai lati del
      sentiero ci sono due posti di guardia, casotti bassi di rovi intrecciati
      e legno portato dal mare, con una feritoia verso il sentiero e una verso
      il mare. In fondo al sentiero, dove la scogliera finisce, si vedono i
      pali di un ponte.

      I casotti sono vuoti. Nel primo la cenere del fuoco è fredda da giorni.
      Su un'asse appoggiata a due sassi qualcuno ha inciso con il coltello un
      tavoliere, e le pedine sono sassolini bianchi e neri, rimasti a metà di
      una partita. Uno dei due giocatori stava vincendo di parecchio.

      {percezione Facile} Accanto al tavoliere, dalla parte di chi perdeva,
      c'è un sassolino bianco in più, nascosto sotto il bordo dell'asse.
      Qualcuno stava cercando di rimediare.

      {intimidire Media} Una guardia lascia la partita a metà soltanto se la
      chiamano, e di solito la chiama qualcuno di cui ha più paura che della
      noia. Quei due, con ogni probabilità, sono di là sull'isola.

      Il vento ti entra nel mantello e lo gonfia, e tu lo tieni chiuso con una
      mano, guardando ora i casotti e ora il sentiero alle tue spalle.
    opzioni:
      - testo: "Frugare nei casotti"
        descrizione: "Chi passa le giornate di guardia si fa un nascondiglio, per le cose sue."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: L'asse che suona vuota
          testo: |
            Sotto la paglia del secondo casotto trovi un'asse che suona vuota.
            Nel buco c'è un sacchetto di cuoio con delle monete di Qir-Azel
            sporche di terra, insieme a un corno da richiamo con l'imboccatura
            masticata. Le monete vengono quasi certamente dalla razzia, e le
            prendi. Su una c'è ancora il segno di un morso, di qualcuno che
            voleva essere sicuro. Il corno lo lasci dov'è, anche se la mano ci
            torna sopra due volte prima che tu rimetta a posto l'asse.
          effetti: { profondita.rovolungo: 1, monete: 12 }
        fallimento:
          titolo: Le vespe
          testo: |
            Sollevi la paglia del secondo casotto e sotto c'è un nido di vespe
            grande quanto una testa. Corri fuori agitando le braccia fino al
            bordo della scogliera, e ti fermi a un passo dal vuoto con tre
            punture sul collo e il cuore che martella. Il vento si porta via il
            ronzio, e la partita di pedine resta a metà. Ti viene il dubbio che
            le guardie sapessero del nido e che il nascondiglio fosse proprio
            quello.
          effetti: { ferite: 0.5 }
      - testo: "Salire sul tetto e guardare l'isola"
        descrizione: "Il casotto è basso, ma da lassù si vede oltre il bordo della scogliera."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La testa mozzata
          testo: |
            Ti arrampichi sul tetto di rovi tenendoti alle travi di legno di
            mare, e da lassù vedi l'isola. È tonda, con la cima piatta, a una
            ventina di metri dalla scogliera, e vista da qui ha davvero la forma
            di una testa mozzata. In cima c'è una palizzata alta quanto una
            casa, con due torri di guardia sul lato sud. Sulla torre più vicina
            due orchi si passano una bottiglia.

            {armi-da-distanza Media} Venti metri di mare e una torre più alta
            di te. Da lassù un arco ti prende sul ponte prima che tu arrivi a
            metà, e quei due, per fortuna, hanno le mani occupate.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: Il tetto
          testo: |
            Il tetto di rovi regge il primo ginocchio e cede sotto il secondo, e
            ti ritrovi dentro il casotto, seduto nella cenere fredda, con il
            tavoliere rovesciato e le pedine sparse dappertutto. Ti rialzi con
            una spina conficcata nel sedere, e prima di uscire rimetti le pedine
            sul tavoliere a memoria, come ti sembra che stessero, lasciando in
            vantaggio quello che stava vincendo. Ti sembra giusto, e non sapresti
            dire perché ci tieni tanto.
          effetti: { ferite: 0.5 }
      - testo: "Aggirare i casotti fra i rovi"
        descrizione: "Lontano dalle feritoie, sul bordo della scogliera. Il vuoto resta a sinistra."
        costo: 2
        esito:
          titolo: Sul bordo
          testo: |
            Esci dal sentiero e giri largo intorno ai casotti, fra i rovi che
            crescono sul bordo della scogliera, per non passare davanti alle
            feritoie. Il vuoto ti resta a un passo sulla sinistra, e ci metti
            un'ora per fare cento passi. A metà strada un gabbiano plana
            sotto di te, e lo stomaco ti si rovescia, perché gli uccelli
            dovrebbero stare sopra e non sotto. Quando torni sul sentiero hai
            le mani graffiate e i calzoni a brandelli dal ginocchio in giù.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }

  - id: rovolungo-ponte-di-corda
    immagine: ambientazione/capomozzo
    titolo: Il ponte di corda
    sommario: "Fra la scogliera e l'isola di Capomozzo c'è un ponte di corda sospeso sopra il mare, che cigola a ogni colpo di vento."
    luogo: Rovolungo, il ponte per Capomozzo
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 2]
    testo: |
      Dal bordo della scogliera un ponte di corda attraversa il braccio di
      mare fino all'isola, che sta una ventina di metri più a nord. L'isola è
      tonda e ha la cima piatta, coperta di macchie di rovi e di ortiche, e
      sopra ci sta una palizzata alta quanto una casa, con due torri di
      guardia sul lato sud. Gli orchi restano nascosti dietro le assi, e si
      sente soltanto qualcuno che martella.

      Il ponte è fatto di corde lucide e di assi robuste, e ondeggia a ogni
      colpo di vento, ventiquattro metri sopra le onde che si rompono sugli
      scogli. Sul primo palo qualcuno ha inchiodato un ferro di cavallo a
      rovescio, con le punte in giù, e qualcuno ci ha appeso sotto un ciuffo
      di piume di gabbiano legate con lo spago.

      {accademiche Media} Il ferro di cavallo rovesciato, nelle campagne
      intorno a Qir-Azel, lascia scorrere via la fortuna. Le piume legate
      sotto sembrano un tentativo di trattenerla, fatto da qualcuno che la
      pensava diversamente.

      {acrobazia Media fallita} Provi a immaginarti a metà del ponte, con il
      vento di traverso, e le ginocchia si rifiutano di partecipare anche
      soltanto all'immaginazione.

      Guardi giù una volta sola. Lo stomaco ti sale in gola e ci resta, e le
      mani si chiudono da sole sulla corda del parapetto.
    opzioni:
      - testo: "Studiare gli attacchi del ponte"
        descrizione: "Un ponte che porta a una fortezza di orchi merita di essere guardato da sotto."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Le corde segate
          testo: |
            Ti stendi a pancia in giù sul bordo e guardi gli attacchi da
            vicino. Le corde del lato ovest sono segate a metà, dalla parte che
            non si vede, e chi ci passa carico o di corsa finisce in mare.
            Dalla parte dell'isola, alla base dei pali, pendono delle corde
            annodate più chiare delle altre, nuove. Con quelle il ponte si lega
            meglio, e gli orchi l'hanno fatto da poco, per farci passare un peso
            grosso.

            {tecnologia Media} Il taglio è fatto con giudizio, a mezzo spessore,
            perché regga il passo di un orco tranquillo e nient'altro. Una
            trappola per chi ha fretta, e chi arriva da Qir-Azel, di solito, ne
            ha.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: L'asse
          testo: |
            Ti sporgi per guardare sotto la prima asse, e l'asse si inclina
            sotto il gomito. Per un momento vedi soltanto le onde, lontanissime.
            Ti tiri indietro con le unghie piantate nella terra e resti steso a
            respirare, con il gomito sbucciato e una nausea che non passa. Prima
            di rialzarti aspetti che la terra smetta di ondeggiare sotto di te,
            e la terra, con calma, ti accontenta.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare piano, a mani vuote"
        descrizione: "Senza zaino e senza fretta, un'asse alla volta. Dall'altra parte ci sono delle corde per legarlo meglio."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Un'asse alla volta
          testo: |
            Lasci lo zaino sulla scogliera e attraversi un'asse alla volta, con
            le mani sulle corde e gli occhi sull'asse successiva. A metà il
            ponte scende di un palmo sotto i piedi e poi si ferma. Dall'altra
            parte, sotto la palizzata, trovi le corde annodate alla base dei
            pali e le leghi agli attacchi del lato ovest, con le dita che
            sbagliano il primo nodo e azzeccano il secondo. Quando torni
            indietro il ponte ondeggia meno, e le gambe ti tremano fino alla
            scogliera.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: Il lato ovest
          testo: |
            A metà il vento ti spinge e tu acceleri il passo senza volerlo, e il
            lato ovest del ponte cede di colpo. Le assi si mettono di traverso e
            ti ritrovi appeso alla corda dell'altro lato, con le gambe nel vuoto
            e le onde sotto di te. Risali un braccio alla volta e torni alla
            scogliera strisciando sulle assi storte, con le mani bruciate dalla
            corda. Sulla terra ferma ti accorgi che stai ridendo, e non c'è
            niente da ridere.
          effetti: { ferite: 1 }
      - testo: "Aspettare che cali il vento"
        descrizione: "Prima o poi il vento cala, e intanto sulla scogliera fa freddo."
        costo: 2
        esito:
          titolo: Al tramonto
          testo: |
            Ti rannicchi dietro un masso con il mantello sopra la testa e
            aspetti. Il vento cala soltanto al tramonto, quando dall'isola
            arriva odore di carne arrosto e sulle torri accendono le torce.
            Quando passi il ponte è fermo e le assi sono umide di nebbia, e le
            dita dei piedi hai smesso di sentirle da un pezzo. L'odore della
            carne ti segue per tutto il ponte, e lo stomaco gli va dietro. Torni indietro allo
            stesso modo, piano, con i denti che battono.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }

  # ------------------------------------------------------------ la grotta del Ghermitore (C27, facoltativa)
  # Si apre dopo il Buco Ululante (rovolungo.buco) ed è una deviazione: non fa avanzare. Si chiude quando
  # prendi il respiratore; chi fallisce o perde può riprovarci.
  - id: la-grotta-del-ghermitore
    immagine: ambientazione/rovine-dei-precursori
    titolo: La grotta sotto il Buco
    sommario: "Sotto il Buco Ululante si apre una grotta di mare. Sulla sporgenza luccica del metallo, e nell'acqua scura gira in tondo una bestia."
    luogo: Rovolungo, la grotta sotto il Buco Ululante
    area: rovolungo
    requisiti: [pista.capomozzo == 1, profondita.rovolungo >= 1, rovolungo.buco == 1, ghermitore == 0]
    testo: |
      Leghi la corda al paletto del gabbiano e ti cali nel Buco Ululante, con
      il vento che ti sale addosso a ogni onda. Il pozzo è lungo una ventina
      di metri e si apre nella volta di una grotta, tre metri sopra
      l'acqua. Ti lasci scivolare fino a una sporgenza di roccia larga un
      passo e lunga quattro, che sul lato sud è l'unico punto asciutto.

      La grotta scintilla. Le pareti bagnate sono coperte di ricci di mare e
      di anemoni. L'acqua sale e scende fra gli scogli senza mai fermarsi.
      Sulla sporgenza ci sono ossa di foca e lo scheletro di un uomo, con la
      cintura degli attrezzi da Raschiatore ancora allacciata in vita. Accanto
      al teschio c'è una maschera di metallo grigio, liscia, che la salsedine
      non ha nemmeno sfiorato.

      {tecnologia Media} Un metallo che il sale non intacca l'hanno lavorato
      i Precursori. Chissà cosa contava di farne il Raschiatore, che se l'è
      portata fin quaggiù e adesso le tiene compagnia.

      {armi-da-mischia Media} Il coltello da Raschiatore è ancora nel
      fodero, alla cintura. Le ossa del braccio destro, spezzate di netto,
      spiegano perché non ha fatto in tempo a tirarlo fuori.

      Poi l'acqua gorgoglia. Si apre una schiuma scura, e dalla schiuma esce
      una testa lucida fatta per metà di carne e per metà di metallo, con le
      scaglie d'acciaio corroso e due occhi dorati senza pupilla che si accendono nella
      penombra. La bocca si apre a scatti su due file di denti d'acciaio
      ricurvi, e dalle giunture escono sbuffi di vapore che sanno di olio
      bruciato. Senti la corda che ti scivola fra le dita sudate.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "Sulla sporgenza c'è posto per uno, e l'acqua è tutta sua."
        combattimento: ghermitore
        vittoria:
          titolo: La maschera grigia
          testo: |
            Il Ghermitore si getta sulla sporgenza tre volte, e alla terza la
            tua lama trova la carne fra due scaglie. Si ritira sott'acqua
            lasciando una scia scura e oleosa, e non torna più a galla. Fra i
            denti d'acciaio che ha perso sulla roccia c'è un cristallo grezzo
            che pulsa ancora. Lo prendi, poi prendi la maschera grigia accanto
            al teschio del Raschiatore, chiedendogli scusa a mezza voce senza
            sapere bene perché, e risali la corda con le braccia che tremano.
          effetti: { oggetto.respiratore: 1, ghermitore: 1, cristalli.cristallo-carico: 1 }
        sconfitta:
          titolo: Sott'acqua
          testo: |
            Il Ghermitore ti prende per una caviglia e ti tira giù, e per un
            tempo lungo quanto il fiato che hai vedi soltanto bolle e una luce dorata.
            Riesci a liberarti con un calcio e riemergi sotto la volta, e con le
            ultime forze ti aggrappi alla corda. Risali a mani vuote, e in cima
            ti stendi accanto al cerchio di sassi a vomitare acqua di mare. Il
            gabbiano legato al paletto ti guarda con il suo occhio morto, e ha
            l'aria di averlo previsto.
      - testo: "Gettargli un'esca lontano dalla sporgenza"
        descrizione: "Gli orchi gli danno da mangiare i gabbiani. Un gabbiano che cade dall'altra parte della grotta potrebbe bastare, se l'onda non lo riporta indietro."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: Il gabbiano del paletto
          testo: |
            Aspetti che l'onda si ritiri e lanci il gabbiano che hai staccato
            dal paletto contro la parete opposta, dove l'acqua è più bassa. Il
            Ghermitore ci si gira contro con uno scatto di metallo, e mentre lo
            sbrana ti chini sullo scheletro e prendi la maschera grigia. È
            fredda e più leggera di quanto sembrava, e i bordi, quando la
            stringi, si piegano appena sotto le dita come cuoio tiepido. Quando
            torna a guardare la sporgenza sei già a metà della corda.
          effetti: { oggetto.respiratore: 1, ghermitore: 1 }
        fallimento:
          titolo: L'onda
          testo: |
            Lanci il gabbiano verso la parete opposta, e l'onda lo riporta
            indietro fino ai piedi della sporgenza. Il Ghermitore lo prende, e
            con lo stesso slancio prende anche il tuo stivale. Ti trascina
            nell'acqua fino alle ginocchia prima che tu riesca ad aggrapparti
            alla corda, e risali con il polpaccio aperto fino all'osso e senza
            la maschera. In cima ti fasci la gamba con la camicia, seduto
            accanto al cerchio di sassi, e la camicia diventa rossa prima che tu
            abbia finito il nodo.

            {medicina Media fallita} Ti sembra di ricordare che una ferita così
            va lavata con l'acqua di mare, o forse che con l'acqua di mare non
            va lavata mai. Nel dubbio la guardi molto intensamente.
          effetti: { ferite: 2 }
      - testo: "Ordinargli di fermarsi"
        descrizione: "È fatto di carne e di metallo, e il metallo è dei Precursori. Una parte di lui forse capisce ancora la lingua delle macchine."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: L'ordine
          testo: |
            Dici l'ordine nella lingua delle macchine, e gli occhi dorati del
            Ghermitore si spengono uno dopo l'altro. Resta a galla immobile, con
            il vapore che gli esce piano dalle giunture, finché la corrente lo
            porta sott'acqua. Prendi la maschera grigia accanto al teschio e un
            cristallo che pulsa fra le ossa di foca, e risali con un gusto di
            ferro sulla lingua.

            {magia Media} La lingua delle macchine ti lascia un formicolio
            dietro i denti. Il Mana di quaggiù è vecchio e ubbidiente, e ti ha
            dato retta più in fretta di quanto ti faccia piacere sapere.
          effetti: { oggetto.respiratore: 1, ghermitore: 1, cristalli.cristallo-carico: 1 }
        fallimento:
          titolo: L'eco storta
          testo: |
            Dici l'ordine e il Ghermitore si ferma, e per un respiro intero ci
            credi davvero. Inclina la testa da un lato
            e ripete il suono più forte e più storto con la sua bocca di
            metallo, e il suono ti rimbomba dentro il cranio finché non vedi più
            niente. Quando ti si schiarisce la vista sei già sulla corda, a metà
            strada, con il naso che sanguina e una mano aperta dai denti
            d'acciaio. Il suono storto ti resta nel cranio fino a sera, e ogni
            tanto ti sembra di sentirlo anche nel rumore delle onde.
          effetti: { ferite: 1, tormento: 1 }
      - testo: "Strisciare fino allo scheletro quando si immerge"
        descrizione: "Prima o poi va sotto. La sporgenza è lunga quattro passi, e lui sente tutto quello che cade in acqua."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Quattro passi
          testo: |
            Aspetti che il Ghermitore si immerga e strisci sulla sporgenza a
            pancia in giù, con l'acqua che ti bagna i gomiti. Sfili la maschera
            da sotto il teschio piano, perché le ossa non facciano rumore, e
            torni indietro allo stesso modo, contando i passi a fior di labbra.
            Sei già sulla corda quando l'acqua si apre alle tue spalle e i denti
            d'acciaio si chiudono sul vuoto, con un rumore di cesoie.
          effetti: { oggetto.respiratore: 1, ghermitore: 1 }
        fallimento:
          titolo: L'osso di foca
          testo: |
            A metà della sporgenza il ginocchio fa rotolare un osso di foca
            nell'acqua, e l'acqua si apre subito. I denti d'acciaio ti si
            chiudono sull'avambraccio e ti tirano verso il bordo, e ti liberi
            soltanto lasciandoci la manica e un pezzo di pelle. Torni alla corda
            strisciando all'indietro e risali a forza di gomiti, lasciando sulla
            roccia una scia di sangue.
            Sotto di te il Ghermitore gira in tondo ancora per un pezzo, con la
            tua manica fra i denti come un trofeo, poi si immerge.
          effetti: { ferite: 2 }

  # ------------------------------------------------------------ il cuore · 1 → 2 · la tana di Borgoth (C6–C7)
  - id: borgoth-e-cenerascura
    immagine: personaggi/borgoth-il-gigante
    titolo: La tana di Borgoth
    sommario: "A cento passi dal ponte c'è una camera doppia con i rampicanti che pendono dal soffitto. Nel nido di ortiche dorme un gigante, e accanto a lui un puma color brace."
    luogo: Rovolungo, la tana di Borgoth
    area: rovolungo
    requisiti: [pista.capomozzo == 1, profondita.rovolungo >= 3]
    testo: |
      A cento passi dai pali del ponte, dove i rovi tornano a chiudersi sul
      bordo della scogliera, c'è un'ultima camera doppia. Dal soffitto di
      spine scende un groviglio di rampicanti, e ai viticci sono appesi
      scheletri di uccelli e mascelle di volpe che tintinnano quando passa
      l'aria. A sud c'è un grosso nido di ortiche, e dai topi mezzi mangiati
      che lo circondano si capisce che chi ci dorme ha l'abitudine di
      mangiare a letto.

      L'inquilino del nido è sveglio, e ti guarda. È un orco più alto di
      qualunque orco tu abbia mai visto, e a Fondobosco raccontano che sua
      madre fosse un'ogre. Ha la pelle spessa e venata di muschio, e fra le
      cicatrici gli crescono fili d'erba. Al collo porta denti e ossa infilati
      in uno spago. Accanto a lui, sdraiato, c'è un puma dal pelo color brace,
      che apre la bocca e lascia uscire un filo di vapore caldo.

      {addestrare-animali Media} Il puma tiene la coda ferma e le orecchie dritte, e non
      ti mostra i denti. Una bestia che non minaccia sta aspettando un
      ordine.

      «Borgoth sa perché sei qui» dice l'orco, e si alza piano, una mano
      sul ginocchio, con la fatica dei corpi molto grandi. «L'odore di
      Qir-Azel, Borgoth lo sente da tre stanze, e anche Cenerascura.»

      Alza le braccia e grida parole in una lingua che non è l'orchesco. Dalle
      cicatrici gli filtrano fiammelle dorate, e dalle spalle gli spuntano
      rami carbonizzati che si piegano all'indietro. Quando ha finito è alto
      quasi tre metri, con la pelle diventata corteccia nera, e il corpo per
      metà è fuoco e per metà sottobosco. Il caldo ti arriva in faccia, e le
      gambe vorrebbero tornare da sole nel tunnel.

      {resilienza Difficile fallita} Una parte di te, quella che di solito
      ragiona, si siede in un angolo della testa e si rifiuta di continuare
      finché qualcuno non spegne quel fuoco.

      {magia Media} Il fuoco che gli corre addosso è Mana selvatico, che la
      terra gli presta tutto in una volta. Durerà poco, e lui lo sa meglio
      di te.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Un gigante che brucia e un puma che salta prima che tu lo veda partire. Alle spalle hai soltanto rovi."
        combattimento: borgoth-e-cenerascura
        vittoria:
          titolo: In ginocchio
          testo: |
            Il puma ti arriva addosso per primo, e quando lo ricacci indietro
            con un taglio sul muso si ritira in un angolo della camera,
            soffiando. Borgoth è più lento. Il fuoco gli si spegne addosso un
            colpo alla volta, e quando cade in ginocchio fra le ortiche è di
            nuovo un orco grande e ansante, con il fumo che gli sale dalle
            spalle e l'erba bruciacchiata fra le cicatrici. Gli metti la lama
            alla gola, e lui ride piano, con un suono di ghiaia mossa.
          segue: borgoth-parla
        sconfitta:
          titolo: Le ortiche
          testo: |
            L'ultima cosa che vedi è il braccio di corteccia che cala, e poi le
            ortiche contro la faccia. Quando riapri gli occhi la camera è vuota
            e fredda, e del fuoco restano soltanto i segni neri sui rampicanti.
            Borgoth e il puma ti hanno lasciato vivo in mezzo alle ortiche, e
            le loro impronte vanno verso est, dalla parte di Fondobosco. Ti
            trascini fino al ponte con le costole che scricchiolano a ogni
            respiro.

            {resistenza Media} Hai almeno due costole incrinate, ma nessuna
            rotta. Il corpo te lo comunica a ogni respiro con molta precisione,
            perché tu non abbia dubbi.
          effetti: { pista.capomozzo: 1, tormento: 0.5 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Calmare il puma"
        descrizione: "Se il puma si accuccia, forse si ferma anche il gigante. Ci vogliono una mano ferma e una voce che non tremi."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Difficile }
        successo:
          titolo: Il puma accucciato
          testo: |
            Ti abbassi sui talloni e porgi al puma il dorso della mano, parlando
            piano, mentre il calore ti arriccia le sopracciglia. Il puma ti
            annusa a lungo e poi si stende fra te e il suo padrone, con il mento
            sulle zampe. Borgoth abbassa le braccia. Il fuoco gli si ritira
            sotto la pelle con un sibilo, e resta un orco grande, che guarda il
            suo puma come se lo avesse tradito, mentre il puma, sotto quello
            sguardo, sbadiglia.
          pe: { addestrare-animali: 5 }
          segue: borgoth-parla
        fallimento:
          titolo: La zampata
          testo: |
            Il puma ti annusa la mano e poi la prende fra i denti, e mentre cerchi
            di liberarti ti apre la spalla con una zampata. Borgoth fischia una
            volta. Il puma ti lascia e corre da lui, e il gigante di fuoco ti
            guarda a lungo dall'alto. Poi si gira e sparisce nei tunnel verso
            est. Resti fra le ortiche a tamponarti la spalla con la manica, e
            le ortiche, per completare il lavoro, ti bruciano le caviglie.
            Quando la manica è zuppa ti alzi e vai verso il ponte.
          effetti: { ferite: 2, pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Chiamare il puma con il Richiamo"
        descrizione: "Il puma è una bestia, anche se gli esce il fumo dalla bocca. Il Circolo ha una parola anche per lui, e dovrà valere più della voce del suo padrone."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La parola del Circolo
          testo: |
            Dici la parola del Richiamo, e il puma si ferma a metà del salto e
            atterra di fianco, scrollando la testa. Lo chiami ancora, e lui
            viene a strusciarsi contro le tue gambe con un rumore di brace che si
            spegne. Ha il pelo caldo come una pietra lasciata al sole. Borgoth
            guarda prima il suo puma e poi te, e abbassa le braccia. Il fuoco
            gli si ritira sotto la pelle, e resta un orco grande e offeso, con
            il fumo che gli esce dalle spalle.
          segue: borgoth-parla
        fallimento:
          titolo: La parola storta
          testo: |
            La parola ti esce storta, e il puma la prende per una sfida. Ti salta
            addosso e ti butta a terra, e senti il suo fiato caldo sulla faccia
            prima che Borgoth lo richiami con un fischio. Il gigante ti scavalca
            senza degnarti di uno sguardo e se ne va nei tunnel verso est, con il
            puma alle calcagna. Ti rialzi con il petto rigato di graffi fino
            alla cintura, e cominci a camminare verso il ponte tenendoti la
            camicia premuta addosso e ripassando la parola giusta, che adesso
            ti viene perfetta.
          effetti: { ferite: 2, pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Parlargli di Balthog"
        descrizione: "Borgoth è di Fondobosco, e questa non è la sua tribù. Forse Balthog non piace nemmeno a lui. Intanto però brucia, e tu vieni da Qir-Azel."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Difficile }
        successo:
          titolo: Lo sputo
          testo: |
            Gli dici che sei venuto per Balthog e per chi gli dà gli ordini, e
            che con Fondobosco non hai niente da spartire. Borgoth resta fermo,
            con le fiamme che gli corrono sulle braccia. Poi sputa per terra, e
            lo sputo sfrigola.

            {empatia Media} Il nome di Balthog l'ha colpito più della tua
            lama. C'è un rancore vecchio, lì sotto, che aspettava soltanto
            qualcuno a cui raccontarsi.

            Il fuoco gli si ritira sotto la pelle un poco alla volta, e resta
            un orco grande che si siede su una radice e fa cenno al puma di
            stare giù.
          pe: { persuasione: 5 }
          segue: borgoth-parla
        fallimento:
          titolo: Il dorso della mano
          testo: |
            Gli dici che sei venuto per Balthog, e Borgoth ride. Poi ti colpisce
            con il dorso della mano, senza nemmeno chiudere il pugno, e ti manda
            a sbattere contro il muro di spine.

            «Borgoth non parla con chi viene da Qir-Azel» dice, e se ne va nei
            tunnel verso est con il puma.

            Hai la guancia gonfia e un dente che si muove, e la lingua continua
            a tornarci sopra per controllare. Ci metti un pezzo a staccarti le
            spine dalla schiena. Poi prendi la strada del ponte.
          effetti: { ferite: 2, pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Farti da parte e lasciarli passare"
        descrizione: "Non sei venuto per lui, e Borgoth non è un orco di Capomozzo. Forse non ha voglia di bruciare per Balthog."
        esito:
          titolo: Verso Fondobosco
          testo: |
            Ti sposti contro la parete con le mani lontane dalla cintura e lasci
            libero il passaggio. Borgoth ti guarda a lungo, con il fuoco che gli
            scorre sulle braccia. Poi grugnisce, abbassa la testa sotto i
            rampicanti e se ne va nel tunnel verso est, e il puma gli trotta
            dietro voltandosi due volte. Lo senti allontanarsi fra i rovi per un
            pezzo, con le ossa d'uccello che tintinnano al suo passaggio. Ti
            accorgi soltanto adesso di avere la schiena fradicia. Quando non
            senti più niente prendi la strada del ponte.
          effetti: { pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo

  - id: borgoth-parla
    immagine: personaggi/borgoth-il-gigante
    titolo: Borgoth parla
    tipo: seguito
    luogo: Rovolungo, la tana di Borgoth
    area: rovolungo
    requisiti: [pista.capomozzo == 1]
    testo: |
      Borgoth siede fra le ortiche con le mani aperte sulle ginocchia, e dalle
      spalle gli sale ancora un filo di fumo. Da vicino ha un odore di terra
      bagnata e di resina, e sotto c'è il pelo bruciato. Il puma è accucciato
      a qualche passo, con le orecchie basse, e non ti stacca gli occhi di
      dosso. Ogni tanto si lecca una zampa e la rimette giù, sempre la
      stessa, come per ricordarsi che è ancora lì.

      «Borgoth sa perché sei qui. Per quello che gli orchi hanno fatto a
      Qir-Azel» dice, e sputa per terra. «È colpa della *Mawrak'Thur* e
      delle sue macchine che camminano.»

      Si gratta il muschio sul petto. «Il Capotribù Balthog adesso ascolta
      lei. È una donna molto arrabbiata, con i capelli d'argento e gli occhi
      strani, e una cicatrice che le taglia la pancia. Borgoth pensa che il Capotribù
      Balthog se ne sia innamorato, perché fa tutto quello che lei dice. È
      stata lei a volere l'attacco a Qir-Azel.» Batte il pugno sul terreno.
      «Allora Borgoth si è tenuto lontano dal Capotribù Balthog e dai suoi
      amici nuovi, perché quella donna porta guai a tutta la stirpe degli
      orchi.»

      {politica-ed-economia Media} Un capo che fa tutto quello che dice una
      forestiera ha cambiato padrone senza dirlo alla tribù.
      Chi resta fuori dal nuovo giro, come Borgoth, è il primo a parlare.

      {empatia Facile} Dice sempre il titolo intero, Capotribù Balthog, anche
      con la bocca piena di rabbia. È l'abitudine di uno che ci teneva.

      *I ritratti di Isvaro avevano i capelli chiari e una mano posata sul
      ventre.* Borgoth ti guarda di sotto in su, e aspetta la domanda
      successiva.
    opzioni:
      - testo: "Chiedergli chi c'è con lei"
        descrizione: "Ha detto amici nuovi. Gli amici si possono contare."
        costo: 0
        esito:
          titolo: Le dita
          testo: |
            Borgoth mostra i denti in un ghigno storto perché la domanda gli
            piace, e alza la mano con le dita chiuse. Sulle nocche ha ancora qualche
            scaglia di corteccia nera, che gli cade sulle ginocchia mentre apre
            il primo dito. Il puma alza la testa al rumore e la riabbassa, deluso
            che non sia niente da mangiare. Ti accorgi che anche tu stai
            contando, piegando le dita contro la coscia senza volerlo.
          segue: borgoth-e-gli-alleati
      - testo: "Chiedergli di Balthog"
        descrizione: "Il capo di Capomozzo. Borgoth lo chiama sempre con il titolo intero."
        costo: 0
        esito:
          titolo: Gli sciamani a pescare
          testo: |
            «Il Capotribù Balthog non ha mai perso» dice Borgoth, e si stacca
            una scaglia di corteccia dal polso. «Combatte con
            le mani, e non ha una cicatrice. Prima ascoltava gli sciamani di
            Capomozzo. Adesso ascolta la donna, e gli sciamani li ha mandati a
            pescare.»

            {intimidire Media} Un capo che non ha una cicatrice non ha mai
            avuto bisogno di difendersi da vicino. O nessuno è mai arrivato
            abbastanza vicino da provarci.

            Ci pensa sopra grattandosi il mento, dove il muschio è più fitto, e
            poi alza la mano con le dita chiuse. «Però la donna non è sola.»
          segue: borgoth-e-gli-alleati

  - id: borgoth-e-gli-alleati
    immagine: personaggi/borgoth-il-gigante
    titolo: Gli amici nuovi
    tipo: seguito
    luogo: Rovolungo, la tana di Borgoth
    area: rovolungo
    requisiti: [pista.capomozzo == 1]
    testo: |
      «Non è finita» dice Borgoth, e apre un dito alla volta. «Con la donna
      ci sono altri quattro. Zagrath il predone, che ha la madre ogre come
      Borgoth e nient'altro come Borgoth. Un uomo che non parla mai e gira
      chiuso in un'armatura pesante. Una donna con la pelle ambrata, che ha
      bruciato con il fuoco gli orchi che le andavano troppo vicino. Poi un
      mezzelfo che ride sempre e tira con l'arco meglio di un orco.» Abbassa la
      mano e se la pulisce sul ginocchio, come dopo aver mangiato. «E una
      trentina di fedeli suoi, che dicono di essere del Culto dell'Anonimo e
      che lei è la loro capa.»

      {empatia Difficile} Sul Culto abbassa la voce, lui che non l'ha
      abbassata nemmeno mentre bruciava. Per Balthog prova rancore, e per
      quei trenta qualcosa che somiglia molto alla paura.

      {armi-da-distanza Media fallita} Un mezzelfo che tira meglio di un
      orco. Provi a ricordare quanto bene tiri un orco per cominciare, e non
      trovi una risposta che ti consoli.

      *Il mezzelfo che ride l'hai visto alla fornace, con una bottiglia
      accanto al gomito.* Borgoth intanto ha ricominciato a ghignare, e si
      passa la lingua sulle zanne prima di continuare.

      «Il mezzelfo e la donna, Borgoth li ha visti nel bosco fare come i
      ratti. Quando lo ha detto al Capotribù Balthog, per tornare nelle sue
      grazie, il Capotribù Balthog ha cacciato via Borgoth.» Sputa ancora per
      terra, e poi ti guarda dritto con gli occhi gialli come l'ambra.

      «Borgoth è pronto, ed è fiero guerriero della tribù di Fondobosco.
      Tornerà alla terra, a cui tutto appartiene» dice, e resta ad aspettare
      con le mani aperte sulle ginocchia. Il puma gli appoggia il muso contro
      il fianco, e lui lo lascia fare senza guardarlo.
    opzioni:
      - testo: "Lasciarlo legato"
        descrizione: "Con i suoi stessi rampicanti, stretti. Se si libera, sarà dopo che hai passato il ponte."
        esito:
          titolo: I rampicanti
          testo: |
            Gli leghi i polsi dietro la schiena con i rampicanti più grossi, e
            poi le caviglie, e Borgoth ti lascia fare guardando il soffitto.
            Quando stringi l'ultimo nodo ride piano.

            «Le radici si slegano» dice. «Ma Borgoth aspetta.»

            {natura Facile} Sono rampicanti verdi, pieni d'acqua. Tengono finché
            restano freschi. Fra qualche giorno, seccando, cederanno da soli.

            Il puma ti segue con gli occhi fino all'uscita, accucciato accanto
            al suo padrone. Fuori il vento del mare ti asciuga il sudore sulla
            fronte, e il ponte è a cento passi.
          effetti: { pista.capomozzo: 1 }
          imposta: { borgoth: 2 }
          vai: capomozzo
      - testo: "Finirlo"
        descrizione: "Ha detto quello che sapeva, e ha detto anche di essere pronto."
        esito:
          titolo: Alla terra
          testo: |
            Borgoth chiude gli occhi prima che tu ti muova, e non li riapre più.
            Quando è finita il puma esce dall'angolo e gli si stende accanto, con
            il muso sul suo petto, e non si sposta nemmeno quando gli passi
            vicino. Ti pulisci la lama su un ciuffo d'erba e resti un momento a
            guardarli. La lama è pulita, e le mani continuano a sentirla sporca.
            Poi vai verso il ponte, e il tintinnio delle ossa d'uccello lo senti
            fino all'uscita.
          effetti: { pista.capomozzo: 1, tormento: 0.5 }
          imposta: { borgoth: 1 }
          vai: capomozzo
      - testo: "Lasciarlo andare"
        descrizione: "È un orco di Fondobosco, e con Balthog ha chiuso da tempo. La strada per casa sua è lunga."
        esito:
          titolo: Verso est
          testo: |
            Gli dici di andarsene, e Borgoth ti guarda come se non avesse capito.
            Poi si alza piano e fischia al puma. Sulla soglia del tunnel si
            ferma.

            «Il ponte cade sotto chi corre» dice senza voltarsi. «Borgoth lo ha
            visto cadere sotto due orchi di Capomozzo, e ha riso.»

            Lo senti allontanarsi fra i rovi verso est, con il puma che gli
            trotta dietro, finché il vento del mare copre il rumore dei passi.
            Ti resta in mente la sua risata, e il fatto che due orchi, per lui,
            fossero un buon motivo per ridere.
          effetti: { pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
