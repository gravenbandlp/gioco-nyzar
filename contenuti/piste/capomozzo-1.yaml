# Capomozzo, prima parte (pista.capomozzo 0 → 2): Galdrick alla Caserma e la strada per la costa, la
# spedizione nel Rovolungo (C1–C9 del verbale) e il cuore nella tana di Borgoth (C6–C7).
#
# - `la-strada-per-capomozzo` (0 → 1): Galdrick, tornato da Ghoran da pochi giorni, mette in fila quello che sai e ti
#   manda a Rovolungo. A piedi, a cavallo (chiave.cavalcatura, un rintocco in meno) o con una guida.
# - `tornare-a-rovolungo` (pista 1, ripetibile): il rientro dalla Caserma dopo una ritirata.
# - area `rovolungo`: sette stanze ripetibili, in ordine secondo la profondità: 0 l'entrata nascosta nel muro
#   di spine, 1 dentro i tunnel (il tunnel di cardi, il Buco Ululante, il nido dei profughi o le cucce), 2 sulla
#   scogliera (i posti di guardia o il ponte di corda). Una stanza superata non ricompare nella stessa visita
#   (src/motore/spedizioni.ts). La grotta del Ghermitore sotto il Buco (facoltativa, si chiude quando prendi il
#   respiratore) si apre dopo che in questa visita sei passato dal Buco (rovolungo.buco), e il cuore
#   `borgoth-e-cenerascura`, a cento passi dal ponte, si apre a profondità 3.
# - Il cuore porta a due seguiti con le parole di Borgoth (`borgoth-parla`, `borgoth-e-gli-alleati`) se lo
#   vinci o lo calmi; negli altri rami se ne va verso Fondobosco. In ogni ramo `borgoth` (1 morto, 2 legato
#   e interrogato, 3 andato via), pista.capomozzo 2 e `vai: capomozzo`.
quality:
  - { id: rovolungo.buco, nome: Hai visto il Buco Ululante, categoria: stato, nascosta: true, descrizione: "1 se in questa visita sei passato dal Buco Ululante, e allora si apre la grotta del Ghermitore. L'entrata nascosta lo azzera." }

aree:
  - id: rovolungo
    immagine: ambientazione/rovolungo
    nome: Rovolungo
    sommario: "Rovi sulla costa nord che gli orchi hanno scavato fino al ponte per Capomozzo."
    spedizione: { ritorno: superficie-fratturata, soglia: 3, stanze: 3 }
    testo: |
      Dopo le colline il sentiero piega a nord, incontro al vento del mare, e
      gli alberi crescono tutti storti verso l'interno. Poi finiscono, e
      comincia il Rovolungo, un muro di rovi e di cardi alto come una casa,
      con spine lunghe un dito bagnate di nebbia, che corre lungo la costa
      fin dove arriva lo sguardo. Dietro senti le onde rompersi sugli scogli.

      Fra le spine del primo rovo è impigliato un galleggiante da rete di
      vetro verde, con dentro una lumaca diventata troppo grossa per uscire.

storylet:
  # ------------------------------------------------------------ 0 → 1 · Galdrick alla Caserma
  - id: la-strada-per-capomozzo
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: La strada per Capomozzo
    sommario: "Galdrick è tornato da Ghoran con trenta mercenari, e sul suo tavolo ci sono le tue carte in fila."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo
    area: quartieri-alti
    requisiti: [pista.acciaio >= 8, pista.sepolcro >= 7, pista.capomozzo == 0]
    testo: |
      Galdrick è tornato da Ghoran con gli stivali grigi di fango e la barba di una
      settimana. Nel cortile, sotto la finestra, una trentina di mercenari cotti dal
      sole litiga con il furiere per le brande.

      {origine fuggiasco-di-ghoran} Dal cortile sale la lingua dei clan, e la schiena la
      riconosce prima delle orecchie.

      {origine rampollo-dei-quartieri-alti} Nei salotti dei Quartieri Alti ci si
      chiedeva chi avesse firmato la paga di quei trenta, e la risposta ce l'hai
      davanti.

      Sul tavolo ci sono il rapporto sulla cripta di Sollen e il diario di Isvaro. «Ho
      messo in fila quello che mi hai portato» dice. «Dalla Biblioteca è sparita ogni
      riga su Capomozzo, e il mezzelfo se ne vanta. La sua donna, Aurenne, tiene in
      pugno gli orchi e cerca un Costruttore sotto la fortezza, e nelle mappe gli orchi
      sono quattrocento.»

      Batte un dito sulla costa nord, dove Capomozzo è una macchia d'inchiostro nel
      mare. «Le trenta lance mi servono sulle mura, e una squadra la vedono arrivare da
      un giorno di distanza, una persona sola forse no. Voglio sapere cosa c'è su
      quell'isola prima che quelli dell'isola vengano da noi.»

      {empatia Media} Mentre parla conta con gli occhi i mercenari in cortile, quanti ne
      tornerebbero dall'isola. Il conto gli è venuto male, e allora ha pensato a te.
    opzioni:
      - testo: "Partire a piedi"
        descrizione: "Due giorni e mezzo di strada verso nord, con le razioni della Caserma nello zaino."
        esito:
          titolo: Due giorni e mezzo
          testo: |
            Il furiere ti riempie lo zaino di gallette e ti fa firmare una
            ricevuta per ogni galletta. Esci dalla porta nord all'alba e cammini
            due giorni fra colline sempre più spoglie, dormendo con la schiena
            contro una roccia. La mattina del terzo giorno il vento sa di sale, e
            a mezzogiorno, con le vesciche ai talloni, hai davanti il muro di
            spine del Rovolungo.
          effetti: { pista.capomozzo: 1 }
          vai: rovolungo
      - testo: "Partire a cavallo"
        descrizione: "In sella la costa è più vicina, e alle vesciche ci pensa il cavallo."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: In sella
          testo: |
            Il cavallo prende la strada del nord al trotto, e le colline scorrono
            senza che le gambe se ne accorgano. Dormi una notte sola all'aperto,
            con le redini legate al polso, e a metà del secondo giorno l'aria
            diventa salmastra. Leghi il cavallo a un pino storto lontano dai rovi,
            e mentre ti allontani lui ti guarda masticando, già pentito di averti
            portato fin qui.
          effetti: { pista.capomozzo: 1 }
          vai: rovolungo
      - testo: "Farti accompagnare da una guida"
        descrizione: "Una dei mercenari di Ghoran cacciava foche su quella costa. Vuole il suo prezzo, e conosce le scorciatoie."
        requisiti: [monete >= 20]
        esito:
          titolo: Hagra
          testo: |
            Si chiama Hagra, ha la faccia segnata da tre righe di argilla secca e
            mastica resina. Conta le monete due volte e ti porta per sentieri da
            capre che sulla carta non ci sono.

            «Ai rovi ti lascio, eh» dice il terzo giorno. «Gli orchi li lascio a
            te.» Quando ti volti, al muro di spine, lei è già un puntino sulla
            collina.
          effetti: { monete: -20, ferite: -0.5, pista.capomozzo: 1 }
          vai: rovolungo
      - testo: "Parlare a Hagra nella lingua dei clan"
        descrizione: "Una dei mercenari cacciava foche su quella costa, e parla come si parlava fuori dai recinti di Ghoran."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Hagra
          testo: |
            Hagra ha tre righe di argilla secca sulla faccia e mastica resina, ma
            quando le parli nella lingua dei clan smette di masticare e ti guarda i
            polsi segnati dai ferri.

            «Da uno scappato dalla bilancia la paga non si prende, eh» dice, e sputa
            la resina vicino al tuo stivale, un onore. Ti porta per sentieri da capre
            fino al muro di spine.
          effetti: { ferite: -0.5, pista.capomozzo: 1 }
          vai: rovolungo

  # ------------------------------------------------------------ 1 · rientrare dopo una ritirata
  - id: tornare-a-rovolungo
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/rovolungo
    titolo: Di nuovo verso Rovolungo
    sommario: "Il ponte per Capomozzo è ancora là oltre i rovi, e il furiere ti riempie di nuovo lo zaino."
    luogo: Guarnigione di Qir-Azel, il cortile
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.capomozzo == 1]
    testo: |
      Nel cortile della Caserma i mercenari di Ghoran hanno imparato a mettersi
      in fila per il rancio, e quelli che non ci riescono pelano patate sotto il
      portico. Galdrick ti vede dalla finestra e non scende, alza soltanto due
      dita, e capisci che ti chiede se sull'isola sono ancora tutti al loro
      posto. Il furiere ti riempie lo zaino di gallette senza farti firmare
      niente, che alla Caserma è quanto di più vicino a un incoraggiamento.

      {origine figlio-della-citta-bassa} Nei vicoli, quando la Caserma ti dà
      qualcosa senza ricevuta, si comincia subito a contare quanto costerà dopo.
    opzioni:
      - testo: "Ripartire a piedi"
        descrizione: "Le stesse colline e lo stesso vento, e le vesciche dove le avevi."
        esito:
          titolo: Di nuovo al muro di spine
          testo: |
            Due giorni e mezzo di colline e di vento, e le vesciche si riaprono
            negli stessi punti. Il muro di spine è grigio di nebbia come lo hai
            lasciato, e al primo rovo il galleggiante di vetro verde tiene ancora
            la sua lumaca, un po' più grossa e un po' più rassegnata.
          vai: rovolungo
      - testo: "Ripartire a cavallo"
        descrizione: "Il cavallo la strada se la ricorda meglio di te."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Al trotto
          testo: |
            Il cavallo riconosce la strada e a ogni bivio tira dalla parte giusta. Dopo una
            notte sotto un pino, a metà del secondo giorno sei davanti al muro di spine. Lo
            leghi allo stesso pino storto della prima volta, e lui si mette a brucare con la
            soddisfazione di un cliente abituale.
          vai: rovolungo

  # ------------------------------------------------------------ le stanze (ripetibili, in ordine di profondità)
  # 0 · l'entrata nascosta
  - id: rovolungo-entrata-nascosta
    immagine: ambientazione/rovolungo
    titolo: L'entrata nascosta
    sommario: "Vicino alla riva i rovi sono più fitti, e le impronte degli orchi finiscono contro il muro di spine."
    luogo: Rovolungo, vicino alla riva
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 0]
    testo: |
      Vicino alla riva i cardi crescono fra i rovi fino a sei metri. Ai piedi
      del muro le impronte degli orchi si affollano in un punto e spariscono,
      come se fossero entrati nei rovi senza scostarli. Accanto ci sono un
      mucchietto di piume di gabbiano e un osso spolpato, i resti di molte ore
      di guardia, e a una decina di passi una macchia di ginestre.

      {percezione Media} Le piume sono divise in due mucchietti, le bianche da
      una parte e le grigie dall'altra.
    opzioni:
      - testo: "Cercare il passaggio"
        descrizione: "Gli orchi entrano da qualche parte, e di sicuro non si aprono la strada con i denti."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La stuoia
          testo: |
            Passi le dita lungo il muro una spanna alla volta, finché un pezzo di
            roveto ti si muove sotto la mano più leggero del resto. È una stuoia
            di rovi intrecciati e legati con spago di budello, fatta così bene che
            a due passi non la distingui. La sollevi, e sotto si apre un tunnel
            alto due metri, con il pavimento di terra battuta.
          effetti: { profondita.rovolungo: 1 }
          imposta: { rovolungo.buco: 0 }
        fallimento:
          titolo: Le spine
          testo: |
            Tasti alla cieca nei rovi dove finiscono le impronte, e le spine
            bagnate entrano nella carne con una facilità che ti sorprende. Ritiri
            le mani rigate di sangue, con una spina spezzata sotto l'unghia del
            pollice che ti togli con i denti, seduto nell'erba.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che passi un orco"
        descrizione: "Prima o poi qualcuno esce, o rientra. Basta stare dove non guarda."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il secchio di vongole
          testo: |
            Ti acquatti dietro le ginestre e aspetti. Dopo un'ora dal muro esce un
            orco con un secchio, solleva un pezzo di roveto con una mano sola e va
            verso gli scogli brontolando. Torna con il secchio pieno di vongole e
            rientra dallo stesso punto senza guardarsi intorno. Conti fino a
            cento, poi sollevi il roveto anche tu.
          effetti: { profondita.rovolungo: 1 }
          imposta: { rovolungo.buco: 0 }
        fallimento:
          titolo: La ginestra
          testo: |
            Ti acquatti dietro le ginestre, e il cespuglio è pieno di api. Quando
            scappi agitando le braccia, l'orco con il secchio che stava uscendo
            dal muro ti guarda passare a bocca aperta, poi corre dentro a chiamare
            gli altri. Aspetti fra i pini che le voci si calmino, con la faccia
            gonfia di punture.
          effetti: { ferite: 0.5 }
      - testo: "Dare fuoco ai rovi"
        descrizione: "Le spine sono secche in cima. Più in basso un po' meno."
        esito:
          titolo: Il fumo
          testo: |
            Accendi un ciuffo d'erba secca e lo spingi fra i rovi, ma i rovi
            bagnati di nebbia fanno soltanto un fumo bianco che sale dritto sopra
            il roveto, e dall'altra parte qualcuno comincia a gridare in orchesco.
            Spegni tutto a calci e resti nascosto fra i pini fino a sera, con gli
            occhi che lacrimano e l'odore di una salsiccia dimenticata sul fuoco.
          effetti: { tormento: 1 }
      - testo: "Tagliarti un varco con il coltello"
        descrizione: "Spina per spina, a forza di polso. Il roveto è largo, e il coltello è corto."
        costo: 2
        esito:
          titolo: A forza di polso
          testo: |
            Tagli un ramo alla volta con la manica avvolta intorno alla mano, e il
            roveto si richiude dietro di te quasi alla stessa velocità. Dopo
            un'ora sbuchi in un tunnel di terra battuta alto due metri, con le
            braccia graffiate fino ai gomiti e il coltello che ha perso il filo.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }
          imposta: { rovolungo.buco: 0 }

  # 1 · dentro i tunnel
  - id: rovolungo-tunnel-di-cardi
    immagine: ambientazione/rovolungo
    titolo: Il tunnel di cardi
    sommario: "Un tunnel nei rovi dove si cammina piegati, con un solco largo lasciato da qualcosa di grosso trascinato da poco."
    luogo: Rovolungo, i tunnel
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 1]
    testo: |
      Il tunnel serpeggia fra rovi e ortiche, alto quanto basta a un orco
      che cammini curvo, con una luce verdastra che filtra dal soffitto di
      spine. Sul terriccio battuto le impronte sono quasi tutte di piedi
      nudi, e in mezzo corre un solco liscio, largo un braccio. Su una spina
      all'altezza del ginocchio è impigliato un ciuffo di crini neri con un
      riflesso verde.

      {cavalcare Media} Crini di coda da cavallo da tiro, e nessun cavallo
      entra da solo in un buco dove tu cammini piegato.
    opzioni:
      - testo: "Leggere il solco"
        descrizione: "Una cosa trascinata lascia segni diversi da una cosa che cammina."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La slitta
          testo: |
            Ai bordi del solco ci sono i segni di due stanghe di legno, e in mezzo
            un pelo lungo e nero da coda di cavallo, ma di zoccoli nemmeno uno.
            *Chi si porta un cavallo svenuto attraverso un roveto ha in mente
            qualcosa di preciso.* Qualche giorno fa qui è passato su una slitta di
            rami un cavallo grande e privo di sensi, trascinato verso il mare.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: Le ortiche
          testo: |
            Ti abbassi sul solco e perdi l'equilibrio, e la mano che metti avanti
            finisce in un cespo di ortiche. Ti succhi le dita imprecando in tutte
            le lingue che conosci, e quando torni a guardare il solco ti sembra un
            solco qualunque.
          effetti: { ferite: 0.5 }
      - testo: "Andare avanti carponi, senza rumore"
        descrizione: "Più in basso il tunnel è più largo, e le voci arrivano prima dei piedi."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Carponi
          testo: |
            Avanzi carponi sulla terra battuta, che a quest'altezza è fresca e
            odora di funghi. Alla seconda curva senti due orchi nel tunnel
            accanto, a un palmo di spine da te, e resti fermo finché non si
            allontanano ridendo per una storia sporca. Riparti con le ginocchia
            impolverate e una lumaca schiacciata sul palmo.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: Il ramo secco
          testo: |
            Il ginocchio spezza un ramo secco con uno schiocco netto. Dal tunnel accanto
            una voce gutturale fa una domanda, e una lancia entra fra le spine a una
            spanna dalla tua spalla, poi si ritira con un filo del tuo mantello e ti
            lascia un graffio lungo il braccio. Dall'altra parte qualcuno brontola che
            sono stati i topi, e l'altro gli dà ragione per non alzarsi.
          effetti: { ferite: 0.5 }
      - testo: "Tirare dritto, piegato in due"
        descrizione: "Il tunnel finisce da qualche parte. Intanto la schiena si arrangia."
        costo: 2
        esito:
          titolo: La schiena
          testo: |
            Avanzi piegato in due per un tempo lunghissimo, con le spine che ti si
            impigliano nei capelli. Quando il tunnel si allarga e puoi
            raddrizzarti, la schiena fa un rumore che non le avevi mai sentito
            fare, e resti un po' con le mani sui fianchi ad aspettare che le
            vertebre tornino al loro posto.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }

  - id: rovolungo-buco-ululante
    immagine: ambientazione/rovolungo
    titolo: Il Buco Ululante
    sommario: "Tre tunnel finiscono in una sala di rovi, dove da un buco nel terreno sale il rumore del mare."
    luogo: Rovolungo, il Buco Ululante
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 1]
    testo: |
      Tre tunnel di cardi sbucano in una caverna di rovi. A ovest si apre un
      buco largo quanto un pozzo, e ne sale il vento del mare con un ululato a
      ogni onda. Sull'orlo, in un cerchio di sassi, un gabbiano morto è legato
      a un paletto con un pezzo di rete; accanto, un secondo paletto ha la
      rete vuota.

      {natura Media} Un gabbiano legato sopra il mare è un'esca o un'offerta,
      e il paletto vuoto dice che là sotto qualcosa l'ha già accettata.
    opzioni:
      - testo: "Scegliere il tunnel giusto"
        descrizione: "Da qui partono tre strade, e una sola va verso il mare."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il solco
          testo: |
            Giri la sala chinato sul terreno. Due tunnel hanno soltanto impronte
            vecchie, mentre nel terzo corre verso il mare il solco pulito di una
            slitta, con gocce di resina cadute dalle torce, ancora morbide sotto
            l'unghia. Lo imbocchi con il vento del buco alle spalle.
          effetti: { profondita.rovolungo: 1 }
          imposta: { rovolungo.buco: 1 }
        fallimento:
          titolo: Il giro largo
          testo: |
            Scegli il tunnel con più impronte, e dopo un'ora esatta ti riporta
            nella sala del buco dall'altra parte. È il giro delle guardie, con
            tanto di nicchia per pisciare che riconosci dall'odore molto prima di
            vederla.
          effetti: { tormento: 1 }
          imposta: { rovolungo.buco: 1 }
      - testo: "Calarti nel buco per guardare giù"
        descrizione: "La parete del pozzo è di roccia, con qualche appiglio. Bastano pochi metri."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La grotta
          testo: |
            Scendi puntando schiena e piedi, finché il pozzo si apre sopra una
            grotta di mare. Venti metri più sotto vedi ossa e un luccichio di
            metallo su una sporgenza appena sopra le onde, e nell'acqua gira in
            tondo una cosa grossa e lucida.

            {tecnologia Difficile} Nuota con un ritmo troppo regolare per una
            bestia, come un ingranaggio che nessuno ha fermato.
          effetti: { profondita.rovolungo: 1 }
          imposta: { rovolungo.buco: 1 }
        fallimento:
          titolo: L'appiglio
          testo: |
            Un appiglio ti resta in mano e scivoli per due metri con la schiena
            contro la roccia, prima che il piede trovi una sporgenza. Resti appeso
            sopra il buio, con il rumore dell'acqua sempre più forte, e quando
            riesci a risalire hai la camicia strappata e la schiena scorticata.
          effetti: { ferite: 0.5 }
          imposta: { rovolungo.buco: 1 }
      - testo: "Passare oltre senza guardare il buco"
        descrizione: "Lungo la parete opposta, con gli occhi sui piedi."
        costo: 2
        esito:
          titolo: Il colpo di metallo
          testo: |
            Attraversi la sala contro la parete opposta, con gli occhi sui piedi e le spalle
            che salgono verso le orecchie a ogni ululato. A metà ti sembra di sentire dal buco
            un colpo di metallo contro la roccia. Ti dici che sarà stata una catena, e non ti
            volti fino al tunnel.
          effetti: { profondita.rovolungo: 1, tormento: 1 }
          imposta: { rovolungo.buco: 1 }

  - id: rovolungo-nido-dei-profughi
    immagine: bestiario/orco
    titolo: Il nido dei profughi
    sommario: "Una camera bassa e fumosa, dove una decina di orchi magri con le piume nei capelli litiga intorno al fuoco."
    luogo: Rovolungo, il nido dei profughi
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 1]
    testo: |
      La camera è rotonda e bassa, con il fumo che ristagna a mezz'aria sopra
      la fossa del fuoco. Sui giacigli di felci lungo le pareti c'è una decina
      di orchi magri con piume d'uccello intrecciate nei capelli. *Spiumatori,
      la tribù del Gradone Rosso.* Due litigano per un gabbiano crudo, e un
      altro intreccia una piuma nella treccia di una ragazza orca. Le lance
      sono tutte appoggiate al muro, a portata di mano.

      {origine fuggiasco-di-ghoran} Li pesi a occhio, come a Ghoran davanti
      alla bilancia, e ti vergogni del numero.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Sono tanti e affamati, e anche stanchi. Le lance stanno al muro."
        combattimento: nido-dei-profughi
        vittoria:
          titolo: Il gabbiano
          testo: |
            Il primo che ti arriva addosso ha la lancia girata al contrario, e
            quando due sono a terra il resto scappa nei tunnel lasciando il
            gabbiano in mezzo alla camera. Resta soltanto la ragazza con la
            treccia, seduta sul giaciglio, che ti guarda senza muoversi finché non
            sei uscito dall'altra parte.
          effetti: { profondita.rovolungo: 1 }
        sconfitta:
          titolo: Nel fumo
          testo: |
            Nel fumo non capisci da dove arrivano. Una lancia ti prende di
            striscio sul fianco, un manico ti batte sulla nuca, e ti ritrovi
            carponi nel tunnel mentre loro ti tirano dietro le ossa del gabbiano.
            Nessuno ti insegue, perché hanno più paura di quello che c'è oltre il
            ponte che di te.
      - testo: "Parlare con loro"
        descrizione: "Hanno lasciato la loro tribù e hanno paura di Balthog. Chi ha paura, a volte, ha voglia di raccontarla."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Quelli che passano il ponte
          testo: |
            Ti siedi vicino al fuoco, e un vecchio con mezzo orecchio comincia a
            parlare in un comune storpiato. Dopo la razzia sono scesi dal Gradone
            a chiedere asilo a Balthog; ogni tre o quattro notti gli orchi di
            Capomozzo ne portano via due oltre il ponte, dalla *Mawrak'Thur*, e
            quelli non tornano. «Eravamo venti, adesso siamo dieci» dice, e con lo
            stesso tono ti chiede se hai del pane.
          effetti: { profondita.rovolungo: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il pane
          testo: |
            Il vecchio con mezzo orecchio ti chiede se hai del pane. Quando dici
            di no, la ragazza con la treccia prende una lancia dal muro, e gli
            altri la imitano. Esci all'indietro con una punta che ti segue fino al
            tunnel e lì ti punge la coscia, una volta sola, per avvertimento.
          effetti: { ferite: 0.5 }
      - testo: "Dare loro le tue razioni"
        descrizione: "Le gallette della Caserma e la carne secca. La strada del ritorno la farai con la cintura stretta."
        costo: 2
        esito:
          titolo: Dieci parti uguali
          testo: |
            Svuoti lo zaino sul pavimento e ti tiri indietro. Il vecchio con mezzo
            orecchio divide le gallette in dieci parti uguali con un coltello di
            selce e ti fa cenno di passare, mentre la ragazza con la treccia
            nasconde metà della sua sotto le felci. I giorni dopo li cammini con
            la cintura stretta di due buchi.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }

  - id: rovolungo-cucce-dei-cinghiali
    immagine: bestiario/cinghiale-crudele-mutato
    titolo: Le cucce dei cinghiali
    sommario: "Quattro cinghiali da guerra incatenati ai pali, e un passaggio stretto in mezzo. Le catene sono lunghe quasi abbastanza."
    luogo: Rovolungo, le cucce dei cinghiali
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 1]
    testo: |
      La stanza puzza di stalla chiusa, e il pavimento è coperto di setole e
      di ossa rosicchiate. Ai pali lungo le pareti quattro cinghiali da guerra
      con le zanne cerchiate di ferro si buttano avanti appena ti vedono, e le
      catene si tendono a un passo dal sentiero che attraversa la stanza. Uno
      ha al collo un campanaccio da capra che a ogni strattone suona allegro.

      {origine figlio-del-circolo} Al Festival hai sentito un cinghiale
      toccato dalla Marea; questi sono sani e arrabbiati, e ne sei contento.
    opzioni:
      - testo: "Calmarli con la voce"
        descrizione: "Anche una bestia da guerra si può calmare, se chi le parla non ha paura."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: La cantilena
          testo: |
            Ti fermi a distanza e parli piano, sempre con la stessa cantilena,
            senza guardarli negli occhi. Il più grosso smette di tirare per primo
            e gli altri lo seguono. Passi in mezzo con lo stesso passo mentre
            quello con il campanaccio ti annusa la mano, e sulla soglia ti accorgi
            che la cantilena è una ninna nanna che non ricordavi di sapere.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: La zanna
          testo: |
            La voce ti trema e le bestie lo sentono subito. Il più grosso si butta
            in avanti finché il palo si piega, e la zanna cerchiata di ferro ti
            prende la coscia di striscio. Torni al tunnel zoppicando, con il
            campanaccio che suona allegro alle tue spalle.
          effetti: { ferite: 0.5 }
      - testo: "Parlare loro con il Richiamo"
        descrizione: "Nella lingua che il Circolo insegna ai bambini, anche un cinghiale da guerra si sente chiamare."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il nome
          testo: |
            Dici le parole del Richiamo a bassa voce, e i quattro cinghiali alzano il
            muso nello stesso momento. Uno alla volta si accucciano ai piedi dei pali,
            con le orecchie girate verso di te, e passi in mezzo senza fretta mentre il
            campanaccio resta muto. Dall'altra parte ti tremano le mani, e le infili
            sotto le ascelle.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: La paura
          testo: |
            A metà della formula la voce ti si incrina, e i cinghiali sentono
            soltanto la tua paura. Si buttano avanti tutti e quattro e un palo
            esce dal terreno di una spanna, mentre tu inciampi nelle ossa e ti
            sbucci i palmi. Dal tunnel ripeti la formula a mezza voce, giusta,
            adesso che non serve più.
          effetti: { ferite: 0.5 }
      - testo: "Passare fuori dalla portata delle catene"
        descrizione: "Lungo la parete c'è una striscia dove le zanne non arrivano. È stretta."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Rasente il muro
          testo: |
            Lungo la parete nord c'è una striscia di terra larga un piede dove
            nessuna zanna arriva. Ci passi di fianco, con la schiena contro i rovi
            e le spine nella giubba, mentre i cinghiali si sfiancano a un palmo
            dai tuoi stivali e la bava del più vicino ti schizza le ginocchia.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: Il palmo in meno
          testo: |
            A metà della striscia il piede ti scivola sulle setole, e il cinghiale
            più vicino ti arriva addosso con il muso prima che la catena lo fermi,
            buttandoti contro i rovi. Esci dall'altra parte con un livido sul
            fianco e la giubba piena di spine.
          effetti: { ferite: 0.5 }
      - testo: "Lanciare le ossa e passare mentre litigano"
        descrizione: "Di ossa ce ne sono tante, e i cinghiali sono quattro. Basta lanciarle bene."
        costo: 2
        esito:
          titolo: Le ossa
          testo: |
            Lanci le ossa più grosse in fondo alla stanza, e mentre i cinghiali si
            girano a contendersele passi in mezzo. L'ultimo osso lo lanci male, e
            quello con il campanaccio si rigira verso di te un attimo prima che tu
            sia fuori portata, lasciandoti un taglio lungo e pulito sul polpaccio.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }

  # 2 · sulla scogliera
  - id: rovolungo-posti-di-guardia
    immagine: ambientazione/rovolungo
    titolo: I posti di guardia
    sommario: "Due casotti di rovi e di legno di mare sulla scogliera, vuoti, dove dovrebbe esserci qualcuno di guardia."
    luogo: Rovolungo, sulla scogliera
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 2]
    testo: |
      Il tunnel sbuca sul bordo della scogliera. Ai lati del sentiero ci sono
      due casotti di guardia di rovi e legno portato dal mare, e in fondo,
      dove la scogliera finisce, si vedono i pali di un ponte. I casotti sono
      vuoti e la cenere è fredda da giorni; su un'asse è inciso un tavoliere,
      con le pedine di sassolini ferme a metà di una partita.

      {intimidire Media} Una guardia lascia la partita a metà soltanto se la
      chiama qualcuno di cui ha più paura che della noia.
    opzioni:
      - testo: "Frugare nei casotti"
        descrizione: "Chi passa le giornate di guardia si fa un nascondiglio, per le cose sue."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: L'asse che suona vuota
          testo: |
            Sotto la paglia del secondo casotto un'asse suona vuota, e nel buco
            c'è un sacchetto di cuoio con monete di Qir-Azel, insieme a un corno
            da richiamo con l'imboccatura masticata. Le monete le prendi, il corno
            lo lasci dov'è, anche se la mano ci torna sopra due volte.

            {origine mercante-dei-ponti} Sono di conio recente, e una porta il
            morso di chi una bilancia non ce l'ha.
          effetti: { profondita.rovolungo: 1, monete: 12 }
        fallimento:
          titolo: Le vespe
          testo: |
            Sotto la paglia del secondo casotto c'è un nido di vespe grande quanto
            una testa. Corri fuori agitando le braccia e ti fermi a un passo dal
            vuoto con tre punture sul collo, e ti viene il dubbio che le guardie
            sapessero del nido e che il nascondiglio fosse proprio quello.
          effetti: { ferite: 0.5 }
      - testo: "Salire sul tetto e guardare l'isola"
        descrizione: "Il casotto è basso, ma da lassù si vede oltre il bordo della scogliera."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La testa mozzata
          testo: |
            Ti arrampichi sul tetto tenendoti alle travi, e da lassù vedi l'isola
            a una ventina di metri dalla scogliera. È tonda e piatta in cima, e ha
            davvero la forma di una testa mozzata. In cima c'è una palizzata alta
            quanto una casa, con due torri di guardia sul lato sud, e sulla torre
            più vicina due orchi si passano una bottiglia.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: Il tetto
          testo: |
            Il tetto regge il primo ginocchio e cede sotto il secondo, e ti
            ritrovi seduto nella cenere fredda con il tavoliere rovesciato. Prima
            di uscire rimetti le pedine a memoria, come ti sembra che stessero,
            lasciando in vantaggio quello che stava vincendo, e non sapresti dire
            perché ci tieni tanto.
          effetti: { ferite: 0.5 }
      - testo: "Aggirare i casotti fra i rovi"
        descrizione: "Lontano dalle feritoie, sul bordo della scogliera. Il vuoto resta a sinistra."
        costo: 2
        esito:
          titolo: Sul bordo
          testo: |
            Giri largo intorno ai casotti fra i rovi del bordo, lontano dalle feritoie, con
            il vuoto a un passo sulla sinistra, e ci metti un'ora per fare cento passi.
            Quando un gabbiano plana sotto di te ti aggrappi a un rovo con tutte e due le
            mani. Torni sul sentiero con i calzoni a brandelli dal ginocchio in giù.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }

  - id: rovolungo-ponte-di-corda
    immagine: ambientazione/capomozzo
    titolo: Il ponte di corda
    sommario: "Fra la scogliera e Capomozzo un ponte di corda, sospeso sopra il mare, cigola a ogni colpo di vento."
    luogo: Rovolungo, il ponte per Capomozzo
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 2]
    testo: |
      Dal bordo della scogliera un ponte di corda attraversa il braccio di
      mare fino all'isola, dove dietro una palizzata alta quanto una casa
      qualcuno martella. Il ponte ha corde lucide e assi robuste e ondeggia a
      ogni colpo di vento, ventiquattro metri sopra gli scogli. Sul primo
      palo è inchiodato un ferro di cavallo rovesciato.

      {origine apprendista-raschiatore} Sulle piattaforme un ponte si guarda
      prima dagli attacchi, e le mani vanno da sole a tastare il primo palo,
      legato con nodi da marinaio diversi dai tuoi.
    opzioni:
      - testo: "Studiare gli attacchi del ponte"
        descrizione: "Un ponte che porta a una fortezza di orchi merita di essere guardato da sotto."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Le corde segate
          testo: |
            Steso a pancia in giù sul bordo, guardi gli attacchi da vicino. Le
            corde del lato ovest sono segate a metà dalla parte che non si vede, e
            chi ci passa carico o di corsa finisce in mare. Alla base dei pali,
            dalla parte dell'isola, pendono corde annodate nuove, che gli orchi
            hanno usato da poco per farci passare un peso grosso.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: L'asse
          testo: |
            Ti sporgi sotto la prima asse e l'asse si inclina sotto il gomito, e per un
            momento vedi soltanto le onde, lontanissime. Ti tiri indietro con le unghie
            piantate nella terra e resti steso a guardare il cielo, con il gomito
            sbucciato e la nausea, finché la terra smette di ondeggiare.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare piano, a mani vuote"
        descrizione: "Senza zaino e senza fretta, un'asse alla volta. Dall'altra parte ci sono delle corde per legarlo meglio."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Un'asse alla volta
          testo: |
            Lasci lo zaino sulla scogliera e attraversi un'asse alla volta, con le
            mani sulle corde. Dall'altra parte, sotto la palizzata, leghi agli
            attacchi del lato ovest le corde annodate alla base dei pali,
            sbagliando il primo nodo e azzeccando il secondo. Al ritorno il ponte
            ondeggia meno, e le gambe ti tremano fino alla scogliera.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: Il lato ovest
          testo: |
            A metà il vento ti spinge e acceleri senza volerlo, e il lato ovest
            cede di colpo. Ti ritrovi appeso alla corda dell'altro lato con le
            gambe nel vuoto, e torni alla scogliera strisciando sulle assi storte,
            con le mani bruciate dalla corda e una risata che non c'entra niente.
          effetti: { ferite: 1 }
      - testo: "Aspettare che cali il vento"
        descrizione: "Prima o poi il vento cala, e intanto sulla scogliera fa freddo."
        costo: 2
        esito:
          titolo: Al tramonto
          testo: |
            Ti rannicchi dietro un masso con il mantello sopra la testa. Il vento cala
            soltanto al tramonto, quando dall'isola arriva odore di carne arrosto e sulle
            torri accendono le torce. Passi e ripassi il ponte fermo con le assi umide di
            nebbia e i denti che battono.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }

  # ------------------------------------------------------------ la grotta del Ghermitore (C27, facoltativa)
  # Si apre dopo il Buco Ululante (rovolungo.buco) ed è una deviazione: non fa avanzare. Si chiude quando
  # prendi il respiratore; chi fallisce o perde può riprovarci.
  - id: la-grotta-del-ghermitore
    immagine: ambientazione/rovine-dei-precursori
    titolo: La grotta sotto il Buco
    sommario: "Sotto il Buco Ululante c'è una grotta di mare, con del metallo sulla sporgenza e una bestia nell'acqua scura."
    luogo: Rovolungo, la grotta sotto il Buco Ululante
    area: rovolungo
    requisiti: [pista.capomozzo == 1, profondita.rovolungo >= 1, rovolungo.buco == 1, ghermitore == 0]
    testo: |
      Leghi la corda al paletto del gabbiano e ti cali nel Buco Ululante. Il pozzo
      scende per una ventina di metri e si apre nella volta di una grotta, tre metri
      sopra l'acqua, e ti lasci scivolare su una sporgenza di roccia larga un passo e
      lunga quattro, l'unico punto asciutto.

      Le pareti scintillano di ricci di mare e di anemoni. Sulla sporgenza ci sono ossa
      di foca e lo scheletro di un uomo, con la cintura degli attrezzi da Raschiatore
      allacciata in vita, e accanto al teschio una maschera di metallo grigio che la
      salsedine non ha nemmeno sfiorato.

      {origine apprendista-raschiatore} La fibbia è sul fianco, come la allacciano
      sulle piattaforme perché non si impigli nelle scale. Forse al Ponte dei Morti c'è
      una lanterna accesa anche per lui.

      {tecnologia Media} Un metallo che il sale non intacca l'hanno lavorato i
      Precursori, e il Raschiatore se l'è portato fin quaggiù per niente.

      Poi l'acqua gorgoglia, e dalla schiuma esce una testa lucida fatta per metà di
      carne e per metà di metallo, con scaglie d'acciaio corroso e due occhi dorati
      senza pupilla. La bocca si apre a scatti su due file di denti d'acciaio ricurvi,
      e dalle giunture escono sbuffi di vapore che sanno di olio bruciato. Senti la
      corda scivolarti fra le dita sudate.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "Sulla sporgenza c'è posto per uno, e l'acqua è tutta sua."
        combattimento: ghermitore
        vittoria:
          titolo: La maschera grigia
          testo: |
            Il Ghermitore si getta sulla sporgenza tre volte, e alla terza la tua
            lama trova la carne fra due scaglie. Si ritira sott'acqua in una scia
            oleosa e non torna a galla. Fra i denti d'acciaio che ha perso sulla
            roccia c'è un cristallo grezzo che pulsa ancora, e lo prendi insieme
            alla maschera grigia, chiedendo scusa al Raschiatore a mezza voce, poi
            risali con le braccia che tremano.
          effetti: { oggetto.respiratore: 1, ghermitore: 1, cristalli.cristallo-carico: 1 }
        sconfitta:
          titolo: Sott'acqua
          testo: |
            Il Ghermitore ti prende per una caviglia e ti tira giù, e per tutto il
            fiato che hai vedi soltanto bolle e una luce dorata. Ti liberi con un
            calcio, ti aggrappi alla corda con le ultime forze e risali a mani vuote,
            e in cima ti stendi accanto al cerchio di sassi a vomitare acqua di mare.
      - testo: "Gettargli un'esca lontano dalla sporgenza"
        descrizione: "Gli orchi lo nutrono di gabbiani, e uno gettato in fondo alla grotta potrebbe distrarlo."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: Il gabbiano del paletto
          testo: |
            Aspetti che l'onda si ritiri e lanci il gabbiano staccato dal paletto
            contro la parete opposta, dove l'acqua è più bassa. Il Ghermitore ci
            si gira contro con uno scatto di metallo, e mentre lo sbrana prendi la
            maschera grigia, più leggera di quanto sembrava. Quando torna a
            guardare la sporgenza sei già a metà della corda.
          effetti: { oggetto.respiratore: 1, ghermitore: 1 }
        fallimento:
          titolo: L'onda
          testo: |
            L'onda riporta il gabbiano ai piedi della sporgenza, e il Ghermitore
            lo prende insieme al tuo stivale. Ti trascina in acqua fino alle
            ginocchia prima che tu afferri la corda, e risali senza la maschera e
            con il polpaccio aperto fino all'osso. In cima lo fasci con la
            camicia, che diventa rossa prima che tu abbia finito il nodo.
          effetti: { ferite: 2 }
      - testo: "Ordinargli di fermarsi"
        descrizione: "Il suo metallo è dei Precursori, e forse una parte di lui capisce ancora la lingua delle macchine."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: L'ordine
          testo: |
            Dici l'ordine nella lingua delle macchine, e gli occhi dorati del
            Ghermitore si spengono uno dopo l'altro. Resta a galla immobile, con
            il vapore che gli esce piano dalle giunture, finché la corrente lo
            porta sotto. Prendi la maschera grigia e un cristallo che pulsa fra le
            ossa di foca, e risali con un gusto di ferro sulla lingua.
          effetti: { oggetto.respiratore: 1, ghermitore: 1, cristalli.cristallo-carico: 1 }
        fallimento:
          titolo: L'eco storta
          testo: |
            Il Ghermitore si ferma, e per il tempo di contare fino a tre ci credi
            davvero. Poi inclina la testa e ripete l'ordine più forte e più storto
            con la sua bocca di metallo, e il suono ti rimbomba nel cranio finché
            non vedi più niente. Ti ritrovi a metà della corda con il naso che
            sanguina e una mano aperta dai denti d'acciaio.
          effetti: { ferite: 1, tormento: 1.5 }
      - testo: "Strisciare fino allo scheletro quando si immerge"
        descrizione: "Quando va sotto, la sporgenza è lunga quattro passi e lui sente tutto ciò che cade in acqua."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Quattro passi
          testo: |
            Aspetti che il Ghermitore si immerga e strisci sulla sporgenza a
            pancia in giù. Sfili la maschera da sotto il teschio piano, perché le
            ossa non facciano rumore, e sei già sulla corda quando l'acqua si apre
            alle tue spalle e i denti d'acciaio si chiudono sul vuoto con un
            rumore di cesoie.
          effetti: { oggetto.respiratore: 1, ghermitore: 1 }
        fallimento:
          titolo: L'osso di foca
          testo: |
            A metà della sporgenza il ginocchio fa rotolare un osso di foca in
            acqua, e l'acqua si apre subito. I denti d'acciaio ti si chiudono
            sull'avambraccio, e ti liberi soltanto lasciandoci la manica e un
            pezzo di pelle. Risali a forza di gomiti, mentre sotto di te il
            Ghermitore gira in tondo con la tua manica fra i denti.
          effetti: { ferite: 2 }
      - testo: "Restare appeso alla corda, come sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice si lavora appesi, e dalla corda alla maschera ci sono due braccia."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Appeso
          testo: |
            Ti fai un cappio sotto le ascelle con il nodo che ti hanno insegnato
            il primo giorno sulle piattaforme, e scendi fino a mezzo braccio dalla
            sporgenza senza toccarla. Quando il Ghermitore si immerge ti allunghi,
            sfili la maschera da sotto il teschio e ti tiri su a forza di braccia,
            mentre i denti d'acciaio si chiudono nell'aria sotto i tuoi stivali.
          effetti: { oggetto.respiratore: 1, ghermitore: 1 }
        fallimento:
          titolo: Il cappio
          testo: |
            Il nodo ti scivola sotto un'ascella mentre ti allunghi, e resti appeso
            di sbieco con un braccio nell'acqua, che il Ghermitore prende sopra il
            polso. Ti liberi tirando con tutto il peso sulla corda e risali senza
            la maschera e con il braccio aperto. In cima rifai il nodo da capo per
            vedere dove avevi sbagliato.
          effetti: { ferite: 2 }

  # ------------------------------------------------------------ il cuore · 1 → 2 · la tana di Borgoth (C6–C7)
  - id: borgoth-e-cenerascura
    immagine: personaggi/borgoth-il-gigante
    titolo: La tana di Borgoth
    sommario: "In una camera vicino al ponte, nel nido di ortiche, c'è un gigante con un puma color brace."
    luogo: Rovolungo, la tana di Borgoth
    area: rovolungo
    requisiti: [pista.capomozzo == 1, profondita.rovolungo >= 3]
    testo: |
      A cento passi dai pali del ponte c'è un'ultima camera doppia, con rampicanti che
      pendono dal soffitto di spine carichi di scheletri d'uccello e mascelle di volpe.

      Nel nido di ortiche, a sud, c'è un orco sveglio più alto di qualunque orco tu
      abbia mai visto. A Fondobosco raccontano che sua madre fosse un'ogre. Ha la pelle
      venata di muschio, con fili d'erba fra le cicatrici, e accanto a lui è sdraiato un
      puma dal pelo color brace che sbuffa vapore caldo.

      {origine figlio-del-circolo} Al Circolo ti hanno insegnato che una bestia legata a
      qualcuno si legge guardando lui. Il puma ha gli occhi su di te e le orecchie
      girate verso Borgoth.

      «Borgoth sa perché sei qui» dice l'orco, alzandosi piano. «L'odore di Qir-Azel,
      Borgoth lo sente da tre stanze, e anche Cenerascura.»

      Alza le braccia e grida parole che non sono orchesco. Dalle cicatrici gli filtrano
      fiammelle dorate e dalle spalle gli spuntano rami carbonizzati. Quando ha finito è
      un gigante di corteccia nera e di fiamma alto quasi tre metri, e il caldo ti
      arriva in faccia come da una fornace aperta.

      {magia Media} Il fuoco che gli corre addosso è Mana selvatico, che la terra gli
      presta tutto in una volta. Durerà poco, e lui lo sa meglio di te.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Un gigante che brucia e un puma che salta prima che tu lo veda partire, e alle spalle soltanto rovi."
        combattimento: borgoth-e-cenerascura
        vittoria:
          titolo: In ginocchio
          testo: |
            Il puma ti arriva addosso per primo, e quando lo ricacci con un taglio
            sul muso si ritira in un angolo, soffiando. Borgoth è più lento. Il
            fuoco gli si spegne addosso un colpo alla volta, e quando cade in
            ginocchio fra le ortiche è di nuovo un orco grande e ansante, con il
            fumo che gli sale dalle spalle. Gli metti la lama alla gola, e lui
            ride piano.
          segue: borgoth-parla
        sconfitta:
          titolo: Le ortiche
          testo: |
            L'ultima cosa che vedi è il braccio di corteccia che cala. Quando
            riapri gli occhi la camera è vuota e fredda, del fuoco restano i segni
            neri sui rampicanti, e le impronte di Borgoth e del puma vanno verso
            est, dalla parte di Fondobosco. Ti trascini fino al ponte con le
            costole che scricchiolano a ogni passo.
          effetti: { pista.capomozzo: 1, tormento: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Calmare il puma"
        descrizione: "Se il puma si accuccia, forse si ferma anche il gigante, ma la voce non deve tremare."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Difficile }
        successo:
          titolo: Il puma accucciato
          testo: |
            Ti abbassi sui talloni e porgi al puma il dorso della mano, parlando
            piano, mentre il calore ti arriccia le sopracciglia. Il puma ti annusa
            a lungo e si stende fra te e il suo padrone, con il mento sulle zampe.
            Il fuoco si ritira sotto la pelle di Borgoth con un sibilo, e lui
            guarda il puma come se lo avesse tradito, mentre il puma sbadiglia.
          pe: { addestrare-animali: 5 }
          segue: borgoth-parla
        fallimento:
          titolo: La zampata
          testo: |
            Il puma ti annusa la mano e poi la prende fra i denti, e mentre cerchi
            di liberarti ti apre la spalla con una zampata. Borgoth fischia una
            volta, il puma corre da lui, e il gigante di fuoco ti guarda a lungo
            prima di sparire nei tunnel verso est. Tamponi la spalla con la manica
            finché è zuppa, poi vai verso il ponte.
          effetti: { ferite: 2, pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Chiamare il puma con il Richiamo"
        descrizione: "Anche se gli esce il fumo dalla bocca è una bestia, e il Circolo ha una parola per lui."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La parola del Circolo
          testo: |
            Dici la parola del Richiamo, e il puma si ferma a metà del salto e
            atterra di fianco, scrollando la testa. Lo chiami ancora, e lui viene
            a strusciarsi contro le tue gambe, caldo come una pietra lasciata al
            sole. Borgoth guarda prima il suo puma e poi te, e abbassa le braccia,
            e il fuoco gli si ritira sotto la pelle lasciando un orco grande e
            offeso.
          segue: borgoth-parla
        fallimento:
          titolo: La parola storta
          testo: |
            La parola ti esce storta, e il puma la prende per una sfida. Ti butta
            a terra, e senti i suoi baffi ruvidi sulla faccia prima che Borgoth lo
            richiami con un fischio e se ne vada nei tunnel verso est senza
            degnarti di uno sguardo. Ti rialzi con il petto rigato di graffi e vai
            verso il ponte, ripassando la parola giusta, che adesso ti viene
            perfetta.
          effetti: { ferite: 2, pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Parlargli di Balthog"
        descrizione: "Borgoth è di Fondobosco, e anche se brucia forse Balthog gli sta stretto."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Difficile }
        successo:
          titolo: Lo sputo
          testo: |
            Gli dici che sei venuto per Balthog e per chi gli dà gli ordini, e che
            con Fondobosco non hai niente da spartire. Borgoth sputa per terra, e
            lo sputo sfrigola. Il fuoco gli si ritira sotto la pelle un poco alla
            volta, e resta un orco grande che si siede su una radice e fa cenno al
            puma di stare giù.
          pe: { persuasione: 5 }
          segue: borgoth-parla
        fallimento:
          titolo: Il dorso della mano
          testo: |
            Al nome di Balthog Borgoth ride, poi ti colpisce con il dorso della
            mano, senza chiudere il pugno, e ti manda a sbattere contro il muro di
            spine.

            «Borgoth non parla con chi viene da Qir-Azel» dice, e se ne va nei
            tunnel verso est con il puma. Ti stacchi le spine dalla schiena con un
            dente che si muove, poi prendi la strada del ponte.
          effetti: { ferite: 2, pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Farti da parte e lasciarli passare"
        descrizione: "Non sei venuto per lui, e forse Borgoth non ha voglia di bruciare per Balthog."
        esito:
          titolo: Verso Fondobosco
          testo: |
            Ti sposti contro la parete con le mani lontane dalla cintura e lasci
            libero il passaggio. Borgoth ti guarda a lungo, con il fuoco che gli
            scorre sulle braccia, poi grugnisce, abbassa la testa sotto i
            rampicanti e se ne va nel tunnel verso est, con il puma che gli trotta
            dietro voltandosi due volte. Quando non senti più niente prendi la
            strada del ponte, con la schiena fradicia.
          effetti: { pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Ascoltare il puma come al Circolo"
        descrizione: "Al Circolo si ascolta una bestia prima di guardarla, e un ordine si dà anche con il respiro."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Difficile }
        successo:
          titolo: La voce dei puledri
          testo: |
            Ti accovacci all'altezza del puma e respiri lento come lui, con le mani
            aperte sulle ginocchia, finché smette di guardarti la gola. Poi gli
            parli con la voce bassa che al Circolo si usa per i puledri, e il puma
            sbadiglia e si stende. Borgoth lo guarda a lungo, e il fuoco gli si
            ritira sotto la pelle con un sibilo di legna bagnata.
          segue: borgoth-parla
        fallimento:
          titolo: Troppo presto
          testo: |
            Il puma sente il tuo respiro cambiare un momento troppo presto e ti
            apre la spalla con una zampata, prima che Borgoth lo richiami con un
            fischio. Il gigante ti guarda dall'alto senza dire niente e se ne va
            nei tunnel verso est, e tu, quando la manica sulla spalla è zuppa,
            prendi la strada del ponte.
          effetti: { ferite: 2, pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Lasciare che il fuoco si consumi"
        descrizione: "All'Accademia insegnano al primo anno che il Mana preso tutto in una volta si consuma in fretta."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [magia, resilienza], difficolta: Difficile }
        successo:
          titolo: Il conto del Mana
          testo: |
            Arretri un passo alla volta, fuori dalla portata delle sue braccia,
            contando a mezza voce come in laboratorio quando aspetti che un
            cristallo si scarichi. Al trentesimo le fiammelle sulle cicatrici si
            abbassano, al cinquantesimo la corteccia si crepa sulle spalle, e
            Borgoth abbassa le braccia prima che il fuoco gli muoia addosso,
            guardandoti storto come uno a cui hanno contato le carte.
          segue: borgoth-parla
        fallimento:
          titolo: La schiena contro le spine
          testo: |
            Arretri contando a mezza voce, e al dodicesimo la schiena tocca il
            muro di spine. Il braccio di corteccia ti prende di piatto sul petto e
            ti butta fra le ortiche, e quando riesci a rialzarti il gigante e il
            puma sono già nei tunnel verso est, con il fuoco spento da solo,
            proprio come dicevano i libri.
          effetti: { ferite: 2, pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo

  - id: borgoth-parla
    immagine: personaggi/borgoth-il-gigante
    titolo: Borgoth parla
    tipo: seguito
    luogo: Rovolungo, la tana di Borgoth
    area: rovolungo
    requisiti: [pista.capomozzo == 1]
    testo: |
      Fra le ortiche Borgoth siede con le mani aperte sulle ginocchia e un filo di
      fumo che gli sale dalle spalle, e il puma è accucciato a qualche passo, con le
      orecchie basse.

      «Borgoth sa perché sei qui» dice, e sputa per terra. «Per Qir-Azel. È colpa
      della *Mawrak'Thur* e delle sue macchine che camminano. Il Capotribù Balthog
      adesso ascolta lei, una donna molto arrabbiata, con i capelli d'argento e gli
      occhi strani, e una cicatrice che le taglia la pancia. Borgoth pensa che il
      Capotribù Balthog se ne sia innamorato, perché fa tutto quello che lei dice, ed
      è stata lei a volere l'attacco a Qir-Azel. Allora Borgoth si è tenuto lontano
      dal Capotribù Balthog e dai suoi amici nuovi, perché quella donna porta guai a
      tutta la stirpe degli orchi.»

      {origine accolito-del-velo} Nelle cronache del Velo la figlia del cappellano
      Sollen, quella con i capelli d'argento, è morta nell'incendio del Santuario, e
      in Cattedrale nessuno ha mai corretto quella riga.

      {empatia Facile} Dice sempre il titolo intero, Capotribù Balthog, anche con la
      bocca piena di rabbia, per l'abitudine di uno che ci teneva.

      *I ritratti di Isvaro avevano i capelli chiari e una mano posata sul ventre.*
      L'orco ti guarda di sotto in su e aspetta la domanda successiva.
    opzioni:
      - testo: "Chiedergli chi c'è con lei"
        descrizione: "Ha detto amici nuovi. Gli amici si possono contare."
        costo: 0
        esito:
          titolo: Le dita
          testo: |
            Borgoth ghigna storto, perché la domanda gli piace, e alza la mano con
            le dita chiuse. Mentre apre il primo dito gli cadono sulle ginocchia
            scaglie di corteccia nera, e ti accorgi che anche tu stai contando,
            piegando le dita contro la coscia.
          segue: borgoth-e-gli-alleati
      - testo: "Chiedergli di Balthog"
        descrizione: "Il capo di Capomozzo. Borgoth lo chiama sempre con il titolo intero."
        costo: 0
        esito:
          titolo: Gli sciamani a pescare
          testo: |
            «Il Capotribù Balthog non ha mai perso» dice Borgoth, staccandosi una
            scaglia di corteccia dal polso. «Combatte con le mani, e non ha una
            cicatrice. Prima ascoltava gli sciamani di Capomozzo, adesso ascolta
            la donna, e gli sciamani li ha mandati a pescare.» Poi alza la mano
            con le dita chiuse. «La donna ha degli amici, e Borgoth li può
            contare.»
          segue: borgoth-e-gli-alleati
      - testo: "Chiedergli della cicatrice"
        descrizione: "Nella tenda dei feriti hai imparato che una cicatrice dice molto di chi la porta."
        quando: [origine.accolito-del-velo >= 1]
        costo: 0
        esito:
          titolo: La riga sul ventre
          testo: |
            Gli chiedi quanto è lunga la cicatrice. Borgoth ci pensa con la
            serietà di un bambino interrogato, poi traccia una riga sul proprio
            ventre con l'unghia. «Lunga così. Borgoth non l'ha guardata di più,
            perché a una donna come quella le cicatrici è meglio non guardarle.»
            Poi alza la mano con le dita chiuse, contento di avere ancora qualcosa
            da contare, e aggiunge che la donna non è sola.
          segue: borgoth-e-gli-alleati

  - id: borgoth-e-gli-alleati
    immagine: personaggi/borgoth-il-gigante
    titolo: Gli amici nuovi
    tipo: seguito
    luogo: Rovolungo, la tana di Borgoth
    area: rovolungo
    requisiti: [pista.capomozzo == 1]
    testo: |
      «Non è finita» dice Borgoth, e apre un dito alla volta. «Con la donna ci
      sono altri quattro. Zagrath il predone, che ha la madre ogre come Borgoth
      e nient'altro come Borgoth, e un uomo che non parla mai e gira chiuso in
      un'armatura pesante. Una donna con la pelle ambrata, che ha bruciato con
      il fuoco gli orchi che le andavano troppo vicino, e un mezzelfo che ride
      sempre e tira con l'arco meglio di un orco. E poi una trentina di fedeli
      suoi, che dicono di essere del Culto dell'Anonimo e che lei è la loro
      capa.»

      {empatia Difficile} Sul Culto abbassa la voce, lui che non l'ha abbassata
      nemmeno mentre bruciava.

      {origine allievo-di-torvessa} All'Accademia quelli del primo anno ci
      mettono un pomeriggio di formule per una fiamma grande quanto una
      candela, e nessuno dei tuoi libri insegna a bruciare un orco.

      *Il mezzelfo che ride l'hai visto alla fornace, con una bottiglia accanto
      al gomito.* «Il mezzelfo e la donna, Borgoth li ha visti nel bosco fare
      come i ratti» continua lui. «Quando lo ha detto al Capotribù Balthog, il
      Capotribù Balthog ha cacciato via Borgoth.» Sputa per terra e ti guarda
      dritto. «Borgoth è pronto, ed è fiero guerriero della tribù di
      Fondobosco. Tornerà alla terra, a cui tutto appartiene.»
    opzioni:
      - testo: "Lasciarlo legato"
        descrizione: "Con i suoi stessi rampicanti, stretti. Se si libera, sarà dopo che hai passato il ponte."
        esito:
          titolo: I rampicanti
          testo: |
            Gli leghi polsi e caviglie con i rampicanti più grossi, e Borgoth ti
            lascia fare guardando il soffitto. Quando stringi l'ultimo nodo ride
            piano. «Le radici si slegano, e Borgoth aspetta» dice.

            {natura Facile} Sono rampicanti verdi e pieni d'acqua, che seccando
            fra qualche giorno cederanno da soli.
          effetti: { pista.capomozzo: 1 }
          imposta: { borgoth: 2 }
          vai: capomozzo
      - testo: "Finirlo"
        descrizione: "Ha detto quello che sapeva, e ha detto anche di essere pronto."
        esito:
          titolo: Alla terra
          testo: |
            Borgoth chiude gli occhi prima che tu ti muova, e non li riapre più.
            Quando è finita il puma esce dall'angolo e gli si stende accanto, con
            il muso sul suo petto, e non si sposta nemmeno quando gli passi
            vicino. Ti pulisci la lama su un ciuffo d'erba, ma le mani continuano
            a sentirla sporca fino al ponte.
          effetti: { pista.capomozzo: 1, tormento: 1 }
          imposta: { borgoth: 1 }
          vai: capomozzo
      - testo: "Lasciarlo andare"
        descrizione: "È un orco di Fondobosco, e con Balthog ha chiuso da tempo. La strada per casa sua è lunga."
        esito:
          titolo: Verso est
          testo: |
            Gli dici di andarsene, e Borgoth ti guarda come se non avesse capito.
            Poi fischia al puma, e sulla soglia del tunnel si ferma.

            «Il ponte cade sotto chi corre» dice senza voltarsi. «Borgoth lo ha
            visto cadere sotto due orchi di Capomozzo, e ha riso.»

            Lo senti allontanarsi fra i rovi verso est, finché il vento del mare
            copre i passi.
          effetti: { pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Lasciarlo andare con un debito"
        descrizione: "Nei vicoli chi ti lascia andare quando potrebbe finirti diventa il tuo creditore, e Borgoth lo sa."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il debito
          testo: |
            Gli dici che può andare, e che adesso ti deve qualcosa. Borgoth
            annuisce piano, come si annuisce a un prezzo giusto, e fischia al
            puma. Sulla soglia del tunnel si ferma.

            «Il ponte cade sotto chi corre» dice senza voltarsi. «Questo Borgoth
            te lo paga subito.»

            Nei vicoli dove sei cresciuto i debiti grossi si pagano tardi o mai, e
            il primo saldato in tempo te l'ha saldato un orco.
          effetti: { pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
