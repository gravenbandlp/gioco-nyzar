# Capomozzo, prima parte (pista.capomozzo 0 → 2): Galdrick alla Caserma e la strada per la costa, la
# spedizione nel Rovolungo (C1–C9 del verbale) e il cuore nella tana di Borgoth (C6–C7).
#
# - `la-strada-per-capomozzo` (0 → 1): Galdrick, tornato da Ghoran da pochi giorni, mette in fila quello che sai e ti
#   manda a Rovolungo. A piedi, a cavallo (chiave.cavalcatura, un rintocco in meno) o con una guida.
# - `tornare-a-rovolungo` (pista 1, ripetibile): il rientro dalla Caserma dopo una ritirata.
# - area `rovolungo`: sette stanze ripetibili, in ordine secondo la profondità: 0 l'entrata nascosta nel muro
#   di spine, 1 dentro i tunnel (il tunnel di cardi, il Buco Ululante, il nido dei profughi o le cucce), 2 sulla
#   scogliera (i posti di guardia o il ponte di corda). Una stanza superata non ricompare nella stessa visita
#   (src/motore/spedizioni.ts). La grotta del Ghermitore sotto il Buco (facoltativa, si chiude quando prendi il
#   respiratore) si apre dopo che in questa visita sei passato dal Buco (rovolungo.buco), e il cuore
#   `borgoth-e-cenerascura`, a cento passi dal ponte, si apre a profondità 3.
# - Il cuore porta a due seguiti con le parole di Borgoth (`borgoth-parla`, `borgoth-e-gli-alleati`) se lo
#   vinci o lo calmi; negli altri rami se ne va verso Fondobosco. In ogni ramo `borgoth` (1 morto, 2 legato
#   e interrogato, 3 andato via), pista.capomozzo 2 e `vai: capomozzo`.
quality:
  - { id: rovolungo.buco, nome: Hai visto il Buco Ululante, categoria: stato, nascosta: true, descrizione: "1 se in questa visita sei passat{o|a} dal Buco Ululante, e allora si apre la grotta del Ghermitore. L'entrata nascosta lo azzera." }

aree:
  - id: rovolungo
    immagine: ambientazione/rovolungo
    nome: Rovolungo
    sommario: "Da Qir-Azel sono due giorni e mezzo di cammino, e gli orchi ci hanno scavato dentro le loro gallerie fino al ponte di corda per Capomozzo."
    spedizione: { ritorno: superficie-fratturata, soglia: 3, stanze: 3 }
    testo: |
      Il vento del mare ti porta il sale fino in gola, e gli alberi crescono tutti storti verso l'interno. Poi
      finiscono e comincia il Rovolungo, un muro di rovi e di cardi alto come una casa che corre lungo la
      costa fin dove arriva lo sguardo. Alla base i fusti hanno lo spessore di un polso e la corteccia grigia
      del legno vecchio, e le spine sono lunghe un dito. Il vento ci passa in mezzo con un fruscio secco che
      non cambia mai.

      Fra le spine del primo rovo è impigliato un galleggiante da rete di vetro verde, portato quassù da una
      mareggiata. Dentro c'è una lumaca che ci è entrata da piccola e adesso è troppo grossa per uscire.

storylet:
  # ------------------------------------------------------------ 0 → 1 · Galdrick alla Caserma
  - id: la-strada-per-capomozzo
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: La strada per Capomozzo
    sommario: "Galdrick è tornato da Ghoran con trenta mercenari e non ha ancora trovato il tempo di farsi la barba."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo
    area: quartieri-alti
    requisiti: [pista.acciaio >= 8, pista.sepolcro >= 7, pista.capomozzo == 0]
    testo: |
      Galdrick è tornato da Ghoran da pochi giorni, con la barba di una settimana e gli stivali grigi del
      fango dei clan, seccato in croste fino alla caviglia. Nel cortile sotto la finestra una trentina di
      mercenari litiga ancora con il furiere per le brande, e le voci rimbombano contro i muri di pietra della
      Caserma.

      {origine fuggiasco-di-ghoran} Dal cortile sale la lingua dei clan con le vocali larghe di Ghoran, e la
      schiena la riconosce prima delle orecchie. Ti scosti dalla finestra perché da sotto non ti vedano.

      {origine rampollo-dei-quartieri-alti} Nei salotti dei Quartieri Alti si sono chiesti a cena chi avesse
      firmato la paga di quei trenta. Adesso la risposta ce l'hai davanti.

      Sul tavolo ci sono il rapporto sulla cripta di Sollen e il diario di Isvaro aperto sulle mappe. Galdrick
      lo tiene fermo con un calamaio perché la rilegatura tende a richiuderlo. Intorno alla fortezza i segni
      degli orchi sono così fitti che l'inchiostro ha passato la carta.

      «Ho messo in fila quello che mi hai portato» dice Galdrick, con i pollici nella cintura. «Dalla
      Biblioteca è sparita ogni riga su Capomozzo, e il mezzelfo se ne vanta nel suo diario. La sua donna,
      Aurenne, tiene in pugno gli orchi e cerca un Costruttore sotto la fortezza. Nelle mappe gli orchi sono
      quattrocento.»

      «Le trenta lance di Ghoran mi servono tutte sulle mura. Una squadra sulla costa la vedono arrivare da un
      giorno di distanza, una persona sola forse no. Voglio sapere che cosa c'è su quell'isola prima che
      quelli dell'isola vengano da noi.»

      *Ti sta chiedendo di andarci da sol{o|a}, e lo sa benissimo.*
    opzioni:
      - testo: "Partire a piedi"
        descrizione: "Due giorni e mezzo di strada verso nord, con le razioni della Caserma nello zaino."
        esito:
          titolo: Due giorni e mezzo
          testo: |
            Il furiere ti riempie lo zaino di gallette e di carne secca, e ti fa firmare la ricevuta per ogni
            galletta, seguendo la penna con la punta della lingua fra i denti. Esci dalla porta nord all'alba
            con lo zaino che ti tira le spalle all'indietro.

            La mattina del terzo giorno il vento comincia a sapere di sale. A mezzogiorno hai le vesciche ai
            talloni, e davanti a te, alto come una casa, c'è il muro di spine del Rovolungo.
          effetti: { pista.capomozzo: 1 }
          vai: rovolungo
      - testo: "Partire a cavallo"
        descrizione: "In sella la costa è più vicina, e alle vesciche ci pensa il cavallo."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: In sella
          testo: |
            Il cavallo prende la strada del nord prima al passo e poi al trotto, e le colline ti scorrono
            accanto senza che le gambe se ne accorgano. A metà del secondo giorno l'aria diventa salmastra e
            gli alberi cominciano a piegarsi verso l'interno. Hanno la corteccia consumata dal vento sul lato
            del mare. Leghi il cavallo a un pino storto lontano dai rovi, e mentre ti allontani lui ti guarda
            masticando.
          effetti: { pista.capomozzo: 1 }
          vai: rovolungo
      - testo: "Farti accompagnare da una guida"
        descrizione: "Una dei mercenari di Ghoran cacciava foche su quella costa. Vuole il suo prezzo, e conosce le scorciatoie."
        requisiti: [monete >= 20]
        esito:
          titolo: Hagra
          testo: |
            Si chiama Hagra, ha la faccia segnata da tre righe di argilla secca e mastica resina dalla mattina
            alla sera.

            Ti porta per sentieri da capre che sulla carta di Galdrick non ci sono, e la notte ti fa dormire
            in una grotta asciutta, dove i cacciatori lasciano la legna pronta per chi viene dopo. La legna è
            tagliata tutta della stessa lunghezza e impilata contro la parete più riparata.

            «Ai rovi ti lascio, eh» dice il terzo giorno, sputando la resina.

            Quando ti volti lei è già un puntino sulla collina.
          effetti: { monete: -20, ferite: -0.5, pista.capomozzo: 1 }
          vai: rovolungo
      - testo: "Parlare a Hagra nella lingua dei clan"
        descrizione: "Fra i mercenari di Galdrick c'è una che cacciava foche su quella costa. Parla come si parlava fuori dai recinti di Ghoran."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Hagra
          testo: |
            Si chiama Hagra, ha la faccia segnata da tre righe di argilla secca e mastica resina. Quando le
            chiedi la strada nella lingua dei clan smette di masticare e ti guarda i polsi, dove i ferri dei
            recinti lasciano un segno che non va più via.

            «Da uno scappato dalla bilancia la paga non si prende, eh» dice, e sputa la resina vicino al tuo
            stivale, con precisione, perché tu capisca che è un onore. Per tre giorni cammina davanti a te
            senza dire altro. Al muro di spine ti lascia con una pacca sulla spalla, e quando ti volti è già
            un puntino sulla collina.
          effetti: { ferite: -0.5, pista.capomozzo: 1 }
          vai: rovolungo

  # ------------------------------------------------------------ 1 · rientrare dopo una ritirata
  - id: tornare-a-rovolungo
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/rovolungo
    titolo: Di nuovo verso Rovolungo
    sommario: "Il ponte per Capomozzo è ancora là, oltre i rovi. Il furiere della Caserma ti riempie lo zaino un'altra volta."
    luogo: Guarnigione di Qir-Azel, il cortile
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.capomozzo == 1]
    testo: |
      Nel cortile della Caserma i mercenari di Ghoran hanno imparato a fare la fila per il rancio, con le
      scodelle di legno strette contro il petto. Dalla finestra dell'ufficio Galdrick alza due dita verso di
      te, per chiederti se sull'isola sono ancora tutti al loro posto.

      Il furiere ti riempie lo zaino di gallette senza farti firmare niente, e alla Caserma è quasi un
      incoraggiamento. Sono le stesse gallette dell'altra volta e sono dure come tegole. Fino al muro di spine
      sono due giorni e mezzo verso nord.

      {origine figlio-della-citta-bassa} Nei vicoli, quando la Caserma ti dà qualcosa senza ricevuta, si conta
      subito quanto costerà dopo. Ti tasti lo zaino come se sotto le gallette ci fosse il conto.
    opzioni:
      - testo: "Ripartire a piedi"
        descrizione: "Le stesse colline e lo stesso vento, e le vesciche dove le avevi."
        esito:
          titolo: Di nuovo al muro di spine
          testo: |
            Due giorni e mezzo di colline e di vento, e le vesciche si riaprono negli stessi punti della prima
            volta. A mezzogiorno del terzo giorno il muro di spine è grigio di nebbia come lo hai lasciato, e
            il galleggiante di vetro verde è ancora impigliato al primo rovo con la sua lumaca dentro, un po'
            più grossa e un po' più rassegnata. Sul vetro la salsedine ha lasciato un velo bianco dalla parte
            del mare. Ti stringi la cintura e cerchi con gli occhi il punto dove le impronte degli orchi
            spariscono nei rovi.
          vai: rovolungo
      - testo: "Ripartire a cavallo"
        descrizione: "Il cavallo la strada se la ricorda meglio di te."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Al trotto
          testo: |
            Il cavallo riconosce la strada prima di te e a ogni bivio tira dalla parte giusta. Dormi una notte
            sola sotto un pino con la sella sotto la testa, e a metà del secondo giorno sei già davanti al
            muro di spine, con il galleggiante di vetro verde impigliato al primo rovo e la sua lumaca dentro.
            Leghi il cavallo allo stesso pino storto della prima volta, e lui si mette a brucare dove aveva
            lasciato, con la soddisfazione di un cliente abituale.
          vai: rovolungo

  # ------------------------------------------------------------ le stanze (ripetibili, in ordine di profondità)
  # 0 · l'entrata nascosta
  - id: rovolungo-entrata-nascosta
    immagine: ambientazione/rovolungo
    titolo: L'entrata nascosta
    sommario: "Vicino alla riva i rovi si fanno ancora più fitti. Le impronte degli orchi arrivano fino al muro di spine e lì finiscono."
    luogo: Rovolungo, vicino alla riva
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 0]
    testo: |
      Vicino alla riva il roveto si fa più fitto, e fra i rovi crescono cardi più alti dei pini storti. I
      gambi sono grossi come un polso e coperti di una peluria grigia che trattiene la nebbia in goccioline.
      Oltre il muro, a ovest, le onde si sentono vicinissime. Ogni onda arriva un poco dopo che il terreno ti
      ha tremato sotto le suole.

      Ai piedi del muro le impronte degli orchi si affollano in un punto e spariscono, come se fossero entrati
      nei rovi senza scostarli. Le più fresche hanno ancora l'acqua sul fondo, e davanti al muro la terra è
      raschiata in una mezzaluna regolare.

      {furtivita Facile} A una decina di passi c'è una macchia di ginestre alta fino al petto, l'unico riparo
      fra qui e i pini. Se dovessi aspettare qualcuno, lo aspetteresti lì dietro.
    opzioni:
      - testo: "Cercare il passaggio"
        descrizione: "Gli orchi entrano da qualche parte, e di sicuro non si aprono la strada con i denti."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La stuoia
          testo: |
            Passi le dita lungo il muro una spanna alla volta, finché un pezzo di roveto ti si muove sotto la
            mano più leggero del resto. È una stuoia di rametti e di rovi intrecciati, legata con lo spago di
            budello a nodi piatti e fatta così bene che a due passi non la distingui dal resto. La sollevi da
            un lato. Sotto si apre un tunnel alto due metri che entra nel roveto, con il pavimento di terra
            battuta. Dal fondo esce un'aria più fredda di quella di fuori e porta con sé l'odore del fumo e
            del pesce.
          effetti: { profondita.rovolungo: 1 }
          imposta: { rovolungo.buco: 0 }
        fallimento:
          titolo: Le spine
          testo: |
            Infili le mani nei rovi dove le impronte finiscono e tasti alla cieca, e le spine bagnate entrano
            nella carne con una facilità che ti sorprende. Sono storte all'indietro, e a tirarle fuori fanno
            più male che a entrare. Quando ritiri le mani hai i dorsi rigati di sangue e una spina spezzata
            sotto l'unghia del pollice.

            Te la togli con i denti, sedut{o|a} nell'erba, mentre dall'altra parte le onde continuano a
            rompersi.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che passi un orco"
        descrizione: "Prima o poi qualcuno esce, o rientra. Basta stare dove non guarda."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il secchio di vongole
          testo: |
            Ti acquatti dietro un cespuglio di ginestre e aspetti. Dopo un'ora dal muro esce un orco con un
            secchio di vongole, che solleva un pezzo di roveto con una mano sola e se lo lascia ricadere alle
            spalle, e va verso gli scogli brontolando. Al ritorno ha il secchio pieno e i piedi bagnati fino
            alle caviglie, e il secchio perde acqua da una doga a ogni passo. Rientra dallo stesso punto senza
            guardarsi intorno. Conti fino a cento, poi vai a sollevare il roveto anche tu.
          effetti: { profondita.rovolungo: 1 }
          imposta: { rovolungo.buco: 0 }
        fallimento:
          titolo: La ginestra
          testo: |
            Ti acquatti dietro un cespuglio di ginestre, e il cespuglio è pieno di api. Resisti finché puoi.
            Quando scappi via agitando le braccia, l'orco con il secchio di vongole che stava uscendo dal muro
            ti guarda passare a bocca aperta, poi lascia il secchio e corre dentro a chiamare gli altri. Ti
            rintani fra i pini con la faccia gonfia e aspetti che le voci si calmino, contando le punture con
            la lingua dall'interno della guancia.
          effetti: { ferite: 0.5 }
      - testo: "Dare fuoco ai rovi"
        descrizione: "Le spine sono secche in cima. Più in basso un po' meno."
        esito:
          titolo: Il fumo
          testo: |
            Accendi un ciuffo di erba secca e lo spingi fra i rovi. Le spine secche in cima prendono fuoco e
            si spengono subito, e più sotto i rovi bagnati di nebbia fanno soltanto un fumo bianco e denso che
            sale dritto sopra il roveto. Dall'altra parte del muro qualcuno comincia a gridare in orchesco.
            Spegni tutto a calci e corri a nasconderti fra i pini, e ci resti fino a sera con il cuore in gola
            e gli occhi che lacrimano.
          effetti: { tormento: 1 }
      - testo: "Tagliarti un varco con il coltello"
        descrizione: "Spina per spina, a forza di polso. Il roveto è largo, e il coltello è corto."
        costo: 2
        esito:
          titolo: A forza di polso
          testo: |
            Tagli un ramo alla volta e lo tiri indietro con la manica avvolta intorno alla mano, e il roveto
            si richiude dietro di te quasi alla stessa velocità. Dopo un'ora sbuchi in un tunnel di terra
            battuta, alto due metri, scavato dagli orchi dentro i rovi. Hai le braccia graffiate fino ai
            gomiti e una spina nella guancia, che trovi soltanto quando sorridi di sollievo. Il coltello ha
            perso il filo e ha la lama impiastrata di linfa, e te lo fa capire alla prima radice che provi a
            tagliare.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }
          imposta: { rovolungo.buco: 0 }

  # 1 · dentro i tunnel
  - id: rovolungo-tunnel-di-cardi
    immagine: ambientazione/rovolungo
    titolo: Il tunnel di cardi
    sommario: "Sulla terra battuta c'è un solco largo, lasciato da qualcosa di grosso trascinato da poco."
    luogo: Rovolungo, i tunnel
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 1]
    testo: |
      Il tunnel serpeggia fra rovi e ortiche, alto quanto basta a un orco che cammini curvo. Le pareti sono
      rovi vivi piegati e legati l'uno all'altro con lo spago di budello, e dall'alto la luce passa a strisce.

      Le impronte sono quasi tutte di piedi nudi con le dita larghe, e in mezzo corre un solco liscio largo
      due mani che si perde dietro la curva. Su una spina è rimasto impigliato un ciuffo di crini neri con un
      riflesso verde da scarabeo. Nel tunnel le mosche girano intorno a tutto, e su quel ciuffo non se ne posa
      nessuna.

      {cavalcare Media} Sono crini di coda lunghi e spessi, come quelli dei cavalli da tiro dei Casati. Nessun
      cavallo così entra da solo in un buco dove tu cammini piegat{o|a}.
    opzioni:
      - testo: "Leggere il solco"
        descrizione: "Una cosa trascinata lascia segni diversi da una cosa che cammina."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La slitta
          testo: |
            Ai bordi ci sono i segni di due stanghe di legno, a un passo abbondante l'una dall'altra, e in
            mezzo un pelo lungo e nero, da coda di cavallo. Gli zoccoli non hanno mai toccato terra. Hanno
            trascinato un cavallo grande e privo di sensi su una slitta di rami, non più di qualche giorno fa,
            e il peso ha schiacciato la terra battuta di un dito buono. *Chi si porta un cavallo svenuto
            attraverso un roveto ha in mente qualcosa di preciso.* Il solco va verso il mare.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: Le ortiche
          testo: |
            Ti abbassi a guardare il solco da vicino e perdi l'equilibrio, e la mano che metti avanti finisce
            dritta in un cespo di ortiche. Le dita ti si coprono di bollicine bianche che bruciano a ondate.
            Te le succhi imprecando sottovoce per un pezzo, in tutte le lingue che conosci e in un paio che
            stai inventando, e quando torni a guardare il solco ti sembra un solco qualunque.
          effetti: { ferite: 0.5 }
      - testo: "Andare avanti carponi, senza rumore"
        descrizione: "Più in basso il tunnel è più largo, e le voci arrivano prima dei piedi."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Carponi
          testo: |
            Ti metti carponi e avanzi con i palmi sulla terra battuta, che a quest'altezza è fresca e odora di
            funghi. Alla seconda curva senti delle voci di orchi nel tunnel accanto, separato dal tuo da un
            palmo di spine, e resti ferm{o|a} finché non si allontanano. Uno dei due racconta qualcosa che fa
            ridere l'altro fino a tossire, e fra le spine ti arriva l'odore di pesce del suo fiato.

            Riparti con le ginocchia impolverate e una lumaca schiacciata sul palmo.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: Il ramo secco
          testo: |
            Il ginocchio trova un ramo secco, e il ramo si spezza con uno schiocco netto che corre lungo il
            tunnel. Dal tunnel accanto una voce gutturale fa una domanda, e una lancia entra fra le spine a
            una spanna dalla tua spalla. Ti appiattisci a terra con la guancia nel terriccio. Quando la lancia
            si ritira ha un filo del tuo mantello sulla punta, e tu hai un graffio lungo tutto il braccio.
          effetti: { ferite: 0.5 }
      - testo: "Tirare dritto, piegato in due"
        descrizione: "Il tunnel finisce da qualche parte. Intanto la schiena si arrangia."
        costo: 2
        esito:
          titolo: La schiena
          testo: |
            Avanzi piegat{o|a} in due per un tempo che ti sembra lunghissimo, con le spine che ti si
            impigliano nei capelli a ogni passo. Quando il tunnel finalmente si allarga e puoi raddrizzarti,
            la schiena fa un rumore che non le avevi mai sentito fare. Per un po' resti con le mani sui
            fianchi a guardare il cielo a strisce sopra i rovi, aspettando che le vertebre tornino ciascuna al
            suo posto.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }

  - id: rovolungo-buco-ululante
    immagine: ambientazione/rovolungo
    titolo: Il Buco Ululante
    sommario: "Tre tunnel finiscono in una sala di rovi. In fondo c'è un buco nel terreno, e dal buco sale il rumore del mare."
    luogo: Rovolungo, il Buco Ululante
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 1]
    testo: |
      Tre tunnel di cardi sbucano in una camera larga di rovi, e vicino alla parete ovest si apre nel terreno
      un buco largo quanto un pozzo. L'orlo è di roccia nera e bagnata, e il terriccio intorno ci scivola
      dentro a ogni passo.

      Dal buco sale il vento del mare, e a ogni onda un ululato lungo che cresce e si spegne. Fra un'onda e
      l'altra il vento torna indietro e tira giù nel buco le foglie secche e il fumo della camera. Te lo
      spieghi con l'acqua che sale e scende in una grotta là sotto e spinge l'aria come un mantice.

      Gli orchi hanno messo un cerchio di sassi intorno all'orlo. Accanto c'è un gabbiano morto legato a un
      paletto con un pezzo di rete, e più in là un altro paletto con la rete vuota. La rete vuota è tagliata
      in un punto solo, e i fili hanno i capi netti e senza sfilacci.

      {natura Media} Un gabbiano legato sopra un buco sul mare è un'esca, o un'offerta. Il paletto vuoto dice
      che qualcosa l'ha già accettata.
    opzioni:
      - testo: "Scegliere il tunnel giusto"
        descrizione: "Da qui partono tre strade, e una sola va verso il mare."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il solco
          testo: |
            Giri intorno alla sala chinat{o|a} sul terreno. Due tunnel hanno soltanto impronte vecchie,
            pestate da altre impronte. Nel terzo corre verso il mare il solco pulito di una slitta, e sui
            bordi ci sono gocce scure di resina, cadute dalle torce di chi lo ha percorso di notte. La resina
            cede ancora sotto l'unghia. Lo imbocchi con il vento del buco alle spalle.
          effetti: { profondita.rovolungo: 1 }
          imposta: { rovolungo.buco: 1 }
        fallimento:
          titolo: Il giro largo
          testo: |
            Scegli il tunnel con più impronte, e dopo un'ora esatta il tunnel ti riporta nella sala del buco,
            dall'altra parte. Gli orchi lo usano per fare il giro delle guardie, e a metà strada ha perfino
            una nicchia per pisciare, che riconosci dall'odore molto prima di vederla. Ti siedi un momento
            accanto al cerchio di sassi, e il vento del buco ti soffia in faccia a ogni onda finché ti viene
            il mal di testa.
          effetti: { tormento: 1 }
          imposta: { rovolungo.buco: 1 }
      - testo: "Calarti nel buco per guardare giù"
        descrizione: "La parete del pozzo è di roccia, con qualche appiglio. Bastano pochi metri."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La grotta
          testo: |
            Scendi con la schiena contro una parete e i piedi contro l'altra, finché il pozzo si apre sopra
            una grotta di mare. La roccia è coperta da una crosta di sale che ti scricchiola sotto i palmi.
            Una ventina di metri più sotto l'acqua sale e scende fra pareti che scintillano, e a sud c'è una
            sporgenza di roccia appena sopra le onde. Sulla sporgenza vedi delle ossa e un luccichio di
            metallo. Nell'acqua sotto la sporgenza gira in tondo una cosa grossa e lucida.

            {tecnologia Difficile} Quella cosa nuota con un ritmo troppo regolare per una bestia. Ogni giro le
            prende lo stesso tempo e passa sulla stessa linea.

            Risali più in fretta di quanto sei sces{o|a}.
          effetti: { profondita.rovolungo: 1 }
          imposta: { rovolungo.buco: 1 }
        fallimento:
          titolo: L'appiglio
          testo: |
            Un appiglio ti resta in mano e scivoli per due metri con la schiena contro la roccia, prima che il
            piede trovi una sporgenza. L'appiglio era una crosta di sale e di conchiglie, e ti si sbriciola
            fra le dita. Resti lì appes{o|a} sopra il buio, con il vento che ti sale fra le gambe e il rumore
            dell'acqua sempre più forte, e per un momento lungo pensi soltanto al piede e alla sporgenza.
            Quando riesci a risalire hai la camicia strappata e la schiena scorticata dalle spalle ai fianchi.
          effetti: { ferite: 0.5 }
          imposta: { rovolungo.buco: 1 }
      - testo: "Passare oltre senza guardare il buco"
        descrizione: "Lungo la parete opposta, con gli occhi sui piedi."
        costo: 2
        esito:
          titolo: Il colpo di metallo
          testo: |
            Attraversi la sala tenendoti contro la parete opposta, con gli occhi sui piedi, e a ogni ululato
            le spalle ti salgono da sole verso le orecchie. A metà ti fermi senza volerlo, perché dal buco, in
            mezzo al rumore del mare, ti è sembrato di sentire un colpo di metallo contro la roccia. Il colpo
            non torna con l'onda dopo e nemmeno con quella dopo ancora. Riprendi a camminare più in fretta, e
            non ti volti fino al tunnel.
          effetti: { profondita.rovolungo: 1, tormento: 1 }
          imposta: { rovolungo.buco: 1 }

  - id: rovolungo-nido-dei-profughi
    immagine: bestiario/orco
    titolo: Il nido dei profughi
    sommario: "Una decina di orchi magri, con le piume nei capelli, litiga intorno al fuoco."
    luogo: Rovolungo, il nido dei profughi
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 1]
    testo: |
      La camera è rotonda, con il soffitto di rovi così basso che il fumo ristagna a mezz'aria. Lungo le
      pareti ci sono nove giacigli di foglie e di felci intrecciate, e in quasi tutti c'è qualcuno. I due
      vicino all'uscita hanno le felci ancora schiacciate nella forma di chi ci dormiva, e nessuno ci si è
      sdraiato sopra.

      Sono una decina di orchi magri con le piume di uccello intrecciate nei capelli. *Spiumatori, la tribù
      del Gradone Rosso.* Le costole si contano sotto la pelle, e le lance stanno appoggiate al muro con le
      punte di selce legate al budello. Due litigano a voce bassa per un gabbiano crudo e lo tirano ciascuno
      dalla sua parte. Un altro intreccia una piuma nella treccia di una ragazza orca, che lo lascia fare a
      occhi chiusi.

      {origine fuggiasco-di-ghoran} Senza volerlo li pesi a occhio uno per uno, come si fa a Ghoran davanti
      alla bilancia. Ti vergogni del numero che ti viene fuori.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Sono tanti e affamati, e anche stanchi. Le lance stanno al muro."
        combattimento: nido-dei-profughi
        vittoria:
          titolo: Il gabbiano
          testo: |
            Il primo che ti arriva addosso ha la lancia girata al contrario, e dopo di lui gli altri esitano.
            Pesa poco, e quando lo spingi va giù senza fare resistenza. Quando due sono a terra il resto
            scappa nei tunnel e lascia il gabbiano conteso in mezzo alla camera. Rimane soltanto la ragazza
            con la treccia, seduta sul suo giaciglio con la piuma nuova fra i capelli, che ti guarda senza
            muoversi finché non sei uscit{o|a} dall'altra parte.
          effetti: { profondita.rovolungo: 1 }
        sconfitta:
          titolo: Nel fumo
          testo: |
            Sono troppi, e nel fumo non capisci da dove arrivano. Una lancia ti prende di striscio sul fianco
            e un'altra ti batte sulla nuca con il manico, e ti ritrovi carponi nel tunnel mentre loro ridono e
            ti tirano dietro le ossa del gabbiano. Nessuno ti insegue, perché hanno più paura di quello che
            c'è oltre il ponte che di te. Ti tocchi la nuca, e le dita tornano indietro appiccicose.
      - testo: "Parlare con loro"
        descrizione: "Hanno lasciato la loro tribù e hanno paura di Balthog. Chi ha paura, a volte, ha voglia di raccontarla."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Quelli che passano il ponte
          testo: |
            Entri con le mani aperte e ti siedi vicino al fuoco, e dopo un lungo silenzio un vecchio con mezzo
            orecchio comincia a parlare in un comune storpiato. Dopo la razzia sono scesi dal Gradone a
            chiedere asilo a Balthog, e Balthog li tiene qui. Ogni tre o quattro notti vengono gli orchi di
            Capomozzo e ne portano via due oltre il ponte, dalla *Mawrak'Thur*, e quelli non tornano. Mentre
            lo dice tiene gli occhi sui due giacigli vicino all'uscita.

            «Eravamo venti. Adesso siamo dieci» dice il vecchio, e dopo un momento, con lo stesso tono, ti
            chiede se hai del pane.
          effetti: { profondita.rovolungo: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il pane
          testo: |
            Entri con le mani aperte, e il vecchio con mezzo orecchio ti chiede se hai del pane. Quando dici
            di no, la ragazza con la treccia prende una lancia dal muro, e dopo di lei la prendono anche gli
            altri. Esci all'indietro con una punta di lancia che ti segue fino al tunnel, e lì ti punge la
            coscia, una volta sola, per avvertimento.
          effetti: { ferite: 0.5 }
      - testo: "Dare loro le tue razioni"
        descrizione: "Le gallette della Caserma e la carne secca. La strada del ritorno la farai con la cintura stretta."
        costo: 2
        esito:
          titolo: Dieci parti uguali
          testo: |
            Svuoti lo zaino sul pavimento e ti tiri indietro. Per un momento nessuno si muove. Poi il vecchio
            con mezzo orecchio divide le gallette in dieci parti uguali con un coltello di selce, e mentre gli
            altri mangiano a testa bassa ti fa cenno di passare. La selce è scheggiata e il vecchio la passa
            più volte nello stesso solco prima che la galletta si spezzi. La ragazza con la treccia mette da
            parte metà della sua parte, nascosta sotto le felci. I giorni dopo li cammini con la cintura
            stretta di due buchi e le gambe molli.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }

  - id: rovolungo-cucce-dei-cinghiali
    immagine: bestiario/cinghiale-crudele-mutato
    titolo: Le cucce dei cinghiali
    sommario: "Quattro cinghiali da guerra incatenati ai pali, e un passaggio stretto in mezzo. Le catene sono lunghe quasi abbastanza."
    luogo: Rovolungo, le cucce dei cinghiali
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 1]
    testo: |
      Pavimento e pareti sono coperti di setole scure e di ossa rosicchiate, alcune molto grosse. L'aria è
      calda e ferma, e sa di strame bagnato e di grasso rancido.

      A quattro pali sono incatenati quattro cinghiali da guerra con le zanne cerchiate di ferro. I pali sono
      tronchi interi piantati nella terra battuta, e intorno a ognuno il terreno è scavato in un solco tondo
      dove le bestie hanno girato per giorni. Appena ti vedono si buttano in avanti insieme, e le catene si
      tendono a un passo dal sentiero che attraversa la stanza. Uno ha al collo un campanaccio da capra, che a
      ogni strattone suona allegro come in un pascolo.

      {addestrare-animali Media} Il più grosso si butta sempre per primo, e gli altri gli vanno dietro. Se si
      calma lui, si calmano tutti.

      {origine figlio-del-circolo} Il giorno del Festival il cinghiale toccato dalla Marea respirava a
      strappi, con il ferro sotto la cotenna. Questi grugniscono come bestie sane, e ti sorprendi a esserne
      content{o|a}.

      Il passaggio in mezzo è largo due passi. Ai due lati la terra è rigata dalle zanne, e i graffi si
      fermano tutti sulla stessa linea dritta perché le quattro catene hanno la stessa lunghezza.
    opzioni:
      - testo: "Calmarli con la voce"
        descrizione: "Anche una bestia da guerra si può calmare, se chi le parla non ha paura."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: La cantilena
          testo: |
            Ti fermi a distanza e parli piano, sempre con la stessa cantilena e senza guardarli negli occhi.
            Il più grosso smette di tirare per primo e poi smettono anche gli altri. Le catene tornano a
            pendere molli fino a terra. Passi in mezzo con la stessa voce e lo stesso passo, e quello con il
            campanaccio ti annusa la mano senza morderla. Ha il muso umido e caldo, e ti lascia sulle dita un
            odore di ghiande. Sulla soglia ti accorgi che stai ancora cantilenando, e che la cantilena è una
            ninna nanna che non ricordavi di sapere.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: La zanna
          testo: |
            Parli piano, ma la voce ti trema e le bestie lo sentono subito. Il più grosso si butta in avanti
            con tutto il peso finché il palo si piega, e la zanna cerchiata di ferro ti prende la coscia di
            striscio prima che tu riesca a tirarti indietro. Il ferro è freddo, e la ferita comincia a
            bruciare soltanto quando sei già fuori portata. Torni al tunnel zoppicando, con il campanaccio che
            suona alle tue spalle allegro come prima e del tutto indifferente alla tua coscia.
          effetti: { ferite: 0.5 }
      - testo: "Parlare loro con il Richiamo"
        descrizione: "Nella lingua che il Circolo insegna ai bambini, anche un cinghiale da guerra si sente chiamare."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il nome
          testo: |
            Dici le parole del Richiamo a bassa voce, e i quattro cinghiali alzano il muso nello stesso
            momento. Le catene smettono di tintinnare una dopo l'altra, e nella stanza resta soltanto il fiato
            delle bestie. Uno alla volta si accucciano ai piedi dei pali, con le orecchie girate verso di te e
            il vapore che sale dai musi nell'aria fredda della stanza. Passi in mezzo senza fretta, e il
            campanaccio resta muto per tutto il tempo.

            Dall'altra parte ti tremano le mani, e le infili sotto le ascelle.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: La paura
          testo: |
            A metà della formula la voce ti si incrina, e i cinghiali sentono soltanto la tua paura. Si
            buttano in avanti tutti e quattro insieme, e un palo esce dal terreno di una spanna con la terra
            che si spacca intorno alla base. Ti tiri indietro inciampando nelle ossa e ti sbucci i palmi sul
            pavimento duro. Dal tunnel li senti grugnire ancora a lungo, mentre ti togli le setole dai graffi
            una alla volta. Intanto ripeti la formula a mezza voce, ed è giusta, adesso che non serve più.
          effetti: { ferite: 0.5 }
      - testo: "Passare fuori dalla portata delle catene"
        descrizione: "Lungo la parete c'è una striscia dove le zanne non arrivano. È stretta."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Rasente il muro
          testo: |
            Studi le catene anello per anello e vedi che lungo la parete nord c'è una striscia di terra dove
            nessuna zanna arriva, larga quanto un piede. Ci passi di fianco, con la schiena contro i rovi e le
            spine che ti si piantano nella giubba, mentre i cinghiali si sfiancano a tirare a un palmo dai
            tuoi stivali. Le catene schioccano tese a ogni strattone. La bava del più vicino ti schizza le
            ginocchia, ed è calda. Dall'altra parte ti stacchi dal muro una spina alla volta.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: Il palmo in meno
          testo: |
            La striscia lungo la parete è più stretta di quanto sembrava. A metà il piede ti scivola sulle
            setole, che lì sono ammucchiate in uno strato unto, e il cinghiale più vicino ti arriva addosso
            con il muso prima che la catena lo fermi e ti butta contro i rovi. Esci dall'altra parte con un
            livido sul fianco e la giubba piena di spine. Ti siedi un momento a tirarle via, mentre il fianco
            comincia a cambiare colore sotto la camicia.
          effetti: { ferite: 0.5 }
      - testo: "Lanciare le ossa e passare mentre litigano"
        descrizione: "Di ossa ce ne sono tante, e i cinghiali sono quattro. Basta lanciarle bene."
        costo: 2
        esito:
          titolo: Le ossa
          testo: |
            Raccogli le ossa più grosse, lunghe quanto un avambraccio e spaccate per il midollo, e le lanci in
            fondo alla stanza una dopo l'altra. I cinghiali si girano a contendersele con un rumore di zanne
            contro l'osso, e tu passi in mezzo. L'ultimo osso lo lanci male, e quello con il campanaccio si
            gira di nuovo verso di te un attimo prima che tu sia fuori dalla sua portata, con il campanaccio
            che suona a festa. La zanna ti lascia un taglio lungo e pulito sul polpaccio.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }

  # 2 · sulla scogliera
  - id: rovolungo-posti-di-guardia
    immagine: ambientazione/rovolungo
    titolo: I posti di guardia
    sommario: "Due casotti di rovi e di legno di mare, sulla scogliera. Ci dovrebbe essere qualcuno di guardia, e sono vuoti."
    luogo: Rovolungo, sulla scogliera
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 2]
    testo: |
      Il tunnel sbuca sul bordo della scogliera, e dopo tanta penombra la luce ti fa socchiudere gli occhi. Ai
      lati del sentiero ci sono due posti di guardia, casotti bassi di rovi e legno portato dal mare con le
      feritoie sul sentiero. Il legno è grigio e liscio di sale, e i rovi ci sono intrecciati sopra fitti come
      in un cesto. In fondo, dove la scogliera finisce, si vedono i pali di un ponte.

      I casotti sono vuoti, e nei focolari di sassi la cenere è fredda. Il vento entra dalle feritoie con un
      fischio basso e smuove la paglia sul pavimento. Su un'asse qualcuno ha inciso un tavoliere, e le pedine
      di sassolini bianchi e neri sono rimaste a metà di una partita che uno dei due stava vincendo di
      parecchio.
    opzioni:
      - testo: "Frugare nei casotti"
        descrizione: "Chi passa le giornate di guardia si fa un nascondiglio, per le cose sue."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: L'asse che suona vuota
          testo: |
            Sotto la paglia del secondo casotto trovi un'asse che suona vuota. Nel buco c'è un sacchetto di
            cuoio indurito dal sale con delle monete di Qir-Azel sporche di terra, insieme a un corno da
            richiamo con l'imboccatura masticata. Le monete vengono quasi certamente dalla razzia, e le
            prendi. Su una c'è ancora il segno di un morso, di qualcuno che voleva essere sicuro.

            {origine mercante-dei-ponti} Hanno il conio di quest'anno e i bordi ancora netti. Al banco le
            avresti passate sulla bilancia una per una, e per esperienza il morso lo dà chi una bilancia non
            ce l'ha.
          effetti: { profondita.rovolungo: 1, monete: 12 }
        fallimento:
          titolo: Le vespe
          testo: |
            Sollevi la paglia del secondo casotto e sotto c'è un nido di vespe grande quanto una testa. Il
            nido è di carta grigia masticata. Corri fuori agitando le braccia fino al bordo della scogliera, e
            ti fermi a un passo dal vuoto con tre punture sul collo e il cuore che martella. Il collo ti si
            gonfia sotto le dita. Il vento si porta via il ronzio, e la partita di pedine resta a metà.
          effetti: { ferite: 0.5 }
      - testo: "Salire sul tetto e guardare l'isola"
        descrizione: "Il casotto è basso, ma da lassù si vede oltre il bordo della scogliera."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La testa mozzata
          testo: |
            Ti arrampichi sul tetto di rovi tenendoti alle travi di legno di mare, e da lassù vedi l'isola. È
            tonda, con la cima piatta, a una ventina di metri dalla scogliera, e vista da qui ha davvero la
            forma di una testa mozzata. In cima c'è una palizzata di tronchi appuntiti alta quanto una casa,
            con due torri di guardia sul lato sud. Da dentro la palizzata sale il fumo di un fuoco, e il vento
            lo schiaccia verso il mare. Sulla torre più vicina due orchi si passano una bottiglia.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: Il tetto
          testo: |
            Il tetto di rovi regge il primo ginocchio e cede sotto il secondo, e ti ritrovi dentro il casotto
            sedut{o|a} nella cenere fredda, con il tavoliere rovesciato e le pedine sparse dappertutto. Ti
            rialzi con una spina conficcata nel sedere. Prima di uscire rimetti le pedine sul tavoliere a
            memoria, come ti sembra che stessero, e lasci in vantaggio quello che stava vincendo.
          effetti: { ferite: 0.5 }
      - testo: "Aggirare i casotti fra i rovi"
        descrizione: "Lontano dalle feritoie, sul bordo della scogliera. Il vuoto resta a sinistra."
        costo: 2
        esito:
          titolo: Sul bordo
          testo: |
            Esci dal sentiero e giri largo intorno ai casotti, fra i rovi che crescono sul bordo della
            scogliera, per non passare davanti alle feritoie. Il vuoto ti resta a un passo sulla sinistra, e a
            ogni folata la terra del bordo si sbriciola sotto il tallone e cade senza che tu la senta arrivare
            in fondo. Ci metti un'ora per fare cento passi. Quando torni sul sentiero hai le mani graffiate e
            i calzoni a brandelli dal ginocchio in giù.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }

  - id: rovolungo-ponte-di-corda
    immagine: ambientazione/capomozzo
    titolo: Il ponte di corda
    sommario: "Fra la scogliera e l'isola di Capomozzo c'è un ponte di corda sospeso sopra il mare, che cigola a ogni colpo di vento."
    luogo: Rovolungo, il ponte per Capomozzo
    area: rovolungo
    ripetibile: true
    requisiti: [pista.capomozzo == 1, profondita.rovolungo == 2]
    testo: |
      Dal bordo della scogliera un ponte di corda attraversa il braccio di mare fino all'isola, una ventina di
      metri più a nord. L'isola è tonda con la cima piatta, e sopra c'è una palizzata alta quanto una casa con
      due torri di guardia sul lato sud. Gli orchi restano dietro le assi, e si sente qualcuno che martella. I
      colpi arrivano regolari e il vento li copre a ogni folata.

      Il ponte ha corde lucide e assi robuste, e ondeggia a ogni colpo di vento sopra gli scogli. Le corde
      sono di canapa scura di catrame, e le assi sono spesse due dita e legate una per una con un giro doppio.
      Gli scogli sotto il ponte sono bianchi di guano, e non c'è un gabbiano posato da nessuna parte.

      {origine apprendista-raschiatore} Sulle piattaforme della Cicatrice un ponte di corda si guarda prima
      dagli attacchi, e le mani vanno da sole a tastare i nodi del primo palo. Sono nodi da marinaio stretti
      bene, diversi da quelli che ti hanno insegnato.
    opzioni:
      - testo: "Studiare gli attacchi del ponte"
        descrizione: "Un ponte che porta a una fortezza di orchi merita di essere guardato da sotto."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Le corde segate
          testo: |
            Ti stendi a pancia in giù sul bordo e guardi gli attacchi da vicino. Le corde del lato ovest sono
            segate a metà dalla parte che non si vede, e chi ci passa carico o di corsa finisce in mare. Il
            taglio è netto e i trefoli tagliati non si sono ancora sfilacciati. Dalla parte dell'isola, alla
            base dei pali, pendono delle corde annodate più chiare delle altre, nuove. Con quelle il ponte si
            lega meglio, e gli orchi l'hanno fatto da poco, per farci passare un peso grosso.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: L'asse
          testo: |
            Ti sporgi per guardare sotto la prima asse, e l'asse si inclina sotto il gomito. Sotto di te non
            c'è più niente, e laggiù le onde si rompono sugli scogli senza che il rumore arrivi fin quassù. Ti
            tiri indietro con le unghie piantate nella terra e resti stes{o|a} a guardare il cielo, con il
            gomito sbucciato e una nausea che non passa.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare piano, a mani vuote"
        descrizione: "Senza zaino e senza fretta, un'asse alla volta. Dall'altra parte ci sono delle corde per legarlo meglio."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Un'asse alla volta
          testo: |
            Lasci lo zaino sulla scogliera e attraversi un'asse alla volta, con le mani sulle corde e gli
            occhi sull'asse successiva. A metà il ponte scende di un palmo sotto i piedi con uno scricchiolio
            di nodi, e poi si ferma. Dall'altra parte, sotto la palizzata, trovi le corde annodate alla base
            dei pali e le leghi agli attacchi del lato ovest, con le dita che sbagliano il primo nodo e
            azzeccano il secondo. Quando torni indietro il ponte ondeggia meno, e le gambe ti tremano fino
            alla scogliera.
          effetti: { profondita.rovolungo: 1 }
        fallimento:
          titolo: Il lato ovest
          testo: |
            A metà il vento ti spinge e tu acceleri il passo senza volerlo, e il lato ovest del ponte cede di
            colpo con lo schiocco delle corde segate. Le assi si mettono di traverso e ti ritrovi appes{o|a}
            alla corda dell'altro lato, con le gambe nel vuoto e le onde sotto di te. Risali un braccio alla
            volta e torni alla scogliera strisciando sulle assi storte. Le mani sono bruciate dalla corda, e
            sui palmi ti resta il nero del catrame.
          effetti: { ferite: 1 }
      - testo: "Aspettare che cali il vento"
        descrizione: "Prima o poi il vento cala, e intanto sulla scogliera fa freddo."
        costo: 2
        esito:
          titolo: Al tramonto
          testo: |
            Ti rannicchi dietro un masso con il mantello sopra la testa e aspetti. Il vento cala soltanto al
            tramonto, quando dall'isola arriva odore di carne arrosto e sulle torri accendono le torce. Il
            sole scende dietro l'isola, e la palizzata diventa una sagoma nera. Quando passi il ponte è fermo
            e le assi sono umide di nebbia, e le dita dei piedi hai smesso di sentirle da un pezzo. Torni
            indietro allo stesso modo, piano, con i denti che battono.
          effetti: { profondita.rovolungo: 1, ferite: 0.5 }

  # ------------------------------------------------------------ la grotta del Ghermitore (C27, facoltativa)
  # Si apre dopo il Buco Ululante (rovolungo.buco) ed è una deviazione: non fa avanzare. Si chiude quando
  # prendi il respiratore; chi fallisce o perde può riprovarci.
  - id: la-grotta-del-ghermitore
    immagine: ambientazione/rovine-dei-precursori
    titolo: La grotta sotto il Buco
    sommario: "Sotto il Buco Ululante si apre una grotta di mare. Sulla sporgenza luccica del metallo, e nell'acqua scura gira in tondo una bestia."
    luogo: Rovolungo, la grotta sotto il Buco Ululante
    area: rovolungo
    requisiti: [pista.capomozzo == 1, profondita.rovolungo >= 1, rovolungo.buco == 1, ghermitore == 0]
    testo: |
      Leghi la corda al paletto del gabbiano e ti cali nel Buco Ululante, con il vento che ti sale addosso a
      ogni onda. La roccia del pozzo è liscia di salsedine, e la corda ci sfrega sopra con un fruscio lungo.
      Il pozzo sbuca nella volta di una grotta, e ti lasci scivolare fino a una sporgenza di roccia lunga
      quattro passi, l'unico punto asciutto sul lato sud.

      Sulla sporgenza ci sono ossa di foca e lo scheletro di un uomo con la cintura degli attrezzi da
      Raschiatore ancora allacciata. Le ossa di foca sono tutte spezzate in due punti con un taglio netto. Il
      cuoio della cintura si sfalda sotto le dita e gli attrezzi sono grumi di ruggine. Accanto al teschio c'è
      una maschera liscia di metallo grigio che la salsedine non ha nemmeno sfiorato.

      {origine apprendista-raschiatore} La cintura ha la fibbia sul fianco, come la allacciano sulle
      piattaforme. Forse al Ponte dei Morti c'è una lanterna anche per lui.

      {tecnologia Media} Un metallo che il sale non intacca l'hanno lavorato i Precursori. La maschera non ha
      una saldatura né un ribattino, e il bordo è sottile e senza un graffio.

      Quaggiù l'ululato arriva soltanto dalla bocca del pozzo. Intorno alla sporgenza l'acqua sale e scende
      con uno sciabordio lento. Poi l'acqua gorgoglia, e dalla schiuma scura esce una testa lucida fatta per
      metà di carne e per metà di metallo, coperta di scaglie d'acciaio corroso. Due occhi dorati senza
      pupilla si accendono nella penombra. La bocca si apre a scatti su due file di denti d'acciaio ricurvi, e
      dalle giunture escono sbuffi di vapore che sanno di olio bruciato.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "Sulla sporgenza c'è posto per uno, e l'acqua è tutta sua."
        combattimento: ghermitore
        vittoria:
          titolo: La maschera grigia
          testo: |
            Il Ghermitore si getta sulla sporgenza tre volte, e alla terza la tua lama trova la carne fra due
            scaglie. Si ritira sott'acqua lasciando una scia scura e oleosa che sa di olio bruciato, e non
            torna più a galla. Fra i denti d'acciaio che ha perso sulla roccia c'è un cristallo grezzo che
            pulsa ancora, tiepido nel palmo. Lo prendi, poi prendi la maschera grigia accanto al teschio del
            Raschiatore e gli chiedi scusa a mezza voce senza sapere bene perché. Risali la corda con le
            braccia che tremano.
          effetti: { oggetto.respiratore: 1, ghermitore: 1, cristalli.cristallo-carico: 1 }
        sconfitta:
          titolo: Sott'acqua
          testo: |
            Il Ghermitore ti prende per una caviglia e ti tira giù, e per un tempo lungo quanto il fiato che
            hai vedi soltanto bolle e una luce dorata. La presa sulla caviglia è dura e liscia, e non si
            scalda contro la tua pelle. Riesci a liberarti con un calcio e riemergi sotto la volta, e con le
            ultime forze ti aggrappi alla corda. Risali a mani vuote, e in cima ti stendi accanto al cerchio
            di sassi a vomitare acqua di mare.
      - testo: "Gettargli un'esca lontano dalla sporgenza"
        descrizione: "Gli orchi gli danno da mangiare i gabbiani. Un gabbiano che cade dall'altra parte della grotta potrebbe bastare, se l'onda non lo riporta indietro."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: Il gabbiano del paletto
          testo: |
            Aspetti che l'onda si ritiri e lanci il gabbiano che hai staccato dal paletto contro la parete
            opposta, dove l'acqua è più bassa. Il Ghermitore ci si gira contro con uno scatto di metallo e uno
            stridio di scaglie, e mentre lo sbrana ti chini sullo scheletro e prendi la maschera grigia. È più
            leggera di quanto pensavi, e fredda come l'acqua. Quando torna a guardare la sporgenza sei già a
            metà della corda.
          effetti: { oggetto.respiratore: 1, ghermitore: 1 }
        fallimento:
          titolo: L'onda
          testo: |
            Lanci il gabbiano verso la parete opposta, e l'onda lo riporta indietro fino ai piedi della
            sporgenza. Il Ghermitore lo prende, e con lo stesso slancio prende anche il tuo stivale. Ti
            trascina nell'acqua fino alle ginocchia prima che tu riesca ad aggrapparti alla corda. Risali con
            il polpaccio aperto fino all'osso e senza la maschera, e sotto di te l'acqua torna liscia come se
            niente fosse caduto.
          effetti: { ferite: 2 }
      - testo: "Ordinargli di fermarsi"
        descrizione: "È fatto di carne e di metallo, e il metallo è dei Precursori. Una parte di lui forse capisce ancora la lingua delle macchine."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: L'ordine
          testo: |
            Dici l'ordine nella lingua delle macchine, e gli occhi dorati del Ghermitore si spengono uno dopo
            l'altro. Resta a galla immobile, con il vapore che gli esce piano dalle giunture e si fa sempre
            più sottile, finché la corrente lo porta sott'acqua. Nella grotta resta soltanto lo sciabordio
            contro la sporgenza. Prendi la maschera grigia accanto al teschio e un cristallo che pulsa fra le
            ossa di foca, e risali con un gusto di ferro sulla lingua.
          effetti: { oggetto.respiratore: 1, ghermitore: 1, cristalli.cristallo-carico: 1 }
        fallimento:
          titolo: L'eco storta
          testo: |
            Dici l'ordine e il Ghermitore si ferma, e per il tempo di contare fino a tre ci credi davvero. Poi
            inclina la testa da un lato e ripete il suono più forte e più storto con la sua bocca di metallo.
            Il suono ti rimbomba dentro il cranio finché non vedi più niente. Quando ti si schiarisce la vista
            sei già sulla corda, a metà strada, con il naso che sanguina e una mano aperta dai denti
            d'acciaio.
          effetti: { ferite: 1, tormento: 1.5 }
      - testo: "Strisciare fino allo scheletro quando si immerge"
        descrizione: "Prima o poi va sotto. La sporgenza è lunga quattro passi, e lui sente tutto quello che cade in acqua."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Quattro passi
          testo: |
            Aspetti che il Ghermitore si immerga e strisci sulla sporgenza a pancia in giù, con l'acqua che ti
            bagna i gomiti e la roccia viscida di alghe sotto i palmi. Sfili la maschera da sotto il teschio
            piano, perché le ossa non facciano rumore, e torni indietro allo stesso modo contando i passi a
            fior di labbra. Sei già sulla corda quando l'acqua si apre alle tue spalle e i denti d'acciaio si
            chiudono sul vuoto con un rumore di cesoie.
          effetti: { oggetto.respiratore: 1, ghermitore: 1 }
        fallimento:
          titolo: L'osso di foca
          testo: |
            A metà della sporgenza il ginocchio fa rotolare un osso di foca nell'acqua, e l'acqua si apre
            subito. I denti d'acciaio ti si chiudono sull'avambraccio e ti tirano verso il bordo, e ti liberi
            soltanto lasciandoci la manica e un pezzo di pelle. I denti sono freddi quanto l'acqua da cui
            escono. Torni alla corda strisciando all'indietro e risali a forza di gomiti, lasciando sulla
            roccia una scia di sangue.
          effetti: { ferite: 2 }
      - testo: "Restare appeso alla corda, come sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice si lavora appesi, e i piedi non si posano dove arriva qualcosa dal basso."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: "Appes{o|a}"
          testo: |
            Ti fai un cappio sotto le ascelle con il nodo che ti hanno insegnato il primo giorno sulle
            piattaforme, e scendi fino a mezzo braccio dalla sporgenza senza toccarla. La corda ti segue con
            un cigolio leggero sul bordo del pozzo. Quando il Ghermitore si immerge ti allunghi, sfili la
            maschera da sotto il teschio e ti tiri su a forza di braccia. I denti d'acciaio si chiudono
            nell'aria sotto i tuoi stivali, con un rumore di cesoie che senti fin nelle ginocchia.
          effetti: { oggetto.respiratore: 1, ghermitore: 1 }
        fallimento:
          titolo: Il cappio
          testo: |
            Il nodo ti scivola sotto un'ascella proprio mentre ti allunghi, e resti appes{o|a} di sbieco con
            un braccio nell'acqua. L'acqua è più fredda di quanto ti aspettavi. Il Ghermitore ti prende il
            braccio sopra il polso. Ti liberi tirando con tutto il peso sulla corda e risali con la manica
            strappata e il braccio aperto, senza la maschera. In cima rifai il nodo da capo, giusto, per
            vedere dove avevi sbagliato.
          effetti: { ferite: 2 }

  # ------------------------------------------------------------ il cuore · 1 → 2 · la tana di Borgoth (C6–C7)
  - id: borgoth-e-cenerascura
    immagine: personaggi/borgoth-il-gigante
    titolo: La tana di Borgoth
    sommario: "Nel nido di ortiche dorme un gigante, e accanto a lui un puma color brace."
    luogo: Rovolungo, la tana di Borgoth
    area: rovolungo
    requisiti: [pista.capomozzo == 1, profondita.rovolungo >= 3]
    testo: |
      Dal soffitto di spine pende un groviglio di rampicanti, con scheletri di uccelli e mascelle di volpe che
      tintinnano quando passa l'aria. Il pavimento è un tappeto di ortiche alte fino al ginocchio, e nell'aria
      c'è un odore di cenere vecchia.

      L'inquilino del nido è sveglio e ti guarda. È un orco enorme con fili d'erba che gli crescono fra le
      cicatrici, e a Fondobosco dicono che sua madre fosse un'ogre. Accanto a lui è sdraiato un puma dal pelo
      color brace che sbuffa un filo di vapore, e le ortiche sotto il suo fianco sono afflosciate e scure.

      {addestrare-animali Media} Una bestia che non minaccia sta aspettando un ordine.

      {origine figlio-del-circolo} Al Circolo ti hanno insegnato che una bestia legata a qualcuno si legge
      guardando lui. Il puma ha gli occhi su di te e le orecchie girate verso Borgoth.

      «Borgoth sa perché sei qui» dice l'orco alzandosi piano. «L'odore di Qir-Azel, Borgoth lo sente da tre
      stanze, e anche Cenerascura.»

      Alza le braccia e grida parole in una lingua che non è l'orchesco. Dalle cicatrici gli filtrano
      fiammelle dorate, e dalle spalle gli spuntano rami carbonizzati che scricchiolano come un ceppo nel
      camino. Cresce finché diventa un gigante di corteccia nera per metà fuoco e per metà sottobosco, e il
      calore ti arriva in faccia da tre passi e ti secca gli occhi.

      {magia Media} Il fuoco che gli corre addosso è Mana selvatico che la terra gli presta tutto in una
      volta, e durerà poco.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Un gigante che brucia e un puma che salta prima che tu lo veda partire. Alle spalle hai soltanto rovi."
        combattimento: borgoth-e-cenerascura
        vittoria:
          titolo: In ginocchio
          testo: |
            Il puma ti arriva addosso per primo, e quando lo ricacci indietro con un taglio sul muso si ritira
            in un angolo della camera, soffiando. Borgoth è più lento. Il fuoco gli si spegne addosso un colpo
            alla volta, e la corteccia gli cade dalle braccia in scaglie nere che fumano fra le ortiche.
            Quando cade in ginocchio è di nuovo un orco grande e ansante, con il fumo che gli sale dalle
            spalle e l'erba bruciacchiata fra le cicatrici. Gli metti la lama alla gola, e lui ride piano, con
            un suono di ghiaia mossa.
          segue: borgoth-parla
        sconfitta:
          titolo: Le ortiche
          testo: |
            L'ultima cosa che vedi è il braccio di corteccia che cala, e poi le ortiche contro la faccia.
            Quando riapri gli occhi la camera è vuota e fredda, e del fuoco restano soltanto i segni neri sui
            rampicanti e un odore di resina bruciata. Borgoth e il puma ti hanno lasciato viv{o|a} in mezzo
            alle ortiche, e le loro impronte vanno verso est, dalla parte di Fondobosco. Ti trascini fino al
            ponte con le costole che scricchiolano a ogni passo.
          effetti: { pista.capomozzo: 1, tormento: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Calmare il puma"
        descrizione: "Se il puma si accuccia, forse si ferma anche il gigante. Ci vogliono una mano ferma e una voce che non tremi."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Difficile }
        successo:
          titolo: Il puma accucciato
          testo: |
            Ti abbassi sui talloni e porgi al puma il dorso della mano, parlando piano, mentre il calore ti
            arriccia le sopracciglia. Il puma ti annusa a lungo, con un fiato caldo che odora di carne cruda.
            Poi si stende fra te e il suo padrone, con il mento sulle zampe. Borgoth abbassa le braccia. Il
            fuoco gli si ritira sotto la pelle con un sibilo, e resta un orco grande che guarda il suo puma
            come se lo avesse tradito. Il puma, sotto quello sguardo, sbadiglia.
          pe: { addestrare-animali: 5 }
          segue: borgoth-parla
        fallimento:
          titolo: La zampata
          testo: |
            Il puma ti annusa la mano e poi la prende fra i denti, e mentre cerchi di liberarti ti apre la
            spalla con una zampata. Borgoth fischia una volta. Il puma ti lascia e corre da lui, e il gigante
            di fuoco ti guarda a lungo dall'alto. Poi si gira e sparisce nei tunnel verso est, e dove è
            passato le ortiche fumano. Resti fra le ortiche a tamponarti la spalla con la manica, e le
            ortiche, per completare il lavoro, ti bruciano le caviglie.
          effetti: { ferite: 2, pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Chiamare il puma con il Richiamo"
        descrizione: "Il Circolo ha una parola anche per lui, e dovrà valere più della voce del suo padrone."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La parola del Circolo
          testo: |
            Dici la parola del Richiamo, e il puma si ferma a metà del salto e atterra di fianco, scrollando
            la testa. Lo chiami ancora, e lui viene a strusciarsi contro le tue gambe con un rumore di brace
            che si spegne. Il pelo è caldo attraverso i calzoni. Borgoth guarda prima il suo puma e poi te, e
            abbassa le braccia. Il fuoco gli si ritira sotto la pelle, e resta un orco grande e offeso, con il
            fumo che gli esce dalle spalle.
          segue: borgoth-parla
        fallimento:
          titolo: La parola storta
          testo: |
            La parola ti esce storta, e il puma la prende per una sfida. Ti salta addosso e ti butta a terra,
            e senti i suoi baffi ruvidi sulla faccia e il suo peso sul petto prima che Borgoth lo richiami con
            un fischio. Il gigante ti scavalca senza degnarti di uno sguardo, e il calore ti passa sopra come
            da un forno aperto. Se ne va nei tunnel verso est, con il puma alle calcagna.
          effetti: { ferite: 2, pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Parlargli di Balthog"
        descrizione: "Forse Balthog non piace nemmeno a lui."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Difficile }
        successo:
          titolo: Lo sputo
          testo: |
            Gli dici che sei venut{o|a} per Balthog e per chi gli dà gli ordini, e che con Fondobosco non hai
            niente da spartire. Borgoth resta fermo, con le fiamme che gli corrono sulle braccia. Poi sputa
            per terra, e lo sputo sfrigola sulle ortiche.

            Il fuoco gli si ritira sotto la pelle un poco alla volta, e la corteccia sulle spalle si crepa e
            cade in scaglie. Resta un orco grande che si siede su una radice e fa cenno al puma di stare giù.
          pe: { persuasione: 5 }
          segue: borgoth-parla
        fallimento:
          titolo: Il dorso della mano
          testo: |
            Gli dici che sei venut{o|a} per Balthog, e Borgoth ride. Poi ti colpisce con il dorso della mano,
            senza nemmeno chiudere il pugno, e ti manda a sbattere contro il muro di spine. Il dorso della sua
            mano è duro e caldo come una pietra lasciata al sole.

            «Borgoth non parla con chi viene da Qir-Azel» dice, e se ne va nei tunnel verso est con il puma.

            Hai la guancia gonfia e un dente che si muove, e la lingua continua a tornarci sopra per
            controllare. Poi prendi la strada del ponte.
          effetti: { ferite: 2, pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Farti da parte e lasciarli passare"
        descrizione: "Non sei venut{o|a} per lui, e Borgoth non è un orco di Capomozzo. Forse non ha voglia di bruciare per Balthog."
        esito:
          titolo: Verso Fondobosco
          testo: |
            Ti sposti contro la parete con le mani lontane dalla cintura e lasci libero il passaggio. Borgoth
            ti guarda a lungo, con il fuoco che gli scorre sulle braccia. Poi grugnisce, abbassa la testa
            sotto i rampicanti e se ne va nel tunnel verso est, e il puma gli trotta dietro voltandosi due
            volte. Lo senti allontanarsi fra i rovi per un pezzo, con le ossa d'uccello che tintinnano al suo
            passaggio. Dove è passato restano le ortiche bruciate. Quando non senti più niente prendi la
            strada del ponte.
          effetti: { pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Ascoltare il puma come al Circolo"
        descrizione: "Al Circolo si ascolta una bestia prima di guardarla. Il puma aspetta un ordine, e un ordine si può dare anche con il respiro."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Difficile }
        successo:
          titolo: La voce dei puledri
          testo: |
            Ti accovacci all'altezza del puma e respiri lento come lui, con le mani aperte sulle ginocchia,
            finché smette di guardarti la gola. Senti il calore che gli esce dal pelo e ti asciuga il sudore
            sulla fronte. Poi parli tutto in una volta, con la voce bassa che al Circolo si usa per i puledri.
            Il puma sbadiglia e si stende con il mento sulle zampe. Borgoth lo guarda a lungo, e il fuoco gli
            si ritira sotto la pelle con un sibilo di legna bagnata.
          segue: borgoth-parla
        fallimento:
          titolo: Troppo presto
          testo: |
            Il puma sente il tuo respiro cambiare un momento troppo presto e ti salta addosso. Ti apre la
            spalla con una zampata prima che Borgoth lo richiami con un fischio, e la ferita sa di pelo
            bruciato. Il gigante ti guarda dall'alto senza dire niente, poi se ne va nei tunnel verso est con
            il puma alle calcagna. Ti tamponi la spalla con la manica, e quando la manica è zuppa prendi la
            strada del ponte.
          effetti: { ferite: 2, pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Lasciare che il fuoco si consumi"
        descrizione: "All'Accademia lo spiegano al primo anno. Il Mana preso tutto in una volta si consuma in fretta, e basta restare fuori portata finché dura."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [magia, resilienza], difficolta: Difficile }
        successo:
          titolo: Il conto del Mana
          testo: |
            Arretri un passo alla volta, sempre fuori dalla portata delle sue braccia, e conti a mezza voce
            come in laboratorio quando aspetti che un cristallo si scarichi. Al trentesimo le fiammelle sulle
            cicatrici di Borgoth si fanno più basse e il calore in faccia diminuisce. Al cinquantesimo la
            corteccia comincia a creparsi sulle spalle, con lo schiocco secco del legno che si asciuga troppo
            in fretta. Borgoth se ne accorge e abbassa le braccia prima che il fuoco gli muoia addosso, e ti
            guarda storto, come uno a cui hanno contato le carte.
          segue: borgoth-parla
        fallimento:
          titolo: La schiena contro le spine
          testo: |
            Arretri contando a mezza voce, e al dodicesimo la schiena tocca il muro di spine. Borgoth ha
            capito il gioco prima di te. Il braccio di corteccia ti prende di piatto sul petto e ti lascia
            senza fiato fra le ortiche, con l'odore di resina bruciata nel naso. Quando riesci a rialzarti il
            gigante e il puma sono già nei tunnel verso est. Il fuoco intanto si è spento da solo, proprio
            come dicevano i libri.
          effetti: { ferite: 2, pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo

  - id: borgoth-parla
    immagine: personaggi/borgoth-il-gigante
    titolo: Borgoth parla
    tipo: seguito
    luogo: Rovolungo, la tana di Borgoth
    area: rovolungo
    requisiti: [pista.capomozzo == 1]
    testo: |
      Borgoth siede fra le ortiche con le mani aperte sulle ginocchia e un filo di fumo che gli sale dalle
      spalle. Sulle braccia gli restano scaglie di corteccia nera, che si staccano a ogni movimento e cadono
      fra le ortiche. Il puma è accucciato a qualche passo e non ti stacca gli occhi di dosso.

      «Borgoth sa perché sei qui, per quello che gli orchi hanno fatto a Qir-Azel» dice, e sputa per terra. «È
      colpa della *Mawrak'Thur* e delle sue macchine che camminano. Il Capotribù Balthog adesso ascolta lei. È
      una donna arrabbiata con i capelli d'argento, e una cicatrice le taglia la pancia. Borgoth pensa che il
      Capotribù Balthog se ne sia innamorato, perché fa tutto quello che lei dice, anche l'attacco a Qir-Azel.
      Allora Borgoth si è tenuto lontano da lui e dai suoi amici nuovi, perché quella donna porta guai.»

      {origine accolito-del-velo} Nelle cronache del Velo la figlia dai capelli d'argento del cappellano
      Sollen è morta nell'incendio del Santuario.

      {politica-ed-economia Media} Un capo che obbedisce a una forestiera ha cambiato padrone senza dirlo alla
      tribù, e chi resta fuori dal nuovo giro è il primo a parlare.

      *I ritratti di Isvaro avevano i capelli chiari e una mano posata sul ventre.* Borgoth ti guarda di sotto
      in su e aspetta la domanda.
    opzioni:
      - testo: "Chiedergli chi c'è con lei"
        descrizione: "Ha detto amici nuovi. Gli amici si possono contare."
        costo: 0
        esito:
          titolo: Le dita
          testo: |
            Borgoth mostra i denti in un ghigno storto perché la domanda gli piace, e alza la mano con le dita
            chiuse. Sulle nocche ha ancora qualche scaglia di corteccia nera, che gli cade sulle ginocchia
            mentre apre il primo dito. L'unghia è spessa e nera di terra. Ti accorgi che anche tu stai
            contando, e pieghi le dita contro la coscia senza volerlo.
          segue: borgoth-e-gli-alleati
      - testo: "Chiedergli di Balthog"
        descrizione: "Il capo di Capomozzo. Borgoth lo chiama sempre con il titolo intero."
        costo: 0
        esito:
          titolo: Gli sciamani a pescare
          testo: |
            «Il Capotribù Balthog non ha mai perso» dice Borgoth, e si stacca una scaglia di corteccia dal
            polso. La scaglia è ancora tiepida, e lui la rigira fra le dita. «Combatte con le mani, e non ha
            una cicatrice. Prima ascoltava gli sciamani di Capomozzo. Adesso ascolta la donna, e gli sciamani
            li ha mandati a pescare.»

            Ci pensa sopra grattandosi il mento, dove il muschio è più fitto, e poi alza la mano con le dita
            chiuse. «Però la donna non è sola.»
          segue: borgoth-e-gli-alleati
      - testo: "Chiedergli della cicatrice"
        descrizione: "Nella tenda dei feriti hai imparato che una cicatrice dice molto di chi la porta. Borgoth l'ha vista abbastanza da ricordarla."
        quando: [origine.accolito-del-velo >= 1]
        costo: 0
        esito:
          titolo: La riga sul ventre
          testo: |
            Borgoth ci pensa con la serietà di un bambino interrogato, poi traccia una riga sul proprio ventre
            con l'unghia. L'unghia lascia un segno chiaro sulla pelle, dal fianco fin sotto l'ombelico. «Lunga
            così, e Borgoth non l'ha guardata di più, perché a una donna come quella le cicatrici è meglio non
            guardarle» dice, e si pulisce l'unghia sul ginocchio.

            Poi alza la mano con le dita chiuse, contento di avere ancora qualcosa da contare, e aggiunge che
            la donna non è sola.
          segue: borgoth-e-gli-alleati

  - id: borgoth-e-gli-alleati
    immagine: personaggi/borgoth-il-gigante
    titolo: Gli amici nuovi
    tipo: seguito
    luogo: Rovolungo, la tana di Borgoth
    area: rovolungo
    requisiti: [pista.capomozzo == 1]
    testo: |
      «Non è finita» dice Borgoth, e apre un dito alla volta. «Con la donna ci sono altri quattro. Zagrath il
      predone, che ha la madre ogre come Borgoth e nient'altro come Borgoth. Un uomo chiuso in un'armatura
      pesante che non parla mai. Una donna dalla pelle ambrata che brucia gli orchi che le vanno troppo
      vicino. Un mezzelfo che ride sempre e tira con l'arco meglio di un orco. E una trentina di fedeli del
      Culto dell'Anonimo, che dicono che lei è la loro capa.»

      {origine allievo-di-torvessa} All'Accademia ci vuole un pomeriggio di formule per accendere una candela,
      e nessun libro insegna a bruciare un orco.

      *Il mezzelfo che ride l'hai visto alla fornace, con una bottiglia accanto al gomito.* Borgoth intanto si
      gratta il mento dove il muschio è più fitto, e va avanti.

      «Il mezzelfo e la donna, Borgoth li ha visti nel bosco fare come i ratti. Borgoth lo ha detto al
      Capotribù Balthog per tornare nelle sue grazie, e lui lo ha cacciato via.»

      «Borgoth ha detto tutto, ed è guerriero di Fondobosco. Se lo uccidi torna alla terra, e Borgoth è
      pronto» dice, e resta ad aspettare con il mento alzato. Accanto a lui il puma ha smesso di guardarti e
      tiene gli occhi sul suo padrone.
    opzioni:
      - testo: "Lasciarlo legato"
        descrizione: "Con i suoi stessi rampicanti, stretti. Se si libera, sarà dopo che hai passato il ponte."
        esito:
          titolo: I rampicanti
          testo: |
            Gli leghi i polsi dietro la schiena con i rampicanti più grossi, e poi le caviglie, e Borgoth ti
            lascia fare guardando il soffitto. I rampicanti sono fibrosi e umidi e scricchiolano quando li
            stringi. Quando stringi l'ultimo nodo ride piano.

            «Questi nodi Borgoth li scioglie in un giorno» dice. «Borgoth aspetta qui, tanto la fretta ce
            l'hai tu.»

            Il puma ti segue con gli occhi fino all'uscita, accucciato accanto al suo padrone. Fuori il vento
            del mare ti asciuga il sudore sulla fronte, e il ponte è a cento passi.
          effetti: { pista.capomozzo: 1 }
          imposta: { borgoth: 2 }
          vai: capomozzo
      - testo: "Finirlo"
        descrizione: "Ha detto quello che sapeva, e ha detto anche di essere pronto."
        esito:
          titolo: Alla terra
          testo: |
            Borgoth chiude gli occhi prima che tu ti muova, e non li riapre più. Quando è finita il puma esce
            dall'angolo e gli si stende accanto con il muso sul suo petto, e non si sposta nemmeno quando gli
            passi vicino. Dal pelo del puma non sale più vapore. Ti pulisci la lama su un ciuffo d'erba e
            resti un momento a guardarli. Poi vai verso il ponte, e il tintinnio delle ossa d'uccello lo senti
            fino all'uscita.
          effetti: { pista.capomozzo: 1, tormento: 1 }
          imposta: { borgoth: 1 }
          vai: capomozzo
      - testo: "Lasciarlo andare"
        descrizione: "È un orco di Fondobosco, e con Balthog ha chiuso da tempo. La strada per casa sua è lunga."
        esito:
          titolo: Verso est
          testo: |
            Gli dici di andarsene, e Borgoth ti guarda come se non avesse capito. Poi si alza piano e fischia
            al puma, e le scaglie di corteccia gli cadono dalle ginocchia. Sulla soglia del tunnel si ferma.

            «Sul ponte non correre» dice senza voltarsi. «Borgoth lo ha visto cadere sotto due orchi di
            Capomozzo che correvano, e ha riso.»

            Lo senti allontanarsi fra i rovi verso est, con il puma che gli trotta dietro, finché il vento del
            mare copre il rumore dei passi.
          effetti: { pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
      - testo: "Lasciarlo andare con un debito"
        descrizione: "Nei vicoli chi ti lascia andare quando potrebbe finirti diventa il tuo creditore."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il debito
          testo: |
            Gli dici che può andare, e che adesso ti deve qualcosa. Borgoth ti guarda a lungo, poi annuisce
            piano, come si annuisce a un prezzo giusto, e fischia al puma. Sulla soglia del tunnel si ferma e
            deve chinare la testa sotto i rampicanti.

            «Sul ponte non correre, perché cade» dice senza voltarsi. «Questo Borgoth te lo paga subito.»

            Lo senti allontanarsi fra i rovi verso est, con il puma che gli trotta dietro.
          effetti: { pista.capomozzo: 1 }
          imposta: { borgoth: 3 }
          vai: capomozzo
