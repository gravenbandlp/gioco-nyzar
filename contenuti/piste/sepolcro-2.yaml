# Pista "Il Sepolcro violato", seconda metà (5 → 7): gli archivi della Biblioteca e il rapporto a
# Galdrick, più tre carte legate alla pista (Città Bassa e Quartieri Alti).
storylet:
  # ------------------------------------------------------------ 5 → 6 · la Biblioteca, gli archivi
  - id: biblioteca-gli-archivi
    presso: biblioteca-di-qir-azel
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: Gli archivi
    sommario: "Torni in Biblioteca con le parole dello spettro, e i tre uomini che le ascoltano non sanno dove metterle."
    luogo: Biblioteca di Qir-Azel, la sala di lettura
    area: quartieri-alti
    requisiti: [pista.sepolcro == 5]
    testo: |
      Ulric Stanne si rimette il monocolo quando arrivi alle parole dello
      spettro. Con lui siedono Mattias Crenn, che ha una macchia d'inchiostro
      sul mento, e Padre Walter, sull'unica sedia che regge la sua mole.

      {origine figlio-del-circolo} Nei vestiti hai ancora l'odore del legno
      della Roccia, diverso da ogni legno del Bosco di Velthar.

      «La Regina delle Ali Spezzate» ripete Ulric. «In quarant'anni non l'ho
      mai trovato scritto.» Nemmeno Mattias ricorda una regina nei frammenti
      precuriani, e sulla ragazza d'argento nessuno azzarda niente.

      {accademiche Media} Un nome che Ulric non ha mai letto è stato tenuto
      lontano dalla carta, o ce l'hanno tolto.

      «Le ali dell'altare avevano fili di rame nelle venature del legno» dice
      Padre Walter per ultimo, «lo stesso rame delle macchine dei Precursori
      scese dai tetti la sera del Festival.»

      Mattias propone di cominciare dagli orchi di Capomozzo, la tribù di
      Balthog il Prescelto.
    opzioni:
      - testo: "Rifare le ricerche nel catalogo"
        descrizione: "Gli indici delle cronache della costa nord rimandano a qualche volume, e il catalogo dovrebbe sapere dove sta."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La numerazione che salta
          testo: |
            Dagli indici delle cronache della costa nord risali alle schede dei
            volumi su Capomozzo e sul Rovolungo, ma nel cassetto del catalogo la
            numerazione salta dalla trecentododici alla trecentoquarantatré, e in
            quel punto il fondo è più chiaro e senza polvere.

            Ulric conta le schede due volte con il dito e dice piano che sono
            spariti anche i libri. «Chi li ha presi sapeva dove guardare.»
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Il cassetto sbagliato
          testo: |
            Passi il pomeriggio fra tre cataloghi diversi, uno dei quali, lo scopri
            alla fine, ordina i libri secondo il colore della rilegatura. Quando il
            custode spegne i lampadari non hai in mano nessun titolo utile, e Ulric
            ti dice di tornare domattina prima dell'apertura, perché stanotte agli
            scaffali ci sale lui con la lanterna.
          segue: biblioteca-gli-archivi-mattina
          effetti: { tormento: 0.5 }
      - testo: "Guardare gli scaffali invece dei libri"
        descrizione: "In galleria nessuno toglie la polvere da anni, e chi ha preso qualcosa deve aver lasciato un segno."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: I rettangoli puliti
          testo: |
            Sali in galleria con una lanterna e guardi i ripiani invece dei dorsi.
            Sulla parete nord, sotto la targhetta di ottone della *Costa nord*, due
            ripiani hanno nella polvere una trentina di rettangoli puliti, lasciati
            dai libri.

            Ulric sale tenendosi al corrimano e li guarda senza toccarli.
            «Capomozzo e il Rovolungo, fino all'ultimo atlante» dice a bassa voce.
            Secondo lui li hanno tolti da poco, e con molta calma.
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Il raschio della scala
          testo: |
            Resti in galleria fino a sera senza trovare altro che polvere. Quando
            una scala a pioli scorre sul binario dietro di te, il raschio ti
            riporta al coltello della capanna sulla Roccia, e ti volti con il pugno
            chiuso verso un garzone che fischietta.

            Di sotto Ulric ti dice che i libri su Capomozzo e sul Rovolungo non ci
            sono più, e che qualcuno ha tolto anche le schede.
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1, tormento: 1 }
      - testo: "Farsi aprire il registro dei prestiti"
        descrizione: "Il registro lo tiene un copista del Municipio, che lo apre solo a chi sa chiederlo o conosce il regolamento."
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il registro dei prestiti
          testo: |
            Il copista ha le maniche di lustrino e le labbra strette. Gli citi
            l'articolo del regolamento che apre il registro a chi ha servito la
            città, e lui sospira prima di girare il librone verso di te. Negli
            ultimi dieci anni non risulta in prestito nessun volume della costa
            nord.

            «Allora sono spariti» dice Ulric, «e chi li ha presi da questo
            registro non è passato.»
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Un nome su un foglio
          testo: |
            Il copista ti ascolta fino in fondo, poi scrive il tuo nome su un
            foglio a parte e tiene il registro chiuso sotto il gomito. Lo apre
            un'ora dopo per Ulric, che conosce da trent'anni, e dei libri su
            Capomozzo e sul Rovolungo non risulta uscito niente, eppure dagli
            scaffali sono spariti. Il foglio con il tuo nome, a fine settimana,
            salirà in Municipio con gli altri.
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1, sospetto: 1 }
      - testo: "Restare con Ulric fino alla chiusura"
        descrizione: "Lui conosce gli scaffali e tu reggi le lanterne, per tutta la sera."
        costo: 2
        esito:
          titolo: La lunga sera
          testo: |
            Porti le lanterne su e giù per la galleria mentre Ulric cerca. Recita
            i titoli a memoria prima di trovarli e li trova quasi tutti, tranne
            quelli su Capomozzo e sul Rovolungo, di cui non resta nemmeno una
            scheda.

            Quando il custode spegne l'ultimo lampadario si siede sui gradini con
            il panciotto sbottonato. «Sono qui da quarant'anni, e una cosa così
            non l'avevo mai vista.»
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }
      - testo: "Salutare il copista per nome"
        descrizione: "Il copista del Municipio ti conosce da bambino, e ha ricopiato i contratti di matrimonio dei tuoi cugini."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Come un favore a cena
          testo: |
            Il copista tiene le labbra strette finché non ti riconosce, poi ti
            chiede dei tuoi e di una zia che scriveva lettere lunghissime. Gli
            chiedi il registro come un favore, e lui te lo gira davanti senza
            citare il regolamento. Negli ultimi dieci anni nessun volume della
            costa nord è uscito in prestito.

            «Allora sono spariti» dice Ulric, «e chi li ha presi da qui non è
            passato.»
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }
      - testo: "Partire dalle bibliografie di Temmerin"
        descrizione: "Le bibliografie della costa nord dei manuali dell'Accademia le hai ricopiate al primo anno, e sai quali volumi cercare."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Le segnature a memoria
          testo: |
            Ti fai dare carta e penna e scrivi a memoria le segnature che Temmerin
            vi faceva ricopiare in fondo ai compiti. Nel cassetto del catalogo le
            schede di quei volumi non ci sono, e la numerazione salta dalla
            trecentododici alla trecentoquarantatré, sopra un fondo più chiaro.

            Ulric conta le schede due volte con il dito e dice piano che sono
            spariti, le schede insieme ai libri.
          pe: { accademiche: 3 }
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }
      - testo: "Leggere la polvere come nelle rovine"
        descrizione: "Sulle piattaforme della Cicatrice si impara presto che la polvere dice chi è passato prima di te, e quando."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: La polvere della galleria
          testo: |
            Sali in galleria e, come nelle rovine, tieni la lanterna bassa per
            guardare i ripiani invece dei dorsi. Sotto la targhetta della *Costa
            nord* due ripiani hanno nella polvere una trentina di rettangoli
            puliti, con i bordi netti.

            Ulric sale tenendosi al corrimano e li guarda senza toccarli.
            «Capomozzo e il Rovolungo, fino all'ultimo atlante» dice a bassa voce,
            e si toglie il monocolo per pulirlo sul panciotto.
          pe: { percezione: 3 }
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }

  - id: biblioteca-gli-archivi-mattina
    presso: biblioteca-di-qir-azel
    immagine: personaggi/ulric-stanne
    titolo: Prima dell'apertura
    tipo: seguito
    luogo: Biblioteca di Qir-Azel, sulla porta
    area: quartieri-alti
    requisiti: [pista.sepolcro == 5]
    testo: |
      La mattina dopo Ulric Stanne ti aspetta sulla porta della Biblioteca,
      prima dell'apertura, con il panciotto rosso abbottonato storto e le
      borse sotto gli occhi di chi ha passato la notte agli scaffali.

      {empatia Facile} Il panciotto storto è la cosa più grave, perché Ulric
      si abbottona bene anche quando la casa gli brucia.

      «Capomozzo e Rovolungo» dice senza salutarti. «Gli atlanti e le
      cronache marittime, fino all'ultima nota di un cacciatore di foche.
      Hanno tolto le schede e svuotato gli scaffali con ordine. In
      quarant'anni non mi era mai capitato.» Ti porge un foglio piegato in
      quattro con le segnature dei volumi mancanti, nella sua grafia piccola
      e diritta.
    opzioni:
      - testo: "Prendere la lista"
        descrizione: "Trenta segnature e nessun libro."
        esito:
          titolo: Le segnature
          testo: |
            Ti infili il foglio nella giubba. Ulric ti chiede di non parlarne in
            giro finché non ha capito chi entra in galleria quando lui non c'è, e
            scendendo verso la piazza tocchi il foglio attraverso la stoffa, per
            sentire che c'è ancora.
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }

  # ------------------------------------------------------------ 6 → 7 · il rapporto a Galdrick
  - id: galdrick-il-rapporto
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: Il rapporto
    sommario: "Alla Caserma lo sceriffo Galdrick aspetta il tuo rapporto sulla cripta e sulla roccia nel fiume."
    luogo: Guarnigione di Qir-Azel, il corridoio del mastio
    area: quartieri-alti
    requisiti: [pista.sepolcro == 6]
    testo: |
      Nel cortile della Caserma un sergente fa colpire i manichini a tempo,
      e uno porta un elmo vero, messo per scherzo.

      {origine fuggiasco-di-ghoran} In un cortile pieno di uomini armati
      conti le uscite prima di tutto il resto.

      Galdrick ha l'ufficio pieno di muratori per una crepa nel muro maestro
      e ti riceve nel corridoio del mastio, sotto la teca con la spada di
      Ivo Carstan. Gli racconti della cripta e della Roccia di Wren, e
      quando nomini il Cucitore alza gli occhi sulla spada e non ti
      interrompe più.

      «Gli orchi presi vivi dopo la razzia li ho interrogati io» dice. «Il
      loro capo non era un orco, e doveva fare qualcosa al cimitero. La
      tunica della cripta, di taglia piccola, va agli atti con le orme.»

      In fondo al corridoio passa Borso, il carceriere, con un secchio di
      zuppa per le celle.
    opzioni:
      - testo: "Raccontargli tutto"
        descrizione: "Anche le parole dello spettro e i buchi nel catalogo della Biblioteca."
        esito:
          titolo: Agli atti
          testo: |
            Gli riferisci le parole dello spettro sulla Regina e sulla ragazza
            d'argento, e gli scaffali vuoti della costa nord. Galdrick ripete a
            mezza voce Capomozzo e Rovolungo.

            «Capomozzo è la tribù di Balthog, e prima del Festival le tribù del
            circondario non si erano mai mosse insieme» dice. «Metto tutto agli
            atti e lo porto al Consiglio alla prossima seduta.» Ti stringe la mano
            e torna dai muratori.
          effetti: { rep.caserma: 1, pista.sepolcro: 1, racconto: 1 }
      - testo: "Tenerti qualcosa per te"
        descrizione: "In Città Bassa c'è chi pagherebbe bene le parole sulla ragazza d'argento, e lo sceriffo registra tutto."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Mezzo rapporto
          testo: |
            Gli racconti dello spettro e degli scaffali vuoti, e quando arrivi alla
            ragazza d'argento passi oltre senza cambiare voce. «Capomozzo è la
            tribù di Balthog» dice Galdrick alla fine. «Prima del Festival le tribù
            del circondario non si erano mai mosse insieme. Metto agli atti e porto
            la cosa al Consiglio, in Municipio.»

            Le parole che hai taciuto te le porti in Città Bassa, dove qualcuno
            saprà quanto valgono.
          effetti: { informazioni.segreto: 1, pista.sepolcro: 1, racconto: 1 }
        fallimento:
          titolo: Una riga sul taccuino
          testo: |
            Quando arrivi alle ultime parole dello spettro salti mezza frase, e
            Galdrick se ne accorge. Tira fuori un taccuino, ci scrive una riga con
            una matita corta e dice «Continua», e tu gli racconti anche la parte
            che volevi tenerti, con la faccia che scotta. Metterà tutto agli atti
            e porterà la cosa al Consiglio, in Municipio, insieme alla questione
            delle tribù.
          effetti: { sospetto: 1, pista.sepolcro: 1, racconto: 1 }
      - testo: "Chiedergli qualcosa in cambio"
        descrizione: "Per un lavoro così la Caserma avrebbe mandato quattro guardie e un sergente, e va ricordato con garbo."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: La paga di servizio
          testo: |
            Gli fai notare, guardando la spada nella teca invece di lui, che per
            quella cripta la Caserma avrebbe mandato quattro guardie e un sergente,
            e che le guardie si pagano. Galdrick ci pensa, poi fa contare la somma
            a un furiere dalla cassa delle spese di servizio e ti fa firmare la
            ricevuta. Il rapporto lo mette agli atti. Della tribù di Capomozzo
            parlerà al Consiglio alla prossima seduta.
          effetti: { monete: 20, pista.sepolcro: 1, racconto: 1 }
        fallimento:
          titolo: La tariffa
          testo: |
            Galdrick ti ascolta fino in fondo, poi dice che la Caserma paga una
            tariffa e che la tariffa è scritta. Il furiere ti conta il poco che
            prevede contro ricevuta, una moneta alla volta. Il rapporto andrà agli
            atti e le tribù al Consiglio in Municipio. Quando ti saluta, la mano
            gli resta nella cintura.
          effetti: { monete: 5, rep.caserma: -0.5, pista.sepolcro: 1, racconto: 1, scandalo: 0.5 }
      - testo: "Presentargli il conto come al banco"
        descrizione: "Un conto scritto voce per voce si discute meno di una richiesta, e le guardie mai mandate hanno un prezzo."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: mentale, abilita: [politica-ed-economia, persuasione], difficolta: Facile }
        successo:
          titolo: Voce per voce
          testo: |
            Gli scrivi il conto voce per voce, con la grafia dei clienti che
            pagano a fine mese. In cima le quattro guardie e il sergente che la
            Caserma non ha mandato, sotto l'olio delle lanterne, e nessun totale,
            perché è meglio che lo faccia chi paga.

            Galdrick fa contare la somma a un furiere. «Firma la ricevuta. Il
            rapporto va agli atti, e Capomozzo lo porto al Consiglio.»
          effetti: { monete: 20, pista.sepolcro: 1, racconto: 1 }
        fallimento:
          titolo: Il tariffario della Caserma
          testo: |
            Gli scrivi il conto voce per voce, e lui per risposta ti indica il
            tariffario della Caserma appeso dietro la teca, con voci più vecchie
            delle tue e prezzi più bassi. Il furiere ti conta il poco che prevede,
            una moneta alla volta, e il rapporto andrà agli atti e le tribù al
            Consiglio. Il tuo foglio te lo rende piegato in due.
          effetti: { monete: 5, rep.caserma: -0.5, pista.sepolcro: 1, racconto: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ carte della pista
  - id: carta-incubo-del-cucitore
    immagine: ambientazione/evento-notti-cucite-145
    titolo: La conta del Cucitore
    sommario: "In un cortile della Città Bassa i bambini fanno la conta sul Cucitore, sotto gli occhi di una madre."
    tipo: carta
    area: citta-bassa
    requisiti: [pista.sepolcro >= 5]
    testo: |
      In un cortile della Città Bassa, intorno a un pozzo coperto da un'asse,
      sei bambini fanno la conta. «Cuci cuci Cucitore, chi si muove perde il
      cuore» cantano, e chi resta fuori conta fino a venticinque, come le
      vittime.

      Sulla soglia una donna con il grembiule bagnato si torce le mani. Da
      una settimana sua figlia si sveglia gridando che sotto il letto c'è un
      uomo con gli occhi cuciti, e metà dei bambini della via fa lo stesso
      sogno. Stamattina sul davanzale ha trovato un uccellino di legno
      intagliato e lo tiene in tasca senza toccarlo.
    opzioni:
      - testo: "Guardare l'uccellino"
        descrizione: "La donna lo tiene in tasca senza toccarlo, ma te lo lascia guardare."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Facile }
        successo:
          titolo: Uccellini contro gli incubi
          testo: |
            Sotto la coda trovi una piccola spirale incisa, la stessa degli
            uccellini contro gli incubi che un vecchio intagliatore vende al
            mercato per pochi spiccioli, e qualche vicino premuroso deve averne
            lasciato uno su ogni davanzale. Glielo spieghi, e la donna ride e se
            lo rimette in tasca, questa volta con la mano.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Nel focolare
          testo: |
            Lo rigiri fra le dita senza capirci niente, e la donna te lo toglie di
            mano e lo butta nel focolare, dove il legno fresco prende fuoco con una
            fiamma alta. Quella notte, nel dormiveglia, senti un coltello che
            incide il legno.
          effetti: { tormento: 1 }
      - testo: "Insegnare ai bambini un'altra conta"
        descrizione: "Una qualunque, purché non parli di lui."
        esito:
          titolo: I pesci del Torvessa
          testo: |
            Ti accucci nel cerchio e insegni loro una conta sui pesci del
            Torvessa, dove chi resta fuori deve fare la carpa. La storpiano
            subito, e il più piccolo fa la carpa anche quando non tocca a lui, con
            le guance gonfie, mentre la madre guarda dalla soglia con le mani
            ferme nel grembiule.
          effetti: { tormento: -0.5 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: "Esci dal cortile con la nuca ancora fredda. Alle tue spalle i bambini ricominciano a contare."
      - testo: "Insegnargli la conta dei vicoli"
        descrizione: "In questi cortili ci hai giocato anche tu, e la conta che facevate allora ce l'hai ancora in bocca."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: La conta del bottaio
          testo: |
            Entri nel cerchio e dici che la conta del Cucitore è roba da piccoli,
            e che nei vicoli si contava sul bottaio che rincorre chi gli ruba i
            cerchi. Te la ricordi tutta, con la parola sporca al quarto verso, e
            il più grande la impara per primo proprio per quella. Quando te ne vai
            cantano la tua, e la madre dalla soglia dice che la cantava anche lei.
          effetti: { tormento: -0.5 }

  - id: carta-commissione-di-vantes
    immagine: personaggi/padre-vantes
    titolo: Un favore per il Velo
    sommario: "Sui gradini della Cattedrale Padre Vantes ti posa una mano sul braccio, con un favore piccolo da chiederti."
    tipo: carta
    area: quartieri-alti
    requisiti: [pista.sepolcro >= 3]
    testo: |
      Sui gradini della Cattedrale del Velo Padre Vantes ti posa una mano sul
      braccio e ti ringrazia per la cripta di Padre Sollen.

      {origine accolito-del-velo} Vantes ti guarda le mani prima della
      faccia, come la sera della tenda dei feriti.

      Nella borsa di tela ha i vasetti di un balsamo per la tosse per il
      garzone delle fosse, che da quando Gundo Marl è sparito tiene il
      cimitero da solo. Sulla panca del portale aspetta un vecchio cardatore
      che stamattina seppellisce la moglie senza parenti, con le scarpe
      lucidate e un laccio rosso al posto di quello nero.
    opzioni:
      - testo: "Portare il balsamo al garzone delle fosse"
        descrizione: "Una borsa di vasetti e una lunga discesa fino al cimitero."
        esito:
          titolo: La tosse del garzone
          testo: |
            Trovi il garzone curvo su una fossa, con la tosse che lo scuote a ogni
            palata. Conta i vasetti e annota la consegna nel registro di Gundo,
            con una grafia grossa che non somiglia a quella minuta delle pagine
            prima, nella colonna dei defunti perché è l'unica che c'è. Padre
            Vantes lo viene a sapere prima di sera.
          effetti: { rep.velo: 0.5 }
      - testo: "Accompagnare il vecchio alle esequie"
        descrizione: "La discesa è lunga e il vecchio ha voglia di parlare."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Facile }
        successo:
          titolo: Stonata
          testo: |
            Il vecchio si appoggia al tuo braccio per tutta la discesa e ti
            racconta della moglie, che cantava stonata sapendolo benissimo. Alle
            esequie resti in fondo, con il suo cappello in mano, e alla fine lui ti
            stringe la mano con entrambe le sue. In serata un accolito sale al
            Grifone a ringraziarti da parte di Padre Vantes.
          pe: { empatia: 3 }
          effetti: { rep.velo: 0.5 }
        fallimento:
          titolo: In ritardo
          testo: |
            Lo porti giù troppo in fretta, e a metà della scalinata il vecchio
            inciampa e deve sedersi su un gradino a massaggiarsi il ginocchio.
            Arrivate che il monaco ha già cominciato, e lui ti ringrazia lo stesso,
            con la voce stanca, prima di andare in prima fila con le scarpe
            impolverate.
          effetti: { scandalo: 0.5 }
      - testo: "Scusarti con Padre Vantes"
        costo: 0
        esito:
          testo: "Vantes ti stringe il polso, con una pressione gentile e breve, e dice che troverà qualcun altro. Poi torna dal vecchio sulla panca e gli si siede accanto."
      - testo: "Accompagnare il vecchio e dire le parole al posto dei parenti"
        descrizione: "Al Velo hai servito abbastanza esequie da sapere quali parole spettano a un parente che non c'è."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Le parole del parente
          testo: |
            Il vecchio si appoggia al tuo braccio per tutta la discesa e ti
            racconta della moglie, che cantava stonata sapendolo benissimo. Alle
            esequie ti metti al suo fianco, dove starebbe un figlio, e alla pausa
            per i parenti dici tu le parole di commiato, mentre lui le ripete con
            le labbra. In serata un accolito sale al Grifone a ringraziarti da
            parte di Padre Vantes, e ti chiama per nome.
          pe: { empatia: 3 }
          effetti: { rep.velo: 0.5 }

  - id: carta-curiosi-dell-eroe
    immagine: ambientazione/quartieri-alti
    titolo: Uno di quelli del cimitero
    sommario: "In piazza qualcuno ti riconosce come uno di quelli scesi nella cripta di Padre Sollen."
    tipo: carta
    area: quartieri-alti
    requisiti: [pista.sepolcro >= 3]
    testo: |
      Nella piazza davanti alla Casa dei Nodi una donna con un cesto di pere
      ti guarda due volte e dice forte che sei uno di quelli scesi nella
      cripta di Padre Sollen, e in un momento hai intorno mezza dozzina di
      persone.

      {origine rampollo-dei-quartieri-alti} Una serva ti ha riconosciuto per
      il cognome, ed entro sera in famiglia lo sapranno.

      Dalla sua bottega esce un mercante di candele che vorrebbe il tuo nome
      sull'insegna, sotto *Candele per ogni oscurità*, e paga in contanti.
      Il garzone regge già un'asse fresca di vernice con il tuo nome,
      sbagliato di una lettera.
    opzioni:
      - testo: "Lasciargli il nome"
        descrizione: "Qualche moneta, e una lettera da correggere."
        esito:
          titolo: Candele per ogni oscurità
          testo: |
            Il mercante ti conta le monete nel palmo e manda il garzone a
            correggere la lettera, che il ragazzo ridipinge seduto sul gradino con
            la lingua fra i denti. Per qualche settimana chi entra in bottega
            chiede se le candele le hai provate tu, e il mercante giura di sì.
          effetti: { monete: 6 }
      - testo: "Rispondere al ragazzino"
        descrizione: "Ha fatto una domanda precisa, e mezza piazza aspetta la risposta."
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Facile }
        successo:
          titolo: Il freddo della cripta
          testo: |
            Gli dici che sì, i morti puzzano, ma la cosa peggiore della cripta era
            il freddo, che ti è rimasto nelle dita per due giorni. La donna delle
            pere ti regala una pera e la gente si sparpaglia contenta, ripetendo la
            storia del freddo.
          pe: { espressivita: 5 }
        fallimento:
          titolo: Lo zio
          testo: |
            Cominci dalla fine e ti perdi a metà, con mezza piazza che aspetta. Il
            ragazzino dice deluso che suo zio questa storia la racconta meglio, e
            la donna delle pere ride così forte che le cade una pera dal cesto.
          effetti: { scandalo: 1 }
      - testo: "Svincolarti dalla folla"
        costo: 0
        esito:
          testo: "Dici che hai fretta e ti apri un varco fra le persone, a gomiti stretti. Il ragazzino ti segue per un tratto, ancora con la sua domanda in bocca, poi lo richiama sua madre."
