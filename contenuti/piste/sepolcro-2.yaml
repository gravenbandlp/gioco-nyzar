# Pista "Il Sepolcro violato", seconda metà (5 → 7): gli archivi della Biblioteca e il rapporto a
# Galdrick, più tre carte legate alla pista (Città Bassa e Quartieri Alti).
storylet:
  # ------------------------------------------------------------ 5 → 6 · la Biblioteca, gli archivi
  - id: biblioteca-gli-archivi
    presso: biblioteca-di-qir-azel
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: Gli archivi
    sommario: "Torni in Biblioteca con le parole dello spettro. I tre uomini che le ascoltano hanno letto molto, e non sanno dove metterle."
    luogo: Biblioteca di Qir-Azel, la sala di lettura
    area: quartieri-alti
    requisiti: [pista.sepolcro == 5]
    testo: |
      Ulric Stanne ti ascolta senza interromperti, con il monocolo in mano, e
      quando arrivi alle parole dello spettro se lo rimette sull'occhio.
      Mattias Crenn è sceso dal primo piano con le lenti
      appannate e una macchia d'inchiostro sul mento. Padre Walter occupa
      l'unica sedia che regge la sua mole, con il saio chiuso fino al collo
      nonostante il caldo dei lampadari. Sopra il bancone un cartello chiede di
      non bagnarsi le dita per voltare le pagine, e sotto qualcuno ha aggiunto
      a matita «nemmeno con la lingua». Nei vestiti hai ancora l'odore del
      legno intagliato della Roccia.

      «La Regina delle Ali Spezzate» ripete Ulric. «In quarant'anni qui dentro
      ho letto parecchio, e questo nome scritto non l'ho mai trovato.» Mattias
      dice che nei frammenti precuriani non compare nessuna regina e si pulisce
      le lenti sulla manica. Sulla ragazza d'argento nessuno azzarda niente.
      In Città Bassa si grida di una Dama d'Argento, e Ulric osserva che due
      parole simili non bastano a fare una persona.

      Walter parla per ultimo. «Le ali dell'altare erano per metà
      di metallo, e nelle venature del legno correvano fili di rame. Le
      macchine dei Precursori scese per i Quartieri Alti la sera del Festival
      avevano lo stesso rame. Questo l'ho visto, il resto lo lascio a chi legge.»
      Si tocca il colletto del saio, dove la stoffa è lisa.

      *Se Ulric non l'ha mai letta, forse non l'ha mai scritta nessuno.*
      Mattias si alza di scatto e dice di cominciare dagli orchi di Capomozzo,
      la tribù di Balthog il Prescelto. Ulric indica il catalogo con il mento.
    opzioni:
      - testo: "Rifare le ricerche nel catalogo"
        descrizione: "Gli indici delle cronache della costa nord rimandano a qualche volume. Il catalogo dovrebbe sapere dove sta."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La numerazione che salta
          testo: |
            Parti dagli indici delle cronache della costa nord, che rimandano
            quasi tutti a qualche volume su Capomozzo o sul Rovolungo. Nel
            cassetto del catalogo cerchi le schede di quei volumi, e la
            numerazione salta dalla trecentododici alla trecentotrenta. In quel
            punto il fondo del cassetto è più chiaro, perché per anni le schede
            l'hanno tenuto al riparo dalla luce.

            Ulric si china sul cassetto e conta le schede due volte con il
            dito, poi dice piano che sono spariti, le schede insieme ai libri.
            «Chi li ha presi sapeva dove guardare» aggiunge, e richiude il
            cassetto con due dita.
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Il cassetto sbagliato
          testo: |
            Passi il pomeriggio sugli indici e ti perdi fra tre cataloghi
            diversi, uno dei quali, lo scopri alla fine, ordina i libri secondo
            il colore della rilegatura. Quando il custode comincia a spegnere i
            lampadari hai gli occhi che bruciano e in mano nessun titolo utile.

            Ulric ti accompagna alla porta e ti dice di tornare domattina,
            prima dell'apertura, perché stanotte agli scaffali ci sale lui con
            la lanterna.
          segue: biblioteca-gli-archivi-mattina
      - testo: "Guardare gli scaffali invece dei libri"
        descrizione: "In galleria la polvere non la toglie nessuno da anni. Se qualcuno ha preso qualcosa, deve aver lasciato un segno."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: I rettangoli puliti
          testo: |
            Sali in galleria con una lanterna e guardi i ripiani invece dei
            dorsi. Sulla parete nord la polvere è alta un dito dappertutto,
            tranne che su due ripiani, dove restano i rettangoli puliti lasciati
            dai libri. Ne conti una trentina in fila, e sulla targhetta di
            ottone del ripiano c'è scritto *Costa nord*.

            Quando chiami Ulric, lui sale tenendosi al corrimano e guarda i
            rettangoli senza toccarli. «Capomozzo e il Rovolungo, fino
            all'ultimo atlante» dice a bassa voce, e si toglie il monocolo per
            pulirlo sul panciotto. Secondo lui li hanno tolti da poco, e con
            molta calma.
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Il raschio della scala
          testo: |
            Resti in galleria finché accendono i lampadari della sera, e non
            trovi altro che polvere. A un certo punto una scala a pioli scorre
            sul binario dietro di te, e il raschio del legno ti riporta alla
            capanna sulla Roccia, al coltello che incideva da solo. Ti volti con
            il fiato corto. In fondo alla galleria un garzone sta spingendo la
            scala verso gli scaffali alti.

            Ulric ti trova sull'ultimo gradino della galleria e ti porta di
            sotto.
            Mentre scendete ti dice che cosa ha trovato lui nel catalogo. I
            libri su Capomozzo e sul Rovolungo non ci sono più, e qualcuno ha
            tolto anche le schede.
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1, tormento: 0.5 }
      - testo: "Farsi aprire il registro dei prestiti"
        descrizione: "Il registro lo tiene un copista del Municipio, e lo apre solo a chi sa chiederlo nel modo giusto o conosce il regolamento."
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il registro dei prestiti
          testo: |
            Il copista ha le maniche di lustrino e ti ascolta con le labbra
            strette. Gli parli con tutto il garbo che hai, e alla fine gli citi
            l'articolo del regolamento cittadino che apre il registro a chi ha
            servito la città. Lui sospira e gira il librone verso di te. Negli
            ultimi dieci anni nessun volume della costa nord è uscito in
            prestito, e le pagine di quegli anni sono ordinate e complete.

            Ulric legge da sopra la tua spalla, e il monocolo gli cade sul
            panciotto. «Allora sono spariti», dice, «e chi li ha presi da
            questo registro non è passato.»
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Un nome su un foglio
          testo: |
            Il copista ti ascolta fino in fondo, poi ti chiede il nome e lo
            scrive su un foglio a parte insieme alla data e all'ora. Il
            registro resta chiuso sotto il suo gomito.

            Lo apre un'ora dopo Ulric, che il copista lo conosce da trent'anni,
            e ti chiama a vedere. Dei libri su Capomozzo e sul Rovolungo non è
            mai uscito niente, eppure dagli scaffali sono spariti. Il foglio con
            il tuo nome intanto è finito in un cassetto, e a fine settimana
            salirà in Municipio con gli altri.
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1, sospetto: 0.5 }
      - testo: "Restare con Ulric fino alla chiusura"
        descrizione: "Lui conosce gli scaffali, tu reggi le lanterne. Ci vorrà tutta la sera."
        costo: 2
        esito:
          titolo: La lunga sera
          testo: |
            Porti le lanterne su e giù per la galleria mentre Ulric cerca, e
            dopo un po' smetti di contare i gradini. Lui recita i titoli a
            memoria prima di trovarli, e li trova quasi tutti. Su Capomozzo e
            sul Rovolungo non trova nemmeno una scheda.

            Quando il custode spegne l'ultimo lampadario Ulric si siede sui
            gradini della galleria, con il panciotto sbottonato. «Spariti»
            dice. «Io sono qui da quarant'anni, e la memoria perfetta non ce
            l'ho. Ma una cosa così non l'avevo mai vista.» Rimane seduto con la
            lanterna sulle ginocchia finché non gli porgi la mano.
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }

  - id: biblioteca-gli-archivi-mattina
    presso: biblioteca-di-qir-azel
    immagine: personaggi/ulric-stanne
    titolo: Prima dell'apertura
    tipo: seguito
    luogo: Biblioteca di Qir-Azel, sulla porta
    area: quartieri-alti
    requisiti: [pista.sepolcro == 5]
    testo: |
      La mattina dopo Ulric Stanne ti aspetta sulla porta della Biblioteca,
      prima che apra. Ha il panciotto rosso abbottonato storto e le borse sotto
      gli occhi gonfie, perché ha passato la notte agli scaffali. Dietro di lui
      il liuto è appoggiato alla scrivania con una corda rotta, la stessa da
      quando lo conosci.

      «Capomozzo e Rovolungo» dice senza salutarti. «Gli atlanti e le cronache
      marittime, fino all'ultima nota di un cacciatore di foche. Li ho cercati
      nel catalogo vecchio e in quello nuovo. Le schede le hanno tolte e gli
      scaffali li hanno svuotati, con ordine. Sono spariti.»

      Si toglie il monocolo e lo pulisce sul panciotto, più a lungo del
      necessario. «Qir-Azel vede passare più libri di quanti tramonti veda un
      uomo, e io non posso giurare di averli visti tutti. Però una cosa del
      genere, in quarant'anni, non mi era mai capitata. È molto strano.»

      Ti porge un foglio piegato in quattro. Sopra, con la sua grafia piccola e
      diritta, ci sono le segnature dei volumi mancanti, una sotto l'altra.
    opzioni:
      - testo: "Prendere la lista"
        descrizione: "Trenta segnature e nessun libro."
        esito:
          titolo: Le segnature
          testo: |
            Ti infili il foglio nella giubba. Ulric resta sulla soglia a
            guardare la strada, dove un garzone porta il pane ai manieri, e ti
            chiede di non parlarne in giro finché non ha capito chi entra in
            galleria quando lui non c'è.

            Scendendo verso la piazza tocchi il foglio due volte attraverso la
            stoffa, per sentire che c'è ancora.
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }

  # ------------------------------------------------------------ 6 → 7 · il rapporto a Galdrick
  - id: galdrick-il-rapporto
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: Il rapporto
    sommario: "Lo sceriffo Galdrick aspetta il tuo rapporto alla Caserma, e tu hai da raccontargli una cripta e una roccia nel fiume."
    luogo: Guarnigione di Qir-Azel, il corridoio del mastio
    area: quartieri-alti
    requisiti: [pista.sepolcro == 6]
    testo: |
      Le due guardie in giaco di maglia davanti al portone ti riconoscono e ti
      fanno passare. Nel cortile, dove si addestrano a turno le quasi
      cinquecento guardie della città, un sergente fa colpire i manichini di
      paglia a tempo, e uno dei manichini porta un elmo vero, ammaccato, che
      qualcuno gli ha messo per scherzo e che da allora nessuno toglie.

      L'ufficio dello sceriffo è pieno di muratori, perché dopo la razzia hanno
      trovato una crepa nel muro maestro. Galdrick ti riceve nel corridoio del
      mastio, sotto la teca con la spada ammaccata di Ivo Carstan, e qui fuori
      sembra non sapere dove mettere le mani. Prima le incrocia dietro la
      schiena, poi infila i pollici nella cintura.

      Gli racconti della cripta e della Roccia di Wren. Quando nomini il
      Cucitore alza gli occhi sulla spada nella teca e resta zitto finché non
      hai finito.

      «Gli orchi presi vivi dopo la razzia li ho interrogati io, con il
      carceriere presente» dice. «Nella cantilena c'erano due informazioni
      utili. Il loro capo non era un orco, e doveva fare qualcosa al cimitero.
      La tunica che hai trovato è di taglia piccola. La metto agli atti accanto
      alle altre due.»

      In fondo al corridoio passa Borso, con il grembiule di cuoio e un secchio
      di zuppa per le celle del sotterraneo. Ha la faccia piena di cicatrici e
      il naso storto in più punti. Saluta lo sceriffo con un cenno e scende le
      scale senza guardarti.
    opzioni:
      - testo: "Raccontargli tutto"
        descrizione: "Anche le parole dello spettro e i buchi nel catalogo della Biblioteca."
        esito:
          titolo: Agli atti
          testo: |
            Gli riferisci le parole dello spettro sulla Regina e sulla ragazza
            d'argento, poi gli parli degli scaffali vuoti della costa nord.
            Galdrick ascolta con i pollici nella cintura e ripete a mezza voce
            Capomozzo e Rovolungo, per fissarli.

            «Capomozzo è la tribù di Balthog» dice. «Prima del Festival le
            tribù del circondario non si erano mai mosse insieme. Metto tutto
            agli atti e lo porto al Consiglio, in Municipio, alla prossima
            seduta. Che cosa deciderà il Consiglio non lo so ancora, e se lo
            sapessi non te lo direi in un corridoio.» Ti stringe la mano con
            forza e torna verso i muratori.
          effetti: { rep.caserma: 1, pista.sepolcro: 1, racconto: 1 }
      - testo: "Tenerti qualcosa per te"
        descrizione: "In Città Bassa c'è chi pagherebbe bene le parole dello spettro sulla ragazza d'argento. Lo sceriffo però registra tutto."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Mezzo rapporto
          testo: |
            Gli racconti dello spettro e degli scaffali vuoti, e quando arrivi
            alla ragazza d'argento passi oltre senza cambiare voce. Galdrick
            annuisce ogni tanto con il mento e muove appena le labbra, per
            tenere a mente i nomi.

            «Capomozzo è la tribù di Balthog» dice alla fine. «Prima del
            Festival le tribù del circondario non si erano mai mosse insieme.
            Metto agli atti e porto la cosa al Consiglio, in Municipio.»

            Uscendo dal portone ti ripeti a mente le parole che hai taciuto, e
            le tieni in testa per tutta la discesa verso la Città Bassa, dove
            qualcuno saprà quanto valgono.
          effetti: { informazioni.segreto: 1, pista.sepolcro: 1, racconto: 1 }
        fallimento:
          titolo: Una riga sul taccuino
          testo: |
            Quando arrivi alle ultime parole dello spettro salti mezza frase,
            e Galdrick se ne accorge. Ti guarda più a lungo, poi tira fuori dalla
            giubba un taccuino e ci scrive una riga, con una matita corta.
            «Continua» dice, e tu gli racconti anche la parte che volevi tenerti.

            Alla fine ti dice che metterà tutto agli atti e porterà la cosa al
            Consiglio, in Municipio, insieme alla questione delle tribù. Il
            taccuino torna nella giubba con la riga che riguarda te.
          effetti: { sospetto: 0.5, pista.sepolcro: 1, racconto: 1 }
      - testo: "Chiedergli qualcosa in cambio"
        descrizione: "Per un lavoro così la Caserma avrebbe mandato quattro guardie e un sergente. Bisogna ricordarglielo con garbo."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: La paga di servizio
          testo: |
            Gli fai notare che per scendere in quella cripta la Caserma avrebbe
            mandato quattro guardie e un sergente, e che le guardie si pagano.
            Galdrick ci pensa, poi chiama un furiere dalle scale e gli fa
            contare la somma dalla cassa delle spese di servizio.

            «Firma la ricevuta» dice. «Il rapporto lo metto agli atti. Capomozzo
            e le tribù li porto al Consiglio, in Municipio, alla prossima
            seduta.» Ti guarda firmare, e soltanto allora toglie i pollici dalla
            cintura.
          effetti: { monete: 20, pista.sepolcro: 1, racconto: 1 }
        fallimento:
          titolo: La tariffa
          testo: |
            Galdrick ti ascolta fino in fondo, poi dice che la Caserma paga una
            tariffa e che la tariffa è scritta. Il furiere ti conta il poco
            che la tariffa prevede contro ricevuta e lo sceriffo intanto guarda la spada nella
            teca.

            Ti dice che il rapporto andrà agli atti, e che la questione delle
            tribù la porterà al Consiglio, in Municipio. Quando ti saluta lo fa
            con un cenno del capo, e la mano resta nella cintura.
          effetti: { monete: 5, rep.caserma: -0.5, pista.sepolcro: 1, racconto: 1 }

  # ------------------------------------------------------------ carte della pista
  - id: carta-incubo-del-cucitore
    immagine: ambientazione/evento-notti-cucite-145
    titolo: La conta del Cucitore
    sommario: "In un cortile della Città Bassa i bambini fanno la conta sul Cucitore, e una madre li guarda dalla soglia."
    tipo: carta
    area: citta-bassa
    requisiti: [pista.sepolcro >= 5]
    testo: |
      In un cortile della Città Bassa, fra i panni stesi e un pozzo coperto da
      un'asse, sei bambini fanno la conta in cerchio. «Cuci cuci Cucitore, chi
      si muove perde il cuore» cantano, e chi resta fuori chiude gli occhi e
      conta fino a venticinque. Venticinque furono le vittime, e il conto ai
      bambini l'ha insegnato qualche fratello maggiore.

      Sulla soglia di una casa una donna con il grembiule bagnato li guarda e
      si torce le mani. Senza che tu glielo chieda ti racconta che da una
      settimana sua figlia si sveglia gridando e dice che sotto il letto c'è un
      uomo con gli occhi cuciti. Metà dei bambini della via fa lo stesso sogno.
      Stamattina sul davanzale ha trovato un uccellino di legno intagliato,
      grande quanto un pollice, e lo tiene nella tasca del grembiule senza
      toccarlo.
    opzioni:
      - testo: "Guardare l'uccellino"
        descrizione: "La donna non vuole toccarlo. Tu puoi."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Facile }
        successo:
          titolo: Uccellini contro gli incubi
          testo: |
            Rigirandolo trovi sotto la coda una piccola spirale incisa. L'hai
            già vista sui banchi del mercato, dove un vecchio intagliatore
            vende uccellini contro gli incubi a pochi spiccioli, e qualche
            vicino premuroso deve averne lasciato uno su ogni davanzale.

            Glielo spieghi. La donna ride per la prima volta e se lo rimette in
            tasca, questa volta con la mano.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Nel focolare
          testo: |
            Lo rigiri fra le dita senza capirci niente. Il legno è fresco e
            profuma ancora di resina, e il becco è inciso con molta cura. La
            donna te lo toglie di mano e lo butta nel focolare, dove prende
            fuoco con una fiamma alta.

            Quella notte, nel dormiveglia, senti un coltello che incide il
            legno.
          effetti: { tormento: 0.5 }
      - testo: "Insegnare ai bambini un'altra conta"
        descrizione: "Una qualunque, purché non parli di lui."
        esito:
          titolo: I pesci del Torvessa
          testo: |
            Ti accucci nel cerchio e insegni loro una conta sui pesci del
            Torvessa, dove chi resta fuori deve fare la carpa. I bambini la
            imparano in fretta e la storpiano subito, e il più piccolo fa la
            carpa anche quando non tocca a lui.

            Dalla soglia la madre ti guarda con le mani ferme nel grembiule.
          effetti: { tormento: -0.5 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: "Esci dal cortile. Alle tue spalle i bambini ricominciano a contare."

  - id: carta-commissione-di-vantes
    immagine: personaggi/padre-vantes
    titolo: Un favore per il Velo
    sommario: "Sui gradini della Cattedrale Padre Vantes ti posa una mano sul braccio. Ha un favore piccolo da chiederti."
    tipo: carta
    area: quartieri-alti
    requisiti: [pista.sepolcro >= 3]
    testo: |
      Sui gradini della Cattedrale del Velo Padre Vantes ha appena congedato
      una famiglia in lutto quando ti vede, e scende due gradini per venirti
      incontro. Ti posa una mano sul braccio mentre parla, come fa con tutti,
      e ti ringrazia per la cripta di Padre Sollen con una voce che si abbassa
      sul nome.

      Ha due favori da chiederti e te li propone insieme, perché scelga tu. In
      una borsa di tela ci sono i vasetti di un balsamo per la tosse che ha
      preparato con le sue mani, per il garzone delle fosse, che da quando
      Gundo Marl è sparito tiene il cimitero da solo e tossisce giorno e notte. Poi c'è un vecchio cardatore di lana che
      stamattina seppellisce la moglie al cimitero della Città Bassa, e nessun
      parente può accompagnarlo nella discesa. Aspetta su una panca accanto al
      portale, con il cappello in mano e le scarpe lucidate per l'occasione,
      una delle due con il laccio rosso perché quello nero si è rotto.
    opzioni:
      - testo: "Portare il balsamo al garzone delle fosse"
        descrizione: "Una borsa di vasetti e una lunga discesa fino al cimitero."
        esito:
          titolo: La tosse del garzone
          testo: |
            Trovi il garzone curvo su una fossa, con la tosse che gli scuote la
            schiena a ogni palata. Prende i vasetti e li conta, poi annota la
            consegna nel registro di Gundo, con una grafia grossa che non somiglia
            a quella minuta delle pagine prima, nella colonna dei defunti perché
            è l'unica che c'è.

            Padre Vantes lo viene a sapere prima di sera.
          effetti: { rep.velo: 0.5 }
      - testo: "Accompagnare il vecchio alle esequie"
        descrizione: "La discesa è lunga e il vecchio ha voglia di parlare."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Facile }
        successo:
          titolo: Stonata
          testo: |
            Il vecchio si appoggia al tuo braccio per tutta la discesa e ti
            racconta della moglie, che cantava stonata sapendolo benissimo.
            Alle esequie resti in fondo, con il cappello che ti ha dato da
            tenere, e quando il monaco ha finito lui ti stringe la mano con
            entrambe le sue.

            In serata un accolito sale al Grifone a ringraziarti da parte di
            Padre Vantes.
          pe: { empatia: 3 }
          effetti: { rep.velo: 0.5 }
        fallimento:
          titolo: In ritardo
          testo: |
            Lo porti giù troppo in fretta, e a metà della scalinata il vecchio
            inciampa e si siede su un gradino a riprendere fiato. Arrivate al
            cimitero che il monaco ha già cominciato.

            Il vecchio ti ringrazia lo stesso, con il fiato corto, poi va a
            mettersi in prima fila con le scarpe impolverate.
      - testo: "Scusarti con Padre Vantes"
        costo: 0
        esito:
          testo: "Vantes ti stringe il polso e dice che troverà qualcun altro. Poi torna dal vecchio sulla panca e gli si siede accanto."

  - id: carta-curiosi-dell-eroe
    immagine: ambientazione/quartieri-alti
    titolo: Uno di quelli del cimitero
    sommario: "In piazza qualcuno ti riconosce. Eri nella cripta di Padre Sollen, e nei Quartieri Alti lo sanno."
    tipo: carta
    area: quartieri-alti
    requisiti: [pista.sepolcro >= 3]
    testo: |
      Nella piazza davanti alla Casa dei Nodi una donna con un cesto di pere ti
      guarda due volte, poi dice ad alta voce che sei uno di quelli scesi
      nella cripta di Padre Sollen, al cimitero. In un momento hai intorno
      una mezza dozzina di persone. Una serva ti tocca la manica per
      vedere se è vera, e un ragazzino di forse dieci anni ti chiede se i morti
      puzzano davvero.

      Dalla sua bottega esce di corsa un mercante di candele con il grembiule
      ancora addosso. Vorrebbe mettere il tuo nome sull'insegna, sotto la
      scritta *Candele per ogni oscurità*, e paga in contanti. Dietro di lui
      un garzone regge un'asse fresca di vernice dove il tuo nome è già
      scritto, con una lettera sbagliata.
    opzioni:
      - testo: "Lasciargli il nome"
        descrizione: "Qualche moneta, e una lettera da correggere."
        esito:
          titolo: Candele per ogni oscurità
          testo: |
            Il mercante ti conta le monete nel palmo e manda il garzone a
            correggere la lettera. Il ragazzo la ridipinge seduto sul gradino,
            con la lingua fra i denti, e alla fine l'errore si vede un po' meno.
            Per qualche settimana chi entra in bottega chiede se le candele le
            hai provate tu, e il mercante giura di sì.
          effetti: { monete: 6 }
      - testo: "Rispondere al ragazzino"
        descrizione: "Ha fatto una domanda precisa, e mezza piazza aspetta la risposta."
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Facile }
        successo:
          titolo: Il freddo della cripta
          testo: |
            Gli dici che sì, i morti puzzano, ma la cosa peggiore della cripta
            era il freddo, che ti è rimasto nelle dita per due giorni. Il
            ragazzino si guarda le mani. La donna delle pere ti regala una pera
            e la gente si sparpaglia contenta, ripetendo la storia del freddo.
          pe: { espressivita: 5 }
        fallimento:
          titolo: Lo zio
          testo: |
            Cominci dalla fine, e quando torni all'inizio ti perdi a metà. Il
            ragazzino ti ascolta deluso, poi dice che suo zio questa storia la
            racconta meglio, e la donna delle pere ride così forte che le cade
            una pera dal cesto.
          effetti: { scandalo: 0.5 }
      - testo: "Svincolarti dalla folla"
        costo: 0
        esito:
          testo: "Dici che hai fretta e ti apri un varco fra le persone. Il ragazzino ti segue per un tratto, poi lo richiama sua madre."
