# Pista "Il Sepolcro violato", seconda metà (5 → 7): gli archivi della Biblioteca e il rapporto a
# Galdrick, più tre carte legate alla pista (Città Bassa e Quartieri Alti).
storylet:
  # ------------------------------------------------------------ 5 → 6 · la Biblioteca, gli archivi
  - id: biblioteca-gli-archivi
    presso: biblioteca-di-qir-azel
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: Gli archivi
    sommario: "Torni in Biblioteca con le parole dello spettro. I tre uomini che le ascoltano hanno letto molto, e non sanno dove metterle."
    luogo: Biblioteca di Qir-Azel, la sala di lettura
    area: quartieri-alti
    requisiti: [pista.sepolcro == 5]
    testo: |
      Ulric Stanne ti ascolta senza interromperti, con il monocolo in mano, e
      quando arrivi alle parole dello spettro se lo rimette sull'occhio.
      Mattias Crenn è sceso dal primo piano con le lenti appannate e una
      macchia d'inchiostro sul mento. Padre Walter occupa l'unica sedia che
      regge la sua mole, con il saio chiuso fino al collo nonostante il caldo
      dei lampadari.

      {origine figlio-del-circolo} Al Circolo ti hanno insegnato a
      riconoscere un legno dall'odore, e quello della Roccia non somiglia a
      nessuno del Bosco di Velthar. Ti sorprendi ad annusarti la manica sotto
      il tavolo, come un cane che non si fida della propria cuccia.

      «La Regina delle Ali Spezzate» ripete Ulric. Sulla ragazza d'argento
      nessuno azzarda niente, e Ulric osserva che una parola detta da uno
      spettro non basta a fare una persona.

      {accademiche Media} Un nome che un bibliotecario come Ulric non ha mai
      letto è un nome che qualcuno ha tenuto lontano dalla carta, oppure ce
      l'ha tolto.

      Walter parla per ultimo. «Le ali dell'altare erano per metà di metallo,
      e nelle venature del legno correvano fili di rame. Le macchine dei
      Precursori scese dai tetti la sera del Festival avevano lo stesso rame.
      Questo l'ho visto, il resto lo lascio a chi legge.»

      Mattias si alza di scatto e dice di cominciare dagli orchi di
      Capomozzo, la tribù di Balthog il Prescelto. Ulric indica il catalogo
      con il mento.
    opzioni:
      - testo: "Rifare le ricerche nel catalogo"
        descrizione: "Gli indici delle cronache della costa nord rimandano a qualche volume. Il catalogo dovrebbe sapere dove sta."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La numerazione che salta
          testo: |
            Parti dagli indici delle cronache della costa nord, che rimandano quasi
            tutti a qualche volume su Capomozzo o sul Rovolungo. Nel cassetto del
            catalogo cerchi le schede di quei volumi, con le dita che si sporcano
            di polvere grigia, e la numerazione salta dalla trecentododici alla
            trecentoquarantatré.

            Ulric si china sul cassetto e conta le schede due volte con il dito,
            poi dice piano che sono spariti, le schede insieme ai libri.
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Il cassetto sbagliato
          testo: |
            Passi il pomeriggio sugli indici e ti perdi fra tre cataloghi diversi,
            uno dei quali, lo scopri alla fine, ordina i libri secondo il colore
            della rilegatura. Quando il custode comincia a spegnere i lampadari hai
            gli occhi che bruciano e in mano nessun titolo utile.

            Ulric ti accompagna alla porta e ti dice di tornare domattina, prima
            dell'apertura, perché stanotte agli scaffali ci sale lui con la
            lanterna.
          segue: biblioteca-gli-archivi-mattina
          effetti: { tormento: 0.5 }
      - testo: "Guardare gli scaffali invece dei libri"
        descrizione: "In galleria la polvere non la toglie nessuno da anni. Se qualcuno ha preso qualcosa, deve aver lasciato un segno."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: I rettangoli puliti
          testo: |
            Sali in galleria con una lanterna e guardi i ripiani invece dei dorsi.
            Sulla parete nord la polvere è alta un dito dappertutto, tranne che su
            due ripiani, dove restano i rettangoli puliti lasciati dai libri. Ne
            conti una trentina in fila, e sulla targhetta di ottone del ripiano c'è
            scritto *Costa nord*.

            Quando chiami Ulric, lui sale tenendosi al corrimano e guarda i
            rettangoli senza toccarli. «Capomozzo e il Rovolungo, fino all'ultimo
            atlante» dice a bassa voce, e si toglie il monocolo per pulirlo sul
            panciotto.
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Il raschio della scala
          testo: |
            Resti in galleria finché accendono i lampadari della sera, e non trovi
            altro che polvere. A un certo punto una scala a pioli scorre sul
            binario dietro di te, e il raschio del legno ti riporta alla capanna
            sulla Roccia, al coltello che incideva da solo.

            Ulric ti trova sull'ultimo gradino della galleria e ti porta di sotto,
            con una mano sulla tua spalla che pesa meno di quanto ti aspettavi. I
            libri su Capomozzo e sul Rovolungo non ci sono più, e qualcuno ha tolto
            anche le schede.
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1, tormento: 1 }
      - testo: "Farsi aprire il registro dei prestiti"
        descrizione: "Il registro lo tiene un copista del Municipio, e lo apre solo a chi sa chiederlo nel modo giusto o conosce il regolamento."
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il registro dei prestiti
          testo: |
            Il copista ha le maniche di lustrino e ti ascolta con le labbra
            strette. Gli parli con tutto il garbo che hai, e alla fine gli citi
            l'articolo del regolamento cittadino che apre il registro a chi ha
            servito la città.

            Negli ultimi dieci anni nessun volume della costa nord è uscito in
            prestito, e le pagine di quegli anni sono ordinate e complete.

            Ulric legge da sopra la tua spalla, e il monocolo gli cade sul
            panciotto. «Allora sono spariti», dice, «e chi li ha presi da questo
            registro non è passato.»
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }
        fallimento:
          titolo: Un nome su un foglio
          testo: |
            Il copista ti ascolta fino in fondo, poi ti chiede il nome e lo scrive
            su un foglio a parte insieme alla data e all'ora, con una calligrafia
            lenta e soddisfatta. Il registro resta chiuso sotto il suo gomito.

            Lo apre un'ora dopo Ulric, che il copista lo conosce da trent'anni, e
            ti chiama a vedere. Dei libri su Capomozzo e sul Rovolungo non è mai
            uscito niente, eppure dagli scaffali sono spariti. Il foglio con il tuo
            nome intanto è finito in un cassetto, e a fine settimana salirà in
            Municipio con gli altri.
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1, sospetto: 1 }
      - testo: "Restare con Ulric fino alla chiusura"
        descrizione: "Lui conosce gli scaffali, tu reggi le lanterne. Ci vorrà tutta la sera."
        costo: 2
        esito:
          titolo: La lunga sera
          testo: |
            Porti le lanterne su e giù per la galleria mentre Ulric cerca, e dopo
            un po' smetti di contare i gradini. Su Capomozzo e sul Rovolungo non
            trova nemmeno una scheda.

            Quando il custode spegne l'ultimo lampadario Ulric si siede sui gradini
            della galleria, con il panciotto sbottonato. «Io sono qui da
            quarant'anni, e la memoria perfetta non ce l'ho. Ma una cosa così non
            l'avevo mai vista.»
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }
      - testo: "Salutare il copista per nome"
        descrizione: "Il copista del Municipio lo conosci da quando portavi i calzoni corti. Ha ricopiato in bella tutti i contratti di matrimonio dei tuoi cugini."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Come un favore a cena
          testo: |
            Il copista ha le maniche di lustrino e le labbra strette, finché non ti
            riconosce. Gli chiedi il registro dei prestiti come si chiede un favore
            a cena, e lui lo gira verso di te senza citare nessun articolo del
            regolamento.

            Negli ultimi dieci anni nessun volume della costa nord è uscito in
            prestito. Ulric legge da sopra la tua spalla, e il monocolo gli cade
            sul panciotto. «Allora sono spariti» dice, «e chi li ha presi da questo
            registro non è passato.»
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }
      - testo: "Partire dalle bibliografie di Temmerin"
        descrizione: "In fondo ai manuali dell'Accademia ci sono le bibliografie, e quelle sulla costa nord le hai ricopiate al primo anno."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Le segnature a memoria
          testo: |
            Ti fai dare carta e penna e scrivi a memoria le segnature che Temmerin
            vi faceva ricopiare in fondo ai compiti, con la stessa cantilena con
            cui le dettava, e Mattias le legge da sopra la tua spalla annuendo a
            ogni riga. Poi vai dritto al cassetto del catalogo. Le schede di quei
            volumi non ci sono, e la numerazione salta dalla trecentododici alla
            trecentoquarantatré.

            Ulric conta le schede due volte con il dito e dice piano che sono
            spariti, le schede insieme ai libri.
          pe: { accademiche: 3 }
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }
      - testo: "Leggere la polvere come nelle rovine"
        descrizione: "Sulle piattaforme della Cicatrice si impara presto che la polvere dice chi è passato prima di te, e quando."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: La polvere della galleria
          testo: |
            Sali in galleria con la lanterna bassa, tenuta di lato come si tiene
            nelle rovine per far risaltare i segni sul pavimento, e guardi i
            ripiani invece dei dorsi. Sulla parete nord la polvere è alta un dito
            dappertutto, tranne che su due ripiani, dove restano i rettangoli
            puliti lasciati dai libri, una trentina in fila sotto la targhetta di
            ottone della *Costa nord*.

            Quando chiami Ulric, lui sale tenendosi al corrimano e guarda i
            rettangoli senza toccarli. «Capomozzo e il Rovolungo, fino all'ultimo
            atlante» dice a bassa voce, e si toglie il monocolo per pulirlo sul
            panciotto.
          pe: { percezione: 3 }
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }

  - id: biblioteca-gli-archivi-mattina
    presso: biblioteca-di-qir-azel
    immagine: personaggi/ulric-stanne
    titolo: Prima dell'apertura
    tipo: seguito
    luogo: Biblioteca di Qir-Azel, sulla porta
    area: quartieri-alti
    requisiti: [pista.sepolcro == 5]
    testo: |
      La mattina dopo Ulric Stanne ti aspetta sulla porta della Biblioteca,
      prima che apra. Ha il panciotto rosso abbottonato storto e le borse
      sotto gli occhi gonfie, perché ha passato la notte agli scaffali.

      «Capomozzo e Rovolungo» dice senza salutarti. «Gli atlanti e le
      cronache marittime, fino all'ultima nota di un cacciatore di foche. Li
      ho cercati nel catalogo vecchio e in quello nuovo. Le schede le hanno
      tolte e gli scaffali li hanno svuotati, con ordine. Sono spariti.»

      Si toglie il monocolo e lo pulisce sul panciotto, più a lungo del
      necessario. «Qir-Azel vede passare più libri di quanti tramonti veda un
      uomo, e io non posso giurare di averli visti tutti. Però una cosa del
      genere, in quarant'anni, non mi era mai capitata. È molto strano.»

      Ti porge un foglio piegato in quattro. Sopra, con la sua grafia piccola
      e diritta, ci sono le segnature dei volumi mancanti, una sotto l'altra.
    opzioni:
      - testo: "Prendere la lista"
        descrizione: "Trenta segnature e nessun libro."
        esito:
          titolo: Le segnature
          testo: |
            Ti infili il foglio nella giubba. Ulric resta sulla soglia a guardare
            la strada, dove un garzone porta il pane ai manieri, e ti chiede di non
            parlarne in giro finché non ha capito chi entra in galleria quando lui
            non c'è.

            Scendendo verso la piazza tocchi il foglio due volte attraverso la
            stoffa, per sentire che c'è ancora.
          imposta: { indizio.archivi-mutilati: 1 }
          effetti: { pista.sepolcro: 1 }

  # ------------------------------------------------------------ 6 → 7 · il rapporto a Galdrick
  - id: galdrick-il-rapporto
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: Il rapporto
    sommario: "Lo sceriffo Galdrick aspetta il tuo rapporto alla Caserma, e tu hai da raccontargli una cripta e una roccia nel fiume."
    luogo: Guarnigione di Qir-Azel, il corridoio del mastio
    area: quartieri-alti
    requisiti: [pista.sepolcro == 6]
    testo: |
      Le due guardie in giaco di maglia davanti al portone ti riconoscono e
      ti fanno passare.

      {origine fuggiasco-di-ghoran} In un cortile pieno di uomini armati gli
      occhi cercano le uscite prima di tutto il resto. Ne contano due, e il
      portone da cui sei entrato, alle tue spalle, non ti sembra più tanto
      largo.

      L'ufficio dello sceriffo è pieno di muratori, perché dopo la razzia
      hanno trovato una crepa nel muro maestro, e la polvere di calce arriva
      fino al corridoio. Galdrick ti riceve nel corridoio del mastio, sotto
      la teca con la spada ammaccata di Ivo Carstan, e qui fuori sembra non
      sapere dove mettere le mani.

      Gli racconti della cripta e della Roccia di Wren. Quando nomini il
      Cucitore alza gli occhi sulla spada nella teca e resta zitto finché non
      hai finito.

      «Gli orchi presi vivi dopo la razzia li ho interrogati io, con il
      carceriere presente» dice. «Nella cantilena c'erano due informazioni
      utili. Il loro capo non era un orco, e doveva fare qualcosa al
      cimitero. La tunica che abbiamo trovato nella cripta è di taglia
      piccola. La metto agli atti insieme alle orme del cimitero.»

      In fondo al corridoio passa Borso, con il grembiule di cuoio e un
      secchio di zuppa per le celle del sotterraneo.
    opzioni:
      - testo: "Raccontargli tutto"
        descrizione: "Anche le parole dello spettro e i buchi nel catalogo della Biblioteca."
        esito:
          titolo: Agli atti
          testo: |
            Gli riferisci le parole dello spettro sulla Regina e sulla ragazza
            d'argento, poi gli parli degli scaffali vuoti della costa nord.

            «Capomozzo è la tribù di Balthog» dice. «Prima del Festival le tribù
            del circondario non si erano mai mosse insieme. Metto tutto agli atti e
            lo porto al Consiglio, in Municipio, alla prossima seduta. Che cosa
            deciderà il Consiglio non lo so ancora, e se lo sapessi non te lo direi
            in un corridoio.»
          effetti: { rep.caserma: 1, pista.sepolcro: 1, racconto: 1 }
      - testo: "Tenerti qualcosa per te"
        descrizione: "In Città Bassa c'è chi pagherebbe bene le parole dello spettro sulla ragazza d'argento. Lo sceriffo però registra tutto."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Mezzo rapporto
          testo: |
            Gli racconti dello spettro e degli scaffali vuoti, e quando arrivi alla
            ragazza d'argento passi oltre senza cambiare voce.

            «Capomozzo è la tribù di Balthog» dice alla fine. «Prima del Festival
            le tribù del circondario non si erano mai mosse insieme. Metto agli
            atti e porto la cosa al Consiglio, in Municipio.»

            Uscendo dal portone ti ripeti a mente le parole che hai taciuto, e le
            tieni in testa per tutta la discesa verso la Città Bassa, dove qualcuno
            saprà quanto valgono.
          effetti: { informazioni.segreto: 1, pista.sepolcro: 1, racconto: 1 }
        fallimento:
          titolo: Una riga sul taccuino
          testo: |
            Quando arrivi alle ultime parole dello spettro salti mezza frase, e
            Galdrick se ne accorge. Ti guarda più a lungo, poi tira fuori dalla
            giubba un taccuino e ci scrive una riga, con una matita corta.
            «Continua» dice, e tu gli racconti anche la parte che volevi tenerti,
            con la faccia che ti scotta.

            Alla fine ti dice che metterà tutto agli atti e porterà la cosa al
            Consiglio, in Municipio, insieme alla questione delle tribù.
          effetti: { sospetto: 1, pista.sepolcro: 1, racconto: 1 }
      - testo: "Chiedergli qualcosa in cambio"
        descrizione: "Per un lavoro così la Caserma avrebbe mandato quattro guardie e un sergente. Bisogna ricordarglielo con garbo."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: La paga di servizio
          testo: |
            Gli fai notare che per scendere in quella cripta la Caserma avrebbe
            mandato quattro guardie e un sergente, e che le guardie si pagano.
            Galdrick ci pensa, poi chiama un furiere dalle scale e gli fa contare
            la somma dalla cassa delle spese di servizio.

            «Il rapporto lo metto agli atti. Capomozzo e le tribù li porto al
            Consiglio, in Municipio, alla prossima seduta.»
          effetti: { monete: 20, pista.sepolcro: 1, racconto: 1 }
        fallimento:
          titolo: La tariffa
          testo: |
            Galdrick ti ascolta fino in fondo, poi dice che la Caserma paga una
            tariffa e che la tariffa è scritta. Il furiere ti conta il poco che la
            tariffa prevede contro ricevuta, una moneta alla volta, e lo sceriffo
            intanto guarda la spada nella teca.

            Ti dice che il rapporto andrà agli atti, e che la questione delle tribù
            la porterà al Consiglio, in Municipio. Quando ti saluta lo fa con un
            cenno del capo, e la mano resta nella cintura.
          effetti: { monete: 5, rep.caserma: -0.5, pista.sepolcro: 1, racconto: 1, scandalo: 0.5 }
      - testo: "Presentargli il conto come al banco"
        descrizione: "Al banco un conto si fa voce per voce, e una voce scritta si discute meno di una richiesta."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: mentale, abilita: [politica-ed-economia, persuasione], difficolta: Facile }
        successo:
          titolo: Voce per voce
          testo: |
            Tiri fuori un foglio e glielo scrivi davanti, voce per voce, con la
            grafia che usi per i clienti che pagano a fine mese. In cima metti le
            quattro guardie e il sergente che la Caserma non ha mandato, e sotto
            l'olio delle lanterne.

            Galdrick legge il foglio muovendo le labbra, poi chiama un furiere
            dalle scale e gli fa contare la somma dalla cassa delle spese di
            servizio. «Il rapporto lo metto agli atti, e Capomozzo lo porto al
            Consiglio alla prossima seduta.»
          effetti: { monete: 20, pista.sepolcro: 1, racconto: 1 }
        fallimento:
          titolo: Il tariffario della Caserma
          testo: |
            Gli scrivi il conto voce per voce, e lui lo legge fino in fondo con i
            pollici nella cintura. Poi ti mostra il tariffario della Caserma
            appeso dietro la teca, che ha voci più vecchie delle tue e prezzi più
            bassi. Il furiere ti conta il poco che prevede, una moneta alla volta.

            Ti dice che il rapporto andrà agli atti, e che le tribù le porterà al
            Consiglio. Il tuo foglio te lo rende piegato in due.
          effetti: { monete: 5, rep.caserma: -0.5, pista.sepolcro: 1, racconto: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ carte della pista
  - id: carta-incubo-del-cucitore
    immagine: ambientazione/evento-notti-cucite-145
    titolo: La conta del Cucitore
    sommario: "In un cortile della Città Bassa i bambini fanno la conta sul Cucitore, e una madre li guarda dalla soglia."
    tipo: carta
    area: citta-bassa
    requisiti: [pista.sepolcro >= 5]
    testo: |
      In un cortile della Città Bassa, fra i panni stesi e un pozzo coperto
      da un'asse, sei bambini fanno la conta in cerchio. «Cuci cuci Cucitore,
      chi si muove perde il cuore» cantano, e chi resta fuori chiude gli
      occhi e conta fino a venticinque.

      Sulla soglia di una casa una donna con il grembiule bagnato li guarda e
      si torce le mani. Senza che tu glielo chieda ti racconta che da una
      settimana sua figlia si sveglia gridando e dice che sotto il letto c'è
      un uomo con gli occhi cuciti. Stamattina sul davanzale ha trovato un
      uccellino di legno intagliato, grande quanto un pollice, e lo tiene
      nella tasca del grembiule senza toccarlo.
    opzioni:
      - testo: "Guardare l'uccellino"
        descrizione: "La donna non vuole toccarlo. Tu puoi."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Facile }
        successo:
          titolo: Uccellini contro gli incubi
          testo: |
            Rigirandolo trovi sotto la coda una piccola spirale incisa. L'hai già
            vista sui banchi del mercato, dove un vecchio intagliatore vende
            uccellini contro gli incubi a pochi spiccioli, e qualche vicino
            premuroso deve averne lasciato uno su ogni davanzale.

            Glielo spieghi. La donna ride per la prima volta e se lo rimette in
            tasca, questa volta con la mano.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Nel focolare
          testo: |
            Lo rigiri fra le dita senza capirci niente. Il legno è fresco e profuma
            ancora di resina, e il becco è inciso con molta cura. La donna te lo
            toglie di mano e lo butta nel focolare, dove prende fuoco con una
            fiamma alta.

            Quella notte, nel dormiveglia, senti un coltello che incide il legno.
          effetti: { tormento: 1 }
      - testo: "Insegnare ai bambini un'altra conta"
        descrizione: "Una qualunque, purché non parli di lui."
        esito:
          titolo: I pesci del Torvessa
          testo: |
            Ti accucci nel cerchio, con le ginocchia che scricchiolano, e insegni
            loro una conta sui pesci del Torvessa, dove chi resta fuori deve fare
            la carpa. I bambini la imparano in fretta e la storpiano subito, e il
            più piccolo fa la carpa anche quando non tocca a lui, con le guance
            gonfie e gli occhi sgranati.

            Dalla soglia la madre ti guarda con le mani ferme nel grembiule.
          effetti: { tormento: -0.5 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: "Esci dal cortile con la nuca ancora fredda. Alle tue spalle i bambini ricominciano a contare."
      - testo: "Insegnargli la conta dei vicoli"
        descrizione: "In questi cortili ci hai giocato anche tu, e la conta che facevate allora ce l'hai ancora in bocca."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: La conta del bottaio
          testo: |
            Entri nel cerchio e gli dici che la conta del Cucitore è roba da
            bambini piccoli, e che nei vicoli, quando eri della loro altezza, si
            contava sul bottaio che rincorre chi gli ruba i cerchi.

            Dalla soglia la madre ti guarda con le mani ferme nel grembiule, e
            quando te ne vai ti dice che quella conta la cantava anche lei.
          effetti: { tormento: -0.5 }

  - id: carta-commissione-di-vantes
    immagine: personaggi/padre-vantes
    titolo: Un favore per il Velo
    sommario: "Sui gradini della Cattedrale Padre Vantes ti posa una mano sul braccio. Ha un favore piccolo da chiederti."
    tipo: carta
    area: quartieri-alti
    requisiti: [pista.sepolcro >= 3]
    testo: |
      Sui gradini della Cattedrale del Velo Padre Vantes ha appena congedato
      una famiglia in lutto quando ti vede, e scende due gradini per venirti
      incontro. Ti posa una mano sul braccio mentre parla, come fa con tutti,
      e ti ringrazia per la cripta di Padre Sollen con una voce che si
      abbassa sul nome.

      {origine accolito-del-velo} Con te la mano sul braccio resta un poco di
      più, e Vantes ti guarda le mani prima della faccia, come la sera della
      tenda dei feriti. Ti viene da nasconderle dietro la schiena, anche se
      sono pulite.

      Ha due favori da chiederti e te li propone insieme, perché scelga tu.
      In una borsa di tela ci sono i vasetti di un balsamo per la tosse che
      ha preparato con le sue mani, per il garzone delle fosse, che da quando
      Gundo Marl è sparito tiene il cimitero da solo e tossisce giorno e
      notte. Poi c'è un vecchio cardatore di lana che stamattina seppellisce
      la moglie al cimitero della Città Bassa, e nessun parente può
      accompagnarlo nella discesa.
    opzioni:
      - testo: "Portare il balsamo al garzone delle fosse"
        descrizione: "Una borsa di vasetti e una lunga discesa fino al cimitero."
        esito:
          titolo: La tosse del garzone
          testo: |
            Trovi il garzone curvo su una fossa, con la tosse che gli scuote la
            schiena a ogni palata. Prende i vasetti e li conta, poi annota la
            consegna nel registro di Gundo, con una grafia grossa che non somiglia
            a quella minuta delle pagine prima, nella colonna dei defunti perché è
            l'unica che c'è.

            Padre Vantes lo viene a sapere prima di sera.
          effetti: { rep.velo: 0.5 }
      - testo: "Accompagnare il vecchio alle esequie"
        descrizione: "La discesa è lunga e il vecchio ha voglia di parlare."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Facile }
        successo:
          titolo: Stonata
          testo: |
            Il vecchio si appoggia al tuo braccio per tutta la discesa e ti
            racconta della moglie, che cantava stonata sapendolo benissimo. Pesa
            poco, e ogni tanto si ferma per finire una frase. Alle esequie resti in
            fondo, con il cappello che ti ha dato da tenere, e quando il monaco ha
            finito lui ti stringe la mano con entrambe le sue.

            In serata un accolito sale al Grifone a ringraziarti da parte di Padre
            Vantes.
          pe: { empatia: 3 }
          effetti: { rep.velo: 0.5 }
        fallimento:
          titolo: In ritardo
          testo: |
            Lo porti giù troppo in fretta, e a metà della scalinata il vecchio
            inciampa e si siede su un gradino a massaggiarsi il ginocchio. Arrivate al
            cimitero che il monaco ha già cominciato.

            Il vecchio ti ringrazia lo stesso, con il fiato corto, poi va a mettersi
            in prima fila con le scarpe impolverate.
          effetti: { scandalo: 0.5 }
      - testo: "Scusarti con Padre Vantes"
        costo: 0
        esito:
          testo: "Vantes ti stringe il polso, con una pressione gentile e breve, e dice che troverà qualcun altro. Poi torna dal vecchio sulla panca e gli si siede accanto."
      - testo: "Accompagnare il vecchio e dire le parole al posto dei parenti"
        descrizione: "Al Velo hai servito abbastanza esequie da sapere dove sta chi accompagna, e quali parole spettano a un parente che non c'è."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Le parole del parente
          testo: |
            Il vecchio si appoggia al tuo braccio per tutta la discesa e ti
            racconta della moglie, che cantava stonata sapendolo benissimo. Ti
            metti al suo fianco, dove starebbe un figlio, e quando il monaco fa la
            pausa per i parenti dici tu le parole di commiato, a voce bassa, come
            te le hanno insegnate in Cattedrale.

            Quando è finita ti stringe la mano con entrambe le sue. In serata un
            accolito sale al Grifone a ringraziarti da parte di Padre Vantes, e ti
            chiama per nome.
          pe: { empatia: 3 }
          effetti: { rep.velo: 0.5 }

  - id: carta-curiosi-dell-eroe
    immagine: ambientazione/quartieri-alti
    titolo: Uno di quelli del cimitero
    sommario: "In piazza qualcuno ti riconosce. Eri nella cripta di Padre Sollen, e nei Quartieri Alti lo sanno."
    tipo: carta
    area: quartieri-alti
    requisiti: [pista.sepolcro >= 3]
    testo: |
      Nella piazza davanti alla Casa dei Nodi una donna con un cesto di pere
      ti guarda due volte, poi dice ad alta voce che sei uno di quelli scesi
      nella cripta di Padre Sollen, al cimitero. In un momento hai intorno
      una mezza dozzina di persone. Una serva ti tocca la manica per vedere
      se è vera, e un ragazzino di forse dieci anni ti chiede se i morti
      puzzano davvero.

      {origine rampollo-dei-quartieri-alti} La donna delle pere ti ha
      riconosciuto per la cripta, ma la serva che ti tocca la manica ti ha
      riconosciuto per il cognome, e lo dice piano alla vicina. Entro sera in
      famiglia sapranno che ti sei fatto toccare la manica in piazza, e
      qualcuno troverà il modo di fartelo notare a cena.

      Dalla sua bottega esce di corsa un mercante di candele con il grembiule
      ancora addosso. Vorrebbe mettere il tuo nome sull'insegna, sotto la
      scritta *Candele per ogni oscurità*, e paga in contanti. Dietro di lui
      un garzone regge un'asse fresca di vernice dove il tuo nome è già
      scritto, con una lettera sbagliata.
    opzioni:
      - testo: "Lasciargli il nome"
        descrizione: "Qualche moneta, e una lettera da correggere."
        esito:
          titolo: Candele per ogni oscurità
          testo: |
            Il mercante ti conta le monete nel palmo e manda il garzone a
            correggere la lettera. Il ragazzo la ridipinge seduto sul gradino, con
            la lingua fra i denti, e alla fine l'errore si vede un po' meno, come
            una cicatrice ben cucita. Per qualche settimana chi entra in bottega
            chiede se le candele le hai provate tu, e il mercante giura di sì.
          effetti: { monete: 6 }
      - testo: "Rispondere al ragazzino"
        descrizione: "Ha fatto una domanda precisa, e mezza piazza aspetta la risposta."
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Facile }
        successo:
          titolo: Il freddo della cripta
          testo: |
            Gli dici che sì, i morti puzzano, ma la cosa peggiore della cripta era
            il freddo, che ti è rimasto nelle dita per due giorni. Mentre lo dici
            le dita te lo ricordano. Il ragazzino si guarda le mani. La donna delle
            pere ti regala una pera e la gente si sparpaglia contenta, ripetendo la
            storia del freddo.
          pe: { espressivita: 5 }
        fallimento:
          titolo: Lo zio
          testo: |
            Cominci dalla fine, e quando torni all'inizio ti perdi a metà, con
            mezza piazza che aspetta e la bocca improvvisamente secca. Il ragazzino
            ti ascolta deluso, poi dice che suo zio questa storia la racconta
            meglio, e la donna delle pere ride così forte che le cade una pera dal
            cesto.
          effetti: { scandalo: 1 }
      - testo: "Svincolarti dalla folla"
        costo: 0
        esito:
          testo: "Dici che hai fretta e ti apri un varco fra le persone, a gomiti stretti. Il ragazzino ti segue per un tratto, ancora con la sua domanda in bocca, poi lo richiama sua madre."
