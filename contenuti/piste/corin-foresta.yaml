# La caccia di Corin, la spedizione nella Foresta Strisciante (pista.corin 2 → 3).
# Si parte dalle Scuderie della Zanna Rotta in Città Bassa. Nella foresta le stanze vanno in ordine,
# secondo la profondità: 0 a cavallo lungo il fiume (le domande di Corin o gli Spiumatori), 1 ancora
# quelle due oppure l'impronta, dove si trova la pista; da 2 a 4 sulla pista (le carcasse, la parete, il
# sottobosco; la fossa solo a 2 e 3, lontano dalla radura). Poi il cuore nella radura, che porta a 3.
# Dopo il cinghiale compare il puma nero (seguito), ed è lì che la scena finisce e si torna ai Ponti
# Sospesi. Una stanza superata non ricompare nella stessa visita (src/motore/spedizioni.ts); le domande
# di Corin e la fossa spariscono anche dopo un fallimento, con le due flag qui sotto.
quality:
  - { id: foresta.domande, nome: Corin ti ha già fatto le sue domande, categoria: stato, nascosta: true, descrizione: "1 se il racconto a Corin è andato male, e in questa visita non te lo richiede." }
  - { id: foresta.fossa, nome: "Sei cadut{o|a} nella fossa di cattura", categoria: stato, nascosta: true, descrizione: "1 se sei cadut{o|a} nella fossa, e in questa visita la trappola è già scattata." }

aree:
  - id: foresta-strisciante
    immagine: ambientazione/foresta-strisciante
    nome: Foresta Strisciante
    sommario: "Una striscia di sequoie e abeti sulla riva sud del Torvessa, due chilometri a ovest della città, sotto la scarpata del Gradone Rosso."
    spedizione: { ritorno: superficie-fratturata, soglia: 5, stanze: 3 }
    testo: |
      La Foresta Strisciante comincia a ovest della città, oltre il Ponte del Conciatore e una fila di
      collinette dove crescono pini ed eucalipti radi. È una striscia di bosco lunga e stretta fra la riva sud
      del Torvessa e la scarpata color mattone del Gradone Rosso. Appena passi sotto le prime sequoie l'aria
      si fa umida e fresca, e gli zoccoli dei cavalli non fanno più rumore sullo strato di aghi.

      Il nome gliel'hanno dato i vermi carogna, che vivono sotto le radici delle sequoie e vengono su quando
      c'è da mangiare. Fra le radici più grosse la terra è smossa in cumuli molli, e nessuno di quei cumuli ha
      l'ingresso di una tana.

      Corin Ashdale cavalca accanto a te con le redini troppo corte e la schiena dritta da lezione di
      equitazione.

storylet:
  # ------------------------------------------------------------ 2 · la partenza (apre la spedizione)
  - id: verso-la-foresta-strisciante
    presso: scuderie-della-zanna-rotta
    immagine: ambientazione/scuderie-della-zanna-rotta
    titolo: Verso la Foresta Strisciante
    sommario: "Corin ti aspetta davanti alle Scuderie della Zanna Rotta con i cavalli sellati. La foresta è a ovest, oltre il Ponte del Conciatore."
    luogo: Città Bassa, davanti alle Scuderie della Zanna Rotta
    area: citta-bassa
    requisiti: [pista.corin == 2]
    testo: |
      Davanti alle Scuderie della Zanna Rotta c'è odore di fieno bagnato e di cuoio ingrassato. Il cortile è
      lastricato di ciottoli di fiume, e dove passano gli zoccoli i ciottoli sono diventati lisci e lucidi.
      Sopra la porta l'insegna mostra un cavallo da guerra che pianta gli zoccoli sulla schiena di un orco,
      dipinto con una cura che fa pensare a una faccenda personale. Il resto dell'insegna è scrostato fino al
      legno, e soltanto il sangue dell'orco ha la vernice fresca.

      {origine figlio-della-citta-bassa} Sotto questa insegna ci passavi di corsa da bambin{o|a}, perché nel
      vicolo si diceva che l'orco dipinto seguisse con gli occhi chi andava piano. Gli occhi sono due chiodi
      di ottone piantati nel legno, e le gambe allungano il passo ancora adesso.

      Corin Ashdale ti aspetta in mezzo al cortile, vestito per la caccia come se l'avesse imparato su un
      libro, con gli stivali nuovi e una balestra intarsiata di madreperla. Il cuoio degli stivali non ha
      ancora una piega sul collo del piede, e la corda della balestra è bianca di cera. Al Grifone dicono che
      dorme male dalla notte della razzia, quando gli orchi gli hanno ammazzato il cane.

      «Eccoti! Temevo che ci avessi ripensato.» Ride per primo, come fa sempre quando è imbarazzato. «Il
      signor Stroud dice che il cinghiale grosso sta nella Foresta Strisciante, vicino al fiume. Due
      chilometri appena. Beh, insomma, qualcosa di più.»

      La strada va a ovest, oltre il Ponte del Conciatore.
    opzioni:
      - testo: "Partire sul baio delle Scuderie"
        descrizione: "Il baio con la cicatrice, pagato da Corin per la giornata. Ti conosce da poco, e va al passo."
        costo: 1
        esito:
          titolo: Il baio di Stroud
          testo: |
            Il baio con la cicatrice sulla spalla si lascia montare senza storie. Poi decide da solo che si va
            al passo e non c'è verso di fargli cambiare idea. La cicatrice è una riga di pelo bianco lunga un
            palmo, e quando gli batti i talloni il muscolo lì sotto non si muove nemmeno. Corin ogni tanto si
            volta ad aspettarti e ogni volta te ne chiede scusa, come se la lentezza fosse colpa sua. Seguite
            la riva sud del Torvessa per mezz'ora con la scarpata rossa del Gradone sulla sinistra, finché le
            collinette di pini ed eucalipti radi non si aprono e davanti a voi compare il bosco scuro di
            abeti.
          imposta: { foresta.domande: 0, foresta.fossa: 0 }
          vai: foresta-strisciante
      - testo: "Partire sul tuo cavallo"
        descrizione: "Il baio di Stroud resta nella stalla. Il tuo cavallo ti conosce, e corre volentieri."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il tuo cavallo
          testo: |
            Il tuo cavallo ti riconosce dall'odore e ti spinge la spalla con il muso prima ancora che tu
            monti, e la mano ti va da sola a grattargli il collo. Seguite la riva sud del Torvessa al trotto,
            sotto la scarpata del Gradone Rosso. Il fiume vi scorre accanto largo e color fango, e per un
            lungo tratto andate più veloci della corrente. Arrivate al limitare del bosco con le gambe ancora
            fresche e Corin con il cappello di traverso, rosso in faccia per la contentezza.
          imposta: { foresta.domande: 0, foresta.fossa: 0 }
          vai: foresta-strisciante
      - testo: "Mettere in riga il baio, come nei Quartieri Alti"
        descrizione: "Le lezioni di equitazione che ti hanno fatto da ragazz{o|a}, nei salotti, non sono mai servite a niente. Con un baio testardo potrebbero servire."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        costo: 1
        esito:
          titolo: Le ginocchia
          testo: |
            Il baio con la cicatrice prova a decidere da solo che si va al passo, e tu glielo lasci credere
            per un centinaio di passi. Poi stringi le ginocchia e accorci le redini di un dito, con il gesto
            che nei Quartieri Alti si impara insieme alle buone maniere, e lui si mette al trotto con l'aria
            di averci pensato da sé. Sotto la sella senti la schiena dell'animale che si scioglie. Corin ti
            guarda dal suo cavallo con le redini troppo corte e prova a copiarti.
          imposta: { foresta.domande: 0, foresta.fossa: 0 }
          vai: foresta-strisciante

  # ------------------------------------------------------------ le stanze (ripetibili, tre a caso)
  - id: foresta-le-domande-di-corin
    immagine: personaggi/corin-ashdale
    titolo: Le domande di Corin
    sommario: "Corin cavalca accanto a te e vuole sapere chi sei e da dove vieni, e come si diventa quello che sei."
    luogo: Foresta Strisciante, lungo il fiume
    area: foresta-strisciante
    ripetibile: true
    # Corin parla di Ottone come di un nemico ancora in Consiglio: non dopo l'arresto (pista.pelle 5).
    requisiti: [pista.corin == 2, profondita.foresta-strisciante <= 1, foresta.domande == 0, pista.pelle < 5]
    testo: |
      Lungo il fiume i cavalli vanno al passo sulla ghiaia della riva, e Corin ne approfitta per parlare. Qui
      il Torvessa è basso e chiaro, e sul fondo le alghe stanno stese tutte nel verso della corrente. Di
      Ottone Malgrani Corin dice che è un cancro con i baffi perfettamente in ordine, e subito dopo ride e si
      guarda intorno.

      {origine rampollo-dei-quartieri-alti} Alle tavole dei Quartieri Alti i Malgrani si nominano dopo il
      dolce, e a voce bassa. Corin lo fa a metà mattina e a voce piena, e la parte di te cresciuta a quelle
      tavole si guarda intorno con lui.

      Si sporge sulla sella verso di te. «Chi sei, da dove vieni? E come si fa, insomma, a diventare uno che
      si mette fra la gente e gli orchi? Detta ad alta voce mi sembra una domanda stupida.»

      {empatia Facile} Vuole sapere se c'è speranza anche per lui, e si vergogna di chiederlo. Mentre aspetta
      la risposta accorcia ancora le redini, che erano già troppo corte.
    opzioni:
      - testo: "Raccontargli la verità, senza abbellirla"
        descrizione: "Anche le parti in cui avevi paura."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Media }
        successo:
          titolo: Senza abbellimenti
          testo: |
            Gli racconti com'è andata davvero, con dentro anche la paura e le cose fatte male che sono finite
            bene per caso. Corin ascolta senza interromperti, e in tutta la mattina è la prima volta. Alla
            fine annuisce piano. «Allora basta restare lì» dice, e lo ripete a mezza voce per sentire come
            suona. Per un po' cavalca in silenzio, e intanto il fiume vi porta più dentro il bosco di quanto
            ti fossi accort{o|a}. Fra gli abeti compaiono le prime sequoie, con i tronchi rossi così larghi
            che i cavalli ci mettono quattro passi a superarne uno.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: L'odore del fumo
          testo: |
            Cominci a raccontare della razzia e a metà ti accorgi che le mani ti sudano sulle redini e che
            senti di nuovo l'odore del fumo. Ti fermi, e sul cuoio delle redini restano le impronte bagnate
            delle tue dita.

            Corin aspetta, poi prova a riempire il silenzio con una storia sua, un carico di spezie andato a
            male a Laresh, e la racconta fino in fondo anche se nessuno dei due la sta ascoltando. Quando alzi
            gli occhi siete ancora allo stesso gomito del fiume.
          effetti: { tormento: 1 }
          imposta: { foresta.domande: 1 }
      - testo: "Raccontargli la versione da locanda"
        descrizione: "Un orco in più e un po' meno paura. Corin ha voglia di un eroe, e tu puoi dargliene uno."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: La versione da locanda
          testo: |
            Gli racconti la razzia come la racconterebbero al Grifone dopo il terzo boccale, con un orco in
            più e un po' meno paura. A un certo punto ti chiede di ripetere la frase che hai detto all'orco
            prima di colpirlo, e se la ripete a mezza voce per tutto il tragitto per provare dove mettere le
            pause. Le pause le prova a tempo con il passo del cavallo, una ogni quattro zoccoli. Quando trova
            quella giusta è contento come un bambino, e il bosco intanto si è fatto più fitto.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Un orco di troppo
          testo: |
            A metà racconto aggiungi un orco e poi un altro, e Corin aggrotta la fronte. «Strano» dice,
            gentile. «Io quella sera ero lì con il naso nel fango, e me ne ricordavo meno. Ma avevo il naso
            nel fango.» Per tutta la strada non ti contraddice più, e ogni tanto ti guarda di lato con molta
            gentilezza, che è peggio di qualunque contraddizione. Le orecchie ti bruciano fino al gomito
            successivo del fiume, dove l'acqua passa rumorosa su un letto di sassi e ti risparmia di dover
            rispondere.
          effetti: { tormento: 1 }
          imposta: { foresta.domande: 1 }
      - testo: "Parlargli da mercante a mercante"
        descrizione: "Hai anche tu la licenza della Gilda, e sai di cosa si lamenta un mercante quando cavalca."
        requisiti: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Da mercante a mercante
          testo: |
            Gli chiedi dei dazi sul Ponte delle Mille Corde, e a Corin si illumina la faccia. Per mezz'ora
            parlate di pesi e di gabelle e di chi alla Casa dei Nodi firma i permessi senza leggerli. Lui ti
            fa i nomi di due Custodi di Passaggio che accettano regali. «Questo non l'hai sentito da me» dice,
            e poi lo ripete nel caso, guardando un abete con sospetto.

            Intanto il fiume vi ha portati parecchio avanti, e dietro di voi il fumo dei camini della città
            non si vede più sopra gli alberi.
          effetti: { profondita.foresta-strisciante: 1, informazioni.voce: 1 }
      - testo: "Dirgli di Ghoran"
        descrizione: "Della bilancia su cui pesano gli schiavi, e di come ci sei sces{o|a}."
        requisiti: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La bilancia
          testo: |
            Gli racconti di Ghoran, della bilancia nel mercato e di come ti ci hanno fatto salire. Mentre
            parli le mani ti si chiudono sulle redini, e le riapri soltanto quando hai finito. Corin ascolta
            con la bocca socchiusa, e alla fine dice che a Ghoran c'è stato una volta, per un carico di pelli,
            e che il mercato gli era sembrato pittoresco. Poi capisce cosa ha detto e diventa rosso fino al
            colletto. Per il resto della strada sta zitto, e ogni tanto ti passa la borraccia senza che tu
            gliel'abbia chiesta.
          effetti: { profondita.foresta-strisciante: 1 }
      - testo: "Lasciarlo parlare e annuire"
        descrizione: "Corin ha molte cose da dire sulla Gilda, e tu hai due orecchie."
        costo: 2
        esito:
          titolo: I dazi
          testo: |
            Annuisci, e Corin parla. Ti spiega i dazi sul grano e quelli sull'acqua purificata, poi il motivo
            per cui Ottone Malgrani lo odia. Poi viene il motivo per cui lui odia Ottone Malgrani, che è più
            lungo e ha delle note a margine. Il bosco vi scorre intorno senza che tu lo guardi, e di tutto il
            tragitto ti restano il cigolio della sella e l'odore della resina. Quando finalmente si ferma
            siete molto più avanti, e a te ronzano le orecchie come dopo una notte alla Pignatta.
          effetti: { profondita.foresta-strisciante: 1, tormento: 1 }

  - id: foresta-gli-spiumatori
    immagine: ambientazione/gradone-rosso
    titolo: Gli Spiumatori
    sommario: "Ai piedi del Gradone Rosso due orchi accovacciati mangiano qualcosa. Hanno piume incollate nei capelli."
    luogo: Foresta Strisciante, sotto il Gradone Rosso
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante <= 1]
    testo: |
      Dove il bosco tocca la scarpata del Gradone Rosso gli alberi si diradano su una spianata di sassi rossi.
      Sono sassi spigolosi caduti dalla parete, e lassù la roccia mostra ancora le macchie chiare da dove si
      sono staccati. In mezzo due orchi magri con le piume incollate ai capelli mangiano accovacciati degli
      uccelli crudi, e le piume che girano nell'aria sono le loro. Intorno a loro i sassi sono coperti di
      becchi e di ossicini spolpati, abbastanza per molti pasti.

      {origine fuggiasco-di-ghoran} Ai recinti di Ghoran i sorveglianti mangiavano così, e le spalle ti si
      curvano da sole come allora.

      Corin ti tocca il braccio, rosso in faccia. «Orchi!» dice in un sussurro che si sente fino al fiume.
      «Fantastico. Come procediamo?» Uno degli orchi alza la testa e annusa l'aria con un'ala che gli pende
      dalla bocca.

      {natura Facile} Il vento viene dal fiume e va verso di loro, e si porta dietro l'odore vostro e quello
      dei cavalli.
    opzioni:
      - testo: "Attaccarli prima che vi vedano"
        immagine: bestiario/orco
        descrizione: "Sono due orchi magri con la bocca piena."
        combattimento: spiumatori-al-gradone
        vittoria:
          titolo: Piume
          testo: |
            Il primo orco si alza con la bocca ancora piena e non fa in tempo a prendere l'arco. Il secondo
            combatte meglio, e scappa appena il compagno va giù, su per la scarpata a quattro zampe fra i
            sassi. Lo senti salire a lungo, e ogni tanto un sasso rotola giù fino alla spianata. Corin arriva
            quando è tutto finito, con la balestra carica e le mani che tremano, e guarda l'orco a terra con
            la bocca aperta. A te il cuore ci mette un pezzo a scendere dalla gola.
          effetti: { profondita.foresta-strisciante: 1 }
        sconfitta:
          titolo: Su per la scarpata
          testo: |
            Uno dei due ti colpisce con un sasso grosso come un pugno, e il mondo si inclina. Il sangue ti
            scende caldo nell'occhio, e per un po' vedi la spianata da una parte sola. Quando il mondo si
            raddrizza gli orchi sono già a metà della scarpata con gli uccelli sotto il braccio, e Corin ti
            sta tamponando la fronte con un fazzoletto di seta ricamato, le sue iniziali proprio sopra il
            taglio. «Li abbiamo messi in fuga» dice, con molta buona volontà. Vi serve un pezzo per rimettervi
            in sella, e il sole intanto è salito sopra la scarpata.
      - testo: "Aggirarli sotto gli abeti"
        descrizione: "Sottovento, con i cavalli per la briglia. Basta non pestare niente."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Sottovento
          testo: |
            Porti il cavallo per la briglia sotto gli abeti e sottovento, con i piedi sugli aghi e mai sui
            rami. Gli aghi fanno uno strato asciutto alto un palmo, e gli zoccoli ci affondano senza un
            rumore. Corin ti viene dietro in punta di piedi, così concentrato che diventa paonazzo, e devi
            fargli segno di respirare. Gli orchi non alzano la testa dal loro pasto. Quando li hai lasciati
            alle spalle ti accorgi di avere piume grigie attaccate agli stivali, portate fin lì dal vento, e
            Corin ne raccoglie una e se la infila nel taschino.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Il ramo secco
          testo: |
            Il ramo secco lo pesti tu, e nel silenzio sembra uno schiocco di frusta. I due orchi scattano in
            piedi. Uno ti tira un sasso grosso come una prugna che ti prende sullo zigomo, e mentre ti tieni
            la faccia lui torna a sedersi e riprende a mangiare, come se avesse scacciato una mosca. Tornate
            indietro fra gli abeti con Corin che ti guarda lo zigomo e dice che si vede appena. Lo zigomo ti
            pulsa a tempo con il cuore per tutto il tragitto.
          effetti: { ferite: 0.5 }
      - testo: "Avvicinarti con le mani aperte"
        descrizione: "Hanno le piume incollate nei capelli e stanno mangiando. Chi mangia, di solito, ha poca voglia di litigare."
        prova: { attributo: sociale, abilita: [empatia, intimidire], difficolta: Media }
        successo:
          titolo: Mezzo uccello
          testo: |
            Esci allo scoperto piano e ti accovacci a dieci passi da loro, come stanno accovacciati loro, con
            le mani bene in vista e le ginocchia che protestano. L'orco più vecchio ti guarda a lungo
            masticando. Poi grugnisce e ti tende mezzo uccello. La carne è cruda e ancora tiepida, e sotto i
            denti ti scricchiolano gli ossicini.

            Quando indichi il bosco l'orco si porta due dita alla bocca a fare le zanne e sputa per terra, poi
            punta il mento verso ovest.
          effetti: { profondita.foresta-strisciante: 1, informazioni.voce: 1 }
        fallimento:
          titolo: L'osso
          testo: |
            Esci allo scoperto con le mani aperte, e l'orco più grosso si alza con un grugnito che si capisce
            benissimo anche senza traduzione. Fai un passo indietro, e lui te ne fa fare un altro tirandoti un
            osso di uccello ancora sporco, che ti apre il labbro. Poi tutti e due tornano al loro pasto e
            dagli abeti li senti ancora masticare. Ti ritiri succhiandoti il labbro, con il sapore del sangue
            e di qualcos'altro che preferisci non indagare, e Corin ti dice che sei stat{o|a} molto
            coraggios{o|a}.
          effetti: { ferite: 0.5 }
      - testo: "Fare il giro largo lungo il fiume"
        descrizione: "Lontano dal Gradone, nell'acqua bassa. Gli orchi non vi vedranno, e i cavalli si bagneranno fino alla pancia."
        costo: 2
        esito:
          titolo: Nell'acqua bassa
          testo: |
            Scendete al fiume e lo risalite nell'acqua bassa, con i cavalli che affondano fino ai garretti e
            scivolano sui sassi. I sassi del fondo sono coperti di una melma verde che cede sotto gli zoccoli.
            Il tuo a un certo punto si inginocchia, e tu finisci in acqua fino alla cintura. È gelata, e ti
            toglie il fiato. Corin ti offre il suo mantello, poi ci ripensa perché è di velluto, e poi te lo
            dà lo stesso. Quando tornate fra gli alberi gli orchi sono lontani e a te battono i denti.
          effetti: { profondita.foresta-strisciante: 1, ferite: 0.5 }

  - id: foresta-l-impronta
    immagine: ambientazione/foresta-strisciante
    titolo: L'impronta
    sommario: "Nel fango vicino a un ruscello c'è un'impronta di zoccolo larga come una scodella."
    luogo: Foresta Strisciante, vicino a un ruscello
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante == 1]
    testo: |
      Nel fango vicino a un ruscello c'è un'impronta di zoccolo con gli speroni ben marcati. Corin scende da
      cavallo e ci appoggia accanto la mano nel guanto, che è più piccola. Intorno le felci sono schiacciate,
      e su un abete la corteccia è strappata all'altezza del tuo petto e bagnata di grigio. Ti dici che è il
      fango del ruscello, e che la bestia si è rotolata sulla riva prima di grattarsi lì. Il fango della riva
      però è bruno, e il grigio sulla corteccia non cola nemmeno dove il tronco pende.

      {natura Media} I cinghiali si strofinano agli alberi con la spalla, e questa ti arriva al petto. Il
      cinghiale più grosso che hai mai visto la spalla ce l'aveva alla coscia.

      {origine figlio-del-circolo} Senti lo stesso odore di ferro caldo e pelo bruciato della volpe abbattuta
      nel Bosco di Velthar quando eri bambin{o|a}, e la mano che andava verso l'abete torna indietro da sola.

      Corin si pulisce il guanto sui calzoni anche se è pulito. «Grande, eh? Beh, insomma, grande è grande»
      dice, e torna in sella.
    opzioni:
      - testo: "Leggere le tracce"
        descrizione: "Quanto pesa, da quanto è passato, dove va."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Sei quintali
          testo: |
            Ti accovacci accanto all'impronta e la misuri con il palmo. È lunga più di una spanna, il doppio
            di quella di un cinghiale normale, e affonda nel fango quanto basta per dirti che la bestia pesa
            sei quintali o poco più. Il fango sul fondo è ancora lucido e non ha fatto la crosta. Le impronte
            vanno verso il fondo della foresta, una ogni due passi d'uomo. Corin ripete «sei quintali» con un
            fischio basso e poi si guarda la mano, che continua a sembrargli piccola, e se la rimette in
            tasca.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Il grigio sulla corteccia
          testo: |
            Ti avvicini all'abete per guardare la sostanza grigia sulla corteccia e ci passi un dito. È densa
            e fredda, e ha l'odore della cenere bagnata. Il bosco ti gira intorno e devi appoggiarti al
            tronco, con un sapore di ferro in bocca e il dito che continua a sentire freddo anche dopo che te
            lo sei strofinat{o|a} sui calzoni. Ti dici che è la fame, e ci credi finché il freddo non se ne va
            dal dito. Quando ti passa le impronte si sono confuse con quelle dei caprioli, e Corin ti sta
            offrendo la borraccia da un po'.
          effetti: { tormento: 1 }
      - testo: "Guardare dove i cavalli non vogliono andare"
        descrizione: "I cavalli sentono le bestie grosse prima di te."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: Le orecchie dei cavalli
          testo: |
            Lasci le redini lunghe e guardi i cavalli. Tutti e due hanno le orecchie girate verso le due
            sequoie a sud-ovest, e il tuo ha il collo bagnato di sudore anche se avete camminato al passo.
            Quando provi a mandarlo da quella parte punta gli zoccoli e sbuffa. Gli parli piano, con le cose
            senza senso che si dicono ai cavalli, finché non si convince a fare dieci passi e poi altri dieci,
            e oltre le sequoie ritrovi la pista.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Lo scarto
          testo: |
            Spingi il cavallo verso le sequoie per vedere come reagisce, e lui reagisce. Si impenna di colpo,
            e tu finisci di schiena fra le felci con le redini ancora in mano e la bocca piena di foglie.
            Sopra di te le cime degli abeti girano piano, e da qualche parte oltre le sequoie un ramo grosso
            si spezza una volta sola. Corin scende ad aiutarti e ti chiede se fa parte del metodo. Ci vuole un
            bel pezzo perché il cavallo smetta di tremare, e la schiena ti fa male per tutto il giorno.
          effetti: { ferite: 0.5 }
      - testo: "Seguire le felci schiacciate, un passo alla volta"
        descrizione: "La scia è larga, basta non perderla. Ci vorrà tutto il pomeriggio."
        costo: 2
        esito:
          titolo: Il bosco zitto
          testo: |
            Segui la scia di felci schiacciate a piedi, tirandoti dietro il cavallo, e su ogni tronco trovi la
            stessa striscia di grigio all'altezza del petto. Su un abete la misuri con la mano aperta, ed è
            larga due palmi come sul primo. Dopo un'ora ti accorgi che gli uccelli hanno smesso di cantare, e
            non sai da quanto. Anche Corin se ne accorge e si mette a fischiettare per fare rumore, finché non
            gli chiedi di smettere. Vai avanti con le tempie che pulsano.
          effetti: { profondita.foresta-strisciante: 1, tormento: 1 }

  - id: foresta-il-sottobosco
    immagine: ambientazione/foresta-strisciante
    titolo: Il sottobosco
    sommario: "Le tracce entrano in una macchia così fitta che i cavalli si rifiutano di seguirle."
    luogo: Foresta Strisciante, nel sottobosco
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante >= 2, profondita.foresta-strisciante <= 4]
    testo: |
      Le tracce entrano in una macchia di rovi e viticci così fitta che i cavalli puntano gli zoccoli, e li
      legate a un abete. Il cinghiale ci è passato in mezzo come un carro e ha lasciato un corridoio di rami
      spezzati che si è già richiuso a metà. I rovi spezzati hanno il midollo ancora verde e bagnato. Ti dici
      che i rami piegati tornano su da soli. I viticci che chiudono il corridoio però passano sopra le
      spezzature, stesi da un ramo all'altro.

      «Ho letto che i cacciatori veri vanno avanti carponi» dice Corin, e aggiunge che spera fosse un libro
      serio.

      {percezione Media} Lungo il margine della macchia i rovi fanno una gobba regolare, come sopra un
      passaggio di bestie piccole.
    opzioni:
      - testo: "Passare dove è passato lui"
        descrizione: "Il corridoio che ha aperto c'è ancora, almeno in parte."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il corridoio
          testo: |
            Ti infili di traverso nel corridoio di rami spezzati che ha lasciato il cinghiale, e dove si
            richiude passi sotto a quattro zampe. I viticci ti si attaccano alle maniche e li lasci fare,
            perché tirare peggiora tutto. Sono freddi e appiccicosi, e dove li stacchi lasciano sulla stoffa
            una riga umida. Dietro di te Corin avanza carponi come ha letto sul libro, e ogni tanto ti chiede
            se lo sta facendo bene. Sbucate dall'altra parte coperti di foglie, e lui ha l'aria più felice che
            gli hai visto da stamattina.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: I viticci
          testo: |
            A metà strada un viticcio ti si stringe intorno alla caviglia e un altro al collo, e più ti agiti
            più stringono. Il panico ti sale nelle braccia prima che nella testa. Quando finalmente ne esci, a
            ritroso, hai una spina conficcata nella guancia e un graffio lungo il collo che brucia. Sotto il
            graffio la pelle porta il segno di una spirale stretta, e da fuori i viticci pendono fermi fra i
            rovi. Corin ti aspetta all'imbocco con il mantello ripiegato sul braccio, e ti dice che da fuori
            sembrava andare bene.
          effetti: { ferite: 0.5 }
      - testo: "Cercare il passaggio dei caprioli"
        descrizione: "Una macchia così grande ha per forza un sentiero, se sai dove guardare."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il passaggio dei caprioli
          testo: |
            Lungo il margine della macchia trovi quello che cercavi, un tunnel basso fra i rovi con il terreno
            battuto e qualche ciuffo di pelo castano impigliato alle spine. Dentro c'è odore di muschio e di
            bestia, e la terra è fredda sotto le ginocchia. Lo percorri piegato in due, e Corin dietro di te
            batte la testa due volte contro lo stesso ramo e si scusa tutte e due le volte. Sbucate oltre la
            macchia proprio dove riprende la pista del cinghiale.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Tutti uguali
          testo: |
            Giri intorno alla macchia cercando un varco, e dopo un'ora ti accorgi che gli abeti sono tutti
            uguali e che il sole è dalla parte sbagliata. Ti fermi a guardarlo più a lungo del necessario. Fra
            quegli abeti non canta un uccello e non si muove un ramo. Corin ti segue senza fare domande, e tu
            non hai il coraggio di dirgli che vi siete persi. Ritrovi il punto da cui eri partit{o|a} grazie a
            un fazzoletto di seta che lui aveva legato a un ramo per segnarlo, senza dirtelo.
          effetti: { tormento: 1 }
      - testo: "Aprirti la strada con la lama"
        descrizione: "Ci vuole tempo e ci vogliono braccia. Alla fine avrai le mani a pezzi."
        costo: 2
        esito:
          titolo: A colpi di lama
          testo: |
            Tagli rovi e viticci un colpo alla volta per un'ora buona, e la macchia si apre davanti a te con
            la lentezza di un pagamento della Gilda. I viticci tagliati perdono una linfa bianca e densa che
            ti incolla le dita all'elsa. Corin raccoglie i rami tagliati e li ammucchia in ordine ai lati,
            perché non gli viene in mente niente di più utile da fare, e ogni tanto li raddrizza. Quando
            passate dall'altra parte hai i palmi pieni di vesciche e le braccia che non si alzano più sopra le
            spalle.
          effetti: { profondita.foresta-strisciante: 1, ferite: 0.5 }

  - id: foresta-la-fossa
    immagine: ambientazione/foresta-strisciante
    titolo: La fossa di cattura
    sommario: "Dove il sottobosco si dirada, un mucchio di rametti è disposto un po' troppo in ordine."
    luogo: Foresta Strisciante, in una radura di felci
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante >= 2, profondita.foresta-strisciante <= 3, foresta.fossa == 0]
    testo: |
      Il sottobosco si dirada in una radura di felci basse, e sugli aghi le tracce si fanno difficili da
      seguire. Corin cammina davanti a te con la balestra tenuta come un ombrello chiuso e ti racconta delle
      lumache nel miele di una locanda di Laresh.

      Fra due abeti c'è un mucchio di rametti coperto di foglie troppo in ordine per un bosco. Le foglie sono
      larghe e di quercia, e qui intorno crescono soltanto abeti e felci. I rametti in cima al mucchio hanno
      il taglio netto di una lama.

      {percezione Media} Sotto il mucchio la terra è smossa da poco, e gli abeti ai lati sono troppo vicini
      perché una bestia grossa passi altrove.
    opzioni:
      - testo: "Guardare dove metti i piedi"
        descrizione: "Quelle foglie le ha messe lì qualcuno."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La rete di rami
          testo: |
            Ti fermi, e afferri Corin per il colletto un passo prima dei rametti. Sotto le foglie i tronchetti
            sono intrecciati a rete, e sotto la rete c'è il buio di una fossa da cacciatori profonda quattro
            metri, con i pali appuntiti sul fondo. Le pareti sono tagliate dritte, con i segni regolari di una
            vanga. Corin guarda giù e diventa bianco. Ti ringrazia due volte, e la seconda volta ti stringe la
            mano con la sua, che è sudata dentro il guanto. Su uno dei pali qualcuno ha inciso le lettere D e
            S, ormai annerite dall'umido.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Il terreno che cede
          testo: |
            Tieni gli occhi sulla pista, e quando appoggi il peso sul mucchio di rametti senti il terreno che
            se ne va. I rami si aprono sotto di te come una botola, e dal buio sale un odore di terra bagnata
            e di legno marcio. Senti i primi rametti battere sul fondo prima di te. Le braccia si allargano da
            sole, in cerca di qualcosa a cui attaccarsi, e l'ultima cosa che vedi è la faccia di Corin che si
            allontana.
          imposta: { foresta.fossa: 1 }
          segue: foresta-la-fossa-caduta
      - testo: "Tenere Corin per la cintura e tastare il terreno con un ramo"
        descrizione: "Lento e faticoso. Corin non sta mai dietro a nessuno per molto."
        costo: 2
        esito:
          titolo: La cintura di Corin
          testo: |
            Procedi a tastoni con un ramo lungo, tenendo Corin per la cintura perché non ti passi davanti, e
            lui ti passa davanti lo stesso, con una specie di talento. Il terreno gli cede sotto un piede, e
            tu lo tiri indietro mentre i rami spariscono nel buio di una fossa da cacciatori. Dopo un momento
            li senti battere sui pali del fondo. La spalla ti scricchiola. Corin si siede per terra a guardare
            la fossa. Poi ti ringrazia tre volte, e ogni volta un po' più piano.
          effetti: { profondita.foresta-strisciante: 1, ferite: 0.5 }

  - id: foresta-la-fossa-caduta
    immagine: ambientazione/foresta-strisciante
    titolo: Nella fossa
    tipo: seguito
    luogo: Foresta Strisciante, dentro la fossa di cattura
    area: foresta-strisciante
    requisiti: [pista.corin == 2]
    testo: |
      Cadi. La fossa è profonda due volte la tua altezza e sul fondo aspettano i pali appuntiti di un vecchio
      cacciatore, neri di muffa. Le pareti sono di terra nera e umida, e ne spuntano radici bianche e sottili
      che non reggerebbero un gatto. A un braccio dalla tua mano sporge dalla parete una radice d'abete,
      grossa come un polso e scura di terra. Da sopra Corin grida il tuo nome e poi, a corto di idee, anche il
      suo.

      {acrobazia Facile} La radice è a portata se il braccio parte adesso, e fra un momento sarà sopra di te.
    opzioni:
      - testo: "Afferrare la radice"
        descrizione: "È lì. Bisogna prenderla al primo colpo."
        costo: 0
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La radice
          testo: |
            Le dita si chiudono sulla radice e la spalla ti dà uno strappo che senti fino ai denti, ma tieni.
            Resti appes{o|a} sopra i pali, con la terra che ti piove negli occhi, finché Corin non si sdraia
            sull'orlo e ti allunga la cinghia della balestra. Sotto di te le punte dei pali sono annerite e
            lisce, e su una è rimasto impigliato un ciuffo di pelo. Corin ti tira su con più coraggio che
            braccia, gemendo per lo sforzo come una porta. Restate seduti per terra tutti e due senza parlare,
            e intanto la pista si è raffreddata.
        fallimento:
          titolo: In fondo alla fossa
          testo: |
            La radice ti scivola fra le dita e finisci in fondo alla fossa, fra i pali. Uno ti apre la coscia
            di striscio, un altro si spezza sotto il tuo peso, marcio, ed è per questo che sei ancora
            inter{o|a}. Dentro il palo spezzato il legno è molle e spugnoso fino al centro. Corin ti cala il
            mantello di velluto annodato alla cinghia della balestra, e ci metti un bel pezzo a risalire.
            Fuori ti fasci la gamba con una striscia di seta ricamata che lui ti porge senza dire niente.
          effetti: { ferite: 1 }
      - testo: "Lasciarti scivolare lungo la parete"
        descrizione: "Più lento, e meno pericoloso. Ti scorticherai le mani."
        costo: 0
        esito:
          titolo: Lungo la parete
          testo: |
            Ti giri verso la parete e ti lasci scivolare a pancia in giù con le mani e le ginocchia piantate
            nella terra. Arrivi in fondo con i palmi scorticati e i piedi fra due pali, a un dito dalle punte,
            e per un momento non osi spostare il peso. Da così vicino vedi che le punte sono state riaffilate
            più di una volta. Corin ti cala il mantello annodato alla cinghia della balestra, e risalire ti
            prende quasi un'ora, durante la quale lui ti chiede scusa di continuo per una fossa che ha scavato
            qualcun altro.
          effetti: { ferite: 0.5 }
      - testo: "Piantare la lama nella parete, come sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice chi scivola non aspetta che la mano trovi un appiglio."
        quando: [origine.apprendista-raschiatore >= 1]
        costo: 0
        esito:
          titolo: "Appes{o|a} alla lama"
          testo: |
            Pianti la lama nella parete di terra fino all'elsa e ci resti appes{o|a}, con la spalla che
            protesta e i piedi a una spanna dalle punte dei pali. Da lì la radice è a portata, e risali una
            presa alla volta finché Corin non ti afferra per il colletto e ti tira fuori, gemendo per lo
            sforzo. Ti siedi sull'orlo a pulire la lama dalla terra, e sul filo restano attaccate radici
            bianche e sottili. Intanto la pista si è raffreddata.

  - id: foresta-la-parete
    immagine: ambientazione/foresta-strisciante
    titolo: La parete di roccia
    sommario: "Le tracce fanno il giro di una parete di roccia alta tre uomini. In cima la pista è fresca."
    luogo: Foresta Strisciante, sotto la parete
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante >= 2, profondita.foresta-strisciante <= 4]
    testo: |
      Il bosco finisce contro una parete di roccia rossastra e bagnata, che scende dal Gradone Rosso come una
      costola. È una pietra tenera che si sbriciola sotto l'unghia, e l'acqua le scende addosso in rivoli
      sottili dal bordo del Gradone. Le tracce del cinghiale fanno il giro largo verso il fiume, e in cima
      vedi le felci schiacciate dal suo passaggio.

      {atletica Media} Dove l'acqua scava ci sono appigli, e a metà parete c'è una crepa per una mano intera.
      Il resto lo fanno le gambe, se non ci pensi troppo.

      Corin guarda in su finché il cappello non gli cade, e mentre lo raccoglie dice in fretta che i cavalli
      li porta lui dal giro lungo. «Qualcuno deve pure pensare ai cavalli, e io vi aspetto lassù.»
    opzioni:
      - testo: "Arrampicarti"
        descrizione: "La pietra è bagnata, ma dove l'acqua scava ci sono gli appigli."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: In cima
          testo: |
            Cerchi gli appigli dove l'acqua ha scavato la pietra e sali piano, tenendo il peso sulle gambe. A
            metà parete un sasso ti si stacca sotto la mano e lo senti rimbalzare fino in fondo, e resti
            appes{o|a} a tre dita finché l'altra mano non trova una crepa. In cima le impronte sono così
            fresche che il fango sta ancora riempiendo i bordi. Sono più profonde in punta che sul tallone, e
            lì la bestia correva. Molto più tardi arriva Corin con i cavalli, fiero di sé come se la parete
            l'avesse scalata lui.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Due metri
          testo: |
            Sali due metri, poi il piede ti scivola sulla pietra bagnata e torni giù molto più in fretta di
            quanto eri salit{o|a}. Atterri sul fianco con i palmi scorticati e un ginocchio che si gonfia a
            vista d'occhio. L'appiglio che ha ceduto è ancora lassù, coperto di un velo d'alga verde che da
            sotto non si vedeva. Quando Corin torna indietro a vedere perché non arrivi ti trova sedut{o|a}
            sotto la parete, a toglierti la sabbia rossa dai graffi con la punta del coltello, e fa finta di
            non aver visto niente con una discrezione molto rumorosa.
          effetti: { ferite: 0.5 }
      - testo: "Cercare la cengia dei caprioli"
        descrizione: "Se ci passano loro, ci passi anche tu. Bisogna trovarla."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La cengia
          testo: |
            Studi la parete finché non vedi una cengia che sale a zigzag, larga un piede, segnata dagli
            escrementi dei caprioli. Gli escrementi sono secchi e vecchi, e lungo tutta la cengia non ne trovi
            uno fresco. Dove passavano loro passi anche tu, con la pancia contro la roccia e il naso in quello
            che hanno lasciato, e arrivi in cima senza un graffio. Le impronte del cinghiale sono ancora
            umide. Corin arriva con i cavalli un'ora dopo e ti chiede come hai fatto, con l'aria di volerlo
            scrivere.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: La cengia che finisce
          testo: |
            Segui una cengia che sale bene per metà parete e poi finisce contro la roccia liscia, come una
            frase lasciata a metà. Torni giù all'indietro un piede alla volta, con le gambe che tremano e la
            pietra che ti scivola sotto le dita. Da lontano senti Corin che chiama il tuo nome oltre la parete
            per sapere a che punto sei, e la roccia te lo rimanda due volte. In fondo ti siedi e aspetti che
            il cuore rallenti, e intanto la luce sulla parete ha cambiato colore.
          effetti: { tormento: 1 }
      - testo: "Andare con Corin per il giro lungo"
        descrizione: "Corin sarà contento di avere compagnia. Il giro è lungo, e lui fischietta."
        costo: 2
        esito:
          titolo: Il giro lungo
          testo: |
            Prendi le briglie del tuo cavallo e segui Corin lungo la base della parete verso il fiume, dove la
            roccia si abbassa. Il giro dura più di un'ora, e dalla pietra bagnata sale un fresco che sa di
            muschio. Corin fischietta tutto il tempo una canzone del Grifone e sbaglia sempre la stessa nota.
            A metà strada ti accorgi che la aspetti e che ti dispiacerebbe se la azzeccasse. Arrivate in cima
            dal lato opposto quando le ombre si sono già allungate, e le impronte del cinghiale sono ancora
            lì.
          effetti: { profondita.foresta-strisciante: 1, tormento: 1 }

  - id: foresta-le-carcasse
    immagine: bestiario/verme-carogna
    titolo: Le carcasse
    sommario: "In una conca fra le radici ci sono carcasse di caprioli, e fra le carcasse qualcosa si muove."
    luogo: Foresta Strisciante, in una conca fra le sequoie
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante >= 2, profondita.foresta-strisciante <= 4]
    testo: |
      In una conca fra le radici di due sequoie ci sono tre caprioli sventrati e lasciati lì senza un morso. I
      ventri sono aperti per il lungo, e intorno alle ferite la carne non ha il segno di un dente. L'odore
      dolciastro della carne marcia ti si attacca in gola, e il ronzio delle mosche sembra venire dalla terra.
      Sulle carcasse però non se ne posa nessuna. Corin si copre il naso con un fazzoletto di seta e diventa
      verde come il fazzoletto.

      {natura Media} Una bestia che ammazza e non mangia difende qualcosa oppure è malata. Il grigio sugli
      alberi fa pensare che le due cose vadano insieme.

      Fra le carcasse qualcosa di pallido e bagnato si gonfia e si sgonfia piano, come la pancia di un cane
      che dorme. Ti dici che è il gas di una carcassa scaldata dal sole, e qui sotto le sequoie il sole non
      arriva.
    opzioni:
      - testo: "Affrontarli"
        immagine: bestiario/verme-carogna
        descrizione: "Sono due, lunghi quanto un uomo. Dove toccano, i muscoli si irrigidiscono."
        combattimento: vermi-carogna
        vittoria:
          titolo: I vermi carogna
          testo: |
            Il primo verme si alza dalle carcasse con la corona di tentacoli aperta, e il secondo esce da
            sotto una radice proprio dove avevi messo il piede. Uno ti sfiora il polso e la mano ti diventa di
            legno per un lungo momento, e la guardi come se appartenesse a un altro. Quando smettono di
            muoversi si sgonfiano piano, e dai tagli esce soltanto un liquido chiaro. Corin è ancora lì con la
            balestra puntata, e il suo unico dardo è piantato nella corteccia di una sequoia, a un palmo dalla
            tua testa.
          effetti: { profondita.foresta-strisciante: 1 }
        sconfitta:
          titolo: Per il colletto
          testo: |
            Un tentacolo ti si avvolge al polpaccio e la gamba diventa rigida come un ramo. Cadi fra le
            carcasse, con la faccia nell'odore dolce. Senti la bocca rotonda del verme che ti cerca il fianco,
            fredda attraverso la camicia. Poi arriva uno strattone, con un rumore di stoffa strappata, e Corin
            ti trascina via per il colletto tirando con tutte e due le mani. Ti lascia solo quando siete al
            fiume. La gamba torna tua dopo un'ora, e il fetore delle carcasse ti resta nei vestiti.
      - testo: "Guardare bene prima di avvicinarti"
        descrizione: "Quella cosa che respira fra i caprioli non è un capriolo."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Sopravvento
          testo: |
            Ti fermi a dieci passi e guardi. Quello che si gonfia fra le carcasse è un verme pallido lungo
            quanto un uomo, arrotolato su se stesso, e un secondo è steso sotto la radice con la corona di
            tentacoli aperta, ad assaggiare l'aria. Sotto la pelle gli corrono venature dello stesso grigio
            delle cortecce. La pelle ti si accappona dalla nuca ai polsi. Prendi Corin per la manica e fate il
            giro largo, sopravento, tenendo i cavalli corti. I vermi restano dove sono. Ritrovate le tracce
            dall'altra parte della conca.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Il tentacolo
          testo: |
            Ti avvicini alla carcassa più vicina per guardare meglio, e la carcassa si muove. Un verme pallido
            esce dal ventre del capriolo e ti sfiora la caviglia con la corona di tentacoli, e la gamba ti
            diventa di legno dal ginocchio in giù. Corin ti trascina indietro per le ascelle e grida per tutti
            e due, mentre il verme torna dentro il capriolo con la calma di uno che rientra in casa. Sulla
            caviglia ti resta un anello di puntini rossi, e la gamba ti formicola per un'ora buona.
          effetti: { ferite: 0.5 }
      - testo: "Lasciare a loro le carcasse e passare dal greto"
        descrizione: "Il greto del fiume è lontano dalle carcasse, e lungo. Il rumore lo sentirai lo stesso."
        costo: 2
        esito:
          titolo: Il greto
          testo: |
            Scendi al greto con Corin e i cavalli e lo segui a lungo, sui sassi bagnati, finché la conca non è
            lontana. Il rumore però vi accompagna. È un risucchio regolare che viene dalle carcasse e si sente
            anche sopra lo scroscio del fiume, e a un certo punto Corin si tappa le orecchie con le dita e
            canticchia. I cavalli tengono le orecchie girate all'indietro per tutto il greto. Quando risalite
            nel bosco sputi due volte, e il sapore dolciastro resta in gola lo stesso.
          effetti: { profondita.foresta-strisciante: 1, tormento: 1 }

  # ------------------------------------------------------------ la carta della spedizione
  - id: foresta-la-farfalla
    immagine: ambientazione/foresta-strisciante
    titolo: La farfalla foglia-rossa
    sommario: "Corin ha visto una farfalla foglia-rossa e ha deciso di portarla a Liaren."
    luogo: Foresta Strisciante, fra le felci
    area: foresta-strisciante
    tipo: carta
    # Corin vuole portarla a Liaren: non mentre Liaren è sparita o a letto (Acciaio e Ira 1–5).
    requisiti: [pista.corin == 2, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      Una farfalla foglia-rossa si posa sull'orecchio del tuo cavallo e riparte subito. Ha le ali dentellate
      sul bordo e venate di scuro come una foglia d'acero in autunno, e quando le chiude sparisce contro le
      felci. È una di quelle che Padre Vantes ha liberato a mezzogiorno del Festival, e deve aver seguito il
      fiume. Il cavallo scuote l'orecchio una volta sola e torna a strappare l'erba. Corin la insegue fra le
      felci con il cappello in mano, e ogni volta che la manca le chiede scusa.

      {origine accolito-del-velo} A mezzogiorno del Festival il drappo cremisi l'hai sollevato tu insieme a
      Padre Vantes, e ti senti sciocc{o|a} a chiederti se questa era fra quelle.

      «La porto a Liaren!» ti grida. «Le farfalle le piaceranno. Credo. Beh, insomma, è rossa.» Inciampa in
      una radice e si rialza con gli aghi fra i capelli.
    opzioni:
      - testo: "Aiutarlo a prenderla"
        descrizione: "Con il cappello, piano, mentre è posata."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Facile }
        successo:
          titolo: Nel cappello
          testo: |
            La farfalla si posa su una felce e tu le cali sopra il cappello di Corin piano, prima che riparta,
            con la punta della lingua fra i denti. Corin la trasferisce in una tabacchiera d'argento vuota,
            dopo averci fatto due buchi nel coperchio con la punta del pugnale. L'argento è inciso a viticci e
            si è consumato lucido dove il pollice lo apre, e lui lo tiene in mano per il resto della strada
            come se fosse un uovo. Ridi, e ti accorgi che non ridevi da giorni. Lui ride con te senza sapere
            bene perché.
          effetti: { tormento: -0.5 }
        fallimento:
          titolo: Nelle felci
          testo: |
            Ti tuffi sulla farfalla e atterri a pancia in giù in un cespuglio di felci bagnate, che ti
            accolgono con un rumore di schiaffo e ti riempiono il colletto d'acqua fredda. La farfalla va a
            posarsi sul naso di Corin, che resta immobile con gli occhi storti a guardarla finché non riparte
            da sola verso il fiume. «La lasciamo andare» dice, come se l'avesse deciso lui. Ti aiuta a
            rialzarti e ti toglie dalla spalla una lumaca lunga un dito, che lascia sulla stoffa una striscia
            lucida.
      - testo: "Lasciarlo fare e guardarti intorno"
        descrizione: "Corin si divertirà anche da solo."
        esito:
          titolo: Le tacche sull'abete
          testo: |
            Su un abete, all'altezza degli occhi, ci sono delle tacche vecchie in colonna. La resina le ha
            riempite e si è indurita, e sui bordi la corteccia è cresciuta gonfia fino a richiuderle a metà,
            perché le ha fatte qualcuno tanti anni fa. Sopra la colonna qualcuno ha inciso le lettere D e S.
            Conti le tacche, e sono quarantuno.

            Corin torna senza la farfalla, e quando vede le lettere si illumina. «Dolovan Stroud! Mi ha detto
            che da ragazzo cacciava qui. Quarantuno cinghiali, allora» dice, e poi ci pensa. «O quarantuno
            orchi. Con il signor Stroud non si sa mai.»
          effetti: { informazioni.voce: 1 }
      - testo: "Chiamarla come al Circolo si chiamano le bestie"
        descrizione: "Nel Bosco di Velthar le foglia-rossa si raccontano ai bambini, e ai bambini il Circolo insegna anche la lingua per parlare alle bestie."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Sul dorso della mano
          testo: |
            Ti accucci fra le felci e chiami la farfalla a fior di labbra, con le parole che il Circolo
            insegna ai bambini. Lei gira due volte sopra il cappello di Corin, poi scende a posarsi sul dorso
            della tua mano. È così leggera che senti le zampe solo quando si aggrappano ai peli del polso.
            Corin ci cala sopra una tabacchiera d'argento vuota, dopo averci fatto due buchi con la punta del
            pugnale, e da quel momento la tiene in mano come un uovo.
          effetti: { tormento: -0.5 }

  # ------------------------------------------------------------ il cuore · 2 → 3
  - id: il-cinghiale-mutato
    immagine: bestiario/cinghiale-crudele-mutato
    titolo: Il cinghiale mutato
    sommario: "In fondo alla foresta c'è una radura piena di carcasse, e in mezzo alle carcasse c'è il cinghiale."
    luogo: Foresta Strisciante, la radura interna
    area: foresta-strisciante
    requisiti: [pista.corin == 2, profondita.foresta-strisciante >= 5]
    testo: |
      Le tracce ti portano in una radura dove la luce scende dritta fra le sequoie. La terra è rivoltata a
      solchi larghi un palmo, e intorno i tronchi sono scortecciati fino all'altezza di un uomo. Vicino a un
      tronco caduto giace un puma dal manto color brace, con la pelliccia che fuma ancora. L'erba sotto di lui
      non è bruciata e dal fumo non viene odore di pelo strinato, e ti dici che è il calore del corpo
      nell'aria umida del bosco.

      Al centro della radura c'è il cinghiale, grande come un carro, una montagna di setole grigie e di
      protuberanze d'osso. Le protuberanze gli escono dalla schiena in file storte. Sotto la pelle gli pulsano
      vene d'argento, e dalle ferite del puma il sangue cola grigio come cenere bagnata. Le mosche girano
      sopra il puma e non ci si posano. *Questa è opera della Marea Grigia, e ce l'hai a trenta passi.* Gli
      occhi piccoli e rossi si girano verso di voi.

      {origine fuggiasco-di-ghoran} A Ghoran i sorveglianti avevano una parola per la Marea Grigia e la
      dicevano a voce bassa. Adesso ti torna in bocca, e anche tu la diresti piano.

      {natura Difficile} Dietro la spalla le setole si diradano e la pelle si fa chiara. È lì che la Marea
      l'ha toccato, e lì la carne è più tenera.

      Corin non prende la balestra. Slega dalla sella un fagotto di velluto e ne tira fuori un tubo di metallo
      scuro con una camera di cristallo e un'impugnatura storta, fatta per un'altra mano. Il metallo non ha
      viti né giunture e non ha un punto di ruggine. «Un'arma dei Precursori. L'ho pagata quanto una casa a un
      Raschiatore» sussurra. «Quando prende non resta niente. Il guaio è che ci mette tanto a caricarsi, e io
      non prendo mai.» Il cristallo comincia a ronzare piano.

      {origine allievo-di-torvessa} Il ronzio ti arriva nei denti come quello dei sei cristalli sul banco
      dell'Accademia il giorno del Festival.
    opzioni:
      - testo: "Affrontarlo"
        immagine: bestiario/cinghiale-crudele-mutato
        descrizione: "È grande come un carro ed è furioso. Corin intanto prova a caricare la sua arma, e tu devi restare vivo abbastanza a lungo."
        combattimento: cinghiale-della-foresta
        vittoria:
          titolo: La montagna che cade
          testo: |
            Il cinghiale carica spezzando un abete giovane come un fuscello, e tu ti butti di lato all'ultimo
            e senti il vento della bestia passarti sulla schiena. Lo colpisci due volte dietro la spalla, dove
            il pelo è più rado, finché le gambe non gli cedono e va giù di fianco con un tonfo che ti arriva
            nei denti. Il sangue che ti è schizzato sulle mani è grigio e freddo, anche se la bestia è appena
            morta. Il cristallo dell'arma di Corin finisce di caricarsi proprio adesso, e lui la abbassa con
            cura. Poi si avvicina a piccoli passi e tocca la zanna con la punta dello stivale, e ride forte
            per troppo tempo con le mani che tremano.
          effetti: { pista.corin: 1, racconto: 1 }
          segue: foresta-il-puma-nero
        sconfitta:
          titolo: Il tubo di Corin
          testo: |
            La carica ti prende di striscio e ti manda a sbattere contro una sequoia, e il mondo per un po' è
            fatto solo di corteccia. Poi la radura diventa bianca. Un filo di luce passa sopra la tua testa
            con un rumore di tela strappata e apre alla bestia un buco nel fianco grande come un pugno. I
            bordi del buco sono cotti e neri, e non ne esce sangue. Il cinghiale fa tre passi e cade. A dieci
            passi Corin è seduto per terra, sbalzato dal colpo, con il tubo che fuma fra le gambe.
          effetti: { pista.corin: 1 }
          segue: foresta-il-puma-nero
      - testo: "Attirarlo nella fossa di cattura"
        descrizione: "I cacciatori della Foresta scavano fosse coperte di rami, e una deve essercene anche qui intorno."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: La fossa
          testo: |
            La trovi a cento passi, fra due abeti, sotto un mucchio di rami troppo in ordine. I rami sono
            tagliati netti con l'accetta e gli aghi sopra sono secchi da settimane, mentre intorno il
            sottobosco è verde. Ti fai vedere e poi scappi da quella parte, tenendo la fossa fra te e lui e
            girando largo intorno ai rami per non lasciargli la tua traccia sopra. Il cinghiale carica dritto,
            e i rami cedono sotto il suo peso con uno schianto. Corin si affaccia sull'orlo, punta il tubo
            verso il basso con tutte e due le mani e aspetta che il cristallo smetta di ronzare. Il lampo
            illumina i pali sul fondo della fossa, e poi c'è solo silenzio.
          effetti: { pista.corin: 1, racconto: 1 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: Troppo vicino
          testo: |
            Il cinghiale ti taglia la strada fra gli abeti e ti prende con il fianco, e voli fra le felci con
            la coscia aperta da una zanna. La zanna entra fredda, e il bruciore arriva solo dopo. Mentre
            cerchi di rialzarti la bestia si gira per finirti, e una zampa posteriore le scivola sui rami
            della fossa. Ci cade dentro per metà, e senti i pali del fondo spezzarsi sotto il suo peso. Corin
            le correva dietro urlando, e tira dall'orlo a tre passi di distanza. La bestia non esce più dalla
            fossa, e tu ci metti molto a rialzarti.
          effetti: { pista.corin: 1, ferite: 2.5 }
          segue: foresta-il-puma-nero
      - testo: "Aspettare la carica contro una sequoia"
        descrizione: "Mettersi davanti al tronco più grosso e spostarsi all'ultimo. Se le zanne restano nel legno, Corin ha finalmente un bersaglio che non si muove."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Le zanne nel legno
          testo: |
            Ti metti con la schiena contro la sequoia più grossa e aspetti con il cuore in gola, mentre la
            bestia raspa la terra. La corteccia è morbida e fibrosa e cede sotto le scapole, e ti dici che le
            zanne ci entreranno.

            Quando carica ti butti di lato all'ultimo momento, e le zanne entrano nel legno fino alla radice
            con uno schianto che fa piovere aghi su tutta la radura. «Fermo, fermo» dice Corin alla bestia,
            come a un cavallo, e le arriva a cinque passi con il tubo alzato. Il lampo la prende alla base del
            collo. Corin si ritrova seduto nell'erba, e per un po' sente solo un fischio.
          effetti: { pista.corin: 1, racconto: 1 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: La zanna
          testo: |
            Ti butti di lato troppo presto, e il cinghiale corregge la carica come se l'avesse previsto. La
            zanna ti prende al fianco e ti solleva da terra, e la sequoia la incontri tu, con la schiena.
            Mentre sei a terra la bestia si gira per finirti e incastra una zanna in una radice. La radice è
            spessa quanto la tua coscia, e la senti scricchiolare mentre la bestia strattona. Corin le arriva
            da dietro a occhi chiusi e tira a bruciapelo, e il lampo passa così vicino a te che ti brucia la
            manica.
          effetti: { pista.corin: 1, ferite: 3 }
          segue: foresta-il-puma-nero
      - testo: "Prendere tu l'arma dei Precursori"
        descrizione: "Bisogna capire da che parte esce il colpo, quanto dura la carica e come si tiene un'impugnatura fatta per un'altra mano."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: Il lampo
          testo: |
            Corin ti passa il tubo senza discutere, sollevato. L'impugnatura storta ti costringe a tenere il
            polso piegato, e il metallo resta freddo anche dove lo stringi.

            Il cristallo ronza sempre più acuto mentre il cinghiale raspa e abbassa la testa, e capisci che il
            colpo parte quando il ronzio si ferma. La bestia carica. Il ronzio si ferma a venti passi, e il
            filo di luce le entra nel petto. La carica finisce da sola ai tuoi piedi, e il contraccolpo ti ha
            messo a sedere nel fango.
          pe: { tecnologia: 8 }
          effetti: { pista.corin: 1, racconto: 1, ferite: 0.5 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: Il ronzio
          testo: |
            Tieni il tubo come una balestra e aspetti il colpo che non parte, mentre la bestia ti viene
            addosso e il dito continua a premere su un grilletto che non esiste. Il lampo parte verso il cielo
            e ti brucia le sopracciglia. Spacca il ramo più alto di una sequoia, e nel punto della frattura il
            legno è nero e fuma. Il ramo cade sulla schiena del cinghiale e lo inchioda a terra quel tanto che
            basta a Corin per riprendersi il tubo e aspettare la seconda carica con le mani che tremano.
          effetti: { pista.corin: 1, ferite: 2.5 }
          segue: foresta-il-puma-nero
      - testo: "Tenerlo lontano da Corin finché l'arma non è carica"
        descrizione: "Un ramo di resina acceso, le grida, il tuo corpo in mezzo. Corin ha bisogno di tempo, e il tempo glielo dai tu."
        costo: 2
        esito:
          titolo: Il tempo di una carica
          testo: |
            Accendi un ramo di resina e ti metti fra la bestia e Corin, gridando cose che non hanno senso e
            non devono averne. La resina sfrigola e ti cola accesa sul polso. Il fuoco la ferma una volta, e
            le setole del muso le si arricciano e fumano. La seconda volta il cinghiale ti passa sopra, e
            senti qualcosa nel petto che si sposta. La terza volta ti prende con il muso e ti lancia contro un
            tronco, e mentre ti rialzi il cristallo smette di ronzare. Il lampo apre il fianco alla bestia, e
            lei crolla a quattro passi da te.
          effetti: { pista.corin: 1, ferite: 3, tormento: 1 }
          segue: foresta-il-puma-nero
      - testo: "Farti dare l'arma, da Raschiatore"
        descrizione: "Corin l'ha comprata da uno dei tuoi, e sulle piattaforme hai visto smontare cose simili."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: La tacca d'ottone
          testo: |
            Sul bordo della camera di cristallo c'è una tacca d'ottone, e sulle piattaforme hai visto un
            vecchio Raschiatore spiegare a una recluta che il colpo parte un attimo dopo che la tacca smette
            di vibrare. L'ottone è l'unica parte del tubo che ha preso il verde, e intorno ha i segni di una
            lima. Pianti il calcio contro una radice per reggere il contraccolpo e aspetti con il pollice
            sulla tacca, mentre il cinghiale raspa.

            Quando carica, la tacca si ferma. Il filo di luce gli entra nel petto a venti passi, e la bestia
            finisce la corsa da sola nel fango, a un braccio dai tuoi stivali.
          pe: { tecnologia: 8 }
          effetti: { pista.corin: 1, racconto: 1 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: La tacca che vibra
          testo: |
            La tacca vibra ancora quando il cinghiale è già a dieci passi, e tu aspetti un momento di troppo,
            perché il vecchio Raschiatore diceva un attimo dopo e tu ne conti due. Il lampo parte mentre ti
            butti di lato e gli apre una spalla senza fermarlo. La zanna ti prende alla coscia e ti fa
            rotolare fra le felci.

            Corin raccoglie il tubo dove l'hai lasciato cadere e aspetta la seconda carica con le mani che
            tremano, e questa volta la tacca la guarda anche lui. La bestia cade a quattro passi da voi. Sotto
            il pollice di Corin la tacca d'ottone continua a vibrare a lungo dopo il colpo.
          effetti: { pista.corin: 1, ferite: 2 }
          segue: foresta-il-puma-nero
      - testo: "Contare il Mana nel cristallo, da alliev{o|a} di Torvessa"
        descrizione: "La camera di cristallo ronza come i cristalli dell'Accademia quando si caricano."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [magia, accademiche], difficolta: Difficile }
        successo:
          titolo: L'ultima ondata
          testo: |
            Ti fai dare il tubo e appoggi due dita sulla camera di cristallo, come facevi sul banco
            dell'Accademia. Il Mana ci sale dentro a ondate, e le senti nei polpastrelli, ognuna un poco più
            alta della precedente. I cristalli dell'Accademia si caricavano a ondate larghe e lente, e queste
            sono fitte e corte in un cristallo che non è più grosso di un pugno. Le conti mentre il cinghiale
            raspa la terra, e quando la bestia abbassa la testa ne manca una sola.

            Il filo di luce le entra nel petto a venti passi, e la carica finisce da sola nel fango, davanti
            ai tuoi stivali.
          pe: { magia: 8 }
          effetti: { pista.corin: 1, racconto: 1, ferite: 0.5 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: Il conto a metà
          testo: |
            Appoggi le dita sulla camera di cristallo e conti le ondate di Mana, ma il cinghiale carica prima
            che tu arrivi in fondo al conto. Le ondate arrivano più fitte di quelle che conoscevi, e a metà ti
            accorgi di averne saltata una. Il colpo parte mentre ti butti di lato e gli brucia la spalla senza
            fermarlo, e una zanna ti apre la coscia fino al ginocchio. Corin ti strappa il tubo dalle mani e
            aspetta la seconda carica con gli occhi sbarrati. La bestia cade a cinque passi da voi, e tu resti
            a lungo fra le felci, con il sangue che ti scalda la gamba.
          effetti: { pista.corin: 1, ferite: 2.5 }
          segue: foresta-il-puma-nero
      - testo: "Piantarti davanti alla sequoia e non scappare"
        descrizione: "Da Ghoran sei già scappat{o|a} una volta, e ti è bastato. Il cinghiale carica dritto su chi resta fermo, e una sequoia non si sposta."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza, intimidire], difficolta: Difficile }
        successo:
          titolo: "Ferm{o|a}"
          testo: |
            Ti pianti a gambe larghe con la schiena contro la sequoia più grossa e gridi alla bestia con la
            voce dei sorveglianti di Ghoran, quella che ti piegava le spalle. Resti ferm{o|a} finché senti il
            suo fiato sulla faccia, che sa di ferro bagnato. Poi ti lasci cadere di lato, e le zanne entrano
            nel legno fino alla radice con uno schianto che fa piovere aghi su tutta la radura.

            Corin arriva a cinque passi dalla bestia incastrata, con il tubo alzato e le labbra che si
            muovono. Il lampo la prende alla base del collo, e lui si ritrova seduto nell'erba. Le zanne
            restano piantate nella sequoia, e intorno la corteccia si è fatta grigia.
          effetti: { pista.corin: 1, racconto: 1 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: Le gambe ferme
          testo: |
            Ti pianti contro la sequoia e gridi, e il cinghiale carica. Le gambe però restano ferme un momento
            di troppo, come allora sulla bilancia, e la zanna ti prende al fianco prima che tu ti butti. Il
            sangue ti bagna subito la camicia, e lo guardi per essere sicur{o|a} che sia rosso. Mentre sei a
            terra la bestia incastra una zanna in una radice, e Corin le tira a bruciapelo con gli occhi
            chiusi. Il lampo ti passa così vicino che senti l'odore della manica bruciata, e per un bel pezzo
            non provi nemmeno ad alzarti.
          effetti: { pista.corin: 1, ferite: 3 }
          segue: foresta-il-puma-nero

  # ------------------------------------------------------------ il seguito · il puma nero (torna in città)
  - id: foresta-il-puma-nero
    immagine: bestiario/braska
    titolo: Il puma nero
    tipo: seguito
    luogo: Foresta Strisciante, la radura interna
    area: foresta-strisciante
    requisiti: [pista.corin == 3, braska == 0]
    testo: |
      Il cinghiale è a terra, e nel silenzio della radura ti accorgi di essere ancora in piedi. Il fischio
      nelle orecchie si spegne piano, e il primo suono che torna è quello del fiume lontano. Poi dal margine
      degli alberi esce un puma.

      È più grande di quello morto e ha il manto nero attraversato da vene color brace che si accendono e si
      spengono piano. A ogni passo gli si alzano scintille arancioni sotto le zampe, e dove le posa l'erba
      bagnata sfrigola e resta asciutta nella forma dell'impronta. Va dritto al compagno caduto senza guardare
      il cinghiale e gli abbassa il muso sul collo. Quando alza gli occhi color ambra, guarda te.

      {magia Media} Le vene si accendono a ogni respiro, con il ritmo lento di un animale a riposo. È Mana, e
      scorre nella bestia quieto, senza la fretta della Marea che pulsava nelle vene d'argento del cinghiale.

      {origine accolito-del-velo} Senti sul viso lo stesso tepore che usciva dai palmi di Padre Vantes nella
      tenda dei feriti. Al puma però non costa niente, e il muso non gli si fa grigio.

      *Quello morto era il suo compagno, e lui è venuto a salutarlo.* Il puma fa un passo verso di te.
    opzioni:
      - testo: "Avvicinarti di lato, con gli occhi bassi"
        descrizione: "Sai come ci si avvicina a un predatore che non ha fame. Piano e di fianco, senza fissarlo negli occhi."
        requisiti: [natura >= 2]
        costo: 0
        esito:
          titolo: Un nome
          testo: |
            Il puma ti lascia arrivare a un braccio di distanza, poi allunga il muso verso le tue dita, e
            senti sulla pelle un caldo da focolare. Da vicino la sua pelliccia ha l'odore della resina quando
            brucia. Quando torna fra gli alberi ti resta in testa il nome Braska, e non sapresti dire chi te
            l'ha detto.

            Sulla strada del ritorno, due volte, vedi delle scintille arancioni fra gli abeti, sempre alla
            stessa distanza da te. Al Ponte del Conciatore Corin fa venire un carro per il cinghiale, e prima
            di salutarti ti fa promettere che domani sera sarai al Grifone.
          imposta: { braska: 2 }
          vai: ponti-sospesi
      - testo: "Tendergli la mano bassa e aperta"
        descrizione: "Come a un cavallo che non ti conosce. Lasciare che sia lui a decidere."
        requisiti: [addestrare-animali >= 2]
        costo: 0
        esito:
          titolo: La mano
          testo: |
            Ti abbassi su un ginocchio e tendi la mano aperta, il palmo in giù, come si fa con i cavalli
            nuovi. Il puma la guarda a lungo. Poi attraversa lo spazio che vi divide in tre passi lenti e ti
            passa sotto la mano la testa intera, dalla fronte alle orecchie, calda come una pietra lasciata al
            sole. Sotto le dita senti le vene color brace che pulsano piano e si scaldano a ogni respiro. Se
            ne va com'è venuto, e ti lascia addosso un nome che nessuno ha pronunciato, Braska.

            Sulla strada del ritorno, due volte, vedi delle scintille arancioni fra gli abeti, sempre alla
            stessa distanza da te. Al Ponte del Conciatore Corin fa venire un carro per il cinghiale, e prima
            di salutarti ti fa promettere che domani sera sarai al Grifone.
          imposta: { braska: 2 }
          vai: ponti-sospesi
      - testo: "Restare fermo e lasciarlo andare"
        descrizione: "È il suo bosco, e oggi ha già perso abbastanza."
        costo: 0
        esito:
          titolo: Gli occhi d'ambra
          testo: |
            Resti ferm{o|a} con le mani lungo i fianchi, e il puma ti guarda per un tempo che ti sembra
            lunghissimo. Poi si gira e torna fra gli alberi senza fretta, e le scintille sotto le sue zampe si
            spengono una dopo l'altra nel sottobosco. Dove è passato restano nell'erba impronte larghe come la
            tua mano aperta, asciutte in mezzo alla rugiada.

            Al Ponte del Conciatore Corin fa venire un carro per il cinghiale, e prima di salutarti ti fa
            promettere che domani sera sarai al Grifone.
          imposta: { braska: 1 }
          vai: ponti-sospesi
      - testo: "Salutarlo come si saluta al Circolo"
        descrizione: "Al Circolo si dice che una bestia che veglia un compagno non va guardata negli occhi, e che la testa la si abbassa per primi."
        quando: [origine.figlio-del-circolo >= 1]
        costo: 0
        esito:
          titolo: La testa bassa
          testo: |
            Ti inginocchi nell'erba e abbassi la testa finché vedi soltanto le tue mani, come al Circolo si fa
            davanti a una bestia che veglia un compagno. Senti i passi del puma venire avanti e il caldo del
            suo fiato sulla nuca, un caldo da focolare. Un predatore dovrebbe avere addosso l'odore della
            carne, e lui ha quello del fumo di legna. Quando rialzi gli occhi sta tornando fra gli alberi, e
            ti resta in testa un nome che nessuno ha detto, Braska.

            Sulla strada del ritorno vedi due volte delle scintille arancioni fra gli abeti, sempre alla
            stessa distanza da te. Al Ponte del Conciatore Corin fa venire un carro per il cinghiale, e prima
            di salutarti ti fa promettere che domani sera sarai al Grifone.
          imposta: { braska: 2 }
          effetti: { tormento: -0.5 }
          vai: ponti-sospesi
      - testo: "Benedire il puma caduto"
        descrizione: "Il Velo benedice i morti. Su come si benedice una bestia, in Cattedrale, nessuno ti ha mai dato una regola."
        quando: [origine.accolito-del-velo >= 1]
        costo: 0
        prova: { attributo: mentale, abilita: [magia, empatia], difficolta: Media }
        successo:
          titolo: La Benedizione
          testo: |
            Le parole della Benedizione le dici a mezza voce, come te le ha insegnate Vantes, e il calore ti
            scende dal palmo sulla pelliccia che fuma ancora. Il puma nero ti lascia finire. Poi viene a
            fiutarti la mano, e senti sulla pelle un caldo da focolare. Mentre ti fiuta vedi il sottobosco
            dall'altezza di un ginocchio, e senti l'odore di ogni tronco separato da quello degli altri.
            Quando torna fra gli alberi ti resta in testa un nome che nessuno ha detto, Braska.

            Sulla strada del ritorno vedi due volte delle scintille arancioni fra gli abeti, sempre alla
            stessa distanza da te. Al Ponte del Conciatore Corin fa venire un carro per il cinghiale, e prima
            di salutarti ti fa promettere che domani sera sarai al Grifone.
          imposta: { braska: 2 }
          vai: ponti-sospesi
        fallimento:
          titolo: Le parole impastate
          testo: |
            Ti inginocchi accanto al puma caduto e cominci la Benedizione, ma a metà le parole ti si
            impastano, proprio dove Vantes ti diceva di fare una pausa. Il calore che ti scendeva dal palmo si
            spegne a metà parola, e la mano ti resta fredda e umida. Il puma nero ti guarda con gli occhi
            d'ambra finché non smetti. Poi si gira e torna fra gli alberi senza fretta, e le scintille sotto
            le sue zampe si spengono una dopo l'altra.

            Al Ponte del Conciatore Corin fa venire un carro per il cinghiale, e prima di salutarti ti fa
            promettere che domani sera sarai al Grifone.
          imposta: { braska: 1 }
          vai: ponti-sospesi
          effetti: { tormento: 0.5 }
