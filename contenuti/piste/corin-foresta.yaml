# La caccia di Corin, la spedizione nella Foresta Strisciante (pista.corin 2 → 3).
# Si parte dalle Scuderie della Zanna Rotta in Città Bassa. Nella foresta le stanze vanno in ordine,
# secondo la profondità: 0 a cavallo lungo il fiume (le domande di Corin o gli Spiumatori), 1 ancora
# quelle due oppure l'impronta, dove si trova la pista; da 2 a 4 sulla pista (le carcasse, la parete, il
# sottobosco; la fossa solo a 2 e 3, lontano dalla radura). Poi il cuore nella radura, che porta a 3.
# Dopo il cinghiale compare il puma nero (seguito), ed è lì che la scena finisce e si torna ai Ponti
# Sospesi. Una stanza superata non ricompare nella stessa visita (src/motore/spedizioni.ts); le domande
# di Corin e la fossa spariscono anche dopo un fallimento, con le due flag qui sotto.
quality:
  - { id: foresta.domande, nome: Corin ti ha già fatto le sue domande, categoria: stato, nascosta: true, descrizione: "1 se il racconto a Corin è andato male, e in questa visita non te lo richiede." }
  - { id: foresta.fossa, nome: Sei caduto nella fossa di cattura, categoria: stato, nascosta: true, descrizione: "1 se sei caduto nella fossa, e in questa visita la trappola è già scattata." }

aree:
  - id: foresta-strisciante
    immagine: ambientazione/foresta-strisciante
    nome: Foresta Strisciante
    sommario: "Una striscia di sequoie e abeti sulla riva sud del Torvessa, sotto la scarpata del Gradone Rosso."
    spedizione: { ritorno: superficie-fratturata, soglia: 5, stanze: 3 }
    testo: |
      La Foresta Strisciante è una striscia di bosco lunga e stretta a ovest
      della città, oltre il Ponte del Conciatore, chiusa fra la riva sud del
      Torvessa e la scarpata color mattone del Gradone Rosso. Ci sono abeti e
      sequoie così larghe che per abbracciarle servirebbero quattro uomini, e
      fra le radici vivono i vermi carogna che le hanno dato il nome. Corin
      cavalca accanto a te con le redini troppo corte e la schiena dritta da
      lezione di equitazione.

storylet:
  # ------------------------------------------------------------ 2 · la partenza (apre la spedizione)
  - id: verso-la-foresta-strisciante
    presso: scuderie-della-zanna-rotta
    immagine: ambientazione/scuderie-della-zanna-rotta
    titolo: Verso la Foresta Strisciante
    sommario: "Corin ti aspetta davanti alle Scuderie della Zanna Rotta, e la foresta è oltre il Ponte del Conciatore."
    luogo: Città Bassa, davanti alle Scuderie della Zanna Rotta
    area: citta-bassa
    requisiti: [pista.corin == 2]
    testo: |
      Davanti alle Scuderie della Zanna Rotta c'è odore di fieno bagnato e di
      cuoio ingrassato, e Dolovan Stroud sulla soglia parla a voce bassa al
      cavallo più vicino. Corin Ashdale ti aspetta nel cortile vestito per la
      caccia come se l'avesse imparato su un libro, con una balestra a
      tracolla dal calcio intarsiato di madreperla e le occhiaie di chi dorme
      male dalla notte della razzia, quando gli orchi gli hanno ammazzato il
      cane.

      {origine figlio-della-citta-bassa} Sotto questa insegna ci passavi di
      corsa da bambino, perché nel vicolo si diceva che l'orco dipinto
      seguisse con gli occhi chi andava piano.

      «Eccoti! Temevo che ci avessi ripensato» dice, e ride per primo. «Il
      signor Stroud dice che il cinghiale sta nella Foresta Strisciante,
      vicino al fiume, oltre il Ponte del Conciatore.»
    opzioni:
      - testo: "Partire sul baio delle Scuderie"
        descrizione: "Il baio con la cicatrice, pagato da Corin per la giornata. Ti conosce da poco, e va al passo."
        costo: 1
        esito:
          titolo: Il baio di Stroud
          testo: |
            Il baio con la cicatrice si lascia montare senza storie, poi decide da
            solo che si va al passo, e i talloni gli fanno l'effetto di un consiglio
            non richiesto. Corin ogni tanto si volta ad aspettarti e se ne scusa.
            Seguite la riva sud del Torvessa per mezz'ora, sotto la scarpata rossa
            del Gradone, finché davanti a voi compare il bosco, scuro di abeti.
          imposta: { foresta.domande: 0, foresta.fossa: 0 }
          vai: foresta-strisciante
      - testo: "Partire sul tuo cavallo"
        descrizione: "Il baio di Stroud resta nella stalla. Il tuo cavallo ti conosce, e corre volentieri."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il tuo cavallo
          testo: |
            Il tuo cavallo ti riconosce dall'odore e ti spinge la spalla con il muso.
            Corin lo guarda con un'invidia da bambino e chiede a Stroud se ne ha uno
            uguale da vendere, e Stroud risponde di no. Seguite al trotto la riva del
            Torvessa e arrivate al limitare del bosco con Corin rosso di contentezza
            e il cappello di traverso.
          imposta: { foresta.domande: 0, foresta.fossa: 0 }
          vai: foresta-strisciante
      - testo: "Mettere in riga il baio, come nei Quartieri Alti"
        descrizione: "Le lezioni di equitazione dei Quartieri Alti non ti sono mai servite, e con un baio testardo potrebbero."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        costo: 1
        esito:
          titolo: Le ginocchia
          testo: |
            Il baio prova a decidere da solo che si va al passo, e tu glielo lasci
            credere per un centinaio di passi. Poi stringi le ginocchia e accorci
            le redini di un dito, con il gesto che nei Quartieri Alti si impara
            insieme alle buone maniere, e lui si mette al trotto con l'aria di
            averci pensato da sé. Corin ti guarda la schiena e raddrizza la sua.
          imposta: { foresta.domande: 0, foresta.fossa: 0 }
          vai: foresta-strisciante

  # ------------------------------------------------------------ le stanze (ripetibili, tre a caso)
  - id: foresta-le-domande-di-corin
    immagine: personaggi/corin-ashdale
    titolo: Le domande di Corin
    sommario: "Corin cavalca accanto a te e vuole sapere chi sei e come si diventa quello che sei."
    luogo: Foresta Strisciante, lungo il fiume
    area: foresta-strisciante
    ripetibile: true
    # Corin parla di Ottone come di un nemico ancora in Consiglio: non dopo l'arresto (pista.pelle 5).
    requisiti: [pista.corin == 2, profondita.foresta-strisciante <= 1, foresta.domande == 0, pista.pelle < 5]
    testo: |
      Lungo il fiume, al passo, Corin parla della Gilda dei Mercanti, che
      secondo lui è il cuore della città e ogni tanto pompa sangue sporco. Di
      Ottone Malgrani dice che è un cancro con i baffi in ordine, e subito
      dopo si guarda intorno, anche se ci sono soltanto gli abeti.

      {origine rampollo-dei-quartieri-alti} Alle tavole dei Quartieri Alti i
      Malgrani si nominano dopo il dolce e a voce bassa.

      «Ma basta con me. Chi sei, da dove vieni? E come si fa a diventare uno
      che si mette fra la gente e gli orchi?» chiede, con le orecchie rosse.
    opzioni:
      - testo: "Raccontargli la verità, senza abbellirla"
        descrizione: "Anche le parti in cui avevi paura."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Media }
        successo:
          titolo: Senza abbellimenti
          testo: |
            Gli racconti com'è andata davvero, anche la paura. Ti accorgi che detta
            tutta in fila fa meno male, e Corin ascolta senza interromperti per la
            prima volta in tutta la mattina. «Allora basta restare lì» dice alla
            fine, e lo ripete a mezza voce per sentire come suona.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: L'odore del fumo
          testo: |
            Cominci a raccontare della razzia e a metà ti accorgi che le mani ti
            sudano sulle redini e che senti di nuovo l'odore del fumo, e ti fermi.
            Corin prova a riempire il silenzio con un carico di spezie andato a
            male a Laresh, e lo racconta fino in fondo anche se nessuno dei due
            ascolta.
          effetti: { tormento: 1 }
          imposta: { foresta.domande: 1 }
      - testo: "Raccontargli la versione da locanda"
        descrizione: "Un orco in più e un po' meno paura, perché Corin ha voglia di un eroe."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: La versione da locanda
          testo: |
            Gli racconti la razzia come la racconterebbero al Grifone dopo il terzo
            boccale, con un orco in più e un po' meno paura, e scopri con un certo
            disagio che ti viene benissimo. Corin ti chiede di ripetere la frase che
            hai detto all'orco prima di colpirlo, e se la ripete a mezza voce per
            tutto il tragitto, provando dove mettere le pause.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Un orco di troppo
          testo: |
            A metà racconto aggiungi un orco e poi un altro, e Corin aggrotta la
            fronte. «Strano. Io quella sera ero lì con il naso nel fango, e me ne
            ricordavo meno» dice, gentile. Per tutta la strada non ti contraddice
            più, e ti guarda di lato con una gentilezza che è peggio di qualunque
            contraddizione.
          effetti: { tormento: 1 }
          imposta: { foresta.domande: 1 }
      - testo: "Parlargli da mercante a mercante"
        descrizione: "Hai anche tu la licenza della Gilda, e sai di cosa si lamenta un mercante quando cavalca."
        requisiti: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Da mercante a mercante
          testo: |
            Gli chiedi dei dazi sul Ponte delle Mille Corde, e Corin si illumina.
            Per mezz'ora parlate di pesi e di gabelle e di chi, alla Casa dei Nodi,
            firma i permessi senza leggerli, e lui ti fa i nomi di due Custodi di
            Passaggio che accettano regali. «Questo non l'hai sentito da me» dice,
            guardando un abete con sospetto.
          effetti: { profondita.foresta-strisciante: 1, informazioni.voce: 1 }
      - testo: "Dirgli di Ghoran"
        descrizione: "Della bilancia su cui pesano gli schiavi, e di come ci sei sceso."
        requisiti: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La bilancia
          testo: |
            Gli racconti di Ghoran e della bilancia nel mercato, con la voce piatta
            di un inventario. Corin dice che a Ghoran c'è stato una volta per un
            carico di pelli, e che il mercato gli era sembrato pittoresco. Poi
            capisce cosa ha detto e diventa rosso fino al colletto, e per il resto
            della strada ti passa la borraccia senza che tu la chieda.
          effetti: { profondita.foresta-strisciante: 1 }
      - testo: "Lasciarlo parlare e annuire"
        descrizione: "Corin ha molte cose da dire sulla Gilda, e tu hai due orecchie."
        costo: 2
        esito:
          titolo: I dazi
          testo: |
            Annuisci, e Corin parla dei dazi sul grano e sull'acqua purificata, poi
            del motivo per cui Ottone Malgrani lo odia e di quello per cui lui odia
            Ottone Malgrani, che è più lungo e ha delle note a margine. Quando
            finalmente si ferma siete molto più avanti, e ti ronzano le orecchie
            come dopo una notte alla Pignatta.
          effetti: { profondita.foresta-strisciante: 1, tormento: 1 }

  - id: foresta-gli-spiumatori
    immagine: ambientazione/gradone-rosso
    titolo: Gli Spiumatori
    sommario: "Ai piedi del Gradone Rosso due orchi accovacciati mangiano qualcosa. Hanno piume incollate nei capelli."
    luogo: Foresta Strisciante, sotto il Gradone Rosso
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante <= 1]
    testo: |
      Dove il bosco si avvicina alla scarpata del Gradone Rosso gli alberi si
      diradano su una spianata di sassi rossi. Due orchi accovacciati, con le
      piume incollate ai capelli con la resina, mangiano a due mani uccelli
      crudi grandi come gazze, e uno ha un arco appoggiato al sasso.

      {origine fuggiasco-di-ghoran} Ai recinti di Ghoran i sorveglianti
      mangiavano accovacciati così, ed era meglio non passare loro davanti.

      «Orchi! Come procediamo?» sussurra Corin, e lo si sente fino al fiume.
      Uno dei due alza la testa ad annusare l'aria, con un'ala che gli pende
      dalla bocca.
    opzioni:
      - testo: "Attaccarli prima che vi vedano"
        immagine: bestiario/orco
        descrizione: "Sono due orchi magri con la bocca piena."
        combattimento: spiumatori-al-gradone
        vittoria:
          titolo: Piume
          testo: |
            Il primo orco si alza con la bocca ancora piena e non fa in tempo a
            prendere l'arco. Il secondo scappa appena il compagno va giù, su per la
            scarpata a quattro zampe. Corin arriva quando è tutto finito, con la
            balestra carica e le mani che tremano, e a te restano piume grigie
            attaccate dappertutto, anche dentro il colletto.
          effetti: { profondita.foresta-strisciante: 1 }
        sconfitta:
          titolo: Su per la scarpata
          testo: |
            Uno dei due ti colpisce con un sasso grosso come un pugno, e il mondo si
            inclina. Quando si raddrizza gli orchi sono a metà della scarpata, e
            Corin ti tampona la fronte con un fazzoletto di seta, le sue iniziali
            proprio sopra il taglio. «Li abbiamo messi in fuga» dice, con molta
            buona volontà.
      - testo: "Aggirarli sotto gli abeti"
        descrizione: "Sottovento, con i cavalli per la briglia. Basta non pestare niente."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Sottovento
          testo: |
            Porti il cavallo per la briglia sotto gli abeti, sottovento, mettendo i
            piedi sugli aghi e mai sui rami, e Corin ti viene dietro in punta di
            piedi, paonazzo per la concentrazione. Gli orchi non alzano la testa
            dal loro pasto. Più avanti Corin raccoglie una piuma grigia portata dal
            vento e se la infila nel taschino.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Il ramo secco
          testo: |
            Il ramo secco lo pesti tu, e nel silenzio sembra uno schiocco di frusta.
            Uno degli orchi ti tira un sasso che ti prende sullo zigomo, poi torna a
            mangiare come se avesse scacciato una mosca. Tornate indietro fra gli
            abeti, con Corin che ti guarda lo zigomo e dice che si vede appena.
          effetti: { ferite: 0.5 }
      - testo: "Avvicinarti con le mani aperte"
        descrizione: "Hanno le piume incollate nei capelli e stanno mangiando. Chi mangia, di solito, ha poca voglia di litigare."
        prova: { attributo: sociale, abilita: [empatia, intimidire], difficolta: Media }
        successo:
          titolo: Mezzo uccello
          testo: |
            Esci allo scoperto piano e ti accovacci a dieci passi da loro, con le
            mani bene in vista. L'orco più vecchio ti guarda a lungo e ti tende
            mezzo uccello, e per fortuna basta tenerlo in mano. Quando indichi il
            bosco si porta due dita alla bocca a fare le zanne e punta il mento
            verso ovest. Corin non riesce a chiudere la bocca.
          effetti: { profondita.foresta-strisciante: 1, informazioni.voce: 1 }
        fallimento:
          titolo: L'osso
          testo: |
            L'orco più grosso si alza con un grugnito che si capisce anche senza
            traduzione, e ti tira un osso di uccello ancora sporco che ti apre il
            labbro. Poi tutti e due tornano al loro pasto. Ti ritiri fra gli abeti
            succhiandoti il labbro, e Corin ti dice che sei stato molto coraggioso.
          effetti: { ferite: 0.5 }
      - testo: "Fare il giro largo lungo il fiume"
        descrizione: "Lontano dal Gradone, nell'acqua bassa. Gli orchi non vi vedranno, e i cavalli si bagneranno fino alla pancia."
        costo: 2
        esito:
          titolo: Nell'acqua bassa
          testo: |
            Risalite il fiume nell'acqua bassa, con i cavalli che scivolano sui
            sassi, finché il tuo si inginocchia e tu finisci in acqua gelata fino
            alla cintura. Corin ti offre il suo mantello, ci ripensa perché è di
            velluto, e poi te lo dà lo stesso. Quando tornate fra gli alberi gli
            orchi sono lontani e a te battono i denti.
          effetti: { profondita.foresta-strisciante: 1, ferite: 0.5 }

  - id: foresta-l-impronta
    immagine: ambientazione/foresta-strisciante
    titolo: L'impronta
    sommario: "Nel fango vicino a un ruscello c'è un'impronta di zoccolo larga come una scodella."
    luogo: Foresta Strisciante, vicino a un ruscello
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante == 1]
    testo: |
      Nel fango vicino a un ruscello c'è un'impronta di zoccolo larga quanto
      una scodella da fucina, e la mano di Corin, appoggiata accanto nel
      guanto di capretto, è più piccola. Intorno le felci sono schiacciate, e
      su un abete c'è una striscia di corteccia strappata all'altezza del tuo
      petto, bagnata di qualcosa di grigio.

      {origine figlio-del-circolo} Sotto l'odore del fango senti quello di
      ferro caldo e pelo bruciato della volpe abbattuta nel Bosco di Velthar
      quando eri bambino.

      «Grande, eh? Beh, insomma, grande è grande» dice Corin, rimontando in
      sella.
    opzioni:
      - testo: "Leggere le tracce"
        descrizione: "Quanto pesa, da quanto è passato, dove va."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Sei quintali
          testo: |
            Misuri l'impronta con il palmo, e fa il doppio di quella di un
            cinghiale normale. Affonda nel fango quanto basta per dirti che la
            bestia pesa sei quintali o poco più, e le impronte fresche vanno verso
            il fondo della foresta. Corin ripete «sei quintali» con un fischio
            basso e si rimette in tasca la mano.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Il grigio sulla corteccia
          testo: |
            Passi un dito sulla sostanza grigia della corteccia. È fredda e sa di
            cenere bagnata, e il bosco ti gira intorno finché devi appoggiarti al
            tronco. Quando ti passa, le impronte si sono confuse con quelle dei
            caprioli.
          effetti: { tormento: 1 }
      - testo: "Guardare dove i cavalli non vogliono andare"
        descrizione: "I cavalli sentono le bestie grosse prima di te."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: Le orecchie dei cavalli
          testo: |
            Lasci le redini lunghe e guardi i cavalli. Tutti e due girano le
            orecchie verso le sequoie a sud-ovest, e il tuo punta gli zoccoli
            quando provi a mandarlo da quella parte, quindi è la direzione giusta.
            Lo convinci a piccoli passi, e oltre le sequoie ritrovi la pista mentre
            Corin prende appunti su un taccuino.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Lo scarto
          testo: |
            Spingi il cavallo verso le sequoie per vedere come reagisce, e lui si
            impenna di colpo e ti butta di schiena fra le felci, con la bocca piena
            di foglie. Corin scende ad aiutarti e ti chiede se fa parte del metodo.
            La schiena ti fa male per tutto il giorno.
          effetti: { ferite: 0.5 }
      - testo: "Seguire le felci schiacciate, un passo alla volta"
        descrizione: "La scia è larga, basta non perderla. Ci vorrà tutto il pomeriggio."
        costo: 2
        esito:
          titolo: Il bosco zitto
          testo: |
            Segui a piedi la scia di felci schiacciate, tirandoti dietro il cavallo,
            e su ogni tronco trovi la stessa striscia di grigio all'altezza del
            petto. Dopo un'ora ti accorgi che gli uccelli hanno smesso di cantare, e
            non sai da quanto. Corin si mette a fischiettare per fare rumore, finché
            non gli chiedi di smettere.
          effetti: { profondita.foresta-strisciante: 1, tormento: 1 }

  - id: foresta-il-sottobosco
    immagine: ambientazione/foresta-strisciante
    titolo: Il sottobosco
    sommario: "Le tracce entrano in una macchia così fitta che i cavalli si rifiutano di seguirle."
    luogo: Foresta Strisciante, nel sottobosco
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante >= 2, profondita.foresta-strisciante <= 4]
    testo: |
      Le tracce entrano in una macchia di rovi e viticci così fitta che i
      cavalli puntano gli zoccoli, e li legate a un abete. Il cinghiale ci è
      passato in mezzo come un carro, lasciando un corridoio di rami spezzati
      alto quanto la tua cintura, già richiuso a metà. «Ho letto che i
      cacciatori veri vanno avanti carponi» dice Corin, e aggiunge che spera
      fosse un libro serio.

      {percezione Media} Lungo il margine della macchia, a una ventina di
      passi, i rovi fanno una piccola gobba regolare, come sopra un passaggio
      battuto da bestie piccole.
    opzioni:
      - testo: "Passare dove è passato lui"
        descrizione: "Il corridoio che ha aperto c'è ancora, almeno in parte."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il corridoio
          testo: |
            Ti infili di traverso nel corridoio di rami spezzati, e dove si richiude
            passi a quattro zampe, lasciando che i viticci ti si attacchino alle
            maniche. Dietro di te Corin avanza carponi come ha letto sul libro e ti
            chiede se lo sta facendo bene. Sbucate dall'altra parte coperti di
            foglie, e lui ha l'aria più felice di tutta la mattina.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: I viticci
          testo: |
            A metà strada un viticcio ti si stringe alla caviglia e un altro al
            collo, e più ti agiti più stringono. Quando ne esci a ritroso hai una
            spina conficcata nella guancia e un graffio lungo il collo che brucia.
            Corin ti aspetta all'imbocco con il mantello sul braccio, e ti dice che
            da fuori sembrava andare bene.
          effetti: { ferite: 0.5 }
      - testo: "Cercare il passaggio dei caprioli"
        descrizione: "Una macchia così grande ha per forza un sentiero, se sai dove guardare."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il passaggio dei caprioli
          testo: |
            Lungo il margine della macchia trovi un tunnel basso fra i rovi, con il
            terreno battuto e ciuffi di pelo castano impigliati alle spine, più
            ordinato di metà dei vicoli della Città Bassa. Lo percorri piegato in
            due, con Corin che batte la testa due volte contro lo stesso ramo e si
            scusa tutte e due le volte, e sbucate proprio dove riprende la pista.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Tutti uguali
          testo: |
            Giri intorno alla macchia cercando un varco, e dopo un'ora ti accorgi che gli abeti sono
            tutti uguali e il sole è dalla parte sbagliata. Non hai il coraggio di dire a Corin che
            vi siete persi. Ritrovi il punto di partenza grazie a un fazzoletto di seta che lui
            aveva legato a un ramo, senza dirtelo.
          effetti: { tormento: 1 }
      - testo: "Aprirti la strada con la lama"
        descrizione: "Ci vuole tempo e ci vogliono braccia. Alla fine avrai le mani a pezzi."
        costo: 2
        esito:
          titolo: A colpi di lama
          testo: |
            Tagli rovi e viticci per un'ora buona, e la macchia si apre con la
            lentezza di un pagamento della Gilda. Corin ammucchia in ordine i rami
            tagliati, perché non gli viene in mente niente di più utile, e ogni
            tanto li raddrizza. Dall'altra parte arrivi con i palmi pieni di
            vesciche e le braccia che non si alzano più sopra le spalle.
          effetti: { profondita.foresta-strisciante: 1, ferite: 0.5 }

  - id: foresta-la-fossa
    immagine: ambientazione/foresta-strisciante
    titolo: La fossa di cattura
    sommario: "Dove il sottobosco si dirada, un mucchio di rametti è disposto un po' troppo in ordine."
    luogo: Foresta Strisciante, in una radura di felci
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante >= 2, profondita.foresta-strisciante <= 3, foresta.fossa == 0]
    testo: |
      Il sottobosco si dirada in una radura di felci basse, dove le tracce del
      cinghiale si perdono sugli aghi. Corin cammina davanti a te con la
      balestra tenuta come un ombrello chiuso, raccontandoti delle lumache nel
      miele di una locanda di Laresh. Più avanti, fra due abeti, c'è un
      mucchio di rametti coperto di foglie un po' troppo in ordine per un
      bosco.

      {percezione Media} Sotto il mucchio il terreno ha il colore della terra
      smossa da poco, e gli abeti ai lati sono troppo vicini perché una bestia
      grossa passi altrove.
    opzioni:
      - testo: "Guardare dove metti i piedi"
        descrizione: "Quelle foglie le ha messe lì qualcuno."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La rete di rami
          testo: |
            Afferri Corin per il colletto un passo prima dei rametti. Sotto le
            foglie i tronchetti sono intrecciati a rete, e sotto la rete c'è una
            fossa da cacciatori profonda quattro metri, con i pali appuntiti sul
            fondo. Corin diventa bianco e ti ringrazia due volte. Su uno dei pali
            qualcuno ha inciso le lettere D e S, ormai annerite dall'umido.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Il terreno che cede
          testo: |
            Tieni gli occhi sulla pista, e quando appoggi il peso sul mucchio di
            rametti il terreno se ne va. I rami si aprono sotto di te come una
            botola, le braccia si allargano da sole in cerca di un appiglio, e
            l'ultima cosa che vedi è la faccia di Corin che si allontana.
          imposta: { foresta.fossa: 1 }
          segue: foresta-la-fossa-caduta
      - testo: "Tenere Corin per la cintura e tastare il terreno con un ramo"
        descrizione: "Lento e faticoso, e Corin non sta mai dietro a nessuno per molto."
        costo: 2
        esito:
          titolo: La cintura di Corin
          testo: |
            Procedi tastando il terreno con un ramo lungo e tenendo Corin per la
            cintura, e lui ti passa davanti lo stesso, con una specie di talento. Il
            terreno gli cede sotto un piede, e lo tiri indietro mentre i rami
            spariscono nel buio di una fossa da cacciatori. Corin si siede per terra
            e ti ringrazia tre volte, ogni volta un po' più piano.
          effetti: { profondita.foresta-strisciante: 1, ferite: 0.5 }

  - id: foresta-la-fossa-caduta
    immagine: ambientazione/foresta-strisciante
    titolo: Nella fossa
    tipo: seguito
    luogo: Foresta Strisciante, dentro la fossa di cattura
    area: foresta-strisciante
    requisiti: [pista.corin == 2]
    testo: |
      La fossa è profonda due volte la tua altezza, e in fondo ci sono pali
      appuntiti piantati anni fa, neri di muffa ma ancora dritti. Stai
      cadendo, e a un braccio dalla tua mano sporge dalla parete una radice
      d'abete grossa come un polso. Da sopra arriva la voce di Corin, che
      grida il tuo nome e poi, a corto di idee, anche il suo.

      {acrobazia Facile} La radice è a portata, se il braccio parte adesso.
    opzioni:
      - testo: "Afferrare la radice"
        descrizione: "È lì, e bisogna prenderla al primo colpo."
        costo: 0
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La radice
          testo: |
            Le dita si chiudono sulla radice e la spalla ti dà uno strappo che senti
            fino ai denti, ma tieni. Resti appeso sopra i pali finché Corin non si
            sdraia sull'orlo e ti allunga la cinghia della balestra, tirandoti su
            con più coraggio che braccia. Restate seduti per terra senza parlare, e
            intanto la pista si è raffreddata.
        fallimento:
          titolo: In fondo alla fossa
          testo: |
            La radice ti scivola fra le dita e finisci in fondo alla fossa. Un palo
            ti apre la coscia di striscio, un altro si spezza sotto il tuo peso,
            marcio, ed è per questo che sei ancora intero. Corin ti cala il mantello
            annodato alla cinghia della balestra, e fuori ti fasci la gamba con una
            striscia di seta che lui ti porge senza dire niente.
          effetti: { ferite: 1 }
      - testo: "Lasciarti scivolare lungo la parete"
        descrizione: "Più lento e meno pericoloso, ma ti scorticherai le mani."
        costo: 0
        esito:
          titolo: Lungo la parete
          testo: |
            Ti lasci scivolare a pancia in giù con le mani e le ginocchia piantate
            nella terra, e arrivi in fondo con i palmi scorticati e i piedi fra due
            pali, a un dito dalle punte. Corin ti cala il mantello annodato alla
            cinghia della balestra, e per tutta l'ora che ci metti a risalire ti
            chiede scusa per una fossa scavata da qualcun altro.
          effetti: { ferite: 0.5 }
      - testo: "Piantare la lama nella parete, come sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice chi scivola pianta la lama, e la terra della fossa è morbida."
        quando: [origine.apprendista-raschiatore >= 1]
        costo: 0
        esito:
          titolo: Appeso alla lama
          testo: |
            La mano va alla cintura prima che la testa ci pensi, con un gesto
            delle piattaforme. Pianti la lama nella parete fino all'elsa e ci
            resti appeso coi piedi a una spanna dalle punte, poi raggiungi la
            radice e risali una presa alla volta finché Corin non ti afferra per
            il colletto. Sull'orlo pulisci la lama dalla terra, e intanto la pista
            si è raffreddata.

  - id: foresta-la-parete
    immagine: ambientazione/foresta-strisciante
    titolo: La parete di roccia
    sommario: "Le tracce fanno il giro di una parete di roccia alta tre uomini. In cima la pista è fresca."
    luogo: Foresta Strisciante, sotto la parete
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante >= 2, profondita.foresta-strisciante <= 4]
    testo: |
      Il bosco finisce contro una parete di roccia rossastra alta tre uomini,
      che scende dal Gradone Rosso come una costola. Le tracce del cinghiale
      fanno il giro largo verso il fiume, e in cima vedi le felci schiacciate
      dal suo passaggio.

      {atletica Media} Dove l'acqua scava ci sono appigli, e a metà parete una
      crepa buona per una mano intera.

      «Io porto i cavalli dal giro lungo» dice Corin in fretta, con la testa
      all'indietro. «Qualcuno deve pure pensare ai cavalli.»
    opzioni:
      - testo: "Arrampicarti"
        descrizione: "La pietra è bagnata, ma dove l'acqua scava ci sono gli appigli."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: In cima
          testo: |
            Sali piano dove l'acqua ha scavato la pietra. A metà parete un sasso ti
            si stacca sotto la mano e resti appeso a tre dita finché l'altra non
            trova una crepa. In cima le impronte sono così fresche che il fango sta
            ancora riempiendo i bordi, e molto più tardi arriva Corin con i cavalli,
            fiero come se la parete l'avesse scalata lui.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Due metri
          testo: |
            Sali due metri, poi il piede ti scivola sulla pietra bagnata e torni giù
            molto più in fretta, atterrando sul fianco con i palmi scorticati e un
            ginocchio che si gonfia. Corin, tornato a vedere perché non arrivi, ti
            trova a toglierti la sabbia rossa dai graffi e fa finta di niente con
            una discrezione molto rumorosa.
          effetti: { ferite: 0.5 }
      - testo: "Cercare la cengia dei caprioli"
        descrizione: "Se ci passano i caprioli ci passi anche tu, ma bisogna trovarla."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La cengia
          testo: |
            Studi la parete finché non vedi una cengia larga un piede che sale a
            zigzag, segnata dagli escrementi dei caprioli, e la segui con la
            pancia contro la roccia fino in cima, senza un graffio. Le impronte
            del cinghiale sono ancora umide. Corin arriva con i cavalli un'ora
            dopo e ti chiede come hai fatto, con l'aria di volerlo scrivere.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: La cengia che finisce
          testo: |
            Segui una cengia che sale bene per metà parete e poi finisce contro la
            roccia liscia. Torni giù all'indietro, un piede alla volta, con le gambe
            che tremano, mentre oltre la parete Corin chiama il tuo nome per sapere
            a che punto sei. In fondo ti siedi ad aspettare che il cuore rallenti, e
            intanto la luce sulla parete ha cambiato colore.
          effetti: { tormento: 1 }
      - testo: "Andare con Corin per il giro lungo"
        descrizione: "Corin sarà contento di avere compagnia, e il giro è lungo."
        costo: 2
        esito:
          titolo: Il giro lungo
          testo: |
            Segui Corin lungo la base della parete verso il fiume, dove la roccia
            si abbassa. Il giro dura più di un'ora, e Corin fischietta una canzone
            del Grifone sbagliando sempre la stessa nota, tanto che a metà strada
            ti accorgi che la aspetti. Arrivate in cima quando le ombre si sono
            allungate, e le impronte del cinghiale sono ancora lì.
          effetti: { profondita.foresta-strisciante: 1, tormento: 1 }

  - id: foresta-le-carcasse
    immagine: bestiario/verme-carogna
    titolo: Le carcasse
    sommario: "In una conca fra le radici ci sono carcasse di caprioli, e fra le carcasse qualcosa si muove."
    luogo: Foresta Strisciante, in una conca fra le sequoie
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante >= 2, profondita.foresta-strisciante <= 4]
    testo: |
      In una conca fra le radici di due sequoie ci sono le carcasse di tre
      caprioli, aperte dalla gola alla pancia e lasciate lì intere. Le mosche
      sono così tante che il ronzio sembra venire dalla terra, e Corin si
      copre il naso con un fazzoletto di seta. Fra le carcasse qualcosa di
      pallido e bagnato si gonfia piano e si sgonfia, come la pancia di un
      cane che dorme.

      {natura Media} Una bestia che ammazza senza mangiare è malata o sta
      difendendo qualcosa, e il grigio sugli alberi fa pensare a tutte e due.
    opzioni:
      - testo: "Affrontarli"
        immagine: bestiario/verme-carogna
        descrizione: "Sono due, lunghi quanto un uomo, e dove toccano i muscoli si irrigidiscono."
        combattimento: vermi-carogna
        vittoria:
          titolo: I vermi carogna
          testo: |
            Il primo verme si alza dalle carcasse con la corona di tentacoli aperta,
            e il secondo esce da sotto una radice dove avevi messo il piede. Uno ti
            sfiora il polso e la mano ti diventa di legno per un lungo momento.
            Quando smettono di muoversi, l'unico dardo di Corin è piantato in una
            sequoia a un palmo dalla tua testa.
          effetti: { profondita.foresta-strisciante: 1 }
        sconfitta:
          titolo: Per il colletto
          testo: |
            Un tentacolo ti si avvolge al polpaccio e la gamba diventa rigida come
            un ramo, e cadi fra le carcasse mentre la bocca rotonda del verme ti
            cerca il fianco. Poi Corin ti trascina via per il colletto con tutte e
            due le mani, e ti lascia solo quando siete al fiume. La gamba torna tua
            dopo un'ora, e il fetore ti resta nei vestiti.
      - testo: "Guardare bene prima di avvicinarti"
        descrizione: "Quella cosa che respira fra i caprioli non è un capriolo."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Sopravvento
          testo: |
            Ti fermi a dieci passi e guardi. Fra le carcasse c'è un verme pallido
            lungo quanto un uomo, arrotolato su sé stesso, e un secondo sotto la
            radice assaggia l'aria con la corona di tentacoli aperta. Prendi Corin
            per la manica e fate il giro largo sopravento, fino a ritrovare le
            tracce dall'altra parte della conca.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Il tentacolo
          testo: |
            Ti avvicini alla carcassa più vicina, e la carcassa si muove. Un verme
            pallido esce dal ventre del capriolo e ti sfiora la caviglia, e la
            gamba ti diventa di legno dal ginocchio in giù. Corin ti trascina
            indietro gridando per tutti e due, mentre il verme rientra nel
            capriolo con la calma di uno che torna a casa.
          effetti: { ferite: 0.5 }
      - testo: "Lasciare a loro le carcasse e passare dal greto"
        descrizione: "Il greto è lontano dalle carcasse e lungo, e il rumore lo sentirai lo stesso."
        costo: 2
        esito:
          titolo: Il greto
          testo: |
            Scendi al greto con Corin e i cavalli e lo segui a lungo sui sassi
            bagnati, finché la conca non è lontana. Il risucchio regolare che viene
            dalle carcasse si sente anche sopra lo scroscio del fiume, e a un certo
            punto Corin si tappa le orecchie e canticchia. Quando risalite nel bosco
            hai ancora in gola il sapore dolciastro.
          effetti: { profondita.foresta-strisciante: 1, tormento: 1 }

  # ------------------------------------------------------------ la carta della spedizione
  - id: foresta-la-farfalla
    immagine: ambientazione/foresta-strisciante
    titolo: La farfalla foglia-rossa
    sommario: "Corin ha visto una farfalla foglia-rossa e ha deciso di portarla a Liaren."
    luogo: Foresta Strisciante, fra le felci
    area: foresta-strisciante
    tipo: carta
    # Corin vuole portarla a Liaren: non mentre Liaren è sparita o a letto (Acciaio e Ira 1–5).
    requisiti: [pista.corin == 2, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      Una farfalla foglia-rossa si posa sull'orecchio del tuo cavallo e
      riparte, e Corin le va dietro a piedi fra le felci con il cappello in
      mano. È una di quelle che Padre Vantes ha liberato a mezzogiorno del
      Festival.

      {origine accolito-del-velo} Il drappo cremisi, quel giorno, l'hai
      sollevato tu insieme a Padre Vantes, e ti chiedi se questa era fra
      quelle.

      «La porto a Liaren!» ti grida senza voltarsi. «Le piaceranno, credo.
      Beh, insomma, è rossa.»
    opzioni:
      - testo: "Aiutarlo a prenderla"
        descrizione: "Con il cappello, piano, mentre è posata."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Facile }
        successo:
          titolo: Nel cappello
          testo: |
            La farfalla si posa su una felce e tu le cali sopra il cappello di Corin, piano,
            con la punta della lingua fra i denti. Corin la mette in una tabacchiera
            d'argento dopo averci fatto due buchi col pugnale, e la tiene in mano come un
            uovo per il resto della strada. Ridi, e ti accorgi che non ridevi da giorni.
          effetti: { tormento: -0.5 }
        fallimento:
          titolo: Nelle felci
          testo: |
            Ti tuffi sulla farfalla e atterri a pancia in giù fra le felci bagnate.
            La farfalla va a posarsi sul naso di Corin, che resta immobile a
            guardarla con gli occhi storti finché non riparte verso il fiume. «La
            lasciamo andare» dice, come se l'avesse deciso lui, e ti toglie una
            lumaca dalla spalla.
      - testo: "Lasciarlo fare e guardarti intorno"
        descrizione: "Corin si divertirà anche da solo."
        esito:
          titolo: Le tacche sull'abete
          testo: |
            Mentre Corin corre fra le felci, su un abete trovi una colonna di
            tacche vecchie coperte di resina, sotto le lettere D e S incise nella
            corteccia, e quando le conti sono quarantuno. Corin torna senza la
            farfalla e si illumina. «Dolovan Stroud! Da ragazzo cacciava qui.
            Quarantuno cinghiali, allora» dice, e poi ci pensa. «O quarantuno
            orchi, con il signor Stroud non si sa mai.»
          effetti: { informazioni.voce: 1 }
      - testo: "Chiamarla come al Circolo si chiamano le bestie"
        descrizione: "Nel Bosco di Velthar il Circolo insegna ai bambini la lingua per parlare alle bestie."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Sul dorso della mano
          testo: |
            Ti accucci fra le felci e chiami la farfalla a fior di labbra, con le
            parole che il Circolo insegna ai bambini. Lei gira due volte sopra il
            cappello di Corin e si posa sul dorso della tua mano, leggera come un
            fiocco di cenere. Corin la chiude in una tabacchiera d'argento bucata
            col pugnale, e prima del fiume ti chiede tre volte come hai fatto.
          effetti: { tormento: -0.5 }

  # ------------------------------------------------------------ il cuore · 2 → 3
  - id: il-cinghiale-mutato
    immagine: bestiario/cinghiale-crudele-mutato
    titolo: Il cinghiale mutato
    sommario: "In fondo alla foresta c'è una radura piena di carcasse, e in mezzo alle carcasse c'è il cinghiale."
    luogo: Foresta Strisciante, la radura interna
    area: foresta-strisciante
    requisiti: [pista.corin == 2, profondita.foresta-strisciante >= 5]
    testo: |
      Le tracce ti portano in una radura fra le sequoie piena di carcasse
      lasciate senza un morso. Vicino a un tronco caduto c'è un puma dal manto
      color brace con le fauci aperte e la pelliccia che fuma ancora, e Corin
      smette di parlare per la prima volta da stamattina.

      Il cinghiale è al centro della radura, grande come un carro, con le
      setole grigie irte di protuberanze d'osso. Sotto la pelle gli pulsano
      lente vene d'argento, e dove il puma l'ha ferito il sangue cola grigio e
      denso. *Questa è opera della Marea Grigia, e ce l'hai a trenta passi.*
      Gli occhi piccoli e rossi si girano verso di voi.

      {natura Difficile} Le vene d'argento battono più lente del cuore di un
      cinghiale, e dove la Marea l'ha toccato la carne è più tenera, dietro la
      spalla.

      Corin non prende la balestra. Slega dalla sella un fagotto di velluto e
      ne tira fuori un tubo di metallo scuro lungo quanto un braccio, con una
      camera di cristallo in mezzo e un'impugnatura non fatta per mani umane.
      «Un'arma dei Precursori» sussurra. «Ci mette tanto a caricarsi, e io non
      prendo mai niente.» Il cristallo comincia a ronzare piano.

      {origine allievo-di-torvessa} Il ronzio ti arriva nei denti come quello
      dei cristalli dell'Accademia.
    opzioni:
      - testo: "Affrontarlo"
        immagine: bestiario/cinghiale-crudele-mutato
        descrizione: "È grande come un carro, e devi restare vivo finché Corin non carica l'arma."
        combattimento: cinghiale-della-foresta
        vittoria:
          titolo: La montagna che cade
          testo: |
            Il cinghiale carica spezzando un abete giovane, e ti butti di lato
            all'ultimo. Lo colpisci due volte dietro la spalla, dove il pelo è più
            rado, finché va giù di fianco. Il cristallo di Corin finisce di
            caricarsi proprio adesso, e lui abbassa l'arma con cura, poi tocca la
            zanna con la punta dello stivale e ride troppo a lungo, con le mani
            che tremano.
          effetti: { pista.corin: 1, racconto: 1 }
          segue: foresta-il-puma-nero
        sconfitta:
          titolo: Il tubo di Corin
          testo: |
            La carica ti sbatte contro una sequoia, e quando riapri gli occhi il
            cinghiale è sopra di te con la bava grigia sulla giacca. Un filo di
            luce ti passa sopra la testa con un rumore di tela strappata e gli
            apre un buco nel fianco. Il cinghiale fa tre passi e cade, e Corin è
            per terra, sbalzato dal colpo. Le costole ti scricchiolano a ogni
            movimento.
          effetti: { pista.corin: 1 }
          segue: foresta-il-puma-nero
      - testo: "Attirarlo nella fossa di cattura"
        descrizione: "Da qualche parte qui intorno c'è una fossa da cacciatori, e nella fossa Corin avrebbe tempo per mirare."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: La fossa
          testo: |
            La fossa la trovi a cento passi, sotto un mucchio di rami troppo in
            ordine. Ti fai vedere e scappi da quella parte girando largo, e il
            cinghiale carica dritto e sfonda i rami, finendo sui pali. Corin si
            affaccia sull'orlo, punta il tubo verso il basso e aspetta che il
            cristallo smetta di ronzare, e il lampo illumina la fossa fino al fondo.
          effetti: { pista.corin: 1, racconto: 1 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: Troppo vicino
          testo: |
            Il cinghiale ti taglia la strada e una zanna ti apre la coscia. Mentre
            si gira per finirti, una zampa posteriore gli scivola sui rami della
            fossa e ci cade dentro per metà, e Corin, che gli correva dietro
            urlando, tira dall'orlo a tre passi. Il colpo sbatte Corin contro un
            abete e la bestia non esce più dalla fossa, mentre tu ci metti molto a
            rialzarti.
          effetti: { pista.corin: 1, ferite: 2.5 }
          segue: foresta-il-puma-nero
      - testo: "Aspettare la carica contro una sequoia"
        descrizione: "Davanti alla sequoia più grossa, spostandoti all'ultimo, le zanne possono restare nel legno."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Le zanne nel legno
          testo: |
            Ti metti con la schiena contro la sequoia più grossa e aspetti. Quando
            la bestia carica ti butti di lato all'ultimo momento, e le zanne
            entrano nel legno fino alla radice con uno schianto che fa piovere aghi
            su tutta la radura. «Fermo, fermo» le dice Corin come a un cavallo,
            arrivandole a cinque passi con il tubo alzato, e il lampo la prende
            alla base del collo.
          effetti: { pista.corin: 1, racconto: 1 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: La zanna
          testo: |
            Ti butti di lato troppo presto, e il cinghiale corregge la carica. La zanna
            ti prende al fianco e ti sbatte contro la sequoia. Mentre sei a terra la
            bestia incastra una zanna in una radice, e Corin le tira a bruciapelo a
            occhi chiusi, con un lampo che ti brucia la manica. La bestia non si
            rialza, e tu per un bel pezzo nemmeno.
          effetti: { pista.corin: 1, ferite: 3 }
          segue: foresta-il-puma-nero
      - testo: "Prendere tu l'arma dei Precursori"
        descrizione: "Corin la tiene come un mazzo di fiori, e l'impugnatura è fatta per un'altra mano."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: Il lampo
          testo: |
            Corin ti passa il tubo con sollievo. L'impugnatura è troppo larga e lo
            incastri sotto l'ascella come un remo, mentre il cristallo ronza
            sempre più acuto e il cinghiale abbassa la testa. Capisci che il colpo
            parte quando il ronzio si ferma. Si ferma a venti passi, e il filo di
            luce entra nel petto della bestia, che finisce la carica da sola ai
            tuoi piedi.
          pe: { tecnologia: 8 }
          effetti: { pista.corin: 1, racconto: 1, ferite: 0.5 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: Il ronzio
          testo: |
            Tieni il tubo come una balestra e cerchi un grilletto che non esiste.
            Il ronzio si ferma quando hai già le zanne sotto il braccio, e il lampo
            parte verso il cielo spaccando il ramo più alto di una sequoia. Il ramo
            cade sulla schiena del cinghiale e lo inchioda il tanto che basta a
            Corin per riprendersi il tubo e aspettare la seconda carica.
          effetti: { pista.corin: 1, ferite: 2.5 }
          segue: foresta-il-puma-nero
      - testo: "Tenerlo lontano da Corin finché l'arma non è carica"
        descrizione: "Un ramo di resina acceso e il tuo corpo in mezzo, finché Corin non ha caricato."
        costo: 2
        esito:
          titolo: Il tempo di una carica
          testo: |
            Accendi un ramo di resina e ti metti fra la bestia e Corin, e il fuoco
            la ferma una volta. La seconda il cinghiale ti passa sopra e senti
            qualcosa nel petto che si sposta. La terza ti lancia contro un tronco,
            e mentre ti rialzi il cristallo smette di ronzare e il lampo apre il
            fianco alla bestia, che crolla a quattro passi da te.
          effetti: { pista.corin: 1, ferite: 3, tormento: 1 }
          segue: foresta-il-puma-nero
      - testo: "Farti dare l'arma, da Raschiatore"
        descrizione: "Corin l'ha comprata da uno dei tuoi, e sulle piattaforme hai visto smontare cose simili."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: La tacca d'ottone
          testo: |
            Ti fai dare il tubo. Sul bordo della camera di cristallo c'è una tacca
            d'ottone, e sulle piattaforme hai sentito un vecchio Raschiatore
            spiegare che il colpo parte un attimo dopo che la tacca smette di
            vibrare. Pianti il calcio contro una radice e aspetti con il pollice
            sulla tacca. Quando il cinghiale carica la tacca si ferma, e il filo di
            luce gli entra nel petto a venti passi.
          pe: { tecnologia: 8 }
          effetti: { pista.corin: 1, racconto: 1 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: La tacca che vibra
          testo: |
            La tacca vibra ancora quando il cinghiale è a dieci passi, e tu aspetti
            un momento di troppo. Il lampo gli apre una spalla senza fermarlo, e la
            zanna ti prende alla coscia. Corin raccoglie il tubo e aspetta la
            seconda carica guardando anche lui la tacca, e la bestia cade a quattro
            passi da voi.
          effetti: { pista.corin: 1, ferite: 2 }
          segue: foresta-il-puma-nero
      - testo: "Contare il Mana nel cristallo, da allievo di Torvessa"
        descrizione: "La camera di cristallo ronza come i cristalli dell'Accademia quando si caricano."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [magia, accademiche], difficolta: Difficile }
        successo:
          titolo: L'ultima ondata
          testo: |
            Ti fai dare il tubo e appoggi due dita sulla camera di cristallo, come
            sul banco dell'Accademia. Il Mana ci sale dentro a ondate, ognuna più
            alta della precedente, e le conti mentre il cinghiale raspa la terra.
            L'ultima si ferma in cima come l'acqua sul bordo di un catino quando
            la bestia è a venti passi, e il filo di luce le entra nel petto.
          pe: { magia: 8 }
          effetti: { pista.corin: 1, racconto: 1, ferite: 0.5 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: Il conto a metà
          testo: |
            Conti le ondate di Mana, ma il cinghiale carica prima che tu arrivi in
            fondo. Il colpo parte mentre ti butti di lato e gli brucia la spalla
            senza fermarlo, e una zanna ti apre la coscia fino al ginocchio. Corin
            ti strappa il tubo dalle mani e aspetta la seconda carica con gli
            occhi sbarrati, e la bestia cade a cinque passi da voi.
          effetti: { pista.corin: 1, ferite: 2.5 }
          segue: foresta-il-puma-nero
      - testo: "Piantarti davanti alla sequoia e non scappare"
        descrizione: "Da Ghoran sei già scappato una volta, e una sequoia non si sposta."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza, intimidire], difficolta: Difficile }
        successo:
          titolo: Fermo
          testo: |
            Ti pianti contro la sequoia più grossa e gridi alla bestia con la voce
            dei sorveglianti di Ghoran, quella che ti piegava le spalle. Resti
            fermo finché senti il suo fiato, poi ti lasci cadere di lato e le
            zanne entrano nel legno fino alla radice. Corin arriva a cinque passi
            dalla bestia incastrata, e il lampo la prende alla base del collo.
          effetti: { pista.corin: 1, racconto: 1 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: Le gambe ferme
          testo: |
            Ti pianti contro la sequoia e gridi, ma le gambe restano ferme un
            momento di troppo, come allora sulla bilancia, e la zanna ti prende al
            fianco. La sequoia la incontri con la schiena. Mentre sei a terra la
            bestia incastra una zanna in una radice, e Corin le tira a bruciapelo
            a occhi chiusi, con un lampo che ti brucia la manica.
          effetti: { pista.corin: 1, ferite: 3 }
          segue: foresta-il-puma-nero

  # ------------------------------------------------------------ il seguito · il puma nero (torna in città)
  - id: foresta-il-puma-nero
    immagine: bestiario/braska
    titolo: Il puma nero
    tipo: seguito
    luogo: Foresta Strisciante, la radura interna
    area: foresta-strisciante
    requisiti: [pista.corin == 3, braska == 0]
    testo: |
      Il cinghiale è a terra, e ti siedi su una radice senza averlo deciso. Poi dal margine degli
      alberi esce un puma.

      È più grande di quello morto e ha il manto nero, attraversato da vene color brace che si
      accendono e si spengono piano, e sotto le zampe gli si alzano piccole scintille arancioni.
      Attraversa la radura senza guardare il cinghiale, va dritto al compagno caduto e gli abbassa il
      muso sul collo. Quando alza gli occhi, color ambra, li gira verso di te.

      {magia Media} Le vene color brace si accendono e si spengono con il suo fiato. È Mana, e scorre
      dentro la bestia quieto, senza la fretta della Marea.

      {origine accolito-del-velo} Da qui senti sul viso lo stesso tepore che usciva dai palmi di Padre
      Vantes nella tenda dei feriti.

      Corin tiene la balestra scarica contro il petto e muove le labbra senza voce. *Quello morto era
      il suo compagno, e lui è venuto a salutarlo.* Il puma fa un passo nella tua direzione.
    opzioni:
      - testo: "Avvicinarti di lato, con gli occhi bassi"
        descrizione: "Piano e di fianco, senza fissarlo negli occhi, come ci si avvicina a un predatore sazio."
        requisiti: [natura >= 2]
        costo: 0
        esito:
          titolo: Un nome
          testo: |
            Ti avvicini di lato a passi corti, con gli occhi sull'erba. Il puma
            allunga il muso caldo verso le tue dita, e vedi il sottobosco
            dall'altezza di un ginocchio, con il puma color brace che ti corre
            davanti. Quando torna fra gli alberi ti resta in testa il nome Braska.
            Al Ponte del Conciatore Corin fa venire un carro per il cinghiale e ti
            aspetta domani sera al Grifone.
          imposta: { braska: 2 }
          vai: ponti-sospesi
      - testo: "Tendergli la mano bassa e aperta"
        descrizione: "Come a un cavallo che non ti conosce, lasciando che sia lui a decidere."
        requisiti: [addestrare-animali >= 2]
        costo: 0
        esito:
          titolo: La mano
          testo: |
            Ti abbassi su un ginocchio e tendi la mano aperta, il palmo in giù, come
            con i cavalli nuovi. Il puma viene avanti e ti passa sotto la mano la
            testa intera, calda come una pietra al sole, e se ne va lasciandoti un
            nome che nessuno ha pronunciato, Braska. Al Ponte del Conciatore Corin
            fa venire un carro per il cinghiale e ti aspetta domani sera al Grifone.
          imposta: { braska: 2 }
          vai: ponti-sospesi
      - testo: "Restare fermo e lasciarlo andare"
        descrizione: "È il suo bosco, e oggi ha già perso abbastanza."
        costo: 0
        esito:
          titolo: Gli occhi d'ambra
          testo: |
            Resti fermo con le mani lungo i fianchi, e il puma ti guarda a lungo.
            Gli occhi d'ambra si spostano su Corin e sul cinghiale, poi torna fra
            gli alberi senza fretta, con le scintille che si spengono nel
            sottobosco. Corin si siede per terra di colpo. Al Ponte del Conciatore
            fa venire un carro per il cinghiale e ti aspetta domani sera al
            Grifone.
          imposta: { braska: 1 }
          vai: ponti-sospesi
      - testo: "Salutarlo come si saluta al Circolo"
        descrizione: "Al Circolo, davanti a una bestia che veglia un compagno, la testa la si abbassa per primi."
        quando: [origine.figlio-del-circolo >= 1]
        costo: 0
        esito:
          titolo: La testa bassa
          testo: |
            Ti inginocchi nell'erba e abbassi la testa, con le parole del Circolo
            in bocca senza voce. Il puma viene avanti e senti il suo fiato caldo
            sulla nuca, e quando rialzi gli occhi sta tornando fra gli alberi. Ti
            resta in testa un nome che nessuno ha detto, Braska. Al Ponte del
            Conciatore Corin fa venire un carro per il cinghiale e ti aspetta
            domani sera al Grifone.
          imposta: { braska: 2 }
          effetti: { tormento: -0.5 }
          vai: ponti-sospesi
      - testo: "Benedire il puma caduto"
        descrizione: "Il Velo benedice i morti, ma su come si benedice una bestia nessuno ti ha dato una regola."
        quando: [origine.accolito-del-velo >= 1]
        costo: 0
        prova: { attributo: mentale, abilita: [magia, empatia], difficolta: Media }
        successo:
          titolo: La Benedizione
          testo: |
            Ti inginocchi accanto al puma caduto e dici la Benedizione, come te
            l'ha insegnata Vantes, con il calore che ti scende dal palmo sulla
            pelliccia. Il puma nero ti lascia finire, poi ti fiuta la mano, e
            quando torna fra gli alberi ti resta in testa il nome Braska. Al Ponte
            del Conciatore Corin fa venire un carro per il cinghiale e ti aspetta
            domani sera al Grifone.
          imposta: { braska: 2 }
          vai: ponti-sospesi
        fallimento:
          titolo: Le parole impastate
          testo: |
            Cominci la Benedizione accanto al puma caduto, ma a metà le parole ti
            si impastano, proprio dove Vantes ti diceva di fare una pausa. Il puma
            nero ti guarda in silenzio fino all'ultima parola sbagliata e torna
            fra gli alberi. Al Ponte del Conciatore Corin fa venire un carro per
            il cinghiale, e lungo la strada ti chiede due volte che cosa stavi
            dicendo.
          imposta: { braska: 1 }
          vai: ponti-sospesi
          effetti: { tormento: 0.5 }
