# La caccia di Corin, la spedizione nella Foresta Strisciante (pista.corin 2 → 3).
# Si parte dalle Scuderie della Zanna Rotta in Città Bassa. Nella foresta le stanze vanno in ordine,
# secondo la profondità: 0 a cavallo lungo il fiume (le domande di Corin o gli Spiumatori), 1 ancora
# quelle due oppure l'impronta, dove si trova la pista; da 2 a 4 sulla pista (le carcasse, la parete, il
# sottobosco; la fossa solo a 2 e 3, lontano dalla radura). Poi il cuore nella radura, che porta a 3.
# Dopo il cinghiale compare il puma nero (seguito), ed è lì che la scena finisce e si torna ai Ponti
# Sospesi. Una stanza superata non ricompare nella stessa visita (src/motore/spedizioni.ts); le domande
# di Corin e la fossa spariscono anche dopo un fallimento, con le due flag qui sotto.
quality:
  - { id: foresta.domande, nome: Corin ti ha già fatto le sue domande, categoria: stato, nascosta: true, descrizione: "1 se il racconto a Corin è andato male, e in questa visita non te lo richiede." }
  - { id: foresta.fossa, nome: Sei caduto nella fossa di cattura, categoria: stato, nascosta: true, descrizione: "1 se sei caduto nella fossa, e in questa visita la trappola è già scattata." }

aree:
  - id: foresta-strisciante
    immagine: ambientazione/foresta-strisciante
    nome: Foresta Strisciante
    sommario: "Una striscia di sequoie e abeti sulla riva sud del Torvessa, due chilometri a ovest della città, sotto la scarpata del Gradone Rosso. Il nome gliel'hanno dato i vermi carogna."
    spedizione: { ritorno: superficie-fratturata, soglia: 5, stanze: 3 }
    testo: |
      La Foresta Strisciante comincia due chilometri a ovest della città,
      oltre il Ponte del Conciatore e una fila di collinette spezzate dove
      crescono pini ed eucalipti radi, piantati lì da qualcuno che poi deve
      aver cambiato idea. È una striscia di bosco lunga e stretta, chiusa fra
      la riva sud del Torvessa e la scarpata del Gradone Rosso, che a sud
      sale brulla e color mattone. Dentro ci sono abeti e sequoie, e alcune
      sequoie sono così larghe che per abbracciarle servirebbero quattro
      uomini e un po' di confidenza.

      Fra le radici crescono felci alte fino al ginocchio e funghi che non
      vedono mai il sole, e il terreno è morbido di aghi. Il nome al bosco
      l'hanno dato i vermi carogna, che vivono sotto le radici delle sequoie e
      vengono su quando c'è da mangiare. Al Ponte dicono che prima lo
      chiamavano soltanto il bosco oltre il Ponte.

      Corin Ashdale cavalca accanto a te con le redini tenute troppo corte e
      la schiena dritta da lezione di equitazione. Ogni tanto si gira a
      guardarti, e non capisci se controlla che tu sia ancora lì o se studia
      come tieni le mani. *Sta imparando qualcosa, e ha scelto te come libro.*
      Dal fiume arriva un odore di fango e di menta selvatica, e il cavallo
      allunga il collo verso l'acqua.

storylet:
  # ------------------------------------------------------------ 2 · la partenza (apre la spedizione)
  - id: verso-la-foresta-strisciante
    presso: scuderie-della-zanna-rotta
    immagine: ambientazione/scuderie-della-zanna-rotta
    titolo: Verso la Foresta Strisciante
    sommario: "Corin ti aspetta davanti alle Scuderie della Zanna Rotta con i cavalli sellati. La foresta è a ovest, oltre il Ponte del Conciatore."
    luogo: Città Bassa, davanti alle Scuderie della Zanna Rotta
    area: citta-bassa
    requisiti: [pista.corin == 2]
    testo: |
      Davanti alle Scuderie della Zanna Rotta c'è odore di fieno bagnato e di
      cuoio ingrassato, un odore onesto che in Città Bassa è diventato raro.
      Sopra la porta l'insegna mostra un cavallo da guerra che pianta gli
      zoccoli sulla schiena di un orco, dipinto con una cura per i dettagli
      che fa pensare a una faccenda personale. Dolovan Stroud è sulla soglia
      con un secchio in mano. Ti guarda passare senza salutare, poi dice
      qualcosa al cavallo più vicino a voce bassa e gentile, e il cavallo gli
      risponde soffiando.

      {origine figlio-della-citta-bassa} Sotto questa insegna ci passavi di
      corsa da bambino, perché nel vicolo si diceva che l'orco dipinto
      seguisse con gli occhi chi andava piano. Le gambe se lo ricordano
      ancora, e allungano il passo per conto loro.

      {addestrare-animali Media} Con le bestie Stroud usa la voce che con le
      persone tiene in tasca. Il baio con la cicatrice sulla spalla tiene le
      orecchie su di lui anche mentre mangia.

      Corin Ashdale ti aspetta in mezzo al cortile, vestito per la caccia come
      se l'avesse imparato su un libro, con gli stivali nuovi che ancora
      scricchiolano e una balestra a tracolla dal calcio intarsiato di
      madreperla. *Quella balestra non ha mai tirato a niente che respiri.* Ha
      le occhiaie scure. Al Grifone dicono che dorme male dalla notte della
      razzia, da quando gli orchi gli hanno ammazzato il cane.

      «Eccoti! Temevo che ci avessi ripensato.» Ride per primo, come fa sempre
      quando è imbarazzato. «Il signor Stroud dice che il cinghiale grosso sta
      nella Foresta Strisciante, vicino al fiume. Due chilometri appena. Beh,
      insomma, qualcosa di più.»

      {armi-da-distanza Facile} La corda della balestra è tesa da stamattina,
      e il legno ringrazia poco. Se la tiene così fino al bosco, al momento
      buono tirerà corto.

      La strada va a ovest, oltre il Ponte del Conciatore. Il nome gli viene
      dagli scarti delle concerie che ci buttavano sotto fino a sessant'anni
      fa, e le assi hanno ancora un odore che ti fa respirare con la bocca.
      Sul ponte c'è una ronda della Guardia, e il sergente guarda prima la
      balestra di Corin e poi te, e si gratta la barba senza dire niente.
    opzioni:
      - testo: "Partire sul baio delle Scuderie"
        descrizione: "Il baio con la cicatrice, pagato da Corin per la giornata. Ti conosce da poco, e va al passo."
        costo: 1
        esito:
          titolo: Il baio di Stroud
          testo: |
            Il baio con la cicatrice sulla spalla si lascia montare senza storie,
            poi decide da solo che si va al passo e non c'è verso di fargli cambiare
            idea. I talloni gli fanno lo stesso effetto di un consiglio non
            richiesto. Corin ogni tanto si volta ad aspettarti, e ogni volta te ne
            chiede scusa, come se la lentezza fosse colpa sua. Seguite la riva sud
            del Torvessa per mezz'ora, con la scarpata rossa del Gradone sulla
            sinistra, finché le collinette non si aprono e davanti a voi compare il
            bosco, scuro di abeti.
          imposta: { foresta.domande: 0, foresta.fossa: 0 }
          vai: foresta-strisciante
      - testo: "Partire sul tuo cavallo"
        descrizione: "Il baio di Stroud resta nella stalla. Il tuo cavallo ti conosce, e corre volentieri."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il tuo cavallo
          testo: |
            Il tuo cavallo ti riconosce dall'odore e ti spinge la spalla con il muso
            prima ancora che tu monti, e la mano ti va da sola a grattargli il
            collo. Corin lo guarda con un'invidia da bambino e chiede a Stroud se ne
            ha uno uguale da vendere, e Stroud risponde di no senza staccargli gli
            occhi di dosso. «Lo sapevo che eravate gente seria» dice Corin, e sprona
            il suo con un entusiasmo che il suo cavallo non condivide. Seguite la
            riva sud del Torvessa al trotto, sotto la scarpata del Gradone Rosso, e
            arrivate al limitare del bosco con le gambe ancora fresche e Corin senza
            fiato, rosso in faccia per la contentezza.
          imposta: { foresta.domande: 0, foresta.fossa: 0 }
          vai: foresta-strisciante
      - testo: "Mettere in riga il baio, come nei Quartieri Alti"
        descrizione: "Le lezioni di equitazione che ti hanno fatto da ragazzo, nei salotti, non sono mai servite a niente. Con un baio testardo potrebbero servire."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        costo: 1
        esito:
          titolo: Le ginocchia
          testo: |
            Il baio con la cicatrice prova a decidere da solo che si va al
            passo, e tu glielo lasci credere per un centinaio di passi. Poi
            stringi le ginocchia e accorci le redini di un dito, con il gesto
            che nei Quartieri Alti si impara insieme alle buone maniere, e lui
            si mette al trotto con l'aria di averci pensato da sé. Corin ti
            guarda la schiena e raddrizza la sua. Seguite la riva sud del
            Torvessa sotto la scarpata rossa del Gradone, finché le collinette
            non si aprono e davanti a voi compare il bosco, scuro di abeti.
          imposta: { foresta.domande: 0, foresta.fossa: 0 }
          vai: foresta-strisciante

  # ------------------------------------------------------------ le stanze (ripetibili, tre a caso)
  - id: foresta-le-domande-di-corin
    immagine: personaggi/corin-ashdale
    titolo: Le domande di Corin
    sommario: "Corin cavalca accanto a te e vuole sapere chi sei e da dove vieni, e come si diventa quello che sei."
    luogo: Foresta Strisciante, lungo il fiume
    area: foresta-strisciante
    ripetibile: true
    # Corin parla di Ottone come di un nemico ancora in Consiglio: non dopo l'arresto (pista.pelle 5).
    requisiti: [pista.corin == 2, profondita.foresta-strisciante <= 1, foresta.domande == 0, pista.pelle < 5]
    testo: |
      Lungo il fiume i cavalli vanno al passo, e Corin ne approfitta per
      parlare. Ti racconta della Gilda dei Mercanti, che secondo lui è il
      cuore della città e ogni tanto pompa sangue sporco. Di Ottone Malgrani
      dice che è un cancro con i baffi perfettamente in ordine, e subito dopo
      ride per primo e si guarda intorno, anche se qui ad ascoltarlo ci sono
      soltanto gli abeti.

      {politica-ed-economia Media} Un Ashdale che parla male di un Malgrani in
      mezzo al bosco è uno che in Consiglio non ha il coraggio di farlo. O che
      ha imparato che lì le pareti ascoltano.

      {origine rampollo-dei-quartieri-alti} Alle tavole dei Quartieri Alti i
      Malgrani si nominano dopo il dolce, e a voce bassa. Corin lo fa a metà
      mattina e a voce piena, e la parte di te cresciuta a quelle tavole si
      guarda intorno insieme a lui.

      «Ma basta con me. Tu, piuttosto.» Si sporge sulla sella verso di te, e
      il cavallo sbanda di lato. «Chi sei, da dove vieni? E come si fa,
      insomma, a diventare uno che si mette fra la gente e gli orchi? Me lo
      chiedo da giorni, e detta ad alta voce mi sembra una domanda stupida.»
      Ha le orecchie rosse.

      {empatia Facile} Più che una storia vuole sapere se c'è speranza anche
      per lui, e si vergogna di chiederlo così.
    opzioni:
      - testo: "Raccontargli la verità, senza abbellirla"
        descrizione: "Anche le parti in cui avevi paura."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Media }
        successo:
          titolo: Senza abbellimenti
          testo: |
            Gli racconti com'è andata davvero, con dentro anche la paura e le cose
            fatte male che sono finite bene per caso. Mentre parli ti accorgi che è
            la prima volta che la dici tutta in fila, e che detta così fa meno male.
            Corin ascolta senza interromperti, e in tutta la mattina è la prima
            volta. Alla fine annuisce piano. «Allora basta restare lì» dice, e lo
            ripete a mezza voce per sentire come suona. Per un po' cavalca in
            silenzio, e intanto il fiume vi porta più dentro il bosco di quanto ti
            fossi accorto.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: L'odore del fumo
          testo: |
            Cominci a raccontare della razzia e a metà ti accorgi che le mani ti
            sudano sulle redini e che senti di nuovo l'odore del fumo. Ti fermi.

            {resilienza Media fallita} Il fumo è solo un ricordo, lo sai benissimo.
            Il naso, a quanto pare, è rimasto a quella notte.

            Corin aspetta, poi prova a riempire il silenzio con una storia sua, un
            carico di spezie andato a male a Laresh, e la racconta fino in fondo
            anche se nessuno dei due la sta ascoltando. Quando alzi gli occhi siete
            ancora allo stesso gomito del fiume.
          effetti: { tormento: 0.5 }
          imposta: { foresta.domande: 1 }
      - testo: "Raccontargli la versione da locanda"
        descrizione: "Un orco in più e un po' meno paura. Corin ha voglia di un eroe, e tu puoi dargliene uno."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: La versione da locanda
          testo: |
            Gli racconti la razzia come la racconterebbero al Grifone dopo il terzo
            boccale, con un orco in più e un po' meno paura. Corin beve ogni parola,
            e tu scopri con un certo disagio che ti viene benissimo. A un certo
            punto ti chiede di ripetere la frase che hai detto all'orco prima di
            colpirlo, e se la ripete a mezza voce per tutto il tragitto, provando
            dove mettere le pause. Quando trova quella giusta è contento come un
            bambino, e il bosco intanto si è fatto più fitto.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Un orco di troppo
          testo: |
            A metà racconto aggiungi un orco e poi un altro, e Corin aggrotta la
            fronte. «Strano» dice, gentile. «Io quella sera ero lì con il naso nel
            fango, e me ne ricordavo meno. Ma avevo il naso nel fango.» Per tutta la
            strada non ti contraddice più, e ogni tanto ti guarda di lato con molta
            gentilezza, che è peggio di qualunque contraddizione. Le orecchie ti
            bruciano fino al gomito successivo del fiume.
          effetti: { tormento: 0.5 }
          imposta: { foresta.domande: 1 }
      - testo: "Parlargli da mercante a mercante"
        descrizione: "Hai anche tu la licenza della Gilda, e sai di cosa si lamenta un mercante quando cavalca."
        requisiti: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Da mercante a mercante
          testo: |
            Gli chiedi dei dazi sul Ponte delle Mille Corde, e a Corin si illumina
            la faccia. Per mezz'ora parlate di pesi e di gabelle e di chi, alla Casa
            dei Nodi, firma i permessi senza leggerli, e lui ti fa i nomi di due
            Custodi di Passaggio che accettano regali. «Questo non l'hai sentito da
            me» dice, e poi lo ripete, nel caso, guardando un abete con sospetto.

            {conoscenze-della-strada Facile} Due Custodi che accettano regali, detti
            da un Ashdale a uno sconosciuto in mezzo a un bosco. Domani a quei due
            conviene cambiare gusti.

            Intanto il fiume vi ha portati parecchio avanti.
          effetti: { profondita.foresta-strisciante: 1, informazioni.voce: 1 }
      - testo: "Dirgli di Ghoran"
        descrizione: "Della bilancia su cui pesano gli schiavi, e di come ci sei sceso."
        requisiti: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La bilancia
          testo: |
            Gli racconti di Ghoran, della bilancia nel mercato e di come ti ci hanno
            fatto salire. Ti accorgi che lo dici con la voce piatta di un
            inventario, e che le spalle ti si sono alzate da sole. Corin ascolta con
            la bocca socchiusa, e quando hai finito dice che a Ghoran c'è stato una
            volta, per un carico di pelli, e che il mercato gli era sembrato
            pittoresco. Poi capisce cosa ha detto e diventa rosso fino al colletto.
            Per il resto della strada sta zitto, e ogni tanto ti passa la borraccia
            senza che tu gliel'abbia chiesta.
          effetti: { profondita.foresta-strisciante: 1 }
      - testo: "Lasciarlo parlare e annuire"
        descrizione: "Corin ha molte cose da dire sulla Gilda, e tu hai due orecchie."
        costo: 2
        esito:
          titolo: I dazi
          testo: |
            Annuisci, e Corin parla. Ti spiega i dazi sul grano e quelli sull'acqua
            purificata, poi il motivo per cui Ottone Malgrani lo odia, e poi il
            motivo per cui lui odia Ottone Malgrani, che è più lungo e ha delle note
            a margine. Il bosco vi scorre intorno senza che tu lo guardi. Quando
            finalmente si ferma siete molto più avanti, e a te ronzano le orecchie
            come dopo una notte alla Pignatta.
          effetti: { profondita.foresta-strisciante: 1, tormento: 0.5 }

  - id: foresta-gli-spiumatori
    immagine: ambientazione/gradone-rosso
    titolo: Gli Spiumatori
    sommario: "Ai piedi del Gradone Rosso due orchi accovacciati mangiano qualcosa. Hanno piume incollate nei capelli."
    luogo: Foresta Strisciante, sotto il Gradone Rosso
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante <= 1]
    testo: |
      Dove il bosco si avvicina alla scarpata del Gradone Rosso gli alberi si
      diradano su una spianata di sassi rossi. In mezzo ci sono due orchi
      accovacciati, magri, con le piume incollate ai capelli con la resina, e
      mangiano qualcosa che tengono con tutte e due le mani. Ti ci vuole un
      momento per capire che sono uccelli crudi grandi come gazze, e che le
      piume che girano nell'aria sono le loro. Lo stomaco ci arriva prima di
      te.

      {rissa Media} Il più magro tiene il peso sui talloni e non riuscirebbe
      ad alzarsi in fretta. L'altro ha un arco appoggiato al sasso, e la mano
      sinistra non se ne allontana mai.

      {origine fuggiasco-di-ghoran} Ai recinti di Ghoran i sorveglianti
      mangiavano accovacciati con tutte e due le mani. In quei momenti era
      meglio non passare loro davanti, e le spalle ti si curvano da sole
      come allora.

      Corin ti tocca il braccio, rosso in faccia. «Orchi!» dice in un sussurro
      che si sente fino al fiume. «Fantastico. Come procediamo?» Le tue mani
      sono già andate all'arma. Uno dei due orchi alza la testa e annusa
      l'aria, con un'ala che gli pende dalla bocca.

      {natura Facile} Il vento viene dal fiume e va verso di loro. Fra poco
      sapranno di cavallo e di Corin, che si è messo l'acqua di colonia per
      andare a caccia.
    opzioni:
      - testo: "Attaccarli prima che vi vedano"
        immagine: bestiario/orco
        descrizione: "Sono due orchi magri con la bocca piena."
        combattimento: spiumatori-al-gradone
        vittoria:
          titolo: Piume
          testo: |
            Il primo orco si alza con la bocca ancora piena e non fa in tempo a
            prendere l'arco. Il secondo combatte meglio, e scappa appena il compagno
            va giù, su per la scarpata a quattro zampe fra i sassi. Corin arriva
            quando è tutto finito, con la balestra carica e le mani che tremano, e
            guarda l'orco a terra con la bocca aperta. A te il cuore ci mette un
            pezzo a scendere dalla gola. Ti restano piume grigie attaccate
            dappertutto, anche dentro il colletto.
          effetti: { profondita.foresta-strisciante: 1 }
        sconfitta:
          titolo: Su per la scarpata
          testo: |
            Uno dei due ti colpisce con un sasso grosso come un pugno, e il mondo si
            inclina. Quando si raddrizza gli orchi sono già a metà della scarpata,
            con gli uccelli sotto il braccio, e Corin ti sta tamponando la fronte
            con un fazzoletto di seta ricamato, le sue iniziali proprio sopra il
            taglio. «Li abbiamo messi in fuga» dice, con molta buona volontà. Vi
            serve un pezzo per rimettervi in sella, e il sole intanto è salito sopra
            la scarpata.
      - testo: "Aggirarli sotto gli abeti"
        descrizione: "Sottovento, con i cavalli per la briglia. Basta non pestare niente."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Sottovento
          testo: |
            Porti il cavallo per la briglia sotto gli abeti, sottovento, mettendo i
            piedi sugli aghi e mai sui rami. Corin ti viene dietro trattenendo il
            fiato così a lungo che diventa paonazzo, e devi fargli segno di
            respirare. Gli orchi non alzano la testa dal loro pasto. Quando li hai
            lasciati alle spalle ti accorgi di avere piume grigie attaccate agli
            stivali, portate fin lì dal vento, e Corin ne raccoglie una e se la
            infila nel taschino.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Il ramo secco
          testo: |
            Il ramo secco lo pesti tu, e nel silenzio sembra uno schiocco di frusta.
            I due orchi scattano in piedi. Uno ti tira un sasso grosso come una
            prugna che ti prende sullo zigomo, e mentre ti tieni la faccia lui torna
            a sedersi e riprende a mangiare, come se avesse scacciato una mosca.
            Tornate indietro fra gli abeti con Corin che ti guarda lo zigomo e dice
            che si vede appena.
          effetti: { ferite: 0.5 }
      - testo: "Avvicinarti con le mani aperte"
        descrizione: "Hanno le piume incollate nei capelli e stanno mangiando. Chi mangia, di solito, ha poca voglia di litigare."
        prova: { attributo: sociale, abilita: [empatia, intimidire], difficolta: Media }
        successo:
          titolo: Mezzo uccello
          testo: |
            Esci allo scoperto piano e ti accovacci a dieci passi da loro, come
            stanno accovacciati loro, con le mani bene in vista e le ginocchia che
            protestano. L'orco più vecchio ti guarda a lungo masticando. Poi
            grugnisce e ti tende mezzo uccello. Lo prendi, e per fortuna basta
            tenerlo in mano.

            {empatia Media} Il mezzo uccello è una domanda. Se lo tieni senza
            schifo, sei uno con cui si può mangiare.

            Quando indichi il bosco l'orco si porta due dita alla bocca a fare le
            zanne e sputa per terra, poi punta il mento verso ovest. Corin ha visto
            tutto e non riesce a chiudere la bocca.
          effetti: { profondita.foresta-strisciante: 1, informazioni.voce: 1 }
        fallimento:
          titolo: L'osso
          testo: |
            Esci allo scoperto con le mani aperte, e l'orco più grosso si alza con
            un grugnito che si capisce benissimo anche senza traduzione. Fai un
            passo indietro, e lui te ne fa fare un altro tirandoti un osso di
            uccello ancora sporco, che ti apre il labbro. Poi tutti e due tornano al
            loro pasto. Ti ritiri fra gli abeti succhiandoti il labbro, con il
            sapore del sangue e di qualcos'altro che preferisci non indagare, e
            Corin ti dice che sei stato molto coraggioso.
          effetti: { ferite: 0.5 }
      - testo: "Fare il giro largo lungo il fiume"
        descrizione: "Lontano dal Gradone, nell'acqua bassa. Gli orchi non vi vedranno, e i cavalli si bagneranno fino alla pancia."
        costo: 2
        esito:
          titolo: Nell'acqua bassa
          testo: |
            Scendete al fiume e lo risalite nell'acqua bassa, con i cavalli che
            affondano fino ai garretti e scivolano sui sassi. Il tuo a un certo
            punto si inginocchia, e tu finisci in acqua fino alla cintura. È gelata,
            e ti toglie il fiato. Corin ti offre il suo mantello, poi ci ripensa
            perché è di velluto, e poi te lo dà lo stesso. Quando tornate fra gli
            alberi gli orchi sono lontani e a te battono i denti.
          effetti: { profondita.foresta-strisciante: 1, ferite: 0.5 }

  - id: foresta-l-impronta
    immagine: ambientazione/foresta-strisciante
    titolo: L'impronta
    sommario: "Nel fango vicino a un ruscello c'è un'impronta di zoccolo larga come una scodella."
    luogo: Foresta Strisciante, vicino a un ruscello
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante == 1]
    testo: |
      Nel fango molle vicino a un ruscello c'è un'impronta di zoccolo con gli
      speroni ben marcati, larga quanto una scodella da fucina. Corin scende
      da cavallo per guardarla meglio e ci appoggia accanto la mano aperta,
      nel guanto di capretto. La mano è più piccola. Intorno all'impronta le
      felci sono schiacciate, e su un abete c'è una striscia di corteccia
      strappata all'altezza del tuo petto, bagnata di qualcosa di grigio.

      {natura Media} I cinghiali si strofinano agli alberi per grattarsi via
      il fango e i parassiti, all'altezza della spalla. Questa spalla ti
      arriva al petto.

      {origine figlio-del-circolo} Sotto l'odore del fango senti quello di
      ferro caldo e pelo bruciato che aveva la volpe abbattuta nel Bosco di
      Velthar quando eri bambino. La mano che andava verso l'abete torna
      indietro da sola.

      {resistenza Facile fallita} L'odore che sale dal grigio ti si attacca in
      fondo alla gola, e lo stomaco fa un piccolo passo indietro senza
      chiedere il permesso.

      Corin si pulisce il guanto sui calzoni anche se non l'ha sporcato.
      «Grande, eh? Beh, insomma, grande è grande» dice, e torna in sella.
    opzioni:
      - testo: "Leggere le tracce"
        descrizione: "Quanto pesa, da quanto è passato, dove va."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Sei quintali
          testo: |
            Ti accovacci accanto all'impronta e la misuri con il palmo. È lunga più
            di una spanna, il doppio di quella di un cinghiale normale, e affonda
            nel fango quanto basta per dirti che la bestia pesa sei quintali o poco
            più. Le impronte sono fresche e vanno verso il fondo della foresta, una
            ogni due passi d'uomo. Corin ripete «sei quintali» con un fischio basso
            e poi si guarda la mano, che continua a sembrargli piccola, e se la
            rimette in tasca.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Il grigio sulla corteccia
          testo: |
            Ti avvicini all'abete per guardare la sostanza grigia sulla corteccia e
            ci passi un dito. È densa e fredda, e ha l'odore della cenere bagnata.
            Il bosco ti gira intorno e devi appoggiarti al tronco, con un sapore di
            ferro in bocca e il dito che continua a sentire freddo anche dopo che te
            lo sei strofinato sui calzoni. Quando ti passa le impronte si sono
            confuse con quelle dei caprioli, e Corin ti sta offrendo la borraccia da
            un po'.
          effetti: { tormento: 0.5 }
      - testo: "Guardare dove i cavalli non vogliono andare"
        descrizione: "I cavalli sentono le bestie grosse prima di te."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: Le orecchie dei cavalli
          testo: |
            Lasci le redini lunghe e guardi i cavalli. Tutti e due hanno le orecchie
            girate verso le due sequoie a sud-ovest, e quando provi a mandare il tuo
            da quella parte punta gli zoccoli e sbuffa. È la direzione giusta,
            allora. Gli parli piano, con le cose senza senso che si dicono ai
            cavalli, finché non si convince a fare dieci passi e poi altri dieci, e
            oltre le sequoie ritrovi la pista. Corin, dietro di te, prende appunti
            su un taccuino con la copertina di cuoio.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Lo scarto
          testo: |
            Spingi il cavallo verso le sequoie per vedere come reagisce, e lui
            reagisce. Si impenna di colpo, e tu finisci di schiena fra le felci con
            le redini ancora in mano e il fiato che non torna. Sopra di te le cime
            degli abeti girano piano. Corin scende ad aiutarti e ti chiede se fa
            parte del metodo. Ci vuole un bel pezzo perché il cavallo smetta di
            tremare, e la schiena ti fa male per tutto il giorno.
          effetti: { ferite: 0.5 }
      - testo: "Seguire le felci schiacciate, un passo alla volta"
        descrizione: "La scia è larga, basta non perderla. Ci vorrà tutto il pomeriggio."
        costo: 2
        esito:
          titolo: Il bosco zitto
          testo: |
            Segui la scia di felci schiacciate a piedi, tirandoti dietro il cavallo,
            e su ogni tronco trovi la stessa striscia di grigio all'altezza del
            petto. Dopo un'ora ti accorgi che gli uccelli hanno smesso di cantare, e
            non sai da quanto. La nuca se n'era accorta prima di te. Anche Corin se
            ne accorge e si mette a fischiettare per fare rumore, finché non gli
            chiedi di smettere. Vai avanti con le tempie che pulsano.
          effetti: { profondita.foresta-strisciante: 1, tormento: 0.5 }

  - id: foresta-il-sottobosco
    immagine: ambientazione/foresta-strisciante
    titolo: Il sottobosco
    sommario: "Le tracce entrano in una macchia così fitta che i cavalli si rifiutano di seguirle."
    luogo: Foresta Strisciante, nel sottobosco
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante >= 2, profondita.foresta-strisciante <= 4]
    testo: |
      Le tracce entrano in una macchia di rovi e viticci così fitta che la
      luce ci arriva a chiazze, e i cavalli puntano gli zoccoli e non ne
      vogliono sapere. Li legate a un abete, e tornerete a prenderli facendo
      il giro della macchia. Il cinghiale ci è passato in mezzo come un carro,
      e dietro di sé ha lasciato un corridoio di rami spezzati che si è già
      richiuso a metà.

      {acrobazia Media} Il corridoio è alto quanto il cinghiale, cioè quanto
      la tua cintura. Si passa di traverso, con le spalle basse e il peso
      sulle punte.

      Corin si toglie il mantello, lo piega con cura e lo appende a un ramo.
      Poi ci ripensa e se lo rimette. «Ho letto che i cacciatori veri vanno
      avanti carponi» dice, e aggiunge che spera fosse un libro serio.

      {percezione Media} Lungo il margine della macchia, a una ventina di
      passi, i rovi fanno una piccola gobba regolare, come sopra un passaggio
      battuto da bestie piccole.
    opzioni:
      - testo: "Passare dove è passato lui"
        descrizione: "Il corridoio che ha aperto c'è ancora, almeno in parte."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il corridoio
          testo: |
            Ti infili di traverso nel corridoio di rami spezzati che ha lasciato il
            cinghiale, e dove si richiude passi sotto a quattro zampe. I viticci ti
            si attaccano alle maniche e li lasci fare, perché tirare peggiora tutto.
            Dietro di te Corin avanza carponi come ha letto sul libro, e ogni tanto
            ti chiede se lo sta facendo bene. Sbucate dall'altra parte coperti di
            foglie, e lui ha l'aria più felice che gli hai visto da stamattina.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: I viticci
          testo: |
            A metà strada un viticcio ti si stringe intorno alla caviglia e un altro
            al collo, e più ti agiti più stringono. Il panico ti sale nelle braccia
            prima che nella testa. Quando finalmente ne esci, a ritroso, hai una
            spina conficcata nella guancia e un graffio lungo il collo che brucia.
            Corin ti aspetta all'imbocco con il mantello ripiegato sul braccio, e ti
            dice che da fuori sembrava andare bene.
          effetti: { ferite: 0.5 }
      - testo: "Cercare il passaggio dei caprioli"
        descrizione: "Una macchia così grande ha per forza un sentiero, se sai dove guardare."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il passaggio dei caprioli
          testo: |
            Lungo il margine della macchia trovi quello che cercavi, un tunnel basso
            fra i rovi con il terreno battuto e qualche ciuffo di pelo castano
            impigliato alle spine. Ci passano i caprioli da anni, e ne hanno fatto
            una strada più ordinata di metà dei vicoli della Città Bassa. Lo
            percorri piegato in due, e Corin dietro di te batte la testa due volte
            contro lo stesso ramo e si scusa tutte e due le volte. Sbucate oltre la
            macchia proprio dove riprende la pista del cinghiale.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Tutti uguali
          testo: |
            Giri intorno alla macchia cercando un varco, e dopo un'ora ti accorgi
            che gli abeti sono tutti uguali e che il sole è dalla parte sbagliata.
            Ti si stringe lo stomaco, piano. Corin ti segue senza fare domande, e tu
            non hai il coraggio di dirgli che vi siete persi. Ritrovi il punto da
            cui eri partito grazie a un fazzoletto di seta che lui aveva legato a un
            ramo per segnarlo, senza dirtelo.
          effetti: { tormento: 0.5 }
      - testo: "Aprirti la strada con la lama"
        descrizione: "Ci vuole tempo e ci vogliono braccia. Alla fine avrai le mani a pezzi."
        costo: 2
        esito:
          titolo: A colpi di lama
          testo: |
            Tagli rovi e viticci un colpo alla volta per un'ora buona, e la macchia
            si apre davanti a te con la lentezza di un pagamento della Gilda. Corin
            raccoglie i rami tagliati e li ammucchia in ordine ai lati, perché non
            gli viene in mente niente di più utile da fare, e ogni tanto li
            raddrizza. Quando passate dall'altra parte hai i palmi pieni di vesciche
            e le braccia che non si alzano più sopra le spalle.
          effetti: { profondita.foresta-strisciante: 1, ferite: 0.5 }

  - id: foresta-la-fossa
    immagine: ambientazione/foresta-strisciante
    titolo: La fossa di cattura
    sommario: "Dove il sottobosco si dirada, un mucchio di rametti è disposto un po' troppo in ordine."
    luogo: Foresta Strisciante, in una radura di felci
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante >= 2, profondita.foresta-strisciante <= 3, foresta.fossa == 0]
    testo: |
      Il sottobosco si dirada in una radura di felci basse, e sul terreno
      coperto di aghi le tracce del cinghiale si fanno difficili da seguire.
      Corin cammina davanti a te tenendo la balestra come un ombrello chiuso e
      ti racconta di una locanda di Laresh dove servono le lumache nel miele.
      A te viene fame lo stesso, cosa di cui non vai fiero.

      Più avanti, fra due abeti, c'è un mucchio di rametti e di tronchetti
      coperto di foglie, e le foglie sono un po' troppo in ordine per un bosco
      dove nessuno fa le pulizie.

      {percezione Media} Sotto il mucchio il terreno è più scuro, il colore
      della terra smossa da poco. E gli abeti ai lati sono troppo vicini
      perché una bestia grossa passi altrove.

      {conoscenze-della-strada Difficile fallita} Ti viene in mente un trucco
      delle bische della Città Bassa, il tavolo ordinato messo apposta davanti
      alla porta sbagliata. Poi Corin dice «miele» e il pensiero se ne va.
    opzioni:
      - testo: "Guardare dove metti i piedi"
        descrizione: "Quelle foglie le ha messe lì qualcuno."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La rete di rami
          testo: |
            Ti fermi, e afferri Corin per il colletto un passo prima dei rametti.
            Sotto le foglie i tronchetti sono intrecciati a rete, e sotto la rete
            c'è il buio di una fossa da cacciatori profonda quattro metri, con i
            pali appuntiti sul fondo. Corin guarda giù e diventa bianco. Ti
            ringrazia due volte, e la seconda volta ti stringe la mano con la sua,
            che è sudata dentro il guanto. Su uno dei pali qualcuno ha inciso le
            lettere D e S, ormai annerite dall'umido.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Il terreno che cede
          testo: |
            Tieni gli occhi sulla pista, e quando appoggi il peso sul mucchio di
            rametti senti il terreno che se ne va. I rami si aprono sotto di te come
            una botola, e dal buio sale un odore di terra bagnata e di legno marcio.
            Le braccia si allargano da sole, in cerca di qualcosa a cui attaccarsi,
            e lo stomaco resta lassù con Corin.
          imposta: { foresta.fossa: 1 }
          segue: foresta-la-fossa-caduta
      - testo: "Tenere Corin per la cintura e tastare il terreno con un ramo"
        descrizione: "Lento e faticoso. Corin non sta mai dietro a nessuno per molto."
        costo: 2
        esito:
          titolo: La cintura di Corin
          testo: |
            Procedi a tastoni con un ramo lungo, tenendo Corin per la cintura perché
            non ti passi davanti, e lui ti passa davanti lo stesso, con una specie
            di talento. Il terreno gli cede sotto un piede, e tu lo tiri indietro
            mentre i rami spariscono nel buio di una fossa da cacciatori. La spalla
            ti scricchiola. Corin si siede per terra a guardare la fossa. Poi ti
            ringrazia tre volte, e ogni volta un po' più piano.
          effetti: { profondita.foresta-strisciante: 1, ferite: 0.5 }

  - id: foresta-la-fossa-caduta
    immagine: ambientazione/foresta-strisciante
    titolo: Nella fossa
    tipo: seguito
    luogo: Foresta Strisciante, dentro la fossa di cattura
    area: foresta-strisciante
    requisiti: [pista.corin == 2]
    testo: |
      Cadi. La fossa è profonda due volte la tua altezza, e in fondo ci sono i
      pali appuntiti piantati anni fa da un cacciatore, neri di muffa ma
      ancora dritti. Sulla parete di terra si vedono i segni degli zoccoli di
      un capriolo che ha provato a risalire. A un braccio dalla tua mano
      sporge dalla parete di terra una radice d'abete grossa come un polso. Da
      sopra arriva la voce di Corin, che grida il tuo nome e poi, a corto di
      idee, anche il suo.

      {acrobazia Facile} La radice è a portata, se il braccio parte adesso.
      Fra un momento sarà sopra di te.

      {medicina Media} I pali sono marci di muffa, e una ferita aperta da
      quella roba fa più danno dopo che subito.
    opzioni:
      - testo: "Afferrare la radice"
        descrizione: "È lì. Bisogna prenderla al primo colpo."
        costo: 0
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La radice
          testo: |
            Le dita si chiudono sulla radice e la spalla ti dà uno strappo che senti
            fino ai denti, ma tieni. Resti appeso sopra i pali, con la terra che ti
            piove negli occhi, finché Corin non si sdraia sull'orlo e ti allunga la
            cinghia della balestra. Ti tira su con più coraggio che braccia, gemendo
            per lo sforzo come una porta. Restate seduti per terra tutti e due a
            respirare, e intanto la pista si è raffreddata.
        fallimento:
          titolo: In fondo alla fossa
          testo: |
            La radice ti scivola fra le dita e finisci in fondo alla fossa, fra i
            pali. Uno ti apre la coscia di striscio, un altro si spezza sotto il tuo
            peso, marcio, ed è per questo che sei ancora intero. Per un po' resti
            fermo a respirare l'odore della muffa e a contarti le gambe. Corin ti
            cala il mantello di velluto annodato alla cinghia della balestra, e ci
            metti un bel pezzo a risalire. Fuori ti fasci la gamba con una striscia
            di seta ricamata che lui ti porge senza dire niente.
          effetti: { ferite: 1 }
      - testo: "Lasciarti scivolare lungo la parete"
        descrizione: "Più lento, e meno pericoloso. Ti scorticherai le mani."
        costo: 0
        esito:
          titolo: Lungo la parete
          testo: |
            Ti giri verso la parete e ti lasci scivolare a pancia in giù con le mani
            e le ginocchia piantate nella terra. Arrivi in fondo con i palmi
            scorticati e i piedi fra due pali, a un dito dalle punte, e per un
            momento non osi spostare il peso. Corin ti cala il mantello annodato
            alla cinghia della balestra, e risalire ti prende quasi un'ora, durante
            la quale lui ti chiede scusa di continuo per una fossa che ha scavato
            qualcun altro.
          effetti: { ferite: 0.5 }
      - testo: "Piantare la lama nella parete, come sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice chi scivola non aspetta che la mano trovi un appiglio. La terra della fossa è morbida, e la lama ce l'hai alla cintura."
        quando: [origine.apprendista-raschiatore >= 1]
        costo: 0
        esito:
          titolo: Appeso alla lama
          testo: |
            La mano va alla cintura prima che la testa ci pensi, con un gesto
            delle piattaforme. Pianti la lama nella parete di terra fino
            all'elsa e ci resti appeso, con la spalla che protesta e i piedi a
            una spanna dalle punte dei pali. Da lì la radice è a portata, e
            risali una presa alla volta finché Corin non ti afferra per il
            colletto e ti tira fuori, gemendo per lo sforzo. Ti siedi sull'orlo
            a pulire la lama dalla terra, e intanto la pista si è raffreddata.

  - id: foresta-la-parete
    immagine: ambientazione/foresta-strisciante
    titolo: La parete di roccia
    sommario: "Le tracce fanno il giro di una parete di roccia alta tre uomini. In cima la pista è fresca."
    luogo: Foresta Strisciante, sotto la parete
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante >= 2, profondita.foresta-strisciante <= 4]
    testo: |
      Il bosco finisce contro una parete di roccia rossastra alta tre uomini,
      striata d'acqua, che scende dal Gradone Rosso come una costola. Le
      tracce del cinghiale piegano verso il fiume e fanno il giro largo, e in
      cima, dove la parete si spiana, vedi le felci schiacciate dal suo
      passaggio. La strada più corta per arrivarci passa dritta su per la
      roccia.

      {atletica Media} Dove l'acqua scava ci sono appigli, e a metà parete una
      crepa che va bene per una mano intera. Il resto lo fanno le gambe, se
      non ci pensi troppo.

      Corin guarda in su con la testa all'indietro finché il cappello non gli
      cade. «Io porto i cavalli dal giro lungo» dice, in fretta, mentre lo
      raccoglie. «Qualcuno deve pure pensare ai cavalli. Ci vediamo lassù.»

      {empatia Facile} Ha paura dell'altezza e lo sa nascondere malissimo. Lo
      ha detto in fretta per non dovertelo chiedere.
    opzioni:
      - testo: "Arrampicarti"
        descrizione: "La pietra è bagnata, ma dove l'acqua scava ci sono gli appigli."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: In cima
          testo: |
            Cerchi gli appigli dove l'acqua ha scavato la pietra e sali piano,
            tenendo il peso sulle gambe. A metà parete un sasso ti si stacca sotto
            la mano e lo senti rimbalzare fino in fondo, e resti appeso a tre dita
            finché l'altra mano non trova una crepa. Il sudore ti si raffredda sulla
            nuca tutto in una volta. In cima le impronte sono così fresche che il
            fango sta ancora riempiendo i bordi. Molto più tardi arriva Corin con i
            cavalli, fiero di sé come se la parete l'avesse scalata lui.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Due metri
          testo: |
            Sali due metri, poi il piede ti scivola sulla pietra bagnata e torni giù
            molto più in fretta di quanto eri salito. Atterri sul fianco, con i
            palmi scorticati e un ginocchio che si gonfia a vista d'occhio. Quando
            Corin torna indietro a vedere perché non arrivi ti trova seduto sotto la
            parete, a toglierti la sabbia rossa dai graffi con la punta del
            coltello, e fa finta di non aver visto niente con una discrezione molto
            rumorosa.
          effetti: { ferite: 0.5 }
      - testo: "Cercare la cengia dei caprioli"
        descrizione: "Se ci passano loro, ci passi anche tu. Bisogna trovarla."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La cengia
          testo: |
            Studi la parete finché non vedi una cengia che sale a zigzag, larga un
            piede, segnata dagli escrementi dei caprioli. Dove passano loro passi
            anche tu, con la pancia contro la roccia e il naso in quello che hanno
            lasciato, e arrivi in cima senza un graffio. Le impronte del cinghiale
            sono ancora umide. Corin arriva con i cavalli un'ora dopo e ti chiede
            come hai fatto, con l'aria di volerlo scrivere.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: La cengia che finisce
          testo: |
            Segui una cengia che sale bene per metà parete e poi finisce contro la
            roccia liscia, come una frase lasciata a metà. Torni giù all'indietro,
            un piede alla volta, con le gambe che tremano e la pietra che ti scivola
            sotto le dita. Da lontano, oltre la parete, senti Corin che chiama il
            tuo nome per sapere a che punto sei. In fondo ti siedi e aspetti che il
            cuore rallenti, e intanto la luce sulla parete ha cambiato colore.
          effetti: { tormento: 0.5 }
      - testo: "Andare con Corin per il giro lungo"
        descrizione: "Corin sarà contento di avere compagnia. Il giro è lungo, e lui fischietta."
        costo: 2
        esito:
          titolo: Il giro lungo
          testo: |
            Prendi le briglie del tuo cavallo e segui Corin lungo la base della
            parete, verso il fiume, dove la roccia si abbassa. Il giro dura più di
            un'ora. Corin fischietta tutto il tempo una canzone del Grifone,
            sbagliando sempre la stessa nota, e a metà strada ti accorgi che la
            aspetti e che ti dispiacerebbe se la azzeccasse. Arrivate in cima dal
            lato opposto quando le ombre si sono già allungate, e le impronte del
            cinghiale sono ancora lì.
          effetti: { profondita.foresta-strisciante: 1, tormento: 0.5 }

  - id: foresta-le-carcasse
    immagine: bestiario/verme-carogna
    titolo: Le carcasse
    sommario: "In una conca fra le radici ci sono carcasse di caprioli, e fra le carcasse qualcosa si muove."
    luogo: Foresta Strisciante, in una conca fra le sequoie
    area: foresta-strisciante
    ripetibile: true
    requisiti: [pista.corin == 2, profondita.foresta-strisciante >= 2, profondita.foresta-strisciante <= 4]
    testo: |
      In una conca fra le radici di due sequoie ci sono le carcasse di tre
      caprioli, aperte dalla gola alla pancia e lasciate lì senza che nessuno
      ne abbia mangiato un boccone. C'è un odore dolciastro di carne andata a
      male che ti si attacca in fondo alla gola, e le mosche sono così tante
      che il ronzio sembra venire dalla terra. Corin si copre il naso con un
      fazzoletto di seta e diventa del colore del fazzoletto, che è verde
      pallido.

      {natura Media} Una bestia che ammazza e non mangia sta difendendo
      qualcosa, oppure è malata. A giudicare dal grigio sugli alberi, forse le
      due cose vanno insieme.

      Fra le carcasse qualcosa di pallido e bagnato si gonfia piano e si
      sgonfia, al ritmo di un respiro.

      {resistenza Media} Le gambe vogliono andarsene e hanno ragione. Tienile
      ferme lo stesso, e guarda dove mettono i piedi le mosche, e dove non li
      mettono.
    opzioni:
      - testo: "Affrontarli"
        immagine: bestiario/verme-carogna
        descrizione: "Sono due, lunghi quanto un uomo. Dove toccano, i muscoli si irrigidiscono."
        combattimento: vermi-carogna
        vittoria:
          titolo: I vermi carogna
          testo: |
            Il primo verme si alza dalle carcasse con la corona di tentacoli aperta,
            e il secondo esce da sotto una radice proprio dove avevi messo il piede.
            Uno ti sfiora il polso e la mano ti diventa di legno per il tempo di tre
            respiri, e la guardi come se appartenesse a un altro. Quando smettono di
            muoversi Corin è ancora lì con la balestra puntata, e il suo unico dardo
            è piantato nella corteccia di una sequoia, a un palmo dalla tua testa.
          effetti: { profondita.foresta-strisciante: 1 }
        sconfitta:
          titolo: Per il colletto
          testo: |
            Un tentacolo ti si avvolge al polpaccio e la gamba diventa rigida come
            un ramo. Cadi fra le carcasse, con la faccia nell'odore dolce. Senti la
            bocca rotonda del verme che ti cerca il fianco. Poi arriva uno
            strattone, con un rumore di stoffa strappata, e Corin ti trascina via
            per il colletto tirando con tutte e due le mani. Ti lascia solo quando
            siete al fiume. La gamba torna tua dopo un'ora, e il fetore delle
            carcasse ti resta nei vestiti.
      - testo: "Guardare bene prima di avvicinarti"
        descrizione: "Quella cosa che respira fra i caprioli non è un capriolo."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Sopravvento
          testo: |
            Ti fermi a dieci passi e guardi. Quello che si gonfia fra le carcasse è
            un verme pallido lungo quanto un uomo, arrotolato su se stesso, e un
            secondo è steso sotto la radice con la corona di tentacoli aperta, ad
            assaggiare l'aria. La pelle ti si accappona dalla nuca ai polsi. Prendi
            Corin per la manica e fate il giro largo, sopravento, tenendo i cavalli
            corti. I vermi restano dove sono. Ritrovate le tracce dall'altra parte
            della conca.
          effetti: { profondita.foresta-strisciante: 1 }
        fallimento:
          titolo: Il tentacolo
          testo: |
            Ti avvicini alla carcassa più vicina per guardare meglio, e la carcassa
            si muove. Un verme pallido esce dal ventre del capriolo e ti sfiora la
            caviglia con la corona di tentacoli, e la gamba ti diventa di legno dal
            ginocchio in giù. Corin ti trascina indietro per le ascelle e grida per
            tutti e due, mentre il verme torna dentro il capriolo con la calma di
            uno che rientra in casa. La gamba ti formicola per un'ora buona.
          effetti: { ferite: 0.5 }
      - testo: "Lasciare a loro le carcasse e passare dal greto"
        descrizione: "Il greto del fiume è lontano dalle carcasse, e lungo. Il rumore lo sentirai lo stesso."
        costo: 2
        esito:
          titolo: Il greto
          testo: |
            Scendi al greto con Corin e i cavalli e lo segui a lungo, sui sassi
            bagnati, finché la conca non è lontana. Il rumore però vi accompagna. È
            un risucchio regolare che viene dalle carcasse e si sente anche sopra lo
            scroscio del fiume, e a un certo punto Corin si tappa le orecchie con le
            dita e canticchia. Quando risalite nel bosco hai lo stomaco chiuso e il
            sapore dolciastro ancora in gola.
          effetti: { profondita.foresta-strisciante: 1, tormento: 0.5 }

  # ------------------------------------------------------------ la carta della spedizione
  - id: foresta-la-farfalla
    immagine: ambientazione/foresta-strisciante
    titolo: La farfalla foglia-rossa
    sommario: "Corin ha visto una farfalla foglia-rossa e ha deciso di portarla a Liaren."
    luogo: Foresta Strisciante, fra le felci
    area: foresta-strisciante
    tipo: carta
    # Corin vuole portarla a Liaren: non mentre Liaren è sparita o a letto (Acciaio e Ira 1–5).
    requisiti: [pista.corin == 2, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      Una farfalla foglia-rossa si posa sull'orecchio del tuo cavallo e
      riparte subito, e Corin le va dietro. È una di quelle che Padre Vantes
      ha liberato a mezzogiorno del Festival, e deve aver seguito il fiume fin
      qui. Corin la insegue a piedi fra le felci con il cappello in mano, e
      ogni volta che la manca le chiede scusa.

      {natura Facile} Le foglia-rossa volano basse quando l'aria è umida, e si
      posano sulle cose calde. Un cappello tenuto in mano da un uomo accaldato
      è quasi un invito.

      {origine accolito-del-velo} A mezzogiorno del Festival il drappo
      cremisi l'hai sollevato tu, insieme a Padre Vantes, e le farfalle ti
      sono passate a un palmo dalla faccia. Ti chiedi se questa era fra
      quelle, e ti senti un po' sciocco a chiedertelo.

      «La porto a Liaren!» ti grida senza voltarsi. «Le farfalle le
      piaceranno. Credo. Beh, insomma, è rossa.» Inciampa in una radice e si
      rialza con gli aghi di abete fra i capelli, senza perdere di vista la
      farfalla.

      {empatia Media} Non sa che cosa piace a Liaren, e gli preme moltissimo
      arrivarle davanti con qualcosa in mano.
    opzioni:
      - testo: "Aiutarlo a prenderla"
        descrizione: "Con il cappello, piano, mentre è posata."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Facile }
        successo:
          titolo: Nel cappello
          testo: |
            La farfalla si posa su una felce e tu le cali sopra il cappello di
            Corin, piano, prima che riparta, trattenendo il fiato senza
            accorgertene. Corin la trasferisce in una tabacchiera d'argento vuota,
            dopo averci fatto due buchi con la punta del pugnale, e la tiene in mano
            per il resto della strada come se fosse un uovo. Ridi, e ti accorgi che
            non ridevi da giorni. Lui ride con te senza sapere bene perché.
          effetti: { tormento: -0.5 }
        fallimento:
          titolo: Nelle felci
          testo: |
            Ti tuffi sulla farfalla e atterri a pancia in giù in un cespuglio di
            felci bagnate, che ti accolgono con un rumore di schiaffo. La farfalla
            va a posarsi sul naso di Corin, che resta immobile con gli occhi storti
            a guardarla finché non riparte da sola verso il fiume. «La lasciamo
            andare» dice, come se l'avesse deciso lui. Ti aiuta a rialzarti e ti
            toglie una lumaca dalla spalla.
      - testo: "Lasciarlo fare e guardarti intorno"
        descrizione: "Corin si divertirà anche da solo."
        esito:
          titolo: Le tacche sull'abete
          testo: |
            Mentre Corin corre fra le felci tu resti sul sentiero a guardarti
            intorno, e per un po' senti soltanto lui che chiede scusa a una
            farfalla. Su un abete, all'altezza degli occhi, ci sono delle tacche
            vecchie in colonna, coperte di resina. Sopra la colonna qualcuno ha
            inciso le lettere D e S. Conti le tacche, e sono quarantuno.

            {percezione Media} Le tacche in basso sono profonde e dritte, quelle in
            alto più storte e leggere. Chi le incideva è invecchiato davanti a
            questo albero.

            Corin torna senza la farfalla, e quando vede le lettere si illumina.
            «Dolovan Stroud! Mi ha detto che da ragazzo cacciava qui. Quarantuno
            cinghiali, allora» dice, e poi ci pensa. «O quarantuno orchi. Con il
            signor Stroud non si sa mai.»
          effetti: { informazioni.voce: 1 }
      - testo: "Chiamarla come al Circolo si chiamano le bestie"
        descrizione: "Nel Bosco di Velthar le foglia-rossa si raccontano ai bambini, e ai bambini il Circolo insegna anche la lingua per parlare alle bestie."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Sul dorso della mano
          testo: |
            Ti accucci fra le felci e chiami la farfalla a fior di labbra, con
            le parole che il Circolo insegna ai bambini. Lei gira due volte
            sopra il cappello di Corin, poi scende a posarsi sul dorso della
            tua mano, leggera come un fiocco di cenere. Corin ci cala sopra una
            tabacchiera d'argento vuota, dopo averci fatto due buchi con la
            punta del pugnale, e da quel momento la tiene in mano come un uovo.
            Prima del fiume ti chiede tre volte come hai fatto. Ridi, e ti
            accorgi che non ridevi da giorni.
          effetti: { tormento: -0.5 }

  # ------------------------------------------------------------ il cuore · 2 → 3
  - id: il-cinghiale-mutato
    immagine: bestiario/cinghiale-crudele-mutato
    titolo: Il cinghiale mutato
    sommario: "In fondo alla foresta c'è una radura piena di carcasse, e in mezzo alle carcasse c'è il cinghiale."
    luogo: Foresta Strisciante, la radura interna
    area: foresta-strisciante
    requisiti: [pista.corin == 2, profondita.foresta-strisciante >= 5]
    testo: |
      Le tracce ti portano in una radura dove le sequoie si allargano e la
      luce scende dritta. L'erba è schiacciata in larghi cerchi, e dappertutto
      ci sono carcasse, cervi ridotti a strisce di pelle e un branco di
      caprioli fatto a pezzi e lasciato lì senza un morso. Su un fianco,
      vicino a un tronco caduto, c'è un puma dal manto color brace con le
      fauci aperte, e la pelliccia gli fuma ancora sulle punte. Corin, accanto
      a te, smette di parlare per la prima volta da stamattina.

      Il cinghiale è al centro della radura. L'aria intorno a lui si fa densa
      e ti preme sul petto, e il fango sotto i suoi zoccoli bolle piano. I
      cacciatori non avevano esagerato. È grande come un carro, una montagna
      di setole grigie fradice e di protuberanze d'osso. Sotto la pelle gli
      pulsano lente vene d'argento, e dove il puma l'ha ferito il sangue cola
      grigio e denso, come cenere bagnata. *Questa è opera della Marea Grigia,
      e ce l'hai a trenta passi.* Gli occhi piccoli e rossi si girano verso di
      voi.

      {resistenza Media} Il petto fa fatica a riempirsi, e le ginocchia hanno
      già deciso da che parte scappare. Il corpo ha capito prima di te quanto
      pesa quella bestia.

      {origine fuggiasco-di-ghoran} A Ghoran i sorveglianti avevano una
      parola per la Marea Grigia, e la dicevano abbassando la voce, come si
      nomina un padrone. Adesso ti torna in bocca, e la tieni fra i denti.

      {natura Difficile} Le vene d'argento battono più lente del cuore di un
      cinghiale. Quello che lo tiene in piedi non è più tutto suo, e dove la
      Marea l'ha toccato la carne è più tenera, dietro la spalla.

      Corin non prende la balestra. Slega dalla sella un fagotto di velluto e
      ne tira fuori un tubo di metallo scuro lungo quanto un braccio, con una
      camera di cristallo in mezzo e un'impugnatura storta che non è fatta per
      mani umane. «Un'arma dei Precursori. L'ho pagata quanto una casa a un
      Raschiatore che non voleva dirmi dove l'aveva presa» sussurra. «Quando
      prende, non resta niente. Il guaio è che ci mette tanto a caricarsi, e
      io non prendo mai.» Il cristallo comincia a ronzare piano.

      {origine allievo-di-torvessa} Il ronzio ti arriva nei denti prima che
      nelle orecchie, come quello dei sei cristalli sul banco dell'Accademia
      il giorno del Festival. La mano ti cerca in tasca una penna per
      annotarlo, e trova soltanto le briciole della colazione.

      {persuasione Media fallita} Ti viene da proporgli di rimettere il tubo
      nel velluto e tornare in città a raccontarla. La frase ti si ferma fra i
      denti, perché Corin ha già la faccia di uno che indietro non torna.
    opzioni:
      - testo: "Affrontarlo"
        immagine: bestiario/cinghiale-crudele-mutato
        descrizione: "È grande come un carro ed è furioso. Corin intanto prova a caricare la sua arma, e tu devi restare vivo abbastanza a lungo."
        combattimento: cinghiale-della-foresta
        vittoria:
          titolo: La montagna che cade
          testo: |
            Il cinghiale carica spezzando un abete giovane come un fuscello, e tu ti
            butti di lato all'ultimo, sentendo il vento della bestia passarti sulla
            schiena. Lo colpisci due volte dietro la spalla, dove il pelo è più
            rado, finché le gambe non gli cedono e va giù di fianco con un tonfo che
            ti arriva nei denti. Il sangue grigio fuma sull'erba. Il cristallo
            dell'arma di Corin finisce di caricarsi proprio adesso, e lui la abbassa
            con cura. Poi si avvicina a piccoli passi e tocca la zanna con la punta
            dello stivale, e ride forte, troppo a lungo, con le mani che tremano.

            {empatia Media} Ride perché il cane è morto e il cinghiale anche, e fra
            le due cose non ha ancora trovato il posto dove mettersi.
          effetti: { pista.corin: 1, racconto: 1 }
          segue: foresta-il-puma-nero
        sconfitta:
          titolo: Il tubo di Corin
          testo: |
            La carica ti prende di striscio e ti manda a sbattere contro una
            sequoia, e il mondo per un po' è fatto solo di corteccia. Quando riapri
            gli occhi il cinghiale è sopra di te con le zanne basse, e la bava
            grigia ti cola sulla giacca, fredda come acqua di pozzo. Poi la radura
            diventa bianca. Un filo di luce passa sopra la tua testa con un rumore
            di tela strappata e apre alla bestia un buco nel fianco grande come un
            pugno. Il cinghiale fa tre passi e cade. A dieci passi Corin è seduto
            per terra, sbalzato dal colpo, con il tubo che fuma fra le gambe. Hai le
            costole che scricchiolano a ogni respiro.
          effetti: { pista.corin: 1 }
          segue: foresta-il-puma-nero
      - testo: "Attirarlo nella fossa di cattura"
        descrizione: "I cacciatori della Foresta scavano fosse coperte di rami, e una deve essercene anche qui intorno. Se la bestia ci cade dentro, Corin ha tutto il tempo di caricare e prendere la mira."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: La fossa
          testo: |
            La trovi a cento passi, fra due abeti, sotto un mucchio di rami troppo
            in ordine. Ti fai vedere e poi scappi da quella parte, tenendo la fossa
            fra te e lui e girando largo intorno ai rami per non lasciargli la tua
            traccia sopra. Dietro di te senti la terra che trema sotto gli zoccoli.
            Il cinghiale carica dritto, e i rami cedono sotto il suo peso con uno
            schianto. I pali gli entrano nei fianchi e non bastano. Laggiù la bestia
            si dibatte e la terra delle pareti frana a ogni colpo di zanna. Corin si
            affaccia sull'orlo, punta il tubo verso il basso con tutte e due le mani
            e aspetta che il cristallo smetta di ronzare. Il lampo illumina la fossa
            fino al fondo, e poi c'è solo silenzio.
          effetti: { pista.corin: 1, racconto: 1 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: Troppo vicino
          testo: |
            Il cinghiale ti taglia la strada fra gli abeti e ti prende con il
            fianco, e voli fra le felci con la coscia aperta da una zanna. Il dolore
            arriva un respiro dopo, e quando arriva è caldo. Mentre cerchi di
            rialzarti la bestia si gira per finirti, e una zampa posteriore le
            scivola sui rami della fossa. Ci cade dentro per metà. Corin le correva
            dietro urlando, e tira dall'orlo a tre passi di distanza. Il colpo lo
            sbatte contro un abete. La bestia non esce più dalla fossa, e tu ci
            metti molto a rialzarti.
          effetti: { pista.corin: 1, ferite: 2.5 }
          segue: foresta-il-puma-nero
      - testo: "Aspettare la carica contro una sequoia"
        descrizione: "Mettersi davanti al tronco più grosso e spostarsi all'ultimo. Se le zanne restano nel legno, Corin ha finalmente un bersaglio che non si muove."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Le zanne nel legno
          testo: |
            Ti metti con la schiena contro la sequoia più grossa e aspetti, con il
            cuore in gola, mentre la bestia raspa la terra. La corteccia ti punge
            attraverso la giubba, e ti ci tieni.

            {acrobazia Media} Il peso sulle punte, le ginocchia morbide. Ti butti
            quando vedi la testa abbassarsi, e un momento prima sarebbe stato troppo
            presto.

            Quando carica ti butti di lato all'ultimo momento, e le zanne entrano
            nel legno fino alla radice con uno schianto che fa piovere aghi su tutta
            la radura. Resta lì incastrato a scuotere la testa, e il tronco geme a
            ogni strattone. «Fermo, fermo» dice Corin alla bestia, come a un
            cavallo, e le arriva a cinque passi con il tubo alzato. Il lampo la
            prende alla base del collo. Corin si ritrova seduto nell'erba, e per un
            po' sente solo un fischio.
          effetti: { pista.corin: 1, racconto: 1 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: La zanna
          testo: |
            Ti butti di lato troppo presto, e il cinghiale corregge la carica come
            se l'avesse previsto. La zanna ti prende al fianco e ti solleva da
            terra, e la sequoia la incontri tu, con la schiena. Il fiato ti esce
            tutto insieme e non trova la strada per tornare. Mentre sei a terra la
            bestia si gira per finirti e incastra una zanna in una radice. Corin le
            arriva da dietro a occhi chiusi e tira a bruciapelo, e il lampo passa
            così vicino a te che ti brucia la manica. La bestia non si rialza, e tu
            per un bel pezzo nemmeno.
          effetti: { pista.corin: 1, ferite: 3 }
          segue: foresta-il-puma-nero
      - testo: "Prendere tu l'arma dei Precursori"
        descrizione: "Corin la tiene come un mazzo di fiori. Bisogna capire da che parte esce il colpo, quanto dura la carica e come si tiene un'impugnatura fatta per un'altra mano."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: Il lampo
          testo: |
            Corin ti passa il tubo senza discutere, sollevato. L'impugnatura è
            troppo larga per le tue dita, e la incastri sotto l'ascella come un
            remo. Il metallo è freddo e ti vibra contro le costole.

            {tecnologia Difficile} Il ronzio sale di tono come un bollitore. Quando
            non può salire più, deve per forza succedere qualcosa.

            Il cristallo ronza sempre più acuto mentre il cinghiale raspa e abbassa
            la testa, e capisci che il colpo parte quando il ronzio si ferma. La
            bestia carica. Il ronzio si ferma a venti passi, e il filo di luce le
            entra nel petto. La carica finisce da sola ai tuoi piedi, e il
            contraccolpo ti ha messo a sedere nel fango.
          pe: { tecnologia: 8 }
          effetti: { pista.corin: 1, racconto: 1, ferite: 0.5 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: Il ronzio
          testo: |
            Tieni il tubo come una balestra e aspetti il colpo che non parte, mentre
            la bestia ti viene addosso e il dito continua a premere su un grilletto
            che non esiste. Il ronzio si ferma quando hai già le zanne sotto il
            braccio. Il lampo parte verso il cielo, ti brucia le sopracciglia e
            spacca il ramo più alto di una sequoia. Il ramo cade sulla schiena del
            cinghiale e lo inchioda a terra quel tanto che basta a Corin per
            riprendersi il tubo e aspettare la seconda carica con le mani che
            tremano. Fra la prima e la seconda passa un tempo lunghissimo.
          effetti: { pista.corin: 1, ferite: 2.5 }
          segue: foresta-il-puma-nero
      - testo: "Tenerlo lontano da Corin finché l'arma non è carica"
        descrizione: "Un ramo di resina acceso, le grida, il tuo corpo in mezzo. Corin ha bisogno di tempo, e il tempo glielo dai tu."
        costo: 2
        esito:
          titolo: Il tempo di una carica
          testo: |
            Accendi un ramo di resina e ti metti fra la bestia e Corin, gridando
            cose che non hanno senso e non devono averne. Il fuoco la ferma una
            volta. La seconda volta il cinghiale ti passa sopra, e senti qualcosa
            nel petto che si sposta. La terza volta ti prende con il muso e ti
            lancia contro un tronco, e mentre ti rialzi il cristallo smette di
            ronzare. Il lampo apre il fianco alla bestia, e lei crolla a quattro
            passi da te. Corin arriva di corsa con la faccia rossa, ti tira su per
            la giacca e non riesce a dire niente per un pezzo.

            {medicina Media} Una costola, forse due. Respira corto e di lato, e per
            qualche giorno evita di ridere.
          effetti: { pista.corin: 1, ferite: 3, tormento: 0.5 }
          segue: foresta-il-puma-nero
      - testo: "Farti dare l'arma, da Raschiatore"
        descrizione: "Corin l'ha comprata da uno dei tuoi, e sulle piattaforme hai visto smontare cose simili. Sai dove si guarda prima di tirare, ma la bestia non aspetta."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: La tacca d'ottone
          testo: |
            Ti fai dare il tubo e lo giri verso la luce, e le mani ritrovano un
            gesto delle piattaforme prima ancora della testa. Sul bordo della camera
            di cristallo c'è una tacca d'ottone, e sulle piattaforme hai visto un
            vecchio Raschiatore spiegare a una recluta che il colpo parte un attimo
            dopo che la tacca smette di vibrare. Pianti il calcio contro una radice
            per reggere il contraccolpo e aspetti, con il pollice sulla tacca,
            mentre il cinghiale raspa.

            Quando carica, la tacca si ferma. Il filo di luce gli entra nel petto a
            venti passi, e la bestia finisce la corsa da sola, nel fango, a un
            braccio dai tuoi stivali. Corin ti guarda a bocca aperta, e poi guarda
            il tubo come se lo vedesse per la prima volta.
          pe: { tecnologia: 8 }
          effetti: { pista.corin: 1, racconto: 1 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: La tacca che vibra
          testo: |
            La tacca vibra ancora quando il cinghiale è già a dieci passi, e tu
            aspetti un momento di troppo, perché il vecchio Raschiatore diceva un
            attimo dopo e tu ne conti due. Il lampo parte mentre ti butti di lato e
            gli apre una spalla senza fermarlo. La zanna ti prende alla coscia e ti
            fa rotolare fra le felci.

            Corin raccoglie il tubo dove l'hai lasciato cadere e aspetta la seconda
            carica con le mani che tremano, e questa volta la tacca la guarda anche
            lui. La bestia cade a quattro passi da voi. Ti ci vuole un pezzo per
            rialzarti, e la coscia ti pulsa fino al fiume.
          effetti: { pista.corin: 1, ferite: 2 }
          segue: foresta-il-puma-nero
      - testo: "Contare il Mana nel cristallo, da allievo di Torvessa"
        descrizione: "La camera di cristallo ronza come i cristalli dell'Accademia quando si caricano. Se senti quando è piena, sai quando parte il colpo. La bestia però non aspetta la fine della lezione."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [magia, accademiche], difficolta: Difficile }
        successo:
          titolo: L'ultima ondata
          testo: |
            Ti fai dare il tubo e appoggi due dita sulla camera di cristallo,
            come facevi sul banco dell'Accademia. Il Mana ci sale dentro a
            ondate, e le senti nei polpastrelli, ognuna un poco più alta della
            precedente. Le conti mentre il cinghiale raspa la terra, e quando
            la bestia abbassa la testa ne manca una sola.

            {magia Difficile} L'ultima ondata non ricade. Si ferma in cima come
            l'acqua sul bordo di un catino, e in quel momento devi avere già
            puntato.

            Il filo di luce le entra nel petto a venti passi, e la carica
            finisce da sola nel fango, davanti ai tuoi stivali. Il contraccolpo
            ti mette a sedere, con le dita che formicolano fino al gomito.
          pe: { magia: 8 }
          effetti: { pista.corin: 1, racconto: 1, ferite: 0.5 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: Il conto a metà
          testo: |
            Appoggi le dita sulla camera di cristallo e conti le ondate di
            Mana, ma il cinghiale carica prima che tu arrivi in fondo al conto.
            Il colpo parte mentre ti butti di lato e gli brucia la spalla senza
            fermarlo, e una zanna ti apre la coscia fino al ginocchio. Corin ti
            strappa il tubo dalle mani e aspetta la seconda carica con gli
            occhi sbarrati. La bestia cade a cinque passi da voi, e tu resti a
            lungo fra le felci, con il sangue che ti scalda la gamba.
          effetti: { pista.corin: 1, ferite: 2.5 }
          segue: foresta-il-puma-nero
      - testo: "Piantarti davanti alla sequoia e non scappare"
        descrizione: "Da Ghoran sei già scappato una volta, e ti è bastato. Il cinghiale carica dritto su chi resta fermo, e una sequoia non si sposta."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza, intimidire], difficolta: Difficile }
        successo:
          titolo: Fermo
          testo: |
            Ti pianti a gambe larghe con la schiena contro la sequoia più
            grossa e gridi alla bestia con la voce dei sorveglianti di Ghoran,
            quella che ti piegava le spalle. Il cinghiale abbassa la testa e
            carica dritto su di te. Resti fermo finché senti il suo fiato, poi
            ti lasci cadere di lato, e le zanne entrano nel legno fino alla
            radice con uno schianto che fa piovere aghi su tutta la radura.

            Corin arriva a cinque passi dalla bestia incastrata, con il tubo
            alzato e le labbra che si muovono. Il lampo la prende alla base del
            collo, e lui si ritrova seduto nell'erba.
          effetti: { pista.corin: 1, racconto: 1 }
          segue: foresta-il-puma-nero
        fallimento:
          titolo: Le gambe ferme
          testo: |
            Ti pianti contro la sequoia e gridi, e il cinghiale carica. Le
            gambe però restano ferme un momento di troppo, come allora sulla
            bilancia, e la zanna ti prende al fianco prima che tu ti butti. La
            sequoia la incontri con la schiena. Mentre sei a terra la bestia
            incastra una zanna in una radice, e Corin le tira a bruciapelo con
            gli occhi chiusi. Il lampo ti passa così vicino che senti l'odore
            della manica bruciata, e per un bel pezzo non provi nemmeno ad
            alzarti.
          effetti: { pista.corin: 1, ferite: 3 }
          segue: foresta-il-puma-nero

  # ------------------------------------------------------------ il seguito · il puma nero (torna in città)
  - id: foresta-il-puma-nero
    immagine: bestiario/braska
    titolo: Il puma nero
    tipo: seguito
    luogo: Foresta Strisciante, la radura interna
    area: foresta-strisciante
    requisiti: [pista.corin == 3, braska == 0]
    testo: |
      Il cinghiale è a terra, e nella radura c'è silenzio abbastanza a lungo
      perché ti torni il fiato. Le mani ti tremano adesso, a cose finite, come
      fanno sempre. Poi dal margine degli alberi esce un puma.

      È più grande di quello morto e ha il manto nero, attraversato da vene
      color brace che si accendono e si spengono piano. A ogni passo, sotto le
      zampe, si alzano piccole scintille arancioni. Il puma attraversa la
      radura senza guardare il cinghiale e va dritto al compagno caduto, gli
      abbassa il muso sul collo e resta lì a respirare. Non ringhia e non
      abbassa le orecchie. Quando alza gli occhi vedi che sono color ambra, e
      che sono girati verso di te.

      {magia Media} Le vene color brace si accendono al ritmo del suo respiro.
      È Mana, e scorre dentro la bestia come se ci fosse nato, quieto, senza
      la fretta della Marea.

      {origine accolito-del-velo} Da qui senti sul viso un tepore che
      conosci, lo stesso che usciva dai palmi di Padre Vantes nella tenda dei
      feriti. Al puma però non costa niente, e il suo muso non si fa grigio.

      {armi-da-mischia Facile fallita} La mano ti va all'arma e ci resta,
      stretta, finché le dita non ti fanno male. Contro quello lì serve a
      farti sentire meglio, e nemmeno tanto.

      Corin tiene la balestra scarica contro il petto e muove le labbra senza
      voce. *Quello morto era il suo compagno, e lui è venuto a salutarlo.* Il
      puma fa un passo nella tua direzione.
    opzioni:
      - testo: "Avvicinarti di lato, con gli occhi bassi"
        descrizione: "Sai come ci si avvicina a un predatore che non ha fame. Piano e di fianco, senza fissarlo negli occhi."
        requisiti: [natura >= 2]
        costo: 0
        esito:
          titolo: Un nome
          testo: |
            Ti avvicini di lato a passi corti, con gli occhi sull'erba e le mani
            lontane dalle armi, e senti ogni filo d'erba sotto le suole. Il puma ti
            lascia arrivare a un braccio di distanza, poi allunga il muso verso le
            tue dita, e senti sulla pelle un caldo da focolare. Per il tempo di un
            respiro vedi il sottobosco dall'altezza di un ginocchio, e il puma color
            brace che corre davanti a te e poi smette di correre. Quando torna fra
            gli alberi ti resta in testa il nome Braska, e non sapresti dire chi te
            l'ha detto.

            Sulla strada del ritorno, due volte, vedi delle scintille arancioni fra
            gli abeti, sempre alla stessa distanza da te. Al Ponte del Conciatore
            Corin fa venire un carro per il cinghiale, e prima di salutarti ti fa
            promettere che domani sera sarai al Grifone.
          imposta: { braska: 2 }
          vai: ponti-sospesi
      - testo: "Tendergli la mano bassa e aperta"
        descrizione: "Come a un cavallo che non ti conosce. Lasciare che sia lui a decidere."
        requisiti: [addestrare-animali >= 2]
        costo: 0
        esito:
          titolo: La mano
          testo: |
            Ti abbassi su un ginocchio e tendi la mano aperta, il palmo in giù, come
            si fa con i cavalli nuovi. Il braccio vorrebbe tremare e non glielo
            permetti. Il puma la guarda a lungo. Poi attraversa lo spazio che vi
            divide in tre passi lenti e ti passa sotto la mano la testa intera,
            dalla fronte alle orecchie, calda come una pietra lasciata al sole.
            Senti le braci muoversi sotto il pelo. Se ne va com'è venuto, e ti
            lascia addosso un nome che nessuno ha pronunciato, Braska.

            Sulla strada del ritorno, due volte, vedi delle scintille arancioni fra
            gli abeti, sempre alla stessa distanza da te. Al Ponte del Conciatore
            Corin fa venire un carro per il cinghiale, e prima di salutarti ti fa
            promettere che domani sera sarai al Grifone.
          imposta: { braska: 2 }
          vai: ponti-sospesi
      - testo: "Restare fermo e lasciarlo andare"
        descrizione: "È il suo bosco, e oggi ha già perso abbastanza."
        costo: 0
        esito:
          titolo: Gli occhi d'ambra
          testo: |
            Resti fermo con le mani lungo i fianchi, e il puma ti guarda per un
            tempo che ti sembra lunghissimo. Una goccia di sudore ti scende lungo la
            schiena e tu la segui tutta, fino alla cintura. Gli occhi d'ambra
            passano da te a Corin, e poi al cinghiale a terra. Poi si gira e torna
            fra gli alberi senza fretta, e le scintille sotto le sue zampe si
            spengono una dopo l'altra nel sottobosco. Corin ricomincia a respirare
            con un rumore da mantice.

            Al Ponte del Conciatore Corin fa venire un carro per il cinghiale, e
            prima di salutarti ti fa promettere che domani sera sarai al Grifone. Ha
            ancora gli aghi di abete fra i capelli, e non se n'è accorto.
          imposta: { braska: 1 }
          vai: ponti-sospesi
      - testo: "Salutarlo come si saluta al Circolo"
        descrizione: "Al Circolo si dice che una bestia che veglia un compagno non va guardata negli occhi, e che la testa la si abbassa per primi."
        quando: [origine.figlio-del-circolo >= 1]
        costo: 0
        esito:
          titolo: La testa bassa
          testo: |
            Ti inginocchi nell'erba e abbassi la testa finché vedi soltanto le tue
            mani, come al Circolo si fa davanti a una bestia che veglia un compagno.
            Le parole che accompagnano il gesto ti tornano in bocca da sole, senza
            voce. Senti i passi del puma venire avanti e il caldo del suo fiato
            sulla nuca, un caldo da focolare. Resta lì il tempo di un respiro lungo.
            Quando rialzi gli occhi sta tornando fra gli alberi, e ti resta in testa
            un nome che nessuno ha detto, Braska.

            Sulla strada del ritorno vedi due volte delle scintille arancioni fra
            gli abeti, sempre alla stessa distanza da te. Al Ponte del Conciatore
            Corin fa venire un carro per il cinghiale, e prima di salutarti ti fa
            promettere che domani sera sarai al Grifone.
          imposta: { braska: 2 }
          effetti: { tormento: -0.5 }
          vai: ponti-sospesi
      - testo: "Benedire il puma caduto"
        descrizione: "Il Velo benedice i morti. Su come si benedice una bestia, in Cattedrale, nessuno ti ha mai dato una regola."
        quando: [origine.accolito-del-velo >= 1]
        costo: 0
        prova: { attributo: mentale, abilita: [magia, empatia], difficolta: Media }
        successo:
          titolo: La Benedizione
          testo: |
            Ti avvicini piano al puma caduto senza guardare l'altro e ti
            inginocchi a due passi dal muso aperto. Le parole della Benedizione
            le dici a mezza voce, come te le ha insegnate Vantes, e il calore ti
            scende dal palmo sulla pelliccia che fuma ancora. Il puma nero ti
            lascia finire. Poi viene a fiutarti la mano, e senti sulla pelle un
            caldo da focolare. Per il tempo di un respiro vedi il sottobosco
            dall'altezza di un ginocchio, e quando torna fra gli alberi ti resta
            in testa un nome che nessuno ha detto, Braska.

            Sulla strada del ritorno vedi due volte delle scintille arancioni
            fra gli abeti, sempre alla stessa distanza da te. Al Ponte del
            Conciatore Corin fa venire un carro per il cinghiale, e prima di
            salutarti ti fa promettere che domani sera sarai al Grifone.
          imposta: { braska: 2 }
          vai: ponti-sospesi
        fallimento:
          titolo: Le parole impastate
          testo: |
            Ti inginocchi accanto al puma caduto e cominci la Benedizione, ma a
            metà le parole ti si impastano, proprio dove Vantes ti diceva di
            respirare. Il puma nero ti guarda con gli occhi d'ambra finché non
            smetti. Poi si gira e torna fra gli alberi senza fretta, e le
            scintille sotto le sue zampe si spengono una dopo l'altra.

            Al Ponte del Conciatore Corin fa venire un carro per il cinghiale, e
            prima di salutarti ti fa promettere che domani sera sarai al
            Grifone. Lungo la strada ti chiede due volte che cosa stavi dicendo,
            e tu non sai rispondergli.
          imposta: { braska: 1 }
          vai: ponti-sospesi
