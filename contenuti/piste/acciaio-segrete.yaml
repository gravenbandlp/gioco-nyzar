# Acciaio e Ira, seconda metà (pista.acciaio 5 → 7): il diario di Isvaro letto al Grifone, il tunnel dei
# contrabbandieri sotto l'Acciaieria e la spedizione nelle Segrete dell'Ira, con Uzgreth alle fosse e
# Yoggoth nell'Aula dell'Ira.
#
# - `il-diario-di-isvaro` (5 → 6): Liaren legge il diario ad alta voce, una parte alla volta (quality
#   nascoste diario.*), poi si sceglie a chi portarlo.
# - `il-tunnel-dei-contrabbandieri` (pista 6, la prima volta): A19, A22, A23, il masso finto, la caverna
#   degli orchi; chi trova il passaggio prende `tunnel.segrete` ed entra nelle Segrete.
# - `di-nuovo-nel-tunnel` (pista 6, le volte dopo): rientro nella spedizione.
# - area `segrete-dell-ira`: sette stanze ripetibili (B1, B4, B6, B7, B8, B11, B12) in fasce di
#   profondità, 0 le gallerie dopo la statua (la caverna di guardia o la vasca dei teschi), 1 la prigione
#   o la sala degli interrogatori, 2 lo studio delle sette punte oppure Uzgreth alle fosse (B9, storia
#   facoltativa), 3 la camera sospesa o il santuario. Poi il cuore `l-aula-dell-ira` (B13), che in ogni
#   ramo porta pista.acciaio a 7, pozzo-dell-ira a 5, dà il cilindro di lyssan e riporta in Città Bassa.
quality:
  - { id: tunnel.segrete, nome: "Il passaggio del masso finto", categoria: stato, nascosta: true, descrizione: "Sai dov'è il masso finto in fondo al tunnel dei contrabbandieri." }
  - { id: diario.mappe, nome: Hai visto le mappe del diario, categoria: stato, nascosta: true }
  - { id: diario.razzia, nome: Liaren ti ha letto la pagina della razzia, categoria: stato, nascosta: true }
  - { id: diario.piano, nome: Liaren ti ha letto la pagina del tunnel, categoria: stato, nascosta: true }
  - { id: diario.amata, nome: Liaren ti ha letto la pagina dell'amata, categoria: stato, nascosta: true }
  - { id: diario.fratello, nome: Hai parlato a Liaren di Isvaro, categoria: stato, nascosta: true }

aree:
  - id: segrete-dell-ira
    immagine: ambientazione/rovine-dei-precursori
    nome: Segrete dell'Ira
    sommario: "Sotto la Città Bassa, oltre il masso finto in fondo al tunnel dei contrabbandieri, si aprono gallerie di pietra più vecchie di Qir-Azel."
    spedizione: { ritorno: citta-bassa, soglia: 4, stanze: 3 }
    testo: |
      Oltre il muro abbattuto la galleria sale dritta per una trentina di metri e si apre in una sala di
      pietra liscia. Al centro c'è la statua di marmo rosso di una donna bellissima con la faccia storta dalla
      rabbia e un copricapo di uncini e di lame. Gli uncini hanno ancora la punta e il marmo non ha una crepa,
      mentre i mattoni del muro abbattuto alle tue spalle si sbriciolano sotto le dita. Nella sinistra stringe
      un grosso libro con una stella a sette punte sulla copertina, e nella destra una corsesca di metallo e
      d'avorio. Il metallo della lama è lucido e senza un punto di ruggine.

      Da qui le Segrete si diramano in gallerie basse e stanze crollate. Più ti allontani dal muro più l'aria
      si fa fredda, e il fiato comincia a uscirti in nuvole.

storylet:
  # ------------------------------------------------------------ 5 → 6 · il diario di Isvaro
  - id: il-diario-di-isvaro
    presso: grifone-di-ferro
    immagine: personaggi/liaren-tarvelin
    titolo: Il diario di Isvaro
    sommario: "Liaren è ancora a letto con il fianco fasciato. Brunella ha chiuso la porta a chiave, e sul comodino c'è il diario di Isvaro."
    luogo: Locanda del Grifone di Ferro, la stanza di Liaren
    area: ponti-sospesi
    requisiti: [pista.acciaio == 5]
    testo: |
      Liaren passa i giorni dopo l'Acciaieria a letto nella stanza in fondo al corridoio del Grifone, con il
      fianco sinistro fasciato stretto. Tiene sulle ginocchia il samisen senza suonarlo e gira un pirolo
      avanti e indietro, e la corda sale e scende di mezzo tono senza fermarsi su una nota.

      Brunella ha chiuso la porta a chiave e si è seduta sulla cassapanca con il mestolo in grembo.

      Sul comodino c'è il diario di Isvaro, pieno di mappe di Qir-Azel e di ritratti di una donna. Ha gli
      angoli consumati e le pagine gonfie d'inchiostro, tanto che la copertina non si chiude più del tutto.
      Accanto c'è il mazzo di chiavi di Ondrel, che stamattina la Caserma ha riportato in un sacchetto di tela
      con scritto a gesso *Tarvellin* con due elle. Liaren te l'ha messo in mano appena sei entrat{o|a}.

      «L'elfico l'ho imparato a undici anni per scrivergli all'Accademia» dice Liaren, e allunga la mano verso
      il diario. «Leggo io, e poi te lo scrivo su un foglio. Tu tienimi la lampada vicino, e tu, Brunella, non
      dici niente finché non ho finito.»

      {origine allievo-di-torvessa} Isvaro è cresciuto all'Accademia, nelle stesse aule dove studi tu. Ti
      chiedi se Orvald Temmerin se lo ricordi, e sai già che ti risponderebbe a un'altra domanda.
    opzioni:
      - testo: "Sfogliare le mappe"
        descrizione: "Metà del diario è Qir-Azel disegnata a inchiostro, strada per strada, con le frecce."
        immagine: ambientazione/evento-razzia-festival-150
        requisiti: [diario.mappe == 0]
        costo: 0
        esito:
          titolo: Quaranta e quattrocento
          testo: |
            La prima serie mostra piani d'attacco per una banda di quaranta orchi, e una delle pagine è
            cerchiata due volte. Le frecce partono dall'Acciaieria e salgono fino alla piazza del Festival,
            vicolo per vicolo, senza passare mai da una strada larga. Il tratto è fermo e sottile, e in tutte
            quelle pagine il pennino non ha lasciato una macchia.

            {origine figlio-della-citta-bassa} Una delle frecce passa davanti al cortile del bottaio dove da
            bambin{o|a} andavi a rubare i cerchi di ferro. Isvaro ha disegnato perfino il portone, e l'ha
            lasciato aperto.

            Le pagine dopo sono per quattrocento orchi. Nessuna è cerchiata, e molte sono coperte di croci
            tracciate così forte che il pennino ha bucato la carta.
          imposta: { diario.mappe: 1 }
          segue: il-diario-di-isvaro
      - testo: "Farle leggere la prima pagina scritta"
        descrizione: "Dopo le mappe le righe si fanno fitte. Liaren si schiarisce la voce."
        immagine: personaggi/ondrel-tarvelin
        requisiti: [diario.razzia == 0]
        costo: 0
        esito:
          titolo: La razzia
          testo: |
            «La razzia è andata come doveva» legge Liaren, e il dito le scorre sotto la riga. «Abbiamo perso
            pochi orchi di Capomozzo, e la bara di Sollen l'abbiamo presa senza fatica, mentre i bifolchi
            guardavano da un'altra parte. Non vedo l'ora del vero assalto. Questa città merita di bruciare.
            Quel bastardo di mio padre l'ho costretto a tacere sull'Acciaieria, che ci serviva come base,
            altrimenti avrei raccontato a tutti come ha tolto di mezzo la mamma con l'aiuto di Vesh e dei suoi
            tagliagole. Gli ho fatto sparire anche ogni carta che in città nomini Capomozzo, così abbiamo più
            tempo.»

            {origine rampollo-dei-quartieri-alti} Nei salotti la morte di Maerith Tarvelin è durata una
            stagione. Si parlava di una febbre, e chi ne parlava posava la tazza sul piattino prima di
            cambiare discorso.
          imposta: { diario.razzia: 1 }
          segue: il-diario-di-isvaro
      - testo: "Farle leggere la seconda pagina"
        descrizione: "Qui la calligrafia è più nervosa, e c'è un nome sottolineato."
        immagine: ambientazione/acciaieria-di-qir-azel
        requisiti: [diario.piano == 0]
        costo: 0
        esito:
          titolo: Il tunnel dei contrabbandieri
          testo: |
            «Balthog vuole un assalto in massa, via terra» legge Liaren, e ti fa cenno di avvicinare la
            lampada. «Per me è un errore. Dovremmo farci aiutare dal demone delle Segrete e mandare su i suoi
            mostri da sotto, per il tunnel dei contrabbandieri che sbuca nell'Acciaieria di mio padre, e poi
            entrare dal fiume con assalti piccoli e mirati. Gli altri sono tutti d'accordo tranne Zagrath. Il
            mezzogre dice di no solo per farmi arrabbiare. La mia adorata Aurenne è troppo presa dai livelli
            inferiori per decidere. Dice che quando avrà liberato il Costruttore lo metterà ai suoi ordini, e
            allora la prudenza non ci servirà più. Spero che abbia ragione. Quell'idiota di Garin crede ancora
            che serviamo il Culto dell'Anonimo, e Kessa comincia a sospettare qualcosa.»
          imposta: { diario.piano: 1 }
          segue: il-diario-di-isvaro
      - testo: "Farle leggere l'ultima pagina"
        descrizione: "L'ultima pagina scritta sta prima dell'ultimo ritratto."
        immagine: ambientazione/mito-regina-ali-spezzate
        requisiti: [diario.amata == 0]
        costo: 0
        esito:
          titolo: La mano nuova
          testo: |
            «La mia amata vuole andare fino in fondo» legge Liaren, con la voce che si è fatta più bassa.
            «Qualunque cosa le dica, resta convinta di essere brutta. Vuole togliersi di dosso quella che
            chiama la sua corruzione celestiale e metterci la grazia della sua nuova madre, la Regina delle
            Ali Spezzate. Quando ha bruciato i resti di suo padre al santuario di Capomozzo è cominciata la
            trasformazione, e la sua mano nuova a me piace poco. Spero che quando offrirà Qir-Azel alle fiamme
            di Nhar'Kael sia meno orrenda. Anche le succubi sono demoni, no?»

            La donna è disegnata a carboncino come nelle altre, con i capelli lunghi e chiari, ma qui ha due
            ali da pipistrello che le escono dalle scapole e una mano nera e artigliata posata sul ventre. Le
            ombre delle ali sono sfumate con il dito, e sulla carta è rimasto il segno di un polpastrello. In
            questo ritratto come in tutti gli altri, Isvaro le ha ripassato gli occhi con un inchiostro viola.
          imposta: { diario.amata: 1 }
          segue: il-diario-di-isvaro
      - testo: "Raccontarle di Isvaro"
        descrizione: "Sul gradino le hai detto soltanto che è scappato. Adesso vuole sapere come."
        requisiti: [diario.fratello == 0, isvaro == 1]
        costo: 0
        esito:
          titolo: La finestra del dormitorio
          testo: |
            Le racconti com'è scappato dalla fornace, e Liaren ti ascolta senza staccare gli occhi dal
            samisen. «All'Accademia scappava dalla finestra del dormitorio tutte le settimane» dice dopo un
            po'. «Però la sera tornava sempre, in tempo per la cena. Stavolta è scappato con gli orchi, e per
            cena non torna.» Gira il pirolo finché la corda geme, e Brunella allunga una mano a fermarle il
            polso, e resta zitta perché le è stato chiesto.
          imposta: { diario.fratello: 1 }
          segue: il-diario-di-isvaro
      - testo: "Raccontarle di Isvaro"
        descrizione: "Isvaro è alla Caserma da quando la ronda l'ha portato via. Liaren non ti ha ancora chiesto come sta."
        requisiti: [diario.fratello == 0, isvaro == 2]
        costo: 0
        esito:
          titolo: Il pane dolce
          testo: |
            Le racconti che Isvaro è ancora chiuso in una cella della Caserma, con le mani legate dietro la
            schiena, e Liaren annuisce piano a ogni parola. «Quando torna, Galdrick proverà a farlo parlare»
            dice, e si sistema il cuscino dietro la schiena con una smorfia per i punti. «Io a trovarlo non ci
            vado. Una volta ci andavo ogni settimana, con il pane dolce di Brunella nel cestino, e lui lo
            mangiava tutto senza dire grazie.»
          imposta: { diario.fratello: 1 }
          segue: il-diario-di-isvaro
      - testo: "Raccontarle di Isvaro"
        descrizione: "Isvaro è morto in fondo alla scala dei magazzini. Liaren vuole sapere se ha detto qualcosa."
        requisiti: [diario.fratello == 0, isvaro == 3]
        costo: 0
        esito:
          titolo: I mozziconi
          testo: |
            Liaren ti chiede se ha detto qualcosa prima di morire, e tu le racconti che si è girato per
            parlarti, in cima alla scala, e non ha fatto in tempo. «Da piccolo aveva paura del buio» dice alla
            fine. «All'Accademia i maestri gli spegnevano la candela tutte le sere, e io gli portavo i
            mozziconi di nascosto.» Poi stringe il pirolo finché la corda si spezza con un suono acuto, e il
            capo spezzato le frusta il dorso della mano.
          imposta: { diario.fratello: 1 }
          segue: il-diario-di-isvaro
      - testo: "Portare il diario alla Cattedrale del Velo"
        descrizione: "Un demone sotto la città e la Regina delle Ali Spezzate. Al Velo queste cose devono saperle."
        immagine: personaggi/padre-vantes
        requisiti: [diario.mappe == 1, diario.razzia == 1, diario.piano == 1, diario.amata == 1]
        esito:
          titolo: Le copie dei novizi
          testo: |
            Padre Vantes ti riceve in sacrestia, fra gli armadi dei paramenti che sanno di cera, e legge
            muovendo le labbra la traduzione che Liaren ti ha scritto su un foglio a parte. Chiama due novizi
            e gli fa copiare le mappe per tutta la notte, e la mattina dopo ti restituisce il diario legato
            con un nastro bianco.

            «Il Velo pregherà per tutti noi» dice, con la mano sul tuo braccio. «E tu, {figliolo|figliola},
            va' a vedere quel tunnel prima che ci arrivi qualcun altro.» Le chiavi di Ondrel ce le hai ancora
            in tasca.
          effetti: { pista.acciaio: 1, rep.velo: 1 }
      - testo: "Tenerlo per Galdrick"
        descrizione: "Lo sceriffo è a Ghoran. Quando torna, deve trovare tutto pronto."
        immagine: personaggi/toren-galdrick
        requisiti: [diario.mappe == 1, diario.razzia == 1, diario.piano == 1, diario.amata == 1]
        esito:
          titolo: Un rapporto per lo sceriffo
          testo: |
            Scendi alla Caserma e chiedi carta e penna al sergente di guardia, che te le dà dopo averti
            guardato due volte. Scrivi tutto quello che sai, dalle mappe ai nomi, e ti ci vuole un'ora buona,
            con il pennino che gratta e il polso che si indurisce a metà pagina.

            Il diario lo tieni tu finché lo sceriffo non torna. Le chiavi di Ondrel le hai ancora in tasca, e
            il tunnel è sempre lì, sotto l'Acciaieria.
          effetti: { pista.acciaio: 1, rep.caserma: 1 }
      - testo: "Tenerlo e non parlarne con nessuno"
        descrizione: "Liaren te lo chiede con la mano sul tuo polso. Ondrel è morto, e il resto è roba di famiglia."
        immagine: personaggi/liaren-tarvelin
        requisiti: [diario.mappe == 1, diario.razzia == 1, diario.piano == 1, diario.amata == 1]
        esito:
          titolo: Roba di famiglia
          testo: |
            «Mio padre è morto» dice Liaren. «Se in città si sa di mia madre e di Vesh, domani il Grifone si
            riempie di gente venuta a guardarmi in faccia.» Chiude il diario e te lo mette in mano, e per un
            momento le dita le restano sulla copertina. «Tienilo tu. Io adesso non lo voglio vicino.»

            Le chiavi di Ondrel ce le hai in tasca, e il tunnel dei contrabbandieri è ancora là sotto, oltre
            il muro abbattuto dei magazzini.

            {origine rampollo-dei-quartieri-alti} Nei Quartieri Alti una storia così farebbe il giro dei
            salotti in una sera, e ogni sera tornerebbe un poco più grossa. Il diario pesa più di prima,
            adesso che sai a chi lo stai togliendo di mano.
          effetti: { pista.acciaio: 1, rep.tarvelin: 1 }
      - testo: "Portare il diario a Ottilia Sanvel"
        descrizione: "In Cattedrale non devi chiedere udienza a nessuno. Ottilia tiene gli archivi minori, e delle carte che non devono uscire si occupa lei."
        quando: [origine.accolito-del-velo >= 1]
        requisiti: [diario.mappe == 1, diario.razzia == 1, diario.piano == 1, diario.amata == 1]
        esito:
          titolo: Gli archivi minori
          testo: |
            Ottilia Sanvel legge la traduzione di Liaren in piedi, accanto allo scaffale degli archivi minori
            con i faldoni legati a spago, e quando arriva alla Regina delle Ali Spezzate non cambia
            espressione. Poi chiama due novizi e gli fa copiare le mappe per tutta la notte.

            La mattina dopo Ottilia ti restituisce il diario legato con un nastro bianco. «Le copie restano
            qui. La Madre sarà informata» dice. «Tu intanto controlla quel tunnel, prima che lo trovi qualcun
            altro.» Le chiavi di Ondrel ce le hai ancora in tasca.
          effetti: { pista.acciaio: 1, rep.velo: 1 }

  # ------------------------------------------------------------ 6 · il tunnel dei contrabbandieri (la prima volta)
  - id: il-tunnel-dei-contrabbandieri
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Il tunnel dei contrabbandieri
    sommario: "Sotto l'Acciaieria c'è un muro abbattuto a colpi di mazza, e dietro un tunnel che corre nella roccia per quasi un chilometro."
    luogo: Acciaieria dei Tarvelin, i sotterranei
    area: citta-bassa
    requisiti: [pista.acciaio == 6, tunnel.segrete == 0]
    testo: |
      La porta delle consegne si apre con la chiave più grossa del mazzo di Ondrel. Dalla sala di carico una
      scala di pietra scende al magazzino sotterraneo, dove c'è il muro di mattoni abbattuto a colpi di mazza.
      Dietro il buco un passaggio vecchio scende verso sud fino alla stanza dove i contrabbandieri facevano i
      loro conti. Isvaro ci ha passato le ultime notti su una branda, e sulla mensola ha lasciato le sue
      bottiglie in fila. Le gambe del tavolo sono incise di tacche.

      {origine mercante-dei-ponti} Le tacche sono raggruppate a cinque con una barra di traverso, come le
      tengono i banchi dei Ponti quando non si fidano della carta. Sono tutte entrate, e le uscite i
      contrabbandieri se le tenevano a mente.

      Oltre la stanza comincia il tunnel, scavato nella roccia delle fondamenta. Lo segui con la lampada per
      quasi un chilometro verso nord-est, con il soffitto che ti sfiora i capelli. Sulle pareti i colpi dei
      picconi corrono in file regolari, e la polvere li ha ormai addolciti. Alla fine il tunnel si ferma
      contro un muro di roccia liscia, e lì i colpi dei picconi finiscono di netto a un palmo dalla pietra. Ti
      dici che i contrabbandieri hanno trovato una vena troppo dura e hanno lasciato perdere. Davanti al muro
      la polvere è battuta da molti piedi larghi.
    opzioni:
      - testo: "Cercare le giunture nella roccia"
        descrizione: "I piedi larghi arrivano fino al muro e lì si fermano. Gli orchi da qualche parte sono passati."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il masso finto
          testo: |
            Passi la lampada sulla roccia palmo per palmo, e in basso a sinistra la luce non fa ombra dove
            dovrebbe farla. Il masso è un'illusione. Dall'altra parte c'è una caverna con un mucchio di
            giacigli d'orco e gli avanzi dei loro pasti, e la paglia dei giacigli è ancora schiacciata nella
            forma dei corpi. A destra c'è una porta di legno rinforzato, chiusa. A sinistra si aprono due
            gallerie. Quella a est finisce in un crollo dopo centoventi metri, e quella a ovest passa per un
            muro abbattuto da poco.
          imposta: { tunnel.segrete: 1 }
          vai: segrete-dell-ira
        fallimento:
          titolo: La roccia
          testo: |
            Per un'ora tasti la roccia in ginocchio e poi in punta di piedi, finché le dita non sentono più
            niente e l'olio della lampada si abbassa di un dito. La pietra è liscia e fredda dappertutto, e
            sotto i polpastrelli non trovi una crepa. Torni indietro per il tunnel con la lampada che
            sfrigola, e nella stanza dei contrabbandieri ti siedi sulla branda di Isvaro a massaggiarti le
            dita prima di risalire, davanti alle sue bottiglie in fila sulla mensola.
          effetti: { tormento: 1 }
      - testo: "Sentire il Mana nella roccia"
        descrizione: "Un muro dove finisce un tunnel lungo un chilometro è un muro strano. Se è fatto di Mana, le dita lo sentono."
        incantesimo: leggere-il-mana
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il formicolio
          testo: |
            Appoggi le dita alla roccia e lasci andare il Mana. Il resto del muro sotto i polpastrelli è
            pietra muta, e in basso a sinistra senti un formicolio fitto, come di un arto che si risveglia.
            Dall'altra parte c'è una caverna con i giacigli degli orchi e gli avanzi dei loro pasti, e a
            destra una porta di legno rinforzato, chiusa. A sinistra la galleria a est finisce in un crollo,
            mentre quella a ovest passa per un muro abbattuto da poco.
          imposta: { tunnel.segrete: 1 }
          vai: segrete-dell-ira
        fallimento:
          titolo: Il ronzio
          testo: |
            Il Mana ti torna indietro tutto insieme, e per un momento senti la roccia ronzare dentro i denti.
            Ti ritrovi sedut{o|a} per terra, con la lampada rovesciata e un sapore di rame in bocca. Risali il
            tunnel con il ronzio ancora nelle gengive. In cima alla scala ti accorgi che stai stringendo le
            chiavi di Ondrel fino a farti male, e i denti delle chiavi ti sono rimasti stampati nel palmo.
          effetti: { tormento: 1 }
      - testo: "Appoggiarti al muro e spingere"
        descrizione: "Le impronte finiscono contro il muro. Tu sei stanc{o|a}, e il muro sembra fatto apposta per appoggiarcisi."
        costo: 2
        esito:
          titolo: Dall'altra parte
          testo: |
            Ti appoggi al muro con la spalla per riposare un momento, e la spalla ci affonda dentro.

            {acrobazia Facile fallita} Le braccia arrivano tardi, come sempre quando cadi attraverso una cosa
            che non esiste. Atterri sui gomiti in una caverna che puzza d'orco, in mezzo ai giacigli di paglia
            e agli ossi spolpati. Delle due gallerie che partono dalla caverna, quella a est finisce in un
            crollo, e quella a ovest passa per un muro abbattuto da poco.
          imposta: { tunnel.segrete: 1 }
          effetti: { tormento: 1 }
          vai: segrete-dell-ira
      - testo: "Leggere le impronte come quelle di un vicolo"
        descrizione: "In Città Bassa si impara presto a capire dalla polvere da dove è uscito qualcuno. Qui le impronte vanno contro il muro e non tornano."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Le punte dei piedi
          testo: |
            Le impronte arrivano al muro e non tornano indietro. Le ultime però sono soltanto punte, con il
            tallone sollevato, quelle di chi si abbassa per passare sotto una trave, e sono tutte in basso a
            sinistra.

            Allunghi la mano in quel punto e la mano entra nella pietra, fredda come l'acqua di un pozzo.
            Dall'altra parte c'è una caverna che puzza d'orco. Sulla destra c'è una porta di legno rinforzato
            che resta chiusa, mentre a sinistra partono due gallerie, una che finisce in un crollo e una che
            passa per un muro abbattuto da poco.
          imposta: { tunnel.segrete: 1 }
          vai: segrete-dell-ira
      - testo: "Guardare da che parte piega la fiamma"
        descrizione: "In fondo a un tunnel chiuso l'aria dovrebbe stare ferma. La fiamma della lampada, davanti al muro, non sta ferma."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Facile }
        successo:
          titolo: La fiamma storta
          testo: |
            La fiamma si piega piano verso il basso a sinistra, e da quel punto arriva un filo d'aria fredda
            che sa di paglia sporca e di carne vecchia. Allunghi la mano dove va la fiamma, e la mano entra
            nella pietra.

            Dall'altra parte c'è una caverna con i giacigli degli orchi e gli avanzi dei loro pasti, e a
            destra una porta di legno rinforzato, chiusa. A sinistra la galleria a est finisce in un crollo,
            mentre quella a ovest passa per un muro abbattuto da poco.
          imposta: { tunnel.segrete: 1 }
          vai: segrete-dell-ira
        fallimento:
          titolo: La fiamma dritta
          testo: |
            Aspetti a lungo, accucciat{o|a} accanto alla lampada, finché ti si addormenta una gamba e la
            fiamma continua a stare dritta come un chiodo. Forse l'aria quaggiù non si muove, o forse si muove
            troppo piano per te. Risali il tunnel zoppicando sulla gamba che formicola, e nella stanza dei
            contrabbandieri ti siedi sulla branda di Isvaro ad aspettare che il sangue torni dove deve.
          effetti: { tormento: 1 }
      - testo: "Accendere la Luce fredda sulla roccia"
        descrizione: "La lampada fa tremare le ombre e le confonde. Una luce che non trema mostra la pietra com'è, e forse anche quella che non c'è."
        quando: [origine.allievo-di-torvessa >= 1]
        incantesimo: luce-fredda
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La luce ferma
          testo: |
            In basso a sinistra la pietra resta un poco più chiara del resto, come un disegno ripassato una
            volta di troppo, e le sue crepe non fanno ombra. Ci appoggi la mano e la mano entra nella roccia,
            fredda come l'acqua di un pozzo.

            Dall'altra parte c'è una caverna con i giacigli degli orchi e gli avanzi dei loro pasti, e a
            destra una porta di legno rinforzato, chiusa. A sinistra la galleria a est finisce in un crollo,
            mentre quella a ovest passa per un muro abbattuto da poco.
          imposta: { tunnel.segrete: 1 }
          vai: segrete-dell-ira
        fallimento:
          titolo: Il cristallo che sfarfalla
          testo: |
            Il cristallo si accende storto e sfarfalla, e la luce fredda salta sul muro a scatti, peggio della
            lampada. Ogni volta che si riaccende la roccia ti sembra diversa, e dopo un po' non sai più se
            stai guardando la pietra o il ricordo della pietra. Spegni tutto con un dolore sottile dietro gli
            occhi. Risali il tunnel con il cristallo tiepido stretto nel pugno, e la lampada all'improvviso ti
            sembra una vecchia amica.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ 6 · il ritorno nelle Segrete
  - id: di-nuovo-nel-tunnel
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Di nuovo nel tunnel
    sommario: "Le bottiglie di Isvaro sono ancora in fila sulla mensola, e il masso finto è dove l'hai lasciato."
    luogo: Acciaieria dei Tarvelin, i sotterranei
    area: citta-bassa
    requisiti: [pista.acciaio == 6, tunnel.segrete >= 1]
    testo: |
      L'Acciaieria è chiusa e fredda come l'hai lasciata. Nella stanza dei contrabbandieri le bottiglie di
      Isvaro sono ancora in fila sulla mensola, con la polvere intatta sui tappi. Oltre c'è il tunnel di quasi
      un chilometro, con i colpi dei picconi sulle pareti e in fondo il masso che non c'è.

      {origine apprendista-raschiatore} Sulle piattaforme ti hanno insegnato a contare le curve di una
      galleria all'andata, per non cercarle al ritorno. Il conto della prima volta torna fino al masso.

      Ci passi attraverso con gli occhi chiusi come l'ultima volta. La pietra finta ti scorre sulla faccia con
      il freddo dell'acqua di un pozzo.
    opzioni:
      - testo: "Scendere nelle Segrete"
        descrizione: "La strada fino alla statua la sai. Il resto lo rifai da capo."
        esito:
          titolo: La statua
          testo: |
            Sali per la galleria dritta fino alla sala della statua e passi davanti alla donna di marmo rosso,
            con la faccia storta dalla rabbia e il libro della stella stretto nella sinistra. Sul pavimento
            della sala c'è la polvere delle gallerie, e sul marmo della statua non se ne posa un granello. Il
            freddo ti entra sotto i vestiti come l'altra volta, a cominciare dai polsi. Controlli che la
            lampada abbia olio, ti allacci la giubba fino al collo e ti incammini verso le gallerie basse.
          vai: segrete-dell-ira

  # ------------------------------------------------------------ le stanze (ripetibili, in fasce di profondità)
  - id: segrete-la-caverna-di-guardia
    immagine: ambientazione/marea-grigia
    titolo: La caverna di guardia
    sommario: "In una caverna bassa qualcosa cammina avanti e indietro sulle gambe piegate al contrario."
    luogo: Segrete dell'Ira, la caverna di guardia
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 0]
    testo: |
      Dove la galleria si allarga c'è una caverna bassa, poco più grande di una stanza. Contro una parete
      marcisce un vecchio sacco di farina dei contrabbandieri, gonfio d'umido. Dentro cammina avanti e
      indietro una figura glabra e magra sulle gambe piegate all'indietro come quelle di un cane. Si muove a
      scatti, e quando si gira vedi la bocca troppo larga, dove al posto dei denti ci sono piccole mani con
      tre dita che si aprono e si chiudono. Le dita battono fra loro con un ticchettio secco.

      Il tratto che percorre è scavato nel pavimento in un solco lucido che va da una parete all'altra e lei
      non lo lascia mai. Ti dici che è una caverna vecchia e che il solco l'ha fatto l'acqua prima di lei.

      {rissa Media} Gambe piegate così reggono male un calcio di lato al ginocchio.

      Le dita ti cercano l'impugnatura prima che tu lo decida.
    opzioni:
      - testo: "Affrontarla"
        descrizione: "È una sola, ed è magra. Le mani che ha in bocca però sono parecchie."
        combattimento: una-colata
        vittoria:
          titolo: La pozza grigia
          testo: |
            Ti viene addosso a scatti, e le mani della bocca cercano la tua faccia prima delle sue braccia.
            Quando la colpisci si apre come cera calda e cola sul pavimento in una pozza grigia che fuma, con
            un odore di capelli bruciati. Le piccole mani si chiudono una dopo l'altra mentre affondano. Nella
            pozza, per un momento, ti sembra di vedere una faccia d'uomo con la bocca aperta in un urlo, poi
            la superficie si appiana.
          effetti: { profondita.segrete-dell-ira: 1 }
        sconfitta:
          titolo: La manica
          testo: |
            Le mani della bocca ti prendono il polso e tirano, con una forza che da un corpo così magro non ti
            aspettavi. Ti liberi lasciandoci la manica e un po' di pelle, e torni indietro di corsa nella
            galleria. Il polso ti brucia dove le dita hanno stretto, e sulla pelle restano piccoli segni rossi
            a gruppi di tre. Lei non ti segue, e la cosa ti offende quasi più del polso.
      - testo: "Passarle alle spalle quando si gira"
        descrizione: "Va avanti e indietro sempre per lo stesso tratto. Prima o poi ti dà la schiena."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Otto passi
          testo: |
            Da dietro lo spigolo conti i passi. Sono otto all'andata e otto al ritorno, sempre dentro il
            solco, e per girarsi le serve il tempo di contare fino a due. Al terzo giro scivoli dentro rasente
            la parete, con gli stivali in mano, mentre lei guarda il muro in fondo. Quando si volta sei già
            nella galleria dall'altra parte, con la schiena incollata alla pietra e il cuore che batte negli
            stivali che tieni in mano. La senti riprendere i suoi otto passi.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il sacco di farina
          testo: |
            A metà strada urti il sacco marcito, che si apre con uno sbuffo di polvere grigia. La figura si
            gira di colpo, e le mani della bocca si allungano verso di te. Ti graffiano il collo mentre torni
            di corsa nella galleria, e la polvere della farina ti si attacca alla ferita. Ti fermi solo quando
            non senti più il ticchettio delle dita, e ti pulisci il collo con la manica finché smette di
            sanguinare.
          effetti: { ferite: 0.5 }
      - testo: "Calmare il respiro e passarle accanto"
        descrizione: "Gira la testa verso ogni rumore. Forse anche verso chi ha paura."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: A passo normale
          testo: |
            La guardi a lungo prima di muoverti, e capisci che si volta verso chi respira in fretta più che
            verso chi cammina. Lasci cadere le spalle e sciogli le mani. Attraversi la caverna a passo normale
            contando fra te e te, come quando da bambin{o|a} non riuscivi a dormire, e il conto arriva fino a
            un numero che non ti era mai servito. Ti passa a un braccio di distanza, con le piccole mani che
            si aprono nell'aria, e non si gira.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Le piccole mani
          testo: |
            Ci provi, ma a tre passi da lei il respiro ti scappa di mano e si fa corto. La testa glabra si
            gira verso di te tutta in una volta, e le piccole mani si tendono fuori dalla bocca. Torni
            indietro camminando all'indietro, senza toglierle gli occhi di dosso, e lei ti segue fino
            all'imbocco della galleria. Lì si ferma e resta a guardarti con la bocca aperta finché la lampada
            non gira l'angolo, e le piccole mani ti salutano, o ti chiamano.
          effetti: { tormento: 1 }
      - testo: "Aspettare che si allontani"
        descrizione: "Prima o poi andrà in fondo alla caverna. Bisogna restare accucciati al buio ad ascoltarla."
        costo: 2
        esito:
          titolo: Il ticchettio
          testo: |
            Ti accucci nella galleria con la lampada coperta e aspetti. Per un'ora senti il ticchettio delle
            piccole dita avvicinarsi e allontanarsi, sempre alla stessa distanza, e a un certo punto ti
            accorgi che lo stai contando a mezza voce. Quando finalmente si ferma in fondo alla caverna passi
            rasente il muro opposto con le ginocchia rigide. Quel rumore ti resta nelle orecchie per tutta la
            galleria successiva, insieme al numero a cui eri arrivat{o|a}.
          effetti: { profondita.segrete-dell-ira: 1, tormento: 1 }

  - id: segrete-la-vasca-dei-teschi
    immagine: ambientazione/rovine-dei-precursori
    titolo: La vasca dei teschi
    sommario: "Sopra una vasca d'acqua ferma, con i teschi allineati sul bordo, vola una testa senza corpo."
    luogo: Segrete dell'Ira, la vasca di purificazione
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 0]
    testo: |
      In una stanza rotonda c'è una vasca di pietra piena d'acqua ferma, così limpida che vedi le incisioni
      sul fondo. Sono righe sottili che corrono tutte verso il centro, nette come il giorno in cui le hanno
      tagliate, e sull'acqua non galleggia un granello di polvere. Lungo il bordo corre una fila di teschi
      levigati e girati tutti verso l'acqua. A uno qualche contrabbandiere ha infilato per scherzo nell'orbita
      un sasso di fiume, e ti dici che anche gli altri li ha voltati così qualcuno con lo stesso gusto per gli
      scherzi.

      Sopra la vasca svolazza una testa senza corpo grande come quella di un cavallo, sorretta da due ali di
      pipistrello. Le ali sono di una pelle sottile tesa su ossa lunghe, e battono con un rumore di tela
      bagnata. Dal mento e dallo scalpo le pendono lunghi tentacoli, e le zanne sono tante che la bocca non
      riesce a chiudersi. Ti vede subito e si gira verso di te.
    opzioni:
      - testo: "Aspettarla e colpirla"
        descrizione: "Prima o poi ti viene addosso. Meglio che ti trovi pront{o|a}."
        combattimento: testa-alata
        vittoria:
          titolo: Nell'acqua
          testo: |
            Ti piomba addosso con la bocca aperta, e i tentacoli ti si avvolgono intorno al braccio con cui ti
            ripari. Il colpo giusto arriva quando si alza per riprendere slancio. La testa cade nella vasca, e
            l'acqua si fa scura intorno alle ali e poi torna limpida, come se non fosse successo niente. La
            testa resta sul fondo, ferma sopra le incisioni, e nessuna bolla sale in superficie.
          effetti: { profondita.segrete-dell-ira: 1 }
        sconfitta:
          titolo: I tentacoli
          testo: |
            I tentacoli ti prendono alla faccia e le zanne ti aprono la spalla. Ti butti a terra e rotoli fino
            alla porta, e la testa ti insegue sbattendo le ali contro il soffitto. Fuori dalla stanza smette
            di seguirti e torna a svolazzare sopra la vasca come prima. Ti premi la manica sulla spalla per
            fermare il sangue, che passa fra le dita caldo e ostinato, e dal corridoio la senti respirare con
            un rumore di mantice bucato.
      - testo: "Tenerla lontana con la lampada e correre"
        descrizione: "Ha le ali di un pipistrello. Forse anche gli occhi."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La luce in faccia
          testo: |
            Alzi la lampada più che puoi e gliela spingi verso gli occhi, e la testa si ritrae sbattendo le
            ali. Corri intorno alla vasca tenendo la luce alta e saltando i teschi del bordo. Quando ti
            ritrovi dall'altra parte lei è ancora appesa al soffitto, a sbattere le palpebre. Esci con il
            braccio che trema per il peso della lampada, e la fiamma che trema con lui.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il teschio
          testo: |
            Inciampi in un teschio del bordo, e la lampada ti oscilla in mano facendo ballare tutta la stanza.
            La testa ti arriva addosso dal lato buio e ti morde il polpaccio, e le zanne ti restano nella
            carne a lungo prima che tu riesca a strappartela via. Torni alla porta zoppicando e sbattendo la
            lampada contro l'aria, finché le ali si allontanano verso il soffitto. Nello stivale il sangue fa
            un rumore piccolo e bagnato.
          effetti: { ferite: 0.5 }
      - testo: "Lanciarle qualcosa che sappia di morto"
        descrizione: "Queste creature girano dove ci sono resti. Sul bordo della vasca ce ne sono parecchi."
        prova: { attributo: mentale, abilita: [natura, accademiche], difficolta: Media }
        successo:
          titolo: Il teschio dal sasso nell'occhio
          testo: |
            Prendi dal bordo il teschio più vicino, quello con il sasso nell'orbita, e lo lanci nel corridoio
            da cui sei venut{o|a}. La testa ci si butta dietro con un verso acuto, come un cane dietro a un
            osso. Mentre la senti rosicchiare nel buio attraversi la stanza dall'altra parte senza correre, e
            ti scusi a mezza voce con il padrone del teschio, chiunque fosse. Per scrupolo ti scusi anche con
            il contrabbandiere che gli aveva regalato il sasso.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Troppo pulito
          testo: |
            Il teschio che lanci è vecchio e pulito, e la testa non lo degna di uno sguardo. Guarda te, che
            sei più fresc{o|a}. Scende in picchiata prima che tu possa prenderne un altro, e devi ritirarti
            nel corridoio con le braccia sopra la testa, mentre le ali ti sbattono contro la faccia. Il
            teschio rotola fino al bordo della vasca e si ferma lì, con le orbite girate verso di te.
          effetti: { tormento: 1 }
      - testo: "Passare a testa bassa e lasciarla mordere"
        descrizione: "La stanza è piccola. Qualche morso, e sei dall'altra parte."
        costo: 2
        esito:
          titolo: I morsi
          testo: |
            Ti tiri la giubba sopra la testa e attraversi la stanza di corsa, girando intorno alla vasca. Ti
            morde due volte sulla spalla e una sulla mano, e i tentacoli ti lasciano sulla pelle una bava che
            pizzica. Dall'altra parte ti fasci la mano con un lembo della camicia e stringi il nodo con i
            denti e senti in bocca il sapore del tuo stesso sudore. Poi vai avanti senza voltarti, e alle tue
            spalle le ali continuano a battere.
          effetti: { profondita.segrete-dell-ira: 1, ferite: 0.5 }

  - id: segrete-l-antica-prigione
    immagine: ambientazione/marea-grigia
    titolo: L'antica prigione
    sommario: "Venti celle intorno a una sala, la piattaforma di legno marcio e, in mezzo, due figure glabre che ti hanno già visto."
    luogo: Segrete dell'Ira, l'antica prigione
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 1]
    testo: |
      Esci su una piattaforma di legno che si affaccia su una sala grande, tre metri più in basso. Le assi
      sono nere di umidità e i chiodi che le tengono sono diventati una crosta rossa che si sbriciola sotto
      l'unghia. Intorno ci sono venti celle con le sbarre mangiate dalla ruggine, e dalla piattaforma due
      scale scendono fino al pavimento. Sul bordo nord corre una passerella larga un metro e mezzo verso un
      passaggio a est. Le sue travi entrano nella roccia attraverso fori quadrati, tagliati con una cura che
      il legno marcio infilato dentro non merita.

      In mezzo alla sala due figure glabre sulle gambe piegate al contrario si girano verso di te e vengono
      verso le scale a passo svelto. Le piccole mani che hanno in bocca si aprono e si chiudono con un
      ticchettio fitto, e un topo esce da sotto la piattaforma e si infila in una crepa del muro. Sul muro di
      una cella qualcuno ha disegnato a carbone una finestra con le tende e un vaso di fiori sul davanzale. Il
      davanzale è all'altezza degli occhi di uno seduto per terra con la schiena contro le sbarre.

      {origine fuggiasco-di-ghoran} Ti accorgi di aver contato le celle prima di guardare le figure, e di
      sapere già quale ha ancora la porta. A Ghoran lo facevi in ogni posto nuovo.
    opzioni:
      - testo: "Aspettarle in cima alle scale"
        descrizione: "Sono due. Dalla piattaforma però arrivano una alla volta."
        combattimento: due-colate
        vittoria:
          titolo: In cima alle scale
          testo: |
            La prima sale le scale a scatti e la colpisci quando mette il piede sull'ultimo gradino. Cola giù
            sopra la seconda in una pioggia grigia che fuma e che sa di capelli bruciati. La seconda ci passa
            attraverso, e ti ci vuole più tempo, con la piattaforma che ondeggia sotto di voi e le assi che
            scricchiolano a ogni colpo. Quando è finita prendi la passerella verso est, e ti fermi soltanto
            nel passaggio, con la fronte appoggiata alla roccia fresca. Giù nella sala le due pozze grigie
            hanno già smesso di fumare.
          effetti: { profondita.segrete-dell-ira: 1 }
        sconfitta:
          titolo: La piattaforma
          testo: |
            Ti arrivano addosso tutte e due insieme, e le mani delle loro bocche ti prendono ai vestiti con
            tre dita ciascuna. Riesci a strapparti via lasciandoci mezza giubba e torni indietro nel corridoio
            da cui sei venut{o|a}, sanguinando da un orecchio. Le figure si fermano sul bordo della
            piattaforma, dove finiscono le assi e comincia la pietra, e restano lì a guardare il buio dove sei
            sparit{o|a}. Stanno una accanto all'altra, con le piccole mani ferme nella bocca. L'orecchio ti
            fischia per tutta la galleria.
      - testo: "Correre lungo la passerella"
        descrizione: "Un metro e mezzo di legno vecchio fino al passaggio a est. Loro devono prima salire le scale."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La scala rotta
          testo: |
            Corri sulla passerella mentre loro salgono, e il legno ti si piega sotto gli stivali senza
            rompersi, per pura gentilezza. Arrivat{o|a} all'imbocco del passaggio ti giri e dai un calcio al
            montante della scala più vicina. Il legno è così marcio che lo stivale ci affonda dentro, e la
            scala crolla con i suoi gradini e si porta dietro anche l'altra. Le due figure restano sotto, a
            graffiare il muro con le dita della bocca, e il rumore ti accompagna per un pezzo lungo il
            passaggio, insieme a una soddisfazione che non sai bene dove mettere.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: L'asse
          testo: |
            A metà passerella un'asse cede, e la gamba ti va giù fino al ginocchio. Intorno al buco il legno è
            spugnoso e freddo, e si sfalda in fibre nere dove lo tocchi. La tiri fuori lasciandoci un pezzo di
            calzone e di pelle, e torni indietro di corsa mentre la prima figura arriva in cima alle scale,
            così vicina che senti il ticchettio delle dita. Ti rintani in fondo al corridoio, con la gamba che
            sanguina dentro lo stivale.
          effetti: { ferite: 0.5 }
      - testo: "Farle salire sulla piattaforma e farla cedere"
        descrizione: "Le travi sono marce. Il punto dove cedono sta a te trovarlo, e a loro arrivarci."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Le travi marce
          testo: |
            Guardi da dove nascono le travi e trovi quella che regge mezza piattaforma, nera di muffa dove
            entra nel muro. Il foro nella pietra è squadrato con precisione, e la trave marcita ci balla
            dentro di un dito per lato. Ti sposti sulla passerella, che è piantata nella roccia, e aspetti.
            Quando le due figure salgono e ti vengono incontro la trave si spezza sotto il loro peso, e
            precipitano di sotto in mezzo alle assi con un rumore di legna gettata nel camino. Passi verso est
            senza guardare giù.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: La trave sbagliata
          testo: |
            Scegli la trave sbagliata. La piattaforma ondeggia sotto i tuoi piedi invece che sotto i loro, e
            per un momento lungo vedi il pavimento della sala tre metri più in basso. Ti butti all'indietro
            nel corridoio, con le mani piene di schegge e le figure che arrivano in cima alle scale. Passi il
            resto del tempo sedut{o|a} al buio a toglierti le schegge con le unghie una per una. Sono nere
            fuori e chiare dentro, e a ogni scheggia ti dai dell'idiota a bassa voce.
          effetti: { tormento: 1 }
      - testo: "Chiuderti in una cella e aspettare"
        descrizione: "La cella con la finestra disegnata ha ancora la porta. Le sbarre reggono, forse."
        costo: 2
        esito:
          titolo: La finestra di carbone
          testo: |
            Scendi di corsa per la scala più lontana e ti chiudi nella cella con la finestra disegnata,
            tenendo la porta con tutte e due le mani. Fuori le sbarre sono mangiate dalla ruggine, e dove le
            stringi tu il ferro è liscio, consumato da altre mani prima delle tue. Le due figure graffiano le
            sbarre per un'ora, a un palmo dalla tua faccia, e il loro fiato non ha odore. Poi se ne vanno.
            Esci con le dita che non si aprono e prendi la passerella verso est, e il vaso di fiori a carbone
            ti resta negli occhi.
          effetti: { profondita.segrete-dell-ira: 1, tormento: 1 }

  - id: segrete-la-sala-degli-interrogatori
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sala degli interrogatori
    sommario: "Strumenti di tortura di un'epoca che non conosci, e una stella di legno piena di uncini davanti all'unica uscita."
    luogo: Segrete dell'Ira, la sala degli interrogatori
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 1]
    testo: |
      La sala è piena di strumenti fatti per far male, in uno stile che non hai mai visto. Il ferro è battuto
      a mano e unito con chiodi a testa quadra, e i manici di legno sono più scuri e lisci dove li stringeva
      chi li usava. In un angolo c'è una gabbia sferica con le punte rivolte verso l'interno. Al centro sta un
      tavolo lungo coperto di cinghie di cuoio, con una fila di leve che dovevano farlo girare a scatti. Il
      cuoio delle cinghie si è indurito e crepato.

      L'unica uscita è un passaggio basso nella parete opposta. Davanti ci sta una struttura di legno a forma
      di stella, alta più di te e piena di uncini. Sotto la stella la pietra ha un graffio curvo e lucido, ed
      è il solo punto della sala dove non c'è polvere.
    opzioni:
      - testo: "Spostare la stella di legno"
        descrizione: "È pesante, e gli uncini sono dappertutto. Bisogna prenderla dal centro."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il centro della stella
          testo: |
            Infili le braccia fra due punte fino al mozzo, che è l'unico punto della stella consumato dalle
            mani. Lo sollevi di un palmo, con il legno che scricchiola e gli uncini a un dito dalle guance. La
            trascini di lato un passo alla volta, con i talloni che scivolano sulla pietra. Quando la posi il
            passaggio è libero, e tu hai le braccia che tremano e un graffio sottile sul collo, che ti accorgi
            di avere soltanto dopo.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Gli uncini
          testo: |
            La stella è più pesante di quanto sembra, e quando ti scivola di mano gli uncini ti prendono
            l'avambraccio. Ti liberi strappando la manica, e il sangue ti cola fino al polso. La stella è
            rimasta davanti al passaggio, appena storta, con un filo della tua manica appeso a un uncino. Gli
            uncini sono ruvidi di ruggine fino a metà, e la punta è ancora affilata. Torni indietro a
            fasciarti, con il braccio tenuto contro il petto e la ruggine degli uncini che ti preoccupa più
            del taglio.
          effetti: { ferite: 0.5 }
      - testo: "Capire come si smonta"
        descrizione: "Una cosa così non la porti dentro intera. Qualcuno l'ha montata qui, e si può smontare."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il perno
          testo: |
            Dietro il braccio più basso della stella trovi un perno di ferro infilato in un anello murato.
            L'anello entra nella pietra senza un filo di malta, e il perno ci scorre dentro unto di un grasso
            nero che non si è seccato. Lo sfili con due colpi del palmo, e la stella gira su se stessa come
            una porta, aprendo il passaggio.

            La richiudi dietro di te, perché in fondo al passaggio ti sembra di sentire dei passi.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Le leve
          testo: |
            Tiri il perno sbagliato, che è legato con una catena alle leve del tavolo. Il tavolo dà uno scatto
            e poi un altro, e le cinghie si tendono intorno a niente, alla misura di un uomo sdraiato. Le
            fibbie si chiudono sul vuoto con un rumore secco di bronzo. Resti ferm{o|a} con il cuore che batte
            finché gli scatti si fermano, e dopo l'ultimo la sala è così silenziosa che senti l'olio friggere
            nella lampada. Per un pezzo non hai voglia di toccare nient'altro, e quando ci riprovi lo fai con
            la punta delle dita.
          effetti: { tormento: 1 }
      - testo: "Strisciare sotto, fra gli uncini"
        descrizione: "Fra il pavimento e la punta più bassa c'è spazio per un corpo, se il corpo non ha fretta."
        costo: 2
        esito:
          titolo: Sotto la stella
          testo: |
            Ti stendi sulla pancia e strisci sotto la punta più bassa, con la guancia sulla pietra fredda. Da
            lì sotto vedi che gli uncini sono piantati nel legno uno per uno, e che sono piegati tutti verso
            il passaggio. A metà un uncino ti si impiglia nella giubba e un altro ti graffia la schiena, e per
            liberarti devi tornare indietro di un palmo e ricominciare. Esci dall'altra parte con la polvere
            in bocca e la camicia incollata alla schiena, e ti ci vuole un momento prima di rimetterti in
            piedi, con le ginocchia che hanno opinioni precise sulla faccenda.
          effetti: { profondita.segrete-dell-ira: 1, ferite: 0.5 }

  - id: segrete-lo-studio-delle-sette-punte
    immagine: ambientazione/rovine-dei-precursori
    titolo: Lo studio delle sette punte
    sommario: "Sedie crollate, libri ridotti in frammenti e tre porte di pietra con la stessa stella incisa sopra."
    luogo: Segrete dell'Ira, l'antico studio
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 2]
    testo: |
      Il pavimento è ingombro dei resti di un tavolo lungo e di una decina di sedie, e il legno si sbriciola
      sotto lo stivale. Fra il legno marcio ci sono centinaia di frammenti di pergamena coperti di una
      scrittura spigolosa, come fatta a punta di coltello. La pergamena invece è intatta e ancora chiara.
      Sulla parete sud ci sono tre porte di pietra basse e strette, e su ognuna è incisa la stella a sette
      punte del libro della statua. Le incisioni sono profonde un dito e hanno ancora gli spigoli vivi, e le
      porte combaciano con il muro tanto bene che la fessura si vede appena.

      In mezzo ai frammenti c'è un tappo di sughero nuovo che odora ancora di vino. *Qui sotto qualcuno ha
      stappato una bottiglia, e non molto tempo fa.* Le tre porte sono chiuse.
    opzioni:
      - testo: "Leggere i frammenti"
        descrizione: "La scrittura è antica, ma le figure si capiscono. Fra tanti fogli ci sarà una pianta."
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: La pianta
          testo: |
            Delle parole non capisci niente. Su un frammento più grande degli altri, però, c'è il disegno di
            queste stanze. Le linee sono dritte e senza una correzione, e accanto a ogni porta è segnata la
            stella a sette punte. Accanto a quella di destra c'è un segno in più, una freccia che scende.
            Spingi la porta di destra con la spalla e si apre su una galleria che va in basso, da cui sale
            un'aria più fredda che ti asciuga il sudore sulla fronte.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Le punte di coltello
          testo: |
            Più guardi la scrittura spigolosa e più le lettere ti sembrano muoversi sul foglio, una punta dopo
            l'altra. Ti dici che sono le ombre dei solchi che si spostano con la fiamma della lampada, e
            continui a guardare. Ti viene un dolore dietro gli occhi che non passa, e quando alzi la testa non
            sai più quanto tempo è passato. La lampada ha consumato più olio di quanto pensavi, e le tre porte
            sono ancora chiuse. Rimetti giù il foglio con cura, come se qualcuno dovesse tornare a cercarlo.
          effetti: { tormento: 1 }
      - testo: "Spingere le porte una per una"
        descrizione: "Tre porte di pietra. Una si aprirà, se le spalle reggono."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La terza porta
          testo: |
            La prima non si muove e la seconda nemmeno. La terza cede di un dito alla prima spinta e di un
            palmo alla seconda, con un rumore di pietra su pietra che ti fa stringere i denti. È spessa una
            spanna, e sul lato interno la pietra è liscia e senza la stella. Ci passi di fianco con la spalla
            indolenzita e le dita bianche di polvere di pietra, e dall'altra parte trovi una galleria che
            scende. Prima di andare ti volti a guardare le altre due porte, e sei content{o|a} di non averle
            aperte.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: La spalla
          testo: |
            Spingi finché la spalla ti manda una fitta che arriva fino al collo, e le tre porte restano dove
            sono. Ti siedi su quello che resta di una sedia a massaggiarti il braccio. Da dietro la porta di
            mezzo, mentre stai lì, arriva un colpo solo, sordo, come di qualcuno che ha sentito bussare e
            risponde. Viene dal basso, all'altezza delle tue ginocchia.

            Ti alzi e te ne vai senza aspettare il secondo.
          effetti: { ferite: 0.5 }
      - testo: "Seguire l'odore del vino"
        descrizione: "Chi ha perso il tappo è passato per una di queste porte, e la bottiglia l'aveva aperta."
        costo: 2
        esito:
          titolo: Il vino di Isvaro
          testo: |
            Ti chini davanti a ogni porta e annusi a lungo la fessura con la faccia sulla pietra, sentendoti
            un poco cane da tartufi. La prima e la seconda non mandano niente, nemmeno l'odore della polvere.
            Dalla terza arriva un filo debole di vino rosso, e sotto c'è un odore di pietra bagnata. Ti ci
            vuole tutto il peso del corpo per aprirla. Il freddo che arriva dall'altra parte ti entra nel
            petto e ti resta addosso per un pezzo, e la spalla con cui hai spinto ti fa male fino a sera.
          effetti: { profondita.segrete-dell-ira: 1, tormento: 1 }

  - id: segrete-la-camera-sospesa
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: La camera sospesa
    sommario: "Una stanza rotonda come una bolla, dove le cose galleggiano a mezz'aria e le pareti scrivono da sole."
    luogo: Segrete dell'Ira, la camera di meditazione
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 3]
    testo: |
      La stanza è una sfera, e appena ci metti dentro la testa i capelli ti si alzano dalla nuca. Al primo
      passo i piedi si staccano da terra. A mezz'aria galleggia un corvo morto con un alone di vermi che si
      contorcono nel vuoto, e accanto a lui una bacchetta di ferro contorto con la punta biforcuta. Più in là
      gira piano su se stessa una bottiglia vuota. Del corvo restano soltanto le penne e le ossa, eppure i
      vermi intorno sono bianchi e grassi.

      Le pareti sono rivestite di lamine di un metallo rosso, e ogni tanto le attraversa una scarica nera
      senza rumore. Le lamine combaciano senza chiodi né saldature, e il metallo non ha un filo di ruggine né
      di polvere. L'uscita è un'apertura tonda dall'altra parte della sfera. Quando una scarica passa vicino
      al corvo i vermi smettono di muoversi tutti insieme, e ricominciano quando è passata.
    opzioni:
      - testo: "Afferrare la bacchetta quando ti passa vicino"
        descrizione: "Le cose qui dentro girano sempre allo stesso modo. Basta mettersi dove passerà."
        immagine: icone/crystal-wand
        quando: [avuto.bacchetta-della-stretta-folgorante == 0]
        prova: { attributo: mentale, abilita: [percezione, tecnologia, magia], difficolta: Media }
        successo:
          titolo: La bacchetta
          testo: |
            Guardi gli oggetti girare finché ne impari il giro lento e sempre uguale. Poi ti spingi piano
            lungo la parete fino al punto dove la bacchetta passerà, e le lamine sotto le dita non sono né
            calde né fredde. Ti arriva in mano da sola. È fredda e pesa più di quanto sembra, e il ferro
            contorto non ha un nodo né una sbavatura di forgia. Per un momento fra le due punte scocca una
            scintilla nera che ti fa rizzare i peli del braccio. La infili nella cintura e ti lasci portare
            fino all'uscita.
          effetti: { oggetto.bacchetta-della-stretta-folgorante: 1, profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il corvo
          testo: |
            Sbagli il giro, e invece della bacchetta ti arriva in faccia il corvo morto con il suo alone di
            vermi. Lo respingi con il braccio, e i vermi ti si attaccano alla manica e ci restano. Sono freddi
            e asciutti, e sulla stoffa non lasciano bava. Ti tiri fuori dalla sfera per la stessa apertura da
            cui sei entrat{o|a}, e ti ci vuole un pezzo per toglierteli tutti di dosso, uno per uno, storcendo
            la bocca a ogni verme.
          effetti: { tormento: 1 }
      - testo: "Attraversarla a bracciate"
        descrizione: "Ti dai la spinta dalla soglia e speri di arrivare dall'altra parte senza toccare le pareti."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La spinta
          testo: |
            Ti accucci sulla soglia e ti dai la spinta con tutte e due le gambe. Attraversi la sfera in linea
            retta con le braccia avanti, e sfiori la bottiglia che si mette a girare più in fretta. Le lamine
            ti passano intorno a un braccio di distanza, e sulla pelle del viso senti un formicolio come prima
            di un temporale. Prendi il bordo dell'uscita con le dita e ti tiri fuori, e il peso ti ricade
            addosso tutto in una volta, fino nelle ginocchia. Resti un momento a quattro zampe sulla pietra,
            content{o|a} di sentirla sotto le mani.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: La parete rossa
          testo: |
            La spinta è storta, e invece dell'uscita vai a sbattere contro la parete. Una scarica nera ti
            corre lungo il braccio fino alla spalla senza fare rumore, e ti lascia la mano addormentata. Sotto
            la pelle del polso compare una runa che non è tua. È disegnata con precisione e sparisce mentre la
            guardi. Sulla lamina dove hai battuto non resta nessun segno, nemmeno l'alone delle dita. Ti
            trascini indietro lungo le lamine fino alla soglia da cui sei entrat{o|a}, e la mano ti torna
            sensibile soltanto dopo, un dito alla volta, con mille spilli per ciascuno.
          effetti: { ferite: 0.5 }
      - testo: "Leggere i lampi sulle pareti"
        descrizione: "Le scariche formano parole in una scrittura antica. Forse dicono qualcosa di utile."
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: Le parole nere
          testo: |
            Le parole sono spigolose, come scritte a punta di coltello, e ogni tanto ne riconosci una. Ognuna
            dura quanto il lampo che la porta, e la seguente si accende sempre in un altro punto della parete.
            Parlano di collera e di vendetta e non finiscono mai una frase. Capisci però che le scariche
            corrono tutte verso l'uscita, come acqua verso uno scolo. Ti lasci tirare piano dalla loro parte e
            arrivi all'apertura senza fatica, e prima di uscire ti accorgi che stai ancora cercando di
            leggere, con le labbra che si muovono da sole.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: La frase che manca
          testo: |
            Le parole ti entrano negli occhi e ci restano. Dicono rabbia e poi vendetta, e poi di nuovo
            rabbia, sempre a un passo dal diventare una frase intera. Da qualunque parte giri la testa, la
            scarica dopo passa sulla lamina che hai davanti. Ti accorgi di avere i pugni stretti e la mascella
            che fa male, perché stringi i denti da un pezzo senza saperlo. Esci dalla sfera all'indietro, e la
            frase che manca ti resta in testa per tutta la galleria, con un buco in mezzo dove dovrebbe
            esserci il verbo.
          effetti: { tormento: 1 }
      - testo: "Lasciarti andare alla deriva"
        descrizione: "Prima o poi il giro lento ti porta dall'altra parte. Insieme al corvo."
        costo: 2
        esito:
          titolo: In compagnia del corvo
          testo: |
            Ti lasci staccare da terra e aspetti, a mezz'aria, che il giro lento ti porti dove vuoi. Ci vuole
            più di un'ora, e per tutto quel tempo l'aria della sfera resta alla temperatura della tua pelle.
            Il corvo morto ti passa accanto tre volte, sempre con la stessa ala aperta verso di te, e alla
            terza un verme ti si posa sulla guancia. Quando le dita toccano il bordo dell'uscita ti ci
            aggrappi forte, e il primo passo fuori ti fa barcollare come quando si scende da una barca. Ti
            passi la mano sulla guancia per un pezzo, anche se il verme non c'è più.
          effetti: { profondita.segrete-dell-ira: 1, tormento: 1 }

  - id: segrete-il-santuario
    immagine: ambientazione/mito-regina-ali-spezzate
    titolo: Il santuario
    sommario: "In cima a pochi gradini c'è un altare di marmo nero, e nel bacile c'è un'acqua che ti fa venire sete."
    luogo: Segrete dell'Ira, il santuario
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 3]
    testo: |
      La galleria si allarga in quello che doveva essere un piccolo santuario, e il gocciolio che sentivi
      lungo la strada qui non si sente più. Pochi gradini salgono a nord-est fino a una piattaforma di pietra
      grigia, dove c'è un altare di marmo nero con un bacile al centro. Il bacile è scavato nello stesso
      blocco dell'altare, e il marmo del bordo è lucido come una pietra che molte mani hanno toccato. Dentro
      c'è un'acqua torbida e ferma che non ha nessun odore.

      Sui gradini ci sono impronte d'orco nel fango secco. Salgono fino all'altare con passo normale e
      scendono più larghe e trascinate, come se chi le ha fatte fosse diventato più pesante lassù.

      {origine figlio-del-circolo} Al Circolo ti hanno insegnato che nel Bosco di Velthar un'acqua dove le
      bestie non vanno a bere si lascia stare. Intorno al bacile non c'è nemmeno l'impronta di un topo.

      Hai la gola secca da quando sei sces{o|a}.
    opzioni:
      - testo: "Capire che cosa c'è in quell'acqua"
        descrizione: "In una cantina l'acqua ferma puzza sempre di qualcosa. Questa non ha odore, e la cosa ti mette a disagio."
        prova: { attributo: mentale, abilita: [medicina, resilienza], difficolta: Media }
        successo:
          titolo: L'acqua che lavora
          testo: |
            Ti avvicini quanto basta e guardi l'acqua alla luce della lampada, senza chinarti troppo. Sul
            fondo del bacile c'è un deposito grigio, come quello che resta nei bicchieri degli speziali, e non
            c'è un granello di terra a sporcarlo. Intorno all'altare manca ogni insetto, perfino quelli morti.
            Ti asciughi la bocca con il dorso della mano e scendi dall'altra parte senza voltarti, con la sete
            che ti segue per un pezzo.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: La sete
          testo: |
            Più guardi l'acqua e più la gola ti brucia. Ti ritrovi chin{o|a} sul bacile con le mani a coppa, e
            ti fermi quando il naso è a un dito dalla superficie. Da così vicino ti accorgi che sulla
            superficie non si riflettono la fiamma della lampada e la tua faccia. Torni giù per i gradini a
            passi lunghi e ti siedi contro la parete della galleria, con la lingua che ti si attacca al
            palato. Ci metti un pezzo a convincere le mani a smettere di fare la coppa, e alla fine le infili
            sotto le ascelle.
          effetti: { tormento: 1 }
      - testo: "Passare di corsa, a polmoni pieni"
        descrizione: "Una cosa che fa venire sete si supera come si supera una cantina che puzza."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Due gradini alla volta
          testo: |
            Riempi i polmoni fino a sentirli tirare e sali i gradini due alla volta. Giri intorno all'altare
            senza guardare il bacile e ti butti giù dall'altra parte, con il petto che comincia a bruciare e
            le tempie che battono. Lassù l'aria è più secca che nella galleria e ti tira la pelle delle
            labbra. Respiri soltanto quando sei in fondo alla galleria, piegat{o|a} in due con le mani sulle
            ginocchia, e ti accorgi che la gola ti brucia meno di prima. Dietro di te l'acqua del bacile non
            ha fatto nemmeno un'increspatura.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il gradino
          testo: |
            All'ultimo gradino il piede scivola nel fango secco, e cadi con le ginocchia sulla pietra a un
            braccio dall'altare. Il colpo ti sale fino ai denti, e in bocca hai un sapore di ferro. Il bacile
            è lì, all'altezza della tua faccia, e l'acqua dentro è perfettamente ferma. Sul bordo il marmo è
            consumato in due incavi lisci, larghi quanto due mani aperte. Torni indietro a quattro zampe senza
            guardarlo, con le ginocchia che sanguinano e la gola in fiamme, e ti rialzi soltanto in fondo ai
            gradini.
          effetti: { ferite: 0.5 }
      - testo: "Girare largo, rasente la parete"
        descrizione: "C'è un passaggio stretto lungo il muro, lontano dall'altare. È lungo, e l'acqua si sente lo stesso."
        costo: 2
        esito:
          titolo: Rasente il muro
          testo: |
            Giri intorno al santuario con la schiena contro la parete e gli occhi sul pavimento, un passo
            laterale alla volta. La striscia di pietra lungo il muro è larga quanto un piede, e la polvere che
            la copre è liscia e senza impronte. Ci metti un'ora, e per tutto il tempo hai in bocca il pensiero
            dell'acqua, come una canzone che non se ne va. Dall'altra parte bevi un sorso dalla tua borraccia,
            e poi un altro, e l'acqua della città ti sembra sapere di latta più del solito. La bevi lo stesso
            fino all'ultima goccia.
          effetti: { profondita.segrete-dell-ira: 1, tormento: 1 }

  # ------------------------------------------------------------ Uzgreth alle fosse (facoltativo)
  - id: uzgreth-alle-fosse
    immagine: personaggi/uzgreth
    titolo: Uzgreth alle fosse
    sommario: "Una camera fredda con undici portelli nel pavimento, e un orco deforme con uno spadone da ogre che ne fa la guardia."
    luogo: Segrete dell'Ira, le fosse dei prigionieri
    area: segrete-dell-ira
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 2, avuto.spadone-di-uzgreth == 0]
    testo: |
      La camera ha il soffitto ad arco ed è più fredda delle altre, tanto che alla luce della lampada il fiato
      ti esce in una nuvola. Sul pavimento ci sono undici portelli di legno sopra altrettante fosse, e dal
      buio là sotto salgono rumori soffocati. Le assi dei portelli sono nere e gonfie, e le cornici di pietra
      in cui sono incassate hanno ancora gli spigoli vivi. Quando entri i rumori si fermano tutti insieme, e
      dopo un poco ricominciano.

      In mezzo ai portelli c'è un orco più tozzo di qualunque orco tu abbia visto, con la pelle di un colore
      malato e gli occhi rossi di sangue. Regge sulla spalla uno spadone enorme. *La spada da ogre dei Nove
      Chiodi, quella che secondo Ilvaena era troppo grande anche per lui.* Adesso gli sta in mano come se
      l'avessero forgiata su misura.

      «Il Demone ha chiesto a Uzgreth di guardare il suo gregge» dice. «Uzgreth fa quello che dice il Demone,
      e il Demone dice di squartare gli intrusi insolenti.» Sposta il peso, e un portello sotto di lui
      scricchiola.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "È enorme, e lo spadone gli sta in mano come un giocattolo. Però è lento, e lo sa anche lui."
        combattimento: le-fosse
        vittoria:
          titolo: Lo spadone
          testo: |
            Uzgreth mena colpi che spaccano i portelli e fanno volare le schegge, e dalle fosse aperte si
            alzano mani grigie. Tu resti sempre dove lui non arriva. Quando finalmente cade lungo disteso, lo
            spadone gli scivola dalle dita. Lo raccogli con tutte e due le mani, e pesa quanto un bambino.
            L'elsa è ancora calda della sua mano e la lama è fredda. Le braccia ti tremano ancora per i colpi
            parati. Sotto i portelli rotti i morti delle fosse si agitano e restano giù, e le mani grigie
            tornano nel buio una dopo l'altra.
          effetti: { oggetto.spadone-di-uzgreth: 1, profondita.segrete-dell-ira: 1, racconto: 1 }
        sconfitta:
          titolo: Il gregge
          testo: |
            Lo spadone ti prende di piatto e ti manda a sbattere contro un portello, che si apre sotto di te.
            Le gambe ti finiscono nel buio della fossa, e qualcosa di freddo ti stringe la caviglia. Ha dita
            lunghe e lisce, e stringe senza fretta. Ti tiri fuori a forza di braccia e scappi dalla camera, e
            Uzgreth non ti insegue. Lo senti ripetere che il Demone sarà contento, e la caviglia ti resta
            fredda fino alla galleria dopo.
      - testo: "Fargli mettere il piede su un portello"
        descrizione: "I portelli scattano come trappole. Uno sotto quel peso deve essere il più marcio."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il portello marcio
          testo: |
            Guardi i portelli uno per uno finché trovi quello con i cardini mangiati dalla ruggine fino a
            sfogliarsi, e ti metti dall'altra parte, a provocarlo. Il portello scatta sotto il suo piede con
            un rumore di legno bagnato, e lui va giù nella fossa fino alle spalle. Lo spadone è troppo largo e
            resta di traverso sul bordo. Dal fondo i morti lo tirano per le gambe, e lui li chiama gregge fino
            all'ultimo. Prendi lo spadone e te ne vai prima di sentire come finisce.
          effetti: { oggetto.spadone-di-uzgreth: 1, profondita.segrete-dell-ira: 1, racconto: 1 }
        fallimento:
          titolo: Il portello sbagliato
          testo: |
            Il portello che hai scelto regge, e Uzgreth ti arriva addosso con lo spadone alto. La lama ti apre
            la coscia mentre ti butti di lato, e scappi dalla camera trascinando la gamba. Da dietro arriva la
            sua voce profonda, che conta i portelli uno per uno mentre tu li scavalchi, e a ogni numero dalla
            fossa qualcosa batte contro il legno. Ti fermi a stringere la coscia con la cintura soltanto
            quando la voce è lontana, e il sangue continua a passare sotto il cuoio.
          effetti: { ferite: 2 }
      - testo: "Dirgli che ti manda il Demone"
        descrizione: "Uzgreth obbedisce al Demone. Non è detto che sappia riconoscere chi parla per lui."
        prova: { attributo: sociale, abilita: [ingannare, persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Gli ordini del Demone
          testo: |
            Gli dici che il Demone ti ha chiamat{o|a} giù, e che è arrabbiato perché lo fanno aspettare.
            Uzgreth ti guarda a lungo con i suoi occhi rossi, poi abbassa lo spadone. «Il Demone è sempre
            arrabbiato» dice, e si sposta di lato, attento a dove mette i piedi. Passi fra i portelli senza
            correre, e sotto le assi i rumori si fermano mentre ci passi sopra. Senti il suo sguardo sulla
            nuca fino alla porta.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Insolente
          testo: |
            Uzgreth ti ascolta fino alla fine. «Il Demone non manda nessuno» dice, scandendo le parole come un
            maestro con un allievo lento. «Il Demone chiama Uzgreth.» Lo spadone arriva dal basso, e ti prende
            al fianco mentre già corri verso la porta. Ti fermi due gallerie più in là a tamponarti la ferita
            con la camicia, che si inzuppa subito e ti si incolla calda alla pelle. Da lì senti ancora la sua
            voce che ripete la lezione alle fosse, e dalle fosse un rumore di unghie sul legno.
          effetti: { ferite: 2 }
      - testo: "Passare lungo il muro mentre parla"
        descrizione: "Uzgreth parla volentieri, e quando parla guarda il soffitto."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Lungo il muro
          testo: |
            Uzgreth ricomincia a parlare del Demone e del suo gregge, con gli occhi rossi rivolti all'arco del
            soffitto. Ti muovi lungo il muro mettendo i piedi solo sulla pietra lontano dai portelli. Lì il
            pavimento è consumato in una striscia liscia, larga il doppio del tuo piede, dove qualcuno più
            pesante di te ha fatto lo stesso giro per molto tempo. Quando da una fossa sale un gemito più
            forte degli altri resti con un piede sollevato, e lo rimetti giù soltanto quando il gemito si
            spegne. Arrivat{o|a} alla porta hai le unghie piantate nei palmi. Ti volti, e lui sta ancora
            parlando, con la testa all'indietro e lo spadone appoggiato alla spalla.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il portello che scricchiola
          testo: |
            Metti il piede su un portello che sembrava pietra, e il legno scricchiola. Sotto il legno qualcosa
            si sposta verso il tuo piede. Uzgreth abbassa gli occhi su di te, lentamente, come se la cosa lo
            annoiasse. Ti butti verso la porta, e lo spadone ti passa così vicino che senti il vento sul
            collo, poi la punta ti prende la spalla e ci entra fino all'osso. Esci dalla camera con il braccio
            che pende e la sua voce che ti chiama insolente, una sillaba alla volta, come se ti stesse
            insegnando la parola.
          effetti: { ferite: 2 }
      - testo: "Rispondergli con la voce dei sorveglianti"
        descrizione: "A Ghoran hai sentito per anni come gridano quelli che fanno la guardia ai recinti."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [intimidire], difficolta: Media }
        successo:
          titolo: Il gregge contato
          testo: |
            Riempi il petto e gli gridi addosso come gridavano i sorveglianti di Ghoran, con le parole corte e
            lo sguardo piantato sopra la sua testa. Gli dici che il Demone vuole il gregge contato, e che lo
            vuole adesso. Uzgreth abbassa lo spadone e comincia a contare i portelli a voce alta, uno per uno,
            con la fronte aggrottata. A ogni numero la voce gli rimbomba sotto l'arco, e la fossa che ha
            appena contato smette di fare rumore. Tu passi fra le fosse mentre arriva a sette.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: "Un{o|a} del gregge"
          testo: |
            A metà della seconda frase la voce ti si incrina, e ne esce la tua voce di prima, di quando stavi
            sotto. Uzgreth inclina la testa e ti guarda come si guarda una bestia scappata dal recinto. Lo
            spadone arriva dal basso e ti prende al fianco mentre già corri verso la porta. Ti fermi a
            tamponare la ferita soltanto due gallerie più in là, con la camicia incollata alla pelle e il suo
            conto dei portelli che ti arriva ancora dal buio. Ti accorgi che lo stai seguendo a fior di
            labbra, un numero dietro l'altro.
          effetti: { ferite: 2 }
      - testo: "Correre sui portelli come sulle piattaforme"
        descrizione: "Uno come Uzgreth, se lo fai correre, il piede lo mette dove capita."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [atletica, tecnologia], difficolta: Difficile }
        successo:
          titolo: L'asse che non regge
          testo: |
            Corri fra le fosse saltando da un bordo di pietra all'altro, come sulle impalcature quando il
            turno è finito e la scala è lontana, e guardi i cardini di ogni portello che scavalchi. Uzgreth ti
            insegue dritto, perché è così che fa tutto, e il portello scatta sotto il suo piede con un rumore
            di legno bagnato. Va giù nella fossa fino alle spalle, e lo spadone è troppo largo e resta di
            traverso sul bordo. Dal fondo i morti lo tirano per le gambe, e lui li chiama gregge fino
            all'ultimo. Prendi lo spadone e te ne vai prima di sentire come finisce.
          effetti: { oggetto.spadone-di-uzgreth: 1, profondita.segrete-dell-ira: 1, racconto: 1 }
        fallimento:
          titolo: Il bordo sbagliato
          testo: |
            Al terzo salto il bordo di pietra che avevi scelto è un portello dipinto di polvere, e il piede ti
            affonda fino al ginocchio nel legno marcio. Dal buio sotto le assi sale un odore di cantina chiusa
            da anni. Ti tiri fuori mentre Uzgreth arriva, e lo spadone ti apre la coscia prima che tu sia di
            nuovo in piedi. Scappi dalla camera trascinando la gamba, e la sua voce profonda conta i portelli
            dietro di te, uno per uno, finché non svolti nella galleria.
          effetti: { ferite: 2 }
      - testo: "Parlargli come al servitore di un'altra casa"
        descrizione: "Nei Quartieri Alti si impara presto come si parla al servitore di un'altra casa perché ti lasci passare senza disturbare il padrone."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Media }
        successo:
          titolo: "Attes{o|a}"
          testo: |
            Non alzi la voce e non lo guardi negli occhi più del dovuto. Gli fai sapere di essere attes{o|a},
            e lasci a lui di immaginare chi dovrà spiegare al Demone il ritardo. Uzgreth sbatte le palpebre
            rosse, guarda lo spadone come se non si ricordasse più di chi è, e si fa da parte con un mezzo
            inchino goffo. Il pavimento fra i portelli è sporco di schegge e di terra, e tu lo attraversi a
            passo di salotto. Soltanto sulla porta ti accorgi che tieni ancora il mento alto, come ti avevano
            insegnato da bambin{o|a}.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il pastore
          testo: |
            Ti ascolta fino in fondo, con la testa piegata da una parte e la fronte aggrottata, e intanto lo
            spadone gli scivola piano dalla spalla al pugno. «Uzgreth non è un servo» dice alla fine. «Il
            Demone ha messo qui il pastore.» Lo spadone arriva dal basso e ti prende al fianco mentre già ti
            volti verso la porta. Ti fermi due gallerie più in là a tamponarti la ferita con un fazzoletto
            ricamato che si inzuppa subito, e senti ancora la sua voce che ripete la parola pastore alle
            fosse, come per impararla meglio.
          effetti: { ferite: 2 }

  # ------------------------------------------------------------ il cuore · 6 → 7
  - id: l-aula-dell-ira
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: L'Aula dell'Ira
    sommario: "Una cattedrale sotto la città, due vasche, un cerchio di teschi e un demone con quattro braccia che ha perso il senno."
    luogo: Segrete dell'Ira, l'Aula dell'Ira
    area: segrete-dell-ira
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira >= 4]
    testo: |
      L'Aula è alta quanto la navata della Cattedrale e più fredda di una cantina d'inverno, e il fiato ti
      esce in nuvole. Le pareti sono coperte di rune incise a punta, e i solchi hanno ancora lo spigolo vivo.
      Al centro c'è una vasca larga circondata da un cerchio di teschi in equilibrio su spuntoni di pietra, e
      ogni teschio è levigato e lucido, senza un grumo di terra nelle orbite. In fondo due scalinate salgono a
      un pulpito, dove gorgoglia una seconda vasca triangolare piena di un liquido arancione. Il liquido
      ribolle e dal pulpito non arriva nessun calore, e sul soffitto getta una luce a scatti.

      Accanto al pulpito sta il demone. È alto più di tre metri, con la pelle color ruggine e la testa di un
      coccodrillo dalle zanne ricurve. Delle sue quattro braccia, le due di sopra finiscono in chele enormi e
      quelle di sotto sono sottili come mani d'uomo. Ha gli occhi intelligenti e completamente pazzi.

      «Maledetti! Avete osato violare il santuario della Covatrice di Orrori!» urla, e la voce ti vibra nello
      sterno. Con una mano piccola si taglia il polso sopra la vasca triangolare, dove la pelle è già segnata
      da file di tagli vecchi. Il sangue cade nel liquido arancione senza fare un cerchio. La luce sul
      soffitto trema e accanto a lui l'aria si crepa come uno specchio. Ne esce una figura glabra sulle gambe
      piegate al contrario, poi la crepa si richiude.

      {magia Difficile} Il Mana della vasca cala di colpo quando la crepa si apre, e non torna dov'era quando
      si richiude. Ogni Colata gli costa sangue e un dito di vasca, e il patto che lo tiene qui lo sta pagando
      un taglio alla volta.

      «Dona la tua anima colma di rancore al possente Yoggoth, e anche tu sarai una Colata dell'Ira al
      servizio della sacra Regina!»

      {origine accolito-del-velo} Il demone parla della sua Regina con la voce che in Cattedrale si usa per le
      letture solenni. La mano ti va da sola al segno dell'Albero.
    opzioni:
      - testo: "Affrontarli tutti e due"
        descrizione: "Un demone con quattro braccia e una Colata appena nata. Alle spalle hai le Segrete."
        combattimento: l-aula-dell-ira
        vittoria:
          titolo: Il possente Yoggoth
          testo: |
            La Colata ti viene addosso per prima a quattro zampe, e quando la abbatti cola sul pavimento in
            una pozza grigia. Poi c'è soltanto Yoggoth, con le chele che spaccano i teschi del cerchio. Quando
            finalmente cade sui gradini del pulpito non si rialza più, e la luce della vasca triangolare si
            abbassa e poi torna piano quella di prima. Alla sua cintura c'è un cilindro di lyssan inciso con
            grande cura e pieno di ammaccature, con dentro un rotolo di pergamena coperto di simboli senza
            senso. Le incisioni sono fitte e regolari, e i colpi le hanno schiacciate senza scheggiarle in
            nessun punto.

            Prima di andartene ti volti verso il pulpito, e la vasca è ancora piena fino all'orlo.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1, racconto: 1 }
          vai: citta-bassa
        sconfitta:
          titolo: L'ultimo taglio
          testo: |
            La Colata la abbatti, ma Yoggoth ti prende con una chela e ti scaraventa contro il cerchio di
            teschi, che rotolano sul pavimento intorno a te. Mentre ti rialzi lui si taglia di nuovo il polso
            sopra la vasca, e poi ancora, per chiamare un'altra Colata che ti finisca. Al quarto taglio la
            vasca non gli risponde più, e il sangue cade nel liquido arancione senza che l'aria si muova.
            Yoggoth la guarda con le mani piccole che tremano e taglia ancora, finché si accascia sui gradini
            del pulpito in una pozza del suo sangue e non si muove più.

            Dalla sua cintura prendi un cilindro di lyssan ammaccato. Mentre ti trascini verso l'uscita la
            vasca riprende a gorgogliare, e torni in Città Bassa all'alba, piegat{o|a} in due.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1 }
          vai: citta-bassa
      - testo: "Provocarlo finché svuota la vasca"
        descrizione: "Ogni Colata costa qualcosa alla vasca, e lui se n'è accorto. Bisogna fargliene chiamare troppe."
        prova: { attributo: sociale, abilita: [intimidire, ingannare, espressivita], difficolta: Difficile }
        successo:
          titolo: Il possente
          testo: |
            Gli ridi in faccia e gli dai del lucertolone, poi di peggio, con un'inventiva che non sospettavi
            di avere. Yoggoth ruggisce e si taglia il polso, e tu corri intorno al cerchio di teschi con la
            Colata che ti insegue a scatti. Ogni insulto gli costa un taglio e ogni taglio abbassa la vasca,
            che lascia sulla pietra del bordo una riga arancione dopo l'altra. Alla fine Yoggoth cade sui
            gradini svuotato del suo sangue e non si rialza più. La luce della vasca torna piano quella di
            prima.

            Dalla sua cintura prendi un cilindro di lyssan ammaccato, con un rotolo di pergamena dentro. In
            Città Bassa arrivi a notte fonda, senza voce.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1, racconto: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Troppe
          testo: |
            Lo provochi, e lui ti prende in parola, più in fretta di quanto avessi messo in conto. Le Colate
            escono una dopo l'altra e tu corri intorno al cerchio di teschi finché una ti prende alla schiena
            e un'altra ti si attacca alla gamba con le manine che ha al posto dei denti. Yoggoth continua a
            tagliarsi anche quando la vasca non gli risponde più, e alla fine si accascia sui gradini del
            pulpito con le mani piccole aperte e non respira più.

            Gli sfili dalla cintura un cilindro di lyssan ammaccato. Mentre risali le Segrete trascinandoti,
            alle tue spalle la vasca riprende a gorgogliare.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1, ferite: 2.5 }
          vai: citta-bassa
      - testo: "Scacciarlo con l'esorcismo"
        descrizione: "La Liturgia dell'Albero ha parole per ciò che non dovrebbe restare. Un demone non dovrebbe restare da nessuna parte."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Le parole dell'Albero
          testo: |
            Dici le parole della Liturgia a voce alta, e la voce ti esce più ferma delle gambe, che tremano
            per conto loro sotto la giubba. A ogni frase Yoggoth si fa più piccolo dentro la sua pelle color
            ruggine, come un vestito che resta vuoto, e la Colata accanto a lui si scioglie sul pavimento.
            All'ultima parola il demone si accascia sui gradini del pulpito e non si muove più, e le chele si
            aprono da sole con uno scatto secco delle giunture. Fra le pieghe della pelle vuota trovi un
            cilindro di lyssan ammaccato, con un rotolo di pergamena dentro.

            La vasca, dietro di te, gorgoglia ancora.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1, racconto: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Mezza Liturgia
          testo: |
            A metà formula sbagli una parola, e il Mana ti torna indietro come una frustata dietro gli occhi.
            Yoggoth barcolla lo stesso, ferito da quello che è arrivato. Per la rabbia si apre il polso sopra
            la vasca, e poi di nuovo e di nuovo, finché la vasca non gli dà più niente e lui crolla sui
            gradini svuotato, senza più rialzarsi.

            Ti cola sangue dal naso, e sul labbro lo senti freddo. Dalla sua cintura prendi un cilindro di
            lyssan ammaccato. Sulla soglia ti volti, e la vasca si è già rimessa a gorgogliare.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1, ferite: 1.5, tormento: 1.5 }
          vai: citta-bassa
      - testo: "Offrirgli la tua rabbia"
        descrizione: "Vuole un'anima colma di rancore. La tua ne ha, e lui non chiede di meglio."
        costo: 2
        esito:
          titolo: Il patto
          testo: |
            Ti inginocchi davanti al pulpito, e Yoggoth scende i gradini con gli occhi accesi. Il fiato che
            gli esce fra le zanne è freddo quanto l'Aula. Le mani piccole ti afferrano le tempie e le unghie
            ti entrano nella pelle, e senti la rabbia che ti esce dalla testa, tutta quella che hai raccolto
            dalla sera della razzia. L'aria si crepa, e la Colata che ne esce è fatta della tua rabbia, che in
            questo momento ce l'ha con chi ti sta frugando nella testa. Gli salta alla gola con tutte le mani
            della bocca e l'altra Colata le va dietro. Yoggoth cade all'indietro nella vasca triangolare con
            tutte e due addosso. Il liquido si richiude sopra le chele senza un'onda, e nessuno dei tre
            riemerge.

            Sui gradini, caduto dalla sua cintura, trovi un cilindro di lyssan ammaccato.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1, tormento: 1.5, ferite: 0.5 }
          vai: citta-bassa
