# Acciaio e Ira, seconda metà (pista.acciaio 5 → 7): il diario di Isvaro letto al Grifone, il tunnel dei
# contrabbandieri sotto l'Acciaieria e la spedizione nelle Segrete dell'Ira, con Uzgreth alle fosse e
# Yoggoth nell'Aula dell'Ira.
#
# - `il-diario-di-isvaro` (5 → 6): Liaren legge il diario ad alta voce, una parte alla volta (quality
#   nascoste diario.*), poi si sceglie a chi portarlo.
# - `il-tunnel-dei-contrabbandieri` (pista 6, la prima volta): A19, A22, A23, il masso finto, la caverna
#   degli orchi; chi trova il passaggio prende `tunnel.segrete` ed entra nelle Segrete.
# - `di-nuovo-nel-tunnel` (pista 6, le volte dopo): rientro nella spedizione.
# - area `segrete-dell-ira`: sette stanze ripetibili (B1, B4, B6, B7, B8, B11, B12) in fasce di
#   profondità, 0 le gallerie dopo la statua (la caverna di guardia o la vasca dei teschi), 1 la prigione
#   o la sala degli interrogatori, 2 lo studio delle sette punte oppure Uzgreth alle fosse (B9, storia
#   facoltativa), 3 la camera sospesa o il santuario. Poi il cuore `l-aula-dell-ira` (B13), che in ogni
#   ramo porta pista.acciaio a 7, pozzo-dell-ira a 5, dà il cilindro di lyssan e riporta in Città Bassa.
quality:
  - { id: tunnel.segrete, nome: "Il passaggio del masso finto", categoria: stato, nascosta: true, descrizione: "Sai dov'è il masso finto in fondo al tunnel dei contrabbandieri." }
  - { id: diario.mappe, nome: Hai visto le mappe del diario, categoria: stato, nascosta: true }
  - { id: diario.razzia, nome: Liaren ti ha letto la pagina della razzia, categoria: stato, nascosta: true }
  - { id: diario.piano, nome: Liaren ti ha letto la pagina del tunnel, categoria: stato, nascosta: true }
  - { id: diario.amata, nome: Liaren ti ha letto la pagina dell'amata, categoria: stato, nascosta: true }
  - { id: diario.fratello, nome: Hai parlato a Liaren di Isvaro, categoria: stato, nascosta: true }

aree:
  - id: segrete-dell-ira
    immagine: ambientazione/rovine-dei-precursori
    nome: Segrete dell'Ira
    sommario: "Oltre il masso finto del tunnel dei contrabbandieri, gallerie più vecchie di Qir-Azel scendono nel freddo."
    spedizione: { ritorno: citta-bassa, soglia: 4, stanze: 3 }
    testo: |
      Oltre il muro abbattuto la galleria sale fino a una sala di pietra
      liscia. Al centro c'è la statua di marmo rosso di una donna bellissima
      con la faccia storta dalla rabbia, che stringe un libro dalla stella a
      sette punte nella sinistra e una corsesca d'avorio nella destra. Da qui
      le Segrete si diramano in gallerie basse, e da sotto il pavimento sale
      ogni tanto un rumore sordo che ti arriva nei denti.

storylet:
  # ------------------------------------------------------------ 5 → 6 · il diario di Isvaro
  - id: il-diario-di-isvaro
    presso: grifone-di-ferro
    immagine: personaggi/liaren-tarvelin
    titolo: Il diario di Isvaro
    sommario: "Liaren è a letto con il fianco fasciato, e sul comodino c'è il diario di Isvaro."
    luogo: Locanda del Grifone di Ferro, la stanza di Liaren
    area: ponti-sospesi
    requisiti: [pista.acciaio == 5]
    testo: |
      Liaren passa i giorni dopo l'Acciaieria a letto, con il fianco fasciato
      e il samisen sulle ginocchia, girandone un pirolo senza suonare.
      Brunella ha chiuso la porta a chiave e si è seduta sulla cassapanca con
      il mestolo in grembo.

      Accanto al diario di Isvaro, sul comodino, c'è il mazzo di chiavi di
      Ondrel riportato dalla Caserma, e Liaren te lo mette in mano senza
      guardarlo.

      «L'elfico l'ho imparato a undici anni, per scrivergli all'Accademia»
      dice. «Leggo io e te lo scrivo su un foglio. Brunella, tu non dici
      niente finché non ho finito.»

      {origine allievo-di-torvessa} Isvaro è cresciuto nelle aule
      dell'Accademia dove studi tu, e se chiedessi a Orvald Temmerin se se lo
      ricorda, risponderebbe a un'altra domanda.

      {empatia Media} Legge lei anche perché, se leggessi tu, dovrebbe
      guardarti in faccia mentre ascolta.
    opzioni:
      - testo: "Sfogliare le mappe"
        descrizione: "Metà del diario è Qir-Azel disegnata a inchiostro, strada per strada, con le frecce."
        immagine: ambientazione/evento-razzia-festival-150
        requisiti: [diario.mappe == 0]
        costo: 0
        esito:
          titolo: Quaranta e quattrocento
          testo: |
            Le mappe disegnano la Città Bassa casa per casa. Una pagina cerchiata
            è il piano d'attacco per una banda di quaranta orchi, con le frecce
            che salgono dall'Acciaieria alla piazza del Festival; le pagine dopo
            sono per quattrocento orchi, piene di croci calcate fino a bucare la
            carta.

            {origine figlio-della-citta-bassa} Una freccia passa davanti al
            cortile del bottaio dove rubavi i cerchi di ferro.
          imposta: { diario.mappe: 1 }
          segue: il-diario-di-isvaro
      - testo: "Farle leggere la prima pagina scritta"
        descrizione: "Dopo le mappe le righe si fanno fitte. Liaren si schiarisce la voce."
        immagine: personaggi/ondrel-tarvelin
        requisiti: [diario.razzia == 0]
        costo: 0
        esito:
          titolo: La razzia
          testo: |
            «La razzia è andata come doveva» legge Liaren. «Abbiamo perso pochi orchi
            di Capomozzo e preso la bara di Sollen mentre i bifolchi guardavano da
            un'altra parte. Quel bastardo di mio padre l'ho costretto a tacere
            sull'Acciaieria, o avrei raccontato a tutti come ha tolto di mezzo la
            mamma con l'aiuto di Vesh e dei suoi tagliagole. Gli ho fatto sparire
            anche ogni carta che in città nomini Capomozzo.» Sulla parola mamma le si
            incrina la voce.

            {origine rampollo-dei-quartieri-alti} Nei salotti la morte di Maerith
            Tarvelin fu una febbre, e se ne parlò per una stagione.
          imposta: { diario.razzia: 1 }
          segue: il-diario-di-isvaro
      - testo: "Farle leggere la seconda pagina"
        descrizione: "Qui la calligrafia è più nervosa, e c'è un nome sottolineato."
        immagine: ambientazione/acciaieria-di-qir-azel
        requisiti: [diario.piano == 0]
        costo: 0
        esito:
          titolo: Il tunnel dei contrabbandieri
          testo: |
            «Balthog vuole un assalto in massa, via terra» legge Liaren. «Per me è
            un errore. Dovremmo far salire i mostri del demone delle Segrete per
            il tunnel dei contrabbandieri che sbuca nell'Acciaieria di mio padre,
            e poi entrare dal fiume a piccoli gruppi. Sono tutti d'accordo tranne
            Zagrath, che lo fa per farmi arrabbiare. La mia adorata Aurenne pensa
            solo ai livelli inferiori, e dice che quando avrà liberato il
            Costruttore lo metterà ai suoi ordini. Quell'idiota di Garin crede
            ancora che serviamo il Culto dell'Anonimo, e Kessa comincia a
            sospettare qualcosa.»
          imposta: { diario.piano: 1 }
          segue: il-diario-di-isvaro
      - testo: "Farle leggere l'ultima pagina"
        descrizione: "L'ultima pagina scritta sta prima dell'ultimo ritratto."
        immagine: ambientazione/mito-regina-ali-spezzate
        requisiti: [diario.amata == 0]
        costo: 0
        esito:
          titolo: La mano nuova
          testo: |
            «La mia amata vuole andare fino in fondo» legge Liaren, a voce più
            bassa. «Resta convinta di essere brutta, e vuole togliersi di dosso
            quella che chiama la sua corruzione celestiale per metterci la grazia
            della sua nuova madre, la Regina delle Ali Spezzate. La trasformazione
            è cominciata quando ha bruciato i resti di suo padre al santuario di
            Capomozzo. Spero che quando offrirà Qir-Azel alle fiamme di Nhar'Kael
            sia meno orrenda. Anche le succubi sono demoni, no?» Nel ritratto dopo
            la donna ha due ali da pipistrello e una mano nera e artigliata sul
            ventre.
          imposta: { diario.amata: 1 }
          segue: il-diario-di-isvaro
      - testo: "Raccontarle di Isvaro"
        descrizione: "Sul gradino le hai detto soltanto che è scappato. Adesso vuole sapere come."
        requisiti: [diario.fratello == 0, isvaro == 1]
        costo: 0
        esito:
          titolo: La finestra del dormitorio
          testo: |
            Le racconti com'è scappato dalla fornace. «All'Accademia scappava
            dalla finestra del dormitorio tutte le settimane» dice Liaren dopo un
            po'. «Tornava sempre per cena, perché i ragazzi tornano quando hanno
            fame. Adesso gli dà da mangiare qualcun altro.» Gira il pirolo finché
            la corda geme, e Brunella le ferma il polso.
          imposta: { diario.fratello: 1 }
          segue: il-diario-di-isvaro
      - testo: "Raccontarle di Isvaro"
        descrizione: "Isvaro è alla Caserma da quando la ronda l'ha portato via. Liaren non ti ha ancora chiesto come sta."
        requisiti: [diario.fratello == 0, isvaro == 2]
        costo: 0
        esito:
          titolo: Il pane dolce
          testo: |
            Le racconti che Isvaro è chiuso in una cella della Caserma. «Quando
            torna, Galdrick proverà a farlo parlare» dice Liaren. «Io a trovarlo
            non ci vado. Una volta ci andavo ogni settimana, con il pane dolce di
            Brunella nel cestino, e lui lo mangiava tutto senza dire grazie.»
          imposta: { diario.fratello: 1 }
          segue: il-diario-di-isvaro
      - testo: "Raccontarle di Isvaro"
        descrizione: "Isvaro è morto in fondo alla scala dei magazzini. Liaren vuole sapere se ha detto qualcosa."
        requisiti: [diario.fratello == 0, isvaro == 3]
        costo: 0
        esito:
          titolo: I mozziconi
          testo: |
            Le racconti che in cima alla scala si è girato per parlarti e non ha
            fatto in tempo. «Da piccolo aveva paura del buio» dice Liaren alla
            fine. «All'Accademia gli spegnevano la candela tutte le sere, e io gli
            portavo i mozziconi di nascosto.» Poi stringe il pirolo finché la
            corda si spezza.
          imposta: { diario.fratello: 1 }
          segue: il-diario-di-isvaro
      - testo: "Portare il diario alla Cattedrale del Velo"
        descrizione: "Un demone sotto la città e la Regina delle Ali Spezzate. Al Velo queste cose devono saperle."
        immagine: personaggi/padre-vantes
        requisiti: [diario.mappe == 1, diario.razzia == 1, diario.piano == 1, diario.amata == 1]
        esito:
          titolo: Le copie dei novizi
          testo: |
            In sacrestia Padre Vantes legge la traduzione di Liaren muovendo le
            labbra, e alla Regina delle Ali Spezzate le sue dita tracciano da sole il
            segno dell'Albero. Fa copiare le mappe durante la notte e la mattina dopo
            ti restituisce il diario legato con un nastro bianco. «Lei intanto guardi
            in quel tunnel, prima che ci guardi qualcun altro.»
          effetti: { pista.acciaio: 1, rep.velo: 1 }
      - testo: "Tenerlo per Galdrick"
        descrizione: "Lo sceriffo è a Ghoran. Quando torna, deve trovare tutto pronto."
        immagine: personaggi/toren-galdrick
        requisiti: [diario.mappe == 1, diario.razzia == 1, diario.piano == 1, diario.amata == 1]
        esito:
          titolo: Un rapporto per lo sceriffo
          testo: |
            Alla Caserma il sergente di guardia ti dà carta e penna, e ti ci vuole
            un'ora buona per scrivere tutto, dalle mappe ai nomi. Il foglio
            finisce nel cassetto con l'etichetta *Galdrick*, accanto a una crosta
            di pane che è lì da prima della razzia, e il diario lo tieni tu finché
            lo sceriffo non torna.
          effetti: { pista.acciaio: 1, rep.caserma: 1 }
      - testo: "Tenerlo e non parlarne con nessuno"
        descrizione: "Liaren te lo chiede con la mano sul tuo polso. Il resto è roba di famiglia."
        immagine: personaggi/liaren-tarvelin
        requisiti: [diario.mappe == 1, diario.razzia == 1, diario.piano == 1, diario.amata == 1]
        esito:
          titolo: Roba di famiglia
          testo: |
            «Mio padre è morto» dice Liaren. «Se in città si sa di mia madre e di
            Vesh, domani il Grifone si riempie di gente venuta a guardarmi in faccia.
            Tienilo tu.» Brunella si schiarisce la voce, chiede se può parlare e
            scende a prendere la zuppa.

            {origine rampollo-dei-quartieri-alti} Nei Quartieri Alti una storia così
            farebbe il giro dei salotti in una sera.
          effetti: { pista.acciaio: 1, rep.tarvelin: 1 }
      - testo: "Portare il diario a Ottilia Sanvel"
        descrizione: "Ottilia tiene gli archivi minori della Cattedrale, e delle carte che non devono uscire si occupa lei."
        quando: [origine.accolito-del-velo >= 1]
        requisiti: [diario.mappe == 1, diario.razzia == 1, diario.piano == 1, diario.amata == 1]
        esito:
          titolo: Gli archivi minori
          testo: |
            Ottilia Sanvel legge la traduzione di Liaren accanto allo scaffale
            degli archivi minori, e alla Regina delle Ali Spezzate non cambia
            espressione. La mattina dopo, con le mappe copiate dai novizi, ti
            restituisce il diario legato con un nastro bianco. «Le copie restano
            qui e la Madre sarà informata» dice, «e tu intanto guarda in quel
            tunnel, prima che ci guardi qualcun altro.»
          effetti: { pista.acciaio: 1, rep.velo: 1 }

  # ------------------------------------------------------------ 6 · il tunnel dei contrabbandieri (la prima volta)
  - id: il-tunnel-dei-contrabbandieri
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Il tunnel dei contrabbandieri
    sommario: "Sotto l'Acciaieria c'è un muro abbattuto a mazzate, e dietro un tunnel lungo quasi un chilometro."
    luogo: Acciaieria dei Tarvelin, i sotterranei
    area: citta-bassa
    requisiti: [pista.acciaio == 6, tunnel.segrete == 0]
    testo: |
      La chiave più grossa del mazzo di Ondrel apre la porta delle consegne.
      Nel magazzino della sabbia i mattoni del muro abbattuto sono impilati
      in ordine contro le carriole.

      {conoscenze-della-strada Media} Chi li ha impilati come merce il
      mestiere dei contrabbandieri lo conosceva, o lo faceva.

      Dietro il buco c'è la stanza dove i contrabbandieri facevano i conti e
      Isvaro ha passato le ultime notti. *Anche ubriaco, ha messo in fila le
      bottiglie.* Sulla mensola sono allineate per altezza, con l'etichetta
      in fuori.

      {origine mercante-dei-ponti} Le tacche sulle gambe del tavolo sono
      raggruppate a cinque con una barra di traverso, come ai banchi dei
      Ponti, e segnano soltanto entrate.

      Oltre la stanza il tunnel corre per quasi un chilometro verso nord-est
      e finisce contro un muro liscio, con la polvere davanti battuta da
      molti piedi larghi.
    opzioni:
      - testo: "Cercare le giunture nella roccia"
        descrizione: "I piedi larghi arrivano fino al muro e lì si fermano. Gli orchi da qualche parte sono passati."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il masso finto
          testo: |
            Passi la lampada sulla roccia palmo per palmo, e in basso a sinistra
            la luce non fa ombra dove dovrebbe. La mano ci entra dentro, fredda
            come l'acqua di un pozzo, perché il masso è un'illusione. Dall'altra
            parte c'è una caverna con i giacigli degli orchi e una porta di legno
            chiusa, e la galleria a ovest prosegue oltre un muro abbattuto da
            poco.
          imposta: { tunnel.segrete: 1 }
          vai: segrete-dell-ira
        fallimento:
          titolo: La roccia
          testo: |
            Per un'ora tasti la roccia in ginocchio e in punta di piedi, finché
            l'olio della lampada cala di un dito e ti sorprendi a bussare piano,
            come a una porta. La pietra è liscia e fredda dappertutto, e risali
            con le dita indolenzite.
          effetti: { tormento: 1 }
      - testo: "Sentire il Mana nella roccia"
        descrizione: "Un muro in fondo a un chilometro di tunnel è strano, e se è Mana le dita lo sentono."
        incantesimo: leggere-il-mana
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il formicolio
          testo: |
            Lasci andare il Mana nella roccia, e in basso a sinistra senti un formicolio fitto,
            come di un arto che si risveglia. Il masso è un incantesimo, e ci passi attraverso
            a occhi chiusi. Dall'altra parte c'è una caverna con i giacigli degli orchi e una
            porta di legno chiusa, e la galleria a ovest prosegue oltre un muro abbattuto da
            poco.
          imposta: { tunnel.segrete: 1 }
          vai: segrete-dell-ira
        fallimento:
          titolo: Il ronzio
          testo: |
            Il Mana ti torna indietro tutto insieme e ti fa ronzare la roccia nei
            denti, e ti ritrovi seduto per terra con la lampada rovesciata e un
            sapore di rame in bocca. Risali il tunnel stringendo le chiavi di
            Ondrel fino a stamparti i loro denti nel palmo.
          effetti: { tormento: 1 }
      - testo: "Appoggiarti al muro e spingere"
        descrizione: "Le impronte finiscono contro il muro. Tu sei stanco, e il muro sembra fatto apposta per appoggiarcisi."
        costo: 2
        esito:
          titolo: Dall'altra parte
          testo: |
            Ti appoggi al muro con la spalla per riposare, e la spalla ci affonda
            dentro. Cadi attraverso la pietra e atterri sui gomiti in una caverna
            che puzza d'orco, fra giacigli di paglia e ossi spolpati, e la
            galleria a ovest prosegue oltre un muro abbattuto da poco.

            {acrobazia Facile fallita} Le braccia arrivano tardi, come sempre
            quando cadi attraverso una cosa che non esiste.
          imposta: { tunnel.segrete: 1 }
          effetti: { tormento: 1 }
          vai: segrete-dell-ira
      - testo: "Leggere le impronte come quelle di un vicolo"
        descrizione: "Qui le impronte nella polvere vanno contro il muro e non tornano."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Le punte dei piedi
          testo: |
            Guardi la polvere come quella dei vicoli dietro la Pignatta. Le
            impronte arrivano al muro e non tornano, e le ultime sono soltanto
            punte, tutte in basso a sinistra, dove la mano ti entra nella pietra.
            Dall'altra parte, oltre i giacigli degli orchi e una porta di legno
            chiusa, la galleria prosegue a ovest dietro un muro abbattuto da poco.
          imposta: { tunnel.segrete: 1 }
          vai: segrete-dell-ira
      - testo: "Guardare da che parte piega la fiamma"
        descrizione: "In un tunnel chiuso l'aria dovrebbe stare ferma, e la fiamma davanti al muro non sta ferma."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Facile }
        successo:
          titolo: La fiamma storta
          testo: |
            Posi la lampada davanti al muro e aspetti come si aspetta una volpe
            fuori dalla tana. La fiamma si piega in basso a sinistra, verso uno
            spiffero di paglia sporca, e lì la mano ti entra nella pietra.
            Dall'altra parte, oltre i giacigli degli orchi e una porta di legno
            chiusa, la galleria prosegue a ovest dietro un muro abbattuto da poco.
          imposta: { tunnel.segrete: 1 }
          vai: segrete-dell-ira
        fallimento:
          titolo: La fiamma dritta
          testo: |
            Aspetti accucciato accanto alla lampada finché ti si addormenta una
            gamba, e la fiamma continua a stare dritta come un chiodo. Forse
            quaggiù l'aria si muove troppo piano per te. Risali il tunnel
            zoppicando sulla gamba che formicola.
          effetti: { tormento: 1 }
      - testo: "Accendere la Luce fredda sulla roccia"
        descrizione: "Una luce che non trema mostra la pietra com'è, e forse anche quella che non c'è."
        quando: [origine.allievo-di-torvessa >= 1]
        incantesimo: luce-fredda
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La luce ferma
          testo: |
            Copri la lampada con la giubba e accendi il cristallo, come al banco
            dell'Accademia. Alla luce ferma la pietra in basso a sinistra resta un
            poco più chiara, con crepe che non fanno ombra, e lì la mano ti entra
            nella roccia. Dall'altra parte, oltre i giacigli degli orchi e una
            porta di legno chiusa, la galleria prosegue a ovest dietro un muro
            abbattuto da poco.
          imposta: { tunnel.segrete: 1 }
          vai: segrete-dell-ira
        fallimento:
          titolo: Il cristallo che sfarfalla
          testo: |
            Il cristallo si accende storto e la luce salta sul muro a scatti,
            finché non sai più se guardi la pietra o il ricordo della pietra.
            Risali con un dolore sottile dietro gli occhi, e la lampada ti sembra
            all'improvviso una vecchia amica.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ 6 · il ritorno nelle Segrete
  - id: di-nuovo-nel-tunnel
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Di nuovo nel tunnel
    sommario: "Le bottiglie di Isvaro sono ancora in fila sulla mensola, e il masso finto è dove l'hai lasciato."
    luogo: Acciaieria dei Tarvelin, i sotterranei
    area: citta-bassa
    requisiti: [pista.acciaio == 6, tunnel.segrete >= 1]
    testo: |
      L'Acciaieria è chiusa e fredda come l'hai lasciata. Nella stanza dei
      contrabbandieri una bottiglia di Isvaro si è rovesciata, e la rimetti in
      fila prima di accorgerti di averlo fatto. Poi c'è il tunnel lungo quasi
      un chilometro, con in fondo il masso che non c'è.

      {origine apprendista-raschiatore} Sulle piattaforme ti hanno insegnato a
      contare le curve di una galleria all'andata, e anche stavolta il conto
      torna fino al masso.

      Ci passi attraverso a occhi chiusi, e trovi i giacigli degli orchi come
      li hai lasciati.
    opzioni:
      - testo: "Scendere nelle Segrete"
        descrizione: "La strada fino alla statua la sai. Il resto lo rifai da capo."
        esito:
          titolo: La statua
          testo: |
            Sali per la galleria dritta fino alla sala della statua, e alla donna
            di marmo rosso con la faccia storta dalla rabbia fai un cenno del
            mento, perché ormai vi conoscete. Ti allacci la giubba fino al collo e
            ti incammini verso le gallerie basse.
          vai: segrete-dell-ira

  # ------------------------------------------------------------ le stanze (ripetibili, in fasce di profondità)
  - id: segrete-la-caverna-di-guardia
    immagine: ambientazione/marea-grigia
    titolo: La caverna di guardia
    sommario: "In una caverna bassa qualcosa cammina avanti e indietro sulle gambe piegate al contrario."
    luogo: Segrete dell'Ira, la caverna di guardia
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 0]
    testo: |
      Dove la galleria si allarga c'è una caverna bassa, e dentro cammina
      avanti e indietro una figura glabra e magra, alta quanto un uomo,
      sulle gambe piegate all'indietro come quelle di un cane. Quando si
      gira vedi la bocca troppo larga, dove al posto dei denti si aprono e
      si chiudono piccole mani a tre dita. In un angolo marcisce un sacco di
      farina.

      {rissa Media} Gambe piegate così reggono male un calcio di lato, al
      ginocchio.
    opzioni:
      - testo: "Affrontarla"
        descrizione: "È una sola, ed è magra. Le mani che ha in bocca però sono parecchie."
        combattimento: una-colata
        vittoria:
          titolo: La pozza grigia
          testo: |
            Ti viene addosso a scatti, con le mani della bocca tese verso la tua
            faccia. Quando la colpisci si apre come cera calda e cola in una pozza
            grigia che sa di capelli bruciati, e le mani ti tremano soltanto dopo,
            come se avessero aspettato il permesso.
          effetti: { profondita.segrete-dell-ira: 1 }
        sconfitta:
          titolo: La manica
          testo: |
            Le mani della bocca ti prendono il polso e tirano con una forza che da
            un corpo così magro non ti aspettavi. Ti liberi lasciandoci la manica
            e un po' di pelle, e lei non ti segue nemmeno, cosa che ti offende
            quasi più del polso.
      - testo: "Passarle alle spalle quando si gira"
        descrizione: "Va avanti e indietro sempre per lo stesso tratto. Prima o poi ti dà la schiena."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Otto passi
          testo: |
            Da dietro lo spigolo conti i passi che fa per ogni tratto e il tempo che le
            serve per girarsi. Al terzo giro scivoli dentro rasente la parete con gli
            stivali in mano, e quando si volta sei già nella galleria dall'altra parte.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il sacco di farina
          testo: |
            A metà strada urti il sacco marcito, che si apre in uno sbuffo di
            polvere grigia, e la figura si gira di colpo. Le mani della bocca ti
            graffiano il collo mentre torni di corsa nella galleria, e la ferita
            ti resta impastata di farina.
          effetti: { ferite: 0.5 }
      - testo: "Calmare il respiro e passarle accanto"
        descrizione: "Gira la testa verso ogni rumore. Forse anche verso chi ha paura."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: A passo normale
          testo: |
            La guardi a lungo e capisci che si volta verso chi respira in fretta,
            più che verso chi cammina. Sciogli le spalle e attraversi la caverna a
            passo normale, contando fra te come quando da bambino non riuscivi a
            dormire, e lei ti passa a un braccio di distanza senza girarsi.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Le piccole mani
          testo: |
            A tre passi da lei ti accorgi di ansimare, e la testa glabra si gira
            verso di te tutta in una volta. Torni indietro camminando
            all'indietro, e lei ti segue fino all'imbocco della galleria, dove si
            ferma a guardarti con la bocca aperta e le piccole mani che ti
            salutano, o forse ti chiamano.
          effetti: { tormento: 1 }
      - testo: "Aspettare che si allontani"
        descrizione: "Prima o poi andrà in fondo alla caverna. Bisogna restare accucciati al buio ad ascoltarla."
        costo: 2
        esito:
          titolo: Il ticchettio
          testo: |
            Ti accucci nella galleria con la lampada coperta e per un'ora ascolti
            il ticchettio delle piccole dita avvicinarsi e allontanarsi, finché ti
            accorgi di contarlo a mezza voce. Quando si ferma in fondo alla
            caverna passi rasente il muro opposto.
          effetti: { profondita.segrete-dell-ira: 1, tormento: 1 }

  - id: segrete-la-vasca-dei-teschi
    immagine: ambientazione/rovine-dei-precursori
    titolo: La vasca dei teschi
    sommario: "Sopra una vasca d'acqua ferma, con i teschi allineati sul bordo, vola una testa senza corpo."
    luogo: Segrete dell'Ira, la vasca di purificazione
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 0]
    testo: |
      In una stanza rotonda c'è una vasca d'acqua ferma e limpida, con una
      fila di teschi sul bordo girati verso l'acqua, e a uno qualche
      contrabbandiere ha infilato per scherzo un sasso di fiume nell'orbita.

      {empatia Facile} Chi l'ha fatto rideva per non sentire quanto aveva
      paura.

      Sopra la vasca svolazza su due ali di pipistrello una testa senza
      corpo, grande come quella di un cavallo, con i tentacoli che le pendono
      dal mento. Appena entri si gira verso di te con la bocca piena di
      zanne.
    opzioni:
      - testo: "Aspettarla e colpirla"
        descrizione: "Prima o poi ti viene addosso. Meglio che ti trovi pronto."
        combattimento: testa-alata
        vittoria:
          titolo: Nell'acqua
          testo: |
            Ti piomba addosso con la bocca aperta, e i tentacoli ti si avvolgono
            intorno al braccio con cui ti ripari. Il colpo giusto arriva quando si
            alza per riprendere slancio, e la testa cade nella vasca, che si fa
            scura e poi torna limpida.
          effetti: { profondita.segrete-dell-ira: 1 }
        sconfitta:
          titolo: I tentacoli
          testo: |
            I tentacoli ti prendono alla faccia e le zanne ti aprono la spalla.
            Rotoli fino alla porta, e fuori dalla stanza la testa smette di
            seguirti e torna sopra la vasca, mentre tu ti premi la manica sulla
            ferita.
      - testo: "Tenerla lontana con la lampada e correre"
        descrizione: "Ha le ali di un pipistrello. Forse anche gli occhi."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La luce in faccia
          testo: |
            Alzi la lampada e gliela spingi verso gli occhi, e la testa si ritrae
            sbattendo le ali. Corri intorno alla vasca tenendo la luce alta,
            saltando i teschi del bordo, ed esci dall'altra parte con il braccio
            che trema per il peso della lampada.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il teschio
          testo: |
            Inciampi in un teschio del bordo e la lampada fa ballare tutta la
            stanza. La testa arriva dal lato buio e ti morde il polpaccio, e torni
            alla porta zoppicando, con il sangue che fa un rumore piccolo e
            bagnato nello stivale.
          effetti: { ferite: 0.5 }
      - testo: "Lanciarle qualcosa che sappia di morto"
        descrizione: "Queste creature girano dove ci sono resti. Sul bordo della vasca ce ne sono parecchi."
        prova: { attributo: mentale, abilita: [natura, accademiche], difficolta: Media }
        successo:
          titolo: Il teschio dal sasso nell'occhio
          testo: |
            Lanci nel corridoio il teschio con il sasso nell'orbita, e la testa ci
            si butta dietro come un cane dietro a un osso. Mentre la senti
            rosicchiare nel buio attraversi la stanza senza correre, scusandoti a
            mezza voce con il padrone del teschio.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Troppo pulito
          testo: |
            Il teschio che lanci è vecchio e pulito, e la testa lo ignora per
            scendere in picchiata su di te, che sei più fresco. Ti ritiri nel
            corridoio con le braccia sopra la testa e le ali che ti sbattono in
            faccia, mentre il teschio si ferma sul bordo della vasca a guardarti.
          effetti: { tormento: 1 }
      - testo: "Passare a testa bassa e lasciarla mordere"
        descrizione: "La stanza è piccola. Qualche morso, e sei dall'altra parte."
        costo: 2
        esito:
          titolo: I morsi
          testo: |
            Ti tiri la giubba sopra la testa e attraversi la stanza di corsa. Ti
            morde due volte sulla spalla e una sulla mano, e i tentacoli ti
            lasciano sulla pelle una bava che pizzica, ma dall'altra parte ci
            arrivi.
          effetti: { profondita.segrete-dell-ira: 1, ferite: 0.5 }

  - id: segrete-l-antica-prigione
    immagine: ambientazione/marea-grigia
    titolo: L'antica prigione
    sommario: "Una piattaforma di legno marcio su una sala di celle, e in mezzo due figure glabre che ti hanno già visto."
    luogo: Segrete dell'Ira, l'antica prigione
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 1]
    testo: |
      Esci su una piattaforma di legno marcio, tre metri sopra una sala con
      venti celle arrugginite. Due scale scendono al pavimento, e lungo il
      bordo nord una passerella porta verso est. Su un muro qualcuno ha
      disegnato a carbone una finestra con un vaso di fiori.

      {acrobazia Media} Se devi fidarti di un legno, fidati della passerella,
      che entra nella roccia.

      Dal centro della sala due figure glabre sulle gambe piegate al contrario
      vengono verso le scale.

      {origine fuggiasco-di-ghoran} Hai contato le celle prima delle figure,
      come a Ghoran in ogni posto nuovo.
    opzioni:
      - testo: "Aspettarle in cima alle scale"
        descrizione: "Sono due. Dalla piattaforma però arrivano una alla volta."
        combattimento: due-colate
        vittoria:
          titolo: In cima alle scale
          testo: |
            La prima la colpisci quando mette il piede sull'ultimo gradino, e cola
            sopra la seconda in una pioggia grigia che fuma. Con la seconda ci
            vuole più tempo, sulla piattaforma che ondeggia, e quando è finita
            prendi la passerella verso est.
          effetti: { profondita.segrete-dell-ira: 1 }
        sconfitta:
          titolo: La piattaforma
          testo: |
            Ti arrivano addosso tutte e due insieme, e ti strappi via lasciandoci
            mezza giubba e un po' di orecchio. Le figure restano sul bordo della
            piattaforma a guardare il buio dove sei sparito.
      - testo: "Correre lungo la passerella"
        descrizione: "Un metro e mezzo di legno vecchio fino al passaggio a est. Loro devono prima salire le scale."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La scala rotta
          testo: |
            Corri sulla passerella mentre loro salgono, e il legno ti si piega sotto
            gli stivali senza rompersi, per pura gentilezza. All'imbocco del
            passaggio dai un calcio al montante della scala più vicina, che nel
            crollare si porta dietro anche l'altra, e le due figure restano sotto a
            graffiare il muro.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: L'asse
          testo: |
            A metà passerella un'asse cede e la gamba ti va giù fino al ginocchio. La
            tiri fuori lasciandoci un pezzo di calzone e di pelle, e torni indietro di
            corsa mentre la prima figura arriva in cima alle scale, così vicina che
            senti il ticchettio delle dita.
          effetti: { ferite: 0.5 }
      - testo: "Farle salire sulla piattaforma e farla cedere"
        descrizione: "Le travi sono marce. Il punto dove cedono sta a te trovarlo, e a loro arrivarci."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Le travi marce
          testo: |
            Trovi la trave che regge mezza piattaforma, nera di muffa dove entra
            nel muro, e aspetti sulla passerella. Quando le due figure ti vengono
            incontro la trave si spezza sotto il loro peso, e precipitano di sotto
            con un rumore di legna gettata nel camino.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: La trave sbagliata
          testo: |
            Scegli la trave sbagliata, e la piattaforma ondeggia sotto i tuoi
            piedi invece che sotto i loro. Ti butti all'indietro nel corridoio con
            le mani piene di schegge, e passi il resto del tempo al buio a
            togliertele con le unghie.
          effetti: { tormento: 1 }
      - testo: "Chiuderti in una cella e aspettare"
        descrizione: "La cella con la finestra disegnata ha ancora la porta. Le sbarre reggono, forse."
        costo: 2
        esito:
          titolo: La finestra di carbone
          testo: |
            Scendi di corsa per la scala più lontana e ti chiudi nella cella con la
            finestra disegnata, tenendo la porta con tutte e due le mani. Le figure
            graffiano le sbarre per un'ora a un palmo dalla tua faccia, poi se ne
            vanno, e prendi la passerella verso est con le dita che non si aprono.
          effetti: { profondita.segrete-dell-ira: 1, tormento: 1 }

  - id: segrete-la-sala-degli-interrogatori
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sala degli interrogatori
    sommario: "Strumenti di tortura di un'epoca che non conosci, e una stella di legno piena di uncini davanti all'unica uscita."
    luogo: Segrete dell'Ira, la sala degli interrogatori
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 1]
    testo: |
      La sala è piena di strumenti fatti per far male, in uno stile che non hai
      mai visto. Al centro c'è un tavolo lungo coperto di cinghie di cuoio, con
      una fila di leve che dovevano farlo avanzare a scatti. L'unica uscita è
      un passaggio basso, e davanti ci sta una stella di legno alta più di te,
      piena di uncini arrugginiti ma ancora appuntiti.

      {intimidire Media} Chi ha arredato questa stanza le risposte non le
      cercava. Voleva che chi entrava capisse subito come sarebbe finita.
    opzioni:
      - testo: "Spostare la stella di legno"
        descrizione: "È pesante, e gli uncini sono dappertutto. Bisogna prenderla dal centro."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il centro della stella
          testo: |
            Infili le braccia fra due punte fino al mozzo e la trascini di lato un
            passo alla volta, con gli uncini a un dito dalle guance. Del graffio
            sottile sul collo ti accorgi soltanto dopo.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Gli uncini
          testo: |
            Quando la stella ti scivola di mano gli uncini ti prendono
            l'avambraccio, e ti liberi strappando la manica. Torni indietro a
            fasciarti, con la ruggine degli uncini che ti preoccupa più del
            taglio.
          effetti: { ferite: 0.5 }
      - testo: "Capire come si smonta"
        descrizione: "Una cosa così non la porti dentro intera. Qualcuno l'ha montata qui, e si può smontare."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il perno
          testo: |
            Dietro il braccio più basso della stella trovi un perno infilato in un
            anello murato. Lo sfili con due colpi del palmo e la stella gira su se
            stessa come una porta, e la richiudi dietro di te, perché in fondo al
            passaggio ti sembra di sentire dei passi.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Le leve
          testo: |
            Tiri il perno sbagliato, legato alle leve del tavolo. Il tavolo dà due
            scatti e le cinghie si tendono intorno a niente, alla misura di un
            uomo sdraiato, e per un pezzo non hai voglia di toccare nient'altro.
          effetti: { tormento: 1 }
      - testo: "Strisciare sotto, fra gli uncini"
        descrizione: "Fra il pavimento e la punta più bassa c'è spazio per un corpo, se il corpo non ha fretta."
        costo: 2
        esito:
          titolo: Sotto la stella
          testo: |
            Strisci sotto la punta più bassa con la guancia sulla pietra fredda, e
            a metà un uncino ti graffia la schiena. Esci dall'altra parte con la
            polvere in bocca e le ginocchia che hanno opinioni precise sulla
            faccenda.
          effetti: { profondita.segrete-dell-ira: 1, ferite: 0.5 }

  - id: segrete-lo-studio-delle-sette-punte
    immagine: ambientazione/rovine-dei-precursori
    titolo: Lo studio delle sette punte
    sommario: "Tre porte di pietra con la stessa stella incisa, in una stanza piena di libri ridotti in frammenti."
    luogo: Segrete dell'Ira, l'antico studio
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 2]
    testo: |
      Fra i resti di un tavolo e di sedie crollate ci sono centinaia di
      frammenti di libri, coperti di una scrittura spigolosa come fatta a
      punta di coltello. Sulla parete sud tre porte di pietra basse e chiuse
      portano incisa la stella a sette punte del libro della statua. Fra i
      frammenti c'è un tappo di sughero nuovo che odora ancora di vino.

      {conoscenze-della-strada Facile} Sughero buono, da vino che costa. Chi
      lo beve quaggiù ci è sceso con la borsa piena.
    opzioni:
      - testo: "Leggere i frammenti"
        descrizione: "La scrittura è antica, ma le figure si capiscono. Fra tanti fogli ci sarà una pianta."
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: La pianta
          testo: |
            Su un frammento più grande degli altri c'è il disegno di queste
            stanze, con una freccia che scende accanto alla porta di destra. La
            porta di destra cede alla spalla e si apre su una galleria che va in
            basso, da cui sale un'aria più fredda.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Le punte di coltello
          testo: |
            Più guardi la scrittura spigolosa e più le lettere ti sembrano
            muoversi, finché ti viene un dolore dietro gli occhi e non sai più
            quanto tempo è passato. La lampada ha consumato più olio del previsto,
            e le tre porte restano chiuse.
          effetti: { tormento: 1 }
      - testo: "Spingere le porte una per una"
        descrizione: "Tre porte di pietra. Una si aprirà, se le spalle reggono."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La terza porta
          testo: |
            La prima porta non si muove e la seconda nemmeno. La terza cede di un
            palmo con un rumore di pietra su pietra, e dall'altra parte trovi una
            galleria che scende, contento di non aver aperto le altre due.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: La spalla
          testo: |
            Spingi finché la spalla ti manda una fitta fino al collo, e le porte
            restano dove sono. Mentre ti massaggi il braccio, da dietro quella di
            mezzo arriva un colpo solo, sordo, come di qualcuno che ha sentito
            bussare e risponde, e te ne vai senza aspettare il secondo.
          effetti: { ferite: 0.5 }
      - testo: "Seguire l'odore del vino"
        descrizione: "Chi ha perso il tappo è passato per una di queste porte, e la bottiglia l'aveva aperta."
        costo: 2
        esito:
          titolo: Il vino di Isvaro
          testo: |
            Annusi la fessura di ogni porta con la faccia sulla pietra, sentendoti
            un poco cane da tartufi. Dalla terza arriva un filo debole di vino
            rosso, e ti ci vuole tutto il peso del corpo per aprirla, tanto che la
            spalla ti fa male fino a sera.
          effetti: { profondita.segrete-dell-ira: 1, tormento: 1 }

  - id: segrete-la-camera-sospesa
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: La camera sospesa
    sommario: "Una stanza rotonda come una bolla, dove le cose galleggiano a mezz'aria e le pareti scrivono da sole."
    luogo: Segrete dell'Ira, la camera di meditazione
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 3]
    testo: |
      La stanza è una sfera larga quattro metri e mezzo, e al primo passo i
      piedi si staccano da terra. A mezz'aria girano un corvo morto con un
      alone di vermi e una bacchetta di ferro contorto dalla punta biforcuta.
      Più in là gira una bottiglia di vino rosso con un nastro al collo.

      Sulle lamine rosse delle pareti corrono scariche nere a forma di rune, e
      l'uscita è un'apertura tonda dall'altra parte.

      {magia Media} Qui il Mana gira in tondo come l'acqua in un catino
      mescolato, e le scariche nere sono la parte che non trova l'uscita.
    opzioni:
      - testo: "Afferrare la bacchetta quando ti passa vicino"
        descrizione: "Le cose qui dentro girano sempre allo stesso modo. Basta mettersi dove passerà."
        immagine: icone/crystal-wand
        quando: [oggetto.bacchetta-della-stretta-folgorante == 0]
        prova: { attributo: mentale, abilita: [percezione, tecnologia, magia], difficolta: Media }
        successo:
          titolo: La bacchetta
          testo: |
            Impari il giro lento degli oggetti e ti spingi lungo la parete fino al
            punto dove passerà la bacchetta, che ti arriva in mano da sola, più
            pesante di quanto sembra. La infili nella cintura e ti lasci portare
            fino all'uscita.
          effetti: { oggetto.bacchetta-della-stretta-folgorante: 1, profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il corvo
          testo: |
            Sbagli il giro, e invece della bacchetta ti arriva in faccia il corvo
            morto con il suo alone di vermi. Ti tiri fuori da dove sei entrato e
            ti togli i vermi dalla manica uno per uno, storcendo la bocca a ogni
            verme.
          effetti: { tormento: 1 }
      - testo: "Attraversarla a bracciate"
        descrizione: "Ti dai la spinta dalla soglia e speri di arrivare dall'altra parte senza toccare le pareti."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La spinta
          testo: |
            Ti dai la spinta dalla soglia con tutte e due le gambe e attraversi la
            sfera dritto, con le braccia avanti. Quando ti tiri fuori il peso ti
            ricade addosso tutto in una volta, e resti un momento a quattro zampe,
            contento di sentire la pietra.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: La parete rossa
          testo: |
            La spinta è storta e vai a sbattere contro la parete. Una scarica nera
            ti corre lungo il braccio senza rumore, e per un attimo sotto la pelle
            del polso vedi una runa che non è tua. Torni alla soglia con la mano
            addormentata.
          effetti: { ferite: 0.5 }
      - testo: "Leggere i lampi sulle pareti"
        descrizione: "Le scariche formano parole in una scrittura antica. Forse dicono qualcosa di utile."
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: Le parole nere
          testo: |
            Le parole parlano di collera e di vendetta senza mai finire una frase.
            Le scariche però corrono tutte verso l'uscita, come acqua verso uno
            scolo, e ti lasci tirare dalla loro parte fino all'apertura.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: La frase che manca
          testo: |
            Le parole ti entrano negli occhi e ci restano, sempre a un passo dal
            diventare una frase che parla di rabbia, e ti accorgi di stringere i
            denti da un pezzo. Esci dalla sfera all'indietro con la frase che
            manca in testa, e un buco dove dovrebbe esserci il verbo.
          effetti: { tormento: 1 }
      - testo: "Lasciarti andare alla deriva"
        descrizione: "Prima o poi il giro lento ti porta dall'altra parte. Insieme al corvo."
        costo: 2
        esito:
          titolo: In compagnia del corvo
          testo: |
            Ti lasci staccare da terra e aspetti più di un'ora che il giro lento
            ti porti dall'altra parte. Il corvo morto ti passa accanto tre volte,
            e alla terza un verme ti si posa sulla guancia. Fuori barcolli come
            appena sceso da una barca.
          effetti: { profondita.segrete-dell-ira: 1, tormento: 1 }

  - id: segrete-il-santuario
    immagine: ambientazione/mito-regina-ali-spezzate
    titolo: Il santuario
    sommario: "In cima a pochi gradini, nel bacile di un altare di marmo nero, c'è un'acqua che ti fa venire sete."
    luogo: Segrete dell'Ira, il santuario
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 3]
    testo: |
      La galleria sbuca in un piccolo santuario, dove pochi gradini salgono
      a un altare di marmo nero con un bacile d'acqua torbida. Nel fango
      secco dei gradini le impronte d'orco salgono con passo normale e
      scendono trascinate, e ai piedi dell'altare c'è una ciotola di legno
      morsa sul bordo.

      {empatia Difficile} Qualcuno ha morso quella ciotola per resistere al
      bacile, e dalle orme ha perso.

      {origine figlio-del-circolo} Al Circolo si lascia stare l'acqua dove
      le bestie non bevono, e qui non c'è l'impronta di un topo.

      Hai la gola secca, e te ne accorgi solo adesso.
    opzioni:
      - testo: "Capire che cosa c'è in quell'acqua"
        descrizione: "In una cantina l'acqua ferma puzza sempre di qualcosa. Questa non ha odore, e la cosa ti mette a disagio."
        prova: { attributo: mentale, abilita: [medicina, resilienza], difficolta: Media }
        successo:
          titolo: L'acqua che lavora
          testo: |
            Sul fondo del bacile c'è un deposito grigio come quello dei bicchieri
            degli speziali, e intorno all'altare non c'è un insetto, nemmeno
            morto, in una città piena di blatte. Scendi dall'altra parte senza
            voltarti, con la sete che ti segue per un pezzo.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: La sete
          testo: |
            Più guardi l'acqua e più la gola ti brucia, finché ti ritrovi chino
            sul bacile con le mani a coppa. Ti fermi col naso a un dito dalla
            superficie e torni giù a passi lunghi, con le mani infilate sotto le
            ascelle.
          effetti: { tormento: 1 }
      - testo: "Passare di corsa, a polmoni pieni"
        descrizione: "Una cosa che fa venire sete si supera come si supera una cantina che puzza."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Due gradini alla volta
          testo: |
            Riempi i polmoni e sali i gradini due alla volta, giri intorno
            all'altare senza guardare il bacile e ti butti giù dall'altra parte.
            Respiri soltanto in fondo alla galleria, piegato in due con le mani
            sulle ginocchia, e la gola ti brucia meno di prima.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il gradino
          testo: |
            All'ultimo gradino il piede scivola nel fango secco e cadi con le
            ginocchia sulla pietra, a un braccio dall'altare, con il bacile
            all'altezza della faccia. Torni indietro a quattro zampe senza
            guardarlo, con le ginocchia che sanguinano e la gola in fiamme.
          effetti: { ferite: 0.5 }
      - testo: "Girare largo, rasente la parete"
        descrizione: "C'è un passaggio stretto lungo il muro, lontano dall'altare. È lungo, e l'acqua si sente lo stesso."
        costo: 2
        esito:
          titolo: Rasente il muro
          testo: |
            Giri intorno al santuario con la schiena contro la parete, un passo
            laterale alla volta, con il pensiero dell'acqua che non se ne va.
            Dall'altra parte vuoti la tua borraccia fino all'ultima goccia, anche
            se sa di latta.
          effetti: { profondita.segrete-dell-ira: 1, tormento: 1 }

  # ------------------------------------------------------------ Uzgreth alle fosse (facoltativo)
  - id: uzgreth-alle-fosse
    immagine: personaggi/uzgreth
    titolo: Uzgreth alle fosse
    sommario: "Undici portelli nel pavimento di una camera fredda, e un orco deforme con uno spadone da ogre a guardia."
    luogo: Segrete dell'Ira, le fosse dei prigionieri
    area: segrete-dell-ira
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 2, oggetto.spadone-di-uzgreth == 0]
    testo: |
      La camera è più fredda delle altre, sotto un soffitto ad arco alto sei
      metri. Sul pavimento ci sono undici portelli di legno sparsi senza
      ordine, ognuno sopra una fossa larga un metro e mezzo, e dal buio sotto
      salgono gemiti soffocati.

      In mezzo ai portelli c'è un orco più tozzo e più largo di qualunque
      orco tu abbia visto, con la pelle di un colore malato e gli occhi rossi
      di sangue, e tiene appoggiato alla spalla uno spadone enorme di ottima
      fattura. *La spada da ogre dei Nove Chiodi, quella che secondo Ilvaena
      era troppo grande anche per lui.* Adesso gli sta in mano come se
      l'avessero forgiata su misura.

      {armi-da-mischia Media} Uno spadone così vuole spazio per girare, e
      ogni portello è un passo che lui deve contare prima di farlo.

      «Il Demone ha chiesto a Uzgreth di guardare il suo gregge» dice, con
      una voce che sembra salire dal fondo delle fosse. «Uzgreth fa quello
      che dice il Demone, e il Demone dice di squartare gli intrusi
      insolenti.»

      {empatia Media} Ripete gli ordini come un bambino ripete la lezione,
      fiero di saperla a memoria.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "Lo spadone gli sta in mano come un giocattolo. Però è lento, e lo sa anche lui."
        combattimento: le-fosse
        vittoria:
          titolo: Lo spadone
          testo: |
            Uzgreth mena colpi che spaccano i portelli, e dalle fosse aperte si
            alzano mani grigie, ma tu resti sempre dove lui non arriva. Quando
            cade lungo disteso lo spadone gli scivola dalle dita, e a sollevarlo
            pesa quanto un bambino.
          effetti: { oggetto.spadone-di-uzgreth: 1, profondita.segrete-dell-ira: 1, racconto: 1 }
        sconfitta:
          titolo: Il gregge
          testo: |
            Lo spadone ti prende di piatto e ti manda contro un portello, che si
            apre sotto di te, e qualcosa di freddo ti stringe la caviglia nel
            buio. Ti tiri fuori e scappi, e Uzgreth non ti insegue.
      - testo: "Fargli mettere il piede su un portello"
        descrizione: "I portelli scattano come trappole. Uno sotto quel peso deve essere il più marcio."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il portello marcio
          testo: |
            Trovi il portello con i cardini mangiati dalla ruggine e ti metti
            dall'altra parte, a provocarlo. Uzgreth ti viene incontro dritto, e
            quando il portello scatta sotto il suo piede va giù fino alle spalle,
            mentre lo spadone resta di traverso sul bordo. Dal fondo i morti lo
            tirano per le gambe, e lui li chiama gregge fino all'ultimo.
          effetti: { oggetto.spadone-di-uzgreth: 1, profondita.segrete-dell-ira: 1, racconto: 1 }
        fallimento:
          titolo: Il portello sbagliato
          testo: |
            Il portello che hai scelto regge, e mentre ti butti di lato lo spadone
            ti apre la coscia. Scappi trascinando la gamba, con la voce profonda
            di Uzgreth che conta i portelli uno per uno dietro di te.
          effetti: { ferite: 2 }
      - testo: "Dirgli che ti manda il Demone"
        descrizione: "Uzgreth obbedisce al Demone. Non è detto che sappia riconoscere chi parla per lui."
        prova: { attributo: sociale, abilita: [ingannare, persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Gli ordini del Demone
          testo: |
            Gli dici che il Demone ti ha chiamato giù ed è arrabbiato perché lo
            fanno aspettare. «Il Demone è sempre arrabbiato» dice Uzgreth dopo un
            lungo sguardo, e si sposta di lato. Passi fra i portelli senza
            correre, con i suoi occhi rossi sulla nuca.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Insolente
          testo: |
            «Il Demone non manda nessuno» dice Uzgreth, scandendo le parole come
            un maestro con un allievo lento. «Il Demone chiama Uzgreth.» Lo
            spadone ti prende al fianco mentre già corri verso la porta.
          effetti: { ferite: 2 }
      - testo: "Passare lungo il muro mentre parla"
        descrizione: "Uzgreth parla volentieri, e quando parla guarda il soffitto."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Lungo il muro
          testo: |
            Uzgreth ricomincia a parlare del suo gregge con gli occhi rivolti all'arco del soffitto, e tu ti
            muovi lungo il muro mettendo i piedi solo sulla pietra. Arrivi alla porta con le unghie piantate
            nei palmi, e lui sta ancora parlando.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il portello che scricchiola
          testo: |
            Metti il piede su un portello che sembrava pietra, e Uzgreth abbassa
            gli occhi su di te come se la cosa lo annoiasse. Mentre ti butti verso
            la porta la punta dello spadone ti prende la spalla, e la sua voce ti
            chiama insolente una sillaba alla volta.
          effetti: { ferite: 2 }
      - testo: "Rispondergli con la voce dei sorveglianti"
        descrizione: "Uzgreth fa la guardia a un gregge, e a Ghoran hai sentito per anni come gridano i sorveglianti dei recinti."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [intimidire], difficolta: Media }
        successo:
          titolo: Il gregge contato
          testo: |
            Gli gridi addosso come i sorveglianti di Ghoran, con le parole corte e
            lo sguardo sopra la sua testa, che il Demone vuole il gregge contato
            adesso. Uzgreth abbassa lo spadone e comincia a contare i portelli a
            voce alta, e tu passi fra le fosse mentre arriva a sette.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Uno del gregge
          testo: |
            A metà della seconda frase la voce ti si incrina in quella di quando
            stavi sotto, e Uzgreth ti guarda come una bestia scappata dal recinto.
            Lo spadone ti prende al fianco mentre già corri verso la porta, e il
            suo conto dei portelli ti insegue dal buio.
          effetti: { ferite: 2 }
      - testo: "Correre sui portelli come sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice impari quale asse regge. Uzgreth, se lo fai correre, il piede lo mette dove capita."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [atletica, tecnologia], difficolta: Difficile }
        successo:
          titolo: L'asse che non regge
          testo: |
            Corri fra le fosse saltando da un bordo di pietra all'altro, come
            sulle impalcature a fine turno, e lasci fra te e lui il portello dai
            cardini mangiati dalla ruggine. Uzgreth ti insegue dritto, e quando il
            portello scatta va giù fino alle spalle, mentre lo spadone resta di
            traverso sul bordo. Dal fondo i morti lo tirano per le gambe, e lui li
            chiama gregge fino all'ultimo.
          effetti: { oggetto.spadone-di-uzgreth: 1, profondita.segrete-dell-ira: 1, racconto: 1 }
        fallimento:
          titolo: Il bordo sbagliato
          testo: |
            Al terzo salto il bordo che avevi scelto è un portello coperto di
            polvere, e il piede ti affonda nel legno marcio. Lo spadone di Uzgreth
            ti apre la coscia prima che tu sia di nuovo in piedi, e scappi
            trascinando la gamba.
          effetti: { ferite: 2 }
      - testo: "Parlargli come al servitore di un'altra casa"
        descrizione: "Uzgreth ripete gli ordini come un valletto alla porta, e nei Quartieri Alti sai come si parla ai valletti."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Media }
        successo:
          titolo: Atteso
          testo: |
            Gli fai sapere di essere atteso senza alzare la voce, con il tono che a casa tua si usava con i
            valletti degli ospiti, e lasci a lui di immaginare chi dovrà spiegare al Demone il ritardo.
            Uzgreth sbatte le palpebre rosse e si fa da parte con un mezzo inchino goffo, e attraversi la
            camera a passo di salotto, con il mento alto come ti avevano insegnato da bambino.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il pastore
          testo: |
            «Uzgreth non è un servo» dice alla fine, con la fronte aggrottata. «Il
            Demone ha messo qui il pastore.» Lo spadone ti prende al fianco mentre già
            ti volti, e due gallerie più in là ti tamponi la ferita con un fazzoletto
            ricamato.
          effetti: { ferite: 2 }

  # ------------------------------------------------------------ il cuore · 6 → 7
  - id: l-aula-dell-ira
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: L'Aula dell'Ira
    sommario: "Sotto la città, in una sala alta come una cattedrale, un demone con quattro braccia ha perso il senno."
    luogo: Segrete dell'Ira, l'Aula dell'Ira
    area: segrete-dell-ira
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira >= 4]
    testo: |
      La galleria sbuca in una sala così alta che la lampada non arriva al
      soffitto. Al centro una vasca è circondata da teschi in bilico su
      spuntoni di pietra, e in fondo due scalinate salgono a un pulpito con
      una seconda vasca, triangolare, piena di un liquido arancione che
      gorgoglia.

      Accanto al pulpito sta il demone, alto più di tre metri, con la testa
      di un coccodrillo e gli occhi di un pazzo. Le braccia di sopra
      finiscono in chele da stritolare un cavallo, quelle di sotto sono
      sottili come mani d'uomo.

      {rissa Media} Le chele sono lente a riaprirsi, e le mani piccole sono
      il punto dove gli si fa male.

      «Maledetti! Avete osato violare il santuario della Covatrice di
      Orrori!» urla. Con una mano piccola si taglia il polso sopra la vasca
      triangolare, e accanto a lui l'aria si crepa come uno specchio e ne
      esce una figura glabra sulle gambe piegate al contrario.

      «Dona la tua anima colma di rancore al possente Yoggoth, e anche tu
      sarai una Colata dell'Ira al servizio della sacra Regina!» La vasca
      intanto è scesa di un dito, e il coccodrillo sembra preoccupato.

      {origine accolito-del-velo} Parla della sua Regina con la voce che in
      Cattedrale si usa per le letture solenni.
    opzioni:
      - testo: "Affrontarli tutti e due"
        descrizione: "Un demone con quattro braccia e una Colata appena nata. Alle spalle hai le Segrete."
        combattimento: l-aula-dell-ira
        vittoria:
          titolo: Il possente Yoggoth
          testo: |
            La Colata cola sul pavimento al primo colpo, poi c'è soltanto Yoggoth,
            con le chele che spaccano i teschi del cerchio, finché cade sui
            gradini del pulpito e non si rialza più. Alla sua cintura c'è un
            cilindro di lyssan inciso e ammaccato, con dentro un rotolo coperto di
            simboli senza senso. La vasca sul pulpito è ancora piena fino all'orlo
            quando te ne vai.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1, racconto: 1 }
          vai: citta-bassa
        sconfitta:
          titolo: L'ultimo taglio
          testo: |
            La Colata la abbatti, ma Yoggoth ti scaraventa con una chela contro il
            cerchio di teschi e si taglia di nuovo il polso per chiamarne
            un'altra, e poi ancora, finché la vasca non gli risponde più. Taglia
            ancora e si accascia sui gradini nel suo sangue. Dalla sua cintura
            prendi un cilindro di lyssan ammaccato, e torni in Città Bassa
            all'alba, piegato in due.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1 }
          vai: citta-bassa
      - testo: "Provocarlo finché svuota la vasca"
        descrizione: "Ogni Colata costa qualcosa alla vasca, e lui se n'è accorto. Bisogna fargliene chiamare troppe."
        prova: { attributo: sociale, abilita: [intimidire, ingannare, espressivita], difficolta: Difficile }
        successo:
          titolo: Il possente
          testo: |
            Gli dai del lucertolone, poi di peggio, con un'inventiva che non
            sospettavi di avere. Yoggoth ruggisce e si taglia il polso, e tu corri
            intorno al cerchio di teschi con la Colata dietro, finché ogni insulto
            gli è costato un taglio e lui cade sui gradini svuotato del suo
            sangue. Dalla sua cintura prendi un cilindro di lyssan ammaccato, e in
            Città Bassa arrivi senza voce.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1, racconto: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Troppe
          testo: |
            Lui ti prende in parola più in fretta del previsto, e le Colate escono
            una dopo l'altra finché una ti prende alla schiena e un'altra alla
            gamba. Yoggoth si taglia anche quando la vasca non gli risponde più, e
            alla fine si accascia sui gradini. Gli sfili dalla cintura un cilindro
            di lyssan ammaccato e risali trascinandoti.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1, ferite: 2.5 }
          vai: citta-bassa
      - testo: "Scacciarlo con l'esorcismo"
        descrizione: "La Liturgia dell'Albero ha parole per ciò che non dovrebbe restare. Un demone non dovrebbe restare da nessuna parte."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Le parole dell'Albero
          testo: |
            Dici le parole della Liturgia a voce alta, più ferma delle gambe. A ogni
            frase Yoggoth si fa più piccolo dentro la sua pelle color ruggine, come
            un vestito che resta vuoto, e la Colata accanto a lui si scioglie sul
            pavimento. All'ultima parola si accascia sui gradini, e fra le pieghe
            della pelle vuota trovi un cilindro di lyssan ammaccato.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1, racconto: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Mezza Liturgia
          testo: |
            A metà formula sbagli una parola, e il Mana ti torna indietro come una
            frustata dietro gli occhi. Yoggoth barcolla lo stesso, e per la rabbia
            si apre il polso sopra la vasca finché non gli dà più niente e crolla
            sui gradini svuotato, mentre la sua Colata ti lascia il segno delle
            piccole mani sul braccio. Dalla sua cintura prendi un cilindro di
            lyssan ammaccato.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
