# Acciaio e Ira, seconda metà (pista.acciaio 5 → 7): il diario di Isvaro letto al Grifone, il tunnel dei
# contrabbandieri sotto l'Acciaieria e la spedizione nelle Segrete dell'Ira, con Uzgreth alle fosse e
# Yoggoth nell'Aula dell'Ira.
#
# - `il-diario-di-isvaro` (5 → 6): Liaren legge il diario ad alta voce, una parte alla volta (quality
#   nascoste diario.*), poi si sceglie a chi portarlo.
# - `il-tunnel-dei-contrabbandieri` (pista 6, la prima volta): A19, A22, A23, il masso finto, la caverna
#   degli orchi; chi trova il passaggio prende `tunnel.segrete` ed entra nelle Segrete.
# - `di-nuovo-nel-tunnel` (pista 6, le volte dopo): rientro nella spedizione.
# - area `segrete-dell-ira`: sette stanze ripetibili (B1, B4, B6, B7, B8, B11, B12) in fasce di
#   profondità, 0 le gallerie dopo la statua (la caverna di guardia o la vasca dei teschi), 1 la prigione
#   o la sala degli interrogatori, 2 lo studio delle sette punte oppure Uzgreth alle fosse (B9, storia
#   facoltativa), 3 la camera sospesa o il santuario. Poi il cuore `l-aula-dell-ira` (B13), che in ogni
#   ramo porta pista.acciaio a 7, pozzo-dell-ira a 5, dà il cilindro di lyssan e riporta in Città Bassa.
quality:
  - { id: tunnel.segrete, nome: "Il passaggio del masso finto", categoria: stato, nascosta: true, descrizione: "Sai dov'è il masso finto in fondo al tunnel dei contrabbandieri." }
  - { id: diario.mappe, nome: Hai visto le mappe del diario, categoria: stato, nascosta: true }
  - { id: diario.razzia, nome: Liaren ti ha letto la pagina della razzia, categoria: stato, nascosta: true }
  - { id: diario.piano, nome: Liaren ti ha letto la pagina del tunnel, categoria: stato, nascosta: true }
  - { id: diario.amata, nome: Liaren ti ha letto la pagina dell'amata, categoria: stato, nascosta: true }
  - { id: diario.fratello, nome: Hai parlato a Liaren di Isvaro, categoria: stato, nascosta: true }

aree:
  - id: segrete-dell-ira
    immagine: ambientazione/rovine-dei-precursori
    nome: Segrete dell'Ira
    sommario: "Sotto la Città Bassa, oltre il masso finto in fondo al tunnel dei contrabbandieri, si aprono gallerie di pietra più vecchie di Qir-Azel. Più si scende, più fa freddo."
    spedizione: { ritorno: citta-bassa, soglia: 4, stanze: 3 }
    testo: |
      Oltre il muro abbattuto la galleria sale dritta per una trentina di
      metri e poi si apre in una sala di pietra liscia, tagliata da mani che
      non hanno lasciato il segno dello scalpello. Al centro c'è la statua di
      marmo rosso di una donna bellissima, con la faccia storta dalla rabbia
      e i capelli tenuti indietro da un copricapo di uncini e di lame. Nella
      sinistra stringe un grosso libro con una stella a sette punte sulla
      copertina, e nella destra una corsesca di metallo e d'avorio che
      luccica ancora.

      Da qui le Segrete si diramano in gallerie basse e in stanze mezze
      crollate. L'aria è secca e fredda, e ogni tanto da sotto il pavimento
      sale un rumore sordo, lontano, che ti arriva nei denti prima che nelle
      orecchie. Su un mattone del muro abbattuto, rimasto intero, i
      contrabbandieri hanno scritto con la pece *chiuso per sempre*, e sotto
      hanno messo la data e le loro iniziali, come su un contratto.

storylet:
  # ------------------------------------------------------------ 5 → 6 · il diario di Isvaro
  - id: il-diario-di-isvaro
    presso: grifone-di-ferro
    immagine: personaggi/liaren-tarvelin
    titolo: Il diario di Isvaro
    sommario: "Liaren è ancora a letto con il fianco fasciato. Brunella ha chiuso la porta a chiave, e sul comodino c'è il diario di Isvaro."
    luogo: Locanda del Grifone di Ferro, la stanza di Liaren
    area: ponti-sospesi
    requisiti: [pista.acciaio == 5]
    testo: |
      Liaren passa i giorni dopo l'Acciaieria a letto, nella stanza in fondo
      al corridoio del Grifone, con il fianco sinistro fasciato stretto e due
      cuscini dietro la schiena. Si è fatta portare il samisen e non lo
      suona. Lo tiene sulle ginocchia e gira un pirolo avanti e indietro,
      senza accordare niente.

      {medicina Facile} Respira corto e dall'alto del petto, per non tirare
      i punti.

      Brunella ha chiuso la porta a chiave e si è seduta sulla cassapanca con
      il mestolo in grembo, anche se di zuppa non ce n'è. Dalle assi del
      pavimento sale il rumore della sala, con qualcuno che ride troppo forte.

      Sul comodino c'è il diario di Isvaro, rilegato in pelle, due dozzine di
      pagine piene per metà di mappe di Qir-Azel e per l'altra metà di
      ritratti di una donna. Le righe scritte sono in elfico, in una
      calligrafia minuta che pende tutta a destra. Accanto c'è il mazzo di
      chiavi di Ondrel, che stamattina la Caserma ha riportato in un
      sacchetto di tela con sopra scritto a gesso *Tarvellin*, con due elle.
      Liaren te le ha messe in mano appena sei entrato, senza guardarle.

      {galateo Facile} Due elle. Alla Caserma il nome di un Casato vale
      quanto l'ortografia del piantone di turno.

      «L'elfico l'ho imparato a undici anni, per scrivergli all'Accademia»
      dice Liaren, e allunga la mano verso il diario. «Leggo io, e poi te lo
      scrivo su un foglio, così non me lo chiedi due volte. Tu tienimi la
      lampada vicino, e tu, Brunella, non dici niente finché non ho finito.»

      {origine allievo-di-torvessa} Isvaro è cresciuto all'Accademia, nelle
      stesse aule dove studi tu. Ti chiedi se Orvald Temmerin se lo ricordi,
      e sai già che, se glielo chiedessi, ti risponderebbe a un'altra domanda.

      Brunella annuisce e stringe il mestolo con tutte e due le mani.
      *Undici anni, e già scriveva a un fratello che in casa non si poteva
      nominare.* Ti siedi sul bordo del letto con la lampada fra le
      ginocchia, e il vetro caldo ti scalda le dita.

      {empatia Media} Ha detto che legge lei perché sa l'elfico. Lo dice
      anche perché, se lo leggessi tu, dovrebbe guardarti la faccia mentre
      lo ascolti.
    opzioni:
      - testo: "Sfogliare le mappe"
        descrizione: "Metà del diario è Qir-Azel disegnata a inchiostro, strada per strada, con le frecce."
        immagine: ambientazione/evento-razzia-festival-150
        requisiti: [diario.mappe == 0]
        costo: 0
        esito:
          titolo: Quaranta e quattrocento
          testo: |
            Le mappe sono fatte bene, con i ponti contati a uno a uno e la
            Città Bassa disegnata casa per casa. La prima serie mostra piani
            d'attacco per una banda di quaranta orchi, e una delle pagine è
            cerchiata due volte. Liaren ci passa sopra il dito. Le frecce
            partono dall'Acciaieria e salgono fino alla piazza del Festival,
            vicolo per vicolo, senza passare mai da una strada larga.

            {conoscenze-della-strada Media} Così si muove chi la Città Bassa
            l'ha girata da ragazzo, di notte, scappando da qualcuno.

            {origine figlio-della-citta-bassa} Una delle frecce passa davanti
            al cortile del bottaio dove da bambino andavi a rubare i cerchi di
            ferro. Isvaro ha disegnato perfino il portone, e l'ha lasciato
            aperto.

            Le pagine dopo sono per quattrocento orchi. Nessuna è cerchiata, e
            molte sono coperte di croci tracciate così forte che il pennino ha
            bucato la carta. Brunella guarda le croci a lungo, con il mestolo
            premuto contro le labbra.
          imposta: { diario.mappe: 1 }
          segue: il-diario-di-isvaro
      - testo: "Farle leggere la prima pagina scritta"
        descrizione: "Dopo le mappe le righe si fanno fitte. Liaren si schiarisce la voce."
        immagine: personaggi/ondrel-tarvelin
        requisiti: [diario.razzia == 0]
        costo: 0
        esito:
          titolo: La razzia
          testo: |
            «La razzia è andata come doveva» legge Liaren. «Abbiamo perso
            pochi orchi di Capomozzo, e la bara di Sollen l'abbiamo presa
            senza fatica, mentre i bifolchi guardavano da un'altra parte. Non
            vedo l'ora del vero assalto. Questa città merita di bruciare. Quel
            bastardo di mio padre l'ho costretto a tacere sull'Acciaieria, che
            ci serviva come base, altrimenti avrei raccontato a tutti come ha
            tolto di mezzo la mamma con l'aiuto di Vesh e dei suoi tagliagole.
            Gli ho fatto sparire anche ogni carta che in città nomini
            Capomozzo, così abbiamo più tempo.»

            Arrivata alla mamma la voce le si incrina, e Liaren ricomincia la
            frase da capo, più piano, come se la prima volta avesse letto
            male.

            {empatia Media} Rilegge per guadagnare tempo, perché finché la frase è da
            rifare la mamma resta soltanto una parola su una pagina. Brunella si alza
            dalla cassapanca, va fino alla finestra e torna a sedersi.

            {origine rampollo-dei-quartieri-alti} Nei salotti la morte di
            Maerith Tarvelin è durata una stagione. Si parlava di una febbre, e
            chi ne parlava posava la tazza sul piattino prima di cambiare
            discorso.
          imposta: { diario.razzia: 1 }
          segue: il-diario-di-isvaro
      - testo: "Farle leggere la seconda pagina"
        descrizione: "Qui la calligrafia è più nervosa, e c'è un nome sottolineato."
        immagine: ambientazione/acciaieria-di-qir-azel
        requisiti: [diario.piano == 0]
        costo: 0
        esito:
          titolo: Il tunnel dei contrabbandieri
          testo: |
            «Balthog vuole un assalto in massa, via terra» legge Liaren. «Per
            me è un errore. Dovremmo farci aiutare dal demone delle Segrete e
            mandare su i suoi mostri da sotto, per il tunnel dei contrabbandieri
            che sbuca nell'Acciaieria di mio padre, e poi entrare dal fiume
            con assalti piccoli e mirati. Gli altri sono tutti d'accordo tranne
            Zagrath. Il mezzogre dice di no solo per farmi arrabbiare. La mia
            adorata Aurenne è troppo presa dai livelli inferiori per decidere.
            Dice che quando avrà liberato il Costruttore lo metterà ai suoi
            ordini, e allora la prudenza non ci servirà più. Spero che abbia
            ragione. Quell'idiota di Garin crede ancora che serviamo il Culto
            dell'Anonimo, e Kessa comincia a sospettare qualcosa.»

            Liaren alza gli occhi dalla pagina, e il dito le resta fermo sotto
            il nome sottolineato, come per impedirgli di scappare. Lo tiene lì
            mentre parla. «Da bambina mio padre mi diceva che sotto
            l'Acciaieria ci sono soltanto topi» dice, e Brunella sbuffa dal naso
            una volta sola.
          imposta: { diario.piano: 1 }
          segue: il-diario-di-isvaro
      - testo: "Farle leggere l'ultima pagina"
        descrizione: "L'ultima pagina scritta sta prima dell'ultimo ritratto."
        immagine: ambientazione/mito-regina-ali-spezzate
        requisiti: [diario.amata == 0]
        costo: 0
        esito:
          titolo: La mano nuova
          testo: |
            «La mia amata vuole andare fino in fondo» legge Liaren, con la voce
            che si è fatta più bassa. «Qualunque cosa le dica, resta convinta
            di essere brutta. Vuole togliersi di
            dosso quella che chiama la sua corruzione celestiale e metterci la
            grazia della sua nuova madre, la Regina delle Ali Spezzate. Quando
            ha bruciato i resti di suo padre al santuario di Capomozzo è
            cominciata la trasformazione, e la sua mano nuova a me piace poco.
            Spero che quando offrirà Qir-Azel alle fiamme di Nhar'Kael sia
            meno orrenda. Anche le succubi sono demoni, no?»

            Liaren gira pagina e avvicina il diario alla lampada. La donna è
            disegnata a carboncino come nelle altre, con i capelli lunghi e
            chiari, ma qui ha due ali da
            pipistrello che le escono dalle scapole e una mano nera e
            artigliata posata sul ventre. In questo ritratto come in tutti gli
            altri, Isvaro le ha ripassato gli occhi con un inchiostro viola.

            {resilienza Media fallita} Gli occhi viola ti guardano dalla pagina,
            e tu sposti lo sguardo sulla lampada prima di aver deciso di farlo.
          imposta: { diario.amata: 1 }
          segue: il-diario-di-isvaro
      - testo: "Raccontarle di Isvaro"
        descrizione: "Sul gradino le hai detto soltanto che è scappato. Adesso vuole sapere come."
        requisiti: [diario.fratello == 0, isvaro == 1]
        costo: 0
        esito:
          titolo: La finestra del dormitorio
          testo: |
            Le racconti com'è scappato dalla fornace, e Liaren ti ascolta
            senza staccare gli occhi dal samisen. «All'Accademia scappava dalla
            finestra del dormitorio tutte le settimane» dice dopo un po'. «La
            sera era sempre di ritorno per cena, perché i ragazzi tornano quando
            hanno fame. Adesso c'è qualcun altro che gli dà da mangiare.» Gira
            il pirolo finché la corda geme, e Brunella allunga una mano a
            fermarle il polso, senza dire niente, perché le è stato chiesto.
          imposta: { diario.fratello: 1 }
          segue: il-diario-di-isvaro
      - testo: "Raccontarle di Isvaro"
        descrizione: "Isvaro è alla Caserma da quando la ronda l'ha portato via. Liaren non ti ha ancora chiesto come sta."
        requisiti: [diario.fratello == 0, isvaro == 2]
        costo: 0
        esito:
          titolo: Il pane dolce
          testo: |
            Le racconti che Isvaro è ancora chiuso in una cella della Caserma,
            con le mani legate dietro la schiena, e Liaren annuisce piano a ogni
            parola. «Quando torna, Galdrick proverà a farlo parlare» dice, e si
            sistema il cuscino dietro la schiena, con una smorfia per i punti.
            «Io a trovarlo non ci vado. Una volta ci andavo ogni settimana, con
            il pane dolce di Brunella nel cestino, e lui lo mangiava tutto
            senza dire grazie.» Sulla cassapanca, Brunella si guarda le mani,
            che sanno ancora di farina.
          imposta: { diario.fratello: 1 }
          segue: il-diario-di-isvaro
      - testo: "Raccontarle di Isvaro"
        descrizione: "Isvaro è morto in fondo alla scala dei magazzini. Liaren vuole sapere se ha detto qualcosa."
        requisiti: [diario.fratello == 0, isvaro == 3]
        costo: 0
        esito:
          titolo: I mozziconi
          testo: |
            Liaren ti chiede se ha detto qualcosa prima di morire, e tu le
            racconti che si è girato per parlarti, in cima alla scala, e non ha
            fatto in tempo. Ascolta con gli occhi sul samisen, e la lampada che
            tieni in grembo ti sembra all'improvviso troppo calda.
            «Da piccolo aveva paura del buio» dice alla fine. «All'Accademia i
            maestri gli spegnevano la candela tutte le sere, e io gli portavo
            i mozziconi di nascosto.» Poi stringe il pirolo finché la corda si
            spezza con un suono acuto.
          imposta: { diario.fratello: 1 }
          segue: il-diario-di-isvaro
      - testo: "Portare il diario alla Cattedrale del Velo"
        descrizione: "Un demone sotto la città e la Regina delle Ali Spezzate. Al Velo queste cose devono saperle."
        immagine: personaggi/padre-vantes
        requisiti: [diario.mappe == 1, diario.razzia == 1, diario.piano == 1, diario.amata == 1]
        esito:
          titolo: Le copie dei novizi
          testo: |
            Sali ai Quartieri Alti con il diario sotto la giubba. Padre Vantes
            ti riceve in sacrestia e legge muovendo le labbra la traduzione che
            Liaren ti ha scritto su un foglio a parte. Quando arriva alla
            Regina delle Ali Spezzate la voce gli si abbassa, e due dita della
            mano libera tracciano da sole il segno dell'Albero sul tavolo. Chiama due
            novizi e gli fa copiare le mappe per tutta la notte, e la mattina
            dopo ti restituisce il diario legato con un nastro bianco.

            «Il Velo pregherà» dice, con la mano sul tuo braccio. «Lei intanto
            guardi in quel tunnel prima che ci guardi qualcun altro.» Le chiavi
            di Ondrel ce le hai ancora in tasca.

            {galateo Media} Ti dà del lei, e in sacrestia vuol dire che sei
            diventato una faccenda ufficiale.
          effetti: { pista.acciaio: 1, rep.velo: 1 }
      - testo: "Tenerlo per Galdrick"
        descrizione: "Lo sceriffo è a Ghoran. Quando torna, deve trovare tutto pronto."
        immagine: personaggi/toren-galdrick
        requisiti: [diario.mappe == 1, diario.razzia == 1, diario.piano == 1, diario.amata == 1]
        esito:
          titolo: Un rapporto per lo sceriffo
          testo: |
            Scendi alla Caserma e chiedi carta e penna al sergente di guardia,
            che te le dà dopo averti guardato due volte. Scrivi tutto quello
            che sai, dalle mappe ai nomi, e ti ci vuole un'ora buona, con il
            pennino che gratta e il polso che si indurisce a metà pagina. Il
            sergente piega il foglio in quattro e lo infila nel cassetto con
            l'etichetta *Galdrick*, accanto a una crosta di pane che è lì da
            prima della razzia.

            Il diario lo tieni tu finché lo sceriffo non torna. Le chiavi di
            Ondrel le hai ancora in tasca, e il tunnel è sempre lì, sotto
            l'Acciaieria.
          effetti: { pista.acciaio: 1, rep.caserma: 1 }
      - testo: "Tenerlo e non parlarne con nessuno"
        descrizione: "Liaren te lo chiede con la mano sul tuo polso. Ondrel è morto, e il resto è roba di famiglia."
        immagine: personaggi/liaren-tarvelin
        requisiti: [diario.mappe == 1, diario.razzia == 1, diario.piano == 1, diario.amata == 1]
        esito:
          titolo: Roba di famiglia
          testo: |
            «Mio padre è morto» dice Liaren. «Se in città si sa di mia madre e
            di Vesh, domani il Grifone si riempie di gente venuta a guardarmi
            in faccia.» Chiude il diario e te lo mette in mano, e per un
            momento le dita le restano sulla copertina. «Tienilo tu. Io adesso
            non lo voglio vicino.»

            Brunella si schiarisce la voce dalla cassapanca. «Adesso posso parlare?»
            chiede, e senza aspettare risposta scende a prendere la zuppa per tutti e
            due, sbattendo il mestolo contro lo stipite. Le chiavi di Ondrel ce le hai
            in tasca, e il tunnel dei contrabbandieri è ancora là sotto, oltre il muro
            abbattuto dei magazzini.

            {origine rampollo-dei-quartieri-alti} Nei Quartieri Alti una storia
            così farebbe il giro dei salotti in una sera, e ogni sera tornerebbe
            un poco più grossa. Il diario pesa più di prima, adesso che sai a
            chi lo stai togliendo di mano.
          effetti: { pista.acciaio: 1, rep.tarvelin: 1 }
      - testo: "Portare il diario a Ottilia Sanvel"
        descrizione: "In Cattedrale non devi chiedere udienza a nessuno. Ottilia tiene gli archivi minori, e delle carte che non devono uscire si occupa lei."
        quando: [origine.accolito-del-velo >= 1]
        requisiti: [diario.mappe == 1, diario.razzia == 1, diario.piano == 1, diario.amata == 1]
        esito:
          titolo: Gli archivi minori
          testo: |
            Sali ai Quartieri Alti con il diario sotto la giubba ed entri in
            Cattedrale dalla porta dei sagrestani, senza farti annunciare.
            Ottilia Sanvel legge la traduzione di Liaren in piedi, accanto allo
            scaffale degli archivi minori, e quando arriva alla Regina delle
            Ali Spezzate non cambia espressione. Poi chiama due novizi e gli fa
            copiare le mappe per tutta la notte. Uno dei due, quando gli passi
            dietro, abbassa gli occhi sul foglio come facevi tu al suo posto.

            La mattina dopo Ottilia ti restituisce il diario legato con un
            nastro bianco. «Le copie restano qui. La Madre sarà informata»
            dice. «Tu intanto guarda in quel tunnel, prima che ci guardi
            qualcun altro.» Le chiavi di Ondrel ce le hai ancora in tasca.
          effetti: { pista.acciaio: 1, rep.velo: 1 }

  # ------------------------------------------------------------ 6 · il tunnel dei contrabbandieri (la prima volta)
  - id: il-tunnel-dei-contrabbandieri
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Il tunnel dei contrabbandieri
    sommario: "Sotto l'Acciaieria c'è un muro abbattuto a colpi di mazza, e dietro un tunnel che corre nella roccia per quasi un chilometro."
    luogo: Acciaieria dei Tarvelin, i sotterranei
    area: citta-bassa
    requisiti: [pista.acciaio == 6, tunnel.segrete == 0]
    testo: |
      La porta delle consegne si apre con la chiave più grossa del mazzo di
      Ondrel. Dentro fa freddo per la prima volta da quando l'Acciaieria
      esiste, perché la fornace è spenta, e l'odore di metallo bruciato è
      rimasto attaccato ai muri. Dalla sala di carico una scala di pietra
      scende al magazzino sotterraneo dove si teneva la sabbia. Contro il
      muro ci sono due carriole, e accanto alla scala c'è il muro di mattoni
      abbattuto a colpi di mazza. Qualcuno, dopo, ha raccolto i mattoni e li
      ha impilati in ordine contro le carriole, come si fa con la merce.
      Dietro il buco un passaggio vecchio scende verso sud.

      {conoscenze-della-strada Media} I mattoni impilati sono un'abitudine
      da magazzino. Chi ha sfondato il muro il mestiere dei contrabbandieri
      lo conosceva bene, oppure lo faceva.

      In fondo al passaggio c'è la stanza dove i contrabbandieri facevano i
      loro conti, e dove Isvaro ha passato le ultime notti. Ci sono una
      branda con la coperta per terra e un tavolo con le gambe incise di
      tacche. Sulla mensola le bottiglie vuote sono allineate per altezza,
      tutte con l'etichetta in fuori. *Anche ubriaco, le bottiglie le ha
      messe in fila.* La mano ti va da sola al diario che hai in tasca.

      {origine mercante-dei-ponti} Le tacche sulle gambe del tavolo sono
      raggruppate a cinque, con una barra di traverso, come le tengono i
      banchi dei Ponti quando non si fidano della carta. Sono tutte entrate.
      Le uscite, i contrabbandieri, se le tenevano a mente.

      Oltre la stanza comincia il tunnel, scavato nella roccia delle
      fondamenta. Lo segui con la lampada per quasi un chilometro verso
      nord-est, con il soffitto che ti sfiora i capelli e l'aria che si fa
      più fredda a ogni curva. Alla fine c'è un muro di roccia liscia e il
      tunnel si ferma lì. Sul pavimento, davanti al muro, la polvere è
      battuta da molti piedi larghi.

      {resistenza Facile} Dopo mezzo chilometro a testa china il collo ha
      cominciato a protestare, e la schiena gli dà ragione.
    opzioni:
      - testo: "Cercare le giunture nella roccia"
        descrizione: "I piedi larghi arrivano fino al muro e lì si fermano. Gli orchi da qualche parte sono passati."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il masso finto
          testo: |
            Passi la lampada sulla roccia palmo per palmo, e in basso a
            sinistra la luce non fa ombra dove dovrebbe farla. Ci appoggi la
            mano e la mano entra nella pietra, fredda come l'acqua di un
            pozzo, e il braccio ti si riempie di pelle d'oca fino alla spalla.
            Il masso è un'illusione. Dall'altra parte c'è una caverna
            con un mucchio di giacigli d'orco e gli avanzi dei loro pasti, e a
            destra una porta di legno rinforzato, chiusa. A sinistra si aprono
            due gallerie. Quella a est finisce in un crollo dopo centoventi
            metri, e quella a ovest passa per un muro abbattuto da poco.
          imposta: { tunnel.segrete: 1 }
          vai: segrete-dell-ira
        fallimento:
          titolo: La roccia
          testo: |
            Per un'ora tasti la roccia in ginocchio e poi in punta di piedi,
            finché le dita non sentono più niente e l'olio della lampada si
            abbassa di un dito. A un certo punto ti sorprendi a bussare, piano,
            come a una porta. La pietra è liscia e fredda dappertutto. Torni
            indietro per il tunnel con la lampada che sfrigola, e nella stanza
            dei contrabbandieri ti siedi sulla branda di Isvaro a massaggiarti
            le dita prima di risalire, davanti alle sue bottiglie in fila sulla
            mensola.
          effetti: { tormento: 1 }
      - testo: "Sentire il Mana nella roccia"
        descrizione: "Un muro dove finisce un tunnel lungo un chilometro è un muro strano. Se è fatto di Mana, le dita lo sentono."
        incantesimo: leggere-il-mana
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il formicolio
          testo: |
            Appoggi le dita alla roccia e lasci andare il Mana, e in basso a sinistra
            senti un formicolio fitto, come di un arto che si risveglia. Il masso è un
            incantesimo, e ci passi attraverso con gli occhi chiusi e la testa
            incassata nelle spalle, per abitudine. La pietra ti lascia sulla pelle un freddo da
            cantina. Dall'altra parte c'è una caverna con i giacigli degli orchi e gli
            avanzi dei loro pasti, e a destra una porta di legno rinforzato, chiusa. A
            sinistra la galleria a est finisce in un crollo, mentre quella a ovest
            passa per un muro abbattuto da poco.
          imposta: { tunnel.segrete: 1 }
          vai: segrete-dell-ira
        fallimento:
          titolo: Il ronzio
          testo: |
            Il Mana ti torna indietro tutto insieme, e per un momento senti la
            roccia ronzare dentro i denti. Ti ritrovi seduto per terra, con la
            lampada rovesciata e un sapore di rame in bocca. Il muro liscio è
            sempre lì, e ti ci vuole un pezzo prima di avere voglia di
            toccarlo di nuovo. Risali il tunnel con il ronzio ancora nelle
            gengive, e in cima alla scala ti accorgi che stai stringendo le
            chiavi di Ondrel fino a farti male, con i denti delle chiavi
            stampati nel palmo.
          effetti: { tormento: 1 }
      - testo: "Appoggiarti al muro e spingere"
        descrizione: "Le impronte finiscono contro il muro. Tu sei stanco, e il muro sembra fatto apposta per appoggiarcisi."
        costo: 2
        esito:
          titolo: Dall'altra parte
          testo: |
            Ti appoggi al muro con la spalla per riposare un momento, e la spalla
            ci affonda dentro. Cadi in avanti attraverso la pietra, e per un
            momento lungo non hai più né sopra né sotto.

            {acrobazia Facile fallita} Le braccia arrivano tardi, come sempre
            quando cadi attraverso una cosa che non esiste. Atterri sui gomiti in
            una caverna che puzza d'orco, in mezzo ai giacigli di paglia e agli
            ossi spolpati. Delle due gallerie che partono dalla caverna, quella
            a est finisce in un crollo, e quella a ovest passa per un muro
            abbattuto da poco.
          imposta: { tunnel.segrete: 1 }
          effetti: { tormento: 1 }
          vai: segrete-dell-ira
      - testo: "Leggere le impronte come quelle di un vicolo"
        descrizione: "In Città Bassa si impara presto a capire dalla polvere da dove è uscito qualcuno. Qui le impronte vanno contro il muro e non tornano."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Le punte dei piedi
          testo: |
            Ti accucci con la lampada e guardi la polvere come guardavi quella
            dei vicoli dietro la Pignatta, quando dovevi sapere se qualcuno ti
            aspettava dietro l'angolo. Le impronte arrivano al muro e non
            tornano indietro. Le ultime però sono soltanto punte, con il
            tallone sollevato, quelle di chi si abbassa per passare sotto una
            trave, e sono tutte in basso a sinistra. Ti viene da sorridere, da
            solo, nel buio, come quando a dieci anni scoprivi un nascondiglio.

            Allunghi la mano in quel punto e la mano entra nella pietra, fredda
            come l'acqua di un pozzo. Dall'altra parte c'è una caverna che
            puzza d'orco. Sulla destra c'è una porta di legno rinforzato che
            resta chiusa, mentre a sinistra partono due gallerie, una che
            finisce in un crollo e una che passa per un muro abbattuto da poco.
          imposta: { tunnel.segrete: 1 }
          vai: segrete-dell-ira
      - testo: "Guardare da che parte piega la fiamma"
        descrizione: "In fondo a un tunnel chiuso l'aria dovrebbe stare ferma. La fiamma della lampada, davanti al muro, non sta ferma."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Facile }
        successo:
          titolo: La fiamma storta
          testo: |
            Posi la lampada a terra davanti al muro e aspetti senza muoverti,
            come al Circolo si aspetta che una volpe metta il muso fuori dalla
            tana. La fiamma si piega piano verso il basso a sinistra, e da quel
            punto arriva un filo d'aria fredda che sa di paglia sporca e di
            carne vecchia. Allunghi la mano dove va la fiamma, e la mano entra
            nella pietra.

            Dall'altra parte c'è una caverna con i giacigli degli orchi e gli
            avanzi dei loro pasti, e a destra una porta di legno rinforzato,
            chiusa. A sinistra la galleria a est finisce in un crollo, mentre
            quella a ovest passa per un muro abbattuto da poco.
          imposta: { tunnel.segrete: 1 }
          vai: segrete-dell-ira
        fallimento:
          titolo: La fiamma dritta
          testo: |
            Aspetti a lungo, accucciato accanto alla lampada, finché ti si
            addormenta una gamba e la fiamma continua a stare dritta come un
            chiodo. Forse l'aria quaggiù non si muove, o forse si muove troppo
            piano per te. Risali il tunnel zoppicando sulla gamba che formicola,
            e nella stanza dei contrabbandieri ti siedi sulla branda di Isvaro
            ad aspettare che il sangue torni dove deve.
          effetti: { tormento: 1 }
      - testo: "Accendere la Luce fredda sulla roccia"
        descrizione: "La lampada fa tremare le ombre e le confonde. Una luce che non trema mostra la pietra com'è, e forse anche quella che non c'è."
        quando: [origine.allievo-di-torvessa >= 1]
        incantesimo: luce-fredda
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La luce ferma
          testo: |
            Copri la lampada con la giubba e accendi il cristallo, come al
            banco dell'Accademia lo accendevi per i curiosi. La luce fredda si
            posa sul muro ferma e uguale, senza il tremolio dell'olio. In basso
            a sinistra la pietra resta un poco più chiara del resto, come un
            disegno ripassato una volta di troppo, e le sue crepe non fanno
            ombra. Ci appoggi la mano e la mano entra nella roccia, fredda come
            l'acqua di un pozzo.

            Dall'altra parte c'è una caverna con i giacigli degli orchi e gli
            avanzi dei loro pasti, e a destra una porta di legno rinforzato,
            chiusa. A sinistra la galleria a est finisce in un crollo, mentre
            quella a ovest passa per un muro abbattuto da poco.
          imposta: { tunnel.segrete: 1 }
          vai: segrete-dell-ira
        fallimento:
          titolo: Il cristallo che sfarfalla
          testo: |
            Il cristallo si accende storto e sfarfalla, e la luce fredda salta
            sul muro a scatti, peggio della lampada. Ogni volta che si
            riaccende la roccia ti sembra diversa, e dopo un po' non sai più se
            stai guardando la pietra o il ricordo della pietra. Spegni tutto,
            con un dolore sottile dietro gli occhi, e risali il tunnel con il
            cristallo tiepido stretto nel pugno e la lampada che ti sembra,
            all'improvviso, una vecchia amica.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ 6 · il ritorno nelle Segrete
  - id: di-nuovo-nel-tunnel
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Di nuovo nel tunnel
    sommario: "Le bottiglie di Isvaro sono ancora in fila sulla mensola, e il masso finto è dove l'hai lasciato."
    luogo: Acciaieria dei Tarvelin, i sotterranei
    area: citta-bassa
    requisiti: [pista.acciaio == 6, tunnel.segrete >= 1]
    testo: |
      L'Acciaieria è chiusa e fredda come l'hai lasciata. Nella stanza dei
      contrabbandieri le bottiglie di Isvaro sono ancora in fila sulla
      mensola, e una si è rovesciata, forse per un topo. La rimetti dritta
      senza pensarci, prima di accorgerti di averlo fatto. Poi c'è il
      tunnel, lungo quasi un chilometro, e in fondo il masso che non c'è.

      {resilienza Facile} La seconda volta il masso fa meno paura. Fa un
      altro genere di paura, più educata.

      {origine apprendista-raschiatore} Sulle piattaforme ti hanno insegnato a
      contare le curve di una galleria all'andata, per non doverle cercare al
      ritorno. Le avevi contate la prima volta, e anche stavolta il conto
      torna, curva dopo curva, fino al masso.

      Ci passi attraverso con gli occhi chiusi, come l'ultima volta.
      Nella caverna i giacigli degli orchi sono come li hai lasciati, e oltre
      il muro abbattuto a ovest c'è sempre il mattone scritto a pece.
    opzioni:
      - testo: "Scendere nelle Segrete"
        descrizione: "La strada fino alla statua la sai. Il resto lo rifai da capo."
        esito:
          titolo: La statua
          testo: |
            Sali per la galleria dritta fino alla sala della statua e passi
            davanti alla donna di marmo rosso, con la faccia storta dalla
            rabbia e il libro della stella stretto nella sinistra. Il freddo
            ti entra sotto i vestiti come l'altra volta, a cominciare dai
            polsi. La saluti con un cenno del mento, perché ormai vi
            conoscete. Controlli che la lampada abbia olio, ti allacci la
            giubba fino al collo e ti incammini verso le gallerie basse.
          vai: segrete-dell-ira

  # ------------------------------------------------------------ le stanze (ripetibili, in fasce di profondità)
  - id: segrete-la-caverna-di-guardia
    immagine: ambientazione/marea-grigia
    titolo: La caverna di guardia
    sommario: "In una caverna bassa qualcosa cammina avanti e indietro sulle gambe piegate al contrario."
    luogo: Segrete dell'Ira, la caverna di guardia
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 0]
    testo: |
      Dove la galleria si allarga sulla destra c'è una caverna bassa, poco
      più grande di una stanza. Dentro cammina avanti e indietro una figura
      glabra e magra, alta quanto un uomo, sulle gambe piegate all'indietro
      come quelle di un cane. Si muove a scatti e barcolla, e ogni volta
      che si gira vedi la bocca. È troppo larga per la faccia, e dentro, al
      posto dei denti, ci sono piccole mani con tre dita che si aprono e si
      chiudono.

      {rissa Media} Gambe piegate così reggono male un calcio di lato, al
      ginocchio.

      In un angolo i contrabbandieri hanno lasciato un sacco di farina
      marcito da decenni, con il timbro di un mulino che a Qir-Azel non
      esiste più. Fai un passo indietro, e le dita cercano l'impugnatura
      prima che tu lo decida.

      {accademiche Difficile fallita} Quel mulino dovresti conoscerlo. Ti
      torna in mente soltanto l'odore del pane, che quaggiù è una crudeltà.
    opzioni:
      - testo: "Affrontarla"
        descrizione: "È una sola, ed è magra. Le mani che ha in bocca però sono parecchie."
        combattimento: una-colata
        vittoria:
          titolo: La pozza grigia
          testo: |
            Ti viene addosso a scatti, e le mani della bocca cercano la tua
            faccia prima delle sue braccia. Quando la colpisci si apre come
            cera calda e cola sul pavimento in una pozza grigia che fuma, con
            un odore di capelli bruciati. Nella pozza, per un momento, ti
            sembra di vedere una faccia d'uomo con la bocca aperta in un urlo,
            poi la superficie si appiana. Passi oltre senza guardarla più, e
            le mani ti tremano soltanto adesso, a cose fatte, come se avessero
            aspettato il permesso.
          effetti: { profondita.segrete-dell-ira: 1 }
        sconfitta:
          titolo: La manica
          testo: |
            Le mani della bocca ti prendono il polso e tirano, con una forza
            che da un corpo così magro non ti aspettavi. Ti liberi lasciandoci
            la manica e un po' di pelle, e torni indietro di corsa nella
            galleria, con il polso che brucia dove le dita ti hanno stretto.
            Lei non ti segue, e la cosa ti offende quasi più del polso.
            Riprende a camminare avanti e indietro come se tu
            non fossi mai entrato, e dal buio della galleria senti il
            ticchettio delle sue piccole mani che non si ferma.
      - testo: "Passarle alle spalle quando si gira"
        descrizione: "Va avanti e indietro sempre per lo stesso tratto. Prima o poi ti dà la schiena."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Otto passi
          testo: |
            Da dietro lo spigolo conti i passi. Sono otto all'andata e otto al
            ritorno, e per girarsi le serve il tempo di contare fino a due. Al terzo giro
            scivoli dentro rasente la parete, con gli stivali in mano, mentre
            lei guarda il muro in fondo. Quando si volta sei già nella galleria
            dall'altra parte, con la schiena incollata alla pietra e il cuore
            che batte negli stivali che tieni in mano, e la senti riprendere i
            suoi otto passi.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il sacco di farina
          testo: |
            A metà strada urti il sacco marcito, che si apre con uno sbuffo di
            polvere grigia. La figura si gira di colpo, e le mani della bocca
            si allungano verso di te. Ti graffiano il collo mentre torni di
            corsa nella galleria, e la polvere della farina ti si attacca alla
            ferita. Ti fermi solo quando non senti più il ticchettio delle
            dita, e ti pulisci il collo con la manica finché smette di
            sanguinare.

            {medicina Facile} Polvere vecchia in una ferita aperta. Va lavata
            appena trovi dell'acqua, prima che decida di restare.
          effetti: { ferite: 0.5 }
      - testo: "Calmare il respiro e passarle accanto"
        descrizione: "Gira la testa verso ogni rumore. Forse anche verso chi ha paura."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: A passo normale
          testo: |
            La guardi a lungo prima di muoverti, e capisci che si volta verso
            chi respira in fretta, più che verso chi cammina. Lasci cadere le
            spalle e sciogli le mani, e attraversi la caverna a passo
            normale contando fra te e te, come quando da bambino non riuscivi
            a dormire, e il conto arriva fino a un numero che non ti era mai
            servito. Ti passa a un braccio di distanza, con le piccole mani
            che si aprono nell'aria, e non si gira.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Le piccole mani
          testo: |
            Ci provi, ma a tre passi da lei il respiro ti scappa di mano e si
            fa corto. La testa glabra si gira verso di te tutta in una volta, e
            le piccole mani si tendono fuori dalla bocca. Torni indietro
            camminando all'indietro, senza toglierle gli occhi di dosso, e lei
            ti segue fino all'imbocco della galleria. Lì si ferma e resta a
            guardarti con la bocca aperta finché la lampada non gira l'angolo,
            e le piccole mani ti salutano, o ti chiamano.
          effetti: { tormento: 1 }
      - testo: "Aspettare che si allontani"
        descrizione: "Prima o poi andrà in fondo alla caverna. Bisogna restare accucciati al buio ad ascoltarla."
        costo: 2
        esito:
          titolo: Il ticchettio
          testo: |
            Ti accucci nella galleria con la lampada coperta e aspetti. Per
            un'ora senti il ticchettio delle piccole dita avvicinarsi e
            allontanarsi, e a un certo punto ti accorgi che lo stai contando
            a mezza voce. Quando finalmente si ferma in fondo alla caverna,
            passi rasente il muro opposto con le ginocchia rigide, e quel
            rumore ti resta nelle orecchie per tutta la galleria successiva,
            insieme al numero a cui eri arrivato.
          effetti: { profondita.segrete-dell-ira: 1, tormento: 1 }

  - id: segrete-la-vasca-dei-teschi
    immagine: ambientazione/rovine-dei-precursori
    titolo: La vasca dei teschi
    sommario: "Sopra una vasca d'acqua ferma, con i teschi allineati sul bordo, vola una testa senza corpo."
    luogo: Segrete dell'Ira, la vasca di purificazione
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 0]
    testo: |
      In una stanza rotonda c'è una vasca di pietra piena d'acqua ferma, così
      limpida che vedi le incisioni sul fondo. Lungo il bordo corre una fila
      di teschi, messi a distanza regolare e girati tutti verso l'acqua. A uno
      qualche contrabbandiere ha infilato per scherzo nell'orbita un sasso
      di fiume liscio e chiaro.

      {empatia Facile} Lo scherzo è vecchio, e chi l'ha fatto rideva per non
      sentire quanto aveva paura.

      Sopra la vasca svolazza una testa grande come quella di un cavallo,
      senza corpo, sorretta da due ali di pipistrello che battono troppo in
      fretta. Dal mento e dallo scalpo le pendono tentacoli lunghi un
      braccio, e le zanne sono tante che la bocca non riesce a chiudersi. Ti
      vede subito e si gira verso di te, e le ginocchia ti si piegano un poco
      da sole.

      {armi-da-distanza Media} È grossa e lenta a girare. Con un sasso buono
      la prenderesti fra gli occhi.
    opzioni:
      - testo: "Aspettarla e colpirla"
        descrizione: "Prima o poi ti viene addosso. Meglio che ti trovi pronto."
        combattimento: testa-alata
        vittoria:
          titolo: Nell'acqua
          testo: |
            Ti piomba addosso con la bocca aperta, e i tentacoli ti si
            avvolgono intorno al braccio con cui ti ripari. Il colpo giusto
            arriva quando si alza per riprendere slancio. La testa cade nella
            vasca, l'acqua si fa scura intorno alle ali e poi torna limpida,
            come se non fosse successo niente. Ti togli dal braccio un
            tentacolo rimasto attaccato, che si stacca con uno schiocco
            umido, e passi oltre tenendo il braccio lontano dal corpo, come se
            non fosse più del tutto tuo.
          effetti: { profondita.segrete-dell-ira: 1 }
        sconfitta:
          titolo: I tentacoli
          testo: |
            I tentacoli ti prendono alla faccia e le zanne ti aprono la
            spalla. Ti butti a terra e rotoli fino alla porta, e la testa ti
            insegue sbattendo le ali contro il soffitto. Fuori dalla stanza
            smette di seguirti e torna a svolazzare sopra la vasca come prima.
            Ti premi la manica sulla spalla per fermare il sangue, che passa
            fra le dita caldo e ostinato, e dal
            corridoio la senti respirare con un rumore di mantice bucato.
      - testo: "Tenerla lontana con la lampada e correre"
        descrizione: "Ha le ali di un pipistrello. Forse anche gli occhi."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La luce in faccia
          testo: |
            Alzi la lampada più che puoi e gliela spingi verso gli occhi, e la
            testa si ritrae sbattendo le ali. Corri intorno alla vasca tenendo
            la luce alta, saltando i teschi del bordo, e quando ti ritrovi
            dall'altra parte lei è ancora appesa al soffitto, a sbattere le
            palpebre. Esci con il braccio che trema per il peso della lampada,
            e la fiamma che trema con lui.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il teschio
          testo: |
            Inciampi in un teschio del bordo, e la lampada ti oscilla in mano
            facendo ballare tutta la stanza. La testa ti arriva addosso dal
            lato buio e ti morde il polpaccio, e le zanne ti restano nella
            carne per un momento lungo prima che riesca a strappartela via.
            Torni alla porta zoppicando e sbattendo la lampada contro l'aria,
            finché le ali si allontanano verso il soffitto. Nello stivale il
            sangue fa un rumore piccolo e bagnato.
          effetti: { ferite: 0.5 }
      - testo: "Lanciarle qualcosa che sappia di morto"
        descrizione: "Queste creature girano dove ci sono resti. Sul bordo della vasca ce ne sono parecchi."
        prova: { attributo: mentale, abilita: [natura, accademiche], difficolta: Media }
        successo:
          titolo: Il teschio dal sasso nell'occhio
          testo: |
            Prendi dal bordo il teschio più vicino, quello con il sasso
            nell'orbita, e lo lanci nel corridoio da cui sei venuto. La testa
            ci si butta dietro con un verso acuto, come un cane dietro a un
            osso. Mentre la senti rosicchiare nel buio attraversi la stanza
            dall'altra parte senza correre, e ti scusi a mezza voce con il
            padrone del teschio, chiunque fosse. Per scrupolo ti scusi anche con
            il contrabbandiere che gli aveva regalato il sasso.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Troppo pulito
          testo: |
            Il teschio che lanci è vecchio e pulito, e la testa non lo degna di
            uno sguardo. Guarda te, che sei più fresco. Scende in picchiata
            prima che tu possa prenderne un altro, e devi ritirarti nel
            corridoio con le braccia sopra la testa, mentre le ali ti sbattono
            contro la faccia. Il teschio rotola fino al bordo della vasca e si
            ferma lì, con le orbite girate verso di te.

            {resilienza Media fallita} Ti sembra offeso. Ti dici che i teschi
            non si offendono, e non ci credi fino in fondo.
          effetti: { tormento: 1 }
      - testo: "Passare a testa bassa e lasciarla mordere"
        descrizione: "La stanza è piccola. Qualche morso, e sei dall'altra parte."
        costo: 2
        esito:
          titolo: I morsi
          testo: |
            Ti tiri la giubba sopra la testa e attraversi la stanza di corsa,
            girando intorno alla vasca. Ti morde due volte sulla spalla e una
            sulla mano, e i tentacoli ti lasciano sulla pelle una bava che
            pizzica. Dall'altra parte ti fasci la mano con un lembo della
            camicia, stringendo il nodo con i denti e sentendo in bocca il
            sapore del tuo stesso sudore, e vai avanti senza
            voltarti mentre alle tue spalle le ali continuano a battere.
          effetti: { profondita.segrete-dell-ira: 1, ferite: 0.5 }

  - id: segrete-l-antica-prigione
    immagine: ambientazione/marea-grigia
    titolo: L'antica prigione
    sommario: "Venti celle intorno a una sala, la piattaforma di legno marcio e, in mezzo, due figure glabre che ti hanno già visto."
    luogo: Segrete dell'Ira, l'antica prigione
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 1]
    testo: |
      Esci su una piattaforma di legno che si affaccia su una sala grande,
      tre metri più in basso. Intorno, lungo i muri, ci sono venti celle con
      le sbarre mangiate dalla ruggine, e dalla piattaforma due scale
      scendono fino al pavimento. Lungo il bordo nord corre una passerella
      larga un metro e mezzo, che porta a un passaggio verso est. Il legno
      sotto i tuoi piedi è nero e molle, e scricchiola appena sposti il peso.

      {acrobazia Media} La passerella entra nella roccia, la piattaforma no.
      Se proprio devi fidarti di un legno, fidati di quello.

      In mezzo alla sala ci sono due figure glabre, sulle gambe piegate al
      contrario. Si girano verso di te insieme e vengono verso le scale a
      passo svelto, con le piccole mani che si agitano nella bocca. Sul muro
      di una cella, a carbone, qualcuno ha disegnato una finestra con le
      tende e un vaso di fiori sul davanzale.

      {empatia Media} Ci ha messo le tende perché una finestra senza tende,
      vista da dentro, sembra anche lei una cella.

      {origine fuggiasco-di-ghoran} Ti accorgi di aver contato le celle prima
      di guardare le due figure, e di aver già visto quale ha ancora la porta.
      A Ghoran lo facevi ogni volta che ti portavano in un posto nuovo, e il
      corpo non ha perso l'abitudine.
    opzioni:
      - testo: "Aspettarle in cima alle scale"
        descrizione: "Sono due. Dalla piattaforma però arrivano una alla volta."
        combattimento: due-colate
        vittoria:
          titolo: In cima alle scale
          testo: |
            La prima sale le scale a scatti e la colpisci quando mette il piede
            sull'ultimo gradino. Cola giù sopra la seconda in una pioggia
            grigia che fuma. La seconda ci passa attraverso, e ti ci vuole più
            tempo, con la piattaforma che ondeggia sotto di voi e le assi che
            gemono a ogni colpo. Quando è finita prendi la passerella verso
            est, e ti fermi soltanto nel passaggio, con la fronte appoggiata
            alla roccia fresca.
          effetti: { profondita.segrete-dell-ira: 1 }
        sconfitta:
          titolo: La piattaforma
          testo: |
            Ti arrivano addosso tutte e due insieme, e le mani delle loro bocche
            ti prendono ai vestiti. Riesci a strapparti via lasciandoci mezza
            giubba e torni indietro nel corridoio da cui sei venuto,
            sanguinando da un orecchio. Le figure si fermano sul bordo della
            piattaforma e restano lì a guardare il buio dove sei sparito, una
            accanto all'altra, con le piccole mani ferme nella bocca. L'orecchio
            ti fischia per tutta la galleria.
      - testo: "Correre lungo la passerella"
        descrizione: "Un metro e mezzo di legno vecchio fino al passaggio a est. Loro devono prima salire le scale."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La scala rotta
          testo: |
            Corri sulla passerella mentre loro salgono, e il legno ti si piega sotto
            gli stivali senza rompersi, per pura gentilezza. Arrivato all'imbocco del
            passaggio ti giri e dai un calcio al montante della scala più vicina, che
            crolla con i suoi gradini marci e si porta dietro anche l'altra. Le due
            figure restano sotto, a graffiare il muro con le dita della bocca, e il
            rumore ti accompagna per un pezzo lungo il passaggio, insieme a una
            soddisfazione che non sai bene dove mettere.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: L'asse
          testo: |
            A metà passerella un'asse cede, e la gamba ti va giù fino al ginocchio. La
            tiri fuori lasciandoci un pezzo di calzone e di pelle, e torni indietro di
            corsa mentre la prima figura arriva in cima alle scale, così vicina che
            senti il ticchettio delle dita. Ti rintani in fondo al corridoio, con
            la gamba che sanguina dentro lo stivale. Ogni volta che appoggi il piede
            senti il sangue che fa un piccolo rumore bagnato.
          effetti: { ferite: 0.5 }
      - testo: "Farle salire sulla piattaforma e farla cedere"
        descrizione: "Le travi sono marce. Il punto dove cedono sta a te trovarlo, e a loro arrivarci."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Le travi marce
          testo: |
            Guardi da dove nascono le travi e trovi quella che regge mezza
            piattaforma, nera di muffa dove entra nel muro. Ti sposti sulla
            passerella, che è piantata nella roccia, e aspetti. Quando le due
            figure salgono e ti vengono incontro, la trave si spezza sotto il
            loro peso, e precipitano di sotto in mezzo alle assi con un rumore
            di legna gettata nel camino. Passi verso est senza guardare giù.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: La trave sbagliata
          testo: |
            Scegli la trave sbagliata. La piattaforma ondeggia sotto i tuoi
            piedi invece che sotto i loro, e per un momento lungo vedi il
            pavimento della sala tre metri più in basso. Ti butti all'indietro
            nel corridoio, con le mani piene di schegge e le figure che
            arrivano in cima alle scale. Passi il resto del tempo seduto al
            buio, a toglierti le schegge con le unghie una per una, e a ogni
            scheggia ti dai dell'idiota a bassa voce.
          effetti: { tormento: 1 }
      - testo: "Chiuderti in una cella e aspettare"
        descrizione: "La cella con la finestra disegnata ha ancora la porta. Le sbarre reggono, forse."
        costo: 2
        esito:
          titolo: La finestra di carbone
          testo: |
            Scendi di corsa per la scala più lontana e ti chiudi nella cella con la
            finestra disegnata, tenendo la porta con tutte e due le mani. Le due
            figure graffiano le sbarre per un'ora, a un palmo dalla tua faccia, e il
            loro fiato non ha odore. Poi se ne vanno. Esci con le dita che non si
            aprono e prendi la passerella verso est, e il vaso di fiori a carbone ti
            resta negli occhi.
          effetti: { profondita.segrete-dell-ira: 1, tormento: 1 }

  - id: segrete-la-sala-degli-interrogatori
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sala degli interrogatori
    sommario: "Strumenti di tortura di un'epoca che non conosci, e una stella di legno piena di uncini davanti all'unica uscita."
    luogo: Segrete dell'Ira, la sala degli interrogatori
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 1]
    testo: |
      La sala è piena di strumenti fatti per far male, in uno stile che non hai
      mai visto. In un angolo c'è una gabbia sferica con le punte rivolte verso
      l'interno. Al centro sta un tavolo lungo coperto di cinghie di cuoio, con
      una fila di leve che dovevano farlo girare e avanzare a scatti. Una delle
      cinghie, chissà quando, l'ha riparata qualcuno che ci teneva al lavoro
      fatto bene, con un pezzo di cuoio più chiaro cucito a punti fitti e
      regolari.

      {intimidire Media} Chi ha arredato questa stanza le risposte non le
      cercava. Voleva che chi entrava capisse subito come sarebbe finita.

      L'unica uscita è un passaggio basso nella parete opposta, e davanti ci
      sta una struttura di legno a forma di stella, alta più di te, con la
      superficie piena di uncini. Il legno è secco e grigio, e gli uncini
      sono arrugginiti ma ancora appuntiti. Ti accorgi di tenere le mani
      chiuse a pugno, con i pollici dentro.

      {resilienza Facile fallita} Ti dici che è roba vecchia e che chi la
      usava è polvere da secoli, e intanto i pollici restano dove sono.
    opzioni:
      - testo: "Spostare la stella di legno"
        descrizione: "È pesante, e gli uncini sono dappertutto. Bisogna prenderla dal centro."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il centro della stella
          testo: |
            Infili le braccia fra due punte fino al mozzo e la sollevi di un
            palmo, con il legno che geme e gli uncini a un dito dalle guance.
            La trascini di lato un passo alla volta, con i talloni che
            scivolano sulla pietra. Quando la posi, il
            passaggio è libero e tu hai le braccia che tremano e un graffio
            sottile sul collo, che ti accorgi di avere soltanto dopo.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Gli uncini
          testo: |
            La stella è più pesante di quanto sembra, e quando ti scivola di
            mano gli uncini ti prendono l'avambraccio. Ti liberi strappando la
            manica, e il sangue ti cola fino al polso. La stella è rimasta
            davanti al passaggio, appena storta, con un filo della tua manica
            appeso a un uncino. Torni indietro a fasciarti,
            con il braccio tenuto contro il petto e la ruggine degli uncini
            che ti preoccupa più del taglio.
          effetti: { ferite: 0.5 }
      - testo: "Capire come si smonta"
        descrizione: "Una cosa così non la porti dentro intera. Qualcuno l'ha montata qui, e si può smontare."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il perno
          testo: |
            Dietro il braccio più basso della stella trovi un perno di ferro
            infilato in un anello murato. Lo sfili con due colpi del palmo, e
            la stella gira su se stessa come una porta, aprendo il passaggio.
            Chi l'ha costruita sapeva il fatto suo, e ci teneva quanto quello
            della cinghia.

            {tecnologia Media} Un perno solo e un anello murato. Era fatta per
            essere aperta da una persona, in fretta, senza chiamare aiuto.

            La richiudi dietro di te, perché in fondo al passaggio ti sembra di
            sentire dei passi.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Le leve
          testo: |
            Tiri il perno sbagliato, che è legato con una catena alle leve del
            tavolo. Il tavolo dà uno scatto e poi un altro, e le cinghie si
            tendono intorno a niente, alla misura di un uomo sdraiato. Resti
            fermo con il cuore che batte finché si fermano, e il silenzio dopo
            l'ultimo scatto è peggio dello scatto. Per un pezzo non
            hai voglia di toccare nient'altro, e quando ci riprovi lo fai con
            la punta delle dita.
          effetti: { tormento: 1 }
      - testo: "Strisciare sotto, fra gli uncini"
        descrizione: "Fra il pavimento e la punta più bassa c'è spazio per un corpo, se il corpo non ha fretta."
        costo: 2
        esito:
          titolo: Sotto la stella
          testo: |
            Ti stendi sulla pancia e strisci sotto la punta più bassa, con la
            guancia sulla pietra fredda. A metà un uncino ti si impiglia nella
            giubba e un altro ti graffia la schiena, e per liberarti devi
            tornare indietro di un palmo e ricominciare. Esci dall'altra parte
            con la polvere in bocca e la camicia incollata alla schiena, e ti
            ci vuole un momento prima di rimetterti in piedi, con le ginocchia
            che hanno opinioni precise sulla faccenda.
          effetti: { profondita.segrete-dell-ira: 1, ferite: 0.5 }

  - id: segrete-lo-studio-delle-sette-punte
    immagine: ambientazione/rovine-dei-precursori
    titolo: Lo studio delle sette punte
    sommario: "Sedie crollate, libri ridotti in frammenti e tre porte di pietra con la stessa stella incisa sopra."
    luogo: Segrete dell'Ira, l'antico studio
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 2]
    testo: |
      Il pavimento è ingombro dei resti di un tavolo lungo e di una decina di
      sedie crollate su se stesse, e fra il legno marcio ci sono frammenti di
      libri e di pergamene, a centinaia, coperti di una scrittura spigolosa
      che sembra fatta a punta di coltello. Sulla parete sud ci sono tre
      porte di pietra basse e strette come quelle di una cella, e su ognuna
      è incisa una stella a sette punte, la stessa del libro della statua.

      {accademiche Difficile} Gli angoli di quella scrittura vengono dalla
      pietra. Qualcuno l'ha imparata incidendo, e solo dopo l'ha portata
      sulla carta.

      In mezzo ai frammenti c'è un tappo di sughero nuovo, chiaro, che
      odora ancora di vino. Lo rigiri fra le dita. *Qui sotto qualcuno ha
      stappato una bottiglia, e non molto tempo fa.* Le tre porte sono
      chiuse, e dietro almeno una la strada deve continuare.

      {conoscenze-della-strada Facile} Sughero buono, da vino che costa.
      Chi lo beve quaggiù ci è sceso con la borsa piena.
    opzioni:
      - testo: "Leggere i frammenti"
        descrizione: "La scrittura è antica, ma le figure si capiscono. Fra tanti fogli ci sarà una pianta."
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: La pianta
          testo: |
            Delle parole non capisci niente. Su un frammento più grande degli
            altri, però, c'è il disegno di queste stanze, con la stella a sette
            punte segnata accanto a ogni porta. Accanto a quella di destra c'è
            un segno in più, una freccia che scende. Spingi la porta di destra
            con la spalla e si apre su una galleria che va in basso, da cui
            sale un'aria più fredda che ti asciuga il sudore sulla fronte.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Le punte di coltello
          testo: |
            Più guardi la scrittura spigolosa e più le lettere ti sembrano
            muoversi sul foglio, una punta dopo l'altra. Ti viene un dolore
            dietro gli occhi che non passa, e quando alzi la testa non sai più
            quanto tempo è passato. La lampada ha consumato più olio di quanto
            pensavi, e le tre porte sono ancora chiuse. Hai la bocca secca e un
            pollice sporco d'inchiostro vecchio. Rimetti giù il foglio
            con cura, come se qualcuno dovesse tornare a cercarlo.
          effetti: { tormento: 1 }
      - testo: "Spingere le porte una per una"
        descrizione: "Tre porte di pietra. Una si aprirà, se le spalle reggono."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La terza porta
          testo: |
            La prima non si muove e la seconda nemmeno. La terza cede di un
            dito alla prima spinta e di un palmo alla seconda, con un rumore di
            pietra su pietra che ti fa stringere i denti. Ci passi di fianco
            con la spalla indolenzita e le dita bianche di polvere di pietra, e
            dall'altra parte trovi una galleria
            che scende. Prima di andare ti volti a guardare le altre due porte,
            e sei contento di non averle aperte.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: La spalla
          testo: |
            Spingi finché la spalla ti manda una fitta che arriva fino al
            collo, e le tre porte restano dove sono. Ti siedi su quello che
            resta di una sedia a massaggiarti il braccio. Da dietro la porta
            di mezzo, mentre stai lì, arriva un colpo solo, sordo, come di
            qualcuno che ha sentito bussare e risponde.

            {resistenza Media fallita} Le gambe decidono per te, e decidono di
            correre. La spalla protesta per tutto il tragitto.

            Ti alzi e te ne vai senza aspettare il secondo.
          effetti: { ferite: 0.5 }
      - testo: "Seguire l'odore del vino"
        descrizione: "Chi ha perso il tappo è passato per una di queste porte, e la bottiglia l'aveva aperta."
        costo: 2
        esito:
          titolo: Il vino di Isvaro
          testo: |
            Ti chini davanti a ogni porta e annusi la fessura, a lungo, con la
            faccia sulla pietra, sentendoti un poco cane da tartufi. Dalla
            terza arriva un filo debole di vino rosso, e sotto c'è un odore di
            pietra bagnata. Ti ci vuole tutto il
            peso del corpo per aprirla. Il freddo che arriva dall'altra parte
            ti entra nel petto e ti resta addosso per un pezzo, e la spalla con
            cui hai spinto ti fa male fino a sera. Il vino, almeno, aveva un
            buon odore.
          effetti: { profondita.segrete-dell-ira: 1, tormento: 1 }

  - id: segrete-la-camera-sospesa
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: La camera sospesa
    sommario: "Una stanza rotonda come una bolla, dove le cose galleggiano a mezz'aria e le pareti scrivono da sole."
    luogo: Segrete dell'Ira, la camera di meditazione
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 3]
    testo: |
      La stanza è una sfera larga quattro metri e mezzo, e appena ci metti
      dentro la testa i capelli ti si alzano dalla nuca. Al primo passo i
      piedi si staccano da terra. A mezz'aria galleggiano pigramente un corvo
      morto, circondato da un alone di vermi che si contorcono nel vuoto, e
      una bacchetta di ferro contorto con la punta biforcuta. C'è anche una
      bottiglia di vino rosso con un nastro legato al collo, piena per tre
      quarti, che gira piano su se stessa.

      {acrobazia Facile} Senza peso il corpo chiede soltanto un punto fermo.
      Le pareti ci sono, e ti sembrano un'idea pessima.

      Le pareti sono rivestite di lamine di un metallo rosso, e ogni tanto le
      attraversa una scarica nera, senza rumore. Le scariche prendono la
      forma di rune, a volte di parole intere, troppo spesso perché sia un
      caso. L'uscita è un'apertura tonda dall'altra parte della sfera, e le
      ginocchia cercano un pavimento che non c'è, come quando un ponte ondeggia.

      {magia Media} Qui il Mana gira in tondo, come l'acqua in un catino
      appena mescolato. Le scariche nere sono la parte che non trova
      l'uscita.
    opzioni:
      - testo: "Afferrare la bacchetta quando ti passa vicino"
        descrizione: "Le cose qui dentro girano sempre allo stesso modo. Basta mettersi dove passerà."
        immagine: icone/crystal-wand
        quando: [oggetto.bacchetta-della-stretta-folgorante == 0]
        prova: { attributo: mentale, abilita: [percezione, tecnologia, magia], difficolta: Media }
        successo:
          titolo: La bacchetta
          testo: |
            Guardi gli oggetti girare finché ne impari il giro lento e sempre
            uguale. Poi ti spingi piano lungo la parete fino al punto dove la
            bacchetta passerà. Ti arriva in mano da sola. È fredda e pesa più
            di quanto sembra, e per un momento fra le due punte scocca una
            scintilla nera che ti fa rizzare i peli del braccio. La infili nella
            cintura e ti lasci portare fino all'uscita.
          effetti: { oggetto.bacchetta-della-stretta-folgorante: 1, profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il corvo
          testo: |
            Sbagli il giro, e invece della bacchetta ti arriva in faccia il
            corvo morto con il suo alone di vermi. Lo respingi con il braccio,
            e i vermi ti si attaccano alla manica e ci restano. Ti tiri fuori
            dalla sfera per la stessa apertura da cui sei entrato, e ti ci
            vuole un pezzo per toglierteli tutti di dosso, uno per uno, storcendo
            la bocca a ogni verme.
          effetti: { tormento: 1 }
      - testo: "Attraversarla a bracciate"
        descrizione: "Ti dai la spinta dalla soglia e speri di arrivare dall'altra parte senza toccare le pareti."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La spinta
          testo: |
            Ti accucci sulla soglia e ti dai la spinta con tutte e due le
            gambe. Attraversi la sfera dritto, con le braccia avanti, sfiorando
            la bottiglia che si mette a girare più in fretta. Prendi il bordo
            dell'uscita con le dita e ti tiri fuori, e il peso ti ricade
            addosso tutto in una volta, fino nelle ginocchia. Le gambe si
            ricordano di colpo a cosa servono. Resti un momento
            a quattro zampe sulla pietra, contento di sentirla sotto le mani.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: La parete rossa
          testo: |
            La spinta è storta, e invece dell'uscita vai a sbattere contro la
            parete. Una scarica nera ti corre lungo il braccio fino alla spalla
            senza fare rumore, e ti lascia la mano addormentata. Per un attimo
            sotto la pelle del polso vedi una runa che non è tua, disegnata
            con precisione, poi sparisce. Ti trascini
            indietro lungo le lamine fino alla soglia da cui sei entrato, e la
            mano ti torna sensibile soltanto dopo, un dito alla volta, con
            mille spilli per ciascuno.
          effetti: { ferite: 0.5 }
      - testo: "Leggere i lampi sulle pareti"
        descrizione: "Le scariche formano parole in una scrittura antica. Forse dicono qualcosa di utile."
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: Le parole nere
          testo: |
            Le parole sono spigolose, come scritte a punta di coltello, e
            ogni tanto ne riconosci una. Parlano di collera e di vendetta e non
            finiscono mai una frase. Capisci però che le scariche corrono tutte
            verso l'uscita, come acqua verso uno scolo. Ti lasci tirare piano
            dalla loro parte e arrivi all'apertura senza fatica, e prima di
            uscire ti accorgi che stai ancora cercando di leggere, con le
            labbra che si muovono da sole.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: La frase che manca
          testo: |
            Le parole ti entrano negli occhi e ci restano. Dicono rabbia e poi
            vendetta, e poi di nuovo rabbia, sempre a un passo dal diventare
            una frase intera. Ti accorgi di avere i pugni stretti e la mascella
            che fa male, perché stringi i denti da un pezzo senza saperlo. Esci
            dalla sfera all'indietro, e la frase che manca
            ti resta in testa per tutta la galleria, con un buco in mezzo dove
            dovrebbe esserci il verbo.
          effetti: { tormento: 1 }
      - testo: "Lasciarti andare alla deriva"
        descrizione: "Prima o poi il giro lento ti porta dall'altra parte. Insieme al corvo."
        costo: 2
        esito:
          titolo: In compagnia del corvo
          testo: |
            Ti lasci staccare da terra e aspetti, a mezz'aria, che il giro
            lento ti porti dove vuoi. Ci vuole più di un'ora. Il corvo morto
            ti passa accanto tre volte, e alla terza un verme ti si posa sulla
            guancia. Quando le dita toccano il bordo dell'uscita ti ci
            aggrappi forte, e il primo passo fuori ti fa barcollare come
            quando si scende da una barca. Ti passi la mano sulla guancia per
            un pezzo, anche se il verme non c'è più.
          effetti: { profondita.segrete-dell-ira: 1, tormento: 1 }

  - id: segrete-il-santuario
    immagine: ambientazione/mito-regina-ali-spezzate
    titolo: Il santuario
    sommario: "In cima a pochi gradini c'è un altare di marmo nero, e nel bacile c'è un'acqua che ti fa venire sete."
    luogo: Segrete dell'Ira, il santuario
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 3]
    testo: |
      La galleria si allarga in quello che doveva essere un piccolo
      santuario. Una scala di pochi gradini sale a nord-est fino a una
      piattaforma di pietra grigia, e sulla piattaforma c'è un altare, un
      blocco consunto di marmo nero con un bacile poco profondo al centro.
      Nel bacile c'è un'acqua torbida e ferma che sembra sporca, e che non
      ha nessun odore.

      Sui gradini ci sono impronte d'orco nel fango secco. Salgono fino
      all'altare con un passo normale, e scendono più larghe e trascinate,
      come se chi le ha fatte fosse diventato più pesante lassù. Ai piedi
      dell'altare c'è una ciotola di legno con i segni dei denti sul bordo.

      {empatia Difficile} Qualcuno ha morso quella ciotola per tenersi
      lontano dal bacile, e a giudicare dalle orme del ritorno ha perso.

      {origine figlio-del-circolo} Nel Bosco di Velthar un'acqua dove le
      bestie non vanno a bere si lascia stare, e al Circolo te l'hanno
      ripetuto finché ti è entrato nelle ossa. Intorno al bacile non c'è
      nemmeno l'impronta di un topo.

      Hai la gola secca da quando sei sceso, e adesso te ne accorgi.

      {resistenza Media fallita} La sete ti prende alla gola tutta insieme,
      come se l'avessi tenuta da parte apposta per questo momento.
    opzioni:
      - testo: "Capire che cosa c'è in quell'acqua"
        descrizione: "In una cantina l'acqua ferma puzza sempre di qualcosa. Questa non ha odore, e la cosa ti mette a disagio."
        prova: { attributo: mentale, abilita: [medicina, resilienza], difficolta: Media }
        successo:
          titolo: L'acqua che lavora
          testo: |
            Ti avvicini quanto basta e guardi l'acqua alla luce della lampada,
            senza chinarti troppo. Sul fondo del bacile c'è un deposito
            grigio, come quello che resta nei bicchieri degli speziali, e
            intorno all'altare manca ogni insetto, perfino quelli morti. In una
            cantina di Qir-Azel le blatte non mancano mai, e la loro assenza ti
            mette i brividi più di cento blatte. Ti asciughi la bocca
            con il dorso della mano e scendi dall'altra parte senza voltarti,
            con la sete che ti segue per un pezzo.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: La sete
          testo: |
            Più guardi l'acqua e più la gola ti brucia. Ti ritrovi chino sul
            bacile con le mani a coppa, e ti fermi quando il naso è a un dito
            dalla superficie. Torni giù per i gradini a passi lunghi e ti
            siedi contro la parete della galleria, con la lingua che ti si
            attacca al palato. Ci metti un pezzo a convincere le mani a
            smettere di fare la coppa, e alla fine le infili sotto le ascelle.
          effetti: { tormento: 1 }
      - testo: "Passare di corsa, a polmoni pieni"
        descrizione: "Una cosa che fa venire sete si supera come si supera una cantina che puzza."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Due gradini alla volta
          testo: |
            Riempi i polmoni fino a sentirli tirare e sali i gradini due alla
            volta. Giri intorno
            all'altare senza guardare il bacile e ti butti giù dall'altra
            parte, con il petto che comincia a bruciare e le tempie che
            battono. Respiri soltanto
            quando sei in fondo alla galleria, piegato in due con le mani sulle
            ginocchia, e ti accorgi che la gola ti brucia meno di prima. Dietro
            di te l'acqua del bacile non ha fatto nemmeno un'increspatura.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il gradino
          testo: |
            All'ultimo gradino il piede scivola nel fango secco, e cadi con le
            ginocchia sulla pietra, a un braccio dall'altare. Il colpo ti
            sale fino ai denti, e in bocca hai un sapore di ferro. Il bacile è
            lì, all'altezza della tua faccia, e l'acqua dentro è perfettamente
            ferma. Torni indietro a quattro zampe
            senza guardarlo, con le ginocchia che sanguinano e la gola in
            fiamme, e ti rialzi soltanto in fondo ai gradini.
          effetti: { ferite: 0.5 }
      - testo: "Girare largo, rasente la parete"
        descrizione: "C'è un passaggio stretto lungo il muro, lontano dall'altare. È lungo, e l'acqua si sente lo stesso."
        costo: 2
        esito:
          titolo: Rasente il muro
          testo: |
            Giri intorno al santuario con la schiena contro la parete e gli
            occhi sul pavimento, un passo laterale alla volta. Ci metti un'ora,
            e per tutto il tempo hai in bocca il pensiero dell'acqua, come una
            canzone che non se ne va. Dall'altra parte bevi un sorso dalla tua
            borraccia, e poi un altro, e l'acqua della città ti sembra sapere
            di latta più del solito. La bevi lo stesso fino all'ultima goccia.
          effetti: { profondita.segrete-dell-ira: 1, tormento: 1 }

  # ------------------------------------------------------------ Uzgreth alle fosse (facoltativo)
  - id: uzgreth-alle-fosse
    immagine: personaggi/uzgreth
    titolo: Uzgreth alle fosse
    sommario: "Una camera fredda con undici portelli nel pavimento, e un orco deforme con uno spadone da ogre che ne fa la guardia."
    luogo: Segrete dell'Ira, le fosse dei prigionieri
    area: segrete-dell-ira
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira == 2, oggetto.spadone-di-uzgreth == 0]
    testo: |
      La camera è più fredda delle altre, con il soffitto ad arco che sale a
      sei metri. Sul pavimento ci sono undici portelli di legno sparsi senza
      ordine, ognuno sopra una fossa larga un metro e mezzo, e dal buio sotto
      i portelli salgono rumori soffocati. Ogni tanto si sente un gemito
      sordo, e poi niente.

      In mezzo ai portelli c'è un orco più tozzo e più largo di qualunque
      orco tu abbia visto, con la pelle di un colore malato e gli occhi rossi
      di sangue. Regge con tutte e due le mani uno spadone enorme di ottima
      fattura, appoggiato alla spalla. *La spada da ogre dei Nove Chiodi,
      quella che secondo Ilvaena era troppo grande anche per lui.* Adesso gli
      sta in mano come se l'avessero forgiata su misura.

      {armi-da-mischia Media} Uno spadone così vuole spazio per girare.
      Sotto l'arco ce n'è, ma ogni portello è un passo che lui deve
      contare prima di farlo.

      Quando parla, la sua voce è più bassa di quella di qualunque orco, e
      sembra salire dal fondo delle fosse insieme ai gemiti.

      «Il Demone ha chiesto a Uzgreth di guardare il suo gregge» dice.
      «Uzgreth fa quello che dice il Demone, e il Demone dice di squartare
      gli intrusi insolenti.» Sposta il peso da un piede all'altro, e un
      portello sotto di lui scricchiola.

      {empatia Media} Ripete gli ordini del Demone come un bambino ripete la
      lezione, fiero di saperla a memoria.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "È enorme, e lo spadone gli sta in mano come un giocattolo. Però è lento, e lo sa anche lui."
        combattimento: le-fosse
        vittoria:
          titolo: Lo spadone
          testo: |
            Uzgreth mena colpi che spaccano i portelli e fanno volare le
            schegge, e dalle fosse aperte si alzano mani grigie. Tu resti
            sempre dove lui non arriva. Quando finalmente cade lungo disteso,
            lo spadone gli scivola dalle dita. Lo raccogli con tutte e due le
            mani, e pesa quanto un bambino. Le braccia ti tremano ancora per i
            colpi parati. Sotto i portelli rotti i morti delle fosse si
            agitano, ma non salgono.
          effetti: { oggetto.spadone-di-uzgreth: 1, profondita.segrete-dell-ira: 1, racconto: 1 }
        sconfitta:
          titolo: Il gregge
          testo: |
            Lo spadone ti prende di piatto e ti manda a sbattere contro un
            portello, che si apre sotto di te. Per un attimo hai le gambe nel
            buio della fossa e qualcosa di freddo ti stringe la caviglia. Ti
            tiri fuori a forza di braccia e scappi dalla camera, e Uzgreth non
            ti insegue. Lo senti ripetere che il Demone sarà contento, e la
            caviglia ti resta fredda fino alla galleria dopo.
      - testo: "Fargli mettere il piede su un portello"
        descrizione: "I portelli scattano come trappole. Uno sotto quel peso deve essere il più marcio."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il portello marcio
          testo: |
            Guardi i portelli uno per uno finché trovi quello con i cardini
            mangiati dalla ruggine, e ti metti dall'altra parte, a provocarlo.
            Uzgreth ti viene incontro dritto, perché è così che fa tutto. Il
            portello scatta sotto il suo piede e lui va giù nella fossa fino
            alle spalle, e lo spadone, troppo largo, resta di traverso sul
            bordo. Dal fondo i morti lo tirano per le gambe, e lui li chiama
            gregge fino all'ultimo. Prendi lo spadone e te ne vai prima di
            sentire come finisce.
          effetti: { oggetto.spadone-di-uzgreth: 1, profondita.segrete-dell-ira: 1, racconto: 1 }
        fallimento:
          titolo: Il portello sbagliato
          testo: |
            Il portello che hai scelto regge, e Uzgreth ti arriva addosso con
            lo spadone alto. La lama ti apre la coscia mentre ti butti di lato,
            e scappi dalla camera trascinando la gamba. Da dietro arriva la
            sua voce profonda, che conta i portelli uno per uno mentre tu li
            scavalchi. Ti fermi a stringere la coscia con la cintura soltanto
            quando la voce è lontana, e il sangue continua a passare sotto il
            cuoio.

            {medicina Facile} Stringi più su del taglio, finché fa più male.
            Poi conta fino a cento prima di guardare.
          effetti: { ferite: 2 }
      - testo: "Dirgli che ti manda il Demone"
        descrizione: "Uzgreth obbedisce al Demone. Non è detto che sappia riconoscere chi parla per lui."
        prova: { attributo: sociale, abilita: [ingannare, persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Gli ordini del Demone
          testo: |
            Gli dici che il Demone ti ha chiamato giù, e che è arrabbiato
            perché lo fanno aspettare. Uzgreth ti guarda a lungo con i suoi
            occhi rossi, poi abbassa lo spadone. «Il Demone è sempre
            arrabbiato» dice, e si sposta di lato, attento a dove mette i
            piedi. Passi fra i portelli senza correre, e senti il suo sguardo
            sulla nuca fino alla porta.

            {ingannare Media} Ti ha creduto perché il Demone è davvero sempre
            arrabbiato. Le bugie migliori si appoggiano a una cosa vera.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Insolente
          testo: |
            Uzgreth ti ascolta fino alla fine. «Il Demone non manda nessuno»
            dice, scandendo le parole come un maestro con un allievo lento. «Il
            Demone chiama Uzgreth.» Lo spadone arriva dal basso, e ti prende al
            fianco mentre già corri verso la porta. Ti fermi due gallerie più
            in là a tamponarti la ferita con la camicia, che si inzuppa subito
            e ti si incolla calda alla pelle,
            e senti ancora la sua voce che ripete la lezione alle fosse.
          effetti: { ferite: 2 }
      - testo: "Passare lungo il muro mentre parla"
        descrizione: "Uzgreth parla volentieri, e quando parla guarda il soffitto."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Lungo il muro
          testo: |
            Uzgreth ricomincia a parlare del Demone e del suo gregge, con gli
            occhi rossi rivolti all'arco del soffitto. Ti muovi lungo il muro
            mettendo i piedi solo sulla pietra lontano dai portelli. Quando da
            una fossa sale un gemito più forte degli altri resti con un piede
            sollevato, e lo rimetti giù soltanto quando il gemito si spegne.
            Arrivato alla porta hai le unghie piantate nei palmi. Ti volti, e lui sta ancora parlando, con la
            testa all'indietro e lo spadone appoggiato alla spalla.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il portello che scricchiola
          testo: |
            Metti il piede su un portello che sembrava pietra, e il legno
            scricchiola. Uzgreth abbassa gli occhi su di te, lentamente, come
            se la cosa lo annoiasse. Ti butti verso la porta, e lo spadone ti
            passa così vicino che senti il vento sul collo, poi la punta ti
            prende la spalla e ci entra fino all'osso. Esci dalla camera con il
            braccio che pende e la sua voce che ti chiama insolente, una
            sillaba alla volta, come se ti stesse insegnando la parola.
          effetti: { ferite: 2 }
      - testo: "Rispondergli con la voce dei sorveglianti"
        descrizione: "Uzgreth fa la guardia a un gregge chiuso nelle fosse e ripete gli ordini che gli hanno dato. A Ghoran hai sentito per anni come gridano quelli che fanno la guardia ai recinti."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [intimidire], difficolta: Media }
        successo:
          titolo: Il gregge contato
          testo: |
            Riempi il petto e gli gridi addosso come gridavano i sorveglianti
            di Ghoran, con le parole corte e lo sguardo piantato sopra la sua
            testa. Gli dici che il Demone vuole il gregge contato, e che lo
            vuole adesso. Uzgreth abbassa lo spadone e comincia a contare i
            portelli a voce alta, uno per uno, con la fronte aggrottata, e tu
            passi fra le fosse mentre arriva a sette.

            {resilienza Media} La voce era la loro, e l'hai presa in prestito
            soltanto per il tempo che serviva. Le spalle, sulla porta, ti
            tornano giù da sole.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Uno del gregge
          testo: |
            A metà della seconda frase la voce ti si incrina, e ne esce la tua
            voce di prima, di quando stavi sotto. Uzgreth inclina la testa e ti
            guarda come si guarda una bestia scappata dal recinto. Lo spadone
            arriva dal basso e ti prende al fianco mentre già corri verso la
            porta, e ti fermi a tamponare la ferita soltanto due gallerie più
            in là, con la camicia incollata alla pelle e il suo conto dei
            portelli che ti arriva ancora dal buio.
          effetti: { ferite: 2 }
      - testo: "Correre sui portelli come sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice si impara a sapere quale asse regge e quale no prima di metterci il piede. Uno come Uzgreth, se lo fai correre, il piede lo mette dove capita."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [atletica, tecnologia], difficolta: Difficile }
        successo:
          titolo: L'asse che non regge
          testo: |
            Corri fra le fosse saltando da un bordo di pietra all'altro, come
            sulle impalcature quando il turno è finito e la scala è lontana, e
            guardi i cardini di ogni portello che scavalchi. Quello mangiato
            dalla ruggine lo lasci fra te e lui. Uzgreth ti insegue dritto,
            perché è così che fa tutto, e il portello scatta sotto il suo
            piede. Va giù nella fossa fino alle spalle, e lo spadone, troppo
            largo, resta di traverso sul bordo. Dal fondo i morti lo tirano
            per le gambe, e lui li chiama gregge fino all'ultimo. Prendi lo
            spadone e te ne vai prima di sentire come finisce.
          effetti: { oggetto.spadone-di-uzgreth: 1, profondita.segrete-dell-ira: 1, racconto: 1 }
        fallimento:
          titolo: Il bordo sbagliato
          testo: |
            Al terzo salto il bordo di pietra che avevi scelto è un portello
            dipinto di polvere, e il piede ti affonda fino al ginocchio nel
            legno marcio. Ti tiri fuori mentre Uzgreth arriva, e lo spadone ti
            apre la coscia prima che tu sia di nuovo in piedi. Scappi dalla
            camera trascinando la gamba, e la sua voce profonda conta i
            portelli dietro di te, uno per uno, finché non svolti nella
            galleria.
          effetti: { ferite: 2 }
      - testo: "Parlargli come al servitore di un'altra casa"
        descrizione: "Uzgreth ripete gli ordini del padrone come un valletto alla porta. Nei Quartieri Alti si impara presto come si parla al servitore di un'altra casa perché ti lasci passare senza disturbare il padrone."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Media }
        successo:
          titolo: Atteso
          testo: |
            Non alzi la voce e non lo guardi negli occhi più del dovuto. Gli
            fai sapere di essere atteso, e lasci a lui di immaginare chi dovrà
            spiegare al Demone il ritardo. Usi il tono che nella casa della tua
            famiglia si usava con i valletti degli ospiti. Uzgreth sbatte le palpebre rosse, guarda lo spadone
            come se non si ricordasse più di chi è, e si fa da parte con un
            mezzo inchino goffo. Attraversi la camera a passo di salotto, e
            soltanto sulla porta ti accorgi che tieni ancora il mento alto,
            come ti avevano insegnato da bambino.
          effetti: { profondita.segrete-dell-ira: 1 }
        fallimento:
          titolo: Il pastore
          testo: |
            Ti ascolta fino in fondo, con la testa piegata da una parte e la
            fronte aggrottata. «Uzgreth non è un servo» dice alla fine. «Il
            Demone ha messo qui il pastore.» Lo spadone arriva dal basso e ti prende al
            fianco mentre già ti volti verso la porta. Ti fermi due gallerie
            più in là a tamponarti la ferita con un fazzoletto ricamato che si
            inzuppa subito, e senti ancora la sua voce che ripete la parola
            pastore alle fosse, come per impararla meglio.
          effetti: { ferite: 2 }

  # ------------------------------------------------------------ il cuore · 6 → 7
  - id: l-aula-dell-ira
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: L'Aula dell'Ira
    sommario: "Una cattedrale sotto la città, due vasche, un cerchio di teschi e un demone con quattro braccia che ha perso il senno."
    luogo: Segrete dell'Ira, l'Aula dell'Ira
    area: segrete-dell-ira
    requisiti: [pista.acciaio == 6, profondita.segrete-dell-ira >= 4]
    testo: |
      La galleria sbuca in una sala così alta che la lampada non arriva al
      soffitto, grande come la navata di una cattedrale. Le pareti sono
      coperte di rune incise a punta, e al centro c'è una vasca larga,
      circondata da un cerchio di teschi levigati in equilibrio su spuntoni
      di pietra. In fondo due scalinate salgono a un pulpito, e sul pulpito
      c'è una seconda vasca, triangolare, piena di un liquido arancione e
      trasparente che gorgoglia. Ne sale vapore, eppure nella sala fa
      un freddo che ti morde le dita.

      Accanto al pulpito sta il demone. È alto più di tre metri e ha la pelle
      coriacea color ruggine, con quattro braccia. Le due di sopra finiscono
      in chele grandi abbastanza da stritolare un cavallo, quelle di sotto
      sono sottili come mani d'uomo e si muovono di continuo. Ha la testa di
      un coccodrillo, e gli occhi sono intelligenti e completamente pazzi.

      {rissa Media} Le chele sono lente a riaprirsi dopo ogni colpo. Le mani
      piccole, sotto, sono il punto dove gli si fa male.

      «Maledetti! Avete osato violare il santuario della Covatrice di
      Orrori!» urla, con una voce che ti vibra nello sterno. Con una mano
      piccola si taglia il polso e lo tiene sopra la vasca triangolare. La
      luce sul soffitto si mette a tremare, e accanto a lui l'aria si crepa
      come uno specchio. Ne esce una figura glabra sulle gambe piegate al
      contrario, e la crepa si richiude.

      {magia Difficile} Ogni Colata gli costa sangue e un dito di vasca. Il
      patto che lo tiene qui ha un prezzo, e lui lo sta pagando un taglio
      alla volta.

      «Dona la tua anima colma di rancore al possente Yoggoth, e anche tu
      sarai una Colata dell'Ira al servizio della sacra Regina!» Intanto la
      vasca si è abbassata di un dito, e per un momento la faccia da
      coccodrillo si fa preoccupata.

      {intimidire Media} Urla per farsi coraggio. Gli occhi, intanto,
      guardano la vasca più spesso di quanto guardino te.

      {origine accolito-del-velo} Il demone ha il suo pulpito e la sua Regina
      a cui offrire le anime, e ne parla con la voce che in Cattedrale si usa
      per le letture solenni. La mano ti va da sola al segno
      dell'Albero, e ti accorgi che trema meno di quanto pensavi.
    opzioni:
      - testo: "Affrontarli tutti e due"
        descrizione: "Un demone con quattro braccia e una Colata appena nata. Alle spalle hai le Segrete."
        combattimento: l-aula-dell-ira
        vittoria:
          titolo: Il possente Yoggoth
          testo: |
            La Colata ti viene addosso per prima e cola sul pavimento in una
            pozza grigia, poi c'è soltanto Yoggoth, con le chele che spaccano
            i teschi del cerchio. Quando finalmente cade sui gradini del
            pulpito non si rialza più, e la luce della vasca triangolare si
            abbassa e poi torna piano quella di prima. Alla sua cintura c'è un
            cilindro di lyssan inciso con grande cura e pieno di ammaccature,
            con dentro un rotolo di pergamena coperto di simboli senza senso.
            Nella cintura ha altri rotoli, ma l'inchiostro è sbiadito. Ti
            siedi sui gradini accanto a lui, perché le gambe lo chiedono, e
            resti lì finché le mani smettono di formicolare.

            Prima di andartene ti volti verso il pulpito, e la vasca è ancora
            piena fino all'orlo. Risali per le Segrete e per il tunnel con il
            cilindro nella camicia, e in Città Bassa è notte fonda.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1, racconto: 1 }
          vai: citta-bassa
        sconfitta:
          titolo: L'ultimo taglio
          testo: |
            La Colata la abbatti, ma Yoggoth ti prende con una chela e ti
            scaraventa contro il cerchio di teschi. Mentre ti rialzi lui si
            taglia di nuovo il polso sopra la vasca, e poi ancora, per
            chiamare un'altra Colata che ti finisca. Al quarto taglio la vasca
            non gli risponde più. Yoggoth la guarda con le mani piccole che
            tremano, e taglia ancora, finché si accascia sui gradini del
            pulpito in una pozza del suo sangue e non si muove più. Le mani
            piccole restano aperte, come se aspettassero ancora qualcosa dalla
            vasca.

            Dalla sua cintura prendi un cilindro di lyssan ammaccato. Mentre
            ti trascini verso l'uscita la vasca riprende a gorgogliare, e torni
            in Città Bassa all'alba, piegato in due.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1 }
          vai: citta-bassa
      - testo: "Provocarlo finché svuota la vasca"
        descrizione: "Ogni Colata costa qualcosa alla vasca, e lui se n'è accorto. Bisogna fargliene chiamare troppe."
        prova: { attributo: sociale, abilita: [intimidire, ingannare, espressivita], difficolta: Difficile }
        successo:
          titolo: Il possente
          testo: |
            Gli ridi in faccia e gli dai del lucertolone, poi di peggio, con
            un'inventiva che non sospettavi di avere. Yoggoth ruggisce e si
            taglia il polso, e tu corri intorno al cerchio di teschi con la
            Colata dietro. Ogni insulto gli costa un taglio, e ogni taglio
            abbassa la vasca. Le ultime Colate escono a metà e si sfanno dopo
            tre passi. Alla fine Yoggoth cade sui gradini, morto, svuotato del
            suo sangue, e la luce della vasca torna piano quella di prima.

            {espressivita Media} Il pubblico era uno solo e ti odiava, ed è
            stata la serata migliore della tua carriera.

            Dalla sua cintura prendi un cilindro di lyssan ammaccato, con un
            rotolo di pergamena dentro. In Città Bassa arrivi a notte fonda,
            senza voce.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1, racconto: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Troppe
          testo: |
            Lo provochi, e lui ti prende in parola, più in fretta di quanto
            avessi messo in conto. Le Colate escono una dopo
            l'altra e tu corri intorno al cerchio di teschi finché una ti
            prende alla schiena e un'altra alla gamba. Yoggoth continua a
            tagliarsi anche quando la vasca non gli risponde più, e alla fine
            si accascia sui gradini del pulpito con le mani piccole aperte e
            non respira più.

            Gli sfili dalla cintura un cilindro di lyssan ammaccato. Mentre
            risali le Segrete trascinandoti, alle tue spalle la vasca riprende
            a gorgogliare. Arrivi in Città Bassa che è giorno.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1, ferite: 2.5 }
          vai: citta-bassa
      - testo: "Scacciarlo con l'esorcismo"
        descrizione: "La Liturgia dell'Albero ha parole per ciò che non dovrebbe restare. Un demone non dovrebbe restare da nessuna parte."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Le parole dell'Albero
          testo: |
            Dici le parole della Liturgia a voce alta, e la voce ti esce più ferma
            delle gambe, che tremano per conto loro sotto la giubba. A ogni frase
            Yoggoth si fa più piccolo dentro la sua pelle color ruggine, come un
            vestito che resta vuoto, e la Colata accanto a lui si scioglie sul
            pavimento. All'ultima parola il demone si accascia sui gradini del pulpito
            e non si muove più. Fra le pieghe della pelle vuota trovi un cilindro di
            lyssan ammaccato, con un rotolo di pergamena dentro.

            Torni in Città Bassa a notte fonda, con la gola secca e le ultime
            parole della Liturgia che ti girano ancora in bocca. La vasca,
            dietro di te, gorgoglia ancora.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1, racconto: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Mezza Liturgia
          testo: |
            A metà formula sbagli una parola, e il Mana ti torna indietro come
            una frustata dietro gli occhi. Yoggoth barcolla lo stesso, ferito
            da quello che è arrivato, e per la rabbia si apre il polso sopra
            la vasca, e poi di nuovo, e di nuovo, finché la vasca non gli dà
            più niente e lui crolla sui gradini svuotato, senza più rialzarsi.
            La sua Colata ti ha lasciato il segno delle sue piccole mani su
            tutto il braccio.

            Dalla sua cintura prendi un cilindro di lyssan ammaccato. Sulla
            soglia ti volti, e la vasca si è già rimessa a gorgogliare. Torni
            in Città Bassa con il sangue al naso e la parola sbagliata che ti
            ronza in testa, quella che adesso sapresti dire giusta.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1, ferite: 1.5, tormento: 1.5 }
          vai: citta-bassa
      - testo: "Offrirgli la tua rabbia"
        descrizione: "Vuole un'anima colma di rancore. La tua ne ha, e lui non chiede di meglio."
        costo: 2
        esito:
          titolo: Il patto
          testo: |
            Ti inginocchi davanti al pulpito, e Yoggoth scende i gradini con gli occhi
            accesi. Le mani piccole ti afferrano le tempie e le unghie ti entrano
            nella pelle, e senti la rabbia che ti esce dalla testa, tutta quella che
            hai raccolto dalla sera della razzia. Lui la lascia cadere nella vasca
            triangolare. L'aria si crepa, e la Colata che ne esce è fatta della tua
            rabbia, che in questo momento ce l'ha con chi ti sta frugando nella testa.
            Gli salta alla gola con tutte le mani della bocca, l'altra Colata le va
            dietro, e Yoggoth cade all'indietro nella vasca triangolare con tutte e
            due addosso. Il liquido si richiude sopra le chele, e nessuno dei tre
            riemerge.

            Sui gradini, caduto dalla sua cintura, trovi un cilindro di lyssan
            ammaccato. Torni in Città Bassa leggero e vuoto, e per giorni,
            quando qualcuno ti spinge al mercato, non ti viene nemmeno voglia di
            spingere indietro.

            {resilienza Difficile} Dove c'era la rabbia adesso c'è una stanza
            pulita e vuota. Per un po' ci starai bene, poi vorrai rimetterci
            dei mobili.
          imposta: { pista.acciaio: 7, pozzo-dell-ira: 5 }
          effetti: { oggetto.registratore-olografico: 1, tormento: 1.5, ferite: 0.5 }
          vai: citta-bassa
