# Pista "La Dama d'Argento", blocco 2, prima metà (5 → 8): Nerissa, Rennick, gli Scuri in Via dei Rasoi.
storylet:
  - id: nerissa-dalvane
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: La padrona di casa
    sommario: "Nel salone della Maison la luce è color miele e nessuno suona. Dalla scala scende la donna che decide chi sale al primo piano."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    # Con rep.maison >= 2 (la sera della lanterna dà 1) ci avevi già lavorato: variante `nerissa-dalvane-di-casa`.
    requisiti: [pista.dama-argento == 5, rep.maison < 2]
    testo: |
      Sara Beck chiude a chiave l'armadio delle armi e ti affida a Gretchen,
      la più anziana delle ragazze, che ti accompagna oltre la tenda senza
      chiederti il nome. Senza il peso alla cintura il fianco ti sembra
      nudo, e la mano ci torna due volte a controllare.

      {origine fuggiasco-di-ghoran} Gretchen dice «da questa parte» con la
      cadenza di Ghoran, smussata da molti anni di Qir-Azel. La riconosci
      subito, perché a Ghoran parlavano così anche quelli che ti pesavano.

      Il salone è più piccolo di quanto credevi. Ci sono quattro poltrone di
      cuoio scuro e tappeti spessi che assorbono i passi, e le lampade hanno
      schermi di vetro fumé che danno alla stanza una luce color miele. Uno
      schermo ha una crepa coperta con carta dipinta dello stesso colore, un
      lavoro di molta pazienza e poco successo. Vicino al camino due ragazze
      parlano con un uomo di mezza età in giubba verde, che non alza la testa
      quando entri.

      Gretchen sale la scala curva e torna giù poco dopo, un passo dietro a
      un'altra donna. È alta, ha i capelli scuri raccolti e un vestito pratico
      di buon taglio, con un bracciale d'argento al polso sinistro. *Questa ha
      già deciso quanto vali, e ha arrotondato per difetto.* Nerissa Dalvane ti
      indica una poltrona e si siede di fronte a te, e la tua schiena si
      raddrizza da sola.

      {galateo Media} Il vestito è di una sarta dei Quartieri Alti, tagliato
      apposta per sembrare modesto. Si siede come una che ha ricevuto ospiti
      in salotti migliori del tuo, e se lo ricorda.

      Quando le dici il nome di Rennick Dole, lei non batte ciglio. «È
      arrivato all'alba, ubriaco a metà. Ha chiesto di Jass e le ha tenuto la
      mano per due ore. Poi è salito al primo piano e non è più sceso. Di
      solito ride forte e paga con monete sporche, ma stamattina sembrava uno
      che aspetta qualcuno.» Beve un sorso di tè. «Chi sta sotto il mio tetto
      io lo proteggo, vedi. È una questione di economia, perché il giorno in
      cui un cliente esce da qui portato via a forza la Maison chiude entro un
      mese. Quindi dimmi perché lo cerchi.»

      {empatia Media} Dice economia, e intanto stringe la tazza con tutte e
      due le mani. Rennick le sta più a cuore di quanto convenga ai conti.
    opzioni: &opzioni-nerissa-dalvane
      - testo: "Raccontarle la verità sul Festival"
        descrizione: "Le racconti della parola che gridavano gli orchi e dell'uomo che sa tradurla. Nerissa riconosce una bugia prima che tu finisca di dirla."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La porta socchiusa
          testo: |
            Le racconti della razzia e di *Mawrak'Thur*, e della strada che hai
            fatto per arrivare fino a Via dei Rasoi. Nerissa ascolta senza
            interromperti, e quando dici «Dama d'Argento» posa la tazza sul
            piattino, così piano che la porcellana non tintinna.

            «Due settimane fa uno Scuro ha bevuto troppo in questo salone» dice
            Nerissa, e intanto rigira la tazza fra le dita. «Parlava di una donna
            dai capelli d'argento, e io l'ho messo sul conto del vino.»

            {persuasione Facile} Adesso ti crede, e le dispiace un poco. Era più
            comodo il conto del vino.

            Poi fa un cenno verso il fondo del salone e ti spiega come andrà:
            «Tachek sale insieme a te e aspetta in corridoio, con la porta
            socchiusa. È la prima stanza in cima alla scala, la Luna Crescente.
            Se dorme non svegliarlo di colpo, e se ti dice quello che credo, non
            ripeterlo ad alta voce finché sei sotto il mio tetto.»
          effetti: { pista.dama-argento: 1, rep.maison: 1 }
        fallimento:
          titolo: Tachek nella stanza
          testo: |
            Racconti tutto, ma lo racconti male, e a metà ti accorgi che le
            mani ti stanno mimando il cinghiale, zanne comprese. Le orecchie ti
            diventano calde. Da come ti guarda capisci che
            per lei un orco su un cinghiale e un uomo che trema in una stanza al
            primo piano restano due storie separate.

            Alla fine Nerissa sospira e scuote la testa. «Ti credo a metà» dice,
            «e per farti salire mi basta. Però Tachek viene con te e resta nella
            stanza per tutto il tempo.»

            Dal fondo del salone si alza un uomo asciutto, vestito di scuro, con
            una mazza imbottita alla cintura. Ti aspetta ai piedi della scala con
            due dita appoggiate sulla fibbia.

            {armi-da-mischia Media} La mazza è imbottita perché qui i lividi
            non devono vedersi. Lui la porta un poco avanti sul fianco, dove la
            mano arriva senza cercarla.
          effetti: { pista.dama-argento: 1, scandalo: 0.5 }
      - testo: "Pagare il disturbo"
        descrizione: "Qualche moneta sul tavolino, accanto alla teiera. Alla Maison ogni cosa ha una tariffa, e Nerissa non si offende se gliela ricordi."
        requisiti: [monete >= 10]
        esito:
          immagine: personaggi/tachek
          titolo: Il prezzo del disturbo
          testo: |
            Posi una manciata di monete accanto alla teiera, e il rumore in quel
            salone sembra più volgare di quanto fosse in tasca.
            Nerissa le guarda senza toccarle. Gretchen le raccoglie dal tavolino
            e le conta nel palmo muovendo appena le labbra, e verso la fine alza
            gli occhi su di te, prima di contare l'ultima.

            «Il disturbo si paga» dice Nerissa, «ma da solo con lui non ti ci
            lascio.» Chiama dal fondo del salone un uomo asciutto, vestito di
            scuro, con una mazza imbottita alla cintura. «Tachek sale con te e
            resta nella stanza. La Luna Crescente è la prima porta in cima alla
            scala.»

            Tachek ti precede sui gradini senza voltarsi, e la mazza imbottita
            gli batte piano contro la coscia a ogni passo.
          effetti: { monete: -10, pista.dama-argento: 1 }
      - testo: "Fare il nome di Marko Thessel"
        descrizione: "Marko sa dove si nasconde Rennick e non è uomo da tenerselo per sé. Il suo nome può far capire a Nerissa che il tempo stringe."
        immagine: personaggi/marko-thessel
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, galateo], difficolta: Media }
        successo:
          titolo: Il socio della Segheria
          testo: |
            Le dici che Marko Thessel sa dov'è Rennick, e che alla Segheria
            raccontano a tutti la storia di Laresh. Nerissa si scambia
            un'occhiata breve con Gretchen.

            «Marko è venuto a tirare la catena stasera, e Sara l'ha rimandato
            indietro» dice Nerissa, voltandosi di nuovo verso di te. «Se lo
            conosci come lo conosco io, sai che la prossima volta non verrà da
            solo.»

            {politica-ed-economia Media} Se Marko torna in compagnia ci rimette
            la Maison. Per una volta gli interessi di Nerissa stanno dalla tua
            parte.

            Poi chiama con un cenno un uomo asciutto con una mazza imbottita alla
            cintura, e gli dice di salire con te e di restare nella stanza. La
            Luna Crescente è la prima porta in cima alla scala.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Un nome che non basta
          testo: |
            Nerissa ascolta il nome di Marko Thessel e non cambia espressione.
            «Marko lo conosco da anni, e so già dov'è stato stasera» dice.
            «Del motivo per cui cerchi Rennick non mi hai detto niente.»

            Si alza e lascia la tazza a metà, e il tè ancora caldo fuma da solo
            sul tavolino. Gretchen ti riaccompagna nella sala d'accoglienza con
            la stessa cortesia con cui ti ha fatto entrare, che adesso ti brucia
            un poco di più. Sara Beck ti rende le armi e ti dice che la signora, se
            vorrai, ti riceverà un'altra volta.
          effetti: { rep.maison: -0.5, sospetto: 0.5 }
      - testo: "Minacciarla"
        descrizione: "Nerissa è seduta davanti a te, disarmata quanto te. Puoi spiegarle cosa succede a chi si mette fra te e Rennick Dole."
        esito:
          immagine: personaggi/churl-braak
          titolo: Churl Bra'aak
          testo: |
            Abbassi la voce e le spieghi cosa potrebbe succedere alla Maison se
            Rennick non scende. Nerissa ti lascia finire, poi si appoggia allo
            schienale e il suo tono si fa più freddo.

            {intimidire Media fallita} Ti sembrava una minaccia ben fatta. A
            giudicare da come lei sistema la gonna, l'ha sentita fare meglio da
            gente più grossa di te.

            «Rennick è sotto il mio tetto» dice, e alza due dita verso il fondo
            del salone.

            Prima che tu possa rispondere, una mano larga come una pala ti
            prende per il colletto e ti solleva dalla poltrona, e le gambe
            pedalano nell'aria per conto loro. Churl Bra'aak ti
            porta attraverso il salone e ti fa sbattere la spalla contro lo
            stipite. «Fuori» dice. Gretchen ti apre la porta, e Sara Beck ti
            mette in mano le armi una alla volta, senza fretta, davanti a chi
            passa per Via dei Rasoi. Un vecchio con un cesto di cipolle si ferma
            a guardare, e quando capisce che non succede altro riprende la sua
            strada. La spalla ti pulsa. Poi la porta si richiude, e sopra di te
            la lanterna resta accesa.
          effetti: { ferite: 0.5, scandalo: 1, rep.maison: -1 }
      - testo: "Parlarle con le regole dei salotti"
        descrizione: "Nei Quartieri Alti la Maison la conoscono tutti, e in salotto non la nomina mai nessuno. Sai come si chiede una cosa a una padrona di casa senza metterla in imbarazzo."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          immagine: personaggi/tachek
          titolo: Le regole della casa
          testo: |
            Le parli come si parla a una padrona di casa in un salotto dei
            Quartieri Alti, con la tazza in mano e le cose importanti dette di
            sbieco. Di Rennick dici soltanto che qualcuno lo cerca per farlo
            parlare e che tu preferiresti arrivare prima, e non fai nessun nome
            dei clienti, nemmeno quelli della tua famiglia che sai passati da
            questo salone.

            {galateo Facile} La tua famiglia sarebbe fiera di te, e anche un
            poco inorridita dal posto in cui lo stai mettendo in pratica.

            Nerissa posa la tazza e ti guarda più a lungo. «Discrezione. Nei
            Quartieri Alti la insegnano ancora, a quanto pare» dice, e chiama
            con un cenno un uomo asciutto con una mazza imbottita alla cintura.
            «Tachek, porta su l'ospite. Poi resta in corridoio» gli dice,
            e a te spiega che la Luna Crescente è la prima porta in cima alla
            scala.
          effetti: { pista.dama-argento: 1, rep.maison: 0.5 }
      - testo: "Farle i conti della Maison"
        descrizione: "Nerissa parla di economia, e la licenza della Gilda ti ha insegnato a fare i conti anche in salotto. Un cliente portato via a forza costa caro, e anche uno che resta troppo a lungo."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il conto della casa
          testo: |
            Le rispondi con i conti, come si fa al banco quando l'altro ha già
            detto il suo prezzo. Se Rennick resta qui e chi lo cerca viene a
            prenderlo, la Maison chiude entro un mese, come dice lei. Se invece
            Rennick parla con te stanotte e domani se ne va, chi lo cerca non
            ha più nessun motivo di bussare alla sua porta. Nerissa ascolta
            senza interromperti, e a metà posa la tazza sul piattino.

            {politica-ed-economia Facile} Hai messo la sua casa dalla parte
            giusta del conto. Da lì in poi le basta fare la somma.

            «Ragioni come un esattore della Gilda» dice, e per lei è quasi un
            complimento. «Tachek sale insieme a te e aspetta in corridoio, con
            la porta socchiusa. La Luna Crescente è la prima stanza in cima
            alla scala.»
          effetti: { pista.dama-argento: 1, rep.maison: 1 }
        fallimento:
          titolo: Un conto troppo preciso
          testo: |
            Ti lasci prendere la mano dai conti e a un certo punto stai
            spiegando a Nerissa quanto le costa la luce delle lampade. Lei ti
            lascia finire, con la tazza ferma a mezz'aria.

            «I conti della mia casa li tengo io» dice. «Ti faccio salire, però
            Tachek resta nella stanza per tutto il tempo.» Dal fondo del salone
            si alza un uomo asciutto, vestito di scuro, con una mazza imbottita
            alla cintura, e ti aspetta ai piedi della scala.
          effetti: { pista.dama-argento: 1, scandalo: 0.5 }

  # La stessa scena per chi alla Maison ci aveva già lavorato: stesse opzioni, stessi effetti.
  - id: nerissa-dalvane-di-casa
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: La padrona di casa
    sommario: "Il salone della Maison l'hai visto soltanto dalla porta della cucina. Stasera ti ci fanno sedere, e dalla scala scende Nerissa Dalvane."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [pista.dama-argento == 5, rep.maison >= 2]
    testo: |
      Sara Beck chiude a chiave l'armadio delle armi e ti affida a Gretchen,
      che ti chiama per nome e ti accompagna oltre la tenda con il libro dei
      conti sotto il braccio, perché stasera non ha fatto in tempo a chiuderlo.

      Il salone lo conosci dalla porta della cucina, e da questa parte sembra
      più piccolo. Ci sono quattro poltrone di cuoio scuro e tappeti spessi
      che assorbono i passi, e le lampade hanno schermi di vetro fumé che
      danno alla stanza una luce color miele. Lo schermo con la crepa coperta
      di carta dipinta è sempre lo stesso, e da vicino la pezza si vede
      ancora di più. Vicino al camino due ragazze parlano con un uomo di
      mezza età in giubba verde, che non alza la testa quando entri.

      {percezione Facile} Ha il bicchiere pieno e non lo tocca. Le ragazze
      gli ridono alle battute con il garbo che si deve a chi paga in anticipo.

      Gretchen sale la scala curva e torna giù poco dopo, un passo dietro a
      Nerissa Dalvane, con il vestito pratico di buon taglio e il bracciale
      d'argento al polso sinistro. *Mi ha visto portare fuori i secchi della
      cenere, e adesso mi vede in salone.* Nerissa ti indica una poltrona e si
      siede di fronte a te, e la tua schiena si raddrizza da sola.

      {resistenza Facile} Le spalle si ricordano dei secchi prima di te, e
      sul cuoio della poltrona non sanno bene come stare.

      Quando le dici il nome di Rennick Dole, lei non batte ciglio. «È
      arrivato all'alba, ubriaco a metà. Ha chiesto di Jass e le ha tenuto la
      mano per due ore. Poi è salito al primo piano e non è più sceso. Di
      solito ride forte e paga con monete sporche, ma stamattina sembrava uno
      che aspetta qualcuno.» Beve un sorso di tè. «Le regole della casa le
      conosci. Chi sta sotto il mio tetto io lo proteggo, perché il giorno in
      cui un cliente esce da qui portato via a forza la Maison chiude entro
      un mese, e la cucina con lei. Quindi dimmi perché lo cerchi.»
    opzioni: *opzioni-nerissa-dalvane

  - id: rennick-dole
    presso: via-dei-rasoi
    immagine: personaggi/rennick-dole
    titolo: La stanza Luna Crescente
    sommario: "La prima porta in cima alla scala. Rennick Dole è seduto sul letto, con una bottiglia quasi vuota e le mani che tremano."
    luogo: Maison des Lunes, primo piano
    area: citta-bassa
    requisiti: [pista.dama-argento == 6]
    testo: |
      La scala è stretta e di legno scuro, e il terzo gradino scricchiola sotto
      il tuo peso ma non sotto quello di Tachek. Al primo piano le pareti sono
      tappezzate di carta color vino, e lungo il corridoio è appesa una fila di
      piccoli specchi a mezzaluna, uno girato verso il muro. Sulla prima porta a
      destra è incisa una luna crescente. Tachek si ferma un passo dietro di te.

      {furtivita Media} Lui ha messo il piede sul bordo del gradino, vicino
      al muro, dove il legno è inchiodato meglio. Su questa scala si sale in
      silenzio soltanto se ci lavori.

      Prima che tu bussi, la porta si apre ed esce una ragazza dai capelli
      rossi. Ti sorride di sbieco e scende la scala senza fretta.

      Rennick Dole è seduto sul bordo del letto, vestito ma scalzo. Sul
      comodino c'è una bottiglia di liquore di radice quasi vuota, e l'odore
      dolciastro ti prende alla gola. Ha gli occhi arrossati, e le mani gli
      tremano. Le tiene strette sulle ginocchia per non farlo vedere. *Se
      stringe ancora un po' si rompe le ginocchia da solo.* Guarda la porta
      che si è appena chiusa.

      {medicina Media} Il tremito è fine e costante, e non viene dal
      liquore. Quello da bottiglia passa bevendo, questo no.

      {origine mercante-dei-ponti} Al Mercato dei Nodi Rennick Dole ha fama
      di trattare il legname fino all'ultimo quattrino, con le mani piatte sul
      banco perché sembrino oneste. Quelle che stringe sulle ginocchia non
      sembrano le mani di uno che tratta.

      «Jass» dice. «Stamattina mi ha ascoltato per due ore, e stasera è
      tornata su. È la spesa migliore che abbia mai fatto, e ne ho fatte di
      spese.» Poi guarda te, e non sembra sorpreso. «Ti aspettavo prima.
      Marko sa che sono qui e parlerà, quindi è meglio che parli io per
      primo. Siediti.»

      Ci sono tre cose che vuoi sapere da lui, e Rennick regge una domanda
      alla volta. Tra una risposta e la successiva guarda la bottiglia, e tu
      guardi lui guardarla.
    opzioni:
      - testo: "Chiedergli di *Mawrak'Thur*"
        descrizione: "Rennick parla l'orchesco dei Nove Chiodi. Chiedigli che cosa ha sentito la sera del Festival."
        requisiti: [rennick.dama == 0]
        costo: 0
        esito:
          titolo: Sotto la bancarella
          testo: |
            Rennick prende la bottiglia e la rimette giù senza bere, con un
            tintinnio sul legno.

            «Mio padre commerciava pelli con i Nove Chiodi, e io lo seguivo fino
            al Bosco della Forca. Voleva che imparassi a contare i prezzi nella
            loro testa, e ho imparato anche il resto.» Durante la razzia era
            nascosto sotto una bancarella rovesciata, e il capo sul cinghiale
            corazzato gli è passato a tre passi. «Diceva agli altri che la Dama
            d'Argento li aveva mandati. *Mawrak'Thur* vuol dire questo. Sono
            cinque tribù, e stanno tutte sotto una sacerdotessa.»

            {accademiche Difficile} Cinque tribù che obbediscono a una sola
            persona fanno un esercito. Su questo i libri di storia vanno
            d'accordo, cosa che capita di rado.

            «Al Velo devono saperlo. Se non lo sanno, qualcuno lassù lo tiene
            nascosto» dice, e stringe il collo della bottiglia finché le nocche
            diventano bianche.
          imposta: { rennick.dama: 1 }
          effetti: { informazioni.segreto: 1 }
          segue: rennick-dole
      - testo: "Chiedergli perché trema"
        descrizione: "La razzia l'hanno vista in tanti, eppure in tutta la Città Bassa l'unico che si è chiuso in una stanza è lui."
        requisiti: [rennick.cane == 0]
        costo: 0
        esito:
          titolo: La processione del Solstizio
          testo: |
            Rennick abbassa la voce, e quando ti sporgi verso di lui la abbassa
            ancora, finché senti il suo fiato dolce di radice.

            «Avevo otto anni, e lei nove. Alla processione del Solstizio Padre
            Sollen se la portava dietro legata al polso con un nastro argentato.
            Diceva che l'angelo si distraeva, se non sentiva il nastro.» A metà
            processione un cane è scattato da un vicolo verso la fiamma del
            sacerdote. La bambina si è voltata senza alzare le mani, e il cane
            si è piegato a mezz'aria, come se gli avessero spinto giù la
            schiena. Il cane è caduto senza un guaito. Mentre lo racconta ti
            accorgi che anche le tue spalle si sono irrigidite.

            «Aveva i capelli d'argento e gli occhi viola. In quel momento erano
            diventati color lavanda, e lei sorrideva.» Poi continua: «La sera le
            ho tirato il fango addosso e le ho dato della strega davanti a
            tutti. Volevo che la credessero pazza, così avrebbero smesso di
            portarla in processione e io avrei smesso di vederla.»

            {resilienza Media fallita} Il cane piegato a mezz'aria ti resta
            davanti agli occhi anche quando li chiudi. Stanotte, lo sai già,
            tornerà a trovarti.
          imposta: { rennick.cane: 1 }
          effetti: { tormento: 1 }
          segue: rennick-dole
      - testo: "Chiedergli da chi si nasconde"
        descrizione: "Alla Segheria dicono che è partito per Laresh, ed è Marko a raccontarlo a chiunque chieda."
        requisiti: [rennick.paura == 0]
        costo: 0
        esito:
          titolo: Ottone ha esitato
          testo: |
            Rennick finisce la bottiglia in un sorso e posa il vetro sul
            comodino piano, come se avesse paura di romperlo.

            «Laresh era una copertura. Marko doveva raccontarla a chiunque
            chiedesse di me, e intanto io venivo qui.» Si guarda le mani. «Un
            paio di giorni fa qualcuno è andato a chiedere di me a Ottone
            Malgrani, e Ottone ha esitato sul nome. Lui esita solo quando ha
            paura.»

            {empatia Media} Lo dice come se parlasse di un amico, e forse lo è
            stato. Adesso gli fa più male l'esitazione di Ottone che il resto.

            Si alza, fa due passi verso la finestra e torna a sedersi. «Voglio
            lasciare Qir-Azel stanotte. La Maison è l'unico posto dove nessuno può
            prendermi senza che qualcuno se ne accorga. Però qui dentro non ci
            posso restare per sempre.»
          imposta: { rennick.paura: 1 }
          segue: rennick-dole
      - testo: "Portarlo fuori dalla Maison stanotte"
        descrizione: "Rennick vuole andarsene subito. Per strada sarà sotto la tua parola, e tutti in Via dei Rasoi lo vedranno uscire con te."
        requisiti: [rennick.dama >= 1, rennick.cane >= 1, rennick.paura >= 1]
        esito:
          titolo: Stanotte
          testo: |
            Rennick si infila gli stivali e non li allaccia, perché le dita non
            ne vogliono sapere. Prima di uscire lascia sul comodino qualche
            moneta per Jass, dopo averle contate due volte.

            Tachek vi accompagna giù per la scala. Nel salone Nerissa è in piedi
            accanto al camino e vi guarda passare senza dire niente, mentre
            l'uomo in giubba verde tiene la testa bassa sul bicchiere. Sara Beck
            ti rende le armi e apre la porta. «Buona fortuna» dice, e la richiude
            subito dietro di voi.

            Fuori la lanterna è accesa e le finestre della via sono buie, e dopo
            il caldo del salone l'aria ti entra fredda nel colletto. Su un
            davanzale qualcuno ha lasciato ad asciugare un paio di calze
            spaiate. Rennick ti cammina accanto con le mani in tasca.

            {armi-da-distanza Facile} La via è dritta e i tetti sono bassi. Da
            lassù, con una buona balestra, non servirebbe nemmeno mirare.

            Più avanti, dove la strada fa il gomito, Rennick si ferma di colpo e
            ti prende per la manica.
          imposta: { rennick: 1 }
          effetti: { pista.dama-argento: 1, racconto: 1 }
          segue: scuri-via-dei-rasoi
      - testo: "Dirgli di restare nascosto e tornare domani"
        descrizione: "La Maison lo protegge meglio della strada, almeno per una notte. Domani potrai portarlo via con più calma."
        requisiti: [rennick.dama >= 1, rennick.cane >= 1, rennick.paura >= 1]
        esito:
          titolo: Domani
          testo: |
            Gli dici di restare chiuso in questa stanza fino a domani, perché
            Nerissa lo protegge meglio di quanto possa fare la strada. Rennick
            ci pensa a lungo, grattandosi il dorso di una mano con l'altra. Poi
            conta le monete per un'altra notte e le mette in fila sul comodino,
            dritte come soldatini. «Ti aspetto fino a domani sera, poi esco da
            solo» dice senza alzare gli occhi.

            Mentre scendi la scala lo senti chiedere a Tachek di mandargli su
            Jass. Nel salone Nerissa ascolta quello che le dici e annuisce una
            volta sola, e Sara Beck ti rende le armi sulla soglia.

            La sera dopo torni a prenderlo. Quando Sara ti apre, Rennick è già in
            fondo alla scala con gli stivali allacciati e la faccia di uno che
            ha dormito, per la prima volta da giorni. Prima di uscire lascia
            sul bancone qualche moneta per Jass, dopo averle contate due volte.
            In strada la lanterna è accesa e le finestre sono buie. Più avanti,
            dove la via fa il gomito, Rennick si ferma di colpo e ti prende per
            la manica.
          imposta: { rennick: 1 }
          effetti: { pista.dama-argento: 1, racconto: 1 }
          segue: scuri-via-dei-rasoi
      - testo: "Dirgli che vieni dalla Cattedrale"
        descrizione: "Rennick crede che al Velo qualcuno tenga nascoste le cose. Per uno così un accolito è un confessore oppure un nemico."
        quando: [origine.accolito-del-velo >= 1, rennick.cane == 0]
        costo: 0
        esito:
          titolo: Come a un prete
          testo: |
            Gli dici che vieni dalla Cattedrale e che dopo la razzia hai portato le
            bende in Città Bassa. Rennick ti guarda le mani, come se ci cercasse
            ancora il bianco delle bende, poi ride piano. «Allora te lo dico come si
            dice a un prete» fa, e abbassa la voce.

            A otto anni era alla processione del Solstizio, quando Padre Sollen
            si portava dietro una bambina di nove anni legata al polso con un
            nastro argentato. Un cane è scattato da un vicolo verso la fiamma
            del sacerdote, e lei si è voltata senza alzare le mani. Il cane si
            è piegato a mezz'aria ed è caduto senza un guaito. «Aveva gli occhi
            viola, e in quel momento erano color lavanda. Sorrideva.» La sera
            Rennick le ha tirato il fango addosso e le ha dato della strega
            davanti a tutti.

            {magia Difficile} Il Mana che conosci tu passa dalle mani e dalle
            parole, e quella bambina non ha usato né le une né le altre.

            Ti accorgi di aver fatto il segno dell'Albero senza volerlo, e lui
            se ne accorge con te.
          imposta: { rennick.cane: 1 }
          segue: rennick-dole
      - testo: "Parlargli come a una bestia spaventata"
        descrizione: "Al Circolo agli animali spaventati si parla con la voce bassa e le mani ferme, e non gli si chiede niente. Rennick trema come un puledro che ha sentito il lupo."
        quando: [origine.figlio-del-circolo >= 1, rennick.cane == 0]
        costo: 0
        esito:
          titolo: Il cane del vicolo
          testo: |
            Ti siedi sul pavimento invece che sulla sedia, un poco più in basso
            di lui, e gli parli con la voce che al Circolo si usa per i puledri,
            senza fargli domande. Rennick ti guarda storto, poi smette di
            stringersi le ginocchia, e alla fine la storia gli esce da sola.

            A otto anni era alla processione del Solstizio, quando Padre Sollen
            si portava dietro una bambina di nove anni legata al polso con un
            nastro argentato. Un cane è scattato da un vicolo verso la fiamma
            del sacerdote, e lei si è voltata senza alzare le mani. Il cane si
            è piegato a mezz'aria ed è caduto senza un guaito. «Aveva gli occhi
            viola, e in quel momento erano color lavanda. Sorrideva.» La sera
            Rennick le ha tirato il fango addosso e le ha dato della strega
            davanti a tutti.

            {addestrare-animali Media} Un cane che cade senza un guaito non ha
            avuto nemmeno il tempo di avere paura. Ti dispiace per lui, a tanti
            anni di distanza, come se fosse stato tuo.
          imposta: { rennick.cane: 1 }
          effetti: { tormento: 1 }
          segue: rennick-dole

  - id: scuri-via-dei-rasoi
    presso: via-dei-rasoi
    immagine: personaggi/rozalia-marga
    titolo: Gli Scuri in Via dei Rasoi
    sommario: "Al gomito del cristallo spento c'è una donna con una piuma dietro l'orecchio. Tre passi dietro di lei aspetta un uomo con la benda."
    luogo: Via dei Rasoi, al cristallo spento
    area: citta-bassa
    requisiti: [pista.dama-argento == 7]
    testo: |
      A quest'ora Via dei Rasoi è quasi vuota, e i pochi rumori scendono dalle
      finestre socchiuse, una pentola che sbatte e un bambino che non ne vuole
      sapere di dormire. Al gomito della strada, con la schiena appoggiata al
      cristallo spento, c'è una donna snella con i capelli raccolti sulla nuca
      e una piuma da scrivere dietro l'orecchio. Si pulisce le unghie con un
      coltellino da ufficio, senza fretta, un'unghia alla volta. L'inchiostro
      le arriva fino alla seconda falange.

      *Una falsaria. O una che scrive molte lettere d'amore.* Le tue mani, per
      conto loro, tornano vicino alla cintura.

      Tre passi dietro di lei c'è un uomo enorme, con una benda nera
      sull'occhio sinistro e le mani in tasca. Porta una giacca pesante anche
      se non fa freddo, e guarda un punto della strada a metà fra te e la
      donna. Sui tetti delle case basse, ai lati opposti della via, stanno due
      sagome con le balestre, al riparo dietro i comignoli.

      {armi-da-distanza Media} Una a destra e una a sinistra, così chi si
      ripara da una resta scoperto all'altra. Gente che ha studiato, o che ha
      sbagliato abbastanza volte da imparare.

      La donna chiude il coltellino e lo fa sparire sotto la mantellina.

      «Buonasera. Spero che la signora Dalvane ti abbia trattato come si deve.
      Mi chiamo Rozalia Marga, e lui è Squiggor. Su, saluta.» L'uomo non si
      muove. «Gli è venuta la timidezza. Cerchiamo Rennick Dole, che sta tre
      passi dietro di te e spera che non ce ne accorgiamo. Tu ce lo consegni
      e noi torniamo a casa. Non serve firmare niente, anche se firmare è la
      mia specialità.»

      {ingannare Media} Sorride bene, e il sorriso è vero. È vero anche il
      coltellino, e lei non ha nessun bisogno di scegliere fra i due.

      Quando i toni si alzano, Squiggor sposta il peso da un piede all'altro.
      In Città Bassa chi conosce gli Scuri sa che da quel momento restano pochi
      secondi per parlare.

      {origine figlio-della-citta-bassa} Di Squiggor in Città Bassa si impara
      presto il nome e ancora prima la faccia, perché quando passa lui si
      cambia marciapiede. Il corpo ci ha già provato, con mezzo passo verso il
      muro che le gambe hanno fatto senza chiederti niente.
    opzioni:
      - testo: "Dirle della Dama d'Argento"
        descrizione: "Rozalia è una professionista. Se le offri qualcosa che vale più di Rennick, ti ascolta."
        requisiti: [rennick.dama >= 1]
        esito:
          titolo: All'ora del mercato
          testo: |
            Le racconti quello che Rennick ti ha tradotto. Quando arrivi a
            *Mawrak'Thur*, Rozalia smette di sorridere. «Aspetta. Ripeti la
            parola orchesca.» La ripeti. «E Rennick la sa tradurre» dice, e
            si tocca la piuma dietro l'orecchio.

            {politica-ed-economia Media} Una parola orchesca che soltanto
            Rennick sa tradurre vale più di Rennick. Rozalia fa il conto in
            fretta, e il conto le piace.

            Guarda Squiggor, poi di nuovo te. «Facciamo così. Rennick te lo
            lascio per stanotte. Domani all'ora del mercato vieni alla Pignatta
            da solo e mi racconti tutto quello che sai. Se me lo racconti per
            intero, Mirko riceve un rapporto che lo soddisfa e nessuno torna a
            cercare nessuno. Se domani ti aspetto per niente, vengo a cercarti
            io.»

            Si stacca dal cristallo e si avvia verso Via del Salmone, con
            Squiggor tre passi dietro. Sui tetti le balestre spariscono dietro i
            comignoli, e solo allora ti accorgi di avere ancora la mano sull'impugnatura.
          imposta: { resoconto.scuri: 1 }
          effetti: { rep.scuri: 0.5, pista.dama-argento: 1 }
      - testo: "Tenere il punto"
        descrizione: "Rennick è sotto la tua parola. Puoi dirlo a Rozalia e sperare che le basti, con due balestre puntate sulla strada."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Difficile }
        successo:
          titolo: Il conto resta aperto
          testo: |
            Glielo dici guardandola negli occhi, senza alzare la voce, e intanto
            le due balestre sui tetti ti prudono fra le scapole, in due punti
            precisi. Rennick resta dov'è, e chi lo vuole deve passare da te.
            Rozalia ti studia a lungo. Squiggor sposta il peso da un piede
            all'altro, e lei alza una mano senza voltarsi.

            {intimidire Difficile} Quella mano alzata è per lui. Lei ha deciso
            che stanotte non conviene, e Squiggor è l'unico a cui dispiace.

            «Bene. Buonanotte, allora.» Si stringe la mantellina sulle spalle.
            «Però il conto resta aperto. Mirko saprà entro un'ora che hai difeso
            Rennick Dole davanti a tutta Via dei Rasoi, e Squiggor le offese se
            le tiene a mente.»

            Si allontanano verso Via del Salmone senza fretta. Le ginocchia ti
            cedono un poco solo adesso, a cose fatte. Quando alzi gli occhi, sui
            tetti è rimasto solo il fumo dei comignoli.
          effetti: { rep.scuri: -1, pista.dama-argento: 1 }
        fallimento:
          titolo: Sul selciato
          testo: |
            Rozalia ti ascolta fino in fondo, poi sospira. «Mi spiace» dice, e
            fa un passo di lato per non stare fra te e Squiggor.

            Squiggor tira fuori le mani dalle tasche. Ha le nocche fasciate e
            grosse come noci.

            {rissa Media fallita} Il sinistro, pensi, quello dalla parte della
            benda. Lui ci ha pensato prima di te, e da anni.

            Il primo colpo ti prende sotto le costole e il secondo ti manda
            contro il cristallo spento, e l'aria esce dai polmoni senza
            chiederti niente. Con la guancia sul
            selciato vedi due uomini scesi dai tetti che portano via Rennick Dole
            verso Via del Salmone, tenendolo per le braccia. Rennick non grida, e
            ti guarda una volta sola prima che girino l'angolo.
          imposta: { rennick: 2 }
          effetti: { ferite: 2, rep.scuri: -0.5, pista.dama-argento: 1 }
      - testo: "Rispondere con le mani"
        descrizione: "Due Scuri in strada e due balestre sui tetti. Se decidi di farlo, fallo prima che Squiggor tiri fuori le mani dalle tasche."
        immagine: personaggi/squiggor-ironfist
        combattimento: rissa-via-dei-rasoi
        vittoria:
          titolo: Il fumogeno
          testo: |
            Squiggor va giù per ultimo e non si rialza più. Resta sul selciato ai
            piedi del cristallo spento, con la benda storta e la faccia rivolta al
            cielo. Hai le nocche aperte e non te ne accorgi ancora. Rozalia si
            inginocchia accanto a lui un momento, poi rompe una fiala contro la
            pietra. Un fumo grigio che brucia gli occhi e raschia in gola riempie il
            gomito della strada, e quando si dirada, fra un colpo di tosse e l'altro,
            lei non c'è più. Anche i balestrieri sono spariti dai tetti.

            Nerissa Dalvane guarda il corpo dalla soglia della Maison e richiude
            la porta senza dire niente.

            {empatia Facile} La porta si chiude piano, senza sbattere. Lei non
            approva, e non ha intenzione di venire a dirtelo.

            Sulla pietra opaca del cristallo resta una macchia scura.
          imposta: { squiggor: 2 }
          effetti: { rep.scuri: -2, sospetto: 1.5, pista.dama-argento: 1, racconto: 1 }
        sconfitta:
          titolo: Portato via
          testo: |
            Squiggor ride quando lo colpisci, con una risata corta e contenta.
            Alla fine sei tu a finire contro il cristallo spento, con il sapore
            del sangue in bocca e un orecchio che fischia. Mentre provi a
            rialzarti, due uomini scesi dai tetti trascinano Rennick Dole verso
            Via del Salmone.

            Rozalia si china su di te e ti sistema il colletto con due dita
            macchiate d'inchiostro. «Era un'offerta semplice» dice. Poi raggiunge
            gli altri senza voltarsi, con la piuma ancora dietro l'orecchio.
          imposta: { rennick: 2 }
          effetti: { rep.scuri: -0.5, pista.dama-argento: 1 }
      - testo: "Consegnarle Rennick"
        descrizione: "Rozalia ha fatto un'offerta semplice, e gli Scuri pagano chi li aiuta."
        esito:
          titolo: L'offerta di Rozalia
          testo: |
            Quando lo chiami, Rennick viene. Ti segue fino al cristallo spento e
            capisce soltanto lì, quando Squiggor gli posa una mano sulla spalla,
            e non prova a scappare.

            {resilienza Media fallita} Ti ripeti che era lui o tu. Lo ripeti
            ancora, e ogni volta suona un poco peggio.

            Rozalia conta le monete e te le mette nel palmo una alla volta. Sono
            tiepide, come se le tenesse in mano da un pezzo, e il palmo vorrebbe
            richiudersi e anche no. «Mirko
            sarà contento» dice, e ti chiude le dita sopra. «E quando è
            contento, se ne ricorda.»

            Squiggor e Rennick si avviano verso Via del Salmone uno accanto
            all'altro, e sui tetti le balestre si abbassano. Rozalia si rimette la
            piuma dietro l'orecchio e li segue.
          imposta: { rennick: 2 }
          effetti: { rep.scuri: 2, monete: 15, pista.dama-argento: 1 }
      - testo: "Fare a Squiggor il cenno della Pignatta"
        descrizione: "Tu e Squiggor vi conoscete. Anni fa, sull'Orlo dei Rottami, vi siete picchiati per un carico di cristalli, ed è finita con una tregua."
        immagine: personaggi/squiggor-ironfist
        requisiti: [contatto-ombra >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, intimidire], difficolta: Media }
        successo:
          titolo: Un occhio chiuso
          testo: |
            Ti fermi davanti a Squiggor invece che davanti a Rozalia e gli fai
            il cenno col mento che vi scambiate alla Pignatta. Lui ti guarda per
            la prima volta. Sull'Orlo dei Rottami vi eravate picchiati per venti
            minuti a causa di un carico di cristalli che secondo lui avevi
            alleggerito, e alla fine vi eravate seduti sul bordo della Cicatrice
            a guardare il vuoto, senza dirvi niente. La mano destra, a
            ripensarci, ti fa ancora male quando piove.

            {conoscenze-della-strada Facile} Una tregua dell'Orlo vale più di
            molti contratti dei Quartieri Alti. Lo sanno anche gli Scuri, che di
            contratti se ne intendono.

            «Chiudo un occhio» aveva detto allora. Adesso lo ripete a voce bassa,
            e Rozalia sospira. «Va bene. Per stanotte Rennick è tuo.»

            Si allontanano verso Via del Salmone, e sui tetti le balestre
            spariscono dietro i comignoli.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: La tregua è scaduta
          testo: |
            Gli fai il cenno col mento che vi scambiate alla Pignatta, e Squiggor
            non lo restituisce. Sposta il peso da un piede all'altro e tira
            fuori le mani dalle tasche.

            Il primo colpo ti piega in due, il secondo ti manda contro il cristallo
            spento, e il mondo per un poco va avanti senza di te. Rozalia ti guarda
            dall'alto con un'aria quasi dispiaciuta. Con la guancia sul selciato vedi
            due uomini scesi dai tetti che portano via Rennick Dole tenendolo per le
            braccia, e lui ti cerca con gli occhi finché non girano l'angolo di Via
            del Salmone.
          imposta: { rennick: 2 }
          effetti: { ferite: 2, rep.scuri: -0.5, pista.dama-argento: 1 }
      - testo: "Ricordare a Squiggor l'Orlo dei Rottami"
        descrizione: "Sull'Orlo dei Rottami tu e Squiggor vi siete contesi a pugni un carico di cristalli. Nessuno dei due è caduto di sotto, ed è finita con una tregua."
        immagine: personaggi/squiggor-ironfist
        requisiti: [raschiatore >= 1]
        prova: { attributo: fisico, abilita: [atletica, intimidire], difficolta: Media }
        successo:
          titolo: Venti minuti sull'Orlo
          testo: |
            Ti sfili la giacca e la butti sul selciato, e Squiggor capisce prima
            di Rozalia.

            {atletica Media} Venti minuti in bilico con il vuoto a un passo. Le
            gambe se lo ricordano meglio della testa.

            Sull'Orlo dei Rottami vi siete picchiati per venti minuti a un passo
            dal bordo senza che nessuno dei due cadesse, e alla fine vi siete
            seduti sull'orlo della Cicatrice, con le gambe sul vuoto, a
            sputare sangue.

            Squiggor si tocca la benda. «Pari» dice. Rozalia alza gli occhi al
            cielo. «Rennick resta tuo per stanotte. Squiggor, andiamo.»

            Si allontanano verso Via del Salmone, e sui tetti le balestre
            spariscono dietro i comignoli.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Niente tregua
          testo: |
            Ti sfili la giacca, e Squiggor sorride per la prima volta, con tutti
            i denti che gli sono rimasti. Stavolta non siete sull'Orlo dei
            Rottami, e lui non ha nessuna voglia di sedersi sul bordo con te.

            Il primo colpo ti prende sotto le costole e il secondo ti manda contro
            il cristallo spento. Con la guancia sul selciato vedi due uomini scesi
            dai tetti che portano via Rennick Dole verso Via del Salmone. Rozalia
            li segue raccogliendo la tua giacca da terra, e te la getta addosso
            passando.
          imposta: { rennick: 2 }
          effetti: { ferite: 2, rep.scuri: -0.5, pista.dama-argento: 1 }
      - testo: "Metterti fra Rennick e Squiggor"
        descrizione: "Squiggor riscuote, e stanotte quello da riscuotere è un uomo. A Ghoran hai visto come si consegna qualcuno a chi lo porta via, e non hai intenzione di farlo tu."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza, intimidire], difficolta: Difficile }
        successo:
          titolo: Il muro
          testo: |
            Fai un passo indietro e ti pianti davanti a Rennick a gambe larghe,
            con le mani aperte lungo i fianchi, e guardi Squiggor invece di
            Rozalia. Lui tira fuori le mani dalle tasche e ti viene incontro
            fino a mezzo braccio, così vicino che senti l'odore della sua
            giacca. Tu resti dove sei. Le balestre sui tetti ti prudono fra le
            scapole, e le ginocchia tengono.

            {resistenza Difficile} A stare fermo davanti a uno che ti può fare
            male il corpo l'ha imparato a Ghoran. Stanotte gli chiedi soltanto
            di ricordarselo.

            Rozalia alza una mano senza voltarsi, e Squiggor si ferma. «Bene.
            Buonanotte, allora» dice lei, stringendosi la mantellina sulle
            spalle. «Però il conto resta aperto. Mirko saprà entro un'ora chi
            ha difeso Rennick Dole in Via dei Rasoi.» Si allontanano verso Via
            del Salmone, e sui tetti resta solo il fumo dei comignoli.
          effetti: { rep.scuri: -1, pista.dama-argento: 1 }
        fallimento:
          titolo: Consegnato
          testo: |
            Ti pianti davanti a Rennick a gambe larghe, e Squiggor non si ferma
            nemmeno. Il primo colpo ti prende sotto le costole e ti piega, il
            secondo ti manda contro il cristallo spento, e l'aria ti esce dai
            polmoni tutta insieme.

            Con la guancia sul selciato vedi due uomini scesi dai tetti che
            prendono Rennick per le braccia e lo portano verso Via del Salmone,
            senza fretta, come una cosa già pagata. Rennick non grida. Ti
            guarda una volta sola prima che girino l'angolo.
          imposta: { rennick: 2 }
          effetti: { ferite: 2, rep.scuri: -0.5, pista.dama-argento: 1 }
