# Pista "La Dama d'Argento", blocco 2, prima metà (5 → 8): Nerissa, Rennick, gli Scuri in Via dei Rasoi.
storylet:
  - id: nerissa-dalvane
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: La padrona di casa
    sommario: "Nel salone della Maison la luce è color miele e nessuno suona. Dalla scala scende la donna che decide chi sale al primo piano."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    # Con rep.maison >= 2 (la sera della lanterna dà 1) ci avevi già lavorato: variante `nerissa-dalvane-di-casa`.
    requisiti: [pista.dama-argento == 5, rep.maison < 2]
    testo: |
      Sara Beck chiude a chiave l'armadio delle armi e ti affida a Gretchen, la più anziana delle ragazze.
      L'armadio è di noce scuro e ha i ripiani foderati di panno, così le lame non battono sul legno quando
      Sara le appoggia.

      {origine fuggiasco-di-ghoran} Gretchen ha la cadenza di Ghoran, la stessa di quelli che ti pesavano, e
      ti accorgi di aver abbassato gli occhi come facevi allora.

      Il salone prende la luce color miele dalle lampade a olio, e sui tappeti spessi i passi non fanno
      rumore. Vicino al camino due ragazze parlano con un uomo in giubba verde che tiene un bicchiere fra le
      mani e non alza la testa quando entri.

      Gretchen sale la scala curva e torna giù un passo dietro a Nerissa Dalvane, una donna alta con i capelli
      scuri raccolti e un bracciale d'argento al polso sinistro. L'abito scuro non le fa una piega sui
      gradini. Nerissa ti indica una poltrona di velluto consumato sui braccioli e si siede di fronte a te, e
      la tua schiena si raddrizza da sola.

      Al nome di Rennick Dole non batte ciglio. «È arrivato all'alba ubriaco a metà, e ha tenuto la mano a
      Jass per due ore. Poi è salito al primo piano e non è più sceso. Di solito ride forte e paga con monete
      sporche, ma stamattina sembrava uno che aspetta qualcuno.» Beve un sorso di tè da una tazza così sottile
      che contro la lampada si vede l'ombra delle sue dita. «Chi sta sotto il mio tetto io lo proteggo. È una
      questione di economia, perché se un cliente esce da qui a forza la Maison chiude entro un mese. Quindi
      dimmi perché lo cerchi.»
    opzioni: &opzioni-nerissa-dalvane
      - testo: "Raccontarle la verità sul Festival"
        descrizione: "Le racconti della parola che gridavano gli orchi e dell'uomo che sa tradurla."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La porta socchiusa
          testo: |
            «Due settimane fa uno Scuro ha bevuto troppo in questo salone» dice Nerissa, e intanto rigira la
            tazza fra le dita. «Parlava di una donna dai capelli d'argento, e io l'ho messo sul conto del
            vino.» Il tè nella tazza è freddo da un pezzo, e lei non lo beve.

            Poi fa un cenno verso il fondo del salone e ti spiega come andrà, senza alzare la voce di un tono.
            «Tachek sale insieme a te e aspetta in corridoio, con la porta socchiusa. È la prima stanza in
            cima alla scala, la Luna Crescente. Se dorme non svegliarlo di colpo, e se ti dice quello che
            credo, non ripeterlo ad alta voce finché sei sotto il mio tetto.»
          effetti: { pista.dama-argento: 1, rep.maison: 1 }
        fallimento:
          titolo: Tachek nella stanza
          testo: |
            Racconti tutto e lo racconti male, e a metà ti accorgi che le mani ti stanno mimando il cinghiale,
            zanne comprese. Nerissa le segue con gli occhi e non ride.

            Alla fine sospira e scuote la testa. «Ti credo a metà» dice, «e per farti salire mi basta. Però
            Tachek viene con te e resta nella stanza per tutto il tempo.»

            Dal fondo del salone si alza un uomo asciutto, vestito di scuro, con una mazza imbottita alla
            cintura. Lascia la sedia senza che le gambe striscino sul pavimento.
          effetti: { pista.dama-argento: 1, scandalo: 0.5 }
      - testo: "Pagare il disturbo"
        descrizione: "Qualche moneta sul tavolino, accanto alla teiera. Alla Maison ogni cosa ha una tariffa, e Nerissa non si offende se gliela ricordi."
        requisiti: [monete >= 10]
        esito:
          immagine: personaggi/tachek
          titolo: Il prezzo del disturbo
          testo: |
            Posi una manciata di monete accanto alla teiera, e il rumore in quel salone sembra più volgare di
            quanto fosse in tasca. Accanto alla porcellana bianca le monete fanno un mucchietto opaco, e
            Nerissa non le guarda.

            «Il disturbo si paga» dice Nerissa, «ma da sol{o|a} con lui non ti ci lascio.» Chiama dal fondo
            del salone un uomo asciutto, vestito di scuro, con una mazza imbottita alla cintura. «Tachek sale
            con te e resta nella stanza. La Luna Crescente è la prima porta in cima alla scala.»
          effetti: { monete: -10, pista.dama-argento: 1 }
      - testo: "Fare il nome di Marko Thessel"
        descrizione: "Marko sa dove si nasconde Rennick e non è uomo da tenerselo per sé."
        immagine: personaggi/marko-thessel
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, galateo], difficolta: Media }
        successo:
          titolo: Il socio della Segheria
          testo: |
            Le dici che Marko Thessel sa dov'è Rennick, e che alla Segheria raccontano a tutti la storia di
            Laresh. Nerissa si scambia un'occhiata breve con Gretchen sopra la teiera.

            «Marko è venuto a tirare la catena stasera, e Sara l'ha rimandato indietro» dice Nerissa,
            voltandosi di nuovo verso di te. «Se lo conosci come lo conosco io, sai che la prossima volta non
            verrà da solo.»

            Poi chiama con un cenno un uomo asciutto con una mazza imbottita alla cintura, e gli dice di
            salire con te e di restare nella stanza. Lui si avvia verso la scala con due dita appoggiate sulla
            cintura.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Un nome che non basta
          testo: |
            Nerissa ascolta il nome di Marko Thessel e non cambia espressione. Posa la tazza sul piattino
            senza farla tintinnare. «Marko lo conosco da anni, e so già dov'è stato stasera» dice. «Del motivo
            per cui cerchi Rennick non mi hai detto niente.»

            Gretchen ti riaccompagna nella sala d'accoglienza con la stessa cortesia con cui ti ha fatto
            entrare, che adesso ti brucia un poco di più. Sara Beck apre l'armadio di noce e ti rende le armi,
            e ti dice che la signora, se vorrai, ti riceverà un'altra volta.
          effetti: { rep.maison: -0.5, sospetto: 0.5 }
      - testo: "Minacciarla"
        descrizione: "Nerissa è seduta davanti a te, disarmata quanto te. Puoi spiegarle cosa succede a chi si mette fra te e Rennick Dole."
        esito:
          immagine: personaggi/churl-braak
          titolo: Churl Bra'aak
          testo: |
            Abbassi la voce e le spieghi cosa potrebbe succedere alla Maison se Rennick non scende. Nerissa
            ascolta fino in fondo e non posa la tazza.

            «Rennick è sotto il mio tetto» dice, e alza due dita verso il fondo del salone.

            Prima che tu possa rispondere, una mano larga come una pala ti prende per il colletto e ti solleva
            dalla poltrona, e le gambe pedalano nell'aria per conto loro. Churl Bra'aak ti porta attraverso il
            salone e ti fa sbattere la spalla contro lo stipite, che è di quercia e non cede di un filo.
            «Fuori» dice. Poi la porta si richiude, e sopra di te la lanterna resta accesa.
          effetti: { ferite: 0.5, scandalo: 1, rep.maison: -1 }
      - testo: "Parlarle con le regole dei salotti"
        descrizione: "Sai come si chiede una cosa a una padrona di casa senza metterla in imbarazzo."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          immagine: personaggi/tachek
          titolo: Le regole della casa
          testo: |
            Di Rennick dici soltanto che qualcuno lo cerca per farlo parlare e che tu preferiresti arrivare
            prima, e non fai nessun nome dei clienti, nemmeno quelli della tua famiglia che sai passati da
            questo salone.

            Nerissa ti guarda a lungo da sopra la tazza. «Discrezione. Nei Quartieri Alti la insegnano ancora,
            a quanto pare» dice, e chiama con un cenno un uomo asciutto con una mazza imbottita alla cintura.
            «Tachek, porta su l'ospite. Poi resta in corridoio» gli dice, e a te spiega che la Luna Crescente
            è la prima porta in cima alla scala.
          effetti: { pista.dama-argento: 1, rep.maison: 0.5 }
      - testo: "Farle i conti della Maison"
        descrizione: "Nerissa parla di economia, e la licenza della Gilda ti ha insegnato a fare i conti anche in salotto."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il conto della casa
          testo: |
            Se Rennick resta qui e chi lo cerca viene a prenderlo, la Maison chiude entro un mese, come dice
            lei. Se invece Rennick parla con te stanotte e domani se ne va, chi lo cerca non ha più nessun
            motivo di bussare alla sua porta.

            Nerissa posa la tazza e intreccia le dita sul ginocchio. «Ragioni come un esattore della Gilda»
            dice, e per lei è quasi un complimento. «Tachek sale insieme a te e aspetta in corridoio, con la
            porta socchiusa. La Luna Crescente è la prima stanza in cima alla scala.»
          effetti: { pista.dama-argento: 1, rep.maison: 1 }
        fallimento:
          titolo: Un conto troppo preciso
          testo: |
            Ti lasci prendere la mano dai conti e a un certo punto stai spiegando a Nerissa quanto le costa la
            luce delle lampade. Lei ti lascia finire con la tazza ferma a mezz'aria, e intanto una delle
            lampade sfrigola sullo stoppino.

            «I conti della mia casa li tengo io» dice. «Ti faccio salire, però Tachek resta nella stanza per
            tutto il tempo.» Dal fondo del salone si alza un uomo asciutto, vestito di scuro, con una mazza
            imbottita alla cintura, e ti aspetta ai piedi della scala.
          effetti: { pista.dama-argento: 1, scandalo: 0.5 }

  # La stessa scena per chi alla Maison ci aveva già lavorato: stesse opzioni, stessi effetti.
  - id: nerissa-dalvane-di-casa
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: La padrona di casa
    sommario: "Il salone della Maison l'hai visto soltanto dalla porta della cucina. Stasera ti ci fanno sedere, e dalla scala scende Nerissa Dalvane."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [pista.dama-argento == 5, rep.maison >= 2]
    testo: |
      Sara Beck chiude a chiave l'armadio delle armi e ti affida a Gretchen, che ti chiama per nome e ha sotto
      il braccio il libro dei conti. Il libro ha la copertina di cuoio annerita agli angoli dalle dita.

      Il salone finora l'avevi visto soltanto dalla porta della cucina. Da dentro la luce delle lampade a olio
      è color miele, e sui tappeti spessi i passi non fanno rumore. Vicino al camino due ragazze parlano con
      un uomo in giubba verde che tiene un bicchiere fra le mani e non alza la testa quando entri.

      Gretchen sale la scala curva e torna giù con Nerissa Dalvane, il bracciale d'argento al polso sinistro.
      Nerissa ti indica una poltrona di velluto consumato sui braccioli e si siede di fronte a te, e la tua
      schiena si raddrizza da sola.

      Al nome di Rennick Dole non batte ciglio. «È arrivato all'alba ubriaco a metà, e ha tenuto la mano a
      Jass per due ore. Poi è salito al primo piano e non è più sceso, e stamattina sembrava uno che aspetta
      qualcuno.» Beve un sorso di tè e posa la tazza sul piattino senza farla tintinnare. «Le regole della
      casa le conosci. Chi sta sotto il mio tetto io lo proteggo, perché se un cliente esce da qui a forza la
      Maison chiude entro un mese, e la cucina con lei. Quindi dimmi perché lo cerchi.»
    opzioni: *opzioni-nerissa-dalvane

  - id: rennick-dole
    presso: via-dei-rasoi
    immagine: personaggi/rennick-dole
    titolo: La stanza Luna Crescente
    sommario: "La prima porta in cima alla scala. Rennick Dole è seduto sul letto, con una bottiglia quasi vuota e le mani che tremano."
    luogo: Maison des Lunes, primo piano
    area: citta-bassa
    requisiti: [pista.dama-argento == 6]
    testo: |
      Le assi del corridoio scricchiolano al centro e sono consumate lungo i muri, perché chi ci passa di
      notte ha imparato a camminare rasente. Sulla prima porta a destra è incisa una luna crescente. Prima che
      tu bussi, con Tachek alle spalle, la porta si apre ed esce una ragazza dai capelli rossi.

      Rennick Dole è seduto sul bordo del letto, scalzo, con una bottiglia di liquore di radice quasi vuota
      sul comodino. L'unica sedia della stanza è girata verso la porta. Ha gli occhi arrossati e tiene le mani
      strette sulle ginocchia perché non si veda che tremano.

      {medicina Media} Il tremito è fine e costante, e gli prende anche le palpebre. Quello da liquore si
      calma dopo un sorso, e questo è rimasto uguale con la bottiglia quasi finita.

      {origine mercante-dei-ponti} Al Mercato dei Nodi Rennick Dole tratta il legname con le mani piatte sul
      banco perché sembrino oneste, e quelle che stringe adesso non sono le mani di uno che tratta.

      «Jass» dice. «Stamattina mi ha ascoltato per due ore, e stasera è tornata su. È la spesa migliore che
      abbia mai fatto.» Poi guarda te senza sorpresa. «Ti aspettavo prima. Marko sa che sono qui e parlerà,
      quindi è meglio che parli io per primo. Siediti.»

      Vuoi sapere tre cose, e Rennick regge una domanda alla volta.
    opzioni:
      - testo: "Chiedergli di *Mawrak'Thur*"
        descrizione: "Rennick parla l'orchesco dei Nove Chiodi. Chiedigli che cosa ha sentito la sera del Festival."
        requisiti: [rennick.dama == 0]
        costo: 0
        esito:
          titolo: Sotto la bancarella
          testo: |
            Durante la razzia era nascosto sotto una bancarella rovesciata, e il capo sul cinghiale corazzato
            gli è passato a tre passi. «Diceva agli altri che la Dama d'Argento li aveva mandati.
            *Mawrak'Thur* vuol dire questo. Sono cinque tribù, e stanno tutte sotto una sacerdotessa.» La
            parola orchesca la dice di gola, come la dicevano loro, e poi si pulisce la bocca con il dorso
            della mano.

            «Al Velo devono saperlo. Se non lo sanno, qualcuno lassù lo tiene nascosto» dice, e stringe il
            collo della bottiglia finché le nocche diventano bianche.
          imposta: { rennick.dama: 1 }
          effetti: { informazioni.segreto: 1 }
          segue: rennick-dole
      - testo: "Chiedergli perché trema"
        descrizione: "La razzia l'hanno vista in tanti, eppure in tutta la Città Bassa l'unico che si è chiuso in una stanza è lui."
        requisiti: [rennick.cane == 0]
        costo: 0
        esito:
          titolo: La processione del Solstizio
          testo: |
            «Avevo otto anni, e lei nove. Alla processione del Solstizio Padre Sollen se la portava dietro
            legata al polso con un nastro argentato. Diceva che l'angelo si distraeva, se non sentiva il
            nastro.» A metà processione un cane è scattato da un vicolo verso la fiamma del sacerdote. La
            bambina si è voltata senza alzare le mani, e il cane si è piegato a mezz'aria, come se gli
            avessero spinto giù la schiena. Il cane è caduto senza un guaito.

            Rennick lo racconta guardando il pavimento, e le mani gli si sono fermate sulle ginocchia. «Aveva
            i capelli d'argento e gli occhi viola. In quel momento erano diventati color lavanda, e lei
            sorrideva.» Poi continua: «La sera le ho tirato il fango addosso e le ho dato della strega davanti
            a tutti. Volevo che la credessero pazza, così avrebbero smesso di portarla in processione e io
            avrei smesso di vederla.»
          imposta: { rennick.cane: 1 }
          effetti: { tormento: 1 }
          segue: rennick-dole
      - testo: "Chiedergli da chi si nasconde"
        descrizione: "Alla Segheria dicono che è partito per Laresh, ed è Marko a raccontarlo a chiunque chieda."
        requisiti: [rennick.paura == 0]
        costo: 0
        esito:
          titolo: Ottone ha esitato
          testo: |
            «Laresh era una copertura. Marko doveva raccontarla a chiunque chiedesse di me, e intanto io
            venivo qui.» Si guarda le mani, che hanno i calli di chi maneggia le lame della Segheria da anni.
            «Un paio di giorni fa qualcuno è andato a chiedere di me a Ottone Malgrani, e Ottone ha esitato
            sul nome. Lui esita solo quando ha paura.»

            «Voglio lasciare Qir-Azel stanotte. La Maison è l'unico posto dove nessuno può prendermi senza che
            qualcuno se ne accorga. Però qui dentro non ci posso restare per sempre.» Lo dice guardando la
            sedia girata verso la porta.
          imposta: { rennick.paura: 1 }
          segue: rennick-dole
      - testo: "Portarlo fuori dalla Maison stanotte"
        descrizione: "Rennick vuole andarsene subito. Per strada sarà sotto la tua parola, e tutti in Via dei Rasoi lo vedranno uscire con te."
        requisiti: [rennick.dama >= 1, rennick.cane >= 1, rennick.paura >= 1]
        esito:
          titolo: Stanotte
          testo: |
            Nel salone Nerissa è in piedi accanto al camino e vi guarda passare senza dire niente, mentre
            l'uomo in giubba verde tiene la testa bassa sul bicchiere. Sara Beck ti rende le armi e apre la
            porta. «Buona fortuna» dice, e la richiude subito dietro di voi.

            Fuori la lanterna fa sul selciato un cerchio giallo che finisce dopo pochi passi. Rennick ti
            cammina accanto con le mani in tasca, e due volte alza gli occhi verso i tetti.

            Più avanti, dove la strada fa il gomito, Rennick si ferma di colpo e ti prende per la manica.
          imposta: { rennick: 1 }
          effetti: { pista.dama-argento: 1, racconto: 1 }
          segue: scuri-via-dei-rasoi
      - testo: "Dirgli di restare nascosto e tornare domani"
        descrizione: "La Maison lo protegge meglio della strada, almeno per una notte."
        requisiti: [rennick.dama >= 1, rennick.cane >= 1, rennick.paura >= 1]
        esito:
          titolo: Domani
          testo: |
            Gli dici di restare chiuso in questa stanza fino a domani, perché Nerissa lo protegge meglio di
            quanto possa fare la strada.

            La sera dopo torni a prenderlo. Quando Sara ti apre, Rennick è già in fondo alla scala con gli
            stivali allacciati e la faccia di uno che ha dormito, per la prima volta da giorni. In strada la
            lanterna è accesa e le finestre sono buie. Sul selciato si sentono soltanto i vostri passi. Più
            avanti, dove la via fa il gomito, Rennick si ferma di colpo e ti prende per la manica.
          imposta: { rennick: 1 }
          effetti: { pista.dama-argento: 1, racconto: 1 }
          segue: scuri-via-dei-rasoi
      - testo: "Dirgli che vieni dalla Cattedrale"
        descrizione: "Rennick crede che al Velo qualcuno tenga nascoste le cose. Per uno così un accolito è un confessore oppure un nemico."
        quando: [origine.accolito-del-velo >= 1, rennick.cane == 0]
        costo: 0
        esito:
          titolo: Come a un prete
          testo: |
            Gli dici che vieni dalla Cattedrale e che dopo la razzia hai portato le bende in Città Bassa.
            Rennick alza gli occhi dalla bottiglia, e per tutto il racconto non li riabbassa.

            A otto anni era alla processione del Solstizio, quando Padre Sollen si portava dietro una bambina
            di nove anni legata al polso con un nastro argentato. Un cane è scattato da un vicolo verso la
            fiamma del sacerdote, e lei si è voltata senza alzare le mani. Il cane si è piegato a mezz'aria ed
            è caduto senza un guaito. «Aveva gli occhi viola, e in quel momento erano color lavanda.
            Sorrideva.» La sera Rennick le ha tirato il fango addosso e le ha dato della strega davanti a
            tutti.
          imposta: { rennick.cane: 1 }
          segue: rennick-dole
      - testo: "Parlargli come a una bestia spaventata"
        descrizione: "Al Circolo agli animali spaventati si parla con la voce bassa e le mani ferme, e non gli si chiede niente."
        quando: [origine.figlio-del-circolo >= 1, rennick.cane == 0]
        costo: 0
        esito:
          titolo: Il cane del vicolo
          testo: |
            Ti siedi sul pavimento invece che sulla sedia, un poco più in basso di lui, e gli parli con la
            voce che al Circolo si usa per i puledri, senza fargli domande. Dopo un poco le spalle gli
            scendono, e le mani si aprono sulle ginocchia.

            A otto anni era alla processione del Solstizio, quando Padre Sollen si portava dietro una bambina
            di nove anni legata al polso con un nastro argentato. Un cane è scattato da un vicolo verso la
            fiamma del sacerdote, e lei si è voltata senza alzare le mani. Il cane si è piegato a mezz'aria ed
            è caduto senza un guaito. «Aveva gli occhi viola, e in quel momento erano color lavanda.
            Sorrideva.» La sera Rennick le ha tirato il fango addosso e le ha dato della strega davanti a
            tutti.
          imposta: { rennick.cane: 1 }
          effetti: { tormento: 1 }
          segue: rennick-dole

  - id: scuri-via-dei-rasoi
    presso: via-dei-rasoi
    immagine: personaggi/rozalia-marga
    titolo: Gli Scuri in Via dei Rasoi
    sommario: "Al gomito del cristallo spento c'è una donna con una piuma dietro l'orecchio. Tre passi dietro di lei aspetta un uomo con la benda."
    luogo: Via dei Rasoi, al cristallo spento
    area: citta-bassa
    requisiti: [pista.dama-argento == 7]
    testo: |
      Al gomito della strada, appoggiata al cristallo spento, c'è una donna snella con una piuma da scrivere
      dietro l'orecchio. Il cristallo conduttore è più alto di un uomo e da anni non dà luce, e la sua
      superficie opaca non restituisce nemmeno il riflesso della lanterna della Maison. La donna ha le dita
      macchiate d'inchiostro fino alla seconda falange.

      Tre passi dietro di lei aspetta un uomo enorme con una benda nera sull'occhio sinistro e le mani in
      tasca. Porta una giacca pesante anche se la sera è tiepida, e la benda è consumata fino alla trama. Sui
      tetti delle case basse, una per lato, due sagome con le balestre stanno al riparo dietro i comignoli.

      {armi-da-distanza Media} Le due balestre prendono il gomito da due lati, e chi si ripara da una resta
      scoperto all'altra. L'unico riparo che le copre tutte e due è il cristallo, e ci sta appoggiata lei.

      «Buonasera. Spero che la signora Dalvane ti abbia trattato come si deve. Mi chiamo Rozalia Marga, e lui
      è Squiggor. Su, saluta.» L'uomo non si muove. «Gli è venuta la timidezza. Cerchiamo Rennick Dole, che
      sta tre passi dietro di te. Tu ce lo consegni e noi torniamo a casa. Non serve firmare niente, anche se
      firmare è la mia specialità.»

      {origine figlio-della-citta-bassa} In Città Bassa quando passa Squiggor si cambia marciapiede, e le tue
      gambe hanno già fatto mezzo passo verso il muro.
    opzioni:
      - testo: "Dirle della Dama d'Argento"
        descrizione: "Rozalia è una professionista. Se le offri qualcosa che vale più di Rennick, ti ascolta."
        requisiti: [rennick.dama >= 1]
        esito:
          titolo: All'ora del mercato
          testo: |
            Le racconti quello che Rennick ti ha tradotto. Quando arrivi a *Mawrak'Thur*, Rozalia smette di
            sorridere, e sul tetto di sinistra la balestra si abbassa di un palmo. «E Rennick la sa tradurre»
            dice, e si tocca la piuma dietro l'orecchio.

            «Facciamo così. Rennick te lo lascio per stanotte. Domani all'ora del mercato vieni alla Pignatta
            da sol{o|a} e mi racconti tutto quello che sai. Se me lo racconti per intero, Mirko riceve un
            rapporto che lo soddisfa e nessuno torna a cercare nessuno. Se domani ti aspetto per niente, vengo
            a cercarti io.»
          imposta: { resoconto.scuri: 1 }
          effetti: { rep.scuri: 0.5, pista.dama-argento: 1 }
      - testo: "Tenere il punto"
        descrizione: "Rennick è sotto la tua parola. Puoi dirlo a Rozalia e sperare che le basti, con due balestre puntate sulla strada."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Difficile }
        successo:
          titolo: Il conto resta aperto
          testo: |
            Rennick resta dov'è, e chi lo vuole deve passare da te. Rozalia ti studia a lungo. Squiggor sposta
            il peso da un piede all'altro, e lei alza una mano senza voltarsi.

            «Bene. Buonanotte, allora.» Si stringe la mantellina sulle spalle. «Però il conto resta aperto.
            Mirko saprà entro un'ora che hai difeso Rennick Dole davanti a tutta Via dei Rasoi, e Squiggor le
            offese se le tiene a mente.»

            Si allontanano verso Via del Salmone senza fretta. Le sagome sui tetti restano dietro i comignoli
            finché loro non hanno girato l'angolo, e poi spariscono anche quelle.
          effetti: { rep.scuri: -1, pista.dama-argento: 1 }
        fallimento:
          titolo: Sul selciato
          testo: |
            Rozalia ti ascolta fino in fondo, poi sospira.

            Squiggor tira fuori le mani dalle tasche, e hanno le nocche grosse come noci.

            Il primo colpo ti prende sotto le costole e il secondo ti manda contro il cristallo spento, e
            l'aria esce dai polmoni senza chiederti niente. Il cristallo è freddo contro la nuca. Con la
            guancia sul selciato vedi due uomini scesi dai tetti che portano via Rennick Dole verso Via del
            Salmone, tenendolo per le braccia. Rennick non grida, e ti guarda una volta sola prima che girino
            l'angolo.
          imposta: { rennick: 2 }
          effetti: { ferite: 2, rep.scuri: -0.5, pista.dama-argento: 1 }
      - testo: "Rispondere con le mani"
        descrizione: "Due Scuri in strada e due balestre sui tetti. Se decidi di farlo, fallo prima che Squiggor tiri fuori le mani dalle tasche."
        immagine: personaggi/squiggor-ironfist
        combattimento: rissa-via-dei-rasoi
        vittoria:
          titolo: Il fumogeno
          testo: |
            Squiggor va giù per ultimo e non si rialza più. Sotto la sua testa il selciato si scurisce piano,
            e nell'aria c'è un odore di metallo bagnato. Rozalia si inginocchia accanto a lui un momento, poi
            rompe una fiala contro la pietra. Un fumo grigio che brucia gli occhi e raschia in gola riempie il
            gomito della strada, e quando si dirada, fra un colpo di tosse e l'altro, lei non c'è più.

            Nerissa Dalvane guarda il corpo dalla soglia della Maison e richiude la porta senza dire niente.
          imposta: { squiggor: 2 }
          effetti: { rep.scuri: -2, sospetto: 1.5, pista.dama-argento: 1, racconto: 1 }
        sconfitta:
          titolo: Portato via
          testo: |
            Squiggor ride quando lo colpisci, con una risata corta e contenta che gli esce dal fondo della
            gola. Alla fine sei tu a finire contro il cristallo spento, con il sapore del sangue in bocca e un
            orecchio che fischia. Mentre provi a rialzarti, due uomini scesi dai tetti trascinano Rennick Dole
            verso Via del Salmone.

            Rozalia si china su di te e ti sistema il colletto con due dita macchiate d'inchiostro.
            L'inchiostro le arriva fino alla seconda falange. «Era un'offerta semplice» dice. Poi raggiunge
            gli altri senza voltarsi, con la piuma ancora dietro l'orecchio.
          imposta: { rennick: 2 }
          effetti: { rep.scuri: -0.5, pista.dama-argento: 1 }
      - testo: "Consegnarle Rennick"
        descrizione: "Rozalia ha fatto un'offerta semplice, e gli Scuri pagano chi li aiuta."
        esito:
          titolo: L'offerta di Rozalia
          testo: |
            Quando lo chiami, Rennick viene. Ti segue fino al cristallo spento e capisce soltanto lì, quando
            Squiggor gli posa una mano sulla spalla, e non prova a scappare. La mano gli copre la spalla
            intera.

            Rozalia conta le monete e te le mette nel palmo una alla volta, e sono ancora tiepide della sua
            tasca. «Mirko sarà contento» dice, e ti chiude le dita sopra. «E chi lo fa contento, al prossimo
            lavoretto ha la sua parte.»
          imposta: { rennick: 2 }
          effetti: { rep.scuri: 2, monete: 15, pista.dama-argento: 1 }
      - testo: "Fare a Squiggor il cenno della Pignatta"
        descrizione: "Tu e Squiggor vi conoscete. Anni fa, sull'Orlo dei Rottami, vi siete picchiati per un carico di cristalli, ed è finita con una tregua."
        immagine: personaggi/squiggor-ironfist
        requisiti: [contatto-ombra >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, intimidire], difficolta: Media }
        successo:
          titolo: Un occhio chiuso
          testo: |
            Ti fermi davanti a Squiggor invece che davanti a Rozalia e gli fai il cenno col mento che vi
            scambiate alla Pignatta. Lui ti guarda per la prima volta, con l'occhio buono. Sull'Orlo dei
            Rottami vi eravate picchiati per venti minuti a causa di un carico di cristalli che secondo lui
            avevi alleggerito, e alla fine vi eravate seduti sul bordo della Cicatrice a guardare il vuoto,
            senza dirvi niente.

            «Chiudo un occhio» aveva detto allora. Adesso lo ripete a voce bassa, con la stessa voce di gola,
            e Rozalia sospira. «Va bene. Per stanotte Rennick è tuo.»

            Si allontanano verso Via del Salmone, e sui tetti le balestre spariscono dietro i comignoli.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: La tregua è scaduta
          testo: |
            Gli fai il cenno col mento che vi scambiate alla Pignatta, e Squiggor non lo restituisce. Tira
            fuori le mani dalle tasche senza fretta.

            Il primo colpo ti piega in due, il secondo ti manda contro il cristallo spento, e il mondo per un
            poco va avanti senza di te. Con la guancia sul selciato vedi due uomini scesi dai tetti che
            portano via Rennick Dole tenendolo per le braccia, e lui ti cerca con gli occhi finché non girano
            l'angolo di Via del Salmone.
          imposta: { rennick: 2 }
          effetti: { ferite: 2, rep.scuri: -0.5, pista.dama-argento: 1 }
      - testo: "Ricordare a Squiggor l'Orlo dei Rottami"
        descrizione: "Sull'Orlo dei Rottami tu e Squiggor vi siete contesi a pugni un carico di cristalli."
        immagine: personaggi/squiggor-ironfist
        requisiti: [raschiatore >= 1]
        prova: { attributo: fisico, abilita: [atletica, intimidire], difficolta: Media }
        successo:
          titolo: Venti minuti sull'Orlo
          testo: |
            Ti sfili la giacca e la butti sul selciato, e Squiggor capisce prima di Rozalia.

            Sull'Orlo dei Rottami vi siete picchiati per venti minuti a un passo dal bordo senza che nessuno
            dei due cadesse, e alla fine vi siete seduti sull'orlo della Cicatrice, con le gambe sul vuoto, a
            sputare sangue.

            Squiggor si tocca la benda con due dita, nel punto dove la stoffa è più lisa. «Pari» dice. Rozalia
            alza gli occhi al cielo. «Rennick resta tuo per stanotte. Squiggor, andiamo.»

            Si allontanano verso Via del Salmone, e sui tetti le balestre spariscono dietro i comignoli.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Niente tregua
          testo: |
            Ti sfili la giacca, e Squiggor sorride per la prima volta, con tutti i denti che gli sono rimasti.

            Il primo colpo ti prende sotto le costole e il secondo ti manda contro il cristallo spento. Con la
            guancia sul selciato vedi due uomini scesi dai tetti che portano via Rennick Dole verso Via del
            Salmone. Rozalia li segue raccogliendo la tua giacca da terra, e te la getta addosso passando. La
            giacca ti cade sulla faccia e sa di polvere della strada.
          imposta: { rennick: 2 }
          effetti: { ferite: 2, rep.scuri: -0.5, pista.dama-argento: 1 }
      - testo: "Metterti fra Rennick e Squiggor"
        descrizione: "A Ghoran hai visto come si consegna qualcuno a chi lo porta via, e non hai intenzione di farlo tu."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza, intimidire], difficolta: Difficile }
        successo:
          titolo: Il muro
          testo: |
            Fai un passo indietro e ti pianti davanti a Rennick a gambe larghe, con le mani aperte lungo i
            fianchi, e guardi Squiggor invece di Rozalia. Lui tira fuori le mani dalle tasche e ti viene
            incontro fino a mezzo braccio, così vicino che senti l'odore di lana umida della sua giacca.

            Rozalia alza una mano senza voltarsi, e Squiggor si ferma. «Bene. Buonanotte, allora» dice lei,
            stringendosi la mantellina sulle spalle. «Però il conto resta aperto. Mirko saprà entro un'ora chi
            ha difeso Rennick Dole in Via dei Rasoi.»
          effetti: { rep.scuri: -1, pista.dama-argento: 1 }
        fallimento:
          titolo: Consegnato
          testo: |
            Ti pianti davanti a Rennick a gambe larghe, e Squiggor non si ferma nemmeno. Il primo colpo ti
            prende sotto le costole e ti piega, il secondo ti manda contro il cristallo spento, e l'aria ti
            esce dai polmoni tutta insieme.

            Con la guancia sul selciato vedi due uomini scesi dai tetti che prendono Rennick per le braccia e
            lo portano verso Via del Salmone, senza fretta, come una cosa già pagata. Rennick non grida. Ti
            guarda una volta sola prima che girino l'angolo.
          imposta: { rennick: 2 }
          effetti: { ferite: 2, rep.scuri: -0.5, pista.dama-argento: 1 }
