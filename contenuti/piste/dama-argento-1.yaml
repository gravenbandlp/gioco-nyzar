# Pista "La Dama d'Argento", blocco 2, prima metà (5 → 8): Nerissa, Rennick, gli Scuri in Via dei Rasoi.
storylet:
  - id: nerissa-dalvane
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: La padrona di casa
    sommario: "Nel salone della Maison la luce è color miele, e dalla scala scende la padrona di casa."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    # Con rep.maison >= 2 (la sera della lanterna dà 1) ci avevi già lavorato: variante `nerissa-dalvane-di-casa`.
    requisiti: [pista.dama-argento == 5, rep.maison < 2]
    testo: |
      Sara Beck chiude a chiave l'armadio delle armi e ti affida a Gretchen, la
      più anziana delle ragazze, che ti accompagna oltre la tenda senza
      chiederti il nome.

      {origine fuggiasco-di-ghoran} Gretchen dice «da questa parte» con la
      cadenza di Ghoran, la stessa di quelli che ti pesavano.

      Il salone è piccolo, con poltrone di cuoio scuro e lampade dagli schermi
      fumé che danno una luce color miele.

      Gretchen sale la scala curva e torna giù un passo dietro a una donna
      alta, con un bracciale d'argento al polso sinistro. Nerissa Dalvane ti
      indica una poltrona e si siede di fronte a te.

      Quando le dici il nome di Rennick Dole, lei non batte ciglio. «È arrivato
      all'alba, ubriaco a metà. Ha chiesto di Jass e le ha tenuto la mano per
      due ore, poi è salito al primo piano e non è più sceso.» Beve un sorso di
      tè. «Chi sta sotto il mio tetto io lo proteggo. È una questione di
      economia, perché il giorno in cui un cliente esce da qui portato via a
      forza la Maison chiude entro un mese. Quindi dimmi perché lo cerchi.»

      {empatia Media} Dice economia, e intanto stringe la tazza con tutte e due
      le mani.
    opzioni: &opzioni-nerissa-dalvane
      - testo: "Raccontarle la verità sul Festival"
        descrizione: "Le racconti della parola che gridavano gli orchi, e Nerissa riconosce una bugia al volo."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La porta socchiusa
          testo: |
            Le racconti della razzia e di *Mawrak'Thur*, e a «Dama d'Argento»
            Nerissa posa la tazza. «Due settimane fa uno Scuro ubriaco parlava qui
            di una donna dai capelli d'argento, e io l'avevo messo sul conto del
            vino.» Tachek salirà con te e aspetterà in corridoio, e Rennick è
            nella prima stanza in cima alla scala, la Luna Crescente. «Se ti dice
            quello che credo, non ripeterlo sotto il mio tetto.»
          effetti: { pista.dama-argento: 1, rep.maison: 1 }
        fallimento:
          titolo: Tachek nella stanza
          testo: |
            Racconti tutto in modo confuso, e a metà ti accorgi che le mani ti
            stanno mimando il cinghiale con le zanne. «Ti credo a metà» dice
            Nerissa alla fine, «e per farti salire mi basta. Però Tachek viene con
            te e resta nella stanza.» Dal fondo del salone si alza un uomo
            asciutto, vestito di scuro, con una mazza imbottita alla cintura, e ti
            aspetta ai piedi della scala.
          effetti: { pista.dama-argento: 1, scandalo: 0.5 }
      - testo: "Pagare il disturbo"
        descrizione: "Alla Maison ogni cosa ha una tariffa, e Nerissa non si offende se gliela ricordi."
        requisiti: [monete >= 10]
        esito:
          immagine: personaggi/tachek
          titolo: Il prezzo del disturbo
          testo: |
            Posi una manciata di monete accanto alla teiera, e Gretchen le conta
            nel palmo muovendo appena le labbra. «Il disturbo si paga» dice
            Nerissa, «ma da solo con lui non ti ci lascio.» Chiama dal fondo del
            salone un uomo asciutto con una mazza imbottita alla cintura. «Tachek
            sale con te e resta nella stanza. La Luna Crescente è la prima porta
            in cima alla scala.»
          effetti: { monete: -10, pista.dama-argento: 1 }
      - testo: "Fare il nome di Marko Thessel"
        descrizione: "Marko sa dove si nasconde Rennick, e il suo nome può far capire a Nerissa che il tempo stringe."
        immagine: personaggi/marko-thessel
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, galateo], difficolta: Media }
        successo:
          titolo: Il socio della Segheria
          testo: |
            Le dici che Marko Thessel sa dov'è Rennick, e Nerissa guarda Gretchen.
            «Marko è venuto a tirare la catena stasera, e Sara l'ha rimandato
            indietro» dice. «Se lo conosci, sai che la prossima volta non verrà da
            solo.» Chiama Tachek, un uomo asciutto con una mazza imbottita alla
            cintura, perché salga con te e resti nella stanza. La Luna Crescente è
            la prima porta in cima alla scala.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Un nome che non basta
          testo: |
            Nerissa ascolta il nome di Marko Thessel senza cambiare espressione.
            «Marko lo conosco da anni. Del motivo per cui cerchi Rennick, invece,
            non mi hai detto niente.» Si alza lasciando il tè a fumare sul
            tavolino, e Gretchen ti riaccompagna fuori con la stessa cortesia di
            prima. Sara Beck ti rende le armi e ti dice che la signora, se vorrai,
            ti riceverà un'altra volta.
          effetti: { rep.maison: -0.5, sospetto: 0.5 }
      - testo: "Minacciarla"
        descrizione: "Nerissa è disarmata quanto te, e puoi spiegarle cosa succede a chi ti si mette in mezzo."
        esito:
          immagine: personaggi/churl-braak
          titolo: Churl Bra'aak
          testo: |
            Le spieghi a voce bassa cosa succede alla Maison se Rennick non
            scende. Nerissa alza due dita verso il fondo del salone. «Rennick è
            sotto il mio tetto.»

            Una mano larga come una pala ti solleva per il colletto. Churl Bra'aak
            ti porta fuori facendoti sbattere la spalla contro lo stipite, e Sara
            Beck ti rende le armi una alla volta davanti a chi passa per Via dei
            Rasoi.
          effetti: { ferite: 0.5, scandalo: 1, rep.maison: -1 }
      - testo: "Parlarle con le regole dei salotti"
        descrizione: "Nei Quartieri Alti la Maison non la nomina nessuno, e sai chiedere senza mettere in imbarazzo."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          immagine: personaggi/tachek
          titolo: Le regole della casa
          testo: |
            Le parli come a una padrona di casa dei Quartieri Alti, e di Rennick
            dici solo che qualcuno lo cerca e che preferiresti arrivare prima.
            Nerissa posa la tazza. «Discrezione. Nei Quartieri Alti la insegnano
            ancora» dice, e chiama Tachek, un uomo asciutto con una mazza
            imbottita alla cintura, perché ti porti su e resti in corridoio. La
            Luna Crescente è la prima porta in cima alla scala.
          effetti: { pista.dama-argento: 1, rep.maison: 0.5 }
      - testo: "Farle i conti della Maison"
        descrizione: "Un cliente portato via a forza costa caro alla Maison, e anche uno che resta troppo a lungo."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il conto della casa
          testo: |
            Le rispondi con i conti. Se Rennick resta qui e lo vengono a prendere,
            la Maison chiude entro un mese. Se parla con te stanotte e domani se
            ne va, nessuno ha più motivo di bussare. «Ragioni come un esattore
            della Gilda» dice Nerissa, ed è quasi un complimento. «Tachek sale con
            te e aspetta in corridoio. La Luna Crescente è la prima stanza in cima
            alla scala.»
          effetti: { pista.dama-argento: 1, rep.maison: 1 }
        fallimento:
          titolo: Un conto troppo preciso
          testo: |
            Ti lasci prendere la mano e a un certo punto stai spiegando a Nerissa
            quanto le costa la luce delle lampade. «I conti della mia casa li
            tengo io» dice. «Ti faccio salire, però Tachek resta nella stanza per
            tutto il tempo.» Dal fondo del salone si alza un uomo asciutto con una
            mazza imbottita alla cintura, e ti aspetta ai piedi della scala.
          effetti: { pista.dama-argento: 1, scandalo: 0.5 }

  # La stessa scena per chi alla Maison ci aveva già lavorato: stesse opzioni, stessi effetti.
  - id: nerissa-dalvane-di-casa
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: La padrona di casa
    sommario: "Il salone della Maison l'hai visto soltanto dalla porta della cucina, e stasera ti ci fanno sedere."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [pista.dama-argento == 5, rep.maison >= 2]
    testo: |
      Sara Beck chiude a chiave l'armadio delle armi e ti affida a Gretchen,
      che ti chiama per nome e ti accompagna oltre la tenda con il libro dei
      conti sotto il braccio.

      Il salone, da questa parte, sembra più piccolo che dalla porta della
      cucina, con le poltrone di cuoio scuro e le lampade che danno una luce
      color miele.

      Gretchen torna giù dalla scala un passo dietro a Nerissa Dalvane, con il
      bracciale d'argento al polso sinistro. *Mi ha visto portare fuori i
      secchi della cenere, e adesso mi vede in salone.* Nerissa ti indica una
      poltrona e si siede di fronte a te.

      Quando le dici il nome di Rennick Dole, lei non batte ciglio. «È arrivato
      all'alba, ubriaco a metà. Ha chiesto di Jass e le ha tenuto la mano per
      due ore, poi è salito al primo piano e non è più sceso.» Beve un sorso di
      tè. «Le regole della casa le conosci. Chi sta sotto il mio tetto io lo
      proteggo, perché il giorno in cui un cliente esce da qui portato via a
      forza la Maison chiude entro un mese, e la cucina con lei. Quindi dimmi
      perché lo cerchi.»
    opzioni: *opzioni-nerissa-dalvane

  - id: rennick-dole
    presso: via-dei-rasoi
    immagine: personaggi/rennick-dole
    titolo: La stanza Luna Crescente
    sommario: "Nella prima stanza in cima alla scala Rennick Dole aspetta seduto sul letto, con le mani che tremano."
    luogo: Maison des Lunes, primo piano
    area: citta-bassa
    requisiti: [pista.dama-argento == 6]
    testo: |
      La scala è stretta e di legno scuro, e il terzo gradino scricchiola sotto
      il tuo peso ma non sotto quello di Tachek. Al primo piano le pareti sono
      tappezzate di carta color vino, e sulla prima porta a destra è incisa una
      luna crescente. Prima che tu bussi la porta si apre ed esce una ragazza
      dai capelli rossi.

      Rennick Dole è seduto sul bordo del letto, con una bottiglia di liquore di
      radice quasi vuota sul comodino. Ha gli occhi arrossati e tiene le mani
      strette sulle ginocchia perché non si veda che tremano.

      {medicina Media} Il tremito è fine e costante, e non viene dal liquore.
      Quello da bottiglia passa bevendo, questo no.

      {origine mercante-dei-ponti} Al Mercato dei Nodi Rennick Dole tratta il
      legname con le mani piatte sul banco, perché sembrino oneste. Quelle che
      stringe sulle ginocchia non sembrano le mani di uno che tratta.

      «Jass» dice, guardando la porta. «Mi ha ascoltato per due ore, ed è la
      spesa migliore che abbia mai fatto.» Poi guarda te, e non sembra sorpreso.
      «Ti aspettavo prima. Marko sa che sono qui e parlerà, quindi è meglio che
      parli io per primo. Siediti.»

      Ci sono tre cose che vuoi sapere da lui, e Rennick regge una domanda alla
      volta, guardando la bottiglia fra una risposta e l'altra.
    opzioni:
      - testo: "Chiedergli di *Mawrak'Thur*"
        descrizione: "Rennick parla l'orchesco dei Nove Chiodi. Chiedigli che cosa ha sentito la sera del Festival."
        requisiti: [rennick.dama == 0]
        costo: 0
        esito:
          titolo: Sotto la bancarella
          testo: |
            Rennick tocca la bottiglia senza bere. «Mio padre commerciava pelli
            con i Nove Chiodi, e con lui ho imparato l'orchesco.» Durante la
            razzia il capo sul cinghiale corazzato gli è passato a tre passi.
            «Diceva agli altri che la Dama d'Argento li aveva mandati.
            *Mawrak'Thur* vuol dire questo. Sono cinque tribù sotto una
            sacerdotessa. Al Velo devono saperlo, e se non lo sanno qualcuno lassù
            lo tiene nascosto.»
          imposta: { rennick.dama: 1 }
          effetti: { informazioni.segreto: 1 }
          segue: rennick-dole
      - testo: "Chiedergli perché trema"
        descrizione: "La razzia l'hanno vista in tanti, ma a chiudersi in una stanza è stato solo lui."
        requisiti: [rennick.cane == 0]
        costo: 0
        esito:
          titolo: La processione del Solstizio
          testo: |
            «Avevo otto anni e lei nove. Alla processione del Solstizio Padre
            Sollen se la portava dietro legata al polso con un nastro argentato.»
            Un cane è scattato da un vicolo e la bambina l'ha fatto cadere morto
            senza alzare le mani. «Aveva i capelli d'argento e sorrideva, con gli
            occhi viola diventati lavanda. La sera le ho dato della strega davanti
            a tutti, perché smettessero di portarla in processione.»
          imposta: { rennick.cane: 1 }
          effetti: { tormento: 1 }
          segue: rennick-dole
      - testo: "Chiedergli da chi si nasconde"
        descrizione: "Alla Segheria dicono che è partito per Laresh, ed è Marko a raccontarlo a chiunque chieda."
        requisiti: [rennick.paura == 0]
        costo: 0
        esito:
          titolo: Ottone ha esitato
          testo: |
            Rennick finisce la bottiglia in un sorso. «Laresh era una copertura.
            Marko doveva raccontarla a chiunque chiedesse di me, e intanto io
            venivo qui. Un paio di giorni fa qualcuno ha chiesto di me a Ottone
            Malgrani, e Ottone ha esitato sul nome. Esita solo quando ha paura.
            Voglio lasciare Qir-Azel stanotte. Qui nessuno può prendermi senza che
            si sappia, però non ci posso restare per sempre.»
          imposta: { rennick.paura: 1 }
          segue: rennick-dole
      - testo: "Portarlo fuori dalla Maison stanotte"
        descrizione: "Rennick vuole andarsene subito, e tutta Via dei Rasoi lo vedrà uscire con te."
        requisiti: [rennick.dama >= 1, rennick.cane >= 1, rennick.paura >= 1]
        esito:
          titolo: Stanotte
          testo: |
            Rennick si infila gli stivali senza allacciarli, perché le dita non ne
            vogliono sapere, e lascia sul comodino qualche moneta per Jass. Nel
            salone Nerissa vi guarda passare, e Sara Beck ti rende le armi e
            richiude subito la porta.

            Fuori la lanterna è accesa e le finestre sono buie. Dove la strada fa
            il gomito Rennick si ferma di colpo e ti prende per la manica.
          imposta: { rennick: 1 }
          effetti: { pista.dama-argento: 1, racconto: 1 }
          segue: scuri-via-dei-rasoi
      - testo: "Dirgli di restare nascosto e tornare domani"
        descrizione: "Per una notte la Maison lo protegge meglio della strada, e domani potrai portarlo via con calma."
        requisiti: [rennick.dama >= 1, rennick.cane >= 1, rennick.paura >= 1]
        esito:
          titolo: Domani
          testo: |
            Gli dici di restare chiuso qui fino a domani, e Rennick paga un'altra
            notte. «Ti aspetto fino a domani sera, poi esco da solo.»

            La sera dopo è già in fondo alla scala con gli stivali allacciati e la
            faccia di uno che ha dormito. In strada, dove la via fa il gomito,
            Rennick si ferma di colpo e ti prende per la manica.
          imposta: { rennick: 1 }
          effetti: { pista.dama-argento: 1, racconto: 1 }
          segue: scuri-via-dei-rasoi
      - testo: "Dirgli che vieni dalla Cattedrale"
        descrizione: "Rennick crede che il Velo nasconda le cose, e un accolito per lui è un confessore o un nemico."
        quando: [origine.accolito-del-velo >= 1, rennick.cane == 0]
        costo: 0
        esito:
          titolo: Come a un prete
          testo: |
            Gli dici che vieni dalla Cattedrale, e Rennick te lo racconta come a un
            prete. A otto anni ha visto Padre Sollen portare alla processione del
            Solstizio una bambina legata al polso con un nastro argentato. Un cane è
            scattato da un vicolo e lei l'ha fatto cadere morto senza alzare le
            mani, con gli occhi viola diventati lavanda. La sera Rennick le ha dato
            della strega davanti a tutti.
          imposta: { rennick.cane: 1 }
          segue: rennick-dole
      - testo: "Parlargli come a una bestia spaventata"
        descrizione: "Al Circolo agli animali spaventati si parla piano, e Rennick trema come un puledro che ha sentito il lupo."
        quando: [origine.figlio-del-circolo >= 1, rennick.cane == 0]
        costo: 0
        esito:
          titolo: Il cane del vicolo
          testo: |
            Ti siedi per terra e gli parli come ai puledri del Circolo. A otto
            anni ha visto Padre Sollen portare alla processione del Solstizio una
            bambina legata al polso con un nastro argentato. Un cane è scattato da
            un vicolo e lei l'ha fatto cadere morto senza alzare le mani, con gli
            occhi viola diventati lavanda. La sera Rennick le ha dato della strega
            davanti a tutti.
          imposta: { rennick.cane: 1 }
          effetti: { tormento: 1 }
          segue: rennick-dole

  - id: scuri-via-dei-rasoi
    presso: via-dei-rasoi
    immagine: personaggi/rozalia-marga
    titolo: Gli Scuri in Via dei Rasoi
    sommario: "Al cristallo spento ti aspettano una donna con la piuma dietro l'orecchio e un uomo con la benda."
    luogo: Via dei Rasoi, al cristallo spento
    area: citta-bassa
    requisiti: [pista.dama-argento == 7]
    testo: |
      A quest'ora Via dei Rasoi è quasi vuota, e i pochi rumori scendono dalle
      finestre socchiuse. Al gomito della strada, con la schiena appoggiata al
      cristallo spento, c'è una donna snella con i capelli raccolti sulla nuca
      e una piuma da scrivere dietro l'orecchio. Si pulisce le unghie con un
      coltellino da ufficio senza fretta, e l'inchiostro le arriva fino alla
      seconda falange.

      *Una falsaria. O una che scrive molte lettere d'amore.* Le tue mani, per
      conto loro, tornano vicino alla cintura.

      Tre passi dietro di lei c'è un uomo enorme con una benda sull'occhio e le
      mani in tasca, e sui tetti ai due lati della via due balestrieri stanno
      dietro i comignoli.

      {armi-da-distanza Media} Chi si ripara da una balestra resta scoperto
      all'altra.

      «Buonasera. Mi chiamo Rozalia Marga, e lui è Squiggor, che oggi ha la
      timidezza. Cerchiamo Rennick Dole, che ti sta dietro e spera che non ce
      ne accorgiamo. Tu ce lo consegni e noi torniamo a casa, senza firmare
      niente, anche se firmare è la mia specialità.»

      {origine figlio-della-citta-bassa} Di Squiggor in Città Bassa si impara
      la faccia prima del nome, e le tue gambe hanno già fatto mezzo passo
      verso il muro.

      Chi conosce gli Scuri sa che quando Squiggor sposta il peso da un piede
      all'altro restano pochi secondi.
    opzioni:
      - testo: "Dirle della Dama d'Argento"
        descrizione: "Rozalia è una professionista, e se le offri qualcosa che vale più di Rennick ti ascolta."
        requisiti: [rennick.dama >= 1]
        esito:
          titolo: All'ora del mercato
          testo: |
            Le racconti quello che Rennick ti ha tradotto, e a *Mawrak'Thur* Rozalia
            smette di sorridere. «Facciamo così. Rennick te lo lascio per stanotte.
            Domani all'ora del mercato vieni alla Pignatta da solo e mi racconti tutto,
            così Mirko riceve un rapporto che lo soddisfa. Se ti aspetto per niente,
            vengo a cercarti io.» Si avvia verso Via del Salmone con Squiggor, e sui
            tetti le balestre spariscono.
          imposta: { resoconto.scuri: 1 }
          effetti: { rep.scuri: 0.5, pista.dama-argento: 1 }
      - testo: "Tenere il punto"
        descrizione: "Rennick è sotto la tua parola, e puoi dirlo a Rozalia sotto due balestre puntate."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Difficile }
        successo:
          titolo: Il conto resta aperto
          testo: |
            Le dici, guardandola negli occhi, che chi vuole Rennick deve passare
            da te, con le balestre che ti prudono fra le scapole. Quando Squiggor
            sposta il peso Rozalia alza una mano senza voltarsi. «Buonanotte,
            allora. Il conto però resta aperto. Mirko saprà entro un'ora che hai
            difeso Rennick Dole, e Squiggor le offese se le tiene a mente.» Le
            ginocchia ti cedono solo quando se ne sono andati.
          effetti: { rep.scuri: -1, pista.dama-argento: 1 }
        fallimento:
          titolo: Sul selciato
          testo: |
            Rozalia ti ascolta e sospira. «Mi spiace» dice, e fa un passo di lato.
            Squiggor tira fuori le mani dalle tasche, con le nocche fasciate. Il
            primo colpo ti prende sotto le costole e il secondo ti manda contro il
            cristallo spento. Con la guancia sul selciato vedi due uomini scesi
            dai tetti portare via Rennick Dole verso Via del Salmone, e lui ti
            guarda una volta sola.
          imposta: { rennick: 2 }
          effetti: { ferite: 2, rep.scuri: -0.5, pista.dama-argento: 1 }
      - testo: "Rispondere con le mani"
        descrizione: "Due Scuri in strada e due balestre sui tetti, e devi muoverti prima che Squiggor tiri fuori le mani."
        immagine: personaggi/squiggor-ironfist
        combattimento: rissa-via-dei-rasoi
        vittoria:
          titolo: Il fumogeno
          testo: |
            Squiggor va giù per ultimo e non si rialza più, con la benda storta e la
            faccia rivolta al cielo ai piedi del cristallo spento. Rozalia si
            inginocchia accanto a lui un momento, poi rompe una fiala contro la
            pietra, e quando il fumo grigio si dirada lei e i balestrieri sono
            spariti. Nerissa Dalvane guarda il corpo dalla soglia della Maison e
            richiude la porta piano, senza dire niente.
          imposta: { squiggor: 2 }
          effetti: { rep.scuri: -2, sospetto: 1.5, pista.dama-argento: 1, racconto: 1 }
        sconfitta:
          titolo: Portato via
          testo: |
            Squiggor ride quando lo colpisci, e alla fine sei tu a finire contro
            il cristallo spento, con il sapore del sangue in bocca. Mentre provi a
            rialzarti, due uomini scesi dai tetti trascinano Rennick Dole verso
            Via del Salmone. Rozalia ti sistema il colletto con due dita macchiate
            d'inchiostro. «Era un'offerta semplice» dice, e raggiunge gli altri
            senza voltarsi.
          imposta: { rennick: 2 }
          effetti: { rep.scuri: -0.5, pista.dama-argento: 1 }
      - testo: "Consegnarle Rennick"
        descrizione: "Rozalia ha fatto un'offerta semplice, e gli Scuri pagano chi li aiuta."
        esito:
          titolo: L'offerta di Rozalia
          testo: |
            Rennick viene quando lo chiami, e capisce soltanto al cristallo
            spento, quando Squiggor gli posa una mano sulla spalla, ma non prova a
            scappare. Rozalia ti mette le monete nel palmo una alla volta e ti
            chiude le dita sopra. «Mirko sarà contento, e quando è contento se ne
            ricorda.» Squiggor e Rennick si avviano verso Via del Salmone uno
            accanto all'altro, e Rozalia li segue.
          imposta: { rennick: 2 }
          effetti: { rep.scuri: 2, monete: 15, pista.dama-argento: 1 }
      - testo: "Fare a Squiggor il cenno della Pignatta"
        descrizione: "Anni fa sull'Orlo dei Rottami tu e Squiggor vi siete picchiati, e poi avete fatto tregua."
        immagine: personaggi/squiggor-ironfist
        requisiti: [contatto-ombra >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, intimidire], difficolta: Media }
        successo:
          titolo: Un occhio chiuso
          testo: |
            Ti fermi davanti a Squiggor e gli fai il cenno col mento che vi
            scambiate alla Pignatta, e lui ti guarda per la prima volta. Sull'Orlo
            dei Rottami vi eravate picchiati per venti minuti per un carico di
            cristalli, e poi seduti sul bordo della Cicatrice a guardare il vuoto.
            «Chiudo un occhio» aveva detto allora, e lo ripete adesso. Rozalia
            sospira e ti lascia Rennick per stanotte.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: La tregua è scaduta
          testo: |
            Gli fai il cenno col mento che vi scambiate alla Pignatta, e Squiggor non
            lo restituisce. Tira fuori le mani dalle tasche, e il primo colpo ti
            piega in due, il secondo ti manda contro il cristallo spento. Con la
            guancia sul selciato vedi due uomini scesi dai tetti che portano via
            Rennick Dole verso Via del Salmone, e lui ti cerca con gli occhi finché
            non girano l'angolo.
          imposta: { rennick: 2 }
          effetti: { ferite: 2, rep.scuri: -0.5, pista.dama-argento: 1 }
      - testo: "Ricordare a Squiggor l'Orlo dei Rottami"
        descrizione: "Sull'Orlo dei Rottami tu e Squiggor vi siete contesi a pugni dei cristalli, e nessuno è caduto."
        immagine: personaggi/squiggor-ironfist
        requisiti: [raschiatore >= 1]
        prova: { attributo: fisico, abilita: [atletica, intimidire], difficolta: Media }
        successo:
          titolo: Venti minuti sull'Orlo
          testo: |
            Ti sfili la giacca e la butti sul selciato, e Squiggor capisce prima
            di Rozalia. Sull'Orlo dei Rottami vi siete picchiati per venti minuti
            a un passo dal bordo, e alla fine vi siete seduti con le gambe sul
            vuoto a sputare sangue. «Pari» dice Squiggor toccandosi la benda, e
            Rozalia alza gli occhi al cielo. «Rennick resta tuo per stanotte.
            Squiggor, andiamo.»
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Niente tregua
          testo: |
            Ti sfili la giacca, e Squiggor sorride per la prima volta, con tutti i
            denti che gli sono rimasti, perché stavolta non siete sull'Orlo dei
            Rottami. Il primo colpo ti prende sotto le costole e il secondo ti
            manda contro il cristallo spento. Con la guancia sul selciato vedi due
            uomini scesi dai tetti che portano via Rennick Dole, e Rozalia ti
            getta addosso la giacca passando.
          imposta: { rennick: 2 }
          effetti: { ferite: 2, rep.scuri: -0.5, pista.dama-argento: 1 }
      - testo: "Metterti fra Rennick e Squiggor"
        descrizione: "Stanotte Squiggor riscuote un uomo, e a Ghoran hai visto abbastanza consegne."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza, intimidire], difficolta: Difficile }
        successo:
          titolo: Il muro
          testo: |
            Ti pianti davanti a Rennick a gambe larghe e guardi Squiggor invece di
            Rozalia. Lui ti viene incontro fino a mezzo braccio, e tu resti dove
            sei, con le balestre che ti prudono fra le scapole. Rozalia alza una
            mano senza voltarsi, e Squiggor si ferma. «Bene. Buonanotte, allora.
            Però il conto resta aperto, e Mirko saprà entro un'ora chi ha difeso
            Rennick Dole in Via dei Rasoi.»
          effetti: { rep.scuri: -1, pista.dama-argento: 1 }
        fallimento:
          titolo: Consegnato
          testo: |
            Ti pianti davanti a Rennick a gambe larghe, e Squiggor non si ferma
            nemmeno. Il primo colpo ti piega, il secondo ti manda contro il
            cristallo spento. Con la guancia sul selciato vedi due uomini scesi
            dai tetti che portano via Rennick verso Via del Salmone, senza fretta,
            come una cosa già pagata.
          imposta: { rennick: 2 }
          effetti: { ferite: 2, rep.scuri: -0.5, pista.dama-argento: 1 }
