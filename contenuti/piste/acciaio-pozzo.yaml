# Acciaio e Ira, la coda della pista (pista.acciaio 7 → 8): svuotare il Pozzo dei Sigilli nell'Aula
# dell'Ira una Colata alla volta, la strada per tornare nelle Segrete dall'Acciaieria, e il rito
# dell'acqua benedetta in Cattedrale che spacca la vasca. In fondo, i tre storylet degli Averi legati
# alla pista: il diario di Isvaro, il cilindro di lyssan e la bacchetta della stretta folgorante.
storylet:
  # ------------------------------------------------------------ 7 · la stanza del pozzo (ripetibile)
  - id: svuotare-il-pozzo
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: Svuotare il pozzo
    sommario: "Nell'Aula dell'Ira la vasca triangolare ribolle ancora. Ogni Colata che le strappi la abbassa di un dito."
    luogo: Segrete dell'Ira, l'Aula dell'Ira
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 7, pozzo-dell-ira >= 1]
    testo: |
      Nell'Aula dell'Ira, fredda come nessuna cantina, la vasca triangolare
      ribolle di un liquido arancione che fuma senza scaldare. Intorno alla
      vasca rotonda i teschi stanno in bilico sugli spuntoni, uno con un dente
      d'oro che nessuno ha mai cavato.

      {origine figlio-della-citta-bassa} Sopra di te ci sono i vicoli dove sei
      cresciuto, e ti tornano i brividi delle cantine di quando eri bambino.

      Ogni Colata che la vasca dà a chi la bagna di sangue le costa un po' di
      rabbia, e la tua mano si chiude da sola.
    opzioni:
      - testo: "Bagnare il bordo col tuo sangue e affrontare la Colata"
        descrizione: "Un taglio sul palmo, e il pozzo ti dà una Colata da uccidere prima che arrivi in fondo alle scale."
        combattimento: una-colata
        vittoria:
          immagine: ambientazione/marea-grigia
          titolo: Una di meno
          testo: |
            Ti passi la lama sul palmo e lasci cadere tre gocce sul bordo. Accanto
            a te l'aria si incrina come uno specchio colpito con la nocca, e la
            Colata esce a quattro zampe, con le manine che ha al posto dei denti
            tese verso di te. Quando smette di muoversi si sfa in una pozza grigia
            che evapora sui gradini, e nella vasca il liquido è sceso di un dito.
          effetti: { pozzo-dell-ira: -1 }
        sconfitta:
          titolo: Di nuovo nella vasca
          testo: |
            La Colata ti è addosso prima che tu abbia richiuso il pugno, e le manine
            della bocca ti stringono l'avambraccio. Rotoli giù per i gradini con lei
            sopra e te la scrolli di dosso soltanto in fondo, e quando ti rialzi è
            già scivolata nella vasca. Ti fasci il braccio con un lembo della
            camicia, stringendo il nodo con i denti.
      - testo: "Chiederne due in una volta"
        descrizione: "Un taglio più profondo e due Colate insieme. Svuoti il doppio, se ne esci in piedi."
        requisiti: [pozzo-dell-ira >= 2]
        combattimento: due-colate
        vittoria:
          immagine: ambientazione/marea-grigia
          titolo: Due crepe
          testo: |
            Stavolta il sangue scende sul bordo in un filo, e l'aria si incrina in
            due punti. Le Colate escono insieme e si separano per prenderti in
            mezzo, con un accordo fra loro che quasi ti offende, e la seconda ti
            morde lo stivale fino a bucarlo prima che tu la finisca. Sui gradini
            restano due pozze grigie, e il liquido nella vasca è sceso di due
            dita.
          effetti: { pozzo-dell-ira: -2 }
        sconfitta:
          titolo: Troppe mani
          testo: |
            Le due Colate ti prendono in mezzo, e mentre ti giri verso una l'altra
            ti salta sulla schiena. Arretri alla cieca giù per la scalinata e cadi
            sugli ultimi gradini con un colpo che ti arriva fino ai denti. Quando
            rialzi la testa le vedi calarsi nella vasca una dietro l'altra come in
            un bagno caldo, e il liquido torna al livello di prima.
      - testo: "Disfare la Colata con le parole dell'Albero"
        descrizione: "Una Colata è rabbia di morti che non se ne vanno, e la Liturgia dell'Albero ha parole apposta."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le parole dell'Albero
          testo: |
            Lasci cadere il sangue e cominci la formula prima ancora che l'aria si
            incrini. La Colata esce già piegata in due, e a ogni frase
            dell'Esorcismo perde un po' della sua forma, finché all'ultima parola
            cade sui gradini in una cenere grigia e umida. Nella vasca il liquido
            è sceso di un dito, e a te resta la voce rauca di una notte passata a
            cantare.
          effetti: { pozzo-dell-ira: -1 }
        fallimento:
          titolo: La formula a metà
          testo: |
            A metà della formula ti battono i denti per il gelo, e la parola
            successiva ti esce storta. La Colata ti salta addosso, e quando te la
            togli di dosso a calci torna a infilarsi nella vasca come un gatto
            offeso sotto il letto, lasciandoti un graffio lungo sul collo.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Spegnerla con l'acqua benedetta del Velo"
        descrizione: "Una fiaschetta d'acqua benedetta costa un'offerta in Cattedrale. Va versata sulla Colata mentre nasce, recitando senza perdere il filo."
        requisiti: [monete >= 8]
        prova: { attributo: mentale, abilita: [resilienza, accademiche], difficolta: Media }
        successo:
          titolo: L'acqua sul fuoco
          testo: |
            Con la fiaschetta stappata nella sinistra lasci cadere il sangue, e
            quando l'aria si incrina versi l'acqua nella crepa recitando la
            preghiera del mattino, l'unica che sai a memoria, anche se a metà
            salti sempre lo stesso verso. La Colata esce sfrigolando e si disfa
            prima di toccare terra, e il liquido nella vasca si abbassa di un
            dito.
          effetti: { monete: -8, pozzo-dell-ira: -1 }
        fallimento:
          titolo: La fiaschetta
          testo: |
            La crepa si apre prima del previsto e ti sorprende con la preghiera a
            metà. L'acqua versata troppo presto ti scorre fra le scarpe, e la
            Colata esce asciutta e ti viene addosso finché non la spingi giù per
            la scalinata, da dove risale a scivolare nella vasca. Sul fondo della
            fiaschetta vuota è rimasta una goccia, e per un momento pensi
            seriamente di berla.
          effetti: { monete: -8, ferite: 0.5 }
      - testo: "Lasciare che il pozzo beva la tua rabbia"
        descrizione: "Seduto sul bordo, lasci che il pozzo beva la tua rabbia finché la Colata nasce troppo magra."
        costo: 2
        esito:
          titolo: Quello che ti porti dietro
          testo: |
            Ti siedi sul bordo con le dita nel liquido, e ti tornano in mente la
            faccia di chi ti ha fregato e la porta che ti hanno sbattuto sul naso,
            e scivolano verso il fondo. La Colata che esce è sottile come un ramo
            e cade a pezzi sul primo gradino, e a te resta una stanchezza vuota
            che dura ore.
          effetti: { pozzo-dell-ira: -1, tormento: 1 }

  # ------------------------------------------------------------ 7 · la strada per tornare giù (ripetibile)

  # ------------------------------------------------------------ 7 · la vasca asciutta (si esce dalle Segrete)
  - id: la-vasca-asciutta
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: La vasca asciutta
    sommario: "La vasca triangolare non ha più niente da dare. Resta da distruggerla, e per questo serve il Velo."
    luogo: Segrete dell'Ira, l'Aula dell'Ira
    area: segrete-dell-ira
    requisiti: [pista.acciaio == 7, pozzo-dell-ira == 0]
    testo: |
      Il fondo della vasca triangolare è una crosta arancione che si
      sbriciola sotto le dita. La luce sul soffitto si è spenta, e l'Aula
      dell'Ira è tornata una cantina enorme e fredda, con il dente d'oro
      ancora al suo posto.

      Il pozzo è vuoto ma intero. Sotto la crosta le incisioni a sette punte
      del bordo sono ancora nette, e a passarci il pollice senti un
      formicolio leggero, da gamba addormentata. Per chiuderlo davvero
      servono l'acqua benedetta e qualcuno del Velo che sappia cosa farne.

      {magia Media} È Mana che gira ancora nelle incisioni. Finché la pietra
      resta intera, la vasca sa come si fa a riempirsi.

      {origine accolito-del-velo} In Cattedrale ti hanno insegnato a benedire
      le case nuove e i morti, e mai una vasca che si riempie di rabbia.
    opzioni:
      - testo: "Risalire in città"
        descrizione: "Il tunnel, la caverna, l'Acciaieria fredda. Poi la Cattedrale."
        costo: 0
        esito:
          titolo: Fuori
          testo: |
            Risali la galleria con la lanterna che sbatte contro il fianco. Quando
            esci dalla porta delle consegne dell'Acciaieria è sera, e la strada sa
            di cavolo bollito e di pioggia. Un bambino che passa ti guarda le mani
            sporche di crosta arancione e allunga il passo.
          vai: citta-bassa
  - id: tornare-nelle-segrete
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Di nuovo sotto l'Acciaieria
    sommario: "Il pozzo non è ancora asciutto. Si torna dalla sala di carico e dal tunnel dei contrabbandieri."
    luogo: Acciaieria dei Tarvelin, la sala di carico
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.acciaio == 7, pozzo-dell-ira >= 1]
    testo: |
      Sulla porta delle consegne qualcuno del vicinato ha appeso una corona di
      foglie rosse per gli operai morti. Dentro la fornace è fredda, e dalla
      sala di carico scendi al magazzino, fino al muro di mattoni abbattuto.

      {origine rampollo-dei-quartieri-alti} Ai ricevimenti Ondrel Tarvelin
      stava sempre in disparte nei suoi abiti scuri, e da ragazzino ne avevi
      paura senza sapere perché.

      Di là il tunnel dei contrabbandieri corre per quasi un chilometro fra le
      fondamenta, fino al masso finto e alla caverna degli orchi, e dal buco
      nel muro sale già un filo di freddo.
    opzioni:
      - testo: "Scendere nelle Segrete"
        descrizione: "Il coltello per il palmo, e un chilometro di tunnel con la lanterna in mano."
        esito:
          titolo: La galleria a ovest
          testo: |
            Cammini nel tunnel con la lanterna bassa finché perdi il conto dei
            passi. Nella caverna i giacigli degli orchi puzzano ancora di grasso,
            e la goccia dal soffitto ti cade nel colletto nello stesso punto
            dell'ultima volta. Scavalchi i mattoni del muro abbattuto, e dopo una
            trentina di metri di salita il freddo ti chiude le dita sul manico
            della lanterna.
          vai: segrete-dell-ira

  # ------------------------------------------------------------ 7 → 8 · la vasca che si spacca
  - id: il-pozzo-prosciugato
    presso: cattedrale-del-velo
    immagine: personaggi/padre-vantes
    titolo: Il pozzo prosciugato
    sommario: "La vasca triangolare è asciutta. Per distruggerla serve quello che il Velo ha in abbondanza, e chi sappia usarlo."
    luogo: Cattedrale del Velo, la sagrestia
    area: quartieri-alti
    requisiti: [pista.acciaio == 7, pozzo-dell-ira == 0]
    testo: |
      Padre Aurelio Vantes ti riceve in sagrestia, mentre in un angolo un
      accolito finge di contare le candele. Ti ascolta senza interromperti, e a
      metà del racconto ti posa due dita sul polso e le lascia lì fino alla
      fine.

      {origine accolito-del-velo} Il primo anno le candele della sagrestia le
      contavi anche tu, e l'accolito ti lancia un'occhiata da collega.

      Poi scende nella Cripta e torna dopo il tempo di un vespro con un foglio
      piegato in quattro, in una grafia sottile che non è la sua. In cima c'è
      scritto *Pozzo dei Sigilli*.

      «La Madre dice che una vasca così, quando è vuota, si rompe con l'acqua
      benedetta» spiega. «Va riempita fino all'orlo e fatta bollire per un
      giorno intero, senza che il fuoco cali mai.» Rilegge il foglio. «Un demone
      sotto la Città Bassa, da prima che ci fosse la città. Quando dubiti,
      tocca, dico ai novizi. Stavolta preferirei aver dubitato un po' di più.»

      {empatia Media} Lo dice con leggerezza per te, ma le dita stringono il
      foglio come un corrimano su una scala buia.
    opzioni:
      - testo: "Chiedergli di scendere con te"
        descrizione: "Il sommo sacerdote in un tunnel di contrabbandieri. Bisogna convincerlo che la sua presenza conta più dei suoi barili."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          immagine: ambientazione/cattedrale-del-velo
          titolo: Il fuoco che non cala
          testo: |
            Il giorno dopo Vantes scende nel tunnel con te e quattro accoliti, dietro i carretti
            carichi di barili d'acqua benedetta, e si sporca l'orlo della veste senza farci caso. Per
            un giorno intero tenete alto il fuoco intorno alla vasca mentre lui prega senza mai
            sedersi, finché all'alba la vasca si spacca da un angolo all'altro con un rumore di
            ghiaccio che cede sul fiume.
          pe: { resilienza: 5 }
          effetti: { pista.acciaio: 1, rep.velo: 1, racconto: 1 }
          imposta: { galdrick.via: 0 }
        fallimento:
          titolo: Due novizi
          testo: |
            Vantes scuote la testa con dolcezza e dice che la Cattedrale ha
            bisogno di lui. Ti manda sei barili d'acqua benedetta e due novizi
            magri, e il fuoco intorno alla vasca lo tieni alto tu per un giorno
            intero, finché all'alba la vasca si spacca con un rumore di ghiaccio
            sul fiume. Risalendo, uno dei novizi ti chiede come ti chiami, per
            ricordarti nelle preghiere.
          effetti: { pista.acciaio: 1, tormento: 1, racconto: 1 }
          imposta: { galdrick.via: 0 }
      - testo: "Ricordargli quello che hai fatto per il Velo"
        descrizione: "Al Velo hai già reso più di un favore, e Vantes non ha bisogno di sentirselo dire due volte."
        requisiti: [rep.velo >= 2]
        esito:
          immagine: ambientazione/cattedrale-del-velo
          titolo: In prima persona
          testo: |
            Non hai finito la frase che Vantes chiama l'accolito per far preparare
            i carretti, e all'accolito cadono le candele. Il giorno dopo scendete
            nel tunnel con quattro accoliti e sei barili d'acqua benedetta, e per
            un giorno intero il fuoco non cala mai mentre lui prega in piedi.
            All'alba la vasca si spacca con un rumore di ghiaccio sul fiume.
          pe: { resilienza: 5 }
          effetti: { pista.acciaio: 1, rep.velo: 0.5, racconto: 1 }
          imposta: { galdrick.via: 0 }
      - testo: "Pagare l'acqua e il carbone, e fare da te"
        descrizione: "Un'offerta pesante paga l'acqua benedetta per la vasca e i facchini per il carbone. Al fuoco poi ci stai tu."
        requisiti: [monete >= 25]
        esito:
          titolo: Un giorno intero
          testo: |
            Vantes accetta l'offerta e ti benedice i barili sul sagrato. I
            facchini ti lasciano all'imbocco del tunnel, e la vasca la riempi a
            secchi da solo, poi tieni il fuoco alto per un giorno intero mangiando
            il pane seduto sul carbone. All'alba la vasca si spacca con un rumore
            di ghiaccio sul fiume, e risali con le ciglia bruciacchiate e le gambe
            che non reggono.
          effetti: { monete: -25, pista.acciaio: 1, tormento: 1, racconto: 1 }
          imposta: { galdrick.via: 0 }
      - testo: "Rispondergli con le sue parole"
        descrizione: "«Quando dubiti, tocca», ti ha detto il primo giorno. Stavolta tocca a lui scendere nel tunnel con te."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          immagine: ambientazione/cattedrale-del-velo
          titolo: Quando dubiti
          testo: |
            «Quando dubiti, tocca» gli dici, ed è la prima cosa che ti ha
            insegnato. Vantes sorride con un angolo della bocca, e prima di sera
            Ottilia Sanvel ha già fatto preparare i carretti. Il giorno dopo
            scendete in sei con i barili d'acqua benedetta, e all'alba, dopo un
            giorno di fuoco e preghiere, la vasca si spacca con un rumore di
            ghiaccio sul fiume.
          pe: { resilienza: 5 }
          effetti: { pista.acciaio: 1, rep.velo: 0.5, racconto: 1 }
          imposta: { galdrick.via: 0 }
      - testo: "Parlargli come a un consigliere"
        descrizione: "Vantes siede nel Consiglio, e un demone chiuso dal sommo sacerdote in persona in Municipio pesa parecchio."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          immagine: ambientazione/cattedrale-del-velo
          titolo: Il seggio del Velo
          testo: |
            Gli dici, con le formule dei giorni di consiglio, che in Municipio i
            Castaldi conteranno chi è sceso nel tunnel e chi ha mandato i barili.
            Vantes sorride come un vecchio giocatore che conosce la mossa. Il
            giorno dopo scende con te e quattro accoliti, e all'alba, dopo un
            giorno di fuoco e preghiere, la vasca si spacca con un rumore di
            ghiaccio sul fiume.
          pe: { resilienza: 5 }
          effetti: { pista.acciaio: 1, rep.velo: 1, racconto: 1 }
          imposta: { galdrick.via: 0 }
        fallimento:
          titolo: Un uomo di Stato
          testo: |
            Vantes ti lascia finire e ti toglie le dita dal polso. «Parli bene,
            come parlano bene in Municipio» dice. Ti manda sei barili d'acqua
            benedetta e due novizi, e il fuoco lo tieni alto tu per un giorno
            intero, finché all'alba la pietra si spacca. Risali con la sensazione
            di aver usato il tono giusto con la persona sbagliata.
          effetti: { pista.acciaio: 1, tormento: 1, racconto: 1 }
          imposta: { galdrick.via: 0 }
      - testo: "Dirgli chi abita sopra quella vasca"
        descrizione: "Sopra l'Aula dell'Ira ci sono i vicoli dove sei cresciuto, e Vantes deve sentirlo da te."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          immagine: ambientazione/cattedrale-del-velo
          titolo: Le cantine della Città Bassa
          testo: |
            Gli racconti i vicoli sopra l'Aula, e quando arrivi alla cantina dove
            giocavi tu Vantes chiama l'accolito per i carretti. Il giorno dopo
            scende con te e quattro accoliti, e all'alba, dopo un giorno di fuoco,
            la vasca si spacca con un rumore di ghiaccio sul fiume. Risalendo ti
            chiede il nome della tua via e lo ripete piano, come quello di un
            malato.
          pe: { resilienza: 5 }
          effetti: { pista.acciaio: 1, rep.velo: 1, racconto: 1 }
          imposta: { galdrick.via: 0 }
        fallimento:
          titolo: Troppi nomi
          testo: |
            Cominci dai vicoli e ti perdi nei nomi, finché Vantes ti posa una mano
            sul braccio. Pregherà per ognuno, dice, ma la Cattedrale ha bisogno di
            lui. Ti manda sei barili d'acqua benedetta e due novizi, e il fuoco lo
            tieni alto tu per un giorno intero, finché all'alba la vasca si
            spacca. I vicoli non sapranno mai niente di questa notte.
          effetti: { pista.acciaio: 1, tormento: 1, racconto: 1 }
          imposta: { galdrick.via: 0 }

  # ------------------------------------------------------------ gli Averi: il diario di Isvaro
  - id: leggere-il-diario-di-isvaro
    titolo: Il diario di Isvaro
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/evento-razzia-festival-150
    requisiti: [oggetto.diario-di-isvaro >= 1, pista.acciaio >= 6]
    sommario: "Due dozzine di pagine di pergamena fra mappe di Qir-Azel, ritratti della stessa donna e tre pagine scritte fitte."
    testo: |
      Il diario di Isvaro è un libretto rilegato in pelle, gonfio di umido,
      che sa di fumo. Isvaro scrive in elfico con una grafia stretta e
      disegna molto meglio di come scrive; fra le pagine c'è il foglio con la
      traduzione di Liaren, nella sua grafia larga.

      Metà delle pagine sono mappe di Qir-Azel disegnate a penna, le altre
      ritraggono una donna molto bella, quasi sempre nuda. In mezzo ci sono
      tre pagine scritte fitte, e sul retro della copertina Isvaro ha rifatto
      e sottolineato il conto di una bottiglia di vino.

      {conoscenze-della-strada Facile} Il conto rifatto torna, perché l'oste
      aveva arrotondato a suo favore come si fa in Città Bassa con chi non
      vuole discutere.

      *Uno che fa i conti al vino e intanto disegna la fine di una città.* Lo
      tieni per il bordo, con due dita.
    opzioni:
      - testo: "Guardare le mappe"
        costo: 0
        esito:
          titolo: Quaranta e quattrocento
          testo: |
            Le prime mappe sono piani d'attacco per una banda di quaranta orchi.
            Una, cerchiata due volte, è la razzia del Festival strada per strada,
            con le frecce che partono dall'Acciaieria e dal tunnel dei
            contrabbandieri. Le pagine dopo mostrano un assalto alla città con
            circa quattrocento orchi. Nessuna è cerchiata, e molte sono coperte di
            croci calcate così forte che il pennino ha bucato la pergamena.
      - testo: "Leggere la prima pagina scritta"
        costo: 0
        esito:
          titolo: La bara di Sollen
          testo: |
            *La razzia è andata come doveva. Di quelli di Capomozzo ne sono morti
            pochi, e la bara di Sollen l'abbiamo presa mentre i bifolchi
            guardavano da un'altra parte. Questa città maledetta merita di
            bruciare, e non vedo l'ora che arrivi l'assalto vero*.

            Più sotto Isvaro spiega come ha tenuto zitto suo padre. *Quel bastardo
            terrà la bocca chiusa sull'Acciaieria, o racconto a tutti come si è
            tolto di mezzo la mamma con l'aiuto di Vesh e dei suoi tagliagole. Gli
            ho fatto sparire da Qir-Azel ogni carta su Capomozzo, così guadagniamo
            tempo*.
      - testo: "Leggere la seconda pagina scritta"
        costo: 0
        esito:
          titolo: Il tunnel e il demone
          testo: |
            *Balthog vuole la massa, tutti insieme via terra, e secondo me
            sbaglia. Ci serve il demone. I suoi mostri possono salire per il
            tunnel dei contrabbandieri fino all'Acciaieria di mio padre, e da lì
            colpiamo dal fiume a piccoli gruppi. Sono tutti d'accordo tranne
            Zagrath, e il mezzogre lo fa solo per farmi arrabbiare. La mia Aurenne
            pensa soltanto ai livelli di sotto, e dice che quando avrà liberato il
            Costruttore lo metterà ai suoi ordini*.

            In fondo alla pagina Isvaro ha aggiunto che Garin crede ancora di
            servire il Culto dell'Anonimo, e Kessa comincia a sospettare.
      - testo: "Leggere la terza pagina scritta"
        costo: 0
        esito:
          titolo: La mano nuova
          testo: |
            *La mia amata vuole andare fino in fondo, anche se le dico che è già
            bellissima. Vuole togliersi di dosso quella che chiama la sua
            corruzione celestiale per la grazia della nuova madre, la Regina delle
            Ali Spezzate, e ha cominciato bruciando i resti di suo padre al
            santuario di Capomozzo. La mano nuova non mi piace, e spero che quando
            offrirà Qir-Azel alle fiamme di Nhar'Kael non sia diventata orrenda*.

            Nell'ultimo ritratto la donna ha due ali da pipistrello e una mano
            dalle dita lunghe e nere; gli occhi, come sempre, sono d'inchiostro
            viola.
      - testo: "Chiudere il diario"
        costo: 0
        esito:
          testo: "Richiudi il diario e lo infili in fondo alla bisaccia, sotto il resto, dove non ti tocca la mano quando cerchi altro."

  # ------------------------------------------------------------ gli Averi: il cilindro di lyssan
  - id: il-cilindro-di-lyssan
    titolo: Il cilindro di lyssan
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    # una volta decifrato non si riapre più dagli Averi: lo compra Mattias Crenn in Biblioteca (citta/biblioteca.yaml)
    requisiti: [oggetto.registratore-olografico >= 1, cilindro.decifrato == 0]
    sommario: "Un cilindro inciso preso nelle Segrete dell'Ira, con un rotolo di pergamena dentro. Con la parola giusta, ronza."
    testo: |
      Il cilindro è lungo quanto una mano, di lyssan lavorato con incisioni
      così fini che per seguirle devi avvicinarlo agli occhi. Ha qualche
      ammaccatura, una crepa lungo un fianco e sul bordo i graffi più recenti
      di qualcuno che ha provato ad aprirlo con una punta.

      {tecnologia Media} Le incisioni girano in una spirale senza inizio, come
      le piste di un congegno. Chi l'ha fatto voleva che qualcosa ci corresse
      dentro.

      Si apre svitando la metà superiore. Dentro c'è un rotolo coperto di
      simboli arcani comuni, di quelli che all'Accademia si imparano il primo
      anno, messi in fila senza formare una parola; gli altri rotoli trovati
      con il cilindro sono illeggibili. A tenerlo in mano ti formicolano le
      dita. *Questo coso aspetta che gli si dica qualcosa.* Lo giri fra le
      dita ancora un paio di volte prima di decidere.
    opzioni:
      - testo: "Trovare la parola che lo fa parlare"
        descrizione: "Il cilindro aspetta una parola. Quello che ha dentro lascia il segno, comunque vada."
        prova: { attributo: mentale, abilita: [magia, tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Mostrati
          testo: |
            Lasci il rotolo dentro e richiudi il cilindro, poi pronunci la parola
            che nella lingua dei Precursori vuol dire *mostrati*. Il cilindro
            ronza, e sopra di lui compare un vecchio di luce disturbata in veste
            nera, appoggiato a un bastone d'olmo, che cammina parlando da solo
            fino al bordo del pozzo dell'Aula dell'Ira e ci getta dentro una
            boccetta. In un'altra scena lo vedi parlare con Yoggoth, che sembra
            contento.
          effetti: { tormento: 1, cilindro.decifrato: 1 }
        fallimento:
          titolo: Il ronzio
          testo: |
            Provi la parola in tre modi, ogni volta un po' più forte, come si fa
            con gli stranieri. Al terzo il cilindro ronza, ma sopra di lui si
            accende solo una macchia scura che si allunga verso di te e torna
            indietro. Il ronzio ti resta nei denti tutto il pomeriggio, e la sera
            la macchia la vedi ancora a occhi chiusi.
          effetti: { tormento: 1 }
      - testo: "Portarlo a Mattias Crenn"
        descrizione: "Mattias legge il precuriano da trent'anni, e accetta monete solo per il vino di Ulric."
        requisiti: [monete >= 10]
        esito:
          titolo: Si fa, si fa
          testo: |
            Mattias si pulisce le lenti e dice una parola che non hai mai sentito.
            Sopra il tavolo compare un vecchio di luce disturbata in veste nera,
            appoggiato a un bastone d'olmo, che getta una boccetta nel pozzo
            dell'Aula dell'Ira e poi parla con Yoggoth. «Si fa, si fa» dice
            Mattias, con la voce che trema, e si infila le monete nella manica
            senza contarle.
          effetti: { monete: -10, tormento: 1, cilindro.decifrato: 1 }
      - testo: "Rimetterlo via"
        costo: 0
        esito:
          testo: "Riavviti la metà superiore e rimetti il cilindro nella bisaccia, avvolto in una camicia. Il formicolio alle dita passa dopo un po', e ti accorgi di esserne quasi dispiaciuto."
      - testo: "Leggere i simboli come al primo anno"
        descrizione: "I simboli del rotolo te li hanno fatti copiare cento volte all'Accademia, e forse sono lettere di un'altra lingua."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Mostrati
          testo: |
            Leggi i simboli uno dopo l'altro come suoni, l'esercizio di Temmerin
            del primo anno, e la fila diventa una parola sola nella lingua dei
            Precursori, *mostrati*. Quando la pronunci a cilindro richiuso, sopra
            compare un vecchio di luce disturbata in veste nera, con un bastone
            d'olmo, che getta una boccetta nel pozzo dell'Aula dell'Ira e poi
            parla con Yoggoth.
          effetti: { tormento: 1, cilindro.decifrato: 1 }

  # ------------------------------------------------------------ gli Averi: la bacchetta della stretta folgorante
  - id: decifrare-bacchetta
    titolo: Decifrare la bacchetta
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.bacchetta-della-stretta-folgorante >= 1, decifrato.bacchetta-della-stretta-folgorante == 0]
    sommario: "Capire come funziona un reperto dei Precursori prima che sia lui a capire te."
    testo: |
      La bacchetta è un ferro contorto lungo quanto un avambraccio, con la
      punta biforcuta. Nelle Segrete galleggiava a mezz'aria, e ancora adesso,
      se la posi sul tavolo, una delle due punte si solleva di un capello con
      l'ostinazione di un cane che non vuole sdraiarsi. A tenerla in mano
      senti un formicolio nei denti.

      {armi-da-distanza Media} Una punta biforcuta serve a mirare, e senza
      deciderlo la tieni già lontana dalla faccia e rivolta verso il muro.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: bacchetta-della-stretta-folgorante
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Trovi il punto in cui il ferro è più caldo e ci premi il pollice. Fra
            le due punte salta una scarica nera che si avvolge intorno alla gamba
            della sedia e la lascia annerita in una spirale stretta. La sedia la
            giri contro il muro, dalla parte bruciata, prima che la veda qualcuno.
          effetti: { decifrato.bacchetta-della-stretta-folgorante: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            La scarica ti salta sulla mano e ti blocca le dita intorno al
            ferro per un lungo momento, e quando le riapri hanno un odore
            di temporale. Per tutta la sera, sulle pareti,
            ti sembra di vedere passare dei segni neri che quasi formano
            parole.
          effetti: { tormento: 1 }
