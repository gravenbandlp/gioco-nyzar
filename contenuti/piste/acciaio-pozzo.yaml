# Acciaio e Ira, la coda della pista (pista.acciaio 7 → 8): svuotare il Pozzo dei Sigilli nell'Aula
# dell'Ira una Colata alla volta, la strada per tornare nelle Segrete dall'Acciaieria, e il rito
# dell'acqua benedetta in Cattedrale che spacca la vasca. In fondo, i tre storylet degli Averi legati
# alla pista: il diario di Isvaro, il cilindro di lyssan e la bacchetta della stretta folgorante.
storylet:
  # ------------------------------------------------------------ 7 · la stanza del pozzo (ripetibile)
  - id: svuotare-il-pozzo
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: Svuotare il pozzo
    sommario: "Nell'Aula dell'Ira la vasca triangolare ribolle ancora. Ogni Colata che le strappi la abbassa di un dito."
    luogo: Segrete dell'Ira, l'Aula dell'Ira
    area: segrete-dell-ira
    ripetibile: true
    requisiti: [pista.acciaio == 7, pozzo-dell-ira >= 1]
    testo: |
      L'Aula dell'Ira è alta quanto la navata della Cattedrale e più fredda di
      qualunque cantina, e il fiato ti esce in nuvole davanti alla bocca. In
      cima alle due scalinate di pietra la vasca triangolare ribolle di un
      liquido arancione che fuma senza scaldare niente, e la sua luce si muove
      sul soffitto a scatti. Intorno alla vasca rotonda i teschi levigati
      stanno ancora in bilico sui loro spuntoni. Su uno luccica un dente
      d'oro, e in tutti i secoli passati quaggiù nessuno si è chinato a
      cavarlo.

      {conoscenze-della-strada Facile} In Città Bassa quel dente non sarebbe
      durato una notte. Qui sotto anche i ladri hanno avuto più paura che
      fame.

      {origine figlio-della-citta-bassa} Da qualche parte sopra la tua testa
      ci sono i vicoli dove sei cresciuto, e sotto i vicoli c'era questo. Ci
      hai giocato sopra per anni a piedi scalzi. Adesso ti tornano in mente
      tutte le volte che in cantina ti sei preso un brivido senza motivo.

      La vasca dà Colate a chi la bagna di sangue, e ogni Colata che dà le
      costa un po' della rabbia che tiene dentro. *Se gliene chiedo
      abbastanza, alla fine resterà all'asciutto.* Ti guardi il palmo della
      mano, e la mano si chiude da sola.

      {resilienza Media fallita} Il palmo si ricorda di ogni taglio delle
      volte prima, e ha già deciso per conto suo che stavolta farà più male.
    opzioni:
      - testo: "Bagnare il bordo col tuo sangue e affrontare la Colata"
        descrizione: "Un taglio sul palmo, e il pozzo ti dà una Colata. Va uccisa prima che arrivi in fondo alle scale."
        combattimento: una-colata
        vittoria:
          immagine: ambientazione/marea-grigia
          titolo: Una di meno
          testo: |
            Ti passi la lama sul palmo e lasci cadere tre gocce sul bordo
            della vasca. Il liquido si increspa, e accanto a te l'aria si
            incrina come uno specchio colpito con la nocca. La Colata esce
            dalla crepa a quattro zampe, con le gambe piegate all'indietro, e
            le manine che ha al posto dei denti si aprono e si chiudono verso
            di te, con un'impazienza quasi infantile.

            Quando smette di muoversi si sfa in una pozza grigia che evapora
            sui gradini. Nella vasca il liquido è sceso di un dito, e sul
            soffitto la luce adesso arriva a scatti più radi. Ti porti il
            palmo tagliato alla bocca senza pensarci, un vizio che hai da
            quando eri bambino.
          effetti: { pozzo-dell-ira: -1 }
        sconfitta:
          titolo: Di nuovo nella vasca
          testo: |
            La Colata ti è addosso prima che tu abbia richiuso il pugno, e le
            manine della bocca ti si stringono intorno all'avambraccio con una
            presa fredda e ostinata. Rotoli giù per i gradini con lei sopra e riesci a
            scrollartela di dosso soltanto in fondo, contro il cerchio dei
            teschi, e uno ti rotola accanto e si ferma con la faccia a terra.

            Quando ti rialzi è già risalita fino alla vasca e ci si lascia
            scivolare dentro senza un rumore. Il liquido torna al livello di
            prima. Ti fasci il braccio con un lembo della camicia, stringendo
            il nodo con i denti.

            {medicina Facile} I segni delle manine sono piccoli e regolari, due
            file come il morso di un bambino. Sanguinano poco, e la pelle
            intorno è già bianca di freddo, cosa che ti piace ancora meno.
      - testo: "Chiederne due in una volta"
        descrizione: "Un taglio più profondo, e il pozzo te ne dà due insieme. Svuoti il doppio, se ne esci in piedi."
        requisiti: [pozzo-dell-ira >= 2]
        combattimento: due-colate
        vittoria:
          immagine: ambientazione/marea-grigia
          titolo: Due crepe
          testo: |
            Stavolta il sangue scende sul bordo in un filo, e l'aria si
            incrina in due punti, uno per lato della vasca. Le Colate escono
            insieme e si separano subito per prenderti in mezzo, con un
            accordo fra loro che quasi ti offende. Con la prima ti difendi a
            malapena, mentre la seconda ti morde lo stivale fino a bucarlo.

            Alla fine sui gradini restano due pozze grigie che fumano nel
            gelo. Il liquido nella vasca è sceso di due dita, e il rombo sordo
            che saliva dal fondo adesso lo senti soltanto se resti fermo
            e zitto. Dal buco nello stivale entra il freddo, e muovi le dita del
            piede una per una per assicurarti che ci siano ancora tutte.
          effetti: { pozzo-dell-ira: -2 }
        sconfitta:
          titolo: Troppe mani
          testo: |
            Le due Colate ti prendono in mezzo come avevi temuto, e mentre ti
            giri verso una l'altra ti salta sulla schiena. Arretri giù per la
            scalinata alla cieca e cadi di schiena sugli ultimi tre gradini,
            con un colpo che ti senti fin dentro i denti.

            Quando trovi la forza di alzare la testa le vedi risalire piano
            una dietro l'altra e calarsi nella vasca come in un bagno caldo.
            Il liquido è al livello di prima, e dal tuo braccio il sangue
            gocciola sulla pietra a una goccia per volta, abbastanza piano
            perché il gelo la rapprenda prima che si allarghi.
      - testo: "Disfare la Colata con le parole dell'Albero"
        descrizione: "La Liturgia dell'Albero ha parole per ciò che non dovrebbe restare, e una Colata è fatta della rabbia di morti che non se ne sono andati."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le parole dell'Albero
          testo: |
            Lasci cadere il sangue e cominci la formula prima ancora che
            l'aria si incrini. La Colata esce dalla crepa già piegata in due,
            con le manine della bocca che si torcono verso di te, e a ogni
            frase dell'Esorcismo perde un po' della sua forma. All'ultima
            parola cade sui gradini in una cenere grigia e umida.

            {magia Media} Il Mana della formula ti torna indietro dalla vasca
            più debole di come è partito. Laggiù c'è meno rabbia a fargli da
            muro.

            Nella vasca il liquido è sceso di un dito. Hai la gola secca e la
            voce rauca, come dopo una notte passata a cantare.
          effetti: { pozzo-dell-ira: -1 }
        fallimento:
          titolo: La formula a metà
          testo: |
            A metà della formula ti manca il fiato per il gelo, e la parola
            successiva ti esce storta. La Colata se ne accorge prima di te e
            ti salta addosso. Te la togli di dosso a calci, e lei torna a
            infilarsi nella vasca come un gatto offeso sotto il letto.

            Il pozzo è al livello di prima. Tu hai un graffio lungo sul collo,
            e mentre te lo tamponi con la manica la formula giusta ti torna in
            mente parola per parola, con la puntualità delle risposte che
            arrivano a esame finito.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Spegnerla con l'acqua benedetta del Velo"
        descrizione: "Una fiaschetta d'acqua benedetta costa un'offerta in Cattedrale. Va versata sulla Colata mentre nasce, recitando senza perdere il filo."
        requisiti: [monete >= 8]
        prova: { attributo: mentale, abilita: [resilienza, accademiche], difficolta: Media }
        successo:
          titolo: L'acqua sul fuoco
          testo: |
            Tieni la fiaschetta stappata nella mano sinistra e con la destra
            lasci cadere il sangue. Quando l'aria si incrina versi l'acqua
            dentro la crepa, e intanto reciti la preghiera del mattino,
            l'unica che sai tutta a memoria, anche se a metà salti sempre lo
            stesso verso. La Colata esce sfrigolando, e si disfa prima di aver
            toccato terra.

            Il liquido nella vasca si abbassa di un dito. Sulla pietra resta
            una macchia scura che sa di ferro bagnato, e tu ti accorgi che
            stavi ancora recitando.
          effetti: { monete: -8, pozzo-dell-ira: -1 }
        fallimento:
          titolo: La fiaschetta
          testo: |
            La crepa si apre più in fretta di quanto pensavi, e ti sorprende
            con la preghiera a metà. Versi l'acqua troppo presto sulla pietra
            nuda, e la guardi scorrere fra le tue scarpe verso il basso. La
            Colata esce dalla crepa asciutta e ti viene addosso, e te ne liberi
            soltanto spingendola giù per la scalinata.

            Lei torna su e scivola nella vasca. La fiaschetta vuota ti è
            rotolata fra i piedi, con il tappo di sughero ancora legato al
            collo con lo spago. Sul fondo è rimasta una goccia, e per un
            momento pensi seriamente di berla.
          effetti: { monete: -8, ferite: 0.5 }
      - testo: "Lasciare che il pozzo beva la tua rabbia"
        descrizione: "Senza lame e senza preghiere. Ti siedi sul bordo e lasci che il pozzo si prenda la rabbia che ti porti dietro, finché la Colata che ne nasce è troppo magra per stare in piedi."
        costo: 2
        esito:
          titolo: Quello che ti porti dietro
          testo: |
            Ti siedi sul bordo della vasca con le mani sulle ginocchia e ci
            metti dentro le dita. Il freddo ti sale fino alle spalle. Poi
            cominciano a tornarti in mente le cose, una dopo l'altra, la
            faccia di chi ti ha fregato e la porta che ti hanno sbattuto sul
            naso, e ogni volta qualcosa ti scivola via dalle dita verso il
            fondo.

            {empatia Media fallita} Che qualcuna di quelle porte l'avessi
            sbattuta tu, sul momento, non ti passa per la testa. La vasca beve
            in fretta e non fa domande.

            La Colata che esce dalla crepa è sottile come un ramo e cade a
            pezzi sul primo gradino. Il liquido è sceso di un dito, e ti resta
            addosso una stanchezza vuota che ci mette ore ad andarsene.
          effetti: { pozzo-dell-ira: -1, tormento: 0.5 }

  # ------------------------------------------------------------ 7 · la strada per tornare giù (ripetibile)

  # ------------------------------------------------------------ 7 · la vasca asciutta (si esce dalle Segrete)
  - id: la-vasca-asciutta
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: La vasca asciutta
    sommario: "La vasca triangolare non ha più niente da dare. Resta da distruggerla, e per questo serve il Velo."
    luogo: Segrete dell'Ira, l'Aula dell'Ira
    area: segrete-dell-ira
    requisiti: [pista.acciaio == 7, pozzo-dell-ira == 0]
    testo: |
      Il fondo della vasca triangolare è una crosta arancione che si
      sbriciola sotto le dita, tiepida come la cenere del giorno prima, e del
      sangue che ci è colato dentro in tutti questi giorni, e di qualunque
      cosa ci sia caduta, non resta traccia. La luce sul soffitto si è
      spenta, e senza quella l'Aula dell'Ira torna a essere una cantina
      enorme e fredda, con una fila di teschi in bilico che nessuno guarda
      più. Il dente d'oro, a cercarlo, è ancora al suo posto.

      {resistenza Facile} Le ginocchia ti ricordano quanti giorni hai
      passato su questi gradini. Ti rialzi in due tempi, con una mano sul
      bordo e l'altra sulla schiena.

      Il pozzo è vuoto ma intero. Sul bordo, sotto la crosta, le incisioni a
      sette punte sono ancora nette, e quando ci passi sopra il pollice senti
      un formicolio leggero, quello di una gamba addormentata. Per chiuderlo
      davvero servono l'acqua benedetta e qualcuno del Velo che sappia cosa
      farne.

      {magia Media} Il formicolio è Mana che gira ancora nelle incisioni,
      piano, senza più niente da muovere. Finché la pietra resta intera, la
      vasca sa ancora come si fa a riempirsi.

      {origine accolito-del-velo} In Cattedrale ti hanno insegnato la
      benedizione delle case nuove e quella dei morti. Per una vasca che si
      riempie di rabbia non te ne hanno insegnata nessuna, e ti chiedi se
      in Cripta, sotto l'altare, qualcuno ne conosca una.
    opzioni:
      - testo: "Risalire in città"
        descrizione: "Il tunnel, la caverna, l'Acciaieria fredda. Poi la Cattedrale."
        costo: 0
        esito:
          titolo: Fuori
          testo: |
            Risali la galleria senza fretta, con la lanterna che sbatte contro
            il fianco. Quando esci dalla porta delle consegne dell'Acciaieria in
            Città Bassa è sera, e l'aria della strada sa di cavolo bollito e di
            pioggia. Ti fermi un momento sul gradino a godertela, e un bambino
            che passa ti guarda le mani sporche di crosta arancione e allunga
            il passo.
          vai: citta-bassa
  - id: tornare-nelle-segrete
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Di nuovo sotto l'Acciaieria
    sommario: "Il pozzo nell'Aula dell'Ira non è ancora asciutto. La strada per tornarci passa dalla sala di carico e dal tunnel dei contrabbandieri."
    luogo: Acciaieria dei Tarvelin, la sala di carico
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.acciaio == 7, pozzo-dell-ira >= 1]
    testo: |
      Sulla porta delle consegne qualcuno del vicinato ha appeso una corona di
      foglie rosse per gli operai morti, e il vento l'ha già girata di
      traverso. Dentro l'Acciaieria la fornace è fredda, e la sala di carico
      odora ancora di ferro e di olio da macchine. Attraversi la sala, dove
      la cassaforte è ancora spalancata sul pavimento, e scendi le scale fino
      al magazzino di sotto, al muro di mattoni abbattuto.

      {politica-ed-economia Media} Ogni giorno di fornace spenta è un giorno
      di commesse perse per i Tarvelin. In città ci sarà già chi si offre di
      comprare il carbone avanzato a metà prezzo, per gentilezza.

      {origine rampollo-dei-quartieri-alti} Ai ricevimenti dei Quartieri Alti
      Ondrel Tarvelin restava sempre negli stessi abiti scuri, e parlava
      poco. Da ragazzino avevi paura di lui senza sapere perché, e qui, con
      la sua fornace fredda, ti sembra di capirlo un po' meglio.

      Da lì il tunnel dei contrabbandieri corre fra le fondamenta della città
      per quasi un chilometro, fino al masso finto e alla caverna con i
      giacigli degli orchi. Anche da qui, quando l'aria gira, sale dal buco
      nel muro un filo di freddo che sa di pietra bagnata. Ti tiri su
      il bavero prima ancora di sentirlo sul collo.

      {resistenza Facile fallita} Il corpo si ricorda del freddo dell'Aula
      prima di te, e comincia a tremare con un anticipo che non ti fa
      onore.
    opzioni:
      - testo: "Scendere nelle Segrete"
        descrizione: "Il coltello per il palmo, e un chilometro di tunnel con la lanterna in mano."
        esito:
          titolo: La galleria a ovest
          testo: |
            Cammini nel tunnel con la lanterna bassa, contando i passi finché
            ne perdi il conto. Nella caverna i giacigli degli orchi puzzano
            ancora di grasso e di fumo, e dal soffitto ti cade una goccia nel
            colletto, nello stesso punto dell'ultima volta. Ormai la aspetti,
            e ti stringi nelle spalle un attimo prima che arrivi. Imbocchi la
            galleria a ovest, scavalchi i mattoni del muro abbattuto, e dopo
            una trentina di metri di salita il freddo ti chiude le dita
            intorno al manico della lanterna.
          vai: segrete-dell-ira

  # ------------------------------------------------------------ 7 → 8 · la vasca che si spacca
  - id: il-pozzo-prosciugato
    presso: cattedrale-del-velo
    immagine: personaggi/padre-vantes
    titolo: Il pozzo prosciugato
    sommario: "Nell'Aula dell'Ira la vasca triangolare è asciutta. Per distruggerla serve quello che il Velo ha in abbondanza, e qualcuno che sappia come usarlo."
    luogo: Cattedrale del Velo, la sagrestia
    area: quartieri-alti
    requisiti: [pista.acciaio == 7, pozzo-dell-ira == 0]
    testo: |
      Padre Aurelio Vantes ti riceve in sagrestia fra due armadi di paramenti,
      con un accolito che finge di contare le candele in un angolo e ha già
      perso il conto almeno tre volte. Ti ascolta senza interromperti. Gli
      racconti dell'Aula dell'Ira e della vasca triangolare, e a metà
      racconto ti posa due dita sul polso e le lascia lì fino alla fine,
      leggere. Ti accorgi di parlare più piano.

      {medicina Facile} Due dita sul polso, nel punto dove si conta il
      battito. Vantes ascolta il tuo cuore più delle tue parole, e quando
      arrivi alle Colate il cuore glielo racconta prima di te.

      {origine accolito-del-velo} Le candele della sagrestia le hai contate
      anche tu nel primo anno, e perdevi il conto ogni volta che qualcuno
      entrava a parlare con Vantes. L'accolito nell'angolo ti lancia
      un'occhiata da collega e ricomincia da uno.

      Quando hai finito resta zitto a lungo. Poi si alza, ti chiede di
      aspettare e scende nella Cripta. Torna dopo il tempo di un vespro con un
      foglio piegato in quattro, scritto in una grafia sottile che non è la
      sua. In cima al foglio c'è scritto *Pozzo dei Sigilli*.

      «La Madre dice che quando è vuota una vasca così si rompe con l'acqua
      benedetta» spiega. «Va riempita fino all'orlo e fatta bollire per un
      giorno intero, senza che il fuoco cali mai. La pietra a un certo punto
      cede.» Rilegge il foglio, come per assicurarsi di averlo capito bene.
      «Un demone sotto la Città Bassa, da prima che ci fosse la città. Quando
      dubiti, tocca, dico ai novizi. Stavolta preferirei aver dubitato un po'
      di più.»

      {empatia Media} Lo dice con leggerezza, perché tu ti senta meglio. Le dita
      sul foglio però non sono leggere, e stringono la carta come si stringe
      un corrimano su una scala buia.

      *Un giorno intero accanto a quella vasca, al freddo.* Ti tornano in
      mente le mani piccole della Colata, e ti strofini il polso dove Vantes
      ti ha posato le dita.
    opzioni:
      - testo: "Chiedergli di scendere con te"
        descrizione: "Il sommo sacerdote in un tunnel di contrabbandieri. Bisogna convincerlo che la sua presenza conta più dei suoi barili."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          immagine: ambientazione/cattedrale-del-velo
          titolo: Il fuoco che non cala
          testo: |
            Il giorno dopo Vantes scende con te insieme a quattro accoliti, e
            dietro di voi i carretti portano sei barili d'acqua benedetta. Nel
            tunnel si sporca l'orlo della veste e non ci fa caso, e quando un
            accolito si offre di tenergliela sollevata lo rimanda avanti con un
            gesto della mano. Riempite la vasca a secchi e accendete il carbone tutto intorno, e per un
            giorno intero vi date il cambio a tenere alto il fuoco mentre lui
            prega a voce bassa, senza mai sedersi.

            All'alba del giorno dopo la vasca si spacca da un angolo all'altro
            con un rumore di ghiaccio che cede sul fiume. L'acqua scende nella
            crepa e sparisce. Nell'Aula il gelo se ne va, e Vantes ti stringe
            il polso più forte del solito.
          pe: { resilienza: 5 }
          effetti: { pista.acciaio: 1, rep.velo: 1, racconto: 1 }
          imposta: { galdrick.via: 0 }
        fallimento:
          titolo: Due novizi
          testo: |
            Vantes ti ascolta, poi scuote la testa con dolcezza. Dice che la
            Cattedrale ha bisogno di lui, e che di questi tempi in sagrestia
            non lo può sostituire nessuno. Ti manda sei barili d'acqua
            benedetta e due novizi magri che tremano dal primo passo nel
            tunnel e ti chiedono due volte se gli orchi della caverna sono
            morti davvero. Il fuoco intorno alla vasca lo tieni alto tu, per un
            giorno intero, mentre loro due pregano accucciati sulla scalinata.

            All'alba del giorno dopo la vasca si spacca da un angolo all'altro
            con un rumore di ghiaccio sul fiume, e l'acqua sparisce nella
            crepa. Risali con le mani nere di carbone e la schiena a pezzi, e
            sulle scale uno dei novizi ti chiede come ti chiami, per
            ricordarti nelle preghiere. Glielo dici, e lui se lo ripete
            sottovoce fino in cima per paura di dimenticarlo.
          effetti: { pista.acciaio: 1, tormento: 0.5, racconto: 1 }
          imposta: { galdrick.via: 0 }
      - testo: "Ricordargli quello che hai fatto per il Velo"
        descrizione: "Al Velo hai già reso più di un favore. Vantes lo sa, e non ha bisogno di sentirselo dire due volte."
        requisiti: [rep.velo >= 2]
        esito:
          immagine: ambientazione/cattedrale-del-velo
          titolo: In prima persona
          testo: |
            Non fai in tempo a finire la frase che Vantes ha già chiamato
            l'accolito dall'angolo per far preparare i carretti, e l'accolito
            lascia cadere le candele che stava fingendo di contare. Il giorno
            dopo scende nel tunnel insieme a te e a quattro accoliti, che
            spingono i carretti con sei barili d'acqua benedetta. Per un
            giorno intero il fuoco intorno alla vasca non cala mai, e lui
            prega in piedi senza sedersi.

            All'alba del giorno dopo la vasca si spacca da un angolo all'altro
            con un rumore di ghiaccio sul fiume. L'acqua scende nella crepa, e
            dall'Aula il gelo se ne va. Risalendo Vantes ti tiene una mano
            sulla spalla per tutto il tunnel.
          pe: { resilienza: 5 }
          effetti: { pista.acciaio: 1, rep.velo: 0.5, racconto: 1 }
          imposta: { galdrick.via: 0 }
      - testo: "Pagare l'acqua e il carbone, e fare da te"
        descrizione: "Un'offerta pesante in Cattedrale paga sei barili d'acqua benedetta e il carbone, più due facchini con i carretti. Al fuoco poi ci stai tu."
        requisiti: [monete >= 25]
        esito:
          titolo: Un giorno intero
          testo: |
            Vantes accetta l'offerta e ti benedice i barili uno per uno sul
            sagrato, con la pazienza di un oste che conta le botti in
            cantina. I due facchini ti lasciano all'imbocco del tunnel e non
            vogliono sapere dove porta. Riempi la vasca a secchi da solo, e
            per un giorno intero tieni il fuoco alto, mangiando il pane seduto
            sul carbone per non perdere tempo.

            All'alba del giorno dopo la vasca si spacca da un angolo all'altro
            con un rumore di ghiaccio sul fiume, e l'acqua sparisce nella
            crepa. Risali con le ciglia bruciacchiate e le gambe che non
            reggono, e ti fermi a dormire contro il muro del magazzino, con il
            bavero tirato sulla faccia e il carbone ancora sotto le unghie.
          effetti: { monete: -25, pista.acciaio: 1, tormento: 0.5, racconto: 1 }
          imposta: { galdrick.via: 0 }
      - testo: "Rispondergli con le sue parole"
        descrizione: "«Quando dubiti, tocca», ti ha detto il primo giorno, con le tue mani fra le sue. Stavolta tocca a lui scendere nel tunnel con te."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          immagine: ambientazione/cattedrale-del-velo
          titolo: Quando dubiti
          testo: |
            «Quando dubiti, tocca» gli dici. È la prima cosa che ti ha
            insegnato, il giorno che sei entrato in Cattedrale con le scarpe
            nuove che ti stringevano. Vantes ti guarda a lungo, con l'aria di
            un maestro che si è appena sentito citare e non sa se esserne fiero
            o preoccupato. Poi sorride con un angolo della bocca e chiama
            l'accolito dall'angolo. Prima di
            sera Ottilia Sanvel ha già fatto preparare i carretti.

            Il giorno dopo scendete nel tunnel in sei, con sei barili d'acqua
            benedetta. Per un giorno intero tu e gli altri accoliti vi date il
            cambio al fuoco, e Vantes prega in piedi accanto a voi senza mai
            sedersi. All'alba la vasca si spacca da un angolo all'altro con un
            rumore di ghiaccio che cede sul fiume, e l'acqua sparisce nella
            crepa.
          pe: { resilienza: 5 }
          effetti: { pista.acciaio: 1, rep.velo: 0.5, racconto: 1 }
          imposta: { galdrick.via: 0 }
      - testo: "Parlargli come a un consigliere"
        descrizione: "Vantes siede anche nel Consiglio. Un demone sotto la Città Bassa, chiuso dal sommo sacerdote in persona, in Municipio pesa più di sei barili d'acqua, e nei salotti dei Quartieri Alti si impara presto a dirlo con garbo."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          immagine: ambientazione/cattedrale-del-velo
          titolo: Il seggio del Velo
          testo: |
            Gli parli a voce bassa, con le formule dei giorni di consiglio. Gli
            dici che in Municipio i Castaldi conteranno chi è sceso nel
            tunnel e chi ha mandato i barili, e che il Velo ha tutto da
            guadagnare a esserci con la veste sporca di carbone. Vantes ti
            ascolta con le dita ancora sul tuo polso, e alla fine sorride con
            un angolo della bocca, come un vecchio giocatore davanti a una
            mossa che conosceva.

            Il giorno dopo scende nel tunnel insieme a te e a quattro
            accoliti, e dietro di voi i carretti portano sei barili d'acqua
            benedetta. Per un giorno intero vi date il cambio a tenere alto il
            fuoco intorno alla vasca mentre lui prega senza mai sedersi.
            All'alba la vasca si spacca da un angolo all'altro con un rumore di
            ghiaccio che cede sul fiume, e l'acqua sparisce nella crepa.
          pe: { resilienza: 5 }
          effetti: { pista.acciaio: 1, rep.velo: 1, racconto: 1 }
          imposta: { galdrick.via: 0 }
        fallimento:
          titolo: Un uomo di Stato
          testo: |
            Vantes ti lascia finire, poi ti toglie le dita dal polso. «Parli
            bene» dice, «come parlano bene in Municipio.» Ti manda sei barili
            d'acqua benedetta e due novizi magri, che nel tunnel tremano dal
            primo passo. Il fuoco intorno alla vasca lo tieni alto tu, per un
            giorno intero, mentre loro pregano accucciati sulla scalinata.

            All'alba la vasca si spacca da un angolo all'altro con un rumore di
            ghiaccio sul fiume, e l'acqua sparisce nella crepa. Risali con le
            mani nere di carbone e la sensazione di aver usato il tono giusto
            con la persona sbagliata.
          effetti: { pista.acciaio: 1, tormento: 0.5, racconto: 1 }
          imposta: { galdrick.via: 0 }
      - testo: "Dirgli chi abita sopra quella vasca"
        descrizione: "Sopra l'Aula dell'Ira ci sono i vicoli dove sei cresciuto, con le cantine dove giocano i bambini. Vantes deve sentirlo da uno che ci ha dormito sopra."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          immagine: ambientazione/cattedrale-del-velo
          titolo: Le cantine della Città Bassa
          testo: |
            Gli racconti dei vicoli sopra l'Aula, uno per uno, con i nomi che
            si usano laggiù e non quelli delle mappe, e delle cantine dove i
            bambini vanno a giocare quando piove. Vantes ascolta con gli occhi
            chiusi. Quando arrivi alla cantina dove giocavi tu li riapre, e
            chiama l'accolito dall'angolo per far preparare i carretti.

            Il giorno dopo scende nel tunnel insieme a te e a quattro accoliti,
            con sei barili d'acqua benedetta sui carretti, e per un giorno
            intero il fuoco
            intorno alla vasca non cala mai. All'alba la vasca si spacca da un
            angolo all'altro con un rumore di ghiaccio che cede sul fiume.
            Risalendo, Vantes ti chiede il nome della tua via, e lo ripete
            piano come si ripete il nome di un malato da ricordare.
          pe: { resilienza: 5 }
          effetti: { pista.acciaio: 1, rep.velo: 1, racconto: 1 }
          imposta: { galdrick.via: 0 }
        fallimento:
          titolo: Troppi nomi
          testo: |
            Cominci dai vicoli e ti perdi nei nomi, uno dopo l'altro, finché
            Vantes ti posa una mano sul braccio per fermarti. Dice che pregherà
            per ognuno di quei vicoli, e che la Cattedrale ha bisogno di lui.
            Ti manda sei barili d'acqua benedetta e due novizi magri che nel
            tunnel ti chiedono due volte se gli orchi della caverna sono morti
            davvero. Il fuoco lo tieni alto tu, per un giorno intero.

            All'alba la vasca si spacca da un angolo all'altro con un rumore di
            ghiaccio sul fiume, e l'acqua sparisce nella crepa. Risali con le
            mani nere di carbone, e i vicoli sopra la tua testa non sapranno
            mai niente di questa notte.
          effetti: { pista.acciaio: 1, tormento: 0.5, racconto: 1 }
          imposta: { galdrick.via: 0 }

  # ------------------------------------------------------------ gli Averi: il diario di Isvaro
  - id: leggere-il-diario-di-isvaro
    titolo: Il diario di Isvaro
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/evento-razzia-festival-150
    requisiti: [oggetto.diario-di-isvaro >= 1, pista.acciaio >= 6]
    sommario: "Due dozzine di pagine di pergamena fra mappe di Qir-Azel, ritratti della stessa donna e tre pagine scritte fitte."
    testo: |
      Il diario di Isvaro è un libretto rilegato in pelle, gonfio di umido,
      con gli angoli delle pagine piegati a orecchia. Ha ancora l'odore della
      fornace, e quando lo apri ti torna in gola il fumo dell'Acciaieria.
      Isvaro scrive in elfico, con una grafia stretta e inclinata, fitta come
      se risparmiasse carta, e disegna molto meglio di come scrive. Fra le
      pagine c'è il foglio piegato in quattro dove Liaren ti ha scritto la
      traduzione, con una grafia larga che sale verso il bordo.

      {accademiche Media fallita} Ti pare di ricordare che l'elfico si legge
      partendo dalle vocali, o forse era il nanico. Per il resto, meno male
      che c'è il foglio di Liaren.

      Metà delle pagine sono mappe di Qir-Azel disegnate a penna con frecce e
      numeri. Le altre sono ritratti di una donna giovane e molto bella. È
      sempre la stessa, e quasi sempre è senza vestiti. Fra le mappe e i
      ritratti ci sono tre pagine scritte fitte. Sul retro della copertina c'è
      il conto di una bottiglia di vino che Isvaro ha rifatto e sottolineato,
      perché l'oste gli aveva chiesto qualche moneta di troppo.

      {conoscenze-della-strada Facile} Il conto rifatto torna. L'oste aveva
      arrotondato a suo favore, come fanno gli osti della Città Bassa con
      chiunque abbia l'aria di non voler discutere.

      *Uno che fa i conti al vino e intanto disegna la fine di una città.* Ti
      accorgi di tenere il diario per il bordo con due dita, e lo sistemi
      meglio sulle ginocchia.
    opzioni:
      - testo: "Guardare le mappe"
        costo: 0
        esito:
          titolo: Quaranta e quattrocento
          testo: |
            Le prime mappe sono piani d'attacco per una banda di quaranta
            orchi. Una è cerchiata due volte, ed è la razzia del Festival,
            strada per strada, con le frecce che partono dall'Acciaieria e dal
            tunnel dei contrabbandieri. La piazza del Festival la riconosci
            anche senza leggere il nome, e Isvaro ci ha disegnato perfino i
            pali delle bandierine, uno per uno.

            Le pagine dopo sono peggio. Mostrano un assalto alla città con una
            forza di circa quattrocento orchi. Nessuna di queste mappe è
            cerchiata, e molte sono coperte di scarabocchi e di croci calcate
            così forte che il pennino ha bucato la pergamena.

            {empatia Media} Le croci le ha fatte un uomo che non riusciva a far
            tornare i conti e se la prendeva con la pergamena. Le mappe piccole
            gli venivano, quelle grandi lo facevano arrabbiare.
      - testo: "Leggere la prima pagina scritta"
        costo: 0
        esito:
          titolo: La bara di Sollen
          testo: |
            *La razzia è andata come doveva. Di quelli di Capomozzo ne sono
            morti pochi, e la bara di Sollen l'abbiamo presa senza fatica
            mentre i bifolchi guardavano da un'altra parte. Questa città
            maledetta merita di bruciare, e non vedo l'ora che arrivi
            l'assalto vero*.

            Più sotto Isvaro spiega come ha tenuto zitto suo padre. *Quel
            bastardo terrà la bocca chiusa sull'Acciaieria, o racconto a tutti
            come si è tolto di mezzo la mamma con l'aiuto di Vesh e dei suoi
            tagliagole. Gli ho fatto anche sparire da Qir-Azel ogni carta che
            parli di Capomozzo, così guadagniamo tempo*.

            Ti accorgi di aver stretto il diario fino a piegarne la copertina,
            e la lisci sul ginocchio con il palmo, senza riuscire a
            raddrizzarla.
      - testo: "Leggere la seconda pagina scritta"
        costo: 0
        esito:
          titolo: Il tunnel e il demone
          testo: |
            *Balthog vuole la massa, tutti insieme via terra. Secondo me
            sbaglia. Ci serve l'aiuto del demone. I suoi mostri possono salire
            da sotto per il tunnel dei contrabbandieri fino all'Acciaieria di
            mio padre, e da lì colpiamo dal fiume a piccoli gruppi, dove
            serve. Sono tutti d'accordo tranne Zagrath, e il mezzogre lo fa
            solo per farmi arrabbiare. La mia Aurenne pensa soltanto ai
            livelli di sotto. Dice che quando avrà liberato il Costruttore lo
            metterà ai suoi ordini, e allora non dovremo più stare attenti a
            niente*.

            In fondo alla pagina, più piccolo, Isvaro ha aggiunto che Garin
            crede ancora di servire il Culto dell'Anonimo, e che invece Kessa
            comincia a sospettare qualcosa. Rileggi la riga due volte, con il
            dito sotto le parole come quando imparavi a leggere.
      - testo: "Leggere la terza pagina scritta"
        costo: 0
        esito:
          titolo: La mano nuova
          testo: |
            *La mia amata vuole andare fino in fondo, e niente di quello che
            le dico la convince che è già bellissima. Vuole togliersi di dosso
            quella che chiama la sua corruzione celestiale e metterci al posto
            la grazia della sua nuova madre, la Regina delle Ali Spezzate. Ha
            cominciato bruciando i resti di suo padre al santuario di
            Capomozzo. Lo ammetto, la mano nuova non mi piace per niente.
            Spero che quando offrirà Qir-Azel alle fiamme di Nhar'Kael non sia
            diventata così orrenda. Del resto anche le succubi sono demoni*.

            Nell'ultimo ritratto la donna ha una mano con le dita lunghe e
            nere posata sul ventre, e dalle scapole le escono due ali da
            pipistrello. Gli occhi, come in tutti gli altri ritratti, sono
            l'unica cosa colorata, di un inchiostro viola.

            {empatia Media} La mano nera l'ha disegnata con la stessa cura delle
            ciglia. Gli fa orrore e la ritrae lo stesso, perché lei per lui
            resta la cosa più bella che abbia mai visto.
      - testo: "Chiudere il diario"
        costo: 0
        esito:
          testo: "Richiudi il diario e lo infili in fondo alla bisaccia, sotto il resto, dove non ti tocca la mano quando cerchi altro."

  # ------------------------------------------------------------ gli Averi: il cilindro di lyssan
  - id: il-cilindro-di-lyssan
    titolo: Il cilindro di lyssan
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    # una volta decifrato non si riapre più dagli Averi: lo compra Mattias Crenn in Biblioteca (citta/biblioteca.yaml)
    requisiti: [oggetto.registratore-olografico >= 1, cilindro.decifrato == 0]
    sommario: "Un cilindro inciso che stava nelle Segrete dell'Ira, con un rotolo di pergamena dentro. Se gli dai la parola giusta, ronza."
    testo: |
      Il cilindro è lungo quanto una mano, di lyssan lavorato con incisioni
      così fini che per seguirle devi avvicinarlo agli occhi. Ha diverse
      ammaccature e una crepa che corre lungo un fianco. Qualcuno ha provato
      ad aprirlo con qualcosa di appuntito, e i graffi sul bordo sono più
      nuovi delle incisioni di parecchi secoli.

      {tecnologia Media} Le incisioni girano intorno al cilindro in una
      spirale continua, senza un punto da cui partire, come le piste di un
      congegno. Chi l'ha fatto voleva che qualcosa ci corresse dentro.

      Si apre svitando la metà superiore. Dentro c'è un rotolo di pergamena
      coperto di simboli arcani comuni, di quelli che si imparano il primo
      anno all'Accademia, messi in fila senza formare una parola. Gli altri
      rotoli che stavano insieme al cilindro sono sbiaditi e illeggibili, e
      uno ti si è sbriciolato fra le dita appena hai provato a srotolarlo.

      Tenendolo in mano senti le dita formicolare, e il lyssan sotto i
      polpastrelli cambia colore di un niente, dall'azzurro al grigio. *Questo
      coso aspetta che gli si dica qualcosa.* Lo giri fra le dita ancora un
      paio di volte prima di decidere.

      {resilienza Facile} Il formicolio ti piace meno di quanto dovrebbe
      piacerti un oggetto. Lo posi sul tavolo, giusto per vedere se hai
      ancora voglia di riprenderlo in mano, e ce l'hai.
    opzioni:
      - testo: "Trovare la parola che lo fa parlare"
        descrizione: "Una prova di Mentale. Servono la Magia o la Tecnologia, oppure le Accademiche. Quello che ha dentro lascia il segno, comunque vada."
        prova: { attributo: mentale, abilita: [magia, tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Mostrati
          testo: |
            Capisci che il rotolo va lasciato dentro e il cilindro richiuso, e
            che la parola è quella che nella lingua dei Precursori vuol dire
            *mostrati*. Il cilindro comincia a ronzare, e sopra di lui compare
            un uomo fatto di luce disturbata, con la barba grigia e una veste
            nera, che si appoggia a un bastone d'olmo. Cammina verso il bordo
            del pozzo dell'Aula dell'Ira parlando da solo, come se discutesse
            con qualcuno, ma non si sente niente. Sospira, tira fuori una
            boccetta da sotto il mantello e la getta nel pozzo.

            Poi l'immagine si sfoca. Lo vedi voltarsi con un sorriso
            soddisfatto, e in un'altra scena parlare con Yoggoth, che sembra
            contento. Il ronzio si interrompe di colpo, e ti resta un fischio
            nelle orecchie che dura finché non bevi un bicchiere d'acqua.
          effetti: { tormento: 0.5, cilindro.decifrato: 1 }
        fallimento:
          titolo: Il ronzio
          testo: |
            Provi la parola in tre modi diversi, ogni volta un po' più forte,
            come si fa con gli stranieri. Al terzo il cilindro ronza, e
            sopra di lui si accende una luce che non diventa mai un'immagine,
            una macchia scura che si allunga verso di te e torna indietro. Il
            ronzio ti entra nei denti e ci resta per tutto il pomeriggio, e la
            sera, quando chiudi gli occhi, la macchia è ancora lì.
          effetti: { tormento: 0.5 }
      - testo: "Portarlo a Mattias Crenn"
        descrizione: "Al primo piano della Biblioteca Mattias legge il precuriano da trent'anni. Per sé non vuole niente. Le monete per il vino di Ulric, invece, le accetta sempre."
        requisiti: [monete >= 10]
        esito:
          titolo: Si fa, si fa
          testo: |
            Mattias si pulisce le lenti sulla manica e gira il cilindro fra le
            dita senza dire niente. Poi lo apre e lo richiude, e a mezza voce
            dice una parola che non hai mai sentito. Sopra il tavolo compare
            un uomo fatto di luce disturbata, con una veste nera e un bastone
            d'olmo, che getta una boccetta nel pozzo dell'Aula dell'Ira e poi
            parla con Yoggoth.

            Quando il ronzio finisce, Mattias resta a guardare il tavolo
            vuoto, con le lenti in mano e senza rimetterle. «Si fa, si fa» dice
            alla fine, con la voce che gli trema, e si infila le monete nella
            manica senza contarle.
          effetti: { monete: -10, tormento: 0.5, cilindro.decifrato: 1 }
      - testo: "Rimetterlo via"
        costo: 0
        esito:
          testo: "Riavviti la metà superiore e rimetti il cilindro nella bisaccia, avvolto in una camicia. Il formicolio alle dita passa dopo un po', e ti accorgi di esserne quasi dispiaciuto."
      - testo: "Leggere i simboli come al primo anno"
        descrizione: "I simboli del rotolo sono quelli che all'Accademia ti hanno fatto copiare cento volte il primo anno. Messi in fila così non dicono niente, a meno che non siano le lettere di una parola che non è la tua."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Mostrati
          testo: |
            Al primo anno Temmerin vi faceva copiare i simboli comuni finché
            non vi venivano senza pensarci, e poi vi chiedeva di leggerli come
            suoni, uno dopo l'altro. Lo fai adesso, a mezza voce, con il dito
            sul rotolo. La fila diventa una parola sola nella lingua dei
            Precursori, quella che vuol dire *mostrati*. Rimetti il rotolo
            nel cilindro e lo richiudi, poi la pronunci.

            Il cilindro ronza, e sopra di lui compare un uomo fatto di luce
            disturbata, con la barba grigia e una veste nera, appoggiato a un
            bastone d'olmo. Cammina verso il bordo del pozzo dell'Aula dell'Ira
            parlando da solo, poi tira fuori una boccetta da sotto il mantello
            e la getta nel pozzo. In un'altra scena parla con Yoggoth, che
            sembra contento. Il ronzio si interrompe di colpo, e ti resta un
            fischio nelle orecchie che dura finché non bevi un bicchiere
            d'acqua.
          effetti: { tormento: 0.5, cilindro.decifrato: 1 }

  # ------------------------------------------------------------ gli Averi: la bacchetta della stretta folgorante
  - id: decifrare-bacchetta
    titolo: Decifrare la bacchetta
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.bacchetta-della-stretta-folgorante >= 1, decifrato.bacchetta-della-stretta-folgorante == 0]
    sommario: "Capire come funziona un reperto dei Precursori prima che sia lui a capire te."
    testo: |
      La bacchetta è un ferro contorto lungo quanto un avambraccio, che
      finisce con una punta biforcuta. Nella camera delle Segrete dove l'hai
      trovata galleggiava a mezz'aria, e ancora adesso, se la posi sul tavolo,
      una delle due punte si solleva di un capello, con l'ostinazione di un
      cane che non vuole sdraiarsi. A tenerla in mano senti un formicolio nei
      denti, e ti viene voglia di stringerli.

      {armi-da-distanza Media} Una punta biforcuta serve a mirare. Senza
      deciderlo, la tieni già lontana dalla faccia e rivolta verso il muro.

      {tecnologia Difficile} Il ferro non è contorto per caso. Le curve
      tornano su se stesse a intervalli uguali, e chi l'ha piegato così
      sapeva dove voleva che la forza girasse prima di uscire.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: bacchetta-della-stretta-folgorante
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Trovi il punto in cui il ferro è più caldo e ci premi il pollice.
            Fra le due punte salta una scarica nera che si avvolge intorno
            alla gamba della sedia, e la lascia annerita in una spirale
            stretta. Il formicolio ti sale fino al gomito e poi passa. La sedia
            la giri contro il muro, dalla parte bruciata, prima che la veda
            qualcuno.
          effetti: { decifrato.bacchetta-della-stretta-folgorante: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            La scarica ti salta sulla mano e ti blocca le dita intorno al
            ferro per un lungo momento, e quando le riapri hanno un odore
            di temporale. Per tutta la sera, sulle pareti,
            ti sembra di vedere passare dei segni neri che quasi formano
            parole.
          effetti: { tormento: 0.5 }
