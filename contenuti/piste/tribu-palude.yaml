# Le cinque tribù, la spedizione nella Palude Acquanera (pista.tribu 2 → 3).
# Si parte dalla Città Bassa con la mappa di Ilvaena. Nella palude le stanze vanno in ordine, secondo
# la profondità: 0 si entra (la nebbia sul canneto o il fango fra i canali), 1-2 il cuore della palude
# (il fango, i serpenti, le tracce), 2-3 gli Spacca-ossa (l'orco nella tagliola, la riva; i serpenti
# stanno ovunque fino a 3), 4 l'isolotto della torre. Poi una carta e il cuore nella torre di Bolgrum,
# che riporta in città in ogni ramo e imposta `bolgrum` (1 morto, 2 fuggito; quality definita in
# tribu.yaml). Una stanza superata non ricompare nella stessa visita (src/motore/spedizioni.ts).
aree:
  - id: palude-acquanera
    immagine: ambientazione/palude-acquanera
    nome: Palude Acquanera
    sommario: "Tre miglia di canali e di acqua nera a sud della città, dove vivono gli Spacca-ossa."
    spedizione: { ritorno: superficie-fratturata, soglia: 5, stanze: 3 }
    testo: |
      La Palude Acquanera comincia qualche ora a sud di Qir-Azel, oltre i
      campi abbandonati delle vecchie colonie. Qui un fiume senza nome si
      sfilaccia in un delta di canali e di isolette di fango coperte di
      giunchi, e la nebbia resta sull'acqua nera fino a mezzogiorno.

      Gli Spacca-ossa sono una quindicina, gli unici orchi della regione che
      nuotano bene, e aspettano invece di inseguire. Bolgrum, il capotribù,
      sta in una torre di pietra su un isolotto al centro, costruita da un
      mago molto prima che ci arrivassero loro.

storylet:
  # ------------------------------------------------------------ 2 · la partenza (apre la spedizione)
  - id: verso-la-palude-acquanera
    immagine: ambientazione/palude-acquanera
    titolo: Verso la Palude Acquanera
    sommario: "La palude degli Spacca-ossa è qualche ora a sud. In tasca hai la mappa di Ilvaena."
    luogo: Superficie Fratturata, la pianura a sud della città
    area: superficie-fratturata
    presso: pianura-del-sud
    requisiti: [pista.tribu == 2]
    testo: |
      All'uscita sud della Città Bassa comincia una pianura d'erba gialla.
      Sull'ultimo muro qualcuno ha scritto con la calce *ACQUA BUONA A DESTRA*,
      e a destra c'è un pozzo chiuso da una tavola inchiodata.

      {origine figlio-della-citta-bassa} Da bambino, ai forestieri che
      chiedevano dell'acqua, indicavi la destra insieme agli altri.

      In tasca hai la mappa che Ilvaena ti ha disegnato sul retro del conto, con
      il fiume senza nome e una croce dove sta la torre. «Segui il fiume finché
      diventa fango» ti ha detto, «poi cerca la torre, l'unica cosa dritta della
      palude.»

      {empatia Media} Ha piegato quel foglio con troppa cura. Della palude sa
      più di quanto ti ha disegnato.
    opzioni:
      - testo: "Partire a piedi verso sud"
        descrizione: "Qualche ora di pianura, e il fango comincia prima della palude."
        costo: 1
        esito:
          titolo: I campi delle colonie
          testo: |
            Cammini tutta la mattina fra campi che nessuno ara da anni, e passi
            accanto a una casa di coloni senza tetto con una scarpa da bambino
            appesa alla porta. Dopo i pini il terreno comincia a cedere sotto gli
            stivali, e il fiume senza nome entra nella nebbia e non ne esce.
          vai: palude-acquanera
      - testo: "Andare a sud sul baio"
        descrizione: "Il baio taglia la pianura al trotto. Nella palude però non ci entra."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il baio si ferma
          testo: |
            Il baio attraversa la pianura al trotto, e a metà mattina sei già sotto
            i pini. Dove il terreno comincia a cedere pianta gli zoccoli e non va
            avanti. Lo leghi a un pino con la corda lunga e gli lasci il fieno
            della bisaccia, e lui ti guarda andare senza smettere di masticare.
          vai: palude-acquanera
      - testo: "Seguire gli aironi fino all'acqua"
        descrizione: "Al Circolo si impara che gli uccelli d'acqua conoscono la strada più corta. Basta guardare dove scendono."
        quando: [origine.figlio-del-circolo >= 1]
        costo: 0
        esito:
          titolo: Gli aironi
          testo: |
            Al Circolo ti hanno insegnato a guardare dove scendono gli aironi, e
            dietro la fila che passa diretta a sud tagli dritto per i campi
            incolti. Arrivi sotto i pini molto prima di quanto dicesse la mappa di
            Ilvaena. Dove il terreno comincia a cedere, gli aironi sono già fermi
            nella nebbia su una zampa sola.
          vai: palude-acquanera
      - testo: "Chiedere la strada ai pellai del Mercato dei Nodi"
        descrizione: "I pellai che mettono le tagliole nella palude conoscono la strada, e a uno della Gilda la dicono."
        quando: [origine.mercante-dei-ponti >= 1]
        costo: 1
        esito:
          titolo: La strada dei pellai
          testo: |
            Al Mercato dei Nodi il pellaio guarda la tua licenza prima della tua
            faccia, poi ti dice che i suoi uomini entrano nella palude dalla fila
            dei pioppi a levante. In cambio ti fa promettere che, se trovi una sua
            tagliola con dentro qualcosa, quel qualcosa è suo. Lungo i pioppi,
            dove il terreno comincia a cedere, trovi un palo con una tacca fresca.
          pe: { conoscenze-della-strada: 2 }
          vai: palude-acquanera

  # ------------------------------------------------------------ le stanze (ripetibili, tre a caso)
  - id: palude-nebbia-sul-canneto
    immagine: ambientazione/palude-acquanera
    titolo: La nebbia sul canneto
    sommario: "La nebbia sale dall'acqua e ti chiude dentro il canneto. Da qualche parte suona un barattolo di latta."
    luogo: Palude Acquanera, il canneto
    area: palude-acquanera
    ripetibile: true
    requisiti: [pista.tribu == 2, profondita.palude-acquanera == 0]
    testo: |
      La nebbia si alza dall'acqua tutta insieme e in pochi minuti ti chiude
      dentro il canneto, dove i rumori arrivano senza direzione. Su un palo
      fra le canne tintinna un barattolo di latta con dentro un sasso, il
      campanello di un pescatore di anguille. Del pescatore resta soltanto
      il palo.

      {furtivita Media} Nella nebbia chi sta fermo vince. Se qualcuno si
      muove fra le canne lo senti prima tu, purché tu non sia quello che si
      muove.
    opzioni:
      - testo: "Fermarti e ascoltare il fiume"
        descrizione: "La corrente fa un rumore diverso dall'acqua ferma, se hai la pazienza di sentirlo."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La corrente
          testo: |
            Resti fermo con l'acqua alle caviglie finché, sotto il tintinnio del
            barattolo, senti un gorgoglio basso verso sinistra. È il fiume. Lo
            segui tenendolo sempre dallo stesso lato, e quando la nebbia si apre
            sei più avanti di quanto speravi.
          effetti: { profondita.palude-acquanera: 1 }
        fallimento:
          titolo: Il barattolo
          testo: |
            Ascolti finché il barattolo smette di suonare, anche se il vento non è
            cambiato. Quando riprende a tintinnare sei di nuovo davanti al palo da
            cui eri partito, e non ricordi di aver camminato in cerchio.
          effetti: { tormento: 1 }
      - testo: "Andare dritto finché il fondo regge"
        descrizione: "Le gambe non vedono niente. Sentono però dove il fango è duro."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Dritto
          testo: |
            Tasti il fondo con il piede prima di caricarci il peso, e dove cede giri
            intorno. Quando esci dal canneto hai le cosce che bruciano e i giunchi
            ti hanno tagliato il dorso delle mani, ma davanti c'è un isolotto di
            terra ferma.
          effetti: { profondita.palude-acquanera: 1 }
        fallimento:
          titolo: Il canale
          testo: |
            Il fondo regge per venti passi, e al ventunesimo sparisce. Vai sotto
            fino al collo in un canale che nella nebbia non avevi visto, e ti tiri
            fuori aggrappato alle canne, che ti tagliano i palmi. Risali sulla
            riva da cui eri entrato a sputare acqua nera.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che la nebbia si alzi"
        descrizione: "Prima o poi si alza. Nel frattempo l'acqua è fredda e le zanzare non aspettano."
        costo: 2
        esito:
          titolo: L'attesa
          testo: |
            Ti siedi su una zolla appena più alta del resto e aspetti. La nebbia ci mette quasi tutta la
            mattina ad alzarsi, e le zanzare ti trovano anche dentro le maniche. Quando finalmente rivedi i
            pioppi hai i denti che battono, ma la strada è lì davanti.
          effetti: { profondita.palude-acquanera: 1, ferite: 0.5 }

  - id: palude-il-fango
    immagine: ambientazione/palude-acquanera
    titolo: Il fango che risucchia
    sommario: "Fra due canali c'è una striscia di fango color fegato, e sopra l'acqua un velo che luccica come olio."
    luogo: Palude Acquanera, fra due canali
    area: palude-acquanera
    ripetibile: true
    requisiti: [pista.tribu == 2, profondita.palude-acquanera <= 1]
    testo: |
      Fra due canali si apre una distesa di fango lucido color fegato, che
      bisogna attraversare per forza. Le pozze hanno sopra un velo d'olio
      viola e verde, e quando ti chini senti in bocca un sapore di ferro. A
      metà c'è una ruota di carro piantata fino al mozzo, con un raggio sì e
      uno no dipinto d'azzurro, e accanto la testa di un castoro morto senza
      una mosca sopra.

      {magia Media} Nel velo c'è un filo di Mana storto, venuto a galla da
      sotto il fango, e la punta della lingua ti formicola.
    opzioni:
      - testo: "Saltare da una zolla all'altra"
        descrizione: "Dove crescono le felci c'è qualcosa sotto che regge, e fra una felce e l'altra c'è un salto."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Le felci
          testo: |
            Salti da un ciuffo di felci al successivo, e ogni volta il fango fa un
            risucchio offeso e ti lascia andare. Passi accanto alla ruota azzurra
            senza guardare il castoro, e dall'altra parte ti aspetta un sentiero di
            radici di tasso.
          effetti: { profondita.palude-acquanera: 1 }
        fallimento:
          titolo: Il risucchio
          testo: |
            Al terzo salto la zolla affonda e il fango ti prende fino alle cosce,
            e più ti muovi più tira. Ne esci strisciando sulla pancia fino alla
            ruota, e lo stivale rimasto giù lo recuperi scavando con le mani.
          effetti: { ferite: 0.5 }
      - testo: "Leggere il fango prima di metterci il piede"
        descrizione: "Il fango che regge ha un colore diverso, se sai cosa guardare."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il colore giusto
          testo: |
            Il fango scuro è quello che beve, e quello grigio, con le crepe in
            superficie, è asciutto sotto. Segui il grigio passo dopo passo lontano
            dalle pozze e arrivi dall'altra parte con gli stivali appena sporchi e
            una certa soddisfazione da maestro di scuola.
          effetti: { profondita.palude-acquanera: 1 }
        fallimento:
          titolo: Il castoro
          testo: |
            Il grigio ti porta dritto accanto al castoro morto, che da vicino ha gli
            occhi aperti e lucidi e il pelo che si muove senza vento. Torni indietro
            di corsa, e non sai più quale fango hai calpestato all'andata.
          effetti: { tormento: 1 }
      - testo: "Attraversare dritto, con l'acqua alla cintola"
        descrizione: "È la strada più corta. L'acqua con il velo d'olio però ti resta addosso."
        costo: 2
        esito:
          titolo: Il velo
          testo: |
            Attraversi la pozza più larga con l'acqua alla cintola e il velo
            colorato che ti si stringe intorno ai fianchi, più caldo di quanto
            dovrebbe. Esci dall'altra parte con la pelle che pizzica, e il sapore di
            ferro ti resta in bocca fino a sera.
          effetti: { profondita.palude-acquanera: 1, contaminazione: 1 }

  - id: palude-serpenti-d-acqua
    immagine: ambientazione/palude-acquanera
    titolo: I serpenti d'acqua
    sommario: "Il canale da guadare è pieno di serpenti d'acqua, attorcigliati sulle radici di un pioppo."
    luogo: Palude Acquanera, il guado del pioppo
    area: palude-acquanera
    ripetibile: true
    requisiti: [pista.tribu == 2, profondita.palude-acquanera >= 1, profondita.palude-acquanera <= 3]
    testo: |
      Il canale qui è largo una decina di passi e non c'è modo di girarci
      intorno. Sulle radici di un pioppo in mezzo all'acqua stanno
      attorcigliati almeno una dozzina di serpenti scuri, e un ramo grosso
      attraversa il canale basso sopra di loro. In una nassa rovesciata sulla
      riva dorme un serpente più grosso degli altri, che si è trovato una
      casa e non ha intenzione di pagare l'affitto.

      {natura Difficile} Quasi tutte le teste sono tonde. Le due a punta di
      lancia stanno in alto, dove si scalda meglio chi ha veleno da
      conservare.
    opzioni:
      - testo: "Passare sopra, sui rami del pioppo"
        descrizione: "Un ramo grosso attraversa il canale, a un palmo dall'acqua. E dai serpenti."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Il ramo
          testo: |
            Avanzi a cavalcioni del ramo spingendoti con le mani, piano, senza far
            vibrare il legno. Sotto di te i serpenti alzano la testa uno dopo l'altro e
            la riabbassano. Scendi dall'altra parte con le braccia indolenzite e ti
            allontani dall'acqua prima di voltarti a guardare.
          effetti: { profondita.palude-acquanera: 1 }
        fallimento:
          titolo: Il morso
          testo: |
            A metà del ramo il legno scricchiola, una mano ti finisce in acqua e il
            morso arriva subito, sul polso. Torni indietro con il polso che si
            gonfia e un fazzoletto stretto sopra. Il serpente non era velenoso, e lo
            capisci soltanto un'ora dopo.
          effetti: { ferite: 0.5 }
      - testo: "Capire quali sono pericolosi"
        descrizione: "Non tutti i serpenti d'acqua mordono, e non tutti quelli che mordono avvelenano."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Le teste tonde
          testo: |
            Quasi tutti hanno la testa tonda, bisce che mangiano rane e scappano
            davanti a un uomo. Due soli hanno la testa a punta di lancia, sulla
            radice più alta. Guadi dal lato opposto battendo l'acqua con un
            bastone, e le bisce ti si aprono davanti come gente in una piazza.
          effetti: { profondita.palude-acquanera: 1 }
        fallimento:
          titolo: Tutti uguali
          testo: |
            Più li guardi e più si assomigliano. Entri in acqua lo stesso, e a metà
            guado qualcosa di liscio ti si avvolge intorno al polpaccio. Torni a
            riva così di corsa che non ti accorgi di aver perso il bastone.
          effetti: { tormento: 1 }
      - testo: "Risalire il canale fino a dove si stringe"
        descrizione: "Mezz'ora di fango più a monte, e l'acqua si passa con un salto."
        costo: 2
        esito:
          titolo: A monte
          testo: |
            Risali la riva nel fango fino alla vita, fra canne che ti tagliano le
            guance, finché il canale si stringe abbastanza da saltarlo. Scivoli
            sull'altra sponda e sbatti il ginocchio su una radice, ma i serpenti
            non si accorgono nemmeno di te.
          effetti: { profondita.palude-acquanera: 1, ferite: 0.5 }

  - id: palude-le-tracce
    immagine: fazioni/tribu-spacca-ossa
    titolo: Le tracce degli Spacca-ossa
    sommario: "Su un isolotto ci sono impronte larghe che escono dall'acqua, e un mucchio di ossa spaccate per il midollo."
    luogo: Palude Acquanera, un isolotto di fango
    area: palude-acquanera
    ripetibile: true
    requisiti: [pista.tribu == 2, profondita.palude-acquanera >= 1, profondita.palude-acquanera <= 2]
    testo: |
      Sull'isolotto ci sono impronte larghe a dita aperte che escono dall'acqua e ci
      rientrano. Accanto a un fuoco spento ci sono ossa di cervo spaccate per il
      midollo, e in mezzo un pesce di legno morsicato su tutta la coda. *Anche gli
      orchi hanno bambini che mordono le cose.* Ti asciughi le mani sui calzoni e ti
      guardi intorno.

      {origine figlio-del-circolo} Le dita premute in fondo e il tallone appena
      segnato sono di chi spinge sul fango per nuotare più che per camminare.

      {natura Media} Le orme che escono dall'acqua sono più fresche di quelle che ci
      rientrano.
    opzioni:
      - testo: "Seguire le impronte"
        descrizione: "Le impronte che entrano in acqua escono da qualche altra parte."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Dove escono
          testo: |
            Girando l'isolotto trovi dove escono le impronte, su un banco di sabbia
            dall'altra parte del canale. Da lì una pista di canne spezzate porta
            verso il centro della palude, e le orme sono molto più larghe del tuo
            stivale.
          effetti: { profondita.palude-acquanera: 1 }
        fallimento:
          titolo: Le orme vecchie
          testo: |
            Segui le impronte per un'ora prima di accorgerti che sono vecchie di
            giorni e girano intorno a una pozza da pesca. Torni all'isolotto con le
            gambe pesanti, e il pesce di legno fra le ossa ti sembra girato
            dall'altra parte.
          effetti: { tormento: 1 }
      - testo: "Nasconderti nell'acqua e aspettare che passi qualcuno"
        descrizione: "Gli Spacca-ossa tornano sempre al fuoco. Bisogna resistere al freddo finché arrivano."
        prova: { attributo: fisico, abilita: [furtivita, resistenza], difficolta: Media }
        successo:
          titolo: Il pescatore
          testo: |
            Resti fra le canne con l'acqua al petto per quasi un'ora. Poi un orco
            esce dall'acqua senza un rumore, con tre pesci infilati sulla fiocina.
            Scava nel fuoco spento e soffia su una brace ancora viva con la
            delicatezza che useresti per un pulcino. Quando si rituffa lo segui da
            lontano, lungo la riva, fino a vedere dove va.
          effetti: { profondita.palude-acquanera: 1 }
        fallimento:
          titolo: Il freddo
          testo: |
            Dopo un'ora i denti ti battono così forte che devi stringerli fra le
            dita. Esci dall'acqua prima che arrivi qualcuno e ti strofini le braccia
            finché la pelle torna rossa, e l'isolotto resta deserto.
          effetti: { ferite: 0.5 }
      - testo: "Andare dove vanno le ossa"
        descrizione: "Le ossa spaccate segnano la strada. Seguirle è lento, e non è piacevole."
        costo: 2
        esito:
          titolo: Il sentiero delle ossa
          testo: |
            Lungo la riva, ogni tanto, c'è un osso spaccato buttato via dopo averlo
            succhiato. Li segui per tutta la mattina, e verso la fine ci sono anche
            ossa non di cervo, che eviti di guardare da vicino finché arrivi dove
            volevi.
          effetti: { profondita.palude-acquanera: 1, tormento: 1 }

  - id: palude-l-orco-nella-tagliola
    immagine: fazioni/tribu-spacca-ossa
    titolo: L'orco nella tagliola
    sommario: "Un giovane orco ha la gamba presa in una tagliola da castori. Sa dov'è la tana di Bolgrum."
    luogo: Palude Acquanera, sotto un tasso
    area: palude-acquanera
    ripetibile: true
    requisiti: [pista.tribu == 2, profondita.palude-acquanera >= 2, profondita.palude-acquanera <= 3]
    testo: |
      Sotto un tasso c'è un orco giovane e magro con la gamba sinistra presa
      in una tagliola da castori, inchiodata a una radice. La lancia gli è
      caduta a due passi, e il fango intorno è scavato dove ha provato ad
      arrivarci. Sulla tagliola c'è ancora il cartellino di un mercante di
      pelli della città.

      {origine fuggiasco-di-ghoran} Di catene, a Ghoran, ne hai viste
      abbastanza per sapere che cosa vuol dire quel fango scavato.

      «Tu no Spacca-ossa» dice in una lingua comune storta, scoprendo i
      denti. «Tu carne o tu niente?»
    opzioni:
      - testo: "Mettergli paura"
        descrizione: "È ferito e ha già paura. Basta dargliene ancora un po'."
        prova: { attributo: sociale, abilita: [intimidire, ingannare], difficolta: Media }
        successo:
          titolo: Bolgrum pesa
          testo: |
            Calci la lancia nel canale e ti accucci davanti a lui, e l'orco si
            schiaccia contro il tronco. «Torre. Isolotto in mezzo, dove acqua è più
            nera» dice in fretta. «Bolgrum pesa tutti, con gli occhi. Chi pesa poco,
            Skarr mangia.» Lo lasci nella tagliola, e lui ti chiama dietro finché
            non sei fra le canne.
          effetti: { profondita.palude-acquanera: 1, informazioni.voce: 1 }
        fallimento:
          titolo: I denti
          testo: |
            Ti avvicini troppo, e l'orco ti salta addosso per quanto glielo concede
            la catena. I denti ti prendono l'avambraccio e non lo mollano finché non
            gli dai un pugno sul naso, e da quel momento non dice più una parola.
          effetti: { ferite: 0.5 }
      - testo: "Aprire la tagliola, e poi chiedere"
        descrizione: "Prima la gamba. Le domande dopo, se si fida."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La gamba libera
          testo: |
            Gli fai vedere le mani vuote e apri la tagliola con il piede. L'orco
            tira fuori la gamba e resta seduto a guardarti. «Bolgrum pesa tutti»
            dice alla fine. «Tu peso strano. Torre è in mezzo, dove acqua è più
            nera. Bolgrum sta sempre seduto, Skarr cammina dappertutto.» Poi
            scivola nel canale senza un rumore e non riemerge dove ti aspettavi.
          effetti: { profondita.palude-acquanera: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il tonfo
          testo: |
            La tagliola si apre, e l'orco è in acqua prima che tu abbia finito la
            prima domanda. Riemerge in mezzo al canale, ti guarda a lungo e
            sparisce, e ti resta la sensazione precisa che adesso qualcuno sappia
            dove sei.
          effetti: { tormento: 1 }
      - testo: "Liberarlo e seguirlo da lontano"
        descrizione: "Un orco ferito torna a casa. Basta stargli dietro, e sperare che non se ne accorga."
        costo: 2
        esito:
          titolo: Dietro di lui
          testo: |
            Apri la tagliola e ti fai indietro. L'orco zoppica fino all'acqua e tu
            gli vai dietro nel fango per tutta la mattina. A un certo punto si gira,
            e ti tocca restare immobile in un canale fino al collo finché non
            riparte. Quando lo perdi di vista sei molto più dentro la palude.
          effetti: { profondita.palude-acquanera: 1, ferite: 0.5 }

  - id: palude-la-riva-degli-spacca-ossa
    immagine: fazioni/tribu-spacca-ossa
    titolo: La riva degli Spacca-ossa
    sommario: "L'unica striscia di terra ferma corre lungo un canale. Le rane smettono di cantare, e dall'acqua spuntano due teste."
    luogo: Palude Acquanera, la riva lunga
    area: palude-acquanera
    ripetibile: true
    requisiti: [pista.tribu == 2, profondita.palude-acquanera == 3]
    testo: |
      L'unica striscia di terra ferma corre lungo un canale largo e lento, e a
      un certo punto ti accorgi che le rane hanno smesso di cantare. In mezzo
      al canale spuntano due teste di orco fino agli occhi, che non si
      avvicinano e non si allontanano. Sulla riva, in fondo a una fila di
      pesci messi a seccare, è appeso con la stessa cura un calzino di lana da
      uomo.

      {armi-da-distanza Media} Sono appena fuori dal tiro di un sasso e dentro
      quello di una lancia, e il punto l'hanno scelto con cura.
    opzioni:
      - testo: "Andare avanti e affrontarli"
        descrizione: "Se escono dall'acqua, li aspetti sulla terra ferma. Sono due, e nel fango sono a casa loro."
        combattimento: spacca-ossa-nel-fango
        vittoria:
          titolo: Sulla riva
          testo: |
            Escono dall'acqua tutti e due insieme, con le lance basse. Il primo
            scivola nel fango proprio quando gli arrivi addosso, e il secondo,
            vistolo cadere, si rituffa nel canale senza un rumore. Dopo un po' le
            rane ricominciano a cantare, e tu riprendi la riva con le gambe molli.
          effetti: { profondita.palude-acquanera: 1 }
        sconfitta:
          titolo: Nell'acqua
          testo: |
            Uno ti prende alle gambe e ti tira giù nel canale. Ti ritrovi a riva
            più indietro, aggrappato alle canne a tossire fango con il sangue in
            bocca, e gli orchi sono di nuovo in mezzo al canale con l'acqua fino
            agli occhi.
      - testo: "Aggirarli dietro il canneto"
        descrizione: "Loro aspettano che passi sulla riva. Basta non passarci."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Dietro le canne
          testo: |
            Avanzi carponi nel canneto, spostando le canne con il dorso della mano
            perché le punte non si muovano. Le due teste restano girate verso la
            riva vuota, e quando esci dall'altra parte del canale, con il fango fin
            dentro il colletto, sono ancora lì ad aspettare.
          effetti: { profondita.palude-acquanera: 1 }
        fallimento:
          titolo: La lancia
          testo: |
            Una canna si piega più del dovuto, e una delle teste si gira. La lancia
            arriva dall'acqua senza che tu veda il braccio che l'ha tirata e ti apre
            la spalla di striscio. Torni indietro di corsa fino a dove le rane
            cantano ancora, e lì ti fermi a fasciarti.
          effetti: { ferite: 0.5 }
      - testo: "Restare fermo e aspettare che se ne vadano"
        descrizione: "Loro aspettano te. Si può aspettare anche loro, per un pezzo."
        costo: 2
        esito:
          titolo: Chi aspetta di più
          testo: |
            Ti siedi su una radice e aspetti, e loro aspettano te. Passano due ore
            prima che le teste spariscano sott'acqua tutte e due insieme e le rane
            ricomincino. Passi lungo la riva in fretta, con la nuca fredda,
            guardando i pesci sullo spago più a lungo di quanto vorresti.
          effetti: { profondita.palude-acquanera: 1, tormento: 1 }

  - id: palude-l-isolotto-della-torre
    immagine: ambientazione/palude-acquanera
    titolo: L'isolotto della torre
    sommario: "Fra i pioppi compare la torre di Bolgrum, su un isolotto circondato da acqua profonda."
    luogo: Palude Acquanera, davanti all'isolotto
    area: palude-acquanera
    ripetibile: true
    requisiti: [pista.tribu == 2, profondita.palude-acquanera == 4]
    testo: |
      Fra i pioppi compare la torre di pietra sbrecciata, su un isolotto
      circondato da un'acqua più profonda e più nera di quella attraversata
      finora. Una scala di legno sale alla porta, e sul fianco, a tre metri
      da terra, c'è una finestra con le sbarre di ferro.

      Fra i giunchi, ai tuoi piedi, galleggia una tavola dipinta con una mano
      rossa e la scritta *NO ENTRARE*, con la seconda E girata al contrario.

      {atletica Media} Fino all'isolotto saranno cento bracciate, se il
      freddo ti lascia le braccia, e intanto la tavola del cartello galleggia
      benissimo da sola.
    opzioni:
      - testo: "Attraversare a nuoto"
        descrizione: "L'isolotto è vicino. L'acqua però è profonda, e gli Spacca-ossa ci nuotano meglio di te."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: A bracciate
          testo: |
            Ti leghi la giacca sulla testa e scivoli in acqua senza schizzi. A metà
            l'acqua è così fredda che le dita smettono di chiudersi. Tocchi il
            fango dell'isolotto dal lato opposto alla porta e resti disteso fra i
            giunchi finché ricominci a sentire le mani.
          effetti: { profondita.palude-acquanera: 1 }
        fallimento:
          titolo: Il crampo
          testo: |
            A metà strada un crampo ti chiude il polpaccio e vai sotto. Torni su a
            bere aria e acqua insieme, e ti trascini indietro a forza di braccia
            fino ai giunchi da cui eri partito, a tossire accanto alla tavola del
            cartello.
          effetti: { ferite: 0.5 }
      - testo: "Studiare l'isolotto da lontano"
        descrizione: "Gli orchi entrano ed escono dall'acqua. Da qualche parte il fondo dev'essere basso."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il guado degli orchi
          testo: |
            Resti fra i pioppi finché un orco esce dalla torre ed entra in acqua
            fino alla vita, camminando invece di nuotare lungo una linea storta
            verso est. Sotto c'è un dosso. Lo passi con il sole già basso, un piede
            dopo l'altro, con l'acqua mai sopra il petto.
          effetti: { profondita.palude-acquanera: 1 }
        fallimento:
          titolo: L'orco alla finestra
          testo: |
            Guardi la torre troppo a lungo, e alla finestra con le sbarre compare
            una faccia stretta, con il naso adunco e gli occhi rossi, che guarda
            verso i pioppi. Ti abbassi nel fango e ci resti finché sparisce, e
            quando rialzi la testa è quasi buio.
          effetti: { tormento: 1 }
      - testo: "Fare una zattera con la tavola del cartello"
        descrizione: "La tavola dovrebbe reggere un uomo. Bisogna spingere con le braccia, e l'acqua è fredda."
        costo: 2
        esito:
          titolo: Il cartello
          testo: |
            Ti stendi sulla tavola a pancia in giù e spingi con le braccia
            nell'acqua gelata. La tavola regge appena, e a ogni bracciata la vernice
            rossa ti si stacca a scaglie sulla camicia. Arrivi all'isolotto con le
            braccia di legno e lasci il cartello fra i giunchi, con la scritta in
            giù.
          effetti: { profondita.palude-acquanera: 1, ferite: 0.5 }

  # ------------------------------------------------------------ la carta della spedizione
  - id: palude-la-lanterna-nel-fango
    immagine: ambientazione/palude-acquanera
    titolo: La lanterna nel fango
    sommario: "Mezza affondata nel fango c'è una lanterna da Raschiatore, e dentro il cristallo manda ancora una luce azzurra."
    luogo: Palude Acquanera, nel fango
    area: palude-acquanera
    tipo: carta
    requisiti: [pista.tribu == 2]
    testo: |
      Mezza affondata nel fango c'è una lanterna di ottone da Raschiatore.
      Dietro il vetro rigato il cristallo manda ancora una luce azzurra e
      debole, e sull'ottone è inciso con la punta di un chiodo *BERTO, SECONDO
      POZZO*, con sotto un cuore storto. *Gli Spacca-ossa se la sono portata
      via dalla città, la notte della razzia.* Ti chini, e il fango la lascia
      andare con un rumore di bacio.

      {origine apprendista-raschiatore} Una lanterna uguale l'hai portata alla
      cintura in tutti i tuoi turni, e le dita cercano la vite dello sportello
      prima ancora che tu ti chini.
    opzioni:
      - testo: "Aprirla e prendere il cristallo"
        descrizione: "Lo sportello ha una chiusura a vite. Il cristallo può valere qualcosa, se non si rompe."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Facile }
        successo:
          titolo: Il cristallo
          testo: |
            Sviti lo sportello con le unghie e tiri fuori il cristallo, un prisma
            azzurro lungo un dito che si spegne appena lo stacchi dalla base. Al
            Mercato dei Nodi qualcuno te lo pagherà lo stesso. La lanterna vuota la
            appendi a un ramo di tasso, con il cuore storto girato verso la città.
          effetti: { cristalli.cristallo-sterile: 1 }
        fallimento:
          titolo: La scossa
          testo: |
            Giri la vite dalla parte sbagliata, e il cristallo ti dà una scossa che
            ti risale fino al gomito. La lanterna ti cade nel fango, e quando la
            ritrovi il vetro è rotto e la luce spenta.
          effetti: { ferite: 0.5 }
      - testo: "Leggere bene la scritta e lasciarla dov'è"
        descrizione: "Berto del secondo pozzo, in Città Bassa, qualcuno lo conoscerà."
        esito:
          titolo: Berto
          testo: |
            Pulisci l'ottone con il pollice e sotto il nome trovi i turni di una
            settimana e una data, il giorno prima del Festival. Rimetti la lanterna
            dritta sul fango con il cristallo acceso e la lasci lì. Alla Pignatta,
            in Città Bassa, qualcuno saprà dirti se Berto del secondo pozzo è ancora
            vivo, e una storia così vale da bere.
          effetti: { informazioni.voce: 1 }
      - testo: "Leggere i turni incisi sull'ottone"
        descrizione: "Sotto il nome ci sono i turni abbreviati, e un Raschiatore sa chi tiene il foglio intero."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Il foglio di Dragna
          testo: |
            Leggi al volo i turni incisi sotto il nome. L'ultimo turno nel secondo
            pozzo è del giorno prima del Festival, e da allora questa lanterna non
            è più scesa. La rimetti dritta sul fango con il cristallo acceso. Al
            Grifone, sul foglio dei turni di Dragna, il nome di Berto o c'è ancora
            o è stato cancellato, e qualcuno vorrà sapere dove l'hai trovata.
          effetti: { informazioni.voce: 1 }
      - testo: "Sentire il cristallo prima di toccare la vite"
        descrizione: "All'Accademia insegnano a sentire da che parte tira il Mana di un cristallo prima di aprirlo."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [magia, tecnologia], difficolta: Facile }
        successo:
          titolo: Da che parte tira
          testo: |
            Appoggi due dita sul vetro e aspetti. Il Mana del cristallo tira piano
            verso la base, come una corrente verso lo scarico, e la vite va girata
            nello stesso verso. Lo sportello si apre senza una scintilla, e il
            prisma azzurro si spegne appena lo stacchi. La lanterna vuota la
            appendi a un ramo di tasso, con il cuore storto girato verso la città.
          effetti: { cristalli.cristallo-sterile: 1 }
        fallimento:
          titolo: La lezione del primo anno
          testo: |
            Sei così preso dal sentire il Mana che le dita girano la vite per
            conto loro, e dalla parte sbagliata. La scossa ti risale fino al
            gomito, la lanterna cade nel fango e il vetro si rompe, e per un pezzo
            hai in testa la voce di Temmerin che ti ricorda in quale ordine si
            fanno le cose.
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · 2 → 3
  - id: la-torre-di-bolgrum
    immagine: personaggi/bolgrum
    titolo: La torre di Bolgrum
    sommario: "Nella torre ci sono tre orchi e, di sopra, Bolgrum sul trono di teschi con Skarr accanto."
    luogo: Palude Acquanera, la torre sull'isolotto
    area: palude-acquanera
    requisiti: [pista.tribu == 2, profondita.palude-acquanera >= 5]
    testo: |
      Arrivi sull'isolotto al tramonto e ti acquatti fra le radici di un tasso
      a venti passi dalla torre. Al piano terra, davanti a una fila di candele
      votive accese per una statua di pietra lasciata a metà, tre orchi
      siedono a un tavolo con una coppa piena di monete e un piatto di carne
      cruda.

      Dalla finestra con le sbarre si vede il piano di sopra. Su un trono di
      teschi siede Bolgrum, così grasso che il trono gli scompare sotto, con
      una corona d'ossa in testa e un bastone da sciamano fra le ginocchia.
      Accanto al trono c'è Skarr, magro, con la testa quasi alle travi e
      un'ascia bipenne sulla spalla. Sul tavolo dietro di loro sono
      ammucchiate pergamene coperte di ragnatele, quello che resta del mago
      della torre.

      {origine allievo-di-torvessa} All'Accademia hai imparato quanto poco si
      capisce ancora di quello che i maghi hanno lasciato scritto, e qui lo
      lasciano ammuffire accanto alla carne cruda.

      {armi-da-mischia Difficile} Una bipenne vuole spazio per girare, e in
      una torre con le travi basse quello spazio non c'è dappertutto.

      «Skarr» dice Bolgrum con una voce acuta e roca, schioccando la lingua.
      «Che fine ha fatto il cartello che dice di non entrare?» Skarr fa
      spallucce, e intanto guarda verso i tassi.
    opzioni:
      - testo: "Entrare dalla porta e salire ad affrontarli"
        descrizione: "Skarr ha l'ascia, e Bolgrum ha il bastone. Dal trono però non si alza."
        combattimento: la-torre-di-bolgrum
        vittoria:
          titolo: Il trono di teschi
          testo: |
            I tre orchi del piano terra ti vedono sulla porta e si buttano in
            acqua. Di sopra Bolgrum ti guarda storto. «E questa che bestia è? Una
            capra senza corna?» Skarr ti viene addosso con l'ascia, e quando cade
            il pavimento trema. Bolgrum muore sul trono senza essersi alzato. Ti
            metti sotto la giacca le pergamene del mago, svuoti la coppa nella
            bisaccia e rientri in città a notte fonda.
          effetti: { pista.tribu: 1, monete: 35, informazioni.segreto: 1, racconto: 1 }
          imposta: { bolgrum: 1 }
          vai: citta-bassa
        sconfitta:
          titolo: Il canale
          testo: |
            L'ascia di Skarr ti manda contro la parete, e Bolgrum ride battendo il
            bastone sul pavimento. Ti butti in acqua, e dai giunchi lo vedi scendere
            la scala sulle sue gambe, appoggiato a Skarr, ed entrare nel canale con
            la tribù dietro. Quando la torre è vuota risali a prendere le pergamene
            del mago, ancora sul tavolo sotto la polvere, e torni in città all'alba,
            zoppicando.
          effetti: { pista.tribu: 1, informazioni.segreto: 1 }
          imposta: { bolgrum: 2 }
          vai: citta-bassa
      - testo: "Aspettare che Skarr scenda e salire dalla finestra"
        descrizione: "Prima o poi Skarr scenderà per la carne. Tre metri di muro, e le sbarre sono vecchie."
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Difficile }
        successo:
          titolo: Le sbarre
          testo: |
            Quando Skarr scende per la carne ti arrampichi sulla pietra e strappi la
            sbarra più arrugginita. «C'è una lucertola alla finestra» chiama
            Bolgrum, e non fa in tempo a dire altro. Skarr risale la scala a
            chiocciola con la bipenne che sbatte sui muri, e in cima lo aspetti
            finché cade all'indietro fino in fondo. Prendi le pergamene e la coppa
            mentre gli altri orchi scappano in acqua.
          effetti: { pista.tribu: 1, monete: 30, informazioni.segreto: 1, racconto: 1 }
          imposta: { bolgrum: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Nel fango
          testo: |
            A metà del muro una pietra ti resta in mano e cadi di schiena nel fango.
            Skarr esce con l'ascia e ti apre il fianco mentre ti butti in acqua. Dai
            giunchi vedi Bolgrum alzarsi dal trono, forse per la prima volta in
            anni, e sparire nel canale con Skarr davanti. Quando la torre è vuota
            sali a prendere le pergamene del mago e torni in città tenendoti il
            fianco.
          effetti: { pista.tribu: 1, ferite: 2.5, informazioni.segreto: 1 }
          imposta: { bolgrum: 2 }
          vai: citta-bassa
      - testo: "Dare fuoco alla scala e alla porta, e aspettarli fuori"
        descrizione: "La scala e la porta sono di legno vecchio, e chi esce dal fumo esce nel fango."
        esito:
          titolo: Il fumo
          testo: |
            Il legno umido tarda a prendere, poi il fumo entra nella torre e gli
            orchi escono dalle brecce buttandosi in acqua. Dalla più larga esce
            Bolgrum sulle sue gambe, appoggiato a Skarr. Skarr ti prende alla spalla
            con l'ascia e torna da lui senza fretta, e quando il fumo si dirada sono
            spariti fra i canali. Dal tavolo di sopra salvi le pergamene del mago,
            annerite agli angoli.
          effetti: { pista.tribu: 1, ferite: 1.5, informazioni.segreto: 1 }
          imposta: { bolgrum: 2 }
          vai: citta-bassa
      - testo: "Entrare a mani aperte e parlare con Bolgrum"
        descrizione: "Chi vuole parlare con Bolgrum va da lui. Lui ascolta, e intanto pesa."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Difficile }
        successo:
          titolo: Il cartello
          testo: |
            Gli orchi ti portano di sopra, e a Bolgrum dici che il suo cartello
            galleggia nei giunchi. Lui manda Skarr a cercarlo, e quando allunga la
            mano verso il bastone sei già addosso a lui, e muore sul trono senza
            essersi alzato.

            Quando Skarr torna su per la scala gli pianti il piede in petto, e
            l'ascia lo porta a fondo nel canale. Esci con le pergamene e la coppa.
          effetti: { pista.tribu: 1, monete: 25, informazioni.segreto: 1, racconto: 1 }
          imposta: { bolgrum: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Troppo leggero
          testo: |
            Bolgrum ti ascolta schioccando la lingua, poi allarga le mani grasse.
            «Leggero» dice, e chiama Skarr. L'ascia ti prende la schiena mentre ti
            butti dalla finestra. All'alba, dai giunchi, vedi Bolgrum lasciare la
            torre a piedi con la tribù dietro. Nella torre deserta le pergamene sono
            ancora sul tavolo, e torni in città piegato in avanti, con il fascio
            stretto contro il petto.
          effetti: { pista.tribu: 1, ferite: 2.5, informazioni.segreto: 1 }
          imposta: { bolgrum: 2 }
          vai: citta-bassa
      - testo: "Entrare e farti pesare da Bolgrum"
        descrizione: "Bolgrum pesa tutti con gli occhi. Sulla bilancia di Ghoran sei già stato, e sai come si sta fermi."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza, intimidire], difficolta: Difficile }
        successo:
          titolo: Pesante
          testo: |
            Bolgrum ti guarda, e resti fermo con gli occhi alti, che sulla
            bilancia di Ghoran tenevi bassi. «Pesa» dice, quasi offeso. «Skarr,
            senti tu quanto.»

            Quando Skarr alza la bipenne gli entri sotto il braccio e lo spingi
            con tutto il peso contro il trono, che si sfascia sotto di loro. Skarr
            resta giù, e Bolgrum muore fra le cinghie senza essersi alzato. Prendi
            le pergamene e la coppa.
          effetti: { pista.tribu: 1, monete: 25, informazioni.segreto: 1, racconto: 1 }
          imposta: { bolgrum: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Gli occhi bassi
          testo: |
            Bolgrum ti guarda a lungo schioccando la lingua, e a metà ti accorgi
            di avere abbassato gli occhi, come sulla bilancia di Ghoran. «Leggero»
            dice quasi dispiaciuto, e chiama Skarr. L'ascia ti prende la schiena
            mentre ti butti dalla finestra, e all'alba, dai giunchi, vedi Bolgrum
            scendere la scala sulle sue gambe con la tribù dietro. Nella torre
            vuota le pergamene del mago sono ancora sul tavolo.
          effetti: { pista.tribu: 1, ferite: 2.5, informazioni.segreto: 1 }
          imposta: { bolgrum: 2 }
          vai: citta-bassa
      - testo: "Salire dalla finestra come sulle piattaforme"
        descrizione: "Sulle pareti della Cicatrice hai salito di peggio, e sai riconoscere il ferro mangiato dalla ruggine."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [atletica, tecnologia], difficolta: Difficile }
        successo:
          titolo: La sbarra sorda
          testo: |
            Quando Skarr scende per la carne ti attacchi alla pietra come alla
            parete della Cicatrice, e batti le sbarre con l'unghia finché quella
            che suona sorda viene via. «La torre ha un buco» chiama Bolgrum. Skarr
            risale con la bipenne che sbatte sui muri, e lo aspetti in cima finché
            cade all'indietro. Bolgrum muore sul trono senza essersi alzato, e
            prendi le pergamene e la coppa.
          effetti: { pista.tribu: 1, monete: 30, informazioni.segreto: 1, racconto: 1 }
          imposta: { bolgrum: 1 }
          vai: citta-bassa
        fallimento:
          titolo: La pietra dopo
          testo: |
            A metà del muro provi una pietra come si prova un appiglio sulle
            piattaforme, e la pietra tiene. Ti resta in mano quella dopo, che non
            hai provato. Skarr esce con l'ascia e ti apre il fianco mentre ti
            butti in acqua, e dai giunchi vedi Bolgrum scendere la scala ed
            entrare nel canale con la tribù dietro. Quando la torre è vuota sali a
            prendere le pergamene del mago.
          effetti: { pista.tribu: 1, ferite: 2.5, informazioni.segreto: 1 }
          imposta: { bolgrum: 2 }
          vai: citta-bassa
