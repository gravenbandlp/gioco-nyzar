# La pista di Capomozzo, ultima parte: il ritorno a Qir-Azel e la fine del Capitolo I (pista 6 → 10),
# più i due storylet degli Averi legati alla pista: il diario di Aurenne e la decifrazione del congegno.
quality:
  - { id: capomozzo.congegno, nome: Aurenne ti ha spiegato il congegno, categoria: stato, nascosta: true }

storylet:
  # ------------------------------------------------------------ 6 → 7 · il ritorno
  - id: il-ritorno-a-qir-azel
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Il ritorno a Qir-Azel
    sommario: "Due giorni e mezzo di strada con una donna che non si sveglia, e in fondo la navata della Cattedrale."
    luogo: Cattedrale del Velo, la navata
    area: quartieri-alti
    requisiti: [pista.capomozzo == 6]
    testo: |
      Per due giorni e mezzo di strada Aurenne non apre gli occhi. Sotto la pelle le pulsano chiazze scarlatte
      come braci coperte di cenere, e ogni volta che la tocchi ti strofini le mani sui calzoni senza volerlo.
      Quando le senti il polso batte lento e regolare, e le chiazze vanno con un ritmo loro che non gli
      corrisponde.

      I battenti della Cattedrale del Velo sono di quercia con le bande di ferro, e si aprono con un colpo
      sordo che sale fino alle volte. Lungo le colonne le candele bruciano in file di coppe d'ottone, e la
      cera colata ha fatto sul marmo delle croste spesse un dito. In fondo alla navata Padre Vantes e Julia
      Castaldi parlano a bassa voce con Toren Galdrick, che è salito dalla Caserma, e al rumore delle porte si
      voltano verso di te.

      Julia ti viene incontro per prima, e la voce roca le si rompe a metà di un ringraziamento al Grande
      Albero. Galdrick guarda la donna che hai steso su una panca e ti chiede soltanto se è viva. Vantes si
      inginocchia sul marmo accanto alla panca e le tiene a lungo due dita sulla fronte.

      {origine rampollo-dei-quartieri-alti} Ai tavoli del Consiglio hai sentito Julia Castaldi ridere un tono
      sotto, come si deve. Questa voce rotta ti è nuova, e non sai dove guardare.

      {origine accolito-del-velo} Nella tenda dei feriti hai visto Vantes chiudere ferite finché la faccia gli
      diventava grigia, e le tue mani cercano le bende in una borsa che stasera non hai.

      «È contaminata» dice piano. «C'è una presenza dentro di lei, e la sento sotto le dita.» Ritira la mano e
      si pulisce le dita sulla tonaca senza accorgersene. *Allora non succede solo a me.* Le tue mani intanto
      hanno già trovato la stoffa dei calzoni.
    opzioni:
      - testo: "Dire a Galdrick com'è finita con Balthog"
        descrizione: "Prima di tutto il resto, lo sceriffo vuole sapere questo."
        immagine: personaggi/toren-galdrick
        requisiti: [balthog == 1]
        costo: 0
        esito:
          titolo: Il trono vuoto
          testo: |
            Gli dici che Balthog il Prescelto è morto nella sua sala del trono, sotto il teschio di cavallo
            dello schienale. Julia lascia cadere le spalle, come se se lo concedesse solo adesso. «Allora è
            finita» dice, «o quasi.»

            Galdrick non sorride. «Ci sono ancora bande sparse per le campagne, e a Fondobosco sono più di
            quanti ne potremmo contare» dice. «Senza un capo, però, non ci verranno più addosso tutti insieme.
            Il fronte si spezza lì.» Tira fuori il taccuino dalla giubba e ci scrive una riga corta, e nel
            silenzio della navata senti la matita grattare sulla carta.
      - testo: "Dire a Galdrick com'è finita con Balthog"
        descrizione: "Prima di tutto il resto, lo sceriffo vuole sapere questo."
        immagine: personaggi/toren-galdrick
        requisiti: [balthog == 2]
        costo: 0
        esito:
          titolo: Battuto davanti ai suoi
          testo: |
            Gli dici che hai battuto Balthog davanti ai suoi orchi e che l'hai lasciato a terra davanti al
            trono, vivo. Galdrick ti guarda a lungo con i pollici nella cintura, come se volesse misurare
            quanto ti è costato, e alla fine annuisce. «Se i suoi l'hanno visto a terra, non lo seguono più»
            dice. «E da morto ci avrebbe dato più grane, con tutti quelli che volevano vendicarlo.»

            Restano bande sparse per le campagne, e a Fondobosco gli orchi sono tanti, ma senza un capo non
            verranno più tutti insieme. Sulla panca accanto Aurenne non ha mosso nemmeno un dito da quando
            l'hai stesa.
      - testo: "Dire a Galdrick com'è finita con Balthog"
        descrizione: "Prima di tutto il resto, lo sceriffo vuole sapere questo."
        immagine: personaggi/toren-galdrick
        requisiti: [balthog == 0]
        costo: 0
        esito:
          titolo: Ancora vivo
          testo: |
            Gli dici che Balthog è ancora vivo, e che sotto la fortezza ci sei sces{o|a} lo stesso. Galdrick
            resta a lungo zitto con i pollici nella cintura. «Senza chi gli dava gli ordini è un capotribù
            come tanti» dice alla fine. «Più grosso degli altri, ma lo possiamo tenere a bada.»

            Restano bande sparse per le campagne, e a Fondobosco gli orchi sono tanti, ma senza la donna che
            li teneva in fila non verranno più tutti insieme. Quella donna è stesa sulla panca a due passi da
            lui, e le chiazze le pulsano ancora sotto la pelle.
      - testo: "Dire chi serviva Aurenne"
        descrizione: "Vantes ha sentito qualcosa sotto le dita. Il nome di quel qualcosa lo conosci tu."
        immagine: personaggi/padre-vantes
        costo: 0
        esito:
          titolo: Nhar'Kael
          testo: |
            Racconti quello che Isvaro scriveva nel diario, della nuova madre di Aurenne e dei resti di Sollen
            bruciati al santuario di Capomozzo. Parli anche di Garin, che sotto la fortezza la chiamava pazza
            per quello che aveva fatto ai mascherati del Culto dell'Anonimo. Quando dici il nome di Nhar'Kael
            nella navata si sentono sfrigolare le candele, e le fiamme si abbassano tutte insieme. Le porte
            sono chiuse, e sulla faccia non senti nessuna corrente d'aria.

            Vantes si fa il segno del velo. «Allora non è una setta qualunque» dice, «e la faccenda è molto
            più grande di quanto pensassimo. Che l'Albero ci aiuti.»
      - testo: "Raccontare della maschera"
        descrizione: "Quando il colosso ha vacillato il tempo si è fermato, e una voce che era la tua ti ha chiamato Portatore dell'Alba."
        immagine: personaggi/toren-galdrick
        esito:
          titolo: Le storie erano vere
          testo: |
            Racconti del Costruttore e della maschera spaccata che si è ricomposta davanti a te, e del coro
            che ti ha chiamato Portatore dell'Alba con la tua stessa voce. Mentre lo racconti la faccia ti
            prude sotto la pelle, e devi tenere le mani ferme per non grattarti.

            Julia indica il congegno che ti spunta dalla tasca, con la corona di cristalli quasi tutti spenti.
            «Quello non toccarlo e non usarlo» dice con la voce roca. «Aspetta che lei si svegli, è l'unica
            che sa come funziona.»
          pe: { espressivita: 5 }
          effetti: { pista.capomozzo: 1, rep.velo: 0.5 }
      - testo: "Parlare soltanto del congegno"
        descrizione: "Della maschera, per ora, puoi anche tacere. Il disco dei Precursori invece è sul tavolo, e lo vedono tutti."
        immagine: personaggi/julia-castaldi
        esito:
          titolo: Servirà tempo
          testo: |
            Posi il congegno sul tavolo accanto alla panca e spieghi che Aurenne lo usava per comandare le
            macchine della Salvaguardia. Il disco tocca il legno con un colpo pieno, da oggetto più pesante di
            quanto sembri. Galdrick sposta due libri per guardarlo meglio e scuote la testa. «Un disco che
            comanda quelle cose» dice. «Sembra una follia.»

            «Forse, ma è l'unica pista che abbiamo» dice Julia con la voce roca. «Non toccarlo e non usarlo.
            Aspetta che si svegli, lei sa come funziona.»

            Della maschera non hai detto niente, e la faccia, sotto la pelle, ti prude lo stesso.
          pe: { politica-ed-economia: 5 }
          effetti: { pista.capomozzo: 1, rep.velo: 0.5 }
      - testo: "Spiegare il congegno come una lezione"
        descrizione: "Al Festival i cristalli del banco dell'Accademia hanno vibrato tutti insieme prima che le macchine scendessero dai tetti."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Dalla corona alla conca
          testo: |
            Posi il congegno sul tavolo accanto alla panca e lo spieghi come Temmerin spiega un cristallo
            nuovo, dall'esterno verso il centro, senza mai toccarlo. Racconti dei sei cristalli del banco che
            al Festival hanno vibrato tutti insieme, e dici che il disco manda lo stesso genere di segnale,
            soltanto più forte. Anche posato sul legno il suo ronzio basso ti arriva nei denti.

            «Allora è l'unica pista che abbiamo» dice Julia con la voce roca. «Non toccarlo e non usarlo.
            Aspetta che si svegli, lei sa come funziona.»

            Della maschera non hai detto niente, e la faccia, sotto la pelle, ti prude lo stesso.
          pe: { tecnologia: 5 }
          effetti: { pista.capomozzo: 1, rep.velo: 0.5 }
      - testo: "Fare rapporto a Julia come in Consiglio"
        descrizione: "Ai tavoli del Consiglio prima si dicono i fatti e solo dopo le richieste. Julia Castaldi ascolta meglio chi le parla nella sua lingua."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Prima i fatti
          testo: |
            Aspetti che Julia abbia finito di ringraziare l'Albero, poi le fai rapporto con il tono dei giorni
            di consiglio, mettendo i fatti prima delle richieste. Ti ascolta senza interromperti una volta, e
            a ogni fatto abbassa appena il mento. Le dici del disco che Aurenne usava per comandare le
            macchine, e lo posi sul tavolo accanto alla panca come si posa una mozione.

            «Non toccarlo e non usarlo» dice con la voce roca. «Aspetta che si svegli, lei sa come funziona.»
            Della maschera non hai detto niente, e in quella lingua nessuno te l'ha chiesto.
          pe: { galateo: 5 }
          effetti: { pista.capomozzo: 1, rep.velo: 0.5 }

  # ------------------------------------------------------------ 7 → 8 · la Madre del Velo
  - id: la-madre-del-velo
    presso: cattedrale-del-velo
    immagine: personaggi/madre-del-velo
    titolo: La Madre del Velo
    sommario: "La sera dopo, nella Cripta sotto l'altare, ti aspetta chi nessuno ha mai visto in volto."
    luogo: Cattedrale del Velo, la Cripta, di sera
    area: quartieri-alti
    requisiti: [pista.capomozzo == 7]
    testo: |
      La sera dopo Padre Vantes ti accompagna fino alla scala della Cripta e si ferma sul primo gradino. «Io
      resto qui» dice, e ti posa due dita sul polso. I gradini sono tagliati nella pietra viva e consumati al
      centro, tanto che il piede ci si posa in una conca. La Cripta è una sala bassa sotto l'altare dove
      l'aria sa d'incenso, e la volta è così vicina che la sfioreresti alzando il braccio. Il velo che copre
      l'altare si muove appena anche se non c'è vento. Ti dici che sarà lo spiffero della scala, e intanto le
      fiamme delle torce stanno dritte.

      {origine accolito-del-velo} Da novizi{o|a} ti hanno insegnato a non chiedere cosa c'è sotto l'altare, e
      adesso sotto l'altare ci sei tu. La lingua ti si incolla al palato per vecchia obbedienza.

      Le torce si spengono una alla volta, dalla più vicina alla scala fino all'ultima, e da nessuna sale un
      filo di fumo. Nella penombra resta un chiarore d'oro e d'argento, e al centro della sala c'è una figura
      avvolta in veli che sembrano fatti di quel chiarore.

      La voce non ha inflessioni e ti arriva dentro le orecchie senza passare dall'aria. Dietro ce n'è
      un'altra più bassa, che dice le stesse parole con un attimo di ritardo. Mentre parlano i veli davanti al
      suo viso restano fermi.

      «Portatore dell'Alba» dice la Madre del Velo. «Così ti chiamerà il Velo, da stasera. Sotto Capomozzo hai
      abbattuto un Costruttore, e da secoli nessuno ci riusciva. La Magnistruttura ha tremato fino a qui, e le
      rovine si sono ricordate i loro nomi. Sei stat{o|a} chiamat{o|a} per sapere che cosa hai svegliato.» La
      seconda voce finisce la frase un attimo dopo la prima.
    opzioni:
      - testo: "Chiedere dei Costruttori"
        descrizione: "Quello che hai visto sotto Capomozzo era alto quanto quattro case una sopra l'altra e aveva un cuore rosso. Lei sa che cos'era."
        costo: 0
        esito:
          titolo: Le mani dei Precursori
          testo: |
            «I Costruttori erano le mani dei Precursori» dice la Madre. «Edificavano e custodivano. Quando i
            loro signori scomparvero rimasero prigionieri del loro lavoro e continuarono a costruire e a
            difendere senza più sapere per chi. Adesso sono semidivinità spezzate. Alcuni fanno la guardia,
            altri distruggono quello che giudicano imperfetto. Ne restano nove, forse dieci.» Sul «forse
            dieci» la seconda voce tarda più del solito.

            «Uno di loro ti aspetta nel Labirinto di Darn-Morakh. È un Costruttore Redento, l'unico che
            ricorda ancora che cosa fosse la Luce. Se puoi, non distruggerlo. Attraverso di lui la tua
            maschera potrà crescere ancora.»
      - testo: "Chiedere del Labirinto"
        descrizione: "Per i Raschiatori è una miniera che cambia strada. A sentire come ne parla lei, è un'altra cosa."
        costo: 0
        esito:
          titolo: Il Nido
          testo: |
            «Il Labirinto di Darn-Morakh era un cantiere divino» dice la Madre, «dove i Precursori forgiavano
            mondi. Adesso è una prigione viva di pietra e metallo che pensano, con corridoi che cambiano
            direzione. In fondo, dove i Raschiatori non arrivano, vive quella che il Velo teme più di ogni
            altra.» La seconda voce dice il nome un attimo dopo la prima, e sul nome il chiarore dei veli si
            abbassa fino quasi a spegnersi. «Nhar'Kael. La chiamano la Regina delle Ali Spezzate, o la
            Covatrice di Orrori. Ogni culto che la serve cerca di somigliarle, e fonde la carne con la
            macchina finché la differenza si perde.»

            «La donna che hai riportato dalle rovine, quella che gli orchi chiamavano la Dama d'Argento, era
            una delle sue. E non la più forte.»
          imposta: { madre.labirinto: 1 }
      - testo: "Dirle che scenderai nel Labirinto"
        descrizione: "Il Costruttore Redento è laggiù, e anche quello che vi si nasconde."
        requisiti: [madre.labirinto >= 1]
        esito:
          titolo: Il cammino è tracciato
          testo: |
            Le dici che scenderai nel Labirinto, quando sarai pront{o|a}.

            «Il Velo pregherà per la tua discesa, Portatore» dice la Madre quando sei già sul primo gradino.
            «Va', adesso.» Dalla scala ti volti, e in fondo la sala è buia e non c'è più nessun chiarore. In
            cima alla scala Vantes ti aspetta con le mani infilate nelle maniche, e ti dice che per Aurenne ci
            vorrà ancora una settimana. Le ferite del corpo si sono già chiuse, e per il resto lui può
            soltanto pregare.
          pe: { resilienza: 5 }
          effetti: { pista.capomozzo: 1, rep.velo: 1 }
      - testo: "Dirle che il Labirinto non è affar tuo"
        descrizione: "Per la Confraternita hai già fatto abbastanza. Che ci mandi i suoi accoliti."
        requisiti: [madre.labirinto >= 1]
        esito:
          titolo: La vita che resta
          testo: |
            Le dici che non scenderai, perché per la Confraternita hai già fatto abbastanza.

            «Il Velo non ti obbliga» dice. Questa volta le due voci arrivano insieme, senza nessun ritardo.
            «Ma Nhar'Kael è nell'aria che respiri, e nella memoria di chiunque sia nato dopo la Caduta. Ti
            chiedo di servire la vita che resta.»

            In cima Vantes ti dice che per Aurenne ci vorrà ancora una settimana, e non ti chiede che cosa hai
            risposto alla Madre.
          pe: { resilienza: 5 }
          effetti: { pista.capomozzo: 1 }
      - testo: "Dirle che non hai più padroni"
        descrizione: "A Ghoran c'era sempre qualcuno che decideva dove dovevi andare."
        requisiti: [madre.labirinto >= 1]
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Nessun padrone
          testo: |
            Le dici che sei scappat{o|a} da Ghoran per non dover più andare dove ti mandano, e che
            ricominciare adesso, per lei, sarebbe la stessa cosa. Solo alla fine ti accorgi di averlo detto
            sottovoce, con la testa china sotto la volta bassa.

            «Non ti chiedo di servire me» dice. «Nhar'Kael è nell'aria che respiri, e nella memoria di
            chiunque sia nato dopo la Caduta. Ti chiedo di servire la vita che resta, e la tua è fra quelle.»

            In cima alla scala Vantes ti dice che per Aurenne ci vorrà ancora una settimana, e non ti chiede
            che cosa hai risposto alla Madre.
          pe: { resilienza: 5 }
          effetti: { pista.capomozzo: 1 }

  # ------------------------------------------------------------ 8 → 9 · Aurenne si risveglia
  - id: aurenne-si-risveglia
    presso: cattedrale-del-velo
    immagine: personaggi/aurenne
    titolo: Aurenne si risveglia
    sommario: "Una settimana dopo Vantes ti manda a chiamare. Nella sala di preghiera più interna una donna è in ginocchio davanti all'altare."
    luogo: Cattedrale del Velo, la sala di preghiera
    area: quartieri-alti
    requisiti: [pista.capomozzo == 8]
    testo: |
      Una settimana dopo un novizio ti ferma per strada e ti dice che Padre Vantes ti manda a chiamare. Vantes
      ti accompagna in silenzio fino alla sala di preghiera più interna. È una stanza stretta di pietra
      chiara, e dalle vetrate la luce cade a strisce colorate sulle lastre del pavimento.

      Aurenne è in ginocchio davanti all'altare. La mano destra è ancora l'artiglio dalle dita lunghe e nere,
      e la tiene aperta sulla coscia come una cosa che non le appartiene. Dove le punte posano sulla gonna la
      stoffa è tutta sfilacciata.

      {origine allievo-di-torvessa} Anche lei è passata dall'Accademia prima di te. Ti chiedi se Temmerin a
      lei rispondeva due volte alla stessa domanda.

      {armi-da-mischia Media} L'artiglio è a tre passi da te, ed è la sua mano forte anche quando riposa. Con
      dita così lunghe un rovescio arriva più lontano di quanto dica la spalla, e la tua mano è già scivolata
      sull'elsa.

      «Nessun ramo dell'Albero rimane secco per sempre» dice senza voltarsi. «Anche il più annerito, se
      nessuno lo spezza, può fiorire ancora.» Si alza piano con la mano buona appoggiata all'altare, e si
      gira. Ha gli occhi viola e stanchi, senza più la luce che avevano sul ponte.

      «È un passo delle Scritture sul perdono. Padre Vantes mi ha accolta, e dice che per tornare indietro non
      è mai troppo tardi. Io questo non lo so. Non cercherò di giustificarmi con quello che ho subito, né con
      le voci che mi hanno guidata. Voglio soltanto espiare. Per questo ti risponderò, Portatore. Chiedimi
      quello che vuoi.»
    opzioni:
      - testo: "Chiedere di Nhar'Kael e della Marea Grigia"
        descrizione: "La Madre del Velo te ne ha parlato. Aurenne l'ha sentita parlare."
        costo: 0
        esito:
          titolo: Figlia imperfetta
          testo: |
            «Mi ha parlato fin da quando ero bambina» dice Aurenne, con gli occhi sulla luce delle vetrate.
            «Mi chiamava figlia imperfetta, e mi diceva che potevo essere la prima di una stirpe nuova, che
            potevo riaprire il nido. Credevo che fosse un dono.» Si passa la mano buona fra i capelli. «La
            Marea Grigia è lei. La genera un po' per caso e un po' per difendersi, e così nasconde i segreti
            dei Precursori. Ogni ondata cancella un pezzo della memoria del mondo.»

            Con tutto quello che ha fatto per Nhar'Kael, dice, adesso alla Regina riesce più facile generare i
            suoi figli, le bestie mutate che i Raschiatori trovano nelle rovine. La voce le si fa piatta
            mentre lo ammette, e sulla coscia l'artiglio si chiude piano senza che lei lo guardi.
      - testo: "Chiedere del Culto dell'Anonimo"
        descrizione: "Isvaro lo nominava nel diario, e Garin parlava dei mascherati come di gente che non c'è più."
        costo: 0
        esito:
          titolo: L'ultima testimone
          testo: |
            «L'ho fondato io, per servirla» dice. «Nhar'Kael mi aveva mostrato il tuo volto prima che ti
            incontrassi, e mi aveva detto che avresti portato la rovina travestita da redenzione. Io l'ho
            ripetuto agli altri, e loro mi hanno creduto. Portavamo maschere bianche senza tratti, perché la
            salvezza stava nel non essere più nessuno.»

            Prima di continuare si guarda a lungo il palmo della mano buona. «Uccidevamo chi si opponeva, e
            quando abbiamo finito ho sacrificato loro, uno dopo l'altro, sull'altare della Regina delle Ali
            Spezzate. Credevo che mi avrebbe trasformata in qualcosa di potente. Il Culto dell'Anonimo è
            finito con loro, e io sono l'ultima che può raccontarlo.»
      - testo: "Chiedere del congegno"
        descrizione: "Julia ti ha detto di non toccarlo. Adesso c'è chi può spiegarti perché."
        costo: 0
        esito:
          titolo: Un modulatore
          imposta: { capomozzo.congegno: 1 }
          testo: |
            «È un relitto dei Precursori» dice Aurenne, e guarda il disco senza toccarlo. «Manda un segnale
            che confonde le loro macchine. Per qualche minuto non sanno più chi sono, e quindi nemmeno chi è
            il nemico. Poi si scarica, e si ricarica con i cristalli conduttori oppure da solo, col tempo.»

            Qui posa la mano buona sopra l'artiglio e la lascia lì. «Può anche comandarle, se gli dai
            abbastanza volontà. Io ne ho comandate a decine, e a ogni ordine dentro di me si spegneva un
            ricordo, oppure un nome. Un giorno mi sono accorta che non provavo più niente, e ancora adesso non
            so se quella parte di me tornerà.»
      - testo: "Mostrarle il diario"
        descrizione: "Il quaderno dalla copertina di stoffa che hai trovato nella sua stanza, sotto Capomozzo."
        requisiti: [oggetto.diario-di-aurenne >= 1]
        costo: 0
        esito:
          titolo: La grafia di una ragazza
          testo: |
            Le porgi il diario aperto sulla prima pagina con la grafia tonda da scolara e il fiore disegnato a
            margine. Aurenne riconosce la copertina azzurra consumata agli angoli, e non lo prende. Lo guarda
            nelle tue mani, e le labbra le si muovono appena, come se rileggesse a memoria una riga.

            «Quella ragazza scriveva a qualcuno che non la ascoltava» dice dopo un po'. «Al Grande Albero,
            credeva lei.» Poi scuote la testa piano e ti chiede di tenerlo tu, perché se lo tenesse lei
            finirebbe per rileggerlo, e per darle ragione.
      - testo: "Lasciarla alle sue preghiere"
        descrizione: "Hai chiesto quello che volevi sapere, o quello che riuscivi ad ascoltare."
        esito:
          titolo: Una donna
          testo: |
            Dopo un lungo silenzio Aurenne torna a inginocchiarsi davanti all'altare, e le ginocchia ritrovano
            sulle lastre lo stesso punto di prima.

            «Lasciami alle mie preghiere» dice. «Non tornerò a combattere, e non voglio più essere la guida di
            nessuno, né un simbolo. Sono solo una donna che ha perso se stessa nel tentativo di diventare un
            dio.» Abbassa la testa sull'artiglio. «Ti auguro ogni fortuna, Portatore. Spero di rivederti.»

            Fuori, sui gradini, ti accorgi che cammini più dritto di quando sei entrat{o|a}.
          pe: { empatia: 5 }
          effetti: { pista.capomozzo: 1, tormento: -0.5 }
      - testo: "Dirle il resto del passo"
        descrizione: "Quel passo delle Scritture i novizi lo recitano all'alba nel corridoio, e lei si è fermata a metà. Tu sai come continua."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La linfa
          testo: |
            «E chi lo vede secco non lo tagli, perché la linfa scende prima di risalire» dici, con la cadenza
            che Ottilia Sanvel fa usare ai novizi all'alba, nel corridoio. Aurenne si volta di scatto. Ti
            guarda come si guarda qualcuno di casa, poi abbassa gli occhi sull'artiglio.

            «Da bambina lo dicevo anch'io, e non sapevo che cosa volesse dire» dice. «Lasciami alle mie
            preghiere. Non tornerò a combattere, e non voglio più essere la guida di nessuno.» Torna a
            inginocchiarsi davanti all'altare. «Ti auguro ogni fortuna, Portatore. Spero di rivederti.»

            Quando esci Vantes è seduto sull'ultima panca della navata con il breviario chiuso sulle
            ginocchia. Ha un dito infilato fra le pagine, e ti saluta con un cenno senza alzarsi.
          pe: { empatia: 5 }
          effetti: { pista.capomozzo: 1, tormento: -0.5 }
      - testo: "Chiederle del congegno come di un reperto"
        descrizione: "Sulle piattaforme, di un reperto dei Precursori si chiede prima che cosa fa e poi che cosa ti toglie. Lei l'ha usato abbastanza da saperlo."
        quando: [origine.apprendista-raschiatore >= 1]
        costo: 0
        esito:
          titolo: Quello che ti toglie
          imposta: { capomozzo.congegno: 1 }
          testo: |
            Le chiedi del disco come si chiede di un reperto a chi l'ha portato su, prima a che cosa serve e
            poi quanto costa usarlo. «Manda un segnale che confonde le macchine dei Precursori» dice. «Per
            qualche minuto non sanno più chi è il nemico. Poi si scarica, e si ricarica con i cristalli
            conduttori, oppure da solo, col tempo.»

            Alla seconda domanda stringe l'artiglio fino a farsi scricchiolare le nocche, con un suono secco
            da legno vecchio. «Può anche comandarle, se gli dai abbastanza volontà, e a ogni ordine dentro di
            me si spegneva un ricordo.» Sulle piattaforme un reperto così lo avreste calato di nuovo giù con
            la corda, e ti accorgi che lo pensi davvero.

  # ------------------------------------------------------------ 9 → 10 · i Raschiatori
  - id: i-raschiatori
    presso: grifone-di-ferro
    immagine: personaggi/tenebra
    titolo: I Raschiatori
    sommario: "Al tavolo vicino alla finestra del Grifone siedono Tenebra e Ferro. Sanno dov'è l'argano, e sanno dire di no."
    luogo: Locanda del Grifone di Ferro, il tavolo vicino alla finestra
    area: ponti-sospesi
    requisiti: [pista.capomozzo == 9]
    testo: |
      Il Grifone di Ferro è pieno a metà. Brunella ti mette davanti una scodella di zuppa senza che tu la
      chieda, e al tavolo vicino alla finestra siedono Tenebra e Ferro. Il tavolo è una sola asse di quercia,
      segnata dai coltelli di chi ci ha tagliato il pane per anni.

      Tenebra sta seduto di taglio, con la bruciatura che gli fa una filigrana di vetro sotto la pelle della
      guancia, e non tocca il suo boccale. Ferro, cioè Dragna Gro-Malog, ha i lati della testa rasati e
      stringe il boccale come un elmo, con due dita in meno alla mano sinistra.

      {origine apprendista-raschiatore} Tenebra alle reclute insegna a riconoscere la paura, e tu sei
      stat{o|a} una delle reclute. Adesso ti guarda le mani nello stesso modo, e le mani smettono di tremare.

      Chiedi a Ferro di portarti giù, fino al Labirinto di Darn-Morakh.

      «No» dice lei. «La Salvaguardia si chiude sugli intrusi ogni volta più in fretta, e il primo strato
      l'abbiamo raschiato fino all'osso. Ci sono rimasti corridoi vuoti e nidi di macchine sveglie. In fondo
      non si va. Punto.»

      Tenebra non ha ancora aperto bocca. «Hai qualcosa che noi non sappiamo?» chiede.
    opzioni:
      - testo: "Mostrare il congegno"
        descrizione: "Il disco con cui Aurenne comandava le macchine di Capomozzo."
        requisiti: [oggetto.congegno-di-controllo >= 1]
        esito:
          titolo: Odio quelli che parlano come me
          testo: |
            Posi il congegno sul tavolo, fra il boccale di Tenebra e la tua zuppa, e racconti delle macchine
            di Capomozzo che si fermavano a metà passo. Ferro si china sul disco e lo guarda da un palmo di
            distanza, con le mani ben lontane dal tavolo. «Diglielo tu» dice a Tenebra, senza staccarti gli
            occhi di dosso. «Digli che non abbiamo uomini. Sono morti o feriti, e quelli rimasti sono già giù
            nelle rovine qui intorno. Quel poco che resta lo tengo per la città.»

            Le rispondi che ti basta qualcuno che sappia dov'è l'argano e come si libera il freno, e che al
            resto pensi tu. «Odio quelli che parlano come me» dice alla fine, e allenta la presa sul boccale.
          effetti: { rep.raschiatori: 0.5 }
          segue: l-orlo-della-cicatrice
      - testo: "Ripeterle la frase degli obelischi"
        descrizione: "Ai suoi allievi Ferro fa imparare a memoria una scritta della Strada Antica. Tu sei un{o|a} di loro."
        requisiti: [raschiatore >= 1]
        esito:
          titolo: "Un{o|a} dei suoi"
          testo: |
            Le ripeti la frase che fa imparare alle reclute, quella incisa sugli obelischi della Strada
            Antica, che discendere è fatale e che non discendere è morire incompleti. Ferro grugnisce e si
            passa la mano sui lati rasati della testa. «I miei non li mando a morire» dice, e guarda Tenebra.
            «Diglielo tu che non abbiamo uomini.»

            Tenebra la guarda a sua volta senza dire niente, finché Ferro non batte il boccale sul tavolo e la
            birra le schizza sulle nocche. «Odio quelli che parlano come me» dice, e scuote la testa.
          effetti: { rep.raschiatori: 0.5 }
          segue: l-orlo-della-cicatrice
      - testo: "Insistere finché Ferro cede"
        descrizione: "Ferro dice di no per mestiere. Bisogna farle capire che scenderai comunque, anche senza di lei."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Con lei o senza
          testo: |
            Le dici che sotto Capomozzo sei sces{o|a} da sol{o|a} e che hai lasciato un Costruttore sotto le
            macerie. Nel Labirinto ci scenderai comunque, magari da un pozzo cieco dei contrabbandieri se
            l'argano lei non te lo dà. Ferro ti ascolta con il boccale fermo a metà strada fra il tavolo e la
            bocca. «Diglielo tu» dice a Tenebra, senza voltarsi. «Digli che non abbiamo uomini.»

            Alla fine a Ferro scappa una specie di risata dal naso. «Odio quelli che parlano come me» dice, e
            scuote la testa.
          effetti: { rep.raschiatori: 0.5 }
          segue: l-orlo-della-cicatrice
        fallimento:
          titolo: Punto
          testo: |
            Ferro ti lascia parlare fino in fondo, poi batte il boccale sul tavolo una volta sola. Il
            cucchiaio ti salta nella scodella, e mezza sala si gira. «Ho detto no» dice. «Torna quando hai
            qualcosa da mostrarmi oltre alla faccia tosta.» Tenebra ha smesso di guardarti, e capisci che per
            stasera è finita. Ti alzi con le orecchie che scottano e la zuppa ancora a metà, e Brunella te la
            porta via passando, con uno sguardo di rimprovero per lo spreco.
          effetti: { tormento: 1 }
      - testo: "Proporle un contratto da cartografia"
        descrizione: "Quarant'anni fa la Gilda pagava i Raschiatori a metro di mappa."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: A metro di mappa
          testo: |
            Posi la licenza della Gilda sul tavolo, accanto al boccale di Tenebra, e le parli della
            cartografia del sottosuolo, di quando la Gilda pagava i Raschiatori a metro di mappa. Ferro la
            gira verso di sé con un dito e legge il sigillo senza toccare il resto. Le dici che ti bastano
            l'argano e qualcuno che sappia liberare il freno, e che i turni persi li segni tu sul registro
            della Casa dei Nodi, a metro, come allora.

            «Diglielo tu che i miei non li vendo a metro» dice a Tenebra. Alla fine le scappa una specie di
            risata dal naso. «Odio quelli che contano come me» dice, e allenta la presa sul boccale.
          effetti: { rep.raschiatori: 0.5 }
          segue: l-orlo-della-cicatrice
      - testo: "Dirle quale pozzo dei contrabbandieri prenderesti"
        descrizione: "In Città Bassa si sa quali pozzi ciechi portano giù senza passare dall'argano. Ferro lo sa meglio di te, e sa anche quanti ne risalgono."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il pozzo cieco
          testo: |
            Le dici che se l'argano non te lo dà scendi da un pozzo cieco dei contrabbandieri, e le dici anche
            quale, con la strada per arrivarci e il nome di chi tiene la corda. Tenebra alza gli occhi dal
            boccale e ti guarda le mani, come guarda quelle delle reclute. «Da lì sono scesi in tanti» dice
            Ferro a Tenebra, senza voltarsi. «Diglielo tu quanti ne sono risaliti.»

            Alla fine a Ferro scappa una specie di risata dal naso. «Odio quelli che parlano come me» dice, e
            allenta la presa sul boccale.
          effetti: { rep.raschiatori: 0.5 }
          segue: l-orlo-della-cicatrice

  - id: l-orlo-della-cicatrice
    immagine: ambientazione/cicatrice-del-mondo
    titolo: L'orlo della Cicatrice
    tipo: seguito
    luogo: I piloni sull'orlo della Cicatrice, di sera
    area: ponti-sospesi
    requisiti: [pista.capomozzo == 9]
    testo: |
      Fuori la sera ha l'odore della pioggia sul ferro. Tenebra e Ferro ti guidano per i vicoli dei Ponti,
      oltre i magazzini chiusi della Gilda dei Mercanti, fino ai piloni dove il vento sale dalla Cicatrice. Il
      ponte sospeso che porta all'argano pende sopra un vuoto color piombo e scricchiola a ogni passo. Le assi
      sono nere e molli d'umido, e sotto il tacco i chiodi ci girano dentro.

      {origine mercante-dei-ponti} Davanti ai magazzini della Gilda conti le saracinesche abbassate senza
      volerlo. Stasera la Gilda sta tutta dalla parte opposta a quella dove vai tu.

      La piattaforma è una ruota di acciaio annerito, percorsa da incisioni dei Precursori come vene spente.
      L'acciaio non ha un punto di ruggine, e sotto le dita le incisioni hanno ancora gli spigoli vivi. Ferro
      controlla le catene una per una e poi si sputa sulle mani. «La sera prima si prova sempre» dice.

      Libera il freno, e la piattaforma scende di un palmo sotto i tuoi stivali. Lungo la parete della
      voragine la Strada Antica si accende in una linea di luce fredda che corre verso il basso e si spegne.
      Ti dici che il peso della piattaforma avrà mosso qualche vecchio congegno nella parete. La luce è scesa
      molto più in basso di dove arrivano le catene, e da una fessura della roccia una nuvola di pipistrelli
      esce tutta insieme e si allontana lungo la parete. Nel mezzo della Cicatrice si vedono le sagome sospese
      del Labirinto di Darn-Morakh.

      Ferro tira la leva, e la piattaforma si ferma con uno scossone.
    opzioni:
      - testo: "Restare a guardare il Labirinto"
        descrizione: "Domani, o fra una settimana. Stasera ti basta sapere che è lì."
        costo: 0
        esito:
          titolo: Sull'orlo
          testo: |
            Resti sulla piattaforma finché il vento non ti fa lacrimare. Ferro ripassa le catene con il palmo,
            una maglia alla volta, poi si pulisce la mano sui calzoni. «L'argano è qui» dice. «Vieni al
            Grifone quando sei pront{o|a} e me lo dici, e io libero il freno per davvero.»

            Tenebra ti aspetta in cima al ponte sospeso, con la bruciatura che luccica appena nel buio. Quando
            gli passi accanto ti tocca la spalla una volta sola, come si fa con le reclute, e ti augura «Buona
            caccia» a voce bassa, senza fermarsi.

            Dal ponte ti volti indietro. La piattaforma dondola piano sulle catene, vuota, sopra il buio della
            Cicatrice. A ogni folata le catene battono sul bordo d'acciaio con un colpo sordo.

            *Fine del Capitolo I*
          pe: { resilienza: 5 }
          effetti: { pista.capomozzo: 1, rep.raschiatori: 0.5, racconto: 1 }
      - testo: "Ascoltare il vento che sale dalla Cicatrice"
        descrizione: "Al Circolo ti hanno insegnato ad ascoltare il Bosco prima di entrarci."
        quando: [origine.figlio-del-circolo >= 1]
        costo: 0
        esito:
          titolo: Il vento del Labirinto
          testo: |
            Chiudi gli occhi sulla piattaforma e ascolti, come al Circolo prima di entrare nel Bosco. Il vento
            sale dalla Cicatrice a folate, e fra una folata e l'altra c'è una pausa lunga, come fra due onde,
            che viene da molto più in basso dell'argano. Nella pausa l'aria cambia verso e per qualche battito
            ti scende davanti alla faccia, dentro la voragine. Quando riapri gli occhi Ferro ti sta guardando
            con la mano sulle catene. «L'argano è qui» dice. «Vieni al Grifone quando sei pront{o|a} e me lo
            dici, e io libero il freno per davvero.»

            *Fine del Capitolo I*
          pe: { natura: 5 }
          effetti: { pista.capomozzo: 1, rep.raschiatori: 0.5, racconto: 1 }

  # ------------------------------------------------------------ gli Averi: il diario di Aurenne
  - id: leggere-il-diario-di-aurenne
    titolo: Il diario di Aurenne
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/cripta-di-idrian-sollen
    requisiti: [oggetto.diario-di-aurenne >= 1]
    sommario: "Un quaderno dalla copertina di stoffa, scritto da una ragazza nell'arco di quattro anni. L'ultima pagina non ha data."
    testo: |
      Il quaderno ha la copertina di stoffa azzurra consumata agli angoli e un nastro masticato in punta. Le
      prime pagine hanno una grafia tonda e ordinata da scolara, con la data in cima e qualche fiore disegnato
      a margine. Più avanti le lettere si stringono e l'inchiostro cambia colore da una riga all'altra, dal
      nero a un bruno slavato. Verso la fine il pennino ha bucato la carta in più punti, e sul foglio dopo si
      leggono ancora i solchi delle lettere premute.

      La prima data è d'estate, nel centoquarantuno. L'ultima pagina scritta non ne ha nessuna.

      Lo sfogli piano, come una lettera indirizzata a qualcun altro. *Prima di Nhar'Kael c'era una ragazza che
      disegnava fiori nei margini.* Fra due pagine c'è un fiore secco, schiacciato tanto a lungo che la carta
      intorno ha preso il suo colore.
    opzioni:
      - testo: "L'estate del centoquarantuno"
        costo: 0
        esito:
          titolo: Un angelo
          testo: |
            La prima pagina racconta un compleanno, e in margine c'è un fiore a cinque petali colorato con
            cura dentro le linee. Il padre l'ha lasciata uscire prima dalle lezioni per prepararle la torta, e
            fuori dall'Accademia alcuni ragazzi l'hanno presa a sassate. *Uno mi ha colpita sopra l'occhio e
            ha sanguinato tanto. Mi hanno chiamata mostro e intanto ridevano. A casa papà mi ha detto che
            nessuno è come me, e che i capelli d'argento e gli occhi viola sono una benedizione, perché io
            sono il suo angelo*.
      - testo: "L'inverno all'Accademia"
        costo: 0
        esito:
          titolo: Gli uccellini sulle scale
          testo: |
            Sulle pagine dell'inverno l'inchiostro è annacquato, e le righe salgono storte verso destra. *Il
            Maestro Temmerin ci ha dato tanti di quei compiti che non li finirò mai. Amyll e le altre ridevano
            e mi indicavano, e quando mi sono chiusa in bagno per non sentirle hanno spinto i banchi contro la
            porta. Sono rimasta lì fino a notte, al buio, perché le candele si erano consumate. Mi ha aperto
            il signor Osric, che era seduto sulle scale a intagliare uccellini di legno*.

            Qualche giorno dopo c'è un nome solo, sottolineato due volte. *Rennick Dole mi ha seguita dalla
            taverna fino a casa con i suoi amici, gridandomi dietro una parola che non voglio scrivere*.

            {origine allievo-di-torvessa} Che i compiti di Temmerin siano troppi lo sai per esperienza.
            Leggerlo nella grafia di lei ti fa l'effetto di un banco dove qualcuno ha già inciso le iniziali,
            nel punto esatto dove le avresti incise tu.

            {origine figlio-della-citta-bassa} Rennick Dole in città lo ricordano ancora come il bullo della
            scuola. Nei vicoli la parola che si grida dietro a una ragazza così la indovini anche senza che
            lei la scriva, e ti viene voglia di non averla indovinata.
      - testo: "La strada di Laresh e l'Abbazia"
        costo: 0
        esito:
          titolo: Benedetta
          testo: |
            Qui la grafia corre veloce, e le ultime parole di ogni riga si schiacciano contro il bordo. *Sulla
            strada di Laresh mi ha circondata una dozzina di contadini. Volevano che li guarissi dalle piaghe,
            e uno voleva sapere quando piantare le patate. Diceva che sono benedetta dal Grande Albero Rosso e
            che la mia voce caccia gli spiriti. Gli ho urlato contro e sono scappata. Stasera ho pregato
            l'Albero, e mi ha risposto un'altra voce. È durata poco, ma l'ho sentita*.

            Il padre ha deciso di mandarla fra le novizie del Velo per il suo diciassettesimo compleanno,
            senza chiederle niente. *Amo l'Albero, ma una suora non la voglio fare. Voglio solo uscire, ed
            essere come le altre*.
      - testo: "Il ragazzo di Pannion"
        costo: 0
        esito:
          titolo: Delek
          testo: |
            L'angolo di questa pagina è piegato, e la piega è consumata a forza di riaprirla. Delek viene da
            Pannion e fa il carbonaio, ha le mani piene di calli e la porta a mangiare sull'orlo della
            Cicatrice. *È il primo ragazzo che mi parla come se fossi una persona normale*. C'è una grotta
            lungo la strada dell'Acciaieria, e un ragazzo che promette di portarla a Pannion e di sposarla.

            *Credo di essere incinta, glielo dico stasera*. Delek è ripartito per Pannion e le ha detto che
            per lui era stata un passatempo. Il giorno dopo il padre l'ha mandata a pregare. *Tre ore in
            ginocchio, e l'Albero non ha risposto. Ottilia è gentile, ma le sue parole mi scivolano addosso*.
      - testo: "Il signor Wren"
        costo: 0
        esito:
          titolo: Le Notti Cucite
          testo: |
            Aurenne fa sogni che non descrive, e il padre non la lascia uscire per paura del Cucitore. *Ma lo
            so che si vergogna di me*. Una notte scappa lo stesso, e per strada incontra il signor Wren, a cui
            sono caduti alcuni uccellini di legno. *Mi ha detto che una ragazza bella come me non dovrebbe
            andare in giro da sola col buio*.

            Due settimane più tardi, nel centoquarantacinque, la pagina è macchiata di gocce rotonde che hanno
            sciolto l'inchiostro. *Hanno ucciso il signor Wren. Dicono che il Cucitore era lui, e dalle
            finestre alte del santuario vedo bruciare la sua casa. Il signor Osric Wren era sempre gentile con
            me*.
      - testo: "Le ultime pagine con una data"
        costo: 0
        esito:
          titolo: Sette mesi
          testo: |
            Le pagine che seguono sono brevi, e quasi nessuna riga arriva al margine. *Faccio sogni orribili.
            Credo che il mio bambino sappia che sono maledetta*. Qualche giorno dopo la grafia scende storta
            lungo il foglio, e il pennino ha forato la carta due volte. *C'è sangue, ed è troppo presto, ha
            solo sette mesi. Ho sentito papà Idrian che parlava con Mirta per farmi abortire. Io il mio
            bambino non voglio perderlo. Ti prego, Grande Albero, salva il mio bambino e non farò mai più
            niente di sbagliato*.

            Il resto della pagina è vuoto.
      - testo: "La pagina senza data"
        costo: 0
        esito:
          titolo: Il santuario brucia
          testo: |
            L'ultima pagina scritta non ha data, e la grafia sembra quella di un'altra persona. È diritta e
            calma, con le lettere strette e regolari, e non c'è una sola cancellatura. L'inchiostro è nero e
            uguale dalla prima riga all'ultima, e il pennino non ha mai forato la carta.

            *Nhar'Kael, questo è il suo nome. Lei mi ha ascoltata e ha capito il mio dolore, e mi ha dato la
            chiarezza che cercavo. I miei fedeli dell'Anonimo crescono di giorno in giorno. Da quando lei mi
            ha scelta è così facile piegare le persone. Mio padre brucia, e il santuario con lui. Un giorno
            toccherà a tutta la città*.
      - testo: "Chiudere il diario"
        costo: 0
        esito:
          testo: "Richiudi piano il diario sul fiore secco e lo infili in fondo alla bisaccia, sotto tutto il resto."

  # ------------------------------------------------------------ gli Averi: il congegno di controllo
  - id: decifrare-congegno
    titolo: Decifrare il congegno
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.congegno-di-controllo >= 1, decifrato.congegno-di-controllo == 0]
    sommario: "Capire come funziona un reperto dei Precursori prima che sia lui a capire te."
    testo: |
      Il disco pesa più del dovuto, e il metallo grigio non ha una giuntura che dica come l'hanno chiuso.
      Lungo il bordo ha una corona di piccoli cristalli quasi tutti spenti, e al centro una conca liscia dove
      il pollice va a posarsi da solo. Quando lo tieni in mano senti un ronzio basso nei denti, e ti torna in
      mente il passo storto delle macchine della Salvaguardia ogni volta che Aurenne premeva la conca.

      Lo tieni a lungo sul palmo, e il metallo non prende il calore della mano. Il ronzio resta uguale anche
      quando lo allontani a braccio teso, e lo senti sempre nei denti.

      {tecnologia Media} La conca è consumata appena dalla parte del pollice destro. Qualcuno l'ha usato a
      lungo e sempre con la stessa mano, finché un metallo che non prende un graffio si è consumato sotto un
      dito.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: congegno-di-controllo
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Capisci quali cristalli della corona segnano la carica e come va tenuto il pollice per non premere
            troppo. Il ronzio si abbassa e si fa regolare, e per qualche minuto il disco resta tiepido contro
            il palmo, come un sasso rimasto al sole. I cristalli che si accendono non stanno in fila. Saltano
            lungo la corona in un ordine che torna uguale ogni volta che sollevi il pollice.
          effetti: { decifrato.congegno-di-controllo: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            Tieni premuta la conca troppo a lungo, e il ronzio ti sale dai denti fino alle tempie. Quando posi
            il disco non ricordi più che cosa stavi facendo un momento prima, e ti ritrovi a fissare la tua
            mano come se fosse di qualcun altro. Sul polpastrello del pollice c'è il segno rosso del bordo
            della conca, e ci mette parecchio a sbiancare.
          effetti: { tormento: 1 }
      - testo: "Fare come ti ha spiegato Aurenne"
        reperto: congegno-di-controllo
        descrizione: "In Cattedrale ti ha detto come lo usava. Sapere dove mettere le mani aiuta, anche se lei ti consigliava di tenerle lontane."
        requisiti: [capomozzo.congegno >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, resilienza], difficolta: Facile }
        successo:
          titolo: Decifrato
          testo: |
            Fai come ti ha spiegato lei, con un tocco breve e il pollice che si ritira subito. I cristalli
            della corona si accendono uno alla volta a partire da quello più vicino al pollice, e il ronzio si
            ferma su una nota sola. Ti resta addosso una stanchezza leggera, come dopo una notte di guardia.
            Aurenne aveva ragione, e la cosa non ti consola quanto dovrebbe.
          effetti: { decifrato.congegno-di-controllo: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            Tieni il pollice sulla conca un attimo più del dovuto, e senti qualcosa che dall'altra parte ti
            spinge indietro. La spinta parte dal centro della conca e ha la misura esatta del tuo pollice, e
            intorno il metallo resta freddo. Molli il disco sul tavolo e per un'ora hai le dita intorpidite, e
            quando provi a chiudere il pugno lo fanno con un attimo di ritardo.
          effetti: { tormento: 1 }
