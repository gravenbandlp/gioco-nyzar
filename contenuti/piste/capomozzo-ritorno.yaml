# La pista di Capomozzo, ultima parte: il ritorno a Qir-Azel e la fine del Capitolo I (pista 6 → 10),
# più i due storylet degli Averi legati alla pista: il diario di Aurenne e la decifrazione del congegno.
quality:
  - { id: capomozzo.congegno, nome: Aurenne ti ha spiegato il congegno, categoria: stato, nascosta: true }

storylet:
  # ------------------------------------------------------------ 6 → 7 · il ritorno
  - id: il-ritorno-a-qir-azel
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Il ritorno a Qir-Azel
    sommario: "Due giorni e mezzo di strada con una donna che non si sveglia, e in fondo la navata della Cattedrale."
    luogo: Cattedrale del Velo, la navata
    area: quartieri-alti
    requisiti: [pista.capomozzo == 6]
    testo: |
      Per due giorni e mezzo di strada Aurenne non apre gli occhi. Viaggia
      stesa su una lettiga di rami legata con la cinghia della bisaccia, che
      salta su ogni sasso, e la notte, accanto al fuoco, il suo respiro è
      così lento che ti chini più volte ad ascoltarlo. Sotto la pelle le
      pulsano chiazze scarlatte simili a braci coperte di cenere, e ogni volta
      che la tocchi ti strofini le mani sui calzoni senza volerlo.

      {resistenza Media fallita} La cinghia della lettiga ti ha segato le
      spalle per tutta la strada. Le senti ancora adesso, due righe di fuoco
      che il corpo ti mostra con un certo orgoglio.

      Le porte della Cattedrale del Velo si aprono con un colpo sordo. Dentro
      c'è odore d'incenso e di cera, e sotto c'è quello di ferro bruciato che
      ti porti addosso dalle rovine. In fondo alla navata Padre Vantes e
      Julia Castaldi parlano a bassa voce con Toren Galdrick, che è salito
      dalla Caserma con gli stivali ancora sporchi della ronda, e al rumore
      delle porte si voltano tutti insieme.

      Julia ti viene incontro per prima, con le mani strette al petto, e la
      voce roca le si rompe a metà di un ringraziamento al Grande Albero.
      Galdrick guarda la donna che hai steso su una panca e ti chiede soltanto
      se è viva, con la stessa voce che userebbe per chiedere l'ora. Vantes
      le si inginocchia accanto, le posa due dita sulla fronte e le tiene lì
      a lungo.

      {origine rampollo-dei-quartieri-alti} Ai tavoli del Consiglio hai
      sentito Julia Castaldi ridere un tono sotto, come si deve. Questa voce
      rotta a metà non te l'hanno insegnata a nessuna età, e non sai bene dove
      guardare.

      {origine accolito-del-velo} Nella tenda dei feriti hai visto Vantes
      chiudere ferite finché la faccia gli diventava grigia. Tiene le dita
      sulla fronte di Aurenne nello stesso modo, e le tue mani cercano le
      bende in una borsa che stasera non hai.

      {magia Media} Sotto le dita del prete il Mana di Aurenne si muove
      storto, in cerchi stretti, come l'acqua intorno a uno scoglio.
      Qualcosa, là dentro, occupa un posto che non è suo.

      «È contaminata» dice piano. «C'è una presenza dentro di lei, e la sento
      sotto le dita.» Ritira la mano e si pulisce le dita sulla tonaca, senza
      accorgersene. *Allora non succede solo a me.* Le tue mani, intanto,
      hanno già trovato la stoffa dei calzoni.
    opzioni:
      - testo: "Dire a Galdrick com'è finita con Balthog"
        descrizione: "Prima di tutto il resto, lo sceriffo vuole sapere questo."
        immagine: personaggi/toren-galdrick
        requisiti: [balthog == 1]
        costo: 0
        esito:
          titolo: Il trono vuoto
          testo: |
            Gli dici che Balthog il Prescelto è morto nella sua sala del
            trono, sotto il teschio di cavallo dello schienale. Mentre lo dici
            ti torna in bocca il sapore della polvere di quella sala. Julia lascia cadere le spalle, come se se lo concedesse solo adesso.
            «Allora è finita» dice, «o quasi.»

            Galdrick non sorride. Tiene i pollici nella cintura e scuote la
            testa una volta sola. «Ci sono ancora bande sparse per le
            campagne, e a Fondobosco sono più di quanti ne potremmo contare»
            dice. «Senza un capo, però, non ci verranno più addosso tutti
            insieme. Il fronte si spezza lì.» Tira fuori il taccuino dalla
            giubba e ci scrive una riga corta.

            {politica-ed-economia Media} Una guerra senza capo diventa una
            somma di furti. Costa meno in sangue e di più in pattuglie, e
            Galdrick sta già facendo il conto delle seconde.
      - testo: "Dire a Galdrick com'è finita con Balthog"
        descrizione: "Prima di tutto il resto, lo sceriffo vuole sapere questo."
        immagine: personaggi/toren-galdrick
        requisiti: [balthog == 2]
        costo: 0
        esito:
          titolo: Battuto davanti ai suoi
          testo: |
            Gli dici che hai battuto Balthog davanti ai suoi orchi e che l'hai
            lasciato a terra davanti al trono, vivo. Galdrick ti guarda a lungo
            con i pollici nella cintura, come se volesse misurare quanto ti è
            costato, e alla fine annuisce. «Un orco battuto davanti
            alla sua tribù non comanda più nessuno» dice. «Forse è meglio di
            un morto da vendicare.»

            Julia si siede sul bordo del tavolo, come se se lo concedesse solo
            adesso, e dice che allora è finita, o quasi. Lo sceriffo la corregge
            senza alzare la voce. Restano bande sparse per le campagne, e a
            Fondobosco gli orchi sono tanti, ma senza un capo non verranno più tutti insieme.
            Tira fuori il taccuino dalla giubba e ci scrive una riga corta,
            sottolineandola due volte.
      - testo: "Dire a Galdrick com'è finita con Balthog"
        descrizione: "Prima di tutto il resto, lo sceriffo vuole sapere questo."
        immagine: personaggi/toren-galdrick
        requisiti: [balthog == 0]
        costo: 0
        esito:
          titolo: Ancora vivo
          testo: |
            Gli dici che Balthog è ancora vivo, e che sotto la fortezza ci
            sei sceso lo stesso. Galdrick aggrotta la fronte e ci pensa su con
            i pollici nella cintura, e per un momento ha l'aria di un uomo che
            non dorme da Ghoran. «Un capotribù a cui hanno tolto
            chi gli dava gli ordini» dice alla fine. «Torna a essere un orco
            come gli altri, solo più grosso.»

            Julia si slaccia il colletto, come se se lo concedesse solo adesso,
            e dice che allora è finita, o quasi. Lo sceriffo la corregge senza alzare
            la voce. Restano bande sparse per le campagne, e a Fondobosco gli
            orchi sono tanti, ma senza la donna che li teneva in fila non
            verranno più tutti insieme. Tira fuori il taccuino dalla giubba e
            ci scrive una riga corta.

            {rissa Media} Un orco grosso senza qualcuno che gli dica cosa fare
            picchia chi gli capita davanti, un villaggio alla volta. Galdrick lo sa, e
            sta già contando i villaggi.
      - testo: "Dire chi serviva Aurenne"
        descrizione: "Vantes ha sentito qualcosa sotto le dita. Il nome di quel qualcosa lo conosci tu."
        immagine: personaggi/padre-vantes
        costo: 0
        esito:
          titolo: Nhar'Kael
          testo: |
            Racconti quello che Isvaro scriveva nel diario, della nuova madre
            di Aurenne e dei resti di Sollen bruciati al santuario di
            Capomozzo, e di Garin che sotto la fortezza la chiamava pazza per
            quello che aveva fatto ai mascherati del Culto dell'Anonimo. Quando
            dici il nome di Nhar'Kael nella navata si sentono sfrigolare le
            candele. Julia sbianca, e Galdrick stringe il pugno sulla cintura.

            {resilienza Difficile fallita} Il nome ti resta sulla lingua dopo
            averlo detto, con un sapore di metallo e di fiori marci, e per un
            momento non sei sicuro di essere stato tu a pronunciarlo.

            Vantes si fa il segno del velo. «Nhar'Kael» ripete piano, e ti
            posa due dita sul polso, come per sentire se il nome ha lasciato
            un segno anche su di te. «Allora tutto questo viene da più in
            basso di una setta» dice, «e da molto più lontano di quanto
            pensassimo.» Le sue dita sul tuo polso sono fredde, e ci restano
            un po' più a lungo di quanto servirebbe.
      - testo: "Raccontare della maschera"
        descrizione: "Quando il colosso ha vacillato il tempo si è fermato, e una voce che era la tua ti ha chiamato Portatore dell'Alba."
        immagine: personaggi/toren-galdrick
        esito:
          titolo: Le storie erano vere
          testo: |
            Racconti del Costruttore e della maschera spaccata che si è
            ricomposta davanti a te, e del coro che ti ha chiamato Portatore
            dell'Alba con la tua stessa voce. Mentre parli ti accorgi di
            toccarti il viso, nel punto dove la maschera si è posata. La pelle
            lì è normale, ed è proprio questo a non convincerti.

            {espressivita Media} La navata porta lontano anche la voce bassa.
            Racconti piano, e il silenzio fra una candela e l'altra fa il
            resto meglio di qualunque teatro.

            Julia si porta una mano alla bocca. Galdrick chiude gli occhi e
            mormora soltanto «Allora le storie erano vere…» Quando li riapre
            ti parla come parla alle guardie in Caserma, con il taccuino già
            in mano, perché è l'unico modo che conosce per rimettere le cose al
            loro posto. «Domani sera la Madre del Velo vorrà vederti nella
            Cripta.»

            Julia indica il congegno che ti spunta dalla tasca. «Quello non
            toccarlo e non usarlo» dice con la voce roca. «Aspetta che lei si
            svegli, è l'unica che sa come funziona.»
          pe: { espressivita: 5 }
          effetti: { pista.capomozzo: 1, rep.velo: 0.5 }
      - testo: "Parlare soltanto del congegno"
        descrizione: "Della maschera, per ora, puoi anche tacere. Il disco dei Precursori invece è sul tavolo, e lo vedono tutti."
        immagine: personaggi/julia-castaldi
        esito:
          titolo: Servirà tempo
          testo: |
            Posi il congegno sul tavolo accanto alla panca e spieghi che
            Aurenne lo usava per comandare le macchine della Salvaguardia.
            Galdrick sposta due libri per guardarlo meglio e scuote la testa.
            «Un disco che comanda quelle cose» dice. «Sembra una follia.»

            {tecnologia Media} Il disco ronza appena, anche fermo sul legno.
            Uno strumento che lavora quando nessuno lo tocca non è mai del
            tutto spento.

            «Forse, ma è l'unica pista che abbiamo» dice Julia con la voce
            roca. «Non toccarlo e non usarlo. Aspetta che si svegli, lei sa
            come funziona.»

            Vantes annuisce senza staccare le dita dalla fronte di Aurenne.
            «La terrò in vita, ma servirà tempo.» Quando sei già sulla porta
            ti richiama, e ti dice che la Madre del Velo ti aspetta domani
            sera nella Cripta, e lo dice come una cosa decisa da giorni. Della
            maschera non hai detto niente, e la faccia, sotto la pelle, ti
            prude lo stesso.
          pe: { politica-ed-economia: 5 }
          effetti: { pista.capomozzo: 1, rep.velo: 0.5 }
      - testo: "Spiegare il congegno come una lezione"
        descrizione: "Al Festival i cristalli del banco dell'Accademia hanno vibrato tutti insieme prima che le macchine scendessero dai tetti. Questo disco parla la stessa lingua, e tu sai come si spiega a chi non la conosce."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Dalla corona alla conca
          testo: |
            Posi il congegno sul tavolo accanto alla panca e lo spieghi come
            Temmerin spiega un cristallo nuovo, dall'esterno verso il centro,
            senza mai toccarlo. Racconti dei sei cristalli del banco che al
            Festival hanno vibrato tutti insieme, e dici che il disco manda lo
            stesso genere di segnale, soltanto più forte. Galdrick ti segue
            muovendo le labbra, e a metà smette di scuotere la testa.

            «Allora è l'unica pista che abbiamo» dice Julia con la voce roca.
            «Non toccarlo e non usarlo. Aspetta che si svegli, lei sa come
            funziona.»

            Vantes annuisce senza staccare le dita dalla fronte di Aurenne, e
            quando sei già sulla porta ti dice che la Madre del Velo ti aspetta
            domani sera nella Cripta. Della maschera non hai detto niente, e la
            faccia, sotto la pelle, ti prude lo stesso.
          pe: { tecnologia: 5 }
          effetti: { pista.capomozzo: 1, rep.velo: 0.5 }
      - testo: "Fare rapporto a Julia come in Consiglio"
        descrizione: "Ai tavoli del Consiglio prima si dicono i fatti e solo dopo le richieste. Julia Castaldi ascolta meglio chi le parla nella sua lingua."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Prima i fatti
          testo: |
            Aspetti che Julia abbia finito di ringraziare l'Albero, poi le fai
            rapporto con il tono dei giorni di consiglio, mettendo i fatti
            prima delle richieste. Le dici del disco che Aurenne usava per comandare
            le macchine, e lo posi sul tavolo accanto alla panca come si posa
            una mozione. Julia si ricompone mentre parli, una frase alla volta,
            e quando hai finito è di nuovo la Rappresentante.

            «Non toccarlo e non usarlo» dice con la voce roca. «Aspetta che si
            svegli, lei sa come funziona.» Galdrick scrive una riga sul
            taccuino, e Vantes, senza staccare le dita dalla fronte di Aurenne,
            ti dice che la Madre del Velo ti aspetta domani sera nella Cripta.
            Della maschera non hai detto niente, e in quella lingua nessuno te
            l'ha chiesto.
          pe: { galateo: 5 }
          effetti: { pista.capomozzo: 1, rep.velo: 0.5 }

  # ------------------------------------------------------------ 7 → 8 · la Madre del Velo
  - id: la-madre-del-velo
    presso: cattedrale-del-velo
    immagine: personaggi/madre-del-velo
    titolo: La Madre del Velo
    sommario: "La sera dopo, nella Cripta sotto l'altare, ti aspetta chi nessuno ha mai visto in volto."
    luogo: Cattedrale del Velo, la Cripta, di sera
    area: quartieri-alti
    requisiti: [pista.capomozzo == 7]
    testo: |
      La sera dopo Padre Vantes ti accompagna fino alla scala della Cripta e
      si ferma sul primo gradino. «Io resto qui» dice, e ti posa due dita sul
      polso più a lungo del solito. Scendi gli ultimi gradini da solo. La
      Cripta è una sala bassa sotto l'altare dove l'aria è ferma e densa
      d'incenso, e il velo che copre l'altare si muove appena anche se non
      c'è vento. Su un gradino qualcuno ha dimenticato una scopa, appoggiata
      al muro per bene, perché anche qui sotto la polvere va tolta.

      {galateo Media} Vantes si è fermato sul primo gradino, e nessuno gliel'ha
      chiesto. Dove un prete anziano non scende, un ospite cammina piano e
      aspetta che gli si rivolga la parola.

      {origine accolito-del-velo} Da novizio ti hanno insegnato a non chiedere
      cosa c'è sotto l'altare, e adesso sotto l'altare ci sei tu. La lingua ti
      si incolla al palato per vecchia obbedienza, prima ancora che qualcuno
      ti chieda di tacere.

      Le torce si spengono una alla volta, da quella più vicina alla scala
      fino all'ultima. Nella penombra resta un chiarore d'oro e d'argento, e
      al centro della sala c'è una figura avvolta in veli che alla luce delle
      torce sarebbero di seta nera e grigia, e che adesso sembrano fatti di
      quel chiarore. Il volto resta nascosto, e le mani che sporgono dai veli
      hanno le unghie tinte di cenere.

      La voce non ha inflessioni e ti arriva dentro le orecchie senza passare
      dall'aria. Dietro ce n'è un'altra più bassa, che dice le stesse parole
      con un attimo di ritardo, e ti si drizzano i peli sulle braccia.

      {magia Difficile} Le torce non si sono spente da sole. Il Mana della
      sala si è tirato indietro tutto insieme, verso di lei, come la
      risacca prima dell'onda, e adesso le sta intorno ad aspettare.

      {resistenza Facile fallita} La seconda voce ti arriva da dietro la
      nuca. Le ginocchia ti suggeriscono con discrezione di sederti, e tu
      fai finta di non sentirle.

      «Portatore dell'Alba» dice la Madre del Velo. «I tuoi passi hanno rotto
      il silenzio di secoli. La Magnistruttura ha tremato, e le rovine si
      sono ricordate i loro nomi. Il Costruttore è caduto, e il tuo cammino
      comincia da lì.» I veli smettono di muoversi, e la seconda voce finisce
      la frase un attimo dopo la prima.
    opzioni:
      - testo: "Chiedere dei Costruttori"
        descrizione: "Quello che hai visto sotto Capomozzo era alto quanto quattro case una sopra l'altra e aveva un cuore rosso. Lei sa che cos'era."
        costo: 0
        esito:
          titolo: Le mani dei Precursori
          testo: |
            «I Costruttori erano le mani dei Precursori» dice la Madre.
            «Edificavano e custodivano. Quando i loro signori scomparvero
            rimasero prigionieri del loro lavoro e continuarono a costruire e
            a difendere senza più sapere per chi. Adesso sono semidivinità
            spezzate. Alcuni fanno la guardia, altri distruggono quello che
            giudicano imperfetto. Ne restano nove, forse dieci.»

            {accademiche Difficile} Le cronache della Caduta parlano dei
            Costruttori come di macchine. Lei li chiama semidivinità, e in
            tutta la tua vita non hai mai sentito nessuno provare a contarli.

            La seconda voce, dietro la sua, si fa più vicina. «Uno di loro ti
            aspetta nel Labirinto di Darn-Morakh. È un Costruttore Redento,
            l'unico che ricorda ancora che cosa fosse la Luce. Se puoi, non
            distruggerlo. Attraverso di lui la tua maschera potrà crescere
            ancora.» Senti la pelle del viso tirare, nel punto dove la maschera
            si è posata, come se avesse sentito anche lei.
      - testo: "Chiedere del Labirinto"
        descrizione: "Per i Raschiatori è una miniera che cambia strada. A sentire come ne parla lei, è un'altra cosa."
        costo: 0
        esito:
          titolo: Il Nido
          testo: |
            «Il Labirinto di Darn-Morakh era un cantiere divino» dice la
            Madre, «dove i Precursori forgiavano mondi. Adesso è una prigione
            viva di pietra e metallo che pensano, con corridoi che cambiano
            direzione. Ci si muovono cose che non dovrebbero esistere.
            La più pericolosa è quella che vi si nasconde.» La seconda voce
            dice il nome un attimo dopo la prima. «Nhar'Kael. La chiamano la
            Regina delle Ali Spezzate, o la Covatrice di Orrori. Ogni culto
            che la serve cerca di somigliarle, e fonde la carne con la
            macchina finché la differenza si perde.»

            {percezione Media} Mentre la seconda voce dice il nome, i veli si
            muovono per la prima volta da quando sei sceso, e si fermano subito
            dopo, prima che tu possa giurare di averli visti.

            Fa una pausa così lunga che senti sfrigolare l'incenso. «La donna
            che hai riportato dalle rovine, quella che gli orchi chiamavano la
            Dama d'Argento, era solo un preludio.» Lo dice senza nessun peso,
            nel tono in cui si annuncia il tempo di domani.
          imposta: { madre.labirinto: 1 }
      - testo: "Dirle che scenderai nel Labirinto"
        descrizione: "Il Costruttore Redento è laggiù, e anche quello che vi si nasconde."
        requisiti: [madre.labirinto >= 1]
        esito:
          titolo: Il cammino è tracciato
          testo: |
            Le dici che scenderai nel Labirinto, quando sarai pronto. La Madre
            resta immobile così a lungo che ti chiedi se ti abbia sentito. Poi
            le torce si riaccendono partendo dall'ultima, e quando la luce
            arriva alla scala la figura in mezzo alla sala è soltanto una donna
            velata di nero e di grigio, più piccola di come ti era sembrata. Ha
            le spalle un po' curve delle persone che leggono molto.

            «Il tuo cammino è tracciato, Portatore» dice la Madre quando sei
            già sul primo gradino. «Va', adesso.» In cima alla scala Vantes ti
            aspetta con le mani infilate nelle maniche, e ti dice che per
            Aurenne ci vorrà ancora una settimana. Le ferite del corpo si sono
            già chiuse, e per il resto lui può soltanto pregare. Ti accompagna
            fino al portale con una candela in mano, senza chiederti niente.

            {empatia Media} Tace perché ha paura della risposta. Pregare per
            una cosa che non sai, a quanto pare, gli riesce più facile.
          pe: { resilienza: 5 }
          effetti: { pista.capomozzo: 1, rep.velo: 1 }
      - testo: "Dirle che il Labirinto non è affar tuo"
        descrizione: "Per la Confraternita hai già fatto abbastanza. Che ci mandi i suoi accoliti."
        requisiti: [madre.labirinto >= 1]
        esito:
          titolo: La vita che resta
          testo: |
            Le dici che non scenderai, perché per la Confraternita hai già
            fatto abbastanza. La voce ti esce più ferma di quanto ti aspettassi.
            Per un po' non succede niente. Poi la voce torna
            più bassa di prima, e per la prima volta ti sembra quasi umana.

            «Da quello che hai dentro non si scappa» dice. «Nhar'Kael è
            nell'aria che respiri, e nella memoria di chiunque sia nato dopo
            la Caduta. Ti chiedo di servire la vita che resta.»

            Le torce si riaccendono una alla volta, e il calore ti torna sulle
            mani prima ancora che la luce arrivi alla scala. In cima Vantes ti
            dice che per Aurenne ci vorrà ancora una settimana, e non ti chiede
            che cosa hai risposto alla Madre.
          pe: { resilienza: 5 }
          effetti: { pista.capomozzo: 1 }
      - testo: "Dirle che non hai più padroni"
        descrizione: "A Ghoran c'era sempre qualcuno che decideva dove dovevi andare. Una voce che ti chiama Portatore, per quanto venga da sotto un altare, non fa differenza."
        requisiti: [madre.labirinto >= 1]
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Nessun padrone
          testo: |
            Le dici che sei scappato da Ghoran per non dover più andare dove ti
            mandano, e che ricominciare adesso, per lei, sarebbe la stessa
            cosa. La schiena
            ti si raddrizza mentre parli, una vertebra alla volta. Per un po'
            non succede niente. Poi la voce torna più bassa di prima, e per la
            prima volta ti sembra quasi umana.

            «Non ti chiedo di servire me» dice. «Nhar'Kael è nell'aria che
            respiri, e nella memoria di chiunque sia nato dopo la Caduta. Ti
            chiedo di servire la vita che resta, e la tua è fra quelle.»

            Le torce si riaccendono una alla volta. In cima alla scala Vantes ti
            dice che per Aurenne ci vorrà ancora una settimana, e non ti chiede
            che cosa hai risposto alla Madre.
          pe: { resilienza: 5 }
          effetti: { pista.capomozzo: 1 }

  # ------------------------------------------------------------ 8 → 9 · Aurenne si risveglia
  - id: aurenne-si-risveglia
    presso: cattedrale-del-velo
    immagine: personaggi/aurenne
    titolo: Aurenne si risveglia
    sommario: "Una settimana dopo Vantes ti manda a chiamare. Nella sala di preghiera più interna una donna è in ginocchio davanti all'altare."
    luogo: Cattedrale del Velo, la sala di preghiera
    area: quartieri-alti
    requisiti: [pista.capomozzo == 8]
    testo: |
      Una settimana dopo un novizio ti ferma per strada e ti dice, con il
      le guance rosse per la corsa, che Padre Vantes ti manda a chiamare. In
      Cattedrale la luce entra a fasci dalle vetrate e colora di rosso e d'oro
      la pietra. Vantes ti accompagna lungo la navata senza parlare e ti
      lascia davanti alla porta della sala di preghiera più interna. Ha le
      occhiaie di una settimana di veglie, e sulla manica una macchia di cera
      che nessuno gli ha fatto notare.

      Aurenne è in ginocchio davanti all'altare. Al posto dell'armatura nera
      che portava sul ponte ha una semplice corazza a scaglie color ferro, con
      le braccia scoperte, e i capelli d'argento legati in una coda alta. La
      mano destra è ancora l'artiglio, con le dita lunghe e nere, e la tiene
      aperta sulla coscia come una cosa che non le appartiene. I tuoi piedi si
      fermano sulla soglia prima che tu lo decida.

      {origine allievo-di-torvessa} Anche lei è passata dall'Accademia per
      qualche tempo, prima di te. Ti chiedi in quale aula si sedeva, e se Temmerin a
      lei rispondeva due volte alla stessa domanda.

      {armi-da-mischia Media} L'artiglio è a tre passi da te, ed è la sua
      mano forte anche quando riposa. La tua, intanto, è già scivolata
      sull'elsa per conto suo.

      «Nessun ramo dell'Albero rimane secco per sempre» dice senza voltarsi.
      «Anche il più annerito, se nessuno lo spezza, può fiorire ancora.» Si
      alza piano e si gira. Ha gli occhi viola e stanchi, e la luce che
      avevano sul ponte se n'è andata.

      «È un passo delle Scritture, parla di perdono. Padre Vantes mi ha
      accolta, e dice che per tornare indietro non è mai troppo tardi. Io
      questo non lo so. Non cercherò di giustificarmi con quello che ho
      subito, né con le voci che mi hanno guidata. Voglio soltanto espiare.»
      Ti guarda quasi supplicando. «Per questo ti risponderò, Portatore.
      Chiedimi quello che vuoi.»

      {empatia Difficile} Il discorso sul ramo l'ha preparato, e anche
      quello sul perdono. L'ultima frase invece le è uscita da sola, e la
      spaventa più di te.
    opzioni:
      - testo: "Chiedere di Nhar'Kael e della Marea Grigia"
        descrizione: "La Madre del Velo te ne ha parlato. Aurenne l'ha sentita parlare."
        costo: 0
        esito:
          titolo: Figlia imperfetta
          testo: |
            «Mi ha parlato fin da quando ero bambina» dice Aurenne, con gli
            occhi sulla luce delle vetrate. «Mi chiamava figlia imperfetta, e
            mi diceva che potevo essere la prima di una stirpe nuova, che
            potevo riaprire il nido. Credevo che
            fosse un dono.» Si passa la mano buona fra i capelli. «La Marea
            Grigia è lei. La genera un po' per caso e un po' per difendersi, e
            così nasconde i segreti dei Precursori. Ogni ondata cancella un
            pezzo della memoria del mondo.»

            {natura Difficile} Le bestie mutate dei Raschiatori, allora, sono
            figli. Hanno una madre, e una madre che si difende, come tutte le
            madri del bosco, è la cosa più pericolosa che ci sia.

            Poi abbassa gli occhi sull'artiglio. Con tutto quello che ha fatto
            per Nhar'Kael, dice, adesso alla Regina riesce più facile generare
            i suoi figli, le bestie mutate che i Raschiatori trovano nelle
            rovine, e la voce le si fa piatta mentre lo ammette. Fuori, da
            qualche parte nella navata, un novizio fa cadere un candelabro e
            chiede scusa al vuoto.
      - testo: "Chiedere del Culto dell'Anonimo"
        descrizione: "Isvaro lo nominava nel diario, e Garin parlava dei mascherati come di gente che non c'è più."
        costo: 0
        esito:
          titolo: L'ultima testimone
          testo: |
            «L'ho fondato io, per servirla» dice. «Nhar'Kael mi aveva mostrato
            il tuo volto prima che ti incontrassi, e mi aveva detto che avresti
            portato la rovina travestita da redenzione. Io l'ho ripetuto agli
            altri, e loro mi hanno creduto. Portavamo maschere bianche senza
            tratti, perché la salvezza stava nel non essere più nessuno.»

            La voce le si incrina appena. «Uccidevamo chi si opponeva, e
            quando abbiamo finito ho sacrificato loro, uno dopo l'altro,
            sull'altare della Regina delle Ali Spezzate. Credevo che mi
            avrebbe trasformata in qualcosa di potente. Il Culto dell'Anonimo è
            finito con loro, e io sono l'ultima che può raccontarlo.»

            {ingannare Media} Racconta senza abbellire niente e senza togliersi
            una colpa. Chi mente su una cosa così di solito si lascia almeno
            una scusa, e lei non se n'è lasciata nessuna.
      - testo: "Chiedere del congegno"
        descrizione: "Julia ti ha detto di non toccarlo. Adesso c'è chi può spiegarti perché."
        costo: 0
        esito:
          titolo: Un modulatore
          imposta: { capomozzo.congegno: 1 }
          testo: |
            «È un relitto dei Precursori» dice Aurenne, e guarda il disco
            senza toccarlo. «Manda un segnale che confonde le loro macchine.
            Per qualche minuto non sanno più chi sono, e quindi nemmeno chi è
            il nemico. Poi si scarica, e si ricarica con i cristalli conduttori
            oppure da solo, col tempo.» Lo spiega con precisione, perché l'ha
            usato molte volte.

            Stringe l'artiglio fino a farsi scricchiolare le nocche. «Può
            anche comandarle, se gli dai abbastanza volontà. Io ne ho comandate
            a decine, e a ogni ordine dentro di me si spegneva un ricordo,
            oppure un nome. Un giorno mi sono accorta che non provavo più
            niente, e ancora adesso non so se quella parte di me tornerà.» Tu
            guardi il disco, e il pollice ti formicola nel punto esatto dove
            andrebbe a posarsi.
      - testo: "Mostrarle il diario"
        descrizione: "Il quaderno dalla copertina di stoffa che hai trovato nella sua stanza, sotto Capomozzo."
        requisiti: [oggetto.diario-di-aurenne >= 1]
        costo: 0
        esito:
          titolo: La grafia di una ragazza
          testo: |
            Le porgi il diario aperto sulla prima pagina. Aurenne riconosce la
            copertina azzurra consumata agli angoli, e non lo prende. Lo guarda nelle tue mani, e le
            labbra le si muovono appena, come se rileggesse a memoria una riga.

            «Quella ragazza scriveva a qualcuno che non la ascoltava» dice dopo
            un po'. «Al Grande Albero, credeva lei.» Poi scuote la testa piano
            e ti chiede di tenerlo tu, perché se lo tenesse lei finirebbe per
            rileggerlo, e per darle ragione.

            {empatia Media} Parla della ragazza del diario come di una sorella
            minore morta giovane. Le vuole bene, e non la perdona.
      - testo: "Lasciarla alle sue preghiere"
        descrizione: "Hai chiesto quello che volevi sapere, o quello che riuscivi ad ascoltare."
        esito:
          titolo: Una donna
          testo: |
            Dopo un lungo silenzio Aurenne torna a inginocchiarsi davanti
            all'altare. La luce delle vetrate le scivola sulla corazza e
            disegna sul pavimento una macchia rossa, che le arriva fino alle
            ginocchia. Si sistema meglio sul pavimento duro, perché ci passerà
            molte ore.

            «Lasciami alle mie preghiere» dice. «Non tornerò a combattere, e
            non voglio più essere la guida di nessuno, né un simbolo. Sono solo una donna che
            ha perso se stessa nel tentativo di diventare un dio.» Abbassa la
            testa sull'artiglio. «Ti auguro ogni fortuna, Portatore. Spero di
            rivederti.»

            Quando esci Vantes è seduto sull'ultima panca della navata, con il
            breviario chiuso sulle ginocchia, e ti saluta con un cenno senza
            alzarsi. Fuori, sui gradini, ti accorgi che cammini più dritto
            di quando sei entrato.
          pe: { empatia: 5 }
          effetti: { pista.capomozzo: 1, tormento: -0.5 }
      - testo: "Dirle il resto del passo"
        descrizione: "Quel passo delle Scritture i novizi lo recitano all'alba nel corridoio, e lei si è fermata a metà. Tu sai come continua."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La linfa
          testo: |
            «E chi lo vede secco non lo tagli, perché la linfa scende prima di
            risalire» dici, con la cadenza che Ottilia Sanvel fa usare ai
            novizi all'alba, nel corridoio. Le parole ti escono con la stessa
            cantilena di quando eri novizio, e la gola se le ricorda prima di
            te. Aurenne si volta di scatto. Ti guarda come si guarda qualcuno
            di casa, poi abbassa gli occhi sull'artiglio.

            «Da bambina lo dicevo anch'io, e non sapevo che cosa volesse dire»
            dice. «Lasciami alle mie preghiere. Non tornerò a combattere, e non
            voglio più essere la guida di nessuno.» Torna a inginocchiarsi
            davanti all'altare. «Ti auguro ogni fortuna, Portatore. Spero di
            rivederti.»

            {accademiche Media} I novizi lo imparano prima di saper leggere, a
            forza di sentirlo all'alba. Che lo ricordi ancora, dopo tutto il
            resto, vuol dire che qualcuno gliel'ha insegnato con pazienza.

            Quando esci Vantes è seduto sull'ultima panca della navata, con il
            breviario chiuso sulle ginocchia, e ti saluta con un cenno senza
            alzarsi.
          pe: { empatia: 5 }
          effetti: { pista.capomozzo: 1, tormento: -0.5 }
      - testo: "Chiederle del congegno come di un reperto"
        descrizione: "Sulle piattaforme, di un reperto dei Precursori si chiede prima che cosa fa e poi che cosa ti toglie. Lei l'ha usato abbastanza da saperlo."
        quando: [origine.apprendista-raschiatore >= 1]
        costo: 0
        esito:
          titolo: Quello che ti toglie
          imposta: { capomozzo.congegno: 1 }
          testo: |
            Le chiedi del disco come si chiede di un reperto a chi l'ha portato
            su, prima a che cosa serve e poi quanto costa usarlo. Aurenne ti
            guarda un momento, sorpresa dal tono. «Manda un segnale che
            confonde le macchine dei Precursori» dice. «Per qualche minuto non
            sanno più chi è il nemico. Poi si scarica, e si ricarica con i
            cristalli conduttori, oppure da solo, col tempo.»

            Alla seconda domanda stringe l'artiglio fino a farsi scricchiolare
            le nocche. «Può anche comandarle, se gli dai abbastanza volontà, e
            a ogni ordine dentro di me si spegneva un ricordo.» Sulle
            piattaforme un reperto così lo avreste calato di nuovo giù con la
            corda, e ti accorgi che lo pensi davvero.

  # ------------------------------------------------------------ 9 → 10 · i Raschiatori
  - id: i-raschiatori
    presso: grifone-di-ferro
    immagine: personaggi/tenebra
    titolo: I Raschiatori
    sommario: "Al tavolo vicino alla finestra del Grifone siedono Tenebra e Ferro. Sanno dov'è l'argano, e sanno dire di no."
    luogo: Locanda del Grifone di Ferro, il tavolo vicino alla finestra
    area: ponti-sospesi
    requisiti: [pista.capomozzo == 9]
    testo: |
      Il Grifone di Ferro è pieno a metà. Il camino tira male come sempre e
      sputa faville sul pavimento, e alle pareti pendono corde e carrucole
      recuperate dai cantieri sotterranei, che Liaren chiama la sua
      collezione d'arte. Brunella ti mette davanti una scodella di zuppa
      prima che tu la chieda, e ci aggiunge un pezzo di pane in più senza
      commentare la tua faccia. Al tavolo vicino alla finestra siedono
      Tenebra e Ferro.

      Tenebra sta seduto di taglio, e la bruciatura sulla guancia è una
      filigrana di vetro sotto la pelle. Davanti ha un boccale che non tocca.
      Ferro, cioè Dragna Gro-Malog, stringe il suo come se fosse un elmo, con
      le nocche bianche e le due dita che le mancano alla mano sinistra, e i
      lati rasati della testa le luccicano di sudore. Quando ti siedi, gli
      occhi gialli ti squadrano dagli stivali in su.

      {rissa Media} Ferro stringe il boccale con la sinistra, quella a cui
      mancano le dita, e la destra resta libera sul tavolo. È la mano che
      conta, e lei non se ne separa nemmeno per bere.

      {origine apprendista-raschiatore} Tenebra alle reclute insegna a
      riconoscere la paura, e tu sei stato una delle reclute. Adesso ti guarda
      le mani nello stesso modo, e le mani, per obbedienza, smettono di
      tremare.

      Chiedi a Ferro di portarti giù, fino al Labirinto di Darn-Morakh.

      «No» dice lei. Poi, visto che non ti alzi, si appoggia allo schienale.
      «Hai chiesto e ti ho risposto. La Salvaguardia si chiude sugli intrusi
      ogni volta più in fretta, e il primo strato l'abbiamo raschiato fino
      all'osso. Ci sono rimasti corridoi vuoti e nidi di macchine sveglie. In
      fondo non si va. Punto.»

      {intimidire Facile fallita} Provi a sostenere lo sguardo di Ferro. Il
      tuo dura poco, e il suo, a giudicare da come non sbatte le palpebre,
      potrebbe durare fino a domattina.

      Tenebra non ha ancora aperto bocca. Ti guarda prima le mani e poi gli
      occhi, con il modo dei maestri d'armi, che pesano l'acciaio prima
      dell'uomo. «Hai qualcosa che noi non sappiamo?» chiede.
    opzioni:
      - testo: "Mostrare il congegno"
        descrizione: "Il disco con cui Aurenne comandava le macchine di Capomozzo."
        requisiti: [oggetto.congegno-di-controllo >= 1]
        esito:
          titolo: Odio quelli che parlano come me
          testo: |
            Posi il congegno sul tavolo, fra il boccale di Tenebra e la tua
            zuppa, e racconti delle macchine di Capomozzo che si fermavano a
            metà passo. Ferro si piega in avanti a cercarti una bugia negli
            occhi, e quando non la trova sbuffa per principio. «Diglielo tu» dice
            a Tenebra, senza staccarti gli occhi di dosso. «Digli che non
            abbiamo uomini. Sono morti o feriti, e quelli rimasti sono già giù
            nelle rovine qui intorno. Quel poco che resta lo tengo per la
            città.»

            {politica-ed-economia Media} I Raschiatori vivono di quello che
            portano su, e i morti non portano su niente. Ferro sta facendo i
            conti di una gilda che si svuota, e il tuo disco, nei suoi conti,
            pesa più di quanto voglia ammettere.

            Le rispondi che ti basta qualcuno che sappia dov'è l'argano e come
            si libera il freno, e che al resto pensi tu. Ferro ti fissa a
            lungo. «Odio quelli che parlano come me» dice alla fine, e allenta
            la presa sul boccale.

            Tenebra alza il boccale e ci bagna appena le labbra. Per lui è già
            un discorso lungo.
          effetti: { rep.raschiatori: 0.5 }
          segue: l-orlo-della-cicatrice
      - testo: "Ripeterle la frase degli obelischi"
        descrizione: "Ai suoi allievi Ferro fa imparare a memoria una scritta della Strada Antica. Tu sei uno di loro."
        requisiti: [raschiatore >= 1]
        esito:
          titolo: Uno dei suoi
          testo: |
            Le ripeti la frase che fa imparare alle reclute, quella incisa
            sugli obelischi della Strada Antica, che discendere è fatale e che
            non discendere è morire incompleti. La dici con la sua cadenza
            senza volerlo, e qualcuno al tavolo accanto si gira. Ferro grugnisce
            e si passa la mano sui lati rasati della testa. «I miei non li mando
            a morire» dice, e guarda Tenebra. «Diglielo tu che non abbiamo uomini.»

            Tenebra la guarda a sua volta senza dire niente, finché Ferro non
            batte il boccale sul tavolo. «Odio quelli che parlano come me»
            dice, e scuote la testa. Tenebra alza il suo boccale e ci bagna
            appena le labbra, poi lo posa.

            {empatia Facile} L'ha battuto sul tavolo per non doverti guardare.
            Le hai ripetuto le sue parole, e adesso è lei a non poter dire di
            no.
          effetti: { rep.raschiatori: 0.5 }
          segue: l-orlo-della-cicatrice
      - testo: "Insistere finché Ferro cede"
        descrizione: "Ferro dice di no per mestiere. Bisogna farle capire che scenderai comunque, anche senza di lei."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Con lei o senza
          testo: |
            Le dici che sotto Capomozzo sei sceso da solo e che hai lasciato un
            Costruttore sotto le macerie. Nel Labirinto ci scenderai comunque,
            magari da un pozzo cieco dei contrabbandieri se l'argano lei non te
            lo dà. Ferro ti ascolta senza mollare il boccale. «Diglielo tu»
            dice a Tenebra, senza voltarsi. «Digli che non abbiamo uomini.»
            Tenebra resta zitto e continua a guardarti le mani.

            {persuasione Media} Le stai dicendo che scenderai comunque, e per
            una come lei lasciarti andare da solo è peggio che venire. Lo sa, e
            ti detesta un poco per averglielo fatto capire.

            Alla fine a Ferro scappa una specie di risata dal naso. «Odio
            quelli che parlano come me» dice, e scuote la testa. Tenebra alza
            il boccale e ci bagna appena le labbra.
          effetti: { rep.raschiatori: 0.5 }
          segue: l-orlo-della-cicatrice
        fallimento:
          titolo: Punto
          testo: |
            Ferro ti lascia parlare fino in fondo, poi batte il boccale sul
            tavolo una volta sola, e mezza sala si gira. «Ho detto no» dice.
            «Torna quando hai qualcosa da mostrarmi oltre alla faccia tosta.»
            Tenebra ha smesso di guardarti, e capisci che per stasera è
            finita. Ti alzi con le orecchie che scottano e la zuppa ancora a
            metà, e Brunella, passando, te la porta via con uno sguardo di
            rimprovero per lo spreco.
          effetti: { tormento: 1 }
      - testo: "Proporle un contratto da cartografia"
        descrizione: "Quarant'anni fa la Gilda pagava i Raschiatori a metro di mappa. Con la tua licenza quel contratto si può riaprire per un argano e un freno."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: A metro di mappa
          testo: |
            Posi la licenza della Gilda sul tavolo, accanto al boccale di
            Tenebra, e le parli della cartografia del sottosuolo, di quando la
            Gilda pagava i Raschiatori a metro di mappa. Le dici che ti bastano
            l'argano e qualcuno che sappia liberare il freno, e che i turni
            persi li segni tu sul registro della Casa dei Nodi, a metro, come
            allora.

            {politica-ed-economia Facile} Un contratto vecchio di quarant'anni
            ha un vantaggio. Nessuno ha avuto il tempo di cambiarne le regole,
            e la Gilda non può dire di non conoscerlo.

            Ferro conta qualcosa sulle tre dita della mano sinistra, a labbra
            strette. «Diglielo tu che i miei non li vendo a metro» dice a
            Tenebra. Tenebra resta zitto e ti guarda le mani. Alla fine le
            scappa una specie di risata dal naso. «Odio quelli che contano come
            me» dice, e allenta la presa sul boccale.
          effetti: { rep.raschiatori: 0.5 }
          segue: l-orlo-della-cicatrice
      - testo: "Dirle quale pozzo dei contrabbandieri prenderesti"
        descrizione: "In Città Bassa si sa quali pozzi ciechi portano giù senza passare dall'argano. Ferro lo sa meglio di te, e sa anche quanti ne risalgono."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il pozzo cieco
          testo: |
            Le dici che se l'argano non te lo dà scendi da un pozzo cieco dei
            contrabbandieri, e le dici anche quale, con la strada per arrivarci
            e il nome di chi tiene la corda. Ferro smette di stringere il
            boccale. «Da lì sono scesi in tanti» dice a Tenebra, senza
            voltarsi. «Diglielo tu quanti ne sono risaliti.»

            Tenebra resta zitto e ti guarda le mani. Alla fine a Ferro scappa
            una specie di risata dal naso. «Odio quelli che parlano come me»
            dice, e allenta la presa sul boccale. Nei vicoli dove sei cresciuto
            chi conosce un pozzo prima o poi ci scende, e lei preferisce che tu
            scenda dal suo.
          effetti: { rep.raschiatori: 0.5 }
          segue: l-orlo-della-cicatrice

  - id: l-orlo-della-cicatrice
    immagine: ambientazione/cicatrice-del-mondo
    titolo: L'orlo della Cicatrice
    tipo: seguito
    luogo: I piloni sull'orlo della Cicatrice, di sera
    area: ponti-sospesi
    requisiti: [pista.capomozzo == 9]
    testo: |
      Fuori la sera ha l'odore della pioggia sul ferro. Tenebra e Ferro ti
      guidano per i vicoli dei Ponti, oltre i magazzini della Gilda dei
      Mercanti con le saracinesche già abbassate, e giù fino ai piloni, dove
      il vento sale dalla Cicatrice e fischia fra le funi. Un custode del Velo
      vi guarda passare dalla sua garitta e, quando riconosce Tenebra, torna
      a scaldarsi le mani sul braciere. Il ponte sospeso che porta all'argano
      pende sopra un vuoto color piombo, e il legno scricchiola a ogni passo.

      {origine mercante-dei-ponti} Passando davanti ai magazzini della Gilda
      conti le saracinesche abbassate senza volerlo, e per ognuna sai chi la
      chiude e quanto ci tiene dietro. Stasera la Gilda sta tutta dalla parte
      opposta a quella dove stai andando tu.

      {acrobazia Media} Ferro cammina sul ponte senza toccare le funi, e
      Tenebra le sfiora appena. Tu le stringi tutte e due, e nessuno dei
      due, per gentilezza, te lo fa notare.

      La piattaforma è una ruota di acciaio annerito larga quanto una stanza,
      percorsa da incisioni dei Precursori che sembrano vene spente. Ferro le
      gira intorno e controlla le catene una per una, contando a mezza voce,
      e quando arriva alla leva del freno si sputa sulle mani. «La sera prima
      si prova sempre» dice. «Chi non prova l'argano lo prova il giorno dopo,
      quando ormai è tardi.»

      Libera il freno. L'argano geme e la piattaforma scende di un palmo
      sotto i tuoi stivali, e laggiù, lungo la parete della voragine, la
      Strada Antica si accende per un attimo in una linea di luce fredda che
      corre verso il basso e si spegne. Le ginocchia si piegano da sole, per
      tenerti più vicino al ferro. All'orizzonte
      di pietra, nel mezzo della Cicatrice, si vedono le sagome sospese del
      Labirinto di Darn-Morakh.

      {tecnologia Difficile} La Strada si è accesa quando la piattaforma si è
      mossa, e non prima. Risponde all'argano come se fossero due pezzi
      dello stesso congegno, montati a mezza Cicatrice di distanza.

      Ferro tira la leva, e la piattaforma si ferma con uno scossone.
    opzioni:
      - testo: "Restare a guardare il Labirinto"
        descrizione: "Domani, o fra una settimana. Stasera ti basta sapere che è lì."
        costo: 0
        esito:
          titolo: Sull'orlo
          testo: |
            Resti sulla piattaforma finché il vento non ti fa lacrimare. Ferro
            ripassa le catene con il palmo, una maglia alla volta, poi si
            pulisce la mano sui calzoni. «L'argano è qui» dice. «Vieni al Grifone quando sei pronto
            e me lo dici, e io libero il freno per davvero.»

            Tenebra ti aspetta in cima al ponte sospeso, con la bruciatura che
            luccica appena nel buio. Quando gli passi accanto ti tocca la
            spalla una volta sola, come si fa con le reclute, e ti augura
            «Buona caccia» a voce bassa, senza fermarsi.

            {resilienza Media} Hai paura, e va bene così. È la paura giusta,
            quella che ti farà controllare le catene anche tu, la sera prima.

            Dal ponte ti volti indietro. La piattaforma dondola piano sulle
            catene, vuota, sopra il buio della Cicatrice.

            *Fine del Capitolo I*
          pe: { resilienza: 5 }
          effetti: { pista.capomozzo: 1, rep.raschiatori: 0.5, racconto: 1 }
      - testo: "Ascoltare il vento che sale dalla Cicatrice"
        descrizione: "Al Circolo ti hanno insegnato ad ascoltare il Bosco prima di entrarci. Il Labirinto è un bosco di pietra e di metallo, e il vento che ne sale è la prima cosa che ti dice di sé."
        quando: [origine.figlio-del-circolo >= 1]
        costo: 0
        esito:
          titolo: Il vento del Labirinto
          testo: |
            Chiudi gli occhi sulla piattaforma e ascolti, come al Circolo prima
            di entrare nel Bosco. Il vento sale dalla Cicatrice a folate, e fra
            una folata e l'altra c'è una pausa lunga, come fra due onde, che
            viene da molto più in basso dell'argano. Quando riapri gli occhi
            Ferro ti sta guardando con la mano sulle catene. «L'argano è qui»
            dice. «Vieni al Grifone quando sei pronto e me lo dici, e io libero
            il freno per davvero.»

            Tenebra ti aspetta in cima al ponte sospeso. Quando gli passi
            accanto ti tocca la spalla una volta sola, come si fa con le
            reclute, e ti augura «Buona caccia» a voce bassa, senza fermarsi.
            Dal ponte ti volti indietro, e il vento ti arriva ancora in faccia,
            con un odore di pietra bagnata che nel Bosco di Velthar non c'era.

            *Fine del Capitolo I*
          pe: { natura: 5 }
          effetti: { pista.capomozzo: 1, rep.raschiatori: 0.5, racconto: 1 }

  # ------------------------------------------------------------ gli Averi: il diario di Aurenne
  - id: leggere-il-diario-di-aurenne
    titolo: Il diario di Aurenne
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/cripta-di-idrian-sollen
    requisiti: [oggetto.diario-di-aurenne >= 1]
    sommario: "Un quaderno dalla copertina di stoffa, scritto da una ragazza nell'arco di quattro anni. L'ultima pagina non ha data."
    testo: |
      Il quaderno ha la copertina di stoffa azzurra consumata agli angoli, e
      un nastro per segnare la pagina che qualcuno ha masticato in punta. È
      più leggero di quanto ti aspettavi. Le prime pagine hanno una grafia
      tonda e ordinata, da scolara, con la data in cima e qualche fiore
      disegnato a margine. Più avanti le lettere si stringono e si inclinano,
      l'inchiostro cambia colore da una riga all'altra, e verso la fine certe
      parole sono premute con tanta forza che il pennino ha bucato la carta.

      {percezione Facile} Il nastro masticato ha i segni di denti piccoli,
      tutti dalla stessa parte. Lo mordeva mentre scriveva, pensando alla
      frase dopo.

      La prima data è d'estate, nel centoquarantuno. L'ultima pagina scritta
      non ne ha nessuna.

      {accademiche Media} La data in cima alla pagina è un'abitudine da
      scuola, che i maestri dell'Accademia insegnano con la riga sulle
      dita. Le ultime pagine non ce l'hanno più, e a quel punto nessun
      maestro le leggeva.

      Lo sfogli tenendolo per il bordo, con il pollice sull'angolo, e ti
      accorgi di farlo piano, come si fa con una lettera indirizzata a
      qualcun altro. *Prima di Nhar'Kael c'era una ragazza che disegnava fiori
      nei margini.* Fra due pagine c'è un fiore secco, schiacciato tanto a
      lungo che la carta intorno ha preso il suo colore.
    opzioni:
      - testo: "L'estate del centoquarantuno"
        costo: 0
        esito:
          titolo: Un angelo
          testo: |
            La prima pagina racconta un compleanno. Il padre l'ha lasciata
            uscire prima dalle lezioni per prepararle la torta, e fuori
            dall'Accademia alcuni ragazzi l'hanno presa a sassate. *Uno mi ha
            colpita sopra l'occhio e ha sanguinato tanto. Mi hanno chiamata
            mostro e intanto ridevano. A casa papà mi ha detto che nessuno è
            come me, e che i capelli d'argento e gli occhi viola sono una
            benedizione, perché io sono il suo angelo*.

            In fondo alla pagina c'è una macchia d'unto larga come un pollice,
            dove deve aver appoggiato la sua fetta di torta mentre scriveva.
      - testo: "L'inverno all'Accademia"
        costo: 0
        esito:
          titolo: Gli uccellini sulle scale
          testo: |
            Le pagine dell'inverno seguente sono più fitte. *Il Maestro
            Temmerin ci ha dato tanti di quei compiti che non li finirò mai.
            Amyll e le altre ridevano e mi indicavano, e quando mi sono chiusa
            in bagno per non sentirle hanno spinto i banchi contro la porta.
            Sono rimasta lì fino a notte, al buio, perché le candele si erano
            consumate. Mi ha aperto il signor Osric, che era seduto sulle scale
            a intagliare uccellini di legno*.

            {empatia Media} Del signor Osric scrive come di una cosa da
            nascondere, in fondo alla pagina e con le lettere piccole. È
            l'unica persona gentile del quaderno, e lei non sa ancora se può
            fidarsi.

            Qualche giorno dopo c'è un nome solo, sottolineato due volte.
            *Rennick Dole mi ha seguita dalla taverna fino a casa con i suoi
            amici, gridandomi dietro una parola che non voglio scrivere*.

            {origine allievo-di-torvessa} Che i compiti di Temmerin siano
            troppi lo sai per esperienza. Leggerlo nella grafia di lei ti fa
            l'effetto di un banco dove qualcuno ha già inciso le iniziali, nel
            punto esatto dove le avresti incise tu.

            {origine figlio-della-citta-bassa} Rennick Dole in città lo
            ricordano ancora come il bullo della scuola. Nei vicoli la parola
            che si grida dietro a una ragazza così la indovini anche senza che
            lei la scriva, e ti viene voglia di non averla indovinata.
      - testo: "La strada di Laresh e l'Abbazia"
        costo: 0
        esito:
          titolo: Benedetta
          testo: |
            *Sulla strada di Laresh mi ha circondata una dozzina di contadini.
            Volevano che li guarissi dalle piaghe, e uno voleva sapere quando
            piantare le patate. Diceva che sono benedetta dal Grande Albero
            Rosso e che la mia voce caccia gli spiriti. Gli ho urlato contro e
            sono scappata. Stasera ho pregato l'Albero, e mi ha risposto
            un'altra voce. È durata poco, ma l'ho sentita*.

            Due mesi dopo la grafia è più nervosa. Il padre ha deciso di
            mandarla all'Abbazia di Tuarmir per il suo diciassettesimo
            compleanno, senza chiederle niente. *Amo l'Albero, ma una suora
            non la voglio fare. Voglio solo uscire, ed essere come le altre*.

            La carta di quella pagina è ondulata, come se si fosse bagnata e poi
            asciugata sotto qualcosa di pesante.
      - testo: "Il ragazzo di Pannion"
        costo: 0
        esito:
          titolo: Delek
          testo: |
            Nell'inverno del centoquarantaquattro compare un nome. Delek viene
            da Pannion e fa il carbonaio, ha le mani piene di calli e la porta
            a mangiare sull'orlo della Cicatrice. *È il primo ragazzo che mi
            parla come se fossi una persona normale*. Per qualche pagina la
            grafia torna tonda. C'è una grotta lungo la strada dell'Acciaieria,
            e un ragazzo che promette di portarla a Pannion e di sposarla. Il
            quaderno si apre da solo su quella pagina, tante volte l'ha riaperta.

            D'estate, in cima a una pagina, c'è una riga sola. *Credo di essere
            incinta, glielo dico stasera*. Sotto, con l'inchiostro sbavato, c'è
            il resto. Delek è ripartito per Pannion e le ha detto che per lui
            era stata un passatempo. Il giorno dopo il padre l'ha mandata a
            pregare. *Tre ore in ginocchio, e l'Albero non ha risposto. Ottilia
            è gentile, ma le sue parole mi scivolano addosso*.

            Chiudi il quaderno un momento, con il dito in mezzo per tenere il
            segno, e guardi il muro finché ti passa.
      - testo: "Il signor Wren"
        costo: 0
        esito:
          titolo: Le Notti Cucite
          testo: |
            Alla fine di quell'anno la grafia si fa piccola e storta, tanto che
            devi avvicinare la pagina alla lampada per leggerla. Aurenne
            fa sogni che non descrive, e il padre non la lascia uscire per
            paura del Cucitore. *Ma lo so che si vergogna di me*. Una notte
            scappa lo stesso, e per strada incontra il signor Wren, a cui sono
            caduti alcuni uccellini di legno. Lo aiuta a raccoglierli. *Mi ha
            detto che una ragazza bella come me non dovrebbe andare in giro da
            sola col buio*.

            Due settimane più tardi, nel centoquarantacinque, la pagina è
            macchiata. *Hanno ucciso il signor Wren. Dicono che il Cucitore
            era lui, e dalle finestre alte del santuario vedo bruciare la sua
            casa. Il signor Osric Wren era sempre gentile con me*.

            Ti torna in mente l'uccellino senza un'ala sulla scrivania di
            Aurenne, girato verso il cuscino.
      - testo: "Le ultime pagine con una data"
        costo: 0
        esito:
          titolo: Sette mesi
          testo: |
            Le pagine che seguono sono brevi, e quasi nessuna riga arriva al
            margine. *Faccio sogni orribili. Credo che il mio bambino sappia
            che sono maledetta*. Qualche giorno dopo la grafia scende storta
            lungo il foglio. *C'è sangue, ed è troppo presto, ha solo sette
            mesi. Ho sentito papà Idrian che parlava con Mirta per farmi
            abortire. Io il mio bambino non voglio perderlo. Ti prego, Grande
            Albero, salva il mio bambino e non farò mai più niente di
            sbagliato*.

            Il resto della pagina è vuoto. Hai la gola secca, e per un po'
            tieni il diario chiuso sulle ginocchia con tutte e due le mani,
            come si tiene una cosa che potrebbe scappare.

            {medicina Media fallita} Provi a ricordare quello che sai dei parti
            che arrivano troppo presto, e ti accorgi che non vuoi saperlo.
      - testo: "La pagina senza data"
        costo: 0
        esito:
          titolo: Il santuario brucia
          testo: |
            L'ultima pagina scritta non ha data, e la grafia sembra quella di
            un'altra persona. È diritta e calma, con le lettere strette e
            regolari, e non c'è una sola cancellatura.

            {resilienza Media} Le lettere ferme ti fanno più paura di quelle
            storte. Chi trema ha ancora qualcosa da perdere, e chi ha scritto
            questa pagina aveva smesso di tremare.

            *Nhar'Kael, questo è il suo nome. Lei mi ha ascoltata e ha capito
            il mio dolore, e mi ha dato la chiarezza che cercavo. I miei
            fedeli dell'Anonimo crescono di giorno in giorno. Da quando lei mi
            ha scelta è così facile piegare le persone. Mio padre brucia, e il
            santuario con lui. Un giorno toccherà a tutta la città*.

            Le pagine dopo sono bianche, e le sfogli lo stesso fino all'ultima,
            nel caso che la ragazza dei fiori abbia lasciato ancora una riga.
      - testo: "Chiudere il diario"
        costo: 0
        esito:
          testo: "Richiudi piano il diario sul fiore secco e lo infili in fondo alla bisaccia, sotto tutto il resto."

  # ------------------------------------------------------------ gli Averi: il congegno di controllo
  - id: decifrare-congegno
    titolo: Decifrare il congegno
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.congegno-di-controllo >= 1, decifrato.congegno-di-controllo == 0]
    sommario: "Capire come funziona un reperto dei Precursori prima che sia lui a capire te."
    testo: |
      Il disco è grande come un palmo aperto e pesa più del dovuto. Lungo il
      bordo ha una corona di piccoli cristalli quasi tutti spenti, e al
      centro una conca liscia dove il pollice va a posarsi senza che tu lo
      decida. Quando lo tieni in mano senti un ronzio basso nei denti, e ti
      torna in mente il passo storto delle macchine della Salvaguardia ogni
      volta che Aurenne premeva quella conca.

      {tecnologia Media} La conca è consumata, appena, dalla parte del
      pollice destro. Qualcuno l'ha usato a lungo, e sempre con la stessa
      mano.

      {resistenza Facile fallita} Il ronzio ti si infila nelle gengive e ci
      resta, come un mal di denti che non è tuo. Posi il disco sul tavolo,
      e la mano torna a prenderlo prima che tu l'abbia deciso.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: congegno-di-controllo
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Capisci quali cristalli della corona segnano la carica e come va
            tenuto il pollice per non premere troppo. Il ronzio si abbassa e
            si fa regolare, e per qualche minuto il disco resta tiepido contro
            il palmo, come un sasso rimasto al sole.
          effetti: { decifrato.congegno-di-controllo: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            Tieni premuta la conca troppo a lungo, e il ronzio ti sale dai
            denti fino alle tempie. Quando posi il disco non ricordi più che
            cosa stavi facendo un momento prima, e ti ritrovi a fissare la
            tua mano come se fosse di qualcun altro.
          effetti: { tormento: 1 }
      - testo: "Fare come ti ha spiegato Aurenne"
        reperto: congegno-di-controllo
        descrizione: "In Cattedrale ti ha detto come lo usava. Sapere dove mettere le mani aiuta, anche se lei ti consigliava di tenerle lontane."
        requisiti: [capomozzo.congegno >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, resilienza], difficolta: Facile }
        successo:
          titolo: Decifrato
          testo: |
            Fai come ti ha spiegato lei, con un tocco breve e il pollice che
            si ritira subito. I cristalli della corona si accendono uno alla
            volta e il ronzio si ferma su una nota sola. Ti resta addosso una
            stanchezza leggera, come dopo una notte di guardia. Aurenne aveva
            ragione, e la cosa non ti consola quanto dovrebbe.
          effetti: { decifrato.congegno-di-controllo: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            Tieni il pollice sulla conca un attimo più del dovuto, e senti
            qualcosa che dall'altra parte ti spinge indietro. Molli il disco
            sul tavolo e per un'ora hai le dita intorpidite, e quando provi a
            chiudere il pugno lo fanno con un attimo di ritardo.
          effetti: { tormento: 1 }
