# La pista di Capomozzo, ultima parte: il ritorno a Qir-Azel e la fine del Capitolo I (pista 6 → 10),
# più i due storylet degli Averi legati alla pista: il diario di Aurenne e la decifrazione del congegno.
quality:
  - { id: capomozzo.congegno, nome: Aurenne ti ha spiegato il congegno, categoria: stato, nascosta: true }

storylet:
  # ------------------------------------------------------------ 6 → 7 · il ritorno
  - id: il-ritorno-a-qir-azel
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Il ritorno a Qir-Azel
    sommario: "Due giorni e mezzo di strada con una donna che non si sveglia, e in fondo la navata della Cattedrale."
    luogo: Cattedrale del Velo, la navata
    area: quartieri-alti
    requisiti: [pista.capomozzo == 6]
    testo: |
      Per due giorni e mezzo Aurenne non apre gli occhi. Viaggia stesa su una
      lettiga di rami, con chiazze scarlatte che le pulsano sotto la pelle
      come braci coperte di cenere, e ogni volta che la tocchi ti strofini le
      mani sui calzoni senza volerlo.

      Le porte della Cattedrale del Velo si aprono. In fondo alla navata Padre
      Vantes e Julia Castaldi parlano con Toren Galdrick, lo sceriffo. Julia
      ti viene incontro con le mani strette al petto, e la voce roca le si
      rompe a metà di un ringraziamento al Grande Albero. Galdrick ti chiede
      soltanto se è viva, con la voce che userebbe per chiedere l'ora. Vantes
      si inginocchia accanto alla panca dove l'hai stesa e le posa due dita
      sulla fronte.

      {origine rampollo-dei-quartieri-alti} Ai tavoli del Consiglio Julia
      Castaldi ride sempre un tono sotto. Una voce rotta come questa non
      gliel'avevi mai sentita.

      {origine accolito-del-velo} Nella tenda dei feriti hai visto Vantes
      chiudere ferite finché la faccia gli diventava grigia, e le tue mani
      cercano le bende in una borsa che stasera non hai.

      «È contaminata» dice piano. «C'è una presenza dentro di lei, e la sento
      sotto le dita.» Ritira la mano e si pulisce le dita sulla tonaca, senza
      accorgersene. *Allora non succede solo a me.* Le tue, intanto, sono già
      sui calzoni.
    opzioni:
      - testo: "Dire a Galdrick com'è finita con Balthog"
        descrizione: "Prima di tutto il resto, lo sceriffo vuole sapere questo."
        immagine: personaggi/toren-galdrick
        requisiti: [balthog == 1]
        costo: 0
        esito:
          titolo: Il trono vuoto
          testo: |
            Gli dici che Balthog il Prescelto è morto nella sua sala del trono, e Julia lascia cadere le spalle. «Allora è finita» dice,
            «o quasi.»

            Galdrick scuote la testa, con i pollici nella cintura. «A Fondobosco e nelle campagne restano più bande di quante ne potremmo
            contare. Senza un capo, però, non ci verranno più addosso tutti insieme.» Scrive una riga corta sul taccuino.
      - testo: "Dire a Galdrick com'è finita con Balthog"
        descrizione: "Prima di tutto il resto, lo sceriffo vuole sapere questo."
        immagine: personaggi/toren-galdrick
        requisiti: [balthog == 2]
        costo: 0
        esito:
          titolo: Battuto davanti ai suoi
          testo: |
            Gli dici che hai battuto Balthog davanti ai suoi orchi e l'hai lasciato vivo.
            Galdrick si infila i pollici nella cintura. «Un orco battuto davanti alla sua
            tribù non comanda più nessuno. Forse è meglio di un morto da vendicare.»

            Julia dice che allora è finita o quasi. Galdrick ricorda che restano bande nelle
            campagne e a Fondobosco, ma senza un capo non verranno più tutti insieme.
      - testo: "Dire a Galdrick com'è finita con Balthog"
        descrizione: "Prima di tutto il resto, lo sceriffo vuole sapere questo."
        immagine: personaggi/toren-galdrick
        requisiti: [balthog == 0]
        costo: 0
        esito:
          titolo: Ancora vivo
          testo: |
            Gli dici che Balthog è vivo e che sotto la fortezza sei sceso lo stesso.
            «Un capotribù senza chi gli dava gli ordini torna a essere un orco come
            gli altri, solo più grosso» dice Galdrick.

            Julia dice che allora è finita o quasi. Galdrick ricorda che restano bande
            nelle campagne e a Fondobosco, ma senza la donna che li teneva in fila non
            verranno più tutti insieme.
      - testo: "Dire chi serviva Aurenne"
        descrizione: "Vantes ha sentito qualcosa sotto le dita. Il nome di quel qualcosa lo conosci tu."
        immagine: personaggi/padre-vantes
        costo: 0
        esito:
          titolo: Nhar'Kael
          testo: |
            Racconti del diario di Isvaro, della nuova madre di Aurenne e dei
            resti di Sollen bruciati al santuario di Capomozzo, e di Garin che la
            chiamava pazza per quello che aveva fatto ai mascherati del Culto
            dell'Anonimo. Quando dici il nome di Nhar'Kael Julia sbianca.

            Vantes si fa il segno del velo. «Allora tutto questo viene da più in
            basso di una setta, e da molto più lontano.»
      - testo: "Raccontare della maschera"
        descrizione: "Quando il colosso ha vacillato, una voce che era la tua ti ha chiamato Portatore dell'Alba."
        immagine: personaggi/toren-galdrick
        esito:
          titolo: Le storie erano vere
          testo: |
            Racconti del Costruttore e della maschera spaccata che si è
            ricomposta, e del coro che ti ha chiamato Portatore dell'Alba con la
            tua voce.

            Galdrick chiude gli occhi e mormora «Allora le storie erano vere…».
            Vantes ti dice che domani sera la Madre del Velo vorrà vederti nella
            Cripta. Julia indica il congegno che ti spunta dalla tasca. «Non
            toccarlo e aspetta che si svegli, lei sa come funziona.»
          pe: { espressivita: 5 }
          effetti: { pista.capomozzo: 1, rep.velo: 0.5 }
      - testo: "Parlare soltanto del congegno"
        descrizione: "Della maschera, per ora, puoi anche tacere. Il disco dei Precursori invece è sul tavolo, e lo vedono tutti."
        immagine: personaggi/julia-castaldi
        esito:
          titolo: Servirà tempo
          testo: |
            Posi il congegno e spieghi che Aurenne ci comandava le macchine della
            Salvaguardia, e Galdrick scuote la testa e lo chiama una follia.

            «Forse, ma è l'unica pista che abbiamo» dice Julia. «Non toccarlo e
            aspetta che si svegli, lei sa come funziona.»

            Vantes ti dice che la Madre del Velo ti aspetta domani sera nella
            Cripta. Della maschera non hai detto niente, e la faccia ti prude lo
            stesso.
          pe: { politica-ed-economia: 5 }
          effetti: { pista.capomozzo: 1, rep.velo: 0.5 }
      - testo: "Spiegare il congegno come una lezione"
        descrizione: "Al Festival i cristalli dell'Accademia hanno vibrato insieme, e questo disco parla la stessa lingua."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Dalla corona alla conca
          testo: |
            Posi il congegno e lo spieghi come Temmerin un cristallo nuovo.
            Racconti dei cristalli del banco che al Festival hanno vibrato
            insieme, e il disco manda lo stesso segnale, più forte. Galdrick
            smette di scuotere la testa.

            «Allora è l'unica pista» dice Julia. «Non toccarlo e aspetta che si
            svegli, lei sa come funziona.» Vantes ti dice che la Madre del Velo ti
            aspetta domani sera nella Cripta.
          pe: { tecnologia: 5 }
          effetti: { pista.capomozzo: 1, rep.velo: 0.5 }
      - testo: "Fare rapporto a Julia come in Consiglio"
        descrizione: "Ai tavoli del Consiglio prima si dicono i fatti e poi le richieste, e Julia ascolta chi parla così."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Prima i fatti
          testo: |
            Fai rapporto a Julia come in Consiglio, i fatti prima delle richieste,
            e alla fine lei è di nuovo la Rappresentante. Posi sul tavolo il disco
            con cui Aurenne comandava le macchine.

            «Non toccarlo e aspetta che si svegli, lei sa come funziona» dice.
            Vantes ti dice che la Madre del Velo ti aspetta domani sera nella
            Cripta. Della maschera, in quella lingua, nessuno ti ha chiesto niente.
          pe: { galateo: 5 }
          effetti: { pista.capomozzo: 1, rep.velo: 0.5 }

  # ------------------------------------------------------------ 7 → 8 · la Madre del Velo
  - id: la-madre-del-velo
    presso: cattedrale-del-velo
    immagine: personaggi/madre-del-velo
    titolo: La Madre del Velo
    sommario: "La sera dopo, nella Cripta sotto l'altare, ti aspetta chi nessuno ha mai visto in volto."
    luogo: Cattedrale del Velo, la Cripta, di sera
    area: quartieri-alti
    requisiti: [pista.capomozzo == 7]
    testo: |
      La sera dopo Padre Vantes ti accompagna fino alla scala della Cripta e si
      ferma sul primo gradino. «Io resto qui» dice, e ti posa due dita sul
      polso più a lungo del solito. Sotto l'altare la Cripta è una sala bassa
      dove l'aria sa d'incenso.

      {origine accolito-del-velo} Da novizio ti hanno insegnato a non chiedere
      cosa c'è sotto l'altare, e adesso sotto l'altare ci sei tu.

      Le torce si spengono una alla volta, dalla più vicina alla scala fino
      all'ultima. Nel chiarore d'oro e d'argento che resta, al centro della
      sala, c'è una figura avvolta in veli, con il volto nascosto e le unghie
      tinte di cenere. La voce non ha inflessioni e ti arriva dentro le
      orecchie senza passare dall'aria, e dietro ce n'è un'altra più bassa che
      dice le stesse parole con un attimo di ritardo.

      {magia Difficile} Le torce non si sono spente da sole. Il Mana della sala
      si è tirato indietro tutto insieme verso di lei, come la risacca prima
      dell'onda.

      «Portatore dell'Alba» dice la Madre del Velo. «I tuoi passi hanno rotto
      il silenzio di secoli. La Magnistruttura ha tremato, e le rovine si sono
      ricordate i loro nomi. Il Costruttore è caduto, e il tuo cammino comincia
      da lì.»
    opzioni:
      - testo: "Chiedere dei Costruttori"
        descrizione: "Quello che hai visto sotto Capomozzo era alto quanto quattro case e aveva un cuore rosso."
        costo: 0
        esito:
          titolo: Le mani dei Precursori
          testo: |
            «I Costruttori erano le mani dei Precursori, e continuarono a
            costruire e a difendere anche quando i loro signori scomparvero» dice
            la Madre. «Adesso sono semidivinità spezzate, e ne restano nove, forse
            dieci.»

            La seconda voce si avvicina. «Uno di loro ti aspetta nel Labirinto di
            Darn-Morakh, un Costruttore Redento, l'unico che ricorda che cosa
            fosse la Luce. Se puoi, non distruggerlo, perché attraverso di lui la
            tua maschera crescerà.»
      - testo: "Chiedere del Labirinto"
        descrizione: "Per i Raschiatori è una miniera che cambia strada. A sentire come ne parla lei, è un'altra cosa."
        costo: 0
        esito:
          titolo: Il Nido
          testo: |
            «Il Labirinto di Darn-Morakh era un cantiere divino» dice la Madre.
            «Adesso è una prigione viva di pietra e metallo che pensano, e laggiù
            si nasconde Nhar'Kael, la Regina delle Ali Spezzate, che qualcuno
            chiama Covatrice di Orrori. Ogni culto che la serve fonde la carne con
            la macchina per somigliarle. La donna che hai riportato, quella che
            gli orchi chiamavano la Dama d'Argento, era solo un preludio.»
          imposta: { madre.labirinto: 1 }
      - testo: "Dirle che scenderai nel Labirinto"
        descrizione: "Il Costruttore Redento è laggiù, e anche quello che vi si nasconde."
        requisiti: [madre.labirinto >= 1]
        esito:
          titolo: Il cammino è tracciato
          testo: |
            Le dici che scenderai nel Labirinto quando sarai pronto. Le torce si
            riaccendono una alla volta, e quando la luce arriva alla scala la
            figura in mezzo alla sala è soltanto una donna velata, più piccola di
            quanto sembrava, con le spalle curve di chi legge molto.

            «Il tuo cammino è tracciato, Portatore. Va', adesso.» In cima alla
            scala Vantes ti dice che per Aurenne ci vorrà una settimana.
          pe: { resilienza: 5 }
          effetti: { pista.capomozzo: 1, rep.velo: 1 }
      - testo: "Dirle che il Labirinto non è affar tuo"
        descrizione: "Per la Confraternita hai già fatto abbastanza. Che ci mandi i suoi accoliti."
        requisiti: [madre.labirinto >= 1]
        esito:
          titolo: La vita che resta
          testo: |
            Le dici che hai già fatto abbastanza per la Confraternita. La Madre
            parla più bassa, quasi umana.

            «Da quello che hai dentro non si scappa. Nhar'Kael è nell'aria che
            respiri, e nella memoria di chiunque sia nato dopo la Caduta. Ti
            chiedo di servire la vita che resta.»

            In cima Vantes ti dice che per Aurenne ci vorrà una settimana, e non
            ti chiede che cosa hai risposto.
          pe: { resilienza: 5 }
          effetti: { pista.capomozzo: 1 }
      - testo: "Dirle che non hai più padroni"
        descrizione: "A Ghoran c'era sempre qualcuno che decideva dove dovevi andare, e questa voce non fa differenza."
        requisiti: [madre.labirinto >= 1]
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Nessun padrone
          testo: |
            Le dici che sei scappato da Ghoran per non andare più dove ti mandano,
            e la schiena ti si raddrizza. La Madre parla più bassa, quasi umana.

            «Non ti chiedo di servire me. Nhar'Kael è nell'aria che respiri. Ti
            chiedo di servire la vita che resta, e la tua è fra quelle.»

            Quando risali, in cima alla scala Vantes ti dice che per Aurenne ci
            vorrà una settimana.
          pe: { resilienza: 5 }
          effetti: { pista.capomozzo: 1 }

  # ------------------------------------------------------------ 8 → 9 · Aurenne si risveglia
  - id: aurenne-si-risveglia
    presso: cattedrale-del-velo
    immagine: personaggi/aurenne
    titolo: Aurenne si risveglia
    sommario: "Una settimana dopo Vantes ti manda a chiamare, e nella sala di preghiera una donna è in ginocchio."
    luogo: Cattedrale del Velo, la sala di preghiera
    area: quartieri-alti
    requisiti: [pista.capomozzo == 8]
    testo: |
      Una settimana dopo Padre Vantes ti manda a chiamare. Ti accompagna lungo la
      navata senza parlare, con le occhiaie di una settimana di veglie, e ti lascia
      davanti alla sala di preghiera più interna.

      Aurenne è in ginocchio davanti all'altare, con una semplice corazza a scaglie
      color ferro al posto dell'armatura nera e i capelli d'argento legati in una
      coda alta. La mano destra è ancora l'artiglio, con le dita lunghe e nere, e la
      tiene aperta sulla coscia come una cosa che non le appartiene.

      {origine allievo-di-torvessa} Anche lei è passata dall'Accademia prima di te.
      Chissà se Temmerin a lei rispondeva due volte alla stessa domanda.

      «Nessun ramo dell'Albero rimane secco per sempre» dice senza voltarsi. «Anche
      il più annerito, se nessuno lo spezza, può fiorire ancora.» Si alza piano e si
      gira, con gli occhi viola e stanchi. «È un passo delle Scritture. Padre Vantes
      dice che per tornare indietro c'è sempre tempo, e io questo non lo so. Non
      cercherò di giustificarmi con quello che ho subito, né con le voci che mi
      hanno guidata. Voglio soltanto espiare, e per questo ti risponderò, Portatore.
      Chiedimi quello che vuoi.»

      {empatia Difficile} Il discorso sul ramo l'ha preparato. L'ultima frase invece
      le è uscita da sola, e la spaventa più di te.
    opzioni:
      - testo: "Chiedere di Nhar'Kael e della Marea Grigia"
        descrizione: "La Madre del Velo te ne ha parlato. Aurenne l'ha sentita parlare."
        costo: 0
        esito:
          titolo: Figlia imperfetta
          testo: |
            «Mi ha parlato da quando ero bambina» dice Aurenne. «Diceva che ero la
            sua figlia imperfetta e che potevo riaprire il nido, e io credevo che
            fosse un dono. La Marea Grigia è lei, la genera per difendersi, e ogni
            ondata cancella un pezzo della memoria del mondo.»

            Per quello che ha fatto per lei, ammette, la Regina genera più
            facilmente i suoi figli, le bestie mutate delle rovine.
      - testo: "Chiedere del Culto dell'Anonimo"
        descrizione: "Isvaro lo nominava nel diario, e Garin parlava dei mascherati come di gente che non c'è più."
        costo: 0
        esito:
          titolo: L'ultima testimone
          testo: |
            «L'ho fondato io, per servirla» dice. «Nhar'Kael mi aveva mostrato il
            tuo volto, e mi aveva detto che avresti portato la rovina travestita
            da redenzione. Portavamo maschere bianche senza tratti, perché la
            salvezza stava nel non essere più nessuno.»

            «Alla fine li ho sacrificati sull'altare della Regina delle Ali
            Spezzate, per diventare potente. Il Culto dell'Anonimo è finito con
            loro.»
      - testo: "Chiedere del congegno"
        descrizione: "Julia ti ha detto di non toccarlo. Adesso c'è chi può spiegarti perché."
        costo: 0
        esito:
          titolo: Un modulatore
          imposta: { capomozzo.congegno: 1 }
          testo: |
            «È un relitto dei Precursori» dice Aurenne. «Confonde le loro
            macchine, e per qualche minuto non sanno più chi è il nemico. Poi si
            scarica, e si ricarica con i cristalli conduttori oppure da solo, col
            tempo.»

            Stringe l'artiglio fino a farsi scricchiolare le nocche. «Può anche
            comandarle, se gli dai abbastanza volontà. Io ne ho comandate a
            decine, e a ogni ordine dentro di me si spegneva un ricordo.»
      - testo: "Mostrarle il diario"
        descrizione: "Il quaderno dalla copertina di stoffa che hai trovato nella sua stanza, sotto Capomozzo."
        requisiti: [oggetto.diario-di-aurenne >= 1]
        costo: 0
        esito:
          titolo: La grafia di una ragazza
          testo: |
            Le porgi il diario aperto sulla prima pagina. Aurenne riconosce la copertina azzurra e
            lo lascia nelle tue mani, mentre le labbra le si muovono appena, come se rileggesse a
            memoria una riga.

            «Quella ragazza scriveva a qualcuno che non la ascoltava. Al Grande Albero, credeva
            lei.» Ti chiede di tenerlo tu, perché se lo tenesse lei finirebbe per rileggerlo, e per
            darle ragione.
      - testo: "Lasciarla alle sue preghiere"
        descrizione: "Hai chiesto quello che volevi sapere, o quello che riuscivi ad ascoltare."
        esito:
          titolo: Una donna
          testo: |
            Aurenne torna a inginocchiarsi davanti all'altare, nella macchia rossa delle
            vetrate.

            «Lasciami alle mie preghiere. Non tornerò a combattere, e non voglio più essere
            la guida di nessuno. Sono solo una donna che ha perso se stessa nel tentativo
            di diventare un dio.» Abbassa la testa sull'artiglio. «Ti auguro ogni fortuna,
            Portatore. Spero di rivederti.»

            Quando esci ti accorgi che cammini più dritto di quando sei entrato.
          pe: { empatia: 5 }
          effetti: { pista.capomozzo: 1, tormento: -0.5 }
      - testo: "Dirle il resto del passo"
        descrizione: "I novizi recitano quel passo all'alba nel corridoio, e lei si è fermata a metà."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La linfa
          testo: |
            «E chi lo vede secco non lo tagli, perché la linfa scende prima di
            risalire» dici, con la cantilena che Ottilia Sanvel fa usare ai novizi
            all'alba. Aurenne si volta e ti guarda come si guarda qualcuno di
            casa.

            «Da bambina lo dicevo anch'io, e non sapevo che cosa volesse dire.
            Lasciami alle mie preghiere.» Torna a inginocchiarsi davanti
            all'altare. «Ti auguro ogni fortuna, Portatore.»
          pe: { empatia: 5 }
          effetti: { pista.capomozzo: 1, tormento: -0.5 }
      - testo: "Chiederle del congegno come di un reperto"
        descrizione: "Sulle piattaforme di un reperto si chiede prima che cosa fa e poi che cosa ti toglie."
        quando: [origine.apprendista-raschiatore >= 1]
        costo: 0
        esito:
          titolo: Quello che ti toglie
          imposta: { capomozzo.congegno: 1 }
          testo: |
            Le fai sul disco le due domande che si fanno su un reperto. «Confonde
            le macchine dei Precursori per qualche minuto» dice Aurenne, «poi si
            scarica, e si ricarica con i cristalli conduttori o da solo, col
            tempo.»

            Alla seconda domanda stringe l'artiglio. «Può anche comandarle, ma a
            ogni ordine dentro di me si spegneva un ricordo.» Sulle piattaforme un
            reperto così lo avreste riportato giù con la corda.

  # ------------------------------------------------------------ 9 → 10 · i Raschiatori
  - id: i-raschiatori
    presso: grifone-di-ferro
    immagine: personaggi/tenebra
    titolo: I Raschiatori
    sommario: "Al tavolo vicino alla finestra del Grifone siedono Tenebra e Ferro, che sanno dov'è l'argano."
    luogo: Locanda del Grifone di Ferro, il tavolo vicino alla finestra
    area: ponti-sospesi
    requisiti: [pista.capomozzo == 9]
    testo: |
      Al Grifone di Ferro Brunella ti mette davanti una scodella di zuppa
      prima che tu la chieda, e al tavolo vicino alla finestra siedono Tenebra
      e Ferro.

      Tenebra sta seduto di taglio, con la bruciatura sulla guancia come una
      filigrana di vetro e un boccale che non tocca. Ferro, cioè Dragna
      Gro-Malog, stringe il suo con la sinistra a cui mancano due dita, e gli
      occhi gialli ti squadrano dagli stivali in su.

      {origine apprendista-raschiatore} Alle reclute come te Tenebra insegnava
      a riconoscere la paura.

      Chiedi a Ferro di portarti giù, fino al Labirinto di Darn-Morakh.

      «No» dice lei. «La Salvaguardia si chiude sugli intrusi ogni volta più
      in fretta, e il primo strato l'abbiamo raschiato fino all'osso. In fondo
      non si va.»

      Tenebra ti guarda prima le mani e poi gli occhi. «Hai qualcosa che noi
      non sappiamo?» chiede.
    opzioni:
      - testo: "Mostrare il congegno"
        descrizione: "Il disco con cui Aurenne comandava le macchine di Capomozzo."
        requisiti: [oggetto.congegno-di-controllo >= 1]
        esito:
          titolo: Odio quelli che parlano come me
          testo: |
            Posi il congegno sul tavolo e racconti delle macchine di Capomozzo che
            si fermavano a metà passo. Ferro ti cerca una bugia negli occhi.
            «Diglielo tu che non abbiamo uomini» dice a Tenebra.

            Le rispondi che ti basta qualcuno che sappia dov'è l'argano e come si
            libera il freno. «Odio quelli che parlano come me» dice Ferro alla
            fine, e allenta la presa sul boccale.
          effetti: { rep.raschiatori: 0.5 }
          segue: l-orlo-della-cicatrice
      - testo: "Ripeterle la frase degli obelischi"
        descrizione: "Ai suoi allievi Ferro fa imparare a memoria una scritta della Strada Antica. Tu sei uno di loro."
        requisiti: [raschiatore >= 1]
        esito:
          titolo: Uno dei suoi
          testo: |
            Le ripeti la frase che fa imparare alle reclute, incisa sugli
            obelischi della Strada Antica, che discendere è fatale e che non
            discendere è morire incompleti. Ferro si passa la mano sui lati rasati
            della testa. «Diglielo tu che non abbiamo uomini» dice a Tenebra.

            Tenebra resta zitto finché Ferro non batte il boccale. «Odio quelli
            che parlano come me» dice, e scuote la testa.
          effetti: { rep.raschiatori: 0.5 }
          segue: l-orlo-della-cicatrice
      - testo: "Insistere finché Ferro cede"
        descrizione: "Ferro dice di no per mestiere. Bisogna farle capire che scenderai comunque, anche senza di lei."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Con lei o senza
          testo: |
            Le dici che sotto Capomozzo sei sceso da solo e hai lasciato un
            Costruttore sotto le macerie, e che nel Labirinto ci scenderai
            comunque, magari da un pozzo cieco dei contrabbandieri. «Diglielo tu
            che non abbiamo uomini» dice Ferro a Tenebra. Tenebra resta zitto a
            guardarti le mani.

            Alla fine a Ferro scappa una specie di risata dal naso. «Odio quelli
            che parlano come me» dice.
          effetti: { rep.raschiatori: 0.5 }
          segue: l-orlo-della-cicatrice
        fallimento:
          titolo: Punto
          testo: |
            Ferro ti lascia parlare fino in fondo, poi batte il boccale sul
            tavolo, e mezza sala si gira. «Ho detto no. Torna quando hai qualcosa
            da mostrarmi oltre alla faccia tosta.» Ti alzi con le orecchie che
            scottano e la zuppa ancora a metà, che Brunella ti porta via con uno
            sguardo di rimprovero per lo spreco.
          effetti: { tormento: 1 }
      - testo: "Proporle un contratto da cartografia"
        descrizione: "La Gilda pagava i Raschiatori a metro di mappa, e la tua licenza può riaprire quel contratto."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: A metro di mappa
          testo: |
            Posi la licenza della Gilda e le ricordi quando i Raschiatori si
            pagavano a metro di mappa. I turni persi li segni tu sul registro
            della Casa dei Nodi.

            «Diglielo tu che i miei non li vendo a metro» dice Ferro a Tenebra,
            contando sulle tre dita della sinistra. Alla fine le scappa una specie
            di risata dal naso. «Odio quelli che contano come me.»
          effetti: { rep.raschiatori: 0.5 }
          segue: l-orlo-della-cicatrice
      - testo: "Dirle quale pozzo dei contrabbandieri prenderesti"
        descrizione: "In Città Bassa si sa quali pozzi ciechi portano giù senza l'argano, e quanti ne risalgono."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il pozzo cieco
          testo: |
            Le dici da quale pozzo cieco dei contrabbandieri scenderai se l'argano
            non te lo dà. «Da lì sono scesi in tanti» dice Ferro a Tenebra.
            «Diglielo tu quanti ne sono risaliti.»

            Alla fine le scappa una specie di risata dal naso. «Odio quelli che
            parlano come me» dice. Nei vicoli chi conosce un pozzo prima o poi ci
            scende, e lei preferisce che tu scenda dal suo.
          effetti: { rep.raschiatori: 0.5 }
          segue: l-orlo-della-cicatrice

  - id: l-orlo-della-cicatrice
    immagine: ambientazione/cicatrice-del-mondo
    titolo: L'orlo della Cicatrice
    tipo: seguito
    luogo: I piloni sull'orlo della Cicatrice, di sera
    area: ponti-sospesi
    requisiti: [pista.capomozzo == 9]
    testo: |
      Fuori la sera sa di pioggia sul ferro. Tenebra e Ferro ti guidano per i
      vicoli dei Ponti, oltre i magazzini della Gilda dei Mercanti con le
      saracinesche già abbassate, giù fino ai piloni dove il vento sale dalla
      Cicatrice. Il ponte sospeso che porta all'argano pende sopra un vuoto
      color piombo.

      {origine mercante-dei-ponti} Davanti ai magazzini della Gilda conti le
      saracinesche abbassate senza volerlo, e per ognuna sai chi la chiude e
      quanto ci tiene dietro.

      La piattaforma è una ruota di acciaio annerito larga quanto una stanza,
      percorsa da incisioni dei Precursori che sembrano vene spente. Ferro
      controlla le catene una per una e alla leva del freno si sputa sulle
      mani. «La sera prima si prova sempre. Chi non prova l'argano lo prova il
      giorno dopo, quando ormai è tardi.»

      Libera il freno, e la piattaforma scende di un palmo sotto i tuoi
      stivali. Laggiù, lungo la parete della voragine, la Strada Antica si
      accende per un attimo in una linea di luce fredda che corre verso il
      basso, e nel mezzo della Cicatrice si vedono le sagome sospese del
      Labirinto di Darn-Morakh.

      {tecnologia Difficile} La Strada si è accesa quando la piattaforma si è
      mossa, come se fossero due pezzi dello stesso congegno.

      Ferro tira la leva, e la piattaforma si ferma con uno scossone.
    opzioni:
      - testo: "Restare a guardare il Labirinto"
        descrizione: "Domani, o fra una settimana. Stasera ti basta sapere che è lì."
        costo: 0
        esito:
          titolo: Sull'orlo
          testo: |
            Resti sulla piattaforma finché il vento non ti fa lacrimare. Ferro ripassa le catene
            con il palmo, una maglia alla volta. «L'argano è qui. Vieni al Grifone quando sei
            pronto e me lo dici, e io libero il freno per davvero.»

            Tenebra ti aspetta in cima al ponte sospeso, e quando gli passi accanto ti tocca la
            spalla una volta sola, come si fa con le reclute. «Buona caccia» dice a voce bassa,
            senza fermarsi. Dal ponte ti volti indietro, e la piattaforma dondola piano sulle
            catene, vuota, sopra il buio della Cicatrice.

            *Fine del Capitolo I*
          pe: { resilienza: 5 }
          effetti: { pista.capomozzo: 1, rep.raschiatori: 0.5, racconto: 1 }
      - testo: "Ascoltare il vento che sale dalla Cicatrice"
        descrizione: "Al Circolo ti hanno insegnato ad ascoltare il Bosco prima di entrarci, e il Labirinto è un bosco di pietra."
        quando: [origine.figlio-del-circolo >= 1]
        costo: 0
        esito:
          titolo: Il vento del Labirinto
          testo: |
            Chiudi gli occhi e ascolti, come al Circolo prima di entrare nel
            Bosco. Fra una folata e l'altra c'è una pausa lunga, che sale da molto
            più in basso. Ferro tiene la mano sulle catene. «L'argano è qui. Vieni
            al Grifone quando sei pronto, e io libero il freno per davvero.»

            In cima al ponte sospeso Tenebra ti tocca la spalla, come si fa con le
            reclute. «Buona caccia» dice a voce bassa. Mentre te ne vai il vento
            ti porta un odore di pietra bagnata che nel Bosco di Velthar non
            c'era.

            *Fine del Capitolo I*
          pe: { natura: 5 }
          effetti: { pista.capomozzo: 1, rep.raschiatori: 0.5, racconto: 1 }

  # ------------------------------------------------------------ gli Averi: il diario di Aurenne
  - id: leggere-il-diario-di-aurenne
    titolo: Il diario di Aurenne
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/cripta-di-idrian-sollen
    requisiti: [oggetto.diario-di-aurenne >= 1]
    sommario: "Un quaderno dalla copertina di stoffa, scritto da una ragazza nell'arco di quattro anni. L'ultima pagina non ha data."
    testo: |
      Il quaderno ha la copertina di stoffa azzurra consumata agli angoli e un
      nastro per segnare la pagina masticato in punta. Le prime pagine hanno
      una grafia tonda da scolara, con la data in cima e qualche fiore
      disegnato a margine. Più avanti le lettere si stringono e si inclinano,
      e verso la fine certe parole sono premute con tanta forza che il pennino
      ha bucato la carta. La prima data è dell'estate del centoquarantuno.
      L'ultima pagina scritta non ne ha nessuna.

      *Prima di Nhar'Kael c'era una ragazza che disegnava fiori nei margini.*
      Fra due pagine c'è un fiore secco, schiacciato tanto a lungo che la
      carta intorno ha preso il suo colore.
    opzioni:
      - testo: "L'estate del centoquarantuno"
        costo: 0
        esito:
          titolo: Un angelo
          testo: |
            La prima pagina racconta un compleanno. Il padre l'ha lasciata uscire
            prima dalle lezioni per prepararle la torta, e fuori dall'Accademia
            alcuni ragazzi l'hanno presa a sassate. *Uno mi ha colpita sopra
            l'occhio e mi hanno chiamata mostro. A casa papà mi ha detto che
            nessuno è come me, e che i capelli d'argento e gli occhi viola sono
            una benedizione, perché io sono il suo angelo*.
      - testo: "L'inverno all'Accademia"
        costo: 0
        esito:
          titolo: Gli uccellini sulle scale
          testo: |
            *Il Maestro Temmerin ci dà più compiti di quanti ne finirò mai. Amyll
            e le altre ridevano, e quando mi sono chiusa in bagno hanno spinto i
            banchi contro la porta. Mi ha aperto il signor Osric, che intagliava
            uccellini di legno sulle scale*.

            Poi un nome sottolineato due volte. *Rennick Dole mi ha seguita fino a
            casa, gridandomi dietro una parola che non voglio scrivere*.

            {origine allievo-di-torvessa} Anche a te Temmerin dava più compiti di
            quanti ne finissi.

            {origine figlio-della-citta-bassa} In città Rennick Dole lo ricordano
            come il bullo della scuola, e la parola la indovini.
      - testo: "La strada di Laresh e l'Abbazia"
        costo: 0
        esito:
          titolo: Benedetta
          testo: |
            *Sulla strada di Laresh mi ha circondata una dozzina di contadini.
            Volevano che li guarissi dalle piaghe, e dicevano che sono benedetta
            dal Grande Albero Rosso e che la mia voce caccia gli spiriti. Gli ho
            urlato contro e sono scappata. Stasera ho pregato l'Albero, e mi ha
            risposto un'altra voce*.

            Due mesi dopo il padre ha deciso di mandarla fra le novizie del Velo
            per il suo diciassettesimo compleanno, senza chiederle niente. *Amo
            l'Albero, ma una suora non la voglio fare. Voglio solo uscire, ed
            essere come le altre*.
      - testo: "Il ragazzo di Pannion"
        costo: 0
        esito:
          titolo: Delek
          testo: |
            Nell'inverno del centoquarantaquattro compare Delek, un carbonaio di
            Pannion che la porta a mangiare sull'orlo della Cicatrice. *È il primo
            ragazzo che mi parla come a una persona normale*. Per qualche pagina
            la grafia torna tonda, con una grotta lungo la strada dell'Acciaieria
            e la promessa di portarla a Pannion e sposarla.

            D'estate scrive una riga sola. *Credo di essere incinta, glielo dico
            stasera*. Sotto, a inchiostro sbavato, Delek è ripartito per Pannion
            dicendole che per lui era stata un passatempo. *Tre ore in ginocchio,
            e l'Albero non ha risposto. Le parole di Ottilia mi scivolano
            addosso*.
      - testo: "Il signor Wren"
        costo: 0
        esito:
          titolo: Le Notti Cucite
          testo: |
            Alla fine di quell'anno il padre non la lascia uscire per paura del
            Cucitore. *Ma lo so che si vergogna di me*. Una notte scappa lo
            stesso, e per strada aiuta il signor Wren a raccogliere gli uccellini
            caduti. *Mi ha detto che una ragazza bella come me non dovrebbe girare
            sola col buio*.

            Nel centoquarantacinque, due settimane dopo, la pagina è macchiata.
            *Hanno ucciso il signor Wren. Dicono che il Cucitore era lui, e dal
            santuario vedo bruciare la sua casa. Il signor Osric Wren era sempre
            gentile con me*.

            Ripensi all'uccellino senza un'ala sulla scrivania di Aurenne.
      - testo: "Le ultime pagine con una data"
        costo: 0
        esito:
          titolo: Sette mesi
          testo: |
            Le pagine che seguono sono brevi. *Faccio sogni orribili. Credo che il
            mio bambino sappia che sono maledetta*. Qualche giorno dopo la grafia
            scende storta lungo il foglio. *C'è sangue, ed è troppo presto, ha
            solo sette mesi. Ho sentito papà Idrian che parlava con Mirta per
            farmi abortire. Io il mio bambino non voglio perderlo. Ti prego,
            Grande Albero, salva il mio bambino e non farò mai più niente di
            sbagliato*.

            Il resto della pagina è vuoto, e per un po' tieni il diario chiuso
            sulle ginocchia con tutte e due le mani.
      - testo: "La pagina senza data"
        costo: 0
        esito:
          titolo: Il santuario brucia
          testo: |
            L'ultima pagina non ha data, e la grafia è così ferma che sembra di
            un'altra persona.

            *Nhar'Kael, questo è il suo nome. Lei mi ha ascoltata e ha capito il
            mio dolore, e mi ha dato la chiarezza che cercavo. I miei fedeli
            dell'Anonimo crescono di giorno in giorno. Da quando lei mi ha scelta
            è così facile piegare le persone. Mio padre brucia, e il santuario con
            lui. Un giorno toccherà a tutta la città*.

            Le pagine dopo sono bianche, e le sfogli fino all'ultima, nel caso che
            la ragazza dei fiori abbia lasciato ancora una riga.
      - testo: "Chiudere il diario"
        costo: 0
        esito:
          testo: "Richiudi piano il diario sul fiore secco e lo infili in fondo alla bisaccia, sotto tutto il resto."

  # ------------------------------------------------------------ gli Averi: il congegno di controllo
  - id: decifrare-congegno
    titolo: Decifrare il congegno
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.congegno-di-controllo >= 1, decifrato.congegno-di-controllo == 0]
    sommario: "Capire come funziona un reperto dei Precursori prima che sia lui a capire te."
    testo: |
      Il disco è grande come un palmo aperto e pesa più del dovuto. Lungo il
      bordo ha una corona di piccoli cristalli quasi tutti spenti, e al
      centro una conca liscia dove il pollice va a posarsi senza che tu lo
      decida. Quando lo tieni in mano senti un ronzio basso nei denti, e ti
      torna in mente il passo storto delle macchine ogni volta che Aurenne
      premeva quella conca.

      {tecnologia Media} La conca è consumata dalla parte del pollice
      destro. Qualcuno l'ha usato a lungo, e sempre con la stessa mano.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: congegno-di-controllo
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Capisci quali cristalli della corona segnano la carica e come va
            tenuto il pollice per non premere troppo. Il ronzio si abbassa e
            si fa regolare, e per qualche minuto il disco resta tiepido contro
            il palmo, come un sasso rimasto al sole.
          effetti: { decifrato.congegno-di-controllo: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            Tieni premuta la conca troppo a lungo, e il ronzio ti sale dai
            denti fino alle tempie. Quando posi il disco non ricordi più che
            cosa stavi facendo un momento prima, e ti ritrovi a fissare la
            tua mano come se fosse di qualcun altro.
          effetti: { tormento: 1 }
      - testo: "Fare come ti ha spiegato Aurenne"
        reperto: congegno-di-controllo
        descrizione: "In Cattedrale ti ha spiegato come lo usava, anche se ti consigliava di tenerne lontane le mani."
        requisiti: [capomozzo.congegno >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, resilienza], difficolta: Facile }
        successo:
          titolo: Decifrato
          testo: |
            Fai come ti ha spiegato lei, con un tocco breve e il pollice che si
            ritira subito. I cristalli della corona si accendono uno alla volta e
            il ronzio si ferma su una nota sola, e ti resta addosso una stanchezza
            leggera, come dopo una notte di guardia.
          effetti: { decifrato.congegno-di-controllo: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            Tieni il pollice sulla conca un attimo più del dovuto, e senti
            qualcosa che dall'altra parte ti spinge indietro. Molli il disco
            sul tavolo e per un'ora hai le dita intorpidite, e quando provi a
            chiudere il pugno lo fanno con un attimo di ritardo.
          effetti: { tormento: 1 }
