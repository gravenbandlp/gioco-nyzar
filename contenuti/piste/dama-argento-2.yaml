# La pista della Dama d'Argento, seconda metà: dal Ponte del Pesce a Jass (pista 8 → 11),
# più le carte della Città Bassa legate alla pista.
storylet:
  # ------------------------------------------------------------ 8 → 9 · il Ponte del Pesce
  - id: ponte-del-pesce
    immagine: ambientazione/cattedrale-del-velo
    titolo: Il Ponte del Pesce
    sommario: "Dopo Via dei Rasoi scendi fino al vecchio ponte di pietra rossa, e a metà ti fermi."
    luogo: Ponte del Pesce, fra la Città Bassa e i Ponti
    area: citta-bassa
    requisiti: [pista.dama-argento == 8]
    testo: |
      Lasci Via dei Rasoi che è già sera. In Via del Salmone metà delle lanterne è spenta, e
      sotto una di quelle accese una donna in ciabatte chiama «Fagiolo, Fagiolo» verso un
      gatto che non si vede.

      {origine figlio-della-citta-bassa} Da ragazzo questo ponte era il confine, e
      dall'altra parte cominciavano i Ponti, dove si andava a rubare e si tornava di corsa.

      In fondo alla via comincia il Ponte del Pesce, un arco di pietra rossa che porta ai
      Ponti Sospesi, e a metà ti fermi senza averlo deciso con i gomiti sul parapetto ancora
      tiepido. Le stelle escono una alla volta, e la prima, bassa a sud, è color lavanda.
      *Qualcuno in Città Bassa ci avrà già costruito sopra una profezia.* Per la prima volta
      da quando hai tirato la catena della Maison hai il tempo di pensare.
    opzioni:
      - testo: "Pensare a Rennick Dole"
        descrizione: "Rennick si è messo sotto la tua parola, e per ora è ancora libero."
        requisiti: [rennick != 2]
        costo: 0
        esito:
          titolo: Sotto la tua parola
          testo: |
            Pensi a Rennick sul bordo del letto, con le mani che tremavano e il
            tappo della bottiglia rosicchiato tutto intorno. Adesso è un uomo che
            beve per non pensare alla bambina della processione, affidato a te
            perché in città chi sa quello che sa lui dura poco. Ti chiedi quanto
            ti costerà mantenere la parola, e ci pensi finché la pietra rossa
            finisce sotto i tuoi piedi.
          pe: { empatia: 5 }
          effetti: { pista.dama-argento: 1 }
      - testo: "Pensare a Rennick Dole"
        descrizione: "In Via dei Rasoi gli Scuri se lo sono portato via."
        requisiti: [rennick == 2]
        costo: 0
        esito:
          titolo: Nelle mani degli Scuri
          testo: |
            Pensi a Rennick in Via dei Rasoi fra gli Scuri, e al modo in cui ti ha
            guardato l'ultima volta, senza rabbia. Adesso è nelle mani di Mirko
            Vesh, che lo terrà in vita finché avrà qualcosa da dire, e Rennick ha
            parecchio da dire. Te lo ripeti finché la stella color lavanda si alza
            di un dito sopra i tetti, poi riprendi a camminare verso i Ponti.
          pe: { empatia: 5 }
          effetti: { pista.dama-argento: 1 }
      - testo: "Pensare alla razzia"
        descrizione: "Cinque tribù che non si erano mai mosse insieme, e una parola che la Città Bassa ripete sottovoce."
        costo: 0
        esito:
          titolo: Mawrak'Thur
          testo: |
            Ripensi alla piazza del Festival, alle fosse comuni benedette in
            fretta e agli orchi che, braccati sull'orlo, hanno preferito saltare
            nella Cicatrice. Le cinque tribù non si erano mai mosse insieme, e
            quella sera le teneva in fila quella che chiamavano Dama d'Argento.
            Adesso in Città Bassa la parola la ripetono tutti, e all'imbocco del
            ponte un venditore di castagne l'ha scritta col gesso sul carretto per
            attirare gente.
          pe: { conoscenze-della-strada: 5 }
          effetti: { pista.dama-argento: 1 }
      - testo: "Pensare a te stesso"
        descrizione: "In Via dei Rasoi è morto un uomo, e tu c'eri."
        requisiti: [squiggor >= 2]
        costo: 0
        esito:
          titolo: Odore di metallo
          testo: |
            Pensi a Squiggor Ironfist steso sul selciato di Via dei Rasoi, con la
            benda nera storta, e ti viene in mente, senza un motivo, che non sai
            se qualcuno andrà a reclamarlo. Sulle mani ti è rimasto un odore di
            metallo bagnato, e stringi il parapetto finché smettono di tremare.
            Poi le pulisci sui calzoni e riprendi a camminare.
          pe: { resilienza: 5 }
          effetti: { pista.dama-argento: 1 }
      - testo: "Pensare a te stesso"
        descrizione: "Pochi giorni fa quella parola era soltanto un suono che si ripeteva nelle code alla fontana."
        requisiti: [squiggor == 0]
        costo: 0
        esito:
          titolo: La pietra fredda
          testo: |
            Ripensi a com'eri il giorno in cui hai cominciato a chiedere in giro
            che cosa volesse dire *Mawrak'Thur*. Da allora sei entrato in una casa
            dove non si entra senza appuntamento e hai guardato in faccia gli
            Scuri, e a quest'ora il tuo nome è arrivato anche alla Pignatta,
            probabilmente storpiato. Resti al parapetto finché la Cattedrale non
            ha acceso l'ultima luce.
          effetti: { pista.dama-argento: 1, tormento: -0.5 }
      - testo: "Pensare a Ghoran"
        descrizione: "La parola che la Città Bassa ripete sottovoce l'avevi già sentita nei recinti, prima di scappare."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        costo: 0
        esito:
          titolo: La bilancia
          testo: |
            Ripensi ai recinti di Ghoran, ai sorveglianti che usavano quella
            parola per la Marea Grigia e alla bilancia su cui ti hanno fatto
            salire. Da quando sei scappato hai sempre guardato la strada davanti a
            te, e stasera ti volti indietro per la prima volta. Poi riprendi a
            camminare verso i Ponti con le mani in tasca, al passo di un uomo
            libero, che stai ancora imparando.
          pe: { resilienza: 5 }
          effetti: { pista.dama-argento: 1 }
      - testo: "Guardare le lanterne del Ponte dei Morti"
        descrizione: "Si vedono sopra la Cicatrice, e tu sai per chi si accendono."
        quando: [origine.apprendista-raschiatore >= 1]
        costo: 0
        esito:
          titolo: Senza corda
          testo: |
            Oltre le corde dei Ponti le lanterne del Ponte dei Morti dondolano a
            centinaia sopra la Cicatrice, una per ogni Raschiatore sceso nel
            Labirinto e mai risalito. Le conti a gruppi di dieci, come sulle
            piattaforme si contano le funi, e intanto ti torna in mente la loro
            regola, che prima si esce e chi resta indietro si trascina.
          pe: { percezione: 5 }
          effetti: { pista.dama-argento: 1 }

  # ------------------------------------------------------------ 9 → 10 · prima strada: il morto
  - id: i-morti-parlano
    presso: cimitero-di-qir-azel
    immagine: ambientazione/cimitero-di-qir-azel
    titolo: I morti parlano
    sommario: "Il corpo di Squiggor Ironfist aspetta al Cimitero, e un monaco del Velo può farlo parlare."
    luogo: Cimitero di Qir-Azel, al tramonto
    area: citta-bassa
    requisiti: [pista.dama-argento == 9, squiggor >= 2]
    testo: |
      Il corpo di Squiggor Ironfist è arrivato al Cimitero di Qir-Azel su un carro della Caserma, e
      da due giorni aspetta in una cella di pietra che qualcuno lo reclami. Gli Scuri non si sono
      fatti vivi, e il garzone delle fosse, che tiene il cimitero da quando il becchino Gundo Marl è
      sparito, l'ha registrato alla voce *ignoti, morte violenta*.

      Al tramonto arriva un monaco della Confraternita del Velo con una borsa di candele, mandato da
      Ottilia Sanvel, che vuole sapere che cosa sapeva quest'uomo.

      {origine accolito-del-velo} Il monaco parla a frasi corte senza superlativi e ti guarda le mani
      prima della faccia.

      «Quattro domande, cinque al massimo» dice. «Poi la porta si richiude da sola, e chi la tiene
      aperta paga per tutto il tempo che resta aperta. Io dico le parole e tu reggi la candela.» Il
      rito, aggiunge, ha un prezzo.
    opzioni:
      - testo: "Pagare il rito"
        descrizione: "L'offerta al Velo, e il monaco farà il minimo indispensabile."
        requisiti: [monete >= 12]
        esito:
          titolo: Dentro il cerchio
          testo: |
            Il monaco conta le monete due volte e le fa sparire nella borsa.
            Traccia un cerchio di sale attorno al tavolo di pietra e ti mette in
            mano la candela più grossa, poi ti fa inginocchiare dentro il cerchio,
            accanto alla testa del morto. Lui resta fuori dal sale con il libretto
            aperto, e quando comincia a leggere la fiamma della tua candela si
            piega verso il cadavere.
          effetti: { monete: -12, tormento: 1.5 }
          segue: i-morti-parlano-rito
      - testo: "Chiederlo come favore alla Confraternita"
        descrizione: "Al Velo hai fatto qualche favore, e adesso puoi chiederne uno indietro."
        requisiti: [rep.velo >= 2]
        esito:
          titolo: Fuori dal cerchio
          testo: |
            Il monaco ti guarda un momento più a lungo e annuisce, perché il tuo
            nome in Cattedrale l'ha sentito con rispetto. Traccia un cerchio di
            sale attorno al tavolo di pietra e ci entra lui, lasciando a te la
            candela e un posto fuori. «Se la fiamma si piega verso di lui, fai un
            passo indietro» dice, e dopo poche righe la fiamma si piega verso il
            cadavere.
          effetti: { tormento: 1 }
          segue: i-morti-parlano-rito
      - testo: "Convincere il monaco che serve a tutti"
        descrizione: "Quello che sapeva Squiggor interessa anche a Ottilia Sanvel, e il monaco lo sa."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Per la città
          testo: |
            Gli parli di Rennick Dole e di quello che gli Scuri potrebbero sapere
            sulla Dama d'Argento. Il monaco ammette che Ottilia gli ha chiesto di
            tornare con delle risposte, e che per averle gli serve qualcuno che
            regga la candela, e lo dice guardando il morto, come se dovesse
            convincere anche lui. Poi traccia il cerchio di sale e ti ci fa
            inginocchiare dentro prima di cominciare a leggere.
          effetti: { tormento: 1.5 }
          segue: i-morti-parlano-rito
        fallimento:
          titolo: Di malavoglia
          testo: |
            Il monaco sospira e dice che Ottilia verrà a sapere quanto hai
            insistito. Traccia il cerchio di sale in fretta, storto da un lato, e
            ti mette dentro con la candela senza spiegarti niente, con la bocca
            stretta di uno che stasera era atteso a cena. Legge troppo veloce, e
            la fiamma si piega verso il cadavere prima che abbia finito la prima
            riga.
          effetti: { tormento: 1.5, rep.velo: -0.5 }
          segue: i-morti-parlano-rito
      - testo: "Dire le parole del rito insieme al monaco"
        descrizione: "Le parole del rito le hai sentite in Cattedrale, dette sopra i morti della razzia."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Due voci
          testo: |
            Il monaco ti guarda le mani mentre accendi le candele e capisce prima
            che tu parli. Nel cerchio di sale entrate tutti e due e leggete
            insieme, la tua voce mezza riga dietro la sua, come in Cattedrale si
            fa con i novizi. Quando la fiamma si piega verso il cadavere ti dice a
            mezza bocca che Ottilia saprà chi gli ha tenuto la candela stasera.
          effetti: { tormento: 1 }
          segue: i-morti-parlano-rito
      - testo: "Parlare al monaco della porta dei morti"
        descrizione: "Nei libri dell'Accademia questo rito ha un altro nome e molte note a margine."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [accademiche], difficolta: Media }
        successo:
          titolo: Le note a margine
          testo: |
            Gli dici quello che ricordi dei libri dell'Accademia, dove la porta
            dei morti ha un capitolo intero. Il monaco ti corregge due parole e su
            una terza ti dà ragione a malincuore. Quando nomini il cerchio di sale
            annuisce senza accorgersene, e poi lo traccia e ti ci fa inginocchiare
            dentro prima di cominciare a leggere.
          effetti: { tormento: 1.5 }
          segue: i-morti-parlano-rito
        fallimento:
          titolo: La parola sbagliata
          testo: |
            A metà spiegazione ti scappa la parola magia, e il monaco chiude gli
            occhi come davanti a una bestemmia. Dice che Ottilia verrà a sapere
            anche questo. Il cerchio di sale lo traccia in fretta, storto da un
            lato, e la fiamma si piega verso il cadavere prima che abbia finito la
            prima riga.
          effetti: { tormento: 1.5, rep.velo: -0.5 }
          segue: i-morti-parlano-rito

  - id: i-morti-parlano-rito
    presso: cimitero-di-qir-azel
    immagine: cronaca/sessione-16
    titolo: La porta aperta
    tipo: seguito
    luogo: Cimitero di Qir-Azel, nella cella di pietra
    area: citta-bassa
    requisiti: [pista.dama-argento == 9]
    testo: |
      Il cadavere non risponde subito. Prima la mascella si muove a vuoto, poi
      la voce arriva da sotto lo sterno, come da dentro un otre di pelle, e ti
      accorgi di aver fatto un passo indietro.

      «Non nell'aldilà» dice, e ride con una risata raschiata. «In una cella,
      con le facce sbagliate.» *Da vivo diceva una parola ogni tanto, e adesso
      non smette più.* Il monaco gli chiede dei mulini bruciati negli ultimi
      anni.

      «Bruciati perché Malgrani avesse il pane tutto per sé» risponde
      Squiggor, e la mascella schiocca sulla parola pane.

      Il monaco chiede dei ponti e della Gilda. «Nella Gilda gente comprata
      come pane vecchio, e Custodi che guardano dall'altra parte per pochi
      spiccioli. Il tizio dei ponti, quello di notte, lui sa dove passano le
      cose.»

      {ingannare Media} In Cattedrale dicono che i morti non mentono. Questo
      sceglie cosa dire con il gusto di un baro che tiene le carte buone per
      ultime.

      Chiedi della Dama d'Argento, e il morto sbuffa grigio. «La cerchiamo
      anche noi, e non la trova nessuno.» Poi la testa si inclina di lato.
      «Senti questa. E della piccola non chiedete? Della piccola Acari?»

      La porta pesa sempre di più nelle spalle e nei denti, e ti restano una o
      due domande.
    opzioni:
      - testo: "Lasciarlo parlare fino alla fine"
        descrizione: "Dirà volentieri tutto quello che fa male, e il resto non gli interessa."
        costo: 0
        esito:
          titolo: Quello che sapeva il morto
          testo: |
            Della piccola Squiggor parla con piacere. «Occhi svegli e lingua troppo lunga, canta per lo sceriffo e Mirko le dà da
            portare bugie. Prima della prossima luna è morta.» Secondo Mirko lo sceriffo usa gli orchi come scusa contro gli
            Scuri. Ridendo racconta che Rennick ha parlato con Jass, la sua rossa della Maison, che è degli Scuri, e lei l'ha
            detto a Mauro, e Mauro a Mirko.
          imposta: { indizio.custode-notturno: 1 }
          effetti: { informazioni.segreto: 1, pista.dama-argento: 1 }

  # ------------------------------------------------------------ 9 → 10 · seconda strada: il resoconto
  - id: resoconto-alla-pignatta
    presso: pignatta-grassa
    immagine: personaggi/rozalia-marga
    titolo: Il resoconto alla Pignatta
    sommario: "Hai promesso a Rozalia Marga di raccontarle tutto, e lei ti ripaga con quello che sanno gli Scuri."
    luogo: Pignatta Grassa, all'ora del mercato
    area: citta-bassa
    requisiti: [pista.dama-argento == 9, resoconto.scuri >= 1]
    testo: |
      All'ora del mercato la Pignatta Grassa è quasi vuota, e al tavolo
      delle carte Nihali Cuzan mescola un mazzo per nessuno. Mauro Scrocco
      grida il tuo nome come se fossi un parente tornato dalla guerra, poi
      indica con il mento il retrobottega.

      Il retrobottega è più ordinato della sala, con scaffali pieni di
      cartelle, ognuna etichettata con la famiglia e il mestiere di chi ha
      firmato. Rozalia Marga siede al banco con la piuma d'oca dietro
      l'orecchio.

      {origine mercante-dei-ponti} Su uno scaffale c'è una cartella con
      l'etichetta *mercante, Ponti*, e ti sorprendi a cercarci dentro il tuo
      nome.

      «Puntuale» dice senza alzare gli occhi dal foglio. «La gente puntuale
      mi piace, perché si fa meno fatica a trovarla. Siediti, che il tempo
      lo segno anche a te.» La sedia davanti al banco è più bassa di una
      spanna, e per guardarla devi alzare il mento.
    opzioni:
      - testo: "Raccontarle tutto"
        descrizione: "Le racconti la parola orchesca e quello che Rennick ti ha detto nella sua stanza alla Maison."
        esito:
          titolo: Tutto
          testo: |
            Le racconti della parola orchesca e di quello che Rennick Dole ti ha
            detto nella sua stanza alla Maison, e Rozalia scrive in fretta con una
            grafia piccola e diritta, interrompendoti solo per farti ripetere i
            nomi. Quando hai finito soffia sull'inchiostro e dice che Mirko sarà
            contento. «Adesso però ti pago io, perché i conti li chiudo sempre in
            pari, al quattrino.»
          segue: i-conti-di-rozalia
      - testo: "Raccontarle solo una parte"
        descrizione: "Le dai quanto basta per chiudere la promessa, e il resto lo tieni per te, se ci riesci."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Quanto basta
          testo: |
            Le racconti della parola orchesca e della paura di Rennick, e lasci
            fuori i dettagli che ti sembrano valere di più. Tieni le mani ferme
            sulle ginocchia, perché Rozalia guarda più quelle della tua faccia, e
            il sudore te lo senti solo dietro le orecchie. Quando hai finito
            soffia sull'inchiostro e dice che Mirko sarà contento. «Adesso però ti
            pago io, perché i conti li chiudo sempre in pari.»
          effetti: { informazioni.pettegolezzo: 1 }
          segue: i-conti-di-rozalia
        fallimento:
          titolo: Una firma storta
          testo: |
            A metà del racconto Rozalia posa la penna. «Hai saltato un pezzo,
            tesoro. Prima di arrivarci hai ripreso fiato, e chi fa così sta per
            scavalcare qualcosa.» Aspetta che tu racconti anche il resto e lo
            scrive, mentre ti scaldano le orecchie. Ti pagherà lo stesso, perché i
            conti li chiude in pari, ma accanto al tuo nome nel registro adesso
            c'è un segno, e lo traccia davanti a te.
          effetti: { rep.scuri: -0.5, sospetto: 1 }
          segue: i-conti-di-rozalia
      - testo: "Darle il resoconto come un conto della Gilda"
        descrizione: "Una voce per riga e nessuna riga in più, come con gli esattori della Gilda."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Un conto che torna
          testo: |
            Le detti il racconto come un conto all'esattore della Gilda, una voce
            per riga, con i nomi in colonna e i giorni a margine. Rozalia scrive
            senza interromperti, e i dettagli che valgono di più restano fuori
            senza che si veda il buco, perché un conto che torna nessuno lo
            ricontrolla. «Adesso però ti pago io» dice alla fine, soffiando
            sull'inchiostro, «perché i conti li chiudo sempre in pari.»
          effetti: { informazioni.pettegolezzo: 1 }
          segue: i-conti-di-rozalia

  - id: i-conti-di-rozalia
    presso: pignatta-grassa
    immagine: ambientazione/pignatta-grassa
    titolo: I conti in pari
    tipo: seguito
    luogo: Pignatta Grassa, nel retrobottega
    area: citta-bassa
    requisiti: [pista.dama-argento == 9]
    testo: |
      Rozalia batte due volte la penna sull'orlo del calamaio.

      «I mulini bruciati in questi anni» dice mentre scrive, «sono bruciati
      perché i Malgrani avessero in mano tutta la farina. Sui ponti i custodi
      si comprano con una mancia, e nella Gilda c'è gente che costa poco di
      più. Il tizio dei ponti, quello di notte, sa dove passano le merci che
      la Gilda non registra.»

      Della Dama d'Argento gli Scuri sanno poco, e per questo Rennick gli
      interessava tanto.

      Poi si china sul banco. «Un consiglio, e nemmeno quello è gratis. La
      piccola Acari, quella col cappuccio blu che corre fra i tavoli, porta
      notizie allo sceriffo. Mirko lo sa da settimane e le dà da portare roba
      falsa, e prima della prossima luna non correrà più.» Si pulisce la punta
      della penna su uno straccio, con più attenzione di quanta ne abbia
      dedicata alla bambina.
    opzioni:
      - testo: "Chiederle come hanno saputo di Rennick"
        descrizione: "In Via dei Rasoi sapevano dove cercarlo, e qualcuno gliel'aveva detto."
        costo: 0
        esito:
          titolo: La linea bruciata
          testo: |
            Rozalia sorride appena. «Da una rossa della Maison, Jass. Rennick le
            ha parlato all'alba, lei l'ha detto a Mauro e Mauro a Mirko, ma quella
            linea ormai è bruciata, perché Nerissa le sta addosso da settimane.»
            Poi, quasi distratta, aggiunge che Mirko crede che lo sceriffo usi la
            crisi degli orchi come scusa per venire a prendere gli Scuri.
          imposta: { indizio.custode-notturno: 1 }
          effetti: { resoconto.scuri: -1, rep.scuri: 0.5, informazioni.segreto: 1, pista.dama-argento: 1 }

  # ------------------------------------------------------------ 9 → 10 · terza strada: il prigioniero
  - id: il-tagliagole-catturato
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Il tagliagole in cella
    sommario: "Al posto di guardia della Caserma c'è uno degli Scuri preso nei giorni della razzia."
    luogo: Posto di guardia della Caserma, Città Bassa
    area: citta-bassa
    requisiti: [pista.dama-argento == 9, squiggor == 0, resoconto.scuri == 0]
    testo: |
      Il posto di guardia della Caserma è una casa di pietra blu stretta fra
      una conceria e un forno, e dentro, a seconda del vento, si sente il
      pane oppure le pelli. Il sergente di turno dorme su una branda dietro
      il bancone.

      Nei giorni del Festival le guardie hanno preso tre Scuri che svuotavano
      un magazzino della Gilda, e il terzo è ancora qui, nella cella in
      fondo, perché alla Caserma non c'era più posto. È un uomo magro con una
      cicatrice che gli taglia il sopracciglio.

      Il sergente ti riconosce dalla sera del Festival e ti apre la porta del
      corridoio. «A noi non ha detto niente, ha più paura di Mirko Vesh che
      della forca.»

      Il tagliagole si tira indietro sulla paglia fino al muro. «Io non ho
      detto niente a nessuno, capito?» dice prima che tu apra bocca.
    opzioni:
      - testo: "Farlo parlare"
        descrizione: "Puoi spaventarlo, oppure fargli capire che là fuori Mirko ha già deciso che ha parlato."
        prova: { attributo: sociale, abilita: [intimidire, empatia], difficolta: Media }
        successo:
          titolo: Tanto vale
          testo: |
            Gli spieghi con calma quello che sa già. Mirko non manda nessuno a
            tirarlo fuori, e quando uscirà gli Scuri daranno per scontato che
            abbia parlato, quindi tanto vale parlare davvero, a qualcuno che può
            ricordarsi di lui. Il tagliagole si stacca con i denti una pellicina
            dal pollice, mentre sulla soglia il sergente tira fuori un mozzicone
            di matita, poi si passa la lingua sulle labbra spaccate e comincia.
          effetti: { rep.caserma: 1 }
          segue: il-tagliagole-parla
        fallimento:
          titolo: Mezza verità
          testo: |
            Il tagliagole parla poco e guardando la porta. Ti dice che il tizio
            dei ponti, quello di notte, sa dove passano le merci, e che una rossa
            della Maison, Jass, passa a Mauro quello che sente. Per farti andare
            via aggiunge che «quello di sopra», come chiama Mirko, sa che la
            piccola Acari fa la spia per lo sceriffo, poi si gira verso il muro.
          imposta: { indizio.custode-notturno: 1 }
          effetti: { informazioni.pettegolezzo: 1, sospetto: 1, pista.dama-argento: 1 }
      - testo: "Sederti sulla paglia accanto a lui"
        descrizione: "Sai cosa vuol dire guardare una porta per giorni, aspettando che altri decidano quanto vali."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Da pari
          testo: |
            Ti siedi sulla paglia accanto a lui, e la paglia ha lo stesso odore
            dei recinti di Ghoran. Gli racconti di come si guarda una porta per
            giorni aspettando che altri decidano quanto vali. «E tu come ne sei
            uscito, capito?» chiede lui con le ginocchia al petto, e quando glielo
            dici ci pensa a lungo, poi si passa la lingua sulle labbra spaccate e
            comincia a parlare.
          effetti: { rep.caserma: 1 }
          segue: il-tagliagole-parla
      - testo: "Parlargli come si parla nei vicoli"
        descrizione: "Nei vicoli dove sei cresciuto chi finisce dentro sa già come va a finire."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada], difficolta: Facile }
        successo:
          titolo: Il gergo
          testo: |
            Ti accucci davanti alla paglia e gli parli nel gergo dei vicoli,
            quello che si impara prima di saper leggere. Fuori, per gli Scuri, uno
            rimasto una settimana in cella ha già cantato, e a quel punto conviene
            cantare a qualcuno che se lo ricorda. Lui ti guarda in faccia e
            capisce da dove vieni, poi si passa la lingua sulle labbra spaccate e
            comincia.
          effetti: { rep.caserma: 1 }
          segue: il-tagliagole-parla
        fallimento:
          titolo: Uno dei vicoli
          testo: |
            Ti riconosce dal gergo e per questo si chiude, perché uno dei vicoli
            che parla con le guardie è peggio di una guardia. Ti dice soltanto del
            tizio dei ponti di notte e di Jass, la rossa della Maison che passa a
            Mauro quello che sente. Per farti andare via aggiunge che «quello di
            sopra» sa che la piccola Acari fa la spia per lo sceriffo.
          imposta: { indizio.custode-notturno: 1 }
          effetti: { informazioni.pettegolezzo: 1, sospetto: 1, pista.dama-argento: 1 }

  - id: il-tagliagole-parla
    immagine: fazioni/scuri
    titolo: Quello che sa un tagliagole
    tipo: seguito
    luogo: Posto di guardia della Caserma, nella cella in fondo
    area: citta-bassa
    requisiti: [pista.dama-argento == 9]
    testo: |
      «I mulini li hanno bruciati perché i Malgrani avessero in mano tutta
      la farina, capito? Lo sapevano in dieci alla Pignatta, e adesso siamo
      in undici» dice il tagliagole, e sputa nella paglia. «Sui ponti i
      custodi guardano dall'altra parte per un'inezia, e nella Gilda c'è
      gente comprata. Nomi non ne ho, però il tizio dei ponti, quello di
      notte, sa dove passano le cose che la Gilda non vede.»

      Della Dama d'Argento non sa niente, e alza gli occhi al soffitto come
      se Mirko Vesh abitasse al piano di sopra. «Quello di sopra vuole
      sapere chi è.»

      Poi abbassa la voce. «La piccola Acari, quella col cappuccio blu,
      canta per lo sceriffo. Mirko le dà da portare notizie false, e l'ha
      già condannata prima della prossima luna.»

      {percezione Facile} Ogni volta che nomina Mirko guarda il soffitto, e
      quando nomina la bambina guarda la porta.
    opzioni:
      - testo: "Chiedergli della Maison e dello sceriffo"
        descrizione: "Alla Maison Rennick parlava con qualcuno, e gli Scuri lo sono venuti a sapere."
        costo: 0
        esito:
          titolo: La rossa della Maison
          testo: |
            «Alla Maison abbiamo una rossa, Jass» dice il tagliagole, guardando di
            nuovo il soffitto. «Passa a Mauro quello che i clienti le dicono a
            letto, e Mauro lo porta di sopra, capito?» Sullo sceriffo sa solo
            quello che diceva Mirko prima della razzia, che Galdrick usa gli orchi
            come scusa per preparare qualcosa contro gli Scuri. Il sergente fa
            finta di non aver sentito, e all'uscita ti stringe la mano.
          imposta: { indizio.custode-notturno: 1 }
          effetti: { informazioni.segreto: 1, pista.dama-argento: 1 }

  # ------------------------------------------------------------ 10 → 11 · Jass, il doppio filo
  - id: jass-doppio-filo
    presso: via-dei-rasoi
    immagine: personaggi/jass
    titolo: Il doppio filo
    sommario: "Jass ha passato agli Scuri le parole di Rennick, e alla Maison Nerissa la tiene d'occhio."
    luogo: Maison des Lunes, Via dei Rasoi
    area: citta-bassa
    requisiti: [pista.dama-argento == 10]
    testo: |
      Sopra la porta della Maison des Lunes la lanterna è accesa, e Sara
      Beck, chiudendo le tue armi nell'armadio, ti chiama per nome.

      Nel salone Jass gira fra le poltrone a seno nudo e ride alle battute di
      un cliente. Adesso sai che le parole di Rennick le ha passate a Mauro
      Scrocco, e sopra Mauro c'è Mirko Vesh.

      {origine rampollo-dei-quartieri-alti} Su una poltrona d'angolo il
      panciotto ricamato che vedevi ai tavoli del Consiglio ti riconosce e si
      gira verso la tenda.

      Dalla scala Nerissa Dalvane segue Jass con gli occhi, mentre Tachek
      aspetta vicino alla tenda con Kanat e Churl alle due porte.

      Jass ti porta di sopra. Quando le dici quello che sai non nega, e si
      siede accavallando le gambe. «Il ragazzo della Segheria beve troppo e
      parla peggio. Allora, sei qui per farmi del male o per farmi
      un'offerta?»
    opzioni:
      - testo: "Offrirle soldi e protezione, e tacere con Nerissa"
        descrizione: "Le prometti di tenerla viva se parla, e metti sul letto i soldi per dimostrarlo."
        requisiti: [monete >= 15]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Le tue orecchie
          testo: |
            Posi sul letto un gruzzolo e le spieghi che se gli Scuri la credessero
            compromessa la ammazzerebbero, e che tu puoi fare in modo che non lo
            credano. Jass conferma che le parole di Rennick sono andate a Mauro e
            da Mauro a Mirko. «D'accordo, da stasera le mie orecchie lavorano
            anche per te. Ma se Nerissa lo viene a sapere da te, sono morta prima
            di domattina.»
          imposta: { jass: 1 }
          effetti: { monete: -15, pista.dama-argento: 1, racconto: 1 }
        fallimento:
          titolo: Troppo poco
          testo: |
            Jass ascolta l'offerta fino in fondo, poi spinge indietro le monete
            con due dita. «Mi proteggeresti tu da Mirko?» dice ridendo piano, e ti
            accompagna alla porta con un bacio sulla guancia che sa di acqua di
            rose. All'alba Sara Beck ti manda a dire che Jass se n'è andata verso
            la Pignatta con una borsa. Adesso gli Scuri sanno che qualcuno li
            cerca dentro la Maison.
          imposta: { jass: 3 }
          effetti: { rep.scuri: -0.5, sospetto: 1, pista.dama-argento: 1, racconto: 1 }
      - testo: "Portare la cosa a Nerissa"
        descrizione: "Nerissa la sospetta da settimane e le manca solo la prova. Tu ce l'hai."
        esito:
          immagine: personaggi/nerissa-dalvane
          titolo: La falla chiusa
          testo: |
            Nerissa ti ascolta in piedi, con una mano sul corrimano. «Lo sapevo da
            settimane. Mi mancava la prova.» A un suo segno Churl accompagna Jass
            fuori dalla porta sul retro, con la borsa già pronta. Poi Nerissa ti
            versa il tè buono della scatola di latta e dice che lo sceriffo lo
            saprà stanotte, e che da domani la Maison ti deve un favore, e anche
            lui.
          imposta: { jass: 2 }
          effetti: { rep.maison: 1, rep.caserma: 1, rep.scuri: -1, pista.dama-argento: 1, racconto: 1 }
      - testo: "Metterle paura"
        descrizione: "Alzi la voce e le stringi il polso. Alla Maison qualcuno se ne accorgerà subito."
        prova: { attributo: fisico, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Auguri
          testo: |
            Le stringi il polso e lei non si scompone. «Uccidermi qui, nella casa
            di Nerissa? Auguri.» Sotto le tue dita però il polso le batte veloce,
            e prima che la porta si apra ti soffia i nomi di Mauro e di Mirko.
            Tachek entra con il pugno chiuso, e tu esci prima che debba usarlo.
            All'alba Jass è scappata alla Pignatta, e gli Scuri sanno che qualcuno
            li cerca.
          imposta: { jass: 3 }
          effetti: { sospetto: 1, rep.maison: -1, pista.dama-argento: 1, racconto: 1 }
        fallimento:
          titolo: Fuori
          testo: |
            Jass fa un gesto piccolo con la mano libera, e prima che tu conti fino a due
            Kanat è nella stanza. Ti solleva per la collottola e ti porta giù davanti a
            tutto il salone, e Churl apre la porta. In strada ti raccogli da terra sotto
            la lanterna accesa. All'alba Jass è già scappata alla Pignatta, e mezza Via
            dei Rasoi sa come sei uscito dalla Maison.
          imposta: { jass: 3 }
          effetti: { scandalo: 1.5, rep.maison: -1, pista.dama-argento: 1, racconto: 1 }

  # ------------------------------------------------------------ carte della pista
  - id: carta-lanterna-spenta
    immagine: ambientazione/maison-des-lunes
    titolo: La lanterna spenta
    sommario: "Sopra la porta della Maison des Lunes la lanterna è spenta, e sulla soglia Sara Beck lava il gradino."
    tipo: carta
    area: citta-bassa
    requisiti: [pista.dama-argento >= 6, pista.pelle < 6]
    testo: |
      Passando per Via dei Rasoi ti accorgi che stanotte la lanterna sopra
      la porta della Maison des Lunes è spenta, e in Città Bassa tutti sanno
      che vuol dire un guaio. Sulla soglia Sara Beck strofina il gradino con
      uno straccio, accanto a un secchio d'acqua diventata rosa. All'angolo
      con Via del Salmone due vicini fingono di discutere del prezzo del
      sale, uno in camicia da notte sotto il mantello, e intanto guardano la
      porta.

      {medicina Facile} Quel rosa può essere poco sangue in molta acqua,
      oppure molto sangue con il secchio cambiato spesso.
    opzioni:
      - testo: "Offrire una mano a Sara Beck"
        descrizione: "Il secchio è pesante e la notte è lunga."
        esito:
          titolo: Il secchio
          testo: |
            Sara ti passa il secchio senza dire niente, e lo svuoti nel tombino
            all'angolo. Alla terza volta ti dice che un uomo è salito al primo
            piano senza appuntamento e ha alzato le mani su una delle ragazze, e
            che Kanat l'ha accompagnato fuori, lasciandolo camminare da solo fino
            al cristallo. Lo dice con una punta d'orgoglio, e rientrando ti
            ringrazia per nome.
          effetti: { rep.maison: 0.5 }
      - testo: "Chiedere ai vicini che cosa è successo"
        descrizione: "In Via dei Rasoi le finestre hanno occhi, e i vicini hanno voglia di parlare."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Facile }
        successo:
          titolo: Un uomo di Mauro
          testo: |
            I due vicini aspettavano soltanto che qualcuno glielo chiedesse.
            L'uomo buttato fuori da Kanat beveva alla Pignatta, spesso al bancone
            con Mauro Scrocco, e chiedeva di una ragazza con i capelli rossi, e
            quando gliel'hanno negata è salito lo stesso.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Il prezzo del sale
          testo: |
            I due vicini smettono di parlare quando ti avvicini, poi riprendono
            a discutere del prezzo del sale. Uno dei due, andandosene,
            si ferma a guardarti la faccia con attenzione.
          effetti: { sospetto: 1 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: "Prosegui verso Via del Salmone. Dietro di te Sara Beck continua a strofinare il gradino."

  - id: carta-balestrieri-sui-tetti
    immagine: fazioni/scuri
    titolo: Balestre sui tetti
    sommario: "In Via dei Rasoi due sagome con la balestra camminano sui tetti alla tua stessa velocità."
    tipo: carta
    area: citta-bassa
    requisiti: [pista.dama-argento >= 8, pista.pelle < 6]
    testo: |
      Al tramonto, in Via dei Rasoi, hai appena superato la Maison quando
      sopra di te una tegola scivola e si rompe. Sui tetti ai due lati della
      via due sagome con la balestra stanno dietro i camini, come la sera di
      Rozalia Marga. Le balestre restano abbassate, ma quando cammini le
      sagome si spostano da un tetto all'altro, e quando ti fermi aspettano.

      {intimidire Media} Chi vuole ammazzarti davvero non si mette in piedi
      sui camini a farsi contare.

      Dopo il gomito della via ci sono tre vicoli e la strada verso il posto
      di guardia della Caserma.
    opzioni:
      - testo: "Seminarli fra i vicoli"
        descrizione: "Fra i vicoli i tetti si interrompono, e chi cammina lassù deve scendere."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Dall'altra parte
          testo: |
            Infili il secondo vicolo e aspetti nell'ombra di un portone, dietro le
            case. Dopo un po' uno dei due scende da una grondaia con la balestra a
            tracolla. È un ragazzo di sedici anni, con i calzoni rattoppati sulle
            ginocchia con una stoffa a fiori da tenda, e adesso conosci la sua
            faccia e la porta da cui è entrato.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Un avvertimento
          testo: |
            Nel terzo vicolo un dardo si pianta nella trave accanto alla tua testa
            e resta a vibrare. È un avvertimento, e tu corri fino alla piazza del
            mercato, dove una ronda della Caserma ti vede arrivare trafelato e si
            segna la tua faccia.
          effetti: { sospetto: 1 }
      - testo: "Fermarti sotto il tetto e salutarli"
        descrizione: "Vogliono sapere se hai paura. Puoi dirglielo tu."
        esito:
          titolo: Il saluto
          testo: |
            Ti fermi in mezzo alla strada e alzi la mano verso il camino più
            vicino, con il braccio che trema appena, abbastanza perché lo senta
            solo tu. Dopo un momento una delle sagome alza la balestra verso il
            cielo come si alza un bicchiere. Poi spariscono tutte e due dietro il
            colmo del tetto, e stasera alla Pignatta qualcuno racconterà che sei
            rimasto fermo in mezzo alla strada.
          effetti: { rep.scuri: 0.5, sospetto: 1 }
      - testo: "Portarli fino al posto di guardia"
        descrizione: "Cammini tranquillo verso la Caserma e guardi fin dove ti seguono."
        esito:
          titolo: L'ultimo tetto
          testo: |
            Riprendi a camminare verso il posto di guardia con il passo di uno che
            va a comprare il pane, e le sagome ti seguono per due strade.
            All'ultimo tetto prima della casa di pietra blu si fermano. Racconti
            al sergente di turno che cosa hai visto, e lui manda due uomini a
            guardare i tetti con le lanterne alzate sopra la testa.
          effetti: { rep.caserma: 0.5, rep.scuri: -0.5 }

  - id: carta-nebbia-dalla-grata
    immagine: ambientazione/marea-grigia
    titolo: Nebbia dalla grata
    sommario: "Da una grata di scarico sale una nebbia bassa e grigia che odora di ferro."
    tipo: carta
    area: citta-bassa
    testo: |
      Al margine dell'Orlo, da una grata di scarico sale una nebbia bassa e
      grigia che sa di ferro bagnato e non si alza oltre le caviglie. È troppo
      leggera per la Marea Grigia, eppure i cani la evitano e un mulo si
      pianta.

      {magia Media} Quel ferro nell'aria è Mana andato a male, quello che
      resta in fondo ai cristalli quando si svuotano.

      {origine figlio-del-circolo} Al Circolo ti hanno insegnato a dare
      ragione alle bestie quando si piantano, e il mulo l'ha imparato da solo.

      Fra le sbarre della grata qualcosa luccica, poco sotto il bordo.
    opzioni:
      - testo: "Inginocchiarti sulla grata"
        descrizione: "Quello che luccica è a un braccio di distanza, dentro la nebbia."
        esito:
          titolo: Fino alla spalla
          testo: |
            Ti inginocchi e infili il braccio fra le sbarre. La nebbia è più
            fredda di quanto dovrebbe e ti sale lungo la manica fino alla spalla,
            finché le dita trovano due schegge di cristallo opaco incastrate nella
            fanghiglia. Quando ti rialzi hai il braccio intorpidito, e per tutto
            il giorno il sapore di ferro non ti va via dalla bocca.
          effetti: { cristalli.frammento-esausto: 2, contaminazione: 1 }
      - testo: "Osservarla da lontano"
        descrizione: "Guardi da dove esce e dove va a finire, senza avvicinarti."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Da dove sale
          testo: |
            Resti a guardare dal bordo della strada. La nebbia esce a sbuffi regolari, uno ogni
            conta lenta fino a venti, e con gli sbuffi salgono piccole schegge di cristallo che si
            posano sul selciato. Quando si ritira ne raccogli due con la punta delle dita e le
            avvolgi nel fazzoletto.
          effetti: { cristalli.frammento-esausto: 2 }
        fallimento:
          titolo: Alle caviglie
          testo: |
            Guardi troppo a lungo e non ti accorgi che la nebbia si è allargata
            fino ai tuoi stivali. Quando fai un passo indietro hai le caviglie
            fredde e un sapore di ferro in bocca che ci mette ore ad andarsene.
          effetti: { contaminazione: 1 }
      - testo: "Chiedere alla donna sulla soglia"
        descrizione: "Guarda la grata come se la conoscesse."
        esito:
          titolo: Tredici anni fa
          testo: |
            La donna non abbassa il grembiule. Una nebbia così, dice, l'ha già
            vista poche settimane prima della Notte dei Sussurri, quando la Marea
            salì fino alle terrazze basse dei Quartieri Alti, e allora saliva
            dalle grate della sua via tutte le sere senza che nessuno ci facesse
            caso. Poi rientra in casa, e senti girare la chiave due volte.
          effetti: { informazioni.voce: 1 }

  - id: carta-gaia-ti-segue
    immagine: personaggi/gaia-acari
    titolo: Un cappuccio blu fra i banchi
    sommario: "Al mercato un cappuccio blu scuro si ferma quando ti fermi tu. Gaia Acari ti sta seguendo."
    tipo: carta
    area: citta-bassa
    requisiti: [gaia >= 1, pista.pelle < 6]
    testo: |
      Al mercato del mattino vedi un cappuccio blu tre banchi più indietro,
      che si ferma quando ti fermi tu e finge di scegliere una mela. Sotto il
      cappuccio ci sono un naso pieno di lentiggini e una bocca che mastica.
      È Gaia Acari, la ragazzina che corre fra i tavoli della Pignatta, e ti
      sta seguendo.

      {origine figlio-della-citta-bassa} Il trucco della mela lo facevi anche
      tu alla sua età, e ti facevi scoprire perché la mela la guardavi
      davvero.

      {furtivita Media} Si ferma sempre un attimo dopo di te, mentre chi
      segue con mestiere si ferma prima.
    opzioni:
      - testo: "Lasciarti seguire"
        descrizione: "Fai le tue commissioni come se niente fosse, e qualcuno riceverà un resoconto noioso."
        esito:
          titolo: Un resoconto noioso
          testo: |
            Compri il pane e discuti a lungo il prezzo di una cinghia, più a
            lungo del necessario, per il gusto di annoiare qualcuno. Il
            cappuccio blu ti segue per un'ora e poi sparisce fra i banchi.

            La sera, alla Pignatta, Mauro Scrocco ti versa da bere senza farti
            pagare e ti chiede se la cinghia nuova è buona.
          effetti: { rep.scuri: 0.5 }
      - testo: "Voltarti e chiamarla per nome"
        descrizione: "Vuole restare nascosta, e le mele al banco accanto costano poco."
        requisiti: [monete >= 1]
        esito:
          titolo: Una mela
          testo: |
            «Gaia» dici, abbastanza forte. Lei si avvicina con le mani in tasca e ti dice
            una parolaccia che fa voltare una venditrice di uova. Le compri una mela, e
            mentre la mangia ti racconta chi ha litigato con chi al mercato stamattina,
            sputando i semi in un tombino con una mira che ti fa invidia, poi se ne va
            senza salutare.
          effetti: { monete: -1, informazioni.voce: 1 }
      - testo: "Avvertirla della condanna di Mirko"
        descrizione: "Sai che Mirko Vesh ha capito per chi canta, e che l'ha condannata prima della prossima luna."
        requisiti: [pista.dama-argento >= 10]
        esito:
          titolo: Prima della prossima luna
          testo: |
            Raggiungi Gaia alla cesta delle mele e le dici piano che Mirko sa
            dello sceriffo e le fa portare notizie false, e che vuole toglierla di
            mezzo prima della prossima luna. Lei smette di masticare e sotto le
            lentiggini diventa bianca. Prima che tu possa dire altro si infila fra
            i banchi verso i Ponti, senza correre, perché al mercato chi corre si
            fa guardare.
          imposta: { gaia: 2 }
          effetti: { rep.caserma: 0.5 }
