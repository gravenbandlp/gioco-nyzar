# La pista della Dama d'Argento, seconda metà: dal Ponte del Pesce a Jass (pista 8 → 11),
# più le carte della Città Bassa legate alla pista.
storylet:
  # ------------------------------------------------------------ 8 → 9 · il Ponte del Pesce
  - id: ponte-del-pesce
    immagine: ambientazione/cattedrale-del-velo
    titolo: Il Ponte del Pesce
    sommario: "Dopo Via dei Rasoi scendi per Via del Salmone fino al vecchio ponte di pietra rossa, e a metà ti fermi senza averlo deciso."
    luogo: Ponte del Pesce, fra la Città Bassa e i Ponti
    area: citta-bassa
    requisiti: [pista.dama-argento == 8]
    testo: |
      Lasci Via dei Rasoi che è già sera. In Via del Salmone metà delle
      lanterne è spenta, con lo stoppino bruciato da mesi, e sotto una di
      quelle accese c'è un cartello scritto a mano per un gatto grigio
      smarrito, «risponde a Fagiolo». Le poche persone in giro ti guardano un
      momento e poi abbassano gli occhi.

      In fondo alla via comincia il Ponte del Pesce, un arco di pietra rossa
      consumato al centro dalle ruote dei carretti, che porta dalla Città Bassa
      ai Ponti Sospesi. Il parapetto è basso e conserva ancora un po' del
      calore del giorno. A metà ti fermi senza averlo deciso e ci appoggi i
      gomiti, e senti le gambe che tirano. Sotto,
      lontano, si sente scorrere dell'acqua.

      Davanti a te la strada sale verso i Ponti. Più in alto, oltre le corde
      dei Ponti, la Cattedrale del Velo accende le sue luci una dopo
      l'altra, dal campanile in giù, nello stesso ordine di ogni sera.

      Il cielo ha il colore che a Qir-Azel prende nelle sere in cui sta per
      cambiare il vento, e le stelle escono una alla volta. La prima, bassa
      sull'orizzonte a sud, è di un viola molto chiaro, color lavanda.
      *Qualcuno in Città Bassa ci avrà già costruito sopra una profezia.* La
      guardi finché il vento ti fa lacrimare.

      Da quando hai tirato la catena della Maison è la prima volta che hai il
      tempo di pensare.
    opzioni:
      - testo: "Pensare a Rennick Dole"
        descrizione: "Rennick si è messo sotto la tua parola, e per ora è ancora libero."
        requisiti: [rennick != 2]
        costo: 0
        esito:
          titolo: Sotto la tua parola
          testo: |
            Pensi a Rennick seduto sul bordo del letto, con le mani che
            tremavano e la bottiglia di liquore di radice sul comodino, con il
            tappo di sughero rosicchiato tutto intorno. Fino a
            pochi giorni fa era un nome sentito alla Pignatta, un tirchio che
            parlava la lingua degli orchi. Adesso è un uomo che beve per non
            pensare alla bambina della processione, e che si è affidato a te
            perché in città chi sa quello che sa lui dura poco.

            Ti chiedi quante notti la tua parola riuscirà a tenerlo in vita, e
            che cosa ti costerà mantenerla. Ci pensi finché la pietra rossa
            finisce sotto i tuoi piedi e comincia il legno delle passerelle.
          pe: { empatia: 5 }
          effetti: { pista.dama-argento: 1 }
      - testo: "Pensare a Rennick Dole"
        descrizione: "In Via dei Rasoi gli Scuri se lo sono portato via."
        requisiti: [rennick == 2]
        costo: 0
        esito:
          titolo: Nelle mani degli Scuri
          testo: |
            Pensi a Rennick in Via dei Rasoi, in mezzo agli uomini degli Scuri,
            e al modo in cui ti ha guardato l'ultima volta. Ti aveva chiesto
            soltanto di portarlo fuori città, e adesso è nelle mani di Mirko
            Vesh.

            Gli Scuri lo terranno in vita finché avrà qualcosa da dire, e
            Rennick ha parecchio da dire. Te lo ripeti a voce bassa e resti al
            parapetto finché la stella color lavanda si è alzata di un dito
            sopra i tetti, poi riprendi a camminare verso i Ponti.
          pe: { empatia: 5 }
          effetti: { pista.dama-argento: 1 }
      - testo: "Pensare alla razzia"
        descrizione: "Cinque tribù che non si erano mai mosse insieme, e una parola che la Città Bassa ripete sottovoce."
        costo: 0
        esito:
          titolo: Mawrak'Thur
          testo: |
            Ripensi alla piazza del Festival, alle fosse comuni benedette in
            fretta e agli orchi che, braccati sull'orlo, hanno preferito
            saltare nella Cicatrice. Le cinque tribù del circondario non si
            erano mai mosse insieme. Quella sera qualcuno le teneva in fila, e
            gli orchi la chiamavano Dama d'Argento.

            In Città Bassa la parola adesso la ripetono tutti, dalle lavandaie
            ai facchini, e all'imbocco del ponte un venditore di castagne l'ha
            scritta col gesso sul carretto, sbagliando l'apostrofo, per attirare
            gente. Nessuno fa domande. Tu l'hai sentita tradurre da
            Rennick, e te la ripeti mentre attraversi l'ultimo tratto del ponte.
          pe: { conoscenze-della-strada: 5 }
          effetti: { pista.dama-argento: 1 }
      - testo: "Pensare a te stesso"
        descrizione: "In Via dei Rasoi è morto un uomo, e tu c'eri."
        requisiti: [squiggor >= 2]
        costo: 0
        esito:
          titolo: Odore di metallo
          testo: |
            Pensi a Squiggor Ironfist steso sul selciato di Via dei Rasoi, con
            la benda nera storta sull'occhio che non aveva. Aveva le nocche
            grosse come noci, e fino all'ultimo non ha detto quasi niente.

            Sulle mani ti è rimasto un odore di metallo bagnato, lo stesso che
            c'era in strada quando Squiggor è caduto. Lo senti ancora quando
            stringi il parapetto, e lo stringi finché le mani smettono di
            tremare e lo stomaco torna al suo posto. Poi le guardi, le
            pulisci sui calzoni e riprendi a camminare.
          pe: { resilienza: 5 }
          effetti: { pista.dama-argento: 1 }
      - testo: "Pensare a te stesso"
        descrizione: "Pochi giorni fa hai sentito per la prima volta quella parola, nella coda alla fontana."
        requisiti: [squiggor == 0]
        costo: 0
        esito:
          titolo: La pietra fredda
          testo: |
            Ripensi a com'eri il giorno in cui hai sentito per la prima volta
            *Mawrak'Thur* nella coda alla fontana. Da allora sei entrato in una
            casa dove non si entra senza appuntamento, e in Via dei Rasoi hai
            guardato in faccia gli Scuri. A quest'ora il tuo nome è arrivato
            anche alla Pignatta.

            Appoggi il palmo sul parapetto. Il calore del giorno se n'è andato e
            la pietra è fredda, e sotto, lontano, l'acqua continua a scorrere. Ti
            accorgi che il respiro ti si è fatto più lento, e resti lì finché la
            Cattedrale non ha acceso l'ultima luce.
          effetti: { pista.dama-argento: 1, tormento: -0.5 }

  # ------------------------------------------------------------ 9 → 10 · prima strada: il morto
  - id: i-morti-parlano
    immagine: ambientazione/cimitero-di-qir-azel
    titolo: I morti parlano
    sommario: "Il corpo di Squiggor Ironfist aspetta al Cimitero che qualcuno lo reclami. Un monaco del Velo può farlo parlare, per poche domande."
    luogo: Cimitero di Qir-Azel, al tramonto
    area: citta-bassa
    requisiti: [pista.dama-argento == 9, squiggor >= 2]
    testo: |
      Il corpo di Squiggor Ironfist è arrivato al Cimitero di Qir-Azel su un
      carro della Caserma, avvolto in un telo da vela, e da due giorni aspetta
      in una cella di pietra che qualcuno lo reclami. Gli Scuri non si sono
      fatti vivi. Gundo Marl, il becchino, l'ha registrato con la sua
      scrittura minuta alla voce «ignoti, morte violenta», sottolineando due
      volte la seconda parola, e gli ha messo sulla palpebra che gli restava
      una moneta di rame, delle più piccole.

      Al tramonto arriva un monaco della Confraternita del Velo. Porta la
      tunica nera e una borsa di tela con dentro candele di sego e un libretto
      legato con lo spago. Ha le mani grandi e callose, e prima di prendere i
      voti deve aver lavorato la terra. Lo manda Ottilia Sanvel, dice. La Monaca Responsabile
      ha sentito che cosa si ripete in Città Bassa, e anche lei vuole sapere
      che cosa sapeva quest'uomo.

      «Quattro domande, cinque al massimo» dice il monaco. «Poi la porta si
      richiude da sola, e chi la tiene aperta paga per tutto il tempo che
      resta aperta. Io dico le parole e tu reggi la candela.»

      Gundo si allontana zoppicando senza voltarsi. Nella cella fa freddo, e
      l'odore del telo da vela bagnato ti si attacca in fondo alla gola.
      Il monaco ti guarda e
      aggiunge che la Confraternita queste cose non le fa per niente, e che
      il rito ha un prezzo che qualcuno deve coprire.
    opzioni:
      - testo: "Pagare il rito"
        descrizione: "Dodici monete per il Velo, e il monaco farà il minimo indispensabile."
        requisiti: [monete >= 12]
        esito:
          titolo: Dentro il cerchio
          testo: |
            Il monaco conta le monete due volte e le fa sparire nella borsa.
            Poi traccia sul pavimento un cerchio di sale attorno al tavolo di
            pietra e accende tre candele. La più grossa la mette in mano a te.

            Ti fa inginocchiare dentro il cerchio, accanto alla testa del
            morto, e la pietra ti morde le ginocchia attraverso i calzoni. Lui
            resta fuori dal sale, seduto con il libretto aperto
            sulle ginocchia. Comincia a leggere a voce bassa, e la fiamma della tua
            candela si piega verso il cadavere.
          effetti: { monete: -12, tormento: 1 }
          segue: i-morti-parlano-rito
      - testo: "Chiederlo come favore alla Confraternita"
        descrizione: "Al Velo hai fatto qualche favore. Adesso puoi chiederne uno indietro."
        requisiti: [rep.velo >= 2]
        esito:
          titolo: Fuori dal cerchio
          testo: |
            Il monaco ti guarda un momento più a lungo, poi annuisce. Ha
            sentito il tuo nome in Cattedrale, e da come lo ripete è stato
            detto con rispetto.

            Traccia un cerchio di sale attorno al tavolo di pietra e ci entra
            lui, con il libretto aperto. A te lascia la candela e un posto
            fuori, a un passo dal sale. «Se la fiamma si piega verso di lui,
            fai un passo indietro» dice. Poi comincia a leggere, e dopo poche
            righe la fiamma si piega verso il cadavere.
          effetti: { tormento: 0.5 }
          segue: i-morti-parlano-rito
      - testo: "Convincere il monaco che serve a tutti"
        descrizione: "Quello che sapeva Squiggor interessa anche a Ottilia Sanvel, e il monaco lo sa."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Per la città
          testo: |
            Gli parli della razzia e di Rennick Dole, e di quello che gli Scuri
            potrebbero sapere sulla Dama d'Argento. Il monaco ti ascolta con le
            mani incrociate sulla borsa, e alla fine dice che Ottilia gli ha
            chiesto di tornare con delle risposte, e che per averle gli serve
            qualcuno che regga la candela.

            Traccia il cerchio di sale e ti fa inginocchiare dentro, accanto al
            morto. Poi apre il libretto e comincia a leggere.
          effetti: { tormento: 1 }
          segue: i-morti-parlano-rito
        fallimento:
          titolo: Di malavoglia
          testo: |
            Il monaco ti ascolta senza cambiare espressione. Alla fine sospira,
            dice che Ottilia verrà a sapere quanto hai insistito, e apre il
            libretto di malavoglia.

            Traccia il cerchio di sale in fretta, storto da un lato, e ti mette
            dentro con la candela senza spiegarti niente. Tiene la bocca
            stretta, e ti viene il sospetto che stasera fosse atteso a cena. Legge più veloce di
            quanto dovrebbe, e la fiamma della tua candela si piega verso il
            cadavere prima ancora che abbia finito la prima riga.
          effetti: { tormento: 1, rep.velo: -0.5 }
          segue: i-morti-parlano-rito

  - id: i-morti-parlano-rito
    immagine: cronaca/sessione-16
    titolo: La porta aperta
    tipo: seguito
    luogo: Cimitero di Qir-Azel, nella cella di pietra
    area: citta-bassa
    requisiti: [pista.dama-argento == 9]
    testo: |
      Il cadavere non risponde subito. Prima la mascella si muove a vuoto e
      fuori tempo, poi un filo di liquido grigio cola dall'angolo della bocca.
      Poi arriva la voce, da sotto lo sterno, come se qualcuno parlasse
      dentro un otre di pelle, e ti accorgi di aver smesso di respirare con
      il naso.

      «Non nell'aldilà» dice, e ride in un modo raschiato e allegro. «In una
      cella, con le facce sbagliate. Tu con la candela, senti questa, ci
      conosciamo? Mi ricordi qualcuno.» L'orbita vuota è rivolta verso di te, e senti che ti guarda proprio da
      lì. *Da vivo diceva una parola ogni tanto, e adesso non smette più.* Il
      monaco gira pagina con due dita.

      Chiede dei mulini bruciati durante la razzia. «Bruciati
      perché Malgrani avesse il pane tutto per sé» risponde Squiggor, e la
      mascella schiocca sulla parola pane. «Domani, pretino, mangerai anche
      tu la sua farina e non farai niente. È questo il bello.»

      Chiede dei ponti e della Gilda. «Ponti marci. Custodi che guardano
      dall'altra parte per due monete, e nella Gilda gente comprata come pane
      vecchio. Dove? Che ne so. I loro fogli non li ho mai visti.» Il monaco
      insiste e la candela ti scotta le dita. «Il tizio dei ponti,
      quello di notte. Lui sa dove passano le cose.»

      Chiedi della Dama d'Argento, e il morto sbuffa grigio. «La cerchiamo
      anche noi, e non la trova nessuno.» Poi la testa si inclina di lato,
      come se avesse sentito un nome che gli piace. «Senti questa. E della
      piccola non chiedete? Della piccola Acari?»

      La porta pesa sempre di più, e te lo senti nelle spalle. Ti restano una o due domande.
    opzioni:
      - testo: "Lasciarlo parlare fino alla fine"
        descrizione: "Dirà volentieri tutto quello che fa male. Il resto non gli interessa."
        costo: 0
        esito:
          titolo: Quello che sapeva il morto
          testo: |
            Squiggor parla della piccola con la gola che gli bolle di piacere.
            «Occhi svegli, lingua troppo lunga. Canta per lo sceriffo, e Mirko
            lo sa e le dà da portare bugie. Prima della prossima luna è morta,
            e io me la perdo, che peccato.» Poi, quasi annoiato,
            aggiunge che secondo Mirko lo sceriffo corre per i villaggi con la
            scusa degli orchi per venire a prendere gli Scuri, e che nemmeno
            lui sa se sia vero.

            Quando chiedi di Rennick il morto ride di nuovo. «Senti questa. Il
            ragazzo ha cantato alla sua rossa della Maison, Jass, che è dei
            nostri. Lei l'ha detto a Mauro, e Mauro a Mirko.»

            Poi la mascella ricade e il liquido smette di colare. Mentre la
            porta si chiude senti anche tu il gusto che il morto provava nel
            dolore degli altri, dolciastro in fondo alla lingua, e ti costa
            fatica non lasciarlo entrare. Il monaco spegne le candele una per
            una, la tua per ultima.
          imposta: { indizio.custode-notturno: 1 }
          effetti: { informazioni.segreto: 1, pista.dama-argento: 1 }

  # ------------------------------------------------------------ 9 → 10 · seconda strada: il resoconto
  - id: resoconto-alla-pignatta
    immagine: personaggi/rozalia-marga
    titolo: Il resoconto alla Pignatta
    sommario: "Hai promesso a Rozalia Marga di raccontarle tutto all'ora del mercato. Lei tiene i conti, e ti ripaga con quello che sanno gli Scuri."
    luogo: Pignatta Grassa, all'ora del mercato
    area: citta-bassa
    requisiti: [pista.dama-argento == 9, resoconto.scuri >= 1]
    testo: |
      All'ora del mercato la Pignatta Grassa è quasi vuota. Due carovanieri
      fanno colazione con il sidro, e al tavolo delle carte Nihali Cuzan
      mescola un mazzo per nessuno. Mauro Scrocco allarga le braccia quando
      ti vede entrare e grida il tuo nome come se fossi un parente tornato
      dalla guerra. Poi indica con il mento la porta del retrobottega, senza
      abbracciarti.

      Il retrobottega è più ordinato della sala. Ci sono scaffali di legno
      chiaro pieni di cartelle, ognuna con un'etichetta scritta a mano che
      dice la famiglia e il mestiere di chi ha firmato. Su una il mestiere è
      cancellato con una riga, e sopra c'è scritto «defunto». Su un
      leggio è aperto un registro di firme. Rozalia Marga siede al banco con la piuma d'oca dietro l'orecchio e le dita macchiate
      d'inchiostro.

      «Puntuale» dice senza alzare gli occhi dal foglio, e batte due volte
      la penna sul calamaio. «La gente puntuale mi piace, perché si
      fa meno fatica a trovarla. Siediti, che il tempo lo segno anche a te.»

      Intinge la penna e aspetta. La sedia davanti al banco è già girata
      verso di lei, e sedendoti scopri che è più bassa di una spanna, così
      per guardarla alzi il mento.
    opzioni:
      - testo: "Raccontarle tutto"
        descrizione: "Le racconti la parola orchesca e quello che Rennick ti ha detto nella sua stanza alla Maison."
        esito:
          titolo: Tutto
          testo: |
            Le racconti della parola orchesca e di Rennick Dole, di come
            parlava la lingua dei Nove Chiodi e di che cosa gli hai sentito
            dire nella sua stanza al primo piano della Maison. Rozalia scrive
            in fretta, con una grafia piccola e diritta, e ti interrompe solo
            per farti ripetere i nomi.

            Quando hai finito soffia sul foglio per asciugare l'inchiostro e
            dice che Mirko sarà contento. «Adesso però ti pago io» aggiunge
            mentre batte due volte la penna sul calamaio, «perché i conti li
            chiudo sempre in pari, al quattrino, per la precisione.»
          segue: i-conti-di-rozalia
      - testo: "Raccontarle solo una parte"
        descrizione: "Le dai quanto basta per chiudere la promessa. Il resto lo tieni per te, se ci riesci davanti a una falsaria."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Quanto basta
          testo: |
            Le racconti della parola orchesca e della paura di Rennick, e
            lasci fuori i dettagli che ti sembrano valere di più. Rozalia
            scrive e ti fa ripetere due nomi, e tu tieni le mani ferme sulle
            ginocchia, perché ti sembra che guardi più quelle della tua faccia.

            Quando hai finito soffia sul foglio per asciugare l'inchiostro e
            dice che Mirko sarà contento. «Adesso però ti pago io» aggiunge
            mentre rimette la penna nel calamaio, «perché i conti li chiudo
            sempre in pari.» I dettagli che hai tenuto per te restano fuori dal
            suo registro.
          effetti: { informazioni.pettegolezzo: 1 }
          segue: i-conti-di-rozalia
        fallimento:
          titolo: Una firma storta
          testo: |
            A metà del racconto Rozalia smette di scrivere e posa la penna.
            «Hai saltato un pezzo» dice senza alzare la voce. «Si sente, tesoro.
            Prima di arrivarci hai ripreso fiato, e chi riprende fiato sta per
            scavalcare qualcosa.»

            Aspetta che tu racconti anche il resto, e lo scrive, mentre tu senti
            le orecchie diventare calde. Poi ti guarda più a lungo e ti dice che ti pagherà lo stesso, perché i conti li
            chiude in pari, ma che nel registro, accanto al tuo nome, adesso
            c'è un segno.
          effetti: { rep.scuri: -0.5, sospetto: 0.5 }
          segue: i-conti-di-rozalia

  - id: i-conti-di-rozalia
    immagine: ambientazione/pignatta-grassa
    titolo: I conti in pari
    tipo: seguito
    luogo: Pignatta Grassa, nel retrobottega
    area: citta-bassa
    requisiti: [pista.dama-argento == 9]
    testo: |
      Rozalia gira il registro verso di sé e intinge di nuovo la penna, come
      se dovesse dettare a sé stessa. Prima batte due volte la punta
      sull'orlo del calamaio, e ormai hai capito che lo fa ogni volta che
      apre un conto.

      «I mulini che sono bruciati durante la razzia» dice mentre scrive,
      «sono bruciati perché i Malgrani avessero in mano tutta la farina della
      città. Chi abbia portato la torcia lo lascio decidere a te, io scrivo
      solo quello che mi hanno pagato per sapere. Poi ci sono i ponti. I
      custodi si comprano con due monete, e nella Gilda c'è gente che costa
      poco di più, lo so perché le carte gliele faccio io, per la
      precisione. Il tizio
      dei ponti, quello del turno di notte, sa dove passano le merci che la
      Gilda non registra.»

      Quando le chiedi della Dama d'Argento scuote la testa e ti dice che gli
      Scuri la cercano a tentoni come tutti gli altri, e che per questo
      Rennick gli interessava tanto.

      Poi abbassa la voce e si china sul banco, e da sotto ti tocca alzare il
      mento ancora di più. «Ti do anche un consiglio, e nemmeno quello è
      gratis, lo segno a parte. La piccola Acari, quella col cappuccio blu che
      corre fra i tavoli, porta notizie allo sceriffo. Mirko lo sa da
      settimane e le dà da portare roba falsa, e prima della prossima luna
      non correrà più. Te lo dico perché tu veda come finisce chi porta
      notizie a due padroni» conclude, e si pulisce la punta della penna su
      uno straccio.
    opzioni:
      - testo: "Chiederle come hanno saputo di Rennick"
        descrizione: "In Via dei Rasoi sapevano dove cercarlo. Qualcuno gliel'aveva detto."
        costo: 0
        esito:
          titolo: La linea bruciata
          testo: |
            Rozalia sorride appena, come se le avessi chiesto il prezzo di una
            cosa che ha già venduto, e ti dice che l'hanno saputo da una rossa
            della Maison, Jass, che ascolta quello che gli uomini dicono dopo il
            secondo bicchiere. «Rennick le ha parlato all'alba, lei l'ha detto
            a Mauro e Mauro a Mirko» aggiunge alzando le spalle, «ma quella
            linea ormai è bruciata. Nerissa le sta addosso da settimane, e a me
            le cose bruciate non servono.»

            Poi, quasi distratta, racconta che Mirko è convinto che lo sceriffo
            usi la crisi degli orchi come scusa per venire a prendere gli Scuri.
            Chiude il registro e ti accompagna alla porta del retrobottega, e
            dal bancone Mauro ti saluta con un grido affettuoso, così forte che
            i due carovanieri si voltano a cercare il parente tornato.
          imposta: { indizio.custode-notturno: 1 }
          effetti: { resoconto.scuri: -1, rep.scuri: 0.5, informazioni.segreto: 1, pista.dama-argento: 1 }

  # ------------------------------------------------------------ 9 → 10 · terza strada: il prigioniero
  - id: il-tagliagole-catturato
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Il tagliagole in cella
    sommario: "Al posto di guardia della Caserma in Città Bassa c'è uno degli Scuri preso nei giorni della razzia. Le guardie si ricordano di te."
    luogo: Posto di guardia della Caserma, Città Bassa
    area: citta-bassa
    requisiti: [pista.dama-argento == 9, squiggor == 0, resoconto.scuri == 0]
    testo: |
      Il posto di guardia della Caserma in Città Bassa è una casa di pietra
      blu con le inferriate alle finestre, stretta fra una conceria e un
      forno, e dentro, a seconda del vento, si sente il pane oppure si
      sentono le pelli. Dopo la razzia ci hanno messo il doppio degli
      uomini, e il sergente di turno dorme su una branda dietro il bancone,
      col berretto sulla faccia.

      Nei giorni del Festival le guardie hanno preso tre Scuri che svuotavano
      un magazzino della Gilda mentre la piazza bruciava. Due li hanno
      mandati su alla Caserma. Il terzo è ancora qui, nella cella in fondo,
      perché su non c'era più posto. È un uomo magro con una cicatrice che
      gli taglia il sopracciglio, e da una settimana mangia pane e acqua e
      guarda la porta.

      Il sergente ti riconosce. Eri tra quelli che hanno tenuto la piazza
      mentre gli orchi caricavano, e le guardie del posto se lo ricordano.
      «Vuoi parlarci? Fai pure» dice, e ti apre la porta del
      corridoio. «A noi non ha detto niente. Ha più paura di Mirko Vesh che
      della forca.»

      Il tagliagole alza gli occhi quando entri. Ha visto che le guardie ti
      lasciano passare, e si tira indietro sulla paglia fino al muro. «Io non
      ho detto niente a nessuno, capito?» dice prima che tu apra bocca. Nella
      cella c'è odore di secchio, e cominci a respirare dalla bocca.
    opzioni:
      - testo: "Farlo parlare"
        descrizione: "Puoi spaventarlo, oppure fargli capire che là fuori Mirko ha già deciso che ha parlato."
        prova: { attributo: sociale, abilita: [intimidire, empatia], difficolta: Media }
        successo:
          titolo: Tanto vale
          testo: |
            Gli spieghi con calma quello che sa già. Mirko non manda nessuno a
            tirarlo fuori, e quando uscirà gli Scuri daranno per scontato che
            abbia parlato. Tanto vale che parli davvero, a qualcuno che può
            ricordarsi di lui.

            Il tagliagole si guarda le mani per un pezzo e si stacca con i
            denti una pellicina dal pollice. Sulla soglia il sergente si
            appoggia allo stipite e tira fuori un mozzicone di
            matita. Il prigioniero si passa la lingua sulle labbra spaccate e
            comincia.
          effetti: { rep.caserma: 1 }
          segue: il-tagliagole-parla
        fallimento:
          titolo: Mezza verità
          testo: |
            Il tagliagole parla poco e male, guardando la porta. Ti dice che
            il tizio dei ponti, quello di notte, sa dove passano le merci. Poi,
            per farti andare via, ti dice che alla Maison c'è una rossa, Jass,
            che passa a Mauro quello che i clienti dicono a letto, e che
            «quello di sopra», come chiama Mirko per non dirne il nome, sa che
            la piccola Acari fa la spia per lo sceriffo. «Prima della prossima
            luna, capito?» dice, e non aggiunge altro.

            Il sergente ha sentito la tua voce alzarsi. Mentre esci scrive il
            tuo nome sul registro, sotto quello del prigioniero.
          imposta: { indizio.custode-notturno: 1 }
          effetti: { informazioni.pettegolezzo: 1, sospetto: 0.5, pista.dama-argento: 1 }

  - id: il-tagliagole-parla
    immagine: fazioni/scuri
    titolo: Quello che sa un tagliagole
    tipo: seguito
    luogo: Posto di guardia della Caserma, nella cella in fondo
    area: citta-bassa
    requisiti: [pista.dama-argento == 9]
    testo: |
      «I mulini» dice il tagliagole. «Quelli che sono bruciati la sera del
      Festival, capito? Li hanno bruciati perché i Malgrani avessero in mano
      tutta la farina. Lo sapevano in dieci alla Pignatta, e adesso lo sai
      tu, e siamo in undici.»

      Tossisce e sputa nella paglia. «Sui ponti i custodi guardano
      dall'altra parte per due monete, e nella Gilda c'è gente comprata.
      Nomi non ne ho, e se li avessi li avrei già venduti. Però c'è il tizio
      dei ponti, quello di notte. Lui sa dove passano le cose, tutte, anche
      quelle che la Gilda non vede.»

      Della Dama d'Argento ti dice subito che non sa niente. Gli Scuri la
      cercano come tutti. «Quello di sopra vuole sapere chi è» dice, e alza
      gli occhi al soffitto come se Mirko Vesh abitasse al piano di sopra,
      «e chi gli porta una briciola viene pagato bene.»

      Poi abbassa la voce, anche se nel corridoio c'è solo il sergente.
      «La piccola Acari, quella col cappuccio blu, canta per lo sceriffo.
      Lui lo sa da prima della razzia, capito? Le dà da portare notizie
      false, e l'ha già condannata. Prima della prossima luna, ha detto.»

      *Quel nome se lo tiene in bocca da una settimana.* Si stringe le
      ginocchia al petto e aspetta, con gli occhi sulla porta del corridoio.
    opzioni:
      - testo: "Chiedergli della Maison e dello sceriffo"
        descrizione: "Alla Maison Rennick parlava con qualcuno, e gli Scuri lo sono venuti a sapere."
        costo: 0
        esito:
          titolo: La rossa della Maison
          testo: |
            «Alla Maison abbiamo una rossa, Jass» dice il tagliagole. «Passa a
            Mauro quello che i clienti le dicono a letto, e Mauro lo porta di
            sopra, capito? Se il ragazzo della Segheria ha parlato là dentro,
            lui lo ha saputo la sera stessa.» Mentre lo dice guarda di nuovo il
            soffitto.

            Sullo sceriffo sa solo quello che diceva Mirko prima della razzia.
            Secondo lui Galdrick usa gli orchi come scusa per preparare
            qualcosa contro gli Scuri. Il sergente, sulla soglia, fa finta di
            non aver sentito e si gratta la barba. Quando esci ti accompagna
            fino alla porta di pietra blu e ti stringe la mano.
          imposta: { indizio.custode-notturno: 1 }
          effetti: { informazioni.segreto: 1, pista.dama-argento: 1 }

  # ------------------------------------------------------------ 10 → 11 · Jass, il doppio filo
  - id: jass-doppio-filo
    immagine: personaggi/jass
    titolo: Il doppio filo
    sommario: "Jass ha passato agli Scuri le parole di Rennick. Alla Maison la guardano in molti, e Nerissa più di tutti."
    luogo: Maison des Lunes, Via dei Rasoi
    area: citta-bassa
    requisiti: [pista.dama-argento == 10]
    testo: |
      Sopra la porta della Maison des Lunes la lanterna è accesa. Sara Beck
      ti prende le armi e le chiude nell'armadio, e questa volta ti chiama
      per nome.

      Nel salone Jass gira fra le poltrone a seno nudo, con i capelli rossi
      sciolti sulle spalle e le lentiggini sul naso. Passa le dita fra i
      capelli di un cliente e ride a una sua battuta, e guardarla ti lascia
      in bocca un sapore storto, perché adesso sai che cosa fa di quello che
      sente. Le parole di Rennick le ha passate a Mauro
      Scrocco, e sopra Mauro c'è Mirko Vesh. Gli Scuri cercano qualunque cosa
      sulla Dama d'Argento, ma chi sia non lo sanno.

      Dalla scala Nerissa Dalvane segue Jass con gli occhi, e ti accorgi che
      lo fa da prima che tu entrassi. Vicino alla tenda Tachek tiene due dita
      appoggiate sulla cintura, che fra le ragazze vuol dire già allertato.
      Kanat occupa la porta del corridoio, e Churl quella d'ingresso.

      Jass ti vede e ti porta di sopra come un ospite qualsiasi. Quando le
      dici quello che sai non arrossisce e non nega, e si siede accavallando
      le gambe.

      «Il ragazzo della Segheria beve troppo e parla peggio» dice. «Se le
      orecchie funzionano non è colpa mia. Allora, sei qui per farmi del male
      o per farmi un'offerta?»
    opzioni:
      - testo: "Offrirle soldi e protezione, e tacere con Nerissa"
        descrizione: "Le prometti di tenerla viva se parla, e metti sul letto i soldi per dimostrarlo."
        requisiti: [monete >= 15]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Le tue orecchie
          testo: |
            Le posi sul letto quindici monete e le spieghi il resto. Se gli
            Scuri la credessero compromessa la ammazzerebbero, e tu puoi fare
            in modo che non lo credano mai. Jass conta le monete senza
            toccarle. Poi ti conferma che le parole di Rennick le ha passate a
            Mauro, e che Mauro le ha portate a Mirko.

            «D'accordo» dice. «Da stasera le mie orecchie lavorano anche per
            te. Ma se Nerissa lo viene a sapere da te, sono morta prima di
            domattina.»

            Scendi le scale da solo. Fuori, verso i Ponti, le lanterne dei
            custodi del turno di notte si accendono una dopo l'altra.
          imposta: { jass: 1 }
          effetti: { monete: -15, pista.dama-argento: 1, racconto: 1 }
        fallimento:
          titolo: Troppo poco
          testo: |
            Jass ascolta l'offerta fino in fondo, poi spinge indietro le monete
            con due dita. «Mi proteggeresti tu da Mirko?» dice, e ride piano. Poi
            ti accompagna alla porta con un bacio sulla guancia che sa di
            acqua di rose, e ti resta addosso per tutta la scala.

            All'alba Sara Beck ti manda a dire che Jass se n'è andata con una
            borsa, verso la Pignatta. Gli Scuri adesso sanno che qualcuno li
            sta cercando dentro la Maison. Dal Ponte del Pesce guardi le
            lanterne dei custodi di notte spegnersi una alla volta, mentre sui
            Quartieri Alti la Caserma apre le finestre.
          imposta: { jass: 3 }
          effetti: { rep.scuri: -0.5, sospetto: 0.5, pista.dama-argento: 1, racconto: 1 }
      - testo: "Portare la cosa a Nerissa"
        descrizione: "Nerissa la sospetta da settimane e le manca solo la prova. Tu ce l'hai."
        esito:
          immagine: personaggi/nerissa-dalvane
          titolo: La falla chiusa
          testo: |
            Lasci Jass nella stanza e scendi. Nerissa ti ascolta in piedi, con
            una mano sul corrimano, e non ti interrompe mai. «Lo sapevo da
            settimane» dice alla fine. «Mi mancava la prova.»

            Fa un segno a Churl. Jass esce dalla porta sul retro con una borsa
            e il mantello, e Churl la accompagna fino in fondo a Via del
            Salmone. Nerissa ti versa il tè buono, quello della scatola di latta
            che tiene chiusa a chiave, e dice che lo sceriffo verrà
            a saperlo stanotte. Da domani la Maison ti deve un
            favore, e anche lui.

            Gli Scuri se ne accorgeranno entro sera. Tornando verso i Ponti
            guardi le luci della Caserma, alte sui Quartieri Alti.
          imposta: { jass: 2 }
          effetti: { rep.maison: 1, rep.caserma: 1, rep.scuri: -1, pista.dama-argento: 1, racconto: 1 }
      - testo: "Metterle paura"
        descrizione: "Alzi la voce e le stringi il polso. Alla Maison qualcuno se ne accorgerà subito."
        prova: { attributo: fisico, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Auguri
          testo: |
            Le stringi il polso e lei non si scompone. «Uccidermi qui? Nella
            casa di Nerissa? Auguri.» Però ha visto la tua faccia, e prima che
            la porta si apra ti soffia i nomi di Mauro e di Mirko.

            Tachek entra con il pugno chiuso lungo la coscia, e tu esci prima
            che debba usarlo. All'alba Jass non c'è più. È scappata alla
            Pignatta, e gli Scuri adesso sanno che qualcuno li cerca. Tornando
            verso i Ponti guardi le lanterne dei custodi di notte, una per ogni
            campata.
          imposta: { jass: 3 }
          effetti: { sospetto: 0.5, rep.maison: -1, pista.dama-argento: 1, racconto: 1 }
        fallimento:
          titolo: Fuori
          testo: |
            Jass fa un gesto piccolo con la mano libera, e dopo due respiri
            Kanat è nella stanza. Ti solleva per la collottola e ti porta giù
            per le scale davanti a tutto il salone. Churl apre la porta e dice
            una parola sola.

            In strada ti raccogli da terra sotto la lanterna accesa e ti togli
            un sassolino dal palmo, con calma, visto che ormai hanno guardato
            tutti. All'alba
            Jass è già scappata alla Pignatta, e mezza Via dei Rasoi sa come sei
            uscito dalla Maison. Verso i Ponti, le lanterne dei custodi di notte
            si stanno spegnendo.
          imposta: { jass: 3 }
          effetti: { scandalo: 1, rep.maison: -1, pista.dama-argento: 1, racconto: 1 }

  # ------------------------------------------------------------ carte della pista
  - id: carta-lanterna-spenta
    immagine: ambientazione/maison-des-lunes
    titolo: La lanterna spenta
    sommario: "Sopra la porta della Maison des Lunes la lanterna è spenta, e sulla soglia Sara Beck lava il gradino."
    tipo: carta
    area: citta-bassa
    requisiti: [pista.dama-argento >= 6]
    testo: |
      Passando per Via dei Rasoi ti accorgi che la lanterna sopra la porta
      della Maison des Lunes stanotte è spenta. In Città Bassa tutti
      conoscono la regola, e una lanterna spenta vuol dire che dentro è
      successo un guaio. Anche le case vicine stasera tengono le imposte
      chiuse.

      Le tende sono chiuse come sempre. Al primo piano però una finestra è
      aperta, e dietro si muove la luce di una lampada. Sulla soglia Sara
      Beck strofina il gradino con uno straccio, e l'acqua del secchio è
      diventata rosa. All'angolo con Via del Salmone due vicini fingono di
      discutere del prezzo del sale, uno dei due con la camicia da notte che
      spunta sotto il mantello, e intanto guardano la porta.
    opzioni:
      - testo: "Offrire una mano a Sara Beck"
        descrizione: "Il secchio è pesante e la notte è lunga."
        esito:
          titolo: Il secchio
          testo: |
            Sara ti riconosce e ti passa il secchio senza dire niente. Lo
            svuoti nel tombino all'angolo due volte, e l'acqua tiepida ti
            schizza sugli stivali. Alla terza lei ti dice che un uomo è salito
            al primo piano senza appuntamento e ha
            alzato le mani su una delle ragazze. Kanat l'ha accompagnato fuori,
            e l'uomo è riuscito a camminare da solo fino al cristallo.

            Quando rientra ti ringrazia per nome.
          effetti: { rep.maison: 0.5 }
      - testo: "Chiedere ai vicini che cosa è successo"
        descrizione: "In Via dei Rasoi le finestre hanno occhi, e i vicini hanno voglia di parlare."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Facile }
        successo:
          titolo: Un uomo di Mauro
          testo: |
            I due vicini aspettavano soltanto che qualcuno glielo chiedesse.
            L'uomo che Kanat ha buttato fuori beveva alla Pignatta, e lo hanno
            visto più volte al bancone con Mauro Scrocco. Chiedeva di una
            ragazza con i capelli rossi, e quando gliel'hanno negata è salito
            lo stesso.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Il prezzo del sale
          testo: |
            I due vicini smettono di parlare quando ti avvicini, poi riprendono
            a discutere del prezzo del sale. Uno dei due, andandosene,
            si ferma a guardarti la faccia con attenzione.
          effetti: { sospetto: 0.5 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: "Prosegui verso Via del Salmone. Dietro di te Sara Beck continua a strofinare il gradino."

  - id: carta-balestrieri-sui-tetti
    immagine: fazioni/scuri
    titolo: Balestre sui tetti
    sommario: "In Via dei Rasoi due sagome con la balestra camminano sui tetti alla tua stessa velocità."
    tipo: carta
    area: citta-bassa
    requisiti: [pista.dama-argento >= 8]
    testo: |
      Al tramonto in Via dei Rasoi passa poca gente. Hai appena superato la
      Maison quando sopra di te una tegola scivola e si rompe in strada.

      Alzi gli occhi, e le spalle ti salgono verso le orecchie prima che tu
      abbia deciso qualcosa. Sui tetti delle case basse, ai due lati della via, ci
      sono due sagome con la balestra, riparate dietro i camini. Sono nella
      stessa posizione che avevano la sera di Rozalia Marga, con il campo di
      tiro su tutta la strada. Le balestre restano abbassate, ma quando
      cammini le sagome si spostano da un tetto all'altro, e quando ti fermi
      aspettano.

      Una finestra al piano terra si chiude piano. Davanti a te la via fa il
      gomito, e dopo il gomito ci sono tre vicoli e la strada verso il posto
      di guardia della Caserma.
    opzioni:
      - testo: "Seminarli fra i vicoli"
        descrizione: "Fra i vicoli i tetti si interrompono, e chi cammina lassù deve scendere."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Dall'altra parte
          testo: |
            Infili il secondo vicolo e attraversi un cortile, e sbuchi dietro
            le case da cui sono saliti. Aspetti nell'ombra di un portone, e
            dopo un po' uno dei due scende da una grondaia con la balestra a
            tracolla. È un ragazzo che avrà sedici anni, con i calzoni
            rattoppati sulle ginocchia con una stoffa a fiori da tenda, e
            adesso conosci la sua faccia e la porta da cui è entrato.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Un avvertimento
          testo: |
            Nel terzo vicolo un dardo si pianta nella trave accanto alla tua
            testa e resta a vibrare. È un avvertimento, e tu corri fino alla
            piazza del mercato, dove una ronda della Caserma ti vede
            arrivare trafelato e si segna la tua faccia.
          effetti: { sospetto: 0.5 }
      - testo: "Fermarti sotto il tetto e salutarli"
        descrizione: "Vogliono sapere se hai paura. Puoi dirglielo tu."
        esito:
          titolo: Il saluto
          testo: |
            Ti fermi in mezzo alla strada e alzi la mano verso il camino più
            vicino. Le due sagome si guardano. Dopo un momento una delle due
            alza la balestra verso il cielo, come si alza un bicchiere. Poi
            spariscono dietro il colmo del tetto.

            Stasera alla Pignatta, e dietro le persiane di questa via, qualcuno
            racconterà che sei rimasto fermo in mezzo alla strada.
          effetti: { rep.scuri: 0.5, sospetto: 0.5 }
      - testo: "Portarli fino al posto di guardia"
        descrizione: "Cammini tranquillo verso la Caserma e guardi fin dove ti seguono."
        esito:
          titolo: L'ultimo tetto
          testo: |
            Riprendi a camminare, senza fretta, verso il posto di guardia.
            Le sagome ti seguono per due strade. All'ultimo tetto prima della
            casa di pietra blu si fermano, e quando ti volti non ci sono più.

            Racconti al sergente di turno che cosa hai visto e dove. Lui annota
            tutto e manda due uomini a guardare i tetti, con le lanterne alzate
            sopra la testa.
          effetti: { rep.caserma: 0.5, rep.scuri: -0.5 }

  - id: carta-nebbia-dalla-grata
    immagine: ambientazione/marea-grigia
    titolo: Nebbia dalla grata
    sommario: "Da una grata di scarico sale una nebbia bassa e grigia che odora di ferro."
    tipo: carta
    area: citta-bassa
    testo: |
      Stai attraversando il margine dell'Orlo, dove i lastroni di pietra blu
      sono scheggiati, quando vedi la nebbia. Sale bassa e grigia da una grata
      di scarico in mezzo alla strada e si allarga sul selciato senza alzarsi
      oltre le caviglie. Ha un odore di ferro bagnato, come una lama
      lasciata sotto la pioggia.

      È troppo leggera e quasi pulita per essere la Marea Grigia che ingoia
      le strade. I cani però la evitano, e un carrettiere tira le redini per
      girarci intorno, borbottando contro il mulo che si è piantato a metà
      strada. Sulla soglia di una casa una donna
      anziana si copre la bocca con il grembiule e non stacca gli occhi dalla
      grata.

      Fra le sbarre della grata qualcosa luccica, poco sotto il bordo.
    opzioni:
      - testo: "Inginocchiarti sulla grata"
        descrizione: "Quello che luccica è a un braccio di distanza, dentro la nebbia."
        esito:
          titolo: Fino alla spalla
          testo: |
            Ti inginocchi e infili il braccio fra le sbarre. La nebbia è
            fredda, più fredda di quanto dovrebbe, e ti sale lungo la manica
            fino alla spalla. Le dita trovano due schegge di cristallo opaco,
            esauste, incastrate nella fanghiglia.

            Quando ti rialzi hai il braccio intorpidito, e per tutto il giorno
            il sapore di ferro non ti va via dalla bocca.
          effetti: { cristalli.frammento-esausto: 2, contaminazione: 0.5 }
      - testo: "Osservarla da lontano"
        descrizione: "Guardi da dove esce e dove va a finire, senza avvicinarti."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Da dove sale
          testo: |
            Resti a guardare dal bordo della strada. La nebbia esce a sbuffi
            regolari, ogni venti respiri circa, e insieme agli sbuffi salgono
            piccole schegge di cristallo che si posano sul selciato. Quando la
            nebbia si ritira ne raccogli due senza avvicinarti alla grata.
          effetti: { cristalli.frammento-esausto: 2 }
        fallimento:
          titolo: Alle caviglie
          testo: |
            Guardi troppo a lungo e non ti accorgi che la nebbia si è allargata
            fino ai tuoi stivali. Quando fai un passo indietro hai le caviglie
            fredde e un sapore di ferro in bocca che ci mette ore ad andarsene.
          effetti: { contaminazione: 0.5 }
      - testo: "Chiedere alla donna sulla soglia"
        descrizione: "Guarda la grata come se la conoscesse."
        esito:
          titolo: Tredici anni fa
          testo: |
            La donna non abbassa il grembiule, e la sua voce ti arriva da dietro
            la stoffa, impastata. Dice che una nebbia così l'ha già
            vista una volta, poche settimane prima della Notte dei Sussurri,
            quando la Marea salì fino alla Cattedrale. Allora saliva dalle
            grate della sua via tutte le sere, e nessuno ci faceva caso.

            Poi rientra in casa e chiude la porta a chiave.
          effetti: { informazioni.voce: 1 }

  - id: carta-gaia-ti-segue
    immagine: personaggi/gaia-acari
    titolo: Un cappuccio blu fra i banchi
    sommario: "Al mercato un cappuccio blu scuro si ferma quando ti fermi tu. Gaia Acari ti sta seguendo."
    tipo: carta
    area: citta-bassa
    requisiti: [gaia >= 1]
    testo: |
      Il mercato del mattino è pieno come sempre, fra carretti di rape e
      gabbie di galline. Ti fermi davanti a un banco di coltelli e, nel
      riflesso di una lama, vedi un cappuccio blu scuro tre banchi più
      indietro.

      Quando riprendi a camminare il cappuccio ti viene dietro, e quando ti
      fermi alla fontana si ferma davanti a una cesta di mele e finge di
      sceglierne una. Sotto il cappuccio ci sono un naso pieno di
      lentiggini e una bocca che mastica qualcosa. È Gaia Acari, la ragazzina
      che corre fra i tavoli della Pignatta, e ti sta seguendo per conto di
      qualcuno.
    opzioni:
      - testo: "Lasciarti seguire"
        descrizione: "Fai le tue commissioni come se niente fosse. Qualcuno riceverà un resoconto noioso."
        esito:
          titolo: Un resoconto noioso
          testo: |
            Compri il pane e discuti a lungo il prezzo di una cinghia. Il
            cappuccio blu ti segue per un'ora e poi sparisce fra i banchi.

            La sera, alla Pignatta, Mauro Scrocco ti versa da bere senza farti
            pagare e ti chiede se la cinghia nuova è buona.
          effetti: { rep.scuri: 0.5 }
      - testo: "Voltarti e chiamarla per nome"
        descrizione: "Si vede che ci tiene a non essere scoperta. Però sta masticando, e al banco accanto le mele costano una moneta."
        esito:
          titolo: Una mela
          testo: |
            «Gaia» dici, abbastanza forte. Lei si irrigidisce, poi si avvicina
            con le mani in tasca e ti dice una parolaccia che fa voltare una
            venditrice di uova. Le compri una mela, e lei la prende senza
            ringraziare.

            Mentre la mangia ti racconta chi ha litigato con chi al mercato
            stamattina, e perché, sputando i semi in un tombino con una mira
            che ti fa invidia. Poi se ne va senza salutare.
          effetti: { monete: -1, informazioni.voce: 1 }
      - testo: "Avvertirla della condanna di Mirko"
        descrizione: "Sai che Mirko Vesh ha capito per chi canta, e che l'ha condannata prima della prossima luna."
        requisiti: [pista.dama-argento >= 10]
        esito:
          titolo: Prima della prossima luna
          testo: |
            La raggiungi alla cesta delle mele e le parli piano, senza
            guardarla. Le dici che Mirko sa dello sceriffo e le fa portare
            notizie false apposta, e che vuole toglierla di mezzo prima della
            prossima luna.

            Gaia smette di masticare e sotto le lentiggini diventa bianca. Ti
            dice che non sai di cosa parli, poi ti chiede come fai a saperlo.
            Prima che tu risponda lascia la mela nella cesta e si infila fra i
            banchi, verso i Ponti, senza correre.
          imposta: { gaia: 2 }
          effetti: { rep.caserma: 0.5 }
