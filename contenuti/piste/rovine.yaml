# Le rovine dei Raschiatori (blocco 8): tre spedizioni ripetibili per chi è nei turni di scavo
# (raschiatore >= 1, pista.acciaio >= 8). Si parte dalla bacheca del Grifone di Ferro. Le stanze vanno in
# ordine secondo la profondità, e una stanza superata non ricompare nella stessa visita
# (src/motore/spedizioni.ts). Rientrando si rifà tutto da capo, come in un nuovo turno di scavo.
# - `vhar-ul` (soglia 3): 0 l'ingresso di sorveglianza, 1 il corridoio di manutenzione, 2 la sala del nodo
#   (con il seguito `il-riflesso-distorto`), il pozzo degli anelli o il campo del terzo livello. Due storie
#   non ripetibili: `il-raschiatore-dietro-la-paratia` (rovine.dorr 1) dopo il corridoio, e
#   `la-fonte-di-energia` dopo la sala del nodo (vhar-ul.nodo). Il cuore è `la-sezione-sigillata`
#   (rovine.vhar-ul 1).
# - `laboratorio-di-calibrazione` (soglia 3): 0 la scansione chimica o la taratura termica, 1 il magazzino
#   (una volta sola il modulo di isolamento) o il reticolo, 2 la camera acustica o l'analisi cinetica. Il
#   cuore è `il-nodo-principale` (rovine.calibrazione 1).
# - `mahr-kel` (soglia 4): 0 la quarantena, 1 il drenaggio, 2 la raccolta biologica o i depositi (una volta
#   sola la matrice di levigazione), 3 la ricostruzione o il corridoio delle ombre. La storia non ripetibile
#   `l-archivio-di-memoria` (rovine.archivio 1) da 2 in poi, e il cuore `la-vasca-di-clonazione`
#   (rovine.mahr-kel 1).
# - Al Grifone, `la-piastrina-di-dorr` (rovine.dorr 1 → 2).
# Scelte di canone: le spedizioni di quarant'anni fa le pagava la Gilda dei Mercanti (la "cartografia del
# sottosuolo", a metro di mappa) e le facevano i Raschiatori; il Consiglio degli Scavatori riapre i siti
# sigillati perché il primo strato del Labirinto è raschiato fino all'osso. Il Raschiatore mummificato è
# Arelan Dorr, tornato da solo a cercare i suoi tre uomini; il Residuo porta la tuta di uno di loro (Benno).
quality:
  - { id: vhar-ul.nodo, nome: Hai passato la sala del nodo, categoria: stato, nascosta: true, descrizione: "1 se in questa visita a Vhar'Ul hai superato la sala del nodo, e allora la sfera piccola del reattore si può prendere. Torna a 0 a ogni partenza dal Grifone." }

aree:
  - id: vhar-ul
    immagine: ambientazione/superficie-fratturata
    nome: Vhar'Ul
    sommario: "Un portale annerito in una conca di basalto, a sud oltre gli ultimi ponti, sigillato dalla Gilda quarant'anni fa."
    spedizione: { ritorno: superficie-fratturata, soglia: 3, stanze: 3 }
    testo: |
      L'ingresso di Vhar'Ul è incassato nella parete di una conca di basalto,
      un portale di metallo annerito sotto un'iscrizione dei Precursori di cui
      il vento ha lasciato soltanto le prime sillabe. In fondo alla conca il
      vento cala di colpo e l'aria ti pizzica i polsi come prima di un
      temporale. Davanti al portale c'è il cancello dei Raschiatori con il
      sigillo nero della Gilda, e accanto una baracca di lamiera con un pezzo
      di stoffa avvolto sul cardine della porta.

  - id: laboratorio-di-calibrazione
    immagine: ambientazione/rovine-dei-precursori
    nome: Laboratorio di Calibrazione
    sommario: "Dentro una collina di roccia vetrosa, le macchine dei Precursori misurano chi passa e correggono gli errori."
    spedizione: { ritorno: superficie-fratturata, soglia: 3, stanze: 3 }
    testo: |
      Il Laboratorio di Calibrazione sta dentro una collina di roccia
      vetrosa, e dall'ingresso parte un corridoio di metallo liscio senza un
      granello di polvere. Una linea luminosa corre sulle pareti, si accende
      davanti a te e si spegne alle tue spalle. Qui i Precursori taravano
      sensori e droni, e le macchine, rimaste accese senza nessuno che dica
      loro cosa misurare, adesso misurano chi passa. Ti accorgi che stai
      camminando più dritto del solito.

  - id: mahr-kel
    immagine: ambientazione/regno-profondo
    nome: Sito Mahr-Kel
    sommario: "Un impianto sepolto dei Precursori che rifaceva i viventi, dichiarato instabile dalla Gilda trentacinque anni fa."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Le paratie d'ingresso di Mahr-Kel sono tre, una dietro l'altra, con il
      nome inciso nei caratteri dei Precursori, e dalle griglie del pavimento
      sale un vapore tiepido che odora di latte andato a male. La terza
      paratia è socchiusa di un palmo. Trentacinque anni fa si è chiusa sul
      braccio di un Raschiatore, e sul bordo è rimasto un lembo di manica di
      cuoio con intorno un nastro rosso, come quelli delle lanterne del Ponte
      dei Morti. Più in là, nel buio, qualcosa pompa con un ritmo lento.

storylet:
  # ================================================================ gli ingressi, al Grifone di Ferro
  - id: turno-a-vhar-ul
    presso: grifone-di-ferro
    immagine: personaggi/dragna-gro-malog
    titolo: Un turno a Vhar'Ul
    sommario: "Il Consiglio degli Scavatori ha riaperto un sito sigillato da quarant'anni, e Dragna cerca chi ci scenda."
    luogo: Locanda del Grifone di Ferro, il tavolo di Dragna
    area: ponti-sospesi
    ripetibile: true
    requisiti: [raschiatore >= 1, pista.acciaio >= 8]
    testo: |
      Sulla bacheca del Grifone è comparso un foglio di Dragna con *Vhar'Ul* in cima,
      perché il Consiglio degli Scavatori ha deciso di riaprire i siti chiusi dalla
      Gilda. Dragna batte due volte i monconi della mano sinistra sul tavolo, che fra i
      Raschiatori vuol dire *vieni qui*.

      «Mezza giornata oltre gli ultimi ponti, verso sud. Quarant'anni fa ci è scesa una
      squadra della Gilda, e ne sono tornati meno di quanti erano partiti. Se senti
      battere dentro i muri, non rispondere.»

      {origine apprendista-raschiatore} Quel *vieni qui* te l'ha battuto anche la prima
      sera, sui turni della Cicatrice.
    opzioni:
      - testo: "Chiedere della spedizione di quarant'anni fa"
        descrizione: "Dragna ha letto il rapporto di allora, e a quanto pare se lo ricorda a memoria."
        costo: 0
        esito:
          titolo: Senza urla né sangue
          testo: |
            Dragna apre il quaderno della cartografia del sottosuolo. Quarant'anni
            fa la squadra arrivò al terzo livello e trovò strutture che pulsavano
            ancora, poi il supervisore, Arelan Dorr, fece richiudere il cancello e
            scrisse due righe sole. *Qualcosa si muove dentro le pareti. Persi tre
            uomini senza urla né sangue*. «Da allora è sigillata» dice Dragna.
      - testo: "Partire per Vhar'Ul"
        descrizione: "Mezza giornata a piedi oltre gli ultimi ponti, per una strada che non hai mai fatto."
        requisiti: [rovine.vhar-ul == 0]
        esito:
          titolo: Oltre gli ultimi ponti
          testo: |
            Oltre gli ultimi ponti di corda cammini su terrazze di basalto nero,
            con un vento basso che sa di ferro. Dalla roccia spuntano anelli di
            metallo mezzi sepolti, grandi come la ruota di un mulino, e su uno
            qualcuno ha appeso una vecchia scarpa. A metà giornata il terreno si
            apre in una conca.
          imposta: { vhar-ul.nodo: 0 }
          vai: vhar-ul
      - testo: "Tornare a Vhar'Ul"
        descrizione: "La strada la conosci, fino alla conca dove il vento si ferma."
        requisiti: [rovine.vhar-ul >= 1]
        esito:
          titolo: La conca
          testo: |
            Ripercorri le terrazze di basalto e riconosci gli anelli di metallo
            uno per uno, e sul più grande c'è ancora il sasso in equilibrio che
            hai lasciato l'altra volta. A metà giornata scendi nella conca, e il
            vento si ferma sul bordo alle tue spalle.
          imposta: { vhar-ul.nodo: 0 }
          vai: vhar-ul
      - testo: "Andare a cavallo"
        descrizione: "Girando largo per la strada dei carri, a cavallo la conca arriva prima di mezzogiorno."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: La strada dei carri
          testo: |
            Giri intorno ai ponti per la strada dei carri e tagli per le terrazze
            di basalto, ma sul bordo della conca il cavallo si pianta con le
            orecchie piatte e rifiuta di scendere. Lo lasci legato a un anello di
            metallo mezzo sepolto e scendi a piedi.
          imposta: { vhar-ul.nodo: 0 }
          vai: vhar-ul

  - id: turno-al-laboratorio
    presso: grifone-di-ferro
    immagine: personaggi/tenebra
    titolo: Un turno al Laboratorio
    sommario: "Stasera al tavolo dei turni c'è Tenebra, con il nome di una rovina dove le macchine prendono le misure."
    luogo: Locanda del Grifone di Ferro, il tavolo vicino alla finestra
    area: ponti-sospesi
    ripetibile: true
    requisiti: [raschiatore >= 1, pista.acciaio >= 8]
    testo: |
      Stasera Dragna è in Caserma con le reclute, e al tavolo dei turni siede
      Tenebra, con il boccale che non tocca e la bruciatura lucida sulla
      guancia.

      {origine fuggiasco-di-ghoran} Quella sedia, con la schiena al muro e la
      porta in vista, l'avresti scelta anche tu.

      Spiega con due dita un foglio intestato *Laboratorio di Calibrazione*.
      «Due giorni a sud-est, dentro la collina di vetro. Le macchine sono ancora
      accese e prendono le misure a chi entra. Se ti trovano storto ti
      raddrizzano, e conviene lasciarli fare.» Al tavolo accanto due Raschiatori
      giovani si confrontano le unghie limate fino alla carne.
    opzioni:
      - testo: "Chiedere a Tenebra che cosa ci si trova"
        descrizione: "Tenebra risponde a una domanda per volta, e fra una risposta e l'altra beve."
        costo: 0
        esito:
          titolo: La misura giusta
          testo: |
            «Microbatterie, e pezzi di droni da vendere a peso al Nodo
            d'Ossidiana» dice Tenebra. Poi racconta di un Raschiatore uscito dal
            Laboratorio con la gamba destra più corta di due dita, perché la
            sinistra se l'era rotta da bambino e la macchina aveva preso per
            giusta quella. «Zoppica ancora, ma dall'altra parte.»
      - testo: "Partire per il Laboratorio"
        descrizione: "Due giorni di cammino verso sud-est, per la Superficie Fratturata."
        requisiti: [rovine.calibrazione == 0]
        esito:
          titolo: La collina di vetro
          testo: |
            Cammini due giorni verso sud-est per la Superficie Fratturata, fra
            crepe da saltare e pianori di ghiaia. Al tramonto del secondo giorno
            la collina compare dietro un costone, liscia come il fondo di una
            bottiglia, e davanti alla crepa dell'ingresso ci sono le ceneri di un
            fuoco spento e i tizzoni allineati in fila.
          vai: laboratorio-di-calibrazione
      - testo: "Tornare al Laboratorio"
        descrizione: "La collina di vetro si vede da lontano. Il difficile è entrarci."
        requisiti: [rovine.calibrazione >= 1]
        esito:
          titolo: Il fuoco allineato
          testo: |
            Arrivi alla collina di vetro con il sole basso. Qualcuno ha allineato
            i tizzoni del tuo fuoco dell'altra volta dal più lungo al più corto, a
            un dito esatto l'uno dall'altro, e sulla ghiaia non ci sono altre
            impronte oltre alle tue.
          vai: laboratorio-di-calibrazione
      - testo: "Andare a cavallo"
        descrizione: "Sui pianori di ghiaia un cavallo corre, e la collina arriva in un giorno solo."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: I pianori
          testo: |
            Il cavallo attraversa i pianori di ghiaia al trotto, saltando le crepe
            più strette senza che tu glielo chieda, e la collina di vetro compare
            prima che faccia buio. Lo leghi lontano dall'ingresso, dove la roccia
            torna normale, con la borraccia mezza piena in una buca. Quando ti volti
            sta fissando la collina con le narici aperte.
          vai: laboratorio-di-calibrazione

  - id: turno-a-mahr-kel
    presso: grifone-di-ferro
    immagine: personaggi/dragna-gro-malog
    titolo: Un turno a Mahr-Kel
    sommario: "Il foglio di Mahr-Kel sulla bacheca ha il bordo di ceralacca rossa. Dragna non lo dà a chiunque."
    luogo: Locanda del Grifone di Ferro, il tavolo di Dragna
    area: ponti-sospesi
    ripetibile: true
    requisiti: [raschiatore >= 1, pista.acciaio >= 8]
    testo: |
      Dragna stacca dalla bacheca il foglio di Mahr-Kel, con il bordo di
      ceralacca rossa e sotto la classificazione della Gilda, *Instabile, non
      rischiare ulteriori perdite*. «Un giorno e mezzo a sud-ovest, nelle
      terre basse» dice. «Trentacinque anni fa la prima squadra è tornata
      indietro alla terza porta. Là dentro le macchine prendevano una bestia
      viva e ne tiravano fuori un'altra quasi uguale. Se vedi una cosa che ti
      somiglia, non fermarti a guardarla.»

      {origine figlio-del-circolo} Alla parola *bestia* ti torna in mente la
      volpe toccata dalla Marea che da bambino hai visto abbattere nel Bosco
      di Velthar.
    opzioni:
      - testo: "Chiedere del Raschiatore della terza porta"
        descrizione: "Quello del nastro rosso. Dragna lo nomina come si nomina un parente."
        costo: 0
        esito:
          titolo: Il vetro della lanterna
          testo: |
            «La porta gli ha preso il braccio fino alla spalla» dice Dragna,
            guardando il boccale. «I suoi l'hanno liberato con la sega da ossa, ma
            è morto prima di rivedere il cielo. Il vecchio Ferro andava a ogni
            cambio di stagione a pulirgli la lanterna sul Ponte dei Morti, e
            adesso ci vado io.»
      - testo: "Partire per Mahr-Kel"
        descrizione: "Un giorno e mezzo verso sud-ovest, nelle terre basse, la prima volta."
        requisiti: [rovine.mahr-kel == 0]
        esito:
          titolo: Le terre basse
          testo: |
            La strada scende per un giorno e mezzo verso le terre basse, dove l'aria
            si fa calda e ferma e la terra resta tiepida anche al buio. Verso
            mezzogiorno trovi l'ingresso, una spaccatura da cui esce un filo di
            vapore, con intorno i paletti della prima squadra e un cartello di latta
            dove si legge soltanto *non*.
          vai: mahr-kel
      - testo: "Tornare a Mahr-Kel"
        descrizione: "La spaccatura col filo di vapore, e i paletti della prima squadra."
        requisiti: [rovine.mahr-kel >= 1]
        esito:
          titolo: Il filo di vapore
          testo: |
            Riconosci la spaccatura da lontano, per il filo di vapore che sale
            dritto nell'aria ferma. Sul cartello di latta fra i paletti è rimasto
            soltanto il *non*, e dalla spaccatura sale lo stesso odore di latte
            andato a male. Ti stringi il fazzoletto sul naso e scendi.
          vai: mahr-kel
      - testo: "Andare a cavallo"
        descrizione: "A cavallo le terre basse sono un giorno solo, e si dorme meno all'aperto."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: La terra tiepida
          testo: |
            A cavallo arrivi alla spaccatura prima del buio. Il cavallo sente il
            vapore da cento passi e si pianta con il bianco degli occhi in vista,
            e gli parli piano finché smette di tremare. Lo lasci legato a un
            paletto della prima squadra con la coperta sulla schiena, e lui ti
            guarda scendere tirando la corda.
          vai: mahr-kel

  # ================================================================ Vhar'Ul, le stanze
  - id: vhar-ul-ingresso
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'ingresso di sorveglianza
    sommario: "Un portello di metallo mezzo interrato e la baracca di sorveglianza della Gilda, rimasta com'era quarant'anni fa."
    luogo: Vhar'Ul, l'ingresso di sorveglianza
    area: vhar-ul
    ripetibile: true
    requisiti: [profondita.vhar-ul == 0]
    testo: |
      Oltre il cancello c'è un portello piatto mezzo interrato, con una
      maniglia grande quanto un remo, e dal bordo esce un'aria tiepida che fa
      vibrare il metallo sotto il palmo. Accanto, la baracca di sorveglianza
      della Gilda è rimasta com'era quarant'anni fa, con le carte di
      logistica gonfie d'umidità sul tavolo e la targa di latta sopra la
      porta, *Zona chiusa per rischio residui energetici*.

      {origine mercante-dei-ponti} Le carte hanno il timbro della Gilda, lo
      stesso della tua licenza, e la colonna delle spese è tenuta con più
      cura di quella dei nomi.
    opzioni:
      - testo: "Sollevare il portello"
        descrizione: "La maniglia è fatta per due uomini, e il portello è fermo da quarant'anni."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il sibilo
          testo: |
            Pianti i piedi ai lati della maniglia e tiri con la schiena. Il
            portello cede tutto insieme, con un sibilo d'aria, e sotto c'è una
            scala a pioli che scende in una luce azzurra intermittente, lungo
            tubature calde al tatto. Scendi con i palmi che bruciano per lo
            sforzo.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: La maniglia
          testo: |
            La maniglia ti sfugge a metà strada, e il portello ricade con un colpo
            che rimbomba per tutta la conca e ti schiaccia due dita contro il
            bordo. Resti in ginocchio con la mano stretta sotto l'ascella, mentre
            l'eco continua a tornare dalla roccia.
          effetti: { ferite: 0.5 }
      - testo: "Studiare le carte della baracca"
        descrizione: "Una squadra della Gilda si portava sempre dietro le mappe, e a volte le lasciava."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Nodo tre
          testo: |
            Fra le carte c'è una mappa dei livelli inferiori, leggibile per metà,
            con una sezione segnata *NODO 3, energia residua* e, dietro la
            baracca, un portello di servizio più piccolo. Ti infili la mappa nella
            camicia e scendi da lì, per una scala stretta che puzza di olio
            vecchio.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: La muffa
          testo: |
            La mappa ti si sfalda fra le dita appena provi a spiegarla, e sotto la
            muffa si è mangiata anche le altre. Esci dalla baracca con gli occhi che
            lacrimano per le spore e una tosse secca che non ti lascia fino a sera.
          effetti: { ferite: 0.5 }
      - testo: "Fare leva con il piccone"
        descrizione: "Il piccone regge di sicuro. Sul manico non giureresti."
        costo: 2
        esito:
          titolo: Il manico
          testo: |
            Infili la punta del piccone sotto il bordo e ci butti sopra tutto il
            peso, finché il portello si stacca con uno strappo e il manico ti
            torna indietro sullo zigomo. Scendi la scala a pioli con l'occhio che
            si gonfia, verso la luce azzurra che si accende e si spegne.
          effetti: { profondita.vhar-ul: 1, ferite: 0.5 }

  - id: vhar-ul-corridoio
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il corridoio di manutenzione
    sommario: "Un tunnel in discesa di lastre che vibrano, e dietro le paratie qualcosa batte con il tuo passo."
    luogo: Vhar'Ul, il corridoio di manutenzione
    area: vhar-ul
    ripetibile: true
    requisiti: [profondita.vhar-ul == 1]
    testo: |
      Il tunnel scende per una ventina di metri, rivestito di lastre di
      metallo che vibrano a ogni passo, e qualcuno della vecchia squadra ha
      numerato col gesso le paratie fino alla dodicesima. Dopo tre passi ti
      fermi, e dietro il metallo arriva un colpo sordo, un attimo dopo il tuo
      ultimo passo.

      {espressivita Media} Chi batte dall'altra parte ti va dietro come un
      musicista che segue a orecchio un pezzo nuovo, e la musica gliela dai
      tu.
    opzioni:
      - testo: "Camminare fuori tempo"
        descrizione: "Se quello che batte ti segue il passo, bisogna dargli un passo impossibile da seguire."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Il ballo senza musica
          testo: |
            Allunghi e accorci il passo a caso, e dietro le paratie i colpi
            provano a starti dietro e sbagliano sempre di più, finché a metà
            corridoio smettono del tutto. Arrivi in fondo con la fronte bagnata,
            contento che nessuno ti abbia visto ballare senza musica.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: Il passo giusto
          testo: |
            Per un tratto funziona, poi ritrovi senza accorgertene il passo normale
            e i colpi lo ritrovano con te, sempre più vicini, finché una paratia si
            piega verso l'esterno a un palmo dalla tua spalla, con la forma di un
            pugno. Torni su di corsa fino al portello.
          effetti: { tormento: 1 }
      - testo: "Ascoltare i colpi"
        descrizione: "Prima di decidere che cosa fare, conviene capire che cosa sono."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: L'eco
          testo: |
            Resti immobile con il palmo sulla lastra, e dietro le paratie non batte niente.
            Batti piano il tacco, e dall'altra parte arriva un colpo uguale, con lo stesso
            ritardo dell'eco nella conca. Allora ti togli gli stivali e scendi a piedi nudi
            sul metallo freddo, senza che si muova più niente.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: L'orecchio sulla lastra
          testo: |
            Appoggi l'orecchio alla lastra, e i colpi si fanno più vicini e più
            lenti finché ne arriva uno proprio dietro la tua guancia, così forte che
            ti rimbomba nei denti. Per il resto della giornata ogni tanto lo risenti
            quando stai fermo.
          effetti: { tormento: 1 }
      - testo: "Scendere di corsa senza guardare"
        descrizione: "Venti metri sono pochi, se non ti fermi."
        costo: 2
        esito:
          titolo: Fino in fondo
          testo: |
            Scendi di corsa con la testa bassa, e i colpi ti corrono dietro
            paratia dopo paratia fino in fondo al corridoio, dove si fermano tutti
            nello stesso momento. Resti a lungo con la schiena contro il metallo
            prima di riuscire a staccarti dal muro.
          effetti: { profondita.vhar-ul: 1, tormento: 1 }

  - id: vhar-ul-sala-del-nodo
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sala del nodo
    sommario: "Un reattore di sfere sospeso a mezz'aria e un terminale che lampeggia sempre gli stessi simboli."
    luogo: Vhar'Ul, la sala del nodo
    area: vhar-ul
    ripetibile: true
    requisiti: [profondita.vhar-ul == 2]
    testo: |
      Al centro della sala, sospeso a mezz'aria senza niente che lo tenga,
      gira un reattore di sfere concentriche, e fra le sfere corrono scariche
      azzurre con il crepitio della legna verde nel fuoco. Sul pavimento ci
      sono impronte di stivali e sangue secco, e su un terminale laterale
      lampeggiano simboli dei Precursori, sempre nello stesso ordine.

      {magia Media} Il Mana qui dentro gira in tondo come acqua in un catino,
      e ogni volta che il terminale lampeggia tira un poco anche da te.

      {origine allievo-di-torvessa} Queste sfere girano da secoli sospese su
      niente, e i cristalli dell'Accademia ti sembrano giocattoli.
    opzioni:
      - testo: "Leggere il terminale"
        descrizione: "I simboli si ripetono, e forse è meglio sapere cosa vogliono dire prima di passarci davanti."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: Presenza biologica
          testo: |
            Guardi i simboli abbastanza a lungo da capire che sono misure, e
            cambiano quando ti muovi tu. Il terminale conta il tuo calore e prova
            a rifarlo, e sul vetro si disegna una sagoma storta della tua altezza.
            Ti tieni rasente il muro fuori dal suo raggio e passi oltre prima che
            la sagoma finisca di formarsi.
          imposta: { vhar-ul.nodo: 1 }
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: La sabbia che si alza
          testo: |
            Tocchi i simboli nell'ordine in cui lampeggiano senza nessuna idea di
            cosa vogliano dire. Il reattore accelera e un fascio di luce ti passa
            addosso dalla testa ai piedi. Accanto al terminale la sabbia metallica
            del pavimento comincia a sollevarsi e a prendere la tua forma.
          segue: il-riflesso-distorto
      - testo: "Passare lungo il muro, fuori dalla luce"
        descrizione: "Le scariche illuminano a scatti. Fra uno scatto e l'altro c'è il buio."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Fra uno scatto e l'altro
          testo: |
            Ti muovi lungo la parete dove la luce delle scariche arriva meno, un
            passo ogni volta che il crepitio si alza, con il metallo caldo come la
            schiena di un animale sotto la mano, ed esci dall'altra parte con la
            camicia incollata alla schiena.
          imposta: { vhar-ul.nodo: 1 }
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: La scarica
          testo: |
            Una scarica salta dal reattore al muro proprio mentre ci passi davanti e
            ti attraversa da una spalla all'altra. Sul muro lascia una striscia nera
            accanto ad altre più vecchie, e tu torni indietro con il braccio
            intorpidito fino al collo e l'odore dei tuoi capelli bruciati nel naso.
          effetti: { ferite: 0.5 }
      - testo: "Strisciare sotto il terminale"
        descrizione: "Il raggio del terminale non scende fino a terra. Il metallo del pavimento, però, scotta."
        costo: 2
        esito:
          titolo: Il pavimento caldo
          testo: |
            Passi carponi sotto il terminale, dove il raggio non arriva, con il
            naso a una spanna dal sangue secco e il metallo che ti brucia i palmi.
            A metà strada una scarica ti cade sulla schiena e ti contrae tutti i
            muscoli insieme, e ti rialzi dall'altra parte con le mani rosse e le
            orecchie che fischiano.
          imposta: { vhar-ul.nodo: 1 }
          effetti: { profondita.vhar-ul: 1, ferite: 0.5 }

  - id: il-riflesso-distorto
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il riflesso
    tipo: seguito
    luogo: Vhar'Ul, la sala del nodo
    area: vhar-ul
    requisiti: [profondita.vhar-ul == 2]
    testo: |
      Accanto al terminale la sabbia metallica si alza in una colonna e prende
      la tua forma, fino al modo di inclinare la testa quando ascolti, ma con
      il gomito che si piega un dito sopra il punto giusto e le ginocchia che
      guardano di lato. Alzi una mano, e lui la alza un attimo dopo. Nella
      destra stringe una forma di sabbia che ricorda la tua arma.

      {rissa Media} Il ginocchio storto regge male il peso. Se lo carichi da
      quella parte prima che abbia imparato come cadi tu, va giù.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "Conosce i tuoi colpi, ma li conosce in ritardo."
        combattimento: riflesso-distorto
        vittoria:
          titolo: Sabbia metallica
          testo: |
            Il riflesso risponde ai tuoi colpi sempre un attimo dopo, e quando
            provi una cosa che non hai mai fatto non sa che cosa risponderti. Al
            terzo colpo si apre in due dalla spalla al fianco e si sfa in sabbia
            metallica, e in mezzo alla sabbia trovi una scheggia di vetro dei
            Precursori.
          imposta: { vhar-ul.nodo: 1 }
          effetti: { profondita.vhar-ul: 1, reliquie.scheggia: 1 }
        sconfitta:
          titolo: I tuoi colpi
          testo: |
            Il riflesso ti batte con i tuoi stessi colpi e finisci a terra contro
            il terminale, mentre lui resta in piedi sopra di te con la testa
            inclinata finché il reattore rallenta e la sua forma si sfa da sola.
            Ti rialzi molto dopo, con la bocca piena di polvere di ferro.
      - testo: "Recitargli la formula dell'Esorcismo"
        descrizione: "È un'eco di Mana, e il Velo ha parole per le cose che non dovrebbero restare."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le parole storte
          testo: |
            Dici la formula del Velo a voce alta, scandendo come ti hanno insegnato.
            Il riflesso prova a ripeterla e le parole gli escono storte, mezze
            sillabe di luce che si spengono subito, poi si sfa dalla testa in giù
            come sabbia in una clessidra.
          imposta: { vhar-ul.nodo: 1 }
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: La tua voce
          testo: |
            La formula ti si ferma in gola a metà, e il riflesso la finisce per te
            con la tua voce e un attimo di ritardo, tanto che per un po' non sai
            più quale dei due ha parlato. Arretri fino alla porta senza voltargli
            le spalle, e lui ti guarda andare imitando il tuo passo all'indietro.
          effetti: { tormento: 1 }
      - testo: "Restare immobile finché si sfa"
        descrizione: "Se ti imita e basta, senza niente da imitare non dovrebbe durare."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Il piede addormentato
          testo: |
            Smetti di muoverti, e il riflesso smette con te. Senza niente da copiare
            comincia a perdere forma dalle dita ai contorni del viso, mentre tu tieni gli
            occhi fissi sull'unico bullone arrugginito della sala, così a lungo che ti si
            addormenta un piede. Alla fine crolla in un mucchio di sabbia, e passi oltre
            zoppicando.
          imposta: { vhar-ul.nodo: 1 }
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: Il naso
          testo: |
            Resisti per un minuto buono, poi ti prude il naso e ti gratti senza
            pensarci, e il riflesso si gratta il naso un attimo prima di te. Esci
            dalla sala camminando all'indietro, mentre lui resta accanto al
            terminale a ripetere lo stesso gesto senza fermarsi.
          effetti: { tormento: 1 }
      - testo: "Scappare verso il fondo della sala"
        descrizione: "La porta in fondo è a trenta passi. Lui corre come te."
        costo: 2
        esito:
          titolo: Il gomito sbagliato
          testo: |
            Corri verso la porta in fondo alla sala, e il riflesso ti corre dietro
            con il tuo stesso passo. Ti colpisce alla schiena con il suo gomito
            sbagliato sulla soglia, dove finisce la luce del reattore, e lì si
            sfa. Prosegui piegato in due, con un livido su tutta la scapola.
          imposta: { vhar-ul.nodo: 1 }
          effetti: { profondita.vhar-ul: 1, ferite: 0.5 }
      - testo: "Barare come nelle risse dietro le fucine"
        descrizione: "Conosce i tuoi colpi, ma quelli sporchi dei vicoli li tieni da parte per quando servono."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: fisico, abilita: [rissa, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il colpo dei vicoli
          testo: |
            Fai finta di caricarlo con la spalla, e mentre lui si prepara gli
            pesti il piede storto con il tallone e gli tiri in faccia una manciata
            di sabbia, il colpo che in Città Bassa si tiene per le risse da cui
            bisogna uscire vivi. Il riflesso non te l'ha mai visto fare, e si sfa
            in sabbia metallica con la tua faccia offesa.
          imposta: { vhar-ul.nodo: 1 }
          effetti: { profondita.vhar-ul: 1 }
          pe: { rissa: 5 }
        fallimento:
          titolo: Lo stesso trucco
          testo: |
            Fai finta di caricarlo e gli tiri la sabbia in faccia, e lui tira la
            sua nella tua un attimo dopo, con la stessa mossa del polso. Arretri
            fino alla porta sputando polvere di ferro, con il disagio di aver
            visto il tuo trucco migliore fatto da un altro.
          effetti: { tormento: 1 }

  - id: vhar-ul-pozzo-degli-anelli
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il pozzo degli anelli
    sommario: "Un pozzo verticale con anelli di metallo che girano lungo le pareti, e una vecchia scala di corda."
    luogo: Vhar'Ul, il pozzo degli anelli
    area: vhar-ul
    ripetibile: true
    requisiti: [profondita.vhar-ul == 2]
    testo: |
      Un pozzo largo quanto una stanza scende nel buio, e lungo le pareti
      girano anelli di metallo grandi come ruote di carro, che incrociandosi
      fanno saltare scintille. La scala di corda della vecchia squadra passa
      fra gli anelli in un varco che si apre e si chiude a ogni giro, e
      accanto al primo piolo è inciso il segno dei Raschiatori che vuol dire
      *uno per volta*.

      {acrobazia Media} Il varco resta aperto per tre pioli. Se scendi con
      le mani e lasci i piedi a cercare da soli, non stai mai fermo dentro
      il giro.
    opzioni:
      - testo: "Scendere contando i giri"
        descrizione: "Un piolo per ogni giro dell'anello, e fermarsi quando il varco si chiude."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Ad alta voce
          testo: |
            Scendi un piolo per ogni giro dell'anello più vicino e ti fermi quando
            il varco si chiude, con la faccia a un palmo dal metallo, mentre le
            scintille si spengono sulla stoffa delle spalle. In fondo al pozzo i
            piedi trovano una grata, e ti accorgi di aver contato ad alta voce per
            tutta la discesa.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: Il quarto anello
          testo: |
            Al quarto anello sbagli il conto, e il varco si chiude mentre hai
            ancora dentro una gamba. L'anello ti trascina per mezzo giro prima di
            lasciarti andare contro la corda, e risali a forza di braccia, con i
            palmi bruciati e il calzone strappato fino al ginocchio.
          effetti: { ferite: 0.5 }
      - testo: "Studiare il ritmo degli anelli"
        descrizione: "Girano a velocità diverse. Prima o poi si troveranno d'accordo."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il varco
          testo: |
            Guardi gli anelli per un pezzo e capisci che ogni tanto si allineano
            tutti e lasciano un varco dritto fino in fondo, per il tempo di contare
            fino a dieci. Quando arriva il momento ti lasci scivolare lungo la
            corda con le mani avvolte nelle maniche.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: Dietro le palpebre
          testo: |
            Guardi gli anelli tanto a lungo che continuano a girarti dietro le palpebre, e
            il ritmo che credevi di aver capito è sbagliato. Una scintilla ti salta sulle
            dita strette alla corda, scivoli per due pioli prima di riprendere la presa e
            risali con il polso storto che ti si gonfia sotto la manica.
          effetti: { ferite: 0.5 }
      - testo: "Calarti lungo la parete, fuori dagli anelli"
        descrizione: "Fra la roccia e gli anelli c'è lo spazio di una persona magra. Le staffe sono arrugginite."
        costo: 2
        esito:
          titolo: Le staffe
          testo: |
            Scendi lungo la parete, nello spazio stretto fra la roccia e gli
            anelli, tenendoti alle staffe arrugginite. A metà discesa una staffa
            ti resta in mano e cade nel buio senza che tu la senta arrivare, e
            arrivi in fondo con le unghie spezzate e le ginocchia scorticate.
          effetti: { profondita.vhar-ul: 1, ferite: 0.5 }

  - id: vhar-ul-campo-della-gilda
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il campo del terzo livello
    sommario: "La sala dove la squadra della Gilda aveva piantato il campo quarant'anni fa. Le coperte sono ancora piegate."
    luogo: Vhar'Ul, il campo della vecchia squadra
    area: vhar-ul
    ripetibile: true
    requisiti: [profondita.vhar-ul == 2]
    testo: |
      Al terzo livello il corridoio si allarga nella sala dove la squadra della
      Gilda aveva piantato il campo, con quattro brande dalle coperte piegate ad
      angoli dritti e una latta di gallette legata con lo spago. Su una lavagna
      ci sono i turni di guardia, l'ultima riga a metà, e il cuscino della
      quarta branda ha ancora un'ammaccatura tonda.

      {empatia Media} Chi piega le coperte così prima di un turno pensa di
      tornare a dormirci.

      {origine accolito-del-velo} La sera del Festival hai rifatto brande finché
      le mani non lo facevano da sole, e adesso vorrebbero lisciare quel
      cuscino.
    opzioni:
      - testo: "Frugare nel campo"
        descrizione: "Quarant'anni fa la squadra se n'è andata di fretta. Qualcosa sarà rimasto."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il panno incerato
          testo: |
            Sotto la branda con il cuscino ammaccato c'è uno zaino di tela marcia, e
            dentro, avvolta in un panno incerato, una placca di metallo dei
            Precursori fitta di incisioni, che qualcuno aveva messo da parte
            all'insaputa della Gilda. Nella latta le gallette sono diventate
            polvere.
          effetti: { profondita.vhar-ul: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Le scolopendre
          testo: |
            Sotto una coperta c'è un nido di scolopendre bianche senza occhi che
            ti corrono sulla mano. Ritiri il braccio con due puntini rossi sul
            dorso, che ti si gonfia in fretta e ti prude fino al gomito, e rimetti
            la coperta com'era, piegata ad angoli dritti.
          effetti: { ferite: 0.5 }
      - testo: "Leggere la lavagna dei turni"
        descrizione: "Una squadra segna i turni di guardia anche per sapere chi manca."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Asciutto
          testo: |
            L'ultima riga dei turni, quella senza ora, porta il nome *Benno*, e sopra ci sono altri due nomi
            che a un certo punto smettono di comparire. Sotto la lavagna una freccia indica un corridoio
            laterale con la parola *asciutto*, e lo segui per la roccia viva fino dove il metallo non vibra
            più.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: Il gesso
          testo: |
            La lavagna è scritta in una sigla di squadra che non conosci, con le ore
            segnate a tacche. Mentre provi a decifrarla il gesso ti si sfa sotto il
            dito e un pezzo di riga se ne va, e ti resta addosso la sensazione di
            aver cancellato un nome che qualcuno aveva lasciato lì apposta.
          effetti: { tormento: 1 }
      - testo: "Dormire un'ora su una branda"
        descrizione: "Le gambe lo chiedono. Il posto, forse, no."
        costo: 2
        esito:
          titolo: Il turno di guardia
          testo: |
            Ti stendi sulla branda più vicina alla porta e ti addormenti prima di
            deciderlo. Sogni il campo pieno di gente e una mano che ti scuote per
            il turno di guardia, chiamandoti con un nome che non è il tuo. Ti
            svegli con la coperta piegata sul petto ad angoli dritti, e non
            ricordi di averla presa.
          effetti: { profondita.vhar-ul: 1, tormento: 1 }

  # ------------------------------------------------------------ Vhar'Ul, le storie non ripetibili
  - id: la-fonte-di-energia
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sfera più piccola
    sommario: "Al centro del reattore gira una sfera grande come una mela, e qualcuno ci ha già provato."
    luogo: Vhar'Ul, la sala del nodo
    area: vhar-ul
    requisiti: [oggetto.fonte-di-energia == 0, vhar-ul.nodo == 1]
    testo: |
      Adesso che sai dove mettere i piedi, torni a guardare il reattore. Al
      centro gira una sfera grande quanto una mela, con una luce bianca e
      ferma, e le sfere esterne le ruotano intorno in versi opposti senza
      che le scariche la tocchino mai. Sotto il reattore c'è un uncino da
      recupero della Gilda legato a un'asta spezzata, e accanto, nel sangue
      secco, l'impronta di una mano aperta.

      {tecnologia Media} Le sfere grandi esistono per proteggere quella
      piccola, e il resto della sala è la scatola intorno al gioiello.
    opzioni:
      - testo: "Aspettare il varco e infilare l'asta"
        descrizione: "Le sfere esterne girano a velocità diverse. Ogni tanto le aperture si allineano."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il settimo giro
          testo: |
            Conti i giri delle sfere esterne finché trovi il momento in cui le
            aperture si allineano, una volta ogni sette giri. Al settimo infili
            nel varco l'asta con l'uncino in alto e tiri, e la sfera piccola ti
            cade in mano tiepida e più pesante di quanto pensassi.
          effetti: { oggetto.fonte-di-energia: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: L'asta strappata
          testo: |
            Allunghi l'asta nel momento sbagliato, e una sfera esterna te la
            strappa di mano. La scarica che arriva dopo ti risale per il braccio e
            ti butta seduto per terra accanto all'impronta della mano, mentre
            l'asta rotola nel buio sotto il terminale.
          effetti: { ferite: 0.5 }
      - testo: "Allungare la mano fra le sfere"
        descrizione: "Una mano è più svelta di un'asta. Se il giro lo sbagli, però, è anche più cara."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Difficile }
        successo:
          titolo: Fra le sfere
          testo: |
            Ti tiri su la manica fino alla spalla e aspetti con il braccio teso che le sfere
            esterne ti aprano un corridoio. Infili la mano, chiudi le dita sulla sfera piccola
            e le ritiri, con una scarica che ti passa così vicino al gomito da drizzarti i
            peli. Sotto la camicia la sfera ronza come un gatto addormentato.
          effetti: { oggetto.fonte-di-energia: 1 }
          pe: { acrobazia: 5 }
        fallimento:
          titolo: L'impronta
          testo: |
            Le sfere si richiudono di colpo mentre hai ancora dentro il polso, e la
            scarica ti butta all'indietro sul pavimento, con la mano aperta nel
            sangue secco. Per un'ora le dita ti restano piegate ad artiglio, e
            accanto all'impronta dell'altro adesso c'è anche quella della tua mano.
          effetti: { ferite: 1 }
      - testo: "Bloccare le sfere con il manico del piccone"
        descrizione: "Un manico di frassino fra le sfere le ferma per un momento, e il frassino conduce poco."
        costo: 2
        esito:
          titolo: Il frassino
          testo: |
            Pianti il manico del piccone fra le sfere esterne e ci butti sopra il
            tuo peso. Il reattore si inceppa con un rumore di denti e la scarica
            corre lungo il frassino fino alle tue mani, ma tu strappi lo stesso la
            sfera piccola dal suo posto, e ti restano i palmi neri e lucidi.
          effetti: { oggetto.fonte-di-energia: 1, ferite: 1 }
      - testo: "Rimontare l'uncino della Gilda come sulle piattaforme"
        descrizione: "L'uncino spezzato, legato al manico del piccone come sulle piattaforme, arriva fino al centro."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Facile }
        successo:
          titolo: Il nodo da piattaforma
          testo: |
            Leghi l'uncino al manico del piccone con il nodo delle piattaforme e
            ti stendi sotto il reattore, dove le scariche non arrivano. Quando le
            aperture si allineano infili l'uncino dal basso e tiri, e la sfera
            piccola ti rotola sul petto. Per abitudine sciogli il nodo prima di
            rialzarti.
          effetti: { oggetto.fonte-di-energia: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: Il nodo che regge
          testo: |
            Il nodo regge, ma il varco si chiude prima del previsto e una sfera
            esterna ti strappa di mano tutto quanto. La scarica ti arriva lungo il
            manico e ti lascia seduto accanto all'impronta della mano, e recuperi
            il piccone a tentoni sotto il terminale, con la punta annerita come
            quella dell'uncino.
          effetti: { ferite: 0.5 }

  - id: il-raschiatore-dietro-la-paratia
    immagine: ambientazione/rovine-dei-precursori
    titolo: La paratia saldata
    sommario: "A metà del corridoio c'è una paratia senza numero, saldata al telaio, l'unica che resta zitta quando passi."
    luogo: Vhar'Ul, il corridoio di manutenzione
    area: vhar-ul
    requisiti: [rovine.dorr == 0, profondita.vhar-ul >= 2]
    testo: |
      A metà del corridoio di manutenzione c'è una paratia più stretta delle
      altre, senza numero di gesso e saldata al telaio con una torcia da
      scavo. Dalla fessura è colato un grumo di ceralacca con il sigillo dei
      Raschiatori rovesciato, una lanterna in un cerchio, premuto dall'altra
      parte. È l'unica paratia che resta zitta quando ti muovi.

      {tecnologia Facile} La colata è più spessa in alto e sottile in basso,
      dove la mano era stanca. Chi saldava stava seduto, e a un certo punto
      ha smesso di avere fretta.
    opzioni:
      - testo: "Aprire la saldatura dove è più sottile"
        descrizione: "Una saldatura fatta di fretta ha sempre un punto debole."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Arelan Dorr
          testo: |
            Lavori di punta dove la colata è più sottile finché la saldatura cede
            con uno schiocco. Dentro, seduto con la schiena al muro, c'è un
            Raschiatore in tuta da lavoro, conservato dall'aria secca, con in
            grembo un taccuino di tre nomi senza segni accanto e al collo una
            piastrina d'ottone, *ARELAN DORR, SUPERVISORE*, che avvolgi nel
            fazzoletto.
          imposta: { rovine.dorr: 1 }
        fallimento:
          titolo: Il dorso della mano
          testo: |
            La colata è più dura di quanto sembrava, e la punta del piccone ci
            scivola sopra e ti porta la mano contro lo spigolo, che ti apre il
            dorso fino alle nocche. Sulla saldatura resta appena un graffio. Ti
            fasci la mano con un lembo di camicia, e dall'altra parte continua a
            non sentirsi niente.
          effetti: { ferite: 0.5 }
      - testo: "Forzarla con la spalla"
        descrizione: "Il telaio è vecchio quanto la saldatura, e il metallo stanco cede."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La piastrina
          testo: |
            Al terzo colpo di spalla il telaio si piega e la saldatura si apre.
            Dentro, seduto con la schiena al muro, c'è un Raschiatore in tuta da
            lavoro con un taccuino aperto in grembo su tre nomi senza segni
            accanto, e al collo una piastrina d'ottone, *ARELAN DORR,
            SUPERVISORE*. La sfili chiedendogli scusa a mezza voce per la
            spallata.
          imposta: { rovine.dorr: 1 }
        fallimento:
          titolo: La spalla
          testo: |
            Al terzo colpo di spalla è la spalla a cedere per prima. La paratia
            rimbomba come una campana e dietro tutte le altre i colpi rispondono
            insieme, mentre quella saldata resta muta e intatta. Ti siedi per terra
            a massaggiarti il braccio.
          effetti: { ferite: 0.5 }
      - testo: "Spaccare la saldatura a colpi di piccone"
        descrizione: "Prima o poi cede. Il rumore, nel frattempo, arriva dappertutto."
        costo: 2
        esito:
          titolo: Il taccuino
          testo: |
            Picchi sulla saldatura finché il metallo cede, con i colpi che ti
            rispondono da dietro le altre paratie. Dentro c'è un Raschiatore in
            tuta da lavoro, conservato dall'aria secca, con in grembo un taccuino
            di tre nomi senza segni accanto e al collo una piastrina d'ottone,
            *ARELAN DORR, SUPERVISORE*, che ti metti in tasca.
          imposta: { rovine.dorr: 1 }
          effetti: { ferite: 0.5 }
      - testo: "Leggere il sigillo rovesciato"
        descrizione: "Una lanterna capovolta dentro il cerchio, che fra i Raschiatori le reclute imparano prima di scendere."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: La lanterna capovolta
          testo: |
            La lanterna rovesciata nel cerchio vuol dire che dietro quella porta un
            Raschiatore ha scelto di restare, e che chi la trova la apre piano.
            Lavori di punta finché la colata cede. Dentro c'è un Raschiatore in
            tuta da lavoro con in grembo un taccuino di tre nomi e al collo una
            piastrina d'ottone, *ARELAN DORR, SUPERVISORE*, e ti togli il cappuccio
            prima di sfilargliela.
          imposta: { rovine.dorr: 1 }

  # ------------------------------------------------------------ Vhar'Ul, il cuore
  - id: la-sezione-sigillata
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sezione sigillata
    sommario: "Il nodo tre delle mappe della Gilda, dove qualcosa indossa ancora una tuta da Raschiatore."
    luogo: Vhar'Ul, il nodo tre
    area: vhar-ul
    requisiti: [profondita.vhar-ul >= 3]
    testo: |
      Dietro un portello deformato comincia il nodo tre delle mappe della
      Gilda. Il pavimento è fuso in onde rigide che scricchiolano sotto le
      suole, e sul soffitto girano decine di piccole sfere con un ronzio
      costante.

      In mezzo alla sala c'è un costrutto attaccato a cavi che entrano nel
      muro, per metà di metallo e per metà di carne mummificata, con addosso
      una tuta da Raschiatore cucita alla carne con un filo di rame. Quando
      sposti un piede la sua testa si gira verso il rumore con un gracchiare
      di ingranaggi. Sul petto ha una toppa con un nome ricamato in filo
      rosso, *Benno*.

      {armi-da-mischia Media} I cavi entrano nel muro tutti nello stesso
      punto, a un passo dal pavimento. Una lama che arrivi fin lì vale più di
      dieci colpi sulla carne.

      {origine apprendista-raschiatore} Fra i Raschiatori chi resta indietro
      si trascina fuori, ed è la prima cosa che ti hanno insegnato.

      {magia Difficile} Dentro il ferro c'è ancora un filo di Mana con la
      forma di un uomo, stanco, che non sa più come si fa a smettere.
    opzioni:
      - testo: "Affrontare il Residuo"
        descrizione: "È lento, ma i cavi lo tengono in piedi. Finché sono attaccati al muro, si rialza."
        combattimento: residuo-di-vhar-ul
        vittoria:
          titolo: Tre sillabe
          testo: |
            Il Residuo è lento, ma i cavi lo tirano su ogni volta che cade, finché
            li tagli alla base del muro. Allora si accascia e dalla gola gli
            escono tre sillabe in una lingua che non conosci, con la cadenza di un
            ringraziamento. Dalle sfere ferme stacchi un cristallo carico e due
            placche incise.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { cristalli.cristallo-carico: 1, reliquie.frammento-inciso: 2, rep.raschiatori: 0.5 }
          vai: ponti-sospesi
        sconfitta:
          titolo: Lo stivale
          testo: |
            I cavi ti si avvolgono intorno a una caviglia e ti tirano giù, e il
            Residuo ti è sopra con il suo peso di carne secca e di ferro. Ti liberi
            lasciandogli lo stivale e risali il corridoio con un piede scalzo, a
            mani vuote, mentre le luci azzurre si spengono alle tue spalle.
          imposta: { rovine.vhar-ul: 1 }
          vai: ponti-sospesi
      - testo: "Recitargli la formula dell'Esorcismo"
        descrizione: "Sotto il metallo c'è un uomo che non ha mai avuto un rito, e le parole vanno dette fino in fondo."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il filo di rame
          testo: |
            Dici sopra di lui la formula del Velo per i morti che non riposano,
            con la voce che si incrina al nome dell'Albero. Il Residuo si ferma
            con la mano alzata verso la toppa del petto, poi la carne secca si
            stacca a scaglie e la macchina crolla in pezzi. Dalle sfere ferme
            stacchi un cristallo carico e due placche incise, e ti tieni la toppa
            con il nome.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { cristalli.cristallo-carico: 1, reliquie.frammento-inciso: 2, rep.raschiatori: 0.5 }
          pe: { magia: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: La formula spezzata
          testo: |
            La formula ti si spezza in bocca su una sillaba che hai sempre
            sbagliato. Il Residuo si solleva tutto insieme sui cavi e ti prende al
            petto con il braccio di metallo, e ti salvi soltanto buttandoti
            all'indietro oltre il portello. Risali di corsa, con due schegge
            strappate al bordo del pavimento fuso.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { reliquie.scheggia: 2, ferite: 1, tormento: 1.5 }
          vai: ponti-sospesi
      - testo: "Staccare i cavi senza fare rumore"
        descrizione: "Sente i passi. Lungo il muro il pavimento non è fuso, e i cavi entrano nel muro proprio lì."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: I cavi
          testo: |
            Giri lungo il muro, dove le lastre sono ancora lisce, muovendoti
            soltanto quando le sfere ronzano più forte. Stacchi i cavi uno alla
            volta, e a ogni cavo il Residuo si affloscia un poco, finché resta
            seduto con la testa piegata come un nonno che si addormenta dopo
            pranzo. Dalle sfere ferme prendi un cristallo carico e due placche
            incise.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { cristalli.cristallo-carico: 1, reliquie.frammento-inciso: 2, rep.raschiatori: 0.5 }
          pe: { furtivita: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: La lastra
          testo: |
            Una lastra fusa ti scricchiola sotto lo stivale, e il Residuo ti viene
            incontro trascinando i cavi. Ti prende in pieno sul fianco con il
            braccio di metallo mentre corri verso il portello, e senti qualcosa
            cedere sotto la giubba. Risali il corridoio tenendoti il fianco, senza
            aver preso niente.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { ferite: 2 }
          vai: ponti-sospesi
      - testo: "Fermare le sfere del soffitto"
        descrizione: "Quando il Residuo si muove le sfere girano più forte. Forse funziona anche al contrario."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Il pannello
          testo: |
            Accanto al portello c'è un pannello con una fila di incavi, e ognuno
            si illumina quando una sfera gli passa sopra. Ci metti il pollice uno
            dopo l'altro nell'ordine giusto, e le sfere si fermano mentre il
            Residuo si affloscia sui suoi cavi. Dalle sfere prendi un cristallo
            carico e due placche incise.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { cristalli.cristallo-carico: 1, reliquie.frammento-inciso: 2, rep.raschiatori: 0.5 }
          pe: { tecnologia: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: L'incavo sbagliato
          testo: |
            Premi l'incavo sbagliato, e le sfere accelerano tutte insieme con un
            fischio che ti entra nelle orecchie. Il Residuo avanza verso il portello
            più svelto di prima e ti sbatte contro il metallo con il suo braccio, e
            scappi su per il corridoio con il fischio che ti segue fino al cancello.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { ferite: 1.5, tormento: 1 }
          vai: ponti-sospesi
      - testo: "Prendere quello che c'è vicino al portello"
        descrizione: "Sul bordo del pavimento fuso qualcosa si stacca. Il resto lo lasci a lui."
        costo: 2
        esito:
          titolo: La schiena contro il portello
          testo: |
            Resti sulla soglia e strappi dal bordo del pavimento fuso due schegge
            dei Precursori ancora calde. Quando il Residuo si trascina verso di te
            sui cavi richiudi il portello deformato con una spalla, e ci tieni la
            schiena contro finché il gracchiare si allontana.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { reliquie.scheggia: 2, ferite: 0.5 }
          vai: ponti-sospesi
      - testo: "Dire per Benno la preghiera della sera"
        descrizione: "Conosci le parole che Padre Vantes dice al tramonto, e vanno dette fino in fondo."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: mentale, abilita: [resilienza, empatia], difficolta: Difficile }
        successo:
          titolo: La toppa
          testo: |
            Ti inginocchi a tre passi da lui e dici la preghiera della sera,
            chiamandolo per nome alla fine di ogni verso. Il Residuo si ferma con
            la mano alzata verso la toppa del petto, e quando dici il suo nome per
            l'ultima volta si affloscia sui cavi. Dalle sfere ferme stacchi un
            cristallo carico e due placche incise.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { cristalli.cristallo-carico: 1, reliquie.frammento-inciso: 2, rep.raschiatori: 0.5 }
          pe: { resilienza: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: Il verso perso
          testo: |
            A metà preghiera il Residuo si solleva tutto insieme sui cavi e il
            verso ti scappa di mente. Il braccio di metallo ti prende al petto, e
            ti salvi soltanto buttandoti all'indietro oltre il portello. Risali di
            corsa, con due schegge strappate al bordo del pavimento fuso.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { reliquie.scheggia: 2, ferite: 1, tormento: 1.5 }
          vai: ponti-sospesi

  # ================================================================ il Laboratorio di Calibrazione, le stanze
  - id: laboratorio-camera-acustica
    immagine: ambientazione/rovine-dei-precursori
    titolo: La camera di test acustico
    sommario: "Una stanza cubica che restituisce ogni suono tre volte più forte, e un dispositivo appeso a due fili."
    luogo: Laboratorio di Calibrazione, la camera di test acustico
    area: laboratorio-di-calibrazione
    ripetibile: true
    requisiti: [profondita.laboratorio-di-calibrazione == 2]
    testo: |
      È una stanza cubica dalle pareti perfettamente lisce, e ogni suono
      torna indietro più forte di come è partito, tanto che un colpo di tosse
      ti ritorna tre volte più grosso. Al centro, su un piedistallo, pende da
      due fili un dispositivo rotto che oscilla appena a ogni rumore. Davanti
      alla porta d'uscita qualcuno ha lasciato un cappello di feltro
      rovesciato, con dentro una manciata di cotone.

      {furtivita Facile} Gli stivali hanno i chiodi sotto la suola. Sulle
      calze, e con il peso sul tallone, fai meno rumore di un gatto.
    opzioni:
      - testo: "Attraversarla senza un rumore"
        descrizione: "Sulle calze e con il peso sul tallone, un passo alla volta."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Sulle calze
          testo: |
            Ti togli gli stivali e attraversi la stanza sulle calze, appoggiando
            prima il tallone, mentre il dispositivo resta fermo sui suoi fili.
            Prima di andare ti infili un batuffolo del cotone del cappello in ogni
            orecchio, e ringrazi in silenzio il proprietario, dovunque sia.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: Il ginocchio
          testo: |
            A metà stanza ti scricchiola il ginocchio, quello che scricchiola sempre
            quando fa umido. La stanza rimanda lo scricchiolio moltiplicato, e il
            dispositivo risponde con un colpo sordo che ti entra nel petto e ti
            piega in due. Per un'ora senti soltanto un fischio acuto.
          effetti: { ferite: 0.5 }
      - testo: "Cercare il punto dove il suono si spegne"
        descrizione: "Una stanza fatta per amplificare avrà pure un difetto da qualche parte."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La parete di sinistra
          testo: |
            Batti piano le dita sul muro spostandoti di un passo alla volta,
            finché lungo la parete di sinistra il suono torna più debole, proprio
            dalla parte del cappello di feltro. Passi rasente il muro e il
            dispositivo non si muove nemmeno.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: Il colpo sordo
          testo: |
            Batti le dita sul muro, e il suono torna indietro tre volte, sempre
            più forte. Il dispositivo si accende con un colpo sordo che ti
            rovescia all'indietro fino alla porta, e ti rialzi con un filo di
            sangue che ti cola da un orecchio, accanto ad altre gocce di sangue
            vecchio sulla soglia.
          effetti: { ferite: 0.5 }
      - testo: "Appoggiarti il modulo sul petto"
        descrizione: "La piastra presa nel magazzino mangia il rumore dei passi. Questa stanza è fatta per lei."
        requisiti: [oggetto.modulo-di-isolamento >= 1]
        esito:
          titolo: La neve
          testo: |
            Ti appoggi sul petto la piastra fredda del modulo di isolamento, e il
            rumore dei tuoi passi sparisce come se camminassi nella neve. Attraversi
            la stanza senza fretta mentre il dispositivo resta immobile sui suoi
            fili, e dall'altra parte ti accorgi che per tutto il tempo hai sorriso.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
      - testo: "Tapparti le orecchie e correre"
        descrizione: "Le orecchie tappate ti salvano i timpani. Il petto, no."
        costo: 2
        esito:
          titolo: Una squadra intera
          testo: |
            Ti cacci le dita nelle orecchie e corri. La stanza moltiplica i tuoi
            passi finché sembrano quelli di una squadra intera, e il dispositivo ti
            risponde con un colpo sordo nel petto proprio mentre arrivi alla porta.
            Dall'altra parte resti a lungo in ginocchio, con le orecchie che
            fischiano.
          effetti: { profondita.laboratorio-di-calibrazione: 1, ferite: 0.5 }

  - id: laboratorio-taratura-termica
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sala di taratura termica
    sommario: "Una sala fredda come una ghiacciaia, con cerchi di metallo sul pavimento. Una voce dice sempre la stessa frase."
    luogo: Laboratorio di Calibrazione, la sala di taratura termica
    area: laboratorio-di-calibrazione
    ripetibile: true
    requisiti: [profondita.laboratorio-di-calibrazione == 0]
    testo: |
      La sala è fredda come una ghiacciaia, e sul pavimento coperto di brina
      ci sono cerchi di metallo grandi come piatti da portata, disposti a
      scacchiera, dove i Precursori provavano quanto freddo e quanto caldo
      reggessero i droni. Appena entri una voce di metallo dice una frase
      breve nella loro lingua, e il cerchio più vicino comincia a cambiare
      colore.

      {acrobazia Media} Se atterri sull'avampiede e riparti subito, la brina
      fra un cerchio e l'altro non fa in tempo a tradirti.
    opzioni:
      - testo: "Saltare da un cerchio spento all'altro"
        descrizione: "I cerchi con la brina sono freddi. Per ora."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Le suole fumanti
          testo: |
            I cerchi si accendono uno alla volta, prima quello sotto di te e poi i
            vicini, e allora non ti fermi più. Salti da un cerchio all'altro
            scegliendo sempre quelli con la brina, mentre dietro di te il metallo
            sfrigola e poi scricchiola di gelo. Arrivi in fondo con le caviglie
            indolenzite e le suole che fumano.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: Il cerchio sbagliato
          testo: |
            Salti sul cerchio sbagliato, e lo sai già mentre sei in aria. Sotto la
            suola il metallo si scalda in un attimo e ti si gonfia sotto la pianta
            una vescica larga come una moneta. Torni indietro saltellando su un
            piede, e per il resto della giornata cammini sul bordo della pianta.
          effetti: { ferite: 0.5 }
      - testo: "Restare sul cerchio e lasciar fare alla macchina"
        descrizione: "Tenebra ha detto di lasciarli fare. Bisogna vedere quanto si regge."
        prova: { attributo: mentale, abilita: [resilienza, medicina], difficolta: Media }
        successo:
          titolo: La camicia che fuma
          testo: |
            Resti immobile sul cerchio e lasci fare. Il freddo ti sale fino alle
            ginocchia e poi cambia di colpo in un calore che ti bagna di sudore la
            schiena. La voce dice un'altra frase più corta, dal tono vagamente
            soddisfatto, e il cerchio si spegne. Attraversi la sala con la camicia
            fradicia che fuma nel freddo.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: I piedi
          testo: |
            Il freddo ti sale fino alle ginocchia e lì resta, mentre la voce
            ripete la sua frase con la pazienza di un maestro davanti a un allievo
            tonto. Quando ti decidi a scendere dal cerchio cadi in avanti sulle
            mani, ed esci dalla sala a quattro zampe.
          effetti: { ferite: 0.5 }
      - testo: "Attraversarla di corsa"
        descrizione: "Un cerchio caldo e uno freddo. Sotto le suole, dopo un po', non fa differenza."
        costo: 2
        esito:
          titolo: Le vesciche
          testo: |
            Corri dritto in mezzo alla sala, e i cerchi si accendono sotto i tuoi
            piedi, ora roventi ora gelati, finché i piedi smettono di fare
            distinzioni. Arrivi in fondo con le suole spaccate e le piante coperte
            di vesciche, ti togli gli stivali e prosegui scalzo sul metallo liscio
            del corridoio.
          effetti: { profondita.laboratorio-di-calibrazione: 1, ferite: 0.5 }

  - id: laboratorio-scansione-chimica
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il corridoio di scansione chimica
    sommario: "Un corridoio stretto con le pareti bucate da migliaia di forellini, e per terra un fazzoletto bagnato."
    luogo: Laboratorio di Calibrazione, il corridoio di scansione chimica
    area: laboratorio-di-calibrazione
    ripetibile: true
    requisiti: [profondita.laboratorio-di-calibrazione == 0]
    testo: |
      Il corridoio è così stretto che ci si passa soltanto di lato, e così
      dritto che dall'imbocco la porta in fondo sembra un'unghia. Le pareti
      sono bucate da migliaia di forellini fatti per lavare i droni, con
      qualche ventola che gira piano senza fare vento. A pochi passi
      dall'imbocco ci sono un fazzoletto di cotone bagnato e una borraccia
      vuota, e l'aria non sa di niente, che è peggio di un cattivo odore.

      {medicina Media} Chi ha lasciato il fazzoletto ci ha versato sopra
      tutta l'acqua che aveva, a giudicare dalla borraccia vuota.
    opzioni:
      - testo: "Passare senza respirare"
        descrizione: "Sono cinquanta passi di lato. I polmoni dovrebbero bastare."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il mantice
          testo: |
            Ti riempi i polmoni all'imbocco e parti di lato, a passi svelti. A metà
            corridoio i forellini soffiano una nebbia fine che sa di sapone buono,
            quello dei panni delle feste, e tu tieni il fiato fino alla porta e lo
            butti fuori dall'altra parte con un rumore da mantice.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: Il sapone
          testo: |
            A tre quarti del corridoio i polmoni cedono e ti entra in bocca la nebbia, con un sapore di sapone e di ferro. Torni di
            corsa all'imbocco e passi un quarto d'ora in ginocchio a vomitare, e il sapore resta sulla lingua con la sua irritante
            aria di pulito.
          effetti: { ferite: 0.5 }
      - testo: "Capire quando soffiano"
        descrizione: "Le ventole girano sempre. Forse non sempre alla stessa velocità."
        prova: { attributo: mentale, abilita: [tecnologia, medicina], difficolta: Media }
        successo:
          titolo: Le ventole lente
          testo: |
            Le ventole rallentano tutte insieme un attimo prima che i forellini
            soffino. Bagni il fazzoletto con l'acqua della tua borraccia, te lo
            leghi sulla bocca e passi un tratto alla volta, fermandoti dove le
            ventole sono rotte, mentre il fazzoletto dell'altro resta per terra
            dove l'hai trovato. Arrivi in fondo con gli occhi che bruciano appena.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: In pieno viso
          testo: |
            Credi di aver capito il ritmo, e la nebbia ti arriva in pieno viso a
            metà strada. Gli occhi ti si riempiono di lacrime e le palpebre ti si
            incollano tanto che devi aprirle con le dita, e torni indietro a tentoni
            con le mani sulle pareti.
          effetti: { ferite: 0.5 }
      - testo: "Coprirti la faccia e andare"
        descrizione: "Con il fazzoletto di quello di prima, che è ancora bagnato."
        costo: 2
        esito:
          titolo: Il fazzoletto
          testo: |
            Ti leghi sulla bocca il fazzoletto di quello di prima, che sa ancora di
            qualcun altro, e passi di lato più in fretta che puoi. La nebbia ti
            arriva addosso due volte e ti punge gli occhi e le labbra, e dall'altra
            parte ti siedi contro il muro con la testa che gira.
          effetti: { profondita.laboratorio-di-calibrazione: 1, ferite: 0.5 }

  - id: laboratorio-magazzino
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il magazzino dei componenti
    sommario: "Scaffali fino al soffitto pieni di pezzi dalle forme impossibili, e un mucchio di droni spenti, uno dei quali morde."
    luogo: Laboratorio di Calibrazione, il magazzino
    area: laboratorio-di-calibrazione
    ripetibile: true
    requisiti: [profondita.laboratorio-di-calibrazione == 1]
    testo: |
      È la sala più grande che hai visto qui sotto, con scaffali fino al
      soffitto pieni di cassette di componenti dalle forme impossibili. Le
      altre squadre hanno svuotato tutto quello che stava all'altezza delle
      mani, ma sui ripiani più alti qualche cassetta è ancora sigillata. In
      un angolo c'è un mucchio di droni spenti grandi come gatti, e uno ha
      una croce di vernice rossa sul dorso, con accanto la scritta col gesso
      *attenzione, morde*.

      {origine figlio-della-citta-bassa} In Città Bassa una casa vuota si
      ripulisce nello stesso ordine, prima quello che sta all'altezza delle
      mani.
    opzioni:
      - testo: "Aprire le cassette sigillate"
        descrizione: "Sui ripiani alti, dove le altre squadre non sono arrivate."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Microbatterie
          testo: |
            Ti arrampichi fino ai ripiani alti, e su una cassetta trovi il fermo
            nascosto sotto il bordo, una linguetta sottile come un'unghia. Dentro,
            in un letto di schiuma grigia, ci sono microbatterie dei Precursori,
            cilindretti tiepidi grandi come un dito. Ne prendi una e richiudi il
            resto per la prossima squadra, un po' a malincuore.
          effetti: { profondita.laboratorio-di-calibrazione: 1, cella: 1 }
        fallimento:
          titolo: Il coperchio
          testo: |
            La cassetta si apre di scatto mentre ti tieni ancora allo scaffale con
            una mano, e il coperchio ti prende in piena fronte. Cadi di schiena
            sul mucchio di droni, e quello con la croce rossa si accende e ti
            guarda, poi si spegne di nuovo senza nessun interesse per te.
          effetti: { ferite: 0.5 }
      - testo: "Smontare i droni spenti"
        descrizione: "Al Nodo d'Ossidiana le parti di drone le comprano a peso. Quello con la croce rossa lo lasci stare."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: A peso
          testo: |
            Rovesci il mucchio con il piede e cominci a staccare pale e anelli dai
            droni spenti, puntando il ginocchio sulle carcasse per fare leva. Il
            metallo dei Precursori si piega a fatica, e alla fine hai la bisaccia
            pesante e un occhio di vetro che si accende se lo scuoti.
          effetti: { profondita.laboratorio-di-calibrazione: 1, bottino.parti-di-drone: 1 }
        fallimento:
          titolo: Morde
          testo: |
            Il drone che afferri per la pala è quello con la croce rossa, finito
            sotto gli altri. Si accende di colpo e ti chiude le pale sulla mano
            come una tagliola, e lo stacchi soltanto sbattendolo contro lo
            scaffale. Esci dal magazzino con tre dita fasciate, dando ragione alla
            scritta col gesso.
          effetti: { ferite: 0.5 }
      - testo: "Prendere la piastra che mangia i suoni"
        descrizione: "Su un ripiano basso c'è una cassetta foderata di un materiale che non fa eco."
        quando: [oggetto.modulo-di-isolamento == 0]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il modulo di isolamento
          testo: |
            La cassetta ha due fermi da aprire insieme. Dentro c'è una piastra
            grande come un palmo, opaca, con il bordo zigrinato, e quando la
            prendi in mano il rumore dei tuoi passi sparisce, e con lui il fruscio
            della manica sul fianco. La appoggi sul petto e senti il battito del
            tuo cuore farsi lontano.
          effetti: { profondita.laboratorio-di-calibrazione: 1, oggetto.modulo-di-isolamento: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: I due fermi
          testo: |
            Apri un fermo alla volta, e al secondo la cassetta si richiude da sola
            con uno scatto che ti pizzica la punta delle dita. Dentro resta la
            piastra, e il fermo adesso è bloccato, con un ronzio sottile che
            somiglia a una risatina. Ti riprometti di tornare con più calma.
          effetti: { ferite: 0.5 }
      - testo: "Riempire la bisaccia alla cieca"
        descrizione: "Quello che c'è sui ripiani bassi, senza stare a scegliere. Qualcosa varrà pure."
        costo: 2
        esito:
          titolo: L'ingranaggio
          testo: |
            Butti nella bisaccia quello che trovi sui ripiani bassi senza scegliere,
            finché un ingranaggio che gira da fermo ti prende un dito e te lo
            stringe fino all'osso. Lo stacchi tirando, e la pelle viene via con lui.
            Esci dal magazzino con la mano fasciata e la bisaccia che tintinna di
            pezzi quasi tutti inutili.
          effetti: { profondita.laboratorio-di-calibrazione: 1, ferite: 0.5, reliquie.scheggia: 1 }

  - id: laboratorio-reticolo
    immagine: ambientazione/rovine-dei-precursori
    titolo: La camera di esame laser
    sommario: "Una stanza quadrata attraversata da fasci di luce blu sottili come capelli, e mezzo bastone vicino alla porta."
    luogo: Laboratorio di Calibrazione, la camera di esame laser
    area: laboratorio-di-calibrazione
    ripetibile: true
    requisiti: [profondita.laboratorio-di-calibrazione == 1]
    testo: |
      Un reticolo di fasci di luce blu, sottili come capelli, taglia la stanza
      da una parete all'altra a tutte le altezze. Vicino alla porta c'è la
      metà di un bastone da passeggio di frassino tagliata netta, e l'altra
      metà è rotolata dall'altra parte.

      {origine rampollo-dei-quartieri-alti} Nei Quartieri Alti un bastone così
      lo porta per eleganza chi cammina benissimo, e questo invece è consumato
      sull'impugnatura da chi ci si appoggiava davvero.

      {acrobazia Media} Un fascio al ginocchio e uno al petto, poi uno alla
      caviglia. Si passa come in una danza di campagna, se non ti viene da
      starnutire.
    opzioni:
      - testo: "Passarci in mezzo"
        descrizione: "Fra un fascio e l'altro c'è spazio per un corpo, se il corpo si piega bene."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Il crampo
          testo: |
            Passi una gamba sopra un fascio e l'altra sotto il successivo,
            piegandoti fino a sfiorare il pavimento, il naso a un dito dalla luce
            blu che non scalda nemmeno. Dall'altra parte ti siedi a massaggiarti
            un crampo nel fianco, guardando il bastone tagliato in due.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: La riga rossa
          testo: |
            Un fascio ti sfiora la spalla senza fare male, e senti soltanto un odore
            di stoffa bruciata. Quando abbassi gli occhi la manica ha un taglio
            dritto, e sotto la pelle si sta aprendo piano in una riga rossa. Torni
            indietro dalla stessa strada e ti fasci il braccio fuori dalla porta.
          effetti: { ferite: 0.5 }
      - testo: "Disallineare i fasci"
        descrizione: "Sotto la soglia c'è una piastra di vetro con dei simboli che si spostano."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: Il corridoio dritto
          testo: |
            Passi la mano sulla piastra di vetro e i simboli la seguono. Ne sposti
            uno verso destra, e tutti i fasci ruotano di un dito nello stesso
            verso, lasciando un corridoio dritto in mezzo alla stanza che
            attraversi camminando, mentre i fasci tornano al loro posto un passo
            dietro i tuoi talloni.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: La ciocca
          testo: |
            Sposti un simbolo, e i fasci ruotano tutti insieme verso di te. Ti butti
            a terra di pancia appena in tempo, e uno ti passa sopra la testa
            portandoti via una ciocca di capelli. Resti a terra sulla soglia finché
            il reticolo torna com'era.
          effetti: { tormento: 1 }
      - testo: "Strisciare sotto i fasci più bassi"
        descrizione: "I fasci più bassi passano a una spanna dal pavimento. Una spanna è poco."
        costo: 2
        esito:
          titolo: A una spanna
          testo: |
            Ti stendi sulla pancia e avanzi sui gomiti, con la guancia sul metallo
            freddo e un fascio blu a una spanna dalla nuca. A metà stanza alzi la
            testa senza volerlo, e il fascio ti apre un taglio sottile sopra
            l'orecchio. Arrivi dall'altra parte con il collo bagnato di sangue e i
            gomiti scorticati.
          effetti: { profondita.laboratorio-di-calibrazione: 1, ferite: 0.5 }

  - id: laboratorio-analisi-cinetica
    immagine: bestiario/salvaguardia-precursori
    titolo: Il laboratorio di analisi cinetica
    sommario: "Una piattaforma inclinata e un braccio meccanico appeso al soffitto, che misura le cose colpendole una volta."
    luogo: Laboratorio di Calibrazione, l'analisi cinetica
    area: laboratorio-di-calibrazione
    ripetibile: true
    requisiti: [profondita.laboratorio-di-calibrazione == 2]
    testo: |
      Al centro della camera c'è una piattaforma inclinata, e sopra, appeso al
      soffitto, un braccio meccanico lungo quanto l'albero di una barca. Il
      pavimento intorno è pieno di ammaccature tonde, e sulla piattaforma sono
      rimasti un elmo da scavo schiacciato e una scarpa sola. Quando entri il
      braccio si stende con un sibilo e gira l'estremità verso di te.

      {rissa Media} Il colpo scende sempre uguale dall'alto. Chi si sposta di
      lato quando il braccio è già partito non viene misurato.

      {origine fuggiasco-di-ghoran} L'ultima volta che qualcuno ti ha preso le
      misure stavi sulla bilancia di Ghoran.
    opzioni:
      - testo: "Colpire il braccio per primo"
        descrizione: "Se lo colpisci smette di misurare e comincia a difendersi, che in un certo senso è più semplice."
        combattimento: braccio-di-calibrazione
        vittoria:
          titolo: Il tubo dell'aria
          testo: |
            Il braccio scende per misurarti e tu lo colpisci alla giuntura di
            mezzo, e da quel momento ti viene addosso a colpi corti e precisi,
            sempre sulla stessa spalla. Alla fine ti infili sotto e gli spezzi il
            tubo dell'aria, e si affloscia sul binario con un lungo sibilo. Fra i
            pezzi caduti trovi un occhio di vetro che si accende ancora.
          effetti: { profondita.laboratorio-di-calibrazione: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: Premuto
          testo: |
            Il braccio ti prende in pieno petto e ti incolla alla piattaforma
            inclinata, premendo, mentre la luce sul binario lampeggia. Quando ti
            lascia andare scivoli giù fra le ammaccature tonde, e la luce torna
            verde come dopo una misura riuscita. Esci con le costole che
            scricchiolano e il sospetto di essere stato registrato come difettoso.
      - testo: "Lasciarti misurare"
        descrizione: "Colpisce una volta sola. Se stai fermo, magari colpisce piano."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Il dito sullo sterno
          testo: |
            Resti immobile in mezzo alla camera. Il braccio scende a sfiorarti la
            testa e le spalle e alla fine ti preme piano sullo sterno un dito di
            metallo freddo, prima di ritrarsi con un sibilo quasi gentile. Ti
            accorgi di avere gli occhi chiusi soltanto quando la luce sul binario
            si spegne.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: La misura riuscita male
          testo: |
            Quando te lo vedi arrivare in faccia ti scansi d'istinto, e la misura
            riesce male. Il braccio riprova con più forza, ti prende sulla spalla e
            ti manda a sbattere contro la piattaforma, e per tutto il giorno il
            braccio sinistro non ti si alza oltre il gomito.
          effetti: { ferite: 0.5 }
      - testo: "Schivarlo e passare"
        descrizione: "Colpisce dove sei. Basta non esserci più."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: L'ammaccatura nuova
          testo: |
            Aspetti con i piedi larghi che il braccio cominci a scendere, e scatti
            di lato. Il colpo si pianta nel pavimento dove eri un momento prima e
            lascia un'ammaccatura tonda identica alle altre, e mentre il braccio
            si ritrae sei già oltre la piattaforma, con la tentazione, saggiamente
            respinta, di fargli un inchino.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: Il fianco
          testo: |
            Scatti di lato un attimo troppo tardi, e il colpo ti prende di striscio
            sul fianco e ti fa girare su te stesso. Scivoli giù dalla piattaforma
            inclinata fino all'elmo schiacciato, con la scarpa sola sotto la
            guancia, e ti rialzi tenendoti le costole.
          effetti: { ferite: 0.5 }
      - testo: "Prendere il colpo"
        descrizione: "Una misura è una misura. Basta che la prenda una volta sola."
        costo: 2
        esito:
          titolo: Una volta sola
          testo: |
            Ti metti in mezzo alla camera e lasci che il braccio scenda. Il colpo
            arriva una volta sola, in pieno sulla spalla, e ti piega le ginocchia,
            poi la luce sul binario si spegne come dopo una misura riuscita. Ti
            resta un livido tondo della stessa grandezza delle ammaccature sul
            pavimento.
          effetti: { profondita.laboratorio-di-calibrazione: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il Laboratorio, il cuore
  - id: il-nodo-principale
    immagine: bestiario/salvaguardia-precursori
    titolo: Il nodo principale
    sommario: "Un cilindro con tre anelli che girano senza attrito, e una console con tre simboli in fila."
    luogo: Laboratorio di Calibrazione, il nodo principale
    area: laboratorio-di-calibrazione
    requisiti: [profondita.laboratorio-di-calibrazione >= 3]
    testo: |
      La camera in fondo al Laboratorio la occupa quasi tutta un cilindro di
      metallo scuro più alto di tre uomini, con tre anelli che gli girano
      intorno in versi opposti. Per terra ci sono pezzi di droni smontati e
      messi in file ordinate come gli attrezzi di un calzolaio pignolo, e su
      una console ci sono tre simboli in fila. Appena passi la soglia si
      accende il primo.

      Un fascio di luce verde ti percorre dalla testa ai piedi e si accende
      il secondo. Dal cilindro esce un braccio sottile che ti tocca le spalle
      come un sarto che cerca il difetto in una giacca, e ti spinge la destra
      più in basso con un colpetto secco. Poi si accende il terzo, e gli
      anelli si staccano dal cilindro e si sollevano a mezz'aria intorno a un
      nucleo che pulsa, girandolo verso di te.

      {armi-da-mischia Difficile} Fra il secondo e il terzo anello resta un
      varco largo una lama, e il varco passa sempre dallo stesso lato.
    opzioni:
      - testo: "Affrontare il drone"
        descrizione: "Colpisce sempre nello stesso punto. Una volta capito dove, il resto è lavoro."
        combattimento: drone-alfa-x
        vittoria:
          titolo: Un rumore di pentole
          testo: |
            Il drone combatte come lavora, con colpi misurati che ripete identici, e
            impari a spostarti un attimo prima. Quando finalmente lo prendi nel
            nucleo gli anelli si bloccano tutti insieme e lui cade sul pavimento con
            un rumore di pentole, quasi volgare dopo tanta precisione. Dal suo
            ventre stacchi due microbatterie e un anello ancora tiepido.
          imposta: { rovine.calibrazione: 1 }
          effetti: { cella: 2, bottino.parti-di-drone: 1, rep.raschiatori: 0.5 }
          vai: ponti-sospesi
        sconfitta:
          titolo: Sotto la clavicola
          testo: |
            Il drone ti colpisce sempre nello stesso punto, sotto la clavicola,
            finché il braccio destro ti pende inutile lungo il fianco. Esci dalla
            camera camminando all'indietro, e lui non ti segue oltre la soglia. La
            linea luminosa del corridoio ti accompagna fino all'uscita, con la
            bisaccia vuota.
          imposta: { rovine.calibrazione: 1 }
          vai: ponti-sospesi
      - testo: "Spegnerlo dalla console"
        descrizione: "Tre simboli in fila, e il terzo è acceso. Qualcuno doveva pur poterlo spegnere."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Difficile }
        successo:
          titolo: Il primo simbolo
          testo: |
            Ti butti verso la console mentre gli anelli ti sfiorano la nuca e
            premi i simboli all'indietro, dal terzo al primo. Il drone si ferma a
            mezz'aria, poi gli anelli tornano piano al loro posto intorno al
            cilindro, e dalle file per terra prendi una microbatteria e un pezzo
            di drone.
          imposta: { rovine.calibrazione: 1 }
          effetti: { cella: 1, bottino.parti-di-drone: 1, rep.raschiatori: 0.5 }
          pe: { tecnologia: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: Il simbolo sbagliato
          testo: |
            Premi il simbolo sbagliato, e lo capisci dal suono prima ancora di
            vedere il drone accelerare. Ti prende alla schiena mentre sei chino
            sulla console e una seconda volta alla gamba mentre scappi verso la
            soglia, e risali il corridoio zoppicando, con la linea luminosa che
            tiene il tuo passo storto.
          imposta: { rovine.calibrazione: 1 }
          effetti: { ferite: 2 }
          vai: ponti-sospesi
      - testo: "Stare immobile finché smette di contarti"
        descrizione: "Calibra le cose che si muovono, e una cosa che non si muove è un mobile."
        prova: { attributo: fisico, abilita: [resistenza, furtivita], difficolta: Difficile }
        successo:
          titolo: Un mobile
          testo: |
            Ti fermi a metà di un passo e resti così, senza muovere nemmeno gli occhi, finché i simboli
            sulla console si spengono uno dopo l'altro e gli anelli tornano sul cilindro. Il primo
            passo che fai dopo è quello di un vecchio. Dalle file per terra prendi una microbatteria e
            un pezzo di drone.
          imposta: { rovine.calibrazione: 1 }
          effetti: { cella: 1, bottino.parti-di-drone: 1, rep.raschiatori: 0.5 }
          pe: { resistenza: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: Il tremito
          testo: |
            Resisti a lungo, ma a un certo punto il ginocchio ti trema e il drone se
            ne accorge prima di te. Il colpo ti arriva sulla coscia e ti butta a
            terra, e il secondo, identico, nello stesso punto. Ti trascini fuori
            dalla camera e risali il corridoio senza aver preso niente.
          imposta: { rovine.calibrazione: 1 }
          effetti: { ferite: 2 }
          vai: ponti-sospesi
      - testo: "Dargli un pezzo di ricambio"
        descrizione: "Il drone cerca un componente difettoso da sostituire. Nella bisaccia ne hai uno."
        requisiti: [bottino.parti-di-drone >= 1]
        esito:
          titolo: Il componente sostituito
          testo: |
            Lanci in mezzo agli anelli un pezzo di drone dalla bisaccia. Il drone
            lo prende al volo con il braccio sottile e lo infila nel cilindro con
            un clic, dopo averlo girato con l'attenzione di un orafo davanti a una
            pietra sospetta. Quando gli anelli tornano al loro posto prendi una
            microbatteria ed esci prima che cambi idea.
          imposta: { rovine.calibrazione: 1 }
          effetti: { bottino.parti-di-drone: -1, cella: 1, rep.raschiatori: 0.5 }
          vai: ponti-sospesi
      - testo: "Lasciarti calibrare"
        descrizione: "Tenebra l'ha detto, che conviene lasciarli fare. Quanto dura, invece, se l'è tenuto per sé."
        costo: 2
        esito:
          titolo: Più dritto
          testo: |
            Allarghi le braccia e lasci fare. Il drone ti raddrizza il collo con un
            colpetto che ti fa scricchiolare le vertebre e spinge in basso la spalla
            sinistra, un colpetto alla volta, finché qualcosa schiocca. Quando il
            terzo simbolo si spegne raccogli una microbatteria ed esci, e per due
            giorni cammini più dritto di quanto tu abbia mai fatto.
          imposta: { rovine.calibrazione: 1 }
          effetti: { cella: 1, tormento: 1.5, ferite: 0.5, rep.raschiatori: 0.5 }
          vai: ponti-sospesi
      - testo: "Farti prendere le misure come dal sarto di famiglia"
        descrizione: "Davanti ai sarti dei Quartieri Alti si sta ritti e fermi per ore, e tu ci stai da bambino."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo], difficolta: Difficile }
        successo:
          titolo: L'ultima prova
          testo: |
            Allarghi appena le braccia, con il mento dritto e lo sguardo su un
            punto lontano, come davanti allo specchio del sarto la vigilia di un
            ballo. Non muovi un dito nemmeno quando il braccio sottile ti
            raddrizza il colletto, finché gli anelli tornano sul cilindro. Dalle
            file per terra prendi una microbatteria e un pezzo di drone.
          imposta: { rovine.calibrazione: 1 }
          effetti: { cella: 1, bottino.parti-di-drone: 1, rep.raschiatori: 0.5 }
          pe: { galateo: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: Lo spillo
          testo: |
            Quando il braccio sottile ti spinge giù la spalla destra ti scappa il
            gesto con cui da bambino scansavi gli spilli, e il drone lo prende per
            un difetto. Il colpo ti arriva sulla coscia e il secondo nello stesso
            punto, e ti trascini fuori dalla camera senza aver preso niente.
          imposta: { rovine.calibrazione: 1 }
          effetti: { ferite: 2 }
          vai: ponti-sospesi

  # ================================================================ il Sito Mahr-Kel, le stanze
  - id: mahr-kel-quarantena
    immagine: ambientazione/regno-profondo
    titolo: La camera di quarantena
    sommario: "Una stanza rotonda con le pareti che si gonfiano come mantici, e il pavimento annerito davanti alla porta."
    luogo: Mahr-Kel, la camera di quarantena
    area: mahr-kel
    ripetibile: true
    requisiti: [profondita.mahr-kel == 0]
    testo: |
      La stanza è rotonda, con le pareti di metallo che si gonfiano e si
      sgonfiano come mantici, attraversate da tubature molli dove scorre a
      fiotti un liquido ambrato. Davanti alla porta interna, chiusa da una
      leva, il pavimento è annerito a raggiera, e sul cerchio nero c'è un
      paio di guanti di cuoio bruciati sulle dita e intatti sul polso.

      {medicina Media} Il ritmo dei fiotti è quello di un polso a riposo. Chi
      ha costruito questa stanza pensava ai corpi prima che alle macchine.
    opzioni:
      - testo: "Capire a che cosa serve la stanza"
        descrizione: "I fiotti nelle tubature hanno un ritmo, e il ritmo vorrà dire qualcosa."
        prova: { attributo: mentale, abilita: [tecnologia, medicina], difficolta: Media }
        successo:
          titolo: La sterilizzazione
          testo: |
            Guardi i fiotti e capisci che è una camera di sterilizzazione, come i
            bacili dove i chirurghi del Velo lavano i ferri, grande abbastanza per
            un corpo intero. Il liquido accelera subito prima della scarica.
            Aspetti che rallenti, abbassi la leva con il manico del piccone e
            salti indietro, e il lampo resta sulla soglia.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Le dita ad artiglio
          testo: |
            Abbassi la leva nel momento sbagliato, e il liquido nei tubi accelera
            proprio sotto la tua mano. La scarica ti risale dal braccio fino al
            petto e ti butta a terra contro il muro, con le dita contratte ad
            artiglio che ci mettono un bel pezzo a riaprirsi.
          effetti: { ferite: 0.5 }
      - testo: "Aprire e saltare indietro"
        descrizione: "Se la scarica arriva quando si apre la porta, basta non essere lì quando si apre."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il lampo
          testo: |
            Ti metti di lato alla porta, abbassi la leva con la punta delle dita e
            ti butti all'indietro. Il lampo esplode sulla soglia e ti lascia negli
            occhi una macchia viola con la forma della porta. Quando ti torna la
            vista la porta interna è aperta, e dall'altra parte c'è un corridoio che
            scende.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: I guanti
          testo: |
            Il lampo è più svelto di te. Ti prende alla mano ancora sulla leva e ti
            butta lungo disteso accanto ai guanti, e adesso capisci perché sono
            bruciati soltanto sulle dita. Ti rialzi con il palmo pieno di vesciche,
            e la porta si è già richiusa.
          effetti: { ferite: 0.5 }
      - testo: "Aprire e prendere la scarica"
        descrizione: "La scarica arriva comunque. Tanto vale sapere quando."
        costo: 2
        esito:
          titolo: Dentro le ossa
          testo: |
            Ti avvolgi la mano nella manica e abbassi la leva a denti stretti. La
            scarica ti entra nelle ossa e ti fa battere i denti tanto forte che ti
            mordi la lingua. Quando passa la porta è aperta, e la attraversi con
            il braccio che formicola e i capelli ritti sulla nuca.
          effetti: { profondita.mahr-kel: 1, ferite: 0.5 }

  - id: mahr-kel-drenaggio
    immagine: ambientazione/regno-profondo
    titolo: Il condotto di drenaggio
    sommario: "Un corridoio in discesa bagnato da un fluido viscoso, con linee blu che si spengono e si riaccendono."
    luogo: Mahr-Kel, il condotto di drenaggio
    area: mahr-kel
    ripetibile: true
    requisiti: [profondita.mahr-kel == 1]
    testo: |
      Il corridoio scende bagnato da un fluido viscoso che si stacca dalle
      pareti in fili lunghi, e le linee luminose blu sul pavimento si spengono
      e si riaccendono tutte insieme, lasciandoti al buio a intervalli. Dal
      fluido sale un vapore dolciastro che fa girare la testa come il primo
      bicchiere di vino. A metà discesa, a un chiodo da roccia, è legata una
      corda tagliata.

      {percezione Media} Il taglio della corda è dritto e pulito, fatto con
      una lama da qualcuno che stava sopra il chiodo.
    opzioni:
      - testo: "Scendere senza scivolare"
        descrizione: "Un passo per volta, con il peso indietro, e la speranza che il chiodo regga."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il chiodo
          testo: |
            Scendi di traverso con il peso indietro, un passo ogni volta che le
            linee si accendono, e quando si spengono aspetti al buio con le mani
            sul chiodo. Arrivi in fondo in piedi, con gli stivali pieni di fluido
            fino alla caviglia.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Nel fluido
          testo: |
            Al buio metti il piede sul fluido più spesso e scivoli di schiena fino
            al chiodo, con il fluido che ti entra nel colletto. La corda tagliata
            pende a un palmo dalla tua mano, troppo corta. Risali a quattro zampe
            con la pelle che ti formicola dappertutto, anche dopo che ti sei
            asciugato.
          effetti: { contaminazione: 1 }
      - testo: "Seguire le linee blu"
        descrizione: "Le linee non sono dappertutto, e forse segnano dove si può camminare."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Le scanalature
          testo: |
            Le linee corrono dentro scanalature del pavimento, dove il fluido
            scola via e il metallo resta ruvido. Metti i piedi soltanto lì,
            contando il buio fra un'accensione e l'altra, e arrivi in fondo
            asciutto fino alla caviglia, quasi dispiaciuto per chi ha legato la
            corda senza guardare per terra.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Il vapore
          testo: |
            Ti chini a guardare le linee da vicino, e il vapore ti entra nel naso
            tutto in una volta. Per un tempo che non sai misurare resti accucciato
            a fissare il blu che si accende e si spegne, felice, finché ti
            riscuote il freddo del fluido arrivato alle ginocchia.
          effetti: { tormento: 1 }
      - testo: "Lasciarti scivolare fino in fondo"
        descrizione: "In fondo ci arrivi di sicuro. Il fluido arriva con te."
        costo: 2
        esito:
          titolo: In fondo
          testo: |
            Ti siedi sul bordo, stringi le braccia al petto e ti lasci andare.
            Scivoli giù sulla schiena con le linee blu che ti passano accanto come
            le luci di una strada vista da un carro in corsa, e a metà ti scappa
            un urlo che somiglia a una risata. Arrivi in fondo fradicio e intero.
          effetti: { profondita.mahr-kel: 1, contaminazione: 1 }

  - id: mahr-kel-raccolta-biologica
    immagine: ambientazione/regno-profondo
    titolo: La camera di raccolta biologica
    sommario: "Sei capsule trasparenti in cerchio, e nella quinta, crepata, un mucchietto grigio."
    luogo: Mahr-Kel, la camera di raccolta biologica
    area: mahr-kel
    ripetibile: true
    requisiti: [profondita.mahr-kel == 2]
    testo: |
      Sei capsule trasparenti alte quanto un uomo stanno in cerchio intorno a
      una colonna, ciascuna con un campione sospeso in un liquido limpido,
      ciocche di capelli legate a mazzetti in una e insetti smontati in
      un'altra. La quinta ha una crepa fino a metà, e sul fondo, dove il
      liquido si è abbassato, c'è un mucchietto grigio che quando ti avvicini
      si apre, e sono dita.

      {origine figlio-del-circolo} Al Circolo ti hanno insegnato ad ascoltare
      una bestia prima di guardarla, e chi ha legato quei mazzetti le
      conosceva soltanto a pezzi.
    opzioni:
      - testo: "Affrontarle"
        descrizione: "Sono due mani senza corpo. Cercano una gola o un polso."
        combattimento: parassiti-di-mahr-kel
        vittoria:
          titolo: Le unghie pulite
          testo: |
            Escono dalla crepa in due e corrono sulle dita verso i tuoi polsi. Ne
            schiacci una sotto lo stivale, e l'altra ti sale sulla gamba fino al
            ginocchio prima che tu riesca a staccartela e a sbatterla contro la
            colonna. Restano per terra due mani grigie, aperte, con le unghie più
            curate delle tue.
          effetti: { profondita.mahr-kel: 1 }
        sconfitta:
          titolo: La gola
          testo: |
            Una delle due ti trova la gola mentre l'altra ti tiene il polso, e
            stringe con una forza che non ha niente a che vedere con la sua
            grandezza. Te la strappi di dosso insieme a un lembo di pelle e scappi
            tenendoti il collo, con le due mani che ti corrono dietro fino alla
            soglia.
      - testo: "Passare senza farle uscire"
        descrizione: "Il mucchietto si è aperto quando ti sei avvicinato, e da lontano forse dorme."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Dall'altra parte del cerchio
          testo: |
            Giri intorno al cerchio dalla parte opposta alla quinta capsula, tenendo
            la colonna fra te e la crepa, e il mucchietto grigio si richiude piano,
            un dito alla volta. Esci dalla camera camminando all'indietro, e ti volti
            soltanto quando la colonna nasconde del tutto la capsula.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Il polso
          testo: |
            A metà del cerchio una delle mani esce dalla crepa e ti corre dietro
            sul pavimento. Ti prende la caviglia e risale fino al polpaccio prima
            che tu riesca a staccartela a calci, e torni da dove sei venuto con i
            segni delle unghie che sanguinano dentro lo stivale.
          effetti: { ferite: 0.5 }
      - testo: "Chiudere la crepa"
        descrizione: "Con il mastice da scavo e le bende, se la capsula regge abbastanza da lasciarti lavorare."
        prova: { attributo: mentale, abilita: [tecnologia, medicina], difficolta: Media }
        successo:
          titolo: Il mastice
          testo: |
            Scaldi il mastice da scavo fra le mani e lo spalmi lungo la crepa come
            si chiude una ferita, mentre dentro la capsula le dita grigie tastano
            il vetro dalla tua parte. Ci passi sopra una benda, il mastice si
            indurisce in fretta e il mucchietto si richiude.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Il vetro
          testo: |
            Premi il mastice con un po' troppa convinzione, e il vetro cede sotto il
            pollice. Una mano esce e ti si chiude fredda e bagnata intorno al polso,
            e mentre la stacchi sbattendola contro la colonna l'altra ti graffia il
            dorso fino all'osso. Arretri fino alla porta con il braccio stretto al
            petto.
          effetti: { ferite: 0.5 }
      - testo: "Correre fino all'altra porta"
        descrizione: "Sono veloci. Forse non quanto te."
        costo: 2
        esito:
          titolo: La caviglia
          testo: |
            Corri lungo il bordo della camera. Una delle mani esce dalla crepa, ti
            raggiunge alla porta e ti si arrampica sulla gamba, e te la strappi di
            dosso soltanto sulla soglia. La butti indietro e chiudi la porta con
            un calcio, mentre il polpaccio ti sanguina in cinque punti e
            dall'altra parte del metallo le unghie grattano.
          effetti: { profondita.mahr-kel: 1, ferite: 0.5 }

  - id: mahr-kel-ricostruzione
    immagine: ambientazione/regno-profondo
    titolo: La camera di ricostruzione
    sommario: "Braccia meccaniche ferme a metà di un gesto sopra forme umane lasciate a metà."
    luogo: Mahr-Kel, la camera di ricostruzione
    area: mahr-kel
    ripetibile: true
    requisiti: [profondita.mahr-kel == 3]
    testo: |
      Dal soffitto pendono decine di braccia meccaniche ferme a metà di un gesto, e sotto ci sono
      forme umane non finite, come statue lasciate a metà dallo scultore. Appena entri ti prende la
      sensazione assurda di conoscere già questa stanza e il freddo di quei tavoli sotto la schiena.
      In fondo una delle forme si alza lentamente, con troppe braccia da una parte.

      {cavalcare Media} Ha l'andatura di un mulo sovraccarico da un lato, che gira sempre verso il
      peso. Se ti tieni dalla parte leggera, ci mette il doppio a voltarsi.
    opzioni:
      - testo: "Affrontare la forma che si è alzata"
        descrizione: "È lenta. Quello che afferra, però, non lo lascia."
        combattimento: abominio-incompleto
        vittoria:
          titolo: Fra le altre
          testo: |
            La forma è lenta, ma quello che afferra non lo lascia più, e al primo
            scambio devi sfilarti la giacca per scapparle. Da quel momento le giri
            intorno senza fermarti e la colpisci dalla parte dove ha meno braccia,
            finché crolla fra le forme incompiute. Esci in camicia, con le braccia
            graffiate fino ai gomiti.
          effetti: { profondita.mahr-kel: 1 }
        sconfitta:
          titolo: I polsi
          testo: |
            Ti prende per tutti e due i polsi e ti solleva fino alla sua faccia, a
            cui manca metà del lavoro, e resta a guardarti a lungo come se ti
            confrontasse con qualcosa. Poi ti lascia cadere e torna a sedersi fra
            le altre forme, e tu esci a carponi con i polsi viola.
      - testo: "Non dare retta al ricordo"
        descrizione: "Il ricordo non è tuo. Bisogna ricordarselo più forte di lui."
        prova: { attributo: mentale, abilita: [resilienza, medicina], difficolta: Media }
        successo:
          titolo: Il tuo nome
          testo: |
            Ti ripeti a mezza voce il tuo nome e la strada di casa, compresa la
            buca davanti al portone, finché la sensazione si stacca da te come una
            crosta. Il ricordo era di qualcun altro, e la stanza lo appoggia
            addosso a chiunque entri. Superi la forma con troppe braccia rasente
            la parete, prima che arrivi a toccarti.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Finito
          testo: |
            Il ricordo ti prende del tutto, e per un tempo che non sai misurare
            resti immobile in mezzo alla stanza ad aspettare che qualcuno venga a
            finirti. Ti risveglia il rumore della forma che si trascina verso di te.
            Scappi all'indietro, e per tutto il giorno dopo ti guardi le mani per
            controllare che siano finite.
          effetti: { tormento: 1 }
      - testo: "Portarla in giro per la stanza"
        descrizione: "È lenta, e per afferrarti deve prima raggiungerti."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il giro lungo
          testo: |
            Ti fai vedere, e quando la forma comincia a venirti incontro giri
            intorno ai tavoli tenendola sempre a tre passi, mentre lei ti segue
            con la pazienza delle cose che non hanno altro da fare. Al terzo giro
            tagli verso la porta di fondo e la lasci in mezzo alle sue sorelle
            incompiute.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Il tavolo
          testo: |
            Al secondo giro inciampi in una forma stesa per terra, e quella con
            troppe braccia ti prende per la caviglia e stringe finché senti
            scricchiolare l'osso. Te ne liberi lasciandole lo stivale e scappi
            saltellando, mentre lei se lo rigira davanti alla faccia senza occhi.
          effetti: { ferite: 0.5 }
      - testo: "Passare fra le forme incompiute"
        descrizione: "In mezzo a loro la forma che si è alzata non ti distingue. Il ricordo, invece, sì."
        costo: 2
        esito:
          titolo: Una di loro
          testo: |
            Passi carponi in mezzo alle forme stese per terra, fermandoti quando
            quella con troppe braccia volta la testa. Il ricordo intanto ti cresce
            dentro, e a metà strada ti sembra di essere una di loro, lasciata lì
            da qualcuno che non è tornato a finire il lavoro. Esci dall'altra
            parte tremando, e ti conti le dita.
          effetti: { profondita.mahr-kel: 1, tormento: 1 }

  - id: mahr-kel-depositi
    immagine: ambientazione/regno-profondo
    titolo: I depositi
    sommario: "Due magazzini di armature storte e vasche di conservazione, e una fila di fiale rosa con un filamento dentro."
    luogo: Mahr-Kel, i depositi
    area: mahr-kel
    ripetibile: true
    requisiti: [profondita.mahr-kel == 2]
    testo: |
      Due magazzini comunicano attraverso un arco basso, pieni di armature
      dalle forme storte, che non andrebbero bene a nessun corpo che conosci, e
      di vasche di liquido di conservazione dove galleggiano pezzi di creature
      smontate con l'etichetta scritta a mano. Su uno scaffale c'è una fila di
      fiale tiepide piene di un fluido rosa, e in ciascuna galleggia un
      filamento che si muove da solo.

      {conoscenze-della-strada Media} Al Nodo d'Ossidiana una fiala così la
      venderebbero come miracolo, e chi la compra non farebbe domande sul
      filamento.
    opzioni:
      - testo: "Prendere una fiala di fluido rosa"
        descrizione: "Sembra un ricostituente. Bisogna capire se lo è prima di metterselo in tasca."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Il graffio che si chiude
          testo: |
            Ne apri una e ci intingi la punta del dito. Il graffio che avevi sul
            dorso della mano si chiude sotto i tuoi occhi con un formicolio che ti
            sale fino al gomito, e ti lascia una pelle nuova, più rosa del resto.
            Ne prendi una piena e la avvolgi in un panno, lontano dal resto della
            bisaccia.
          effetti: { profondita.mahr-kel: 1, tonico: 1 }
        fallimento:
          titolo: Il filamento
          testo: |
            Ne apri una per annusarla, e il filamento salta fuori e ti si attacca
            al dorso della mano, caldo, cercando un punto dove entrare. Lo stacchi
            con la punta della lama, e sotto resta un buco piccolo e tondo che
            sanguina più di quanto dovrebbe.
          effetti: { ferite: 0.5 }
      - testo: "Aprire la vasca del reticolo"
        descrizione: "In una vasca più piccola galleggia un reticolo di vetro e filamenti che sembra fatto per ricucire."
        quando: [oggetto.matrice-di-levigazione == 0]
        prova: { attributo: mentale, abilita: [magia, medicina], difficolta: Media }
        successo:
          titolo: La matrice di levigazione
          testo: |
            Il coperchio della vasca si apre girandolo di un quarto. Tiri fuori il
            reticolo con due dita, e i filamenti si stringono piano intorno al tuo
            polso, mentre le piccole ferite sulle nocche ti prudono come se
            stessero già guarendo. Lo avvolgi nel fazzoletto in fondo alla
            bisaccia, e per un po' ti sembra di sentirlo muoversi.
          effetti: { profondita.mahr-kel: 1, oggetto.matrice-di-levigazione: 1 }
          pe: { medicina: 5 }
        fallimento:
          titolo: La stretta
          testo: |
            Infili la mano nella vasca, e il reticolo ti si stringe intorno al polso
            troppo forte, con i filamenti che ti entrano sotto la pelle. Lo strappi
            via a denti stretti e lo lasci ricadere nel liquido, e sul polso ti
            resta un disegno a rete di puntini rossi che sbiadisce dopo qualche
            giorno.
          effetti: { contaminazione: 1 }
      - testo: "Attraversare i depositi senza toccare niente"
        descrizione: "Fra le vasche il passaggio è stretto, e le armature storte hanno spigoli dappertutto."
        costo: 2
        esito:
          titolo: Gli spigoli
          testo: |
            Passi fra le vasche di lato, con le braccia alzate per non sfiorare il
            liquido, finché uno spigolo di armatura storta ti apre la coscia
            attraverso i calzoni. In una vasca un pezzo di creatura si gira verso di
            te mentre passi, e tu fai finta di non averlo visto.
          effetti: { profondita.mahr-kel: 1, ferite: 0.5 }

  - id: mahr-kel-corridoio-delle-ombre
    immagine: ambientazione/regno-profondo
    titolo: Il corridoio delle ombre
    sommario: "Un corridoio dritto dove la tua ombra cammina un battito dopo di te, fra altre ombre ferme."
    luogo: Mahr-Kel, il corridoio delle ombre
    area: mahr-kel
    ripetibile: true
    requisiti: [profondita.mahr-kel == 3]
    testo: |
      Nel corridoio lungo e dritto la luce scende bianca dal soffitto, e dopo
      una decina di passi ti accorgi che la tua ombra sulla parete si muove un
      battito dopo di te. Sulla parete ci sono altre ombre ferme, più sbiadite.
      Una ha il braccio alzato a indicare qualcosa più avanti, un'altra è
      seduta con la testa fra le ginocchia e ha la forma di un Raschiatore con
      il casco da scavo.

      {empatia Media} Quello seduto si è messo così da solo, con calma, come ci
      si mette ad aspettare una notizia brutta.
    opzioni:
      - testo: "Camminare guardando avanti"
        descrizione: "Gli occhi sulla porta in fondo, e l'ombra che faccia quello che vuole."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Puntuale
          testo: |
            Tieni gli occhi sulla porta in fondo e conti i passi a voce bassa, senza
            mai guardare la parete, con la tua ombra un battito dietro come un cane
            che non si decide a seguirti. Alla porta la luce cambia, e quando ti
            volti l'ombra ti è tornata attaccata ai piedi.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Il braccio alzato
          testo: |
            A metà strada guardi la parete, e la tua ombra si è fermata mentre tu
            camminavi ancora. Poi alza il braccio come quella che indica, e il tuo
            braccio resta giù. Torni indietro di corsa fino all'imbocco, e per
            un'ora ti guardi i piedi a ogni passo.
          effetti: { tormento: 1 }
      - testo: "Trovare da dove viene la luce"
        descrizione: "Un'ombra in ritardo vuol dire una luce in ritardo."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: La fessura
          testo: |
            Guardi il soffitto invece della parete. La luce scorre da un capo
            all'altro dentro una fessura sottile, e la tua ombra è soltanto la
            luce che arriva tardi, mentre le altre sono rimaste stampate sul
            metallo come su una lastra. Passi oltre senza guardarle in faccia, per
            una specie di rispetto.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Stampata
          testo: |
            Ti fermi a guardare il soffitto troppo a lungo, e quando riabbassi gli
            occhi c'è un'ombra nuova sulla parete, ferma con la testa rovesciata
            all'indietro. È la tua, e non si stacca dal metallo. Esci camminando
            all'indietro, e per tutto il giorno l'ombra che hai ai piedi ti sembra
            più leggera.
          effetti: { tormento: 1 }
      - testo: "Correre a occhi chiusi"
        descrizione: "Il corridoio è dritto, e se non le vedi le ombre possono fare quello che vogliono."
        costo: 2
        esito:
          titolo: A occhi chiusi
          testo: |
            Chiudi gli occhi e corri con una mano sulla parete. A metà strada la
            mano passa su un punto più freddo, con la forma di una spalla, e il
            braccio ti si gela fino al gomito. Arrivi in fondo sbattendo contro la
            porta, e quando riapri gli occhi la tua ombra ci mette un momento a
            raggiungerti.
          effetti: { profondita.mahr-kel: 1, tormento: 1 }

  # ------------------------------------------------------------ Mahr-Kel, l'archivio (non ripetibile)
  - id: l-archivio-di-memoria
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'archivio di memoria
    sommario: "Una sala di colonne di cristallo, lo stesso congegno che Yoggoth portava alla cintura, fatto grande."
    luogo: Mahr-Kel, l'archivio di memoria
    area: mahr-kel
    requisiti: [rovine.archivio == 0, profondita.mahr-kel >= 2]
    testo: |
      Dietro una porta che si apre da sola c'è una sala di colonne di
      cristallo alte fino al soffitto. Ognuna ha una fessura all'altezza del
      petto con un rotolo di pergamena sottilissima, e davanti a ognuna il
      pavimento è consumato in due impronte di piedi. Molte sono spente, e
      nelle altre sale e scende piano una luce lattiginosa.

      {percezione Media} Alcune impronte sono lunghe e strette, da piedi che
      stavano in equilibrio su un corpo molto più alto del tuo.

      Alla cintura di Yoggoth, nelle Segrete dell'Ira, c'era un cilindro di
      lyssan con dentro un rotolo come questi, e questa sala è lo stesso
      congegno fatto grande quanto una chiesa.
    opzioni:
      - testo: "Leggere una memoria"
        descrizione: "Quasi tutti i rotoli sono rovinati, ma ne basta uno che parli."
        prova: { attributo: mentale, abilita: [accademiche, magia, tecnologia], difficolta: Media }
        successo:
          titolo: Fase tre interrotta
          testo: |
            Premi il palmo sul cristallo finché il rotolo ronza, e sopra la
            colonna prende forma una figura di luce molto più alta di un uomo, per
            metà di carne e per metà di congegno. *Il Progetto Mahr-Kel, archivio
            biologico. Fase tre interrotta per la perdita del Supervisore
            Nhar'Kael. Ciclo di Ricostruzione incompleto*. Al nome il cristallo ti
            dà una scossa secca, e la figura si spegne.
          imposta: { rovine.archivio: 1 }
          effetti: { informazioni.segreto: 1, tormento: 1 }
          pe: { accademiche: 5 }
        fallimento:
          titolo: Le voci accavallate
          testo: |
            Premi il palmo sul cristallo, e il rotolo si accende tutto insieme,
            troppo. Sopra la colonna passano figure di luce una sull'altra,
            spezzate, con le voci accavallate, e quando stacchi la mano vedi le
            colonne doppie per un pezzo, con la testa che ti pulsa dietro gli
            occhi.
          effetti: { tormento: 1 }
      - testo: "Leggere la memoria del luogo con l'Eco"
        descrizione: "La formula precuriana parla con quello che i luoghi ricordano, e qui ricordano per mestiere."
        incantesimo: eco
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Quello che la sala ricorda
          testo: |
            Dici la formula e le colonne rispondono tutte insieme. Sopra la più
            vicina si alza una figura di luce mezza carne e mezza congegno, la cui
            voce ti arriva in testa già tradotta. *Il Progetto Mahr-Kel, archivio
            biologico. Fase tre interrotta per la perdita del Supervisore
            Nhar'Kael. Ciclo di Ricostruzione incompleto*. A quel nome la formula
            ti si spezza in bocca e la figura si spegne.
          imposta: { rovine.archivio: 1 }
          effetti: { informazioni.segreto: 1, tormento: 1 }
          pe: { magia: 5 }
        fallimento:
          titolo: Troppe memorie
          testo: |
            La formula apre tutte le colonne insieme, e ti arrivano addosso cento
            voci nella lingua dei Precursori, dentro la testa, dove tapparsi le
            orecchie non serve. Quando finiscono sei in ginocchio fra due colonne
            e non ricordi una parola, e il ronzio ti resta nelle orecchie per
            tutta la risalita.
          effetti: { tormento: 1 }
      - testo: "Avvicinare il cilindro di Yoggoth alla colonna"
        descrizione: "Il cilindro di lyssan di Yoggoth è lo stesso congegno in piccolo, e forse i due si riconoscono."
        requisiti: [oggetto.registratore-olografico >= 1]
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Facile }
        successo:
          titolo: Mostrati
          testo: |
            Appoggi il cilindro di lyssan accanto alla fessura, e su entrambi si
            accende la parola dei Precursori che vuol dire *mostrati*. Quando la
            leggi sopra la colonna compare una figura di luce mezza carne e mezza
            congegno. *Il Progetto Mahr-Kel, archivio biologico. Fase tre interrotta
            per la perdita del Supervisore Nhar'Kael. Ciclo di Ricostruzione
            incompleto*. Poi il cilindro ti si raffredda in mano e la figura si
            spegne.
          imposta: { rovine.archivio: 1 }
          effetti: { informazioni.segreto: 1, tormento: 1 }
        fallimento:
          titolo: Il cilindro freddo
          testo: |
            Leggi l'incisione che si accende sul cilindro e sul cristallo con
            l'accento sbagliato, quello delle parole difficili quando speri che
            nessuno ti corregga. Il cilindro di lyssan ti si gela in mano fino a
            bruciarti il palmo, dove ti resta un segno rosso con il disegno delle
            incisioni.
          effetti: { tormento: 1 }
      - testo: "Toccare le colonne una dopo l'altra"
        descrizione: "Una alla volta, finché una non parla. Ogni colonna lascia qualcosa negli occhi."
        costo: 2
        esito:
          titolo: La sesta colonna
          testo: |
            Tocchi ostinato una colonna dopo l'altra, e quasi tutte ti mostrano
            soltanto luce rotta e voci spezzate. Alla sesta compare una figura per
            metà di carne e per metà di congegno, e la segui sui simboli del
            rotolo. *Il Progetto Mahr-Kel, archivio biologico. Fase tre interrotta
            per la perdita del Supervisore Nhar'Kael. Ciclo di Ricostruzione
            incompleto*. Il mal di testa ti dura fino a sera.
          imposta: { rovine.archivio: 1 }
          effetti: { informazioni.segreto: 1, tormento: 1.5 }
      - testo: "Leggere il rotolo prima di toccare il cristallo"
        descrizione: "All'Accademia ti hanno insegnato a leggere i simboli dei Precursori un segno alla volta."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Facile }
        successo:
          titolo: Fase tre
          testo: |
            Leggi il rotolo un segno alla volta, muovendo le labbra come prima di
            un esame, e solo dopo appoggi il palmo sul cristallo. La figura di
            luce mezza carne e mezza congegno che si alza la segui senza fatica.
            *Il Progetto Mahr-Kel, archivio biologico. Fase tre interrotta per la
            perdita del Supervisore Nhar'Kael. Ciclo di Ricostruzione incompleto*.
            Al nome il cristallo ti dà una scossa e la figura si spegne.
          imposta: { rovine.archivio: 1 }
          effetti: { informazioni.segreto: 1, tormento: 1 }
          pe: { accademiche: 5 }
        fallimento:
          titolo: La nota a margine
          testo: |
            A metà del rotolo ti accorgi di aver preso per un verbo quello che era
            un numero. Quando appoggi il palmo la colonna si accende tutta insieme
            e troppo forte, con le figure di luce una sull'altra e le voci
            accavallate, e per un pezzo vedi le colonne doppie, come dopo una
            notte sui libri.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ Mahr-Kel, il cuore
  - id: la-vasca-di-clonazione
    immagine: ambientazione/regno-profondo
    titolo: La vasca di clonazione
    sommario: "Una vasca di liquido lattiginoso con decine di cavi che ci scendono dentro, e qualcosa che sta per uscire."
    luogo: Mahr-Kel, la vasca di clonazione
    area: mahr-kel
    requisiti: [profondita.mahr-kel >= 4]
    testo: |
      In una sala lunga e stretta c'è una vasca ovale di liquido lattiginoso
      che pulsa piano, con decine di cavi che ci calano dentro dal soffitto e
      una passerella intorno al bordo. In fondo un cilindro manda nel liquido
      fasci verde-turchese.

      {tecnologia Media} I cristalli che alimentano i fasci stanno incassati
      nel fianco del cilindro, alla portata di una mano.

      Una bolla scoppia sott'acqua con un plop sordo, e il liquido si illumina
      di un viola pallido. Poi la superficie si lacera e ne esce una figura
      alta almeno due metri e venti, con la spina dorsale di placche di
      metallo incomplete, fra le quali brilla un tessuto nervoso, e una
      costola spezzata che le sporge dal petto. Non ha occhi, e inclina la
      testa verso di te come per ascoltarti il cuore.

      {armi-da-mischia Media} Dove le placche restano aperte il tessuto è
      scoperto, e la costola spezzata gli lascia un varco nel petto.
    opzioni:
      - testo: "Affrontare il costrutto"
        descrizione: "Non ti vede. Ti trova lo stesso, ogni volta che il cuore ti salta in gola."
        combattimento: costrutto-biologico
        vittoria:
          titolo: La luce viola
          testo: |
            Il costrutto ti trova sempre un attimo dopo che il cuore ti è saltato
            in gola, e impari a colpire a cuore fermo. Quando crolla sulla
            passerella la luce viola nella vasca si spegne. Dalle rastrelliere
            prendi un cristallo carico e una placca incisa, e in una nicchia trovi
            una fiala di fluido rosa.
          imposta: { rovine.mahr-kel: 1 }
          effetti: { cristalli.cristallo-carico: 1, reliquie.frammento-inciso: 1, tonico: 1, rep.raschiatori: 0.5 }
          vai: ponti-sospesi
        sconfitta:
          titolo: Il bordo della vasca
          testo: |
            Il costrutto ti prende per le spalle e ti spinge verso la vasca, finché
            il liquido tiepido ti bagna la nuca e il corpo, per un momento, smette
            di lottare. Ti divincoli, rotoli giù dalla passerella e scappi a mani
            vuote.
          imposta: { rovine.mahr-kel: 1 }
          vai: ponti-sospesi
      - testo: "Spegnere i fasci del nucleo"
        descrizione: "I fasci verde-turchese finiscono nella vasca, e forse senza di loro il costrutto non regge."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: Il cilindro spento
          testo: |
            Corri lungo la passerella fino al cilindro, mentre il costrutto si
            gira lento verso il rumore dei tuoi passi, e strappi uno dopo l'altro
            i cristalli incassati nel fianco finché i fasci si spengono. Il
            costrutto si ferma a metà di un passo e si affloscia nella vasca, e tu
            ti tieni i cristalli, ancora caldi nel pugno.
          imposta: { rovine.mahr-kel: 1 }
          effetti: { cristalli.cristallo-carico: 1, cristalli.cristallo-sterile: 2, rep.raschiatori: 0.5 }
          pe: { tecnologia: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: Il fascio
          testo: |
            Il primo cristallo non viene via, e mentre tiri un fascio ti brucia il
            braccio fino alla carne. Il costrutto ti raggiunge sulla passerella e
            ti butta contro il cilindro, chino sopra di te ad ascoltare, e scappi
            tenendoti il braccio senza portare fuori niente.
          imposta: { rovine.mahr-kel: 1 }
          effetti: { ferite: 2 }
          vai: ponti-sospesi
      - testo: "Tenere il cuore lento"
        descrizione: "Ascolta i battiti. Un cuore lento è un cuore lontano."
        prova: { attributo: mentale, abilita: [resilienza, medicina], difficolta: Difficile }
        successo:
          titolo: Il cuore lontano
          testo: |
            Pensi alla coperta che pizzica della locanda finché il cuore ti batte
            lento come nel sonno, e il costrutto, dopo aver girato la testa di qua e
            di là, si volta verso la vasca. Ti muovi lungo la passerella fra un
            battito e l'altro, e dalle rastrelliere prendi un cristallo carico e una
            fiala di fluido rosa.
          imposta: { rovine.mahr-kel: 1 }
          effetti: { cristalli.cristallo-carico: 1, tonico: 1, rep.raschiatori: 0.5 }
          pe: { resilienza: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: Il salto in gola
          testo: |
            Il cuore rallenta, ma quando il costrutto fa un passo verso di te ti
            salta in gola tutto in una volta, e lui gira la testa di scatto. Ti
            stringe la spalla fino all'osso con le dita senza unghie, e te ne liberi
            soltanto buttandoti giù dalla passerella. Scappi a mani vuote su per le
            sale di Mahr-Kel.
          imposta: { rovine.mahr-kel: 1 }
          effetti: { ferite: 2 }
          vai: ponti-sospesi
      - testo: "Prendere quello che c'è vicino alla porta e scappare"
        descrizione: "Sulla rastrelliera accanto all'ingresso c'è qualcosa, e il resto lo lasci a lui."
        costo: 2
        esito:
          titolo: Vicino alla porta
          testo: |
            Afferri le prime due cose che ti capitano sotto le mani sulla
            rastrelliera accanto all'ingresso e ti butti fuori, ma il costrutto ti
            raggiunge sulla soglia e ti apre la schiena con la costola spezzata.
            Soltanto all'aperto, con la schiena che brucia, guardi che cosa hai
            preso.
          imposta: { rovine.mahr-kel: 1 }
          effetti: { reliquie.scheggia: 2, ferite: 1 }
          vai: ponti-sospesi
      - testo: "Ascoltarlo come una bestia ferita"
        descrizione: "Al Circolo ti hanno insegnato ad ascoltare una bestia prima di guardarla, e questa fa lo stesso con te."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Difficile }
        successo:
          titolo: Il respiro della bestia
          testo: |
            Ascolti il costrutto come al Circolo si ascolta una bestia ferita,
            finché sotto il ronzio dei cavi trovi il suo respiro, lento come
            quello di un bue che dorme, e ci metti sopra il tuo. Lui si volta
            verso la vasca come verso una tana, e dalle rastrelliere prendi un
            cristallo carico e una fiala di fluido rosa.
          imposta: { rovine.mahr-kel: 1 }
          effetti: { cristalli.cristallo-carico: 1, tonico: 1, rep.raschiatori: 0.5 }
          pe: { natura: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: Il tempo sbagliato
          testo: |
            Cerchi il suo respiro sotto il ronzio dei cavi e trovi soltanto il
            ronzio. Il cuore ti va dietro al tempo sbagliato, e il costrutto gira
            la testa di scatto verso di te. Ti stringe la spalla fino all'osso, e
            te ne liberi soltanto buttandoti giù dalla passerella. Scappi a mani
            vuote su per le sale di Mahr-Kel.
          imposta: { rovine.mahr-kel: 1 }
          effetti: { ferite: 2 }
          vai: ponti-sospesi

  # ================================================================ al Grifone, la piastrina di Dorr
  - id: la-piastrina-di-dorr
    presso: grifone-di-ferro
    immagine: personaggi/dragna-gro-malog
    titolo: La piastrina di Dorr
    sommario: "Una piastrina d'ottone nel fazzoletto, e i registri dei turni di quarant'anni fa dietro il bancone di Dragna."
    luogo: Locanda del Grifone di Ferro, il tavolo di Dragna
    area: ponti-sospesi
    requisiti: [rovine.dorr == 1]
    testo: |
      Posi la piastrina sul tavolo di Dragna. Lei la scopre con la punta di un
      dito e la gira verso la lampada per leggerla, e per un po' non dice
      niente.

      {empatia Media} Tiene il dito sulla piastrina più del necessario. Lo
      sapeva da qualche parte che sarebbe finita così, e adesso le tocca
      smettere di non saperlo.

      Poi va dietro al bancone e torna con un registro dalle pagine color del
      tè, aperto a una pagina di quarant'anni fa. C'è la squadra di Vhar'Ul
      con tre nomi cerchiati in rosso, e sotto *Arelan Dorr, turno singolo,
      recupero*, con l'ora dell'uscita e la colonna del rientro vuota.

      «Il vecchio Ferro diceva che se n'era andato a Ghoran con la paga» dice
      Dragna piano. «Diceva che si vergognava, e ci credevano tutti.»

      {origine apprendista-raschiatore} Per Arelan Dorr una lanterna sul Ponte
      dei Morti non c'è mai stata.
    opzioni:
      - testo: "Raccontarle della paratia"
        descrizione: "Saldata da dentro, con il sigillo dei Raschiatori, e il taccuino con i tre nomi."
        costo: 0
        esito:
          titolo: Tre nomi
          testo: |
            Le racconti della paratia saldata dall'interno e del taccuino con tre
            nomi senza segni accanto, e Dragna legge a voce bassa i tre nomi
            cerchiati nel registro, fino a *Benno*, che è l'ultimo. «È tornato giù
            a cercarli da solo, perché la Gilda non gli dava un'altra squadra»
            dice piano.
      - testo: "Lasciarle la piastrina"
        descrizione: "Dorr era un Raschiatore, e le sue cose spettano ai Raschiatori."
        esito:
          titolo: L'ora del rientro
          testo: |
            Dragna si infila la piastrina nella giubba, dalla parte del cuore, e
            nella colonna vuota da quarant'anni scrive l'ora del rientro di Arelan
            Dorr, quella di stasera. «Domani gli appendiamo una lanterna sul Ponte
            dei Morti» dice, e ripete a mezza voce la formula del ponte. «Una
            lanterna per nome. Una lanterna per ciò che pensavi di sapere di lui.
            E tu ci vieni, visto che l'hai riportato a casa.»
          imposta: { rovine.dorr: 2 }
          effetti: { rep.raschiatori: 1 }
          pe: { empatia: 5 }
      - testo: "Dirle che a Ghoran non si scappa con la paga"
        descrizione: "Il vecchio Ferro diceva che Dorr era andato a Ghoran, e tu sai in che direzione si scappa."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La direzione sbagliata
          testo: |
            Le dici che da Ghoran si scappa, e che laggiù un supervisore con la
            paga in tasca e tre uomini sulla coscienza non ci va a nascondersi.
            Dragna alza gli occhi dalla pagina e annuisce piano. Si infila la
