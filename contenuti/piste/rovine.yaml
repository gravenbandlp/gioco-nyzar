# Le rovine dei Raschiatori (blocco 8): tre spedizioni ripetibili per chi è nei turni di scavo
# (raschiatore >= 1, pista.acciaio >= 8). Si parte dalla bacheca del Grifone di Ferro.
# - `vhar-ul` (soglia 3): cinque stanze, il seguito `il-riflesso-distorto` (terminale della sala del nodo
#   attivato male), due storie non ripetibili (`la-fonte-di-energia`, `il-raschiatore-dietro-la-paratia`,
#   rovine.dorr 1) e il cuore `la-sezione-sigillata` (rovine.vhar-ul 1).
# - `laboratorio-di-calibrazione` (soglia 3): sei stanze (nel magazzino, una volta sola, il modulo di
#   isolamento) e il cuore `il-nodo-principale` (rovine.calibrazione 1).
# - `mahr-kel` (soglia 4): sei stanze (nei depositi, una volta sola, la matrice di levigazione), la storia
#   non ripetibile `l-archivio-di-memoria` (rovine.archivio 1) e il cuore `la-vasca-di-clonazione`
#   (rovine.mahr-kel 1).
# - Al Grifone, `la-piastrina-di-dorr` (rovine.dorr 1 → 2).
# Scelte di canone: le spedizioni di quarant'anni fa le pagava la Gilda dei Mercanti (la "cartografia del
# sottosuolo", a metro di mappa) e le facevano i Raschiatori; il Consiglio degli Scavatori riapre i siti
# sigillati perché il primo strato del Labirinto è raschiato fino all'osso. Il Raschiatore mummificato è
# Arelan Dorr, tornato da solo a cercare i suoi tre uomini; il Residuo porta la tuta di uno di loro (Benno).
aree:
  - id: vhar-ul
    immagine: ambientazione/superficie-fratturata
    nome: Vhar'Ul
    sommario: "Un portale annerito in fondo a una conca di basalto, mezza giornata a sud oltre gli ultimi ponti. La Gilda l'ha fatto sigillare quarant'anni fa, e dentro le paratie qualcosa batte ancora."
    spedizione: { ritorno: ponti-sospesi, soglia: 3, stanze: 3 }
    testo: |
      L'ingresso di Vhar'Ul non si vede finché non ci sei praticamente sopra.
      È incassato nella parete della conca, fra due fratture del basalto, e il
      metallo del portale è annerito e consumato. Sopra c'è un'iscrizione dei
      Precursori che il vento ha limato fino a lasciarne soltanto le prime
      sillabe, e da quelle sillabe i Raschiatori hanno preso il nome.

      In fondo alla conca il vento cala di colpo. L'aria si fa densa e ti
      pizzica la pelle dei polsi come prima di un temporale, e i tuoi passi
      sulla ghiaia tornano indietro con un'eco che arriva un attimo in
      ritardo. Davanti al portale c'è il cancello dei Raschiatori con il
      sigillo di ceralacca diventato nero, e accanto una baracca di lamiera
      con la porta che sbatte. Sul cardine di quella porta qualcuno ha
      avvolto un pezzo di stoffa perché non cigolasse, e la stoffa è ancora
      lì, sbiadita fino al colore della pietra. Ti ritrovi a camminare in
      punta di piedi senza averlo deciso.

  - id: laboratorio-di-calibrazione
    immagine: ambientazione/rovine-dei-precursori
    nome: Laboratorio di Calibrazione
    sommario: "Una rovina fredda dentro una collina di roccia vetrosa, dove le macchine dei Precursori prendono ancora le misure a chiunque passi. Quando trovano un errore lo correggono."
    spedizione: { ritorno: ponti-sospesi, soglia: 3, stanze: 3 }
    testo: |
      Il Laboratorio di Calibrazione sta dentro una collina di roccia
      vetrosa, a due giorni di cammino verso sud-est, e da fuori sembra
      soltanto una crepa più regolare delle altre. Dentro comincia un
      corridoio dritto di metallo liscio, così pulito che dopo secoli non ci
      trovi un granello di polvere. Sulle pareti corre una linea luminosa
      sottile che si accende davanti a te e si spegne alle tue spalle, e
      tiene il tuo passo anche quando rallenti. Qui i Precursori taravano
      sensori e droni perché uscissero perfettamente precisi. Le macchine che
      misuravano sono rimaste accese senza più nessuno che dica loro che cosa
      misurare, e adesso misurano chi passa.

      Accanto all'ingresso un Raschiatore ha inciso con un chiodo una freccia
      e la parola *fuori*. Il metallo intorno all'incisione si è già richiuso
      per metà, liscio come una cicatrice vecchia, e qualcuno ci ha ripassato
      sopra due volte. Ti accorgi che stai camminando più dritto del solito,
      con le spalle ferme e il mento alto.

  - id: mahr-kel
    immagine: ambientazione/regno-profondo
    nome: Sito Mahr-Kel
    sommario: "Un impianto dei Precursori sepolto a sud-ovest, che fotografava i viventi e li rifaceva. Trentacinque anni fa la Gilda l'ha dichiarato instabile, e da allora nessuno ci era più sceso."
    spedizione: { ritorno: ponti-sospesi, soglia: 4, stanze: 3 }
    testo: |
      Le paratie d'ingresso di Mahr-Kel sono tre e stanno una dietro l'altra.
      Su ognuna la stessa parola è incisa più volte nei caratteri dei
      Precursori. Qualcuno della prima squadra l'ha ricopiata sotto in lettere
      comuni, *Mahr-Kel*, con la vernice bianca dei segnali di scavo. Dalle
      griglie del pavimento sale un vapore tiepido che odora di latte andato a
      male, e ti si posa sulle labbra.

      La terza paratia è socchiusa di un palmo. Trentacinque anni fa si è
      chiusa sul braccio di un Raschiatore e non l'ha più lasciato, e la sua
      squadra l'ha liberato con la sega da ossa, ma è morto dissanguato prima
      di rivedere il cielo. Sul bordo è rimasto incastrato un lembo di cuoio
      scuro, il resto di una manica, e quelli che hanno riportato a casa il
      corpo gli hanno legato intorno un nastro rosso, come si fa con le
      lanterne del Ponte dei Morti. Più in là, nel buio, qualcosa pompa con un
      ritmo lento e regolare. Passi tenendoti lontano dal bordo della paratia,
      con il braccio stretto al fianco.

storylet:
  # ================================================================ gli ingressi, al Grifone di Ferro
  - id: turno-a-vhar-ul
    presso: grifone-di-ferro
    immagine: personaggi/dragna-gro-malog
    titolo: Un turno a Vhar'Ul
    sommario: "Il Consiglio degli Scavatori ha riaperto un sito sigillato da quarant'anni, a sud oltre gli ultimi ponti. Dragna cerca chi ci scenda."
    luogo: Locanda del Grifone di Ferro, il tavolo di Dragna
    area: ponti-sospesi
    ripetibile: true
    requisiti: [raschiatore >= 1, pista.acciaio >= 8]
    testo: |
      Sulla bacheca del Grifone, sotto la lampada che fuma, è comparso un
      foglio nuovo con la grafia larga e squadrata di Dragna. In cima c'è
      scritto *Vhar'Ul*, e sotto ci sono tre righe di nomi, due già
      cancellate. Il primo strato del Labirinto è raschiato fino all'osso, e
      il Consiglio degli Scavatori ha deciso di riaprire i siti vicini alla
      città che la Gilda dei Mercanti aveva fatto chiudere, quelli dove le
      macchine dei Precursori dormono ancora.

      Dragna è al suo tavolo con il boccale accanto ai fogli dei turni e
      l'ascia appoggiata allo schienale. Quando ti vede davanti alla bacheca
      batte due volte i monconi della mano sinistra sul legno, che fra i
      Raschiatori vuol dire *vieni qui*.

      «Vhar'Ul» dice, e ti spinge il foglio sotto il naso. «Mezza giornata
      oltre gli ultimi ponti, verso sud. Quarant'anni fa ci sono scesi quelli
      della Gilda, e ne sono tornati meno di quanti erano partiti. Si scende e
      si risale prima che faccia buio, con quello che viene via senza
      tirare.» Si gratta la nuca rasata con la penna. «E se senti battere
      dentro i muri, tu non rispondere.» Ha già intinto il pennino, e aspetta
      soltanto che tu dica di sì per scrivere.
    opzioni:
      - testo: "Chiedere della spedizione di quarant'anni fa"
        descrizione: "Dragna ha letto il rapporto di allora, e a quanto pare se lo ricorda a memoria."
        costo: 0
        esito:
          titolo: Senza urla né sangue
          testo: |
            Dragna tira fuori da sotto i fogli un quaderno con la copertina di
            tela incerata, gonfio d'umidità. «La cartografia del sottosuolo»
            dice, e lo apre a una pagina segnata con un filo d'erba secca.
            «Allora la Gilda pagava i Raschiatori a metro di mappa, e
            scendevano tutti.» A Vhar'Ul la squadra arrivò al terzo livello e
            trovò strutture che pulsavano ancora. Poi il supervisore, un certo
            Arelan Dorr, fece richiudere il cancello e scrisse due righe sole,
            che Dragna ti legge con il dito sotto le parole. *Qualcosa si muove
            dentro le pareti. Persi tre uomini senza urla né sangue*.

            «Da allora è sigillata» dice Dragna, chiudendo il quaderno. «Il
            Velo non voleva spenderci un rito, e la Gilda non voleva spenderci
            altro.»
      - testo: "Partire per Vhar'Ul"
        descrizione: "Mezza giornata a piedi oltre gli ultimi ponti, per una strada che non hai mai fatto."
        requisiti: [rovine.vhar-ul == 0]
        esito:
          titolo: Oltre gli ultimi ponti
          testo: |
            Le ultime piattaforme sospese e i ponti di corda finiscono contro
            una scarpata di basalto nero, e da lì in poi cammini su terrazze e
            crepe che fanno da sentiero. La luce passa filtrata dal cielo
            coperto, e il vento soffia basso portando un odore di ferro. Ogni
            tanto dalla roccia spuntano pilastri spezzati e anelli di metallo
            mezzi sepolti, grandi come la ruota di un mulino, che nessuno ha
            mai capito a che cosa servissero. A metà giornata il terreno si
            inclina verso sud e si apre in una conca. Ti fermi sul bordo a bere,
            e la borraccia ti trema appena nella mano.
          vai: vhar-ul
      - testo: "Tornare a Vhar'Ul"
        descrizione: "La strada la conosci, fino alla conca dove il vento si ferma."
        requisiti: [rovine.vhar-ul >= 1]
        esito:
          titolo: La conca
          testo: |
            Ripercorri le terrazze di basalto senza più contarle, e riconosci
            gli anelli di metallo mezzi sepolti uno per uno. Su quello più
            grande hai lasciato l'altra volta un sasso in equilibrio, ed è
            ancora lì. A metà giornata scendi nella conca, e il vento si ferma
            alle tue spalle sul bordo, dove si è sempre fermato. Il cancello
            dei Raschiatori è come l'hai lasciato, con la stoffa sul cardine
            della baracca.
          vai: vhar-ul
      - testo: "Andare a cavallo"
        descrizione: "Girando largo per la strada dei carri, a cavallo la conca arriva prima di mezzogiorno."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: La strada dei carri
          testo: |
            Giri intorno ai ponti per la strada dei carri e poi tagli per le
            terrazze di basalto, dove il cavallo mette gli zoccoli con una
            prudenza che ti fa vergognare un poco della tua. Sul bordo della
            conca si pianta sulle zampe e rifiuta di scendere, e ha ragione
            lui. Ha la pancia grigia di polvere di basalto e le froge bianche
            di schiuma. Lo lasci legato a un anello di metallo mezzo sepolto e
            scendi a piedi, con le sue orecchie puntate verso di te finché non
            sparisci dietro la scarpata.
          vai: vhar-ul

  - id: turno-al-laboratorio
    presso: grifone-di-ferro
    immagine: personaggi/tenebra
    titolo: Un turno al Laboratorio
    sommario: "Stasera al tavolo dei turni c'è Tenebra. Ha davanti un foglio piegato in quattro, e sopra il nome di una rovina dove le macchine prendono le misure."
    luogo: Locanda del Grifone di Ferro, il tavolo vicino alla finestra
    area: ponti-sospesi
    ripetibile: true
    requisiti: [raschiatore >= 1, pista.acciaio >= 8]
    testo: |
      Di solito al tavolo dei turni Tenebra si tiene alla larga, perché i
      fogli sono di Dragna e lei è gelosa della sua grafia. Stasera però
      Dragna è in Caserma con le reclute, e al suo posto c'è lui. Siede di
      taglio, come sempre, con il boccale che non tocca e un foglio piegato in
      quattro sotto la mano. Alla luce della lampada la bruciatura sulla
      guancia ha il riflesso del vetro.

      Quando ti siedi spiega il foglio con due dita. C'è scritto
      *Laboratorio di Calibrazione* nella grafia di Dragna, e sotto una riga
      sola di nomi. «Due giorni a sud-est, dentro la collina di vetro» dice.
      «I Precursori ci aggiustavano gli strumenti. Le macchine sono ancora
      accese, e prendono le misure a chi entra.» Fa una pausa lunga e beve
      finalmente un sorso, piccolo. «Se ti trovano storto ti raddrizzano, e
      conviene lasciarli fare.»

      Al tavolo accanto due Raschiatori giovani si confrontano le mani sotto
      la lampada. A tutti e due il Laboratorio ha limato le unghie della mano
      destra fino alla carne, e a nessuno dei due quelle della sinistra.
    opzioni:
      - testo: "Chiedere a Tenebra che cosa ci si trova"
        descrizione: "Tenebra risponde a una domanda per volta, e fra una risposta e l'altra beve."
        costo: 0
        esito:
          titolo: La misura giusta
          testo: |
            «Microbatterie, e pezzi di droni da vendere a peso al Nodo
            d'Ossidiana» dice Tenebra, e gira il boccale di un quarto sul
            tavolo. Ci pensa su abbastanza a lungo da farti credere che abbia
            finito. Poi racconta, a frasi corte separate da sorsi, di un
            Raschiatore che dieci anni fa è uscito dal Laboratorio con la
            gamba destra più corta di due dita. La sinistra se l'era rotta da
            bambino, e la macchina aveva deciso che la misura giusta era
            quella storta.

            «Zoppica ancora adesso, ma dall'altra parte» dice Tenebra, e per la
            prima volta da quando lo conosci gli vedi un angolo della bocca che
            si piega.
      - testo: "Partire per il Laboratorio"
        descrizione: "Due giorni di cammino verso sud-est, per la Superficie Fratturata."
        requisiti: [rovine.calibrazione == 0]
        esito:
          titolo: La collina di vetro
          testo: |
            Cammini due giorni verso sud-est per la Superficie
            Fratturata, fra crepe da saltare e pianori di ghiaia dove il vento
            ti riempie la bocca di polvere. Al tramonto del secondo giorno la collina compare
            all'improvviso dietro un costone. È liscia come il fondo di una
            bottiglia, e il sole ci scivola sopra senza fermarsi. Ai piedi
            della collina c'è la crepa dell'ingresso, dritta come un taglio di
            coltello, e davanti alla crepa le ceneri di un fuoco spento con
            ordine, i tizzoni allineati.
          vai: laboratorio-di-calibrazione
      - testo: "Tornare al Laboratorio"
        descrizione: "La collina di vetro si vede da lontano. Il difficile è entrarci."
        requisiti: [rovine.calibrazione >= 1]
        esito:
          titolo: Il fuoco allineato
          testo: |
            Rifai la strada verso sud-est e arrivi alla collina di vetro con
            il sole basso. Davanti alla crepa dell'ingresso ci sono le ceneri
            del tuo fuoco dell'altra volta, e qualcuno ha allineato anche i
            tuoi tizzoni, uno accanto all'altro, dal più lungo al più corto.
            Sulla ghiaia intorno non ci sono impronte oltre alle tue di
            allora. Ti tocchi le unghie della mano destra prima di entrare.
          vai: laboratorio-di-calibrazione
      - testo: "Andare a cavallo"
        descrizione: "Sui pianori di ghiaia un cavallo corre, e la collina arriva in un giorno solo."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: I pianori
          testo: |
            Il cavallo attraversa i pianori di ghiaia al trotto, saltando le
            crepe più strette senza che tu glielo chieda, e la collina di
            vetro compare prima che faccia buio. Lo leghi lontano
            dall'ingresso, dove la roccia torna normale. Gli lasci la
            borraccia mezza piena in una buca della roccia, perché non sai
            quanto starai dentro. Quando ti volti a guardarlo sta fissando la
            collina con le narici aperte, e batte uno zoccolo sulla ghiaia.
          vai: laboratorio-di-calibrazione

  - id: turno-a-mahr-kel
    presso: grifone-di-ferro
    immagine: personaggi/dragna-gro-malog
    titolo: Un turno a Mahr-Kel
    sommario: "Il foglio di Mahr-Kel sulla bacheca ha il bordo di ceralacca rossa. Dragna non lo dà a chiunque."
    luogo: Locanda del Grifone di Ferro, il tavolo di Dragna
    area: ponti-sospesi
    ripetibile: true
    requisiti: [raschiatore >= 1, pista.acciaio >= 8]
    testo: |
      Il foglio di Mahr-Kel sulla bacheca ha il bordo segnato con la
      ceralacca rossa, e sotto il nome ci sono soltanto due righe di turni.
      Dragna lo stacca dalla bacheca prima che tu finisca di leggerlo e se lo
      stende davanti sul tavolo, tenendolo fermo con la mano a tre dita.

      «Mahr-Kel» dice. «Un giorno e mezzo a sud-ovest, nelle terre basse.
      L'hanno trovato trentacinque anni fa, e la prima squadra è tornata
      indietro alla terza porta.» Gira il foglio verso di te. In fondo,
      copiata dal vecchio registro con la sua grafia squadrata, c'è la
      classificazione della Gilda, *Instabile, non rischiare ulteriori
      perdite*, e sotto Dragna ha aggiunto a penna *riaperto* e la data.

      «Là dentro le macchine fabbricano corpi» dice, con la voce roca.
      «Prendevano una bestia viva e ne tiravano fuori un'altra quasi uguale.
      Qualcosa lo fanno ancora adesso. Se vedi una cosa che ti somiglia, tu
      non fermarti a guardarla.» Batte i monconi sul tavolo una volta sola, e
      il boccale fa un saltello. «Punto, e firma qui.»
    opzioni:
      - testo: "Chiedere del Raschiatore della terza porta"
        descrizione: "Quello del nastro rosso. Dragna lo nomina come si nomina un parente."
        costo: 0
        esito:
          titolo: Il vetro della lanterna
          testo: |
            Dragna si passa la mano buona sui lati rasati della testa. «La
            porta gli ha preso il braccio fino alla spalla» dice, guardando il
            boccale invece di te. «I suoi l'hanno liberato con la sega da ossa
            e se lo sono portato dietro per mezza giornata, ma è morto prima
            di rivedere il cielo. Il nome è sul Ponte dei Morti, con la sua
            lanterna.» Fa girare il boccale sul tavolo. «Il vecchio Ferro,
            prima di me, ci andava a ogni cambio di stagione a pulirgli il
            vetro. Adesso ci vado io.» Lo dice come una cosa da segnare sui
            turni, e riprende la penna.
      - testo: "Partire per Mahr-Kel"
        descrizione: "Un giorno e mezzo verso sud-ovest, nelle terre basse, la prima volta."
        requisiti: [rovine.mahr-kel == 0]
        esito:
          titolo: Le terre basse
          testo: |
            La strada per le terre basse scende per un giorno e mezzo, e più
            scende più l'aria si fa calda e ferma. La seconda notte dormi in una
            conca dove la terra è tiepida anche al buio. All'alba trovi
            l'ingresso, una spaccatura nel terreno da cui esce un filo di
            vapore, con intorno i paletti di legno che la prima squadra aveva
            piantato per segnare il pericolo. Su uno è ancora inchiodato un
            cartello di latta, con la vernice mangiata dalla ruggine, e si legge
            soltanto *non*.
          vai: mahr-kel
      - testo: "Tornare a Mahr-Kel"
        descrizione: "La spaccatura col filo di vapore, e i paletti della prima squadra."
        requisiti: [rovine.mahr-kel >= 1]
        esito:
          titolo: Il filo di vapore
          testo: |
            Riconosci la spaccatura da lontano, per il filo di vapore che sale
            dritto nell'aria ferma. I paletti della prima squadra sono ancora
            piantati intorno, e sul cartello di latta è rimasto soltanto il
            *non*, un po' più sbiadito dell'ultima volta. Dalla spaccatura
            sale lo stesso odore di latte andato a male, e ti stringi il
            fazzoletto sul naso. Ti siedi un momento sull'orlo con le gambe
            nel vuoto, e poi scendi.
          vai: mahr-kel
      - testo: "Andare a cavallo"
        descrizione: "A cavallo le terre basse sono un giorno solo, e si dorme meno all'aperto."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: La terra tiepida
          testo: |
            A cavallo scendi nelle terre basse in un giorno solo, e arrivi
            alla spaccatura prima del buio. Il cavallo sente il vapore da
            cento passi e si pianta, sbuffando con il bianco degli occhi in
            vista. Gli parli piano finché smette di tremare, con la mano sul
            suo collo sudato. Lo lasci legato a un paletto della prima
            squadra, con la coperta sulla schiena, e lui ti guarda scendere
            tirando la corda fino in fondo.
          vai: mahr-kel

  # ================================================================ Vhar'Ul, le stanze
  - id: vhar-ul-ingresso
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'ingresso di sorveglianza
    sommario: "Un portello di metallo mezzo interrato e la baracca di sorveglianza della Gilda, rimasta com'era quarant'anni fa."
    luogo: Vhar'Ul, l'ingresso di sorveglianza
    area: vhar-ul
    ripetibile: true
    requisiti: [profondita.vhar-ul < 3]
    testo: |
      Oltre il cancello c'è un accesso di metallo mezzo interrato, chiuso da
      un portello piatto con una maniglia grande quanto un remo. Accanto, la
      baracca di sorveglianza della Gilda è rimasta com'era quarant'anni fa.
      Su un tavolo ci sono carte di logistica gonfie d'umidità e una fila di
      torce dei Precursori scariche, messe in ordine di grandezza da qualcuno
      che aveva tempo da perdere. Sopra la porta è inchiodata una targa di
      latta con le lettere dipinte a mano, *Zona chiusa per rischio residui
      energetici*, e sotto qualcuno ha aggiunto a matita *e per i costi*.

      Dal bordo del portello esce un'aria tiepida. Appoggi il palmo sul
      metallo e senti una vibrazione lenta e regolare che ti risale fino al
      gomito.
    opzioni:
      - testo: "Sollevare il portello"
        descrizione: "La maniglia è fatta per due uomini, e il portello è fermo da quarant'anni."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il sibilo
          testo: |
            Pianti i piedi ai lati della maniglia e tiri con la schiena. Il
            portello resiste a lungo e poi cede tutto insieme, con un sibilo
            d'aria che esce da sotto, e sotto c'è una scala a pioli che scende
            in una luce azzurra intermittente. Le tubature lungo la parete
            sono calde al tatto. Scendi con i palmi che bruciano per lo sforzo
            e le spalle che ti tirano fino al collo.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: La maniglia
          testo: |
            La maniglia ti sfugge a metà strada, e il portello ricade con un
            colpo che rimbomba per tutta la conca e ti schiaccia due dita
            contro il bordo. Le unghie ti diventano viola sotto gli occhi.
            Resti in ginocchio con la mano stretta sotto l'ascella ad
            aspettare che il dolore cambi colore. L'eco del colpo continua a
            tornare indietro dalla roccia molto dopo che avrebbe dovuto
            spegnersi.
          effetti: { ferite: 0.5 }
      - testo: "Studiare le carte della baracca"
        descrizione: "Una squadra della Gilda si portava sempre dietro le mappe. A volte le lasciava."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Nodo tre
          testo: |
            Fra le carte di logistica c'è una mappa dei livelli inferiori,
            leggibile per metà, con i corridoi tracciati a carboncino. In fondo,
            chiusa in un riquadro, c'è una sezione segnata *NODO 3, energia
            residua*, e dietro la baracca è disegnato un portello di servizio
            più piccolo, con una freccia. Ti infili la mappa nella camicia e
            scendi da lì, per una scala stretta che puzza di olio vecchio.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: La muffa
          testo: |
            La mappa ti si sfalda fra le dita appena provi a spiegarla, in
            scaglie molli che restano attaccate ai polpastrelli. Sotto ce n'è
            un'altra, e la muffa si è mangiata anche quella. Le scaglie verdi
            ti si attaccano alle labbra quando provi a soffiarle via. Esci
            dalla baracca con gli occhi che lacrimano per le spore e una tosse
            secca che non ti lascia fino a sera.
          effetti: { ferite: 0.5 }
      - testo: "Fare leva con il piccone"
        descrizione: "Il piccone regge di sicuro. Sul manico non giureresti."
        costo: 2
        esito:
          titolo: Il manico
          testo: |
            Infili la punta del piccone sotto il bordo del portello e ci butti
            sopra tutto il peso che hai, finché il portello si stacca con uno
            strappo e il manico ti torna indietro sullo zigomo. Scendi la scala
            a pioli con l'occhio che si gonfia e il sapore del sangue in bocca,
            mentre là sotto la luce azzurra si accende e si spegne.
          effetti: { profondita.vhar-ul: 1, ferite: 0.5 }

  - id: vhar-ul-corridoio
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il corridoio di manutenzione
    sommario: "Un tunnel in discesa rivestito di lastre che vibrano. Dietro le paratie qualcosa batte, e batte con il tuo passo."
    luogo: Vhar'Ul, il corridoio di manutenzione
    area: vhar-ul
    ripetibile: true
    requisiti: [profondita.vhar-ul < 3]
    testo: |
      Il tunnel scende per una ventina di metri, rivestito di lastre di
      metallo che vibrano a ogni passo. Sulle pareti corrono cavi spessi come
      un polso, fissati con staffe ogni due braccia, e alcuni hanno ancora
      dentro una luce che pulsa piano. A intervalli irregolari, dietro le
      paratie, si sente un colpo sordo. Qualcuno della vecchia squadra ha
      scritto un numero col gesso su ogni paratia, e dopo la dodicesima ha
      smesso di contare.

      Fai tre passi e ti fermi. Il colpo arriva un attimo dopo il tuo ultimo
      passo, come se dall'altra parte del metallo qualcuno avesse sbagliato
      il tempo. Le spalle ti salgono verso le orecchie da sole.
    opzioni:
      - testo: "Camminare fuori tempo"
        descrizione: "Se quello che batte ti segue il passo, bisogna dargli un passo impossibile da seguire."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Il ballo senza musica
          testo: |
            Cambi passo di continuo allungandolo e accorciandolo a caso,
            fermandoti quando non te lo aspetti nemmeno tu, e dietro le
            paratie i colpi provano a starti dietro e sbagliano sempre di più.
            Una volta ti scappa un passo regolare, e il colpo ti arriva dietro
            la spalla un attimo dopo. A metà corridoio smettono del tutto.
            Arrivi in fondo con la fronte bagnata e i polpacci indolenziti da
            quel ballo senza musica.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: Il passo giusto
          testo: |
            Per un tratto funziona. Poi senza accorgertene ritrovi il passo
            normale, e i colpi lo ritrovano insieme a te, sempre più vicini,
            finché una paratia si piega verso l'esterno a un palmo dalla tua
            spalla. Il metallo piegato ha la forma di un pugno. Torni su di
            corsa fino al portello, e lì resti seduto per un pezzo con le mani
            che non vogliono stare ferme.
          effetti: { tormento: 0.5 }
      - testo: "Ascoltare i colpi"
        descrizione: "Prima di decidere che cosa fare, conviene capire che cosa sono."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: L'eco
          testo: |
            Resti immobile per un minuto intero, e dietro le paratie non batte
            niente. Allora batti piano il tacco sulla lastra, e dall'altra parte
            arriva un colpo uguale, con lo stesso ritardo dell'eco nella conca.
            *Ripete quello che faccio io, e basta.* Ti togli gli stivali, te li
            leghi alla cintura per i lacci e scendi a piedi nudi sul metallo
            freddo, senza che dietro le paratie si muova più niente.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: L'orecchio sulla lastra
          testo: |
            Appoggi l'orecchio alla lastra per sentire meglio, e i colpi si
            fanno più vicini e più lenti, finché ne arriva uno proprio dietro
            la tua guancia, così forte che ti rimbomba nei denti. Per il
            resto della giornata ogni tanto lo risenti quando stai fermo, e ti
            giri a guardare il muro più vicino.
          effetti: { tormento: 0.5 }
      - testo: "Scendere di corsa senza guardare"
        descrizione: "Venti metri sono pochi, se non ti fermi."
        costo: 2
        esito:
          titolo: Fino in fondo
          testo: |
            Scendi di corsa con la testa bassa e le braccia strette al corpo, e
            i colpi ti corrono dietro paratia dopo paratia fino in fondo al
            corridoio. Lì si fermano tutti nello stesso momento. Resti a lungo
            con la schiena contro il metallo e il cuore che batte ancora con il
            loro ritmo, prima di riuscire a staccarti dal muro.
          effetti: { profondita.vhar-ul: 1, tormento: 0.5 }

  - id: vhar-ul-sala-del-nodo
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sala del nodo
    sommario: "Un reattore di sfere concentriche sospeso a mezz'aria, e un terminale che lampeggia sempre gli stessi simboli. Sul pavimento ci sono impronte di stivali e sangue secco."
    luogo: Vhar'Ul, la sala del nodo
    area: vhar-ul
    ripetibile: true
    requisiti: [profondita.vhar-ul < 3]
    testo: |
      La sala è un cilindro di metallo alto tre piani. Al centro, sospeso a
      mezz'aria senza niente che lo tenga, c'è un reattore fatto di sfere
      concentriche che girano ciascuna nel suo verso. Fra le sfere corrono
      scariche azzurre con il crepitio della legna verde nel fuoco, e
      dall'alto scende una condensa tiepida che ti bagna il collo. Il
      pavimento è pieno di impronte di stivali da scavo, e in mezzo alle
      impronte ci sono macchie scure di sangue secco che nessuno ha mai
      pulito.

      Su un terminale laterale lampeggiano simboli dei Precursori in un ordine
      che si ripete sempre uguale. Quando ti avvicini il crepitio cambia nota,
      e senti i peli delle braccia sollevarsi tutti verso il reattore.
    opzioni:
      - testo: "Leggere il terminale"
        descrizione: "I simboli si ripetono. Qualcosa vorranno dire, e forse è meglio saperlo prima di passarci davanti."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: Presenza biologica
          testo: |
            Guardi i simboli abbastanza a lungo da capire che sono misure, e
            cambiano quando ti muovi tu. Il terminale conta il tuo calore e il
            tuo respiro e prova a rifarli, e sul vetro si disegna per un
            momento una sagoma storta che ha la tua altezza. Ti tieni rasente
            il muro fuori dal suo raggio, e passi oltre prima che la sagoma
            finisca di formarsi.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: La sabbia che si alza
          testo: |
            Tocchi i simboli nell'ordine in cui lampeggiano, e il terminale
            risponde con un suono basso. Il reattore accelera, e il terminale
            smette di lampeggiare e resta acceso su un simbolo solo. Un fascio
            di luce ti passa addosso lentamente dalla testa ai piedi, e
            accanto al terminale la sabbia metallica del pavimento comincia a
            sollevarsi e a prendere la tua forma, con le braccia un po' troppo
            lunghe.
          segue: il-riflesso-distorto
      - testo: "Passare lungo il muro, fuori dalla luce"
        descrizione: "Le scariche illuminano a scatti. Fra uno scatto e l'altro c'è il buio."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Fra uno scatto e l'altro
          testo: |
            Ti muovi lungo la parete dove la luce delle scariche arriva meno,
            un passo ogni volta che il crepitio si alza, e le sfere continuano
            a girare per conto loro. Dove ti appoggi il metallo è caldo come
            la schiena di un animale. A metà strada il terminale lampeggia più
            in fretta e poi si calma. Esci dall'altra parte con la camicia
            incollata alla schiena.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: La scarica
          testo: |
            Una scarica salta dal reattore al muro proprio mentre ci passi
            davanti, e ti attraversa da una spalla all'altra. La mano ti si
            chiude a pugno da sola, e il braccio resta intorpidito fino al
            collo. Sul muro, all'altezza della tua spalla, la scarica ha
            lasciato una striscia nera. Torni indietro con il braccio che
            ciondola e l'odore dei tuoi capelli bruciati nel naso.
          effetti: { ferite: 0.5 }
      - testo: "Strisciare sotto il terminale"
        descrizione: "Il raggio del terminale non scende fino a terra. Il metallo del pavimento, però, scotta."
        costo: 2
        esito:
          titolo: Il pavimento caldo
          testo: |
            Ti metti carponi e passi sotto il terminale, dove il raggio non
            arriva, con il naso a una spanna dalle macchie di sangue secco. Il
            metallo è caldo e ti brucia i palmi, e a metà strada una scarica ti
            cade sulla schiena e ti contrae tutti i muscoli insieme. Ti rialzi
            dall'altra parte con le mani rosse e le orecchie che fischiano.
          effetti: { profondita.vhar-ul: 1, ferite: 0.5 }

  - id: il-riflesso-distorto
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il riflesso
    tipo: seguito
    luogo: Vhar'Ul, la sala del nodo
    area: vhar-ul
    testo: |
      Accanto al terminale la sabbia metallica si alza in una colonna e prende
      forma dal basso verso l'alto, finché davanti a te c'è una figura che ha
      la tua altezza e il tuo modo di inclinare la testa quando ascolti. È il
      tuo riflesso, ma ha le giunture al posto sbagliato. Il gomito si piega
      un dito sopra il punto giusto, e le ginocchia guardano un po' di lato.
      Il petto gli si alza mezzo respiro dopo il tuo, e da lui arriva un
      odore di ferro caldo.

      Alzi una mano, e lui la alza un attimo dopo. Abbassi la mano, e lui la
      abbassa un attimo prima di te. *Mi sta imparando.* Nella destra stringe
      una forma di sabbia che ricorda la tua arma, e la gira fra le dita
      nello stesso modo in cui la giri tu quando aspetti. Sopra di voi il
      reattore gira più forte, e il terminale ha smesso di lampeggiare.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "Conosce i tuoi colpi, ma li conosce in ritardo."
        combattimento: riflesso-distorto
        vittoria:
          titolo: Sabbia metallica
          testo: |
            Il riflesso risponde ai tuoi colpi sempre un attimo dopo, e quando
            provi una cosa che non hai mai fatto non sa che cosa risponderti. Al
            terzo colpo si apre in due dalla spalla al fianco e si sfa in sabbia
            metallica che ti scivola fra gli stivali, fredda. In mezzo alla
            sabbia c'è una scheggia di vetro dei Precursori, e la raccogli con
            due dita.
          effetti: { profondita.vhar-ul: 1, reliquie.scheggia: 1 }
        sconfitta:
          titolo: I tuoi colpi
          testo: |
            Il riflesso ti batte con i tuoi stessi colpi, e li riconosci tutti
            un attimo prima che arrivino. Finisci a terra contro il terminale,
            e lui resta in piedi sopra di te con la testa inclinata finché il
            reattore rallenta e la sua forma si sfa in sabbia da sola. Ti
            rialzi molto dopo, con la bocca piena di polvere di ferro.
      - testo: "Recitargli la formula dell'Esorcismo"
        descrizione: "È un'eco di Mana, e il Velo ha parole per le cose che non dovrebbero restare."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le parole storte
          testo: |
            Dici la formula del Velo a voce alta. Il riflesso apre la bocca e
            prova a ripeterla, e le parole gli escono storte, mezze sillabe di
            luce che si spengono subito. Si sfa dalla testa in giù come sabbia
            in una clessidra, e quando hai finito resta soltanto un mucchio di
            polvere di ferro accanto al terminale, che torna a lampeggiare
            tranquillo.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: La tua voce
          testo: |
            La formula ti si ferma in gola a metà, e il riflesso la finisce
            per te con la tua voce e con un attimo di ritardo. Per qualche
            respiro non sai più quale dei due ha parlato. Ti accorgi che stai
            ancora muovendo le labbra quando lui ha già smesso. Arretri fino
            alla porta senza voltargli le spalle, e lui ti guarda andare
            imitando il tuo passo all'indietro.
          effetti: { tormento: 0.5 }
      - testo: "Restare immobile finché si sfa"
        descrizione: "Se ti imita e basta, senza niente da imitare non dovrebbe durare."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Il piede addormentato
          testo: |
            Smetti di muoverti, e il riflesso smette con te. Senza niente da
            copiare comincia a perdere forma dalle dita fino ai contorni del
            viso, mentre tu conti i respiri con gli occhi fissi su un bullone
            del muro. Ci vuole tanto che ti si addormenta un piede. Gli cola
            di mano anche l'arma di sabbia, a granelli. Alla fine crolla in un
            mucchio di sabbia, e passi oltre zoppicando.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: Il naso
          testo: |
            Resisti per un minuto buono. Poi ti prude il naso e ti gratti
            senza pensarci, e il riflesso si gratta il naso un attimo prima di
            te. Ti viene da ridere e da vomitare insieme, e lui ride un attimo
            prima di te, senza suono. Esci dalla sala camminando all'indietro,
            mentre lui resta accanto al terminale a ripetere lo stesso gesto
            senza fermarsi.
          effetti: { tormento: 0.5 }
      - testo: "Scappare verso il fondo della sala"
        descrizione: "La porta in fondo è a trenta passi. Lui corre come te."
        costo: 2
        esito:
          titolo: Il gomito sbagliato
          testo: |
            Ti giri e corri verso la porta in fondo alla sala, e il riflesso ti
            corre dietro con il tuo stesso passo. Ti raggiunge sulla soglia e ti
            colpisce alla schiena con il suo gomito sbagliato, poi si ferma dove
            finisce la luce del reattore e si sfa. Prosegui piegato in due, con
            un livido che ti prende tutta la scapola.
          effetti: { profondita.vhar-ul: 1, ferite: 0.5 }

  - id: vhar-ul-pozzo-degli-anelli
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il pozzo degli anelli
    sommario: "Un pozzo verticale con anelli di metallo che girano lungo le pareti, e una vecchia scala di corda che passa in mezzo."
    luogo: Vhar'Ul, il pozzo degli anelli
    area: vhar-ul
    ripetibile: true
    requisiti: [profondita.vhar-ul < 3]
    testo: |
      Un pozzo verticale largo quanto una stanza scende nel buio, e lungo le
      pareti girano anelli di metallo grandi come ruote di carro, uno sotto
      l'altro, ciascuno con una velocità sua. La vecchia squadra della Gilda
      ci ha calato una scala di corda fissata a chiodi da roccia, e la scala
      passa fra gli anelli in un varco che si apre e si chiude a ogni giro.
      Quando due anelli si incrociano salta fra loro una scintilla bianca, e
      l'aria odora di temporale.

      Al primo piolo è legato uno spago con tre nodi. Accanto, inciso nel
      metallo con la punta di un coltello, c'è un segno che i Raschiatori
      usano ancora, una riga seguita da un punto, che vuol dire *uno per
      volta*. Ti asciughi le mani sui calzoni prima di toccare la corda.
    opzioni:
      - testo: "Scendere contando i giri"
        descrizione: "Un piolo per ogni giro dell'anello, e fermarsi quando il varco si chiude."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Ad alta voce
          testo: |
            Scendi un piolo per ogni giro dell'anello più vicino e ti fermi
            quando il varco si chiude, con la faccia a un palmo dal metallo che
            ti passa davanti. Le scintille ti cadono sulle spalle e si spengono
            sulla stoffa. In fondo al pozzo i piedi trovano una grata, e ti
            accorgi di aver contato ad alta voce per tutta la discesa.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: Il quarto anello
          testo: |
            Al quarto anello sbagli il conto. Il varco si chiude mentre hai
            ancora dentro una gamba, e l'anello ti trascina per mezzo giro
            prima di lasciarti andare contro la corda. La corda ti brucia i
            palmi fino a lasciarci due righe rosse. Risali a forza di braccia,
            con il polpaccio che brucia e il calzone strappato fino al
            ginocchio. Sull'anello che ti ha preso resta impigliato un
            brandello della tua stoffa.
          effetti: { ferite: 0.5 }
      - testo: "Studiare il ritmo degli anelli"
        descrizione: "Girano a velocità diverse. Prima o poi si troveranno d'accordo."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Dieci respiri
          testo: |
            Guardi gli anelli per un pezzo e capisci che non girano a caso. Ogni
            tanto si allineano tutti insieme e lasciano un varco dritto fino in
            fondo, per il tempo di dieci respiri. Aspetti il momento, e quando
            arriva ti lasci scivolare lungo la corda con le mani avvolte nelle
            maniche. In fondo ti tremano le braccia fino alle spalle.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: Dietro le palpebre
          testo: |
            Guardi gli anelli tanto a lungo che quando chiudi gli occhi
            continuano a girarti dietro le palpebre. Il ritmo che credevi di
            aver capito era sbagliato, e te ne accorgi quando una scintilla ti
            salta sulle dita strette alla corda. Lasci la presa e scivoli per
            due pioli prima di riprenderla, con il polso storto. Quando arrivi
            in cima il polso ti si è già gonfiato sotto la manica.
          effetti: { ferite: 0.5 }
      - testo: "Calarti lungo la parete, fuori dagli anelli"
        descrizione: "Fra la roccia e gli anelli c'è lo spazio di una persona magra. Le staffe sono arrugginite."
        costo: 2
        esito:
          titolo: Le staffe
          testo: |
            Lasci la scala e scendi lungo la parete, nello spazio stretto fra
            la roccia e gli anelli, tenendoti alle staffe arrugginite. Gli
            anelli ti passano dietro la schiena a una spanna, e ogni scintilla
            ti fa sobbalzare. A metà discesa una staffa ti resta in mano, e
            per un momento ti tieni con un braccio solo. Arrivi in fondo con
            le unghie spezzate e le ginocchia scorticate.
          effetti: { profondita.vhar-ul: 1, ferite: 0.5 }

  - id: vhar-ul-campo-della-gilda
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il campo del terzo livello
    sommario: "La sala dove la squadra della Gilda aveva piantato il campo quarant'anni fa. Le coperte sono ancora piegate."
    luogo: Vhar'Ul, il campo della vecchia squadra
    area: vhar-ul
    ripetibile: true
    requisiti: [profondita.vhar-ul < 3]
    testo: |
      Al terzo livello il corridoio si allarga in una sala bassa dove la
      squadra della Gilda aveva piantato il campo. Ci sono quattro brande con
      le coperte ancora piegate e, sopra un fornello a cristallo spento, una
      latta di gallette con il coperchio legato da uno spago. Su una lavagna
      appesa a un tubo qualcuno ha segnato con il gesso i turni di guardia.
      L'ultima riga è a metà, un nome senza l'ora accanto.

      Le coperte sono piegate ad angoli dritti come in caserma, e il cuscino
      della quarta branda ha ancora un'ammaccatura tonda. Dalle pareti arriva
      un colpo solo, e dopo più niente. Ti ritrovi a guardare quel cuscino
      come se qualcuno dovesse tornare a sdraiarcisi.
    opzioni:
      - testo: "Frugare nel campo"
        descrizione: "Quarant'anni fa la squadra se n'è andata di fretta. Qualcosa sarà rimasto."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il panno incerato
          testo: |
            Sotto la branda con il cuscino ammaccato c'è uno zaino di tela
            marcia, e dentro, avvolta in un panno incerato, una placca di
            metallo dei Precursori fitta di incisioni, che qualcuno aveva
            messo da parte per sé. Nella latta le gallette sono diventate
            polvere. Rimetti il coperchio e lo leghi di nuovo con lo spago,
            rifacendo lo stesso nodo di prima.
          effetti: { profondita.vhar-ul: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Le scolopendre
          testo: |
            Sollevi una coperta, e sotto c'è un nido di scolopendre bianche
            senza occhi che ti corrono sulla mano. Ritiri il braccio con due
            puntini rossi sul dorso, e il dorso ti si gonfia in fretta e ti
            prude fino al gomito. Le scolopendre tornano sotto la coperta in
            fila, una dietro l'altra. Rimetti la coperta com'era, piegata ad
            angoli dritti, prima di andartene.
          effetti: { ferite: 0.5 }
      - testo: "Leggere la lavagna dei turni"
        descrizione: "Una squadra segna i turni di guardia anche per sapere chi manca."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Asciutto
          testo: |
            I turni sono segnati in colonna per due settimane. Il nome
            dell'ultima riga, quello senza ora, è *Benno*, e sopra ci sono
            altri due nomi che a un certo punto smettono di comparire. Sotto
            la lavagna qualcuno ha disegnato una freccia verso un corridoio
            laterale, con accanto la parola *asciutto*. Il corridoio laterale
            è stretto e ha il pavimento di roccia viva. Lo segui e scendi dove
            il metallo non vibra più.
          effetti: { profondita.vhar-ul: 1 }
        fallimento:
          titolo: Il gesso
          testo: |
            La lavagna è scritta in una sigla di squadra che non conosci, con
            le ore segnate a tacche. Mentre provi a decifrarla il gesso ti si
            sfa sotto il dito e un pezzo di riga se ne va. Ripassi piano la
            riga con il dito, e il gesso non torna. Ti resta addosso la
            sensazione di aver cancellato un nome che qualcuno aveva lasciato
            lì apposta.
          effetti: { tormento: 0.5 }
      - testo: "Dormire un'ora su una branda"
        descrizione: "Le gambe lo chiedono. Il posto, forse, no."
        costo: 2
        esito:
          titolo: Il turno di guardia
          testo: |
            Ti stendi sulla branda più vicina alla porta con gli stivali ai
            piedi, e ti addormenti prima di deciderlo. Sogni il campo pieno di
            gente e una mano che ti scuote per il turno di guardia,
            chiamandoti con un nome che non è il tuo. Ti svegli di colpo nella
            sala vuota, con la coperta piegata sul petto ad angoli dritti, e
            non ricordi di averla presa.
          effetti: { profondita.vhar-ul: 1, tormento: 0.5 }

  # ------------------------------------------------------------ Vhar'Ul, le storie non ripetibili
  - id: la-fonte-di-energia
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sfera più piccola
    sommario: "Al centro del reattore della sala del nodo gira una sfera grande come una mela, che non fa scariche. Un uncino spezzato dice che qualcuno ci ha già provato."
    luogo: Vhar'Ul, la sala del nodo
    area: vhar-ul
    requisiti: [oggetto.fonte-di-energia == 0, profondita.vhar-ul >= 1]
    testo: |
      Torni a guardare il reattore della sala del nodo, adesso che sai dove
      mettere i piedi. Le sfere più grandi girano lente, e quella al centro,
      grande quanto una mela, gira più in fretta di tutte e non fa scariche.
      Le sfere esterne le ruotano intorno in versi opposti, e le scariche
      azzurre passano fra loro senza mai toccarla. È la sola parte del
      reattore che resta sempre uguale, con una luce bianca e ferma.

      Un Raschiatore della vecchia squadra ci ha provato prima di te. Sul
      pavimento sotto il reattore c'è un uncino da recupero con la punta
      annerita, legato a un'asta di legno spezzata a metà. L'uncino è di
      quelli che la Gilda dava alle squadre allora, con il marchio della Casa
      dei Nodi sul collare. Accanto, nel sangue secco, c'è l'impronta di una
      mano aperta. Senti nello sterno il ronzio tiepido della sfera piccola, e
      ti accorgi di guardarla da troppo tempo con la bocca socchiusa.
    opzioni:
      - testo: "Aspettare il varco e infilare l'asta"
        descrizione: "Le sfere esterne girano a velocità diverse. Ogni tanto le aperture si allineano."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il settimo giro
          testo: |
            Conti i giri delle sfere esterne finché trovi il momento in cui le
            aperture si allineano, una volta ogni sette giri. Al settimo infili
            nel varco l'asta spezzata, con l'uncino rivolto in alto, e tiri. La
            sfera piccola ti cade in mano tiepida e più pesante di quanto
            pensassi, e il reattore rallenta fino a un ronzio basso senza
            spegnersi. Te la metti sotto la camicia, e il tepore ti arriva fino
            alla pancia.
          effetti: { oggetto.fonte-di-energia: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: L'asta strappata
          testo: |
            Allunghi l'asta nel momento sbagliato, e una sfera esterna la
            prende e te la strappa di mano. La scarica che arriva dopo ti
            risale per il braccio e ti butta seduto per terra, accanto
            all'impronta della mano. Il ronzio della sfera piccola non è
            cambiato di una nota. Resti lì a guardarti le dita che si muovono
            da sole, e l'asta rotola nel buio sotto il terminale.
          effetti: { ferite: 0.5 }
      - testo: "Allungare la mano fra le sfere"
        descrizione: "Una mano è più svelta di un'asta. Se il giro lo sbagli, però, è anche più cara."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Difficile }
        successo:
          titolo: Fra le sfere
          testo: |
            Ti tiri su la manica fino alla spalla e aspetti con il braccio
            teso, finché le sfere esterne ti aprono un corridoio. Infili la
            mano, chiudi le dita sulla sfera piccola e le ritiri tutte
            insieme, e una scarica ti passa così vicino al gomito che ti si
            drizzano i peli. La sfera ti ronza nel pugno come un gatto
            addormentato. Te la metti sotto la camicia, contro la pelle.
          effetti: { oggetto.fonte-di-energia: 1 }
          pe: { acrobazia: 5 }
        fallimento:
          titolo: L'impronta
          testo: |
            Le sfere si richiudono di colpo mentre hai ancora dentro il polso.
            La scarica ti attraversa il braccio e ti butta all'indietro sul
            pavimento, con la mano aperta nel sangue secco, accanto
            all'impronta dell'altro. Per un'ora le dita ti restano piegate ad
            artiglio, e quando tornano a muoversi tremano. Sul pavimento,
            accanto alla prima, adesso c'è anche l'impronta della tua mano.
          effetti: { ferite: 1 }
      - testo: "Bloccare le sfere con il manico del piccone"
        descrizione: "Un manico di frassino fra le sfere le ferma per un momento. Il frassino conduce poco, ma qualcosa conduce."
        costo: 2
        esito:
          titolo: Il frassino
          testo: |
            Pianti il manico del piccone fra le sfere esterne e ci butti sopra
            il tuo peso. Il reattore si inceppa con un rumore di denti, e la
            scarica corre lungo il frassino e ti entra nelle mani. Con le
            braccia che tremano strappi la sfera piccola dal suo posto, e
            quando lasci il manico il reattore riprende a girare più lento di
            prima. Hai i palmi neri e lucidi, e la sfera sotto la camicia è
            tiepida.
          effetti: { oggetto.fonte-di-energia: 1, ferite: 1 }

  - id: il-raschiatore-dietro-la-paratia
    immagine: ambientazione/rovine-dei-precursori
    titolo: La paratia saldata
    sommario: "A metà del corridoio di manutenzione c'è una paratia senza numero, saldata al telaio. È l'unica che resta zitta quando passi."
    luogo: Vhar'Ul, il corridoio di manutenzione
    area: vhar-ul
    requisiti: [rovine.dorr == 0, profondita.vhar-ul >= 1]
    testo: |
      A metà del corridoio di manutenzione c'è una paratia diversa dalle
      altre. È più stretta, senza il numero di gesso, e lungo il bordo ha una
      colata di metallo fuso che la salda al telaio, il lavoro sbrigativo di
      una torcia da scavo. Nella saldatura è premuto il sigillo dei
      Raschiatori, una lanterna dentro un cerchio, e la ceralacca è colata
      verso il corridoio attraverso la fessura, prima che il metallo si
      raffreddasse. Sopra il sigillo qualcuno ha inciso con la punta di un
      coltello una data di quarant'anni fa. Il sigillo l'hanno messo
      dall'altra parte.

      Avvicini l'orecchio. È l'unica paratia del corridoio che resta zitta
      quando ti muovi, e dalla fessura in basso esce un odore secco di cuoio
      vecchio che ti ricorda la soffitta di tua nonna.

      *Qualcuno si è chiuso dentro da solo, e da lì non è più uscito.* Le
      dita ti vanno al piccone per conto loro.
    opzioni:
      - testo: "Aprire la saldatura dove è più sottile"
        descrizione: "Una saldatura fatta di fretta ha sempre un punto debole."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Arelan Dorr
          testo: |
            Trovi il punto dove la colata è più sottile e ci lavori di punta
            finché la saldatura cede con uno schiocco. La paratia si scosta di
            un palmo. Nella luce azzurra del corridoio vedi un Raschiatore
            seduto per terra, con la schiena al muro e la testa reclinata su
            una spalla, ancora nella sua tuta da lavoro. L'aria secca l'ha
            conservato, e la pelle gli si è tirata sulle ossa come carta da
            pacchi. Tiene in grembo un taccuino, e al collo una piastrina
            d'ottone incisa a punzone, *ARELAN DORR, SUPERVISORE*.

            Nel taccuino c'è una pagina sola scritta, con tre nomi in colonna e
            nessun segno accanto. Stacchi la piastrina e la avvolgi nel
            fazzoletto.
          imposta: { rovine.dorr: 1 }
        fallimento:
          titolo: Il dorso della mano
          testo: |
            La colata è più dura di quanto sembrava. La punta del piccone ci
            scivola sopra e ti porta la mano contro lo spigolo della paratia,
            che ti apre il dorso fino alle nocche, e il sangue ti cola fra le
            dita fino al polso. Sulla saldatura resta appena un graffio. Ti
            fasci la mano con un lembo di camicia, e dall'altra parte del
            metallo continua a non sentirsi niente.
          effetti: { ferite: 0.5 }
      - testo: "Forzarla con la spalla"
        descrizione: "Il telaio è vecchio quanto la saldatura, e il metallo stanco cede."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La piastrina
          testo: |
            Al terzo colpo di spalla il telaio si piega e la saldatura si apre
            in una crepa lunga. Dentro, seduto per terra con la schiena al
            muro, c'è un Raschiatore in tuta da lavoro, seccato dall'aria fino
            a diventare leggero come un fascio di legna. Tiene in grembo un
            taccuino aperto su una pagina con tre nomi in colonna, senza
            nessun segno accanto. Al collo ha una piastrina d'ottone incisa a
            punzone, *ARELAN DORR, SUPERVISORE*. La sfili dalla catenella e la
            avvolgi nel fazzoletto.
          imposta: { rovine.dorr: 1 }
        fallimento:
          titolo: La spalla
          testo: |
            Al terzo colpo di spalla è la spalla a cedere per prima. La
            paratia rimbomba come una campana, e dietro tutte le altre paratie
            del corridoio i colpi rispondono insieme, e ci vuole un pezzo
            prima che il corridoio torni zitto. Quella saldata resta muta e intatta, e tu ti siedi per
            terra a massaggiarti il braccio.
          effetti: { ferite: 0.5 }
      - testo: "Spaccare la saldatura a colpi di piccone"
        descrizione: "Prima o poi cede. Il rumore, nel frattempo, arriva dappertutto."
        costo: 2
        esito:
          titolo: Il taccuino
          testo: |
            Picchi sulla saldatura finché le braccia ti formicolano fino alle
            spalle, e dietro le altre paratie i colpi ti rispondono uno per
            uno. Alla fine il metallo cede. Dentro c'è un Raschiatore in tuta
            da lavoro seduto per terra, conservato dall'aria secca, con un
            taccuino in grembo dove sono scritti tre nomi senza nessun segno
            accanto. Al collo ha una piastrina d'ottone, *ARELAN DORR,
            SUPERVISORE*. Te la metti in tasca con le mani che ancora tremano
            per i colpi.
          imposta: { rovine.dorr: 1 }
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ Vhar'Ul, il cuore
  - id: la-sezione-sigillata
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sezione sigillata
    sommario: "Il nodo tre della vecchia mappa, dietro un portello deformato. Il pavimento è fuso, e in mezzo alla sala c'è qualcosa che indossa una tuta da Raschiatore."
    luogo: Vhar'Ul, il nodo tre
    area: vhar-ul
    requisiti: [profondita.vhar-ul >= 3]
    testo: |
      Dietro un portello deformato, piegato verso l'esterno, comincia la
      sezione segnata sulla vecchia mappa come nodo tre. Il pavimento qui è
      diverso. Le lastre di metallo sono fuse e scurite, colate le une nelle
      altre in onde rigide che scricchiolano sotto le suole. L'aria vibra e ti
      fa formicolare i denti, e sul soffitto girano decine di sfere più
      piccole di quelle del reattore, lente, con un ronzio costante.

      In mezzo alla sala c'è un costrutto incompleto, attaccato a cavi che
      entrano nel muro. È per metà di metallo e per metà di carne mummificata,
      e addosso ha i resti di una tuta da Raschiatore, cucita alla carne con
      un filo di rame. Si muove appena, come un animale ferito. Quando sposti
      un piede sulla crosta di metallo, la sua testa si gira verso il rumore
      con un gracchiare di ingranaggi.

      Sul petto della tuta, scolorita ma leggibile, c'è una toppa con un nome
      ricamato in filo rosso, *Benno*, e ti accorgi che trattieni il fiato da
      quando hai passato il portello.
    opzioni:
      - testo: "Affrontare il Residuo"
        descrizione: "È lento, ma i cavi lo tengono in piedi. Finché sono attaccati al muro, si rialza."
        combattimento: residuo-di-vhar-ul
        vittoria:
          titolo: Tre sillabe
          testo: |
            Il Residuo è lento, ma i cavi lo tirano su ogni volta che cade, e
            ogni volta le sfere sul soffitto girano più forte. Lo abbatti
            soltanto quando tagli i cavi alla base del muro. Allora si accascia
            sulla crosta di metallo, e dalla gola gli escono tre sillabe in una
            lingua che non conosci. Dalle sfere che si fermano stacchi un
            cristallo carico e due placche incise. Risalendo il corridoio di
            manutenzione le luci azzurre si spengono una dopo l'altra alle tue
            spalle, fino al portello.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { cristalli.cristallo-carico: 1, reliquie.frammento-inciso: 2, rep.raschiatori: 0.5 }
          vai: ponti-sospesi
        sconfitta:
          titolo: Lo stivale
          testo: |
            I cavi ti si avvolgono intorno a una caviglia e ti tirano giù sulla
            crosta di metallo, e il Residuo ti è sopra con il suo peso di carne
            secca e di ferro. Ti liberi lasciandogli lo stivale. Risali il
            corridoio di manutenzione con un piede scalzo e le luci azzurre che
            si spengono una dopo l'altra alle tue spalle, e arrivi in cima a
            mani vuote.
          imposta: { rovine.vhar-ul: 1 }
          vai: ponti-sospesi
      - testo: "Recitargli la formula dell'Esorcismo"
        descrizione: "Sotto il metallo c'è un uomo che non ha mai avuto un rito. Il Velo ne ha uno, ma i cavi continuano a tirarlo su, e le parole vanno dette fino in fondo."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il filo di rame
          testo: |
            Dici sopra di lui la formula del Velo per i morti che non
            riposano, piano, con la voce che si incrina al nome dell'Albero.
            Il Residuo si ferma a metà di un gesto. La carne secca si stacca
            dal metallo a scaglie e il filo di rame cede punto per punto,
            finché resta soltanto la macchina, che senza di lui crolla in un
            mucchio di pezzi. Dalle sfere ferme stacchi un cristallo carico e
            due placche incise, e la toppa con il nome te la metti in tasca.
            Uscendo, le luci si spengono una dopo l'altra dietro di te.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { cristalli.cristallo-carico: 1, reliquie.frammento-inciso: 2, rep.raschiatori: 0.5 }
          pe: { magia: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: La formula spezzata
          testo: |
            La formula ti si spezza in bocca, e il filo di rame sul petto del
            Residuo luccica nella luce delle sfere, e le parole che non hai
            finito ti restano in testa a girare con il ronzio. Il Residuo si
            solleva tutto insieme sui cavi e ti prende al petto con il braccio
            di metallo, e ti salvi soltanto buttandoti all'indietro oltre il
            portello. Risali il corridoio di
            corsa con le luci che si spengono alle tue spalle, e porti fuori
            due schegge strappate al bordo del pavimento fuso.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { reliquie.scheggia: 2, ferite: 1, tormento: 1 }
          vai: ponti-sospesi
      - testo: "Staccare i cavi senza fare rumore"
        descrizione: "Sente i passi. Lungo il muro il pavimento non è fuso, e i cavi entrano nel muro proprio lì."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: I cavi
          testo: |
            Giri lungo il muro, dove le lastre sono ancora lisce, e metti i
            piedi soltanto quando le sfere sul soffitto ronzano più forte. Il
            Residuo gira la testa a scatti, sempre verso il punto dove eri
            prima. Stacchi i cavi dal muro uno alla volta, e a ogni cavo lui
            si affloscia un poco di più, finché resta seduto sulla crosta di
            metallo e non si muove. Dalle sfere ferme prendi un cristallo
            carico e due placche incise, e risali con le luci che si spengono
            alle tue spalle.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { cristalli.cristallo-carico: 1, reliquie.frammento-inciso: 2, rep.raschiatori: 0.5 }
          pe: { furtivita: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: La lastra
          testo: |
            Una lastra fusa ti scricchiola sotto lo stivale, e il Residuo si
            gira e ti viene incontro trascinando i cavi. Ti prende in pieno sul
            fianco con il braccio di metallo mentre corri verso il portello, e
            senti qualcosa cedere sotto la giubba. Alle tue spalle le sfere
            girano più forte. Risali il corridoio
            tenendoti il fianco, con le luci che si spengono una dopo l'altra
            dietro di te, senza aver preso niente.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { ferite: 2 }
          vai: ponti-sospesi
      - testo: "Fermare le sfere del soffitto"
        descrizione: "Quando il Residuo si muove le sfere girano più forte. Forse funziona anche al contrario."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Il pannello
          testo: |
            Accanto al portello c'è un pannello con una fila di incavi, e ogni
            incavo si illumina quando una sfera passa sopra di lui. Ci metti
            il pollice uno dopo l'altro nell'ordine giusto, e le sfere
            rallentano fino a fermarsi. Il Residuo si affloscia sui suoi cavi
            nello stesso momento. Prendi dalle sfere un cristallo carico e due
            placche incise, e risali con le luci che si spengono a una a una
            alle tue spalle.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { cristalli.cristallo-carico: 1, reliquie.frammento-inciso: 2, rep.raschiatori: 0.5 }
          pe: { tecnologia: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: L'incavo sbagliato
          testo: |
            Premi l'incavo sbagliato con tutto il pollice, e le sfere
            accelerano tutte insieme con un fischio che ti entra nelle
            orecchie. Il Residuo si alza sui cavi e avanza verso il portello
            più svelto di prima, gracchiando a ogni passo, e ti raggiunge
            mentre hai ancora il pollice sul pannello. Il braccio di metallo
            ti sbatte contro il portello. Scappi su per il corridoio con le
            luci che si spengono alle tue spalle e il fischio che ti segue fino
            al cancello.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { ferite: 1.5, tormento: 0.5 }
          vai: ponti-sospesi
      - testo: "Prendere quello che c'è vicino al portello"
        descrizione: "Sul bordo del pavimento fuso qualcosa si stacca. Il resto lo lasci a lui."
        costo: 2
        esito:
          titolo: La schiena contro il portello
          testo: |
            Resti sulla soglia, dove il pavimento comincia a fondersi, e
            strappi dal bordo due schegge dei Precursori ancora calde. Il
            Residuo gira la testa verso ogni rumore che fai, e alla fine si
            trascina verso di te sui cavi. Richiudi il portello deformato con
            una spalla e ci tieni la schiena contro finché il gracchiare si
            allontana. Risali con le luci che si spengono una dopo l'altra
            alle tue spalle.
          imposta: { rovine.vhar-ul: 1 }
          effetti: { reliquie.scheggia: 2, ferite: 0.5 }
          vai: ponti-sospesi

  # ================================================================ il Laboratorio di Calibrazione, le stanze
  - id: laboratorio-camera-acustica
    immagine: ambientazione/rovine-dei-precursori
    titolo: La camera di test acustico
    sommario: "Una stanza cubica che restituisce ogni suono tre volte più forte, e al centro un dispositivo appeso a due fili."
    luogo: Laboratorio di Calibrazione, la camera di test acustico
    area: laboratorio-di-calibrazione
    ripetibile: true
    requisiti: [profondita.laboratorio-di-calibrazione < 3]
    testo: |
      È una stanza cubica dalle pareti perfettamente lisce, senza un angolo
      smussato. Ogni suono che fai torna indietro più forte di come è
      partito, e quando ti schiarisci la gola la stanza ti restituisce un
      colpo di tosse tre volte più grosso del tuo. Al centro, su un
      piedistallo, pende da due fili un dispositivo rotto, che oscilla appena
      a ogni rumore.

      Sul pavimento davanti alla porta d'uscita qualcuno ha lasciato un
      cappello di feltro rovesciato, con dentro una manciata di cotone. Il
      dispositivo adesso è fermo, con i fili tesi. Ti si stringe la gola nello
      sforzo di non deglutire.
    opzioni:
      - testo: "Attraversarla senza un rumore"
        descrizione: "Sulle calze, piano, respirando con la bocca."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Sulle calze
          testo: |
            Ti togli gli stivali e attraversi la stanza sulle calze,
            appoggiando prima il tallone e poi il resto del piede, con la
            bocca aperta per non fischiare dal naso. Il dispositivo resta
            fermo sui suoi fili. Dall'altra parte ti rimetti gli stivali per
            terra, e soltanto allora ti accorgi di non aver respirato davvero
            per tutta la traversata. Prima di andare prendi il cotone dal
            cappello di feltro e te ne infili un batuffolo per orecchio.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: Il ginocchio
          testo: |
            A metà stanza ti scricchiola il ginocchio. La stanza raccoglie lo
            scricchiolio e lo rimanda indietro moltiplicato, e il dispositivo
            risponde con un colpo sordo che ti entra nel petto e ti piega in
            due. Il dispositivo oscilla ancora a lungo sui suoi fili. Per
            un'ora senti soltanto un fischio acuto, e i tuoi stessi passi ti
            arrivano come da dietro un vetro.
          effetti: { ferite: 0.5 }
      - testo: "Cercare il punto dove il suono si spegne"
        descrizione: "Una stanza fatta per amplificare avrà pure un difetto da qualche parte."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La parete di sinistra
          testo: |
            Batti piano le dita sul muro accanto alla porta e ascolti come
            torna il suono, poi ti sposti di un passo e riprovi. Lungo la
            parete di sinistra il suono torna più debole invece che più forte.
            Il cappello di feltro, davanti alla porta, è dalla stessa parte.
            Passi rasente il muro con una spalla contro il metallo, e il
            dispositivo sul piedistallo non si muove nemmeno.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: Il colpo sordo
          testo: |
            Batti le dita sul muro, e il suono torna indietro tre volte, e
            alla terza è più forte della prima. Il dispositivo si accende con
            un colpo sordo che ti rovescia all'indietro fino alla porta. Ti
            rialzi con un filo di sangue caldo che ti cola da un orecchio,
            nella stanza di nuovo muta. Sulla soglia ci sono altre gocce di
            sangue vecchio, più scure delle tue.
          effetti: { ferite: 0.5 }
      - testo: "Appoggiarti il modulo sul petto"
        descrizione: "La piastra presa nel magazzino mangia il rumore dei passi. Questa stanza è fatta per lei."
        requisiti: [oggetto.modulo-di-isolamento >= 1]
        esito:
          titolo: La neve
          testo: |
            Ti appoggi sul petto la piastra fredda del modulo di isolamento, e
            il rumore dei tuoi passi sparisce come se camminassi nella neve.
            Attraversi la stanza senza fretta, e a metà ti tocchi le orecchie
            per sapere se ci senti ancora. Il dispositivo resta immobile sui
            suoi fili, e dall'altra parte ti accorgi che per tutto il tempo
            hai sorriso.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
      - testo: "Tapparti le orecchie e correre"
        descrizione: "Le orecchie tappate ti salvano i timpani. Il petto, no."
        costo: 2
        esito:
          titolo: Una squadra intera
          testo: |
            Ti cacci le dita nelle orecchie e corri. La stanza moltiplica i
            tuoi passi finché sembrano quelli di una squadra intera, e il
            dispositivo ti risponde con un colpo sordo nel petto proprio
            mentre arrivi alla porta. Il cappello di feltro ti rotola via fra
            i piedi. Dall'altra parte resti a lungo in ginocchio, con le
            orecchie che fischiano e il cuore che non trova il ritmo.
          effetti: { profondita.laboratorio-di-calibrazione: 1, ferite: 0.5 }

  - id: laboratorio-taratura-termica
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sala di taratura termica
    sommario: "Una sala fredda come una ghiacciaia, con cerchi di metallo sul pavimento. Una voce dice sempre la stessa frase."
    luogo: Laboratorio di Calibrazione, la sala di taratura termica
    area: laboratorio-di-calibrazione
    ripetibile: true
    requisiti: [profondita.laboratorio-di-calibrazione < 3]
    testo: |
      L'aria della sala è fredda come in una ghiacciaia, e il fiato ti esce in
      nuvole. Sul pavimento ci sono cerchi di metallo grandi come piatti da
      portata e disposti a scacchiera. Fra un cerchio e l'altro il metallo è
      coperto di brina. Lungo le pareti corrono condotti con le griglie
      aperte. Qui i Precursori provavano quanto freddo e quanto caldo
      reggessero i loro droni prima di guastarsi.

      Appena metti piede nella sala ti passa addosso un raggio che non si
      vede, e te ne accorgi soltanto perché ti si drizzano i peli delle
      braccia. Una voce di metallo dice una frase breve nella lingua dei
      Precursori, e sotto i tuoi piedi il cerchio più vicino comincia a
      cambiare colore.
    opzioni:
      - testo: "Saltare da un cerchio spento all'altro"
        descrizione: "I cerchi con la brina sono freddi. Per ora."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Le suole fumanti
          testo: |
            Capisci che i cerchi si accendono uno alla volta, prima quello
            sotto di te e poi i vicini, e allora non ti fermi più. Salti da un
            cerchio all'altro scegliendo sempre quelli con la brina, e dietro
            di te il metallo sfrigola e poi scricchiola di gelo. Una volta
            atterri con un piede solo sul bordo, e la brina ti fa scivolare.
            Arrivi in fondo con le caviglie indolenzite e le suole che fumano.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: Il cerchio sbagliato
          testo: |
            Salti sul cerchio sbagliato. Sotto la suola il metallo si scalda
            in un attimo, e l'odore del cuoio bruciato ti arriva al naso prima
            del dolore. Ti si gonfia sotto la pianta una vescica larga come
            una moneta, e dietro di te la voce di metallo ripete la sua frase.
            Torni indietro saltellando su un piede, e per il resto della
            giornata cammini sul bordo della pianta.
          effetti: { ferite: 0.5 }
      - testo: "Restare sul cerchio e lasciar fare alla macchina"
        descrizione: "Tenebra ha detto di lasciarli fare. Bisogna vedere quanto si regge."
        prova: { attributo: mentale, abilita: [resilienza, medicina], difficolta: Media }
        successo:
          titolo: La camicia che fuma
          testo: |
            Resti immobile sul cerchio e lasci fare. Il freddo ti sale dalle
            suole alle ginocchia e poi cambia di colpo, diventa un calore che
            ti bagna di sudore la schiena, e alla fine torna tiepido. La voce
            dice un'altra frase più corta, e il cerchio si spegne. Attraversi
            la sala sui cerchi spenti con la camicia fradicia che fuma nel
            freddo.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: I piedi
          testo: |
            Il freddo ti sale dalle suole alle ginocchia e lì resta. Le dita
            dei piedi smettono di farsi sentire, e dopo le dita le caviglie.
            La voce intanto ripete la sua frase, sempre uguale. Quando ti
            decidi a scendere dal cerchio cadi in avanti sulle mani. Esci
            dalla sala a quattro zampe, e ci vuole un'ora prima che i piedi
            tornino a essere tuoi.
          effetti: { ferite: 0.5 }
      - testo: "Attraversarla di corsa"
        descrizione: "Un cerchio caldo e uno freddo. Sotto le suole, dopo un po', non fa differenza."
        costo: 2
        esito:
          titolo: Le vesciche
          testo: |
            Corri dritto in mezzo alla sala, e i cerchi si accendono uno dopo
            l'altro sotto i tuoi piedi, ora roventi ora gelati. La voce di
            metallo ti insegue con la sua frase fino alla porta. A metà strada
            non sai più quale dei due ti stia bruciando. Arrivi in fondo con
            le suole spaccate e le piante dei piedi coperte di vesciche. Ti
            togli gli stivali e prosegui scalzo sul metallo liscio del
            corridoio.
          effetti: { profondita.laboratorio-di-calibrazione: 1, ferite: 0.5 }

  - id: laboratorio-scansione-chimica
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il corridoio di scansione chimica
    sommario: "Un corridoio stretto con le pareti bucate da migliaia di forellini. Per terra c'è un fazzoletto bagnato accanto a una borraccia vuota."
    luogo: Laboratorio di Calibrazione, il corridoio di scansione chimica
    area: laboratorio-di-calibrazione
    ripetibile: true
    requisiti: [profondita.laboratorio-di-calibrazione < 3]
    testo: |
      È un corridoio stretto e lungo, così dritto che dall'imbocco vedi la
      porta in fondo piccola come un'unghia, e ci si passa soltanto di lato,
      con le spalle che sfiorano le due pareti. Le pareti sono bucate da
      migliaia di forellini, e ogni tanto fra i fori c'è una ventola grande
      come una moneta che gira piano senza fare vento. Servivano a lavare i
      droni che rientravano da fuori.

      Per terra, a una decina di passi dall'imbocco, ci sono un fazzoletto di
      cotone bagnato e una borraccia vuota. Chi è passato prima di te si è
      legato quel fazzoletto sulla bocca. Annusi l'aria e non senti niente, e
      questo ti mette più a disagio di un cattivo odore.
    opzioni:
      - testo: "Passare trattenendo il fiato"
        descrizione: "Sono cinquanta passi di lato. I polmoni dovrebbero bastare."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il mantice
          testo: |
            Ti riempi i polmoni all'imbocco e parti di lato, a passi svelti. A
            metà corridoio i forellini si accendono e soffiano una nebbia fine
            e fredda che ti si posa sulle ciglia, con un leggero odore di
            sapone. Tieni il fiato fino alla porta e lo butti fuori dall'altra
            parte con un rumore da mantice, la fronte appoggiata al muro.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: Il sapone
          testo: |
            A tre quarti del corridoio il fiato ti finisce. Respiri la nebbia,
            e ha un sapore di sapone e di ferro che ti resta sulla lingua.
            Torni indietro di corsa fino all'imbocco, dove lo stomaco ti si
            rivolta, e passi un quarto d'ora in ginocchio a vomitare l'acqua
            che avevi bevuto. Poi ti sciacqui la bocca con l'ultima acqua
            della borraccia, e il sapore resta lo stesso.
          effetti: { ferite: 0.5 }
      - testo: "Capire quando soffiano"
        descrizione: "Le ventole girano sempre. Forse non sempre alla stessa velocità."
        prova: { attributo: mentale, abilita: [tecnologia, medicina], difficolta: Media }
        successo:
          titolo: Tre respiri
          testo: |
            Le ventole rallentano tutte insieme un attimo prima che i
            forellini soffino, e restano lente per il tempo di tre respiri.
            Bagni il fazzoletto con l'acqua della tua borraccia, te lo leghi
            sulla bocca e passi un tratto alla volta, fermandoti dove le
            ventole sono rotte. Il fazzoletto di chi è passato prima resta per
            terra dove l'hai trovato. Arrivi in fondo con gli occhi che
            bruciano appena.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: In pieno viso
          testo: |
            Credi di aver capito il ritmo, e la nebbia ti arriva addosso a
            metà strada, in pieno viso. Gli occhi ti si riempiono di lacrime e
            la gola ti si chiude, e le palpebre ti si incollano tanto che devi
            aprirle con le dita. Torni indietro a tentoni, con le mani sulle
            pareti, e ti ci vuole un pezzo prima di vedere di nuovo bene.
          effetti: { ferite: 0.5 }
      - testo: "Coprirti la faccia e andare"
        descrizione: "Con il fazzoletto di quello di prima, che è ancora bagnato."
        costo: 2
        esito:
          titolo: Il fazzoletto
          testo: |
            Raccogli il fazzoletto da terra e te lo leghi sulla bocca, e sa
            ancora del fiato di qualcun altro. Passi di lato più in fretta che
            puoi. La nebbia ti arriva addosso due volte e ti punge gli occhi e
            le labbra. Dall'altra parte ti siedi contro il muro, con la testa
            che gira e un formicolio sulla lingua che non passa.
          effetti: { profondita.laboratorio-di-calibrazione: 1, ferite: 0.5 }

  - id: laboratorio-magazzino
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il magazzino dei componenti
    sommario: "Scaffali fino al soffitto pieni di pezzi dalle forme impossibili, e in un angolo un mucchio di droni spenti. Uno, a quanto pare, morde."
    luogo: Laboratorio di Calibrazione, il magazzino
    area: laboratorio-di-calibrazione
    ripetibile: true
    requisiti: [profondita.laboratorio-di-calibrazione < 3]
    testo: |
      È la sala più grande che hai visto qui sotto. Le pareti sono coperte di
      scaffali fino al soffitto, e sugli scaffali ci sono cassette di metallo
      piene di componenti dalle forme impossibili, pezzi che hanno più facce
      di quante l'occhio riesca a contarne e ingranaggi che girano anche da
      fermi. Quasi tutte le cassette sono state aperte e svuotate dalle altre
      squadre. Sui ripiani più alti, alcune sono ancora sigillate.

      In un angolo c'è un mucchio di droni spenti caduti dal soffitto, grandi
      come gatti, con le pale piegate e l'occhio di vetro opaco. Uno ha una
      piccola croce di vernice rossa sul dorso, e accanto qualcuno ha scritto
      col gesso *attenzione, morde*. Ti viene da ridere, e poi smetti.
    opzioni:
      - testo: "Aprire le cassette sigillate"
        descrizione: "Sui ripiani alti, dove le altre squadre non sono arrivate."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Microbatterie
          testo: |
            Ti arrampichi sugli scaffali fino ai ripiani alti, e su una
            cassetta trovi il fermo nascosto sotto il bordo, una linguetta
            sottile come un'unghia. Dentro, in un letto di schiuma grigia, ci
            sono microbatterie dei Precursori, cilindretti tiepidi grandi come
            un dito. La schiuma conserva le impronte di quelle già prese,
            sette buchi tondi in fila. Ne prendi una e richiudi il resto per
            la prossima squadra.
          effetti: { profondita.laboratorio-di-calibrazione: 1, cella: 1 }
        fallimento:
          titolo: Il coperchio
          testo: |
            La cassetta si apre di scatto mentre ti tieni ancora allo scaffale
            con una mano, e il coperchio ti prende in piena fronte. Cadi giù
            per due ripiani e atterri di schiena sul mucchio di droni. Quello
            con la croce rossa si accende, ti guarda con l'occhio di vetro e
            si spegne di nuovo. In fronte ti cresce un bernoccolo grosso come
            un uovo di quaglia.
          effetti: { ferite: 0.5 }
      - testo: "Smontare i droni spenti"
        descrizione: "Al Nodo d'Ossidiana le parti di drone le comprano a peso. Quello con la croce rossa lo lasci stare."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: A peso
          testo: |
            Rovesci il mucchio con il piede e cominci a staccare pale e anelli
            dai droni spenti, puntando il ginocchio sulle carcasse per fare
            leva. Il metallo dei Precursori non vuole saperne di piegarsi, e ti
            ci vuole tutta la forza che hai. Alla fine hai la bisaccia pesante e
            le mani nere, e un occhio di vetro che si accende se lo scuoti.
          effetti: { profondita.laboratorio-di-calibrazione: 1, bottino.parti-di-drone: 1 }
        fallimento:
          titolo: Morde
          testo: |
            Il drone che afferri per la pala è quello con la croce rossa, che
            era finito sotto gli altri. Si accende di colpo e ti chiude le
            pale sulla mano come una tagliola, e lo stacchi soltanto
            sbattendolo contro lo scaffale. Il drone resta per terra a girare
            su se stesso, con le pale aperte. Esci dal magazzino con tre dita
            fasciate, dando ragione alla scritta col gesso.
          effetti: { ferite: 0.5 }
      - testo: "Prendere la piastra che mangia i suoni"
        descrizione: "Su un ripiano basso c'è una cassetta foderata di un materiale che non fa eco. Dentro, qualcosa di piatto."
        requisiti: [oggetto.modulo-di-isolamento == 0]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il modulo di isolamento
          testo: |
            La cassetta ha due fermi, e capisci che vanno aperti insieme.
            Dentro c'è una piastra grande come un palmo, opaca, con il bordo
            zigrinato. Quando la prendi in mano il rumore dei tuoi passi
            sparisce, e anche il fruscio della manica sul fianco. Ti volti
            verso il mucchio di droni e non senti nemmeno il cigolio dello
            scaffale. La appoggi sul petto e senti il battito del tuo cuore
            farsi lontano.
          effetti: { profondita.laboratorio-di-calibrazione: 1, oggetto.modulo-di-isolamento: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: I due fermi
          testo: |
            Apri un fermo alla volta, e al secondo la cassetta si richiude da
            sola con uno scatto che ti pizzica la punta delle dita. Dentro
            resta la piastra, e il fermo adesso è bloccato. Dal fermo bloccato
            esce un ronzio sottile che si spegne dopo un po'. Ti succhi le
            dita guardando la cassetta, e ti riprometti di tornare con più
            calma.
          effetti: { ferite: 0.5 }
      - testo: "Riempire la bisaccia alla cieca"
        descrizione: "Quello che c'è sui ripiani bassi, senza stare a scegliere. Qualcosa varrà pure."
        costo: 2
        esito:
          titolo: L'ingranaggio
          testo: |
            Prendi quello che trovi sui ripiani bassi senza scegliere e lo
            butti nella bisaccia, finché un ingranaggio che gira da fermo ti
            prende un dito e te lo stringe fino all'osso. Lo stacchi tirando,
            e la pelle viene via con lui. Il drone con la croce rossa ti segue
            con l'occhio di vetro mentre passi. Esci dal magazzino con la mano
            fasciata e la bisaccia che tintinna di pezzi quasi tutti inutili.
          effetti: { profondita.laboratorio-di-calibrazione: 1, ferite: 0.5, reliquie.scheggia: 1 }

  - id: laboratorio-reticolo
    immagine: ambientazione/rovine-dei-precursori
    titolo: La camera di esame laser
    sommario: "Una stanza quadrata attraversata da fasci di luce blu sottili come capelli. Vicino alla porta, mezzo bastone da passeggio."
    luogo: Laboratorio di Calibrazione, la camera di esame laser
    area: laboratorio-di-calibrazione
    ripetibile: true
    requisiti: [profondita.laboratorio-di-calibrazione < 3]
    testo: |
      La stanza è perfettamente quadrata, e un reticolo di fasci di luce blu,
      sottili come capelli, la taglia in linee dritte da una parete
      all'altra, a tutte le altezze. Dove un fascio tocca il pavimento brucia
      un puntino luminoso. Sulle pareti ci sono buchi tondi e lisci, ciascuno
      all'altezza di un fascio.

      Vicino alla porta, per terra, c'è la metà di un bastone da passeggio di
      frassino, tagliata netta, con il taglio lucido come vetro. L'altra metà
      è dall'altra parte della stanza, dove deve essere rotolata. Le mani ti
      vanno a controllare che le dita ci siano tutte.
    opzioni:
      - testo: "Passarci in mezzo"
        descrizione: "Fra un fascio e l'altro c'è spazio per un corpo, se il corpo si piega bene."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Il crampo
          testo: |
            Passi una gamba sopra un fascio e l'altra sotto il successivo,
            piegandoti fino a sfiorare il pavimento con le dita, e ti fermi con
            il naso a un dito dalla luce blu, che non scalda nemmeno. Ci metti
            tanto che ti viene un crampo nel fianco. Dall'altra parte ti siedi
            sul pavimento a massaggiarlo, guardando il bastone tagliato in due.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: La riga rossa
          testo: |
            Un fascio ti sfiora la spalla senza fare male, e senti soltanto un
            odore di stoffa bruciata. Quando abbassi gli occhi la manica ha un
            taglio dritto, e sotto la pelle si sta aprendo piano in una riga
            rossa. Dietro di te il fascio continua a bruciare il suo puntino
            sul pavimento. Torni indietro dalla stessa strada, e ti fasci il
            braccio fuori dalla porta con le mani che tremano.
          effetti: { ferite: 0.5 }
      - testo: "Disallineare i fasci"
        descrizione: "Sotto la soglia c'è una piastra di vetro con dei simboli che si spostano. Qualcuno doveva pur entrare a pulire."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: Il corridoio dritto
          testo: |
            Passi la mano sulla piastra di vetro, e i simboli la seguono. Ne
            sposti uno verso destra, e tutti i fasci ruotano di un dito nello
            stesso verso, lasciando un corridoio dritto in mezzo alla stanza
            per il tempo di qualche respiro. Lo attraversi camminando, senza
            correre, perché correndo potresti inciampare. I fasci tornano al
            loro posto un passo dietro i tuoi talloni.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: La ciocca
          testo: |
            Sposti un simbolo, e i fasci ruotano tutti insieme verso di te. Ti
            butti a terra di pancia appena in tempo, e uno ti passa sopra la
            testa e ti porta via una ciocca di capelli, che cade sul pavimento
            in due pezzi. Resti a terra sulla soglia finché il reticolo torna
            com'era, con l'odore dei capelli bruciati nel naso.
          effetti: { tormento: 0.5 }
      - testo: "Strisciare sotto i fasci più bassi"
        descrizione: "I fasci più bassi passano a una spanna dal pavimento. Una spanna è poco."
        costo: 2
        esito:
          titolo: A una spanna
          testo: |
            Ti stendi sulla pancia e avanzi sui gomiti, con la guancia sul
            metallo freddo e un fascio blu a una spanna dalla nuca. A metà
            stanza alzi la testa senza volerlo, e il fascio ti apre un taglio
            sottile sopra l'orecchio. Una goccia di sangue cade sul pavimento,
            e il fascio la fa sfrigolare. Arrivi dall'altra parte con il collo
            bagnato di sangue e i gomiti scorticati.
          effetti: { profondita.laboratorio-di-calibrazione: 1, ferite: 0.5 }

  - id: laboratorio-analisi-cinetica
    immagine: bestiario/salvaguardia-precursori
    titolo: Il laboratorio di analisi cinetica
    sommario: "Una piattaforma inclinata e un braccio meccanico appeso al soffitto, che misura le cose colpendole una volta."
    luogo: Laboratorio di Calibrazione, l'analisi cinetica
    area: laboratorio-di-calibrazione
    ripetibile: true
    requisiti: [profondita.laboratorio-di-calibrazione < 3]
    testo: |
      Al centro della camera c'è una grande piattaforma inclinata di metallo
      graffiato, e sopra, appeso a un binario del soffitto, un braccio
      meccanico lungo quanto l'albero di una barca, ripiegato su se stesso in
      tre giunture. Il pavimento intorno alla piattaforma è pieno di
      ammaccature tonde, tutte della stessa grandezza. Sulla piattaforma sono
      rimasti un elmo da scavo schiacciato a metà e una scarpa sola, con i
      lacci ancora annodati.

      Quando entri si accende una luce sul binario. Il braccio si stende con un
      sibilo d'aria, una giuntura dopo l'altra, e la sua estremità si gira
      verso di te. Lo stomaco ti scende di un palmo.
    opzioni:
      - testo: "Colpire il braccio per primo"
        descrizione: "Se lo colpisci smette di misurare e comincia a difendersi. È più semplice, in un certo senso."
        combattimento: braccio-di-calibrazione
        vittoria:
          titolo: Il tubo dell'aria
          testo: |
            Il braccio scende per misurarti, e tu lo colpisci alla giuntura di
            mezzo. Da quel momento non misura più. Ti viene addosso a colpi
            corti e precisi, sempre sullo stesso punto della spalla, finché
            riesci a infilarti sotto e a spezzargli il tubo dell'aria. Si
            affloscia sul binario con un lungo sibilo. Fra i pezzi caduti
            trovi un occhio di vetro che si accende ancora se lo scuoti.
          effetti: { profondita.laboratorio-di-calibrazione: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: Premuto
          testo: |
            Il braccio ti prende in pieno petto e ti incolla alla piattaforma
            inclinata, e lì ti tiene, premendo, mentre la luce sul binario
            lampeggia. Quando ti lascia andare scivoli giù dalla piattaforma e
            resti a terra fra le ammaccature tonde. Sul binario la luce torna
            verde, come dopo una misura riuscita. Esci dalla camera con le
            costole che scricchiolano a ogni respiro.
      - testo: "Lasciarti misurare"
        descrizione: "Colpisce una volta sola. Se stai fermo, magari colpisce piano."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Il dito sullo sterno
          testo: |
            Resti immobile in mezzo alla camera. Il braccio scende a sfiorarti
            la testa e le spalle, e alla fine ti preme piano sullo sterno un
            dito di metallo freddo prima di ritrarsi con un sibilo. Hai le
            ginocchia molli e il sapore del ferro in bocca. Ti accorgi di
            avere gli occhi chiusi soltanto quando la luce sul binario si
            spegne, e li riapri per andartene.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: La misura riuscita male
          testo: |
            Resisti finché il braccio scende, ma quando te lo vedi arrivare in
            faccia ti scansi d'istinto, e la misura riesce male. Il braccio
            riprova con più forza, e questa volta ti prende sulla spalla e ti
            manda a sbattere contro la piattaforma. L'elmo schiacciato rotola
            giù dalla piattaforma e ti si ferma accanto. Per tutto il giorno
            il braccio sinistro non ti si alza oltre il gomito.
          effetti: { ferite: 0.5 }
      - testo: "Schivarlo e passare"
        descrizione: "Colpisce dove sei. Basta non esserci più."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: L'ammaccatura nuova
          testo: |
            Aspetti con i piedi larghi che il braccio cominci a scendere, e
            scatti di lato. Il colpo si pianta nel pavimento dove eri un
            momento prima, e lascia un'ammaccatura tonda identica alle altre,
            da cui si alza un filo di polvere di metallo. Mentre il braccio si
            ritrae sul binario sei già oltre la piattaforma, con il cuore che
            ti batte nelle orecchie.
          effetti: { profondita.laboratorio-di-calibrazione: 1 }
        fallimento:
          titolo: Il fianco
          testo: |
            Scatti di lato un attimo troppo tardi, con i piedi ancora pesanti,
            e il colpo ti prende di striscio sul fianco e ti fa girare su te
            stesso. Atterri sulla piattaforma inclinata e ci scivoli giù fino
            all'elmo schiacciato, con la scarpa sola sotto la guancia. Ti
            rialzi tenendoti le costole, e il braccio è già tornato al suo
            posto sul binario.
          effetti: { ferite: 0.5 }
      - testo: "Prendere il colpo"
        descrizione: "Una misura è una misura. Basta che la prenda una volta sola."
        costo: 2
        esito:
          titolo: Una volta sola
          testo: |
            Ti metti in mezzo alla camera e lasci che il braccio scenda. Il
            colpo arriva una volta sola, in pieno sulla spalla, e ti piega le
            ginocchia. Poi il braccio si ritrae e la luce sul binario si
            spegne, come dopo una misura riuscita. Passi oltre tenendoti la
            spalla, che ti pulsa a ogni passo. Ti resta un livido tondo della
            stessa grandezza delle ammaccature sul pavimento.
          effetti: { profondita.laboratorio-di-calibrazione: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il Laboratorio, il cuore
  - id: il-nodo-principale
    immagine: bestiario/salvaguardia-precursori
    titolo: Il nodo principale
    sommario: "Un cilindro con tre anelli che girano senza attrito, e una console con tre simboli in fila. Il primo si accende quando entri."
    luogo: Laboratorio di Calibrazione, il nodo principale
    area: laboratorio-di-calibrazione
    requisiti: [profondita.laboratorio-di-calibrazione >= 3]
    testo: |
      La camera in fondo al Laboratorio è alta e rotonda, e la occupa quasi
      tutta un cilindro verticale di metallo scuro, più alto di tre uomini.
      Intorno al cilindro girano tre anelli in versi opposti, senza un rumore
      oltre a un ronzio basso. Per terra ci sono pezzi di droni smontati con
      cura e messi in file ordinate. Su una console laterale ci sono tre
      simboli in fila, e appena passi la soglia il primo si accende.

      Un fascio di luce verde ti percorre dalla testa ai piedi, e poi una
      seconda volta, più lento. Si accende il secondo simbolo. Dal cilindro
      esce un braccio sottile che ti tocca una spalla e poi l'altra, come un
      sarto che cerca il difetto in una giacca, e ti spinge la spalla destra
      più in basso con un colpetto secco. *Mi ha misurato e mi ha corretto.*
      Quando il braccio si ritira, sulla console si accende il terzo simbolo.

      Gli anelli rallentano e si staccano tutti insieme dal cilindro,
      sollevandosi a mezz'aria intorno a un nucleo che pulsa. Adesso sono un
      drone, e il drone gira il nucleo verso di te mentre i tre anelli
      accelerano.
    opzioni:
      - testo: "Affrontare il drone"
        descrizione: "Colpisce sempre nello stesso punto. Una volta capito dove, il resto è lavoro."
        combattimento: drone-alfa-x
        vittoria:
          titolo: Un rumore di pentole
          testo: |
            Il drone combatte come lavora, con colpi misurati che ripete
            identici uno dopo l'altro. Impari dove arriva e ti sposti un
            attimo prima. Quando finalmente lo prendi nel nucleo gli anelli si
            bloccano tutti insieme e lui cade sul pavimento con un rumore di
            pentole. Dal suo ventre stacchi due microbatterie e un anello
            ancora tiepido. Mentre esci la linea luminosa del corridoio ti
            accompagna fino all'ingresso, e lì si spegne.
          imposta: { rovine.calibrazione: 1 }
          effetti: { cella: 2, bottino.parti-di-drone: 1, rep.raschiatori: 0.5 }
          vai: ponti-sospesi
        sconfitta:
          titolo: Sotto la clavicola
          testo: |
            Il drone ti colpisce sempre nello stesso punto, sotto la
            clavicola, finché il braccio destro ti pende inutile lungo il
            fianco. Esci dalla camera camminando all'indietro, e lui non ti
            segue oltre la soglia. Dietro di te gli anelli tornano sul
            cilindro con un clic. La linea luminosa del corridoio ti
            accompagna fino all'uscita, mentre tu ti trascini dietro il
            braccio e la bisaccia vuota.
          imposta: { rovine.calibrazione: 1 }
          vai: ponti-sospesi
      - testo: "Spegnerlo dalla console"
        descrizione: "Tre simboli in fila, e il terzo è acceso. Qualcuno, una volta, doveva pur poterlo spegnere."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Difficile }
        successo:
          titolo: Il primo simbolo
          testo: |
            Ti butti verso la console mentre gli anelli ti sfiorano la nuca, e
            premi i simboli all'indietro, dal terzo al primo. Il drone si
            ferma a mezz'aria. Poi gli anelli scendono piano e tornano al loro
            posto intorno al cilindro, e il ronzio si fa basso e regolare come
            quando sei entrato. Dalle file ordinate per terra prendi una
            microbatteria e un pezzo di drone, ed esci con la linea luminosa
            che ti cammina accanto.
          imposta: { rovine.calibrazione: 1 }
          effetti: { cella: 1, bottino.parti-di-drone: 1, rep.raschiatori: 0.5 }
          pe: { tecnologia: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: Il simbolo sbagliato
          testo: |
            Premi il simbolo sbagliato, e il drone accelera. Ti prende alla
            schiena mentre sei ancora chino sulla console, e una seconda volta
            alla gamba mentre scappi verso la soglia. Fuori dalla camera
            smette di inseguirti, e il terzo simbolo resta acceso sulla
            console alle tue spalle. Risali il corridoio zoppicando, con la
            linea luminosa che tiene il tuo passo storto.
          imposta: { rovine.calibrazione: 1 }
          effetti: { ferite: 2 }
          vai: ponti-sospesi
      - testo: "Stare immobile finché smette di contarti"
        descrizione: "Calibra le cose che si muovono. Una cosa che non si muove è un mobile, e i mobili non si calibrano."
        prova: { attributo: fisico, abilita: [resistenza, furtivita], difficolta: Difficile }
        successo:
          titolo: Un mobile
          testo: |
            Ti fermi a metà di un passo e resti così, senza muovere nemmeno
            gli occhi. Il drone ti gira intorno per un tempo lunghissimo, e tu
            respiri con la pancia, piano, finché i simboli sulla console si
            spengono uno dopo l'altro e gli anelli tornano sul cilindro.
            Quando ti muovi di nuovo hai le gambe di legno. Prendi dalle file
            per terra una microbatteria e un pezzo di drone, ed esci.
          imposta: { rovine.calibrazione: 1 }
          effetti: { cella: 1, bottino.parti-di-drone: 1, rep.raschiatori: 0.5 }
          pe: { resistenza: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: Il tremito
          testo: |
            Resisti a lungo, ma a un certo punto il ginocchio ti trema, e il
            drone se ne accorge prima di te. Il colpo ti arriva sulla coscia e
            ti butta a terra, e il secondo, identico, nello stesso punto. Ti
            trascini fuori dalla camera mentre gli anelli ti girano sopra la
            testa, e risali il corridoio senza aver preso niente. Il drone resta sulla soglia con il nucleo puntato verso di
            te finché non giri l'angolo.
          imposta: { rovine.calibrazione: 1 }
          effetti: { ferite: 2 }
          vai: ponti-sospesi
      - testo: "Dargli un pezzo di ricambio"
        descrizione: "Il drone cerca un componente difettoso da sostituire. Nella bisaccia ne hai uno."
        requisiti: [bottino.parti-di-drone >= 1]
        esito:
          titolo: Il componente sostituito
          testo: |
            Tiri fuori dalla bisaccia un pezzo di drone e lo lanci in mezzo
            agli anelli. Il drone lo prende al volo con il braccio sottile e
            lo misura girandolo, prima di infilarlo nel cilindro con un clic.
            Il terzo simbolo sulla console si spegne. Gli anelli tornano al
            loro posto, e il ronzio si fa basso e tranquillo. Dalle file per
            terra prendi una microbatteria, ed esci prima che cambi idea.
          imposta: { rovine.calibrazione: 1 }
          effetti: { bottino.parti-di-drone: -1, cella: 1, rep.raschiatori: 0.5 }
          vai: ponti-sospesi
      - testo: "Lasciarti calibrare"
        descrizione: "Tenebra l'ha detto, che conviene lasciarli fare. Quanto dura, invece, se l'è tenuto per sé."
        costo: 2
        esito:
          titolo: Più dritto
          testo: |
            Ti fermi in mezzo alla camera e allarghi le braccia. Il drone ti
            gira intorno per un tempo lunghissimo, ti spinge una spalla più in
            basso e ti raddrizza il collo con un colpetto che ti fa
            scricchiolare le vertebre, e la console fa il suo suono a ogni
            correzione. La spalla sinistra resiste, e il braccio sottile la
            spinge in basso un colpetto alla volta finché qualcosa schiocca. Alla fine il terzo simbolo si spegne e gli anelli
            tornano sul cilindro. Raccogli una microbatteria da terra ed esci,
            e per due giorni cammini più dritto di quanto tu abbia mai fatto.
          imposta: { rovine.calibrazione: 1 }
          effetti: { cella: 1, tormento: 1.5, ferite: 0.5, rep.raschiatori: 0.5 }
          vai: ponti-sospesi

  # ================================================================ il Sito Mahr-Kel, le stanze
  - id: mahr-kel-quarantena
    immagine: ambientazione/regno-profondo
    titolo: La camera di quarantena
    sommario: "Una stanza rotonda con le pareti che si gonfiano e si sgonfiano come mantici. Davanti alla porta interna il pavimento è annerito."
    luogo: Mahr-Kel, la camera di quarantena
    area: mahr-kel
    ripetibile: true
    requisiti: [profondita.mahr-kel < 4]
    testo: |
      Il corridoio d'ingresso finisce in una stanza rotonda con le pareti di
      metallo che si gonfiano e si sgonfiano lentamente come mantici, spinte
      dalle tubature che le attraversano. Le tubature sono molli, fatte di un
      materiale simile alla pelle, e dentro ci scorre a fiotti regolari un
      liquido ambrato. Dall'altra parte della stanza c'è una seconda porta,
      chiusa, con una maniglia a leva.

      Il pavimento intorno alla porta interna è annerito a raggiera. Su quel
      cerchio nero qualcuno ha lasciato un paio di guanti di cuoio bruciati
      sulle dita e intatti sul polso. Ti accorgi di tenere le mani chiuse a
      pugno, con i pollici dentro.
    opzioni:
      - testo: "Capire a che cosa serve la stanza"
        descrizione: "I fiotti nelle tubature hanno un ritmo. Il ritmo vorrà dire qualcosa."
        prova: { attributo: mentale, abilita: [tecnologia, medicina], difficolta: Media }
        successo:
          titolo: La sterilizzazione
          testo: |
            Guardi i fiotti nelle tubature e capisci che è una camera di
            sterilizzazione, come i bacili dove i chirurghi del Velo lavano i
            ferri, ma grande abbastanza per un corpo intero. Il liquido scorre
            più in fretta subito prima della scarica. Aspetti che rallenti,
            abbassi la leva con il manico del piccone e salti indietro, e il
            lampo resta sulla soglia.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Le dita ad artiglio
          testo: |
            Abbassi la leva nel momento sbagliato. La scarica ti risale dal
            braccio fino al petto, e ti ritrovi a terra contro il muro che si
            gonfia e si sgonfia dietro la tua schiena, con le dita contratte
            ad artiglio. Nelle tubature il liquido ambrato rallenta, e la
            stanza torna a gonfiarsi piano. Hai nel naso l'odore della tua
            pelle bruciata, e le dita ci mettono un bel pezzo a riaprirsi.
          effetti: { ferite: 0.5 }
      - testo: "Aprire e saltare indietro"
        descrizione: "Se la scarica arriva quando si apre la porta, basta non essere lì quando si apre."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il lampo
          testo: |
            Ti metti di lato alla porta, abbassi la leva con la punta delle
            dita e ti butti all'indietro. Il lampo esplode sulla soglia e ti
            abbaglia, e per un momento vedi soltanto una macchia viola. Sul
            cerchio nero, accanto ai guanti, c'è un raggio di bruciato in più.
            Quando ti torna la vista la porta interna è aperta, e dall'altra
            parte c'è un corridoio che scende.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: I guanti
          testo: |
            Il lampo è più svelto di te. Ti prende alla mano ancora sulla leva
            e ti butta lungo disteso sul cerchio nero, accanto ai guanti
            bruciati. Adesso capisci perché sono bruciati soltanto sulle dita.
            Il palmo ti si riempie di vesciche dove stringeva la leva, e
            intorno le pareti si gonfiano e si sgonfiano con il ritmo di
            prima. Ti rialzi con la mano che pulsa, e la porta si è già
            richiusa.
          effetti: { ferite: 0.5 }
      - testo: "Aprire e prendere la scarica"
        descrizione: "La scarica arriva comunque. Tanto vale sapere quando."
        costo: 2
        esito:
          titolo: Dentro le ossa
          testo: |
            Ti avvolgi la mano nella manica e abbassi la leva a denti stretti.
            La scarica ti entra nelle ossa e ti fa battere i denti tanto forte
            che ti mordi la lingua. Quando passa la porta è aperta, e tu la
            attraversi con il braccio che formicola e il sapore del sangue in
            bocca. Dietro di te la porta si richiude con un soffio.
          effetti: { profondita.mahr-kel: 1, ferite: 0.5 }

  - id: mahr-kel-drenaggio
    immagine: ambientazione/regno-profondo
    titolo: Il condotto di drenaggio
    sommario: "Un corridoio in discesa bagnato da un fluido viscoso, con linee blu che si spengono e si riaccendono. Dal fluido sale un vapore dolciastro."
    luogo: Mahr-Kel, il condotto di drenaggio
    area: mahr-kel
    ripetibile: true
    requisiti: [profondita.mahr-kel < 4]
    testo: |
      È un corridoio in discesa rivestito di metallo, bagnato da un fluido
      viscoso e trasparente che si stacca dalle pareti in fili lunghi quando
      lo tocchi. Sul pavimento corrono linee luminose blu che si spengono e si
      riaccendono tutte insieme, a un ritmo lento, e quando si spengono non
      vedi più dove metti i piedi. Dal fluido sale un vapore tiepido e
      dolciastro che ti fa girare appena la testa.

      A metà discesa c'è un chiodo da roccia piantato nel metallo, e al chiodo
      è legata una corda tagliata, con il capo sfilacciato che pende nel
      fluido. Le gambe ti si fanno incerte prima ancora di cominciare a
      scendere.
    opzioni:
      - testo: "Scendere senza scivolare"
        descrizione: "Un passo per volta, con il peso indietro, e la speranza che il chiodo regga."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il chiodo
          testo: |
            Scendi di traverso con il peso indietro, un passo ogni volta che
            le linee si accendono, e ti fermi al chiodo per riprendere fiato.
            Il chiodo regge, e quando le linee si spengono aspetti al buio con
            le mani sul chiodo che si riaccendano. Arrivi in fondo in piedi,
            con gli stivali pieni di fluido fino alla caviglia, e ti pulisci
            le suole su una grata con una cura che non ti riconosci.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Nel fluido
          testo: |
            Al buio metti il piede sul fluido più spesso e scivoli di schiena
            fino al chiodo, con il fluido che ti entra nel colletto e nelle
            maniche. La corda tagliata pende a un palmo dalla tua mano, troppo
            corta. Il vapore da vicino è dolce da stordire. Risali a quattro
            zampe con la pelle che ti formicola dappertutto, e il formicolio
            continua anche dopo che ti sei asciugato.
          effetti: { contaminazione: 0.5 }
      - testo: "Seguire le linee blu"
        descrizione: "Le linee non sono dappertutto. Forse segnano dove si può camminare."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Le scanalature
          testo: |
            Guardi le linee mentre sono accese e capisci che corrono dentro
            scanalature del pavimento, dove il fluido scola via e il metallo
            resta ruvido. Il bordo delle scanalature è liscio e consumato.
            Metti i piedi soltanto lì, contando il buio fra un'accensione e
            l'altra. Arrivi in fondo asciutto fino alla caviglia, e quasi ti
            dispiace per chi ha legato la corda.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Il vapore
          testo: |
            Ti chini sul pavimento per guardare le linee da vicino, e il
            vapore ti entra nel naso tutto in una volta. Per un tempo che non
            sai misurare resti accucciato a fissare il blu che si accende e si
            spegne, contento, senza un pensiero. Ti riscuote il freddo del
            fluido che ti è arrivato alle ginocchia. Ti rialzi con i calzoni
            fradici e un sorriso che ti si spegne piano sulla faccia.
          effetti: { tormento: 0.5 }
      - testo: "Lasciarti scivolare fino in fondo"
        descrizione: "In fondo ci arrivi di sicuro. Il fluido arriva con te."
        costo: 2
        esito:
          titolo: In fondo
          testo: |
            Ti siedi sul bordo, tieni le braccia strette al petto e ti lasci
            andare. Scivoli giù per il condotto sulla schiena, con il fluido che
            ti schizza in faccia e le linee blu che ti passano accanto come le
            luci di una strada vista da un carro in corsa. Arrivi in fondo
            fradicio e intero, con la pelle che ti formicola fino a sera.
          effetti: { profondita.mahr-kel: 1, contaminazione: 0.5 }

  - id: mahr-kel-raccolta-biologica
    immagine: ambientazione/regno-profondo
    titolo: La camera di raccolta biologica
    sommario: "Sei capsule trasparenti in cerchio, ciascuna con un campione dentro. Nella quinta c'è una crepa, e sul fondo un mucchietto grigio."
    luogo: Mahr-Kel, la camera di raccolta biologica
    area: mahr-kel
    ripetibile: true
    requisiti: [profondita.mahr-kel < 4]
    testo: |
      Sei capsule trasparenti alte quanto un uomo stanno in cerchio intorno a
      una colonna di metallo, e ciascuna contiene un campione diverso sospeso
      in un liquido limpido. In una ci sono ciocche di capelli di tutti i
      colori legate a mazzetti, in un'altra una fila di insetti smontati con
      le ali da una parte e le zampe dall'altra, ordinate per grandezza. Le
      etichette sotto le capsule sono scritte a mano nella lingua dei
      Precursori.

      La quinta capsula ha una crepa lunga dal basso fino a metà, e il liquido
      dentro si è abbassato. Sul fondo c'è un mucchietto grigio, fermo. Quando
      ti avvicini il mucchietto si apre, e ti accorgi che sono dita.
    opzioni:
      - testo: "Affrontarle"
        descrizione: "Sono due mani senza corpo. Cercano una gola o un polso."
        combattimento: parassiti-di-mahr-kel
        vittoria:
          titolo: Le unghie pulite
          testo: |
            Escono dalla crepa in due e corrono sulle dita verso i tuoi polsi.
            Ne schiacci una sotto lo stivale, e l'altra ti sale sulla gamba fino
            al ginocchio prima che tu riesca a staccartela e a sbatterla contro
            la colonna. Restano per terra due mani grigie, aperte, con le unghie
            lunghe e pulite. Ti strofini lo stivale sul bordo del pavimento per
            un bel pezzo.
          effetti: { profondita.mahr-kel: 1 }
        sconfitta:
          titolo: La gola
          testo: |
            Una delle due ti trova la gola mentre l'altra ti tiene il polso, e
            stringe con una forza che non ha niente a che vedere con la sua
            grandezza. Te la strappi di dosso insieme a un lembo di pelle e
            scappi dalla camera tenendoti il collo, con le due mani che ti
            corrono dietro fino alla soglia e lì si fermano.
      - testo: "Passare senza farle uscire"
        descrizione: "Il mucchietto si è aperto quando ti sei avvicinato. Da lontano forse dorme."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Dall'altra parte del cerchio
          testo: |
            Giri intorno al cerchio dalla parte opposta alla quinta capsula,
            tenendo la colonna fra te e la crepa. Il mucchietto grigio si
            richiude piano, un dito alla volta. Nella capsula il liquido trema
            appena al tuo passaggio, e dalla crepa ne cola un filo lento sul
            pavimento. Esci dalla camera camminando all'indietro, e ti volti
            soltanto quando la colonna nasconde del tutto la capsula.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Il polso
          testo: |
            A metà del cerchio la quinta capsula scricchiola, e una delle mani
            esce dalla crepa e ti corre dietro sul pavimento. Ti prende la
            caviglia e risale fino al polpaccio prima che tu riesca a
            staccartela a calci. Torni da dove sei venuto con i segni delle
            unghie che sanguinano dentro lo stivale. Alle tue spalle la mano
            rientra nella crepa a passi di dita.
          effetti: { ferite: 0.5 }
      - testo: "Chiudere la crepa"
        descrizione: "Con il mastice da scavo e le bende, se la capsula regge abbastanza da lasciarti lavorare."
        prova: { attributo: mentale, abilita: [tecnologia, medicina], difficolta: Media }
        successo:
          titolo: Il mastice
          testo: |
            Scaldi il mastice da scavo fra le mani e lo spalmi lungo la crepa
            dal basso in su, con la stessa cura con cui si chiude una ferita,
            mentre dentro la capsula le dita grigie tastano il vetro dalla tua
            parte. Ci passi sopra una benda, e il mastice tira e si indurisce
            in pochi respiri. Quando hai finito il mucchietto si richiude, e
            passi oltre senza voltarti.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Il vetro
          testo: |
            Premi il mastice sulla crepa, e il vetro cede sotto il pollice.
            Una mano esce dalla capsula e ti si chiude fredda e bagnata
            intorno al polso. La stacchi sbattendola contro la colonna, e
            intanto l'altra ti ha già graffiato il dorso fino all'osso. La
            mano staccata corre via fino alla capsula e ci rientra dalla
            crepa. Arretri fino alla porta con il braccio stretto al petto.
          effetti: { ferite: 0.5 }
      - testo: "Correre fino all'altra porta"
        descrizione: "Sono veloci. Forse non quanto te."
        costo: 2
        esito:
          titolo: La caviglia
          testo: |
            Corri lungo il bordo della camera. Una delle mani esce dalla crepa
            e ti raggiunge alla porta, si aggrappa alla caviglia e ti si
            arrampica sulla gamba, e te la strappi di dosso soltanto sulla
            soglia. La butti indietro nella camera e chiudi la porta con un
            calcio, mentre il polpaccio ti sanguina in cinque punti.
            Dall'altra parte del metallo la senti grattare con le unghie.
          effetti: { profondita.mahr-kel: 1, ferite: 0.5 }

  - id: mahr-kel-ricostruzione
    immagine: ambientazione/regno-profondo
    titolo: La camera di ricostruzione
    sommario: "Braccia meccaniche ferme a metà di un gesto, e sul pavimento forme umane lasciate a metà. Entrando, ti sembra di conoscere la stanza."
    luogo: Mahr-Kel, la camera di ricostruzione
    area: mahr-kel
    ripetibile: true
    requisiti: [profondita.mahr-kel < 4]
    testo: |
      È una stanza enorme, e dal soffitto pendono decine di braccia meccaniche
      ferme a metà di un gesto, con le pinze aperte. Sul pavimento sotto le
      braccia ci sono forme umane non finite che stanno stese o sedute come
      statue di carne lasciate a metà dallo scultore. A una manca la faccia, e
      un'altra ha due mani perfette alla fine di braccia che sono soltanto
      ossa.

      Appena entri ti prende una sensazione precisa e assurda, quella di
      conoscere già questa stanza e il freddo di quei tavoli sotto la schiena.
      Ti si rivolta lo stomaco. In fondo alla stanza una delle forme si alza
      lentamente, e ha troppe braccia da una parte.
    opzioni:
      - testo: "Affrontare la forma che si è alzata"
        descrizione: "È lenta. Quello che afferra, però, non lo lascia."
        combattimento: abominio-incompleto
        vittoria:
          titolo: Fra le altre
          testo: |
            È lenta, e quello che afferra non lo lascia più. Lo capisci al primo
            scambio, quando ti prende la giacca e devi sfilartela per scappare.
            Da quel momento le giri intorno senza mai fermarti e la colpisci
            dalla parte dove ha meno braccia, finché crolla fra le forme
            incompiute e non si distingue più da loro. Esci dalla stanza in
            camicia, con il fiato che ti brucia in gola.
          effetti: { profondita.mahr-kel: 1 }
        sconfitta:
          titolo: I polsi
          testo: |
            Ti prende per tutti e due i polsi e ti solleva da terra fino a
            portarti all'altezza della sua faccia, a cui manca metà del
            lavoro. Ha la presa lenta e precisa delle braccia meccaniche del
            soffitto. Resta a guardarti a lungo. Poi ti lascia cadere e torna
            a sedersi fra le altre forme, e tu esci a carponi con i polsi
            viola.
      - testo: "Non dare retta al ricordo"
        descrizione: "Il ricordo non è tuo. Bisogna ricordarselo più forte di lui."
        prova: { attributo: mentale, abilita: [resilienza, medicina], difficolta: Media }
        successo:
          titolo: Il tuo nome
          testo: |
            Ti ripeti a mezza voce il tuo nome e la strada di casa, finché la
            sensazione si stacca da te come una crosta. Il ricordo era di
            qualcun altro, e la stanza lo appoggia addosso a chiunque entri.
            La forma con troppe braccia è lenta, e la superi rasente la parete
            senza che arrivi a toccarti. Dall'altra parte il tuo nome ti esce
            ancora di bocca da solo.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Finito
          testo: |
            Il ricordo ti prende del tutto, e per un tempo che non sai
            misurare resti immobile in mezzo alla stanza, aspettando che
            qualcuno venga a finirti. Ti risveglia il rumore della forma che
            si trascina verso di te. Hai nella schiena il freddo di quei
            tavoli. Scappi all'indietro, e per tutto il giorno dopo ti guardi
            le mani per controllare che siano finite.
          effetti: { tormento: 0.5 }
      - testo: "Portarla in giro per la stanza"
        descrizione: "È lenta e non molla la presa. Ma per prendere bisogna arrivare."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il giro lungo
          testo: |
            Ti fai vedere, e quando la forma comincia a venirti incontro giri
            intorno al tavolo più grande, poi intorno a un altro, tenendola
            sempre a tre passi. Lei ti segue senza fretta e senza stancarsi. Al
            terzo giro tagli verso la porta di fondo e la lasci
            in mezzo alle sue sorelle incompiute, con le braccia tese verso il
            vuoto.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Il tavolo
          testo: |
            Al secondo giro inciampi in una forma stesa per terra, e la forma
            con troppe braccia ti prende per la caviglia. La presa è lenta e
            precisa, e stringe finché senti scricchiolare l'osso. Te ne liberi
            lasciandole lo stivale e scappi da dove sei entrato, saltellando.
            Dietro di te la forma resta con lo stivale in mano e se lo rigira
            davanti alla faccia senza occhi.
          effetti: { ferite: 0.5 }
      - testo: "Passare fra le forme incompiute"
        descrizione: "In mezzo a loro la forma che si è alzata non ti distingue. Il ricordo, invece, sì."
        costo: 2
        esito:
          titolo: Una di loro
          testo: |
            Ti abbassi e passi in mezzo alle forme stese per terra, carponi,
            fermandoti quando la forma con troppe braccia volta la testa. Il
            ricordo intanto ti cresce dentro, e a metà strada ti sembra di
            essere una di loro, lasciata lì da qualcuno che non è tornato a
            finire il lavoro. Esci dall'altra parte tremando, e ci metti un
            pezzo a rimetterti in piedi.
          effetti: { profondita.mahr-kel: 1, tormento: 0.5 }

  - id: mahr-kel-depositi
    immagine: ambientazione/regno-profondo
    titolo: I depositi
    sommario: "Due magazzini pieni di armature storte e di vasche di conservazione. Su uno scaffale, una fila di fiale rosa con un filamento dentro."
    luogo: Mahr-Kel, i depositi
    area: mahr-kel
    ripetibile: true
    requisiti: [profondita.mahr-kel < 4]
    testo: |
      Due magazzini comunicano attraverso un arco basso. Sono pieni di
      armature dalle forme storte, che non andrebbero bene a nessun corpo che
      conosci, e di vasche di liquido di conservazione dove galleggiano pezzi
      di creature smontate, con le etichette ancora attaccate. Le etichette
      sono scritte nella lingua dei Precursori, a mano, con una grafia minuta e
      ordinata.

      Su uno scaffale c'è una fila di fiale tiepide piene di un fluido rosa, e
      in ciascuna galleggia un filamento che si muove da solo. Le fiale vuote
      lì accanto sono pulite e rimesse in fila. Le tue mani si fermano a
      mezz'aria sopra lo scaffale.
    opzioni:
      - testo: "Prendere una fiala di fluido rosa"
        descrizione: "Sembra un ricostituente. Bisogna capire se lo è prima di metterselo in tasca."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Il graffio che si chiude
          testo: |
            Ne apri una e ci intingi la punta del dito. Il graffio che avevi
            sul dorso della mano si chiude sotto i tuoi occhi, con un
            formicolio che ti sale fino al gomito, e il filamento nella fiala
            si agita. Sul dorso ti resta una pelle nuova, più rosa del resto.
            Ne prendi una piena e la avvolgi in un panno, lontano dal resto
            della bisaccia.
          effetti: { profondita.mahr-kel: 1, tonico: 1 }
        fallimento:
          titolo: Il filamento
          testo: |
            Ne apri una per annusarla, e il filamento salta fuori e ti si
            attacca al dorso della mano, caldo, cercando un punto dove
            entrare. Lo stacchi con la punta della lama, e sotto resta un buco
            piccolo e tondo che sanguina più di quanto dovrebbe. Il filamento,
            per terra, si contorce ancora a lungo. Ti fasci il dorso con un
            pezzo di camicia, stretto.
          effetti: { ferite: 0.5 }
      - testo: "Aprire la vasca del reticolo"
        descrizione: "In una vasca più piccola delle altre galleggia un reticolo di vetro e filamenti. Sembra fatto per ricucire."
        requisiti: [oggetto.matrice-di-levigazione == 0]
        prova: { attributo: mentale, abilita: [magia, medicina], difficolta: Media }
        successo:
          titolo: La matrice di levigazione
          testo: |
            Il coperchio della vasca si apre girandolo di un quarto. Tiri
            fuori il reticolo con due dita, e i filamenti si stringono intorno
            al tuo polso, piano, senza farti male. Quando lo tieni in mano il
            formicolio della magia ti arriva più netto del solito, e le
            piccole ferite sulle nocche ti prudono come se stessero già
            guarendo. Lo avvolgi nel fazzoletto e lo metti in fondo alla
            bisaccia.
          effetti: { profondita.mahr-kel: 1, oggetto.matrice-di-levigazione: 1 }
          pe: { medicina: 5 }
        fallimento:
          titolo: La stretta
          testo: |
            Infili la mano nella vasca, e il reticolo ti si stringe intorno al
            polso troppo forte, con i filamenti che ti entrano sotto la pelle.
            Lo strappi via a fatica e lo lasci ricadere nel liquido. Il
            reticolo affonda piano, con i filamenti aperti. Sul polso ti resta
            un disegno a rete di puntini rossi, che sbiadisce soltanto dopo
            qualche giorno.
          effetti: { contaminazione: 0.5 }
      - testo: "Attraversare i depositi senza toccare niente"
        descrizione: "Fra le vasche il passaggio è stretto, e le armature storte hanno spigoli dappertutto."
        costo: 2
        esito:
          titolo: Gli spigoli
          testo: |
            Passi fra le vasche di lato, con le braccia alzate per non
            sfiorare il liquido e le etichette dalla grafia minuta che ti
            scorrono a una spanna dagli occhi. Uno spigolo di armatura storta
            ti apre la coscia attraverso i calzoni. In una vasca un pezzo di
            creatura si gira verso di te mentre passi. Esci dall'altro
            magazzino con la mano premuta sulla coscia e la voglia di lavarti
            le mani.
          effetti: { profondita.mahr-kel: 1, ferite: 0.5 }

  - id: mahr-kel-corridoio-delle-ombre
    immagine: ambientazione/regno-profondo
    titolo: Il corridoio delle ombre
    sommario: "Un corridoio rettilineo dove la tua ombra cammina un battito dopo di te. Sulle pareti ci sono altre ombre, ferme."
    luogo: Mahr-Kel, il corridoio delle ombre
    area: mahr-kel
    ripetibile: true
    requisiti: [profondita.mahr-kel < 4]
    testo: |
      Il corridoio è lungo e rettilineo, con una luce bianca che scende dal
      soffitto e pareti di un metallo chiaro e opaco. La tua ombra ti cammina
      accanto sulla parete. Dopo una decina di passi ti accorgi che si muove in
      ritardo, un battito dopo di te, e quando ti fermi fa ancora mezzo passo
      prima di fermarsi anche lei.

      Ci sono altre ombre sulla parete, più sbiadite, ferme in pose diverse.
      Una ha il braccio alzato a indicare qualcosa più avanti. Un'altra è
      seduta per terra con la testa fra le ginocchia, e ha la forma di un
      Raschiatore con il casco da scavo. Senti il bisogno di guardarti alle
      spalle, e lo tieni per te.
    opzioni:
      - testo: "Camminare guardando avanti"
        descrizione: "Gli occhi sulla porta in fondo, e l'ombra che faccia quello che vuole."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Puntuale
          testo: |
            Tieni gli occhi sulla porta in fondo e conti i passi a voce bassa,
            senza mai guardare la parete. Per tutto il tragitto senti la tua
            ombra un battito dietro di te, come un cane che non si decide a
            seguirti. L'ombra seduta con il casco da scavo resta indietro
            insieme alle altre. Alla porta la luce cambia, e quando finalmente
            ti volti l'ombra ti è tornata attaccata ai piedi.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Il braccio alzato
          testo: |
            A metà strada guardi la parete, e la tua ombra si è fermata mentre
            tu camminavi ancora. Ti volti di scatto. La tua ombra alza il
            braccio come quella che indica, e il tuo braccio resta giù.
            L'ombra resta lì con il braccio alzato anche quando ti allontani.
            Torni indietro di corsa fino all'imbocco, e per un'ora ti guardi i
            piedi a ogni passo.
          effetti: { tormento: 0.5 }
      - testo: "Trovare da dove viene la luce"
        descrizione: "Un'ombra in ritardo vuol dire una luce in ritardo."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: La fessura
          testo: |
            Guardi il soffitto invece della parete. La luce scorre da un capo
            all'altro del corridoio dentro una fessura sottile, e la tua ombra è
            soltanto la luce che arriva tardi. Le altre ombre sono rimaste
            stampate sul metallo come su una lastra, tutte quelle che il
            corridoio ha fotografato negli anni. Passi oltre con il respiro più
            lento, senza guardarle in faccia.
          effetti: { profondita.mahr-kel: 1 }
        fallimento:
          titolo: Stampata
          testo: |
            Ti fermi a guardare il soffitto troppo a lungo, e quando riabbassi
            gli occhi c'è un'ombra nuova sulla parete, ferma con la testa
            rovesciata all'indietro. È la tua, e non si stacca dal metallo. Ti
            tocchi la gola e la trovi intera. Esci dal corridoio camminando
            all'indietro, e per tutto il giorno l'ombra che hai ai piedi ti
            sembra più leggera.
          effetti: { tormento: 0.5 }
      - testo: "Correre a occhi chiusi"
        descrizione: "Il corridoio è dritto. Se non le vedi, le ombre possono fare quello che vogliono."
        costo: 2
        esito:
          titolo: A occhi chiusi
          testo: |
            Chiudi gli occhi e corri con una mano sulla parete. A metà strada
            la mano passa su un punto più freddo, che ha la forma di una
            spalla, e ti si gela il braccio fino al gomito. Arrivi in fondo e
            sbatti contro la porta, e quando riapri gli occhi la tua ombra ci
            mette un momento a raggiungerti. Ti asciughi il palmo sui calzoni,
            e il freddo resta.
          effetti: { profondita.mahr-kel: 1, tormento: 0.5 }

  # ------------------------------------------------------------ Mahr-Kel, l'archivio (non ripetibile)
  - id: l-archivio-di-memoria
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'archivio di memoria
    sommario: "Una sala di colonne di cristallo con un rotolo in ogni fessura. Hai già visto un congegno così, molto più piccolo, alla cintura di Yoggoth."
    luogo: Mahr-Kel, l'archivio di memoria
    area: mahr-kel
    requisiti: [rovine.archivio == 0, profondita.mahr-kel >= 2]
    testo: |
      Dietro una porta che si apre da sola al tuo passaggio c'è una sala piena
      di colonne di cristallo, alte fino al soffitto e messe in file regolari.
      Ogni colonna ha una fessura all'altezza del petto, e in ogni fessura è
      infilato un rotolo di pergamena sottilissima, coperto di simboli che
      conosci appena. Davanti a ogni colonna il metallo del pavimento è
      consumato in due impronte di piedi, dove chi leggeva si fermava. Molte
      colonne sono spente e incrinate, e in altre sale e scende piano una luce
      lattiginosa.

      Ti fermi davanti alla prima colonna accesa con la sensazione di aver
      già visto una cosa simile, e ci metti un momento a ricordare dove. Nelle
      Segrete dell'Ira, alla cintura di Yoggoth, c'era un cilindro di lyssan
      con dentro un rotolo come questi. La sala è lo stesso congegno fatto
      grande quanto una chiesa, e nel silenzio senti ronzare le colonne accese
      una dopo l'altra.
    opzioni:
      - testo: "Leggere una memoria"
        descrizione: "Quasi tutti i rotoli sono rovinati. Ne basta uno che parli."
        prova: { attributo: mentale, abilita: [accademiche, magia, tecnologia], difficolta: Media }
        successo:
          titolo: Fase tre interrotta
          testo: |
            Premi il palmo sul cristallo accanto alla fessura finché il rotolo
            comincia a ronzare. Sopra la colonna prende forma una figura di
            luce molto più alta di un uomo, sottile, con il corpo per metà di
            carne e per metà di congegno e le giunture che brillano. Parla
            nella lingua dei Precursori con una voce calma, e i simboli che
            scorrono sul rotolo ti bastano per seguirla. *Il Progetto
            Mahr-Kel, archivio biologico. Fase tre interrotta per la perdita
            del Supervisore Nhar'Kael. Ciclo di Ricostruzione incompleto*. Al
            nome di Nhar'Kael la mano ti si stacca dal cristallo da sola. *Per
            loro era una sorvegliante, e l'hanno persa.* La figura si spegne a
            metà di un gesto, e la colonna torna lattiginosa.
          imposta: { rovine.archivio: 1 }
          effetti: { informazioni.segreto: 1, tormento: 0.5 }
          pe: { accademiche: 5 }
        fallimento:
          titolo: Le voci accavallate
          testo: |
            Premi il palmo sul cristallo, e il rotolo ronza e si accende tutto
            insieme, troppo. Sopra la colonna passano figure di luce una
            sull'altra, spezzate, con le voci accavallate, e la luce ti entra
            negli occhi e ci resta. Stacchi la mano a fatica, e sul cristallo
            resta l'impronta umida del tuo palmo. Per un pezzo vedi le colonne
            doppie, e la testa ti pulsa dietro gli occhi.
          effetti: { tormento: 0.5 }
      - testo: "Leggere la memoria del luogo con l'Eco"
        descrizione: "La formula precuriana parla con quello che i luoghi ricordano. Qui i luoghi ricordano per mestiere."
        incantesimo: eco
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Quello che la sala ricorda
          testo: |
            Dici la formula a bassa voce, e tutte le colonne accese rispondono
            insieme. Sopra la più vicina si alza una figura di luce alta e
            sottile con il corpo per metà di carne e per metà di congegno, e
            la sua voce ti arriva dentro la testa già tradotta. *Il Progetto
            Mahr-Kel, archivio biologico. Fase tre interrotta per la perdita
            del Supervisore Nhar'Kael. Ciclo di Ricostruzione incompleto*. Al
            nome di Nhar'Kael la formula ti si spezza in bocca. La figura si
            spegne, e le colonne tornano a ronzare ciascuna per conto suo.
          imposta: { rovine.archivio: 1 }
          effetti: { informazioni.segreto: 1, tormento: 0.5 }
          pe: { magia: 5 }
        fallimento:
          titolo: Troppe memorie
          testo: |
            La formula apre tutte le colonne insieme, e ti arrivano addosso
            cento voci nella lingua dei Precursori, ciascuna con il suo pezzo
            da dire. Ti tappi le orecchie, ma le voci sono dentro, e una di
            loro ripete sempre la stessa parola. Quando finiscono sei in
            ginocchio fra due colonne, e non ricordi una parola. Il ronzio ti
            resta nelle orecchie per tutta la risalita.
          effetti: { tormento: 0.5 }
      - testo: "Dire alla colonna la parola del cilindro"
        descrizione: "Il cilindro di Yoggoth lo porti ancora nella bisaccia. Quello che serviva a lui, forse, serve anche qui."
        requisiti: [oggetto.registratore-olografico >= 1]
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Facile }
        successo:
          titolo: Mostrati
          testo: |
            Appoggi il cilindro di lyssan accanto alla fessura, e la colonna
            ronza nella stessa nota. Dici la parola dei Precursori che vuol
            dire *mostrati*. Sopra la colonna compare una figura di luce alta
            e sottile con il corpo per metà di carne e per metà di congegno,
            che parla con voce calma, e i simboli sul rotolo scorrono
            abbastanza piano da farsi leggere. *Il Progetto Mahr-Kel, archivio
            biologico. Fase tre interrotta per la perdita del Supervisore
            Nhar'Kael. Ciclo di Ricostruzione incompleto*. Il cilindro nella
            tua mano si raffredda di colpo. La figura si spegne, e tu resti a
            guardare la colonna vuota con il nome di Nhar'Kael che ti gira in
            testa.
          imposta: { rovine.archivio: 1 }
          effetti: { informazioni.segreto: 1, tormento: 0.5 }
        fallimento:
          titolo: Il cilindro freddo
          testo: |
            Dici la parola dei Precursori, ma la dici con l'accento sbagliato.
            La colonna ronza più forte, e il cilindro di lyssan ti si gela in
            mano fino a bruciarti il palmo. Lo lasci cadere, e quando lo
            raccogli è di nuovo tiepido e la colonna è tornata lattiginosa.
            Sul palmo ti resta un segno rosso con il disegno delle incisioni.
          effetti: { tormento: 0.5 }
      - testo: "Toccare le colonne una dopo l'altra"
        descrizione: "Una alla volta, finché una non parla. Ogni colonna lascia qualcosa negli occhi."
        costo: 2
        esito:
          titolo: La sesta colonna
          testo: |
            Tocchi una colonna dopo l'altra, e quasi tutte ti mostrano
            soltanto luce rotta e voci spezzate che ti restano dietro gli
            occhi. Alla sesta compare una figura alta e sottile con il corpo
            per metà di carne e per metà di congegno, e la sua voce calma dice
            una frase che riesci a seguire sui simboli del rotolo. *Il
            Progetto Mahr-Kel, archivio biologico. Fase tre interrotta per la
            perdita del Supervisore Nhar'Kael. Ciclo di Ricostruzione
            incompleto*. Esci dalla sala con il nome di Nhar'Kael in testa e
            un dolore dietro gli occhi che ti tiene compagnia fino a sera.
          imposta: { rovine.archivio: 1 }
          effetti: { informazioni.segreto: 1, tormento: 1 }

  # ------------------------------------------------------------ Mahr-Kel, il cuore
  - id: la-vasca-di-clonazione
    immagine: ambientazione/regno-profondo
    titolo: La vasca di clonazione
    sommario: "Una sala lunga e stretta, con una vasca di liquido lattiginoso e decine di cavi che ci scendono dentro. Qualcosa sta per uscire."
    luogo: Mahr-Kel, la vasca di clonazione
    area: mahr-kel
    requisiti: [profondita.mahr-kel >= 4]
    testo: |
      La sala è lunga e stretta, e le pareti di lega scura rimandano appena la
      luce che porti. Al centro, incassata nel pavimento, c'è una vasca ovale
      piena di un liquido lattiginoso che pulsa piano. Dal soffitto calano
      decine di cavi metallici rigidi o sottili, che scendono tutti nella
      vasca. Una passerella gira intorno al bordo, e in fondo alla sala c'è un
      cilindro attraversato da fasci verde-turchese che convergono nel
      liquido.

      Il primo rumore è un plop sordo, una bolla che scoppia sott'acqua, e
      poi un altro. Il liquido comincia a girare e si illumina da dentro di un
      viola pallido. Quando ti avvicini la superficie si tende, e poi si
      lacera.

      Ne esce una figura alta almeno due metri e venti. La spina dorsale è una
      fila di placche di metallo incomplete, e fra le placche aperte si vede
      un tessuto nervoso che brilla. Dal petto le sporge una costola spezzata
      che pulsa insieme alla luce, e non ha occhi. Inclina la testa verso di
      te come per ascoltarti il cuore, e il cuore ti accelera.
    opzioni:
      - testo: "Affrontare il costrutto"
        descrizione: "Non ti vede. Ti trova lo stesso, ogni volta che il cuore ti salta in gola."
        combattimento: costrutto-biologico
        vittoria:
          titolo: La luce viola
          testo: |
            Il costrutto ti trova sempre un attimo dopo che il cuore ti è
            saltato in gola, e impari a respirare piano mentre colpisci.
            Quando finalmente crolla sulla passerella la luce viola nella
            vasca si spegne, e il tessuto sotto le placche diventa grigio.
            Dalle rastrelliere intorno alla vasca prendi un cristallo carico e
            una placca incisa, e in una nicchia trovi anche una fiala di
            fluido rosa. Risali le sale di Mahr-Kel senza voltarti, con le
            paratie che si chiudono una dopo l'altra alle tue spalle.
          imposta: { rovine.mahr-kel: 1 }
          effetti: { cristalli.cristallo-carico: 1, reliquie.frammento-inciso: 1, tonico: 1, rep.raschiatori: 0.5 }
          vai: ponti-sospesi
        sconfitta:
          titolo: Il bordo della vasca
          testo: |
            Il costrutto ti prende per le spalle e ti spinge verso la vasca,
            finché senti il liquido tiepido bagnarti la nuca. Ti divincoli e
            rotoli giù dalla passerella, e lui resta sul bordo con la testa
            inclinata ad ascoltare il punto dove eri. Scappi su per le sale di
            Mahr-Kel con le paratie che si chiudono alle tue spalle, a mani
            vuote.
          imposta: { rovine.mahr-kel: 1 }
          vai: ponti-sospesi
      - testo: "Spegnere i fasci del nucleo"
        descrizione: "I fasci verde-turchese finiscono nella vasca. Senza di loro, forse, il costrutto non regge in piedi."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: Il cilindro spento
          testo: |
            Corri lungo la passerella fino al cilindro in fondo alla sala,
            mentre il costrutto si gira lentamente verso il rumore dei tuoi
            passi. Sul fianco del cilindro c'è una fila di cristalli
            incassati, e li strappi uno dopo l'altro finché i fasci si
            spengono. Il costrutto si ferma a metà di un passo e si affloscia
            nella vasca, e il liquido gli si richiude sopra. Ti tieni i
            cristalli che hai strappato.
          imposta: { rovine.mahr-kel: 1 }
          effetti: { cristalli.cristallo-carico: 1, cristalli.cristallo-sterile: 2, rep.raschiatori: 0.5 }
          pe: { tecnologia: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: Il fascio
          testo: |
            Il primo cristallo non viene via, e mentre tiri un fascio ti passa
            sul braccio e ti brucia la pelle fino alla carne. Il costrutto ti
            raggiunge sulla passerella e ti butta contro il cilindro, e resta
            chino sopra di te con la testa inclinata ad ascoltare. Scappi
            tenendoti il braccio, con le paratie di Mahr-Kel che si chiudono
            alle tue spalle, e non porti fuori niente.
          imposta: { rovine.mahr-kel: 1 }
          effetti: { ferite: 2 }
          vai: ponti-sospesi
      - testo: "Tenere il cuore lento"
        descrizione: "Ascolta i battiti. Un cuore lento è un cuore lontano."
        prova: { attributo: mentale, abilita: [resilienza, medicina], difficolta: Difficile }
        successo:
          titolo: Il cuore lontano
          testo: |
            Chiudi gli occhi e respiri con la pancia, sempre più piano, finché
            il cuore ti batte lento come nel sonno. Il costrutto gira la testa
            di qua e di là, poi si volta verso la vasca. Ti muovi lungo la
            passerella fra un battito e l'altro, e dalle rastrelliere prendi
            un cristallo carico e una fiala di fluido rosa. Il costrutto è
            ancora fermo sul bordo quando esci.
          imposta: { rovine.mahr-kel: 1 }
          effetti: { cristalli.cristallo-carico: 1, tonico: 1, rep.raschiatori: 0.5 }
          pe: { resilienza: 5 }
          vai: ponti-sospesi
        fallimento:
          titolo: Il salto in gola
          testo: |
            Il cuore rallenta, e quando il costrutto fa un passo verso di te
            ti salta in gola tutto in una volta. Lui lo sente, e gira la testa
            di scatto. Ti prende alla spalla con le dita senza unghie e ti
            stringe fino all'osso, e te ne liberi soltanto buttandoti giù
            dalla passerella. Scappi a mani vuote su per le sale di Mahr-Kel.
          imposta: { rovine.mahr-kel: 1 }
          effetti: { ferite: 2 }
          vai: ponti-sospesi
      - testo: "Prendere quello che c'è vicino alla porta e scappare"
        descrizione: "Sulla rastrelliera accanto all'ingresso c'è qualcosa. Il resto lo lasci a lui."
        costo: 2
        esito:
          titolo: Vicino alla porta
          testo: |
            Afferri dalla rastrelliera accanto all'ingresso le prime due cose
            che ti capitano sotto le mani e ti butti fuori. Il costrutto ti
            arriva addosso mentre sei sulla soglia e ti apre la schiena con la
            costola spezzata. Corri su per le sale di Mahr-Kel con le paratie
            che si chiudono alle tue spalle, e soltanto all'aperto guardi che
            cosa hai preso.
          imposta: { rovine.mahr-kel: 1 }
          effetti: { reliquie.scheggia: 2, ferite: 1 }
          vai: ponti-sospesi

  # ================================================================ al Grifone, la piastrina di Dorr
  - id: la-piastrina-di-dorr
    presso: grifone-di-ferro
    immagine: personaggi/dragna-gro-malog
    titolo: La piastrina di Dorr
    sommario: "Una piastrina d'ottone avvolta in un fazzoletto. Dragna tiene i registri dei turni di quarant'anni fa dietro il bancone."
    luogo: Locanda del Grifone di Ferro, il tavolo di Dragna
    area: ponti-sospesi
    requisiti: [rovine.dorr == 1]
    testo: |
      Posi la piastrina sul tavolo di Dragna ancora avvolta nel fazzoletto, in
      mezzo ai fogli dei turni. Lei la scopre con la punta di un dito e la
      gira verso la lampada per leggerla. Per un po' non dice niente, e
      intorno a voi il Grifone continua a fare il rumore di tutte le sere, con
      i boccali sui tavoli e il camino che tira male.

      Poi si alza, va dietro al bancone e torna con un registro dalla
      copertina di cuoio crepata, così vecchio che le pagine sono diventate
      del colore del tè. Lo sfoglia leccandosi il pollice e risale gli anni
      con la mano mozza a tenere il segno, finché si ferma su una pagina di
      quarant'anni fa e te la gira davanti. C'è la squadra di Vhar'Ul con tre
      nomi cerchiati in rosso. Due righe più sotto, scritta da un'altra mano,
      c'è una riga sola, *Arelan Dorr, turno singolo, recupero*. La colonna
      dell'uscita ha un'ora, e quella del rientro è vuota.

      «Il vecchio Ferro diceva che se n'era andato a Ghoran con la paga» dice
      Dragna piano, senza alzare gli occhi dalla pagina. «Diceva che si
      vergognava, e ci credevano tutti.»
    opzioni:
      - testo: "Raccontarle della paratia"
        descrizione: "Saldata da dentro, con il sigillo dei Raschiatori. E il taccuino."
        costo: 0
        esito:
          titolo: Tre nomi
          testo: |
            Le racconti della paratia saldata dall'interno, con il sigillo
            premuto nella colata ancora calda, e del taccuino con tre nomi in
            colonna e nessun segno accanto. Dragna appoggia il dito sui tre
            nomi cerchiati in rosso nel registro e li legge a voce bassa uno
            per uno, fino a *Benno*, che è l'ultimo.

            «È tornato giù a cercarli» dice. «Da solo, perché la Gilda non gli
            dava un'altra squadra.» Si passa la mano buona sulla testa rasata e
            la tiene lì un momento, sulla nuca.
      - testo: "Lasciarle la piastrina"
        descrizione: "Dorr era un Raschiatore. Le sue cose spettano ai Raschiatori."
        esito:
          titolo: L'ora del rientro
          testo: |
            Dragna avvolge di nuovo la piastrina nel fazzoletto e se la infila
            nella tasca della giubba, dalla parte del cuore. Poi intinge il
            pennino e, nella colonna rimasta vuota per quarant'anni, scrive
            l'ora del rientro di Arelan Dorr, quella di stasera, con la sua
            grafia squadrata che buca la carta a ogni punto.

            «Domani gli appendiamo una lanterna sul Ponte dei Morti» dice, e
            ripete a mezza voce la formula del ponte. «Una lanterna per nome.
            Una lanterna per ciò che pensavi di sapere di lui. E tu ci vieni, visto che l'hai riportato a casa.» Poi chiude il registro e ci batte sopra il palmo della mano buona, una volta sola, come si chiude un conto.
          imposta: { rovine.dorr: 2 }
          effetti: { rep.raschiatori: 1 }
          pe: { empatia: 5 }
