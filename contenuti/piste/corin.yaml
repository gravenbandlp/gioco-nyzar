  # ------------------------------------------------------------ 4 → 5 · prima strada: la Biblioteca
  - id: gli-organi-del-cinghiale
    presso: biblioteca-di-qir-azel
    immagine: personaggi/orvald-temmerin
    titolo: Senza architettura
    sommario: "Ulric Stanne ha fatto esaminare gli organi del cinghiale dal suo amico Orvald Temmerin. Orvald ha finito, e non è contento."
    luogo: Biblioteca di Qir-Azel, al tavolo lungo
    area: quartieri-alti
    requisiti: [pista.corin == 4, organi.cinghiale >= 1, invito >= 1]
    testo: |
      Due giorni fa hai lasciato l'involto a Ulric Stanne, e Ulric l'ha
      mandato all'Accademia con un ragazzo e un biglietto. Quando torni in
      Biblioteca gli organi sono di nuovo qui, sul tavolo lungo sotto il
      lampadario, aperti su un telo di lino e fissati con gli spilli. Accanto
      ci sono una fila di coltelli sottili e tre barattoli di liquido torbido,
      e c'è Orvald Temmerin, il preside dell'Accademia, che Ulric ti presenta
      con un cenno del mento.

      È alto e magro, con la barba grigia tagliata corta e una tunica grigia
      senza gioielli. Sulla spalla porta un corvo che guarda gli organi con
      più appetito di quanto sia educato. «Pett» dice Orvald, senza
      presentarsi lui. «È venuto per curiosità. Io sono venuto perché me
      l'ha chiesto Ulric, e perché in trent'anni di scavi una cosa così non
      l'avevo ancora vista.»

      {galateo Media fallita} Aspetti che si presenti, e lui non lo fa.
      Allunghi la mano al corvo per educazione, e Pett la guarda con lo
      stesso appetito che riserva agli organi.

      Con la punta di un coltello ti indica il cuore, grande come una pagnotta
      e diviso in camere che non comunicano fra loro. «Ho fatto le sezioni e i
      bagni, e l'ho confrontato con tutte le tavole anatomiche che Ulric mi ha
      fatto trovare» dice. «Questa roba non ha architettura vitale. Sembra un
      esperimento venuto male.» Pulisce la lama su uno straccio. «Eppure la
      bestia funzionava, e correva più forte di un cavallo. È questo che non
      mi piace.»

      {resistenza Facile fallita} L'odore dei barattoli ti arriva in gola
      tutto insieme. Deglutisci due volte e ti metti a studiare il
      lampadario con grande interesse.

      Ulric si è tolto il monocolo e lo pulisce sul panciotto rosso. Dalla
      finestra arrivano le campane della Cattedrale. *Un cerusico direbbe che
      era morta prima di nascere.* Pett gracchia piano una volta, e Orvald
      gli dà un colpetto sul becco con il dorso dell'unghia.
    opzioni:
      - testo: "Chiedere a Orvald che cosa ha visto"
        descrizione: "Orvald raramente risponde due volte alla stessa domanda. Conviene fargliela bene la prima."
        esito:
          titolo: Il cuore come una pagnotta
          testo: |
            Orvald ti fa avvicinare e ti mostra i polmoni, che non hanno
            un'entrata per l'aria, poi il fegato attraversato da un filo
            d'argento che lui ha seguito per un giorno intero senza trovarne la
            fine. Il sangue nel barattolo è grigio e granuloso come cenere
            bagnata. «Le bestie malate le conosco, ne tengo una ventina sotto
            spirito nel seminterrato» dice. «Questa sembra un esperimento
            venuto male. Il guaio è che è venuto bene lo stesso, visto che
            correva.»

            {medicina Media} Polmoni senza entrata non respirano, e un animale
            che non respira non corre. Lo sai da quando sei al mondo, e il
            cinghiale evidentemente no.

            Poi ti chiede se può tenere quello che resta per la sua collezione
            all'Accademia, e tu gli dici di sì, contento di non doverlo
            riportare a casa.
          pe: { medicina: 5 }
          effetti: { organi.cinghiale: -1, informazioni.segreto: 1, pista.corin: 1 }
      - testo: "Chiedere a Ulric se nei libri c'è qualcosa di simile"
        descrizione: "Ulric ha passato due notti fra i bestiari. Si vede dalle occhiaie, e da quanto ha voglia di parlarne."
        immagine: personaggi/ulric-stanne
        esito:
          titolo: I bestiari
          testo: |
            Ulric rimette il monocolo e ti porta davanti a uno scaffale di
            bestiari, tutti consumati nello stesso punto del dorso, dove il
            pollice di chi li tira fuori si appoggia da generazioni. Ha trovato
            cervi con le corna di cristallo, e un lupo di Tuarmir con il pelo
            che tagliava le mani. «Sono bestie che la Marea Grigia ha toccato,
            e le ha toccate facendole ammalare» dice. «Zoppicano e muoiono in
            un inverno. Il tuo cinghiale invece stava benissimo, e secondo
            Orvald non avrebbe dovuto reggersi in piedi.» Chiude il libro con
            tutte e due le mani. «Quando una cosa contraddice tutti i miei
            libri, di solito sbaglia la cosa. Questa volta non ci
            scommetterei.»

            Orvald intanto chiede di tenere gli organi per il seminterrato
            dell'Accademia, e Ulric glieli incarta come un pezzo di formaggio.
          pe: { accademiche: 5 }
          effetti: { organi.cinghiale: -1, informazioni.segreto: 1, pista.corin: 1 }
      - testo: "Guardare tu stesso, con un coltello in mano"
        descrizione: "Orvald ti porge un coltello dalla parte del manico. Vuole vedere se noti quello che ha notato lui."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Il filo d'argento
          testo: |
            Segui una delle vene d'argento con la punta del coltello, piano,
            trattenendo il fiato, finché ti accorgi che gira ad anello e torna su sé stessa senza
            portare da nessuna parte. Quando glielo dici, Orvald ti guarda per
            la prima volta con attenzione, e Pett salta dalla sua spalla al
            tavolo. «Io ci ho messo un giorno a vederlo» dice Orvald, e ti
            riprende il coltello dalle dita. «All'Accademia
            serve gente che guarda, se un giorno ti stanchi di farti caricare
            dai cinghiali.» Poi ti chiede se può tenere gli organi per il
            seminterrato, e tu glieli lasci.
          pe: { medicina: 10 }
          effetti: { organi.cinghiale: -1, informazioni.segreto: 1, pista.corin: 1 }
        fallimento:
          titolo: L'odore
          testo: |
            Ti chini sul telo con il coltello, e l'odore ti arriva tutto
            insieme, ferro bagnato con sotto un fondo dolciastro. Lo stomaco si
            chiude e devi appoggiarti al tavolo, con la fronte di colpo fredda.
            Orvald ti toglie il coltello
            di mano senza commenti e ti spiega lui quello che avresti dovuto
            vedere, una vena d'argento che gira ad anello e non porta da
            nessuna parte. Ulric ti versa un dito di vino buono e ti dice di
            berlo seduto. Gli organi, alla fine, se li porta via Orvald.
          effetti: { organi.cinghiale: -1, informazioni.segreto: 1, tormento: 0.5, pista.corin: 1 }
      - testo: "Prendere il coltello come a lezione"
        descrizione: "Il preside non dice a Ulric chi sei. Ti porge il coltello dalla parte del manico come fa in laboratorio, poi aspetta."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Come in laboratorio
          testo: |
            Orvald ti porge il coltello come se fossi lì da un'ora, e Pett
            scende dalla sua spalla per tirarti una manica, come fa con gli
            allievi che conosce. Lo prendi come lui vi fa prendere i cristalli
            in laboratorio, tenendolo fra due dita e lasciando morbido il polso,
            e segui una vena d'argento finché non gira ad anello e torna su sé
            stessa senza portare da nessuna parte. La mano resta ferma, e la
            cosa stupisce più te che lui.

            Lo dici ad alta voce. Orvald annuisce una volta. «Al primo anno ci
            avrebbe messo una settimana» dice a Ulric, e Ulric non capisce se è
            un complimento. Poi il preside ti chiede di aiutarlo a incartare gli
            organi per il seminterrato dell'Accademia, e mentre stringi lo spago
            ti ricorda che domani c'è lezione.
          pe: { medicina: 10 }
          effetti: { organi.cinghiale: -1, informazioni.segreto: 1, pista.corin: 1 }

  # ------------------------------------------------------------ 4 → 5 · seconda strada: l'alchimista
  - id: ampolle-e-rimedi
    immagine: ambientazione/ampolle-e-rimedi
    titolo: Ampolle e Rimedi
    sommario: "In Città Bassa c'è un alchimista che compra dai cacciatori quello che il macellaio butta. Ezio Tarlo di carcasse strane ne ha viste parecchie."
    luogo: Ampolle e Rimedi, Città Bassa
    area: citta-bassa
    requisiti: [pista.corin == 4]
    testo: |
      La bottega di Ezio Tarlo sta fra un ciabattino e un muro cieco, e la
      riconosci dall'odore prima che dall'insegna. Sulla vetrina qualcuno ha
      scritto a mano *Le pozioni si pagano prima di guardarle*, e sotto, con
      un altro inchiostro, *e anche dopo*. Dentro le mensole sono piene di
      bottiglie con l'etichetta scritta di fretta, e su alcune al posto del
      nome c'è soltanto un punto di domanda.

      {natura Media fallita} In una delle bottiglie con il punto di domanda
      galleggia qualcosa che potrebbe essere una radice o un dito. Più la
      guardi, meno sei sicuro di volerlo sapere.

      Ezio è un mezzelfo con i capelli color rame e una cicatrice che gli
      scende dal naso fino al mento. Porta un grembiule coperto di macchie, e
      le sue dita si muovono anche quando lui sta fermo. Mentre ti parla
      tappano e stappano una boccetta vuota. «Si fida della mia faccia o della
      mia bottiglia?» chiede prima ancora del buongiorno. «Ne scelga una, e
      poi paghi.»

      {ingannare Media} Una domanda così si fa per non dover rispondere a
      quelle degli altri. Le dita che tappano e stappano sono la parte più
      sincera di lui.

      Gli dici che vieni dalla caccia di Corin Ashdale, e Ezio si illumina.
      Da anni i cacciatori della Città Bassa gli portano le ghiandole che il
      macellaio butta via, e da qualche stagione anche le bestie mutate, che
      lui paga meglio. «Quelli dell'Accademia agitano le dita e chiamano
      tutto magia» dice, e si tocca la cicatrice come per controllare che ci
      sia ancora. «Io apro e annuso. Carne è carne, e fra noi ci si capisce.»
    opzioni:
      - testo: "Vendergli gli organi"
        descrizione: "Ezio li paga, e mentre conta le monete ti dice che cosa ci vede dentro."
        immagine: personaggi/ezio-tarlo
        requisiti: [organi.cinghiale >= 1]
        esito:
          titolo: Un carro rifatto
          testo: |
            Ezio apre la tela sul banco e annusa, poi fa una smorfia contenta e
            si pulisce le mani sul grembiule, che ne ha viste di peggio. Taglia una fetta di cuore con un coltello da pane e la guarda
            controluce, poi tira con due dita una vena d'argento che viene via
            intera come uno spago. «Questa bestia è montata a casaccio, come un
            carro rifatto con i pezzi di tre carri diversi» dice. «Il cuore
            pompa dove gli pare e i polmoni l'aria non la portano. Doveva
            cascare morta il primo giorno, e invece correva. Gli stregoni ci
            scriverebbero un libro, io ci faccio un unguento.» Conta le monete
            sul banco, poi ne riprende una perché dice che era sua, e non ti
            viene in mente niente per dimostrare il contrario.
          effetti: { organi.cinghiale: -1, monete: 11, informazioni.voce: 1, pista.corin: 1 }
      - testo: "Contrattare il prezzo degli organi"
        descrizione: "Ezio li vuole, si vede da come si tocca la cicatrice. Puoi farglieli pagare di più."
        requisiti: [organi.cinghiale >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Un prezzo da Biblioteca
          testo: |
            Gli dici che in Biblioteca c'è chi pagherebbe il doppio solo per
            guardarli, e che all'Accademia lo sanno. Ezio diventa rosso fino
            alla cicatrice. «Quelli dell'Accademia» dice, e sputa nel secchio
            della cenere. Poi conta le monete, una alla volta, guardandoti in
            faccia dopo ognuna nella speranza che tu cambi idea. Mentre incarta gli organi ti
            spiega che dentro sono montati a casaccio, con il cuore che pompa
            dove gli pare. «Doveva cascare morta il primo giorno. Invece
            correva, e io questa la chiamo maleducazione.»
          effetti: { organi.cinghiale: -1, monete: 18, informazioni.voce: 1, pista.corin: 1 }
        fallimento:
          titolo: Meno del dovuto
          testo: |
            Ezio ti lascia parlare fino in fondo, con il mento appoggiato al
            pugno, poi si gratta la cicatrice e
            ti ricorda che a Qir-Azel i cuori di cinghiale li compra soltanto
            lui. Ti offre meno del dovuto e te le conta in mano prima che tu abbia
            detto di sì. Mentre incarta gli organi borbotta che dentro sono
            montati a casaccio e che una bestia così doveva cascare morta il
            primo giorno. Poi aggiunge che ci farà un unguento per i calli, e
            ti guarda gli stivali con interesse professionale.
          effetti: { organi.cinghiale: -1, monete: 8, informazioni.voce: 1, pista.corin: 1 }
      - testo: "Chiedergli delle carcasse che gli portano i cacciatori"
        descrizione: "Gli organi del cinghiale non li hai. Ezio però ha visto altro, e ha voglia di vantarsene."
        immagine: personaggi/ezio-tarlo
        requisiti: [organi.cinghiale == 0]
        esito:
          titolo: Le bestie sbagliate
          testo: |
            Ezio ti porta nel retro, dove su una mensola tiene sotto spirito una
            lepre con due zampe di troppo e un cuore di capriolo grosso come un
            pugno. La lepre ha gli occhi aperti e un'aria offesa. «Da qualche
            stagione i cacciatori mi portano roba così» dice, e
            batte l'unghia sul barattolo della lepre. «Fuori sembrano bestie, e
            dentro sono montate a casaccio, come un carro rifatto con i pezzi
            di tre carri. Il cuore pompa dove gli pare, eppure correvano.
            Quelli dell'Accademia dicono che è la Marea, e intanto una non
            l'hanno mai aperta. Io dico che ci capisco poco, e almeno lo
            ammetto.»
          effetti: { informazioni.pettegolezzo: 1, pista.corin: 1 }
      - testo: "Comprare un tonico e lasciarlo parlare"
        descrizione: "Ezio parla meglio quando incassa. La boccetta forse funziona."
        requisiti: [organi.cinghiale == 0, monete >= 4]
        esito:
          titolo: Una boccetta verde
          testo: |
            Paghi una boccetta verde che secondo l'etichetta rimette in sesto,
            e Ezio diventa di colpo più loquace. Ti racconta del cuore di
            capriolo che tiene nel retro, diviso in camere che non comunicano,
            e della lepre che correva con due zampe in più. «Montate a casaccio
            come un carro rifatto con i pezzi di tre carri, eppure andavano»
            dice. Mentre ti dà il resto ti consiglia di non bere il tonico a
            stomaco vuoto, e sul perché resta vago.

            {medicina Facile} Dal colore e dall'odore, è soprattutto ortica
            nella grappa. Il resto lo scoprirà il tuo stomaco.
          effetti: { monete: -4, tonico: 1, informazioni.pettegolezzo: 1, pista.corin: 1 }
      - testo: "Fargli il prezzo dei Ponti"
        descrizione: "Sai quanto paga al Mercato dei Nodi un erborista di Laresh per una ghiandola di bestia mutata. Ezio lo sa anche lui, e sa che lo sai."
        immagine: personaggi/ezio-tarlo
        quando: [origine.mercante-dei-ponti >= 1, organi.cinghiale >= 1]
        esito:
          titolo: Il prezzo dei Ponti
          testo: |
            Gli dici quanto paga al Mercato dei Nodi un erborista di Laresh per
            una ghiandola di bestia mutata, e quanto ci ricarica sopra quando la
            rivende. Ezio smette di stappare la boccetta, e le dita gli restano
            ferme a mezz'aria. «Un mercante dei
            Ponti» dice, e si tocca la cicatrice. «L'avevo capito dalle scarpe.»

            Conta le monete una alla volta senza discutere, e intanto ti spiega
            che dentro la bestia è montata a casaccio, come un carro rifatto con
            i pezzi di tre carri diversi. Il cuore pompa dove gli
            pare e i polmoni l'aria non la portano. «Doveva cascare morta il
            primo giorno, e invece correva» dice, incartando gli organi. «Questo
            sul tuo registro non scriverlo.»
          effetti: { organi.cinghiale: -1, monete: 18, informazioni.voce: 1, pista.corin: 1 }

  # ------------------------------------------------------------ 5 → 6 · la partenza
  - id: corin-parte-per-laresh
    presso: grifone-di-ferro
    immagine: personaggi/corin-ashdale
    titolo: La carovana per Laresh
    sommario: "Domani all'alba la carovana di Corin parte dal Mercato dei Nodi. Stasera ti ha cercato per tutta la sala per salutarti."
    luogo: Locanda del Grifone di Ferro, la sera prima della partenza
    area: ponti-sospesi
    # Corin parla di Liaren come di una che sta bene: esclusi i passi di Acciaio e Ira 1–5.
    requisiti: [pista.corin == 5, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      Corin ti trova al Grifone mentre Brunella spegne le lanterne della
      sala, e si siede sul bordo della sedia come se avesse fretta, anche se
      di fretta non ne ha. La carovana per Laresh parte all'alba, dice, con
      sei carri di sale e due guardie che costano più del carico. Lui viaggerà
      sul primo carro, seduto su un cuscino ricamato che si è fatto portare
      da casa.

      {armi-da-mischia Media} Due guardie per sei carri bastano contro i
      ladri di galline. Contro qualunque altra cosa servono a far dormire
      tranquillo Corin.

      Ti porge una lettera sigillata con la cera verde della Gilda. «È una
      presentazione per la Casa dei Nodi» dice. «Ho scritto che sei una
      persona di cui ci si può fidare, e che chi fa uno sgarbo a te lo fa a
      me. Il secondo pezzo vale quello che vale, e io in Gilda conto ancora
      qualcosa. Con la firma di un membro eletto i Custodi di Passaggio ti
      scrivono nel registro della Gilda senza chiederti la commissione.» Sul
      retro c'è il tuo nome, sbagliato alla prima lettera e corretto sopra
      con cura in un inchiostro più scuro.

      {empatia Facile} Ha corretto il tuo nome invece di riscrivere la
      lettera da capo. Gli premeva che restasse quella scritta di getto.

      Poi si schiarisce la voce e ti promette che tornerà prima dell'inverno
      o subito dopo, con il vino buono di Laresh e una storia sua da
      raccontare a Liaren, per una volta. Ride per primo, e poi aspetta di
      vedere se ridi anche tu.
    opzioni:
      - testo: "Accompagnarlo all'imbocco del Ponte delle Mille Corde"
        descrizione: "All'alba, fino al gabbiotto dei Custodi di Passaggio, dove il ponte finisce e comincia la strada."
        esito:
          titolo: Il gabbiotto dei Custodi
          testo: |
            All'alba il Ponte delle Mille Corde è bagnato di brina e vibra sotto
            le ruote, e il freddo ti sale dalle suole.

            {atletica Facile} Le assi vibrano a ogni ruota, e le gambe prendono
            il passo dei carri prima che tu ci pensi.

            Cammini accanto al primo carro fino all'imbocco, e Corin
            per tutto il tragitto ti indica le botteghe e ti racconta chi deve
            soldi a chi, come se partisse per un anno. Al gabbiotto dei Custodi
            di Passaggio paga la gabella per tutta la carovana e fa vedere la
            tua lettera all'ispettore dei dazi, che scrive il tuo nome nel
            registro della Gilda senza alzare gli occhi. Poi Corin si sporge dal
            carro e ti stringe la mano fra le sue. Lo guardi finché la carovana
            piega verso il Ponte del Conciatore, con il suo fazzoletto bianco
            che sventola dal cassone, e resti lì un po' più a lungo di quanto
            serva per salutare qualcuno.
          pe: { empatia: 5 }
          imposta: { licenza-gilda: 1 }
          effetti: { rep.gilda: 1, racconto: 1, pista.corin: 1 }
      - testo: "Salutarlo dalla finestra"
        descrizione: "Dalla finestra in cima alle scale del Grifone si vede passare tutto il ponte."
        esito:
          titolo: Il fazzoletto
          testo: |
            Ti svegli prima dell'alba senza averlo deciso e vai alla finestra in
            cima alle scale, scalzo, con le assi gelate sotto i piedi nudi.
            Giù, sul Ponte delle Mille Corde, passano i carri
            uno dopo l'altro con le lanterne ancora accese. Corin è sul primo,
            seduto sul suo cuscino, e cerca con gli occhi le finestre del
            Grifone finché trova la tua. Si toglie il fazzoletto dal taschino e
            lo sventola, e per farlo quasi perde l'equilibrio. Lo saluti con la
            mano finché la carovana sparisce oltre l'imbocco, poi torni a letto
            con la lettera sul cuscino.
          imposta: { licenza-gilda: 1 }
          effetti: { rep.gilda: 1, racconto: 1, tormento: -0.5, pista.corin: 1 }
      - testo: "Chiedergli un ultimo favore"
        descrizione: "Corin è la migliore fonte di pettegolezzi di Qir-Azel, e stasera ha voglia di regalare qualcosa."
        quando: [pista.teatro == 0]
        esito:
          titolo: L'ultimo pettegolezzo
          testo: |
            Gli chiedi di lasciarti una cosa che in città non sappiano tutti.
            Corin si illumina, si guarda intorno nella sala ormai vuota e si
            china verso di te. Ti racconta che Orazio Belcanto cerca gente per
            la Promessa dell'Arpia, anche gente che non ha mai recitato, a
            patto che sul palco riesca a restare seria. Poi aggiunge, più piano,
            che della rivalità fra Orazio e Liaren nessuno dei due ricorda più
            l'inizio, e che secondo lui è cominciata con un duetto andato
            storto. All'alba, quando la carovana passa sotto il Grifone, ti
            saluta con il fazzoletto, e lo sventola ancora quando ormai non può
            più vederti.
          imposta: { licenza-gilda: 1 }
          effetti: { informazioni.pettegolezzo: 1, rep.gilda: 1, racconto: 1, pista.corin: 1 }
      # Variante per chi è già nella compagnia di Orazio: il pettegolezzo sul teatro lo sa già.
      - testo: "Chiedergli un ultimo favore"
        descrizione: "Corin è la migliore fonte di pettegolezzi di Qir-Azel, e stasera ha voglia di regalare qualcosa."
        quando: [pista.teatro >= 1]
        esito:
          titolo: L'ultimo pettegolezzo
          testo: |
            Gli chiedi di lasciarti una cosa che in città non sappiano tutti.
            Corin si illumina, si guarda intorno nella sala ormai vuota e si
            china verso di te. Ti racconta che Orazio Belcanto, da quando ti ha
            preso nella compagnia, parla di te in tutte le taverne dei Quartieri
            Alti, e che ogni volta ti descrive un po' più alto. Poi aggiunge,
            più piano, che della rivalità fra Orazio e Liaren nessuno dei due ricorda più
            l'inizio, e che secondo lui è cominciata con un duetto andato
            storto. All'alba, quando la carovana passa sotto il Grifone, ti
            saluta con il fazzoletto, e lo sventola ancora quando ormai non può
            più vederti.
          imposta: { licenza-gilda: 1 }
          effetti: { informazioni.pettegolezzo: 1, rep.gilda: 1, racconto: 1, pista.corin: 1 }
