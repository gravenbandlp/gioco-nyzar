  # ------------------------------------------------------------ 1 → 2 · i cavalli
  - id: scuderie-della-zanna-rotta
    presso: scuderie-della-zanna-rotta
    immagine: ambientazione/scuderie-della-zanna-rotta
    titolo: Le Scuderie della Zanna Rotta
    sommario: "Corin ti aspetta alle Scuderie della Zanna Rotta con un corno nuovo, e il padrone odia gli orchi."
    luogo: Scuderie della Zanna Rotta, Città Bassa
    area: citta-bassa
    requisiti: [pista.corin == 1]
    testo: |
      Le Scuderie della Zanna Rotta stanno in fondo alla Città Bassa, e
      sull'insegna un cavallo da guerra si impenna su un orco tagliato in due,
      con una zanna d'orco spezzata inchiodata sotto.

      {origine figlio-della-citta-bassa} Quell'insegna la conosci da bambino,
      da prima della zanna.

      {origine fuggiasco-di-ghoran} Guardi l'orco tagliato in due con un
      piacere che ti mette a disagio.

      Corin ti aspetta nel cortile con al collo un corno d'ottone nuovo e gli
      stivali da caccia che scricchiolano. Dolovan Stroud esce dalla stalla
      seguito da un cavallo grigio enorme che gli appoggia il muso sulla
      spalla. «Squash» dice. «Vuol dire schiacciare, e avevo in mente nomi
      meno gentili.»

      Davanti alla stalla aspettano quattro cavalli sellati, e l'ultimo, un
      baio con una cicatrice sulla spalla, ti guarda con un occhio solo.

      {cavalcare Facile} Il baio ha la bocca morbida, mentre il sauro accanto
      tiene le orecchie indietro.
    opzioni:
      - testo: "Farti raccontare la bestia da Stroud"
        descrizione: "La Foresta Strisciante era il suo territorio di caccia, e sa che cosa aspettarti."
        immagine: personaggi/dolovan-stroud
        prova: { attributo: sociale, abilita: [empatia, natura], difficolta: Media }
        successo:
          titolo: Diciassette centimetri
          testo: |
            Stroud ti porta nella selleria e col gesso disegna un'impronta lunga quanto la tua mano
            aperta, il doppio di quella di un cinghiale normale. «Sotto il Gradone Rosso un mio socio
            ha trovato caprioli squartati e lasciati senza un morso» dice. «Una bestia che ammazza
            senza mangiare ha il sangue guasto.» Ti consiglia di seguire le tracce verso la scarpata,
            attento alle fosse dei cacciatori e agli Spiumatori.
          pe: { natura: 5 }
          effetti: { informazioni.pettegolezzo: 1, pista.corin: 1 }
        fallimento:
          titolo: Il resto lo vedrete
          testo: |
            Stroud ascolta le tue domande guardando Squash, che gli mastica piano
            il bavero. «È grosso e ha brutte abitudini, il resto lo vedrete da
            voi.» Torna nella stalla a controllare un ferro, e Corin ti batte una
            mano sulla spalla assicurandoti che il signor Stroud fa così con
            tutti.
          effetti: { pista.corin: 1, scandalo: 0.5 }
      - testo: "Scegliere il cavallo da solo"
        descrizione: "Quattro cavalli sellati, e uno solo ti sta guardando. Gli altri guardano il fieno."
        prova: { attributo: fisico, abilita: [cavalcare, addestrare-animali], difficolta: Media }
        successo:
          titolo: Il baio con la cicatrice
          testo: |
            Passi lungo la fila con la mano aperta e ti fermi davanti al baio in fondo. Ti annusa le dita, e
            quando gli monti in sella non si sposta di un passo. «La cicatrice ce l'aveva già quando l'ho
            comprato» dice Stroud, a braccia incrociate. «Lui non se la ricorda, e per questo ha un carattere
            migliore del mio.» Dalla staccionata Corin ti applaude, da solo.
          pe: { cavalcare: 5 }
          effetti: { pista.corin: 1 }
        fallimento:
          titolo: Lo zoccolo
          testo: |
            Scegli il sauro più alto, perché è il più bello, e appena metti il
            piede nella staffa ti pesta un piede. Stroud lo calma con una parola e
            ti indica il baio in fondo, quello con la cicatrice. «Il sauro morde i
            mercanti, e oggi lo hai salvato da Corin.» Zoppichi fino alla staffa
            giusta, e lo zoccolo te lo senti fino a sera.
          effetti: { ferite: 0.5, pista.corin: 1 }
      - testo: "Lasciar scegliere Corin"
        descrizione: "Paga lui, e si vede che non vede l'ora di scegliere."
        costo: 0
        esito:
          titolo: Una domanda a Stroud
          testo: |
            Corin passa davanti ai cavalli con le mani dietro la schiena e, per
            fare conversazione, chiede a Stroud se gli è mai capitato di parlare
            con un orco.

            «Una volta, e ha smesso presto» dice Stroud, stringendo una cinghia.

            Corin ride da solo e sceglie per te il baio con la cicatrice, perché
            secondo lui ha lo sguardo intelligente. Stroud non gli rivolge più la
            parola fino a sera.
          effetti: { pista.corin: 1 }
      - testo: "Parlare a Stroud dei sorveglianti di Ghoran"
        descrizione: "Stroud odia gli orchi, e tu gli orchi li hai visti dal basso, con la frusta in mano."
        immagine: personaggi/dolovan-stroud
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Quelli dei recinti
          testo: |
            Gli dici che a Ghoran i sorveglianti erano orchi, e ti accorgi dei
            pugni chiusi solo quando Stroud li guarda. Lui ti porta nella selleria
            e disegna col gesso un'impronta grande il doppio di quella di un
            cinghiale. Sotto il Gradone Rosso ha trovato caprioli squartati e
            lasciati senza un morso, e laggiù girano gli Spiumatori. «Per ogni orco
            che ti trovi davanti, la birra te la offro io.»
          pe: { natura: 5 }
          effetti: { informazioni.pettegolezzo: 1, pista.corin: 1 }
      - testo: "Ascoltare i cavalli come al Circolo"
        descrizione: "Al Circolo ti hanno insegnato ad ascoltare una bestia prima di guardarla."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Il respiro del baio
          testo: |
            Passi lungo la fila senza toccare nessuno e li ascolti uno per uno. Il sauro
            soffia corto, il baio in fondo soffia lungo e tranquillo e allunga il muso
            verso la tua manica, e quando gli appoggi il palmo sulla cicatrice non si
            sposta. «Il Circolo» dice Stroud, guardandoti le mani. «Lassù i cavalli li
            ascoltate prima di sellarli, in città si fa al contrario e si vede.»
          pe: { cavalcare: 5 }
          effetti: { pista.corin: 1 }

  # ------------------------------------------------------------ 3 → 4 · il banchetto
  - id: il-banchetto-del-cinghiale
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Il banchetto del cinghiale
    sommario: "La bestia della Foresta Strisciante è finita nei pentoloni del Grifone, e Corin offre a tutta la sala."
    luogo: Locanda del Grifone di Ferro, la sera
    area: ponti-sospesi
    # Liaren in cucina: esclusi i passi di Acciaio e Ira 1–5. Con pista.pelle >= 5 Ottone è stato
    # arrestato, e Corin ne parla nella variante il-banchetto-del-cinghiale-dopo-i-malgrani.
    requisiti: [pista.corin == 3, pista.pelle < 5, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      Brunella ha bruciato nel cortile le parti della bestia dove il sangue
      era grigio, e il resto l'ha messo a marinare nel vino rosso. Stasera la
      sala è piena, e la carne è scura e dolce, con un retrogusto di ferro
      che un Raschiatore fa notare ad alta voce, prendendosi un calcio sotto
      il tavolo.

      {origine apprendista-raschiatore} Due dei Raschiatori vicino alla scala
      li conosci dalle piattaforme, e alzano il boccale verso di te prima che
      verso Corin.

      Corin siede a capotavola con il fazzoletto nel colletto, e a metà cena
      ti fa scivolare accanto al piatto un borsello e le redini del baio,
      legate con un nastro. «Il cavallo è tuo. Stroud me l'ha venduto, e io
      non ho voluto sapere quanto.»

      Al terzo bicchiere parla della Gilda. «È corrotta, certo, però senza la
      Gilda Qir-Azel si ferma, e finché ci sono Cordani e Irsa Valbrun un po'
      di decenza resta. Ottone Malgrani invece è un fabbricante di catene con
      i baffi pettinati, e mi odia quanto lo odio io.»

      Sul bancone, avvolti nella tela cerata e nel sale, aspettano gli organi
      della bestia, con una vena d'argento che luccica dove la tela si è
      aperta. Brunella li ha messi da parte perché decida tu.
    opzioni:
      - testo: "Tenere gli organi per farli esaminare"
        descrizione: "Corin dice che in città qualcuno pagherebbe per guardarli da vicino. Magari in Biblioteca o all'Accademia."
        esito:
          titolo: Nella tela cerata
          testo: |
            Prendi l'involto dal bancone, più pesante di quanto pensavi e freddo
            anche attraverso il sale. Brunella ti dice di tenerlo lontano dalla
            sua cucina, con il mestolo puntato verso la porta. «Ulric Stanne, in
            Biblioteca» dice Corin con la bocca piena. «Ha un amico all'Accademia
            che apre le cose per vedere come sono fatte dentro.»
          effetti: { monete: 35, oggetto.cavallo-da-guerra: 1, organi.cinghiale: 1, rep.gilda: 0.5, racconto: 1, pista.corin: 1 }
      - testo: "Venderli subito a un mercante di passaggio"
        descrizione: "Al tavolo vicino alla porta un mercante di pelli guarda l'involto da quando sei entrato."
        esito:
          titolo: Il mercante di Pannion
          testo: |
            Il mercante di pelli viene da Pannion e ha le unghie nere di concia.
            Solleva un angolo della tela, guarda dentro più a lungo del necessario
            e ti offre un buon prezzo senza contrattare, cosa che a Qir-Azel
            succede di rado. A Corin, che gli chiede che cosa ci farà, risponde
            che a Pannion le cose strane si vendono sempre, e se ne va prima del
            dolce.
          effetti: { monete: 41, oggetto.cavallo-da-guerra: 1, rep.gilda: 0.5, racconto: 1, pista.corin: 1 }
      - testo: "Lasciarli a Brunella"
        descrizione: "Il resto della bestia l'ha già bruciato lei, nel cortile. Sa che cosa farne."
        esito:
          titolo: Il fuoco nel cortile
          testo: |
            Fai un cenno a Brunella, e lei porta l'involto nel cortile sul retro.
            Dalla finestra la vedi rovesciarlo sulle braci e rimestare con il
            forcone finché la tela smette di sfrigolare, in un fumo chiaro che
            puzza di ferro bagnato. Quando rientra si lava le mani due volte, e
            sul registro della locanda accanto al tuo nome segna una notte.
          effetti: { monete: 35, oggetto.cavallo-da-guerra: 1, alloggio.grifone: 1, rep.gilda: 0.5, racconto: 1, pista.corin: 1 }
      - testo: "Benedire il fuoco nel cortile"
        descrizione: "Sulle braci di Brunella, una preghiera al Grande Albero Rosso a quella bestia non la nega nessuno."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La preghiera sulle braci
          testo: |
            Segui Brunella nel cortile, lei rovescia l'involto sulle braci e tu
            dici sopra il fumo una preghiera breve al Grande Albero Rosso, come ti
            ha insegnato Vantes.

            {magia Facile} Le vene d'argento sfrigolano più a lungo della carne, e
            il Mana che ci girava dentro se ne va con il fumo, storto.

            Rientrando, Brunella ti segna una notte sul registro. «Per la
            preghiera, che ha fatto puzzare meno il fumo.»
          effetti: { monete: 35, oggetto.cavallo-da-guerra: 1, alloggio.grifone: 1, rep.gilda: 0.5, racconto: 1, pista.corin: 1 }

  # Variante: Ottone Malgrani è già stato arrestato (pista.pelle >= 5, quindi anche pista.acciaio >= 8).
  - id: il-banchetto-del-cinghiale-dopo-i-malgrani
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Il banchetto del cinghiale
    sommario: "La bestia della Foresta Strisciante è finita nei pentoloni del Grifone, e Corin offre a tutta la sala."
    luogo: Locanda del Grifone di Ferro, la sera
    area: ponti-sospesi
    requisiti: [pista.corin == 3, pista.pelle >= 5]
    testo: |
      Brunella ha bruciato nel cortile le parti della bestia dove il sangue
      era grigio, e il resto l'ha messo a marinare nel vino rosso. Stasera la
      sala è piena, e la carne è scura e dolce, con un retrogusto di ferro
      che un Raschiatore fa notare ad alta voce, prendendosi un calcio sotto
      il tavolo.

      {origine apprendista-raschiatore} Due dei Raschiatori vicino alla scala
      li conosci dalle piattaforme, e alzano il boccale verso di te prima che
      verso Corin.

      Corin siede a capotavola con il fazzoletto nel colletto, e a metà cena
      ti fa scivolare accanto al piatto un borsello e le redini del baio. «Il
      cavallo è tuo. Stroud me l'ha venduto, e io non ho voluto sapere
      quanto.»

      Al terzo bicchiere parla della Gilda. «È corrotta, certo, però senza la
      Gilda Qir-Azel si ferma. Ottone Malgrani era un fabbricante di catene
      con i baffi pettinati, e adesso le catene le porta lui. Stasera brindo
      piano, per educazione.»

      {empatia Media} Il bicchiere gli si ferma a metà strada, e la vendetta
      gli sta stretta come le scarpe nuove.

      Sul bancone, avvolti nella tela cerata e nel sale, aspettano gli organi
      della bestia, con una vena d'argento che luccica dove la tela si è
      aperta. Brunella li ha messi da parte perché decida tu.
    opzioni:
      - testo: "Tenere gli organi per farli esaminare"
        descrizione: "Corin dice che in città qualcuno pagherebbe per guardarli da vicino. Magari in Biblioteca o all'Accademia."
        esito:
          titolo: Nella tela cerata
          testo: |
            Prendi l'involto dal bancone, più pesante di quanto pensavi e freddo
            anche attraverso il sale. Brunella ti dice di tenerlo lontano dalla
            sua cucina, con il mestolo puntato verso la porta. «Ulric Stanne, in
            Biblioteca» dice Corin con la bocca piena. «Ha un amico all'Accademia
            che apre le cose per vedere come sono fatte dentro.»
          effetti: { monete: 35, oggetto.cavallo-da-guerra: 1, organi.cinghiale: 1, rep.gilda: 0.5, racconto: 1, pista.corin: 1 }
      - testo: "Venderli subito a un mercante di passaggio"
        descrizione: "Al tavolo vicino alla porta un mercante di pelli guarda l'involto da quando sei entrato."
        esito:
          titolo: Il mercante di Pannion
          testo: |
            Il mercante di pelli viene da Pannion e ha le unghie nere di concia.
            Solleva un angolo della tela, guarda dentro più a lungo del necessario
            e ti offre un buon prezzo senza contrattare, cosa che a Qir-Azel
            succede di rado. A Corin, che gli chiede che cosa ci farà, risponde
            che a Pannion le cose strane si vendono sempre, e se ne va prima del
            dolce.
          effetti: { monete: 41, oggetto.cavallo-da-guerra: 1, rep.gilda: 0.5, racconto: 1, pista.corin: 1 }
      - testo: "Lasciarli a Brunella"
        descrizione: "Il resto della bestia l'ha già bruciato lei, nel cortile. Sa che cosa farne."
        esito:
          titolo: Il fuoco nel cortile
          testo: |
            Fai un cenno a Brunella, e lei porta l'involto nel cortile sul retro.
            Dalla finestra la vedi rovesciarlo sulle braci e rimestare con il
            forcone finché la tela smette di sfrigolare, in un fumo chiaro che
            puzza di ferro bagnato. Quando rientra si lava le mani due volte, e
            sul registro della locanda accanto al tuo nome segna una notte.
          effetti: { monete: 35, oggetto.cavallo-da-guerra: 1, alloggio.grifone: 1, rep.gilda: 0.5, racconto: 1, pista.corin: 1 }
      - testo: "Benedire il fuoco nel cortile"
        descrizione: "Sulle braci di Brunella, una preghiera al Grande Albero Rosso a quella bestia non la nega nessuno."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La preghiera sulle braci
          testo: |
            Segui Brunella nel cortile, lei rovescia l'involto sulle braci e tu
            dici sopra il fumo una preghiera breve al Grande Albero Rosso, come ti
            ha insegnato Vantes.

            {magia Facile} Le vene d'argento sfrigolano più a lungo della carne, e
            il Mana che ci girava dentro se ne va con il fumo, storto.

            Rientrando, Brunella ti segna una notte sul registro. «Per la
            preghiera, che ha fatto puzzare meno il fumo.»
          effetti: { monete: 35, oggetto.cavallo-da-guerra: 1, alloggio.grifone: 1, rep.gilda: 0.5, racconto: 1, pista.corin: 1 }

  # ------------------------------------------------------------ 4 → 5 · prima strada: la Biblioteca
  - id: gli-organi-del-cinghiale
    presso: biblioteca-di-qir-azel
    immagine: personaggi/orvald-temmerin
    titolo: Senza architettura
    sommario: "Ulric Stanne ha fatto esaminare gli organi del cinghiale a Orvald Temmerin, che non è contento."
    luogo: Biblioteca di Qir-Azel, al tavolo lungo
    area: quartieri-alti
    requisiti: [pista.corin == 4, organi.cinghiale >= 1, invito >= 1]
    testo: |
      Ulric Stanne ha mandato l'involto all'Accademia, e adesso gli organi
      sono qui, sul tavolo lungo della Biblioteca, aperti su un telo di lino
      fra coltelli e barattoli di liquido torbido. Accanto c'è Orvald
      Temmerin, il preside dell'Accademia, con sulla spalla un corvo che
      guarda gli organi con troppo appetito. «Pett» dice Orvald, senza
      presentarsi lui. «Lui è venuto per curiosità, io perché in trent'anni di
      scavi una cosa così non l'avevo vista.»

      {origine allievo-di-torvessa} Orvald a te non si presenta perché ti vede
      in aula ogni settimana, e Pett gira la testa di lato come con gli
      allievi che conosce.

      Con la punta di un coltello ti indica il cuore, grande come una pagnotta
      e diviso in camere che non comunicano. «Non ha architettura vitale,
      sembra un esperimento venuto male. Eppure la bestia correva più forte di
      un cavallo, ed è questo che non mi piace.»
    opzioni:
      - testo: "Chiedere a Orvald che cosa ha visto"
        descrizione: "Orvald raramente risponde due volte alla stessa domanda. Conviene fargliela bene la prima."
        esito:
          titolo: Il cuore come una pagnotta
          testo: |
            Orvald ti mostra i polmoni, che non hanno un'entrata per l'aria, e il
            fegato attraversato da un filo d'argento che ha seguito per un giorno
            intero senza trovarne la fine. «Le bestie malate le conosco, ne tengo
            una ventina sotto spirito» dice. «Questa è venuta male e correva lo
            stesso.» Ti chiede se può tenere quello che resta per la sua
            collezione all'Accademia, e gli dici di sì.
          pe: { medicina: 5 }
          effetti: { organi.cinghiale: -1, informazioni.segreto: 1, pista.corin: 1 }
      - testo: "Chiedere a Ulric se nei libri c'è qualcosa di simile"
        descrizione: "Ulric ha passato due notti fra i bestiari. Si vede dalle occhiaie, e da quanto ha voglia di parlarne."
        immagine: personaggi/ulric-stanne
        esito:
          titolo: I bestiari
          testo: |
            Ulric ti mostra nei bestiari cervi con le corna di cristallo e un lupo
            di Tuarmir dal pelo che tagliava le mani. «La Marea Grigia le ha fatte
            ammalare, e muoiono in un inverno, mentre il tuo cinghiale stava
            benissimo» dice. «Quando una cosa contraddice i miei libri di solito
            sbaglia la cosa, e questa volta non ci scommetterei.» Orvald intanto
            si fa incartare gli organi per il seminterrato dell'Accademia.
          pe: { accademiche: 5 }
          effetti: { organi.cinghiale: -1, informazioni.segreto: 1, pista.corin: 1 }
      - testo: "Guardare tu stesso, con un coltello in mano"
        descrizione: "Orvald ti porge un coltello dalla parte del manico. Vuole vedere se noti quello che ha notato lui."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Il filo d'argento
          testo: |
            Segui una vena d'argento con la punta del coltello finché ti accorgi che gira ad anello e
            torna su sé stessa senza portare da nessuna parte, e Orvald ti guarda per la prima volta
            con attenzione. «Io ci ho messo un giorno a vederlo. All'Accademia serve gente che guarda,
            se un giorno ti stanchi dei cinghiali.» Poi si tiene gli organi per il seminterrato.
          pe: { medicina: 10 }
          effetti: { organi.cinghiale: -1, informazioni.segreto: 1, pista.corin: 1 }
        fallimento:
          titolo: L'odore
          testo: |
            Ti chini sul telo e l'odore ti arriva tutto insieme, ferro bagnato con
            un fondo dolciastro, tanto che devi appoggiarti al tavolo con la
            fronte fredda. Orvald ti toglie il coltello di mano e ti spiega lui la
            vena d'argento che gira ad anello senza portare da nessuna parte.
            Ulric ti versa un dito di vino buono, e gli organi alla fine se li
            porta via Orvald.
          effetti: { organi.cinghiale: -1, informazioni.segreto: 1, tormento: 1, pista.corin: 1 }
      - testo: "Prendere il coltello come a lezione"
        descrizione: "Il preside non dice a Ulric chi sei, e ti porge il coltello come fa in laboratorio."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Come in laboratorio
          testo: |
            Prendi il coltello come Orvald vi fa prendere i cristalli in
            laboratorio, con il polso morbido, e segui una vena d'argento finché
            non gira ad anello senza portare da nessuna parte. La mano resta
            ferma, e la cosa stupisce più te che lui. «Al primo anno ci avrebbe
            messo una settimana» dice Orvald a Ulric, e mentre incartate gli
            organi ti ricorda che domani c'è lezione.
          pe: { medicina: 10 }
          effetti: { organi.cinghiale: -1, informazioni.segreto: 1, pista.corin: 1 }

  # ------------------------------------------------------------ 4 → 5 · seconda strada: l'alchimista
  - id: ampolle-e-rimedi
    immagine: ambientazione/ampolle-e-rimedi
    titolo: Ampolle e Rimedi
    sommario: "In Città Bassa l'alchimista Ezio Tarlo compra dai cacciatori quello che il macellaio butta."
    luogo: Ampolle e Rimedi, Città Bassa
    area: citta-bassa
    requisiti: [pista.corin == 4]
    testo: |
      La bottega di Ezio Tarlo sta fra un ciabattino e un muro cieco, e la
      riconosci dall'odore prima che dall'insegna. Sulla vetrina c'è scritto
      *Le pozioni si pagano prima di guardarle*, e dentro molte etichette
      hanno un punto di domanda al posto del nome.

      {origine accolito-del-velo} In Cattedrale ogni boccetta ha il nome
      scritto in bella, e a quei punti di domanda la mano ti cerca una matita.

      Ezio è un mezzelfo con i capelli color rame e una cicatrice dal naso al
      mento, e le sue dita tappano e stappano una boccetta vuota anche quando
      lui sta fermo. «Si fida della mia faccia o della mia bottiglia?» chiede
      prima del buongiorno.

      Quando sente della caccia di Corin Ashdale si illumina, perché da
      qualche stagione i cacciatori gli portano anche le bestie mutate, che
      paga meglio. «Quelli dell'Accademia chiamano tutto magia. Io la carne la
      apro e la annuso.»
    opzioni:
      - testo: "Vendergli gli organi"
        descrizione: "Ezio li paga, e mentre conta le monete ti dice che cosa ci vede dentro."
        immagine: personaggi/ezio-tarlo
        requisiti: [organi.cinghiale >= 1]
        esito:
          titolo: Un carro rifatto
          testo: |
            Ezio apre la tela e tira con due dita una vena d'argento che viene via intera come uno spago. «Questa bestia è montata a
            casaccio, come un carro rifatto con i pezzi di tre carri diversi. Doveva cascare morta il primo giorno, e invece correva.
            Gli stregoni ci scriverebbero un libro, io ci faccio un unguento.» Conta le monete, poi ne riprende una perché dice che
            era sua.
          effetti: { organi.cinghiale: -1, monete: 11, informazioni.voce: 1, pista.corin: 1 }
      - testo: "Contrattare il prezzo degli organi"
        descrizione: "Ezio li vuole, si vede da come si tocca la cicatrice. Puoi farglieli pagare di più."
        requisiti: [organi.cinghiale >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Un prezzo da Biblioteca
          testo: |
            Gli dici che in Biblioteca c'è chi pagherebbe il doppio solo per guardarli, e
            Ezio diventa rosso fino alla cicatrice. «Quelli dell'Accademia» dice, e sputa nel
            secchio della cenere. Conta le monete una alla volta guardandoti in faccia dopo
            ognuna, poi incarta gli organi borbottando che la bestia doveva cascare morta il
            primo giorno. «Invece correva, e io questa la chiamo maleducazione.»
          effetti: { organi.cinghiale: -1, monete: 18, informazioni.voce: 1, pista.corin: 1 }
        fallimento:
          titolo: Meno del dovuto
          testo: |
            Ezio ti lascia parlare con il mento appoggiato al pugno, poi ti
            ricorda che a Qir-Azel i cuori di cinghiale li compra soltanto lui. Ti
            offre meno del dovuto e te lo conta in mano prima che tu dica di sì.
            Incartando gli organi borbotta che una bestia montata così a casaccio
            doveva cascare morta il primo giorno, e che ci farà un unguento per i
            calli.
          effetti: { organi.cinghiale: -1, monete: 8, informazioni.voce: 1, pista.corin: 1, scandalo: 0.5 }
      - testo: "Chiedergli delle carcasse che gli portano i cacciatori"
        descrizione: "Gli organi del cinghiale non li hai. Ezio però ha visto altro, e ha voglia di vantarsene."
        immagine: personaggi/ezio-tarlo
        requisiti: [organi.cinghiale == 0]
        esito:
          titolo: Le bestie sbagliate
          testo: |
            Ezio ti porta nel retro, dove tiene sotto spirito una lepre con due
            zampe di troppo e un cuore di capriolo grosso come un pugno. «Da
            qualche stagione i cacciatori mi portano roba così» dice, battendo
            l'unghia sul barattolo. «Dentro sono montate a casaccio, come un carro
            rifatto con i pezzi di tre carri, eppure correvano. Quelli
            dell'Accademia dicono che è la Marea, e intanto una non l'hanno mai
            aperta.»
          effetti: { informazioni.pettegolezzo: 1, pista.corin: 1 }
      - testo: "Comprare un tonico e lasciarlo parlare"
        descrizione: "Ezio parla meglio quando incassa. La boccetta forse funziona."
        requisiti: [organi.cinghiale == 0, monete >= 4]
        esito:
          titolo: Una boccetta verde
          testo: |
            Paghi una boccetta verde che secondo l'etichetta rimette in sesto, e
            Ezio diventa di colpo più loquace. Ti racconta del cuore di capriolo
            che tiene nel retro, diviso in camere che non comunicano, e della
            lepre che correva con due zampe in più. Dandoti il resto ti consiglia
            di bere il tonico a stomaco pieno, e sul perché resta vago.
          effetti: { monete: -4, tonico: 1, informazioni.pettegolezzo: 1, pista.corin: 1 }
      - testo: "Fargli il prezzo dei Ponti"
        descrizione: "Sai quanto paga al Mercato dei Nodi un erborista di Laresh una ghiandola di bestia mutata."
        immagine: personaggi/ezio-tarlo
        quando: [origine.mercante-dei-ponti >= 1, organi.cinghiale >= 1]
        esito:
          titolo: Il prezzo dei Ponti
          testo: |
            Gli dici quanto paga al Mercato dei Nodi un erborista di Laresh per
            una ghiandola di bestia mutata, e quanto ci ricarica sopra. Le dita di
            Ezio si fermano sulla boccetta. «Un mercante dei Ponti, l'avevo capito
            dalle scarpe.» Conta le monete senza discutere e, incartando gli
            organi, ti spiega che la bestia è montata a casaccio e doveva cascare
            morta il primo giorno.
          effetti: { organi.cinghiale: -1, monete: 18, informazioni.voce: 1, pista.corin: 1 }
      - testo: "Ricordargli a chi vende gli unguenti"
        descrizione: "Nei vicoli si sa quanto fa pagare i suoi unguenti ai fabbri delle fucine."
        immagine: personaggi/ezio-tarlo
        quando: [origine.figlio-della-citta-bassa >= 1, organi.cinghiale >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, intimidire], difficolta: Facile }
        successo:
          titolo: I calli dei fabbri
          testo: |
            Gli dici quanto costa da lui un vasetto di unguento per le scottature
            e quanti ne comprano le fucine in un mese. Ezio smette di stappare la
            boccetta. «Uno dei vicoli. Quelli come te non comprano niente e poi
            raccontano i miei prezzi in giro.» Conta le monete con la bocca
            storta, e incartando gli organi ti dice che la bestia doveva cascare
            morta il primo giorno, e invece correva.
          effetti: { organi.cinghiale: -1, monete: 18, informazioni.voce: 1, pista.corin: 1 }
        fallimento:
          titolo: Il vicolo sbagliato
          testo: |
            Ezio ti lascia finire con il mento appoggiato al pugno, poi ti spiega
            che i prezzi delle fucine li ha cambiati due inverni fa, e che quel
            vicolo adesso compra da lui più di prima. Ti offre meno del dovuto e
            te lo conta in mano prima che tu dica di sì, borbottando che una
            bestia montata così a casaccio doveva cascare morta il primo giorno.
          effetti: { organi.cinghiale: -1, monete: 8, informazioni.voce: 1, pista.corin: 1, sospetto: 0.5 }

  # ------------------------------------------------------------ 5 → 6 · la partenza
  - id: corin-parte-per-laresh
    presso: grifone-di-ferro
    immagine: personaggi/corin-ashdale
    titolo: La carovana per Laresh
    sommario: "Domani all'alba la carovana di Corin parte dal Mercato dei Nodi, e stasera ti cerca per salutarti."
    luogo: Locanda del Grifone di Ferro, la sera prima della partenza
    area: ponti-sospesi
    # Corin parla di Liaren come di una che sta bene: esclusi i passi di Acciaio e Ira 1–5.
    requisiti: [pista.corin == 5, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      Corin ti trova al Grifone mentre Brunella spegne le lanterne, e si siede
      sul bordo della sedia come se avesse fretta. La carovana per Laresh
      parte all'alba con sei carri di sale e due guardie che costano più del
      carico, e lui viaggerà sul primo, seduto su un cuscino ricamato portato
      da casa.

      Ti porge una lettera sigillata con la cera verde della Gilda. «È una
      presentazione per la Casa dei Nodi. Ho scritto che sei una persona di
      cui ci si può fidare, e che chi fa uno sgarbo a te lo fa a me. Con la
      firma di un membro eletto i Custodi di Passaggio ti scrivono nel
      registro della Gilda senza chiederti la commissione.» Sul retro c'è il
      tuo nome, sbagliato alla prima lettera e corretto sopra con cura, invece
      di riscrivere tutto.

      {origine mercante-dei-ponti} La licenza della Gilda ce l'hai già, ma una
      presentazione firmata da un membro eletto alla Casa dei Nodi la si tira
      fuori con il sigillo bene in vista, come un anello.

      Poi ti promette che tornerà prima dell'inverno o subito dopo, con il
      vino buono di Laresh e una storia sua da raccontare a Liaren, per una
      volta. Ride per primo, e aspetta di vedere se ridi anche tu.
    opzioni:
      - testo: "Accompagnarlo all'imbocco del Ponte delle Mille Corde"
        descrizione: "All'alba, fino al gabbiotto dei Custodi di Passaggio, dove il ponte finisce e comincia la strada."
        esito:
          titolo: Il gabbiotto dei Custodi
          testo: |
            All'alba il Ponte delle Mille Corde è bagnato di brina e vibra sotto
            le ruote. Cammini accanto al primo carro mentre Corin ti racconta chi
            deve soldi a chi, e al gabbiotto dei Custodi di Passaggio l'ispettore
            dei dazi legge la tua lettera e scrive il tuo nome nel registro della
            Gilda. Guardi la carovana finché piega verso il Ponte del Conciatore,
            con il fazzoletto bianco che sventola dal cassone.
          pe: { empatia: 5 }
          imposta: { licenza-gilda: 1 }
          effetti: { rep.gilda: 1, racconto: 1, pista.corin: 1 }
      - testo: "Salutarlo dalla finestra"
        descrizione: "Dalla finestra in cima alle scale del Grifone si vede passare tutto il ponte."
        esito:
          titolo: Il fazzoletto
          testo: |
            Ti svegli prima dell'alba senza averlo deciso e vai scalzo alla
            finestra in cima alle scale. Giù, sul Ponte delle Mille Corde, passano
            i carri con le lanterne ancora accese, e Corin sul primo cerca le
            finestre del Grifone finché trova la tua. Sventola il fazzoletto e per
            farlo quasi perde l'equilibrio. Lo saluti finché la carovana sparisce
            oltre l'imbocco, poi torni a letto con la lettera sul cuscino.
          imposta: { licenza-gilda: 1 }
          effetti: { rep.gilda: 1, racconto: 1, tormento: -0.5, pista.corin: 1 }
      - testo: "Chiedergli un ultimo favore"
        descrizione: "Corin è la migliore fonte di pettegolezzi di Qir-Azel, e stasera ha voglia di regalare qualcosa."
        quando: [pista.teatro == 0]
        esito:
          titolo: L'ultimo pettegolezzo
          testo: |
            Corin si guarda intorno nella sala vuota e si china verso di te.
            Orazio Belcanto cerca gente per la Promessa dell'Arpia, anche chi non
            ha mai recitato, purché sul palco resti serio. La rivalità fra Orazio
            e Liaren, di cui nessuno dei due ricorda l'inizio, secondo lui è
            cominciata con un duetto andato storto. All'alba, dal primo carro, ti
            saluta con il fazzoletto finché non può più vederti.
          imposta: { licenza-gilda: 1 }
          effetti: { informazioni.pettegolezzo: 1, rep.gilda: 1, racconto: 1, pista.corin: 1 }
