      - testo: "Guidare la carovana sul Ponte delle Mille Corde"
        descrizione: "All'alba le assi sono coperte di brina, e tu sulle corde dei Ponti ci hai fatto i turni."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Le assi buone
          testo: |
            All'alba cammini davanti al primo carro e dici ai carrettieri quali assi
            scivolano di brina e quali suonano vuote sotto il tallone, mentre Corin,
            in piedi sul cassone, annuisce a ogni asse come se capisse. Al gabbiotto
            dei Custodi di Passaggio l'ispettore dei dazi legge la tua lettera e
            scrive il tuo nome nel registro della Gilda. «Nemmeno un'asse» dice
            Corin, stringendoti la mano fra le sue.
