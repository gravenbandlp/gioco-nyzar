  # ------------------------------------------------------------ 1 → 2 · i cavalli
  - id: scuderie-della-zanna-rotta
    presso: scuderie-della-zanna-rotta
    immagine: ambientazione/scuderie-della-zanna-rotta
    titolo: Le Scuderie della Zanna Rotta
    sommario: "Corin ti aspetta alle Scuderie della Zanna Rotta con un corno da caccia nuovo. Il padrone delle stalle odia gli orchi e ama i cavalli."
    luogo: Scuderie della Zanna Rotta, Città Bassa
    area: citta-bassa
    requisiti: [pista.corin == 1]
    testo: |
      Le Scuderie della Zanna Rotta stanno in fondo alla Città Bassa, dove le
      case finiscono e comincia l'odore di fieno. Sopra il portone c'è
      un'insegna dipinta con un cavallo da guerra impennato su un orco
      tagliato in due. Il rosso del sangue è stato ripassato di recente, ed è
      più vivo di tutto il resto dell'insegna, cavallo compreso.

      Corin ti aspetta nel cortile in abiti da caccia così nuovi che gli
      stivali scricchiolano a ogni passo. Al collo gli pende un corno
      d'ottone comprato ieri, e a giudicare dalla faccia dei vicini l'ha già
      provato. «I cavalli li pago io, ho insistito» dice. «Il signor Stroud
      dice che sono i migliori della città, e lui di cacce se ne intende.»

      Dolovan Stroud esce dalla stalla pulendosi le mani sui calzoni di
      cuoio. Ha i capelli scuri striati di grigio e una faccia più giovane dei
      suoi anni, con gli occhi che ti misurano dagli stivali in su. Dietro di
      lui un cavallo grigio enorme gli tiene il muso appoggiato sulla spalla,
      e lui gli gratta il collo senza voltarsi. «Squash» dice, quando vede
      che lo guardi. «Significa schiacciare. Avevo in mente nomi meno
      gentili.»

      {rissa Media} Stroud tiene il peso sul piede dietro anche mentre si
      pulisce le mani. È un uomo abituato a ricevere le visite in guardia.

      Davanti alla stalla aspettano quattro cavalli con la sella militare e
      le sacche già allacciate. *Corin il prezzo non l'ha chiesto, e a Stroud
      la cosa non è sfuggita.* L'ultimo della fila è un baio con una
      cicatrice sulla spalla, e gira la testa per guardarti con un occhio
      solo.

      {cavalcare Facile} Il baio ha la bocca morbida e non tira la cavezza.
      Il sauro accanto a lui, invece, tiene le orecchie indietro da quando
      sei entrato nel cortile.
    opzioni:
      - testo: "Farti raccontare la bestia da Stroud"
        descrizione: "La Foresta Strisciante era il suo territorio di caccia. Se gli fai le domande giuste, ti dice che cosa aspettarti."
        immagine: personaggi/dolovan-stroud
        prova: { attributo: sociale, abilita: [empatia, natura], difficolta: Media }
        successo:
          titolo: Diciassette centimetri
          testo: |
            Stroud ti porta nella selleria e con un pezzo di gesso disegna
            sulla porta un'impronta lunga quanto la tua mano aperta. Intorno ce
            ne sono di più vecchie, tutte più piccole, mezze cancellate dalle
            maniche di chi passa. «L'ha misurata un mio vecchio socio. Un cinghiale normale ne fa la metà»
            dice, e batte il gesso sul legno. «Sotto il Gradone Rosso ha trovato caprioli squartati e
            lasciati lì senza un morso, e una bestia che ammazza senza mangiare
            ha qualcosa di guasto nel sangue.»

            Ti dice di seguire le tracce verso la scarpata e di guardare dove
            metti i piedi, perché nella Foresta i cacciatori scavano fosse. Poi
            aggiunge, più piano, che sotto il Gradone girano gli Spiumatori, e
            che per ogni orco che ti trovi davanti ti offre lui la birra.
          pe: { natura: 5 }
          effetti: { informazioni.pettegolezzo: 1, pista.corin: 1 }
        fallimento:
          titolo: Il resto lo vedrete
          testo: |
            Stroud ascolta le tue domande guardando Squash, che gli mastica
            piano il bavero. «È grosso e ha brutte abitudini» dice. «Il resto lo
            vedrete da voi.» Poi torna nella stalla a controllare un ferro, e ti
            lascia con la sensazione di aver fatto le domande di un bambino.
            Corin ti batte una mano sulla spalla per consolarti, con un
            entusiasmo che non avevi chiesto, e ti assicura che il signor
            Stroud fa così con tutti.
          effetti: { pista.corin: 1 }
      - testo: "Scegliere il cavallo da solo"
        descrizione: "Quattro cavalli sellati, e uno solo ti sta guardando. Gli altri guardano il fieno."
        prova: { attributo: fisico, abilita: [cavalcare, addestrare-animali], difficolta: Media }
        successo:
          titolo: Il baio con la cicatrice
          testo: |
            Passi lungo la fila con la mano aperta e ti fermi davanti al baio
            in fondo. Ti annusa le dita e poi la manica, con un fiato caldo che
            sa di avena, e quando gli monti in sella non si sposta di un passo. Stroud incrocia le braccia e ti
            guarda montare. «La cicatrice ce l'aveva già quando l'ho comprato»
            dice, senza staccarti gli occhi di dosso. «Lui non se la
            ricorda, e per questo ha un carattere migliore del mio.» Fai un
            giro del cortile al passo e uno al trotto, e Corin ti applaude dalla
            staccionata, da solo.
          pe: { cavalcare: 5 }
          effetti: { pista.corin: 1 }
        fallimento:
          titolo: Lo zoccolo
          testo: |
            Scegli il sauro più alto della fila, perché è il più bello e ti
            sembra giusto cominciare bene. Appena metti il piede nella
            staffa il cavallo gira su sé stesso e ti appoggia uno zoccolo sul
            piede. Stroud lo sposta con una parola, senza alzare la voce, e ti
            indica il baio in fondo, quello con la cicatrice sulla spalla.
            «Questo» dice. «Il sauro morde i mercanti, e oggi lo hai salvato da
            Corin.» Zoppichi fino alla staffa giusta, e lo zoccolo te lo senti
            fino a sera, anche da seduto.

            {resistenza Media} Il piede è pestato, niente di rotto. Lo saprai
            con certezza domattina, quando proverai a infilare lo stivale.
          effetti: { ferite: 0.5, pista.corin: 1 }
      - testo: "Lasciar scegliere Corin"
        descrizione: "Paga lui, e si vede che non vede l'ora di scegliere."
        costo: 0
        esito:
          titolo: Una domanda a Stroud
          testo: |
            Corin passa davanti ai cavalli con le mani dietro la schiena e ogni
            tanto si ferma a guardarne uno negli occhi, con la serietà di un
            ispettore dei dazi. Per fare conversazione
            chiede a Stroud se gli è mai capitato di parlare con un orco, così,
            per capire come ragionano. Stroud si gira lentamente verso di lui,
            e nel cortile si sente soltanto Squash che mastica.

            «Una volta» dice Stroud, e torna a stringere una cinghia. «Ha
            smesso presto.»

            {intimidire Facile} Lo dice con la voce con cui si dà l'ora, e la
            cinghia la stringe di un buco in più.

            Corin ride per primo, e poi da solo. Alla fine sceglie per te il
            baio in fondo alla fila, quello con la cicatrice sulla spalla,
            perché secondo lui ha lo sguardo intelligente. Stroud annuisce, e
            per il resto della mattina a Corin non rivolge più la parola.
          effetti: { pista.corin: 1 }
      - testo: "Parlare a Stroud dei sorveglianti di Ghoran"
        descrizione: "Stroud odia gli orchi, e la sua insegna lo dice a tutta la strada. Tu gli orchi li hai visti dal basso, con la frusta in mano."
        immagine: personaggi/dolovan-stroud
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Quelli dei recinti
          testo: |
            Gli dici che a Ghoran i sorveglianti dei recinti erano orchi, e che
            hai imparato presto a guardarli alle mani invece che in faccia. Lo
            dici piano, e ti accorgi di avere i pugni chiusi solo quando Stroud
            li guarda. Lui smette di grattare il collo di Squash e ti porta
            nella selleria. Con un pezzo di gesso disegna sulla porta un'impronta di
            zoccolo lunga quanto la tua mano aperta. «Un cinghiale normale ne fa
            la metà» dice. Sotto il Gradone Rosso ha trovato caprioli squartati
            e lasciati lì senza un morso.

            Poi batte il gesso sul legno. «Laggiù girano anche gli Spiumatori,
            che un padrone non l'hanno mai avuto e mordono lo stesso.» Ti dice
            di seguire le tracce verso la scarpata e di guardare dove metti i
            piedi, e che per ogni orco che ti trovi davanti la birra la offre
            lui.
          pe: { natura: 5 }
          effetti: { informazioni.pettegolezzo: 1, pista.corin: 1 }
      - testo: "Ascoltare i cavalli come al Circolo"
        descrizione: "Al Circolo ti hanno insegnato ad ascoltare una bestia prima di guardarla. Ognuno dei quattro cavalli respira a modo suo."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Il respiro del baio
          testo: |
            Passi lungo la fila senza toccare nessuno e ascolti i respiri. Il
            sauro soffia corto e tiene le orecchie indietro, gli altri due
            masticano il morso pensando al fieno. Il baio in fondo respira
            piano, e quando arrivi davanti a lui allunga il muso verso la tua
            manica. Gli appoggi il palmo sulla cicatrice, liscia sotto le dita
            come cuoio vecchio, e lui non si sposta.

            Stroud ti guarda montare con le braccia incrociate. «Il Circolo»
            dice, guardandoti le mani. «Lassù i cavalli li ascoltate prima di
            sellarli. In città si fa al contrario, e si vede.» Fai un giro del
            cortile al passo e uno al trotto, e Corin ti applaude dalla
            staccionata con il corno che gli sbatte sul petto.
          pe: { cavalcare: 5 }
          effetti: { pista.corin: 1 }

  # ------------------------------------------------------------ 3 → 4 · il banchetto
  - id: il-banchetto-del-cinghiale
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Il banchetto del cinghiale
    sommario: "La bestia della Foresta Strisciante è finita nei pentoloni del Grifone. Stasera Corin offre a tutta la sala, e ti vuole seduto alla sua destra."
    luogo: Locanda del Grifone di Ferro, la sera
    area: ponti-sospesi
    # Liaren in cucina: esclusi i passi di Acciaio e Ira 1–5. Con pista.pelle >= 5 Ottone è stato
    # arrestato, e Corin ne parla nella variante il-banchetto-del-cinghiale-dopo-i-malgrani.
    requisiti: [pista.corin == 3, pista.pelle < 5, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      La carcassa è arrivata al Grifone su un carro della Città Bassa, e per
      scaricarla ci sono voluti quattro Raschiatori e una corda del ponte.
      Brunella l'ha guardata a lungo con le mani sui fianchi. Poi ha tagliato
      via le parti dove il sangue era grigio e le ha bruciate nel cortile sul
      retro. Il resto l'ha messo a marinare nel vino rosso con le erbe, e
      Liaren si è legata i capelli per darle una mano.

      Stasera la sala è piena fino alle scale. La carne è scura e un po'
      dolce, con un retrogusto di ferro che un Raschiatore fa notare ad alta
      voce, prendendosi un calcio sotto il tavolo.

      {medicina Media} Il sangue grigio l'ha bruciato a parte, come si fa
      con la carne di una bestia malata. Mastichi lo stesso, e lo stomaco ti
      chiede se ne sei proprio sicuro.

      Corin siede a capotavola con il fazzoletto infilato nel colletto, e a
      metà cena ti fa scivolare accanto al piatto un borsello e le redini
      del baio, legate con un nastro. «Il cavallo è tuo» dice. «Stroud me
      l'ha venduto, e io non ho voluto sapere quanto.»

      Al terzo bicchiere parla della Gilda. «È corrotta, certo. Però senza
      la Gilda Qir-Azel si ferma. Spariscono i ponti, e il pane subito dopo.
      Finché ci sono Cordani e Irsa Valbrun a crederci, un po' di decenza
      resta.» Abbassa la voce. «Ottone Malgrani invece è un fabbricante di
      catene con i baffi pettinati. Mi odia, e io gli rendo il favore.» Ride
      per primo e alza il bicchiere verso i Raschiatori, che alzano i loro
      senza sapere perché.

      {politica-ed-economia Media} Corin divide la Gilda in persone, quelle
      che gli piacciono e quelle che no. È un modo gentile di non guardare i
      conti.

      Sul bancone, avvolti nella tela cerata e nel sale, aspettano gli organi
      della bestia. Dove la tela si è aperta si vede luccicare una vena
      d'argento, e Brunella li ha messi da parte perché decida tu.
    opzioni:
      - testo: "Tenere gli organi per farli esaminare"
        descrizione: "Corin dice che in città qualcuno pagherebbe per guardarli da vicino. Magari in Biblioteca o all'Accademia."
        esito:
          titolo: Nella tela cerata
          testo: |
            Prendi l'involto dal bancone, ed è più pesante di quanto pensavi,
            freddo anche attraverso il sale. Brunella ci gira intorno un altro
            giro di spago e ti dice di tenerlo lontano dalla sua cucina, con il
            mestolo puntato verso la porta. Corin approva con la bocca piena.
            «Ulric Stanne, in Biblioteca» dice appena riesce a parlare. «Ha un
            amico all'Accademia che apre le cose per vedere come sono fatte
            dentro.»

            Per tutta la cena tieni l'involto sotto la sedia, con il piede
            appoggiato sopra, e ogni tanto controlli con la punta dello stivale
            che sia ancora lì.
          effetti: { monete: 35, oggetto.cavallo-da-guerra: 1, organi.cinghiale: 1, rep.gilda: 0.5, racconto: 1, pista.corin: 1 }
      - testo: "Venderli subito a un mercante di passaggio"
        descrizione: "Al tavolo vicino alla porta un mercante di pelli guarda l'involto da quando sei entrato."
        esito:
          titolo: Il mercante di Pannion
          testo: |
            Il mercante di pelli viene da Pannion e ha le unghie nere di concia.
            Solleva un angolo della tela, guarda dentro più a lungo del
            necessario e ti offre un buon prezzo senza contrattare, cosa che a
            Qir-Azel succede di rado.

            {conoscenze-della-strada Media} Chi non contratta ha già in mente
            un compratore che paga di più. Il viaggio fino a Pannion se lo farà
            rimborsare da lui.

            Corin gli chiede che cosa ci farà, e lui risponde che a Pannion le
            cose strane si vendono sempre. Si mette l'involto sotto il braccio e
            se ne va prima del dolce.
          effetti: { monete: 41, oggetto.cavallo-da-guerra: 1, rep.gilda: 0.5, racconto: 1, pista.corin: 1 }
      - testo: "Lasciarli a Brunella"
        descrizione: "Il resto della bestia l'ha già bruciato lei, nel cortile. Sa che cosa farne."
        esito:
          titolo: Il fuoco nel cortile
          testo: |
            Fai un cenno a Brunella, e lei porta l'involto nel cortile sul retro
            senza dire niente. Dalla finestra la vedi rovesciarlo sulle braci
            del pomeriggio e rimestare con il forcone finché la tela smette di
            sfrigolare. Il fumo che sale è chiaro e puzza di ferro bagnato, e in
            sala qualcuno va a chiudere la finestra borbottando. Quando rientra
            Brunella si lava le mani due volte. Poi, sul registro della
            locanda, accanto al tuo nome segna una notte, senza spiegarti
            perché.
          effetti: { monete: 35, oggetto.cavallo-da-guerra: 1, alloggio.grifone: 1, rep.gilda: 0.5, racconto: 1, pista.corin: 1 }

