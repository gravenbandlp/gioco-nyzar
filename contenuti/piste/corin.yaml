# La caccia di Corin, in città (pista 0 → 2 e 3 → 6): il Grifone, le Scuderie della Zanna Rotta,
# il banchetto, gli organi del cinghiale e la partenza per Laresh. La spedizione nella Foresta
# Strisciante (2 → 3) sta in corin-foresta.yaml.
storylet:
  # ------------------------------------------------------------ 0 → 1 · la proposta
  - id: corin-al-grifone
    presso: grifone-di-ferro
    immagine: personaggi/corin-ashdale
    titolo: Un mercante al Grifone
    sommario: "Un uomo in panciotto ricamato ti cerca fra i tavoli del Grifone di Ferro, con un borsello in mano e una proposta di caccia."
    luogo: Locanda del Grifone di Ferro, di mattina
    area: ponti-sospesi
    # Liaren è al bancone: esclusi i passi di Acciaio e Ira in cui è sparita o a letto (1–5).
    # Dopo l'Arena Corin lo conosci già: c'è la variante corin-al-grifone-dopo-l-arena.
    requisiti: [pista.corin == 0, prologo == 0, conosci.liaren >= 1, pista.arena == 0, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      È mattina presto, e dalle finestre inchiodate del Grifone entra una
      luce a strisce che taglia i tavoli in due. Stai finendo il pane quando
      un uomo si alza dal tavolo accanto al camino e viene verso di te,
      scansando le sedie con piccoli inchini anche quando sono vuote. Avrà
      poco più di trent'anni. È bello e un po' pallido, con un panciotto
      ricamato a foglie d'acero e un fazzoletto di seta al taschino piegato a
      punta.

      {galateo Facile} Il panciotto è di sartoria buona, e nessuno lo ha mai
      dovuto rammendare. Gli inchini invece li fa a tutto, sedie comprese,
      per non rischiare di sbagliare con qualcuno.

      «Domando scusa per il disturbo» dice, e si inchina anche a te. «Corin
      Ashdale, membro eletto della Gilda dei Mercanti. Alloggio qui finché
      non riparto per Laresh, e Liaren dice che eravate fra quelli che hanno
      tenuto testa agli orchi.» Ride piano prima che tu abbia detto niente,
      poi posa sul tavolo un borsello di cuoio. «Un ringraziamento per chi ha
      difeso la città. Lo so che è poco, mi vergogno quasi a darvelo.»

      Si siede senza aspettare l'invito e racconta che nella Foresta
      Strisciante i cacciatori hanno visto un cinghiale grande come un carro.
      Lui vorrebbe andarci, solo che gli hanno consigliato di non andarci da
      solo. «A cosa fatta vi pago molto più di questo borsello. Poi un
      banchetto, qui. Vorrei imparare come si fa, sapete, a essere un eroe.
      Voi lo fate tutti i giorni.»

      {natura Media} Un cinghiale grande come un carro, se esiste, ha
      qualcosa che non va. Le bestie sane non crescono così, nemmeno nella
      Foresta Strisciante.

      Sotto il tavolo la sua mano scende a cercare la testa di un cane che
      non c'è più, e risale a sistemare il fazzoletto. *Questo qui paga da
      bere a tutta la sala, e non ha nessuno con cui farlo.* Dal bancone
      Liaren vi guarda e intanto continua ad asciugare lo stesso boccale.
    opzioni:
      - testo: "Accettare la caccia"
        descrizione: "Il cinghiale è grande come un carro, e Corin una lancia non l'ha mai tenuta in mano. La paga però è buona."
        esito:
          titolo: Eccellente, eccellente
          testo: |
            Corin batte le mani una volta sola e si guarda intorno per vedere
            se qualcuno se n'è accorto. «Eccellente, eccellente» dice.
            «Allora ci vediamo alle Scuderie della Zanna Rotta, in Città Bassa.
            I cavalli li pago io, naturalmente. È stato il signor Stroud a
            consigliarmi la Foresta, e lui è un cacciatore vero.» Sulla parola
            *vero* abbassa un poco la voce, per rispetto.

            Prima di uscire si ferma al bancone a saldare il conto della
            giornata con Brunella, che conta le monete sul palmo e poi le
            riconta, perché con Corin il conto torna sempre in eccesso. Dalla
            porta ti fa ancora un cenno con la mano, e per farlo urta lo
            stipite con la spalla.
          effetti: { monete: 15, pista.corin: 1 }
      - testo: "Accettare e chiedere un anticipo"
        descrizione: "Prima della foresta ci sono le frecce da comprare e gli stivali da risuolare. Si dice che Corin presti senza contare, ma chiedere resta chiedere."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Un anticipo sulla parola
          testo: |
            Gli spieghi il conto delle frecce e degli stivali, e Corin ti
            ascolta annuendo come se gli stessi insegnando un mestiere. Poi
            sfila dal panciotto un'altra manciata di monete e te le mette in
            mano senza contarle. «Naturale, naturale. Anche gli eroi mangiano»
            dice, e lo annota su un taccuino con la copertina di pelle. Quando
            se ne va sbirci la pagina rimasta aperta sul tavolo. C'è il tuo
            nome scritto con cura, e accanto non c'è nessuna cifra.

            {politica-ed-economia Media} Un membro eletto della Gilda che non
            segna le cifre accanto ai nomi ha un taccuino pieno di crediti che
            nessuno gli renderà. Lo sanno tutti, e forse lo sa anche lui.
          effetti: { monete: 25, pista.corin: 1 }
        fallimento:
          titolo: La regola della Gilda
          testo: |
            Ti impappini sui numeri, e Corin ti guarda con una gentilezza che
            ti scalda le orecchie più di un rimprovero. Ti spiega che alla
            Gilda prima si fa il lavoro e poi si prende la paga, e che la regola
            non l'ha inventata lui. Poi ride per primo, come per scusarsi della
            regola. Al tavolo accanto due Raschiatori hanno sentito tutto, e
            quando Corin se ne va uno dei due ti fa l'occhiolino da sopra il
            boccale, con la schiuma ancora sui baffi.
          effetti: { monete: 15, pista.corin: 1 }
      - testo: "Chiedere prima a Liaren chi è"
        descrizione: "Liaren conosce chiunque le paghi da bere, e Corin paga da bere a tutta la sala."
        esito:
          titolo: Uno che presta a perdere
          testo: |
            Ti alzi per un'altra pinta, e al bancone Liaren ti parla senza
            smettere di asciugare. «Corin? Paga ottimi giri, e ai bottegai
            della Città Bassa presta soldi che poi non chiede indietro» dice.
            «Organizza cene, e alle sue cene non viene mai nessuno. Io lo
            tollero, che è più di quanto faccio con il resto della Gilda.» Gira
            il boccale controluce. «Se ti offre una caccia, la caccia è vera e
            la paga pure. Gli amici invece se li deve trovare da solo.»

            {empatia Facile} Su *tollero* le si addolcisce la bocca. Ne parla
            come si parla di un fratello minore che fa arrabbiare.

            Torni al tavolo e accetti, e Corin si illumina tanto che il
            Raschiatore seduto accanto si volta a vedere che cosa è successo.
          effetti: { monete: 15, informazioni.voce: 1, pista.corin: 1 }
      - testo: "Ricordargli il banco delle castagne"
        descrizione: "Il giorno del Festival l'hai tirato dietro il tuo banco, fra i sacchi, mentre il cinghiale passava."
        requisiti: [corin.salvato >= 1]
        esito:
          titolo: Il polso
          testo: |
            Gli parli del banco vicino alla porta nord, e Corin smette di
            sorridere per la prima volta da quando si è seduto. Ti guarda in
            faccia a lungo, come quel giorno sotto il bancone, poi ti afferra il
            polso con tutte e due le mani. Ha le dita fredde e stringe forte.
            «Le castagne» dice. «Me le sono
            sognate per tre notti di fila.»

            Aggiunge al borsello qualche altra moneta. Poi ci ripensa e ne
            aggiunge ancora, e ti promette che alla Casa dei Nodi il tuo
            nome lo sentiranno da lui. Quando ti lascia andare hai sul polso i
            segni delle sue dita, e accetti la caccia prima che te lo chieda una
            seconda volta.
          effetti: { monete: 25, rep.gilda: 0.5, pista.corin: 1 }
      - testo: "Rispondergli con le maniere dei salotti"
        descrizione: "Nei salotti dei Quartieri Alti di Corin Ashdale si dice che inviti tutti e che alle sue cene non venga nessuno. Tu sai come si accetta un invito senza far sentire solo chi lo fa."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Un inchino reso
          testo: |
            Ti alzi e gli rendi l'inchino, quello giusto, con la mano sul petto
            e la testa piegata di un dito, come nei salotti si saluta un ospite
            di riguardo. Il corpo se lo ricorda meglio di te. Corin resta un
            momento senza parole. Poi diventa rosso fino al fazzoletto e si
            inchina di nuovo, più profondo, urtando il tavolo con il ginocchio.

            Gli dici che accetti la caccia e che al suo banchetto ti siederai
            volentieri. «Eccellente, eccellente» dice, e la voce gli si incrina
            sulla seconda parola. Prima di uscire paga da bere a tutta la sala,
            come fa sempre. Stavolta però dal tavolo dei Raschiatori qualcuno
            alza il boccale verso di lui, e Corin resta sulla porta a guardarlo
            più a lungo del necessario.
          effetti: { monete: 15, rep.gilda: 0.5, pista.corin: 1 }

