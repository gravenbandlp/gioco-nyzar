      «A cosa fatta vi pago molto più di questo borsello, e poi un banchetto,
      qui. Sto ancora imparando a essere un eroe, e il maestro l'ho già
      scelto.»

      {resilienza Media fallita} A sentirti chiamare maestro ti si secca la
      bocca, e vorresti che avesse scelto uno che di notte dorme.

      Dal bancone Liaren vi guarda asciugando lo stesso boccale.
