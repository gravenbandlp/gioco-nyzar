# La caccia di Corin, in città (pista 0 → 2 e 3 → 6): il Grifone, le Scuderie della Zanna Rotta,
# il banchetto, gli organi del cinghiale e la partenza per Laresh. La spedizione nella Foresta
# Strisciante (2 → 3) sta in corin-foresta.yaml.
storylet:
  # ------------------------------------------------------------ 0 → 1 · la proposta
  - id: corin-al-grifone
    presso: grifone-di-ferro
    immagine: personaggi/corin-ashdale
    titolo: Un mercante al Grifone
    sommario: "Un uomo in panciotto ricamato ti cerca fra i tavoli del Grifone di Ferro con una proposta di caccia."
    luogo: Locanda del Grifone di Ferro, di mattina
    area: ponti-sospesi
    # Liaren è al bancone: esclusi i passi di Acciaio e Ira in cui è sparita o a letto (1–5).
    # Dopo l'Arena Corin lo conosci già: c'è la variante corin-al-grifone-dopo-l-arena.
    requisiti: [pista.corin == 0, prologo == 0, conosci.liaren >= 1, pista.arena == 0, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      È mattina presto al Grifone, e stai finendo il pane quando un uomo si
      alza dal tavolo accanto al camino e ti viene incontro, scansando le
      sedie con piccoli inchini anche quando sono vuote. Ha un panciotto
      ricamato a foglie d'acero e un fazzoletto di seta nel taschino.

      {galateo Facile} Il panciotto è di sartoria buona, e gli inchini li fa
      a tutto, sedie comprese, per non sbagliare con nessuno.

      «Domando scusa per il disturbo» dice. «Corin Ashdale, membro eletto
      della Gilda dei Mercanti. Liaren dice che eravate fra quelli che hanno
      tenuto testa agli orchi.» Posa sul tavolo un borsello. «Un
      ringraziamento per chi ha difeso la città, e mi vergogno di quanto è
      poco.»

      {origine mercante-dei-ponti} Ai banchi dei Ponti il nome di Corin
      Ashdale lo dicono con affetto, perché presta senza segnare il rientro.

      Si siede senza aspettare l'invito e racconta che nella Foresta
      Strisciante i cacciatori hanno visto un cinghiale grande come un carro.
      «A cosa fatta vi pago molto più di questo borsello, e poi un banchetto,
      qui. Vorrei imparare come si fa, sapete, a essere un eroe.»

      Sotto il tavolo la sua mano scende a cercare la testa di un cane che
      non c'è più, e risale a sistemare il fazzoletto. Dal bancone Liaren vi
      guarda asciugando lo stesso boccale.
    opzioni:
      - testo: "Accettare la caccia"
        descrizione: "Il cinghiale è grande come un carro, e Corin una lancia non l'ha mai tenuta in mano."
        esito:
          titolo: Eccellente, eccellente
          testo: |
            Corin batte le mani una volta sola e si guarda intorno per vedere se
            qualcuno se n'è accorto. «Eccellente, eccellente. Allora ci vediamo
            alle Scuderie della Zanna Rotta, in Città Bassa. I cavalli li pago io,
            e la Foresta me l'ha consigliata il signor Stroud, che è un cacciatore
            vero.» Uscendo ti saluta con la mano, e per farlo urta lo stipite con
            la spalla.
          effetti: { monete: 15, pista.corin: 1 }
      - testo: "Accettare e chiedere un anticipo"
        descrizione: "Ci sono frecce da comprare e stivali da risuolare, e si dice che Corin presti senza contare."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Un anticipo sulla parola
          testo: |
            Gli spieghi il conto delle frecce e degli stivali, e Corin sfila dal
            panciotto un'altra manciata di monete senza contarle. «Naturale,
            naturale. Anche gli eroi mangiano» dice, e lo annota su un taccuino di
            pelle. Quando se ne va sbirci la pagina rimasta aperta, dove c'è il
            tuo nome scritto con cura e accanto nessuna cifra.
          effetti: { monete: 25, pista.corin: 1 }
        fallimento:
          titolo: La regola della Gilda
          testo: |
            Ti impappini sui numeri, e Corin ti spiega con una gentilezza che ti
            scalda le orecchie che alla Gilda prima si fa il lavoro e poi si
            prende la paga. Poi ride per primo, come per scusarsi della regola, e
            al tavolo accanto un Raschiatore ti fa l'occhiolino da sopra il
            boccale.
          effetti: { monete: 15, pista.corin: 1, scandalo: 0.5 }
      - testo: "Chiedere prima a Liaren chi è"
        descrizione: "Liaren conosce chiunque le paghi da bere, e Corin paga da bere a tutta la sala."
        esito:
          titolo: Uno che presta a perdere
          testo: |
            Al bancone Liaren ti parla senza smettere di asciugare. «Corin? Paga
            ottimi giri e presta soldi ai bottegai della Città Bassa senza
            chiederli indietro. Io lo tollero, che è più di quanto faccio con il
            resto della Gilda. Se ti offre una caccia, la caccia è vera e la paga
            pure.» Torni al tavolo e accetti, e Corin si illumina tanto che il
            Raschiatore accanto si volta a guardare.
          effetti: { monete: 15, informazioni.voce: 1, pista.corin: 1 }
      - testo: "Ricordargli il banco delle castagne"
        descrizione: "Il giorno del Festival l'hai tirato dietro il tuo banco, fra i sacchi, mentre il cinghiale passava."
        requisiti: [corin.salvato >= 1]
        esito:
          titolo: Il polso
          testo: |
            Gli parli del banco vicino alla porta nord, e Corin smette di
            sorridere. Ti afferra il polso con tutte e due le mani, le dita
            fredde. «Le castagne me le sono sognate per tre notti di fila» dice.
            Aggiunge al borsello una manciata di monete e promette che alla Casa
            dei Nodi il tuo nome lo sentiranno da lui. Accetti la caccia prima che
            te lo chieda di nuovo.
          effetti: { monete: 25, rep.gilda: 0.5, pista.corin: 1 }
      - testo: "Rispondergli con le maniere dei salotti"
        descrizione: "Nei salotti dei Quartieri Alti si dice che alle cene di Corin non venga mai nessuno."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Un inchino reso
          testo: |
            Ti alzi e gli rendi l'inchino giusto, la mano sul petto e la testa
            piegata di un dito. Corin diventa rosso fino al fazzoletto. Accetti la
            caccia e il posto al suo banchetto, e lui dice «Eccellente,
            eccellente» con la voce che si incrina sulla seconda parola. Prima di
            uscire paga da bere a tutta la sala, e stavolta dal tavolo dei
            Raschiatori qualcuno alza il boccale verso di lui.
          effetti: { monete: 15, rep.gilda: 0.5, pista.corin: 1 }

  # Variante: dopo l'Arena Corin era nella tua squadra, e non serve presentarlo.
