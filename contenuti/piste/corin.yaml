  # ------------------------------------------------------------ 1 → 2 · i cavalli
  - id: scuderie-della-zanna-rotta
    presso: scuderie-della-zanna-rotta
    immagine: ambientazione/scuderie-della-zanna-rotta
    titolo: Le Scuderie della Zanna Rotta
    sommario: "Corin ti aspetta alle Scuderie della Zanna Rotta con un corno da caccia nuovo. Il padrone delle stalle odia gli orchi e ama i cavalli."
    luogo: Scuderie della Zanna Rotta, Città Bassa
    area: citta-bassa
    requisiti: [pista.corin == 1]
    testo: |
      Sopra il portone c'è un'insegna dipinta con un cavallo da guerra
      impennato su un orco tagliato in due. Sotto, inchiodata al portone, c'è
      una zanna d'orco spezzata a metà, e i chiodi che la tengono sono ancora
      lucidi.

      {origine figlio-della-citta-bassa} Quell'insegna la conosci da quando
      eri bambin{o|a}, e allora la zanna sul portone non c'era. Ci passavi sotto
      di corsa con gli altri ragazzi del vicolo, e nessuno di voi guardava
      l'orco, perché i cavalli erano molto più interessanti.

      {origine fuggiasco-di-ghoran} Sotto l'insegna ti fermi un passo più del
      necessario. Un orco tagliato in due, dipinto grande sopra un portone, a
      Ghoran non l'avevi mai visto, e lo guardi con un piacere che ti mette un
      po' a disagio.

      Corin ti aspetta nel cortile in abiti da caccia così nuovi che gli
      stivali scricchiolano a ogni passo. Al collo gli pende un corno d'ottone
      comprato ieri, e a giudicare dalla faccia dei vicini l'ha già provato.

      Dolovan Stroud esce dalla stalla pulendosi le mani sui calzoni di cuoio.
      Dietro di lui un cavallo grigio enorme gli tiene il muso appoggiato
      sulla spalla, e lui gli gratta il collo senza voltarsi. «Squash» dice,
      quando vede che lo guardi.

      Davanti alla stalla aspettano quattro cavalli con la sella militare e le
      sacche già allacciate. L'ultimo della fila è un baio con una cicatrice
      sulla spalla, e gira la testa per guardarti con un occhio solo.

      {cavalcare Facile} Il baio ha la bocca morbida e non tira la cavezza. Il
      sauro accanto a lui, invece, tiene le orecchie indietro da quando sei
      entrat{o|a} nel cortile.
    opzioni:
      - testo: "Farti raccontare la bestia da Stroud"
        descrizione: "La Foresta Strisciante era il suo territorio di caccia. Se gli fai le domande giuste, ti dice che cosa aspettarti."
        immagine: personaggi/dolovan-stroud
        prova: { attributo: sociale, abilita: [empatia, natura], difficolta: Media }
        successo:
          titolo: Diciassette centimetri
          testo: |
            Stroud ti porta nella selleria e con un pezzo di gesso disegna sulla porta un'impronta lunga
            quanto la tua mano aperta. «L'ha misurata un mio vecchio socio. Un cinghiale normale ne fa la
            metà» dice, e batte il gesso sul legno. «Sotto il Gradone Rosso ha trovato caprioli squartati
            e lasciati lì senza un morso, e una bestia che ammazza senza mangiare ha qualcosa di guasto
            nel sangue.»

            Ti dice di seguire le tracce verso la scarpata e di guardare dove metti i piedi, perché nella
            Foresta i cacciatori scavano fosse.
          pe: { natura: 5 }
          effetti: { informazioni.pettegolezzo: 1, pista.corin: 1 }
        fallimento:
          titolo: Il resto lo vedrete
          testo: |
            Stroud ascolta le tue domande guardando Squash, che gli mastica
            piano il bavero. «È grosso e ha brutte abitudini» dice. «Il resto lo
            vedrete da voi.» Poi torna nella stalla a controllare un ferro, e ti
            lascia con la sensazione di aver fatto le domande di un bambino.
            Corin ti batte una mano sulla spalla per consolarti, con un
            entusiasmo che non avevi chiesto, e ti assicura che il signor
            Stroud fa così con tutti.
          effetti: { pista.corin: 1, scandalo: 0.5 }
      - testo: "Scegliere il cavallo da sol{o|a}"
        descrizione: "Quattro cavalli sellati, e uno solo ti sta guardando. Gli altri guardano il fieno."
        prova: { attributo: fisico, abilita: [cavalcare, addestrare-animali], difficolta: Media }
        successo:
          titolo: Il baio con la cicatrice
          testo: |
            Passi lungo la fila con la mano aperta e ti fermi davanti al baio in fondo. Ti annusa le dita e poi
            la manica, con un fiato caldo che sa di avena, e quando gli monti in sella non si sposta di un
            passo. Stroud incrocia le braccia e ti guarda montare. «La cicatrice ce l'aveva già quando l'ho
            comprato» dice, senza staccarti gli occhi di dosso. «Lui non se la ricorda, e per questo ha un
            carattere migliore del mio.»
          pe: { cavalcare: 5 }
          effetti: { pista.corin: 1 }
        fallimento:
          titolo: Lo zoccolo
          testo: |
            Scegli il sauro più alto della fila, perché è il più bello e ti sembra
            giusto cominciare bene. Appena metti il piede nella staffa il cavallo
            gira su sé stesso e ti appoggia uno zoccolo sul piede. Stroud lo
            sposta con una parola, senza alzare la voce, e ti indica il baio in
            fondo, quello con la cicatrice sulla spalla. «Il sauro morde.
            Prendi il baio, che con lui non hai problemi.»
          effetti: { ferite: 0.5, pista.corin: 1 }
      - testo: "Lasciar scegliere Corin"
        descrizione: "Paga lui, e si vede che non vede l'ora di scegliere."
        costo: 0
        esito:
          titolo: Una domanda a Stroud
          testo: |
            Corin passa davanti ai cavalli con le mani dietro la schiena e ogni
            tanto si ferma a guardarne uno negli occhi, con la serietà di un
            ispettore dei dazi. Per fare conversazione chiede a Stroud se gli è
            mai capitato di parlare con un orco, così, per capire come ragionano.

            «Una volta» dice Stroud, e torna a stringere una cinghia. «Gli ho
            spaccato la testa prima che finisse la frase.»

            Corin ride per primo, e poi da solo. Alla fine sceglie per te il baio
            in fondo alla fila, quello con la cicatrice sulla spalla, perché
            secondo lui ha lo sguardo intelligente.
          effetti: { pista.corin: 1 }
      - testo: "Parlare a Stroud dei sorveglianti di Ghoran"
        descrizione: "Tu gli orchi li hai visti dal basso, con la frusta in mano."
        immagine: personaggi/dolovan-stroud
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Quelli dei recinti
          testo: |
            Gli dici che a Ghoran i sorveglianti dei recinti erano orchi, e che hai
            imparato presto a guardarli alle mani invece che in faccia. Lui smette
            di grattare il collo di Squash e ti porta nella selleria. Con un pezzo
            di gesso disegna sulla porta un'impronta di zoccolo lunga quanto la tua
            mano aperta. Sotto il Gradone Rosso ha trovato caprioli squartati e
            lasciati lì senza un morso.

            «Laggiù girano anche gli Spiumatori. Quelli un padrone non ce
            l'hanno, e ti attaccano lo stesso, stai attent{o|a}.»
          pe: { natura: 5 }
          effetti: { informazioni.pettegolezzo: 1, pista.corin: 1 }
      - testo: "Ascoltare i cavalli come al Circolo"
        descrizione: "Al Circolo ti hanno insegnato ad ascoltare una bestia prima di guardarla. Ognuno dei quattro cavalli respira a modo suo."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Il respiro del baio
          testo: |
            Passi lungo la fila senza toccare nessuno e li ascolti uno per uno. Il baio in
            fondo soffia lungo e tranquillo, e quando arrivi davanti a lui allunga il muso
            verso la tua manica.

            Stroud ti guarda montare con le braccia incrociate. «Il Circolo» dice,
            guardandoti le mani. «Lassù i cavalli li ascoltate prima di sellarli. In città
            li selliamo e basta, e poi ci lamentiamo che scalciano.»
          pe: { cavalcare: 5 }
          effetti: { pista.corin: 1 }

  # ------------------------------------------------------------ 3 → 4 · il banchetto
  - id: il-banchetto-del-cinghiale
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Il banchetto del cinghiale
    sommario: "La bestia della Foresta Strisciante è finita nei pentoloni del Grifone. Stasera Corin offre a tutta la sala, e ti vuole sedut{o|a} alla sua destra."
    luogo: Locanda del Grifone di Ferro, la sera
    area: ponti-sospesi
    # Liaren in cucina: esclusi i passi di Acciaio e Ira 1–5. Con pista.pelle >= 5 Ottone è stato
    # arrestato, e Corin ne parla nella variante il-banchetto-del-cinghiale-dopo-i-malgrani.
    requisiti: [pista.corin == 3, pista.pelle < 5, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      La carcassa è arrivata al Grifone su un carro della Città Bassa, e per
      scaricarla ci sono voluti quattro Raschiatori e una corda del ponte.
      Brunella l'ha guardata a lungo con le mani sui fianchi. Poi ha tagliato
      via le parti dove il sangue era grigio e le ha bruciate nel cortile sul
      retro.

      Stasera la sala è piena fino alle scale.

      {origine apprendista-raschiatore} Dei quattro Raschiatori che l'hanno
      scaricata due li conosci dalle piattaforme, e stasera siedono vicino
      alla scala con i palmi ancora segnati dalla corda. Alzano il boccale
      verso di te prima che verso Corin, e ti scalda più del vino.

      Corin siede a capotavola con il fazzoletto infilato nel colletto, e a
      metà cena ti fa scivolare accanto al piatto un borsello e le redini del
      baio, legate con un nastro. «Il cavallo è tuo» dice. «Stroud me l'ha
      venduto, e io non ho voluto sapere quanto.»

      Al terzo bicchiere parla della Gilda. «È corrotta, certo. Però senza la
      Gilda Qir-Azel si ferma. Spariscono i ponti, e il pane subito dopo.
      Finché ci sono Cordani e Irsa Valbrun a crederci, un po' di decenza
      resta.» Abbassa la voce. «Ottone Malgrani invece guadagna sulla pelle
      degli altri, e la mattina si pettina i baffi come niente fosse. Mi odia,
      e io lo ricambio volentieri.»

      Sul bancone, avvolti nella tela cerata e nel sale, aspettano gli organi
      della bestia. Dove la tela si è aperta si vede luccicare una vena
      d'argento, e Brunella li ha messi da parte perché decida tu.
    opzioni:
      - testo: "Tenere gli organi per farli esaminare"
        descrizione: "Corin dice che in città qualcuno pagherebbe per guardarli da vicino. Magari in Biblioteca o all'Accademia."
        esito:
          titolo: Nella tela cerata
          testo: |
            Prendi l'involto dal bancone, ed è più pesante di quanto pensavi,
            freddo anche attraverso il sale. Brunella ci gira intorno un altro
            giro di spago e ti dice di tenerlo lontano dalla sua cucina, con il
            mestolo puntato verso la porta. Corin approva con la bocca piena.
            «Ulric Stanne, in Biblioteca» dice appena riesce a parlare. «Ha un
            amico all'Accademia che apre le cose per vedere come sono fatte
            dentro.»
          effetti: { monete: 35, oggetto.cavallo-da-guerra: 1, organi.cinghiale: 1, rep.gilda: 0.5, racconto: 1, pista.corin: 1 }
      - testo: "Venderli subito a un mercante di passaggio"
        descrizione: "Al tavolo vicino alla porta un mercante di pelli guarda l'involto da quando sei entrat{o|a}."
        esito:
          titolo: Il mercante di Pannion
          testo: |
            Il mercante di pelli viene da Pannion e ha le unghie nere di concia.
            Solleva un angolo della tela, guarda dentro più a lungo del necessario
            e ti offre un buon prezzo senza contrattare, cosa che a Qir-Azel
            succede di rado.

            Corin gli chiede che cosa ci farà, e lui risponde che a Pannion le
            cose strane si vendono sempre. Si mette l'involto sotto il braccio e
            se ne va prima del dolce.
          effetti: { monete: 41, oggetto.cavallo-da-guerra: 1, rep.gilda: 0.5, racconto: 1, pista.corin: 1 }
      - testo: "Lasciarli a Brunella"
        descrizione: "Il resto della bestia l'ha già bruciato lei, nel cortile. Sa che cosa farne."
        esito:
          titolo: Il fuoco nel cortile
          testo: |
            Fai un cenno a Brunella, e lei porta l'involto nel cortile sul retro
            senza dire niente. Dalla finestra la vedi rovesciarlo sulle braci
            del pomeriggio e rimestare con il forcone finché la tela smette di
            sfrigolare. Il fumo che sale è chiaro e puzza di ferro bagnato, e in
            sala qualcuno va a chiudere la finestra borbottando. Quando rientra
            Brunella si lava le mani due volte. Poi, sul registro della
            locanda, accanto al tuo nome segna una notte, senza spiegarti
            perché.
          effetti: { monete: 35, oggetto.cavallo-da-guerra: 1, alloggio.grifone: 1, rep.gilda: 0.5, racconto: 1, pista.corin: 1 }
      - testo: "Benedire il fuoco nel cortile"
        descrizione: "Brunella le braci le ha già accese. Una preghiera breve al Grande Albero Rosso, detta sopra il fumo, a quella bestia non la nega nessuno."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La preghiera sulle braci
          testo: |
            Prendi l'involto dal bancone e segui Brunella nel cortile sul retro.
            Lei lo rovescia sulle braci del pomeriggio, e tu dici sopra il fumo
            una preghiera breve al Grande Albero Rosso, a voce bassa, con le mani
            aperte sul calore, come ti ha insegnato Vantes.

            Quando rientrate si lava le mani due volte, e sul registro della
            locanda, accanto al tuo nome, segna una notte. Stavolta ti spiega
            anche il perché, senza alzare gli occhi dal registro. «Per la
            preghiera. Il fumo puzzava meno.»
          effetti: { monete: 35, oggetto.cavallo-da-guerra: 1, alloggio.grifone: 1, rep.gilda: 0.5, racconto: 1, pista.corin: 1 }

