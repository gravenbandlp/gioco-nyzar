          effetti: { oggetto.diario-di-isvaro: 1, oggetto.arco-di-isvaro: 1, pista.acciaio: 1, racconto: 1 }
          imposta: { isvaro: 2 }
          segue: liaren-nella-cella
        fallimento:
          titolo: La voce che manca
          testo: |
            Gridi dalla soglia le parole dei recinti, e la voce ti si spezza a
            metà. Gli orchi si girano e si mettono a ridere, e il primo ti chiude
            sull'avambraccio le pinze del forno ancora rosse. Mentre ti difendi
            Isvaro prende l'arco e va verso la sala di carico senza correre, e
