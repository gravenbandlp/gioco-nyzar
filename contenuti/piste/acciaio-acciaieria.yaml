# Acciaio e Ira, la spedizione nell'Acciaieria dei Tarvelin (pista.acciaio 3 → 5).
# Si entra da `davanti-all-acciaieria` (acciaio-1.yaml). Dentro sei stanze ripetibili, in ordine secondo
# la profondità: 0 la parte davanti (la sala dei clienti o gli archivi), 1 la parte degli operai (la sala
# da pranzo o la cucina), 2 il retro verso la fornace (gli alloggi o la sala di carico). Una stanza
# superata non ricompare nella stessa visita. Poi il cuore nella sala della fornace (A17), che imposta
# `isvaro` (1 fuggito, 2 preso vivo, 3 morto) e dà il diario in ogni ramo, poi due seguiti: la cella di
# Liaren (A21) e la sua domanda sul gradino, che riporta in Città Bassa.
aree:
  - id: acciaieria
    immagine: ambientazione/acciaieria-di-qir-azel
    nome: Acciaieria dei Tarvelin
    sommario: "Dentro l'Acciaieria le persiane sono chiuse da due settimane e la fornace non ha mai smesso di ruggire."
    spedizione: { ritorno: citta-bassa, soglia: 3, stanze: 3 }
    testo: |
      Dentro, la luce passa soltanto dalle fessure delle persiane e taglia il pavimento a strisce. Nelle
      strisce la polvere resta sospesa e non scende. L'aria è calda e ferma, e sotto l'odore di metallo e di
      carbone ce n'è un altro, dolciastro, che lo stomaco riconosce prima della testa.

      Il rombo basso della fornace arriva da tutte le pareti insieme e ti entra nei denti, e lo senti salire
      anche dalle suole. In un'acciaieria che lavora a questo ritmo dovrebbero esserci i colpi dei martelli e
      le voci degli operai, e invece sotto il rombo non c'è nessun altro rumore.

      Fra la sala dei clienti e la fornace ci sono magazzini e uffici, e un corridoio porta agli alloggi della
      servitù.

storylet:
  # ------------------------------------------------------------ 3 · rientrare dopo una ritirata
  # davanti-all-acciaieria vale solo a pista 2: chi esce dalla spedizione rientra da qui.
  - id: tornare-nell-acciaieria
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Di nuovo all'Acciaieria
    sommario: "Liaren è ancora là dentro, da qualche parte oltre i magazzini, e la ciminiera continua a fumare."
    luogo: Acciaieria dei Tarvelin, Città Bassa
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.acciaio == 3]
    testo: |
      Il fumo sale dritto dalla ciminiera come prima, e le persiane sono sprangate come le hai lasciate. Sul
      gradino della porta degli operai un vicino ha messo una scodella di latte per un gatto sparito da due
      settimane. Il latte ha fatto la pelle in superficie, e sopra non c'è nemmeno una mosca.

      {origine figlio-della-citta-bassa} Nei vicoli dove sei cresciut{o|a} la scodella la mettono i vicini
      quando qualcuno non rientra, e nessuno la tocca finché non se ne sa la fine.

      Giri intorno al muro di cinta fino al vicolo sul retro, dove dalla pietra passa il rombo della fornace e
      ogni tanto una risata gutturale. La strada per entrare la conosci già.

      Oltre i magazzini sbatte una porta. Liaren è ancora là dentro.
    opzioni:
      - testo: "Rientrare"
        descrizione: "Dalla stessa strada della prima volta, sperando che nessuno l'abbia chiusa."
        esito:
          titolo: Di nuovo dentro
          testo: |
            Rientri piano dalla stessa strada della prima volta e ti richiudi alle spalle la luce del vicolo.
            Dentro l'aria è calda e ferma come la ricordavi, e l'odore dolciastro ti prende alla gola prima
            ancora che gli occhi si abituino al buio. Resti con la schiena contro il muro finché le strisce di
            luce delle persiane tornano a disegnare il pavimento, poi ti muovi verso il rombo della fornace.
            Sotto le suole la polvere di carbone scricchiola così forte che due volte ti fermi ad ascoltare.
          vai: acciaieria

  # ------------------------------------------------------------ le stanze (ripetibili, in fasce di profondità)
  - id: acciaieria-sala-esposizione
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: La sala dei clienti
    sommario: "La sala dove i clienti dei Tarvelin guardavano lame e padelle. Nella polvere del pavimento ci sono impronte di piedi nudi, grandi."
    luogo: Acciaieria dei Tarvelin, la sala esposizione
    area: acciaieria
    ripetibile: true
    requisiti: [pista.acciaio == 3, profondita.acciaieria == 0]
    testo: |
      La sala dei clienti è lunga e bassa, e dal lucernaio scende una striscia di luce fino al bancone. Lungo
      le pareti ci sono rastrelliere di spade e manichini con le corazze, e più in basso padelle d'acciaio
      azzurro e falcetti da giardino. Le lame sono unte e senza un punto di ruggine, e sull'olio si è posata
      una polvere fine che nessuno ha tolto. Ogni oggetto ha il suo cartellino, e qualcuno ha corretto a penna
      il prezzo dei falcetti.

      {origine mercante-dei-ponti} Il prezzo corretto lo guardi due volte, per riflesso. Sui Ponti si abbassa
      così la merce che resta troppo sul banco, e i falcetti dei Tarvelin non li voleva nessuno già prima
      degli orchi.

      Dietro il bancone l'odore dolciastro si fa più forte. Nella polvere ci sono impronte di ogni misura, e
      le più grandi sono di piedi nudi e lunghe quanto il tuo avambraccio. Vanno verso il fondo della sala,
      dove una porta socchiusa lascia passare il rombo della fornace.
    opzioni:
      - testo: "Attraversare la sala senza urtare niente"
        descrizione: "Fra le rastrelliere c'è poco spazio, e qui dentro ogni cosa è di metallo."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Fra le lame
          testo: |
            Ti muovi di fianco fra le rastrelliere, con le braccia strette al corpo e gli occhi sulle punte
            delle spade, e le padelle restano ferme sui loro ganci. Le lame ti passano così vicine che senti
            sulla guancia l'odore del loro olio. A metà sala ti accorgi che cammini sulle punte, come in una
            casa dove dorme un neonato, e arrivi alla porta di fondo con la camicia incollata alla schiena.
          effetti: { profondita.acciaieria: 1 }
        fallimento:
          titolo: Le padelle
          testo: |
            Il gomito prende il bordo di una padella e la padella prende quella accanto, e per un tempo che
            non finisce più la sala suona come la bottega di un ramaio. Ti butti dietro il bancone e aspetti,
            e dalla fornace arriva soltanto il rombo di sempre. Quando ti rialzi hai il palmo aperto da un
            falcetto che hai afferrato per sbaglio cadendo, e il sangue gocciola su un cartellino del prezzo,
            proprio sulla cifra corretta a penna.
          effetti: { ferite: 0.5 }
      - testo: "Leggere le impronte nella polvere"
        descrizione: "Chi è passato di qui ha lasciato il segno, e non ha avuto la cura di cancellarlo."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: I due solchi
          testo: |
            Le impronte dei piedi nudi sono tante, e sono di orchi, con le dita aperte a ventaglio. In mezzo
            ne trovi una fila diversa, di stivali stretti con il tacco basso, e accanto due solchi lunghi e
            paralleli, lasciati da due tacchi trascinati. In tre punti i solchi finiscono in un mucchietto di
            polvere dove i tacchi si sono puntati, e poi riprendono più profondi. Vanno verso il fondo della
            sala, oltre la porta da cui arriva il rombo della fornace.
          effetti: { profondita.acciaieria: 1 }
        fallimento:
          titolo: La polvere
          testo: |
            Segui le impronte a testa bassa per tutta la sala, finché ti accorgi che le stai pestando tu e che
            metà di quelle che leggi sono tue, e l'altra metà le hai già rovinate. Ti raddrizzi con le
            ginocchia che scricchiolano. Dalla porta di fondo arriva una risata gutturale molto vicina, e
            resti ferm{o|a} con le mani sulle ginocchia finché il rombo della fornace non la copre di nuovo.
          effetti: { tormento: 1 }
      - testo: "Passare dietro il bancone, carponi"
        descrizione: "È la strada più lunga e la più bassa, e lì dietro nessuno spazza da settimane."
        costo: 2
        esito:
          titolo: Dietro il bancone
          testo: |
            Ti metti carponi e passi dietro il bancone, fra le casse degli imballi e un secchio con dentro uno
            straccio diventato duro. Il pavimento è coperto di trucioli di ferro arricciati che ti si piantano
            nei palmi uno alla volta. Sotto il cassetto dei soldi c'è un gatto morto da giorni e rannicchiato
            sul fianco, e da lì viene l'odore dolciastro. Distogli gli occhi prima di chiederti di chi fosse.
            Arrivi alla porta di fondo con le mani piene di schegge lucenti.
          effetti: { profondita.acciaieria: 1, ferite: 0.5 }

  - id: acciaieria-alloggi-dei-servitori
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Gli alloggi della servitù
    sommario: "Una camerata con le brande in fila. I letti sono disfatti e c'è sangue sulle lenzuola, fin sulle pareti."
    luogo: Acciaieria dei Tarvelin, gli alloggi della servitù
    area: acciaieria
    ripetibile: true
    requisiti: [pista.acciaio == 3, profondita.acciaieria == 2]
    testo: |
      In fondo a un corridoio stretto c'è la camerata della servitù, con le brande in fila sotto le finestre
      sbarrate e un baule ai piedi di ognuna. Le coperte sono a terra e i materassi squarciati, e dagli
      squarci esce la paglia. Sulle lenzuola e sui muri il sangue è diventato marrone, e sull'intonaco si
      stacca a scaglie. Su un baule qualcuno ha lasciato una pipa di gesso con il fornello ancora pieno, e il
      tabacco è pressato a regola senza un filo di cenere in cima.

      Sopra ogni branda pende da un chiodo una maschera di cuoio da operaio, con le lenti affumicate girate
      verso la stanza. Il cuoio ha preso la forma della faccia che lo portava, e lungo il bordo è più scuro
      dove il sudore l'ha impregnato. In fondo alla camerata una seconda porta dà sul corridoio della fornace.
      Nella stanza hanno rovesciato tutto tranne le maschere, che pendono dritte dai loro chiodi.

      {origine accolito-del-velo} Le labbra cominciano da sole la preghiera per chi è morto senza un prete
      accanto. Arrivi a metà prima di ricordarti dove sei, e la finisci lo stesso, ancora più piano.
    opzioni:
      - testo: "Capire che cosa è successo qui"
        descrizione: "Il sangue racconta le cose in ordine, a chi sa leggerlo."
        prova: { attributo: mentale, abilita: [medicina, percezione], difficolta: Media }
        successo:
          titolo: Nel sonno
          testo: |
            Ti fai forza e guardi da vicino, chin{o|a} sulle brande con le mani dietro la schiena. Il sangue è
            secco da almeno due settimane. Le brande hanno preso i colpi dall'alto e i bauli sono ancora
            chiusi, quindi chi dormiva qui non ha fatto in tempo ad alzarsi e chi l'ha ucciso non cercava
            soldi. I tagli nei materassi sono lunghi una spanna e hanno tutti la stessa inclinazione, da una
            branda all'altra. Le strisce scure sul pavimento vanno tutte nella stessa direzione, verso la
            porta della fornace. Le segui con gli occhi fino alla soglia, e lì ti fermi.
          effetti: { profondita.acciaieria: 1 }
        fallimento:
          titolo: Le maschere
          testo: |
            Ti avvicini alle brande, e ti sembra che le lenti affumicate delle maschere ti vengano dietro una
            dopo l'altra. Ti dici che a ogni passo la luce delle finestre scivola sul vetro e passa da una
            lente alla successiva. All'inizio è un'impressione, poi diventa una certezza. Esci nel corridoio e
            resti con le spalle contro il muro freddo, contando fino a cento i mattoni della parete di fronte.
            Quando ci torni dentro le maschere sono ferme sui loro chiodi e girate verso la stanza come prima,
            e la pipa di gesso è sempre sul baule.
          effetti: { tormento: 1 }
      - testo: "Ascoltare la memoria della stanza"
        descrizione: "Nei muri di una stanza dove si è morti di notte resta un'eco, per chi sa ascoltarla e ne ha il coraggio."
        incantesimo: eco
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: L'appello
          testo: |
            Appoggi il palmo sull'intonaco tiepido e la stanza ti riporta indietro di due settimane, al buio.
            Senti il russare di una decina di uomini, e poi la porta che sbatte contro il muro. In mezzo alle
            risate degli orchi c'è una voce sola che parla in elfico. È giovane e annoiata, e conta i letti
            uno per uno come un capomastro all'appello. Non ha nessuna fretta, e fra un numero e l'altro
            lascia passare sempre lo stesso tempo. Ritiri la mano di colpo, e il palmo è bagnato di sudore.
          effetti: { profondita.acciaieria: 1, informazioni.segreto: 0.5 }
        fallimento:
          titolo: Il russare
          testo: |
            La stanza ti riporta indietro di due settimane, e ci resti dentro più di quanto vorresti. L'odore
            di piedi e di sapone di una camerata qualunque a poco a poco diventa il tuo, e sotto la schiena
            senti la paglia del materasso che cede dove ha ceduto per anni sotto un altro corpo. Senti il
            russare degli uomini e non riesci a uscirne, e quando la porta sbatte sei ancora stes{o|a} su una
            di quelle brande. Ti ritrovi in ginocchio sul pavimento della camerata con le mani strette intorno
            al collo, e ci metti un pezzo a lasciarlo andare.
          effetti: { tormento: 1 }
      - testo: "Attraversare la camerata senza guardare"
        descrizione: "Gli occhi sul pavimento e la spalla contro il muro, fino all'altra porta."
        costo: 2
        esito:
          titolo: Lungo il muro
          testo: |
            Tieni gli occhi sul pavimento e la spalla contro il muro, e conti le brande dal rumore dei tuoi
            passi sulle assi. Davanti a ogni branda c'è un'asse che cede sotto il piede, nel punto dove per
            anni qualcuno è sceso dal letto. Sono dodici. All'altra porta ti accorgi di aver contato anche le
            maschere senza guardarle, e che il numero è lo stesso. Esci nel corridoio della fornace con un
            sapore di ferro in bocca e l'interno della guancia morso a sangue, e soltanto lì ti accorgi di
            averla morsa.
          effetti: { profondita.acciaieria: 1, tormento: 1 }

  - id: acciaieria-sala-da-pranzo
    immagine: bestiario/orco
    titolo: La sala da pranzo
    sommario: "Nella sala da pranzo due orchi giocano a carte con il mazzo degli operai e litigano su ogni mano."
    luogo: Acciaieria dei Tarvelin, la sala da pranzo
    area: acciaieria
    ripetibile: true
    requisiti: [pista.acciaio == 3, profondita.acciaieria == 1]
    testo: |
      Nella sala da pranzo degli operai c'è un tavolo solo, lungo quanto la stanza e con il piano di assi
      spesse segnato da anni di scodelle e di coltelli. Sulla panca in fondo al tavolo due orchi giocano con
      le carte degli operai, e a ogni mano il più grosso si prende tutti i re mentre l'altro grugnisce. Le
      carte sono unte e piegate agli angoli, e nelle mani degli orchi spariscono quasi del tutto. Contro il
      muro hanno appoggiato le pinze da forno che usano come mazze. Le ganasce sono nere di fuliggine e lunghe
      quanto il tuo avambraccio.

      {rissa Media} Il più grosso si regge sulla gamba buona e l'altra la tiene stesa sotto il tavolo. L'altro
      si gratta di continuo il gomito sinistro, e con quel braccio non alza niente. Le carte le tiene tutte
      nella destra.

      Per passare devi andare lungo il muro, alle loro spalle.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Sono due, e le pinze sono a portata di mano. Il rombo della fornace coprirà il rumore."
        combattimento: orchi-della-fornace
        vittoria:
          titolo: Il re di coppe
          testo: |
            Il più grosso si alza con le carte ancora in mano e le butta in aria quando gli arrivi addosso, e
            la stanza si riempie di re che cadono. Le pinze del secondo ti passano a un dito dalla faccia,
            ancora calde di forno, e senti l'odore dei tuoi capelli bruciacchiati. Vanno a sbattere sullo
            spigolo del tavolo e ci lasciano un segno nero di bruciato. Quando è finita resti appoggiat{o|a}
            al tavolo con le nocche spellate, e un re di coppe incollato sotto lo stivale.
          effetti: { profondita.acciaieria: 1 }
        sconfitta:
          titolo: Il manico delle pinze
          testo: |
            Il manico delle pinze ti prende nel fianco e ti manda contro la panca, e il secondo orco ride così
            forte che deve sedersi. Ti trascini fuori dalla sala tenendoti le costole, e ogni respiro ti punge
            sotto il braccio. Loro restano dove sono, perché la partita è ancora aperta. Dal corridoio senti
            di nuovo le carte sbattute sul tavolo, e poi il più grosso che conta i suoi re ad alta voce.
      - testo: "Passare lungo il muro, alle loro spalle"
        descrizione: "Guardano le carte e non la porta. Basta che non si girino."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Alle spalle
          testo: |
            Aspetti che il più grosso sbatta sul tavolo l'ennesimo re e passi mentre l'altro protesta,
            contando i passi sul ritmo dei grugniti. Le assi del pavimento sono vecchie e inchiodate bene, e
            sotto i tuoi piedi non scricchiolano. I due orchi non alzano la testa dalle carte. Sulla soglia ti
            volti un momento a guardarli. Il più piccolo ha nascosto un re sotto la coscia e sorride fra sé
            con tutte le zanne.
          effetti: { profondita.acciaieria: 1 }
        fallimento:
          titolo: La carta sul pavimento
          testo: |
            A metà del muro pesti una carta caduta, e la carta ti scivola sotto lo stivale con un fruscio. Il
            più grosso gira la testa. Ti tiri indietro nel corridoio mentre lui si alza, e le pinze arrivano
            contro lo stipite e ti prendono la spalla di striscio, calde come il fondo di una pentola. Sullo
            stipite resta una scheggia di legno annerito. Torni indietro di corsa con la spalla che brucia, e
            dietro di te l'orco torna a sedersi brontolando, perché nel frattempo l'altro gli ha guardato le
            carte.
          effetti: { ferite: 0.5 }
      - testo: "Far rotolare qualche moneta nel corridoio"
        descrizione: "Una manciata di monete. Gli orchi delle tribù conoscono quel suono meglio di quello delle carte."
        requisiti: [monete >= 5]
        esito:
          titolo: Il tintinnio
          testo: |
            Lanci una manciata di monete nel corridoio dalla parte opposta e le senti rimbalzare sulla pietra
            una alla volta, ognuna con la sua nota. I due orchi si alzano insieme e vanno a cercarle a quattro
            zampe, litigando anche su quelle. Tu passi lungo il muro alle loro spalle. Dalla soglia senti il
            più grosso che le conta ad alta voce nella sua lingua, e vedi l'altro che gliene strappa una di
            mano.
          effetti: { monete: -5, profondita.acciaieria: 1 }
      - testo: "Aspettare che si addormentino"
        descrizione: "Prima o poi la partita finisce, e gli orchi dormono dove capita."
        costo: 2
        esito:
          titolo: La partita lunga
          testo: |
            Ti siedi nel corridoio con la schiena al muro e aspetti. La partita va avanti per ore fra grugniti
            e pugni sul tavolo, e intanto la striscia di luce di una persiana scivola sul pavimento dai tuoi
            stivali fino al muro di fronte. Due volte uno dei due esce a pisciare a tre passi da dove sei
            rannicchiat{o|a}, senza accorgersi di te. Quando finalmente russano con la testa sul tavolo e le
            carte ancora in mano, passi alle loro spalle con le gambe addormentate e il collo rigido.
          effetti: { profondita.acciaieria: 1, tormento: 1 }

  - id: acciaieria-dispensa
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: La cucina e la dispensa
    sommario: "In cucina hanno cercato da mangiare con le mani e con le asce. Nell'angolo della dispensa c'è una spada da orco spezzata."
    luogo: Acciaieria dei Tarvelin, la cucina
    area: acciaieria
    ripetibile: true
    requisiti: [pista.acciaio == 3, profondita.acciaieria == 1]
    testo: |
      La cucina l'hanno fatta a pezzi cercando da mangiare. Le pentole di rame sono ammaccate e buttate negli
      angoli, e lo sportello della stufa pende da un cardine solo. Su una mensola rimasta in piedi c'è ancora
      la tazza del cuoco, con il manico riattaccato due volte con la colla. Le due giunture si distinguono
      bene, perché una è gialla e l'altra è più scura e più vecchia.

      La dispensa accanto è messa peggio. I barili sono sfondati e il grano dei sacchi è sparso fino alla
      porta. Dai ganci del soffitto mancano i prosciutti, e restano soltanto gli spaghi tagliati.

      Contro il muro nell'angolo c'è una corta spada da orco spezzata a metà. L'impugnatura è fasciata di
      cuoio annodato. Dove la lama si è rotta il ferro mostra un grano grosso e pieno di bolle, e sotto la
      ruggine è di un ferro così grezzo che a Qir-Azel nessun fabbro lo batterebbe.
    opzioni:
      - testo: "Esaminare la spada"
        descrizione: "Un'arma dice da dove viene, se la si guarda bene."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il nodo
          testo: |
            Giri la spada con la punta dello stivale. Il cuoio dell'impugnatura è chiuso da un nodo a tre giri
            che hai già visto, la sera del Festival, sulle armi degli orchi della razzia, e che da allora ti è
            capitato di sognare. La ruggine è vecchia di settimane e si stacca in scaglie arancioni dove lo
            stivale la tocca. *Gli orchi di quella sera sono passati di qui.* Ti si drizzano i peli delle
            braccia, e lasci la spada dove l'hai trovata.
          effetti: { profondita.acciaieria: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La ruggine
          testo: |
            Prendi la spada per l'impugnatura e la sollevi. Il cuoio marcio ti si sfalda in mano, e la lama
            gira e ti apre il polso di traverso. Il taglio è sottile e brucia più di quanto sanguini, per la
            ruggine che ci è rimasta dentro. La lasci cadere sul grano con un rumore sordo e resti in ascolto,
            aspettando passi dalla fornace che poi non arrivano. Ti fasci il polso con un pezzo di sacco, e il
            grano che c'era dentro ti finisce nella manica.
          effetti: { ferite: 0.5 }
      - testo: "Cercare fra le provviste qualcosa di intatto"
        descrizione: "Gli orchi cercavano carne. Un cuoco, di solito, tiene da parte anche altro."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La credenza del cuoco
          testo: |
            Dietro la stufa, in una nicchia che gli orchi non hanno visto, c'è la credenza personale del
            cuoco, chiusa con un pezzo di filo di ferro. Dentro ci sono un vaso di miele e un vasetto di
            unguento per le scottature. L'etichetta è scritta a mano, e nell'unguento c'è già il segno di una
            ditata. Il miele lo lasci dov'è, per pudore. L'unguento te lo metti in tasca, ed è tiepido per il
            calore che passa dal muro della fornace.
          effetti: { profondita.acciaieria: 1, unguento: 1 }
        fallimento:
          titolo: I topi
          testo: |
            Sposti un sacco di grano sventrato e sotto trovi i topi, una famiglia intera, che di te non ha
            nessuna paura. Sono grassi e hanno il pelo lucido, e nessuno di loro corre a nascondersi. Uno ti
            corre su per la manica e ti morde il dorso della mano prima che tu riesca a scrollartelo di dosso.
            Gli altri restano sul grano a guardarti, con la pancia piena e nessuna fretta. Ti succhi la mano e
            lasci la dispensa a loro.
          effetti: { ferite: 0.5 }
      - testo: "Aprirsi la strada fra i barili sfondati"
        descrizione: "Il passaggio è pieno di doghe rotte e di chiodi, ma porta dove devi andare."
        costo: 2
        esito:
          titolo: Le doghe
          testo: |
            Sposti i barili uno alla volta e piano, perché il rumore non arrivi alla fornace, e passi in mezzo
            alle doghe rotte con il grano che ti scricchiola sotto le suole. Le doghe sono di rovere e i
            cerchi di ferro sono saltati via tutti dalla stessa parte. Un chiodo ti si pianta nel polpaccio
            attraverso i calzoni. Lo togli stringendo i denti e lo appoggi sulla mensola accanto alla tazza
            del cuoco, perché lì ti sembra il suo posto, e un cuoco così ordinato lo avrebbe voluto.
          effetti: { profondita.acciaieria: 1, ferite: 0.5 }

  - id: acciaieria-archivi
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Gli archivi
    sommario: "Gli archivi dell'Acciaieria e l'ufficio di Ondrel Tarvelin, le sole stanze che gli orchi non hanno toccato."
    luogo: Acciaieria dei Tarvelin, gli archivi
    area: acciaieria
    ripetibile: true
    requisiti: [pista.acciaio == 3, profondita.acciaieria == 0]
    testo: |
      Gli archivi sono l'unica parte dell'Acciaieria che gli orchi non hanno toccato, forse perché la carta
      non si mangia. Gli scaffali pieni di fascicoli arrivano al soffitto, e ogni cassetto ha un'etichetta in
      una grafia stretta. I cassetti sono di noce scuro, con le maniglie d'ottone consumate e lucide solo nel
      punto dove le prendevano le dita. Sull'ultimo ripiano di uno scaffale c'è un cavallino di ceramica con
      la testa storta.

      Dietro una porta a vetri c'è un ufficio piccolo. Sulla scrivania c'è un bicchiere inciso con un dito di
      liquore seccato, che sul fondo ha lasciato un anello ambrato e crepato. Accanto c'è il registro delle
      commesse aperto all'ultima pagina. Le ultime righe sono di due settimane fa, e tutte dicono *rinviata*.
    opzioni:
      - testo: "Leggere gli indici dei cassetti"
        descrizione: "In un archivio tenuto così bene, quello che manca si nota subito."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Il buco
          testo: |
            Gli indici sono in ordine perfetto, e proprio per questo ti accorgi del buco. Una delle schede dei
            fornitori è stata grattata via pazientemente con un coltello, fino a lasciare la carta più
            sottile. In controluce leggi ancora la prima sillaba, *Capo*, e il cassetto corrispondente è
            vuoto. Sulla sua guida la polvere non c'è più, e sulle guide accanto è ancora intatta. Ti torna in
            mente Capomozzo, il nome che da giorni senti ripetere in città, e lo metti in fila con gli altri.
          effetti: { profondita.acciaieria: 1, informazioni.segreto: 0.5 }
        fallimento:
          titolo: La valanga
          testo: |
            Tiri un cassetto troppo pieno e il cassetto viene via tutto insieme, e cento fascicoli scivolano
            sul pavimento con un rumore di ali. Resti immobile con il cassetto vuoto fra le mani. Dallo
            scaffale il cavallino di ceramica ha la testa storta girata verso di te, con l'aria di non volerne
            sapere niente. Dalla fornace non viene nessuno. Rimetti a posto la carta in ginocchio per un'ora,
            e alla fine hai perso il filo di quello che cercavi.
          effetti: { tormento: 1 }
      - testo: "Aprire il cassetto della scrivania"
        descrizione: "È chiuso a chiave, e la scrivania è vecchia quanto l'Acciaieria."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il fondo che si sfila
          testo: |
            La serratura tiene, ma il fondo del cassetto è di legno vecchio e si sfila da sotto con due dita.
            La colla delle giunture è diventata polvere, e il bordo è tarlato. Dentro c'è una busta vuota con
            il sigillo dei Tarvelin rotto e un mazzo di ricevute per un carico di carbone, pagato tre volte
            quello che vale. In fondo al cassetto ci sono delle monete dimenticate. Le conti due volte prima
            di prenderle, e le ricevute le rimetti dove stavano.
          effetti: { profondita.acciaieria: 1, monete: 10 }
        fallimento:
          titolo: La punta del coltello
          testo: |
            Lavori sulla serratura con la punta del coltello e la lingua fra i denti, finché la punta si
            spezza dentro con uno scatto che ti fa sobbalzare. Il cassetto resta chiuso, e il coltello adesso
            è più corto di un dito. Ti tagli il pollice per togliere il pezzo di lama, e lasci una goccia di
            sangue sul registro delle commesse, proprio accanto alla parola *rinviata*.
          effetti: { ferite: 0.5 }
      - testo: "Passare fra gli scaffali al buio"
        descrizione: "Senza toccare niente e senza accendere niente, verso il fondo."
        costo: 2
        esito:
          titolo: Fra gli scaffali
          testo: |
            Passi fra gli scaffali al buio, con una mano tesa davanti alla faccia e l'odore di carta vecchia e
            di colla di farina nel naso. A metà corridoio la mano incontra un fascicolo sporgente, e subito
            dopo la fronte incontra lo scaffale. Ti siedi sul pavimento ad aspettare che le scintille smettano
            di girarti davanti agli occhi. Poi riprendi verso il fondo, dove il rombo della fornace torna a
            farsi sentire.
          effetti: { profondita.acciaieria: 1, ferite: 0.5 }

  - id: acciaieria-sala-di-carico
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: La sala di carico
    sommario: "Una carriola, le mensole dei reagenti e una cassaforte spalancata sul pavimento. Una scala scende verso i magazzini di sotto."
    luogo: Acciaieria dei Tarvelin, la sala di carico
    area: acciaieria
    ripetibile: true
    requisiti: [pista.acciaio == 3, profondita.acciaieria == 2]
    testo: |
      La sala di carico è il retro dell'Acciaieria, dove arrivano i carri, e nelle lastre del pavimento le
      ruote hanno scavato due solchi lisci. Contro una parete c'è una carriola con la ruota storta, e sulle
      mensole sono allineati i vasi dei reagenti con i tappi di cera ancora sigillati.

      In mezzo al pavimento c'è una cassaforte di ferro con lo sportello spalancato. Le pareti sono spesse
      quattro dita, e i ripiani dentro sono vuoti.

      Nell'angolo, oltre una porta con i cardini unti di fresco, una scala di pietra scende al buio verso i
      magazzini di sotto. L'olio sui cardini è ancora lucido e ha lasciato una riga scura sul legno dello
      stipite. Qui il rombo della fornace si sente meno, e dalla scala sale un'aria più fresca che sa di
      pietra. Sul primo gradino c'è una macchia d'acqua che non ha ancora fatto in tempo ad asciugare.
    opzioni:
      - testo: "Studiare la cassaforte"
        descrizione: "Una cassaforte forzata e una cassaforte aperta non si somigliano per niente."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La combinazione
          testo: |
            Lo sportello non ha un graffio, e le rotelle della serratura sono ferme su una combinazione
            precisa. L'ottone delle rotelle è lucido sulle tacche dove per anni le hanno girate sempre le
            stesse dita. Chi l'ha aperta conosceva i numeri, e in tutta Qir-Azel non dovevano conoscerli in
            molti. Sotto il ripiano interno, incastrate nella fessura, trovi qualche moneta sfuggita a chi ha
            svuotato il resto, e le fai sparire in tasca con un'abilità che non sapevi di avere.
          effetti: { profondita.acciaieria: 1, monete: 6 }
        fallimento:
          titolo: Lo sportello
          testo: |
            Ti chini sulla cassaforte e giri le rotelle per sentire come scattano. Lo sportello stava in
            equilibrio e ti si chiude sulle dita con un colpo che rimbomba per tutta la sala. Ti mordi la
            lingua per non gridare, e il sapore del sangue arriva insieme al dolore. Dalla fornace arriva una
            domanda in una lingua gutturale, e resti piegat{o|a} in due finché il rombo si richiude sopra la
            voce.
          effetti: { ferite: 0.5 }
      - testo: "Scendere qualche gradino ad ascoltare"
        descrizione: "I cardini sono unti di fresco. Qualcuno usa questa scala tutti i giorni."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il vassoio
          testo: |
            Scendi i primi gradini sulle punte, tenendoti al muro. La pietra è umida sotto le dita e a ogni
            gradino è più fresca. In fondo alla scala c'è un magazzino con due carriole, e oltre il magazzino
            una porta chiusa, con una serratura nuova e lucida che stona sul legno vecchio. Davanti alla porta
            c'è un vassoio con una scodella d'acqua e un pezzo di pane che nessuno ha toccato, già secco agli
            angoli. Quaggiù il rombo della fornace arriva soltanto dalla volta. Risali piano, un gradino alla
            volta, con gli occhi sulla porta.
          effetti: { profondita.acciaieria: 1 }
        fallimento:
          titolo: Il terzo gradino
          testo: |
            Il terzo gradino è più basso degli altri e il piede ci arriva in ritardo, e ti ritrovi sedut{o|a}
            sulla scala con un rumore che sale fino alla sala di carico. Resti immobile al buio, con il
            coccige che protesta a voce più alta di te. Il rumore scende per la scala e si perde sotto, e da
            sotto non risponde nessuno. Ti ci vuole un pezzo per convincere le gambe a risalire, e quando ci
            riesci ti fa male tutta la schiena.
          effetti: { ferite: 0.5 }
      - testo: "Nascondersi dietro la carriola e aspettare"
        descrizione: "Da qui si sentono la fornace e la scala. Prima o poi qualcuno passa, e poi se ne va."
        costo: 2
        esito:
          titolo: Il secchio
          testo: |
            Ti rannicchi dietro la carriola con le ginocchia contro il petto e aspetti. Dopo un'ora passa un
            orco con un secchio d'acqua e scende la scala con i piedi nudi che sulla pietra non fanno quasi
            rumore. Un'altra ora più tardi risale con il secchio vuoto. Quando ti alzi hai le gambe di legno e
            la schiena rigida, e nella sala non c'è più nessuno.

            {percezione Facile} Il secchio è sceso pieno ed è risalito vuoto, senza versarne una goccia sulle
            scale. Laggiù c'è qualcuno a cui l'acqua serve.
          effetti: { profondita.acciaieria: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · 3 → 4
  - id: la-fornace
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: La fornace
    sommario: "La sala della fornace, gli operai a terra e un uomo seduto, coperto d'acciaio."
    luogo: Acciaieria dei Tarvelin, la sala della fornace
    area: acciaieria
    requisiti: [pista.acciaio == 3, profondita.acciaieria >= 3]
    testo: |
      La fornace principale è una camera di pietra alta due piani che manda una luce azzurra, e nelle
      fondamenta i cristalli conduttori tengono in moto i mantici. Intorno alla bocca la pietra si è
      vetrificata con il calore, e nell'aria davanti alla bocca i contorni delle cose tremano.

      {tecnologia Media} I cristalli pulsano più in fretta del dovuto e i mantici rispondono a strappi, con il
      cuoio che sibila a ogni colpo. Stanno spingendo la fornace oltre il suo limite.

      {origine allievo-di-torvessa} Quel pulsare lo senti nei denti come al banco dell'Accademia il giorno del
      Festival, e stavolta non smette. Temmerin ripeteva che un cristallo tirato così finisce per incrinarsi.

      Per terra ci sono gli otto operai. Gli orchi hanno dato alla fornace quello che si poteva staccare, e
      sul resto hanno colato l'acciaio fuso, che raffreddandosi li ha saldati alle lastre del pavimento. Qui
      l'odore dolciastro che senti dall'ingresso è così forte che ti resta in fondo alla gola.

      Nell'alcova di mezzo, su una sedia dallo schienale alto, siede un uomo coperto di acciaio colato, lucido
      come una statua. Solo la mano destra è scoperta, e al dito c'è l'anello con il sigillo dei Tarvelin.

      Accanto alla sedia un mezzelfo ben vestito scrive su un libretto rilegato in pelle appoggiato a
      un'incudine. Ha un arco di legno chiaro sulla schiena e una bottiglia mezza vuota vicino al gomito, e
      quando alza la testa vedi che ha gli occhi di Liaren. Tre orchi caricano la fornace con le pale ridendo,
      e nessuno si è girato verso la porta.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Lui ha l'arco, gli orchi le pale e le pinze del forno. La bocca della fornace è a tre passi."
        combattimento: la-fornace
        vittoria:
          titolo: La scala
          testo: |
            Un orco cade contro la bocca della fornace, e gli altri due lasciano le pale e scappano verso la
            sala di carico. Isvaro tira due frecce, e la seconda ti passa sopra la spalla. Poi corre dietro
            agli orchi tenendosi il fianco dove l'hai preso. Lo raggiungi in cima alla scala dei magazzini. Si
            gira per dirti qualcosa, mette il piede nel vuoto e rotola fino in fondo. Quando arrivi giù ha il
            collo storto contro l'ultimo gradino e non respira più. Di sopra il rombo della fornace continua,
            e i mantici non hanno perso un colpo.

            Nella tasca della sua cintura c'è il libretto rilegato in pelle, e l'arco è intatto.
          effetti: { oggetto.diario-di-isvaro: 1, oggetto.arco-di-isvaro: 1, pista.acciaio: 1, racconto: 1 }
          imposta: { isvaro: 3 }
          segue: liaren-nella-cella
        sconfitta:
          titolo: La bocca della fornace
          testo: |
            Una pala ti prende alle gambe e finisci a terra. Due orchi ti trascinano per le caviglie verso la
            bocca della fornace, mentre il calore ti brucia la nuca e l'odore dei tuoi capelli ti riempie il
            naso. Sotto la schiena le lastre del pavimento sono così calde che la camicia ti si incolla alla
            pelle. Ti liberi a calci alla cieca, finché uno dei due molla la presa. Isvaro e gli orchi sono
            scappati per la sala di carico, e dal fondo della scala arriva il rumore dei loro passi.

            Sull'incudine accanto alla sedia, dove Isvaro l'ha lasciato per prendere l'arco, c'è il libretto
            rilegato in pelle.
          effetti: { oggetto.diario-di-isvaro: 1, pista.acciaio: 1 }
          imposta: { isvaro: 1 }
          segue: liaren-nella-cella
      - testo: "Coglierlo di sorpresa"
        descrizione: "Il rombo copre i passi e lui ti dà le spalle. Gli orchi guardano il fuoco, finché guardano il fuoco."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: La lama sotto il mento
          testo: |
            Giri intorno alle incudini nell'ombra dei mantici, con il rombo della fornace che copre ogni
            passo, e gli arrivi alle spalle mentre scrive. Gli passi il braccio intorno al collo e gli metti
            la lama sotto il mento. Isvaro si irrigidisce, poi ride piano senza muovere la testa, e la risata
            la senti nel braccio prima che nelle orecchie.

            «Poco ma sicuro, tu non sei mia sorella» dice.

            Gli orchi lasciano cadere le pale e scappano verso la sala di carico. Leghi Isvaro a un'incudine
            con le cinghie di un mantice e gli togli l'arco dalla schiena. Il libretto rilegato in pelle è
            rimasto aperto sul ferro, con la penna in mezzo.
          effetti: { oggetto.diario-di-isvaro: 1, oggetto.arco-di-isvaro: 1, pista.acciaio: 1, racconto: 1 }
          pe: { furtivita: 5 }
          imposta: { isvaro: 2 }
          segue: liaren-nella-cella
        fallimento:
          titolo: La tenaglia
          testo: |
            Isvaro si gira con l'arco già in mano, e non hai visto quando l'ha preso. La freccia ti prende
            alla spalla e ti butta contro il montante di un mantice. Mentre cerchi di strappartela un orco ti
            pesta la mano con il manico della pala, e il ferro della pala è caldo di fornace. Quando riesci a
            rimetterti in piedi lui e gli orchi sono già spariti verso la sala di carico.

            Il libretto rilegato in pelle è caduto dietro l'incudine, dove Isvaro l'ha lasciato per prendere
            l'arco.
          effetti: { oggetto.diario-di-isvaro: 1, pista.acciaio: 1, ferite: 2 }
          imposta: { isvaro: 1 }
          segue: liaren-nella-cella
      - testo: "Farlo parlare"
        descrizione: "Ha bevuto, e scrive accanto al cadavere di suo padre."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: L'ultimo dito di vino
          testo: |
            Avanzi a mani aperte e lo chiami per nome. Isvaro alza gli occhi dal libretto e fa segno agli
            orchi di stare fermi, con il gesto svogliato che si usa per i cani.

            «Mia sorella è di sotto a riflettere sulle sue scelte» dice. «Poco ma sicuro, le farà bene.»

            Lo lasci parlare e gli versi tu l'ultimo dito dalla bottiglia. Il vetro è tiepido per il calore
            della fornace, e il vino ha l'odore dolce di quello che è rimasto aperto troppo a lungo. Quando si
            siede sull'incudine per finirlo gli togli l'arco dalla schiena, e lui ti guarda fare con un mezzo
            sorriso. Appena vedono l'arco nelle tue mani gli orchi scappano verso la sala di carico senza
            aspettare un suo ordine. Leghi Isvaro con le cinghie di un mantice e prendi il libretto rilegato
            in pelle.
          effetti: { oggetto.diario-di-isvaro: 1, oggetto.arco-di-isvaro: 1, pista.acciaio: 1, racconto: 1 }
          pe: { empatia: 5 }
          imposta: { isvaro: 2 }
          segue: liaren-nella-cella
        fallimento:
          titolo: Il bifolco
          testo: |
            Lo chiami per nome e lui alza gli occhi dal libretto. Ti guarda dalla testa ai piedi, fermandosi
            sugli stivali più del necessario, e sospira.

            «Un altro bifolco con le buone intenzioni» dice. «Poco ma sicuro, ho una pagina da finire, e con
            te perderei soltanto tempo.»

            Un orco ti arriva addosso di fianco con le pinze del forno ancora rosse, e mentre ti difendi
            Isvaro prende l'arco e va verso la sala di carico senza correre. Quando Isvaro fischia dalla scala
            l'orco ti lascia e gli corre dietro. Il libretto rilegato in pelle è rimasto sull'incudine, con
            l'inchiostro dell'ultima riga ancora bagnato.
          effetti: { oggetto.diario-di-isvaro: 1, pista.acciaio: 1, ferite: 2 }
          imposta: { isvaro: 1 }
          segue: liaren-nella-cella
      - testo: "Lasciarlo andare e correre da Liaren"
        descrizione: "Gli dici che vuoi soltanto sua sorella. Lui sa dov'è, e forse ha fretta anche lui."
        esito:
          titolo: L'offerta
          testo: |
            Dalla soglia gli dici che sei venut{o|a} per Liaren e per nient'altro. Isvaro ti guarda a lungo
            con la penna sospesa sulla pagina, poi ride.

            «La trovi di sotto, nel magazzino in fondo» dice. «Viva, poco ma sicuro. Salutamela, e dille che
            l'offerta resta valida.»

            Fischia agli orchi, e se ne vanno tutti verso la sala di carico senza fretta. Ti passano a due
            braccia di distanza, e uno degli orchi ti annusa al passaggio con interesse professionale. Solo
            quando i passi si spengono in fondo alla scala vedi che il libretto rilegato in pelle è rimasto
            sull'incudine, accanto alla bottiglia vuota.
          effetti: { oggetto.diario-di-isvaro: 1, pista.acciaio: 1, tormento: 1.5 }
          imposta: { isvaro: 1 }
          segue: liaren-nella-cella
      - testo: "Gridare agli orchi con la voce dei sorveglianti"
        descrizione: "A Ghoran hai sentito come gridano i sorveglianti orchi quando vogliono un recinto vuoto."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [intimidire], difficolta: Difficile }
        successo:
          titolo: Il recinto vuoto
          testo: |
            Riempi il petto di aria calda e gridi dalla soglia le parole dei recinti, quelle che a Ghoran
            facevano correre tutti verso il muro prima ancora di capire chi le aveva dette. I tre orchi
            lasciano le pale nello stesso momento e si voltano con le spalle curve e la testa bassa. Le pale
            cadono sulle lastre con un rumore che si sente anche sopra il rombo. Poi scappano verso la sala di
            carico, senza guardare il mezzelfo.

            Isvaro allunga la mano verso l'arco e trova te a un passo, con la lama alla gola. «Poco ma sicuro,
            questa non me l'aspettavo» dice. Lo leghi a un'incudine con le cinghie di un mantice e gli togli
            l'arco dalla schiena. Il libretto rilegato in pelle è rimasto aperto sul ferro.
          effetti: { oggetto.diario-di-isvaro: 1, oggetto.arco-di-isvaro: 1, pista.acciaio: 1, racconto: 1 }
          imposta: { isvaro: 2 }
          segue: liaren-nella-cella
        fallimento:
          titolo: La voce che manca
          testo: |
            Gridi dalla soglia le parole dei recinti, e la voce ti si spezza a metà come in piazza la sera
            della razzia. Gli orchi si girano, vedono chi ha gridato e si mettono a ridere.

            Il primo orco ti arriva addosso con le pinze del forno ancora rosse, e ti si chiudono
            sull'avambraccio. La manica fuma dove le ganasce la stringono. Mentre ti difendi Isvaro prende
            l'arco e va verso la sala di carico senza correre, e quando fischia dalla scala l'orco ti lascia e
            gli corre dietro. Il libretto rilegato in pelle è rimasto sull'incudine, con l'inchiostro
            dell'ultima riga ancora bagnato.
          effetti: { oggetto.diario-di-isvaro: 1, pista.acciaio: 1, ferite: 2 }
          imposta: { isvaro: 1 }
          segue: liaren-nella-cella
      - testo: "Spezzare il ritmo dei cristalli"
        descrizione: "Se rompi il ritmo, la fornace sputa fuoco su chi le sta davanti."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [magia, tecnologia], difficolta: Difficile }
        successo:
          titolo: La vampata
          testo: |
            Ti inginocchi accanto alle fondamenta e appoggi le dita sul cristallo più vicino, contando gli
            impulsi come al banco dell'Accademia. Il cristallo è caldo sotto i polpastrelli e vibra a ogni
            impulso fino alle nocche. Al terzo spingi il Mana a contrattempo, e il cristallo salta un colpo. I
            mantici si sgonfiano tutti insieme e poi soffiano in una volta sola, e dalla bocca della fornace
            esce una vampata azzurra che butta a terra gli orchi con le pale in mano.

            Isvaro, accecato dalla vampata, cerca l'arco a tentoni e trova la tua lama sotto il mento. «Poco
            ma sicuro, questo l'hai imparato a Torvessa» dice. Lo leghi a un'incudine con le cinghie di un
            mantice e gli togli l'arco, poi prendi il libretto rilegato in pelle.
          effetti: { oggetto.diario-di-isvaro: 1, oggetto.arco-di-isvaro: 1, pista.acciaio: 1, racconto: 1 }
          pe: { magia: 5 }
          imposta: { isvaro: 2 }
          segue: liaren-nella-cella
        fallimento:
          titolo: Il cristallo che risponde
          testo: |
            Appoggi le dita sul cristallo e spingi il Mana a contrattempo, ma il cristallo tira più forte di
            te. Il colpo ti risale il braccio fino alla spalla e ti butta all'indietro contro un'incudine, e i
            mantici non perdono nemmeno un battito. Le dita ti restano intorpidite fino alle nocche.

            Isvaro si gira con l'arco già in mano. La freccia ti prende alla spalla mentre cerchi di
            rialzarti, e un orco ti pesta la mano con il manico della pala. Quando riesci a rimetterti in
            piedi lui e gli orchi sono già spariti verso la sala di carico. Il libretto rilegato in pelle è
            caduto dietro l'incudine.
          effetti: { oggetto.diario-di-isvaro: 1, pista.acciaio: 1, ferite: 2 }
          imposta: { isvaro: 1 }
          segue: liaren-nella-cella
      - testo: "Parlargli come si parla a un Tarvelin"
        descrizione: "Isvaro chiama tutti bifolchi, e le buone maniere dei Casati le ha imparate da lontano. Con chi le conosce dalla nascita, forse, abbassa l'arco."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Difficile }
        successo:
          titolo: Le condoglianze
          testo: |
            Entri senza fretta, come in un salotto dove sei attes{o|a}, e gli porgi le condoglianze per il
            padre con la formula intera, quella che nei Quartieri Alti si dice al figlio maggiore. Isvaro
            resta con la penna a mezz'aria e una goccia d'inchiostro gli cade sulla pagina. Nessuno, in tutta
            la sua vita, gliel'ha mai detta.

            Parla a lungo, e intanto beve, finché si siede su un'incudine per finire la bottiglia e tu gli
            togli l'arco dalla schiena. Gli orchi, appena lo vedono nelle tue mani, scappano verso la sala di
            carico. Leghi Isvaro con le cinghie di un mantice e prendi il libretto rilegato in pelle.
          effetti: { oggetto.diario-di-isvaro: 1, oggetto.arco-di-isvaro: 1, pista.acciaio: 1, racconto: 1 }
          imposta: { isvaro: 2 }
          segue: liaren-nella-cella
        fallimento:
          titolo: Il salotto sbagliato
          testo: |
            Cominci con la formula delle condoglianze, e Isvaro scoppia a ridere prima che tu arrivi a metà.
            «Un Castaldi o un Malgrani, dal tono» dice. «Poco ma sicuro, le formule dei Casati non le
            sopporto. I bifolchi almeno parlano come mangiano.»

            Fa un cenno con il mento, e un orco ti arriva addosso di fianco con le pinze del forno ancora
            rosse, che ti si chiudono sull'avambraccio. Senti il calore attraverso la manica prima ancora
            della stretta. Mentre ti difendi Isvaro prende l'arco e va verso la sala di carico senza correre.
            Il libretto rilegato in pelle è rimasto sull'incudine, con l'inchiostro dell'ultima riga ancora
            bagnato.
          effetti: { oggetto.diario-di-isvaro: 1, pista.acciaio: 1, ferite: 2 }
          imposta: { isvaro: 1 }
          segue: liaren-nella-cella

  # ------------------------------------------------------------ 4 → 5 · la cella (A21)
  - id: liaren-nella-cella
    immagine: personaggi/liaren-tarvelin
    titolo: La cella
    tipo: seguito
    luogo: Acciaieria dei Tarvelin, i magazzini di sotto
    area: acciaieria
    requisiti: [pista.acciaio == 4]
    testo: |
      La scala della sala di carico scende in un magazzino basso dove un tempo tenevano la sabbia, e sul
      pavimento ne è rimasto uno strato fine che scricchiola sotto le suole. Accanto alle scale un muro di
      mattoni è stato abbattuto a colpi di mazza. La malta fra i mattoni è nera e friabile, e i colpi hanno
      lasciato sui bordi spigoli chiari e freschi. Dal buco esce un'aria fredda e umida che sa di terra.
      Davanti ai mattoni caduti la sabbia è spazzata in un ventaglio pulito che si apre verso il magazzino.

      In fondo al magazzino c'è una porta chiusa a chiave, e la chiave è appesa a un chiodo lì accanto, come
      la terrebbe un magazziniere.

      Dentro, la stanza è stata svuotata per farne una cella, e sulle pareti restano le strisce chiare dove
      stavano appoggiati gli scaffali. Liaren è stesa su un fianco con i polsi e le caviglie legati, e i
      tatuaggi delle braccia sono grigi di polvere. Ha gli occhi bendati e la bocca chiusa da una cinghia di
      cuoio. Sopra l'occhio ha un taglio, e la camicia è rigida di sangue sul fianco sinistro.

      {origine fuggiasco-di-ghoran} I polsi ti fanno male a guardarli. Una corda stretta così la conosci dalla
      parte di chi la porta, e sai che il dolore vero arriva dopo, quando il sangue torna nelle mani.

      Ti inginocchi accanto a lei e tagli le corde. È canapa grossa da carico annodata con il doppio giro che
      si usa per le casse, e la lama ci mette un po' a passarla. Le togli la benda e la cinghia, che le ha
      lasciato un solco rosso sulle guance. Il polso è debole ma regolare, e la pelle è fredda.

      {medicina Media} Il freddo e la sete si curano dopo. Prima va chiuso il taglio sul fianco.
    opzioni:
      - testo: "Medicarla con quello che sai"
        descrizione: "Il taglio sul fianco va chiuso prima di muoverla. Le mani le hai, e la borraccia anche."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Il fianco
          testo: |
            Le pulisci il taglio con l'acqua della borraccia, e il sangue secco si scioglie e cola rosa sulla
            sabbia del pavimento. Lo chiudi con una striscia della tua camicia tirata stretta. Lei geme senza
            svegliarsi, e tu le chiedi scusa a ogni giro. Poi le sollevi la testa e le bagni le labbra. Liaren
            apre gli occhi di colpo, e con l'energia che le hai visto al Grifone si tira su a sedere da sola.

            «Portami fuori da qui» dice, e ti stringe il braccio con tutte e due le mani.
          effetti: { liaren.salvata: 1, pista.acciaio: 1 }
          pe: { medicina: 5 }
          segue: liaren-sul-gradino
        fallimento:
          titolo: Le mani che scivolano
          testo: |
            Il taglio è più profondo di quanto credevi, e quando stringi la fascia il sangue ricomincia a
            uscire. Ci metti troppo a fermarlo, perché la sabbia del pavimento ti si attacca alle dita bagnate
            e il nodo non viene mai come quelli dei libri. Liaren si sveglia a metà con un gemito e ti afferra
            il polso con una forza che non ti aspettavi.

            «Lascia stare. Portami fuori, e il resto me lo ricuce Brunella» dice fra i denti, senza mollarti
            il polso.
          effetti: { liaren.salvata: 1, pista.acciaio: 1, tormento: 1 }
          segue: liaren-sul-gradino
      - testo: "Chiudere la ferita con la Liturgia"
        descrizione: "Le parole dell'Albero chiudono le ferite sotto le mani, se le mani restano ferme."
        incantesimo: rimarginare
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Sotto le mani
          testo: |
            Appoggi le mani sul fianco di Liaren e dici le parole della Liturgia, e senti la ferita stringersi
            sotto i palmi. La pelle tira e si scalda come quella di una mano che torna dal gelo, e i bordi del
            taglio si accostano fino a lasciare una riga sottile. Il colore le torna in faccia un poco alla
            volta.

            «Questa me la segni sul conto» dice, aggrappandosi alla tua spalla per alzarsi, «e adesso portami
            fuori.»
          effetti: { liaren.salvata: 1, pista.acciaio: 1 }
          segue: liaren-sul-gradino
        fallimento:
          titolo: La parola storta
          testo: |
            A metà della formula la voce ti si incrina, e la ferita si chiude solo in superficie. Si chiude
            storta, con la pelle tirata in una piega lucida sopra il fianco. Nelle mani ti resta un freddo che
            sale fino ai gomiti e lì si ferma, come un'acqua che non sa dove andare. Liaren si sveglia con un
            sussulto e si piega in avanti.

            «Che cosa mi hai fatto?» chiede, ma prima che tu risponda scuote la testa e ti tende la mano
            perché la tiri su.
          effetti: { liaren.salvata: 1, pista.acciaio: 1, tormento: 1 }
          segue: liaren-sul-gradino
      - testo: "Fasciarla con le tue bende"
        descrizione: "Le bende che ti porti dietro per te stesso."
        requisiti: [bende >= 1]
        esito:
          titolo: Tre giri
          testo: |
            Le giri le bende intorno al fianco per due volte, poi per una terza, finché il sangue smette di
            passare. La macchia si allarga sul lino ai primi due giri, e al terzo resta ferma. Le bagni le
            labbra con la borraccia. Liaren apre gli occhi e li richiude subito, offesa dalla luce. Quando li
            riapre ti guarda come se dovesse metterti a fuoco da lontano.

            «Sei tu. Allora sono ancora viva. Tirami su, che qui dentro puzza» dice con un filo di voce,
            cercando il tuo braccio con la mano.
          effetti: { bende: -1, liaren.salvata: 1, pista.acciaio: 1 }
          segue: liaren-sul-gradino
      - testo: "Darle un tonico"
        descrizione: "Una boccetta che avevi tenuto da parte per te."
        requisiti: [tonico >= 1]
        esito:
          titolo: Il tonico
          testo: |
            Le sollevi la testa e le versi il tonico fra le labbra, poco alla volta, perché non le vada di
            traverso. Dalla boccetta sale un odore di radici e di alcol forte. Al terzo sorso tossisce e apre
            gli occhi, e la smorfia arriva prima della parola. Il colore le torna in faccia, e la mano le va
            da sola al fianco.

            «Sa di piedi. Grazie lo stesso, e adesso portami fuori da questa stanza» dice con la voce
            arrochita, pulendosi la bocca con il polso.
          effetti: { tonico: -1, liaren.salvata: 1, pista.acciaio: 1 }
          segue: liaren-sul-gradino
      - testo: "Portarla fuori di peso"
        descrizione: "Su per la scala, e poi attraverso tutta l'Acciaieria. Pesa più di quanto sembra."
        esito:
          titolo: Di peso
          testo: |
            Te la carichi sulle spalle come un sacco di grano e sali la scala un gradino alla volta, con le
            cosce che bruciano. Pesa più di quanto sembra, e a ogni gradino la senti scivolare un poco di
            lato. Attraversi la sala di carico e i corridoi, e lei non si sveglia nemmeno quando le sbatti la
            testa contro uno stipite. Fuori la metti a sedere sul gradino della porta delle consegne. L'aria
            della strada la sveglia, e la prima cosa che fa è vomitarti sugli stivali.
          effetti: { ferite: 0.5, liaren.salvata: 1, pista.acciaio: 1 }
          segue: liaren-sul-gradino
      - testo: "Medicarla come nella tenda di Vantes"
        descrizione: "La sera della razzia, sotto il palco, hai chiuso ferite peggiori con meno. Le mani se lo ricordano."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La tenda dei feriti
          testo: |
            Lavi il taglio con l'acqua della borraccia, stringi una striscia di stoffa sopra il fianco e premi
            finché il sangue non rallenta. Intanto conti i respiri di Liaren invece dei tuoi, e le mani fanno
            da sole quello che facevano sotto il palco la sera della razzia.

            Liaren apre gli occhi alla terza volta che dici il suo nome, e si tira su a sedere da sola
            tenendosi il fianco. «Portami fuori da qui» dice, e ti stringe il braccio con tutte e due le mani.
          pe: { medicina: 5 }
          effetti: { liaren.salvata: 1, pista.acciaio: 1 }
          segue: liaren-sul-gradino
      - testo: "Fermare il sangue con il muschio dei muri"
        descrizione: "Dal buco nel muro esce aria umida, e dove c'è umido c'è muschio. Al Circolo lo usano per le ferite delle bestie e delle persone."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Il muschio
          testo: |
            Sui mattoni del muro abbattuto, dalla parte del buio, il muschio cresce a cuscinetti scuri e
            freddi. Ne stacchi una manciata con le unghie e la strizzi, e l'acqua che ne cola è gelata e sa di
            pietra. Nel pugno il muschio resta freddo anche dopo che l'hai stretto a lungo. Lo premi sul
            taglio e lo fermi con una striscia della tua camicia.

            Liaren apre gli occhi e guarda la poltiglia verde che ha sul fianco. «Se questa è una cura dei
            boschi, non dirlo a Brunella» dice, e ti stringe il braccio con tutte e due le mani per tirarsi
            su. «Portami fuori da qui.»
          pe: { natura: 5 }
          effetti: { liaren.salvata: 1, pista.acciaio: 1 }
          segue: liaren-sul-gradino
      - testo: "Fasciarla come un compagno sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice chi si ferisce si fascia stretto e subito, con quello che si ha addosso, e poi lo si porta su."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: La regola delle piattaforme
          testo: |
            Tagli una striscia dalla camicia e la giri due volte sopra il taglio, perché la stoffa è sottile.
            Poi la stringi con un nodo da Raschiatore che si stringe tirando e non si scioglie. Le bagni le
            labbra con la borraccia.

            Liaren apre gli occhi e si tira su a sedere da sola, tenendosi il fianco. «Portami fuori da qui»
            dice, e ti stringe il braccio con tutte e due le mani.
          effetti: { liaren.salvata: 1, pista.acciaio: 1 }
          segue: liaren-sul-gradino

  - id: liaren-sul-gradino
    immagine: personaggi/liaren-tarvelin
    titolo: Sul gradino
    tipo: seguito
    luogo: Acciaieria dei Tarvelin, la porta delle consegne
    area: acciaieria
    requisiti: [pista.acciaio == 5]
    testo: |
      Liaren si siede sul gradino della porta delle consegne con una mano premuta sul fianco, e per un po' non
      dice niente. Il gradino è una lastra di pietra consumata a conca nel mezzo dai sacchi che ci hanno
      trascinato sopra. Mandi alla Caserma un ragazzino che gioca con un cerchio, e gli prometti uno spicciolo
      per quando torna.

      «Mi ha raccontato tutto lui, di nostro padre» dice Liaren. «Con tutti i particolari, come se mi leggesse
      una lettera. E l'ultima cosa che quel vecchio mi ha detto è che per lui ero morta.» Si passa il dorso
      della mano sulla bocca. «Isvaro dice che li guida Aurenne, la sua amata, che ha grandi progetti per
      Qir-Azel. Mi ha detto di non farmi trovare in città quando cominciano. Poi quel coglione mi ha chiesto
      se volevo unirmi a quelli di Capomozzo.»

      Resta zitta a guardare la strada e si massaggia con il pollice le nocche gonfie dell'altra mano. Sulle
      punte la pelle è aperta.

      {empatia Media} Le nocche le fanno male, e ne è contenta. È l'unica parte di questa storia che ha scelto
      da sé.

      «Gli ho tirato un pugno nello stomaco, e lui ha chiamato i suoi orchi. Il resto lo hai visto.» Poi alza
      gli occhi su di te. «L'hai ucciso?»

      {origine apprendista-raschiatore} Ti viene in mente la branda della camerata, con la coperta ruvida che
      sapeva di liscivia. Quella branda te l'ha pagata lei dopo la razzia, quando ancora non sapeva chi fossi.
    opzioni:
      - testo: "Dirle che è scappato"
        descrizione: "Con gli orchi, dal muro abbattuto accanto alla scala dei magazzini."
        requisiti: [isvaro == 1]
        esito:
          titolo: Scappato
          testo: |
            Le dici che è scappato con i suoi orchi, dal muro abbattuto accanto alla scala.

            «Da ragazzo scappava anche dalle lezioni di scherma» dice. «Poi la sera tornava e diceva che il
            maestro era un bifolco.»

            Vuole tornare al Grifone a piedi, e non c'è verso di farle cambiare idea. All'imbocco del Ponte
            del Pesce ti toglie il braccio dalle spalle. «Da qui ci arrivo da sola. Brunella mi deve veder
            entrare sulle mie gambe.» La guardi salire verso i Ponti con la mano sul fianco. Si ferma a ogni
            lanterna e si appoggia al palo, finché la strada gira.
          vai: citta-bassa
      - testo: "Dirle che è legato di sopra"
        descrizione: "A un'incudine, con le cinghie di un mantice, accanto a suo padre."
        requisiti: [isvaro == 2]
        esito:
          titolo: Di sopra
          testo: |
            Le dici che Isvaro è di sopra, legato a un'incudine con le cinghie di un mantice.

            «Il secondo pugno glielo do quando sto in piedi» dice alla fine. «Dallo alla Caserma, e che lo
            chiudano dove non può scrivere lettere.»

            La ronda arriva poco dopo. Sono due guardie e un sergente con il fiatone, e quando vede la sala
            della fornace il sergente si siede su una cassa e si toglie l'elmo, come in chiesa. Isvaro lo
            segue in silenzio e a testa alta, con i polsi legati davanti. Passa accanto a Liaren sul gradino e
            non abbassa gli occhi su di lei.
          effetti: { rep.caserma: 0.5 }
          vai: citta-bassa
      - testo: "Dirle che è morto"
        descrizione: "In fondo alla scala dei magazzini, scappando."
        requisiti: [isvaro == 3]
        esito:
          titolo: Le pesche
          testo: |
            Le dici che è caduto dalla scala dei magazzini mentre scappava, e che sotto il telo in fondo alla
            scala c'era lui. Liaren guarda la strada, dove il ragazzino del cerchio non è ancora tornato. Poi
            si guarda le mani e le gira piano, come se dovesse riconoscerle.

            «Gli portavo le pesche all'Accademia. Le sbucciava con il coltello, tutte in un pezzo solo, e la
            buccia la lasciava a me» dice, senza smettere di guardarsi le mani.
          vai: citta-bassa
