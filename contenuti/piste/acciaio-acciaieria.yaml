# Acciaio e Ira, la spedizione nell'Acciaieria dei Tarvelin (pista.acciaio 3 → 5).
# Si entra da `davanti-all-acciaieria` (acciaio-1.yaml). Dentro sei stanze ripetibili, in ordine secondo
# la profondità: 0 la parte davanti (la sala dei clienti o gli archivi), 1 la parte degli operai (la sala
# da pranzo o la cucina), 2 il retro verso la fornace (gli alloggi o la sala di carico). Una stanza
# superata non ricompare nella stessa visita. Poi il cuore nella sala della fornace (A17), che imposta
# `isvaro` (1 fuggito, 2 preso vivo, 3 morto) e dà il diario in ogni ramo, poi due seguiti: la cella di
# Liaren (A21) e la sua domanda sul gradino, che riporta in Città Bassa.
aree:
  - id: acciaieria
    immagine: ambientazione/acciaieria-di-qir-azel
    nome: Acciaieria dei Tarvelin
    sommario: "Dietro le persiane chiuse da due settimane la fornace ruggisce ancora, e oltre i magazzini, da qualche parte, c'è Liaren."
    spedizione: { ritorno: citta-bassa, soglia: 3, stanze: 3 }
    testo: |
      Dentro, la luce passa soltanto dalle fessure delle persiane e taglia il
      pavimento a strisce. L'aria è calda e ferma, e sotto l'odore di metallo
      e di carbone ce n'è un altro, dolciastro, che ti fa portare la manica
      sotto il naso.

      Il rombo della fornace arriva da tutte le pareti insieme e ti entra nei
      denti, e ogni tanto, in mezzo, si sente una risata gutturale. Fra la
      sala dei clienti e la fornace ci sono magazzini e uffici, e un
      corridoio che porta agli alloggi della servitù.

storylet:
  # ------------------------------------------------------------ 3 · rientrare dopo una ritirata
  # davanti-all-acciaieria vale solo a pista 2: chi esce dalla spedizione rientra da qui.
  - id: tornare-nell-acciaieria
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Di nuovo all'Acciaieria
    sommario: "Liaren è ancora da qualche parte oltre i magazzini, e la ciminiera continua a fumare."
    luogo: Acciaieria dei Tarvelin, Città Bassa
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.acciaio == 3]
    testo: |
      Dalla ciminiera dei Tarvelin il fumo sale dritto come prima, e sul
      gradino della porta degli operai qualcuno del vicinato ha messo una
      scodella di latte per un gatto che da due settimane non si fa vedere.

      {origine figlio-della-citta-bassa} Scodelle così le mettono i vicini
      quando qualcuno non rientra, e nessuno le tocca finché non si sa che
      fine ha fatto.

      Nel vicolo sul retro, in mezzo al rombo della fornace, arriva ogni
      tanto una risata gutturale. La strada per entrare la conosci già, e le
      mani hanno già controllato due volte il coltello.
    opzioni:
      - testo: "Rientrare"
        descrizione: "Dalla stessa strada della prima volta, sperando che nessuno l'abbia chiusa."
        esito:
          titolo: Di nuovo dentro
          testo: |
            Rientri piano dalla stessa strada della prima volta e ti richiudi alle
            spalle la luce del vicolo. L'odore dolciastro ti prende alla gola
            prima che gli occhi si abituino al buio. Resti con la schiena contro
            il muro finché le strisce di luce delle persiane tornano a disegnare
            il pavimento, poi ti muovi verso il rombo della fornace.
          vai: acciaieria

  # ------------------------------------------------------------ le stanze (ripetibili, in fasce di profondità)
  - id: acciaieria-sala-esposizione
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: La sala dei clienti
    sommario: "La sala dove i clienti dei Tarvelin guardavano lame e padelle, con grandi impronte di piedi nudi nella polvere."
    luogo: Acciaieria dei Tarvelin, la sala esposizione
    area: acciaieria
    ripetibile: true
    requisiti: [pista.acciaio == 3, profondita.acciaieria == 0]
    testo: |
      La sala dei clienti è lunga e bassa, con una striscia di luce che
      scende dal lucernaio fino al bancone. Lungo le pareti stanno le
      rastrelliere delle spade, e più in basso padelle d'acciaio azzurro e
      falcetti da giardino con il cartellino del prezzo.

      {origine mercante-dei-ponti} Il prezzo dei falcetti è corretto a penna
      verso il basso, come sui Ponti si fa con la merce rimasta troppo sul
      banco.

      Nella polvere le impronte più grandi sono di piedi nudi e vanno tutte,
      per la stessa striscia di pavimento, verso una porta socchiusa da cui
      passa il rombo della fornace.
    opzioni:
      - testo: "Attraversare la sala senza urtare niente"
        descrizione: "Fra le rastrelliere c'è poco spazio, e qui dentro ogni cosa è di metallo."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Fra le lame
          testo: |
            Ti muovi di fianco fra le rastrelliere, con le braccia strette al
            corpo e gli occhi sulle punte delle spade, e le padelle restano ferme
            sui loro ganci. Arrivi alla porta di fondo camminando sulle punte,
            come in una casa dove dorme un neonato, con la camicia incollata alla
            schiena.
          effetti: { profondita.acciaieria: 1 }
        fallimento:
          titolo: Le padelle
          testo: |
            Il gomito prende il bordo di una padella e la padella prende quella
            accanto, e per un tempo che non finisce più la sala suona come la
            bottega di un ramaio. Ti butti dietro il bancone e dalla fornace
            arriva soltanto il rombo di sempre. Quando ti rialzi hai il palmo
            aperto da un falcetto afferrato cadendo.
          effetti: { ferite: 0.5 }
      - testo: "Leggere le impronte nella polvere"
        descrizione: "Chi è passato di qui ha lasciato il segno, e non ha avuto la cura di cancellarlo."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: I due solchi
          testo: |
            Ti accovacci vicino al bancone. Fra le impronte dei piedi nudi degli
            orchi, con le dita aperte a ventaglio, c'è una fila di stivali stretti
            dal tacco basso, e accanto due solchi paralleli lasciati da due tacchi
            trascinati. I solchi vanno verso la porta della fornace, e la polvere
            sopra non ha fatto in tempo a posarsi.
          effetti: { profondita.acciaieria: 1 }
        fallimento:
          titolo: La polvere
          testo: |
            Segui le impronte a testa bassa per tutta la sala, finché ti accorgi
            che metà di quelle che leggi sono tue e l'altra metà le hai già
            rovinate. Dalla porta di fondo arriva una risata gutturale molto
            vicina, e resti fermo finché il rombo della fornace non la copre di
            nuovo.
          effetti: { tormento: 1 }
      - testo: "Passare dietro il bancone, carponi"
        descrizione: "È la strada più lunga e la più bassa, e lì dietro nessuno spazza da settimane."
        costo: 2
        esito:
          titolo: Dietro il bancone
          testo: |
            Passi carponi dietro il bancone, fra le casse degli imballi, su un
            pavimento di trucioli di ferro che ti si piantano nei palmi uno alla
            volta. Sotto il cassetto dei soldi c'è un gatto morto da giorni,
            rannicchiato sul fianco. Arrivi alla porta di fondo con le mani piene
            di schegge lucenti.
          effetti: { profondita.acciaieria: 1, ferite: 0.5 }

  - id: acciaieria-alloggi-dei-servitori
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Gli alloggi della servitù
    sommario: "Una camerata di brande in fila con i letti disfatti, e sangue sulle lenzuola fin sulle pareti."
    luogo: Acciaieria dei Tarvelin, gli alloggi della servitù
    area: acciaieria
    ripetibile: true
    requisiti: [pista.acciaio == 3, profondita.acciaieria == 2]
    testo: |
      In fondo a un corridoio stretto c'è la camerata della servitù, con i
      materassi squarciati e il sangue, ormai marrone, sui muri fino
      all'altezza di una mano alzata. Sopra ogni branda pende da un chiodo una
      maschera di cuoio da operaio, con le lenti affumicate girate verso la
      stanza, e sotto quella vicino alla porta ci sono un paio di scarpe della
      festa mai portate.

      {origine accolito-del-velo} Le labbra cominciano da sole la preghiera per
      chi è morto senza un prete accanto, e la finisci, ancora più piano.

      Una seconda porta dà sul corridoio della fornace.
    opzioni:
      - testo: "Capire che cosa è successo qui"
        descrizione: "Il sangue racconta le cose in ordine, a chi sa leggerlo."
        prova: { attributo: mentale, abilita: [medicina, percezione], difficolta: Media }
        successo:
          titolo: Nel sonno
          testo: |
            Ti chini sulle brande con le mani dietro la schiena. Il sangue è secco da almeno due settimane, le brande hanno
            preso i colpi dall'alto e i bauli sono ancora chiusi, quindi chi dormiva non ha fatto in tempo ad alzarsi e chi
            l'ha ucciso non cercava soldi. Le strisce scure sul pavimento vanno tutte verso la porta della fornace.
          effetti: { profondita.acciaieria: 1 }
        fallimento:
          titolo: Le maschere
          testo: |
            Ti avvicini alle brande, e ti sembra che le lenti affumicate delle maschere ti
            vengano dietro una dopo l'altra. Esci nel corridoio e resti con la fronte
            contro il muro, contando i mattoni fino a cento. Quando ci torni dentro le
            maschere sono ferme sui loro chiodi come prima.
          effetti: { tormento: 1 }
      - testo: "Ascoltare la memoria della stanza"
        descrizione: "Nei muri di una stanza dove si è morti di notte resta un'eco, per chi sa ascoltarla e ne ha il coraggio."
        incantesimo: eco
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: L'appello
          testo: |
            Appoggi il palmo sul muro e la stanza ti riporta indietro di due
            settimane, al buio, fra il russare di una decina di uomini, finché la
            porta sbatte contro il muro. In mezzo alle risate degli orchi c'è una
            voce giovane e annoiata che parla in elfico e conta i letti uno per
            uno, come un capomastro all'appello. Ritiri la mano bagnata di sudore.
          effetti: { profondita.acciaieria: 1, informazioni.segreto: 0.5 }
        fallimento:
          titolo: Il russare
          testo: |
            La stanza ti riporta indietro di due settimane e ci resti dentro più di quanto vorresti, steso su
            una di quelle brande quando la porta sbatte. Ti ritrovi in ginocchio sul pavimento della
            camerata, con le mani strette intorno al collo, e ci metti un pezzo a lasciarlo andare.
          effetti: { tormento: 1 }
      - testo: "Attraversare la camerata senza guardare"
        descrizione: "Gli occhi sul pavimento e la spalla contro il muro, fino all'altra porta."
        costo: 2
        esito:
          titolo: Lungo il muro
          testo: |
            Tieni gli occhi sul pavimento e la spalla contro il muro, e conti
            dodici brande dal rumore dei tuoi passi, tante quante le maschere che
            hai contato senza guardarle. Esci nel corridoio della fornace con
            l'interno della guancia morso a sangue, e te ne accorgi soltanto lì.
          effetti: { profondita.acciaieria: 1, tormento: 1 }

  - id: acciaieria-sala-da-pranzo
    immagine: bestiario/orco
    titolo: La sala da pranzo
    sommario: "Nella sala da pranzo due orchi giocano a carte con il mazzo degli operai e litigano su ogni mano."
    luogo: Acciaieria dei Tarvelin, la sala da pranzo
    area: acciaieria
    ripetibile: true
    requisiti: [pista.acciaio == 3, profondita.acciaieria == 1]
    testo: |
      Sul tavolo lungo della sala da pranzo sono rimasti il pane ammuffito e
      i boccali rovesciati della sera in cui è finita. In fondo, seduti sulla
      stessa panca, due orchi giocano con le carte degli operai, e a ogni
      mano il più grosso si prende tutti i re e l'altro protesta con un
      grugnito. Accanto a loro, contro il muro, ci sono le pinze da forno che
      usano come mazze.

      {rissa Media} Il più grosso tiene il peso sulla gamba buona, e l'altro
      con il braccio sinistro non alza niente.

      Per passare devi andare lungo il muro, alle loro spalle.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Sono due, e le pinze sono a portata di mano. Il rombo della fornace coprirà il rumore."
        combattimento: orchi-della-fornace
        vittoria:
          titolo: Il re di coppe
          testo: |
            Il più grosso butta in aria le carte quando gli arrivi addosso, e per
            un momento la stanza è piena di re che cadono. Le pinze del secondo ti
            passano a un dito dalla faccia, ancora calde di forno. Quando è finita
            resti appoggiato al tavolo con le nocche spellate e un re di coppe
            incollato sotto lo stivale.
          effetti: { profondita.acciaieria: 1 }
        sconfitta:
          titolo: Il manico delle pinze
          testo: |
            Il manico delle pinze ti prende nel fianco e ti manda contro la panca,
            e il secondo orco ride così forte che deve sedersi. Ti trascini fuori
            tenendoti le costole, e loro restano dove sono, perché la partita è
            ancora aperta.
      - testo: "Passare lungo il muro, alle loro spalle"
        descrizione: "Guardano le carte e non la porta. Basta che non si girino."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Alle spalle
          testo: |
            Aspetti che il più grosso sbatta sul tavolo l'ennesimo re e passi mentre l'altro protesta, e i due non alzano
            la testa dalle carte. Sulla soglia ti volti, e vedi che il più piccolo ha nascosto un re sotto la coscia e
            sorride fra sé con tutte le zanne.
          effetti: { profondita.acciaieria: 1 }
        fallimento:
          titolo: La carta sul pavimento
          testo: |
            A metà del muro pesti una carta caduta e il più grosso gira la testa.
            Ti tiri indietro mentre lui si alza, e le pinze ti prendono la spalla
            di striscio, calde come il fondo di una pentola. Dietro di te l'orco
            torna a sedersi brontolando, perché nel frattempo l'altro gli ha
            guardato le carte.
          effetti: { ferite: 0.5 }
      - testo: "Far rotolare qualche moneta nel corridoio"
        descrizione: "Una manciata di monete. Gli orchi delle tribù conoscono quel suono meglio di quello delle carte."
        requisiti: [monete >= 5]
        esito:
          titolo: Il tintinnio
          testo: |
            Lanci una manciata di monete in fondo al corridoio e le senti rimbalzare
            sulla pietra. I due orchi vanno a cercarle a quattro zampe, litigando
            anche su quelle, e tu passi lungo il muro alle loro spalle mentre il più
            grosso le conta ad alta voce nella sua lingua.
          effetti: { monete: -5, profondita.acciaieria: 1 }
      - testo: "Aspettare che si addormentino"
        descrizione: "Prima o poi la partita finisce, e gli orchi dormono dove capita."
        costo: 2
        esito:
          titolo: La partita lunga
          testo: |
            Ti siedi nel corridoio con la schiena al muro e aspetti. La partita va
            avanti per ore, e due volte uno dei due esce a pisciare a tre passi da
            te senza vederti. Quando finalmente russano, con la testa sul tavolo,
            passi alle loro spalle con le gambe addormentate e il collo rigido.
          effetti: { profondita.acciaieria: 1, tormento: 1 }

  - id: acciaieria-dispensa
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: La cucina e la dispensa
    sommario: "In cucina hanno frugato anche con le asce, e nella dispensa giace una spada da orco spezzata."
    luogo: Acciaieria dei Tarvelin, la cucina
    area: acciaieria
    ripetibile: true
    requisiti: [pista.acciaio == 3, profondita.acciaieria == 1]
    testo: |
      La cucina l'hanno fatta a pezzi cercando da mangiare, ma su una mensola
      rimasta in piedi c'è ancora la tazza del cuoco, con il manico riattaccato
      due volte con la colla. Nella dispensa accanto il grano è sparso fino alla
      porta.

      Nell'angolo a nord, contro il muro, c'è una spada da orco larga e corta,
      spezzata a metà, con l'impugnatura fasciata di cuoio annodato e una lama di
      ferro così grezzo che a Qir-Azel nessun fabbro lo batterebbe.

      {armi-da-mischia Media} Si è spezzata di piatto contro una pietra, in mano
      a uno che non aveva mai preso una lezione.
    opzioni:
      - testo: "Esaminare la spada"
        descrizione: "Un'arma dice da dove viene, se la si guarda bene."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il nodo
          testo: |
            Giri la spada con la punta dello stivale. Il cuoio dell'impugnatura è
            chiuso da un nodo a tre giri che hai già visto, la sera del Festival,
            sulle armi degli orchi della razzia, e la ruggine è vecchia di
            settimane. *Gli orchi di quella sera sono passati di qui.* Lasci la
            spada dove l'hai trovata.
          effetti: { profondita.acciaieria: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La ruggine
          testo: |
            Prendi la spada per l'impugnatura, il cuoio marcio ti si sfalda in
            mano e la lama gira e ti apre il polso di traverso. La lasci cadere
            sul grano e resti in ascolto, ma dalla fornace non arriva nessuno. Ti
            fasci il polso con un pezzo di sacco.
          effetti: { ferite: 0.5 }
      - testo: "Cercare fra le provviste qualcosa di intatto"
        descrizione: "Gli orchi cercavano carne. Un cuoco, di solito, tiene da parte anche altro."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La credenza del cuoco
          testo: |
            Dietro la stufa, in una nicchia che gli orchi non hanno visto, c'è la
            credenza personale del cuoco, chiusa con un filo di ferro. Dentro ci
            sono un vaso di miele e un vasetto di unguento per le scottature con
            l'etichetta scritta a mano. Il miele per pudore lo lasci al cuoco,
            mentre l'unguento te lo metti in tasca.
          effetti: { profondita.acciaieria: 1, unguento: 1 }
        fallimento:
          titolo: I topi
          testo: |
            Sposti un sacco di grano sventrato e sotto trovi una famiglia intera
            di topi che di te non ha nessuna paura. Uno ti corre su per la manica
            e ti morde il dorso della mano prima che tu riesca a scrollartelo di
            dosso, e la dispensa la lasci a loro.
          effetti: { ferite: 0.5 }
      - testo: "Aprirsi la strada fra i barili sfondati"
        descrizione: "Il passaggio è pieno di doghe rotte e di chiodi, ma porta dove devi andare."
        costo: 2
        esito:
          titolo: Le doghe
          testo: |
            Sposti i barili uno alla volta, piano, perché il rumore non arrivi
            alla fornace, e un chiodo ti si pianta nel polpaccio attraverso i
            calzoni. Lo togli stringendo i denti e lo appoggi sulla mensola
            accanto alla tazza del cuoco, perché lì ti sembra il suo posto.
          effetti: { profondita.acciaieria: 1, ferite: 0.5 }

  - id: acciaieria-archivi
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Gli archivi
    sommario: "Gli archivi dell'Acciaieria e l'ufficio di Ondrel Tarvelin, le sole stanze che gli orchi non hanno toccato."
    luogo: Acciaieria dei Tarvelin, gli archivi
    area: acciaieria
    ripetibile: true
    requisiti: [pista.acciaio == 3, profondita.acciaieria == 0]
    testo: |
      Gli archivi sono l'unica parte dell'Acciaieria che gli orchi non hanno
      toccato, forse perché la carta non si mangia. Gli scaffali arrivano al
      soffitto, pieni di contratti legati con il nastro, e su quello più
      basso un cavallino di ceramica con la testa incollata storta fa da
      fermacarte.

      Dietro una porta a vetri c'è l'ufficio di Ondrel, con una scrivania
      sgombra e il registro delle commesse aperto all'ultima pagina. Le
      ultime righe sono di due settimane fa, e accanto a ognuna c'è la
      stessa parola, *rinviata*.
    opzioni:
      - testo: "Leggere gli indici dei cassetti"
        descrizione: "In un archivio tenuto così bene, quello che manca si nota subito."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Il buco
          testo: |
            Gli indici sono in ordine perfetto, e proprio per questo ti accorgi del
            buco. Una scheda dei fornitori è stata grattata via con un coltello, e
            in controluce leggi ancora la prima sillaba, *Capo*, mentre il cassetto
            corrispondente è vuoto. Ti torna in mente Capomozzo, il nome che da
            giorni senti ripetere in città.
          effetti: { profondita.acciaieria: 1, informazioni.segreto: 0.5 }
        fallimento:
          titolo: La valanga
          testo: |
            Tiri un cassetto troppo pieno e viene via tutto insieme, e cento
            fascicoli scivolano sul pavimento con un rumore di ali. Dalla fornace
            non viene nessuno. Rimetti a posto la carta in ginocchio per un'ora,
            sotto lo sguardo storto del cavallino di ceramica, e alla fine hai
            perso il filo di quello che cercavi.
          effetti: { tormento: 1 }
      - testo: "Aprire il cassetto della scrivania"
        descrizione: "È chiuso a chiave, e la scrivania è vecchia quanto l'Acciaieria."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il fondo che si sfila
          testo: |
            Il fondo del cassetto, di legno vecchio, si sfila da sotto. Dentro ci sono una
            busta vuota col sigillo rotto dei Tarvelin e le ricevute di un carico di carbone
            pagato il triplo. Prendi le monete dimenticate in fondo e rimetti le ricevute al
            loro posto.

            {politica-ed-economia Media} La differenza è andata a qualcun altro, e le ricevute
            servivano a giustificarla.
          effetti: { profondita.acciaieria: 1, monete: 10 }
        fallimento:
          titolo: La punta del coltello
          testo: |
            Lavori sulla serratura con la punta del coltello finché la punta si
            spezza dentro con uno scatto. Il cassetto resta chiuso, il coltello è
            più corto di un dito, e ti tagli il pollice per togliere il pezzo di
            lama, lasciando una goccia di sangue sul registro accanto alla parola
            *rinviata*.
          effetti: { ferite: 0.5 }
      - testo: "Passare fra gli scaffali al buio"
        descrizione: "Senza toccare niente e senza accendere niente, verso il fondo."
        costo: 2
        esito:
          titolo: Fra gli scaffali
          testo: |
            Passi fra gli scaffali al buio, con una mano tesa davanti alla faccia,
            e a metà corridoio la fronte incontra uno scaffale. Ti siedi sul
            pavimento ad aspettare che le scintille smettano di girarti davanti
            agli occhi, poi riprendi verso il fondo, dove il rombo della fornace
            torna a farsi sentire.
          effetti: { profondita.acciaieria: 1, ferite: 0.5 }

  - id: acciaieria-sala-di-carico
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: La sala di carico
    sommario: "Una carriola, le mensole dei reagenti e una cassaforte spalancata, e una scala che scende verso i magazzini di sotto."
    luogo: Acciaieria dei Tarvelin, la sala di carico
    area: acciaieria
    ripetibile: true
    requisiti: [pista.acciaio == 3, profondita.acciaieria == 2]
    testo: |
      La sala di carico è il retro dell'Acciaieria, dove arrivano i carri.
      Contro una parete c'è una carriola con la ruota storta, sulle mensole i
      vasi dei reagenti, e in mezzo al pavimento una cassaforte di ferro alta
      fino al ginocchio, spalancata, con un cerchio pulito nella polvere del
      fondo dove stavano le monete.

      Nell'angolo, oltre una porta con i cardini unti di fresco, una scala di
      pietra scende al buio verso i magazzini di sotto.

      {furtivita Media} Cardini unti di fresco vogliono dire che qualcuno
      scende spesso, e non vuole farsi sentire.
    opzioni:
      - testo: "Studiare la cassaforte"
        descrizione: "Una cassaforte forzata e una cassaforte aperta non si somigliano per niente."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La combinazione
          testo: |
            Lo sportello non ha un graffio e le rotelle sono ferme su una
            combinazione precisa, quindi chi l'ha aperta conosceva i numeri, e in
            tutta Qir-Azel non dovevano conoscerli in molti. Incastrate sotto il
            ripiano interno trovi qualche moneta sfuggita a chi ha svuotato il
            resto, e le fai sparire in tasca.
          effetti: { profondita.acciaieria: 1, monete: 6 }
        fallimento:
          titolo: Lo sportello
          testo: |
            Giri le rotelle per sentire come scattano, e lo sportello ti si chiude
            sulle dita con un colpo che rimbomba per tutta la sala. Dalla fornace
            arriva una domanda in una lingua gutturale, e resti piegato in due
            finché il rombo si richiude sopra la voce.
          effetti: { ferite: 0.5 }
      - testo: "Scendere qualche gradino ad ascoltare"
        descrizione: "I cardini sono unti di fresco. Qualcuno usa questa scala tutti i giorni."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il vassoio
          testo: |
            Scendi i primi gradini sulle punte. In fondo c'è un magazzino con due
            carriole, e oltre una porta chiusa con una serratura nuova e lucida.
            Davanti alla porta, su un vassoio, ci sono una scodella d'acqua e un
            pezzo di pane intatto, già secco agli angoli.

            {empatia Media} Chi sta dall'altra parte ha deciso di non mangiare,
            con tutta la testardaggine che ha.
          effetti: { profondita.acciaieria: 1 }
        fallimento:
          titolo: Il terzo gradino
          testo: |
            Il terzo gradino è più basso degli altri, e ti ritrovi seduto sulla
            scala con un rumore che sale fino alla sala di carico. Resti immobile
            al buio, ma da sotto non risponde nessuno, e quando riesci a risalire
            ti fa male tutta la schiena.
          effetti: { ferite: 0.5 }
      - testo: "Nascondersi dietro la carriola e aspettare"
        descrizione: "Da qui si sentono la fornace e la scala. Prima o poi qualcuno passa, e poi se ne va."
        costo: 2
        esito:
          titolo: Il secchio
          testo: |
            Ti rannicchi dietro la carriola e aspetti. Dopo un'ora passa un orco
            con un secchio d'acqua e scende la scala, e dopo un'altra ora risale
            con il secchio vuoto e sputa per terra prima di tornare verso la
            fornace. Laggiù c'è qualcuno a cui l'acqua serve.
          effetti: { profondita.acciaieria: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · 3 → 4
  - id: la-fornace
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: La fornace
    sommario: "Nella sala della fornace, accanto a un uomo coperto d'acciaio, un mezzelfo con l'arco in spalla."
    luogo: Acciaieria dei Tarvelin, la sala della fornace
    area: acciaieria
    requisiti: [pista.acciaio == 3, profondita.acciaieria >= 3]
    testo: |
      La sala della fornace occupa tutto il fondo dell'Acciaieria, e il caldo
      ti prende in faccia appena apri la porta. La fornace è una camera di
      pietra alta due piani che manda una luce azzurra, e nelle fondamenta i
      cristalli conduttori pulsano e tengono in moto i mantici.

      {origine allievo-di-torvessa} Quel pulsare è troppo veloce, e Temmerin
      ha detto più di una volta che un cristallo tirato così finisce per
      incrinarsi.

      Per terra ci sono gli otto operai, e sui loro corpi gli orchi hanno
      colato l'acciaio fuso. Nell'alcova di mezzo, su una sedia dallo
      schienale alto, siede un uomo coperto d'acciaio indurito, lucido come
      una statua da fontana, con il bastone nero contro il bracciolo e alla
      mano destra l'anello dei Tarvelin. *È Ondrel, e l'hanno messo in posa.*
      Ti accorgi che stai stringendo lo stipite.

      Accanto alla sedia un mezzelfo ben vestito scrive su un libretto
      rilegato in pelle appoggiato a un'incudine, con un arco di legno chiaro
      sulla schiena e una bottiglia mezza vuota vicino al gomito. Ha gli
      occhi di Liaren. Tre orchi caricano la fornace con le pale, e nessuno
      si è ancora girato verso la porta.

      {armi-da-distanza Media} Sta con il fuoco negli occhi, e più gli arrivi
      vicino prima che si giri, meno conta quanto è bravo con l'arco.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Lui ha l'arco, gli orchi le pale e le pinze del forno. La bocca della fornace è a tre passi."
        combattimento: la-fornace
        vittoria:
          titolo: La scala
          testo: |
            Un orco cade e gli altri due scappano verso la sala di carico. Isvaro
            li segue tenendosi il fianco, ma in cima alla scala mette il piede nel
            vuoto e rotola fino in fondo, con il collo storto contro l'ultimo
            gradino. Alla sua cintura c'è il libretto rilegato in pelle; gli orchi
            sono spariti oltre un muro abbattuto accanto alla scala.
          effetti: { oggetto.diario-di-isvaro: 1, oggetto.arco-di-isvaro: 1, pista.acciaio: 1, racconto: 1 }
          imposta: { isvaro: 3 }
          segue: liaren-nella-cella
        sconfitta:
          titolo: La bocca della fornace
          testo: |
            Una pala ti prende alle gambe, e due orchi ti trascinano per le
            caviglie verso la bocca della fornace finché ti liberi a calci, alla
            cieca. Quando ti rimetti in piedi Isvaro e gli orchi sono scappati per
            la sala di carico. Sull'incudine accanto alla sedia, dove Isvaro l'ha
            lasciato per prendere l'arco, c'è il libretto rilegato in pelle.
          effetti: { oggetto.diario-di-isvaro: 1, pista.acciaio: 1 }
          imposta: { isvaro: 1 }
          segue: liaren-nella-cella
      - testo: "Coglierlo di sorpresa"
        descrizione: "Il rombo copre i passi e lui ti dà le spalle. Gli orchi guardano il fuoco, finché guardano il fuoco."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: La lama sotto il mento
          testo: |
            Giri intorno alle incudini e gli arrivi alle spalle con la lama sotto il mento.
            «Poco ma sicuro, tu non sei mia sorella» ride piano Isvaro. «Lei mi avrebbe già
            rotto il naso.»

            Gli orchi scappano verso la sala di carico. Gli togli l'arco e lo leghi a
            un'incudine con le cinghie di un mantice. Il libretto rilegato in pelle è
            rimasto aperto sul ferro.
          effetti: { oggetto.diario-di-isvaro: 1, oggetto.arco-di-isvaro: 1, pista.acciaio: 1, racconto: 1 }
          pe: { furtivita: 5 }
          imposta: { isvaro: 2 }
          segue: liaren-nella-cella
        fallimento:
          titolo: La tenaglia
          testo: |
            A metà strada urti una tenaglia, che cade sulla pietra con un suono di
            campana. Isvaro si gira con l'arco già in mano e la freccia ti prende
            alla spalla, mentre un orco ti pesta la mano con la pala. Quando ti
            rialzi lui e gli orchi sono spariti verso la sala di carico, e il
            libretto rilegato in pelle è caduto dietro l'incudine.
          effetti: { oggetto.diario-di-isvaro: 1, pista.acciaio: 1, ferite: 2 }
          imposta: { isvaro: 1 }
          segue: liaren-nella-cella
      - testo: "Farlo parlare"
        descrizione: "Ubriaco, accanto al cadavere del padre, ha voglia di essere ascoltato, ma l'arco resta a portata."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: L'ultimo dito di vino
          testo: |
            Avanzi a mani aperte chiamandolo per nome. Isvaro ferma gli orchi con un
            gesto svogliato e parla volentieri, senza mai guardare la sedia. «Mia
            sorella è di sotto a riflettere sulle sue scelte, poco ma sicuro» dice.

            Quando si siede a finire la bottiglia gli togli l'arco, e gli orchi
            scappano. Leghi Isvaro con le cinghie di un mantice e prendi il libretto
            rilegato in pelle.
          effetti: { oggetto.diario-di-isvaro: 1, oggetto.arco-di-isvaro: 1, pista.acciaio: 1, racconto: 1 }
          pe: { empatia: 5 }
          imposta: { isvaro: 2 }
          segue: liaren-nella-cella
        fallimento:
          titolo: Il bifolco
          testo: |
            Lo chiami per nome e lui sospira. «Un altro bifolco con le buone
            intenzioni» dice. «Poco ma sicuro, questa città ne produce più che
            acciaio.»

            A un suo cenno un orco ti chiude sull'avambraccio le pinze roventi del
            forno, e mentre ti difendi Isvaro prende l'arco e se ne va verso la
            sala di carico, e l'orco lo segue. Il libretto rilegato in pelle è
            rimasto sull'incudine.
          effetti: { oggetto.diario-di-isvaro: 1, pista.acciaio: 1, ferite: 2 }
          imposta: { isvaro: 1 }
          segue: liaren-nella-cella
      - testo: "Lasciarlo andare e correre da Liaren"
        descrizione: "Gli dici che vuoi soltanto sua sorella. Lui sa dov'è, e forse ha fretta anche lui."
        esito:
          titolo: L'offerta
          testo: |
            Dalla soglia gli dici che sei venuto per Liaren e per nient'altro. Isvaro ti guarda
            con la penna sospesa, poi ride. «La trovi nel magazzino in fondo, viva, poco ma
            sicuro. Dille che l'offerta resta valida.»

            Fischia agli orchi e se ne vanno tutti verso la sala di carico, a due braccia da
            te. Il libretto rilegato in pelle resta sull'incudine.
          effetti: { oggetto.diario-di-isvaro: 1, pista.acciaio: 1, tormento: 1.5 }
          imposta: { isvaro: 1 }
          segue: liaren-nella-cella
      - testo: "Gridare agli orchi con la voce dei sorveglianti"
        descrizione: "Conosci da Ghoran il grido con cui i sorveglianti orchi svuotano un recinto."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [intimidire], difficolta: Difficile }
        successo:
          titolo: Il recinto vuoto
          testo: |
            Gridi dalla soglia le parole dei recinti di Ghoran, e i tre orchi
            lasciano le pale insieme e scappano verso la sala di carico. Isvaro
            cerca l'arco e trova la tua lama alla gola. «Poco ma sicuro, questa
