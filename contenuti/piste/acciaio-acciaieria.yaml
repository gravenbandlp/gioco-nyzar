  # ------------------------------------------------------------ 4 → 5 · la cella (A21)
  - id: liaren-nella-cella
    immagine: personaggi/liaren-tarvelin
    titolo: La cella
    tipo: seguito
    luogo: Acciaieria dei Tarvelin, i magazzini di sotto
    area: acciaieria
    requisiti: [pista.acciaio == 4]
    testo: |
      La scala scende in un magazzino basso per la sabbia, dove un muro di mattoni è
      stato abbattuto a colpi di mazza e dal buco esce un'aria fredda e umida.

      In fondo c'è una porta chiusa, con la chiave appesa lì accanto. Dentro, Liaren è
      stesa a terra legata e bendata, con una cinghia sulla bocca. Ha la camicia rigida
      di sangue sul fianco.

      {origine fuggiasco-di-ghoran} Una corda stretta così la conosci dalla parte di chi
      la porta, e sai che il dolore vero arriva quando il sangue torna nelle mani.

      Tagli le corde, sbagliando il nodo due volte per la fretta, e le togli benda e
      cinghia. Il polso è debole ma regolare, e la pelle è fredda.

      {medicina Media} Il freddo e la sete si curano dopo, e il taglio sul fianco va
      chiuso per primo.
    opzioni:
      - testo: "Medicarla con quello che sai"
        descrizione: "Il taglio sul fianco va chiuso prima di muoverla. Le mani le hai, e la borraccia anche."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Il fianco
          testo: |
            Le pulisci il taglio con l'acqua della borraccia e lo chiudi con una striscia della tua camicia,
            stretta, chiedendole scusa a ogni giro. Quando le bagni le labbra Liaren apre gli occhi di colpo
            e si tira su a sedere da sola. Si guarda intorno, e alla fine guarda te. «Portami fuori da qui»
            dice, e ti stringe il braccio con tutte e due le mani.
          effetti: { liaren.salvata: 1, pista.acciaio: 1 }
          pe: { medicina: 5 }
          segue: liaren-sul-gradino
        fallimento:
          titolo: Le mani che scivolano
          testo: |
            Il taglio è più profondo di quanto credevi, e quando stringi la fascia
            il sangue ricomincia a uscire. Liaren si sveglia con un gemito e ti
            afferra il polso con una forza che non ti aspettavi. «Lascia stare.
            Portami fuori, e il resto me lo ricuce Brunella» dice fra i denti.
          effetti: { liaren.salvata: 1, pista.acciaio: 1, tormento: 1 }
          segue: liaren-sul-gradino
      - testo: "Chiudere la ferita con la Liturgia"
        descrizione: "Le parole dell'Albero chiudono le ferite sotto le mani, se le mani restano ferme."
        incantesimo: rimarginare
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Sotto le mani
          testo: |
            Appoggi le mani sul fianco di Liaren e dici le parole della Liturgia,
            e senti la ferita stringersi sotto i palmi mentre il colore le torna
            in faccia. Apre gli occhi e si tira su a sedere, con una mano sul
            fianco dove la pelle è nuova e tirata. «Questa me la segni sul conto»
            dice, aggrappandosi alla tua spalla, «e adesso portami fuori.»
          effetti: { liaren.salvata: 1, pista.acciaio: 1 }
          segue: liaren-sul-gradino
        fallimento:
          titolo: La parola storta
          testo: |
            A metà della formula la voce ti si incrina, e la ferita si chiude solo
            in superficie, storta, lasciandoti nelle mani un freddo che sale fino
            ai gomiti. Liaren si sveglia con un sussulto. «Che cosa mi hai fatto?»
            chiede, ma prima che tu risponda scuote la testa e ti tende la mano
            perché la tiri su.
          effetti: { liaren.salvata: 1, pista.acciaio: 1, tormento: 1 }
          segue: liaren-sul-gradino
      - testo: "Fasciarla con le tue bende"
        descrizione: "Le bende che ti porti dietro per te stesso."
        requisiti: [bende >= 1]
        esito:
          titolo: Tre giri
          testo: |
            Le giri le bende intorno al fianco tre volte, finché il sangue smette
            di passare, e le bagni le labbra con la borraccia. Liaren apre gli
            occhi e ti guarda come se dovesse metterti a fuoco da lontano. «Sei
            tu. Allora sono ancora viva. Tirami su, che qui dentro puzza» dice con
            un filo di voce.
          effetti: { bende: -1, liaren.salvata: 1, pista.acciaio: 1 }
          segue: liaren-sul-gradino
      - testo: "Darle un tonico"
        descrizione: "Una boccetta che avevi tenuto da parte per te."
        requisiti: [tonico >= 1]
        esito:
          titolo: Il tonico
          testo: |
            Le sollevi la testa e le versi il tonico fra le labbra, poco alla
            volta. Al terzo sorso tossisce e apre gli occhi, e la smorfia arriva
            prima della parola. «Sa di piedi. Grazie lo stesso, e adesso portami
            fuori da questa stanza» dice con la voce arrochita.
          effetti: { tonico: -1, liaren.salvata: 1, pista.acciaio: 1 }
          segue: liaren-sul-gradino
      - testo: "Portarla fuori di peso"
        descrizione: "Su per la scala, e poi attraverso tutta l'Acciaieria. Pesa più di quanto sembra."
        esito:
          titolo: Di peso
          testo: |
            Te la carichi sulle spalle come un sacco di grano e sali la scala un
            gradino alla volta, con le cosce che bruciano, poi attraversi la sala
            di carico e i corridoi. Fuori la metti a sedere sul gradino della
            porta delle consegne. L'aria della strada la sveglia, e la prima cosa
            che fa è vomitarti sugli stivali.
          effetti: { ferite: 0.5, liaren.salvata: 1, pista.acciaio: 1 }
          segue: liaren-sul-gradino
      - testo: "Medicarla come nella tenda di Vantes"
        descrizione: "La sera della razzia, sotto il palco, hai chiuso ferite peggiori con meno. Le mani se lo ricordano."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La tenda dei feriti
          testo: |
            Le mani lavorano da sole, come nella tenda di Vantes la sera della
            razzia. Lavi il taglio e premi una striscia di stoffa sul fianco
            finché il sangue rallenta, parlandole piano, perché ai feriti si parla
            anche quando dormono. Liaren apre gli occhi alla terza volta che dici
            il suo nome. «Portami fuori da qui» dice, e ti stringe il braccio.
          pe: { medicina: 5 }
          effetti: { liaren.salvata: 1, pista.acciaio: 1 }
          segue: liaren-sul-gradino
      - testo: "Fermare il sangue con il muschio dei muri"
        descrizione: "Dal buco nel muro esce aria umida, e il muschio al Circolo si usa per le ferite."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Il muschio
          testo: |
            Sui mattoni del muro abbattuto il muschio cresce a cuscinetti scuri.
            Ne premi una manciata sul taglio e le parli con la voce che al Circolo
            si usa per le bestie ferite. Liaren apre gli occhi e guarda la
            poltiglia verde sul fianco. «Se questa è una cura dei boschi, non
            dirlo a Brunella» dice, e ti stringe il braccio per tirarsi su.
          pe: { natura: 5 }
          effetti: { liaren.salvata: 1, pista.acciaio: 1 }
          segue: liaren-sul-gradino
      - testo: "Fasciarla come un compagno sulle piattaforme"
        descrizione: "Sulle piattaforme chi si ferisce si fascia stretto e subito, con quello che si ha addosso."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: La regola delle piattaforme
          testo: |
            Tagli una striscia dalla camicia e la stringi sopra il taglio con un
            nodo da Raschiatore, che tirando si stringe e non si scioglie. Le
            prendi la faccia fra le mani e la chiami per nome, forte, come si
            chiama chi deve risalire. Liaren apre gli occhi e si tira su a sedere.
            «Portami fuori da qui» dice, e ti stringe il braccio.
          effetti: { liaren.salvata: 1, pista.acciaio: 1 }
          segue: liaren-sul-gradino

  - id: liaren-sul-gradino
    immagine: personaggi/liaren-tarvelin
    titolo: Sul gradino
    tipo: seguito
    luogo: Acciaieria dei Tarvelin, la porta delle consegne
    area: acciaieria
    requisiti: [pista.acciaio == 5]
    testo: |
      Liaren si siede sul gradino della porta delle consegne, con la schiena
      contro lo stipite e una mano premuta sul fianco. Mandi di corsa alla
      Caserma un ragazzino che gioca con un cerchio, promettendogli uno
      spicciolo per quando torna, e lui parte con il cerchio sotto il
      braccio.

      «Mi ha raccontato tutto lui, di nostro padre, con tutti i particolari»
      dice Liaren. «Isvaro dice che lui e gli altri li guida Aurenne, la sua
      amata, che ha grandi progetti per Qir-Azel, e mi ha detto di non farmi
      trovare in città quando cominciano. Poi quel coglione ha avuto la
      faccia di chiedermi se volevo unirmi a quelli di Capomozzo.»

      Resta a guardare la strada, con la mascella stretta e un pollice che le
      gira intorno alle nocche gonfie dell'altra mano.

      {empatia Media} Le nocche le fanno male, e lei è contenta che le
      facciano male, perché è l'unica parte di questa storia che ha scelto da
      sé.

      «Gli ho tirato un pugno nello stomaco, e lui ha chiamato i suoi orchi.»
      Poi alza gli occhi su di te, e la voce le si fa piatta. «L'hai ucciso?»

      {origine apprendista-raschiatore} Ti torna in mente la branda della
      camerata che lei ti ha pagato dopo la razzia, quando ancora non sapeva
      chi fossi.
    opzioni:
      - testo: "Dirle che è scappato"
        descrizione: "Con gli orchi, dal muro abbattuto accanto alla scala dei magazzini."
        requisiti: [isvaro == 1]
        esito:
          titolo: Scappato
          testo: |
            Le dici che è scappato con i suoi orchi dal muro abbattuto. «Da
            ragazzo scappava anche dalle lezioni di scherma» dice Liaren, e ridere
            le fa male al fianco.

            Vuole tornare al Grifone a piedi, e all'imbocco del Ponte del Pesce ti
            toglie il braccio dalle spalle, perché Brunella deve vederla entrare
            sulle sue gambe.
          vai: citta-bassa
      - testo: "Dirle che è legato di sopra"
        descrizione: "A un'incudine, con le cinghie di un mantice, accanto a suo padre."
        requisiti: [isvaro == 2]
        esito:
          titolo: Di sopra
          testo: |
            Le dici che Isvaro è di sopra, legato a un'incudine. «Il secondo pugno glielo
            do quando sto in piedi» dice Liaren. «Dallo alla Caserma, e che lo chiudano
            dove non può scrivere lettere.»

            Arriva la ronda e Isvaro la segue a testa alta. Liaren torna al Grifone a
            piedi, e dal Ponte del Pesce sale da sola, fermandosi a ogni lanterna.
          effetti: { rep.caserma: 0.5 }
          vai: citta-bassa
      - testo: "Dirle che è morto"
        descrizione: "In fondo alla scala dei magazzini, scappando."
        requisiti: [isvaro == 3]
        esito:
          titolo: Le pesche
          testo: |
            Le dici che è caduto dalla scala dei magazzini mentre scappava, e che sotto
            il telo c'era lui. «Gli portavo le pesche all'Accademia» dice Liaren
            guardandosi le mani. «Le sbucciava con il coltello in un pezzo solo, e la
            buccia la lasciava a me.»

            Torna al Grifone a piedi, e dal Ponte del Pesce la guardi salire da sola,
            fermandosi a ogni lanterna.
          vai: citta-bassa
