# Sotto la pelle di Qir-Azel, Atto I: il Maniero Malgrani (pista.pelle 0 → 3).
# - `galdrick-e-la-mappa-rossa` (0 → 1): Galdrick, la mappa coi segnalini rossi, la controprova. Il registro di
#   Maedric dice chi ha pagato, ma un avvocato della Gilda spiega ogni riga; Ottone tiene un registro suo dei
#   pagamenti agli Scuri. Galdrick l'ha saputo a Ghoran da Urtilia Mendion, che gli ha dato la pianta del Maniero e
#   si fa da parte purché i tre bambini restino fuori da tutto. Si entra di notte, da soli → `vai: maniero-malgrani`.
# - spedizione `maniero-malgrani` (soglia 4): sette stanze ripetibili in fasce di profondità. 0 il lato di
#   servizio (lavanderia, cucina), 1 le stanze interne del piano terra (museo, sala dei trofei), 2 la salita al
#   piano di sopra (atrio dei fondatori, biblioteca col ballatoio), 3 il piano dei padroni (camera dei bambini).
#   Una stanza superata non ricompare nella stessa visita. Le prove fallite fanno salire `allarme.maniero`; a tre
#   le stanze si chiudono e arriva `roldan-kael`.
# - storie non ripetibili al piano dei padroni (profondità >= 3): `lo-studio-di-ottone` (registro, spartito,
#   monete), `lucia-malgrani` (lucia 1/2/3). Poi `roldan-kael` (con allarme.maniero >= 3; chi lo supera riporta
#   l'allarme a 1).
# - il cuore `il-caveau` (il pianoforte, di nuovo al piano terra) con il seguito `la-sala-ottagonale`: in ogni
#   ramo prove.maniero +2, pista.pelle 2, `vai: quartieri-alti`. Rientro dopo una ritirata: `tornare-al-maniero`.
# - `una-radice` (2 → 3): Galdrick legge le lettere con l'alloro e ricava le tre casse da svuotare.
# - `leggere-il-registro-dei-malgrani`: storylet degli Averi del registro di Ottone. La sigla *Ca* con la chiave
#   disegnata accanto è Borso (il carceriere), che si scopre in `il-carceriere` (pelle-scuri.yaml).
aree:
  - id: maniero-malgrani
    immagine: ambientazione/maniero-malgrani
    nome: Maniero Malgrani
    sommario: "La casa di Ottone Malgrani fra i pini a nord dei Quartieri Alti, con lo studio ancora illuminato."
    spedizione: { ritorno: quartieri-alti, soglia: 4, stanze: 3 }
    testo: |
      Oltre l'ultimo giro delle ronde, fra i pini piegati dal vento del mare,
      c'è il Maniero dei Malgrani, con le tegole bagnate che luccicano come
      scaglie. Sul cancello di ferro battuto c'è l'alloro dorato della casata,
      e nel cortile le statue degli antenati hanno le facce consumate dalla
      pioggia. In cima all'edificio la finestra dello studio è accesa, e un
      uomo sta chino sulla scrivania.

storylet:
  # ------------------------------------------------------------ 0 → 1 · la mappa coi segnalini rossi
  - id: galdrick-e-la-mappa-rossa
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: La mappa coi segnalini rossi
    sommario: "Galdrick ti ha fatto cercare, come aveva promesso. Sul suo tavolo c'è una mappa della città coperta di segnalini rossi."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo
    area: quartieri-alti
    requisiti: [pista.pelle == 0, pista.registro >= 5, pista.capomozzo >= 7]
    testo: |
      Il ragazzo che Galdrick ha mandato a cercarti, in una divisa di due
      taglie più grande, ti porta in Caserma fino all'ufficio dello sceriffo.

      Galdrick ha la faccia tirata e una tazza di caffè freddo in mano. Sul
      tavolo c'è una mappa di Qir-Azel piena di segnalini rossi, fitti in
      Città Bassa e più radi verso i Quartieri Alti, con uno piantato perfino
      sul Municipio.

      {origine figlio-della-citta-bassa} Uno dei segnalini sta sopra il vicolo
      dove sei cresciuto, e sai chi ci passa a riscuotere per gli Scuri.

      «Mirko Vesh ha tanti uomini quanti la mia Guardia» dice, «e un quarto
      dei miei prende anche la sua paga. Apertamente non posso colpirlo, e
      allora serve qualcuno come te.»

      {politica-ed-economia Media} Un quarto della Guardia a libro paga vuol
      dire che Vesh conosce i turni prima dei sergenti.

      Spinge un segnalino verso il bordo nord, su un piccolo alloro a
      inchiostro, e ti mette in mano la pianta del Maniero. «Me l'ha data a
      Ghoran Urtilia Mendion, la zia di Ottone, che tiene con sé i tre bambini
      dei Malgrani» dice, e per un momento non lascia andare il foglio.

      {origine fuggiasco-di-ghoran} Quando dice Ghoran ti si chiudono le
      spalle, e devi guardarlo in faccia per ricordarti che lui ci è andato e
      ne è tornato.
    opzioni:
      - testo: "Chiedere perché il registro di Maedric non basta"
        descrizione: "Hai rischiato la pelle sul Ponte dei Morti per quel libretto. Lui l'ha chiuso nella cassa di ferro."
        requisiti: [maedric == 2]
        costo: 0
        esito:
          titolo: La controprova
          testo: |
            «Maedric giura dalla cella che i suoi sacchi disegnati sono farina per
            i poveri, e un avvocato della Gilda spiega quel registro in un
            pomeriggio, visto che il nome di Ottone non c'è» dice Galdrick.
            «Ottone però i pagamenti agli Scuri li segna in un registro suo, con
            la sua grafia, ed è quello che ci serve.»
      - testo: "Chiedere perché il registro di Maedric non basta"
        descrizione: "Hai rischiato la pelle sul Ponte dei Morti per quel libretto. Lui l'ha chiuso nella cassa di ferro."
        requisiti: [maedric != 2]
        costo: 0
        esito:
          titolo: La controprova
          testo: |
            «Maedric non è qui a dire di chi era il grano, e un registro senza il
            suo custode è un libretto di disegnini» dice Galdrick senza guardarti.
            «Il nome di Ottone là dentro non c'è. Però lui i pagamenti agli Scuri
            li segna in un registro suo, con la sua grafia, ed è quello che ci
            serve.»
      - testo: "Chiedere di Urtilia Mendion"
        descrizione: "Una zia che consegna allo sceriffo la pianta della casa del nipote avrà chiesto qualcosa in cambio."
        immagine: personaggi/urtilia-mendion
        costo: 0
        esito:
          titolo: La zia di Ghoran
          testo: |
            «Urtilia Mendion è la sorella di Brandano, e ha il suo busto
            nell'atrio con i fondatori» dice Galdrick. «Di cristalli ne sa più di
            mezza Accademia, e del registro di Ottone sapeva prima di me. In
            cambio della pianta vuole che i bambini restino fuori da tutto, e lei
            non interverrà.» Che cosa ci guadagni lei non gliel'ha chiesto, e si
            vede che ci ha pensato tutto il viaggio.
      - testo: "Chiedere perché non manda la Guardia"
        descrizione: "Lui è lo sceriffo. Ha trenta mercenari nel cortile e un mandato a portata di firma."
        costo: 0
        esito:
          titolo: Un quarto
          testo: |
            «Un quarto dei miei è di Vesh, e non so quale quarto» dice. «Se mando dieci uomini, Ottone brucia il registro prima
            che arrivino al cancello, e i mercenari di Ghoran in una casa piena d'argento non li manderei nemmeno a prendere
            l'acqua. Ci serve una persona sola che vada senza divisa. Se ti prendono io non ti ho mai visto.»
      - testo: "Entrare dal cancello con l'alloro"
        descrizione: "Il Maniero riceve molti ospiti e mai gli stessi due volte, e uno in ritardo è già capitato."
        prova: { attributo: sociale, abilita: [ingannare, galateo], difficolta: Media }
        successo:
          titolo: L'ospite in ritardo
          testo: |
            La sera dopo dici alla guardia del cancello che il padrone ti aspetta
            da un'ora, e lui guarda il collega come se la risposta ce l'avesse
            lui, poi apre. Nell'atrio ti lasciano solo per andare a chiamare
            qualcuno, e tu prendi la porticina di servizio verso le cucine.
          pe: { galateo: 5 }
          effetti: { pista.pelle: 1 }
          vai: maniero-malgrani
        fallimento:
          titolo: Il nome sulla lista
          testo: |
            Alla guardia del cancello dici che il padrone ti aspetta, e lui ti
            chiede il nome per la lista. Ne inventi uno troppo lungo per essere
            vero. Ti fa entrare lo stesso, ma ti accompagna fino all'atrio
            voltandosi due volte, e quando sparisci dietro una porta laterale lo
            senti chiamare il collega.
          effetti: { pista.pelle: 1, allarme.maniero: 1, sospetto: 0.5 }
          vai: maniero-malgrani
      - testo: "Entrare con il carro del vino"
        descrizione: "Sulla pianta c'è un ingresso di servizio, e il carrettiere del vino, per qualche moneta, fa salire chiunque."
        requisiti: [monete >= 15]
        esito:
          titolo: Fra le casse
          testo: |
            Il carrettiere conta le monete e ti fa sedere dietro, fra le casse, sotto un telo cerato
            che puzza di mosto e di mulo. Alla porta di servizio nessuno guarda dentro il carro, e
            quando i garzoni cominciano a scaricare tu sei già nel corridoio della cucina, con le
            ginocchia rigide.
          effetti: { pista.pelle: 1, monete: -15 }
          vai: maniero-malgrani
      - testo: "Scavalcare il muro del frutteto"
        descrizione: "Dietro la casa il frutteto ha un muro più basso, e accanto, sulla pianta, è disegnato un cane."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: I peri bagnati
          testo: |
            La notte dopo scavalchi il muro coperto di edera e scendi fra i peri,
            mentre in fondo al frutteto tre cani da caccia dormono uno sull'altro.

            {natura Facile} Il vento va dalla casa verso la cuccia, e finché resta
            così i cani ti ignorano.

            Ti infili da una finestra della lavanderia, socchiusa per il vapore.
          pe: { atletica: 5 }
          effetti: { pista.pelle: 1 }
          vai: maniero-malgrani
        fallimento:
          titolo: I cani
          testo: |
            L'edera ti resta in mano a metà salita e cadi su un ramo di pero che ti apre la coscia.
            In fondo al frutteto i cani da caccia cominciano ad abbaiare. Corri curvo fino alla
            casa e ti infili da una finestra socchiusa, mentre fuori una lanterna gira per il
            frutteto.
          effetti: { pista.pelle: 1, allarme.maniero: 1, ferite: 0.5 }
          vai: maniero-malgrani
      - testo: "Andare a cavallo fino al bosco"
        descrizione: "Dietro il Maniero comincia un bosco di pini. A cavallo ci arrivi senza passare dalle ronde."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Dal bosco
          testo: |
            La notte dopo esci dal lato nord della città e giri largo finché la
            strada diventa un sentiero fra i pini. Leghi il cavallo a un tronco
            storto e scendi a piedi verso le luci del Maniero.
          effetti: { pista.pelle: 1 }
          vai: maniero-malgrani
      - testo: "Presentarti al cancello con il tuo nome"
        descrizione: "Ai ricevimenti dei Malgrani la tua famiglia è sempre invitata, e il tuo nome è sulla lista."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Un nome sulla lista
          testo: |
            La sera dopo dici al cancello il tuo nome vero, con l'aria annoiata di chi arriva tardi a cena. La
            guardia lo trova sulla lista sotto quello dei tuoi e si scusa per la pioggia, e nell'atrio, mentre
            vanno a chiamare qualcuno, prendi la porticina di servizio verso le cucine.

            *Domani qualcuno si ricorderà che c'ero.* Intanto le mani ti sudano dentro i guanti buoni.
          pe: { galateo: 5 }
          effetti: { pista.pelle: 1 }
          vai: maniero-malgrani
      - testo: "Chiedere un passaggio al carrettiere del vino"
        descrizione: "Il carrettiere che porta il vino al Maniero è uno della Città Bassa, e ti deve ancora un boccale."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Ragazzo mio
          testo: |
            Il carrettiere è il vecchio del carro del falò, che da quella sera ti
            deve un boccale, e quando gli dici dove devi andare smette di
            sorridere. Ti fa salire dietro fra le casse, sotto il telo cerato, e
            le monete che gli tendi te le rimette in tasca senza contarle. Alla
            porta di servizio nessuno guarda dentro il carro.
          effetti: { pista.pelle: 1 }
          vai: maniero-malgrani
      - testo: "Farti conoscere dai cani del frutteto"
        descrizione: "Sulla pianta c'è un cane accanto al muro basso, e al Circolo hai imparato ad ascoltare le bestie."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: Tre musi
          testo: |
            Arrivi al muro del frutteto controvento e infili una mano fra due
            pietre smosse, con il palmo in basso. Dall'altra parte i cani
            ringhiano a lungo, poi la annusano. Quando scavalchi ti accompagnano
            fra i peri fino alla finestra della lavanderia e tornano a dormire,
            delusi che tu non abbia niente da mangiare.
          pe: { addestrare-animali: 5 }
          effetti: { pista.pelle: 1 }
          vai: maniero-malgrani
        fallimento:
          titolo: Il più giovane
          testo: |
            I due cani vecchi ti annusano la mano fra le pietre e si calmano, ma
            il più giovane abbaia quando sei già a cavallo del muro. Corri curvo
            fra i peri e ti infili da una finestra socchiusa, mentre fuori una
            lanterna comincia a girare per il frutteto.
          effetti: { pista.pelle: 1, allarme.maniero: 1 }
          vai: maniero-malgrani

  # ------------------------------------------------------------ 1 · rientrare dopo una ritirata
  - id: tornare-al-maniero
    immagine: ambientazione/maniero-malgrani
    titolo: Di nuovo al Maniero
    sommario: "Le carte di Ottone sono ancora nel Maniero, e da qualche notte le guardie non guardano più il frutteto."
    luogo: Quartieri Alti, verso nord
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.pelle == 1]
    testo: |
      La pianta di Urtilia si è consumata nelle pieghe a forza di aprirla.
      Alla taverna dei vetturini, che di notte aspettano i padroni davanti
      ai cancelli, dicono che da qualche notte le guardie del Maniero hanno
      smesso di girare con le lanterne.

      {conoscenze-della-strada Facile} Quando le guardie di una casa
      cambiano abitudini se ne accorgono i vetturini e i ladri, e di solito
      i ladri lo sanno dai vetturini.
    opzioni:
      - testo: "Tornarci a piedi, di notte"
        descrizione: "Dall'ultima ronda fino al muro del frutteto, al buio."
        esito:
          titolo: Il muro del frutteto
          testo: |
            Aspetti una notte senza luna e risali verso nord oltre l'ultimo giro delle ronde. Passi il muro
            del frutteto dove l'edera è più fitta, mentre i cani dormono nella cuccia, e ti asciughi le
            mani sui calzoni prima di toccare il davanzale della lavanderia. Nello studio in cima la luce è
            accesa.
          imposta: { allarme.maniero: 0 }
          vai: maniero-malgrani
      - testo: "Andarci a cavallo fino al bosco"
        descrizione: "Dal lato del bosco il muro di cinta è mezzo franato."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il pino storto
          testo: |
            Esci dal lato nord della città e giri largo fra i pini, finché leghi
            il cavallo a un tronco con la corteccia già segnata da altre redini.
            Scendi a piedi fino al muro franato, e da lì vedi la luce accesa nello
            studio in cima, come se nessuno l'avesse mai spenta.
          imposta: { allarme.maniero: 0 }
          vai: maniero-malgrani

  # ------------------------------------------------------------ le stanze (ripetibili, tre a caso)
  - id: maniero-lavanderia
    immagine: ambientazione/maniero-malgrani
    titolo: La lavanderia
    sommario: "Un locale pieno di vapore e di lenzuola, una serva al lavatoio e un secchio accanto alla porta."
    luogo: Maniero Malgrani, la lavanderia
    area: maniero-malgrani
    ripetibile: true
    requisiti: [pista.pelle == 1, profondita.maniero-malgrani == 0, allarme.maniero < 3]
    testo: |
      La lavanderia è un locale basso pieno di vapore, con le ceste di
      lenzuola contro i muri e una caldaia di rame in un angolo. Una serva
      lava con le braccia nell'acqua fino ai gomiti, canticchiando una
      canzone della Città Bassa. Accanto alla porta c'è un secchio di latta,
      e oltre il muro uno sgabuzzino chiuso a chiave.

      {origine figlio-della-citta-bassa} È la canzone dell'ora di chiusura
      delle osterie, e lei stona sulla nota alta come tutti.
    opzioni:
      - testo: "Frugare nel secchio"
        descrizione: "Un secchio vicino alla porta, in una stanza dove i secchi stanno tutti vicino alla caldaia."
        prova: { attributo: mentale, abilita: [percezione, furtivita], difficolta: Media }
        successo:
          titolo: La chiave di bronzo
          testo: |
            In fondo al secchio, sotto uno straccio, c'è una chiavetta di bronzo che apre lo
            sgabuzzino, dove è appeso ad asciugare un mantello verde della livrea con
            l'alloro sul petto. Te lo butti sulle spalle ancora umido, e nel corridoio una
            guardia ti fa un cenno stanco senza guardarti.
          effetti: { profondita.maniero-malgrani: 1 }
        fallimento:
          titolo: Il secchio rovesciato
          testo: |
            Il secchio è più leggero di quanto pensavi e si rovescia sul pavimento
            con un rumore di latta. La serva corre fuori a chiamare qualcuno,
            mentre tu ti schiacci dietro le ceste senza sapere se ha visto te o
            soltanto un'ombra.
          effetti: { allarme.maniero: 1 }
      - testo: "Parlare alla serva"
        descrizione: "A quest'ora di notte una faccia nuova, in una casa così grande, può essere soltanto qualcuno che lavora."
        prova: { attributo: sociale, abilita: [empatia, ingannare], difficolta: Media }
        successo:
          titolo: Le lenzuola del padrone
          testo: |
            Le dici che ti ha mandato il caposquadra a dare una mano, e la serva
            ti mette in braccio una pila di lenzuola. «Roldan manda gente quando
            ho finito, mai quando comincio» dice, e intanto ti spiega da dove
            passano le ronde e a che ora.

            {ingannare Media} Ti ha creduto a metà, ma alle due di notte due
            braccia in più valgono più della verità.
          pe: { empatia: 5 }
          effetti: { profondita.maniero-malgrani: 1 }
        fallimento:
          titolo: Quale caposquadra
          testo: |
            Le dici che ti ha mandato il caposquadra. «Quale caposquadra?» chiede
            la serva, e quando non rispondi abbastanza in fretta esce di corsa nel
            corridoio, lasciando una scia d'acqua sul pavimento. Due stanze più in
            là senti la sua voce chiamare qualcuno.
          effetti: { allarme.maniero: 1 }
      - testo: "Aspettare fra le ceste che se ne vada"
        descrizione: "Prima o poi la serva dovrà portare le lenzuola di sopra, e il vapore intanto è bollente."
        costo: 2
        esito:
          titolo: La caldaia
          testo: |
            Ti accucci fra le ceste e la caldaia e aspetti, mentre la serva canta
            la sua canzone tre volte da capo. Quando finalmente esce con le
            lenzuola sulla testa hai il dorso della mano rosso e lucido dove
            toccava il rame, e non te n'eri nemmeno accorto.
          effetti: { profondita.maniero-malgrani: 1, ferite: 0.5 }

  - id: maniero-atrio
    immagine: fazioni/famiglia-malgrani
    titolo: L'atrio dei fondatori
    sommario: "Un atrio di marmo scuro con tre busti di pietra e due guardie che fanno la ronda fino al salone."
    luogo: Maniero Malgrani, l'atrio
    area: maniero-malgrani
    ripetibile: true
    requisiti: [pista.pelle == 1, profondita.maniero-malgrani == 2, allarme.maniero < 3]
    testo: |
      L'atrio ha il pavimento di marmo scuro e due scale curve ai lati. Lungo
      le pareti stanno i busti di Brandano e Vermilia Malgrani e quello di
      Urtilia Mendion, la zia di Ghoran, con il mento alto e una ruga sola in
      mezzo alla fronte. Due guardie in livrea verde vanno e vengono fino al
      salone, e uno sbadiglia a ogni giro.

      {rissa Facile} Quello che sbadiglia tiene le mani lontane dall'asta
      della lancia, e nello sbadiglio c'è il tempo di arrivargli addosso.
    opzioni:
      - testo: "Fermare la ronda"
        descrizione: "Due uomini a dieci passi l'uno dall'altro, e se cadono senza un grido nessuno li cerca fino al cambio."
        combattimento: le-guardie-del-maniero
        vittoria:
          titolo: Il ripostiglio sotto la scala
          testo: |
            Prendi la prima guardia alle spalle mentre sbadiglia, e la seconda arriva di
            corsa con la bocca già aperta per gridare. Li trascini tutti e due nel
            ripostiglio sotto la scala, e raddrizzi il tappeto con la punta dello
            stivale, perché in questa casa un tappeto storto si nota prima di due guardie
            sparite.
          effetti: { profondita.maniero-malgrani: 1 }
        sconfitta:
          titolo: Il fischio
          testo: |
            La seconda guardia ti colpisce al fianco con il manico della lancia, e
            mentre sei piegato in due l'altra soffia nel fischietto. Scappi da
            dove sei venuto con un fiotto caldo sotto la camicia, e il fischio si
            sente in ogni stanza della casa.
          effetti: { allarme.maniero: 1 }
      - testo: "Nasconderti dietro il busto della zia"
        descrizione: "Dietro il piedistallo di Urtilia Mendion, il più largo dei tre, ci sta una persona che si fa piccola."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Dietro la zia
          testo: |
            Ti schiacci fra il piedistallo e il muro, con il marmo freddo contro
            la guancia, mentre quello che sbadiglia si gratta la schiena proprio
            contro il busto. Quando se ne vanno verso il salone attraversi l'atrio
            in punta di piedi e sali la scala di sinistra.
          effetti: { profondita.maniero-malgrani: 1 }
        fallimento:
          titolo: La targhetta
          testo: |
            Infilandoti dietro il piedistallo urti con il gomito la targhetta di
            ottone, che cade sul marmo. Sei già nel corridoio quando le guardie
            arrivano al busto, e senti una delle due chiamare il caposquadra,
            contenta di aver trovato un colpevole.
          effetti: { allarme.maniero: 1 }
      - testo: "Restare immobile nella nicchia sotto la scala"
        descrizione: "Le guardie hanno un giro regolare, e basta aspettare quello giusto, anche se ci vuole un'ora."
        costo: 2
        esito:
          titolo: I giri della ronda
          testo: |
            Ti rannicchi nella nicchia sotto la scala e conti i giri della ronda,
            mentre le guardie parlano di una ragazza della Città Bassa che non
            vuole nessuno dei due. Al tredicesimo giro sgusci fuori con le gambe
            intorpidite e sali la scala curva.
          effetti: { profondita.maniero-malgrani: 1, tormento: 1 }

  - id: maniero-sala-dei-trofei
    immagine: ambientazione/maniero-malgrani
    titolo: La sala dei trofei di caccia
    sommario: "Una stanza di trofei di caccia e di libri, con un ospite anziano sveglio su un divano."
    luogo: Maniero Malgrani, la sala dei trofei
    area: maniero-malgrani
    ripetibile: true
    requisiti: [pista.pelle == 1, profondita.maniero-malgrani == 1, allarme.maniero < 3]
    testo: |
      È una stanza raccolta, con le tende pesanti e l'odore di fiori secchi.
      Alle pareti, fra i libri, stanno appesi corna di cervo e artigli
      d'orso, e una finestra dà sul giardino interno. Su un divano un uomo
      anziano in vestaglia legge al lume di una candela, con una coperta
      sulle ginocchia, e tossisce in un fazzoletto.

      {origine figlio-del-circolo} Gli artigli d'orso sono limati in punta
      per sembrare più lunghi, e chi ha visto un orso vivo nel Bosco di
      Velthar se ne accorge.
    opzioni:
      - testo: "Cercare dietro le mensole"
        descrizione: "Una mensola, fra le corna, è un dito più avanti delle altre."
        requisiti: [maniero.anello == 0]
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: L'anello col sigillo
          testo: |
            Quando l'ospite si addormenta con il libro sul petto spingi la mensola
            sporgente, che si inclina su un perno. Nel vano dietro c'è un anello
            d'oro con le iniziali di Ottone nel sigillo e la ceralacca verde
            ancora incrostata nelle lettere, e lo infili in tasca.
          pe: { percezione: 5 }
          effetti: { profondita.maniero-malgrani: 1, prove.maniero: 1 }
          imposta: { maniero.anello: 1 }
        fallimento:
          titolo: Le corna
          testo: |
            Spingi la mensola sbagliata, e un paio di corna di cervo scivola dal chiodo. Lo
            afferri al volo, ma una punta sbatte contro il vetro della finestra, e l'ospite
            alza la testa dal libro e suona il campanello che tiene sulla coperta.
          effetti: { allarme.maniero: 1 }
      - testo: "Passare dalla finestra e dal giardino"
        descrizione: "Fuori piove, e dall'altra parte del giardino c'è una porta finestra illuminata."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Le siepi
          testo: |
            Scavalchi il davanzale e attraversi il giardino lungo le siepi,
            abbassato sotto la pioggia. La porta finestra dall'altra parte non è
            chiusa a chiave, ed entri lasciando due impronte bagnate che asciughi
            con la manica prima di andare avanti.
          effetti: { profondita.maniero-malgrani: 1 }
        fallimento:
          titolo: La ghiaia
          testo: |
            Il vialetto del giardino è di ghiaia, e al primo passo i cani da caccia rispondono dalla cuccia tutti insieme.
            Quando torni dentro bagnato fradicio l'ospite ti guarda da sopra il libro e allunga la mano verso il
            campanello.
          effetti: { allarme.maniero: 1 }
      - testo: "Aspettare dietro le tende che l'ospite si addormenti"
        descrizione: "Un vecchio malato a notte fonda prima o poi chiude gli occhi."
        costo: 2
        esito:
          titolo: Il lettore
          testo: |
            Dietro le tende la polvere ti entra nel naso. L'ospite legge tossendo
            e ride da solo sempre nello stesso punto della pagina, e passa quasi
            un'ora prima che il libro gli scivoli sulla coperta, mentre tu tieni
            un dito sotto il naso per non starnutire.
          effetti: { profondita.maniero-malgrani: 1, tormento: 1 }

  - id: maniero-museo
    immagine: ambientazione/cristalli-conduttori
    titolo: Il museo dei fondatori
    sommario: "Un corridoio di teche con le reliquie dei fondatori di Qir-Azel e un busto con un cristallo nella fronte."
    luogo: Maniero Malgrani, il museo
    area: maniero-malgrani
    ripetibile: true
    requisiti: [pista.pelle == 1, profondita.maniero-malgrani == 1, allarme.maniero < 3]
    testo: |
      Il museo è un corridoio di teche con le cose dei fondatori, fra cui un
      paio di stivali da bambino in una teca a parte, di cui nessuno ha
      scritto la storia. In fondo c'è un busto di marmo senza nome con un
      Cristallo Conduttore incastonato nella fronte, grande come un'unghia,
      che manda una luce azzurra debole.

      {origine apprendista-raschiatore} Il castone è segnato da graffi
      sottili di lame diverse, e sulle piattaforme i cristalli buoni si
      riconoscono così.
    opzioni:
      - testo: "Staccare il cristallo dal busto"
        descrizione: "Piccolo ma carico come uno grande, e chi l'ha messo lì l'avrà anche protetto."
        requisiti: [maniero.museo == 0]
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: La luce nel pugno
          testo: |
            Fai leva con la punta del coltello sul castone finché il cristallo
            cede con un piccolo schiocco, senza spegnersi. Te lo chiudi nel pugno,
            e fra le dita filtra un azzurro che devi coprire con l'altra mano. Sul
            buco nella fronte del busto appoggi il cartellino di una teca.
          pe: { furtivita: 5 }
          effetti: { profondita.maniero-malgrani: 1, cristalli.cristallo-carico: 1 }
          imposta: { maniero.museo: 1 }
        fallimento:
          titolo: La luce che si spegne
          testo: |
            La punta del coltello scivola sul castone e il cristallo si spegne di
            colpo, ancora al suo posto. Dopo qualche momento al piano di sopra
            sbatte una porta, e dei passi pesanti cominciano a scendere la scala.
            Ti infili fra due vetrine con il coltello ancora in mano.
          effetti: { allarme.maniero: 1 }
      - testo: "Leggere il Mana del busto prima di toccarlo"
        descrizione: "Un cristallo così piccolo non fa la guardia da solo, e il marmo ti dirà dove corre il filo."
        requisiti: [maniero.museo == 0]
        incantesimo: leggere-il-mana
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il filo nel marmo
          testo: |
            Con le dita sul marmo senti il Mana scendere nel collo del busto e
            salire dentro il muro, sottile come un capello, verso il piano di
            sopra. Lo tieni fermo con il pollice mentre stacchi il cristallo, e di
            sopra non si muove niente.
          effetti: { profondita.maniero-malgrani: 1, cristalli.cristallo-carico: 1 }
          imposta: { maniero.museo: 1 }
        fallimento:
          titolo: Il ritorno
          testo: |
            Trovi il filo che sale dentro il muro e, nella fretta, lo tiri invece di
            fermarlo. Il Mana ti torna indietro dietro gli occhi, il cristallo si spegne e
            al piano di sopra sbatte una porta. Resti fra le vetrine con le tempie che
            pulsano finché i passi non passano oltre.
          effetti: { allarme.maniero: 1, tormento: 1 }
      - testo: "Cercare l'altra uscita fra le teche"
        descrizione: "Il corridoio deve pur finire da qualche parte, e non dove si entra."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Gli stivali da bambino
          testo: |
            Dietro la teca degli stivali da bambino c'è una porticina dipinta come
            la parete. Sul cartellino della teca c'è scritto soltanto *suoi*, con
            una grafia diversa da tutte le altre.

            {empatia Difficile} La grafia trema sulla esse finale, dove chi l'ha
            scritto si è fermato perché di più non riusciva.

            Dall'altra parte un corridoio di servizio porta verso l'atrio.
          effetti: { profondita.maniero-malgrani: 1 }
        fallimento:
          titolo: Il vetro
          testo: |
            Cerchi a tastoni lungo le vetrine, e una teca che credevi fissata al
            muro si sposta e sbatte contro la cornice con un suono lungo e
            limpido. In fondo alla casa una voce impastata di sonno chiede chi
            c'è, e tu resti immobile finché non si allontana.
          effetti: { allarme.maniero: 1 }
      - testo: "Passare carponi sotto le vetrine"
        descrizione: "È lento e scomodo, e sul pavimento ci sono le schegge di una vecchia teca rotta."
        costo: 2
        esito:
          titolo: Le schegge
          testo: |
            Attraversi il museo carponi sotto le vetrine fino alla porticina di
            servizio. A metà strada una scheggia di vetro ti entra nel palmo, e
            vai avanti con la mano chiusa a pugno, lasciando una goccia di sangue
            sul marmo ogni tre o quattro passi.
          effetti: { profondita.maniero-malgrani: 1, ferite: 0.5 }

  - id: maniero-cucina
    immagine: ambientazione/maniero-malgrani
    titolo: La cucina
    sommario: "Pentole che fumano anche a notte fonda, due cuochi di fretta e le casse del vino contro il muro."
    luogo: Maniero Malgrani, la cucina
    area: maniero-malgrani
    ripetibile: true
    requisiti: [pista.pelle == 1, profondita.maniero-malgrani == 0, allarme.maniero < 3]
    testo: |
      In cucina le pentole fumano anche a quest'ora. Un cuoco impasta, e
      l'altro rimesta un brodo dormendo in piedi. «Il padrone mangia quando
      gli pare» brontola il primo. Contro il muro ci sono le casse del vino
      arrivate stasera, e una porta sul retro dà sulla dispensa.

      {conoscenze-della-strada Media} Una cassa di vino pesa sempre uguale, e
      quella più bassa delle altre porta qualcosa che il carrettiere non ha
      dichiarato.
    opzioni:
      - testo: "Guardare meglio le casse del vino"
        descrizione: "Una delle casse è appoggiata più in basso delle altre, come se pesasse di più."
        requisiti: [maniero.lingotti == 0]
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il falso fondo
          testo: |
            Sotto le bottiglie della cassa più bassa ci sono lingotti d'argento
            col sigillo dei Malgrani, e sull'altra faccia un segno raschiato con
            lo scalpello dove si legge ancora la mezza corda annodata della Gilda
            dei Mercanti. Ne prendi uno e rimetti le bottiglie al loro posto.

            {origine mercante-dei-ponti} La stessa mezza corda sta in fondo alla
            tua licenza, e vederla raschiata è come trovare il tuo nome
            cancellato.
          pe: { politica-ed-economia: 5 }
          effetti: { profondita.maniero-malgrani: 1, prove.maniero: 1 }
          imposta: { maniero.lingotti: 1 }
        fallimento:
          titolo: Le bottiglie
          testo: |
            La terza bottiglia ti scivola dalle dita e tintinna contro le altre. Il cuoco che dormiva in
            piedi apre gli occhi e ti vede chino sulla cassa, e dopo un momento lascia cadere il mestolo e
            grida il nome del caposquadra verso il corridoio.
          effetti: { allarme.maniero: 1 }
      - testo: "Fingerti un garzone"
        descrizione: "Due cuochi stanchi e un padrone che mangia quando gli pare, e qualcuno dovrà portargli il vassoio."
        prova: { attributo: sociale, abilita: [ingannare, galateo], difficolta: Media }
        successo:
          titolo: Il vassoio
          testo: |
            Entri come se fossi in ritardo e chiedi se il vassoio del padrone è
            pronto. Il cuoco che impasta ti indica un piatto coperto con il mento
            infarinato. «Brodo e pane, e non farlo raffreddare per le scale» dice.
            Nel corridoio lasci il vassoio su una cassapanca e vai avanti.
          pe: { ingannare: 5 }
          effetti: { profondita.maniero-malgrani: 1 }
        fallimento:
          titolo: Il garzone nuovo
          testo: |
            Il cuoco che impasta si pulisce le mani sul grembiule e ti chiede come ti
            chiami, perché i garzoni li sceglie lui. Mentre cerchi un nome lui ha già
            preso il coltello del pane, e tu esci dalla porta sul retro mentre grida al
            collega di chiamare il caposquadra.
          effetti: { allarme.maniero: 1 }
      - testo: "Strisciare dietro il bancone fino alla dispensa"
        descrizione: "I cuochi guardano le pentole, e sotto il bancone passa il calore della stufa."
        costo: 2
        esito:
          titolo: Il bancone
          testo: |
            Strisci sotto il bancone fra i sacchi di farina, e a metà strada una
            goccia di brodo bollente ti cade sul collo. Stringi i denti e arrivi
            alla dispensa con il collo che brucia e le mani bianche di farina.
          effetti: { profondita.maniero-malgrani: 1, ferite: 0.5 }

  - id: maniero-biblioteca
    immagine: ambientazione/maniero-malgrani
    titolo: La biblioteca
    sommario: "Librerie di quercia fino al soffitto, una scala su rotaia e una mappa con dei cerchi rossi."
    luogo: Maniero Malgrani, la biblioteca
    area: maniero-malgrani
    ripetibile: true
    requisiti: [pista.pelle == 1, profondita.maniero-malgrani == 2, allarme.maniero < 3]
    testo: |
      La biblioteca è alta due piani, con una scala che scorre su una rotaia
      d'ottone fino a un ballatoio, da cui una porta dà sul corridoio del
      piano di sopra, dove la ronda passa ogni quarto d'ora. Sul tavolo in
      mezzo è aperta una mappa antica della regione, con due cerchi rossi sul
      Fondobosco e sul villaggio di Pannion.

      {furtivita Media} La rotaia d'ottone è lucida, e un ottone così lucido
      di solito canta.
    opzioni:
      - testo: "Studiare la mappa"
        descrizione: "Due cerchi rossi, uno sul bosco degli orchi e l'altro sul villaggio che manda il legname in città."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Media }
        successo:
          titolo: I due cerchi
          testo: |
            Accanto al cerchio su Pannion c'è scritto *legname, prezzo nostro*, e
            vicino a quello sul Fondobosco una data sola, la settimana prima della
            razzia degli orchi su Qir-Azel. Ricopi le due annotazioni sul retro
            della pianta di Urtilia.

            {politica-ed-economia Media} Un villaggio che ha paura vende il
            legname al prezzo che decide chi gli fa paura.
          pe: { accademiche: 5 }
          effetti: { profondita.maniero-malgrani: 1 }
        fallimento:
          titolo: La rotaia
          testo: |
            Chinandoti sulla mappa ti appoggi alla scala, che parte sulla rotaia e
            attraversa la libreria cigolando fino a sbattere contro il muro.
            Quando una guardia si affaccia dal ballatoio con la lanterna tu sei
            già sotto il tavolo, con la guancia su un tappeto che puzza di cane.
          effetti: { allarme.maniero: 1 }
      - testo: "Salire al ballatoio con la scala"
        descrizione: "Dalla biblioteca si sale al piano di sopra senza passare dall'atrio, ma la ronda passa di lì."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Il ballatoio
          testo: |
            Fai scorrere la scala sotto il ballatoio un palmo alla volta, tenendo
            la rotaia con la mano perché non cigoli, e sali appena la ronda ha
            girato l'angolo. La porta dà su un corridoio tappezzato di rosso
            scuro, con i ritratti di famiglia in fila.
          effetti: { profondita.maniero-malgrani: 1 }
        fallimento:
          titolo: Il gradino
          testo: |
            A metà scala un gradino scricchiola, e la ronda si ferma sul ballatoio
            proprio sopra di te. Resti appeso nel buio con le braccia che tremano,
            finché una guardia dice che ha sentito un topo e va a chiamare il
            caposquadra per sicurezza.
          effetti: { allarme.maniero: 1 }
      - testo: "Aspettare al buio fra gli scaffali"
        descrizione: "La ronda passa ogni quarto d'ora, e non serve altro che contare."
        costo: 2
        esito:
          titolo: Ogni quarto d'ora
          testo: |
            Ti siedi per terra fra due scaffali, con la schiena contro i libri, e
            conti i passaggi della ronda sul ballatoio, sempre con lo stesso passo
            strascicato e la stessa tosse al terzo gradino. Alla quarta volta
            sali, con la cadenza dei loro passi ancora in testa.
          effetti: { profondita.maniero-malgrani: 1, tormento: 1 }

  - id: maniero-camera-dei-bambini
    immagine: personaggi/benta-malgrani
    titolo: La camera dei bambini
    sommario: "Tre lettini rifatti per bambini lontani a Ghoran, e accanto un cavallo a dondolo che si muove da solo."
    luogo: Maniero Malgrani, la camera dei bambini
    area: maniero-malgrani
    ripetibile: true
    requisiti: [pista.pelle == 1, profondita.maniero-malgrani == 3, allarme.maniero < 3]
    testo: |
      La camera dei bambini ha tre lettini rifatti senza una grinza e i
      soldatini in fila sulla mensola. Sul tavolino c'è un disegno a
      carboncino della casa, e sopra il tetto una figura nera e lunga con gli
      occhi bianchi apre due mani enormi. Nella saletta accanto, con la
      finestra chiusa, un cavallo a dondolo oscilla piano vicino a una
      bambola di stoffa rotta in due.

      {resilienza Media fallita} Ti dici che è uno spiffero, e ogni volta che
      lo ripeti ci credi un po' meno.
    opzioni:
      - testo: "Guardare il disegno da vicino"
        descrizione: "Un bambino ha disegnato la sua casa, e anche quello che c'è sopra."
        prova: { attributo: mentale, abilita: [resilienza, empatia], difficolta: Media }
        successo:
          titolo: La finestra dello studio
          testo: |
            È proprio questa casa, e la testa della figura nera sta dove c'è la
            finestra dello studio, l'unica che il bambino ha colorato di giallo.
            In un angolo ha firmato in stampatello storto, *Gradon*, con la enne
            al contrario.
          pe: { resilienza: 5 }
          effetti: { profondita.maniero-malgrani: 1 }
        fallimento:
          titolo: Il dondolo
          testo: |
            Il cavallo a dondolo batte contro il muro, tu fai un salto indietro e
            mandi per terra la fila di soldatini, che rotolano sotto i letti. Nel
            corridoio la ronda smette di camminare, e tu resti in mezzo alla
            stanza con un soldatino sotto la suola.
          effetti: { allarme.maniero: 1, tormento: 1 }
      - testo: "Fermare il cavallo a dondolo"
        descrizione: "Le cose non dondolano da sole, e uno spiffero è un'uscita."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Lo spiffero
          testo: |
            Accanto al cavallo senti l'aria fredda che sale da una grata nel
            pavimento, sopra un condotto di mattoni che corre fino al corridoio
            dei padroni. Fermi il cavallo con la mano e ti infili nel condotto,
            avanzando sui gomiti nella polvere.
          effetti: { profondita.maniero-malgrani: 1 }
        fallimento:
          titolo: La bambola
          testo: |
            Cerchi lo spiffero lungo le pareti e pesti con il tallone la testa della bambola, che fa
            un fischio da giocattolo del tutto fuori luogo. Ti butti sotto un lettino mentre la
            maniglia si abbassa, e resti lì con la faccia contro le assi finché i passi della ronda
            non riprendono.
          effetti: { allarme.maniero: 1 }
      - testo: "Sederti su un lettino e aspettare la ronda"
        descrizione: "Nella camera dei bambini le guardie non entrano, e tu ci resti con il disegno."
        costo: 2
        esito:
          titolo: Sul lettino
          testo: |
            Ti siedi sul lettino più piccolo, che scricchiola sotto il tuo peso, e
            aspetti che la ronda passi due volte, senza riuscire a smettere di
            guardare le mani del disegno. Quando ti alzi rifai la piega della
            coperta due volte, e non viene dritta come prima.
          effetti: { profondita.maniero-malgrani: 1, tormento: 1 }

  # ------------------------------------------------------------ lo studio di Ottone (non ripetibile)
  - id: lo-studio-di-ottone
    immagine: personaggi/ottone-malgrani
    titolo: Lo studio di Ottone
    sommario: "La luce che si vede dal cancello è questa, e Ottone Malgrani è chino sulla scrivania."
    luogo: Maniero Malgrani, lo studio del padrone
    area: maniero-malgrani
    requisiti: [pista.pelle == 1, oggetto.registro-dei-malgrani == 0, profondita.maniero-malgrani >= 3, allarme.maniero < 3]
    testo: |
      In fondo al corridoio del piano di sopra la porta dello studio è
      socchiusa. Dentro perfino le penne sul tavolo sono allineate per
      lunghezza. Ottone Malgrani scrive con una penna di rapace, i capelli
      biondi pettinati all'indietro e la faccia stanca e dura, accanto a una
      tazza di tisana che nessuno ha toccato.

      Ti appiattisci in un vano della parete mentre un uomo con la barba
      tagliata a filo e un fischietto d'osso al collo sale e bussa allo
      stipite. «Il giro è fatto, signore. Tutto in ordine.»

      «Tutti hanno bisogno di un muro che li protegga, Roldan» dice Ottone
      senza alzare la testa. «Io sono quel muro, e i muri a volte si tirano su
      con il sangue.»

      {empatia Difficile} La frase l'ha detta a Roldan, ma la stava provando
      per sé.

      Quando il caposquadra riscende, Ottone posa la penna ed esce a camminare
      avanti e indietro nel corridoio, con le mani dietro la schiena.
      *Quest'uomo fa la ronda in casa sua.* Il vano è così stretto che senti
      la pietra fredda attraverso la camicia.

      {origine rampollo-dei-quartieri-alti} Ai ricevimenti Ottone restava
      accanto alla porta del salone, e tu lo credevi un padrone di casa
      premuroso; adesso ti viene il dubbio che contasse chi entrava.
    opzioni:
      - testo: "Aspettare che esca di nuovo e frugare nei cassetti"
        descrizione: "Ogni tanto esce nel corridoio, e bisogna sapere quanto ci resta."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: I cassetti
          testo: |
            Al terzo giro Ottone scende le scale. Nel primo cassetto c'è un
            biglietto con cinque note, *Fa due, Re quattro, Mi bemolle due, Fa
            tre, Do quattro*; nel secondo un registro rilegato in pelle con
            l'alloro impresso e un sacchetto di monete di platino. Prendi tutto, e
            sei di nuovo nel vano quando lui risale.
          pe: { furtivita: 5 }
          effetti: { oggetto.registro-dei-malgrani: 1, prove.maniero: 2, spartito: 1, monete: 60 }
        fallimento:
          titolo: Il gradino che scricchiola
          testo: |
            Hai le mani nel primo cassetto quando il gradino in cima alla scala
            scricchiola, molto prima del previsto. Fai in tempo a richiudere e a
            uscire, ma Ottone si ferma sulla soglia e annusa l'aria della stanza,
            poi chiama Roldan con una voce calma, senza alzarla.
          effetti: { allarme.maniero: 1, sospetto: 0.5 }
      - testo: "Mandarlo di sotto con una scusa"
        descrizione: "Una voce da guardia dal corridoio, e una scusa come i cani o qualcuno in giardino."
        prova: { attributo: sociale, abilita: [ingannare, intimidire], difficolta: Media }
        successo:
          titolo: I cani in giardino
          testo: |
            Dalla curva del corridoio, con la voce di una guardia, dici che i cani sono
            scappati, e Ottone scende imprecando. Nei cassetti trovi un biglietto con
            cinque note, *Fa due, Re quattro, Mi bemolle due, Fa tre, Do quattro*, un
            registro rilegato in pelle con l'alloro e un sacchetto di monete di platino.
          pe: { ingannare: 5 }
          effetti: { oggetto.registro-dei-malgrani: 1, prove.maniero: 2, spartito: 1, monete: 60 }
        fallimento:
          titolo: Quale guardia
          testo: |
            Dici dal corridoio che i cani sono scappati. Ottone viene alla porta e
            guarda il corridoio vuoto per un lungo momento. «I miei uomini mi
            chiamano per nome» dice al buio. Poi prende un candeliere e comincia a
            cercare stanza per stanza, mentre tu scendi dalla scala di servizio.
          effetti: { allarme.maniero: 1, sospetto: 1 }
      - testo: "Lasciare che Lucia lo chiami"
        descrizione: "Lei ha detto che lo avrebbe tenuto lontano dallo studio per il tempo che serve."
        immagine: personaggi/lucia-malgrani
        requisiti: [lucia == 1]
        esito:
          titolo: La lettera da Ghoran
          testo: |
            Lucia chiama il marito dalla camera in fondo per una lettera dei figli
            arrivata da Ghoran, e Ottone esce lasciando la penna a metà di una
            parola. Nei cassetti trovi un biglietto con cinque note, *Fa due, Re
            quattro, Mi bemolle due, Fa tre, Do quattro*, un registro rilegato in
            pelle con l'alloro e qualche moneta di platino.
          effetti: { oggetto.registro-dei-malgrani: 1, prove.maniero: 2, spartito: 1, monete: 60 }
      - testo: "Aspettare tutta la notte nel vano della parete"
        descrizione: "Prima o poi anche lui dovrà scendere, e all'alba, si dice, va in giardino con i cani."
        costo: 2
        esito:
          titolo: L'alba
          testo: |
            Passi la notte nel vano con le ginocchia contro il mento. All'alba
            Ottone scende in giardino a fischiare ai cani, e nei cassetti trovi un
            biglietto con cinque note, *Fa due, Re quattro, Mi bemolle due, Fa
            tre, Do quattro*, un registro rilegato in pelle con l'alloro e un
            pugno di monete di platino.
          effetti: { oggetto.registro-dei-malgrani: 1, prove.maniero: 2, spartito: 1, monete: 60, tormento: 1.5 }
      - testo: "Restare fermo nel vano come nei recinti"
        descrizione: "A Ghoran hai imparato a stare immobile con gli occhi bassi finché il sorvegliante passa."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: Il sorvegliante
          testo: |
            Lasci che il corpo faccia quello che sa fare, e gli occhi restano sul pavimento anche quando
            Ottone ti passa a un braccio di distanza. Quando scende, nel primo cassetto trovi un biglietto
            con cinque note, *Fa due, Re quattro, Mi bemolle due, Fa tre, Do quattro*, nel secondo un
            registro rilegato in pelle con l'alloro e un sacchetto di monete di platino.
          pe: { resistenza: 5 }
          effetti: { oggetto.registro-dei-malgrani: 1, prove.maniero: 2, spartito: 1, monete: 60 }
        fallimento:
          titolo: Gli occhi alzati
          testo: |
            Al terzo giro Ottone si ferma davanti al vano per raddrizzare un
            quadro, e tu alzi gli occhi, cosa che a Ghoran non facevi mai. Lui
            resta a lungo con la mano sulla cornice senza vederti, e poi chiama
            Roldan con una voce calma, senza alzarla.
          effetti: { allarme.maniero: 1 }

  # ------------------------------------------------------------ Lucia (non ripetibile)
  - id: lucia-malgrani
    immagine: personaggi/lucia-malgrani
    titolo: Lucia Malgrani
    sommario: "Nella camera dei padroni una donna sveglia davanti allo specchio ti ha visto entrare, e non ha gridato."
    luogo: Maniero Malgrani, la camera dei padroni
    area: maniero-malgrani
    requisiti: [pista.pelle == 1, lucia == 0, profondita.maniero-malgrani >= 3, allarme.maniero < 3]
    testo: |
      La camera dei padroni è lussuosa e fredda, con un letto a baldacchino che
      nessuno ha disfatto. Sul comodino ci sono due bicchieri di cristallo, uno
      con un fondo ambrato e appiccicoso.

      Davanti allo specchio dorato è seduta una donna in abito scuro, con i
      capelli ancora appuntati, che ti guarda nello specchio senza voltarsi e
      tiene la mano accanto a un campanello d'argento.

      «Mio marito riceve di giorno» dice Lucia Malgrani. «Di notte, a quanto
      pare, ricevo io.» Con il pollice fa girare piano la fede intorno
      all'anulare.

      {empatia Media} Di te ha poca paura. Ne ha di più di quello che succede
      se suona, e di quello che succede se non suona.
    opzioni:
      - testo: "Guardare il bicchiere sul comodino"
        descrizione: "Il fondo ambrato del primo bicchiere. Lei vede dove guardi."
        costo: 0
        esito:
          titolo: Il bicchiere
          testo: |
            Il fondo del bicchiere odora di valeriana, e sotto c'è un sonnifero da
            cavallo, roba che si compra dal retro delle botteghe del Mercato dei
            Nodi.

            {origine accolito-del-velo} In Cattedrale arrivano donne con la bocca
            secca e le mani lente, e dicono tutte di dormire male.

            «Mi aiuta a non sentirlo camminare» dice Lucia allo specchio. «Avanti
            e indietro, tutta la notte, davanti alla mia porta.»
      - testo: "Parlarle"
        descrizione: "Non ha ancora suonato quel campanello, e forse aspetta di sapere perché sei qui."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: Le note del pianoforte
          testo: |
            Le dici chi ti manda e le giuri che i suoi figli resteranno fuori da tutto. Lei ascolta senza voltarsi e
            dice che lui non dorme più, come se la coscienza avesse cominciato a pesargli. Poi si volta verso di te.
            «Ogni notte suona il pianoforte di sotto, sempre le stesse cinque note, Fa, Re, Mi bemolle, Fa, Do. Se ha
            bisogno di tenerlo lontano dallo studio, mi chiami.»
          pe: { empatia: 5 }
          effetti: { spartito: 1 }
          imposta: { lucia: 1 }
        fallimento:
          titolo: Esca da dove è entrato
          testo: |
            Le parli dei figli e di Ghoran, e lei ti lascia finire. Poi si sfila
            gli orecchini e li posa sul tavolo. «Esca da dove è entrato. Io
            stanotte non ho visto nessuno.» Sulla porta la senti versare qualcosa
            nel bicchiere del sonnifero.
          imposta: { lucia: 2 }
          effetti: { scandalo: 0.5 }
      - testo: "Farle capire che deve tacere"
        descrizione: "Una mano sul coltello e uno sguardo al campanello, e lei sa che cosa vuol dire."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Il campanello
          testo: |
            Ti avvicini piano, con la mano sul coltello in vista nello specchio, e
            lei ritira la mano dal campanello prima che tu arrivi a metà della
            stanza. «In questa casa sono abituata a stare zitta» dice. «Una notte
            in più non cambia il conto.»
          effetti: { sospetto: 1 }
          imposta: { lucia: 2 }
        fallimento:
          titolo: Il grido
          testo: |
            Fai un passo verso di lei, e Lucia scuote il campanello con tutta la
            forza che ha e grida il nome di Roldan, con una voce che le spettina
            finalmente una ciocca. Sei in corridoio prima che arrivi la prima
            guardia.
          effetti: { allarme.maniero: 1, sospetto: 0.5 }
          imposta: { lucia: 3 }
      - testo: "Andartene senza dire niente"
        descrizione: "Lei non ha suonato, e forse se te ne vai adesso non suonerà affatto."
        esito:
          titolo: Nello specchio
          testo: |
            Indietreggi fino alla porta senza voltarle le spalle e la richiudi piano. In
            corridoio aspetti a lungo il campanello, ma da sotto la porta senti soltanto
            un bicchiere posato sul comodino.
          imposta: { lucia: 2 }
      - testo: "Ricordarle il Teatro delle Meraviglie"
        descrizione: "Il Teatro è la sola uscita che si concede, e il tuo palco di famiglia è vicino al suo."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Media }
        successo:
          titolo: Il palco accanto
          testo: |
            Le dici il tuo nome e il palco della tua famiglia al Teatro delle
            Meraviglie, e lei si volta. «Il palco dove si dormiva al secondo atto»
            dice, e quando le giuri che i suoi figli resteranno fuori da tutto
            annuisce. «Ogni notte suona il pianoforte di sotto, sempre le stesse
            cinque note, Fa, Re, Mi bemolle, Fa, Do. Se ha bisogno di tenerlo
            lontano dallo studio, mi chiami.»
          pe: { empatia: 5 }
          effetti: { spartito: 1 }
          imposta: { lucia: 1 }
        fallimento:
          titolo: Le visite si annunciano
          testo: |
            Le ricordi il Teatro e il palco della tua famiglia, forse con troppa familiarità, e lei si sfila un
            orecchino e lo posa sul tavolo. «Allora sa bene che in questa casa le visite si annunciano» dice senza
            voltarsi, «e adesso esca da dove è entrato, perché io stanotte non ho visto nessuno.»
          imposta: { lucia: 2 }
          effetti: { scandalo: 0.5 }
      - testo: "Chiederle come dorme"
        descrizione: "In Cattedrale hai visto molte donne con quegli occhi, e il Velo ti ha insegnato a cominciare dal sonno."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [empatia, medicina], difficolta: Media }
        successo:
          titolo: La domanda giusta
          testo: |
            Prima di dirle chi ti manda le chiedi da quante notti non dorme, con la
            voce bassa della tenda dei feriti, e quando le prometti che i suoi
            figli resteranno fuori da tutto ti guarda come si guarda un medico.
            «Ogni notte suona il pianoforte di sotto, sempre le stesse cinque note,
            Fa, Re, Mi bemolle, Fa, Do. Se ha bisogno di tenerlo lontano dallo
            studio, mi chiami.»
          pe: { empatia: 5 }
          effetti: { spartito: 1 }
          imposta: { lucia: 1 }
        fallimento:
          titolo: Il Velo
          testo: |
            Lei riconosce il tono prima ancora delle parole. «Il Velo manda i suoi
            anche di notte, adesso» dice allo specchio, sfilandosi un orecchino.
            «Esca da dove è entrato, perché io stanotte non ho visto nessuno.»
          imposta: { lucia: 2 }
          effetti: { sospetto: 0.5 }

  # ------------------------------------------------------------ Roldan Kael (con allarme.maniero >= 3)
  - id: roldan-kael
    immagine: fazioni/famiglia-malgrani
    titolo: Roldan Kael
    sommario: "Il fischietto d'osso suona in tutta la casa, e il caposquadra delle guardie viene a cercarti di persona."
    luogo: Maniero Malgrani, il corridoio
    area: maniero-malgrani
    requisiti: [pista.pelle == 1, allarme.maniero >= 3]
    testo: |
      Il fischietto d'osso suona una volta lunga e due corte, e in tutta la
      casa si accendono le lampade. Da sotto arrivano passi di corsa e
      l'abbaiare dei cani.

      In fondo al corridoio compare una lanterna, e dietro c'è un uomo con la
      barba tagliata a filo. Roldan Kael, con la spada sguainata e una guardia
      alle spalle, apre le porte una per una.

      {origine fuggiasco-di-ghoran} Conosci gli uomini che cercano senza
      fretta, perché sanno che hai già perso, e la schiena ti si curva da sola
      come nei recinti.

      {armi-da-mischia Media} Tiene la spada bassa e vicina al corpo, perché
      nei corridoi chi alza la lama la pianta nel soffitto.

      «So che sei qui, ospite» dice, senza alzare la voce. «In questa casa ci
      sono trentadue porte, e le conosco tutte. Fammi risparmiare tempo.» Solo
      abbassando gli occhi ti accorgi di stringere il manico del coltello.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "Un veterano e una guardia in un corridoio stretto, e senza Roldan la casa non sa a chi obbedire."
        combattimento: roldan-kael
        vittoria:
          titolo: Il fischietto rotto
          testo: |
            Roldan combatte bene e senza fretta, e ti fa pagare ogni passo del corridoio prima che tu lo
            metta giù contro un cassettone, con il fischietto d'osso spezzato sotto il gomito. Nella casa le
            lampade si spengono una alla volta, perché senza il fischio nessuno sa più che cosa cercare.
          pe: { armi-da-mischia: 5 }
          imposta: { allarme.maniero: 1 }
        sconfitta:
          titolo: Fuori dal cancello
          testo: |
            Roldan ti lascia attaccare per primo e ti colpisce di piatto alla
            tempia con un mezzo passo quasi pigro. Quando riapri gli occhi ti
            stanno buttando oltre il cancello nel fango. «La prossima volta ti
            consegno alla Caserma, ospite» dice Roldan, e richiude il lucchetto.
          vai: quartieri-alti
      - testo: "Nasconderti prima che arrivi alla tua porta"
        descrizione: "Trentadue porte, e lui le conosce tutte ma non può aprirle tutte insieme."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: La trentatreesima
          testo: |
            Ti infili nel camino spento di una stanza degli ospiti e sali con la
            schiena e i piedi contro i mattoni. Sotto di te Roldan guarda sotto il
            letto e dietro le tende, poi dice alla guardia che era il gatto della
            cuoca, e quando scendi sei nero di fuliggine fino ai gomiti.
          pe: { furtivita: 5 }
          imposta: { allarme.maniero: 1 }
        fallimento:
          titolo: Sotto la cassapanca
          testo: |
            Ti butti sotto una cassapanca, e Roldan ci si siede sopra con un
            sospiro da uomo stanco. «Esci» dice. Ti accompagnano al cancello
            tenendoti per le braccia, con una gentilezza che fa più male delle
            botte, e sulla soglia il calcio del pugnale ti arriva lo stesso nelle
            costole.
          effetti: { ferite: 2 }
          vai: quartieri-alti
      - testo: "Dirgli che ti manda Mauro Scrocco"
        descrizione: "Ottone paga gli Scuri, e qualcuno della Pignatta sarà pur passato da questa casa di notte."
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: Quelli della Pignatta
          testo: |
            Esci con le mani in vista e gli dici che ti manda Mauro per la consegna del mese. Roldan
            sputa per terra. «Quelli della Pignatta entrano dal frutteto e aspettano in cucina, e
            per i corridoi non ci girano, glielo dirai tu a Mauro» dice, e ti spinge verso la scala
            di servizio fischiando una volta sola, per dire che è finita.
          pe: { ingannare: 5 }
          imposta: { allarme.maniero: 1 }
        fallimento:
          titolo: I nomi
          testo: |
            Roldan ti guarda dalla testa ai piedi. «Quelli della Pignatta li
            conosco tutti per nome» dice, «e tu non sei nessuno di loro.» La
            guardia ti torce un braccio dietro la schiena finché la spalla
            schiocca, e Roldan ti butta nel fango oltre il cancello con un calcio
            nei reni, preciso, da professionista.
          effetti: { ferite: 2 }
          vai: quartieri-alti
      - testo: "Scappare dalla finestra"
        descrizione: "Sotto c'è il giardino e i cani sono fuori, e così si salva la pelle ma la notte è finita."
        esito:
          titolo: Le siepi
          testo: |
            Salti dalla finestra più vicina sulle siepi potate a squadra, che ti
            graffiano dappertutto. I cani ti arrivano alle calcagna quando sei già
            sul muro del frutteto, e uno ti abbaia dietro finché non giri
            l'angolo, offeso di non averti morso.
          effetti: { ferite: 0.5 }
          vai: quartieri-alti
      - testo: "Uscire sul cornicione e aspettare"
        descrizione: "Sulle piattaforme della Cicatrice hai passato turni interi appeso a un'impalcatura, e un cornicione bagnato è largo."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Facile }
        successo:
          titolo: Il cornicione
          testo: |
            Ti cali sul cornicione di una stanza degli ospiti, con la pancia
            contro il muro e i talloni sul vuoto, e richiudi le imposte con due
            dita. Roldan si affaccia ma guarda verso il giardino, e lo senti dire
            alla guardia che era il gatto della cuoca.
          pe: { atletica: 5 }
          imposta: { allarme.maniero: 1 }
        fallimento:
          titolo: Le imposte
          testo: |
            Il vento ti strappa un'imposta di mano e la sbatte contro il muro.
            Roldan apre la finestra e ti tende la mano con una calma da mettere i
            brividi. «Dentro» dice. Al cancello il calcio del pugnale ti arriva
            nelle costole, seguito dallo stivale della guardia, e ti ritrovi nel
            fango della strada sotto la pioggia.
          effetti: { ferite: 2 }
          vai: quartieri-alti

  # ------------------------------------------------------------ il cuore · il pianoforte (1 → 2)
  - id: il-caveau
    immagine: ambientazione/maniero-malgrani
    titolo: Il pianoforte dei Malgrani
    sommario: "La sala da pranzo dei Malgrani, con un pianoforte nell'angolo e una crocetta sulla pianta di Urtilia."
    luogo: Maniero Malgrani, la sala da pranzo
    area: maniero-malgrani
    requisiti: [pista.pelle == 1, profondita.maniero-malgrani >= 4, allarme.maniero < 3]
    testo: |
      Dalla scala di servizio scendi fino alla sala da pranzo, dove il
      servizio d'argento è apparecchiato per una cena che non si farà e le
      poltrone di velluto sono girate verso il camino acceso. Sopra il camino
      il ritratto di Ottone e di sua moglie, rigidi a un palmo l'uno
      dall'altra, dà alla signora un sorriso sereno che non c'entra niente
      con il resto della tela.

      Nell'angolo c'è un pianoforte a coda nero, con il coperchio chiuso, e
      sulla pianta di Urtilia, proprio in quel punto, c'è una crocetta a
      matita e niente altro.

      {espressivita Facile} I tasti sono ingialliti, e sul coperchio non c'è
      un granello di polvere. Qualcuno ci si siede spesso, e a giudicare dai
      tasti suona sempre gli stessi.
    opzioni:
      - testo: "Suonare la sequenza"
        descrizione: "Fa due, Re quattro, Mi bemolle due, Fa tre, Do quattro. Piano, che di notte si sente tutto."
        requisiti: [spartito >= 1]
        esito:
          titolo: L'armonia storta
          testo: |
            Alzi il coperchio e suoni piano le cinque note, che fanno un accordo
            stonato da allegare i denti. Il pavimento vibra, e sotto il tappeto un
            riquadro di assi scorre di lato e scopre una botola di ferro con
            incisioni geometriche, aperta.
          segue: la-sala-ottagonale
      - testo: "Trovare la sequenza a orecchio"
        descrizione: "Un pianoforte che apre qualcosa deve suonare storto, e si tratta di sentire quale nota stona."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: A orecchio
          testo: |
            Premi i tasti uno alla volta con il dito sul feltro, finché ne trovi
            cinque che fanno vibrare il pavimento, e li suoni in fila.

            {espressivita Difficile} Ogni nota è calata apposta di un poco, e chi
            ha accordato questo pianoforte aveva un orecchio migliore del tuo.

            Sotto il tappeto un riquadro di assi scorre di lato e scopre una
            botola di ferro con incisioni geometriche, aperta.
          pe: { espressivita: 5 }
          segue: la-sala-ottagonale
        fallimento:
          titolo: Il pianoforte di notte
          testo: |
            Il feltro non basta, e alla decima nota il suono riempie la sala ed
            esce nel corridoio. Sopra la tua testa i passi dello studio si
            fermano. Ti nascondi dietro le poltrone mentre qualcuno scende fino a
            metà scala, e poi torna su.
          effetti: { allarme.maniero: 1, sospetto: 0.5 }
      - testo: "Forzare la botola con un attizzatoio"
        descrizione: "Il bordo delle assi sotto il tappeto si vede, e con l'attizzatoio si fa leva e si fa rumore."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: L'attizzatoio
          testo: |
            Arrotoli il tappeto e infili l'attizzatoio nella fessura delle assi.
            Al terzo strattone il riquadro salta con uno schiocco che rimbomba per
            tutta la casa, e sotto c'è una botola di ferro con incisioni
            geometriche. La apri mentre al piano di sopra una porta sbatte e
            qualcuno chiama Roldan.
          pe: { atletica: 5 }
          effetti: { allarme.maniero: 1 }
          segue: la-sala-ottagonale
        fallimento:
          titolo: Le assi
          testo: |
            L'attizzatoio scivola dalla fessura e ti finisce sulle dita, e il
            rumore del ferro sul legno fa abbaiare i cani in giardino. Rimetti a
            posto il tappeto e ti nascondi dietro le poltrone mentre la casa si
            sveglia una lampada alla volta, succhiandoti le nocche per non fare
            rumore.
          effetti: { allarme.maniero: 1, ferite: 0.5 }
      - testo: "Aprire la botola con il Sigillo"
        descrizione: "Una serratura che si apre con il suono è una serratura di Mana, e il Mana ha le sue chiavi."
        incantesimo: sigillo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La serratura del suono
          testo: |
            Con il palmo sul legno del pianoforte senti il Mana scendere dalle
            corde fino al pavimento, avvolto intorno a una serratura che si apre
            con cinque note. Gliele dai senza suonarle, e le dita ti formicolano
            fino al gomito. Sotto il tappeto un riquadro di assi scorre di lato e
            scopre una botola di ferro con incisioni geometriche, aperta.
          segue: la-sala-ottagonale
        fallimento:
          titolo: La nota sbagliata
          testo: |
            Il Sigillo prende la serratura dal verso sbagliato, e tutte le corde
            vibrano insieme con un lamento che ti pianta un ago dietro gli occhi.
            Al piano di sopra i passi dello studio cominciano a scendere, e ti
            butti dietro le poltrone finché qualcuno non si stanca di cercare.
          effetti: { allarme.maniero: 1, tormento: 1 }
      - testo: "Cercare con le dita le corde che portano il Mana"
        descrizione: "Conosci le prime formule dei cristalli, e qui dentro qualcosa risponde a un suono come un cristallo."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [magia, accademiche], difficolta: Media }
        successo:
          titolo: Cinque corde
          testo: |
            Appoggi i polpastrelli sulle corde una alla volta, come la sera del Festival
            con i cristalli del banco. Cinque ti pizzicano le dita con una corrente
            fredda, e le segui fino ai tasti. Le suoni piano nell'ordine in cui le hai
            trovate, e sotto il tappeto un riquadro di assi scorre di lato e scopre una
            botola di ferro con incisioni geometriche, aperta.
          pe: { magia: 5 }
          segue: la-sala-ottagonale
        fallimento:
          titolo: L'ordine sbagliato
          testo: |
            Trovi le cinque corde che pizzicano, ma le suoni nell'ordine
            sbagliato, e il pianoforte risponde con un accordo pieno e innocente
            che esce nel corridoio. Sopra la tua testa i passi dello studio si
            fermano, e ti nascondi dietro le poltrone mentre qualcuno scende fino
            a metà scala prima di tornare su.
          effetti: { allarme.maniero: 1, sospetto: 0.5 }

  - id: la-sala-ottagonale
    immagine: ambientazione/cristalli-conduttori
    titolo: La sala ottagonale
    sommario: "Dietro una porta di pietra scolpita a radici, i Malgrani tengono quello che non si mostra agli ospiti."
    luogo: Maniero Malgrani, il caveau
    area: maniero-malgrani
    tipo: seguito
    testo: |
      Una scala a chiocciola di ferro scende per dieci metri nel buio, fino a
      una porta di pietra scolpita a radici intrecciate che cede a una spinta.

      La sala è ottagonale, illuminata da una lanterna con un Cristallo
      Conduttore che fa una luce verde e azzurra, da acquario. Gli scaffali
      lungo le pareti sono pieni di registri e di pergamene, e sul pavimento
      sono incisi cerchi uno dentro l'altro, con segni che non sono lettere.
      In mezzo, su un piedistallo di pietra, un cristallo grande come un uovo
      pulsa di luce blu.

      {magia Media} I cerchi sono pieni di Mana fermo e avvolto su se stesso,
      una serratura che il cristallo sul piedistallo tiene chiusa.

      {origine allievo-di-torvessa} Due dei segni li hai visti nelle formule
      del primo anno; gli altri no, e all'Accademia questo si chiama sapere
      quanto poco se ne capisce.

      Sul primo scaffale ci sono le carte. Lettere chiuse con la ceralacca
      verde e l'alloro, firmate da Ottone Malgrani, con il nome di Mirko Vesh
      a margine; elenchi di funzionari della Casa dei Nodi, ognuno con la sua
      cifra, e le date dei pagamenti in una colonna lunga anni. Con queste
      carte cadono Ottone e mezza Gilda.

      Il resto della sala è pieno di monete e di gemme, e ti riempi le tasche
      di quello che ci sta.
    opzioni:
      - testo: "Prendere soltanto le carte"
        descrizione: "Le carte sono il motivo per cui sei qui, e il cristallo può restare dov'è."
        esito:
          titolo: Le carte di Ottone
          testo: |
            Infili le lettere e gli elenchi nella giubba senza avvicinarti al
            cristallo. Risalito, richiudi la botola sotto il tappeto. Esci dal
            frutteto quando sopra i pini il cielo comincia a schiarire, e scendi
            verso la Caserma con le tasche che tintinnano a ogni passo.
          pe: { politica-ed-economia: 5 }
          effetti: { prove.maniero: 2, pista.pelle: 1, monete: 40, racconto: 1 }
          imposta: { allarme.maniero: 0 }
          vai: quartieri-alti
      - testo: "Prendere anche il cristallo"
        descrizione: "Chi ha messo lì quel cristallo non l'ha lasciato senza custode, e i cerchi sul pavimento lo dicono."
        combattimento: il-guardiano-del-caveau
        vittoria:
          titolo: Il Guardiano
          testo: |
            Quando sollevi il cristallo i cerchi si accendono, e dal centro sale
            una figura di metallo e di resina con le giunture fatte di radici. Ci
            vuole molto a buttarla giù, perché colpisci dove colpiresti un uomo, e
            quando cade si spezza come un ramo secco. Risali con le carte nella
            giubba e il cristallo in tasca, caldo contro la coscia.
          effetti: { prove.maniero: 2, pista.pelle: 1, monete: 40, racconto: 1, oggetto.cristallo-della-visione-del-vero: 1 }
          imposta: { allarme.maniero: 0 }
          vai: quartieri-alti
        sconfitta:
          titolo: La linfa
          testo: |
            Dai cerchi accesi sale una figura di metallo e di resina con le giunture di
            radici, che ti strappa il cristallo e lo rimette sul piedistallo. Raggiungi
            la scala con le carte strette al petto e la linfa verde che ti si indurisce
            sulla camicia, e in cima ti fermi a guardare il Guardiano che rientra nei
            suoi cerchi.
          effetti: { prove.maniero: 2, pista.pelle: 1, monete: 40, racconto: 1 }
          imposta: { allarme.maniero: 0 }
          vai: quartieri-alti
      - testo: "Afferrare il cristallo e correre"
        descrizione: "Dieci metri di scala a chiocciola, e se quello che si sveglia è lento forse bastano."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: La scala a chiocciola
          testo: |
            Prendi il cristallo e corri prima che i cerchi finiscano di
            accendersi. Una figura di metallo e resina ti segue su per la scala e
            all'ultimo giro ti prende la caviglia con una mano di radici, ma tiri
            via il piede e chiudi la botola, e sotto il ferro rimbomba due volte.
          effetti: { prove.maniero: 2, pista.pelle: 1, monete: 40, racconto: 1, oggetto.cristallo-della-visione-del-vero: 1, ferite: 1 }
          imposta: { allarme.maniero: 0 }
          vai: quartieri-alti
        fallimento:
          titolo: La caviglia
          testo: |
            I cerchi si accendono prima che tu arrivi alla scala, e una mano di
            radici ti afferra la caviglia e ti sbatte contro il muro. Il cristallo
            ti vola via e rotola nel buio. Sali gli ultimi giri carponi, con le
            carte nella giubba e la caviglia che non regge, e chiudi la botola con
            tutto il tuo peso.
          effetti: { prove.maniero: 2, pista.pelle: 1, monete: 40, racconto: 1, ferite: 2.5 }
          imposta: { allarme.maniero: 0 }
          vai: quartieri-alti
      - testo: "Chiudere i cerchi con il Sigillo, poi prendere il cristallo"
        descrizione: "I cerchi sul pavimento sono una serratura, e se resta chiusa quello che c'è dietro non esce."
        incantesimo: sigillo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: I cerchi chiusi
          testo: |
            Inginocchiato sul cerchio più esterno trovi il punto dove il Mana gira
            lento sotto le dita, e lo chiudi su se stesso. Quando sollevi il
            cristallo i segni si accendono e si spengono subito, e sotto la pietra
            qualcosa si muove una volta sola. Risali con le carte e il cristallo,
            e sulle ginocchia hai il segno dei cerchi stampato in rosso.
          effetti: { prove.maniero: 2, pista.pelle: 1, monete: 40, racconto: 1, oggetto.cristallo-della-visione-del-vero: 1 }
          imposta: { allarme.maniero: 0 }
          vai: quartieri-alti
        fallimento:
          titolo: Il cerchio aperto
          testo: |
            Il Sigillo prende il cerchio dal verso sbagliato e lo apre, e dal
            pavimento sale una figura di metallo e di resina. Lasci cadere il
            cristallo e scappi su per la scala con le carte, e il colpo che ti
            prende alla schiena sull'ultimo gradino ti butta in ginocchio.
          effetti: { prove.maniero: 2, pista.pelle: 1, monete: 40, racconto: 1, ferite: 2, tormento: 1 }
          imposta: { allarme.maniero: 0 }
          vai: quartieri-alti
      - testo: "Scegliere le carte come un esattore della Gilda"
        descrizione: "Anni al banco della Gilda ti hanno insegnato quali carte un avvocato riesce a spiegare e quali no."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: I fogli che non si spiegano
          testo: |
            Le lettere con la ceralacca verde le prendi tutte, perché la firma di
            Ottone non si spiega. Degli elenchi della Casa dei Nodi scegli quelli
            con il timbro dell'ufficio, che un funzionario ha dovuto firmare per
            ricevere, e lasci le copie in bella. Esci dal frutteto con metà del
            peso e tutto quello che conta, senza aver toccato il cristallo.
          pe: { politica-ed-economia: 5 }
          effetti: { prove.maniero: 2, pista.pelle: 1, monete: 40, racconto: 1 }
          imposta: { allarme.maniero: 0 }
          vai: quartieri-alti

  # ------------------------------------------------------------ 2 → 3 · una radice
  - id: una-radice
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: Una radice
    sommario: "Hai le carte di Ottone Malgrani nella giubba. Galdrick le aspetta da quando è sceriffo."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo
    area: quartieri-alti
    requisiti: [pista.pelle == 2]
    testo: |
      Posi sul tavolo dello sceriffo le lettere chiuse con la ceralacca verde
      e l'alloro, firmate da Ottone Malgrani, con il nome di Mirko Vesh a
      margine della stessa penna. Galdrick le tocca con la punta delle dita.

      «Per anni ho creduto che la corruzione fosse una ragnatela, ma questa è
      una radice» dice. «Parte da sotto la città e arriva fino alle sale del
      Consiglio. Julia lo sa da sempre, e senza prove non poteva muovere un
      dito.»

      {origine rampollo-dei-quartieri-alti} Quando dice Julia la rivedi ferma
      fra i tavoli del Festival, e pensi che userà le prove in una volta sola.

      «Se domani arresto Ottone, stanotte Vesh lo sa da uno dei miei, e con il
      denaro da parte si compra la Città Bassa in una settimana. Prima gli
      togliamo il denaro.» Dai conti di Ottone ricava tre casse e le segna
      sulla mappa con tre segnalini nuovi, nella bisca di Nihali all'Orlo dei
      Rottami, nel retrobottega della Dispensa di Gramm al Mercato dei Nodi e
      dentro il pilone cavo del Ponte delle Mille Corde.

      In una pagina c'è una sigla, *Ca*, con una piccola chiave disegnata
      accanto, e Galdrick volta il foglio in fretta.

      {intimidire Difficile} Quella chiave gli ha fatto paura, e uno come
      Galdrick nasconde così soltanto la paura per qualcun altro.
    opzioni:
      - testo: "Parlargli di Lucia"
        descrizione: "La moglie di Ottone ti ha aiutato, e lui dovrebbe saperlo prima di firmare qualunque mandato."
        immagine: personaggi/lucia-malgrani
        requisiti: [lucia == 1]
        costo: 0
        esito:
          titolo: Una che ha deciso da tempo
          testo: |
            Gli racconti di Lucia e delle cinque note. Galdrick scrive una riga
            sul taccuino, ripassandola due volte. «Una moglie che tiene il marito
            lontano dallo studio per uno sconosciuto ha deciso da tempo» dice
            senza alzare gli occhi. «Lo dirò a Julia, e me lo ricorderò quando
            verrà il momento del mandato.»
      - testo: "Parlargli di Lucia"
        descrizione: "La moglie di Ottone ti ha visto, e ti ha lasciato andare."
        immagine: personaggi/lucia-malgrani
        requisiti: [lucia == 2]
        costo: 0
        esito:
          titolo: Anche lei aspetta
          testo: |
            Gli racconti della donna davanti allo specchio, che ti ha visto e non
            ha suonato il campanello. «Allora sta aspettando anche lei di vedere
            come va a finire» dice Galdrick, guardando la mappa. «In quella casa
            sono tutti bravi ad aspettare.»
      - testo: "Parlargli di Lucia"
        descrizione: "La moglie di Ottone ha suonato il campanello e ha gridato il nome di Roldan."
        immagine: personaggi/lucia-malgrani
        requisiti: [lucia == 3]
        costo: 0
        esito:
          titolo: Meno tempo
          testo: |
            Gli racconti del campanello e del grido, e Galdrick si passa una mano
            sulla faccia. «Allora Ottone sa che qualcuno è entrato in casa sua»
            dice piano. «Chi fosse e che cosa manchi lo scoprirà la prima volta
            che aprirà il caveau a contare, e abbiamo meno tempo di quanto
            pensassi.» Poi cerchia un giorno sul calendario.
      - testo: "Mostrargli l'anello col sigillo"
        descrizione: "Un anello d'oro con le iniziali di Ottone, trovato dietro una mensola."
        requisiti: [maniero.anello == 1]
        costo: 0
        esito:
          titolo: O.M.
          testo: |
            Galdrick rigira l'anello alla luce. «Con questo Ottone chiude i
            contratti alla Casa dei Nodi» dice. «Se il sigillo sulle lettere del
            caveau è lo stesso, nessun avvocato gli trova una scusa.» Lo infila in
            una busta e ci scrive la data con una calligrafia più accurata del
            solito.
      - testo: "Mostrargli il lingotto della cucina"
        descrizione: "Argento col sigillo dei Malgrani, e sotto il segno raschiato della Gilda."
        requisiti: [maniero.lingotti == 1]
        costo: 0
        esito:
          titolo: Rubato due volte
          testo: |
            Galdrick passa il pollice sul segno raschiato del lingotto. «Argento
            dei magazzini della Gilda, che nei loro libri non risulta mai uscito»
            dice a mezza voce. «Cordani vorrà vederlo prima di chiunque altro.» Lo
            chiude nel cassetto della scrivania invece che nella cassa di ferro,
            di cui a quanto pare ha smesso di fidarsi.
      - testo: "Mostrargli il cristallo del caveau"
        descrizione: "Il cristallo del piedistallo, e da quando ce l'hai la notte dormi male."
        requisiti: [oggetto.cristallo-della-visione-del-vero >= 1]
        costo: 0
        esito:
          titolo: Il Guardiano di Urtilia
          testo: |
            Galdrick non lo tocca. «Urtilia mi aveva detto del Guardiano sotto la
            casa. L'ha messo lì lei, anni fa, quando il cristallo era ancora suo»
            dice. «Mi ha detto anche che chi lo tiene troppo vicino non dorme più
            bene.» Ti guarda le occhiaie e ti consiglia di tenerlo lontano dal
            letto.
      - testo: "Chiedergli che cosa fa del registro di Ottone"
        descrizione: "Il registro dello studio ce l'hai tu, e in Caserma un quarto delle guardie è di Vesh."
        requisiti: [oggetto.registro-dei-malgrani >= 1]
        costo: 0
        esito:
          titolo: Una parte per uno
          testo: |
            Galdrick ricopia sul taccuino le pagine delle tre casse, riga per
            riga, muovendo le labbra sulle cifre, e poi ti spinge di nuovo il
            registro sul tavolo. «Tienilo tu, perché in questa Caserma non lo
            lascerei nemmeno nella cassa di ferro» dice sottovoce, «e se a me
            succede qualcosa qualcuno deve averne una parte.»
      - testo: "Lasciargli le carte"
        descrizione: "Le tre casse sono segnate sulla mappa, e adesso tocca agli Scuri."
        requisiti: [prove.maniero < 6]
        esito:
          titolo: Tre segnalini
          testo: |
            «Stanotte queste carte dormono a casa mia, e non qui» dice Galdrick,
            infilandole in una cartella di cuoio. Poi ti stringe la mano più forte
            del solito. «Le tre casse sono tue quando vuoi, e per ognuna voglio
            sapere chi c'era dentro e chi è scappato.»
          effetti: { pista.pelle: 1, rep.caserma: 1 }
      - testo: "Lasciargli le carte"
        descrizione: "Con le carte del caveau porti anche l'anello e l'argento della cucina."
        requisiti: [prove.maniero >= 6]
        esito:
          titolo: Abbastanza per Julia
          testo: |
            Galdrick mette in fila le carte del caveau accanto all'anello e all'argento della cucina, e per la
            prima volta sorride. «Con questo Julia porta in Consiglio Ottone e i tre della Casa dei Nodi che
            prendevano la sua paga» dice, e poi batte il dito sui tre segnalini nuovi. «Le casse sono tue
            quando vuoi, e per ognuna voglio sapere chi c'era dentro e chi è scappato.»
          effetti: { pista.pelle: 1, rep.caserma: 1, rep.castaldi: 1 }

  # ------------------------------------------------------------ dagli Averi · il registro di Ottone
  - id: leggere-il-registro-dei-malgrani
    titolo: Il registro dei Malgrani
    tipo: oggetto
    area: citta-bassa
    immagine: fazioni/famiglia-malgrani
    requisiti: [oggetto.registro-dei-malgrani >= 1]
    sommario: "Il registro dei pagamenti di Ottone Malgrani, dove ogni pagina finisce con una somma e una firma."
    testo: |
      Il registro è rilegato in pelle verde scuro con l'alloro della casata
      impresso a caldo. La grafia di Ottone è piccola e diritta, e dove ha
      sbagliato un conto Ottone ha strappato la pagina lungo la cucitura e
      l'ha riscritta da capo.

      Al posto dei nomi delle persone ci sono quasi sempre iniziali o
      piccoli disegni accanto alle somme, mese dopo mese per nove anni.
    opzioni:
      - testo: "Le pagine degli Scuri"
        costo: 0
        esito:
          titolo: Tramite la Pignatta
          testo: |
            La voce più lunga è *M. V., tramite la Pignatta*, raddoppiata in nove
            anni. I soldi arrivano agli Scuri con nomi di comodo, come le *perdite
            al gioco* all'Orlo, sempre contro una N e una C, gli *infusi per la
            signora* pagati alla Dispensa di Gramm, e due volte all'anno una borsa
            *al quarto pilone*.

            {conoscenze-della-strada Media} Chi perde ogni settimana contro gli
            stessi due sta pagando una rata.
      - testo: "Le pagine della Gilda"
        costo: 0
        esito:
          titolo: Il custode del ponte
          testo: |
            Tre funzionari della Casa dei Nodi prendono una somma fissa ogni mese,
            e sotto c'è una voce per esteso, *il custode del Ponte dei Morti,
            turno di notte*. Sono le cifre che Maedric Holl sottolineava in fondo
            alle sue pagine, la controprova di cui parlava Galdrick.

            {origine mercante-dei-ponti} Uno di quegli uffici ti ha timbrato la
            licenza dopo mezza mattina di attesa, e adesso sai quanto prendeva per
            farti aspettare.
      - testo: "La pagina della Caserma"
        costo: 0
        esito:
          titolo: La chiave disegnata
          testo: |
            In cima alla pagina c'è scritto *Caserma*, e sotto ci sono diciotto
            nomi di guardie con somme piccole, quanto basta per non vedere un
            carro. In fondo c'è una voce senza nome, la sigla *Ca* accanto a una
            piccola chiave disegnata con tutti i denti, la somma più alta della
            pagina, pagata ogni settimana.

            {percezione Media} I denti sono tutti diversi, come nel ritratto di
            una chiave vera.
      - testo: "Le pagine dei mulini"
        costo: 0
        esito:
          titolo: Il lavoro di notte
          testo: |
            Tre date a qualche mese l'una dall'altra, ognuna con lo stesso
            pagamento alla Pignatta, *per il lavoro di notte*. Sono le notti in
            cui sono bruciati i mulini dei concorrenti, e da allora in tutta la
            regione è rimasto in piedi soltanto il Mulino Malgrani. Dalla
            primavera dopo comincia un'altra voce mensile, più piccola, *Ghoran,
            per i tre*, che non ha mai saltato un mese.
      - testo: "Chiudere il registro"
        costo: 0
        esito:
          titolo: La firma
          testo: |
            Chiudi il registro, e l'alloro della copertina ti resta impresso nel
            palmo per un po'. Lo rimetti nella bisaccia sotto il resto, e quando
            firmi il conto della locanda ti sorprendi a raddrizzare la grafia come
            quella di Ottone.
