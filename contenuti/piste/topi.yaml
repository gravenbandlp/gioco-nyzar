# Topi in cantina (verbale, righe 2104–2209): la carta di Rilla Tamberlo, la cantina dell'Emporio, la pace con
# Oddo e la torta di Berta. Quality: topi (1 tutto liscio, 2 Oddo non ti serve più, 3 Oddo l'ha raccontato a
# mezza città). Con topi >= 2 il luogo emporio-tamberlo sparisce finché non fai pace.
storylet:
  # ------------------------------------------------------------ la carta
  - id: rilla-e-i-topi
    immagine: personaggi/rilla-tamberlo
    titolo: Topi in cantina
    sommario: "A sera l'Emporio Tamberlo è vuoto. Dietro il bancone Rilla Tamberlo sfoglia un romanzo, e alza gli occhi quando entri."
    luogo: L'Emporio Tamberlo, di sera
    tipo: carta
    area: citta-bassa
    requisiti: [topi == 0, pista.dama-argento >= 3]
    testo: |
      È quasi sera quando spingi la porta dell'Emporio Tamberlo, e il
      campanello sopra lo stipite suona due volte, la seconda in ritardo,
      perché qualcuno l'ha riattaccato con il fil di ferro. Fra le zappe
      appese alle travi e i sacchi di chiodi venduti a peso non c'è nessuno,
      a parte una donna seduta dietro il bancone con un romanzo aperto sulle
      ginocchia, che sfoglia senza leggere.

      È Rilla Tamberlo, la figlia minore di Oddo. Ha ventidue anni, i capelli
      rossi sciolti su una spalla e al polso un nastro verde che non serve a
      niente. Ti sorride con la cortesia della bottega. «Buonasera. Stiamo per
      chiudere, non potrebbe tornare domattina?»

      Le rispondi che ti serve poco. Lei ti guarda meglio e per qualche
      momento non dice niente, poi le scappa un risolino basso. «Sì, direi che
      puoi fare egregiamente al caso mio.»

      La cortesia è sparita di colpo, e al suo posto c'è una donna che fa i
      conti. Da una settimana, ti spiega, suo padre pensa soltanto a sua
      sorella Elsa, e intanto la cantina si è riempita di topi. «Ieri ne ho
      visto uno dietro un barile, grande quanto mezzo orco. Francamente mi
      veniva da vomitare.» *Mezzo orco è una misura che per i topi si usa
      poco.* Rilla rabbrividisce e si stringe nelle spalle. «Se ti accompagno
      giù adesso, me lo prometti che li stermini? Ti prometto che sarò molto
      riconoscente.»

      Ha gli occhi verdi, e ti accorgi di esserti appoggiato al bancone senza
      averlo deciso.
    opzioni:
      - testo: "Chiedere di Elsa"
        descrizione: "Un padre che da una settimana si dimentica dei topi deve avere un buon motivo."
        immagine: personaggi/elsa-tamberlo
        requisiti: [rennick < 2]
        costo: 0
        esito:
          titolo: Scintille
          testo: |
            «Mia sorella Elsa fa scintille con Rennick Dole, hai presente?
            Quello della Segheria.» Rilla arriccia il naso. «Francamente non
            so che cosa ci trovi. È un animale tutto pelo e muscoli, e quando
            parla di legname gli si accendono gli occhi. Dalla sera del
            Festival, però, non si fa più vedere, e alla Segheria dicono che è
            partito per Laresh.»

            Poi abbassa la voce, anche se in bottega ci siete solo voi. Elsa a
            Laresh non ci crede, e suo padre, che è protettivo fino al
            ridicolo, da quando ha saputo di loro due gira per casa come un
            orso nella tana sbagliata. Dei topi si ricorda soltanto lei. Tu di
            Rennick ne sai più di quanto lei immagini, e intanto la lasci
            parlare.
      - testo: "Chiedere di Elsa"
        descrizione: "Un padre che da una settimana si dimentica dei topi deve avere un buon motivo."
        immagine: personaggi/elsa-tamberlo
        requisiti: [rennick == 2]
        costo: 0
        esito:
          titolo: Attraverso il muro
          testo: |
            «Mia sorella Elsa piange da una settimana» dice Rilla, e si rigira
            il nastro verde intorno al polso. «Rennick Dole, quello della Segheria, è sparito.
            Alla Segheria dicono che è a Laresh per una trattativa, e lo dicono
            tutti con le stesse parole. Francamente non l'ho mai sopportato,
            però sentirla piangere attraverso il muro tutte le notti è
            un'altra faccenda.»

            Tu sai dov'è andato Rennick Dole, e chi ce l'ha mandato. Lo
            stomaco ti si chiude, e per un po' guardi le assi del pavimento.
            Rilla non se ne accorge e ti racconta di suo padre, che gira per
            casa come un orso e dei topi si è dimenticato.
      - testo: "Prometterle di liberare la cantina"
        descrizione: "È bella e ti guarda come si guarda un eroe. Bisogna tenere la testa a posto, se ci si riesce."
        prova: { attributo: mentale, abilita: [resilienza, empatia], difficolta: Media }
        successo:
          titolo: La testa a posto
          testo: |
            Le dici che ci pensi tu. Rilla batte le mani due volte. «Benissimo!
            Possiamo scendere anche adesso, così lo risolviamo una volta per
            tutte.»

            È bella, e l'idea di fare l'eroe davanti a lei ti scalda più di
            quanto vorresti. Però ti resta abbastanza lucidità per notare che
            il mazzo di chiavi della cantina era già sul bancone, accanto al
            romanzo, prima ancora che tu entrassi.
          segue: la-cantina-dei-tamberlo
        fallimento:
          titolo: Con tutte le scarpe
          testo: |
            Le dici che ci pensi tu. Rilla batte le mani due volte. «Benissimo!
            Possiamo scendere anche adesso, così lo risolviamo una volta per
            tutte.»

            L'idea di fare l'eroe davanti a lei ti scalda, e forse un po'
            troppo. Mentre la segui dietro il bancone i topi ti sembrano un
            dettaglio, e ti chiedi già che cosa succederà quando la cantina
            sarà pulita e lei ti dovrà ringraziare. Per tutto il tempo che lei
            impiega a trovare la chiave giusta nel mazzo, non riesci a pensare
            ad altro.
          segue: la-cantina-dei-tamberlo
      - testo: "Rifiutare con garbo"
        descrizione: "I topi di Oddo Tamberlo può cacciarli Oddo Tamberlo."
        esito:
          titolo: Torni domattina
          testo: |
            Le dici che stasera non puoi, e che le cantine degli altri le
            preferisci di giorno. Rilla alza le spalle, e la cortesia della
            bottega le torna sulla faccia come una tenda che si chiude.
            «Allora buonasera. Torni domattina, c'è mio padre.» Riapre il
            romanzo alla pagina sbagliata, e il campanello ti accompagna fuori
            suonando due volte.

  # ------------------------------------------------------------ la cantina
  - id: la-cantina-dei-tamberlo
    immagine: ambientazione/emporio-generale
    titolo: La cantina dei Tamberlo
    tipo: seguito
    luogo: L'Emporio Tamberlo, la cantina
    area: citta-bassa
    requisiti: [topi == 0]
    testo: |
      Rilla apre la porta alle sue spalle con una chiave lunga quanto un
      dito. Dalla tromba delle scale sale un odore di chiuso e di umido, che
      dopo tre gradini quasi non senti più. Lei resta in cima con la lanterna
      alzata e ti fa cenno di scendere per primo, la mano aperta verso il buio.

      La cantina è un unico spiazzo basso, con due grandi armadi di legno
      consunto contro il muro di fondo. I barili e i cassoni sono impilati in
      perfetto ordine, e ognuno ha un cartellino scritto con una grafia
      diritta e minuta che non può essere quella di Rilla. Al centro qualcuno
      ha montato una brandina, con la coperta piegata in quattro e il cuscino
      sprimacciato da poco. *I topi, qui sotto, dormirebbero comodi.* Ti
      chini a guardare dietro il barile più vicino e trovi soltanto polvere,
      senza nemmeno una rosicchiatura sui sacchi.

      Quando ti rialzi Rilla ti sta davanti, vicinissima. Ha posato la
      lanterna su un cassone e ha il bustino slacciato. Ti mette le
      braccia al collo, si morde il labbro e ti bacia, e le tue mani restano
      un momento a mezz'aria senza sapere dove posarsi.

      Sopra le vostre teste il campanello della porta suona due volte, la
      seconda in ritardo. Dei passi pesanti attraversano la bottega e si
      fermano davanti alla porta della cantina. «Rilla?» chiama la voce di
      Oddo Tamberlo.
    opzioni:
      - testo: "Scostarla con garbo e cercare un topo vero"
        descrizione: "Le togli le braccia dal collo senza farla sentire stupida, e intanto fai quello che sei venuto a fare."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Un topo, alla fine
          testo: |
            Le sciogli le braccia dal collo piano e le dici a bassa voce che è
            bellissima e che suo padre è sulle scale. Rilla diventa rossa fino
            alle orecchie e si riallaccia il bustino voltata verso il muro. Tu sposti il barile in fondo, e dietro c'è
            davvero un topo grigio e grasso, che ti scappa fra gli stivali e
            finisce sotto il tacco.

            Oddo scende con la lampada e trova sua figlia che regge la
            lanterna, e te con il topo per la coda. Si liscia i baffi. «Uno
            solo? Io ne sentivo a dozzine» dice, e ti dà una manata sulla
            spalla. Dietro di lui Rilla ti fa la linguaccia.
          imposta: { topi: 1 }
          pe: { empatia: 3 }
        fallimento:
          titolo: Francamente
          testo: |
            Le togli le braccia dal collo con troppa fretta. Rilla resta
            immobile, poi si stringe i lacci del bustino sul petto.
            «Francamente potevi dirlo prima di scendere» dice, a voce troppo
            alta. La porta si apre, e Oddo scende i gradini due alla volta con
            la lampada in mano. Guarda il bustino di sua figlia, e poi guarda te.

            Nessuno alza le mani. Oddo ti accompagna su per le scale e fino
            alla porta della strada senza dire una parola, e sulla soglia se ne
            ricorda qualcuna. «Da me non compri più nemmeno un chiodo» dice, e
            ti chiude la porta alle spalle.
          imposta: { topi: 2 }
      - testo: "Nascondersi in un armadio"
        descrizione: "Gli armadi in fondo sono abbastanza grandi per una persona, se la persona trattiene il fiato."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Odore di canfora
          testo: |
            Ti infili nell'armadio di sinistra fra grembiuli vecchi e cappotti
            che sanno di canfora, e Rilla ti chiude dentro con un colpo d'anca.
            Dalle fessure vedi scendere la lampada di Oddo. Rilla gli racconta
            che stava contando i barili per Elsa, che li vuole sul registro
            entro domattina, e Oddo brontola che in questa casa si contano i
            barili e non le ore di sonno. Poi risale le scale, e lo senti borbottare fino al bancone.

            Quando ti riapre, Rilla ride con una mano sulla bocca. Esci dalla
            porta del cortile con un grembiule ancora appeso alla spalla, e
            nessuno ti vede.
          imposta: { topi: 1 }
          pe: { furtivita: 3 }
        fallimento:
          titolo: Le scope
          testo: |
            L'armadio di sinistra è pieno di scope. Ne tieni ferme due con il
            gomito, ma la terza ti scivola e batte contro l'anta proprio quando
            Oddo arriva in fondo alle scale. Lui apre l'armadio con una mano
            sola e ti trova lì dentro con una scopa in braccio, mentre alle sue
            spalle sua figlia si allaccia il bustino.

            Oddo diventa rosso dal collo alla fronte e per un po' respira
            soltanto. Poi ti toglie la scopa di mano e ti indica le scale. Sulla
            porta della strada ti dice che all'Emporio, per te, non c'è più
            niente da comprare.
          imposta: { topi: 2 }
      - testo: "Spiegare tutto a Oddo"
        descrizione: "Quando scende, gli racconti dei topi e della paura di sua figlia. Detto bene, è perfino vero."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Media }
        successo:
          titolo: Cinque minuti
          testo: |
            Oddo arriva in fondo alle scale con la lampada alzata, e Rilla ha
            appena fatto in tempo a riallacciarsi il bustino. Gli parli prima che
            apra bocca. Gli racconti del topo grande quanto mezzo orco e di sua
            figlia che non dormiva più dalla paura, e intanto ti metti fra lui e
            la brandina.

            Oddo vi guarda a lungo tutti e due. Gli ci vogliono cinque minuti
            buoni per diventare rosso e poi tornare del suo colore. «Le trappole
            le mettevo io, una volta» dice alla fine. «Mi distraggo una
            settimana e guarda che succede.» Ti chiede di passare domani a
            sistemarle, e di salire per primo.
          imposta: { topi: 1 }
          pe: { persuasione: 3 }
        fallimento:
          titolo: Le nocche
          testo: |
            Oddo ti ascolta fino a metà, poi vede il bustino slacciato di sua
            figlia e smette di ascoltare. Ti viene addosso con tutto il peso.
            Pari il primo pugno con l'avambraccio e il secondo con la spalla, e
            lo spingi contro i barili per tenerlo fermo senza colpirlo. Due
            barili rotolano sul pavimento e lasciano una scia di sale grosso.

            Quando si calma ha il fiato corto e le nocche sbucciate, e tu hai
            un livido che domani sarà viola. «Fuori» dice. «All'Emporio non ti
            voglio più vedere.» In un angolo Rilla piange, senza farsi sentire.
          imposta: { topi: 2 }
          effetti: { ferite: 0.5 }
      - testo: "Ascoltare i passi sulle scale"
        descrizione: "Un uomo grosso che scende una scala stretta fa rumore. Se conti i gradini sai quanto tempo ti resta."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: A mani vuote
          testo: |
            Conti i passi sopra di te. Oddo si ferma a posare qualcosa sul
            bancone, poi apre la porta e cerca il primo gradino al buio. Hai il
            tempo di sciogliere le braccia di Rilla, e lei si riallaccia il
            bustino con le dita che le tremano di rabbia.

            Sali per primo e incontri Oddo a metà scala, con la lampada in
            mano. Gli dici che laggiù hai trovato soltanto barili in ordine, e
            che tornerai con le trappole. Lui annuisce e si fa da parte. Rilla
            sale per ultima e non ti saluta.
          imposta: { topi: 1 }
          pe: { percezione: 2 }
        fallimento:
          titolo: La lampada
          testo: |
            I passi li senti troppo tardi. Quando ti volti Oddo è già in fondo
            alle scale, con la lampada alta sopra la testa e la luce piena su
            sua figlia, che si stringe i lacci del bustino sul petto. Per un momento
            nessuno si muove.

            Poi Oddo posa la lampada su un barile senza fretta e ti indica le
            scale. Non urla e non ti tocca. Sulla porta della strada ti dice
            che all'Emporio non sei più il benvenuto, e che sua figlia la
            conosce da ventidue anni.
          imposta: { topi: 2 }
      - testo: "Farti strada di forza"
        descrizione: "La scala è stretta e Oddo è grosso. Basta una spallata."
        esito:
          titolo: Sulle scale
          testo: |
            Ti stacchi da Rilla e sali le scale di corsa. A metà incontri Oddo
            che scende con la lampada, e non c'è posto per tutti e due. Gli dai
            una spallata. Lui perde l'appoggio, scivola giù per gli ultimi
            gradini e cade sul polso con un rumore che senti nei denti, mentre
            la lampada si spegne sul pavimento e Rilla urla.

            Esci in strada con il cuore in gola. Dietro di te Berta chiama
            aiuto, e da tutta la via scendono i vicini con le candele. Il giorno dopo
            mezza Città Bassa sa che Oddo Tamberlo ha il polso fasciato, e sa
            anche per colpa di chi.
          imposta: { topi: 3 }
          effetti: { scandalo: 2 }
      - testo: "Chiamare Oddo per nome prima che scenda"
        descrizione: "Da ragazzo compravi da lui i chiodi a peso per le fucine dove lavoravi a giornata. Oddo si ricorda di tutti quelli che gli hanno rubato un chiodo."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: I chiodi a peso
          testo: |
            Sciogli le braccia di Rilla in fretta e alzi la voce verso la scala
            prima che la porta si apra. «Oddo, sono quello dei chiodi a peso, per
            le fucine. Qui sotto di topi ce n'è uno solo, e lo sto cercando.» I
            passi sopra di te si fermano, e Rilla si riallaccia il bustino
            voltata verso il muro, rossa fino al collo.

            Oddo scende con la lampada e ti guarda in faccia a lungo. «Quello
            delle fucine» dice, lisciandosi i baffi. «Mi rubavi un chiodo ogni
            sacco, e io lo segnavo sullo stipite.» Poi guarda sua figlia, che
            regge la lanterna come se non avesse fatto altro tutta la sera, e
            decide di non vedere niente. Ti chiede di passare domani a mettere
            le trappole.
          imposta: { topi: 1 }
          pe: { conoscenze-della-strada: 2 }

  # ------------------------------------------------------------ la pace con Oddo
  - id: fare-pace-con-oddo
    immagine: personaggi/oddo-tamberlo
    titolo: Fare pace con Oddo
    sommario: "Davanti all'Emporio un garzone scarica sacchi di sale, e Oddo Tamberlo li conta. Quando ti vede smette di contare."
    luogo: Davanti all'Emporio Tamberlo
    area: citta-bassa
    requisiti: [topi >= 2, pista.dama-argento >= 3]
    testo: |
      Davanti all'Emporio Tamberlo c'è un carro fermo, con il mulo che dorme
      in piedi fra le stanghe. Un garzone scarica sacchi di sale grosso, e Oddo
      li conta seduto sulla panca accanto alla porta, con il panciotto
      sbottonato e un pezzo di gesso in mano per segnarli sullo stipite. Le
      zappe sono appese fuori come sempre, e una ha il manico rotto da così
      tanto tempo che nessuno lo nota più.

      Quando ti vede smette di contare. Il garzone posa un sacco e aspetta,
      e il mulo apre un occhio. Dentro la bottega Elsa fa finta di scrivere
      sul registro con la penna asciutta. Dalla finestra della cucina, sul
      retro, esce odore di mele cotte, e un braccio infarinato fino al gomito
      sposta la tendina di un palmo e la lascia ricadere.

      Oddo si alza, e ti accorgi che stai tenendo le mani bene in vista. «Se
      cerchi qualcosa, il banco di Grusk all'Orlo è aperto fino a sera» dice,
      e segna un altro sacco sullo stipite anche se il garzone non l'ha
      ancora scaricato.
    opzioni:
      # --- Berta
      - testo: "Passare dalla cucina e parlare con Berta"
        descrizione: "Il braccio infarinato alla finestra è di Berta Tamberlo. In casa Tamberlo le paci si fanno in cucina."
        immagine: personaggi/berta-tamberlo
        requisiti: [topi == 2]
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: Io impasto
          testo: |
            Berta ti fa entrare dal cortile e non smette di impastare mentre
            parli. Ti ascolta fino in fondo con le braccia nella pasta, poi si
            pulisce le mani sul grembiule. «Mio marito grida e io impasto» dice.
            «Rilla l'ho fatta io, e so com'è fatta.»

            Esce con una fetta di torta su un piatto e la porta a Oddo, e per
            cinque minuti lo senti brontolare attraverso la finestra. Poi Oddo
            entra in cucina con la bocca piena e ti stringe la mano, e la sua
            ha ancora la farina del piatto.
          imposta: { topi: 1 }
          pe: { empatia: 2 }
        fallimento:
          titolo: Fra qualche giorno
          testo: |
            Berta ti ascolta senza smettere di impastare, e alla fine scuote la
            testa. «È presto» dice. «Mio marito ha la testa dura come la crosta
            del pane vecchio. Torna fra qualche giorno, e intanto stagli
            lontano.» Ti accompagna alla porta del cortile e ti mette in mano un
            biscotto speziato, che ti mangi per strada.
      - testo: "Passare dalla cucina e parlare con Berta"
        descrizione: "Il braccio infarinato alla finestra è di Berta Tamberlo. In casa Tamberlo le paci si fanno in cucina."
        immagine: personaggi/berta-tamberlo
        requisiti: [topi == 3]
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: Il polso guarisce
          testo: |
            Berta ti fa entrare dal cortile e non smette di impastare mentre
            parli. Quando hai finito si pulisce le mani sul grembiule. «Il polso
            guarisce» dice. «Le chiacchiere ci mettono di più, ma a quelle ci
            penso io.» Il giorno dopo, al forno comune, racconta alle vicine
            una versione dei fatti in cui la scala è ripida e Oddo ha bevuto un
            bicchiere di troppo.

            La sera Oddo ti stringe la mano con quella sana, guardando da
            un'altra parte.
          imposta: { topi: 1 }
          effetti: { scandalo: -1 }
          pe: { empatia: 2 }
        fallimento:
          titolo: Fra qualche giorno
          testo: |
            Berta ti ascolta senza smettere di impastare, e alla fine scuote la
            testa. «Ha il polso fasciato e la testa dura» dice. «Torna quando
            gli avranno tolto le bende, e intanto stagli lontano.» Ti
            accompagna alla porta del cortile e ti mette in mano un biscotto
            speziato, che ti mangi per strada.
      # --- a viso aperto
      - testo: "Chiedergli scusa a viso aperto"
        descrizione: "Senza scuse e senza nominare Rilla. La colpa te la prendi tutta tu."
        requisiti: [topi == 2]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Interferenza
          testo: |
            Gli chiedi scusa davanti al garzone e al mulo, e ti prendi tutta la
            colpa senza nominare sua figlia. Oddo ti ascolta con il gesso in
            mano. Quando hai finito lo rigira fra le dita un paio di volte.

            «Io faccio il mio mestiere e le mie figlie, e il resto è
            interferenza» dice, e ti allunga la mano. «Tu sei stato
            un'interferenza, però hai chiesto scusa in mezzo alla strada, e qui
            non lo fa nessuno. Dentro c'è la torta.»
          imposta: { topi: 1 }
          pe: { galateo: 2 }
        fallimento:
          titolo: Il gesso
          testo: |
            Oddo ti lascia parlare, poi si gira verso lo stipite e segna un
            altro sacco con il gesso, premendo tanto che il gesso si spezza.
            Il garzone riprende a scaricare. Resti lì ancora un momento, e poi
            te ne vai, con lo sguardo di Elsa che ti segue dalla vetrina fino
            all'angolo.
      - testo: "Chiedergli scusa a viso aperto"
        descrizione: "Senza scuse e senza nominare Rilla. La colpa te la prendi tutta tu."
        requisiti: [topi == 3]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: La mano sana
          testo: |
            Gli chiedi scusa in mezzo alla strada, a voce abbastanza alta perché
            ti sentano i vicini alle finestre, e ti prendi tutta la colpa senza
            nominare sua figlia. Oddo si guarda il polso fasciato e ci pensa a
            lungo.

            «Mi hai buttato giù per le scale di casa mia» dice. «Però sei
            venuto a dirmelo davanti a tutti, e questo la Città Bassa lo
            racconterà quanto il resto.» Ti stringe la mano con quella sana.
            Alla finestra di fronte una vicina chiude le imposte, delusa.
          imposta: { topi: 1 }
          effetti: { scandalo: -1 }
          pe: { galateo: 2 }
        fallimento:
          titolo: Davanti a tutti
          testo: |
            Oddo ti lascia parlare, poi alza il polso fasciato perché lo vedano
            bene dalle finestre. «Scuse» dice, a voce alta. «Me le porti in
            strada, così le sentono tutti, come hanno sentito me.» Il garzone
            riprende a scaricare, e tu te ne vai con mezza via che ti guarda.
          effetti: { scandalo: 0.5 }
      # --- le monete
      - testo: "Pagargli il danno"
        descrizione: "Oddo Tamberlo conta tutto, e un torto si può contare come il resto."
        requisiti: [topi == 2, monete >= 20]
        esito:
          titolo: Il resto due volte
          testo: |
            Gli metti in mano le monete e gli dici che sono per il disturbo.
            Oddo le conta una volta, poi le conta di nuovo, e alla seconda volta
            ti guarda negli occhi a ogni moneta.

            «Il disturbo non si paga» dice, e le mette in tasca lo stesso. Poi
            si sposta dalla porta per farti passare.
          imposta: { topi: 1 }
          effetti: { monete: -20 }
      - testo: "Pagargli il cerusico e il danno"
        descrizione: "Un polso rotto costa caro, e un uomo che non può scaricare i suoi sacchi perde ogni giorno di lavoro."
        requisiti: [topi == 3, monete >= 40]
        esito:
          titolo: Le bende pagate
          testo: |
            Gli metti in mano una manciata generosa di monete per il cerusico e per il garzone
            che gli scarica i sacchi finché il polso non guarisce. Oddo le conta
            due volte con la mano sana, appoggiando ogni moneta sulla panca.

            «Le chiacchiere non le paghi con le monete» dice. Però le mette in
            tasca, e la sera al Grifone di Ferro racconta che quel tale ha
            pagato fino all'ultima benda, e lo racconta tre volte.
          imposta: { topi: 1 }
          effetti: { monete: -40, scandalo: -1 }
      # --- il lavoro
      - testo: "Lavorare in bottega senza paga"
        descrizione: "Un giorno intero a scaricare sacchi e a spazzare la bottega, e a farti guardare da Oddo."
        requisiti: [topi == 2]
        costo: 3
        esito:
          titolo: Sale grosso
          testo: |
            Scarichi il carro al posto del garzone, poi spazzi la bottega e
            sistemi le zappe appese fuori, comprese quelle col manico rotto.
            Oddo ti guarda tutto il giorno dalla panca senza dirti niente, e
            ogni tanto segna qualcosa sullo stipite che non sono sacchi.

            Al tramonto ti porta una fetta di torta di Berta, ancora tiepida.
            «Lavori storto ma lavori» dice, e si siede a guardarti mangiare.
          imposta: { topi: 1 }
          pe: { atletica: 2 }
      - testo: "Lavorare in bottega senza paga"
        descrizione: "Finché il polso non guarisce, i sacchi di Oddo li scarichi tu."
        requisiti: [topi == 3]
        costo: 3
        esito:
          titolo: Il garzone
          testo: |
            Per una settimana scarichi i carri al posto suo e spazzi la bottega,
            e la Città Bassa ti vede farlo. Oddo ti guarda dalla panca con il
            polso al collo e ti corregge su tutto, da come si impila un sacco a
            come si saluta un cliente.

            L'ultimo giorno ti porta una fetta di torta di Berta e si siede
            accanto a te sullo scalino. «Lavori storto ma lavori» dice. Alle
            finestre di fronte le vicine hanno smesso di guardare.
          imposta: { topi: 1 }
          effetti: { scandalo: -1 }
          pe: { atletica: 2 }

  # ------------------------------------------------------------ la torta di Berta
  - id: una-fetta-di-torta
    presso: emporio-tamberlo
    immagine: personaggi/berta-tamberlo
    titolo: Una fetta di torta
    sommario: "La torta sotto la campana di vetro non è in vendita. Quella buona sta nella cucina sul retro e costa pochi spiccioli."
    luogo: L'Emporio Tamberlo, la cucina sul retro
    area: citta-bassa
    ripetibile: true
    testo: |
      Sul bancone dell'Emporio la torta sotto la campana di vetro è sempre la
      stessa, e chi la chiede si sente rispondere che non è in vendita. Quella
      buona sta in cucina, sul retro, dove Berta Tamberlo sforna dall'alba con
      le maniche arrotolate e il grembiule bianco di farina fino al collo.

      Per pochi spiccioli ti taglia una fetta di torta di mele ancora tiepida, te
      la mette su un piatto sbeccato e ti fa sedere sullo sgabello accanto al
      forno, perché in bottega Oddo le briciole non le vuole. Il forno ti
      scalda la schiena, e le spalle ti si sciolgono un poco alla volta, senza
      che tu glielo chieda. Mentre mangi Berta continua a impastare e a parlare, e
      non sembra aspettarsi risposte.
    opzioni:
      - testo: "Mangiare la torta e ascoltare Berta"
        descrizione: "Pochi spiccioli per una fetta e per mezz'ora di chiacchiere in cui non devi dire niente."
        requisiti: [topi == 0, monete >= 3]
        esito:
          titolo: Torta di mele
          testo: |
            Berta ti racconta che Elsa tiene i conti meglio di suo padre e che
            Rilla le ha già rubato tre volte il grembiule rosso. Oddo le
            porta i tronchetti per il forno ogni due giorni, e non dimentica
            mai di lamentarsene. «Mio marito grida, le mie figlie litigano»
            dice, girando la pasta. «Io impasto.»

            La torta sa di cannella. Quando ti alzi hai le spalle più leggere, e
            briciole sul petto che Berta ti spazzola via con il dorso della mano.
          effetti: { monete: -3, tormento: -0.5 }
      - testo: "Mangiare la torta e ascoltare Berta"
        descrizione: "Pochi spiccioli per una fetta e per mezz'ora di chiacchiere in cui non devi dire niente."
        requisiti: [topi == 1, monete >= 3]
        esito:
          titolo: Il nastro verde
          testo: |
            Dalla porta della cucina si vede un pezzo di bottega, e dietro il
            bancone c'è Rilla. Ti guarda, poi si mette a riordinare una scatola
            di nastri che era già in ordine, e da lì non alza più gli occhi.
            Berta segue il tuo sguardo, ma non dice niente e taglia un'altra
            fetta per sé.

            Intanto ti racconta che Oddo le porta i tronchetti per il forno ogni
            due giorni, e non dimentica mai di lamentarsene. La torta sa di
            cannella, e quando ti alzi hai le spalle più leggere.
          effetti: { monete: -3, tormento: -0.5 }
      - testo: "Tornare in bottega"
        costo: 0
        esito:
          testo: "Ringrazi Berta e torni in bottega. Il profumo delle mele ti segue fino alla porta della strada."
