# Topi in cantina (verbale, righe 2104–2209): la carta di Rilla Tamberlo, la cantina dell'Emporio, la pace con
# Oddo e la torta di Berta. Quality: topi (1 tutto liscio, 2 Oddo non ti serve più, 3 Oddo l'ha raccontato a
# mezza città). Con topi >= 2 il luogo emporio-tamberlo sparisce finché non fai pace.
storylet:
  # ------------------------------------------------------------ la carta
  - id: rilla-e-i-topi
    immagine: personaggi/rilla-tamberlo
    titolo: Topi in cantina
    sommario: "A sera l'Emporio Tamberlo è vuoto, e dietro il bancone Rilla Tamberlo alza gli occhi dal romanzo quando entri."
    luogo: L'Emporio Tamberlo, di sera
    tipo: carta
    area: citta-bassa
    requisiti: [topi == 0, pista.dama-argento >= 3]
    testo: |
      È quasi sera quando entri all'Emporio Tamberlo, e il campanello suona
      due volte, la seconda in ritardo. Dietro il bancone c'è soltanto Rilla
      Tamberlo, la figlia minore di Oddo, con un nastro verde al polso e un
      romanzo sulle ginocchia. Ti guarda dagli stivali in su. «Sì, direi che
      puoi fare egregiamente al caso mio.»

      Da una settimana suo padre pensa soltanto a sua sorella Elsa, e in
      cantina sono arrivati i topi, grandi quanto mezzo orco a sentir lei.

      {ingannare Media} Il romanzo è aperto sempre alla stessa pagina, e
      questa scena l'ha provata davanti allo specchio.
    opzioni:
      - testo: "Chiedere di Elsa"
        descrizione: "Un padre che da una settimana si dimentica dei topi deve avere un buon motivo."
        immagine: personaggi/elsa-tamberlo
        requisiti: [rennick < 2]
        costo: 0
        esito:
          titolo: Scintille
          testo: |
            «Mia sorella Elsa fa scintille con Rennick Dole, quello della
            Segheria.» Rilla arriccia il naso. «Francamente non so che cosa ci
            trovi, è un animale tutto pelo e muscoli. Dalla sera del Festival però
            non si fa più vedere, e alla Segheria dicono che è partito per
            Laresh.» Elsa non ci crede, e suo padre gira per casa come un orso e
            dei topi si è dimenticato.
      - testo: "Chiedere di Elsa"
        descrizione: "Un padre che da una settimana si dimentica dei topi deve avere un buon motivo."
        immagine: personaggi/elsa-tamberlo
        requisiti: [rennick == 2]
        costo: 0
        esito:
          titolo: Attraverso il muro
          testo: |
            «Mia sorella Elsa piange da una settimana» dice Rilla, rigirandosi il
            nastro verde intorno al polso. «Rennick Dole è sparito, e alla
            Segheria dicono tutti con le stesse parole che è a Laresh per una
            trattativa. Francamente non l'ho mai sopportato, però sentirla
            piangere attraverso il muro è un'altra faccenda.»

            Tu sai dov'è andato Rennick Dole, e chi ce l'ha mandato, e per un po'
            guardi le assi del pavimento.
      - testo: "Prometterle di liberare la cantina"
        descrizione: "È bella e ti guarda come un eroe, e bisogna tenere la testa a posto, se ci si riesce."
        prova: { attributo: mentale, abilita: [resilienza, empatia], difficolta: Media }
        successo:
          titolo: La testa a posto
          testo: |
            Le dici che ci pensi tu, e Rilla batte le mani. «Benissimo! Possiamo
            scendere anche adesso.» L'idea di fare l'eroe davanti a lei ti scalda
            dal colletto in giù, ma ti resta abbastanza lucidità per notare che il
            mazzo di chiavi della cantina era già sul bancone, accanto al romanzo,
            prima ancora che tu entrassi.
          segue: la-cantina-dei-tamberlo
        fallimento:
          titolo: Con tutte le scarpe
          testo: |
            Le dici che ci pensi tu, e Rilla batte le mani. «Benissimo! Possiamo
            scendere anche adesso.» Mentre la segui dietro il bancone i topi ti
            sembrano un dettaglio, e pensi soltanto a come ti ringrazierà, mentre
            lei cerca la chiave giusta in un mazzo che ne ha appena tre.
          segue: la-cantina-dei-tamberlo
          effetti: { tormento: 0.5 }
      - testo: "Rifiutare con garbo"
        descrizione: "I topi di Oddo Tamberlo può cacciarli Oddo Tamberlo."
        esito:
          titolo: Torni domattina
          testo: |
            Le dici che stasera non puoi. Rilla alza le spalle, e la cortesia
            della bottega le torna sulla faccia come una tenda che si chiude.
            «Allora buonasera. Torni domattina, c'è mio padre.» Riapre il romanzo
            alla pagina sbagliata, e il campanello ti accompagna fuori con il
            solito ritardo.
      - testo: "Rispondere con il baciamano dei salotti"
        descrizione: "La scena l'hai già vista nei salotti dei Quartieri Alti, e basta darle la battuta che aspetta."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il baciamano
          testo: |
            Le prendi la mano sopra il bancone e la porti a un dito dalle labbra,
            senza toccarla, come con le padrone di casa che hanno una figlia da
            maritare. Rilla resta un momento a bocca socchiusa, perché fra i sacchi
            di chiodi un baciamano è una cosa rara, poi ride. «Allora scendiamo»
            dice, e prende dal bancone il mazzo di chiavi, che era già lì.
          pe: { galateo: 2 }
          segue: la-cantina-dei-tamberlo
      - testo: "Chiederle che rumore fanno i topi"
        descrizione: "Al Circolo una bestia si riconosce prima dal rumore, e un topo grande quanto mezzo orco ne farà."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Un rumore da topo
          testo: |
            Le chiedi se di notte li sente rosicchiare. Rilla ci pensa un momento di troppo, poi dice che
            squittiscono tanto da sentirli fino in camera, e dalla tua faccia capisce che un topo così
            non l'hai mai incontrato. Arrossisce, prende le chiavi dal bancone e ti dice di seguirla, che
            tanto lo vedrai da te.
          pe: { natura: 2 }
          segue: la-cantina-dei-tamberlo

  # ------------------------------------------------------------ la cantina
  - id: la-cantina-dei-tamberlo
    immagine: ambientazione/emporio-generale
    titolo: La cantina dei Tamberlo
    tipo: seguito
    luogo: L'Emporio Tamberlo, la cantina
    area: citta-bassa
    requisiti: [topi == 0]
    testo: |
      Rilla ti fa scendere per primo, con la lanterna alzata.

      La cantina è un unico spiazzo basso, con due grandi armadi contro il
      muro di fondo e barili e cassoni impilati in perfetto ordine, ognuno
      con un cartellino in una grafia minuta che non è quella di Rilla. Al
      centro c'è una brandina, con la coperta piegata in quattro. Dietro il
      barile più vicino trovi soltanto polvere.

      {natura Facile} Una cantina con i topi puzza di piscio e ha i sacchi
      rosicchiati, e questa invece odora di sapone.

      Quando ti rialzi Rilla ti sta davanti con il bustino slacciato. Ti
      mette le braccia al collo e ti bacia, e le tue mani restano a
      mezz'aria.

      Sopra le vostre teste il campanello suona due volte, e dei passi
      pesanti attraversano la bottega e si fermano davanti alla porta della
      cantina. «Rilla?» chiama la voce di Oddo Tamberlo.
    opzioni:
      - testo: "Scostarla con garbo e cercare un topo vero"
        descrizione: "Le togli le braccia dal collo senza farla sentire stupida, e fai quello che sei venuto a fare."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Un topo, alla fine
          testo: |
            Le sciogli le braccia dal collo e le dici piano che suo padre è sulle
            scale. Mentre Rilla si riallaccia il bustino voltata verso il muro,
            sposti il barile in fondo, dove c'è davvero un topo grigio che ti
            finisce sotto il tacco. Oddo scende e ti trova con il topo per la
            coda. «Uno solo? Io ne sentivo a dozzine» dice, e ti dà una manata
            sulla spalla.
          imposta: { topi: 1 }
          pe: { empatia: 3 }
        fallimento:
          titolo: Francamente
          testo: |
            Le togli le braccia dal collo con troppa fretta. «Francamente potevi
            dirlo prima di scendere» dice Rilla troppo forte, e Oddo scende i
            gradini due alla volta. Guarda il bustino di sua figlia e poi guarda
            te. Ti accompagna alla porta senza una parola. «Da me non compri più
            nemmeno un chiodo» dice sulla soglia, e sbatte la porta così forte che
            il campanello suona una volta sola.
          imposta: { topi: 2 }
          effetti: { scandalo: 0.5 }
      - testo: "Nascondersi in un armadio"
        descrizione: "Gli armadi in fondo sono abbastanza grandi per una persona, se la persona si fa piccola."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Odore di canfora
          testo: |
            Ti infili nell'armadio di sinistra fra grembiuli vecchi e cappotti che
            sanno di canfora, e Rilla ti chiude dentro con un colpo d'anca. Dalle
            fessure vedi scendere la lampada di Oddo. Rilla gli racconta che stava
            contando i barili per Elsa, e Oddo brontola qualcosa sulle ore di
            sonno prima di risalire. Esci dalla porta del cortile con un grembiule
            ancora appeso alla spalla.
          imposta: { topi: 1 }
          pe: { furtivita: 3 }
        fallimento:
          titolo: Le scope
          testo: |
            L'armadio di sinistra è pieno di scope, e la terza ti scivola e batte
            contro l'anta proprio quando Oddo arriva in fondo alle scale. Lui apre
            e ti trova abbracciato a una scopa, mentre alle sue spalle sua figlia
            si allaccia il bustino. Diventa rosso fino alla fronte e ti indica le
            scale, e sulla porta ti dice che all'Emporio, per te, non c'è più
            niente da comprare.
          imposta: { topi: 2 }
          effetti: { sospetto: 0.5 }
      - testo: "Spiegare tutto a Oddo"
        descrizione: "Gli racconti dei topi e della paura di sua figlia, che detto bene è perfino vero."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Media }
        successo:
          titolo: Cinque minuti
          testo: |
            Rilla si è appena riallacciata il bustino quando Oddo arriva in fondo
            alle scale. Gli parli prima che apra bocca, del topo grande quanto mezzo
            orco e di sua figlia che non dormiva più dalla paura. «Le trappole le
            mettevo io, una volta» dice alla fine. «Mi distraggo una settimana e
            guarda che succede.» Ti chiede di passare domani a sistemarle, e di
            salire per primo.
          imposta: { topi: 1 }
          pe: { persuasione: 3 }
        fallimento:
          titolo: Le nocche
          testo: |
            Oddo ti ascolta fino a metà, poi vede il bustino slacciato di sua figlia e ti
            viene addosso con tutta la stazza di un uomo che conta sacchi da una vita. Lo
            tieni contro i barili senza colpirlo, mentre due barili rotolano spargendo sale
            grosso. Quando si calma ha le nocche sbucciate, e tu un livido che domani sarà
            viola. «Fuori di qui, all'Emporio non ti voglio più vedere.»
          imposta: { topi: 2 }
          effetti: { ferite: 0.5 }
      - testo: "Ascoltare i passi sulle scale"
        descrizione: "Un uomo grosso su una scala stretta fa rumore, e contando i gradini sai quanto tempo ti resta."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: A mani vuote
          testo: |
            Conti i passi sopra di te. Oddo cerca il primo gradino al buio, e tu
            hai il tempo di sciogliere le braccia di Rilla mentre lei si
            riallaccia il bustino con le dita che tremano di rabbia. Incontri Oddo
            a metà scala e gli dici che laggiù ci sono soltanto barili, e che
            tornerai con le trappole. Rilla sale per ultima e non ti saluta.
          imposta: { topi: 1 }
          pe: { percezione: 2 }
        fallimento:
          titolo: La lampada
          testo: |
            I passi li senti troppo tardi. Oddo è già in fondo alle scale, con la
            lampada alta sopra la testa e la luce piena su sua figlia che si
            stringe i lacci del bustino. Posa la lampada su un barile senza fretta
            e ti indica le scale, e sulla porta ti dice che all'Emporio non sei
            più il benvenuto, e che sua figlia la conosce da ventidue anni.
          imposta: { topi: 2 }
          effetti: { scandalo: 0.5 }
      - testo: "Farti strada di forza"
        descrizione: "La scala è stretta e Oddo è grosso, e basta una spallata."
        esito:
          titolo: Sulle scale
          testo: |
            Ti stacchi da Rilla e sali di corsa, e a metà scala incontri Oddo con
            la lampada. Gli dai una spallata, e lui scivola giù per gli ultimi
            gradini e cade sul polso, mentre Rilla urla. Esci in strada con Berta
            che chiama aiuto alle tue spalle, e il giorno dopo mezza Città Bassa
            sa che Oddo Tamberlo ha il polso fasciato, e per colpa di chi.
          imposta: { topi: 3 }
          effetti: { scandalo: 2 }
      - testo: "Chiamare Oddo per nome prima che scenda"
        descrizione: "Da ragazzo compravi da Oddo i chiodi a peso per le fucine, e lui si ricorda chi gliene rubava."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: I chiodi a peso
          testo: |
            Sciogli le braccia di Rilla e alzi la voce verso la scala. «Oddo, sono
            quello dei chiodi a peso, per le fucine!» Oddo scende con la lampada.
            «Mi rubavi un chiodo ogni sacco, e io lo segnavo sullo stipite.» Poi
            guarda sua figlia, che regge la lanterna come se non avesse fatto
            altro tutta la sera, e ti chiede di passare domani a mettere le
            trappole.
          imposta: { topi: 1 }
          pe: { conoscenze-della-strada: 2 }
      - testo: "Restare immobile dietro gli armadi"
        descrizione: "A Ghoran hai imparato a stare fermo nel buio mentre i sorveglianti passano con la lampada."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: Fra l'armadio e il muro
          testo: |
            Ti infili di fianco fra l'armadio di destra e il muro e smetti di
            esistere, con le spalle curve come a Ghoran quando passava la lampada
            dei sorveglianti. Oddo scende e trova sua figlia che conta i barili
            per Elsa, e la luce ti passa a un palmo dalla faccia senza fermarsi.
            Quando Rilla ti cerca non ti trova, e si spaventa più di quando ha
            sentito suo padre.
          imposta: { topi: 1 }
          pe: { resistenza: 3 }
        fallimento:
          titolo: Il crampo
          testo: |
            Resti fermo fra l'armadio e il muro finché un crampo non ti prende il
            polpaccio e la gamba scalcia contro l'anta. Oddo alza la lampada e ti
            trova lì, mentre sua figlia si allaccia il bustino. Diventa rosso dal
            collo alla fronte, e sulla porta della strada ti dice che all'Emporio,
            per te, non c'è più niente da comprare.
          imposta: { topi: 2 }
      - testo: "Parlare a Oddo di sale e di barili"
        descrizione: "Un bottegaio si calma solo se l'estraneo in cantina parla la sua lingua, e sui Ponti la parli ogni giorno."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [politica-ed-economia, persuasione], difficolta: Media }
        successo:
          titolo: Il cartellino
          testo: |
            Quando Oddo arriva in fondo alle scale sei già chino su un barile, e
            gli chiedi da chi prende il sale grosso e quanto gli costa dopo la
            razzia, mentre Rilla si riallaccia il bustino alle tue spalle. La
            domanda gli piace troppo per non rispondere, e dopo dieci minuti di
            prezzi ti chiede di passare domani a mettere le trappole e a dargli un
            parere sul fornitore.
          imposta: { topi: 1 }
          pe: { politica-ed-economia: 3 }
        fallimento:
          titolo: Le nocche
          testo: |
            Gli chiedi del sale grosso, e Oddo per un momento ci casca, poi vede
            il bustino slacciato di sua figlia e ti viene addosso. Lo tieni contro
            i barili senza colpirlo finché non si calma. «Fuori» dice, con le
            nocche sbucciate. «All'Emporio non ti voglio più vedere.»
          imposta: { topi: 2 }
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ la pace con Oddo
  - id: fare-pace-con-oddo
    immagine: personaggi/oddo-tamberlo
    titolo: Fare pace con Oddo
    sommario: "Davanti all'Emporio Oddo Tamberlo conta i sacchi di sale che scarica un garzone, e quando ti vede smette."
    luogo: Davanti all'Emporio Tamberlo
    area: citta-bassa
    requisiti: [topi >= 2, pista.dama-argento >= 3]
    testo: |
      Davanti all'Emporio Tamberlo c'è un carro fermo, con il mulo che dorme in
      piedi fra le stanghe. Un garzone scarica sacchi di sale grosso, e Oddo li
      conta seduto sulla panca accanto alla porta, con un gesso in mano per
      segnarli sullo stipite, che a forza di tacche è più bianco che di legno.

      Quando ti vede smette di contare. Dentro la bottega Elsa fa finta di
      scrivere sul registro, e dalla finestra della cucina un braccio
      infarinato sposta la tendina di un palmo e la lascia ricadere.

      {origine fuggiasco-di-ghoran} Le mani in vista e gli occhi bassi te li
      hanno insegnati i sorveglianti di Ghoran, e il corpo li tira fuori da
      solo.

      Oddo si alza. «Se cerchi qualcosa, il banco di Grusk all'Orlo è aperto
      fino a sera» dice, e segna un altro sacco sullo stipite anche se il
      garzone non l'ha ancora scaricato.
    opzioni:
      # --- Berta
      - testo: "Passare dalla cucina e parlare con Berta"
        descrizione: "Il braccio infarinato alla finestra è di Berta, e in casa Tamberlo le paci si fanno in cucina."
        immagine: personaggi/berta-tamberlo
        requisiti: [topi == 2]
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: Io impasto
          testo: |
            Berta ti fa entrare dal cortile e ti ascolta con le braccia nella
            pasta. «Mio marito grida e io impasto» dice alla fine. «Rilla l'ho
            fatta io, e so com'è fatta.» Porta a Oddo una fetta di torta, e per
            cinque minuti lo senti brontolare attraverso la finestra sempre più
            piano, poi lui entra in cucina e ti stringe la mano, ancora sporca
            della farina del piatto.
          imposta: { topi: 1 }
          pe: { empatia: 2 }
        fallimento:
          titolo: Fra qualche giorno
          testo: |
            Berta ti ascolta senza smettere di impastare, poi scuote la testa. «È
            presto. Mio marito ha la testa dura come la crosta del pane vecchio,
            torna fra qualche giorno.» Ti accompagna alla porta del cortile con un
            biscotto speziato in mano, che ti mangi per strada in due morsi.
          effetti: { tormento: 0.5 }
      - testo: "Passare dalla cucina e parlare con Berta"
        descrizione: "Il braccio infarinato alla finestra è di Berta, e in casa Tamberlo le paci si fanno in cucina."
        immagine: personaggi/berta-tamberlo
        requisiti: [topi == 3]
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: Il polso guarisce
          testo: |
            Berta ti ascolta senza smettere di impastare, poi si pulisce le mani
            sul grembiule. «Il polso guarisce» dice. «Le chiacchiere ci mettono di
            più, ma a quelle ci penso io.» Il giorno dopo, al forno comune,
            racconta alle vicine una versione in cui la scala è ripida e Oddo ha
            bevuto un bicchiere di troppo, e la sera Oddo ti stringe la mano con
            quella sana.
          imposta: { topi: 1 }
          effetti: { scandalo: -1 }
          pe: { empatia: 2 }
        fallimento:
          titolo: Fra qualche giorno
          testo: |
            Berta ti ascolta senza smettere di impastare, poi scuote la testa. «Ha
            il polso fasciato e la testa dura. Torna quando gli avranno tolto le
            bende.» Ti accompagna alla porta del cortile con un biscotto speziato
            ancora caldo.
          effetti: { scandalo: 0.5 }
      # --- a viso aperto
      - testo: "Chiedergli scusa a viso aperto"
        descrizione: "Senza giustificarti e senza nominare Rilla, prendendoti tutta la colpa."
        requisiti: [topi == 2]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Interferenza
          testo: |
            Gli chiedi scusa davanti al garzone e al mulo, e ti prendi tutta la
            colpa senza nominare sua figlia. Oddo ti ascolta rigirando il gesso
            fra le dita. «Io faccio il mio mestiere e le mie figlie, e il resto è
            interferenza» dice, e ti allunga la mano. «Tu sei stato
            un'interferenza, però hai chiesto scusa in mezzo alla strada, e qui
            non lo fa nessuno. Dentro c'è la torta.»
          imposta: { topi: 1 }
          pe: { galateo: 2 }
        fallimento:
          titolo: Il gesso
          testo: |
            Oddo ti lascia parlare, poi segna un altro sacco sullo stipite
            premendo tanto che il gesso si spezza. Te ne vai con le scuse avanzate
            in bocca, e lo sguardo di Elsa ti segue dalla vetrina fino all'angolo.
          effetti: { scandalo: 0.5 }
      - testo: "Chiedergli scusa a viso aperto"
        descrizione: "Senza giustificarti e senza nominare Rilla, prendendoti tutta la colpa."
        requisiti: [topi == 3]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: La mano sana
          testo: |
            Gli chiedi scusa forte, perché ti sentano i vicini, e ti prendi tutta
            la colpa senza nominare sua figlia. Oddo si guarda il polso fasciato.
            «Mi hai buttato giù dalle scale di casa mia, eppure sei venuto a
            dirmelo davanti a tutti, e questo la Città Bassa lo racconterà quanto
            il resto.» Ti stringe la mano con quella sana, e alla finestra una
            vicina chiude le imposte, delusa.
          imposta: { topi: 1 }
          effetti: { scandalo: -1 }
          pe: { galateo: 2 }
        fallimento:
          titolo: Davanti a tutti
          testo: |
            Oddo alza il polso fasciato perché lo vedano bene dalle finestre.
            «Scuse» dice, a voce alta. «Me le porti in strada, così le sentono
            tutti, come hanno sentito me.» Te ne vai con mezza via che ti guarda e
            le orecchie che scottano.
          effetti: { scandalo: 1 }
      # --- le monete
      - testo: "Pagargli il danno"
        descrizione: "Oddo Tamberlo conta tutto, e un torto si può contare come il resto."
        requisiti: [topi == 2, monete >= 20]
        esito:
          titolo: Il resto due volte
          testo: |
            Gli metti in mano le monete per il disturbo. Oddo le conta due volte,
            e alla seconda ti guarda negli occhi a ogni moneta. «Il disturbo non
            si paga» dice, e le mette in tasca lo stesso, spostandosi dalla porta
            per farti passare.
          imposta: { topi: 1 }
          effetti: { monete: -20 }
      - testo: "Pagargli il cerusico e il danno"
        descrizione: "Un polso rotto costa caro, e un uomo che non può scaricare sacchi perde ogni giorno di lavoro."
        requisiti: [topi == 3, monete >= 40]
        esito:
          titolo: Le bende pagate
          testo: |
            Gli metti in mano una manciata generosa di monete per il cerusico e
            per il garzone, finché il polso non guarisce. Oddo le conta due volte
            con la mano sana, impilandole storte sulla panca. «Le chiacchiere non
            le paghi con le monete» dice, ma la sera al Grifone di Ferro racconta
            tre volte che quel tale ha pagato fino all'ultima benda.
          imposta: { topi: 1 }
          effetti: { monete: -40, scandalo: -1 }
      # --- il lavoro
      - testo: "Lavorare in bottega senza paga"
        descrizione: "Un giorno intero a scaricare sacchi e a spazzare la bottega, sotto gli occhi di Oddo."
        requisiti: [topi == 2]
        costo: 3
        esito:
          titolo: Sale grosso
          testo: |
            Scarichi il carro al posto del garzone e poi spazzi la bottega, con il
            sale grosso che ti brucia nelle pieghe delle mani. Oddo ti guarda
            tutto il giorno dalla panca senza dire niente. Al tramonto ti porta
            una fetta di torta di Berta, ancora tiepida. «Lavori storto ma lavori»
            dice, e si siede a guardarti mangiare.
          imposta: { topi: 1 }
          pe: { atletica: 2 }
      - testo: "Lavorare in bottega senza paga"
        descrizione: "Finché il polso non guarisce, i sacchi di Oddo li scarichi tu."
        requisiti: [topi == 3]
        costo: 3
        esito:
          titolo: Il garzone
          testo: |
            Per una settimana scarichi i carri al posto suo e spazzi la bottega, e
            le vicine trovano un motivo per passare due volte al giorno. Oddo ti
            guarda dalla panca con il polso al collo e ti corregge su tutto.
            L'ultimo giorno ti porta una fetta di torta e si siede accanto a te
            sullo scalino. «Lavori storto ma lavori» dice, e alle finestre le
            vicine smettono di guardare.
          imposta: { topi: 1 }
          effetti: { scandalo: -1 }
          pe: { atletica: 2 }

  # ------------------------------------------------------------ la torta di Berta
  - id: una-fetta-di-torta
    presso: emporio-tamberlo
    immagine: personaggi/berta-tamberlo
    titolo: Una fetta di torta
    sommario: "Nella cucina sul retro dell'Emporio Berta Tamberlo vende per pochi spiccioli la torta buona."
    luogo: L'Emporio Tamberlo, la cucina sul retro
    area: citta-bassa
    ripetibile: true
    testo: |
      Sul bancone dell'Emporio la torta sotto la campana di vetro è sempre la
      stessa e non è in vendita. Quella buona sta in cucina, sul retro, dove
      Berta Tamberlo sforna dall'alba. Per pochi spiccioli ti taglia una
      fetta di torta di mele ancora tiepida e ti fa sedere accanto al forno,
      perché in bottega Oddo le briciole non le vuole, e mentre mangi
      continua a impastare e a parlare senza aspettarsi risposte.

      {origine figlio-della-citta-bassa} L'odore di questo forno lo sentivi
      da ragazzo nel vicolo dietro l'Emporio, quando gli spiccioli per una
      fetta non li avevi.
    opzioni:
      - testo: "Mangiare la torta e ascoltare Berta"
        descrizione: "Pochi spiccioli per una fetta e per mezz'ora di chiacchiere in cui non devi dire niente."
        requisiti: [topi == 0, monete >= 3]
        esito:
          titolo: Torta di mele
          testo: |
            Berta ti racconta che Elsa tiene i conti meglio di suo padre e che
            Rilla le ha già rubato tre volte il grembiule rosso, con lo stesso
            orgoglio per tutte e due le cose. «Mio marito grida, le mie figlie
            litigano» dice, girando la pasta. «Io impasto.» Quando ti alzi hai le
            spalle più leggere, e briciole sul petto che Berta ti spazzola via con
            il dorso della mano.
          effetti: { monete: -3, tormento: -0.5 }
      - testo: "Mangiare la torta e ascoltare Berta"
        descrizione: "Pochi spiccioli per una fetta e per mezz'ora di chiacchiere in cui non devi dire niente."
        requisiti: [topi == 1, monete >= 3]
        esito:
          titolo: Il nastro verde
          testo: |
            Dalla porta della cucina si vede un pezzo di bottega, e dietro il
            bancone c'è Rilla. Ti guarda, poi si mette a riordinare una scatola di
            nastri già in ordine e non alza più gli occhi. Berta segue il tuo
            sguardo e senza dire niente taglia un'altra fetta per sé. La torta sa
            di cannella, e quando ti alzi hai le spalle più leggere.
          effetti: { monete: -3, tormento: -0.5 }
      - testo: "Tornare in bottega"
        costo: 0
        esito:
          testo: "Ringrazi Berta e torni in bottega, e il profumo delle mele ti segue fino alla porta della strada."
