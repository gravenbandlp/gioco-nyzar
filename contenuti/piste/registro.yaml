# La pista "Il registro del custode" (pista.registro 0 → 5): il custode notturno del Ponte dei Morti,
# il suo registro cifrato, i mulini bruciati e il rapporto a Galdrick.
storylet:
  # ------------------------------------------------------------ 0 → 1 · il Ponte dei Morti, di notte
  - id: il-ponte-dei-morti-di-notte
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: Il Ponte dei Morti, di notte
    sommario: "Ti hanno parlato del tizio dei ponti, quello del turno di notte. Dopo la seconda campana il Ponte dei Morti è suo."
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [pista.registro == 0, indizio.custode-notturno >= 1]
    testo: |
      Arrivi al Ponte dei Morti con la giubba incollata alle spalle e un brivido che dal terzo pilone non se
      n'è più andato. Sopra il vuoto dondolano a centinaia le lanterne dei Raschiatori, ognuna con un piccolo
      cristallo acceso per un compagno rimasto nel Labirinto.

      {percezione Facile} Sul vetro di quella più vicina qualcuno ha inciso col coltello *paga il debito*, e
      sotto, più piccolo, *quando torni*.

      Ti passa davanti un carro con le ruote fasciate di stracci, tirato da un mulo con gli zoccoli avvolti
      nella tela, e senti soltanto il fiato dell'animale. All'imbocco un facchino con la gerla vuota aspetta
      che qualcuno lo paghi.

      Su una cassa rovesciata due vecchi Raschiatori della veglia si passano una borraccia senza parlare.

      {origine apprendista-raschiatore} Gli occhi ti vanno da soli alle lanterne della tua squadra. Le conti
      come le teste a fine turno sulla piattaforma, muovendo le labbra a ogni numero.

      {origine accolito-del-velo} Le labbra cominciano da sole le parole del Velo per i morti che non tornano
      su. Le tieni chiuse, perché nessuno dei due vecchi ti ha chiesto una preghiera.

      In fondo al ponte c'è un gabbiotto dei Custodi di Passaggio con una lampada accesa dentro, e fuori la
      tavoletta dei turni appesa a un chiodo.
    opzioni:
      - testo: "Aspettare nell'ombra e guardare chi passa"
        descrizione: "Contare i carri, e guardare chi li ferma, se qualcuno li ferma."
        prova: { attributo: mentale, abilita: [percezione, furtivita], difficolta: Media }
        successo:
          titolo: Le ruote fasciate
          testo: |
            Fino all'alba passano sette carri, e nessuno si ferma a pagare al
            gabbiotto. Da ognuno scende il carrettiere e mette qualcosa in mano a
            un uomo pallido avvolto in un mantello cerato, che lo annota in un
            libretto di pelle e mai nel registro della Gilda incatenato al banco.

            Due carri portano sacchi di grano con lo stemma dei Malgrani, l'albero
            trafitto da una lama, dipinto sulla tela. Quando la nebbia si ritira
            leggi la tavoletta appesa al chiodo, dove in gesso, sotto la parola
            *notte*, c'è scritto *Maedric Holl*.
          effetti: { pista.registro: 1 }
        fallimento:
          titolo: Una balestra nella nebbia
          testo: |
            Ti accucci dietro una trave e conti i carri. Un balestriere
            dell'imbocco alza la testa e guarda dritto verso la tua trave, e
            dietro di lui un uomo pallido avvolto in un mantello cerato smette di
            scrivere nel suo libretto e guarda dalla stessa parte.

            Passando davanti al gabbiotto leggi la tavoletta dei turni, dove in
            gesso, sotto la parola *notte*, c'è scritto *Maedric Holl*. Adesso
            Maedric Holl conosce la tua sagoma, e tu non conosci ancora la sua
            faccia.
          effetti: { pista.registro: 1, sospetto: 1 }
      - testo: "Sederti con i Raschiatori della veglia"
        descrizione: "Passano la notte accanto alle lanterne della loro squadra, e da quella cassa vedono tutto quello che attraversa il ponte."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La veglia
          testo: |
            Ti siedi sulla cassa accanto a loro e per un po' stai zitt{o|a} anche tu,
            che è la parte più difficile. Alla fine la donna ti passa la
            borraccia.

            Quando le chiedi dei carri indica il gabbiotto con il mento. «Il
            custode di notte è Maedric Holl» dice. «Alle nostre lanterne non mette
            mai le mani, e per questo lo lasciamo stare. Quello che passa qui
            sopra la Gilda non lo vede.» L'uomo aggiunge che i carri con il grano
            dei Malgrani passano da anni, sempre dopo la seconda campana.
          effetti: { pista.registro: 1 }
        fallimento:
          titolo: Troppe domande
          testo: |
            I due ti lasciano sedere, ma alla terza domanda l'uomo si alza e ti
            chiede se sei venut{o|a} a vegliare o a contare. La donna ti dice soltanto
            che il custode di notte si chiama Maedric Holl e che alle lanterne non
            mette le mani, poi ti indica una trave più in là.

            Resti lì fino all'alba, fra le lanterne di gente che non hai mai
            conosciuto. Vedi Maedric uscire dal gabbiotto nel suo mantello cerato
            e i carri passare senza pagare.
          effetti: { pista.registro: 1, tormento: 1 }
      - testo: "Pagare il facchino all'imbocco"
        descrizione: "Qualche moneta, e un facchino dei ponti si ricorda di tutto quello che ha portato di notte."
        requisiti: [monete >= 5]
        esito:
          titolo: La gerla vuota
          testo: |
            Il custode di notte è Maedric Holl, quello pallido con il mantello
            cerato che sta uscendo adesso dal gabbiotto. Davanti a lui i carri con
            le ruote fasciate non pagano la gabella della Gilda. Pagano lui, e lui
            li segna in un libretto suo. Più di una volta il facchino ha scaricato
            in fondo al ponte sacchi di grano con lo stemma dei Malgrani, e li ha
            portati giù fino ai magazzini della Città Bassa. «Mai visto un timbro
            della Gilda» dice.
          pe: { conoscenze-della-strada: 5 }
          effetti: { monete: -5, pista.registro: 1 }
      - testo: "Vegliare con loro le lanterne della squadra"
        descrizione: "Sai come ci si siede a una veglia dei Raschiatori. Prima di qualunque domanda si dice il nome di uno rimasto sotto."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Un nome per la lanterna
          testo: |
            Ti siedi sulla cassa senza chiedere permesso, come si fa alla veglia,
            e prima di ogni altra cosa dici il nome di un compagno che dalla
            piattaforma è sceso una volta di troppo. La donna annuisce e ti passa
            la borraccia.

            Quando le chiedi dei carri ti indica il gabbiotto con il mento.
            «Maedric Holl, il custode di notte. Lo lasciamo stare perché alle
            nostre lanterne non mette le mani.» L'uomo aggiunge che il grano dei
            Malgrani passa da anni, sempre dopo la seconda campana, e che a te lo
            dice perché i calli che hai sui palmi li fa soltanto la corda della
            Cicatrice.
          effetti: { pista.registro: 1, rep.raschiatori: 0.5 }
      - testo: "Dire le parole del Velo per le lanterne"
        descrizione: "A una veglia si accetta anche una benedizione, se chi la dice non chiede niente in cambio."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Le parole corte
          testo: |
            Ti fermi davanti alla lanterna con il vetro inciso e dici a mezza voce
            le parole del Velo per i morti senza tomba, quelle corte, senza
            l'inchino. La donna smette di bere a metà sorso e aspetta che tu abbia
            finito. Poi ti passa la borraccia senza dire niente.

            «Il custode di notte è Maedric Holl» dice dopo un po', e indica il
            gabbiotto con il mento. L'uomo aggiunge che i carri con il grano dei
            Malgrani passano da anni, sempre dopo la seconda campana.
          effetti: { pista.registro: 1 }

  # ------------------------------------------------------------ 1 → 2 · Maedric Holl
  - id: maedric-holl
    presso: ponte-dei-morti
    immagine: personaggi/maedric-holl
    titolo: Il custode notturno
    sommario: "Maedric Holl tiene il Ponte dei Morti dalla seconda campana all'alba, con sei uomini della Gilda e un libretto di pelle sotto il mantello."
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [pista.registro == 1]
    testo: |
      Maedric Holl è appoggiato al parapetto accanto a una lanterna che illumina soltanto il suo mantello
      cerato. Ai due capi del ponte stanno sei uomini della Gilda con le balestre a tracolla. Uno porta il
      mantello dei Custodi rovesciato, e sulla fodera ha una toppa cucita a punti piccoli da qualcuno che gli
      vuole bene.

      Maedric si volta solo dopo un po'. Ha il viso pallido e gli occhi acquosi, e le labbra sottili non
      sorridono mai del tutto. La voce non va più in là di due passi, e per sentirlo devi farli tu.

      «I ponti di notte non sono i ponti di giorno» dice. «Di notte il ponte lo tengo io, e chi passa paga
      me.» Ti squadra con calma. «Ti ho visto la sera del Festival, fra quelli che tenevano testa agli orchi.
      Allora, che cosa devi far passare e quanto paghi?»

      {origine mercante-dei-ponti} È lo sguardo che hai tu quando al banco arriva un cliente nuovo e devi
      capire quanto può spendere. Fa uno strano effetto trovarsi dall'altra parte.
    opzioni:
      - testo: "Presentarti come cliente"
        descrizione: "Hai una merce da far passare senza registro, o almeno devi sembrarlo. Lui intanto ti peserà."
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il peso giusto
          testo: |
            Gli parli di tre casse di cristalli non registrati e di una notte
            senza luna, e la bugia ti viene così liscia che quasi ti dispiace di
            non avere davvero le casse. «Tre casse si fanno. Il prezzo lo fissiamo
            dentro» dice.

            Ti porta nel gabbiotto per fissare la tariffa e tira fuori da sotto il
            mantello un registro rilegato in pelle e scritto a numeri e piccoli
            disegni. Poi un carro si ferma storto all'imbocco, e lui esce a
            sistemare la faccenda lasciando il registro sul banco per il tempo di
            tre frasi a voce bassa. Te lo infili sotto la giubba alla seconda, e
            la pelle umida ti si appiccica alla camicia.

            La notte dopo il gabbiotto è chiuso, e dal chiodo accanto alla
            tavoletta dei turni manca il mantello di Maedric.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: "Pesat{o|a}"
          testo: |
            Gli parli di tre casse di cristalli e di una notte senza luna. Maedric
            ascolta e ti chiede da quale imbocco arriveranno le casse, e dopo un
            po' chi te le ha vendute. Alla terza rispondi «un amico», e ti accorgi
            tardi che l'avevi già detto.

            «Un amico» ripete lui, e il mezzo sorriso resta dov'è. Gli occhi
            acquosi si spostano sul balestriere più vicino mentre ti propone di
            lasciare stare le casse e di parlare di quello che sai davvero.
          effetti: { sospetto: 1 }
          segue: maedric-holl-il-prezzo
      - testo: "Dirgli quello che sai"
        descrizione: "Quello che sai dei custodi comprati e dei carri con le ruote fasciate. Vediamo che faccia fa."
        costo: 0
        esito:
          titolo: Gli occhi acquosi
          testo: |
            Gli racconti dei custodi che si comprano con una mancia e dei carri dei
            Malgrani che passano senza timbro, e gli dici che hai visto dove li
            annota. Il mezzo sorriso resta fermo dov'è.

            Gli occhi invece si spostano sul balestriere più vicino, che a un cenno
            della mano si allontana di tre passi e resta a guardare la nebbia.
            Maedric si stringe nel mantello cerato fino a farlo scricchiolare, poi
            per la prima volta ti guarda dritto in faccia.
          segue: maedric-holl-il-prezzo
      - testo: "Minacciarlo davanti ai suoi uomini"
        descrizione: "Lui ha sei uomini con le balestre, e il ponte è stretto. Se cominci tu, qualcuno finisce di sotto."
        combattimento: maedric-sul-ponte
        vittoria:
          titolo: Isolato
          testo: |
            La nebbia si infittisce di colpo, e i balestrieri tagliano le corde
            delle lanterne più vicine per toglierti la luce. Metti a terra il
            balestriere con la toppa sulla fodera, e ti dispiace un poco per chi
            gliel'ha cucita.

            Quando vedono il compagno a terra gli altri arretrano nella nebbia, e
            i loro passi si allontanano sulle lastre. Maedric resta solo, con la
            schiena contro il parapetto e le mani alzate all'altezza del petto.
            Per la prima volta da quando lo conosci respira forte.
          segue: maedric-in-ginocchio
        sconfitta:
          titolo: La borsa nella nebbia
          testo: |
            Un colpo alle gambe ti manda sulle assi viscide, con le dita
            aggrappate al bordo e la luce della Cicatrice a un palmo dalla faccia.

            Quando riesci a rialzarti il ponte è vuoto. Da sotto le assi arriva il
            cigolio di una corda tesa, poi più niente. Accanto al parapetto trovi
            la borsa di cuoio che Maedric ha perso scendendo. Dentro c'è un
            registro rilegato in pelle e scritto a numeri e piccoli disegni. Entro
            sera alla Pignatta sapranno che ce l'hai tu.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -1, pista.registro: 1 }
      - testo: "Trattare la tariffa da mercante dei Ponti"
        descrizione: "Hai la licenza della Gilda, e sai come si tratta quello che nei registri non si scrive."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Facile }
        successo:
          titolo: Fra colleghi
          testo: |
            Gli mostri il sigillo della tua licenza e gli chiedi quanto costa far
            passare di notte un carico che la Casa dei Nodi non deve vedere. «Uno
            della Gilda che paga me invece della Gilda» dice. «Mi piace.»

            Ti porta nel gabbiotto per fissare la tariffa e tira fuori da sotto il
            mantello il registro di pelle. Quando un carro si ferma storto
            all'imbocco ed esce a sistemarlo, il registro resta sul banco, e tu lo
            fai sparire sotto la giubba con il gesto con cui al banco fai sparire
            una moneta tosata. La notte dopo il gabbiotto è sprangato, e sulla
            stufetta la sua tazza è rimasta a metà, col tè ghiacciato.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: Troppo in regola
          testo: |
            Gli mostri il sigillo della licenza, e Maedric lo guarda più a lungo
            di te. «Uno della Gilda che viene a comprare il silenzio da me» dice
            piano. «Di solito quelli della Gilda vengono a vedere chi lo vende.» Gli occhi acquosi passano
            sul balestriere più vicino, e il sigillo ti diventa pesante in mano.

            Ti propone di lasciar perdere le casse e di parlare di quello che sai
            davvero.
          effetti: { sospetto: 1 }
          segue: maedric-holl-il-prezzo

  - id: maedric-holl-il-prezzo
    presso: ponte-dei-morti
    immagine: personaggi/maedric-holl
    titolo: Le tariffe
    tipo: seguito
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [pista.registro == 1]
    testo: |
      «Qualcuno ti ha parlato di me» dice Maedric. «Chi sia non mi interessa. Mi interessa che cosa vuoi tu.»
      All'imbocco uno dei balestrieri si toglie la balestra dalla spalla e se la tiene in grembo come un
      gatto.

      «Senti. Io lavoro a tariffa, con tutti. Dimmi che cosa vuoi che dimentichi e ti dico quanto costa. Posso
      pagarti in monete oppure con un nome che ti serve più del mio.» Lo dice piano, e ti accorgi di esserti
      avvicinat{o|a} per sentirlo.

      «Se invece vuoi portarmi da Cordani, con che cosa ci vai? Con la tua parola contro la mia? Siamo su un
      ponte di notte e le balestre sono mie. Se cadi di sotto, domattina nessuno ha visto niente.» Gli uomini
      agli imbocchi si irrigidiscono senza che lui alzi un dito.

      {furtivita Media} Fra la lanterna di Maedric e la successiva ci sono quattro passi di buio e di nebbia,
      dove una balestra deve tirare a orecchio.
    opzioni:
      - testo: "Accettare il prezzo"
        descrizione: "Un nome da poco e qualche moneta, in cambio del tuo silenzio. Il registro resta a lui, per ora."
        esito:
          titolo: Un nome da poco
          testo: |
            Maedric ti conta in mano le monete fredde di nebbia una alla volta. Poi
            ti dà il nome. Ilario Benn, riscossore del turno di giorno alle Mille
            Corde, arrotonda i pedaggi dei carri di sale e si tiene la differenza.

            Torna verso il gabbiotto, e dalla finestra lo vedi chinarsi dietro il
            banco. Quando si rialza il libretto di pelle non ce l'ha più in mano, e
            alla cassetta di ferro sul pavimento è appeso un lucchetto nuovo.
          effetti: { monete: 15, informazioni.pettegolezzo: 1 }
          segue: maedric-holl-il-gabbiotto
      - testo: "Dirgli che Cordani e lo sceriffo lo aspettano"
        descrizione: "Con calma, senza alzare la voce. Un uomo che ama vivere fa i suoi conti prima di organizzare un incidente."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La corda sotto le assi
          testo: |
            Gli dici che lo sceriffo sa dove sei stanotte, e che domattina lo saprà
            anche il Sovrintendente Cordani. Un forestiero caduto dal ponte si
            spiega facilmente, dice lui, mentre uno di quelli che la sera del
            Festival hanno tenuto testa agli orchi si spiega molto meno.

            Poi fa un passo indietro nella nebbia e sparisce. La porta del
            gabbiotto è rimasta aperta, e appesa al chiodo dietro il banco c'è la
            sua borsa di cuoio con dentro il registro di pelle.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: Un incidente sul ponte
          testo: |
            Gli parli di Cordani e dello sceriffo, ma a metà frase la voce ti sale
            di un tono, come a un ragazzo che bluffa a carte, e Maedric lo sente. Il
            primo dardo si pianta nel parapetto accanto alla tua mano, il secondo ti
            entra nel fianco mentre ti butti sulle assi, e te lo strappi da sol{o|a} con
            le dita che non vogliono chiudersi.

            Quando rialzi la testa Maedric è sparito, e i suoi uomini con lui. La
            borsa di cuoio è caduta dietro la stufa, con dentro il registro di
            pelle, e nella fretta nessuno l'ha trovata.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { ferite: 2, rep.scuri: -1, pista.registro: 1 }
      - testo: "Mettergli le mani addosso"
        descrizione: "Hai sentito abbastanza. Lui però ha sei balestre dalla sua, e il ponte è stretto."
        combattimento: maedric-sul-ponte
        vittoria:
          titolo: Le lanterne tagliate
          testo: |
            Gli sei addosso prima che finisca di alzare la mano, e il corpo ha
            deciso per te mentre la testa stava ancora ascoltando. I balestrieri
            tagliano le corde delle lanterne per accecarti, e la nebbia si chiude
            sul ponte.

            Quando la nebbia si apre Maedric è rimasto solo, con le spalle al
            metallo e le mani aperte davanti al petto, e la fronte lucida.
          segue: maedric-in-ginocchio
        sconfitta:
          titolo: Il cigolio di una corda
          testo: |
            Gli sei addosso, ma Maedric arretra di un passo e i dardi arrivano dalla
            nebbia prima di lui. Finisci sulle assi viscide con una gamba oltre il
            bordo, e la luce della Cicatrice ti illumina la suola.

            Sotto il ponte cigola una corda tesa, poi smette. Quando la nebbia si
            dirada restano le lanterne spente e, vicino al parapetto, una borsa di
            cuoio rovesciata con dentro un registro di pelle. Maedric l'ha persa
            scendendo, e stanotte stessa qualcuno andrà a dire agli Scuri chi l'ha
            raccolta.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -1, pista.registro: 1 }
      - testo: "Fargli capire a quali tavole ceni"
        descrizione: "Uno che vende silenzio sa quanto pesa un nome dei Quartieri Alti. Il tuo siede ai tavoli del Consiglio."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Un posto vuoto a tavola
          testo: |
            Gli dici il nome della tua famiglia, e poi, come per caso, quelli delle due
            famiglie che ti hanno mandato l'invito a cena su carta pesante, e di che cosa si
            parla a quelle tavole quando un ospite manca senza avvisare.

            Secondo lui un forestiero caduto dal ponte si spiega facilmente, mentre un posto
            vuoto a una cena dei Quartieri Alti si spiega molto meno. Poi fa un passo indietro
            nella nebbia e sparisce. Nel gabbiotto rimasto aperto, appesa al chiodo dietro il
            banco, c'è la sua borsa di cuoio con il registro di pelle.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: I nomi cadono come gli altri
          testo: |
            Gli dici il nome della tua famiglia, e lui lo ripete piano. «Bel
            nome. Domattina lo scrivono sul registro dei caduti, come gli altri»
            dice. Il primo dardo si pianta nel parapetto accanto alla tua
            mano, il secondo ti entra nel fianco mentre ti butti sulle assi.

            Quando rialzi la testa Maedric è sparito con i suoi uomini, e nel
            gabbiotto la borsa di cuoio è caduta dietro la stufa, con dentro il
            registro di pelle.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { ferite: 2, rep.scuri: -1, pista.registro: 1 }

  - id: maedric-holl-il-gabbiotto
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: Il gabbiotto
    tipo: seguito
    luogo: Ponte dei Morti, al cambio del turno
    area: ponti-sospesi
    requisiti: [pista.registro == 1]
    testo: |
      Maedric chiude il gabbiotto con due giri di chiave e se ne va verso i Quartieri Alti come un impiegato a
      fine turno.

      Il gabbiotto è una scatola di assi e lamiera agganciata al fianco del ponte, con la porta sul tavolato e
      una finestrella sul vuoto. Il custode di giorno arriva tardi, e prima di lui passa un facchino con il
      carbone per la stufa. Porta la chiave al collo con un laccio da scarpe, e l'avrebbe data a chiunque
      gliel'avesse chiesta.
    opzioni:
      - testo: "Entrare dalla finestrella sul vuoto"
        descrizione: "Dal parapetto al davanzale c'è un braccio di distanza, e sotto c'è la Cicatrice."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Un braccio sul vuoto
          testo: |
            Quando il ponte resta vuoto scavalchi il parapetto. Poi sei dentro,
            accucciato fra la stufa ancora tiepida e il banco. Il lucchetto della
            cassetta cede alla seconda spinta, perché è nuovo ma l'anello a cui è
            appeso è vecchio.

            Esci dalla stessa parte con il registro sotto la giubba. Due notti
            dopo nel gabbiotto c'è un custode nuovo, giovane, che non sa niente, e
            Maedric Holl sui ponti non si è più visto.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: "Appes{o|a}"
          testo: |
            Scavalchi il parapetto e allunghi una gamba fino al davanzale, ma la lamiera è bagnata e il piede
            scivola. Alla fine entri, e la cassetta cede alla seconda spinta.

            Quando esci il custode del turno di giorno è fermo sul tavolato con il suo pane in mano, e ti guarda
            risalire sul parapetto. Entro sera Maedric sa chi gli ha aperto la cassetta, e da quella notte sui
            ponti non lo vede più nessuno.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { ferite: 1, sospetto: 1, rep.scuri: -1, pista.registro: 1 }
      - testo: "Pagare il facchino del carbone"
        descrizione: "Qualche moneta, e la chiave appesa al laccio da scarpe gira per te."
        requisiti: [monete >= 10]
        esito:
          titolo: Il laccio da scarpe
          testo: |
            Il facchino guarda le monete a lungo, come se dovesse portarle su per
            una scala, e poi se le fa sparire in una scarpa, dove nessuno va a
            cercare volentieri. Apre il gabbiotto e scarica il carbone accanto
            alla stufa. Il lucchetto è nuovo, ma la chiave piccola sta appesa allo
            stesso laccio della grande.

            Il facchino richiude la porta dietro di te. Due notti dopo nel
            gabbiotto c'è un custode nuovo, e di Maedric Holl sui ponti si dice
            soltanto che è sparito.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { monete: -10, rep.scuri: -0.5, pista.registro: 1 }

  - id: maedric-in-ginocchio
    presso: ponte-dei-morti
    immagine: personaggi/maedric-holl
    titolo: Senza uomini
    tipo: seguito
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [pista.registro == 1]
    testo: |
      Maedric ha la schiena contro il parapetto. Si è inginocchiato senza che tu glielo chiedessi e tiene i
      palmi bianchi aperti davanti al petto.

      {origine fuggiasco-di-ghoran} Quella posizione la conosci dalla parte sbagliata. A Ghoran si stava così
      davanti ai sorveglianti, e le tue spalle si curvano come se in ginocchio ci fossi tu.

      «Il registro è qui, sotto il mantello» dice, e la voce gli trema sull'ultima sillaba. «È tuo, se mi
      lasci andare. Ho una corda legata al parapetto, a un passo dalla mano sinistra, e scendo senza che
      nessuno mi veda.» La corda annodata pende oltre il bordo, dentro la nebbia.

      {ingannare Media} Te la mostra per farti sentire generos{o|a}, e intanto ti dice dove guarderà lui.

      *Se lo lascio scendere, prima dell'alba gli Scuri sapranno il mio nome.* Maedric tira fuori il registro
      con due dita e lo posa sulle assi fra voi.
    opzioni:
      - testo: "Legarlo e portarlo alla Caserma"
        descrizione: "Con la sua stessa corda, su per i Quartieri Alti, fino alla porta della Caserma."
        esito:
          titolo: Alla Caserma
          testo: |
            Gli leghi i polsi con la corda che doveva servirgli per sparire, e il
            registro te lo metti sotto la giubba. Per tutta la salita verso i
            Quartieri Alti cammina un passo davanti a te senza dire niente, con il
            mantello cerato che frusta i polpacci a ogni gradino, e soltanto alla
            porta della Caserma ti chiede di dire allo sceriffo che si è arreso da
            solo.

            Le due guardie in giaco di maglia lo prendono in consegna.
          imposta: { registro-cifrato: 1, maedric: 2 }
          effetti: { rep.caserma: 1, pista.registro: 1 }
      - testo: "Lasciarlo scendere"
        descrizione: "Prendi il registro e gli lasci la corda. Un uomo che ama vivere se lo ricorda, e si ricorda anche la tua faccia."
        esito:
          titolo: La corda
          testo: |
            Raccogli il registro e fai un passo indietro. Maedric ti guarda un
            momento, come per esserne sicuro, poi scavalca il parapetto e scende
            lungo la corda, un nodo alla volta, finché la nebbia gli copre la
            testa. La corda resta tesa ancora un po' e poi si allenta.

            Sui ponti non lo vedrai più. Prima dell'alba, però, alla Pignatta
            Grassa sapranno che il registro del custode notturno adesso ce l'hai
            tu, e chi te l'ha lasciato prendere.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -1, pista.registro: 1 }
      - testo: "Non dargli il tempo di arrivare alla corda"
        descrizione: "La sua mano sinistra è a un passo dalla corda, e un uomo dei ponti ha sempre un trucco in più."
        esito:
          titolo: Sulle assi
          testo: |
            La mano sinistra di Maedric si muove verso il parapetto, e tu colpisci
            prima di capire se cercava la corda. Lui cade di lato sulle assi e non
            si rialza.

            Il registro è dove l'aveva posato. Lo raccogli con le mani che tremano
            e resti accanto al corpo finché la nebbia comincia a calare. Domattina
            sul Ponte dei Morti troveranno un custode della Gilda con la testa
            spaccata, e qualcuno dirà di aver visto la tua sagoma nella nebbia.
          imposta: { registro-cifrato: 1, maedric: 3 }
          effetti: { tormento: 1.5, sospetto: 1.5, pista.registro: 1 }

  # ------------------------------------------------------------ 2 → 3 · il registro cifrato
  - id: il-registro-cifrato
    presso: biblioteca-di-qir-azel
    immagine: personaggi/mattias-crenn
    titolo: Il cifrario del custode
    sommario: "Il registro di Maedric è scritto a numeri e piccoli disegni. Al primo piano della Biblioteca Mattias Crenn legge il precuriano da trent'anni."
    luogo: Biblioteca di Qir-Azel, il primo piano
    area: quartieri-alti
    requisiti: [pista.registro == 2, invito >= 1]
    testo: |
      Il primo piano della Biblioteca è un corridoio di stanzette piene di carte, e quella di Mattias Crenn è
      l'ultima, con la porta bloccata da una pila di monografie.

      Posi il registro sul tavolo. Mattias apre il libro a metà e comincia subito a parlare a raffica.

      «Le date sono numeri, e anche le somme. I disegnini sono le merci e le persone, questa ruota è un carro
      e questo sacco è grano. È il cifrario di un custode che un testo precuriano non l'ha mai visto in vita
      sua.» Batte l'indice su una pagina. «La chiave però cambia ogni mese. Si fa, si fa. Ci vuole una notte,
      oppure qualcuno che sappia contare quasi quanto me.»

      {origine allievo-di-torvessa} Al primo anno Temmerin vi metteva davanti libri mastri sequestrati, e le
      dita ti vanno da sole all'inizio della pagina. Mattias te le sposta senza smettere di parlare.

      {accademiche Media} Una chiave che cambia è comoda da scrivere e scomoda da rompere, a meno che chi la
      usa ripeta la stessa cosa all'inizio di ogni mese.
    opzioni:
      - testo: "Decifrarlo con lui"
        descrizione: "Tu leggi i numeri ad alta voce, lui cerca la chiave del mese. Serve qualcuno che sappia tenere il conto."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: La chiave di ogni mese
          testo: |
            Tu leggi i numeri e lui li scrive su un foglio, in colonna. Il primo
            numero di ogni mese è la chiave, e tutto il resto va spostato di
            tanto.

            All'alba il registro è aperto sul tavolo accanto a quaranta fogli di
            trascrizione, e Mattias dorme con la guancia su una monografia
            respinta, con l'inchiostro del timbro che gli si stampa al rovescio
            sulla pelle.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
        fallimento:
          titolo: Le colonne sbagliate
          testo: |
            Leggi i numeri ad alta voce, ma per due volte salti una riga, e la
            seconda volta Mattias se ne accorge dopo un'ora di conti. Si toglie
            gli occhiali e si stropiccia gli occhi, e da lì in avanti non ti
            lascia più leggere.

            All'alba la trascrizione è finita, tutta con la sua grafia. Tu hai
            passato la notte seduto sulle scale, e lui ti consegna i fogli senza
            guardarti, borbottando che in fondo era un cifrario da bambini.
          imposta: { registro.decifrato: 1 }
          effetti: { tormento: 1 }
          segue: il-registro-decifrato
      - testo: "Pagargli la cena con Ulric"
        descrizione: "Per sé Mattias non vuole soldi. Stasera però cena con Ulric Stanne, e il vino buono costa caro."
        requisiti: [monete >= 10]
        esito:
          titolo: Il vino buono
          testo: |
            Gli metti le monete sul tavolo e gli dici che sono per il vino di
            stasera. Mattias sbuffa, poi le prende. «Per me niente, sia chiaro. Ulric
            però beve soltanto quello delle colline di Laresh» dice, e
            ti accompagna alla porta lasciando il registro aperto sul tavolo.

            Quando torni, il giorno dopo, il registro è accanto a una bottiglia
            vuota e a una pila di fogli scritti fitti, e Mattias ha gli occhi rossi
            e una macchia di vino sul polsino che non si è accorto di avere.
          imposta: { registro.decifrato: 1 }
          effetti: { monete: -10 }
          segue: il-registro-decifrato
      - testo: "Proporgli il metodo di Temmerin"
        descrizione: "Al primo anno dell'Accademia Orvald Temmerin fa decifrare agli allievi i libri mastri sequestrati dalla Caserma, come esercizio prima delle iscrizioni vere."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Gli esercizi del primo anno
          testo: |
            Gli racconti che Temmerin, al primo anno, vi mette davanti i libri dei
            contrabbandieri sequestrati, e che la prima regola è cercare la riga
            che torna uguale all'inizio di ogni mese. Mattias storce la bocca al
            nome del preside e borbotta qualcosa sui dilettanti, ma ti lascia fare.

            Il primo numero di ogni mese è la chiave, e tutto il resto va spostato
            di tanto. All'alba la trascrizione è finita, e lui dorme con la
            guancia su una monografia respinta, mentre tu rileggi i fogli con gli
            occhi che bruciano.
          imposta: { registro.decifrato: 1 }
          pe: { accademiche: 3 }
          segue: il-registro-decifrato

  - id: l-archivio-dei-dazi
    immagine: personaggi/lira-demos
    titolo: L'archivio dei dazi
    sommario: "Alla Casa dei Nodi Lira Demos tiene i conti dei ponti, e da anni annota tutto quello che fa Maedric Holl in attesa di una prova."
    luogo: Casa dei Nodi, l'archivio dei dazi
    area: quartieri-alti
    requisiti: [pista.registro == 2, invito >= 1]
    testo: |
      L'archivio dei dazi è una sala lunga al secondo piano della Casa dei Nodi, con le finestre sulle catene
      dei ponti. Su ogni registro degli scaffali è inchiodato un tassello di legno inciso con un segno. Lira
      Demos lavora vicino alla finestra. È una mezzelfa con i capelli castani intrecciati di fili di rame, e
      accanto al calamaio tiene una scatola di tasselli che ordina per forma.

      Ti ascolta senza interromperti, e le dita si fermano quando posi sul tavolo il registro di Maedric.

      «Sono sei anni che gli scrivo dietro tutto quello che vedo, e non avevo niente in mano» dice piano. Ti
      spiega che i numeri sono i turni di Maedric e i disegni sono i segni dei tasselli, copiati male dal
      vecchio cifrario dei custodi.
    opzioni:
      - testo: "Riscontrarlo con i registri dei dazi"
        descrizione: "I turni di Maedric da una parte, i pedaggi registrati dall'altra. La merce è passata nelle notti in cui i conti non tornano."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Dove i conti non tornano
          testo: |
            Lira tira giù dagli scaffali sei anni di pedaggi notturni, e tu li
            leggi accanto ai turni di Maedric, una notte alla volta, finché la
            polvere dei registri ti si deposita in gola e ogni tanto devi tossire
            nella manica. Ogni volta che nel registro di pelle c'è un disegno e nei
            libri della Gilda non c'è niente, lei posa un tassello sul tavolo. A
            metà pomeriggio il tavolo è coperto di tasselli, e la chiave del
            cifrario si legge da sola nell'ordine in cui li ha messi.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
        fallimento:
          titolo: Un tassello fuori posto
          testo: |
            Leggi i turni di Maedric accanto ai pedaggi notturni, ma confondi due
            anni, e per un'ora Lira posa tasselli sulle notti sbagliate.

            Finisce che è buio. Tu hai passato il pomeriggio a portarle registri
            su e giù per la scala, e il garzone ti ha visto ogni volta con il
            libro di pelle sotto il braccio. Lira ti consegna la trascrizione in
            una grafia minuta e diritta, e ti ringrazia lo stesso.
          imposta: { registro.decifrato: 1 }
          effetti: { sospetto: 1 }
          segue: il-registro-decifrato
      - testo: "Lasciarle il registro fino a domani"
        descrizione: "Lira non vuole soldi e non promette niente per iscritto. Ti chiede soltanto di aspettare."
        costo: 2
        esito:
          titolo: Pratica notarile
          testo: |
            «Allora, torna domattina» dice, e chiude il registro nel cassetto.

            Il giorno dopo la trovi allo stesso tavolo, con la camicia di ieri e un
            filo di rame che le è scappato dalla treccia. Ha trascritto tutto in una
            grafia minuta e diritta, e nei margini ha fissato un tassello accanto a
            ogni notte che anche lei aveva annotato per conto suo, e sono parecchie.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
      - testo: "Leggere i turni come un libro mastro"
        descrizione: "Sui Ponti hai il banco, e sai in quali notti un mercante paga la gabella e in quali no."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Le notti senza gabella
          testo: |
            Le chiedi di tirare giù i pedaggi notturni, e mentre lei apre i
            registri tu ti segni le settimane in cui al Mercato dei Nodi il grano
            è calato di prezzo senza un motivo che un mercante sappia spiegare.
            Sono le stesse in cui nel libro di Maedric compare il sacco.

            Lira posa un tassello su ognuna, e prima di sera la chiave del
            cifrario si legge nell'ordine dei tasselli.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato

  - id: il-registro-alla-pignatta
    presso: pignatta-grassa
    immagine: personaggi/rozalia-marga
    titolo: Il cifrario dei custodi
    sommario: "Alla Pignatta Grassa Rozalia Marga falsifica le carte della Gilda per gli Scuri, e i suoi cifrari li legge per mestiere."
    luogo: Pignatta Grassa, nel retrobottega
    area: citta-bassa
    # chi ha battuto Rozalia e Squiggor in Via dei Rasoi (squiggor 2) da lei non torna: decifra in Biblioteca o ai dazi
    requisiti: [pista.registro == 2, squiggor < 2]
    testo: |
      All'ora del mercato la Pignatta Grassa è mezza vuota, e Mauro Scrocco ti indica il retrobottega con il
      mento prima che tu apra bocca.

      {origine figlio-della-citta-bassa} Da ragazz{o|a} alla porta del retrobottega ti fermavi, perché in
      Città Bassa si impara presto dove finisce la sala, e il piede esita ancora sulla soglia.

      Rozalia Marga siede al banco con la piuma d'oca dietro l'orecchio, e batte due volte la penna sul
      calamaio prima di toccare il registro di Maedric.

      «Il cifrario dei custodi, quello vecchio con i disegnini» dice. «Io ci ho imparato a leggere, per la
      precisione. Maedric ci ha messo una chiave che cambia ogni mese e si crede furbo.» Chiude il registro
      con il palmo. «Lo leggo in un pomeriggio. Però quello che passa per le mie mani finisce nelle mie
      cartelle» aggiunge, e indica gli scaffali con la penna.
    opzioni:
      - testo: "Pagare la trascrizione"
        descrizione: "Il prezzo di un pomeriggio di lavoro. Una copia resterà sugli scaffali della Pignatta, e gli Scuri sapranno che cosa c'è scritto."
        requisiti: [squiggor <= 1, monete >= 15]
        esito:
          titolo: In pari
          testo: |
            Rozalia conta le monete senza toccarle, spostandole una alla volta con
            la punta della penna, e ti dice di tornare al tramonto. Al tramonto la
            trascrizione è pronta, in una grafia piccola e diritta, legata con un
            nastro da pacchi.

            Sullo scaffale alle sue spalle c'è una cartella nuova, senza
            etichetta, dello stesso spessore. «I conti li chiudo sempre in pari»
            dice, e batte due volte la penna sul calamaio. «Tu hai la tua copia,
            io la mia.»
          imposta: { registro.decifrato: 1 }
          effetti: { monete: -15, rep.scuri: 0.5, sospetto: 1 }
          segue: il-registro-decifrato
      - testo: "Convincerla a non tenersi la copia"
        descrizione: "La paga sul banco, e una buona ragione perché quel registro non finisca nelle sue cartelle. Se fallisci, paghi lo stesso."
        requisiti: [squiggor <= 1, monete >= 15]
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Una cartella in meno
          testo: |
            Le fai notare che nel registro ci sono pagamenti alla Pignatta, e che
            una copia sui suoi scaffali è proprio la carta che lo sceriffo
            verrebbe a cercare.

            «Hai ragione, e mi secca» dice alla fine. Ti spinge indietro le monete
            con la penna e decifra il registro davanti a te, senza tenere niente.
            Al tramonto ti porge la trascrizione e brucia i fogli di prova nella
            stufa, uno per uno, mentre la guardi.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
        fallimento:
          titolo: Nelle cartelle
          testo: |
            Le spieghi perché una copia sui suoi scaffali sarebbe un rischio anche
            per lei, e Rozalia ti ascolta con la testa piegata di lato. «Tesoro, i
            rischi li tengo in ordine alfabetico» dice. «Si paga lo stesso, e la
            copia resta a me.»

            Al tramonto la trascrizione è pronta, legata con un nastro da pacchi.
            Sullo scaffale alle sue spalle c'è una cartella nuova dello stesso
            spessore, e lei non fa niente per nasconderla.
          imposta: { registro.decifrato: 1 }
          effetti: { monete: -15, rep.scuri: 0.5, sospetto: 1 }
          segue: il-registro-decifrato

  - id: il-registro-decifrato
    immagine: fazioni/gilda-dei-mercanti
    titolo: Quello che c'è scritto
    tipo: seguito
    luogo: Il registro di Maedric, decifrato
    area: quartieri-alti
    requisiti: [pista.registro == 2, registro.decifrato >= 1]
    testo: |
      Il registro copre sei anni di notti, e ogni riga è un passaggio sul Ponte dei Morti mai entrato nei
      libri della Gilda.

      Le righe con il sacco sono quasi tutte per i Malgrani. È grano dei villaggi di pianura che finiva nei
      magazzini della Città Bassa senza timbro né gabella, prima una volta al mese e negli ultimi cinque anni
      quasi ogni settimana. In fondo ci sono una ventina di nomi con la loro cifra mensile. Sono riscossori e
      custodi dei ponti, più tre funzionari della Casa dei Nodi. Ogni mese poi una somma va a un cappuccio
      disegnato, e accanto al primo Maedric ha scritto in chiaro *Pignatta*.

      Di orchi o di una Dama d'Argento non c'è una riga.

      Il nome di Tarquin Cordani compare una volta sola, in un margine, con il disegno di un occhio aperto e
      una nota cifrata che vuol dire *non avvicinare*. Nel registro il Sovrintendente è l'unico della Gilda
      che sembra pulito.
    opzioni:
      - testo: "Contare i carri dei Malgrani"
        costo: 0
        esito:
          titolo: I sacchi
          testo: |
            In sei anni sul Ponte dei Morti è passato di notte abbastanza grano da
            sfamare la Città Bassa per un inverno, e la Gilda non ne ha registrato
            un chicco.

            Per arrivare a Ottone Malgrani però non basta un sacco disegnato nel
            libretto di un contrabbandiere. Sul retro di un foglio ti segni di
            andare a vedere il Mulino Malgrani, l'unico rimasto in piedi in tutta
            la regione.
          pe: { politica-ed-economia: 5 }
          effetti: { pista.registro: 1 }
      - testo: "Rileggere i nomi della Gilda"
        costo: 0
        esito:
          titolo: Le cifre mensili
          testo: |
            Rileggi i nomi uno per uno. Due li conosci di vista, perché ti hanno
            fatto pagare la gabella all'imbocco con il sorriso. Accanto a ogni nome
            c'è la cifra del mese, e certe cifre sono più alte di quello che un
            riscossore guadagna in un anno.

            Con questo registro in mano metà dei ponti di Qir-Azel ti deve
            qualcosa, e l'altra metà vorrebbe vederti cadere da uno di quelli.
            Chiudi il libro e lo leghi stretto con lo spago, facendo un nodo
            doppio.
          effetti: { informazioni.segreto: 1, pista.registro: 1 }

  # ------------------------------------------------------------ 3 → 4 · i mulini bruciati
  - id: i-mulini-bruciati
    presso: segheria-e-mulino-malgrani
    immagine: ambientazione/mulino-malgrani
    titolo: L'unico mulino
    sommario: "Tre mulini bruciati in cinque anni, e uno solo rimasto in piedi. Chi lo manda avanti ha abbassato il prezzo della farina, e dorme male."
    luogo: Mulino Malgrani, Città Bassa
    area: citta-bassa
    requisiti: [pista.registro == 3]
    testo: |
      Il Mulino Malgrani sta dove la Città Bassa scende verso il Torvessa. È un edificio di pietra blu con la
      ruota che gira giorno e notte e una nuvola di farina davanti alla porta, dove fanno la coda donne con i
      sacchetti di tela e qualche bambino con le monete nel pugno.

      Negli ultimi cinque anni sono bruciati gli altri tre mulini della regione, e questo è l'unico che macina
      ancora.

      Anselmo Brey, il responsabile, esce infarinato fino ai gomiti e starnutisce tre volte prima di
      salutarti. Quando gli dici chi sei il tic al sopracciglio destro gli accelera.

      *Quest'uomo ha paura di qualcosa che non sono io.* Dietro il mulino un sentiero risale il torrente verso
      quello che resta del mulino di Rivopuma.
    opzioni:
      - testo: "Parlare con Anselmo Brey"
        immagine: personaggi/anselmo-brey
        descrizione: "Dicono che parli troppo alle domande dirette e poco a quelle generali. Bisogna fargli quelle giuste."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Domande dirette
          testo: |
            Gli chiedi chi gli porta il grano di notte, e Brey risponde troppo, con
            la fretta di uno che aspettava la domanda da anni e se l'era preparata.
            Racconta che dopo ogni incendio arrivavano carri dai villaggi che prima
            macinavano altrove, sempre dopo la seconda campana, e che lui firmava
            le bolle senza il timbro della Gilda perché così voleva il padrone.

            «Lo so che con gli incendi tutta la città ha cominciato a pensare ai
            Malgrani» aggiunge piano, guardando la coda davanti alla porta.
          effetti: { prove.malgrani: 2, pista.registro: 1 }
        fallimento:
          titolo: Domande generali
          testo: |
            Gli chiedi degli incendi in generale, e Brey per mezz'ora ti parla
            della ruota che va ingrassata e del raffreddore che gli viene dalla
            farina, con una passione che in un altro momento ti farebbe quasi
            tenerezza. Quando torni sugli incendi starnutisce e dice soltanto
            «Hanno detto che l'incendio l'ha appiccato qualcuno. Io ho abbassato i
            prezzi, ecco, altro non so.»

            Entro sera in casa Malgrani sapranno che qualcuno è venuto a fare
            domande, e da dietro la porta Brey ti guarda andare via con il
            sopracciglio che non smette di saltare.
          effetti: { prove.malgrani: 1, rep.malgrani: -0.5, pista.registro: 1, sospetto: 0.5 }
      - testo: "Andare a vedere il mulino di Rivopuma"
        descrizione: "A mezz'ora di cammino lungo il torrente restano le pietre annerite dell'ultimo mulino bruciato. Dopo due anni di pioggia qualcosa si legge ancora."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Le pietre annerite
          testo: |
            Del mulino di Rivopuma restano i muri senza tetto e la ruota bruciata a
            metà, piegata nell'acqua. Fra le erbacce trovi i cocci di tre giare da
            olio, di quelle grosse da magazzino, ciascuna in un angolo diverso. Il
            fuoco è partito da tre punti insieme. La macina è spaccata da un cuneo
            di ferro ancora piantato nella fessura, e un mulino con la macina
            spaccata non lo ricostruisce nessuno.

            Torni in città con le mani nere di fuliggine e un coccio avvolto nel
            fazzoletto.
          effetti: { prove.malgrani: 1, pista.registro: 1 }
        fallimento:
          titolo: Fuliggine
          testo: |
            Del mulino di Rivopuma restano i muri senza tetto e la ruota bruciata
            nell'acqua. Giri fra le pietre per un'ora e trovi soltanto fuliggine e
            un nido di gazza nel camino, con dentro un cucchiaino e un bottone, e
            uscendo ti tagli la mano su un chiodo arrugginito della ruota.

            Sulla strada del ritorno un vecchio che spacca la legna ti racconta di
            aver visto l'incendio da casa sua, con il fumo che saliva da tre
            angoli.
          effetti: { prove.malgrani: 0.5, ferite: 0.5, pista.registro: 1 }
      - testo: "Confrontare le date con il registro"
        descrizione: "Gli incendi hanno una data, e anche i carri di grano nel registro di Maedric."
        requisiti: [registro.decifrato >= 1]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Le date
          testo: |
            Metti le date degli incendi accanto alle righe del registro di Maedric.
            Dopo ogni incendio, entro un mese, sul Ponte dei Morti cominciano a
            passare di notte carri di grano per i Malgrani, dagli stessi villaggi
            che macinavano al mulino bruciato. È successo tutte e tre le volte, e
            nei libri del mulino quel grano risulta comprato al mercato.

            Ricopi le date su un foglio a parte, in colonna. Brey ti guarda da
            dietro i sacchi e si dimentica di starnutire.
          effetti: { prove.malgrani: 2, pista.registro: 1 }
        fallimento:
          titolo: I mesi che non tornano
          testo: |
            Metti le date degli incendi accanto alle righe del registro, ma i
            libri del mulino contano gli anni a modo loro, dalla fondazione della
            casata, e il registro di Maedric li conta come la Gilda. Ti perdi nei
            conti fino a sera.

            Alla fine l'unica cosa certa è che dopo l'incendio di Rivopuma sul
            Ponte dei Morti hanno cominciato a passare di notte i carri dei
            villaggi che macinavano lì.
          effetti: { prove.malgrani: 1, pista.registro: 1, tormento: 0.5 }
      - testo: "Metterti in coda con le donne della Città Bassa"
        descrizione: "In coda c'è gente che ti ha visto crescere. Al mulino si aspetta a lungo, e mentre si aspetta si parla."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: La coda
          testo: |
            Ti metti in coda dietro una lavandaia che ti tirava le orecchie quando
            rubavi le mele dal suo cesto, e l'orecchio sinistro se ne ricorda per
            conto suo e si scalda. In mezz'ora la coda ti racconta quello che Brey
            non dice. I carri arrivano di notte, dopo la seconda campana, dai
            villaggi che macinavano a Rivopuma, e il garzone che li scarica beve
            alla Pignatta e parla troppo.
          effetti: { prove.malgrani: 1, informazioni.voce: 1, pista.registro: 1 }
      - testo: "Parlare a Brey come si parla a chi ha paura del padrone"
        descrizione: "A Ghoran hai visto molti uomini con quel tic all'occhio. Avevano tutti un padrone che non perdonava."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Il padrone
          testo: |
            Invece di fargli domande gli racconti che a Ghoran i sorveglianti dei
            recinti avevano lo stesso tic, l'ultima settimana prima che il padrone
            li vendesse insieme agli schiavi. Ti porta dietro i sacchi e parla a
            voce bassa, con gli occhi sulla porta.

            Dopo ogni incendio arrivavano di notte i carri dei villaggi che prima
            macinavano altrove, e lui firmava le bolle senza il timbro della Gilda
            perché così voleva il padrone. «Ho abbassato il prezzo della farina»
            dice alla fine, «perché è l'unica cosa che qua dentro decido io.»
          effetti: { prove.malgrani: 2, pista.registro: 1 }
      - testo: "Leggere Rivopuma come un bosco bruciato"
        descrizione: "Al Circolo hai imparato a leggere un incendio nell'erba che ricresce dopo. A Rivopuma sono passati due anni, il tempo giusto."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: L'erba sopra la cenere
          testo: |
            Le ortiche crescono fitte soltanto in tre angoli, dove la terra si è
            presa olio e cenere, e in ognuno, fra le radici, trovi i cocci di una
            giara da olio di quelle grosse da magazzino. Il fuoco è partito da tre
            punti insieme.

            La macina è spaccata da un cuneo di ferro ancora piantato nella
            fessura. Torni in città con un coccio avvolto nel fazzoletto e le mani
            che pizzicano di ortica fino a sera.
          pe: { natura: 3 }
          effetti: { prove.malgrani: 1, pista.registro: 1 }

  # ------------------------------------------------------------ 4 → 5 · il rapporto a Galdrick
  - id: galdrick-e-il-registro
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: Il registro sul tavolo dello sceriffo
    sommario: "Hai il registro di Maedric decifrato e quello che hai visto ai mulini. Galdrick aspettava carte come queste da anni."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo
    area: quartieri-alti
    requisiti: [pista.registro == 4, pista.tribu < 4]
    testo: |
      Sul muro maestro dell'ufficio la crepa della razzia è coperta da una toppa d'intonaco fresco, e qualcuno
      ci ha già appeso un calendario storto. Galdrick legge seduto il registro di Maedric con la trascrizione
      accanto, e muove le labbra sui nomi.

      «Maedric Holl lo conosco di fama, e nessuno era mai riuscito a mettergli addosso una carta» dice alla
      fine, e chiude il registro. «Gli Scuri vendono quello che passa sui ponti, e gli orchi sui ponti non ci
      passano. Con la razzia non c'entrano, e adesso posso metterlo agli atti.» Batte un dito sui cappucci
      disegnati.

      «La Gilda si regola da sola, e Cordani è l'unico pulito che le resta. Ottone Malgrani invece siede in
      Consiglio, e Julia Castaldi gli deve il grano di mezza città. Per portarlo davanti al Consiglio servono
      prove che non si spieghino in altro modo.»

      {origine rampollo-dei-quartieri-alti} Ottone Malgrani lo conosci di vista dai salotti, con i baffi
      biondi e il panciotto ricamato. In famiglia ne parlano come di un vicino troppo ricco, e mai davanti ai
      domestici.

      «Le carte adesso ci sono. Mi servono persone che non stiano né con la Gilda né con loro, e in città ne
      conto poche. Ti farò cercare.»
    opzioni:
      - testo: "Consegnargli tutto"
        descrizione: "Il registro con la trascrizione, e quello che hai visto ai mulini."
        requisiti: [jass <= 1]
        esito:
          titolo: Agli atti
          testo: |
            Gli lasci il registro e la trascrizione, e gli racconti quello che hai
            visto ai mulini. Galdrick chiama il furiere e gli fa chiudere tutto
            nella cassa di ferro sotto il calendario, che si apre con due chiavi.

            «Con questo Cordani può ripulire la Casa dei Nodi se vuole, e io posso
            aspettare gli Scuri dove passano» dice. Ti stringe la mano forte, poi
            rimette i pollici nella cintura e torna a guardare il calendario come
            se ci avesse segnato sopra il giorno.
          effetti: { rep.caserma: 1, pista.registro: 1, racconto: 1 }
      - testo: "Consegnargli tutto"
        descrizione: "Il registro con la trascrizione, e quello che hai visto ai mulini."
        requisiti: [jass >= 2]
        esito:
          titolo: La casa di Via dei Rasoi
          testo: |
            Gli lasci il registro e la trascrizione, e gli racconti quello che hai
            visto ai mulini. Galdrick fa chiudere tutto nella cassa di ferro sotto
            il calendario, che si apre con due chiavi.

            «E Nerissa…» comincia, e si corregge subito. «La casa di Via dei
            Rasoi, dopo la faccenda della ragazza rossa. È tranquilla, adesso?»
            Gli rispondi quello che sai, e lui annuisce piano, due volte.
          effetti: { rep.caserma: 1, pista.registro: 1, racconto: 1 }
      - testo: "Tenerti una copia"
        descrizione: "Le pagine del grano potrebbero servirti, il giorno che il Consiglio dovrà ascoltarti. Lo sceriffo però conta tutto."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Le pagine del grano
          testo: |
            Gli consegni il registro e la trascrizione, tranne quattro fogli che
            restano piegati nella fodera della tua giubba. Sono le pagine dei
            carri di grano per i Malgrani, ricopiate con la tua grafia. Galdrick
            conta i fogli muovendo le labbra. Il numero gli torna, perché la
            trascrizione l'hai rinumerata tu, e li chiude nella cassa di ferro.

            Uscendo dalla Caserma senti la carta frusciare a ogni passo, e tieni
            il braccio stretto contro il fianco fino in fondo alla discesa.
          effetti: { prove.malgrani: 1, pista.registro: 1, racconto: 1 }
        fallimento:
          titolo: Il taccuino
          testo: |
            Galdrick conta i fogli della trascrizione e alla fine alza gli occhi. «Ne
            mancano quattro» dice, e tende la mano aperta sopra il tavolo.

            Li tiri fuori dalla fodera della giubba, e lui li mette nella cassa
            insieme agli altri. Poi prende il taccuino dalla tasca della divisa e ci
            scrive una riga con la sua matita corta.

            «Capisco perché l'hai fatto» dice senza cattiveria, mentre rimette il
            taccuino in tasca.
          effetti: { sospetto: 1, pista.registro: 1, racconto: 1 }
      - testo: "Chiedere una ricompensa"
        descrizione: "Hai rischiato la pelle su un ponte di notte per un lavoro da Caserma. Bisogna ricordarglielo con garbo."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: La cassa delle spese
          testo: |
            Gli ricordi le balestre nella nebbia del Ponte dei Morti, e gli fai
            notare che per un lavoro così la Caserma avrebbe mandato un sergente e
            sei uomini. Galdrick ci pensa, poi apre la cassa delle spese di servizio
            e conta la somma sul tavolo di persona, senza chiamare il furiere.

            «Firma qui» dice, e ti porge la ricevuta. «La prossima volta che sali su
            un ponte di notte, però, dimmelo prima.»
          effetti: { monete: 20, pista.registro: 1, racconto: 1 }
        fallimento:
          titolo: Il tariffario
          testo: |
            Galdrick ti ascolta fino in fondo con i pollici nella cintura. Poi ti
            spiega che per i rapporti la Caserma ha un tariffario, e che alla voce
            *registri sequestrati* c'è scritta una cifra da niente. Il furiere te
            la conta contro ricevuta.

            Lo sceriffo intanto guarda il calendario appeso sulla toppa
            d'intonaco, e quando ti saluta lo fa con un cenno del capo, senza
            togliere le mani dalla cintura.
          effetti: { monete: 8, rep.caserma: -0.5, pista.registro: 1, racconto: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ 4 → 5 · variante: dopo la partenza di Galdrick per Ghoran
  # Dal congedo delle tribù (pista.tribu >= 4) il registro si consegna al furiere. Se Galdrick è a Ghoran
  # (galdrick.via == 1) resta al furiere; se è già tornato (fine di Acciaio e Ira) arriva dal cortile.
  - id: il-registro-alla-caserma
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Il registro alla Caserma
    sommario: "Hai il registro di Maedric decifrato e quello che hai visto ai mulini. Alla Caserma qualcuno deve prenderlo in consegna per lo sceriffo."
    luogo: Guarnigione di Qir-Azel, il corridoio del mastio
    area: quartieri-alti
    requisiti: [pista.registro == 4, pista.tribu >= 4]
    testo: |
      Le due guardie al portone ti riconoscono e ti fanno passare con il registro sotto il braccio.

      Il furiere tiene il banco delle consegne in fondo al corridoio del mastio, sotto la teca con la spada di
      Ivo Carstan. È un uomo piccolo con le dita macchiate di ceralacca e un mazzo di chiavi alla cintura.
      Posi sul banco il registro di pelle con la trascrizione, e lui ti guarda da sopra gli occhiali. Poi apre
      la prima pagina con la punta della penna e la richiude subito, come se avesse toccato una pentola calda.

      «Roba per lo sceriffo. Queste carte le apre lui e nessun altro, e la cassa dove vanno si apre con due
      chiavi e una ce l'ho io» dice il furiere.
    opzioni:
      - testo: "Aspettare lo sceriffo"
        descrizione: "Galdrick è tornato da Ghoran. Il registro vorrà leggerlo lui, e da te vorrà sapere dei mulini."
        quando: [galdrick.via == 0]
        esito:
          immagine: personaggi/toren-galdrick
          titolo: Il registro sul banco
          testo: |
            Galdrick arriva dal cortile dopo un'ora, con la polvere delle reclute
            sugli stivali e la faccia di uno che ha dormito poco a Ghoran e meno
            al ritorno. Legge il registro in piedi al banco del furiere, con la
            trascrizione accanto, e muove le labbra sui nomi.

            Quando arriva ai cappucci disegnati batte un dito sulla pagina e dice
            che gli Scuri vendono quello che passa sui ponti, e che gli orchi sui
            ponti non ci passano, quindi con la razzia non c'entrano. Poi fa
            chiudere tutto nella cassa di ferro e ti stringe la mano forte. «Le
            carte che mi mancavano adesso ci sono. Contro gli Scuri mi muoverò
            quando avrò gli uomini giusti, e allora ti farò cercare.»
          effetti: { rep.caserma: 1, pista.registro: 1, racconto: 1 }
      - testo: "Lasciarlo al furiere"
        descrizione: "Lo sceriffo è a Ghoran e non si sa quando torna. Il furiere ha una delle due chiavi e una penna per la ricevuta."
        quando: [galdrick.via == 1]
        esito:
          titolo: La ricevuta
          testo: |
            Il furiere ti dice che lo sceriffo è ancora a Ghoran e che per il
            ritorno nessuno gli ha dato una data, e lo dice con un sospiro. Poi
            apre la cassa di ferro nell'ufficio con
            la sua chiave e con la copia dell'altra, che il carceriere gli porta
            su dalle celle, e ci chiude dentro il registro e la trascrizione.

            «Quando torna lo legge prima di togliersi gli stivali» dice, «e poi ti
            farà cercare, perché con chi gli porta carte buone fa sempre così.»
          effetti: { rep.caserma: 1, pista.registro: 1, racconto: 1 }
