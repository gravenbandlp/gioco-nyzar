# La pista "Il registro del custode" (pista.registro 0 → 5): il custode notturno del Ponte dei Morti,
# il suo registro cifrato, i mulini bruciati e il rapporto a Galdrick.
storylet:
  # ------------------------------------------------------------ 0 → 1 · il Ponte dei Morti, di notte
  - id: il-ponte-dei-morti-di-notte
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: Il Ponte dei Morti, di notte
    sommario: "Ti hanno parlato del tizio dei ponti, quello del turno di notte. Dopo la seconda campana il Ponte dei Morti è suo."
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [pista.registro == 0, indizio.custode-notturno >= 1]
    testo: |
      Dopo la seconda campana i Ponti Sospesi spengono quello che si può
      spegnere. Restano accese le lanterne di Mana, abbastanza distanti l'una
      dall'altra perché in mezzo ci sia sempre un tratto di buio, ed è lì che
      la nebbia sale dalla Cicatrice e si stende sulle assi all'altezza delle
      ginocchia. Cammini dentro qualcosa di bagnato che non vedi, e le gambe
      se ne lamentano prima di te.

      Al Ponte dei Morti arrivi con la giubba incollata alle spalle e un
      brivido che ti è salito lungo la schiena al terzo pilone e non se n'è
      più andato. Appoggi la mano al parapetto. Il metallo annerito è così
      freddo che per un momento credi che sia bagnato, poi ti accorgi che lo
      è davvero. Sopra il vuoto dondolano a centinaia le lanterne dei
      Raschiatori, ognuna con il suo piccolo cristallo acceso per un compagno
      rimasto nel Labirinto.

      {percezione Facile} Ce n'è una più vicina delle altre. Sul vetro
      qualcuno ha inciso con la punta di un coltello *paga il debito*, e
      sotto, più piccolo, *quando torni*.

      {empatia Media} La seconda frase l'ha scritta un'altra persona. Ha
      premuto meno sul coltello, per non rovinare quella che c'era già.

      Di notte il ponte lavora. Ti passa davanti un carro con le ruote
      fasciate di stracci, tirato da un mulo con gli zoccoli avvolti nella
      tela, e l'unica cosa che senti è il fiato caldo dell'animale, che fa
      due nuvole piccole nella nebbia. All'imbocco un facchino con la
      gerla vuota aspetta che qualcuno lo paghi per portare qualcosa.

      {conoscenze-della-strada Media} Le merci che viaggiano in silenzio
      pagano la gabella in silenzio, cioè non la pagano. Il facchino lo sa
      benissimo, e aspetta una moneta per portare qualcosa e un'altra per
      scordarsi cosa ha portato.

      Su una cassa rovesciata due Raschiatori della veglia, vecchi, con i
      capelli bianchi incollati alla fronte dalla nebbia, si passano una
      borraccia senza parlare. Uno beve, si pulisce la bocca con il dorso
      della mano e intanto guarda sempre la stessa lanterna, con l'attenzione
      che si dà alla finestra di casa propria.

      {origine apprendista-raschiatore} Gli occhi ti vanno da soli alle
      lanterne della tua squadra, prima ancora che tu decida di cercarle.
      Le conti come si contano le teste a fine turno sulla piattaforma, e
      quando hai finito ti accorgi di aver trattenuto il fiato.

      {origine accolito-del-velo} In Cattedrale ti hanno insegnato le
      parole per i morti che non tornano su, e le labbra le cominciano da
      sole. Le tieni chiuse, perché nessuno dei due vecchi ti ha chiesto
      una preghiera, e qui i morti hanno già chi li veglia.

      {resilienza Facile fallita} Hai freddo. Lo sapevi già, ma adesso lo
      sanno anche le mani, che ti si infilano sotto le ascelle senza aver
      chiesto il permesso.

      In fondo al ponte c'è un gabbiotto dei Custodi di Passaggio, con la
      finestra socchiusa e una lampada accesa dentro, e fuori la tavoletta dei
      turni appesa a un chiodo. *Il tizio dei ponti, quello di notte, sta da
      qualche parte in questa nebbia.* Un altro carro ti scivola accanto, e
      del mulo senti soltanto il respiro.
    opzioni:
      - testo: "Aspettare nell'ombra e guardare chi passa"
        descrizione: "Contare i carri, e guardare chi li ferma, se qualcuno li ferma."
        prova: { attributo: mentale, abilita: [percezione, furtivita], difficolta: Media }
        successo:
          titolo: Le ruote fasciate
          testo: |
            Ti accucci dietro una trave, fra due lanterne spente da anni, e
            aspetti con le ginocchia che si lamentano a ogni campana. Fino
            all'alba passano sette carri, e nessuno si ferma a pagare al
            gabbiotto. Da ognuno scende il carrettiere e mette qualcosa in mano
            a un uomo pallido avvolto in un mantello cerato, che lo annota in un
            libretto di pelle e mai nel registro della Gilda incatenato al
            banco. Sei uomini con le balestre a tracolla tengono i due capi del
            ponte.

            {armi-da-distanza Media} Balestre leggere, buone a trenta passi e
            inutili a cinquanta, con la nebbia che c'è. Chi le ha scelte pensava
            a un ponte stretto, dove nessuno ha spazio per scansarsi.

            Due carri portano sacchi di grano con lo stemma dei Malgrani,
            l'albero trafitto da una lama, dipinto sulla tela. Quando la nebbia
            si ritira leggi la tavoletta appesa al chiodo, dove in gesso, sotto
            la parola *notte*, c'è scritto *Maedric Holl*.
          effetti: { pista.registro: 1 }
        fallimento:
          titolo: Una balestra nella nebbia
          testo: |
            Ti accucci dietro una trave e conti i carri. Al quinto ti scappa uno
            starnuto soffocato nella manica, un rumore che in una taverna
            nessuno sentirebbe. Un balestriere dell'imbocco alza la
            testa e guarda dritto verso la tua trave, e dietro di lui un uomo
            pallido avvolto in un mantello cerato smette di scrivere nel suo
            libretto e guarda dalla stessa parte. Restano così finché la nebbia
            sale di nuovo a coprirli.

            Te ne vai lungo il parapetto con il cuore che ti batte nei denti.
            Passando davanti al gabbiotto leggi la tavoletta dei turni, dove in
            gesso, sotto la parola *notte*, c'è scritto *Maedric Holl*. Adesso
            Maedric Holl conosce la tua sagoma, e tu non conosci ancora la sua
            faccia.
          effetti: { pista.registro: 1, sospetto: 0.5 }
      - testo: "Sederti con i Raschiatori della veglia"
        descrizione: "Passano la notte accanto alle lanterne della loro squadra, e da quella cassa vedono tutto quello che attraversa il ponte."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La veglia
          testo: |
            Ti siedi sulla cassa accanto a loro e per un po' stai zitto anche
            tu, che è la parte più difficile. Alla fine la donna ti passa la
            borraccia. Dentro c'è liquore di radice allungato con l'acqua, e ti
            scende in gola come un ricordo di casa d'altri. Le chiedi per chi
            vegliano, e lei ti dice tre nomi, ciascuno con il suo anno.

            {empatia Facile} Li dice nell'ordine in cui sono scesi, il più
            vecchio per primo. È un elenco che ripete da tanto tempo, e
            dirlo a uno sconosciuto le fa bene.

            Quando le chiedi dei carri indica il gabbiotto con il mento. «Il
            custode di notte è Maedric Holl» dice. «Alle nostre lanterne non
            mette mai le mani, e per questo lo lasciamo stare. Quello che passa
            qui sopra la Gilda non lo vede.» L'uomo aggiunge che i carri con il
            grano dei Malgrani passano da anni, sempre dopo la seconda campana.
            Quando Maedric esce dal gabbiotto, pallido nel suo mantello cerato,
            la donna smette di parlare e si riprende la borraccia.
          effetti: { pista.registro: 1 }
        fallimento:
          titolo: Troppe domande
          testo: |
            I due ti lasciano sedere, ma alla terza domanda l'uomo si alza e ti
            chiede se sei venuto a vegliare o a contare. Gli rispondi male, con
            la voce di quando sei stanco e hai freddo, e te ne penti mentre
            ancora parli. La donna ti dice soltanto che il custode di notte si
            chiama Maedric Holl e che alle lanterne non mette le mani, poi ti
            indica una trave più in là.

            Resti lì fino all'alba, fra le lanterne di gente che non hai mai
            conosciuto. Vedi Maedric uscire dal gabbiotto nel suo mantello
            cerato e i carri passare senza pagare. A ogni raffica le lanterne
            sbattono contro il metallo, e ti sembra di sentire chiamare dei
            nomi.

            {resilienza Media fallita} Dopo un po' smetti di dirti che è il
            vento, e cominci a chiederti se fra quei nomi ci sia anche il tuo.
          effetti: { pista.registro: 1, tormento: 0.5 }
      - testo: "Pagare il facchino all'imbocco"
        descrizione: "Qualche moneta, e un facchino dei ponti si ricorda di tutto quello che ha portato di notte."
        requisiti: [monete >= 5]
        esito:
          titolo: La gerla vuota
          testo: |
            Il facchino morde una delle monete, più per abitudine che per
            sospetto, e se le infila tutte nella fascia che porta in vita, dove
            spariscono in una piega che deve avere cucito apposta. Poi si
            appoggia alla gerla e ti racconta tre mesi di notti, con la
            precisione di uno che di giorno non ha nessuno a cui raccontarle.

            Il custode di notte è Maedric Holl, quello pallido con il mantello
            cerato che sta uscendo adesso dal gabbiotto. Davanti a lui i carri
            con le ruote fasciate non pagano la gabella della Gilda. Pagano lui,
            e lui li segna in un libretto suo. Più di una volta il facchino ha
            scaricato in fondo al ponte sacchi di grano con lo stemma dei
            Malgrani, e li ha portati giù fino ai magazzini della Città Bassa.
            «Mai visto un timbro della Gilda» dice. «In tre mesi, mai.» Sputa di
            lato, lontano dalle lanterne, per rispetto dei morti.
          pe: { conoscenze-della-strada: 5 }
          effetti: { monete: -5, pista.registro: 1 }
      - testo: "Vegliare con loro le lanterne della squadra"
        descrizione: "Sai come ci si siede a una veglia dei Raschiatori. Prima di qualunque domanda si dice il nome di uno rimasto sotto."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Un nome per la lanterna
          testo: |
            Ti siedi sulla cassa senza chiedere permesso, come si fa alla
            veglia, e prima di ogni altra cosa dici il nome di un compagno che
            dalla piattaforma è sceso una volta di troppo. Ti esce più roco di
            come lo ricordavi. La donna annuisce e ti passa la borraccia. Il
            liquore di radice è allungato con l'acqua, come piace ai vecchi, e
            lascia in bocca un gusto di corda bagnata.

            Quando le chiedi dei carri ti indica il gabbiotto con il mento.
            «Maedric Holl, il custode di notte. Lo lasciamo stare perché alle
            nostre lanterne non mette le mani.» L'uomo aggiunge che il grano dei
            Malgrani passa da anni, sempre dopo la seconda campana, e che a te
            lo dice perché i calli che hai sui palmi li fa soltanto la corda
            della Cicatrice.
          effetti: { pista.registro: 1, rep.raschiatori: 0.5 }
      - testo: "Dire le parole del Velo per le lanterne"
        descrizione: "A una veglia si accetta anche una benedizione, se chi la dice non chiede niente in cambio."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Le parole corte
          testo: |
            Ti fermi davanti alla lanterna con il vetro inciso e dici a mezza
            voce le parole del Velo per i morti senza tomba, quelle corte,
            senza l'inchino. La donna smette di bere a metà sorso e aspetta
            che tu abbia finito. Poi ti passa la borraccia senza dire niente.
            Dentro c'è liquore di radice allungato con l'acqua, e ti scalda la
            gola più della preghiera.

            «Il custode di notte è Maedric Holl» dice dopo un po', e indica il
            gabbiotto con il mento. «Alle nostre lanterne non mette mai le
            mani, e per questo lo lasciamo stare.» L'uomo aggiunge che i carri
            con il grano dei Malgrani passano da anni, sempre dopo la seconda
            campana. Quando Maedric esce dal gabbiotto, pallido nel suo
            mantello cerato, la donna si riprende la borraccia e ti chiede di
            ridirle, più piano, davanti a una lanterna più in là.
          effetti: { pista.registro: 1 }

  # ------------------------------------------------------------ 1 → 2 · Maedric Holl
  - id: maedric-holl
    presso: ponte-dei-morti
    immagine: personaggi/maedric-holl
    titolo: Il custode notturno
    sommario: "Maedric Holl tiene il Ponte dei Morti dalla seconda campana all'alba, con sei uomini della Gilda e un libretto di pelle sotto il mantello."
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [pista.registro == 1]
    testo: |
      Torni la notte dopo, alla stessa campana, con la giubba ancora umida
      dalla notte prima perché non ha avuto il tempo di asciugarsi. Maedric
      Holl è appoggiato al parapetto di un tratto laterale, accanto a una
      lanterna che illumina soltanto il suo mantello cerato, lucido di
      nebbia. Ai due capi del ponte stanno sei uomini della Gilda, con le
      balestre a tracolla e le lame corte alla cintura. Uno porta il
      mantello dei Custodi rovesciato, per non farsi riconoscere, e sulla
      fodera si vede una toppa cucita a punti piccoli e regolari, da
      qualcuno che gli vuole bene.

      {armi-da-mischia Facile} Le lame corte sono da taglio, buone per un
      corridoio o per un ponte largo due uomini. Le portano basse sul
      fianco, dove la mano le trova senza guardare.

      Maedric si volta solo dopo un po'. Ha il viso pallido e gli occhi
      acquosi. Le labbra sottili non sorridono mai del tutto, e la voce non
      va più in là di due passi, così che per sentirlo devi farli tu.

      «I ponti di notte non sono i ponti di giorno» dice. «Chi non lo sa
      paga il prezzo del giorno, e si sorprende.» Ti guarda la faccia con
      calma, come si guarda una merce sul banco. «Ti ho già visto, la sera
      del Festival. Eri fra quelli che tenevano testa agli orchi. Tu che
      prezzo paghi?»

      {politica-ed-economia Media} Parla di prezzi anche quando parla del
      tempo. Per un uomo così il mondo è una tariffa, e chi non ha un
      prezzo è soltanto uno che non l'ha ancora detto.

      {origine mercante-dei-ponti} Quello sguardo lo conosci, perché è il
      tuo quando al banco arriva un cliente nuovo e devi capire quanto può
      spendere prima che apra bocca. Fa uno strano effetto trovarsi
      dall'altra parte del bancone.

      Sotto i tuoi piedi un'asse si muove, e lo stomaco ti scende di un
      gradino verso la Cicatrice. *Su un ponte così stretto sei balestre
      bastano e avanzano.* Il balestriere con la toppa sposta il peso da un
      piede all'altro, e la sua balestra gli scivola di un palmo lungo la
      spalla.
    opzioni:
      - testo: "Presentarti come cliente"
        descrizione: "Hai una merce da far passare senza registro, o almeno devi sembrarlo. Lui intanto ti peserà."
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il peso giusto
          testo: |
            Gli parli di tre casse di cristalli non registrati e di una notte
            senza luna, e la bugia ti viene così liscia che quasi ti dispiace
            di non avere davvero le casse. Lui ti ascolta con la testa
            inclinata. «Tutto passa, se il peso è giusto» dice. «Dimmi cosa e
            quando. Il resto è discrezione.»

            Ti porta nel gabbiotto per fissare la tariffa e tira fuori da sotto
            il mantello un registro rilegato in pelle e scritto a numeri e
            piccoli disegni. Poi un carro si ferma storto all'imbocco, e lui
            esce a sistemare la faccenda lasciando il registro sul banco per il
            tempo di tre frasi a voce bassa. Te lo infili sotto la giubba alla
            seconda, e la pelle umida ti si appiccica alla camicia.

            La notte dopo il gabbiotto è chiuso, e sulla tavoletta dei turni il
            nome di Maedric è stato cancellato con una manica.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: Pesato
          testo: |
            Gli parli di tre casse di cristalli e di una notte senza luna.
            Maedric ascolta e ti chiede da quale imbocco arriveranno le casse,
            e dopo un po' chi te le ha vendute. Lo chiede senza fretta, una
            domanda alla volta, come si recupera una lenza. Alla terza rispondi
            «un amico», e ti accorgi tardi che l'avevi già detto.

            {ingannare Media fallita} La storia delle casse ti sembrava solida
            finché la raccontavi a te stesso. Detta a lui, comincia a perdere
            pezzi a ogni domanda.

            «Un amico» ripete lui, e il mezzo sorriso resta dov'è. Gli occhi
            acquosi si spostano sul balestriere più vicino mentre ti propone di
            lasciare stare le casse e di parlare di quello che sai davvero.
          effetti: { sospetto: 0.5 }
          segue: maedric-holl-il-prezzo
      - testo: "Dirgli quello che sai"
        descrizione: "Quello che sai dei custodi comprati e dei carri con le ruote fasciate. Vediamo che faccia fa."
        costo: 0
        esito:
          titolo: Gli occhi acquosi
          testo: |
            Glielo dici a voce bassa, come parla lui. Gli racconti dei custodi che si
            comprano con una mancia e dei carri dei Malgrani che passano senza
            timbro, e gli dici che hai visto dove li annota. Il mezzo sorriso
            resta fermo dov'è.

            Gli occhi invece si spostano sul balestriere più vicino, che a un
            cenno della mano si allontana di tre passi e resta a guardare la
            nebbia. Maedric si stringe nel mantello cerato fino a farlo
            scricchiolare, poi per la prima volta ti guarda dritto in faccia.

            {armi-da-distanza Media} Ha allontanato l'uomo che poteva sentire, e le
            altre cinque balestre restano dove sono. Quello che sta per dirti
            non vuole che lo sappiano i suoi.
          segue: maedric-holl-il-prezzo
      - testo: "Minacciarlo davanti ai suoi uomini"
        descrizione: "Lui ha sei uomini con le balestre, e il ponte è stretto. Se cominci tu, qualcuno finisce di sotto."
        combattimento: maedric-sul-ponte
        vittoria:
          titolo: Isolato
          testo: |
            La nebbia si infittisce di colpo, e i balestrieri tagliano le corde
            delle lanterne più vicine per toglierti la luce. Le assi sono
            viscide e tu ti tieni lontano dal parapetto, con le piante dei piedi
            che cercano i chiodi per avere presa. Metti a terra il balestriere
            con la toppa sulla fodera, e ti dispiace un poco per chi gliel'ha
            cucita. Poi ti giri verso le sagome all'imbocco.

            Quando vedono il compagno a terra gli altri arretrano nella nebbia,
            e i loro passi si allontanano sulle lastre. Maedric resta solo, con
            la schiena contro il parapetto e le mani alzate all'altezza del
            petto. Per la prima volta da quando lo conosci respira forte.
          segue: maedric-in-ginocchio
        sconfitta:
          titolo: La borsa nella nebbia
          testo: |
            I balestrieri tagliano le corde delle lanterne una dopo l'altra, e
            il buio ti arriva addosso insieme alla nebbia. Un dardo ti apre la
            manica. Un colpo alle gambe ti manda sulle assi viscide, con le
            dita aggrappate al bordo e la luce della Cicatrice a un palmo dalla
            faccia.

            {acrobazia Facile} Le dita hanno trovato da sole la giuntura fra
            due assi, l'unico punto dove il legno non scivola. Le ringrazierai
            più tardi, quando avrai il tempo di avere paura.

            Quando riesci a rialzarti il ponte è vuoto. Da sotto le assi arriva
            il cigolio di una corda tesa, poi più niente. Accanto al parapetto
            trovi la borsa di cuoio che Maedric ha perso scendendo. Dentro c'è
            un registro rilegato in pelle e scritto a numeri e piccoli disegni.
            Entro sera alla Pignatta sapranno che ce l'hai tu.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -1, pista.registro: 1 }
      - testo: "Trattare la tariffa da mercante dei Ponti"
        descrizione: "Hai la licenza della Gilda, e sai come si tratta quello che nei registri non si scrive."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Facile }
        successo:
          titolo: Fra colleghi
          testo: |
            Gli mostri il sigillo della tua licenza e gli chiedi quanto costa far
            passare di notte un carico che la Casa dei Nodi non deve vedere. Lo
            chiedi con il tono che usi al banco quando un cliente vuole lo sconto e
            tutti e due sapete che lo avrà. Maedric ti ascolta con la testa
            inclinata, e il mezzo sorriso, per una volta, sembra sincero. «Uno
            della Gilda che paga me invece della Gilda» dice. «Mi piace.»

            Ti porta nel gabbiotto per fissare la tariffa e tira fuori da sotto
            il mantello il registro di pelle. Quando un carro si ferma storto
            all'imbocco ed esce a sistemarlo, il registro resta sul banco, e tu
            lo fai sparire sotto la giubba con il gesto con cui al banco fai
            sparire una moneta tosata. La notte dopo, sulla tavoletta dei turni,
            il suo nome è cancellato con una manica.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: Troppo in regola
          testo: |
            Gli mostri il sigillo della licenza, e Maedric lo guarda più a lungo
            di te. «Uno della Gilda che viene a comprare il silenzio da me»
            dice piano. «Oppure viene a vedere chi lo vende.» Gli occhi acquosi
            passano sul balestriere più vicino, e il sigillo ti diventa pesante
            in mano.

            {galateo Media fallita} Hai presentato le credenziali come a un
            pari grado. Un uomo che vive di cose non dette prende la cortesia
            per un'ispezione.

            Ti propone di lasciar perdere le casse e di parlare di quello che
            sai davvero.
          effetti: { sospetto: 0.5 }
          segue: maedric-holl-il-prezzo

  - id: maedric-holl-il-prezzo
    presso: ponte-dei-morti
    immagine: personaggi/maedric-holl
    titolo: Le tariffe
    tipo: seguito
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [pista.registro == 1]
    testo: |
      «Qualcuno ti ha parlato di me» dice Maedric. «Uno che ha paura, o uno
      che ha smesso di averne. Prima o poi in questa città parlano tutti.» Si
      sistema il mantello sulle spalle, e la cera scricchiola. All'imbocco
      uno dei balestrieri si toglie la balestra dalla spalla e se la tiene
      in grembo, come si tiene un gatto.

      «Senti. Io lavoro a tariffa, con tutti. Dimmi che cosa vuoi che
      dimentichi, e ti dico quanto costa dimenticarlo. Posso pagarti in
      monete, oppure con un nome che ti serve più del mio.» Lo dice piano,
      con le mani tranquille sul parapetto, e ti accorgi di esserti
      avvicinato per sentirlo.

      {empatia Difficile} Le mani sono tranquille perché le tiene ferme lui.
      Il pollice destro preme sul metallo fino a sbiancare l'unghia, e
      quell'uomo ha più paura di te.

      *Mi sta facendo abbassare la voce anche adesso.* Il sudore sulla nuca
      ti si è fatto freddo. Il ponte ondeggia appena a ogni raffica, e le
      lanterne dei Raschiatori battono piano contro il metallo del
      parapetto.

      «Se invece vuoi portarmi da Cordani, dimmi con che cosa» aggiunge.
      «Con una voce raccolta chissà dove e la tua faccia? Siamo su un ponte
      di notte, e la nebbia non testimonia. Pensaci un momento, prima di
      rendere questa cosa definitiva.» Gli uomini agli imbocchi si
      irrigidiscono senza che lui alzi un dito.

      {furtivita Media} Fra la lanterna di Maedric e la successiva ci sono
      quattro passi di buio e di nebbia. Se le cose si mettono male, è lì che
      devi stare, dove una balestra deve tirare a orecchio.
    opzioni:
      - testo: "Accettare il prezzo"
        descrizione: "Un nome da poco e qualche moneta, in cambio del tuo silenzio. Il registro resta a lui, per ora."
        esito:
          titolo: Un nome da poco
          testo: |
            Maedric ti conta in mano le monete fredde di nebbia una alla volta. Poi
            ti dà il nome. Ilario Benn, riscossore del turno di giorno alle Mille
            Corde, arrotonda i pedaggi dei carri di sale e si tiene la differenza.
            «È un nome vero» dice. «Lo puoi portare a chi vuoi, e nessuno ti
            chiederà dove l'hai preso.»

            {conoscenze-della-strada Facile} Un riscossore che arrotonda è il
            pesce più piccolo del canale. Te lo dà perché costa poco a lui, e
            perché adesso anche tu hai un prezzo scritto da qualche parte.

            Torna verso il gabbiotto, e dalla finestra lo vedi chinarsi dietro
            il banco. Quando si rialza il libretto di pelle non ce l'ha più in
            mano, e alla cassetta di ferro sul pavimento è appeso un lucchetto
            nuovo. Gli uomini riprendono i loro posti fino all'alba.
          effetti: { monete: 15, informazioni.pettegolezzo: 1 }
          segue: maedric-holl-il-gabbiotto
      - testo: "Dirgli che Cordani e lo sceriffo lo aspettano"
        descrizione: "Con calma, senza alzare la voce. Un uomo che ama vivere fa i suoi conti prima di organizzare un incidente."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La corda sotto le assi
          testo: |
            Gli dici che lo sceriffo sa dove sei stanotte, e che domattina lo saprà
            anche il Sovrintendente Cordani. Lo dici con calma, guardando la
            lanterna invece di lui, e la voce ti esce più ferma delle ginocchia.
            Maedric fa i conti a voce alta, quasi gentile. Un forestiero caduto dal
            ponte si spiega facilmente, dice lui, mentre uno di quelli che la sera
            del Festival hanno tenuto testa agli orchi si spiega molto meno.

            Poi fa un passo indietro nella nebbia e sparisce. Senti una corda
            tendersi sotto le assi, e i suoi uomini se ne vanno senza correre.
            La porta del gabbiotto è rimasta aperta, e appesa al chiodo dietro
            il banco c'è la sua borsa di cuoio con dentro il registro di pelle.
            Te la metti a tracolla e torni verso l'imbocco camminando al centro
            delle assi.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: Un incidente sul ponte
          testo: |
            Gli parli di Cordani e dello sceriffo, ma a metà frase la voce ti sale
            di un tono, come a un ragazzo che bluffa a carte, e Maedric lo sente. Fa
            un cenno piccolo con due dita. Il primo dardo si pianta nel parapetto
            accanto alla tua mano, il secondo ti entra nel fianco mentre ti butti
            sulle assi, e te lo strappi da solo con le dita che non vogliono
            chiudersi.

            {medicina Media} Il sangue esce scuro e lento, senza zampilli. La
            punta è passata nella carne del fianco e non ha toccato niente che
            serva per vivere, e adesso conviene tenere premuto.

            Quando rialzi la testa Maedric è sparito, e i suoi uomini con lui.
            Nel gabbiotto hanno rovesciato tutto in fretta. La borsa di cuoio è
            caduta dietro la stufa, con dentro il registro di pelle, e nella
            fretta nessuno l'ha trovata. Fino all'imbocco cammini con una mano
            premuta sul fianco.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { ferite: 2, rep.scuri: -1, pista.registro: 1 }
      - testo: "Mettergli le mani addosso"
        descrizione: "Hai sentito abbastanza. Lui però ha sei balestre dalla sua, e il ponte è stretto."
        combattimento: maedric-sul-ponte
        vittoria:
          titolo: Le lanterne tagliate
          testo: |
            Gli sei addosso prima che finisca di alzare la mano, e il corpo ha
            deciso per te mentre la testa stava ancora ascoltando. I balestrieri
            tagliano le corde delle lanterne per accecarti, e la nebbia si chiude
            sul ponte. Scivoli sulle assi e ti rialzi. Uno degli uomini ti arriva
            alle spalle, e lo mandi contro il parapetto, dove resta aggrappato a
            gridare.

            Gli altri sentono il grido e si ritirano verso gli imbocchi. Quando
            la nebbia si apre Maedric è rimasto solo, con le spalle al metallo e
            le mani aperte davanti al petto, e respira dalla bocca.
          segue: maedric-in-ginocchio
        sconfitta:
          titolo: Il cigolio di una corda
          testo: |
            Gli sei addosso, ma Maedric arretra di un passo e i dardi arrivano
            dalla nebbia prima di lui. I balestrieri tagliano le lanterne e il
            buio ti prende alle spalle. Finisci sulle assi viscide con una gamba
            oltre il bordo, e la luce della Cicatrice ti illumina la suola.

            Ti tiri su a forza di braccia, e le braccia tremano ma tengono. Sotto il
            ponte cigola una corda tesa, poi smette. Quando la nebbia si dirada
            restano le lanterne spente e, vicino al parapetto, una borsa di cuoio
            rovesciata con dentro un registro di pelle. Maedric l'ha persa
            scendendo, e stanotte stessa qualcuno andrà a dire agli Scuri chi l'ha
            raccolta.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -1, pista.registro: 1 }
      - testo: "Fargli capire a quali tavole ceni"
        descrizione: "Uno che vende silenzio sa quanto pesa un nome dei Quartieri Alti. Il tuo siede ai tavoli del Consiglio."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Un posto vuoto a tavola
          testo: |
            Lo sceriffo non lo nomini nemmeno. Gli dici il nome della tua
            famiglia, e poi, come per caso, quelli delle due famiglie che ti
            hanno mandato l'invito a cena su carta pesante, e di che cosa si
            parla a quelle tavole quando un ospite manca senza avvisare. Usi
            la voce dei salotti, quella che non si alza mai, e ti accorgi che
            a lui arriva meglio di un grido.

            Maedric fa i conti a voce bassa, quasi gentile. Secondo lui un
            forestiero caduto dal ponte si spiega facilmente, mentre un posto
            vuoto a una cena dei Quartieri Alti si spiega molto meno. Poi fa un passo indietro
            nella nebbia e sparisce. Senti una corda tendersi sotto le assi.
            Nel gabbiotto rimasto aperto, appesa al chiodo dietro il banco,
            c'è la sua borsa di cuoio con il registro di pelle.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: I nomi cadono come gli altri
          testo: |
            Gli dici il nome della tua famiglia, e lui lo ripete piano, come
            si assaggia un vino che non ti piace. «Dai ponti cadono anche i
            nomi buoni» dice. «Fanno lo stesso rumore, solo che poi se ne parla
            di più.» Fa un cenno piccolo con due dita. Il primo dardo si pianta
            nel parapetto accanto alla tua mano, il secondo ti entra nel fianco
            mentre ti butti sulle assi.

            {galateo Media fallita} Il nome di famiglia funziona con chi ha
            qualcosa da perdere a cena. Un uomo che non ci è mai stato invitato
            lo sente soltanto come un'offesa.

            Quando rialzi la testa Maedric è sparito con i suoi uomini, e nel
            gabbiotto la borsa di cuoio è caduta dietro la stufa, con dentro il
            registro di pelle. Fino all'imbocco cammini con una mano premuta
            sul fianco e il nome della tua famiglia ancora in bocca.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { ferite: 2, rep.scuri: -1, pista.registro: 1 }

  - id: maedric-holl-il-gabbiotto
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: Il gabbiotto
    tipo: seguito
    luogo: Ponte dei Morti, al cambio del turno
    area: ponti-sospesi
    requisiti: [pista.registro == 1]
    testo: |
      All'alba la nebbia ricade nella Cicatrice e il Ponte dei Morti torna un
      ponte qualsiasi, con le lanterne pallide nella luce grigia e i primi
      carretti del mercato che passano facendo tutto il rumore che di notte
      non si poteva fare. Maedric chiude il gabbiotto con due giri di chiave
      e se ne va verso i Quartieri Alti con il mantello cerato sul braccio,
      come un impiegato a fine turno. I suoi uomini si sparpagliano fra la
      gente.

      Il gabbiotto è una scatola di assi e lamiera agganciata al fianco del
      ponte, con la porta sul tavolato e una finestrella che dà sul vuoto. Il
      custode del turno di giorno arriva tardi tutte le mattine, e prima di lui
      passa un facchino con un sacco di carbone per la stufa. Il facchino
      porta la chiave appesa al collo con un laccio da scarpe, e ha l'aria di
      uno che l'avrebbe data a chiunque, se solo qualcuno gliel'avesse
      chiesta.

      {acrobazia Media} Dal parapetto al davanzale della finestrella c'è un
      braccio di lamiera bagnata. Si fa, se il piede non ha dubbi e la
      testa non guarda giù.

      {conoscenze-della-strada Facile} Uno che porta una chiave al collo con
      un laccio da scarpe non è mai stato pagato abbastanza per tenerla.

      Ti siedi sul parapetto, e la notte in bianco ti si posa sulle
      palpebre. Nella tasca della giubba hai le monete di Maedric, e sono
      ancora fredde. *Il registro sta in quella cassetta, a dieci passi da
      me.* Dalla finestrella sul vuoto esce l'ultimo filo di fumo della
      stufa, e le corde del ponte cigolano sotto i primi carri.
    opzioni:
      - testo: "Entrare dalla finestrella sul vuoto"
        descrizione: "Dal parapetto al davanzale c'è un braccio di distanza, e sotto c'è la Cicatrice."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Un braccio sul vuoto
          testo: |
            Quando il ponte resta vuoto scavalchi il parapetto. Allunghi una
            gamba fino al davanzale, e per un momento sotto di te c'è soltanto
            la luce della Cicatrice, che sale dal fondo e ti illumina le suole.
            Poi sei dentro, accucciato fra la stufa ancora tiepida e il banco.
            Il lucchetto della cassetta cede alla seconda spinta, perché è
            nuovo ma l'anello a cui è appeso è vecchio.

            {tecnologia Facile} Chi ha cambiato il lucchetto non ha guardato la
            ferramenta. Succede spesso a chi si fida più delle cose nuove.

            Esci dalla stessa parte con il registro sotto la giubba. Due notti
            dopo nel gabbiotto c'è un custode nuovo, giovane, che non sa
            niente, e Maedric Holl sui ponti non si è più visto.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: Appeso
          testo: |
            Scavalchi il parapetto e allunghi una gamba fino al davanzale, ma la
            lamiera è bagnata e il piede scivola. Resti appeso per le mani per
            il tempo di un respiro lunghissimo, con le ginocchia che sbattono
            contro le assi e lo stomaco che è già sceso nella Cicatrice senza
            aspettarti. Alla fine entri, e la cassetta cede alla seconda
            spinta.

            Quando esci il custode del turno di giorno è fermo sul tavolato con
            il suo pane in mano, e ti guarda risalire sul parapetto. Si mette a
            gridare, e un paio di carrettieri si voltano. Entro sera Maedric sa
            chi gli ha aperto la cassetta, e da quella notte sui ponti non lo
            vede più nessuno.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { ferite: 1, sospetto: 0.5, rep.scuri: -1, pista.registro: 1 }
      - testo: "Pagare il facchino del carbone"
        descrizione: "Qualche moneta, e la chiave appesa al laccio da scarpe gira per te."
        requisiti: [monete >= 10]
        esito:
          titolo: Il laccio da scarpe
          testo: |
            Il facchino guarda le monete a lungo, come se dovesse
            portarle su per una scala, e poi se le fa sparire in una scarpa,
            dove nessuno va a cercare volentieri. Apre il gabbiotto e scarica il
            carbone accanto alla stufa. Poi si mette a fischiare verso il vuoto,
            una canzone dei Ponti stonata sempre nello stesso punto, mentre tu
            ti inginocchi davanti alla cassetta. Il lucchetto è nuovo, ma la
            chiave piccola sta appesa allo stesso laccio della grande.

            Il facchino richiude la porta dietro di te. Due notti dopo nel
            gabbiotto c'è un custode nuovo, e di Maedric Holl sui ponti si dice
            soltanto che è sparito.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { monete: -10, rep.scuri: -0.5, pista.registro: 1 }

  - id: maedric-in-ginocchio
    presso: ponte-dei-morti
    immagine: personaggi/maedric-holl
    titolo: Senza uomini
    tipo: seguito
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [pista.registro == 1]
    testo: |
      Le lanterne tagliate penzolano dalle corde e fanno una luce bassa, di
      traverso, che illumina le assi e lascia al buio le facce. Maedric ha la
      schiena contro il parapetto. Si è inginocchiato da solo, senza che tu
      glielo chiedessi, e tiene le mani aperte davanti al petto, i palmi
      bianchi verso di te.

      {origine fuggiasco-di-ghoran} Quella posizione la conosci dalla parte
      sbagliata. A Ghoran si stava così davanti ai sorveglianti, con i
      palmi in fuori, e le tue spalle si curvano un poco per conto loro,
      come se in ginocchio ci fossi tu.

      «Il registro è qui, sotto il mantello» dice. La voce è bassa come
      prima, ma adesso gli trema sull'ultima sillaba. «È tuo. Io vorrei
      restare mio, se si può. Un uomo dei ponti ha sempre un modo per
      scendere, e il mio è legato al parapetto, a un passo dalla mia mano
      sinistra.» Te lo dice perché tu lo veda. Una corda annodata a
      intervalli regolari pende oltre il bordo, dentro la nebbia.

      {ingannare Media} Te la mostra per farti sentire generoso. Un uomo che
      ti indica l'uscita ti sta anche dicendo dove guarderà lui.

      Solo adesso ti accorgi che ti fanno male le nocche, e che una ti
      sanguina dove ha incontrato la fibbia di un balestriere. Dagli
      imbocchi non arriva più nessun passo. *Se lo lascio scendere, prima
      dell'alba gli Scuri sapranno il mio nome.* Maedric tira fuori il
      registro con due dita e lo posa sulle assi fra voi. La copertina di
      pelle è gonfia d'umidità. Poi aspetta con gli occhi fissi sulle tue
      mani, mentre il mantello cerato gli gocciola sulle ginocchia.

      {resistenza Facile fallita} Adesso che è finita, il corpo ti presenta
      il conto tutto insieme. Le gambe ti chiedono di sederti accanto a lui
      sulle assi bagnate, e non è un'idea da prendere sul serio.
    opzioni:
      - testo: "Legarlo e portarlo alla Caserma"
        descrizione: "Con la sua stessa corda, su per i Quartieri Alti, fino alla porta della Caserma."
        esito:
          titolo: Alla Caserma
          testo: |
            Gli leghi i polsi con la corda che doveva servirgli per sparire, e
            il registro te lo metti sotto la giubba. Lui non oppone resistenza.
            Per tutta la salita verso i Quartieri Alti cammina un passo davanti
            a te senza dire niente, con il mantello cerato che frusta i
            polpacci a ogni gradino, e soltanto alla porta della Caserma ti
            chiede di dire allo sceriffo che si è arreso da solo.

            Le due guardie in giaco di maglia lo prendono in consegna. Il
            sergente di turno scrive il suo nome sul registro delle celle, in
            fondo alla pagina, sotto quello di un ubriaco di Via del Salmone, e
            lo scrive storto, perché sbadiglia.
          imposta: { registro-cifrato: 1, maedric: 2 }
          effetti: { rep.caserma: 1, pista.registro: 1 }
      - testo: "Lasciarlo scendere"
        descrizione: "Prendi il registro e gli lasci la corda. Un uomo che ama vivere se lo ricorda, e si ricorda anche la tua faccia."
        esito:
          titolo: La corda
          testo: |
            Raccogli il registro e fai un passo indietro. Maedric ti guarda un
            momento, come per esserne sicuro, poi scavalca il parapetto e
            scende lungo la corda, un nodo alla volta, finché la nebbia gli
            copre la testa. La corda resta tesa ancora un po' e poi si allenta.

            {politica-ed-economia Media} Un custode comprato che sparisce è un
            debito che passa di mano. Chi lo pagava dovrà trovarsi un altro
            custode, e si ricorderà a chi deve la spesa.

            Sui ponti non lo vedrai più. Prima dell'alba, però, alla Pignatta
            Grassa sapranno che il registro del custode notturno adesso ce l'hai
            tu, e chi te l'ha lasciato prendere.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -1, pista.registro: 1 }
      - testo: "Non dargli il tempo di arrivare alla corda"
        descrizione: "La sua mano sinistra è a un passo dalla corda, e un uomo dei ponti ha sempre un trucco in più."
        esito:
          titolo: Sulle assi
          testo: |
            La mano sinistra di Maedric si muove verso il parapetto, e tu
            colpisci prima di capire se cercava la corda. Il braccio è partito
            da solo, e la testa arriva dopo, a cose fatte. Lui cade di lato
            sulle assi e non si rialza. Il mantello cerato si apre, e sotto c'è
            soltanto una camicia rammendata.

            Il registro è dove l'aveva posato. Lo raccogli con le mani che
            tremano e resti accanto al corpo finché la nebbia comincia a calare.
            Domattina sul Ponte dei Morti troveranno un custode della Gilda con
            la testa spaccata, e qualcuno dirà di aver visto la tua sagoma nella
            nebbia. Prima di andartene raddrizzi una lanterna che nella lotta si
            è storta sul gancio.
          imposta: { registro-cifrato: 1, maedric: 3 }
          effetti: { tormento: 1, sospetto: 1, pista.registro: 1 }

  # ------------------------------------------------------------ 2 → 3 · il registro cifrato
  - id: il-registro-cifrato
    presso: biblioteca-di-qir-azel
    immagine: personaggi/mattias-crenn
    titolo: Il cifrario del custode
    sommario: "Il registro di Maedric è scritto a numeri e piccoli disegni. Al primo piano della Biblioteca Mattias Crenn legge il precuriano da trent'anni."
    luogo: Biblioteca di Qir-Azel, il primo piano
    area: quartieri-alti
    requisiti: [pista.registro == 2, invito >= 1]
    testo: |
      Il primo piano della Biblioteca è un corridoio di stanzette piene di
      carte. Quella di Mattias Crenn è l'ultima, con la porta che non si
      chiude per via di una pila di monografie appoggiata contro lo stipite.
      Sulla costola della prima c'è il timbro rosso della Confraternita,
      *respinta*, e lui accanto ci ha disegnato a matita un piccolo teschio,
      con molta più cura di quanta ne meritasse la Confraternita.

      Posi il registro sul tavolo. Ti accorgi di averlo tenuto stretto contro
      il petto per tutta la salita, e la giubba ha preso l'odore della pelle
      umida. Mattias si pulisce le lenti sulla manica e apre il libro a metà.
      Per un po' resta zitto. Poi gira svelto tre pagine di fila e comincia a
      parlare a raffica.

      «Le date sono numeri, e anche le somme. I disegnini sono le merci e le
      persone. Questa ruota è un carro, questo sacco è grano. È il cifrario di
      un custode, fatto da uno che un testo precuriano non l'ha mai visto in
      vita sua.» Batte l'indice su una pagina. «La chiave però cambia ogni
      mese. Si fa, si fa. Ci vuole una notte, oppure qualcuno che sappia
      contare quasi quanto me.»

      {origine allievo-di-torvessa} Al primo anno Temmerin vi metteva
      davanti libri mastri sequestrati e cifrari peggiori di questo, e le
      dita ti vanno da sole all'inizio della pagina. Mattias se ne accorge e
      ti sposta la mano dal libro con due dita, senza smettere di parlare.

      {accademiche Media} Un cifrario con la chiave che cambia è comodo da
      scrivere e scomodo da rompere, a meno che chi lo usa ripeta la stessa
      cosa all'inizio di ogni mese. Gli uomini abitudinari la ripetono quasi
      sempre, e un custode di notte è abitudinario per mestiere.

      Si toglie gli occhiali e ti guarda per la prima volta. «Trent'anni di
      Precursori, e questa città mi porta il libro mastro di un
      contrabbandiere. Una città intera mi deve un riconoscimento.» Poi si
      rimette gli occhiali e intinge la penna.

      {empatia Facile} È offeso, ed è felice. Erano anni che non saliva
      nessuno fino all'ultima stanza a chiedergli qualcosa.
    opzioni:
      - testo: "Decifrarlo con lui"
        descrizione: "Tu leggi i numeri ad alta voce, lui cerca la chiave del mese. Serve qualcuno che sappia tenere il conto."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: La chiave di ogni mese
          testo: |
            Tu leggi i numeri e lui li scrive su un foglio, in colonna. Verso
            mezzanotte trovi la regola per primo, e il piacere ti arriva nello
            stomaco prima che nella testa. Il primo numero di ogni mese è la
            chiave, e tutto il resto va spostato di tanto. Mattias ti guarda da
            sopra le lenti e dice «bene» a denti stretti, e per un po' si
            pulisce gli occhiali più del necessario.

            All'alba il registro è aperto sul tavolo accanto a quaranta fogli
            di trascrizione, e Mattias dorme con la guancia su una monografia
            respinta, con l'inchiostro del timbro che gli si stampa al
            rovescio sulla pelle. Tu hai la nuca rigida e gli occhi che
            bruciano, e cominci a leggere.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
        fallimento:
          titolo: Le colonne sbagliate
          testo: |
            Leggi i numeri ad alta voce, ma per due volte salti una riga, e la
            seconda volta Mattias se ne accorge dopo un'ora di conti. Si toglie
            gli occhiali e si stropiccia gli occhi, e da lì in avanti non ti
            lascia più leggere. Ti manda giù a prendere l'olio per la lampada e
            poi il pane, e quando torni ha già ricominciato da capo.

            {accademiche Facile fallita} Le colonne di numeri, dopo la terza
            pagina, avevano cominciato a somigliarsi tutte. Alla quarta ti
            sembrava di leggere la lista della spesa di un fornaio.

            All'alba la trascrizione è finita, tutta con la sua grafia. Tu hai
            passato la notte seduto sulle scale, e lui ti consegna i fogli senza
            guardarti, borbottando che in fondo era un cifrario da bambini.
          imposta: { registro.decifrato: 1 }
          effetti: { tormento: 0.5 }
          segue: il-registro-decifrato
      - testo: "Pagargli la cena con Ulric"
        descrizione: "Per sé Mattias non vuole soldi. Stasera però cena con Ulric Stanne, e il vino buono costa caro."
        requisiti: [monete >= 10]
        esito:
          titolo: Il vino buono
          testo: |
            Gli metti le monete sul tavolo e gli dici che sono per il vino di
            stasera. Mattias le guarda come se fossero un'offesa personale alla sua
            carriera. Poi le conta due volte e se le infila nella manica. «Ulric
            beve soltanto quello delle colline di Laresh» dice, e ti accompagna
            alla porta lasciando il registro aperto sul tavolo.

            Quando torni, il giorno dopo, il registro è accanto a una bottiglia
            vuota e a una pila di fogli scritti fitti, e Mattias ha gli occhi
            rossi e una macchia di vino sul polsino che non si è accorto di
            avere. «Ulric dice che sono un genio» racconta mentre ti porge i
            fogli, «e al terzo bicchiere lo dice sempre, ma stavolta aveva
            ragione.»
          imposta: { registro.decifrato: 1 }
          effetti: { monete: -10 }
          segue: il-registro-decifrato
      - testo: "Proporgli il metodo di Temmerin"
        descrizione: "Al primo anno dell'Accademia Orvald Temmerin fa decifrare agli allievi i libri mastri sequestrati dalla Caserma, come esercizio prima delle iscrizioni vere."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Gli esercizi del primo anno
          testo: |
            Gli racconti che Temmerin, al primo anno, vi mette davanti i libri
            dei contrabbandieri sequestrati, e che la prima regola è cercare la
            riga che torna uguale all'inizio di ogni mese. Mattias storce la
            bocca al nome del preside come davanti a un dente cariato, ma ti
            lascia fare.

            {accademiche Facile} Temmerin lo ripeteva ogni lezione, con il
            gesso in mano. Gli uomini cambiano la chiave e mai l'abitudine.

            Trovi la riga a metà della terza pagina. Il primo numero di ogni
            mese è la chiave, e tutto il resto va spostato di tanto. Mattias
            rifà il conto due volte e dice «bene» fra i denti, come se gli
            costasse una moneta. All'alba la trascrizione è finita, e lui dorme
            con la guancia su una monografia respinta, mentre tu rileggi i
            fogli con gli occhi che bruciano.
          imposta: { registro.decifrato: 1 }
          pe: { accademiche: 3 }
          segue: il-registro-decifrato

  - id: l-archivio-dei-dazi
    immagine: personaggi/lira-demos
    titolo: L'archivio dei dazi
    sommario: "Alla Casa dei Nodi Lira Demos tiene i conti dei ponti, e da anni annota tutto quello che fa Maedric Holl in attesa di una prova."
    luogo: Casa dei Nodi, l'archivio dei dazi
    area: quartieri-alti
    requisiti: [pista.registro == 2, invito >= 1]
    testo: |
      L'archivio dei dazi occupa una sala lunga al secondo piano della Casa
      dei Nodi, con le finestre sulle catene dei ponti e il vento che fa
      tintinnare i vetri. Gli scaffali sono pieni di registri tutti uguali, e
      su ogni costola è inchiodato un tassello di legno inciso con un segno.
      Uno, in basso, è inchiodato storto da chissà quanto, e nessuno l'ha
      mai raddrizzato, forse perché per farlo servirebbe un modulo. Lira
      Demos lavora a un tavolo vicino alla finestra. È una mezzelfa con i
      capelli castani intrecciati di fili di rame sottili, e accanto al
      calamaio tiene una scatola di tasselli che ordina per forma mentre
      ascolta.

      Ti ascolta senza interromperti, e intanto le dita continuano a ordinare
      i tasselli. Quando posi sul tavolo il registro di Maedric si fermano. Lo
      apre con la punta di due dita, e ti fa venire in mente un medico che
      finalmente vede la ferita che aveva indovinato da lontano.

      {empatia Media} Le tremano appena le dita. Ha aspettato a lungo di
      avere ragione da sola, e adesso ha paura di essersi sbagliata proprio
      all'ultimo.

      «Sono sei anni che gli scrivo dietro tutto quello che vedo, e non avevo
      niente in mano» dice piano, e gira una pagina. Ti spiega che i numeri
      sono i turni di Maedric e che i disegni sono i segni dei tasselli
      dell'archivio, quelli del vecchio cifrario dei custodi, copiati male.
      Per Lira i conti dei ponti sono pratica notarile, e vedere i segni del
      suo archivio in mano a un contrabbandiere le dà quasi più fastidio
      delle somme.

      {politica-ed-economia Media} Ogni carro che passa di notte senza
      timbro è una gabella che la Gilda non incassa e qualcun altro sì. Sei
      anni di notti fanno una somma che alla Casa dei Nodi nessuno vorrà
      sentire ad alta voce.

      Un garzone passa con una pila di registri, e lei chiude il libro di
      pelle con il palmo, senza fretta. Poi ti fa cenno di sederti e avvicina
      la lampada, e tu ti siedi su una sedia che sta in piano soltanto
      grazie a un vecchio registro dei pedaggi infilato sotto una gamba.
    opzioni:
      - testo: "Riscontrarlo con i registri dei dazi"
        descrizione: "I turni di Maedric da una parte, i pedaggi registrati dall'altra. La merce è passata nelle notti in cui i conti non tornano."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Dove i conti non tornano
          testo: |
            Lira tira giù dagli scaffali sei anni di pedaggi notturni, e tu li
            leggi accanto ai turni di Maedric, una notte alla volta, finché la
            polvere dei registri ti si deposita in gola e ogni tanto devi tossire
            nella manica. Ogni volta che nel registro di pelle c'è un disegno e nei
            libri della Gilda non c'è niente, lei posa un tassello sul tavolo. A
            metà pomeriggio il tavolo è coperto di tasselli, e la chiave del
            cifrario si legge da sola nell'ordine in cui li ha messi.

            «Bel lavoro» dice Lira, e ti lascia tenere il tassello a forma di
            sacco, il primo che hai trovato tu.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
        fallimento:
          titolo: Un tassello fuori posto
          testo: |
            Leggi i turni di Maedric accanto ai pedaggi notturni, ma confondi due
            anni, e per un'ora Lira posa tasselli sulle notti sbagliate. Quando se
            ne accorge non alza la voce, e la cosa è peggio di una sgridata.
            Raccoglie i tasselli uno per uno e li rimette nella scatola in ordine
            di forma, poi ricomincia da sola dalla prima pagina.

            Finisce che è buio. Tu hai passato il pomeriggio a portarle registri
            su e giù per la scala, e il garzone ti ha visto ogni volta con il
            libro di pelle sotto il braccio. Lira ti consegna la trascrizione in
            una grafia minuta e diritta, e ti ringrazia lo stesso.

            {percezione Media fallita} Il garzone l'hai notato soltanto alla
            quinta volta. Alla quinta volta, però, lui aveva già notato te.
          imposta: { registro.decifrato: 1 }
          effetti: { sospetto: 0.5 }
          segue: il-registro-decifrato
      - testo: "Lasciarle il registro fino a domani"
        descrizione: "Lira non vuole soldi e non promette niente per iscritto. Ti chiede soltanto di aspettare."
        costo: 2
        esito:
          titolo: Pratica notarile
          testo: |
            Lira ti scrive una ricevuta per il registro e subito dopo la strappa,
            perché per iscritto non promette niente a nessuno. I due pezzi finiscono
            in due cestini diversi, uno per lato del tavolo. «Torna con la luce»
            dice, e chiude il registro nel cassetto.

            Il giorno dopo la trovi allo stesso tavolo, con la camicia di ieri e
            un filo di rame che le è scappato dalla treccia. Ha trascritto tutto
            in una grafia minuta e diritta, e nei margini ha fissato un tassello
            accanto a ogni notte che anche lei aveva annotato per conto suo, e
            sono parecchie. Ti porge i fogli tenendoli con due mani.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
      - testo: "Leggere i turni come un libro mastro"
        descrizione: "Sui Ponti hai il banco, e sai in quali notti un mercante paga la gabella e in quali no. Lira la tua gabella la registra ogni mese."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Le notti senza gabella
          testo: |
            Lira ti riconosce dal sigillo della licenza, perché la tua gabella
            passa dal suo tavolo, e per un momento ti guarda come si guarda un
            contribuente puntuale, con un affetto professionale. Le chiedi di
            tirare giù i pedaggi notturni, e mentre lei apre i registri tu ti
            segni le settimane in cui al Mercato dei Nodi il grano è calato di
            prezzo senza un motivo che un mercante sappia spiegare. Sono le
            stesse in cui nel libro di Maedric compare il sacco.

            {politica-ed-economia Facile} Grano che arriva senza gabella si
            vende sotto prezzo, e chi lo vende onesto quella settimana ci
            rimette. Al banco certe settimane si ricordano meglio dei
            compleanni.

            Lira posa un tassello su ognuna, e prima di sera la chiave del
            cifrario si legge nell'ordine dei tasselli. «Sui Ponti vi insegnano
            a contare meglio che qui dentro» dice, e lo dice guardando gli
            scaffali, come un rimprovero alla Casa dei Nodi.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato

  - id: il-registro-alla-pignatta
    presso: pignatta-grassa
    immagine: personaggi/rozalia-marga
    titolo: Il cifrario dei custodi
    sommario: "Alla Pignatta Grassa Rozalia Marga falsifica le carte della Gilda per gli Scuri, e i suoi cifrari li legge per mestiere. Tutto quello che decifra, però, finisce nelle sue cartelle."
    luogo: Pignatta Grassa, nel retrobottega
    area: citta-bassa
    requisiti: [pista.registro == 2]
    testo: |
      All'ora del mercato la Pignatta Grassa è mezza vuota, e Mauro Scrocco
      ti indica il retrobottega con il mento prima ancora che tu apra bocca.
      Sugli scaffali di legno chiaro le cartelle portano ciascuna il nome di
      una famiglia e di un mestiere, scritti a mano. Su una qualcuno ha
      scritto a matita *sigilli della Gilda, buoni*, poi ha cancellato
      *buoni* e sopra ha scritto *ottimi*.

      {origine figlio-della-citta-bassa} Da ragazzo, alla Pignatta, arrivavi
      fino alla porta del retrobottega e lì ti fermavi, perché nella Città
      Bassa si impara presto dove finisce la sala. Adesso Mauro ti ci manda
      con il mento, e il piede esita lo stesso un momento sulla soglia.

      Rozalia Marga siede al banco con la piuma d'oca dietro l'orecchio. Le
      metti davanti il registro di Maedric, e lei batte due volte la penna
      sul calamaio prima di toccarlo. Lo sfoglia con l'unghia del mignolo,
      una pagina ogni due respiri, e a metà le si piega appena un angolo
      della bocca.

      {ingannare Media} Il mezzo sorriso le è scappato su una pagina
      precisa, e lei ha subito girato la successiva per coprirlo. Su quella
      pagina c'è una riga che le interessa più della tariffa.

      «Il cifrario dei custodi, quello vecchio con i disegnini» dice. «Alla
      Casa dei Nodi lo usano da quando ero ragazza, e io ci ho imparato a
      leggere, per la precisione. Maedric ci ha messo una chiave che cambia
      ogni mese e si crede furbo.» Chiude il registro con il palmo. «Lo leggo
      in un pomeriggio. Ti avverto però che quello che passa per le mie mani
      finisce nelle mie cartelle» aggiunge, e indica gli scaffali con la
      penna.

      La sedia davanti al banco è più bassa di una spanna, e per guardarla
      devi alzare il mento, come un bambino al banco del maestro.

      {galateo Facile} La sedia l'ha segata lei, o l'ha fatta segare. È un
      vecchio trucco da anticamera, e chi lo usa in un retrobottega ci tiene
      molto a essere trattata da padrona di casa.

      *Questa donna sa già quanto vale ogni riga di quel libro.* Dalla sala
      arriva la risata di Mauro, troppo forte per una battuta sola.
    opzioni:
      - testo: "Pagare la trascrizione"
        descrizione: "Il prezzo di un pomeriggio di lavoro. Una copia resterà sugli scaffali della Pignatta, e gli Scuri sapranno che cosa c'è scritto."
        requisiti: [squiggor <= 1, monete >= 15]
        esito:
          titolo: In pari
          testo: |
            Rozalia conta le monete senza toccarle, spostandole una alla volta
            con la punta della penna, e ti dice di tornare al tramonto. Passi il
            pomeriggio in sala, con un sidro che non hai ordinato e che Mauro
            ti mette in conto lo stesso. Al tramonto la trascrizione è pronta,
            in una grafia piccola e diritta, legata con un nastro da pacchi.

            Sullo scaffale alle sue spalle c'è una cartella nuova, senza
            etichetta, dello stesso spessore. «I conti li chiudo sempre in
            pari» dice, e batte due volte la penna sul calamaio. «Tu hai la tua
            copia, io la mia.»
          imposta: { registro.decifrato: 1 }
          effetti: { monete: -15, rep.scuri: 0.5, sospetto: 0.5 }
          segue: il-registro-decifrato
      - testo: "Pagare il prezzo salito"
        descrizione: "Squiggor Ironfist è morto in Via dei Rasoi, e Rozalia non l'ha dimenticato. Il prezzo è salito, e la copia resta a lei."
        requisiti: [squiggor >= 2, monete >= 25]
        esito:
          titolo: Il conto di Squiggor
          testo: |
            Rozalia ti ascolta senza alzare gli occhi dal foglio. «Squiggor mi
            doveva qualche moneta» dice. «Adesso non me le darà più, e le metto
            sul tuo conto con gli interessi.» Il prezzo è salito di
            conseguenza. Conta le monete con la punta della penna e ti dice di
            tornare al tramonto, senza chiamarti tesoro.

            {empatia Media} Il debito c'entra poco. Di Squiggor parla al
            passato con la stessa voce con cui parla dei conti, e la penna,
            mentre lo nomina, resta ferma a mezz'aria.

            Al tramonto la trascrizione ti aspetta su un angolo del banco, e la
            copia è già in una cartella sullo scaffale. Uscendo passi davanti a
            Mauro, che stavolta continua ad asciugare i bicchieri e non grida
            il tuo nome.
          imposta: { registro.decifrato: 1 }
          effetti: { monete: -25, rep.scuri: 0.5, sospetto: 0.5 }
          segue: il-registro-decifrato
      - testo: "Convincerla a non tenersi la copia"
        descrizione: "La paga sul banco, e una buona ragione perché quel registro non finisca nelle sue cartelle. Se fallisci, paghi lo stesso."
        requisiti: [squiggor <= 1, monete >= 15]
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Una cartella in meno
          testo: |
            Le fai notare che nel registro ci sono pagamenti alla Pignatta, e
            che una copia sui suoi scaffali è proprio la carta che lo sceriffo
            verrebbe a cercare. Lo dici guardando la cartella dei sigilli
            *ottimi*, perché lei segua il tuo sguardo. Rozalia ci pensa
            battendo la penna sul calamaio tre volte invece di due, fuori dal
            solito.

            «Hai ragione, e mi secca» dice alla fine. Ti spinge indietro le
            monete con la penna e decifra il registro davanti a te, senza
            tenere niente. Al tramonto ti porge la trascrizione e brucia i fogli
            di prova nella stufa, uno per uno, mentre la guardi.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
        fallimento:
          titolo: Nelle cartelle
          testo: |
            Le spieghi perché una copia sui suoi scaffali sarebbe un rischio
            anche per lei, e Rozalia ti ascolta con la testa piegata di lato.
            «Tesoro, i rischi li tengo in ordine alfabetico» dice. «Si paga lo
            stesso, e la copia resta a me.»

            {persuasione Media fallita} Le hai spiegato il suo mestiere. Fra
            tutti gli argomenti possibili, era quello che lei conosceva meglio
            di te.

            Al tramonto la trascrizione è pronta, legata con un nastro da
            pacchi. Sullo scaffale alle sue spalle c'è una cartella nuova dello
            stesso spessore, e lei non fa niente per nasconderla.
          imposta: { registro.decifrato: 1 }
          effetti: { monete: -15, rep.scuri: 0.5, sospetto: 0.5 }
          segue: il-registro-decifrato
      - testo: "Convincerla a non tenersi la copia"
        descrizione: "Il prezzo pieno sul banco, e una buona ragione. Con Squiggor sottoterra Rozalia ti ascolta poco, e se fallisci paghi lo stesso."
        requisiti: [squiggor >= 2, monete >= 25]
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Il conto sospeso
          testo: |
            Le fai notare che nel registro ci sono pagamenti alla Pignatta, e che
            una copia sui suoi scaffali è proprio la carta che lo sceriffo verrebbe
            a cercare. Rozalia ti guarda a lungo e senza calore. Poi spinge
            indietro le monete con la penna.

            «Lo faccio perché mi conviene, e per nessun altro motivo» dice.
            «Il conto di Squiggor resta aperto.» Decifra il registro davanti a
            te senza tenerne copia, e al tramonto brucia nella stufa anche i
            fogli di prova, senza guardarti mentre lo fa.

            {furtivita Facile} Un conto aperto alla Pignatta prima o poi
            qualcuno passa a riscuoterlo. Per un po' conviene tornare a casa
            per strade diverse, e mai lungo i vicoli senza uscita.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
        fallimento:
          titolo: Con gli interessi
          testo: |
            Rozalia ti lascia parlare fino in fondo, con la penna ferma e gli
            occhi sulle tue mani, poi ti dice che Squiggor le doveva qualche
            moneta e che le mette sul tuo conto con gli interessi. «Il prezzo
            l'hai sentito, e la copia resta a me» dice. «Le ragioni buone
            portale a qualcuno che non ha appena perso un amico.»

            Al tramonto la trascrizione ti aspetta su un angolo del banco, e la
            copia è già in una cartella sullo scaffale. Mauro, quando esci, non
            alza la testa dai bicchieri, e asciuga lo stesso bicchiere da quando
            sei entrato.
          imposta: { registro.decifrato: 1 }
          effetti: { monete: -25, rep.scuri: 0.5, sospetto: 0.5 }
          segue: il-registro-decifrato

  - id: il-registro-decifrato
    immagine: fazioni/gilda-dei-mercanti
    titolo: Quello che c'è scritto
    tipo: seguito
    luogo: Il registro di Maedric, decifrato
    area: quartieri-alti
    requisiti: [pista.registro == 2, registro.decifrato >= 1]
    testo: |
      Il registro copre sei anni di notti. Lo leggi con la trascrizione
      accanto, trattenendo il fiato a ogni pagina. Ogni riga è un passaggio
      sul Ponte dei Morti che nei libri della Gilda non esiste. Accanto alla
      data ci sono la merce e la somma, e in fondo a ogni pagina c'è la parte
      di Maedric, sottolineata due volte.

      Le righe con il sacco sono quasi tutte per i Malgrani. È grano dei
      villaggi di pianura che passava di notte e finiva nei magazzini della
      Città Bassa senza timbro e senza gabella, all'inizio una volta al mese e
      negli ultimi cinque anni quasi ogni settimana. In fondo al registro ci
      sono i nomi, una ventina. Sono quasi tutti riscossori e custodi dei
      ponti, più tre funzionari della Casa dei Nodi, ognuno con la sua cifra
      mensile accanto. Ogni mese poi una somma va a un piccolo cappuccio
      disegnato, e accanto al primo cappuccio Maedric ha scritto in chiaro
      *Pignatta*. Sono i pagamenti agli Scuri, uno per ogni mese di sei anni.

      {politica-ed-economia Media} Tre funzionari della Casa dei Nodi pagati
      ogni mese fanno una porta aperta, e una ventina di custodi fanno un
      ponte intero. Il grano dei Malgrani passava in un posto dove tutti
      erano pagati per guardare altrove.

      Di orchi o di una Dama d'Argento non c'è una riga. Ti accorgi di aver
      cercato quel nome con il dito su tutte le pagine, e la delusione ti
      lascia in bocca un sapore acido.

      {resistenza Facile fallita} Ti è venuto un mal di testa che parte
      dalla nuca e si ferma dietro gli occhi, proprio dove servirebbero per
      leggere. Il corpo vorrebbe smettere, e stavolta ha ragione lui.

      Il nome di Tarquin Cordani compare una volta sola, in un margine, con il
      disegno di un occhio aperto e una nota cifrata che vuol dire *non
      avvicinare*. Fra tutti quelli della Gilda, nel registro di Maedric il
      Sovrintendente è l'unico che sembra pulito.
    opzioni:
      - testo: "Contare i carri dei Malgrani"
        costo: 0
        esito:
          titolo: I sacchi
          testo: |
            Rifai il conto dei sacchi due volte, con un dito sulle righe e
            l'altro sulle somme, e la seconda volta il totale ti sembra ancora
            più grosso, anche se è uguale. In sei anni sul Ponte dei Morti è
            passato di notte abbastanza grano da sfamare la Città Bassa per un
            inverno, e la Gilda non ne ha registrato un chicco.

            Per arrivare a Ottone Malgrani però non basta un sacco disegnato nel
            libretto di un contrabbandiere. Sul retro di un foglio ti segni di
            andare a vedere il Mulino Malgrani, l'unico rimasto in piedi in
            tutta la regione.
          pe: { politica-ed-economia: 5 }
          effetti: { pista.registro: 1 }
      - testo: "Rileggere i nomi della Gilda"
        costo: 0
        esito:
          titolo: Le cifre mensili
          testo: |
            Rileggi i nomi uno per uno. Due li conosci di vista, perché ti hanno
            fatto pagare la gabella all'imbocco con il sorriso. Accanto a ogni nome
            c'è la cifra del mese, e certe cifre sono più alte di quello che un
            riscossore guadagna in un anno.

            {conoscenze-della-strada Media} Una lista così vale più da chiusa che
            da aperta. Finché la tieni tu, ognuno di quei nomi dorme male, e chi
            dorme male prima o poi viene a trattare.

            Con questo registro in mano metà dei ponti di Qir-Azel ti deve
            qualcosa, e l'altra metà vorrebbe vederti cadere da uno di quelli.
            Chiudi il libro e lo leghi stretto con lo spago, facendo un nodo
            doppio.
          effetti: { informazioni.segreto: 1, pista.registro: 1 }

  # ------------------------------------------------------------ 3 → 4 · i mulini bruciati
  - id: i-mulini-bruciati
    presso: segheria-e-mulino-malgrani
    immagine: ambientazione/mulino-malgrani
    titolo: L'unico mulino
    sommario: "Tre mulini bruciati in cinque anni, e uno solo rimasto in piedi. Chi lo manda avanti ha abbassato il prezzo della farina, e dorme male."
    luogo: Mulino Malgrani, Città Bassa
    area: citta-bassa
    requisiti: [pista.registro == 3]
    testo: |
      Il Mulino Malgrani sta dove la Città Bassa scende verso il Torvessa, un
      edificio di pietra blu con la ruota che gira giorno e notte e una
      nuvola di farina sempre sospesa davanti alla porta. In coda ci sono
      soprattutto donne con i sacchetti di tela, e qualche bambino mandato da
      solo che tiene le monete strette nel pugno. Sulla lavagna accanto alla
      porta il prezzo del sacco è stato cancellato due volte, e ogni volta
      riscritto più basso, con il gesso sempre più piccolo.

      {politica-ed-economia Facile} Un mulino che abbassa il prezzo quando
      è rimasto l'unico della regione fa una cosa che nessun libro di conti
      consiglierebbe. O il grano gli costa pochissimo, o qualcuno gli ha
      chiesto di farsi voler bene.

      In città lo sanno tutti. Negli ultimi cinque anni sono bruciati gli
      altri tre mulini della regione, e questo è l'unico che macina ancora.
      Alla Pignatta li mettono tutti nel conto della razzia, perché la razzia
      è l'ultima disgrazia che si ricordano, ma l'ultimo incendio, a
      Rivopuma, è di due anni fa.

      {origine figlio-del-circolo} Al Circolo, quando nel Bosco cade un
      albero, prima di toccarlo si guarda da che parte ha ceduto. Ti viene
      da guardare così anche questo mulino, e gli altri tre che non ci sono
      più.

      Anselmo Brey, il responsabile, esce dalla porta infarinato fino ai
      gomiti e starnutisce tre volte prima di salutarti, e alla terza si
      scusa con la coda invece che con te. Ha un tic al sopracciglio destro,
      e quando gli dici chi sei il tic accelera. La farina ti si posa sulle
      ciglia, e ti viene voglia di pane caldo.

      {empatia Media} Il tic non è nato oggi. Si è fatto strada in quella
      faccia un incendio alla volta, e adesso Brey non si accorge più di
      averlo.

      *Quest'uomo ha paura di qualcosa che non sono io.* Dietro il mulino un
      sentiero risale il torrente fuori dalla città, verso quello che resta
      del mulino di Rivopuma.
    opzioni:
      - testo: "Parlare con Anselmo Brey"
        immagine: personaggi/anselmo-brey
        descrizione: "Dicono che parli troppo alle domande dirette e poco a quelle generali. Bisogna fargli quelle giuste."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Domande dirette
          testo: |
            Gli chiedi chi gli porta il grano di notte, e Brey risponde troppo, con
            la fretta di uno che aspettava la domanda da anni e se l'era preparata.
            Racconta che dopo ogni incendio arrivavano carri dai villaggi che prima
            macinavano altrove, sempre dopo la seconda campana, e che lui firmava
            le bolle senza il timbro della Gilda perché così voleva il padrone. Ti
            dice anche che ha abbassato il prezzo della farina, e la sua
            provvigione insieme, perché la gente in coda la conosce per nome.

            Poi si ferma, con il sopracciglio che salta, e dice che loro hanno
            parlato di incendio doloso e lui ha abbassato i prezzi, perché è
            quello che può fare. «Lo so che con gli incendi tutta la città ha
            cominciato a pensare ai Malgrani» aggiunge piano, guardando la coda
            davanti alla porta. «Ci penso anch'io, di notte.»
          effetti: { prove.malgrani: 2, pista.registro: 1 }
        fallimento:
          titolo: Domande generali
          testo: |
            Gli chiedi degli incendi in generale, e Brey per mezz'ora ti parla
            della ruota che va ingrassata e del raffreddore che gli viene dalla
            farina, con una passione che in un altro momento ti farebbe quasi
            tenerezza. Quando torni sugli incendi starnutisce e dice soltanto
            «Loro hanno detto incendio doloso. Io ho abbassato i prezzi.»

            Mentre esci un garzone del mulino ti passa accanto di corsa e prende
            la strada dei Quartieri Alti. Entro sera in casa Malgrani sapranno
            che qualcuno è venuto a fare domande, e da dietro la porta Brey ti
            guarda andare via con il sopracciglio che non smette di saltare.
          effetti: { prove.malgrani: 1, rep.malgrani: -0.5, pista.registro: 1 }
      - testo: "Andare a vedere il mulino di Rivopuma"
        descrizione: "A mezz'ora di cammino lungo il torrente restano le pietre annerite dell'ultimo mulino bruciato. Dopo due anni di pioggia qualcosa si legge ancora."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Le pietre annerite
          testo: |
            Del mulino di Rivopuma restano i muri senza tetto e la ruota
            bruciata a metà, piegata nell'acqua. Fra le erbacce trovi i cocci di tre
            giare da olio, di quelle grosse da magazzino, ciascuna in un angolo
            diverso. Il fuoco è partito da tre punti insieme. La macina è
            spaccata da un cuneo di ferro ancora piantato nella fessura, e un
            mulino con la macina spaccata non lo ricostruisce nessuno.

            {natura Media} Le ortiche crescono fitte soltanto in quei tre
            angoli, dove la terra si è presa l'olio e la cenere. Dopo due anni di
            pioggia, il disegno dell'incendio si legge ancora nell'erba.

            Torni in città con le mani nere di fuliggine e un coccio avvolto nel
            fazzoletto.
          effetti: { prove.malgrani: 1, pista.registro: 1 }
        fallimento:
          titolo: Fuliggine
          testo: |
            Del mulino di Rivopuma restano i muri senza tetto e la ruota
            bruciata nell'acqua. Giri fra le pietre per un'ora e trovi soltanto
            fuliggine e un nido di gazza nel camino, con dentro un cucchiaino
            e un bottone, e uscendo ti tagli la mano su un chiodo arrugginito
            della ruota.

            {medicina Facile} Un chiodo arrugginito rimasto due anni nell'acqua
            del torrente fa un taglio da lavare presto con acqua pulita, e
            con un po' di liquore se ne trovi.

            Sulla strada del ritorno un vecchio che spacca la legna ti racconta
            di aver visto l'incendio da casa sua, con il fumo che saliva da tre
            angoli. Lo dice come si parla del tempo, e torna alla sua legna.
          effetti: { prove.malgrani: 0.5, ferite: 0.5, pista.registro: 1 }
      - testo: "Confrontare le date con il registro"
        descrizione: "Gli incendi hanno una data, e anche i carri di grano nel registro di Maedric."
        requisiti: [registro.decifrato >= 1]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Le date
          testo: |
            Brey ti lascia sedere al suo banco fra i sacchi e ti presta i libri del
            mulino, senza capire bene perché, e ogni tanto si affaccia a vedere a
            che pagina sei come un allievo che spia il compito del vicino. Metti le
            date degli incendi accanto alle righe del registro di Maedric. Dopo
            ogni incendio, entro un mese, sul Ponte dei Morti cominciano a passare
            di notte carri di grano per i Malgrani, dagli stessi villaggi che
            macinavano al mulino bruciato. È successo tutte e tre le volte, e nei
            libri del mulino quel grano risulta comprato al mercato.

            Ricopi le date su un foglio a parte, in colonna. Brey ti guarda da
            dietro i sacchi e si dimentica di starnutire.
          effetti: { prove.malgrani: 2, pista.registro: 1 }
        fallimento:
          titolo: I mesi che non tornano
          testo: |
            Metti le date degli incendi accanto alle righe del registro, ma i
            libri del mulino contano gli anni a modo loro, dalla fondazione
            della casata, e il registro di Maedric li conta come la Gilda. Ti
            perdi nei conti fino a sera.

            {politica-ed-economia Media fallita} Ogni casata che si rispetti
            conta gli anni da sé, per vanità. Lo sapevi, e te ne sei ricordato
            a sera, quando non serviva più.

            Alla fine l'unica cosa certa è che dopo l'incendio di Rivopuma sul
            Ponte dei Morti hanno cominciato a passare di notte i carri dei
            villaggi che macinavano lì. Per gli altri due incendi le date ti
            ballano davanti agli occhi, e Brey ti accompagna alla porta con una
            lanterna.
          effetti: { prove.malgrani: 1, pista.registro: 1 }
      - testo: "Metterti in coda con le donne della Città Bassa"
        descrizione: "In coda c'è gente che ti ha visto crescere. Al mulino si aspetta a lungo, e mentre si aspetta si parla."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: La coda
          testo: |
            Ti metti in coda dietro una lavandaia che ti tirava le orecchie
            quando rubavi le mele dal suo cesto, e l'orecchio sinistro se ne
            ricorda per conto suo e si scalda. Lei ti chiede subito come
            stai e poi quanto costa il pane ai Ponti. In mezz'ora la coda ti
            racconta quello che Brey non dice. I carri arrivano di notte, dopo
            la seconda campana, dai villaggi che macinavano a Rivopuma, e il
            garzone che li scarica beve alla Pignatta e parla troppo.

            Una vecchia con il sacchetto di tela aggiunge che il prezzo è sceso
            dopo ogni incendio, e che lei se l'è segnato col carbone sul muro
            di casa, una riga sotto l'altra.

            {conoscenze-della-strada Facile} Nella Città Bassa il muro di casa
            è il libro mastro di chi non ha libri. Quelle righe di carbone sono
            più oneste dei registri del mulino.

            Quando arrivi alla porta Brey ti vede in mezzo alle donne, e il
            sopracciglio gli salta due volte.
          effetti: { prove.malgrani: 1, informazioni.voce: 1, pista.registro: 1 }
      - testo: "Parlare a Brey come si parla a chi ha paura del padrone"
        descrizione: "A Ghoran hai visto molti uomini con quel tic all'occhio. Avevano tutti un padrone che non perdonava."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Il padrone
          testo: |
            Invece di fargli domande gli racconti che a Ghoran i sorveglianti
            dei recinti avevano lo stesso tic, l'ultima settimana prima che il
            padrone li vendesse insieme agli schiavi. Lo racconti piano, e la gola
            ti si stringe come tutte le volte che nomini Ghoran ad alta voce.
            Brey smette di starnutire all'improvviso. Ti porta dietro i
            sacchi e parla a voce bassa, con gli occhi sulla porta.

            Dopo ogni incendio arrivavano di notte i carri dei villaggi che
            prima macinavano altrove, e lui firmava le bolle senza il timbro
            della Gilda perché così voleva il padrone. «Ho abbassato il prezzo
            della farina» dice alla fine, «perché è l'unica cosa che qua dentro
            decido io.» Mentre lo dice il sopracciglio gli sta fermo, per la
            prima volta da quando sei arrivato.
          effetti: { prove.malgrani: 2, pista.registro: 1 }
      - testo: "Leggere Rivopuma come un bosco bruciato"
        descrizione: "Al Circolo hai imparato a leggere un incendio nell'erba che ricresce dopo. A Rivopuma sono passati due anni, il tempo giusto."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: L'erba sopra la cenere
          testo: |
            Arrivi al mulino di Rivopuma lungo il torrente, e invece dei muri
            guardi l'erba, come ti hanno insegnato al Circolo dopo ogni
            incendio nel Bosco. Le ortiche crescono fitte soltanto in tre
            angoli, dove la terra si è presa olio e cenere, e in ognuno, fra
            le radici, trovi i cocci di una giara da olio di quelle grosse da
            magazzino. Il fuoco è partito da tre punti insieme.

            La macina è spaccata da un cuneo di ferro ancora piantato nella
            fessura. Torni in città con un coccio avvolto nel fazzoletto e le
            mani che pizzicano di ortica fino a sera.
          pe: { natura: 3 }
          effetti: { prove.malgrani: 1, pista.registro: 1 }

  # ------------------------------------------------------------ 4 → 5 · il rapporto a Galdrick
  - id: galdrick-e-il-registro
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: Il registro sul tavolo dello sceriffo
    sommario: "Hai il registro di Maedric decifrato e quello che hai visto ai mulini. Galdrick aspettava carte come queste da anni."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo
    area: quartieri-alti
    requisiti: [pista.registro == 4, pista.tribu < 4]
    testo: |
      Sul muro maestro dell'ufficio la crepa lasciata dalla razzia è coperta
      da una toppa d'intonaco fresco, più chiara del resto, dove qualcuno ha
      già appeso un calendario, un po' storto, come per nasconderla meglio.
      Galdrick legge il registro di Maedric seduto, con la trascrizione
      accanto, e muove le labbra sui nomi mentre tu resti in piedi davanti
      al tavolo. Dopo un'ora ti accorgi di aver contato le pietre del
      pavimento, e sono trentasei. Le gambe ti chiedono una sedia, e
      nell'ufficio ce n'è una sola.

      «Maedric Holl lo conosco di fama da anni» dice alla fine, chiudendo il
      registro. «In tutto questo tempo nessuno era riuscito a mettergli
      addosso una carta. Gli Scuri vendono quello che passa sui ponti, e gli
      orchi sui ponti non ci passano. Con la razzia gli Scuri non
      c'entrano. Lo sospettavo, e adesso posso metterlo agli atti» aggiunge,
      e batte un dito sui cappucci disegnati.

      {empatia Media} È sollevato, e se ne vergogna un poco. Sperava che il
      colpevole della razzia fosse qualcuno che si può arrestare.

      Si alza e infila i pollici nella cintura. «La Gilda si regola da sola,
      e Cordani è l'unico manico pulito che le resta. Ottone Malgrani invece
      siede in Consiglio, e Julia Castaldi gli deve il grano di mezza città.
      Per portarlo davanti al Consiglio servono prove che non si possano
      spiegare in nessun altro modo» dice, guardando la toppa sul muro.

      {origine rampollo-dei-quartieri-alti} Ottone Malgrani lo conosci di
      vista dai salotti, con i baffi biondi e il panciotto ricamato che
      ormai porta soltanto lui. In famiglia ne parlano a cena con il tono che si
      usa per un vicino troppo ricco, e mai davanti ai domestici.

      {politica-ed-economia Difficile} Chi deve il grano di mezza città a un
      uomo gli deve anche il voto. Prima di decidere se ascoltarti, il
      Consiglio conterà quanti amici ha Malgrani seduti al suo tavolo.

      «Contro gli Scuri mi muoverò quando avrò gli uomini» dice poi a voce
      più bassa, anche se la porta è chiusa. «Le carte adesso ci sono. Mi
      servono persone che non stiano né con la Gilda né con loro, e in città
      ne conto poche. Ti farò cercare» conclude, e torna a sedersi davanti al
      registro.
    opzioni:
      - testo: "Consegnargli tutto"
        descrizione: "Il registro con la trascrizione, e quello che hai visto ai mulini."
        requisiti: [jass <= 1]
        esito:
          titolo: Agli atti
          testo: |
            Gli lasci il registro e la trascrizione, e gli racconti quello che
            hai visto ai mulini. Le mani, senza il peso del libro, non sanno
            più dove stare. Galdrick chiama il furiere e gli fa chiudere tutto
            nella cassa di ferro sotto il calendario, che si apre con due
            chiavi.

            «Con questo Cordani può ripulire la Casa dei Nodi se vuole, e io
            posso aspettare gli Scuri dove passano» dice. Ti stringe la mano
            forte, poi rimette i pollici nella cintura e torna a guardare il
            calendario come se ci avesse segnato sopra il giorno.
          effetti: { rep.caserma: 1, pista.registro: 1, racconto: 1 }
      - testo: "Consegnargli tutto"
        descrizione: "Il registro con la trascrizione, e quello che hai visto ai mulini."
        requisiti: [jass >= 2]
        esito:
          titolo: La casa di Via dei Rasoi
          testo: |
            Gli lasci il registro e la trascrizione, e gli racconti quello che
            hai visto ai mulini. Galdrick fa chiudere tutto nella cassa di ferro
            sotto il calendario, che si apre con due chiavi. Poi ti accompagna
            alla porta, e lì si ferma con la mano sulla maniglia.

            «E Nerissa…» comincia, e si corregge subito. «La casa di Via dei
            Rasoi, dopo la faccenda della ragazza rossa. È tranquilla, adesso?»
            Gli rispondi quello che sai, e lui annuisce piano, due volte. Quando
            apre la porta e ti saluta ha di nuovo la voce dello sceriffo.

            {empatia Media} Quel nome gli è scappato da un posto dove lo tiene
            al riparo. Ti ha fatto la domanda dello sceriffo per non doverti
            fare l'altra.
          effetti: { rep.caserma: 1, pista.registro: 1, racconto: 1 }
      - testo: "Tenerti una copia"
        descrizione: "Le pagine del grano potrebbero servirti, il giorno che il Consiglio dovrà ascoltarti. Lo sceriffo però conta tutto."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Le pagine del grano
          testo: |
            Gli consegni il registro e la trascrizione, tranne quattro fogli
            che restano piegati nella fodera della tua giubba. Sono le pagine
            dei carri di grano per i Malgrani, ricopiate con la tua grafia.
            Galdrick conta i fogli muovendo le labbra. Il numero gli torna,
            perché la trascrizione l'hai rinumerata tu, e li chiude nella cassa
            di ferro.

            Uscendo dalla Caserma senti la carta frusciare a ogni passo, e tieni
            il braccio stretto contro il fianco fino in fondo alla discesa.

            {furtivita Media} Il braccio stretto al fianco è il gesto di uno che
            nasconde qualcosa sotto la giubba. Le guardie al portone non ci
            hanno fatto caso, e la prossima volta meglio una tasca interna.
          effetti: { prove.malgrani: 1, pista.registro: 1, racconto: 1 }
        fallimento:
          titolo: Il taccuino
          testo: |
            Galdrick conta i fogli della trascrizione e alla fine alza gli
            occhi. «Ne mancano quattro» dice, e tende la mano aperta sopra il tavolo.

            {ingannare Media fallita} Le pagine rinumerate ti sembravano
            un'idea brillante. A un uomo che legge muovendo le labbra, però,
            non sfugge una frase che si interrompe in fondo a un foglio e
            riprende a metà di un altro.

            Li tiri fuori dalla fodera della giubba, e lui li mette nella cassa
            insieme agli altri. Poi prende il taccuino dalla tasca
            della divisa e ci scrive una riga con la sua matita corta.

            «Capisco perché l'hai fatto» dice senza cattiveria, mentre rimette
            il taccuino in tasca. «Però in questa città chi si tiene le carte
            per sé finisce per somigliare a Maedric» aggiunge, e ti accompagna
            alla porta.
          effetti: { sospetto: 0.5, pista.registro: 1, racconto: 1 }
      - testo: "Chiedere una ricompensa"
        descrizione: "Hai rischiato la pelle su un ponte di notte per un lavoro da Caserma. Bisogna ricordarglielo con garbo."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: La cassa delle spese
          testo: |
            Gli ricordi le balestre nella nebbia del Ponte dei Morti, e gli fai
            notare che per un lavoro così la Caserma avrebbe mandato un sergente e
            sei uomini. Lo dici quasi scusandoti del disturbo, e il tono fa metà del
            lavoro. Galdrick ci pensa, poi apre la cassa delle spese di servizio e
            conta la somma sul tavolo di persona, senza chiamare il furiere.

            «Firma qui» dice, e ti porge la ricevuta. «La prossima volta che
            sali su un ponte di notte, però, dimmelo prima.»
          effetti: { monete: 20, pista.registro: 1, racconto: 1 }
        fallimento:
          titolo: Il tariffario
          testo: |
            Galdrick ti ascolta fino in fondo con i pollici nella cintura. Poi
            ti spiega che per i rapporti la Caserma ha un tariffario, e che alla
            voce *registri sequestrati* c'è scritta una cifra da niente. Il
            furiere te la conta contro ricevuta.

            {galateo Facile fallita} Hai parlato di soldi a un uomo che porta i
            pollici nella cintura. In certe stanze la gratitudine si aspetta, e
            chi la chiede la perde.

            Lo sceriffo intanto guarda il calendario appeso sulla toppa
            d'intonaco, e quando ti saluta lo fa con un cenno del capo, senza
            togliere le mani dalla cintura.
          effetti: { monete: 8, rep.caserma: -0.5, pista.registro: 1, racconto: 1 }

  # ------------------------------------------------------------ 4 → 5 · variante: dopo la partenza di Galdrick per Ghoran
  # Dal congedo delle tribù (pista.tribu >= 4) il registro si consegna al furiere. Se Galdrick è a Ghoran
  # (galdrick.via == 1) resta al furiere; se è già tornato (fine di Acciaio e Ira) arriva dal cortile.
  - id: il-registro-alla-caserma
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Il registro alla Caserma
    sommario: "Hai il registro di Maedric decifrato e quello che hai visto ai mulini. Alla Caserma qualcuno deve prenderlo in consegna per lo sceriffo."
    luogo: Guarnigione di Qir-Azel, il corridoio del mastio
    area: quartieri-alti
    requisiti: [pista.registro == 4, pista.tribu >= 4]
    testo: |
      Le due guardie al portone ti riconoscono e ti fanno passare con il
      registro sotto il braccio. Nel cortile il manichino con l'elmo
      ammaccato è ancora al suo posto, e adesso qualcuno gli ha dipinto sotto
      la visiera due baffi di vernice nera, curati, all'insù, con più
      talento di quanto meritasse il manichino.

      {armi-da-mischia Facile fallita} Il manichino ha la spalla sinistra
      consumata dai colpi e la destra intatta. Ne ricavi con grande
      sicurezza che in Caserma sono tutti mancini, e ti sbagli.

      Il furiere tiene il banco delle consegne in fondo al corridoio del
      mastio, sotto la teca con la spada di Ivo Carstan. È un uomo piccolo,
      con le dita macchiate di ceralacca e un mazzo di chiavi alla cintura che
      tintinna ogni volta che si sporge. Posi sul banco il registro di pelle e
      la trascrizione, e lui smette di scrivere e ti guarda da sopra gli
      occhiali.

      Apre la prima pagina con la punta della penna e legge una riga. Poi la
      richiude subito, come se avesse toccato una pentola calda.

      {galateo Media} Un furiere che non legge le carte dello sceriffo è un
      furiere che vuole restare furiere. Da queste parti la discrezione è
      il modo più sicuro di fare carriera restando fermi.

      *Quel libro mi è costato più notti di quante ne voglia contare.* Ti
      accorgi di tenere ancora una mano sulla copertina.

      «Roba per lo sceriffo» dice il furiere. «Queste carte le apre lui e
      nessun altro, e la cassa dove vanno si apre con due chiavi. Una ce l'ho
      io.»
    opzioni:
      - testo: "Aspettare lo sceriffo"
        descrizione: "Galdrick è tornato da Ghoran. Il registro vorrà leggerlo lui, e da te vorrà sapere dei mulini."
        quando: [galdrick.via == 0]
        esito:
          immagine: personaggi/toren-galdrick
          titolo: Il registro sul banco
          testo: |
            Galdrick arriva dal cortile dopo un'ora, con la polvere delle
            reclute sugli stivali e la faccia di uno che ha dormito poco a
            Ghoran e meno al ritorno. Legge il registro in piedi al banco del
            furiere, con la trascrizione accanto, e muove le labbra sui nomi.

            Quando arriva ai cappucci disegnati batte un dito sulla pagina e
            dice che gli Scuri vendono quello che passa sui ponti, e che gli
            orchi sui ponti non ci passano, quindi con la razzia non c'entrano.
            Lo sospettava da tempo, e adesso può metterlo agli atti. Gli
            racconti dei mulini, e lui ascolta con i pollici nella cintura. Poi
            fa chiudere tutto nella cassa di ferro e ti stringe la mano forte.
            «Le carte che mi mancavano adesso ci sono. Contro gli Scuri mi
            muoverò quando avrò gli uomini giusti, e allora ti farò cercare.»
          effetti: { rep.caserma: 1, pista.registro: 1, racconto: 1 }
      - testo: "Lasciarlo al furiere"
        descrizione: "Lo sceriffo è a Ghoran e non si sa quando torna. Il furiere ha una delle due chiavi e una penna per la ricevuta."
        quando: [galdrick.via == 1]
        esito:
          titolo: La ricevuta
          testo: |
            Il furiere ti dice che lo sceriffo è ancora a Ghoran e che per il
            ritorno nessuno gli ha dato una data, e lo dice come si parla di un
            parente partito per mare. Poi apre la cassa di ferro
            nell'ufficio con la sua chiave e con la copia dell'altra, che il
            carceriere gli porta su dalle celle, e ci chiude dentro il registro
            e la trascrizione.

            Gli racconti dei mulini, e lui scrive tutto su un foglio a parte con
            una grafia piccola e storta, da uomo che scrive sempre in piedi. Lo
            piega e lo infila nella cassa insieme al resto. Poi ti fa firmare
            una ricevuta e te ne dà la copia, con il sigillo della Caserma
            ancora tiepido. «Quando torna lo legge prima di togliersi gli stivali»
            dice, «e poi ti farà cercare, perché con chi gli porta carte buone fa
            sempre così.»
          effetti: { rep.caserma: 1, pista.registro: 1, racconto: 1 }
