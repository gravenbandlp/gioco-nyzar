# La pista "Il registro del custode" (pista.registro 0 → 5): il custode notturno del Ponte dei Morti,
# il suo registro cifrato, i mulini bruciati e il rapporto a Galdrick.
storylet:
  # ------------------------------------------------------------ 0 → 1 · il Ponte dei Morti, di notte
  - id: il-ponte-dei-morti-di-notte
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: Il Ponte dei Morti, di notte
    sommario: "Il tizio dei ponti fa il turno di notte, e dopo la seconda campana il Ponte dei Morti è suo."
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [pista.registro == 0, indizio.custode-notturno >= 1]
    testo: |
      Dopo la seconda campana sui Ponti Sospesi restano accese soltanto le
      lanterne di Mana, e nei tratti bui la nebbia sale dalla Cicatrice fino
      alle ginocchia.

      Al Ponte dei Morti arrivi con la giubba incollata alle spalle. Sopra il
      vuoto dondolano a centinaia le lanterne dei Raschiatori, ognuna con il
      suo cristallo acceso per un compagno rimasto nel Labirinto.

      {percezione Facile} Ce n'è una più vicina delle altre. Sul vetro
      qualcuno ha inciso con la punta di un coltello *paga il debito*, e
      sotto, più piccolo, *quando torni*.

      {empatia Media} La seconda frase l'ha scritta un'altra persona. Ha
      premuto meno sul coltello, per non rovinare quella che c'era già.

      Di notte il ponte lavora, e ti passa davanti un carro con le ruote
      fasciate di stracci. All'imbocco un facchino con la gerla vuota aspetta
      che qualcuno lo paghi, e su una cassa rovesciata due vecchi Raschiatori
      della veglia si passano una borraccia senza parlare.

      {origine apprendista-raschiatore} Gli occhi ti vanno da soli alle
      lanterne della tua squadra.

      {origine accolito-del-velo} Le labbra cercano da sole le parole del Velo
      per i morti senza tomba.

      *Il tizio di notte sta da qualche parte in questa nebbia.* In fondo al
      ponte c'è il gabbiotto dei Custodi di Passaggio, con una lampada accesa
      e la tavoletta dei turni appesa a un chiodo.
    opzioni:
      - testo: "Aspettare nell'ombra e guardare chi passa"
        descrizione: "Contare i carri, e guardare chi li ferma, se qualcuno li ferma."
        prova: { attributo: mentale, abilita: [percezione, furtivita], difficolta: Media }
        successo:
          titolo: Le ruote fasciate
          testo: |
            Dietro una trave aspetti fino all'alba. Passano sette carri, e ogni
            carrettiere, invece di pagare al gabbiotto, mette qualcosa in mano a
            un uomo pallido in un mantello cerato, che lo annota in un libretto di
            pelle. Due carri portano sacchi di grano con lo stemma dei Malgrani,
            l'albero trafitto da una lama. Sulla tavoletta dei turni, sotto
            *notte*, c'è scritto *Maedric Holl*.
          effetti: { pista.registro: 1 }
        fallimento:
          titolo: Una balestra nella nebbia
          testo: |
            Ti accucci dietro una trave e conti i carri, ma al quinto ti scappa
            uno starnuto soffocato nella manica. Un balestriere dell'imbocco
            guarda dritto verso di te, e dietro di lui un uomo pallido in un
            mantello cerato smette di scrivere nel suo libretto. Te ne vai lungo
            il parapetto. Sulla tavoletta dei turni, sotto *notte*, leggi *Maedric
            Holl*, e adesso Maedric Holl conosce la tua sagoma.
          effetti: { pista.registro: 1, sospetto: 1 }
      - testo: "Sederti con i Raschiatori della veglia"
        descrizione: "Passano la notte accanto alle lanterne della loro squadra, e da lì vedono tutto il ponte."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La veglia
          testo: |
            Ti siedi sulla cassa accanto a loro e per un po' taci. Poi la donna ti
            passa la borraccia, e quando le chiedi dei carri indica il gabbiotto
            con il mento. «Il custode di notte è Maedric Holl. Lo lasciamo stare
            perché alle nostre lanterne non mette le mani.» L'uomo aggiunge che i
            carri con il grano dei Malgrani passano da anni, sempre dopo la
            seconda campana.
          effetti: { pista.registro: 1 }
        fallimento:
          titolo: Troppe domande
          testo: |
            I due ti lasciano sedere, ma alla terza domanda l'uomo ti chiede se
            sei venuto a vegliare o a contare, e gli rispondi male. La donna ti
            dice soltanto che il custode di notte si chiama Maedric Holl e che
            alle lanterne non mette le mani. All'alba lo vedi uscire dal gabbiotto
            nel suo mantello cerato, mentre i carri passano senza pagare.
          effetti: { pista.registro: 1, tormento: 1 }
      - testo: "Pagare il facchino all'imbocco"
        descrizione: "Qualche moneta, e un facchino dei ponti si ricorda di tutto quello che ha portato di notte."
        requisiti: [monete >= 5]
        esito:
          titolo: La gerla vuota
          testo: |
            Il facchino morde una moneta per abitudine e le fa sparire tutte nella
            fascia. Il custode di notte è Maedric Holl, quello pallido col
            mantello cerato, e i carri con le ruote fasciate pagano lui invece
            della gabella. Più di una volta il facchino ha portato ai magazzini
            della Città Bassa sacchi di grano dei Malgrani. «Mai visto un timbro
            della Gilda» dice.
          pe: { conoscenze-della-strada: 5 }
          effetti: { monete: -5, pista.registro: 1 }
      - testo: "Vegliare con loro le lanterne della squadra"
        descrizione: "Alla veglia dei Raschiatori, prima di qualunque domanda, si dice il nome di uno rimasto sotto."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Un nome per la lanterna
          testo: |
            Ti siedi sulla cassa e dici il nome di un compagno sceso una volta di
            troppo dalla piattaforma. La donna annuisce e ti passa la borraccia.
            «Maedric Holl, il custode di notte» dice, indicando il gabbiotto con
            il mento. «Lo lasciamo stare perché alle nostre lanterne non mette le
            mani.» L'uomo aggiunge che il grano dei Malgrani passa da anni dopo la
            seconda campana.
          effetti: { pista.registro: 1, rep.raschiatori: 0.5 }
      - testo: "Dire le parole del Velo per le lanterne"
        descrizione: "A una veglia si accetta anche una benedizione, se chi la dice non chiede niente in cambio."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Le parole corte
          testo: |
            Davanti alla lanterna con il vetro inciso dici le parole del Velo per
            i morti senza tomba, e la donna aspetta che tu abbia finito per
            passarti la borraccia. «Il custode di notte è Maedric Holl» dice,
            indicando il gabbiotto con il mento. «Lo lasciamo stare perché alle
            nostre lanterne non mette le mani.» L'uomo aggiunge che il grano dei
            Malgrani passa da anni dopo la seconda campana.
          effetti: { pista.registro: 1 }

  # ------------------------------------------------------------ 1 → 2 · Maedric Holl
  - id: maedric-holl
    presso: ponte-dei-morti
    immagine: personaggi/maedric-holl
    titolo: Il custode notturno
    sommario: "Maedric Holl tiene il Ponte dei Morti di notte, con sei uomini della Gilda e un libretto di pelle."
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [pista.registro == 1]
    testo: |
      Torni la notte dopo, alla stessa campana. Maedric Holl è appoggiato al
      parapetto accanto a una lanterna che illumina soltanto il suo mantello
      cerato, lucido di nebbia. Ai due capi del ponte stanno sei uomini della
      Gilda con le balestre a tracolla e le lame corte alla cintura, e uno
      porta il mantello dei Custodi rovesciato, con una toppa cucita a punti
      piccoli sulla fodera.

      Maedric ha il viso pallido e gli occhi acquosi, e la voce non va più in
      là di due passi, così che per sentirlo devi farli tu. «I ponti di notte
      non sono i ponti di giorno» dice. «Chi non lo sa paga il prezzo del
      giorno.» Ti guarda come si guarda una merce sul banco. «Ti ho già visto,
      la sera del Festival, fra quelli che tenevano testa agli orchi. Tu che
      prezzo paghi?»

      {politica-ed-economia Media} Parla di prezzi anche quando parla del
      tempo. Per un uomo così chi non ha un prezzo è soltanto uno che non l'ha
      ancora detto.

      {origine mercante-dei-ponti} Quello sguardo lo conosci, perché è il tuo
      quando al banco arriva un cliente nuovo e devi capire quanto può
      spendere prima che apra bocca.
    opzioni:
      - testo: "Presentarti come cliente"
        descrizione: "Hai una merce da far passare senza registro, o almeno devi sembrarlo. Lui intanto ti peserà."
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il peso giusto
          testo: |
            Gli parli di tre casse di cristalli non registrati e di una notte
            senza luna. «Tutto passa, se il peso è giusto.» Nel gabbiotto, per
            fissare la tariffa, tira fuori un registro di pelle scritto a numeri e
            piccoli disegni, e quando esce a sistemare un carro fermo all'imbocco
            te lo infili sotto la giubba. La notte dopo il gabbiotto è chiuso, e
            di Maedric non c'è traccia.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: Pesato
          testo: |
            Gli parli di tre casse di cristalli, e Maedric ti chiede da quale
            imbocco arriveranno e chi te le ha vendute, una domanda alla volta,
            come si recupera una lenza. Alla terza rispondi «un amico», e ti
            accorgi tardi che l'avevi già detto. Gli occhi acquosi vanno al
            balestriere più vicino mentre ti propone di lasciar stare le casse e
            di parlare di quello che sai davvero.
          effetti: { sospetto: 1 }
          segue: maedric-holl-il-prezzo
      - testo: "Dirgli quello che sai"
        descrizione: "Quello che sai dei custodi comprati e dei carri con le ruote fasciate. Vediamo che faccia fa."
        costo: 0
        esito:
          titolo: Gli occhi acquosi
          testo: |
            Gli racconti a voce bassa dei custodi comprati e dei carri dei Malgrani
            senza timbro, e gli dici che hai visto dove li annota. A un cenno della
            sua mano il balestriere più vicino si allontana di tre passi, e Maedric
            per la prima volta ti guarda dritto in faccia.

            {armi-da-distanza Media} Ha allontanato l'uomo che poteva sentire. Quello
            che sta per dirti non vuole che lo sappiano i suoi.
          segue: maedric-holl-il-prezzo
      - testo: "Minacciarlo davanti ai suoi uomini"
        descrizione: "Lui ha sei uomini con le balestre, e il ponte è stretto. Se cominci tu, qualcuno finisce di sotto."
        combattimento: maedric-sul-ponte
        vittoria:
          titolo: Isolato
          testo: |
            La nebbia si infittisce e i balestrieri tagliano le corde delle
            lanterne per toglierti la luce. Sulle assi viscide metti a terra il
            balestriere con la toppa sulla fodera, e quando vedono il compagno a
            terra gli altri arretrano nella nebbia. Maedric resta solo con la
            schiena contro il parapetto e le mani alzate all'altezza del petto.
          segue: maedric-in-ginocchio
        sconfitta:
          titolo: La borsa nella nebbia
          testo: |
            I balestrieri tagliano le lanterne, un dardo ti apre la manica e un
            colpo alle gambe ti manda sulle assi viscide, con le dita aggrappate
            al bordo. Quando riesci a rialzarti il ponte è vuoto. Accanto al
            parapetto c'è la borsa di cuoio che Maedric ha perso scendendo, con
            dentro il registro di pelle, ed entro sera alla Pignatta sapranno che
            ce l'hai tu.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -1, pista.registro: 1 }
      - testo: "Trattare la tariffa da mercante dei Ponti"
        descrizione: "Hai la licenza della Gilda, e sai come si tratta quello che nei registri non si scrive."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Facile }
        successo:
          titolo: Fra colleghi
          testo: |
            Gli mostri il sigillo della licenza e gli chiedi, con il tono del
            banco, quanto costa far passare di notte un carico che la Casa dei Nodi
            non deve vedere. «Uno della Gilda che paga me invece della Gilda. Mi
            piace.» Nel gabbiotto tira fuori il registro di pelle, e quando esce a
            sistemare un carro tu lo fai sparire sotto la giubba come una moneta
            tosata.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: Troppo in regola
          testo: |
            Maedric guarda il sigillo della licenza più a lungo di te. «Uno della
            Gilda che viene a comprare il silenzio da me» dice piano. «Oppure
            viene a vedere chi lo vende.» Gli occhi acquosi passano sul
            balestriere più vicino, e ti propone di lasciar perdere le casse e di
            parlare di quello che sai davvero.
          effetti: { sospetto: 1 }
          segue: maedric-holl-il-prezzo

  - id: maedric-holl-il-prezzo
    presso: ponte-dei-morti
    immagine: personaggi/maedric-holl
    titolo: Le tariffe
    tipo: seguito
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [pista.registro == 1]
    testo: |
      «Qualcuno ti ha parlato di me» dice Maedric. «Prima o poi in questa
      città parlano tutti.» Si sistema il mantello, e la cera scricchiola.
      «Io lavoro a tariffa, con tutti. Dimmi che cosa vuoi che dimentichi e
      ti dico quanto costa dimenticarlo. Posso pagarti in monete, oppure con
      un nome che ti serve più del mio.» Lo dice piano, con le mani
      tranquille sul parapetto.

      {empatia Difficile} Le mani sono tranquille perché le tiene ferme lui.
      Il pollice destro preme sul metallo fino a sbiancare l'unghia.

      «Se invece vuoi portarmi da Cordani, dimmi con che cosa. Siamo su un
      ponte di notte, e la nebbia non testimonia.» Gli uomini agli imbocchi
      si irrigidiscono senza che lui alzi un dito.
    opzioni:
      - testo: "Accettare il prezzo"
        descrizione: "Un nome da poco e qualche moneta, in cambio del tuo silenzio. Il registro resta a lui, per ora."
        esito:
          titolo: Un nome da poco
          testo: |
            Maedric ti conta in mano le monete una alla volta, poi ti dà il nome.
            Ilario Benn, riscossore del turno di giorno alle Mille Corde,
            arrotonda i pedaggi dei carri di sale e si tiene la differenza. «È un
            nome vero, e nessuno ti chiederà dove l'hai preso.» Dalla finestra del
            gabbiotto lo vedi chiudere il libretto di pelle in una cassetta di
            ferro con un lucchetto nuovo.
          effetti: { monete: 15, informazioni.pettegolezzo: 1 }
          segue: maedric-holl-il-gabbiotto
      - testo: "Dirgli che Cordani e lo sceriffo lo aspettano"
        descrizione: "Con calma. Un uomo che ama vivere fa i suoi conti prima di organizzare un incidente."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La corda sotto le assi
          testo: |
            Gli dici che lo sceriffo sa dove sei stanotte e che domattina lo saprà
            anche il Sovrintendente Cordani. Maedric fa i conti a voce alta. Un
            forestiero caduto dal ponte si spiega facilmente, uno di quelli del
            Festival molto meno. Poi sparisce nella nebbia lungo una corda, e i
            suoi uomini se ne vanno. Nel gabbiotto aperto c'è la sua borsa di
            cuoio con il registro di pelle.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: Un incidente sul ponte
          testo: |
            A metà frase la voce ti sale di un tono, come a un ragazzo che bluffa a
            carte, e Maedric fa un cenno con due dita. Un dardo si pianta nel
            parapetto, il secondo ti entra nel fianco mentre ti butti sulle assi.
            Quando rialzi la testa sono spariti tutti, e nel gabbiotto, dietro la
            stufa, è caduta la borsa di cuoio con il registro di pelle.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { ferite: 2, rep.scuri: -1, pista.registro: 1 }
      - testo: "Mettergli le mani addosso"
        descrizione: "Hai sentito abbastanza. Lui però ha sei balestre dalla sua, e il ponte è stretto."
        combattimento: maedric-sul-ponte
        vittoria:
          titolo: Le lanterne tagliate
          testo: |
            Gli sei addosso prima che finisca di alzare la mano. I balestrieri
            tagliano le corde delle lanterne e la nebbia si chiude sul ponte, e
            quando uno ti arriva alle spalle lo mandi contro il parapetto. Gli
            altri si ritirano verso gli imbocchi. Quando la nebbia si apre Maedric
            è rimasto solo, con le spalle al metallo e le mani aperte davanti al
            petto.
          segue: maedric-in-ginocchio
        sconfitta:
          titolo: Il cigolio di una corda
          testo: |
            Maedric arretra di un passo e i dardi arrivano dalla nebbia prima di
            lui. Finisci sulle assi viscide con una gamba oltre il bordo e ti tiri
            su a forza di braccia. Vicino al parapetto c'è una borsa di cuoio
            rovesciata con dentro il registro di pelle, che Maedric ha perso
            scendendo, e stanotte qualcuno andrà a dire agli Scuri chi l'ha
            raccolta.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -1, pista.registro: 1 }
      - testo: "Fargli capire a quali tavole ceni"
        descrizione: "Uno che vende silenzio sa quanto pesa un nome dei Quartieri Alti. Il tuo siede ai tavoli del Consiglio."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Un posto vuoto a tavola
          testo: |
            Senza nominare lo sceriffo, gli dici il nome della tua famiglia e, come per caso,
            quelli delle due famiglie che ti hanno invitato a cena. Maedric fa i conti a voce
            bassa. Un forestiero caduto dal ponte si spiega facilmente, un posto vuoto a una
            cena dei Quartieri Alti molto meno. Poi sparisce nella nebbia, e nel gabbiotto
            trovi appesa al chiodo la sua borsa con il registro di pelle.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: I nomi cadono come gli altri
          testo: |
            Gli dici il nome della tua famiglia, e lui lo ripete piano, come un
            vino che non gli piace. «Dai ponti cadono anche i nomi buoni, e fanno
            lo stesso rumore.» A un cenno delle sue dita un dardo ti entra nel
            fianco mentre ti butti sulle assi. Quando rialzi la testa sono spariti
            tutti, e nel gabbiotto la borsa con il registro di pelle è caduta
            dietro la stufa.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { ferite: 2, rep.scuri: -1, pista.registro: 1 }

  - id: maedric-holl-il-gabbiotto
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: Il gabbiotto
    tipo: seguito
    luogo: Ponte dei Morti, al cambio del turno
    area: ponti-sospesi
    requisiti: [pista.registro == 1]
    testo: |
      All'alba la nebbia ricade nella Cicatrice e il Ponte dei Morti torna un
      ponte qualsiasi, pieno dei carretti del mercato. Maedric chiude il
      gabbiotto con due giri di chiave e se ne va verso i Quartieri Alti con il
      mantello cerato sul braccio, come un impiegato a fine turno.

      Il gabbiotto è una scatola di assi e lamiera agganciata al fianco del
      ponte, con una finestrella che dà sul vuoto e, dentro, la cassetta di
      ferro del registro. Prima del custode di giorno, sempre in ritardo, passa
      un facchino con il carbone per la stufa e la chiave appesa al collo con
      un laccio da scarpe.

      {conoscenze-della-strada Facile} Uno che porta una chiave al collo con un
      laccio da scarpe non è mai stato pagato abbastanza per tenerla.
    opzioni:
      - testo: "Entrare dalla finestrella sul vuoto"
        descrizione: "Dal parapetto al davanzale c'è un braccio di distanza, e sotto c'è la Cicatrice."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Un braccio sul vuoto
          testo: |
            Quando il ponte resta vuoto scavalchi il parapetto e allunghi una
            gamba fino al davanzale, con la luce della Cicatrice sotto le suole.
            Dentro, il lucchetto della cassetta cede alla seconda spinta, perché è
            nuovo ma l'anello è vecchio, ed esci dalla stessa parte con il
            registro sotto la giubba. Due notti dopo nel gabbiotto c'è un custode
            nuovo, e Maedric Holl sui ponti non si è più visto.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: Appeso
          testo: |
            Il piede scivola sulla lamiera bagnata e resti appeso per le mani sopra la Cicatrice. Alla fine
            entri, e la cassetta cede alla seconda spinta. Quando esci il custode di giorno è fermo sul tavolato
            con il suo pane in mano e si mette a gridare. Entro sera Maedric sa chi gli ha aperto la cassetta, e
            da quella notte sui ponti non lo vede più nessuno.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { ferite: 1, sospetto: 1, rep.scuri: -1, pista.registro: 1 }
      - testo: "Pagare il facchino del carbone"
        descrizione: "Qualche moneta, e la chiave appesa al laccio da scarpe gira per te."
        requisiti: [monete >= 10]
        esito:
          titolo: Il laccio da scarpe
          testo: |
            Il facchino fa sparire le monete in una scarpa e apre il gabbiotto.
            Mentre scarica il carbone accanto alla stufa e fischia verso il vuoto,
            tu ti inginocchi davanti alla cassetta. Il lucchetto è nuovo, ma la
            chiave piccola sta appesa allo stesso laccio della grande. Due notti
            dopo nel gabbiotto c'è un custode nuovo, e di Maedric Holl sui ponti
            si dice soltanto che è sparito.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { monete: -10, rep.scuri: -0.5, pista.registro: 1 }

  - id: maedric-in-ginocchio
    presso: ponte-dei-morti
    immagine: personaggi/maedric-holl
    titolo: Senza uomini
    tipo: seguito
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [pista.registro == 1]
    testo: |
      Le lanterne tagliate penzolano dalle corde e illuminano le assi
      lasciando al buio le facce. Maedric si è inginocchiato da solo, con la
      schiena contro il parapetto e le mani aperte davanti al petto.

      {origine fuggiasco-di-ghoran} Quella posizione la conosci dalla parte
      sbagliata. A Ghoran si stava così davanti ai sorveglianti, e le tue
      spalle si curvano un poco per conto loro.

      «Il registro è qui, sotto il mantello» dice, e la voce gli trema
      sull'ultima sillaba. «È tuo. Io vorrei restare mio, se si può.» Ti
      mostra una corda annodata che pende oltre il bordo, legata al parapetto
      a un passo dalla sua mano sinistra, poi posa il registro sulle assi fra
      voi e aspetta con gli occhi sulle tue mani.

      {ingannare Media} Te la mostra per farti sentire generoso. Un uomo che
      ti indica l'uscita ti sta anche dicendo dove guarderà lui.
    opzioni:
      - testo: "Legarlo e portarlo alla Caserma"
        descrizione: "Con la sua stessa corda, su per i Quartieri Alti, fino alla porta della Caserma."
        esito:
          titolo: Alla Caserma
          testo: |
            Gli leghi i polsi con la corda che doveva servirgli per sparire e ti
            metti il registro sotto la giubba. Per tutta la salita cammina davanti
            a te senza dire niente, e soltanto alla porta della Caserma ti chiede
            di dire allo sceriffo che si è arreso da solo. Il sergente di turno
            scrive il suo nome sul registro delle celle, sotto quello di un
            ubriaco di Via del Salmone.
          imposta: { registro-cifrato: 1, maedric: 2 }
          effetti: { rep.caserma: 1, pista.registro: 1 }
      - testo: "Lasciarlo scendere"
        descrizione: "Prendi il registro e gli lasci la corda. Un uomo che ama vivere si ricorda la tua faccia."
        esito:
          titolo: La corda
          testo: |
            Raccogli il registro e fai un passo indietro. Maedric scavalca il
            parapetto e scende lungo la corda, un nodo alla volta, finché la
            nebbia gli copre la testa. Sui ponti non lo vedrai più. Prima
            dell'alba, però, alla Pignatta Grassa sapranno che il registro del
            custode notturno adesso ce l'hai tu, e chi te l'ha lasciato prendere.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -1, pista.registro: 1 }
      - testo: "Non dargli il tempo di arrivare alla corda"
        descrizione: "La sua mano sinistra è a un passo dalla corda, e un uomo dei ponti ha sempre un trucco."
        esito:
          titolo: Sulle assi
          testo: |
            La mano sinistra di Maedric si muove verso il parapetto e tu colpisci
            prima di capire se cercava la corda. Lui cade di lato sulle assi e non
            si rialza, e sotto il mantello cerato c'è soltanto una camicia
            rammendata. Raccogli il registro con le mani che tremano. Domattina
            troveranno un custode della Gilda con la testa spaccata, e qualcuno
            dirà di aver visto la tua sagoma nella nebbia.
          imposta: { registro-cifrato: 1, maedric: 3 }
          effetti: { tormento: 1.5, sospetto: 1.5, pista.registro: 1 }

  # ------------------------------------------------------------ 2 → 3 · il registro cifrato
  - id: il-registro-cifrato
    presso: biblioteca-di-qir-azel
    immagine: personaggi/mattias-crenn
    titolo: Il cifrario del custode
    sommario: "Il registro di Maedric è scritto a numeri e disegni. In Biblioteca Mattias Crenn legge il precuriano da trent'anni."
    luogo: Biblioteca di Qir-Azel, il primo piano
    area: quartieri-alti
    requisiti: [pista.registro == 2, invito >= 1]
    testo: |
      La stanza di Mattias Crenn è l'ultima del primo piano della Biblioteca,
      con la porta tenuta aperta da una pila di monografie, tutte con il
      timbro rosso della Confraternita, *respinta*.

      Mattias si pulisce le lenti sulla manica e apre il registro a metà.
      Resta zitto, poi gira svelto tre pagine e parla a raffica. «Le date
      sono numeri, e anche le somme. I disegnini sono merci e persone, questa
      ruota è un carro e questo sacco è grano. È il cifrario di un custode, e
      la chiave cambia ogni mese. Si fa, si fa. Ci vuole una notte, oppure
      qualcuno che sappia contare quasi quanto me.»

      {origine allievo-di-torvessa} Al primo anno Temmerin vi metteva davanti
      libri mastri sequestrati e cifrari peggiori di questo.

      {empatia Facile} È offeso, ed è felice. Erano anni che non saliva
      nessuno fino all'ultima stanza a chiedergli qualcosa.
    opzioni:
      - testo: "Decifrarlo con lui"
        descrizione: "Tu leggi i numeri ad alta voce, lui cerca la chiave del mese."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: La chiave di ogni mese
          testo: |
            Tu leggi i numeri e lui li scrive in colonna. Verso mezzanotte trovi
            la regola per primo. Il primo numero di ogni mese è la chiave, e tutto
            il resto va spostato di tanto. Mattias dice «bene» a denti stretti, e
            all'alba la trascrizione è finita e lui dorme con la guancia su una
            monografia respinta, con il timbro che gli si stampa al rovescio sulla
            pelle.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
        fallimento:
          titolo: Le colonne sbagliate
          testo: |
            Per due volte salti una riga, e la seconda Mattias se ne accorge dopo
            un'ora di conti. Da lì in avanti non ti lascia più leggere, ti manda a
            prendere l'olio per la lampada e poi il pane, e ricomincia da capo.
            All'alba la trascrizione è finita, tutta con la sua grafia, e lui te
            la consegna borbottando che in fondo era un cifrario da bambini.
          imposta: { registro.decifrato: 1 }
          effetti: { tormento: 1 }
          segue: il-registro-decifrato
      - testo: "Pagargli la cena con Ulric"
        descrizione: "Per sé Mattias non vuole soldi. Stasera però cena con Ulric Stanne, e il vino buono costa caro."
        requisiti: [monete >= 10]
        esito:
          titolo: Il vino buono
          testo: |
            Gli metti sul tavolo le monete per il vino di stasera, e Mattias le
            guarda come un'offesa personale prima di infilarsele nella manica. Il
            giorno dopo il registro è accanto a una bottiglia vuota e a una pila
            di fogli scritti fitti, e Mattias ha gli occhi rossi. «Ulric mi ha
            detto che sono un genio, e al terzo bicchiere lo dice sempre, ma
            stavolta aveva ragione.»
          imposta: { registro.decifrato: 1 }
          effetti: { monete: -10 }
          segue: il-registro-decifrato
      - testo: "Proporgli il metodo di Temmerin"
        descrizione: "Al primo anno Orvald Temmerin fa decifrare agli allievi i libri mastri sequestrati dalla Caserma."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Gli esercizi del primo anno
          testo: |
            Gli spieghi la prima regola di Temmerin, cercare la riga che torna
            uguale all'inizio di ogni mese, e Mattias storce la bocca al nome del
            preside ma ti lascia fare. La trovi a metà della terza pagina, e il
            primo numero di ogni mese è la chiave. Mattias dice «bene» fra i
            denti, e all'alba dorme con la guancia su una monografia respinta,
            accanto alla trascrizione finita.
          imposta: { registro.decifrato: 1 }
          pe: { accademiche: 3 }
          segue: il-registro-decifrato

  - id: l-archivio-dei-dazi
    immagine: personaggi/lira-demos
    titolo: L'archivio dei dazi
    sommario: "Alla Casa dei Nodi Lira Demos tiene i conti dei ponti e da anni sorveglia Maedric Holl."
    luogo: Casa dei Nodi, l'archivio dei dazi
    area: quartieri-alti
    requisiti: [pista.registro == 2, invito >= 1]
    testo: |
      L'archivio dei dazi è una sala lunga al secondo piano della Casa dei
      Nodi, con le finestre sulle catene dei ponti e gli scaffali pieni di
      registri, ciascuno con un tassello di legno inciso inchiodato sulla
      costola. Lira Demos, una mezzelfa con i capelli castani intrecciati di
      fili di rame, lavora vicino alla finestra e mentre ti ascolta ordina per
      forma i tasselli di una scatola. Quando posi il registro di Maedric le
      dita si fermano.

      «Sono sei anni che gli scrivo dietro tutto quello che vedo, e non avevo
      niente in mano» dice piano. I numeri sono i turni di Maedric, e i
      disegni sono i segni dei tasselli dell'archivio, quelli del vecchio
      cifrario dei custodi, copiati male.

      {empatia Media} Le tremano appena le dita. Ha aspettato a lungo di avere
      ragione, e adesso ha paura di essersi sbagliata proprio all'ultimo.
    opzioni:
      - testo: "Riscontrarlo con i registri dei dazi"
        descrizione: "I turni di Maedric accanto ai pedaggi registrati, per trovare le notti in cui i conti non tornano."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Dove i conti non tornano
          testo: |
            Lira tira giù sei anni di pedaggi notturni, e tu li leggi accanto ai
            turni di Maedric una notte alla volta. Ogni volta che nel registro di
            pelle c'è un disegno e nei libri della Gilda non c'è niente, lei posa
            un tassello sul tavolo, e a metà pomeriggio la chiave del cifrario si
            legge nell'ordine dei tasselli. «Bel lavoro» dice, e ti lascia tenere
            quello a forma di sacco.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
        fallimento:
          titolo: Un tassello fuori posto
          testo: |
            Confondi due anni, e per un'ora Lira posa tasselli sulle notti
            sbagliate. Quando se ne accorge non alza la voce, li rimette nella
            scatola uno per uno e ricomincia da sola, finché fuori è buio. Tu
            passi il pomeriggio a portarle registri su e giù per la scala, sotto
            gli occhi dei garzoni. Alla fine Lira ti consegna la trascrizione e ti
            ringrazia lo stesso.
          imposta: { registro.decifrato: 1 }
          effetti: { sospetto: 1 }
          segue: il-registro-decifrato
      - testo: "Lasciarle il registro fino a domani"
        descrizione: "Lira non vuole soldi e non promette niente per iscritto. Ti chiede soltanto di aspettare."
        costo: 2
        esito:
          titolo: Pratica notarile
          testo: |
            Lira ti scrive una ricevuta e subito la strappa, perché per iscritto non
            promette niente a nessuno. «Torna con la luce» dice, e chiude il
            registro nel cassetto. Il giorno dopo la trovi allo stesso tavolo, con
            la camicia di ieri. Ha trascritto tutto in una grafia minuta e diritta,
            con un tassello a margine accanto a ogni notte che anche lei aveva
            annotato per conto suo.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
      - testo: "Leggere i turni come un libro mastro"
        descrizione: "Al banco dei Ponti sai in quali notti un mercante paga la gabella, e Lira registra la tua."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Le notti senza gabella
          testo: |
            Lira ti riconosce dal sigillo della licenza, perché la tua gabella
            passa dal suo tavolo. Mentre apre i registri dei pedaggi ti segni le
            settimane in cui al Mercato dei Nodi il grano è calato di prezzo, le
            stesse in cui nel libro di Maedric compare il sacco. Prima di sera il
            cifrario si legge nell'ordine dei tasselli. «Sui Ponti vi insegnano a
            contare meglio che qui dentro» dice.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato

  - id: il-registro-alla-pignatta
    presso: pignatta-grassa
    immagine: personaggi/rozalia-marga
    titolo: Il cifrario dei custodi
    sommario: "Rozalia Marga falsifica carte per gli Scuri e legge i cifrari, ma tiene copia di tutto."
    luogo: Pignatta Grassa, nel retrobottega
    area: citta-bassa
    # chi ha battuto Rozalia e Squiggor in Via dei Rasoi (squiggor 2) da lei non torna: decifra in Biblioteca o ai dazi
    requisiti: [pista.registro == 2, squiggor < 2]
    testo: |
      Alla Pignatta Grassa Mauro Scrocco ti indica il retrobottega con il mento.
      Sugli scaffali ogni cartella porta il nome di una famiglia e di un
      mestiere, e quella dei *sigilli della Gilda* è la più gonfia.

      {origine figlio-della-citta-bassa} Da ragazzo alla porta del retrobottega
      ti fermavi, e il piede esita ancora sulla soglia.

      Rozalia Marga siede al banco con la piuma d'oca dietro l'orecchio, batte
      due volte la penna sul calamaio e sfoglia il registro di Maedric con
      l'unghia del mignolo. «Il cifrario dei custodi, quello vecchio. Maedric ci
      ha messo una chiave che cambia ogni mese e si crede furbo. Lo leggo in un
      pomeriggio. Tutto quello che tocco, però, finisce nelle mie cartelle.»

      {ingannare Media} A metà le è scappato un mezzo sorriso su una pagina, e
      ha girato subito la successiva per coprirlo. Su quella pagina c'è una riga
      che le interessa più della tariffa.
    opzioni:
      - testo: "Pagare la trascrizione"
        descrizione: "Il prezzo di un pomeriggio di lavoro, e una copia che resterà sugli scaffali della Pignatta."
        requisiti: [squiggor <= 1, monete >= 15]
        esito:
          titolo: In pari
          testo: |
            Rozalia conta le monete spostandole con la punta della penna e ti dice
            di tornare al tramonto. Al tramonto la trascrizione è pronta, legata
            con un nastro da pacchi, e sullo scaffale alle sue spalle c'è una
            cartella nuova dello stesso spessore. «I conti li chiudo sempre in
            pari» dice, e batte due volte la penna sul calamaio. «Tu hai la tua
            copia, io la mia.»
          imposta: { registro.decifrato: 1 }
          effetti: { monete: -15, rep.scuri: 0.5, sospetto: 1 }
          segue: il-registro-decifrato
      - testo: "Convincerla a non tenersi la copia"
        descrizione: "La paga, e una buona ragione per non tenersi la copia. Se fallisci, paghi lo stesso."
        requisiti: [squiggor <= 1, monete >= 15]
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Una cartella in meno
          testo: |
            Le fai notare che nel registro ci sono pagamenti alla Pignatta, e che
            una copia sui suoi scaffali è proprio la carta che lo sceriffo
            verrebbe a cercare. Rozalia batte la penna sul calamaio tre volte
            invece di due. «Hai ragione, e mi secca.» Ti spinge indietro le
            monete, decifra il registro davanti a te e al tramonto brucia nella
            stufa i fogli di prova.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
        fallimento:
          titolo: Nelle cartelle
          testo: |
            Rozalia ti ascolta con la testa piegata di lato. «Tesoro, i rischi li
            tengo in ordine alfabetico. Si paga lo stesso, e la copia resta a me.»
            Al tramonto la trascrizione è pronta, legata con un nastro da pacchi,
            e sullo scaffale alle sue spalle c'è una cartella nuova dello stesso
            spessore.
          imposta: { registro.decifrato: 1 }
          effetti: { monete: -15, rep.scuri: 0.5, sospetto: 1 }
          segue: il-registro-decifrato

  - id: il-registro-decifrato
    immagine: fazioni/gilda-dei-mercanti
    titolo: Quello che c'è scritto
    tipo: seguito
    luogo: Il registro di Maedric, decifrato
    area: quartieri-alti
    requisiti: [pista.registro == 2, registro.decifrato >= 1]
    testo: |
      Il registro copre sei anni di notti. Ogni riga è un passaggio sul Ponte
      dei Morti che nei libri della Gilda non esiste. Accanto a ogni data ci
      sono la merce e la somma, mentre in fondo a ogni pagina c'è la parte di
      Maedric, sottolineata due volte.

      Le righe con il sacco sono quasi tutte per i Malgrani. È grano dei
      villaggi di pianura che finiva nei magazzini della Città Bassa senza
      timbro e senza gabella, all'inizio una volta al mese e negli ultimi
      cinque anni quasi ogni settimana. In fondo ci sono una ventina di nomi
      di riscossori e custodi dei ponti, più tre funzionari della Casa dei
      Nodi, ognuno con la sua cifra mensile. Ogni mese una somma va a un
      piccolo cappuccio disegnato, il segno dei pagamenti agli Scuri, e
      accanto al primo Maedric ha scritto in chiaro *Pignatta*.

      Di orchi o di una Dama d'Argento non c'è una riga. Il nome di Tarquin
      Cordani compare una volta sola, in un margine, accanto a un occhio
      aperto e a una nota che vuol dire *non avvicinare*, e fra tutti quelli
      della Gilda il Sovrintendente è l'unico che sembra pulito.
    opzioni:
      - testo: "Contare i carri dei Malgrani"
        costo: 0
        esito:
          titolo: I sacchi
          testo: |
            Rifai il conto dei sacchi due volte. In sei anni sul Ponte dei Morti è
            passato di notte abbastanza grano da sfamare la Città Bassa per un
            inverno, e la Gilda non ne ha registrato un chicco. Per arrivare a
            Ottone Malgrani però non basta un sacco disegnato nel libretto di un
            contrabbandiere, e ti segni di andare a vedere il Mulino Malgrani,
            l'unico rimasto in piedi nella regione.
          pe: { politica-ed-economia: 5 }
          effetti: { pista.registro: 1 }
      - testo: "Rileggere i nomi della Gilda"
        costo: 0
        esito:
          titolo: Le cifre mensili
          testo: |
            Rileggi i nomi uno per uno. Due li conosci di vista, perché ti hanno
            fatto pagare la gabella all'imbocco con il sorriso, e certe cifre
            accanto ai nomi sono più alte di quello che un riscossore guadagna in
            un anno. Con questo registro metà dei ponti di Qir-Azel ti deve
            qualcosa, e l'altra metà vorrebbe vederti cadere da uno di quelli.
          effetti: { informazioni.segreto: 1, pista.registro: 1 }

  # ------------------------------------------------------------ 3 → 4 · i mulini bruciati
  - id: i-mulini-bruciati
    presso: segheria-e-mulino-malgrani
    immagine: ambientazione/mulino-malgrani
    titolo: L'unico mulino
    sommario: "Tre mulini bruciati in cinque anni, e l'unico rimasto ha abbassato il prezzo della farina."
    luogo: Mulino Malgrani, Città Bassa
    area: citta-bassa
    requisiti: [pista.registro == 3]
    testo: |
      Il Mulino Malgrani sta dove la Città Bassa scende verso il Torvessa, un
      edificio di pietra blu con la ruota che gira e una nuvola di farina
      davanti alla porta. In coda ci sono donne con i sacchetti di tela, e il
      garzone sulla porta ripete a ognuna il prezzo del sacco, più basso
      dell'anno scorso.

      Negli ultimi cinque anni sono bruciati gli altri tre mulini della
      regione. Alla Pignatta li mettono nel conto della razzia, ma l'ultimo
      incendio, a Rivopuma, è di due anni fa.

      {origine figlio-del-circolo} Al Circolo un albero caduto si guarda
      prima da che parte ha ceduto, e così guardi anche questo mulino.

      Anselmo Brey, il responsabile, esce infarinato fino ai gomiti e
      starnutisce prima di salutarti. Quando gli dici chi sei, il tic al
      sopracciglio destro accelera. Dietro il mulino un sentiero risale il
      torrente verso quello che resta del mulino di Rivopuma.
    opzioni:
      - testo: "Parlare con Anselmo Brey"
        immagine: personaggi/anselmo-brey
        descrizione: "Dicono che parli troppo alle domande dirette e poco a quelle generali. Bisogna fargli quelle giuste."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Domande dirette
          testo: |
            Gli chiedi chi gli porta il grano di notte, e Brey risponde troppo,
            come uno che aspettava la domanda da anni. Dopo ogni incendio
            arrivavano carri dai villaggi che prima macinavano altrove, sempre dopo
            la seconda campana, e lui firmava le bolle senza il timbro della Gilda
            perché così voleva il padrone. «Loro hanno detto incendio doloso, e io
            ho abbassato i prezzi» dice, guardando la coda.
          effetti: { prove.malgrani: 2, pista.registro: 1 }
        fallimento:
          titolo: Domande generali
          testo: |
            Gli chiedi degli incendi in generale, e Brey per mezz'ora ti parla
            della ruota che va ingrassata e del raffreddore che gli viene dalla
            farina. Sugli incendi dice soltanto «Loro hanno detto incendio doloso.
            Io ho abbassato i prezzi.» Mentre esci un garzone del mulino prende di
            corsa la strada dei Quartieri Alti, ed entro sera in casa Malgrani
            sapranno che qualcuno è venuto a fare domande.
          effetti: { prove.malgrani: 1, rep.malgrani: -0.5, pista.registro: 1, sospetto: 0.5 }
      - testo: "Andare a vedere il mulino di Rivopuma"
        descrizione: "Lungo il torrente restano le pietre annerite dell'ultimo mulino bruciato, dopo due anni di pioggia."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Le pietre annerite
          testo: |
            Del mulino di Rivopuma restano i muri senza tetto e la ruota bruciata a
            metà nell'acqua. Fra le erbacce trovi i cocci di tre giare da olio,
            ciascuna in un angolo diverso, perché il fuoco è partito da tre punti
            insieme. La macina è spaccata da un cuneo di ferro ancora piantato
            nella fessura. Torni in città con un coccio avvolto nel fazzoletto.
          effetti: { prove.malgrani: 1, pista.registro: 1 }
        fallimento:
          titolo: Fuliggine
          testo: |
            Giri fra i muri anneriti di Rivopuma per un'ora e trovi soltanto
            fuliggine, e uscendo ti tagli la mano su un chiodo arrugginito della
            ruota. Sulla strada del ritorno un vecchio che spacca la legna ti
            racconta di aver visto l'incendio da casa sua, con il fumo che saliva
            da tre angoli, e lo dice come si parla del tempo.
          effetti: { prove.malgrani: 0.5, ferite: 0.5, pista.registro: 1 }
      - testo: "Confrontare le date con il registro"
        descrizione: "Gli incendi hanno una data, e anche i carri di grano nel registro di Maedric."
        requisiti: [registro.decifrato >= 1]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Le date
          testo: |
            Brey ti presta i libri del mulino e tu metti le date degli incendi
            accanto al registro di Maedric. Ogni volta, entro un mese
            dall'incendio, sul Ponte dei Morti cominciano a passare di notte carri
            di grano per i Malgrani dagli stessi villaggi che macinavano al mulino
            bruciato, e nei libri del mulino quel grano risulta comprato al
            mercato. Ricopi le date in colonna, e Brey si dimentica di starnutire.
          effetti: { prove.malgrani: 2, pista.registro: 1 }
        fallimento:
          titolo: I mesi che non tornano
          testo: |
            I libri del mulino contano gli anni dalla fondazione della casata e il
            registro di Maedric come la Gilda, e ti perdi nei conti fino a sera.
            L'unica cosa certa è che dopo l'incendio di Rivopuma sul Ponte dei
            Morti hanno cominciato a passare di notte i carri dei villaggi che
            macinavano lì. Per gli altri due incendi le date ti ballano davanti
            agli occhi.
          effetti: { prove.malgrani: 1, pista.registro: 1, tormento: 0.5 }
      - testo: "Metterti in coda con le donne della Città Bassa"
        descrizione: "In coda c'è gente che ti ha visto crescere, e mentre si aspetta si parla."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: La coda
          testo: |
            Ti metti in coda dietro una lavandaia che ti tirava le orecchie quando
            le rubavi le mele, e in mezz'ora la coda ti racconta quello che Brey
            non dice. I carri arrivano di notte dai villaggi che macinavano a
            Rivopuma, e il garzone che li scarica beve alla Pignatta e parla
            troppo. Una vecchia aggiunge che il prezzo è sceso dopo ogni incendio.
          effetti: { prove.malgrani: 1, informazioni.voce: 1, pista.registro: 1 }
      - testo: "Parlare a Brey come si parla a chi ha paura del padrone"
        descrizione: "A Ghoran hai visto molti uomini con quel tic all'occhio. Avevano tutti un padrone che non perdonava."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Il padrone
          testo: |
            Gli racconti che a Ghoran i sorveglianti dei recinti avevano lo stesso
            tic, l'ultima settimana prima che il padrone li vendesse. Brey smette
            di starnutire e parla con gli occhi sulla porta. Dopo ogni incendio
            arrivavano di notte i carri dei villaggi che macinavano altrove, e lui
            firmava le bolle senza timbro. «Ho abbassato il prezzo della farina
            perché è l'unica cosa che qua dentro decido io.»
          effetti: { prove.malgrani: 2, pista.registro: 1 }
      - testo: "Leggere Rivopuma come un bosco bruciato"
        descrizione: "Al Circolo hai imparato a leggere un incendio nell'erba che ricresce, e a Rivopuma sono passati due anni."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: L'erba sopra la cenere
          testo: |
            A Rivopuma guardi l'erba invece dei muri, come ti hanno insegnato al
            Circolo. Le ortiche crescono fitte soltanto in tre angoli, dove la
            terra si è presa olio e cenere, e in ognuno trovi i cocci di una giara
            da olio da magazzino, perché il fuoco è partito da tre punti insieme.
            La macina è spaccata da un cuneo di ferro, e torni in città con un
            coccio nel fazzoletto.
          pe: { natura: 3 }
          effetti: { prove.malgrani: 1, pista.registro: 1 }

  # ------------------------------------------------------------ 4 → 5 · il rapporto a Galdrick
  - id: galdrick-e-il-registro
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: Il registro sul tavolo dello sceriffo
    sommario: "Hai il registro decifrato e quello che hai visto ai mulini, e Galdrick aspettava carte così da anni."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo
    area: quartieri-alti
    requisiti: [pista.registro == 4, pista.tribu < 4]
    testo: |
      Sul muro dell'ufficio la crepa lasciata dalla razzia è coperta da una
      toppa d'intonaco fresco, con sopra un calendario appeso un po' storto.
      Galdrick legge il registro di Maedric seduto, con la trascrizione accanto,
      e muove le labbra sui nomi.

      «Maedric Holl lo conosco di fama da anni, e nessuno era mai riuscito a
      mettergli addosso una carta» dice alla fine. «Gli Scuri vendono quello che
      passa sui ponti, e gli orchi sui ponti non ci passano, quindi con la
      razzia non c'entrano.» Batte un dito sui cappucci disegnati.

      {empatia Media} È sollevato, e se ne vergogna un poco. Sperava che il
      colpevole della razzia fosse qualcuno che si può arrestare.

      Si alza e infila i pollici nella cintura. «La Gilda si regola da sola, e
      Cordani è l'unico manico pulito che le resta. Ottone Malgrani invece siede
      in Consiglio, e Julia Castaldi gli deve il grano di mezza città. Per
      portarlo davanti al Consiglio servono prove che non si possano spiegare in
      nessun altro modo.»

      {origine rampollo-dei-quartieri-alti} Ottone Malgrani lo conosci dai
      salotti, con i baffi biondi e il panciotto ricamato.

      «Contro gli Scuri mi muoverò quando avrò gli uomini» aggiunge a voce più
      bassa. «Mi servono persone che non stiano né con la Gilda né con loro, e
      ti farò cercare.»
    opzioni:
      - testo: "Consegnargli tutto"
        descrizione: "Il registro con la trascrizione, e quello che hai visto ai mulini."
        requisiti: [jass <= 1]
        esito:
          titolo: Agli atti
          testo: |
            Gli lasci il registro e la trascrizione, e gli racconti quello che hai
            visto ai mulini. Galdrick fa chiudere tutto nella cassa di ferro sotto
            il calendario, che si apre con due chiavi. «Con questo Cordani può
            ripulire la Casa dei Nodi se vuole, e io posso aspettare gli Scuri
            dove passano» dice, e ti stringe la mano forte.
          effetti: { rep.caserma: 1, pista.registro: 1, racconto: 1 }
      - testo: "Consegnargli tutto"
        descrizione: "Il registro con la trascrizione, e quello che hai visto ai mulini."
        requisiti: [jass >= 2]
        esito:
          titolo: La casa di Via dei Rasoi
          testo: |
            Gli lasci il registro e la trascrizione, e gli racconti dei mulini.
            Galdrick fa chiudere tutto nella cassa di ferro sotto il calendario,
            poi ti accompagna alla porta e si ferma con la mano sulla maniglia. «E
            Nerissa…» comincia, e si corregge subito. «La casa di Via dei Rasoi,
            dopo la faccenda della ragazza rossa. È tranquilla, adesso?» Gli
            rispondi quello che sai, e lui annuisce piano, due volte.
          effetti: { rep.caserma: 1, pista.registro: 1, racconto: 1 }
      - testo: "Tenerti una copia"
        descrizione: "Le pagine del grano potrebbero servirti, il giorno che il Consiglio dovrà ascoltarti. Lo sceriffo però conta tutto."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Le pagine del grano
          testo: |
            Gli consegni il registro e la trascrizione, tranne quattro fogli
            piegati nella fodera della giubba, le pagine dei carri di grano per i
            Malgrani ricopiate con la tua grafia. Galdrick conta i fogli muovendo
            le labbra, e il numero gli torna perché la trascrizione l'hai
            rinumerata tu. Uscendo dalla Caserma senti la carta frusciare a ogni
            passo.
          effetti: { prove.malgrani: 1, pista.registro: 1, racconto: 1 }
        fallimento:
          titolo: Il taccuino
          testo: |
            Galdrick conta i fogli della trascrizione e alza gli occhi. «Ne mancano
            quattro» dice, e tende la mano aperta sopra il tavolo. Li tiri fuori
            dalla fodera della giubba, e lui li mette nella cassa con gli altri e
            scrive una riga nel taccuino con la sua matita corta. «Capisco perché
            l'hai fatto. Però in questa città chi si tiene le carte per sé finisce
            per somigliare a Maedric.»
          effetti: { sospetto: 1, pista.registro: 1, racconto: 1 }
      - testo: "Chiedere una ricompensa"
        descrizione: "Hai rischiato la pelle su un ponte di notte per un lavoro da Caserma. Bisogna ricordarglielo con garbo."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: La cassa delle spese
          testo: |
            Gli ricordi le balestre nella nebbia del Ponte dei Morti, e gli fai
            notare che per un lavoro così la Caserma avrebbe mandato un sergente e
            sei uomini. Galdrick ci pensa, poi apre la cassa delle spese di servizio
            e conta la somma di persona. «Firma qui. La prossima volta che sali su
            un ponte di notte, però, dimmelo prima.»
          effetti: { monete: 20, pista.registro: 1, racconto: 1 }
        fallimento:
          titolo: Il tariffario
          testo: |
            Galdrick ti ascolta fino in fondo con i pollici nella cintura. Poi ti
            spiega che per i rapporti la Caserma ha un tariffario, e che alla voce
            *registri sequestrati* c'è scritta una cifra da niente. Il furiere te
            la conta contro ricevuta, e lo sceriffo ti saluta con un cenno del
            capo, senza togliere le mani dalla cintura.
          effetti: { monete: 8, rep.caserma: -0.5, pista.registro: 1, racconto: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ 4 → 5 · variante: dopo la partenza di Galdrick per Ghoran
  # Dal congedo delle tribù (pista.tribu >= 4) il registro si consegna al furiere. Se Galdrick è a Ghoran
  # (galdrick.via == 1) resta al furiere; se è già tornato (fine di Acciaio e Ira) arriva dal cortile.
  - id: il-registro-alla-caserma
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Il registro alla Caserma
    sommario: "Hai il registro decifrato e quello che hai visto ai mulini. Alla Caserma qualcuno deve prenderlo in consegna."
    luogo: Guarnigione di Qir-Azel, il corridoio del mastio
    area: quartieri-alti
    requisiti: [pista.registro == 4, pista.tribu >= 4]
    testo: |
      Le due guardie al portone ti riconoscono e ti fanno passare. Nel cortile
      il manichino con l'elmo ammaccato è ancora al suo posto, e qualcuno gli
      ha dipinto sotto la visiera due baffi neri all'insù.

      Il furiere tiene il banco delle consegne in fondo al corridoio del
      mastio, sotto la teca con la spada di Ivo Carstan. È un uomo piccolo con
      le dita macchiate di ceralacca. Apre il registro di pelle con la punta
      della penna e, letta una riga, lo richiude subito come se avesse toccato
      una pentola calda.

      {galateo Media} Un furiere che non legge le carte dello sceriffo è un
      furiere che vuole restare furiere.

      «Roba per lo sceriffo» dice. «Queste carte le apre lui e nessun altro, e
      la cassa dove vanno si apre con due chiavi, una delle quali ce l'ho io.»
    opzioni:
      - testo: "Aspettare lo sceriffo"
        descrizione: "Galdrick è tornato da Ghoran. Il registro vorrà leggerlo lui, e da te vorrà sapere dei mulini."
        quando: [galdrick.via == 0]
        esito:
          immagine: personaggi/toren-galdrick
          titolo: Il registro sul banco
          testo: |
            Galdrick arriva dopo un'ora con la polvere delle reclute sugli stivali
            e legge il registro in piedi. Ai cappucci disegnati batte un dito e
            dice che gli orchi sui ponti non ci passano, quindi con la razzia gli
            Scuri non c'entrano. Gli racconti dei mulini, e lui fa chiudere tutto
            nella cassa di ferro. «Contro gli Scuri mi muoverò quando avrò gli
            uomini giusti, e allora ti farò cercare.»
          effetti: { rep.caserma: 1, pista.registro: 1, racconto: 1 }
      - testo: "Lasciarlo al furiere"
        descrizione: "Lo sceriffo è a Ghoran e non si sa quando torna. Il furiere ha una delle due chiavi."
        quando: [galdrick.via == 1]
        esito:
          titolo: La ricevuta
          testo: |
            Il furiere ti dice che lo sceriffo è ancora a Ghoran. Apre la cassa di
            ferro con la sua chiave e con la copia dell'altra, che il carceriere
            gli porta dalle celle, e ci chiude il registro e la trascrizione.
            Quello che racconti dei mulini lo scrive su un foglio con una grafia
            storta. «Quando torna lo legge prima di togliersi gli stivali, e poi
            ti farà cercare.»
          effetti: { rep.caserma: 1, pista.registro: 1, racconto: 1 }
