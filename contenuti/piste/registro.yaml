# La pista "Il registro del custode" (pista.registro 0 → 5): il custode notturno del Ponte dei Morti,
# il suo registro cifrato, i mulini bruciati e il rapporto a Galdrick.
storylet:
  # ------------------------------------------------------------ 0 → 1 · il Ponte dei Morti, di notte
  - id: il-ponte-dei-morti-di-notte
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: Il Ponte dei Morti, di notte
    sommario: "Ti hanno parlato del tizio dei ponti, quello del turno di notte. Dopo la seconda campana il Ponte dei Morti è suo."
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [pista.registro == 0, indizio.custode-notturno >= 1]
    testo: |
      Dopo la seconda campana sui Ponti Sospesi restano accese soltanto le
      lanterne di Mana. Fra una lanterna e la successiva la nebbia sale dalla
      Cicatrice e si posa sulle assi all'altezza delle ginocchia. Arrivi al Ponte dei
      Morti con la giubba umida sulle spalle. Il parapetto di metallo
      annerito è freddo e bagnato, e sopra il vuoto dondolano a centinaia le
      lanterne dei Raschiatori, ognuna con il suo piccolo cristallo acceso
      per un compagno rimasto nel Labirinto. Su una qualcuno ha inciso con la
      punta di un coltello *paga il debito*, e sotto, più piccolo, *quando
      torni*.

      Di notte il ponte ha un'altra vita. Passano carri con le ruote fasciate
      di stracci, tirati da muli con gli zoccoli avvolti nella tela perché
      sulle lastre non facciano rumore. All'imbocco un facchino con la gerla
      vuota aspetta che qualcuno lo paghi per portare qualcosa. Su una cassa
      rovesciata siedono due Raschiatori della veglia, vecchi, con i capelli
      bianchi bagnati dalla nebbia, e si passano una borraccia senza parlare.

      In fondo al ponte c'è un gabbiotto dei Custodi di Passaggio con la
      finestra socchiusa e una lampada accesa dentro. Fuori, appesa a un
      chiodo, c'è la tavoletta dei turni. Ti infili le mani sotto le ascelle
      per scaldarle. *Il tizio dei ponti, quello di notte, sta da qualche
      parte in questa nebbia.* Un carro ti passa accanto così piano che senti
      soltanto il respiro del mulo.
    opzioni:
      - testo: "Aspettare nell'ombra e guardare chi passa"
        descrizione: "Contare i carri, e guardare chi li ferma, se qualcuno li ferma."
        prova: { attributo: mentale, abilita: [percezione, furtivita], difficolta: Media }
        successo:
          titolo: Le ruote fasciate
          testo: |
            Ti accucci dietro una trave, fra due lanterne spente da anni, e
            aspetti. Fino all'alba passano sette carri. Nessuno si ferma a
            pagare al gabbiotto. Da ognuno scende il carrettiere e mette
            qualcosa in mano a un uomo pallido avvolto in un mantello cerato,
            che lo annota in un libretto di pelle e mai nel registro della
            Gilda incatenato al banco. Sei uomini con le balestre a tracolla
            tengono i due capi del ponte.

            Due carri portano sacchi di grano con lo stemma dei Malgrani,
            l'albero trafitto da una lama, dipinto sulla tela. Quando la nebbia
            si ritira leggi la tavoletta appesa al chiodo, dove in gesso, sotto
            la parola *notte*, c'è scritto *Maedric Holl*.
          effetti: { pista.registro: 1 }
        fallimento:
          titolo: Una balestra nella nebbia
          testo: |
            Ti accucci dietro una trave e conti i carri. Al quinto un
            balestriere dell'imbocco alza la testa e guarda dritto verso la tua
            trave, e dietro di lui un uomo pallido avvolto in un mantello
            cerato smette di scrivere nel suo libretto e guarda dalla stessa
            parte. Restano così finché la nebbia sale di nuovo a coprirli.

            Te ne vai lungo il parapetto con il cuore che ti batte nei denti.
            Passando davanti al gabbiotto leggi la tavoletta dei turni, dove in
            gesso, sotto la parola *notte*, c'è scritto *Maedric Holl*. Adesso
            Maedric Holl conosce la tua sagoma.
          effetti: { pista.registro: 1, sospetto: 0.5 }
      - testo: "Sederti con i Raschiatori della veglia"
        descrizione: "Passano la notte accanto alle lanterne della loro squadra, e da quella cassa vedono tutto quello che attraversa il ponte."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La veglia
          testo: |
            Ti siedi sulla cassa accanto a loro, e dopo un po' la donna ti passa
            la borraccia. Dentro c'è liquore di radice allungato con l'acqua. Le
            chiedi per chi vegliano, e lei ti dice tre nomi, ciascuno con il
            suo anno.

            Quando le chiedi dei carri indica il gabbiotto con il mento. «Il
            custode di notte è Maedric Holl» dice. «Alle nostre lanterne non
            mette mai le mani, e per questo lo lasciamo stare. Quello che passa
            qui sopra la Gilda non lo vede.» L'uomo aggiunge che i carri con il
            grano dei Malgrani passano da anni, sempre dopo la seconda campana.
            Quando Maedric esce dal gabbiotto, pallido nel suo mantello cerato,
            la donna smette di parlare e si riprende la borraccia.
          effetti: { pista.registro: 1 }
        fallimento:
          titolo: Troppe domande
          testo: |
            I due ti lasciano sedere, ma alla terza domanda l'uomo si alza e ti
            chiede se sei venuto a vegliare o a contare. Gli rispondi male. La
            donna ti dice soltanto che il custode di notte si chiama Maedric
            Holl e che alle lanterne non mette le mani, poi ti indica una trave
            più in là.

            Resti lì fino all'alba, fra le lanterne di gente che non hai mai
            conosciuto. Vedi Maedric uscire dal gabbiotto nel suo mantello
            cerato e i carri passare senza pagare. A ogni raffica le lanterne
            sbattono contro il metallo, e ti sembra di sentire chiamare dei
            nomi.
          effetti: { pista.registro: 1, tormento: 0.5 }
      - testo: "Pagare il facchino all'imbocco"
        descrizione: "Cinque monete, e un facchino dei ponti si ricorda di tutto quello che ha portato di notte."
        requisiti: [monete >= 5]
        esito:
          titolo: La gerla vuota
          testo: |
            Il facchino morde una delle monete, più per abitudine che per
            sospetto, e se le infila tutte nella fascia che porta in vita. Poi
            si appoggia alla gerla e ti racconta tre mesi di notti.

            Il custode di notte è Maedric Holl, quello pallido con il mantello
            cerato che sta uscendo adesso dal gabbiotto. Davanti a lui i carri
            con le ruote fasciate non pagano la gabella della Gilda. Pagano lui,
            e lui li segna in un libretto suo. Più di una volta il facchino ha
            scaricato in fondo al ponte sacchi di grano con lo stemma dei
            Malgrani, e li ha portati giù fino ai magazzini della Città Bassa.
            «Mai visto un timbro della Gilda» dice. «In tre mesi, mai.»
          pe: { conoscenze-della-strada: 5 }
          effetti: { monete: -5, pista.registro: 1 }

  # ------------------------------------------------------------ 1 → 2 · Maedric Holl
  - id: maedric-holl
    presso: ponte-dei-morti
    immagine: personaggi/maedric-holl
    titolo: Il custode notturno
    sommario: "Maedric Holl tiene il Ponte dei Morti dalla seconda campana all'alba, con sei uomini della Gilda e un libretto di pelle sotto il mantello."
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [pista.registro == 1]
    testo: |
      Torni la notte dopo, alla stessa campana. Maedric Holl è appoggiato al
      parapetto di un tratto laterale, accanto a una lanterna che illumina
      soltanto il suo mantello cerato, lucido di nebbia. Ai due capi del
      ponte stanno sei uomini della Gilda, con le balestre a tracolla e le
      lame corte alla cintura. Uno porta il mantello dei Custodi rovesciato,
      per non farsi riconoscere, e sulla fodera si vede una toppa cucita a
      punti piccoli e regolari, da qualcuno che gli vuole bene.

      Maedric si volta solo dopo un po'. Ha il viso pallido e gli occhi
      acquosi. Le labbra sottili non sorridono mai del tutto, e la voce non
      va più in là di due passi.

      «I ponti di notte non sono i ponti di giorno» dice. «Chi non lo sa
      paga il prezzo del giorno, e si sorprende.» Ti guarda la faccia con
      calma, come si guarda una merce sul banco. «Ti ho già visto in piazza,
      la sera del Festival. Eri fra quelli che tenevano la linea. Tu che
      prezzo paghi?»

      Sotto i tuoi piedi un'asse si muove, e lo stomaco ti scende di un
      gradino verso la Cicatrice. *Su un ponte così stretto sei balestre
      bastano e avanzano.* Il balestriere con la toppa sposta il peso da un
      piede all'altro, e la sua balestra gli scivola di un palmo lungo la
      spalla.
    opzioni:
      - testo: "Presentarti come cliente"
        descrizione: "Hai una merce da far passare senza registro, o almeno devi sembrarlo. Lui intanto ti peserà."
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il peso giusto
          testo: |
            Gli parli di tre casse di cristalli non registrati e di una notte
            senza luna. Lui ti ascolta con la testa inclinata. «Tutto passa, se
            il peso è giusto» dice. «Dimmi cosa e quando. Il resto è
            discrezione.»

            Ti porta nel gabbiotto per fissare la tariffa e tira fuori da sotto
            il mantello un registro rilegato in pelle e scritto a numeri e
            piccoli disegni. Poi un carro si ferma storto all'imbocco, e lui
            esce a sistemare la faccenda lasciando il registro sul banco per il
            tempo di tre frasi a voce bassa. Te lo infili sotto la giubba alla
            seconda.

            La notte dopo il gabbiotto è chiuso, e sulla tavoletta dei turni il
            nome di Maedric è stato cancellato con una manica.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: Pesato
          testo: |
            Gli parli di tre casse di cristalli e di una notte senza luna.
            Maedric ascolta e ti chiede da quale imbocco arriveranno le casse,
            e dopo un po' chi te le ha vendute. Lo chiede senza fretta, una
            domanda alla volta. Alla terza rispondi «un amico», e ti accorgi
            tardi che l'avevi già detto.

            «Un amico» ripete lui, e il mezzo sorriso resta dov'è. Gli occhi
            acquosi si spostano sul balestriere più vicino mentre ti propone di
            lasciare stare le casse e di parlare di quello che sai davvero.
          effetti: { sospetto: 0.5 }
          segue: maedric-holl-il-prezzo
      - testo: "Dirgli quello che sai"
        descrizione: "Quello che sai dei custodi comprati e dei carri con le ruote fasciate. Vediamo che faccia fa."
        costo: 0
        esito:
          titolo: Gli occhi acquosi
          testo: |
            Glielo dici a voce bassa, come parla lui. Gli racconti dei custodi
            che si comprano con due monete e dei carri dei Malgrani che passano
            senza timbro, e gli dici che hai visto dove li annota. Il mezzo
            sorriso resta fermo dov'è.

            Gli occhi invece si spostano sul balestriere più vicino, che a un
            cenno della mano si allontana di tre passi e resta a guardare la
            nebbia. Maedric si stringe nel mantello cerato fino a farlo
            scricchiolare, poi per la prima volta ti guarda dritto in faccia.
          segue: maedric-holl-il-prezzo
      - testo: "Minacciarlo davanti ai suoi uomini"
        descrizione: "Lui ha sei uomini con le balestre, e il ponte è stretto. Se cominci tu, qualcuno finisce di sotto."
        combattimento: maedric-sul-ponte
        vittoria:
          titolo: Isolato
          testo: |
            La nebbia si infittisce di colpo, e i balestrieri tagliano le corde
            delle lanterne più vicine per toglierti la luce. Le assi sono
            viscide e tu ti tieni lontano dal parapetto. Metti a terra il
            balestriere con la toppa sulla fodera, poi ti giri verso le sagome
            all'imbocco.

            Quando vedono il compagno a terra gli altri arretrano nella nebbia,
            e i loro passi si allontanano sulle lastre. Maedric resta solo, con
            la schiena contro il parapetto e le mani alzate all'altezza del
            petto. Per la prima volta da quando lo conosci respira forte.
          segue: maedric-in-ginocchio
        sconfitta:
          titolo: La borsa nella nebbia
          testo: |
            I balestrieri tagliano le corde delle lanterne una dopo l'altra, e
            il buio ti arriva addosso insieme alla nebbia. Un dardo ti apre la
            manica. Un colpo alle gambe ti manda sulle assi viscide, con le
            dita aggrappate al bordo e la luce della Cicatrice a un palmo dalla
            faccia.

            Quando riesci a rialzarti il ponte è vuoto. Da sotto le assi arriva
            il cigolio di una corda tesa, poi più niente. Accanto al parapetto
            trovi la borsa di cuoio che Maedric ha perso scendendo. Dentro c'è
            un registro rilegato in pelle e scritto a numeri e piccoli disegni.
            Entro sera alla Pignatta sapranno che ce l'hai tu.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -1, pista.registro: 1 }

  - id: maedric-holl-il-prezzo
    presso: ponte-dei-morti
    immagine: personaggi/maedric-holl
    titolo: Le tariffe
    tipo: seguito
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [pista.registro == 1]
    testo: |
      «Un morto ti ha parlato, o qualcuno che ascolta i morti» dice Maedric.
      «Che città triste, dove si dà retta ai morti.» Si sistema il mantello
      sulle spalle, e la cera scricchiola. All'imbocco uno dei balestrieri si
      toglie la balestra dalla spalla e se la tiene in grembo, come si tiene
      un gatto.

      «Senti. Io lavoro a tariffa, con tutti. Dimmi che cosa vuoi che
      dimentichi, e ti dico quanto costa dimenticarlo. Posso pagarti
      in monete, oppure con un nome che ti serve più del mio.» Lo dice piano,
      con le mani tranquille sul parapetto, e ti accorgi di esserti
      avvicinato per sentirlo.

      *Mi sta facendo abbassare la voce anche adesso.* Il sudore sulla nuca
      ti si è fatto freddo. Il ponte ondeggia appena a ogni raffica, e le
      lanterne dei Raschiatori battono piano contro il metallo del
      parapetto.

      «Se invece vuoi portarmi da Cordani, dimmi con che cosa» aggiunge.
      «Con la parola di un morto e la tua faccia? Siamo su un ponte di notte,
      e la nebbia non testimonia. Pensaci un momento, prima di rendere questa
      cosa definitiva.» Gli uomini agli imbocchi si irrigidiscono senza che
      lui alzi un dito.
    opzioni:
      - testo: "Accettare il prezzo"
        descrizione: "Un nome da poco e qualche moneta, in cambio del tuo silenzio. Il registro resta a lui, per ora."
        esito:
          titolo: Un nome da poco
          testo: |
            Maedric ti conta in mano quindici monete, fredde di nebbia, una alla
            volta. Poi ti dà il nome. Ilario Benn, riscossore del turno di
            giorno alle Mille Corde, arrotonda i pedaggi dei carri di sale e si
            tiene la differenza. «È un nome vero» dice. «Lo puoi portare a chi
            vuoi, e nessuno ti chiederà dove l'hai preso.»

            Torna verso il gabbiotto, e dalla finestra lo vedi chinarsi dietro
            il banco. Quando si rialza il libretto di pelle non ce l'ha più in
            mano, e alla cassetta di ferro sul pavimento è appeso un lucchetto
            nuovo. Gli uomini riprendono i loro posti fino all'alba.
          effetti: { monete: 15, informazioni.pettegolezzo: 1 }
          segue: maedric-holl-il-gabbiotto
      - testo: "Dirgli che Cordani e lo sceriffo lo aspettano"
        descrizione: "Con calma, senza alzare la voce. Un uomo che ama vivere fa i suoi conti prima di organizzare un incidente."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La corda sotto le assi
          testo: |
            Gli dici che lo sceriffo sa dove sei stanotte, e che domattina lo
            saprà anche il Sovrintendente Cordani. Lo dici con calma, guardando
            la lanterna invece di lui. Maedric fa i conti a voce alta, quasi
            gentile. Un forestiero caduto dal ponte si spiega facilmente, dice
            lui, mentre uno di quelli che hanno tenuto la piazza si spiega molto
            meno.

            Poi fa un passo indietro nella nebbia e sparisce. Senti una corda
            tendersi sotto le assi, e i suoi uomini se ne vanno senza correre.
            La porta del gabbiotto è rimasta aperta, e appesa al chiodo dietro
            il banco c'è la sua borsa di cuoio con dentro il registro di pelle.
            Te la metti a tracolla e torni verso l'imbocco camminando al centro
            delle assi.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: Un incidente sul ponte
          testo: |
            Gli parli di Cordani e dello sceriffo, ma a metà frase la voce ti
            sale di un tono, e Maedric lo sente. Fa un cenno piccolo con due
            dita. Il primo dardo si pianta nel parapetto accanto alla tua mano,
            il secondo ti prende di striscio sul fianco mentre ti butti sulle
            assi.

            Quando rialzi la testa Maedric è sparito, e i suoi uomini con lui.
            Nel gabbiotto hanno rovesciato tutto in fretta. La borsa di cuoio è
            caduta dietro la stufa, con dentro il registro di pelle, e nella
            fretta nessuno l'ha trovata. Fino all'imbocco cammini con una mano
            premuta sul fianco.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { ferite: 1, rep.scuri: -1, pista.registro: 1 }
      - testo: "Mettergli le mani addosso"
        descrizione: "Hai sentito abbastanza. Lui però ha sei balestre dalla sua, e il ponte è stretto."
        combattimento: maedric-sul-ponte
        vittoria:
          titolo: Le lanterne tagliate
          testo: |
            Gli sei addosso prima che finisca di alzare la mano. I balestrieri
            tagliano le corde delle lanterne per accecarti, e la nebbia si
            chiude sul ponte. Scivoli sulle assi e ti rialzi. Uno degli uomini
            ti arriva alle spalle, e lo mandi contro il parapetto, dove resta
            aggrappato a gridare.

            Gli altri sentono il grido e si ritirano verso gli imbocchi. Quando
            la nebbia si apre Maedric è rimasto solo, con le spalle al metallo e
            le mani aperte davanti al petto, e respira dalla bocca.
          segue: maedric-in-ginocchio
        sconfitta:
          titolo: Il cigolio di una corda
          testo: |
            Gli sei addosso, ma Maedric arretra di un passo e i dardi arrivano
            dalla nebbia prima di lui. I balestrieri tagliano le lanterne e il
            buio ti prende alle spalle. Finisci sulle assi viscide con una gamba
            oltre il bordo, e la luce della Cicatrice ti illumina la suola.

            Ti tiri su con le braccia. Sotto il ponte cigola una corda tesa, poi
            smette. Quando la nebbia si dirada restano le lanterne spente e,
            vicino al parapetto, una borsa di cuoio rovesciata con dentro un
            registro di pelle. Maedric l'ha persa scendendo, e stanotte stessa
            qualcuno andrà a dire agli Scuri chi l'ha raccolta.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -1, pista.registro: 1 }

  - id: maedric-holl-il-gabbiotto
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: Il gabbiotto
    tipo: seguito
    luogo: Ponte dei Morti, al cambio del turno
    area: ponti-sospesi
    requisiti: [pista.registro == 1]
    testo: |
      All'alba la nebbia ricade nella Cicatrice e il Ponte dei Morti torna un
      ponte qualsiasi, con le lanterne pallide nella luce grigia e i primi
      carretti del mercato che passano facendo rumore. Maedric chiude il
      gabbiotto con due giri di chiave e se ne va verso i Quartieri Alti con
      il mantello cerato sul braccio. I suoi uomini si sparpagliano fra la
      gente.

      Il gabbiotto è una scatola di assi e lamiera agganciata al fianco del
      ponte, con la porta sul tavolato e una finestrella che dà sul vuoto. Il
      custode del turno di giorno arriva tardi tutte le mattine, e prima di lui
      passa un facchino con un sacco di carbone per la stufa. Il facchino
      porta la chiave appesa al collo con un laccio da scarpe, e ha l'aria di
      uno che l'avrebbe data a chiunque, se solo qualcuno gliel'avesse
      chiesta.

      Ti siedi sul parapetto. Nella tasca della giubba hai le quindici monete
      di Maedric, e sono ancora fredde. *Il registro sta in quella cassetta, a
      dieci passi da me.* Dalla finestrella sul vuoto esce l'ultimo filo di
      fumo della stufa, e le corde del ponte cigolano sotto i primi carri.
    opzioni:
      - testo: "Entrare dalla finestrella sul vuoto"
        descrizione: "Dal parapetto al davanzale c'è un braccio di distanza, e sotto c'è la Cicatrice."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Un braccio sul vuoto
          testo: |
            Quando il ponte resta vuoto scavalchi il parapetto. Allunghi una
            gamba fino al davanzale, e per un momento sotto di te c'è soltanto
            la luce della Cicatrice. Poi sei dentro, accucciato fra la stufa e
            il banco. Il lucchetto della cassetta cede alla seconda spinta,
            perché è nuovo ma l'anello a cui è appeso è vecchio.

            Esci dalla stessa parte con il registro sotto la giubba. Due notti
            dopo nel gabbiotto c'è un custode nuovo, giovane, che non sa
            niente, e Maedric Holl sui ponti non si è più visto.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -0.5, pista.registro: 1 }
        fallimento:
          titolo: Appeso
          testo: |
            Scavalchi il parapetto e allunghi una gamba fino al davanzale, ma la
            lamiera è bagnata e il piede scivola. Resti appeso per le mani per
            il tempo di un respiro lunghissimo, con le ginocchia che sbattono
            contro le assi. Alla fine entri, e la cassetta cede alla seconda
            spinta.

            Quando esci il custode del turno di giorno è fermo sul tavolato con
            il suo pane in mano, e ti guarda risalire sul parapetto. Si mette a
            gridare, e un paio di carrettieri si voltano. Entro sera Maedric sa
            chi gli ha aperto la cassetta, e da quella notte sui ponti non lo
            vede più nessuno.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { ferite: 1, sospetto: 0.5, rep.scuri: -1, pista.registro: 1 }
      - testo: "Pagare il facchino del carbone"
        descrizione: "Dieci monete, e la chiave appesa al laccio da scarpe gira per te."
        requisiti: [monete >= 10]
        esito:
          titolo: Il laccio da scarpe
          testo: |
            Il facchino guarda le dieci monete a lungo, come se dovesse
            portarle su per una scala. Apre il gabbiotto e scarica il carbone
            accanto alla stufa. Poi si mette a fischiare verso il vuoto, mentre
            tu ti inginocchi davanti alla cassetta. Il lucchetto è nuovo, ma la
            chiave piccola sta appesa allo stesso laccio della grande.

            Il facchino richiude la porta dietro di te. Due notti dopo nel
            gabbiotto c'è un custode nuovo, e di Maedric Holl sui ponti si dice
            soltanto che è sparito.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { monete: -10, rep.scuri: -0.5, pista.registro: 1 }

  - id: maedric-in-ginocchio
    presso: ponte-dei-morti
    immagine: personaggi/maedric-holl
    titolo: Senza uomini
    tipo: seguito
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [pista.registro == 1]
    testo: |
      Le lanterne tagliate penzolano dalle corde e fanno una luce bassa, di
      traverso, che illumina le assi e lascia al buio le facce. Maedric ha la
      schiena contro il parapetto. Si è inginocchiato da solo, senza che tu
      glielo chiedessi, e tiene le mani aperte davanti al petto.

      «Il registro è qui, sotto il mantello» dice. La voce è bassa come
      prima, ma adesso gli trema sull'ultima sillaba. «È tuo. Io vorrei
      restare mio, se si può. Un uomo dei ponti ha sempre un modo per
      scendere, e il mio è legato al parapetto, a un passo dalla mia mano
      sinistra.» Te lo dice perché tu lo veda. Una corda annodata a
      intervalli regolari pende oltre il bordo, dentro la nebbia.

      Solo adesso ti accorgi che ti fanno male le nocche. Dagli imbocchi non
      arriva più nessun passo. *Se lo lascio scendere, prima dell'alba gli
      Scuri sapranno il mio nome.* Maedric tira fuori il registro con due
      dita e lo posa sulle assi fra voi. La copertina di pelle è gonfia
      d'umidità. Poi aspetta con gli occhi fissi sulle tue mani, mentre il
      mantello cerato gli gocciola sulle ginocchia.
    opzioni:
      - testo: "Legarlo e portarlo alla Caserma"
        descrizione: "Con la sua stessa corda, su per i Quartieri Alti, fino alla porta della Caserma."
        esito:
          titolo: Alla Caserma
          testo: |
            Gli leghi i polsi con la corda che doveva servirgli per sparire, e
            il registro te lo metti sotto la giubba. Lui non oppone resistenza.
            Per tutta la salita verso i Quartieri Alti cammina un passo davanti
            a te senza dire niente, e soltanto alla porta della Caserma ti
            chiede di dire allo sceriffo che si è arreso da solo.

            Le due guardie in giaco di maglia lo prendono in consegna. Il
            sergente di turno scrive il suo nome sul registro delle celle, in
            fondo alla pagina, sotto quello di un ubriaco di Via del Salmone.
          imposta: { registro-cifrato: 1, maedric: 2 }
          effetti: { rep.caserma: 1, pista.registro: 1 }
      - testo: "Lasciarlo scendere"
        descrizione: "Prendi il registro e gli lasci la corda. Un uomo che ama vivere se lo ricorda, e si ricorda anche la tua faccia."
        esito:
          titolo: La corda
          testo: |
            Raccogli il registro e fai un passo indietro. Maedric ti guarda un
            momento, come per esserne sicuro, poi scavalca il parapetto e
            scende lungo la corda, un nodo alla volta, finché la nebbia gli
            copre la testa. La corda resta tesa ancora un po' e poi si allenta.

            Sui ponti non lo vedrai più. Prima dell'alba, però, alla Pignatta
            Grassa sapranno che il registro del custode notturno adesso ce l'hai
            tu, e chi te l'ha lasciato prendere.
          imposta: { registro-cifrato: 1, maedric: 1 }
          effetti: { rep.scuri: -1, pista.registro: 1 }
      - testo: "Non dargli il tempo di arrivare alla corda"
        descrizione: "La sua mano sinistra è a un passo dalla corda, e un uomo dei ponti ha sempre un trucco in più."
        esito:
          titolo: Sulle assi
          testo: |
            La mano sinistra di Maedric si muove verso il parapetto, e tu
            colpisci prima di capire se cercava la corda. Lui cade di lato sulle
            assi e non si rialza. Il mantello cerato si apre, e sotto c'è
            soltanto una camicia rammendata.

            Il registro è dove l'aveva posato. Lo raccogli con le mani che
            tremano e resti accanto al corpo finché la nebbia comincia a calare.
            Domattina sul Ponte dei Morti troveranno un custode della Gilda con
            la testa spaccata, e qualcuno dirà di aver visto la tua sagoma nella
            nebbia. Prima di andartene raddrizzi una lanterna che nella lotta si
            è storta sul gancio.
          imposta: { registro-cifrato: 1, maedric: 3 }
          effetti: { tormento: 1, sospetto: 1, pista.registro: 1 }

  # ------------------------------------------------------------ 2 → 3 · il registro cifrato
  - id: il-registro-cifrato
    presso: biblioteca-di-qir-azel
    immagine: personaggi/mattias-crenn
    titolo: Il cifrario del custode
    sommario: "Il registro di Maedric è scritto a numeri e piccoli disegni. Al primo piano della Biblioteca Mattias Crenn legge il precuriano da trent'anni."
    luogo: Biblioteca di Qir-Azel, il primo piano
    area: quartieri-alti
    requisiti: [pista.registro == 2, invito >= 1]
    testo: |
      Il primo piano della Biblioteca è un corridoio di stanzette piene di
      carte. Quella di Mattias Crenn è l'ultima, con la porta che non si
      chiude per via di una pila di monografie appoggiata contro lo stipite.
      Sulla costola della prima c'è il timbro rosso della Confraternita,
      *respinta*, e lui accanto ci ha disegnato a matita un piccolo teschio.

      Posi il registro sul tavolo. Ti accorgi di averlo tenuto stretto contro
      il petto per tutta la salita, e la giubba ha preso l'odore della pelle
      umida. Mattias si pulisce le lenti sulla manica e apre il libro a metà.
      Per un po' resta zitto. Poi gira svelto tre pagine di fila e comincia a
      parlare a raffica.

      «Le date sono numeri, e anche le somme. I disegnini sono le merci e le
      persone. Questa ruota è un carro, questo sacco è grano. È il cifrario di
      un custode, fatto da uno che un testo precuriano non l'ha mai visto in
      vita sua.» Batte l'indice su una pagina. «La chiave però cambia ogni
      mese. Si fa, si fa. Ci vuole una notte, oppure qualcuno che sappia
      contare quasi quanto me.»

      Si toglie gli occhiali e ti guarda per la prima volta. «Trent'anni di
      Precursori, e questa città mi porta il libro mastro di un
      contrabbandiere. Una città intera mi deve un riconoscimento.» Poi si
      rimette gli occhiali e intinge la penna.
    opzioni:
      - testo: "Decifrarlo con lui"
        descrizione: "Tu leggi i numeri ad alta voce, lui cerca la chiave del mese. Serve qualcuno che sappia tenere il conto."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: La chiave di ogni mese
          testo: |
            Tu leggi i numeri e lui li scrive su un foglio, in colonna. Verso
            mezzanotte trovi la regola per primo. Il primo numero di ogni mese
            è la chiave, e tutto il resto va spostato di tanto. Mattias ti
            guarda da sopra le lenti e dice «bene» a denti stretti, e per un
            po' si pulisce gli occhiali più del necessario.

            All'alba il registro è aperto sul tavolo accanto a quaranta fogli
            di trascrizione, e Mattias dorme con la guancia su una monografia
            respinta. Tu hai la nuca rigida e gli occhi che bruciano, e cominci
            a leggere.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
        fallimento:
          titolo: Le colonne sbagliate
          testo: |
            Leggi i numeri ad alta voce, ma per due volte salti una riga, e la
            seconda volta Mattias se ne accorge dopo un'ora di conti. Si toglie
            gli occhiali e si stropiccia gli occhi, e da lì in avanti non ti
            lascia più leggere. Ti manda giù a prendere l'olio per la lampada e
            poi il pane, e quando torni ha già ricominciato da capo.

            All'alba la trascrizione è finita, tutta con la sua grafia. Tu hai
            passato la notte seduto sulle scale, e lui ti consegna i fogli senza
            guardarti, borbottando che in fondo era un cifrario da bambini.
          imposta: { registro.decifrato: 1 }
          effetti: { tormento: 0.5 }
          segue: il-registro-decifrato
      - testo: "Pagargli la cena con Ulric"
        descrizione: "Per sé Mattias non vuole soldi. Stasera però cena con Ulric Stanne, e il vino buono costa dieci monete."
        requisiti: [monete >= 10]
        esito:
          titolo: Il vino buono
          testo: |
            Gli metti dieci monete sul tavolo e gli dici che sono per il vino
            di stasera. Mattias le guarda come se fossero un'offesa. Poi le
            conta e se le infila nella manica. «Ulric beve soltanto quello delle
            colline di Laresh» dice, e ti accompagna alla porta lasciando il
            registro aperto sul tavolo.

            Quando torni, il giorno dopo, il registro è accanto a una bottiglia
            vuota e a una pila di fogli scritti fitti, e Mattias ha gli occhi
            rossi. «Ulric dice che sono un genio» racconta mentre ti porge i
            fogli, «e al terzo bicchiere lo dice sempre, ma stavolta aveva
            ragione.»
          imposta: { registro.decifrato: 1 }
          effetti: { monete: -10 }
          segue: il-registro-decifrato

  - id: l-archivio-dei-dazi
    immagine: personaggi/lira-demos
    titolo: L'archivio dei dazi
    sommario: "Alla Casa dei Nodi Lira Demos tiene i conti dei ponti, e da anni annota tutto quello che fa Maedric Holl in attesa di una prova."
    luogo: Casa dei Nodi, l'archivio dei dazi
    area: quartieri-alti
    requisiti: [pista.registro == 2, invito >= 1]
    testo: |
      L'archivio dei dazi occupa una sala lunga al secondo piano della Casa
      dei Nodi, con le finestre sulle catene dei ponti e il vento che fa
      tintinnare i vetri. Gli scaffali sono pieni di registri tutti uguali, e
      su ogni costola è inchiodato un tassello di legno inciso con un segno.
      Lira Demos lavora a un tavolo vicino alla finestra. È una mezzelfa con
      i capelli castani intrecciati di fili di rame sottili, e accanto al
      calamaio tiene una scatola di tasselli che ordina per forma mentre
      ascolta.

      Ti ascolta senza interromperti, e intanto le dita continuano a ordinare
      i tasselli. Quando posi sul tavolo il registro di Maedric si fermano. Lo
      apre con la punta di due dita, e ti fa venire in mente un medico che finalmente vede la
      ferita che aveva indovinato da lontano.

      «Sono sei anni che gli scrivo dietro tutto quello che vedo, e non avevo
      niente in mano» dice piano, e gira una pagina. Ti spiega che i numeri
      sono i turni di Maedric e che i disegni sono i tasselli che usa lei,
      copiati male. Per Lira i conti dei ponti sono pratica notarile, e il
      metodo rubato le dà quasi più fastidio delle somme.

      Un garzone passa con una pila di registri, e lei chiude il libro di
      pelle con il palmo, senza fretta. Poi ti fa cenno di sederti e avvicina
      la lampada.
    opzioni:
      - testo: "Riscontrarlo con i registri dei dazi"
        descrizione: "I turni di Maedric da una parte, i pedaggi registrati dall'altra. La merce è passata nelle notti in cui i conti non tornano."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Dove i conti non tornano
          testo: |
            Lira tira giù dagli scaffali sei anni di pedaggi notturni, e tu li
            leggi accanto ai turni di Maedric, una notte alla volta. Ogni volta
            che nel registro di pelle c'è un disegno e nei libri della Gilda non
            c'è niente, lei posa un tassello sul tavolo. A metà pomeriggio il
            tavolo è coperto di tasselli, e la chiave del cifrario si legge da
            sola nell'ordine in cui li ha messi.

            «Bel lavoro» dice Lira, e ti lascia tenere il tassello a forma di
            sacco, il primo che hai trovato tu.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
        fallimento:
          titolo: Un tassello fuori posto
          testo: |
            Leggi i turni di Maedric accanto ai pedaggi notturni, ma confondi
            due anni, e per un'ora Lira posa tasselli sulle notti sbagliate.
            Quando se ne accorge non alza la voce. Raccoglie i tasselli uno per
            uno e li rimette nella scatola in ordine di forma, poi ricomincia da
            sola dalla prima pagina.

            Finisce che è buio. Tu hai passato il pomeriggio a portarle registri
            su e giù per la scala, e il garzone ti ha visto ogni volta con il
            libro di pelle sotto il braccio. Lira ti consegna la trascrizione in
            una grafia minuta e diritta, e ti ringrazia lo stesso.
          imposta: { registro.decifrato: 1 }
          effetti: { sospetto: 0.5 }
          segue: il-registro-decifrato
      - testo: "Lasciarle il registro fino a domani"
        descrizione: "Lira non vuole soldi e non promette niente per iscritto. Ti chiede soltanto di aspettare."
        costo: 2
        esito:
          titolo: Pratica notarile
          testo: |
            Lira ti scrive una ricevuta per il registro e subito dopo la strappa,
            perché per iscritto non promette niente a nessuno. «Torna con la
            luce» dice, e chiude il registro nel cassetto del tavolo.

            Il giorno dopo la trovi allo stesso tavolo, con la camicia di ieri e
            un filo di rame che le è scappato dalla treccia. Ha trascritto tutto
            in una grafia minuta e diritta, e nei margini ha fissato un tassello
            accanto a ogni notte che anche lei aveva annotato per conto suo, e
            sono parecchie. Ti porge i fogli tenendoli con due mani.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato

  - id: il-registro-alla-pignatta
    presso: pignatta-grassa
    immagine: personaggi/rozalia-marga
    titolo: Il cifrario dei custodi
    sommario: "Alla Pignatta Grassa Rozalia Marga falsifica le carte della Gilda per gli Scuri, e i suoi cifrari li legge per mestiere. Tutto quello che decifra, però, finisce nelle sue cartelle."
    luogo: Pignatta Grassa, nel retrobottega
    area: citta-bassa
    requisiti: [pista.registro == 2]
    testo: |
      All'ora del mercato la Pignatta Grassa è mezza vuota, e Mauro Scrocco
      ti indica il retrobottega con il mento prima ancora che tu apra bocca.
      Sugli scaffali di legno chiaro le cartelle portano ciascuna il nome di
      una famiglia e di un mestiere, scritti a mano. Su una qualcuno ha
      scritto a matita *sigilli della Gilda, buoni*, poi ha cancellato
      *buoni* e sopra ha scritto *ottimi*.

      Rozalia Marga siede al banco con la piuma d'oca dietro l'orecchio. Le
      metti davanti il registro di Maedric, e lei batte due volte la penna
      sul calamaio prima di toccarlo. Lo sfoglia con l'unghia del mignolo,
      una pagina ogni due respiri, e a metà le si piega appena un angolo
      della bocca.

      «Il cifrario dei custodi, quello vecchio con i disegnini» dice. «Alla
      Casa dei Nodi lo usano da quando ero ragazza, e io ci ho imparato a
      leggere, per la precisione. Maedric ci ha messo una chiave che cambia
      ogni mese e si crede furbo.» Chiude il registro con il palmo. «Lo leggo
      in un pomeriggio. Ti avverto però che quello che passa per le mie mani
      finisce nelle mie cartelle» aggiunge, e indica gli scaffali con la
      penna.

      La sedia davanti al banco è più bassa di una spanna, e per guardarla
      devi alzare il mento. *Questa donna sa già quanto vale ogni riga di
      quel libro.* Dalla sala arriva la risata di Mauro, troppo forte per
      una battuta sola.
    opzioni:
      - testo: "Pagarle quindici monete"
        descrizione: "Il prezzo di un pomeriggio di lavoro. Una copia resterà sugli scaffali della Pignatta, e gli Scuri sapranno che cosa c'è scritto."
        requisiti: [squiggor <= 1, monete >= 15]
        esito:
          titolo: In pari
          testo: |
            Rozalia conta le monete senza toccarle, spostandole una alla volta
            con la punta della penna, e ti dice di tornare al tramonto. Al
            tramonto la trascrizione è pronta, in una grafia piccola e diritta,
            legata con un nastro da pacchi.

            Sullo scaffale alle sue spalle c'è una cartella nuova, senza
            etichetta, dello stesso spessore. «I conti li chiudo sempre in
            pari» dice, e batte due volte la penna sul calamaio. «Tu hai la tua
            copia, io la mia.»
          imposta: { registro.decifrato: 1 }
          effetti: { monete: -15, rep.scuri: 0.5, sospetto: 0.5 }
          segue: il-registro-decifrato
      - testo: "Pagarle venticinque monete"
        descrizione: "Squiggor Ironfist è morto in Via dei Rasoi, e Rozalia non l'ha dimenticato. Il prezzo è salito, e la copia resta a lei."
        requisiti: [squiggor >= 2, monete >= 25]
        esito:
          titolo: Il conto di Squiggor
          testo: |
            Rozalia ti ascolta senza alzare gli occhi dal foglio. «Squiggor mi
            doveva sei monete» dice. «Adesso non me le darà più, e le metto sul
            tuo conto con gli interessi.» Il prezzo è venticinque. Conta le
            monete con la punta della penna e ti dice di tornare al tramonto,
            senza chiamarti tesoro.

            Al tramonto la trascrizione ti aspetta su un angolo del banco, e la
            copia è già in una cartella sullo scaffale. Uscendo passi davanti a
            Mauro, che stavolta continua ad asciugare i bicchieri e non grida
            il tuo nome.
          imposta: { registro.decifrato: 1 }
          effetti: { monete: -25, rep.scuri: 0.5, sospetto: 0.5 }
          segue: il-registro-decifrato
      - testo: "Convincerla a non tenersi la copia"
        descrizione: "Quindici monete sul banco, e una buona ragione perché quel registro non finisca nelle sue cartelle. Se fallisci, paghi lo stesso."
        requisiti: [squiggor <= 1, monete >= 15]
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Una cartella in meno
          testo: |
            Le fai notare che nel registro ci sono pagamenti alla Pignatta, e
            che una copia sui suoi scaffali è proprio la carta che lo sceriffo
            verrebbe a cercare. Rozalia ci pensa battendo la penna sul
            calamaio tre volte invece di due, fuori dal solito.

            «Hai ragione, e mi secca» dice alla fine. Ti spinge indietro le
            monete con la penna e decifra il registro davanti a te, senza
            tenere niente. Al tramonto ti porge la trascrizione e brucia i fogli
            di prova nella stufa, uno per uno, mentre la guardi.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
        fallimento:
          titolo: Nelle cartelle
          testo: |
            Le spieghi perché una copia sui suoi scaffali sarebbe un rischio
            anche per lei, e Rozalia ti ascolta con la testa piegata di lato.
            «Tesoro, i rischi li tengo in ordine alfabetico» dice. «Quindici
            monete, e la copia resta a me.»

            Al tramonto la trascrizione è pronta, legata con un nastro da
            pacchi. Sullo scaffale alle sue spalle c'è una cartella nuova dello
            stesso spessore, e lei non fa niente per nasconderla.
          imposta: { registro.decifrato: 1 }
          effetti: { monete: -15, rep.scuri: 0.5, sospetto: 0.5 }
          segue: il-registro-decifrato
      - testo: "Convincerla a non tenersi la copia"
        descrizione: "Venticinque monete sul banco, e una buona ragione. Con Squiggor sottoterra Rozalia ti ascolta poco, e se fallisci paghi lo stesso."
        requisiti: [squiggor >= 2, monete >= 25]
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Il conto sospeso
          testo: |
            Le fai notare che nel registro ci sono pagamenti alla Pignatta, e
            che una copia sui suoi scaffali è proprio la carta che lo sceriffo
            verrebbe a cercare. Rozalia ti guarda a lungo, fredda, poi spinge
            indietro le monete con la penna.

            «Lo faccio perché mi conviene, e per nessun altro motivo» dice.
            «Il conto di Squiggor resta aperto.» Decifra il registro davanti a
            te senza tenerne copia, e al tramonto brucia nella stufa anche i
            fogli di prova, senza guardarti mentre lo fa.
          imposta: { registro.decifrato: 1 }
          segue: il-registro-decifrato
        fallimento:
          titolo: Con gli interessi
          testo: |
            Rozalia ti lascia parlare fino in fondo, poi ti dice che Squiggor le
            doveva sei monete e che le mette sul tuo conto con gli interessi.
            «Venticinque, e la copia resta a me» dice. «Le ragioni buone
            portale a qualcuno che non ha appena perso un amico.»

            Al tramonto la trascrizione ti aspetta su un angolo del banco, e la
            copia è già in una cartella sullo scaffale. Mauro, quando esci, non
            alza la testa dai bicchieri.
          imposta: { registro.decifrato: 1 }
          effetti: { monete: -25, rep.scuri: 0.5, sospetto: 0.5 }
          segue: il-registro-decifrato

  - id: il-registro-decifrato
    immagine: fazioni/gilda-dei-mercanti
    titolo: Quello che c'è scritto
    tipo: seguito
    luogo: Il registro di Maedric, decifrato
    area: quartieri-alti
    requisiti: [pista.registro == 2, registro.decifrato >= 1]
    testo: |
      Il registro copre sei anni di notti. Ogni riga è un passaggio sul Ponte
      dei Morti che nei libri della Gilda non esiste. Accanto alla data ci
      sono la merce e la somma, e in fondo a ogni pagina c'è la parte di
      Maedric, sottolineata due volte.

      Le righe con il sacco sono quasi tutte per i Malgrani. È grano dei
      villaggi di pianura che passava di notte e finiva nei magazzini della
      Città Bassa senza timbro e senza gabella, all'inizio una volta al mese e
      negli ultimi cinque anni quasi ogni settimana. In fondo al registro ci
      sono i nomi, una ventina. Sono quasi tutti riscossori e custodi dei
      ponti, più tre funzionari della Casa dei Nodi, ognuno con la sua cifra
      mensile accanto. Ogni mese poi una somma va a un piccolo cappuccio
      disegnato, e accanto al primo cappuccio Maedric ha scritto in chiaro
      *Pignatta*. Sono i pagamenti agli Scuri, uno per ogni mese di sei anni.

      Di orchi o di una Dama d'Argento non c'è una riga. Ti accorgi di aver
      cercato quel nome con il dito su tutte le pagine, e la delusione ti
      lascia in bocca un sapore acido.

      Il nome di Tarquin Cordani compare una volta sola, in un margine, con il
      disegno di un occhio aperto e una nota cifrata che vuol dire *non
      avvicinare*. Fra tutti quelli della Gilda, nel registro di Maedric il
      Sovrintendente è l'unico che sembra pulito.
    opzioni:
      - testo: "Contare i carri dei Malgrani"
        costo: 0
        esito:
          titolo: I sacchi
          testo: |
            Rifai il conto dei sacchi due volte, con un dito sulle righe e
            l'altro sulle somme. In sei anni sul Ponte dei Morti è passato di
            notte abbastanza grano da sfamare la Città Bassa per un inverno, e
            la Gilda non ne ha registrato un chicco.

            Per arrivare a Ottone Malgrani però non basta un sacco disegnato nel
            libretto di un contrabbandiere. Sul retro di un foglio ti segni di
            andare a vedere il Mulino Malgrani, l'unico rimasto in piedi in
            tutta la regione.
          pe: { politica-ed-economia: 5 }
          effetti: { pista.registro: 1 }
      - testo: "Rileggere i nomi della Gilda"
        costo: 0
        esito:
          titolo: Le cifre mensili
          testo: |
            Rileggi i nomi uno per uno. Due li conosci di vista, perché ti hanno
            fatto pagare la gabella all'imbocco con il sorriso. Accanto a ogni
            nome c'è la cifra del mese, e certe cifre sono più alte di quello
            che un riscossore guadagna in un anno.

            Con questo registro in mano metà dei ponti di Qir-Azel ti deve
            qualcosa, e l'altra metà vorrebbe vederti cadere da uno di quelli.
            Chiudi il libro e lo leghi stretto con lo spago, facendo un nodo doppio.
          effetti: { informazioni.segreto: 1, pista.registro: 1 }

  # ------------------------------------------------------------ 3 → 4 · i mulini bruciati
  - id: i-mulini-bruciati
    presso: segheria-e-mulino-malgrani
    immagine: ambientazione/mulino-malgrani
    titolo: L'unico mulino
    sommario: "Tre mulini bruciati in cinque anni, e uno solo rimasto in piedi. Chi lo manda avanti ha abbassato il prezzo della farina, e dorme male."
    luogo: Mulino Malgrani, Città Bassa
    area: citta-bassa
    requisiti: [pista.registro == 3]
    testo: |
      Il Mulino Malgrani sta dove la Città Bassa scende verso il Torvessa, un
      edificio di pietra blu con la ruota che gira giorno e notte e una
      nuvola di farina sempre sospesa davanti alla porta. In coda ci sono
      soprattutto donne con i sacchetti di tela, e qualche bambino mandato da
      solo che tiene le monete strette nel pugno. Sulla lavagna accanto alla
      porta il prezzo del sacco è stato cancellato due volte, e ogni volta
      riscritto più basso.

      In città lo sanno tutti. Negli ultimi cinque anni sono bruciati gli
      altri tre mulini della regione, e questo è l'unico che macina ancora.
      Alla Pignatta li mettono tutti nel conto della razzia, perché la razzia
      è l'ultima disgrazia che si ricordano, ma l'ultimo incendio, a
      Rivopuma, è di due anni fa.

      Anselmo Brey, il responsabile, esce dalla porta infarinato fino ai
      gomiti e starnutisce tre volte prima di salutarti. Ha un tic al
      sopracciglio destro, e quando gli dici chi sei il tic accelera. La
      farina ti si posa sulle ciglia. *Quest'uomo ha paura di qualcosa che
      non sono io.* Dietro il mulino un sentiero risale il torrente fuori
      dalla città, verso quello che resta del mulino di Rivopuma.
    opzioni:
      - testo: "Parlare con Anselmo Brey"
        immagine: personaggi/anselmo-brey
        descrizione: "Dicono che parli troppo alle domande dirette e poco a quelle generali. Bisogna fargli quelle giuste."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Domande dirette
          testo: |
            Gli chiedi chi gli porta il grano di notte, e Brey risponde troppo.
            Racconta che dopo ogni incendio arrivavano carri dai villaggi che
            prima macinavano altrove, sempre dopo la seconda campana, e che lui
            firmava le bolle senza il timbro della Gilda perché così voleva il
            padrone. Ti dice anche che ha abbassato il prezzo della farina, e la
            sua provvigione insieme, perché la gente in coda la conosce per
            nome.

            Poi si ferma, con il sopracciglio che salta, e dice che loro hanno
            parlato di incendio doloso e lui ha abbassato i prezzi, perché è
            quello che può fare. «Lo so che con gli incendi tutta la città ha
            cominciato a pensare ai Malgrani» aggiunge piano, guardando la coda
            davanti alla porta. «Ci penso anch'io, di notte.»
          effetti: { prove.malgrani: 2, pista.registro: 1 }
        fallimento:
          titolo: Domande generali
          testo: |
            Gli chiedi degli incendi in generale, e Brey per mezz'ora ti parla
            della ruota che va ingrassata e del raffreddore che gli viene dalla
            farina. Quando torni sugli incendi starnutisce e dice soltanto
            «Loro hanno detto incendio doloso. Io ho abbassato i prezzi.»

            Mentre esci un garzone del mulino ti passa accanto di corsa e prende
            la strada dei Quartieri Alti. Entro sera in casa Malgrani sapranno
            che qualcuno è venuto a fare domande, e da dietro la porta Brey ti
            guarda andare via con il sopracciglio che non smette di saltare.
          effetti: { prove.malgrani: 1, rep.malgrani: -0.5, pista.registro: 1 }
      - testo: "Andare a vedere il mulino di Rivopuma"
        descrizione: "A mezz'ora di cammino lungo il torrente restano le pietre annerite dell'ultimo mulino bruciato. Dopo due anni di pioggia qualcosa si legge ancora."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Le pietre annerite
          testo: |
            Del mulino di Rivopuma restano i muri senza tetto e la ruota
            bruciata a metà, piegata nell'acqua. Fra le erbacce trovi i cocci di
            tre giare da olio, di quelle grosse da magazzino, ciascuna in un
            angolo diverso. Il fuoco è partito da tre punti insieme. La macina è
            spaccata da un cuneo di ferro ancora piantato nella fessura, e un
            mulino con la macina spaccata non lo ricostruisce nessuno.

            Torni in città con le mani nere di fuliggine e un coccio avvolto nel
            fazzoletto.
          effetti: { prove.malgrani: 1, pista.registro: 1 }
        fallimento:
          titolo: Fuliggine
          testo: |
            Del mulino di Rivopuma restano i muri senza tetto e la ruota
            bruciata nell'acqua. Giri fra le pietre per un'ora e trovi soltanto
            fuliggine e un nido di gazza nel camino, e uscendo ti tagli la mano
            su un chiodo arrugginito della ruota.

            Sulla strada del ritorno un vecchio che spacca la legna ti racconta
            di aver visto l'incendio da casa sua, con il fumo che saliva da tre
            angoli. Lo dice come si parla del tempo, e torna alla sua legna.
          effetti: { prove.malgrani: 0.5, ferite: 0.5, pista.registro: 1 }
      - testo: "Confrontare le date con il registro"
        descrizione: "Gli incendi hanno una data, e anche i carri di grano nel registro di Maedric."
        requisiti: [registro.decifrato >= 1]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Le date
          testo: |
            Brey ti lascia sedere al suo banco fra i sacchi e ti presta i libri
            del mulino, senza capire bene perché. Metti le date degli incendi
            accanto alle righe del registro di Maedric. Dopo ogni incendio,
            entro un mese, sul Ponte dei Morti cominciano a passare di notte
            carri di grano per i Malgrani, dagli stessi villaggi che macinavano
            al mulino bruciato. È successo tutte e tre le volte, e nei libri del
            mulino quel grano risulta comprato al mercato.

            Ricopi le date su un foglio a parte, in colonna. Brey ti guarda da
            dietro i sacchi e si dimentica di starnutire.
          effetti: { prove.malgrani: 2, pista.registro: 1 }
        fallimento:
          titolo: I mesi che non tornano
          testo: |
            Metti le date degli incendi accanto alle righe del registro, ma i
            libri del mulino contano gli anni a modo loro, dalla fondazione
            della casata, e il registro di Maedric li conta come la Gilda. Ti
            perdi nei conti fino a sera.

            Alla fine l'unica cosa certa è che dopo l'incendio di Rivopuma i
            carri di grano dei Malgrani hanno cominciato a passare di notte ogni
            settimana. Per gli altri due incendi le date ti ballano davanti agli
            occhi, e Brey ti accompagna alla porta con una lanterna.
          effetti: { prove.malgrani: 1, pista.registro: 1 }

  # ------------------------------------------------------------ 4 → 5 · il rapporto a Galdrick
  - id: galdrick-e-il-registro
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: Il registro sul tavolo dello sceriffo
    sommario: "Hai il registro di Maedric decifrato e quello che hai visto ai mulini. Galdrick aspettava carte come queste da anni."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo
    area: quartieri-alti
    requisiti: [pista.registro == 4]
    testo: |
      I muratori se ne sono andati, e sul muro maestro dell'ufficio la crepa
      è coperta da una toppa d'intonaco fresco, più chiara del resto, dove
      qualcuno ha già appeso un calendario. Galdrick legge il registro di
      Maedric seduto, con la trascrizione accanto, e muove le labbra sui
      nomi mentre tu resti in piedi davanti al tavolo. Dopo un'ora ti accorgi
      di aver contato le pietre del pavimento, e sono trentasei.

      «Maedric Holl lo conosco di fama da anni» dice alla fine, chiudendo il
      registro. «In tutto questo tempo nessuno era riuscito a mettergli addosso una carta. Gli Scuri vendono quello
      che passa sui ponti, e gli orchi sui ponti non ci passano. Con la
      razzia gli Scuri non c'entrano. Lo sospettavo, e adesso posso metterlo
      agli atti» aggiunge, e batte un dito sui cappucci disegnati.

      Si alza e infila i pollici nella cintura. «La Gilda si regola da sola,
      e Cordani è l'unico manico pulito che le resta. Ottone Malgrani invece
      siede in Consiglio, e Julia Castaldi gli deve il grano di mezza città.
      Per portarlo davanti al Consiglio servono prove che non si possano
      spiegare in nessun altro modo» dice, guardando la toppa sul muro.

      «Fra pochi giorni muovo contro gli Scuri» dice poi a voce più bassa,
      anche se la porta è chiusa. «Ho quello che mi serviva, e adesso mi
      servono persone che non stiano né con la Gilda né con loro. Ti farò
      cercare» conclude, e torna a sedersi davanti al registro.
    opzioni:
      - testo: "Consegnargli tutto"
        descrizione: "Il registro con la trascrizione, e quello che hai visto ai mulini."
        requisiti: [jass == 0]
        esito:
          titolo: Agli atti
          testo: |
            Gli lasci il registro e la trascrizione, e gli racconti quello che
            hai visto ai mulini. Galdrick chiama il furiere e gli fa chiudere
            tutto nella cassa di ferro sotto il calendario, che si apre con due
            chiavi.

            «Con questo Cordani può ripulire la Casa dei Nodi se vuole, e io
            posso aspettare gli Scuri dove passano» dice. Ti stringe la mano
            forte, poi rimette i pollici nella cintura e torna a guardare il
            calendario come se ci avesse segnato sopra il giorno.
          effetti: { rep.caserma: 1, pista.registro: 1, racconto: 1 }
      - testo: "Consegnargli tutto"
        descrizione: "Il registro con la trascrizione, e quello che hai visto ai mulini."
        requisiti: [jass >= 1]
        esito:
          titolo: La casa di Via dei Rasoi
          testo: |
            Gli lasci il registro e la trascrizione, e gli racconti quello che
            hai visto ai mulini. Galdrick fa chiudere tutto nella cassa di ferro
            sotto il calendario, che si apre con due chiavi. Poi ti accompagna
            alla porta, e lì si ferma con la mano sulla maniglia.

            «E Nerissa…» comincia, e si corregge subito. «La casa di Via dei
            Rasoi, dopo la faccenda della ragazza rossa. È tranquilla, adesso?»
            Gli rispondi quello che sai, e lui annuisce piano, due volte. Quando
            apre la porta e ti saluta ha di nuovo la voce dello sceriffo.
          effetti: { rep.caserma: 1, pista.registro: 1, racconto: 1 }
      - testo: "Tenerti una copia"
        descrizione: "Le pagine del grano potrebbero servirti, il giorno che il Consiglio dovrà ascoltarti. Lo sceriffo però conta tutto."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Le pagine del grano
          testo: |
            Gli consegni il registro e la trascrizione, tranne quattro fogli
            che restano piegati nella fodera della tua giubba. Sono le pagine
            dei carri di grano per i Malgrani, ricopiate con la tua grafia.
            Galdrick conta i fogli muovendo le labbra. Il numero gli torna,
            perché la trascrizione l'hai rinumerata tu, e li chiude nella cassa
            di ferro.

            Uscendo dalla Caserma senti la carta frusciare a ogni passo, e tieni
            il braccio stretto contro il fianco fino in fondo alla discesa.
          effetti: { prove.malgrani: 1, pista.registro: 1, racconto: 1 }
        fallimento:
          titolo: Il taccuino
          testo: |
            Galdrick conta i fogli della trascrizione e alla fine alza gli
            occhi. «Ne mancano quattro» dice, e tende la mano aperta sopra il
            tavolo. Li tiri fuori dalla fodera della giubba, e lui li mette
            nella cassa insieme agli altri. Poi prende il taccuino dalla tasca
            della divisa e ci scrive una riga con la sua matita corta.

            «Capisco perché l'hai fatto» dice senza cattiveria, mentre rimette
            il taccuino in tasca. «Però in questa città chi si tiene le carte
            per sé finisce per somigliare a Maedric» aggiunge, e ti accompagna
            alla porta.
          effetti: { sospetto: 0.5, pista.registro: 1, racconto: 1 }
      - testo: "Chiedere una ricompensa"
        descrizione: "Hai rischiato la pelle su un ponte di notte per un lavoro da Caserma. Bisogna ricordarglielo con garbo."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: La cassa delle spese
          testo: |
            Gli ricordi le balestre nella nebbia del Ponte dei Morti, e gli fai
            notare che per un lavoro così la Caserma avrebbe mandato un sergente
            e sei uomini. Galdrick ci pensa, poi apre la cassa delle spese di
            servizio e conta venti monete sul tavolo di persona, senza chiamare
            il furiere.

            «Firma qui» dice, e ti porge la ricevuta. «La prossima volta che
            sali su un ponte di notte, però, dimmelo prima.»
          effetti: { monete: 20, pista.registro: 1, racconto: 1 }
        fallimento:
          titolo: Il tariffario
          testo: |
            Galdrick ti ascolta fino in fondo con i pollici nella cintura. Poi
            ti spiega che per i rapporti la Caserma ha un tariffario, e che alla
            voce *registri sequestrati* c'è scritto otto monete. Il furiere te
            le conta contro ricevuta.

            Lo sceriffo intanto guarda il calendario appeso sulla toppa
            d'intonaco, e quando ti saluta lo fa con un cenno del capo, senza
            togliere le mani dalla cintura.
          effetti: { monete: 8, rep.caserma: -0.5, pista.registro: 1, racconto: 1 }
