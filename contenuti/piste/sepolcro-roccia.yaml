# Il Sepolcro violato, la spedizione alla Roccia di Wren (pista.sepolcro 4 → 5).
# La strada parte dalla Città Bassa. Sulla Roccia le stanze vanno in ordine, secondo la profondità:
# 0 si arriva alla Roccia (dalla foschia o dai giunchi), 1 la porta della capanna, 2 il piano terra
# (gli uccelli o il libro), 3 le scale. Poi il cuore al piano di sopra, che riporta in città in ogni ramo.
# Una stanza superata non ricompare nella stessa visita (src/motore/spedizioni.ts).
quality:
  - { id: roccia.barca, nome: "Sei arrivat{o|a} alla Roccia in barca", categoria: stato, nascosta: true, descrizione: "1 se il vecchio ti ha lasciato ai giunchi, e la strada nella foschia non serve più." }

aree:
  - id: roccia-di-wren
    immagine: ambientazione/roccia-di-wren
    nome: Roccia di Wren
    sommario: "In cima c'è la capanna del Cucitore, che la Guardia ha bruciato cinque anni fa."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      A nord-est della città il Torvessa rallenta e si allarga in un'ansa di acqua melmosa. La corrente qui è
      così lenta che un ramo portato dal fiume gira nell'ansa per tutta la mattina prima di ritrovare
      l'uscita.

      In mezzo all'ansa si alza la Roccia di Wren, una lingua di pietra nera e lucida di umido che esce dritta
      dall'acqua. Dalla base sale un odore di fango e di legno bagnato.

      In cima c'è la capanna di Osric Wren, due piani di legno gonfio di muffa con il tetto di scandole ancora
      al suo posto. La Guardia le ha dato fuoco cinque anni fa, e dalla riva non si vede una sola trave
      annerita.

      Sulla Roccia non si posa nessun uccello.

storylet:
  # ------------------------------------------------------------ 4 · la strada (apre la spedizione)
  - id: la-strada-per-la-roccia
    immagine: ambientazione/roccia-di-wren
    titolo: La strada per la Roccia
    sommario: "La capanna del Cucitore sta su uno scoglio nero del Torvessa, a nord-est della città."
    luogo: Superficie Fratturata, lungo il Torvessa
    area: superficie-fratturata
    presso: riva-del-torvessa
    requisiti: [pista.sepolcro == 4]
    testo: |
      Esci dalla Città Bassa all'alba verso nord-est, dove le ultime case lasciano il posto agli orti e ai
      recinti delle capre. Gli orti sono chiusi da canne legate con il fil di ferro, e le capre alzano la
      testa quando passi. Sulla porta dell'ultima casa una donna sbatte un tappeto contro lo stipite, e si
      ferma quando le chiedi la strada per il fiume.

      «Il fiume è giù in fondo, sempre dritto» dice. «Allo Scoglio però mica ci va nessuno, e tu hai l'aria di
      andarci. Mio figlio aveva sei anni quando c'era il Cucitore, e adesso che ne ha undici guarda ancora
      sotto il letto prima di dormire, e poi ci riguarda.»

      {origine figlio-della-citta-bassa} Le Notti Cucite te le ricordi dai vicoli, con le porte sprangate
      prima del tramonto. Anche la tua schiena se le ricorda e si irrigidisce appena lei dice il nome.

      Il sentiero costeggia il Torvessa fra i rovi. L'acqua scorre lenta e color fango, e vicino alla riva le
      foglie girano sul posto nei mulinelli. Alla foce di un fosso c'è una barca da pesca tirata in secca
      sotto un salice, con il fasciame rappezzato di catrame e i remi incrociati sul fondo. Seduto sulla prua
      un vecchio ripara una rete con le dita gonfie. Ti guarda gli stivali prima della faccia.
    opzioni:
      - testo: "Seguire la riva a piedi"
        descrizione: "Il sentiero porta fin davanti alla Roccia, ed è lungo."
        costo: 1
        esito:
          titolo: Lungo il Torvessa
          testo: |
            Cammini per tutta la mattina con il fiume sulla destra. Verso mezzogiorno la vegetazione si apre
            all'improvviso, e in mezzo all'acqua melmosa vedi la Roccia di Wren che esce dritta dall'acqua con
            la capanna in cima. La pietra è nera e lucida di umido, e da qui conti i due piani di legno e le
            scandole del tetto, che sono ancora tutte al loro posto.

            Le imposte della capanna sono chiuse, e dal camino non esce fumo.
          imposta: { roccia.barca: 0 }
          vai: roccia-di-wren
      - testo: "Andare a cavallo lungo la riva"
        descrizione: "Il cavallo attraversa il fango a muso basso, e ci metti la metà del tempo."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il cavallo nel fango
          testo: |
            Il cavallo procede con il muso basso e gli zoccoli che risucchiano il fango a ogni passo, e dove
            la riva si stringe fra i rovi si apre la strada con il petto. A metà mattina sei già in vista
            della Roccia di Wren, nera in mezzo all'acqua melmosa, con la capanna in cima e le imposte chiuse.
            Leghi il cavallo a un salice storto. Mentre stringi il nodo tiene le orecchie girate verso la
            Roccia, poi abbassa il muso e comincia a strappare l'erba come se non ci fosse nient'altro al
            mondo.
          imposta: { roccia.barca: 0 }
          vai: roccia-di-wren
      - testo: "Pagare il vecchio per un passaggio in barca"
        descrizione: "Poche monete, e arrivi con le gambe riposate. Allo Scoglio però non attracca."
        requisiti: [monete >= 3]
        costo: 1
        esito:
          titolo: A remi
          testo: |
            Rema seduto di traverso, con la schiena al fiume, e i remi entrano nell'acqua melmosa senza uno
            schizzo. Parla per tutto il tragitto. «Dico io, allo Scoglio non ci attracco. Ti lascio ai giunchi
            e da lì ci arrivi coi piedi tuoi. Mio cognato ci ha attraccato l'anno dopo l'incendio. Adesso
            vende castagne in Città Bassa, e da allora, dico io, l'acqua non la guarda più.»

            Ti lascia dove i giunchi si fanno fitti, a un tiro di sasso dalla Roccia, e tiene la pala del remo
            piantata nel fango finché non sei a terra.
          effetti: { monete: -3, ferite: -0.5 }
          imposta: { roccia.barca: 1 }
          vai: roccia-di-wren
      - testo: "Riconoscere la faccia del vecchio"
        descrizione: "Quella mascella l'hai già vista in Città Bassa, dietro un carretto di castagne all'imbocco del Ponte del Pesce."
        quando: [origine.figlio-della-citta-bassa >= 1]
        costo: 1
        esito:
          titolo: Il cognato
          testo: |
            Gli dici che ha la stessa mascella del castagnaro che sta all'imbocco del Ponte del Pesce, quello
            che d'inverno ti regalava le castagne bruciate quando eri bambin{o|a}. «Mio cognato» dice.

            Ti fa salire senza parlare di monete e rema seduto di traverso, con la schiena al fiume,
            raccontandoti di come il cognato ha smesso di guardare l'acqua dopo aver attraccato allo Scoglio.
            Quando arriva a quella parte i colpi di remo si fanno più lenti. Ti lascia dove i giunchi si fanno
            fitti, a un tiro di sasso dalla Roccia, e spinge indietro la barca prima che tu abbia finito di
            scendere.
          effetti: { ferite: -0.5 }
          imposta: { roccia.barca: 1 }
          vai: roccia-di-wren
      - testo: "Seguire le piste degli animali lungo la riva"
        descrizione: "Al Circolo ti hanno insegnato che le bestie scendono a bere per la via più corta. Le loro piste arrivano prima del sentiero."
        quando: [origine.figlio-del-circolo >= 1]
        costo: 0
        esito:
          titolo: Le piste degli animali
          testo: |
            Lasci il sentiero dei rovi e scendi sulla striscia di fango dove l'acqua si è ritirata. Le volpi e
            i tassi vanno al fiume dritti, e qui le loro piste corrono fra le canne, battute da anni di zampe.
            Nel fango restano nette le impronte strette delle volpi e quelle larghe dei tassi, con il segno
            delle unghie davanti.

            A metà mattina il fango si apre su una spiaggetta di ghiaia, e davanti a te c'è la Roccia di Wren,
            nera nell'acqua melmosa, con la capanna in cima. Sulla riva che le sta di fronte le piste si
            interrompono tutte nello stesso punto. Le ultime impronte sono affondate sulla punta e girate
            verso il sentiero, dove le bestie si sono voltate per tornare indietro.
          imposta: { roccia.barca: 0 }
          vai: roccia-di-wren

  # ------------------------------------------------------------ le stanze (ripetibili, tre a caso)
  - id: roccia-sentiero-nella-foschia
    immagine: ambientazione/roccia-di-wren
    titolo: Il sentiero nella foschia
    sommario: "La foschia del Torvessa si chiude intorno al sentiero, e ai lati prendono forma figure che camminano al tuo passo."
    luogo: Roccia di Wren, lungo la riva
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 0, roccia.barca == 0]
    testo: |
      La foschia sale dal Torvessa a spirali lente, e del sentiero vedi soltanto i tre passi davanti agli
      stivali. È fredda e sa di acqua ferma, e sulle maniche ti lascia un velo di goccioline. Fra i rovi
      prendono forma delle figure che camminano alla tua andatura. Quando ti fermi si fermano anche loro, e la
      mano ti va alla cintura.

      {resilienza Media} Sono foschia, e si muovono perché la sposti camminando. Ripetitelo e lascia stare la
      cintura.

      {origine figlio-del-circolo} Nel Bosco di Velthar anche la nebbia ha i suoi rumori. Queste figure
      camminano senza spezzare un rametto, e l'orecchio allenato dal Circolo non trova niente da ascoltare.

      Il poco vento che c'è spinge la foschia verso l'acqua, e le figure camminano nella tua stessa direzione.
      Accanto al sentiero c'è un palo piantato storto nel fango, con una tavola inchiodata di traverso e
      grigia di muffa.
    opzioni:
      - testo: "Tenere gli occhi sul sentiero"
        descrizione: "Le figure sono foschia. Il sentiero invece è vero, e ti serve vederlo."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Un passo alla volta
          testo: |
            Abbassi lo sguardo e conti i sassi che affiorano, uno per passo. Sono piatti e lisci, e stanno a
            un passo d'uomo l'uno dall'altro come li avevano messi i pescatori. Le figure ti accompagnano per
            un tratto, poi una folata le stende sull'acqua e restano indietro. Quando rialzi la testa il
            sentiero è finito su una lingua di ghiaia che arriva fino alla Roccia di Wren, nera contro il
            bianco della foschia, e hai la mascella indolenzita a forza di stringerla.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Dietro la figura
          testo: |
            Una delle figure si stacca dalle altre e scende verso il fiume, e tu le vai dietro senza averlo
            deciso. Ti fermi quando l'acqua ti arriva alle ginocchia e la figura non c'è più. Dietro di te
            sulla riva ci sono soltanto le tue impronte, e si riempiono d'acqua una dopo l'altra. Torni sul
            sentiero bagnat{o|a} e tremante, e non sai più da che parte eri arrivat{o|a}. Ti ci vuole un pezzo
            per ritrovare il palo con la tavola, e ritrovarlo ti fa quasi piacere, come rivedere una faccia
            nota.
          effetti: { tormento: 1 }
      - testo: "Tagliare fra i rovi, lontano dall'acqua"
        descrizione: "Lontano dalla riva la foschia è più rada. I rovi però sono fitti."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Graffi
          testo: |
            Ti apri la strada con gli avambracci, e i rovi ti restituiscono il favore con gli interessi. Le
            spine sono lunghe una falange e si spezzano dentro la pelle. Lontano dall'acqua la foschia si
            dirada e le figure non ti seguono. Dopo un'ora sbuchi su una lingua di ghiaia che porta fino ai
            piedi della Roccia di Wren, con le maniche a brandelli e una spina nel pollice che toglierai
            stasera.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Nel roveto
          testo: |
            Il roveto è più fitto di quanto sembrava, e a metà ti ci ritrovi incastrat{o|a} con una spina
            piantata nel collo. I rami sono neri e duri, e a ogni strattone si richiudono dietro di te. Ne
            esci all'indietro, lasciando ai rami un pezzo di camicia e un po' di sangue, nello stesso punto da
            cui eri entrat{o|a}. Ti tamponi il collo con la manica, e la manica torna indietro rossa. Da qui
            il roveto sembra più fitto di prima.
          effetti: { ferite: 0.5 }
      - testo: "Seguire il fiume, anche se è più lungo"
        descrizione: "Allunghi di molto la strada, ma almeno sai dov'è l'acqua."
        costo: 2
        esito:
          titolo: Il giro del fiume
          testo: |
            Lasci il sentiero e segui la riva, dove la foschia è più bassa e i piedi affondano nel fango fino
            alla caviglia. Le figure fra i rovi ti accompagnano per un tratto e poi restano indietro. Si
            fermano tutte dove il terreno comincia a salire, in fila sul bordo dei rovi. Arrivi ai piedi della
            Roccia dal lato della ghiaia, con gli stivali pieni d'acqua e i polpacci che bruciano. La luce sul
            fiume è già cambiata due volte, e tu hai smesso di contare le zanzare.
          effetti: { profondita.roccia-di-wren: 1, ferite: 0.5 }

  - id: roccia-riva-dei-giunchi
    immagine: ambientazione/roccia-di-wren
    titolo: La riva dei giunchi
    sommario: "Fra la riva e la Roccia ci sono i giunchi e l'acqua ferma, e sopra una passerella che nessuno ripara da anni."
    luogo: Roccia di Wren, la riva dei giunchi
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 0]
    testo: |
      Fra la riva e la Roccia di Wren c'è una distesa di giunchi più alti di te, piantati in un'acqua nera e
      ferma. Ci passa sopra una passerella di assi su pali, costruita dai pescatori prima delle Notti Cucite e
      mai più riparata. Metà delle assi è marcia, e in tre punti mancano. Dove il legno si è ritirato marcendo
      i chiodi sporgono di un dito, neri di ruggine.

      {acrobazia Media} Le assi buone sono quelle più scure ai bordi, dove i pescatori mettevano i piedi. Se
      segui il loro passo i buchi diventano salti.

      {origine apprendista-raschiatore} Sulle piattaforme della Cicatrice un'asse marcia la riconosci
      battendoci sopra il tacco. Il piede lo fa da solo, e la prima asse risponde con un tonfo sordo.

      Fra i giunchi non si muove niente, e l'acqua resta liscia anche quando ti arriva un soffio d'aria sulla
      faccia. All'imbocco della passerella c'è uno stivale da pescatore piantato nel fango e pieno d'acqua,
      con il cuoio crepato e la suola staccata a metà. Dentro c'è una rana che ti guarda senza curiosità.
    opzioni:
      - testo: "Passare sulla passerella"
        descrizione: "Un'asse alla volta, saltando dove mancano."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Le assi buone
          testo: |
            Provi ogni asse con la punta dello stivale prima di caricarci il peso, e dove manca salti. A ogni
            salto l'asse dove atterri si piega e i pali scricchiolano fino in fondo alla fila. Arrivi alla
            roccia con le mani che tremano e le ginocchia ancora piegate, pronte a un salto che non serve più.
            La rana, dallo stivale, non ha cambiato espressione, e a te viene voglia di ringraziarla lo
            stesso.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Nel fango
          testo: |
            La terza asse cede sotto il tallone e ci vai dentro fino alla vita. Sotto l'acqua il fango è più
            tiepido dell'acqua e ti risucchia le gambe a ogni movimento. Ti tiri fuori aggrappat{o|a} a un
            palo, con una scheggia nel palmo, e torni a riva a svuotarti le scarpe accanto alla rana. Lei ti
            guarda come prima, e il fango ti si secca sui calzoni in una crosta grigia che si incrina a ogni
            passo.
          effetti: { ferite: 0.5 }
      - testo: "Guadare fra i giunchi, tastando il fondo"
        descrizione: "Dove i giunchi hanno le radici più grosse, il fondo regge."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il fondo che regge
          testo: |
            Segui le radici più spesse, quelle che i giunchi allungano dove il fondo è di sasso, e l'acqua non
            ti sale oltre il ginocchio. Le radici sono grosse come un polso e sotto la suola fanno da gradino.
            Esci sulla roccia nera bagnat{o|a} fino alle cosce, ma ancora con entrambi gli stivali. Ti strizzi
            i calzoni sulla pietra, e l'acqua che cola è nera.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Il guado
          testo: |
            A metà del guado una cosa morbida ti scivola lungo il polpaccio e si stringe intorno alla caviglia
            tanto da farti sentire l'osso. Quando guardi giù vedi soltanto acqua nera e un giro di cerchi che
            si allarga verso la Roccia. Torni a riva senza ricordarti di aver deciso di farlo, e ci metti un
            pezzo a far smettere di tremare le mani. Sulla caviglia, quando ti togli lo stivale, c'è un segno
            rosso largo due dita.
          effetti: { tormento: 1 }
      - testo: "Fare il giro largo fino alla secca"
        descrizione: "Molto più a valle i giunchi diradano e il fondo diventa sabbia."
        costo: 2
        esito:
          titolo: La secca
          testo: |
            Scendi lungo la riva finché i giunchi non diradano e sotto i piedi trovi la sabbia. È fine e
            grigia, e a ogni passo si alza in una nuvola che la corrente porta verso valle. L'acqua ti arriva
            alla vita ed è più fredda di quanto avessi messo in conto, tanto che a metà guado smetti di
            sentire le dita dei piedi e cominci a sentire i denti. Risali sull'isolotto dal lato opposto alla
            passerella, con i denti che battono e la Roccia che adesso ti sta proprio sopra.
          effetti: { profondita.roccia-di-wren: 1, ferite: 0.5 }

  - id: roccia-la-porta
    immagine: ambientazione/roccia-di-wren
    titolo: La porta della capanna
    sommario: "In cima a una scala appoggiata alla roccia c'è la porta della capanna, con il chiavistello a forma di testa d'uccello."
    luogo: Roccia di Wren, in cima alla scala
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 1]
    testo: |
      Contro la parete della Roccia è appoggiato un troncone di scala che arriva fino alla cengia sotto la
      capanna. I pioli sono legati ai montanti con una corda incatramata, e sotto il tuo peso non si muovono.
      Ai piedi della scala è inchiodata una targa di bronzo verde di ossido. Dice che il luogo è chiuso per
      ordine dello *sciriffo* di Qir-Azel nell'anno 145, e l'incisore ha sbagliato proprio la parola più
      importante.

      {origine rampollo-dei-quartieri-alti} Nei Quartieri Alti una targa così l'avrebbero rifusa in giornata.
      Quaggiù è rimasta cinque anni a prendere il verde.

      La porta della capanna è di legno scuro gonfio d'umido, senza un segno di bruciatura. Ci passi sopra le
      dita e trovi soltanto muffa, che ti lascia i polpastrelli verdi e non sa di fumo. Il chiavistello è una
      testa d'uccello intagliata con il becco rivolto in giù.

      {tecnologia Media} Alla base del collo la testa d'uccello ha un giunto sottile, ed è fatta per girare
      come una maniglia. Nel giunto non c'è un granello di polvere.
    opzioni:
      - testo: "Forzare la porta con la spalla"
        descrizione: "Il legno è gonfio e la porta è vecchia."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La spallata
          testo: |
            Alla terza spallata la porta si apre di colpo, e per poco non finisci lung{o|a} distes{o|a} sul
            pavimento. Dietro di te la porta torna ad accostarsi da sola, piano, finché il chiavistello non fa
            clic. Le imposte sono chiuse e nella stanza non passa un filo d'aria che possa averla spinta. La
            spalla ti farà male fino a domani sera.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Tre colpi
          testo: |
            Colpisci la porta con la spalla tre volte, e la porta non si muove. Dopo il terzo colpo,
            dall'interno, arrivano tre colpi di risposta, sordi come di legno contro legno e con lo stesso
            intervallo dei tuoi. Ti ritrovi in fondo alla scala senza ricordarti di averla scesa, e la spalla
            comincia a farti male solo lì.
          effetti: { tormento: 1 }
      - testo: "Studiare il chiavistello a testa d'uccello"
        descrizione: "Un intagliatore di uccelli faceva anche le serrature a modo suo."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il becco in su
          testo: |
            La testa d'uccello gira su un perno nascosto nel collo. Quando il becco punta verso l'alto, dentro
            la porta scatta un saliscendi di legno e la porta si apre senza un cigolio. Il meccanismo è fatto
            con una cura che nei Quartieri Alti non trovi nemmeno sulle porte dei Malgrani, con ogni pezzo
            incastrato senza un chiodo. Ci passi sopra il pollice, e il legno è lisciato dalle mani e ancora
            tiepido, come se qualcuno l'avesse appena lasciato.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Il morso
          testo: |
            Giri la testa d'uccello a destra e a sinistra, e alla fine il becco si chiude sul tuo indice con
            uno scatto secco. Dentro il becco ci sono due file di dentini intagliati nel legno. Ti lascia
            andare solo quando strappi via la mano, e un po' di pelle resta fra le sue mandibole di legno. Ti
            succhi il dito in fondo alla scala, e la porta resta chiusa.
          effetti: { ferite: 0.5 }
      - testo: "Entrare dalla finestra sul retro"
        descrizione: "È stretta, e il davanzale è irto di schegge."
        costo: 2
        esito:
          titolo: Le schegge
          testo: |
            Giri attorno alla capanna tenendoti alla parete di roccia, fino a una finestra senza vetro sul
            retro. La cengia è larga una spanna, e sotto le dita la pietra è viscida di umido. Ti ci infili di
            traverso, una spalla alla volta, e il davanzale ti lascia nei palmi una dozzina di schegge
            sottili. Mentre te le togli con i denti ti accorgi che la porta è socchiusa, con il chiavistello a
            testa d'uccello già sollevato.
          effetti: { profondita.roccia-di-wren: 1, ferite: 0.5 }

  - id: roccia-gli-uccelli-intagliati
    immagine: ambientazione/roccia-di-wren
    titolo: Gli uccelli intagliati
    sommario: "Il piano terra della capanna è coperto da centinaia di uccelli di legno. Alcuni hanno tre occhi oppure il becco di metallo."
    luogo: Roccia di Wren, il piano terra della capanna
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 2]
    testo: |
      Le pareti sono coperte di centinaia di intagli, tutti uccelli, fitti dal pavimento fino alle travi del
      soffitto. Fra i corvi e i gufi scolpiti penna per penna ce ne sono alcuni storti che hanno tre occhi o
      il becco di metallo. I tavoli sono rovesciati e sul pavimento ci sono scalpelli arrugginiti. Il metallo
      dei becchi invece è lucido, e in tutta la stanza è l'unica cosa che la ruggine non ha toccato.

      Su uno scaffale vicino alla porta c'è una fila di passeri tutti uguali, ognuno con il cartellino del
      prezzo legato a una zampa.

      {conoscenze-della-strada Facile} Sono prezzi da bancarella, più bassi di quanto valgano, da uno che
      voleva venderli ai bambini.

      {origine mercante-dei-ponti} Per mestiere leggi il cartellino prima del passero. Sui Ponti un prezzo
      scritto con tanta cura vuol dire che chi lo scriveva aspettava i clienti uno per uno.
    opzioni:
      - testo: "Passare fra i tavoli senza toccare niente"
        descrizione: "Gli scalpelli sono dappertutto, e sono arrugginiti."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Fra gli scalpelli
          testo: |
            Scavalchi un tavolo e metti i piedi nei vuoti fra gli scalpelli, uno alla volta, senza far
            tintinnare il ferro. Gli uccelli restano dove sono. Passandoci vicino vedi che il terzo occhio è
            inciso più a fondo degli altri due, e con un colpo solo. Ti rimane la sensazione precisa che
            quelli con tre occhi li abbiano fatti con tre occhi per un motivo, e arrivi in fondo alla stanza
            con la nuca fredda.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Ruggine
          testo: |
            Un tavolo rovesciato si sposta sotto il tuo peso e uno scalpello ti si pianta di traverso nel
            polpaccio. La ruggine ti lascia sulla pelle una macchia arancione. Te la strofini con la manica, e
            la macchia si allarga sulla pelle. Torni verso la porta zoppicando, e sullo scaffale la fila di
            passeri con il cartellino adesso è girata verso di te.
          effetti: { ferite: 0.5 }
      - testo: "Esaminare gli intagli"
        descrizione: "Un intagliatore non ne scolpisce tanti senza tenerne il conto."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le date
          testo: |
            Sotto ogni intaglio c'è una data incisa con la punta del coltello. I corvi e i gufi sono vecchi di
            vent'anni, e il loro legno si è scurito fino al colore del tabacco. Gli uccelli con tre occhi e
            con il becco di metallo hanno date più recenti, tutte dell'anno 145, e sono girati verso le scale.
            Il 145 è l'anno delle Notti Cucite, e la mano ti va al colletto prima che la testa ci arrivi.
          effetti: { profondita.roccia-di-wren: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Gli occhi
          testo: |
            Cominci a contare gli occhi degli uccelli storti e non riesci a smettere. Quando arrivi a trecento
            ti accorgi che stai muovendo le labbra, e che fuori la luce è cambiata. Esci all'aria aperta a
            guardare il fiume, e ci resti più a lungo di quanto vorresti, con la schiena contro le assi della
            capanna. Il numero ti resta in testa per tutto il giorno, e non è un numero tondo.
          effetti: { tormento: 1 }
      - testo: "Attraversare la stanza a occhi bassi"
        descrizione: "Non guardarli. Contare i passi e basta."
        costo: 2
        esito:
          titolo: A occhi bassi
          testo: |
            Tieni lo sguardo sulle assi del pavimento e conti i passi a mezza voce, come da bambin{o|a} per
            non pensare al buio. Sotto le suole scricchiolano trucioli vecchi e secchi. Arrivat{o|a} a
            ventitré ti accorgi che da un pezzo conti anche il ticchettio che viene dalle pareti, e che il
            ticchettio va un poco più svelto di te. Raggiungi il fondo della stanza con le tempie che pulsano
            e la gola secca, e il numero ventitré che ti resta incollato alla lingua.
          effetti: { profondita.roccia-di-wren: 1, tormento: 1 }

  - id: roccia-il-libro-di-schizzi
    immagine: ambientazione/roccia-di-wren
    titolo: Il libro di schizzi
    sommario: "Su un tavolo rimasto in piedi c'è un libro di schizzi aperto, con studi di ali che pagina dopo pagina diventano macchine."
    luogo: Roccia di Wren, il piano terra della capanna
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 2]
    testo: |
      Fra i tavoli rovesciati ce n'è uno solo in piedi, sotto la finestra, con un libro di schizzi aperto e
      una matita consumata. I tavoli rovesciati hanno addosso uno strato grigio di polvere, e su questo non ce
      n'è. Le pagine sono piene di studi di ali e di ossa disegnati con mano ferma. Più avanti le ali
      diventano macchine con articolazioni di metallo e filamenti di rame al posto dei tendini, e accanto a
      ogni disegno ci sono le misure.

      {tecnologia Media} Chi ha disegnato le articolazioni sapeva come si muove un gomito di metallo. Le
      misure però sono quelle di un corpo d'uomo.

      {origine allievo-di-torvessa} All'Accademia ti hanno insegnato a partire dalle misure. Wren cominciava
      dall'ala e aggiungeva i numeri dopo, perché sapeva già che cosa voleva vedere.
    opzioni:
      - testo: "Leggere gli appunti"
        descrizione: "La grafia è minuta e i calcoli sono lunghi."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: Le ali di rame
          testo: |
            Gli appunti sono calcoli di pesi e di leve, scritti in colonne ordinate con i risultati
            sottolineati due volte. Secondo i numeri di Wren nessuna di queste ali avrebbe mai retto un uomo,
            e lui lo sapeva, perché accanto all'ultimo calcolo ha scritto «non serve che volino». Strappi le
            pagine dei calcoli e le pieghi sotto la camicia. In Biblioteca sapranno leggerle meglio di te.
          effetti: { profondita.roccia-di-wren: 1, informazioni.segreto: 0.5 }
        fallimento:
          titolo: La matita
          testo: |
            Leggi una pagina e poi un'altra, e i calcoli cominciano ad avere senso, cosa che non ti piace
            affatto. Poi ti accorgi di avere in mano la matita di Wren e di aver aggiunto una piuma al margine
            di un disegno. Il legno della matita è consumato da una presa più larga della tua. La piuma è
            venuta bene, e questo ti piace ancora meno. La rimetti giù e ti strofini le dita sui calzoni
            finché non bruciano.
          effetti: { tormento: 1 }
      - testo: "Guardare soltanto i disegni"
        descrizione: "I disegni si capiscono anche senza leggere, e si dimenticano prima."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Facile }
        successo:
          titolo: Ali chiuse
          testo: |
            Sfogli in fretta guardando i disegni, e le parole le salti. Le ali di piume diventano ali di
            metallo pagina dopo pagina, e verso la fine il tratto si fa così pesante che in due punti la
            matita ha bucato la carta. L'ultima tavola è un'ala sola e finita, ombreggiata come una cosa vera.
            Chiudi il libro prima di chiederti a che cosa servisse, e ci appoggi sopra la matita, parallela al
            dorso, come l'avresti trovata.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: L'ultima tavola
          testo: |
            L'ultima tavola è un'ala finita, disegnata così bene che ti sembra di sentirla frusciare. Chiudi
            il libro di colpo e resti con le mani sulla copertina ad aspettare che il fruscio smetta. Sotto i
            palmi la copertina è fredda come la pietra della Roccia. Smette dopo un po', quando hai già perso
            il conto del tempo. Fuori dalla finestra la foschia del fiume si è alzata fino ai giunchi più
            alti.
          effetti: { tormento: 1 }
      - testo: "Chiudere il libro e portarlo via"
        descrizione: "Lo leggerai dopo, alla luce del giorno, se ne avrai ancora voglia."
        costo: 2
        esito:
          titolo: Il libro sotto la giacca
          testo: |
            Chiudi il libro e te lo infili sotto la giacca, contro le costole. Pesa più di quanto dovrebbe un
            quaderno di schizzi, e per tutto il resto della salita lo senti tiepido sul fianco, come un
            animale che dorme. Quando lo riapri, più tardi, le pagine delle ali si sono incollate fra loro per
            l'umido e non c'è verso di separarle.
          effetti: { profondita.roccia-di-wren: 1, tormento: 1 }

  - id: roccia-le-scale-marce
    immagine: ambientazione/roccia-di-wren
    titolo: Le scale marce
    sommario: "Dal piano di sopra scende un'aria fredda, e con l'aria un rumore leggero e regolare, come un attrezzo che batte sul legno."
    luogo: Roccia di Wren, ai piedi delle scale
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 3]
    testo: |
      In fondo alla stanza una scala di legno ripida e stretta sale al piano di sopra, con i gradini neri di
      umido. Ai piedi della scala c'è un paio di pantofole di feltro allineate con la punta verso il primo
      gradino. Dall'alto scende un'aria fredda e un rumore leggero, *toc… toc… toc*, di un attrezzo che batte
      sul legno. Ti dici che può essere un'imposta lasciata libera dal vento. Da fuori le imposte le hai viste
      chiuse tutte.

      {atletica Media} I gradini sono marci al centro e ancora buoni contro il muro. Chi sale con il peso
      sulle braccia arriva in cima.
    opzioni:
      - testo: "Ascoltare il rumore prima di salire"
        descrizione: "A ogni colpo la scala vibra. Le orecchie possono dirti dove mettere i piedi."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il ritmo
          testo: |
            Resti immobile ai piedi della scala e ascolti. Il rumore viene dal fondo del piano di sopra,
            sempre dallo stesso punto, e a ogni colpo la scala vibra appena. I gradini buoni sono quelli che
            vibrano meno, dove le travi entrano nel muro, e li conti uno per uno finché non li sai a memoria.
            Sopra di te il rumore continua con lo stesso passo, e mentre conti non accelera e non rallenta
            mai.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Il silenzio
          testo: |
            Ti fermi con un piede sul primo gradino per sentire meglio, e il rumore smette nello stesso
            momento. Resti ad aspettare che riprenda, con il cuore che ti batte nelle orecchie, ma per un bel
            pezzo non riprende. Nel silenzio senti il gradino assestarsi sotto il tuo piede con uno
            scricchiolio lungo. Torni fino alla porta camminando all'indietro, e solo sulla soglia lo senti
            ricominciare.
          effetti: { tormento: 1 }
      - testo: "Salire tenendoti al muro"
        descrizione: "Se il peso lo regge il muro, ai gradini resta poco da reggere."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Contro il muro
          testo: |
            Sali di lato, con la schiena contro la parete e i palmi aperti sul legno, e lasci ai gradini solo
            la punta dei piedi. A metà rampa vedi in cima una tenda di tela grezza, e il rumore viene da
            dietro la tenda. L'aria che scende da lì si fa più fredda a ogni gradino, e il fiato ti esce
            bianco. Fai gli ultimi gradini più piano dei primi e arrivi in cima con le mani sporche di muffa
            fino ai polsi.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Il quarto gradino
          testo: |
            Il quarto gradino si sbriciola sotto il tuo peso e la gamba ci passa attraverso fino al ginocchio.
            Dentro il gradino il legno è soffice e bucato di gallerie, e sa di funghi. Il legno marcio ti apre
            lo stinco. Ti tiri fuori piano mordendoti il labbro, mentre sopra di te il rumore continua senza
            perdere un colpo. Ti fasci la gamba con un pezzo di camicia, e il sangue passa la stoffa in fretta
            lo stesso.
          effetti: { ferite: 0.5 }
      - testo: "Salire con le pantofole di feltro"
        descrizione: "Sono più o meno della tua misura, e sul legno il feltro non si sente."
        costo: 2
        esito:
          titolo: Il feltro
          testo: |
            Ti togli gli stivali e infili le pantofole, che ti stanno quasi bene, e questo ti mette più a
            disagio del resto. Il feltro è morbido e un po' umido, e sui primi due gradini non fa nessun
            rumore. Al terzo la scala scricchiola forte sotto il tuo peso, e il toc toc di sopra si interrompe
            un momento prima di riprendere, un poco più lento. Sali gli ultimi gradini con le mani contro il
            muro e i piedi che sentono attraverso il feltro ogni nodo del legno.
          effetti: { profondita.roccia-di-wren: 1, tormento: 1 }

  # ------------------------------------------------------------ la carta della spedizione
  - id: roccia-l-airone
    immagine: ambientazione/roccia-di-wren
    titolo: L'airone
    sommario: "Ai piedi della Roccia c'è un airone fermo su un sasso. Non vola via quando ti avvicini."
    luogo: Roccia di Wren, nelle acque basse
    area: roccia-di-wren
    tipo: carta
    requisiti: [pista.sepolcro == 4]
    testo: |
      Su un sasso piatto ai piedi della Roccia c'è un airone cenerino fermo su una zampa. È l'unico uccello
      che hai visto da quando la foschia si è chiusa intorno a te, e non vola via quando ti avvicini. Tiene il
      collo piegato e il becco puntato verso la capanna in cima alla Roccia, e non lo sposta nemmeno quando i
      tuoi stivali fanno rumore nell'acqua bassa.

      Ha un'ala che pende di lato, steccata con due assicelle di legno intagliato e un filo di rame girato
      intorno alle penne. Le assicelle sono lisciate a coltello e hanno gli spigoli smussati perché non
      tagliassero la pelle. Il rame è diventato verde, e sotto il filo le penne sono spezzate. Il filo fa sei
      giri stretti e ha i capi ritorti insieme con una pinza, e da allora nessuno li ha più toccati.

      {origine fuggiasco-di-ghoran} Le penne sono cresciute intorno al filo, e in due punti lo coprono del
      tutto. Ti guardi i polsi senza volerlo, e te ne vergogni.

      {addestrare-animali Media} Non vola via perché non può, e non ti attacca perché è stanco. Ha le piume
      del petto arruffate e opache, e la zampa su cui si regge trema appena. Se gli arrivi davanti piano dal
      lato dell'ala buona ti lascia fare.
    opzioni:
      - testo: "Liberarlo dal filo di rame"
        descrizione: "Il filo stringe da anni, e l'airone non ti conosce."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: Un volo basso
          testo: |
            Gli parli a voce bassa mentre ti avvicini, del tempo che fa e di altre cose senza importanza, e
            lui ti lascia arrivare. Il filo è verde e si sbriciola fra le dita, e le assicelle cadono in
            acqua. Dove c'era il filo resta sull'ala un solco nudo e verde di ossido, in cui le penne non sono
            più cresciute. L'airone resta fermo ancora un momento, poi apre le ali e si alza in un volo basso
            e storto sopra il fiume, lontano dalla Roccia.
          effetti: { tormento: -0.5 }
        fallimento:
          titolo: Il becco
          testo: |
            L'airone ti lascia avvicinare fino a un braccio di distanza, poi scatta. Il becco ti prende sul
            dorso della mano e ti apre la pelle fino alle nocche, con un taglio dritto che comincia a
            sanguinare solo dopo un momento. Quando ti tiri indietro lui è di nuovo immobile sul sasso, su una
            zampa, con la testa girata verso la capanna. Ti avvolgi la mano nel fazzoletto, e lui non ti degna
            più di un'occhiata.
          effetti: { ferite: 0.5 }
      - testo: "Guardare dove guarda lui"
        descrizione: "L'airone tiene la testa girata verso la capanna."
        esito:
          titolo: La finestra di sopra
          testo: |
            Ti metti accanto al sasso e segui con lo sguardo il becco dell'airone. Punta verso una finestra
            del piano di sopra, dove le imposte sono chiuse e le stecche sono gonfie d'umido. Dopo un po'
            dietro le imposte passa una luce bianca e fredda, da un lato all'altro della stanza, e dalle
            fessure esce in righe sottili. Si muove all'altezza di un uomo in piedi, e ogni tanto si ferma per
            il tempo di un colpo di scalpello. L'airone la segue con il becco per tutto il tragitto. Alla
            Pignatta, quando lo racconterai, ti offriranno da bere per sentirlo due volte.
          effetti: { informazioni.voce: 1 }
      - testo: "Avvicinarti come al Circolo"
        descrizione: "Al Circolo un uccello ferito si avvicina di fianco, con gli occhi bassi e le mani dove le può vedere."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Di fianco
          testo: |
            Entri nell'acqua bassa di fianco dal lato dell'ala buona, con lo sguardo sul sasso e non su di
            lui, come ti hanno insegnato nel Bosco di Velthar. L'acqua è fredda e il fondo cede sotto gli
            stivali, e tu ci metti il peso piano per non fare onde. Il filo di rame si sbriciola sotto le
            unghie, e le assicelle le prendi una alla volta prima che cadano, perché nessuno le ha fatte per
            finire nel fango. L'airone non gira la testa nemmeno quando gli tocchi l'ala. Resta fermo ancora
            un momento, poi apre le ali e si alza in un volo basso e storto sopra il fiume, lontano dalla
            Roccia.
          effetti: { tormento: -0.5 }
      - testo: "Togliere la steccatura come in infermeria"
        descrizione: "Al Velo hai tolto più di una fasciatura rimasta su troppo a lungo. Un'ala è un braccio con le piume."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: mentale, abilita: [medicina], difficolta: Media }
        successo:
          titolo: La fasciatura vecchia
          testo: |
            Gli tieni ferma l'ala contro il corpo con il palmo aperto, come si tiene il braccio di un
            ricoverato che ha paura, e srotoli il filo un giro alla volta invece di tagliarlo. Sotto, la pelle
            è segnata ma intera, con sei solchi verdi uno accanto all'altro. Sotto il palmo senti il cuore che
            gli batte svelto e leggero. L'airone sopporta tutto con l'occhio giallo fisso sulla capanna, poi
            apre le ali e si alza in un volo basso e storto sopra il fiume, lontano dalla Roccia.
          effetti: { tormento: -0.5 }
        fallimento:
          titolo: Il ricoverato
          testo: |
            Gli prendi l'ala con la sicurezza dell'infermeria, e l'airone non è un ricoverato. Sotto le tue
            dita l'ala si irrigidisce tutta insieme, e subito dopo il becco ti prende sul dorso della mano e
            ti apre la pelle fino alle nocche. Quando ti tiri indietro lui è di nuovo immobile sul sasso su
            una zampa, con la testa girata verso la capanna. Tu ti fasci la mano da sol{o|a} e stretta, come
            ti hanno insegnato.
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · 4 → 5
  - id: l-altare-del-cucitore
    immagine: bestiario/osric-wren-spettrale
    titolo: L'altare del Cucitore
    sommario: "Al piano di sopra c'è l'altare del Demone Uccello, e dietro l'altare c'è Osric Wren."
    luogo: Roccia di Wren, il piano di sopra
    area: roccia-di-wren
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren >= 4]
    testo: |
      Al piano di sopra fa più freddo che sul fiume, e il fiato ti esce bianco. Il pavimento è coperto di
      trucioli chiari e arricciati, e sono l'unico legno asciutto che hai trovato nella capanna. Contro la
      parete di fondo, sotto la finestra chiusa, c'è l'altare del Demone Uccello. È un corpo d'uomo scolpito
      nel legno nero, con il volto allungato e il cranio coperto di piume dure, intagliate una per una con la
      nervatura al centro. Dalle spalle si aprono due ali storte, metà di piume intagliate e metà di lamine di
      metallo, e nelle vene delle braccia corrono filamenti di rame. Il rame entra nel legno e si stringe
      sopra i polsi, ed è lucido come appena tirato, senza un filo di verde. Davanti all'altare c'è un cuscino
      da inginocchiatoio ricamato a fiori, consumato al centro.

      {origine accolito-del-velo} Il cuscino è consumato come quelli su cui ti inginocchiavi da novizi{o|a}.
      Le ginocchia ti fanno male per solidarietà, anche se qui si pregava qualcun altro.

      In fondo alla stanza il rumore dell'attrezzo smette di colpo. Senti un fruscio di piume e una lama che
      incide il legno, e le lamine delle ali vibrano appena con un suono sottile. Dietro l'altare si forma una
      figura.

      Osric Wren ha la pelle bianca e trasparente, attraversata da filamenti di luce che seguono le stesse vie
      del rame nelle braccia della statua. Ha gli occhi cuciti con un filo scuro a punti piccoli e regolari, e
      due tagli incrociati sul collo. In mano tiene un coltello da intaglio fatto di luce, e gira la testa
      verso di te.

      {armi-da-mischia Media} Tiene il coltello come un intagliatore, con il pollice sul dorso della lama, e
      taglierà di striscio a colpi brevi.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "Il coltello è fatto di luce, ma la mano che lo tiene si muove da intagliatore."
        combattimento: spettro-del-cucitore
        vittoria:
          titolo: La cucitura che cede
          testo: |
            Il coltello di luce ti passa vicino alla faccia e lascia nell'aria un odore di legno appena
            tagliato. Il tuo colpo invece arriva, e Osric Wren si apre come una cucitura che cede, dal petto
            alle spalle, in fili di luce che si spengono uno dopo l'altro. Prima di sparire gira verso di te
            gli occhi cuciti, e dai tagli del collo esce una voce rotta.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            Ti butti giù per le scale e dalla cengia in acqua, mentre alle tue spalle la capanna crolla su se
            stessa. Dall'acqua vedi le scandole del tetto scivolare nel fiume a file intere.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          vai: citta-bassa
        sconfitta:
          titolo: Sotto le travi
          testo: |
            Il coltello di luce ti entra nella spalla senza tagliare la stoffa, e il freddo ti arriva fino ai
            denti. Quando ci porti la mano la stoffa è intera e coperta di brina. Cadi in ginocchio davanti
            all'altare. Osric Wren si china su di te, così vicino che vedi i punti del filo sulle palpebre, e
            dai tagli del collo esce una voce rotta.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            Poi si disfa nell'aria, e la capanna comincia a crollare. Di come arrivi alle scale ricordi poco.
            Torni in Città Bassa di notte zoppicando, e la spalla resta fredda sotto la mano fino alle prime
            case.
          effetti: { pista.sepolcro: 1, tormento: 1.5 }
          vai: citta-bassa
      - testo: "Esorcizzarlo"
        descrizione: "La Liturgia dell'Albero ha parole per i morti che non se ne sono andati."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Le parole dell'Albero
          testo: |
            Dici le parole dell'Esorcismo a voce alta, e la voce ti esce più ferma di quanto ti senti. A ogni
            frase la luce che attraversa Osric Wren si fa più debole, e il coltello gli trema in mano. Le
            lamine delle ali della statua tintinnano piano a ogni parola e poi tacciono. Lui resta dietro
            l'altare e si sfilaccia dai bordi, e prima di sparire gira verso di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            Corri giù per le scale e salti dalla cengia nell'acqua bassa, e alle tue spalle la capanna crolla
            su se stessa.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          vai: citta-bassa
        fallimento:
          titolo: La parola sbagliata
          testo: |
            A metà della formula sbagli una parola, e lo senti subito, come un gradino che manca sotto il
            piede. Osric Wren passa attraverso l'altare e ti viene addosso, e il coltello di luce ti
            attraversa il petto senza toccare la pelle. Mentre cadi in ginocchio lo senti parlare dai tagli
            del collo.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            Poi svanisce, e la capanna comincia a crollare. Scendi le scale a quattro zampe e ti butti in
            acqua. Il freddo che hai nel petto è così forte che l'acqua del fiume ti sembra tiepida.
          effetti: { pista.sepolcro: 1, tormento: 1.5, ferite: 0.5 }
          vai: citta-bassa
      - testo: "Restare fermo e ascoltarlo fino all'alba"
        descrizione: "Lasciarlo parlare, senza alzare le mani. Per arrivare all'alba ci vuole una testa salda."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Fino all'alba
          testo: |
            Ti siedi sul pavimento con la schiena contro il muro e le mani sulle ginocchia, e lo lasci
            parlare. Osric Wren parla per tutta la notte, con la voce che esce dai tagli del collo. Verso metà
            notte la brina ti sale sugli stivali fino alle caviglie, e tu non sposti i piedi. Alla prima luce
            si ferma e gira verso di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            La luce del giorno entra dalle fessure delle imposte e lui ci si scioglie dentro. Dalla riva
            guardi la capanna crollare su se stessa, e rientri in Città Bassa a metà mattina con le gambe
            intorpidite.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Una voce in prestito
          testo: |
            Resisti per qualche ora. Poi la voce di Osric Wren comincia a sembrarti la tua, e ti sorprendi ad
            annuire mentre ti spiega come si piega una piuma di rame. Dopo un po' ti accorgi che anche le tue
            labbra si muovono con le sue, una sillaba indietro. All'alba gira verso di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            Ti ritrovi sulla riva dei giunchi sporc{o|a} di cenere, con le mani che tremano e il ritmo di
            quella voce ancora nelle orecchie.
          effetti: { pista.sepolcro: 1, tormento: 1.5 }
          vai: citta-bassa
      - testo: "Ascoltarlo e rispondergli"
        descrizione: "Finché gli rispondi lui parla e non taglia. Ogni risposta però lascia un segno."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Conversazione da bottega
          testo: |
            Gli chiedi del legno e delle piume, e lui risponde con la voce che esce dai tagli del collo,
            contento di avere un pubblico. Ogni tanto indica con il coltello di luce le venature dell'altare,
            con la precisione di un maestro di bottega. All'alba Osric Wren tace e gira verso di te gli occhi
            cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            La luce del giorno lo scioglie, e la capanna comincia a cedere. Rientri in Città Bassa con quella
            conversazione addosso, e per giorni ti capita di rispondere a domande che non ti ha fatto nessuno,
            quasi sempre sulla colla di pesce.
          effetti: { pista.sepolcro: 1, racconto: 1, tormento: 1.5 }
          vai: citta-bassa
        fallimento:
          titolo: Le domande di Wren
          testo: |
            Dopo un po' è lui a fare le domande. Ti chiede la larghezza delle tue spalle e quanto pesi, e tu
            rispondi prima di poterti fermare. Mentre rispondi lui ti misura il braccio a palmi, con la mano a
            una spanna dalla manica e senza toccarti. All'alba tace e gira verso di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            Quando la luce lo scioglie e la capanna comincia a cedere sei ancora sedut{o|a} sul pavimento.
            Torni in Città Bassa a sera, e per tutto il tragitto ti ripeti le tue misure a mezza voce.
          effetti: { pista.sepolcro: 1, tormento: 2 }
          vai: citta-bassa
      - testo: "Dare fuoco alla capanna e scappare"
        descrizione: "Il pavimento è pieno di trucioli, e la Guardia l'ha già fatto una volta. Ti scotterai."
        esito:
          titolo: Il secondo incendio
          testo: |
            Batti l'acciarino sui trucioli che coprono il pavimento, e il fuoco prende subito e corre basso
            verso l'altare. Osric Wren resta fermo, e la luce delle fiamme gli passa attraverso senza gettare
            la sua ombra sul muro. Mentre ti butti giù per le scale, con il fumo che ti brucia la gola e le
            mani scottate dalla ringhiera, la sua voce ti viene dietro dai tagli del collo.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            Dalla riva guardi la capanna bruciare e poi crollare su se stessa, con le travi che cadono verso
            il centro.
          effetti: { pista.sepolcro: 1, ferite: 1, tormento: 1 }
          vai: citta-bassa
      - testo: "Dire sul suo altare la preghiera per i morti"
        descrizione: "Al Velo la preghiera per i morti che restano te l'hanno insegnata prima delle bende. Detta davanti a questo altare, ogni parola costa il doppio."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: mentale, abilita: [accademiche, resilienza], difficolta: Difficile }
        successo:
          titolo: La preghiera dei novizi
          testo: |
            Ti inginocchi sul cuscino ricamato, con le spalle al Demone Uccello, e dici la preghiera per i
            morti come la dicevate in fila nel dormitorio, senza saltare una sillaba. Il cuscino è umido e
            freddo, e dove è consumato senti le assi sotto le ginocchia. Osric Wren smette di incidere. A ogni
            strofa la luce che lo attraversa si fa più debole, e il coltello gli trema in mano. Prima di
            sfilacciarsi del tutto gira verso di te gli occhi cuciti, e dai tagli del collo esce una voce
            rotta.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            Corri giù per le scale e salti dalla cengia nell'acqua bassa, e alle tue spalle la capanna crolla
            su se stessa.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          pe: { resilienza: 5 }
          vai: citta-bassa
        fallimento:
          titolo: La strofa che manca
          testo: |
            Ti inginocchi sul cuscino e cominci la preghiera, ma alla seconda strofa non ti torna più la
            parola che viene dopo. Anche la lama dietro l'altare smette di incidere, e nella stanza resta solo
            il tuo fiato. Osric Wren passa attraverso l'altare e il coltello di luce ti attraversa il petto
            senza toccare la pelle, lasciandoti dentro un freddo che dura. Mentre cadi lo senti parlare dai
            tagli del collo.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            Poi svanisce, e la capanna comincia a crollare. Torni in Città Bassa a notte fonda, e la parola
            che mancava ti torna in mente sulla strada di casa, quando non serve più.
          effetti: { pista.sepolcro: 1, tormento: 1.5, ferite: 0.5 }
          vai: citta-bassa
      - testo: "Spezzare il Mana che sale dall'altare"
        descrizione: "Il rame nelle braccia della statua porta il Mana fino alle ali, e lui ne prende forza."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [magia], difficolta: Difficile }
        successo:
          titolo: Il filo di rame
          testo: |
            Lasci che Osric Wren ti venga incontro e intanto guardi le braccia della statua, dove i filamenti
            di rame si stringono sopra il polso. Ci metti due dita, e il rame è tiepido, l'unica cosa tiepida
            della stanza. Sotto il metallo senti il Mana che corre veloce verso le ali. Lo spingi indietro con
            tutta la formula che hai, e il filo diventa rosso e poi nero. Il coltello di luce si spegne a un
            palmo dalla tua faccia, e Osric Wren si apre come una cucitura che cede, in fili di luce che si
            spengono uno dopo l'altro. Prima di sparire gira verso di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            Ti butti giù per le scale e dalla cengia in acqua, mentre alle tue spalle la capanna crolla su se
            stessa.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          pe: { magia: 5 }
          vai: citta-bassa
        fallimento:
          titolo: La corrente
          testo: |
            Metti le dita sul rame della statua e cerchi il punto più sottile, ma la corrente è più forte di
            ogni cristallo che hai toccato in aula, e invece di spezzarsi ti passa nel braccio. Ti ritrovi in
            ginocchio davanti all'altare, con il gelo fino ai denti e due righe verdi sui polpastrelli dove
            hai toccato il rame. Osric Wren si china su di te così vicino che vedi i punti del filo sulle
            palpebre.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            Poi si disfa nell'aria, e la capanna comincia a crollare. Di come arrivi alle scale ricordi poco,
            e torni in Città Bassa di notte, zoppicando, con il braccio che formicola fino alla spalla.
          effetti: { pista.sepolcro: 1, tormento: 1.5 }
          vai: citta-bassa
      - testo: "Parlargli dei suoi uccelli come di merce buona"
        descrizione: "Al piano di sotto i passeri hanno ancora il cartellino del prezzo. Un artigiano parla volentieri con chi sa quanto vale il suo lavoro."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, percezione], difficolta: Media }
        successo:
          titolo: Il prezzo giusto
          testo: |
            Gli dici che i suoi passeri li vendeva troppo poco, e che sui Ponti un intaglio così lo
            pagherebbero bene senza discutere. Osric Wren abbassa il coltello e lo tiene lungo la gamba, con
            la lama verso il pavimento. Parla per tutta la notte di legni stagionati e di colla di pesce, e tu
            tratti ogni cosa come merce da banco, soppesandola. All'alba tace e gira verso di te gli occhi
            cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            La luce del giorno lo scioglie, e la capanna comincia a cedere. Per giorni, in città, ti scopri a
            stimare il legno di ogni bancone su cui appoggi i gomiti.
          effetti: { pista.sepolcro: 1, racconto: 1, tormento: 1.5 }
          pe: { persuasione: 5 }
          vai: citta-bassa
        fallimento:
          titolo: Il cliente
          testo: |
            Gli parli dei suoi passeri e del loro prezzo, e lui si fa attento come un artigiano davanti a un
            cliente. Ti chiede la larghezza delle tue spalle e quanto pesi, come si prendono le misure per un
            lavoro su ordinazione, e tu rispondi prima di poterti fermare. Lui ripete ogni numero a voce bassa
            per segnarselo. All'alba tace e gira verso di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            Quando la luce lo scioglie e la capanna comincia a cedere sei ancora sedut{o|a} sul pavimento.
            Torni in Città Bassa a sera, ripetendoti le tue misure a mezza voce come un ordine da consegnare.
          effetti: { pista.sepolcro: 1, tormento: 2 }
          vai: citta-bassa
      - testo: "Tenere duro fino all'alba, come nei recinti"
        descrizione: "A Ghoran hai passato notti lunghe senza muoverti. Qui serve un corpo che regge fino all'alba."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza], difficolta: Difficile }
        successo:
          titolo: Una notte di più
          testo: |
            Ti siedi sul pavimento con la schiena al muro e le mani aperte sulle ginocchia, dove lui le può
            vedere, e lasci che il freddo ti salga nelle ossa senza muoverti. Osric Wren parla per tutta la
            notte di venature e di ali, e tu conti i respiri come facevi nei recinti di Ghoran, per arrivare
            al mattino un numero alla volta. Verso l'alba non senti più le dita dei piedi dentro gli stivali.
            Alla prima luce si ferma e gira verso di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            Quando le travi cominciano a piegarsi tu sei già sulle scale, e rientri in Città Bassa a metà
            mattina con le gambe di legno.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          pe: { resistenza: 5 }
          vai: citta-bassa
        fallimento:
          titolo: Il freddo
          testo: |
            Resisti per qualche ora con la schiena al muro, e intanto il freddo dell'altare ti entra nelle
            ossa più a fondo di quanto conoscessi. Verso la terza ora la voce di Osric Wren comincia a
            sembrarti la tua, e ti sorprendi ad annuire. All'alba gira verso di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.»

            Ti ritrovi sulla riva dei giunchi sporc{o|a} di cenere e con dei trucioli chiari impigliati nelle
            maniche. In Città Bassa arrivi a mezzogiorno senza sapere che strada hai fatto.
          effetti: { pista.sepolcro: 1, tormento: 1.5 }
          vai: citta-bassa
