# Il Sepolcro violato, la spedizione alla Roccia di Wren (pista.sepolcro 4 → 5).
# La strada parte dalla Città Bassa; sulla Roccia sei stanze ripetibili (se ne vedono tre a caso),
# una carta e il cuore al piano di sopra, che riporta in città in ogni ramo.
aree:
  - id: roccia-di-wren
    immagine: ambientazione/roccia-di-wren
    nome: Roccia di Wren
    sommario: "Un isolotto di roccia nera all'estremità nord-est del Torvessa, chiuso nella foschia del fiume. In cima c'è la capanna del Cucitore, che la Guardia ha bruciato cinque anni fa."
    spedizione: { ritorno: citta-bassa, soglia: 4, stanze: 3 }
    testo: |
      A nord-est della città il Torvessa rallenta e si allarga in un'ansa di
      acqua melmosa, del colore di un tè lasciato in infusione troppo a lungo.
      Dall'acqua sale una foschia bassa che non si dirada nemmeno a
      mezzogiorno e che a tratti si alza a spirali fra i giunchi.

      In mezzo all'ansa si alza la Roccia di Wren, una lingua di pietra nera
      che esce dritta dall'acqua, alta quanto tre case e lucida di umido. I
      pescatori la chiamano lo Scoglio e ci girano al largo, e i più vecchi le
      sputano dietro per abitudine.

      In cima c'è la capanna di Osric Wren, due piani di legno gonfio di muffa
      con il tetto di scandole ancora al suo posto. Cinque anni fa, alla fine
      delle Notti Cucite, la Guardia ci è salita seguendo la traccia di sangue
      lasciata dal Cucitore. Ha dato fuoco alla casa e ha fatto crollare le
      stanze scavate nella roccia, e prima di andarsene ha buttato le scale
      nel fiume. In Città Bassa la storia dell'incendio la sanno anche i
      bambini. Eppure la capanna è lassù, con le imposte chiuse e le assi
      senza un segno di fuoco.

      Sulla Roccia non si posa nessun uccello. Te ne accorgi tardi, quando il
      collo ti si è già irrigidito a forza di guardare in alto.

storylet:
  # ------------------------------------------------------------ 4 · la strada (apre la spedizione)
  - id: la-strada-per-la-roccia
    immagine: ambientazione/roccia-di-wren
    titolo: La strada per la Roccia
    sommario: "La capanna del Cucitore sta su uno scoglio nero del Torvessa, a nord-est della città. Ci si arriva a piedi lungo la riva, o in barca fino ai giunchi."
    luogo: Città Bassa, verso il fiume
    area: citta-bassa
    requisiti: [pista.sepolcro == 4]
    testo: |
      Esci dalla Città Bassa all'alba verso nord-est, dove le ultime case di
      pietra grezza lasciano il posto agli orti e ai recinti delle capre.
      Sulla porta dell'ultima casa una donna sbatte un tappeto contro lo
      stipite, e quando le chiedi la strada per il fiume smette di sbatterlo.

      «Per il fiume va bene» dice. «Allo Scoglio invece non ci va nessuno, e
      tu hai la faccia di uno che ci va. Mio figlio aveva sei anni quando
      c'era il Cucitore. Adesso ne ha undici, e prima di dormire guarda ancora
      sotto il letto, e poi ci riguarda.» Ti indica un sentiero fra i rovi e
      torna al tappeto, battendolo più forte di prima.

      Il sentiero costeggia il Torvessa verso nord-est, stretto fra i rovi e
      le pietre che affiorano, e dopo mezz'ora il rumore della città alle tue
      spalle si è sciolto nel ronzio dei moscerini. Alla foce di un fosso,
      sotto un salice, c'è una barca da pesca tirata in secca. Seduto sulla
      prua un vecchio ripara una rete con le dita gonfie, e ti guarda gli
      stivali prima della faccia. *Anche lui ha capito dove stai andando.* Più
      avanti, sopra l'acqua, la foschia comincia a salire.
    opzioni:
      - testo: "Seguire la riva a piedi"
        descrizione: "Il sentiero porta fin davanti alla Roccia, ed è lungo."
        costo: 1
        esito:
          titolo: Lungo il Torvessa
          testo: |
            Cammini per tutta la mattina con il fiume sulla destra. I rovi ti
            tirano i calzoni a ogni passo, e due volte devi tornare indietro
            perché il sentiero finisce in una pozza. Verso mezzogiorno la
            vegetazione si apre all'improvviso, e in mezzo all'acqua melmosa
            vedi la Roccia di Wren che esce dritta dall'acqua, con la capanna
            in cima.

            Ti siedi su un sasso a vuotare uno stivale, e intanto la guardi.
            Le imposte della capanna sono chiuse, e dal camino non esce fumo.
          vai: roccia-di-wren
      - testo: "Pagare il vecchio per un passaggio in barca"
        descrizione: "Tre monete, e arrivi con le gambe riposate. Allo Scoglio però non attracca."
        requisiti: [monete >= 3]
        costo: 1
        esito:
          titolo: A remi
          testo: |
            Il vecchio morde le monete una alla volta per sentire se sono
            buone e poi le fa sparire nella camicia. Rema seduto di traverso,
            con la schiena al fiume, e parla per tutto il tragitto. «Dico io,
            allo Scoglio non ci attracco. Ti lascio ai giunchi e da lì ci
            arrivi coi piedi tuoi. Mio cognato ci ha attraccato l'anno dopo
            l'incendio. Adesso vende castagne in Città Bassa, e da allora,
            dico io, l'acqua non la guarda più.»

            Ti lascia dove i giunchi si fanno fitti, a un tiro di sasso dalla
            Roccia. Le gambe ti ringraziano, e lui spinge la barca indietro
            prima che tu abbia finito di scendere.
          effetti: { monete: -3, ferite: -0.5 }
          vai: roccia-di-wren

  # ------------------------------------------------------------ le stanze (ripetibili, tre a caso)
  - id: roccia-sentiero-nella-foschia
    immagine: ambientazione/roccia-di-wren
    titolo: Il sentiero nella foschia
    sommario: "La foschia del Torvessa si chiude intorno al sentiero, e ai lati prendono forma figure che camminano al tuo passo."
    luogo: Roccia di Wren, lungo la riva
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren < 4]
    testo: |
      La foschia sale dal Torvessa a spirali lente e si richiude alle tue
      spalle, e del sentiero vedi soltanto i tre passi davanti agli stivali.
      Ai lati, fra i rovi, prendono forma figure alte quanto un uomo che
      camminano alla tua andatura. Quando ti fermi si fermano anche loro, un
      attimo dopo di te, e la mano ti è già andata alla cintura.

      Accanto al sentiero, piantato storto nel fango, c'è un palo con una
      tavola. Sopra ci hanno dipinto *PESCA VIETATA* in lettere rosse. Più in
      basso un'altra mano ha aggiunto *ANCHE IL RESTO* con una vernice
      diversa.
    opzioni:
      - testo: "Tenere gli occhi sul sentiero"
        descrizione: "Le figure sono foschia. Il sentiero invece è vero, e ti serve vederlo."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Un passo alla volta
          testo: |
            Abbassi lo sguardo e conti i sassi che affiorano, uno per passo.
            Le figure ti accompagnano per un tratto, poi una folata le stende
            sull'acqua e restano indietro. Quando rialzi la testa la Roccia di
            Wren è più vicina di quanto pensassi, nera contro il bianco della
            foschia, e hai la mascella indolenzita a forza di stringerla. Ti
            massaggi la faccia con due dita prima di andare avanti.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Dietro la figura
          testo: |
            Una delle figure si stacca dalle altre e scende verso il fiume, e
            tu le vai dietro senza averlo deciso. Ti fermi quando l'acqua ti
            arriva alle ginocchia e la figura non c'è più. Torni sul sentiero
            bagnato e tremante, e non sai più da che parte eri arrivato. Ti ci
            vuole un pezzo per ritrovare il palo con la tavola, e ritrovarlo
            ti fa quasi piacere.
          effetti: { tormento: 0.5 }
      - testo: "Tagliare fra i rovi, lontano dall'acqua"
        descrizione: "Lontano dalla riva la foschia è più rada. I rovi però sono fitti."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Graffi
          testo: |
            Ti apri la strada con gli avambracci, e i rovi ti restituiscono il
            favore con gli interessi. Lontano dall'acqua la foschia si dirada
            e le figure non ti seguono. Dopo un'ora sbuchi su una lingua di
            ghiaia davanti alla Roccia di Wren, con le maniche a brandelli e
            una spina nel pollice che toglierai stasera. Alle tue spalle il
            roveto si richiude con un fruscio.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Nel roveto
          testo: |
            Il roveto è più fitto di quanto sembrava, e a metà ti ci ritrovi
            incastrato con una spina piantata nel collo. Ne esci all'indietro,
            lasciando ai rami un pezzo di camicia e un po' di sangue, nello
            stesso punto da cui eri entrato. Ti tamponi il collo con la
            manica, e la manica torna indietro rossa. Da qui il roveto sembra
            più fitto di prima.
          effetti: { ferite: 0.5 }
      - testo: "Seguire il fiume, anche se è più lungo"
        descrizione: "Allunghi di molto la strada, ma almeno sai dov'è l'acqua."
        costo: 2
        esito:
          titolo: Il giro del fiume
          testo: |
            Lasci il sentiero e segui la riva, dove la foschia è più bassa e i
            piedi affondano nel fango fino alla caviglia. Le figure fra i rovi ti
            accompagnano per un tratto e poi restano indietro, ferme dove il terreno
            comincia a salire. Arrivi dall'altra parte con gli stivali pieni d'acqua
            e i polpacci che bruciano, quando la luce sul fiume è già cambiata due
            volte.
          effetti: { profondita.roccia-di-wren: 1, ferite: 0.5 }

  - id: roccia-riva-dei-giunchi
    immagine: ambientazione/roccia-di-wren
    titolo: La riva dei giunchi
    sommario: "Fra la riva e la Roccia ci sono i giunchi e l'acqua ferma, e sopra una passerella che nessuno ripara da anni."
    luogo: Roccia di Wren, la riva dei giunchi
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren < 4]
    testo: |
      Fra la riva e la Roccia di Wren c'è una distesa di giunchi più alti di
      te, piantati in un'acqua nera che non si muove. Ci passa sopra una
      passerella di assi sostenute da pali, costruita da qualche pescatore
      prima delle Notti Cucite e mai più riparata. Metà delle assi è marcia, e
      in tre punti mancano del tutto.

      All'imbocco della passerella c'è uno stivale da pescatore piantato nel
      fango fino alla caviglia. È pieno d'acqua, e dentro ci vive una rana che
      ti guarda senza nessuna curiosità. I giunchi frusciano anche quando il
      vento si ferma.
    opzioni:
      - testo: "Passare sulla passerella"
        descrizione: "Un'asse alla volta, saltando dove mancano."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Le assi buone
          testo: |
            Provi ogni asse con la punta dello stivale prima di caricarci il
            peso, e dove manca salti. Una cede proprio mentre la lasci, e la
            senti cadere nell'acqua con un tonfo morbido. Arrivi alla roccia
            con le mani che tremano e le ginocchia ancora piegate, pronte a un
            salto che non serve più. La rana, dallo stivale, non ha cambiato
            espressione.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Nel fango
          testo: |
            La terza asse cede sotto il tallone e ci vai dentro fino alla
            vita. L'acqua è fredda e il fondo è un fango che ti succhia gli
            stivali. Ti tiri fuori aggrappato a un palo, con una scheggia nel
            palmo, e torni a riva a svuotarti le scarpe accanto alla rana. Lei
            ti guarda come prima, e il fango ti si secca sui calzoni.
          effetti: { ferite: 0.5 }
      - testo: "Guadare fra i giunchi, tastando il fondo"
        descrizione: "Dove i giunchi hanno le radici più grosse, il fondo regge."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il fondo che regge
          testo: |
            Segui le radici più spesse, quelle che i giunchi allungano dove il
            fondo è di sasso, e l'acqua non ti sale oltre il ginocchio. Una
            biscia d'acqua ti passa accanto e si allontana, e almeno lei ha
            fretta di andarsene da qui. Esci sulla roccia nera bagnato fino
            alle cosce, ma ancora con entrambi gli stivali. Ti strizzi i
            calzoni sulla pietra, e l'acqua che cola è nera.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Il guado
          testo: |
            A metà del guado una cosa morbida ti scivola lungo il polpaccio e
            si stringe un momento intorno alla caviglia. Quando guardi giù
            vedi soltanto acqua nera. Torni a riva senza ricordarti di aver
            deciso di farlo, e ci metti un pezzo a far smettere di tremare le
            mani. Sulla caviglia, quando ti togli lo stivale, c'è un segno
            rosso largo due dita.
          effetti: { tormento: 0.5 }
      - testo: "Fare il giro largo fino alla secca"
        descrizione: "Molto più a valle i giunchi diradano e il fondo diventa sabbia."
        costo: 2
        esito:
          titolo: La secca
          testo: |
            Scendi lungo la riva finché i giunchi non diradano e sotto i piedi
            trovi la sabbia. L'acqua ti arriva alla vita ed è più fredda di quanto
            avessi messo in conto, tanto che a metà guado smetti di sentire le dita
            dei piedi. Risali sull'isolotto dal lato opposto alla passerella, con i
            denti che battono e la Roccia che adesso ti sta proprio sopra.
          effetti: { profondita.roccia-di-wren: 1, ferite: 0.5 }

  - id: roccia-la-porta
    immagine: ambientazione/roccia-di-wren
    titolo: La porta della capanna
    sommario: "In cima a una scala appoggiata alla roccia c'è la porta della capanna, con il chiavistello a forma di testa d'uccello."
    luogo: Roccia di Wren, in cima alla scala
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren < 4]
    testo: |
      Contro la parete della Roccia è appoggiato un troncone di scala di
      legno, sistemato alla buona su due sassi, che arriva fino alla cengia
      sotto la capanna. Ai piedi della scala, inchiodata alla pietra, c'è una
      targa di bronzo verde di ossido. Dice che il luogo è chiuso per ordine
      dello *sciriffo* di Qir-Azel, nell'anno 145, e l'incisore ha sbagliato
      proprio la parola più importante.

      La porta della capanna è di legno scuro gonfio d'umido, senza un solo
      segno di bruciatura. Il chiavistello è una testa d'uccello intagliata
      con il becco rivolto in giù. Quando ci appoggi la mano il legno è
      tiepido, più tiepido dell'aria del fiume.
    opzioni:
      - testo: "Forzare la porta con la spalla"
        descrizione: "Il legno è gonfio e la porta è vecchia."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La spallata
          testo: |
            Alla terza spallata la porta si apre di colpo, e per poco non
            finisci lungo disteso sul pavimento. Ti rimetti in piedi con la
            spalla che pulsa e la polvere che ti scende nel colletto. Dietro
            di te la porta torna ad accostarsi da sola, piano, finché il
            chiavistello non fa clic. La spalla ti farà male fino a domani
            sera.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Tre colpi
          testo: |
            Colpisci la porta con la spalla tre volte, e la porta non si
            muove. Dopo il terzo colpo, dall'interno, arrivano tre colpi di
            risposta, con lo stesso intervallo dei tuoi. Ti ritrovi in fondo
            alla scala senza ricordarti di averla scesa, e la spalla comincia
            a farti male solo lì. Sopra di te la porta della capanna è chiusa
            come prima, e non si sente più niente.
          effetti: { tormento: 0.5 }
      - testo: "Studiare il chiavistello a testa d'uccello"
        descrizione: "Un intagliatore di uccelli faceva anche le serrature a modo suo."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il becco in su
          testo: |
            La testa d'uccello gira su un perno nascosto nel collo. Quando il
            becco punta verso l'alto, dentro la porta scatta un saliscendi di
            legno e la porta si apre senza un cigolio. Il meccanismo è fatto
            con una cura che nei Quartieri Alti non trovi nemmeno sulle porte
            dei Malgrani. Ci passi sopra il pollice, e il legno è liscio come
            un manico usato per anni.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Il morso
          testo: |
            Giri la testa d'uccello a destra e a sinistra, e alla fine il
            becco si chiude sul tuo indice con uno scatto secco. Ti lascia
            andare solo quando strappi via la mano, e un po' di pelle resta
            fra le sue mandibole di legno. Ti succhi il dito in fondo alla
            scala, e la porta resta chiusa. Il dito sanguina poco ma pulsa.
          effetti: { ferite: 0.5 }
      - testo: "Entrare dalla finestra sul retro"
        descrizione: "È stretta, e il davanzale è irto di schegge."
        costo: 2
        esito:
          titolo: Le schegge
          testo: |
            Giri attorno alla capanna tenendoti alla parete di roccia, fino a una
            finestra senza vetro sul retro. Ti ci infili di traverso, una spalla
            alla volta, e il davanzale ti lascia nei palmi una dozzina di schegge
            sottili. Mentre te le togli con i denti ti accorgi che la porta è socchiusa,
            con il chiavistello a testa d'uccello già sollevato.
          effetti: { profondita.roccia-di-wren: 1, ferite: 0.5 }

  - id: roccia-gli-uccelli-intagliati
    immagine: ambientazione/roccia-di-wren
    titolo: Gli uccelli intagliati
    sommario: "Il piano terra della capanna è coperto da centinaia di uccelli di legno. Alcuni hanno tre occhi oppure il becco di metallo."
    luogo: Roccia di Wren, il piano terra della capanna
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren < 4]
    testo: |
      Il piano terra è più grande di quanto la capanna sembri da fuori, e lo
      sguardo continua a cercare la parete di fondo un po' più in qua di dove
      sta. C'è odore di muffa e di resina, e sotto un odore più dolce, di
      legno appena scolpito. Le pareti sono coperte di intagli, centinaia,
      tutti uccelli. Ci sono corvi e gufi scolpiti penna per penna, e fra loro
      ce ne sono di storti, che hanno tre occhi oppure il becco di metallo. I
      tavoli sono rovesciati, e sul pavimento sono sparsi scalpelli
      arrugginiti.

      Su uno scaffale vicino alla porta c'è una fila di passeri tutti uguali,
      con il cartellino del prezzo legato a una zampa. *Due quattrini*, in una
      grafia ordinata.
    opzioni:
      - testo: "Passare fra i tavoli senza toccare niente"
        descrizione: "Gli scalpelli sono dappertutto, e sono arrugginiti."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Fra gli scalpelli
          testo: |
            Scavalchi un tavolo e metti i piedi nei vuoti fra gli scalpelli,
            uno alla volta, senza far tintinnare il ferro. Gli uccelli restano
            dove sono. Ti rimane però la sensazione precisa che quelli con tre
            occhi li abbiano fatti con tre occhi per un motivo, e arrivi in
            fondo alla stanza con la nuca fredda. Lì ti fermi un momento e ti
            asciughi le mani sui calzoni.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Ruggine
          testo: |
            Un tavolo rovesciato si sposta sotto il tuo peso e uno scalpello
            ti si pianta di traverso nel polpaccio. La ruggine ti lascia sulla
            pelle una macchia arancione. Te la strofini con la manica, e la
            macchia si allarga invece di andar via. Torni verso la porta
            zoppicando, e sullo scaffale la fila di passeri da due quattrini
            adesso è girata verso di te.
          effetti: { ferite: 0.5 }
      - testo: "Esaminare gli intagli"
        descrizione: "Un intagliatore non ne scolpisce tanti senza tenerne il conto."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le date
          testo: |
            Sotto ogni intaglio c'è una data incisa con la punta del coltello.
            I corvi e i gufi sono vecchi di vent'anni. Gli uccelli con tre
            occhi e con il becco di metallo hanno date più recenti, tutte
            dell'anno 145, e sono girati verso le scale. Il 145 è l'anno delle
            Notti Cucite, e lo stomaco te lo ricorda prima della testa. Te lo
            segni a mente per raccontarlo in città.
          effetti: { profondita.roccia-di-wren: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Gli occhi
          testo: |
            Cominci a contare gli occhi degli uccelli storti e non riesci a
            smettere. Quando arrivi a trecento ti accorgi che stai muovendo le
            labbra, e che fuori la luce è cambiata. Esci all'aria aperta per
            respirare, e ci resti più a lungo di quanto vorresti. Il numero ti
            resta in testa per tutto il giorno, e non è un numero tondo.
          effetti: { tormento: 0.5 }
      - testo: "Attraversare la stanza a occhi bassi"
        descrizione: "Non guardarli. Contare i passi e basta."
        costo: 2
        esito:
          titolo: A occhi bassi
          testo: |
            Tieni lo sguardo sulle assi del pavimento e conti i passi a mezza voce,
            come da bambino per non pensare al buio. Arrivato a ventitré ti accorgi
            che da un pezzo conti anche il ticchettio che viene dalle pareti, e che
            il ticchettio va un poco più svelto di te. Raggiungi il fondo della
            stanza con le tempie che pulsano e la gola secca.
          effetti: { profondita.roccia-di-wren: 1, tormento: 0.5 }

  - id: roccia-il-libro-di-schizzi
    immagine: ambientazione/roccia-di-wren
    titolo: Il libro di schizzi
    sommario: "Su un tavolo rimasto in piedi c'è un libro di schizzi aperto, con studi di ali che pagina dopo pagina diventano macchine."
    luogo: Roccia di Wren, il piano terra della capanna
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren < 4]
    testo: |
      In mezzo ai tavoli rovesciati ce n'è uno solo in piedi, sotto la
      finestra, con sopra un libro di schizzi aperto e una matita consumata
      fino alla lunghezza di un pollice. Le pagine sono piene di studi di ali
      e di ossa, disegnati con una mano ferma. Più avanti le ali diventano
      macchine, con le articolazioni di metallo e i filamenti di rame al posto
      dei tendini, e accanto a ogni disegno ci sono misure in dita e in
      pollici.

      Nel margine di una pagina, fra due ali, c'è una lista della spesa. Colla
      di pesce in due misure, e sale sottolineato due volte. Lo stomaco ti si
      chiude più per la lista che per le ali.
    opzioni:
      - testo: "Leggere gli appunti"
        descrizione: "La grafia è minuta e i calcoli sono lunghi."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: Le ali di rame
          testo: |
            Gli appunti sono calcoli di pesi e di leve. Secondo i numeri di
            Wren nessuna di queste ali avrebbe mai retto un uomo, e lui lo
            sapeva, perché accanto all'ultimo calcolo ha scritto «non serve
            che volino». Strappi le pagine dei calcoli e le pieghi sotto la
            camicia. La carta è ruvida contro la pelle, e ogni tanto la senti
            frusciare. In Biblioteca sapranno leggerle meglio di te.
          effetti: { profondita.roccia-di-wren: 1, informazioni.segreto: 0.5 }
        fallimento:
          titolo: La matita
          testo: |
            Leggi una pagina e poi un'altra, e i calcoli cominciano ad avere
            senso, cosa che non ti piace affatto. Poi ti accorgi di avere in
            mano la matita di Wren e di aver aggiunto una piuma al margine di
            un disegno. La piuma è venuta bene, e questo ti piace ancora meno.
            La rimetti giù e ti strofini le dita sui calzoni finché non
            bruciano.
          effetti: { tormento: 0.5 }
      - testo: "Guardare soltanto i disegni"
        descrizione: "I disegni si capiscono anche senza leggere, e si dimenticano prima."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Facile }
        successo:
          titolo: Ali chiuse
          testo: |
            Sfogli in fretta guardando i disegni, e le parole le salti. Le ali
            di piume diventano ali di metallo pagina dopo pagina, e l'ultima
            tavola è un'ala sola e finita, ombreggiata come una cosa vera.
            Chiudi il libro prima di chiederti a che cosa servisse, e ci
            appoggi sopra la matita. Ti accorgi che stavi trattenendo il fiato
            solo quando lo lasci andare.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: L'ultima tavola
          testo: |
            L'ultima tavola è un'ala finita, disegnata così bene che per un
            momento ti sembra di sentirla frusciare. Chiudi il libro di colpo
            e resti con le mani sulla copertina ad aspettare che il fruscio
            smetta. Smette dopo un po', quando hai già perso il conto del
            tempo. Fuori dalla finestra la foschia del fiume si è alzata fino
            ai giunchi più alti.
          effetti: { tormento: 0.5 }
      - testo: "Chiudere il libro e portarlo via"
        descrizione: "Lo leggerai dopo, alla luce del giorno, se ne avrai ancora voglia."
        costo: 2
        esito:
          titolo: Il libro sotto la giacca
          testo: |
            Chiudi il libro e te lo infili sotto la giacca, contro le costole. Pesa
            più di quanto dovrebbe un quaderno di schizzi, e per tutto il resto
            della salita lo senti tiepido sul fianco. Quando lo riapri, più tardi,
            le pagine delle ali si sono incollate fra loro per l'umido e non c'è
            verso di separarle.
          effetti: { profondita.roccia-di-wren: 1, tormento: 0.5 }

  - id: roccia-le-scale-marce
    immagine: ambientazione/roccia-di-wren
    titolo: Le scale marce
    sommario: "Dal piano di sopra scende un'aria fredda, e con l'aria un rumore leggero e regolare, come un attrezzo che batte sul legno."
    luogo: Roccia di Wren, ai piedi delle scale
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren < 4]
    testo: |
      In fondo alla stanza una scala di legno ripida e stretta sale al piano
      di sopra, con i gradini neri di umido. Ai piedi della scala c'è un paio
      di pantofole di feltro allineate con cura e rivolte con la punta verso
      il primo gradino. Dall'alto scende un filo d'aria più fredda di quella
      del fiume, e con l'aria un rumore leggero, *toc… toc… toc*, come di un
      attrezzo che batte sul legno.

      Il rumore ha il ritmo regolare di una bottega. Ti accorgi di aver smesso
      di respirare per sentirlo meglio.
    opzioni:
      - testo: "Ascoltare il rumore prima di salire"
        descrizione: "A ogni colpo la scala vibra. Le orecchie possono dirti dove mettere i piedi."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il ritmo
          testo: |
            Resti immobile ai piedi della scala e ascolti. Il rumore viene dal
            fondo del piano di sopra, sempre dallo stesso punto, e a ogni
            colpo la scala vibra appena. I gradini buoni sono quelli che
            vibrano meno, e li conti uno per uno finché non li sai a memoria.
            Adesso sai dove mettere i piedi. Sopra di te il rumore continua,
            regolare.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Il silenzio
          testo: |
            Trattieni il fiato per sentire meglio, e il rumore smette nello
            stesso momento. Resti ad aspettare che riprenda, con il cuore che
            ti batte nelle orecchie, ma per un bel pezzo non riprende. Il
            sudore ti si è raffreddato sulla nuca, e ci passi sopra una mano.
            Torni fino alla porta camminando all'indietro, e solo sulla soglia
            lo senti ricominciare.
          effetti: { tormento: 0.5 }
      - testo: "Salire tenendoti al muro"
        descrizione: "Se il peso lo regge il muro, ai gradini resta poco da reggere."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Contro il muro
          testo: |
            Sali di lato, con la schiena contro la parete e i palmi aperti sul
            legno, e lasci ai gradini solo la punta dei piedi. Uno scricchiola
            quando sei già sul successivo. A metà rampa vedi in cima una tenda
            di tela grezza, e il rumore viene da dietro la tenda. Torni giù
            piano, adesso che sai quali gradini reggono. Hai le mani sporche
            di muffa fino ai polsi.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Il quarto gradino
          testo: |
            Il quarto gradino si sbriciola sotto il tuo peso e la gamba ci
            passa attraverso fino al ginocchio. Il legno marcio ti apre lo
            stinco. Ti tiri fuori piano mordendoti il labbro, mentre sopra di
            te il rumore continua senza perdere un colpo. Ti fasci la gamba
            con un pezzo di camicia, e il sangue passa la stoffa in fretta lo
            stesso.
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ la carta della spedizione
      - testo: "Salire con le pantofole di feltro"
        descrizione: "Sono più o meno della tua misura, e sul legno il feltro non si sente."
        costo: 2
        esito:
          titolo: Il feltro
          testo: |
            Ti togli gli stivali e infili le pantofole, che ti stanno quasi bene.
            Il feltro è morbido e un po' umido, e sui primi due gradini non fa
            nessun rumore. Al terzo la scala geme sotto il tuo peso, e il toc toc di
            sopra si interrompe per il tempo di un respiro prima di riprendere, un
            poco più lento. Sali gli ultimi gradini con le mani contro il muro.
          effetti: { profondita.roccia-di-wren: 1, tormento: 0.5 }

  - id: roccia-l-airone
    immagine: ambientazione/roccia-di-wren
    titolo: L'airone
    sommario: "Ai piedi della Roccia c'è un airone fermo su un sasso. Non vola via quando ti avvicini."
    luogo: Roccia di Wren, nelle acque basse
    area: roccia-di-wren
    tipo: carta
    requisiti: [pista.sepolcro == 4]
    testo: |
      Su un sasso piatto, nell'acqua bassa ai piedi della Roccia, c'è un
      airone cenerino fermo su una zampa. È l'unico uccello che hai visto da
      quando la foschia si è chiusa intorno a te. Quando ti avvicini non vola
      via. Gira la testa lentamente e ti segue con un occhio giallo.

      Ha un'ala aperta a metà, che pende di lato. È steccata con due assicelle
      di legno intagliato fatte su misura, legate con un filo di rame sottile
      girato molte volte intorno alle penne. Il rame è diventato verde, e
      sotto il filo le penne sono spezzate. *Quelle assicelle sono fatte con
      più cura di molte culle.* L'airone apre il becco e lo richiude senza
      fare nessun verso.
    opzioni:
      - testo: "Liberarlo dal filo di rame"
        descrizione: "Il filo stringe da anni, e l'airone non ti conosce."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: Un volo basso
          testo: |
            Gli parli a voce bassa mentre ti avvicini, di cose senza
            importanza, e lui ti lascia arrivare. Il filo è verde e si
            sbriciola fra le dita, e le assicelle cadono in acqua. L'airone
            resta fermo ancora un momento, poi apre le ali e si alza in un
            volo basso e storto sopra il fiume, lontano dalla Roccia. Lo segui
            con gli occhi finché sparisce, e ti accorgi che respiri meglio.
          effetti: { tormento: -0.5 }
        fallimento:
          titolo: Il becco
          testo: |
            L'airone ti lascia avvicinare fino a un braccio di distanza, poi
            scatta. Il becco ti prende sul dorso della mano e ti apre la pelle
            fino alle nocche. Quando ti tiri indietro lui è di nuovo immobile
            sul sasso, su una zampa, con la testa girata verso la capanna. Ti
            avvolgi la mano nel fazzoletto, e lui non ti degna più di
            un'occhiata.
          effetti: { ferite: 0.5 }
      - testo: "Guardare dove guarda lui"
        descrizione: "L'airone tiene la testa girata verso la capanna."
        esito:
          titolo: La finestra di sopra
          testo: |
            Ti metti accanto al sasso e segui con lo sguardo il becco
            dell'airone. Punta verso una finestra del piano di sopra, e dopo
            un po' dietro le imposte passa una luce bianca e fredda, da un
            lato all'altro della stanza. Si muove all'altezza di un uomo in
            piedi, e ogni tanto si ferma per il tempo di un colpo di
            scalpello. Alla Pignatta, quando lo racconterai, ti offriranno da
            bere per sentirlo due volte.
          effetti: { informazioni.voce: 1 }

  # ------------------------------------------------------------ il cuore · 4 → 5
  - id: l-altare-del-cucitore
    immagine: bestiario/osric-wren-spettrale
    titolo: L'altare del Cucitore
    sommario: "Al piano di sopra c'è l'altare del Demone Uccello, e dietro l'altare c'è Osric Wren."
    luogo: Roccia di Wren, il piano di sopra
    area: roccia-di-wren
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren >= 4]
    testo: |
      Al piano di sopra l'aria è più fredda di quella del fiume, e il fiato ti
      esce bianco. La stanza occupa tutto il piano. Contro la parete di fondo,
      sotto la finestra con le imposte chiuse, c'è l'altare del Demone
      Uccello, un corpo d'uomo scolpito nel legno nero con il volto allungato
      e il cranio coperto di piume dure e taglienti. Il legno è bruciato
      dentro, e dalle crepe si vede il carbone. Dalle spalle si aprono due ali
      storte, per metà di piume intagliate e per metà di lamine di metallo, e
      nelle vene scolpite delle braccia corrono filamenti di rame
      sottilissimi. Davanti all'altare c'è un cuscino da inginocchiatoio
      ricamato a fiori, consumato al centro.

      In fondo alla stanza un rumore leggero di attrezzo sul legno smette di
      colpo. Senti un fruscio di piume sul pavimento e il suono di una lama
      che incide il legno, e dietro l'altare si forma una figura. Prima
      compare un profilo, poi metà del corpo di un uomo sospeso a mezz'aria.

      Osric Wren ha la pelle bianca e trasparente, attraversata da filamenti
      di luce. Gli occhi sono cuciti con un filo scuro a punti regolari, e sul
      collo ha due tagli incrociati. Porta ancora il grembiule da
      intagliatore, ridotto a strisce. *Ha ancora la tasca per la matita.* In
      mano tiene un coltello da intaglio fatto di luce, con la lama sottile
      come un raggio di luna, e gira la testa verso di te.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "Il coltello è fatto di luce, ma la mano che lo tiene si muove da intagliatore."
        combattimento: spettro-del-cucitore
        vittoria:
          titolo: La cucitura che cede
          testo: |
            Il coltello di luce ti passa vicino alla faccia e lascia nell'aria
            un odore di legno appena tagliato. Il tuo colpo invece arriva, e
            Osric Wren si apre come una cucitura che cede, dal petto alle
            spalle, in fili di luce che si spengono uno dopo l'altro. Prima di
            sparire gira verso di te gli occhi cuciti, e dai tagli del collo
            esce una voce rotta.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Le travi annerite si piegano verso il centro della stanza e il
            pavimento si spacca con un colpo secco. Ti butti giù per le scale
            e dalla cengia in acqua, mentre alle tue spalle la capanna crolla
            su se stessa. Rientri in Città Bassa al tramonto, bagnato fino al
            collo, con quelle parole che ti girano in testa.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          vai: citta-bassa
        sconfitta:
          titolo: Sotto le travi
          testo: |
            Il coltello di luce ti entra nella spalla senza tagliare la
            stoffa, e il freddo ti arriva fino ai denti. Cadi in ginocchio
            davanti all'altare. Osric Wren si china su di te, così vicino che
            vedi i punti del filo sulle palpebre, e dai tagli del collo esce
            una voce rotta.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Poi si disfa nell'aria, e la capanna comincia a crollare. Di come
            arrivi alle scale ricordi poco. Ricordi l'acqua nera del Torvessa
            e le mani che cercano i giunchi. Torni in Città Bassa di notte
            zoppicando. Dietro di te, sulla Roccia, non resta più niente in
            piedi.
          effetti: { pista.sepolcro: 1, tormento: 1 }
          vai: citta-bassa
      - testo: "Esorcizzarlo"
        descrizione: "La Liturgia dell'Albero ha parole per i morti che non se ne sono andati."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le parole dell'Albero
          testo: |
            Dici le parole dell'Esorcismo a voce alta, e la voce ti esce più
            ferma di quanto ti senti. A ogni frase la luce che attraversa
            Osric Wren si fa più debole, e il coltello gli trema in mano.
            Resta dietro l'altare e si sfilaccia dai bordi, e prima di sparire
            gira verso di te gli occhi cuciti. Dai tagli del collo esce una
            voce rotta.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Quando l'ultima parola si spegne, le travi annerite si piegano
            verso il centro della stanza. Corri giù per le scale e salti dalla
            cengia nell'acqua bassa, e alle tue spalle la capanna crolla su se
            stessa. Torni in Città Bassa al tramonto, con la gola secca e
            quelle parole in testa.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          vai: citta-bassa
        fallimento:
          titolo: La parola sbagliata
          testo: |
            A metà della formula sbagli una parola, e lo senti subito, come un
            gradino che manca sotto il piede. Osric Wren passa attraverso
            l'altare e ti viene addosso, e il coltello di luce ti attraversa
            il petto senza toccare la pelle. Ti lascia dentro un freddo che
            dura. Mentre cadi in ginocchio lo senti parlare dai tagli del
            collo.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Poi svanisce, e la capanna comincia a crollare. Scendi le scale a
            quattro zampe e ti butti in acqua. Torni in Città Bassa a notte
            fonda, e per tutta la strada ripeti fra te la formula, quella
            giusta.
          effetti: { pista.sepolcro: 1, tormento: 1.5, ferite: 0.5 }
          vai: citta-bassa
      - testo: "Restare fermo e ascoltarlo fino all'alba"
        descrizione: "Lasciarlo parlare, senza alzare le mani. Per arrivare all'alba ci vuole una testa salda."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Fino all'alba
          testo: |
            Ti siedi sul pavimento con la schiena contro il muro e le mani
            sulle ginocchia, e lo lasci parlare. Osric Wren parla per tutta la
            notte, con la voce che esce dai tagli del collo. Parla di venature
            e di come si sceglie il legno per un'ala, e tu lo ascolti senza
            rispondere. Alla prima luce si ferma e gira verso di te gli occhi
            cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            La luce del giorno entra dalle fessure delle imposte e lui ci si
            scioglie dentro. Quando le travi cominciano a piegarsi verso il
            centro della stanza tu sei già sulle scale. Dalla riva guardi la
            capanna crollare su se stessa, e rientri in Città Bassa a metà
            mattina con le gambe intorpidite.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Una voce in prestito
          testo: |
            Resisti per qualche ora. Poi la voce di Osric Wren comincia a
            sembrarti la tua, e ti sorprendi ad annuire mentre ti spiega come
            si piega una piuma di rame. All'alba gira verso di te gli occhi
            cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Di come svanisce e di come crolla la capanna ricordi soltanto dei
            pezzi, in disordine. Ti ritrovi sulla riva dei giunchi sporco di
            cenere, con le mani che tremano e il ritmo di quella voce ancora
            nelle orecchie. In Città Bassa arrivi a mezzogiorno senza sapere
            che strada hai fatto.
          effetti: { pista.sepolcro: 1, tormento: 1.5 }
          vai: citta-bassa
      - testo: "Ascoltarlo e rispondergli"
        descrizione: "Finché gli rispondi lui parla e non taglia. Ogni risposta però lascia un segno."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Conversazione da bottega
          testo: |
            Gli chiedi del legno e delle piume, e lui risponde con la voce che
            esce dai tagli del collo, contento di avere un pubblico. Parlate
            delle venature del noce e della colla di pesce fino a tardi, e a
            ogni risposta ti accorgi di parlare un po' più come lui. All'alba
            Osric Wren tace e gira verso di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            La luce del giorno lo scioglie, e la capanna comincia a cedere.
            Scendi senza correre e dalla riva la guardi crollare su se stessa.
            Rientri in Città Bassa con quella conversazione addosso, e per
            giorni ti capita di rispondere a domande che non ti ha fatto
            nessuno.
          effetti: { pista.sepolcro: 1, racconto: 1, tormento: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Le domande di Wren
          testo: |
            Dopo un po' è lui a fare le domande. Ti chiede la larghezza delle
            tue spalle e quanto pesi, e tu rispondi prima di poterti fermare.
            All'alba tace e gira verso di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Quando la luce lo scioglie e la capanna comincia a cedere sei
            ancora seduto sul pavimento. Esci da una parete che si è aperta
            nel crollo e cadi fra i giunchi. Torni in Città Bassa a sera, e
            per tutto il tragitto ti ripeti le tue misure a mezza voce.
          effetti: { pista.sepolcro: 1, tormento: 2 }
          vai: citta-bassa
      - testo: "Dare fuoco alla capanna e scappare"
        descrizione: "Il pavimento è pieno di trucioli, e la Guardia l'ha già fatto una volta. Ti scotterai."
        esito:
          titolo: Il secondo incendio
          testo: |
            Batti l'acciarino sui trucioli che coprono il pavimento, e il
            fuoco prende subito e corre basso verso l'altare. Osric Wren resta
            fermo. Mentre ti butti giù per le scale, con il fumo che ti brucia
            la gola e le mani scottate dalla ringhiera, la sua voce ti viene
            dietro dai tagli del collo.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Dalla riva guardi la capanna bruciare e poi crollare su se stessa,
            con le travi che cadono verso il centro. Il fumo sale dritto, e
            dai giunchi non si alza nessun uccello. Rientri in Città Bassa a
            sera con le mani fasciate in una striscia di camicia, e l'odore
            del fumo ti resta nei capelli per giorni.
          effetti: { pista.sepolcro: 1, ferite: 1, tormento: 0.5 }
