# Il Sepolcro violato, la spedizione alla Roccia di Wren (pista.sepolcro 4 → 5).
# La strada parte dalla Città Bassa. Sulla Roccia le stanze vanno in ordine, secondo la profondità:
# 0 si arriva alla Roccia (dalla foschia o dai giunchi), 1 la porta della capanna, 2 il piano terra
# (gli uccelli o il libro), 3 le scale. Poi il cuore al piano di sopra, che riporta in città in ogni ramo.
# Una stanza superata non ricompare nella stessa visita (src/motore/spedizioni.ts).
quality:
  - { id: roccia.barca, nome: Sei arrivato alla Roccia in barca, categoria: stato, nascosta: true, descrizione: "1 se il vecchio ti ha lasciato ai giunchi, e la strada nella foschia non serve più." }

aree:
  - id: roccia-di-wren
    immagine: ambientazione/roccia-di-wren
    nome: Roccia di Wren
    sommario: "Un isolotto di roccia nera all'estremità nord-est del Torvessa, chiuso nella foschia del fiume. In cima c'è la capanna del Cucitore, che la Guardia ha bruciato cinque anni fa."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      A nord-est della città il Torvessa rallenta e si allarga in un'ansa di
      acqua melmosa, del colore di un tè lasciato in infusione troppo a lungo.
      Dall'acqua sale una foschia bassa che non si dirada nemmeno a
      mezzogiorno e che a tratti si alza a spirali fra i giunchi.

      In mezzo all'ansa si alza la Roccia di Wren, una lingua di pietra nera
      che esce dritta dall'acqua, alta quanto tre case e lucida di umido. I
      pescatori la chiamano lo Scoglio e ci girano al largo, e i più vecchi le
      sputano dietro per abitudine.

      In cima c'è la capanna di Osric Wren, due piani di legno gonfio di muffa
      con il tetto di scandole ancora al suo posto. Cinque anni fa, alla fine
      delle Notti Cucite, la Guardia ci è salita seguendo la traccia di sangue
      lasciata dal Cucitore. Ha dato fuoco alla casa e ha fatto crollare le
      stanze scavate nella roccia, e prima di andarsene ha buttato le scale
      nel fiume. In Città Bassa la storia dell'incendio la sanno anche i
      bambini. Eppure la capanna è lassù, con le imposte chiuse e le assi
      senza un segno di fuoco.

      Sulla Roccia non si posa nessun uccello. Te ne accorgi tardi, quando il
      collo ti si è già irrigidito a forza di guardare in alto.

storylet:
  # ------------------------------------------------------------ 4 · la strada (apre la spedizione)
  - id: la-strada-per-la-roccia
    immagine: ambientazione/roccia-di-wren
    titolo: La strada per la Roccia
    sommario: "La capanna del Cucitore sta su uno scoglio nero del Torvessa, a nord-est della città. Ci si arriva a piedi lungo la riva, o in barca fino ai giunchi."
    luogo: Superficie Fratturata, lungo il Torvessa
    area: superficie-fratturata
    presso: riva-del-torvessa
    requisiti: [pista.sepolcro == 4]
    testo: |
      Esci dalla Città Bassa all'alba verso nord-est, dove le ultime case di
      pietra grezza lasciano il posto agli orti e ai recinti delle capre. Le
      capre ti guardano passare masticando, e una ti segue lungo il recinto
      fino all'ultimo palo. Sulla porta dell'ultima casa una donna sbatte un
      tappeto contro lo stipite, e quando le chiedi la strada per il fiume
      smette di sbatterlo.

      «Per il fiume va bene» dice. «Allo Scoglio invece non ci va nessuno, e
      tu hai la faccia di uno che ci va. Mio figlio aveva sei anni quando
      c'era il Cucitore. Adesso ne ha undici, e prima di dormire guarda
      ancora sotto il letto, e poi ci riguarda.» Ti indica un sentiero fra i
      rovi e torna al tappeto, battendolo più forte di prima.

      {empatia Facile} Il tappeto è pulito da un pezzo. Lo batte per avere
      qualcosa da fare con le mani mentre parla del figlio.

      {origine figlio-della-citta-bassa} Le Notti Cucite te le ricordi dai
      vicoli, con le porte sprangate prima del tramonto e le madri che
      contavano i figli prima di cena e poi di nuovo dopo. Anche la tua
      schiena se le ricorda, perché si è irrigidita appena lei ha detto il
      nome.

      Il sentiero costeggia il Torvessa verso nord-est, stretto fra i rovi e
      le pietre che affiorano, e dopo mezz'ora il rumore della città alle
      tue spalle si è sciolto nel ronzio dei moscerini. Alla foce di un
      fosso, sotto un salice, c'è una barca da pesca tirata in secca. Seduto
      sulla prua un vecchio ripara una rete con le dita gonfie, e ti guarda
      gli stivali prima della faccia.

      {conoscenze-della-strada Media} Uno che ripara reti a mezza mattina,
      quando gli altri sono già sull'acqua, aspetta un cliente. Per la cifra
      giusta ti porta dove vuoi, o quasi.

      *Anche lui ha capito dove stai andando.* Più avanti, sopra l'acqua, la
      foschia comincia a salire.
    opzioni:
      - testo: "Seguire la riva a piedi"
        descrizione: "Il sentiero porta fin davanti alla Roccia, ed è lungo."
        costo: 1
        esito:
          titolo: Lungo il Torvessa
          testo: |
            Cammini per tutta la mattina con il fiume sulla destra. I rovi
            ti tirano i calzoni a ogni passo, e due volte devi tornare
            indietro perché il sentiero finisce in una pozza, dove ti
            aspetta sempre la stessa rana, o una sua parente. Verso
            mezzogiorno la vegetazione si apre all'improvviso, e in mezzo
            all'acqua melmosa vedi la Roccia di Wren che esce dritta
            dall'acqua, con la capanna in cima.

            Ti siedi su un sasso a vuotare uno stivale, e intanto la guardi.
            Le imposte della capanna sono chiuse, e dal camino non esce
            fumo.
          imposta: { roccia.barca: 0 }
          vai: roccia-di-wren
      - testo: "Andare a cavallo lungo la riva"
        descrizione: "Il cavallo attraversa il fango a muso basso, e ci metti la metà del tempo."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il cavallo nel fango
          testo: |
            Il cavallo procede con il muso basso e gli zoccoli che
            risucchiano il fango a ogni passo, e dove la riva si stringe fra
            i rovi si apre la strada con il petto. A metà mattina sei già in
            vista della Roccia di Wren, nera in mezzo all'acqua melmosa, con
            la capanna in cima e le imposte chiuse. Leghi il cavallo a un
            salice storto, che comincia subito a strappare l'erba come se
            non ci fosse nient'altro al mondo.

            {cavalcare Media} Mentre mangia tiene un orecchio girato verso
            la Roccia, e non lo rimette dritto. Le bestie certe cose le
            sentono prima, e questa ha deciso di non avvicinarsi di un
            passo.
          imposta: { roccia.barca: 0 }
          vai: roccia-di-wren
      - testo: "Pagare il vecchio per un passaggio in barca"
        descrizione: "Poche monete, e arrivi con le gambe riposate. Allo Scoglio però non attracca."
        requisiti: [monete >= 3]
        costo: 1
        esito:
          titolo: A remi
          testo: |
            Il vecchio morde le monete una alla volta per sentire se sono
            buone e poi le fa sparire nella camicia. Rema seduto di
            traverso, con la schiena al fiume, e parla per tutto il
            tragitto. «Dico io, allo Scoglio non ci attracco. Ti lascio ai
            giunchi e da lì ci arrivi coi piedi tuoi. Mio cognato ci ha
            attraccato l'anno dopo l'incendio. Adesso vende castagne in
            Città Bassa, e da allora, dico io, l'acqua non la guarda più.»

            Ti lascia dove i giunchi si fanno fitti, a un tiro di sasso
            dalla Roccia. Le gambe ti ringraziano, e lui spinge la barca
            indietro prima che tu abbia finito di scendere, così l'ultimo
            passo lo fai nell'acqua.
          effetti: { monete: -3, ferite: -0.5 }
          imposta: { roccia.barca: 1 }
          vai: roccia-di-wren
      - testo: "Riconoscere la faccia del vecchio"
        descrizione: "Quella mascella l'hai già vista in Città Bassa, dietro un carretto di castagne all'imbocco del Ponte del Pesce."
        quando: [origine.figlio-della-citta-bassa >= 1]
        costo: 1
        esito:
          titolo: Il cognato
          testo: |
            Gli dici che ha la stessa mascella del castagnaro che sta
            all'imbocco del Ponte del Pesce, quello che d'inverno ti
            regalava le castagne bruciate quando eri bambino. Il vecchio
            smette di cucire la rete. «Mio cognato» dice. «Le bruciate le
            regalava perché nessuno le comprava, dico io.»

            Ti fa salire senza parlare di monete e rema seduto di traverso,
            con la schiena al fiume, raccontandoti di come il cognato ha
            smesso di guardare l'acqua dopo aver attraccato allo Scoglio. Ti
            lascia dove i giunchi si fanno fitti, a un tiro di sasso dalla
            Roccia, e spinge indietro la barca prima che tu abbia finito di
            scendere. Ti resta in bocca, chissà perché, il sapore delle
            castagne bruciate.
          effetti: { ferite: -0.5 }
          imposta: { roccia.barca: 1 }
          vai: roccia-di-wren
      - testo: "Seguire le piste degli animali lungo la riva"
        descrizione: "Al Circolo ti hanno insegnato che le bestie scendono a bere per la via più corta. Le loro piste arrivano prima del sentiero."
        quando: [origine.figlio-del-circolo >= 1]
        costo: 0
        esito:
          titolo: Le piste degli animali
          testo: |
            Lasci il sentiero dei rovi e scendi sulla striscia di fango dove
            l'acqua si è ritirata. Le volpi e i tassi vanno al fiume dritti,
            e qui le loro piste corrono fra le canne, battute da anni di
            zampe. Le segui a passo svelto, chinandoti ogni tanto a toccare
            un'orma per sentire se è fresca, come facevi da bambino nel
            Bosco di Velthar.

            A metà mattina il fango si apre su una spiaggetta di ghiaia, e
            davanti a te c'è la Roccia di Wren, nera nell'acqua melmosa, con
            la capanna in cima. Sulla riva che le sta di fronte le piste si
            interrompono tutte nello stesso punto, come se le bestie
            avessero deciso insieme di tornare indietro.

            {natura Media} Le ultime orme sono più profonde sul davanti. Qui
            le bestie si sono fermate di colpo puntando le zampe, e hanno
            girato sul posto.
          imposta: { roccia.barca: 0 }
          vai: roccia-di-wren

  # ------------------------------------------------------------ le stanze (ripetibili, tre a caso)
  - id: roccia-sentiero-nella-foschia
    immagine: ambientazione/roccia-di-wren
    titolo: Il sentiero nella foschia
    sommario: "La foschia del Torvessa si chiude intorno al sentiero, e ai lati prendono forma figure che camminano al tuo passo."
    luogo: Roccia di Wren, lungo la riva
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 0, roccia.barca == 0]
    testo: |
      La foschia sale dal Torvessa a spirali lente e si richiude alle tue
      spalle, e del sentiero vedi soltanto i tre passi davanti agli stivali.
      Ai lati, fra i rovi, prendono forma figure alte quanto un uomo che
      camminano alla tua andatura. Quando ti fermi si fermano anche loro, un
      attimo dopo di te, e la mano ti è già andata alla cintura.

      {resilienza Media} Sono foschia, e la foschia si muove quando ti muovi
      tu, perché la sposti camminando. Ripetitelo, e respira dal naso.

      {percezione Facile fallita} Le conti due volte e ti tornano numeri
      diversi. Una delle due volte ne hai contata una di troppo, e non sai
      quale.

      {origine figlio-del-circolo} Nel Bosco di Velthar anche la nebbia ha i
      suoi rumori, un ramo che gocciola o una bestia che si sposta. Queste
      figure camminano senza spezzare un rametto, e l'orecchio che il
      Circolo ti ha allenato non trova niente da ascoltare.

      Accanto al sentiero, piantato storto nel fango, c'è un palo con una
      tavola. Sopra ci hanno dipinto *PESCA VIETATA* in lettere rosse. Più
      in basso un'altra mano ha aggiunto *ANCHE IL RESTO* con una vernice
      diversa, e una calligrafia molto più convinta.
    opzioni:
      - testo: "Tenere gli occhi sul sentiero"
        descrizione: "Le figure sono foschia. Il sentiero invece è vero, e ti serve vederlo."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Un passo alla volta
          testo: |
            Abbassi lo sguardo e conti i sassi che affiorano, uno per passo.
            Le figure ti accompagnano per un tratto, poi una folata le
            stende sull'acqua e restano indietro. Quando rialzi la testa il
            sentiero è finito su una lingua di ghiaia che arriva fino alla
            Roccia di Wren, nera contro il bianco della foschia, e hai la
            mascella indolenzita a forza di stringerla. Ti massaggi la
            faccia con due dita prima di attraversarla.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Dietro la figura
          testo: |
            Una delle figure si stacca dalle altre e scende verso il fiume,
            e tu le vai dietro senza averlo deciso. Ti fermi quando l'acqua
            ti arriva alle ginocchia e la figura non c'è più. Torni sul
            sentiero bagnato e tremante, e non sai più da che parte eri
            arrivato. Ti ci vuole un pezzo per ritrovare il palo con la
            tavola, e ritrovarlo ti fa quasi piacere, come rivedere una
            faccia nota.

            {atletica Media fallita} Le gambe ti hanno portato dietro alla
            figura con una prontezza che per le cose utili non hanno mai
            avuto.
          effetti: { tormento: 0.5 }
      - testo: "Tagliare fra i rovi, lontano dall'acqua"
        descrizione: "Lontano dalla riva la foschia è più rada. I rovi però sono fitti."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Graffi
          testo: |
            Ti apri la strada con gli avambracci, e i rovi ti restituiscono
            il favore con gli interessi. Lontano dall'acqua la foschia si
            dirada e le figure non ti seguono. Dopo un'ora sbuchi su una
            lingua di ghiaia che porta fino ai piedi della Roccia di Wren,
            con le maniche a brandelli e una spina nel pollice che toglierai
            stasera. Alle tue spalle il roveto si richiude con un fruscio
            soddisfatto.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Nel roveto
          testo: |
            Il roveto è più fitto di quanto sembrava, e a metà ti ci ritrovi
            incastrato con una spina piantata nel collo. Ne esci
            all'indietro, lasciando ai rami un pezzo di camicia e un po' di
            sangue, nello stesso punto da cui eri entrato. Ti tamponi il
            collo con la manica, e la manica torna indietro rossa. Da qui il
            roveto sembra più fitto di prima.

            {resistenza Facile} La spina è uscita intera e il taglio è
            superficiale. Il collo sanguina tanto perché è fatto così, anche
            se il cuore non ci crede.
          effetti: { ferite: 0.5 }
      - testo: "Seguire il fiume, anche se è più lungo"
        descrizione: "Allunghi di molto la strada, ma almeno sai dov'è l'acqua."
        costo: 2
        esito:
          titolo: Il giro del fiume
          testo: |
            Lasci il sentiero e segui la riva, dove la foschia è più bassa e
            i piedi affondano nel fango fino alla caviglia. Le figure fra i
            rovi ti accompagnano per un tratto e poi restano indietro, ferme
            dove il terreno comincia a salire. Arrivi ai piedi della Roccia
            dal lato della ghiaia, con gli stivali pieni d'acqua e i
            polpacci che bruciano, quando la luce sul fiume è già cambiata
            due volte e tu hai smesso di contare le zanzare.
          effetti: { profondita.roccia-di-wren: 1, ferite: 0.5 }

  - id: roccia-riva-dei-giunchi
    immagine: ambientazione/roccia-di-wren
    titolo: La riva dei giunchi
    sommario: "Fra la riva e la Roccia ci sono i giunchi e l'acqua ferma, e sopra una passerella che nessuno ripara da anni."
    luogo: Roccia di Wren, la riva dei giunchi
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 0]
    testo: |
      Fra la riva e la Roccia di Wren c'è una distesa di giunchi più alti di
      te, piantati in un'acqua nera che non si muove. Ci passa sopra una
      passerella di assi sostenute da pali, costruita da qualche pescatore
      prima delle Notti Cucite e mai più riparata. Metà delle assi è marcia,
      e in tre punti mancano del tutto.

      {acrobazia Media} Le assi buone sono quelle più scure ai bordi, dove i
      pescatori mettevano i piedi. Se segui il loro passo, i buchi diventano
      salti di un braccio.

      {origine apprendista-raschiatore} Sulle piattaforme della Cicatrice
      un'asse marcia la riconosci dal suono, battendoci sopra il tacco prima
      di caricarla. Il piede lo fa da solo sulla prima asse, e la passerella
      ti risponde con un tonfo sordo che non ti piace.

      All'imbocco della passerella c'è uno stivale da pescatore piantato nel
      fango fino alla caviglia. È pieno d'acqua, e dentro ci vive una rana
      che ti guarda senza nessuna curiosità. I giunchi frusciano anche
      quando il vento si ferma.

      {natura Difficile} I giunchi si muovono dal basso, dalle radici. Sotto
      l'acqua ferma passa qualcosa di lungo, e passa piano.
    opzioni:
      - testo: "Passare sulla passerella"
        descrizione: "Un'asse alla volta, saltando dove mancano."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Le assi buone
          testo: |
            Provi ogni asse con la punta dello stivale prima di caricarci il
            peso, e dove manca salti. Una cede proprio mentre la lasci, e la
            senti cadere nell'acqua con un tonfo morbido. Arrivi alla roccia
            con le mani che tremano e le ginocchia ancora piegate, pronte a
            un salto che non serve più. La rana, dallo stivale, non ha
            cambiato espressione, e a te viene voglia di ringraziarla lo
            stesso.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Nel fango
          testo: |
            La terza asse cede sotto il tallone e ci vai dentro fino alla
            vita. L'acqua è fredda e il fondo è un fango che ti succhia gli
            stivali. Ti tiri fuori aggrappato a un palo, con una scheggia
            nel palmo, e torni a riva a svuotarti le scarpe accanto alla
            rana. Lei ti guarda come prima, e il fango ti si secca sui
            calzoni in una crosta grigia che si incrina a ogni passo.
          effetti: { ferite: 0.5 }
      - testo: "Guadare fra i giunchi, tastando il fondo"
        descrizione: "Dove i giunchi hanno le radici più grosse, il fondo regge."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il fondo che regge
          testo: |
            Segui le radici più spesse, quelle che i giunchi allungano dove
            il fondo è di sasso, e l'acqua non ti sale oltre il ginocchio.
            Una biscia d'acqua ti passa accanto e si allontana, e almeno lei
            ha fretta di andarsene da qui. Esci sulla roccia nera bagnato
            fino alle cosce, ma ancora con entrambi gli stivali. Ti strizzi
            i calzoni sulla pietra, e l'acqua che cola è nera.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Il guado
          testo: |
            A metà del guado una cosa morbida ti scivola lungo il polpaccio
            e si stringe un momento intorno alla caviglia. Quando guardi giù
            vedi soltanto acqua nera. Torni a riva senza ricordarti di aver
            deciso di farlo, e ci metti un pezzo a far smettere di tremare
            le mani. Sulla caviglia, quando ti togli lo stivale, c'è un
            segno rosso largo due dita.

            {natura Media fallita} Ti dici che era una radice, oppure
            un'anguilla. Il segno però ha i bordi troppo dritti per tutte e
            due, e preferisci non pensarci oltre.
          effetti: { tormento: 0.5 }
      - testo: "Fare il giro largo fino alla secca"
        descrizione: "Molto più a valle i giunchi diradano e il fondo diventa sabbia."
        costo: 2
        esito:
          titolo: La secca
          testo: |
            Scendi lungo la riva finché i giunchi non diradano e sotto i
            piedi trovi la sabbia. L'acqua ti arriva alla vita ed è più
            fredda di quanto avessi messo in conto, tanto che a metà guado
            smetti di sentire le dita dei piedi e cominci a sentire i denti.
            Risali sull'isolotto dal lato opposto alla passerella, con i
            denti che battono e la Roccia che adesso ti sta proprio sopra.
          effetti: { profondita.roccia-di-wren: 1, ferite: 0.5 }

  - id: roccia-la-porta
    immagine: ambientazione/roccia-di-wren
    titolo: La porta della capanna
    sommario: "In cima a una scala appoggiata alla roccia c'è la porta della capanna, con il chiavistello a forma di testa d'uccello."
    luogo: Roccia di Wren, in cima alla scala
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 1]
    testo: |
      Contro la parete della Roccia è appoggiato un troncone di scala di
      legno, sistemato alla buona su due sassi, che arriva fino alla cengia
      sotto la capanna. Ai piedi della scala, inchiodata alla pietra, c'è
      una targa di bronzo verde di ossido. Dice che il luogo è chiuso per
      ordine dello *sciriffo* di Qir-Azel, nell'anno 145, e l'incisore ha
      sbagliato proprio la parola più importante.

      {origine rampollo-dei-quartieri-alti} Nei Quartieri Alti una targa
      così l'avrebbero rifusa in giornata, e dell'incisore si sarebbe
      parlato a cena per una settimana. Quaggiù è rimasta cinque anni a
      prendere il verde, e nessuno è venuto a correggerla.

      {conoscenze-della-strada Facile} La Guardia ha buttato le scale nel
      fiume, cinque anni fa. Questa l'ha portata qualcun altro in un secondo
      tempo, e l'ha appoggiata con cura.

      La porta della capanna è di legno scuro gonfio d'umido, senza un solo
      segno di bruciatura. Il chiavistello è una testa d'uccello intagliata
      con il becco rivolto in giù. Quando ci appoggi la mano il legno è
      tiepido, più tiepido dell'aria del fiume.

      {tecnologia Media} La testa d'uccello ha un giunto sottile alla base
      del collo, appena visibile. Quella testa è fatta per girare, come una
      maniglia.
    opzioni:
      - testo: "Forzare la porta con la spalla"
        descrizione: "Il legno è gonfio e la porta è vecchia."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La spallata
          testo: |
            Alla terza spallata la porta si apre di colpo, e per poco non
            finisci lungo disteso sul pavimento. Ti rimetti in piedi con la
            spalla che pulsa e la polvere che ti scende nel colletto. Dietro
            di te la porta torna ad accostarsi da sola, piano, finché il
            chiavistello non fa clic. La spalla ti farà male fino a domani
            sera.

            {resistenza Facile} La spalla è a posto. Il clic del
            chiavistello alle tue spalle, invece, lo senti nella schiena per
            un pezzo.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Tre colpi
          testo: |
            Colpisci la porta con la spalla tre volte, e la porta non si
            muove. Dopo il terzo colpo, dall'interno, arrivano tre colpi di
            risposta, con lo stesso intervallo dei tuoi. Ti ritrovi in fondo
            alla scala senza ricordarti di averla scesa, e la spalla
            comincia a farti male solo lì. Sopra di te la porta della
            capanna è chiusa come prima, e da lassù arriva soltanto il
            gocciolare dell'umido dalle grondaie.
          effetti: { tormento: 0.5 }
      - testo: "Studiare il chiavistello a testa d'uccello"
        descrizione: "Un intagliatore di uccelli faceva anche le serrature a modo suo."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il becco in su
          testo: |
            La testa d'uccello gira su un perno nascosto nel collo. Quando
            il becco punta verso l'alto, dentro la porta scatta un
            saliscendi di legno e la porta si apre senza un cigolio. Il
            meccanismo è fatto con una cura che nei Quartieri Alti non trovi
            nemmeno sulle porte dei Malgrani. Ci passi sopra il pollice, e
            il legno è liscio come un manico usato per anni, e tiepido come
            se qualcuno l'avesse appena lasciato.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Il morso
          testo: |
            Giri la testa d'uccello a destra e a sinistra, e alla fine il
            becco si chiude sul tuo indice con uno scatto secco. Ti lascia
            andare solo quando strappi via la mano, e un po' di pelle resta
            fra le sue mandibole di legno. Ti succhi il dito in fondo alla
            scala, e la porta resta chiusa. Il dito sanguina poco ma pulsa,
            e ogni pulsazione ti ricorda il becco.
          effetti: { ferite: 0.5 }
      - testo: "Entrare dalla finestra sul retro"
        descrizione: "È stretta, e il davanzale è irto di schegge."
        costo: 2
        esito:
          titolo: Le schegge
          testo: |
            Giri attorno alla capanna tenendoti alla parete di roccia, fino
            a una finestra senza vetro sul retro. Ti ci infili di traverso,
            una spalla alla volta, e il davanzale ti lascia nei palmi una
            dozzina di schegge sottili. Mentre te le togli con i denti ti
            accorgi che la porta è socchiusa, con il chiavistello a testa
            d'uccello già sollevato.

            {percezione Media} Un momento fa la porta era chiusa, l'hai
            vista dalla cengia. Nessuno l'ha aperta mentre giravi, eppure
            adesso è aperta.
          effetti: { profondita.roccia-di-wren: 1, ferite: 0.5 }

  - id: roccia-gli-uccelli-intagliati
    immagine: ambientazione/roccia-di-wren
    titolo: Gli uccelli intagliati
    sommario: "Il piano terra della capanna è coperto da centinaia di uccelli di legno. Alcuni hanno tre occhi oppure il becco di metallo."
    luogo: Roccia di Wren, il piano terra della capanna
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 2]
    testo: |
      Il piano terra è più grande di quanto la capanna sembri da fuori, e lo
      sguardo continua a cercare la parete di fondo un po' più in qua di
      dove sta. C'è odore di muffa e di resina, e sotto un odore più dolce,
      di legno appena scolpito. Le pareti sono coperte di intagli,
      centinaia, tutti uccelli. Ci sono corvi e gufi scolpiti penna per
      penna, e fra loro ce ne sono di storti, che hanno tre occhi oppure il
      becco di metallo. I tavoli sono rovesciati, e sul pavimento sono
      sparsi scalpelli arrugginiti.

      {magia Media} La stanza è più grande dentro che fuori, e il Mana se ne
      accorge prima dei tuoi occhi. Sotto la pelle senti un formicolio, come
      quando una gamba si addormenta.

      Su uno scaffale vicino alla porta c'è una fila di passeri tutti
      uguali, ognuno con il cartellino del prezzo legato a una zampa e
      scritto in una grafia ordinata.

      {conoscenze-della-strada Facile} Prezzi da bancarella, onesti, più
      bassi di quanto valgano. Uno che li vendeva così voleva che li
      comprassero i bambini.

      {origine mercante-dei-ponti} Il cartellino lo leggi prima del passero,
      per mestiere. Sui Ponti un prezzo scritto con tanta cura vuol dire che
      chi lo scriveva aspettava i clienti uno per uno, e non aveva fretta di
      vederli andare via.
    opzioni:
      - testo: "Passare fra i tavoli senza toccare niente"
        descrizione: "Gli scalpelli sono dappertutto, e sono arrugginiti."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Fra gli scalpelli
          testo: |
            Scavalchi un tavolo e metti i piedi nei vuoti fra gli scalpelli,
            uno alla volta, senza far tintinnare il ferro. Gli uccelli
            restano dove sono. Ti rimane però la sensazione precisa che
            quelli con tre occhi li abbiano fatti con tre occhi per un
            motivo, e arrivi in fondo alla stanza con la nuca fredda. Lì ti
            fermi un momento e ti asciughi le mani sui calzoni.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Ruggine
          testo: |
            Un tavolo rovesciato si sposta sotto il tuo peso e uno scalpello
            ti si pianta di traverso nel polpaccio. La ruggine ti lascia
            sulla pelle una macchia arancione. Te la strofini con la manica,
            e la macchia si allarga invece di andar via. Torni verso la
            porta zoppicando, e sullo scaffale la fila di passeri con il
            cartellino adesso è girata verso di te.

            {resistenza Facile} La gamba brucia ma regge. Il ferro
            arrugginito è un debito che si paga dopo, e conviene lavare la
            ferita stasera stessa.
          effetti: { ferite: 0.5 }
      - testo: "Esaminare gli intagli"
        descrizione: "Un intagliatore non ne scolpisce tanti senza tenerne il conto."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le date
          testo: |
            Sotto ogni intaglio c'è una data incisa con la punta del
            coltello. I corvi e i gufi sono vecchi di vent'anni. Gli uccelli
            con tre occhi e con il becco di metallo hanno date più recenti,
            tutte dell'anno 145, e sono girati verso le scale. Il 145 è
            l'anno delle Notti Cucite, e lo stomaco te lo ricorda prima
            della testa. Te lo segni a mente per raccontarlo in città,
            ripetendo la data finché non ti sembra più tua che sua.
          effetti: { profondita.roccia-di-wren: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Gli occhi
          testo: |
            Cominci a contare gli occhi degli uccelli storti e non riesci a
            smettere. Quando arrivi a trecento ti accorgi che stai muovendo
            le labbra, e che fuori la luce è cambiata. Esci all'aria aperta
            per respirare, e ci resti più a lungo di quanto vorresti. Il
            numero ti resta in testa per tutto il giorno, e non è un numero
            tondo.
          effetti: { tormento: 0.5 }
      - testo: "Attraversare la stanza a occhi bassi"
        descrizione: "Non guardarli. Contare i passi e basta."
        costo: 2
        esito:
          titolo: A occhi bassi
          testo: |
            Tieni lo sguardo sulle assi del pavimento e conti i passi a
            mezza voce, come da bambino per non pensare al buio. Arrivato a
            ventitré ti accorgi che da un pezzo conti anche il ticchettio
            che viene dalle pareti, e che il ticchettio va un poco più
            svelto di te. Raggiungi il fondo della stanza con le tempie che
            pulsano e la gola secca, e il numero ventitré che ti resta
            incollato alla lingua.
          effetti: { profondita.roccia-di-wren: 1, tormento: 0.5 }

  - id: roccia-il-libro-di-schizzi
    immagine: ambientazione/roccia-di-wren
    titolo: Il libro di schizzi
    sommario: "Su un tavolo rimasto in piedi c'è un libro di schizzi aperto, con studi di ali che pagina dopo pagina diventano macchine."
    luogo: Roccia di Wren, il piano terra della capanna
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 2]
    testo: |
      In mezzo ai tavoli rovesciati ce n'è uno solo in piedi, sotto la
      finestra, con sopra un libro di schizzi aperto e una matita consumata
      fino alla lunghezza di un pollice. Le pagine sono piene di studi di
      ali e di ossa, disegnati con una mano ferma. Più avanti le ali
      diventano macchine, con le articolazioni di metallo e i filamenti di
      rame al posto dei tendini, e accanto a ogni disegno ci sono misure in
      dita e in pollici.

      {tecnologia Media} Le articolazioni sono disegnate bene, da uno che
      sapeva come si muove un gomito di metallo. Le misure però sono quelle
      di un corpo d'uomo, e di nessun uccello.

      {origine allievo-di-torvessa} All'Accademia ti hanno insegnato a
      disegnare un congegno partendo dalle misure, e la forma viene dopo.
      Wren cominciava dall'ala e ci aggiungeva i numeri dopo, perché sapeva
      già che cosa voleva vedere.

      Nel margine di una pagina, fra due ali, c'è una lista della spesa.
      Colla di pesce in due misure, e sale sottolineato due volte.

      {empatia Media} Sottolineato due volte, come si fa quando si è già
      dimenticato una volta. Una persona qualsiasi, con le sue dimenticanze.

      Lo stomaco ti si chiude più per la lista che per le ali.
    opzioni:
      - testo: "Leggere gli appunti"
        descrizione: "La grafia è minuta e i calcoli sono lunghi."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: Le ali di rame
          testo: |
            Gli appunti sono calcoli di pesi e di leve. Secondo i numeri di
            Wren nessuna di queste ali avrebbe mai retto un uomo, e lui lo
            sapeva, perché accanto all'ultimo calcolo ha scritto «non serve
            che volino». Strappi le pagine dei calcoli e le pieghi sotto la
            camicia. La carta è ruvida contro la pelle, e ogni tanto la
            senti frusciare. In Biblioteca sapranno leggerle meglio di te.

            {accademiche Media} Ali che non devono volare sono fatte per
            essere viste. Un'ala che non regge niente è fatta per un altare,
            o per una processione.
          effetti: { profondita.roccia-di-wren: 1, informazioni.segreto: 0.5 }
        fallimento:
          titolo: La matita
          testo: |
            Leggi una pagina e poi un'altra, e i calcoli cominciano ad avere
            senso, cosa che non ti piace affatto. Poi ti accorgi di avere in
            mano la matita di Wren e di aver aggiunto una piuma al margine
            di un disegno. La piuma è venuta bene, e questo ti piace ancora
            meno. La rimetti giù e ti strofini le dita sui calzoni finché
            non bruciano.
          effetti: { tormento: 0.5 }
      - testo: "Guardare soltanto i disegni"
        descrizione: "I disegni si capiscono anche senza leggere, e si dimenticano prima."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Facile }
        successo:
          titolo: Ali chiuse
          testo: |
            Sfogli in fretta guardando i disegni, e le parole le salti. Le
            ali di piume diventano ali di metallo pagina dopo pagina, e
            l'ultima tavola è un'ala sola e finita, ombreggiata come una
            cosa vera. Chiudi il libro prima di chiederti a che cosa
            servisse, e ci appoggi sopra la matita, parallela al dorso, come
            l'avresti trovata. Ti accorgi che stavi trattenendo il fiato
            solo quando lo lasci andare.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: L'ultima tavola
          testo: |
            L'ultima tavola è un'ala finita, disegnata così bene che per un
            momento ti sembra di sentirla frusciare. Chiudi il libro di
            colpo e resti con le mani sulla copertina ad aspettare che il
            fruscio smetta. Smette dopo un po', quando hai già perso il
            conto del tempo. Fuori dalla finestra la foschia del fiume si è
            alzata fino ai giunchi più alti.

            {resilienza Facile fallita} Ti dici che era il vento fra le
            pagine. Le pagine però erano chiuse sotto le tue mani, e le mani
            lo sanno.
          effetti: { tormento: 0.5 }
      - testo: "Chiudere il libro e portarlo via"
        descrizione: "Lo leggerai dopo, alla luce del giorno, se ne avrai ancora voglia."
        costo: 2
        esito:
          titolo: Il libro sotto la giacca
          testo: |
            Chiudi il libro e te lo infili sotto la giacca, contro le
            costole. Pesa più di quanto dovrebbe un quaderno di schizzi, e
            per tutto il resto della salita lo senti tiepido sul fianco,
            come un animale che dorme. Quando lo riapri, più tardi, le
            pagine delle ali si sono incollate fra loro per l'umido e non
            c'è verso di separarle.
          effetti: { profondita.roccia-di-wren: 1, tormento: 0.5 }

  - id: roccia-le-scale-marce
    immagine: ambientazione/roccia-di-wren
    titolo: Le scale marce
    sommario: "Dal piano di sopra scende un'aria fredda, e con l'aria un rumore leggero e regolare, come un attrezzo che batte sul legno."
    luogo: Roccia di Wren, ai piedi delle scale
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 3]
    testo: |
      In fondo alla stanza una scala di legno ripida e stretta sale al piano
      di sopra, con i gradini neri di umido. Ai piedi della scala c'è un
      paio di pantofole di feltro allineate con cura e rivolte con la punta
      verso il primo gradino. Dall'alto scende un filo d'aria più fredda di
      quella del fiume, e con l'aria un rumore leggero, *toc… toc… toc*,
      come di un attrezzo che batte sul legno.

      {empatia Difficile} Le pantofole le ha lasciate lì qualcuno che
      salendo si toglieva gli stivali per non sporcare. Un uomo ordinato,
      che teneva alla sua bottega più che a se stesso.

      Il rumore ha il ritmo regolare di una bottega.

      {atletica Media} I gradini sono marci al centro e ancora buoni contro
      il muro. Chi sale con il peso sulle braccia arriva in cima, chi sale
      come su una scala qualsiasi no.

      Ti accorgi di aver smesso di respirare per sentirlo meglio.
    opzioni:
      - testo: "Ascoltare il rumore prima di salire"
        descrizione: "A ogni colpo la scala vibra. Le orecchie possono dirti dove mettere i piedi."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il ritmo
          testo: |
            Resti immobile ai piedi della scala e ascolti. Il rumore viene
            dal fondo del piano di sopra, sempre dallo stesso punto, e a
            ogni colpo la scala vibra appena. I gradini buoni sono quelli
            che vibrano meno, e li conti uno per uno finché non li sai a
            memoria. Adesso sai dove mettere i piedi. Sopra di te il rumore
            continua, regolare, paziente, senza nessuna fretta di finire.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Il silenzio
          testo: |
            Trattieni il fiato per sentire meglio, e il rumore smette nello
            stesso momento. Resti ad aspettare che riprenda, con il cuore
            che ti batte nelle orecchie, ma per un bel pezzo non riprende.
            Il sudore ti si è raffreddato sulla nuca, e ci passi sopra una
            mano. Torni fino alla porta camminando all'indietro, e solo
            sulla soglia lo senti ricominciare.

            {percezione Media} Ha ripreso dallo stesso colpo in cui si era
            fermato, senza saltarne uno. Lassù qualcuno contava insieme a
            te.
          effetti: { tormento: 0.5 }
      - testo: "Salire tenendoti al muro"
        descrizione: "Se il peso lo regge il muro, ai gradini resta poco da reggere."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Contro il muro
          testo: |
            Sali di lato, con la schiena contro la parete e i palmi aperti
            sul legno, e lasci ai gradini solo la punta dei piedi. Uno
            scricchiola quando sei già sul successivo. A metà rampa vedi in
            cima una tenda di tela grezza, e il rumore viene da dietro la
            tenda. Fai gli ultimi gradini più piano dei primi e arrivi in
            cima con le mani sporche di muffa fino ai polsi.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Il quarto gradino
          testo: |
            Il quarto gradino si sbriciola sotto il tuo peso e la gamba ci
            passa attraverso fino al ginocchio. Il legno marcio ti apre lo
            stinco. Ti tiri fuori piano mordendoti il labbro, mentre sopra
            di te il rumore continua senza perdere un colpo. Ti fasci la
            gamba con un pezzo di camicia, e il sangue passa la stoffa in
            fretta lo stesso.

            {resistenza Media} Fa male, ma l'osso è intero e la gamba ti
            regge. Puoi salire, se ti decidi prima che il dolore si metta
            comodo.
          effetti: { ferite: 0.5 }
      - testo: "Salire con le pantofole di feltro"
        descrizione: "Sono più o meno della tua misura, e sul legno il feltro non si sente."
        costo: 2
        esito:
          titolo: Il feltro
          testo: |
            Ti togli gli stivali e infili le pantofole, che ti stanno quasi
            bene, e questo ti mette più a disagio del resto. Il feltro è
            morbido e un po' umido, e sui primi due gradini non fa nessun
            rumore. Al terzo la scala geme sotto il tuo peso, e il toc toc
            di sopra si interrompe per il tempo di un respiro prima di
            riprendere, un poco più lento. Sali gli ultimi gradini con le
            mani contro il muro.
          effetti: { profondita.roccia-di-wren: 1, tormento: 0.5 }

  # ------------------------------------------------------------ la carta della spedizione
  - id: roccia-l-airone
    immagine: ambientazione/roccia-di-wren
    titolo: L'airone
    sommario: "Ai piedi della Roccia c'è un airone fermo su un sasso. Non vola via quando ti avvicini."
    luogo: Roccia di Wren, nelle acque basse
    area: roccia-di-wren
    tipo: carta
    requisiti: [pista.sepolcro == 4]
    testo: |
      Su un sasso piatto, nell'acqua bassa ai piedi della Roccia, c'è un
      airone cenerino fermo su una zampa. È l'unico uccello che hai visto da
      quando la foschia si è chiusa intorno a te. Quando ti avvicini non
      vola via. Gira la testa lentamente e ti segue con un occhio giallo.

      Ha un'ala aperta a metà, che pende di lato. È steccata con due
      assicelle di legno intagliato fatte su misura, legate con un filo di
      rame sottile girato molte volte intorno alle penne. Il rame è
      diventato verde, e sotto il filo le penne sono spezzate.

      {origine fuggiasco-di-ghoran} Il filo è rimasto stretto così a lungo
      che le penne ci sono cresciute intorno. Ti guardi i polsi senza
      volerlo, e poi ti vergogni di averlo fatto davanti a un uccello.

      {addestrare-animali Media} Non vola via perché non può, e non ti
      attacca perché è stanco. Se gli arrivi davanti piano, dal lato
      dell'ala buona, ti lascia fare.

      {medicina Media} La steccatura è fatta bene, da qualcuno che sapeva
      come si regge un osso rotto. Poi nessuno è tornato a toglierla, e il
      filo ha continuato a stringere.

      *Quelle assicelle sono fatte con più cura di molte culle.* L'airone
      apre il becco e lo richiude senza fare nessun verso.
    opzioni:
      - testo: "Liberarlo dal filo di rame"
        descrizione: "Il filo stringe da anni, e l'airone non ti conosce."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: Un volo basso
          testo: |
            Gli parli a voce bassa mentre ti avvicini, del tempo che fa e di
            altre cose senza importanza, e lui ti lascia arrivare. Il filo è
            verde e si sbriciola fra le dita, e le assicelle cadono in
            acqua. L'airone resta fermo ancora un momento, poi apre le ali e
            si alza in un volo basso e storto sopra il fiume, lontano dalla
            Roccia. Lo segui con gli occhi finché sparisce, e ti accorgi che
            respiri meglio.
          effetti: { tormento: -0.5 }
        fallimento:
          titolo: Il becco
          testo: |
            L'airone ti lascia avvicinare fino a un braccio di distanza, poi
            scatta. Il becco ti prende sul dorso della mano e ti apre la
            pelle fino alle nocche. Quando ti tiri indietro lui è di nuovo
            immobile sul sasso, su una zampa, con la testa girata verso la
            capanna. Ti avvolgi la mano nel fazzoletto, e lui non ti degna
            più di un'occhiata.
          effetti: { ferite: 0.5 }
      - testo: "Guardare dove guarda lui"
        descrizione: "L'airone tiene la testa girata verso la capanna."
        esito:
          titolo: La finestra di sopra
          testo: |
            Ti metti accanto al sasso e segui con lo sguardo il becco
            dell'airone. Punta verso una finestra del piano di sopra, e dopo
            un po' dietro le imposte passa una luce bianca e fredda, da un
            lato all'altro della stanza. Si muove all'altezza di un uomo in
            piedi, e ogni tanto si ferma per il tempo di un colpo di
            scalpello. Alla Pignatta, quando lo racconterai, ti offriranno
            da bere per sentirlo due volte.

            {espressivita Facile} Lo racconterai lasciando la pausa dove si
            ferma la luce. Alla Pignatta la pausa vale più del resto.
          effetti: { informazioni.voce: 1 }
      - testo: "Avvicinarti come al Circolo"
        descrizione: "Al Circolo un uccello ferito si avvicina di fianco, con gli occhi bassi e le mani dove le può vedere."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Di fianco
          testo: |
            Entri nell'acqua bassa di fianco, dal lato dell'ala buona, con
            lo sguardo sul sasso e non su di lui, come ti hanno insegnato
            nel Bosco di Velthar. L'airone ti lascia arrivare fino a toccarlo.
            Il filo di rame si sbriciola sotto le unghie, e le assicelle
            le prendi una alla volta prima che cadano, perché nessuno le ha
            fatte per finire nel fango. Lui resta fermo ancora un momento,
            poi apre le ali e si alza in un volo basso e storto sopra il
            fiume, lontano dalla Roccia.

            Ti ritrovi con le due assicelle in mano. Sono intagliate a
            piccole piume, e le lasci sul sasso dove stava lui.
          effetti: { tormento: -0.5 }
      - testo: "Togliere la steccatura come in infermeria"
        descrizione: "Al Velo hai tolto più di una fasciatura rimasta su troppo a lungo. Un'ala è un braccio con le piume."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: mentale, abilita: [medicina], difficolta: Media }
        successo:
          titolo: La fasciatura vecchia
          testo: |
            Gli tieni ferma l'ala contro il corpo con il palmo aperto, come
            si tiene il braccio di un ricoverato che ha paura, e srotoli il
            filo un giro alla volta invece di tagliarlo. Sotto, la pelle è
            segnata ma intera. L'airone sopporta tutto con l'occhio giallo
            fisso sulla capanna, poi apre le ali e si alza in un volo basso
            e storto sopra il fiume, lontano dalla Roccia. Ti asciughi le
            mani sui calzoni, e il respiro ti torna più largo.

            {medicina Media} L'osso si era saldato da tempo. A tenerlo
            fermo, da anni, era soltanto il filo.
          effetti: { tormento: -0.5 }
        fallimento:
          titolo: Il ricoverato
          testo: |
            Gli prendi l'ala con la sicurezza dell'infermeria, e l'airone
            non è un ricoverato. Il becco ti prende sul dorso della mano e
            ti apre la pelle fino alle nocche. Quando ti tiri indietro lui è
            di nuovo immobile sul sasso, su una zampa, con la testa girata
            verso la capanna, e tu ti fasci la mano da solo, stretta, come
            ti hanno insegnato.
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · 4 → 5
  - id: l-altare-del-cucitore
    immagine: bestiario/osric-wren-spettrale
    titolo: L'altare del Cucitore
    sommario: "Al piano di sopra c'è l'altare del Demone Uccello, e dietro l'altare c'è Osric Wren."
    luogo: Roccia di Wren, il piano di sopra
    area: roccia-di-wren
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren >= 4]
    testo: |
      Al piano di sopra l'aria è più fredda di quella del fiume, e il fiato
      ti esce bianco. La stanza occupa tutto il piano. Contro la parete di
      fondo, sotto la finestra con le imposte chiuse, c'è l'altare del
      Demone Uccello, un corpo d'uomo scolpito nel legno nero con il volto
      allungato e il cranio coperto di piume dure e taglienti. Il legno è
      bruciato dentro, e dalle crepe si vede il carbone. Dalle spalle si
      aprono due ali storte, per metà di piume intagliate e per metà di
      lamine di metallo, e nelle vene scolpite delle braccia corrono
      filamenti di rame sottilissimi. Davanti all'altare c'è un cuscino da
      inginocchiatoio ricamato a fiori, consumato al centro.

      {origine accolito-del-velo} Il cuscino è consumato come quelli su cui
      ti inginocchiavi da novizio, da uno che ci passava le ore. Le ginocchia
      ti fanno male per solidarietà, anche se qui si pregava qualcun altro.

      {magia Difficile} Il rame nelle braccia della statua è caldo di Mana,
      e il Mana sale lungo le braccia fino alle ali. Chi l'ha costruito
      pensava alle ali più che a chi si inginocchia.

      In fondo alla stanza un rumore leggero di attrezzo sul legno smette di
      colpo. Senti un fruscio di piume sul pavimento e il suono di una lama
      che incide il legno, e dietro l'altare si forma una figura. Prima
      compare un profilo, poi metà del corpo di un uomo sospeso a mezz'aria.

      Osric Wren ha la pelle bianca e trasparente, attraversata da filamenti
      di luce. Gli occhi sono cuciti con un filo scuro a punti regolari, e
      sul collo ha due tagli incrociati. Porta ancora il grembiule da
      intagliatore, ridotto a strisce. *Ha ancora la tasca per la matita.*
      In mano tiene un coltello da intaglio fatto di luce, con la lama
      sottile come un raggio di luna, e gira la testa verso di te.

      {armi-da-mischia Media} Tiene il coltello come un intagliatore, con il
      pollice sul dorso della lama. Taglierà di striscio, a colpi brevi,
      invece di colpire di punta.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "Il coltello è fatto di luce, ma la mano che lo tiene si muove da intagliatore."
        combattimento: spettro-del-cucitore
        vittoria:
          titolo: La cucitura che cede
          testo: |
            Il coltello di luce ti passa vicino alla faccia e lascia
            nell'aria un odore di legno appena tagliato. Il tuo colpo invece
            arriva, e Osric Wren si apre come una cucitura che cede, dal
            petto alle spalle, in fili di luce che si spengono uno dopo
            l'altro. Prima di sparire gira verso di te gli occhi cuciti, e
            dai tagli del collo esce una voce rotta.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            Le travi annerite si piegano verso il centro della stanza e il
            pavimento si spacca con un colpo secco. Ti butti giù per le
            scale e dalla cengia in acqua, mentre alle tue spalle la capanna
            crolla su se stessa. Rientri in Città Bassa al tramonto, bagnato
            fino al collo e con l'odore di legno tagliato ancora nel naso,
            con quelle parole che ti girano in testa.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          vai: citta-bassa
        sconfitta:
          titolo: Sotto le travi
          testo: |
            Il coltello di luce ti entra nella spalla senza tagliare la
            stoffa, e il freddo ti arriva fino ai denti. Cadi in ginocchio
            davanti all'altare. Osric Wren si china su di te, così vicino
            che vedi i punti del filo sulle palpebre, e dai tagli del collo
            esce una voce rotta.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            Poi si disfa nell'aria, e la capanna comincia a crollare. Di
            come arrivi alle scale ricordi poco. Ricordi l'acqua nera del
            Torvessa e le mani che cercano i giunchi. Torni in Città Bassa
            di notte zoppicando. Dietro di te, sulla Roccia, non resta più
            niente in piedi.

            {resistenza Media fallita} Il freddo nella spalla non se ne va
            con il resto. Ci resta a lungo, come un ospite che non ha capito
            che la festa è finita.
          effetti: { pista.sepolcro: 1, tormento: 1 }
          vai: citta-bassa
      - testo: "Esorcizzarlo"
        descrizione: "La Liturgia dell'Albero ha parole per i morti che non se ne sono andati. Questo però è il Cucitore, e l'altare del Demone Uccello gli dà forza a ogni parola."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Le parole dell'Albero
          testo: |
            Dici le parole dell'Esorcismo a voce alta, e la voce ti esce più
            ferma di quanto ti senti. A ogni frase la luce che attraversa
            Osric Wren si fa più debole, e il coltello gli trema in mano.
            Resta dietro l'altare e si sfilaccia dai bordi, e prima di
            sparire gira verso di te gli occhi cuciti. Dai tagli del collo
            esce una voce rotta.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            Quando l'ultima parola si spegne, le travi annerite si piegano
            verso il centro della stanza. Corri giù per le scale e salti
            dalla cengia nell'acqua bassa, e alle tue spalle la capanna
            crolla su se stessa. Torni in Città Bassa al tramonto, con la
            gola secca e quelle parole in testa, che si mescolano alle
            parole dell'Albero finché non sai più quali sono le tue.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          vai: citta-bassa
        fallimento:
          titolo: La parola sbagliata
          testo: |
            A metà della formula sbagli una parola, e lo senti subito, come
            un gradino che manca sotto il piede. Osric Wren passa attraverso
            l'altare e ti viene addosso, e il coltello di luce ti attraversa
            il petto senza toccare la pelle. Ti lascia dentro un freddo che
            dura. Mentre cadi in ginocchio lo senti parlare dai tagli del
            collo.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            Poi svanisce, e la capanna comincia a crollare. Scendi le scale
            a quattro zampe e ti butti in acqua. Torni in Città Bassa a
            notte fonda, e per tutta la strada ripeti fra te la formula,
            quella giusta, che adesso ti viene perfetta.
          effetti: { pista.sepolcro: 1, tormento: 1.5, ferite: 0.5 }
          vai: citta-bassa
      - testo: "Restare fermo e ascoltarlo fino all'alba"
        descrizione: "Lasciarlo parlare, senza alzare le mani. Per arrivare all'alba ci vuole una testa salda."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Fino all'alba
          testo: |
            Ti siedi sul pavimento con la schiena contro il muro e le mani
            sulle ginocchia, e lo lasci parlare. Osric Wren parla per tutta
            la notte, con la voce che esce dai tagli del collo. Parla di
            venature e di come si sceglie il legno per un'ala, e tu lo
            ascolti senza rispondere. Alla prima luce si ferma e gira verso
            di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            La luce del giorno entra dalle fessure delle imposte e lui ci si
            scioglie dentro. Quando le travi cominciano a piegarsi verso il
            centro della stanza tu sei già sulle scale. Dalla riva guardi la
            capanna crollare su se stessa, e rientri in Città Bassa a metà
            mattina con le gambe intorpidite.

            {empatia Difficile} Per tutta la notte non ha parlato una volta
            della Regina, fino alla fine. Parlava di legno come ne parla chi
            l'ha amato, e per qualche ora ha avuto qualcuno che lo
            ascoltava.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Una voce in prestito
          testo: |
            Resisti per qualche ora. Poi la voce di Osric Wren comincia a
            sembrarti la tua, e ti sorprendi ad annuire mentre ti spiega
            come si piega una piuma di rame. All'alba gira verso di te gli
            occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            Di come svanisce e di come crolla la capanna ricordi soltanto
            dei pezzi, in disordine. Ti ritrovi sulla riva dei giunchi
            sporco di cenere, con le mani che tremano e il ritmo di quella
            voce ancora nelle orecchie. In Città Bassa arrivi a mezzogiorno
            senza sapere che strada hai fatto, e con le scarpe slacciate.
          effetti: { pista.sepolcro: 1, tormento: 1.5 }
          vai: citta-bassa
      - testo: "Ascoltarlo e rispondergli"
        descrizione: "Finché gli rispondi lui parla e non taglia. Ogni risposta però lascia un segno."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Conversazione da bottega
          testo: |
            Gli chiedi del legno e delle piume, e lui risponde con la voce
            che esce dai tagli del collo, contento di avere un pubblico.
            Parlate delle venature del noce e della colla di pesce fino a
            tardi, e a ogni risposta ti accorgi di parlare un po' più come
            lui. All'alba Osric Wren tace e gira verso di te gli occhi
            cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            La luce del giorno lo scioglie, e la capanna comincia a cedere.
            Scendi senza correre e dalla riva la guardi crollare su se
            stessa. Rientri in Città Bassa con quella conversazione addosso,
            e per giorni ti capita di rispondere a domande che non ti ha
            fatto nessuno, quasi sempre sulla colla di pesce.
          effetti: { pista.sepolcro: 1, racconto: 1, tormento: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Le domande di Wren
          testo: |
            Dopo un po' è lui a fare le domande. Ti chiede la larghezza
            delle tue spalle e quanto pesi, e tu rispondi prima di poterti
            fermare. All'alba tace e gira verso di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            Quando la luce lo scioglie e la capanna comincia a cedere sei
            ancora seduto sul pavimento. Esci da una parete che si è aperta
            nel crollo e cadi fra i giunchi. Torni in Città Bassa a sera, e
            per tutto il tragitto ti ripeti le tue misure a mezza voce.

            {tecnologia Media} Larghezza delle spalle e peso, le due misure
            che servono per un'ala. Le aveva già segnate tutte nel libro,
            gli mancava soltanto un corpo.
          effetti: { pista.sepolcro: 1, tormento: 2 }
          vai: citta-bassa
      - testo: "Dare fuoco alla capanna e scappare"
        descrizione: "Il pavimento è pieno di trucioli, e la Guardia l'ha già fatto una volta. Ti scotterai."
        esito:
          titolo: Il secondo incendio
          testo: |
            Batti l'acciarino sui trucioli che coprono il pavimento, e il
            fuoco prende subito e corre basso verso l'altare. Osric Wren
            resta fermo. Mentre ti butti giù per le scale, con il fumo che
            ti brucia la gola e le mani scottate dalla ringhiera, la sua
            voce ti viene dietro dai tagli del collo.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            Dalla riva guardi la capanna bruciare e poi crollare su se
            stessa, con le travi che cadono verso il centro. Il fumo sale
            dritto, e dai giunchi non si alza nessun uccello. Rientri in
            Città Bassa a sera con le mani fasciate in una striscia di
            camicia, e l'odore del fumo ti resta nei capelli per giorni,
            anche dopo il terzo lavaggio.
          effetti: { pista.sepolcro: 1, ferite: 1, tormento: 0.5 }
          vai: citta-bassa
      - testo: "Dire sul suo altare la preghiera per i morti"
        descrizione: "Al Velo la preghiera per i morti che restano te l'hanno insegnata prima delle bende. Detta davanti a questo altare, ogni parola costa il doppio."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: mentale, abilita: [accademiche, resilienza], difficolta: Difficile }
        successo:
          titolo: La preghiera dei novizi
          testo: |
            Ti inginocchi sul cuscino ricamato, con le spalle al Demone
            Uccello, e dici la preghiera per i morti come la dicevate in
            fila nel dormitorio, senza saltare una sillaba. Osric
            Wren smette di incidere. A ogni strofa la luce che lo attraversa
            si fa più debole, e il coltello gli trema in mano. Prima di
            sfilacciarsi del tutto gira verso di te gli occhi cuciti, e dai
            tagli del collo esce una voce rotta.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            Quando l'ultima parola si spegne, le travi annerite si piegano
            verso il centro della stanza. Corri giù per le scale e salti
            dalla cengia nell'acqua bassa, e alle tue spalle la capanna
            crolla su se stessa. Torni in Città Bassa al tramonto con le
            ginocchia indolenzite, come dopo una veglia.

            {resilienza Difficile} A metà della seconda strofa l'altare ha
            cominciato a scaldarti la nuca. Hai tenuto la voce ferma lo
            stesso, ed è la cosa di cui vai più fiero da quando hai lasciato
            il dormitorio.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          pe: { resilienza: 5 }
          vai: citta-bassa
        fallimento:
          titolo: La strofa che manca
          testo: |
            Ti inginocchi sul cuscino e cominci la preghiera, ma alla
            seconda strofa non ti torna più la parola che viene dopo, e la
            stanza si fa silenziosa ad aspettarla. Osric Wren passa
            attraverso l'altare e il coltello di luce ti attraversa il petto
            senza toccare la pelle, lasciandoti dentro un freddo che dura.
            Mentre cadi lo senti parlare dai tagli del collo.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            Poi svanisce, e la capanna comincia a crollare. Scendi le scale
            a quattro zampe e ti butti in acqua. Torni in Città Bassa a
            notte fonda, e la parola che mancava ti torna in mente sulla
            strada di casa, quando non serve più.
          effetti: { pista.sepolcro: 1, tormento: 1.5, ferite: 0.5 }
          vai: citta-bassa
      - testo: "Spezzare il Mana che sale dall'altare"
        descrizione: "Il rame nelle braccia della statua porta il Mana fino alle ali, e lui ne prende forza. All'Accademia ti hanno insegnato che una corrente si spezza dove è più sottile."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [magia], difficolta: Difficile }
        successo:
          titolo: Il filo di rame
          testo: |
            Lasci che Osric Wren ti venga incontro e intanto guardi le
            braccia della statua, dove i filamenti di rame si stringono
            sopra il polso. Ci metti due dita e senti il Mana correre verso
            le ali come acqua in un tubo stretto. Lo spingi indietro con
            tutta la formula che hai, e il filo diventa rosso e poi nero. Il
            coltello di luce si spegne a un palmo dalla tua faccia, e Osric
            Wren si apre come una cucitura che cede, in fili di luce che si
            spengono uno dopo l'altro. Prima di sparire gira verso di te gli
            occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            Le travi annerite si piegano verso il centro della stanza e il
            pavimento si spacca. Ti butti giù per le scale e dalla cengia in
            acqua, mentre alle tue spalle la capanna crolla su se stessa.
            Rientri in Città Bassa al tramonto con i polpastrelli bruciati e
            quelle parole che ti girano in testa.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          pe: { magia: 5 }
          vai: citta-bassa
        fallimento:
          titolo: La corrente
          testo: |
            Metti le dita sul rame della statua e cerchi il punto più
            sottile, ma la corrente è più forte di ogni cristallo che hai
            toccato in aula, e invece di spezzarsi ti passa nel braccio. Ti
            ritrovi in ginocchio davanti all'altare, con il gelo fino ai
            denti, e Osric Wren si china su di te così vicino che vedi i
            punti del filo sulle palpebre.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            Poi si disfa nell'aria, e la capanna comincia a crollare. Di
            come arrivi alle scale ricordi poco, e torni in Città Bassa di
            notte, zoppicando, con il braccio che formicola fino alla spalla.
          effetti: { pista.sepolcro: 1, tormento: 1 }
          vai: citta-bassa
      - testo: "Parlargli dei suoi uccelli come di merce buona"
        descrizione: "Al piano di sotto i passeri hanno ancora il cartellino del prezzo. Un artigiano parla volentieri con chi sa quanto vale il suo lavoro."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, percezione], difficolta: Media }
        successo:
          titolo: Il prezzo giusto
          testo: |
            Gli dici che i suoi passeri li vendeva troppo poco, e che sui
            Ponti un intaglio così lo pagherebbero bene senza discutere.
            Osric Wren abbassa il coltello. Parla per tutta la notte di
            legni stagionati e di colla di pesce, e tu tratti ogni cosa come
            merce da banco, soppesandola. A ogni domanda ti accorgi di parlare un
            po' più come lui. All'alba tace e gira verso di te gli occhi
            cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            La luce del giorno lo scioglie, e la capanna comincia a cedere.
            Scendi senza correre e dalla riva la guardi crollare. Per giorni,
            in città, ti scopri a stimare il legno di ogni bancone su cui
            appoggi i gomiti.
          effetti: { pista.sepolcro: 1, racconto: 1, tormento: 1 }
          pe: { persuasione: 5 }
          vai: citta-bassa
        fallimento:
          titolo: Il cliente
          testo: |
            Gli parli dei suoi passeri e del loro prezzo, e lui si fa
            attento come un artigiano davanti a un cliente. Poi le domande
            le fa lui. Ti chiede la larghezza delle tue spalle e quanto pesi,
            come si prendono le misure per un lavoro su ordinazione, e tu
            rispondi prima di poterti fermare. All'alba tace e gira verso di
            te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            Quando la luce lo scioglie e la capanna comincia a cedere sei
            ancora seduto sul pavimento. Esci da una parete aperta dal
            crollo e cadi fra i giunchi. Torni in Città Bassa a sera,
            ripetendoti le tue misure a mezza voce come un ordine da
            consegnare.
          effetti: { pista.sepolcro: 1, tormento: 2 }
          vai: citta-bassa
      - testo: "Tenere duro fino all'alba, come nei recinti"
        descrizione: "A Ghoran hai passato notti lunghe senza muoverti. Qui serve un corpo che regge fino all'alba."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza], difficolta: Difficile }
        successo:
          titolo: Una notte di più
          testo: |
            Ti siedi sul pavimento con la schiena al muro e le mani aperte
            sulle ginocchia, dove lui le può vedere, e lasci che il freddo
            ti salga nelle ossa senza muoverti. Osric Wren parla per tutta
            la notte di venature e di ali, e tu conti i respiri come facevi
            nei recinti di Ghoran, per arrivare al mattino un respiro alla
            volta. Alla prima luce si ferma e gira verso di te gli occhi
            cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            La luce del giorno entra dalle fessure delle imposte e lui ci si
            scioglie dentro. Quando le travi cominciano a piegarsi tu sei già
            sulle scale, e rientri in Città Bassa a metà mattina con le gambe
            di legno.

            {resistenza Difficile} Il corpo si ricorda come si fa, e lo fa
            meglio di quanto vorresti, con una pazienza che hai imparato in
            un posto dove non vuoi tornare nemmeno col pensiero.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          pe: { resistenza: 5 }
          vai: citta-bassa
        fallimento:
          titolo: Il freddo
          testo: |
            Resisti per qualche ora con la schiena al muro, e intanto il
            freddo dell'altare ti entra nelle ossa più a fondo di quanto
            conoscessi. Verso la terza ora la voce di Osric Wren comincia a
            sembrarti la tua, e ti sorprendi ad annuire. All'alba gira verso
            di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento…
            La Regina tornerà.»

            Di come svanisce e di come crolla la capanna ricordi soltanto
            dei pezzi, in disordine. Ti ritrovi sulla riva dei giunchi sporco
            di cenere, e in Città Bassa arrivi a mezzogiorno senza sapere che
            strada hai fatto.
          effetti: { pista.sepolcro: 1, tormento: 1.5 }
          vai: citta-bassa
