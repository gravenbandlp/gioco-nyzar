# Il Sepolcro violato, la spedizione alla Roccia di Wren (pista.sepolcro 4 → 5).
# La strada parte dalla Città Bassa. Sulla Roccia le stanze vanno in ordine, secondo la profondità:
# 0 si arriva alla Roccia (dalla foschia o dai giunchi), 1 la porta della capanna, 2 il piano terra
# (gli uccelli o il libro), 3 le scale. Poi il cuore al piano di sopra, che riporta in città in ogni ramo.
# Una stanza superata non ricompare nella stessa visita (src/motore/spedizioni.ts).
quality:
  - { id: roccia.barca, nome: Sei arrivato alla Roccia in barca, categoria: stato, nascosta: true, descrizione: "1 se il vecchio ti ha lasciato ai giunchi, e la strada nella foschia non serve più." }

aree:
  - id: roccia-di-wren
    immagine: ambientazione/roccia-di-wren
    nome: Roccia di Wren
    sommario: "Uno scoglio nero nella foschia del Torvessa, con in cima la capanna del Cucitore bruciata dalla Guardia cinque anni fa."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      A nord-est della città il Torvessa si allarga in un'ansa di acqua
      melmosa coperta da una foschia bassa. In mezzo si alza la Roccia di
      Wren, una lingua di pietra nera alta quanto tre case, che i pescatori
      chiamano lo Scoglio e girano al largo.

      In cima c'è la capanna di Osric Wren. Cinque anni fa, alla fine delle
      Notti Cucite, la Guardia le ha dato fuoco e ha buttato le scale nel
      fiume, eppure la capanna è lassù, intatta, con le imposte chiuse.

storylet:
  # ------------------------------------------------------------ 4 · la strada (apre la spedizione)
  - id: la-strada-per-la-roccia
    immagine: ambientazione/roccia-di-wren
    titolo: La strada per la Roccia
    sommario: "La capanna del Cucitore sta su uno scoglio del Torvessa, raggiungibile lungo la riva o in barca."
    luogo: Superficie Fratturata, lungo il Torvessa
    area: superficie-fratturata
    presso: riva-del-torvessa
    requisiti: [pista.sepolcro == 4]
    testo: |
      All'alba esci dalla Città Bassa verso nord-est. Sulla porta
      dell'ultima casa una donna sbatte un tappeto, e quando le chiedi la
      strada per il fiume smette.

      «Per il fiume va bene» dice. «Allo Scoglio invece non ci va nessuno, e
      tu hai la faccia di uno che ci va. Mio figlio aveva sei anni quando
      c'era il Cucitore, e ancora adesso prima di dormire guarda sotto il
      letto.» Ti indica un sentiero fra i rovi.

      {origine figlio-della-citta-bassa} Le Notti Cucite te le ricordi dai
      vicoli, con le porte sprangate prima del tramonto.

      Dopo mezz'ora di sentiero, alla foce di un fosso, c'è una barca da
      pesca tirata in secca sotto un salice, e sulla prua un vecchio che
      ripara una rete e ti guarda gli stivali prima della faccia.

      {conoscenze-della-strada Media} Uno che ripara reti a mezza mattina,
      quando gli altri sono già sull'acqua, aspetta un cliente.
    opzioni:
      - testo: "Seguire la riva a piedi"
        descrizione: "Il sentiero porta fin davanti alla Roccia, ed è lungo."
        costo: 1
        esito:
          titolo: Lungo il Torvessa
          testo: |
            Cammini per tutta la mattina con il fiume sulla destra e i rovi che ti
            tirano i calzoni, e due volte torni indietro perché il sentiero
            finisce in una pozza. Verso mezzogiorno la vegetazione si apre e vedi
            la Roccia di Wren in mezzo all'acqua melmosa, con le imposte della
            capanna chiuse e nessun fumo dal camino.
          imposta: { roccia.barca: 0 }
          vai: roccia-di-wren
      - testo: "Andare a cavallo lungo la riva"
        descrizione: "Il cavallo attraversa il fango a muso basso, e ci metti la metà del tempo."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il cavallo nel fango
          testo: |
            Il cavallo procede a muso basso, con gli zoccoli che risucchiano il
            fango, e a metà mattina sei già in vista della Roccia di Wren. Lo
            leghi a un salice storto, e mentre strappa l'erba tiene un orecchio
            girato verso la Roccia e non lo rimette dritto.
          imposta: { roccia.barca: 0 }
          vai: roccia-di-wren
      - testo: "Pagare il vecchio per un passaggio in barca"
        descrizione: "Poche monete, e arrivi con le gambe riposate, anche se allo Scoglio il vecchio non attracca."
        requisiti: [monete >= 3]
        costo: 1
        esito:
          titolo: A remi
          testo: |
            Il vecchio morde le monete e le fa sparire nella camicia, poi rema di
            traverso parlando per tutto il tragitto. «Dico io, allo Scoglio non ci
            attracco. Mio cognato ci ha attraccato l'anno dopo l'incendio, e
            adesso vende castagne in Città Bassa e l'acqua non la guarda più.» Ti
            lascia fra i giunchi, a un tiro di sasso dalla Roccia, e riparte prima
            che tu sia sceso del tutto.
          effetti: { monete: -3, ferite: -0.5 }
          imposta: { roccia.barca: 1 }
          vai: roccia-di-wren
      - testo: "Riconoscere la faccia del vecchio"
        descrizione: "Quella mascella l'hai già vista in Città Bassa, dietro un carretto di castagne all'imbocco del Ponte del Pesce."
        quando: [origine.figlio-della-citta-bassa >= 1]
        costo: 1
        esito:
          titolo: Il cognato
          testo: |
            Gli dici che ha la stessa mascella del castagnaro all'imbocco del
            Ponte del Pesce, quello che d'inverno ti regalava le castagne
            bruciate. «Mio cognato» dice il vecchio. «Le bruciate le regalava
            perché nessuno le comprava, dico io.» Ti fa salire senza parlare di
            monete e ti lascia dove i giunchi si fanno fitti, a un tiro di sasso
            dalla Roccia.
          effetti: { ferite: -0.5 }
          imposta: { roccia.barca: 1 }
          vai: roccia-di-wren
      - testo: "Seguire le piste degli animali lungo la riva"
        descrizione: "Al Circolo ti hanno insegnato che le bestie scendono a bere per la via più corta."
        quando: [origine.figlio-del-circolo >= 1]
        costo: 0
        esito:
          titolo: Le piste degli animali
          testo: |
            Lasci il sentiero e segui le piste di volpi e tassi nel fango fra le
            canne, chinandoti a toccare un'orma come nel Bosco di Velthar. A metà
            mattina sbuchi su una spiaggetta di ghiaia davanti alla Roccia di
            Wren, e lì le piste si interrompono tutte nello stesso punto, con le
            ultime orme più profonde sul davanti, come di bestie che hanno puntato
            le zampe e girato sul posto.
          imposta: { roccia.barca: 0 }
          vai: roccia-di-wren

  # ------------------------------------------------------------ le stanze (ripetibili, tre a caso)
  - id: roccia-sentiero-nella-foschia
    immagine: ambientazione/roccia-di-wren
    titolo: Il sentiero nella foschia
    sommario: "Nella foschia del Torvessa, ai lati del sentiero, prendono forma figure che camminano al tuo passo."
    luogo: Roccia di Wren, lungo la riva
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 0, roccia.barca == 0]
    testo: |
      La foschia sale dal Torvessa e si richiude alle tue spalle, e del
      sentiero vedi soltanto i tre passi davanti agli stivali. Ai lati, fra i
      rovi, prendono forma figure alte quanto un uomo che camminano alla tua
      andatura e si fermano un attimo dopo di te, e la mano ti va da sola
      alla cintura.

      {resilienza Media} Sono foschia, e si muovono perché la sposti
      camminando. Ripetitelo, e lascia stare la cintura.

      Accanto al sentiero, piantato storto nel fango, c'è un palo con una
      tavola dipinta, *PESCA VIETATA*, e intorno una lenza con l'amo ancora
      innescato.
    opzioni:
      - testo: "Tenere gli occhi sul sentiero"
        descrizione: "Le figure sono foschia, e quello che ti serve vedere è il sentiero."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Un passo alla volta
          testo: |
            Abbassi lo sguardo e conti i sassi che affiorano, uno per passo. Le
            figure ti accompagnano per un tratto, poi una folata le stende
            sull'acqua, e quando rialzi la testa sei su una lingua di ghiaia che
            arriva fino alla Roccia di Wren, con la mascella indolenzita a forza
            di stringerla.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Dietro la figura
          testo: |
            Una delle figure scende verso il fiume e tu le vai dietro senza averlo
            deciso, finché l'acqua ti arriva alle ginocchia e la figura non c'è
            più. Torni sul sentiero bagnato e tremante, e ti ci vuole un pezzo per
            ritrovare il palo con la tavola.
          effetti: { tormento: 1 }
      - testo: "Tagliare fra i rovi, lontano dall'acqua"
        descrizione: "Lontano dalla riva la foschia è più rada, ma i rovi sono fitti."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Graffi
          testo: |
            Ti apri la strada con gli avambracci, e lontano dall'acqua la foschia
            si dirada e le figure non ti seguono. Dopo un'ora sbuchi su una lingua
            di ghiaia ai piedi della Roccia di Wren, con le maniche a brandelli e
            una spina nel pollice che toglierai stasera.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Nel roveto
          testo: |
            A metà del roveto ti ritrovi incastrato con una spina piantata nel
            collo, e ne esci all'indietro, lasciando ai rami un pezzo di camicia,
            nello stesso punto da cui eri entrato. Il taglio è superficiale, ma il
            collo sanguina come fa sempre il collo, e la manica con cui lo tamponi
            torna rossa.
          effetti: { ferite: 0.5 }
      - testo: "Seguire il fiume, anche se è più lungo"
        descrizione: "Allunghi di molto la strada, ma almeno sai dov'è l'acqua."
        costo: 2
        esito:
          titolo: Il giro del fiume
          testo: |
            Segui la riva, dove la foschia è più bassa e il fango arriva alla
            caviglia. Le figure ti accompagnano per un tratto e poi restano ferme
            dove il terreno sale. Arrivi ai piedi della Roccia dal lato della
            ghiaia quando la luce sul fiume è già cambiata due volte, con gli
            stivali pieni d'acqua.
          effetti: { profondita.roccia-di-wren: 1, ferite: 0.5 }

  - id: roccia-riva-dei-giunchi
    immagine: ambientazione/roccia-di-wren
    titolo: La riva dei giunchi
    sommario: "Fra la riva e la Roccia corre sopra i giunchi una passerella che nessuno ripara da anni."
    luogo: Roccia di Wren, la riva dei giunchi
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 0]
    testo: |
      Fra la riva e la Roccia di Wren c'è una distesa di giunchi in un'acqua
      nera e ferma. Ci passa sopra una passerella su pali che nessuno ripara
      dalle Notti Cucite, con metà delle assi marce e tre punti dove
      mancano.

      {origine apprendista-raschiatore} Un'asse marcia la riconosci dal
      suono, come sulle piattaforme della Cicatrice, e la prima risponde al
      tacco con un tonfo.

      All'imbocco c'è uno stivale da pescatore piantato nel fango, con
      dentro una rana che ti guarda senza curiosità.

      {natura Difficile} I giunchi si muovono dalle radici. Sotto l'acqua
      ferma passa qualcosa di lungo, e passa piano.
    opzioni:
      - testo: "Passare sulla passerella"
        descrizione: "Un'asse alla volta, saltando dove mancano."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Le assi buone
          testo: |
            Provi ogni asse con la punta dello stivale prima di caricarla, e dove
            manca salti. Una cede proprio mentre la lasci, e arrivi alla roccia
            con le ginocchia ancora piegate per un salto che non serve più, sotto
            lo sguardo immobile della rana.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Nel fango
          testo: |
            La terza asse cede sotto il tallone e ci vai dentro fino alla vita, in
            un fango che ti succhia gli stivali. Ti tiri fuori aggrappato a un
            palo, con una scheggia nel palmo, e torni a riva a svuotarti le scarpe
            accanto alla rana.
          effetti: { ferite: 0.5 }
      - testo: "Guadare fra i giunchi, tastando il fondo"
        descrizione: "Dove i giunchi hanno le radici più grosse, il fondo regge."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il fondo che regge
          testo: |
            Segui le radici più spesse, quelle che i giunchi allungano dove il
            fondo è di sasso, e l'acqua non ti sale oltre il ginocchio. Una biscia
            ti passa accanto e si allontana in fretta. Esci sulla roccia nera
            bagnato fino alle cosce, e l'acqua che strizzi dai calzoni è nera.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Il guado
          testo: |
            A metà del guado una cosa morbida ti scivola lungo il polpaccio e si
            stringe un momento intorno alla caviglia, ma quando guardi giù vedi
            soltanto acqua nera. Torni a riva senza averlo deciso, e quando ti
            togli lo stivale sulla caviglia c'è un segno rosso largo due dita, con
            i bordi troppo dritti per una radice.
          effetti: { tormento: 1 }
      - testo: "Fare il giro largo fino alla secca"
        descrizione: "Molto più a valle i giunchi diradano e il fondo diventa sabbia."
        costo: 2
        esito:
          titolo: La secca
          testo: |
            Scendi lungo la riva finché i giunchi diradano e sotto i piedi trovi
            la sabbia. L'acqua ti arriva alla vita ed è così fredda che a metà
            guado non senti più le dita dei piedi, e risali sull'isolotto dal lato
            opposto alla passerella con i denti che battono.
          effetti: { profondita.roccia-di-wren: 1, ferite: 0.5 }

  - id: roccia-la-porta
    immagine: ambientazione/roccia-di-wren
    titolo: La porta della capanna
    sommario: "In cima a una scala appoggiata alla roccia c'è la porta della capanna, con un chiavistello a testa d'uccello."
    luogo: Roccia di Wren, in cima alla scala
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 1]
    testo: |
      Contro la parete della Roccia è appoggiato un troncone di scala che
      arriva alla cengia sotto la capanna. Ai piedi, inchiodata alla pietra,
      una targa di bronzo verde di ossido dice che il luogo è chiuso per
      ordine dello *sciriffo* di Qir-Azel, nell'anno 145.

      {conoscenze-della-strada Facile} La Guardia ha buttato le scale nel
      fiume, cinque anni fa. Questa l'ha portata qualcun altro, e l'ha
      appoggiata con cura.

      La porta è di legno scuro gonfio d'umido, senza un segno di
      bruciatura, e il chiavistello è una testa d'uccello intagliata con il
      becco in giù, più tiepida dell'aria del fiume.
    opzioni:
      - testo: "Forzare la porta con la spalla"
        descrizione: "Il legno è gonfio e la porta è vecchia."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La spallata
          testo: |
            Alla terza spallata la porta si apre di colpo e per poco non finisci
            lungo disteso, con la polvere che ti scende nel colletto. Dietro di te
            la porta torna ad accostarsi da sola, piano, finché il chiavistello
            non fa clic.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Tre colpi
          testo: |
            Colpisci la porta con la spalla tre volte, e dall'interno arrivano tre
            colpi di risposta, con lo stesso intervallo dei tuoi. Ti ritrovi in
            fondo alla scala senza ricordarti di averla scesa, e la spalla
            comincia a farti male solo lì.
          effetti: { tormento: 1 }
      - testo: "Studiare il chiavistello a testa d'uccello"
        descrizione: "Un intagliatore di uccelli faceva anche le serrature a modo suo."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il becco in su
          testo: |
            La testa d'uccello gira su un perno nascosto nel collo, e quando il
            becco punta verso l'alto dentro la porta scatta un saliscendi di legno
            che la apre senza un cigolio. Il legno della testa è liscio come un
            manico usato per anni, e tiepido come se qualcuno l'avesse appena
            lasciato.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Il morso
          testo: |
            Giri la testa d'uccello a destra e a sinistra, e alla fine il becco si
            chiude sul tuo indice con uno scatto secco e ti lascia andare solo
            quando strappi via la mano, con un po' di pelle in meno. Ti succhi il
            dito in fondo alla scala, e la porta resta chiusa.
          effetti: { ferite: 0.5 }
      - testo: "Entrare dalla finestra sul retro"
        descrizione: "È stretta, e il davanzale è irto di schegge."
        costo: 2
        esito:
          titolo: Le schegge
          testo: |
            Giri attorno alla capanna tenendoti alla roccia fino a una finestra
            senza vetro, e ti ci infili di traverso, con il davanzale che ti
            lascia nei palmi una dozzina di schegge. Mentre te le togli con i
            denti ti accorgi che la porta è socchiusa, con il chiavistello già
            sollevato, e dalla cengia l'avevi vista chiusa.
          effetti: { profondita.roccia-di-wren: 1, ferite: 0.5 }

  - id: roccia-gli-uccelli-intagliati
    immagine: ambientazione/roccia-di-wren
    titolo: Gli uccelli intagliati
    sommario: "Al piano terra le pareti sono coperte di uccelli di legno, alcuni con tre occhi o il becco di metallo."
    luogo: Roccia di Wren, il piano terra della capanna
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 2]
    testo: |
      Il piano terra, più grande di quanto la capanna sembri da fuori, ha
      l'odore dolce del legno appena scolpito. Sulle pareti centinaia di
      corvi e gufi sono intagliati penna per penna, e fra loro ce ne sono di
      storti, con tre occhi oppure il becco di metallo. Fra i tavoli
      rovesciati sono sparsi scalpelli arrugginiti.

      Su uno scaffale vicino alla porta c'è una fila di passeri, ognuno con
      il cartellino del prezzo legato a una zampa.

      {origine mercante-dei-ponti} Per mestiere leggi il cartellino prima
      del passero, e il prezzo è da bancarella, più basso di quanto valga
      l'intaglio.
    opzioni:
      - testo: "Passare fra i tavoli senza toccare niente"
        descrizione: "Gli scalpelli sono dappertutto, e sono arrugginiti."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Fra gli scalpelli
          testo: |
            Scavalchi un tavolo e metti i piedi nei vuoti fra gli scalpelli senza
            far tintinnare il ferro. Gli uccelli restano dove sono, ma arrivi in
            fondo alla stanza con la sensazione precisa che quelli con tre occhi
            li abbiano fatti così per un motivo.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Ruggine
          testo: |
            Un tavolo rovesciato si sposta sotto il tuo peso e uno scalpello ti si
            pianta di traverso nel polpaccio, lasciandoti sulla pelle una macchia
            di ruggine che la manica allarga invece di togliere. Torni verso la
            porta zoppicando, e sullo scaffale la fila di passeri adesso è girata
            verso di te.
          effetti: { ferite: 0.5 }
      - testo: "Esaminare gli intagli"
        descrizione: "Un intagliatore non ne scolpisce tanti senza tenerne il conto."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le date
          testo: |
            Sotto ogni intaglio c'è una data incisa con la punta del coltello. I
            corvi e i gufi sono vecchi di vent'anni, mentre gli uccelli con tre
            occhi e con il becco di metallo sono tutti dell'anno 145, l'anno delle
            Notti Cucite, e sono girati verso le scale. Te lo segni a mente per
            raccontarlo in città.
          effetti: { profondita.roccia-di-wren: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Gli occhi
          testo: |
            Cominci a contare gli occhi degli uccelli storti e non riesci a
            smettere. Quando arrivi a trecento ti accorgi che stai muovendo le
            labbra e che fuori la luce è cambiata, ed esci a guardare il fiume più
            a lungo di quanto vorresti.
          effetti: { tormento: 1 }
      - testo: "Attraversare la stanza a occhi bassi"
        descrizione: "Tenere gli occhi sulle assi e contare i passi."
        costo: 2
        esito:
          titolo: A occhi bassi
          testo: |
            Tieni lo sguardo sulle assi e conti i passi a mezza voce, come da
            bambino per non pensare al buio. Arrivato a ventitré ti accorgi che
            conti anche il ticchettio che viene dalle pareti, e che il ticchettio
            va un poco più svelto di te.
          effetti: { profondita.roccia-di-wren: 1, tormento: 1 }

  - id: roccia-il-libro-di-schizzi
    immagine: ambientazione/roccia-di-wren
    titolo: Il libro di schizzi
    sommario: "Su un tavolo rimasto in piedi c'è un libro di schizzi, con studi di ali che diventano macchine."
    luogo: Roccia di Wren, il piano terra della capanna
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 2]
    testo: |
      Fra i tavoli rovesciati ce n'è uno solo in piedi, con sopra un libro
      di schizzi e una matita consumata fino a un pollice. Prima vengono
      studi di ali e di ossa, poi le ali diventano macchine, con
      articolazioni di metallo e filamenti di rame al posto dei tendini.

      {tecnologia Media} Le articolazioni le ha disegnate uno che sapeva
      come si muove un gomito di metallo, e le misure sono quelle di un
      corpo d'uomo.

      Nel margine di una pagina c'è una lista della spesa con la colla di
      pesce e il sale sottolineato due volte.
    opzioni:
      - testo: "Leggere gli appunti"
        descrizione: "La grafia è minuta e i calcoli sono lunghi."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: Le ali di rame
          testo: |
            Gli appunti sono calcoli di pesi e di leve, e secondo i numeri di Wren
            nessuna di queste ali avrebbe retto un uomo. Lui lo sapeva, perché
            accanto all'ultimo calcolo ha scritto *non serve che volino*. Strappi
            le pagine dei calcoli e le pieghi sotto la camicia, per farle leggere
            in Biblioteca.

            {accademiche Media} Ali che non devono volare sono fatte per essere
            viste, magari sopra un altare.
          effetti: { profondita.roccia-di-wren: 1, informazioni.segreto: 0.5 }
        fallimento:
          titolo: La matita
          testo: |
            Leggi una pagina dopo l'altra, e i calcoli cominciano ad avere senso,
            cosa che non ti piace affatto. Poi ti accorgi di avere in mano la
            matita di Wren e di aver aggiunto una piuma al margine di un disegno,
            venuta anche bene.
          effetti: { tormento: 1 }
      - testo: "Guardare soltanto i disegni"
        descrizione: "I disegni si capiscono anche senza leggere, e si dimenticano prima."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Facile }
        successo:
          titolo: Ali chiuse
          testo: |
            Sfogli guardando solo i disegni, e le ali di piume diventano ali di
            metallo pagina dopo pagina. L'ultima tavola è un'ala sola e finita,
            ombreggiata come una cosa vera. Chiudi il libro prima di chiederti a
            che cosa servisse e ci rimetti sopra la matita, parallela al dorso,
            come l'hai trovata.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: L'ultima tavola
          testo: |
            L'ultima tavola è un'ala disegnata così bene che ti sembra di sentirla
            frusciare. Chiudi il libro di colpo e resti con le mani sulla
            copertina finché il fruscio smette, e fuori la foschia si è alzata
            fino ai giunchi più alti.
          effetti: { tormento: 1 }
      - testo: "Chiudere il libro e portarlo via"
        descrizione: "Lo leggerai dopo, alla luce del giorno, se ne avrai ancora voglia."
        costo: 2
        esito:
          titolo: Il libro sotto la giacca
          testo: |
            Ti infili il libro sotto la giacca, e per il resto della salita lo
            senti tiepido sul fianco, come un animale che dorme. Quando lo riapri,
            più tardi, le pagine delle ali si sono incollate fra loro per l'umido
            e non c'è verso di separarle.
          effetti: { profondita.roccia-di-wren: 1, tormento: 1 }

  - id: roccia-le-scale-marce
    immagine: ambientazione/roccia-di-wren
    titolo: Le scale marce
    sommario: "Dal piano di sopra scende un'aria fredda, con un rumore regolare come di un attrezzo sul legno."
    luogo: Roccia di Wren, ai piedi delle scale
    area: roccia-di-wren
    ripetibile: true
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren == 3]
    testo: |
      In fondo alla stanza una scala di legno ripida sale al piano di sopra,
      con i gradini neri di umido. Ai piedi c'è un paio di pantofole di
      feltro allineate con la punta verso il primo gradino. Dall'alto scende
      un filo d'aria fredda e con l'aria un rumore leggero, *toc… toc… toc*,
      regolare come in una bottega.

      {atletica Media} I gradini sono marci al centro e ancora buoni contro
      il muro, e chi sale con il peso sulle braccia arriva in cima.
    opzioni:
      - testo: "Ascoltare il rumore prima di salire"
        descrizione: "A ogni colpo la scala vibra, e le orecchie possono dirti dove mettere i piedi."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il ritmo
          testo: |
            Resti immobile ai piedi della scala e ascolti. Il rumore viene sempre
            dallo stesso punto del piano di sopra, e a ogni colpo la scala vibra
            appena, meno sui gradini buoni, che conti uno per uno finché non li
            sai a memoria.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Il silenzio
          testo: |
            Ti fermi con un piede sul primo gradino per sentire meglio, e il rumore smette nello
            stesso momento. Aspetti a lungo che riprenda, poi torni fino alla porta camminando
            all'indietro, e solo sulla soglia lo senti ricominciare dallo stesso colpo in cui si
            era fermato.
          effetti: { tormento: 1 }
      - testo: "Salire tenendoti al muro"
        descrizione: "Se il peso lo regge il muro, ai gradini resta poco da reggere."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Contro il muro
          testo: |
            Sali di lato, con la schiena contro la parete e i palmi aperti sul
            legno, lasciando ai gradini solo la punta dei piedi. A metà rampa vedi
            in cima una tenda di tela grezza da cui viene il rumore, e arrivi
            lassù con le mani sporche di muffa fino ai polsi.
          effetti: { profondita.roccia-di-wren: 1 }
        fallimento:
          titolo: Il quarto gradino
          testo: |
            Il quarto gradino si sbriciola e la gamba ci passa attraverso fino al
            ginocchio, con il legno marcio che ti apre lo stinco. Ti tiri fuori
            mordendoti il labbro, mentre sopra di te il rumore continua senza
            perdere un colpo, e ti fasci la gamba con un pezzo di camicia.
          effetti: { ferite: 0.5 }
      - testo: "Salire con le pantofole di feltro"
        descrizione: "Sono più o meno della tua misura, e sul legno il feltro non si sente."
        costo: 2
        esito:
          titolo: Il feltro
          testo: |
            Ti togli gli stivali e infili le pantofole, che ti stanno quasi bene,
            e questo ti mette più a disagio del resto. Sui primi due gradini il
            feltro non fa rumore. Al terzo la scala geme, e il toc toc di sopra si
            interrompe per un momento prima di riprendere, un poco più lento.
          effetti: { profondita.roccia-di-wren: 1, tormento: 1 }

  # ------------------------------------------------------------ la carta della spedizione
  - id: roccia-l-airone
    immagine: ambientazione/roccia-di-wren
    titolo: L'airone
    sommario: "Ai piedi della Roccia c'è un airone fermo su un sasso, che non vola via quando ti avvicini."
    luogo: Roccia di Wren, nelle acque basse
    area: roccia-di-wren
    tipo: carta
    requisiti: [pista.sepolcro == 4]
    testo: |
      Su un sasso ai piedi della Roccia c'è un airone cenerino fermo su una
      zampa, l'unico uccello che hai visto da quando sei qui. Non vola via,
      e ti segue con un occhio giallo.

      Ha un'ala aperta a metà, steccata con due assicelle di legno
      intagliato e legata con un filo di rame ormai verde, girato tante
      volte che le penne ci sono cresciute intorno.

      {origine fuggiasco-di-ghoran} Davanti a quel filo, senza volerlo, ti
      guardi i polsi.

      {medicina Media} La steccatura l'ha fatta qualcuno che sapeva come si
      regge un osso rotto. Poi nessuno è tornato a toglierla.
    opzioni:
      - testo: "Liberarlo dal filo di rame"
        descrizione: "Il filo stringe da anni, e l'airone non ti conosce."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: Un volo basso
          testo: |
            Mentre ti avvicini gli parli a voce bassa di cose senza importanza, e
            lui ti lascia arrivare. Il filo si sbriciola fra le dita e le
            assicelle cadono in acqua. L'airone resta fermo ancora un momento, poi
            si alza in un volo basso e storto sopra il fiume, lontano dalla
            Roccia.
          effetti: { tormento: -0.5 }
        fallimento:
          titolo: Il becco
          testo: |
            L'airone ti lascia avvicinare fino a un braccio di distanza prima di
            scattare. Il becco ti apre il dorso della mano fino alle nocche, e
            quando ti tiri indietro lui è di nuovo immobile sul sasso, con la
            testa girata verso la capanna.
          effetti: { ferite: 0.5 }
      - testo: "Guardare dove guarda lui"
        descrizione: "L'airone tiene la testa girata verso la capanna."
        esito:
          titolo: La finestra di sopra
          testo: |
            Segui con lo sguardo il becco dell'airone fino a una finestra del
            piano di sopra. Dopo un po' dietro le imposte passa una luce bianca e
            fredda, all'altezza di un uomo in piedi, e ogni tanto si ferma per il
            tempo di un colpo di scalpello. Alla Pignatta, quando lo racconterai,
            ti offriranno da bere per sentirlo due volte.
          effetti: { informazioni.voce: 1 }
      - testo: "Avvicinarti come al Circolo"
        descrizione: "Al Circolo un uccello ferito si avvicina di fianco, con gli occhi bassi e le mani in vista."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Di fianco
          testo: |
            Entri nell'acqua bassa di fianco, dal lato dell'ala buona e con gli
            occhi bassi, come ti hanno insegnato nel Bosco di Velthar, e l'airone
            ti lascia arrivare fino a toccarlo. Il filo si sbriciola sotto le
            unghie e prendi le assicelle prima che cadano. Lui si alza in un volo
            basso e storto sopra il fiume, e le assicelle, intagliate a piccole
            piume, le lasci sul sasso.
          effetti: { tormento: -0.5 }
      - testo: "Togliere la steccatura come in infermeria"
        descrizione: "Al Velo hai tolto molte fasciature rimaste troppo a lungo, e un'ala è un braccio con le piume."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: mentale, abilita: [medicina], difficolta: Media }
        successo:
          titolo: La fasciatura vecchia
          testo: |
            Gli tieni ferma l'ala contro il corpo con il palmo aperto, come il
            braccio di un ricoverato che ha paura, e srotoli il filo un giro alla
            volta. Sotto, la pelle è segnata ma intera, e l'osso si era saldato da
            tempo. L'airone sopporta tutto con l'occhio fisso sulla capanna, poi
            si alza in un volo basso e storto sopra il fiume, lontano dalla
            Roccia.
          effetti: { tormento: -0.5 }
        fallimento:
          titolo: Il ricoverato
          testo: |
            Gli prendi l'ala con la sicurezza dell'infermeria, ma l'airone non è
            un ricoverato, e il becco ti apre il dorso della mano fino alle
            nocche. Lui torna immobile sul sasso con la testa girata verso la
            capanna, e tu ti fasci la mano da solo, stretta, come ti hanno
            insegnato.
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · 4 → 5
  - id: l-altare-del-cucitore
    immagine: bestiario/osric-wren-spettrale
    titolo: L'altare del Cucitore
    sommario: "Al piano di sopra c'è l'altare del Demone Uccello, e dietro l'altare c'è Osric Wren."
    luogo: Roccia di Wren, il piano di sopra
    area: roccia-di-wren
    requisiti: [pista.sepolcro == 4, profondita.roccia-di-wren >= 4]
    testo: |
      Al piano di sopra l'aria è più fredda di quella del fiume. Contro la
      parete di fondo c'è l'altare del Demone Uccello, un corpo d'uomo
      scolpito nel legno nero, con il volto allungato e il cranio coperto di
      piume dure. Dalle spalle si aprono due ali storte, per metà di piume
      intagliate e per metà di lamine di metallo, e nelle vene delle braccia
      corrono filamenti di rame. Davanti all'altare c'è un cuscino da
      inginocchiatoio ricamato a fiori, consumato al centro.

      {origine accolito-del-velo} Il cuscino è consumato come quelli su cui
      ti inginocchiavi da novizio.

      {magia Difficile} Il rame nelle braccia della statua è caldo di Mana, e
      il Mana sale fino alle ali.

      Il rumore di attrezzo smette di colpo. Senti un fruscio di piume e una
      lama che incide il legno, e dietro l'altare si forma la figura di un
      uomo sospeso a mezz'aria.

      Osric Wren ha la pelle bianca e trasparente, attraversata da filamenti
      di luce, gli occhi cuciti con un filo scuro a punti regolari e due
      tagli incrociati sul collo. Porta ancora il grembiule da intagliatore
      ridotto a strisce, e in mano tiene un coltello da intaglio fatto di
      luce.

      {armi-da-mischia Media} Tiene il coltello come un intagliatore, con il
      pollice sul dorso della lama, e taglierà di striscio, a colpi brevi.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "Il coltello è fatto di luce, ma la mano che lo tiene si muove da intagliatore."
        combattimento: spettro-del-cucitore
        vittoria:
          titolo: La cucitura che cede
          testo: |
            Il coltello di luce ti passa vicino alla faccia, il tuo colpo invece
            arriva, e Osric Wren si apre in fili di luce come una cucitura che
            cede. Poi gira verso di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Ti butti in acqua mentre la capanna crolla, e rientri in Città Bassa
            al tramonto con quelle parole in testa.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          vai: citta-bassa
        sconfitta:
          titolo: Sotto le travi
          testo: |
            Il coltello di luce ti entra nella spalla senza tagliare la stoffa, e
            cadi in ginocchio davanti all'altare. Osric Wren si china su di te
            così vicino che vedi i punti del filo sulle palpebre.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Poi si disfa nell'aria e la capanna crolla. Torni in Città Bassa di
            notte, zoppicando, con il freddo ancora nella spalla.
          effetti: { pista.sepolcro: 1, tormento: 1.5 }
          vai: citta-bassa
      - testo: "Esorcizzarlo"
        descrizione: "La Liturgia dell'Albero ha parole per i morti che restano, ma l'altare del Demone Uccello dà forza al Cucitore."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Le parole dell'Albero
          testo: |
            Dici l'Esorcismo con la voce più ferma che hai, e a ogni frase la luce
            che attraversa Osric Wren si fa più debole, finché si sfilaccia. Poi
            gira verso di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Salti dalla cengia nell'acqua bassa mentre la capanna crolla, e torni
            in Città Bassa al tramonto con quelle parole in testa.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          vai: citta-bassa
        fallimento:
          titolo: La parola sbagliata
          testo: |
            A metà della formula sbagli una parola, e Osric Wren passa attraverso
            l'altare. Il coltello di luce ti attraversa il petto senza toccare la
            pelle, lasciandoti dentro un freddo che dura.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Poi svanisce e la capanna crolla. Ti butti in acqua, e per tutta la
            strada ripeti la formula giusta, che adesso ti viene perfetta.
          effetti: { pista.sepolcro: 1, tormento: 1.5, ferite: 0.5 }
          vai: citta-bassa
      - testo: "Restare fermo e ascoltarlo fino all'alba"
        descrizione: "Lasciarlo parlare senza alzare le mani, con la testa salda fino all'alba."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Fino all'alba
          testo: |
            Ti siedi con la schiena contro il muro. Per tutta la notte Osric Wren
            ti spiega come si sceglie il legno per un'ala, con la voce che esce
            dai tagli del collo, e alla prima luce gira verso di te gli occhi
            cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            La luce del giorno lo scioglie, e dalla riva guardi la capanna
            crollare.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Una voce in prestito
          testo: |
            Resisti per qualche ora, poi la voce di Osric Wren comincia a
            sembrarti la tua e ti sorprendi ad annuire. All'alba gira verso di te
            gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Del crollo ricordi soltanto dei pezzi. Ti ritrovi sulla riva dei
            giunchi sporco di cenere, e in Città Bassa arrivi a mezzogiorno senza
            sapere che strada hai fatto.
          effetti: { pista.sepolcro: 1, tormento: 1.5 }
          vai: citta-bassa
      - testo: "Ascoltarlo e rispondergli"
        descrizione: "Finché gli rispondi lui parla e non taglia, anche se ogni risposta lascia un segno."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Conversazione da bottega
          testo: |
            Gli chiedi del legno e delle piume, e Osric Wren ti parla di noce e di
            colla di pesce fino all'alba. Allora gira verso di te gli occhi
            cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            La luce del giorno lo scioglie. Per giorni, in città, rispondi a
            domande sulla colla di pesce che non ti ha fatto nessuno.
          effetti: { pista.sepolcro: 1, racconto: 1, tormento: 1.5 }
          vai: citta-bassa
        fallimento:
          titolo: Le domande di Wren
          testo: |
            Dopo un po' le domande le fa lui, la larghezza delle tue spalle e
            quanto pesi, e tu rispondi senza poterti fermare. All'alba gira verso
            di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Esci fra i giunchi da una parete aperta dal crollo e torni in Città
            Bassa ripetendoti a mezza voce le due misure che servono per un'ala.
          effetti: { pista.sepolcro: 1, tormento: 2 }
          vai: citta-bassa
      - testo: "Dare fuoco alla capanna e scappare"
        descrizione: "Il pavimento è pieno di trucioli e la Guardia l'ha già fatto una volta, ma ti scotterai."
        esito:
          titolo: Il secondo incendio
          testo: |
            Batti l'acciarino sui trucioli e il fuoco corre basso verso l'altare,
            mentre Osric Wren resta fermo. Ti butti giù per le scale scottandoti
            le mani sulla ringhiera, e la sua voce ti segue.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Dalla riva guardi la capanna bruciare, e rientri in Città Bassa a sera
            con le mani fasciate e il fumo nei capelli.
          effetti: { pista.sepolcro: 1, ferite: 1, tormento: 1 }
          vai: citta-bassa
      - testo: "Dire sul suo altare la preghiera per i morti"
        descrizione: "Al Velo hai imparato la preghiera per i morti che restano, e qui ogni parola costa il doppio."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: mentale, abilita: [accademiche, resilienza], difficolta: Difficile }
        successo:
          titolo: La preghiera dei novizi
          testo: |
            Ti inginocchi sul cuscino ricamato e dici la preghiera per i morti
            come la dicevate in fila nel dormitorio. A ogni strofa la luce che
            attraversa Osric Wren si fa più debole, finché gira verso di te gli
            occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Salti dalla cengia nell'acqua mentre la capanna crolla, con le
            ginocchia indolenzite come dopo una veglia.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          pe: { resilienza: 5 }
          vai: citta-bassa
        fallimento:
          titolo: La strofa che manca
          testo: |
            Alla seconda strofa non ti torna la parola che viene dopo, e Osric
            Wren passa attraverso l'altare. Il coltello di luce ti attraversa il
            petto lasciandoti dentro un freddo che dura.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Ti butti in acqua mentre la capanna crolla, e la parola che mancava ti
            torna in mente sulla strada di casa, quando non serve più.
          effetti: { pista.sepolcro: 1, tormento: 1.5, ferite: 0.5 }
          vai: citta-bassa
      - testo: "Spezzare il Mana che sale dall'altare"
        descrizione: "Il rame porta il Mana alle ali, e una corrente, all'Accademia lo insegnano, si spezza dove è più sottile."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [magia], difficolta: Difficile }
        successo:
          titolo: Il filo di rame
          testo: |
            Metti due dita sul rame della statua, dove si stringe sopra il polso,
            e spingi indietro il Mana finché il filo diventa nero. Osric Wren si
            apre in fili di luce a un palmo dalla tua faccia e gira verso di te
            gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Ti butti in acqua mentre la capanna crolla, con i polpastrelli
            bruciati.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          pe: { magia: 5 }
          vai: citta-bassa
        fallimento:
          titolo: La corrente
          testo: |
            Cerchi il punto più sottile del rame, ma la corrente è più forte di
            ogni cristallo dell'aula e ti passa nel braccio. Ti ritrovi in
            ginocchio davanti all'altare, con Osric Wren chino su di te.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Poi si disfa nell'aria e la capanna crolla, e torni in città di notte
            con il braccio che formicola.
          effetti: { pista.sepolcro: 1, tormento: 1.5 }
          vai: citta-bassa
      - testo: "Parlargli dei suoi uccelli come di merce buona"
        descrizione: "I passeri di sotto hanno ancora il cartellino, e un artigiano parla volentieri con chi stima il suo lavoro."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, percezione], difficolta: Media }
        successo:
          titolo: Il prezzo giusto
          testo: |
            Gli dici che i suoi passeri li vendeva troppo poco, e Osric Wren
            abbassa il coltello e parla per tutta la notte di legni stagionati.
            All'alba tace e gira verso di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            La luce del giorno lo scioglie. Per giorni, in città, stimi il legno
            di ogni bancone su cui appoggi i gomiti.
          effetti: { pista.sepolcro: 1, racconto: 1, tormento: 1.5 }
          pe: { persuasione: 5 }
          vai: citta-bassa
        fallimento:
          titolo: Il cliente
          testo: |
            Gli parli del prezzo dei suoi passeri, e lui, attento come un
            artigiano, ti chiede la larghezza delle tue spalle e quanto pesi.
            Rispondi prima di poterti fermare. All'alba gira verso di te gli occhi
            cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Esci fra i giunchi da una parete aperta dal crollo, ripetendoti le tue
            misure come un ordine da consegnare.
          effetti: { pista.sepolcro: 1, tormento: 2 }
          vai: citta-bassa
      - testo: "Tenere duro fino all'alba, come nei recinti"
        descrizione: "A Ghoran hai passato notti lunghe senza muoverti, e qui serve un corpo che regga fino all'alba."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza], difficolta: Difficile }
        successo:
          titolo: Una notte di più
          testo: |
            Ti siedi con la schiena al muro e lasci che il freddo ti salga nelle
            ossa. Osric Wren parla per tutta la notte, e tu arrivi al mattino
            un'ora alla volta, come nei recinti di Ghoran. Alla prima luce gira
            verso di te gli occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            La luce del giorno lo scioglie, e la capanna crolla.
          effetti: { pista.sepolcro: 1, racconto: 1 }
          pe: { resistenza: 5 }
          vai: citta-bassa
        fallimento:
          titolo: Il freddo
          testo: |
            Resisti per qualche ora con la schiena al muro, finché la voce di
            Osric Wren comincia a sembrarti la tua. All'alba gira verso di te gli
            occhi cuciti.

            «La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La
            Regina tornerà.»

            Del crollo ricordi soltanto dei pezzi. Ti ritrovi sulla riva dei
            giunchi sporco di cenere, e in Città Bassa arrivi a mezzogiorno senza
            sapere che strada hai fatto.
          effetti: { pista.sepolcro: 1, tormento: 1.5 }
          vai: citta-bassa
