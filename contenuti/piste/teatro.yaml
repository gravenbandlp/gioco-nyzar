# La pista del Teatro (pista.teatro 0 → 2): la Promessa dell'Arpia al Teatro delle Meraviglie di Belcanto.
# Entrata nella compagnia (teatro.ruolo: 1 attore, 2 costumista o scenografo, 3 aiutante di scena), prove
# ripetibili che fanno salire prove.arpia, la prima, le repliche, e la carta di Orazio che cerca attori in strada.
# Nel copione dell'opera Silver Pond è diventato Valpeltro, la taverna Empty Glass il Fiasco Asciutto.
# Le opzioni per ruolo stanno in storylet con `mostra`, che nasconde quelle degli altri ruoli; nelle prove
# la scena cambia con l'avanzare di prove.arpia (prima < 1, poi fra 1 e 2, poi da 2 in su).
storylet:
  # ------------------------------------------------------------ 0 → 1 · entrare nella compagnia
  - id: teatro-di-belcanto
    presso: teatro-delle-meraviglie
    immagine: personaggi/orazio-belcanto
    titolo: Il Teatro delle Meraviglie
    sommario: "La prima della Promessa dell'Arpia è saltata per la razzia, e Orazio Belcanto cerca cittadini da mettere in scena."
    luogo: Teatro delle Meraviglie di Belcanto, Quartieri Alti
    area: quartieri-alti
    requisiti: [pista.teatro == 0, prologo == 0]
    testo: |
      Il Teatro delle Meraviglie occupa un intero lato della piazza, con una
      fila di attori di pietra sul cornicione, uno dei quali ha perso da
      parecchi inverni la mano che reggeva la maschera. Sul portone, sopra la
      data della prima della *Promessa dell'Arpia*, la sera dopo il Festival, è
      incollata di traverso una striscia di carta con la parola *rinviata*.

      Nel ridotto, che odora di cera d'api, Orazio Belcanto scende
      trotterellando dalla scala in una giacca color prugna, con un anello a
      ogni dito e la voce un'ottava più in alto del necessario.

      «Anima cara, benvenuta nel tempio della scena!» Ti prende la mano fra le
      sue, e gli anelli sono freddi. «Gli orchi mi hanno rubato la prima, e io
      me la riprendo. La Promessa dell'Arpia è un'opera in cui recita la città
      intera, gente comune come te. Mi servono attori e mani da sarta, e
      braccia per le funi. Per gli attori valgono i canoni estetici che
      stabilisce l'Arte in persona.» Intanto ti sta misurando le spalle.

      {espressivita Facile} Ogni frase gli esce già rivolta alla galleria, e
      anche davanti a una persona sola recita piuttosto bene.

      {origine rampollo-dei-quartieri-alti} In questo ridotto ci venivi da
      bambino, e Orazio ti guarda la faccia più a lungo delle spalle, cercando
      di ricordarsi in quale palco ti ha già visto.
    opzioni:
      - testo: "Farti prendere come attore"
        descrizione: "Orazio ti girerà intorno come a un cavallo in fiera, e in caso c'è posto fra le comparse."
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: I canoni estetici
          testo: |
            Orazio ti fa salire sul palco, ti alza il mento con un dito inanellato
            e decreta che il profilo sinistro è accettabile e il destro andrà
            tenuto in ombra. Dici una battuta del secondo atto alla galleria vuota
            come se fosse piena, e a metà ti accorgi che ti piace.

            «Farai un avventuriero, anima mia» dice Orazio battendo le mani. «Il
            secondo, quello che il pubblico si ricorda di più.»
          imposta: { teatro.ruolo: 1 }
          pe: { espressivita: 5 }
          effetti: { pista.teatro: 1 }
        fallimento:
          titolo: Fra le comparse
          testo: |
            A metà della battuta ti si secca la bocca, e la seconda metà esce con
            una voce che non sapevi di avere. Orazio resta un po' a occhi chiusi,
            con le mani giunte sotto il mento.

            «L'Arte ha parlato» dice alla fine. «Però nel terzo atto mi mancano
            due orchi e un minatore svenuto.» Ti mette in mano una maschera di
            cartapesta che puzza ancora di colla.
          imposta: { teatro.ruolo: 3 }
          pe: { espressivita: 3 }
          effetti: { pista.teatro: 1, scandalo: 0.5 }
      - testo: "Offrirti per i costumi e le scene"
        descrizione: "Le ali della regina arpia si inceppano da giorni, e chi capisce perché si prende la sartoria."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Le ali della regina
          testo: |
            In sartoria, su un manichino senza testa, sono appese due ali di piume
            nere montate su stecche di canna, che tirando il cordino si bloccano
            sempre a metà. Trovi una stecca incollata al rovescio e la giri, e le
            ali si aprono fino in fondo con un fruscio lungo.

            Orazio emette un piccolo grido. «Costumi e scenografie, anima mia! Da
            oggi questa stanza è tua, e anche la colla.»
          imposta: { teatro.ruolo: 2 }
          pe: { tecnologia: 5 }
          effetti: { pista.teatro: 1 }
        fallimento:
          titolo: Il cordino
          testo: |
            Tiri il cordino con troppa decisione, e un'ala si apre di colpo e ti
            frusta la faccia. Orazio controlla prima le ali e poi te. «Le ali sono
            salve. La sartoria vuole la mano leggera, anima cara. Le funi del
            sipario invece non si offendono di niente.» Ti affida al vecchio
            macchinista, che ti porge un paio di guanti di cuoio troppo grandi.
          imposta: { teatro.ruolo: 3 }
          pe: { percezione: 3 }
          effetti: { pista.teatro: 1, scandalo: 0.5 }
      - testo: "Offrirti come aiutante di scena"
        descrizione: "Funi da tirare e fondali da spostare al buio, e basta presentarsi in orario."
        esito:
          titolo: Le funi
          testo: |
            Orazio ti affida al vecchio macchinista, un uomo curvo con le dita
            storte dalle corde, che ti mostra le botole e la ruota del sipario. Su
            ogni fune è legato un nastrino colorato. «Il rosso è il sipario» dice.
            «Il nero non lo tocchi, perché tiene su il lampadario.» Ti fa provare
            la ruota due volte, e alla seconda annuisce senza dire niente.
          imposta: { teatro.ruolo: 3 }
          pe: { atletica: 3 }
          effetti: { pista.teatro: 1 }
      - testo: "Ricordargli il palco della tua famiglia"
        descrizione: "La tua famiglia ha un palco in terza fila, e Orazio i palchi paganti li conosce a memoria."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il palco in terza fila
          testo: |
            Gli dici il nome della tua famiglia, e Orazio porta le mani al petto.
            «Il palco in terza fila, quello con la tenda rammendata!» Si ricorda
            che da bambino al secondo atto dormivi con la guancia sulla balaustra,
            e che lui lo prendeva come un giudizio sull'opera.

            Poi decreta che hai il profilo sinistro di tua nonna. «Farai un
            avventuriero, anima mia, quello che il pubblico si ricorda di più.»
          imposta: { teatro.ruolo: 1 }
          pe: { espressivita: 5 }
          effetti: { pista.teatro: 1 }
      - testo: "Dire la battuta come una preghiera della sera"
        descrizione: "Al Velo hai imparato a farti sentire a bassa voce in fondo alla navata, che è come una galleria."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [accademiche, empatia], difficolta: Media }
        successo:
          titolo: Fino in galleria
          testo: |
            Chiudi gli occhi un momento, come prima della preghiera della sera, e
            dici la battuta senza alzare la voce, con tutte le consonanti al loro
            posto, fino all'ultima fila della galleria. Orazio resta fermo in
            platea con le mani giunte sotto il mento.

            «Anima mia, chi ti ha insegnato a parlare così?» chiede, senza
            aspettare la risposta. «Farai un avventuriero, quello che il pubblico
            si ricorda di più.»
          imposta: { teatro.ruolo: 1 }
          pe: { espressivita: 5 }
          effetti: { pista.teatro: 1 }
        fallimento:
          titolo: Il tono della navata
          testo: |
            La battuta ti esce piana e dolce, con il tono che si usa per benedire
            i malati, e Orazio si siede in terza fila e lascia calare le palpebre.
            «Bellissimo e funebre, anima cara. L'avventuriero deve far venire
            voglia di partire, e a me è venuta voglia di confessarmi.» Ti mette in
            mano una maschera d'orco di cartapesta, per il terzo atto.
          imposta: { teatro.ruolo: 3 }
          pe: { espressivita: 3 }
          effetti: { pista.teatro: 1, scandalo: 0.5 }
      - testo: "Smontare le ali come un congegno dell'Accademia"
        descrizione: "All'Accademia prima si disegna il congegno e poi lo si tocca, e due ali di canna hanno pochi pezzi."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il disegno sul copione
          testo: |
            Sul retro di un copione vecchio disegni le ali stecca per stecca,
            sotto lo sguardo sempre più inquieto di Orazio. Al terzo schizzo trovi
            la stecca incollata al rovescio senza averla ancora toccata. La giri,
            e le ali si aprono fino in fondo con un fruscio lungo.

            Orazio emette un piccolo grido. «Costumi e scenografie, anima mia! Da
            oggi questa stanza è tua, e anche la colla.»
          imposta: { teatro.ruolo: 2 }
          pe: { tecnologia: 5 }
          effetti: { pista.teatro: 1 }
        fallimento:
          titolo: Troppi schizzi
          testo: |
            Mentre riempi il retro di un copione di ali disegnate da tre lati,
            Orazio si stanca di aspettare e tira il cordino da solo, e l'ala ti
            strappa il foglio di mano. «La sartoria vuole mani, anima cara, più
            che pensieri. Le funi del sipario invece non chiedono di essere
            capite.» Ti affida al vecchio macchinista, che ti porge un paio di
            guanti di cuoio troppo grandi.
          imposta: { teatro.ruolo: 3 }
          pe: { percezione: 3 }
          effetti: { pista.teatro: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ prove ripetibili · prove.arpia
  - id: prove-al-teatro
    presso: teatro-delle-meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    titolo: Le prove della Promessa
    sommario: "Ogni pomeriggio la compagnia di riserva prova la Promessa dell'Arpia, diretta da Orazio dal palco e dalla platea."
    luogo: Teatro delle Meraviglie di Belcanto, durante le prove
    area: quartieri-alti
    ripetibile: true
    # Mauro Scrocco fa Sigor finché la Caserma non si muove contro la Pignatta (pista.pelle 5);
    # da lì in poi vale la variante prove-al-teatro-senza-mauro.
    requisiti: [pista.teatro == 1, pista.pelle < 5]
    mostra: 2
    testo: |
      Le prove cominciano dopo pranzo, con il sipario tirato a metà e in terza
      fila una donna delle pulizie che non perde una scena. Orazio fa Asvorko,
      il padrone avaro delle miniere, e dirige gli altri anche a metà di una
      battuta. Grusk fa l'operaio Rolan e Rilla Tamberlo la segretaria Mary,
      mentre l'oste Sigor è Mauro Scrocco della Pignatta Grassa. La regina
      arpia è Violante, la prima attrice.

      {origine figlio-della-citta-bassa} Chi è cresciuto nei vicoli sa che gli
      abbracci di Mauro Scrocco si pagano dopo, con gli interessi.

      «Anime mie, dall'inizio con sentimento!» dice Orazio battendo le mani.
    opzioni:
      # --- attore
      - immagine: personaggi/mauro-scrocco
        testo: "Provare la scena della taverna con Mauro Scrocco"
        descrizione: "Nel secondo atto l'oste Sigor assolda gli avventurieri al Fiasco Asciutto, e Mauro lo recita fin troppo bene."
        requisiti: [teatro.ruolo == 1, prove.arpia < 1]
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: Il tunnel sotto le botti
          testo: |
            Mauro ti abbraccia appena entri in scena, perché a suo dire Sigor
            abbraccia tutti, e sa d'aglio fino alla terza fila. Al tunnel di
            contrabbando si dilunga, spiegando che l'entrata va messa sotto le
            botti dell'aceto, che i cani delle guardie non annusano volentieri.

            «Mauro, caro, meno dettagli sul tunnel» dice Orazio dalla platea. «Si
            parla di tutto e non si dice nulla» risponde Mauro.
          effetti: { prove.arpia: 1 }
          pe: { espressivita: 3 }
        fallimento:
          titolo: Aglio
          testo: |
            L'abbraccio di Sigor dura più del previsto, e quando Mauro ti lascia
            andare hai dimenticato la battuta. Lui intanto continua a parlare del
            tunnel per conto suo, aggiungendo la larghezza delle travi e l'orario
            dei cambi della guardia, e Orazio vi fa ripetere la scena tre volte.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/grusk
        testo: "Dare la battuta a Grusk"
        descrizione: "Grusk si presenta ancora come Grusk invece che come Rolan, e Orazio ti chiede di provare con lui."
        requisiti: [teatro.ruolo == 1, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Il nastro rosso
          testo: |
            Fai tu la parte di Asvorko, e Grusk ti viene incontro dalla quinta con
            il copione arrotolato in pugno. «Signor Asvorko, Grusk è contento
            di...» Lo fermi e gli leghi al polso un nastro rosso come la sua
            carriola. Da allora ogni volta che vede il nastro dice Rolan, e alla
            fine della prova si presenta come Rolan alla donna delle pulizie, che
            gli risponde con un inchino.
          effetti: { prove.arpia: 1 }
          pe: { empatia: 3 }
        fallimento:
          titolo: Grusk e Grusk
          testo: |
            Alla quinta volta che Grusk si chiama Grusk perdi la pazienza, e lui
            si offende a modo suo, chiamandoti Grusk per tutta la scena con grande
            dignità. Dalla platea Orazio si massaggia le tempie. «Due Grusk. Il
            copione ne prevede uno, e mi pareva già abbondante.»
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/violante
        testo: "Provare il confronto nel nido delle arpie"
        descrizione: "Nel terzo atto devi far vedere ad Asvorko il suo errore, mentre Orazio piange lacrime vere."
        requisiti: [teatro.ruolo == 1, prove.arpia >= 2]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Lacrime vere
          testo: |
            Orazio si butta in ginocchio, con gli anelli che battono sulle assi, e
            stira su quattro pause il suo «Ho commesso un errore imperdonabile»,
            con le lacrime che gli tracciano due righe pulite nel cerone. Tu reggi
            la battuta senza ridere, anche quando si soffia il naso nel mantello
            della regina, e uscendo di scena Violante ti strizza l'occhio.
          effetti: { prove.arpia: 1 }
          pe: { persuasione: 3 }
        fallimento:
          titolo: La risata sbagliata
          testo: |
            Quando Orazio si soffia il naso nel mantello della regina ti scappa
            una risata dal naso. Lui si alza offeso, poi ti perdona con un gesto
            largo, da sovrano. «Anche le risate sono emozioni» dice, puntandoti
            contro un dito inanellato. «Domani però piangi tu, e io guardo.»
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/rilla-tamberlo
        testo: "Ripassare la parte nel ridotto"
        descrizione: "Nel ridotto si ripassa in pace, quando non arriva nessuno."
        requisiti: [teatro.ruolo == 1]
        esito:
          titolo: La segretaria Mary
          testo: |
            Nel ridotto ti raggiunge Rilla Tamberlo, che vuole provare Mary con
            qualcuno che non sia Orazio. Si siede sul tavolo con le gambe
            accavallate. «Signor Asvorko, ho bisogno di parlare con lei» dice,
            come se confessasse un omicidio. Ti chiede se è troppo, e prima che tu
            risponda decide da sola che Mary è una segretaria e lei la fa
            interessante.
          effetti: { prove.arpia: 0.5 }
          pe: { espressivita: 1 }
      # --- costumista o scenografo
      - immagine: personaggi/violante
        testo: "Sistemare le ali addosso a Violante"
        descrizione: "Sul manichino le ali reggono, ma addosso a un'attrice che cammina e si gira è un altro discorso."
        requisiti: [teatro.ruolo == 2, prove.arpia < 1]
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Le ali addosso
          testo: |
            Cuci le cinghie delle ali sotto il mantello di piume e nascondi il
            cordino in una manica. Violante alza le braccia e le ali si aprono
            piano insieme alla sua voce. «Al Festival ero pronta» dice, mentre
            stringi una fibbia. «Poi sono arrivati gli orchi, e io ho dormito tre
            notti di fila.»
          effetti: { prove.arpia: 1 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: La porta stretta
          testo: |
            Appena Violante prova l'uscita di scena, le ali si aprono da sole nel
            passaggio della quinta e la inchiodano allo stipite, con le braccia
            larghe. Lei ride così forte che le piume tremano, e Orazio arriva di
            corsa con una mano sul petto, giurando che il cuore gli si è fermato.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/grusk
        testo: "Costruire il golem di cartapesta"
        descrizione: "Il golem di pietra del terzo atto per ora è un mucchio di giornali e colla, e Grusk offre la carriola."
        requisiti: [teatro.ruolo == 2, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il golem sulla carriola
          testo: |
            Monti il golem sulla carriola di Grusk, con uno sportello sul retro, e
            Grusk ci si infila dentro e spinge. Il golem avanza ondeggiando con un
            ruggito che rimbomba nella cartapesta, e da dentro si sente anche
            Grusk che ride. Lo dipingi di grigio pietra, lasciando sul fondo una
            striscia rossa perché Grusk vuole riconoscere la sua carriola.
          effetti: { prove.arpia: 1 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: Un golem educato
          testo: |
            La cartapesta asciuga storta, e il golem si piega in avanti come in un
            inchino. Hai le dita appiccicate fino a sera e la colla l'hai
            ricomprata di tasca tua. «Un golem con le buone maniere» dice Orazio,
            accarezzandogli la testa storta. «In questa città se ne vedono pochi.»
          effetti: { prove.arpia: 0.5, monete: -1 }
      - immagine: personaggi/rilla-tamberlo
        testo: "Vestire Rilla per la parte di Mary"
        descrizione: "Rilla vuole lo spacco e Orazio una segretaria, e l'abito deve andar bene a entrambi."
        requisiti: [teatro.ruolo == 2, prove.arpia >= 2]
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Lo spacco nelle pieghe
          testo: |
            Le proponi un abito accollato, grigio da ufficio, con lo spacco
            nascosto fra le pieghe, che si apre solo quando Mary si siede sulla
            scrivania di Asvorko. Rilla accetta mordendosi una ciocca di capelli.
            Orazio se ne accorge solo alla prova generale e recita la scena rosso
            fino alle orecchie, mentre la donna delle pulizie applaude.
          effetti: { prove.arpia: 1 }
          pe: { persuasione: 3 }
        fallimento:
          titolo: Le forbici di Rilla
          testo: |
            Le fai un abito che piace a Orazio, e il giorno dopo Rilla si presenta
            con uno spacco alto fino all'anca, fatto di notte con le forbici della
            cucina. Orazio se la prende con te, perché con lei non osa, e passi il
            pomeriggio a rammendare mentre Rilla ti dice che stai rovinando
            l'Arte.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/mauro-scrocco
        testo: "Dipingere il fondale della miniera"
        descrizione: "Il fondale del secondo atto mostra le miniere di Valpeltro e il tunnel di contrabbando, e qualcuno guarda sempre."
        requisiti: [teatro.ruolo == 2]
        esito:
          titolo: Consigli dall'oste
          testo: |
            Passi il pomeriggio sulla tela stesa in palcoscenico, a dipingere le
            gallerie di Valpeltro in ocra e nero. Mauro Scrocco si ferma alle tue
            spalle con le mani dietro la schiena e ti fa notare, con una certa
            competenza, che una botola di contrabbando va messa sotto la scala
            della cantina, dove nessuno spazza. Poi ti abbraccia e se ne va
            canticchiando, lasciandoti sulla camicia un odore di assenzio.
          effetti: { prove.arpia: 0.5 }
          pe: { percezione: 1 }
      # --- aiutante di scena
      - immagine: personaggi/orazio-belcanto
        testo: "Aprire il sipario sull'entrata di Orazio"
        descrizione: "Il sipario deve aprirsi esattamente sul gesto di Orazio, perché un attimo di ritardo offende l'Arte."
        requisiti: [teatro.ruolo == 3, prove.arpia < 1]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Tre inchini
          testo: |
            Tieni gli occhi sulla mano di Orazio dalla fessura della quinta, e
            quando il braccio si alza giri la ruota. Il sipario si apre senza uno
            strappo su Orazio già in posa, che a fine scena se lo fa riaprire per
            tre inchini alla platea vuota, mentre la donna delle pulizie applaude
            con le mani bagnate.
          effetti: { prove.arpia: 1 }
          pe: { atletica: 3 }
        fallimento:
          titolo: Troppo presto
          testo: |
            Giri la ruota un momento prima, e il sipario si apre su Orazio che si sta
            sistemando le calze, con un piede sulla sedia di Asvorko, mentre la fune ti
            brucia i palmi. Lui abbassa il piede con dignità e attacca la battuta. Dopo
            la prova ti dice che la puntualità è una forma di rispetto, e ti guarda le
            mani.
          effetti: { prove.arpia: 0.5, ferite: 0.5 }
      - immagine: personaggi/grusk
        testo: "Fare l'orco nel terzo atto"
        descrizione: "Gli orchi del terzo atto sono comparse in maschera, ridipinte dopo la razzia di un verde più tenue, per delicatezza."
        requisiti: [teatro.ruolo == 3, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: fisico, abilita: [acrobazia, rissa], difficolta: Facile }
        successo:
          titolo: Il ringhio della nonna
          testo: |
            Prima della scena Grusk ti insegna a ringhiare dal fondo della pancia,
            come faceva sua nonna quando i bambini rubavano il pane. Il ringhio ti
            esce da un posto che non sapevi di avere, e gli avventurieri fanno un
            passo indietro che il copione non prevedeva. Cadi a terra al momento
            giusto, e Grusk dalla quinta alza il pollice.
          effetti: { prove.arpia: 1 }
          pe: { acrobazia: 3 }
        fallimento:
          titolo: L'orco e il sipario
          testo: |
            La maschera ti scivola sugli occhi a metà della zuffa, e ti ritrovi
            avvolto nel sipario di velluto rosso con le gambe che scalciano fuori.
            Orazio decide che l'orco ha lottato con coraggio, ma ti presta un
            nastro color prugna per legare la maschera più stretta.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/rilla-tamberlo
        testo: "Suggerire dalla buca"
        descrizione: "Il suggeritore ha perso la voce, e dalla buca davanti al palco si vedono soprattutto caviglie."
        requisiti: [teatro.ruolo == 3, prove.arpia >= 2]
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Facile }
        successo:
          titolo: Caviglie
          testo: |
            Tieni il dito sul copione e la testa bassa, sussurrando «Rolan» a
            Grusk ogni volta che apre bocca, anche quando Rilla si siede sulla
            scrivania proprio sopra la buca. Ne esci con il collo indolenzito, e
            Orazio, che non ti ha sentito nemmeno una volta, ti stringe la mano
            fino a lasciarti nel palmo il segno del sigillo del Teatro.
          effetti: { prove.arpia: 1 }
          pe: { percezione: 3 }
        fallimento:
          titolo: La scena sbagliata
          testo: |
            Quando Rilla ti lascia cadere un fazzoletto in testa perdi il segno e
            suggerisci a Mauro la battuta della scena sbagliata. Lui la dice con
            convinzione, e Sigor accetta la proposta della regina arpia. Violante
            gli risponde con una battuta inventata, e la scena va avanti per conto
            suo finché Orazio vi fa ricominciare dall'atto secondo.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/violante
        testo: "Spazzare il palco e portare l'acqua"
        descrizione: "Qualcuno deve pur farlo, e intanto si sente tutto quello che si dice nelle quinte."
        requisiti: [teatro.ruolo == 3]
        esito:
          titolo: Dalle quinte
          testo: |
            Spazzi il palco fra una scena e l'altra e porti la brocca dell'acqua
            in quinta. Violante beve dal tuo bicchiere senza chiedere e, guardando
            la compagnia che litiga, ti dice che la sua regina arpia è più gentile
            della mezza compagnia che la guarda dalle quinte.
          effetti: { prove.arpia: 0.5 }
          pe: { resistenza: 1 }

  # Variante: Mauro non viene più alle prove, e Sigor lo fa il vecchio macchinista.
  - id: prove-al-teatro-senza-mauro
    presso: teatro-delle-meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    titolo: Le prove della Promessa
    sommario: "Ogni pomeriggio la compagnia di riserva prova la Promessa dell'Arpia, diretta da Orazio dal palco e dalla platea."
    luogo: Teatro delle Meraviglie di Belcanto, durante le prove
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.teatro == 1, pista.pelle >= 5]
    mostra: 2
    testo: |
      Le prove cominciano dopo pranzo, e in terza fila una donna delle
      pulizie che non perde una scena. Orazio fa Asvorko e dirige gli altri
      anche a metà di una battuta. Grusk lo spazzino fa l'operaio Rolan e
      Rilla Tamberlo la segretaria Mary. Mauro Scrocco alle prove non si
      presenta più, e l'oste Sigor lo fa il vecchio macchinista, che le
      battute le sa già. La regina arpia è Violante, la prima attrice.

      {conoscenze-della-strada Media} Della Pignatta Grassa, in questi
      giorni, in Città Bassa si parla a mezza voce.

      Orazio batte le mani. «Dall'inizio, anime mie. Con sentimento!»
    opzioni:
      # --- attore
      - testo: "Provare la scena della taverna con il vecchio macchinista"
        descrizione: "Nel secondo atto l'oste Sigor assolda gli avventurieri, e il vecchio macchinista lo recita badando ancora alle funi."
        requisiti: [teatro.ruolo == 1, prove.arpia < 1]
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: Il tunnel sotto le botti
          testo: |
            Il vecchio macchinista dice le battute di Sigor a voce bassa, come se
            in platea ci fosse qualcuno da non svegliare, e al tunnel di
            contrabbando gli scappa l'occhio verso la ruota del sipario. «Più
            forte, anima mia!» dice Orazio. «Dietro le quinte si sta zitti da
            quarant'anni» risponde il macchinista, ma al giro dopo grida, con una
            voce rauca che fa voltare anche Violante.
          effetti: { prove.arpia: 1 }
          pe: { espressivita: 3 }
        fallimento:
          titolo: La fune nera
          testo: |
            A metà della scena il macchinista sente scricchiolare una fune e va a
            controllarla, lasciandoti a dire le tue battute a un boccale di
            cartapesta. Orazio vi fa ripetere la scena tre volte, e alla terza il
            macchinista ti spiega sottovoce che era la fune nera del lampadario.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/grusk
        testo: "Dare la battuta a Grusk"
        descrizione: "Grusk si presenta ancora come Grusk invece che come Rolan, e Orazio ti chiede di provare con lui."
        requisiti: [teatro.ruolo == 1, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Il nastro rosso
          testo: |
            Fai tu la parte di Asvorko, e Grusk ti viene incontro dalla quinta con
            il copione arrotolato in pugno. «Signor Asvorko, Grusk è contento
            di...» Lo fermi e gli leghi al polso un nastro rosso come la sua
            carriola. Da allora ogni volta che vede il nastro dice Rolan, e alla
            fine della prova si presenta come Rolan alla donna delle pulizie, che
            gli risponde con un inchino.
          effetti: { prove.arpia: 1 }
          pe: { empatia: 3 }
        fallimento:
          titolo: Grusk e Grusk
          testo: |
            Alla quinta volta che Grusk si chiama Grusk perdi la pazienza, e lui
            si offende a modo suo, chiamandoti Grusk per tutta la scena con grande
            dignità. Dalla platea Orazio si massaggia le tempie. «Due Grusk. Il
            copione ne prevede uno, e mi pareva già abbondante.»
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/violante
        testo: "Provare il confronto nel nido delle arpie"
        descrizione: "Nel terzo atto devi far vedere ad Asvorko il suo errore, mentre Orazio piange lacrime vere."
        requisiti: [teatro.ruolo == 1, prove.arpia >= 2]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Lacrime vere
          testo: |
            Orazio si butta in ginocchio, con gli anelli che battono sulle assi, e
            stira su quattro pause il suo «Ho commesso un errore imperdonabile»,
            con le lacrime che gli tracciano due righe pulite nel cerone. Tu reggi
            la battuta senza ridere, anche quando si soffia il naso nel mantello
            della regina, e uscendo di scena Violante ti strizza l'occhio.
          effetti: { prove.arpia: 1 }
          pe: { persuasione: 3 }
        fallimento:
          titolo: La risata sbagliata
          testo: |
            Quando Orazio si soffia il naso nel mantello della regina ti scappa
            una risata dal naso. Lui si alza offeso, poi ti perdona con un gesto
            largo, da sovrano. «Anche le risate sono emozioni» dice, puntandoti
            contro un dito inanellato. «Domani però piangi tu, e io guardo.»
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/rilla-tamberlo
        testo: "Ripassare la parte nel ridotto"
        descrizione: "Nel ridotto si ripassa in pace, quando non arriva nessuno."
        requisiti: [teatro.ruolo == 1]
        esito:
          titolo: La segretaria Mary
          testo: |
            Nel ridotto ti raggiunge Rilla Tamberlo, che vuole provare Mary con
            qualcuno che non sia Orazio. Si siede sul tavolo con le gambe
            accavallate. «Signor Asvorko, ho bisogno di parlare con lei» dice,
            come se confessasse un omicidio. Ti chiede se è troppo, e prima che tu
            risponda decide da sola che Mary è una segretaria e lei la fa
            interessante.
          effetti: { prove.arpia: 0.5 }
          pe: { espressivita: 1 }
      # --- costumista o scenografo
      - immagine: personaggi/violante
        testo: "Sistemare le ali addosso a Violante"
        descrizione: "Sul manichino le ali reggono, ma addosso a un'attrice che cammina e si gira è un altro discorso."
        requisiti: [teatro.ruolo == 2, prove.arpia < 1]
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Le ali addosso
          testo: |
            Cuci le cinghie delle ali sotto il mantello di piume e nascondi il
            cordino in una manica. Violante alza le braccia e le ali si aprono
            piano insieme alla sua voce. «Al Festival ero pronta» dice, mentre
            stringi una fibbia. «Poi sono arrivati gli orchi, e io ho dormito tre
            notti di fila.»
          effetti: { prove.arpia: 1 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: La porta stretta
          testo: |
            Appena Violante prova l'uscita di scena, le ali si aprono da sole nel
            passaggio della quinta e la inchiodano allo stipite, con le braccia
            larghe. Lei ride così forte che le piume tremano, e Orazio arriva di
            corsa con una mano sul petto, giurando che il cuore gli si è fermato.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/grusk
        testo: "Costruire il golem di cartapesta"
        descrizione: "Il golem di pietra del terzo atto per ora è un mucchio di giornali e colla, e Grusk offre la carriola."
        requisiti: [teatro.ruolo == 2, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il golem sulla carriola
          testo: |
            Monti il golem sulla carriola di Grusk, con uno sportello sul retro, e
            Grusk ci si infila dentro e spinge. Il golem avanza ondeggiando con un
            ruggito che rimbomba nella cartapesta, e da dentro si sente anche
            Grusk che ride. Lo dipingi di grigio pietra, lasciando sul fondo una
            striscia rossa perché Grusk vuole riconoscere la sua carriola.
          effetti: { prove.arpia: 1 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: Un golem educato
          testo: |
            La cartapesta asciuga storta, e il golem si piega in avanti come in un
            inchino. Hai le dita appiccicate fino a sera e la colla l'hai
            ricomprata di tasca tua. «Un golem con le buone maniere» dice Orazio,
            accarezzandogli la testa storta. «In questa città se ne vedono pochi.»
          effetti: { prove.arpia: 0.5, monete: -1 }
      - immagine: personaggi/rilla-tamberlo
        testo: "Vestire Rilla per la parte di Mary"
        descrizione: "Rilla vuole lo spacco e Orazio una segretaria, e l'abito deve andar bene a entrambi."
        requisiti: [teatro.ruolo == 2, prove.arpia >= 2]
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Lo spacco nelle pieghe
          testo: |
            Le proponi un abito accollato, grigio da ufficio, con lo spacco
            nascosto fra le pieghe, che si apre solo quando Mary si siede sulla
            scrivania di Asvorko. Rilla accetta mordendosi una ciocca di capelli.
            Orazio se ne accorge solo alla prova generale e recita la scena rosso
            fino alle orecchie, mentre la donna delle pulizie applaude.
          effetti: { prove.arpia: 1 }
          pe: { persuasione: 3 }
        fallimento:
          titolo: Le forbici di Rilla
          testo: |
            Le fai un abito che piace a Orazio, e il giorno dopo Rilla si presenta
            con uno spacco alto fino all'anca, fatto di notte con le forbici della
            cucina. Orazio se la prende con te, perché con lei non osa, e passi il
            pomeriggio a rammendare mentre Rilla ti dice che stai rovinando
            l'Arte.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/grusk
        testo: "Dipingere il fondale della miniera"
        descrizione: "Il fondale del secondo atto mostra le miniere di Valpeltro e il tunnel di contrabbando, e qualcuno guarda sempre."
        requisiti: [teatro.ruolo == 2]
        esito:
          titolo: Consigli dallo spazzino
          testo: |
            Passi il pomeriggio sulla tela stesa in palcoscenico, a dipingere le
            gallerie di Valpeltro in ocra e nero. Seduto sulla carriola, Grusk ti
            osserva per un'ora buona e poi ti fa notare che una botola di
            contrabbando va messa sotto la scala della cantina, dove secondo lui
            non spazza nessuno. Se ne va spingendo la carriola, e sulla spalla
            della camicia ti resta l'impronta di fuliggine della sua mano.
          effetti: { prove.arpia: 0.5 }
          pe: { percezione: 1 }
      # --- aiutante di scena
      - immagine: personaggi/orazio-belcanto
        testo: "Aprire il sipario sull'entrata di Orazio"
        descrizione: "Il sipario deve aprirsi esattamente sul gesto di Orazio, perché un attimo di ritardo offende l'Arte."
        requisiti: [teatro.ruolo == 3, prove.arpia < 1]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Tre inchini
          testo: |
            Tieni gli occhi sulla mano di Orazio dalla fessura della quinta, e
            quando il braccio si alza giri la ruota. Il sipario si apre senza uno
            strappo su Orazio già in posa, che a fine scena se lo fa riaprire per
            tre inchini alla platea vuota, mentre la donna delle pulizie applaude
            con le mani bagnate.
          effetti: { prove.arpia: 1 }
          pe: { atletica: 3 }
        fallimento:
          titolo: Troppo presto
          testo: |
            Giri la ruota un momento prima, e il sipario si apre su Orazio che si sta
            sistemando le calze, con un piede sulla sedia di Asvorko, mentre la fune ti
            brucia i palmi. Lui abbassa il piede con dignità e attacca la battuta. Dopo
            la prova ti dice che la puntualità è una forma di rispetto, e ti guarda le
            mani.
          effetti: { prove.arpia: 0.5, ferite: 0.5 }
      - immagine: personaggi/grusk
        testo: "Fare l'orco nel terzo atto"
        descrizione: "Gli orchi del terzo atto sono comparse in maschera, ridipinte dopo la razzia di un verde più tenue, per delicatezza."
        requisiti: [teatro.ruolo == 3, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: fisico, abilita: [acrobazia, rissa], difficolta: Facile }
