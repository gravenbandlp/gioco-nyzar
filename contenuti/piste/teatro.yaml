# La pista del Teatro (pista.teatro 0 → 2): la Promessa dell'Arpia al Teatro delle Meraviglie di Belcanto.
# Entrata nella compagnia (teatro.ruolo: 1 attore, 2 costumista o scenografo, 3 aiutante di scena), prove
# ripetibili che fanno salire prove.arpia, la prima, le repliche, e la carta di Orazio che cerca attori in strada.
# Nel copione dell'opera Silver Pond è diventato Valpeltro, la taverna Empty Glass il Fiasco Asciutto.
# Le opzioni per ruolo stanno in storylet con `mostra`, che nasconde quelle degli altri ruoli; nelle prove
# la scena cambia con l'avanzare di prove.arpia (prima < 1, poi fra 1 e 2, poi da 2 in su).
storylet:
  # ------------------------------------------------------------ 0 → 1 · entrare nella compagnia
  - id: teatro-di-belcanto
    presso: teatro-delle-meraviglie
    immagine: personaggi/orazio-belcanto
    titolo: Il Teatro delle Meraviglie
    sommario: "La prima della Promessa dell'Arpia è saltata per la razzia. Orazio Belcanto non si arrende e cerca cittadini da mettere in scena."
    luogo: Teatro delle Meraviglie di Belcanto, Quartieri Alti
    area: quartieri-alti
    requisiti: [pista.teatro == 0, prologo == 0]
    testo: |
      Il Teatro delle Meraviglie occupa un intero lato della piazza, con le
      colonne di marmo bianco e una fila di attori di pietra in posa sul
      cornicione. A uno manca la mano che reggeva la maschera, e da come è
      annerito il moncherino manca da parecchi inverni. Sul portone è
      incollato il manifesto della *Promessa dell'Arpia*. La data della prima,
      la sera dopo il Festival, è coperta da una striscia di carta messa di
      traverso, con la parola *rinviata* scritta a pennello e una goccia di
      vernice colata fino al bordo.

      {accademiche Media fallita} Dovresti sapere chi rappresentano le
      statue del cornicione. Una volta lo sapevi di sicuro, insieme al nome
      dell'architetto, e adesso ti resta solo la sensazione di averlo
      saputo.

      Nel ridotto c'è odore di cera d'api e di vino rovesciato, e il tuo
      naso, senza consultarti, ti riporta a una festa di cui non ricordi la
      fine. Orazio Belcanto ti vede dalla scala e scende trotterellando, in
      una giacca color prugna con gli alamari d'oro. Ha un anello a ogni
      dito e la voce un'ottava più in alto del necessario.

      «Anima cara, benvenuta nel tempio della scena!» Ti prende la mano fra
      le sue, e gli anelli sono freddi. «Gli orchi mi hanno rubato la prima, e
      io me la riprendo. La Promessa dell'Arpia è un'opera in cui recita la
      città intera, gente comune come te. Mi servono attori e mani da sarta,
      e braccia per le funi. Per gli attori valgono i canoni estetici,
      s'intende. Quelli li stabilisce l'Arte in persona.» Lo dice abbassando
      gli occhi con modestia, e intanto ti sta misurando le spalle.

      {espressivita Facile} Ogni frase gli esce già rivolta alla galleria.
      Anche adesso, davanti a una persona sola, recita piuttosto bene.

      {origine rampollo-dei-quartieri-alti} In questo ridotto ci venivi da
      bambino, e ne ricordi soprattutto i banconi alti e le gambe degli adulti.
      Orazio ti guarda la faccia più a lungo delle spalle, e intanto, si
      vede, cerca di ricordarsi in quale palco ti ha già visto.
    opzioni:
      - testo: "Farti prendere come attore"
        descrizione: "Orazio ti girerà intorno come a un cavallo in fiera. Servono presenza e un po' di faccia tosta, e se non bastano c'è sempre posto fra le comparse."
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: I canoni estetici
          testo: |
            Orazio ti fa salire sul palco e ti gira intorno due volte. Ti alza il
            mento con un dito inanellato, ti misura il profilo con il pollice teso
            come fanno i pittori e decreta che il sinistro è accettabile e il
            destro andrà tenuto in ombra, per il bene di tutti. Poi ti chiede una
            battuta del secondo atto, e tu la dici guardando la galleria vuota
            come se fosse piena. Ti accorgi a metà che ti piace, e il cuore ti
            batte nelle orecchie fino all'ultima parola.

            Batte le mani, e gli anelli tintinnano. «Farai un avventuriero,
            anima mia. Il secondo, quello che entra dopo e che il pubblico si
            ricorda di più.»
          imposta: { teatro.ruolo: 1 }
          pe: { espressivita: 5 }
          effetti: { pista.teatro: 1 }
        fallimento:
          titolo: Fra le comparse
          testo: |
            A metà della battuta ti si secca la bocca, e la seconda metà esce
            con una voce che non sapevi di avere. Orazio chiude gli occhi e resta
            così per un po', con le mani giunte sotto il mento.

            «L'Arte ha parlato» dice alla fine. «Però l'Arte ha bisogno anche
            delle comparse, e nel terzo atto mi mancano due orchi e un minatore
            svenuto. Ti piacciono le maschere?» Ti mette in mano una maschera di
            cartapesta che puzza ancora di colla.

            {resilienza Facile} Ti dici che va bene lo stesso, perché un orco in
            maschera non deve ricordarsi le battute e in platea nessuno saprà che
            eri tu.
          imposta: { teatro.ruolo: 3 }
          pe: { espressivita: 3 }
          effetti: { pista.teatro: 1 }
      - testo: "Offrirti per i costumi e le scene"
        descrizione: "Le ali della regina arpia si inceppano da giorni. Se capisci perché, il posto in sartoria è tuo."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Le ali della regina
          testo: |
            Orazio ti porta in sartoria, dove su un manichino senza testa sono
            appese due ali di piume nere montate su stecche di canna. Si aprono
            tirando un cordino, e a metà corsa si bloccano ogni volta. Ci passi
            le dita sotto e trovi una stecca incollata al rovescio, con le piume
            che sfregano sulla stoffa.

            {tecnologia Facile} Chi l'ha montata aveva fretta, o la colla
            asciugava prima delle sue mani. Basta girarla e tutto il resto del
            meccanismo è già giusto. La giri, e le ali si aprono fino in fondo con
            un fruscio lungo.

            Orazio emette un piccolo grido. «Costumi e scenografie, anima mia! Da
            oggi questa stanza è tua, e anche la colla.»
          imposta: { teatro.ruolo: 2 }
          pe: { tecnologia: 5 }
          effetti: { pista.teatro: 1 }
        fallimento:
          titolo: Il cordino
          testo: |
            Tiri il cordino con troppa decisione, e un'ala si apre di colpo e ti
            frusta la faccia. Ti ritrovi con una piuma nera in bocca, la guancia
            che brucia e Orazio con le mani sul cuore, che controlla prima le ali
            e poi te.

            «Le ali sono salve» dice, sollevato. «La sartoria vuole la mano
            leggera, anima cara. Le funi del sipario invece non si offendono di
            niente.» Ti affida al vecchio macchinista, che ti porge un paio di
            guanti di cuoio più grandi delle tue mani.
          imposta: { teatro.ruolo: 3 }
          pe: { percezione: 3 }
          effetti: { pista.teatro: 1 }
      - testo: "Offrirti come aiutante di scena"
        descrizione: "Funi da tirare e fondali da spostare al buio. Per questo lavoro basta presentarsi in orario."
        esito:
          titolo: Le funi
          testo: |
            Orazio ti affida al vecchio macchinista, un uomo curvo con le dita
            storte dalle corde, che ti porta dietro le quinte e ti mostra le
            botole e la ruota del sipario. Su ogni fune è legato un nastrino
            colorato, e accanto alla ruota c'è un foglio con la legenda dei
            colori scritta a mano, che lui non guarda mai.

            «Il rosso è il sipario» dice. «Il nero non lo tocchi, perché tiene su
            il lampadario.» Ti fa provare la ruota due volte, e alla seconda
            annuisce senza dire niente.

            {atletica Facile} La ruota è pesante il giusto. Va girata con le
            gambe, e le gambe lo capiscono prima delle braccia.
          imposta: { teatro.ruolo: 3 }
          pe: { atletica: 3 }
          effetti: { pista.teatro: 1 }
      - testo: "Ricordargli il palco della tua famiglia"
        descrizione: "La tua famiglia ha un palco in terza fila da quando eri bambino, e Orazio i palchi paganti li conosce a memoria."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il palco in terza fila
          testo: |
            Gli dici il nome della tua famiglia, e Orazio porta tutte e due le
            mani al petto. «Il palco in terza fila, quello con la tenda
            rammendata!» Ti racconta che da bambino ti portavano a teatro e che al
            secondo atto dormivi sempre, con la guancia sulla balaustra, e che lui
            lo prendeva come un giudizio sull'opera. Tu non ricordi niente, e le
            guance ti si scaldano lo stesso.

            Poi ti fa salire sul palco, ti alza il mento con un dito inanellato
            e decreta che il profilo sinistro è quello di tua nonna e il destro
            andrà tenuto in ombra, per rispetto a lei. «Farai un avventuriero,
            anima mia. Il secondo, quello che entra dopo e che il pubblico si
            ricorda di più.» Ti chiede soltanto di restare sveglio fino al
            terzo atto.
          imposta: { teatro.ruolo: 1 }
          pe: { espressivita: 5 }
          effetti: { pista.teatro: 1 }
      - testo: "Dire la battuta come una preghiera della sera"
        descrizione: "Al Velo ti hanno insegnato a parlare a bassa voce in modo che si senta fino in fondo alla navata. Orazio vuole la galleria, e la galleria è soltanto una navata più alta."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [accademiche, empatia], difficolta: Media }
        successo:
          titolo: Fino in galleria
          testo: |
            Sul palco chiudi gli occhi un momento, come prima della preghiera
            della sera, e dici la battuta del secondo atto senza alzare la voce,
            con tutte le consonanti al loro posto, e la battuta arriva intera
            fino all'ultima fila della galleria.
            Orazio smette di girarti intorno e resta fermo in mezzo alla platea,
            con le mani giunte sotto il mento.

            {empatia Media} Ha sentito la Cattedrale nella tua voce e ha deciso
            di non dirtelo, per non doverla nominare in un teatro.

            «Anima mia, chi ti ha insegnato a respirare così?» chiede, e senza
            aspettare la risposta continua. «Farai un avventuriero, il secondo,
            quello che entra dopo e che il pubblico si ricorda di più.»
          imposta: { teatro.ruolo: 1 }
          pe: { espressivita: 5 }
          effetti: { pista.teatro: 1 }
        fallimento:
          titolo: Il tono della navata
          testo: |
            La battuta ti esce piana e dolce, con il tono che si usa per
            benedire i malati, e a metà ti accorgi che Orazio si è seduto in
            terza fila e lascia calare le palpebre.

            «Bellissimo e funebre, anima cara» dice alla fine. «L'avventuriero
            deve far venire voglia di partire, e a me è venuta voglia di
            confessarmi.» Ti mette in
            mano una maschera d'orco di cartapesta, che puzza ancora di colla, e
            ti promette che nel terzo atto potrai ringhiare quanto vuoi.
          imposta: { teatro.ruolo: 3 }
          pe: { espressivita: 3 }
          effetti: { pista.teatro: 1 }
      - testo: "Smontare le ali come un congegno dell'Accademia"
        descrizione: "All'Accademia prima si disegna il congegno, poi si tocca. Temmerin non perdona chi fa il contrario, e un paio d'ali di canna ha meno pezzi di un supporto per cristalli."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il disegno sul copione
          testo: |
            In sartoria ti fai dare un copione vecchio e sul retro disegni le
            ali stecca per stecca, segnando i punti dove le piume sfregano.
            Orazio ti guarda disegnare con crescente inquietudine. Al
            terzo schizzo trovi la stecca incollata al rovescio senza averla
            ancora toccata. La giri, e le ali si aprono fino in fondo con un
            fruscio lungo.

            {accademiche Facile} Temmerin avrebbe da ridire sulle proporzioni
            del disegno. Del risultato direbbe soltanto che era prevedibile, e
            detto da lui è quasi un complimento.

            Orazio emette un piccolo grido. «Costumi e scenografie, anima mia!
            Da oggi questa stanza è tua, e anche la colla.»
          imposta: { teatro.ruolo: 2 }
          pe: { tecnologia: 5 }
          effetti: { pista.teatro: 1 }
        fallimento:
          titolo: Troppi schizzi
          testo: |
            Riempi il retro di un copione con le ali disegnate da tre lati, e
            Orazio, stanco di aspettare, tira il cordino da solo per mostrarti
            il difetto. L'ala si apre di colpo e ti strappa il foglio di mano.
            Il disegno era giusto, ma è finito sotto il manichino.

            «La sartoria vuole mani, anima cara, più che pensieri» dice. «Le
            funi del sipario invece non chiedono di essere capite.» Ti affida al
            vecchio macchinista, che ti porge un paio di guanti di cuoio più
            grandi delle tue mani.
          imposta: { teatro.ruolo: 3 }
          pe: { percezione: 3 }
          effetti: { pista.teatro: 1 }

  # ------------------------------------------------------------ prove ripetibili · prove.arpia
  - id: prove-al-teatro
    presso: teatro-delle-meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    titolo: Le prove della Promessa
    sommario: "Ogni pomeriggio la compagnia di riserva prova la Promessa dell'Arpia, e Orazio la dirige dal palco e dalla platea insieme."
    luogo: Teatro delle Meraviglie di Belcanto, durante le prove
    area: quartieri-alti
    ripetibile: true
    # Mauro Scrocco fa Sigor finché la Caserma non si muove contro la Pignatta (pista.pelle 5);
    # da lì in poi vale la variante prove-al-teatro-senza-mauro.
    requisiti: [pista.teatro == 1, pista.pelle < 5]
    mostra: 2
    testo: |
      Le prove cominciano dopo pranzo, con il sipario rosso tirato a metà e
      la platea vuota, a parte una donna delle pulizie che ogni giorno si
      siede in terza fila con il secchio fra i piedi e non perde una scena.
      La compagnia è quella di riserva, messa insieme da Orazio dopo la
      razzia. Lui fa Asvorko, il padrone avaro delle miniere, e dirige gli
      altri anche a metà di una battuta. Grusk lo spazzino fa l'operaio
      Rolan, e la sua carriola rossa è arrivata fin sul palco. Rilla
      Tamberlo fa la segretaria Mary, e Mauro Scrocco della Pignatta Grassa
      fa l'oste Sigor. La regina arpia è Violante, la prima attrice, che
      ripassa in un angolo a voce bassa e cambia tono a ogni riga.

      {espressivita Media} Violante prova la stessa battuta in sei modi e li
      tiene tutti. Sceglierà stasera, davanti a chi c'è, e la donna delle
      pulizie è già un pubblico.

      {conoscenze-della-strada Media} Mauro Scrocco su un palco dei
      Quartieri Alti. Chi gestisce una bettola come la Pignatta non ha tempo
      per il teatro, a meno che il teatro non gli serva a qualcosa.

      {origine figlio-della-citta-bassa} Mauro Scrocco in Città Bassa lo
      conoscono tutti, e chi è cresciuto nei vicoli sa che i suoi abbracci si
      pagano dopo, con gli interessi. Vederlo qui, con il copione in mano e
      un oste da recitare, ti fa lo stesso effetto di un cane seduto a tavola.

      {origine apprendista-raschiatore} Grusk l'hai visto tante volte sulla
      spiaggia dell'Orlo dei Rottami, a caricare sulla carriola rossa quello
      che le piattaforme buttano giù. Sul palco la spinge con la stessa
      andatura, e ogni tanto si ferma a guardare per terra.

      Orazio batte le mani, e gli anelli tintinnano. «Dall'inizio, anime mie.
      Con sentimento!»
    opzioni:
      # --- attore
      - immagine: personaggi/mauro-scrocco
        testo: "Provare la scena della taverna con Mauro Scrocco"
        descrizione: "Secondo atto. L'oste Sigor assolda gli avventurieri al Fiasco Asciutto, e Mauro lo recita fin troppo bene."
        requisiti: [teatro.ruolo == 1, prove.arpia < 1]
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: Il tunnel sotto le botti
          testo: |
            Mauro ti abbraccia appena entri in scena, perché a suo dire Sigor
            abbraccia tutti, e il fiato gli puzza d'aglio fino alla terza fila.
            Quando arriva al tunnel di contrabbando si dilunga. Spiega che
            l'entrata va messa sotto le botti dell'aceto, che i cani delle
            guardie non annusano volentieri. Tu gli rispondi con la meraviglia
            dell'avventuriero e lo riporti nel copione senza farlo notare.

            {percezione Media} L'aceto per i cani non è nel copione. L'hai letto
            due volte, e quel dettaglio Mauro lo aggiunge di suo, ogni volta con
            la stessa precisione.

            «Mauro, caro, meno dettagli sul tunnel» dice Orazio dalla platea.
            «Il pubblico non deve impararlo.» Mauro allarga le braccia. «Si
            parla di tutto, Orazio. Si dice nulla.»
          effetti: { prove.arpia: 1 }
          pe: { espressivita: 3 }
        fallimento:
          titolo: Aglio
          testo: |
            L'abbraccio di Sigor dura più del previsto, e quando Mauro ti lascia
            andare hai dimenticato la battuta e respiri dalla bocca. Lui
            continua a parlare del tunnel per conto suo, aggiungendo la
            larghezza delle travi e l'orario dei cambi della guardia.

            Orazio vi fa ripetere la scena tre volte. Alla terza Mauro ti
            abbraccia di nuovo con affetto sincero, e l'aglio è lo stesso. Il tuo
            naso, a quel punto, ha smesso di protestare e si è rassegnato.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/grusk
        testo: "Dare la battuta a Grusk"
        descrizione: "Grusk continua a presentarsi come Grusk invece che come Rolan. Orazio ti chiede di provare con lui finché il nome giusto non gli entra in testa."
        requisiti: [teatro.ruolo == 1, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Il nastro rosso
          testo: |
            Fai tu la parte di Asvorko, perché Orazio deve riposare la voce, e
            Grusk ti viene incontro dalla quinta con il copione arrotolato in
            pugno e un odore di fiume e di grappa scadente. «Signor Asvorko,
            Grusk è contento di...» Lo fermi e gli leghi al polso un nastro
            rosso dello stesso colore della sua carriola.

            Ogni volta che vede il nastro, Grusk dice Rolan. Lo dice anche
            quando non serve, e alla fine della prova si presenta come Rolan
            alla donna delle pulizie, che gli risponde con un inchino.

            {empatia Media} Il nastro non lo toglierà più. A Grusk non hanno
            regalato molte cose in vita sua, e questa la porta al polso come una
            medaglia.
          effetti: { prove.arpia: 1 }
          pe: { empatia: 3 }
        fallimento:
          titolo: Grusk e Grusk
          testo: |
            Alla quinta volta che Grusk si chiama Grusk perdi la pazienza, e lui
            se ne accorge. Si offende a modo suo, cioè ti chiama Grusk a sua
            volta, per tutta la scena e con grande dignità, raddrizzando la
            schiena ogni volta che lo dice.

            Dalla platea Orazio si massaggia le tempie. «Due Grusk» dice con la
            voce che gli sale ancora. «Il copione ne prevede uno, e mi pareva
            già abbondante.»
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/violante
        testo: "Provare il confronto nel nido delle arpie"
        descrizione: "Terzo atto. Asvorko difende la regina arpia, e tu devi fargli vedere il suo errore mentre Orazio piange lacrime vere."
        requisiti: [teatro.ruolo == 1, prove.arpia >= 2]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Lacrime vere
          testo: |
            Orazio si butta in ginocchio, e gli anelli battono sulle assi del
            palco. «Ho commesso un errore imperdonabile» dice, e lo stira su
            quattro pause, con le lacrime che gli tracciano due righe pulite nel
            cerone. Tu lo guardi dritto negli occhi e reggi la battuta senza
            ridere, anche quando lui si soffia il naso nel mantello della regina,
            e per tenere ferma la faccia ti mordi l'interno della guancia.

            Violante aspetta il suo turno, poi ride la risata dell'arpia. Mentre
            uscite di scena ti strizza l'occhio, una volta sola.
          effetti: { prove.arpia: 1 }
          pe: { persuasione: 3 }
        fallimento:
          titolo: La risata sbagliata
          testo: |
            Quando Orazio si soffia il naso nel mantello della regina ti scappa
            una risata dal naso, e poi un'altra. Lui si alza in piedi, e per
            un momento la voce gli torna normale e offesa.

            {resilienza Media fallita} Provi a pensare a qualcosa di triste, per
            fermarti. Ti viene in mente soltanto il mantello della regina, e da lì
            si ricomincia.

            Poi si ricompone e ti perdona con un gesto largo, da sovrano. «Anche
            le risate sono emozioni» dice, e ti punta contro un dito inanellato.
            «Domani però piangi tu, e io guardo.»
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/rilla-tamberlo
        testo: "Ripassare la parte nel ridotto"
        descrizione: "Nel ridotto si ripassa in pace, quando non arriva nessuno."
        requisiti: [teatro.ruolo == 1]
        esito:
          titolo: La segretaria Mary
          testo: |
            Nel ridotto ti raggiunge Rilla Tamberlo, che vuole provare Mary con
            qualcuno che non sia Orazio. Si siede sul tavolo con le gambe
            accavallate e scioglie i capelli rossi sulla spalla, controllando di
            sbieco l'effetto nel vetro della porta. «Signor Asvorko, ho bisogno di
            parlare con lei» dice, abbassando la voce come se ti stesse
            confessando un omicidio.

            Ti chiede se è troppo. Prima che tu risponda decide da sola. «Mary è
            una segretaria, e io la faccio interessante.» Ripassate le battute
            fino a sera, e le tue le sai a memoria anche al contrario, mentre di
            quelle di Mary ricordi soprattutto le pause.
          effetti: { prove.arpia: 0.5 }
          pe: { espressivita: 1 }
      # --- costumista o scenografo
      - immagine: personaggi/violante
        testo: "Sistemare le ali addosso a Violante"
        descrizione: "Sul manichino le ali reggono. Addosso a un'attrice che cammina e si gira è un altro discorso."
        requisiti: [teatro.ruolo == 2, prove.arpia < 1]
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Le ali addosso
          testo: |
            Cuci le cinghie delle ali sotto il mantello di piume, all'altezza
            delle scapole. Il cordino lo nascondi in una manica. Violante alza le
            braccia, e le ali si aprono piano insieme alla sua voce, e poi tutte
            d'un colpo.

            «Al Festival ero pronta» dice, mentre provi a stringere una fibbia.
            «Poi sono arrivati gli orchi, e io ho dormito tre notti di fila.»
            Ride a bassa voce, guardando le quinte vuote, e ti lascia finire il
            lavoro.

            {medicina Media} Tre notti di sonno filato, dopo una razzia, sono il
            corpo che si riprende tutta insieme la paura arretrata.
          effetti: { prove.arpia: 1 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: La porta stretta
          testo: |
            Le ali reggono finché Violante resta ferma. Appena prova l'uscita di
            scena, si aprono da sole nel passaggio della quinta e la inchiodano
            allo stipite, con le braccia larghe e i piedi a un palmo da terra.

            Tu resti con il cordino in mano e la bocca aperta. Lei ride così forte
            che le piume tremano. Orazio arriva di corsa con una mano sul petto e
            dice che il cuore gli si è fermato, e ricomincia a battergli solo
            quando la vede tornare giù.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/grusk
        testo: "Costruire il golem di cartapesta"
        descrizione: "Il golem di pietra del terzo atto per ora è un mucchio di giornali e un secchio di colla. Grusk si offre di aiutarti con la sua carriola."
        requisiti: [teatro.ruolo == 2, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il golem sulla carriola
          testo: |
            Monti il golem sulla carriola di Grusk, così può entrare in scena da
            solo, e lasci uno sportello sul retro. Grusk ci si infila dentro e
            spinge, e il golem avanza ondeggiando con un ruggito che rimbomba
            nella cartapesta. Da dentro si sente anche Grusk che ride.

            {tecnologia Media} Il peso sta tutto sull'asse della carriola, e la
            cartapesta deve solo reggere se stessa. È la soluzione più stupida
            possibile, e infatti funziona.

            Lo dipingi di grigio pietra. Grusk ti chiede di lasciare almeno una
            striscia rossa sul fondo, perché la carriola è sua e vuole
            riconoscerla. Gliela lasci, e Orazio dalla platea non se ne accorge.
          effetti: { prove.arpia: 1 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: Un golem educato
          testo: |
            La cartapesta asciuga storta, e il golem si piega in avanti finché
            sembra che stia facendo un inchino. Hai consumato tutta la colla e ne
            compri dell'altra di tasca tua, e hai le dita appiccicate fino a sera.

            Orazio lo guarda a lungo e decide che va bene così. «Un golem con le
            buone maniere» dice, accarezzandogli la testa storta. «In questa città
            se ne vedono pochi, e il pubblico gradirà.»
          effetti: { prove.arpia: 0.5, monete: -1 }
      - immagine: personaggi/rilla-tamberlo
        testo: "Vestire Rilla per la parte di Mary"
        descrizione: "Rilla vuole un abito con lo spacco, mentre Orazio vuole una segretaria. Ti tocca trovare un abito che vada bene a tutti e due."
        requisiti: [teatro.ruolo == 2, prove.arpia >= 2]
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Lo spacco nelle pieghe
          testo: |
            Le proponi un abito accollato, grigio da ufficio, con lo spacco
            nascosto fra le pieghe della gonna, che si apre solo quando Mary si
            siede sulla scrivania di Asvorko. Rilla ci pensa mordendosi una
            ciocca di capelli e accetta.

            {galateo Media} Un abito accollato che si apre solo da seduta. Nei
            Quartieri Alti questo si chiama buon gusto, ed è più scandaloso di
            qualunque spacco.

            Orazio se ne accorge alla prova generale, quando ormai è tardi, e
            diventa rosso fino alle orecchie. Recita la scena con la voce di
            un'ottava più alta del solito, e la donna delle pulizie in terza
            fila applaude.
          effetti: { prove.arpia: 1 }
          pe: { persuasione: 3 }
        fallimento:
          titolo: Le forbici di Rilla
          testo: |
            Le fai un abito che piace a Orazio, e Rilla lo prova senza
            protestare. Il giorno dopo si presenta con lo stesso abito e uno
            spacco alto fino all'anca, fatto di notte con le forbici della
            cucina.

            Orazio se la prende con te, perché con Rilla non osa. Tu passi il
            pomeriggio a rammendare con l'ago, pungendoti il pollice ogni tanto,
            mentre lei ti dice che stai rovinando l'Arte.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/mauro-scrocco
        testo: "Dipingere il fondale della miniera"
        descrizione: "Il fondale del secondo atto mostra le miniere di Valpeltro e il tunnel di contrabbando. È lavoro lungo, e in sala c'è sempre qualcuno che guarda."
        requisiti: [teatro.ruolo == 2]
        esito:
          titolo: Consigli dall'oste
          testo: |
            Passi il pomeriggio sulla tela stesa in palcoscenico, a dipingere le
            gallerie di Valpeltro in ocra e nero, finché non hai ocra anche sotto
            le unghie. Mauro Scrocco si ferma alle tue spalle con le mani dietro
            la schiena. Ti fa notare che una botola di contrabbando va messa sotto
            la scala della cantina, dove nessuno spazza.

            Lo dice con una certa competenza. Poi ti abbraccia, ti lascia sulla
            camicia un odore di assenzio e se ne va canticchiando.

            {furtivita Media} Sotto la scala nessuno spazza e nessuno guarda, ed è
            il posto che avresti scelto anche tu.
          effetti: { prove.arpia: 0.5 }
          pe: { percezione: 1 }
      # --- aiutante di scena
      - immagine: personaggi/orazio-belcanto
        testo: "Aprire il sipario sull'entrata di Orazio"
        descrizione: "Il sipario deve aprirsi esattamente sul gesto di Orazio. Lui sostiene che un attimo di ritardo offende l'Arte."
        requisiti: [teatro.ruolo == 3, prove.arpia < 1]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Tre inchini
          testo: |
            Tieni gli occhi sulla mano di Orazio dalla fessura della quinta, e
            quando il suo braccio si alza giri la ruota. Il sipario si apre senza
            uno strappo, e lui è già in posa, con il mento in alto e una mano
            sospesa a mezz'aria.

            Alla fine della scena ti chiede di chiuderlo e riaprirlo, e fa tre
            inchini alla platea vuota, uno per ogni ordine di palchi. La donna
            delle pulizie applaude con le mani bagnate.
          effetti: { prove.arpia: 1 }
          pe: { atletica: 3 }
        fallimento:
          titolo: Troppo presto
          testo: |
            Giri la ruota un momento prima, e il sipario si apre su Orazio che
            si sta sistemando le calze, con un piede sulla sedia di Asvorko.
            La fune ti scorre fra le mani e ti brucia i palmi.

            {resistenza Facile fallita} Una striscia rossa per palmo, lucida, che domani
            sarà una vescica. Le mani se ne ricorderanno ogni volta che stringi
            qualcosa.

            Lui resta immobile, poi abbassa il piede con dignità e attacca la
            battuta come se niente fosse. Dopo la prova viene a dirti che la
            puntualità è una forma di rispetto, e ti guarda le mani.
          effetti: { prove.arpia: 0.5, ferite: 0.5 }
      - immagine: personaggi/grusk
        testo: "Fare l'orco nel terzo atto"
        descrizione: "Gli orchi del terzo atto sono comparse in maschera. Dopo la razzia Orazio le ha fatte ridipingere di un verde più tenue, per delicatezza."
        requisiti: [teatro.ruolo == 3, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: fisico, abilita: [acrobazia, rissa], difficolta: Facile }
        successo:
          titolo: Il ringhio della nonna
          testo: |
            Prima della scena Grusk ti prende da parte e ti insegna a ringhiare
            dal fondo della pancia, come faceva sua nonna quando i bambini
            rubavano il pane. Tu ringhi, e il ringhio ti esce da un posto che non
            sapevi di avere, e gli avventurieri fanno un passo indietro che il
            copione non prevedeva.

            Cadi a terra al momento giusto, con un tonfo che fa sobbalzare la
            platea vuota. Grusk dalla quinta alza il pollice, che ha tatuato
            anche quello.
          effetti: { prove.arpia: 1 }
          pe: { acrobazia: 3 }
        fallimento:
          titolo: L'orco e il sipario
          testo: |
            La maschera ti scivola sugli occhi a metà della zuffa, e per un po'
            combatti contro il sipario. Il sipario vince, e tu ti ritrovi
            avvolto nel velluto rosso con le gambe che scalciano fuori.

            {acrobazia Facile fallita} La caduta l'avevi provata. Il sipario
            invece no, e ti ha preso alle spalle mentre cadevi con molta eleganza
            dalla parte sbagliata.

            Orazio dalla platea decide che l'orco ha lottato con coraggio, e
            che il sipario ne esce peggio di lui. Ti chiede però di tenere la
            maschera legata più stretta, e ti presta un nastro dei suoi, color
            prugna.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/rilla-tamberlo
        testo: "Suggerire dalla buca"
        descrizione: "Il suggeritore ha perso la voce. Dalla buca davanti al palco si vedono soprattutto caviglie, e si sentono tutte le battute sbagliate."
        requisiti: [teatro.ruolo == 3, prove.arpia >= 2]
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Facile }
        successo:
          titolo: Caviglie
          testo: |
            Tieni il dito sul copione e la testa bassa. Sussurri «Rolan» a Grusk
            ogni volta che apre bocca, e tieni gli occhi sulla pagina anche
            quando Rilla si siede sulla scrivania proprio sopra la buca.

            Quando esci dalla buca hai il collo indolenzito e le ginocchia segnate
            dalle assi, e per un po' cammini come un vecchio macchinista. Orazio
            dice che non ha sentito il suggeritore nemmeno una volta, e ti stringe
            la mano così forte che ti resta nel palmo il segno del sigillo del
            Teatro.
          effetti: { prove.arpia: 1 }
          pe: { percezione: 3 }
        fallimento:
          titolo: La scena sbagliata
          testo: |
            Perdi il segno quando Rilla ti lascia cadere un fazzoletto in testa,
            e suggerisci a Mauro la battuta della scena sbagliata. Lui la dice
            con convinzione, e Sigor accetta la proposta della regina arpia.

            Violante, senza scomporsi, gli risponde con una battuta inventata, e
            per un po' la scena va avanti per conto suo. Dalla buca la ascolti
            improvvisare con le orecchie in fiamme, chiedendoti se non sia meglio
            dell'originale. Orazio vi fa ricominciare dall'atto secondo e ti manda
            giù un fazzoletto pulito, piegato in quattro.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/violante
        testo: "Spazzare il palco e portare l'acqua"
        descrizione: "Qualcuno deve pur farlo, e intanto si sente tutto quello che si dice nelle quinte."
        requisiti: [teatro.ruolo == 3]
        esito:
          titolo: Dalle quinte
          testo: |
            Spazzi il palco fra una scena e l'altra e porti la brocca dell'acqua
            in quinta. Violante beve dal tuo bicchiere senza chiedere, poi
            guarda la compagnia che litiga sul palco.

            «Recito una regina arpia» dice. «È più gentile della mezza compagnia
            che mi guarda dalle quinte.» Ti restituisce il bicchiere e torna in
            scena con il mantello di piume che struscia sulle assi.

            {empatia Media} Lo ha detto a te perché sei l'unico che non conta, ed
            è una forma di fiducia, la più comoda che esista.
          effetti: { prove.arpia: 0.5 }
          pe: { resistenza: 1 }

  # Variante: Mauro non viene più alle prove, e Sigor lo fa il vecchio macchinista.
  - id: prove-al-teatro-senza-mauro
    presso: teatro-delle-meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    titolo: Le prove della Promessa
    sommario: "Ogni pomeriggio la compagnia di riserva prova la Promessa dell'Arpia, e Orazio la dirige dal palco e dalla platea insieme."
    luogo: Teatro delle Meraviglie di Belcanto, durante le prove
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.teatro == 1, pista.pelle >= 5]
    mostra: 2
    testo: |
      Le prove cominciano dopo pranzo, con il sipario rosso tirato a metà e
      la platea vuota, a parte una donna delle pulizie che ogni giorno si
      siede in terza fila con il secchio fra i piedi e non perde una scena.
      La compagnia è quella di riserva, messa insieme da Orazio dopo la
      razzia. Lui fa Asvorko, il padrone avaro delle miniere, e dirige gli
      altri anche a metà di una battuta. Grusk lo spazzino fa l'operaio
      Rolan, e la sua carriola rossa è arrivata fin sul palco. Rilla
      Tamberlo fa la segretaria Mary. Mauro Scrocco alle prove non si
      presenta più, e l'oste Sigor adesso lo fa il vecchio macchinista, che
      le battute le sa tutte a forza di sentirle dalle quinte. La regina
      arpia è Violante, la prima attrice, che ripassa in un angolo a voce
      bassa e cambia tono a ogni riga.

      {conoscenze-della-strada Media} Della Pignatta Grassa, in questi
      giorni, in Città Bassa si parla a mezza voce. Un oste che smette di
      venire a recitare ha di solito altri pensieri per la testa.

      {percezione Facile} Il macchinista recita con una mano sempre vicina
      alla quinta, dove pendono le sue funi. Le controlla con la coda
      dell'occhio anche mentre dice le battute.

      {origine figlio-della-citta-bassa} Senza Mauro, Grusk è l'unico della
      compagnia che viene dalla tua parte della città. Quando entri alza il
      mento verso di te, come si fa fra vicini che si incontrano lontano da
      casa.

      {origine apprendista-raschiatore} Grusk l'hai visto tante volte sulla
      spiaggia dell'Orlo dei Rottami, a caricare sulla carriola rossa quello
      che le piattaforme buttano giù. Sul palco la spinge con la stessa
      andatura, e ogni tanto si ferma a guardare per terra.

      Orazio batte le mani, e gli anelli tintinnano. «Dall'inizio, anime mie.
      Con sentimento!»
    opzioni:
      # --- attore
      - testo: "Provare la scena della taverna con il vecchio macchinista"
        descrizione: "Secondo atto. L'oste Sigor assolda gli avventurieri al Fiasco Asciutto, e il vecchio macchinista lo recita come se dovesse ancora badare alle funi."
        requisiti: [teatro.ruolo == 1, prove.arpia < 1]
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: Il tunnel sotto le botti
          testo: |
            Il vecchio macchinista entra in scena con le dita storte infilate
            nel grembiule e dice le battute di Sigor a voce bassa, come se in
            platea ci fosse qualcuno da non svegliare. Quando arriva al tunnel
            di contrabbando gli scappa l'occhio verso la ruota del sipario. Tu
            gli rispondi con la meraviglia dell'avventuriero e alzi la voce per
            tutti e due, finché anche lui comincia a crederci.

            «Più forte, anima mia!» dice Orazio dalla platea. Il macchinista alza
            le spalle. «Dietro le quinte si sta zitti da quarant'anni» risponde, e
            al giro dopo grida, con una voce rauca e sorprendente che fa voltare
            anche Violante.
          effetti: { prove.arpia: 1 }
          pe: { espressivita: 3 }
        fallimento:
          titolo: La fune nera
          testo: |
            A metà della scena il macchinista sente scricchiolare una fune e va
            a controllarla, con la battuta di Sigor lasciata a metà. Tu resti al
            bancone del Fiasco Asciutto da solo, e dici le tue battute a un
            boccale di cartapesta.

            {espressivita Media fallita} Ci metti tutto il sentimento che Orazio
            chiede. Il boccale non reagisce, e in terza fila la donna delle
            pulizie sbadiglia.

            Orazio vi fa ripetere la scena tre volte. Alla terza il macchinista
            arriva fino in fondo, e ti spiega sottovoce che la fune era quella
            nera del lampadario.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/grusk
        testo: "Dare la battuta a Grusk"
        descrizione: "Grusk continua a presentarsi come Grusk invece che come Rolan. Orazio ti chiede di provare con lui finché il nome giusto non gli entra in testa."
        requisiti: [teatro.ruolo == 1, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Il nastro rosso
          testo: |
            Fai tu la parte di Asvorko, perché Orazio deve riposare la voce, e
            Grusk ti viene incontro dalla quinta con il copione arrotolato in
            pugno e un odore di fiume e di grappa scadente. «Signor Asvorko,
            Grusk è contento di...» Lo fermi e gli leghi al polso un nastro
            rosso dello stesso colore della sua carriola.

            Ogni volta che vede il nastro, Grusk dice Rolan. Lo dice anche
            quando non serve, e alla fine della prova si presenta come Rolan
            alla donna delle pulizie, che gli risponde con un inchino.

            {empatia Media} Il nastro non lo toglierà più. A Grusk non hanno
            regalato molte cose in vita sua, e questa la porta al polso come una
            medaglia.
          effetti: { prove.arpia: 1 }
          pe: { empatia: 3 }
        fallimento:
          titolo: Grusk e Grusk
          testo: |
            Alla quinta volta che Grusk si chiama Grusk perdi la pazienza, e lui
            se ne accorge. Si offende a modo suo, cioè ti chiama Grusk a sua
            volta, per tutta la scena e con grande dignità, raddrizzando la
            schiena ogni volta che lo dice.

            Dalla platea Orazio si massaggia le tempie. «Due Grusk» dice con la
            voce che gli sale ancora. «Il copione ne prevede uno, e mi pareva
            già abbondante.»
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/violante
        testo: "Provare il confronto nel nido delle arpie"
        descrizione: "Terzo atto. Asvorko difende la regina arpia, e tu devi fargli vedere il suo errore mentre Orazio piange lacrime vere."
        requisiti: [teatro.ruolo == 1, prove.arpia >= 2]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Lacrime vere
          testo: |
            Orazio si butta in ginocchio, e gli anelli battono sulle assi del
            palco. «Ho commesso un errore imperdonabile» dice, e lo stira su
            quattro pause, con le lacrime che gli tracciano due righe pulite nel
            cerone. Tu lo guardi dritto negli occhi e reggi la battuta senza
            ridere, anche quando lui si soffia il naso nel mantello della regina,
            e per tenere ferma la faccia ti mordi l'interno della guancia.

            Violante aspetta il suo turno, poi ride la risata dell'arpia. Mentre
            uscite di scena ti strizza l'occhio, una volta sola.
          effetti: { prove.arpia: 1 }
          pe: { persuasione: 3 }
        fallimento:
          titolo: La risata sbagliata
          testo: |
            Quando Orazio si soffia il naso nel mantello della regina ti scappa
            una risata dal naso, e poi un'altra. Lui si alza in piedi, e per
            un momento la voce gli torna normale e offesa.

            {resilienza Media fallita} Provi a pensare a qualcosa di triste, per
            fermarti. Ti viene in mente soltanto il mantello della regina, e da lì
            si ricomincia.

            Poi si ricompone e ti perdona con un gesto largo, da sovrano. «Anche
            le risate sono emozioni» dice, e ti punta contro un dito inanellato.
            «Domani però piangi tu, e io guardo.»
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/rilla-tamberlo
        testo: "Ripassare la parte nel ridotto"
        descrizione: "Nel ridotto si ripassa in pace, quando non arriva nessuno."
        requisiti: [teatro.ruolo == 1]
        esito:
          titolo: La segretaria Mary
          testo: |
            Nel ridotto ti raggiunge Rilla Tamberlo, che vuole provare Mary con
            qualcuno che non sia Orazio. Si siede sul tavolo con le gambe
            accavallate e scioglie i capelli rossi sulla spalla, controllando di
            sbieco l'effetto nel vetro della porta. «Signor Asvorko, ho bisogno di
            parlare con lei» dice, abbassando la voce come se ti stesse
            confessando un omicidio.

            Ti chiede se è troppo. Prima che tu risponda decide da sola. «Mary è
            una segretaria, e io la faccio interessante.» Ripassate le battute
            fino a sera, e le tue le sai a memoria anche al contrario, mentre di
            quelle di Mary ricordi soprattutto le pause.
          effetti: { prove.arpia: 0.5 }
          pe: { espressivita: 1 }
      # --- costumista o scenografo
      - immagine: personaggi/violante
        testo: "Sistemare le ali addosso a Violante"
        descrizione: "Sul manichino le ali reggono. Addosso a un'attrice che cammina e si gira è un altro discorso."
        requisiti: [teatro.ruolo == 2, prove.arpia < 1]
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Le ali addosso
          testo: |
            Cuci le cinghie delle ali sotto il mantello di piume, all'altezza
            delle scapole. Il cordino lo nascondi in una manica. Violante alza le
            braccia, e le ali si aprono piano insieme alla sua voce, e poi tutte
            d'un colpo.

            «Al Festival ero pronta» dice, mentre provi a stringere una fibbia.
            «Poi sono arrivati gli orchi, e io ho dormito tre notti di fila.»
            Ride a bassa voce, guardando le quinte vuote, e ti lascia finire il
            lavoro.

            {medicina Media} Tre notti di sonno filato, dopo una razzia, sono il
            corpo che si riprende tutta insieme la paura arretrata.
          effetti: { prove.arpia: 1 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: La porta stretta
          testo: |
            Le ali reggono finché Violante resta ferma. Appena prova l'uscita di
            scena, si aprono da sole nel passaggio della quinta e la inchiodano
            allo stipite, con le braccia larghe e i piedi a un palmo da terra.

            Tu resti con il cordino in mano e la bocca aperta. Lei ride così forte
            che le piume tremano. Orazio arriva di corsa con una mano sul petto e
            dice che il cuore gli si è fermato, e ricomincia a battergli solo
            quando la vede tornare giù.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/grusk
        testo: "Costruire il golem di cartapesta"
        descrizione: "Il golem di pietra del terzo atto per ora è un mucchio di giornali e un secchio di colla. Grusk si offre di aiutarti con la sua carriola."
        requisiti: [teatro.ruolo == 2, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il golem sulla carriola
          testo: |
            Monti il golem sulla carriola di Grusk, così può entrare in scena da
            solo, e lasci uno sportello sul retro. Grusk ci si infila dentro e
            spinge, e il golem avanza ondeggiando con un ruggito che rimbomba
            nella cartapesta. Da dentro si sente anche Grusk che ride.

            {tecnologia Media} Il peso sta tutto sull'asse della carriola, e la
            cartapesta deve solo reggere se stessa. È la soluzione più stupida
            possibile, e infatti funziona.

            Lo dipingi di grigio pietra. Grusk ti chiede di lasciare almeno una
            striscia rossa sul fondo, perché la carriola è sua e vuole
            riconoscerla. Gliela lasci, e Orazio dalla platea non se ne accorge.
          effetti: { prove.arpia: 1 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: Un golem educato
          testo: |
            La cartapesta asciuga storta, e il golem si piega in avanti finché
            sembra che stia facendo un inchino. Hai consumato tutta la colla e ne
            compri dell'altra di tasca tua, e hai le dita appiccicate fino a sera.

            Orazio lo guarda a lungo e decide che va bene così. «Un golem con le
            buone maniere» dice, accarezzandogli la testa storta. «In questa città
            se ne vedono pochi, e il pubblico gradirà.»
          effetti: { prove.arpia: 0.5, monete: -1 }
      - immagine: personaggi/rilla-tamberlo
        testo: "Vestire Rilla per la parte di Mary"
        descrizione: "Rilla vuole un abito con lo spacco, mentre Orazio vuole una segretaria. Ti tocca trovare un abito che vada bene a tutti e due."
        requisiti: [teatro.ruolo == 2, prove.arpia >= 2]
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Lo spacco nelle pieghe
          testo: |
            Le proponi un abito accollato, grigio da ufficio, con lo spacco
            nascosto fra le pieghe della gonna, che si apre solo quando Mary si
            siede sulla scrivania di Asvorko. Rilla ci pensa mordendosi una
            ciocca di capelli e accetta.

            {galateo Media} Un abito accollato che si apre solo da seduta. Nei
            Quartieri Alti questo si chiama buon gusto, ed è più scandaloso di
            qualunque spacco.

            Orazio se ne accorge alla prova generale, quando ormai è tardi, e
            diventa rosso fino alle orecchie. Recita la scena con la voce di
            un'ottava più alta del solito, e la donna delle pulizie in terza
            fila applaude.
          effetti: { prove.arpia: 1 }
          pe: { persuasione: 3 }
        fallimento:
          titolo: Le forbici di Rilla
          testo: |
            Le fai un abito che piace a Orazio, e Rilla lo prova senza
            protestare. Il giorno dopo si presenta con lo stesso abito e uno
            spacco alto fino all'anca, fatto di notte con le forbici della
            cucina.

            Orazio se la prende con te, perché con Rilla non osa. Tu passi il
            pomeriggio a rammendare con l'ago, pungendoti il pollice ogni tanto,
            mentre lei ti dice che stai rovinando l'Arte.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/grusk
        testo: "Dipingere il fondale della miniera"
        descrizione: "Il fondale del secondo atto mostra le miniere di Valpeltro e il tunnel di contrabbando. È lavoro lungo, e in sala c'è sempre qualcuno che guarda."
        requisiti: [teatro.ruolo == 2]
        esito:
          titolo: Consigli dallo spazzino
          testo: |
            Passi il pomeriggio sulla tela stesa in palcoscenico, a dipingere le
            gallerie di Valpeltro in ocra e nero, finché non hai ocra anche sotto
            le unghie. Grusk si siede sulla sua carriola alle tue spalle e ti
            guarda lavorare per un'ora buona senza dire una parola. Poi ti fa
            notare che una botola di contrabbando va messa sotto la scala della
            cantina. «Grusk lo sa. Sotto le scale non spazza nessuno.»

            Lo dice con una certa competenza. Poi se ne va spingendo la carriola,
            e sulla spalla della camicia ti resta l'impronta di fuliggine della
            sua mano, che non viene via nemmeno lavandola.
          effetti: { prove.arpia: 0.5 }
          pe: { percezione: 1 }
      # --- aiutante di scena
      - immagine: personaggi/orazio-belcanto
        testo: "Aprire il sipario sull'entrata di Orazio"
        descrizione: "Il sipario deve aprirsi esattamente sul gesto di Orazio. Lui sostiene che un attimo di ritardo offende l'Arte."
        requisiti: [teatro.ruolo == 3, prove.arpia < 1]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Tre inchini
          testo: |
            Tieni gli occhi sulla mano di Orazio dalla fessura della quinta, e
            quando il suo braccio si alza giri la ruota. Il sipario si apre senza
            uno strappo, e lui è già in posa, con il mento in alto e una mano
            sospesa a mezz'aria.

            Alla fine della scena ti chiede di chiuderlo e riaprirlo, e fa tre
            inchini alla platea vuota, uno per ogni ordine di palchi. La donna
            delle pulizie applaude con le mani bagnate.
          effetti: { prove.arpia: 1 }
          pe: { atletica: 3 }
        fallimento:
          titolo: Troppo presto
          testo: |
            Giri la ruota un momento prima, e il sipario si apre su Orazio che
            si sta sistemando le calze, con un piede sulla sedia di Asvorko.
            La fune ti scorre fra le mani e ti brucia i palmi.

            {resistenza Facile fallita} Una striscia rossa per palmo, lucida, che domani
            sarà una vescica. Le mani se ne ricorderanno ogni volta che stringi
            qualcosa.

            Lui resta immobile, poi abbassa il piede con dignità e attacca la
            battuta come se niente fosse. Dopo la prova viene a dirti che la
            puntualità è una forma di rispetto, e ti guarda le mani.
          effetti: { prove.arpia: 0.5, ferite: 0.5 }
      - immagine: personaggi/grusk
        testo: "Fare l'orco nel terzo atto"
        descrizione: "Gli orchi del terzo atto sono comparse in maschera. Dopo la razzia Orazio le ha fatte ridipingere di un verde più tenue, per delicatezza."
        requisiti: [teatro.ruolo == 3, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: fisico, abilita: [acrobazia, rissa], difficolta: Facile }
        successo:
          titolo: Il ringhio della nonna
          testo: |
            Prima della scena Grusk ti prende da parte e ti insegna a ringhiare
            dal fondo della pancia, come faceva sua nonna quando i bambini
            rubavano il pane. Tu ringhi, e il ringhio ti esce da un posto che non
            sapevi di avere, e gli avventurieri fanno un passo indietro che il
            copione non prevedeva.

            Cadi a terra al momento giusto, con un tonfo che fa sobbalzare la
            platea vuota. Grusk dalla quinta alza il pollice, che ha tatuato
            anche quello.
          effetti: { prove.arpia: 1 }
          pe: { acrobazia: 3 }
        fallimento:
          titolo: L'orco e il sipario
          testo: |
            La maschera ti scivola sugli occhi a metà della zuffa, e per un po'
            combatti contro il sipario. Il sipario vince, e tu ti ritrovi
            avvolto nel velluto rosso con le gambe che scalciano fuori.

            {acrobazia Facile fallita} La caduta l'avevi provata. Il sipario
            invece no, e ti ha preso alle spalle mentre cadevi con molta eleganza
            dalla parte sbagliata.

            Orazio dalla platea decide che l'orco ha lottato con coraggio, e
            che il sipario ne esce peggio di lui. Ti chiede però di tenere la
            maschera legata più stretta, e ti presta un nastro dei suoi, color
            prugna.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/rilla-tamberlo
        testo: "Suggerire dalla buca"
        descrizione: "Il suggeritore ha perso la voce. Dalla buca davanti al palco si vedono soprattutto caviglie, e si sentono tutte le battute sbagliate."
        requisiti: [teatro.ruolo == 3, prove.arpia >= 2]
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Facile }
        successo:
          titolo: Caviglie
          testo: |
            Tieni il dito sul copione e la testa bassa. Sussurri «Rolan» a Grusk
            ogni volta che apre bocca, e tieni gli occhi sulla pagina anche
            quando Rilla si siede sulla scrivania proprio sopra la buca.

            Quando esci dalla buca hai il collo indolenzito e le ginocchia segnate
            dalle assi, e per un po' cammini come un vecchio macchinista. Orazio
            dice che non ha sentito il suggeritore nemmeno una volta, e ti stringe
            la mano così forte che ti resta nel palmo il segno del sigillo del
            Teatro.
          effetti: { prove.arpia: 1 }
          pe: { percezione: 3 }
        fallimento:
          titolo: La scena sbagliata
          testo: |
            Perdi il segno quando Rilla ti lascia cadere un fazzoletto in testa,
            e suggerisci al vecchio macchinista la battuta della scena
            sbagliata. Lui la dice con convinzione, e Sigor accetta la proposta
            della regina arpia.

            Violante, senza scomporsi, gli risponde con una battuta inventata, e
            per un po' la scena va avanti per conto suo. Dalla buca la ascolti
            improvvisare con le orecchie in fiamme, chiedendoti se non sia meglio
            dell'originale. Orazio vi fa ricominciare dall'atto secondo e ti manda
            giù un fazzoletto pulito, piegato in quattro.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/violante
        testo: "Spazzare il palco e portare l'acqua"
        descrizione: "Qualcuno deve pur farlo, e intanto si sente tutto quello che si dice nelle quinte."
        requisiti: [teatro.ruolo == 3]
        esito:
          titolo: Dalle quinte
          testo: |
            Spazzi il palco fra una scena e l'altra e porti la brocca dell'acqua
            in quinta. Violante beve dal tuo bicchiere senza chiedere, poi
            guarda la compagnia che litiga sul palco.

            «Recito una regina arpia» dice. «È più gentile della mezza compagnia
            che mi guarda dalle quinte.» Ti restituisce il bicchiere e torna in
            scena con il mantello di piume che struscia sulle assi.

            {empatia Media} Lo ha detto a te perché sei l'unico che non conta, ed
            è una forma di fiducia, la più comoda che esista.
          effetti: { prove.arpia: 0.5 }
          pe: { resistenza: 1 }

  # ------------------------------------------------------------ 1 → 2 · la prima
  - id: la-prima-della-promessa
    presso: teatro-delle-meraviglie
    immagine: personaggi/violante
    titolo: La prima della Promessa
    sommario: "Il manifesto ha una data nuova e la platea è piena fino al loggione. Stasera Orazio alza il sipario sulla Promessa dell'Arpia."
    luogo: Teatro delle Meraviglie di Belcanto, la sera della prima
    area: quartieri-alti
    # Lucia Malgrani nel suo palco e Mauro Scrocco in scena: solo prima che la Caserma si muova contro
    # i Malgrani e la Pignatta (pista.pelle 5). Dopo vale la-prima-della-promessa-dopo-i-malgrani.
    requisiti: [pista.teatro == 1, prove.arpia >= 3, pista.pelle < 5]
    mostra: 2
    testo: |
      Sulla striscia *rinviata* del manifesto è stata incollata una data
      nuova, e stasera la platea è piena fino al loggione. Lucia Malgrani è
      sola nel suo palco in seconda fila, dritta come una candela, e la Casa
      dei Nodi ha mandato mezza Gilda. Dalle quinte senti l'odore delle
      lampade e del sudore della compagnia, e ti sorprendi ad abbottonare e
      sbottonare lo stesso bottone della giubba.

      {empatia Media} Sola in un palco intero, e non si appoggia allo
      schienale nemmeno per un momento. Lucia Malgrani è venuta a farsi
      vedere più che a vedere.

      {politica-ed-economia Media} Mezza Gilda in platea per un'opera sugli
      operai delle miniere. Domani nei salotti si discuterà di chi ha
      applaudito, e di quanto.

      {origine rampollo-dei-quartieri-alti} Il palco della tua famiglia, in
      terza fila, ha la tenda aperta. Da dietro la quinta non vedi chi c'è
      dentro, e ti tiri giù le maniche fino alle nocche.

      {origine mercante-dei-ponti} Fra la mezza Gilda in platea riconosci
      l'esattore che dopo la razzia è passato a controllare il tuo banco.
      Stasera è vestito meglio di quanto l'hai mai visto, e sta già contando
      le file di poltrone muovendo le labbra.

      Orazio apre il primo atto. Il suo Asvorko conta le monete delle
      miniere di Valpeltro una per una, e quando la regina arpia entra
      nell'ufficio avvolta nel mantello di piume la sala smette di frusciare.
      Violante gli promette la lealtà degli operai in cambio di un nido
      nelle gallerie, e Asvorko accetta. Alla terza scena Grusk si presenta
      come «Grusk, signore», e il loggione ride così forte che lui fa un
      inchino. Quando Rilla si siede sulla scrivania di Asvorko, dal
      loggione parte un fischio, e Orazio, sotto il cerone, arrossisce lo
      stesso.

      Nel secondo atto Mauro Scrocco, nei panni di Sigor, assolda gli
      avventurieri alla taverna del Fiasco Asciutto e apre il tunnel di
      contrabbando sotto le botti. Poi viene il terzo atto, con gli orchi in
      maschera e il golem di cartapesta. Nel nido aspettano le trappole, e il
      momento che hai provato tante volte è arrivato.
    opzioni:
      - testo: "Affrontare Asvorko nel nido delle arpie"
        descrizione: "La scena ottava è tua. Davanti hai Orazio in ginocchio e mille persone al buio."
        requisiti: [teatro.ruolo == 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Un errore imperdonabile
          testo: |
            Pianti i piedi sulle assi e dici la battuta all'ultima fila senza
            fretta. Senti la sala tacere un pezzo alla volta, dalla platea fino al
            loggione.

            {espressivita Media} Per la durata di una battuta mille persone al
            buio stanno ferme quando stai fermo tu, e nessuno ti aveva detto che potesse
            piacere così tanto.

            Orazio crolla in ginocchio e si pente con le lacrime vere e gli anelli
            che battono sul legno, la regina ride la sua ultima risata e le arpie
            cadono. Gli operai di Valpeltro tornano a casa, e Asvorko promette di
            cambiare.

            La sala si alza in piedi. Da un palco anche Julia Castaldi applaude,
            con i guanti. Dopo lo spettacolo Orazio ti mette in mano un
            sacchetto di velluto con la tua parte dell'incasso.
          effetti: { monete: 18, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { espressivita: 5 }
        fallimento:
          titolo: Il tunnel, signore
          testo: |
            Apri la bocca e la battuta non c'è più. Al suo posto c'è un fischio
            sottile nelle orecchie e la lingua secca contro il palato. Dalla
            quinta Mauro te ne sussurra una, ed è quella del tunnel di
            contrabbando. Tu la ripeti ad alta voce, nel nido delle arpie, davanti
            a mille persone.

            Orazio non fa una piega. Si pente lo stesso, dicendo che perfino i
            tunnel gli hanno insegnato qualcosa, e la sala lo prende per satira
            e ride. L'applauso alla fine è lungo, e la tua parte dell'incasso
            arriva comunque, un po' più leggera.

            {politica-ed-economia Media} Per la Gilda un tunnel di contrabbando è
            una gabella non pagata, e stasera ci ride sopra soltanto perché è
            seduta a teatro.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1 }
          pe: { espressivita: 3 }
      - testo: "Manovrare le ali e il golem dalle quinte"
        descrizione: "Due cordini per le ali della regina, uno sportello per il golem, e nessuno deve vederti."
        requisiti: [teatro.ruolo == 2]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Ali nere
          testo: |
            Il golem avanza sulla carriola di Grusk e si spacca nel punto giusto,
            e la prima fila sobbalza. Quando la regina ride tiri i cordini, e le
            ali si aprono fino in fondo, nere sotto le lampade. In sala si sente
            un grido trattenuto, e a te tremano le mani sul cordino per tutto il
            resto della scena.

            Dopo lo spettacolo un mercante della Gilda ti cerca dietro le quinte.
            Vuole sapere chi ha costruito quelle ali e ti lascia il suo nome per
            un lavoro, mentre Orazio ti conta in mano la tua parte dell'incasso.
          effetti: { monete: 16, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: La testa del golem
          testo: |
            A metà del combattimento la testa del golem si stacca, rotola giù dal
            palco e si ferma ai piedi di un mercante della Gilda in prima fila.
            Lui la guarda come si guarda un conto sbagliato. Tu, dietro la quinta,
            pianti le dita nel velluto del sipario.

            {percezione Facile} Orazio ha già una battuta pronta. Si vede dal modo
            in cui si gonfia il petto prima di parlare.

            Orazio non perde il ritmo. «Così finiscono i golem di chi tradisce i
            lavoratori!» grida, e la sala applaude. La serata va avanti fino al
            pentimento di Asvorko, e la tua parte dell'incasso arriva lo stesso.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1 }
          pe: { tecnologia: 3 }
      - testo: "Far scattare le trappole di cartapesta"
        descrizione: "Il pozzo nascosto e la trave instabile dipendono da te, e da quanto sei svelto con le funi."
        requisiti: [teatro.ruolo == 3]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Facile }
        successo:
          titolo: Le trappole del nido
          testo: |
            Apri la botola del pozzo nascosto sotto il primo orco, lasci cadere
            la trave di cartapesta un palmo davanti agli avventurieri e fai
            scattare l'arco con una freccia di piuma. A ogni trappola il loggione
            urla, e Asvorko arriva al pentimento con la sala già in piedi.

            {acrobazia Media} Le funi sono tre e le mani due, perciò la terza la
            tieni con un piede puntato sulla stanga della ruota. Il corpo ha
            imparato il giro alle prove e stasera lo fa da solo.

            Dopo lo spettacolo il vecchio macchinista ti fa un cenno con la testa.
            Orazio ti paga la tua parte dell'incasso e ti dice che un giorno
            racconterai di questa sera ai nipoti.
          effetti: { monete: 14, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { atletica: 5 }
        fallimento:
          titolo: Grusk sta bene
          testo: |
            Sbagli fune, e la botola del pozzo si apre sotto Grusk invece che
            sotto l'orco. Grusk sparisce, e in sala cade un silenzio lungo, nel
            quale senti benissimo il tuo cuore.

            Poi la sua testa riemerge dal pavimento. «Grusk sta bene!» annuncia
            al pubblico, e la sala viene giù dalle risate. Orazio dirà poi che
            è stato il momento più alto della serata, e ti paga la tua parte con
            una smorfia.
          effetti: { monete: 10, racconto: 1, pista.teatro: 1 }
          pe: { atletica: 3 }
      - testo: "Restare al tuo posto quando la regina apre le ali"
        descrizione: "Nel nido la regina ha una battuta sulle ali che alle prove ti era scivolata addosso. Stasera, nella sala buia, la senti in un altro modo."
        requisiti: [pista.sepolcro >= 5]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Sangue freddo
          testo: |
            Violante apre le ali sopra Asvorko. «Spezzatemi le ali quante volte
            volete, signor Asvorko. La regina torna sempre.» Ti torna in mente
            una voce rotta, sulla Roccia di Wren, e il sudore ti si raffredda
            sulla nuca. *È una battuta, e l'ha scritta Orazio.* Le tue mani
            cercano la cintura, e le rimetti dove devono stare.

            {resilienza Media} La Roccia è lontana, e qui intorno è tutto
            cartapesta. Conti le piume del mantello, una fila alla volta, finché
            la voce rotta torna a essere la voce di Violante.

            Fai la tua parte fino in fondo, e nessuno in sala si accorge di
            niente. Agli applausi Violante ti stringe la mano un momento più del
            necessario, poi Orazio ti paga la tua parte dell'incasso.
          effetti: { monete: 15, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { resilienza: 5 }
        fallimento:
          titolo: Fermo in scena
          testo: |
            Violante apre le ali sopra Asvorko. «Spezzatemi le ali quante volte
            volete, signor Asvorko. La regina torna sempre.» Ti si gela il sangue
            e resti fermo, con la bocca aperta e mille persone che aspettano. Le
            mani cercano la cintura, e la cintura stasera è di scena.

            Violante se ne accorge. Ti gira intorno con le ali spalancate e
            inventa una battuta che ti rimette in scena. Orazio, dopo, giura che
            la tua è stata la pausa più ispirata della serata, e ti paga senza
            sapere perché ti tremano ancora le dita.
          effetti: { monete: 12, racconto: 1, tormento: 0.5, pista.teatro: 1 }
          pe: { resilienza: 3 }
      - testo: "Trattare Asvorko come un socio della Gilda"
        descrizione: "Asvorko conta le monete come certi soci della Casa dei Nodi, e di soci così ne hai visti tanti da dietro il banco. La battuta suona meglio detta come si chiude un affare al banco."
        requisiti: [teatro.ruolo == 1]
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: L'affare chiuso
          testo: |
            Non alzi la voce. Ti avvicini ad Asvorko come ci si avvicina a un
            socio che ha sbagliato un conto, e gli dici la battuta piano, con
            la pazienza che si usa quando il conto è già fatto. In platea la
            mezza Gilda riconosce il tono prima delle parole, e qualcuno ride
            sotto i baffi.

            {politica-ed-economia Media} Ridono perché quella voce l'hanno usata
            anche loro, e stasera la sentono dall'altra parte del banco.

            Orazio crolla in ginocchio con le lacrime vere, la regina ride la
            sua ultima risata e le arpie cadono. La sala si alza in piedi, e da
            un palco anche Julia Castaldi applaude, con i guanti. Dopo lo
            spettacolo Orazio ti mette in mano un sacchetto di velluto con la
            tua parte dell'incasso.
          effetti: { monete: 18, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { persuasione: 5 }
        fallimento:
          titolo: La voce del mercato
          testo: |
            A metà battuta la voce ti scivola nel tono del Mercato dei Nodi, e
            ad Asvorko annunci il suo errore come si annuncia un prezzo di
            fine giornata. Il loggione ride nel punto sbagliato, e tu senti le
            orecchie diventare calde sotto il cerone.

            Orazio non fa una piega. Si pente lo stesso, con un tono da
            debitore che la sala prende per satira, e alla fine l'applauso è
            lungo. La tua parte dell'incasso arriva comunque, un po' più
            leggera.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1 }
          pe: { persuasione: 3 }
      - testo: "Guardare Asvorko negli occhi"
        descrizione: "A Ghoran chi contava le monete si guardava dal basso, con la schiena curva. Stasera Asvorko è soltanto Orazio con il cerone, e la battuta gliela puoi dire in faccia."
        requisiti: [teatro.ruolo == 1]
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Gli occhi alti
          testo: |
            Quando Asvorko alza la testa dal suo mucchio di monete, tu la
            schiena non la curvi. Gli vai sotto fino a un passo e gli dici la
            battuta guardandolo dritto, con una voce bassa che non hai mai
            usato davanti a un padrone. Orazio indietreggia di mezzo passo, e il
            copione non lo prevede.

            {intimidire Media} Per un momento ha avuto paura davvero, e lo
            sapete solo voi due. Il pubblico ha visto un grande attore.

            Poi crolla in ginocchio e si pente con le lacrime vere, e le arpie
            cadono. La sala si alza in piedi, e da un palco anche Julia
            Castaldi applaude, con i guanti. Orazio ti mette in mano la tua
            parte dell'incasso e non ti chiede dove hai imparato.
          effetti: { monete: 18, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { intimidire: 5 }
        fallimento:
          titolo: La schiena curva
          testo: |
            Asvorko alza la testa dal suo mucchio di monete, e la schiena ti si
            curva da sola, con gli occhi sulle assi del palco, come quando
            passavano i sorveglianti. La battuta la dici al pavimento, e in
            sala qualcuno tossisce.

            Orazio non fa una piega. Si inginocchia per raccoglierla, e si
            pente lo stesso, rivolto alle tue scarpe. La sala lo prende per una
            trovata di regia e applaude a lungo. La tua parte dell'incasso
            arriva comunque, un po' più leggera.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1 }
          pe: { intimidire: 3 }
      - testo: "Aprire le ali come le apre un rapace"
        descrizione: "Nel Bosco di Velthar hai guardato abbastanza uccelli da sapere che le ali grandi non si aprono in un colpo solo. Con due cordini lo puoi fare anche qui."
        requisiti: [teatro.ruolo == 2]
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il rapace
          testo: |
            Quando la regina ride tiri il primo cordino a metà, e le ali si
            sollevano piegate, come quelle di un rapace che si scrolla prima di
            partire. Poi tiri il secondo, e si aprono fino in fondo, nere sotto
            le lampade. In sala si sente un grido trattenuto, e il golem avanza
            sulla carriola di Grusk e si spacca nel punto giusto.

            Dopo lo spettacolo un mercante della Gilda ti cerca dietro le
            quinte. Vuole sapere chi ha costruito quelle ali e ti lascia il suo
            nome per un lavoro, mentre Orazio ti conta in mano la tua parte
            dell'incasso.
          effetti: { monete: 16, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { natura: 5 }
        fallimento:
          titolo: Il passero bagnato
          testo: |
            Tiri il secondo cordino troppo presto, e le ali, invece di aprirsi,
            tremano a mezz'aria come quelle di un passero che si scuote la
            pioggia di dosso. Dal loggione parte una risata.

            Violante non perde il ritmo, si scuote anche lei e trasforma la
            risata dell'arpia in un verso di stizza. Orazio dirà poi che era
            voluto. La serata arriva fino al pentimento di Asvorko, e la tua
            parte dell'incasso arriva lo stesso.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1 }
          pe: { natura: 3 }
      - testo: "Lavorare le funi come sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice una corda si tiene con tutto il corpo e si molla al segnale. Le funi del teatro pesano meno, e nessuno ci sta appeso sopra il vuoto."
        requisiti: [teatro.ruolo == 3]
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Al segnale
          testo: |
            Ti avvolgi la fune del pozzo intorno all'avambraccio come sulle
            piattaforme, con il piede puntato sulla stanga della ruota, e aspetti
            il segnale. Apri la botola sotto il primo orco, lasci cadere la
            trave di cartapesta un palmo davanti agli avventurieri e fai
            scattare l'arco con la freccia di piuma, una cosa dopo l'altra, al
            ritmo con cui si cala un compagno nella Cicatrice. A ogni trappola
            il loggione urla.

            {atletica Facile} Il corpo conosce il lavoro meglio di te. Le braccia
            tirano, e le gambe tengono il peso.

            Dopo lo spettacolo il vecchio macchinista ti guarda l'avambraccio,
            dove la fune ha lasciato il segno, e ti fa un cenno con la testa.
            Orazio ti paga la tua parte dell'incasso.
          effetti: { monete: 14, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { atletica: 5 }

  # Variante: il palco dei Malgrani è vuoto, e Sigor lo fa il vecchio macchinista.
  - id: la-prima-della-promessa-dopo-i-malgrani
    presso: teatro-delle-meraviglie
    immagine: personaggi/violante
    titolo: La prima della Promessa
    sommario: "Il manifesto ha una data nuova e la platea è piena fino al loggione. Stasera Orazio alza il sipario sulla Promessa dell'Arpia."
    luogo: Teatro delle Meraviglie di Belcanto, la sera della prima
    area: quartieri-alti
    requisiti: [pista.teatro == 1, prove.arpia >= 3, pista.pelle >= 5]
    mostra: 2
    testo: |
      Sulla striscia *rinviata* del manifesto è stata incollata una data
      nuova, e stasera la platea è piena fino al loggione. Il palco dei
      Malgrani in seconda fila è vuoto, con le tende tirate, e la Casa dei
      Nodi ha mandato mezza Gilda. Dalle quinte senti l'odore delle lampade
      e del sudore della compagnia, e ti sorprendi ad abbottonare e
      sbottonare lo stesso bottone della giubba.

      {galateo Facile} Un palco vuoto alla prima, con le tende tirate, è un
      messaggio. Lo leggono tutti, e tutti fingono di guardare il sipario.

      {politica-ed-economia Media} Mezza Gilda in platea per un'opera sugli
      operai delle miniere. Domani nei salotti si discuterà di chi ha
      applaudito, e di quanto.

      {origine rampollo-dei-quartieri-alti} Il palco della tua famiglia, in
      terza fila, ha la tenda aperta. Da dietro la quinta non vedi chi c'è
      dentro, e ti tiri giù le maniche fino alle nocche.

      {origine mercante-dei-ponti} Fra la mezza Gilda in platea riconosci
      l'esattore che dopo la razzia è passato a controllare il tuo banco.
      Stasera è vestito meglio di quanto l'hai mai visto, e sta già contando
      le file di poltrone muovendo le labbra.

      Orazio apre il primo atto. Il suo Asvorko conta le monete delle
      miniere di Valpeltro una per una, e quando la regina arpia entra
      nell'ufficio avvolta nel mantello di piume la sala smette di frusciare.
      Violante gli promette la lealtà degli operai in cambio di un nido
      nelle gallerie, e Asvorko accetta. Alla terza scena Grusk si presenta
      come «Grusk, signore», e il loggione ride così forte che lui fa un
      inchino. Quando Rilla si siede sulla scrivania di Asvorko, dal
      loggione parte un fischio, e Orazio, sotto il cerone, arrossisce lo
      stesso.

      Nel secondo atto il vecchio macchinista, nei panni di Sigor, assolda gli
      avventurieri alla taverna del Fiasco Asciutto e apre il tunnel di
      contrabbando sotto le botti. Poi viene il terzo atto, con gli orchi in
      maschera e il golem di cartapesta. Nel nido aspettano le trappole, e il
      momento che hai provato tante volte è arrivato.
    opzioni:
      - testo: "Affrontare Asvorko nel nido delle arpie"
        descrizione: "La scena ottava è tua. Davanti hai Orazio in ginocchio e mille persone al buio."
        requisiti: [teatro.ruolo == 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Un errore imperdonabile
          testo: |
            Pianti i piedi sulle assi e dici la battuta all'ultima fila senza
            fretta. Senti la sala tacere un pezzo alla volta, dalla platea fino al
            loggione.

            {espressivita Media} Per la durata di una battuta mille persone al
            buio stanno ferme quando stai fermo tu, e nessuno ti aveva detto che potesse
            piacere così tanto.

            Orazio crolla in ginocchio e si pente con le lacrime vere e gli anelli
            che battono sul legno, la regina ride la sua ultima risata e le arpie
            cadono. Gli operai di Valpeltro tornano a casa, e Asvorko promette di
            cambiare.

            La sala si alza in piedi. Da un palco anche Julia Castaldi applaude,
            con i guanti. Dopo lo spettacolo Orazio ti mette in mano un
            sacchetto di velluto con la tua parte dell'incasso.
          effetti: { monete: 18, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { espressivita: 5 }
        fallimento:
          titolo: Il tunnel, signore
          testo: |
            Apri la bocca e la battuta non c'è più. Al suo posto c'è un fischio
            sottile nelle orecchie e la lingua secca contro il palato. Dalla
            quinta il vecchio macchinista te ne sussurra una, ed è quella del
            tunnel di contrabbando. Tu la ripeti ad alta voce, nel nido delle
            arpie, davanti a mille persone.

            Orazio non fa una piega. Si pente lo stesso, dicendo che perfino i
            tunnel gli hanno insegnato qualcosa, e la sala lo prende per satira
            e ride. L'applauso alla fine è lungo, e la tua parte dell'incasso
            arriva comunque, un po' più leggera.

            {politica-ed-economia Media} Per la Gilda un tunnel di contrabbando è
            una gabella non pagata, e stasera ci ride sopra soltanto perché è
            seduta a teatro.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1 }
          pe: { espressivita: 3 }
      - testo: "Manovrare le ali e il golem dalle quinte"
        descrizione: "Due cordini per le ali della regina, uno sportello per il golem, e nessuno deve vederti."
        requisiti: [teatro.ruolo == 2]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Ali nere
          testo: |
            Il golem avanza sulla carriola di Grusk e si spacca nel punto giusto,
            e la prima fila sobbalza. Quando la regina ride tiri i cordini, e le
            ali si aprono fino in fondo, nere sotto le lampade. In sala si sente
            un grido trattenuto, e a te tremano le mani sul cordino per tutto il
            resto della scena.

            Dopo lo spettacolo un mercante della Gilda ti cerca dietro le quinte.
            Vuole sapere chi ha costruito quelle ali e ti lascia il suo nome per
            un lavoro, mentre Orazio ti conta in mano la tua parte dell'incasso.
          effetti: { monete: 16, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: La testa del golem
          testo: |
            A metà del combattimento la testa del golem si stacca, rotola giù dal
            palco e si ferma ai piedi di un mercante della Gilda in prima fila.
            Lui la guarda come si guarda un conto sbagliato. Tu, dietro la quinta,
            pianti le dita nel velluto del sipario.

            {percezione Facile} Orazio ha già una battuta pronta. Si vede dal modo
            in cui si gonfia il petto prima di parlare.

            Orazio non perde il ritmo. «Così finiscono i golem di chi tradisce i
            lavoratori!» grida, e la sala applaude. La serata va avanti fino al
            pentimento di Asvorko, e la tua parte dell'incasso arriva lo stesso.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1 }
          pe: { tecnologia: 3 }
      - testo: "Far scattare le trappole di cartapesta"
        descrizione: "Il pozzo nascosto e la trave instabile dipendono da te, e da quanto sei svelto con le funi."
        requisiti: [teatro.ruolo == 3]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Facile }
        successo:
          titolo: Le trappole del nido
          testo: |
            Apri la botola del pozzo nascosto sotto il primo orco, lasci cadere
            la trave di cartapesta un palmo davanti agli avventurieri e fai
            scattare l'arco con una freccia di piuma. A ogni trappola il loggione
            urla, e Asvorko arriva al pentimento con la sala già in piedi.

            {acrobazia Media} Le funi sono tre e le mani due, perciò la terza la
            tieni con un piede puntato sulla stanga della ruota. Il corpo ha
            imparato il giro alle prove e stasera lo fa da solo.

            Dopo lo spettacolo il vecchio macchinista ti fa un cenno con la testa.
            Orazio ti paga la tua parte dell'incasso e ti dice che un giorno
            racconterai di questa sera ai nipoti.
          effetti: { monete: 14, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { atletica: 5 }
        fallimento:
          titolo: Grusk sta bene
          testo: |
            Sbagli fune, e la botola del pozzo si apre sotto Grusk invece che
            sotto l'orco. Grusk sparisce, e in sala cade un silenzio lungo, nel
            quale senti benissimo il tuo cuore.

            Poi la sua testa riemerge dal pavimento. «Grusk sta bene!» annuncia
            al pubblico, e la sala viene giù dalle risate. Orazio dirà poi che
            è stato il momento più alto della serata, e ti paga la tua parte con
            una smorfia.
          effetti: { monete: 10, racconto: 1, pista.teatro: 1 }
          pe: { atletica: 3 }
      - testo: "Restare al tuo posto quando la regina apre le ali"
        descrizione: "Nel nido la regina ha una battuta sulle ali che alle prove ti era scivolata addosso. Stasera, nella sala buia, la senti in un altro modo."
        requisiti: [pista.sepolcro >= 5]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Sangue freddo
          testo: |
            Violante apre le ali sopra Asvorko. «Spezzatemi le ali quante volte
            volete, signor Asvorko. La regina torna sempre.» Ti torna in mente
            una voce rotta, sulla Roccia di Wren, e il sudore ti si raffredda
            sulla nuca. *È una battuta, e l'ha scritta Orazio.* Le tue mani
            cercano la cintura, e le rimetti dove devono stare.

            {resilienza Media} La Roccia è lontana, e qui intorno è tutto
            cartapesta. Conti le piume del mantello, una fila alla volta, finché
            la voce rotta torna a essere la voce di Violante.

            Fai la tua parte fino in fondo, e nessuno in sala si accorge di
            niente. Agli applausi Violante ti stringe la mano un momento più del
            necessario, poi Orazio ti paga la tua parte dell'incasso.
          effetti: { monete: 15, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { resilienza: 5 }
        fallimento:
          titolo: Fermo in scena
          testo: |
            Violante apre le ali sopra Asvorko. «Spezzatemi le ali quante volte
            volete, signor Asvorko. La regina torna sempre.» Ti si gela il sangue
            e resti fermo, con la bocca aperta e mille persone che aspettano. Le
            mani cercano la cintura, e la cintura stasera è di scena.

            Violante se ne accorge. Ti gira intorno con le ali spalancate e
            inventa una battuta che ti rimette in scena. Orazio, dopo, giura che
            la tua è stata la pausa più ispirata della serata, e ti paga senza
            sapere perché ti tremano ancora le dita.
          effetti: { monete: 12, racconto: 1, tormento: 0.5, pista.teatro: 1 }
          pe: { resilienza: 3 }
      - testo: "Trattare Asvorko come un socio della Gilda"
        descrizione: "Asvorko conta le monete come certi soci della Casa dei Nodi, e di soci così ne hai visti tanti da dietro il banco. La battuta suona meglio detta come si chiude un affare al banco."
        requisiti: [teatro.ruolo == 1]
        quando: [origine.mercante-dei-ponti >= 1]
