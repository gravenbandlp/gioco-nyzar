  # ------------------------------------------------------------ 1 → 2 · la prima
  - id: la-prima-della-promessa
    presso: teatro-delle-meraviglie
    immagine: personaggi/violante
    titolo: La prima della Promessa
    sommario: "Il manifesto ha una data nuova e la platea è piena fino al loggione per la Promessa dell'Arpia."
    luogo: Teatro delle Meraviglie di Belcanto, la sera della prima
    area: quartieri-alti
    # Lucia Malgrani nel suo palco e Mauro Scrocco in scena: solo prima che la Caserma si muova contro
    # i Malgrani e la Pignatta (pista.pelle 5). Dopo vale la-prima-della-promessa-dopo-i-malgrani.
    requisiti: [pista.teatro == 1, prove.arpia >= 3, pista.pelle < 5]
    mostra: 2
    testo: |
      Sulla striscia *rinviata* del manifesto è stata incollata una data
      nuova, e stasera la platea è piena. Lucia Malgrani è sola nel suo palco
      in seconda fila, dritta come una candela, e la Casa dei Nodi ha mandato
      mezza Gilda. Dietro la quinta ti sorprendi ad abbottonare e sbottonare
      lo stesso bottone della giubba.

      {empatia Media} Sola in un palco intero, senza appoggiarsi allo
      schienale, Lucia Malgrani è venuta a farsi vedere più che a vedere.

      {origine rampollo-dei-quartieri-alti} Il palco della tua famiglia, in
      terza fila, ha la tenda aperta, e ti tiri giù le maniche fino alle
      nocche.

      {origine mercante-dei-ponti} Fra la mezza Gilda riconosci l'esattore
      che dopo la razzia ha controllato il tuo banco.

      Nel primo atto l'Asvorko di Orazio conta le monete delle miniere di
      Valpeltro, e quando la regina arpia entra avvolta nel mantello di piume
      la sala smette di frusciare. Violante gli promette la lealtà degli
      operai in cambio di un nido nelle gallerie, e Asvorko accetta.

      Nel secondo atto Mauro Scrocco, nei panni di Sigor, assolda gli
      avventurieri al Fiasco Asciutto e apre il tunnel di contrabbando sotto
      le botti. Poi viene il terzo atto, con gli orchi in maschera e il golem
      di cartapesta, e nel nido delle arpie arriva il momento che hai provato
      tante volte.
    opzioni:
      - testo: "Affrontare Asvorko nel nido delle arpie"
        descrizione: "La scena ottava è tua. Davanti hai Orazio in ginocchio e mille persone al buio."
        requisiti: [teatro.ruolo == 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Un errore imperdonabile
          testo: |
            Pianti i piedi sulle assi e dici la battuta all'ultima fila senza fretta, e
            la sala tace un pezzo alla volta, dalla platea fino al loggione. Orazio
            crolla in ginocchio con le lacrime vere e le arpie cadono.

            La sala si alza in piedi, e da un palco applaude anche Julia Castaldi, con i
            guanti. Dopo lo spettacolo Orazio ti dà un sacchetto di velluto con la tua
            parte dell'incasso.
          effetti: { monete: 18, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { espressivita: 5 }
        fallimento:
          titolo: Il tunnel, signore
          testo: |
            Apri la bocca e la battuta non c'è più. Dalla quinta Mauro te ne
            sussurra una, quella del tunnel di contrabbando, e tu la ripeti ad
            alta voce nel nido delle arpie, davanti a mille persone. Orazio si
            pente lo stesso, dicendo che perfino i tunnel gli hanno insegnato
            qualcosa, e la sala lo prende per satira e ride. La tua parte
            dell'incasso arriva comunque, un po' più leggera.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { espressivita: 3 }
      - testo: "Manovrare le ali e il golem dalle quinte"
        descrizione: "Due cordini per le ali della regina e uno sportello per il golem, e nessuno deve vederti."
        requisiti: [teatro.ruolo == 2]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Ali nere
          testo: |
            Il golem avanza sulla carriola di Grusk e si spacca nel punto giusto,
            e quando la regina ride tiri i cordini e le ali si aprono fino in
            fondo, nere sotto le lampade. Dopo lo spettacolo un mercante della
            Gilda ti lascia il suo nome per un lavoro, mentre Orazio ti conta in
            mano la tua parte dell'incasso.
          effetti: { monete: 16, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: La testa del golem
          testo: |
            A metà del combattimento la testa del golem si stacca e rotola ai
            piedi di un mercante della Gilda in prima fila, che la guarda come un
            conto sbagliato. Orazio non perde il ritmo. «Così finiscono i golem di
            chi tradisce i lavoratori!» grida, e la sala applaude. La tua parte
            dell'incasso arriva lo stesso.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { tecnologia: 3 }
      - testo: "Far scattare le trappole di cartapesta"
        descrizione: "Il pozzo nascosto e la trave instabile dipendono da te, e da quanto sei svelto con le funi."
        requisiti: [teatro.ruolo == 3]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Facile }
        successo:
          titolo: Le trappole del nido
          testo: |
            Apri la botola del pozzo nascosto sotto il primo orco, lasci cadere la
            trave di cartapesta un palmo davanti agli avventurieri e fai scattare
            l'arco con una freccia di piuma. A ogni trappola il loggione urla, e
            dopo lo spettacolo il vecchio macchinista ti fa un cenno con la testa
            mentre Orazio ti paga la tua parte.
          effetti: { monete: 14, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { atletica: 5 }
        fallimento:
          titolo: Grusk sta bene
          testo: |
            Sbagli fune, e la botola del pozzo si apre sotto Grusk invece che
            sotto l'orco. Dopo un silenzio lungo la sua testa riemerge dal
            pavimento. «Grusk sta bene!» annuncia, e la sala viene giù dalle
            risate. Orazio dirà che è stato il momento più alto della serata, e ti
            paga la tua parte con una smorfia.
          effetti: { monete: 10, racconto: 1, pista.teatro: 1 }
          pe: { atletica: 3 }
      - testo: "Restare al tuo posto quando la regina apre le ali"
        descrizione: "Nel nido la regina ha una battuta sulle ali che alle prove ti era scivolata addosso."
        requisiti: [pista.sepolcro >= 5]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Sangue freddo
          testo: |
            Violante apre le ali sopra Asvorko. «Spezzatemi le ali quante volte
            volete, signor Asvorko. La regina torna sempre.» Ti torna in mente una
            voce rotta, sulla Roccia di Wren, e le mani ti vanno alla cintura. *È
            una battuta, e l'ha scritta Orazio.* Le rimetti a posto e fai la tua
            parte fino in fondo, e agli applausi Violante ti stringe la mano un
            momento più del necessario.
          effetti: { monete: 15, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { resilienza: 5 }
        fallimento:
          titolo: Fermo in scena
          testo: |
            Violante apre le ali sopra Asvorko. «Spezzatemi le ali quante volte
            volete, signor Asvorko. La regina torna sempre.» Resti fermo, con la
            bocca aperta e mille persone che aspettano, e le mani cercano una
            cintura che stasera è di scena. Violante ti gira intorno e inventa una
            battuta che ti rimette in scena, e Orazio giura che la tua è stata la
            pausa più ispirata della serata.
          effetti: { monete: 12, racconto: 1, tormento: 1, pista.teatro: 1 }
          pe: { resilienza: 3 }
      - testo: "Trattare Asvorko come un socio della Gilda"
        descrizione: "Asvorko conta le monete come certi soci della Casa dei Nodi che hai visto dal banco."
        requisiti: [teatro.ruolo == 1]
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: L'affare chiuso
          testo: |
            Ti avvicini ad Asvorko come a un socio che ha sbagliato un conto e gli
            dici la battuta con la pazienza di un creditore. In platea la mezza
            Gilda riconosce il tono, e qualcuno ride sotto i baffi. Orazio crolla
            in ginocchio con le lacrime vere, e da un palco applaude anche Julia
            Castaldi, con i guanti. Dopo, ricevi un sacchetto di velluto con la
            tua parte dell'incasso.
          effetti: { monete: 18, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { persuasione: 5 }
        fallimento:
          titolo: La voce del mercato
          testo: |
            A metà battuta la voce ti scivola nel tono del Mercato dei Nodi, e
            annunci ad Asvorko il suo errore come un prezzo di fine giornata. Il
            loggione ride nel punto sbagliato. Orazio si pente lo stesso, con un
            tono da debitore che la sala prende per satira, e la tua parte
            dell'incasso arriva comunque, un po' più leggera.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { persuasione: 3 }
      - testo: "Guardare Asvorko negli occhi"
        descrizione: "A Ghoran chi contava le monete si guardava dal basso, ma stasera Asvorko è soltanto Orazio con il cerone."
        requisiti: [teatro.ruolo == 1]
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Gli occhi alti
          testo: |
            Quando Asvorko alza la testa dal suo mucchio di monete, la schiena non
            la curvi. Gli vai sotto e gli dici la battuta guardandolo dritto, con
            una voce che non hai mai usato davanti a un padrone, e Orazio
            indietreggia di mezzo passo, fuori copione. Poi crolla in ginocchio,
            da un palco applaude anche Julia Castaldi, e Orazio ti paga la tua
            parte senza chiederti dove hai imparato.
          effetti: { monete: 18, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { intimidire: 5 }
        fallimento:
          titolo: La schiena curva
          testo: |
            Asvorko alza la testa dal suo mucchio di monete, e la schiena ti si
            curva da sola, con gli occhi sulle assi, come quando passavano i
            sorveglianti. La battuta la dici al pavimento. Orazio si inginocchia e
            si pente lo stesso, rivolto alle tue scarpe, e la sala lo prende per
            una trovata di regia. La tua parte arriva un po' più leggera.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { intimidire: 3 }
      - testo: "Aprire le ali come le apre un rapace"
        descrizione: "Nel Bosco di Velthar hai imparato che le ali grandi non si aprono in un colpo solo."
        requisiti: [teatro.ruolo == 2]
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il rapace
          testo: |
            Quando la regina ride tiri il primo cordino a metà, e le ali si
            sollevano piegate come quelle di un rapace che si scrolla prima di
            partire. Poi tiri il secondo, e si aprono fino in fondo, nere sotto le
            lampade. Dopo lo spettacolo un mercante della Gilda ti lascia il suo
            nome per un lavoro, mentre Orazio ti paga la tua parte dell'incasso.
          effetti: { monete: 16, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { natura: 5 }
        fallimento:
          titolo: Il passero bagnato
          testo: |
            Tiri il secondo cordino troppo presto, e le ali tremano a mezz'aria
            come quelle di un passero sotto la pioggia, mentre dal loggione parte
            una risata. Violante si scuote anche lei e trasforma la risata
            dell'arpia in un verso di stizza. Orazio dirà poi che era voluto, e la
            tua parte dell'incasso arriva lo stesso.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { natura: 3 }
      - testo: "Lavorare le funi come sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice una corda si tiene con tutto il corpo e si molla al segnale."
        requisiti: [teatro.ruolo == 3]
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Al segnale
          testo: |
            Ti avvolgi la fune del pozzo intorno all'avambraccio come sulle
            piattaforme e al segnale fai scattare le trappole una dopo l'altra, al
            ritmo con cui si cala un compagno nella Cicatrice. A ogni trappola il
            loggione urla. Dopo, il vecchio macchinista ti guarda il segno della
            fune sull'avambraccio e ti fa un cenno con la testa, e Orazio ti paga
            la tua parte.
          effetti: { monete: 14, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { atletica: 5 }

  # Variante: il palco dei Malgrani è vuoto, e Sigor lo fa il vecchio macchinista.
  - id: la-prima-della-promessa-dopo-i-malgrani
    presso: teatro-delle-meraviglie
    immagine: personaggi/violante
    titolo: La prima della Promessa
    sommario: "Il manifesto ha una data nuova e la platea è piena fino al loggione per la Promessa dell'Arpia."
    luogo: Teatro delle Meraviglie di Belcanto, la sera della prima
    area: quartieri-alti
    requisiti: [pista.teatro == 1, prove.arpia >= 3, pista.pelle >= 5]
    mostra: 2
    testo: |
      Sulla striscia *rinviata* del manifesto è stata incollata una data
      nuova, e stasera la platea è piena. Il palco dei Malgrani in seconda
      fila è vuoto, con le tende tirate, e la Casa dei Nodi ha mandato mezza
      Gilda. Dietro la quinta ti sorprendi ad abbottonare e sbottonare lo
      stesso bottone della giubba.

      {galateo Facile} Un palco vuoto alla prima, con le tende tirate, è un
      messaggio che tutti leggono fingendo di guardare il sipario.

      {origine rampollo-dei-quartieri-alti} Il palco della tua famiglia, in
      terza fila, ha la tenda aperta, e ti tiri giù le maniche fino alle
      nocche.

      {origine mercante-dei-ponti} Fra la mezza Gilda riconosci l'esattore che
      dopo la razzia ha controllato il tuo banco.

      Nel primo atto l'Asvorko di Orazio conta le monete delle miniere di
      Valpeltro, e quando la regina arpia entra avvolta nel mantello di piume
      la sala smette di frusciare. Violante gli promette la lealtà degli
      operai in cambio di un nido nelle gallerie, e Asvorko accetta.

      Nel secondo atto il vecchio macchinista, nei panni di Sigor, assolda gli
      avventurieri al Fiasco Asciutto e apre il tunnel di contrabbando sotto
      le botti. Poi viene il terzo atto, con gli orchi in maschera e il golem
      di cartapesta, e nel nido delle arpie arriva il momento che hai provato
      tante volte.
    opzioni:
      - testo: "Affrontare Asvorko nel nido delle arpie"
        descrizione: "La scena ottava è tua. Davanti hai Orazio in ginocchio e mille persone al buio."
        requisiti: [teatro.ruolo == 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Un errore imperdonabile
          testo: |
            Pianti i piedi sulle assi e dici la battuta all'ultima fila senza fretta, e
            la sala tace un pezzo alla volta, dalla platea fino al loggione. Orazio
            crolla in ginocchio con le lacrime vere e le arpie cadono.

            La sala si alza in piedi, e da un palco applaude anche Julia Castaldi, con i
            guanti. Dopo lo spettacolo Orazio ti dà un sacchetto di velluto con la tua
            parte dell'incasso.
          effetti: { monete: 18, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { espressivita: 5 }
        fallimento:
          titolo: Il tunnel, signore
          testo: |
            Apri la bocca e la battuta non c'è più. Dalla quinta il vecchio
            macchinista te ne sussurra una, quella del tunnel di contrabbando, e
            tu la ripeti nel nido delle arpie davanti a mille persone. Orazio si
            pente lo stesso, dicendo che perfino i tunnel gli hanno insegnato
            qualcosa, e la sala lo prende per satira e ride. La tua parte
            dell'incasso arriva comunque, un po' più leggera.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { espressivita: 3 }
      - testo: "Manovrare le ali e il golem dalle quinte"
        descrizione: "Due cordini per le ali della regina e uno sportello per il golem, e nessuno deve vederti."
        requisiti: [teatro.ruolo == 2]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Ali nere
          testo: |
            Il golem avanza sulla carriola di Grusk e si spacca nel punto giusto,
            e quando la regina ride tiri i cordini e le ali si aprono fino in
            fondo, nere sotto le lampade. Dopo lo spettacolo un mercante della
            Gilda ti lascia il suo nome per un lavoro, mentre Orazio ti conta in
            mano la tua parte dell'incasso.
          effetti: { monete: 16, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: La testa del golem
          testo: |
