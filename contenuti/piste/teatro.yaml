  # ------------------------------------------------------------ repliche ripetibili
  - id: le-repliche
    presso: teatro-delle-meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    titolo: Una replica della Promessa
    sommario: "La Promessa dell'Arpia è rimasta in cartellone, e ogni sera c'è da rifarla da capo."
    luogo: Teatro delle Meraviglie di Belcanto, una sera di replica
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.teatro >= 2]
    mostra: 1
    testo: |
      Dopo la prima la Promessa dell'Arpia è rimasta in cartellone, e ogni
      sera la sala si riempie un po' meno, tranne il sabato. Isotta Cordani
      siede sempre nello stesso palco e ride nei punti in cui il resto del
      pubblico tace.

      {galateo Media} Ride nei punti sbagliati di proposito, perché una
      risata da un palco buono decide che cosa domani sarà stato ridicolo.

      Grusk ha imparato a dire Rolan, e ogni tanto non risponde quando lo
      chiamano per la paga. Orazio allunga il pentimento di Asvorko di una
      battuta a sera.
    opzioni:
      - testo: "Recitare l'avventuriero"
        descrizione: "Stessa battuta, stesso Orazio in ginocchio, un pubblico nuovo."
        requisiti: [teatro.ruolo == 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Una buona sera
          testo: |
            Stasera la battuta ti viene come se l'avessi pensata tu, e Orazio
            piange un po' meno del solito per lasciarti la scena. Agli applausi
            una bambina in prima fila prova a ripetere la tua battuta,
            sbagliandola in un modo che ti piace di più, e in camerino Orazio ti
            mette in mano la paga della serata.
          effetti: { monete: 4 }
          pe: { espressivita: 3 }
        fallimento:
          titolo: Il loggione
          testo: |
            Inciampi su una parola e poi sulla trave di cartapesta, e dal loggione
            arriva un fischio lungo. Il giorno dopo un cameriere dei Quartieri
            Alti lo racconta ridendo ai clienti, e fa il tuo nome. Orazio ti paga
            lo stesso, ma in spiccioli.
          effetti: { monete: 1, scandalo: 1 }
      - testo: "Tenere insieme ali e golem"
        descrizione: "La cartapesta, dopo dieci repliche, comincia a stancarsi."
        requisiti: [teatro.ruolo == 2]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Colla e piume
          testo: |
            Prima dello spettacolo rinforzi le cinghie delle ali e ripassi il
            collo del golem con un'altra mano di colla, e tutto si apre e si
            spacca al momento giusto. Uscendo di scena Violante ti lascia in mano
            una piuma caduta, e la paga arriva dopo lo spettacolo, contata due
            volte da Orazio.
          effetti: { monete: 4 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: Piume in platea
          testo: |
            Un'ala si sfilaccia a metà della risata della regina, e le piume nere
            scendono sulla prima fila. Una signora ne trova una nel bicchiere e il
            giorno dopo lo racconta a mezzo quartiere, insieme al tuo nome, e la
            paga stasera è uno spicciolo.
          effetti: { monete: 1, scandalo: 1 }
      - testo: "Stare alle funi e alle botole"
        descrizione: "Funi e botole, un lavoro che nessuno vede finché va bene."
        requisiti: [teatro.ruolo == 3]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Nessuno ti vede
          testo: |
            Le funi scorrono e le botole si aprono quando devono, e per tutta la
            sera nessuno in sala sa che esisti. Alla fine il vecchio macchinista
            ti offre un sorso dalla sua fiaschetta, che di prugne ha soltanto il
            nome, e Orazio ti dà la paga.
          effetti: { monete: 3 }
          pe: { atletica: 3 }
        fallimento:
          titolo: Il sipario a metà
          testo: |
            Il sipario si inceppa a metà sul finale, e Orazio fa l'inchino a un
            pezzo di velluto rosso. Dal palco di Isotta Cordani parte una risata
            che il giorno dopo si sente in tutti i salotti, e Orazio ti paga il
            minimo e non ti rivolge la parola fino a mezzanotte.
          effetti: { monete: 1, scandalo: 1 }

  # ------------------------------------------------------------ carta · Orazio in strada
  - id: carta-belcanto-cerca-attori
    immagine: personaggi/orazio-belcanto
    titolo: Un manifesto fresco di colla
    sommario: "Orazio Belcanto attacca di persona i manifesti della sua opera, e ferma chiunque gli sembri adatto al palcoscenico."
    tipo: carta
    area: quartieri-alti
    requisiti: [pista.teatro == 0]
    testo: |
      In una via dei Quartieri Alti un garzone regge il secchio della colla
      e un altro tiene ferma una scala, in cima alla quale Orazio Belcanto
      liscia con le mani inanellate un manifesto della *Promessa
      dell'Arpia*. Quando ti vede si porta una mano al petto, e la scala
      oscilla.

      «Anima cara, che profilo! La mia Promessa dell'Arpia cerca gente della
      città per il palco e per le quinte.» Scende e ti appoggia sulla spalla
      una mano appiccicosa di colla.

      {persuasione Media} Basta non dire di no abbastanza in fretta, e
      Orazio farà il resto da solo.
    opzioni:
      - testo: "Lasciarti convincere"
        descrizione: "Gli dici che ci penserai, e Orazio sente solo la prima metà della frase."
        quando: [pista.pelle < 5]
        esito:
          titolo: Generosa malizia
          testo: |
            Orazio ti mette in mano un manifesto ancora umido e ti dice di
            presentarti al Teatro delle Meraviglie chiedendo di lui. Poi,
            abbassando la voce in modo che si senta solo a metà strada, ti regala
            un pettegolezzo. Isotta Cordani alla Boutique fa pagare doppio gli
            abiti ai Malgrani, e Lucia Malgrani paga senza capire perché.

            «Non dirlo in giro» dice, e risale sulla scala per il manifesto
            successivo.
          effetti: { informazioni.voce: 1 }
      # Dopo la caduta dei Malgrani (pista.pelle >= 5) il pettegolezzo di Orazio si aggiorna.
      - testo: "Lasciarti convincere"
        descrizione: "Gli dici che ci penserai, e Orazio sente solo la prima metà della frase."
        quando: [pista.pelle >= 5]
        esito:
          titolo: Generosa malizia
          testo: |
            Orazio ti mette in mano un manifesto ancora umido e ti dice di
            presentarti al Teatro delle Meraviglie. Poi, abbassando la voce quel
            tanto che basta, ti regala un pettegolezzo. Isotta Cordani alla
            Boutique per anni ha fatto pagare doppio gli abiti ai Malgrani, e
            adesso che dai Malgrani non arriva più niente se ne lamenta con tutte
            le clienti.

            «Non dirlo in giro» dice, e risale sulla scala.
          effetti: { informazioni.voce: 1 }
      - testo: "Rifiutare con garbo"
        descrizione: "Lo ringrazi, gli lodi il manifesto e gli dici di no."
        esito:
          titolo: L'Arte è paziente
          testo: |
            Orazio sospira con tutto il corpo, una mano sulla fronte, mentre il
            garzone con il secchio alza gli occhi al cielo perché la scena l'ha
            già vista tre volte stamattina. «L'Arte è paziente» dice. «Io molto
            meno, ma ti aspetterò lo stesso.» Prima che tu ti giri sta già
            fermando il passante successivo.
          pe: { galateo: 2 }
