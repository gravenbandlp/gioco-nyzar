          testo: |
            Tiri il secondo cordino troppo presto, e le ali, invece di aprirsi,
            tremano a mezz'aria come quelle di un passero che si scuote la
            pioggia di dosso. Dal loggione parte una risata.

            Violante non perde il ritmo, si scuote anche lei e trasforma la
            risata dell'arpia in un verso di stizza. Orazio dirà poi che era
            voluto. La serata arriva fino al pentimento di Asvorko, e la tua
            parte dell'incasso arriva lo stesso.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1 }
          pe: { natura: 3 }
      - testo: "Lavorare le funi come sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice una corda si tiene con tutto il corpo e si molla al segnale. Le funi del teatro pesano meno, e nessuno ci sta appeso sopra il vuoto."
        requisiti: [teatro.ruolo == 3]
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Al segnale
          testo: |
            Ti avvolgi la fune del pozzo intorno all'avambraccio come sulle
            piattaforme, con il piede puntato sulla stanga della ruota, e aspetti
            il segnale. Apri la botola sotto il primo orco, lasci cadere la
            trave di cartapesta un palmo davanti agli avventurieri e fai
            scattare l'arco con la freccia di piuma, una cosa dopo l'altra, al
            ritmo con cui si cala un compagno nella Cicatrice. A ogni trappola
            il loggione urla.

            {atletica Facile} Il corpo conosce il lavoro meglio di te. Le braccia
            tirano, e le gambe tengono il peso.

            Dopo lo spettacolo il vecchio macchinista ti guarda l'avambraccio,
            dove la fune ha lasciato il segno, e ti fa un cenno con la testa.
            Orazio ti paga la tua parte dell'incasso.
          effetti: { monete: 14, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { atletica: 5 }

  # ------------------------------------------------------------ repliche ripetibili
  - id: le-repliche
    presso: teatro-delle-meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    titolo: Una replica della Promessa
    sommario: "La Promessa dell'Arpia è rimasta in cartellone, e ogni sera c'è da rifarla da capo."
    luogo: Teatro delle Meraviglie di Belcanto, una sera di replica
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.teatro >= 2]
    mostra: 1
    testo: |
      Dopo la prima la Promessa dell'Arpia è rimasta in cartellone, e ogni
      sera la sala si riempie un po' meno, tranne il sabato. Isotta Cordani
      siede sempre nello stesso palco e ride nei punti in cui il resto del
      pubblico tace.

      {galateo Media} Ride nei punti sbagliati di proposito. Una risata da
      un palco buono, nei Quartieri Alti, decide che cosa domani sarà stato
      ridicolo.

      Grusk ha imparato a dire Rolan, e adesso ogni tanto non risponde
      quando lo chiamano per la paga. Orazio ha aggiunto una battuta al
      pentimento di Asvorko e un'altra la sera dopo, e il terzo atto si è
      allungato di dieci minuti. In camerino c'è sempre lo stesso odore di
      cerone e di arance sbucciate, e qualcuno ha appeso al chiodo della
      porta la maschera dell'orco con la colla ormai gialla.

      {resistenza Media fallita} Ti fa male la schiena già prima di
      cominciare. La replica è un mestiere, e il corpo l'ha capito una
      settimana prima di te.

      Il vecchio macchinista accende le lampade della ribalta una alla volta.
      In platea si spengono le chiacchiere, e il sipario aspetta te.
    opzioni:
      - testo: "Recitare l'avventuriero"
        descrizione: "Stessa battuta, stesso Orazio in ginocchio, un pubblico nuovo."
        requisiti: [teatro.ruolo == 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Una buona sera
          testo: |
            Stasera la battuta ti viene come se l'avessi pensata tu, e Orazio
            piange un po' meno del solito per lasciarti la scena. Agli applausi
            una bambina in prima fila ti indica alla madre e prova a ripetere la
            tua battuta, sbagliandola in un modo che ti piace di più. In camerino
            ti fa male la gola, e Orazio ti mette in mano la paga della serata.
          effetti: { monete: 4 }
          pe: { espressivita: 3 }
        fallimento:
          titolo: Il loggione
          testo: |
            Inciampi su una parola e poi sulla trave di cartapesta, e dal
            loggione arriva un fischio lungo. Ti brucia la faccia fino al
            sipario. Il giorno dopo, in un caffè dei Quartieri Alti, un
            cameriere lo racconta ridendo a un tavolo di clienti, e fa il tuo
            nome. Orazio ti paga lo stesso, ma in spiccioli.

            {conoscenze-della-strada Facile} Un cameriere dei Quartieri Alti vive
            di quello che sente e di quello che ripete. Il tuo nome, stamattina,
            gli ha fruttato una mancia.
          effetti: { monete: 1, scandalo: 0.5 }
      - testo: "Tenere insieme ali e golem"
        descrizione: "La cartapesta, dopo dieci repliche, comincia a stancarsi."
        requisiti: [teatro.ruolo == 2]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Colla e piume
          testo: |
            Prima dello spettacolo rinforzi le cinghie delle ali e ripassi il
            collo del golem con un'altra mano di colla. Tutto si apre e si spacca
            al momento giusto, e Violante, uscendo di scena, ti lascia in mano una
            piuma caduta. Te la infili nella tasca senza pensarci, e ci pensi per
            tutto il resto della sera. La paga arriva dopo lo spettacolo, contata
            due volte da Orazio.
          effetti: { monete: 4 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: Piume in platea
          testo: |
            Un'ala si sfilaccia a metà della risata della regina, e le piume nere
            scendono sulla prima fila. Una signora ne trova una nel bicchiere e il
            giorno dopo lo racconta a mezzo quartiere, insieme al nome di chi cura
            i costumi. Passi l'intervallo in ginocchio a raccogliere piume fra le
            poltrone, con le ginocchia che scricchiolano sul legno, e la paga
            stasera è uno spicciolo.
          effetti: { monete: 1, scandalo: 0.5 }
      - testo: "Stare alle funi e alle botole"
        descrizione: "Sipario, pozzo nascosto, trave. Lavoro che nessuno vede finché va bene."
        requisiti: [teatro.ruolo == 3]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Nessuno ti vede
          testo: |
            Le funi scorrono e le botole si aprono quando devono, e per tutta la
            sera nessuno in sala sa che esisti. Alla fine hai le spalle dure e i
            palmi caldi. Il vecchio macchinista ti offre un sorso dalla sua
            fiaschetta, che sa di prugne, e Orazio ti dà la paga.

            {resistenza Facile} Il sorso scende caldo e ti scioglie le spalle.
            Delle prugne resta soltanto il nome, il resto è grappa.
          effetti: { monete: 3 }
          pe: { atletica: 3 }
        fallimento:
          titolo: Il sipario a metà
          testo: |
            Il sipario si inceppa a metà sul finale, e Orazio fa l'inchino a un
            pezzo di velluto rosso. Dal palco di Isotta Cordani parte una risata
            che il giorno dopo si sente in tutti i salotti. Orazio ti paga il
            minimo e non ti rivolge la parola fino a mezzanotte, quando ti chiede
            di aiutarlo a togliersi il mantello, e intanto sospira forte perché tu
            lo senta.
          effetti: { monete: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ carta · Orazio in strada
  - id: carta-belcanto-cerca-attori
    immagine: personaggi/orazio-belcanto
    titolo: Un manifesto fresco di colla
    sommario: "Orazio Belcanto attacca di persona i manifesti della sua opera, e ferma chiunque gli sembri adatto al palcoscenico."
    tipo: carta
    area: quartieri-alti
    requisiti: [pista.teatro == 0]
    testo: |
      In una via dei Quartieri Alti un garzone regge il secchio della colla
      e un altro tiene ferma una scala, mentre in cima Orazio Belcanto
      liscia con le mani inanellate un manifesto della *Promessa
      dell'Arpia*. Porta un mantello color zafferano, e sulle maniche ha già
      due strisce di colla che asciugando diventeranno lucide. Quando ti
      vede si ferma a metà della scala, con una mano sul petto, e la scala
      oscilla sotto di lui.

      {acrobazia Facile} Il garzone sotto tiene la scala con una mano sola,
      perché con l'altra si gratta il naso. Se Orazio si sporge ancora un
      poco, viene giù tutto, manifesto compreso.

      «Anima cara, che profilo!» La voce gli sale di un'ottava, e quattro
      passanti si voltano. «Il sinistro, almeno. La mia Promessa dell'Arpia
      cerca gente della città per il palco e per le quinte. Io ti cerco da
      tutta la mattina senza saperlo.» Scende gli ultimi gradini e ti
      appoggia una mano sulla spalla, e il palmo ti lascia sulla stoffa
      un'impronta appiccicosa.

      {persuasione Media} Non c'è bisogno di dire di sì. Basta non dire di
      no abbastanza in fretta, e Orazio farà il resto da solo.
    opzioni:
      - testo: "Lasciarti convincere"
        descrizione: "Gli dici che ci penserai. Orazio sente solo la prima metà della frase."
        quando: [pista.pelle < 5]
        esito:
          titolo: Generosa malizia
          testo: |
            Orazio ti mette in mano un manifesto ancora umido e ti dice di
            presentarti al Teatro delle Meraviglie quando vuoi, chiedendo di lui.
            Intanto, siccome conosce tutti, ti regala un pettegolezzo. Isotta
            Cordani alla Boutique fa pagare doppio gli abiti ai Malgrani, e Lucia
            Malgrani paga senza capire perché. Lo racconta abbassando la voce, che
            per Orazio vuol dire farla sentire soltanto a metà strada.

            «Non dirlo in giro» dice, e risale sulla scala per il manifesto
            successivo.
          effetti: { informazioni.voce: 1 }
      # Dopo la caduta dei Malgrani (pista.pelle >= 5) il pettegolezzo di Orazio si aggiorna.
      - testo: "Lasciarti convincere"
        descrizione: "Gli dici che ci penserai. Orazio sente solo la prima metà della frase."
        quando: [pista.pelle >= 5]
        esito:
          titolo: Generosa malizia
          testo: |
            Orazio ti mette in mano un manifesto ancora umido e ti dice di
            presentarti al Teatro delle Meraviglie quando vuoi, chiedendo di lui.
            Intanto, siccome conosce tutti, ti regala un pettegolezzo. Isotta
            Cordani alla Boutique per anni ha fatto pagare doppio gli abiti ai
            Malgrani, e adesso che dai Malgrani non arriva più niente se ne
            lamenta con tutte le clienti. Lo racconta abbassando la voce, che per
            Orazio vuol dire farla sentire soltanto a metà strada.

            «Non dirlo in giro» dice, e risale sulla scala per il manifesto
            successivo.
          effetti: { informazioni.voce: 1 }
      - testo: "Rifiutare con garbo"
        descrizione: "Lo ringrazi, gli lodi il manifesto e gli dici di no."
        esito:
          titolo: L'Arte è paziente
          testo: |
            Orazio sospira con tutto il corpo, una mano sulla fronte, e gli anelli
            mandano un piccolo bagliore. Il garzone con il secchio alza gli occhi
            al cielo, perché la scena l'ha già vista stamattina, almeno tre volte.
            «L'Arte è paziente» dice. «Io molto meno, ma ti aspetterò lo stesso.»

            Ti lascia andare con un inchino profondo, e prima di girarti lo
            vedi già fermare il passante successivo.
          pe: { galateo: 2 }
