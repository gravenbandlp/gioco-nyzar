# La pista del Teatro (pista.teatro 0 → 2): la Promessa dell'Arpia al Teatro delle Meraviglie di Belcanto.
# Entrata nella compagnia (teatro.ruolo: 1 attore, 2 costumista o scenografo, 3 aiutante di scena), prove
# ripetibili che fanno salire prove.arpia, la prima, le repliche, e la carta di Orazio che cerca attori in strada.
# Nel copione dell'opera Silver Pond è diventato Valpeltro, la taverna Empty Glass il Fiasco Asciutto.
# Le opzioni per ruolo stanno in storylet con `mostra`, che nasconde quelle degli altri ruoli; nelle prove
# la scena cambia con l'avanzare di prove.arpia (prima < 1, poi fra 1 e 2, poi da 2 in su).
storylet:
  # ------------------------------------------------------------ 0 → 1 · entrare nella compagnia
  - id: teatro-di-belcanto
    presso: teatro-delle-meraviglie
    immagine: personaggi/orazio-belcanto
    titolo: Il Teatro delle Meraviglie
    sommario: "La prima della Promessa dell'Arpia è saltata per la razzia. Orazio Belcanto non si arrende e cerca cittadini da mettere in scena."
    luogo: Teatro delle Meraviglie di Belcanto, Quartieri Alti
    area: quartieri-alti
    requisiti: [pista.teatro == 0, prologo == 0]
    testo: |
      Il Teatro delle Meraviglie occupa un intero lato della piazza, con le colonne di marmo bianco e gli
      attori di pietra sul cornicione. Il marmo delle colonne è venato di grigio e lucido fino all'altezza di
      una mano, dove la gente si appoggia ad aspettare. Sul portone c'è il manifesto della *Promessa
      dell'Arpia*, e la data della prima è coperta da una striscia di carta con la parola *rinviata* scritta a
      pennello. La striscia è incollata storta, e da sotto il bordo spuntano ancora le gambe di un numero.

      Orazio Belcanto ti vede dalla scala e scende trotterellando, in una giacca color prugna con gli alamari
      d'oro. Ha un anello a ogni dito e la voce un'ottava più in alto del necessario. Dietro di lui l'atrio
      odora di cera da pavimenti e di polvere di gesso.

      «Anima cara, benvenuta nel tempio della scena!» Ti prende la mano fra le sue, e gli anelli sono freddi.
      «Gli orchi mi hanno rubato la prima, e io me la riprendo. La Promessa dell'Arpia è un'opera in cui
      recita la città intera. Mi servono attori e mani da sarta, e braccia per le funi. Per gli attori valgono
      i canoni estetici, s'intende, che stabilisce l'Arte in persona.»

      {origine rampollo-dei-quartieri-alti} In questo ridotto ci venivi da bambin{o|a}, e il velluto rosso
      delle poltroncine è lo stesso, solo più liso sui braccioli. Orazio ti guarda la faccia a lungo, e si
      vede che cerca di ricordarsi in quale palco ti ha già visto.
    opzioni:
      - testo: "Farti prendere come attore"
        descrizione: "Servono presenza e un po' di faccia tosta, e se non bastano c'è sempre posto fra le comparse."
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: I canoni estetici
          testo: |
            Orazio ti fa salire sul palco e ti gira intorno due volte. Sulle assi ci sono crocette di gesso
            dove gli attori devono fermarsi, e lui ti sposta con due dita finché non sei sopra la tua. Poi ti
            chiede una battuta del secondo atto, e tu la dici guardando la galleria vuota come se fosse piena.

            Batte le mani, e gli anelli tintinnano. «Farai un avventuriero, anima mia. Il secondo, quello che
            entra dopo e che il pubblico si ricorda di più.»
          imposta: { teatro.ruolo: 1 }
          pe: { espressivita: 5 }
          effetti: { pista.teatro: 1 }
        fallimento:
          titolo: Fra le comparse
          testo: |
            A metà della battuta ti si secca la bocca, e la seconda metà esce con una voce che non sapevi di
            avere. Orazio chiude gli occhi e resta così per un po', con le mani giunte sotto il mento.

            «L'Arte ha parlato» dice alla fine. «Però l'Arte ha bisogno anche delle comparse, e nel terzo atto
            mi mancano due orchi e un minatore svenuto. Ti piacciono le maschere?» Ti mette in mano una
            maschera di cartapesta che puzza ancora di colla, e sotto le zanne la carta è ancora morbida.
          imposta: { teatro.ruolo: 3 }
          pe: { espressivita: 3 }
          effetti: { pista.teatro: 1, scandalo: 0.5 }
      - testo: "Offrirti per i costumi e le scene"
        descrizione: "Le ali della regina arpia si inceppano da giorni. Se capisci perché, il posto in sartoria è tuo."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Le ali della regina
          testo: |
            Orazio ti porta in sartoria, dove su un manichino senza testa sono appese due ali di piume nere
            montate su stecche di canna. Le stecche girano su perni d'ottone, e ogni piuma è cucita a mano su
            una striscia di tela. Ci passi le dita sotto e trovi una stecca incollata al rovescio, con le
            piume che sfregano sulla stoffa.

            {tecnologia Facile} Basta girarla e tutto il resto del meccanismo è già giusto. La giri, e le ali
            si aprono fino in fondo con un fruscio lungo.

            «Costumi e scenografie, anima mia! Da oggi questa stanza è tua, e anche la colla.»
          imposta: { teatro.ruolo: 2 }
          pe: { tecnologia: 5 }
          effetti: { pista.teatro: 1 }
        fallimento:
          titolo: Il cordino
          testo: |
            Tiri il cordino con troppa decisione, e un'ala si apre di colpo e ti frusta la faccia. Ti ritrovi
            con una piuma nera in bocca, la guancia che brucia e Orazio con le mani sul cuore, che controlla
            prima le ali e poi te.

            «La sartoria vuole la mano leggera, anima cara. Le funi del sipario invece non si offendono di
            niente.» Ti affida al vecchio macchinista, che ti porge un paio di guanti di cuoio più grandi
            delle tue mani, lucidi sul palmo dove le funi li hanno consumati.
          imposta: { teatro.ruolo: 3 }
          pe: { percezione: 3 }
          effetti: { pista.teatro: 1, scandalo: 0.5 }
      - testo: "Offrirti come aiutante di scena"
        descrizione: "Funi da tirare e fondali da spostare al buio. Per questo lavoro basta presentarsi in orario."
        esito:
          titolo: Le funi
          testo: |
            Orazio ti affida al vecchio macchinista, un uomo curvo con le dita storte dalle corde, che ti
            porta dietro le quinte e ti mostra le botole e la ruota del sipario. Le funi di canapa grossa
            scendono dal buio della soffitta, e dove le mani le prendono la canapa è diventata liscia. Su ogni
            fune è legato un nastrino colorato, e accanto alla ruota c'è un foglio con la legenda dei colori
            scritta a mano, che lui non guarda mai.

            «Il rosso è il sipario» dice. «Il nero non lo tocchi, perché tiene su il lampadario.» Ti fa
            provare la ruota due volte, e alla seconda annuisce senza dire niente.
          imposta: { teatro.ruolo: 3 }
          pe: { atletica: 3 }
          effetti: { pista.teatro: 1 }
      - testo: "Ricordargli il palco della tua famiglia"
        descrizione: "La tua famiglia ha un palco in terza fila da quando eri bambin{o|a}, e Orazio i palchi paganti li conosce a memoria."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il palco in terza fila
          testo: |
            Gli dici il nome della tua famiglia, e Orazio porta tutte e due le mani al petto, con un tintinnio
            di anelli che batte uno contro l'altro.

            Poi ti fa salire sul palco, ti alza il mento con un dito inanellato e decreta che il profilo
            sinistro è quello di tua nonna e il destro andrà tenuto in ombra, per rispetto a lei. «Farai un
            avventuriero, anima mia. Il secondo, quello che entra dopo e che il pubblico si ricorda di più.»
          imposta: { teatro.ruolo: 1 }
          pe: { espressivita: 5 }
          effetti: { pista.teatro: 1 }
      - testo: "Dire la battuta come una preghiera della sera"
        descrizione: "Al Velo ti hanno insegnato a parlare a bassa voce in modo che si senta fino in fondo alla navata."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [accademiche, empatia], difficolta: Media }
        successo:
          titolo: Fino in galleria
          testo: |
            Sul palco chiudi gli occhi un momento, come prima della preghiera della sera. Poi dici la battuta
            del secondo atto senza alzare la voce e con tutte le consonanti al loro posto, e la battuta arriva
            intera fino all'ultima fila della galleria. Dalla cupola l'ultima sillaba torna indietro più
            piccola. Orazio smette di girarti intorno e resta fermo in mezzo alla platea, con le mani giunte
            sotto il mento.

            «Farai un avventuriero, il secondo, quello che entra dopo e che il pubblico si ricorda di più.»
          imposta: { teatro.ruolo: 1 }
          pe: { espressivita: 5 }
          effetti: { pista.teatro: 1 }
        fallimento:
          titolo: Il tono della navata
          testo: |
            La battuta ti esce piana e dolce, con il tono che si usa per benedire i malati. A metà ti accorgi
            che Orazio si è seduto in terza fila, affondato nel velluto fino alle spalle, e lascia calare le
            palpebre.

            «Bellissimo e funebre, anima cara» dice alla fine. «L'avventuriero deve far venire voglia di
            partire, e a me è venuta voglia di confessarmi.» Ti mette in mano una maschera d'orco di
            cartapesta, che puzza ancora di colla, e ti promette che nel terzo atto potrai ringhiare quanto
            vuoi.
          imposta: { teatro.ruolo: 3 }
          pe: { espressivita: 3 }
          effetti: { pista.teatro: 1, scandalo: 0.5 }
      - testo: "Smontare le ali come un congegno dell'Accademia"
        descrizione: "All'Accademia prima si disegna il congegno, poi si tocca."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il disegno sul copione
          testo: |
            In sartoria ti fai dare un copione vecchio e sul retro disegni le ali stecca per stecca. Segni con
            una crocetta i punti dove le piume sfregano e con una freccia il verso di ogni stecca. Orazio ti
            guarda disegnare con crescente inquietudine. Al terzo schizzo trovi la stecca incollata al
            rovescio senza averla ancora toccata. La giri, e le ali si aprono fino in fondo con un fruscio
            lungo.

            Orazio emette un piccolo grido. «Costumi e scenografie, anima mia! Da oggi questa stanza è tua, e
            anche la colla.»
          imposta: { teatro.ruolo: 2 }
          pe: { tecnologia: 5 }
          effetti: { pista.teatro: 1 }
        fallimento:
          titolo: Troppi schizzi
          testo: |
            Riempi il retro di un copione con le ali disegnate da tre lati, e Orazio, stanco di aspettare,
            tira il cordino da solo per mostrarti il difetto. L'ala si apre di colpo e ti strappa il foglio di
            mano, e il foglio vola fino alla ribalta.

            «Anima cara, in sartoria si lavora con le mani, e tu disegni!» dice. «Alle funi del sipario,
            almeno, i disegni non servono.» Ti affida al vecchio macchinista, che ti porge un paio di guanti
            di cuoio più grandi delle tue mani.
          imposta: { teatro.ruolo: 3 }
          pe: { percezione: 3 }
          effetti: { pista.teatro: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ prove ripetibili · prove.arpia
  - id: prove-al-teatro
    presso: teatro-delle-meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    titolo: Le prove della Promessa
    sommario: "Ogni pomeriggio la compagnia di riserva prova la Promessa dell'Arpia, e Orazio la dirige dal palco e dalla platea insieme."
    luogo: Teatro delle Meraviglie di Belcanto, durante le prove
    area: quartieri-alti
    ripetibile: true
    # Mauro Scrocco fa Sigor finché la Caserma non si muove contro la Pignatta (pista.pelle 5);
    # da lì in poi vale la variante prove-al-teatro-senza-mauro.
    requisiti: [pista.teatro == 1, pista.pelle < 5]
    mostra: 2
    testo: |
      Le prove cominciano dopo pranzo, con il sipario rosso tirato a metà e la platea vuota. In platea c'è
      solo una donna delle pulizie che ogni giorno siede in terza fila con il secchio fra i piedi, dove il
      velluto delle poltrone è consumato fino alla trama sui braccioli. La compagnia di riserva l'ha messa
      insieme Orazio dopo la razzia. Lui fa Asvorko, il padrone avaro delle miniere, e intanto dirige gli
      altri battendo gli anelli sullo schienale della prima fila. Grusk lo spazzino fa l'operaio Rolan, e la
      sua carriola rossa è arrivata fin sul palco, dove la ruota lascia una riga di fango secco sulle assi
      lucidate a cera. Rilla Tamberlo fa la segretaria Mary, e Mauro Scrocco della Pignatta Grassa fa l'oste
      Sigor. La regina arpia è Violante, la prima attrice, che ripassa in un angolo a voce bassa e muove le
      labbra sopra un copione tenuto chiuso contro il petto.

      {origine figlio-della-citta-bassa} In Città Bassa Mauro Scrocco lo conoscono tutti, e chi è cresciuto
      nei vicoli sa che i suoi abbracci si pagano dopo con gli interessi. Vederlo qui con il copione in mano
      ti fa l'effetto di un cane seduto a tavola.

      {origine apprendista-raschiatore} Grusk l'hai visto spesso sulla spiaggia dell'Orlo dei Rottami con la
      carriola rossa. Sul palco la spinge con la stessa andatura, piegato sulle stanghe anche dove le assi
      sono piane.
    opzioni:
      # --- attore
      - immagine: personaggi/mauro-scrocco
        testo: "Provare la scena della taverna con Mauro Scrocco"
        descrizione: "Secondo atto. L'oste Sigor assolda gli avventurieri al Fiasco Asciutto, e Mauro lo recita fin troppo bene."
        requisiti: [teatro.ruolo == 1, prove.arpia < 1]
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: Il tunnel sotto le botti
          testo: |
            Mauro ti abbraccia appena entri in scena, perché a suo dire Sigor abbraccia tutti, e il fiato gli
            puzza d'aglio fino alla terza fila. Quando arriva al tunnel di contrabbando si dilunga. Spiega che
            l'entrata va messa sotto le botti dell'aceto, che i cani delle guardie non annusano volentieri, e
            con la punta della scarpa segna sulle assi quanto deve essere largo il passaggio.

            «Mauro, caro, meno dettagli sul tunnel» dice Orazio dalla platea. «Il pubblico non deve
            impararlo.» Mauro allarga le braccia. «È teatro, Orazio, amico mio! Chi vuoi che ci vada davvero,
            sotto le botti?»
          effetti: { prove.arpia: 1 }
          pe: { espressivita: 3 }
        fallimento:
          titolo: Aglio
          testo: |
            L'abbraccio di Sigor dura più del previsto, e quando Mauro ti lascia andare hai dimenticato la
            battuta e respiri dalla bocca. Lui continua a parlare del tunnel per conto suo. Aggiunge la
            larghezza delle travi e l'orario dei cambi della guardia, e li conta sulle dita senza mai guardare
            il copione.

            Orazio vi fa ripetere la scena tre volte. Alla terza Mauro ti abbraccia di nuovo con affetto
            sincero, e l'aglio è lo stesso.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/grusk
        testo: "Dare la battuta a Grusk"
        descrizione: "Grusk continua a presentarsi come Grusk invece che come Rolan."
        requisiti: [teatro.ruolo == 1, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Il nastro rosso
          testo: |
            Fai tu la parte di Asvorko, perché Orazio deve riposare la voce. Grusk ti viene incontro dalla
            quinta con un odore di fiume e di grappa scadente, e il copione arrotolato in pugno è così stretto
            che la carta si è annerita dove la tiene il pollice. «Signor Asvorko, Grusk è contento di...» Lo
            fermi e gli leghi al polso un nastro rosso dello stesso colore della sua carriola.

            Da lì in poi, prima di ogni battuta, abbassa gli occhi sul polso. Ogni volta che vede il nastro,
            Grusk dice Rolan.
          effetti: { prove.arpia: 1 }
          pe: { empatia: 3 }
        fallimento:
          titolo: Grusk e Grusk
          testo: |
            Alla quinta volta che Grusk si chiama Grusk perdi la pazienza, e lui se ne accorge. Si offende a
            modo suo, cioè ti chiama Grusk a sua volta per tutta la scena e con grande dignità. Raddrizza la
            schiena ogni volta che lo dice, e il copione gli resta arrotolato in pugno senza che lo apra mai.

            Dalla platea Orazio si massaggia le tempie. «Due Grusk» dice con la voce che gli sale ancora. «Il
            copione ne prevede uno, e mi pareva già abbondante.»
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/violante
        testo: "Provare il confronto nel nido delle arpie"
        descrizione: "Terzo atto. Asvorko difende la regina arpia, e tu devi fargli vedere il suo errore mentre Orazio piange lacrime vere."
        requisiti: [teatro.ruolo == 1, prove.arpia >= 2]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Lacrime vere
          testo: |
            Orazio si butta in ginocchio, e gli anelli battono sulle assi del palco con un rumore di posate
            che cadono. «Ho commesso un errore imperdonabile» dice, e lo stira su quattro pause. Le lacrime
            gli tracciano due righe pulite nel cerone fino al mento. Tu lo guardi dritto negli occhi e reggi
            la battuta senza ridere, anche quando lui si soffia il naso nel mantello della regina e una piuma
            gli resta attaccata al labbro. Per tenere ferma la faccia ti mordi l'interno della guancia.
          effetti: { prove.arpia: 1 }
          pe: { persuasione: 3 }
        fallimento:
          titolo: La risata sbagliata
          testo: |
            Quando Orazio si soffia il naso nel mantello della regina ti scappa una risata dal naso, e poi
            un'altra. Lui si alza in piedi con le ginocchia bianche di polvere, e la voce che gli esce è
            normale e offesa.

            Poi si ricompone e ti perdona con un gesto largo da sovrano, che fa tintinnare gli anelli. «Anche
            le risate sono emozioni» dice, e ti punta contro un dito inanellato. «Domani però piangi tu, e io
            guardo.»
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/rilla-tamberlo
        testo: "Ripassare la parte nel ridotto"
        descrizione: "Nel ridotto si ripassa in pace, quando non arriva nessuno."
        requisiti: [teatro.ruolo == 1]
        esito:
          titolo: La segretaria Mary
          testo: |
            Nel ridotto fra gli specchi dalla cornice dorata e i divanetti di velluto ti raggiunge Rilla
            Tamberlo. Vuole provare Mary con qualcuno che non sia Orazio. «Signor Asvorko, ho bisogno di
            parlare con lei» dice, abbassando la voce come se ti stesse confessando un omicidio.

            «Mary è una segretaria, e io la faccio interessante.» Ripassate le battute fino a sera, quando
            dalle finestre arriva già la luce dei lampioni della piazza. Le tue le sai a memoria anche al
            contrario, mentre di quelle di Mary ricordi soprattutto le pause.
          effetti: { prove.arpia: 0.5 }
          pe: { espressivita: 1 }
      # --- costumista o scenografo
      - immagine: personaggi/violante
        testo: "Sistemare le ali addosso a Violante"
        descrizione: "Sul manichino le ali reggono. Addosso a un'attrice che cammina e si gira è un altro discorso."
        requisiti: [teatro.ruolo == 2, prove.arpia < 1]
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Le ali addosso
          testo: |
            Cuci le cinghie delle ali sotto il mantello di piume all'altezza delle scapole, con un punto
            doppio che regga lo strappo. Il cordino lo nascondi in una manica. Violante alza le braccia e le
            ali si aprono piano insieme alla sua voce, e poi tutte d'un colpo con le stecche che scattano in
            fila.

            «Al Festival ero pronta» dice, mentre provi a stringere una fibbia. «Poi sono arrivati gli orchi,
            e io ho dormito tre notti di fila.» Ride a bassa voce guardando le quinte vuote, e ti lascia
            finire il lavoro.
          effetti: { prove.arpia: 1 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: La porta stretta
          testo: |
            Le ali reggono finché Violante resta ferma. Appena prova l'uscita di scena le stecche si sganciano
            e le ali si aprono da sole nel passaggio della quinta. La inchiodano allo stipite con le braccia
            larghe e i piedi a un palmo da terra.

            Tu resti con il cordino in mano e la bocca aperta. Lei ride così forte che le piume tremano, e un
            paio si staccano e scendono piano fino alle assi. Orazio arriva di corsa con una mano sul petto e
            dice che il cuore gli si è fermato, e ricomincia a battergli solo quando la vede tornare giù.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/grusk
        testo: "Costruire il golem di cartapesta"
        descrizione: "Il golem di pietra del terzo atto per ora è un mucchio di giornali e un secchio di colla."
        requisiti: [teatro.ruolo == 2, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il golem sulla carriola
          testo: |
            Monti il golem sulla carriola di Grusk, così può entrare in scena da solo, e sul retro lasci uno
            sportello con due cerniere di cuoio. Grusk ci si infila dentro e spinge, e il golem avanza
            ondeggiando con un ruggito che rimbomba nella cartapesta. Da dentro si sente anche Grusk che ride.

            Lo dipingi di grigio pietra e tiri le crepe a pennello secco, perché da lontano sembri granito.
            Grusk ti chiede di lasciare almeno una striscia rossa sul fondo, perché la carriola è sua e vuole
            riconoscerla. Gliela lasci, e Orazio dalla platea non se ne accorge.
          effetti: { prove.arpia: 1 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: Un golem educato
          testo: |
            La cartapesta asciuga storta perché i giornali sul davanti tirano più di quelli sul retro, e il
            golem si piega in avanti finché sembra che stia facendo un inchino. Hai consumato tutta la colla e
            ne compri dell'altra di tasca tua, e fino a sera hai le dita appiccicate. Sui polpastrelli ti
            restano le lettere dei giornali stampate al contrario.

            Orazio lo guarda a lungo e decide che va bene così. «Un golem con le buone maniere» dice,
            accarezzandogli la testa storta. «In questa città se ne vedono pochi, e il pubblico gradirà.»
          effetti: { prove.arpia: 0.5, monete: -1 }
      - immagine: personaggi/rilla-tamberlo
        testo: "Vestire Rilla per la parte di Mary"
        descrizione: "Rilla vuole un abito con lo spacco, mentre Orazio vuole una segretaria. Ti tocca trovare un abito che vada bene a tutti e due."
        requisiti: [teatro.ruolo == 2, prove.arpia >= 2]
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Lo spacco nelle pieghe
          testo: |
            Le proponi un abito grigio da ufficio, accollato fino al mento e chiuso da una fila di bottoni
            d'osso. Lo spacco sta nascosto fra le pieghe della gonna e si apre solo quando Mary si siede sulla
            scrivania di Asvorko. Rilla ci pensa mordendosi una ciocca di capelli e accetta.

            Orazio se ne accorge alla prova generale, quando ormai è tardi, e diventa rosso fino alle
            orecchie. Recita la scena con la voce di un'ottava più alta del solito, e la donna delle pulizie
            in terza fila applaude.
          effetti: { prove.arpia: 1 }
          pe: { persuasione: 3 }
        fallimento:
          titolo: Le forbici di Rilla
          testo: |
            Le fai un abito che piace a Orazio, e Rilla lo prova senza protestare. Il giorno dopo si presenta
            con lo stesso abito e uno spacco alto fino all'anca, fatto di notte con le forbici della cucina.
            Si vede dall'orlo, che è tagliato a scatti e non ha un punto di imbastitura.

            Orazio se la prende con te, perché con Rilla non osa. Tu passi il pomeriggio a rammendare e ti
            pungi il pollice ogni tanto, mentre lei ti dice che stai rovinando l'Arte.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/mauro-scrocco
        testo: "Dipingere il fondale della miniera"
        descrizione: "Il fondale del secondo atto mostra le miniere di Valpeltro e il tunnel di contrabbando."
        requisiti: [teatro.ruolo == 2]
        esito:
          titolo: Consigli dall'oste
          testo: |
            Passi il pomeriggio sulla tela stesa in palcoscenico a dipingere le gallerie di Valpeltro in ocra
            e nero, finché non hai ocra anche sotto le unghie. Il nero lo stendi a strati verso il centro
            della tela, e a ogni strato il fondo delle gallerie sembra più lontano del muro del palcoscenico.
            Mauro Scrocco si ferma alle tue spalle con le mani dietro la schiena. Ti fa notare che una botola
            di contrabbando va messa sotto la scala della cantina, dove nessuno spazza.

            Lo dice con una certa competenza. Poi ti abbraccia, ti lascia sulla camicia un odore di assenzio e
            se ne va canticchiando.
          effetti: { prove.arpia: 0.5 }
          pe: { percezione: 1 }
      # --- aiutante di scena
      - immagine: personaggi/orazio-belcanto
        testo: "Aprire il sipario sull'entrata di Orazio"
        descrizione: "Il sipario deve aprirsi esattamente sul gesto di Orazio. Lui sostiene che un attimo di ritardo offende l'Arte."
        requisiti: [teatro.ruolo == 3, prove.arpia < 1]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Tre inchini
          testo: |
            Tieni gli occhi sulla mano di Orazio dalla fessura della quinta, con le dita già chiuse sui pioli
            della ruota. Quando il suo braccio si alza giri la ruota. Il sipario si apre senza uno strappo, e
            lui è già in posa con il mento in alto e una mano sospesa a mezz'aria.

            Alla fine della scena ti chiede di chiuderlo e riaprirlo, e fa tre inchini alla platea vuota, uno
            per ogni ordine di palchi. La donna delle pulizie applaude con le mani bagnate.
          effetti: { prove.arpia: 1 }
          pe: { atletica: 3 }
        fallimento:
          titolo: Troppo presto
          testo: |
            Giri la ruota un momento prima, e il sipario si apre su Orazio che si sta sistemando le calze con
            un piede sulla sedia di Asvorko. La fune ti scorre fra le mani e ti brucia i palmi, e la canapa ti
            lascia due strisce rosse di traverso.

            Lui resta immobile, poi abbassa il piede con dignità e attacca la battuta come se niente fosse.
            Dopo la prova viene a dirti che il sipario si apre sul suo gesto e mai un attimo prima, e ti
            guarda le mani.
          effetti: { prove.arpia: 0.5, ferite: 0.5 }
      - immagine: personaggi/grusk
        testo: "Fare l'orco nel terzo atto"
        descrizione: "Gli orchi del terzo atto sono comparse in maschera. Dopo la razzia Orazio le ha fatte ridipingere di un verde più tenue, per delicatezza."
        requisiti: [teatro.ruolo == 3, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: fisico, abilita: [acrobazia, rissa], difficolta: Facile }
        successo:
          titolo: Il ringhio della nonna
          testo: |
            Prima della scena Grusk ti prende da parte e ti insegna a ringhiare dal fondo della pancia, come
            faceva sua nonna quando i bambini rubavano il pane. Tu ringhi, e il ringhio ti esce da un posto
            che non sapevi di avere. Dentro la maschera di cartapesta rimbomba fino a farti vibrare i denti, e
            gli avventurieri fanno un passo indietro che il copione non prevedeva.

            Cadi a terra al momento giusto, con un tonfo che fa sobbalzare la platea vuota. Grusk dalla quinta
            alza il pollice, che ha tatuato anche quello.
          effetti: { prove.arpia: 1 }
          pe: { acrobazia: 3 }
        fallimento:
          titolo: L'orco e il sipario
          testo: |
            La maschera ti scivola sugli occhi a metà della zuffa, e per un po' combatti contro il sipario. Il
            sipario vince, e tu ti ritrovi avvolt{o|a} nel velluto rosso con le gambe che scalciano fuori e la
            polvere delle pieghe in gola.

            Orazio dalla platea decide che l'orco ha lottato con coraggio, e che il sipario ne esce peggio di
            lui. Ti chiede però di tenere la maschera legata più stretta, e ti presta un nastro dei suoi,
            color prugna.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/rilla-tamberlo
        testo: "Suggerire dalla buca"
        descrizione: "Il suggeritore ha perso la voce. Dalla buca davanti al palco si vedono soprattutto caviglie, e si sentono tutte le battute sbagliate."
        requisiti: [teatro.ruolo == 3, prove.arpia >= 2]
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Facile }
        successo:
          titolo: Caviglie
          testo: |
            Nella buca l'aria sa di legno umido e di sego. Tieni il dito sul copione e la testa bassa, e
            sussurri «Rolan» a Grusk ogni volta che apre bocca. Gli occhi restano sulla pagina anche quando
            Rilla si siede sulla scrivania proprio sopra la buca.

            Orazio dice che non ha sentito il suggeritore nemmeno una volta, e ti stringe la mano così forte
            che ti resta nel palmo il segno del sigillo del Teatro.
          effetti: { prove.arpia: 1 }
          pe: { percezione: 3 }
        fallimento:
          titolo: La scena sbagliata
          testo: |
            Perdi il segno quando Rilla ti lascia cadere un fazzoletto in testa. Il fazzoletto sa di cipria e
            ti copre la pagina, e suggerisci a Mauro la battuta della scena sbagliata. Lui la dice con
            convinzione, e Sigor accetta la proposta della regina arpia.

            Violante non si scompone e gli risponde con una battuta inventata, e per un po' la scena va avanti
            per conto suo. Orazio vi fa ricominciare dall'atto secondo e ti manda giù un fazzoletto pulito,
            piegato in quattro.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/violante
        testo: "Spazzare il palco e portare l'acqua"
        descrizione: "Qualcuno deve pur farlo, e intanto si sente tutto quello che si dice nelle quinte."
        requisiti: [teatro.ruolo == 3]
        esito:
          titolo: Dalle quinte
          testo: |
            Spazzi il palco fra una scena e l'altra, e la scopa tira su segatura e briciole di cartapesta
            dalle fessure fra le assi. Poi porti la brocca dell'acqua in quinta. Violante beve dal tuo
            bicchiere senza chiedere, e intanto guarda la compagnia che litiga sul palco.

            «Faccio la regina arpia» dice. «E ti assicuro che è più simpatica di mezza compagnia.» Ti
            restituisce il bicchiere e torna in scena con il mantello di piume che struscia sulle assi.
          effetti: { prove.arpia: 0.5 }
          pe: { resistenza: 1 }

  # Variante: Mauro non viene più alle prove, e Sigor lo fa il vecchio macchinista.
  - id: prove-al-teatro-senza-mauro
    presso: teatro-delle-meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    titolo: Le prove della Promessa
    sommario: "Ogni pomeriggio la compagnia di riserva prova la Promessa dell'Arpia, e Orazio la dirige dal palco e dalla platea insieme."
    luogo: Teatro delle Meraviglie di Belcanto, durante le prove
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.teatro == 1, pista.pelle >= 5]
    mostra: 2
    testo: |
      La compagnia di riserva l'ha messa insieme Orazio dopo la razzia. Lui fa Asvorko, il padrone avaro delle
      miniere, e intanto dirige gli altri battendo gli anelli sullo schienale della prima fila. Grusk lo
      spazzino fa l'operaio Rolan, e la sua carriola rossa è arrivata fin sul palco, dove la ruota lascia una
      riga di fango secco sulle assi lucidate a cera. Rilla Tamberlo fa la segretaria Mary. Mauro Scrocco alle
      prove non viene più, e l'oste Sigor lo fa il vecchio macchinista, che le battute le sa a forza di
      sentirle dalle quinte. Ha le dita storte dalle corde, e sulla copertina del copione che tiene in mano
      c'è ancora il nome di Mauro scritto a matita. La regina arpia è Violante, la prima attrice.

      {conoscenze-della-strada Media} In Città Bassa in questi giorni della Pignatta Grassa si parla a mezza
      voce.

      {origine figlio-della-citta-bassa} Senza Mauro, Grusk è l'unico della compagnia che viene dalla tua
      parte della città. Quando entri alza il mento verso di te, come fra vicini che si incontrano lontano da
      casa.

      {origine apprendista-raschiatore} Grusk l'hai visto spesso sulla spiaggia dell'Orlo dei Rottami con la
      carriola rossa. Sul palco la spinge con la stessa andatura, piegato sulle stanghe anche dove le assi
      sono piane.
    opzioni:
      # --- attore
      - testo: "Provare la scena della taverna con il vecchio macchinista"
        descrizione: "Secondo atto. L'oste Sigor assolda gli avventurieri al Fiasco Asciutto, e il vecchio macchinista lo recita come se dovesse ancora badare alle funi."
        requisiti: [teatro.ruolo == 1, prove.arpia < 1]
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: Il tunnel sotto le botti
          testo: |
            Il vecchio macchinista entra in scena con le dita storte infilate nel grembiule e dice le battute
            di Sigor a voce bassa, come se in platea ci fosse qualcuno da non svegliare. Tu gli rispondi con
            la meraviglia dell'avventuriero e alzi la voce per tutti e due, finché anche lui comincia a
            crederci e tira fuori le mani dal grembiule.

            «Più forte, anima mia!» dice Orazio dalla platea. Il macchinista alza le spalle. «Dietro le quinte
            si sta zitti da quarant'anni» risponde. Al giro dopo grida, con una voce rauca che arriva fino
            all'ultima fila e fa voltare anche Violante.
          effetti: { prove.arpia: 1 }
          pe: { espressivita: 3 }
        fallimento:
          titolo: La fune nera
          testo: |
            A metà della scena il macchinista sente scricchiolare una fune e va a controllarla, con la battuta
            di Sigor lasciata a metà. Tu resti da sol{o|a} al bancone del Fiasco Asciutto, che è un'asse
            dipinta su due cavalletti, e dici le tue battute a un boccale di cartapesta.

            Orazio vi fa ripetere la scena tre volte. Alla terza il macchinista arriva fino in fondo, e ti
            spiega sottovoce che la fune era quella nera del lampadario.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/grusk
        testo: "Dare la battuta a Grusk"
        descrizione: "Grusk continua a presentarsi come Grusk invece che come Rolan."
        requisiti: [teatro.ruolo == 1, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Il nastro rosso
          testo: |
            Fai tu la parte di Asvorko, perché Orazio deve riposare la voce. Grusk ti viene incontro dalla
            quinta con un odore di fiume e di grappa scadente, e il copione arrotolato in pugno è così stretto
            che la carta si è annerita dove la tiene il pollice. «Signor Asvorko, Grusk è contento di...» Lo
            fermi e gli leghi al polso un nastro rosso dello stesso colore della sua carriola.

            Da lì in poi, prima di ogni battuta, abbassa gli occhi sul polso. Ogni volta che vede il nastro,
            Grusk dice Rolan.
          effetti: { prove.arpia: 1 }
          pe: { empatia: 3 }
        fallimento:
          titolo: Grusk e Grusk
          testo: |
            Alla quinta volta che Grusk si chiama Grusk perdi la pazienza, e lui se ne accorge. Si offende a
            modo suo, cioè ti chiama Grusk a sua volta per tutta la scena e con grande dignità. Raddrizza la
            schiena ogni volta che lo dice, e il copione gli resta arrotolato in pugno senza che lo apra mai.

            Dalla platea Orazio si massaggia le tempie. «Due Grusk» dice con la voce che gli sale ancora. «Il
            copione ne prevede uno, e mi pareva già abbondante.»
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/violante
        testo: "Provare il confronto nel nido delle arpie"
        descrizione: "Terzo atto. Asvorko difende la regina arpia, e tu devi fargli vedere il suo errore mentre Orazio piange lacrime vere."
        requisiti: [teatro.ruolo == 1, prove.arpia >= 2]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Lacrime vere
          testo: |
            Orazio si butta in ginocchio, e gli anelli battono sulle assi del palco con un rumore di posate
            che cadono. «Ho commesso un errore imperdonabile» dice, e lo stira su quattro pause. Le lacrime
            gli tracciano due righe pulite nel cerone fino al mento. Tu lo guardi dritto negli occhi e reggi
            la battuta senza ridere, anche quando lui si soffia il naso nel mantello della regina e una piuma
            gli resta attaccata al labbro. Per tenere ferma la faccia ti mordi l'interno della guancia.
          effetti: { prove.arpia: 1 }
          pe: { persuasione: 3 }
        fallimento:
          titolo: La risata sbagliata
          testo: |
            Quando Orazio si soffia il naso nel mantello della regina ti scappa una risata dal naso, e poi
            un'altra. Lui si alza in piedi con le ginocchia bianche di polvere, e la voce che gli esce è
            normale e offesa.

            Poi si ricompone e ti perdona con un gesto largo da sovrano, che fa tintinnare gli anelli. «Anche
            le risate sono emozioni» dice, e ti punta contro un dito inanellato. «Domani però piangi tu, e io
            guardo.»
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/rilla-tamberlo
        testo: "Ripassare la parte nel ridotto"
        descrizione: "Nel ridotto si ripassa in pace, quando non arriva nessuno."
        requisiti: [teatro.ruolo == 1]
        esito:
          titolo: La segretaria Mary
          testo: |
            Nel ridotto fra gli specchi dalla cornice dorata e i divanetti di velluto ti raggiunge Rilla
            Tamberlo. Vuole provare Mary con qualcuno che non sia Orazio. «Signor Asvorko, ho bisogno di
            parlare con lei» dice, abbassando la voce come se ti stesse confessando un omicidio.

            «Mary è una segretaria, e io la faccio interessante.» Ripassate le battute fino a sera, quando
            dalle finestre arriva già la luce dei lampioni della piazza. Le tue le sai a memoria anche al
            contrario, mentre di quelle di Mary ricordi soprattutto le pause.
          effetti: { prove.arpia: 0.5 }
          pe: { espressivita: 1 }
      # --- costumista o scenografo
      - immagine: personaggi/violante
        testo: "Sistemare le ali addosso a Violante"
        descrizione: "Sul manichino le ali reggono. Addosso a un'attrice che cammina e si gira è un altro discorso."
        requisiti: [teatro.ruolo == 2, prove.arpia < 1]
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Le ali addosso
          testo: |
            Cuci le cinghie delle ali sotto il mantello di piume all'altezza delle scapole, con un punto
            doppio che regga lo strappo. Il cordino lo nascondi in una manica. Violante alza le braccia e le
            ali si aprono piano insieme alla sua voce, e poi tutte d'un colpo con le stecche che scattano in
            fila.

            «Al Festival ero pronta» dice, mentre provi a stringere una fibbia. «Poi sono arrivati gli orchi,
            e io ho dormito tre notti di fila.» Ride a bassa voce guardando le quinte vuote, e ti lascia
            finire il lavoro.
          effetti: { prove.arpia: 1 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: La porta stretta
          testo: |
            Le ali reggono finché Violante resta ferma. Appena prova l'uscita di scena le stecche si sganciano
            e le ali si aprono da sole nel passaggio della quinta. La inchiodano allo stipite con le braccia
            larghe e i piedi a un palmo da terra.

            Tu resti con il cordino in mano e la bocca aperta. Lei ride così forte che le piume tremano, e un
            paio si staccano e scendono piano fino alle assi. Orazio arriva di corsa con una mano sul petto e
            dice che il cuore gli si è fermato, e ricomincia a battergli solo quando la vede tornare giù.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/grusk
        testo: "Costruire il golem di cartapesta"
        descrizione: "Il golem di pietra del terzo atto per ora è un mucchio di giornali e un secchio di colla."
        requisiti: [teatro.ruolo == 2, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il golem sulla carriola
          testo: |
            Monti il golem sulla carriola di Grusk, così può entrare in scena da solo, e sul retro lasci uno
            sportello con due cerniere di cuoio. Grusk ci si infila dentro e spinge, e il golem avanza
            ondeggiando con un ruggito che rimbomba nella cartapesta. Da dentro si sente anche Grusk che ride.

            Lo dipingi di grigio pietra e tiri le crepe a pennello secco, perché da lontano sembri granito.
            Grusk ti chiede di lasciare almeno una striscia rossa sul fondo, perché la carriola è sua e vuole
            riconoscerla. Gliela lasci, e Orazio dalla platea non se ne accorge.
          effetti: { prove.arpia: 1 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: Un golem educato
          testo: |
            La cartapesta asciuga storta perché i giornali sul davanti tirano più di quelli sul retro, e il
            golem si piega in avanti finché sembra che stia facendo un inchino. Hai consumato tutta la colla e
            ne compri dell'altra di tasca tua, e fino a sera hai le dita appiccicate. Sui polpastrelli ti
            restano le lettere dei giornali stampate al contrario.

            Orazio lo guarda a lungo e decide che va bene così. «Un golem con le buone maniere» dice,
            accarezzandogli la testa storta. «In questa città se ne vedono pochi, e il pubblico gradirà.»
          effetti: { prove.arpia: 0.5, monete: -1 }
