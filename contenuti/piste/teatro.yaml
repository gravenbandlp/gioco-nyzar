      - immagine: personaggi/orazio-belcanto
        testo: "Aprire il sipario sull'entrata di Orazio"
        descrizione: "Il sipario deve aprirsi esattamente sul gesto di Orazio. Lui sostiene che un attimo di ritardo offende l'Arte."
        requisiti: [teatro.ruolo == 3, prove.arpia < 1]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Tre inchini
          testo: |
            Tieni gli occhi sulla mano di Orazio dalla fessura della quinta, con le dita già chiuse sui pioli
            della ruota. Quando il suo braccio si alza giri la ruota. Il sipario si apre senza uno strappo, e
            lui è già in posa con il mento in alto e una mano sospesa a mezz'aria.

            Alla fine della scena ti chiede di chiuderlo e riaprirlo, e fa tre inchini alla platea vuota, uno
            per ogni ordine di palchi. La donna delle pulizie applaude con le mani bagnate.
          effetti: { prove.arpia: 1 }
          pe: { atletica: 3 }
        fallimento:
          titolo: Troppo presto
          testo: |
            Giri la ruota un momento prima, e il sipario si apre su Orazio che si sta sistemando le calze con
            un piede sulla sedia di Asvorko. La fune ti scorre fra le mani e ti brucia i palmi, e la canapa ti
            lascia due strisce rosse di traverso.

            Lui resta immobile, poi abbassa il piede con dignità e attacca la battuta come se niente fosse.
            Dopo la prova viene a dirti che il sipario si apre sul suo gesto e mai un attimo prima, e ti
            guarda le mani.
          effetti: { prove.arpia: 0.5, ferite: 0.5 }
      - immagine: personaggi/grusk
        testo: "Fare l'orco nel terzo atto"
        descrizione: "Gli orchi del terzo atto sono comparse in maschera. Dopo la razzia Orazio le ha fatte ridipingere di un verde più tenue, per delicatezza."
        requisiti: [teatro.ruolo == 3, prove.arpia >= 1, prove.arpia < 2]
        prova: { attributo: fisico, abilita: [acrobazia, rissa], difficolta: Facile }
        successo:
          titolo: Il ringhio della nonna
          testo: |
            Prima della scena Grusk ti prende da parte e ti insegna a ringhiare dal fondo della pancia, come
            faceva sua nonna quando i bambini rubavano il pane. Tu ringhi, e il ringhio ti esce da un posto
            che non sapevi di avere. Dentro la maschera di cartapesta rimbomba fino a farti vibrare i denti, e
            gli avventurieri fanno un passo indietro che il copione non prevedeva.

            Cadi a terra al momento giusto, con un tonfo che fa sobbalzare la platea vuota. Grusk dalla quinta
            alza il pollice, che ha tatuato anche quello.
          effetti: { prove.arpia: 1 }
          pe: { acrobazia: 3 }
        fallimento:
          titolo: L'orco e il sipario
          testo: |
            La maschera ti scivola sugli occhi a metà della zuffa, e per un po' combatti contro il sipario. Il
            sipario vince, e tu ti ritrovi avvolt{o|a} nel velluto rosso con le gambe che scalciano fuori e la
            polvere delle pieghe in gola.

            Orazio dalla platea decide che l'orco ha lottato con coraggio, e che il sipario ne esce peggio di
            lui. Ti chiede però di tenere la maschera legata più stretta, e ti presta un nastro dei suoi,
            color prugna.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/rilla-tamberlo
        testo: "Suggerire dalla buca"
        descrizione: "Il suggeritore ha perso la voce. Dalla buca davanti al palco si vedono soprattutto caviglie, e si sentono tutte le battute sbagliate."
        requisiti: [teatro.ruolo == 3, prove.arpia >= 2]
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Facile }
        successo:
          titolo: Caviglie
          testo: |
            Nella buca l'aria sa di legno umido e di sego. Tieni il dito sul copione e la testa bassa, e
            sussurri «Rolan» a Grusk ogni volta che apre bocca. Gli occhi restano sulla pagina anche quando
            Rilla si siede sulla scrivania proprio sopra la buca.

            Orazio dice che non ha sentito il suggeritore nemmeno una volta, e ti stringe la mano così forte
            che ti resta nel palmo il segno del sigillo del Teatro.
          effetti: { prove.arpia: 1 }
          pe: { percezione: 3 }
        fallimento:
          titolo: La scena sbagliata
          testo: |
            Perdi il segno quando Rilla ti lascia cadere un fazzoletto in testa. Il fazzoletto sa di cipria e
            ti copre la pagina, e suggerisci al vecchio macchinista la battuta della scena sbagliata. Lui la
            dice con convinzione, e Sigor accetta la proposta della regina arpia.

            Violante non si scompone e gli risponde con una battuta inventata, e per un po' la scena va avanti
            per conto suo. Orazio vi fa ricominciare dall'atto secondo e ti manda giù un fazzoletto pulito,
            piegato in quattro.
          effetti: { prove.arpia: 0.5 }
      - immagine: personaggi/violante
        testo: "Spazzare il palco e portare l'acqua"
        descrizione: "Qualcuno deve pur farlo, e intanto si sente tutto quello che si dice nelle quinte."
        requisiti: [teatro.ruolo == 3]
        esito:
          titolo: Dalle quinte
          testo: |
            Spazzi il palco fra una scena e l'altra, e la scopa tira su segatura e briciole di cartapesta
            dalle fessure fra le assi. Poi porti la brocca dell'acqua in quinta. Violante beve dal tuo
            bicchiere senza chiedere, e intanto guarda la compagnia che litiga sul palco.

            «Faccio la regina arpia» dice. «E ti assicuro che è più simpatica di mezza compagnia.» Ti
            restituisce il bicchiere e torna in scena con il mantello di piume che struscia sulle assi.
          effetti: { prove.arpia: 0.5 }
          pe: { resistenza: 1 }

  # ------------------------------------------------------------ 1 → 2 · la prima
  - id: la-prima-della-promessa
    presso: teatro-delle-meraviglie
    immagine: personaggi/violante
    titolo: La prima della Promessa
    sommario: "Il manifesto ha una data nuova e la platea è piena fino al loggione. Stasera Orazio alza il sipario sulla Promessa dell'Arpia."
    luogo: Teatro delle Meraviglie di Belcanto, la sera della prima
    area: quartieri-alti
    # Lucia Malgrani nel suo palco e Mauro Scrocco in scena: solo prima che la Caserma si muova contro
    # i Malgrani e la Pignatta (pista.pelle 5). Dopo vale la-prima-della-promessa-dopo-i-malgrani.
    requisiti: [pista.teatro == 1, prove.arpia >= 3, pista.pelle < 5]
    mostra: 2
    testo: |
      Sulla striscia *rinviata* del manifesto hanno incollato una data nuova, e la colla ha fatto le bolle
      sotto la carta. Stasera la platea è piena fino al loggione, e dalle quinte senti l'odore dell'olio delle
      lampade e del velluto scaldato da mille persone. Lucia Malgrani è sola nel suo palco in seconda fila, e
      la Casa dei Nodi ha mandato mezza Gilda.

      {origine rampollo-dei-quartieri-alti} Il palco della tua famiglia, in terza fila, ha la tenda aperta. Da
      dietro la quinta non vedi chi c'è dentro, e ti tiri giù le maniche fino alle nocche.

      {origine mercante-dei-ponti} In platea c'è l'esattore che dopo la razzia ha controllato il tuo banco, e
      già conta le poltrone.

      Nel primo atto l'Asvorko di Orazio conta le monete delle miniere di Valpeltro, che sono rondelle di
      latta e sul tavolo suonano più leggere dell'argento. Quando la regina arpia entra nel mantello di piume
      la sala smette di frusciare, e Violante gli promette la lealtà degli operai in cambio di un nido nelle
      gallerie. Alla terza scena Grusk si presenta come «Grusk, signore», e il loggione ride tanto che lui fa
      un inchino con le mani ancora sulle stanghe della carriola rossa.

      Nel secondo atto Mauro Scrocco, nei panni di Sigor, assolda gli avventurieri alla taverna del Fiasco
      Asciutto e apre il tunnel sotto le botti. Poi vengono gli orchi in maschera e il golem di cartapesta del
      terzo atto, che sotto la ribalta ha il grigio della pietra e cigola sulla ruota della carriola che lo
      porta. Nel nido ti aspettano le trappole e il momento che hai provato tante volte.
    opzioni:
      - testo: "Affrontare Asvorko nel nido delle arpie"
        descrizione: "La scena ottava è tua. Davanti hai Orazio in ginocchio e mille persone al buio."
        requisiti: [teatro.ruolo == 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Un errore imperdonabile
          testo: |
            Pianti i piedi sulle assi e dici la battuta all'ultima fila senza fretta. La voce sale fino al
            loggione, e lassù nessuno si muove.

            Orazio crolla in ginocchio e si pente con le lacrime vere e gli anelli che battono sul legno. La
            regina ride la sua ultima risata e le arpie cadono. Gli operai di Valpeltro tornano a casa, e
            Asvorko promette di cambiare.

            La sala si alza in piedi, e lo schiocco delle poltrone che si richiudono copre l'inizio
            dell'applauso. Da un palco anche Julia Castaldi applaude, con i guanti. Dopo lo spettacolo Orazio
            ti mette in mano un sacchetto di velluto con la tua parte dell'incasso, e dal peso capisci che
            stavolta le monete sono d'argento.
          effetti: { monete: 18, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { espressivita: 5 }
        fallimento:
          titolo: Il tunnel, signore
          testo: |
            Apri la bocca e la battuta non c'è più. Dalla quinta Mauro te ne sussurra una, ed è quella del
            tunnel di contrabbando. Tu la ripeti ad alta voce nel nido delle arpie davanti a mille persone, e
            nel silenzio che segue senti sfrigolare lo stoppino di una lampada della ribalta.

            Orazio non fa una piega. Si pente lo stesso, dicendo che perfino i tunnel gli hanno insegnato
            qualcosa, e la sala lo prende per satira e ride. L'applauso alla fine è lungo, e la tua parte
            dell'incasso arriva comunque, un po' più leggera.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { espressivita: 3 }
      - testo: "Manovrare le ali e il golem dalle quinte"
        descrizione: "Due cordini per le ali della regina, uno sportello per il golem, e nessuno deve vederti."
        requisiti: [teatro.ruolo == 2]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Ali nere
          testo: |
            Il golem avanza sulla carriola di Grusk e si spacca lungo la cucitura di colla che avevi lasciato
            più sottile apposta, e la prima fila sobbalza. Quando la regina ride tiri i cordini, e le ali si
            aprono fino in fondo, nere sotto le lampade. Le cinghie reggono senza un cigolio, e le piume si
            fermano tutte insieme.

            Dopo lo spettacolo un mercante della Gilda ti cerca dietro le quinte. Vuole sapere chi ha
            costruito quelle ali e ti lascia il suo nome per un lavoro, mentre Orazio ti conta in mano la tua
            parte dell'incasso.
          effetti: { monete: 16, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: La testa del golem
          testo: |
            A metà del combattimento la testa del golem si stacca, rotola giù dal palco e si ferma ai piedi di
            un mercante della Gilda in prima fila. Dal collo spuntano i giornali appallottolati che la
            tenevano in forma. Lui la guarda come si guarda un conto sbagliato, e tu dietro la quinta pianti
            le dita nel velluto del sipario.

            Orazio non perde il ritmo. «Così finiscono i golem di chi tradisce i lavoratori!» grida, e la sala
            applaude. La serata va avanti fino al pentimento di Asvorko, e la tua parte dell'incasso arriva lo
            stesso.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { tecnologia: 3 }
      - testo: "Far scattare le trappole di cartapesta"
        descrizione: "Il pozzo nascosto e la trave instabile dipendono da te, e da quanto sei svelt{o|a} con le funi."
        requisiti: [teatro.ruolo == 3]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Facile }
        successo:
          titolo: Le trappole del nido
          testo: |
            Apri la botola del pozzo nascosto sotto il primo orco, e la fune ti scorre liscia fra i guanti di
            cuoio. Poi lasci cadere la trave di cartapesta un palmo davanti agli avventurieri e fai scattare
            l'arco con una freccia di piuma. A ogni trappola il loggione urla, e Asvorko arriva al pentimento
            con la sala già in piedi.

            Dopo lo spettacolo il vecchio macchinista controlla i tuoi nodi uno per uno con le dita storte,
            poi ti fa un cenno con la testa. Orazio ti paga la tua parte dell'incasso e ti dice che un giorno
            racconterai di questa sera ai nipoti.
          effetti: { monete: 14, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { atletica: 5 }
        fallimento:
          titolo: Grusk sta bene
          testo: |
            Sbagli fune, e la botola del pozzo si apre sotto Grusk invece che sotto l'orco. Grusk sparisce, e
            da sotto il palco arriva il tonfo di un corpo grosso sulle assi. In sala cade un silenzio lungo,
            nel quale senti benissimo il tuo cuore.

            Poi la sua testa riemerge dal pavimento, con la segatura del sottopalco nei capelli. «Grusk sta
            bene!» annuncia al pubblico, e la sala viene giù dalle risate. Orazio dirà poi che è stato il
            momento più alto della serata, e ti paga la tua parte con una smorfia.
          effetti: { monete: 10, racconto: 1, pista.teatro: 1 }
          pe: { atletica: 3 }
      - testo: "Restare al tuo posto quando la regina apre le ali"
        descrizione: "Nel nido la regina ha una battuta sulle ali che alle prove ti era scivolata addosso."
        requisiti: [pista.sepolcro >= 5]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Sangue freddo
          testo: |
            Violante apre le ali sopra Asvorko, e l'aria smossa dalle piume ti arriva in faccia con l'odore
            della colla. «Spezzatemi le ali quante volte volete, signor Asvorko. La regina torna sempre.» Ti
            torna in mente una voce rotta, sulla Roccia di Wren, e il sudore ti si raffredda sulla nuca. *È
            una battuta, e l'ha scritta Orazio.* Le tue mani cercano la cintura, e le rimetti dove devono
            stare.

            Agli applausi Violante ti stringe la mano un momento più del necessario, e la sua presa è salda
            quanto basta a fermarti il tremito. Poi Orazio ti paga la tua parte dell'incasso.
          effetti: { monete: 15, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { resilienza: 5 }
        fallimento:
          titolo: "Ferm{o|a} in scena"
          testo: |
            Violante apre le ali sopra Asvorko. «Spezzatemi le ali quante volte volete, signor Asvorko. La
            regina torna sempre.» Ti si gela il sangue e resti ferm{o|a} con la bocca aperta. Mille persone
            aspettano, e dal loggione arriva soltanto il cigolio di un sedile.

            Violante se ne accorge. Ti gira intorno con le ali spalancate e inventa una battuta che ti rimette
            in scena. Orazio dopo giura che la tua è stata la pausa più ispirata della serata, e ti paga senza
            sapere perché ti tremano ancora le dita.
          effetti: { monete: 12, racconto: 1, tormento: 1, pista.teatro: 1 }
          pe: { resilienza: 3 }
      - testo: "Trattare Asvorko come un socio della Gilda"
        descrizione: "La battuta suona meglio detta come si chiude un affare al banco."
        requisiti: [teatro.ruolo == 1]
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: L'affare chiuso
          testo: |
            Ti avvicini ad Asvorko come ci si avvicina a un socio che ha sbagliato un conto, e gli dici la
            battuta piano, con la pazienza che si usa quando il conto è già fatto. Da vicino vedi Orazio
            deglutire sotto il cerone.

            Orazio crolla in ginocchio con le lacrime vere. La regina ride la sua ultima risata e le arpie
            cadono. La sala si alza in piedi, e da un palco anche Julia Castaldi applaude, con i guanti. Dopo
            lo spettacolo Orazio ti mette in mano un sacchetto di velluto con la tua parte dell'incasso.
          effetti: { monete: 18, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { persuasione: 5 }
        fallimento:
          titolo: La voce del mercato
          testo: |
            A metà battuta la voce ti scivola nel tono del Mercato dei Nodi, e ad Asvorko annunci il suo
            errore come si annuncia un prezzo di fine giornata. Il loggione ride nel punto sbagliato. Tu senti
            le orecchie diventare calde sotto il cerone, che comincia a farsi molle sulle tempie.

            Orazio non fa una piega. Si pente lo stesso, con un tono da debitore che la sala prende per
            satira, e alla fine l'applauso è lungo. La tua parte dell'incasso arriva comunque, un po' più
            leggera.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { persuasione: 3 }
      - testo: "Guardare Asvorko negli occhi"
        descrizione: "Stasera Asvorko è soltanto Orazio con il cerone, e la battuta gliela puoi dire in faccia."
        requisiti: [teatro.ruolo == 1]
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Gli occhi alti
          testo: |
            Quando Asvorko alza la testa dal suo mucchio di monete, tu la schiena non la curvi. Gli vai sotto
            fino a un passo e gli dici la battuta guardandolo dritto, con una voce bassa che non hai mai usato
            davanti a un padrone. Da così vicino vedi il cerone screpolato agli angoli della sua bocca. Orazio
            indietreggia di mezzo passo, e il copione non lo prevede.

            Poi crolla in ginocchio e si pente con le lacrime vere, e le arpie cadono. Orazio ti mette in mano
            la tua parte dell'incasso e non ti chiede dove hai imparato.
          effetti: { monete: 18, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { intimidire: 5 }
        fallimento:
          titolo: La schiena curva
          testo: |
            Asvorko alza la testa dal suo mucchio di monete, e la schiena ti si curva da sola, con gli occhi
            sulle assi del palco, come quando passavano i sorveglianti. Sulle assi c'è la croce di gesso dove
            devi fermarti, e tu guardi quella. La battuta la dici al pavimento, e in sala qualcuno tossisce.

            Orazio non fa una piega. Si inginocchia per raccoglierla, e si pente lo stesso, rivolto alle tue
            scarpe. La sala lo prende per una trovata di regia e applaude a lungo. La tua parte dell'incasso
            arriva comunque, un po' più leggera.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { intimidire: 3 }
      - testo: "Aprire le ali come le apre un rapace"
        descrizione: "Nel Bosco di Velthar hai guardato abbastanza uccelli da sapere che le ali grandi non si aprono in un colpo solo."
        requisiti: [teatro.ruolo == 2]
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il rapace
          testo: |
            Quando la regina ride tiri il primo cordino a metà, e le ali si sollevano piegate, come quelle di
            un rapace che si scrolla prima di partire. Il cordino ti segna il palmo e nelle dita senti il peso
            delle piume che si assestano. Poi tiri il secondo, e le ali si aprono fino in fondo, nere sotto le
            lampade.

            Dopo lo spettacolo un mercante della Gilda ti cerca dietro le quinte. Vuole sapere chi ha
            costruito quelle ali e ti lascia il suo nome per un lavoro, mentre Orazio ti conta in mano la tua
            parte dell'incasso.
          effetti: { monete: 16, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { natura: 5 }
        fallimento:
          titolo: Il passero bagnato
          testo: |
            Tiri il secondo cordino troppo presto, e le ali, invece di aprirsi, tremano a mezz'aria come
            quelle di un passero che si scuote la pioggia di dosso. Qualche piuma si stacca e scende girando
            nella luce della ribalta, e dal loggione parte una risata.

            Violante non perde il ritmo, si scuote anche lei e trasforma la risata dell'arpia in un verso di
            stizza. Orazio dirà poi che era voluto. La serata arriva fino al pentimento di Asvorko, e la tua
            parte dell'incasso arriva lo stesso.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { natura: 3 }
      - testo: "Lavorare le funi come sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice una corda si tiene con tutto il corpo e si molla al segnale."
        requisiti: [teatro.ruolo == 3]
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Al segnale
          testo: |
            Ti avvolgi la fune del pozzo intorno all'avambraccio come sulle piattaforme, con il piede puntato
            sulla stanga della ruota, e aspetti il segnale. La canapa è più morbida delle corde della
            Cicatrice e scorre senza strappi. Al segnale apri la botola sotto il primo orco e lasci cadere la
            trave di cartapesta un palmo davanti agli avventurieri. Poi fai scattare l'arco con la freccia di
            piuma, al ritmo con cui si cala un compagno nella Cicatrice.

            Orazio ti paga la tua parte dell'incasso.
          effetti: { monete: 14, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { atletica: 5 }

  # Variante: il palco dei Malgrani è vuoto, e Sigor lo fa il vecchio macchinista.
  - id: la-prima-della-promessa-dopo-i-malgrani
    presso: teatro-delle-meraviglie
    immagine: personaggi/violante
    titolo: La prima della Promessa
    sommario: "Il manifesto ha una data nuova e la platea è piena fino al loggione. Stasera Orazio alza il sipario sulla Promessa dell'Arpia."
    luogo: Teatro delle Meraviglie di Belcanto, la sera della prima
    area: quartieri-alti
    requisiti: [pista.teatro == 1, prove.arpia >= 3, pista.pelle >= 5]
    mostra: 2
    testo: |
      Sulla striscia *rinviata* del manifesto hanno incollato una data nuova, e la colla ha fatto le bolle
      sotto la carta. Stasera la platea è piena fino al loggione, e dalle quinte senti l'odore dell'olio delle
      lampade e del velluto scaldato da mille persone. Il palco dei Malgrani in seconda fila ha le tende
      tirate, e la Casa dei Nodi ha mandato mezza Gilda.

      {galateo Facile} Un palco vuoto alla prima, con le tende tirate, è un messaggio. Le tende di un palco
      pagato per tutta la stagione si chiudono soltanto quando la famiglia vuole che la sala lo noti.

      {origine rampollo-dei-quartieri-alti} Il palco della tua famiglia, in terza fila, ha la tenda aperta. Da
      dietro la quinta non vedi chi c'è dentro, e ti tiri giù le maniche fino alle nocche.

      {origine mercante-dei-ponti} In platea c'è l'esattore che dopo la razzia ha controllato il tuo banco, e
      già conta le poltrone.

      Nel primo atto l'Asvorko di Orazio conta le monete delle miniere di Valpeltro, che sono rondelle di
      latta e sul tavolo suonano più leggere dell'argento. Quando la regina arpia entra nel mantello di piume
      la sala smette di frusciare, e Violante gli promette la lealtà degli operai in cambio di un nido nelle
      gallerie.

      Nel secondo atto il vecchio macchinista, nei panni di Sigor, assolda gli avventurieri alla taverna del
      Fiasco Asciutto e apre il tunnel sotto le botti. Tiene le dita storte intrecciate sul grembiule da oste,
      e ogni tanto alza gli occhi verso le funi. Poi vengono gli orchi in maschera e il golem di cartapesta
      del terzo atto, che sotto la ribalta ha il grigio della pietra e cigola sulla ruota della carriola che
      lo porta. Nel nido ti aspettano le trappole e il momento che hai provato tante volte.
    opzioni:
      - testo: "Affrontare Asvorko nel nido delle arpie"
        descrizione: "La scena ottava è tua. Davanti hai Orazio in ginocchio e mille persone al buio."
        requisiti: [teatro.ruolo == 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Un errore imperdonabile
          testo: |
            Pianti i piedi sulle assi e dici la battuta all'ultima fila senza fretta. La voce sale fino al
            loggione, e lassù nessuno si muove.

            Orazio crolla in ginocchio e si pente con le lacrime vere e gli anelli che battono sul legno. La
            regina ride la sua ultima risata e le arpie cadono. Gli operai di Valpeltro tornano a casa, e
            Asvorko promette di cambiare.

            La sala si alza in piedi, e lo schiocco delle poltrone che si richiudono copre l'inizio
            dell'applauso. Da un palco anche Julia Castaldi applaude, con i guanti. Dopo lo spettacolo Orazio
            ti mette in mano un sacchetto di velluto con la tua parte dell'incasso, e dal peso capisci che
            stavolta le monete sono d'argento.
          effetti: { monete: 18, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { espressivita: 5 }
        fallimento:
          titolo: Il tunnel, signore
          testo: |
            Apri la bocca e la battuta non c'è più. Dalla quinta il vecchio macchinista te ne sussurra una, ed
            è quella del tunnel di contrabbando. Tu la ripeti ad alta voce nel nido delle arpie davanti a
            mille persone, e nel silenzio che segue senti sfrigolare lo stoppino di una lampada della ribalta.

            Orazio non fa una piega. Si pente lo stesso, dicendo che perfino i tunnel gli hanno insegnato
            qualcosa, e la sala lo prende per satira e ride. L'applauso alla fine è lungo, e la tua parte
            dell'incasso arriva comunque, un po' più leggera.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { espressivita: 3 }
      - testo: "Manovrare le ali e il golem dalle quinte"
        descrizione: "Due cordini per le ali della regina, uno sportello per il golem, e nessuno deve vederti."
        requisiti: [teatro.ruolo == 2]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Ali nere
          testo: |
            Il golem avanza sulla carriola di Grusk e si spacca lungo la cucitura di colla che avevi lasciato
            più sottile apposta, e la prima fila sobbalza. Quando la regina ride tiri i cordini, e le ali si
            aprono fino in fondo, nere sotto le lampade. Le cinghie reggono senza un cigolio, e le piume si
            fermano tutte insieme.

            Dopo lo spettacolo un mercante della Gilda ti cerca dietro le quinte. Vuole sapere chi ha
            costruito quelle ali e ti lascia il suo nome per un lavoro, mentre Orazio ti conta in mano la tua
            parte dell'incasso.
          effetti: { monete: 16, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: La testa del golem
          testo: |
            A metà del combattimento la testa del golem si stacca, rotola giù dal palco e si ferma ai piedi di
            un mercante della Gilda in prima fila. Dal collo spuntano i giornali appallottolati che la
            tenevano in forma. Lui la guarda come si guarda un conto sbagliato, e tu dietro la quinta pianti
            le dita nel velluto del sipario.

            Orazio non perde il ritmo. «Così finiscono i golem di chi tradisce i lavoratori!» grida, e la sala
            applaude. La serata va avanti fino al pentimento di Asvorko, e la tua parte dell'incasso arriva lo
            stesso.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { tecnologia: 3 }
      - testo: "Far scattare le trappole di cartapesta"
        descrizione: "Il pozzo nascosto e la trave instabile dipendono da te, e da quanto sei svelt{o|a} con le funi."
        requisiti: [teatro.ruolo == 3]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Facile }
        successo:
          titolo: Le trappole del nido
          testo: |
            Apri la botola del pozzo nascosto sotto il primo orco, e la fune ti scorre liscia fra i guanti di
            cuoio. Poi lasci cadere la trave di cartapesta un palmo davanti agli avventurieri e fai scattare
            l'arco con una freccia di piuma. A ogni trappola il loggione urla, e Asvorko arriva al pentimento
            con la sala già in piedi.

            Dopo lo spettacolo il vecchio macchinista controlla i tuoi nodi uno per uno con le dita storte,
            poi ti fa un cenno con la testa. Orazio ti paga la tua parte dell'incasso e ti dice che un giorno
            racconterai di questa sera ai nipoti.
          effetti: { monete: 14, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { atletica: 5 }
        fallimento:
          titolo: Grusk sta bene
          testo: |
            Sbagli fune, e la botola del pozzo si apre sotto Grusk invece che sotto l'orco. Grusk sparisce, e
            da sotto il palco arriva il tonfo di un corpo grosso sulle assi. In sala cade un silenzio lungo,
            nel quale senti benissimo il tuo cuore.

            Poi la sua testa riemerge dal pavimento, con la segatura del sottopalco nei capelli. «Grusk sta
            bene!» annuncia al pubblico, e la sala viene giù dalle risate. Orazio dirà poi che è stato il
            momento più alto della serata, e ti paga la tua parte con una smorfia.
          effetti: { monete: 10, racconto: 1, pista.teatro: 1 }
          pe: { atletica: 3 }
      - testo: "Restare al tuo posto quando la regina apre le ali"
        descrizione: "Nel nido la regina ha una battuta sulle ali che alle prove ti era scivolata addosso."
        requisiti: [pista.sepolcro >= 5]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Sangue freddo
          testo: |
            Violante apre le ali sopra Asvorko, e l'aria smossa dalle piume ti arriva in faccia con l'odore
            della colla. «Spezzatemi le ali quante volte volete, signor Asvorko. La regina torna sempre.» Ti
            torna in mente una voce rotta, sulla Roccia di Wren, e il sudore ti si raffredda sulla nuca. *È
            una battuta, e l'ha scritta Orazio.* Le tue mani cercano la cintura, e le rimetti dove devono
            stare.

            Agli applausi Violante ti stringe la mano un momento più del necessario, e la sua presa è salda
            quanto basta a fermarti il tremito. Poi Orazio ti paga la tua parte dell'incasso.
          effetti: { monete: 15, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { resilienza: 5 }
        fallimento:
          titolo: "Ferm{o|a} in scena"
          testo: |
            Violante apre le ali sopra Asvorko. «Spezzatemi le ali quante volte volete, signor Asvorko. La
            regina torna sempre.» Ti si gela il sangue e resti ferm{o|a} con la bocca aperta. Mille persone
            aspettano, e dal loggione arriva soltanto il cigolio di un sedile.

            Violante se ne accorge. Ti gira intorno con le ali spalancate e inventa una battuta che ti rimette
            in scena. Orazio dopo giura che la tua è stata la pausa più ispirata della serata, e ti paga senza
            sapere perché ti tremano ancora le dita.
          effetti: { monete: 12, racconto: 1, tormento: 1, pista.teatro: 1 }
          pe: { resilienza: 3 }
      - testo: "Trattare Asvorko come un socio della Gilda"
        descrizione: "La battuta suona meglio detta come si chiude un affare al banco."
        requisiti: [teatro.ruolo == 1]
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: L'affare chiuso
          testo: |
            Ti avvicini ad Asvorko come ci si avvicina a un socio che ha sbagliato un conto, e gli dici la
            battuta piano, con la pazienza che si usa quando il conto è già fatto. Da vicino vedi Orazio
            deglutire sotto il cerone.

            Orazio crolla in ginocchio con le lacrime vere. La regina ride la sua ultima risata e le arpie
            cadono. La sala si alza in piedi, e da un palco anche Julia Castaldi applaude, con i guanti. Dopo
            lo spettacolo Orazio ti mette in mano un sacchetto di velluto con la tua parte dell'incasso.
          effetti: { monete: 18, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { persuasione: 5 }
        fallimento:
          titolo: La voce del mercato
          testo: |
            A metà battuta la voce ti scivola nel tono del Mercato dei Nodi, e ad Asvorko annunci il suo
            errore come si annuncia un prezzo di fine giornata. Il loggione ride nel punto sbagliato. Tu senti
            le orecchie diventare calde sotto il cerone, che comincia a farsi molle sulle tempie.

            Orazio non fa una piega. Si pente lo stesso, con un tono da debitore che la sala prende per
            satira, e alla fine l'applauso è lungo. La tua parte dell'incasso arriva comunque, un po' più
            leggera.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { persuasione: 3 }
      - testo: "Guardare Asvorko negli occhi"
        descrizione: "Stasera Asvorko è soltanto Orazio con il cerone, e la battuta gliela puoi dire in faccia."
        requisiti: [teatro.ruolo == 1]
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Gli occhi alti
          testo: |
            Quando Asvorko alza la testa dal suo mucchio di monete, tu la schiena non la curvi. Gli vai sotto
            fino a un passo e gli dici la battuta guardandolo dritto, con una voce bassa che non hai mai usato
            davanti a un padrone. Da così vicino vedi il cerone screpolato agli angoli della sua bocca. Orazio
            indietreggia di mezzo passo, e il copione non lo prevede.

            Poi crolla in ginocchio e si pente con le lacrime vere, e le arpie cadono. Orazio ti mette in mano
            la tua parte dell'incasso e non ti chiede dove hai imparato.
          effetti: { monete: 18, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { intimidire: 5 }
        fallimento:
          titolo: La schiena curva
          testo: |
            Asvorko alza la testa dal suo mucchio di monete, e la schiena ti si curva da sola, con gli occhi
            sulle assi del palco, come quando passavano i sorveglianti. Sulle assi c'è la croce di gesso dove
            devi fermarti, e tu guardi quella. La battuta la dici al pavimento, e in sala qualcuno tossisce.

            Orazio non fa una piega. Si inginocchia per raccoglierla, e si pente lo stesso, rivolto alle tue
            scarpe. La sala lo prende per una trovata di regia e applaude a lungo. La tua parte dell'incasso
            arriva comunque, un po' più leggera.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { intimidire: 3 }
      - testo: "Aprire le ali come le apre un rapace"
        descrizione: "Nel Bosco di Velthar hai guardato abbastanza uccelli da sapere che le ali grandi non si aprono in un colpo solo."
        requisiti: [teatro.ruolo == 2]
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il rapace
          testo: |
            Quando la regina ride tiri il primo cordino a metà, e le ali si sollevano piegate, come quelle di
            un rapace che si scrolla prima di partire. Il cordino ti segna il palmo e nelle dita senti il peso
            delle piume che si assestano. Poi tiri il secondo, e le ali si aprono fino in fondo, nere sotto le
            lampade.

            Dopo lo spettacolo un mercante della Gilda ti cerca dietro le quinte. Vuole sapere chi ha
            costruito quelle ali e ti lascia il suo nome per un lavoro, mentre Orazio ti conta in mano la tua
            parte dell'incasso.
          effetti: { monete: 16, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { natura: 5 }
        fallimento:
          titolo: Il passero bagnato
          testo: |
            Tiri il secondo cordino troppo presto, e le ali, invece di aprirsi, tremano a mezz'aria come
            quelle di un passero che si scuote la pioggia di dosso. Qualche piuma si stacca e scende girando
            nella luce della ribalta, e dal loggione parte una risata.

            Violante non perde il ritmo, si scuote anche lei e trasforma la risata dell'arpia in un verso di
            stizza. Orazio dirà poi che era voluto. La serata arriva fino al pentimento di Asvorko, e la tua
            parte dell'incasso arriva lo stesso.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { natura: 3 }
      - testo: "Lavorare le funi come sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice una corda si tiene con tutto il corpo e si molla al segnale."
        requisiti: [teatro.ruolo == 3]
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Al segnale
          testo: |
            Ti avvolgi la fune del pozzo intorno all'avambraccio come sulle piattaforme, con il piede puntato
            sulla stanga della ruota, e aspetti il segnale. La canapa è più morbida delle corde della
            Cicatrice e scorre senza strappi. Al segnale apri la botola sotto il primo orco e lasci cadere la
            trave di cartapesta un palmo davanti agli avventurieri. Poi fai scattare l'arco con la freccia di
            piuma, al ritmo con cui si cala un compagno nella Cicatrice.

            Orazio ti paga la tua parte dell'incasso.
          effetti: { monete: 14, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { atletica: 5 }

  # ------------------------------------------------------------ repliche ripetibili
  - id: le-repliche
    presso: teatro-delle-meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    titolo: Una replica della Promessa
    sommario: "La Promessa dell'Arpia è rimasta in cartellone, e ogni sera c'è da rifarla da capo."
    luogo: Teatro delle Meraviglie di Belcanto, una sera di replica
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.teatro >= 2]
    mostra: 1
    testo: |
      Dopo la prima la Promessa dell'Arpia è rimasta in cartellone, e la sala si riempie ogni sera un po'
      meno, tranne il sabato. Nelle vie dei Quartieri Alti la pioggia ha già gonfiato la carta dei manifesti.
      Isotta Cordani siede sempre nello stesso palco e ride dove il pubblico tace.

      Grusk ha imparato a dire Rolan, e adesso a volte non risponde quando lo chiamano per la paga. Orazio ha
      aggiunto due battute al pentimento di Asvorko, e il terzo atto si è allungato. Sulle assi del palco è
      comparsa una striscia più chiara dove ogni sera cade la trave di cartapesta.

      Il vecchio macchinista accende le lampade della ribalta una alla volta con lo stesso stoppino lungo, e
      l'odore dell'olio arriva fino alle prime file. In platea si spengono le chiacchiere, e il sipario
      aspetta te.
    opzioni:
      - testo: "Recitare l'avventuriero"
        descrizione: "Stessa battuta, stesso Orazio in ginocchio, un pubblico nuovo."
        requisiti: [teatro.ruolo == 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Una buona sera
          testo: |
            Stasera la battuta ti viene come se l'avessi pensata tu, e Orazio piange un po' meno del solito
            per lasciarti la scena. Agli applausi una bambina in prima fila ti indica alla madre e prova a
            ripetere la tua battuta, sbagliandola in un modo che ti piace di più. In camerino ti fa male la
            gola, e il cerone viene via sull'asciugamano in una striscia bianca. Orazio ti mette in mano la
            paga della serata.
          effetti: { monete: 4 }
          pe: { espressivita: 3 }
        fallimento:
          titolo: Il loggione
          testo: |
            Inciampi su una parola e poi sulla trave di cartapesta, che si ammacca sotto lo stivale con un
            rumore di cartone. Dal loggione arriva un fischio lungo, e ti brucia la faccia fino al sipario. Il
            giorno dopo in un caffè dei Quartieri Alti un cameriere lo racconta ridendo a un tavolo di
            clienti, e fa il tuo nome. Orazio ti paga lo stesso, ma in spiccioli.
          effetti: { monete: 1, scandalo: 1 }
      - testo: "Tenere insieme ali e golem"
        descrizione: "La cartapesta, dopo dieci repliche, comincia a stancarsi."
        requisiti: [teatro.ruolo == 2]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Colla e piume
          testo: |
            Prima dello spettacolo rinforzi le cinghie delle ali e ripassi il collo del golem con un'altra
            mano di colla. La colla di farina tira mentre asciuga, e sotto le dita senti la cartapesta farsi
            dura. Tutto si apre e si spacca al momento giusto, e Violante uscendo di scena ti lascia in mano
            una piuma caduta. La paga arriva dopo lo spettacolo, contata due volte da Orazio.
          effetti: { monete: 4 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: Piume in platea
          testo: |
            A metà della risata della regina un'ala si sfilaccia dove la cinghia ha consumato la tela, e le
            piume nere scendono sulla prima fila. Una signora ne trova una nel bicchiere e il giorno dopo lo
            racconta a mezzo quartiere, insieme al nome di chi cura i costumi. Passi l'intervallo in ginocchio
            a raccogliere piume fra le poltrone con le ginocchia che scricchiolano sul legno, e la paga
            stasera è uno spicciolo.
          effetti: { monete: 1, scandalo: 1 }
      - testo: "Stare alle funi e alle botole"
        descrizione: "Sipario, pozzo nascosto, trave. Lavoro che nessuno vede finché va bene."
        requisiti: [teatro.ruolo == 3]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Nessuno ti vede
          testo: |
            Le funi scorrono e le botole si aprono quando devono, e per tutta la sera nessuno in sala sa che
            esisti. Alla fine hai le spalle dure e i palmi caldi dentro i guanti di cuoio che hanno preso la
            piega delle tue dita. Il vecchio macchinista ti offre un sorso dalla sua fiaschetta, che sa di
            prugne, e Orazio ti dà la paga.
          effetti: { monete: 3 }
          pe: { atletica: 3 }
        fallimento:
          titolo: Il sipario a metà
          testo: |
            Il sipario si inceppa a metà sul finale, perché la fune rossa è saltata fuori dalla gola della
            ruota. Orazio fa l'inchino a un pezzo di velluto rosso. Dal palco di Isotta Cordani parte una
            risata che il giorno dopo si sente in tutti i salotti. Orazio ti paga il minimo e non ti rivolge
            la parola fino a mezzanotte, quando ti chiede di aiutarlo a togliersi il mantello, e intanto
            sospira forte perché tu lo senta.
          effetti: { monete: 1, scandalo: 1 }

  # ------------------------------------------------------------ carta · Orazio in strada
  - id: carta-belcanto-cerca-attori
    immagine: personaggi/orazio-belcanto
    titolo: Un manifesto fresco di colla
    sommario: "Orazio Belcanto attacca di persona i manifesti della sua opera, e ferma chiunque gli sembri adatto al palcoscenico."
    tipo: carta
    area: quartieri-alti
    requisiti: [pista.teatro == 0]
    testo: |
      In una via dei Quartieri Alti un garzone regge il secchio della colla e un altro tiene ferma una scala.
      La colla è di farina e acqua, e il pennello che ci sta dentro ha le setole incrostate fino al manico. In
      cima Orazio Belcanto liscia con le mani inanellate un manifesto della *Promessa dell'Arpia*, e ogni
      anello lascia sulla carta bagnata un piccolo segno tondo. Quando ti vede si porta una mano al petto, e
      la scala oscilla sotto di lui.

      «Anima cara, che profilo!» dice con la voce che gli sale di un'ottava. «Il sinistro, almeno. La mia
      Promessa dell'Arpia cerca gente della città per il palco e per le quinte, e io ti cerco da tutta la
      mattina senza saperlo.»
    opzioni:
      - testo: "Lasciarti convincere"
        descrizione: "Gli dici che ci penserai. Orazio sente solo la prima metà della frase."
        quando: [pista.pelle < 5]
        esito:
          titolo: Generosa malizia
          testo: |
            Orazio ti mette in mano un manifesto ancora umido, e sulle dita ti resta l'odore dolciastro della
            colla. Ti dice di presentarti al Teatro delle Meraviglie quando vuoi e di chiedere di lui.
            Intanto, siccome conosce tutti, ti regala un pettegolezzo. Isotta Cordani alla Boutique fa pagare
            doppio gli abiti ai Malgrani, e Lucia Malgrani paga senza capire perché.

            «Non dirlo in giro» dice, e risale sulla scala per il manifesto successivo. Dal terzo piolo lo
            senti già raccontarlo al garzone della colla.
          effetti: { informazioni.voce: 1 }
      # Dopo la caduta dei Malgrani (pista.pelle >= 5) il pettegolezzo di Orazio si aggiorna.
      - testo: "Lasciarti convincere"
        descrizione: "Gli dici che ci penserai. Orazio sente solo la prima metà della frase."
        quando: [pista.pelle >= 5]
        esito:
          titolo: Generosa malizia
          testo: |
            Orazio ti mette in mano un manifesto ancora umido, e sulle dita ti resta l'odore dolciastro della
            colla. Ti dice di presentarti al Teatro delle Meraviglie quando vuoi e di chiedere di lui.
            Intanto, siccome conosce tutti, ti regala un pettegolezzo. Isotta Cordani alla Boutique per anni
            ha fatto pagare doppio gli abiti ai Malgrani, e adesso che dai Malgrani non arriva più niente se
            ne lamenta con tutte le clienti.

            «Non dirlo in giro» dice, e risale sulla scala per il manifesto successivo. Dal terzo piolo lo
            senti già raccontarlo al garzone della colla.
          effetti: { informazioni.voce: 1 }
      - testo: "Rifiutare con garbo"
        descrizione: "Lo ringrazi, gli lodi il manifesto e gli dici di no."
        esito:
          titolo: L'Arte è paziente
          testo: |
            Orazio sospira con tutto il corpo, una mano sulla fronte, e gli anelli mandano un piccolo
            bagliore. «L'Arte è paziente» dice. «Io molto meno, ma ti aspetterò lo stesso.»

            Ti lascia andare con un inchino così profondo che il garzone del secchio deve fare un passo
            indietro, e prima di girarti lo vedi già fermare il passante successivo.
          pe: { galateo: 2 }
