            è stato il momento più alto della serata, e ti paga la tua parte con
            una smorfia.
          effetti: { monete: 10, racconto: 1, pista.teatro: 1 }
          pe: { atletica: 3 }
      - testo: "Restare al tuo posto quando la regina apre le ali"
        descrizione: "Nel nido la regina ha una battuta sulle ali che alle prove ti era scivolata addosso."
        requisiti: [pista.sepolcro >= 5]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Sangue freddo
          testo: |
            Violante apre le ali sopra Asvorko. «Spezzatemi le ali quante volte
            volete, signor Asvorko. La regina torna sempre.» Ti torna in mente una
            voce rotta, sulla Roccia di Wren, e il sudore ti si raffredda sulla
            nuca. *È una battuta, e l'ha scritta Orazio.* Le tue mani cercano la
            cintura, e le rimetti dove devono stare.

            Agli applausi Violante ti stringe la mano un momento più del
            necessario, poi Orazio ti paga la tua parte dell'incasso.
          effetti: { monete: 15, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { resilienza: 5 }
        fallimento:
          titolo: "Ferm{o|a} in scena"
          testo: |
            Violante apre le ali sopra Asvorko. «Spezzatemi le ali quante volte
            volete, signor Asvorko. La regina torna sempre.» Ti si gela il sangue
            e resti ferm{o|a}, con la bocca aperta e mille persone che aspettano.

            Violante se ne accorge. Ti gira intorno con le ali spalancate e
            inventa una battuta che ti rimette in scena. Orazio, dopo, giura che
            la tua è stata la pausa più ispirata della serata, e ti paga senza
            sapere perché ti tremano ancora le dita.
          effetti: { monete: 12, racconto: 1, tormento: 1, pista.teatro: 1 }
          pe: { resilienza: 3 }
      - testo: "Trattare Asvorko come un socio della Gilda"
        descrizione: "La battuta suona meglio detta come si chiude un affare al banco."
        requisiti: [teatro.ruolo == 1]
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: L'affare chiuso
          testo: |
            Ti avvicini ad Asvorko come ci si avvicina a un socio che ha sbagliato
            un conto, e gli dici la battuta piano, con la pazienza che si usa
            quando il conto è già fatto.

            Orazio crolla in ginocchio con le lacrime vere, la regina ride la sua
            ultima risata e le arpie cadono. La sala si alza in piedi, e da un
            palco anche Julia Castaldi applaude, con i guanti. Dopo lo spettacolo
            Orazio ti mette in mano un sacchetto di velluto con la tua parte
            dell'incasso.
          effetti: { monete: 18, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { persuasione: 5 }
        fallimento:
          titolo: La voce del mercato
          testo: |
            A metà battuta la voce ti scivola nel tono del Mercato dei Nodi, e
            ad Asvorko annunci il suo errore come si annuncia un prezzo di
            fine giornata. Il loggione ride nel punto sbagliato, e tu senti le
            orecchie diventare calde sotto il cerone.

            Orazio non fa una piega. Si pente lo stesso, con un tono da
            debitore che la sala prende per satira, e alla fine l'applauso è
            lungo. La tua parte dell'incasso arriva comunque, un po' più
            leggera.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { persuasione: 3 }
      - testo: "Guardare Asvorko negli occhi"
        descrizione: "Stasera Asvorko è soltanto Orazio con il cerone, e la battuta gliela puoi dire in faccia."
        requisiti: [teatro.ruolo == 1]
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Gli occhi alti
          testo: |
            Quando Asvorko alza la testa dal suo mucchio di monete, tu la schiena
            non la curvi. Gli vai sotto fino a un passo e gli dici la battuta
            guardandolo dritto, con una voce bassa che non hai mai usato davanti a
            un padrone. Orazio indietreggia di mezzo passo, e il copione non lo
            prevede.

            Poi crolla in ginocchio e si pente con le lacrime vere, e le arpie
            cadono. Orazio ti mette in mano la tua parte dell'incasso e non ti
            chiede dove hai imparato.
          effetti: { monete: 18, racconto: 1, rep.castaldi: 0.5, pista.teatro: 1 }
          pe: { intimidire: 5 }
        fallimento:
          titolo: La schiena curva
          testo: |
            Asvorko alza la testa dal suo mucchio di monete, e la schiena ti si
            curva da sola, con gli occhi sulle assi del palco, come quando
            passavano i sorveglianti. La battuta la dici al pavimento, e in
            sala qualcuno tossisce.

            Orazio non fa una piega. Si inginocchia per raccoglierla, e si
            pente lo stesso, rivolto alle tue scarpe. La sala lo prende per una
            trovata di regia e applaude a lungo. La tua parte dell'incasso
            arriva comunque, un po' più leggera.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { intimidire: 3 }
      - testo: "Aprire le ali come le apre un rapace"
        descrizione: "Nel Bosco di Velthar hai guardato abbastanza uccelli da sapere che le ali grandi non si aprono in un colpo solo."
        requisiti: [teatro.ruolo == 2]
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il rapace
          testo: |
            Quando la regina ride tiri il primo cordino a metà, e le ali si
            sollevano piegate, come quelle di un rapace che si scrolla prima di
            partire. Poi tiri il secondo, e si aprono fino in fondo, nere sotto le
            lampade.

            Dopo lo spettacolo un mercante della Gilda ti cerca dietro le quinte.
            Vuole sapere chi ha costruito quelle ali e ti lascia il suo nome per
            un lavoro, mentre Orazio ti conta in mano la tua parte dell'incasso.
          effetti: { monete: 16, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { natura: 5 }
        fallimento:
          titolo: Il passero bagnato
          testo: |
            Tiri il secondo cordino troppo presto, e le ali, invece di aprirsi,
            tremano a mezz'aria come quelle di un passero che si scuote la
            pioggia di dosso. Dal loggione parte una risata.

            Violante non perde il ritmo, si scuote anche lei e trasforma la
            risata dell'arpia in un verso di stizza. Orazio dirà poi che era
            voluto. La serata arriva fino al pentimento di Asvorko, e la tua
            parte dell'incasso arriva lo stesso.
          effetti: { monete: 12, racconto: 1, pista.teatro: 1, scandalo: 0.5 }
          pe: { natura: 3 }
      - testo: "Lavorare le funi come sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice una corda si tiene con tutto il corpo e si molla al segnale."
        requisiti: [teatro.ruolo == 3]
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Al segnale
          testo: |
            Ti avvolgi la fune del pozzo intorno all'avambraccio come sulle
            piattaforme, con il piede puntato sulla stanga della ruota, e aspetti
            il segnale. Apri la botola sotto il primo orco, lasci cadere la trave
            di cartapesta un palmo davanti agli avventurieri e fai scattare l'arco
            con la freccia di piuma, una cosa dopo l'altra, al ritmo con cui si
            cala un compagno nella Cicatrice.

            Orazio ti paga la tua parte dell'incasso.
          effetti: { monete: 14, racconto: 1, rep.gilda: 0.5, pista.teatro: 1 }
          pe: { atletica: 5 }

  # ------------------------------------------------------------ repliche ripetibili
  - id: le-repliche
    presso: teatro-delle-meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    titolo: Una replica della Promessa
    sommario: "La Promessa dell'Arpia è rimasta in cartellone, e ogni sera c'è da rifarla da capo."
    luogo: Teatro delle Meraviglie di Belcanto, una sera di replica
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.teatro >= 2]
    mostra: 1
    testo: |
      Dopo la prima la Promessa dell'Arpia è rimasta in cartellone, e la sala si riempie ogni sera un po'
      meno, tranne il sabato. Isotta Cordani siede sempre nello stesso palco e ride dove il pubblico tace.

      Grusk ha imparato a dire Rolan, e adesso a volte non risponde quando lo chiamano per la paga. Orazio ha
      aggiunto due battute al pentimento di Asvorko, e il terzo atto si è allungato.

      Il vecchio macchinista accende le lampade della ribalta. In platea si spengono le chiacchiere, e il
      sipario aspetta te.
    opzioni:
      - testo: "Recitare l'avventuriero"
        descrizione: "Stessa battuta, stesso Orazio in ginocchio, un pubblico nuovo."
        requisiti: [teatro.ruolo == 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: Una buona sera
          testo: |
            Stasera la battuta ti viene come se l'avessi pensata tu, e Orazio
            piange un po' meno del solito per lasciarti la scena. Agli applausi
            una bambina in prima fila ti indica alla madre e prova a ripetere la
            tua battuta, sbagliandola in un modo che ti piace di più. In camerino
            ti fa male la gola, e Orazio ti mette in mano la paga della serata.
          effetti: { monete: 4 }
          pe: { espressivita: 3 }
        fallimento:
          titolo: Il loggione
          testo: |
            Inciampi su una parola e poi sulla trave di cartapesta, e dal loggione
            arriva un fischio lungo. Ti brucia la faccia fino al sipario. Il
            giorno dopo, in un caffè dei Quartieri Alti, un cameriere lo racconta
            ridendo a un tavolo di clienti, e fa il tuo nome. Orazio ti paga lo
            stesso, ma in spiccioli.
          effetti: { monete: 1, scandalo: 1 }
      - testo: "Tenere insieme ali e golem"
        descrizione: "La cartapesta, dopo dieci repliche, comincia a stancarsi."
        requisiti: [teatro.ruolo == 2]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Colla e piume
          testo: |
            Prima dello spettacolo rinforzi le cinghie delle ali e ripassi il
            collo del golem con un'altra mano di colla. Tutto si apre e si spacca
            al momento giusto, e Violante, uscendo di scena, ti lascia in mano una
            piuma caduta. La paga arriva dopo lo spettacolo, contata due volte da
            Orazio.
          effetti: { monete: 4 }
          pe: { tecnologia: 3 }
        fallimento:
          titolo: Piume in platea
          testo: |
            Un'ala si sfilaccia a metà della risata della regina, e le piume nere
            scendono sulla prima fila. Una signora ne trova una nel bicchiere e il
            giorno dopo lo racconta a mezzo quartiere, insieme al nome di chi cura
            i costumi. Passi l'intervallo in ginocchio a raccogliere piume fra le
            poltrone, con le ginocchia che scricchiolano sul legno, e la paga
            stasera è uno spicciolo.
          effetti: { monete: 1, scandalo: 1 }
      - testo: "Stare alle funi e alle botole"
        descrizione: "Sipario, pozzo nascosto, trave. Lavoro che nessuno vede finché va bene."
        requisiti: [teatro.ruolo == 3]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Nessuno ti vede
          testo: |
            Le funi scorrono e le botole si aprono quando devono, e per tutta la
            sera nessuno in sala sa che esisti. Alla fine hai le spalle dure e i
            palmi caldi. Il vecchio macchinista ti offre un sorso dalla sua
            fiaschetta, che sa di prugne, e Orazio ti dà la paga.
          effetti: { monete: 3 }
          pe: { atletica: 3 }
        fallimento:
          titolo: Il sipario a metà
          testo: |
            Il sipario si inceppa a metà sul finale, e Orazio fa l'inchino a un
            pezzo di velluto rosso. Dal palco di Isotta Cordani parte una risata
            che il giorno dopo si sente in tutti i salotti. Orazio ti paga il
            minimo e non ti rivolge la parola fino a mezzanotte, quando ti chiede
            di aiutarlo a togliersi il mantello, e intanto sospira forte perché tu
            lo senta.
          effetti: { monete: 1, scandalo: 1 }

  # ------------------------------------------------------------ carta · Orazio in strada
  - id: carta-belcanto-cerca-attori
    immagine: personaggi/orazio-belcanto
    titolo: Un manifesto fresco di colla
    sommario: "Orazio Belcanto attacca di persona i manifesti della sua opera, e ferma chiunque gli sembri adatto al palcoscenico."
    tipo: carta
    area: quartieri-alti
    requisiti: [pista.teatro == 0]
    testo: |
      In una via dei Quartieri Alti un garzone regge il secchio della colla e un altro tiene ferma una scala.
      In cima Orazio Belcanto liscia con le mani inanellate un manifesto della *Promessa dell'Arpia*. Quando
      ti vede si porta una mano al petto, e la scala oscilla sotto di lui.

      «Anima cara, che profilo!» dice con la voce che gli sale di un'ottava. «Il sinistro, almeno. La mia
      Promessa dell'Arpia cerca gente della città per il palco e per le quinte, e io ti cerco da tutta la
      mattina senza saperlo.»
    opzioni:
      - testo: "Lasciarti convincere"
        descrizione: "Gli dici che ci penserai. Orazio sente solo la prima metà della frase."
        quando: [pista.pelle < 5]
        esito:
          titolo: Generosa malizia
          testo: |
            Orazio ti mette in mano un manifesto ancora umido e ti dice di
            presentarti al Teatro delle Meraviglie quando vuoi, chiedendo di lui.
            Intanto, siccome conosce tutti, ti regala un pettegolezzo. Isotta
            Cordani alla Boutique fa pagare doppio gli abiti ai Malgrani, e Lucia
            Malgrani paga senza capire perché.

            «Non dirlo in giro» dice, e risale sulla scala per il manifesto
            successivo.
          effetti: { informazioni.voce: 1 }
      # Dopo la caduta dei Malgrani (pista.pelle >= 5) il pettegolezzo di Orazio si aggiorna.
      - testo: "Lasciarti convincere"
        descrizione: "Gli dici che ci penserai. Orazio sente solo la prima metà della frase."
        quando: [pista.pelle >= 5]
        esito:
          titolo: Generosa malizia
          testo: |
            Orazio ti mette in mano un manifesto ancora umido e ti dice di
            presentarti al Teatro delle Meraviglie quando vuoi, chiedendo di lui.
            Intanto, siccome conosce tutti, ti regala un pettegolezzo. Isotta
            Cordani alla Boutique per anni ha fatto pagare doppio gli abiti ai
            Malgrani, e adesso che dai Malgrani non arriva più niente se ne
            lamenta con tutte le clienti.

            «Non dirlo in giro» dice, e risale sulla scala per il manifesto
            successivo.
          effetti: { informazioni.voce: 1 }
      - testo: "Rifiutare con garbo"
        descrizione: "Lo ringrazi, gli lodi il manifesto e gli dici di no."
        esito:
          titolo: L'Arte è paziente
          testo: |
            Orazio sospira con tutto il corpo, una mano sulla fronte, e gli anelli
            mandano un piccolo bagliore. «L'Arte è paziente» dice. «Io molto meno,
            ma ti aspetterò lo stesso.»

            Ti lascia andare con un inchino profondo, e prima di girarti lo vedi
            già fermare il passante successivo.
          pe: { galateo: 2 }
