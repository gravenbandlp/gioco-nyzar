          effetti: { prove.arpia: 1 }
          pe: { persuasione: 3 }
        fallimento:
          titolo: Le forbici di Rilla
          testo: |
            Le fai un abito che piace a Orazio, e Rilla lo prova senza protestare. Il giorno dopo si presenta
