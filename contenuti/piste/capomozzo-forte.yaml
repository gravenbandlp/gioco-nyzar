# Capomozzo, la fortezza (pista.capomozzo 2 → 3).
# Si entra dal cuore di Rovolungo (`borgoth-e-cenerascura`, capomozzo-1.yaml) o, dopo una ritirata, da
# `ritorno-alla-fortezza` alle Scuderie della Zanna Rotta.
# - area `capomozzo`: sette stanze ripetibili, in ordine secondo la profondità: 0 la palizzata (C10), 1 dentro
#   le mura (C11 la sala dei trofei, C12–C13 la torre dei sottaceti), 2 verso il lato a monte (C16 il cortile
#   dei cinghiali, C14–C15 la torre di guardia est e il camminamento, C25 la chiesa senza tetto), 3 la torre
#   est o la chiesa se non ci sei ancora passato, e C26 la scala dietro l'altare se sei passato dalla chiesa
#   (forte.chiesa). Una stanza superata non ricompare nella stessa visita (src/motore/spedizioni.ts).
# - storie non ripetibili: `ombrafosca-in-gabbia` (C17–C18), nel capanno in fondo al cortile, si apre dopo
#   che hai attraversato il cortile (forte.cortile), con il seguito `ombrafosca-fuori-dalla-gabbia`
#   (ombrafosca 1 liberato, 2 con te); `la-tesoreria-di-balthog` (C23–C24, tesoro.capomozzo), la camera
#   del capotribù accanto alla sala del trono, insieme al cuore.
# - il cuore `balthog-il-prescelto` (C19): in ogni ramo pista.capomozzo 3 e `vai: sotto-capomozzo`.
#   balthog vale 1 se muore nello scontro, 2 se lo atterri a sorpresa e lo lasci a terra vivo davanti al
#   trono; resta 0 se lo convinci (se ne va con la sua gente), se lo aggiri o se ti batte e ti butta giù per
#   la scala (resta sul trono).
quality:
  - { id: forte.cortile, nome: Hai attraversato il cortile dei cinghiali, categoria: stato, nascosta: true, descrizione: "1 se in questa visita sei arrivato in fondo al cortile, dove c'è il capanno del cavallo. La palizzata lo azzera." }
  - { id: forte.chiesa, nome: Sei passato dalla chiesa senza tetto, categoria: stato, nascosta: true, descrizione: "1 se in questa visita sei passato dalla chiesa, perché la scala nella roccia sta dietro l'altare. La palizzata lo azzera." }

aree:
  - id: capomozzo
    immagine: ambientazione/capomozzo
    nome: Capomozzo
    sommario: "La fortezza di Balthog in cima all'isola, dietro una palizzata fatta con le navi che il mare ha buttato sugli scogli."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Visto dal ponte di corda, il profilo dell'isola è quello di una testa
      tagliata, e la fortezza le sta in cima come una corona messa storta.
      Il sentiero sale fra gli scogli bagnati fino alla palizzata, alta
      quattro uomini, fatta di travi nere di catrame e di salsedine, e in
      mezzo alle travi spuntano gli alberi maestri di navi che in porto non
      sono mai arrivate. Il vento dal mare porta fumo di legna umida e odore
      di stalla.

      Dalla porta socchiusa si vede un cortile di terra battuta, e intorno al
      cortile i tetti bassi dei dormitori e della sala dei trofei. Sul lato a
      monte, più grande degli altri edifici, c'è la sala del trono di Balthog
      il Prescelto. In cima alla roccia resta in piedi una chiesa di pietra
      grigia senza tetto, molto più vecchia di ogni asse della palizzata.

      Su una trave accanto alla porta è rimasta inchiodata la targa d'ottone
      di una nave, *Brezza di Laresh*, e sotto qualcuno ha inciso col
      coltello una fila di tacche. Ti accorgi di avere i polpacci duri per la
      salita e di camminare sulle punte, piano, per non fare rumore.

storylet:
  # ------------------------------------------------------------ 2 · rientrare dopo una ritirata
  - id: ritorno-alla-fortezza
    presso: scuderie-della-zanna-rotta
    immagine: ambientazione/scuderie-della-zanna-rotta
    titolo: Di nuovo verso Capomozzo
    sommario: "Balthog è ancora sul suo trono, sull'isola oltre il ponte di corda. Per arrivarci ci vogliono due giorni e mezzo di strada verso la costa."
    luogo: Città Bassa, davanti alle Scuderie della Zanna Rotta
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.capomozzo == 2]
    testo: |
      Davanti alle Scuderie della Zanna Rotta Dolovan Stroud sta ferrando un
      cavallo pezzato, con lo zoccolo stretto fra le ginocchia e tre chiodi
      fra le labbra. Il pezzato sopporta con l'aria offesa di uno svegliato
      per niente. Quando gli dici dove torni Dolovan smette di battere, e si
      toglie i chiodi di bocca uno alla volta, come se dovesse contarli.

      «Capomozzo» dice, e sputa di lato. «L'isola con la testa mozzata. Mio
      nonno diceva che lassù c'era una chiesa già prima degli orchi, e che i
      pescatori ci giravano al largo anche allora. Io i cavalli li affitto
      per andare nei boschi. Per andare dagli orchi li affitto a prezzo
      doppio.»

      {conoscenze-della-strada Facile} Il prezzo doppio è la parte sincera
      del discorso. Il nonno e la chiesa sono la cortesia che ci mette
      sopra.

      {origine figlio-della-citta-bassa} Le Scuderie della Zanna Rotta le
      conosci da quando eri alto quanto un secchio, e da allora la storia
      del nonno e della chiesa è cresciuta di un nonno a ogni racconto. Il
      prezzo doppio, invece, Dolovan lo dice sempre con la stessa faccia.

      La strada la conosci. Sono due giorni e mezzo verso nord fino alla
      costa, e poi il roveto di Rovolungo e il ponte di corda sopra le onde.

      {resistenza Media fallita} Le gambe quella strada se la ricordano
      meglio di te, e non ne parlano bene. Ti fa male un ginocchio che fino
      a poco fa stava benissimo.

      Ti accorgi che le dita ti sono già andate alle cinghie dello zaino, a
      stringerle di un buco.
    opzioni:
      - testo: "Partire a piedi"
        descrizione: "Due giorni e mezzo di cammino, e le gambe se li ricordano ancora."
        esito:
          titolo: A piedi
          testo: |
            Parti all'alba con il pane nello zaino e cammini per due giorni
            e mezzo, prima fra le colline e poi lungo la costa, dove il
            vento ti secca le labbra e ti lascia il sale sulle ciglia. La
            seconda sera il pane è già duro, e lo mangi lo stesso guardando
            il mare. Il roveto di Rovolungo è come l'hai lasciato, e il
            ponte di corda regge ancora, anche se ondeggia a ogni colpo di
            vento. Sull'isola la palizzata di relitti è nera contro il
            cielo, e sulle torri ci sono le vedette.
          vai: capomozzo
      - testo: "Andare a cavallo"
        descrizione: "A cavallo la costa arriva un giorno prima."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Lungo la costa
          testo: |
            Il cavallo prende la strada del nord senza bisogno di essere
            guidato, e la costa grigia arriva il giorno dopo, piena di
            gabbiani che litigano sopra gli scogli. Lo lasci legato al pino
            storto davanti al roveto, con una bracciata d'erba davanti, e
            prosegui a piedi per il tunnel di cardi fino al ponte di corda,
            con i cardi che ti si attaccano ai calzoni. Quando sollevi la
            stuoia di rami per entrare nel roveto lui sta ancora guardando
            verso di te, con le orecchie dritte.
          vai: capomozzo
      - testo: "Affittare un cavallo da Dolovan"
        descrizione: "A prezzo doppio, come ha detto lui."
        requisiti: [monete >= 10]
        costo: 0
        esito:
          titolo: Il pezzato
          testo: |
            Dolovan conta le monete due volte e ti dà il pezzato che stava
            ferrando, con il ferro nuovo che ancora luccica sotto lo
            zoccolo. «Riportamelo intero, che con gli orchi ho già pagato
            abbastanza» dice, e ti batte una mano sul ginocchio. Il pezzato
            è lento e testardo, ma alla costa ci arrivi un giorno prima. Lo
            lasci legato al pino storto davanti al roveto e prosegui a piedi
            verso il ponte di corda.

            {cavalcare Media} Tira a sinistra quando è stanco e si ferma a
            ogni pozzanghera per pensarci sopra. Alla fine vi siete capiti,
            e ti dispiace quasi lasciarlo lì.
          effetti: { monete: -10 }
          vai: capomozzo

  # ------------------------------------------------------------ le stanze (ripetibili, in ordine di profondità)
  # 0 · la palizzata
  - id: capomozzo-palizzata
    immagine: ambientazione/capomozzo
    titolo: La palizzata di relitti
    sommario: "Una palizzata fatta di fasciame e di alberi di nave. Le porte sono socchiuse, e da dentro arriva il vociare degli orchi."
    luogo: Capomozzo, la palizzata
    area: capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 2, profondita.capomozzo == 0]
    testo: |
      La palizzata gira intorno alla cima dell'isola, e da vicino si vede di
      che cosa è fatta. Le travi sono fasciame di navi, ancora curvo, con i
      chiodi di rame diventati verdi, e ogni tanto fra un'asse e l'altra c'è
      un albero maestro piantato nella roccia con la sua coffa in cima.
      Accanto alla porta è inchiodata la polena di una nave, che raffigura
      una donna con i capelli scolpiti a onde, e gli orchi le hanno dipinto
      due zanne col sangue di qualche animale. Le zanne sono venute storte,
      e qualcuno ha provato a correggerle peggiorandole.

      {origine mercante-dei-ponti} Al Mercato dei Nodi ogni nave che non
      arriva in porto diventa una riga in rosso sui registri della Gilda, e
      qualcuno ci perde il sonno per un mese. Qui le righe rosse le hanno
      piantate nella roccia una accanto all'altra.

      {tecnologia Media} Il fasciame regge finché resta asciutto. Alla base,
      dove l'acqua di mare ristagna fra gli scogli, il tarlo ha avuto anni
      per lavorare.

      Le porte principali sono socchiuse, e da dentro arriva un vociare
      gutturale, una lite su chi deve andare a prendere l'acqua. Sulle due
      torri ai lati della porta ci sono le vedette.

      {furtivita Facile} Quella di sinistra si gira a sputare ogni volta che
      finisce una frase. L'altra tiene gli occhi fissi sul sentiero da cui
      sei salito.

      Ti appiattisci contro gli scogli e senti il freddo della pietra
      bagnata passarti attraverso la camicia.
    opzioni:
      - testo: "Passare sotto gli occhi delle vedette"
        descrizione: "Sono distratte, però da lassù vedono tutto il sentiero."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: La porta socchiusa
          testo: |
            Aspetti che la vedetta della torre di sinistra si giri a sputare
            di sotto, poi corri chino lungo la palizzata e ti infili nella
            porta socchiusa. Dentro c'è un androne di terra battuta con una
            botte d'acqua e un mestolo legato con lo spago, segno che
            qualcuno l'aveva già rubato una volta. Resti dietro la botte
            finché il cuore smette di martellarti nelle orecchie, e dalla
            torre arriva soltanto il rumore di uno che si soffia il naso con
            le dita.
          effetti: { profondita.capomozzo: 1 }
          imposta: { forte.cortile: 0, forte.chiesa: 0 }
        fallimento:
          titolo: Il sasso
          testo: |
            A metà strada un sasso ti rotola via da sotto lo stivale e
            scende per gli scogli saltando fino al mare. La vedetta si
            sporge e tira una lancia a caso verso gli scogli, che ti apre la
            spalla di striscio prima di piantarsi nel terreno accanto a te.
            Resti immobile, con il sangue che ti scende caldo nella manica,
            finché lassù qualcuno ride e la vedetta torna a sedersi.

            {furtivita Media} Ride perché non ti ha visto. Resta giù ancora
            un poco, perché chi ride poi si gira sempre a guardare.
          effetti: { ferite: 0.5 }
      - testo: "Cercare un'asse che ceda"
        descrizione: "Una palizzata fatta di relitti ha gli stessi difetti delle navi da cui viene."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Lo scafo marcio
          testo: |
            Passi le dita lungo il fasciame, un'asse dopo l'altra, finché ne
            trovi una che sotto il pollice si sfalda come pane bagnato. Il
            tarlo di mare ha fatto quasi tutto il lavoro. La stacchi piano
            dai chiodi verdi e ti infili nel varco, e dall'altra parte ti
            ritrovi fra un mucchio di reti e il muro dei dormitori, con la
            puzza di sudore d'orco che passa dalle fessure. Rimetti l'asse
            al suo posto dietro di te, con la cura che si mette a chiudere
            la porta di casa d'altri.
          effetti: { profondita.capomozzo: 1 }
          imposta: { forte.cortile: 0, forte.chiesa: 0 }
        fallimento:
          titolo: Il chiodo di rame
          testo: |
            Provi un'asse dopo l'altra, e tutte reggono, con un'ostinazione
            che non ti aspettavi da un relitto. All'ultima tiri troppo
            forte, e il chiodo di rame viene via di colpo e ti si pianta nel
            palmo. Ti mordi il polso per non gridare. Quando ritiri la mano
            il buco sanguina poco e fa male parecchio. Te lo fasci con un
            lembo della camicia, e intanto sulle torri le vedette continuano
            a litigare sulla storia dell'acqua.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare il cambio della guardia fra gli scogli"
        descrizione: "Prima o poi le vedette scendono a mangiare. Gli scogli sono bagnati, e la marea sale."
        costo: 2
        esito:
          titolo: La marea
          testo: |
            Ti rannicchi fra gli scogli sotto la palizzata e aspetti. La
            marea sale piano fino alle ginocchia, e un granchio decide che
            il tuo stivale è casa sua, e quando provi a sfrattarlo ti
            pizzica attraverso il cuoio. Quando finalmente le vedette
            scendono a mangiare hai le gambe intirizzite e i denti che
            battono, e passi la porta con i calzoni che gocciolano,
            lasciandoti dietro una scia scura sulla terra battuta.
          effetti: { profondita.capomozzo: 1, ferite: 0.5 }
          imposta: { forte.cortile: 0, forte.chiesa: 0 }

  # 1 · dentro le mura
  - id: capomozzo-sala-dei-trofei
    immagine: bestiario/orco
    titolo: La sala dei trofei
    sommario: "Due ali d'arpia inchiodate al muro con sette pugnali. Sotto, quattro orchi giocano con le selle dei cinghiali e una macchina senza volto aspetta in un angolo."
    luogo: Capomozzo, la sala dei trofei
    area: capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 2, profondita.capomozzo == 1]
    testo: |
      La sala dei trofei ha il pavimento di terra battuta, come se a chi
      l'ha costruita fosse finito il legname dopo il tetto. Lungo la parete
      est sono appese teste di cavallo e di cane conservate male, e a quelle
      che avevano perso gli occhi di vetro qualcuno ha cucito dei bottoni,
      ogni occhio di un colore diverso. Sulla parete sud c'è un paio di
      grandi ali dalle piume nere, inchiodate al muro con sette pugnali. Uno
      ha l'impugnatura di madreperla, e anche nella penombra manda una luce
      lattiginosa.

      {armi-da-mischia Media} Gli altri sei sono ferri da poco, buoni per
      inchiodare. Quello di madreperla ha l'equilibrio di un'arma fatta da
      qualcuno che sapeva il fatto suo.

      Intorno a un braciere quattro orchi fanno a gara a chi solleva più in
      alto la sella del proprio cinghiale, e ridono a ogni tentativo, anche
      quando la sella cade sul piede di qualcuno. In un angolo, immobile,
      c'è una figura alta quanto un uomo e sottile, con la testa girata
      all'indietro sulle spalle. È una macchina della Salvaguardia.

      {tecnologia Media fallita} Provi a capire che cosa la tiene in piedi e
      chi le dà gli ordini. Ti viene in mente soltanto che non vorresti
      essere tu a scoprirlo.

      {origine apprendista-raschiatore} Sulle piattaforme ti hanno insegnato
      che davanti a una macchina della Salvaguardia si torna alla scala e si
      risale. Qui di scale non ce ne sono, e le gambe la cercano lo stesso.

      {origine allievo-di-torvessa} L'ultima volta che hai visto una di queste
      macchine, i cristalli del banco dell'Accademia vibravano tutti insieme.
      Le dita ti vanno alla tasca dove di cristalli non ne hai, e i
      polpastrelli formicolano lo stesso.

      Ti accorgi che non hai sbattuto le palpebre da quando l'hai vista.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Gli orchi sono scesi di sella e hanno le mani occupate. La macchina è un'altra faccenda."
        combattimento: sala-dei-trofei
        vittoria:
          titolo: La sella
          testo: |
            Il primo orco ti arriva addosso con la sella ancora in mano, e
            la sella è la prima cosa che rompi. Gli altri scappano verso i
            dormitori a chiamare aiuto e non tornano, perché a svegliare gli
            altri non ci tiene nessuno. La macchina invece si gira tutta
            insieme con la testa, e ti viene incontro camminando
            all'indietro con una precisione che ti fa arretrare di un passo.
            Quando finalmente cade, il nucleo che ha nel petto ronza ancora
            un poco e poi si spegne, e per un pezzo continui a guardarlo per
            sicurezza.
          effetti: { profondita.capomozzo: 1 }
        sconfitta:
          titolo: Il polso
          testo: |
            Senza voltarsi, la macchina ti prende il polso da dietro e ti
            torce il braccio finché le ginocchia toccano terra. L'orco ti
            colpisce con la sella in piena faccia. Ti ritrovi fuori dalla
            sala, steso dietro un mucchio di reti, con il naso che sanguina
            e le risate degli orchi che passano dalla porta. Nessuno ti
            viene a cercare, perché la gara delle selle è ricominciata, e da
            come ridono la stai perdendo anche tu.
      - testo: "Passare lungo la parete delle teste"
        descrizione: "Gli orchi guardano la sella. La macchina guarda altrove, se una testa girata al contrario guarda da qualche parte."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Contato
          testo: |
            Ti muovi lungo la parete est, sotto le teste di cavallo, mentre
            gli orchi urlano per una sella che è caduta sul piede di
            qualcuno. Passi a tre braccia dalla macchina. La sua testa
            girata all'indietro resta puntata verso di te per tutto il
            tempo, ma il corpo non si muove, e arrivi alla porta di fondo
            con le spalle rigide e la sensazione di essere stato contato.

            {percezione Difficile} Mentre uscivi la testa ha fatto un
            piccolo scatto, come la lancetta di un orologio. Da qualche
            parte, adesso, sei un numero.
          effetti: { profondita.capomozzo: 1 }
        fallimento:
          titolo: La testa di cane
          testo: |
            Urti con la spalla una testa di cane, e la testa si stacca dal
            chiodo e rotola fra i piedi degli orchi con i suoi bottoni al
            posto degli occhi. Per un momento la guardano tutti, e poi
            guardano te. Esci dalla porta da cui sei entrato con due orchi
            alle calcagna, e ti salvi soltanto perché il primo inciampa
            nella sella. Ti fermi dietro i dormitori con una fitta alla
            milza che ti piega in due e la bocca che sa di ferro.
          effetti: { ferite: 0.5 }
      - testo: "Staccare il pugnale di madreperla"
        descrizione: "È in alto, e il suo chiodo regge mezza ala. Bisogna arrampicarsi sulle teste di cavallo."
        immagine: icone/curvy-knife
        quando: [oggetto.pugnale-dell-arpia == 0]
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: La madreperla
          testo: |
            Aspetti che gli orchi escano nel cortile a sellare i cinghiali,
            poi ti arrampichi usando le teste di cavallo come gradini,
            chiedendo scusa a ognuna senza volerlo. Il pugnale viene via con
            uno strappo, e metà dell'ala si stacca e ti scivola addosso in
            una pioggia di piume nere che sanno di polvere. L'impugnatura di
            madreperla è fredda e liscia, e la lama non ha un filo di
            ruggine. Te lo infili nello stivale e scendi prima che gli orchi
            tornino.
          effetti: { oggetto.pugnale-dell-arpia: 1, profondita.capomozzo: 1 }
        fallimento:
          titolo: L'ala
          testo: |
            Ti arrampichi sulle teste di cavallo, e la terza cede sotto il
            tuo peso con un rumore di paglia secca. Cadi di schiena sulla
            terra battuta e l'ala intera ti viene giù addosso con tutti i
            suoi pugnali, e uno ti apre il polpaccio. Senti gli orchi che
            tornano dal cortile. Ti trascini fuori dalla porta di fondo
            lasciandoti dietro una scia di piume, e il pugnale di madreperla
            resta per terra in mezzo agli altri.

            {resistenza Facile} La gamba regge ancora il tuo peso, e il
            resto si vedrà. Il polpaccio fa male in proporzione alla
            vergogna, cioè parecchio.
          effetti: { ferite: 0.5 }
      - testo: "Strisciare dietro il braciere"
        descrizione: "Il fumo copre bene, e scotta."
        costo: 2
        esito:
          titolo: Il fumo
          testo: |
            Ti metti carponi e passi dietro il braciere, dove il fumo è così
            fitto che gli occhi ti si riempiono di lacrime. Le braci
            schioccano, e una ti salta sul dorso della mano e ci resta il
            tempo che le serve. Arrivi alla porta di fondo con la mano che
            pulsa e la gola che raschia, trattieni la tosse finché sei
            fuori, e lì tossisci dentro la manica fino a vedere le stelle.
          effetti: { profondita.capomozzo: 1, ferite: 0.5 }

  - id: capomozzo-torre-dei-sottaceti
    immagine: fazioni/tribu-capomozzo
    titolo: La torre dei sottaceti
    sommario: "Una dispensa inchiodata che sa d'aceto, e in cima alla torre ovest due vedette che da ieri sera non danno più segni di vita."
    luogo: Capomozzo, la dispensa e la torre ovest
    area: capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 2, profondita.capomozzo == 1]
    testo: |
      Alla base della torre ovest c'è la dispensa, con la porta inchiodata
      da fuori con tre assi di traverso. Dalle fessure esce un odore d'aceto
      così forte che ti pizzica il naso e ti fa venire l'acquolina, cosa di
      cui ti vergogni subito. Dentro, in mezzo ai sacchi di sale, un barile
      di sottaceti ha un buco tondo nella parte bassa, fatto con un dito o
      con una zanna, e la salamoia ha disegnato sul pavimento una macchia a
      forma di continente.

      {percezione Media} Il buco ha i bordi spinti verso l'interno, e sul
      legno restano due solchi paralleli. Chi l'ha fatto ci ha messo la
      bocca subito dopo.

      Accanto alla dispensa una scala a pioli senza ringhiera sale fino a
      una botola, nove metri più in alto. Da lassù arriva soltanto, ogni
      tanto, il lamento basso di qualcuno che sta male.

      {medicina Facile} È il lamento di una pancia, e conosci la causa.
      Mezzo barile di sottaceti a stomaco vuoto mette in ginocchio anche un
      orco.

      La faccia ti si storce per riflesso, come quando senti qualcuno
      vomitare dietro una porta.
    opzioni:
      - testo: "Salire in cima alla torre"
        descrizione: "Nove metri di pioli unti, e in cima qualcuno che si lamenta."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Le vedette
          testo: |
            Sali piolo dopo piolo con le braccia che tremano e spingi la
            botola con la testa. In cima ci sono due orchi stesi sulla
            schiena, gonfi come otri, in mezzo a vasetti vuoti e a bucce di
            cetriolo. Accanto a loro una macchina della Salvaguardia sta in
            piedi e guarda il mare, in attesa di un ordine che non arriva.
            Da lassù vedi tutta la fortezza, la sala del trono con il fumo
            che esce dal tetto e, sulla cima dell'isola, la chiesa senza
            tetto con una lanterna accesa dentro.

            {natura Facile} Da quassù vedi la marea che sale fra gli scogli
            sotto la palizzata. Fra poco il sentiero da cui sei venuto sarà
            sott'acqua.
          effetti: { profondita.capomozzo: 1 }
        fallimento:
          titolo: Il piolo unto
          testo: |
            A metà scala un piolo unto di salamoia ti scivola dalla mano, e
            gli ultimi quattro metri li scendi molto più in fretta dei primi
            cinque. Atterri su un sacco di sale che ti salva le gambe,
            mentre la schiena prende tutto il colpo. La botola resta chiusa,
            e da lassù arriva di nuovo il lamento di prima, più lungo, quasi
            solidale. Ti rialzi tenendoti il fianco con tutte e due le mani.
          effetti: { ferite: 0.5 }
      - testo: "Seguire la scia di salamoia"
        descrizione: "Chi ha bucato il barile non si è preoccupato di cancellare le tracce."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La scia
          testo: |
            La salamoia ha lasciato impronte di piedi nudi fino alla scala a
            pioli, e sui pioli ci sono ditate unte che salgono fino alla
            botola. Dalle ditate capisci che erano in due, e che sono saliti
            con le braccia piene, perché si sono tenuti con una mano sola.
            *Da lassù quei due stanotte non sono scesi.* La torre ovest è
            senza vedette da una notte intera, e passi sotto la scala verso
            il cortile senza nemmeno abbassare la testa.
          effetti: { profondita.capomozzo: 1 }
        fallimento:
          titolo: La salamoia
          testo: |
            Ti chini sulla macchia per guardare le impronte, e il sale ti
            entra in un taglio sulla mano che non sapevi di avere, e brucia
            da farti lacrimare. Ti scappa un sibilo fra i denti, e da sopra
            la botola il lamento si interrompe di colpo. Resti piegato e
            immobile, contando fino a cento, finché il lamento riprende, e
            quando ti rialzi le ginocchia ti fanno male.

            {resilienza Facile fallita} Per tutto quel silenzio sei stato
            sicuro che lassù qualcuno stesse prendendo la mira. Il cuore non
            ha ancora ricevuto la notizia che si sbagliava.
          effetti: { tormento: 1 }
      - testo: "Passare fra i sacchi di sale"
        descrizione: "Sui sacchi di sale i passi si sentono poco. Però il sale entra dappertutto."
        costo: 2
        esito:
          titolo: Il sale
          testo: |
            Ti apri la strada fra i sacchi di sale accatastati contro il
            muro della dispensa, carponi, un palmo alla volta. Il sale ti
            entra nelle maniche e nei graffi, e ogni graffio si fa sentire
            per conto suo, anche quelli che avevi dimenticato. Sopra la tua
            testa il lamento continua con la sua cadenza regolare. Esci
            dall'altra parte vicino al cortile con le mani bianche fino ai
            polsi e il sapore del sale in bocca.
          effetti: { profondita.capomozzo: 1, ferite: 0.5 }

  # 2 · verso il lato a monte (la torre est e la chiesa restano aperte anche a 3, finché non ci passi)
  - id: capomozzo-torre-di-guardia
    immagine: bestiario/orco
    titolo: La torre di guardia est
    sommario: "Sotto la torre est dormono sei orchi. In cima due vedette giocano a carte puntando denti, e non vogliono essere disturbate."
    luogo: Capomozzo, i dormitori e la torre est
    area: capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 2, profondita.capomozzo >= 2, profondita.capomozzo <= 3]
    testo: |
      La torre est si sale dai dormitori, una stanza bassa con sei amache
      appese a telai che ondeggiano a ogni movimento di chi ci dorme sopra. Le
      coperte sono piene di pulci, e i cuscini sono mucchi di paglia. Sei
      orchi dormono con la bocca aperta, e uno stringe nel sonno un pupazzo
      di stracci con due bottoni per occhi, consumato sul collo a forza di
      carezze.

      {empatia Media} Ai piedi della sua amaca ci sono gli stivali messi in
      fila, la punta verso la porta. Qualcuno, da piccolo, gli ha insegnato
      a lasciarli così.

      {origine fuggiasco-di-ghoran} A Ghoran hai passato notti intere ad
      ascoltare dormire gli orchi dei recinti, e sai che chi russa forte si
      sveglia piano. Quello del pupazzo invece dorme in silenzio, e lo tieni
      d'occhio per primo.

      In fondo ai dormitori una scala a pioli sale alla torre, e dalla torre
      il camminamento della palizzata gira dietro il cortile fino alla sala
      del trono. Da lassù arriva il rumore delle carte sbattute su una
      cassa, con due voci che litigano su una mano e ogni tanto un pugno sul
      legno.

      {intimidire Media} Litigano per i denti che si giocano, e il più forte
      dei due sta perdendo. Basta il nome giusto, gridato forte, perché
      lascino il tavolo.

      Per arrivare alla scala devi passare fra le amache, e le gambe ti si
      fanno pesanti prima ancora di muoverti.
    opzioni:
      - testo: "Affrontare le vedette"
        descrizione: "Sono due, e guardano le carte. Sotto ce ne sono sei che dormono, ed è meglio che continuino."
        combattimento: torre-di-guardia
        vittoria:
          titolo: La posta
          testo: |
            Spingi la botola e sei in cima prima che posino le carte. Il
            primo orco cerca l'ascia sotto la cassa, e l'altro pensa a
            salvare la posta. Li metti giù tutti e due, uno contro il
            parapetto e l'altro in mezzo alle carte sparse, e dai dormitori
            sale un russare che non cambia ritmo. Sulla cassa restano una
            manciata di denti e un mazzo con i re disegnati a mano, tutti
            con le zanne. Passi sul camminamento a passi lunghi, senza voltarti.
          effetti: { profondita.capomozzo: 1 }
        sconfitta:
          titolo: In mezzo alle amache
          testo: |
            Uno dei due ti pesta le dita sul bordo della botola mentre
            l'altro ti prende per i capelli, e insieme ti rimandano giù per
            la scala. Cadi in mezzo alle amache. Sei orchi si svegliano
            insieme, e quello del pupazzo è il più arrabbiato di tutti,
            perché nella caduta gliel'hai schiacciato. Esci dai dormitori
            correndo, con le dita gonfie e un morso sul braccio, e alla
            porta loro rinunciano a inseguirti per tornare a dormire.
      - testo: "Passare fra le amache e salire senza farsi sentire"
        descrizione: "Sei orchi addormentati, e poi due svegli. Il russare copre i passi, finché copre."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il camminamento
          testo: |
            Passi fra le amache con le braccia strette al corpo, e un orco
            nel sonno ti afferra la manica e poi la lascia andare,
            borbottando un nome. Sali i pioli uno alla volta. Dalla botola
            socchiusa vedi le due vedette chine sulla cassa, una con un re
            in mano e l'altra con un dente, e scivoli fuori dall'apertura
            sul camminamento alle loro spalle. Nessuno dei due alza la testa
            dalla partita.

            {acrobazia Media} Il camminamento è largo un piede e mezzo e
            senza parapetto dal lato del cortile. Lo percorri con le
            ginocchia morbide, e non guardi giù finché non serve.
          effetti: { profondita.capomozzo: 1 }
        fallimento:
          titolo: Lo stivale
          testo: |
            A metà delle amache inciampi in uno stivale abbandonato e ti
            aggrappi al telaio più vicino. Il telaio oscilla e rovescia il
            suo orco per terra. L'orco si tira su a sedere e ti dà un pugno
            in pieno stomaco senza nemmeno aprire gli occhi, poi si gira
            dall'altra parte e riprende a dormire sul pavimento, con una
            mano sotto la guancia. Ti ci vuole un pezzo prima di riuscire a
            raddrizzarti fra le amache.
          effetti: { ferite: 0.5 }
      - testo: "Gridare da sotto che li vuole Balthog"
        descrizione: "Le vedette di Capomozzo hanno paura di una cosa sola più che di perdere a carte."
        prova: { attributo: sociale, abilita: [intimidire, ingannare], difficolta: Media }
        successo:
          titolo: Il Prescelto chiama
          testo: |
            Ti metti sotto la botola e gridi nella lingua degli orchi le due
            parole che hai sentito più spesso da quando sei sull'isola, il
            nome di Balthog e quella che deve voler dire *subito*. Lassù le
            carte cadono. Le due vedette scendono così in fretta che una
            salta gli ultimi pioli, e corrono fuori verso la sala del trono
            allacciandosi le brache. Sali tu al loro posto, e sulla cassa
            trovi la partita lasciata a metà, con un re a faccia in su che
            ti guarda storto.
          effetti: { profondita.capomozzo: 1 }
        fallimento:
          titolo: L'accento
          testo: |
            Gridi il nome di Balthog nella lingua degli orchi, e ti viene
            fuori con l'accento sbagliato. Lassù le carte si fermano, e una
            faccia con le zanne si affaccia alla botola e scoppia a ridere
            quando ti vede. L'altra vedetta ti tira dietro la cassa. La
            prendi sulla spalla e scappi fuori dai dormitori con le risate
            alle spalle, e fino alla porta ti insegue un orco in mutande che
            vuole sapere che cosa succede.

            {galateo Media} Hai sbagliato l'accento sulla parola più
            importante dell'isola. In qualunque salotto di Qir-Azel ti
            avrebbero riso dietro allo stesso modo, soltanto più piano.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che la partita finisca"
        descrizione: "Prima o poi uno dei due perde tutti i denti che ha da giocare."
        costo: 2
        esito:
          titolo: L'ultimo dente
          testo: |
            Ti rannicchi sotto la scala, nell'angolo dietro l'ultima amaca,
            e aspetti ascoltando la partita. Va avanti per ore. Due volte un
            orco dei dormitori si alza a bere da un secchio a un braccio
            dalla tua faccia, e la seconda volta ti guarda dritto negli
            occhi senza vederti. Quando lassù uno dei due scoppia a piangere
            per l'ultimo dente perso, sali piano la scala. Li trovi
            abbracciati sulla cassa a consolarsi, e passi sul camminamento
            alle loro spalle.
          effetti: { profondita.capomozzo: 1, tormento: 1 }

  - id: capomozzo-cortile-dei-cinghiali
    immagine: bestiario/cinghiale-crudele-mutato
    titolo: Il cortile dei cinghiali
    sommario: "Un cortile di terra dura dove quattro cinghiali da guerra corrono liberi e prendono a testate il capanno in fondo, da cui arrivano nitriti."
    luogo: Capomozzo, il cortile delle esercitazioni
    area: capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 2, profondita.capomozzo == 2]
    testo: |
      Il cortile delle esercitazioni è un quadrato di terra pressata,
      chiazzata di sangue vecchio e solcata dagli zoccoli, dove qualche
      ciuffo d'erba resiste ancora vicino ai muri. Quattro cinghiali da
      guerra corrono liberi, con le zanne cerchiate di ferro, e si inseguono
      fra loro mordendosi le orecchie. Ogni tanto uno si stacca dal gioco e
      va a dare una testata contro un capanno in fondo al cortile. Da dentro
      risponde un nitrito furioso, e i cinghiali grugniscono contenti.

      {addestrare-animali Media} Si muovono a coppie e tornano sempre verso
      lo stesso angolo, dove gli orchi li chiamano per la carne. Sono bestie
      che obbediscono a un richiamo, e i richiami degli orchi sono pochi.

      {origine figlio-del-circolo} L'ultimo cinghiale da guerra che hai visto
      da vicino entrava dalla porta nord di Qir-Azel con la schiuma alla bocca
      e un orco che lo guidava a colpi di tallone. Questi si mordono le
      orecchie per gioco, e ti accorgi di esserne contento.

      {cavalcare Difficile} Il nitrito che viene dal capanno è troppo basso
      per un cavallo comune. Quello che c'è là dentro ha fame da giorni, e
      le testate dei cinghiali non lo spaventano affatto.

      Alla staccionata qualcuno ha appeso un cartello di legno con il
      disegno di un cinghiale e una croce sopra, e non è chiaro a chi sia
      rivolto. Per arrivare dall'altra parte devi attraversare il cortile, e
      senti le gambe che si preparano a correre per conto loro.
    opzioni:
      - testo: "Affrontare i cinghiali"
        descrizione: "Sono quattro, ma arrivano due alla volta, perché gli altri due sono occupati col capanno."
        combattimento: cortile-dei-cinghiali
        vittoria:
          titolo: La staccionata
          testo: |
            Il primo cinghiale ti carica a testa bassa, e tu lo lasci
            passare all'ultimo momento, e lui va a piantare le zanne nella
            staccionata, dove resta a dimenarsi. Il secondo è più furbo e ci
            mette di più. Quando è finita hai la coscia graffiata e le mani
            piene di schegge, e gli altri due si sono rifugiati in un angolo a
            guardarti con gli occhietti rossi. Attraversi il cortile senza
            mai voltargli le spalle.
          effetti: { profondita.capomozzo: 1 }
          imposta: { forte.cortile: 1 }
        sconfitta:
          titolo: Il volo
          testo: |
            Un cinghiale ti prende alle gambe da dietro mentre guardi
            l'altro, e ti ritrovi a volare sopra la staccionata. Atterri
            sulla schiena dall'altra parte, nel fango del recinto vuoto, con
            un buco nei calzoni e uno nella coscia. I cinghiali ti
            grugniscono dietro attraverso le assi, poi tornano a giocare fra
            loro. Ci metti un pezzo a rialzarti, e zoppichi fino al riparo
            dei dormitori lasciando nel fango l'impronta di tutta la
            schiena.
      - testo: "Correre lungo il muro mentre giocano"
        descrizione: "Quando due cinghiali si mordono le orecchie, non guardano altro."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Lungo il muro
          testo: |
            Aspetti che due cinghiali si azzuffino nel mezzo del cortile e
            parti, con la schiena contro il muro e i piedi sui ciuffi
            d'erba, dove la terra non rimbomba. Uno dei quattro alza il muso
            dal capanno e ti segue con gli occhi per tutto il tragitto,
            senza muoversi. Arrivi dall'altra parte, e soltanto lì ti
            accorgi di avere le unghie piantate nei palmi, e le dita ci
            mettono un po' ad aprirsi.
          effetti: { profondita.capomozzo: 1 }
          imposta: { forte.cortile: 1 }
        fallimento:
          titolo: Le zanne
          testo: |
            Parti troppo presto. Un cinghiale ti vede e ti carica di sbieco,
            e tu salti sulla staccionata in tempo per salvare le gambe, ma
            il polpaccio no. Le zanne ti aprono la carne attraverso lo
            stivale. Resti appollaiato sulla staccionata finché i cinghiali
            si stancano di aspettarti sotto, e scendi dall'altra parte con
            lo stivale pieno di sangue che fa un rumore molle a ogni passo.

            {atletica Facile fallita} Un salto più alto e avresti salvato
            anche il polpaccio. Le gambe ti ricordano che non sono più
            quelle di una volta, e che non lo sono mai state.
          effetti: { ferite: 0.5 }
      - testo: "Fischiare come gli orchi"
        descrizione: "Sono bestie addestrate, e chi le addestra usa sempre gli stessi due o tre suoni."
        prova: { attributo: sociale, abilita: [addestrare-animali, intimidire], difficolta: Media }
        successo:
          titolo: Il fischio
          testo: |
            Ascolti i cinghiali finché senti il richiamo che usano gli
            orchi, un fischio corto seguito da uno schiocco di lingua. Lo
            rifai uguale. I quattro cinghiali si fermano e si mettono in
            fila davanti a te, aspettando la carne che non arriva. Passi in
            mezzo a loro grattando il primo dietro l'orecchio, e lui ti
            spinge la mano con il muso per averne ancora, e te la lascia
            bagnata.
          effetti: { profondita.capomozzo: 1 }
          imposta: { forte.cortile: 1 }
          pe: { addestrare-animali: 5 }
        fallimento:
          titolo: Lo schiocco sbagliato
          testo: |
            Fai un fischio che ti sembra quello degli orchi, e i cinghiali
            alzano la testa tutti insieme. Deve voler dire un'altra cosa,
            perché ti caricano. Ti butti dietro un abbeveratoio di pietra, e
            la prima zanna lo prende di striscio e ti graffia l'avambraccio.
            Resti rannicchiato lì dietro finché i cinghiali perdono
            interesse e tornano a prendersela con il capanno, che se lo
            aspettava.
          effetti: { ferite: 0.5 }
      - testo: "Passare dietro il capanno, nel fango"
        descrizione: "Fra il capanno e la palizzata c'è un passaggio stretto dove i cinghiali non entrano."
        costo: 2
        esito:
          titolo: Il fango
          testo: |
            Ti infili nel passaggio fra il capanno e la palizzata, dove il
            fango ti arriva alle caviglie e puzza di letame. Dall'altra
            parte delle assi qualcosa di grosso ti sente e scalcia contro la
            parete, a un palmo dalla tua testa, e ogni calcio ti fa tremare
            i denti. Esci in fondo al passaggio coperto di fango fino alle
            ginocchia, con un orecchio che ancora fischia e la certezza che
            là dentro qualcuno si ricorderà il tuo odore.
          effetti: { profondita.capomozzo: 1, tormento: 1 }
          imposta: { forte.cortile: 1 }

  - id: capomozzo-cappella
    immagine: bestiario/orco-sacerdote-guerriero
    titolo: La chiesa senza tetto
    sommario: "In cima all'isola, una chiesa di pietra più vecchia degli orchi. Dentro, un vecchio orco insegna ai giovani una litania che nessuno di loro capisce."
    luogo: Capomozzo, la chiesa in cima all'isola
    area: capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 2, profondita.capomozzo >= 2, profondita.capomozzo <= 3]
    testo: |
      Sulla cima dell'isola, dietro la sala del trono, c'è una chiesa di
      pietra grigia molto più vecchia della palizzata. Il tetto è crollato
      da chissà quanto, e gli orchi l'hanno sostituito con una vela di nave
      tesa fra i muri, che col vento si gonfia e si sgonfia. Sull'altare c'è
      un bassorilievo preso a colpi di mazza, e della figura sono rimasti
      soltanto due piedi d'uccello e il bordo di un'ala spezzata.

      {accademiche Media} Piedi d'uccello e ali su un altare di pietra
      grigia. Chi l'ha costruita pregava qualcuno con le ali, molto prima
      che arrivassero le mazze.

      {origine accolito-del-velo} Davanti a un altare spezzato abbassi la
      voce anche qui, per abitudine. Al Velo ti hanno insegnato i nomi di
      molte cose sacre, e una con i piedi d'uccello non era fra quelle.

      Davanti all'altare c'è un orco vecchio con la faccia dipinta di bianco
      e una rete da pesca ancora umida sulle spalle. Recita una litania, e
      sei giovani orchi in ginocchio la ripetono dopo di lui una riga alla
      volta, sbagliando sempre le stesse parole. Accanto alla porta c'è una
      statua senza testa, e sulle sue braccia qualcuno ha steso ad asciugare
      un paio di brache.

      {espressivita Media} I giovani hanno imparato la musica prima delle
      parole. La cadenza la tengono perfetta, e intanto storpiano tutto il
      resto.

      Le parole della litania non sono orchesche, e ti si rizzano i peli
      delle braccia prima ancora di capire perché.
    opzioni:
      - testo: "Ascoltare le parole della litania"
        descrizione: "Gli orchi le ripetono a memoria. Chi le ha scritte, invece, sapeva bene quello che diceva."
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: La Madre che cova
          testo: |
            Ti accucci dietro una colonna e ascolti. Gli orchi storpiano le
            parole, ma la litania è incisa anche sul muro, sotto la vela, in
            una lingua antica che conosci appena, abbastanza per seguirne il
            senso. È una preghiera alla Regina delle Ali Spezzate, la Madre
            che cova, perché scelga un figlio fra quelli che la servono e
            gli dia la sua voce. *Questi orchi pregano lei, e non lo sanno.*
            Ti allontani lungo il muro con la bocca secca e la lingua che ti
            si incolla al palato.
          effetti: { profondita.capomozzo: 1, informazioni.segreto: 0.5 }
          imposta: { forte.chiesa: 1 }
        fallimento:
          titolo: La cadenza
          testo: |
            Ascolti la litania per capirne le parole, e dopo un po' ti
            accorgi che la stai ripetendo anche tu, sottovoce, con la stessa
            cadenza degli orchi. Ti tappi la bocca con la mano. Il vecchio
            dipinto di bianco si interrompe e gira la testa verso la tua
            colonna, e tu resti immobile finché riprende. Esci dalla chiesa
            all'indietro, e la cadenza ti resta in testa fino a sera.

            {magia Media fallita} Senti qualcosa muoversi nel Mana intorno
            all'altare, una corrente sottile che segue le parole. Prima di
            capire dove va, ti accorgi che stai seguendo anche tu.
          effetti: { tormento: 1 }
      - testo: "Inginocchiarti in fondo alla fila"
        descrizione: "Con il cappuccio in testa, in fondo alla chiesa, sei soltanto un'altra schiena curva."
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Media }
        successo:
          titolo: L'ultima fila
          testo: |
            Ti inginocchi in fondo alla fila con il cappuccio sulla testa e
            muovi le labbra quando le muovono gli altri. Il giovane orco
            accanto a te sbaglia una parola e tu sbagli la stessa, e lui ti
            fa un mezzo sorriso complice con le zanne. Quando la litania
            finisce gli orchi si alzano e se ne vanno senza guardarti, e
            resti solo davanti all'altare con le ginocchia indolenzite e un
            po' di nostalgia per la fila.
          effetti: { profondita.capomozzo: 1 }
          imposta: { forte.chiesa: 1 }
        fallimento:
          titolo: L'odore
          testo: |
            Ti inginocchi in fondo alla fila, e il giovane orco accanto a te
            comincia ad annusare l'aria, e poi annusa te, con il naso a un
            dito dalla tua spalla. Si alza di scatto con un grido, e tu sei
            già fuori dalla porta quando una pietra lanciata dal vecchio ti
            prende fra le scapole e ti toglie il fiato. Corri piegato in
            avanti giù per la roccia fino ai dormitori, e ti fermi soltanto
            quando senti di nuovo la litania.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare la fine della litania dietro i muri"
        descrizione: "La litania è lunga, e lassù il vento dal mare è freddo."
        costo: 2
        esito:
          titolo: Il vento
          testo: |
            Ti rannicchi fuori dalla chiesa, contro il muro esposto al mare,
            e aspetti che la litania finisca. Va avanti per un'ora intera.
            Il vento ti entra sotto i vestiti, e le parole passano
            attraverso le pietre una alla volta finché le conosci tutte
            senza averlo voluto. Quando gli orchi escono hai le mani viola e
            in testa una litania che non ti appartiene, e che ti torna in
            bocca ogni volta che smetti di pensare ad altro.
          effetti: { profondita.capomozzo: 1, tormento: 1 }
          imposta: { forte.chiesa: 1 }

  # 3 · dietro l'altare, solo se in questa visita sei passato dalla chiesa
  - id: capomozzo-scala
    immagine: ambientazione/capomozzo
    titolo: La scala nella roccia
    sommario: "Dietro l'altare della chiesa una scala scavata nella roccia scende dentro l'isola. Qualcuno ha appeso le lanterne per chi al buio non ci vede."
    luogo: Capomozzo, la scala sotto la chiesa
    area: capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 2, profondita.capomozzo == 3, forte.chiesa == 1]
    testo: |
      Dietro l'altare della chiesa, coperta da una pelle di cinghiale
      inchiodata allo stipite, c'è una porta bassa. Oltre la porta una scala
      scavata nella roccia scende a spirale dentro l'isola, con i gradini
      consumati al centro come in tutte le chiese vecchie. Ogni dieci
      gradini c'è una lanterna appesa a un gancio, schermata da un lato, e
      sono accese soltanto quelle dei primi due giri.

      Gli orchi vedono al buio, e queste lanterne le hanno appese per gente
      che al buio non ci vede. Su una il vetro rotto è stato riparato con la
      cera e con una pagina di libro.

      {accademiche Difficile} La pagina è scritta fitta, in una mano
      elegante, e la carta è di quella buona. Chi l'ha usata per tappare un
      vetro aveva libri da sacrificare.

      Dal fondo sale un'aria fredda che sa di mare, e con l'aria arriva a
      tratti una risata di donna.

      {furtivita Media} Le lanterne sono schermate dalla parte del muro,
      così chi scende si vede da lontano e chi aspetta di sotto resta al
      buio.

      Ti ritrovi con una mano sul muro e l'altra sul coltello, senza averlo
      deciso.
    opzioni:
      - testo: "Scendere i primi giri ad ascoltare"
        descrizione: "Fin dove arrivano le lanterne accese, e non un gradino di più."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il rumore di sotto
          testo: |
            Scendi due giri di scala con la schiena contro il muro, contando
            i gradini. Al terzo giro le lanterne sono spente, e dal buio di
            sotto arrivano una risata di donna e un tintinnio di stoviglie,
            come in una cucina all'ora di cena. Più sotto ancora c'è un
            rumore lento e regolare, che ti arriva nei piedi prima che nelle
            orecchie. Torni su prima che il buio ti chiuda la strada, con la
            forma della scala fissata in testa.
          effetti: { profondita.capomozzo: 1 }
        fallimento:
          titolo: La lanterna
          testo: |
            Al secondo giro sfiori una lanterna con la spalla, e la lanterna
            gira sul gancio e sbatte contro la roccia con un rumore di vetro
            che scende per tutta la scala. Da sotto la risata si ferma.
            Risali di corsa sui gradini consumati, che ti scivolano sotto
            gli stivali, e batti il ginocchio contro uno spigolo così forte
            che ti si annebbia la vista. Ti fermi soltanto dietro l'altare,
            a massaggiarti il ginocchio e ad ascoltare se qualcuno sale.
          effetti: { ferite: 0.5 }
      - testo: "Studiare le lanterne"
        descrizione: "Qualcuno sale ad accenderle e a spegnerle. Sapere come lo fa può tornare utile."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Gli stoppini
          testo: |
            Apri lo sportello di una lanterna spenta e annusi lo stoppino,
            che è stato spento da poche ore e tagliato dritto con le
            forbici. Gli orchi non tagliano gli stoppini. A ogni gancio è
            annodato un nastrino bianco, sempre alla stessa altezza, come un
            segno per chi sale e scende senza conoscere la strada. Li segui
            con gli occhi giù per la spirale e ti fai un'idea di quanto è
            profonda, almeno tre piani sotto la chiesa.

            {tecnologia Facile} Lo stoppino è tagliato con le forbici e
            l'olio è di quello buono, che non fa fumo. Qualcuno quaggiù
            tiene alle sue lanterne come alla propria casa.
          effetti: { profondita.capomozzo: 1 }
        fallimento:
          titolo: La cera
          testo: |
            Apri lo sportello della lanterna riparata, e la cera calda ti
            cola sulle dita perché è accesa da poco. Ti scotti e la lasci
            andare di colpo. La lanterna dondola sul gancio e illumina a
            scatti la scala sotto di te, giro dopo giro, per chiunque stia
            guardando in su. Richiudi lo sportello e ti appiattisci contro
            la roccia, con il cuore in gola, finché la luce smette di
            oscillare e le dita smettono di pulsare.
          effetti: { ferite: 0.5 }
      - testo: "Nasconderti dietro la pelle di cinghiale e guardare chi passa"
        descrizione: "La porta è stretta, e chi passa ti sfiora."
        costo: 2
        esito:
          titolo: La maschera bianca
          testo: |
            Ti nascondi nell'angolo fra l'altare e la porta, dietro la pelle
            di cinghiale, e conti chi passa. In un'ora sale un orco con un
            secchio vuoto e scende una donna umana con una maschera bianca
            senza tratti sulla faccia, che si ferma a un palmo da te per
            sistemarsi una scarpa. Resti immobile con la pelle che ti puzza
            sotto il naso, finché i suoi passi spariscono giù per la
            spirale.

            {percezione Media} La scarpa è di città, con la fibbia lucida, e
            non ha un granello di sabbia. La donna sale e scende questa
            scala come si va in un altro ufficio dello stesso palazzo.
          effetti: { profondita.capomozzo: 1, tormento: 1 }

  # ------------------------------------------------------------ Ombrafosca (C17–C18, non ripetibile)
  - id: ombrafosca-in-gabbia
    immagine: ambientazione/capomozzo
    titolo: Il cavallo in gabbia
    sommario: "Nel capanno inchiodato in fondo al cortile c'è un cavallo che ha già ammazzato due orchi. Accanto, nel capanno degli attrezzi, c'è una gabbia piena di conigli."
    luogo: Capomozzo, i capanni in fondo al cortile
    area: capomozzo
    requisiti: [pista.capomozzo == 2, ombrafosca == 0, profondita.capomozzo >= 3, forte.cortile == 1]
    testo: |
      In fondo al cortile ci sono due capanni di legno grezzo. Il primo è
      aperto ed è il capanno degli attrezzi, con le mensole cariche di reti
      e di guinzagli per i cinghiali e, nell'angolo, una gabbia a forma di
      elle piena di conigli che si ammucchiano tutti dalla parte più
      lontana. Il secondo ha la porta inchiodata, con altre assi inchiodate
      di traverso, e il legno della porta è crepato dall'interno in tre
      punti.

      Davanti alla porta inchiodata ci sono due orchi morti, con la testa
      schiacciata, e anche senza guardarli da vicino capisci che è stato
      qualcosa con gli zoccoli. Le mosche si alzano quando ti avvicini e si
      posano di nuovo subito. A uno dei due qualcuno ha già sfilato gli
      stivali.

      Attraverso le fessure vedi un cavallo nero come la pece, con il manto
      che manda riflessi verdi dove lo prende la luce. Ha gli occhi grigio
      argento, e dalle narici gli esce un fumo leggero, come d'inverno,
      anche se non fa freddo. Le corde che lo legavano alle pareti sono
      morse e strappate in più punti. È magro, con le costole che si
      contano, e quando ti sente sbatte uno zoccolo così forte che la porta
      trema sui cardini.

      {magia Media} Il fumo che gli esce dalle narici non viene dai polmoni. Intorno a
      lui il Mana è caldo e mosso, come l'aria sopra una forgia.

      {cavalcare Difficile} Nessuno l'ha mai montato, e chi ci ha provato
      sta davanti alla porta. Però tiene le orecchie girate verso di te
      invece che schiacciate, e questo vuol dire che ascolta.

      *Ha fame, e i conigli sono per lui.* Ti accorgi di aver fatto un passo
      indietro senza volerlo.
    opzioni:
      - testo: "Parlargli piano e avvicinarti"
        descrizione: "Schiodare la porta e restare sulla soglia con le mani aperte, finché decide lui."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Difficile }
        successo:
          titolo: La mano sul muso
          testo: |
            Schiodi le assi una alla volta e apri la porta di una spanna.
            Poi resti sulla soglia a parlargli a voce bassa, senza dire
            niente di preciso, per un tempo che ti fa formicolare le gambe.
            Il cavallo sbuffa fumo e scalcia due volte contro la parete.
            Alla fine allunga il collo e ti annusa la mano, e lascia che tu
            gli appoggi il palmo sul muso. Sotto il palmo il muso è caldo
            come una stufa, e ti accorgi di aver smesso di parlare da un
            pezzo.
          pe: { addestrare-animali: 5 }
          segue: ombrafosca-fuori-dalla-gabbia
        fallimento:
          titolo: Lo zoccolo
          testo: |
            Schiodi le assi e apri la porta di una spanna, e il cavallo ci
            mette contro il petto prima che tu abbia finito di parlare. La
            porta ti prende in pieno e ti butta per terra, e uno zoccolo ti
            passa a un dito dalla testa e ti pesta la mano. Riesci a
            richiudere e a puntellare la porta con la schiena, e resti
            seduto lì contro, con la mano gonfia, mentre lui scalcia
            dall'altra parte.

            {empatia Media} Ce l'ha con le porte e con chiunque stia
            dall'altra parte delle assi. Oggi dall'altra parte c'eri tu, e
            la porta ti ha preso in pieno.
          effetti: { ferite: 1 }
      - testo: "Portargli i conigli e aspettare che mangi"
        descrizione: "Un animale affamato ascolta chi gli porta da mangiare. Questo, a quanto pare, mangia carne."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: I conigli
          testo: |
            Prendi un coniglio per le orecchie e lo butti dentro dalla
            fessura più larga. Il cavallo lo prende al volo e lo mastica con
            un rumore che ti fa voltare la faccia. Al terzo coniglio smette
            di scalciare, al quinto si lascia toccare il collo attraverso la
            fessura, e intanto gli guardi i garretti, dove le ferite si sono
            già chiuse da sole. Quando schiodi la porta lui resta fermo ad
            aspettarti, con il muso sporco e l'aria di chi ha cenato bene.
          pe: { natura: 5 }
          segue: ombrafosca-fuori-dalla-gabbia
        fallimento:
          titolo: La gabbia aperta
          testo: |
            Apri la gabbia per prendere un coniglio, e ne escono venti tutti
            insieme, in mezzo al cortile, fra i piedi dei cinghiali. I
            cinghiali impazziscono. Il cavallo sente l'odore del sangue e
            sfonda con lo zoccolo un'asse della porta, a un palmo dalla tua
            faccia, e una scheggia ti si pianta nella guancia. Ti ritiri nel
            capanno degli attrezzi ad aspettare che il cortile si calmi,
            togliendoti la scheggia con le unghie.
          effetti: { ferite: 0.5 }
      - testo: "Parlargli nella lingua del Circolo"
        descrizione: "Le parole che il Circolo insegna ai bambini per le bestie arrivano anche a quelle che hanno fame."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La lingua delle bestie
          testo: |
            Appoggi la fronte alle assi e gli parli nella lingua del
            Circolo, con le parole che si usano per le bestie spaventate.
            Dall'altra parte il respiro del cavallo rallenta piano piano,
            finché il fumo dalle narici si fa sottile e il suo occhio
            d'argento si accosta alla fessura a guardarti. Quando schiodi la
            porta lui abbassa la testa sulla tua spalla e ce la lascia
            appoggiata, calda, come un'abitudine che avevate già.
          segue: ombrafosca-fuori-dalla-gabbia
        fallimento:
          titolo: La parola storta
          testo: |
            Gli parli nella lingua del Circolo, ma la parola per *calma* ti
            esce storta e diventa quella per *fuga*. Il cavallo scalcia le
            pareti fino a far saltare due chiodi della porta, e a te torna
            indietro tutta la sua paura in una volta, così forte che ti si
            piegano le ginocchia. Resti seduto contro il capanno degli
            attrezzi, con i conigli che ti guardano dalla gabbia e il cuore
            che batte al ritmo dei suoi zoccoli.
          effetti: { tormento: 1 }
      - testo: "Schiodare la porta e farti da parte"
        descrizione: "Lui vuole uscire. Basta trovarsi da un'altra parte quando succede."
        esito:
          titolo: Il cavallo nel cortile
          testo: |
            Togli l'ultima asse e ti butti di lato. La porta si spalanca e
            il cavallo esce al galoppo in mezzo ai cinghiali, che si
            sparpagliano strillando, e uno lo manda a gambe all'aria contro
            la staccionata. Poi prende la rincorsa verso la palizzata e la
            salta dove è più bassa, e dalla torre la vedetta lo guarda
            passare con la bocca aperta. Nel trambusto ti allontani dal
            cortile senza che nessuno ti veda, e ti resta nelle orecchie il
            rumore dei suoi zoccoli sugli scogli.

            {atletica Media} Ha saltato da fermo più in alto di quanto
            saltereste tu e un altro messi uno sulle spalle dell'altro. Non
            l'avresti tenuto in nessun modo.
          imposta: { ombrafosca: 1 }
          effetti: { profondita.capomozzo: 1 }
      - testo: "Guardargli le ferite come al Circolo"
        descrizione: "Al Circolo, prima di avvicinarsi a una bestia legata, si guarda dove l'hanno ferita. Si capisce da che cosa si aspetta il colpo."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: I garretti
          testo: |
            Ti metti in ginocchio davanti alla fessura più bassa e gli
            guardi le zampe invece degli occhi. Sui garretti ha i segni già
            chiusi di una catena, e sul collo quelli delle corde tirate
            dall'alto. Al Circolo dicevano che una bestia legata così ha
            paura delle mani che scendono. Allora apri la porta di una
            spanna, porgi il dorso della mano all'altezza del suo ginocchio
            e aspetti. Il ginocchio a terra ti fa male, e lo lasci fare.

            Il cavallo sbuffa fumo e batte uno zoccolo, poi abbassa il muso
            fino alla tua mano e la annusa a lungo. Sotto le dita il muso è
            caldo come una stufa. Quando schiodi le ultime assi resta fermo
            ad aspettarti.
          pe: { addestrare-animali: 5 }
          segue: ombrafosca-fuori-dalla-gabbia
      - testo: "Sederti contro la porta, come nei recinti"
        descrizione: "Nei recinti di Ghoran hai imparato che cosa vuol dire avere qualcuno che ti guarda attraverso le assi. Lui forse lo sa anche meglio."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza], difficolta: Media }
        successo:
          titolo: La schiena contro le assi
          testo: |
            Schiodi le assi di traverso e ti siedi per terra con la schiena
            contro la porta, gli occhi sul cortile e le mani in grembo, dove
            lui non le vede. A Ghoran, dall'altra parte delle assi, la gente
            che non ti guardava era la sola di cui ti fidavi. Il cavallo
            scalcia, e la porta ti batte contro la spina dorsale una volta,
            due, poi sempre più piano. Alla fine senti l'aria calda delle sue narici
            passare dalla fessura sopra la tua testa e scenderti sul collo.

            {resistenza Media} Le vertebre ti hanno contato tutti i calci, e
            domani te li ripeteranno uno per uno. Adesso però la porta è
            ferma.

            Quando ti alzi e apri, lui resta dentro ad aspettare che esca
            prima tu.
          pe: { resistenza: 5 }
          segue: ombrafosca-fuori-dalla-gabbia
        fallimento:
          titolo: Il calcio alla schiena
          testo: |
            Schiodi le assi e ti siedi contro la porta con gli occhi sul
            cortile. Il cavallo aspetta che tu ti sia sistemato, poi tira un
            calcio alto, e un'asse si spacca sopra di te e ti cade
            sulla nuca insieme a mezzo zoccolo. Rotoli via a quattro zampe,
            con la testa che rimbomba, e da dentro lui sbuffa fumo dalla
            fessura nuova, soddisfatto del lavoro.
          effetti: { ferite: 1 }

  - id: ombrafosca-fuori-dalla-gabbia
    immagine: ambientazione/capomozzo
    titolo: Fuori dalla gabbia
    tipo: seguito
    luogo: Capomozzo, il cortile delle esercitazioni
    area: capomozzo
    testo: |
      Il cavallo esce adagio dal capanno e si ferma in mezzo al cortile con
      la testa alta a guardare il cielo. Da vicino è più grande di quanto
      sembrava dalle fessure. Ha una cicatrice fresca sulla spalla, larga
      come una mano, e dove gli orchi l'hanno legato il pelo è venuto via e
      la pelle sotto è grigia come cenere. I cinghiali si sono ammucchiati
      nell'angolo più lontano e non fiatano, e dalla torre est una vedetta
      si sporge a guardare con le carte ancora in mano.

      {medicina Media} La cicatrice sulla spalla ha i bordi già asciutti,
      dopo pochi giorni. Su un cavallo normale ci vorrebbe un mese.

      Gira il collo verso di te e soffia, e il fumo ti arriva in faccia
      caldo, con un odore di brace. Non porta sella né briglie, e ha tutta
      l'aria di non averle mai portate. Ti guarda come se adesso toccasse a
      te dire la prossima cosa.

      {conoscenze-della-strada Facile} Un cavallo così, a Qir-Azel, vale una
      casa. Chi lo comprasse, però, avrebbe bisogno di una casa nuova entro
      la settimana.

      Dietro la palizzata il mare batte sugli scogli, e oltre il mare ci
      sono la costa e la strada per Qir-Azel.
    opzioni:
      - testo: "Tenerlo con te"
        descrizione: "Un cavallo così vale più di un forziere, se si lascia portare."
        costo: 0
        esito:
          titolo: Ombrafosca
          testo: |
            Gli passi una corda larga intorno al collo senza stringerla, e
            lui ti lascia fare, come si lascia fare a un bambino. Lo porti
            fuori dalla palizzata e lo leghi fra gli scogli dove il ponte di
            corda tocca l'isola, con un mucchio di alghe davanti che annusa
            con disprezzo. Gli dai il nome che ti viene in mente guardando
            il fumo che gli esce dalle narici, Ombrafosca. Lui gira un
            orecchio verso di te quando lo dici, e lo tiene girato.
          imposta: { ombrafosca: 2 }
          effetti: { oggetto.ombrafosca: 1 }
      - testo: "Lasciarlo andare"
        descrizione: "Ha ucciso due orchi per uscire da lì. Forse si è guadagnato anche il resto."
        costo: 0
        esito:
          titolo: Il salto
          testo: |
            Ti fai da parte e gli indichi la palizzata con il braccio, anche
            se ti senti un po' ridicolo a farlo. Il cavallo ti guarda ancora
            un momento, poi prende la rincorsa attraverso il cortile e salta
            la palizzata dove è più bassa, con un rumore di zoccoli sul
            legno che fa affacciare tutte e due le vedette. Lo senti
            scendere fra gli scogli verso la riva. Quando le vedette
            smettono di guardare il punto dove è sparito, tu sei già lontano
            dal cortile, con un nodo in gola che non ti sai spiegare.
          imposta: { ombrafosca: 1 }
          effetti: { profondita.capomozzo: 1 }

  # ------------------------------------------------------------ la tesoreria (C22–C24, non ripetibile)
  - id: la-tesoreria-di-balthog
    immagine: fazioni/tribu-capomozzo
    titolo: La camera del capotribù
    sommario: "La camera da letto di Balthog, con un letto a baldacchino venuto da chissà dove, e accanto una latrina da cui arriva un filo d'aria che non dovrebbe esserci."
    luogo: Capomozzo, la camera del capotribù
    area: capomozzo
    requisiti: [pista.capomozzo == 2, tesoro.capomozzo == 0, profondita.capomozzo >= 4]
    testo: |
      La camera di Balthog sta dietro la sala riunioni, dove un tavolo
      rotondo e quattro sedie prendono polvere. Il pavimento è di terra
      battuta, coperto di tappeti di pelle di cinghiale e di cavallo. Sulla
      parete nord sono inchiodate, uno accanto all'altro, decine di ferri di
      cavallo, in file dritte come i libri di una biblioteca. Contro il muro
      est c'è una scrivania con le gambe intagliate, che un tempo doveva
      valere parecchio, e accanto una sedia imbottita di stracci, l'unica
      cosa della stanza che abbia l'aria di essere usata.

      {galateo Media} La scrivania viene dal salotto di qualche Casato, e ha
      un piede rifatto in legno grezzo. Balthog si è portato a casa un pezzo
      di buona società e lo usa per appoggiarci gli stivali.

      {origine rampollo-dei-quartieri-alti} A una scrivania con le gambe
      intagliate, in casa, ti facevano scrivere i biglietti di
      ringraziamento, e guai ad appoggiarci i gomiti. Vedere i segni degli
      stivali di un orco dove non potevano stare i tuoi gomiti ti dà una
      soddisfazione che non confesseresti a nessuno.

      Nell'angolo c'è un letto a baldacchino con le tende di seta e la
      testata scolpita a ninfe e caprai che ballano in un bosco. Le lenzuola
      sono nere di terra. Qualcuno ha raschiato via col coltello la faccia
      di tutte le ninfe, mentre i caprai hanno ancora la loro.

      Una porticina accanto al letto dà sulla latrina, una stanzetta con un
      buco nel pavimento e il bordo incrostato. Dal buco sale una puzza che
      ti chiude la gola, e dalla parete di fondo arriva una corrente d'aria
      fredda che in una latrina non ci dovrebbe essere.

      {percezione Facile} Sul pavimento della latrina la terra è consumata
      in una riga dritta, dalla porta fino alla parete di fondo. Lì qualcuno
      ci passa spesso, e non per il buco.

      *Qui dentro Balthog tiene qualcosa che non vuole far vedere.* Ti copri
      la bocca e il naso con la manica, e la puzza passa lo stesso.
    opzioni:
      - testo: "Cercare la chiave e la porta"
        descrizione: "Una porta segreta vuol dire un forziere, e un forziere vuol dire una chiave da qualche parte qui intorno."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La chiave sotto la sedia
          testo: |
            Passi le dita sotto la seduta della sedia imbottita e trovi una
            chiave di ferro grossa come un dito, legata con lo spago. Nella
            latrina segui la corrente d'aria fino a un'asse che suona vuota,
            e dietro l'asse c'è uno stanzino con un forziere rinforzato
            chiuso da un lucchetto. Sul coperchio c'è una fessura sottile,
            troppo dritta per essere una crepa. Giri la chiave piano, e il
            coperchio si alza senza che dalla fessura esca niente. Ti
            accorgi di aver tenuto il braccio lontano dal corpo per tutto il
            tempo.

            Dentro c'è il bottino di anni di razzie, buttato alla rinfusa.
            Ci sono monete di tutte le zecche a manciate, e un giaco di
            maglia fine piegato con cura sotto una tunica di seta blu orlata
            d'oro. In un sacchetto di cuoio trovi una collana d'oro e un
            simbolo sacro di platino del Grande Albero Rosso, pesante come
            un sasso. Sul fondo restano una scimitarra arrugginita e un paio
            di manette, e quelle le lasci dove sono.

            {origine accolito-del-velo} Il simbolo del Grande Albero lo pesi
            sul palmo come pesavi quelli dell'altare quando li lucidavi, e
            prima di metterlo via lo pulisci con la manica.

            {conoscenze-della-strada Media} Il giaco è l'unica cosa piegata
            con cura. Balthog sa benissimo che cosa vale qui dentro, e le
            monete per lui sono la parte meno interessante.
          effetti: { monete: 200, oggetto.giaco-di-balthog: 1, bottino.tunica-di-seta: 1, bottino.collana-d-oro: 1, bottino.simbolo-del-grande-albero: 1, tesoro.capomozzo: 1, racconto: 1 }
          pe: { percezione: 5 }
        fallimento:
          titolo: La lama nel coperchio
          testo: |
            Trovi la porta segreta seguendo la corrente d'aria, ma della
            chiave nessuna traccia, e allora provi il lucchetto con la punta
            del coltello. Al secondo giro qualcosa scatta nel coperchio. Una
            lama arrugginita esce da una fessura e ti apre l'avambraccio dal
            polso al gomito. Il lucchetto tiene. Nella sala riunioni
            qualcuno trascina una sedia, e tu esci dalla latrina con il
            braccio stretto contro il petto e il sangue che gocciola sui
            tappeti. Di sangue, quei tappeti, ne hanno visto parecchio.
          effetti: { ferite: 1 }
      - testo: "Sfondare il coperchio"
        descrizione: "Il coperchio è di assi vecchie, e un'ascia lo apre. Se dentro c'è una trappola, scatterà."
        esito:
          titolo: Il coperchio sfondato
          testo: |
            Trovi la porta seguendo la corrente d'aria, e con un'ascia presa
            in prestito dall'armeria sfondi le assi del coperchio. Al terzo
            colpo una lama arrugginita scatta fuori dal legno e ti si pianta
            nella coscia. La tiri fuori stringendo i denti. Poi infili il
            braccio nel buco e tiri fuori una borsa pesante di monete di
            tutte le zecche e un giaco di maglia fine, piegato sotto una
            tunica di seta blu orlata d'oro. In fondo, in un sacchetto di
            cuoio, ci sono una collana d'oro e un simbolo sacro di platino
            del Grande Albero Rosso. La ferita sulla coscia brucia, e i
            bordi sono già rossi di ruggine.

            {medicina Media} Una lama rimasta chiusa per anni in un forziere
            umido. Va lavata con qualcosa di forte appena puoi, e non quando
            ti fa comodo.
          effetti: { monete: 200, oggetto.giaco-di-balthog: 1, bottino.tunica-di-seta: 1, bottino.collana-d-oro: 1, bottino.simbolo-del-grande-albero: 1, tesoro.capomozzo: 1, ferite: 1.5 }
      - testo: "Cercare la trappola prima del tesoro"
        descrizione: "Nelle rovine un forziere chiuso si guarda prima dai bordi e poi dal lucchetto. Sulle piattaforme lo ripetono a ogni recluta."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Facile }
        successo:
          titolo: Il cuneo nella fessura
          testo: |
            Segui la corrente d'aria fino all'asse che suona vuota, e dietro
            trovi lo stanzino con il forziere. Prima di toccare il lucchetto
            gli giri intorno in ginocchio, come ti hanno insegnato nelle
            rovine, e sul coperchio trovi la fessura troppo dritta per essere
            una crepa. Ci infili una scheggia di legno e la batti piano con
            il palmo finché resta piantata. La chiave la trovi dove la tiene
            chi si alza di notte, legata con lo spago sotto la sedia
            imbottita. Quando giri il lucchetto, dentro il coperchio qualcosa
            scatta e si inceppa contro la scheggia.

            Dentro c'è il bottino di anni di razzie, buttato alla rinfusa.
            Ci sono monete di tutte le zecche a manciate, un giaco di maglia
            fine piegato con cura sotto una tunica di seta blu orlata d'oro,
            e in un sacchetto di cuoio una collana d'oro e un simbolo sacro
            di platino del Grande Albero Rosso.

            {tecnologia Facile} Una molla e una lama, roba da fabbro di
            villaggio. Le trappole dei Precursori, in confronto, sono
            educate.
          effetti: { monete: 200, oggetto.giaco-di-balthog: 1, bottino.tunica-di-seta: 1, bottino.collana-d-oro: 1, bottino.simbolo-del-grande-albero: 1, tesoro.capomozzo: 1, racconto: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: La scheggia che non tiene
          testo: |
            Trovi la fessura sul coperchio e ci pianti una scheggia di legno,
            ma il legno è marcio e la scheggia si piega. Della chiave non
            trovi traccia, e quando provi il lucchetto con la punta del
            coltello la lama arrugginita esce lo stesso e ti apre
            l'avambraccio. Il lucchetto tiene. Sulle piattaforme, a una
            recluta, per questo darebbero un turno di latrine, e ti viene
            da ridere dove sei.
          effetti: { ferite: 1 }
      - testo: "Pensare come un usuraio della Città Bassa"
        descrizione: "Nei vicoli chi presta a strozzo tiene la chiave dove si siede e la cassa dove va da solo."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Come uno strozzino
          testo: |
            Nei vicoli dove sei cresciuto chi tiene i soldi degli altri non
            si fida di nessuno, e meno che mai delle tasche. Infili le dita
            sotto la seduta della sedia imbottita e trovi una chiave di
            ferro legata con lo spago. Poi segui la riga consumata sul
            pavimento della latrina fino all'asse che suona vuota. Sul
            coperchio del forziere c'è una fessura troppo dritta, e giri la
            chiave con il braccio lontano dal corpo, perché anche questo lo
            fanno tutti gli strozzini che hai conosciuto.

            Dentro c'è il bottino di anni di razzie, buttato alla rinfusa.
            Ci sono monete di tutte le zecche a manciate, un giaco di maglia
            fine piegato con cura sotto una tunica di seta blu orlata d'oro,
            e in un sacchetto di cuoio una collana d'oro e un simbolo sacro
            di platino del Grande Albero Rosso.
          effetti: { monete: 200, oggetto.giaco-di-balthog: 1, bottino.tunica-di-seta: 1, bottino.collana-d-oro: 1, bottino.simbolo-del-grande-albero: 1, tesoro.capomozzo: 1, racconto: 1 }
          pe: { conoscenze-della-strada: 5 }
        fallimento:
          titolo: Il materasso
          testo: |
            Sei sicuro che un capo tenga la chiave nel letto, come tutti
            quelli che conoscevi, e rivolti il materasso a baldacchino da
            cima a fondo. Ne esce soltanto terra. Trovi il forziere seguendo
            la corrente d'aria e provi il lucchetto con la punta del
            coltello, e al secondo giro una lama arrugginita esce dal
            coperchio e ti apre l'avambraccio. Il lucchetto tiene, e dalla
            sala riunioni arriva il rumore di una sedia trascinata.
          effetti: { ferite: 1 }

  # ------------------------------------------------------------ il cuore · 2 → 3 (C19)
  - id: balthog-il-prescelto
    immagine: personaggi/balthog-il-prescelto
    titolo: Balthog il Prescelto
    sommario: "La sala del trono di Capomozzo, con le pellicce alle pareti e le mani mozzate ai piedi dei pilastri. Sul trono un orco senza nemmeno una cicatrice ti aspetta."
    luogo: Capomozzo, la sala del trono
    area: capomozzo
    requisiti: [pista.capomozzo == 2, profondita.capomozzo >= 4]
    testo: |
      La sala del trono è la stanza più grande della fortezza, e l'aria è
      ferma e sa di ferro. Le pareti sono coperte di pellicce striate di
      rosso e di nero, e quattro pilastri irti di spuntoni reggono il
      soffitto annerito dalle torce. Ai piedi dei pilastri ci sono le mani
      mozzate, infilzate sugli spuntoni bassi, alcune secche come foglie e
      altre no. In fondo, su una pedana di legno, c'è un trono coperto di
      pelli di cinghiale con un teschio di cavallo sopra lo schienale.

      Balthog il Prescelto ci siede sopra, con quattro orchi armati ai lati.
      Ha i lineamenti regolari, quasi belli per un orco, e in tutto il corpo
      non ha una cicatrice. Le mani appoggiate sulle ginocchia sono vuote.

      {rissa Difficile} Uno che combatte da anni e non ha nemmeno un graffio
      non ha avuto fortuna. Le mani vuote sono la sua arma, e le tiene bene
      in vista perché tu lo sappia.

      «Fermo lì. Non ti sei ancora guadagnato il diritto di avvicinarti»
      dice a voce bassa, e si sporge in avanti con i gomiti sulle ginocchia.
      «So chi sei, macellaio di Qir-Azel. Hai ammazzato la mia gente in
      città e sotto la città, eppure non sei venuto fin qui per me.» Alza
      piano le mani aperte. «C'è una donna che vive sotto questa fortezza, o
      qualcosa che ha preso la forma di una donna. Ha i capelli come il
      mercurio. Lei e i suoi incappucciati hanno provato a piegarmi.
      Potremmo avere un nemico in comune, macellaio. Io posso darti rifugio
      e i tesori di anni di razzie, e tu mi dici che cosa vuoi.»

      {ingannare Media} Il racconto è vero a metà. Dice che hanno provato a
      piegarlo, e lo dice al passato, come uno che preferisce non sapere se
      ci sono riusciti.

      {origine fuggiasco-di-ghoran} Balthog parla piano, come parlavano i
      padroni a Ghoran quando non avevano bisogno di alzare la voce. Le
      spalle ti si curvano di un dito, e ti costa fatica raddrizzarle.

      Sorride, e gli occhi restano fermi su di te. I tuoi piedi, intanto,
      sono rimasti sulla soglia.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "Le mani vuote gli bastano. I quattro orchi ai lati del trono aspettano un suo cenno."
        combattimento: balthog
        vittoria:
          titolo: Il Prescelto
          testo: |
            Balthog scende i tre gradini della pedana senza fretta e si
            mette in guardia con le mani aperte all'altezza del petto.
            Combatte meglio di chiunque tu abbia mai visto, e per un pezzo
            ogni tuo colpo trova soltanto aria, mentre i suoi ti arrivano
            dove sai che fanno male. Poi sbaglia di poco l'appoggio di un
            piede sulla pelle di cavallo stesa davanti al trono, e tu ci
            entri dentro. Quando cade contro un pilastro gli spuntoni fanno
            il resto. I quattro orchi guardano il loro Prescelto per terra,
            poi si guardano fra loro, e scappano dalla porta grande senza
            una parola. Dietro il trono una tenda di pelle copre una scala
            che scende nella roccia.
          effetti: { pista.capomozzo: 1, racconto: 1 }
          imposta: { balthog: 1 }
          vai: sotto-capomozzo
        sconfitta:
          titolo: Scendi da lei
          testo: |
            Balthog non spreca un movimento. Ti prende il polso e ti fa
            girare su te stesso, e ti manda a sbattere contro un pilastro a
            un palmo dagli spuntoni. Quando provi a rialzarti ti rimette giù
            con un colpo solo sotto lo sterno, e l'aria se ne va dai polmoni
            senza chiederti il permesso. Ti trascina per il collo della
            camicia fino alla tenda dietro il trono, dove una scala scende
            nel buio.

            «Scendi da lei, macellaio» dice senza alzare la voce. «Se torni
            su ti finisco io. Se resti giù ti finisce lei, e a me va bene
            uguale.» Ti spinge, e rotoli per una rampa intera prima di
            fermarti contro il muro.

            {resistenza Facile} Niente di rotto. Le costole protestano a
            ogni respiro, ma protestano tutte, ed è un buon segno.
          effetti: { pista.capomozzo: 1, tormento: 1.5 }
          vai: sotto-capomozzo
      - testo: "Stare al gioco e aspettare che scenda dal trono"
        descrizione: "Ha voglia di trattare, o di fartelo credere. Prima o poi dovrà avvicinarsi, e tu avrai un colpo solo prima che capisca."
        prova: { attributo: sociale, abilita: [ingannare, galateo], difficolta: Difficile }
        successo:
          titolo: Il ginocchio
          testo: |
            Gli rispondi che vuoi la donna di sotto e che il resto si può
            discutere. Balthog annuisce piano, come se avessi detto la cosa
            giusta, e scende dalla pedana per venirti incontro, e tu vedi il
            momento in cui il peso gli passa sulla gamba davanti. Lo
            colpisci lì, al ginocchio, con il tacco dello stivale e tutto il
            tuo peso, e la gamba gli si piega dalla parte sbagliata. Cade di
            fianco con un verso di sorpresa e batte la testa contro la base
            di un pilastro, fra gli spuntoni bassi e le mani secche, e resta
            intontito quanto basta perché il secondo colpo lo prenda alla
            tempia. I quattro orchi vedono il loro Prescelto a terra e
            scappano. Lo lasci lì davanti al trono senza finirlo, vivo, con
            un rivolo di sangue nell'orecchio e la sua prima cicatrice.
            Dietro il trono una tenda di pelle copre una scala che scende.
          effetti: { pista.capomozzo: 1, racconto: 1 }
          pe: { ingannare: 5 }
          imposta: { balthog: 2 }
          vai: sotto-capomozzo
        fallimento:
          titolo: Troppo presto
          testo: |
            Gli rispondi con le parole giuste, ma gli guardi le ginocchia
            troppo presto, e Balthog se ne accorge. «Ti avevo avvertito. Non
            sei pronto a stare davanti a me» dice, e in un attimo è giù
            dalla pedana. Il primo colpo non lo vedi nemmeno. Ti ritrovi
            contro un pilastro, con uno spuntone che ti ha aperto la spalla,
            e scappi dalla porta laterale verso la chiesa in cima all'isola
            con i passi degli orchi dietro. Dietro l'altare la porta bassa è
            aperta. Ti butti giù per la scala nella roccia, e nessuno ti
            segue oltre le lanterne.

            {resilienza Media fallita} Ti ripeti che sei scappato per
            scelta, perché la strada scendeva comunque. A ogni gradino ci
            credi un po' meno.
          effetti: { pista.capomozzo: 1, ferite: 2.5 }
          vai: sotto-capomozzo
      - testo: "Dirgli che lei lo sta usando"
        descrizione: "Le macchine della fortezza dovrebbero obbedire a lui. Forse è ora che si chieda a chi obbediscono davvero."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: Le macchine si girano
          testo: |
            Gli racconti del diario di Isvaro, dove il mezzelfo chiama
            Aurenne la sua amata e scrive che gli orchi di Capomozzo li
            comanda lei. Poi gli chiedi se le macchine della sala dei trofei
            si girano verso di lui, quando entra. Balthog guarda a lungo le
            sue mani vuote, e alla fine manda via i quattro orchi con un
            cenno.

            «Borgoth me l'aveva detto del mezzelfo, e io l'ho cacciato per
            questo» dice. «Quando entra lei le macchine si girano. Verso di
            me non si sono girate mai.» Si alza e si butta sulle spalle una
            pelliccia presa dallo schienale. «Capomozzo adesso è roba tua e
            sua, macellaio. Io porto via la mia gente prima che lei finisca
            di consumarla.» Esce dalla porta grande senza voltarsi, e dietro
            il trono resta una tenda di pelle sopra una scala che scende.

            {empatia Media} Lo sapeva da tempo. Gli mancava soltanto
            qualcuno da cui sentirselo dire, che non fosse uno della sua
            gente.
          effetti: { pista.capomozzo: 1, racconto: 1 }
          pe: { empatia: 5 }
          vai: sotto-capomozzo
        fallimento:
          titolo: Il palmo aperto
          testo: |
            Gli racconti del diario di Isvaro e di quello che il mezzelfo
            scriveva di lei, e Balthog ti lascia arrivare fino in fondo, con
            la pazienza di un maestro davanti a un allievo lento. Poi ride
            piano. «Anche Borgoth parlava così, e adesso Borgoth dorme nei
            rovi» dice, e scende dalla pedana. Ti colpisce una volta sola,
            al fianco, con la mano aperta, e ti sembra di aver preso un
            tronco. Quando riesci a respirare sei carponi sulla roccia fuori
            dalla porta laterale. Gli orchi restano dentro, perché lui li ha
            fermati con una parola che somiglia a una risata. Ti trascini
            fino alla chiesa in cima all'isola, e poi giù per la scala
            dietro l'altare, sputando sangue a ogni giro.
          effetti: { pista.capomozzo: 1, ferite: 2 }
          vai: sotto-capomozzo
      - testo: "Ripetergli quello che ti ha detto Borgoth"
        descrizione: "Borgoth conosceva Balthog da prima che arrivasse lei, e fra i rovi ti ha detto parecchio."
        requisiti: [borgoth >= 1, borgoth <= 2]
        prova: { attributo: sociale, abilita: [empatia, persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Le parole di Borgoth
          testo: |
            Gli ripeti quello che ti ha detto Borgoth fra i rovi, che è
            stata lei a volere l'attacco a Qir-Azel e che lui, Balthog, fa
            tutto quello che lei dice. Balthog ascolta con la testa piegata.
            Quando arrivi al mezzelfo stringe i braccioli del trono fino a
            farli scricchiolare, e poi li lascia andare, un dito alla volta.

            «Borgoth parla troppo, e quasi sempre ha ragione» dice. Fa un
            cenno, e i quattro orchi escono. Raccoglie una pelliccia dallo
            schienale e se la butta sulle spalle. «Tienila tu, la fortezza.
            Io porto via chi mi vuole seguire.» Se ne va senza voltarsi, e
            dietro il trono resta una tenda di pelle sopra una scala che
            scende.

            {politica-ed-economia Media} Una tribù senza capo e una fortezza
            senza tribù. Qualcuno in Municipio, fra un mese, scriverà che la
            minaccia degli orchi è stata respinta, e nessuno chiederà come.
          effetti: { pista.capomozzo: 1, racconto: 1 }
          pe: { empatia: 5 }
          vai: sotto-capomozzo
        fallimento:
          titolo: Le storie di Borgoth
          testo: |
            Fai il nome di Borgoth, e la faccia di Balthog si chiude come
            una porta. «Borgoth racconta storie a chiunque lo stia a
            sentire» dice. «Adesso ne ha trovato uno che gli crede.» Scende
            dalla pedana in due passi e ti colpisce al petto con il palmo
            aperto, e ti ritrovi sulla schiena con la bocca piena del sapore
            del sangue. Ti rialzi soltanto perché lui te lo lascia fare. Con
            il mento ti indica la porta laterale, quella che porta alla
            chiesa e alla scala nella roccia, e ci vai tenendoti le costole
            mentre lui ti guarda uscire senza muoversi.
          effetti: { pista.capomozzo: 1, ferite: 2 }
          vai: sotto-capomozzo
      - testo: "Tornare indietro e scendere dalla scala della chiesa"
        descrizione: "Il trono non è l'unica strada per scendere. Dietro l'altare della chiesa senza tetto c'è una scala che porta sotto la fortezza."
        esito:
          titolo: La strada lunga
          testo: |
            Fai un passo indietro e poi un altro, e Balthog ti guarda andare
            senza alzarsi. «Va' pure da lei, macellaio» dice alle tue
            spalle. «Ci arrivi lo stesso.» Fuori ti metti a correre, e ti
            fermi soltanto in cima all'isola, nella chiesa senza tetto, a
            scostare la pelle di cinghiale dalla porta bassa dietro
            l'altare. Hai la camicia incollata alla schiena. Scendi la scala nella
            roccia giro dopo giro, oltre le lanterne accese e poi nel buio,
            con la sua voce ancora in testa, e a ogni giro alzi gli occhi a
            guardare la scala vuota sopra di te.
          effetti: { pista.capomozzo: 1, tormento: 1.5 }
          vai: sotto-capomozzo
      - testo: "Offrirgli un patto con le formule dei Casati"
        descrizione: "Nei Quartieri Alti un patto si chiude in piedi, a metà della stanza, stringendosi la mano. Per stringerla, lui deve scendere dal trono."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: La mano tesa
          testo: |
            Gli parli come in un salone, con le formule lunghe che si usano
            per i patti fra Casati, e gli dici che vuoi la donna di sotto e
            che sul resto ci si accorda da pari. Poi tendi la mano e aspetti,
            a metà della sala, come si aspetta in casa d'altri. Balthog
            ascolta le formule con la testa piegata, e alla fine scende
            dalla pedana per stringertela. Nel momento in cui il peso gli
            passa sulla gamba davanti lo colpisci al ginocchio con il tacco
            dello stivale, e la gamba gli si piega dalla parte sbagliata.
            Batte la testa contro la base di un pilastro, fra gli spuntoni
            bassi, e il secondo colpo lo prende alla tempia. I quattro orchi
            scappano. Lo lasci lì davanti al trono, vivo, con la sua prima
            cicatrice. Dietro il trono una tenda di pelle copre una scala
            che scende.

            {galateo Difficile} Ha scelto di scendere per farti vedere che
            le buone maniere le conosce anche lui. È la sola vanità che gli
            hai trovato addosso, e ti è bastata.
          effetti: { pista.capomozzo: 1, racconto: 1 }
          pe: { galateo: 5 }
          imposta: { balthog: 2 }
          vai: sotto-capomozzo
        fallimento:
          titolo: Una formula di troppo
          testo: |
            Le formule ti escono bene, ma una di troppo. Balthog ti lascia
            finire con la mano tesa a mezz'aria, poi scende dalla pedana e
            invece di stringerla te la torce dietro la schiena. «Quando
            parlate così lungo, voi di città, state prendendo tempo» dice,
            e ti spinge contro un pilastro, dove uno spuntone ti apre la
            spalla. Scappi dalla porta laterale verso la chiesa in cima
            all'isola, con i passi degli orchi dietro, e ti butti giù per la
            scala dietro l'altare. Nessuno ti segue oltre le lanterne.
          effetti: { pista.capomozzo: 1, ferite: 2.5 }
          vai: sotto-capomozzo
      - testo: "Raccontargli dei cristalli del Festival"
        descrizione: "Il giorno della razzia i cristalli del banco dell'Accademia hanno vibrato tutti insieme, poco prima che le macchine scendessero dai tetti. Balthog, di cristalli, non sa niente."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: Il segnale
          testo: |
            Gli racconti dei sei cristalli del banco che vibravano insieme,
            della nota breve che si ripeteva e delle tre sagome che subito
            dopo calavano dalle grondaie. Gli spieghi che un cristallo
            risponde a un altro cristallo, e che nessuno dei suoi orchi ne
            porta uno addosso. Poi gli chiedi se le macchine della sala dei
            trofei si girano verso di lui, quando entra. Balthog guarda a
            lungo le sue mani vuote, e manda via i quattro orchi con un
            cenno.

            «Quando entra lei le macchine si girano. Verso di me non si sono
            girate mai» dice. Si alza e si butta sulle spalle una pelliccia
            presa dallo schienale. «Capomozzo adesso è roba tua e sua. Io
            porto via la mia gente prima che lei finisca di consumarla.»
            Esce dalla porta grande senza voltarsi, e dietro il trono resta
            una tenda di pelle sopra una scala che scende.
          effetti: { pista.capomozzo: 1, racconto: 1 }
          pe: { tecnologia: 5 }
          vai: sotto-capomozzo
        fallimento:
          titolo: La lezione
          testo: |
            Cominci dai cristalli e ti perdi nelle risonanze, con le parole
            dell'aula che qui non vogliono dire niente. Balthog ti lascia
            parlare con la pazienza di uno che ascolta un bambino recitare.
            «Le pietre che cantano sono roba vostra» dice, e scende dalla
            pedana. Ti colpisce una volta sola, al fianco, con la mano
            aperta, e quando torni in te sei carponi sulla roccia
            fuori dalla porta laterale. Ti trascini fino alla chiesa in cima
            all'isola, e poi giù per la scala dietro l'altare, sputando
            sangue a ogni giro.
          effetti: { pista.capomozzo: 1, ferite: 2 }
          vai: sotto-capomozzo
      - testo: "Fargli i conti come a un socio"
        descrizione: "Sui Ponti si riconosce subito chi in un affare ci mette i morti e chi si prende il guadagno. Balthog ci ha messo i morti."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: I conti
          testo: |
            Gli fai i conti come al banco, una voce alla volta. I morti
            della razzia ce li ha messi lui, e anche la fortezza, piena di
            macchine che non gli obbediscono. Lei non ci ha messo niente, e
            di sotto continua a ridere. Poi gli chiedi chi ha incassato. Balthog
            guarda a lungo le sue mani vuote, e manda via i quattro orchi
            con un cenno.

            «Quando entra lei le macchine si girano. Verso di me non si sono
            girate mai» dice. Si alza e si butta sulle spalle una pelliccia
            presa dallo schienale. «Capomozzo adesso è roba tua e sua,
            macellaio. Io porto via la mia gente prima che lei finisca di
            consumarla.» Esce dalla porta grande senza voltarsi, e dietro il
            trono resta una tenda di pelle sopra una scala che scende.

            {politica-ed-economia Media} Un socio che si accorge di essere
            stato pagato in morti di solito non chiude l'affare. Lo
            abbandona, e lui sta facendo proprio questo.
          effetti: { pista.capomozzo: 1, racconto: 1 }
          pe: { politica-ed-economia: 5 }
          vai: sotto-capomozzo
        fallimento:
          titolo: Il prezzo sbagliato
          testo: |
            Gli fai i conti come al banco, ma sbagli la prima voce, e
            Balthog se ne accorge prima di te. «Mi parli come a un cliente
            da spennare» dice, e ride piano. Scende dalla pedana e ti colpisce
            una volta sola, al fianco, con la mano aperta. Quando la vista
            ti torna sei carponi sulla roccia fuori dalla porta laterale, e
            gli orchi restano dentro. Ti trascini fino alla chiesa in cima
            all'isola, e poi giù per la scala dietro l'altare, sputando
            sangue a ogni giro.
          effetti: { pista.capomozzo: 1, ferite: 2 }
          vai: sotto-capomozzo
