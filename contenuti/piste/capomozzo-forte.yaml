# Capomozzo, la fortezza (pista.capomozzo 2 → 3).
# Si entra dal cuore di Rovolungo (`borgoth-e-cenerascura`, capomozzo-1.yaml) o, dopo una ritirata, da
# `ritorno-alla-fortezza` alle Scuderie della Zanna Rotta.
# - area `capomozzo`: sette stanze ripetibili, in ordine secondo la profondità: 0 la palizzata (C10), 1 dentro
#   le mura (C11 la sala dei trofei, C12–C13 la torre dei sottaceti), 2 verso il lato a monte (C16 il cortile
#   dei cinghiali, C14–C15 la torre di guardia est e il camminamento, C25 la chiesa senza tetto), 3 la torre
#   est o la chiesa se non ci sei ancora passato, e C26 la scala dietro l'altare se sei passato dalla chiesa
#   (forte.chiesa). Una stanza superata non ricompare nella stessa visita (src/motore/spedizioni.ts).
# - storie non ripetibili: `ombrafosca-in-gabbia` (C17–C18), nel capanno in fondo al cortile, si apre dopo
#   che hai attraversato il cortile (forte.cortile), con il seguito `ombrafosca-fuori-dalla-gabbia`
#   (ombrafosca 1 liberato, 2 con te); `la-tesoreria-di-balthog` (C23–C24, tesoro.capomozzo), la camera
#   del capotribù accanto alla sala del trono, insieme al cuore.
# - il cuore `balthog-il-prescelto` (C19): in ogni ramo pista.capomozzo 3 e `vai: sotto-capomozzo`.
#   balthog vale 1 se muore nello scontro, 2 se lo atterri a sorpresa e lo lasci a terra vivo davanti al
#   trono; resta 0 se lo convinci (se ne va con la sua gente), se lo aggiri o se ti batte e ti butta giù per
#   la scala (resta sul trono).
quality:
  - { id: forte.cortile, nome: Hai attraversato il cortile dei cinghiali, categoria: stato, nascosta: true, descrizione: "1 se in questa visita sei arrivato in fondo al cortile, dove c'è il capanno del cavallo. La palizzata lo azzera." }
  - { id: forte.chiesa, nome: Sei passato dalla chiesa senza tetto, categoria: stato, nascosta: true, descrizione: "1 se in questa visita sei passato dalla chiesa, perché la scala nella roccia sta dietro l'altare. La palizzata lo azzera." }

aree:
  - id: capomozzo
    immagine: ambientazione/capomozzo
    nome: Capomozzo
    sommario: "La fortezza di Balthog in cima all'isola, dietro una palizzata fatta con le navi che il mare ha buttato sugli scogli."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Visto dal ponte di corda, il profilo dell'isola è quello di una testa
      tagliata, con la fortezza in cima come una corona messa storta, dietro
      una palizzata di travi nere da cui spuntano gli alberi maestri di navi
      che in porto non sono mai arrivate. Dalla porta socchiusa si vede un
      cortile di terra battuta, e a monte la sala del trono di Balthog il
      Prescelto. In cima alla roccia resta una chiesa di pietra grigia senza
      tetto, molto più vecchia della palizzata.

storylet:
  # ------------------------------------------------------------ 2 · rientrare dopo una ritirata
  - id: ritorno-alla-fortezza
    presso: scuderie-della-zanna-rotta
    immagine: ambientazione/scuderie-della-zanna-rotta
    titolo: Di nuovo verso Capomozzo
    sommario: "Balthog ti aspetta ancora sul suo trono, oltre il ponte di corda."
    luogo: Città Bassa, davanti alle Scuderie della Zanna Rotta
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.capomozzo == 2]
    testo: |
      Davanti alle Scuderie della Zanna Rotta Dolovan Stroud sta ferrando un
      cavallo pezzato, e quando gli dici dove torni si toglie i chiodi di
      bocca.

      «Capomozzo» ripete sputando di lato. «Mio nonno diceva che lassù c'era
      una chiesa già prima degli orchi. Per andare dagli orchi i cavalli li
      affitto a prezzo doppio.»

      {origine figlio-della-citta-bassa} La storia del nonno la senti da
      quando eri alto quanto un secchio, e a ogni racconto è cresciuta di un
      nonno.

      Conosci la strada, che in due giorni e mezzo verso nord porta al ponte
      di corda sopra le onde.
    opzioni:
      - testo: "Partire a piedi"
        descrizione: "Due giorni e mezzo di cammino, e le gambe se li ricordano ancora."
        esito:
          titolo: A piedi
          testo: |
            Parti all'alba con il pane nello zaino e cammini due giorni e mezzo
            lungo la costa, dove il vento ti lascia il sale sulle ciglia. Il
            roveto di Rovolungo è come l'hai lasciato e il ponte di corda regge
            ancora, e sull'isola la palizzata di relitti è nera contro il cielo.
          vai: capomozzo
      - testo: "Andare a cavallo"
        descrizione: "A cavallo la costa arriva un giorno prima."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Lungo la costa
          testo: |
            Il cavallo prende la strada del nord da solo, e la costa grigia arriva
            il giorno dopo. Lo lasci legato al pino storto davanti al roveto e
            prosegui a piedi per il tunnel di cardi fino al ponte di corda. Quando
            sollevi la stuoia di rami lui ti sta ancora guardando, con le orecchie
            dritte.
          vai: capomozzo
      - testo: "Affittare un cavallo da Dolovan"
        descrizione: "A prezzo doppio, come ha detto lui."
        requisiti: [monete >= 10]
        costo: 0
        esito:
          titolo: Il pezzato
          testo: |
            Dolovan conta le monete due volte e ti dà il pezzato. «Riportamelo
            intero, che con gli orchi ho già pagato abbastanza» dice. Il pezzato
            si ferma a ogni pozzanghera per pensarci sopra, ma alla costa ci
            arrivi un giorno prima, e lo lasci legato al pino storto davanti al
            roveto.
          effetti: { monete: -10 }
          vai: capomozzo

  # ------------------------------------------------------------ le stanze (ripetibili, in ordine di profondità)
  # 0 · la palizzata
  - id: capomozzo-palizzata
    immagine: ambientazione/capomozzo
    titolo: La palizzata di relitti
    sommario: "Una palizzata di fasciame e alberi di nave, con le porte socchiuse e il vociare degli orchi dentro."
    luogo: Capomozzo, la palizzata
    area: capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 2, profondita.capomozzo == 0]
    testo: |
      Da vicino la palizzata è fasciame di navi ancora curvo, con i chiodi
      di rame diventati verdi e qua e là un albero maestro piantato nella
      roccia fra le assi.

      {origine mercante-dei-ponti} Al Mercato dei Nodi ogni nave che non
      arriva in porto diventa una riga in rosso sui registri della Gilda, e
      qui le righe rosse le hanno piantate nella roccia.

      Dalle porte socchiuse arriva una lite gutturale su chi deve andare a
      prendere l'acqua. Sulle due torri ai lati ci sono le vedette, e quella
      di sinistra si gira a sputare ogni volta che finisce una frase.
    opzioni:
      - testo: "Passare sotto gli occhi delle vedette"
        descrizione: "Sono distratte, però da lassù vedono tutto il sentiero."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: La porta socchiusa
          testo: |
            Aspetti che la vedetta di sinistra si giri a sputare, poi corri chino
            lungo la palizzata e ti infili nella porta socchiusa. Dentro c'è un
            androne con una botte d'acqua e un mestolo legato con lo spago. Resti
            dietro la botte finché il cuore smette di martellarti nelle orecchie,
            e dalla torre non arriva nessun allarme.
          effetti: { profondita.capomozzo: 1 }
          imposta: { forte.cortile: 0, forte.chiesa: 0 }
        fallimento:
          titolo: Il sasso
          testo: |
            A metà strada un sasso ti rotola via da sotto lo stivale e scende
            saltando fino al mare. La vedetta tira una lancia a caso, che ti apre
            la spalla di striscio. Resti immobile, con il sangue caldo nella
            manica, finché lassù qualcuno ride e la vedetta torna a sedersi.
          effetti: { ferite: 0.5 }
      - testo: "Cercare un'asse che ceda"
        descrizione: "Una palizzata fatta di relitti ha gli stessi difetti delle navi da cui viene."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Lo scafo marcio
          testo: |
            Passi le dita lungo il fasciame finché trovi un'asse che sotto il
            pollice si sfalda come pane bagnato, mangiata dal tarlo di mare. La
            stacchi piano dai chiodi verdi e ti infili nel varco, fra un mucchio
            di reti e il muro dei dormitori. Rimetti l'asse al suo posto dietro di
            te, con la cura che si mette a chiudere la porta di casa d'altri.
          effetti: { profondita.capomozzo: 1 }
          imposta: { forte.cortile: 0, forte.chiesa: 0 }
        fallimento:
          titolo: Il chiodo di rame
          testo: |
            Provi un'asse dopo l'altra, e reggono tutte. All'ultima tiri troppo
            forte, il chiodo di rame viene via di colpo e ti si pianta nel palmo.
            Ti mordi il polso per non gridare e ti fasci la mano con un lembo
            della camicia, mentre sulle torri le vedette litigano ancora per
            l'acqua.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare il cambio della guardia fra gli scogli"
        descrizione: "Prima o poi le vedette scendono a mangiare. Gli scogli sono bagnati, e la marea sale."
        costo: 2
        esito:
          titolo: La marea
          testo: |
            Ti rannicchi fra gli scogli sotto la palizzata e aspetti, mentre la
            marea ti sale fino alle ginocchia e un granchio ti pizzica attraverso
            lo stivale. Quando le vedette scendono a mangiare hai le gambe
            intirizzite e i denti che battono, e passi la porta con i calzoni che
            gocciolano.
          effetti: { profondita.capomozzo: 1, ferite: 0.5 }
          imposta: { forte.cortile: 0, forte.chiesa: 0 }

  # 1 · dentro le mura
  - id: capomozzo-sala-dei-trofei
    immagine: bestiario/orco
    titolo: La sala dei trofei
    sommario: "Due ali d'arpia inchiodate al muro con sette pugnali, quattro orchi con le selle e una macchina senza volto."
    luogo: Capomozzo, la sala dei trofei
    area: capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 2, profondita.capomozzo == 1]
    testo: |
      Alla parete est pendono teste di cavallo e di cane con bottoni cuciti
      al posto degli occhi. Sulla parete sud due ali nere sono inchiodate
      con sette pugnali, e uno ha l'impugnatura di madreperla che manda una
      luce lattiginosa.

      Intorno a un braciere quattro orchi fanno a gara a sollevare le selle
      dei cinghiali, e in un angolo sta una macchina della Salvaguardia con
      la testa girata all'indietro.

      {origine apprendista-raschiatore} Sulle piattaforme, davanti a una di
      queste macchine, si torna alla scala più vicina.

      {origine allievo-di-torvessa} L'ultima volta che ne hai vista una
      vibravano tutti i cristalli del banco.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Gli orchi sono scesi di sella e hanno le mani occupate. La macchina è un'altra faccenda."
        combattimento: sala-dei-trofei
        vittoria:
          titolo: La sella
          testo: |
            Il primo orco ti arriva addosso con la sella in mano, e la sella è la
            prima cosa che rompi. Gli altri scappano verso i dormitori e non
            tornano. La macchina ti viene incontro camminando all'indietro, con
            una precisione che ti fa arretrare di un passo, e quando finalmente
            cade il nucleo che ha nel petto ronza ancora un poco prima di
            spegnersi.
          effetti: { profondita.capomozzo: 1 }
        sconfitta:
          titolo: Il polso
          testo: |
            Senza voltarsi, la macchina ti prende il polso da dietro e ti torce il
            braccio finché le ginocchia toccano terra, e l'orco ti colpisce con la
            sella in piena faccia. Ti ritrovi fuori, dietro un mucchio di reti,
            con il naso che sanguina e le risate degli orchi che passano dalla
            porta.
      - testo: "Passare lungo la parete delle teste"
        descrizione: "Gli orchi guardano la sella. La macchina guarda altrove, se una testa girata al contrario guarda da qualche parte."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Contato
          testo: |
            Ti muovi lungo la parete est, sotto le teste di cavallo, mentre gli
            orchi urlano per una sella caduta sul piede di qualcuno. Passi a tre
            braccia dalla macchina, e la sua testa resta puntata su di te senza
            che il corpo si muova.

            {percezione Difficile} Mentre uscivi la testa ha fatto un piccolo
            scatto, come la lancetta di un orologio. Da qualche parte, adesso, sei
            un numero.
          effetti: { profondita.capomozzo: 1 }
        fallimento:
          titolo: La testa di cane
          testo: |
            Urti con la spalla una testa di cane, che si stacca dal chiodo e
            rotola fra i piedi degli orchi con i suoi bottoni al posto degli
            occhi. La guardano tutti, e poi guardano te. Esci da dove sei entrato
            con due orchi alle calcagna, e ti salvi soltanto perché il primo
            inciampa nella sella.
          effetti: { ferite: 0.5 }
      - testo: "Staccare il pugnale di madreperla"
        descrizione: "È in alto, e il suo chiodo regge mezza ala. Bisogna arrampicarsi sulle teste di cavallo."
        immagine: icone/curvy-knife
        quando: [oggetto.pugnale-dell-arpia == 0]
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: La madreperla
          testo: |
            Aspetti che gli orchi escano nel cortile a sellare i cinghiali, poi ti
            arrampichi usando le teste di cavallo come gradini. Il pugnale viene
            via con uno strappo, e mezza ala ti scivola addosso in una pioggia di
            piume nere. La lama non ha un filo di ruggine, e te la infili nello
            stivale prima che gli orchi tornino.
          effetti: { oggetto.pugnale-dell-arpia: 1, profondita.capomozzo: 1 }
        fallimento:
          titolo: L'ala
          testo: |
            La terza testa di cavallo cede sotto il tuo peso con un rumore di
            paglia secca. Cadi di schiena e l'ala intera ti viene giù addosso con
            tutti i suoi pugnali, e uno ti apre il polpaccio. Senti gli orchi che
            tornano dal cortile e ti trascini fuori dalla porta di fondo,
            lasciando il pugnale di madreperla per terra in mezzo agli altri.
          effetti: { ferite: 0.5 }
      - testo: "Strisciare dietro il braciere"
        descrizione: "Il fumo copre bene, e scotta."
        costo: 2
        esito:
          titolo: Il fumo
          testo: |
            Passi carponi dietro il braciere, dove il fumo è così fitto che gli
            occhi ti lacrimano, e una brace ti salta sul dorso della mano. Arrivi
            alla porta di fondo con la mano che pulsa, e fuori tossisci dentro la
            manica fino a vedere le stelle.
          effetti: { profondita.capomozzo: 1, ferite: 0.5 }

  - id: capomozzo-torre-dei-sottaceti
    immagine: fazioni/tribu-capomozzo
    titolo: La torre dei sottaceti
    sommario: "Una dispensa che sa d'aceto, e in cima alla torre ovest due vedette che da ieri sera tacciono."
    luogo: Capomozzo, la dispensa e la torre ovest
    area: capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 2, profondita.capomozzo == 1]
    testo: |
      Alla base della torre ovest c'è la dispensa, con la porta inchiodata e
      un odore d'aceto che passa dalle fessure. In mezzo ai sacchi di sale
      un barile di sottaceti ha un buco tondo nella parte bassa, e la
      salamoia ha lasciato sul pavimento una macchia a forma di continente.

      Accanto una scala a pioli sale per nove metri fino a una botola, e da
      lassù arriva ogni tanto il lamento basso di qualcuno che sta male.

      {medicina Facile} È il lamento di una pancia piena di sottaceti, che a
      stomaco vuoto mettono in ginocchio anche un orco.
    opzioni:
      - testo: "Salire in cima alla torre"
        descrizione: "Nove metri di pioli unti, e in cima qualcuno che si lamenta."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Le vedette
          testo: |
            Sali piolo dopo piolo e spingi la botola con la testa. In cima ci sono
            due orchi stesi sulla schiena, gonfi come otri in mezzo a vasetti
            vuoti, e una macchina della Salvaguardia che guarda il mare in attesa
            di un ordine. Da lassù vedi tutta la fortezza e, sulla cima
            dell'isola, la chiesa senza tetto con una lanterna accesa dentro.
          effetti: { profondita.capomozzo: 1 }
        fallimento:
          titolo: Il piolo unto
          testo: |
            A metà scala un piolo unto di salamoia ti scivola dalla mano, e gli
            ultimi quattro metri li scendi molto più in fretta dei primi cinque.
            Atterri su un sacco di sale che ti salva le gambe, mentre la schiena
            prende tutto il colpo, e da lassù il lamento riprende, quasi solidale.
          effetti: { ferite: 0.5 }
      - testo: "Seguire la scia di salamoia"
        descrizione: "Chi ha bucato il barile non si è preoccupato di cancellare le tracce."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La scia
          testo: |
            La salamoia ha lasciato impronte di piedi nudi fino alla scala, e sui
            pioli ci sono ditate unte che salgono fino alla botola, di due orchi
            che si tenevano con una mano sola perché avevano le braccia piene. *Da
            lassù quei due stanotte non sono scesi.* Passi sotto la torre ovest
            verso il cortile senza nemmeno abbassare la testa.
          effetti: { profondita.capomozzo: 1 }
        fallimento:
          titolo: La salamoia
          testo: |
            Ti chini sulla macchia per guardare le impronte, e il sale ti entra in
            un taglio della mano e brucia da farti lacrimare. Ti scappa un sibilo
            fra i denti, e lassù il lamento si interrompe di colpo. Resti piegato
            e immobile, contando fino a cento, finché il lamento riprende.
          effetti: { tormento: 1 }
      - testo: "Passare fra i sacchi di sale"
        descrizione: "Sui sacchi di sale i passi si sentono poco. Però il sale entra dappertutto."
        costo: 2
        esito:
          titolo: Il sale
          testo: |
            Ti apri la strada carponi fra i sacchi di sale accatastati contro il
            muro della dispensa, e il sale ti entra nelle maniche e in ogni
            graffio, anche in quelli che avevi dimenticato. Esci dall'altra parte
            vicino al cortile con le mani bianche fino ai polsi e il sapore del
            sale in bocca.
          effetti: { profondita.capomozzo: 1, ferite: 0.5 }

  # 2 · verso il lato a monte (la torre est e la chiesa restano aperte anche a 3, finché non ci passi)
  - id: capomozzo-torre-di-guardia
    immagine: bestiario/orco
    titolo: La torre di guardia est
    sommario: "Sotto la torre est dormono sei orchi, e in cima due vedette giocano a carte puntando denti."
    luogo: Capomozzo, i dormitori e la torre est
    area: capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 2, profondita.capomozzo >= 2, profondita.capomozzo <= 3]
    testo: |
      La torre est si sale dai dormitori, una stanza bassa con sei amache. Sei
      orchi dormono con la bocca aperta, e uno stringe nel sonno un pupazzo di
      stracci consumato sul collo a forza di carezze.

      {origine fuggiasco-di-ghoran} A Ghoran hai imparato che chi russa forte
      si sveglia piano, e quello del pupazzo dorme in silenzio.

      In fondo una scala a pioli sale alla torre, da cui il camminamento della
      palizzata gira fino alla sala del trono. Da lassù arriva il rumore delle
      carte sbattute su una cassa e di due voci che litigano sui denti in
      palio.
    opzioni:
      - testo: "Affrontare le vedette"
        descrizione: "Sono due, e guardano le carte. Sotto ce ne sono sei che dormono, ed è meglio che continuino."
        combattimento: torre-di-guardia
        vittoria:
          titolo: La posta
          testo: |
            Spingi la botola e sei in cima prima che posino le carte. Il primo
            orco cerca l'ascia sotto la cassa, l'altro pensa a salvare la posta, e
            li metti giù tutti e due mentre dai dormitori sale un russare che non
            cambia ritmo. Sulla cassa restano una manciata di denti e un mazzo con
            i re disegnati a mano, tutti con le zanne.
          effetti: { profondita.capomozzo: 1 }
        sconfitta:
          titolo: In mezzo alle amache
          testo: |
            Uno dei due ti pesta le dita sul bordo della botola, l'altro ti prende
            per i capelli, e insieme ti rimandano giù in mezzo alle amache. Sei
            orchi si svegliano, e quello del pupazzo, che nella caduta gli hai
            schiacciato, è il più arrabbiato di tutti. Esci dai dormitori
            correndo, con le dita gonfie e un morso sul braccio.
      - testo: "Passare fra le amache e salire senza farsi sentire"
        descrizione: "Sei orchi addormentati, e poi due svegli. Il russare copre i passi, finché copre."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il camminamento
          testo: |
            Passi fra le amache con le braccia strette al corpo, e un orco nel
            sonno ti afferra la manica e poi la lascia andare, borbottando un
            nome. Dalla botola socchiusa vedi le due vedette chine sulla cassa, e
            scivoli fuori sul camminamento alle loro spalle senza che nessuno alzi
            la testa dalla partita.
          effetti: { profondita.capomozzo: 1 }
        fallimento:
          titolo: Lo stivale
          testo: |
            A metà delle amache inciampi in uno stivale e ti aggrappi a un telaio,
            che rovescia il suo orco per terra. L'orco ti dà un pugno in pieno
            petto senza nemmeno aprire gli occhi, poi si gira dall'altra parte e
            riprende a dormire sul pavimento, con una mano sotto la guancia.
          effetti: { ferite: 0.5 }
      - testo: "Gridare da sotto che li vuole Balthog"
        descrizione: "Le vedette di Capomozzo hanno paura di una cosa sola più che di perdere a carte."
        prova: { attributo: sociale, abilita: [intimidire, ingannare], difficolta: Media }
        successo:
          titolo: Il Prescelto chiama
          testo: |
            Ti metti sotto la botola e gridi nella lingua degli orchi le due
            parole che hai sentito più spesso sull'isola, il nome di Balthog e
            quella che deve voler dire *subito*. Le due vedette scendono così in
            fretta che una salta gli ultimi pioli, e corrono verso la sala del
            trono allacciandosi le brache. Sali tu al loro posto, dove la partita
            è rimasta a metà sulla cassa.
          effetti: { profondita.capomozzo: 1 }
        fallimento:
          titolo: L'accento
          testo: |
            Gridi il nome di Balthog con l'accento sbagliato, e una faccia con le
            zanne si affaccia alla botola e scoppia a ridere. L'altra vedetta ti
            tira dietro la cassa, che prendi sulla spalla mentre scappi fuori dai
            dormitori, inseguito fino alla porta da un orco in mutande che vuole
            sapere che cosa succede.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che la partita finisca"
        descrizione: "Prima o poi uno dei due perde tutti i denti che ha da giocare."
        costo: 2
        esito:
          titolo: L'ultimo dente
          testo: |
            Ti rannicchi sotto la scala dietro l'ultima amaca e aspetti per ore,
            mentre un orco si alza due volte a bere da un secchio a un braccio
            dalla tua faccia. Quando lassù uno dei due scoppia a piangere per
            l'ultimo dente perso sali piano, e li trovi abbracciati sulla cassa a
            consolarsi. Passi sul camminamento alle loro spalle.
          effetti: { profondita.capomozzo: 1, tormento: 1 }

  - id: capomozzo-cortile-dei-cinghiali
    immagine: bestiario/cinghiale-crudele-mutato
    titolo: Il cortile dei cinghiali
    sommario: "Quattro cinghiali da guerra liberi nel cortile, e un capanno in fondo da cui arrivano nitriti."
    luogo: Capomozzo, il cortile delle esercitazioni
    area: capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 2, profondita.capomozzo == 2]
    testo: |
      Il cortile delle esercitazioni è un quadrato di terra pressata chiuso
      da una staccionata. Quattro cinghiali da guerra con le zanne cerchiate
      di ferro si inseguono mordendosi le orecchie, e ogni tanto uno si
      stacca dal gioco per dare una testata al capanno in fondo, da cui
      risponde un nitrito furioso, troppo basso per un cavallo comune.

      {origine figlio-del-circolo} L'ultimo cinghiale da guerra che hai visto
      da vicino entrava dalla porta nord di Qir-Azel con un orco in sella.
      Questi giocano, e ti accorgi di esserne contento.

      Per arrivare dall'altra parte devi attraversare tutto il cortile.
    opzioni:
      - testo: "Affrontare i cinghiali"
        descrizione: "Sono quattro, ma arrivano due alla volta, perché gli altri due sono occupati col capanno."
        combattimento: cortile-dei-cinghiali
        vittoria:
          titolo: La staccionata
          testo: |
            Il primo cinghiale ti carica a testa bassa, tu lo lasci passare
            all'ultimo momento e lui pianta le zanne nella staccionata, dove resta
            a dimenarsi. Il secondo è più furbo e ci mette di più. Quando è finita
            hai la coscia graffiata e le mani piene di schegge, e gli altri due ti
            guardano da un angolo.
          effetti: { profondita.capomozzo: 1 }
          imposta: { forte.cortile: 1 }
        sconfitta:
          titolo: Il volo
          testo: |
            Un cinghiale ti prende alle gambe da dietro mentre guardi l'altro, e
            voli sopra la staccionata. Atterri sulla schiena nel fango del recinto
            vuoto, con un buco nei calzoni e uno nella coscia, e zoppichi fino al
            riparo dei dormitori.
      - testo: "Correre lungo il muro mentre giocano"
        descrizione: "Quando due cinghiali si mordono le orecchie, non guardano altro."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Lungo il muro
          testo: |
            Aspetti che due cinghiali si azzuffino nel mezzo del cortile e parti,
            con la schiena contro il muro e i piedi sui ciuffi d'erba, dove la
            terra non rimbomba. Uno dei quattro ti segue con gli occhi per tutto
            il tragitto senza muoversi, e dall'altra parte ti accorgi di avere le
            unghie piantate nei palmi.
          effetti: { profondita.capomozzo: 1 }
          imposta: { forte.cortile: 1 }
        fallimento:
          titolo: Le zanne
          testo: |
            Parti troppo presto, e un cinghiale ti carica di sbieco. Salti sulla
            staccionata in tempo per salvare le gambe ma non il polpaccio, che le
            zanne aprono attraverso lo stivale. Resti appollaiato lassù finché si
            stancano di aspettarti, e scendi dall'altra parte con lo stivale pieno
            di sangue che fa un rumore molle a ogni passo.
          effetti: { ferite: 0.5 }
      - testo: "Fischiare come gli orchi"
        descrizione: "Sono bestie addestrate, e chi le addestra usa sempre gli stessi due o tre suoni."
        prova: { attributo: sociale, abilita: [addestrare-animali, intimidire], difficolta: Media }
        successo:
          titolo: Il fischio
          testo: |
            Ascolti i cinghiali finché senti il richiamo degli orchi, un fischio
            corto seguito da uno schiocco di lingua, e lo rifai uguale. I quattro
            si mettono in fila davanti a te aspettando la carne, e passi in mezzo
            a loro grattando il primo dietro l'orecchio, mentre lui ti spinge la
            mano con il muso per averne ancora.
          effetti: { profondita.capomozzo: 1 }
          imposta: { forte.cortile: 1 }
          pe: { addestrare-animali: 5 }
        fallimento:
          titolo: Lo schiocco sbagliato
          testo: |
            Fai un fischio che ti sembra quello degli orchi, ma deve voler dire
            un'altra cosa, perché i cinghiali ti caricano. Ti butti dietro un
            abbeveratoio di pietra e la prima zanna ti graffia l'avambraccio, e
            resti rannicchiato lì finché tornano a prendersela con il capanno.
          effetti: { ferite: 0.5 }
      - testo: "Passare dietro il capanno, nel fango"
        descrizione: "Fra il capanno e la palizzata c'è un passaggio stretto dove i cinghiali non entrano."
        costo: 2
        esito:
          titolo: Il fango
          testo: |
            Ti infili nel passaggio fra il capanno e la palizzata, con il fango
            che ti arriva alle caviglie e puzza di letame. Dall'altra parte delle
            assi qualcosa di grosso ti sente e scalcia contro la parete a un palmo
            dalla tua testa, e ne esci coperto di fango, con un orecchio che
            fischia.
          effetti: { profondita.capomozzo: 1, tormento: 1 }
          imposta: { forte.cortile: 1 }

  - id: capomozzo-cappella
    immagine: bestiario/orco-sacerdote-guerriero
    titolo: La chiesa senza tetto
    sommario: "Una chiesa di pietra più vecchia degli orchi, dove un vecchio orco insegna ai giovani una litania che non capiscono."
    luogo: Capomozzo, la chiesa in cima all'isola
    area: capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 2, profondita.capomozzo >= 2, profondita.capomozzo <= 3]
    testo: |
      In cima all'isola, dietro la sala del trono, la chiesa di pietra
      grigia ha una vela di nave tesa fra i muri al posto del tetto. Del
      bassorilievo sull'altare, preso a colpi di mazza, restano due piedi
      d'uccello e il bordo di un'ala.

      {origine accolito-del-velo} Al Velo ti hanno insegnato i nomi di molte
      cose sacre, nessuna con i piedi d'uccello.

      Davanti all'altare un vecchio orco con la faccia dipinta di bianco
      recita una litania che sei giovani in ginocchio ripetono sbagliando
      sempre le stesse parole. Le parole non sono orchesche, e ti si rizzano
      i peli delle braccia.
    opzioni:
      - testo: "Ascoltare le parole della litania"
        descrizione: "Gli orchi le ripetono a memoria. Chi le ha scritte, invece, sapeva bene quello che diceva."
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: La Madre che cova
          testo: |
            Ti accucci dietro una colonna e ascolti. La litania è incisa anche sul
            muro, in una lingua antica che conosci quanto basta per seguirne il
            senso. È una preghiera alla Regina delle Ali Spezzate, la Madre che
            cova, perché scelga un figlio fra quelli che la servono e gli dia la
            sua voce. *Questi orchi pregano lei, e non lo sanno.* Ti allontani
            lungo il muro con la bocca secca.
          effetti: { profondita.capomozzo: 1, informazioni.segreto: 0.5 }
          imposta: { forte.chiesa: 1 }
        fallimento:
          titolo: La cadenza
          testo: |
            Dopo un po' ti accorgi che stai ripetendo la litania anche tu,
            sottovoce, con la stessa cadenza degli orchi, e ti tappi la bocca con
            la mano. Il vecchio si interrompe e gira la testa verso la tua
            colonna, e tu resti immobile finché riprende. Esci dalla chiesa
            all'indietro, e la cadenza ti resta in testa fino a sera.
          effetti: { tormento: 1 }
      - testo: "Inginocchiarti in fondo alla fila"
        descrizione: "Con il cappuccio in testa, in fondo alla chiesa, sei soltanto un'altra schiena curva."
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Media }
        successo:
          titolo: L'ultima fila
          testo: |
            Ti inginocchi in fondo alla fila con il cappuccio sulla testa e muovi
            le labbra quando le muovono gli altri. Il giovane orco accanto a te
            sbaglia una parola e tu sbagli la stessa, e lui ti fa un mezzo sorriso
            complice con le zanne. Quando la litania finisce se ne vanno tutti
            senza guardarti.
          effetti: { profondita.capomozzo: 1 }
          imposta: { forte.chiesa: 1 }
        fallimento:
          titolo: L'odore
          testo: |
            Il giovane orco accanto a te comincia ad annusare l'aria, e poi annusa
            te, con il naso a un dito dalla tua spalla. Si alza di scatto con un
            grido, e sei già fuori dalla porta quando una pietra lanciata dal
            vecchio ti prende fra le scapole. Corri piegato in avanti giù per la
            roccia fino ai dormitori.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare la fine della litania dietro i muri"
        descrizione: "La litania è lunga, e lassù il vento dal mare è freddo."
        costo: 2
        esito:
          titolo: Il vento
          testo: |
            Ti rannicchi contro il muro esposto al mare e aspetti per un'ora
            intera. Le parole passano attraverso le pietre una alla volta, e
            quando gli orchi escono hai le mani viola e una litania che ti torna
            in bocca appena smetti di pensare ad altro.
          effetti: { profondita.capomozzo: 1, tormento: 1 }
          imposta: { forte.chiesa: 1 }

  # 3 · dietro l'altare, solo se in questa visita sei passato dalla chiesa
  - id: capomozzo-scala
    immagine: ambientazione/capomozzo
    titolo: La scala nella roccia
    sommario: "Dietro l'altare una scala nella roccia scende nell'isola, illuminata per chi al buio non ci vede."
    luogo: Capomozzo, la scala sotto la chiesa
    area: capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 2, profondita.capomozzo == 3, forte.chiesa == 1]
    testo: |
      Dietro l'altare, coperta da una pelle di cinghiale inchiodata allo
      stipite, c'è una porta bassa, e oltre la porta una scala scavata nella
      roccia scende a spirale dentro l'isola. Ogni dieci gradini c'è una
      lanterna, ma sono accese soltanto quelle dei primi due giri. Gli orchi
      vedono al buio, quindi le ha appese qualcun altro, e su una il vetro
      rotto è stato riparato con la cera e con una pagina di libro.

      Dal fondo sale un'aria fredda che sa di mare, e con l'aria arriva a
      tratti una risata di donna.
    opzioni:
      - testo: "Scendere i primi giri ad ascoltare"
        descrizione: "Fin dove arrivano le lanterne accese, e non un gradino di più."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il rumore di sotto
          testo: |
            Scendi due giri di scala con la schiena contro il muro, contando i
            gradini. Al terzo le lanterne sono spente, e dal buio arrivano una
            risata di donna e un tintinnio di stoviglie, come in una cucina
            all'ora di cena. Più sotto ancora c'è un rumore lento e regolare che
            ti arriva nei piedi prima che nelle orecchie.
          effetti: { profondita.capomozzo: 1 }
        fallimento:
          titolo: La lanterna
          testo: |
            Al secondo giro sfiori una lanterna con la spalla, e il vetro sbatte
            contro la roccia con un rumore che scende per tutta la scala, e da
            sotto la risata si ferma. Risali di corsa sui gradini consumati e
            batti il ginocchio contro uno spigolo, e ti fermi soltanto dietro
            l'altare ad ascoltare se qualcuno sale.
          effetti: { ferite: 0.5 }
      - testo: "Studiare le lanterne"
        descrizione: "Qualcuno sale ad accenderle e a spegnerle. Sapere come lo fa può tornare utile."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Gli stoppini
          testo: |
            Lo stoppino di una lanterna spenta è stato spento da poche ore e
            tagliato dritto con le forbici, cosa che gli orchi non fanno. A ogni
            gancio è annodato un nastrino bianco, sempre alla stessa altezza, come
            un segno per chi non conosce la strada, e seguendoli con gli occhi
            capisci che la spirale scende almeno tre piani sotto la chiesa.
          effetti: { profondita.capomozzo: 1 }
        fallimento:
          titolo: La cera
          testo: |
            Apri lo sportello della lanterna riparata e la cera calda ti cola
            sulle dita. La lasci andare di colpo, e la lanterna dondola sul gancio
            illuminando a scatti la scala sotto di te per chiunque stia guardando
            in su. Ti appiattisci contro la roccia finché la luce smette di
            oscillare.
          effetti: { ferite: 0.5 }
      - testo: "Nasconderti dietro la pelle di cinghiale e guardare chi passa"
        descrizione: "La porta è stretta, e chi passa ti sfiora."
        costo: 2
        esito:
          titolo: La maschera bianca
          testo: |
            Ti nascondi nell'angolo fra l'altare e la porta, dietro la pelle di
            cinghiale. In un'ora sale un orco con un secchio vuoto e scende una
            donna umana con una maschera bianca senza tratti e le scarpe di città,
            che si ferma a un palmo da te per sistemarsi la fibbia prima di
            sparire giù per la spirale.
          effetti: { profondita.capomozzo: 1, tormento: 1 }

  # ------------------------------------------------------------ Ombrafosca (C17–C18, non ripetibile)
  - id: ombrafosca-in-gabbia
    immagine: ambientazione/capomozzo
    titolo: Il cavallo in gabbia
    sommario: "Nel capanno inchiodato c'è un cavallo che ha già ammazzato due orchi, e accanto una gabbia piena di conigli."
    luogo: Capomozzo, i capanni in fondo al cortile
    area: capomozzo
    requisiti: [pista.capomozzo == 2, ombrafosca == 0, profondita.capomozzo >= 3, forte.cortile == 1]
    testo: |
      In fondo al cortile ci sono due capanni. In quello degli attrezzi c'è una gabbia
      di conigli ammucchiati dalla parte più lontana. L'altro ha la porta inchiodata e
      crepata dall'interno, e davanti ci sono due orchi morti con la testa schiacciata
      da qualcosa con gli zoccoli.

      Attraverso le fessure vedi un cavallo nero dai riflessi verdi e dagli occhi
      grigio argento, con un fumo leggero alle narici. Ha strappato a morsi le corde
      ed è magro da contargli le costole. Quando ti sente sbatte uno zoccolo così
      forte che la porta trema sui cardini.

      {magia Media} Il fumo non viene dai polmoni. Intorno a lui il Mana è caldo e
      mosso, come l'aria sopra una forgia.

      {cavalcare Difficile} Nessuno l'ha mai montato, ma tiene le orecchie girate
      verso di te per ascoltarti.

      *Ha fame, e i conigli sono per lui.* Fai un passo indietro senza volerlo.
    opzioni:
      - testo: "Parlargli piano e avvicinarti"
        descrizione: "Schiodare la porta e restare sulla soglia con le mani aperte, finché decide lui."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Difficile }
        successo:
          titolo: La mano sul muso
          testo: |
            Schiodi le assi, apri la porta di una spanna e resti sulla soglia a
            parlargli a voce bassa, senza dire niente di preciso. Il cavallo
            sbuffa fumo e scalcia due volte contro la parete, poi allunga il
            collo, ti annusa la mano e lascia che tu gli appoggi il palmo sul
            muso, caldo come una stufa.
          pe: { addestrare-animali: 5 }
          segue: ombrafosca-fuori-dalla-gabbia
        fallimento:
          titolo: Lo zoccolo
          testo: |
            Apri la porta di una spanna, e il cavallo ci mette contro il petto
            prima che tu abbia finito di parlare. La porta ti butta per terra e
            uno zoccolo ti pesta la mano. Riesci a richiudere e a puntellarla con
            la schiena, e resti seduto lì contro, con la mano gonfia, mentre lui
            scalcia dall'altra parte.
          effetti: { ferite: 1 }
      - testo: "Portargli i conigli e aspettare che mangi"
        descrizione: "Un animale affamato ascolta chi gli porta da mangiare. Questo, a quanto pare, mangia carne."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: I conigli
          testo: |
            Butti un coniglio dalla fessura più larga e il cavallo lo prende al
            volo, masticandolo con un rumore che ti fa voltare la faccia. Al terzo
            smette di scalciare, al quinto si lascia toccare il collo, e intanto
            vedi che le ferite sui garretti si sono già chiuse da sole. Quando
            schiodi la porta resta fermo ad aspettarti, con il muso sporco.
          pe: { natura: 5 }
          segue: ombrafosca-fuori-dalla-gabbia
        fallimento:
          titolo: La gabbia aperta
          testo: |
            Apri la gabbia e ne escono venti conigli tutti insieme, in mezzo al
            cortile, fra i piedi dei cinghiali che impazziscono. Il cavallo sente
            l'odore del sangue e sfonda un'asse della porta a un palmo dalla tua
            faccia, e una scheggia ti si pianta nella guancia.
          effetti: { ferite: 0.5 }
      - testo: "Parlargli nella lingua del Circolo"
        descrizione: "Le parole che il Circolo insegna ai bambini per le bestie arrivano anche a quelle che hanno fame."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La lingua delle bestie
          testo: |
            Appoggi la fronte alle assi e gli parli nella lingua del Circolo, con
            le parole che si usano per le bestie spaventate. Il fumo dalle narici
            si fa sottile e il suo occhio d'argento si accosta alla fessura a
            guardarti. Quando schiodi la porta abbassa la testa sulla tua spalla e
            ce la lascia appoggiata, come un'abitudine che avevate già.
          segue: ombrafosca-fuori-dalla-gabbia
        fallimento:
          titolo: La parola storta
          testo: |
            La parola per *calma* ti esce storta e diventa quella per *fuga*. Il
            cavallo scalcia le pareti fino a far saltare due chiodi della porta, e
            a te torna indietro tutta la sua paura in una volta, così forte che ti
            si piegano le ginocchia.
          effetti: { tormento: 1 }
      - testo: "Schiodare la porta e farti da parte"
        descrizione: "Lui vuole uscire. Basta trovarsi da un'altra parte quando succede."
        esito:
          titolo: Il cavallo nel cortile
          testo: |
            Togli l'ultima asse e ti butti di lato. Il cavallo esce al galoppo fra
            i cinghiali che si sparpagliano strillando e salta la palizzata dove è
            più bassa, mentre dalla torre la vedetta lo guarda passare con la
            bocca aperta. Nel trambusto ti allontani dal cortile senza che nessuno
            ti veda.
          imposta: { ombrafosca: 1 }
          effetti: { profondita.capomozzo: 1 }
      - testo: "Guardargli le ferite come al Circolo"
        descrizione: "Al Circolo si guarda prima dove hanno ferito una bestia legata, per capire da cosa si aspetta il colpo."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: I garretti
          testo: |
            Ti inginocchi davanti alla fessura più bassa. Ha i segni di una catena
            sui garretti e delle corde tirate dall'alto sul collo, e al Circolo
            dicevano che una bestia legata così ha paura delle mani che scendono.
            Apri la porta di una spanna e porgi il dorso della mano all'altezza
            del suo ginocchio, finché abbassa il muso e la annusa. Quando schiodi
            le ultime assi resta fermo ad aspettarti.
          pe: { addestrare-animali: 5 }
          segue: ombrafosca-fuori-dalla-gabbia
      - testo: "Sederti contro la porta, come nei recinti"
        descrizione: "Nei recinti di Ghoran hai imparato che cosa vuol dire essere guardati attraverso le assi."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza], difficolta: Media }
        successo:
          titolo: La schiena contro le assi
          testo: |
            Schiodi le assi e ti siedi con la schiena contro la porta e le mani in
            grembo, dove lui non le vede. A Ghoran, dall'altra parte delle assi, ti
            fidavi soltanto di chi non ti guardava. Il cavallo scalcia, e la porta
            ti batte contro la schiena sempre più piano, finché senti l'aria calda
            delle sue narici sul collo. Quando apri, resta dentro ad aspettare che
            esca prima tu.
          pe: { resistenza: 5 }
          segue: ombrafosca-fuori-dalla-gabbia
        fallimento:
          titolo: Il calcio alla schiena
          testo: |
            Ti siedi contro la porta con gli occhi sul cortile, e il cavallo
            aspetta che tu ti sia sistemato prima di tirare un calcio alto.
            Un'asse si spacca sopra di te e ti cade sulla nuca, e rotoli via a
            quattro zampe con la testa che rimbomba.
          effetti: { ferite: 1 }

  - id: ombrafosca-fuori-dalla-gabbia
    immagine: ambientazione/capomozzo
    titolo: Fuori dalla gabbia
    tipo: seguito
    luogo: Capomozzo, il cortile delle esercitazioni
    area: capomozzo
    testo: |
      Il cavallo esce adagio dal capanno e si ferma in mezzo al cortile con
      la testa alta. Da vicino è più grande di quanto sembrava, con una
      cicatrice fresca ma già asciutta sulla spalla e il pelo venuto via
      dove l'avevano legato. I cinghiali si sono ammucchiati nell'angolo più
      lontano, e dalla torre est una vedetta si sporge con le carte ancora
      in mano.

      Gira il collo verso di te e soffia, e il fumo ti arriva in faccia
      caldo, con un odore di brace. Non porta sella né briglie, e ti guarda
      come se adesso toccasse a te dire la prossima cosa.
    opzioni:
      - testo: "Tenerlo con te"
        descrizione: "Un cavallo così vale più di un forziere, se si lascia portare."
        costo: 0
        esito:
          titolo: Ombrafosca
          testo: |
            Gli passi una corda larga intorno al collo senza stringerla, e lui ti
            lascia fare. Lo porti fuori dalla palizzata e lo leghi fra gli scogli
            dove il ponte di corda tocca l'isola, e guardando il fumo che gli esce
            dalle narici gli dai un nome, Ombrafosca. Lui gira un orecchio verso
            di te quando lo dici, e lo tiene girato.
          imposta: { ombrafosca: 2 }
          effetti: { oggetto.ombrafosca: 1 }
      - testo: "Lasciarlo andare"
        descrizione: "Ha ucciso due orchi per uscire da lì. Forse si è guadagnato anche il resto."
        costo: 0
        esito:
          titolo: Il salto
          testo: |
            Ti fai da parte e gli indichi la palizzata con il braccio, sentendoti
            un po' ridicolo. Il cavallo ti guarda ancora un momento, poi
            attraversa il cortile al galoppo e salta la palizzata dove è più
            bassa, con un rumore di zoccoli che fa affacciare tutte e due le
            vedette. Quando smettono di guardare il punto dove è sparito, tu sei
            già lontano dal cortile.
          imposta: { ombrafosca: 1 }
          effetti: { profondita.capomozzo: 1 }

  # ------------------------------------------------------------ la tesoreria (C22–C24, non ripetibile)
  - id: la-tesoreria-di-balthog
    immagine: fazioni/tribu-capomozzo
    titolo: La camera del capotribù
    sommario: "La camera di Balthog, e accanto una latrina da cui arriva un filo d'aria che non dovrebbe esserci."
    luogo: Capomozzo, la camera del capotribù
    area: capomozzo
    requisiti: [pista.capomozzo == 2, tesoro.capomozzo == 0, profondita.capomozzo >= 4]
    testo: |
      La camera di Balthog sta dietro la sala riunioni. Sulla parete nord
      sono inchiodate decine di ferri di cavallo in file dritte come i libri
      di una biblioteca, e contro il muro est c'è una scrivania con le gambe
      intagliate, venuta dal salotto di qualche Casato, accanto a una sedia
      imbottita di stracci, l'unica cosa che sembri usata.

      {origine rampollo-dei-quartieri-alti} A una scrivania così ti facevano
      scrivere i biglietti di ringraziamento senza appoggiare i gomiti, e i
      segni degli stivali di un orco ti danno una soddisfazione segreta.

      Nell'angolo c'è un letto a baldacchino con le lenzuola nere di terra.
      Una porticina dà sulla latrina, e dalla sua parete di fondo arriva una
      corrente d'aria fredda che in una latrina non ci dovrebbe essere. *Qui
      dentro Balthog tiene qualcosa che non vuole far vedere.* Sul pavimento
      la terra è consumata in una riga dritta fino a quella parete.
    opzioni:
      - testo: "Cercare la chiave e la porta"
        descrizione: "Una porta segreta vuol dire un forziere, e un forziere vuol dire una chiave da qualche parte qui intorno."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La chiave sotto la sedia
          testo: |
            Trovi la chiave sotto la sedia e il forziere dietro un'asse della
            latrina, e lo apri con il braccio lontano dalla fessura. Fra le monete
            ci sono un giaco di maglia fine avvolto in una tunica di seta blu e un
            sacchetto con una collana d'oro e un simbolo sacro di platino del
            Grande Albero Rosso.

            {origine accolito-del-velo} Il simbolo lo soppesi come quelli
            dell'altare che lucidavi.
          effetti: { monete: 200, oggetto.giaco-di-balthog: 1, bottino.tunica-di-seta: 1, bottino.collana-d-oro: 1, bottino.simbolo-del-grande-albero: 1, tesoro.capomozzo: 1, racconto: 1 }
          pe: { percezione: 5 }
        fallimento:
          titolo: La lama nel coperchio
          testo: |
            Trovi la porta segreta seguendo la corrente d'aria, ma la chiave no, e
            provi il lucchetto con la punta del coltello. Al secondo giro una lama
            arrugginita esce da una fessura del coperchio e ti apre l'avambraccio
            dal polso al gomito, e il lucchetto tiene. Nella sala riunioni
            qualcuno trascina una sedia, e tu esci con il braccio stretto contro
            il petto.
          effetti: { ferite: 1 }
      - testo: "Sfondare il coperchio"
        descrizione: "Il coperchio è di assi vecchie, e un'ascia lo apre. Se dentro c'è una trappola, scatterà."
        esito:
          titolo: Il coperchio sfondato
          testo: |
            Sfondi il coperchio del forziere con un'ascia, e al terzo colpo ne
            scatta fuori una lama arrugginita che ti si pianta nella coscia. Fra
            le monete ci sono un giaco di maglia fine avvolto in una tunica di
            seta blu e un sacchetto con una collana d'oro e un simbolo sacro di
            platino del Grande Albero Rosso. La ferita ha già i bordi rossi di
            ruggine.
          effetti: { monete: 200, oggetto.giaco-di-balthog: 1, bottino.tunica-di-seta: 1, bottino.collana-d-oro: 1, bottino.simbolo-del-grande-albero: 1, tesoro.capomozzo: 1, ferite: 1.5 }
      - testo: "Cercare la trappola prima del tesoro"
        descrizione: "Sulle piattaforme insegnano a guardare un forziere prima dai bordi e poi dal lucchetto."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Facile }
        successo:
          titolo: Il cuneo nella fessura
          testo: |
            Prima di toccare il forziere ci giri intorno come nelle rovine, e
            pianti una scheggia nella fessura del coperchio. Quando giri la chiave
            trovata sotto la sedia qualcosa scatta e si inceppa contro la
            scheggia.

            Fra le monete ci sono un giaco di maglia fine avvolto in una tunica di
            seta blu e un sacchetto con una collana d'oro e un simbolo sacro di
            platino del Grande Albero Rosso.
          effetti: { monete: 200, oggetto.giaco-di-balthog: 1, bottino.tunica-di-seta: 1, bottino.collana-d-oro: 1, bottino.simbolo-del-grande-albero: 1, tesoro.capomozzo: 1, racconto: 1 }
          pe: { tecnologia: 5 }
        fallimento:
          titolo: La scheggia che non tiene
          testo: |
            Pianti una scheggia nella fessura del coperchio, ma il legno è marcio
            e si piega. La chiave non la trovi, e quando provi il lucchetto con la
            punta del coltello la lama arrugginita esce lo stesso e ti apre
            l'avambraccio, mentre il lucchetto tiene. Sulle piattaforme, a una
            recluta, per questo darebbero un turno di latrine.
          effetti: { ferite: 1 }
      - testo: "Pensare come un usuraio della Città Bassa"
        descrizione: "Nei vicoli chi presta a strozzo tiene la chiave dove si siede e la cassa dove va da solo."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Come uno strozzino
          testo: |
            Nei vicoli chi tiene i soldi degli altri non si fida delle tasche, e
            la chiave è sotto la sedia. Al forziere della latrina la giri con il
            braccio lontano dalla fessura, come gli strozzini.

            Fra le monete ci sono un giaco di maglia fine avvolto in una tunica di
            seta blu e un sacchetto con una collana d'oro e un simbolo sacro di
            platino del Grande Albero Rosso.
          effetti: { monete: 200, oggetto.giaco-di-balthog: 1, bottino.tunica-di-seta: 1, bottino.collana-d-oro: 1, bottino.simbolo-del-grande-albero: 1, tesoro.capomozzo: 1, racconto: 1 }
          pe: { conoscenze-della-strada: 5 }
        fallimento:
          titolo: Il materasso
          testo: |
            Sei sicuro che un capo tenga la chiave nel letto e rivolti il
            materasso da cima a fondo, ma ne esce soltanto terra. Trovi il
            forziere seguendo la corrente d'aria e provi il lucchetto con la punta
            del coltello, e al secondo giro una lama arrugginita ti apre
            l'avambraccio. Il lucchetto tiene, e dalla sala riunioni arriva il
            rumore di una sedia trascinata.
          effetti: { ferite: 1 }

  # ------------------------------------------------------------ il cuore · 2 → 3 (C19)
  - id: balthog-il-prescelto
    immagine: personaggi/balthog-il-prescelto
    titolo: Balthog il Prescelto
    sommario: "La sala del trono, con le mani mozzate ai pilastri e sul trono un orco senza una cicatrice."
    luogo: Capomozzo, la sala del trono
    area: capomozzo
    requisiti: [pista.capomozzo == 2, profondita.capomozzo >= 4]
    testo: |
      Nella sala del trono quattro pilastri irti di spuntoni reggono il
      soffitto annerito, e sugli spuntoni bassi sono infilzate mani mozzate,
      alcune secche come foglie e altre no. In fondo, su una pedana, c'è un
      trono coperto di pelli di cinghiale con un teschio di cavallo sullo
      schienale.

      Balthog il Prescelto ci siede sopra, con quattro orchi armati ai lati.
      Ha i lineamenti regolari, quasi belli per un orco, in tutto il corpo
      non ha una cicatrice e tiene le mani vuote appoggiate sulle ginocchia.

      «Fermo lì. Non ti sei ancora guadagnato il diritto di avvicinarti»
      dice a voce bassa. «So chi sei, macellaio di Qir-Azel. Hai ammazzato
      la mia gente, eppure non sei venuto fin qui per me. Sotto questa
      fortezza vive una donna, o qualcosa che ne ha preso la forma, con i
      capelli come il mercurio. Lei e i suoi incappucciati hanno provato a
      piegarmi. Io posso darti rifugio e i tesori di anni di razzie, e tu mi
      dici che cosa vuoi.»

      {ingannare Media} Dice che hanno provato a piegarlo, al passato, come
      uno che preferisce non sapere se ci sono riusciti.

      {origine fuggiasco-di-ghoran} Balthog parla piano, come i padroni a
      Ghoran quando non avevano bisogno di alzare la voce, e le spalle ti si
      curvano di un dito.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "Le mani vuote gli bastano. I quattro orchi ai lati del trono aspettano un suo cenno."
        combattimento: balthog
        vittoria:
          titolo: Il Prescelto
          testo: |
            Balthog scende dalla pedana e si mette in guardia con le mani aperte,
            e per un pezzo ogni tuo colpo trova soltanto aria. Poi sbaglia
            l'appoggio di un piede sulla pelle di cavallo davanti al trono, tu ci
            entri dentro, e quando cade contro un pilastro gli spuntoni fanno il
            resto. I quattro orchi scappano, e dietro il trono una tenda di pelle
            copre una scala che scende nella roccia.
          effetti: { pista.capomozzo: 1, racconto: 1 }
          imposta: { balthog: 1 }
          vai: sotto-capomozzo
        sconfitta:
          titolo: Scendi da lei
          testo: |
            Balthog ti prende il polso e ti manda a sbattere contro un pilastro,
            poi ti mette giù con un colpo solo sotto lo sterno e ti trascina per
            il collo della camicia fino alla tenda dietro il trono, dove una scala
            scende nel buio.

            «Scendi da lei, macellaio. Se torni su ti finisco io, se resti giù ti
            finisce lei.» Ti spinge, e rotoli per una rampa intera.
          effetti: { pista.capomozzo: 1, tormento: 1.5 }
          vai: sotto-capomozzo
      - testo: "Stare al gioco e aspettare che scenda dal trono"
        descrizione: "Sembra che voglia trattare, e per trattare dovrà scendere dal trono."
        prova: { attributo: sociale, abilita: [ingannare, galateo], difficolta: Difficile }
        successo:
          titolo: Il ginocchio
          testo: |
            Gli dici che vuoi la donna di sotto e che il resto si discute. Balthog
            scende dalla pedana e, quando il peso gli passa sulla gamba davanti,
            lo colpisci al ginocchio con il tacco. Cade contro un pilastro, il
            secondo colpo lo prende alla tempia e gli orchi scappano. Lo lasci
            vivo, con la sua prima cicatrice, e dietro il trono trovi una tenda di
            pelle sopra una scala.
          effetti: { pista.capomozzo: 1, racconto: 1 }
          pe: { ingannare: 5 }
          imposta: { balthog: 2 }
          vai: sotto-capomozzo
        fallimento:
          titolo: Troppo presto
          testo: |
            Gli guardi le ginocchia troppo presto, e Balthog se ne accorge. «Ti
            avevo avvertito. Non sei pronto a stare davanti a me» dice, e in un
            attimo è giù dalla pedana. Uno spuntone ti apre la spalla, e scappi
            dalla porta laterale verso la chiesa con gli orchi dietro, giù per la
            scala dietro l'altare, dove nessuno ti segue oltre le lanterne.
          effetti: { pista.capomozzo: 1, ferite: 2.5 }
          vai: sotto-capomozzo
      - testo: "Dirgli che lei lo sta usando"
        descrizione: "Le macchine della fortezza dovrebbero obbedire a lui. Forse è ora che si chieda a chi obbediscono davvero."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: Le macchine si girano
          testo: |
            Gli racconti del diario di Isvaro, dove è Aurenne a comandare gli
            orchi, e gli chiedi verso chi si girano le macchine dei trofei.
            Balthog si guarda le mani e manda via i suoi orchi.

            «Borgoth me l'aveva detto, e l'ho cacciato per questo. Porto via la
            mia gente prima che lei finisca di consumarla.» Esce con una pelliccia
            sulle spalle, e dietro il trono resta la scala che scende.
          effetti: { pista.capomozzo: 1, racconto: 1 }
          pe: { empatia: 5 }
          vai: sotto-capomozzo
        fallimento:
          titolo: Il palmo aperto
          testo: |
            Gli racconti del diario di Isvaro, e Balthog ti ascolta con la
            pazienza di un maestro davanti a un allievo lento, poi ride piano.
            «Anche Borgoth parlava così, e adesso dorme nei rovi.» Ti colpisce una
            volta sola al fianco, con la mano aperta, e quando torni in te sei
            carponi fuori dalla porta laterale. Ti trascini fino alla chiesa e giù
            per la scala dietro l'altare.
          effetti: { pista.capomozzo: 1, ferite: 2 }
          vai: sotto-capomozzo
      - testo: "Ripetergli quello che ti ha detto Borgoth"
        descrizione: "Borgoth conosceva Balthog da prima che arrivasse lei, e fra i rovi ti ha detto parecchio."
        requisiti: [borgoth >= 1, borgoth <= 2]
        prova: { attributo: sociale, abilita: [empatia, persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Le parole di Borgoth
          testo: |
            Gli racconti che secondo Borgoth l'attacco a Qir-Azel l'ha voluto lei
            e Balthog fa quello che lei dice. Lui stringe i braccioli fino a farli
            scricchiolare.

            «Borgoth parla troppo, e quasi sempre ha ragione» dice, e manda fuori
            i suoi orchi. «Tienila tu, la fortezza.» Se ne va con una pelliccia
            sulle spalle, e dietro il trono resta la scala che scende.
          effetti: { pista.capomozzo: 1, racconto: 1 }
          pe: { empatia: 5 }
          vai: sotto-capomozzo
        fallimento:
          titolo: Le storie di Borgoth
          testo: |
            Fai il nome di Borgoth, e la faccia di Balthog si chiude come una
            porta. «Borgoth racconta storie a chiunque, e adesso ne ha trovato uno
            che gli crede.» Scende dalla pedana e ti colpisce al petto con il
            palmo aperto, e quando ti rialzi ti indica con il mento la porta
            laterale, quella che porta alla chiesa e alla scala nella roccia.
          effetti: { pista.capomozzo: 1, ferite: 2 }
          vai: sotto-capomozzo
      - testo: "Tornare indietro e scendere dalla scala della chiesa"
        descrizione: "Dietro l'altare della chiesa senza tetto c'è un'altra scala che porta sotto la fortezza."
        esito:
          titolo: La strada lunga
          testo: |
            Fai un passo indietro e poi un altro, e Balthog ti guarda andare senza
            alzarsi. «Va' pure da lei, macellaio. Ci arrivi lo stesso.» Fuori
            corri fino alla chiesa senza tetto e scendi la scala dietro l'altare,
            oltre le lanterne accese e poi nel buio, alzando ogni tanto gli occhi
            alla scala vuota sopra di te.
          effetti: { pista.capomozzo: 1, tormento: 1.5 }
          vai: sotto-capomozzo
      - testo: "Offrirgli un patto con le formule dei Casati"
        descrizione: "Nei Quartieri Alti un patto si chiude in piedi stringendosi la mano, e per stringerla lui deve scendere."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: La mano tesa
          testo: |
            Gli parli con le formule dei patti fra Casati e gli tendi la mano.
            Balthog scende a stringertela, e quando il peso gli passa sulla gamba
            davanti lo colpisci al ginocchio con il tacco. Cade contro un
            pilastro, il secondo colpo lo prende alla tempia e gli orchi scappano.
            Lo lasci vivo, con la sua prima cicatrice, e dietro il trono trovi una
            tenda di pelle sopra una scala.
          effetti: { pista.capomozzo: 1, racconto: 1 }
          pe: { galateo: 5 }
          imposta: { balthog: 2 }
          vai: sotto-capomozzo
        fallimento:
          titolo: Una formula di troppo
          testo: |
            Le formule ti escono bene, ma una di troppo, e Balthog invece di
            stringerti la mano te la torce dietro la schiena. «Quando parlate così
            lungo, voi di città, state prendendo tempo» dice, e ti spinge contro
            un pilastro, dove uno spuntone ti apre la spalla. Scappi verso la
            chiesa e giù per la scala dietro l'altare, dove nessuno ti segue oltre
            le lanterne.
          effetti: { pista.capomozzo: 1, ferite: 2.5 }
          vai: sotto-capomozzo
      - testo: "Raccontargli dei cristalli del Festival"
        descrizione: "Il giorno della razzia i cristalli dell'Accademia hanno vibrato insieme, poco prima che le macchine scendessero dai tetti."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: Il segnale
          testo: |
            Gli racconti dei cristalli del banco che vibravano prima che le sagome
            calassero, e gli spieghi che un cristallo risponde solo a un altro
            cristallo e i suoi orchi non ne portano. Balthog si guarda le mani e
            manda via i suoi orchi.

            «Porto via la mia gente prima che lei finisca di consumarla.» Esce con
            una pelliccia sulle spalle, e dietro il trono resta la scala che
            scende.
          effetti: { pista.capomozzo: 1, racconto: 1 }
          pe: { tecnologia: 5 }
          vai: sotto-capomozzo
        fallimento:
          titolo: La lezione
          testo: |
            Cominci dai cristalli e ti perdi nelle risonanze, con parole d'aula
            che qui non vogliono dire niente. «Le pietre che cantano sono roba
            vostra» dice Balthog, e ti colpisce una volta sola al fianco, con la
            mano aperta. Quando torni in te sei carponi fuori dalla porta
            laterale, e ti trascini fino alla chiesa e giù per la scala dietro
            l'altare.
          effetti: { pista.capomozzo: 1, ferite: 2 }
          vai: sotto-capomozzo
      - testo: "Fargli i conti come a un socio"
        descrizione: "Sui Ponti si vede subito chi in un affare ci mette i morti, e Balthog ci ha messo i morti."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: I conti
          testo: |
            Gli fai i conti come al banco. I morti della razzia ce li ha messi
            lui, mentre lei se ne sta di sotto a ridere. Poi gli chiedi chi ha
            incassato. Balthog si guarda le mani e manda via i suoi orchi.

            «Porto via la mia gente prima che lei finisca di consumarla.» Esce con
            una pelliccia sulle spalle, e dietro il trono resta la scala che
            scende.
          effetti: { pista.capomozzo: 1, racconto: 1 }
          pe: { politica-ed-economia: 5 }
          vai: sotto-capomozzo
        fallimento:
          titolo: Il prezzo sbagliato
          testo: |
            Sbagli la prima voce dei conti, e Balthog se ne accorge prima di te.
            «Mi parli come a un cliente da spennare» dice ridendo piano, e ti
            colpisce una volta sola al fianco, con la mano aperta. Quando la vista
            ti torna sei carponi fuori dalla porta laterale, e ti trascini fino
            alla chiesa e giù per la scala dietro l'altare.
          effetti: { pista.capomozzo: 1, ferite: 2 }
          vai: sotto-capomozzo
