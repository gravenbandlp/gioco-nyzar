# La pista "Sotto la pelle di Qir-Azel" (pista.pelle), passi 3 → 7: l'Atto II che il verbale non ha (le tre
# casse degli Scuri e il carceriere) e l'Atto III con l'epilogo (il Municipio all'alba, l'assalto alla
# Pignatta Grassa, Galdrick e Vesh, la città dopo Vesh).
storylet:
  # ------------------------------------------------------------ 3 · la bisca di Nihali
  - id: la-bisca-di-nihali
    presso: orlo-dei-rottami
    immagine: personaggi/nihali-cuzan
    titolo: La bisca nella cisterna
    sommario: "Ogni settimana un uomo dei Malgrani perde a carte all'Orlo dei Rottami, sempre contro lo stesso baro."
    luogo: Orlo dei Rottami, a notte fonda
    area: citta-bassa
    requisiti: [pista.pelle == 3, colpo.bisca == 0]
    testo: |
      In fondo alla discesa dell'Orlo dei Rottami, dove le lamiere finiscono
      e comincia il vuoto, c'è una cisterna dei Precursori rovesciata sul
      fianco, grande quanto una casa. Qualcuno ci ha tagliato una porta con la
      fiamma, e di notte da quella porta escono luce gialla e fumo di pipa.
      Nei conti di Ottone la cisterna compare ogni settimana alla voce
      *perdite al gioco*, sempre per la stessa cifra e sempre contro le stesse
      iniziali, che all'Orlo tutti sanno leggere come Nihali Cuzan.

      Ti fermi dietro un mucchio di ruote spaccate. Dentro ci sono quattro
      tavoli e una dozzina di giocatori, e in fondo, su una cassa di ferro
      inchiodata al pavimento, siede Nihali con i suoi vestiti di seconda mano
      stirati a puntino. È alto e magro, con la faccia gialla di un uomo malato
      di stomaco. Tossisce nel fazzoletto ricamato, guarda quello che ha sputato
      e lo ripiega dal lato pulito. Ha le mani più curate di tutta la Città
      Bassa.

      {conoscenze-della-strada Facile} Mani così all'Orlo non lavorano. Le
      tiene morbide per sentire il bordo delle carte, e lo sa tutta la
      cisterna, che ci gioca lo stesso perché perdere da lui costa meno che
      vincere da un altro.

      {medicina Media} Quella tosse viene da sotto lo sterno, e il giallo
      della faccia viene dal fegato. Il fumo di pipa gli fa male, e lui lo
      sa benissimo.

      Un ragazzino scalzo ti passa accanto correndo su per la discesa, verso
      le luci della Pignatta, e non si volta. *Questo l'ho visto un'ora fa
      alla baracca di Grusk, a fingere di frugare.* Sulla porta della
      cisterna l'uomo di guardia spegne la lanterna con due dita e rientra.
    opzioni:
      - testo: "Sederti al tavolo di Nihali"
        descrizione: "Nihali bara da vent'anni. Per batterlo bisogna accorgersi di come lo fa, e farglielo capire senza dirlo."
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il mazzo che zoppica
          testo: |
            Ti siedi davanti a lui e perdi tre mani di fila, piano, con la
            faccia di uno che ha appena venduto il mulo, finché non vedi il
            trucco. Nihali tiene appena piegato un angolo delle carte buone e
            lo raddrizza con il pollice mentre distribuisce. Alla quarta mano
            la carta la raddrizzi tu prima di lui, e glielo lasci vedere.

            {ingannare Media} Per un baro di vent'anni essere scoperto da uno
            sconosciuto è quasi un complimento, e lui lo accoglie senza
            rancore.

            Nihali si toglie la pipa di bocca. «Vincere mi annoia» dice con la
            voce impastata di catarro. «Far credere di aver perso è più
            divertente, però stanotte non mi diverto per niente.» Ti spinge
            davanti la posta e se ne va dalla porta sul retro, su per le
            lamiere verso la Pignatta. La cassa di ferro è aperta e mezza
            vuota. Il resto lo porti alla Caserma, tutto tranne la posta della
            quarta mano.
          imposta: { colpo.bisca: 1 }
          effetti: { monete: 25, colpi.scuri: 1, rep.scuri: -1 }
        fallimento:
          titolo: Il fazzoletto ricamato
          testo: |
            Perdi tre mani di fila senza vedere il trucco, e alla quarta provi
            a barare tu, con le dita che sudano sul cartone. Nihali ti guarda
            le mani con una specie di tristezza professionale e tossisce nel
            fazzoletto, poi fa un cenno all'uomo della porta. Se ne va dal
            retro con la pipa in bocca, verso le luci della Pignatta.

            Nella cisterna scoppia una rissa per la posta. Quando l'uomo della
            porta smette di colpirti la cassa di ferro è aperta, e dentro
            restano soltanto le monete che i giocatori non hanno fatto in tempo
            ad arraffare. Le porti su alla Caserma con un occhio che si gonfia
            e pulsa a ogni passo, e mezzo Orlo ti vede passare.
          imposta: { colpo.bisca: 1 }
          effetti: { ferite: 1, sospetto: 0.5, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Entrare dalla parte del vuoto"
        descrizione: "La cisterna sporge oltre l'orlo dell'altopiano, e sul fondo ha una fessura larga quanto una spalla. Sotto c'è la Cicatrice."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Dalla parte del vuoto
          testo: |
            Ti cali lungo le lamiere fino al ventre della cisterna, con il
            vento della Cicatrice che ti gonfia la giubba e lo stomaco che ti
            sale in gola, e ti infili nella fessura con la pancia contro il
            ferro. Sbuchi al buio dietro la cassa di Nihali. Il lucchetto è
            aperto e la cassa è già mezza vuota, ma quello che resta entra in
            due sacche.

            {furtivita Facile} I giocatori guardano le carte e l'uomo della
            porta guarda la porta. Il retro di una bisca è il posto meno
            sorvegliato della città.

            Quando la sala si accorge della cassa sei già sulla discesa. Senti
            Nihali tossire e imprecare dietro di te, poi lo vedi correre su per
            le lamiere verso la Pignatta, con le mani curate tenute in alto
            per non sporcarle.
          imposta: { colpo.bisca: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
        fallimento:
          titolo: La fessura
          testo: |
            La fessura è più stretta di quanto sembrava, e ci resti incastrato
            con le gambe nel vuoto per il tempo di dieci respiri, che conti uno
            per uno perché altrimenti penseresti a quello che c'è sotto. Quando
            finalmente entri ti sei scorticato un fianco, e hai fatto abbastanza
            rumore da svegliare tutto l'Orlo. Arraffi dalla cassa quello che
            puoi mentre l'uomo della porta ti cerca con la lanterna.

            Esci dalla porta principale, perché un'altra strada non c'è, e la
            sala intera ti guarda passare, qualcuno con le carte ancora a
            ventaglio in mano. Nihali è già sparito su per la discesa verso la
            Pignatta. Le sacche sono leggere, e la cisterna dei Precursori da
            stanotte resta al buio.
          imposta: { colpo.bisca: 1 }
          effetti: { ferite: 1, sospetto: 0.5, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Entrare dalla porta"
        descrizione: "Un uomo alla porta e Nihali sulla cassa. I giocatori, quando volano i pugni, guardano da un'altra parte."
        combattimento: la-bisca-di-nihali
        vittoria:
          titolo: La cassa di ferro
          testo: |
            L'uomo della porta finisce contro un tavolo, e i giocatori si
            appiattiscono contro le pareti della cisterna con le carte ancora
            in mano, attenti a non mostrarle nemmeno adesso. Nihali ti sfila
            qualcosa dalla tasca mentre lo spingi via, e quando te ne accorgi è
            già fuori dal retro, piegato in due dalla tosse, a correre su per
            le lamiere verso la Pignatta.

            La cassa è aperta e mezza vuota. Il resto lo porti alla Caserma, e
            solo per strada, con le nocche che ancora ti bruciano, ti accorgi
            che ti ha preso il fazzoletto. Nella tasca, al posto del tuo, c'è
            il suo fazzoletto ricamato, ripiegato dal lato pulito.
          imposta: { colpo.bisca: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, rep.caserma: 0.5 }
        sconfitta:
          titolo: Le carte per terra
          testo: |
            Ti ritrovi sul pavimento di ferro della cisterna con le carte
            sparse intorno alla faccia, e la più vicina è un fante che ti
            guarda storto. L'uomo della porta ti tiene giù con un ginocchio
            finché Nihali non è uscito dal retro verso la Pignatta, poi ti
            lascia andare e scappa anche lui. Fra i giocatori qualcuno ha già
            allungato le mani sulla cassa.

            Ne salvi quello che puoi, contando le monete con le dita che non ti
            obbediscono, e la mattina dopo la Caserma inchioda un'asse sulla
            porta della cisterna. Per una settimana, all'Orlo, chi ti incontra
            ti guarda l'occhio nero e poi la porta inchiodata.
          imposta: { colpo.bisca: 1 }
          effetti: { sospetto: 0.5, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Aspettare l'uomo dei Malgrani"
        descrizione: "Stanotte è il giorno segnato nei conti di Ottone. Prima o poi arriva qualcuno con una borsa da perdere."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Le perdite al gioco
          testo: |
            L'uomo dei Malgrani arriva dopo la mezzanotte, con il mantello
            girato al rovescio per nascondere l'alloro ricamato sul petto. Le
            cuciture al rovescio luccicano sotto la lanterna più dell'alloro.
            Si siede al tavolo di Nihali e perde una borsa intera in sei mani,
            senza guardare le carte.

            {politica-ed-economia Media} Chi perde senza guardare le carte sta
            pagando. I Malgrani passano le monete agli Scuri attraverso un
            tavolo da gioco, così nei libri diventano un vizio e non un debito.

            Quando esce lo aspetti in cima alla discesa e gli dici la cifra
            prima che la dica lui. Diventa bianco, e ti consegna la borsa senza
            discutere.

            All'alba i mercenari di Ghoran che Galdrick si è portato in città
            sfondano la porta della cisterna. La cassa è mezza vuota e Nihali è
            già alla Pignatta, però la borsa dei Malgrani ce l'hai tu, con il
            sigillo ancora intatto.
          imposta: { colpo.bisca: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5, rep.malgrani: -0.5 }
        fallimento:
          titolo: Il mantello al rovescio
          testo: |
            L'uomo dei Malgrani arriva dopo la mezzanotte con il mantello
            girato al rovescio. Ti vede prima che tu veda lui, e torna indietro
            a passo svelto. Dieci minuti dopo la luce della cisterna si spegne.
            All'alba i mercenari di Ghoran che Galdrick si è portato in città
            sfondano la porta e trovano i tavoli e la cassa di ferro, con
            dentro il fondo di una settimana.

            Nihali è sparito verso la Pignatta. Tu hai passato la notte
            accucciato fra le ruote spaccate, con un raggio piantato nel fianco
            che a un certo punto hai smesso di sentire, e fino a sera ti porti
            dietro le ginocchia rigide.

            {resistenza Facile fallita} Le ginocchia, a dire il vero, ti
            mandano un conto preciso per ogni ora passata lì sotto, e non
            accettano trattative.
          imposta: { colpo.bisca: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5 }

  # ------------------------------------------------------------ 3 · il retrobottega di Gramm
  - id: il-retrobottega-di-gramm
    presso: mercato-dei-nodi
    immagine: personaggi/nestor-gramm
    titolo: Il vicolo della Dispensa
    sommario: "Nei conti di Ottone la Dispensa di Gramm vende infusi per la signora a prezzi da gioielliere."
    luogo: Mercato dei Nodi, il vicolo dietro la Dispensa di Gramm
    area: ponti-sospesi
    requisiti: [pista.pelle == 3, colpo.dispensa == 0]
    testo: |
      Nei conti di Ottone la Dispensa di Gramm compare ogni mese alla voce
      *infusi per la signora*, con cifre che un erborista onesto non incassa in
      un anno. Galdrick l'ha ricopiata sul taccuino e l'ha sottolineata due
      volte. «Gramm prepara i veleni per gli Scuri da prima che io fossi
      sceriffo» ha detto. «Le gocce per dormire della signora Malgrani sono
      l'unica cosa pulita che gli abbiano mai pagato.»

      Il vicolo dietro la Dispensa è una passerella di tavole fra due
      piattaforme del Mercato dei Nodi, così stretta che i panni stesi ti
      strusciano sulla faccia, e uno di questi è una camicia da bambino con
      le maniche rattoppate di due colori diversi. La porta sul retro è
      bassa, con una campanella che suona soltanto per chi sa dove tirare la
      corda. Stanotte la corda è stata tagliata, e dalle fessure della porta
      esce odore di carta bruciata insieme a un odore dolce che ti fa
      lacrimare gli occhi.

      {natura Media} L'odore dolce viene da fiori da sonno messi a bollire,
      e gli occhi ti lacrimano perché qualcuno ha esagerato con la dose, per
      cui conviene respirarne il meno possibile.

      Dentro qualcuno si muove piano e posa vetri sul legno, uno alla volta.
      *Sta facendo i bagagli, e scommetto che li fa in ordine alfabetico.*
      Sotto i tuoi piedi il Ponte delle Mille Corde vibra al passaggio di un
      carro, e di là dalla porta le boccette tintinnano tutte insieme.

      {furtivita Facile} Un uomo che fa i bagagli in silenzio ascolta il
      silenzio degli altri. Le tavole del vicolo cigolano, quindi cammina
      sui bordi, dove sono inchiodate.
    opzioni:
      - testo: "Bussare come un cliente del vicolo"
        descrizione: "Nestor serve dal retro chi sa chiedere. Bisogna sembrare uno di quelli, con una richiesta precisa e la voce giusta."
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Una richiesta
          immagine: personaggi/nestor-gramm
          testo: |
            Bussi tre volte piano e chiedi attraverso la porta qualcosa per un
            cane che abbaia troppo. Nestor apre di una spanna. È basso e tozzo,
            con il grembiule grigio bruciato sul davanti e uno straccio nella
            tasca destra, e ha gli occhi sfocati perché da mesi beve le sue
            stesse pozioni. «Te lo dico io quando la tua domanda è una
            richiesta» dice, e ti fa entrare, controllando il vicolo alle tue
            spalle con un occhio solo.

            {medicina Facile} Le pupille sono larghe come monete anche alla luce
            della stufa. Assaggia tutto quello che vende, e da un pezzo non ne
            assaggia più la metà.

            Nel retro le casse sono chiuse e la stufa è piena di carta nera.
            Mentre conta le gocce in una fiala, a labbra strette, gli posi una
            mano sul polso. Nestor guarda prima la mano e poi la tua faccia, e
            lascia cadere la fiala. Scappa dal vicolo con un passo corto e
            storto, giù verso la Pignatta, e sotto il banco resta la cassetta
            con le monete di un mese.
          imposta: { colpo.dispensa: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, rep.caserma: 0.5 }
        fallimento:
          titolo: La campanella
          testo: |
            Chiedi qualcosa per un cane che abbaia troppo, ma lo chiedi con la
            voce di uno che il cane non ce l'ha e non l'ha mai voluto. Dall'altra
            parte Nestor resta zitto a lungo. Poi senti il chiavistello di una
            seconda porta, quella che dà sul ponte.

            Quando sfondi la porta del vicolo il retro è vuoto e la stufa fuma.
            Fra i vetri rovesciati una boccetta si è rotta, e il vapore dolce ti
            prende alla gola e ti fa girare la stanza intorno. Esci tossendo con
            la cassetta delle monete sotto il braccio, mentre in fondo al ponte
            una sagoma bassa e tozza scende verso la Pignatta.
          imposta: { colpo.dispensa: 1 }
          effetti: { ferite: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Leggere gli scaffali dalla finestrella"
        descrizione: "Sopra la porta c'è una finestrella. Chi conosce le erbe capisce che cosa sta mettendo in salvo, e quanto vale in anni di cella."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Le gocce della signora
          testo: |
            Ti alzi in punta di piedi, con il polpaccio che protesta, e dalla
            finestrella vedi gli scaffali svuotati a metà. Riconosci la radice
            nera che ferma il cuore nel sonno, e accanto le gocce per dormire
            dei Malgrani, in una bottiglia con l'alloro dipinto a mano da
            qualcuno che di alloro ne aveva visto poco. Chiami Nestor per nome e
            gli elenchi attraverso la porta quello che ha nella cassa, con gli
            anni di cella che vale ogni boccetta.

            Di là il rumore dei vetri si ferma. Poi si apre una seconda porta
            sul ponte, e un passo corto e storto si allontana verso la
            Pignatta. Nel retro trovi la cassetta con le monete di un mese e il
            quaderno dei clienti del vicolo, scritto in una grafia minuta e
            pignola.
          imposta: { colpo.dispensa: 1 }
          pe: { medicina: 5 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, informazioni.segreto: 1 }
        fallimento:
          titolo: Il vapore dolce
          testo: |
            Dalla finestrella vedi gli scaffali, ma le etichette sono scritte
            in un codice da speziale che non conosci.

            {accademiche Media fallita} Sono abbreviazioni, e una volta le
            sapevi. Adesso ti tornano in mente soltanto le parole di una
            filastrocca sulle erbe, e nessuna è sulle etichette.

            Mentre cerchi di leggerle Nestor alza gli occhi e ti vede. Rovescia
            una boccetta sulla stufa, e dalla finestrella esce un vapore dolce
            che ti chiude la gola.

            Quando smetti di tossire sfondi la porta. Il retro è vuoto, e la
            seconda porta, quella sul ponte, sbatte ancora contro lo stipite
            dalla parte della Pignatta. Sotto il banco c'è la cassetta con le
            monete di un mese. La porti alla Caserma con le lacrime agli occhi,
            e la gola ti brucia fino a sera.
          imposta: { colpo.dispensa: 1 }
          effetti: { ferite: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Sfondare la porta"
        descrizione: "Dentro c'è un erborista con una boccetta verde e un ragazzo degli Scuri con un coltello. Lo spazio per muoversi è poco per tutti."
        combattimento: il-retrobottega-di-gramm
        vittoria:
          titolo: Vetri
          testo: |
            La porta cede alla seconda spallata, e la spalla ti ricorda per un
            bel pezzo che la porta era di quercia. Il ragazzo degli Scuri ti
            viene addosso con un coltello da macellaio, troppo grande per la
            sua mano, e lo mandi contro gli scaffali in una pioggia di vetri.
            Nestor ti lancia la boccetta verde e sbaglia di un palmo. Il muro
            dietro di te comincia a fumare.

            Quando il fumo si dirada sono spariti tutti e due dalla porta sul
            ponte, giù verso la Pignatta. Nel retro restano la stufa piena di
            carta bruciata e la cassetta con le monete di un mese. Dal muro,
            nel punto dove ha colpito la boccetta, cola un intonaco verde che
            non smette di sfrigolare.
          imposta: { colpo.dispensa: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, rep.caserma: 0.5 }
        sconfitta:
          titolo: La boccetta verde
          testo: |
            La boccetta verde ti si rompe sul petto. Il vapore ti piega in due,
            con i polmoni che si chiudono come pugni, e il ragazzo degli Scuri
            ti finisce con l'impugnatura del coltello. Ti risvegli sul
            pavimento del retro con la faccia in una pozza di tintura di malva,
            accanto alla stufa ormai fredda.

            Nestor è scappato verso la Pignatta con il ragazzo e con i
            quaderni. Nella fretta però ha dimenticato la cassetta delle monete,
            che teneva sotto un'asse del pavimento, e l'asse adesso è sollevata
            a un palmo dalla tua mano. La porti alla Caserma con il passo
            incerto, e per due giorni tutto quello che mangi ha il sapore del
            ferro.
          imposta: { colpo.dispensa: 1 }
          effetti: { ferite: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Aspettarlo alla seconda porta, quella sul ponte"
        descrizione: "Il Mercato dei Nodi lo conosci passerella per passerella. Ogni bottega del vicolo ha una seconda porta, e i bagagli escono da lì."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La seconda porta
          testo: |
            Al Mercato dei Nodi ogni bottega del vicolo ha una seconda porta
            sul ponte, e da lì escono le casse che non devono passare davanti
            ai Custodi di Passaggio. Lo sai perché da lì, una volta, ne hai
            fatte uscire anche tu, e ti viene ancora da sorridere al ricordo.
            Lasci stare la porta con la corda tagliata e ti siedi sul parapetto
            dall'altra parte, al buio, con le gambe sopra la Cicatrice.

            Dopo un'ora la porta del ponte si apre ed esce Nestor, con due
            sacche di vetri che tintinnano a ogni passo. Quando ti vede le posa
            per terra una alla volta, con molta cura, da speziale anche nella
            disfatta, poi scappa giù verso la Pignatta a passo corto. Nel retro
            trovi la cassetta con le monete di un mese.
          effetti: { colpi.scuri: 1, rep.scuri: -1, rep.caserma: 0.5 }
          imposta: { colpo.dispensa: 1 }

  # ------------------------------------------------------------ 3 · la cassa nel pilone
  - id: la-cassa-nel-pilone
    presso: ponte-delle-mille-corde
    immagine: ambientazione/ponti-sospesi
    titolo: Il quarto pilone
    sommario: "Uno dei piloni del Ponte delle Mille Corde è cavo, e dentro gli Scuri tengono quello che i ponti gli rendono."
    luogo: Ponte delle Mille Corde, sotto le assi
    area: ponti-sospesi
    requisiti: [pista.pelle == 3, colpo.cassa == 0]
    testo: |
      I conti di Ottone non dicono dove sia la cassa degli Scuri. Dicono
      soltanto che due volte all'anno un uomo dei Malgrani porta una borsa *al
      quarto pilone*, e Galdrick ha contato i piloni del Ponte delle Mille
      Corde dal lato della Città Bassa. Il quarto è un tronco di ferro
      precuriano largo quanto una torre, piantato nella roccia della Cicatrice,
      e a metà altezza ha uno sportello tondo che da sopra non si vede.

      Ci arrivi dalla piattaforma di servizio sotto le assi, dove di giorno i
      Custodi di Passaggio si allenano al tiro. Di notte i sacchi di paglia
      restano appesi alle rastrelliere con le loro facce disegnate a carbone, e
      uno ha una freccia piantata nell'occhio da settimane, che nessuno si è
      preso la briga di togliere e qualcuno ha decorato con un fiocco. Dalla
      piattaforma al pilone corre una passerella di corde, e sulla cengia
      davanti allo sportello tre uomini degli Scuri giocano a dadi su una
      cassa rovesciata.

      {armi-da-mischia Facile} Hanno tutti un coltello alla cintura, e c'è un
      bastone ferrato appoggiato al pilone. Su una cengia così stretta il
      bastone conta più dei coltelli.

      Sopra la tua testa passano i carri della notte, e la polvere delle assi
      ti cade nel colletto. Uno dei tre si alza e tende l'orecchio verso il
      ponte. Più in alto, sulla campata, un ragazzo corre verso la Città Bassa
      senza lanterna.

      {conoscenze-della-strada Media} Un ragazzo che corre di notte senza
      lanterna è un messaggio. Gli Scuri pagano i piccoli a corsa, e li
      pagano di più quando la notizia è cattiva.

      *Sanno che arriva qualcuno, anche se non sanno chi.* Ti asciughi le
      mani sui calzoni, una alla volta, prima di toccare le corde, e le
      ginocchia ti dicono che la Cicatrice è proprio lì sotto.
    opzioni:
      - testo: "Scendere lungo le catene"
        descrizione: "Dal lato del vuoto il pilone è coperto di catene di sostegno. Si arriva allo sportello alle spalle dei tre, se non si guarda sotto."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Dal lato del vuoto
          testo: |
            Scavalchi il parapetto e scendi lungo le catene di sostegno, una
            maglia alla volta, con la luce della Cicatrice che ti sale fra le
            gambe e i palmi che si scorticano sulla ruggine. Arrivi sopra lo
            sportello mentre i tre litigano su un tiro di dadi, ognuno sicuro
            di aver vinto, ti lasci cadere dentro e sprangi lo sportello
            dall'interno.

            La cassa è di ferro, inchiodata al pavimento del pilone, e qualcuno
            l'ha già svuotata a metà. Il resto lo cali in un sacco con la corda
            di servizio fino alla piattaforma, dove ti aspettano due mercenari
            di Galdrick. Poi risali per le catene, e quando i tre si accorgono
            che lo sportello è chiuso da dentro tu sei già sulla passerella.
          imposta: { colpo.cassa: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
        fallimento:
          titolo: Una maglia di troppo
          testo: |
            A metà discesa una maglia ti si apre sotto il piede, e resti appeso
            per le mani sopra la luce della Cicatrice, con il cuore che batte
            nelle dita. Il rumore della catena arriva fino allo sportello.
            Quando ci arrivi i tre ti aspettano con i coltelli fuori, e devi
            passare in mezzo a loro con le braccia ancora intorpidite.

            {acrobazia Media fallita} Avresti dovuto saggiare ogni maglia con il
            tallone prima di caricarla. Lo pensi adesso, appeso, ed è un
            pensiero molto utile.

            Ne esci con un taglio lungo il braccio, che ti accorgi di avere
            soltanto quando la manica diventa calda, e con la cassa mezza vuota,
            perché il grosso era partito prima di te. I mercenari di Galdrick
            tirano su il sacco con la corda di servizio. Uno dei tre Scuri,
            scappando lungo la passerella, grida il tuo nome verso la Città
            Bassa.
          imposta: { colpo.cassa: 1 }
          effetti: { ferite: 1.5, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Prendere la passerella"
        descrizione: "Tre uomini su una cengia larga quanto un tavolo, e la Cicatrice sotto. Chi perde l'equilibrio lì non torna su."
        combattimento: la-cassa-degli-scuri
        vittoria:
          titolo: La cengia
          testo: |
            Attraversi la passerella di corsa, con le corde che ti ondeggiano
            sotto i piedi e lo stomaco che resta un passo indietro. Il primo
            dei tre ti viene incontro e lo rimandi indietro addosso agli altri.
            Uno si aggrappa alle corde e scappa su verso il ponte, e gli altri
            due li lasci legati alla rastrelliera dei bersagli, accanto ai
            sacchi con la faccia a carbone, che al confronto sembrano più
            svegli.

            La cassa di ferro è inchiodata al pavimento del pilone, e qualcuno
            l'ha già svuotata a metà. Il resto lo cali in un sacco fino alla
            piattaforma, dove i mercenari di Galdrick lo contano due volte e te
            lo firmano su una ricevuta.
          imposta: { colpo.cassa: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, rep.caserma: 0.5 }
        sconfitta:
          titolo: Le corde
          testo: |
            Ti prendono a metà della passerella, nel punto in cui oscilla di
            più. Un colpo ti manda contro le corde e per un momento sei fuori,
            con la luce della Cicatrice sotto la schiena e una mano sola stretta
            alla fune. Ti tirano su i mercenari di Galdrick, che hanno sentito
            il rumore dalla piattaforma.

            I tre Scuri sono scappati verso il ponte con quello che sono
            riusciti a portare via. Nella cassa del pilone resta un fondo di
            monete, che i mercenari contano due volte mentre tu, seduto sulle
            assi, non riesci a smettere di tremare.

            {resilienza Media fallita} Il vuoto ti è rimasto dietro gli occhi.
            Ogni volta che li chiudi la fune ti scivola dalla mano, e tu la
            riprendi, e ti scivola di nuovo.
          imposta: { colpo.cassa: 1 }
          effetti: { tormento: 0.5, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Presentarti come ispettore della Gilda"
        descrizione: "I Custodi di Passaggio dormono in una baracca sulla piattaforma. Un ispettore con l'aria giusta li sveglia e li manda dove vuole."
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Media }
        successo:
          titolo: Il pilone pericolante
          testo: |
            Svegli il caposquadra dei Custodi alzando la voce quanto basta, e
            gli parli di crepe nel quarto pilone e di un rapporto da consegnare
            alla Casa dei Nodi entro l'alba. Lui si abbottona la giacca sopra
            la camicia da notte, sbagliando tutti i bottoni di uno. Un
            ispettore di notte non l'ha mai visto, e proprio per questo ti
            crede. Manda sei uomini con le lanterne sulla passerella.

            {galateo Media} Il segreto era non chiedere scusa per l'ora. Un
            funzionario della Gilda non chiede mai scusa, e chi si scusa non è
            un funzionario.

            I tre Scuri non possono fare a botte con mezza squadra dei Custodi
            sotto gli occhi del ponte intero, e se ne vanno brontolando. Il
            caposquadra apre lo sportello per te e guarda la cassa di ferro
            mezza vuota senza fare domande. Quando arrivano i mercenari di
            Galdrick gli lasci una ricevuta firmata con un nome inventato.
          imposta: { colpo.cassa: 1 }
          pe: { galateo: 5 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
        fallimento:
          titolo: Il falso ispettore
          testo: |
            Il caposquadra dei Custodi ti ascolta in camicia da notte,
            grattandosi il petto, poi ti chiede il sigillo della Casa dei Nodi,
            e tu il sigillo non ce l'hai. Le orecchie ti diventano calde.
            Manda lo stesso i suoi uomini sul pilone, più per curiosità che per
            altro, e i tre Scuri se ne vanno senza fretta, con una sacca a testa
            sulle spalle.

            Nella cassa resta il fondo, che i mercenari di Galdrick contano
            all'alba. Il caposquadra intanto ha descritto la tua faccia nel
            registro dei Custodi alla voce *falso ispettore*, e prima di sera
            qualcuno alla Casa dei Nodi la legge.
          imposta: { colpo.cassa: 1 }
          effetti: { sospetto: 1, colpi.scuri: 1, rep.scuri: -0.5 }
      - testo: "Aspettare che se ne vadano"
        descrizione: "Se sono stati avvisati, stanotte la cassa la svuotano loro. Prima o poi, per portare via le sacche, devono lasciarne uno solo."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Il cambio
          testo: |
            Resti accucciato fra i bersagli per tre ore, con le gambe che ti si
            addormentano e la polvere delle assi che ti cola nel colletto. Due
            volte i tre si caricano una sacca a testa e salgono
            verso il ponte, e due volte tornano. La terza volta ne resta uno
            solo, che si addormenta sulla cassa rovesciata.

            {percezione Media} Prima di dormire si è tolto gli stivali e li ha
            messi in fila, punta contro punta. È l'unico ordine che c'è su
            quella cengia, e ti dice che non si sveglia facilmente.

            Lo sportello cigola appena. Dentro, la cassa di ferro è svuotata a
            metà, e la metà che resta pesa ancora parecchio. La cali fino alla
            piattaforma con la corda di servizio, e l'uomo sulla cassa
            rovesciata dorme a bocca aperta finché non lo svegliano i mercenari
            di Galdrick.
          imposta: { colpo.cassa: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
        fallimento:
          titolo: Le sacche
          testo: |
            Resti accucciato fra i bersagli per tre ore, e alla terza, quando ormai
            non senti più i piedi, uno ti scivola contro una rastrelliera. I tre Scuri
            sentono il rumore e si guardano in faccia, poi smettono di perdere tempo.
            Si caricano tutto quello che possono e salgono verso il ponte in fila,
            lasciando lo sportello aperto.

            Nella cassa di ferro trovi soltanto il fondo, qualche borsa che
            nessuno è riuscito a portare. I mercenari di Galdrick la contano
            all'alba, sbadigliando. Tu hai le gambe che non ti reggono e il
            colletto pieno di polvere, e per tutto il giorno ti sembra di
            sentire i carri passarti sopra la testa.
          imposta: { colpo.cassa: 1 }
          effetti: { tormento: 0.5, colpi.scuri: 1, rep.scuri: -0.5 }
      - testo: "Scendere sulle catene come su una piattaforma"
        descrizione: "Per un Raschiatore le catene sopra la Cicatrice sono una scala come un'altra. Si scende con i piedi incrociati e le mani sempre su due maglie."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Due maglie
          testo: |
            Scavalchi il parapetto e scendi dal lato del vuoto con i piedi
            incrociati sulla catena e le mani sempre su due maglie, come sulle
            piattaforme dei turni. Il corpo se lo ricorda meglio di te, e ti
            porta giù con un'indifferenza quasi offensiva. La luce della
            Cicatrice ti sale fra le gambe e tu non la guardi. Arrivi sopra lo
            sportello mentre i tre litigano su un tiro di dadi, ti lasci cadere
            dentro e sprangi dall'interno.

            La cassa di ferro è inchiodata al pavimento del pilone, già mezza
            vuota. Il resto lo cali in un sacco con la corda di servizio fino
            alla piattaforma, dove ti aspettano i mercenari di Galdrick, e
            risali per le catene senza fretta. Quando i tre si accorgono dello
            sportello chiuso sei già sulla passerella.
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
          imposta: { colpo.cassa: 1 }
      - testo: "Svegliare i Custodi con la tua licenza"
        descrizione: "La licenza della Gilda ce l'hai davvero, con il sigillo in rilievo che i Custodi di Passaggio riconoscono anche al buio."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il sigillo in rilievo
          testo: |
            Bussi alla baracca dei Custodi e metti la licenza della Gilda sotto il
            naso del caposquadra, ancora in camicia da notte e con un segno di cuscino
            su una guancia. Lui passa il pollice sul sigillo in rilievo, come fanno
            tutti i Custodi, e si sveglia del tutto. Gli parli di una crepa nel quarto
            pilone che il tuo banco ha segnalato alla Casa dei Nodi, e gli chiedi
            perché nessuno l'abbia controllata. Poco dopo sulla passerella ci sono sei
            uomini con le lanterne.

            I tre Scuri non possono fare a botte con mezza squadra dei Custodi
            sotto gli occhi del ponte, e se ne vanno brontolando. Il
            caposquadra apre lo sportello per te. Sulla ricevuta dei mercenari
            di Galdrick, stavolta, ci metti il tuo nome vero.
          pe: { galateo: 5 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
          imposta: { colpo.cassa: 1 }

  # ------------------------------------------------------------ 3 → 4 · il carceriere
  - id: il-carceriere
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: La chiave disegnata
    sommario: "Ogni volta gli Scuri sono arrivati prima di te. Galdrick ha guardato a lungo la sigla con la chiave, e adesso vuole parlarne."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo, a sera
    area: quartieri-alti
    requisiti: [pista.pelle == 3, colpi.scuri >= 2, pista.arena != 1, pista.arena != 2, pista.arena != 3, pista.arena != 4]
    testo: |
      Galdrick ha ricopiato su un foglio la sigla dei conti di Ottone, e il
      foglio è in mezzo al tavolo, fermato da una tazza di tisana ormai
      fredda. Sono due lettere storte, *Ca*, e accanto c'è una chiave
      disegnata con cura fino all'ultimo dente. Sotto il calendario la cassa
      di ferro che si apre con due chiavi è aperta, e dentro ci sono gli
      ordini di servizio per i mercenari di Ghoran, uno per ogni tuo colpo.

      {percezione Media} La chiave l'ha disegnata a memoria, e la conosce
      bene. Nessuno ricorda i denti di una chiave che non ha visto passare
      ogni sera davanti al proprio ufficio.

      «Ogni volta sono arrivati prima di te» dice senza alzare gli occhi dal
      foglio. «Una volta la porta era già sbarrata, un'altra volta un
      ragazzo correva via davanti a te. Dei posti sapevamo io e il furiere, e
      lo sapeva questa cassa. Le carte di Ottone le tengo a casa mia, ma gli
      ordini con il giorno e l'ora li scrive il furiere, e la sera li chiude
      qui dentro.» Batte un dito sulla chiave disegnata. «La seconda chiave
      ce l'ha il furiere, che dorme a casa sua. Le copie di tutte le chiavi
      della Caserma, di notte, stanno appese a un anello solo giù nelle
      celle.»

      Il nome non lo dice. Dal corridoio arriva il rumore di un secchio posato
      sulla pietra, poi un passo pesante che scende verso le celle. Galdrick
      infila i pollici nella cintura e guarda la porta. *Lo sa da giorni, e non
      voleva saperlo.* Ti accorgi di aver abbassato la voce anche tu, con la
      porta chiusa, e di avere le spalle contratte come prima di una rissa.

      {empatia Media} Quella che ha in faccia è la vergogna di un uomo che si
      fidava, e che adesso deve chiedere a te di guardare al suo posto.

      «Un quarto dei miei è pagato da Vesh» dice alla fine, a voce più bassa.
      «Se lo accuso io, domattina la Caserma si spacca in due. Mi serve che
      qualcuno di fuori lo veda con le mani nella cassa.»
    opzioni:
      - testo: "Chiedere a Galdrick di Borso"
        immagine: personaggi/borso
        requisiti: [pista.arena < 2]
        costo: 0
        esito:
          titolo: La scatola di latta
          testo: |
            «L'ho preso io, otto anni fa» dice Galdrick. «Era arrivato da Ghoran
            con il naso rotto e nient'altro, e in cella non si è mai fatto
            comprare da un detenuto, nemmeno per un tozzo di tabacco. Mette da
            parte ogni moneta in una scatola di latta, per riscattare i figli
            dai mercati di Ghoran.»

            Si guarda le mani, girandole come se ci cercasse una macchia.
            «Vesh paga meglio della Caserma, e paga prima. Ci voleva poco a
            capirlo, e io in otto anni non l'ho capito.»
      - testo: "Chiedere a Galdrick di Borso"
        immagine: personaggi/borso
        requisiti: [pista.arena >= 2, mischia == 1]
        costo: 0
        esito:
          titolo: Spinto fuori dal recinto
          testo: |
            «Per il torneo gli ho dato la licenza» dice Galdrick, «e nella
            Mischia lui, insieme a Durgan, mi ha spinto fuori dal recinto a due
            mani. Ho riso, mi sembrava una cosa da caserma.» Scuote la testa, e
            si tocca il fianco dove la staccionata del recinto deve avergli
            lasciato un livido.

            «L'ho preso io otto anni fa, quando è arrivato da Ghoran con il naso
            rotto. Mette da parte ogni moneta in una scatola di latta per
            riscattare i figli dai mercati di Ghoran, e Vesh paga prima della
            Caserma. In otto anni non l'ho capito.»
      - testo: "Chiedere a Galdrick di Borso"
        immagine: personaggi/borso
        requisiti: [pista.arena >= 2, mischia != 1]
        costo: 0
        esito:
          titolo: La licenza
          testo: |
            «Per il torneo gli ho dato la licenza» dice Galdrick. «Voleva
            fracassare qualche cranio, e l'ho lasciato fare, perché mi sembrava
            una cosa da caserma.» Scuote la testa piano, e si passa il pollice
            sull'indice dove gli resta la macchia d'inchiostro della firma.

            «L'ho preso io otto anni fa, quando è arrivato da Ghoran con il naso
            rotto. Mette da parte ogni moneta in una scatola di latta per
            riscattare i figli dai mercati di Ghoran, e Vesh paga prima della
            Caserma. In otto anni non l'ho capito.»
      - testo: "Aspettarlo nell'ufficio, al buio"
        descrizione: "Se è lui, stanotte scende a guardare la cassa. Dietro l'armadio delle pratiche c'è posto per una persona sola."
        prova: { attributo: mentale, abilita: [percezione, furtivita], difficolta: Media }
        successo:
          titolo: Le mani nella cassa
          testo: |
            Ti nascondi dietro l'armadio delle pratiche e aspetti, con l'odore
            di carta vecchia e di topo nelle narici. Dopo la terza campana la
            porta si apre senza rumore. Borso entra in calze, con l'anello delle
            chiavi stretto nel pugno perché non tintinni, e apre la cassa di
            ferro con due chiavi che non dovrebbe avere. Copia l'ordine di
            servizio su un foglietto con la sua matita minuscola, muovendo le
            labbra sulle parole.

            {accademiche Facile} Ha imparato a leggere da grande, e legge una
            sillaba alla volta. Le parole difficili le copia lettera per lettera,
            senza capirle.

            Quando esci dall'ombra non scappa subito. Prima guarda te, poi il
            foglietto che ha in mano. Lo piega in quattro con cura e se lo mette
            in bocca.
          effetti: { rep.caserma: 1 }
          segue: la-fuga-di-borso
        fallimento:
          titolo: Un'asse che scricchiola
          testo: |
            Ti nascondi dietro l'armadio delle pratiche, ma dopo la seconda
            campana ti si addormenta una gamba, mille formiche dal ginocchio in
            giù, e la sposti. L'asse sotto il tuo piede scricchiola. La porta si
            stava aprendo, e adesso si richiude piano. Nel corridoio senti un
            passo pesante che torna verso le celle senza fretta.

            All'alba la cassa di ferro è chiusa e l'anello delle chiavi pende
            dal suo chiodo, come tutte le mattine. Adesso però Borso sa che lo
            aspettavate.
          effetti: { sospetto: 0.5 }
          segue: la-fuga-di-borso
      - testo: "Fargli sentire un posto che non esiste"
        descrizione: "La sera Borso conta le monete al tavolo in fondo al corridoio. Si può nominare davanti a lui una quarta cassa, e poi guardare chi ci va."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Il quinto pilone
          testo: |
            Scendi alle celle all'ora del rancio, fra l'odore di zuppa di cavolo e
            quello dei secchi, e passando davanti al tavolo in fondo al corridoio
            chiedi a Galdrick quanti uomini servono per il quinto pilone. Borso conta
            le sue monete senza alzare la testa. Il quinto pilone è vuoto, e a saperlo
            siete soltanto tu e lo sceriffo.

            All'alba sulla piattaforma di servizio arrivano quattro Scuri con i
            piedi di porco, e dietro i sacchi di paglia li aspettano i mercenari
            di Galdrick. Uno dei quattro, prima ancora che lo leghino, giura che
            la soffiata viene dalle celle della Caserma.
          pe: { ingannare: 5 }
          effetti: { rep.caserma: 1 }
          segue: la-fuga-di-borso
        fallimento:
          titolo: Troppo forte
          testo: |
            Scendi alle celle all'ora del rancio e chiedi a Galdrick del quinto
            pilone, ma lo chiedi troppo forte, e gli occhi ti scappano su Borso
            prima che tu possa trattenerli. Lui smette di contare e rimette le
            monete nella scatola di latta, una alla volta. Poi ti guarda a
            lungo da sotto le sopracciglia, e capisce.

            Quella notte nessuno va al quinto pilone. Galdrick passa la sera
            alla finestra dell'ufficio a guardare il cortile, con i pollici
            nella cintura.
          effetti: { sospetto: 0.5 }
          segue: la-fuga-di-borso
      - testo: "Affrontarlo nelle celle"
        immagine: personaggi/borso
        descrizione: "Lo prendi da solo nel corridoio delle celle, prima che finisca il rancio. Le chiavi le porta legate al pugno."
        combattimento: borso
        vittoria:
          titolo: Il grembiule di cuoio
          testo: |
            Borso picchia con il pugno chiuso sull'anello delle chiavi, e ogni
            colpo ti lascia addosso l'impronta di una serratura.

            {rissa Media} Picchia da carceriere, dall'alto verso il basso,
            abituato a gente che sta già per terra. Basta restare in piedi e
            stargli sotto il braccio.

            Alla fine lo metti in ginocchio sulla paglia di una cella vuota. Nella tasca del
            grembiule ha un foglietto con l'ordine di servizio copiato a
            matita, e le parole che non sapeva scrivere le ha disegnate.

            Galdrick scende le scale di corsa e si ferma sull'ultimo gradino.
            Guarda prima il foglietto e poi Borso, a lungo, senza dire niente.
          effetti: { rep.caserma: 1 }
          segue: la-fuga-di-borso
        sconfitta:
          titolo: La paglia
          testo: |
            Borso ti prende per il collo della giubba e ti sbatte contro le
            sbarre finché le sbarre non smettono di girare. Ti lascia sulla
            paglia di una cella vuota e chiude la porta a chiave con calma,
            come tutte le sere, e prima di salire le scale controlla che la
            serratura abbia fatto il suo scatto. La paglia sa di piscio vecchio.

            Galdrick ti apre poco dopo con la seconda copia della chiave. Nel
            corridoio la scatola di latta non c'è più, e dal chiodo dove stava
            appeso l'anello delle chiavi pende soltanto un pezzo di spago.
            Salite di corsa verso il cortile.
          effetti: { tormento: 0.5 }
          segue: la-fuga-di-borso
      - testo: "Mettergli paura"
        descrizione: "Al tavolo del rancio, davanti alla scatola di latta. Borso alza la voce di rado, e chi lo conosce sa che è meglio così."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: I figli a Ghoran
          testo: |
            Ti siedi al suo tavolo mentre conta e gli posi una mano sopra la
            pila delle monete. Gli parli della corda che aspetta un carceriere
            venduto, e di chi resta senza le monete della scatola di latta
            quando il carceriere non le manda più. Borso guarda la tua mano a
            lungo, e tu senti il polso battere contro il metallo freddo.

            {intimidire Difficile} La voce non hai avuto bisogno di alzarla. La
            paura ce l'aveva già da anni, e tu le hai soltanto dato un nome.

            «Vesh paga prima» dice alla fine, con la voce bassa di sempre. «La Caserma
            paga a fine mese, e a Ghoran i mercanti di bambini non aspettano.» Tira
            fuori dal grembiule un foglietto con l'ordine di servizio copiato a matita
            e lo posa sul tavolo, accanto alla latta.
          effetti: { rep.caserma: 0.5 }
          segue: la-fuga-di-borso
        fallimento:
          titolo: La clava corta
          testo: |
            Gli posi una mano sopra la pila delle monete e cominci a parlare
            della scatola di latta e di chi aspetta quelle monete. Borso ti
            lascia finire senza interromperti, e questo avrebbe dovuto
            metterti in allarme. Poi si alza, e la clava corta che porta alla
            cintura gli è già passata in mano senza che tu la veda muoversi. Il
            primo colpo ti prende sotto le costole e ti piega, il secondo sulla
            spalla, e poi ti spinge indietro fino alla scala con la punta, un
            passo alla volta, senza alzare la voce.

            {empatia Media fallita} Credevi di toccare un padre. Hai toccato
            l'unica cosa che lui non lascia toccare a nessuno.

            «Dei miei figli tu non parli» dice, con la clava ferma a un palmo
            dal tuo petto. Quando Galdrick scende a vedere, Borso ha già
            staccato l'anello delle chiavi dal chiodo e sta salendo verso il
            cortile.
          effetti: { ferite: 2 }
          segue: la-fuga-di-borso
      - testo: "Parlargli dei mercanti di bambini di Ghoran"
        descrizione: "Borso manda le monete a Ghoran, dove i mercanti di bambini non aspettano la fine del mese. Tu quei mercanti li hai visti pesare la gente."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [intimidire, empatia], difficolta: Media }
        successo:
          titolo: La bilancia del mercato
          testo: |
            Ti siedi al suo tavolo mentre conta e gli racconti della bilancia
            del mercato di Ghoran, dei bambini che ci fanno salire per primi
            perché pesano poco e si vendono bene. Lo dici piano, con le mani
            ferme sul legno, come ti hanno insegnato i recinti, anche se la
            gola ti si stringe a metà della frase. Borso smette di contare e
            tiene una moneta a mezz'aria. Gli dici che quando un
            carceriere venduto finisce sulla corda le monete smettono di
            partire, e che i mercanti lo sanno prima della famiglia.

            Borso guarda a lungo la scatola di latta. «Vesh paga prima» dice
            alla fine. Tira fuori dal grembiule un foglietto con l'ordine di
            servizio copiato a matita e lo posa sul tavolo, accanto alla latta.
          effetti: { rep.caserma: 0.5 }
          segue: la-fuga-di-borso
        fallimento:
          titolo: Proprio tu
          testo: |
            Cominci a parlargli della bilancia di Ghoran, e a metà Borso alza gli
            occhi dalle monete. Capisce da dove vieni prima che tu finisca la frase,
            magari dall'accento che ti è rimasto. La clava corta gli passa in mano
            senza che tu la veda muoversi, e il primo colpo ti prende sotto le
            costole. Il secondo ti spinge indietro fino alla scala.

            «Proprio tu vieni a dirmi di Ghoran» dice, con la clava ferma a un palmo
            dal tuo petto e la voce che finalmente gli trema. Quando Galdrick scende a
            vedere, Borso ha già staccato l'anello delle chiavi dal chiodo e sta
            salendo verso il cortile.
          effetti: { ferite: 2 }
          segue: la-fuga-di-borso

  - id: la-fuga-di-borso
    presso: guarnigione-di-qir-azel
    immagine: personaggi/borso
    titolo: Il cane della Caserma
    tipo: seguito
    luogo: Guarnigione di Qir-Azel, il cortile
    area: quartieri-alti
    requisiti: [pista.pelle == 3]
    testo: |
      Borso attraversa il cortile della Caserma con l'anello delle chiavi delle
      celle infilato al braccio, dove di solito porta il secchio del rancio.
      Cammina senza correre. Le due guardie del portone lo vedono
      arrivare e si guardano fra loro, e una delle due solleva la sbarra prima
      che lui gliel'abbia chiesto. Sugli spalti altre tre guardie restano
      ferme con le balestre abbassate.

      {armi-da-distanza Media} Tre balestre cariche e nessuna puntata. Da
      lassù un tiro nel cortile è il più facile della giornata, e nessuno dei
      tre ha nemmeno il dito vicino al grilletto.

      {intimidire Facile} Guardali bene, perché quelle guardie hanno paura di
      lui più che dello sceriffo. È per questo che la sbarra si è alzata da
      sola.

      Galdrick è sulla scala dell'ufficio con la spada nel fodero e i pollici
      nella cintura. Guarda Borso attraversare il cortile senza dire una
      parola, e ha la faccia di un uomo davanti a un cane rabbioso che ha
      addestrato con le sue mani. Quando fai un passo verso il portone il
      corpo ti si tende da solo, e lui ti posa una mano sul braccio.

      «Lascialo andare» dice piano. «Se lo fermiamo qui, stanotte nel cortile
      ci tiriamo addosso le balestre.» Sulla soglia Borso si gira una volta
      sola, verso le celle, poi prende la discesa della Città Bassa. *Va alla
      Pignatta, e ci va con le chiavi di tutta la Caserma.* La sbarra del
      portone ricade dietro di lui con un colpo sordo, e la guardia che l'ha
      alzata si pulisce le mani sulla giubba.
    opzioni:
      - testo: "Ripensare a quello che ti ha detto Borso"
        requisiti: [pista.arena >= 2]
        costo: 0
        esito:
          titolo: Il recinto
          testo: |
            Passandoti accanto Borso si è chinato appena, così vicino che hai
            sentito l'odore di cuoio del grembiule. «All'Arena ti ho visto nel
            recinto» ha detto con la voce bassa di sempre. «Ti ha visto anche
            Mauro, e Mauro i conti li tiene a memoria.»

            Ti è rimasto addosso, quell'odore di cuoio, insieme al fiato di
            Borso sull'orecchio. Galdrick ha sentito. Tira fuori il taccuino e
            ci scrive una riga corta con la sua matita.
      - testo: "Scendere alle celle con Galdrick"
        requisiti: [maedric == 2]
        esito:
          titolo: La cella di Maedric
          testo: |
            Le celle degli Scuri presi nelle ultime settimane sono aperte e
            vuote, e le porte dondolano ancora sui cardini. È vuota anche quella
            in fondo, dove dormiva Maedric Holl. Sulla paglia è rimasto il suo
            mantello cerato, piegato in quattro con una cura che in quella
            cella non serviva a niente. Nella cella accanto l'ubriaco di Via del
            Salmone, quello che sul registro stava una riga sopra Maedric, dorme
            ancora con la porta spalancata.

            Galdrick scrive due righe nel taccuino. «Fra qualche giorno Vesh
            saprà tutto quello che sapeva Maedric» dice, «e noi di giorni non ne
            abbiamo più.» Chiude il taccuino e sale a scrivere a Julia.
          imposta: { maedric: 1 }
          effetti: { pista.pelle: 1 }
      - testo: "Scendere alle celle con Galdrick"
        requisiti: [maedric != 2]
        esito:
          titolo: Le celle aperte
          testo: |
            Le celle degli Scuri presi nelle ultime settimane sono aperte e
            vuote, e le porte dondolano ancora sui cardini. In quella in fondo
            un ubriaco di Via del Salmone russa nella paglia con la porta
            spalancata, e nessuno si è preso la briga di svegliarlo.

            Galdrick scrive due righe nel taccuino. «Adesso Vesh sa tutto quello
            che sapeva Borso» dice, «cioè quasi tutto quello che so io.» Chiude
            il taccuino e sale a scrivere a Julia.
          effetti: { pista.pelle: 1 }

  # ------------------------------------------------------------ 4 → 5 · il Municipio all'alba
  - id: il-municipio-all-alba
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: L'alba non porta luce
    sommario: "Julia Castaldi ti ha convocato in Municipio all'alba. Sul tavolo della sala consiliare ci sono tutte le carte che hai portato."
    luogo: Municipio, la sala consiliare, all'alba
    area: quartieri-alti
    requisiti: [pista.pelle == 4]
    testo: |
      L'alba porta soltanto nebbia, e dalle finestre alte della sala
      consiliare i tetti della Città Bassa compaiono a pezzi, uno alla volta,
      quando la nebbia si apre, e ogni volta ti sorprendi a cercare un tetto
      che conosci. La sala è quasi vuota. Julia Castaldi è
      vestita di scuro, senza nemmeno la spilla del Consiglio. Toren Galdrick
      porta l'armatura completa con l'elmo in testa, e a ogni passo le piastre
      tintinnano come le pentole appese in una cucina. Alla porta due
      miliziani tengono gli occhi bassi.

      Sul tavolo di legno massiccio le prove sono in pile ordinate dal
      furiere. Ci sono le lettere con l'alloro e le carte del caveau, e
      accanto le ricevute delle casse degli Scuri, tutte con la tua firma.
      Qualcuno ha posato una tazza di caffè su un angolo delle lettere, e
      l'alone ha macchiato il sigillo dei Malgrani.

      {politica-ed-economia Media} Su quel tavolo c'è la rovina di un Casato
      intero, e il primo a pagarla sarà chi compra il pane dai suoi forni.
      Quando un Casato cade, i suoi debiti rotolano in basso.

      «Ottone Malgrani è finito» dice Julia con la voce roca. «Con queste carte
      va in tribunale per estorsione e per collusione con i criminali, e qui
      dentro non c'è niente che un avvocato della Gilda possa spiegare.» Si
      lascia cadere su una sedia, gli occhi sui documenti. «Ogni passo che
      facciamo per la giustizia ci allontana dalla città che volevamo
      proteggere. Eppure indietro non si torna.»

      {galateo Facile} Si è seduta prima dello sceriffo e prima dell'ospite, e
      non se n'è accorta. Una donna come lei, di solito, se ne accorge.

      Galdrick incrocia le braccia, e le piastre dei gomiti stridono. *Julia
      ha dormito ancora meno di me.* La notte in bianco ti pesa sulle
      palpebre, e la nebbia ti è entrata nella giubba fino alle ossa.
    opzioni:
      - testo: "Ascoltare Galdrick"
        immagine: personaggi/toren-galdrick
        costo: 0
        esito:
          titolo: La linfa
          testo: |
            Galdrick parla del grano e del legname, contando sulle dita del
            guanto, che non si piegano bene. Se trascinano Ottone in tribunale
            gli Scuri si muovono e saltano gli accordi della Gilda, e le prime
            settimane la gente comune le pagherà in pane. Julia lo ascolta con
            gli occhi sulle carte, poi dice piano che in questi anni
            Mirko Vesh ha costruito una rete. «Se i Malgrani erano il tronco, lui
            è la linfa» aggiunge, e posa la mano sulle lettere con l'alloro.

            «Ed è dappertutto» dice Galdrick, senza sciogliere le braccia. «Ho
            passato dieci anni a contenerlo come un'infezione di quartiere. Ho
            fermato bande e rivolte, e il Cucitore l'ho inseguito per i vicoli.
            Questa è una guerra, e in guerra chi non colpisce per primo muore.»
      - testo: "Chiedere della Città Bassa"
        costo: 0
        esito:
          titolo: Il braciere
          testo: |
            Julia indica la finestra e la nebbia che sale dalla Città Bassa.
            «Laggiù è pieno di disperati, gente che negli Scuri vede un lavoro e
            una protezione. Se saltiamo addosso a Mirko con gli stendardi della
            città, difenderanno lui» dice, e lo dice come una sentenza.

            «Mirko è già in guerra, e aspetta soltanto che lo accettiamo anche
            noi» risponde Galdrick con una voce fredda che non gli conoscevi.
            Gli Scuri, dice, hanno fatto della Città Bassa un braciere che prima
            o poi si accende, e a loro resta soltanto da scegliere quando. «E tu
            sottovaluti chi sta laggiù, perché molti non vedono l'ora che Vesh
            sparisca» aggiunge, facendo un passo verso di lei.

            {empatia Media} Hanno ragione tutti e due, e lo sanno. Litigano
            così forte perché ciascuno ha paura che l'altro abbia più ragione.
      - testo: "Chiedere per Lucia Malgrani"
        immagine: personaggi/lucia-malgrani
        requisiti: [lucia == 1]
        costo: 0
        esito:
          titolo: Testimone
          testo: |
            Racconti di Lucia Malgrani, di quello che ti ha detto quella notte e di
            come ti ha aiutato, e ti accorgi di scegliere le parole con più cura del
            solito. Julia ti ascolta con la penna ferma a mezz'aria, finché una goccia
            d'inchiostro non cade sul foglio. «Se collabora, la prendiamo come
            testimone e senza catene» dice alla fine, e scrive una riga a margine del
            mandato. I bambini, aggiunge, sono a Ghoran con Urtilia e restano fuori da
            tutto.

            Galdrick annuisce una volta sola, con il mento. «Urtilia Mendion non
            interverrà, ha chiesto soltanto questo» dice, e torna a guardare la
            nebbia.
      - testo: "Dire a Galdrick che verrai con lui"
        immagine: personaggi/toren-galdrick
        esito:
          titolo: La bocca del lupo
          testo: |
            Gli dici che verrai con lui, e lo stomaco ti si chiude un poco
            mentre lo dici. Galdrick si toglie l'elmo e lo tiene sotto il
            braccio. Ha i capelli schiacciati e sudati, da uomo che l'elmo non
            se l'è tolto da ieri sera. «Il mandato per il Maniero parte stanotte, e noi
            intanto scendiamo alla Pignatta» dice, battendo il guanto di ferro
            sulle carte. «Siamo già dentro la bocca del lupo» aggiunge guardando
            Julia, «e adesso possiamo soltanto affondare il coltello.»

            «Toren, se sbagliamo una mossa questa città esplode» dice Julia,
            rialzando di colpo il capo. Lui le sorride, per la prima volta da
            quando sei entrato, e le dice che forse è quello che serve. «Che la
            luce del Velo ci assista. D'accordo, lo faremo» dice lei dopo un
            lungo silenzio.

            «Preparati, perché fra un'ora la Città Bassa sarà nel caos» ti dice
            Galdrick sulla porta, con l'elmo sotto il braccio.
          effetti: { pista.pelle: 1, rep.caserma: 0.5 }
          vai: citta-bassa
      - testo: "Dare ragione a Julia, e andare lo stesso"
        immagine: personaggi/julia-castaldi
        esito:
          titolo: La gente da guardare
          testo: |
            Dici a Julia che ha ragione a temere la folla, e che verrai lo stesso,
            perché laggiù qualcuno dovrà guardare in faccia la gente prima di
            colpirla. Julia ti guarda a lungo, con le mani giunte sul tavolo e i
            pollici che si strofinano piano l'uno sull'altro. «Allora tienila d'occhio
            tu, la gente, perché Toren guarderà soltanto Vesh» dice alla fine, senza
            alzare la voce.

            «Siamo già dentro la bocca del lupo, Julia» dice Galdrick
            togliendosi l'elmo. Lei firma il mandato per il Maniero sotto la
            firma dello sceriffo, con la penna che gratta la carta. «Che la luce
            del Velo ci assista» dice mentre soffia sull'inchiostro. «Fra un'ora
            la Città Bassa sarà nel caos» risponde Galdrick, che è già sulla
            porta.
          effetti: { pista.pelle: 1, rep.castaldi: 0.5 }
          vai: citta-bassa

  # ------------------------------------------------------------ 5 · l'assalto alla Pignatta
  - id: l-assalto-alla-pignatta
    presso: pignatta-grassa
    immagine: personaggi/mirko-vesh
    titolo: L'assalto alla Pignatta
    sommario: "Galdrick scende in Città Bassa con i suoi miliziani e i mercenari di Ghoran. Mirko Vesh lo aspetta sulla porta."
    luogo: Pignatta Grassa, lo spiazzo, di notte
    area: citta-bassa
    requisiti: [pista.pelle == 5]
    testo: |
      Di notte la Città Bassa è sempre rumorosa. Stasera invece le finestre
      sono chiuse, e le torce agli angoli fumano senza fare luce. Su un
      davanzale qualcuno ha dimenticato un vaso di basilico, e nessuno esce a
      ritirarlo. Galdrick cammina in testa con il mantello che striscia nel
      fango, i miliziani scelti intorno e i mercenari di Ghoran in coda, e tu
      due passi dietro di lui, con la bocca secca, finché non girate l'ultimo
      angolo.

      Lo spiazzo della Pignatta è illuminato da decine di lanterne appese ai
      fili, e le porte della taverna sono spalancate. Davanti, appoggiato a un
      bastone da passeggio, c'è Mirko Vesh, magro ed elegante, con un anello a
      ogni dito. Ai lati ha i suoi quattro tenenti. Mauro Scrocco si è tolto la
      camicia sgargiante, e sotto il grasso si vedono i muscoli di un uomo che
      spacca la legna da sempre. In mano ha un'ascia da boscaiolo. Rozalia
      Marga si rigira fra le dita due stiletti sottili come fossero penne.
      Nestor Gramm scuote una boccetta verde e ha gli occhi febbrili. Borso,
      con l'anello delle chiavi della Caserma alla cintura, guarda soltanto
      Galdrick. Di Nihali Cuzan, il baro della bisca all'Orlo, stanotte non
      c'è traccia.

      {armi-da-mischia Media} L'ascia di Mauro è pesante in punta e torna
      indietro piano, da attrezzo per la legna qual è. Gli stiletti di Rozalia,
      invece, sono fatti per una cosa sola, e lei li tiene come si tengono le
      cose di cui ci si fida.

      Mirko alza una mano, e dai vicoli escono le sagome. Sono centinaia, con
      in mano randelli e bottiglie rotte. Molti sono ragazzi che hanno paura,
      e guardano te.

      {resilienza Media fallita} Le ginocchia decidono per conto loro che
      centinaia sono troppi. Te lo comunicano tremando, e tu fai finta di
      non averle sentite.

      «È una trappola» sussurra Galdrick. «E sapevo che l'avrebbe preparata
      così.» Poi alza la voce. «Vesh! Questa è la tua ultima notte!»

      Mirko ride, calmo. «Vecchio amico… no. È la tua.»

      Le due lame escono insieme dai foderi, e i due uomini spariscono dentro
      la Pignatta. Le porte sbattono alle loro spalle, e qua fuori adesso tocca
      a te.
    opzioni:
      - testo: "Colpire di piatto e farti strada fino ai tenenti"
        descrizione: "Il piatto della lama e l'elsa per chi ti viene addosso dalla folla. Mauro e i suoi, invece, li cerchi davvero."
        combattimento: i-tenenti-di-vesh
        vittoria:
          titolo: Non vogliono ucciderci
          testo: |
            Ti fai strada a colpi di piatto e d'elsa, con il braccio che
            comincia a bruciarti già al decimo colpo, e chi cade si rialza e
            scappa. Dopo un po' qualcuno grida «Non vogliono ucciderci!», e il
            grido passa di bocca in bocca fino ai vicoli. Mezza folla si
            sparpaglia. Mauro ti viene incontro con l'ascia alta e uno dei suoi
            ragazzi al fianco, e quando finalmente va giù fa tremare le
            lanterne.

            Nestor Gramm posa la boccetta per terra e alza le mani. Rozalia
            rompe un fumogeno ai suoi piedi, e quando il fumo si dirada è
            sparita. Borso lo tengono in quattro, i mercenari di Ghoran, e lui
            continua a guardare le porte chiuse della Pignatta.
          effetti: { nomea.citta-bassa: 2 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        sconfitta:
          titolo: La milizia
          testo: |
            Ti fai strada a colpi di piatto, ma la folla si chiude e Mauro ti
            arriva addosso dalla parte sbagliata. L'ascia ti prende di striscio
            sulla spalla, e un ragazzo ti spacca una bottiglia sulla nuca, poi
            la guarda come se non sapesse da dove gli sia venuta. Finisci in
            ginocchio nel fango, sotto le lanterne, con il vetro nei capelli.

            Ti rimettono in piedi i miliziani di Galdrick, arrivati di corsa con
            gli scudi alzati. Mauro e il suo ragazzo li prendono in sei. Nestor
            si è arreso da solo, di Rozalia resta il fumo di un fumogeno, e
            Borso lo tengono a terra in quattro. Fra la folla qualcuno ha visto
            che colpivi di piatto, e lo racconta.
          effetti: { nomea.citta-bassa: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Parlare alla folla"
        descrizione: "Sono centinaia, e la metà sono ragazzi pagati a settimana. Se qualcuno gli parla prima che volino le bottiglie, qualcuno torna a casa."
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Difficile }
        successo:
          titolo: La settimana è finita
          testo: |
            Sali su un carro rovesciato all'angolo dello spiazzo e parli forte,
            senza la spada in mano, con il cuore che ti batte in gola e la voce
            che per fortuna non lo sa. Dici che la Caserma è venuta per Vesh e
            per i suoi tenenti, e che a chi torna a casa stanotte nessuno
            chiederà il nome. E aggiungi che Vesh li paga a settimana, e che
            questa settimana non la pagherà.

            {espressivita Difficile} Hai parlato a quelli in fondo, con le pause
            al posto giusto. Quelli davanti hanno sentito che la frase non era
            per loro, e si sono voltati a guardare chi c'era dietro.

            Per prima se ne va una donna con un randello. Dietro di lei partono
            due ragazzi, e dopo un po' i vicoli si svuotano a gruppi. Mauro
            guarda la sua folla che se ne va e abbassa l'ascia, e i mercenari di
            Ghoran gli sono addosso prima che la rialzi. Nestor Gramm posa la
            boccetta per terra. Di Rozalia resta il fumo di un fumogeno, e Borso
            lo legano in quattro.
          pe: { persuasione: 5 }
          effetti: { nomea.citta-bassa: 2 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: Le bottiglie
          testo: |
            Sali su un carro rovesciato all'angolo dello spiazzo e cominci a
            parlare, ma prima della terza frase una bottiglia ti prende sulla
            fronte, e il mondo diventa per un momento bianco e molto silenzioso.
            Qualcuno ascolta lo stesso. Mentre scendi dal carro con il
            sangue negli occhi vedi un gruppo di ragazzi lasciare i randelli
            contro un muro e sparire in un vicolo.

            Gli altri ti vengono addosso, e prima che la milizia di Galdrick
            faccia quadrato intorno a te i randelli ti arrivano sulla schiena e
            sulle gambe. Quando la folla si sparpaglia i tenenti di Vesh sono a
            terra o in catene, tutti tranne Rozalia, che ha lasciato soltanto il
            fumo di un fumogeno.
          effetti: { ferite: 2, nomea.citta-bassa: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Ricordare a Mauro l'Arena"
        immagine: personaggi/mauro-scrocco
        descrizione: "Mauro è uscito dal suo quadrante umiliato davanti a mezza città. Stanotte, sullo spiazzo, la mezza città è la stessa."
        requisiti: [pista.arena >= 3]
        prova: { attributo: sociale, abilita: [intimidire, espressivita], difficolta: Media }
        successo:
          titolo: Il quadrante
          testo: |
            Gli gridi dall'altra parte dello spiazzo che stanotte non c'è nessun
            cristallo a rimetterlo in piedi. Un ragazzo della folla ride, e poi ridono
            altri, quelli che erano sulle gradinate dell'Arena e che forse ci hanno
            perso qualche moneta. Mauro diventa viola. Ti carica da solo con l'ascia
            alta, senza guardare dove mette i piedi, e inciampa nella corda di una
            lanterna caduta.

            Gli sono addosso in sei, i mercenari di Ghoran, prima che si
            rialzi. Con Mauro a terra mezza folla perde la voglia e torna nei
            vicoli. Nestor alza le mani. Rozalia sparisce in una nuvola di
            fumogeno, e Borso si lascia legare senza smettere di guardare le
            porte della Pignatta.
          effetti: { nomea.citta-bassa: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: Il furore muto
          testo: |
            Gli gridi dell'Arena dall'altra parte dello spiazzo, e Mauro non
            risponde e non diventa nemmeno rosso.

            {intimidire Media fallita} Credevi che la vergogna lo rendesse
            stupido. Su certi uomini la vergogna fa l'effetto contrario, e
            Mauro è uno di quelli.

            Ti viene incontro piano con l'ascia bassa, e la folla si apre davanti a
            lui. Il primo colpo ti arriva prima che tu abbia finito di capire quanto è
            veloce un uomo così grosso, e il manico dell'ascia ti spacca il labbro e
            ti manda nel fango.

            Ti tirano via i miliziani di Galdrick, che lo prendono in sei con le
            corde. Nella confusione Nestor si arrende, e di Rozalia resta
            soltanto il fumo di un fumogeno. Borso lo legano contro il muro
            della Pignatta.
          effetti: { ferite: 2.5 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Puntare dritto ai tenenti"
        descrizione: "La folla la tengano i miliziani. Tu vai da Mauro, e degli altri ti occupi dopo."
        combattimento: mauro-scrocco
        vittoria:
          titolo: L'ascia nel fango
          testo: |
            Passi in mezzo alla folla senza guardarla, e lasci ai miliziani
            quelli che ti vengono addosso. Mauro ti aspetta davanti alle porte
            chiuse con l'ascia a due mani. È più veloce di quanto sembri e più
            forte di quanto speravi, e ogni colpo che pari ti risale fino alla
            spalla. Alla fine l'ascia finisce nel fango e lui ci cade sopra.

            {rissa Media} Tiene la guardia larga e tutta in avanti, da uomo che
            spacca legna. Bastava entrargli sotto la lama prima del terzo colpo, e
            ci sei entrato.

            Senza Mauro i tenenti si sfaldano. Nestor posa la boccetta e si
            siede per terra, Rozalia sparisce nel fumo di un fumogeno, e Borso
            lo prendono i mercenari di Ghoran. Fra i vicoli la milizia mena
            ancora randellate, e la folla grida.
          effetti: { rep.caserma: 0.5 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        sconfitta:
          titolo: Le porte chiuse
          testo: |
            Mauro ti aspetta davanti alle porte chiuse con l'ascia a due mani, e
            quando arrivi è lui a colpire per primo. Ti ritrovi con la schiena
            contro il legno della Pignatta e le sue mani intorno al collo, che
            sanno di cipolla e di resina, e il mondo ai bordi comincia a
            diventare nero, finché un mercenario di Ghoran non gli spacca
            un'asta sulla testa.

            Lo legano in quattro. Intorno la milizia ha fatto il suo lavoro a
            randellate, e la folla si è dispersa gridando. Nestor si è arreso
            da solo e Borso è in catene, mentre di Rozalia resta il fumo di un
            fumogeno. Nella Città Bassa, domani, ricorderanno soprattutto le
            randellate della milizia.
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Aprirti la strada a qualunque costo"
        descrizione: "Chi ti si para davanti va giù e non si rialza. È la via più corta fino ai tenenti, e la Città Bassa guarda."
        prova: { attributo: fisico, abilita: [armi-da-mischia, armi-da-distanza, intimidire], difficolta: Difficile }
        successo:
          titolo: Gli assassini del governo
          testo: |
            Il primo ragazzo che ti si para davanti con una bottiglia rotta va
            giù e resta giù, e il secondo fa la stessa fine. Il braccio lavora
            da solo, e tu lo lasci fare. Dopo il terzo la folla si apre davanti
            a te urlando, e in mezzo alle urla qualcuno grida «Gli assassini del
            governo!», e il grido corre per i vicoli.

            Arrivi da Mauro con la lama già sporca, e lui cade davanti alle
            porte chiuse della Pignatta e non si muove più. Nestor alza le mani
            tremando e Borso si lascia legare. Di Rozalia resta soltanto il fumo
            di un fumogeno. Sotto le lanterne dello spiazzo restano otto corpi,
            e soltanto uno era un tenente di Vesh.

            {resilienza Media} Li conterai ancora, stanotte, al buio. Il conto
            torna ogni volta uguale, e ogni volta speri che non torni.
          effetti: { nomea.citta-bassa: -2, tormento: 0.5 }
          imposta: { mauro: 2 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: Una notte da ricordare
          testo: |
            Ti butti nella folla, ma la folla è più grande di quanto pensavi e non
            scappa. Ti si chiude intorno con un odore di sudore e di vino cattivo, e
            per ogni ragazzo che va giù ne arriva un altro con un randello. Ti
            trascinano fuori i mercenari di Ghoran, con un taglio sul fianco e le
            nocche spaccate.

            I tenenti li prendono loro, tranne Rozalia, sparita nel fumo di un
            fumogeno. Sullo spiazzo restano i corpi dei ragazzi, e dietro le
            imposte chiuse la Città Bassa ha visto chi li ha messi lì.
          effetti: { nomea.citta-bassa: -2, ferite: 2.5, tormento: 0.5 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Guardare Rozalia"
        immagine: personaggi/rozalia-marga
        descrizione: "Si rigira gli stiletti fra le dita e tiene gli occhi sui vicoli. Rozalia i conti li fa sempre prima degli altri."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Media }
        successo:
          titolo: In pari
          testo: |
            Le arrivi accanto mentre la folla avanza e le dici a bassa voce che
            stanotte la Pignatta cade comunque, e che una falsaria senza padrone
            trova lavoro in qualunque città. Rozalia batte due volte uno
            stiletto contro l'altro, come una penna sull'orlo del calamaio.

            {ingannare Media} Le hai detto soltanto cose che sapeva già, e le
            hai dato un motivo elegante per fare quello che stava per fare, e
            a Rozalia l'eleganza importa più della fedeltà.

            «Per la precisione, tesoro, Mirko i ragazzi li paga fino a stasera»
            dice. Poi grida verso i vicoli, con una voce da pescivendola, che la
            paga è finita. Mezza folla si ferma a guardarla. Quando ti volti di
            nuovo lei è sparita, e al suo posto resta un filo di fumo grigio.
            Senza i ragazzi i tenenti restano in pochi, e la milizia li prende
            uno alla volta.
          effetti: { nomea.citta-bassa: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: Il fumogeno
          testo: |
            Le arrivi accanto e cominci a parlare, ma Rozalia ha già fatto i
            suoi conti senza di te. Ti sorride con tutta la bocca, e lo stiletto
            che aveva fra le dita ti apre la manica e il braccio dal polso al
            gomito, così pulito che il dolore arriva dopo. Poi rompe un
            fumogeno ai tuoi piedi.

            Quando smetti di tossire sullo spiazzo la milizia mena già
            randellate, e la folla grida. I tenenti li prendono i mercenari di
            Ghoran, uno alla volta, mentre tu ti stringi il braccio nel
            fazzoletto.
          effetti: { ferite: 2 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Curare un ragazzo davanti a tutti"
        descrizione: "Al primo scontro un ragazzo della folla è caduto con la testa aperta. La Liturgia dell'Albero chiude le ferite, e la folla guarda."
        incantesimo: rimarginare
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le mani sulla ferita
          testo: |
            Ti inginocchi accanto al ragazzo in mezzo allo spiazzo, e la folla
            si ferma con i randelli alzati. Gli posi le mani sulla testa e preghi
            l'Albero ad alta voce, e la voce ti trema meno di quanto temessi.
            Sotto le tue dita la ferita si chiude, e il ragazzo apre gli occhi e
            chiama sua madre.

            {magia Media} Il Mana ti scende dalle spalle ai palmi tiepido e
            obbediente, e per una volta non ti chiede niente in cambio.

            Una donna esce dalla folla e se lo prende in braccio. Dietro di lei
            se ne vanno in tanti, a gruppi, lasciando i randelli per terra.
            Sullo spiazzo i tenenti di Vesh restano con pochi dei loro, e la
            milizia li prende uno alla volta. Soltanto Rozalia sparisce, nel
            fumo di un fumogeno.
          effetti: { nomea.citta-bassa: 2, rep.velo: 0.5 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: La preghiera interrotta
          testo: |
            Ti inginocchi accanto al ragazzo e preghi l'Albero ad alta voce, ma
            la ferita sotto le tue dita sanguina ancora quando una bottiglia ti
            prende alla schiena, e un randello alla nuca. Il ragazzo lo portano
            via due donne, svenuto. La folla ha visto lo stesso che cosa
            cercavi di fare, e una parte se ne torna nei vicoli.

            Gli altri li tiene la milizia. Quando ti rialzi i tenenti di Vesh
            sono in catene, tranne Rozalia che è sparita nel fumo. In bocca hai
            la nausea che ti lascia sempre una preghiera finita male, e sulle
            dita il sangue del ragazzo, che si sta seccando.
          effetti: { nomea.citta-bassa: 1, ferite: 1.5, tormento: 0.5 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Chiamare per nome i ragazzi della tua strada"
        descrizione: "Metà di quelle facce le conosci. Hai giocato con i loro fratelli maggiori sotto le fucine, e sai di quale madre hanno più paura."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Media }
        successo:
          titolo: I nomi
          testo: |
            Sali su un carro rovesciato all'angolo dello spiazzo e cominci a
            chiamare i nomi. Chiami il figlio del bottaio, quello con
            l'orecchio storto, e le due sorelle della strada delle fucine, e a
            ogni nome aggiungi quello della madre, che a quest'ora li aspetta
            sveglia. La voce ti esce con l'accento della strada, quello che ti
            eri messo d'impegno a perdere. Al terzo nome un ragazzo lascia
            cadere la bottiglia. Al quinto se ne vanno a gruppi, e i vicoli si
            svuotano dietro di loro.

            {conoscenze-della-strada Facile} In Città Bassa nessuno ha paura
            della milizia quanto ha paura della propria madre. Lo sapevi da
            bambino, e lo sanno anche loro.

            Mauro guarda la sua folla che se ne va e abbassa l'ascia, e i
            mercenari di Ghoran gli sono addosso prima che la rialzi. Nestor
            Gramm posa la boccetta per terra. Di Rozalia resta il fumo di un
            fumogeno, e Borso lo legano in quattro.
          pe: { persuasione: 5 }
          effetti: { nomea.citta-bassa: 2 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: La prima bottiglia
          testo: |
            Sali su un carro rovesciato e cominci a chiamare i nomi, e il primo che
            chiami ti tira una bottiglia sulla fronte, con una mira che da bambino non
            aveva. Qualcuno ascolta lo stesso. Mentre scendi dal carro con il sangue
            negli occhi vedi due sorelle della strada delle fucine lasciare i randelli
            contro un muro e sparire in un vicolo.

            Gli altri ti vengono addosso, e prima che la milizia di Galdrick
            faccia quadrato intorno a te i randelli ti arrivano sulla schiena.
            Quando la folla si sparpaglia i tenenti di Vesh sono a terra o in
            catene, tutti tranne Rozalia, che ha lasciato soltanto il fumo di
            un fumogeno.
          effetti: { ferite: 2, nomea.citta-bassa: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh

  - id: galdrick-e-vesh
    presso: pignatta-grassa
    immagine: personaggi/toren-galdrick
    titolo: Dieci anni
    tipo: seguito
    luogo: Pignatta Grassa, fra le fiamme
    area: citta-bassa
    requisiti: [pista.pelle == 5]
    testo: |
      La Pignatta Grassa brucia, e le travi del tetto crollano una dopo
      l'altra mentre il fumo sputa scintille nella notte. Il calore ti tira
      la pelle della faccia, e ogni respiro sa di grasso bruciato e di vino
      versato. In fondo ai vicoli la milizia spegne le ultime sacche di
      resistenza. Quando sfondi la porta del cortile delle risse li trovi lì,
      in un quadrato di pietra e di cenere.

      Mirko Vesh ha la camicia strappata e la barba sporca di sangue, e la sua
      sciabola sottile riflette il rosso delle fiamme. «Dieci anni, Galdrick,
      dieci anni che provi a prendermi» dice con un sorriso storto. Galdrick
      si toglie il mantello e lo lascia cadere nella polvere. Ha in mano una
      lama spessa, senza ornamenti, con il filo mangiato dagli anni. «Sono
      qui» dice piano, «e tu questa città non la controlli più.»

      {armi-da-mischia Media} La sciabola di Mirko è veloce e bella da
      vedere, roba da sala d'armi. Quella di Galdrick è fatta per durare, e lui la
      tiene bassa, da uomo che ha deciso di prendersi il primo colpo.

      «È la città che ha scelto ME!» grida Mirko con la sciabola alta.
      «No. È la paura che ha scelto te» risponde Galdrick senza muoversi.

      Mirko scatta per primo, e la sciabola apre il fianco di Galdrick. Lo
      sceriffo barcolla all'indietro di un passo. Poi abbassa la guardia e
      avanza dentro il colpo successivo, gli afferra il braccio con la mano
      libera e lo tira a sé, e gli spinge la lama sotto la cassa toracica,
      verso l'alto.

      «Dieci anni…» mormora Mirko, sputando sangue. «Per questo?» Muore in
      ginocchio con gli occhi aperti, sorretto dall'uomo che lo ha ucciso.

      {medicina Facile} Il fianco di Galdrick sanguina a fiotti lenti e scuri.
      La lama è passata lontano dalle cose importanti, però un taglio così,
      lasciato aperto, diventa importante da solo.

      Galdrick si siede su un gradino del cortile, con la spada piantata nella
      terra accanto a sé. «È finita… per me, e per lui» dice senza alzare la
      testa.
    opzioni:
      - testo: "Sederti sul gradino accanto a lui"
        costo: 0
        esito:
          titolo: La caccia
          testo: |
            «Dovrei dirti che è stato giusto. L'ho fatto per la città, perché la
            legge doveva vincere, ed è vero» dice Galdrick senza guardarti,
            con gli occhi sul punto dove Mirko è caduto. Dopo una pausa lunga si
            volta verso di te, e per la prima volta da quando lo conosci la
            faccia dello sceriffo si incrina.

            «Ma non era solo per la città. Gli davo la caccia da una vita, e lui
            dava un senso alla mia.» Si passa una mano sporca di cenere sulla
            testa rasata, e poi se la guarda.

            {empatia Media} Lo dice a te soltanto perché sei l'unico seduto
            abbastanza vicino da sentirlo. Un'assoluzione non la vuole, e da te meno
            che da chiunque.

            «Mi faceva sentire vivo, e non l'avrei mai ammesso» aggiunge dopo un
            po', più piano.
      - testo: "Chiedergli come si sente"
        costo: 0
        esito:
          titolo: Più leggero, o più vuoto
          testo: |
            Galdrick lascia cadere la testa all'indietro contro il muro e guarda il
            fumo, che sale dritto finché il vento non lo piega. «Tutte le volte che
            mi sfuggiva, o che gli scoprivo un piano, mi pareva che la città stesse
            appesa a un filo e che a tenerlo fossi soltanto io.» Si batte il petto
            con il pugno, piano, due volte. «Orgoglio. Mi ha tenuto in piedi tante
            notti quanto la giustizia» ammette, guardando ancora il fumo.

            Più piano ancora dice che adesso non sa se si sente più leggero o
            più vuoto. «Non ero pronto a dire addio a questo bastardo, e forse
            Vesh lo sapeva» aggiunge con un sorriso stanco.
      - testo: "Guardare Mirko Vesh"
        immagine: personaggi/mirko-vesh
        costo: 0
        esito:
          titolo: Gli anelli
          testo: |
            Mirko è disteso dove è caduto, con gli occhi ancora aperti verso le
            travi che bruciano. Da morto sembra più piccolo, e più giovane di
            quanto credevi. Ha un anello a ogni dito, e in Città Bassa tutti
            sanno che soltanto uno è suo, quello liscio d'argento sul mignolo
            sinistro. Gli altri li ha tolti ai debitori, uno per ogni conto
            chiuso.

            «Lasciali dove sono, domani li riportiamo ai loro padroni» dice
            Galdrick quando ti vede guardarli, «a quelli che sono ancora vivi.»
      - testo: "Aiutarlo ad alzarsi"
        esito:
          titolo: Il silenzio
          testo: |
            Gli tendi la mano, e Galdrick ci si appoggia in equilibrio incerto,
            con l'altra mano premuta sul fianco. Pesa più di quanto pensavi, e
            l'armatura pesa più di lui. «Non fare come me» dice mentre
            si raddrizza, «e non legare la tua vita a un nemico, perché quando
            il duello finisce ti resta soltanto il silenzio.» Rimette la spada
            nel fodero, e la lama entra con un colpo secco.

            «Andiamo. Questa città aspetta qualcuno migliore di me per guidarla.
            Il resto spetta a Julia.» Volta le spalle al corpo di Mirko e alla
            Pignatta che fuma, e comincia a salire verso i Quartieri Alti un
            passo alla volta, senza chiederti di sorreggerlo.
          effetti: { pista.pelle: 1, racconto: 1 }
          vai: quartieri-alti
      - testo: "Medicargli il fianco"
        descrizione: "Il taglio è lungo e sanguina ancora, e lo sceriffo non chiederà aiuto a nessuno."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: La cucitura
          testo: |
            Gli apri la giubba sul fianco senza chiedere il permesso. Il taglio è
            lungo ma pulito, e lo chiudi con l'ago e il filo della bisaccia
            mentre lui guarda il fuoco e stringe i denti. A ogni punto gli
            trema un muscolo della mascella, e basta. Alla fine si guarda la
            cucitura e annuisce. «Non fare come me» dice mentre si abbottona la
            giubba, «e non legare la tua vita a un nemico, perché quando il
            duello finisce ti resta soltanto il silenzio.»

            Si alza da solo e rimette la spada nel fodero con un colpo secco.
            «Andiamo. Il resto spetta a Julia.» Volta le spalle al corpo di
            Mirko e alla Pignatta che fuma, e sale verso i Quartieri Alti senza
            zoppicare.
          pe: { medicina: 5 }
          effetti: { pista.pelle: 1, rep.caserma: 1, racconto: 1 }
          vai: quartieri-alti
        fallimento:
          titolo: Il filo che si strappa
          testo: |
            Gli apri la giubba sul fianco e provi a chiudere il taglio con l'ago
            della bisaccia, ma le mani ti tremano e il filo si strappa due
            volte.

            {resistenza Media fallita} Le mani hanno combattuto tutta la notte e
            adesso pretendono di riposare. Per la cucitura, ti fanno sapere,
            bisognava chiedere prima.

            Galdrick ti toglie l'ago di mano con delicatezza e si preme il
            fazzoletto sulla ferita. «Lascia, ci pensa Vantes» dice con un mezzo
            sorriso. «Non fare come me» aggiunge mentre si raddrizza, «e non legare
            la tua vita a un nemico, perché quando il duello finisce ti resta
            soltanto il silenzio.»

            Si alza appoggiandosi alla spada. «Andiamo. Il resto spetta a
            Julia.» Sale verso i Quartieri Alti con la mano sul fianco, e tu
            gli vai dietro con le dita sporche del suo sangue.
          effetti: { pista.pelle: 1, racconto: 1, tormento: 0.5 }
          vai: quartieri-alti

  # ------------------------------------------------------------ 6 → 7 · la città dopo Vesh
  - id: la-citta-dopo-vesh
    presso: municipio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: La città dopo Vesh
    sommario: "Sono passate tre settimane dalla notte della Pignatta. Julia Castaldi ti aspetta in Municipio, e il Consiglio ha una cosa da darti."
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [pista.pelle == 6]
    testo: |
      Tre settimane dopo la notte della Pignatta il Municipio ha le finestre
      aperte, e sulla panca dell'anticamera c'è la coda. Sono soprattutto mugnai
      e taglialegna con il cappello in mano, venuti per le licenze nuove. Sul
      davanzale dell'anticamera qualcuno ha messo un mazzo di fiori di campo in
      un barattolo da conserva, con l'etichetta ancora attaccata.

      {galateo Media fallita} Dovresti sapere come ci si comporta in
      un'anticamera del Municipio, se si saluta la coda o si passa davanti.
      Resti in piedi in mezzo, con le mani che non sanno dove stare, finché
      un usciere non ti chiama per nome.

      Julia Castaldi ti riceve nel suo ufficio, fra pile di pratiche più alte
      del tavolo, e ti racconta la città come si legge un bilancio. Gli Scuri
      come rete non esistono più. Nei villaggi del circondario restano cellule
      piccole che vivono di furti e di traffici minuti, e in Municipio nessuno
      le copre più. Ottone Malgrani è stato condannato a morte dopo un
      processo breve. Senza i Malgrani e senza i Tarvelin, in Consiglio le
      liti restano, però la corruzione ha smesso di comandare.

      {politica-ed-economia Media} Due Casati spariti in un mese lasciano un
      vuoto, e i vuoti in Consiglio non restano vuoti a lungo. Qualcuno, a
      quest'ora, sta già prendendo le misure delle sedie.

      «Ho fatto le licenze per chi macina e commercia grano, con controlli
      periodici sulle quantità e una tassa sulla produzione» dice, sfogliando
      una pratica che conosce a memoria. «Il Comune ha pagato le cooperative
      che hanno rilevato i mulini e le segherie dei Malgrani, e i prezzi
      restano bassi.» Si gira verso la finestra. «Le casse invece sono vuote,
      e ricostruire la Città Bassa ci costerà mesi» aggiunge senza voltarsi.
    opzioni:
      - testo: "Chiedere di Lucia Malgrani"
        immagine: personaggi/lucia-malgrani
        requisiti: [lucia == 1]
        costo: 0
        esito:
          titolo: Il Maniero venduto
          testo: |
            «Lucia ha collaborato fino all'ultima carta» dice Julia. «Ha venduto
            il Maniero alla città, e il Consiglio vuole farne un istituto di
            studi, con le menti migliori della regione dentro e le statue degli
            antenati fuori in cortile, sotto la pioggia come sempre.»

            Si concede un mezzo sorriso, il primo da quando sei entrato. «È
            andata a Ghoran a stare con i figli, a casa di Urtilia. Prima di
            partire ha chiesto di salutarti, e tu non c'eri.» Ti dispiace più
            di quanto ti aspettassi, e te ne accorgi da come stringi il bordo
            della sedia.
      - testo: "Chiedere di Lucia Malgrani"
        immagine: personaggi/lucia-malgrani
        requisiti: [lucia != 1]
        costo: 0
        esito:
          titolo: L'esilio
          testo: |
            «Lucia Malgrani l'abbiamo processata insieme al marito» dice Julia.
            «Dei conti del marito sapeva poco, però abbastanza da tacere per
            anni. Il tribunale l'ha esiliata a Ghoran, dove ci sono la zia e i
            bambini.»

            Sfoglia una pratica senza leggerla, e torna indietro di due pagine per
            niente. «Il Maniero l'ha comprato la città all'asta, e il Consiglio vuole
            farne un istituto di studi. Le statue degli antenati restano in cortile,
            sotto la pioggia.»
      - testo: "Chiedere della Città Bassa"
        requisiti: [nomea.citta-bassa >= 2]
        costo: 0
        esito:
          titolo: Il tuo nome nei vicoli
          testo: |
            «In Città Bassa il tuo nome lo dicono volentieri» dice Julia.
            «Raccontano che quella notte hai rimandato a casa i loro figli, e lo
            raccontano in tanti. Per la prima volta da anni la gente sale in
            Municipio a chiedere, invece di andare alla Pignatta.» Te lo dice
            senza guardarti, e ti scalda la faccia lo stesso.

            Della Pignatta, aggiunge, restano i muri anneriti, e davanti alla
            porta qualcuno ha già vangato un orto.
      - testo: "Chiedere della Città Bassa"
        requisiti: [nomea.citta-bassa >= 0, nomea.citta-bassa < 2]
        costo: 0
        esito:
          titolo: I muri anneriti
          testo: |
            «Laggiù di te parlano poco» dice Julia, stringendosi nelle spalle con una
            specie di gentilezza. «Si ricordano la milizia e le randellate più delle
            facce, e quando salgono per le licenze chiedono ancora chi pagherà i vetri
            delle finestre. Forse per te è meglio così.»

            Della Pignatta, aggiunge, restano i muri anneriti, e davanti alla
            porta qualcuno ha già vangato un orto. Le prime cipolle sono
            spuntate storte, tutte piegate dalla stessa parte.
      - testo: "Chiedere della Città Bassa"
        requisiti: [nomea.citta-bassa < 0]
        costo: 0
        esito:
          titolo: Sui muri
          testo: |
            Julia ci mette un po' a rispondere, e intanto allinea la penna al
            bordo del tavolo. «Sui muri della Città Bassa c'è
            scritto *assassini del governo*, con il carbone, e sotto qualche
            volta c'è il tuo nome» dice. «Le scritte le facciamo lavare, e la
            notte dopo tornano. Ci vorranno anni.»

            Della Pignatta restano i muri anneriti. Davanti alla porta
            qualcuno ha piantato una croce di legno per ogni ragazzo morto
            sullo spiazzo, e su qualcuna c'è appeso un berretto.
      # L'Acciaieria secondo acciaieria.futuro (citta/minori.yaml, `l-acciaieria-senza-padrone`).
      - testo: "Accettare la ricompensa del Consiglio"
        esito:
          titolo: La borsa del Consiglio
          testo: |
            Julia apre un cassetto e posa sul tavolo una borsa di cuoio con il
            sigillo del Consiglio, e accanto una lettera firmata da lei e da
            Galdrick. «Le casse sono vuote» dice. «Questa è l'ultima borsa che
            avevamo per una cosa giusta.» La lettera dice che la città ti deve
            un favore, e chiunque la può leggere. La borsa nella mano pesa più
            delle monete che contiene.

            Galdrick lo incontri sulle scale senza armatura, con il fianco
            ancora fasciato sotto la giubba. Senza le piastre sembra un uomo
            qualunque, un po' stanco. Ti stringe la mano e torna giù verso la
            Caserma, con i pollici nella cintura.
          effetti: { monete: 120, rep.castaldi: 1, rep.caserma: 1, pista.pelle: 1, racconto: 1 }
      - testo: "Chiedere che la borsa vada alla Città Bassa"
        descrizione: "L'intera ricompensa, per i tetti bruciati intorno alla Pignatta. Le casse del Comune sono vuote, e la tua bisaccia non è molto più piena."
        esito:
          titolo: I tetti di una strada
          testo: |
            Guardi la borsa sul tavolo e chiedi a Julia di spenderla in Città
            Bassa, per le case bruciate intorno alla Pignatta. Lei ti guarda a
            lungo. Poi rimette la borsa nel cassetto e ci lega sopra un
            cartellino con scritto *Città Bassa, tetti*. «Basta per i tetti di
            una strada» dice, e ti consegna lo stesso la lettera firmata da lei
            e da Galdrick, dove c'è scritto che la città ti deve un favore.

            Uscendo passi davanti alla coda dei mugnai, e uno ti riconosce e si
            toglie il cappello. Poi lo rimette subito per l'imbarazzo, e il
            vicino gli dà di gomito.
          effetti: { rep.castaldi: 2, rep.caserma: 1, nomea.citta-bassa: 1, pista.pelle: 1, racconto: 1 }
      - testo: "Chiedere dell'Acciaieria dei Tarvelin"
        quando: [acciaieria.futuro == 0]
        costo: 0
        esito:
          titolo: La ciminiera spenta
          testo: |
            «La Gilda è in bilico, perché l'Acciaieria dei Tarvelin è ferma e
            Liaren non la vuole» dice Julia. «Alla Casa dei Nodi vorrebbero
            riaccenderla con un amministratore loro, e intanto il turno di
            giorno aspetta sul muretto davanti al cancello, tutte le mattine.»

            Dalla finestra la ciminiera si vede appena, sopra i tetti della
            Città Bassa, e non fuma. Qualcuno ci ha appeso in cima uno straccio
            nero, e il vento lo fa sbattere.
      - testo: "Chiedere dell'Acciaieria dei Tarvelin"
        quando: [acciaieria.futuro == 1]
        costo: 0
        esito:
          titolo: Il fumo della Gilda
          testo: |
            «L'Acciaieria l'ha riaccesa la Gilda, con un amministratore suo»
            dice Julia. «Alla Casa dei Nodi hanno ripreso a respirare, e la
            tassa sulla colata la pagano prima della scadenza, cosa che i
            Tarvelin non hanno mai fatto. Liaren dal cancello non ci è più
            passata.» Lo dice con un'alzata di sopracciglia che non decide se
            sia una lode o un rimprovero.
      - testo: "Chiedere dell'Acciaieria dei Tarvelin"
        quando: [acciaieria.futuro == 2]
        costo: 0
        esito:
          titolo: La fornace degli operai
          testo: |
            «All'Acciaieria lavorano in società quelli del turno di giorno, con
            la concessione firmata da Liaren» dice Julia. «È la prima fornace
            della città che va avanti senza un padrone, e alla Gilda non hanno
            ancora deciso se esserne contenti. Il lyssan intanto lo compra Irsa
            Valbrun, fino all'ultima colata.» Julia sorride appena, da donna
            che alla Gilda non deve più chiedere il permesso.
      - testo: "Chiedere dell'Acciaieria dei Tarvelin"
        quando: [acciaieria.futuro == 3]
        costo: 0
        esito:
          titolo: La socia di Liaren
          testo: |
            «L'Acciaieria la manda avanti Irsa Valbrun d'accordo con Liaren, e
            alla fornace c'è Abele Torsi» dice Julia. «Alla Gilda brontolano per
            l'amministratore che non hanno potuto metterci, e intanto il lyssan
            esce e le famiglie degli otto prendono la loro parte.» Batte due
            volte la penna sul tavolo, soddisfatta.
