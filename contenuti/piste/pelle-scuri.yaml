# La pista "Sotto la pelle di Qir-Azel" (pista.pelle), passi 3 → 7: l'Atto II che il verbale non ha (le tre
# casse degli Scuri e il carceriere) e l'Atto III con l'epilogo (il Municipio all'alba, l'assalto alla
# Pignatta Grassa, Galdrick e Vesh, la città dopo Vesh).
storylet:
  # ------------------------------------------------------------ 3 · la bisca di Nihali
  - id: la-bisca-di-nihali
    presso: orlo-dei-rottami
    immagine: personaggi/nihali-cuzan
    titolo: La bisca nella cisterna
    sommario: "Ogni settimana un uomo dei Malgrani perde a carte all'Orlo dei Rottami, sempre contro lo stesso baro."
    luogo: Orlo dei Rottami, a notte fonda
    area: citta-bassa
    requisiti: [pista.pelle == 3, colpo.bisca == 0]
    testo: |
      In fondo alla discesa dell'Orlo dei Rottami, dove le lamiere finiscono e comincia il vuoto, c'è una
      cisterna dei Precursori rovesciata sul fianco. È lunga quanto quattro baracche messe in fila, e
      l'ingresso è una porta di lamiera inchiodata sulla bocca tonda. Nei conti di Ottone compare ogni
      settimana alla voce *perdite al gioco*, sempre contro le stesse iniziali, che all'Orlo tutti leggono
      come Nihali Cuzan.

      Dentro ci sono quattro tavoli e una dozzina di giocatori. Il fumo delle pipe sale verso la parete curva
      che fa da soffitto, e sopra le lanterne la parete resta grigia e pulita. In fondo, su una cassa di ferro
      inchiodata al pavimento, siede Nihali con i suoi vestiti di seconda mano stirati a puntino. Tossisce nel
      fazzoletto ricamato e lo ripiega dal lato pulito. Ha le mani più curate di tutta la Città Bassa.

      {conoscenze-della-strada Facile} Le tiene morbide per sentire il bordo delle carte, e lo sanno tutti. Ci
      gioca lo stesso, perché perdere da lui costa meno che vincere da un altro.

      {origine figlio-della-citta-bassa} Quando eri bambin{o|a} le madri dei vicoli nominavano Nihali per
      spaventare i figli sorpresi a giocare a carte sotto le fucine. Da vicino è più piccolo della sua storia.
    opzioni:
      - testo: "Sederti al tavolo di Nihali"
        descrizione: "Nihali bara da vent'anni. Per batterlo bisogna accorgersi di come lo fa, e farglielo capire senza dirlo."
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il mazzo che zoppica
          testo: |
            Nihali tiene appena piegato un angolo delle carte buone e lo raddrizza con il pollice mentre
            distribuisce. La piega è sottile quanto un'unghia, e si vede soltanto quando la carta passa
            davanti alla lanterna. Alla quarta mano la carta la raddrizzi tu prima di lui, e glielo lasci
            vedere.

            «Brav{o|a}. Per stasera ho vinto abbastanza» dice con la voce impastata di catarro. Ti spinge
            davanti la posta e se ne va dalla porta sul retro, su per le lamiere verso la Pignatta. La cassa
            di ferro è aperta e mezza vuota. Il resto lo porti alla Caserma, tutto tranne la posta della
            quarta mano.
          imposta: { colpo.bisca: 1 }
          effetti: { monete: 25, colpi.scuri: 1, rep.scuri: -1 }
        fallimento:
          titolo: Il fazzoletto ricamato
          testo: |
            Perdi tre mani di fila senza vedere il trucco, e alla quarta provi a barare tu, con le dita che
            sudano sul cartone. Nihali ti guarda le mani con una specie di tristezza professionale e tossisce
            nel fazzoletto, poi fa un cenno all'uomo della porta. Se ne va dal retro con la pipa in bocca,
            verso le luci della Pignatta.

            Ogni colpo che prendi rimbomba a lungo sotto la volta della cisterna. Quando l'uomo della porta
            smette di colpirti la cassa di ferro è aperta, e dentro restano soltanto le monete che i giocatori
            non hanno fatto in tempo ad arraffare.
          imposta: { colpo.bisca: 1 }
          effetti: { ferite: 1, sospetto: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Entrare dalla parte del vuoto"
        descrizione: "La cisterna sporge oltre l'orlo dell'altopiano, e sul fondo ha una fessura larga quanto una spalla. Sotto c'è la Cicatrice."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Dalla parte del vuoto
          testo: |
            Ti cali lungo le lamiere fino al ventre della cisterna, con il vento della Cicatrice che ti gonfia
            la giubba e le dita piantate nelle giunture delle lamiere. Poi ti infili nella fessura con la
            pancia contro il ferro. Il bordo della fessura è freddo, e resta freddo anche dopo che ci hai
            strisciato sopra con tutto il corpo. Il lucchetto è aperto e la cassa è già mezza vuota, ma quello
            che resta entra in due sacche.

            Senti Nihali tossire e imprecare dietro di te, poi lo vedi correre su per le lamiere verso la
            Pignatta, con le mani curate tenute in alto per non sporcarle.
          imposta: { colpo.bisca: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
        fallimento:
          titolo: La fessura
          testo: |
            La fessura è più stretta di quanto sembrava, e ci resti incastrat{o|a} con le gambe nel vuoto.
            Conti fino a dieci uno per uno, perché altrimenti penseresti a quello che c'è sotto, e intorno
            agli stivali senti passare soltanto il vento. Quando finalmente entri ti sei scorticat{o|a} un
            fianco, e hai fatto abbastanza rumore da svegliare tutto l'Orlo. Arraffi dalla cassa quello che
            puoi mentre l'uomo della porta ti cerca con la lanterna.

            Nihali è già sparito su per la discesa verso la Pignatta.
          imposta: { colpo.bisca: 1 }
          effetti: { ferite: 1, sospetto: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Entrare dalla porta"
        descrizione: "Un uomo alla porta e Nihali sulla cassa. I giocatori, quando volano i pugni, guardano da un'altra parte."
        combattimento: la-bisca-di-nihali
        vittoria:
          titolo: La cassa di ferro
          testo: |
            Nihali ti sfila qualcosa dalla tasca mentre lo spingi via, e quando te ne accorgi è già fuori dal
            retro. Corre su per le lamiere verso la Pignatta, piegato in due dalla tosse. I giocatori si sono
            stretti contro la parete curva per lasciarvi spazio, e nessuno ha posato le carte.

            La cassa è aperta e mezza vuota. Il resto lo porti alla Caserma, e solo per strada, con le nocche
            che ancora ti bruciano, ti accorgi che ti ha preso il fazzoletto. Nella tasca, al posto del tuo,
            c'è il suo fazzoletto ricamato, ripiegato dal lato pulito.
          imposta: { colpo.bisca: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, rep.caserma: 0.5 }
        sconfitta:
          titolo: Le carte per terra
          testo: |
            L'uomo della porta ti tiene giù con un ginocchio finché Nihali non è uscito dal retro verso la
            Pignatta, poi ti lascia andare e scappa anche lui. Hai la guancia sul pavimento, fra le carte
            cadute dai tavoli. Fra i giocatori qualcuno ha già allungato le mani sulla cassa.

            Ne salvi quello che puoi, contando le monete con le dita che non ti obbediscono, e la mattina dopo
            la Caserma inchioda un'asse sulla porta della cisterna. Per una settimana, all'Orlo, chi ti
            incontra ti guarda l'occhio nero e poi la porta inchiodata.
          imposta: { colpo.bisca: 1 }
          effetti: { sospetto: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Aspettare l'uomo dei Malgrani"
        descrizione: "Stanotte è il giorno segnato nei conti di Ottone. Prima o poi arriva qualcuno con una borsa da perdere."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Le perdite al gioco
          testo: |
            L'uomo dei Malgrani arriva dopo la mezzanotte, con il mantello girato al rovescio per nascondere
            l'alloro ricamato sul petto. Sulla fodera le cuciture dell'alloro si vedono lo stesso, in rilievo
            alla luce delle lanterne. Si siede al tavolo di Nihali e perde una borsa intera in sei mani, senza
            guardare le carte.

            Quando esce lo aspetti in cima alla discesa e gli dici la cifra prima che la dica lui. Diventa
            bianco, e ti consegna la borsa senza discutere.

            La cassa è mezza vuota e Nihali è già alla Pignatta, però la borsa dei Malgrani ce l'hai tu, con
            il sigillo ancora intatto.
          imposta: { colpo.bisca: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5, rep.malgrani: -0.5 }
        fallimento:
          titolo: Il mantello al rovescio
          testo: |
            L'uomo dei Malgrani arriva dopo la mezzanotte con il mantello girato al rovescio. Ti vede prima
            che tu veda lui, e torna indietro a passo svelto senza far suonare le lamiere della discesa.
            All'alba i mercenari di Ghoran che Galdrick si è portato in città sfondano la porta e trovano i
            tavoli e la cassa di ferro, con dentro il fondo di una settimana.

            Nihali è sparito verso la Pignatta.
          imposta: { colpo.bisca: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, sospetto: 0.5 }
      - testo: "Riconoscere l'uomo dei Malgrani dal portamento"
        descrizione: "Un servitore di Casato cammina in un modo che nei Quartieri Alti si impara da bambini. Basta parlargli con il tono dei suoi padroni."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il tono dei padroni
          testo: |
            L'uomo dei Malgrani arriva dopo la mezzanotte con il mantello girato al rovescio, e tu lo
            riconosci prima ancora di vedere le cuciture. Cammina con la schiena dritta e i passi corti di chi
            è cresciuto nei corridoi, anche sulla lamiera storta della discesa. Lo fermi in cima alla discesa
            prima che entri e gli parli con la voce che in casa tua si usa per i domestici distratti,
            nominando la famiglia che lo manda.

            Ti consegna la borsa senza discutere, con il sigillo dei Malgrani intatto, e torna indietro a
            passo svelto. All'alba i mercenari di Ghoran che Galdrick si è portato in città sfondano la porta
            della cisterna. Trovano la cassa mezza vuota e nessuna traccia di Nihali, che a quell'ora è già al
            sicuro alla Pignatta.
          imposta: { colpo.bisca: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5, rep.malgrani: -0.5 }
      - testo: "Tenere a mente le carte uscite"
        descrizione: "Le formule dei cristalli si ripassano a mente una dopo l'altra, e le carte si contano allo stesso modo."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il conto delle carte
          testo: |
            Ti siedi davanti a lui e perdi tre mani di fila, piano, mentre in testa metti in fila le carte
            uscite come le righe di una formula da recitare a Temmerin. Il mazzo è di cartone spesso e ha gli
            angoli anneriti dalle mani. Le carte alte arrivano a Nihali ogni volta che il suo pollice passa
            sull'angolo del mazzo, dove qualcuno le ha piegate appena. Alla quarta mano la carta la raddrizzi
            tu prima di lui, e glielo lasci vedere.

            Ti spinge davanti la posta e se ne va dal retro, su per le lamiere verso la Pignatta. La cassa di
            ferro è aperta e mezza vuota. Il resto lo porti alla Caserma, tutto tranne la posta della quarta
            mano.
          imposta: { colpo.bisca: 1 }
          effetti: { monete: 25, colpi.scuri: 1, rep.scuri: -1 }
        fallimento:
          titolo: Il fumo di pipa
          testo: |
            Il fumo di pipa ti brucia gli occhi, e alla seconda mano il conto ti si confonde con quello della
            mano prima. Dietro di te la porta di lamiera sbatte ogni volta che entra qualcuno, e a ogni colpo
            ti scappa una carta. Alla quarta provi a indovinare, e Nihali ti guarda con una specie di
            tristezza professionale. Dopo un colpo di tosse nel fazzoletto fa un cenno all'uomo della porta e
            se ne va dal retro, verso le luci della Pignatta.

            Quando l'uomo della porta smette di colpirti la cassa di ferro è aperta, e dentro restano soltanto
            le monete che i giocatori non hanno fatto in tempo ad arraffare.
          imposta: { colpo.bisca: 1 }
          effetti: { ferite: 1, sospetto: 1, colpi.scuri: 1, rep.scuri: -1 }

  # ------------------------------------------------------------ 3 · il retrobottega di Gramm
  - id: il-retrobottega-di-gramm
    presso: mercato-dei-nodi
    immagine: personaggi/nestor-gramm
    titolo: Il vicolo della Dispensa
    sommario: "Nei conti di Ottone la Dispensa di Gramm vende infusi per la signora a prezzi da gioielliere."
    luogo: Mercato dei Nodi, il vicolo dietro la Dispensa di Gramm
    area: ponti-sospesi
    requisiti: [pista.pelle == 3, colpo.dispensa == 0]
    testo: |
      Nei conti di Ottone la Dispensa di Gramm compare ogni mese alla voce *infusi per la signora*, con cifre
      che un erborista onesto non incassa in un anno. «Gramm prepara i veleni per gli Scuri da prima che io
      fossi sceriffo» ha detto Galdrick. «Le gocce per dormire della signora Malgrani sono l'unica cosa pulita
      che gli abbiano mai pagato.»

      La porta sul retro ha una campanella che suona soltanto per chi sa dove tirare la corda. Stanotte la
      corda è tagliata di netto, e il capo che pende è ancora chiaro di canapa fresca. Dalle fessure esce
      odore di carta bruciata insieme a un odore dolce che fa lacrimare gli occhi.

      {origine accolito-del-velo} Quell'odore ti riporta all'infermeria della Cattedrale, dove le gocce per il
      dolore si contavano a voce alta. Chi le prepara qui dentro il conto l'ha perso da un pezzo.

      Dentro qualcuno posa vetri sul legno uno alla volta, e fra un vetro e l'altro lascia sempre la stessa
      pausa.

      {furtivita Facile} Un uomo che fa i bagagli in silenzio sta in ascolto. Le tavole del vicolo cigolano,
      quindi cammina sui bordi dove sono inchiodate.
    opzioni:
      - testo: "Bussare come un cliente del vicolo"
        descrizione: "Nestor serve dal retro chi sa chiedere. Bisogna sembrare uno di quelli, con una richiesta precisa e la voce giusta."
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Una richiesta
          immagine: personaggi/nestor-gramm
          testo: |
            Bussi tre volte piano e chiedi attraverso la porta qualcosa per un cane che abbaia troppo. Nestor
            apre di una spanna, e dalla fessura esce il caldo della stufa con l'odore dolce.

            Mentre conta le gocce in una fiala, a labbra strette, gli posi una mano sul polso. Nestor guarda
            prima la mano e poi la tua faccia, e lascia cadere la fiala. Scappa dal vicolo con un passo corto
            e storto, giù verso la Pignatta, e sotto il banco resta la cassetta con le monete di un mese.
          imposta: { colpo.dispensa: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, rep.caserma: 0.5 }
        fallimento:
          titolo: La campanella
          testo: |
            Chiedi qualcosa per un cane che abbaia troppo, ma lo chiedi con la voce di uno che il cane non ce
            l'ha e non l'ha mai voluto. Di là il rumore dei vetri si ferma. Poi senti il chiavistello di una
            seconda porta, quella che dà sul ponte.

            Quando sfondi la porta del vicolo il retro è vuoto e la stufa fuma. Esci tossendo con la cassetta
            delle monete sotto il braccio, mentre in fondo al ponte una sagoma bassa e tozza scende verso la
            Pignatta.
          imposta: { colpo.dispensa: 1 }
          effetti: { ferite: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Leggere gli scaffali dalla finestrella"
        descrizione: "Sopra la porta c'è una finestrella. Chi conosce le erbe capisce che cosa sta mettendo in salvo, e quanto vale in anni di cella."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Le gocce della signora
          testo: |
            Ti alzi in punta di piedi, con il polpaccio che protesta, e dalla finestrella vedi gli scaffali
            svuotati a metà. Nella polvere restano i cerchi puliti delle boccette già portate via. Chiami
            Nestor per nome e gli elenchi attraverso la porta quello che ha nella cassa, con gli anni di cella
            che vale ogni boccetta.

            Poi si apre una seconda porta sul ponte, e un passo corto e storto si allontana verso la Pignatta.
            Nel retro trovi la cassetta con le monete di un mese e il quaderno dei clienti del vicolo, scritto
            in una grafia minuta e pignola.
          imposta: { colpo.dispensa: 1 }
          pe: { medicina: 5 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, informazioni.segreto: 1 }
        fallimento:
          titolo: Il vapore dolce
          testo: |
            Dalla finestrella vedi gli scaffali, ma le etichette sono scritte in un codice da speziale che non
            conosci.

            Mentre cerchi di leggerle Nestor alza gli occhi e ti vede. Rovescia una boccetta sulla stufa, e la
            ghisa sfrigola. Dalla finestrella esce un vapore dolce che ti chiude la gola.

            Quando smetti di tossire sfondi la porta. Il retro è vuoto, e la seconda porta, quella sul ponte,
            sbatte ancora contro lo stipite dalla parte della Pignatta. Sotto il banco c'è la cassetta con le
            monete di un mese.
          imposta: { colpo.dispensa: 1 }
          effetti: { ferite: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Sfondare la porta"
        descrizione: "Dentro c'è un erborista con una boccetta verde e un ragazzo degli Scuri con un coltello. Lo spazio per muoversi è poco per tutti."
        combattimento: il-retrobottega-di-gramm
        vittoria:
          titolo: Vetri
          testo: |
            Il ragazzo degli Scuri ti viene addosso con un coltello da macellaio, troppo grande per la sua
            mano, e lo mandi contro gli scaffali in una pioggia di vetri. Nestor ti lancia la boccetta verde e
            sbaglia di un palmo. La boccetta si rompe contro lo stipite, e ne sale un fumo che sa di dolce.

            Quando il fumo si dirada sono spariti tutti e due dalla porta sul ponte, giù verso la Pignatta.
            Nel retro i vetri ti scricchiolano sotto gli stivali. Restano la stufa piena di carta bruciata e
            la cassetta con le monete di un mese.
          imposta: { colpo.dispensa: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, rep.caserma: 0.5 }
        sconfitta:
          titolo: La boccetta verde
          testo: |
            La boccetta verde ti si rompe sul petto. Il vapore ti piega in due, con i polmoni che si chiudono
            come pugni, e il ragazzo degli Scuri ti finisce con l'impugnatura del coltello.

            Ti svegli con la guancia sulle tavole e il sapore dolce in bocca. Nestor è scappato verso la
            Pignatta con il ragazzo e con i quaderni. Nella fretta però ha dimenticato la cassetta delle
            monete, che teneva sotto un'asse del pavimento, e l'asse adesso è sollevata a un palmo dalla tua
            mano.
          imposta: { colpo.dispensa: 1 }
          effetti: { ferite: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Aspettarlo alla seconda porta, quella sul ponte"
        descrizione: "Il Mercato dei Nodi lo conosci passerella per passerella. Ogni bottega del vicolo ha una seconda porta, e i bagagli escono da lì."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La seconda porta
          testo: |
            Lasci stare la porta con la corda tagliata e ti siedi sul parapetto dall'altra parte, al buio, con
            le gambe sopra la Cicatrice. Il legno del parapetto è umido di nebbia, e la luce della Cicatrice
            ti arriva soltanto sulle suole.

            Dopo un'ora la porta del ponte si apre ed esce Nestor, con due sacche di vetri che tintinnano a
            ogni passo. Quando ti vede le posa per terra una alla volta, con molta cura, da speziale anche
            nella disfatta, poi scappa giù verso la Pignatta a passo corto. Nel retro trovi la cassetta con le
            monete di un mese.
          effetti: { colpi.scuri: 1, rep.scuri: -1, rep.caserma: 0.5 }
          imposta: { colpo.dispensa: 1 }
      - testo: "Leggere le etichette con le sigle dell'infermeria"
        descrizione: "Gli speziali scrivono le etichette con le stesse abbreviazioni dei registri dell'infermeria del Velo. Tu le hai imparate fra le brande della Cattedrale."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il registro delle gocce
          testo: |
            Dalla finestrella sopra la porta vedi gli scaffali svuotati a metà, e sulle etichette riconosci le
            sigle che in Cattedrale si scrivono accanto alle brande, una riga per dose. Le dosi segnate sono
            il doppio di quelle che l'infermeria dava per una notte.

            Chiami Nestor per nome e gli elenchi attraverso la porta quello che ha nella cassa, con gli anni
            di cella che vale ogni boccetta. Di là il rumore dei vetri si ferma, poi la seconda porta sul
            ponte si apre e un passo corto e storto si allontana verso la Pignatta. Nel retro trovi la
            cassetta con le monete di un mese e il quaderno dei clienti del vicolo.
          imposta: { colpo.dispensa: 1 }
          pe: { medicina: 5 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, informazioni.segreto: 1 }

  # ------------------------------------------------------------ 3 · la cassa nel pilone
  - id: la-cassa-nel-pilone
    presso: ponte-delle-mille-corde
    immagine: ambientazione/ponti-sospesi
    titolo: Il quarto pilone
    sommario: "Uno dei piloni del Ponte delle Mille Corde è cavo, e dentro gli Scuri tengono quello che i ponti gli rendono."
    luogo: Ponte delle Mille Corde, sotto le assi
    area: ponti-sospesi
    requisiti: [pista.pelle == 3, colpo.cassa == 0]
    testo: |
      I conti di Ottone dicono soltanto che due volte all'anno un uomo dei Malgrani porta una borsa *al quarto
      pilone*, e Galdrick ha contato i piloni del Ponte delle Mille Corde dal lato della Città Bassa. Il
      quarto è un tronco di ferro precuriano piantato nella roccia della Cicatrice, con uno sportello tondo a
      metà altezza che da sopra non si vede. Le staffe e le catene che la città ci ha fissato intorno sono
      rosse di ruggine, e sotto il ferro del pilone è liscio e scuro. Ti dici che è una lega che il sale non
      intacca.

      Ci arrivi dalla piattaforma di servizio sotto le assi, dove di giorno si allenano al tiro i Custodi di
      Passaggio, e dalle rastrelliere pendono i sacchi dei bersagli con la faccia a carbone. Una passerella di
      corde porta al pilone, e sulla cengia davanti allo sportello tre uomini degli Scuri giocano a dadi su
      una cassa rovesciata. Dal fondo sale la luce della Cicatrice e illumina le assi da sotto. Più in alto un
      ragazzo corre verso la Città Bassa senza lanterna.

      {conoscenze-della-strada Media} Un ragazzo che corre di notte senza lanterna porta un messaggio, e gli
      Scuri pagano di più le notizie cattive.

      {origine apprendista-raschiatore} Sulle piattaforme hai fatto turni interi con il vuoto sotto gli
      stivali, e la luce che sale dal fondo la conosci. Sai che va e viene senza un ritmo, e che chi prova a
      contarne i battiti smette presto.
    opzioni:
      - testo: "Scendere lungo le catene"
        descrizione: "Dal lato del vuoto il pilone è coperto di catene di sostegno. Si arriva allo sportello alle spalle dei tre, se non si guarda sotto."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Dal lato del vuoto
          testo: |
            Scendi lungo le catene di sostegno, che la nebbia rende grasse sotto le dita. Arrivi sopra lo
            sportello mentre i tre litigano su un tiro di dadi, ognuno sicuro di aver vinto. Ti lasci cadere
            dentro e sprangi lo sportello dall'interno.

            Dentro il pilone l'aria è asciutta, e sulle pareti di ferro non c'è una goccia di condensa anche
            se fuori la nebbia bagna tutto. La cassa è di ferro, inchiodata al pavimento del pilone, e
            qualcuno l'ha già svuotata a metà. Il resto lo cali in un sacco con la corda di servizio fino alla
            piattaforma, dove ti aspettano due mercenari di Galdrick.
          imposta: { colpo.cassa: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
        fallimento:
          titolo: Una maglia di troppo
          testo: |
            A metà discesa una maglia ti si apre sotto il piede. È una maglia rifatta dalla città, e la
            ruggine l'ha mangiata fino al filo. Resti appes{o|a} per le mani sopra la luce della Cicatrice,
            con il cuore che batte nelle dita. Quando arrivi allo sportello i tre ti aspettano con i coltelli
            fuori, e devi passare in mezzo a loro con le braccia ancora intorpidite.

            Ne esci con un taglio lungo il braccio, e te ne accorgi soltanto quando la manica diventa calda.
            La cassa è mezza vuota perché il grosso era partito prima di te. Uno dei tre Scuri scappa lungo la
            passerella e grida il tuo nome verso la Città Bassa.
          imposta: { colpo.cassa: 1 }
          effetti: { ferite: 1.5, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Prendere la passerella"
        descrizione: "Tre uomini su una cengia larga quanto un tavolo, e la Cicatrice sotto. Chi perde l'equilibrio lì non torna su."
        combattimento: la-cassa-degli-scuri
        vittoria:
          titolo: La cengia
          testo: |
            Il primo dei tre ti viene incontro e lo rimandi indietro addosso agli altri, e sulla cengia
            stretta finiscono uno sull'altro. Uno si aggrappa alle corde e scappa su verso il ponte. Gli altri
            due li lasci legati alla rastrelliera dei bersagli, accanto ai sacchi con la faccia a carbone, che
            al confronto sembrano più svegli.

            La cassa di ferro è inchiodata al pavimento del pilone, e qualcuno l'ha già svuotata a metà. Il
            resto lo cali in un sacco fino alla piattaforma, dove i mercenari di Galdrick lo contano due volte
            e te lo firmano su una ricevuta.
          imposta: { colpo.cassa: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, rep.caserma: 0.5 }
        sconfitta:
          titolo: Le corde
          testo: |
            Ti prendono a metà della passerella, nel punto in cui oscilla di più. Un colpo ti manda contro le
            corde e ti ritrovi fuori, con la luce della Cicatrice sotto la schiena e una mano sola stretta
            alla fune. La fune è di canapa vecchia e ti scorre fra le dita per un palmo prima che la presa
            tenga. Ti tirano su i mercenari di Galdrick, che hanno sentito il rumore dalla piattaforma.

            Nella cassa del pilone resta un fondo di monete. I mercenari lo contano due volte mentre tu,
            sedut{o|a} sulle assi, non riesci a smettere di tremare.
          imposta: { colpo.cassa: 1 }
          effetti: { tormento: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Presentarti come ispettore della Gilda"
        descrizione: "I Custodi di Passaggio dormono in una baracca sulla piattaforma. Un ispettore con l'aria giusta li sveglia e li manda dove vuole."
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Media }
        successo:
          titolo: Il pilone pericolante
          testo: |
            Svegli il caposquadra dei Custodi alzando la voce quanto basta, e gli parli di crepe nel quarto
            pilone e di un rapporto da consegnare alla Casa dei Nodi entro l'alba. Manda sei uomini con le
            lanterne sulla passerella.

            I tre Scuri non possono fare a botte con mezza squadra dei Custodi sotto gli occhi del ponte
            intero, e se ne vanno brontolando. I Custodi passano le lanterne su tutto il pilone e non trovano
            una crepa né un punto di ruggine. Il caposquadra apre lo sportello per te e guarda la cassa di
            ferro mezza vuota senza fare domande.
          imposta: { colpo.cassa: 1 }
          pe: { galateo: 5 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
        fallimento:
          titolo: Il falso ispettore
          testo: |
            Il caposquadra dei Custodi ti ascolta in camicia da notte, grattandosi il petto, poi ti chiede il
            sigillo della Casa dei Nodi, e tu il sigillo non ce l'hai. Manda lo stesso i suoi uomini sul
            pilone, più per curiosità che per altro. I tre Scuri se ne vanno senza fretta, con una sacca a
            testa sulle spalle.

            Il caposquadra intanto ha descritto la tua faccia nel registro dei Custodi alla voce *falso
            ispettore*, su una pagina gonfia di umidità. Prima di sera qualcuno alla Casa dei Nodi la legge.
          imposta: { colpo.cassa: 1 }
          effetti: { sospetto: 1.5, colpi.scuri: 1, rep.scuri: -0.5 }
      - testo: "Aspettare che se ne vadano"
        descrizione: "Se sono stati avvisati, stanotte la cassa la svuotano loro. Prima o poi, per portare via le sacche, devono lasciarne uno solo."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Il cambio
          testo: |
            Due volte i tre si caricano una sacca a testa e salgono verso il ponte, e due volte tornano. Ogni
            volta la passerella si piega sotto il loro peso, e da quanto si piega capisci quanto pesano le
            sacche. La terza volta ne resta uno solo, che si addormenta sulla cassa rovesciata.

            Lo sportello cigola appena. Dentro, la cassa di ferro è svuotata a metà, e la metà che resta pesa
            ancora parecchio. La cali fino alla piattaforma con la corda di servizio, e l'uomo sulla cassa
            rovesciata dorme a bocca aperta finché non lo svegliano i mercenari di Galdrick.
          imposta: { colpo.cassa: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
        fallimento:
          titolo: Le sacche
          testo: |
            Resti accucciat{o|a} fra i bersagli per tre ore. Alla terza, quando ormai non senti più i piedi,
            lo stivale ti scivola contro una rastrelliera, e il legno vecchio rimbomba sotto le assi fino al
            pilone. I tre Scuri sentono il rumore e si guardano in faccia, poi smettono di perdere tempo. Si
            caricano tutto quello che possono e salgono verso il ponte in fila, lasciando lo sportello aperto.

            Nella cassa di ferro trovi soltanto il fondo, qualche borsa che nessuno è riuscito a portare. I
            mercenari di Galdrick la contano all'alba, sbadigliando.
          imposta: { colpo.cassa: 1 }
          effetti: { tormento: 1, colpi.scuri: 1, rep.scuri: -0.5 }
      - testo: "Scendere sulle catene come su una piattaforma"
        descrizione: "Si scende con i piedi incrociati e le mani sempre su due maglie."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Due maglie
          testo: |
            Scavalchi il parapetto e scendi dal lato del vuoto con i piedi incrociati sulla catena e le mani
            sempre su due maglie, come sulle piattaforme dei turni. Conti le maglie a coppie e non guardi la
            luce sotto gli stivali. Arrivi sopra lo sportello mentre i tre litigano su un tiro di dadi, ti
            lasci cadere dentro e sprangi dall'interno.

            La cassa di ferro è inchiodata al pavimento del pilone, già mezza vuota. Il resto lo cali in un
            sacco con la corda di servizio fino alla piattaforma, dove ti aspettano i mercenari di Galdrick, e
            risali per le catene senza fretta.
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
          imposta: { colpo.cassa: 1 }
      - testo: "Svegliare i Custodi con la tua licenza"
        descrizione: "La licenza della Gilda ce l'hai davvero, con il sigillo in rilievo che i Custodi di Passaggio riconoscono anche al buio."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il sigillo in rilievo
          testo: |
            Bussi alla baracca dei Custodi e metti la licenza della Gilda sotto il naso del caposquadra,
            ancora in camicia da notte e con un segno di cuscino su una guancia. Lui passa il pollice sul
            sigillo in rilievo prima ancora di accendere la lanterna. Poco dopo sulla passerella ci sono sei
            uomini con le lanterne.

            I tre Scuri non possono fare a botte con mezza squadra dei Custodi sotto gli occhi del ponte, e se
            ne vanno brontolando. Il caposquadra apre lo sportello per te. Sulla ricevuta dei mercenari di
            Galdrick, stavolta, ci metti il tuo nome vero.
          pe: { galateo: 5 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
          imposta: { colpo.cassa: 1 }

  # ------------------------------------------------------------ 3 → 4 · il carceriere
  - id: il-carceriere
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: La chiave disegnata
    sommario: "Ogni volta gli Scuri sono arrivati prima di te. Galdrick ha guardato a lungo la sigla con la chiave, e adesso vuole parlarne."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo, a sera
    area: quartieri-alti
    requisiti: [pista.pelle == 3, colpi.scuri >= 2, pista.arena != 1, pista.arena != 2, pista.arena != 3, pista.arena != 4]
    testo: |
      Sul tavolo di Galdrick c'è un foglio con la sigla dei conti di Ottone, *Ca*, e accanto una chiave
      disegnata fino all'ultimo dente. Il tratto è di matita dura, e sui denti è ripassato tante volte che la
      carta è diventata lucida. Sotto il calendario la cassa di ferro a due chiavi è aperta, e dentro ci sono
      gli ordini di servizio per i mercenari di Ghoran, uno per ogni tuo colpo. Le due serrature stanno a filo
      del coperchio, e intorno a quella di destra il ferro ha una raggiera di graffi chiari che la ruggine non
      ha ancora coperto.

      {origine fuggiasco-di-ghoran} Sugli ordini c'è scritto Ghoran così tante volte che il nome smette di
      sembrare un posto. Li leggi con le spalle curve come davanti ai sorveglianti dei recinti, e le raddrizzi
      apposta.

      {percezione Media} La chiave l'ha disegnata a memoria, perché la vede passare ogni sera davanti al suo
      ufficio. I denti sono precisi e l'impugnatura è appena abbozzata, perché chi la porta la tiene sempre
      chiusa nel pugno.

      «Ogni volta sono arrivati prima di te» dice senza alzare gli occhi. «Dei posti sapevamo io e il furiere,
      e lo sapeva questa cassa. Le carte di Ottone le tengo a casa mia. Gli ordini con il giorno e l'ora li
      scrive il furiere e la sera li chiude qui dentro.» Batte un dito sulla chiave disegnata. «La seconda
      chiave ce l'ha lui, che dorme a casa sua. Di notte le copie di tutte le chiavi della Caserma stanno
      appese a un anello solo giù nelle celle.»

      Dal corridoio arriva il rumore di un secchio posato sulla pietra, poi un passo pesante che scende verso
      le celle. Il passo arriva fino in fondo, e per tutta la discesa non si sente il tintinnio di una chiave.

      «Un quarto dei miei è pagato da Vesh» dice a voce più bassa. «Se lo accuso io, la Caserma si spacca in
      due. Mi serve che qualcuno di fuori lo veda con le mani nella cassa.»
    opzioni:
      - testo: "Chiedere a Galdrick di Borso"
        immagine: personaggi/borso
        requisiti: [pista.arena < 2]
        costo: 0
        esito:
          titolo: La scatola di latta
          testo: |
            «L'ho preso io, otto anni fa» dice Galdrick. «Era arrivato da Ghoran con il naso rotto e
            nient'altro, e in cella non si è mai fatto comprare da un detenuto, nemmeno per un tozzo di
            tabacco. Mette da parte ogni moneta in una scatola di latta, per riscattare i figli dai mercati di
            Ghoran.»

            Mentre parla strofina con il pollice il bordo della chiave disegnata, e la grafite gli lascia il
            polpastrello grigio.

            «Vesh paga meglio della Caserma, e paga prima. Ci voleva poco a capirlo, e io in otto anni non
            l'ho capito.»
      - testo: "Chiedere a Galdrick di Borso"
        immagine: personaggi/borso
        requisiti: [pista.arena >= 2, mischia == 1]
        costo: 0
        esito:
          titolo: Spinto fuori dal recinto
          testo: |
            «Per il torneo gli ho dato la licenza» dice Galdrick, «e nella Mischia lui, insieme a Durgan, mi
            ha spinto fuori dal recinto a due mani. Ho riso, mi sembrava una cosa da caserma.»

            Si interrompe quando dalle celle sale il rumore di un mestolo sul ferro, e riprende a voce più
            bassa.

            «L'ho preso io otto anni fa, quando è arrivato da Ghoran con il naso rotto. Mette da parte ogni
            moneta in una scatola di latta per riscattare i figli dai mercati di Ghoran, e Vesh paga prima
            della Caserma. In otto anni non l'ho capito.»
      - testo: "Chiedere a Galdrick di Borso"
        immagine: personaggi/borso
        requisiti: [pista.arena >= 2, mischia != 1]
        costo: 0
        esito:
          titolo: La licenza
          testo: |
            «Per il torneo gli ho dato la licenza» dice Galdrick. «Voleva fracassare qualche cranio, e l'ho
            lasciato fare, perché mi sembrava una cosa da caserma.»

            Si appoggia allo schienale, e il legno della sedia scricchiola sotto il suo peso.

            «L'ho preso io otto anni fa, quando è arrivato da Ghoran con il naso rotto. Mette da parte ogni
            moneta in una scatola di latta per riscattare i figli dai mercati di Ghoran, e Vesh paga prima
            della Caserma. In otto anni non l'ho capito.»
      - testo: "Aspettarlo nell'ufficio, al buio"
        descrizione: "Se è lui, stanotte scende a guardare la cassa. Dietro l'armadio delle pratiche c'è posto per una persona sola."
        prova: { attributo: mentale, abilita: [percezione, furtivita], difficolta: Media }
        successo:
          titolo: Le mani nella cassa
          testo: |
            Ti nascondi dietro l'armadio delle pratiche e aspetti, con l'odore di carta vecchia e di topo
            nelle narici. Dopo la terza campana la porta si apre senza rumore. Borso entra in calze, con
            l'anello delle chiavi stretto nel pugno perché non tintinni. Le calze sono di lana grossa e sulle
            assi non fanno rumore, perché lui mette i piedi soltanto lungo il muro. Apre la cassa di ferro con
            due chiavi che non dovrebbe avere, e copia l'ordine di servizio su un foglietto con la sua matita
            minuscola, muovendo le labbra sulle parole.

            Quando esci dall'ombra non scappa subito. Lo piega in quattro con cura e se lo mette in bocca.
          effetti: { rep.caserma: 1 }
          segue: la-fuga-di-borso
        fallimento:
          titolo: Un'asse che scricchiola
          testo: |
            Ti nascondi dietro l'armadio delle pratiche, ma dopo la seconda campana ti si addormenta una
            gamba, mille formiche dal ginocchio in giù, e la sposti. L'asse sotto il tuo piede scricchiola. La
            porta si stava aprendo, e finché resta socchiusa ti arriva sul collo l'aria fredda del corridoio.
            Poi si richiude piano. Nel corridoio senti un passo pesante che torna verso le celle senza fretta.

            All'alba la cassa di ferro è chiusa e l'anello delle chiavi pende dal suo chiodo, come tutte le
            mattine. Adesso però Borso sa che lo aspettavate.
          effetti: { sospetto: 1 }
          segue: la-fuga-di-borso
      - testo: "Fargli sentire un posto che non esiste"
        descrizione: "Si può nominare davanti a lui una quarta cassa, e poi guardare chi ci va."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Il quinto pilone
          testo: |
            Scendi alle celle all'ora del rancio, fra l'odore di zuppa di cavolo e quello dei secchi, e
            passando davanti al tavolo in fondo al corridoio chiedi a Galdrick quanti uomini servono per il
            quinto pilone. Borso conta le sue monete senza alzare la testa. Finché resti nel corridoio la
            stessa moneta gli gira fra il pollice e l'indice, e il mucchio sul tavolo non cresce.

            All'alba la piattaforma di servizio è bagnata di nebbia, e ci arrivano quattro Scuri con i piedi
            di porco. Dietro i sacchi di paglia li aspettano i mercenari di Galdrick. Uno dei quattro, prima
            ancora che lo leghino, giura che la soffiata viene dalle celle della Caserma.
          pe: { ingannare: 5 }
          effetti: { rep.caserma: 1 }
          segue: la-fuga-di-borso
        fallimento:
          titolo: Troppo forte
          testo: |
            Scendi alle celle all'ora del rancio e chiedi a Galdrick del quinto pilone, ma lo chiedi troppo
            forte, e gli occhi ti scappano su Borso prima che tu possa trattenerli. Lui smette di contare e
            rimette le monete nella scatola di latta una alla volta. Nel corridoio non parla nessuno, e si
            sente ogni moneta battere sul fondo. Poi ti guarda a lungo da sotto le sopracciglia, e capisce.

            Quella notte nessuno va al quinto pilone. Galdrick passa la sera alla finestra dell'ufficio a
            guardare il cortile, con i pollici nella cintura.
          effetti: { sospetto: 1 }
          segue: la-fuga-di-borso
      - testo: "Affrontarlo nelle celle"
        immagine: personaggi/borso
        descrizione: "Lo prendi da solo nel corridoio delle celle, prima che finisca il rancio. Le chiavi le porta legate al pugno."
        combattimento: borso
        vittoria:
          titolo: Il grembiule di cuoio
          testo: |
            Borso picchia con il pugno chiuso sull'anello delle chiavi, e ogni colpo ti lascia addosso
            l'impronta di una serratura. L'anello gli è legato al polso con una cinghia, e non c'è modo di
            strapparglielo.

            Alla fine lo metti in ginocchio sulla paglia di una cella vuota. Nella tasca del grembiule ha un
            foglietto con l'ordine di servizio copiato a matita, e le parole che non sapeva scrivere le ha
            disegnate. Accanto c'è la matita, consumata fino a un mozzicone che sta tutto fra due dita.

            Galdrick scende le scale di corsa e si ferma sull'ultimo gradino. Guarda prima il foglietto e poi
            Borso, a lungo, senza dire niente.
          effetti: { rep.caserma: 1 }
          segue: la-fuga-di-borso
        sconfitta:
          titolo: La paglia
          testo: |
            Borso ti prende per il collo della giubba e ti sbatte contro le sbarre finché le sbarre non
            smettono di girare. Ti lascia sulla paglia di una cella vuota e chiude la porta a chiave con
            calma, come tutte le sere, e prima di salire le scale controlla che la serratura abbia fatto il
            suo scatto. La paglia sotto la tua guancia è umida e sa di calce.

            Galdrick ti apre poco dopo con la seconda copia della chiave. Nel corridoio la scatola di latta
            non c'è più, e dal chiodo dove stava appeso l'anello delle chiavi pende soltanto un pezzo di
            spago.
          effetti: { tormento: 1 }
          segue: la-fuga-di-borso
      - testo: "Mettergli paura"
        descrizione: "Al tavolo del rancio, davanti alla scatola di latta. Borso alza la voce di rado, e chi lo conosce sa che è meglio così."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: I figli a Ghoran
          testo: |
            Gli parli della corda che aspetta un carceriere venduto, e di chi resta senza le monete della
            scatola di latta quando il carceriere non le manda più. Lui ascolta con una mano sul coperchio
            della scatola, che è ammaccato su un angolo e chiude soltanto se lo premi.

            «Vesh paga prima» dice alla fine, con la voce bassa di sempre. «La Caserma paga a fine mese, e a
            Ghoran i mercanti di bambini non aspettano.» Tira fuori dal grembiule un foglietto con l'ordine di
            servizio copiato a matita e lo posa sul tavolo, accanto alla latta.
          effetti: { rep.caserma: 0.5 }
          segue: la-fuga-di-borso
        fallimento:
          titolo: La clava corta
          testo: |
            Gli posi una mano sopra la pila delle monete e cominci a parlare della scatola di latta e di chi
            aspetta quelle monete. Sotto il palmo le monete sono ancora tiepide delle sue dita. Borso ti
            lascia finire senza interromperti, e questo avrebbe dovuto metterti in allarme. Poi si alza, e la
            clava corta che porta alla cintura gli è già passata in mano senza che tu la veda muoversi.

            «Dei miei figli tu non parli» dice, con la clava ferma a un palmo dal tuo petto. Quando Galdrick
            scende a vedere, Borso ha già staccato l'anello delle chiavi dal chiodo e sta salendo verso il
            cortile.
          effetti: { ferite: 2 }
          segue: la-fuga-di-borso
      - testo: "Parlargli dei mercanti di bambini di Ghoran"
        descrizione: "Borso manda le monete a Ghoran, dove i mercanti di bambini non aspettano la fine del mese."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [intimidire, empatia], difficolta: Media }
        successo:
          titolo: La bilancia del mercato
          testo: |
            Ti siedi al suo tavolo mentre conta e gli racconti della bilancia del mercato di Ghoran, dei
            bambini che ci fanno salire per primi perché pesano poco e si vendono bene. Gli dici che quando un
            carceriere venduto finisce sulla corda le monete smettono di partire, e che i mercanti lo sanno
            prima della famiglia. Mentre parli lui smette di contare, e la moneta che aveva in mano resta in
            bilico sul bordo della latta.

            «Vesh paga prima» dice alla fine. Tira fuori dal grembiule un foglietto con l'ordine di servizio
            copiato a matita e lo posa sul tavolo, accanto alla latta.
          effetti: { rep.caserma: 0.5 }
          segue: la-fuga-di-borso
        fallimento:
          titolo: Proprio tu
          testo: |
            Cominci a parlargli della bilancia di Ghoran, e a metà Borso alza gli occhi dalle monete. La clava
            corta gli passa in mano senza che tu la veda muoversi, e il primo colpo ti prende sotto le costole
            e ti lascia senz'aria.

            «Proprio tu vieni a dirmi di Ghoran» dice, con la clava ferma a un palmo dal tuo petto e la voce
            che finalmente gli trema. Quando Galdrick scende a vedere, Borso ha già staccato l'anello delle
            chiavi dal chiodo e sta salendo verso il cortile.
          effetti: { ferite: 2 }
          segue: la-fuga-di-borso
      - testo: "Aspettarlo al buio come alla posta nel Bosco"
        descrizione: "Al Circolo ti hanno insegnato ad aspettare una bestia senza muovere niente, nemmeno il respiro. Un carceriere in calze fa più rumore di un cervo."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: La posta
          testo: |
            Ti accucci dietro l'armadio delle pratiche come al Circolo ti hanno insegnato ad aspettare sotto
            il vento, con il peso sui talloni e le mani ferme sulle ginocchia. Dopo un po' non senti più
            nemmeno l'odore di carta vecchia e di topo. Alla terza campana la porta si apre senza rumore.
            Borso entra in calze, con l'anello delle chiavi stretto nel pugno perché non tintinni. Sulle assi
            le calze fanno un fruscio che un cervo sul muschio non farebbe.

            Apre la cassa di ferro con due chiavi che non dovrebbe avere, e copia l'ordine di servizio su un
            foglietto con la sua matita minuscola, muovendo le labbra sulle parole. Quando esci dall'ombra non
            scappa subito. Lo piega in quattro con cura e se lo mette in bocca.
          effetti: { rep.caserma: 1 }
          segue: la-fuga-di-borso

  - id: la-fuga-di-borso
    presso: guarnigione-di-qir-azel
    immagine: personaggi/borso
    titolo: Il cane della Caserma
    tipo: seguito
    luogo: Guarnigione di Qir-Azel, il cortile
    area: quartieri-alti
    requisiti: [pista.pelle == 3]
    testo: |
      Borso attraversa il cortile della Caserma con l'anello delle chiavi delle celle infilato al braccio,
      dove di solito porta il secchio del rancio. Le chiavi fanno un mazzo grosso come un pugno, e battono sul
      grembiule di cuoio con un suono smorzato. Una delle guardie del portone solleva la sbarra prima che lui
      gliel'abbia chiesto, e sugli spalti le balestre restano abbassate.

      Galdrick lo guarda dalla scala dell'ufficio con i pollici nella cintura e la faccia di un uomo davanti a
      un cane rabbioso che ha addestrato con le sue mani. Le nocche gli sono diventate bianche contro la
      fibbia.

      «Lascialo andare» dice piano. «Se lo fermiamo qui, stanotte nel cortile ci tiriamo addosso le balestre.»
      Sulla soglia Borso si gira una volta sola verso le celle, poi prende la discesa della Città Bassa. La
      sbarra è una trave di quercia ferrata, e quando ricade dietro di lui il colpo rimbalza fra i muri del
      cortile. La guardia che l'ha alzata si pulisce le mani sulla giubba.
    opzioni:
      - testo: "Ripensare a quello che ti ha detto Borso"
        requisiti: [pista.arena >= 2]
        costo: 0
        esito:
          titolo: Il recinto
          testo: |
            Passandoti accanto Borso si è chinato appena, così vicino che hai sentito l'odore di cuoio del
            grembiule. «All'Arena ti ho visto nel recinto» ha detto con la voce bassa di sempre. «Ti ha visto
            anche Mauro. Stai attent{o|a}, quando passi dalla Pignatta.»

            Galdrick ha sentito. Tira fuori il taccuino e ci scrive una riga corta con la sua matita, e preme
            tanto che la punta buca la carta.
          segue: la-fuga-di-borso
      - testo: "Scendere alle celle con Galdrick"
        requisiti: [maedric == 2]
        esito:
          titolo: La cella di Maedric
          testo: |
            Le celle degli Scuri presi nelle ultime settimane sono aperte e vuote, e le porte dondolano ancora
            sui cardini senza un cigolio. È vuota anche quella in fondo, dove dormiva Maedric Holl. Sulla
            paglia è rimasto il suo mantello cerato, piegato in quattro con una cura che in quella cella non
            serviva a niente.

            Galdrick scrive due righe nel taccuino. «Fra qualche giorno Vesh saprà tutto quello che sapeva
            Maedric» dice, «e noi di giorni non ne abbiamo più.» Chiude il taccuino e sale a scrivere a Julia.
          imposta: { maedric: 1 }
          effetti: { pista.pelle: 1 }
      - testo: "Scendere alle celle con Galdrick"
        requisiti: [maedric != 2]
        esito:
          titolo: Le celle aperte
          testo: |
            Le celle degli Scuri presi nelle ultime settimane sono aperte e vuote, e le porte dondolano ancora
            sui cardini. Sulla polvere del corridoio le impronte delle suole vanno tutte verso le scale. In
            quella in fondo un ubriaco di Via del Salmone russa nella paglia con la porta spalancata, e
            nessuno si è preso la briga di svegliarlo.

            Galdrick scrive due righe nel taccuino. «Adesso Vesh sa tutto quello che sapeva Borso» dice, «cioè
            quasi tutto quello che so io.» Chiude il taccuino e sale a scrivere a Julia.
          effetti: { pista.pelle: 1 }

  # ------------------------------------------------------------ 4 → 5 · il Municipio all'alba
  - id: il-municipio-all-alba
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: L'alba non porta luce
    sommario: "Julia Castaldi ti ha convocato in Municipio all'alba. Sul tavolo della sala consiliare ci sono tutte le carte che hai portato."
    luogo: Municipio, la sala consiliare, all'alba
    area: quartieri-alti
    requisiti: [pista.pelle == 4]
    testo: |
      Julia Castaldi è vestita di scuro, senza nemmeno la spilla del Consiglio. Toren Galdrick porta
      l'armatura completa, e a ogni passo le piastre tintinnano. Il ferro è opaco di grasso, e sulla spalla
      sinistra ha un'ammaccatura ribattuta a martello.

      Le candele della notte sono consumate fino al piattino, e dalla finestra la luce dell'alba arriva ancora
      troppo grigia per leggere. Sul tavolo il furiere ha ordinato le prove in pile, e ogni pila è tenuta
      ferma da un peso d'ottone. Accanto alle lettere con l'alloro e alle carte del caveau ci sono le ricevute
      delle casse degli Scuri con la tua firma.

      {politica-ed-economia Media} Su quel tavolo c'è la rovina di un Casato, e il primo a pagarla sarà chi
      compra il pane dai suoi forni.

      «Ottone Malgrani è finito» dice Julia con la voce roca. «Va in tribunale per estorsione e collusione con
      i criminali, e qui dentro non c'è niente che un avvocato della Gilda possa spiegare.» Si lascia cadere
      su una sedia. «Il guaio è che ogni carta la paga la Città Bassa, cioè la gente che volevamo proteggere.
      A questo punto però non mi tiro indietro.»

      {origine rampollo-dei-quartieri-alti} Ai pranzi del Consiglio Julia porta sempre la spilla. Senza ti
      sembra più giovane e più stanca.
    opzioni:
      - testo: "Ascoltare Galdrick"
        immagine: personaggi/toren-galdrick
        costo: 0
        esito:
          titolo: La linfa
          testo: |
            Galdrick parla del grano e del legname, contando sulle dita del guanto, che sono fatte a lamelle e
            non si piegano bene. Se trascinano Ottone in tribunale gli Scuri si muovono e saltano gli accordi
            della Gilda, e le prime settimane la gente comune le pagherà in pane. Julia lo ascolta con gli
            occhi sulle carte, poi dice piano che in questi anni Mirko Vesh ha costruito una rete.

            «Ed è dappertutto» dice Galdrick, senza sciogliere le braccia. «Per dieci anni l'ho tenuto dentro
            la Città Bassa, e intanto ho fermato bande e rivolte. Adesso è una guerra. Un quarto dei miei
            uomini l'ha già comprato, e se non colpiamo per primi colpisce lui.»
      - testo: "Chiedere della Città Bassa"
        costo: 0
        esito:
          titolo: Il braciere
          testo: |
            Julia indica la finestra e la nebbia che sale dalla Città Bassa e appanna i vetri a partire dal
            basso. «Allora, laggiù è pieno di disperati, gente che negli Scuri trova un lavoro e qualcuno che
            la protegge. Se scendiamo addosso a Mirko con gli stendardi della città, difenderanno lui» dice, e
            incrocia le braccia.

            «Mirko la guerra con noi l'ha già cominciata» risponde Galdrick con una voce fredda che non gli
            conoscevi. «E tu sottovaluti chi sta laggiù, perché molti non vedono l'ora che Vesh sparisca»
            aggiunge, facendo un passo verso di lei.
      - testo: "Chiedere per Lucia Malgrani"
        immagine: personaggi/lucia-malgrani
        requisiti: [lucia == 1]
        costo: 0
        esito:
          titolo: Testimone
          testo: |
            Racconti di Lucia Malgrani, di quello che ti ha detto quella notte e di come ti ha aiutato, e ti
            accorgi di scegliere le parole con più cura del solito. Julia ti ascolta con la penna ferma a
            mezz'aria, finché una goccia d'inchiostro non cade sul foglio e si allarga nella carta. «Se
            collabora, la prendiamo come testimone e senza catene» dice alla fine, e scrive una riga a margine
            del mandato.
      - testo: "Dire a Galdrick che verrai con lui"
        immagine: personaggi/toren-galdrick
        esito:
          titolo: La bocca del lupo
          testo: |
            Gli dici che verrai con lui, e ti accorgi di avere abbassato la voce mentre lo dici. «Il mandato
            per il Maniero parte stanotte, e noi intanto scendiamo alla Pignatta» dice, battendo il guanto di
            ferro sulle carte, e le pile si spostano di un dito sul tavolo. «Vesh sa già tutto quello che
            sapeva Borso» aggiunge guardando Julia. «Se aspettiamo un'altra notte, ci aspetta lui con tutta la
            Città Bassa.»

            «Che la luce del Velo ci assista. D'accordo, lo faremo» dice lei dopo un lungo silenzio.
          effetti: { pista.pelle: 1, rep.caserma: 0.5 }
          vai: citta-bassa
      - testo: "Dare ragione a Julia, e andare lo stesso"
        immagine: personaggi/julia-castaldi
        esito:
          titolo: La gente da guardare
          testo: |
            Dici a Julia che ha ragione a temere la folla, e che verrai lo stesso, perché laggiù qualcuno
            dovrà guardare in faccia la gente prima di colpirla. «Allora tienila d'occhio tu, la gente, perché
            Toren guarderà soltanto Vesh» dice alla fine, senza alzare la voce.

            Lei firma il mandato per il Maniero sotto la firma dello sceriffo, con la penna che gratta la
            carta. La firma di Galdrick è larga e storta, e la sua ci sta sotto stretta e dritta. «Che la luce
            del Velo ci assista» dice mentre soffia sull'inchiostro.
          effetti: { pista.pelle: 1, rep.castaldi: 0.5 }
          vai: citta-bassa

  # ------------------------------------------------------------ 5 · l'assalto alla Pignatta
  - id: l-assalto-alla-pignatta
    presso: pignatta-grassa
    immagine: personaggi/mirko-vesh
    titolo: L'assalto alla Pignatta
    sommario: "Galdrick scende in Città Bassa con i suoi miliziani e i mercenari di Ghoran. Mirko Vesh lo aspetta sulla porta."
    luogo: Pignatta Grassa, lo spiazzo, di notte
    area: citta-bassa
    requisiti: [pista.pelle == 5]
    testo: |
      Lo spiazzo della Pignatta è illuminato da decine di lanterne appese ai fili, e le porte della taverna
      sono spalancate. I fili sono tesi da un tetto all'altro, e le lanterne pendono basse sopra il fango.
      Davanti alla porta Mirko Vesh, magro ed elegante, si appoggia a un bastone da passeggio con un anello a
      ogni dito.

      Ai lati ha i suoi quattro tenenti. Mauro Scrocco si è tolto la camicia sgargiante e ha in mano un'ascia
      da boscaiolo. Rozalia Marga si rigira fra le dita due stiletti sottili, e le lame le passano fra le
      nocche senza toccarle. Nestor Gramm scuote una boccetta verde con gli occhi febbrili, e Borso guarda
      soltanto Galdrick con l'anello delle chiavi della Caserma alla cintura.

      {armi-da-mischia Media} L'ascia di Mauro è pesante in punta e torna indietro piano, da attrezzo per la
      legna qual è. Il manico è lungo e liscio, e chi la usa deve caricare il colpo con le spalle.

      Mirko alza una mano, e dai vicoli escono centinaia di sagome con randelli e bottiglie rotte. Qualcuno ha
      avvolto uno straccio intorno al collo della bottiglia per non tagliarsi. Molti sono ragazzi che hanno
      paura, e guardano te.

      {origine figlio-della-citta-bassa} Metà di quelle facce le hai viste crescere fra le fucine, e in quelle
      mani il randello ti sembra un giocattolo raccolto per strada.

      «È una trappola» sussurra Galdrick, poi alza la voce. «Vesh! Sei in arresto per ordine del Consiglio,
      insieme ai tuoi tenenti!»

      Mirko ride. «Toren, vecchio amico, stanotte non arresti nessuno. Vieni dentro, che ne parliamo noi due.»

      Le due lame escono insieme dai foderi e i due uomini spariscono dentro la Pignatta. Le porte sbattono
      alle loro spalle, e sopra lo spiazzo le lanterne dondolano tutte insieme sui fili. Qua fuori adesso
      tocca a te.
    opzioni:
      - testo: "Colpire di piatto e farti strada fino ai tenenti"
        descrizione: "Il piatto della lama e l'elsa per chi ti viene addosso dalla folla. Mauro e i suoi, invece, li cerchi davvero."
        combattimento: i-tenenti-di-vesh
        vittoria:
          titolo: Non vogliono ucciderci
          testo: |
            Ti fai strada a colpi di piatto e d'elsa, con il braccio che comincia a bruciarti già al decimo
            colpo, e chi cade si rialza e scappa. Mauro ti viene incontro con l'ascia alta e uno dei suoi
            ragazzi al fianco, e quando finalmente va giù fa tremare le lanterne.

            Nestor Gramm posa la boccetta per terra e alza le mani, e il vetro verde resta in piedi nel fango.
            Rozalia rompe un fumogeno ai suoi piedi, e quando il fumo si dirada è sparita. Borso lo tengono in
            quattro, i mercenari di Ghoran, e lui continua a guardare le porte chiuse della Pignatta.
          effetti: { nomea.citta-bassa: 2 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        sconfitta:
          titolo: La milizia
          testo: |
            Ti fai strada a colpi di piatto, ma la folla si chiude e Mauro ti arriva addosso dalla parte
            sbagliata. L'ascia ti prende di striscio sulla spalla, e un ragazzo ti spacca una bottiglia sulla
            nuca, poi la guarda come se non sapesse da dove gli sia venuta.

            Ti rimettono in piedi i miliziani di Galdrick, arrivati di corsa con gli scudi alzati e il cuoio
            già rigato dai cocci. Mauro e il suo ragazzo li prendono in sei. Nestor si è arreso da solo, di
            Rozalia resta il fumo di un fumogeno, e Borso lo tengono a terra in quattro.
          effetti: { nomea.citta-bassa: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Parlare alla folla"
        descrizione: "Sono centinaia, e la metà sono ragazzi pagati a settimana. Se qualcuno gli parla prima che volino le bottiglie, qualcuno torna a casa."
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Difficile }
        successo:
          titolo: La settimana è finita
          testo: |
            Sali su un carro rovesciato all'angolo dello spiazzo, che ha le assi viscide di fango. Parli forte
            e senza la spada in mano, con il cuore che ti batte in gola e la voce che per fortuna non lo sa.
            Dici che la Caserma è venuta per Vesh e per i suoi tenenti, e che a chi torna a casa stanotte
            nessuno chiederà il nome.

            Mauro guarda la sua folla che se ne va e abbassa l'ascia, e i mercenari di Ghoran gli sono addosso
            prima che la rialzi. Nestor Gramm posa la boccetta per terra. Di Rozalia resta il fumo di un
            fumogeno, e Borso lo legano in quattro.
          pe: { persuasione: 5 }
          effetti: { nomea.citta-bassa: 2 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: Le bottiglie
          testo: |
            Sali su un carro rovesciato all'angolo dello spiazzo e cominci a parlare, ma prima della terza
            frase una bottiglia ti prende sulla fronte, e il mondo diventa per un momento bianco e molto
            silenzioso. Qualcuno ascolta lo stesso. Mentre scendi dal carro con il sangue negli occhi vedi un
            gruppo di ragazzi lasciare i randelli contro un muro e sparire in un vicolo.

            Quando la folla si sparpaglia lo spiazzo resta pieno di cocci e di lanterne cadute. I tenenti di
            Vesh sono a terra o in catene, tutti tranne Rozalia, che ha lasciato soltanto il fumo di un
            fumogeno.
          effetti: { ferite: 2, nomea.citta-bassa: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Ricordare a Mauro l'Arena"
        immagine: personaggi/mauro-scrocco
        descrizione: "Mauro è uscito dal suo quadrante umiliato davanti a mezza città. Stanotte, sullo spiazzo, la mezza città è la stessa."
        requisiti: [pista.arena >= 3]
        prova: { attributo: sociale, abilita: [intimidire, espressivita], difficolta: Media }
        successo:
          titolo: Il quadrante
          testo: |
            Gli gridi dall'altra parte dello spiazzo che stanotte non c'è nessun cristallo a rimetterlo in
            piedi. Ti carica da solo con l'ascia alta, senza guardare dove mette i piedi, e inciampa nella
            corda di una lanterna caduta. La lanterna rotola nel fango e si spegne con uno sfrigolio.

            Gli sono addosso in sei, i mercenari di Ghoran, prima che si rialzi. Con Mauro a terra mezza folla
            perde la voglia e torna nei vicoli. Nestor alza le mani. Rozalia sparisce in una nuvola di
            fumogeno, e Borso si lascia legare senza smettere di guardare le porte della Pignatta.
          effetti: { nomea.citta-bassa: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: Il furore muto
          testo: |
            Gli gridi dell'Arena dall'altra parte dello spiazzo, e Mauro non risponde e non diventa nemmeno
            rosso. Sposta soltanto il peso sul piede dietro.

            Il primo colpo ti arriva prima che tu abbia finito di capire quanto è veloce un uomo così grosso,
            e il manico dell'ascia ti spacca il labbro e ti manda nel fango.

            Ti tirano via i miliziani di Galdrick, che lo prendono in sei con le corde. Nella confusione
            Nestor si arrende, e di Rozalia resta soltanto il fumo di un fumogeno. Borso lo legano contro il
            muro della Pignatta.
          effetti: { ferite: 2.5 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Puntare dritto ai tenenti"
        descrizione: "La folla la tengano i miliziani. Tu vai da Mauro, e degli altri ti occupi dopo."
        combattimento: mauro-scrocco
        vittoria:
          titolo: L'ascia nel fango
          testo: |
            Passi in mezzo alla folla senza guardarla, e lasci ai miliziani quelli che ti vengono addosso.
            Mauro ti aspetta davanti alle porte chiuse con l'ascia a due mani. Ha la pelle lucida di sudore
            sotto le lanterne, e ogni colpo che pari ti arriva fino alla spalla. Alla fine l'ascia finisce nel
            fango e lui ci cade sopra.

            Senza Mauro i tenenti si sfaldano. Nestor posa la boccetta e si siede per terra, Rozalia sparisce
            nel fumo di un fumogeno, e Borso lo prendono i mercenari di Ghoran.
          effetti: { rep.caserma: 0.5 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        sconfitta:
          titolo: Le porte chiuse
          testo: |
            Mauro ti aspetta davanti alle porte chiuse con l'ascia a due mani, e quando arrivi è lui a colpire
            per primo. Ti ritrovi con la schiena contro il legno della Pignatta e le sue mani intorno al
            collo, che sanno di cipolla e di resina, e il mondo ai bordi comincia a diventare nero, finché un
            mercenario di Ghoran non gli spacca un'asta sulla testa. L'asta si rompe in due con un colpo
            secco.

            Nestor si è arreso da solo e Borso è in catene, mentre di Rozalia resta il fumo di un fumogeno.
            Nella Città Bassa, domani, ricorderanno soprattutto le randellate della milizia.
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Aprirti la strada a qualunque costo"
        descrizione: "Chi ti si para davanti va giù e non si rialza. È la via più corta fino ai tenenti, e la Città Bassa guarda."
        prova: { attributo: fisico, abilita: [armi-da-mischia, armi-da-distanza, intimidire], difficolta: Difficile }
        successo:
          titolo: Gli assassini del governo
          testo: |
            Il primo ragazzo che ti si para davanti con una bottiglia rotta va giù e resta giù, con la
            bottiglia ancora stretta nel pugno, e il secondo fa la stessa fine. Dopo il terzo la folla si apre
            davanti a te urlando, e in mezzo alle urla qualcuno grida «Gli assassini del governo!», e il grido
            corre per i vicoli.

            Arrivi da Mauro con la lama già sporca, e lui cade davanti alle porte chiuse della Pignatta e non
            si muove più. Nestor alza le mani tremando e Borso si lascia legare. Di Rozalia resta soltanto il
            fumo di un fumogeno. Sotto le lanterne dello spiazzo restano otto corpi, e soltanto uno era un
            tenente di Vesh.
          effetti: { nomea.citta-bassa: -2, tormento: 1 }
          imposta: { mauro: 2 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: Una notte da ricordare
          testo: |
            Ti butti nella folla, ma la folla è più grande di quanto pensavi e non scappa. Ti si chiude
            intorno, e l'odore di vino e di sudore è così fitto che non trovi l'aria. Ti trascinano fuori i
            mercenari di Ghoran, con un taglio sul fianco e le nocche spaccate.

            I tenenti li prendono loro, tranne Rozalia, sparita nel fumo di un fumogeno. Sullo spiazzo restano
            i corpi dei ragazzi, e dietro le imposte chiuse la Città Bassa ha visto chi li ha messi lì.
          effetti: { nomea.citta-bassa: -2, ferite: 2.5, tormento: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Guardare Rozalia"
        immagine: personaggi/rozalia-marga
        descrizione: "Si rigira gli stiletti fra le dita e tiene gli occhi sui vicoli. Rozalia i conti li fa sempre prima degli altri."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Media }
        successo:
          titolo: In pari
          testo: |
            Le arrivi accanto mentre la folla avanza e le dici a bassa voce che stanotte la Pignatta cade
            comunque, e che una falsaria senza padrone trova lavoro in qualunque città.

            «Per la precisione, tesoro, Mirko i ragazzi li paga fino a stasera» dice. Poi grida verso i
            vicoli, con una voce da pescivendola, che la paga è finita. Quando ti volti di nuovo lei è
            sparita, e al suo posto resta un filo di fumo grigio che sa di zolfo. Senza i ragazzi i tenenti
            restano in pochi, e la milizia li prende uno alla volta.
          effetti: { nomea.citta-bassa: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: Il fumogeno
          testo: |
            Le arrivi accanto e cominci a parlare, ma Rozalia ha già fatto i suoi conti senza di te. Ti
            sorride con tutta la bocca, e lo stiletto che aveva fra le dita ti apre la manica e il braccio dal
            polso al gomito, così pulito che il dolore arriva dopo. Poi rompe un fumogeno ai tuoi piedi.

            I tenenti li prendono i mercenari di Ghoran, uno alla volta, mentre tu ti stringi il braccio nel
            fazzoletto e il fazzoletto si inzuppa fino al nodo.
          effetti: { ferite: 2 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Curare un ragazzo davanti a tutti"
        descrizione: "Al primo scontro un ragazzo della folla è caduto con la testa aperta. La Liturgia dell'Albero chiude le ferite, e la folla guarda."
        incantesimo: rimarginare
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le mani sulla ferita
          testo: |
            Gli posi le mani sulla testa e preghi l'Albero ad alta voce, e la voce ti trema meno di quanto
            temessi. Sotto le tue dita la ferita si chiude sotto una pelle rosa senza crosta, e il ragazzo
            apre gli occhi e chiama sua madre.

            Una donna esce dalla folla e se lo prende in braccio. Dietro di lei se ne vanno in tanti, a
            gruppi, lasciando i randelli per terra. Sullo spiazzo i tenenti di Vesh restano con pochi dei
            loro, e la milizia li prende uno alla volta. Soltanto Rozalia sparisce, nel fumo di un fumogeno.
          effetti: { nomea.citta-bassa: 2, rep.velo: 0.5 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: La preghiera interrotta
          testo: |
            Ti inginocchi accanto al ragazzo e preghi l'Albero ad alta voce, ma la ferita sotto le tue dita
            sanguina ancora quando una bottiglia ti prende alla schiena, e un randello alla nuca. Il sangue
            del ragazzo ti resta caldo sulle mani. Il ragazzo lo portano via due donne, svenuto. La folla ha
            visto lo stesso che cosa cercavi di fare, e una parte se ne torna nei vicoli.

            Gli altri li tiene la milizia. Quando ti rialzi i tenenti di Vesh sono in catene, tranne Rozalia
            che è sparita nel fumo.
          effetti: { nomea.citta-bassa: 1, ferite: 1.5, tormento: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Chiamare per nome i ragazzi della tua strada"
        descrizione: "Metà di quelle facce le conosci. Hai giocato con i loro fratelli maggiori sotto le fucine, e sai di quale madre hanno più paura."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Media }
        successo:
          titolo: I nomi
          testo: |
            Chiami il figlio del bottaio, quello con l'orecchio storto, e le due sorelle della strada delle
            fucine, e a ogni nome aggiungi quello della madre, che a quest'ora li aspetta sveglia. Il figlio
            del bottaio abbassa il randello per primo e si guarda intorno per vedere chi l'ha visto. Al quinto
            se ne vanno a gruppi, e i vicoli si svuotano dietro di loro.

            Mauro guarda la sua folla che se ne va e abbassa l'ascia, e i mercenari di Ghoran gli sono addosso
            prima che la rialzi. Nestor Gramm posa la boccetta per terra. Di Rozalia resta il fumo di un
            fumogeno, e Borso lo legano in quattro.
          pe: { persuasione: 5 }
          effetti: { nomea.citta-bassa: 2 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: La prima bottiglia
          testo: |
            Sali su un carro rovesciato e cominci a chiamare i nomi, e il primo che chiami ti tira una
            bottiglia sulla fronte, con una mira che da bambino non aveva. La bottiglia era piena, e ti lascia
            la faccia bagnata di vino aspro. Qualcuno ascolta lo stesso. Mentre scendi dal carro con il sangue
            negli occhi vedi due sorelle della strada delle fucine lasciare i randelli contro un muro e
            sparire in un vicolo.

            Quando la folla si sparpaglia i tenenti di Vesh sono a terra o in catene, tutti tranne Rozalia,
            che ha lasciato soltanto il fumo di un fumogeno.
          effetti: { ferite: 2, nomea.citta-bassa: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Aprire ai ragazzi la porta del retrobottega"
        descrizione: "Siedi al tavolo d'angolo, e conosci la porta del retrobottega, che dà sul vicolo dei barili."
        quando: [fazione.scuri >= 9]
        esito:
          titolo: La porta dei barili
          testo: |
            Giri intorno allo spiazzo rasente il muro, dove le lanterne non arrivano, e tiri il paletto della
            porta del retrobottega. Il paletto è di ferro unto di grasso e scorre senza rumore. Poi fischi due
            volte, come si fischia al tavolo d'angolo quando arriva la ronda. I ragazzi più vicini ti
            riconoscono e passano di corsa nel vicolo dei barili.

            Mauro guarda la sua folla che se ne va dalla porta di Vesh e capisce chi l'ha aperta. Ti viene
            incontro con l'ascia alta, ma i mercenari di Ghoran gli sono addosso prima. Nestor Gramm posa la
            boccetta per terra, di Rozalia resta il fumo di un fumogeno, e Borso lo legano in quattro.
          effetti: { nomea.citta-bassa: 2 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh

  - id: galdrick-e-vesh
    presso: pignatta-grassa
    immagine: personaggi/toren-galdrick
    titolo: Dieci anni
    tipo: seguito
    luogo: Pignatta Grassa, fra le fiamme
    area: citta-bassa
    requisiti: [pista.pelle == 5]
    testo: |
      La Pignatta Grassa brucia e le travi del tetto crollano fra le scintille. Sono travi vecchie e nere di
      anni di fumo di cucina, e cedono una alla volta nel punto dove le tenevano i chiodi. Quando sfondi la
      porta del cortile delle risse il calore ti secca le labbra, e li trovi lì.

      Mirko Vesh ha la camicia strappata e la barba sporca di sangue, e la sciabola sottile riflette il rosso
      delle fiamme lungo tutto il filo. «Dieci anni, Galdrick, dieci anni che provi a prendermi» dice con un
      sorriso storto. Galdrick lascia cadere il mantello nella polvere. «I tuoi tenenti li abbiamo presi quasi
      tutti. Butta la sciabola, Vesh.»

      «La Città Bassa ha scelto me, Toren!» grida Mirko. «La Città Bassa ha paura di te, e basta» risponde
      Galdrick.

      Mirko scatta per primo, e la sciabola apre il fianco di Galdrick. Lo sceriffo barcolla e poi avanza
      dentro il colpo successivo, così vicino che la sciabola non ha più spazio per girare. Gli afferra il
      braccio e gli spinge la lama sotto la cassa toracica.

      «Dieci anni…» mormora Mirko sputando sangue. «Per questo?» Muore in ginocchio con gli occhi aperti,
      sorretto dall'uomo che lo ha ucciso.

      {medicina Facile} Il fianco di Galdrick sanguina a fiotti lenti e scuri che non seguono il battito del
      cuore, quindi la lama non ha preso un'arteria. Niente di importante è stato toccato, però un taglio così
      lasciato aperto diventa importante da solo.

      Galdrick si siede su un gradino con la spada piantata nella terra battuta. Alle sue spalle cede un'altra
      trave, e lui non si volta. «Dieci anni gli ho dato la caccia, ed è finita così» dice senza alzare la
      testa.
    opzioni:
      - testo: "Sederti sul gradino accanto a lui"
        costo: 0
        esito:
          titolo: La caccia
          testo: |
            «Dovrei dirti che l'ho fatto per la città e per la legge, ed è vero» dice Galdrick senza
            guardarti, con gli occhi sul punto dove Mirko è caduto. Lì la terra battuta è scura, e il calore
            dell'incendio la sta già seccando ai bordi.

            «Però c'era anche dell'altro. Gli davo la caccia da dieci anni, e ogni mattina mi alzavo per
            quello.»

            «Mi piaceva, ecco. Non l'ho mai detto a nessuno» aggiunge dopo un po', più piano.
          segue: galdrick-e-vesh
      - testo: "Chiedergli come si sente"
        costo: 0
        esito:
          titolo: Più leggero, o più vuoto
          testo: |
            Galdrick lascia cadere la testa all'indietro contro il muro e guarda il fumo, che sale dritto
            finché il vento non lo piega. I mattoni dietro di lui sono ancora caldi del fuoco, e lui non si
            scosta. «Ogni volta che mi scappava, o che gli scoprivo un piano, pensavo che senza di me la città
            sarebbe andata a pezzi.» Si batte il petto con il pugno, piano, due volte. «Era orgoglio, e mi ha
            fatto lavorare tante notti quanto il dovere» ammette, guardando ancora il fumo.

            «Adesso mi sento soltanto vecchio, e un po' stupido» aggiunge con un sorriso stanco.
          segue: galdrick-e-vesh
      - testo: "Guardare Mirko Vesh"
        immagine: personaggi/mirko-vesh
        costo: 0
        esito:
          titolo: Gli anelli
          testo: |
            Mirko è disteso dove è caduto, con gli occhi ancora aperti verso le travi che bruciano. Da morto
            sembra più piccolo, e più giovane di quanto credevi. Ha un anello a ogni dito, e in Città Bassa
            tutti sanno che soltanto uno è suo, quello liscio d'argento sul mignolo sinistro. Gli altri li ha
            tolti ai debitori, uno per ogni conto chiuso. Si vede dalle misure, perché alcuni gli girano
            larghi sulle dita e altri gli affondano nella carne fino alla nocca.

            «Lasciali dove sono, domani li riportiamo ai loro padroni» dice Galdrick quando ti vede guardarli,
            «a quelli che sono ancora vivi.»
          segue: galdrick-e-vesh
      - testo: "Aiutarlo ad alzarsi"
        esito:
          titolo: Il silenzio
          testo: |
            Gli tendi la mano, e Galdrick ci si appoggia in equilibrio incerto, con l'altra mano premuta sul
            fianco e le dita rosse fino al polso. «Non fare come me» dice mentre si raddrizza. «Dieci anni
            dietro a un uomo solo sono troppi, perché quando lui muore non sai più che cosa fare la mattina.»

            «Andiamo. Adesso tocca a Julia, e in queste cose lei è più brava di me.» Volta le spalle al corpo
            di Mirko e alla Pignatta che fuma, e comincia a salire verso i Quartieri Alti un passo alla volta,
            senza chiederti di sorreggerlo. Sul muro dove si era appoggiato resta l'impronta scura della sua
            mano.
          effetti: { pista.pelle: 1, racconto: 1 }
          vai: quartieri-alti
      - testo: "Medicargli il fianco"
        descrizione: "Il taglio è lungo e sanguina ancora, e lo sceriffo non chiederà aiuto a nessuno."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: La cucitura
          testo: |
            Il taglio è lungo ma pulito, e lo chiudi con l'ago e il filo della bisaccia mentre lui guarda il
            fuoco e stringe i denti. Ci vogliono undici punti, e la pelle dello sceriffo è così spessa che
            l'ago passa soltanto se lo spingi con il pollice. «Non fare come me» dice mentre si abbottona la
            giubba. «Dieci anni dietro a un uomo solo sono troppi, perché quando lui muore non sai più che
            cosa fare la mattina.»

            «Andiamo. Il resto spetta a Julia.» Volta le spalle al corpo di Mirko e alla Pignatta che fuma, e
            sale verso i Quartieri Alti senza zoppicare.
          pe: { medicina: 5 }
          effetti: { pista.pelle: 1, rep.caserma: 1, racconto: 1 }
          vai: quartieri-alti
        fallimento:
          titolo: Il filo che si strappa
          testo: |
            Gli apri la giubba sul fianco e provi a chiudere il taglio con l'ago della bisaccia. Il sangue ti
            rende le dita scivolose, le mani ti tremano e il filo si strappa due volte.

            Galdrick ti toglie l'ago di mano con delicatezza e si preme il fazzoletto sulla ferita. «Lascia,
            ci pensa Vantes» dice con un mezzo sorriso. «Non fare come me» aggiunge mentre si raddrizza.
            «Dieci anni dietro a un uomo solo sono troppi, perché quando lui muore non sai più che cosa fare
            la mattina.»

            «Andiamo. Il resto spetta a Julia.» Il fazzoletto è già rosso quando si gira verso la salita.
          effetti: { pista.pelle: 1, racconto: 1, tormento: 1 }
          vai: quartieri-alti

  # ------------------------------------------------------------ 6 → 7 · la città dopo Vesh
  - id: la-citta-dopo-vesh
    presso: municipio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: La città dopo Vesh
    sommario: "Sono passate tre settimane dalla notte della Pignatta. Julia Castaldi ti aspetta in Municipio, e il Consiglio ha una cosa da darti."
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [pista.pelle == 6]
    testo: |
      Tre settimane dopo la notte della Pignatta il Municipio ha le finestre aperte, e nell'anticamera
      aspettano mugnai e taglialegna con il cappello in mano. I mugnai si riconoscono dalla farina nelle
      cuciture delle maniche, e i taglialegna dalla resina scura sotto le unghie.

      Julia Castaldi ti riceve fra pile di pratiche più alte del tavolo, legate con lo spago e con un
      foglietto in cima per la data, e ti racconta la città come si legge un bilancio. Gli Scuri come rete non
      esistono più, e le piccole cellule rimaste nei villaggi vivono di furti senza che nessuno in Municipio
      le copra. Ottone Malgrani è stato condannato a morte dopo un processo breve. Senza i Malgrani e senza i
      Tarvelin in Consiglio le liti restano, però la corruzione ha smesso di comandare.

      {politica-ed-economia Media} Due Casati spariti in un mese lasciano un vuoto, e i vuoti in Consiglio non
      restano vuoti a lungo.

      {origine mercante-dei-ponti} Alla Casa dei Nodi qualcuno sta già calcolando quanto renderanno le licenze
      nuove. Per abitudine fai lo stesso conto sul prezzo della farina ai Ponti.

      «Ho fatto le licenze per chi macina e commercia grano, con controlli sulle quantità e una tassa sulla
      produzione» dice. «Il Comune ha pagato le cooperative che hanno rilevato i mulini e le segherie dei
      Malgrani, e i prezzi restano bassi.» Si gira verso la finestra, che dà sui tetti della Città Bassa. «Le
      casse però sono vuote, e ricostruire la Città Bassa ci costerà mesi.»
    opzioni:
      - testo: "Chiedere di Lucia Malgrani"
        immagine: personaggi/lucia-malgrani
        requisiti: [lucia == 1]
        costo: 0
        esito:
          titolo: Il Maniero venduto
          testo: |
            «Lucia ha collaborato fino all'ultima carta» dice Julia. «Ha venduto il Maniero alla città, e il
            Consiglio vuole farne un istituto di studi, con le menti migliori della regione dentro e le statue
            degli antenati fuori in cortile, sotto la pioggia come sempre.»

            Si concede un mezzo sorriso, il primo da quando sei entrat{o|a}, e intanto raddrizza una pila di
            carte con il palmo. «È andata a Ghoran a stare con i figli, a casa di Urtilia. Prima di partire ha
            chiesto di salutarti, e tu non c'eri.»
      - testo: "Chiedere di Lucia Malgrani"
        immagine: personaggi/lucia-malgrani
        requisiti: [lucia != 1]
        costo: 0
        esito:
          titolo: L'esilio
          testo: |
            «Lucia Malgrani l'abbiamo processata insieme al marito» dice Julia, e lo dice con lo stesso tono
            con cui ti ha letto il resto. «Dei conti del marito sapeva poco, però abbastanza da tacere per
            anni. Il tribunale l'ha esiliata a Ghoran, dove ci sono la zia e i bambini.»

            «Il Maniero l'ha comprato la città all'asta, e il Consiglio vuole farne un istituto di studi. Le
            statue degli antenati restano in cortile, sotto la pioggia.»
      - testo: "Chiedere della Città Bassa"
        requisiti: [nomea.citta-bassa >= 2]
        costo: 0
        esito:
          titolo: Il tuo nome nei vicoli
          testo: |
            «In Città Bassa il tuo nome lo dicono volentieri» dice Julia. «Raccontano che quella notte hai
            rimandato a casa i loro figli, e lo raccontano in tanti. Per la prima volta da anni la gente sale
            in Municipio a chiedere, invece di andare alla Pignatta.» Te lo dice senza guardarti e senza
            smettere di firmare, e ti scalda la faccia lo stesso.

            Della Pignatta, aggiunge, restano i muri anneriti, e davanti alla porta qualcuno ha già vangato un
            orto.
      - testo: "Chiedere della Città Bassa"
        requisiti: [nomea.citta-bassa >= 0, nomea.citta-bassa < 2]
        costo: 0
        esito:
          titolo: I muri anneriti
          testo: |
            «Laggiù di te parlano poco» dice Julia, stringendosi nelle spalle con una specie di gentilezza.
            «Si ricordano la milizia e le randellate più delle facce, e quando salgono per le licenze chiedono
            ancora chi pagherà i vetri delle finestre. Forse per te è meglio così.»

            Della Pignatta, aggiunge, restano i muri anneriti, e davanti alla porta qualcuno ha già vangato un
            orto. Le prime cipolle sono spuntate storte, tutte piegate dalla stessa parte.
      - testo: "Chiedere della Città Bassa"
        requisiti: [nomea.citta-bassa < 0]
        costo: 0
        esito:
          titolo: Sui muri
          testo: |
            Julia ci mette un po' a rispondere, e intanto allinea la penna al bordo del tavolo. «Sui muri
            della Città Bassa c'è scritto *assassini del governo*, con il carbone, e sotto qualche volta c'è
            il tuo nome» dice. «Le scritte le facciamo lavare, e la notte dopo tornano. Ci vorranno anni.»

            Della Pignatta restano i muri anneriti. Davanti alla porta qualcuno ha piantato una croce di legno
            per ogni ragazzo morto sullo spiazzo, con i due bracci legati dal fil di ferro, e su qualcuna c'è
            appeso un berretto.
      # L'Acciaieria secondo acciaieria.futuro (citta/minori.yaml, `l-acciaieria-senza-padrone`).
      - testo: "Accettare la ricompensa del Consiglio"
        esito:
          titolo: La borsa del Consiglio
          testo: |
            Julia apre un cassetto e posa sul tavolo una borsa di cuoio con il sigillo del Consiglio impresso
            a caldo, e accanto una lettera firmata da lei e da Galdrick. «Le casse sono vuote, te l'ho detto»
            dice. «Questa è l'ultima borsa che avevamo, e mi pare spesa bene.» La lettera è scritta su carta
            pesante e dice che la città ti deve un favore, e chiunque la può leggere.

            Galdrick lo incontri sulle scale senza armatura, con il fianco ancora fasciato sotto la giubba.
          effetti: { monete: 120, rep.castaldi: 1, rep.caserma: 1, pista.pelle: 1, racconto: 1 }
      - testo: "Chiedere che la borsa vada alla Città Bassa"
        descrizione: "L'intera ricompensa, per i tetti bruciati intorno alla Pignatta. Le casse del Comune sono vuote, e la tua bisaccia non è molto più piena."
        esito:
          titolo: I tetti di una strada
          testo: |
            Guardi la borsa sul tavolo e chiedi a Julia di spenderla in Città Bassa, per le case bruciate
            intorno alla Pignatta. Lei ti guarda a lungo. Poi rimette la borsa nel cassetto e ci lega sopra
            con lo spago un cartellino con scritto *Città Bassa, tetti*. «Basta per i tetti di una strada»
            dice, e ti consegna lo stesso la lettera firmata da lei e da Galdrick, dove c'è scritto che la
            città ti deve un favore. L'inchiostro della firma di Galdrick è ancora lucido.
          effetti: { rep.castaldi: 2, rep.caserma: 1, nomea.citta-bassa: 1, pista.pelle: 1, racconto: 1 }
      - testo: "Chiedere dell'Acciaieria dei Tarvelin"
        quando: [acciaieria.futuro == 0]
        costo: 0
        esito:
          titolo: La ciminiera spenta
          testo: |
            «La Gilda è in bilico, perché l'Acciaieria dei Tarvelin è ferma e Liaren non la vuole» dice Julia.
            «Alla Casa dei Nodi vorrebbero riaccenderla con un amministratore loro, e intanto il turno di
            giorno aspetta sul muretto davanti al cancello, tutte le mattine.»

            Dalla finestra la ciminiera si vede appena, sopra i tetti della Città Bassa, e non fuma. Qualcuno
            ci ha appeso in cima uno straccio nero, e il vento lo fa sbattere.
      - testo: "Chiedere dell'Acciaieria dei Tarvelin"
        quando: [acciaieria.futuro == 1]
        costo: 0
        esito:
          titolo: Il fumo della Gilda
          testo: |
            «L'Acciaieria l'ha riaccesa la Gilda, con un amministratore suo» dice Julia. «Alla Casa dei Nodi
            hanno rialzato la testa, e la tassa sulla colata la pagano prima della scadenza, cosa che i
            Tarvelin non hanno mai fatto. Liaren dal cancello non ci è più passata.» Lo dice con un'alzata di
            sopracciglia che non decide se sia una lode o un rimprovero. Dalla finestra si vede il fumo della
            ciminiera salire grigio sopra i tetti della Città Bassa.
      - testo: "Chiedere dell'Acciaieria dei Tarvelin"
        quando: [acciaieria.futuro == 2]
        costo: 0
        esito:
          titolo: La fornace degli operai
          testo: |
            «All'Acciaieria lavorano in società quelli del turno di giorno, con la concessione firmata da
            Liaren» dice Julia. «È la prima fornace della città che va avanti senza un padrone, e alla Gilda
            non hanno ancora deciso se esserne contenti. Il lyssan intanto lo compra Irsa Valbrun, fino
            all'ultima colata.» Julia sorride appena, da donna che alla Gilda non deve più chiedere il
            permesso, e mette la concessione in cima alla pila più vicina.
      - testo: "Chiedere dell'Acciaieria dei Tarvelin"
        quando: [acciaieria.futuro == 3]
        costo: 0
        esito:
          titolo: La socia di Liaren
          testo: |
            «L'Acciaieria la manda avanti Irsa Valbrun d'accordo con Liaren, e alla fornace c'è Abele Torsi»
            dice Julia. «Alla Gilda brontolano per l'amministratore che non hanno potuto metterci, e intanto
            il lyssan esce e le famiglie degli otto prendono la loro parte.» Batte due volte la penna sul
            tavolo, soddisfatta. Sul legno restano due puntini d'inchiostro.
