# La pista "Sotto la pelle di Qir-Azel" (pista.pelle), passi 3 → 7: l'Atto II che il verbale non ha (le tre
# casse degli Scuri e il carceriere) e l'Atto III con l'epilogo (il Municipio all'alba, l'assalto alla
# Pignatta Grassa, Galdrick e Vesh, la città dopo Vesh).
storylet:
  # ------------------------------------------------------------ 3 · la bisca di Nihali
  - id: la-bisca-di-nihali
    presso: orlo-dei-rottami
    immagine: personaggi/nihali-cuzan
    titolo: La bisca nella cisterna
    sommario: "Ogni settimana un uomo dei Malgrani perde a carte all'Orlo dei Rottami, sempre contro lo stesso baro."
    luogo: Orlo dei Rottami, a notte fonda
    area: citta-bassa
    requisiti: [pista.pelle == 3, colpo.bisca == 0]
    testo: |
      In fondo alla discesa dell'Orlo dei Rottami c'è una cisterna dei
      Precursori, con una porta tagliata a fiamma da cui escono luce gialla e
      fumo di pipa. Nei conti di Ottone compare ogni settimana alla voce
      *perdite al gioco*, contro le iniziali di Nihali Cuzan.

      Oltre quattro tavoli di giocatori, Nihali siede su una cassa di ferro
      inchiodata al pavimento. Ha la faccia gialla di un malato e le mani più
      curate della Città Bassa, e tossisce in un fazzoletto ricamato che poi
      ripiega dal lato pulito.

      {conoscenze-della-strada Facile} Mani così all'Orlo non lavorano, e lui le
      tiene morbide per sentire il bordo delle carte.

      {origine figlio-della-citta-bassa} Da bambino ti spaventavano con il nome
      di Nihali, e visto da vicino è più piccolo della sua storia.

      Un ragazzino scalzo ti passa accanto correndo verso la Pignatta, e sulla
      porta l'uomo di guardia spegne la lanterna e rientra.
    opzioni:
      - testo: "Sederti al tavolo di Nihali"
        descrizione: "Nihali bara da vent'anni, e per batterlo bisogna capire come lo fa e farglielo sapere senza dirlo."
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il mazzo che zoppica
          testo: |
            Perdi tre mani di fila finché non vedi il trucco. Nihali tiene appena
            piegato un angolo delle carte buone e lo raddrizza con il pollice, e
            alla quarta mano la carta la raddrizzi tu prima di lui. «Vincere mi
            annoia» dice Nihali, «ma stanotte non mi diverto per niente.» Ti
            spinge la posta e se ne va verso la Pignatta, e il resto della cassa
            lo porti alla Caserma.
          imposta: { colpo.bisca: 1 }
          effetti: { monete: 25, colpi.scuri: 1, rep.scuri: -1 }
        fallimento:
          titolo: Il fazzoletto ricamato
          testo: |
            Non vedi il trucco, e alla quarta mano provi a barare tu, con le dita
            che sudano sul cartone. Nihali ti guarda con una specie di tristezza
            professionale, poi lascia la sala all'uomo della porta e se ne va dal
            retro. Nella rissa che segue ti prendi un occhio gonfio, e della cassa
            di ferro porti alla Caserma soltanto quello che i giocatori non hanno
            arraffato.
          imposta: { colpo.bisca: 1 }
          effetti: { ferite: 1, sospetto: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Entrare dalla parte del vuoto"
        descrizione: "Sul fondo della cisterna, sopra la Cicatrice, c'è una fessura larga quanto una spalla."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Dalla parte del vuoto
          testo: |
            Ti cali lungo le lamiere fino al ventre della cisterna, con il vento della
            Cicatrice nella giubba, e ti infili nella fessura. Sbuchi al buio dietro la
            cassa di Nihali e riempi due sacche con quello che resta. Quando la sala se
            ne accorge sei già sulla discesa, e Nihali corre su per le lamiere verso la
            Pignatta con le mani curate tenute in alto.
          imposta: { colpo.bisca: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
        fallimento:
          titolo: La fessura
          testo: |
            La fessura è più stretta di quanto sembrava, e ci resti incastrato con
            le gambe nel vuoto. Quando entri ti sei scorticato un fianco e hai
            svegliato tutto l'Orlo, e arraffi dalla cassa quello che puoi mentre
            l'uomo della porta ti cerca con la lanterna. Esci dalla porta
            principale sotto gli occhi della sala intera, e Nihali è già sparito
            verso la Pignatta.
          imposta: { colpo.bisca: 1 }
          effetti: { ferite: 1, sospetto: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Entrare dalla porta"
        descrizione: "Un uomo alla porta e Nihali sulla cassa, e quando volano i pugni i giocatori guardano altrove."
        combattimento: la-bisca-di-nihali
        vittoria:
          titolo: La cassa di ferro
          testo: |
            L'uomo della porta finisce contro un tavolo, e i giocatori si
            appiattiscono contro le pareti con le carte ancora in mano, attenti a
            non mostrarle nemmeno adesso. Nihali scappa dal retro verso la
            Pignatta, piegato in due dalla tosse. Porti alla Caserma quello che
            resta nella cassa, e per strada trovi in tasca, al posto del tuo, il
            suo fazzoletto ricamato, ripiegato dal lato pulito.
          imposta: { colpo.bisca: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, rep.caserma: 0.5 }
        sconfitta:
          titolo: Le carte per terra
          testo: |
            Ti ritrovi sul pavimento della cisterna con le carte sparse intorno
            alla faccia, e l'uomo della porta ti tiene giù con un ginocchio finché
            Nihali non è uscito dal retro. Fra i giocatori qualcuno ha già
            allungato le mani sulla cassa. Ne salvi quello che puoi, e per una
            settimana all'Orlo chi ti incontra ti guarda l'occhio nero.
          imposta: { colpo.bisca: 1 }
          effetti: { sospetto: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Aspettare l'uomo dei Malgrani"
        descrizione: "Stanotte è il giorno segnato nei conti di Ottone, quando arriva qualcuno con una borsa da perdere."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Le perdite al gioco
          testo: |
            L'uomo dei Malgrani arriva dopo la mezzanotte, con il mantello girato
            al rovescio, e perde una borsa intera in sei mani. In cima alla
            discesa gli dici la cifra prima di lui, e lui, bianco, ti consegna la
            borsa. All'alba i mercenari di Galdrick sfondano la porta della
            cisterna. La cassa è mezza vuota e Nihali è già alla Pignatta, ma la
            borsa dei Malgrani ce l'hai tu.
          imposta: { colpo.bisca: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5, rep.malgrani: -0.5 }
        fallimento:
          titolo: Il mantello al rovescio
          testo: |
            L'uomo dei Malgrani arriva dopo la mezzanotte con il mantello girato
            al rovescio e ti vede prima che tu veda lui, e poco dopo la luce della
            cisterna si spegne. All'alba i mercenari di Galdrick sfondano la porta
            e trovano soltanto il fondo di una settimana nella cassa di ferro. Tu
            hai passato la notte accucciato fra i rottami, e fino a sera ti porti
            dietro le ginocchia rigide.
          imposta: { colpo.bisca: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, sospetto: 0.5 }
      - testo: "Riconoscere l'uomo dei Malgrani dal portamento"
        descrizione: "Un servitore di Casato cammina come si impara da bambini nei Quartieri Alti, e obbedisce al tono dei padroni."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il tono dei padroni
          testo: |
            L'uomo dei Malgrani arriva con il mantello girato al rovescio, e lo
            riconosci dalle mani giunte dietro la schiena, come i maggiordomi dei
            Casati. Lo fermi sulla porta e gli parli con la voce che in casa tua
            si usa per i domestici distratti. Ti consegna la borsa e se ne va.
            All'alba i mercenari di Galdrick trovano la cassa mezza vuota e Nihali
            già alla Pignatta.
          imposta: { colpo.bisca: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5, rep.malgrani: -0.5 }
      - testo: "Tenere a mente le carte uscite"
        descrizione: "Le carte si contano come le formule dei cristalli, e se Nihali bara le buone gli arrivano troppo spesso."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il conto delle carte
          testo: |
            Perdi tre mani contando le carte come le righe di una formula, finché
            il conto non torna più. Le carte alte arrivano a Nihali quando il suo
            pollice passa sull'angolo piegato, e alla quarta mano la carta la
            raddrizzi tu. «Vincere mi annoia» dice Nihali, guardandoti come un
            collega. Ti spinge la posta e se ne va verso la Pignatta, e il resto
            della cassa lo porti alla Caserma.
          imposta: { colpo.bisca: 1 }
          effetti: { monete: 25, colpi.scuri: 1, rep.scuri: -1 }
        fallimento:
          titolo: Il fumo di pipa
          testo: |
            Il fumo di pipa ti brucia gli occhi, e alla seconda mano il conto ti
            si confonde con quello di prima. Nihali ti guarda con una specie di
            tristezza professionale, poi lascia la sala all'uomo della porta e se
            ne va dal retro. Nella rissa per la posta ti prendi un occhio gonfio,
            e porti alla Caserma soltanto le monete che i giocatori non hanno
            arraffato.
          imposta: { colpo.bisca: 1 }
          effetti: { ferite: 1, sospetto: 1, colpi.scuri: 1, rep.scuri: -1 }

  # ------------------------------------------------------------ 3 · il retrobottega di Gramm
  - id: il-retrobottega-di-gramm
    presso: mercato-dei-nodi
    immagine: personaggi/nestor-gramm
    titolo: Il vicolo della Dispensa
    sommario: "Nei conti di Ottone la Dispensa di Gramm vende infusi per la signora a prezzi da gioielliere."
    luogo: Mercato dei Nodi, il vicolo dietro la Dispensa di Gramm
    area: ponti-sospesi
    requisiti: [pista.pelle == 3, colpo.dispensa == 0]
    testo: |
      Nei conti di Ottone la Dispensa di Gramm compare ogni mese alla voce
      *infusi per la signora*, con cifre che un erborista onesto non incassa in
      un anno. «Gramm prepara i veleni per gli Scuri da prima che io fossi
      sceriffo» ha detto Galdrick. «Le gocce per dormire della signora Malgrani
      sono l'unica cosa pulita che gli abbiano mai pagato.»

      Il vicolo dietro la Dispensa è una passerella di tavole fra due
      piattaforme del Mercato dei Nodi. Dalle fessure della porta sul retro
      esce odore di carta bruciata e di qualcosa di dolce che fa lacrimare.

      {origine accolito-del-velo} È l'odore dell'infermeria della Cattedrale,
      dove le gocce per dormire si contavano a voce alta.

      Dentro qualcuno posa vetri sul legno, uno alla volta. *Sta facendo i
      bagagli, e scommetto che li fa in ordine alfabetico.* Le tavole del
      vicolo cigolano sotto i tuoi piedi.
    opzioni:
      - testo: "Bussare come un cliente del vicolo"
        descrizione: "Nestor serve dal retro chi sa chiedere, con una richiesta precisa e la voce giusta."
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Una richiesta
          immagine: personaggi/nestor-gramm
          testo: |
            Bussi tre volte piano e chiedi qualcosa per un cane che abbaia troppo.
            Nestor apre di una spanna, con gli occhi sfocati di chi beve le sue
            stesse pozioni, e ti fa entrare. Mentre conta le gocce in una fiala
            gli posi una mano sul polso, e lui lascia cadere la fiala e scappa
            verso la Pignatta, abbandonando la cassetta con le monete di un mese.
          imposta: { colpo.dispensa: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, rep.caserma: 0.5 }
        fallimento:
          titolo: La campanella
          testo: |
            Lo chiedi con la voce di uno che il cane non ce l'ha, e dall'altra
            parte Nestor resta zitto a lungo, poi senti il chiavistello della
            seconda porta, quella sul ponte. Quando sfondi la porta del vicolo il
            retro è vuoto, e il vapore dolce di una boccetta rotta ti fa girare la
            stanza intorno. Esci tossendo con la cassetta delle monete sotto il
            braccio.
          imposta: { colpo.dispensa: 1 }
          effetti: { ferite: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Leggere gli scaffali dalla finestrella"
        descrizione: "Dalla finestrella, chi conosce le erbe capisce che cosa mette in salvo e quanti anni di cella vale."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Le gocce della signora
          testo: |
            Dalla finestrella vedi gli scaffali svuotati, con la radice nera che
            ferma il cuore nel sonno e le gocce dei Malgrani. Chiami Nestor per
            nome e gli elenchi quello che tiene, con gli anni di cella che vale
            ogni boccetta. Un passo corto e storto si allontana verso la Pignatta,
            e nel retro trovi la cassetta con le monete di un mese e il quaderno
            dei clienti del vicolo.
          imposta: { colpo.dispensa: 1 }
          pe: { medicina: 5 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, informazioni.segreto: 1 }
        fallimento:
          titolo: Il vapore dolce
          testo: |
            Le etichette sono scritte in un codice da speziale che non conosci, e
            mentre cerchi di leggerle Nestor alza gli occhi e ti vede. Rovescia
            una boccetta sulla stufa, e dalla finestrella esce un vapore dolce che
            ti chiude la gola. Quando sfondi la porta il retro è vuoto, e sotto il
            banco c'è la cassetta con le monete di un mese.
          imposta: { colpo.dispensa: 1 }
          effetti: { ferite: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Sfondare la porta"
        descrizione: "Dentro c'è un erborista con una boccetta verde e un ragazzo degli Scuri con un coltello, in poco spazio."
        combattimento: il-retrobottega-di-gramm
        vittoria:
          titolo: Vetri
          testo: |
            La porta cede alla seconda spallata. Il ragazzo degli Scuri ti viene
            addosso con un coltello da macellaio troppo grande, e lo mandi contro
            gli scaffali, mentre la boccetta verde di Nestor ti manca di un palmo
            e fa fumare il muro. Quando il fumo si dirada sono spariti tutti e
            due, e nel retro resta la cassetta con le monete di un mese.
          imposta: { colpo.dispensa: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, rep.caserma: 0.5 }
        sconfitta:
          titolo: La boccetta verde
          testo: |
            La boccetta verde ti si rompe sul petto, e mentre il vapore ti piega
            in due il ragazzo degli Scuri ti finisce con l'impugnatura del
            coltello. Ti risvegli accanto alla stufa fredda. Nestor è scappato con
            il ragazzo e con i quaderni, ma sotto un'asse sollevata ha dimenticato
            la cassetta delle monete, e per due giorni tutto quello che mangi ha
            il sapore del ferro.
          imposta: { colpo.dispensa: 1 }
          effetti: { ferite: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Aspettarlo alla seconda porta, quella sul ponte"
        descrizione: "Il Mercato dei Nodi lo conosci passerella per passerella, e i bagagli escono sempre dalla seconda porta."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La seconda porta
          testo: |
            Da quelle porte sul ponte escono le casse che i Custodi di Passaggio
            non devono vedere, e ne hai fatte uscire anche tu. Ti siedi sul
            parapetto di fronte, con le gambe sopra la Cicatrice. Esce Nestor con
            due sacche di vetri, e quando ti vede le posa per terra con cura da
            speziale e scappa verso la Pignatta. Nel retro trovi la cassetta con
            le monete di un mese.
          effetti: { colpi.scuri: 1, rep.scuri: -1, rep.caserma: 0.5 }
          imposta: { colpo.dispensa: 1 }
      - testo: "Leggere le etichette con le sigle dell'infermeria"
        descrizione: "Gli speziali usano le abbreviazioni dei registri dell'infermeria del Velo, che hai imparato fra le brande della Cattedrale."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il registro delle gocce
          testo: |
            Dalla finestrella leggi le etichette con le sigle dell'infermeria
            della Cattedrale, la radice nera che ferma il cuore nel sonno e altre
            boccette che il Velo tiene sotto chiave. Chiami Nestor per nome e gli
            elenchi gli anni di cella che vale ognuna. Un passo corto e storto si
            allontana, e nel retro trovi la cassetta con le monete di un mese e il
            quaderno dei clienti del vicolo.
          imposta: { colpo.dispensa: 1 }
          pe: { medicina: 5 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, informazioni.segreto: 1 }

  # ------------------------------------------------------------ 3 · la cassa nel pilone
  - id: la-cassa-nel-pilone
    presso: ponte-delle-mille-corde
    immagine: ambientazione/ponti-sospesi
    titolo: Il quarto pilone
    sommario: "Uno dei piloni del Ponte delle Mille Corde è cavo, e dentro gli Scuri tengono quello che i ponti rendono."
    luogo: Ponte delle Mille Corde, sotto le assi
    area: ponti-sospesi
    requisiti: [pista.pelle == 3, colpo.cassa == 0]
    testo: |
      Il quarto pilone del Ponte delle Mille Corde, dove secondo i conti di
      Ottone un uomo dei Malgrani porta una borsa due volte all'anno, è un
      tronco di ferro precuriano largo quanto una torre, con uno sportello
      tondo a metà altezza che da sopra non si vede.

      Ci arrivi dalla piattaforma di servizio sotto le assi, dove di giorno i
      Custodi di Passaggio si allenano al tiro su sacchi di paglia. Una
      passerella di corde porta al pilone, e sulla cengia davanti allo
      sportello tre uomini degli Scuri giocano a dadi su una cassa rovesciata.
      Sopra di te un ragazzo corre verso la Città Bassa senza lanterna.

      {conoscenze-della-strada Media} Un ragazzo che corre di notte senza
      lanterna porta un messaggio, e gli Scuri pagano i piccoli di più quando
      la notizia è cattiva.

      {origine apprendista-raschiatore} Sulle piattaforme hai fatto turni
      interi con il vuoto sotto gli stivali.
    opzioni:
      - testo: "Scendere lungo le catene"
        descrizione: "Dal lato del vuoto il pilone è coperto di catene, e si arriva allo sportello alle spalle dei tre."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Dal lato del vuoto
          testo: |
            Scendi lungo le catene di sostegno una maglia alla volta, con la luce
            della Cicatrice fra le gambe e i palmi scorticati dalla ruggine, e ti
            lasci cadere dentro lo sportello mentre i tre litigano su un tiro di
            dadi. La cassa di ferro inchiodata al pavimento è già mezza vuota, e
            il resto lo cali in un sacco fino alla piattaforma, dove ti aspettano
            due mercenari di Galdrick.
          imposta: { colpo.cassa: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
        fallimento:
          titolo: Una maglia di troppo
          testo: |
            A metà discesa una maglia ti si apre sotto il piede, e resti appeso
            sopra la Cicatrice mentre il rumore della catena arriva fino allo
            sportello. I tre ti aspettano con i coltelli, e ne esci con un taglio
            lungo il braccio e la cassa mezza vuota, che i mercenari di Galdrick
            tirano su. Uno degli Scuri, scappando, grida il tuo nome verso la
            Città Bassa.
          imposta: { colpo.cassa: 1 }
          effetti: { ferite: 1.5, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Prendere la passerella"
        descrizione: "Tre uomini su una cengia larga quanto un tavolo, con la Cicatrice sotto."
        combattimento: la-cassa-degli-scuri
        vittoria:
          titolo: La cengia
          testo: |
            Attraversi la passerella di corsa con le braccia larghe, e il primo
            dei tre lo rimandi indietro addosso agli altri. Uno scappa su verso il
            ponte, e gli altri due li lasci legati alla rastrelliera dei bersagli,
            accanto ai sacchi con la faccia a carbone, che al confronto sembrano
            più svegli. La cassa del pilone è mezza vuota, e il resto lo cali ai
            mercenari di Galdrick sulla piattaforma.
          imposta: { colpo.cassa: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -1, rep.caserma: 0.5 }
        sconfitta:
          titolo: Le corde
          testo: |
            Ti prendono a metà della passerella, dove oscilla di più, e un colpo
            ti manda fuori dalle corde, con la Cicatrice sotto la schiena e una
            mano sola stretta alla fune. Ti tirano su i mercenari di Galdrick. I
            tre Scuri sono scappati con quello che potevano portare, e nella cassa
            resta un fondo di monete che i mercenari contano mentre tu non riesci
            a smettere di tremare.
          imposta: { colpo.cassa: 1 }
          effetti: { tormento: 1, colpi.scuri: 1, rep.scuri: -1 }
      - testo: "Presentarti come ispettore della Gilda"
        descrizione: "Un ispettore con l'aria giusta sveglia i Custodi di Passaggio nella baracca e li manda dove vuole."
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Media }
        successo:
          titolo: Il pilone pericolante
          testo: |
            Svegli il caposquadra dei Custodi e gli parli di crepe nel quarto
            pilone e di un rapporto da consegnare alla Casa dei Nodi entro l'alba.
            Lui si abbottona la giacca sopra la camicia da notte sbagliando tutti
            i bottoni di uno, e manda sei uomini con le lanterne sulla passerella.
            I tre Scuri se ne vanno brontolando, e il caposquadra ti apre lo
            sportello davanti alla cassa mezza vuota.
          imposta: { colpo.cassa: 1 }
          pe: { galateo: 5 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
        fallimento:
          titolo: Il falso ispettore
          testo: |
            Il caposquadra dei Custodi ti ascolta grattandosi il petto, poi ti
            chiede il sigillo della Casa dei Nodi, che non hai. Manda lo stesso i
            suoi uomini sul pilone per curiosità, e i tre Scuri se ne vanno con
            una sacca a testa. Nella cassa resta il fondo, e nel registro dei
            Custodi la tua faccia è descritta alla voce *falso ispettore*.
          imposta: { colpo.cassa: 1 }
          effetti: { sospetto: 1.5, colpi.scuri: 1, rep.scuri: -0.5 }
      - testo: "Aspettare che se ne vadano"
        descrizione: "Se sono stati avvisati la svuotano loro, e per portare via le sacche dovranno lasciarne uno solo."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Il cambio
          testo: |
            Resti accucciato fra i bersagli per tre ore, con la polvere delle assi
            nel colletto. Due volte i tre si caricano una sacca a testa e salgono
            verso il ponte, e la terza ne resta uno solo, che si addormenta sulla
            cassa rovesciata. Dentro lo sportello la cassa è svuotata a metà, e
            quello che resta lo cali alla piattaforma con la corda di servizio.
          imposta: { colpo.cassa: 1 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
        fallimento:
          titolo: Le sacche
          testo: |
            Alla terza ora, quando non senti più i piedi, uno ti scivola contro una
            rastrelliera. I tre Scuri si caricano in fretta tutto quello che possono e
            salgono verso il ponte, lasciando lo sportello aperto. Nella cassa trovi
            soltanto il fondo, che i mercenari di Galdrick contano all'alba
            sbadigliando.
          imposta: { colpo.cassa: 1 }
          effetti: { tormento: 1, colpi.scuri: 1, rep.scuri: -0.5 }
      - testo: "Scendere sulle catene come su una piattaforma"
        descrizione: "Per un Raschiatore le catene sopra la Cicatrice sono una scala come un'altra."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Due maglie
          testo: |
            Scendi dal lato del vuoto con i piedi incrociati sulla catena e le
            mani sempre su due maglie, come nei turni sulle piattaforme, e il
            corpo ti porta giù con un'indifferenza quasi offensiva. Ti lasci
            cadere dentro lo sportello mentre i tre litigano sui dadi, e sprangi
            dall'interno. Il resto della cassa lo cali ai mercenari di Galdrick, e
            quando i tre se ne accorgono sei già sulla passerella.
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
          imposta: { colpo.cassa: 1 }
      - testo: "Svegliare i Custodi con la tua licenza"
        descrizione: "La licenza della Gilda ce l'hai davvero, e i Custodi di Passaggio ne riconoscono il sigillo anche al buio."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il sigillo in rilievo
          testo: |
            Metti la licenza della Gilda sotto il naso del caposquadra dei Custodi, e
            lui passa il pollice sul sigillo e si sveglia. Gli parli di una crepa nel
            quarto pilone segnalata dal tuo banco alla Casa dei Nodi, e poco dopo
            sulla passerella ci sono sei uomini con le lanterne. I tre Scuri se ne
            vanno brontolando, e sulla ricevuta dei mercenari di Galdrick ci metti il
            tuo nome vero.
          pe: { galateo: 5 }
          effetti: { colpi.scuri: 1, rep.scuri: -0.5, rep.caserma: 0.5 }
          imposta: { colpo.cassa: 1 }

  # ------------------------------------------------------------ 3 → 4 · il carceriere
  - id: il-carceriere
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: La chiave disegnata
    sommario: "Ogni volta gli Scuri sono arrivati prima di te, e Galdrick vuole parlare della sigla con la chiave."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo, a sera
    area: quartieri-alti
    requisiti: [pista.pelle == 3, colpi.scuri >= 2, pista.arena != 1, pista.arena != 2, pista.arena != 3, pista.arena != 4]
    testo: |
      Galdrick ha ricopiato la sigla dei conti di Ottone, *Ca*, con accanto la
      chiave disegnata fino all'ultimo dente. Nella cassa di ferro a due
      chiavi, aperta, ci sono gli ordini di servizio per i mercenari di Ghoran,
      uno per ogni tuo colpo.

      {origine fuggiasco-di-ghoran} Sugli ordini c'è scritto Ghoran tante volte
      che il nome smette di sembrare un posto.

      «Ogni volta sono arrivati prima di te» dice senza alzare gli occhi. «Dei
      posti sapevamo io e il furiere, e lo sapeva questa cassa. Gli ordini li
      scrive il furiere, e la sera li chiude qui dentro.» Batte un dito sulla
      chiave disegnata. «La seconda chiave ce l'ha lui, che dorme a casa sua.
      Le copie di tutte le chiavi della Caserma, di notte, stanno appese a un
      anello solo giù nelle celle.»

      {percezione Media} Una chiave disegnata a memoria fino ai denti è una
      chiave che gli passa davanti ogni sera.

      Il nome non lo dice. Dal corridoio arriva un passo pesante che scende
      verso le celle, e Galdrick guarda la porta. *Lo sa da giorni, e non
      voleva saperlo.* «Un quarto dei miei è pagato da Vesh» dice. «Se lo
      accuso io, domattina la Caserma si spacca in due. Mi serve che qualcuno
      di fuori lo veda con le mani nella cassa.»
    opzioni:
      - testo: "Chiedere a Galdrick di Borso"
        immagine: personaggi/borso
        requisiti: [pista.arena < 2]
        costo: 0
        esito:
          titolo: La scatola di latta
          testo: |
            «L'ho preso io, otto anni fa» dice Galdrick. «Era arrivato da Ghoran
            con il naso rotto e nient'altro, e in cella non si è mai fatto
            comprare da un detenuto. Mette da parte ogni moneta in una scatola di
            latta, per riscattare i figli dai mercati di Ghoran.» Si guarda le
            mani. «Vesh paga meglio della Caserma, e paga prima. In otto anni non
            l'ho capito.»
      - testo: "Chiedere a Galdrick di Borso"
        immagine: personaggi/borso
        requisiti: [pista.arena >= 2, mischia == 1]
        costo: 0
        esito:
          titolo: Spinto fuori dal recinto
          testo: |
            «Per il torneo gli ho dato la licenza» dice Galdrick, «e nella Mischia
            lui e Durgan mi hanno spinto fuori dal recinto a due mani. Ho riso.»
            «L'ho preso io otto anni fa, quando è arrivato da Ghoran con il naso
            rotto. Mette da parte ogni moneta in una scatola di latta per
            riscattare i figli, e Vesh paga prima della Caserma. In otto anni non
            l'ho capito.»
      - testo: "Chiedere a Galdrick di Borso"
        immagine: personaggi/borso
        requisiti: [pista.arena >= 2, mischia != 1]
        costo: 0
        esito:
          titolo: La licenza
          testo: |
            «Per il torneo gli ho dato la licenza» dice Galdrick. «Voleva
            fracassare qualche cranio, e l'ho lasciato fare.» Scuote la testa
            piano. «L'ho preso io otto anni fa, quando è arrivato da Ghoran con il
            naso rotto. Mette da parte ogni moneta in una scatola di latta per
            riscattare i figli dai mercati di Ghoran, e Vesh paga prima della
            Caserma. In otto anni non l'ho capito.»
      - testo: "Aspettarlo nell'ufficio, al buio"
        descrizione: "Se è lui, stanotte scende a guardare la cassa, e dietro l'armadio delle pratiche c'è posto per uno."
        prova: { attributo: mentale, abilita: [percezione, furtivita], difficolta: Media }
        successo:
          titolo: Le mani nella cassa
          testo: |
            Ti nascondi dietro l'armadio delle pratiche, nell'odore di carta
            vecchia e di topo. Dopo la terza campana Borso entra in calze, con
            l'anello delle chiavi stretto nel pugno perché non tintinni, e apre la
            cassa di ferro con due chiavi che non dovrebbe avere. Copia l'ordine
            di servizio su un foglietto muovendo le labbra. Quando esci dall'ombra
            lo piega in quattro con cura e se lo mette in bocca.
          effetti: { rep.caserma: 1 }
          segue: la-fuga-di-borso
        fallimento:
          titolo: Un'asse che scricchiola
          testo: |
            Dopo la seconda campana ti si addormenta una gamba, e quando la sposti
            l'asse sotto il piede scricchiola. La porta che si stava aprendo si
            richiude piano, e un passo pesante torna verso le celle senza fretta.
            All'alba l'anello delle chiavi pende dal suo chiodo come tutte le
            mattine, ma adesso Borso sa che lo aspettavate.
          effetti: { sospetto: 1 }
          segue: la-fuga-di-borso
      - testo: "Fargli sentire un posto che non esiste"
        descrizione: "La sera Borso conta le monete in fondo al corridoio, e davanti a lui si può nominare una quarta cassa."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Il quinto pilone
          testo: |
            All'ora del rancio, passando davanti al tavolo in fondo al corridoio delle
            celle, chiedi a Galdrick quanti uomini servono per il quinto pilone. Borso
            conta le sue monete senza alzare la testa, e il quinto pilone è vuoto.
            All'alba quattro Scuri con i piedi di porco trovano i mercenari di
            Galdrick dietro i sacchi di paglia, e uno di loro giura che la soffiata
            viene dalle celle della Caserma.
          pe: { ingannare: 5 }
          effetti: { rep.caserma: 1 }
          segue: la-fuga-di-borso
        fallimento:
          titolo: Troppo forte
          testo: |
            Chiedi a Galdrick del quinto pilone a voce troppo alta, e gli occhi ti
            scappano su Borso. Lui smette di contare e rimette le monete nella
            scatola di latta una alla volta, guardandoti da sotto le sopracciglia.
            Quella notte nessuno va al quinto pilone.
          effetti: { sospetto: 1 }
          segue: la-fuga-di-borso
      - testo: "Affrontarlo nelle celle"
        immagine: personaggi/borso
        descrizione: "Lo prendi da solo nel corridoio delle celle prima che finisca il rancio, con le chiavi legate al pugno."
        combattimento: borso
        vittoria:
          titolo: Il grembiule di cuoio
          testo: |
            Borso picchia con il pugno chiuso sull'anello delle chiavi, dall'alto verso il
            basso, come si picchia chi sta già per terra, e ogni colpo ti lascia addosso
            l'impronta di una serratura. Alla fine lo metti in ginocchio sulla paglia di una
            cella vuota. Nella tasca del grembiule ha un foglietto con l'ordine di servizio
            copiato a matita, e le parole che non sapeva scrivere le ha disegnate.
          effetti: { rep.caserma: 1 }
          segue: la-fuga-di-borso
        sconfitta:
          titolo: La paglia
          testo: |
            Borso ti sbatte contro le sbarre finché le sbarre non smettono di
            girare, poi ti chiude in una cella vuota con calma, come tutte le
            sere. Galdrick ti apre poco dopo con la seconda copia della chiave.
            Nel corridoio la scatola di latta non c'è più, e dal chiodo
            dell'anello delle chiavi pende soltanto un pezzo di spago.
          effetti: { tormento: 1 }
          segue: la-fuga-di-borso
      - testo: "Mettergli paura"
        descrizione: "Al tavolo del rancio, davanti alla scatola di latta, con un uomo che alza la voce di rado."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: I figli a Ghoran
          testo: |
            Ti siedi al suo tavolo e gli posi una mano sulle monete. Gli parli della
            corda che aspetta un carceriere venduto, e di chi resta senza le monete
            della scatola di latta quando il carceriere non le manda più. «Vesh paga
            prima» dice alla fine. «La Caserma paga a fine mese, e a Ghoran i mercanti
            di bambini non aspettano.» Posa accanto alla latta un foglietto con
            l'ordine di servizio.
          effetti: { rep.caserma: 0.5 }
          segue: la-fuga-di-borso
        fallimento:
          titolo: La clava corta
          testo: |
            Borso ti lascia finire, e questo avrebbe dovuto metterti in allarme.
            Poi la clava corta gli passa in mano senza che tu la veda muoversi, e
            il primo colpo ti prende sotto le costole. «Dei miei figli tu non
            parli» dice, con la clava ferma a un palmo dal tuo petto. Quando
            Galdrick scende, Borso ha già staccato l'anello delle chiavi dal
            chiodo e sta salendo verso il cortile.
          effetti: { ferite: 2 }
          segue: la-fuga-di-borso
      - testo: "Parlargli dei mercanti di bambini di Ghoran"
        descrizione: "Borso manda le monete ai mercanti di bambini di Ghoran, e tu quei mercanti li hai visti pesare la gente."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [intimidire, empatia], difficolta: Media }
        successo:
          titolo: La bilancia del mercato
          testo: |
            Ti siedi al suo tavolo e gli racconti della bilancia del mercato di
            Ghoran, dove i bambini salgono per primi perché pesano poco e si
            vendono bene, con le mani ferme sul legno, come nei recinti. Borso
            tiene una moneta a mezz'aria mentre gli dici che quando un carceriere
            finisce sulla corda le monete smettono di partire. «Vesh paga prima»
            dice, e posa un foglietto con l'ordine di servizio.
          effetti: { rep.caserma: 0.5 }
          segue: la-fuga-di-borso
        fallimento:
          titolo: Proprio tu
          testo: |
            A metà del racconto Borso alza gli occhi e capisce da dove vieni. La clava
            corta gli passa in mano, e il primo colpo ti prende sotto le costole.
            «Proprio tu vieni a dirmi di Ghoran» dice, con la clava ferma a un palmo
            dal tuo petto e la voce che gli trema. Quando Galdrick scende, Borso ha
            già staccato l'anello delle chiavi e sta salendo verso il cortile.
          effetti: { ferite: 2 }
          segue: la-fuga-di-borso
      - testo: "Aspettarlo al buio come alla posta nel Bosco"
        descrizione: "Al Circolo hai imparato ad aspettare le bestie immobile, e un carceriere in calze fa più rumore di un cervo."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: La posta
          testo: |
            Ti accucci dietro l'armadio delle pratiche come al Circolo, e dopo due
            ore l'ufficio ha smesso di accorgersi di te. Alla terza campana Borso
            entra in calze, con l'anello delle chiavi stretto nel pugno, e apre la
            cassa con due chiavi che non dovrebbe avere. Copia l'ordine di servizio
            su un foglietto, e quando esci dall'ombra lo piega in quattro e se lo
            mette in bocca.
          effetti: { rep.caserma: 1 }
          segue: la-fuga-di-borso

  - id: la-fuga-di-borso
    presso: guarnigione-di-qir-azel
    immagine: personaggi/borso
    titolo: Il cane della Caserma
    tipo: seguito
    luogo: Guarnigione di Qir-Azel, il cortile
    area: quartieri-alti
    requisiti: [pista.pelle == 3]
    testo: |
      Borso attraversa il cortile della Caserma con l'anello delle chiavi delle
      celle infilato al braccio, senza correre. Una delle guardie del portone
      solleva la sbarra prima che lui gliel'abbia chiesto, e sugli spalti tre
      balestre restano abbassate.

      {intimidire Facile} Quelle guardie hanno paura di lui più che dello
      sceriffo, ed è per questo che la sbarra si è alzata da sola.

      Galdrick è sulla scala dell'ufficio con i pollici nella cintura, e quando
      fai un passo verso il portone ti posa una mano sul braccio. «Lascialo
      andare» dice piano. «Se lo fermiamo qui, stanotte nel cortile ci tiriamo
      addosso le balestre.»

      Sulla soglia Borso si gira una volta sola, verso le celle, poi prende la
      discesa della Città Bassa. *Va alla Pignatta, e ci va con le chiavi di
      tutta la Caserma.* La sbarra del portone ricade dietro di lui con un
      colpo sordo.
    opzioni:
      - testo: "Ripensare a quello che ti ha detto Borso"
        requisiti: [pista.arena >= 2]
        costo: 0
        esito:
          titolo: Il recinto
          testo: |
            Passandoti accanto Borso si è chinato appena, così vicino che hai
            sentito l'odore di cuoio del grembiule. «All'Arena ti ho visto nel
            recinto» ha detto con la voce bassa di sempre. «Ti ha visto anche
            Mauro, e Mauro i conti li tiene a memoria.» Galdrick ha sentito, e
            scrive una riga corta sul taccuino.
          segue: la-fuga-di-borso
      - testo: "Scendere alle celle con Galdrick"
        requisiti: [maedric == 2]
        esito:
          titolo: La cella di Maedric
          testo: |
            Le celle degli Scuri presi nelle ultime settimane sono aperte e vuote,
            compresa quella in fondo dove dormiva Maedric Holl, con il suo
            mantello cerato piegato in quattro sulla paglia. Nella cella accanto
            l'ubriaco di Via del Salmone dorme ancora con la porta spalancata.
            «Fra qualche giorno Vesh saprà tutto quello che sapeva Maedric» dice
            Galdrick, «e noi di giorni non ne abbiamo più.» Poi sale a scrivere a
            Julia.
          imposta: { maedric: 1 }
          effetti: { pista.pelle: 1 }
      - testo: "Scendere alle celle con Galdrick"
        requisiti: [maedric != 2]
        esito:
          titolo: Le celle aperte
          testo: |
            Le celle degli Scuri presi nelle ultime settimane sono aperte e vuote,
            e in quella in fondo un ubriaco di Via del Salmone russa nella paglia
            con la porta spalancata. «Adesso Vesh sa tutto quello che sapeva
            Borso» dice Galdrick, «cioè quasi tutto quello che so io.» Poi sale a
            scrivere a Julia.
          effetti: { pista.pelle: 1 }

  # ------------------------------------------------------------ 4 → 5 · il Municipio all'alba
  - id: il-municipio-all-alba
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: L'alba non porta luce
    sommario: "Julia Castaldi ti ha convocato in Municipio all'alba, davanti a tutte le carte che hai portato."
    luogo: Municipio, la sala consiliare, all'alba
    area: quartieri-alti
    requisiti: [pista.pelle == 4]
    testo: |
      L'alba porta soltanto nebbia, e dalle finestre alte della sala consiliare
      i tetti della Città Bassa compaiono a pezzi. Julia Castaldi è vestita di
      scuro, senza nemmeno la spilla del Consiglio, e Toren Galdrick porta
      l'armatura completa, con le piastre che tintinnano a ogni passo.

      Sul tavolo le prove sono in pile ordinate dal furiere, e accanto alle
      lettere con l'alloro ci sono le ricevute delle casse degli Scuri, tutte
      con la tua firma. Qualcuno ha posato una tazza di caffè su un angolo
      delle lettere, e l'alone ha macchiato il sigillo dei Malgrani.

      «Ottone Malgrani è finito» dice Julia con la voce roca. «Con queste carte
      va in tribunale per estorsione e collusione, e qui dentro non c'è niente
      che un avvocato della Gilda possa spiegare.» Si lascia cadere su una
      sedia. «Ogni passo che facciamo per la giustizia ci allontana dalla città
      che volevamo proteggere, eppure indietro non si torna.»

      {politica-ed-economia Media} Quando un Casato cade i suoi debiti rotolano
      in basso, e il primo a pagarli sarà chi compra il pane dai suoi forni.

      {origine rampollo-dei-quartieri-alti} Ai pranzi del Consiglio Julia porta
      sempre la spilla, e senza, nella luce grigia della sala, ti sembra più
      giovane e più stanca.

      Galdrick incrocia le braccia, e le piastre dei gomiti stridono nel
      silenzio.
    opzioni:
      - testo: "Ascoltare Galdrick"
        immagine: personaggi/toren-galdrick
        costo: 0
        esito:
          titolo: La linfa
          testo: |
            Galdrick conta quello che succede se trascinano Ottone in tribunale,
            con gli Scuri che si muovono e la gente che paga in pane. Julia dice
            che Mirko Vesh ha costruito una rete, e che se i Malgrani erano il
            tronco lui è la linfa. «Ed è dappertutto» dice Galdrick, che da dieci
            anni lo insegue. «Questa è una guerra, e in guerra chi non colpisce
            per primo muore.»
      - testo: "Chiedere della Città Bassa"
        costo: 0
        esito:
          titolo: Il braciere
          testo: |
            «Laggiù è pieno di disperati che negli Scuri vedono un lavoro e una
            protezione» dice Julia. «Se saltiamo addosso a Mirko con gli stendardi
            della città, difenderanno lui.» «Mirko è già in guerra, e aspetta
            soltanto che lo accettiamo anche noi» risponde Galdrick, freddo. «E
            molti laggiù non vedono l'ora che Vesh sparisca.»

            {empatia Media} Litigano così forte perché ciascuno ha paura che
            l'altro abbia più ragione.
      - testo: "Chiedere per Lucia Malgrani"
        immagine: personaggi/lucia-malgrani
        requisiti: [lucia == 1]
        costo: 0
        esito:
          titolo: Testimone
          testo: |
            Racconti di Lucia Malgrani e di come ti ha aiutato, scegliendo le parole
            con più cura del solito. «Se collabora, la prendiamo come testimone e
            senza catene» dice Julia, e scrive una riga a margine del mandato. I
            bambini, aggiunge, sono a Ghoran con Urtilia e restano fuori da tutto.

            «Urtilia Mendion non interverrà, ha chiesto soltanto questo» dice
            Galdrick, e torna a guardare la nebbia.
      - testo: "Dire a Galdrick che verrai con lui"
        immagine: personaggi/toren-galdrick
        esito:
          titolo: La bocca del lupo
          testo: |
            Gli dici che verrai con lui, e Galdrick si toglie l'elmo. «Il mandato per
            il Maniero parte stanotte, e noi intanto scendiamo alla Pignatta» dice.
            «Siamo già dentro la bocca del lupo, e adesso possiamo soltanto affondare
            il coltello.» Julia cede, augurandosi che la luce del Velo li assista.
            «Preparati, perché fra un'ora la Città Bassa sarà nel caos» ti dice
            Galdrick sulla porta.
          effetti: { pista.pelle: 1, rep.caserma: 0.5 }
          vai: citta-bassa
      - testo: "Dare ragione a Julia, e andare lo stesso"
        immagine: personaggi/julia-castaldi
        esito:
          titolo: La gente da guardare
          testo: |
            Dici a Julia che ha ragione a temere la folla, e che verrai lo stesso,
            perché laggiù qualcuno dovrà guardare in faccia la gente prima di
            colpirla. «Allora tienila d'occhio tu, la gente, perché Toren guarderà
            soltanto Vesh» dice lei. Firma il mandato per il Maniero, mormorando che
            la luce del Velo li assista, mentre Galdrick dalla porta avverte che fra
            un'ora la Città Bassa sarà nel caos.
          effetti: { pista.pelle: 1, rep.castaldi: 0.5 }
          vai: citta-bassa

  # ------------------------------------------------------------ 5 · l'assalto alla Pignatta
  - id: l-assalto-alla-pignatta
    presso: pignatta-grassa
    immagine: personaggi/mirko-vesh
    titolo: L'assalto alla Pignatta
    sommario: "Galdrick scende in Città Bassa con i miliziani e i mercenari di Ghoran, e Mirko Vesh lo aspetta sulla porta."
    luogo: Pignatta Grassa, lo spiazzo, di notte
    area: citta-bassa
    requisiti: [pista.pelle == 5]
    testo: |
      Stasera le finestre della Città Bassa sono chiuse. Galdrick cammina in
      testa con i miliziani scelti intorno e i mercenari di Ghoran in coda, e
      tu due passi dietro di lui.

      Lo spiazzo della Pignatta è illuminato da decine di lanterne appese ai
      fili. Davanti alle porte spalancate c'è Mirko Vesh, magro ed elegante,
      con un anello a ogni dito, e ai lati i suoi tenenti. Mauro Scrocco ha in
      mano un'ascia da boscaiolo; Rozalia Marga si rigira fra le dita due
      stiletti sottili, Nestor Gramm scuote una boccetta verde, e Borso, con
      l'anello delle chiavi alla cintura, guarda soltanto Galdrick. Di Nihali
      Cuzan stanotte non c'è traccia.

      Mirko alza una mano, e dai vicoli escono centinaia di sagome con randelli
      e bottiglie rotte, molti ragazzi che hanno paura e guardano te.

      {origine figlio-della-citta-bassa} Metà di quelle facce le hai viste
      crescere fra le fucine.

      {armi-da-mischia Media} L'ascia di Mauro è pesante in punta e torna
      indietro piano, mentre gli stiletti di Rozalia sono fatti per una cosa
      sola.

      «Vesh! Questa è la tua ultima notte!» grida Galdrick.

      Mirko ride, calmo. «Vecchio amico, no, è la tua.»

      Le due lame escono insieme dai foderi, e i due uomini spariscono dentro
      la Pignatta. Le porte sbattono alle loro spalle, e qua fuori adesso tocca
      a te.
    opzioni:
      - testo: "Colpire di piatto e farti strada fino ai tenenti"
        descrizione: "Il piatto della lama e l'elsa per la folla, e la lama vera per Mauro e i suoi."
        combattimento: i-tenenti-di-vesh
        vittoria:
          titolo: Non vogliono ucciderci
          testo: |
            Ti fai strada a colpi di piatto e d'elsa, e chi cade si rialza e
            scappa. Qualcuno grida «Non vogliono ucciderci!», e mezza folla si
            sparpaglia. Mauro ti viene incontro con l'ascia alta, e quando
            finalmente va giù fa tremare le lanterne. Nestor Gramm alza le mani e
            Borso lo tengono in quattro, mentre di Rozalia resta il fumo di un
            fumogeno.
          effetti: { nomea.citta-bassa: 2 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        sconfitta:
          titolo: La milizia
          testo: |
            La folla si chiude e Mauro ti arriva addosso. L'ascia ti prende di
            striscio sulla spalla, e un ragazzo ti spacca una bottiglia sulla
            nuca, poi la guarda come se non sapesse da dove gli sia venuta. I
            miliziani di Galdrick prendono Mauro in sei. Nestor si arrende e Borso
            lo tengono in quattro, mentre di Rozalia resta il fumo. Fra la folla
            qualcuno racconta che colpivi di piatto.
          effetti: { nomea.citta-bassa: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Parlare alla folla"
        descrizione: "Sono centinaia, metà ragazzi pagati a settimana, e se qualcuno gli parla prima delle bottiglie qualcuno torna a casa."
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Difficile }
        successo:
          titolo: La settimana è finita
          testo: |
            Sali su un carro rovesciato e parli forte. Dici che la Caserma è
            venuta solo per Vesh e i suoi tenenti, e che a chi torna a casa
            stanotte nessuno chiederà il nome. I vicoli si svuotano a gruppi, e
            quando Mauro abbassa l'ascia i mercenari di Ghoran gli sono addosso.
            Nestor Gramm posa la boccetta e Borso lo legano in quattro, mentre di
            Rozalia resta il fumo.
          pe: { persuasione: 5 }
          effetti: { nomea.citta-bassa: 2 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: Le bottiglie
          testo: |
            Prima della terza frase una bottiglia ti prende sulla fronte, e il
            mondo diventa bianco e silenzioso. Qualcuno ascolta lo stesso, e
            mentre scendi dal carro vedi un gruppo di ragazzi lasciare i randelli
            contro un muro. Gli altri ti vengono addosso finché la milizia non fa
            quadrato. Quando la folla si sparpaglia i tenenti di Vesh sono a terra
            o in catene, tutti tranne Rozalia, sparita nel fumo.
          effetti: { ferite: 2, nomea.citta-bassa: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Ricordare a Mauro l'Arena"
        immagine: personaggi/mauro-scrocco
        descrizione: "Mauro è uscito dall'Arena umiliato davanti a mezza città, e stanotte la mezza città è la stessa."
        requisiti: [pista.arena >= 3]
        prova: { attributo: sociale, abilita: [intimidire, espressivita], difficolta: Media }
        successo:
          titolo: Il quadrante
          testo: |
            Gli gridi che stanotte non c'è nessun cristallo a rimetterlo in piedi, e
            quelli che erano sulle gradinate dell'Arena ridono. Mauro diventa viola e
            ti carica senza guardare dove mette i piedi, e inciampa nella corda di una
            lanterna caduta. I mercenari di Ghoran gli sono addosso in sei, e mezza
            folla torna nei vicoli. Nestor alza le mani e Borso si lascia legare,
            mentre Rozalia sparisce nel fumo.
          effetti: { nomea.citta-bassa: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: Il furore muto
          testo: |
            Gli gridi dell'Arena, e Mauro non diventa nemmeno rosso. Ti viene incontro
            piano con l'ascia bassa, e il manico ti spacca il labbro e ti manda nel
            fango prima che tu abbia capito quanto è veloce un uomo così grosso. Lo
            prendono in sei i miliziani di Galdrick. Nella confusione Nestor si
            arrende e Borso lo legano contro il muro, mentre di Rozalia resta il fumo
            di un fumogeno.
          effetti: { ferite: 2.5 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Puntare dritto ai tenenti"
        descrizione: "La folla la tengano i miliziani. Tu vai da Mauro, e degli altri ti occupi dopo."
        combattimento: mauro-scrocco
        vittoria:
          titolo: L'ascia nel fango
          testo: |
            Passi in mezzo alla folla e lasci ai miliziani quelli che ti vengono
            addosso. Mauro ti aspetta davanti alle porte chiuse, e ogni colpo che
            pari ti risale fino alla spalla, finché non gli entri sotto la lama e
            l'ascia finisce nel fango. Senza Mauro i tenenti si sfaldano. Nestor
            si siede per terra e Borso lo prendono i mercenari di Ghoran, mentre
            Rozalia sparisce nel fumo.
          effetti: { rep.caserma: 0.5 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        sconfitta:
          titolo: Le porte chiuse
          testo: |
            Mauro colpisce per primo, e ti ritrovi con la schiena contro il legno
            della Pignatta e le sue mani intorno al collo, che sanno di cipolla,
            finché un mercenario di Ghoran non gli spacca un'asta sulla testa.
            Intorno la milizia ha disperso la folla. Nestor si è arreso e Borso è
            in catene, mentre di Rozalia resta il fumo, e domani in Città Bassa
            ricorderanno soprattutto le randellate.
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Aprirti la strada a qualunque costo"
        descrizione: "Chi ti si para davanti va giù e non si rialza, ed è la via più corta fino ai tenenti."
        prova: { attributo: fisico, abilita: [armi-da-mischia, armi-da-distanza, intimidire], difficolta: Difficile }
        successo:
          titolo: Gli assassini del governo
          testo: |
            Il primo ragazzo che ti si para davanti con una bottiglia rotta va giù
            e resta giù, e il secondo fa la stessa fine. Dopo il terzo la folla si
            apre urlando, e qualcuno grida «Gli assassini del governo!». Mauro
            cade morto davanti alle porte della Pignatta, e gli altri tenenti si
            arrendono, tranne Rozalia. Sotto le lanterne restano otto corpi, e
            soltanto uno era un tenente di Vesh.
          effetti: { nomea.citta-bassa: -2, tormento: 1 }
          imposta: { mauro: 2 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: Una notte da ricordare
          testo: |
            La folla è più grande di quanto pensavi e non scappa. Per ogni ragazzo
            che va giù ne arriva un altro con un randello, finché non ti
            trascinano fuori i mercenari di Ghoran, con un taglio sul fianco. I
            tenenti li prendono loro, tutti tranne Rozalia. Sullo spiazzo restano
            i corpi dei ragazzi, e dietro le imposte la Città Bassa ha visto chi
            li ha messi lì.
          effetti: { nomea.citta-bassa: -2, ferite: 2.5, tormento: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Guardare Rozalia"
        immagine: personaggi/rozalia-marga
        descrizione: "Rozalia tiene gli occhi sui vicoli, e i conti li fa sempre prima degli altri."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Media }
        successo:
          titolo: In pari
          testo: |
            Le arrivi accanto e le dici che stanotte la Pignatta cade comunque, e
            che una falsaria senza padrone trova lavoro ovunque. «Per la
            precisione, tesoro, Mirko i ragazzi li paga fino a stasera» dice
            Rozalia, e grida verso i vicoli, con una voce da pescivendola, che la
            paga è finita. Poi sparisce in un filo di fumo, e senza i ragazzi la
            milizia prende i tenenti uno alla volta.
          effetti: { nomea.citta-bassa: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: Il fumogeno
          testo: |
            Rozalia ha già fatto i suoi conti senza di te. Ti sorride con tutta la
            bocca, e lo stiletto ti apre la manica e il braccio dal polso al
            gomito, così pulito che il dolore arriva dopo, poi rompe un fumogeno
            ai tuoi piedi. Quando smetti di tossire i mercenari di Ghoran prendono
            i tenenti uno alla volta, mentre tu ti stringi il braccio nel
            fazzoletto.
          effetti: { ferite: 2 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Curare un ragazzo davanti a tutti"
        descrizione: "Un ragazzo della folla è caduto con la testa aperta, e la Liturgia dell'Albero chiude le ferite davanti a tutti."
        incantesimo: rimarginare
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le mani sulla ferita
          testo: |
            Ti inginocchi accanto al ragazzo ferito, e la folla si ferma con i
            randelli alzati. Gli posi le mani sulla testa e preghi l'Albero, e la
            ferita si chiude finché il ragazzo apre gli occhi e chiama sua madre.
            Una donna esce dalla folla e se lo prende in braccio, e dietro di lei
            se ne vanno in tanti. La milizia prende i tenenti, tranne Rozalia.
          effetti: { nomea.citta-bassa: 2, rep.velo: 0.5 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: La preghiera interrotta
          testo: |
            La ferita sanguina ancora sotto le tue dita quando una bottiglia ti
            prende alla schiena e un randello alla nuca. Il ragazzo lo portano via
            due donne, svenuto, ma la folla ha visto che cosa cercavi di fare, e
            una parte torna nei vicoli. Quando ti rialzi i tenenti di Vesh sono in
            catene, tutti tranne Rozalia. Sulle dita ti si secca il sangue del
            ragazzo.
          effetti: { nomea.citta-bassa: 1, ferite: 1.5, tormento: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Chiamare per nome i ragazzi della tua strada"
        descrizione: "Metà di quelle facce le conosci, e sai di quale madre hanno più paura."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Media }
        successo:
          titolo: I nomi
          testo: |
            Sali su un carro rovesciato e chiami i nomi, dal figlio del bottaio
            alle due sorelle della strada delle fucine. La voce ti esce con
            l'accento della strada che avevi faticato a perdere. Al quinto nome i
            vicoli si svuotano, e quando Mauro abbassa l'ascia i mercenari di
            Ghoran gli sono addosso. Nestor posa la boccetta e Borso lo legano in
            quattro, mentre di Rozalia resta il fumo.
          pe: { persuasione: 5 }
          effetti: { nomea.citta-bassa: 2 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
        fallimento:
          titolo: La prima bottiglia
          testo: |
            Il primo che chiami ti tira una bottiglia sulla fronte, con una mira che
            da bambino non aveva. Qualcuno ascolta, e mentre scendi dal carro vedi
            le due sorelle della strada delle fucine lasciare i randelli contro un
            muro. Gli altri ti vengono addosso finché la milizia non fa quadrato, e
            quando la folla si sparpaglia i tenenti di Vesh sono a terra o in
            catene, tutti tranne Rozalia.
          effetti: { ferite: 2, nomea.citta-bassa: 1 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh
      - testo: "Aprire ai ragazzi la porta del retrobottega"
        descrizione: "Dal retrobottega si esce sul vicolo dei barili, e una folla con un'uscita non deve scegliere una parte."
        quando: [fazione.scuri >= 9]
        esito:
          titolo: La porta dei barili
          testo: |
            Tiri il paletto della porta del retrobottega. Poi fischi due volte,
            come al tavolo d'angolo quando arriva la ronda, e i ragazzi passano di
            corsa nel vicolo dei barili, seguiti dal resto della folla. Mauro ti
            viene incontro con l'ascia alta, ma i mercenari di Ghoran gli sono
            addosso prima. Nestor posa la boccetta e Borso lo legano in quattro,
            mentre di Rozalia resta il fumo.
          effetti: { nomea.citta-bassa: 2 }
          imposta: { mauro: 1 }
          segue: galdrick-e-vesh

  - id: galdrick-e-vesh
    presso: pignatta-grassa
    immagine: personaggi/toren-galdrick
    titolo: Dieci anni
    tipo: seguito
    luogo: Pignatta Grassa, fra le fiamme
    area: citta-bassa
    requisiti: [pista.pelle == 5]
    testo: |
      La Pignatta Grassa brucia, e le travi del tetto crollano una dopo l'altra.
      Quando sfondi la porta del cortile delle risse li trovi lì, in un quadrato
      di pietra e di cenere.

      Mirko Vesh ha la camicia strappata e la barba sporca di sangue, e la sua
      sciabola sottile riflette il rosso delle fiamme. «Dieci anni, Galdrick,
      dieci anni che provi a prendermi» dice con un sorriso storto. Galdrick
      lascia cadere il mantello nella polvere e alza una lama spessa, con il filo
      mangiato dagli anni. «Sono qui» dice piano, «e tu questa città non la
      controlli più.»

      «È la città che ha scelto me!» grida Mirko. «È la paura che ha scelto te»
      risponde Galdrick senza muoversi.

      Mirko scatta, e la sciabola apre il fianco di Galdrick. Lo sceriffo
      barcolla, poi avanza dentro il colpo successivo e, tenendogli il braccio con
      la mano libera, gli spinge la lama sotto le costole, verso l'alto.

      «Dieci anni per questo?» mormora Mirko sputando sangue, e muore in
      ginocchio, sorretto dall'uomo che lo ha ucciso.

      Galdrick si siede su un gradino del cortile, con la spada piantata nella
      terra e il fianco che sanguina a fiotti lenti. «È finita per tutti e due»
      dice senza alzare la testa.
    opzioni:
      - testo: "Sederti sul gradino accanto a lui"
        costo: 0
        esito:
          titolo: La caccia
          testo: |
            «Dovrei dirti che è stato giusto, ed è vero» dice Galdrick, con gli
            occhi sul punto dove Mirko è caduto. Poi si volta verso di te, e la
            faccia gli si incrina. «Ma gli davo la caccia da una vita, e lui dava
            un senso alla mia. Mi faceva sentire vivo, e non l'avrei mai ammesso.»
            Si passa sulla testa rasata una mano sporca di cenere.
          segue: galdrick-e-vesh
      - testo: "Chiedergli come si sente"
        costo: 0
        esito:
          titolo: Più leggero, o più vuoto
          testo: |
            Galdrick appoggia la testa al muro e guarda il fumo. «Tutte le volte
            che mi sfuggiva mi pareva che la città stesse appesa a un filo, e che a
            tenerlo fossi soltanto io. È stato l'orgoglio a tenermi in piedi, tante
            notti quanto la giustizia.» Adesso non sa se si sente più leggero o più
            vuoto. «Non ero pronto a dire addio a questo bastardo.»
          segue: galdrick-e-vesh
      - testo: "Guardare Mirko Vesh"
        immagine: personaggi/mirko-vesh
        costo: 0
        esito:
          titolo: Gli anelli
          testo: |
            Mirko è disteso dove è caduto, con gli occhi aperti verso le travi che
            bruciano, e da morto sembra più piccolo e più giovane. Dei suoi anelli
            soltanto uno è suo, quello liscio d'argento sul mignolo sinistro, e
            gli altri li ha tolti ai debitori, uno per ogni conto chiuso. «Domani
            li riportiamo ai loro padroni» dice Galdrick, «a quelli che sono
            ancora vivi.»
          segue: galdrick-e-vesh
      - testo: "Aiutarlo ad alzarsi"
        esito:
          titolo: Il silenzio
          testo: |
            Galdrick si appoggia alla tua mano, e pesa più di quanto pensavi. «Non
            fare come me» dice mentre si raddrizza, «e non legare la tua vita a un
            nemico, perché quando il duello finisce ti resta soltanto il
            silenzio.» Rimette la spada nel fodero. «Andiamo. Il resto spetta a
            Julia.» Sale verso i Quartieri Alti un passo alla volta, senza
            chiederti di sorreggerlo.
          effetti: { pista.pelle: 1, racconto: 1 }
          vai: quartieri-alti
      - testo: "Medicargli il fianco"
        descrizione: "Il taglio è lungo e sanguina ancora, e lo sceriffo non chiederà aiuto a nessuno."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: La cucitura
          testo: |
            Gli apri la giubba e chiudi il taglio con l'ago e il filo della
            bisaccia, mentre lui guarda il fuoco. «Non fare come me» dice mentre
            si abbottona, «e non legare la tua vita a un nemico, perché quando il
            duello finisce ti resta soltanto il silenzio.» Si alza da solo.
            «Andiamo. Il resto spetta a Julia.» E sale verso i Quartieri Alti
            senza zoppicare.
          pe: { medicina: 5 }
          effetti: { pista.pelle: 1, rep.caserma: 1, racconto: 1 }
          vai: quartieri-alti
        fallimento:
          titolo: Il filo che si strappa
          testo: |
            Le mani ti tremano e il filo si strappa due volte. Galdrick ti toglie
            l'ago con delicatezza e si preme il fazzoletto sulla ferita. «Lascia,
            ci pensa Vantes. Non fare come me, e non legare la tua vita a un
            nemico, perché quando il duello finisce ti resta soltanto il
            silenzio.» Si alza appoggiandosi alla spada e sale verso i Quartieri
            Alti con la mano sul fianco.
          effetti: { pista.pelle: 1, racconto: 1, tormento: 1 }
          vai: quartieri-alti

  # ------------------------------------------------------------ 6 → 7 · la città dopo Vesh
  - id: la-citta-dopo-vesh
    presso: municipio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: La città dopo Vesh
    sommario: "Tre settimane dopo la notte della Pignatta, Julia Castaldi ti aspetta in Municipio con una cosa del Consiglio."
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [pista.pelle == 6]
    testo: |
      Tre settimane dopo la notte della Pignatta il Municipio ha le finestre
      aperte, e sulla panca dell'anticamera aspettano mugnai e taglialegna con
      il cappello in mano, venuti per le licenze nuove. Sul davanzale qualcuno
      ha messo un mazzo di fiori di campo in un barattolo da conserva.

      Julia Castaldi ti riceve fra pile di pratiche più alte del tavolo, e ti
      racconta la città come si legge un bilancio. Gli Scuri come rete non
      esistono più, e nei villaggi restano cellule piccole che in Municipio
      nessuno copre. Ottone Malgrani è stato condannato a morte dopo un processo
      breve. Senza i Malgrani e senza i Tarvelin, in Consiglio le liti restano,
      però la corruzione ha smesso di comandare.

      {politica-ed-economia Media} Due Casati spariti in un mese lasciano un
      vuoto, e qualcuno sta già prendendo le misure delle sedie.

      {origine mercante-dei-ponti} Licenze sul grano vogliono dire registri
      nuovi, e ti sorprendi a calcolare il prezzo della farina ai banchi dei
      Ponti.

      «Ho fatto le licenze per chi macina e commercia grano, con controlli sulle
      quantità e una tassa sulla produzione» dice. «Il Comune ha pagato le
      cooperative che hanno rilevato i mulini e le segherie dei Malgrani, e i
      prezzi restano bassi. Le casse invece sono vuote, e ricostruire la Città
      Bassa ci costerà mesi.»
    opzioni:
      - testo: "Chiedere di Lucia Malgrani"
        immagine: personaggi/lucia-malgrani
        requisiti: [lucia == 1]
        costo: 0
        esito:
          titolo: Il Maniero venduto
          testo: |
            «Lucia ha collaborato fino all'ultima carta» dice Julia. «Ha venduto
            il Maniero alla città, e il Consiglio vuole farne un istituto di
            studi, con le statue degli antenati fuori in cortile, sotto la pioggia
            come sempre.» Si concede un mezzo sorriso. «È andata a Ghoran con i
            figli, a casa di Urtilia. Prima di partire ha chiesto di salutarti, e
            tu non c'eri.»
      - testo: "Chiedere di Lucia Malgrani"
        immagine: personaggi/lucia-malgrani
        requisiti: [lucia != 1]
        costo: 0
        esito:
          titolo: L'esilio
          testo: |
            «Lucia Malgrani l'abbiamo processata insieme al marito» dice Julia. «Dei
            suoi conti sapeva poco, però abbastanza da tacere per anni, e il
            tribunale l'ha esiliata a Ghoran, dove ci sono la zia e i bambini.»
            Sfoglia una pratica senza leggerla. «Il Maniero l'ha comprato la città
            all'asta, e il Consiglio vuole farne un istituto di studi.»
      - testo: "Chiedere della Città Bassa"
        requisiti: [nomea.citta-bassa >= 2]
        costo: 0
        esito:
          titolo: Il tuo nome nei vicoli
          testo: |
            «In Città Bassa il tuo nome lo dicono volentieri» dice Julia.
            «Raccontano che quella notte hai rimandato a casa i loro figli, e per
            la prima volta da anni la gente sale in Municipio a chiedere, invece
            di andare alla Pignatta.» Della Pignatta, aggiunge, restano i muri
            anneriti, e davanti alla porta qualcuno ha già vangato un orto.
      - testo: "Chiedere della Città Bassa"
        requisiti: [nomea.citta-bassa >= 0, nomea.citta-bassa < 2]
        costo: 0
        esito:
          titolo: I muri anneriti
          testo: |
            «Laggiù di te parlano poco» dice Julia, stringendosi nelle spalle. «Si
            ricordano la milizia e le randellate più delle facce, e quando salgono per
            le licenze chiedono ancora chi pagherà i vetri. Forse per te è meglio
            così.» Della Pignatta restano i muri anneriti, e davanti alla porta
            qualcuno ha vangato un orto dove le prime cipolle sono spuntate tutte
            storte.
      - testo: "Chiedere della Città Bassa"
        requisiti: [nomea.citta-bassa < 0]
        costo: 0
        esito:
          titolo: Sui muri
          testo: |
            Julia ci mette un po' a rispondere, e intanto allinea la penna al
            bordo del tavolo. «Sui muri della Città Bassa c'è scritto *assassini
            del governo*, e sotto qualche volta c'è il tuo nome. Le scritte le
            facciamo lavare, e la notte dopo tornano.» Davanti alla Pignatta
            annerita qualcuno ha piantato una croce di legno per ogni ragazzo
            morto sullo spiazzo.
      # L'Acciaieria secondo acciaieria.futuro (citta/minori.yaml, `l-acciaieria-senza-padrone`).
      - testo: "Accettare la ricompensa del Consiglio"
        esito:
          titolo: La borsa del Consiglio
          testo: |
            Julia posa sul tavolo una borsa con il sigillo del Consiglio e una
            lettera firmata da lei e da Galdrick, che dice a chiunque la legga che
            la città ti deve un favore. «Questa è l'ultima borsa che avevamo per
            una cosa giusta» dice. Galdrick lo incontri sulle scale senza
            armatura, con il fianco ancora fasciato, e ti stringe la mano prima di
            tornare verso la Caserma.
          effetti: { monete: 120, rep.castaldi: 1, rep.caserma: 1, pista.pelle: 1, racconto: 1 }
      - testo: "Chiedere che la borsa vada alla Città Bassa"
        descrizione: "Tutta la ricompensa per i tetti bruciati intorno alla Pignatta, anche se la tua bisaccia è quasi vuota."
        esito:
          titolo: I tetti di una strada
          testo: |
            Chiedi a Julia di spendere la borsa in Città Bassa, per le case
            bruciate intorno alla Pignatta. Lei ti guarda, poi la rimette nel
            cassetto con un cartellino, *Città Bassa, tetti*. «Basta per i tetti
            di una strada» dice, e ti consegna la lettera firmata da lei e da
            Galdrick, che dice che la città ti deve un favore. Uscendo, un mugnaio
            ti riconosce e si toglie il cappello.
          effetti: { rep.castaldi: 2, rep.caserma: 1, nomea.citta-bassa: 1, pista.pelle: 1, racconto: 1 }
      - testo: "Chiedere dell'Acciaieria dei Tarvelin"
        quando: [acciaieria.futuro == 0]
        costo: 0
        esito:
          titolo: La ciminiera spenta
          testo: |
            «La Gilda è in bilico, perché l'Acciaieria dei Tarvelin è ferma e
            Liaren non la vuole» dice Julia. «Alla Casa dei Nodi vorrebbero
            riaccenderla con un amministratore loro, e intanto il turno di giorno
            aspetta tutte le mattine sul muretto davanti al cancello.» Dalla
            finestra si vede la ciminiera spenta, con uno straccio nero appeso in
            cima.
      - testo: "Chiedere dell'Acciaieria dei Tarvelin"
        quando: [acciaieria.futuro == 1]
        costo: 0
        esito:
          titolo: Il fumo della Gilda
          testo: |
            «L'Acciaieria l'ha riaccesa la Gilda, con un amministratore suo» dice
            Julia. «Alla Casa dei Nodi hanno rialzato la testa, e la tassa sulla
            colata la pagano prima della scadenza, cosa che i Tarvelin non hanno
            mai fatto. Liaren dal cancello non ci è più passata.»
      - testo: "Chiedere dell'Acciaieria dei Tarvelin"
        quando: [acciaieria.futuro == 2]
        costo: 0
        esito:
          titolo: La fornace degli operai
          testo: |
            «All'Acciaieria lavorano in società quelli del turno di giorno, con la
            concessione firmata da Liaren» dice Julia. «È la prima fornace della
            città senza un padrone, e alla Gilda non hanno ancora deciso se
            esserne contenti. Il lyssan intanto lo compra Irsa Valbrun, fino
            all'ultima colata.»
      - testo: "Chiedere dell'Acciaieria dei Tarvelin"
        quando: [acciaieria.futuro == 3]
        costo: 0
        esito:
          titolo: La socia di Liaren
          testo: |
            «L'Acciaieria la manda avanti Irsa Valbrun d'accordo con Liaren, e
            alla fornace c'è Abele Torsi» dice Julia. «Alla Gilda brontolano per
            l'amministratore che non hanno potuto metterci, e intanto il lyssan
            esce e le famiglie degli otto prendono la loro parte.» Batte due
            volte la penna sul tavolo, soddisfatta.
