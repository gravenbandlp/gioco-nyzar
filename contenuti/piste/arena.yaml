# L'Arena di Qir-Azel (pista.arena 0 → 5): l'annuncio di Galdrick e l'iscrizione da Orvald, la Grande Mischia,
# la prova a squadre con l'eco del Cinghiale Crudele, l'ora nell'area dei combattenti e la finale contro la squadra
# di Galdrick. Dopo la pista, due storie all'Arena: le giornate d'esibizione e la rivincita per il titolo.
# La squadra del protagonista: Besk Dravec (assegnata da Orvald), Corin Ashdale e Tenebra.
# L'Arena e Sotto la pelle si giocano in qualunque ordine. L'Arena resta chiusa mentre la pelle è fra 4 e 6 (Borso
# latitante, l'assalto, Galdrick ferito), e `il-carceriere` aspetta che il torneo sia finito: così un torneo cominciato
# con pista.pelle < 4 finisce tutto prima della fuga di Borso. Con pista.pelle >= 7 gli Scuri non esistono più, Borso
# è in catene e Mauro non si nomina: al loro posto ci sono Bram Halgast nella squadra di Liaren e una squadra di
# mercenari di Ghoran con Durgan (varianti con `quando` e `la-grande-mischia-dopo-vesh`).
storylet:
  # ------------------------------------------------------------ 0 → 1 · l'annuncio e l'iscrizione
  - id: l-annuncio-dei-cristalli
    presso: arena-di-qir-azel
    immagine: ambientazione/cristalli-conduttori
    titolo: L'annuncio dei cristalli
    sommario: "I cristalli delle facciate ronzano tutti insieme, e la voce di Galdrick annuncia in ogni vicolo che l'Arena riapre."
    luogo: Qir-Azel, poi l'Arena e la camera dei combattenti
    area: quartieri-alti
    requisiti: [pista.arena == 0, pista.capomozzo >= 7, pista.pelle != 4, pista.pelle != 5, pista.pelle != 6]
    testo: |
      Sei davanti a un forno, a scegliere fra due pagnotte, quando i cristalli
      delle facciate e dei lampioni tremano tutti insieme con un ronzio che ti
      sale dalle suole ai denti. Poi ne esce la voce di Toren Galdrick, così
      netta che ti volti a cercarlo.

      «Abitanti di Qir-Azel» dice. «La nostra città è stata messa alla prova, e
      abbiamo visto che cosa si muoveva ai margini del Bosco. Per questo l'Arena
      riapre a chiunque abbia qualcosa da dimostrare, e chi arriverà in fondo
      alle Tre Prove sarà il Campione di Qir-Azel. Io sono Toren Galdrick, e vi
      dico che Qir-Azel non si piega né oggi né mai.»

      {espressivita Facile} Quel *né oggi né mai* l'ha provato davanti a uno
      specchio, e la pausa prima del suo nome l'ha contata.

      Il giorno dopo due miliziani dai mantelli scarlatti ti accompagnano nella
      camera dei combattenti dell'Arena, dove Orvald Temmerin sta congedando dal
      suo banco Dolovan Stroud, lo stalliere delle Scuderie della Zanna Rotta.
      Il corvo Pett ti guarda dal bordo del banco con la testa inclinata. «Ah.
      Sei tu. Bene» dice Orvald senza alzare gli occhi dal registro. «L'Arena ti
      aspetta. Che cosa posso fare per te?»

      {origine allievo-di-torvessa} Quell'«Ah. Sei tu» lo conosci dall'aula,
      dove lo dice a chi arriva in ritardo con il compito fatto bene.
    opzioni:
      - testo: "Chiedere il regolamento della Mischia"
        descrizione: "Orvald di rado risponde due volte alla stessa domanda. Meglio fargliela bene la prima."
        immagine: personaggi/orvald-temmerin
        costo: 0
        esito:
          titolo: Dodici, non uno di più
          testo: |
            «La prima prova è la Grande Mischia» dice Orvald. «Entrano in dodici e
            vince uno solo, dentro un recinto ovale di contenimento magico. L'ho
            voluto io, per quei furbi che scappano ai bordi e sperano che gli
            altri si ammazzino fra loro.» Al vincitore toccherà un oggetto della
            sua collezione personale, e Pett sbatte le ali una volta sola.
      - testo: "Chiedere delle altre due prove"
        descrizione: "Una mischia non fa un torneo. Galdrick ha parlato di tre prove."
        immagine: personaggi/orvald-temmerin
        costo: 0
        esito:
          titolo: Chi capisce l'arena
          testo: |
            Dopo la Mischia, spiega Orvald, si combatte a squadre da quattro, e ogni squadra affronta tre
            volte quello che l'Arena le offre, l'ultima volta una creatura sola, la peggiore. La squadra
            te la darà lui quando firmi. In finale le squadre migliori si affrontano fra loro, con i
            piloni accesi e il terreno che si muove, e chi capisce l'arena ci arriva meno stanco.
      - testo: "Chiedere che cosa è vietato"
        descrizione: "In bisaccia hai sempre qualcosa che un giudice potrebbe non gradire."
        immagine: personaggi/orvald-temmerin
        costo: 0
        esito:
          titolo: Con quello che hai addosso
          testo: |
            «Le pozioni restano fuori, e così le pergamene e qualunque cosa si
            consumi» dice Orvald. «Una cintura di Cristalli Conduttori protegge il
            pubblico, e anche voi. Morire qui dentro è molto difficile, e chi
            forza un colpo mortale viene squalificato e nei casi gravi passa la
            notte nelle celle della Caserma.»
      - testo: "Chiedere chi si è iscritto"
        descrizione: "Nella camera dei combattenti ci sono facce che conosci. Alcune ti salutano, altre no."
        immagine: personaggi/mauro-scrocco
        quando: [pista.pelle < 4]
        costo: 0
        esito:
          titolo: Facce note
          testo: |
            Galdrick è il favorito, e Liaren Tarvelin partecipa per uscire un
            giorno dalla locanda. Ettore Castaldi l'ha iscritto sua cugina Julia;
            Borso vuole fracassare più crani che può.

            Vicino ai catini Mauro Scrocco parla piano con Rozalia Marga, che
            tiene due stiletti fra le dita, accanto a un nano pieno di cicatrici e
            a Nihali Cuzan, che tossisce nella pipa.
      - testo: "Iscriverti alle Tre Prove"
        descrizione: "Una firma sul registro di Orvald. Il resto viene dopo."
        immagine: personaggi/besk-dravec
        requisiti: [pista.corin == 0]
        quando: [corin.salvato == 0]
        esito:
          titolo: La squadra di Orvald
          testo: |
            Firmi, e Orvald ti assegna la sua allieva Besk Dravec, una ragazza con
            gli occhiali e un vestito olvaro. «Lancia meglio di come parla, e
            parla moltissimo» dice.

            Si presenta un uomo in panciotto ricamato. «Corin Ashdale, della Gilda
            dei Mercanti. Vorrei imparare a essere un eroe, e bisogna stare vicino
            a uno.» Orvald lo scrive sul registro.
          pe: { persuasione: 3 }
          effetti: { pista.arena: 1 }
      - testo: "Iscriverti alle Tre Prove"
        descrizione: "Una firma sul registro di Orvald. Il resto viene dopo."
        immagine: personaggi/besk-dravec
        requisiti: [pista.corin >= 1, pista.corin <= 5]
        esito:
          titolo: La squadra di Orvald
          testo: |
            Firmi, e Orvald ti assegna la sua allieva Besk Dravec, una ragazza con
            gli occhiali e un vestito olvaro. «Lancia meglio di come parla, e
            parla moltissimo» dice.

            Alle tue spalle Corin Ashdale, con una spada nuova che porta come un
            ombrello, si schiarisce la voce. «Volevo imparare a essere un eroe,
            ricordi?» Orvald lo scrive sul registro.
          pe: { persuasione: 3 }
          effetti: { pista.arena: 1 }
      - testo: "Iscriverti alle Tre Prove"
        descrizione: "Una firma sul registro di Orvald. Il resto viene dopo."
        immagine: personaggi/besk-dravec
        requisiti: [pista.corin >= 6]
        esito:
          titolo: La squadra di Orvald
          testo: |
            Firmi, e Orvald ti assegna la sua allieva Besk Dravec, una ragazza con
            gli occhiali e un vestito olvaro. «Lancia meglio di come parla, e
            parla moltissimo» dice.

            Sulla porta compare Corin Ashdale, che dovrebbe essere a Laresh, e
            racconta di aver sentito del torneo a metà strada. «Dovevo ancora
            imparare a essere un eroe, ricordi?» Orvald l'ha già scritto sul
            registro.
          pe: { persuasione: 3 }
          effetti: { pista.arena: 1 }
      - testo: "Chiedere chi si è iscritto"
        descrizione: "Nella camera dei combattenti ci sono facce che conosci. Alcune ti salutano, altre no."
        immagine: personaggi/orvald-temmerin
        quando: [pista.pelle >= 7]
        costo: 0
        esito:
          titolo: Facce note
          testo: |
            Galdrick è il favorito, anche se la ferita di Vesh è ancora fresca, e
            Liaren Tarvelin partecipa per uscire dalla locanda. Ettore Castaldi
            l'ha iscritto sua cugina Julia; Bram Halgast vuole mostrare le sue
            lame.

            Vicino ai catini tre mercenari di Ghoran giocano a dadi con un nano
            pieno di cicatrici che prendeva la paga da Vesh, e uno ti riconosce da
            quella notte.
      - testo: "Iscriverti alle Tre Prove"
        descrizione: "Una firma sul registro di Orvald. Il resto viene dopo."
        immagine: personaggi/besk-dravec
        requisiti: [pista.corin == 0]
        quando: [corin.salvato >= 1]
        esito:
          titolo: La squadra di Orvald
          testo: |
            Firmi, e Orvald ti assegna la sua allieva Besk Dravec, una ragazza con
            gli occhiali e un vestito olvaro. «Lancia meglio di come parla, e
            parla moltissimo» dice.

            Un uomo in panciotto ricamato ti afferra il polso con due mani, come
            quel giorno sotto il bancone. «Corin Ashdale, quello delle castagne.
            Vi manca un uomo che vuole imparare a fare l'eroe?» Orvald lo scrive
            sul registro.
          pe: { persuasione: 3 }
          effetti: { pista.arena: 1 }
      - testo: "Chiedergli perché il preside dell'Accademia tiene i registri dell'Arena"
        descrizione: "A lezione non ne ha mai parlato. Fuori dall'aula, davanti al recinto, forse risponde."
        immagine: personaggi/orvald-temmerin
        quando: [origine.allievo-di-torvessa >= 1]
        costo: 0
        esito:
          titolo: Una domanda fuori orario
          testo: |
            «Perché il recinto l'ho voluto io, e chi vuole una cosa poi la deve
            sorvegliare» dice Orvald, posando la penna di traverso come in aula.
            «E perché chi scrive i registri decide che cosa ricorderà la città.
            Domani all'Accademia sei di nuovo un allievo; qui sei un nome sulla
            lista come gli altri.»

  # ------------------------------------------------------------ 1 → 2 · la Grande Mischia
  - id: la-grande-mischia
    presso: arena-di-qir-azel
    immagine: personaggi/orazio-belcanto
    titolo: La Grande Mischia
    sommario: "Dodici combattenti dentro un recinto che brucia chi lo tocca, e uno solo ci resterà dentro in piedi."
    luogo: Arena di Qir-Azel, il recinto ovale
    area: quartieri-alti
    requisiti: [pista.arena == 1, pista.pelle < 4]
    testo: |
      Quando i cristalli della cintura si accendono, Orazio Belcanto apre le
      braccia inanellate dalla tribuna. «Popolo di Qir-Azel! Che abbiano inizio
      le Tre Prove!» Il recinto ovale si accende di un verde acido.

      Galdrick saluta la tribuna con due dita e Borso si batte la clava sul
      palmo. Mauro Scrocco suda nella camicia color zafferano accanto a Dragna
      Gro-Malog. Il nano con le cicatrici si chiama Durgan, e un mercenario con
      lo scudo dipinto di fresco cerca sua madre in tribuna.

      {rissa Media} Borso fa rumore e Galdrick spettacolo, ma il pericolo è
      Durgan, che tiene le ginocchia piegate e non guarda la tribuna.

      {origine figlio-della-citta-bassa} Mauro Scrocco lo conosci da quando eri
      alto quanto il bancone della Pignatta, sempre col gesso in mano a segnare
      le puntate.

      {origine apprendista-raschiatore} Dragna tiene l'ascia come al Grifone la
      penna dei turni.
    opzioni:
      - testo: "Buttarti nella mischia"
        immagine: fazioni/scuri
        descrizione: "Undici avversari, e tutti contro di te appena si accorgono che sei ancora in piedi."
        combattimento: la-grande-mischia
        vittoria:
          titolo: L'ultimo in piedi
          testo: |
            Dragna e Mauro escono avvinghiati, e Galdrick, spinto oltre la linea verde da
            Borso e Durgan, si porta dietro Borso per il bavero. Il mercenario dallo
            scudo dipinto va giù per primo, e il nano ti costa una spalla e un labbro
            spaccato prima di andare giù. Orvald ti mette in mano un fermaglio d'argento
            intrecciato. «Questo non è roba da bancarella» dice.
          imposta: { mischia: 1 }
          effetti: { oggetto.fermaglio-di-orvald: 1, pista.arena: 1, racconto: 1 }
        sconfitta:
          titolo: Il favorito
          testo: |
            Durgan ti prende di piatto con il manico dell'ascia, e un calcio del
            mercenario ti spinge sulla linea verde. La scarica ti butta sulla
            sabbia di fuori, dove resti a contare i denti. Vince Galdrick, ma
            dalla tribuna arriva il tuo nome, e Orvald si china sul registro. «La
            folla ti vuole nella prova a squadre, e io non litigo con la folla.»
          imposta: { mischia: 2 }
          effetti: { pista.arena: 1 }
      - testo: "Restare al bordo e lasciare che si sfoltiscano"
        descrizione: "Il recinto brucia chi lo tocca. Stagli accanto senza toccarlo, mentre al centro si fanno a pezzi."
        prova: { attributo: fisico, abilita: [acrobazia, percezione], difficolta: Difficile }
        successo:
          titolo: Sul filo verde
          testo: |
            Ti tieni a un passo dalla linea verde, e Galdrick esce spinto da Borso
            e Durgan, trascinandosi dietro Borso per il bavero. Quando il
            mercenario carica ti scansi, e il recinto fa il resto. Durgan ti
            taglia un avambraccio prima di perdere l'equilibrio sul bordo. «Il
            bordo l'avevo pensato per i codardi» dice Orvald, e ti porge un
            fermaglio d'argento intrecciato. «Tu l'hai usato meglio di loro.»
          imposta: { mischia: 1 }
          effetti: { oggetto.fermaglio-di-orvald: 1, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: La linea verde
          testo: |
            Un gomito di Borso ti arriva nelle costole e fai un passo indietro di
            troppo. Il recinto ti butta fuori con la camicia che fuma, e
            l'inserviente che te la stacca dalla pelle si scusa a ogni lembo.
            Vince Galdrick, ma la tribuna chiama il tuo nome, e Orvald ti manda
            alla prova a squadre perché con la folla non litiga.
          imposta: { mischia: 2 }
          effetti: { ferite: 2, pista.arena: 1 }
      - testo: "Prenderti la folla"
        descrizione: "Dodici combattenti e cinquemila spettatori. Chi ha la tribuna dalla sua ha già mezzo recinto."
        prova: { attributo: sociale, abilita: [espressivita, intimidire], difficolta: Difficile }
        successo:
          titolo: Il nome che gridano
          testo: |
            Alzi l'arma verso la tribuna della Città Bassa, che ti risponde con un
            boato. Quando il mercenario si volta verso di te, la folla scandisce
            il tuo nome finché lui esce dal recinto da solo, rosso in faccia.
            Durgan ti costa una spalla e un labbro spaccato, e Orvald ti porge un
            fermaglio d'argento intrecciato. «Questo non è roba da bancarella»
            dice.
          imposta: { mischia: 1 }
          effetti: { oggetto.fermaglio-di-orvald: 1, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Il pubblico sbagliato
          testo: |
            Alzi l'arma verso la tribuna, e dalla tribuna ti arriva un torsolo di
            mela. Mentre lo schivi Durgan ti prende alle gambe con il manico
            dell'ascia, e finisci sulla linea verde con tutta la schiena. Vince
            Galdrick, ma dalla tribuna, forse per il torsolo, cominciano a
            chiamare il tuo nome, e Orvald dice che la folla ti vuole nella prova
            a squadre e che lui con la folla non litiga.
          imposta: { mischia: 2 }
          effetti: { ferite: 2, pista.arena: 1 }
      - testo: "Piegare il recinto"
        descrizione: "Il verde della linea è Mana, e Orvald non ha vietato la magia."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il recinto si stringe
          testo: |
            Il Mana del recinto ti ronza nei denti, e quando Galdrick arriva al
            bordo tiri la linea verde verso di lui. Il mercenario ci finisce sopra
            senza capire come, e Durgan ti costa un taglio sul fianco prima di
            finire sul verde. Orvald ti porge un fermaglio d'argento intrecciato.
            «Questo non è roba da bancarella» dice, «ma il recinto è roba mia.»
          imposta: { mischia: 1 }
          effetti: { oggetto.fermaglio-di-orvald: 1, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Il ritorno del Mana
          testo: |
            Il Mana del recinto ti torna indietro tutto insieme, e quando ci vedi
            di nuovo sei fuori dalla linea, seduto, con il sapore del rame in
            bocca e le dita che tremano ciascuna per conto suo. Vince Galdrick, ma
            dalla tribuna chiamano il tuo nome, e Orvald dice che la folla ti
            vuole nella prova a squadre e che lui con la folla non litiga.
          imposta: { mischia: 2 }
          effetti: { tormento: 1.5, ferite: 1, pista.arena: 1 }
      - testo: "Chiamare la tribuna della Città Bassa"
        descrizione: "Sulla gradinata di sinistra c'è mezza Città Bassa, e parecchi ti hanno visto crescere."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, intimidire], difficolta: Difficile }
        successo:
          titolo: La gradinata di sinistra
          testo: |
            Chiami per nome un garzone sulla gradinata della Città Bassa, e dopo
            di lui grida il tuo tutta la gradinata, battendo i piedi con il ritmo
            dei vicoli. Il mercenario, con tutta quella gente contro, esce da
            solo. Durgan ti costa una spalla e un labbro spaccato, e Orvald ti
            porge un fermaglio d'argento intrecciato. «Questo non è roba da
            bancarella» dice.
          imposta: { mischia: 1 }
          effetti: { oggetto.fermaglio-di-orvald: 1, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: I vicini distratti
          testo: |
            Chiami per nome il garzone di fonderia, ma lui sta comprando una
            salsiccia. Il tuo nome lo grida solo una vecchia che ti ha scambiato
            per un altro, e intanto Durgan ti butta sulla linea verde. Vince
            Galdrick, ma alla fine dalla gradinata il tuo nome arriva a bocca
            piena e Orvald ti manda alla prova a squadre perché con la folla non
            litiga.
          imposta: { mischia: 2 }
          effetti: { ferite: 2, pista.arena: 1 }

  # ------------------------------------------------------------ 1 → 2 · la Grande Mischia, dopo Vesh (pista.pelle >= 7)
