      - testo: "Ascoltarla come al Circolo"
        descrizione: "Al Circolo si ascolta una bestia prima di guardarla. Il giorno del Festival hai sentito respirare un cinghiale toccato dalla Marea, e quest'eco fa lo stesso verso."
        quando: [origine.figlio-del-circolo >= 1]
