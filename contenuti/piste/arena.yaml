            la bestia carica dritta su Corin, che tiene la spada alta con gli
            occhi chiusi. All'ultimo Tenebra la devia con la spalla, Besk le
            brucia il muso, e tu sei già sul fianco. L'eco si sfa in schegge
            pallide.

            Le barriere esplodono in scintille bianche. Nel quadrante accanto
            restano in piedi soltanto in due.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli vale una notte di sonno, e
            Corin non smette più di ridere.

            {empatia Media} Ride perché ha tenuto gli occhi chiusi e la spada
            alta, e non è scappato. Se lo ricorderà per tutta la vita, e lo
            racconterà male.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Uno si muove
          testo: |
            Quando la bestia carica Corin fa un passo di lato, uno soltanto.
            Basta perché il cinghiale passi dove non doveva e ti prenda in
            pieno. La finite in tre, con Corin seduto per terra, quando hai già
            il sangue in bocca.

            Le barriere esplodono in scintille bianche. Nel quadrante accanto
