          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Troppo rumore
          testo: |
            Chiudi gli occhi per ascoltarla, e proprio in quel momento sugli
            spalti cinquemila persone decidono di urlare tutte insieme. Il respiro della bestia ti si perde dentro
            quel rumore, e quando li riapri la zanna ti ha già aperto la
            coscia. Tenebra e Besk la reggono mentre Corin ti trascina via per
            il colletto, e la finite in quattro, a fatica.

            Le barriere esplodono in scintille bianche. Nel quadrante accanto
            restano in piedi soltanto in due. La squadra di Galdrick invece è
            intatta, e lo sceriffo ti fa un cenno breve. L'ultimo lampo dei
            cristalli ti chiude la pelle della coscia, ma sotto la zanna è
            arrivata fino all'osso.
          effetti: { ferite: 2, pista.arena: 1 }

  # ------------------------------------------------------------ 3 → 4 · l'ora dei gladiatori
  - id: l-ora-dei-gladiatori
    presso: arena-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: L'ora dei gladiatori
    sommario: "Un'ora prima della finale, nella camera dei combattenti. Le squadre eliminate sono ancora lì, e quella di Galdrick anche."
    luogo: Arena di Qir-Azel, la camera dei combattenti
    area: quartieri-alti
    requisiti: [pista.arena == 3]
    testo: |
      Nella camera dei combattenti l'acqua dei catini è diventata rosa, e un
      inserviente la cambia di continuo senza che nessuno glielo chieda,
      fischiettando la stessa canzone da osteria. Dalle grate arriva il rumore
      della folla che aspetta la finale. Orvald ha fatto sapere che si torna in
      campo fra un'ora, e ha mandato Pett a dirlo, perché lui ha da fare con i
      registri.

      {resistenza Media} Il corpo vorrebbe passare quell'ora a dormire, e
      tu invece gli darai chiacchiere e acqua rosa. Dagli almeno un pezzo di
      pane, prima di tornare sulla sabbia.

      La squadra di Liaren occupa le panche a sinistra. Liaren accorda il
      samisen con un labbro spaccato, ed Ettore Castaldi beve da una
      fiaschetta quando crede che nessuno lo veda. L'altra squadra si è presa
      l'angolo più buio, e lì si parla a voce bassa. Vicino alle
      armerie la squadra di Galdrick si prepara in silenzio.

      Besk ripassa le formule sul quaderno muovendo le labbra. Corin ha tirato
      fuori un pettine, e si pettina con la cura di uno sposo. Tenebra
      si è seduto contro il muro, con la lama sulle ginocchia, e guarda Dragna
      Gro-Malog dall'altra parte della sala.

      {origine mercante-dei-ponti} Il pettine di Corin lo hai già visto
      sulle scale della Casa dei Nodi, in mano a uomini della Gilda che
      stanno per entrare a firmare qualcosa di grosso. Si pettinano così
      quando hanno paura, e nessuno di loro lo ammetterebbe.

      {armi-da-mischia Media} Dragna tiene l'ascia appoggiata al ginocchio
      con il filo verso l'esterno, pronta senza darlo a vedere. Tenebra ha
      la lama girata allo stesso modo, e nessuno dei due si è accorto di
      avere copiato l'altro.
    opzioni:
      - testo: "Andare da Liaren e dai suoi"
        immagine: personaggi/liaren-tarvelin
        descrizione: "Sono usciti fra gli applausi e i fischi, e Liaren non ha ancora deciso quale dei due tenersi."
        quando: [pista.pelle < 4]
        costo: 0
        esito:
          titolo: Un omaggio
          testo: |
            Liaren ti fa posto sulla panca. «Un omaggio alla squadra di Liaren»
            dice, imitando Orazio con la voce un'ottava sopra. «Quell'uomo mi ha
            fatto il funerale davanti a tutta la città, e non vedeva l'ora.»
            Dolovan Stroud si sta fasciando una mano e dice che non combatteva
            da anni e che adesso si ricorda perché.

            Ettore Castaldi ti offre la fiaschetta e poi la ritira, perché si
            ricorda che devi combattere. Borso si sveglia di colpo sulla panca e
            ti dice che la prossima volta i crani da fracassare li sceglie lui.

            {empatia Media} Quest'anno Liaren ha già perso un padre, e le
            battute sui funerali le vengono un po' troppo bene.
      - testo: "Andare dagli Scuri"
        immagine: personaggi/mauro-scrocco
        descrizione: "Sono usciti in barella, quasi tutti. Mauro però è ancora in piedi, almeno lui."
        quando: [pista.pelle < 4]
        costo: 0
        esito:
          titolo: Il conto
          testo: |
            Durgan si fa ricucire il sopracciglio da Rozalia, che ci mette un
            impegno cattivo e tira ogni punto un po' più del necessario. Nihali tossisce piegato in due e sputa nero sulla
            sabbia dei catini. Mauro non si alza. È seduto su due sgabelli e ti
            guarda come si guarda un debito, contando. *Quello i conti li tiene
            a memoria.* Poi apre le braccia come per abbracciarti, restando
            seduto.

            «Bella leggenda, la tua» dice, con l'alito che arriva prima della
            voce. «La nostra era più grossa. Alla Pignatta si parla di tutto e
            si dice niente, lo sai. Però di te, da stasera, se ne parlerà.» Lo
            dice sorridendo, e intanto stringe il manico dell'ascia finché le
            nocche gli diventano bianche.

            {intimidire Facile} Sorride con la bocca e stringe con le mani.
            Delle due cose, quella vera è la seconda.
      - testo: "Andare da Galdrick e dai suoi"
        immagine: personaggi/toren-galdrick
        descrizione: "Lo sceriffo ha vinto la Mischia, e ti fa segno di avvicinarti."
