          testo: |
            Chiudi gli occhi in mezzo al frastuono,
            come ti hanno insegnato al Circolo quando eri ancora troppo piccolo
            per capire perché, e lo senti. Ha il respiro spezzato del cinghiale della porta nord,
            quello che l'orco spronava sulle vene, e scuote la testa a destra
            ogni volta che il metallo gli brucia. Gridi a Tenebra di stare a
            sinistra e fai battere a Corin la spada sulla placca. Il cinghiale
            scarta dalla parte del dolore e ti offre il fianco, e al terzo
            scarto Tenebra lo apre. La bestia si sfa in schegge pallide.

            Le barriere esplodono in scintille bianche. Nel quadrante accanto
