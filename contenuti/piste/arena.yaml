          effetti: { ferite: 2, pista.arena: 1 }
      - testo: "Farti coprire le spalle dalla squadra"
        descrizione: "Tre persone che conosci appena. Se si fidano di te abbastanza da restare ferme quando carica, basta uno solo a colpire."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
