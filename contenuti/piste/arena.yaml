    luogo: Arena di Qir-Azel, i quadranti
    area: quartieri-alti
    requisiti: [pista.arena == 2]
    testo: |
      Il quarto della squadra si è presentato ieri sera al banco di Orvald.
      Tenebra ha firmato il modulo senza leggerlo e, quando Corin gli ha chiesto
      perché un capo dei Raschiatori si mettesse a fare il gladiatore, ha
      risposto senza alzare gli occhi. «Voglio vedere Ferro perdere. Una volta.»
      Corin ha annuito con grande serietà, come se gli avessero spiegato
      tutto.

      {origine apprendista-raschiatore} Ti è toccato in squadra un capo dei
      Raschiatori. Sulle piattaforme uno come lui non ti avrebbe rivolto la
      parola, e qui invece aspetta i tuoi ordini, come si aspetta l'ultimo
      che sale dalla scala.

      {empatia Media} Tenebra ha detto *una volta* con lo stesso tono con
      cui altri dicono una preghiera. Fra lui e Ferro c'è un conto vecchio,
      e lui non ha nessuna voglia di raccontarlo.

      Le quattro squadre avanzano in fila verso la sabbia. Dietro la tua vengono
      le altre due, e per ultima la squadra di Galdrick. A
      metà strada il terreno si apre, e dal suolo salgono placche di metallo e
      pietra che dividono l'Arena in quadranti. Al centro del tuo emerge un
      cristallo conduttore alto due volte un uomo. Besk ci avvicina la mano
      senza toccarlo e la ritira subito, poi si sistema gli occhiali. «Questa
      carica l'ho vista una volta sola, sull'altare della Cattedrale» dice
      piano. «Questi cristalli li ha caricati la Madre del Velo in persona.
      Quello che ne esce sarà un'eco.»

      {magia Difficile} La carica sale dal cristallo come il caldo da una
      stufa, a ondate regolari. Chi l'ha caricato aveva tutta la
      pazienza del mondo, e ne ha lasciata un po' lì dentro.

      {origine accolito-del-velo} Al nome della Madre la schiena ti si
      raddrizza da sola, come in Cattedrale quando passa lei. Una carica
      benedetta per far nascere bestie da ammazzare davanti a chi scommette,
      e in sagrestia, ne sei sicuro, qualcuno ha storto la bocca.

      «SECONDA FASE!» La voce di Orazio scende dalle grate. «CONTRO DI VOI, LE
      BESTIE DELL'ARENA!»

      Il cristallo si riempie di luce azzurra e scarica fulmini sulla sabbia, e
      dove cadono prendono forma i vermi carogna della Foresta Strisciante. Sono
      pallidi come cera e un po' trasparenti ai bordi. Corin stringe la spada
      con tutte e due le mani, la punta che disegna piccoli cerchi nell'aria.
      Tenebra ti guarda e aspetta che sia tu a dire come si fa.

      {natura Media} Anche da echi, i vermi carogna attaccano in basso, verso
      le caviglie. Oggi servono gli stivali alti, e quelli di Corin sono di
      vitello buono e lucido.
    opzioni:
      - testo: "Stare davanti con Tenebra"
        immagine: personaggi/tenebra
        descrizione: "Tu e lui in prima fila, Besk dietro a lanciare e Corin dietro a Besk. È il modo più semplice, e anche il più faticoso."
        prova: { attributo: fisico, abilita: [armi-da-mischia, rissa], difficolta: Media }
        successo:
          titolo: Spalla a spalla
          testo: |
            Tenebra si mette alla tua sinistra senza che glielo chiedi, e per
            due giri nessuna bestia passa fra voi. I vermi carogna si sfasciano
            in schegge di luce. Il cristallo vi bagna di un calore che chiude i
            tagli, poi Orazio annuncia le peggiori tra le belve, e dal cristallo
            escono due Camminatori della Salvaguardia, le macchine dei
            Precursori, con le giunture che stridono come quelle vere.

            Tenebra ne ferma uno con la lama di traverso. Tu e Besk fate cadere
            l'altro, e Corin gli siede sopra finché non smette di muoversi,
            scusandosi con la macchina a ogni sobbalzo. Nel silenzio che segue
            Tenebra si pulisce la lama sulla manica e ti fa un cenno solo.

            {rissa Facile} Lui a sinistra e tu a destra, senza dirlo. I corpi
            che si capiscono così in fretta li trovi di solito nelle risse da
            osteria, e quasi mai dalla stessa parte.
          segue: una-leggenda
        fallimento:
          titolo: La prima fila
          testo: |
            Tieni la prima fila, ma i vermi carogna sono troppi e uno ti si
            avvolge al polpaccio prima che Tenebra lo tagli. Il cristallo vi
            chiude le ferite, e poi arrivano i Camminatori della Salvaguardia,
            le macchine dei Precursori. Uno ti schiaccia contro la placca di
            pietra con il suo braccio piatto.

            Ne venite fuori, ma ti resta addosso il suo stampo, preciso, con
            tutti i rivetti. Corin ti aiuta a rialzarti e ti chiede se essere un
            eroe fa sempre così male. Tenebra risponde di sì al posto tuo.
          effetti: { ferite: 1 }
          segue: una-leggenda
      - testo: "Leggere il cristallo con Besk"
        immagine: personaggi/besk-dravec
        descrizione: "Prima di ogni bestia il cristallo si accende da una parte. Se sai da quale, ci arrivi prima tu."
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: Il lato che si accende
          testo: |
            Besk ti sussurra quello che sente nel cristallo, e tu lo guardi
            finché capisci che prima di ogni lampo la luce si addensa da un
            lato. Da lì in avanti ogni verme carogna nasce con te già sopra. Il
            cristallo vi cura, e quando escono i Camminatori della Salvaguardia
            sapete da che parte arriveranno, e Tenebra li aspetta lì con la
            lama.

            Besk scrive qualcosa su un quaderno che tiene nella manica. Corin
            vuole sapere che cosa, e lei gli risponde che è un appunto per
            Orvald e che non lo riguarda.

            {percezione Media} La luce si addensa sul lato giusto il tempo di
            due battiti prima del lampo. Due battiti bastano per arrivarci prima
            della bestia.
          segue: una-leggenda
        fallimento:
          titolo: Il lato sbagliato
          testo: |
            Guardi il cristallo così fisso che non vedi il verme carogna alle
            tue spalle, e Besk lo brucia quando ti ha già morso il braccio. Il
            cristallo vi cura, e i Camminatori della Salvaguardia escono dal
            lato che non guardavi. Tenebra ne prende uno da solo, e tu ti fai
            schiacciare un piede dall'altro prima di buttarlo giù.

            Besk si scusa due volte a voce rapida, e Corin si scusa con lei
            perché si sta scusando, e per un momento la squadra intera rischia
            di scusarsi a turno fino a sera. Tenebra intanto si pulisce la lama sulla
            manica e aspetta il giro dopo.
          effetti: { ferite: 1 }
          segue: una-leggenda
      - testo: "Tenerli insieme a voce"
        immagine: personaggi/corin-ashdale
        descrizione: "Corin ha paura e Besk pensa troppo, mentre Tenebra fa da solo. Una squadra si tiene con gli ordini giusti al momento giusto."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Gli ordini
          testo: |
            Dai ordini corti a voce alta, e dopo il primo verme carogna anche
            Tenebra li segue. Corin smette di tremare quando gli dai un compito
            solo, coprire Besk, che lui esegue con un impegno commovente. Il
            cristallo vi cura, e quando escono i Camminatori della Salvaguardia
            la squadra si apre e si chiude intorno a loro al tuo grido.

            Dalla tribuna qualcuno ripete i tuoi ordini per gioco, e alla fine
            li ripete mezzo settore.

            {persuasione Media} Un compito solo, e con il suo nome davanti. A
            Corin bastava questo, che qualcuno lo chiamasse per nome nel
            momento giusto.
          segue: una-leggenda
        fallimento:
          titolo: Troppe voci
          testo: |
            Nel frastuono Corin non ti sente. Besk ti sente benissimo e discute
            ogni ordine, mentre Tenebra fa come gli pare. I vermi carogna vi
            passano fra le gambe. Il cristallo vi cura, poi i Camminatori della
            Salvaguardia vi dividono in due, e tu prendi i colpi destinati a
            Corin.

            Alla fine ne uscite in piedi tutti e quattro, ma tu hai la voce
            andata e una costola che scricchiola.

            {intimidire Media fallita} Hai gridato come un sergente, e loro ti
            hanno sentito come si sente un sergente, cioè per niente. Con
            questi tre bisognava abbassare la voce.
          effetti: { ferite: 1 }
          segue: una-leggenda
      - testo: "Lasciare il comando a Tenebra"
        immagine: personaggi/tenebra
        descrizione: "Ha portato giù nelle rovine più squadre di quante ne abbia l'Arena. Basta fare quello che dice."
        esito:
          titolo: Come nei tunnel
          testo: |
            Tenebra comanda come nei tunnel, quasi senza parlare. Tutti e tre
            gli obbedite. Funziona, ma lui vi tratta come Raschiatori, e ai
            Raschiatori tocca il lavoro peggiore. I vermi carogna li tieni
            lontani tu a pedate per un tratto, e il primo Camminatore della
            Salvaguardia lo fermi con la spalla.

            Quando il cristallo vi cura l'ultima volta, Tenebra ti batte una
            mano sulla schiena, come si fa con le reclute, proprio dove il
            Camminatore ti ha lasciato il livido.

            {resistenza Media} Hai preso i colpi per tutti e tre, e il corpo
            li ha contati uno per uno. Il cristallo li ha chiusi, e il conto
            resta aperto lo stesso.
          effetti: { ferite: 1.5 }
          segue: una-leggenda
      - testo: "Fare squadra con Tenebra come in un turno"
        immagine: personaggi/tenebra
        descrizione: "Sulle piattaforme hai imparato i gesti dei capisquadra senza che nessuno te li spiegasse. Tenebra li usa ancora, e tu li capisci."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: I gesti della scala
          testo: |
            Tenebra alza due dita e le piega verso il basso, il segno che sulle
            piattaforme vuol dire *tu sotto, io sopra*, e tu ti metti alla sua
            destra prima che abbia finito il gesto. Lui ti guarda un momento di
            sbieco e non fa domande. Da lì in avanti non vi parlate più. I vermi
            carogna si sfasciano fra voi due in schegge di luce, Besk lancia da
            dietro e Corin la copre, e quando escono i Camminatori della
            Salvaguardia Tenebra ti indica quello di sinistra con il mento.

            Lo fate cadere insieme, come si tira giù una lamiera che non vuole
            staccarsi. Nel silenzio che segue Tenebra si pulisce la lama sulla
            manica. «Con chi hai fatto i turni?» chiede, e la risposta non la
            aspetta.

            {percezione Facile} Ha usato apposta i segni vecchi, quelli che i
            capisquadra giovani non usano più, per vedere se li conoscevi anche
            tu.
          segue: una-leggenda
      - testo: "Riconoscere la mano della Madre"
        immagine: personaggi/besk-dravec
        descrizione: "In Cattedrale hai imparato come si muove una benedizione della Madre e dove comincia a stancarsi. Il cristallo ne è pieno."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il ritmo della preghiera
          testo: |
            Ti avvicini al cristallo con Besk e ascolti la carica come in
            Cattedrale si ascolta una preghiera lunga, aspettando i punti dove
            chi la dice si ferma. La Madre li ha lasciati anche qui, e
            prima di ogni lampo la luce si addensa da un lato, sempre dopo la
            stessa pausa. Lo dici a Besk sottovoce, e da lì in avanti ogni verme
            carogna nasce con te già sopra.

            Il cristallo vi cura, e quando escono i Camminatori della
            Salvaguardia sapete da che parte arriveranno, e Tenebra li aspetta lì
            con la lama. Besk scrive qualcosa nel quaderno e poi ti guarda.
            «Questo all'Accademia non lo insegnano» dice, e lo dice come se
            fosse un torto personale.

            {magia Media} Una carica fatta con la pazienza segue il respiro di
            chi l'ha fatta. Dopo la terza pausa non hai più bisogno di contare.
          segue: una-leggenda

  # ------------------------------------------------------------ il terzo giro · una leggenda
  # L'eco non dice se la bestia da cui viene sia viva o morta: con pista.corin < 3 il cinghiale della Foresta è
  # ancora vivo. Solo con pista.corin >= 4 (dopo il banchetto) le opzioni lo riconoscono come quello ucciso.
  - id: una-leggenda
    immagine: bestiario/cinghiale-mutato-gigante
    titolo: Una leggenda
    tipo: seguito
    luogo: Arena di Qir-Azel, il quadrante
    area: quartieri-alti
    requisiti: [pista.arena == 2]
    testo: |
      Le luci dell'Arena si abbassano, e la folla smette di urlare e comincia a
      mormorare. «Un omaggio alla squadra di Liaren» dice Orazio, «la cui
      avventura termina qui.» Dagli spalti arrivano applausi e fischi insieme, e
      oltre la placca di metallo senti Ettore Castaldi che bestemmia con una
      fantasia che la cugina Julia non approverebbe.

      {origine rampollo-dei-quartieri-alti} Nei salotti Ettore Castaldi è
      quello che Julia fa sedere in fondo alla tavola, lontano dagli ospiti
      di fuori. Le bestemmie però sono nuove, e le metti da parte per
      quando ti servirà una conversazione.

      «E ora l'ultima prova.» La luce del cristallo vira al rossastro, e il
      cristallo comincia a vibrare con un suono storto che ti fa male ai denti.
      «NON UN MOSTRO» grida Orazio. Sugli spalti cala il silenzio. «NON UN UOMO.
      UNA LEGGENDA.»

      Dalla luce esce un cinghiale grande come un carro, con le setole
      grigio-azzurre sempre bagnate e lente vene d'argento che gli pulsano sotto
      la pelle. Dove posa gli zoccoli lascia sulla sabbia impronte larghe una
      spanna, e ai bordi la sua sagoma è un poco sfocata. *Un'eco non dovrebbe
      avere odore, e questa puzza di fango e di ferro.* Sugli spalti qualcuno
      urla di paura, e stavolta fa sul serio.

      {origine figlio-del-circolo} Fango e ferro caldo, lo stesso odore della
      volpe che da bambino hai visto abbattere nel Bosco di Velthar. Il
      cinghiale della porta nord scuoteva la testa per il bruciore delle vene,
      e quest'eco, a guardarla bene, la scuote nello stesso modo.

      {natura Media} Una bestia di quella stazza pesa come un carro carico,
      e sterza altrettanto male. Quando parte va dritta finché non trova
      un muro.

      {resilienza Media fallita} Le gambe ti dicono di fare un passo
      indietro, come Besk. Il resto di te è d'accordo con le gambe.

      Besk fa un passo indietro e poi lo rifà avanti, con le labbra che si
      muovono su un conto che solo lei sente. Il cristallo alle sue spalle ha
      una crepa luminosa che prima non c'era. Corin si è fatto bianco,
      e Tenebra, per la prima volta da quando lo conosci, parla prima di te.
      «Dimmi tu.»
    opzioni:
      - testo: "Guardarlo bene"
        descrizione: "Quelle setole le hai già viste, in una radura piena di carcasse."
        immagine: personaggi/corin-ashdale
        requisiti: [pista.corin >= 4]
        costo: 0
        esito:
          titolo: Il nostro cinghiale
          testo: |
            È il cinghiale della Foresta Strisciante, quello del banchetto al
            Grifone. Lo riconosci dalla spalla dove l'hai colpito, che nell'eco
            ha ancora la ferita, e dal modo in cui gira la testa verso destra
            prima di caricare.

            Corin lo ha riconosciuto anche lui. «Ma questo l'abbiamo mangiato»
            dice con un filo di voce, e poi, più piano, «con il vino rosso e le
            erbe.» Tenebra lo guarda di sbieco e non fa domande.

            {accademiche Media} Un'eco conserva la bestia come l'ultima volta
            che qualcuno l'ha vista. Ferita compresa, e anche le abitudini.
          segue: una-leggenda
      - testo: "Affrontarlo"
        immagine: bestiario/cinghiale-mutato-gigante
        descrizione: "A giudicare dalle impronte, le zanne di quest'eco sono vere. La squadra ti copre come può."
        combattimento: una-leggenda
        vittoria:
          titolo: Schegge di luce
          testo: |
            La bestia carica e tu la aspetti, con Tenebra a un passo e Besk che
            le brucia gli occhi. La colpisci dietro la spalla dove il pelo è più
            rado, finché la bestia crolla e si sfa in una pioggia di schegge
            pallide che ti restano fra i capelli e si spengono piano. Le
            barriere fra i quadranti esplodono in scintille bianche.

            Nel quadrante accanto restano in piedi soltanto in due, e uno di
            loro ti fissa senza dire niente. La squadra di Galdrick invece è
            intatta, e lo sceriffo ti fa un cenno breve. Poi i cristalli mandano
            un ultimo lampo che ti entra nella pelle, e ti senti come dopo una
            notte di sonno.

            {intimidire Media} Il cenno di Galdrick è breve perché lo misura.
            Fino a stamattina eri uno dei tanti, e da adesso sei uno da tenere
            d'occhio.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1, racconto: 1 }
        sconfitta:
          titolo: La squadra regge
          testo: |
            La bestia ti travolge alla prima carica, e da terra vedi Corin
            mettersi in mezzo con la spada e un coraggio che nessuno gli
            aveva chiesto, e volare contro la placca. Tenebra e
            Besk la reggono finché tu ti rialzi, e la finite insieme, in
            quattro, quando il cristallo ha già quasi smesso di brillare.

            Le barriere esplodono in scintille bianche. Nel quadrante accanto
            restano in piedi soltanto in due.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli ti rimette in piedi, ma a
            Corin non chiude del tutto il taglio sulla fronte, e lui se lo
            tampona col fazzoletto ricamato, controllando ogni volta che il
            ricamo non si sia macchiato troppo.

            {empatia Facile} Si è messo in mezzo per te. Lo sa anche lui, e
            adesso non sa dove guardare.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1 }
      - testo: "Sovraccaricare il cristallo con Besk"
        immagine: personaggi/besk-dravec
        descrizione: "La crepa nel cristallo si allarga a ogni carica. Se Besk ci spinge dentro abbastanza Mana, l'eco perde il filo che la tiene in piedi."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: La crepa
          testo: |
            Metti le mani sul cristallo accanto a quelle di Besk e spingete
            insieme, e il vetro sotto i palmi è caldo come una fronte con la
            febbre. Tenebra e Corin intanto tengono la bestia lontana. La crepa
            corre dalla base alla punta, e il cinghiale si ferma a metà carica e
            si sfa in schegge pallide. Le barriere fra i quadranti esplodono in
            scintille bianche.

            Nel quadrante accanto restano in piedi soltanto in due, appoggiati
            alle armi.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli vale una notte di sonno, e
            Besk lo prende a occhi chiusi, sorridendo al cristallo come a un
            compito venuto bene.

            {tecnologia Media} La crepa è corsa lungo la venatura, dalla base
            alla punta, come si spacca la legna buona. Un cristallo che si
            rompe così almeno non tira schegge addosso a nessuno.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Il cristallo risponde
          testo: |
            Il cristallo ti restituisce il Mana tutto insieme e ti scaraventa
            sulla sabbia, e Besk cade accanto a te. La bestia la tengono Tenebra
            e Corin finché vi rialzate, e Corin ci rimette una spalla. Alla fine
            la crepa si allarga lo stesso e l'eco si sfa.

            Le barriere esplodono in scintille bianche. Nel quadrante accanto
            restano in piedi soltanto in due.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli ti rimette in piedi, ma
            le mani che hai tenuto sul cristallo restano rosse e gonfie, e il
            ronzio nelle orecchie non se ne va. Ti accompagnerà a cena, e forse
            anche a letto.
          effetti: { ferite: 1.5, tormento: 1, pista.arena: 1 }
      - testo: "Leggere la bestia"
        descrizione: "Questa bestia l'hai già vista caricare, nella radura della Foresta Strisciante. Gira la testa a destra prima di partire, e un'eco ripete quello che faceva da viva."
        requisiti: [pista.corin >= 4]
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Media }
        successo:
          titolo: La testa a destra
          testo: |
            Aspetti che giri la testa a destra come faceva nella radura, con
            lo stesso scatto nervoso del collo, e gridi a Tenebra il lato giusto prima ancora che parta. Fai battere a
            Corin la spada sulla placca, e a ogni colpo il cinghiale scarta
            dalla parte che ti aspettavi e ti offre il fianco. Al terzo scarto
            Tenebra lo apre, e la bestia si sfa in schegge pallide.

            Le barriere esplodono in scintille bianche. Nel quadrante accanto
            restano in piedi soltanto in due.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli vale una notte di sonno.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Il fianco sbagliato
          testo: |
            La bestia gira la testa a destra come ricordavi, e poi scarta a
            sinistra, perché l'eco ha imparato qualcosa che il cinghiale vero
            non sapeva. La zanna ti apre la coscia.

            {natura Media fallita} Ti eri fidato di un ricordo. Le bestie vive
            ripetono, e quelle fatte di luce, a quanto pare, improvvisano. Tenebra e Besk la reggono
            mentre Corin ti trascina via per il colletto, e la finite in
            quattro, a fatica.

            Le barriere esplodono in scintille bianche. Nel quadrante accanto
            restano in piedi soltanto in due.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli ti chiude la pelle della
            coscia, ma sotto la zanna è arrivata fino all'osso, e quando provi a
            camminare la gamba non ne vuole sapere.
          effetti: { ferite: 2, pista.arena: 1 }
      - testo: "Leggere la bestia"
        descrizione: "Un'eco ripete i gesti della bestia da cui viene. Se capisci come caccia, sai dove sarà."
        requisiti: [pista.corin < 4]
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Difficile }
        successo:
          titolo: La maschera della Marea
          testo: |
            Guardi come muove la testa e capisci che le vene d'argento sono una
            maschera della Marea, cucita sopra una bestia nata con la paura
            del rumore, come i cinghiali di campagna che scappano al
            primo coperchio sbattuto. Fai battere a Corin la
            spada sulla placca, e a ogni
            colpo il cinghiale scarta a destra e ti offre il fianco. Al terzo
            scarto Tenebra lo apre, e la bestia si sfa in schegge pallide.

            Le barriere esplodono in scintille bianche. Nel quadrante accanto
            restano in piedi soltanto in due.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli vale una notte di sonno.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Il fianco sbagliato
          testo: |
            Ti metti dove dovrebbe scartare, sicuro come un indovino di fiera,
            e la bestia scarta dall'altra parte. La zanna ti apre la coscia. Tenebra e Besk la reggono mentre
            Corin ti trascina via per il colletto, e la finite in quattro, a
            fatica.

            Le barriere esplodono in scintille bianche. Nel quadrante accanto
            restano in piedi soltanto in due.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli ti chiude la pelle della
            coscia, ma sotto la zanna è arrivata fino all'osso, e quando provi a
