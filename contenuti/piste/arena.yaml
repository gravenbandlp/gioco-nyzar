            pensato, e alla città serve proprio questo.»

            {politica-ed-economia Media} Uno sceriffo che parla a nome del
            Consiglio sa bene che cosa serve alla città, e anche a chi conviene
            che serva. Un nome nuovo gridato dalla Città Bassa fa comodo a
            parecchia gente.

            Ilvaena Sorathe controlla le frecce una per una. Dragna ti guarda
