          testo: |
            Un gomito di Bram ti arriva nelle costole e fai un passo indietro di
            troppo. Il recinto ti butta fuori con la camicia che fuma, e
            l'inserviente che te la stacca dalla pelle si scusa a ogni lembo.
            Vince Galdrick, ma la tribuna chiama il tuo nome, e Orvald ti manda
            alla prova a squadre perché con la folla non litiga.
          imposta: { mischia: 2 }
          effetti: { ferite: 2, pista.arena: 1 }
      - testo: "Prenderti la folla"
        descrizione: "Dodici combattenti e cinquemila spettatori. Chi ha la tribuna dalla sua ha già mezzo recinto."
        prova: { attributo: sociale, abilita: [espressivita, intimidire], difficolta: Difficile }
        successo:
          titolo: Il nome che gridano
          testo: |
            Alzi l'arma verso la tribuna della Città Bassa, che ti risponde con un
            boato. Quando il mercenario si volta verso di te, la folla scandisce
            il tuo nome finché lui esce dal recinto da solo, rosso in faccia.
            Durgan ti costa una spalla e un labbro spaccato, e Orvald ti porge un
            fermaglio d'argento intrecciato. «Questo non è roba da bancarella»
            dice.
          imposta: { mischia: 1 }
          effetti: { oggetto.fermaglio-di-orvald: 1, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Il pubblico sbagliato
          testo: |
            Alzi l'arma verso la tribuna, e dalla tribuna ti arriva un torsolo di
            mela. Mentre lo schivi Durgan ti prende alle gambe con il manico
            dell'ascia, e finisci sulla linea verde con tutta la schiena. Vince
            Galdrick, ma dalla tribuna, forse per il torsolo, cominciano a
            chiamare il tuo nome, e Orvald dice che la folla ti vuole nella prova
            a squadre e che lui con la folla non litiga.
          imposta: { mischia: 2 }
          effetti: { ferite: 2, pista.arena: 1 }
      - testo: "Piegare il recinto"
        descrizione: "Il verde della linea è Mana, e Orvald non ha vietato la magia."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il recinto si stringe
          testo: |
            Il Mana del recinto ti ronza nei denti, e quando Galdrick arriva al bordo
            tiri la linea verde verso di lui. Il mercenario ci finisce sopra senza capire
            come, e Durgan ti costa un taglio sul fianco prima di finire sul verde.
            Orvald ti porge un fermaglio d'argento intrecciato. «Questo non è roba da
            bancarella» dice, «ma il recinto è roba mia.»
          imposta: { mischia: 1 }
          effetti: { oggetto.fermaglio-di-orvald: 1, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Il ritorno del Mana
          testo: |
            Il Mana del recinto ti torna indietro tutto insieme, e quando ci vedi
            di nuovo sei fuori dalla linea, seduto, con il sapore del rame in
            bocca e le dita che tremano ciascuna per conto suo. Vince Galdrick, ma
            dalla tribuna chiamano il tuo nome, e Orvald dice che la folla ti
            vuole nella prova a squadre e che lui con la folla non litiga.
          imposta: { mischia: 2 }
          effetti: { tormento: 1.5, ferite: 1, pista.arena: 1 }
      - testo: "Chiamare la tribuna della Città Bassa"
        descrizione: "Sulla gradinata di sinistra c'è mezza Città Bassa, e parecchi ti hanno visto crescere."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, intimidire], difficolta: Difficile }
        successo:
          titolo: La gradinata di sinistra
          testo: |
            Chiami per nome un garzone sulla gradinata della Città Bassa, e dopo
            di lui grida il tuo tutta la gradinata, battendo i piedi con il ritmo
            dei vicoli. Il mercenario, con tutta quella gente contro, esce da
            solo. Durgan ti costa una spalla e un labbro spaccato, e Orvald ti
            porge un fermaglio d'argento intrecciato. «Questo non è roba da
            bancarella» dice.
          imposta: { mischia: 1 }
          effetti: { oggetto.fermaglio-di-orvald: 1, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: I vicini distratti
          testo: |
            Chiami per nome il garzone di fonderia, ma lui sta comprando una
            salsiccia. Il tuo nome lo grida solo una vecchia che ti ha scambiato
            per un altro, e intanto Durgan ti butta sulla linea verde. Vince
            Galdrick, ma alla fine dalla gradinata il tuo nome arriva a bocca
            piena e Orvald ti manda alla prova a squadre perché con la folla non
            litiga.
          imposta: { mischia: 2 }
          effetti: { ferite: 2, pista.arena: 1 }

  # ------------------------------------------------------------ 2 → 3 · la prova a squadre
  - id: la-prova-a-squadre
    presso: arena-di-qir-azel
    immagine: ambientazione/cristalli-conduttori
    titolo: La prova a squadre
    sommario: "L'Arena si divide in quadranti, e al centro di ognuno c'è un cristallo da cui escono le bestie."
    luogo: Arena di Qir-Azel, i quadranti
    area: quartieri-alti
    requisiti: [pista.arena == 2]
    testo: |
      Il quarto della squadra, Tenebra, ha firmato ieri sera il modulo senza
      leggerlo, e a Corin che gli chiedeva perché un capo dei Raschiatori
      facesse il gladiatore ha risposto senza alzare gli occhi. «Voglio vedere
      Ferro perdere. Una volta.»

      {origine apprendista-raschiatore} Sulle piattaforme un capo dei
      Raschiatori non ti avrebbe rivolto la parola, e qui aspetta i tuoi ordini.

      Placche di metallo e pietra salgono dal suolo e dividono l'Arena in
      quadranti, e al centro del tuo emerge un cristallo conduttore alto due
      uomini. «Li ha caricati la Madre del Velo» dice Besk. «Quello che ne esce
      sarà un'eco.»

      {origine accolito-del-velo} Al nome della Madre la schiena ti si raddrizza
      da sola.

      «SECONDA FASE!» grida Orazio, e dove cadono i fulmini del cristallo
      prendono forma i vermi carogna della Foresta Strisciante, pallidi come
      cera. Tenebra aspetta che sia tu a dire come si fa.
    opzioni:
      - testo: "Stare davanti con Tenebra"
        immagine: personaggi/tenebra
        descrizione: "Tu e Tenebra davanti, con gli altri due alle spalle. È il modo più semplice, e anche il più faticoso."
        prova: { attributo: fisico, abilita: [armi-da-mischia, rissa], difficolta: Media }
        successo:
          titolo: Spalla a spalla
          testo: |
            Tenebra si mette alla tua sinistra senza che glielo chiedi, e nessun
            verme carogna passa fra voi. Il cristallo vi chiude i tagli, poi ne
            escono due Camminatori della Salvaguardia, le macchine dei Precursori.
            Tenebra ne ferma uno, e l'altro lo fate cadere tu e Besk; Corin gli
            siede sopra finché non smette di muoversi, scusandosi a ogni sobbalzo.
          segue: una-leggenda
        fallimento:
          titolo: La prima fila
          testo: |
            I vermi carogna sono troppi, e uno ti si avvolge al polpaccio prima
            che Tenebra lo tagli. Poi un Camminatore della Salvaguardia ti
            schiaccia contro la placca di pietra e ti lascia addosso il suo
            stampo, con tutti i rivetti. Corin ti chiede se essere un eroe fa
            sempre così male, e Tenebra risponde di sì al posto tuo.
          effetti: { ferite: 1 }
          segue: una-leggenda
      - testo: "Leggere il cristallo con Besk"
        immagine: personaggi/besk-dravec
        descrizione: "Prima di ogni bestia il cristallo si accende da una parte. Se sai da quale, ci arrivi prima tu."
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: Il lato che si accende
          testo: |
            Besk ti sussurra che prima di ogni lampo la luce del cristallo si
            addensa da un lato, e da lì in avanti ogni verme carogna nasce con te
            già sopra, mentre Tenebra aspetta i Camminatori della Salvaguardia con
            la lama dalla parte giusta. Intanto lei scrive qualcosa su un quaderno
            che tiene nella manica, un appunto per Orvald.
          segue: una-leggenda
        fallimento:
          titolo: Il lato sbagliato
          testo: |
            Guardi il cristallo così fisso che non vedi il verme carogna alle tue
            spalle, e Besk lo brucia quando ti ha già morso il braccio. I Camminatori
            della Salvaguardia escono dal lato che non guardavi, e uno ti schiaccia
            un piede prima che tu lo butti giù. Alla fine Besk si scusa due volte a
            voce rapida, e Corin si scusa con lei perché si sta scusando.
          effetti: { ferite: 1 }
          segue: una-leggenda
      - testo: "Tenerli insieme a voce"
        immagine: personaggi/corin-ashdale
        descrizione: "Una squadra con tanta paura e troppe teste si tiene con gli ordini giusti al momento giusto."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Gli ordini
          testo: |
            Dai ordini corti a voce alta, e dopo il primo verme carogna anche
            Tenebra li segue. Corin smette di tremare quando gli dai un compito
            solo, quello di coprire Besk, e lo esegue con un impegno commovente.
            Quando escono i Camminatori della Salvaguardia la squadra si apre e si
            chiude intorno a loro al tuo grido, e dalla tribuna mezzo settore
            ripete i tuoi ordini per gioco.
          segue: una-leggenda
        fallimento:
          titolo: Troppe voci
          testo: |
            Nel frastuono Corin non ti sente e Besk discute ogni ordine, mentre
            Tenebra fa come gli pare. I vermi carogna vi passano fra le gambe, e
            quando i Camminatori della Salvaguardia vi dividono in due prendi i
            colpi destinati a Corin. Ne uscite in piedi tutti e quattro, ma tu hai
            la voce andata e una costola che scricchiola.
          effetti: { ferite: 1 }
          segue: una-leggenda
      - testo: "Lasciare il comando a Tenebra"
        immagine: personaggi/tenebra
        descrizione: "Ha portato giù nelle rovine più squadre di quante ne abbia l'Arena. Basta fare quello che dice."
        esito:
          titolo: Come nei tunnel
          testo: |
            Tenebra comanda quasi senza parlare, come nei tunnel. Funziona, ma vi
            tratta come Raschiatori, e ai Raschiatori tocca il lavoro peggiore. I
            vermi carogna li tieni lontani tu a pedate, e il primo Camminatore
            della Salvaguardia lo fermi con la spalla. Alla fine Tenebra ti batte
            una mano sulla schiena, come si fa con le reclute, proprio sul livido.
          effetti: { ferite: 1.5 }
          segue: una-leggenda
      - testo: "Fare squadra con Tenebra come in un turno"
        immagine: personaggi/tenebra
        descrizione: "Sulle piattaforme hai imparato i gesti dei capisquadra, e Tenebra li usa ancora."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: I gesti della scala
          testo: |
            Tenebra alza due dita, il segno che sulle piattaforme vuol dire *tu
            sotto, io sopra*, e ti metti alla sua destra prima che abbia finito il
            gesto. I vermi carogna si sfasciano fra voi due, e il Camminatore
            della Salvaguardia lo tirate giù insieme come una lamiera che non
            vuole staccarsi. «Con chi hai fatto i turni?» chiede poi, senza
            aspettare la risposta.
          segue: una-leggenda
      - testo: "Riconoscere la mano della Madre"
        immagine: personaggi/besk-dravec
        descrizione: "In Cattedrale hai imparato come si muove una benedizione della Madre, e il cristallo ne è pieno."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il ritmo della preghiera
          testo: |
            Ascolti la carica del cristallo come in Cattedrale si ascolta una
            preghiera lunga, aspettandone le pause. Prima di ogni lampo la luce si
            addensa da un lato; lo dici a Besk, e da lì in avanti ogni verme
            carogna nasce con te già sopra, mentre Tenebra aspetta i Camminatori
            della Salvaguardia dalla parte giusta. «Questo all'Accademia non lo
            insegnano» dice Besk, offesa.
          segue: una-leggenda

  # ------------------------------------------------------------ il terzo giro · una leggenda
  # L'eco non dice se la bestia da cui viene sia viva o morta: con pista.corin < 3 il cinghiale della Foresta è
  # ancora vivo. Solo con pista.corin >= 4 (dopo il banchetto) le opzioni lo riconoscono come quello ucciso.
  - id: una-leggenda
    immagine: bestiario/cinghiale-mutato-gigante
    titolo: Una leggenda
    tipo: seguito
    luogo: Arena di Qir-Azel, il quadrante
    area: quartieri-alti
    requisiti: [pista.arena == 2]
    testo: |
      Le luci dell'Arena si abbassano. «Un omaggio alla squadra di Liaren» dice
      Orazio, «la cui avventura termina qui.» Dagli spalti arrivano applausi e
      fischi insieme, e oltre la placca di metallo Ettore Castaldi bestemmia con
      una fantasia che la cugina Julia non approverebbe.

      «E ora l'ultima prova.» Il cristallo vira al rossastro e vibra con un
      suono storto che ti fa male ai denti. «Né mostro né uomo» grida Orazio.
      «UNA LEGGENDA!»

      Dalla luce esce un cinghiale grande come un carro, con le setole
      grigio-azzurre sempre bagnate e vene d'argento che gli pulsano sotto la
      pelle. *Un'eco non dovrebbe avere odore, e questa puzza di fango e di
      ferro.* Sugli spalti qualcuno urla di paura, e stavolta fa sul serio.

      {origine figlio-del-circolo} Il cinghiale della porta nord scuoteva la
      testa per il bruciore delle vene, e quest'eco la scuote nello stesso modo.

      {natura Media} Una bestia di quella stazza sterza male, e quando parte va
      dritta finché non trova un muro.

      Alle spalle di Besk il cristallo ha una crepa luminosa che prima non
      c'era. Corin si è fatto bianco, e Tenebra, per la prima volta da quando lo
      conosci, parla prima di te. «Dimmi tu.»
    opzioni:
      - testo: "Guardarlo bene"
        descrizione: "Quelle setole le hai già viste, in una radura piena di carcasse."
        immagine: personaggi/corin-ashdale
        requisiti: [pista.corin >= 4]
        costo: 0
        esito:
          titolo: Il nostro cinghiale
          testo: |
            È il cinghiale della Foresta Strisciante, quello del banchetto al
            Grifone. Lo riconosci dalla ferita sulla spalla dove l'hai colpito, e
            dal modo in cui gira la testa verso destra prima di caricare. «Ma
            questo l'abbiamo mangiato» dice Corin con un filo di voce, «con il
            vino rosso e le erbe.»
          segue: una-leggenda
      - testo: "Affrontarlo"
        immagine: bestiario/cinghiale-mutato-gigante
        descrizione: "A giudicare dalle impronte, le zanne di quest'eco sono vere. La squadra ti copre come può."
        combattimento: una-leggenda
        vittoria:
          titolo: Schegge di luce
          testo: |
            La bestia carica e tu la aspetti, con Tenebra a un passo e Besk che le
            brucia gli occhi, e la colpisci dietro la spalla finché crolla e si
            sfa in schegge pallide. Quando le barriere esplodono in scintille
            bianche, la squadra di Galdrick è intatta e lo sceriffo ti fa un cenno
            breve. L'ultimo lampo dei cristalli vale una notte di sonno.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1, racconto: 1 }
        sconfitta:
          titolo: La squadra regge
          testo: |
            La bestia ti travolge alla prima carica, e da terra vedi Corin
            mettersi in mezzo e volare contro la placca. Tenebra e Besk la reggono
            finché ti rialzi, e la finite in quattro. La squadra di Galdrick è
            intatta, e lo sceriffo ti fa un cenno breve. L'ultimo lampo dei
            cristalli vi rimette in piedi, ma a Corin resta un taglio sulla fronte
            che tampona col fazzoletto.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1 }
      - testo: "Sovraccaricare il cristallo con Besk"
        immagine: personaggi/besk-dravec
        descrizione: "La crepa nel cristallo si allarga a ogni carica, e con abbastanza Mana l'eco perde il filo."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: La crepa
          testo: |
            Spingi Mana nel cristallo insieme a Besk. Tenebra e Corin tengono
            lontana la bestia finché la crepa corre fino alla punta e il cinghiale
            si sfa a metà carica. La squadra di Galdrick è intatta, e lo sceriffo
            ti fa un cenno breve. L'ultimo lampo dei cristalli vale una notte di
            sonno, e Besk lo prende a occhi chiusi, sorridendo al cristallo come a
            un compito venuto bene.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Il cristallo risponde
          testo: |
            Il cristallo ti restituisce il Mana tutto insieme e ti scaraventa
            sulla sabbia accanto a Besk, e Corin ci rimette una spalla a tenere la
            bestia con Tenebra finché la crepa si allarga lo stesso e l'eco si
            sfa. La squadra di Galdrick è intatta, e lo sceriffo ti fa un cenno
            breve. L'ultimo lampo dei cristalli ti rimette in piedi, ma le mani
            restano rosse e gonfie.
          effetti: { ferite: 1.5, tormento: 1, pista.arena: 1 }
      - testo: "Leggere la bestia"
        descrizione: "Nella radura della Foresta Strisciante l'hai vista caricare, e un'eco ripete quello che faceva da viva."
        requisiti: [pista.corin >= 4]
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Media }
        successo:
          titolo: La testa a destra
          testo: |
            Aspetti che giri la testa a destra come nella radura e gridi a Tenebra il lato giusto prima che parta.
            Corin batte la spada sulla placca, e a ogni colpo il cinghiale scarta dalla parte che ti aspettavi,
            finché al terzo scarto Tenebra lo apre. La squadra di Galdrick è intatta, e lo sceriffo ti fa un cenno
            breve.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Il fianco sbagliato
          testo: |
            La bestia gira la testa a destra come ricordavi, poi scarta a sinistra e ti apre la
            coscia. Corin ti trascina via per il colletto e la finite in quattro, a fatica. La
            squadra di Galdrick è intatta, e lo sceriffo ti fa un cenno breve. L'ultimo lampo dei
            cristalli ti chiude la pelle, ma sotto la zanna è arrivata fino all'osso.
          effetti: { ferite: 2, pista.arena: 1 }
      - testo: "Leggere la bestia"
        descrizione: "Un'eco ripete i gesti della bestia da cui viene. Se capisci come caccia, sai dove sarà."
        requisiti: [pista.corin < 4]
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Difficile }
        successo:
          titolo: La maschera della Marea
          testo: |
            Capisci che le vene d'argento sono una maschera della Marea, cucita
            sopra una bestia che ha paura del rumore come i cinghiali di campagna.
            Corin batte la spada sulla placca, e a ogni colpo il cinghiale scarta
            a destra e ti offre il fianco, finché al terzo scarto Tenebra lo apre.
            La squadra di Galdrick è intatta, e lo sceriffo ti fa un cenno breve.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Il fianco sbagliato
          testo: |
            Ti metti dove dovrebbe scartare, sicuro come un indovino di fiera, e la bestia scarta dall'altra
            parte e ti apre la coscia con la zanna. Tenebra e Besk la reggono mentre Corin ti trascina via
            per il colletto, e la finite in quattro, a fatica. L'ultimo lampo dei cristalli ti chiude la
            pelle, ma sotto la zanna è arrivata fino all'osso.
          effetti: { ferite: 2, pista.arena: 1 }
      - testo: "Farti coprire le spalle dalla squadra"
        descrizione: "Tre persone che conosci appena. Se restano ferme quando carica, basta uno solo a colpire."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: Fermi
          testo: |
            Dici a ognuno dove stare e perché, e restano fermi anche quando la
            bestia carica dritta su Corin, che tiene la spada alta con gli occhi
            chiusi. All'ultimo Tenebra la devia con la spalla e Besk le brucia il
            muso, e tu sei già sul fianco. Quando le barriere esplodono in
            scintille bianche la squadra di Galdrick è intatta, e Corin non smette
            più di ridere.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Uno si muove
          testo: |
            Quando la bestia carica Corin fa un solo passo di lato, e basta perché
            il cinghiale ti prenda in pieno. La finite in tre, con Corin seduto
            per terra. L'ultimo lampo dei cristalli ti rimette in piedi, ma due
            costole restano dove le ha lasciate la bestia, e Corin ti chiede scusa
            fino a sera.
          effetti: { ferite: 2, pista.arena: 1 }
      - testo: "Scacciare l'eco con l'esorcismo"
        descrizione: "Le parole della Liturgia dell'Albero valgono per ciò che non dovrebbe restare. Un'eco è fatta apposta per non restare."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Le parole dell'Albero
          testo: |
            Dici le parole della Liturgia mentre la bestia ti carica, e a ogni
            parola le vene d'argento si spengono una alla volta, finché a tre
            passi da te si sfa in una sagoma di luce grigia. Quando le barriere
            esplodono in scintille bianche la squadra di Galdrick è intatta, e in
            tribuna qualche novizio del Velo si fa il segno. Besk ti guarda in un
            modo nuovo.
          effetti: { ferite: -1, tormento: -0.5, rep.velo: 0.5, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Le parole a metà
          testo: |
            La sabbia ti entra in gola a metà della Liturgia e la voce ti si
            inceppa, e la bestia ti è addosso. Tenebra ti tira via per la cintura,
            e la finite in quattro alla vecchia maniera, con il sangue di tutti
            sulla sabbia. L'ultimo lampo dei cristalli ti rimette in piedi, ma la
            spalla dove ti ha preso la zanna resta livida e dura.
          effetti: { ferite: 1.5, tormento: 1, pista.arena: 1 }
      - testo: "Ascoltarla come al Circolo"
        descrizione: "Al Festival hai sentito respirare un cinghiale toccato dalla Marea, e quest'eco fa lo stesso verso."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Media }
        successo:
          titolo: Il cinghiale della porta nord
          testo: |
            Chiudi gli occhi come al Circolo, e senti il respiro del cinghiale della porta
            nord, che scuote la testa a destra quando il metallo gli brucia. Gridi a Tenebra
            di stare a sinistra e fai battere a Corin la spada sulla placca, e il cinghiale
            scarta dalla parte del dolore finché Tenebra lo apre. La squadra di Galdrick è
            intatta, e lo sceriffo ti fa un cenno breve.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Troppo rumore
          testo: |
            Chiudi gli occhi per ascoltarla, e proprio in quel momento cinquemila persone urlano tutte insieme.
            Quando li riapri la zanna ti ha già aperto la coscia. Tenebra e Besk la reggono mentre Corin ti
            trascina via per il colletto, e la finite in quattro a fatica. L'ultimo lampo dei cristalli ti chiude
            la pelle, ma sotto la zanna è arrivata fino all'osso.
          effetti: { ferite: 2, pista.arena: 1 }

  # ------------------------------------------------------------ 3 → 4 · l'ora dei gladiatori
  - id: l-ora-dei-gladiatori
    presso: arena-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: L'ora dei gladiatori
    sommario: "Un'ora prima della finale, nella camera dei combattenti. Le squadre eliminate sono ancora lì, e quella di Galdrick anche."
    luogo: Arena di Qir-Azel, la camera dei combattenti
    area: quartieri-alti
    requisiti: [pista.arena == 3]
    testo: |
      Nella camera dei combattenti l'acqua dei catini è diventata rosa, e dalle
      grate arriva il rumore della folla che aspetta la finale. Orvald ha
      mandato Pett a dire che si torna in campo fra un'ora. La squadra di
      Liaren occupa le panche a sinistra, e Liaren accorda il samisen con un
      labbro spaccato. L'altra squadra si è presa l'angolo più buio, e quella
      di Galdrick si prepara in silenzio vicino alle armerie.

      Besk ripassa le formule sul quaderno e Corin si pettina con la cura di
      uno sposo. Tenebra, seduto contro il muro con la lama sulle ginocchia,
      guarda Dragna Gro-Malog dall'altra parte della sala.

      {origine mercante-dei-ponti} Gli uomini della Gilda si pettinano così
      sulle scale della Casa dei Nodi, quando stanno per entrare a firmare
      qualcosa di grosso e hanno paura.
    opzioni:
      - testo: "Andare da Liaren e dai suoi"
        immagine: personaggi/liaren-tarvelin
        descrizione: "Sono usciti fra gli applausi e i fischi, e Liaren non ha ancora deciso quale dei due tenersi."
        quando: [pista.pelle < 4]
        costo: 0
        esito:
          titolo: Un omaggio
          testo: |
            Liaren ti fa posto sulla panca. «Un omaggio alla squadra di Liaren»
            dice, imitando Orazio un'ottava sopra. «Quell'uomo mi ha fatto il
            funerale davanti a tutta la città.» Dolovan Stroud si fascia una mano
            e dice che non combatteva da anni e adesso si ricorda perché, e Borso
            si sveglia per dirti che la prossima volta i crani li sceglie lui.
      - testo: "Andare dagli Scuri"
        immagine: personaggi/mauro-scrocco
        descrizione: "Sono usciti in barella, quasi tutti. Mauro però è ancora in piedi, almeno lui."
        quando: [pista.pelle < 4]
        costo: 0
        esito:
          titolo: Il conto
          testo: |
            Durgan si fa ricucire il sopracciglio da Rozalia, che tira ogni punto un po' più del necessario, e Nihali
            tossisce. Mauro ti guarda come si guarda un debito, poi apre le braccia. «Bella leggenda, la tua» dice, con
            l'alito che arriva prima della voce. «La nostra era più grossa, ma alla Pignatta da stasera si parlerà di
            te.»
      - testo: "Andare da Galdrick e dai suoi"
        immagine: personaggi/toren-galdrick
        descrizione: "Lo sceriffo ha vinto la Mischia, e ti fa segno di avvicinarti."
        requisiti: [mischia == 2]
        costo: 0
        esito:
          titolo: La folla ti vuole
          testo: |
            Ottilia Sanvel stringe a Galdrick le cinghie dell'armatura in silenzio
            e senza sbagliare un buco. «Nella Mischia ti ho battuto io» dice lui,
            «ma la folla gridava il tuo nome. Mi sono offeso un poco, poi ho
            capito che alla città serve questo.» Ilvaena Sorathe controlla le
            frecce, e Dragna chiede a Tenebra se si è messo a fare il gladiatore
            per vederla perdere.
      - testo: "Andare da Galdrick e dai suoi"
        immagine: personaggi/toren-galdrick
        descrizione: "Lo sceriffo è uscito dalla Mischia per mano di Borso e Durgan, e ci ha già riso sopra."
        requisiti: [mischia == 1]
        quando: [pista.pelle < 4]
        costo: 0
        esito:
          titolo: Il bavero di Borso
          testo: |
            Ottilia Sanvel stringe a Galdrick le cinghie dell'armatura in silenzio
            e senza sbagliare un buco. «Borso e il nano insieme» dice lui, «uno lo
            pago io e l'altro lo paga Vesh.» Poi ti guarda il fermaglio: «È raro
            che Orvald lo dia via, tienilo da conto.» Dragna chiede a Tenebra se
            si è messo a fare il gladiatore per vederla perdere.
      - testo: "Tornare in campo"
        descrizione: "Pett è tornato sul banco di Orvald. L'ora è passata."
        esito:
          titolo: Il corridoio
          testo: |
            Pett gracchia una volta sola, e la squadra si alza. Nel corridoio
            scavato nella roccia l'aria si fa più calda, e il rumore della folla
            ti arriva nello sterno prima che nelle orecchie.
          effetti: { pista.arena: 1 }
      - testo: "Andare da Liaren e dai suoi"
        immagine: personaggi/liaren-tarvelin
        descrizione: "Sono usciti fra gli applausi e i fischi, e Liaren non ha ancora deciso quale dei due tenersi."
        quando: [pista.pelle >= 7]
        costo: 0
        esito:
          titolo: Un omaggio
          testo: |
            Liaren ti fa posto sulla panca. «Un omaggio alla squadra di Liaren»
            dice, imitando Orazio un'ottava sopra. «Quell'uomo mi ha fatto il
            funerale davanti a tutta la città.» Dolovan Stroud si fascia una mano
            e dice che non combatteva da anni e adesso si ricorda perché, e Bram
            Halgast, il martello fra le ginocchia, ti dice che la prossima volta
            l'avversario se lo sceglie lui.
      - testo: "Andare dai mercenari di Ghoran"
        immagine: ambientazione/cristalli-conduttori
        descrizione: "Sono usciti in barella, quasi tutti. Il nano però è ancora in piedi, almeno lui."
        quando: [pista.pelle >= 7]
        costo: 0
        esito:
          titolo: La paga
          testo: |
            Due mercenari di Ghoran si fasciano le braccia, e Durgan si ricuce il
            sopracciglio da solo, con l'ago in una mano e nell'altra uno
            specchietto con un fiocco rosa. «Bella leggenda, la tua» dice il più
            anziano dei mercenari. «La città ci paga per stare sulle mura, e qui
            ci siamo venuti per arrotondare. La prossima volta arrotondiamo contro
            qualcun altro.»
      - testo: "Andare da Galdrick e dai suoi"
        immagine: personaggi/toren-galdrick
        descrizione: "Lo sceriffo è uscito dalla Mischia per mano di Bram e Durgan, e ci ha già riso sopra."
        requisiti: [mischia == 1]
        quando: [pista.pelle >= 7]
        costo: 0
        esito:
          titolo: Il fabbro e il nano
          testo: |
            Ottilia Sanvel stringe a Galdrick le cinghie dell'armatura in silenzio
            e senza sbagliare un buco. «Il fabbro e il nano insieme» dice lui,
            «uno mi vende le spade e l'altro lo pagava Vesh.» Poi ti guarda il
            fermaglio: «È raro che Orvald lo dia via, tienilo da conto.» Dragna
            chiede a Tenebra se si è messo a fare il gladiatore per vederla
            perdere.

  # ------------------------------------------------------------ 4 → 5 · lo scontro delle ere
  - id: lo-scontro-delle-ere
    presso: arena-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: Lo scontro delle ere
    sommario: "Nella finale la tua squadra affronta quella di Galdrick, su un camminamento sopra l'acqua scura."
    luogo: Arena di Qir-Azel, la finale
    area: quartieri-alti
    requisiti: [pista.arena == 4]
    testo: |
      Il corridoio si apre sull'Arena, con gli spalti pieni fino all'ultima
      fila. Ci sono camminamenti in muratura sopra pozze d'acqua scura e piloni
      di cristallo dalla luce innaturale, con uno più grosso al centro, e nelle
      pozze si muove qualcosa di lungo e color piombo.

      La tua piattaforma si solleva con un clangore fino al camminamento
      centrale, e dall'altra parte sale quella di Galdrick. Dragna gli sta
      accanto piantata come una torre di ferro, insieme a Ilvaena Sorathe e
      Ottilia Sanvel.

      Orazio grida il tuo nome da un cartoncino, e la folla lo ripete.
      «Dall'altra parte, i migliori che questa città abbia mai forgiato,
      capeggiati dal nostro sceriffo e protettore Toren Galdrick! CHE LO SCONTRO
      DELLE ERE ABBIA INIZIO!»

      Tenebra va dritto su Dragna. Besk e Corin si prendono le altre due come
      possono, e Corin saluta Ottilia con un piccolo inchino. Sul camminamento
      centrale restate tu e Galdrick, che ti saluta alzando la lama.

      {armi-da-mischia Difficile} Ha alzato la lama di piatto, con il polso
      morbido. Para di piatto e aspetta, e ogni parata gli costa la metà di
      quello che costa a te colpire.

      {origine figlio-della-citta-bassa} Nei vicoli dove sei cresciuto, quando
      Galdrick scende dalla Caserma, si cambia strada senza correre, e su questo
      camminamento la strada non si cambia.
    opzioni:
      - testo: "Affrontare Galdrick"
        immagine: personaggi/toren-galdrick
        descrizione: "Para con il piatto della lama e aspetta che sia tu a sbagliare."
        combattimento: lo-scontro-delle-ere
        vittoria:
          titolo: Campione di Qir-Azel
          testo: |
            Galdrick para tutto quello che gli dai, finché smetti di dargli
            qualcosa e aspetti tu. Quando attacca lo prendi sotto la guardia, e lo
            sceriffo si siede sul camminamento mentre dall'altra parte Tenebra si
            gode Ferro che va giù. Orvald ti allaccia in vita la cintura con la
            fibbia d'alloro, e il giorno dopo il tuo nome è inciso nella pietra,
            sotto quelli dei campioni di cent'anni fa.
          imposta: { campione: 1 }
          effetti: { oggetto.cintura-del-campione: 1, monete: 100, pista.arena: 1, rep.caserma: 0.5, racconto: 1 }
        sconfitta:
          titolo: Secondo, in piedi
          testo: |
            Galdrick aspetta che sbagli, e alla fine sbagli. Il piatto della sua
            lama ti prende al polso e finisci in ginocchio sull'orlo della pozza.
            La folla però grida il tuo nome insieme al suo, e Galdrick ti rialza
            senza lasciarti la mano. «Ti ho battuto di un soffio» ti dice
            all'orecchio. Orvald ti conta il premio del secondo.
          effetti: { monete: 40, pista.arena: 1 }
      - testo: "Prendere il pilone centrale"
        descrizione: "Chi sta vicino al pilone grosso combatte meglio, se capisce prima di Galdrick come si accende."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Chi capisce l'arena
          testo: |
            Guardando Ottilia ritirare la mano scottata capisci quale placca d'ottone accende il
            pilone, e ci posi il palmo un passo prima di Galdrick. La luce ti entra nelle braccia,
            e lo sceriffo sbaglia una parata di un dito. «Vince chi capisce l'arena» dice
            rialzandosi. Ti allacciano la cintura con la fibbia d'alloro, e il giorno dopo il tuo
            nome è nella pietra.
          imposta: { campione: 1 }
          effetti: { oggetto.cintura-del-campione: 1, monete: 100, pista.arena: 1, rep.caserma: 0.5, racconto: 1 }
        fallimento:
          titolo: La placca giusta
          testo: |
            Tocchi la placca sbagliata, e il pilone ti lascia il braccio appeso
            fino alla spalla mentre Galdrick tocca quella giusta. Finisci presto
            sulla schiena con la sua lama piatta sullo sterno. «Hai capito l'arena
            un momento dopo di me» ti dice lo sceriffo, tenendoti la mano, mentre
            la folla grida il tuo nome lo stesso. Orvald ti porge la borsa del
            secondo.
          effetti: { monete: 40, ferite: 2, pista.arena: 1 }
      - testo: "Far cadere la piattaforma"
        descrizione: "La piattaforma di Galdrick è agganciata al camminamento da un perno solo, e sotto c'è l'acqua."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: L'acqua scura
          testo: |
            Ti butti sul perno, e la piattaforma si sgancia. Galdrick salta
            sull'orlo del camminamento, dove ci sei tu, e con una spallata lo
            mandi nell'acqua scura; ne esce a bracciate prima che arrivi la cosa
            color piombo, ridendo. Ti allacciano la cintura con la fibbia
            d'alloro, e il giorno dopo Galdrick lascia una mancia allo scalpellino
            che incide il tuo nome.
          imposta: { campione: 1 }
          effetti: { oggetto.cintura-del-campione: 1, monete: 100, pista.arena: 1, rep.caserma: 0.5, racconto: 1 }
        fallimento:
          titolo: In acqua
          testo: |
            Il perno cede dalla parte sbagliata, e nell'acqua scura ci finisci tu.
            Qualcosa di lungo ti morde il polpaccio finché un inserviente non lo
            colpisce con l'asta, e quando risali la tua squadra ha già perso. «Ce
            l'avevi quasi fatta» dice Galdrick, e lo dice sul serio. Orvald ti
            conta il premio del secondo e ti presta un panno che sa di corvo.
          effetti: { monete: 40, ferite: 2.5, pista.arena: 1 }
      - testo: "Giocarti la folla e la stanchezza di Galdrick"
        descrizione: "Galdrick ha già fatto la Mischia e tre giri di bestie, e cinquemila persone lo guardano invecchiare."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Difficile }
        successo:
          titolo: La guardia bassa
          testo: |
            Lo fai correre sul camminamento, e ogni volta che alza la lama indietreggi e
            chiami la tribuna. Dopo un po' Galdrick ansima e la guardia gli scende di un
            palmo, e ci entri con tutto il peso che ti resta. «Mi hai fatto vecchio
            davanti a tutta la città» ti dice, le mani sulle ginocchia, «e hai fatto
            bene.» Il giorno dopo il tuo nome è inciso nella pietra.
          imposta: { campione: 1 }
          effetti: { oggetto.cintura-del-campione: 1, monete: 100, pista.arena: 1, rep.caserma: 0.5, racconto: 1 }
        fallimento:
          titolo: Le gambe dello sceriffo
          testo: |
            Lo fai correre, ma le gambe cedono prima a te. Galdrick ha passato la
            vita a inseguire gente nei vicoli della Città Bassa, e quando ti fermi
            il piatto della sua lama ti mette in ginocchio. La folla grida il tuo
            nome lo stesso, e Galdrick ti alza il braccio insieme al suo, cosa che
            rovina il discorso di Orazio. Orvald ti consegna la borsa del secondo.
          effetti: { monete: 40, ferite: 2, pista.arena: 1 }
      - testo: "Prendere i colpi e restare in piedi"
        descrizione: "A Ghoran hai imparato a stare dritto mentre qualcuno si stanca di colpirti."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza], difficolta: Difficile }
        successo:
          titolo: Chi si stanca prima
          testo: |
            Smetti di attaccare e incassi il piatto della sua lama senza muoverti,
            mentre la folla conta i colpi e a metà smette di ridere. Al nono
            Galdrick ha la guardia più bassa di un palmo, e ci entri con tutto il
            peso. «Chi ti ha insegnato a incassare così?» chiede, e ti alza il
            braccio verso la tribuna. Il giorno dopo il tuo nome è inciso nella
            pietra.
          imposta: { campione: 1 }
          effetti: { oggetto.cintura-del-campione: 1, monete: 100, pista.arena: 1, rep.caserma: 0.5, racconto: 1 }
        fallimento:
          titolo: Uno di troppo
          testo: |
            Prendi i colpi uno dopo l'altro mentre la folla li conta, finché
            all'undicesimo il piatto della lama ti arriva sul fianco già livido e
            le ginocchia decidono per conto loro. Galdrick ti rialza e non ti
            lascia la mano finché Orazio non ha finito. «Non c'era bisogno di
            prenderle tutte» ti dice all'orecchio, quasi arrabbiato. Orvald ti
            consegna la borsa del secondo.
          effetti: { monete: 40, ferite: 2, pista.arena: 1 }

  # ------------------------------------------------------------ dopo la pista · le giornate all'Arena
  - id: una-giornata-all-arena
    presso: arena-di-qir-azel
    immagine: ambientazione/cristalli-conduttori
    titolo: Una giornata all'Arena
    sommario: "Incontri d'esibizione e scommesse davanti a un pubblico che si ricorda di te."
    luogo: Arena di Qir-Azel, un pomeriggio qualunque
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.arena >= 5]
    testo: |
      Dopo il torneo l'Arena non ha più chiuso. Il pomeriggio ci sono incontri
      d'esibizione, e sotto le scalinate un allibratore con la penna dietro
      l'orecchio raccoglie le puntate su una lavagna, dove la quota del tuo nome
      cambia ogni settimana. Orvald tiene il banco delle iscrizioni anche nei
      giorni normali, con Pett che dorme con la testa sotto l'ala, e sulle
      panche aspettano due mercenari di passaggio che fingono di non
      riconoscerti.
    opzioni:
      - testo: "Combattere un incontro d'esibizione"
        immagine: ambientazione/cristalli-conduttori
        descrizione: "Due mercenari contro di te, davanti a una tribuna mezza piena. La borsa è piccola, il pubblico no."
        combattimento: una-giornata-all-arena
        vittoria:
          titolo: La borsa
          testo: |
            I due mercenari si danno coraggio battendo le spade sugli scudi, e il
            primo ti viene addosso troppo presto e va giù alla seconda parata.
            L'altro alza le mani prima ancora che tu lo tocchi, e la tribuna batte
            i piedi sulle gradinate. Orvald ti conta la borsa sul banco, e Pett
            becca una moneta per controllare che sia vera.
          effetti: { monete: 20 }
        sconfitta:
          titolo: Una giornata storta
          testo: |
            Il primo mercenario lo butti giù troppo in fretta per il tuo bene, e mentre ti volti
            a salutare la tribuna il secondo ti prende al ginocchio con il bordo dello scudo.
            Finisci con la faccia nella sabbia davanti a cinquecento persone che ridono, e Orvald
            ti dà qualche moneta per il disturbo, perché il pubblico paga anche per vedere un
            campione che inciampa.
          effetti: { monete: 5 }
      - testo: "Fare spettacolo con un mercenario"
        descrizione: "Un incontro concordato, con le cadute studiate. Al pubblico va benissimo, se è fatto bene."
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: Il colpo tirato a vuoto
          testo: |
            Il mercenario conosce il mestiere, e prima di entrare ti sussurra dove
            cadrà. Cade una volta di schiena e una in ginocchio, con un lamento
            che si sente fino alle ultime file, e alla terza caduta la tribuna
            ride e applaude. Orvald vi divide la borsa sul banco, e sul registro
            scrive *esibizione* con un punto interrogativo.
          effetti: { monete: 12 }
        fallimento:
          titolo: Fischi
          testo: |
            Il mercenario sbaglia il tempo di una caduta e tu quello della tua, e
            per un momento restate in piedi a guardarvi. La tribuna fischia, e a
            te resta un livido vero dove il colpo doveva essere finto. Orvald ti
            dà qualche spicciolo e la sua opinione sull'arte drammatica, che parte
            da Orazio Belcanto e ci mette un pezzo ad arrivare a te.
          effetti: { monete: 3, ferite: 0.5 }
      - testo: "Scommettere su un incontro"
        descrizione: "Dalla tribuna si vede chi zoppica e chi ha dormito poco. L'allibratore forse non se ne accorge."
        requisiti: [monete >= 10]
        prova: { attributo: mentale, abilita: [percezione, medicina], difficolta: Media }
        successo:
          titolo: Il ginocchio sinistro
          testo: |
            Dalla gradinata guardi i due che si scaldano, e il favorito si tocca
            il ginocchio sinistro senza accorgersene. Punti qualche moneta
            sull'altro, a una quota generosa e con un sorriso di compatimento
            dell'allibratore. Al terzo assalto il favorito si piega su quel
            ginocchio, e l'allibratore ti conta la vincita guardandoti storto,
            come se fosse colpa tua.
          effetti: { monete: 15 }
        fallimento:
          titolo: La quota giusta
          testo: |
            Ti sembra che il favorito zoppichi, e punti una bella somma sull'altro.
            Il favorito invece cammina così da quando è nato, e al primo assalto
            manda l'avversario contro le griglie. L'allibratore cancella la tua
            puntata dalla lavagna con il palmo e ti ringrazia per la fiducia con un
            inchino.
          effetti: { monete: -10 }

  # ------------------------------------------------------------ dopo la pista · la rivincita
  - id: la-rivincita
    presso: arena-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: La rivincita
    sommario: "Il titolo l'ha preso Galdrick, che certi pomeriggi si allena all'Arena e una sfida non l'ha mai rifiutata."
    luogo: Arena di Qir-Azel, il camminamento centrale
    area: quartieri-alti
    requisiti: [pista.arena >= 5, campione == 0, pista.pelle != 4, pista.pelle != 5, pista.pelle != 6]
    testo: |
      Certi pomeriggi Galdrick viene all'Arena a tirare di scherma con le
      reclute della Guardia, in maniche di camicia. Lo trovi sul camminamento
      centrale, sopra l'acqua scura, che abbassa con due dita la guardia di un
      ragazzo che la tiene troppo alta. Quando ti vede manda via la recluta con
      una pacca e infila i pollici nella cintura del campione, quella con la
      fibbia d'alloro. «Sapevo che saresti venuto» dice. «Qui alla rivincita si
      ha diritto, e un campione che si fa sfidare mi piace più di uno che si fa
      guardare. Orvald!» Dal banco Orvald alza la mano senza voltarsi.
    opzioni:
      - testo: "Sfidarlo a duello"
        immagine: personaggi/toren-galdrick
        descrizione: "Lo sceriffo da solo, sul camminamento. Nessuna squadra stavolta, e nessun pilone acceso."
        combattimento: il-duello-con-galdrick
        vittoria:
          titolo: Il titolo
          testo: |
            Per un pezzo è come in finale, con lui che para con il piatto della
            lama e aspetta. Stavolta però sbaglia lui, di un mezzo passo, e si
            trova la tua lama sotto il mento. Ride, si slaccia la cintura del
            campione e te la mette in mano. «Me la sono goduta abbastanza» dice.
            Il giorno dopo uno scalpellino aggiunge il tuo nome nella pietra,
            sotto il suo.
          imposta: { campione: 1 }
          effetti: { oggetto.cintura-del-campione: 1, monete: 50, racconto: 1 }
        sconfitta:
          titolo: Un'altra volta
          testo: |
            Galdrick ti aspetta senza attaccare mai, finché sei tu a stancarti di
            aspettare, e il piatto della sua lama ti mette in ginocchio sul
            camminamento senza cattiveria. Ti tira su con uno strattone. «Il
            camminamento è sempre qui, e io ci vengo il martedì» dice, mentre dal
            banco Orvald scrive una riga sul registro.
          effetti: { tormento: 1 }
      - testo: "Leggere la sua guardia"
        descrizione: "Para con il piatto e aspetta, e come tutti ha un'abitudine che gli apre un varco."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Difficile }
        successo:
          titolo: Il varco
          testo: |
            Lo lasci attaccare e lo guardi. Dopo ogni parata abbassa il gomito destro
            di un dito per far riposare la spalla, e al terzo gomito ci entri.
            Galdrick si trova la tua lama sotto il mento e ride, poi si slaccia la
            cintura del campione e te la mette in mano. «Il gomito, eh. Trent'anni
            che nessuno me lo fa notare.»
          imposta: { campione: 1 }
          effetti: { oggetto.cintura-del-campione: 1, monete: 50, racconto: 1 }
        fallimento:
          titolo: Il gomito
          testo: |
            Il varco che vedi dopo una parata te l'ha aperto lui apposta, e ci
            entri dritto contro il piatto della sua lama, che ti prende al polso.
            La tua arma finisce nell'acqua scura, e mentre guardi l'inserviente
            ripescarla con un uncino il secondo colpo ti arriva sulle costole.
            Galdrick ti aspetta con la mano tesa e ti dice di tornare quando vuoi,
            che il martedì lui c'è sempre.
          effetti: { ferite: 2 }
      - testo: "Stancarlo"
        descrizione: "Non è più un ragazzo, e ha mezza giornata di reclute nelle braccia. Basta resistere più di lui."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Il fiato lungo
          testo: |
            Per tutto il pomeriggio lo fai girare sul camminamento senza quasi mai
            attaccare, finché il sole scende sotto gli spalti e le reclute si
            siedono a guardare. Alla fine Galdrick abbassa la lama da solo e si
            slaccia la cintura del campione. «Prendila, prima che mi passi la
            voglia di dartela» dice. Il giorno dopo il tuo nome viene inciso nella
            pietra.
          imposta: { campione: 1 }
          effetti: { oggetto.cintura-del-campione: 1, monete: 50, racconto: 1 }
        fallimento:
          titolo: Le gambe
          testo: |
            Lo fai girare sul camminamento finché le reclute si siedono a
            guardare, e il primo a fermarsi sei tu, perché Galdrick ha passato
            trent'anni a inseguire ladri su per le scale della Città Bassa. Ti
            mette giù con un colpo di piatto, poi ti offre la sua fiaschetta
            d'acqua tiepida che sa di cuoio e ti dice che il martedì lui è sempre
            qui.
          effetti: { ferite: 2 }
      - testo: "Guardargli il fianco"
        descrizione: "La notte della Pignatta la sciabola di Vesh gliel'ha aperto. Sotto la camicia bagnata si vede ancora il segno."
        quando: [pista.pelle >= 7]
        costo: 0
        esito:
          titolo: La cicatrice
          testo: |
            Galdrick si accorge di dove guardi e si tira su la camicia senza
            imbarazzo. La cicatrice è lunga una spanna, ancora lucida. «Tira
            quando alzo la lama sopra la testa» dice, «e allora la tengo più
            bassa.»

            {medicina Media} O si fida di te più di quanto dovrebbe, o tiene la
            lama bassa da così tanto che non è più un punto debole.
      - testo: "Salutarlo con la lama alla maniera dei saloni"
        descrizione: "Il saluto con la lama dei saloni un uomo del Consiglio non può lasciarlo senza risposta."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Difficile }
        successo:
          titolo: Il saluto
          testo: |
            Lo saluti con la lama come nei saloni, la punta al mento e poi giù,
            piano. Galdrick risponde allo stesso modo, un po' rigido, da uomo che
            l'ha imparato tardi, e tu finisci il tuo un battito prima, così quando
            la sua lama torna in posizione la tua è già sotto il suo mento.
            Ridendo, lo sceriffo ti mette in mano la cintura del campione.
          imposta: { campione: 1 }
          effetti: { oggetto.cintura-del-campione: 1, monete: 50, racconto: 1 }
        fallimento:
          titolo: Nei vicoli nessuno saluta
          testo: |
            Lo saluti con la lama come si fa nei saloni, e lui ti risponde con una
            pedata nello stinco che in un salone farebbe svenire una contessa. Il
            piatto della sua lama ti prende al polso e poi sulle costole, e
            finisci piegato in due sul bordo del camminamento. «Nei vicoli nessuno
            ti saluta prima» dice Galdrick, tendendoti la mano.
          effetti: { ferite: 2 }
