# L'Arena di Qir-Azel (pista.arena 0 → 5): l'annuncio di Galdrick e l'iscrizione da Orvald, la Grande Mischia,
# la prova a squadre con l'eco del Cinghiale Crudele, l'ora nell'area dei combattenti e la finale contro la squadra
# di Galdrick. Dopo la pista, due storie all'Arena: le giornate d'esibizione e la rivincita per il titolo.
# La squadra del protagonista: Besk Dravec (assegnata da Orvald), Corin Ashdale e Tenebra.
storylet:
  # ------------------------------------------------------------ 0 → 1 · l'annuncio e l'iscrizione
  - id: l-annuncio-dei-cristalli
    presso: arena-di-qir-azel
    immagine: ambientazione/cristalli-conduttori
    titolo: L'annuncio dei cristalli
    sommario: "I cristalli delle facciate si mettono a ronzare tutti insieme, e la voce di Galdrick arriva in ogni vicolo. L'Arena riapre."
    luogo: Qir-Azel, poi l'Arena e la camera dei combattenti
    area: quartieri-alti
    requisiti: [pista.arena == 0, pista.capomozzo >= 6]
    testo: |
      Sei davanti a un forno quando i cristalli delle facciate e dei lampioni
      tremano tutti insieme, e un ronzio basso ti sale dalle suole fino ai
      denti. Il fornaio resta con la pala alzata a mezz'aria. Poi dai cristalli
      esce la voce di Toren Galdrick, così netta che ti viene da voltarti per
      cercarlo.

      «Abitanti di Qir-Azel. Vi parlo per conto del Consiglio e della
      Confraternita del Velo. La nostra città è stata messa alla prova, e
      abbiamo visto che cosa si muoveva ai margini del Bosco. Per questo l'Arena
      riapre le sue porte a chiunque abbia qualcosa da dimostrare, e a chi
      arriverà in fondo alle Tre Prove andrà il titolo di Campione di Qir-Azel.
      Io sono Toren Galdrick, e vi dico che non c'è momento migliore per far
      vedere che Qir-Azel non si piega né oggi né mai.»

      Dopo un momento di silenzio la strada riparte più forte di prima, con gli
      apprendisti che contano le scommesse sulle dita. Qualcuno davanti al forno
      dice il tuo nome, e quando ti volti fa finta di guardare il pane.

      Il giorno dopo due miliziani dai mantelli scarlatti ti vengono incontro
      sul piazzale dell'Arena e ti portano dentro per un corridoio basso, fra
      bassorilievi di eroi che sventrano mostri, fino alla camera dei
      combattenti. Dietro un banco di legno rinforzato Orvald Temmerin sta
      congedando Dolovan Stroud, che si allontana pensieroso. Il corvo Pett ti
      guarda dal bordo del banco con la testa inclinata, e Orvald alza appena
      gli occhi dal registro. «Ah. Sei tu. Bene» dice. «L'Arena ti aspetta. Che
      cosa posso fare per te?»
    opzioni:
      - testo: "Chiedere il regolamento della Mischia"
        descrizione: "Orvald di rado risponde due volte alla stessa domanda. Meglio fargliela bene la prima."
        immagine: personaggi/orvald-temmerin
        costo: 0
        esito:
          titolo: Dodici, non uno di più
          testo: |
            «Regolamento? Bene, meglio chiarire subito» dice Orvald, e fa
            scorrere un dito lungo l'elenco dei nomi. «La prima prova è la
            Grande Mischia. Dodici combattenti e un solo vincitore.» Alza
            l'indice, e Pett alza la testa insieme a lui.

            «Si combatte dentro un recinto ovale di contenimento magico. L'ho
            voluto io, per quei furbi che scappano ai bordi e sperano che gli
            altri si ammazzino fra loro senza accorgersi di nulla.» Poi
            aggiunge, con calma, che al vincitore toccherà un oggetto scelto
            dalla sua collezione personale, e il corvo sbatte le ali una volta
            sola, come se avesse sentito il prezzo.
      - testo: "Chiedere delle altre due prove"
        descrizione: "Una mischia non fa un torneo. Galdrick ha parlato di tre prove."
        immagine: personaggi/orvald-temmerin
        costo: 0
        esito:
          titolo: Chi capisce l'arena
          testo: |
            Orvald cambia registro e lo apre su una pagina piena di
            cancellature. «Seconda fase, squadre da quattro. Le squadre fra loro
            non si toccano, e ognuna affronta quello che l'Arena decide di
            offrirle, tre volte di seguito. L'ultima volta sarà una creatura
            sola, e sarà la peggiore.» Ti guarda da sopra il registro. Sa che
            una squadra non ce l'hai, e dice che ci penserà lui quando firmi.

            Poi fa un piccolo gesto circolare con la mano e ti spiega che nella
            finale le squadre migliori si affrontano fra loro, con i piloni
            accesi e il terreno che si muove sotto i piedi. «Di solito chi
            colpisce più forte arriva in fondo» dice, e Pett piega la testa da
            una parte. «Chi capisce l'arena ci arriva meno stanco.»
      - testo: "Chiedere che cosa è vietato"
        descrizione: "In bisaccia hai sempre qualcosa che un giudice potrebbe non gradire."
        immagine: personaggi/orvald-temmerin
        costo: 0
        esito:
          titolo: Con quello che hai addosso
          testo: |
            «Qui dentro entrano maghi e guerrieri, e quasi tutto quello che
            riesce a firmare il modulo» dice Orvald, intingendo la penna. «Le
            pozioni restano fuori insieme agli oli, e così le pergamene e
            qualunque cosa si consumi. Si combatte con quello che sei e con
            quello che hai addosso.» Batte due dita sul banco, e Pett salta di
            lato per non farsi pestare la coda.

            Poi indica le grate in alto, da dove arriva il rumore della folla, e
            aggiunge un'ultima cosa: «Attorno all'Arena corre una cintura di
            Cristalli Conduttori che protegge il pubblico, e anche voi. Morire
            qui dentro è molto difficile, anche se si può. Chi forza un colpo
            mortale fuori controllo viene squalificato, e nei casi gravi finisce
            in cella da Borso.»
      - testo: "Chiedere chi si è iscritto"
        descrizione: "Nella camera dei combattenti ci sono facce che conosci. Alcune ti salutano, altre no."
        immagine: personaggi/mauro-scrocco
        costo: 0
        esito:
          titolo: Facce note
          testo: |
            Orvald legge i nomi dal registro senza fretta. Toren Galdrick si è
            iscritto alla Mischia e alle squadre, e in città lo danno favorito
            in tutte e due. Liaren Tarvelin dice di partecipare per curiosità e
            per uscire un giorno dalla locanda. Ettore Castaldi l'ha iscritto
            sua cugina Julia, perché così almeno combina qualcosa. Borso ha
            chiesto un giorno di licenza alla Caserma per fracassare più crani
            che può.

            Nell'angolo vicino ai catini Mauro Scrocco parla a bassa voce con
            Rozalia Marga, che tiene due stiletti fra le dita come penne.
            Accanto a loro ci sono un nano pieno di cicatrici con una grande
            ascia e Nihali Cuzan, che tossisce nella pipa. Mauro ti vede, ti fa
            un cenno largo con la mano e sorride con tutti i denti.
      - testo: "Iscriverti alle Tre Prove"
        descrizione: "Una firma sul registro di Orvald. Il resto viene dopo."
        immagine: personaggi/besk-dravec
        requisiti: [pista.corin == 0]
        esito:
          titolo: La squadra di Orvald
          testo: |
            Firmi, e Orvald soffia sull'inchiostro. «Per le squadre ti do la mia
            allieva» dice, e chiama Besk Dravec dalle nicchie. È una ragazza con
            gli occhiali e un vestito olvaro, e ti stringe la mano con cortesia.
            «Lancia meglio di come parla» dice Orvald, «e parla moltissimo.»
            Besk risponde a voce rapida che lui lo dice perché lei gli corregge
            i conti.

            Un uomo in panciotto ricamato si avvicina scansando le panche con
            piccoli inchini. «Domando scusa. Corin Ashdale, della Gilda dei
            Mercanti» dice. «Vorrei imparare come si fa a essere un eroe, e mi
            hanno detto che bisogna stare vicino a uno. Vi manca un uomo?»
            Orvald lo scrive sul registro prima che tu risponda.
          pe: { persuasione: 3 }
          effetti: { pista.arena: 1 }
      - testo: "Iscriverti alle Tre Prove"
        descrizione: "Una firma sul registro di Orvald. Il resto viene dopo."
        immagine: personaggi/besk-dravec
        requisiti: [pista.corin >= 1, pista.corin <= 5]
        esito:
          titolo: La squadra di Orvald
          testo: |
            Firmi, e Orvald soffia sull'inchiostro. «Per le squadre ti do la mia
            allieva» dice, e chiama Besk Dravec dalle nicchie. È una ragazza con
            gli occhiali e un vestito olvaro, e ti stringe la mano con cortesia.
            «Lancia meglio di come parla» dice Orvald, «e parla moltissimo.»
            Besk risponde a voce rapida che lui lo dice perché lei gli corregge
            i conti.

            Alle tue spalle qualcuno si schiarisce la voce. È Corin Ashdale, con
            il fazzoletto al taschino e una spada nuova che non sa dove
            appendere. «Eccellente, eccellente» dice. «Ti cercavo. Volevo
            imparare come si fa a essere un eroe, ricordi? Mi pare l'occasione.»
            Ride per primo, e Orvald lo scrive sul registro.
          pe: { persuasione: 3 }
          effetti: { pista.arena: 1 }
      - testo: "Iscriverti alle Tre Prove"
        descrizione: "Una firma sul registro di Orvald. Il resto viene dopo."
        immagine: personaggi/besk-dravec
        requisiti: [pista.corin >= 6]
        esito:
          titolo: La squadra di Orvald
          testo: |
            Firmi, e Orvald soffia sull'inchiostro. «Per le squadre ti do la mia
            allieva» dice, e chiama Besk Dravec dalle nicchie. È una ragazza con
            gli occhiali e un vestito olvaro, e ti stringe la mano con cortesia.
            «Lancia meglio di come parla» dice Orvald, «e parla moltissimo.»
            Besk risponde a voce rapida che lui lo dice perché lei gli corregge
            i conti.

            Sulla porta compare Corin Ashdale, che dovrebbe essere a Laresh, con
            gli stivali ancora bianchi di polvere. «Ho sentito del torneo a metà
            strada» dice, «e la carovana l'ho lasciata ai carrettieri. Dovevo
            ancora imparare come si fa a essere un eroe, ricordi?» Ride per
            primo, e intanto Orvald lo ha già scritto sul registro.
          pe: { persuasione: 3 }
          effetti: { pista.arena: 1 }

  # ------------------------------------------------------------ 1 → 2 · la Grande Mischia
  - id: la-grande-mischia
    presso: arena-di-qir-azel
    immagine: personaggi/orazio-belcanto
    titolo: La Grande Mischia
    sommario: "Dodici combattenti dentro un recinto che brucia chi lo tocca, e uno solo uscirà con il nome inciso nella pietra."
    luogo: Arena di Qir-Azel, il recinto ovale
    area: quartieri-alti
    requisiti: [pista.arena == 1]
    testo: |
      I cristalli della cintura si accendono tutti insieme, e un'onda di
      vibrazione attraversa la sabbia e ti sale nelle caviglie. Su una sporgenza
      della tribuna Orazio Belcanto, con le piume sul cappello e una giacca che
      manda lampi, allarga le braccia inanellate. «Popolo di Qir-Azel, cittadini
      della Città Alta e della Città Bassa! Oggi l'Arena non chiede spettatori.
      Vuole volontà e sangue, e vuole sapere un nome. Che abbiano inizio le Tre
      Prove!»

      Le griglie ai bordi si sollevano dal suolo, e il recinto ovale si accende
      di un verde acido che ti fa lacrimare. Orazio scandisce le parole una alla
      volta. «Dodici combattenti entrano. Uno solo uscirà da qui con il suo nome
      inciso nella pietra.»

      Galdrick saluta la tribuna con due dita, in armatura scura. Borso si batte
      la clava sul palmo e racconta a chiunque sia a portata d'orecchio che il
      giorno di licenza se l'è guadagnato. Dragna Gro-Malog ha l'ascia già in
      mano, e Mauro Scrocco suda nella sua camicia color zafferano prima ancora
      di cominciare. Il nano con le cicatrici si chiama Durgan e non ha detto
      una parola da stamattina. Fra gli altri c'è un mercenario di passaggio con
      lo scudo dipinto di fresco, che ogni tanto guarda la tribuna per vedere se
      sua madre è arrivata.

      «GUERRIERI DELLA GRANDE MISCHIA!» grida Orazio. «COMINCIATE!»
    opzioni:
      - testo: "Buttarti nella mischia"
        immagine: fazioni/scuri
        descrizione: "Undici avversari, e tutti contro di te appena si accorgono che sei ancora in piedi."
        combattimento: la-grande-mischia
        vittoria:
          titolo: Un nome nella pietra
          testo: |
            Dragna e Mauro si cercano subito, e finiscono fuori dal recinto
            avvinghiati. Galdrick ne butta giù tre prima che Borso e Durgan gli
            vengano addosso insieme e lo spingano oltre la linea verde, e lo
            sceriffo, cadendo, si porta dietro Borso per il bavero. Poi Durgan
            si volta verso di te, con il mercenario dallo scudo dipinto. Il
            mercenario va giù per primo. Il nano ti costa una spalla che non
            senti più e il fiato, finché non scivola sulla sabbia e la sua ascia
            ti passa a un dito dall'orecchio.

            Orvald ti mette in mano un fermaglio d'argento intrecciato. «Questo
            non è roba da bancarella» dice, mentre la tribuna urla il tuo nome.
          imposta: { mischia: 1 }
          effetti: { oggetto.fermaglio-di-orvald: 1, pista.arena: 1, racconto: 1 }
        sconfitta:
          titolo: Il favorito
          testo: |
            Durgan ti prende di piatto con il manico dell'ascia, e ti ritrovi in
            ginocchio con la schiena a un palmo dalla linea verde. Il calore del
            recinto ti brucia la nuca. Un calcio del mercenario ti fa fare
            l'ultimo palmo, e la scarica del recinto ti butta sulla sabbia di
            fuori.

            Vince Galdrick come dicevano tutti, e lo fa senza fretta. Mentre
            Orazio lo proclama, dalla tribuna però arriva il tuo nome, prima da
            un angolo e poi da tutti. Orvald si china sul registro. «La folla ti
            vuole nella prova a squadre» dice, «e io non litigo con la folla.»
          imposta: { mischia: 2 }
          effetti: { pista.arena: 1 }
      - testo: "Restare al bordo e lasciare che si sfoltiscano"
        descrizione: "Il recinto brucia chi lo tocca. Bisogna stargli accanto senza toccarlo, mentre gli altri si fanno a pezzi al centro."
        prova: { attributo: fisico, abilita: [acrobazia, percezione], difficolta: Difficile }
        successo:
          titolo: Sul filo verde
          testo: |
            Ti tieni a un passo dalla linea verde, con la pelle che formicola
            sul fianco, e lasci che al centro si facciano a pezzi fra loro. Vedi
            Borso e Durgan spingere Galdrick fuori dal recinto insieme, e lo
            sceriffo che si porta dietro Borso per il bavero. Il nano e il
            mercenario si voltano verso di te nello stesso momento. Il
            mercenario ti carica e tu ti sposti, e il recinto fa il resto.
            Durgan è più furbo e ti costa un taglio sull'avambraccio, finché non
            perde l'equilibrio sul bordo e la linea verde lo prende alla
            schiena.

            Orvald ti porge un fermaglio d'argento intrecciato. «Questo non è
            roba da bancarella» dice. «Il bordo l'avevo pensato per i codardi.
            Tu l'hai usato meglio di loro.»
          imposta: { mischia: 1 }
          effetti: { oggetto.fermaglio-di-orvald: 1, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: La linea verde
          testo: |
            Un gomito di Borso ti arriva nelle costole mentre guardi da un'altra
            parte, e fai un passo indietro di troppo. Il recinto ti brucia la
            schiena con un calore che ti toglie il fiato e ti butta fuori sulla
            sabbia, con la camicia che fuma e ti resta attaccata alla pelle.
            L'inserviente che te la stacca ha la mano leggera, e fa male lo
            stesso.

            Vince Galdrick, il favorito. Dalla tribuna però chiamano il tuo
            nome, e Orvald, chino sul registro, dice che la folla ti vuole nella
            prova a squadre e che lui con la folla non litiga.
          imposta: { mischia: 2 }
          effetti: { ferite: 2, pista.arena: 1 }
      - testo: "Prenderti la folla"
        descrizione: "Dodici combattenti e cinquemila spettatori. Chi ha la tribuna dalla sua ha già mezzo recinto."
        prova: { attributo: sociale, abilita: [espressivita, intimidire], difficolta: Difficile }
        successo:
          titolo: Il nome che gridano
          testo: |
            Alzi l'arma verso la tribuna dei Quartieri Alti e poi verso quella
            della Città Bassa, e la seconda ti risponde con un boato che fa
            tremare le griglie. Da lì in avanti chi ti si avvicina lo fa con un
            occhio agli spalti. Borso e Durgan scelgono Galdrick, e lo spingono
            oltre la linea verde insieme, e lui si porta dietro Borso per il
            bavero. Quando il nano e il mercenario si voltano verso di te la
            folla scandisce il tuo nome, e il mercenario esce dal recinto da
            solo, rosso in faccia. Durgan resta, e ti costa una spalla e un
            labbro spaccato prima di andare giù.

            Orvald ti porge un fermaglio d'argento intrecciato. «Questo non è
            roba da bancarella» dice.
          imposta: { mischia: 1 }
          effetti: { oggetto.fermaglio-di-orvald: 1, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Il pubblico sbagliato
          testo: |
            Alzi l'arma verso la tribuna, e dalla tribuna ti arriva un torsolo
            di mela. Mentre lo schivi Durgan ti prende alle gambe con il manico
            dell'ascia e poi alle costole. Finisci sulla linea verde con tutta
            la schiena.

            Vince Galdrick, il favorito. Dalla tribuna però, a sorpresa,
            cominciano a chiamare il tuo nome, forse per il torsolo, e Orvald
            dice che la folla ti vuole nella prova a squadre e che lui con la
            folla non litiga.
          imposta: { mischia: 2 }
          effetti: { ferite: 2, pista.arena: 1 }
      - testo: "Piegare il recinto"
        descrizione: "Il verde della linea è Mana, e il Mana si lascia spostare da chi sa dove spingere. Orvald non ha vietato la magia."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il recinto si stringe
          testo: |
            Senti il Mana del recinto ronzarti nei denti, e trovi il punto dove
            è più sottile. Quando Borso e Durgan spingono Galdrick verso il
            bordo, tu tiri la linea verde di un passo verso di lui, e lo
            sceriffo esce trascinandosi dietro Borso per il bavero. Il nano e il
            mercenario si voltano verso di te. Il mercenario finisce sul verde
            senza capire come. Durgan ti costa un taglio sul fianco e tutto il
            fiato che hai, prima che il recinto lo prenda alle spalle.

            Orvald ti porge un fermaglio d'argento intrecciato e ti guarda a
            lungo. «Questo non è roba da bancarella» dice. «Il recinto, però, è
            roba mia.»
          imposta: { mischia: 1 }
          effetti: { oggetto.fermaglio-di-orvald: 1, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Il ritorno del Mana
          testo: |
            Il Mana del recinto ti torna indietro tutto insieme, e per un
            momento vedi la sabbia diventare verde. Quando ci vedi di nuovo sei
            fuori dalla linea, seduto, con il sapore del rame in bocca e un
            tremito alle mani che non vuole passare.

            Vince Galdrick, il favorito. Dalla tribuna però chiamano il tuo
            nome, e Orvald dice che la folla ti vuole nella prova a squadre e
            che lui con la folla non litiga.
          imposta: { mischia: 2 }
          effetti: { tormento: 1, ferite: 1, pista.arena: 1 }

  # ------------------------------------------------------------ 2 → 3 · la prova a squadre
  - id: la-prova-a-squadre
    presso: arena-di-qir-azel
    immagine: ambientazione/cristalli-conduttori
    titolo: La prova a squadre
    sommario: "L'Arena si divide in un quadrante per squadra, e al centro di ognuno c'è un cristallo da cui escono le bestie."
    luogo: Arena di Qir-Azel, i quadranti
    area: quartieri-alti
    requisiti: [pista.arena == 2]
    testo: |
      Il quarto della squadra si è presentato ieri sera al banco di Orvald.
      Tenebra ha firmato il modulo senza leggerlo e, quando Corin gli ha chiesto
      perché un capo dei Raschiatori si mettesse a fare il gladiatore, ha
      risposto senza alzare gli occhi. «Voglio vedere Ferro perdere. Una volta.»

      Le quattro squadre avanzano in fila verso la sabbia. Dietro la tua vengono
      Liaren con i suoi e poi gli Scuri, e per ultima la squadra di Galdrick. A
      metà strada il terreno si apre, e dal suolo salgono placche di metallo e
      pietra che dividono l'Arena in quadranti. Al centro del tuo emerge un
      cristallo conduttore alto due volte un uomo. Besk ci avvicina la mano
      senza toccarlo e la ritira subito, poi si sistema gli occhiali. «Questa
      carica l'ho vista una volta sola, sull'altare della Cattedrale» dice
      piano. «Questi cristalli li ha caricati la Madre del Velo in persona.
      Quello che ne esce sarà un'eco.»

      «SECONDA FASE!» La voce di Orazio scende dalle grate. «CONTRO DI VOI, LE
      BESTIE DELL'ARENA!»

      Il cristallo si riempie di luce azzurra e scarica fulmini sulla sabbia, e
      dove cadono prendono forma i vermi carogna della Foresta Strisciante. Sono
      pallidi come cera e un po' trasparenti ai bordi. Corin stringe la spada
      con tutte e due le mani. Tenebra ti guarda e aspetta che sia tu a dire
      come si fa.
    opzioni:
      - testo: "Stare davanti con Tenebra"
        immagine: personaggi/tenebra
        descrizione: "Tu e lui in prima fila, Besk dietro a lanciare e Corin dietro a Besk. È il modo più semplice, e anche il più faticoso."
        prova: { attributo: fisico, abilita: [armi-da-mischia, rissa], difficolta: Media }
        successo:
          titolo: Spalla a spalla
          testo: |
            Tenebra si mette alla tua sinistra senza che glielo chiedi, e per
            due giri nessuna bestia passa fra voi. I vermi carogna si sfasciano
            in schegge di luce. Il cristallo vi bagna di un calore che chiude i
            tagli, poi Orazio annuncia le peggiori tra le belve, e dal cristallo
            escono due Camminatori della Salvaguardia, le macchine dei
            Precursori, con le giunture che stridono come quelle vere.

            Tenebra ne ferma uno con la lama di traverso. Tu e Besk fate cadere
            l'altro, e Corin gli siede sopra finché non smette di muoversi. Nel
            silenzio che segue Tenebra si pulisce la lama sulla manica e ti fa
            un cenno solo.
          segue: una-leggenda
        fallimento:
          titolo: La prima fila
          testo: |
            Tieni la prima fila, ma i vermi carogna sono troppi e uno ti si
            avvolge al polpaccio prima che Tenebra lo tagli. Il cristallo vi
            chiude le ferite, e poi arrivano i Camminatori della Salvaguardia,
            le macchine dei Precursori. Uno ti schiaccia contro la placca di
            pietra con il suo braccio piatto.

            Ne venite fuori, ma ti resta addosso il suo stampo. Corin ti aiuta a
            rialzarti e ti chiede se essere un eroe fa sempre così male. Tenebra
            risponde di sì al posto tuo.
          effetti: { ferite: 1 }
          segue: una-leggenda
      - testo: "Leggere il cristallo con Besk"
        immagine: personaggi/besk-dravec
        descrizione: "Prima di ogni bestia il cristallo si accende da una parte. Se sai da quale, ci arrivi prima tu."
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: Il lato che si accende
          testo: |
            Besk ti sussurra quello che sente nel cristallo, e tu lo guardi
            finché capisci che prima di ogni lampo la luce si addensa da un
            lato. Da lì in avanti ogni verme carogna nasce con te già sopra. Il
            cristallo vi cura, e quando escono i Camminatori della Salvaguardia
            sapete da che parte arriveranno, e Tenebra li aspetta lì con la
            lama.

            Besk scrive qualcosa su un quaderno che tiene nella manica. Corin
            vuole sapere che cosa, e lei gli risponde che è un appunto per
            Orvald e che non lo riguarda.
          segue: una-leggenda
        fallimento:
          titolo: Il lato sbagliato
          testo: |
            Guardi il cristallo così fisso che non vedi il verme carogna alle
            tue spalle, e Besk lo brucia quando ti ha già morso il braccio. Il
            cristallo vi cura, e i Camminatori della Salvaguardia escono dal
            lato che non guardavi. Tenebra ne prende uno da solo, e tu ti fai
            schiacciare un piede dall'altro prima di buttarlo giù.

            Besk si scusa due volte a voce rapida, e Corin si scusa con lei
            perché si sta scusando. Tenebra intanto si pulisce la lama sulla
            manica e aspetta il giro dopo.
          effetti: { ferite: 1 }
          segue: una-leggenda
      - testo: "Tenerli insieme a voce"
        immagine: personaggi/corin-ashdale
        descrizione: "Corin ha paura e Besk pensa troppo, mentre Tenebra fa da solo. Una squadra si tiene con gli ordini giusti al momento giusto."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Gli ordini
          testo: |
            Dai ordini corti a voce alta, e dopo il primo verme carogna anche
            Tenebra li segue. Corin smette di tremare quando gli dai un compito
            solo, coprire Besk, che lui esegue con un impegno commovente. Il
            cristallo vi cura, e quando escono i Camminatori della Salvaguardia
            la squadra si apre e si chiude intorno a loro al tuo grido.

            Dalla tribuna qualcuno ripete i tuoi ordini per gioco, e alla fine
            li ripete mezzo settore.
          segue: una-leggenda
        fallimento:
          titolo: Troppe voci
          testo: |
            Nel frastuono Corin non ti sente. Besk ti sente benissimo e discute
            ogni ordine, mentre Tenebra fa come gli pare. I vermi carogna vi
            passano fra le gambe. Il cristallo vi cura, poi i Camminatori della
            Salvaguardia vi dividono in due, e tu prendi i colpi destinati a
            Corin.

            Alla fine ne uscite in piedi tutti e quattro, ma tu hai la voce
            andata e una costola che scricchiola.
          effetti: { ferite: 1 }
          segue: una-leggenda
      - testo: "Lasciare il comando a Tenebra"
        immagine: personaggi/tenebra
        descrizione: "Ha portato giù nelle rovine più squadre di quante ne abbia l'Arena. Basta fare quello che dice."
        esito:
          titolo: Come nei tunnel
          testo: |
            Tenebra comanda come nei tunnel, quasi senza parlare. Tutti e tre
            gli obbedite. Funziona, ma lui vi tratta come Raschiatori, e ai
            Raschiatori tocca il lavoro peggiore. I vermi carogna li tieni
            lontani tu a pedate per un tratto, e il primo Camminatore della
            Salvaguardia lo fermi con la spalla.

            Quando il cristallo vi cura l'ultima volta, Tenebra ti batte una
            mano sulla schiena, come si fa con le reclute.
          effetti: { ferite: 1.5 }
          segue: una-leggenda

  # ------------------------------------------------------------ il terzo giro · una leggenda
  - id: una-leggenda
    immagine: bestiario/cinghiale-mutato-gigante
    titolo: Una leggenda
    tipo: seguito
    luogo: Arena di Qir-Azel, il quadrante
    area: quartieri-alti
    requisiti: [pista.arena == 2]
    testo: |
      Le luci dell'Arena si abbassano, e la folla smette di urlare e comincia a
      mormorare. «Un omaggio alla squadra di Liaren» dice Orazio, «la cui
      avventura termina qui.» Dagli spalti arrivano applausi e fischi insieme, e
      oltre la placca di metallo senti Borso che bestemmia.

      «E ora l'ultima prova.» La luce del cristallo vira al rossastro, e il
      cristallo comincia a vibrare con un suono storto che ti fa male ai denti.
      «NON UN MOSTRO» grida Orazio. Sugli spalti cala il silenzio. «NON UN UOMO.
      UNA LEGGENDA.»

      Dalla luce esce un cinghiale grande come un carro, con le setole
      grigio-azzurre sempre bagnate e lente vene d'argento che gli pulsano sotto
      la pelle. Dove posa gli zoccoli lascia sulla sabbia impronte larghe una
      spanna, e ai bordi la sua sagoma è un poco sfocata. *Un'eco non dovrebbe
      avere odore, e questa puzza di fango e di ferro.* Sugli spalti qualcuno
      urla di paura, e stavolta fa sul serio.

      Besk fa un passo indietro e poi lo rifà avanti. Il cristallo alle sue
      spalle ha una crepa luminosa che prima non c'era. Corin si è fatto bianco,
      e Tenebra, per la prima volta da quando lo conosci, parla prima di te.
      «Dimmi tu.»
    opzioni:
      - testo: "Guardarlo bene"
        descrizione: "Quelle setole le hai già viste, in una radura piena di carcasse."
        immagine: personaggi/corin-ashdale
        requisiti: [pista.corin >= 4]
        costo: 0
        esito:
          titolo: Il nostro cinghiale
          testo: |
            È il cinghiale della Foresta Strisciante, quello del banchetto al
            Grifone. Lo riconosci dalla spalla dove l'hai colpito, che nell'eco
            ha ancora la ferita, e dal modo in cui gira la testa verso destra
            prima di caricare.

            Corin lo ha riconosciuto anche lui. «Ma questo l'abbiamo mangiato»
            dice con un filo di voce, e poi, più piano, «con il vino rosso e le
            erbe.» Tenebra lo guarda di sbieco e non fa domande.
      - testo: "Affrontarlo"
        immagine: bestiario/cinghiale-mutato-gigante
        descrizione: "A giudicare dalle impronte, le zanne di quest'eco sono vere. La squadra ti copre come può."
        combattimento: una-leggenda
        vittoria:
          titolo: Schegge di luce
          testo: |
            La bestia carica e tu la aspetti, con Tenebra a un passo e Besk che
            le brucia gli occhi. La colpisci dietro la spalla dove il pelo è più
            rado, finché la bestia crolla e si sfa in una pioggia di schegge
            pallide. Le barriere fra i quadranti esplodono in scintille bianche.

            Gli Scuri sono a pezzi, con Mauro che ansima appoggiato all'ascia e
            ti fissa senza dire niente. La squadra di Galdrick invece è
            intatta, e lo sceriffo ti fa un cenno breve. Poi i cristalli mandano
            un ultimo lampo che ti entra nella pelle, e ti senti come dopo una
            notte di sonno.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1, racconto: 1 }
        sconfitta:
          titolo: La squadra regge
          testo: |
            La bestia ti travolge alla prima carica, e da terra vedi Corin
            mettersi in mezzo con la spada e volare contro la placca. Tenebra e
            Besk la reggono finché tu ti rialzi, e la finite insieme, in
            quattro, quando il cristallo ha già quasi smesso di brillare.

            Le barriere esplodono in scintille bianche. Gli Scuri sono a pezzi.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli ti rimette in piedi, ma a
            Corin non chiude del tutto il taglio sulla fronte, e lui se lo
            tampona col fazzoletto ricamato.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1 }
      - testo: "Sovraccaricare il cristallo con Besk"
        immagine: personaggi/besk-dravec
        descrizione: "La crepa nel cristallo si allarga a ogni carica. Se Besk ci spinge dentro abbastanza Mana, l'eco perde il filo che la tiene in piedi."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: La crepa
          testo: |
            Metti le mani sul cristallo accanto a quelle di Besk e spingete
            insieme. Tenebra e Corin intanto tengono la bestia lontana. La crepa
            corre dalla base alla punta, e il cinghiale si ferma a metà carica e
            si sfa in schegge pallide. Le barriere fra i quadranti esplodono in
            scintille bianche.

            Gli Scuri sono a pezzi, con Mauro che ansima appoggiato all'ascia.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli vale una notte di sonno, e
            Besk lo prende a occhi chiusi, sorridendo al cristallo come a un
            compito venuto bene.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Il cristallo risponde
          testo: |
            Il cristallo ti restituisce il Mana tutto insieme e ti scaraventa
            sulla sabbia, e Besk cade accanto a te. La bestia la tengono Tenebra
            e Corin finché vi rialzate, e Corin ci rimette una spalla. Alla fine
            la crepa si allarga lo stesso e l'eco si sfa.

            Le barriere esplodono in scintille bianche. Gli Scuri sono a pezzi.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli ti rimette in piedi, ma
            le mani che hai tenuto sul cristallo restano rosse e gonfie, e il
            ronzio nelle orecchie non se ne va.
          effetti: { ferite: 1.5, tormento: 0.5, pista.arena: 1 }
      - testo: "Leggere la bestia"
        descrizione: "Un'eco ripete quello che la bestia faceva da viva. Se capisci come cacciava, sai dove sarà."
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Difficile }
        successo:
          titolo: La maschera della Marea
          testo: |
            Guardi come muove la testa e capisci che le vene d'argento sono una
            maschera della Marea, cucita sopra una bestia che di suo aveva paura
            del rumore. Fai battere a Corin la spada sulla placca, e a ogni
            colpo il cinghiale scarta a destra e ti offre il fianco. Al terzo
            scarto Tenebra lo apre, e la bestia si sfa in schegge pallide.

            Le barriere esplodono in scintille bianche. Gli Scuri sono a pezzi.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli vale una notte di sonno.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Il fianco sbagliato
          testo: |
            Ti metti dove dovrebbe scartare, e la bestia scarta dall'altra
            parte. La zanna ti apre la coscia. Tenebra e Besk la reggono mentre
            Corin ti trascina via per il colletto, e la finite in quattro, a
            fatica.

            Le barriere esplodono in scintille bianche. Gli Scuri sono a pezzi.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli ti chiude la pelle della
            coscia, ma sotto la zanna è arrivata fino all'osso, e quando provi a
            camminare la gamba non ne vuole sapere.
          effetti: { ferite: 2, pista.arena: 1 }
      - testo: "Farti coprire le spalle dalla squadra"
        descrizione: "Tre persone che conosci appena. Se si fidano di te abbastanza da restare ferme quando carica, basta uno solo a colpire."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: Fermi
          testo: |
            Dici a ognuno dove stare e perché, e loro restano fermi anche quando
            la bestia carica dritta su Corin, che tiene la spada alta con gli
            occhi chiusi. All'ultimo Tenebra la devia con la spalla, Besk le
            brucia il muso, e tu sei già sul fianco. L'eco si sfa in schegge
            pallide.

            Le barriere esplodono in scintille bianche. Gli Scuri sono a pezzi.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli vale una notte di sonno, e
            Corin non smette più di ridere.
          effetti: { ferite: -1, tormento: -0.5, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Uno si muove
          testo: |
            Corin scappa un passo di lato quando la bestia carica, e il
            cinghiale passa dove non doveva. Ti prende in pieno. La finite in
            tre, con Corin seduto per terra, quando hai già il sangue in bocca.

            Le barriere esplodono in scintille bianche. Gli Scuri sono a pezzi.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli ti rimette in piedi, ma
            due costole restano dove le ha lasciate la bestia, e Corin ti chiede
            scusa fino a sera.
          effetti: { ferite: 2, pista.arena: 1 }
      - testo: "Scacciare l'eco con l'esorcismo"
        descrizione: "Le parole della Liturgia dell'Albero valgono per ciò che non dovrebbe restare. Un'eco è fatta apposta per non restare."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Le parole dell'Albero
          testo: |
            Dici le parole della Liturgia mentre la bestia ti carica, e a ogni
            parola le vene d'argento si spengono una alla volta. Arriva a tre
            passi da te ridotta a una sagoma di luce grigia, e lì si sfa.

            Le barriere esplodono in scintille bianche. Gli Scuri sono a pezzi.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli vale una notte di sonno.
            In tribuna qualche novizio del Velo si fa il segno, e Besk ti guarda
            in un modo nuovo.
          effetti: { ferite: -1, tormento: -0.5, rep.velo: 0.5, pista.arena: 1, racconto: 1 }
        fallimento:
          titolo: Le parole a metà
          testo: |
            Ti si inceppa la voce a metà della Liturgia, e le parole che non hai
            finito ti tornano in testa storte, con il grugnito della bestia sotto.
            Poi la bestia ti è addosso. Tenebra ti tira via per la cintura, e la
            finite in quattro, alla vecchia maniera, con il sangue di tutti
            sulla sabbia.

            Le barriere esplodono in scintille bianche. Gli Scuri sono a pezzi.
            La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un
            cenno breve. L'ultimo lampo dei cristalli ti rimette in piedi, e la
            spalla dove ti ha preso la zanna resta livida e dura.
          effetti: { ferite: 1.5, tormento: 0.5, pista.arena: 1 }

  # ------------------------------------------------------------ 3 → 4 · l'ora dei gladiatori
  - id: l-ora-dei-gladiatori
    presso: arena-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: L'ora dei gladiatori
    sommario: "Un'ora prima della finale, nella camera dei combattenti. Le squadre eliminate sono ancora lì, e quella di Galdrick anche."
    luogo: Arena di Qir-Azel, la camera dei combattenti
    area: quartieri-alti
    requisiti: [pista.arena == 3]
    testo: |
      Nella camera dei combattenti l'acqua dei catini è diventata rosa, e un
      inserviente la cambia di continuo senza che nessuno glielo chieda. Dalle
      grate arriva il rumore della folla che aspetta la finale. Orvald ha fatto
      sapere che si torna in campo fra un'ora, e ha mandato Pett a dirlo, perché
      lui ha da fare con i registri.

      La squadra di Liaren occupa le panche a sinistra. Liaren accorda il
      samisen con un labbro spaccato, Ettore Castaldi beve da una fiaschetta
      quando crede che nessuno lo veda, e Borso dorme seduto. Gli Scuri si sono
      presi l'angolo più buio. Mauro Scrocco è seduto su due sgabelli e ti
      guarda come si guarda un debito, contando. *Quello i conti li tiene a
      memoria.* Vicino alle armerie la squadra di Galdrick si prepara in
      silenzio.

      Besk ripassa le formule sul quaderno muovendo le labbra. Corin ha tirato
      fuori un pettine. Tenebra si è seduto contro il muro, con la lama sulle
      ginocchia, e guarda Dragna Gro-Malog dall'altra parte della sala.
    opzioni:
      - testo: "Andare da Liaren e dai suoi"
        immagine: personaggi/liaren-tarvelin
        descrizione: "Sono usciti fra gli applausi e i fischi, e Liaren non ha ancora deciso quale dei due tenersi."
        costo: 0
        esito:
          titolo: Un omaggio
          testo: |
            Liaren ti fa posto sulla panca. «Un omaggio alla squadra di Liaren»
            dice, imitando Orazio con la voce un'ottava sopra. «Quell'uomo mi ha
            fatto il funerale davanti a tutta la città, e non vedeva l'ora.»
            Dolovan Stroud si sta fasciando una mano e dice che non combatteva
            da anni e che adesso si ricorda perché.

            Ettore Castaldi ti offre la fiaschetta e poi la ritira, perché si
            ricorda che devi combattere. Borso apre un occhio e ti dice che la
            prossima volta i crani da fracassare li sceglie lui.
      - testo: "Andare dagli Scuri"
        immagine: personaggi/mauro-scrocco
        descrizione: "Sono usciti in barella, quasi tutti. Mauro però è ancora in piedi, almeno lui."
        costo: 0
        esito:
          titolo: Il conto
          testo: |
            Durgan si fa ricucire il sopracciglio da Rozalia, che ci mette un
            impegno cattivo. Nihali tossisce piegato in due e sputa nero sulla
            sabbia dei catini. Mauro non si alza. Ti squadra dalle
            ginocchia agli occhi, e poi apre le braccia come per abbracciarti,
            restando seduto.

            «Bella leggenda, la tua» dice, con l'alito che arriva prima della
            voce. «La nostra era più grossa. Alla Pignatta si parla di tutto e
            si dice niente, lo sai. Però di te, da stasera, se ne parlerà.» Lo
            dice sorridendo, e intanto stringe il manico dell'ascia finché le
            nocche gli diventano bianche.
      - testo: "Andare da Galdrick e dai suoi"
        immagine: personaggi/toren-galdrick
        descrizione: "Lo sceriffo ha vinto la Mischia, e ti fa segno di avvicinarti."
        requisiti: [mischia == 2]
        costo: 0
        esito:
          titolo: La folla ti vuole
          testo: |
            Galdrick si sta facendo stringere le cinghie dell'armatura da
            Ottilia Sanvel, che non dice una parola e non sbaglia un buco.
            «Nella Mischia ti ho battuto io» dice con i pollici nella cintura,
            «ma la folla gridava il tuo nome. Mi sono offeso un poco, poi ci ho
            pensato, e alla città serve proprio questo.»

            Ilvaena Sorathe controlla le frecce una per una. Dragna ti guarda
            dagli stivali in su e chiede a Tenebra, a voce alta, se si è messo a
            fare il gladiatore per vederla perdere. Tenebra non risponde, e lei
            ride con la voce roca.
      - testo: "Andare da Galdrick e dai suoi"
        immagine: personaggi/toren-galdrick
        descrizione: "Lo sceriffo è uscito dalla Mischia per mano di Borso e Durgan, e ci ha già riso sopra."
        requisiti: [mischia == 1]
        costo: 0
        esito:
          titolo: Il bavero di Borso
          testo: |
            Galdrick si sta facendo stringere le cinghie dell'armatura da
            Ottilia Sanvel, che non dice una parola e non sbaglia un buco.
            «Borso e il nano insieme» dice con i pollici nella cintura. «Uno lo
            pago io e l'altro lo paga Vesh, e per una volta erano d'accordo.»
            Ride, poi ti guarda il fermaglio. «Orvald quello non lo dà a
            nessuno. Tienilo da conto.»

            Ilvaena Sorathe controlla le frecce una per una. Dragna ti guarda
            dagli stivali in su e chiede a Tenebra, a voce alta, se si è messo a
            fare il gladiatore per vederla perdere. Tenebra non risponde, e lei
            ride con la voce roca.
      - testo: "Tornare in campo"
        descrizione: "Pett è tornato sul banco di Orvald. L'ora è passata."
        esito:
          titolo: Il corridoio
          testo: |
            Pett gracchia una volta sola, e Orvald alza la testa dal registro.
            Besk chiude il quaderno, Corin si rimette il pettine nel taschino, e
            Tenebra si alza dal muro senza appoggiarsi. Mentre percorri il
            corridoio scavato nella roccia l'aria si fa più calda, e il rumore
            della folla ti arriva nello sterno prima che nelle orecchie.
          effetti: { pista.arena: 1 }

  # ------------------------------------------------------------ 4 → 5 · lo scontro delle ere
  - id: lo-scontro-delle-ere
    presso: arena-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: Lo scontro delle ere
    sommario: "La finale. Da una parte c'è la tua squadra e dall'altra quella di Galdrick, con in mezzo un camminamento sopra l'acqua scura."
    luogo: Arena di Qir-Azel, la finale
    area: quartieri-alti
    requisiti: [pista.arena == 4]
    testo: |
      Il corridoio si apre sull'Arena, e gli spalti sono pieni fino all'ultima
      fila. Il terreno è cambiato ancora. Ci sono camminamenti in muratura sopra
      pozze d'acqua scura, piloni di cristallo che mandano una luce innaturale
      e, al centro, un pilone più grosso degli altri. Nelle pozze si muove
      qualcosa di lungo e color piombo, e un inserviente ci butta dentro le
      frattaglie del mercato con un secchio.

      La piattaforma su cui ti hanno fatto salire si solleva con un clangore
      fino al camminamento centrale, e dall'altra parte sale quella di Galdrick.
      Lo sceriffo è in armatura scura e mantello nero, e Dragna gli sta accanto
      piantata come una torre di ferro. Ilvaena Sorathe guarda l'arena con
      calma, e Ottilia Sanvel tiene le mani rilassate lungo i fianchi.

      Orazio avanza sul palco degli spalti. «Avete visto cadere bestie che
      avrebbero spezzato interi eserciti!» Si volta verso di te, legge il tuo
      nome da un cartoncino e lo grida, e la folla lo ripete. «Dall'altra parte,
      i migliori che questa città abbia mai forgiato, capeggiati dal nostro
      sceriffo e protettore Toren Galdrick!» Alza una mano, e cala il silenzio.
      «CHE LO SCONTRO DELLE ERE ABBIA INIZIO!»

      Tenebra va dritto su Dragna. Besk e Corin si prendono Ilvaena e Ottilia,
      come possono. Sul camminamento centrale restate tu e Galdrick, che ti
      saluta alzando la lama.
    opzioni:
      - testo: "Affrontare Galdrick"
        immagine: personaggi/toren-galdrick
        descrizione: "Para con il piatto della lama e aspetta che sia tu a sbagliare. Ha combattuto più di te, e lo sa."
        combattimento: lo-scontro-delle-ere
        vittoria:
          titolo: Campione di Qir-Azel
          testo: |
            Galdrick para tutto quello che gli dai, finché non gli dai più
            niente da parare e aspetti tu. Quando finalmente attacca lo prendi
            sotto la guardia, e lo sceriffo si siede sul camminamento con la
            lama di traverso sulle ginocchia. Dall'altra parte Tenebra ha appena
            visto Ferro andare giù, e se lo gode in silenzio.

            Galdrick si rialza da solo e ti alza il braccio verso la tribuna
            prima che lo faccia Orazio. Orvald ti allaccia in vita una cintura
            di cuoio rosso con la fibbia d'alloro, e ti mette in mano la borsa
            del campione. Il giorno dopo uno scalpellino incide il tuo nome nella
            pietra, sotto quelli dei campioni di cent'anni fa.
          imposta: { campione: 1 }
          effetti: { oggetto.cintura-del-campione: 1, monete: 100, pista.arena: 1, rep.caserma: 0.5, racconto: 1 }
        sconfitta:
          titolo: Secondo, in piedi
          testo: |
            Galdrick aspetta che sbagli, e alla fine sbagli. Il piatto della sua
            lama ti prende al polso, e il resto lo fa il camminamento bagnato.
            Finisci in ginocchio sull'orlo della pozza, con quella cosa color
            piombo che ti passa sotto il naso. Dall'altra parte la tua squadra
            cede un pezzo alla volta.

            La folla però è in piedi, e grida il tuo nome insieme al suo.
            Galdrick ti tende la mano per rialzarti e non te la lascia finché
            Orazio non ha finito di parlare. «Ti ho battuto di un soffio» ti
            dice all'orecchio. «La prossima volta te lo ricordo io.» Orvald ti
            conta il premio del secondo.
          effetti: { monete: 40, pista.arena: 1 }
      - testo: "Prendere il pilone centrale"
        descrizione: "Chi sta vicino al pilone grosso combatte meglio. Se capisci come si accende prima di lui, l'Arena combatte dalla tua parte."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Chi capisce l'arena
          testo: |
            Il pilone si accende quando qualcuno ci posa la mano piatta su una
            delle placche d'ottone, e lo capisci guardando Ottilia che ci prova.
            Ci arrivi un passo prima di Galdrick. La luce ti entra nelle
            braccia, e per un po' la lama ti pesa la metà. Lo sceriffo si siede
            sul camminamento con una risata corta.

            «Vince chi capisce l'arena» dice, quando si rialza, ed è Orvald dal
            banco a ripeterlo forte. Ti allacciano in vita la cintura con la
            fibbia d'alloro, e ti consegnano la borsa del vincitore. Il giorno dopo il tuo
            nome viene inciso nella pietra.
          imposta: { campione: 1 }
          effetti: { oggetto.cintura-del-campione: 1, monete: 100, pista.arena: 1, rep.caserma: 0.5, racconto: 1 }
        fallimento:
          titolo: La placca giusta
          testo: |
            Tocchi la placca sbagliata, e il pilone ti scarica nel braccio un
            colpo che te lo lascia appeso e insensibile fino alla spalla.
            Galdrick invece tocca quella giusta e
            ci tiene sopra la mano. Il resto dura poco, e finisci sulla schiena
            con la sua lama piatta sullo sterno.

            La folla grida il tuo nome lo stesso. Galdrick ti rialza e ti tiene
            la mano finché Orazio non ha finito. «Hai capito l'arena un momento
            dopo di me» ti dice all'orecchio mentre la folla applaude. «La
            prossima volta la placca giusta la tocchi tu.» Orvald ti porge la
            borsa del secondo.
          effetti: { monete: 40, ferite: 2, pista.arena: 1 }
      - testo: "Far cadere la piattaforma"
        descrizione: "La piattaforma di Galdrick è agganciata al camminamento da un perno solo. Senza terreno sotto i piedi, a Galdrick resta solo l'acqua."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: L'acqua scura
          testo: |
            Ti butti sul perno con tutto il peso, e la piattaforma si sgancia
            con un colpo secco. Galdrick fa due passi di corsa sul legno che si
            inclina e salta, ma atterra sull'orlo del camminamento, dove ci sei
            tu. Lo spingi con la spalla, e lo sceriffo finisce nell'acqua scura
            fino alla cintura. Ne esce a bracciate prima che arrivi la cosa
            color piombo, sputando acqua per il gran ridere.

            Ti allacciano in vita la cintura con la fibbia d'alloro e ti
            contano il premio del torneo. Il giorno dopo Galdrick passa a vedere lo scalpellino
            che incide il tuo nome, e gli lascia una mancia.
          imposta: { campione: 1 }
          effetti: { oggetto.cintura-del-campione: 1, monete: 100, pista.arena: 1, rep.caserma: 0.5, racconto: 1 }
        fallimento:
          titolo: In acqua
          testo: |
            Il perno cede, ma dalla parte sbagliata, e nell'acqua scura ci
            finisci tu. Qualcosa di lungo ti sfiora la gamba e poi ti morde il
            polpaccio attraverso lo stivale, e ti tira giù finché un inserviente
            non lo colpisce con l'asta. Quando risali sul camminamento la tua
            squadra ha già perso,
            e Galdrick ti aspetta con la mano tesa.

            La folla grida il tuo nome lo stesso. «Ce l'avevi quasi fatta» dice
            lo sceriffo, e lo dice sul serio. Orvald ti conta il premio del
            secondo, e ti presta un panno per asciugarti.
          effetti: { monete: 40, ferite: 2.5, pista.arena: 1 }
      - testo: "Giocarti la folla e la stanchezza di Galdrick"
        descrizione: "Lo sceriffo ha già fatto la Mischia e tre giri di bestie, e non è più un ragazzo. Cinquemila persone lo stanno guardando respirare."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Difficile }
        successo:
          titolo: L'ultimo respiro
          testo: |
            Lo fai correre per tutto il camminamento. Ogni volta che lui alza la
            lama tu indietreggi e chiami la tribuna, e la tribuna ti risponde.
            Dopo un po' Galdrick respira con la bocca aperta, e la guardia gli
            scende di un palmo. Ci entri con tutto il peso che ti resta. Lo
            sceriffo abbassa la lama da solo e ti tende la mano.

            «Mi hai fatto vecchio davanti a tutta la città» ti dice, «e hai
            fatto bene.» Ti alza il braccio verso la tribuna. Orvald ti allaccia
            in vita la cintura con la fibbia d'alloro e ti conta il premio, e
            il giorno dopo il tuo nome è inciso nella pietra.
          imposta: { campione: 1 }
          effetti: { oggetto.cintura-del-campione: 1, monete: 100, pista.arena: 1, rep.caserma: 0.5, racconto: 1 }
        fallimento:
          titolo: Il fiato dello sceriffo
          testo: |
            Lo fai correre, ma il fiato finisce prima a te. Galdrick ha passato
            la vita a inseguire gente nei vicoli della Città Bassa, e quando ti
            fermi è ancora lì. Il piatto della sua lama ti cala sulla spalla e
            poi sul fianco, e ti mette in ginocchio senza più fiato per
            rialzarti da solo.

            La folla grida il tuo nome lo stesso. Galdrick ti alza il braccio
            insieme al suo, cosa che Orazio non aveva previsto. Orvald ti
            consegna la borsa del secondo.
          effetti: { monete: 40, ferite: 2, pista.arena: 1 }

  # ------------------------------------------------------------ dopo la pista · le giornate all'Arena
  - id: una-giornata-all-arena
    presso: arena-di-qir-azel
    immagine: ambientazione/cristalli-conduttori
    titolo: Una giornata all'Arena
    sommario: "Incontri d'esibizione e scommesse davanti a un pubblico che si ricorda di te."
    luogo: Arena di Qir-Azel, un pomeriggio qualunque
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.arena >= 5]
    testo: |
      Dopo il torneo l'Arena non ha più chiuso. Il pomeriggio ci sono incontri
      d'esibizione per chi paga la gradinata, e sotto le scalinate un
      allibratore con la penna dietro l'orecchio raccoglie le puntate su una
      lavagna. Qualcuno ha corretto a gesso la quota del tuo nome, e poi l'ha
      corretta ancora.

      Orvald tiene il banco delle iscrizioni anche nei giorni normali, perché
      dice che i registri non si scrivono da soli. Pett dorme con la testa sotto
      l'ala. Sulle panche della camera dei combattenti aspettano due mercenari
      di passaggio, che hanno visto la finale dalla tribuna e adesso fingono di
      non riconoscerti.
    opzioni:
      - testo: "Combattere un incontro d'esibizione"
        immagine: ambientazione/cristalli-conduttori
        descrizione: "Due mercenari contro di te, davanti a una tribuna mezza piena. La borsa è piccola, il pubblico no."
        combattimento: una-giornata-all-arena
        vittoria:
          titolo: La borsa
          testo: |
            I due mercenari si danno coraggio a vicenda battendo le spade sugli
            scudi, e il primo ti viene addosso troppo presto. Va giù alla
            seconda parata. L'altro alza le mani prima ancora che tu lo tocchi,
            e la tribuna batte i piedi sulle gradinate finché la polvere scende
            dalle travi della camera dei combattenti. Orvald ti conta la borsa
            sul banco e la segna sul registro con la sua grafia piccola, accanto
            al tuo nome, che ormai scrive senza guardare.
          effetti: { monete: 20 }
        sconfitta:
          titolo: Una giornata storta
          testo: |
            Il primo mercenario lo butti giù in fretta. Mentre ti volti a
            salutare la tribuna il secondo ti prende al ginocchio con il bordo
            dello scudo, e finisci con la faccia nella sabbia davanti a
            cinquecento persone che ridono. Orvald ti dà comunque qualche
            moneta per il disturbo. Dice che il pubblico paga anche per vedere un
            campione che inciampa, e che oggi ha avuto quello che voleva.
          effetti: { monete: 5 }
      - testo: "Fare spettacolo con un mercenario"
        descrizione: "Un incontro concordato, con i colpi tirati a vuoto e le cadute studiate. Al pubblico va benissimo, se è fatto bene."
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: Il colpo tirato a vuoto
          testo: |
            Il mercenario conosce il mestiere, e prima di entrare ti spiega in
            un sussurro dove cadrà. Le spade passano a un dito dai nasi. Lui
            cade una volta di schiena e una volta in ginocchio, con un lamento
            che si sente fino alle ultime file, e alla terza caduta la tribuna
            ride e applaude. Orvald vi divide la borsa sul banco, e sul registro
            scrive *esibizione* con un punto interrogativo.
          effetti: { monete: 12 }
        fallimento:
          titolo: Fischi
          testo: |
            Il mercenario sbaglia il tempo di una caduta, e tu sbagli quello
            della tua. Per un momento restate in piedi a guardarvi, poi lui cade
            lo stesso in ritardo. La tribuna se ne accorge e fischia, e a te
            resta un livido vero dove il colpo doveva essere finto. Orvald ti
            dà qualche spicciolo e la sua opinione sull'arte drammatica, che parte da
            Orazio Belcanto e ci mette un pezzo ad arrivare a te.
          effetti: { monete: 3, ferite: 0.5 }
      - testo: "Scommettere su un incontro"
        descrizione: "Dalla tribuna si vede chi zoppica e chi ha dormito poco. L'allibratore forse non se ne accorge."
        requisiti: [monete >= 10]
        prova: { attributo: mentale, abilita: [percezione, medicina], difficolta: Media }
        successo:
          titolo: Il ginocchio sinistro
          testo: |
            Dalla gradinata guardi i due che si scaldano. Il favorito tiene il
            peso sul ginocchio destro e lo fa un po' troppo, e ogni tanto si
            tocca il sinistro senza accorgersene. Punti qualche moneta
            sull'altro, che l'allibratore ti dà a una quota generosa. Al terzo assalto il
            favorito si piega su quel ginocchio, e l'allibratore ti conta la
            vincita guardandoti storto, come se fosse colpa tua.
          effetti: { monete: 15 }
        fallimento:
          titolo: La quota giusta
          testo: |
            Ti sembra che il favorito zoppichi, e punti una bella somma sull'altro.
            Il favorito invece cammina così da quando è nato, e al primo assalto
            manda l'avversario contro le griglie. L'allibratore cancella la tua
            puntata dalla lavagna con il palmo della mano, si pulisce il gesso
            sui calzoni e ti ringrazia per la fiducia.
          effetti: { monete: -10 }

  # ------------------------------------------------------------ dopo la pista · la rivincita
  - id: la-rivincita
    presso: arena-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: La rivincita
    sommario: "Il titolo di Campione l'ha preso Galdrick. Lo sceriffo si allena all'Arena certi pomeriggi, e una sfida non l'ha mai rifiutata."
    luogo: Arena di Qir-Azel, il camminamento centrale
    area: quartieri-alti
    requisiti: [pista.arena >= 5, campione == 0]
    testo: |
      Certi pomeriggi Galdrick viene all'Arena a tirare di scherma con le
      reclute della Guardia, in maniche di camicia, con il taccuino lasciato sul
      banco di Orvald perché nessuno ci metta le mani. Lo trovi sul camminamento
      centrale, sopra l'acqua scura, mentre corregge la guardia a un ragazzo che
      la tiene troppo alta.

      Quando ti vede manda via la recluta con una pacca e infila i pollici nella
      cintura. Sotto la camicia si vede la fibbia d'alloro della cintura del
      campione. «Sapevo che saresti venuto» dice. «Qui alla rivincita si ha
      diritto, e a me un campione che si fa sfidare piace più di uno che si fa
      guardare. Orvald!» Dal banco Orvald alza la mano senza voltarsi, e Pett
      apre un occhio.
    opzioni:
      - testo: "Sfidarlo a duello"
        immagine: personaggi/toren-galdrick
        descrizione: "Lo sceriffo da solo, sul camminamento. Nessuna squadra stavolta, e nessun pilone acceso."
        combattimento: il-duello-con-galdrick
        vittoria:
          titolo: Il titolo
          testo: |
            Per un pezzo è come in finale. Lui para con il piatto della lama e
            aspetta, e tu non gli dai niente. Poi stavolta sbaglia lui, di un
            mezzo passo, e tu sei pronto. Galdrick si trova la tua lama sotto il
            mento e la guarda con interesse. Poi ride, si slaccia la cintura del
            campione e te la mette in mano. «Me la sono goduta abbastanza» dice.
            Il giorno dopo uno scalpellino aggiunge il tuo nome nella pietra,
            sotto il suo.
          imposta: { campione: 1 }
          effetti: { oggetto.cintura-del-campione: 1, monete: 50, racconto: 1 }
        sconfitta:
          titolo: Un'altra volta
          testo: |
            Galdrick ti aspetta per un pezzo senza attaccare mai, finché sei tu
            a stancarti di aspettare. Il piatto della sua lama ti prende alla
            spalla e ti mette in ginocchio sul camminamento, senza cattiveria.
            Lo sceriffo ti tende la mano e ti tira su con uno strattone. «Il
            camminamento è sempre qui, e io ci vengo il martedì» dice, mentre
            dal banco Orvald scrive una riga sul registro.
          effetti: { tormento: 0.5 }
      - testo: "Leggere la sua guardia"
        descrizione: "Para con il piatto e aspetta. Come tutti ha un'abitudine, che col tempo gli apre un varco nella guardia."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Difficile }
        successo:
          titolo: Il varco
          testo: |
            Lo lasci attaccare per un pezzo e ti limiti a guardarlo. Dopo ogni
            parata abbassa il gomito destro di un dito per riprendere fiato, ed
            è un'abitudine vecchia, da uomo che ha passato la vita a parare. Al
            terzo gomito ci entri. Galdrick si trova la tua lama sotto il mento
            e scuote la testa ridendo, poi si slaccia la cintura del campione e
            te la mette in mano. Il giorno dopo il tuo nome viene inciso nella
            pietra.
          imposta: { campione: 1 }
          effetti: { oggetto.cintura-del-campione: 1, monete: 50, racconto: 1 }
        fallimento:
          titolo: Il gomito
          testo: |
            Ti sembra di vedere il varco dopo una parata, e ci entri. Il varco
            te l'ha aperto lui apposta, e il piatto della sua lama ti prende al
            polso. La tua arma finisce nell'acqua scura, e tocca a un
            inserviente ripescarla con un uncino mentre la cosa color piombo gli
            gira intorno. Il secondo colpo di piatto ti arriva sulle costole
            mentre guardi l'acqua, e ti piega in due. Galdrick ti aspetta con la
            mano tesa e ti dice di tornare quando vuoi, che il martedì lui c'è
            sempre.
          effetti: { ferite: 2 }
      - testo: "Stancarlo"
        descrizione: "Non è più un ragazzo, e ha mezza giornata di reclute nelle braccia. Basta resistere più di lui."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Il fiato lungo
          testo: |
            Per tutto il pomeriggio non attacchi quasi mai. Lo fai girare sul
            camminamento da una piattaforma all'altra, lungo le scale di pietra
            che salgono e scendono, finché il sole scende sotto gli spalti e le
            reclute si siedono a guardare. Alla fine Galdrick abbassa la lama da
            solo, con la camicia fradicia incollata alla schiena, e si slaccia
            la cintura del campione. «Prendila, prima che mi passi la voglia di
            dartela» dice, e te la porge con tutte e due le mani. Il giorno dopo
            il tuo nome viene inciso nella pietra.
          imposta: { campione: 1 }
          effetti: { oggetto.cintura-del-campione: 1, monete: 50, racconto: 1 }
        fallimento:
          titolo: Le gambe
          testo: |
            Lo fai girare sul camminamento finché le reclute si siedono a
            guardare, ma il fiato finisce prima a te. Galdrick ha passato
            trent'anni a inseguire ladri su per le scale della Città Bassa. Ti
            mette giù con un colpo di piatto quando le gambe ti hanno già
            tradito, e cadendo batti il ginocchio sullo spigolo di un gradino.
            Poi ti offre la sua fiaschetta d'acqua e ti dice che il martedì lui
            è sempre qui.
          effetti: { ferite: 2 }
