  # ------------------------------------------------------------ 1 → 2 · la Grande Mischia, dopo Vesh (pista.pelle >= 7)
  - id: la-grande-mischia-dopo-vesh
    presso: arena-di-qir-azel
    immagine: personaggi/orazio-belcanto
    titolo: La Grande Mischia
    sommario: "Dodici combattenti dentro un recinto che brucia chi lo tocca, e uno solo ci resterà dentro in piedi."
    luogo: Arena di Qir-Azel, il recinto ovale
    area: quartieri-alti
    requisiti: [pista.arena == 1, pista.pelle >= 7]
    testo: |
      I cristalli della cintura si accendono tutti insieme, e un'onda di
      vibrazione attraversa la sabbia e ti sale nelle caviglie. Su una sporgenza
      della tribuna Orazio Belcanto, con le piume sul cappello e una giacca che
      manda lampi, allarga le braccia inanellate. «Popolo di Qir-Azel, cittadini
      della Città Alta e della Città Bassa! Oggi l'Arena non chiede spettatori.
      Vuole volontà e sangue, e vuole sapere un nome. Che abbiano inizio le Tre
      Prove!»

      Le griglie ai bordi si sollevano dal suolo, e il recinto ovale si accende
      di un verde acido che ti fa lacrimare. Orazio scandisce le parole una alla
      volta, godendosele. «Dodici combattenti entrano. Uno solo resterà dentro
      il recinto quando la linea si spegne.»

      Galdrick saluta la tribuna con due dita, in armatura scura. Ogni tanto si
      tocca il fianco dove la sciabola di Vesh l'ha aperto.

      {medicina Media} Si tocca il fianco quando crede che nessuno lo guardi.
      La ferita è chiusa, ma il muscolo sotto non ha ancora deciso di fidarsi,
      e lui ruoterà il busto mezzo palmo più corto del solito.

      Bram Halgast, a torso nudo come se fosse alla forgia, si batte sul palmo
      un martello da fabbro e racconta a chiunque sia a portata d'orecchio
      quanto costano le sue spade. Dragna Gro-Malog ha l'ascia già in mano, e
      il più grosso dei mercenari di Ghoran suda nella cotta di maglia prima
      ancora di cominciare. Il nano con le cicatrici si chiama Durgan e non ha
      detto una parola da stamattina. Fra gli altri c'è un mercenario di
      passaggio con lo scudo dipinto di fresco, che ogni tanto guarda la
      tribuna per vedere se sua madre è arrivata.

      {armi-da-mischia Media} Un martello da fabbro è pesante in testa e
      lento a tornare. Se Bram lo manca una volta, ha un fianco intero
      scoperto finché non riesce a rialzarlo.

      {origine fuggiasco-di-ghoran} Il mercenario di Ghoran porta la cotta
      come la portavano i sorveglianti dei recinti, slacciata sul fianco per
      il caldo. Le spalle ti si chiudono da sole, e devi aprirle a forza
      mentre lui guarda da tutt'altra parte.

      {origine apprendista-raschiatore} Dragna Gro-Malog tiene l'ascia come
      al Grifone tiene la penna dei turni, stretta fra le dita. Se fra un
      momento te la trovi davanti, non le racconterai una storia lunga.

      {resistenza Facile fallita} Hai la gola secca da prima di entrare, e
      la sabbia calda ti passa attraverso le suole. Il corpo vorrebbe
      soltanto un secchio d'acqua e un'ombra, e te lo dice proprio adesso.

      «GUERRIERI DELLA GRANDE MISCHIA!» grida Orazio. «COMINCIATE!»
    opzioni:
      - testo: "Buttarti nella mischia"
        immagine: ambientazione/cristalli-conduttori
        descrizione: "Undici avversari, e tutti contro di te appena si accorgono che sei ancora in piedi."
        combattimento: la-grande-mischia
        vittoria:
          titolo: L'ultimo in piedi
          testo: |
            Dragna e il mercenario di Ghoran si cercano subito, e finiscono
            fuori dal recinto avvinghiati. Galdrick ne butta giù tre prima che
            Bram e Durgan gli vengano addosso insieme e lo spingano oltre la
            linea verde, e lo sceriffo, cadendo, si porta dietro il fabbro per
            la cintura. Poi Durgan si volta verso di te, con il mercenario dallo
            scudo dipinto. Il mercenario va giù per primo. Il nano ti costa una
            spalla che non senti più e un labbro spaccato, finché non scivola sulla sabbia
            e la sua ascia ti passa a un dito dall'orecchio. Il fischio della
            lama te lo porterai dietro per qualche notte.

            Orvald ti mette in mano un fermaglio d'argento intrecciato. «Questo
            non è roba da bancarella» dice, mentre la tribuna urla il tuo nome.

            {espressivita Media} Lo urlano storpiato, e metà della tribuna non
            sa nemmeno chi sei. Oggi però è tuo lo stesso.
          imposta: { mischia: 1 }
          effetti: { oggetto.fermaglio-di-orvald: 1, pista.arena: 1, racconto: 1 }
        sconfitta:
          titolo: Il favorito
          testo: |
            Durgan ti prende di piatto con il manico dell'ascia, e ti ritrovi in
            ginocchio con la schiena a un palmo dalla linea verde. Il calore del
