# Capomozzo, il livello II (pista.capomozzo 4 → 6): le rovine dei Precursori sotto la fortezza, Aurenne sul
# ponte di osservazione, la prigione del Costruttore e la scena delle Maschere.
#
# - `di-nuovo-verso-capomozzo` (pista 4, ripetibile, Scuderie della Zanna Rotta): il rientro dopo una ritirata.
#   Sta in città perché la ritirata riporta in Città Bassa e da lì il livello I non si raggiunge più.
# - area `cuore-di-capomozzo`: la porta antica (E1) è il testo dell'area; sette stanze ripetibili (E2, E3, le tre
#   nuove E5–E7, E8, E9) e il cuore `aurenne-sul-ponte` (E4), che si apre a profondità 3 e porta al seguito
#   `aurenne-la-mia-vera-madre`.
#   Le stanze vanno in ordine secondo la profondità: 0 subito oltre la porta (la sala delle statue inclinate,
#   dove comincia la Marea, o gli alloggi del presidio), 1 dentro le rovine (il deposito, il pozzo grigio, i
#   tavoli bassi), 2 davanti al ponte (il corridoio dei falcioni con le porte di pietra, o il trono di marmo
#   con il passaggio dietro la pedana). Una stanza superata non ricompare nella stessa visita.
# - in ogni ramo Aurenne crolla svenuta: aurenne 1, congegno, stella, cristalli anti-Marea, pista 5, poi i seguiti
#   `la-prigione-del-costruttore` (E10) → `la-rovina-sommersa` → `il-costruttore-di-capomozzo` →
#   `la-maschera-spaccata` (una delle quattro maschere) → `la-corsa-all-ascensore`, che porta pista.capomozzo a 6
#   e riporta ai Quartieri Alti.
aree:
  - id: cuore-di-capomozzo
    immagine: ambientazione/rovine-dei-precursori
    nome: Il cuore di Capomozzo
    sommario: "Sotto i sotterranei degli orchi, oltre una porta più vecchia della fortezza, ci sono le rovine dei Precursori."
    spedizione: { ritorno: superficie-fratturata, soglia: 3, stanze: 3 }
    testo: |
      Gli ultimi gradini girano a sinistra, e dietro l'angolo c'è una porta di
      pietra socchiusa. Un tempo era coperta di incisioni, che qualcuno ha
      cancellato a colpi di scalpello con molta pazienza, e restano soltanto
      gemme e corone sparse sulla pietra, senza più le teste che le portavano.
      Da un chiodo piantato in una corona pende una lanterna schermata con la
      fiamma bassa.

      Oltre la porta l'aria è fredda e asciutta e sa di ferro bruciato, e in
      fondo al corridoio la luce diventa lattiginosa dove comincia la Marea
      Grigia.

storylet:
  # ------------------------------------------------------------ 4 · rientrare dopo una ritirata
  - id: di-nuovo-verso-capomozzo
    presso: scuderie-della-zanna-rotta
    immagine: ambientazione/scuderie-della-zanna-rotta
    titolo: Di nuovo verso Capomozzo
    sommario: "Il secondo livello sotto la fortezza di Balthog ti aspetta dove l'hai lasciato, oltre la porta con le corone."
    luogo: Città Bassa, Scuderie della Zanna Rotta
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.capomozzo == 4]
    testo: |
      Dolovan Stroud ti vede arrivare dal fondo del cortile e posa il secchio
      prima che tu apra bocca. «Di nuovo a Capomozzo» dice, senza chiedertelo.
      «Alla tua età io gli orchi li cacciavo con l'arco, e da lontano.» Indica
      con il mento il box in fondo. «La grigia è paziente e il mare non la
      spaventa, per questo costa più del pezzato.»

      {origine figlio-della-citta-bassa} Da ragazzo questo cortile lo tagliavi
      di corsa per arrivare prima alle fucine, e le spalle si voltano ancora a
      controllare che nessuno ti corra dietro.
    opzioni:
      - testo: "Noleggiare la grigia"
        descrizione: "Stroud noleggia la cavalla grigia. Va al passo, ma non si ferma mai."
        requisiti: [monete >= 15]
        costo: 1
        esito:
          titolo: La grigia
          testo: |
            La grigia va al passo per due giorni e mezzo fra le colline e la
            costa, senza mai cambiare andatura, e la leghi al pino storto davanti
            al roveto. Attraversi a testa bassa Rovolungo e la fortezza, e scendi
            le due rampe di scale fino alla porta con le corone, dove la lanterna
            è ancora accesa.
          effetti: { monete: -15 }
          vai: cuore-di-capomozzo
      - testo: "Partire sul tuo cavallo"
        descrizione: "La strada la conosce anche lui, e fra i rovi di Rovolungo ci entra senza farsi pregare."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 1
        esito:
          titolo: In sella
          testo: |
            Il tuo cavallo prende la costa al trotto e il secondo giorno ti porta
            fino al roveto senza che tu debba cercare la strada. Lo lasci legato
            al pino storto con la bisaccia del fieno aperta. Poi attraversi la
            fortezza con la mano sulla cintura e scendi i due livelli dei
            sotterranei fino alla porta con le corone.
          vai: cuore-di-capomozzo
      - testo: "Andare a piedi"
        descrizione: "Due giorni e mezzo di cammino, con le colline in mezzo."
        costo: 2
        esito:
          titolo: A piedi
          testo: |
            Cammini due giorni e mezzo fra le colline e la costa, e la seconda
            notte dormi sotto una barca rovesciata che sa di catrame. Arrivi al
            roveto di Rovolungo con i piedi pieni di vesciche. Attraversi la
            fortezza a testa bassa e scendi fino alla porta con le corone, dove la
            lanterna è ancora accesa.
          vai: cuore-di-capomozzo

  # ------------------------------------------------------------ le stanze (ripetibili, tre a caso)
  - id: cuore-la-sala-delle-statue
    immagine: ambientazione/marea-grigia
    titolo: La sala delle statue inclinate
    sommario: "Una sala che pende verso ovest, con le statue scivolate contro il muro e la Marea ferma fra le colonne."
    luogo: Sotto Capomozzo, la sala della bestia
    area: cuore-di-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 4, profondita.cuore-di-capomozzo == 0]
    testo: |
      Due colonne reggono il soffitto di una sala incrostata di fuliggine che
      pende verso ovest, e le statue nelle alcove, una donna con la testa
      d'uccello e un kukri in ogni mano, sono scivolate tutte dallo stesso
      lato. Fra le colonne la Marea è una nebbia lattiginosa. Sulla soglia est
      gli orchi hanno lasciato ossa di coniglio e un dente di cinghiale
      bruciato, e la fuliggine è segnata da graffi lunghi quanto il tuo
      braccio.

      {origine figlio-del-circolo} Al Circolo ti hanno insegnato a guardare una
      pista prima di decidere che bestia l'ha lasciata, e qui continui a
      rimandare la decisione.
    opzioni:
      - testo: "Attraversare la sala da una colonna all'altra"
        descrizione: "Con l'aria chiusa nei polmoni più a lungo che puoi, e con la mano sempre su qualcosa di solido."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Da una colonna all'altra
          testo: |
            Riempi i polmoni sulla soglia e vai da una colonna all'altra con la
            guancia contro la pietra fredda, mentre il pavimento in pendenza ti
            tira verso le statue. A metà strada cominciano a battere le tempie, e
            arrivi alla porta est con il petto che brucia, lasciando andare l'aria
            tutta insieme.
          effetti: { profondita.cuore-di-capomozzo: 1 }
        fallimento:
          titolo: Il filo
          testo: |
            A metà sala respiri senza volerlo, e la nebbia ti entra in gola con un
            sapore di moneta vecchia. Ti ritrovi seduto ai piedi di una statua,
            con il kukri di pietra sopra la testa, senza sapere da quanto sei lì.
          effetti: { contaminazione: 1 }
      - testo: "Leggere i graffi nella fuliggine"
        descrizione: "Qualcosa di grosso è passato di qui, e gli orchi gli lasciano ancora le offerte."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Le zampe che scottano
          testo: |
            Sono artigli di un felino grande quanto un toro, segni vecchi di
            generazioni che vanno tutti verso le scale. *Quello che li ha fatti è
            uscito da qui, e gli orchi gli lasciano da mangiare perché non torni.*
            Scavalchi le offerte senza toccarle.
          effetti: { profondita.cuore-di-capomozzo: 1 }
        fallimento:
          titolo: La pendenza
          testo: |
            Ti chini sui graffi e il pavimento in pendenza ti porta via un piede.
            Scivoli contro la statua più vicina, e il kukri di pietra ti apre il
            dorso della mano. Resti fermo ad ascoltare, con il cuore che ti batte
            nella ferita, ma la statua non si è mossa.
          effetti: { ferite: 0.5 }
      - testo: "Strisciare lungo il muro, sotto la nebbia"
        descrizione: "Raso terra la Marea è più rada, almeno così dicono."
        costo: 2
        esito:
          titolo: Raso terra
          testo: |
            Strisci pancia a terra lungo il muro, con la fuliggine nel colletto e
            la nebbia una spanna sopra la nuca. Raso terra la Marea sarà anche più
            rada, ma quando ti rialzi davanti alla porta est hai le mani nere e un
            ronzio sottile nelle orecchie che non se ne vuole andare.
          effetti: { profondita.cuore-di-capomozzo: 1, contaminazione: 1 }

  - id: cuore-il-corridoio-dei-falcioni
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il corridoio dei falcioni
    sommario: "Un corridoio in salita fra due statue con il falcione, e in mezzo un tratto di pavimento troppo pulito."
    luogo: Sotto Capomozzo, il corridoio dei falcioni
    area: cuore-di-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 4, profondita.cuore-di-capomozzo == 2]
    testo: |
      Il corridoio sale piano verso est, con la Marea bassa all'altezza delle
      ginocchia. A un passo e mezzo dalla porta il pavimento è lucido per un
      tratto, senza un granello di polvere, e sopra corrono due fessure diritte
      nel soffitto. Ai lati due statue di uomini severi tengono il falcione alla
      spalla, e in fondo ci sono due porte di pietra coperte di rune.

      {conoscenze-della-strada Facile} Nei palazzi dei ricchi un pavimento
      pulito vuol dire servitù. Quaggiù vuol dire che qualcosa ci passa sopra
      spesso, e di solito è una lama.
    opzioni:
      - testo: "Trovare il punto dove scatta"
        descrizione: "Una trappola ha sempre un punto in cui la pietra non è pietra."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La giuntura
          testo: |
            Controluce vedi la giuntura sottile come un capello che separa dal
            resto la piastra del tratto lucido. Passi sul bordo polveroso rasente
            ai basamenti, con la lama di un falcione a un palmo dall'orecchio,
            contando i passi a voce alta senza accorgertene.
          effetti: { profondita.cuore-di-capomozzo: 1 }
        fallimento:
          titolo: Le saracinesche
          testo: |
            Provi la pietra appena con la punta dello stivale, e si abbassa lo
            stesso. Le saracinesche scendono dal soffitto con un tonfo, e mentre
            ti butti indietro il primo colpo di falcione ti prende il polpaccio di
            striscio. Le statue menano fendenti nel vuoto per un bel pezzo prima
            che le saracinesche risalgano piano.
          effetti: { ferite: 0.5 }
      - testo: "Saltare il tratto lucido"
        descrizione: "È lungo poco più di un uomo steso. Con un po' di rincorsa, nel corridoio in salita."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il salto
          testo: |
            Prendi la rincorsa dalla porta per quattro passi in salita e salti, e
            la Marea si apre intorno alle gambe come acqua. Atterri sulla polvere
            oltre il tratto lucido e scivoli di un palmo con le braccia larghe,
            mentre le statue restano ferme con il falcione alla spalla.
          effetti: { profondita.cuore-di-capomozzo: 1 }
        fallimento:
          titolo: Il tallone
          testo: |
            Il salto è corto di un tallone. Senti la pietra abbassarsi e ti butti
            indietro mentre la saracinesca cade con un tonfo, e la lama di un
            falcione ti apre la camicia sul petto. Rotoli fino alla porta da cui
            sei entrato, con il sangue che ti scende caldo sotto la camicia.
          effetti: { ferite: 0.5 }
      - testo: "Chiudere la trappola con il Sigillo"
        descrizione: "Le saracinesche si muovono con il Mana dei Precursori, e il Mana ha le sue serrature."
        incantesimo: sigillo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La serratura
          testo: |
            Appoggi il palmo sulla parete e cerchi il punto dove il Mana corre
            verso le fessure del soffitto. Lo trovi, caldo come una vena, e lo
            chiudi con la stessa pressione con cui si ferma un'emorragia. Dentro
            il muro qualcosa scatta, e attraversi il tratto lucido con il palmo
            che ti formicola ancora.
          effetti: { profondita.cuore-di-capomozzo: 1 }
        fallimento:
          titolo: La serratura al contrario
          testo: |
            Il Sigillo prende la serratura dal verso sbagliato e la apre, e i
            falcioni tagliano l'aria davanti a te per un tempo lunghissimo. Il
            Mana ti torna indietro dietro gli occhi con un dolore bianco, e
            aspetti con la testa fra le mani prima di riprovare dal bordo.
          effetti: { tormento: 1 }
      - testo: "Passare sui basamenti delle alcove"
        descrizione: "Schiacciato contro le statue, dove il pavimento è ancora polveroso. È lento, e la Marea è lì."
        costo: 2
        esito:
          titolo: Fra le gambe di pietra
          testo: |
            Ti infili fra le gambe di pietra delle statue e il muro, da un
            basamento all'altro, chiedendo scusa a mezza voce. È un lavoro lento,
            e arrivi alle porte di pietra con le ginocchia sbucciate e la Marea
            che ti ronza nelle orecchie.
          effetti: { profondita.cuore-di-capomozzo: 1, contaminazione: 1 }

  - id: cuore-il-deposito-delle-macchine
    immagine: bestiario/salvaguardia-precursori
    titolo: Il deposito delle macchine
    sommario: "Una sala lunga con le nicchie piene di macchine della Salvaguardia spente. Quasi tutte."
    luogo: Sotto Capomozzo, il deposito della Salvaguardia
    area: cuore-di-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 4, profondita.cuore-di-capomozzo == 1]
    testo: |
      La sala è lunga e stretta, e nelle nicchie ai lati stanno macchine della
      Salvaguardia ripiegate su se stesse come attrezzi riposti, ragni dalle molte
      braccia e figure sottili con la testa girata all'indietro. Le fessure degli
      occhi sono spente, e al braccio teso del ragno più vicino il culto ha appeso una
      sacca da viaggio. Nella penultima nicchia una fessura rossa si accende ogni
      tanto e poi si spegne.

      {origine apprendista-raschiatore} Sulle piattaforme la regola è tornare alla
      scala appena si vede una Salvaguardia, e le gambe la cercano anche se qui la
      scala non c'è.
    opzioni:
      - testo: "Passare in mezzo senza fare rumore"
        descrizione: "Sono spente. Basta non dare loro un motivo per accendersi."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: La penultima nicchia
          testo: |
            Cammini nel mezzo della sala, lontano dalle braccia ripiegate,
            mettendo i piedi uno davanti all'altro come sul bordo di un tetto.
            Davanti alla penultima nicchia la fessura rossa si accende e ti segue
            per tre passi prima di spegnersi, e tu esci dall'altra parte senza
            voltarti, con la camicia incollata alla schiena.
          effetti: { profondita.cuore-di-capomozzo: 1 }
        fallimento:
          titolo: La sacca
          testo: |
            La manica ti si impiglia nella sacca appesa al ragno, e il braccio si
            abbassa con un clangore che rimbomba per tutta la sala. Nella
            penultima nicchia la macchina sposta avanti una zampa, lenta come un
            vecchio che si sveglia, e una lama ti segna la coscia prima che tu
            raggiunga la porta.
          effetti: { ferite: 0.5 }
      - testo: "Capire se dormono davvero"
        descrizione: "Una macchina spenta e una che aspetta si somigliano. Ascoltandole, un po' meno."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il cristallo incrinato
          testo: |
            Il ronzio arriva da una linea di cristallo che corre nel muro e si
            ferma in ogni nicchia, e nella penultima il cristallo del petto è
            incrinato e scarica a vuoto, come un uomo che parla nel sonno. Le
            macchine dormono tutte, e da un ragno rotto stacchi una scheggia di
            cristallo.
          effetti: { profondita.cuore-di-capomozzo: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Le fessure
          testo: |
            Ti pianti davanti alla penultima nicchia e fissi la fessura rossa
            senza sbattere le palpebre, finché ti bruciano gli occhi. Quando li
            chiudi la vedi ancora stampata sulle palpebre, diventata due, ed esci
            all'indietro urtando con la spalla un ragno ripiegato.
          effetti: { tormento: 1 }
      - testo: "Ordinare alle macchine di restare ferme"
        descrizione: "La lingua delle macchine ha una parola per dormire. Bisogna dirla bene."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La parola giusta
          testo: |
            Dici la parola nella lingua delle macchine, più dura di come l'avevi
            pensata. Tutte le fessure della sala si accendono insieme una volta
            sola e poi si spengono, anche quella della penultima nicchia, e
            attraversi il deposito al passo con in gola un gusto di ferro, come
            dopo aver morso una moneta.
          effetti: { profondita.cuore-di-capomozzo: 1 }
        fallimento:
          titolo: In attesa
          testo: |
            A metà della parola la lingua ti si inceppa su una sillaba. Le
            macchine alzano la testa tutte insieme e restano così, con le fessure
            accese, ad aspettare un ordine che non sai dare. Torni indietro sotto
            quegli sguardi rossi un passo alla volta, e le gambe ti tremano per
            tutto il corridoio.
          effetti: { tormento: 1 }
      - testo: "Prendere il condotto dietro le nicchie"
        descrizione: "Un cunicolo di servizio basso e buio, dove le macchine non entrano."
        costo: 2
        esito:
          titolo: Il condotto
          testo: |
            Dietro l'ultima nicchia c'è un condotto di servizio alto quanto un
            cane. Ci strisci dentro sui gomiti, sul metallo così freddo che dopo
            un po' non senti più le mani, e ne esci tremando, battendoti le mani
            sulle cosce finché non tornano a sentire.
          effetti: { profondita.cuore-di-capomozzo: 1, tormento: 1 }

  - id: cuore-il-pozzo-grigio
    immagine: ambientazione/marea-grigia
    titolo: Il pozzo grigio
    sommario: "Una passerella di Magnistruttura senza parapetto, sopra un pozzo dove la Marea Grigia si è fatta densa."
    luogo: Sotto Capomozzo, il pozzo grigio
    area: cuore-di-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 4, profondita.cuore-di-capomozzo == 1]
    testo: |
      Il pavimento finisce sull'orlo di un pozzo largo quanto una piazza,
      attraversato da una passerella di Magnistruttura senza parapetto, larga
      quanto due piedi accostati. In fondo la Marea Grigia è densa come latte
      cagliato. Il culto aveva teso una corda lungo la passerella, ma al terzo
      piolo è tagliata e il capo libero pende verso il grigio.

      {percezione Media} Il taglio è pulito e fatto da questo lato, da chi non
      voleva che qualcuno tornasse indietro.

      {origine mercante-dei-ponti} Conti i pioli come si conta la merce sui
      Ponti, e ti aiuta più di quanto dovrebbe.
    opzioni:
      - testo: "Attraversare la passerella"
        descrizione: "Un piede davanti all'altro e gli occhi sull'altra sponda. Senza guardare giù."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: L'altra sponda
          testo: |
            Tieni gli occhi sull'altra sponda e metti un piede davanti all'altro,
            con le braccia larghe come un funambolo da fiera. Sotto di te la Marea
            si solleva fino a un palmo dalla passerella e poi ricade, e dall'altra
            parte le ginocchia ti cedono e ti siedi finché il cuore non rallenta.
          effetti: { profondita.cuore-di-capomozzo: 1 }
        fallimento:
          titolo: A quattro zampe
          testo: |
            A metà passerella ti dimentichi quale piede hai appena mosso. Torni
            indietro a quattro zampe, con la Marea che lambisce il bordo del
            metallo e ti bagna le dita di freddo, e sulla sponda ti ci vuole un
            pezzo per ricordarti il tuo nome intero.
          effetti: { contaminazione: 1 }
      - testo: "Tenere la mente sopra la Marea"
        descrizione: "La Marea prende prima la testa. Bisogna darle qualcosa da fare mentre i piedi camminano."
        prova: { attributo: mentale, abilita: [resilienza, accademiche], difficolta: Media }
        successo:
          titolo: I ponti di Qir-Azel
          testo: |
            Reciti i ponti di Qir-Azel in ordine, dal Ponte del Conciatore al
            Ponte dei Morti, e poi le vie della Città Bassa una per una. La Marea
            non trova posto fra un nome e l'altro, e arrivi dall'altra parte a
            metà di Via del Salmone, detta a voce alta.
          effetti: { profondita.cuore-di-capomozzo: 1 }
        fallimento:
          titolo: La mano tesa
          testo: |
            Al terzo ponte di Qir-Azel non ti ricordi il quarto, e ti ritrovi in
            ginocchio sull'orlo con la mano tesa verso la superficie grigia. La
            ritiri di colpo e ti trascini indietro con le dita bianche fino alla
            seconda falange.
          effetti: { contaminazione: 1 }
      - testo: "Strisciare sulla passerella"
        descrizione: "Pancia a terra e le mani sui bordi. Nessuno ti vede, e ci vuole il triplo del tempo."
        costo: 2
        esito:
          titolo: Pancia a terra
          testo: |
            Ti stendi sulla passerella stringendola con le ginocchia e avanzi tirandoti con le mani sui
            bordi lisci. Arrivi dall'altra parte dopo il triplo del tempo, con un sapore di ferro sotto
            la lingua.
          effetti: { profondita.cuore-di-capomozzo: 1, contaminazione: 1 }

  - id: cuore-gli-alloggi-del-presidio
    immagine: ambientazione/rovine-dei-precursori
    titolo: Gli alloggi del presidio
    sommario: "Le brande e le ciotole di un culto partito vent'anni fa, con la lavagna dei turni ancora appesa."
    luogo: Sotto Capomozzo, gli alloggi del presidio
    area: cuore-di-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 4, profondita.cuore-di-capomozzo == 0]
    testo: |
      È una sala bassa, ricavata nelle rovine con muri di mattoni storti.
      Lungo le pareti ci sono una dozzina di brande con le coperte piegate, e
      accanto alla stufa un tavolo lungo con le ciotole capovolte, una per
      posto. Sopra pende una lavagna con i turni in gesso di vent'anni fa, e
      vicino alla porta sono appesi i mantelli grigi, uno con una toppa al
      gomito cucita con il filo rosso.

      {origine fuggiasco-di-ghoran} Davanti alla lavagna dei turni la schiena
      ti si curva da sola, come a Ghoran quando passavano i sorveglianti.
    opzioni:
      - testo: "Leggere la lavagna"
        descrizione: "I turni divisi per nome, e in fondo una riga scritta con un'altra mano."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: L'ultima riga
          testo: |
            Ci sono i turni di guardia e di cucina, e una colonna intera per la
            *porta della stella*. L'ultima riga è scritta in fretta da un'altra
            mano, con il gesso spezzato a metà parola, *partiamo stanotte, i
            Portatori del Tramonto scendono a cercarci*, e sotto c'è la data,
            centotrent'anni dalla Caduta. Conti le ciotole capovolte e poi le
            brande, e i due numeri non ti consolano.
          effetti: { profondita.cuore-di-capomozzo: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il gesso
          testo: |
            Sollevi la lavagna dal chiodo e il chiodo viene via con lei, e la
            lavagna ti si spacca sul piede con un rumore che fa il giro delle
            rovine. Da lontano, molto più in basso, qualcosa risponde con un colpo
            sordo. Lasci i pezzi dove sono e torni sulla soglia zoppicando.
          effetti: { tormento: 1 }
      - testo: "Cercare quello che hanno lasciato"
        descrizione: "In una camerata ognuno ha il suo nascondiglio, e chi scappa di notte non torna a prenderlo."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Il mattone
          testo: |
            La branda del mantello con la toppa rossa è la migliore, vicino alla
            stufa. Sotto, nel muro storto, un mattone si muove, e dietro ci sono
            delle monete legate in un fazzoletto e il ritratto di una bambina
            disegnato male. Prendi le monete e rimetti il ritratto dietro il
            mattone, con la faccia verso il muro.
          effetti: { profondita.cuore-di-capomozzo: 1, monete: 12 }
        fallimento:
          titolo: Il nido
          testo: |
            Sotto la terza branda un mattone si muove, e dietro c'è un nido di
            millepiedi pallidi che ti corrono su per il braccio. Uno ti morde
            all'interno del polso, e il morso brucia per un'ora e diventa viola
            come una prugna.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare la sala e basta"
        descrizione: "Senza toccare niente, e senza guardare le ciotole."
        costo: 2
        esito:
          titolo: La cena
          testo: |
            Attraversi la sala lungo il muro senza toccare niente, con gli occhi
            lontani dalle ciotole. Passando accanto al tavolo vedi però un
            cucchiaio messo di traverso sotto una di quelle capovolte, e per tutto
            il corridoio pensi alla mano che ce l'ha lasciato, sicura di tornare a
            sedersi.
          effetti: { profondita.cuore-di-capomozzo: 1, tormento: 1 }

  - id: cuore-il-trono-di-marmo
    immagine: ambientazione/mito-regina-ali-spezzate
    titolo: Il trono di marmo
    sommario: "Su un trono di marmo una donna fatta di luce parla a una sala vuota."
    luogo: Sotto Capomozzo, la sala comunicazioni
    area: cuore-di-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 4, profondita.cuore-di-capomozzo == 2]
    testo: |
      Al centro della camera, fra due statue della donna con la testa d'uccello,
      c'è un trono di marmo. Ci siede una figura trasparente, del colore della
      luce sulla neve, con le fattezze delle statue rese umane. Tiene il mento
      fermo e muove le mani, ma guarda un punto dove non c'è nessuno e ripete le
      stesse frasi in una lingua che non conosci.

      {origine rampollo-dei-quartieri-alti} Lo stesso mento fermo l'aveva Julia
      Castaldi al Festival, mentre tutta la piazza scappava.

      {magia Media} È un Eco di Mana, una voce impressa dove è stata
      pronunciata, che si consuma a ogni ripetizione.
    opzioni:
      - testo: "Capire che cosa dice"
        descrizione: "È la lingua delle iscrizioni dei Precursori. Qualche parola, chi ha studiato, la riconosce."
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: Ve lo giuro
          testo: |
            Riconosci prima una parola e poi un'altra, e al quarto giro le frasi
            ti si compongono in testa. «…incombe, ma vi ordino di rimanere. La
            impediremo. Salveremo la Rete Cristallina e torneremo a prosperare. Ve
            lo giuro.» La donna sul trono sorride a qualcuno che non c'è più da
            secoli, e guardando le due statue col becco ai lati del trono ti si
            gela la nuca.
          effetti: { profondita.cuore-di-capomozzo: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Le pause
          testo: |
            Più ascolti e meno capisci, e dopo un po' ti fermi anche tu dentro le
            sue pause, a metà di un pensiero, senza riuscire a smettere. Esci
            tenendoti la gola, e per tutto il corridoio ti accorgi di muovere le
            labbra insieme a lei.
          effetti: { tormento: 1 }
      - testo: "Ascoltare l'eco"
        descrizione: "È un Eco di Mana, e un Eco di Mana risponde a chi sa chiamarlo."
        incantesimo: eco
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La sala piena
          testo: |
            Per un momento la camera si riempie di uomini e donne in vesti grigie,
            con la faccia girata verso il trono, e adesso la capisci. «…incombe,
            ma vi ordino di rimanere. La impediremo. Salveremo la Rete Cristallina
            e torneremo a prosperare. Ve lo giuro.» Dal soffitto viene un boato, e
            tutte quelle facce alzano gli occhi insieme. Poi la gente sparisce, e
            lei ricomincia dall'inizio.
          effetti: { profondita.cuore-di-capomozzo: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Il giuramento
          testo: |
            Chiami l'eco, e l'eco ti entra in testa e si sistema dietro gli occhi,
            comoda come in casa propria. Per un'ora ripeti sottovoce l'ultima
            parola della donna senza sapere cosa vuol dire, e quando smetti sei di
            nuovo sulla soglia della sala del trono senza ricordarti di esserci
            tornato.
          effetti: { tormento: 1 }
      - testo: "Guardarle le mani"
        descrizione: "Le parole non le capisci. I gesti di chi parla a una folla, quelli sì."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Le mani aperte
          testo: |
            Le mani della donna stanno aperte con i palmi in giù e si abbassano
            piano a ogni frase, come quelle di Padre Vantes quando in Cattedrale
            qualcuno comincia a gridare. Sta calmando gente spaventata e promette
            più di quanto sa, e alla fine di ogni giro si porta al petto una mano
            che trema un poco.
          effetti: { profondita.cuore-di-capomozzo: 1 }
        fallimento:
          titolo: Lo sguardo
          testo: |
            Ti metti davanti alla pedana, nel punto che lei guarda, e per un
            momento i suoi occhi di luce sono dentro i tuoi, freddi come l'acqua
            di una fonte. Lei non ti vede, eppure da quel momento ti senti fra le
            scapole lo sguardo di qualcuno che aspetta una risposta.
          effetti: { tormento: 1 }
      - testo: "Passare dietro il trono senza guardarla"
        descrizione: "Dietro la pedana c'è un passaggio, e lei guarda sempre dall'altra parte."
        costo: 2
        esito:
          titolo: Dietro il trono
          testo: |
            Passi dietro il trono con gli occhi sul pavimento, e da vicino la sua
            voce è più dolce di quanto sembrasse, con una leggera raucedine in
            fondo alle frasi. Nel corridoio la senti ancora, ogni volta più
            debole, e a ogni pausa apri la bocca da solo, come se toccasse a te
            rispondere.
          effetti: { profondita.cuore-di-capomozzo: 1, tormento: 1 }

  - id: cuore-i-tavoli-bassi
    immagine: ambientazione/rovine-dei-precursori
    titolo: I tavoli bassi
    sommario: "Una camera con tre tavoli pieni di seghe e coltelli. Su uno c'è uno scheletro con due teschi."
    luogo: Sotto Capomozzo, la camera di trasmutazione
    area: cuore-di-capomozzo
    ripetibile: true
    requisiti: [pista.capomozzo == 4, profondita.cuore-di-capomozzo == 1]
    testo: |
      Sui tre tavoli bassi che riempiono la camera ci sono seghe e coltelli
      messi in fila per misura, come nella bottega di un chirurgo. Sul tavolo a
      sud qualcuno ha composto uno scheletro con troppe ossa per un uomo solo e
      troppo poche per due, e due teschi sulle stesse spalle. Accanto, su uno
      sgabello, c'è un grembiule di cuoio piegato in quattro, con le macchie
      ancora scure.

      {origine accolito-del-velo} Sotto il palco del Festival hai cucito tagli
      d'ascia con un ago dritto e le mani sporche fino ai polsi, e gli aghi
      curvi di questa stanza sono puliti.
    opzioni:
      - testo: "Esaminare lo scheletro"
        descrizione: "Senza toccarlo. Le ossa così vecchie si guardano e basta."
        prova: { attributo: mentale, abilita: [medicina, accademiche], difficolta: Media }
        successo:
          titolo: L'uomo sulla schiena
          testo: |
            È un uomo adulto con due teste, e dalle sue scapole esce lo scheletro
            incompleto di un uomo più piccolo, con le ossa saldate alle sue in un
            lavoro di mesi, forse di anni, fatto quando lui era vivo. Quando ti
            raddrizzi basta l'aria che smuovi, e lo scheletro si affloscia in
            polvere grigia.
          effetti: { profondita.cuore-di-capomozzo: 1 }
        fallimento:
          titolo: La polvere
          testo: |
            Sfiori appena una vertebra, e lo scheletro intero si sbriciola in una
            nuvola di polvere che ti entra in bocca e nel naso, con un sapore
            dolciastro. Continui a sputare per tutto il corridoio, con la mano
            contro il muro, finché la bocca non sa soltanto di pietra.
          effetti: { tormento: 1 }
      - testo: "Cercare fra gli attrezzi qualcosa che serva"
        descrizione: "Chi taglia la carne tiene anche qualcosa per chiuderla."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La scatola di lyssan
          testo: |
            Sotto il tavolo di mezzo c'è una scatola di lyssan chiusa con un
            gancio, e dentro, sigillate nella cera, ci sono bende di lino che
            vent'anni hanno lasciato bianche e profumate di lavanda, l'unica cosa
            gentile della stanza. Ne prendi un rotolo e passi accanto al grembiule
            senza sfiorarlo nemmeno con il mantello.
          effetti: { profondita.cuore-di-capomozzo: 1, bende: 1 }
        fallimento:
          titolo: La lama
          testo: |
            Sposti una sega per guardare sotto, e il coltello accanto scivola giù
            dal tavolo. Lo prendi al volo per la lama senza pensarci, e il taglio
            ti attraversa il palmo pulito come quello di un chirurgo. Ti fasci la
            mano con un lembo della camicia, stringendo con i denti.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare la camera guardando il pavimento"
        descrizione: "C'è un'altra porta, dall'altra parte dei tavoli."
        costo: 2
        esito:
          titolo: Il pavimento
          testo: |
            Tieni gli occhi sul pavimento e passi fra i tavoli, ma così vedi le
            macchie e le canalette scavate nella pietra che portano tutte verso un
            buco in mezzo alla camera. All'altra porta devi fermarti con la fronte
            contro lo stipite, finché la bocca smette di riempirsi di saliva.
          effetti: { profondita.cuore-di-capomozzo: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · Aurenne sul ponte (E4)
  - id: aurenne-sul-ponte
    immagine: ambientazione/mito-regina-ali-spezzate
    titolo: Il ponte di osservazione
    sommario: "In fondo alle rovine, in una sala illuminata da quattro teschi che bruciano, qualcuno ti aspetta accanto alla fontana."
    luogo: Sotto Capomozzo, il ponte di osservazione
    area: cuore-di-capomozzo
    requisiti: [pista.capomozzo == 4, profondita.cuore-di-capomozzo >= 3]
    testo: |
      Le pareti della sala si curvano ad arco su due cornicioni di marmo rosso
      carichi di libri e di vasi con creature deformi in salamoia. Nei quattro
      angoli bruciano senza fumo quattro teschi infilati su spuntoni di ferro, e
      al centro tre sedie sono girate verso una fontana d'acqua bluastra che
      gorgoglia.

      Accanto alla fontana c'è una donna. Ha i capelli lunghi e d'argento, che
      le scivolano sulle spalle come mercurio, e la pelle bianca attraversata da
      vene che si accendono di viola a ogni battito. Porta un'armatura di
      metallo nero e di cuoio che sembra crescerle addosso, e il ventre è
      scoperto, attraversato da un fianco all'altro da una cicatrice profonda.
      La mano destra è un artiglio nero dalle dita lunghissime. *È la donna dei
      ritratti di Isvaro.* Nei ritratti, però, la cicatrice non c'era.

      Al suo fianco sta una macchina a quattro zampe grande quanto un cavallo,
      con una maschera ovale senza occhi al posto della testa.

      La donna ti guarda con due occhi color ametista e ti sorride a labbra
      strette. «Sei arrivato fin qui da solo» dice. «Avvicinati, mio dolce.
      Voglio che tu mi veda bene.»
    opzioni:
      - testo: "Lasciarla parlare"
        descrizione: "Ha aspettato a lungo qualcuno a cui dirlo. Finché parla, la macchina resta ferma."
        costo: 0
        esito:
          titolo: Mio dolce
          testo: |
            Resti dove sei, con la mano vicina alla cintura. Lei viene avanti fino
            alle sedie a metà sala, e la macchina la segue con le zampe che non
            fanno rumore sul marmo. Da vicino ha un profumo di incenso e di
            metallo caldo, e ha voglia di parlare, e tu, a dispetto di tutto, hai
            voglia di ascoltarla.
          segue: aurenne-la-mia-vera-madre
      - testo: "Non lasciarle finire la frase"
        descrizione: "Lei e la macchina insieme. Aurenne è più veloce di quanto sembri, e l'artiglio non è un ornamento."
        combattimento: aurenne
        vittoria:
          immagine: personaggi/aurenne
          titolo: La bambina sul pavimento
          testo: |
            La macchina cade per prima, in un mucchio di piastre che ronzano ancora, e
            Aurenne finisce in ginocchio accanto alla fontana con l'artiglio incrinato.
            «Questa volta non conta» dice, come una bambina che ha perso al gioco. La
            chiami per nome, e per un battito di ciglia i suoi occhi sono quelli di una
            ragazza spaventata, poi si affloscia su un fianco, svenuta.
          imposta: { aurenne: 1, pista.capomozzo: 5 }
          effetti: { oggetto.congegno-di-controllo: 1, oggetto.stella-a-sette-punte: 1, oggetto.cristalli-anti-marea: 1 }
          segue: la-prigione-del-costruttore
        sconfitta:
          immagine: personaggi/aurenne
          titolo: Il corpo che cede
          testo: |
            L'artiglio ti apre il fianco e la macchina ti schiaccia contro il
            cornicione, fra i vasi che si rompono. Aurenne alza l'artiglio per
            finirti, ma in quel momento le vene sotto la sua pelle si spengono
            tutte insieme e lei crolla, con la macchina che si accuccia accanto.
            Ti rialzi con il sapore della salamoia in bocca.
          imposta: { aurenne: 1, pista.capomozzo: 5 }
          effetti: { oggetto.congegno-di-controllo: 1, oggetto.stella-a-sette-punte: 1, oggetto.cristalli-anti-marea: 1, tormento: 1 }
          segue: la-prigione-del-costruttore
      - testo: "Risponderle come a una padrona di casa"
        descrizione: "Ti chiama mio dolce come una dama dei salotti, e a una padrona di casa si risponde con un inchino."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        costo: 0
        esito:
          titolo: L'inchino
          testo: |
            Fai l'inchino corto che si deve a chi riceve in casa propria, con gli
            occhi su di lei e non sull'artiglio. Aurenne ride piano per la
            sorpresa e risponde con un cenno del mento, come una dama che ha
            riconosciuto un cognome, poi viene avanti fino alle sedie come se la
            sala fosse piena di ospiti.
          pe: { galateo: 5 }
          segue: aurenne-la-mia-vera-madre

  - id: aurenne-la-mia-vera-madre
    tipo: seguito
    immagine: personaggi/aurenne
    titolo: La mia vera madre
    sommario: "Aurenne ti dice chi è, e che cosa vuole diventare."
    luogo: Sotto Capomozzo, il ponte di osservazione
    area: cuore-di-capomozzo
    requisiti: [pista.capomozzo == 4]
    testo: |
      «Tu non puoi capirlo, e non te ne faccio una colpa» dice Aurenne, seduta
      sul bracciolo di una sedia con le gambe accavallate. «A Qir-Azel ogni
      occhiata che mi davano era una lama. Li ho pregati di volermi bene come
      una mendicante sui gradini di un tempio chiuso, e nessuno ha mai voluto
      vedere chi ero davvero.»

      {origine accolito-del-velo} Nelle cronache del Velo il suo nome sta
      accanto a quello del cappellano Idrian Sollen, sotto la riga
      sull'incendio del Santuario, e adesso la morta ti parla con le gambe
      accavallate.

      «Poi mi ha parlato lei. Nhar'Kael, la Regina delle Ali Spezzate, la mia
      vera madre.» Sul nome le vene le si accendono tutte insieme. «La mia
      carne è un seme, e quando avrà finito di germogliare sarò quello che
      dovevo essere fin dall'inizio, un mostro. La tua pietà tienila, mio
      dolce. Quando la Marea ti avrà preso voglio che tu pensi a me, a quello
      che divento e a quello che avrei potuto essere.»

      Si sfila dal collo un disco di metallo con una corona di cristalli e ci
      preme sopra il pollice. La macchina abbassa la maschera e piega le zampe
      per saltare, e Aurenne si alza con l'artiglio aperto.

      {tecnologia Media} Il disco comanda la macchina, e Aurenne lo tiene
      stretto in pugno.
    opzioni:
      - testo: "Combatterla"
        descrizione: "Lei e la macchina insieme. Aurenne è più veloce di quanto sembri, e l'artiglio non è un ornamento."
        combattimento: aurenne
        vittoria:
          titolo: La bambina sul pavimento
          testo: |
            La macchina cade per prima, in un mucchio di piastre che ronzano ancora, e
            Aurenne finisce in ginocchio accanto alla fontana con l'artiglio incrinato.
            «Questa volta non conta» dice, come una bambina che ha perso al gioco. La
            chiami per nome, e per un battito di ciglia i suoi occhi sono quelli di una
            ragazza spaventata, poi si affloscia su un fianco, svenuta.
          imposta: { aurenne: 1, pista.capomozzo: 5 }
          effetti: { oggetto.congegno-di-controllo: 1, oggetto.stella-a-sette-punte: 1, oggetto.cristalli-anti-marea: 1 }
          segue: la-prigione-del-costruttore
        sconfitta:
          titolo: Il corpo che cede
          testo: |
            L'artiglio ti apre il fianco e la macchina ti schiaccia contro il
            cornicione, fra i vasi che si rompono. Aurenne alza l'artiglio per
            finirti, ma in quel momento le vene sotto la sua pelle si spengono
            tutte insieme e lei crolla, con la macchina che si accuccia accanto.
            Ti rialzi con il sapore della salamoia in bocca.
          imposta: { aurenne: 1, pista.capomozzo: 5 }
          effetti: { oggetto.congegno-di-controllo: 1, oggetto.stella-a-sette-punte: 1, oggetto.cristalli-anti-marea: 1, tormento: 1 }
          segue: la-prigione-del-costruttore
      - testo: "Parlarle della ragazza del diario"
        descrizione: "Hai il quaderno della sua stanza, con la grafia tonda di una ragazza che scriveva al Grande Albero."
        requisiti: [oggetto.diario-di-aurenne >= 1]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: Gli uccellini
          testo: |
            Le leggi la prima riga del quaderno di stoffa azzurra, *Caro Albero*,
            e le parli dell'uccellino di legno senza un'ala che teneva sulla
            scrivania. Si ferma con l'artiglio a mezz'aria. «Come fai a saperlo?»
            chiede con una voce piccola. Il disco le si spegne in mano e la
            macchina si blocca a metà del salto, e quando le gambe le cedono la
            prendi prima che batta la testa.
          imposta: { aurenne: 1, pista.capomozzo: 5 }
          effetti: { oggetto.congegno-di-controllo: 1, oggetto.stella-a-sette-punte: 1, oggetto.cristalli-anti-marea: 1 }
          pe: { empatia: 10 }
          segue: la-prigione-del-costruttore
        fallimento:
          titolo: Stai zitto
          testo: |
            «Stai zitto!» grida, e la macchina ti salta addosso. Prendi i suoi
            artigli sull'avambraccio e continui a parlarle della ragazza che
            scriveva al Grande Albero e dell'uccellino senza un'ala, con il sangue
            che ti cola fino al gomito. Aurenne barcolla con le mani sulle
            orecchie e il disco le scivola dalle dita. La macchina si ferma sopra
            di te, e lei crolla accanto alla fontana.
          imposta: { aurenne: 1, pista.capomozzo: 5 }
          effetti: { oggetto.congegno-di-controllo: 1, oggetto.stella-a-sette-punte: 1, oggetto.cristalli-anti-marea: 1, ferite: 1.5, tormento: 1 }
          segue: la-prigione-del-costruttore
      - testo: "Scacciare la voce che le parla"
        descrizione: "Quella che lei chiama madre le sta dentro. La Liturgia dell'Albero ha parole per ciò che non dovrebbe restare."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Le ali
          testo: |
            Dici le parole della Liturgia guardandola negli occhi, e qualcosa si
            ritira dentro di lei con un rumore d'ali mentre le vene viola si
            spengono una alla volta. Aurenne ti guarda come se ti vedesse per la
            prima volta, poi si accascia di lato.

            {magia Difficile} Il Mana che le scorreva nelle vene si è ritirato
            tutto in un punto sotto la cicatrice, e lì si è fermato ad aspettare.
          imposta: { aurenne: 1, pista.capomozzo: 5 }
          effetti: { oggetto.congegno-di-controllo: 1, oggetto.stella-a-sette-punte: 1, oggetto.cristalli-anti-marea: 1 }
          pe: { magia: 10 }
          segue: la-prigione-del-costruttore
        fallimento:
          titolo: La madre risponde
          testo: |
            A metà della Liturgia la cosa che le sta dentro ti risponde con la
            voce antica di un'altra, e il Mana ti torna indietro e ti butta in
            ginocchio. La lotta però è costata anche a lei, e Aurenne crolla sul
            marmo gridando una parola sola, mentre la macchina si spegne accanto a
            lei.
          imposta: { aurenne: 1, pista.capomozzo: 5 }
          effetti: { oggetto.congegno-di-controllo: 1, oggetto.stella-a-sette-punte: 1, oggetto.cristalli-anti-marea: 1, tormento: 1.5, ferite: 0.5 }
          segue: la-prigione-del-costruttore
      - testo: "Strapparle il disco dal collo"
        descrizione: "La macchina obbedisce al disco. Se riesci a passare sotto l'artiglio, forse senza disco si ferma."
        prova: { attributo: fisico, abilita: [acrobazia, rissa, atletica], difficolta: Difficile }
        successo:
          titolo: Il cordino
          testo: |
            Ti butti sotto l'artiglio quando lo alza e afferri il cordino del
            disco con tutte e due le mani, mentre l'artiglio ti fischia sopra la
            nuca. Il cordino si spezza, e la macchina ricade sul marmo come un
            mucchio di pentole. Aurenne graffia l'aria dove c'eri tu, poi barcolla
            come se il disco l'avesse tenuta in piedi fino a quel momento, e
            crolla fra le sedie.
          imposta: { aurenne: 1, pista.capomozzo: 5 }
          effetti: { oggetto.congegno-di-controllo: 1, oggetto.stella-a-sette-punte: 1, oggetto.cristalli-anti-marea: 1 }
          pe: { acrobazia: 10 }
          segue: la-prigione-del-costruttore
        fallimento:
          titolo: Il prezzo del disco
          testo: |
            Il disco lo prendi, ma l'artiglio ti prende a sua volta dalla spalla
            al fianco, e il dolore ti toglie la vista. Rotoli lontano con il disco
            stretto al petto, e la macchina si ferma. Aurenne fa due passi verso
            di te con l'artiglio gocciolante, poi si guarda la mano vuota e cade a
            terra.
          imposta: { aurenne: 1, pista.capomozzo: 5 }
          effetti: { oggetto.congegno-di-controllo: 1, oggetto.stella-a-sette-punte: 1, oggetto.cristalli-anti-marea: 1, ferite: 2 }
          segue: la-prigione-del-costruttore
      - testo: "Resistere"
        descrizione: "Ogni ordine che dà alla macchina le costa qualcosa, e il suo corpo può cedere prima del tuo."
        costo: 2
        esito:
          titolo: Chi cede prima
          testo: |
            Ti ripari dietro le sedie e poi dietro la fontana, prendendo i colpi
            che non riesci a schivare. Ogni volta che lei preme il disco la
            macchina si fa più veloce e Aurenne più pallida, finché hai le braccia
            aperte in tre punti. All'ultimo comando le cede il corpo prima della
            volontà, e la macchina si ferma con lei.
          imposta: { aurenne: 1, pista.capomozzo: 5 }
          effetti: { oggetto.congegno-di-controllo: 1, oggetto.stella-a-sette-punte: 1, oggetto.cristalli-anti-marea: 1, ferite: 2, tormento: 1.5 }
          segue: la-prigione-del-costruttore
      - testo: "Parlarle di suo padre come ne parla il Velo"
        descrizione: "Nelle cronache del Velo il suo nome sta accanto a quello di Idrian Sollen, fra i morti."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [empatia, accademiche], difficolta: Difficile }
        successo:
          titolo: Il nome nelle cronache
          testo: |
            Le dici che il suo nome è scritto nelle cronache del Velo accanto a
            quello del cappellano Idrian Sollen, fra i morti del Santuario. Si
            ferma con l'artiglio a mezz'aria. «Mio padre» dice, senza la voce
            dell'altra. Il disco le si spegne in mano e la macchina si blocca a
            metà del salto, e quando le gambe le cedono la prendi prima che batta
            la testa.
          imposta: { aurenne: 1, pista.capomozzo: 5 }
          effetti: { oggetto.congegno-di-controllo: 1, oggetto.stella-a-sette-punte: 1, oggetto.cristalli-anti-marea: 1 }
          pe: { empatia: 10 }
          segue: la-prigione-del-costruttore
        fallimento:
          titolo: I morti del Santuario
          testo: |
            «I morti del Velo li conosco» grida, e la macchina ti salta addosso. Prendi i suoi artigli
            sull'avambraccio e continui a dire il nome di suo padre finché, alla terza volta, Aurenne si porta
            le mani alle orecchie e il disco le scivola dalle dita. La macchina si ferma sopra di te, e lei
            crolla accanto alla fontana.
          imposta: { aurenne: 1, pista.capomozzo: 5 }
          effetti: { oggetto.congegno-di-controllo: 1, oggetto.stella-a-sette-punte: 1, oggetto.cristalli-anti-marea: 1, ferite: 1.5, tormento: 1 }
          segue: la-prigione-del-costruttore
      - testo: "Spegnere la corona del disco"
        descrizione: "All'Accademia impari come si spegne un cristallo, ma serve una mano a un palmo dal disco."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [magia, tecnologia], difficolta: Difficile }
        successo:
          titolo: La corona spenta
          testo: |
            Ti butti sotto l'artiglio con la mano aperta verso il disco e senti il
            Mana della corona tirarti nei polpastrelli, come la sera del Festival
            al banco. Lo spingi giù dal verso contrario, un cristallo alla volta,
            finché la corona diventa opaca e la macchina ricade sul marmo come un
            mucchio di pentole. Aurenne preme il pollice sul disco spento, poi
            crolla fra le sedie.
          imposta: { aurenne: 1, pista.capomozzo: 5 }
          effetti: { oggetto.congegno-di-controllo: 1, oggetto.stella-a-sette-punte: 1, oggetto.cristalli-anti-marea: 1 }
          pe: { magia: 10 }
          segue: la-prigione-del-costruttore
        fallimento:
          titolo: Un cristallo alla volta
          testo: |
            I cristalli si spengono uno alla volta e troppo piano. Al terzo
            l'artiglio ti prende dalla spalla al fianco, e la mano resta dov'è lo
            stesso. All'ultimo cristallo la macchina si ferma, e Aurenne guarda il
            disco spento che ha in mano e cade in ginocchio, e da lì a terra.
          imposta: { aurenne: 1, pista.capomozzo: 5 }
          effetti: { oggetto.congegno-di-controllo: 1, oggetto.stella-a-sette-punte: 1, oggetto.cristalli-anti-marea: 1, ferite: 2 }
          segue: la-prigione-del-costruttore

  # ------------------------------------------------------------ 5 · la prigione del Costruttore (E10)
  - id: la-prigione-del-costruttore
    tipo: seguito
    immagine: ambientazione/rovine-dei-precursori
    titolo: La porta della stella
    sommario: "Una stella d'oro e d'argento apre una porta senza maniglie, e oltre c'è una sala piena di candele."
    luogo: Sotto Capomozzo, la prigione del Costruttore
    area: cuore-di-capomozzo
    requisiti: [pista.capomozzo == 5]
    testo: |
      Aurenne pesa meno di quanto pensavi, e te la carichi sulle spalle. Al
      polso ti sei legato il cordino con i quattro cristalli che portava al
      collo, il disco è in tasca, e alla cintura aveva una stella a sette punte
      d'oro e d'argento.

      In fondo al ponte la stella entra nell'incavo di una porta di pietra senza
      maniglie, che si apre senza un rumore.

      Dentro bruciano candele dorate dalla cera fresca. *Qualcuno scendeva qui
      ogni giorno a cambiarle.* Sulla parete sud è incisa una grande stella, e
      al centro c'è una piattaforma rotonda con incisioni minuscole che si
      accendono e si spengono e una placca rialzata. È uno degli ascensori dei
      Precursori di cui parlano i Raschiatori più vecchi del Grifone.

      {origine allievo-di-torvessa} Le incisioni si accendono a due a due, come
      i cristalli conduttori del banco all'Accademia, dove questa cosa la sanno
      spiegare solo sui libri.
    opzioni:
      - testo: "Posare la mano sulla placca"
        descrizione: "Con Aurenne sulle spalle, perché qui sopra da sola non la lasci."
        costo: 0
        esito:
          titolo: La discesa
          testo: |
            Appena tocchi la placca la sala manda un suono basso e sotto i piedi
            si accende una luce bianca e fredda. La piattaforma si muove senza uno
            scossone, e capisci che stai scendendo perché le ginocchia ti si
            piegano da sole, mentre le pareti di pietra umida scorrono accanto a
            te per minuti interi.
          segue: la-rovina-sommersa

  - id: la-rovina-sommersa
    tipo: seguito
    immagine: ambientazione/marea-grigia
    titolo: La rovina sommersa
    sommario: "In fondo all'ascensore c'è una rovina dei Precursori grande come una città, sommersa dalla Marea Grigia."
    luogo: Sotto Capomozzo, la rovina sommersa
    area: cuore-di-capomozzo
    requisiti: [pista.capomozzo == 5]
    testo: |
      Le pareti si aprono tutte insieme su una distesa di torri spezzate e
      ponti sospesi, immersi in una Marea Grigia così densa che la luce fredda
      della rovina ci si impiglia dentro.

      A quattrocento metri pulsa lenta una luce rossa, da una fenditura alta
      decine di metri aperta in una parete nera e lucida di Magnistruttura, il
      metallo dei Precursori che niente riesce a scalfire.

      Sei a metà del passaggio sospeso quando dalle pareti e dai condotti
      escono macchine della Salvaguardia e ti chiudono in cerchio con i sensori
      rossi accesi. Poi il ronzio cambia nota, i sensori si spengono e le
      macchine restano immobili con la testa girata verso di te, in attesa di
      un ordine che non arriva.

      {armi-da-distanza Media fallita} Conti le macchine per capire quante
      potresti fermarne prima che ti arrivino addosso, e a venti perdi il
      conto.
    opzioni:
      - testo: "Provare il disco di Aurenne"
        descrizione: "Lei le comandava con quello. Basta premere dove premeva lei."
        requisiti: [oggetto.congegno-di-controllo >= 1]
        costo: 0
        esito:
          titolo: Il disco muto
          testo: |
            Premi il pollice sul disco dove lo premeva lei, e i cristalli della
            corona si accendono, ma le macchine non girano nemmeno la testa.
            Riprovi premendo sempre più forte, come se il problema fosse il
            pollice, poi rimetti il disco in tasca e passi in mezzo al cerchio,
            verso la luce rossa.
          effetti: { contaminazione: 1 }
          segue: il-costruttore-di-capomozzo
      - testo: "Passare in mezzo alle macchine"
        descrizione: "Si sono spente da sole. Non è detto che restino spente."
        costo: 0
        esito:
          titolo: Il cerchio
          testo: |
            Passi fra due macchine alte quanto te, così vicino che senti sulla
            guancia il freddo del loro metallo, tenendo il passo regolare anche
            quando le gambe vorrebbero correre. Nessuna si muove, nemmeno quando
            Aurenne geme nel sonno sulla tua spalla.
          effetti: { contaminazione: 1 }
          segue: il-costruttore-di-capomozzo
      - testo: "Passare come davanti a una Salvaguardia ferma"
        descrizione: "Sulle piattaforme si cammina a passo corto, con le mani in vista, e mai in mezzo a due sensori."
        quando: [origine.apprendista-raschiatore >= 1]
        costo: 0
        esito:
          titolo: Passo corto
          testo: |
            Il corpo lo sa prima di te, come la sera del Festival davanti alla
            porta nord. Abbassi le spalle e tieni le mani aperte lontano dalla
            cintura. Cammini a passi corti, sempre sul fianco di una macchina e
            mai fra due, perché una Salvaguardia ferma si sveglia quando due
            sensori vedono la stessa cosa, e arrivi alla fenditura senza che
            nessuna si muova.
          pe: { tecnologia: 5 }
          effetti: { contaminazione: 1 }
          segue: il-costruttore-di-capomozzo
      - testo: "Riconoscere la nota dei cristalli del banco"
        descrizione: "Al Festival i cristalli dell'Accademia hanno vibrato con questa stessa nota, poco prima che arrivassero le macchine."
        quando: [origine.allievo-di-torvessa >= 1]
        costo: 0
        esito:
          titolo: La nota del banco
          testo: |
            Il ronzio delle macchine ha la nota che al banco dell'Accademia, la
            sera della razzia, ha fatto rispondere insieme sei cristalli, e
            stavolta conti fino in fondo i due impulsi brevi e quello lungo.
            *Aspettano l'ordine che le ha chiamate in città, e chi lo dava ce l'ho
            sulla spalla.* Passi in mezzo al cerchio ripetendo la sequenza a mezza
            voce, per scriverla a Temmerin.
          effetti: { contaminazione: 1, informazioni.voce: 1 }
          segue: il-costruttore-di-capomozzo

  - id: il-costruttore-di-capomozzo
    tipo: seguito
    immagine: ambientazione/cicatrice-del-mondo
    titolo: Il titano dormiente
    sommario: "Dietro la fenditura c'è un colosso dei Precursori con un nucleo rosso nel petto squarciato. Si sta alzando."
    luogo: Sotto Capomozzo, oltre la fenditura
    area: cuore-di-capomozzo
    requisiti: [pista.capomozzo == 5]
    testo: |
      Nella cavità enorme oltre la fenditura giace mezza sepolta fra i rottami
      una forma colossale, con un nucleo rosso che batte nel torace squarciato.
      La testa, un cilindro senza faccia, gira verso di te due fessure verticali
      accese, e senti quella luce passarti addosso e pesarti, come la mano di un
      mercante sulla bilancia.

      {origine fuggiasco-di-ghoran} La luce si ferma sulle spalle e sulle cosce,
      dove si fermavano gli occhi dei compratori di Ghoran, e il corpo si
      raddrizza da solo per sembrare più forte.

      {tecnologia Difficile} Il nucleo batte storto, con una pausa troppo lunga
      ogni due colpi, e una macchina così grande non regge a lungo un cuore che
      perde il ritmo.

      Poi si alza in una pioggia di scintille, alto quanto quattro case una
      sopra l'altra. Un braccio gli pende inerte fino ai detriti, che salgono a
      gradoni verso il suo petto. È il Costruttore che Aurenne voleva liberare,
      come scriveva Isvaro nel suo diario.

      Posi Aurenne dietro un blocco di pietra. Il colosso alza il braccio buono,
      e la sua ombra copre te e lei insieme.
    opzioni:
      - testo: "Affrontarlo"
        descrizione: "Il nucleo è nel petto, molto in alto, ma lui si muove piano e un braccio non lo usa più."
        combattimento: costruttore
        vittoria:
          titolo: Il ginocchio di ferro
          testo: |
            Lo colpisci alle giunture delle gambe, dove le lastre si aprono, e
            scappi ogni volta che il braccio buono scende, con lo spostamento
            d'aria che ti spinge avanti. Al quinto colpo un ginocchio cede con uno
            schianto, e il colosso si piega su se stesso con la luce del nucleo
            che trema, piantando la mano a terra per non cadere.
          segue: la-maschera-spaccata
        sconfitta:
          titolo: La mano
          testo: |
            La mano del colosso scende piatta e ti prende in pieno, e ti ritrovi
            nella polvere con la bocca piena di sangue e una gamba che non
            risponde. Lui rialza il braccio per finire il lavoro, ma a metà del
            gesto il nucleo gli sfarfalla nel petto e lui vacilla.
          segue: la-maschera-spaccata
      - testo: "Confonderlo con il disco"
        descrizione: "Il disco parla ai nuclei delle macchine, e più ti avvicini a questo, più scalda."
        requisiti: [oggetto.congegno-di-controllo >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Difficile }
        successo:
          titolo: La corona accesa
          testo: |
            Corri sotto il colosso con il disco alzato verso il nucleo, e i
            cristalli della corona si accendono tutti insieme, bianchi. Il braccio
            buono si ferma a metà del colpo, tremante, mentre il nucleo perde il
            ritmo e il colosso vacilla all'indietro. I cristalli ti scottano il
            palmo, ma la mano ha deciso prima della testa che il dolore può
            aspettare.
          pe: { tecnologia: 10 }
          segue: la-maschera-spaccata
        fallimento:
          titolo: Il disco che brucia
          testo: |
            Il disco ti si scalda in mano finché non riesci più a tenerlo, e il
            colosso rallenta appena. Il braccio scende a un passo da te e spacca
            il pavimento, e una scheggia ti si pianta nella coscia fino a metà.
            Però il nucleo ha perso il ritmo, e mentre raccogli il disco con la
            manica il colosso barcolla.
          effetti: { ferite: 2, contaminazione: 1 }
          segue: la-maschera-spaccata
      - testo: "Dargli un ordine nella sua lingua"
        descrizione: "È la macchina più grande della Salvaguardia, e anche lei ha imparato a obbedire, una volta."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Fermati
          testo: |
            Pianti i piedi e gli gridi l'ordine nella lingua delle macchine, una
            parola sola che ti raschia la gola. Il colosso si ferma, e per un
            tempo lunghissimo le fessure del suo volto restano su di te. Poi il
            nucleo trema, e lui vacilla con due ordini diversi nel petto, nessuno
            dei due più forte dell'altro.
          pe: { magia: 10 }
          segue: la-maschera-spaccata
        fallimento:
          titolo: La risposta
          testo: |
            L'ordine gli arriva storto, e lui ti risponde con un suono che ti
            entra nelle ossa del cranio e ti butta a terra con il naso che
            sanguina. Fa due passi verso di te, e al terzo il nucleo gli sfarfalla
            nel petto e lui vacilla, come se la parola sbagliata gli fosse rimasta
            dentro.
          effetti: { tormento: 1.5, ferite: 1 }
          segue: la-maschera-spaccata
      - testo: "Arrampicarti fino al nucleo"
        descrizione: "I detriti salgono fino al suo petto. È una follia, e potrebbe essere l'unica cosa che funziona."
        prova: { attributo: fisico, abilita: [atletica, acrobazia, resistenza], difficolta: Difficile }
        successo:
          titolo: Il petto aperto
          testo: |
            Corri su per i detriti mentre il braccio buono spazza l'aria sopra la
            tua testa, e dalla cima salti. Ti aggrappi al bordo del torace
            squarciato, con il metallo caldo che ti brucia le mani, e colpisci il
            nucleo una volta con tutto quello che hai. Il colosso barcolla, e tu
            cadi nella polvere da un'altezza che ti lascia intontito, ridendo
            senza riuscire a trattenerti.
          pe: { atletica: 10 }
          segue: la-maschera-spaccata
        fallimento:
          titolo: La caduta
          testo: |
            Arrivi al nucleo e lo colpisci, ma il colosso si gira e ti scrolla via
            come una mosca dalla manica. Cadi di schiena sui detriti, con un
            rumore che preferiresti non aver sentito da dentro, e resti a terra
            senza fiato. Sopra di te il nucleo sfarfalla dove l'hai colpito, e il
            colosso vacilla.
          effetti: { ferite: 2 }
          segue: la-maschera-spaccata
      - testo: "Salire dal lato del braccio morto"
        descrizione: "Il braccio morto gli pende fino ai detriti, e ci si sale a forza di braccia come su una palizzata."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza, rissa], difficolta: Difficile }
        successo:
          titolo: Il braccio morto
          testo: |
            Ti aggrappi alle piastre del braccio morto e sali a forza di braccia,
            con il metallo caldo che ti brucia i palmi, e lui non ti sente, perché
            da quella parte non sente più niente. Arrivato al bordo del torace
            squarciato colpisci il nucleo a pugni chiusi finché le nocche non si
            aprono, e mentre il colosso barcolla ti lasci scivolare giù lungo il
            braccio.
          pe: { resistenza: 10 }
          segue: la-maschera-spaccata
        fallimento:
          titolo: La presa che cede
          testo: |
            Quasi in cima una piastra del braccio ti si stacca sotto le dita, e cadi
            sui detriti di schiena da un'altezza che le ossa ricorderanno a lungo. Il
            nucleo però l'hai colpito una volta, con tutto il peso, e sopra di te la
            luce rossa sfarfalla mentre il colosso vacilla.
          effetti: { ferite: 2 }
          segue: la-maschera-spaccata
      - testo: "Aspettare la pausa del suo cuore"
        descrizione: "Il nucleo batte storto, e al Circolo impari ad aspettare che una bestia ferita perda le forze."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Difficile }
        successo:
          titolo: La pausa
          testo: |
            Resti fermo dalla parte del braccio morto e ascolti il nucleo come al
            Festival ascoltavi il cinghiale ferito, finché riconosci la pausa
            troppo lunga dopo ogni coppia di colpi. Alla terza pausa gli corri fra
            le gambe, e il colosso si gira di scatto per seguirti proprio quando
            il cuore gli manca. Il peso gli va tutto su un ginocchio, e il
            ginocchio non regge.
          pe: { natura: 10 }
          segue: la-maschera-spaccata
        fallimento:
          titolo: Il colpo in più
          testo: |
            Conti male la pausa, e la mano del colosso scende mentre sei ancora
            sotto di lui. Lo spostamento d'aria ti butta a terra con il naso che
            sanguina e un fischio in un orecchio, ma si è girato troppo in fretta,
            e adesso vacilla con il nucleo che sfarfalla nel petto.
          effetti: { tormento: 1.5, ferite: 1 }
          segue: la-maschera-spaccata

  - id: la-maschera-spaccata
    tipo: seguito
    immagine: ambientazione/le-maschere
    titolo: La maschera spaccata
    sommario: "Il tempo si ferma, e davanti a te una maschera spaccata in due si ricompone."
    luogo: Sotto Capomozzo, oltre la fenditura
    area: cuore-di-capomozzo
    requisiti: [pista.capomozzo == 5]
    testo: |
      Il Costruttore vacilla e la luce del nucleo trema fra il rosso e il viola
      sempre più in fretta. Quando sembra sul punto di cadere si raddrizza
      un'altra volta, e in quel momento il tempo si ferma.

      Le scintille restano sospese a mezz'aria e la polvere si ferma a metà
      della caduta. Non senti più il ronzio della rovina, e nemmeno il tuo
      cuore.

      {resilienza Media} Hai paura, e la paura è l'unica cosa che si muove
      ancora. Tienila stretta, perché ti ricorda che sei vivo.

      Davanti a te, nel buio, sorge una figura altissima e incappucciata, con il
      corpo coperto di occhi. L'hai già vista una volta, la notte prima del
      Festival, in un sogno che al mattino avevi messo da parte. Ha le
      proporzioni del colosso, ed è com'era lui prima di diventare questa
      carcassa.

      Fra te e la figura galleggia una maschera spaccata in due, come nel sogno.
      Le due metà si cercano finché diventano un volto solo, che cambia forma
      ogni volta che sbatti le palpebre, e dentro di te parla una voce che è la
      tua, moltiplicata in un coro lontano. «Ti abbiamo cercato in fondo a ogni
      tuo respiro, e adesso ti abbiamo trovato, Portatore dell'Alba.»

      Il volto smette di cambiare, e ha preso la forma che hai deciso di vedere.
    opzioni:
      - testo: "Vedere una maschera di ferro brunito"
        descrizione: "Un volto di donna impassibile, e dalle fessure scende una nebbia rossa. È la volontà di restare in piedi."
        costo: 0
        esito:
          titolo: La Maschera della Forza
          testo: |
            La maschera è di ferro brunito, con un volto di donna inciso a linee
            sottili, e dalle fessure scende una nebbia rossa che ti senti addosso
            come un'armatura che ti sta bene. Il tempo riparte. Ti lanci in avanti
            prima ancora di deciderlo, con una scia scarlatta nell'aria, e
            trapassi la corazza del colosso fino al nucleo. La luce rossa esplode
            e ti travolge, e poi c'è silenzio.
          effetti: { oggetto.maschera-della-forza: 1 }
          segue: la-corsa-all-ascensore
      - testo: "Vedere una maschera d'oro opaco"
        descrizione: "Liscia e senza bocca, piange luce bianca, ed è di chi ha ritrovato il divino nelle cose di ogni giorno."
        costo: 0
        esito:
          titolo: La Maschera della Rottura
          testo: |
            La maschera è d'oro opaco e non ha bocca, e dagli occhi le scendono
            due rivoli di luce bianca. Ti vengono in mente i forni della Città
            Bassa all'alba, e per un momento hai fame di una fame buona. Il tempo
            riparte. Vai addosso al colosso urlando, e il colpo arriva al nucleo.
            La luce rossa esplode e ti travolge, e poi c'è silenzio.
          effetti: { oggetto.maschera-della-rottura: 1 }
          segue: la-corsa-all-ascensore
      - testo: "Vedere una maschera di vetro incrinato"
        descrizione: "Trasparente, con dietro ombre come mani giunte, e ogni scheggia riflette una convinzione forse non tua."
        costo: 0
        esito:
          titolo: La Maschera della Distorsione
          testo: |
            La maschera è di vetro incrinato, e dietro si muovono ombre che
            sembrano mani giunte. In ogni scheggia c'è un pensiero che forse non è
            tuo, e non ti importa quanto dovrebbe. Il tempo riparte. Dal palmo che
            allunghi verso il colosso esce un raggio di luce dorata che incide la
            corazza dritto fino al nucleo. La luce rossa esplode e ti travolge, e
            poi c'è silenzio.
          effetti: { oggetto.maschera-della-distorsione: 1 }
          segue: la-corsa-all-ascensore
      - testo: "Vedere una maschera di corteccia nera"
        descrizione: "Corteccia e muschio con vene di metallo, che legano quello che cresce a quello che è stato costruito."
        costo: 0
        esito:
          titolo: La Maschera della Natura
          testo: |
            La maschera è di corteccia nera e muschio, attraversata da vene di
            metallo in cui scorre una linfa lucente, e ha un odore di bosco dopo
            la pioggia. Il tempo riparte. Alzi il braccio, e dal pavimento
            esplodono radici e tubi di metallo che inchiodano a terra il colosso,
            e una radice gli sale nel petto fino al nucleo. La luce rossa esplode
            e ti travolge, e poi c'è silenzio.
          effetti: { oggetto.maschera-della-natura: 1 }
          segue: la-corsa-all-ascensore

  - id: la-corsa-all-ascensore
    tipo: seguito
    immagine: ambientazione/rovine-dei-precursori
    titolo: La corsa
    sommario: "Il Costruttore è caduto, e la rovina gli sta crollando dietro."
    luogo: Sotto Capomozzo, la rovina che crolla
    area: cuore-di-capomozzo
    requisiti: [pista.capomozzo == 5]
    testo: |
      Il colosso è immobile, mezzo distrutto, con il nucleo spento, e davanti al
      tuo viso galleggia la maschera, trasparente, grande tre volte la tua
      faccia.

      Il primo tremore sembra l'eco del colpo, il secondo ti butta in ginocchio.
      Dal soffitto piovono polvere e schegge di metallo, e le pareti di
      Magnistruttura si incrinano con il rumore del ghiaccio sotto i piedi,
      anche se al Grifone dicono che quel metallo non si rompe.

      La maschera svanisce, e il corpo del Costruttore si spezza in due
      portandosi dietro un pezzo di pavimento. Aurenne è dove l'hai lasciata e
      respira ancora. Fino all'ascensore ci sono quattrocento metri di passaggio
      sospeso, e il passaggio si sta piegando.
    opzioni:
      - testo: "Prenderla in braccio e correre"
        descrizione: "Quattrocento metri. Meglio non pensare a quanti sono."
        costo: 0
        esito:
          titolo: La risalita
          testo: |
            Te la prendi in braccio e corri, mentre il passaggio si apre in
            fenditure incandescenti e pezzi di Magnistruttura cadono nel buio. Salti
            sulla piattaforma, e l'ascensore sale mentre sotto di te la rovina
            crolla con un tuono che non finisce più.

            Fra le candele dorate ti lasci cadere accanto ad Aurenne. Sopra ci sono
            la fortezza degli orchi e due giorni e mezzo di strada fino a Qir-Azel.
          imposta: { pista.capomozzo: 6 }
          vai: quartieri-alti
          segue: il-ritorno-a-qir-azel
      - testo: "Correre curvo, come quando cede un'impalcatura"
        descrizione: "Sulle piattaforme della Cicatrice si corre bassi sul lato attaccato alla parete, che cade per ultimo."
        quando: [origine.apprendista-raschiatore >= 1]
        costo: 0
        esito:
          titolo: Il lato della parete
          testo: |
            Te la carichi in spalla e corri curvo, come sulle piattaforme quando
            un'impalcatura cede, tenendoti attaccato alla parete e saltando le
            fenditure incandescenti. Le incisioni dell'ascensore si accendono sotto i
            tuoi stivali.

            Fra le candele dorate posi Aurenne e ti siedi accanto a lei, con le mani
            sulle ginocchia per fermarle. Sopra ci sono la fortezza degli orchi e due
            giorni e mezzo di strada fino a Qir-Azel.
          pe: { atletica: 5 }
          imposta: { pista.capomozzo: 6 }
          vai: quartieri-alti
          segue: il-ritorno-a-qir-azel
