# La pista delle cinque tribù (pista.tribu 0 → 4): le brutte notizie in Municipio, la cena con
# Ilvaena al Grifone di Ferro e, dopo la spedizione nella Palude Acquanera (passo 2 → 3, in un altro
# file), il rapporto in Municipio. Più due carte legate alla pista.
#
# Per chi scrive la Palude: la quality nascosta `bolgrum` (definita qui sotto) dice com'è finita nella
# torre e va impostata nel cuore della spedizione, in tutti i rami che portano pista.tribu a 3.
#   bolgrum: 1  Bolgrum e Skarr sono morti (uccisi in combattimento o in qualunque altro modo)
#   bolgrum: 2  Bolgrum e Skarr sono fuggiti nei canali della palude, vivi
# Se resta a 0, il rapporto la tratta come 1. Il rapporto dà per scontato che dalla torre tu abbia
# portato via le pergamene del mago che ci abitava prima degli orchi.
quality:
  - { id: bolgrum, immagine: personaggi/bolgrum, nome: Bolgrum, categoria: stato, nascosta: true, descrizione: "Com'è finita nella torre della Palude Acquanera. 1 Bolgrum e Skarr morti, 2 fuggiti vivi nei canali." }
  - { id: cena.tribu, nome: Ilvaena ti ha descritto le tribù, categoria: stato, nascosta: true }
  - { id: cena.eroi, nome: Ilvaena ti ha descritto gli eroi orchi, categoria: stato, nascosta: true }
  - { id: cena.zagrath, nome: Ilvaena ti ha parlato di Zagrath, categoria: stato, nascosta: true }
  - { id: cena.stroud, nome: Hai nominato Stroud a Ilvaena, categoria: stato, nascosta: true }

storylet:
  # ------------------------------------------------------------ 0 → 1 · le brutte notizie
  - id: brutte-notizie-in-municipio
    presso: municipio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: Brutte notizie in Municipio
    sommario: "Lo sceriffo ti manda a chiamare in Municipio. L'esploratrice che aspettava è tornata dai boschi, e le notizie che porta sono cattive."
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [pista.tribu == 0, pista.dama-argento >= 11, pista.sepolcro >= 7]
    testo: |
      Il biglietto dello sceriffo dice soltanto *Municipio, subito*, e la
      calligrafia è quella di uno che scrive in piedi. Il Municipio sta
      all'incrocio fra Via del Velo e la Cattedrale, due piani di pietra
      chiara con le sentinelle in cima alla scalinata. Nell'atrio una targa
      d'ottone indica la scala per la banca cittadina, nel seminterrato, con
      la parola *provvisoria* e una data di quarant'anni fa, lucidata ogni
      mattina da qualcuno che evidentemente ci crede ancora.

      Al piano di sopra la porta dell'ufficio della Rappresentante è aperta.
      Julia Castaldi siede dietro la scrivania con le braccia conserte, e
      davanti a lei Toren Galdrick ascolta un'elfa dai capelli ramati,
      infangata fino alle ginocchia. «Entra pure» dice Julia con la voce
      roca. «Ormai queste faccende riguardano anche te.» Galdrick te la
      presenta come Ilvaena Sorathe della guardia cittadina, poi aggiunge
      «non ufficiale», e lei ride scuotendo la testa.

      {galateo Facile} La Rappresentante non si è alzata, e lo sceriffo non
      si è seduto. In questa stanza le sedie dicono chi comanda meglio dei
      titoli.

      {origine figlio-della-citta-bassa} Lo sceriffo, in Città Bassa, l'hai
      sempre visto da dietro un angolo, e quando passava si abbassava la voce
      in tutto il vicolo. Adesso ti fa un cenno come a un collega, e le tue
      mani, che della promozione non sono state informate, cercano lo stesso
      le tasche.

      Ilvaena racconta che alla razzia c'erano tutte e cinque le tribù del
      circondario, e a memoria d'elfo non si erano mai mosse insieme. Ieri a
      Fondobosco ha sentito dei reduci malconci farfugliare degli eretici
      che in città gli avevano ammazzato tanti guerrieri. «Parlavano di
      voi difensori» dice. «Le bestiacce litigano sempre fra loro, a meno di
      avere in testa una cosa grossa, e per le cose grosse serve un capo
      grosso.»

      {natura Media} Il fango sui suoi stivali è nero e fine, con dentro
      aghi di pino rossi. Viene dai versanti alti, dove la terra resta
      bagnata anche d'estate, e lei ci ha camminato per giorni.

      Galdrick tiene i pollici nella cintura e dice un nome solo, Balthog,
      a voce bassa. Ti si secca la bocca prima ancora di aver capito
      perché. *È lo stesso nome che stava nel nucleo della macchina.* Julia
      annota il nome senza commentare, e lo sceriffo si volta verso di te.
      «Nei prossimi giorni fatti vedere in città» dice. «Se la gente ti
      incontra per strada si preoccupa meno.»
    opzioni:
      - testo: "Rispondere per primo allo sceriffo"
        descrizione: "Galdrick chiede una cosa sola e si aspetta una risposta netta."
        immagine: personaggi/toren-galdrick
        esito:
          titolo: In giro per la città
          testo: |
            Gli dici di sì, senza giri di parole. Galdrick annuisce una volta
            e tira fuori il taccuino dalla giubba, con la copertina gonfia di
            umidità, e ti pare di vederci il tuo nome accanto a un turno di
            ronda. «Il mercato la mattina e i ponti la sera» dice. «Basta che
            ti vedano.»

            Ilvaena si stira la schiena, e le vertebre le scrocchiano una
            dopo l'altra. Ti invita a cena stasera al Grifone di Ferro. Vuole
            sentire la razzia da chi c'era, e in cambio ti racconterà le tribù
            una per una. Adesso va a lavarsi e a dormire un giorno intero.
            Julia scioglie le braccia giusto il tempo di dirti che la porta
            del suo ufficio, per te, resta aperta.
          effetti: { pista.tribu: 1, rep.caserma: 0.5 }
      - testo: "Chiedere a Ilvaena degli eretici"
        descrizione: "Gli orchi hanno trovato un nome per chi ha difeso la città, e lei l'ha sentito dire."
        immagine: personaggi/ilvaena-sorathe
        esito:
          titolo: Eretici
          testo: |
            Ilvaena ci pensa mentre si gratta via una crosta di fango dal
            polsino, e la crosta cade sul tappeto della Rappresentante. Gli
            orchi di Fondobosco quella parola la dicevano a bassa voce,
            racconta, nello stesso modo in cui si nomina una malattia. «Su che
            cosa credano le bestiacce ne so meno di quanto vorrei» dice. «So
            che di voi hanno paura, e un orco la paura la ammette
            malvolentieri.»

            {resilienza Media} Ti fa uno strano effetto essere la malattia di
            qualcuno. Lo metti da parte, insieme alle altre cose a cui
            penserai di notte.

            Poi ti invita a cena al Grifone di Ferro, stasera. Vuole sentire la
            razzia da chi c'era, e in cambio ti racconterà le tribù. Allo
            sceriffo dici di sì, e Julia Castaldi aggiunge che per qualunque
            cosa il suo ufficio è qui. Ilvaena, uscendo, ti batte due dita
            sulla spalla.
          pe: { natura: 5 }
          effetti: { pista.tribu: 1, rep.caserma: 0.5 }
      - testo: "Rivolgerti alla Rappresentante"
        descrizione: "Julia Castaldi finora ha soltanto ascoltato. Le udienze, si dice, le fa brevi."
        immagine: personaggi/julia-castaldi
        esito:
          titolo: Le pratiche già lette
          testo: |
            Julia ti ascolta con la mano posata su una pratica chiusa, e
            risponde prima che tu abbia finito la frase, cosa che a lei
            sembra una cortesia. «I cittadini mi hanno scelta quando nessuno
            aveva paura di niente» dice. «Adesso che hanno paura non intendo
            deluderli. Se ti serve qualcosa sali qui e chiedilo chiaro, che di
            giri di parole in questo ufficio ne sento già abbastanza.»

            Allo sceriffo dici di sì, e lui annuisce una volta. Ilvaena ti
            invita a cena stasera al Grifone di Ferro, la tua razzia in cambio
            delle sue tribù, poi esce sbadigliando nella manica e lasciando
            sul pavimento due impronte di fango ben fatte.
          effetti: { pista.tribu: 1, rep.castaldi: 0.5 }
      - testo: "Restare in silenzio e ascoltare"
        descrizione: "Lasci parlare loro. Da come si guardano si capisce chi decide che cosa."
        esito:
          titolo: Accanto alla porta
          testo: |
            Resti accanto alla porta, con la spalla contro lo stipite, e lasci
            parlare loro. Ilvaena dice le cose come le ha viste, con le date
            giuste. Lo sceriffo ripete i nomi a mezza voce per fissarli, e
            muove le labbra anche dopo. Julia scrive poco, e quando Ilvaena
            nomina Fondobosco sottolinea una riga due volte.

            {percezione Media} La seconda riga la tira più forte, e la punta
            della penna buca la carta. Fondobosco, per lei, era già un
            problema prima di stamattina.

            Alla fine Julia si accorge che non hai aperto bocca, e ti
            ringrazia proprio per questo, perché da una settimana in
            quell'ufficio parlano tutti. Allo sceriffo rispondi con un cenno,
            che gli basta. Ilvaena ti invita a cena stasera al Grifone di
            Ferro e se ne va a dormire.
          pe: { percezione: 5 }
          effetti: { pista.tribu: 1, rep.castaldi: 0.5 }
      - testo: "Salutare Julia come si saluta nei giorni di consiglio"
        descrizione: "La tua famiglia siede ai tavoli del Consiglio da prima che tu nascessi. Julia quella formula la riconosce al primo inchino."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Due sedie più in là
          testo: |
            Fai il mezzo inchino che si usa in Municipio nei giorni di seduta,
            con la mano sul petto e gli occhi sulla scrivania. Il corpo se lo
            ricorda meglio di te, e Julia scioglie le braccia. «Al Festival
            sedevi due sedie più in là» dice. «A tavola, da voi, si parla di
            dazi anche con il salmone nel piatto.» Poi, più piano, ti chiede
            se a casa tua si dorme, in questi giorni. Le dici di no, e lei
            annuisce come se le avessi confermato una cifra già scritta.

            Allo sceriffo rispondi di sì. Ilvaena ti invita a cena stasera al
            Grifone di Ferro, la tua razzia in cambio delle sue tribù, e Julia
            ti accompagna alla porta di persona, cosa che in quell'ufficio non
            fa per nessuno.
          pe: { galateo: 5 }
          effetti: { pista.tribu: 1, rep.castaldi: 0.5 }
      - testo: "Dire allo sceriffo dove farti vedere"
        descrizione: "Galdrick vuole che la gente ti incontri per strada. In Città Bassa sai quali strade contano, e a che ora."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Le strade giuste
          testo: |
            Gli dici di sì, e poi gli dici che il mercato la mattina serve a
            poco, perché ci vanno le serve dei Quartieri Alti. In Città Bassa
            la gente che parla sta alla fontana verso mezzogiorno e davanti
            alle fucine al cambio di turno, quando i fabbri escono a bere.
            Galdrick ti guarda un momento più a lungo del necessario, poi
            corregge il taccuino con la matita senza discutere.

            Ilvaena ride e ti invita a cena stasera al Grifone di Ferro, la
            tua razzia in cambio delle sue tribù. Julia scioglie le braccia
            giusto il tempo di dirti che la porta del suo ufficio, per te,
            resta aperta.
          pe: { conoscenze-della-strada: 5 }
          effetti: { pista.tribu: 1, rep.caserma: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · la cena al Grifone
  - id: cena-con-ilvaena
    presso: grifone-di-ferro
    immagine: personaggi/ilvaena-sorathe
    titolo: Cena con Ilvaena
    sommario: "Al Grifone di Ferro Ilvaena Sorathe ti aspetta al tavolo d'angolo. Vuole la tua razzia, e in cambio ti dà le tribù."
    luogo: Locanda del Grifone di Ferro, la sera
    area: ponti-sospesi
    requisiti: [pista.tribu == 1]
    testo: |
      La sera il Grifone di Ferro è pieno di Raschiatori appena tornati dal
      turno, e il vapore della zuppa appanna le finestre ancora inchiodate.
      Qualcuno ci ha scritto sopra col dito un nome e un cuore, e il cuore
      sta già colando. Ilvaena Sorathe ha preso il tavolo d'angolo e quasi
      non la riconosci. Si è lavata i capelli, che adesso sono di un rame
      acceso e le arrivano alle scapole, e a giudicare dagli occhi ha
      dormito. L'arco lungo è appoggiato al muro senza la corda, e la
      faretra occupa la sedia accanto, così nessuno ci si siede.

      {origine apprendista-raschiatore} Metà delle facce ai tavoli le hai
      viste sulle piattaforme della Cicatrice, ancora grigie di polvere. Un
      ragazzo del tuo turno ti alza il boccale da lontano e indica Ilvaena
      col mento. Domani, sulle piattaforme, vorrà sapere tutto.

      {armi-da-distanza Media} Un arco così, senza corda, è un bastone
      molto costoso. La corda ce l'ha addosso, arrotolata nel polsino
      sinistro, e ci mette meno a montarla di quanto ci metti tu ad alzarti.

      «Prima la tua razzia» dice, e ti spinge davanti un boccale. «A
      Fondobosco l'ho sentita raccontare dagli orchi, e raccontano male.»

      Le racconti la razzia da dove l'hai vista tu, e quello che in città si
      dice degli orchi che si sono gettati nella Cicatrice pur di non farsi
      prendere. Ilvaena ascolta con il mento sul pugno e ogni tanto ti ferma
      per chiederti da che parte soffiava il vento. Brunella Fennick vi
      mette davanti due scodelle di stufato e resta lì finché non hai preso
      la prima cucchiaiata, e lo stomaco ti ringrazia prima della bocca. In
      fondo alla sala Liaren Tarvelin accorda il samisen e ogni tanto guarda
      verso il vostro tavolo, perché Ilvaena è la sua amica più vecchia.

      {empatia Facile} Liaren sbaglia la stessa corda due volte. Le amiche
      vecchie tornano di rado, e lei vuole sentire tutto senza darlo a
      vedere.

      Quando hai finito, Ilvaena posa il boccale e si pulisce la schiuma dal
      labbro con il dorso della mano. *Adesso tocca a lei, e lo sa.*
      «Chiedi» dice.
    opzioni:
      - testo: "Chiederle delle cinque tribù"
        descrizione: "Lei le insegue da anni, e qualche volta le sfoltisce."
        immagine: fazioni/tribu-fondobosco
        requisiti: [cena.tribu == 0]
        costo: 0
        esito:
          titolo: Cinque tribù
          testo: |
            Ilvaena le conta sulle dita, cominciando dal pollice, che ha un
            callo bianco dove passa la corda. Gli Spiumatori stanno nelle
            grotte sul versante ovest del Gradone Rosso, e sono i meno
            aggressivi; mangiano uccelli crudi e assalgono solo chi viaggia da
            solo. Gli Spacca-ossa vivono a sud nella Palude Acquanera. Nuotano
            come lontre e ti aspettano sott'acqua invece di inseguirti. Nel
            Bosco della Forca ci sono i Nove Chiodi, che assaltano le carovane
            e con il ferro rubato si fanno armi e palizzate. Più a est del
            Gradone c'è Fondobosco, la tribù più grande, che potrebbe
            schiacciare la città da sola se le famiglie non passassero l'anno
            a sgozzarsi fra loro.

            {accademiche Media fallita} Dovresti sapere perché si chiama
            Gradone Rosso. Lo hai letto da qualche parte, in un libro con la
            copertina verde, e del libro ricordi soltanto la copertina.

            «L'ultima è Capomozzo, su un'isola al largo di Rovolungo» dice, e
            si guarda il mignolo. «Vista da nord pare una testa mozzata. È il
            covo migliore della regione, e loro lo sanno.»
          imposta: { cena.tribu: 1 }
          segue: cena-con-ilvaena
      - testo: "Chiederle degli eroi orchi"
        descrizione: "Fra gli orchi ce ne sono pochi che si fanno un nome. Quei pochi, Ilvaena li conosce."
        immagine: personaggi/borgoth-il-gigante
        requisiti: [cena.eroi == 0]
        costo: 0
        esito:
          titolo: Sei nomi
          testo: |
            «Gli orchi vivono poco e male» dice Ilvaena, «e quando uno si fa un nome
            se l'è guadagnato.» Adesso ne conta sei, e le dita di una mano non
            bastano più. Borgoth il Gigante è di Fondobosco, figlio di un orco e di
            una ogre, e gli interessa cacciare più che comandare. Uzgreth era il
            campione dei Nove Chiodi, con un pessimo carattere e una spada da ogre
            troppo grande anche per lui. Mesi fa ha trovato un nascondiglio in una
            caverna ed è sparito, e i suoi lo credono un fantasma che sgozza chi va
            a cercarlo. Nella Palude c'è Bolgrum, il capotribù, così grasso che non
            si alza più dal trono, e con lui Skarr, che mangia carne d'orco quando
            non trova di meglio.

            Poi c'è Balthog il Prescelto, a Capomozzo. «Dorbak, quello del
            cinghiale corazzato, era il suo braccio destro» dice, e alza il
            boccale verso di te, e la mano ti va da sola al punto dove il
            cinghiale ti è passato più vicino. Il sesto è il mezzogre Zagrath,
            e quando lo nomina Ilvaena abbassa la voce.
          imposta: { cena.eroi: 1 }
          segue: cena-con-ilvaena
      - testo: "Chiederle di Zagrath"
        descrizione: "Quel nome l'ha detto più piano degli altri."
        immagine: personaggi/zagrath
        requisiti: [cena.eroi == 1, cena.zagrath == 0]
        costo: 0
        esito:
          titolo: Una guerra privata
          testo: |
            Zagrath vive nel nord di Rovolungo e gira fra le cinque tribù
            con la merce rubata alle carovane, che rivende agli orchi in cambio
            di alcol e di notizie, a volte di frecce incantate. Lo accolgono
            dappertutto e non si fidano di lui da nessuna parte. Gli elfi li
            odia più di qualunque altra cosa. Ilvaena si tocca una cicatrice
            bianca sotto la clavicola, mezza nascosta dal colletto, e ti dice
            che si sono affrontati più volte senza che nessuno dei due l'abbia
            mai spuntata.

            {medicina Media} Una freccia entrata dall'alto, e tolta da
            qualcuno che aveva fretta. Mezzo dito più in basso e stasera
            mangeresti da solo.

            «Ha un arco lungo quanto me» dice, «e la mira ce l'ha migliore
            della mia.» Beve un sorso. «Prima o poi uno dei due cade, e ho
            deciso da un pezzo che non sarò io.»
          imposta: { cena.zagrath: 1 }
          segue: cena-con-ilvaena
      - testo: "Nominare Dolovan Stroud"
        descrizione: "I cavalli per la caccia di Corin te li ha sellati lui. Stroud gli orchi li odia quanto lei."
        immagine: personaggi/dolovan-stroud
        requisiti: [pista.corin >= 2, cena.stroud == 0]
        costo: 0
        esito:
          titolo: Le Scuderie della Zanna Rotta
          testo: |
            Le dici che i cavalli per la caccia di Corin te li ha dati Dolovan
            Stroud, e Ilvaena posa il cucchiaio nella scodella e lo riprende
            subito dopo. «Ha ancora Squash, quel bestione?» chiede, e quando
            le dici di sì sorride al piatto. Sono stati insieme a lungo,
            racconta, poi lui l'ha voluta qui in città, e lei aveva già scelto
            i confini di Velthar.

            «Ci parliamo poco» dice. «Ci guardiamo parecchio, però.» Gira il
            cucchiaio nello stufato che si è già raffreddato. In fondo alla
            sala Liaren ha smesso di accordare il samisen e fa finta di niente
            con una certa fatica.
          imposta: { cena.stroud: 1 }
          segue: cena-con-ilvaena
      - testo: "Chiederle che cosa si può fare"
        descrizione: "Lo sceriffo vorrà sapere dove colpire, e Ilvaena un'idea ce l'ha già."
        immagine: ambientazione/palude-acquanera
        requisiti: [cena.tribu == 1, cena.eroi == 1, cena.zagrath == 1]
        esito:
          titolo: La Palude
          testo: |
            Ilvaena disegna la regione con la punta del dito nell'unto del tavolo,
            con Qir-Azel in mezzo e le tribù tutto intorno, e la città viene più
            piccola di quanto ti piacerebbe. Andare contro Capomozzo o Fondobosco
            adesso sarebbe un suicidio, perché sono troppi. Con la Palude Acquanera
            è diverso. Gli Spacca-ossa sono la tribù più piccola e la più isolata, e
            alla razzia hanno perso parecchi guerrieri. Restano Bolgrum e Skarr, che
            insieme fanno paura anche a lei, e una palude dove senza guida ci si
            perde in mezza giornata.

            «Se vuoi far capire alle bestiacce che allearsi costa caro,
            comincia da lì» dice. Poi cancella la mappa con il palmo, e
            Brunella arriva con lo straccio prima che abbia finito. Sul retro
            del conto, più tardi, te la ridisegna a carboncino, con i canali del
            fiume e una croce dove sta la torre.
          pe: { natura: 5 }
          effetti: { pista.tribu: 1 }
      - testo: "Parlarle dei confini di Velthar"
        descrizione: "Lei vive ai margini del Bosco, e tu ci sei cresciuto. I sentieri del Circolo si segnano in un modo che lei conosce."
        quando: [origine.figlio-del-circolo >= 1, cena.tribu == 1, cena.eroi == 1, cena.zagrath == 1]
        esito:
          titolo: Le tre tacche
          testo: |
            Le chiedi da che parte rientra nel Bosco, e quando le racconti del
            Circolo e dei sentieri segnati con tre tacche sulla corteccia Ilvaena
            ride piano e ti dice il nome della radura dove dorme d'estate. Per un
            momento ti sembra di sentire l'odore della resina in mezzo al fumo del
            camino. Poi disegna la regione nell'unto del tavolo. Capomozzo e
            Fondobosco sono troppi, dice. Gli Spacca-ossa della Palude Acquanera
            invece sono pochi e isolati, alla razzia hanno perso parecchi guerrieri,
            e gli restano Bolgrum e Skarr.

            Sul retro del conto ti ridisegna la palude a carboncino, con i
            canali del fiume e una croce dove sta la torre. Accanto ai canali
            aggiunge tre tacche nei punti dove l'acqua è bassa. «Così la leggi
            come la leggerei io» dice.
          pe: { natura: 5 }
          effetti: { pista.tribu: 1, rep.circolo: 0.5 }
      - testo: "Raccontarle dei sorveglianti di Ghoran"
        descrizione: "Gli orchi li hai visti da vicino prima della razzia, nei recinti. Lei vorrà saperlo, e in cambio ti dirà chi conta fra loro."
        quando: [origine.fuggiasco-di-ghoran >= 1, cena.eroi == 0]
        costo: 0
        esito:
          titolo: I recinti
          testo: |
            Le racconti dei sorveglianti orchi di Ghoran, che prima delle
            punizioni cantavano con un verso lungo e uno corto, lo stesso
            ritmo del tamburo in piazza. Ilvaena ti ascolta senza
            interromperti e senza guardarti con pietà, e le sei grato più per
            la seconda cosa che per la prima. «Allora sai già come vanno le
            cose fra loro» dice. «Un orco si fa un nome col sangue, e quei
            pochi che ce l'hanno li conosco tutti.»

            Ti nomina Borgoth il Gigante di Fondobosco, che preferisce la
            caccia al comando, e Uzgreth dei Nove Chiodi, sparito in una
            caverna con una spada da ogre troppo grande anche per lui. Nella
            Palude comanda Bolgrum, insieme a Skarr che mangia carne d'orco
            quando non trova di meglio. A Capomozzo c'è Balthog il Prescelto,
            che aveva Dorbak come braccio destro. Il sesto è il
            mezzogre Zagrath, e quel nome lo dice più piano degli altri.
          imposta: { cena.eroi: 1 }
          segue: cena-con-ilvaena

  # ------------------------------------------------------------ 3 → 4 · il rapporto
  - id: rapporto-in-municipio
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: Rapporto in Municipio
    sommario: "Sei tornato dalla Palude Acquanera con il fango negli orli e un fascio di pergamene. In Municipio ti aspettano in tre."
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [pista.tribu == 3]
    testo: |
      Torni in città con il fango della Palude ancora negli orli dei
      calzoni, e sui gradini del Municipio lasci delle impronte che un
      inserviente segue con lo straccio fino al piano di sopra, una alla
      volta, senza alzare la testa. Nell'ufficio di Julia Castaldi questa
      volta c'è una sedia anche per te. Galdrick resta in piedi lo stesso,
      con i pollici nella cintura. Ilvaena è seduta sul davanzale con un
      ginocchio al petto, e appena entri ti guarda prima gli stivali e poi
      la faccia.

      {resistenza Facile fallita} Le gambe ti ricordano ogni canale guadato
      negli ultimi giorni, e la sedia ti sembra il mobile più bello di
      Qir-Azel.

      Sulla scrivania posi il fascio di pergamene che hai portato via dalla
      torre. Erano di un mago che abitava lassù prima degli orchi, chissà
      quanti anni fa, e sono coperte di simboli e di formule che a
      guardarle troppo a lungo ti fanno pulsare le tempie. Gli orchi non le
      avevano mai toccate, e sopra c'era un dito di polvere. Ti accorgi di
      avere ancora nelle narici l'odore di muffa della torre, e di non
      essere sicuro che se ne andrà con un bagno.

      {magia Media} Anche qui, lontano dalla torre, l'inchiostro tira
      appena verso di te, come la marea tira una barca ormeggiata male.
      Chi le ha scritte ci ha messo dentro più Mana di quanto servisse.

      {origine allievo-di-torvessa} Alcune formule le riconosci dalla forma
      prima di capirle, come la calligrafia di un compagno di banco. Sono
      parenti strette di quelle che all'Accademia si copiano il primo anno,
      ma qui sono scritte con una sicurezza che a te, alla lavagna, non è
      mai venuta.

      Julia scosta la pratica che stava leggendo e intreccia le dita sul
      piano della scrivania. «Dall'inizio» dice. «E senza abbellire, che le
      storie belle me le raccontano già in Consiglio.»
    opzioni:
      - testo: "Raccontare com'è finita nella torre"
        descrizione: "Bolgrum e Skarr non tormenteranno più nessuno."
        requisiti: [bolgrum != 2]
        costo: 0
        esito:
          titolo: La torre vuota
          testo: |
            Racconti la palude e l'isola di fango con la torre in mezzo, fino
            al trono di teschi, e poi come sono morti Bolgrum e Skarr. Mentre
            lo dici le mani ti tornano pesanti, come se avessero ancora
            addosso quel peso. Ilvaena ti fa ripetere due volte la parte di
            Skarr, poi scende dal davanzale. «Gli davo la caccia da anni»
            dice, senza rancore. «Mi hai risparmiato parecchio fango.»

            Galdrick scrive i due nomi sul taccuino e ci tira sopra una riga
            ciascuno. Julia chiede quanti orchi restano nella palude e chi li
            comanderà adesso. Ilvaena risponde che ne restano una decina
            senza un capo, e che per un po' si azzanneranno fra loro.
          segue: rapporto-in-municipio-congedo
      - testo: "Raccontare com'è finita nella torre"
        descrizione: "Bolgrum e Skarr sono scappati nei canali, ma la torre adesso è vuota."
        requisiti: [bolgrum == 2]
        costo: 0
        esito:
          titolo: Nei canali
          testo: |
            Racconti la palude e l'isola di fango con la torre in mezzo, fino
            al trono di teschi. Poi racconti come Bolgrum e Skarr sono
            spariti fra i canali con l'acqua alla cintola. Ilvaena dice che
            Bolgrum non l'aveva mai visto camminare, e che doveva essere uno
            spettacolo, e per un attimo sembra quasi dispiaciuta di esserselo
            perso.

            «Senza torre e senza trono per gli Spacca-ossa è un capo a metà»
            dice. «Skarr invece, da solo, è peggio di prima. Terrò d'occhio i
            villaggi del sud.»

            Galdrick scrive i due nomi sul taccuino e ci mette accanto un punto
            di domanda. Quando Julia chiede se torneranno presto, Ilvaena alza
            le spalle e dice che prima dovranno leccarsi le ferite, e che nella
            palude ci vuole tempo anche per quello.
          segue: rapporto-in-municipio-congedo

  - id: rapporto-in-municipio-congedo
    presso: municipio
    immagine: personaggi/toren-galdrick
    titolo: Una tribù su cinque
    tipo: seguito
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [pista.tribu == 3]
    testo: |
      Julia sfoglia le pergamene una alla volta senza leggerle, e le impila
      con gli angoli pari, battendole due volte sul piano come si fa con un
      mazzo di carte. Le manderà in Biblioteca, dice, dove qualcuno saprà
      dire di chi erano. Poi apre il registro del Consiglio.

      Galdrick parla poco, come sempre. Secondo lui una tribù su cinque ha
      avuto quello che si meritava, e le altre quattro nemmeno se ne sono
      accorte. Il fronte resta largo, dal Bosco della Forca fino al mare di
      Rovolungo, e la Caserma non ha gli uomini per tenerlo. Domattina parte
      per Ghoran a prendere uomini e certi documenti che gli servono, e
      starà via finché a Ghoran non avrà finito, qualche settimana se gli
      va bene. «Mentre sono via tieni d'occhio la città» dice. «Se succede
      qualcosa lo scrivi e lo lasci al sergente di turno.»

      {origine fuggiasco-di-ghoran} Al nome di Ghoran la schiena ti si curva
      di un dito, come quando passavano i sorveglianti, e la raddrizzi prima
      che qualcuno se ne accorga. Ti chiedi che cosa vada a cercare laggiù un
      uomo che non si lascia comprare, in una città dove si compra tutto a
      peso.

      {politica-ed-economia Media} Gli uomini, a Ghoran, si prendono a
      contratto, e i documenti di solito sono quello. Qualcuno in Consiglio
      dovrà firmare una spesa che non ha voglia di firmare.

      Ilvaena tornerà al confine domani all'alba, a guardare che cosa fanno
      le altre tribù adesso che una ha perso la testa. Mentre si allaccia il
      mantello chiede a Galdrick se ha già salutato chi doveva salutare, in
      Via dei Rasoi, e lo sceriffo si sistema la cintura senza rispondere.

      {empatia Difficile} Se la sistema due volte, e la seconda non ce
      n'era bisogno. Quel saluto non l'ha ancora fatto, e lo sta già
      rimandando a stanotte.

      Julia intanto scrive una cifra sul registro, la ricompensa del
      Consiglio, e la sottolinea.
    opzioni:
      - testo: "Accettare la ricompensa così com'è"
        descrizione: "Sul registro la ricompensa è sottolineata, e Julia non ama chi discute le cifre."
        esito:
          titolo: La ricevuta
          testo: |
            Firmi la ricevuta sotto la cifra, e Julia ti conta le monete da una
            cassetta di ferro che tiene nel cassetto, in pile ordinate con la faccia
            in su. «La chiarezza fa risparmiare tempo a tutti» dice, e ti guarda per
            la prima volta senza una pratica davanti. Galdrick ti stringe la mano.
            Ilvaena ti batte due dita sulla spalla ed esce per prima, con l'arco a
            tracolla e il mantello ancora da allacciare.

            Scendi la scalinata con la borsa più pesante, e in fondo all'atrio
            la targa della banca provvisoria luccica come la prima volta.
          effetti: { pista.tribu: 1, racconto: 1, monete: 30, rep.castaldi: 1 }
          imposta: { galdrick.via: 1 }
      - testo: "Far notare quanto valgono le pergamene"
        descrizione: "Il Consiglio riceve gratis le carte di un mago. Si può dirlo con garbo, a una che detesta i giri di parole."
        prova: { attributo: sociale, abilita: [politica-ed-economia, persuasione], difficolta: Media }
        successo:
          titolo: Una cifra corretta
          testo: |
            Le fai notare che le carte di un mago, in Biblioteca, varrebbero da sole
            più della cifra sul registro, e che il Consiglio le riceve gratis. Julia
            ci pensa il tempo di intingere la penna e di scolarla sul bordo del
            calamaio. Poi corregge la cifra al rialzo e ci scrive accanto una nota
            piccola, a margine. «Hai ragione, e mi secca» dice. «I conti si fanno
            giusti anche quando li fa qualcun altro.»

            Galdrick, alla finestra, si passa una mano sulla testa rasata.
            Ilvaena ti strizza l'occhio dal davanzale ed esce per prima.
          effetti: { pista.tribu: 1, racconto: 1, monete: 40, rep.castaldi: 0.5 }
          imposta: { galdrick.via: 1 }
        fallimento:
          titolo: Una cifra tagliata
          testo: |
            Julia ti lascia finire, poi posa la penna. Ti spiega che le cifre
            del Consiglio si decidono in Consiglio, e che ne ha appena tolto
            un pezzo per il tempo che le hai fatto perdere. Lo dice senza
            cattiveria, con il tono che userebbe per la data di una seduta, e
            ti conta una somma ridotta sul piano della scrivania.

            Ti senti le orecchie calde. Ilvaena tossisce per non ridere, e
            Galdrick guarda fuori dalla finestra finché non hai firmato la
            ricevuta.
          effetti: { pista.tribu: 1, racconto: 1, monete: 25, rep.castaldi: 0.5, scandalo: 0.5 }
          imposta: { galdrick.via: 1 }
      - testo: "Aiutare Julia a leggere le pergamene"
        descrizione: "I simboli non sono tutti uguali. Se capisci da dove veniva il mago, Julia saprà a chi mandarle."
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: Il sigillo dell'Accademia
          testo: |
            In fondo a ogni foglio, ripetuto come una firma, riconosci un sigillo
            che hai già visto inciso sui portali dell'Accademia di Torvessa, e ti
            torna in mente anche il piccione che ci dorme sopra sempre nello stesso
            punto. Il mago della torre aveva studiato lì. Julia annota il nome sul
            registro e decide che le pergamene andranno prima a Orvald Temmerin
            all'Accademia e solo dopo in Biblioteca.

            Ti conta la ricompensa e ci aggiunge qualche moneta di tasca sua,
            e ci tiene a dirti che sono sue. Galdrick ti stringe la mano, e
            Ilvaena esce per prima con l'arco a tracolla.
          effetti: { pista.tribu: 1, racconto: 1, monete: 35, rep.castaldi: 1, informazioni.pettegolezzo: 1 }
          imposta: { galdrick.via: 1 }
        fallimento:
          titolo: Le tempie
          testo: |
            Dopo un po' che guardi le formule ti sembra che le righe si
            spostino di mezzo dito ogni volta che sbatti le palpebre, e
            devi tenerti al bordo del tavolo come su una barca. Julia ti
            toglie il foglio di mano e lo rimette in cima alla pila, poi ti
            conta la ricompensa del Consiglio e ti consiglia con garbo di
            andare a dormire.

            Il mal di testa ti accompagna giù per la scalinata e per tutta Via
            del Velo, e ogni campana delle ore sacre ti batte dietro gli occhi.
          effetti: { pista.tribu: 1, racconto: 1, monete: 30, rep.castaldi: 0.5, tormento: 1 }
          imposta: { galdrick.via: 1 }
      - testo: "Riconoscere il sigillo dell'Accademia"
        descrizione: "In fondo a ogni foglio c'è un cerchio lasciato aperto. All'Accademia lo vedi tutti i giorni, sopra la porta dell'aula di Temmerin."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Il cerchio incompleto
          testo: |
            Le dita lo riconoscono prima della testa, e stringono il foglio come il
            giorno degli esami. Il sigillo in fondo ai fogli è il cerchio incompleto
            dell'Accademia di Torvessa, lo stesso della tenda grigia al Festival, e
            sotto c'è il segno di un corso di formule che Temmerin tiene ancora, al
            secondo anno. *Il mago della torre si sedeva nei banchi dove mi siedo
            io.* Lo dici a Julia, e lei annota il nome dell'Accademia sul registro.
            Le pergamene andranno prima a Orvald Temmerin e solo dopo in Biblioteca.

            Ti conta la ricompensa e ci aggiunge qualche moneta di tasca sua, e
            ci tiene a dirti che sono sue. Galdrick ti stringe la mano, e
            Ilvaena esce per prima con l'arco a tracolla.
          effetti: { pista.tribu: 1, racconto: 1, monete: 35, rep.castaldi: 1, informazioni.pettegolezzo: 1 }
          imposta: { galdrick.via: 1 }
      - testo: "Stimare le pergamene come una partita di merce"
        descrizione: "Con la licenza della Gilda in tasca hai stimato merce più strana di questa. Julia detesta i giri di parole, e un prezzo si può dire anche senza."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La stima
          testo: |
            Sfogli le pergamene come si sfoglia una partita di merce sui
            Ponti, guardando la carta prima dell'inchiostro, e dici a Julia
            in due frasi quanto le pagherebbe la Biblioteca, e quanto di più
            l'Accademia, se la Biblioteca arrivasse tardi. Lei ti ascolta con
            la penna sospesa sul registro, poi corregge la cifra al rialzo.
            «Almeno qualcuno, qui, non mi fa perdere tempo» dice a Galdrick,
            come se tu non fossi nella stanza.

            Galdrick si passa una mano sulla testa rasata. Ilvaena ti
            strizza l'occhio dal davanzale ed esce per prima.
          pe: { politica-ed-economia: 5 }
          effetti: { pista.tribu: 1, racconto: 1, monete: 40, rep.castaldi: 0.5 }
          imposta: { galdrick.via: 1 }

  # ------------------------------------------------------------ carte della pista
  - id: carta-gli-eretici
    immagine: ambientazione/citta-bassa
    titolo: Gli eretici
    sommario: "In un cortile della Città Bassa i bambini giocano alla razzia, e uno di loro ti ha riconosciuto."
    tipo: carta
    area: citta-bassa
    requisiti: [pista.tribu >= 1]
    testo: |
      In un cortile di Via del Salmone, fra una pompa dell'acqua e una fila
      di botti vuote, quattro bambini giocano alla razzia. Due hanno una
      pentola in testa e fanno gli orchi, e gli altri due difendono la pompa
      con dei manici di scopa. Il più piccolo degli orchi ha la pentola che gli
      scivola sugli occhi, e quando ti vede passare ti punta contro un
      cucchiaio di legno.

      «Eretico!» grida, con la voce grossa che secondo lui hanno gli orchi.
      «Adesso ti mangio!»

      {intimidire Facile fallita} Ti viene istintivo raddrizzare le spalle
      davanti all'arma puntata. È un cucchiaio, e il suo proprietario ti
      arriva alla cintura.

      La madre esce di corsa da una porta, con le mani ancora bagnate, e lo
      prende per il colletto. Gli molla uno scappellotto sulla pentola, che
      suona come una campana, e poi ti guarda e diventa rossa fino alle
      orecchie. Sul muro dietro di lei qualcuno ha scritto col carbone
      *ERETICI*, in lettere storte, e sotto ha disegnato un omino con la
      spada e un sole che gli sorride.

      {origine accolito-del-velo} In Cattedrale *eretico* si dice a bassa
      voce, e mai senza un nome preciso accanto. Vederlo scritto col carbone
      sopra un omino con la spada ti fa lo stesso effetto di un bambino che
      canta a squarciagola una preghiera con le parole sbagliate.

      {conoscenze-della-strada Media} In Città Bassa i muri si scrivono per
      chi li legge alla fontana. La scritta può averla fatta chiunque, ma
      il sole che sorride all'omino l'ha disegnato qualcuno che tifa per
      te.
    opzioni:
      - testo: "Stare al gioco"
        descrizione: "Il bambino aspetta soltanto che tu cada morto."
        esito:
          titolo: Morto sul selciato
          testo: |
            Ti porti la mano al petto e cadi in ginocchio con un lamento
            lunghissimo, poi ti stendi sul selciato con la lingua di fuori. I
            bambini esultano tutti e quattro, anche i difensori, che
            evidentemente non hanno capito da che parte stanno. La madre
            prova a restare seria e non ci riesce.

            {acrobazia Facile} Cadi sul fianco con il gomito sotto, come si
            cade quando si sa cadere, e il selciato ti fa meno male di quanto
            sembri ai bambini.

            Quando ti rialzi hai la polvere sulla schiena, un sasso che ti ha
            lasciato il segno sotto la scapola e le spalle più leggere di
            stamattina.
          effetti: { tormento: -0.5 }
      - testo: "Chiedere alla madre dove l'ha sentita"
        descrizione: "Una parola orchesca non arriva da sola in un cortile di Via del Salmone."
        esito:
          titolo: Dalla fontana
          testo: |
            La madre si asciuga le mani sul grembiule, anche se sono già asciutte, e
            ti chiede scusa due volte prima di rispondere. La parola gira da un
            pezzo, dice. L'hanno portata le guardie della Caserma, che la sentivano
            ripetere dagli orchi presi dopo la razzia, e alla fontana adesso la
            usano tutti. Per la strada, aggiunge, è quasi un complimento. Lo
            scappellotto, invece, era per il cucchiaio, che è l'unico buono che ha.
          effetti: { informazioni.voce: 1 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: "Prosegui verso Via del Salmone. Alle tue spalle il più piccolo degli orchi ricomincia a gridare, adesso contro la pompa."

  - id: carta-ilvaena-al-mercato
    immagine: ambientazione/mercato-dei-nodi
    titolo: Penne d'oca
    sommario: "Al Mercato dei Nodi Ilvaena Sorathe sceglie le frecce una per una, e il venditore non ne è contento."
    tipo: carta
    area: ponti-sospesi
    # Dopo il rapporto in Municipio (pista.tribu 3 → 4) Ilvaena torna al confine.
    requisiti: [pista.tribu >= 2, pista.tribu < 4]
    testo: |
      Sulla piattaforma più esposta del Mercato dei Nodi il vento fa girare
      le penne appese ai banchi, e a te fa lacrimare l'occhio sinistro.
      Ilvaena Sorathe è china sul banco di un vecchio impennatore e prova
      le frecce una per una, facendole rotolare sul palmo per vedere se
      sono dritte. Quelle storte le mette da parte senza dire niente, e il
      mucchio delle storte cresce più in fretta dell'altro. Il vecchio la
      guarda fare con la pipa spenta fra i denti, e ogni tanto ne tira una
      boccata d'aria per abitudine.

      {origine mercante-dei-ponti} Il mucchio delle storte il vecchio non lo
      butterà. Domani lo rimette sul banco per i forestieri, a prezzo pieno,
      come sui Ponti si fa con qualunque cosa un intenditore abbia appena
      scartato, e tu stesso l'hai fatto più di una volta.

      {armi-da-distanza Facile} Una freccia storta di un capello, a
      cinquanta passi, finisce nel campo del vicino. Ilvaena scarta anche
      quelle storte di mezzo capello.

      {persuasione Media fallita} Cominci a prepararti il discorso per il
      vecchio, con le pause al posto giusto. A metà ti accorgi che lo stai
      provando a mezza voce, e che il vecchio ti sta guardando.

      Ti vede e ti fa cenno di avvicinarti, senza smettere. «Penne d'oca
      tagliate a mano» dice, e te ne mette una in mano perché tu senta il
      peso. «Le frecce buone sono come gli stivali, non ci pensi finché non
      ti mancano» aggiunge, e torna a farle rotolare.
    opzioni:
      - testo: "Aiutarla a contrattare"
        descrizione: "Il vecchio ha già deciso che a un'elfa il prezzo lo alza. Forse a te no."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Facile }
        successo:
          titolo: Il prezzo giusto
          testo: |
            Fai notare al vecchio che metà delle sue frecce sta nel mucchio delle
            storte, e che un'elfa della guardia, al mercato, è una pubblicità che
            non si compra. Lui borbotta qualcosa contro i giovani d'oggi e abbassa
            il prezzo. Ilvaena paga e infila le frecce nella faretra una alla volta.
            «Zagrath le compra incantate e le paga con le carovane degli altri» dice
            intanto, «io le compro dritte e le pago in monete, e mi piace pensare
            che la differenza si veda.»
          effetti: { rep.caserma: 0.5 }
        fallimento:
          titolo: Il prezzo intero
          testo: |
            Il vecchio ti ascolta fino in fondo, annuendo, poi alza un poco il
            prezzo per il disturbo. Ilvaena ride e paga lo stesso. «Lascia
            stare» dice. «Mi vende frecce da dieci anni e da dieci anni ci
            provo anch'io.» Ti regala per ricordo una delle frecce storte e se
            ne va con la faretra piena.
          effetti: { scandalo: 0.5 }
      - testo: "Chiederle di Dolovan Stroud"
        descrizione: "Le Scuderie della Zanna Rotta sono giù in Città Bassa, sulla strada che Ilvaena fa per salire al mercato."
        requisiti: [pista.corin >= 2]
        esito:
          titolo: La strada lunga
          testo: |
            Ilvaena fa rotolare una freccia sul palmo più a lungo del
            necessario. Racconta che ieri è passata davanti alle Scuderie della
            Zanna Rotta e che Squash l'ha riconosciuta dal recinto e si è messo
            a nitrire come un matto. Dolovan era dentro e non è uscito. Lei è
            rimasta in strada finché Squash non si è calmato. «Siamo
            bravissimi tutti e due» dice, e mette la freccia nel mucchio delle
            storte anche se era dritta.

            {empatia Media} Lo sa anche lei che era dritta. Sta buttando via
            qualcos'altro, e una freccia è più facile da buttare.
          pe: { empatia: 5 }
      - testo: "Salutarla e lasciarla alle sue frecce"
        costo: 0
        esito:
          testo: "Ilvaena alza una freccia storta in segno di saluto e torna a litigare con il vecchio."
