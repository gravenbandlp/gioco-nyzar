# La pista delle cinque tribù (pista.tribu 0 → 4): le brutte notizie in Municipio, la cena con
# Ilvaena al Grifone di Ferro e, dopo la spedizione nella Palude Acquanera (passo 2 → 3, in un altro
# file), il rapporto in Municipio. Più due carte legate alla pista.
#
# Per chi scrive la Palude: la quality nascosta `bolgrum` (definita qui sotto) dice com'è finita nella
# torre e va impostata nel cuore della spedizione, in tutti i rami che portano pista.tribu a 3.
#   bolgrum: 1  Bolgrum e Skarr sono morti (uccisi in combattimento o in qualunque altro modo)
#   bolgrum: 2  Bolgrum e Skarr sono fuggiti nei canali della palude, vivi
# Se resta a 0, il rapporto la tratta come 1. Il rapporto dà per scontato che dalla torre tu abbia
# portato via le pergamene del mago che ci abitava prima degli orchi.
quality:
  - { id: bolgrum, immagine: personaggi/bolgrum, nome: Bolgrum, categoria: stato, nascosta: true, descrizione: "Com'è finita nella torre della Palude Acquanera. 1 Bolgrum e Skarr morti, 2 fuggiti vivi nei canali." }
  - { id: cena.tribu, nome: Ilvaena ti ha descritto le tribù, categoria: stato, nascosta: true }
  - { id: cena.eroi, nome: Ilvaena ti ha descritto gli eroi orchi, categoria: stato, nascosta: true }
  - { id: cena.zagrath, nome: Ilvaena ti ha parlato di Zagrath, categoria: stato, nascosta: true }
  - { id: cena.stroud, nome: Hai nominato Stroud a Ilvaena, categoria: stato, nascosta: true }

storylet:
  # ------------------------------------------------------------ 0 → 1 · le brutte notizie
  - id: brutte-notizie-in-municipio
    presso: municipio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: Brutte notizie in Municipio
    sommario: "Lo sceriffo ti chiama in Municipio. L'esploratrice che aspettava è tornata dai boschi con cattive notizie."
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [pista.tribu == 0, pista.dama-argento >= 11, pista.sepolcro >= 7]
    testo: |
      Il biglietto dello sceriffo dice soltanto *Municipio, subito*.
      Nell'ufficio della Rappresentante Julia Castaldi siede dietro la
      scrivania con le braccia conserte, e davanti a lei Toren Galdrick
      ascolta un'elfa dai capelli ramati, infangata fino alle ginocchia.
      «Entra pure» dice Julia. «Ormai queste faccende riguardano anche te.»
      Galdrick te la presenta come Ilvaena Sorathe della guardia cittadina,
      «non ufficiale», e lei ride.

      {galateo Facile} La Rappresentante non si è alzata e lo sceriffo non si
      è seduto, e in questa stanza le sedie dicono chi comanda meglio dei
      titoli.

      {origine figlio-della-citta-bassa} In Città Bassa, quando passava lo
      sceriffo, si abbassava la voce in tutto il vicolo. Adesso lui ti fa un
      cenno come a un collega.

      Ilvaena racconta che alla razzia c'erano tutte e cinque le tribù, che a
      memoria d'elfo non si erano mai mosse insieme. Ieri a Fondobosco ha
      sentito dei reduci farfugliare degli eretici che in città gli avevano
      ammazzato tanti guerrieri. «Le bestiacce litigano sempre fra loro»
      dice, «a meno di avere in testa una cosa grossa, e per le cose grosse
      serve un capo grosso.»

      Galdrick dice un nome solo, Balthog. *È lo stesso nome che stava nel
      nucleo della macchina.* «Nei prossimi giorni fatti vedere in città» ti
      dice poi lo sceriffo. «Se la gente ti incontra per strada si preoccupa
      meno.»
    opzioni:
      - testo: "Rispondere per primo allo sceriffo"
        descrizione: "Galdrick chiede una cosa sola e si aspetta una risposta netta."
        immagine: personaggi/toren-galdrick
        esito:
          titolo: In giro per la città
          testo: |
            Al tuo sì Galdrick annuisce e scrive il tuo nome sul taccuino accanto
            a un turno di ronda. «Il mercato la mattina e i ponti la sera» dice,
            «basta che ti vedano.»

            Ilvaena ti invita a cena stasera al Grifone di Ferro, la tua razzia in
            cambio delle sue tribù, e Julia ti dice che il suo ufficio, per te,
            resta aperto.
          effetti: { pista.tribu: 1, rep.caserma: 0.5 }
      - testo: "Chiedere a Ilvaena degli eretici"
        descrizione: "Gli orchi hanno trovato un nome per chi ha difeso la città, e lei l'ha sentito dire."
        immagine: personaggi/ilvaena-sorathe
        esito:
          titolo: Eretici
          testo: |
            Ilvaena si gratta via una crosta di fango dal polsino. Gli orchi di
            Fondobosco quella parola la dicevano a bassa voce, racconta, come si
            nomina una malattia. «So che di voi hanno paura» dice, «e un orco la
            paura la ammette malvolentieri.»

            Allo sceriffo dici di sì, e Ilvaena ti invita a cena stasera al
            Grifone di Ferro, la tua razzia in cambio delle sue tribù.
          pe: { natura: 5 }
          effetti: { pista.tribu: 1, rep.caserma: 0.5 }
      - testo: "Rivolgerti alla Rappresentante"
        descrizione: "Julia Castaldi finora ha soltanto ascoltato. Le udienze, si dice, le fa brevi."
        immagine: personaggi/julia-castaldi
        esito:
          titolo: Le pratiche già lette
          testo: |
            Julia ti ascolta con la mano su una pratica chiusa e risponde prima
            che tu abbia finito. «I cittadini mi hanno scelta quando nessuno aveva
            paura di niente» dice. «Adesso che hanno paura non intendo deluderli,
            quindi se ti serve qualcosa sali qui e chiedilo chiaro.»

            Allo sceriffo dici di sì, e Ilvaena ti invita a cena stasera al
            Grifone di Ferro, la tua razzia in cambio delle sue tribù.
          effetti: { pista.tribu: 1, rep.castaldi: 0.5 }
      - testo: "Restare in silenzio e ascoltare"
        descrizione: "Lasci parlare loro. Da come si guardano si capisce chi decide che cosa."
        esito:
          titolo: Accanto alla porta
          testo: |
            Resti accanto alla porta e lasci parlare loro. Julia scrive poco, ma
            quando Ilvaena nomina Fondobosco sottolinea una riga due volte. Alla
            fine ti ringrazia proprio per non aver aperto bocca, perché da una
            settimana in quell'ufficio parlano tutti.

            Allo sceriffo basta un tuo cenno di assenso, e Ilvaena ti invita a
            cena stasera al Grifone di Ferro prima di andarsene a dormire.
          pe: { percezione: 5 }
          effetti: { pista.tribu: 1, rep.castaldi: 0.5 }
      - testo: "Salutare Julia come si saluta nei giorni di consiglio"
        descrizione: "La tua famiglia siede ai tavoli del Consiglio da sempre, e Julia quella formula la riconosce."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Due sedie più in là
          testo: |
            Fai il mezzo inchino dei giorni di seduta, e Julia scioglie le
            braccia. «Al Festival sedevi due sedie più in là» dice. Poi ti chiede
            piano se a casa tua si dorme, e al tuo no annuisce come a una cifra
            già scritta.

            Allo sceriffo rispondi di sì, e Ilvaena ti invita a cena stasera al
            Grifone di Ferro, la tua razzia in cambio delle sue tribù.
          pe: { galateo: 5 }
          effetti: { pista.tribu: 1, rep.castaldi: 0.5 }
      - testo: "Dire allo sceriffo dove farti vedere"
        descrizione: "Galdrick vuole che la gente ti veda. In Città Bassa sai quali strade contano, e a che ora."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Le strade giuste
          testo: |
            Gli dici di sì, e che il mercato la mattina serve a poco perché ci
            vanno le serve dei Quartieri Alti. La gente che parla sta alla fontana
            verso mezzogiorno e davanti alle fucine al cambio di turno. Galdrick
            ti guarda un momento più a lungo del necessario, poi corregge il
            taccuino senza discutere.

            Ilvaena ride e ti invita a cena stasera al Grifone di Ferro.
          pe: { conoscenze-della-strada: 5 }
          effetti: { pista.tribu: 1, rep.caserma: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · la cena al Grifone
  - id: cena-con-ilvaena
    presso: grifone-di-ferro
    immagine: personaggi/ilvaena-sorathe
    titolo: Cena con Ilvaena
    sommario: "Al Grifone di Ferro Ilvaena Sorathe ti aspetta. Vuole la tua razzia, e in cambio ti dà le tribù."
    luogo: Locanda del Grifone di Ferro, la sera
    area: ponti-sospesi
    requisiti: [pista.tribu == 1]
    testo: |
      La sera il Grifone di Ferro è pieno di Raschiatori appena tornati dal
      turno. Ilvaena Sorathe ha preso il tavolo d'angolo, con i capelli
      lavati e l'arco lungo appoggiato al muro senza la corda.

      {origine apprendista-raschiatore} Metà delle facce ai tavoli le hai
      viste sulle piattaforme della Cicatrice, e un ragazzo del tuo turno ti
      alza il boccale indicando Ilvaena col mento.

      «Prima la tua razzia» dice, e ti spinge davanti un boccale. «A
      Fondobosco l'ho sentita raccontare dagli orchi, e raccontano male.»

      Ilvaena ascolta con il mento sul pugno, fermandoti ogni tanto per
      chiederti da che parte soffiava il vento. In fondo alla sala Liaren
      Tarvelin accorda il samisen e guarda spesso verso il vostro tavolo,
      perché Ilvaena è la sua amica più vecchia. Quando hai finito, Ilvaena
      si pulisce la schiuma dal labbro. «Adesso chiedi tu» dice, e posa il
      boccale.
    opzioni:
      - testo: "Chiederle delle cinque tribù"
        descrizione: "Lei le insegue da anni, e qualche volta le sfoltisce."
        immagine: fazioni/tribu-fondobosco
        requisiti: [cena.tribu == 0]
        costo: 0
        esito:
          titolo: Cinque tribù
          testo: |
            Gli Spiumatori stanno nelle grotte a ovest del Gradone Rosso e
            assalgono chi viaggia da solo. Gli Spacca-ossa stanno a sud nella
            Palude Acquanera e ti aspettano sott'acqua. I Nove Chiodi del Bosco
            della Forca assaltano le carovane. Fondobosco, a est del Gradone, è la
            tribù più grande e si sgozza fra famiglie.

            «L'ultima è Capomozzo, su un'isola al largo di Rovolungo» dice
            Ilvaena, «che pare una testa mozzata.»
          imposta: { cena.tribu: 1 }
          segue: cena-con-ilvaena
      - testo: "Chiederle degli eroi orchi"
        descrizione: "Fra gli orchi ce ne sono pochi che si fanno un nome. Quei pochi, Ilvaena li conosce."
        immagine: personaggi/borgoth-il-gigante
        requisiti: [cena.eroi == 0]
        costo: 0
        esito:
          titolo: Sei nomi
          testo: |
            Borgoth il Gigante, mezzo ogre di Fondobosco, preferisce la caccia al
            comando. Uzgreth dei Nove Chiodi è sparito in una caverna con una spada
            da ogre, e lo credono un fantasma. Nella Palude comanda Bolgrum, che non
            si alza dal trono, con Skarr, che mangia carne d'orco. A Capomozzo c'è
            Balthog il Prescelto, che aveva Dorbak come braccio destro. Il sesto,
            detto più piano, è il mezzogre Zagrath.
          imposta: { cena.eroi: 1 }
          segue: cena-con-ilvaena
      - testo: "Chiederle di Zagrath"
        descrizione: "Quel nome l'ha detto più piano degli altri."
        immagine: personaggi/zagrath
        requisiti: [cena.eroi == 1, cena.zagrath == 0]
        costo: 0
        esito:
          titolo: Una guerra privata
          testo: |
            Zagrath vive nel nord di Rovolungo e rivende alle cinque tribù la
            merce rubata alle carovane, in cambio di alcol e notizie. Odia gli
            elfi sopra ogni cosa, e con Ilvaena si è affrontato più volte senza
            vincitore.

            «Ha la mira migliore della mia» dice lei, toccandosi una cicatrice
            sotto la clavicola. «Prima o poi uno dei due cade, e ho deciso da un
            pezzo che non sarò io.»
          imposta: { cena.zagrath: 1 }
          segue: cena-con-ilvaena
      - testo: "Nominare Dolovan Stroud"
        descrizione: "I cavalli per la caccia di Corin te li ha sellati lui. Stroud gli orchi li odia quanto lei."
        immagine: personaggi/dolovan-stroud
        requisiti: [pista.corin >= 2, cena.stroud == 0]
        costo: 0
        esito:
          titolo: Le Scuderie della Zanna Rotta
          testo: |
            Le dici che i cavalli per la caccia di Corin erano di Dolovan Stroud,
            e Ilvaena posa il cucchiaio. «Ha ancora Squash?» chiede, e al tuo sì
            sorride al piatto. Sono stati insieme a lungo, poi lui l'ha voluta in
            città, e lei aveva già scelto i confini di Velthar.

            «Ci parliamo poco, e ci guardiamo parecchio» dice, e in fondo alla
            sala Liaren finge con fatica di non ascoltare.
          imposta: { cena.stroud: 1 }
          segue: cena-con-ilvaena
      - testo: "Chiederle che cosa si può fare"
        descrizione: "Lo sceriffo vorrà sapere dove colpire, e Ilvaena un'idea ce l'ha già."
        immagine: ambientazione/palude-acquanera
        requisiti: [cena.tribu == 1, cena.eroi == 1, cena.zagrath == 1]
        esito:
          titolo: La Palude
          testo: |
            Ilvaena disegna la regione col dito nell'unto del tavolo. Capomozzo e
            Fondobosco sono troppi da attaccare, mentre gli Spacca-ossa della Palude
            Acquanera sono pochi e isolati, hanno perso parecchi guerrieri alla
            razzia e gli restano solo Bolgrum e Skarr.

            «Se vuoi far capire alle bestiacce che allearsi costa caro, comincia da
            lì» dice, e sul retro del conto te la ridisegna a carboncino, con una
            croce dove sta la torre.
          pe: { natura: 5 }
          effetti: { pista.tribu: 1 }
      - testo: "Parlarle dei confini di Velthar"
        descrizione: "Lei vive ai margini del Bosco dove sei cresciuto e conosce i segni dei sentieri del Circolo."
        quando: [origine.figlio-del-circolo >= 1, cena.tribu == 1, cena.eroi == 1, cena.zagrath == 1]
        esito:
          titolo: Le tre tacche
          testo: |
            Ilvaena ride piano quando le racconti del Circolo e dei sentieri segnati
            con tre tacche sulla corteccia. Capomozzo e Fondobosco sono troppi,
            dice, mentre gli Spacca-ossa della Palude Acquanera sono pochi e alla
            razzia hanno perso parecchi guerrieri.

            Sul retro del conto ti ridisegna la palude a carboncino, con una croce
            dove sta la torre e tre tacche dove l'acqua è bassa. «Così la leggi come
            la leggerei io» dice.
          pe: { natura: 5 }
          effetti: { pista.tribu: 1, rep.circolo: 0.5 }
      - testo: "Raccontarle dei sorveglianti di Ghoran"
        descrizione: "Gli orchi li hai visti da vicino nei recinti di Ghoran, e lei vorrà saperlo."
        quando: [origine.fuggiasco-di-ghoran >= 1, cena.eroi == 0]
        costo: 0
        esito:
          titolo: I recinti
          testo: |
            Le racconti dei sorveglianti orchi di Ghoran, e Ilvaena ascolta senza
            compatirti. «Allora sai già come vanno fra loro» dice, e ti nomina i
            capi.

            Borgoth il Gigante sta a Fondobosco e Uzgreth fra i Nove Chiodi. Nella
            Palude comanda Bolgrum con Skarr, e a Capomozzo c'è Balthog il
            Prescelto, che aveva Dorbak come braccio destro. Il sesto, detto più
            piano, è il mezzogre Zagrath.
          imposta: { cena.eroi: 1 }
          segue: cena-con-ilvaena

  # ------------------------------------------------------------ 3 → 4 · il rapporto
  - id: rapporto-in-municipio
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: Rapporto in Municipio
    sommario: "Torni dalla Palude Acquanera con il fango negli orli e un fascio di pergamene. In Municipio ti aspettano in tre."
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [pista.tribu == 3]
    testo: |
      Torni in città con il fango della Palude ancora negli orli dei
      calzoni, e un inserviente segue le tue impronte con lo straccio su per
      i gradini del Municipio. Nell'ufficio di Julia Castaldi questa volta
      c'è una sedia anche per te. Galdrick resta in piedi, con i pollici
      nella cintura. Ilvaena, seduta sul davanzale con un ginocchio al
      petto, ti guarda prima gli stivali e poi la faccia.

      Sulla scrivania posi il fascio di pergamene che hai portato via dalla
      torre. Erano di un mago che abitava lassù prima degli orchi, e sono
      coperte di simboli e di formule che a guardarle troppo a lungo ti
      fanno pulsare le tempie. Gli orchi non le avevano mai toccate.

      {magia Media} Anche qui, lontano dalla torre, l'inchiostro tira appena
      verso di te, come la marea tira una barca ormeggiata male. Chi le ha
      scritte ci ha messo dentro più Mana del necessario.

      {origine allievo-di-torvessa} Alcune formule le riconosci dalla forma
      prima di capirle. Sono parenti strette di quelle che all'Accademia si
      copiano il primo anno, scritte con una sicurezza che a te, alla
      lavagna, non è mai venuta.

      Julia scosta la pratica che stava leggendo e intreccia le dita sul
      piano della scrivania. «Dall'inizio» dice. «E senza abbellire, che le
      storie belle me le raccontano già in Consiglio.»
    opzioni:
      - testo: "Raccontare com'è finita nella torre"
        descrizione: "Bolgrum e Skarr non tormenteranno più nessuno."
        requisiti: [bolgrum != 2]
        costo: 0
        esito:
          titolo: La torre vuota
          testo: |
            Racconti la torre sull'isola di fango e come sono morti Bolgrum e
            Skarr. Ilvaena ti fa ripetere due volte la parte di Skarr. «Gli davo
            la caccia da anni» dice, «e mi hai risparmiato parecchio fango.»

            Galdrick scrive i due nomi sul taccuino e ci tira sopra una riga.
            Nella palude, dice Ilvaena, resta una decina di orchi senza capo, che
            per un po' si azzanneranno fra loro.
          segue: rapporto-in-municipio-congedo
      - testo: "Raccontare com'è finita nella torre"
        descrizione: "Bolgrum e Skarr sono scappati nei canali, ma la torre adesso è vuota."
        requisiti: [bolgrum == 2]
        costo: 0
        esito:
          titolo: Nei canali
          testo: |
            Racconti la torre sull'isola di fango e come Bolgrum e Skarr sono
            spariti fra i canali. Ilvaena, che Bolgrum non l'aveva mai visto
            camminare, sembra quasi dispiaciuta di esserselo perso. «Senza torre e
            senza trono è un capo a metà» dice, «ma Skarr da solo è peggio di
            prima. Terrò d'occhio i villaggi del sud.»

            Galdrick scrive i due nomi sul taccuino con accanto un punto di
            domanda.
          segue: rapporto-in-municipio-congedo

  - id: rapporto-in-municipio-congedo
    presso: municipio
    immagine: personaggi/toren-galdrick
    titolo: Una tribù su cinque
    tipo: seguito
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [pista.tribu == 3]
    testo: |
      Julia impila le pergamene senza leggerle. Le manderà in Biblioteca,
      perché qualcuno dica di chi erano.

      Secondo Galdrick una tribù su cinque ha avuto quello che si meritava,
      e le altre quattro non se ne sono accorte. La Caserma non ha uomini
      per un fronte dal Bosco della Forca al mare di Rovolungo, e domattina
      lui parte per Ghoran a prendere uomini e certi documenti. «Mentre sono
      via tieni d'occhio la città» dice, «e se succede qualcosa lascia un
      biglietto al sergente di turno.»

      {origine fuggiasco-di-ghoran} Al nome di Ghoran la schiena ti si curva
      di un dito, e la raddrizzi prima che qualcuno se ne accorga.

      Ilvaena torna al confine domani all'alba. Chiede a Galdrick se ha
      salutato chi doveva, in Via dei Rasoi, e lo sceriffo si sistema la
      cintura due volte senza rispondere.

      Julia intanto scrive sul registro la ricompensa del Consiglio, e la
      sottolinea.
    opzioni:
      - testo: "Accettare la ricompensa così com'è"
        descrizione: "Sul registro la ricompensa è sottolineata, e Julia non ama chi discute le cifre."
        esito:
          titolo: La ricevuta
          testo: |
            Firmi la ricevuta, e Julia ti conta le monete da una cassetta di ferro,
            in pile ordinate con la faccia in su. «La chiarezza fa risparmiare tempo
            a tutti» dice. Galdrick ti stringe la mano, e Ilvaena ti batte due dita
            sulla spalla ed esce per prima, con il mantello ancora da allacciare.
          effetti: { pista.tribu: 1, racconto: 1, monete: 30, rep.castaldi: 1 }
          imposta: { galdrick.via: 1 }
      - testo: "Far notare quanto valgono le pergamene"
        descrizione: "Il Consiglio riceve gratis le carte di un mago, e lo si può dire con garbo."
        prova: { attributo: sociale, abilita: [politica-ed-economia, persuasione], difficolta: Media }
        successo:
          titolo: Una cifra corretta
          testo: |
            Le fai notare che le carte di un mago, in Biblioteca, varrebbero da sole
            più della cifra sul registro. Julia intinge la penna, la scola sul bordo
            del calamaio e corregge la cifra al rialzo. «Hai ragione, e mi secca»
            dice. «I conti si fanno giusti anche quando li fa qualcun altro.»
            Ilvaena ti strizza l'occhio dal davanzale ed esce per prima.
          effetti: { pista.tribu: 1, racconto: 1, monete: 40, rep.castaldi: 0.5 }
          imposta: { galdrick.via: 1 }
        fallimento:
          titolo: Una cifra tagliata
          testo: |
            Julia ti lascia finire, poi posa la penna. Le cifre del Consiglio si
            decidono in Consiglio, ti spiega senza cattiveria, e ne ha appena
            tolto un pezzo per il tempo che le hai fatto perdere. Ti conta una
            somma ridotta sul piano della scrivania, mentre Ilvaena tossisce per
            non ridere e Galdrick guarda fuori dalla finestra.
          effetti: { pista.tribu: 1, racconto: 1, monete: 25, rep.castaldi: 0.5, scandalo: 0.5 }
          imposta: { galdrick.via: 1 }
      - testo: "Aiutare Julia a leggere le pergamene"
        descrizione: "I simboli non sono tutti uguali. Se capisci da dove veniva il mago, Julia saprà a chi mandarle."
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: Il sigillo dell'Accademia
          testo: |
            In fondo a ogni foglio, ripetuto come una firma, riconosci il sigillo
            inciso sui portali dell'Accademia di Torvessa, e capisci che il mago
            della torre aveva studiato lì. Julia lo annota sul registro e decide
            che le pergamene andranno prima a Orvald Temmerin all'Accademia e solo
            dopo in Biblioteca.

            Ti conta la ricompensa e ci aggiunge qualche moneta di tasca sua, e ci
            tiene a dirti che sono sue.
          effetti: { pista.tribu: 1, racconto: 1, monete: 35, rep.castaldi: 1, informazioni.pettegolezzo: 1 }
          imposta: { galdrick.via: 1 }
        fallimento:
          titolo: Le tempie
          testo: |
            Dopo un po' le righe delle formule si spostano di mezzo dito ogni
            volta che sbatti le palpebre, e devi tenerti al bordo del tavolo.
            Julia ti toglie il foglio di mano, ti conta la ricompensa del
            Consiglio e ti consiglia con garbo di andare a dormire. Il mal di
            testa ti accompagna per tutta Via del Velo.
          effetti: { pista.tribu: 1, racconto: 1, monete: 30, rep.castaldi: 0.5, tormento: 1 }
          imposta: { galdrick.via: 1 }
      - testo: "Riconoscere il sigillo dell'Accademia"
        descrizione: "In fondo a ogni foglio c'è un cerchio aperto, lo stesso che sta sopra la porta dell'aula di Temmerin."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Il cerchio incompleto
          testo: |
            Le dita riconoscono il sigillo prima della testa. È il cerchio
            incompleto dell'Accademia di Torvessa, con sotto il segno di un corso
            di formule che Temmerin tiene ancora. *Il mago della torre si sedeva
            nei banchi dove mi siedo io.* Lo dici a Julia, e lei decide che le
            pergamene andranno prima a Orvald Temmerin e poi in Biblioteca. Alla
            ricompensa aggiunge qualche moneta di tasca sua.
          effetti: { pista.tribu: 1, racconto: 1, monete: 35, rep.castaldi: 1, informazioni.pettegolezzo: 1 }
          imposta: { galdrick.via: 1 }
      - testo: "Stimare le pergamene come una partita di merce"
        descrizione: "Con la licenza della Gilda hai stimato merce più strana, e un prezzo si dice senza giri di parole."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La stima
          testo: |
            Sfogli le pergamene come una partita di merce sui Ponti, guardando la
            carta prima dell'inchiostro, e dici a Julia in due frasi quanto le
            pagherebbe la Biblioteca, e quanto di più l'Accademia. Lei corregge la
            cifra al rialzo. «Almeno qualcuno, qui, non mi fa perdere tempo» dice
            a Galdrick, come se tu non fossi nella stanza.
          pe: { politica-ed-economia: 5 }
          effetti: { pista.tribu: 1, racconto: 1, monete: 40, rep.castaldi: 0.5 }
          imposta: { galdrick.via: 1 }

  # ------------------------------------------------------------ carte della pista
  - id: carta-gli-eretici
    immagine: ambientazione/citta-bassa
    titolo: Gli eretici
    sommario: "In un cortile della Città Bassa i bambini giocano alla razzia, e uno di loro ti ha riconosciuto."
    tipo: carta
    area: citta-bassa
    requisiti: [pista.tribu >= 1]
    testo: |
      In un cortile di Via del Salmone quattro bambini giocano alla razzia
      intorno alla pompa dell'acqua. Il più piccolo degli orchi, con una
      pentola in testa, ti punta contro un cucchiaio di legno e grida «Eretico!
      Adesso ti mangio!»

      La madre esce di corsa, gli molla uno scappellotto sulla pentola e
      diventa rossa fino alle orecchie. Sul muro qualcuno ha scritto col
      carbone *ERETICI*, sopra un omino con la spada.

      {origine accolito-del-velo} In Cattedrale *eretico* si dice a bassa voce,
      e vederlo scritto sul muro di un cortile ti fa uno strano effetto.
    opzioni:
      - testo: "Stare al gioco"
        descrizione: "Il bambino aspetta soltanto che tu cada morto."
        esito:
          titolo: Morto sul selciato
          testo: |
            Ti porti la mano al petto e cadi in ginocchio con un lamento
            lunghissimo, poi ti stendi sul selciato con la lingua di fuori. I
            bambini esultano tutti e quattro, difensori compresi, mentre la madre
            prova a restare seria senza riuscirci. Quando ti rialzi hai la polvere
            sulla schiena e le spalle più leggere di stamattina.
          effetti: { tormento: -0.5 }
      - testo: "Chiedere alla madre dove l'ha sentita"
        descrizione: "Una parola orchesca non arriva da sola in un cortile di Via del Salmone."
        esito:
          titolo: Dalla fontana
          testo: |
            La madre si asciuga le mani sul grembiule e ti chiede scusa due volte
            prima di rispondere. La parola l'hanno portata le guardie della Caserma,
            che la sentivano ripetere dagli orchi presi dopo la razzia, e alla
            fontana ormai la usano tutti, quasi come un complimento. Lo scappellotto
            era per il cucchiaio, l'unico buono che ha.
          effetti: { informazioni.voce: 1 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: "Prosegui verso Via del Salmone. Alle tue spalle il più piccolo degli orchi ricomincia a gridare, adesso contro la pompa."

  - id: carta-ilvaena-al-mercato
    immagine: ambientazione/mercato-dei-nodi
    titolo: Penne d'oca
    sommario: "Al Mercato dei Nodi Ilvaena Sorathe sceglie le frecce una per una, e il venditore non ne è contento."
    tipo: carta
    area: ponti-sospesi
    # Dopo il rapporto in Municipio (pista.tribu 3 → 4) Ilvaena torna al confine.
    requisiti: [pista.tribu >= 2, pista.tribu < 4]
    testo: |
      Sulla piattaforma più esposta del Mercato dei Nodi Ilvaena Sorathe
      prova le frecce di un vecchio impennatore facendole rotolare sul
      palmo, e il mucchio delle storte cresce più in fretta dell'altro. Il
      vecchio la guarda con la pipa spenta fra i denti.

      {origine mercante-dei-ponti} Le storte il vecchio non le butterà, e
      domani le rimette sul banco per i forestieri a prezzo pieno, come sui
      Ponti hai fatto anche tu.

      Ti vede e ti fa cenno di avvicinarti. «Le frecce buone sono come gli
      stivali, non ci pensi finché non ti mancano» dice.
    opzioni:
      - testo: "Aiutarla a contrattare"
        descrizione: "Il vecchio ha già deciso che a un'elfa il prezzo lo alza. Forse a te no."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Facile }
        successo:
          titolo: Il prezzo giusto
          testo: |
            Fai notare al vecchio che metà delle sue frecce sta nel mucchio delle
            storte, e che un'elfa della guardia al suo banco è una pubblicità che
            non si compra. Lui borbotta e abbassa il prezzo. Ilvaena infila le
            frecce nella faretra una alla volta. «Zagrath le compra incantate e le
            paga con le carovane degli altri» dice, «io le compro dritte e le pago
            in monete.»
          effetti: { rep.caserma: 0.5 }
        fallimento:
          titolo: Il prezzo intero
          testo: |
            Il vecchio ti ascolta annuendo, poi alza un poco il prezzo per il
            disturbo. Ilvaena ride e paga lo stesso. «Mi vende frecce da dieci
            anni, e da dieci anni ci provo anch'io» dice, e ti regala una delle
            frecce storte.
          effetti: { scandalo: 0.5 }
      - testo: "Chiederle di Dolovan Stroud"
        descrizione: "Le Scuderie della Zanna Rotta sono giù in Città Bassa, sulla strada che Ilvaena fa per salire al mercato."
        requisiti: [pista.corin >= 2]
        esito:
          titolo: La strada lunga
          testo: |
            Ilvaena fa rotolare una freccia sul palmo più a lungo del necessario.
            Racconta che ieri è passata davanti alle Scuderie della Zanna Rotta e
            che Squash l'ha riconosciuta dal recinto, mettendosi a nitrire come un
            matto. Dolovan era dentro e non è uscito. «Siamo bravissimi tutti e
            due» dice, e mette nel mucchio delle storte anche quella, che era
            dritta.
          pe: { empatia: 5 }
      - testo: "Salutarla e lasciarla alle sue frecce"
        costo: 0
        esito:
          testo: "Ilvaena alza una freccia storta in segno di saluto e torna a litigare con il vecchio."
