aree:
  - id: quartieri-alti
    immagine: ambientazione/quartieri-alti
    nome: Quartieri Alti
    testo: |
      Pietra chiara, tetti di rame, lanterne dorate che non fanno fumo. Qui,
      sulla terrazza più alta di Qir-Azel, affacciata a ovest sulla Cicatrice,
      l'aria sa d'incenso e di cera, e le campane delle ore sacre scandiscono
      il giorno meglio di qualunque sole. La sera gli obelischi con i cristalli
      conduttori cominciano a ronzare, e le creature minori della Marea che
      risalgono dalla voragine si tengono a distanza. Gli abitanti dicono che è
      la fede. I Raschiatori dicono che è la corrente.

      Senza invito non si sale. Tu ce l'hai, e le guardie lo leggono due volte.

      Quassù ci sono la Casa dei Nodi, dove la Gilda annoda i suoi conti; la
      Biblioteca, con gli scaffali sigillati a cera nera; l'Accademia di
      Torvessa; i manieri delle famiglie che firmarono il Patto delle Corde,
      ciascuno con i suoi cani, le sue statue, le sue finestre accese troppo
      tardi. Il Municipio ha le porte più grandi di tutti.

      Ma le decisioni vere si prendono in Cattedrale, non in Municipio. Lo
      sanno tutti. È una delle poche cose, quassù, che nessuno si prende la
      briga di smentire.
    accesso: [invito >= 1]

storylet:
  - id: purificazione
    immagine: ambientazione/cattedrale-del-velo
    titolo: La purificazione
    sommario: "Chi torna dalle profondità passa dalla Cripta. Il Velo non promette guarigione: promette contenimento."
    luogo: Cripta della Cattedrale del Velo
    area: quartieri-alti
    ripetibile: true
    requisiti: [contaminazione >= 0.5]
    testo: |
      Chi torna dalle profondità deve passare dalla Cripta: è la regola del
      Velo, e la città la rispetta più di molte leggi. Si scende una scala di
      pietra grigia, nuova, che odora ancora di calce, fino a una sala bassa
      dove l'incenso si mescola al rame. Un accolito velato ti guarda gli
      occhi, poi la mano sinistra, cercando il tremito. Non dice cosa vede.

      Oltre una porta che non si apre per te, qualcuno recita la Preghiera del
      Battito con una voce che sembra averne un'altra dietro: «Finché il cuore
      del mondo batterà, anche noi ricorderemo.»

      L'offerta è di cinquanta monete. Il Velo non promette guarigione.
      Promette contenimento.
    opzioni:
      - testo: "Pagare l'offerta al Velo"
        descrizione: "Cinquanta monete nel bacile di rame, e le mani dell'accolito sulle tue tempie. Il resto è fede, o abitudine."
        requisiti: [monete >= 50]
        esito:
          titolo: Contenimento
          testo: |
            Le monete cadono nel bacile di rame con un suono che la sala
            trattiene troppo a lungo. L'accolito ti fa inginocchiare, ti bagna
            la fronte con un'acqua che sa di resina e di ferro, ti preme i
            pollici sulle tempie mormorando parole che non capisci. Un calore ti
            sale dalle ginocchia.

            Il sapore di metallo sotto la lingua se ne va. Non del tutto: se ci
            pensi, c'è ancora, lontano, come una moneta in fondo a un pozzo. Il
            Velo aveva detto contenimento. Il Velo mantiene quello che promette.
          effetti: { monete: -50, contaminazione: -0.5, rep.velo: 0.5 }

  - id: navata-silenziosa
    immagine: fazioni/confraternita-del-velo
    titolo: La navata silenziosa
    sommario: "Qui la verità è quello che si decide di non smentire. Ma i cronisti, a volte, parlano troppo forte."
    luogo: Cattedrale del Velo
    area: quartieri-alti
    ripetibile: true
    testo: |
      La nuova Cattedrale del Velo è stata inaugurata la sera della razzia, e
      ha già l'aria di qualcosa che c'è sempre stato. Le pareti sono in parte
      pietra e in parte altro: segmenti di metallo precuriano fusi nella
      muratura come ossa in una ferita rimarginata. Sull'altare un grande
      cristallo rosso pulsa al ritmo delle ore canoniche.

      Si parla a bassa voce. Si ascolta a voce ancora più bassa. Nelle navate
      laterali i cronisti del Velo si scambiano appunti che nessuno scriverà.
      Qui la verità è quello che si decide di non smentire, e ogni giorno
      qualcuno decide qualcosa.
    opzioni:
      - testo: "Ascoltare i sussurri dei cronisti"
        descrizione: "Una panca vicino alla colonna giusta, un libro di preghiere aperto a caso, le orecchie tese. Qui il galateo è una forma di mimetismo."
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Media }
        successo:
          titolo: Un sarcofago vuoto
          testo: |
            Un cronista anziano, le dita macchiate d'inchiostro fino alle
            nocche, ha l'udito debole e quindi la voce alta. Parla a un collega
            più giovane del cimitero, di una cripta, di un sarcofago che
            qualcuno ha trovato aperto la mattina dopo la razzia. Aperto e
            vuoto.

            Il collega gli stringe il braccio, forte, e il vecchio si zittisce.
            Troppo tardi. Tu hai già girato pagina nel libro di preghiere, con
            grande devozione.
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Accompagnato all'uscita
          testo: |
            Ti avvicini troppo, o ascolti troppo apertamente, o forse sono solo
            le tue scarpe, che hanno ancora la polvere della Città Bassa. Un
            accolito velato ti si materializza accanto, ti posa due dita sul
            gomito e, con una gentilezza che non ammette repliche, ti
            accompagna all'uscita.

            Sulla soglia ti benedice. Suona molto come un arrivederci. Suona
            anche un po' come un nome annotato.
          effetti: { scandalo: 0.5 }
