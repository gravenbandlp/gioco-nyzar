aree:
  - id: quartieri-alti
    immagine: ambientazione/quartieri-alti
    nome: Quartieri Alti
    sommario: "La terrazza più alta di Qir-Azel, dove stanno la Cattedrale e i manieri, e senza invito non si sale."
    testo: |
      I Quartieri Alti occupano la terrazza più alta di Qir-Azel, con case di
      pietra dai tetti di rame e lanterne dorate. Senza invito non si sale, e
      le guardie leggono il tuo due volte, la seconda muovendo le labbra.

      Quassù hanno sede la Casa dei Nodi e la Biblioteca con gli scaffali
      sigillati a cera nera. Accanto all'Accademia di Torvessa e al Municipio
      stanno i manieri delle famiglie del Patto delle Corde. In Municipio si
      discute, ma le decisioni vere si prendono in Cattedrale.
    accesso: [invito >= 1]
    negozi: [la-collezione-di-orvald]

storylet:
  - id: purificazione
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: La purificazione
    sommario: "Chi torna dalle profondità deve passare dalla Cripta del Velo, dove, in cambio di un'offerta, si contiene la contaminazione."
    luogo: Cripta della Cattedrale del Velo
    area: quartieri-alti
    ripetibile: true
    requisiti: [contaminazione >= 0.5]
    testo: |
      Chi torna dalle profondità, per regola del Velo, passa dalla Cripta,
      una sala bassa dove l'incenso copre a stento l'odore del rame. Un
      accolito velato ti guarda gli occhi e la mano sinistra, e non ti dice
      cosa ha visto. In cambio dell'offerta promette contenimento, mai
      guarigione.

      {medicina Media} Ti ha guardato il bianco dell'occhio, dove la
      contaminazione lascia per prima una venatura color ruggine.

      {origine accolito-del-velo} Il gesto te l'hanno insegnato, ma nessuno
      te l'aveva mai fatto.

      {origine apprendista-raschiatore} Sulle piattaforme l'offerta della
      Cripta si mette fra le spese del turno, come l'olio delle lanterne.
    opzioni:
      - testo: "Pagare l'offerta al Velo"
        descrizione: "Lasciare l'offerta nel bacile di rame e farsi imporre le mani dall'accolito."
        requisiti: [monete >= 50]
        esito:
          titolo: Contenimento
          testo: |
            Le monete cadono nel bacile con un suono che rimbomba nella sala
            bassa. Inginocchiato sulla pietra fredda, ti lasci bagnare la fronte
            con un'acqua che odora di resina mentre l'accolito mormora parole che
            non capisci. Il sapore di metallo sotto la lingua se ne va quasi del
            tutto, e se ci pensi lo senti ancora, lontano, come una moneta in
            fondo a un pozzo.
          effetti: { monete: -50, contaminazione: -0.5, rep.velo: 0.5 }

  - id: navata-silenziosa
    presso: cattedrale-del-velo
    immagine: fazioni/confraternita-del-velo
    titolo: La navata silenziosa
    sommario: "Nelle navate i cronisti del Velo si scambiano notizie a bassa voce, e i più anziani troppo forte."
    luogo: Cattedrale del Velo
    area: quartieri-alti
    ripetibile: true
    testo: |
      La nuova Cattedrale del Velo, inaugurata la sera della razzia, ha
      pareti in parte organiche, con segmenti di metallo precuriano fusi
      nella muratura come ossa in una ferita rimarginata. Sull'altare un
      cristallo rosso pulsa al ritmo delle ore canoniche.

      {magia Media} Il battito è troppo regolare per un cristallo lasciato a
      se stesso, e il Mana glielo dosa qualcuno.

      In prima fila una vecchia si è portata un cuscino ricamato con le
      iniziali di un'altra persona.

      {origine rampollo-dei-quartieri-alti} I casati si sono già divisi le
      panche, lasciando un posto vuoto fra l'uno e l'altro come a tavola.
    opzioni:
      - testo: "Ascoltare i sussurri dei cronisti"
        descrizione: "Sederti vicino alla colonna giusta con un libro di preghiere aperto a caso, e ascoltare senza farti notare."
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Media }
        successo:
          titolo: Un sarcofago vuoto
          testo: |
            Un cronista anziano con le dita macchiate d'inchiostro ci sente poco,
            e per questo parla forte. Racconta a un collega più giovane di una
            cripta del cimitero e di un sarcofago trovato aperto e vuoto la
            mattina dopo la razzia, finché il collega gli stringe il braccio e lui
            si zittisce. Tu hai già sentito tutto, e volti pagina nel libro di
            preghiere con grande devozione.
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Accompagnato all'uscita
          testo: |
            Forse ti avvicini troppo, o forse ti tradiscono le scarpe ancora
            coperte della polvere della Città Bassa. Un accolito velato ti posa
            due dita sul gomito e ti accompagna con molta gentilezza fino alla
            soglia, dove ti congeda con una benedizione.
          effetti: { scandalo: 1 }

  - id: accademia-di-torvessa
    presso: accademia-di-torvessa
    titolo: L'Accademia di Torvessa
    luogo: Accademia di Torvessa
    area: quartieri-alti
    ripetibile: true
    immagine: ambientazione/accademia-di-torvessa
    requisiti: [magia >= 1]
    sommario: "Orvald Temmerin insegna le formule dei cristalli a chi sa già sentirli rispondere."
    testo: |
      L'Accademia di Torvessa è scuola ai piani alti e museo nel
      seminterrato, che il preside Orvald Temmerin ha preteso in cambio
      della presidenza per i trofei di trent'anni di scavi.

      Dà lezioni private nel suo studio, fra pile di mappe e un teschio di
      cinghiale mutato, parlando alle mappe più che all'allievo, mentre il
      corvo Pett segue da una trave.

      {addestrare-animali Facile} Pett cambia zampa quando la formula è
      sbagliata, e un allievo accorto gli porta qualcosa da mangiare.

      {origine allievo-di-torvessa} Lo sgabello degli allievi zoppica
      ancora, e ti siedi già spostato a destra perché non dondoli.
    opzioni:
      - testo: "Scudo arcano"
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 1, incantesimo.scudo-arcano == 0, monete >= 20]
        costo: 2
        descrizione: "Orvald insegna la difesa prima dell'attacco, e la lezione si paga subito."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: La lamina
          testo: |
            Orvald ti tira addosso quello che trova sul tavolo, da una mela
            morsicata fino a un libro, e col libro la lamina regge. Pett fa un
            verso che somiglia a una risata.
          effetti: { monete: -20, incantesimo.scudo-arcano: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Orvald ascolta la tua formula a occhi chiusi, con le dita intrecciate
            sulla pancia, poi ti dice di ripeterla la settimana prossima e di
            tenerti le monete della lezione.
          effetti: {}
      - testo: "Sussurro di paura"
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 1, incantesimo.sussurro-di-paura == 0, monete >= 20]
        costo: 2
        descrizione: "Una formula che si pronuncia a bocca chiusa, e che Orvald vende a poco."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Nell'orecchio
          testo: |
            Provi la formula su Pett, che arruffa le penne e va a nascondersi
            dietro una pila di mappe, guardandoti con un occhio solo e parecchio
            rancore. Orvald dice che al corvo porterai delle noci.
          effetti: { monete: -20, incantesimo.sussurro-di-paura: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Orvald ascolta la tua formula a occhi chiusi, con le dita intrecciate
            sulla pancia, poi ti dice di ripeterla la settimana prossima e di
            tenerti le monete della lezione.
          effetti: {}
      - testo: "Fiamma"
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 2, incantesimo.fiamma == 0, monete >= 50]
        costo: 2
        descrizione: "Il fuoco azzurro dei cristalli. Il prezzo è pieno, e le lezioni si fanno nel cortile."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Fuoco azzurro
          testo: |
            La prima fiamma ti brucia le sopracciglia. La seconda arriva al
            bersaglio di paglia in fondo al cortile e lo lascia fumante, e Orvald
            annuisce una volta sola.

            {resistenza Facile} Le sopracciglia ricrescono in un mese, e nel
            frattempo avrai sempre un'aria un po' sorpresa.
          effetti: { monete: -50, incantesimo.fiamma: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Orvald ascolta la tua formula a occhi chiusi, con le dita intrecciate
            sulla pancia, poi ti dice di ripeterla la settimana prossima e di
            tenerti le monete della lezione.
          effetti: {}
      - testo: "Rapidità"
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 2, incantesimo.rapidita == 0, monete >= 50]
        costo: 2
        descrizione: "Il Mana nei muscoli invece che nel cristallo. Una lezione che si paga cara."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il mondo rallenta
          testo: |
            Per qualche momento le gocce della fontana del cortile cadono piano, e
            hai il tempo di contarne undici. Poi tutto torna normale e ti gira la
            testa, e Orvald ti fa sedere dicendoti che la seconda volta va meglio.
          effetti: { monete: -50, incantesimo.rapidita: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Orvald ascolta la tua formula a occhi chiusi, con le dita intrecciate
            sulla pancia, poi ti dice di ripeterla la settimana prossima e di
            tenerti le monete della lezione.
          effetti: {}
      - testo: "Leggere il Mana"
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 2, incantesimo.leggere-il-mana == 0, monete >= 40]
        costo: 2
        descrizione: "Nel seminterrato Orvald tiene una cassetta di cristalli carichi mescolati a falsi, e si prende quello che esce."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La cassetta
          testo: |
            Tocchi i cristalli a occhi chiusi. Al settimo senti un battito lento,
            all'undicesimo un ronzio che non assomiglia al Mana, e Orvald ti dice
            con un certo orgoglio cittadino che è un falso della Città Bassa, e
            dei migliori.
          effetti: { monete: -40, incantesimo.leggere-il-mana: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Orvald ascolta la tua formula a occhi chiusi, con le dita intrecciate
            sulla pancia, poi ti dice di ripeterla la settimana prossima e di
            tenerti le monete della lezione.
          effetti: {}

  - id: seminterrato-di-orvald
    presso: accademia-di-torvessa
    titolo: Il seminterrato di Orvald
    luogo: Accademia di Torvessa, seminterrato
    area: quartieri-alti
    ripetibile: true
    immagine: personaggi/orvald-temmerin
    requisiti: [magia >= 3]
    sommario: "Le formule che Orvald non insegna al piano di sopra."
    testo: |
      Il seminterrato dell'Accademia è lungo e basso e odora di olio per le
      armi. Fra le mappe di trent'anni di scavi sono appese lame e teschi
      con i cartellini scritti a mano, e in fondo c'è un bersaglio di legno
      rinforzato con una placca di lyssan.

      Qui Orvald insegna le formule che non vuole sentire nominare al piano
      di sopra. Prima di cominciare ti chiede ogni volta che cosa hai fatto
      con quelle che già conosci, e aspetta la risposta a braccia
      incrociate, abbastanza a lungo da farti ripassare tutte le volte che
      le hai usate male.
    opzioni:
      - testo: "Sigillo"
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 3, incantesimo.sigillo == 0, monete >= 80]
        costo: 2
        descrizione: "Le serrature di Mana dei Precursori e del Velo. Costa caro, e non va usato sulle porte dell'Accademia."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La porta del seminterrato
          testo: |
            Chiudi la porta del seminterrato con il sigillo e Orvald prova ad
            aprirla, prima con la mano e poi con la spalla. Quando non ci riesce
            sembra contento, e ti ricorda la promessa scandendola parola per
            parola.
          effetti: { monete: -80, incantesimo.sigillo: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Orvald ascolta la tua formula a occhi chiusi, con le dita intrecciate
            sulla pancia, poi ti dice di ripeterla la settimana prossima e di
            tenerti le monete della lezione.
          effetti: {}
      - testo: "Lancia di luce"
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 3, incantesimo.lancia-di-luce == 0, monete >= 100]
        costo: 2
        descrizione: "Un raggio che resta dritto, e un prezzo da maestro."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il trofeo
          testo: |
            Il raggio attraversa il seminterrato e si ferma contro una placca di
            lyssan appesa al muro per questo scopo. Sulla placca ci sono già
            venti segni, ognuno con una data graffiata accanto. Il tuo è il più
            piccolo, ma è dritto.
          effetti: { monete: -100, incantesimo.lancia-di-luce: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Orvald ascolta la tua formula a occhi chiusi, con le dita intrecciate
            sulla pancia, poi ti dice di ripeterla la settimana prossima e di
            tenerti le monete della lezione.
          effetti: {}
      - testo: "Folgore"
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 5, incantesimo.folgore == 0, monete >= 300]
        costo: 2
        descrizione: "Tutto il Mana di un cristallo in un colpo. Orvald la insegna a pochi, e il cristallo lo paghi tu."
        prova: { attributo: mentale, abilita: magia, difficolta: Molto difficile }
        successo:
          titolo: Il cristallo si spegne
          testo: |
            Il colpo spacca il manichino di legno e lascia il cristallo nero e
            freddo. Orvald lo mette su uno scaffale insieme agli altri, con
            un'etichetta col tuo nome.
          effetti: { monete: -300, incantesimo.folgore: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Orvald ascolta la tua formula a occhi chiusi, con le dita intrecciate
            sulla pancia, poi ti dice di ripeterla la settimana prossima e di
            tenerti le monete della lezione.
          effetti: {}

  - id: scuola-dei-novizi
    presso: cattedrale-del-velo
    titolo: La scuola dei novizi
    luogo: Cattedrale del Velo, chiostro
    area: quartieri-alti
    ripetibile: true
    immagine: fazioni/confraternita-del-velo
    requisiti: [rep.velo >= 2]
    sommario: "Il Velo insegna la liturgia a chi gli è fedele, e a nessun altro."
    testo: |
      Il chiostro della Cattedrale è un quadrato attorno a un giardino di
      piante bioluminescenti, che la sera si riaccendono. Un novizio le
      annaffia e a ognuna chiede scusa per il ritardo. Qui chi ha dimostrato
      fedeltà alla Confraternita impara le preghiere che curano e quelle che
      proteggono, lasciando un'offerta a ogni lezione.

      {galateo Media} Nel chiostro la parola magia non si usa, e chi la usa
      viene corretto con un *fratello* davanti al nome.

      {origine accolito-del-velo} Il novizio ti riconosce dalle mani raccolte
      alla cintura e da quel momento abbassa la voce anche con le piante.
    opzioni:
      - testo: "Benedizione"
        immagine: personaggi/madre-del-velo
        requisiti: [magia >= 1, incantesimo.benedizione == 0, monete >= 10, rep.velo >= 2]
        costo: 2
        descrizione: "Una preghiera breve, insegnata a chi porta il nome del Velo, per una piccola offerta."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: La prima preghiera
          testo: |
            Ripeti la preghiera davanti all'altare di cristallo rosso finché le
            parole non ti vengono da sole. A un certo punto l'altare pulsa più
            forte, e il sacerdote accanto a te fa finta di non averlo visto.
          effetti: { monete: -10, incantesimo.benedizione: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Il sacerdote che ti segue scuote la testa, come un maestro di musica
            davanti a una stonatura, e ti rimanda alla preghiera della sera,
            mentre l'offerta resta nella cassetta.
          effetti: {}
      - testo: "Rimarginare"
        immagine: personaggi/madre-del-velo
        requisiti: [magia >= 2, incantesimo.rimarginare == 0, monete >= 30, rep.velo >= 4]
        costo: 2
        descrizione: "La preghiera dei guaritori della Cattedrale. Si paga con un'offerta nella cassetta."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le mani calde
          testo: |
            Ti fanno esercitare nell'infermeria su un novizio che si è tagliato al
            braccio con un coltello da pane, e sotto le tue mani la ferita si
            chiude lasciando una riga rosa.
          effetti: { monete: -30, incantesimo.rimarginare: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Il sacerdote che ti segue scuote la testa, come un maestro di musica
            davanti a una stonatura, e ti rimanda alla preghiera della sera,
            mentre l'offerta resta nella cassetta.
          effetti: {}
      - testo: "Veglia"
        immagine: personaggi/madre-del-velo
        requisiti: [magia >= 2, incantesimo.veglia == 0, monete >= 30, rep.velo >= 4]
        costo: 2
        descrizione: "La preghiera della notte, per chi porta pesi che non si vedono. L'offerta è quella di sempre."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La notte in navata
          testo: |
            Passi la notte in navata con altri due novizi, in ginocchio finché
            non senti più i piedi. All'alba il sacerdote
            ti dice che hai pregato per te stesso più che per gli altri, e che
            per cominciare va bene così.
          effetti: { monete: -30, incantesimo.veglia: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Il sacerdote che ti segue scuote la testa, come un maestro di musica
            davanti a una stonatura, e ti rimanda alla preghiera della sera,
            mentre l'offerta resta nella cassetta.
          effetti: {}
      - testo: "Esorcismo"
        immagine: personaggi/madre-del-velo
        requisiti: [magia >= 3, incantesimo.esorcismo == 0, monete >= 60, rep.velo >= 6]
        costo: 2
        descrizione: "Il rito del Velo per le cripte, insegnato solo a chi il Velo conosce bene e per un'offerta generosa."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Nella cripta
          testo: |
            Nella cripta sotto la Cattedrale l'aria è più fredda, e reciti il rito
            davanti a una nicchia vuota con una voce che all'inizio ti esce
            sottile. Alla fine la fiamma della candela che tieni in mano smette di
            piegarsi verso il muro.
          effetti: { monete: -60, incantesimo.esorcismo: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Il sacerdote che ti segue scuote la testa, come un maestro di musica
            davanti a una stonatura, e ti rimanda alla preghiera della sera,
            mentre l'offerta resta nella cassetta.
          effetti: {}
