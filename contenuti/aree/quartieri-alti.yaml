aree:
  - id: quartieri-alti
    immagine: ambientazione/quartieri-alti
    nome: Quartieri Alti
    testo: |
      I Quartieri Alti occupano la terrazza più alta di Qir-Azel, affacciata a
      ovest sulla Cicatrice. Le case sono di pietra chiara con i tetti di
      rame, e le lanterne dorate a cristalli conduttori non fanno fumo. Nelle
      strade si sente l'incenso, e il giorno è scandito dalle campane delle
      ore sacre più che dal sole. La sera gli obelischi con i cristalli
      conduttori cominciano a ronzare, e le creature minori della Marea che
      risalgono dalla voragine si tengono a distanza. Gli abitanti lo
      attribuiscono alla fede, i Raschiatori alla corrente.

      Senza invito non si sale. Tu ce l'hai, e le guardie lo leggono due volte
      prima di farti passare.

      Quassù hanno sede la Casa dei Nodi, dove la Gilda tiene i suoi conti, e
      la Biblioteca, con gli scaffali sigillati a cera nera. Poco lontano ci
      sono l'Accademia di Torvessa e il Municipio, che ha le porte più grandi
      della città. Poi vengono i manieri delle famiglie che firmarono il Patto
      delle Corde, ognuno con i suoi cani da guardia e le finestre accese fino
      a tardi.

      In Municipio si discute, ma le decisioni vere si prendono in Cattedrale.
      Quassù lo sanno tutti, e nessuno si prende la briga di smentirlo.
    accesso: [invito >= 1]

storylet:
  - id: purificazione
    immagine: ambientazione/cattedrale-del-velo
    titolo: La purificazione
    sommario: "Chi torna dalle profondità deve passare dalla Cripta del Velo, dove per cinquanta monete si contiene la contaminazione."
    luogo: Cripta della Cattedrale del Velo
    area: quartieri-alti
    ripetibile: true
    requisiti: [contaminazione >= 0.5]
    testo: |
      La regola del Velo vuole che chi torna dalle profondità passi dalla
      Cripta, e la città la rispetta più di molte leggi. Si scende per una
      scala di pietra grigia, nuova, che odora ancora di calce, fino a una
      sala bassa dove l'incenso copre a stento l'odore del rame. Un accolito
      velato ti guarda gli occhi e poi la mano sinistra, per vedere se trema.
      Non ti dice cosa ha visto.

      Dietro una porta chiusa si sente recitare la Preghiera del Battito:
      «Finché il cuore del mondo batterà, anche noi ricorderemo.» L'offerta è
      di cinquanta monete. In cambio il Velo promette contenimento, e i
      sacerdoti stanno attenti a non usare mai la parola guarigione.
    opzioni:
      - testo: "Pagare l'offerta al Velo"
        descrizione: "Lasciare cinquanta monete nel bacile di rame e farsi imporre le mani dall'accolito."
        requisiti: [monete >= 50]
        esito:
          titolo: Contenimento
          testo: |
            Le monete cadono nel bacile e il suono rimbomba a lungo nella sala
            bassa. L'accolito ti fa inginocchiare e ti bagna la fronte con
            un'acqua che odora di resina. Poi ti preme i pollici sulle tempie e
            mormora in latino liturgico parole che non capisci. Dalle ginocchia
            ti sale un calore lento.

            Il sapore di metallo sotto la lingua se ne va quasi del tutto. Se ci
            pensi lo senti ancora, lontano, come una moneta in fondo a un pozzo.
            Il Velo aveva promesso contenimento e ha mantenuto la parola.
          effetti: { monete: -50, contaminazione: -0.5, rep.velo: 0.5 }

  - id: navata-silenziosa
    immagine: fazioni/confraternita-del-velo
    titolo: La navata silenziosa
    sommario: "Nelle navate della Cattedrale i cronisti del Velo si scambiano notizie a bassa voce, e i più anziani parlano troppo forte."
    luogo: Cattedrale del Velo
    area: quartieri-alti
    ripetibile: true
    testo: |
      La nuova Cattedrale del Velo è stata inaugurata la sera della razzia, ma
      sembra già in piedi da sempre. Le pareti sono in parte di pietra e in
      parte organiche, con segmenti di metallo precuriano fusi nella muratura
      come ossa in una ferita rimarginata. Sull'altare un grande cristallo
      rosso pulsa al ritmo delle ore canoniche.

      Qui si parla a bassa voce. Nelle navate laterali i cronisti del Velo si
      scambiano appunti che non finiranno in nessuna cronaca. In città si dice
      che in Cattedrale la verità sia quello che si decide di non smentire, e
      ogni giorno qui dentro si decide qualcosa.
    opzioni:
      - testo: "Ascoltare i sussurri dei cronisti"
        descrizione: "Sederti su una panca vicino alla colonna giusta, con un libro di preghiere aperto a caso, e ascoltare. Qui il galateo serve a passare inosservati."
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Media }
        successo:
          titolo: Un sarcofago vuoto
          testo: |
            Un cronista anziano con le dita macchiate d'inchiostro fino alle
            nocche ci sente poco, e per questo parla forte. Racconta a un
            collega più giovane di una cripta del cimitero e di un sarcofago
            trovato aperto e vuoto la mattina dopo la razzia.

            Il collega gli stringe il braccio e il vecchio si zittisce, ma tu
            hai già sentito tutto. Volti pagina nel libro di preghiere con
            grande devozione.
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Accompagnato all'uscita
          testo: |
            Forse ti avvicini troppo, o forse ti tradiscono le scarpe, ancora
            coperte della polvere della Città Bassa. Un accolito velato compare
            al tuo fianco e ti posa due dita sul gomito. Con molta gentilezza, e
            senza lasciarti il tempo di replicare, ti accompagna all'uscita.

            Sulla soglia ti benedice e ti congeda. Da oggi, probabilmente, la
            tua faccia compare negli appunti dei cronisti.
          effetti: { scandalo: 0.5 }
