aree:
  - id: quartieri-alti
    immagine: ambientazione/quartieri-alti
    nome: Quartieri Alti
    sommario: "La terrazza più alta di Qir-Azel, con le case di pietra chiara e le campane che scandiscono il giorno. Qui stanno la Cattedrale e i manieri delle grandi famiglie, e senza invito le guardie non ti fanno salire."
    testo: |
      I Quartieri Alti occupano la terrazza più alta di Qir-Azel, affacciata a
      ovest sulla Cicatrice. Le case sono di pietra chiara con i tetti di
      rame, e le lanterne dorate a cristalli conduttori non fanno fumo. Nelle
      strade si sente l'incenso, e il giorno è scandito dalle campane delle
      ore sacre più che dal sole. La sera gli obelischi con i cristalli
      conduttori cominciano a ronzare, e le creature minori della Marea che
      risalgono dalla voragine si tengono a distanza. Gli abitanti lo
      attribuiscono alla fede, i Raschiatori alla corrente.

      Senza invito non si sale. Tu ce l'hai, e le guardie lo leggono due volte,
      la seconda muovendo le labbra, prima di farti passare.

      Quassù hanno sede la Casa dei Nodi, dove la Gilda tiene i suoi conti, e
      la Biblioteca, con gli scaffali sigillati a cera nera. Poco lontano ci
      sono l'Accademia di Torvessa e il Municipio, che ha le porte più grandi
      della città. Poi vengono i manieri delle famiglie che firmarono il Patto
      delle Corde, ognuno con i suoi cani da guardia e le finestre accese fino
      a tardi. Davanti a uno di questi un servitore spazza i gradini già
      puliti, lentamente, perché da una finestra del primo piano qualcuno lo
      sta guardando.

      In Municipio si discute, ma le decisioni vere si prendono in Cattedrale.
      Quassù lo sanno tutti, e nessuno si prende la briga di smentirlo.
    accesso: [invito >= 1]

storylet:
  - id: purificazione
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: La purificazione
    sommario: "Chi torna dalle profondità deve passare dalla Cripta del Velo, dove, in cambio di un'offerta, si contiene la contaminazione."
    luogo: Cripta della Cattedrale del Velo
    area: quartieri-alti
    ripetibile: true
    requisiti: [contaminazione >= 0.5]
    testo: |
      La regola del Velo vuole che chi torna dalle profondità passi dalla
      Cripta, e la città la rispetta più di molte leggi. Si scende per una
      scala di pietra grigia, nuova, che odora ancora di calce, fino a una
      sala bassa dove l'incenso copre a stento l'odore del rame. Un accolito
      velato ti guarda gli occhi e poi la mano sinistra, per vedere se trema,
      e la mano, sentendosi osservata, trema un poco per conto suo. Non ti
      dice cosa ha visto.

      Dietro una porta chiusa si sente recitare la Preghiera del Battito:
      «Finché il cuore del mondo batterà, anche noi ricorderemo.» L'offerta è
      quella che il Velo chiede a tutti. In cambio il Velo promette contenimento, e i
      sacerdoti stanno attenti a non usare mai la parola guarigione.
    opzioni:
      - testo: "Pagare l'offerta al Velo"
        descrizione: "Lasciare l'offerta nel bacile di rame e farsi imporre le mani dall'accolito."
        requisiti: [monete >= 50]
        esito:
          titolo: Contenimento
          testo: |
            Le monete cadono nel bacile e il suono rimbomba a lungo nella sala
            bassa. L'accolito ti fa inginocchiare sulla pietra, fredda al punto
            da morderti le rotule attraverso la stoffa, e ti bagna la fronte con
            un'acqua che odora di resina. Poi ti preme i pollici sulle tempie e
            mormora in latino liturgico parole che non capisci. Dalle ginocchia
            ti sale un calore lento.

            Il sapore di metallo sotto la lingua se ne va quasi del tutto. Se ci
            pensi lo senti ancora, lontano, come una moneta in fondo a un pozzo.
            Il Velo aveva promesso contenimento e ha mantenuto la parola.
          effetti: { monete: -50, contaminazione: -0.5, rep.velo: 0.5 }

  - id: navata-silenziosa
    presso: cattedrale-del-velo
    immagine: fazioni/confraternita-del-velo
    titolo: La navata silenziosa
    sommario: "Nelle navate della Cattedrale i cronisti del Velo si scambiano notizie a bassa voce, e i più anziani parlano troppo forte."
    luogo: Cattedrale del Velo
    area: quartieri-alti
    ripetibile: true
    testo: |
      La nuova Cattedrale del Velo è stata inaugurata la sera della razzia, ma
      sembra già in piedi da sempre. Le pareti sono in parte di pietra e in
      parte organiche, con segmenti di metallo precuriano fusi nella muratura
      come ossa in una ferita rimarginata. Sull'altare un grande cristallo
      rosso pulsa al ritmo delle ore canoniche, e dopo qualche minuto ti
      accorgi che il cuore prova ad andargli dietro e sbaglia il tempo.

      Qui si parla a bassa voce. Nelle navate laterali i cronisti del Velo si
      scambiano appunti che non finiranno in nessuna cronaca. In città si dice
      che in Cattedrale la verità sia quello che si decide di non smentire, e
      ogni giorno qui dentro si decide qualcosa.
    opzioni:
      - testo: "Ascoltare i sussurri dei cronisti"
        descrizione: "Sederti su una panca vicino alla colonna giusta, con un libro di preghiere aperto a caso, e ascoltare. Qui il galateo serve a passare inosservati."
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Media }
        successo:
          titolo: Un sarcofago vuoto
          testo: |
            Un cronista anziano con le dita macchiate d'inchiostro fino alle
            nocche ci sente poco, e per questo parla forte. Racconta a un
            collega più giovane di una cripta del cimitero e di un sarcofago
            trovato aperto e vuoto la mattina dopo la razzia.

            Il collega gli stringe il braccio e il vecchio si zittisce, ma tu
            hai già sentito tutto. Volti pagina nel libro di preghiere con
            grande devozione.
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Accompagnato all'uscita
          testo: |
            Forse ti avvicini troppo, o forse ti tradiscono le scarpe, ancora
            coperte della polvere della Città Bassa. Un accolito velato compare
            al tuo fianco e ti posa due dita sul gomito. Con molta gentilezza, e
            senza lasciarti il tempo di replicare, ti accompagna all'uscita.

            Sulla soglia ti benedice e ti congeda. Da oggi, probabilmente, la
            tua faccia compare negli appunti dei cronisti.
          effetti: { scandalo: 0.5 }

  - id: accademia-di-torvessa
    presso: accademia-di-torvessa
    titolo: L'Accademia di Torvessa
    luogo: Accademia di Torvessa
    area: quartieri-alti
    ripetibile: true
    immagine: ambientazione/accademia-di-torvessa
    requisiti: [magia >= 1]
    sommario: "Orvald Temmerin insegna le formule dei cristalli a chi sa già sentirli rispondere."
    testo: |
      L'Accademia di Torvessa è scuola ai piani alti e museo nel
      seminterrato. Il preside, Orvald Temmerin, ha passato trent'anni negli
      scavi prima di accettare la presidenza, e l'ha accettata in cambio del
      seminterrato, dove tiene le armi e i trofei dei suoi scavi. Li mostra
      solo a chi lo tratta con rispetto.

      Orvald dà lezioni private nel suo studio, fra pile di mappe e un
      teschio di cinghiale mutato. Parla guardando le mappe più che
      l'allievo, e ogni tanto ne picchietta una con la nocca, come se
      aspettasse una conferma. Il suo corvo, Pett, segue le lezioni da
      una trave e interviene quando gli pare. Orvald risponde di rado due
      volte alla stessa domanda, quindi conviene ascoltare la prima.
    opzioni:
      - testo: "Scudo arcano"
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 1, incantesimo.scudo-arcano == 0, monete >= 20]
        costo: 2
        descrizione: "Orvald insegna la difesa prima dell'attacco, e la lezione si paga subito."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: La lamina
          testo: |
            Orvald ti tira addosso quello che trova sul tavolo, e alla fine un
            libro. Col libro la lamina regge, e il libro cade sul pavimento a un palmo
            dalla tua faccia. Pett, il corvo, fa un verso che somiglia a una risata.
          effetti: { monete: -20, incantesimo.scudo-arcano: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Orvald ascolta la tua formula fino alla fine, poi ti dice di
            ripeterla la settimana prossima e di tenerti le monete della
            lezione.
          effetti: {}
      - testo: "Sussurro di paura"
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 1, incantesimo.sussurro-di-paura == 0, monete >= 20]
        costo: 2
        descrizione: "Una formula che si pronuncia a bocca chiusa, e che Orvald vende a poco."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Nell'orecchio
          testo: |
            Provi la formula sul corvo di Orvald. Pett arruffa le penne e va a
            nascondersi dietro una pila di mappe. Orvald dice che per oggi basta
            così e che al corvo porterai delle noci.
          effetti: { monete: -20, incantesimo.sussurro-di-paura: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Orvald ascolta la tua formula fino alla fine, poi ti dice di
            ripeterla la settimana prossima e di tenerti le monete della
            lezione.
          effetti: {}
      - testo: "Fiamma"
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 2, incantesimo.fiamma == 0, monete >= 50]
        costo: 2
        descrizione: "Il fuoco azzurro dei cristalli. Il prezzo è pieno, e le lezioni si fanno nel cortile."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Fuoco azzurro
          testo: |
            La prima fiamma ti brucia le sopracciglia e ti lascia addosso
            odore di strinato. La seconda arriva al
            bersaglio di paglia in fondo al cortile e lo lascia fumante, e
            Orvald annuisce una volta sola.
          effetti: { monete: -50, incantesimo.fiamma: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Orvald ascolta la tua formula fino alla fine, poi ti dice di
            ripeterla la settimana prossima e di tenerti le monete della
            lezione.
          effetti: {}
      - testo: "Rapidità"
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 2, incantesimo.rapidita == 0, monete >= 50]
        costo: 2
        descrizione: "Il Mana nei muscoli invece che nel cristallo. Una lezione che si paga cara."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il mondo rallenta
          testo: |
            Per qualche respiro le gocce della fontana del cortile cadono piano,
            e tu hai il tempo di contarle. Poi tutto torna normale e ti gira la
            testa. Orvald ti fa sedere e ti dice che la seconda volta va meglio.
          effetti: { monete: -50, incantesimo.rapidita: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Orvald ascolta la tua formula fino alla fine, poi ti dice di
            ripeterla la settimana prossima e di tenerti le monete della
            lezione.
          effetti: {}
      - testo: "Leggere il Mana"
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 2, incantesimo.leggere-il-mana == 0, monete >= 40]
        costo: 2
        descrizione: "Orvald tiene nel seminterrato una cassetta di cristalli carichi mescolati a cristalli falsi. Si paga la lezione e si prende quello che esce."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La cassetta
          testo: |
            Tocchi i cristalli uno per uno con gli occhi chiusi. Al settimo
            senti un battito lento, al nono niente, all'undicesimo un ronzio
            che non assomiglia al Mana. Orvald ti dice che l'undicesimo è un
            falso della Città Bassa, e dei migliori.
          effetti: { monete: -40, incantesimo.leggere-il-mana: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Orvald ascolta la tua formula fino alla fine, poi ti dice di
            ripeterla la settimana prossima e di tenerti le monete della
            lezione.
          effetti: {}

  - id: seminterrato-di-orvald
    presso: accademia-di-torvessa
    titolo: Il seminterrato di Orvald
    luogo: Accademia di Torvessa, seminterrato
    area: quartieri-alti
    ripetibile: true
    immagine: personaggi/orvald-temmerin
    requisiti: [magia >= 3]
    sommario: "Le formule che Orvald non insegna al piano di sopra."
    testo: |
      Il seminterrato dell'Accademia è lungo e basso e odora di polvere e
      di olio per le armi. Sulle pareti sono appese le mappe di trent'anni
      di scavi, e fra una mappa e l'altra sono appese lame e teschi con i
      cartellini scritti a mano. In fondo c'è un bersaglio di legno
      rinforzato con una placca di lyssan.

      Orvald insegna qui le formule che non vuole sentire nominare al piano
      di sopra. Prima di cominciare ti chiede ogni volta che cosa hai fatto
      con quelle che già conosci, e aspetta la risposta con le braccia
      incrociate, abbastanza a lungo da farti ripassare tutte le
      volte che le hai usate male.
    opzioni:
      - testo: "Sigillo"
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 3, incantesimo.sigillo == 0, monete >= 80]
        costo: 2
        descrizione: "Le serrature di Mana dei Precursori e del Velo. Un prezzo alto, e la promessa di non usarlo sulle porte dell'Accademia."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La porta del seminterrato
          testo: |
            Orvald ti fa chiudere la porta del seminterrato con il sigillo e poi
            prova ad aprirla senza riuscirci, e ne sembra contento. Ti fa riaprire
            la porta e ti ricorda la promessa.
          effetti: { monete: -80, incantesimo.sigillo: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Orvald ascolta la tua formula fino alla fine, poi ti dice di
            ripeterla la settimana prossima e di tenerti le monete della
            lezione.
          effetti: {}
      - testo: "Lancia di luce"
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 3, incantesimo.lancia-di-luce == 0, monete >= 100]
        costo: 2
        descrizione: "Un raggio che resta dritto, e un prezzo da maestro."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il trofeo
          testo: |
            Il raggio attraversa il seminterrato e si ferma contro una placca di
            lyssan appesa al muro per questo scopo. Sulla placca ci sono già
            venti segni. Il tuo è il più piccolo, ma è dritto.
          effetti: { monete: -100, incantesimo.lancia-di-luce: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Orvald ascolta la tua formula fino alla fine, poi ti dice di
            ripeterla la settimana prossima e di tenerti le monete della
            lezione.
          effetti: {}
      - testo: "Folgore"
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 5, incantesimo.folgore == 0, monete >= 300]
        costo: 2
        descrizione: "Tutto il Mana di un cristallo in un colpo. Orvald la insegna a pochi, e chiede una borsa pesante per il cristallo che si consuma."
        prova: { attributo: mentale, abilita: magia, difficolta: Molto difficile }
        successo:
          titolo: Il cristallo si spegne
          testo: |
            Il colpo spacca il manichino di legno e lascia il cristallo nero e
            freddo. Orvald lo raccoglie, lo mette su uno scaffale insieme agli
            altri e ci attacca un'etichetta con il tuo nome.
          effetti: { monete: -300, incantesimo.folgore: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Orvald ascolta la tua formula fino alla fine, poi ti dice di
            ripeterla la settimana prossima e di tenerti le monete della
            lezione.
          effetti: {}

  - id: scuola-dei-novizi
    presso: cattedrale-del-velo
    titolo: La scuola dei novizi
    luogo: Cattedrale del Velo, chiostro
    area: quartieri-alti
    ripetibile: true
    immagine: fazioni/confraternita-del-velo
    requisiti: [rep.velo >= 2]
    sommario: "Il Velo insegna la liturgia a chi gli è fedele, e a nessun altro."
    testo: |
      Il chiostro della Cattedrale è un quadrato di pietra chiara attorno a
      un giardino di piante bioluminescenti, che di giorno sembrano appassite
      e la sera si riaccendono una alla volta. Qui i novizi imparano la
      liturgia dell'Albero, le preghiere che curano e quelle che
      proteggono.

      Per il Velo non si tratta di magia. La parola non si usa nel chiostro,
      e chi la usa viene corretto. Le preghiere si insegnano a chi ha
      dimostrato fedeltà alla Confraternita, e a ogni lezione si lascia
      un'offerta nella cassetta di legno all'ingresso.
    opzioni:
      - testo: "Benedizione"
        immagine: personaggi/madre-del-velo
        requisiti: [magia >= 1, incantesimo.benedizione == 0, monete >= 10, rep.velo >= 2]
        costo: 2
        descrizione: "Una preghiera breve, insegnata a chi porta il nome del Velo, per una piccola offerta."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: La prima preghiera
          testo: |
            Ripeti la preghiera davanti all'altare di cristallo rosso finché le
            parole non ti vengono da sole. A un certo punto l'altare pulsa più
            forte, e il sacerdote accanto a te fa finta di non averlo visto.
          effetti: { monete: -10, incantesimo.benedizione: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Il sacerdote che ti segue scuote la testa e ti rimanda alla
            preghiera della sera. L'offerta resta nella cassetta.
          effetti: {}
      - testo: "Rimarginare"
        immagine: personaggi/madre-del-velo
        requisiti: [magia >= 2, incantesimo.rimarginare == 0, monete >= 30, rep.velo >= 4]
        costo: 2
        descrizione: "La preghiera dei guaritori della Cattedrale. Si paga con un'offerta nella cassetta."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le mani calde
          testo: |
            Ti fanno esercitare nell'infermeria, su un novizio che si è tagliato
            al braccio con un coltello da pane e ti chiede due volte della
            cicatrice. Sotto le tue mani la ferita si
            chiude lasciando una riga rosa.
          effetti: { monete: -30, incantesimo.rimarginare: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Il sacerdote che ti segue scuote la testa e ti rimanda alla
            preghiera della sera. L'offerta resta nella cassetta.
          effetti: {}
      - testo: "Veglia"
        immagine: personaggi/madre-del-velo
        requisiti: [magia >= 2, incantesimo.veglia == 0, monete >= 30, rep.velo >= 4]
        costo: 2
        descrizione: "La preghiera della notte, per chi porta pesi che non si vedono. L'offerta è quella di sempre."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La notte in navata
          testo: |
            Passi la notte in navata con altri due novizi. All'alba il sacerdote
            ti dice che hai pregato per te stesso più che per gli altri, e che
            per cominciare va bene così.
          effetti: { monete: -30, incantesimo.veglia: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Il sacerdote che ti segue scuote la testa e ti rimanda alla
            preghiera della sera. L'offerta resta nella cassetta.
          effetti: {}
      - testo: "Esorcismo"
        immagine: personaggi/madre-del-velo
        requisiti: [magia >= 3, incantesimo.esorcismo == 0, monete >= 60, rep.velo >= 6]
        costo: 2
        descrizione: "Il rito che il Velo usa nelle cripte, insegnato solo a chi il Velo conosce bene, in cambio di un'offerta generosa."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Nella cripta
          testo: |
            Ti portano nella cripta sotto la Cattedrale, dove l'aria è più
            fredda e i peli degli avambracci ti si rizzano. Reciti il rito davanti a una nicchia vuota. Alla fine la
            fiamma della candela che tieni in mano smette di piegarsi verso il
            muro.
          effetti: { monete: -60, incantesimo.esorcismo: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Il sacerdote che ti segue scuote la testa e ti rimanda alla
            preghiera della sera. L'offerta resta nella cassetta.
          effetti: {}
