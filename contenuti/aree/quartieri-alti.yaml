aree:
  - id: quartieri-alti
    nome: Quartieri Alti
    testo: >
      Pietra chiara, tetti di rame, lanterne dorate, campane delle ore sacre. Senza invito non si
      sale. Le decisioni vere si prendono in Cattedrale, non in Municipio.
    accesso: [invito >= 1]

storylet:
  - id: purificazione
    titolo: La purificazione
    luogo: Cripta della Cattedrale del Velo
    area: quartieri-alti
    ripetibile: true
    requisiti: [contaminazione >= 0.5]
    testo: >
      Chi torna dalle profondità deve passare dalla Cripta. Incenso, rame, una preghiera sussurrata:
      «Finché il cuore del mondo batterà, anche noi ricorderemo.»
    opzioni:
      - testo: "Pagare l'offerta al Velo"
        requisiti: [monete >= 50]
        esito:
          testo: "Il sapore di metallo sotto la lingua se ne va. Non del tutto."
          effetti: { monete: -50, contaminazione: -0.5, rep.velo: 0.5 }

  - id: navata-silenziosa
    titolo: La navata silenziosa
    luogo: Cattedrale del Velo
    area: quartieri-alti
    ripetibile: true
    testo: >
      L'altare di cristallo rosso pulsa al ritmo delle ore canoniche. Qui la verità è quello che si
      decide di non smentire.
    opzioni:
      - testo: "Ascoltare i sussurri dei cronisti"
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Media }
        successo:
          testo: "Un cronista anziano parla a voce troppo alta di un sarcofago vuoto."
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          testo: "Un accolito velato ti accompagna gentilmente all'uscita."
          effetti: { scandalo: 0.5 }
