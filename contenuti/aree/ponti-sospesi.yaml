aree:
  - id: ponti-sospesi
    nome: Ponti Sospesi
    testo: >
      Travi, corde e piattaforme sopra la Cicatrice. Il vento sa di ferro, fumo e resina, e il
      Ponte delle Mille Corde vibra di continuo. Una corda, qui, può essere un ponte o un cappio.
    gabella: 2
    negozi: [dispensa-di-gramm]

storylet:
  - id: bacheca-grifone
    titolo: La bacheca del Grifone di Ferro
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    ripetibile: true
    requisiti: [raschiatore >= 1]
    testo: >
      Nell'angolo della sala, la bacheca dei Raschiatori: pelli da vendere, sentieri abbandonati,
      nomi segnati due volte. Dragna Gro-Malog compila i turni con una grafia che non ammette repliche.
    opzioni:
      - testo: "Un turno sulle piattaforme della Cicatrice"
        prova: { attributo: fisico, abilita: [atletica, tecnologia], difficolta: Media }
        successo:
          testo: "Risalite con la gola roca e le tasche piene. Dragna annuisce, che per lei è un complimento."
          effetti: { cristalli.frammento-esausto: 3, cristalli.cristallo-sterile: 1, monete: 3, rep.raschiatori: 0.5 }
        fallimento:
          testo: "Una folata di Marea risale dalla gola. Il campo del bracciale regge, a malapena."
          effetti: { contaminazione: 0.5, ferite: 0.5 }

  - id: chiedere-a-dragna
    titolo: Chiedere a Dragna un posto nei turni
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    requisiti: [raschiatore == 0]
    testo: >
      Dragna Gro-Malog, maestra d'armi dei Raschiatori, denti limati, due dita in meno. «La paura
      ti tiene vivo. Tu ne hai abbastanza?»
    opzioni:
      - testo: "Convincerla che sei utile"
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Difficile }
        successo:
          testo: "«Domani, all'ultima campana. Se arrivi tardi, non tornare.» Sei nei turni."
          effetti: { raschiatore: 1, rep.raschiatori: 1 }
        fallimento:
          testo: "«Torna quando avrai qualcosa da perdere.»"
          effetti: {}
      - testo: "Mostrarle cosa sai fare con i cristalli"
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          testo: "Separi un cristallo carico da uno sterile al tatto. Dragna ti segna sulla bacheca."
          effetti: { raschiatore: 1, rep.raschiatori: 1 }
        fallimento:
          testo: "Sbagli cristallo. Qualcuno ride al bancone."
          effetti: { scandalo: 0.5 }

  - id: ponte-dei-morti
    titolo: Le lanterne del Ponte dei Morti
    luogo: Ponte dei Morti
    area: ponti-sospesi
    ripetibile: true
    requisiti: [tormento >= 0.5]
    testo: >
      Una lanterna per nome. Una lanterna per ciò che pensavi di sapere di lui. Qui il rumore della
      città arriva attutito, come da sott'acqua.
    opzioni:
      - testo: "Restare in silenzio tra le lanterne"
        prova: { attributo: mentale, abilita: [resilienza, espressivita], difficolta: Facile }
        successo:
          testo: "Per un'ora non pensi a niente. È abbastanza."
          effetti: { tormento: -1 }
        fallimento:
          testo: "Continui a contare le lanterne, e ogni volta sono una di più."
          effetti: { tormento: -0.5 }

  - id: custodi-di-passaggio
    titolo: L'ufficio dei Custodi di Passaggio
    luogo: Imbocco del Ponte delle Mille Corde
    area: ponti-sospesi
    requisiti: [licenza-gilda == 0]
    testo: >
      Varn Kett, ispettore dei dazi, scrive su una pergamena che forse non c'è. «Licenza,
      commissione, registro. Chi commercia senza viene multato, bandito, o perso di vista.»
    opzioni:
      - testo: "Pagare la licenza della Gilda"
        requisiti: [monete >= 200]
        esito:
          testo: "Un sigillo di cera, una firma, e da oggi i ponti non ti costano niente."
          effetti: { monete: -200, licenza-gilda: 1, rep.gilda: 1 }
