aree:
  - id: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    nome: Ponti Sospesi
    sommario: "Travi e piattaforme appese alle corde sopra la Cicatrice, fra il Mercato dei Nodi e il Grifone di Ferro."
    testo: |
      All'imbocco del Ponte delle Mille Corde i Custodi di Passaggio riscuotono la gabella, e oltre il loro
      gabbiotto hai sotto i piedi soltanto legno che cede appena. I Ponti Sospesi sono un reticolo di travi
      e piattaforme appese alle corde sopra la Cicatrice, fra lanterne di Mana che ondeggiano a ogni
      raffica.

      Sul ponte principale si stende il bazaar del Mercato dei Nodi, e più avanti c'è la Locanda del
      Grifone di Ferro. Ai margini le famiglie vivono in case di legno e lamiera appese sopra il vuoto.
    gabella: 2
    negozi: [dispensa-di-gramm, nodo-d-ossidiana]

storylet:
  - id: bacheca-grifone
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: La bacheca del Grifone di Ferro
    sommario: "Sulla bacheca dei Raschiatori si vendono pelli e si cercano compagni, e Dragna assegna i turni di scavo."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    ripetibile: true
    requisiti: [raschiatore >= 1]
    testo: |
      Nell'angolo della sala i Raschiatori tengono la loro bacheca, con offerte di
      pelli e richieste di squadre fissate con chiodi da ferro di cavallo, perché
      le puntine qui spariscono. Qualche nome è segnato due volte, perché la prima
      volta chi lo portava non era tornato.

      Dragna Gro-Malog, al suo solito tavolo, scrive le rotazioni premendo tanto da
      bucare la carta. Il tuo nome è sulla bacheca, e sotto c'è spazio per un altro
      turno.

      {origine apprendista-raschiatore} Il tuo nome qui c'era già prima del
      Festival, e Dragna è l'unica che non lo sbaglia mai.
    opzioni:
      - testo: "Un turno sulle piattaforme della Cicatrice"
        descrizione: "Scendere con la squadra alle piattaforme di scavo e risalire con i sacchi pieni prima che cambi il vento."
        prova: { attributo: fisico, abilita: [atletica, tecnologia], difficolta: Media }
        successo:
          titolo: Un cenno di Dragna
          testo: |
            Scendete lungo le corde fino alle piattaforme, dove la parete della
            Cicatrice è bucata come un favo e i cristalli si staccano sotto il
            piccone. Risalite con la polvere negli occhi e le braccia che tremano,
            con tre frammenti esausti e un cristallo sterile in tasca e la paga
            contata due volte dal caposquadra. Al Grifone Dragna ti guarda passare
            e annuisce una volta.
          effetti: { cristalli.frammento-esausto: 3, cristalli.cristallo-sterile: 1, monete: 3, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Una folata dal fondo
          testo: |
            A metà turno dalla gola sotto le piattaforme risale una folata grigia.
            «È una sacca piccola, voi respirate col naso» dice il caposquadra, che
            lo dice di ogni sacca. Il campo del bracciale regge a fatica, e quando
            siete in cima qualcuno ti fascia un taglio che non ricordi di esserti
            fatto. Sotto la lingua hai un sapore di ferro che i veterani chiamano
            il saluto.
          effetti: { contaminazione: 1, ferite: 0.5 }

  - id: chiedere-a-dragna
    presso: grifone-di-ferro
    immagine: personaggi/dragna-gro-malog
    titolo: Chiedere a Dragna un posto nei turni
    sommario: "Dragna Gro-Malog, il Ferro dei Raschiatori, decide chi scende nei turni di scavo. Per entrarci devi convincere lei."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    requisiti: [raschiatore == 0]
    testo: |
      Dragna Gro-Malog è una mezzorca massiccia con la testa rasata ai lati e
      i denti limati, e porta sulla schiena un'ascia che non toglie nemmeno
      per sedersi. Alla mano sinistra le mancano l'indice e il medio, e del
      duello in cui li ha persi non parla con nessuno. Tra i Raschiatori porta
      il titolo di Ferro, e da nove anni compila i turni di scavo a questo
      tavolo, in vista di tutti, perché chi vuole contestarli possa farlo.

      {origine fuggiasco-di-ghoran} Davanti ai denti limati e all'ascia gli
      occhi ti vanno al pavimento, come quando a Ghoran passavano i
      sorveglianti.

      {armi-da-mischia Media} Un'ascia da lavoro, con il manico accorciato per
      i tunnel stretti e lucido in un punto solo, dove la stessa mano la
      stringe da anni.

      Ti lascia parlare fino in fondo. A metà ti accorgi di avere le mani in
      tasca e le tiri fuori, e lei segue la manovra con interesse.

      «Tutti vogliono scendere» dice, con la voce resa roca dai gas dei
      tunnel. «Pochi vogliono risalire con tutti i pezzi.» Ti guarda come si
      guarda una corda nuova, cercando il punto in cui cederà. «Là sotto è la
      paura che ti tiene vivo. Tu ne hai abbastanza?»
    opzioni:
      - testo: "Convincerla che sei utile"
        descrizione: "Dragna prende nei turni solo gente che torna a casa dopo ogni scavo. Devi convincerla che sei tra questi."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: All'ultima campana
          testo: |
            Dragna resta zitta abbastanza a lungo da farti pentire di metà delle
            cose che hai detto, poi scrive il tuo nome in fondo alla bacheca.
            «Domani all'ultima campana, con il bracciale carico e le mani vuote»
            dice. «Se arrivi tardi non tornare.» Sotto il tavolo le gambe ti si
            sciolgono un poco, e al tavolo accanto un Raschiatore alza il boccale
            verso di te.
          effetti: { raschiatore: 1, rep.raschiatori: 1 }
        fallimento:
          titolo: Qualcosa da perdere
          testo: |
            Dragna ti lascia finire per educazione, e la sua educazione dura poco.
            «Parli bene» dice. «Quelli che parlano bene, là sotto, finiscono
            appesi al Ponte dei Morti. Torna quando avrai qualcosa da perdere.»
            Poi riprende a compilare i turni senza più alzare gli occhi.
          effetti: { scandalo: 0.5 }
      - testo: "Mostrarle cosa sai fare con i cristalli"
        descrizione: "Dragna lavora con i cristalli da una vita, e su un cristallo un errore si vede subito."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Al tatto
          testo: |
            Dragna rovescia sul tavolo una dozzina di cristalli identici alla luce
            della lampada. Li tocchi a occhi chiusi uno alla volta, e quasi tutti
            sono freddi, ma uno ronza contro il polpastrello come un'ape chiusa
            nel pugno. Lo separi dagli altri, e Dragna ti segna sulla bacheca
            senza dire niente.
          effetti: { raschiatore: 1, rep.raschiatori: 1 }
        fallimento:
          titolo: Il cristallo sbagliato
          testo: |
            Scegli con sicurezza, e il cristallo che porgi a Dragna è sterile come
            un sasso di fiume. Un Raschiatore al bancone ride senza cattiveria, e
            la risata ti scalda le orecchie fino alla porta. «Torna» dice Dragna,
            e dopo un momento aggiunge: «Ma non domani.»
          effetti: { scandalo: 1 }

  - id: ponte-dei-morti
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: Le lanterne del Ponte dei Morti
    sommario: "I Raschiatori appendono qui una lanterna per ogni compagno disperso. Il rumore della città arriva attutito."
    luogo: Ponte dei Morti
    area: ponti-sospesi
    ripetibile: true
    requisiti: [tormento >= 0.5]
    testo: |
      Il Ponte dei Morti è uno dei primi costruiti in città, tutto metallo annerito
      tenuto da bulloni ribattuti a mano. Ai parapetti sono appese centinaia di
      lanterne, una per ogni compagno disperso nel Labirinto, e a una è legato con
      lo spago un cucchiaio di legno rosicchiato sul manico. Molti Raschiatori
      vengono quassù per smettere di pensare.

      {origine apprendista-raschiatore} Una di queste lanterne, un giorno, potrebbe
      portare il tuo nome, e il pensiero ti arriva sempre allo stesso pilone.

      {origine accolito-del-velo} La preghiera dei morti la sai dalla Cattedrale, e
      le labbra cominciano a muoversi da sole.
    opzioni:
      - testo: "Restare in silenzio tra le lanterne"
        descrizione: "Sederti sulle assi con la schiena contro una trave e guardare le lanterne senza contarle."
        prova: { attributo: mentale, abilita: [resilienza, espressivita], difficolta: Facile }
        successo:
          titolo: Un'ora
          testo: |
            Per un'ora guardi le lanterne oscillare e ascolti le corde che
            scricchiolano, e a un certo punto le spalle ti si staccano dalle
            orecchie. Una squadra appende una lanterna nuova senza parlare, e
            l'ultimo della fila si ferma a raddrizzarla due volte.
          effetti: { tormento: -1 }
        fallimento:
          titolo: Una di più
          testo: |
            Provi a non pensare e finisci per contare le lanterne, ricominciando
            ogni volta che perdi il segno, e il totale cambia a ogni giro, con una
            lanterna in più. Te ne vai prima di capire se sbagli tu o il ponte, ma
            un po' meglio di quando sei arrivato.
          effetti: { tormento: -0.5 }

      - testo: "Una veglia per i dispersi"
        incantesimo: veglia
        descrizione: "Resti tutta la notte fra le lanterne e reciti la preghiera del Velo per ciascun nome."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Fino all'alba
          testo: |
            Reciti la preghiera per ogni lanterna del primo tratto e poi del
            secondo. Verso l'alba una Raschiatrice ti chiede di dire anche il nome
            di suo fratello, e lo ripete a fior di labbra un momento dopo di te.
          effetti: { tormento: -1.5 }
        fallimento:
          titolo: Le parole sbagliate
          testo: |
            A metà della notte ti accorgi che stai ripetendo la stessa strofa
            da un'ora, e la lingua continua anche dopo che la testa ha smesso.
            Taci e resti seduto finché fa giorno.
          effetti: { tormento: -0.5 }

  - id: custodi-di-passaggio
    presso: ponte-delle-mille-corde
    immagine: personaggi/varn-kett
    titolo: L'ufficio dei Custodi di Passaggio
    sommario: "Per commerciare sui ponti serve la licenza della Gilda, e la rilascia Varn Kett."
    luogo: Imbocco del Ponte delle Mille Corde
    area: ponti-sospesi
    requisiti: [licenza-gilda == 0]
    testo: |
      All'imbocco del Ponte delle Mille Corde c'è un gabbiotto di legno e
      ferro con lo stemma della Gilda dei Mercanti. Dentro siede Varn Kett,
      ispettore dei dazi, un uomo alto con un cappotto color tabacco e stivali
      da pioggia che porta anche col sole. Mentre gli parli la sua mano destra
      scrive con una penna immaginaria su una pergamena che non c'è, e ti
      ritrovi a scandire i nomi perché possa stare al passo.

      «Licenza», dice con una voce piatta da sportello, «commissione e
      registro. Chi commercia sui ponti senza licenza prima viene multato e
      poi bandito. Se insiste, lo perdiamo di vista.»

      {origine rampollo-dei-quartieri-alti} Nei Quartieri Alti un ispettore
      dei dazi ti avrebbe fatto passare senza chiedere, e qui ti tocca la
      stessa voce piatta di tutti.
    opzioni:
      - testo: "Pagare la licenza della Gilda"
        descrizione: "Una somma pesante per non pagare più la gabella. Il tuo nome entra nei registri della Gilda."
        requisiti: [monete >= 200]
        esito:
          titolo: Un sigillo di cera
          testo: |
            Varn conta la somma con gli occhi senza toccarla, poi prende da un
            cassetto una pergamena vera, ci scrive il tuo nome con una grafia da
            notaio e la chiude con il sigillo della Gilda. «Da oggi i ponti non ti
            costano niente» dice. «Da oggi, però, esisti.» La sua mano destra
            scrive ancora un momento sull'aria, poi si ferma.
          effetti: { monete: -200, licenza-gilda: 1, rep.gilda: 1 }

  - id: il-nodo-d-ossidiana
    presso: mercato-dei-nodi
    titolo: Il Nodo d'Ossidiana
    luogo: Mercato dei Nodi
    area: ponti-sospesi
    ripetibile: true
    immagine: personaggi/ambrin-qell
    sommario: "Ambrin Qell vende oggetti che non hanno un prezzo scritto. Il corvo sul bancone decide se sei un cliente."
    testo: |
      Il Nodo d'Ossidiana è una bottega stretta sul Mercato dei Nodi, con gli
      scaffali fino al soffitto. Ambrin Qell, lunghi capelli rossi, ti saluta
      senza alzarsi, e sul bancone un corvo non ti perde di vista.

      «Entra» dice. «Lasciati cercare prima di cercare tu.» Sotto il vetro
      del bancone c'è un anello d'argento, dietro di lui un mantello color
      petrolio si muove appena nell'aria ferma, e in un cofanetto c'è uno
      specchio grande come un palmo.

      {origine allievo-di-torvessa} Il corvo ti guarda come Temmerin guarda
      un allievo prima di fargli una domanda.
    opzioni:
      - testo: "L'anello del respiro misurato"
        costo: 0
        immagine: reliquie/anello-respiro-misurato
        requisiti: [oggetto.anello-del-respiro-misurato == 0, monete >= 1200]
        descrizione: "Ti tiene in piedi una volta per scontro, quando dovresti cadere."
        esito:
          titolo: Sotto il vetro
          testo: |
            Ambrin apre il vetro e ti mette l'anello nel palmo. È più freddo
            dell'argento. Il corvo lo fissa finché non lo infili al dito, poi si
            gira dall'altra parte.
          effetti: { monete: -1200, oggetto.anello-del-respiro-misurato: 1 }
      - testo: "Il mantello delle correnti laterali"
        costo: 0
        immagine: reliquie/mantello-correnti-laterali
        requisiti: [oggetto.mantello-delle-correnti-laterali == 0, monete >= 1800]
        descrizione: "Vibra di lato anche quando l'aria è ferma. Ti aiuta a sottrarti ai pericoli."
        esito:
          titolo: Di lato
          testo: |
            Quando lo indossi senti il mantello tirarti leggermente verso
            sinistra, e il piede ti segue prima che tu glielo chieda. Ambrin
            dice che ti sta misurando e che fra un giorno smette.
          effetti: { monete: -1800, oggetto.mantello-delle-correnti-laterali: 1 }
      - testo: "Lo specchio della seconda scelta"
        costo: 0
        immagine: reliquie/specchio-seconda-scelta
        requisiti: [oggetto.specchio-della-seconda-scelta == 0, monete >= 1500]
        descrizione: "Una volta per esito ti lascia ripetere una prova fallita. Se la seconda riesce, qualcosa ti costa."
        esito:
          titolo: Il riflesso in ritardo
          testo: |
            Ambrin ti legge ad alta voce l'avvertenza sull'etichetta prima di
            aprire il cofanetto, senza saltare una riga. Nello specchio il
            tuo riflesso sbatte le palpebre un attimo dopo di te, e la tua mano
            si scosta dal cofanetto un attimo prima.
          effetti: { monete: -1500, oggetto.specchio-della-seconda-scelta: 1 }
      - testo: "Chiedere cosa tiene sotto il bancone"
        immagine: personaggi/ambrin-qell
        requisiti: [nodo.sotto-il-bancone == 0]
        descrizione: "Ambrin non mostra tutto. Alcune cose bisogna chiederle, e nel modo giusto."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Una piuma nera
          testo: |
            Ambrin ti guarda a lungo prima di chinarsi a prendere da sotto il
            bancone un amuleto, una piuma nera su un gancio di bronzo, e il corvo
            arruffa le penne. «Questo lo vendo solo a chi lo chiede» dice.
          effetti: { nodo.sotto-il-bancone: 1 }
        fallimento:
          titolo: Gli scaffali
          testo: |
            Ambrin sorride con molta gentilezza e ti indica gli scaffali.
            Qualunque cosa ci sia sotto il bancone, oggi resta lì.
          effetti: {}
      - testo: "L'amuleto del corvo vigile"
        costo: 0
        immagine: reliquie/amuleto-corvo-vigile
        requisiti: [oggetto.amuleto-del-corvo-vigile == 0, monete >= 1300, nodo.sotto-il-bancone >= 1]
        descrizione: "Gracchia prima di un'imboscata. Ambrin lo vende solo a chi lo ha chiesto."
        esito:
          titolo: Tiepida
          testo: |
            La piuma è tiepida anche se fuori fa freddo. Mentre esci, il corvo
            sul bancone gracchia una volta, e l'amuleto risponde.
          effetti: { monete: -1300, oggetto.amuleto-del-corvo-vigile: 1 }
