aree:
  - id: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    nome: Ponti Sospesi
    sommario: "Un reticolo di travi e piattaforme appeso alle corde sopra la Cicatrice, con le lanterne di Mana che oscillano a ogni raffica e la gabella da pagare all'imbocco. Ci passano i mercanti e i Raschiatori, fra il Mercato dei Nodi e il Grifone di Ferro."
    testo: |
      All'imbocco del Ponte delle Mille Corde i Custodi di Passaggio
      riscuotono la gabella, e oltre il loro gabbiotto sotto i piedi hai
      soltanto legno, che a ogni passo cede appena, quel tanto che basta a
      farti stringere le dita dei piedi nelle scarpe. I Ponti Sospesi sono un reticolo di travi e piattaforme
      tenute dalle corde, gettato sopra il centro di Qir-Azel da una sponda
      all'altra della Cicatrice. Il vento soffia di continuo e porta su dal
      fondo un odore di ferro e di resina calda. Le lanterne di Mana appese
      alle funi ondeggiano a ogni raffica e restano accese giorno e notte. Chi
      abita qui da anni sa riconoscere dal cigolio una corda buona da una che
      cederà entro l'inverno.

      Il Ponte delle Mille Corde è la via principale e vibra sotto il
      passaggio dei mercanti e dei Raschiatori, che hanno ancora nelle pieghe
      dei vestiti la polvere delle rovine. Sulle sue piattaforme si stende il
      bazaar del Mercato dei Nodi. Più avanti c'è la Locanda del Grifone di
      Ferro, dove un Raschiatore può bere senza che lo guardino storto. Ai
      margini del reticolo molte famiglie vivono in case di legno e lamiera
      appese sopra il vuoto, come nidi. Su una porta qualcuno ha dipinto con
      cura un numero civico, e sotto ha piantato un chiodo per appenderci la
      posta.

      Sotto le travi vive una seconda città, fatta di gente che i registri
      della Gilda non contano. Sui ponti si dice che una corda può essere un
      ponte o un cappio, a seconda di chi la tiene.
    gabella: 2
    negozi: [dispensa-di-gramm, nodo-d-ossidiana]

storylet:
  - id: bacheca-grifone
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: La bacheca del Grifone di Ferro
    sommario: "Sulla bacheca dei Raschiatori si vendono pelli e si cercano compagni di squadra. Dragna assegna i turni di scavo a chi ha il fegato di scendere."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    ripetibile: true
    requisiti: [raschiatore >= 1]
    testo: |
      Nell'angolo della sala, sotto una lampada che fuma, i Raschiatori
      tengono la loro bacheca. Ci si appendono offerte di pelli, mappe di
      sentieri abbandonati e richieste di squadre a cui manca un quinto uomo.
      Qualche nome è segnato due volte, perché la prima volta chi lo portava
      non era tornato.

      Dragna Gro-Malog occupa il suo solito tavolo, con un boccale sempre
      pieno accanto ai fogli dei turni, e compila le rotazioni in una grafia
      larga e squadrata, premendo tanto da bucare la carta a ogni punto. In
      fondo alla sala Liaren accorda il samisen senza suonarlo. Il tuo nome
      è sulla bacheca, e sotto c'è ancora spazio per segnare un altro turno.
      Vederlo lì, scritto da un'altra mano, ti fa raddrizzare le spalle.
    opzioni:
      - testo: "Un turno sulle piattaforme della Cicatrice"
        descrizione: "Scendere con la squadra fino alle piattaforme di scavo e risalire con i sacchi pieni prima che cambi il vento."
        prova: { attributo: fisico, abilita: [atletica, tecnologia], difficolta: Media }
        successo:
          titolo: Un cenno di Dragna
          testo: |
            Scendete lungo le corde fino alle piattaforme. Lì la parete della
            Cicatrice è bucata come un favo, e i cristalli si staccano sotto il
            piccone con un rumore di vetro incrinato. A fine turno risalite con
            la gola roca e la polvere negli occhi, e sulle ultime corde le
            braccia ti tremano per conto loro, tanto che devi guardarle per
            convincerle a tirare. Nelle tasche porti tre
            frammenti esausti e un cristallo sterile; la paga in monete te la dà
            il caposquadra.

            Al Grifone Dragna ti guarda passare e annuisce una volta. Secondo i
            Raschiatori più vecchi, per lei è un complimento.
          effetti: { cristalli.frammento-esausto: 3, cristalli.cristallo-sterile: 1, monete: 3, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Una folata dal fondo
          testo: |
            A metà turno dalla gola sotto le piattaforme risale una folata
            grigia. «È una sacca piccola, voi respirate col naso» dice il
            caposquadra, che lo dice di ogni sacca da quando lo conosci. Il campo del bracciale si accende con un ronzio e
            regge a fatica, e per qualche respiro non riesci a mettere insieme
            due pensieri.

            Quando siete di nuovo in cima qualcuno della squadra ti fascia un
            taglio che non ricordi di esserti fatto. Sotto la lingua hai un
            sapore di ferro che i veterani chiamano il saluto, e ne parlano
            senza ridere.
          effetti: { contaminazione: 0.5, ferite: 0.5 }

  - id: chiedere-a-dragna
    immagine: personaggi/dragna-gro-malog
    titolo: Chiedere a Dragna un posto nei turni
    sommario: "Dragna Gro-Malog, il Ferro dei Raschiatori, decide chi scende nei turni di scavo. Per entrarci devi convincere lei."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    requisiti: [raschiatore == 0]
    testo: |
      Dragna Gro-Malog è una mezzorca massiccia, con la testa rasata ai lati e
      i tatuaggi tribali disegnati sopra le cicatrici. Ha gli occhi gialli e i
      denti limati, e porta sulla schiena un'ascia che non toglie nemmeno per
      sedersi. Alla mano sinistra le mancano l'indice e il medio; del duello
      in cui li ha persi non parla con nessuno. Tra i Raschiatori porta il
      titolo di Ferro, e da nove anni compila i turni di scavo a questo
      tavolo, in vista di tutti, perché chi vuole contestarli possa farlo. In
      nove anni non l'ha fatto nessuno.

      Ti lascia parlare fino in fondo. A metà ti accorgi di avere le mani in
      tasca e le tiri fuori, e lei segue la manovra prima di posare la penna.

      «Tutti vogliono scendere» dice, con la voce resa roca dai gas dei
      tunnel. «Pochi vogliono risalire con tutti i pezzi.» Batte i monconi
      della mano sinistra sul tavolo e ti guarda come si guarda una corda
      nuova, cercando il punto in cui cederà. *Otto dita, e i pezzi che
      contano.* «Là sotto è la paura che ti tiene vivo. Tu
      ne hai abbastanza?»
    opzioni:
      - testo: "Convincerla che sei utile"
        descrizione: "Dragna prende nei turni solo gente che torna a casa dopo ogni scavo. Devi convincerla che sei tra questi."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: All'ultima campana
          testo: |
            Dragna ti ascolta senza interromperti. Quando hai finito resta zitta
            abbastanza a lungo da farti pentire di metà delle cose che hai
            detto, poi riprende la penna e scrive il tuo nome in fondo alla
            bacheca, dove c'è ancora spazio.

            «Domani all'ultima campana, con il bracciale carico e le mani vuote»
            dice. «Se arrivi tardi non tornare.»

            Adesso sei nei turni. Al tavolo accanto un Raschiatore alza il
            boccale verso di te, senza sorridere.
          effetti: { raschiatore: 1, rep.raschiatori: 1 }
        fallimento:
          titolo: Qualcosa da perdere
          testo: |
            Dragna ti lascia finire per educazione, e la sua educazione dura
            poco. «Parli bene» dice. «Quelli che parlano bene, là sotto,
            finiscono appesi al Ponte dei Morti. Torna quando avrai qualcosa da
            perdere.»

            Riprende a compilare i turni e non alza più gli occhi dal foglio.
          effetti: {}
      - testo: "Mostrarle cosa sai fare con i cristalli"
        descrizione: "Dragna lavora con i cristalli da una vita, e su un cristallo un errore si vede subito."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Al tatto
          testo: |
            Dragna rovescia sul tavolo un sacchetto con una dozzina di
            cristalli, identici alla luce della lampada. Chiudi gli occhi e li
            tocchi uno alla volta. Quasi tutti sono freddi, qualcuno appena
            tiepido. Uno solo ronza contro il polpastrello come un'ape chiusa
            nel pugno.

            Lo separi dagli altri senza guardarlo. Dragna prende la penna e ti
            segna sulla bacheca senza dire niente.
          effetti: { raschiatore: 1, rep.raschiatori: 1 }
        fallimento:
          titolo: Il cristallo sbagliato
          testo: |
            Scegli con sicurezza, e la sicurezza peggiora le cose. Il cristallo
            che porgi a Dragna è sterile come un sasso di fiume. Lei lo soppesa
            e lo posa sul tavolo. Un Raschiatore al bancone ride, con una risata
            breve e senza cattiveria che però ti accompagna fino alla porta.

            «Torna» dice Dragna, e dopo un momento aggiunge: «Ma non domani.»
          effetti: { scandalo: 0.5 }

  - id: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: Le lanterne del Ponte dei Morti
    sommario: "I Raschiatori appendono qui una lanterna per ogni compagno disperso. Il rumore della città arriva attutito."
    luogo: Ponte dei Morti
    area: ponti-sospesi
    ripetibile: true
    requisiti: [tormento >= 0.5]
    testo: |
      Il Ponte dei Morti è uno dei primi costruiti a Qir-Azel, in metallo
      annerito tenuto insieme da grossi bulloni ribattuti a mano. Ai parapetti
      sono appese centinaia di lanterne. I Raschiatori ne accendono una per
      ogni compagno disperso nel Labirinto, con dentro un piccolo cristallo
      conduttore che brucia per anni, finché regge. Ogni squadra cura le
      proprie e nessuno tocca quelle degli altri. Alcune hanno ormai un nome
      proprio, anche se il compagno che ricordavano è scomparso da decenni.

      Quando se ne appende una nuova si dice: «Una lanterna per nome. Una
      lanterna per ciò che pensavi di sapere di lui.» Quassù il rumore della
      città arriva attutito come da sott'acqua, e sulle lastre ti accorgi di
      aver trattenuto il fiato fin qui. A una lanterna è legato con lo spago
      un cucchiaio di legno, rosicchiato sul manico. Molti Raschiatori vengono qui per smettere di
      pensare.
    opzioni:
      - testo: "Restare in silenzio tra le lanterne"
        descrizione: "Sederti sulle assi con la schiena contro una trave e guardare le lanterne senza contarle."
        prova: { attributo: mentale, abilita: [resilienza, espressivita], difficolta: Facile }
        successo:
          titolo: Un'ora
          testo: |
            Per un'ora non pensi a niente. Guardi le lanterne oscillare e
            ascolti le corde che scricchiolano sotto il vento, e a un certo
            punto le spalle ti si staccano dalle orecchie.
            Una squadra
            attraversa il ponte con una lanterna nuova e la appende senza
            parlare. Quando ti alzi, quello che ti porti dietro dalla Città
            Bassa pesa meno di quando sei arrivato.
          effetti: { tormento: -1 }
        fallimento:
          titolo: Una di più
          testo: |
            Provi a non pensare e finisci per contare le lanterne. Conti quelle
            del primo tratto e poi quelle del secondo, e alla fine ricominci
            perché hai perso il segno. Il totale cambia a ogni giro, e ogni
            volta ce n'è una in più.

            Te ne vai prima di capire se sbagli tu o il ponte. Stai comunque un
            po' meglio di quando sei arrivato.
          effetti: { tormento: -0.5 }

      - testo: "Una veglia per i dispersi"
        incantesimo: veglia
        descrizione: "Resti tutta la notte fra le lanterne e reciti la preghiera del Velo per ciascun nome."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Fino all'alba
          testo: |
            Reciti la preghiera per ogni lanterna del primo tratto e poi per
            quelle del secondo. Verso l'alba una Raschiatrice si ferma ad
            ascoltare e ti chiede di dire anche il nome di suo fratello. Lo
            dici. Quando ti alzi hai le ginocchia rigide e la testa sgombra.
          effetti: { tormento: -1.5 }
        fallimento:
          titolo: Le parole sbagliate
          testo: |
            A metà della notte ti accorgi che stai ripetendo la stessa strofa
            da un'ora. Smetti e resti seduto finché fa giorno.
          effetti: { tormento: -0.5 }

  - id: custodi-di-passaggio
    immagine: personaggi/varn-kett
    titolo: L'ufficio dei Custodi di Passaggio
    sommario: "Per commerciare sui ponti serve la licenza della Gilda. Varn Kett la rilascia e annota tutto su una pergamena immaginaria."
    luogo: Imbocco del Ponte delle Mille Corde
    area: ponti-sospesi
    requisiti: [licenza-gilda == 0]
    testo: |
      All'imbocco del Ponte delle Mille Corde, dove si paga la gabella, c'è un
      gabbiotto di legno e ferro con lo stemma della Gilda dei Mercanti.
      Dentro siede Varn Kett, ispettore dei dazi, un uomo alto sulla
      cinquantina con un cappotto color tabacco e stivali da pioggia che porta
      anche quando c'è il sole. La lista del giorno è appuntata alla cintura
      con uno spillo di ferro.

      Mentre gli parli, la sua mano destra stringe una penna immaginaria e
      scrive su una pergamena che non c'è. Continua finché non hai finito, e
      ti ritrovi a parlare più piano, a scandire i nomi, perché la mano possa
      stare al passo. Sui ponti si dice che non abbia mai sbagliato una riga.

      «Licenza», dice, «commissione e registro.» Ha una voce piatta, da
      sportello. «Chi commercia sui ponti senza licenza prima viene multato e
      poi bandito. Se insiste, lo perdiamo di vista.» Fa una pausa. «Ho
      imparato a non fare distinzioni. Vale per i sacerdoti e per i nobili, e
      varrebbe anche per te.»
    opzioni:
      - testo: "Pagare la licenza della Gilda"
        descrizione: "Duecento monete per non pagare più la gabella a ogni passaggio. Il tuo nome entra nei registri della Gilda, e Varn, a differenza di altri riscossori, non arrotonda."
        requisiti: [monete >= 200]
        esito:
          titolo: Un sigillo di cera
          testo: |
            Varn conta le duecento monete con gli occhi senza toccarle, e il
            conto gli torna. A te, guardandole tutte in fila sul banco, viene
            un po' di nostalgia. Poi prende da un cassetto una pergamena vera, ci
            scrive il tuo nome con una grafia da notaio e la chiude con il
            sigillo di cera della Gilda.

            «Da oggi i ponti non ti costano niente» dice. «Da oggi, però,
            esisti.» La sua mano destra scrive ancora un momento sull'aria e si
            ferma. Adesso il tuo nome è in due registri, e solo quello di carta
            si può bruciare.
          effetti: { monete: -200, licenza-gilda: 1, rep.gilda: 1 }

  - id: il-nodo-d-ossidiana
    titolo: Il Nodo d'Ossidiana
    luogo: Mercato dei Nodi
    area: ponti-sospesi
    ripetibile: true
    immagine: personaggi/ambrin-qell
    sommario: "Ambrin Qell vende oggetti che non hanno un prezzo scritto. Il corvo sul bancone decide se sei un cliente."
    testo: |
      Il Nodo d'Ossidiana è una bottega stretta sul Mercato dei Nodi, con
      gli scaffali fino al soffitto. Ambrin Qell ha i capelli rossi lunghi
      e gli occhi azzurri, e ti saluta senza alzarsi. Sul bancone c'è un
      corvo che non ti perde di vista, e ti sorprendi a tenere le mani dove
      può vederle.

      «Entra» dice Ambrin. «Lasciati cercare prima di cercare tu.» Sotto il
      vetro del bancone c'è un anello d'argento, appeso a un gancio dietro
      di lui un mantello color petrolio che si muove appena, anche se nella
      bottega l'aria è ferma. In un cofanetto chiuso a chiave,
      con un'etichetta scritta a mano, c'è uno specchio grande come un
      palmo.
    opzioni:
      - testo: "L'anello del respiro misurato"
        immagine: reliquie/anello-respiro-misurato
        requisiti: [oggetto.anello-del-respiro-misurato == 0, monete >= 1200]
        descrizione: "Ti tiene in piedi una volta per scontro, quando dovresti cadere."
        esito:
          titolo: Sotto il vetro
          testo: |
            Ambrin apre il vetro e ti mette l'anello nel palmo. Il corvo lo fissa
            finché non lo infili al dito, poi si gira dall'altra parte.
          effetti: { monete: -1200, oggetto.anello-del-respiro-misurato: 1 }
      - testo: "Il mantello delle correnti laterali"
        immagine: reliquie/mantello-correnti-laterali
        requisiti: [oggetto.mantello-delle-correnti-laterali == 0, monete >= 1800]
        descrizione: "Vibra di lato anche quando l'aria è ferma. Ti aiuta a sottrarti ai pericoli."
        esito:
          titolo: Di lato
          testo: |
            Quando lo indossi senti il mantello tirarti leggermente verso
            sinistra. Ambrin dice che ti sta misurando e che fra un giorno smette.
          effetti: { monete: -1800, oggetto.mantello-delle-correnti-laterali: 1 }
      - testo: "Lo specchio della seconda scelta"
        immagine: reliquie/specchio-seconda-scelta
        requisiti: [oggetto.specchio-della-seconda-scelta == 0, monete >= 1500]
        descrizione: "Una volta per esito ti lascia ripetere una prova fallita. Se la seconda riesce, qualcosa ti costa."
        esito:
          titolo: Il riflesso in ritardo
          testo: |
            Ambrin ti legge l'avvertenza sull'etichetta prima di aprire il
            cofanetto. Nello specchio il tuo riflesso sbatte le palpebre un
            attimo dopo di te.
          effetti: { monete: -1500, oggetto.specchio-della-seconda-scelta: 1 }
      - testo: "Chiedere cosa tiene sotto il bancone"
        immagine: personaggi/ambrin-qell
        requisiti: [nodo.sotto-il-bancone == 0]
        descrizione: "Ambrin non mostra tutto. Alcune cose bisogna chiederle, e nel modo giusto."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Una piuma nera
          testo: |
            Ambrin ti guarda a lungo prima di chinarsi a prendere un amuleto da
            sotto il bancone. È una piuma nera su un gancio di bronzo. Il corvo
            arruffa le penne. «Questo lo vendo solo a chi lo chiede» dice.
          effetti: { nodo.sotto-il-bancone: 1 }
        fallimento:
          titolo: Gli scaffali
          testo: |
            Ambrin sorride e ti indica gli scaffali. Qualunque cosa ci sia
            sotto il bancone, oggi resta lì.
          effetti: {}
      - testo: "L'amuleto del corvo vigile"
        immagine: reliquie/amuleto-corvo-vigile
        requisiti: [oggetto.amuleto-del-corvo-vigile == 0, monete >= 1300, nodo.sotto-il-bancone >= 1]
        descrizione: "Gracchia prima di un'imboscata. Ambrin lo vende solo a chi lo ha chiesto."
        esito:
          titolo: Tiepida
          testo: |
            La piuma è tiepida anche se fuori fa freddo. Mentre esci, il corvo
            sul bancone gracchia una volta, e l'amuleto risponde.
          effetti: { monete: -1300, oggetto.amuleto-del-corvo-vigile: 1 }
