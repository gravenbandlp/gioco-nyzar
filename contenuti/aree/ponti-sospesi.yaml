aree:
  - id: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    nome: Ponti Sospesi
    testo: |
      All'imbocco i Custodi di Passaggio riscuotono la gabella, e il mondo
      smette di avere un pavimento. I Ponti Sospesi sono un reticolo di travi,
      corde e piattaforme gettato sopra il centro di Qir-Azel, da una sponda
      all'altra della Cicatrice. Il vento non si ferma mai e porta odore di
      ferro, di fumo, di resina calda. Le lanterne di Mana ondeggiano giorno e
      notte. Le funi cantano sotto il carico, e chi ci vive da anni sa
      distinguere dal canto una corda buona da una che cederà entro l'inverno.

      Il Ponte delle Mille Corde vibra di continuo sotto i passi di mercanti,
      pellegrini, Raschiatori con la polvere delle rovine ancora nelle pieghe
      dei vestiti. Sopra ci si stende il bazaar del Mercato dei Nodi; più in
      là c'è la Locanda del Grifone di Ferro, dove i Raschiatori bevono senza
      che nessuno li guardi storto. Ai margini, case di legno e lamiera appese
      sopra il vuoto come nidi.

      Sotto le travi vive una città che nessuno conta. Non guardare giù troppo
      a lungo: qualcuno, di sotto, ti sta già guardando su.

      Una corda, qui, può essere un ponte o un cappio. Dipende da chi la
      tiene.
    gabella: 2
    negozi: [dispensa-di-gramm]

storylet:
  - id: bacheca-grifone
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: La bacheca del Grifone di Ferro
    sommario: "Pelli da vendere, sentieri abbandonati, nomi segnati due volte. E un turno di scavo, se hai il fegato."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    ripetibile: true
    requisiti: [raschiatore >= 1]
    testo: |
      Nell'angolo della sala del Grifone di Ferro, sotto una lampada che fuma,
      c'è la bacheca dei Raschiatori: pelli da vendere, sentieri abbandonati,
      squadre in cerca di un quinto, nomi segnati due volte perché la prima
      volta non erano tornati.

      Dragna Gro-Malog siede al suo tavolo di sempre, i turni di scavo davanti
      e un boccale che non finisce mai, e compila le rotazioni con una grafia
      che non ammette repliche. In fondo alla sala Liaren accorda il samisen
      senza suonarlo. Sulla bacheca, accanto al tuo nome, c'è ancora spazio.
    opzioni:
      - testo: "Un turno sulle piattaforme della Cicatrice"
        descrizione: "Scendere con la squadra fino alle piattaforme di scavo, riempire i sacchi, risalire. In quest'ordine, possibilmente."
        prova: { attributo: fisico, abilita: [atletica, tecnologia], difficolta: Media }
        successo:
          titolo: Un cenno di Dragna
          testo: |
            Scendete lungo le corde fino alle piattaforme, dove la parete della
            Cicatrice è scavata come un favo e i cristalli si staccano con un
            suono di vetro che si lamenta. Riempite i sacchi. Risalite con la
            gola roca, la polvere negli occhi e le tasche piene: frammenti
            esausti, un cristallo sterile, qualche moneta di paga.

            Al Grifone, Dragna ti guarda passare e annuisce una volta. I
            Raschiatori più vecchi dicono che per lei è un complimento. Quelli
            più giovani, che è l'unico.
          effetti: { cristalli.frammento-esausto: 3, cristalli.cristallo-sterile: 1, monete: 3, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Una folata dal fondo
          testo: |
            A metà turno, dalla gola sotto le piattaforme, risale una folata
            grigia. Non è niente, dice il caposquadra: una sacca piccola, una
            bolla. Il campo del bracciale si accende, ronza, regge. A malapena.
            Per un respiro, forse due, non riesci a tenere insieme due pensieri.

            Poi siete su. Qualcuno ti fascia un taglio che non ricordi di
            esserti fatto, e sotto la lingua hai quel sapore di ferro che i
            veterani chiamano, senza ridere, il saluto.
          effetti: { contaminazione: 0.5, ferite: 0.5 }

  - id: chiedere-a-dragna
    immagine: personaggi/dragna-gro-malog
    titolo: Chiedere a Dragna un posto nei turni
    sommario: "Il Ferro dei Raschiatori compila i turni di scavo. Per entrarci, devi convincere lei."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    requisiti: [raschiatore == 0]
    testo: |
      Dragna Gro-Malog è una mezzorca massiccia, rasata ai lati, con i
      tatuaggi tribali disegnati sopra le cicatrici come se volesse
      correggerle. Occhi gialli, denti limati, un'ascia sulla schiena che non
      toglie nemmeno per sedersi. Alla mano sinistra le mancano indice e medio:
      del duello in cui li ha persi non parla con nessuno. Tra i
      Raschiatori porta il titolo di Ferro, e da nove anni compila i turni di
      scavo a questo tavolo, sotto gli occhi di chiunque voglia contestarli.
      Nessuno lo fa.

      Ti lascia parlare fino alla fine. Poi posa la penna.

      «Tutti vogliono scendere,» dice, con una voce resa roca dai gas dei
      tunnel. «Pochi vogliono risalire nello stesso numero di pezzi.» Ti guarda
      come si guarda una corda nuova, cercando il punto in cui cederà. «La
      paura ti tiene vivo, là sotto. Tu ne hai abbastanza?»
    opzioni:
      - testo: "Convincerla che sei utile"
        descrizione: "Dragna non vuole eroi. Vuole gente che torna. Devi convincerla che sei del secondo tipo."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: All'ultima campana
          testo: |
            Dragna ti ascolta senza mai interromperti, e quando hai finito resta
            zitta abbastanza a lungo da farti pentire di ogni parola. Poi
            riprende la penna e scrive il tuo nome sulla bacheca, in fondo, dove
            c'è spazio.

            «Domani, all'ultima campana. Bracciale carico e mani vuote.» Si
            ferma. «Se arrivi tardi, non tornare.»

            Sei nei turni. Al tavolo accanto qualcuno alza il boccale verso di
            te, senza sorridere.
          effetti: { raschiatore: 1, rep.raschiatori: 1 }
        fallimento:
          titolo: Qualcosa da perdere
          testo: |
            Dragna ti lascia finire per educazione, che in lei è una forma di
            pazienza molto breve. «Parli bene,» dice. «Quelli che parlano bene,
            là sotto, finiscono appesi al Ponte dei Morti. Torna quando avrai
            qualcosa da perdere.»

            Riprende a scrivere. La conversazione è finita, e forse non era mai
            cominciata.
          effetti: {}
      - testo: "Mostrarle cosa sai fare con i cristalli"
        descrizione: "Le parole le costano poco. I cristalli sono il suo mestiere: lì un errore si vede subito."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Al tatto
          testo: |
            Dragna rovescia sul tavolo un sacchetto di cristalli, una dozzina,
            tutti uguali alla luce della lampada. Chiudi gli occhi. Li tocchi
            uno a uno: freddi, freddi, tiepidi, freddi. Uno ronza contro il
            polpastrello come un'ape chiusa nel pugno.

            Lo separi dagli altri senza guardarlo. Dragna non dice niente.
            Prende la penna, e ti segna sulla bacheca.
          effetti: { raschiatore: 1, rep.raschiatori: 1 }
        fallimento:
          titolo: Il cristallo sbagliato
          testo: |
            Scegli con sicurezza, il che rende tutto peggiore. Il cristallo che
            porgi a Dragna è sterile come un sasso di fiume. Lei lo soppesa, lo
            posa, e dal bancone qualcuno ride: una risata breve, senza
            cattiveria, che però ti segue fino alla porta e, sospetti, anche
            oltre.

            «Torna,» dice Dragna. «Ma non domani.»
          effetti: { scandalo: 0.5 }

  - id: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: Le lanterne del Ponte dei Morti
    sommario: "Una lanterna per ogni disperso. Qui il rumore della città arriva attutito, come da sott'acqua."
    luogo: Ponte dei Morti
    area: ponti-sospesi
    ripetibile: true
    requisiti: [tormento >= 0.5]
    testo: |
      Il Ponte dei Morti è uno dei primi costruiti a Qir-Azel: metallo
      annerito, bulloni grossi come pugni, e lanterne. Centinaia. I Raschiatori
      ne appendono una per ogni compagno disperso nel Labirinto, con dentro un
      piccolo cristallo conduttore che brucia finché regge: anni, a volte di
      più. Alcune hanno un nome proprio, anche se chi ricordavano non c'è più
      da decenni. Ogni squadra cura le sue. Nessuno spegne quelle degli altri.

      Una lanterna per nome. Una lanterna per ciò che pensavi di sapere di lui.

      Qui il rumore della città arriva attutito, come da sott'acqua. È un buon
      posto per non pensare. Forse l'unico.
    opzioni:
      - testo: "Restare in silenzio tra le lanterne"
        descrizione: "Sederti sulle assi, la schiena contro una trave, e lasciare che la luce faccia il lavoro che le parole non sanno fare."
        prova: { attributo: mentale, abilita: [resilienza, espressivita], difficolta: Facile }
        successo:
          titolo: Un'ora
          testo: |
            Per un'ora non pensi a niente. Le lanterne oscillano, il vento canta
            tra le corde, e il peso che ti porti dietro dalla Città Bassa si
            posa un momento accanto a te sulle assi, come un cane stanco.

            Quando ti alzi, non lo riprendi tutto. È abbastanza.
          effetti: { tormento: -1 }
        fallimento:
          titolo: Una di più
          testo: |
            Provi a non pensare, e finisci a contare. Le lanterne del primo
            tratto, poi del secondo, poi da capo, perché hai perso il segno. Il
            conto torna diverso ogni volta. Ogni volta ce n'è una di più.

            Te ne vai prima di capire se a sbagliare sei tu o il ponte. Un po'
            meglio di prima, comunque. Un po'.
          effetti: { tormento: -0.5 }

  - id: custodi-di-passaggio
    immagine: personaggi/varn-kett
    titolo: L'ufficio dei Custodi di Passaggio
    sommario: "Licenza, commissione, registro. Varn Kett scrive tutto su una pergamena che non esiste."
    luogo: Imbocco del Ponte delle Mille Corde
    area: ponti-sospesi
    requisiti: [licenza-gilda == 0]
    testo: |
      All'imbocco del Ponte delle Mille Corde, dove la gabella si paga e le
      discussioni si perdono, c'è un gabbiotto di legno e ferro con lo stemma
      della Gilda dei Mercanti. Dentro c'è Varn Kett, ispettore dei dazi: alto,
      cinquant'anni, un cappotto color tabacco e stivali da pioggia anche col
      sole. Ha la lista del giorno appuntata alla cintura con uno spillo di
      ferro.

      Quando gli parli, la sua mano destra si chiude su una penna che non c'è
      e comincia a scrivere su una pergamena che non c'è. Non si ferma finché
      non hai finito.

      «Licenza, commissione, registro,» dice, con la voce piatta di chi l'ha
      detto diecimila volte e le ricorda tutte. «Chi commercia sui ponti senza
      licenza viene multato. Poi bandito. Poi perso di vista.» Una pausa. «Mi
      sono insegnato a non fare distinzioni. Vale per i mercanti, per i
      sacerdoti, per i nobili. Varrebbe anche per te.»
    opzioni:
      - testo: "Pagare la licenza della Gilda"
        descrizione: "Duecento monete per smettere di pagare ogni passaggio e cominciare a esistere nei registri. Varn, almeno, non arrotonda."
        requisiti: [monete >= 200]
        esito:
          titolo: Un sigillo di cera
          testo: |
            Varn conta le duecento monete senza toccarle, con gli occhi
            soltanto, e non sbaglia. Poi prende da un cassetto una pergamena
            vera, scrive il tuo nome con una grafia da notaio e ci cola sopra il
            sigillo di cera della Gilda.

            «Da oggi i ponti non ti costano niente,» dice. «Da oggi, però,
            esisti.» La sua mano destra scrive ancora un momento sull'aria, poi
            si ferma. Adesso sei in due registri. Uno lo puoi bruciare.
          effetti: { monete: -200, licenza-gilda: 1, rep.gilda: 1 }
