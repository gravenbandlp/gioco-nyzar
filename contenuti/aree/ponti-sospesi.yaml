aree:
  - id: ponti-sospesi
    immagine: ambientazione/ponti-sospesi
    nome: Ponti Sospesi
    sommario: "Un reticolo di travi e piattaforme appeso alle corde sopra la Cicatrice, con le lanterne di Mana che oscillano a ogni raffica e la gabella da pagare all'imbocco."
    testo: |
      I Ponti Sospesi sono un reticolo di travi e piattaforme tenute dalle corde, gettato sopra il centro di
      Qir-Azel da una sponda all'altra della Cicatrice.

      Il Ponte delle Mille Corde è la via principale e vibra sotto il passaggio dei mercanti e dei
      Raschiatori, che hanno ancora nelle pieghe dei vestiti la polvere delle rovine. Sulle sue piattaforme
      si stende il bazaar del Mercato dei Nodi. Più avanti c'è la Locanda del Grifone di Ferro, dove un
      Raschiatore può bere senza che lo guardino storto.

      Sotto le travi vive una seconda città, fatta di gente che i registri della Gilda non contano.
    gabella: 2
    negozi: [dispensa-di-gramm, nodo-d-ossidiana]

storylet:
  - id: bacheca-grifone
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: La bacheca del Grifone di Ferro
    sommario: "Dragna assegna i turni di scavo a chi ha il fegato di scendere."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    ripetibile: true
    requisiti: [raschiatore >= 1]
    testo: |
      Nell'angolo della sala, sotto una lampada che fuma, i Raschiatori tengono la
      loro bacheca. Ci si appendono offerte di pelli, mappe di sentieri abbandonati
      e richieste di squadre a cui manca un quinto uomo, fissate con chiodi da
      ferro di cavallo perché le puntine qui spariscono.

      Dragna Gro-Malog occupa il suo solito tavolo, con un boccale sempre pieno
      accanto ai fogli dei turni, e compila le rotazioni in una grafia larga e
      squadrata, premendo tanto da bucare la carta a ogni punto. Il tuo nome è
      sulla bacheca, e sotto c'è ancora spazio per segnare un altro turno.

      {origine apprendista-raschiatore} Su questa bacheca il tuo nome c'era già
      prima del Festival, e ormai riconosci le mani che lo scrivono, ognuna con il
      suo modo di sbagliarlo. Dragna è l'unica che non lo sbaglia mai, e la sua
      grafia la cerchi per prima.

      {mezzanotte} Fra le richieste di squadra c'è un foglio ingiallito,
      fissato con un chiodo arrugginito, nella grafia squadrata di Dragna. Chiede
      un quinto uomo per un turno partito nove anni fa, e accanto al quinto
      posto la carta è ancora bianca. Quando lo indichi a Dragna, lei stacca il
      foglio, lo piega in quattro e se lo mette sotto il boccale senza leggerlo.
    opzioni:
      - testo: "Un turno sulle piattaforme della Cicatrice"
        descrizione: "Scendere con la squadra fino alle piattaforme di scavo e risalire con i sacchi pieni prima che cambi il vento."
        inquieta: "Scendere con la squadra fino alle piattaforme di scavo e risalire con i sacchi pieni prima che cambi il vento. Contate quanti siete alla partenza, e ricontatevi in cima."
        prova: { attributo: fisico, abilita: [atletica, tecnologia], difficolta: Media }
        successo:
          titolo: Un cenno di Dragna
          testo: |
            Scendete lungo le corde fino alle piattaforme. Lì la parete della
            Cicatrice è bucata come un favo, e i cristalli si staccano sotto il
            piccone con un rumore di vetro incrinato. Nelle tasche porti tre
            frammenti esausti e un cristallo sterile; la paga in monete te la dà
            il caposquadra, dopo averla contata due volte davanti a tutti.

            Al Grifone Dragna ti guarda passare e annuisce una volta, senza alzare
            la penna dal foglio.
          effetti: { cristalli.frammento-esausto: 3, cristalli.cristallo-sterile: 1, monete: 3, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Una folata dal fondo
          testo: |
            A metà turno dalla gola sotto le piattaforme risale una folata grigia.
            Il campo del bracciale si accende con un ronzio e regge a fatica, e
            per qualche momento non riesci a mettere insieme due pensieri.

            Quando siete di nuovo in cima qualcuno della squadra ti fascia un
            taglio che non ricordi di esserti fatto. Sotto la lingua hai un sapore
            di ferro che i veterani chiamano il saluto, e ne parlano senza ridere.
          effetti: { contaminazione: 1, ferite: 0.5 }

  - id: chiedere-a-dragna
    presso: grifone-di-ferro
    immagine: personaggi/dragna-gro-malog
    titolo: Chiedere a Dragna un posto nei turni
    sommario: "Dragna Gro-Malog, il Ferro dei Raschiatori, decide chi scende nei turni di scavo. Per entrarci devi convincere lei."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    requisiti: [raschiatore == 0]
    testo: |
      Dragna Gro-Malog è una mezzorca massiccia, con la testa rasata ai lati e
      i tatuaggi tribali disegnati sopra le cicatrici. Ha gli occhi gialli e i
      denti limati, e porta sulla schiena un'ascia che non toglie nemmeno per
      sedersi. Alla mano sinistra le mancano l'indice e il medio; del duello
      in cui li ha persi non parla con nessuno. Tra i Raschiatori porta il
      titolo di Ferro, e da nove anni compila i turni di scavo a questo
      tavolo, in vista di tutti, perché chi vuole contestarli possa farlo.

      {origine fuggiasco-di-ghoran} Davanti ai denti limati e all'ascia le
      spalle ti si curvano da sole e gli occhi vanno al pavimento, come quando
      a Ghoran passavano i sorveglianti. Ci metti un momento a ricordarti che
      questa donna scrive turni di lavoro pagati, e a tirare su la testa.

      Ti lascia parlare fino in fondo. A metà ti accorgi di avere le mani in
      tasca e le tiri fuori, e lei segue la manovra con interesse prima di
      posare la penna.

      «Tutti vogliono scendere» dice, con la voce resa roca dai gas dei
      tunnel. «Pochi vogliono risalire con tutti i pezzi.» Batte i monconi
      della mano sinistra sul tavolo e ti guarda come si guarda una corda
      nuova, cercando il punto in cui cederà. «Là sotto è la paura che ti
      tiene vivo. Tu ne hai abbastanza?»
    opzioni:
      - testo: "Convincerla che sei utile"
        descrizione: "Dragna prende nei turni solo gente che torna a casa dopo ogni scavo. Devi convincerla che sei tra questi."
        inquieta: "Dragna prende nei turni solo gente che torna a casa dopo ogni scavo. Devi convincerla che sei tra questi, e lei ti guarda come se sapesse già quando smetterai di tornare."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: All'ultima campana
          testo: |
            Dragna ti ascolta senza interromperti. Quando hai finito resta zitta
            abbastanza a lungo da farti pentire di metà delle cose che hai detto,
            poi riprende la penna e scrive il tuo nome in fondo alla bacheca, dove
            c'è ancora spazio.

            «Domani all'ultima campana, con il bracciale carico e le mani vuote»
            dice. «Se arrivi tardi non tornare.»

            Adesso sei nei turni, e il sollievo ti arriva tutto insieme alle
            gambe, che sotto il tavolo si sciolgono un poco.
          effetti: { raschiatore: 1, rep.raschiatori: 1 }
        fallimento:
          titolo: Qualcosa da perdere
          testo: |
            Dragna ti lascia finire per educazione, e la sua educazione dura poco.
            «Parli bene» dice. «Quelli che parlano bene, là sotto, finiscono
            appesi al Ponte dei Morti. Torna quando avrai qualcosa da perdere.»

            Riprende a compilare i turni e non alza più gli occhi dal foglio.
          effetti: { scandalo: 0.5 }
      - testo: "Mostrarle cosa sai fare con i cristalli"
        descrizione: "Dragna lavora con i cristalli da una vita, e su un cristallo un errore si vede subito."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Al tatto
          testo: |
            Dragna rovescia sul tavolo un sacchetto con una dozzina di
            cristalli, identici alla luce della lampada. Chiudi gli occhi e li
            tocchi uno alla volta. Quasi tutti sono freddi, qualcuno appena
            tiepido. Uno solo ronza contro il polpastrello come un'ape chiusa
            nel pugno, e il formicolio ti sale fino al gomito.

            Lo separi dagli altri senza guardarlo. Dragna prende la penna e ti
            segna sulla bacheca senza dire niente, premendo come sempre.
          effetti: { raschiatore: 1, rep.raschiatori: 1 }
        fallimento:
          titolo: Il cristallo sbagliato
          testo: |
            Scegli con sicurezza, e la sicurezza peggiora le cose. Il cristallo
            che porgi a Dragna è sterile come un sasso di fiume. Lei lo soppesa
            e lo posa sul tavolo. Un Raschiatore al bancone ride, con una risata
            breve e senza cattiveria che però ti accompagna fino alla porta e ti
            scalda le orecchie per tutta la strada.

            «Torna» dice Dragna, e dopo un momento aggiunge: «Ma non domani.»
          effetti: { scandalo: 1 }

  - id: ponte-dei-morti
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: Le lanterne del Ponte dei Morti
    sommario: "I Raschiatori appendono qui una lanterna per ogni compagno disperso. Il rumore della città arriva attutito."
    luogo: Ponte dei Morti
    area: ponti-sospesi
    ripetibile: true
    requisiti: [tormento >= 0.5]
    testo: |
      Il Ponte dei Morti è uno dei primi costruiti a Qir-Azel, in metallo annerito
      tenuto insieme da grossi bulloni ribattuti a mano. Ai parapetti sono appese
      centinaia di lanterne. I Raschiatori ne accendono una per ogni compagno
      disperso nel Labirinto, con dentro un piccolo cristallo conduttore che brucia
      per anni, finché regge.

      Quando se ne appende una nuova si dice: «Una lanterna per nome. Una lanterna
      per ciò che pensavi di sapere di lui.» Quassù il rumore della città arriva
      attutito come da sott'acqua, e sulle lastre ti accorgi di aver camminato in
      punta di piedi fin qui.

      {origine apprendista-raschiatore} Sai per chi si accendono queste lanterne, e
      sai che fra qualche anno una potrebbe portare il tuo nome. Il pensiero ti
      arriva ogni volta allo stesso pilone, e ogni volta ti fa allungare il passo.

      {origine accolito-del-velo} La preghiera dei morti la sai a memoria dalla
      Cattedrale. Qui i nomi sono centinaia, e le labbra cominciano a muoversi prima
      che tu abbia deciso da quale lanterna partire.

      Molti Raschiatori vengono qui per smettere di pensare, e a giudicare dalle
      facce sedute contro le travi qualcuno ci riesce.

      {mezzanotte} Una lanterna del primo tratto è appesa più in basso delle
      altre, all'altezza del tuo viso, e il vetro è appannato dall'interno.
      Dentro non c'è il cristallo. C'è un dente legato a un filo, che oscilla
      anche quando il vento cala e tutte le altre lanterne stanno ferme. Sul
      vetro, al posto del nome, hanno inciso soltanto una data, ed è quella di
      domani.
    opzioni:
      - testo: "Restare in silenzio tra le lanterne"
        descrizione: "Sederti sulle assi con la schiena contro una trave e guardare le lanterne senza contarle."
        inquieta: "Sederti sulle assi con la schiena contro una trave e guardare le lanterne senza contarle. Le hai già contate l'ultima volta, e ne mancava una per te."
        prova: { attributo: mentale, abilita: [resilienza, espressivita], difficolta: Facile }
        successo:
          titolo: Un'ora
          testo: |
            Per un'ora non pensi a niente. Guardi le lanterne oscillare e
            ascolti le corde che scricchiolano sotto il vento, e a un certo
            punto le spalle ti si staccano dalle orecchie. Una squadra
            attraversa il ponte con una lanterna nuova e la appende senza
            parlare; l'ultimo della fila si ferma a raddrizzarla due volte.

            Quando ti alzi, quello che ti porti dietro dalla Città Bassa pesa
            meno di quando sei arrivato.
          effetti: { tormento: -1 }
        fallimento:
          titolo: Una di più
          testo: |
            Provi a non pensare e finisci per contare le lanterne. Conti quelle
            del primo tratto e poi quelle del secondo, e alla fine ricominci
            perché hai perso il segno. Il totale cambia a ogni giro, e ogni volta
            ce n'è una in più.

            Te ne vai prima di capire se sbagli tu o il ponte. Stai comunque un
            po' meglio di quando sei arrivato.
          effetti: { tormento: -0.5 }

      - testo: "Una veglia per i dispersi"
        incantesimo: veglia
        descrizione: "Resti tutta la notte fra le lanterne e reciti la preghiera del Velo per ciascun nome."
        inquieta: "Resti tutta la notte fra le lanterne e reciti la preghiera del Velo per ciascun nome, anche per quello che a ogni giro ti esce di bocca senza che tu l'abbia letto."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Fino all'alba
          testo: |
            Reciti la preghiera per ogni lanterna del primo tratto e poi per
            quelle del secondo. Verso l'alba una Raschiatrice si ferma ad
            ascoltare e ti chiede di dire anche il nome di suo fratello. Lo
            dici, e lei lo ripete a fior di labbra un momento dopo di te. Quando
            ti alzi hai le ginocchia rigide e la testa sgombra.
          effetti: { tormento: -1.5 }
        fallimento:
          titolo: Le parole sbagliate
          testo: |
            A metà della notte ti accorgi che stai ripetendo la stessa strofa
            da un'ora, e la lingua continua anche dopo che la testa ha smesso.
            Taci e resti seduto finché fa giorno.
          effetti: { tormento: -0.5 }

  - id: custodi-di-passaggio
    presso: ponte-delle-mille-corde
    immagine: personaggi/varn-kett
    titolo: L'ufficio dei Custodi di Passaggio
    sommario: "Per commerciare sui ponti serve la licenza della Gilda. Varn Kett la rilascia e annota tutto su una pergamena immaginaria."
    luogo: Imbocco del Ponte delle Mille Corde
    area: ponti-sospesi
    requisiti: [licenza-gilda == 0]
    testo: |
      All'imbocco del Ponte delle Mille Corde, dove si paga la gabella, c'è un
      gabbiotto di legno e ferro con lo stemma della Gilda dei Mercanti.
      Dentro siede Varn Kett, ispettore dei dazi, un uomo alto sulla
      cinquantina con un cappotto color tabacco e stivali da pioggia che porta
      anche quando c'è il sole.

      Mentre gli parli, la sua mano destra stringe una penna immaginaria e
      scrive su una pergamena che non c'è.

      «Licenza», dice, «commissione e registro.» Ha una voce piatta, da
      sportello. «Chi commercia sui ponti senza licenza prima viene multato e
      poi bandito. Se insiste, lo perdiamo di vista.» Fa una pausa. «Ho
      imparato a non fare distinzioni. Vale per i sacerdoti e per i nobili, e
      varrebbe anche per te.»

      {origine rampollo-dei-quartieri-alti} Quando dice i nobili guarda i tuoi
      polsini ricamati, e la mano immaginaria si ferma a metà riga. Nei
      Quartieri Alti un ispettore dei dazi ti avrebbe fatto passare senza
      chiedere, e qui ti tocca la stessa voce piatta di tutti.
    opzioni:
      - testo: "Pagare la licenza della Gilda"
        descrizione: "Una somma pesante per non pagare più la gabella a ogni passaggio."
        requisiti: [monete >= 200]
        esito:
          titolo: Un sigillo di cera
          testo: |
            Varn conta la somma con gli occhi senza toccarla, e il conto gli
            torna. Poi lui prende da un cassetto una pergamena vera, ci scrive il
            tuo nome con una grafia da notaio e la chiude con il sigillo di cera
            della Gilda.

            «Da oggi i ponti non ti costano niente» dice. «Da oggi, però, esisti.»
            La sua mano destra scrive ancora un momento sull'aria e si ferma.
            Adesso il tuo nome è in due registri, e solo quello di carta si può
            bruciare.
          effetti: { monete: -200, licenza-gilda: 1, rep.gilda: 1 }

  - id: il-nodo-d-ossidiana
    presso: mercato-dei-nodi
    titolo: Il Nodo d'Ossidiana
    luogo: Mercato dei Nodi
    area: ponti-sospesi
    ripetibile: true
    immagine: personaggi/ambrin-qell
    sommario: "Ambrin Qell vende oggetti che non hanno un prezzo scritto. Il corvo sul bancone decide se sei un cliente."
    testo: |
      Il Nodo d'Ossidiana è una bottega stretta sul Mercato dei Nodi, con gli
      scaffali fino al soffitto e una scala a pioli che nessuno sembra usare
      da anni. Ambrin Qell ha i capelli rossi lunghi e gli occhi azzurri, e
      ti saluta senza alzarsi. Sul bancone c'è un corvo che non ti perde di
      vista, e ti sorprendi a tenere le mani dove può vederle.

      {origine allievo-di-torvessa} Ti viene in mente Pett, il corvo di
      Orvald Temmerin, che dei curiosi non si cura mai. Questo invece ti
      guarda con la testa piegata, nel modo in cui Temmerin guarda un allievo
      prima di fargli una domanda.

      «Entra» dice Ambrin. «Lasciati cercare prima di cercare tu.» Sotto il
      vetro del bancone c'è un anello d'argento, appeso a un gancio dietro di
      lui un mantello color petrolio che si muove appena, anche se nella
      bottega l'aria è ferma. In un cofanetto chiuso a chiave, con
      un'etichetta scritta a mano, c'è uno specchio grande come un palmo.
    opzioni:
      - testo: "L'anello del respiro misurato"
        costo: 0
        immagine: reliquie/anello-respiro-misurato
        requisiti: [oggetto.anello-del-respiro-misurato == 0, monete >= 1200]
        descrizione: "Ti tiene in piedi una volta per scontro, quando dovresti cadere."
        esito:
          titolo: Sotto il vetro
          testo: |
            Ambrin apre il vetro e ti mette l'anello nel palmo. È più freddo
            dell'argento. Il corvo lo fissa finché non lo infili al dito, poi si
            gira dall'altra parte.
          effetti: { monete: -1200, oggetto.anello-del-respiro-misurato: 1 }
      - testo: "Il mantello delle correnti laterali"
        costo: 0
        immagine: reliquie/mantello-correnti-laterali
        requisiti: [oggetto.mantello-delle-correnti-laterali == 0, monete >= 1800]
        descrizione: "Vibra di lato anche quando l'aria è ferma. Ti aiuta a sottrarti ai pericoli."
        esito:
          titolo: Di lato
          testo: |
            Quando lo indossi senti il mantello tirarti leggermente verso
            sinistra, e il piede ti segue prima che tu glielo chieda. Ambrin
            dice che ti sta misurando e che fra un giorno smette.
          effetti: { monete: -1800, oggetto.mantello-delle-correnti-laterali: 1 }
      - testo: "Lo specchio della seconda scelta"
        costo: 0
        immagine: reliquie/specchio-seconda-scelta
        requisiti: [oggetto.specchio-della-seconda-scelta == 0, monete >= 1500]
        descrizione: "Una volta per esito ti lascia ripetere una prova fallita. Se la seconda riesce, qualcosa ti costa."
        esito:
          titolo: Il riflesso in ritardo
          testo: |
            Ambrin ti legge ad alta voce l'avvertenza sull'etichetta prima di
            aprire il cofanetto, senza saltare una riga. Nello specchio il
            tuo riflesso sbatte le palpebre un attimo dopo di te, e la tua mano
            si scosta dal cofanetto un attimo prima.
          effetti: { monete: -1500, oggetto.specchio-della-seconda-scelta: 1 }
      - testo: "Chiedere cosa tiene sotto il bancone"
        immagine: personaggi/ambrin-qell
        requisiti: [nodo.sotto-il-bancone == 0]
        descrizione: "Ambrin non mostra tutto. Alcune cose bisogna chiederle, e nel modo giusto."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Una piuma nera
          testo: |
            Ambrin ti guarda a lungo prima di chinarsi a prendere un amuleto da
            sotto il bancone. È una piuma nera su un gancio di bronzo. Il corvo
            arruffa le penne. «Questo lo vendo solo a chi lo chiede» dice.
          effetti: { nodo.sotto-il-bancone: 1 }
        fallimento:
          titolo: Gli scaffali
          testo: |
            Ambrin sorride con molta gentilezza e ti indica gli scaffali.
            Qualunque cosa ci sia sotto il bancone, oggi resta lì.
          effetti: {}
      - testo: "L'amuleto del corvo vigile"
        costo: 0
        immagine: reliquie/amuleto-corvo-vigile
        requisiti: [oggetto.amuleto-del-corvo-vigile == 0, monete >= 1300, nodo.sotto-il-bancone >= 1]
        descrizione: "Gracchia prima di un'imboscata. Ambrin lo vende solo a chi lo ha chiesto."
        esito:
          titolo: Tiepida
          testo: |
            La piuma è tiepida anche se fuori fa freddo. Mentre esci, il corvo
            sul bancone gracchia una volta, e l'amuleto risponde.
          effetti: { monete: -1300, oggetto.amuleto-del-corvo-vigile: 1 }
