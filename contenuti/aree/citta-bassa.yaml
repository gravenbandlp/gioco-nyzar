aree:
  - id: citta-bassa
    immagine: ambientazione/citta-bassa
    nome: Città Bassa
    sommario: "Un altopiano di roccia a est della città, col fumo delle fucine sui tetti e le bische aperte di notte."
    testo: |
      La Città Bassa occupa un altopiano di roccia a est di Qir-Azel. Dalle
      fenditure del terreno sale un calore che non viene dal sole, e d'inverno
      i cani ci dormono sopra. Le case di pietra grezza sono rattoppate con la
      lamiera, e il fumo delle fucine ristagna all'altezza dei tetti.

      Della sera del Festival delle Foglie Alate, quando gli orchi sono scesi
      sulla città, si parla ancora a voce bassa. A ovest oscillano i Ponti
      Sospesi, e più in alto suonano le campane dei Quartieri Alti.
    negozi: [banco-di-grusk, armeria-di-irsa, fucina-dei-due-mastini, emporio-tamberlo, il-salotto-di-nerissa, stalla-di-dolovan, la-tua-bottega]

storylet:
  # ------------------------------------------------------------ azioni ripetibili
  - id: turno-acciaieria
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Un turno all'Acciaieria
    sommario: "Il turno di notte all'Acciaieria dei Tarvelin comincia quando la colata diventa azzurra, e il capoturno cerca braccia ferme."
    luogo: Acciaieria dei Tarvelin
    area: citta-bassa
    ripetibile: true
    # Con pista.acciaio da 1 a 7 l'Acciaieria è chiusa, occupata o spenta; dopo riapre solo con
    # acciaieria.futuro >= 1 (citta/minori.yaml), e il turno torna con la variante qui sotto.
    requisiti: [pista.acciaio < 1]
    testo: |
      All'Acciaieria il turno di notte comincia quando la colata diventa
      azzurra. Sotto le maschere di cuoio dalle lenti affumicate nessuno
      parla, perché dicono che il lyssan ascolta, e chi lo tratta male se lo
      vede virare nello stampo a un grigio da annegato.

      Tu non tocchi il lyssan. Spingi i carrelli della scoria ancora calda
      lungo rotaie storte, tenute in squadra con zeppe di legno che ogni
      tanto prendono fuoco. Il capoturno ti guarda le mani finché decide che
      per stanotte vanno bene.
    opzioni:
      - testo: "Spingere i carrelli di scoria fino all'alba"
        descrizione: "Serve forza nelle spalle e l'abitudine di non fissare la colata troppo a lungo."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Spalle in fiamme
          testo: |
            All'alba fischia la sirena del cambio, e hai le spalle in fiamme e un
            sapore di ferro in bocca che nemmeno l'acqua della fontana manda via.
            Il capoturno ti mette la paga nel palmo una moneta alla volta,
            guardandoti negli occhi a ogni moneta.
          effetti: { monete: 4 }
        fallimento:
          titolo: Uno schizzo azzurro
          testo: |
            A metà strada un carrello s'impunta sulla rotaia storta, e quando
            spingi più forte il carico si rovescia e uno schizzo di colata ti
            prende l'avambraccio. Il capoturno ti paga lo stesso, un po' meno del
            pattuito. «La scoria per terra non la paghiamo» dice da dentro la
            maschera, e poi ti fascia il braccio con uno straccio pulito, che da
            un uomo come lui è quasi una gentilezza.
          effetti: { monete: 2, ferite: 0.5 }

  # Il turno dopo che la fornace è stata riaccesa (acciaieria.futuro 1, 2 o 3, citta/minori.yaml).
  - id: turno-acciaieria-riaccesa
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Un turno all'Acciaieria
    sommario: "La fornace dei Tarvelin è di nuovo accesa, e il capoturno di notte cerca braccia ferme per la scoria."
    luogo: Acciaieria dei Tarvelin
    area: citta-bassa
    ripetibile: true
    requisiti: [acciaieria.futuro >= 1]
    testo: |
      All'Acciaieria il turno di notte comincia quando la colata diventa
      azzurra. Sulla porta delle consegne la corona di foglie rosse per gli
      otto operai morti è secca, e chi entra la sfiora con due dita perché
      nessuno ha il coraggio di toglierla.

      Sotto le maschere di cuoio nessuno parla. Spingi i carrelli della
      scoria ancora calda lungo rotaie storte, tenute in squadra con zeppe di
      legno che ogni tanto prendono fuoco, finché il capoturno decide che per
      stanotte le tue mani vanno bene.
    opzioni:
      - testo: "Spingere i carrelli di scoria fino all'alba"
        descrizione: "Serve forza nelle spalle e l'abitudine di non fissare la colata troppo a lungo."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Spalle in fiamme
          testo: |
            All'alba fischia la sirena del cambio, e hai le spalle in fiamme e un
            sapore di ferro in bocca che nemmeno l'acqua della fontana manda via.
            Il capoturno ti mette la paga nel palmo una moneta alla volta,
            guardandoti negli occhi a ogni moneta.
          effetti: { monete: 4 }
        fallimento:
          titolo: Uno schizzo azzurro
          testo: |
            A metà strada un carrello s'impunta sulla rotaia storta, e quando
            spingi più forte il carico si rovescia e uno schizzo di colata ti
            prende l'avambraccio. Il capoturno ti paga lo stesso, un po' meno del
            pattuito. «La scoria per terra non la paghiamo» dice da dentro la
            maschera, e poi ti fascia il braccio con uno straccio pulito, che da
            un uomo come lui è quasi una gentilezza.
          effetti: { monete: 2, ferite: 0.5 }

  - id: orecchie-pignatta
    presso: pignatta-grassa
    immagine: ambientazione/pignatta-grassa
    titolo: Orecchie aperte alla Pignatta Grassa
    sommario: "Alla Pignatta Grassa le notizie arrivano prima dei banditori, per chi offre da bere e sa stare zitto."
    luogo: Pignatta Grassa
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.pelle < 6]
    testo: |
      La Pignatta Grassa è la taverna che lo sceriffo sconsiglia ai
      forestieri, e per questo è sempre piena, con un fumo che dopo un'ora ti
      brucia gli occhi. Al tavolo verde un mezzelfo dalle mani curatissime
      mescola le carte e ogni tanto, con grande sfortuna, perde.

      Dietro il bancone Mauro Scrocco, vestito color zafferano, abbraccia
      chiunque arrivi chiamandolo amico mio. Le voci arrivano qui prima che
      dai banditori, e per sentirle basta offrire da bere e stare zitti.

      {origine figlio-della-citta-bassa} Nel tuo vicolo la Pignatta era
      vietata ai ragazzi, e tutti ci entravano dal cortile.
    opzioni:
      - testo: "Offrire da bere e ascoltare"
        descrizione: "Offri un giro al tavolo più chiacchierone e non fai domande, perché alla Pignatta si pagano a parte."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Cose che non dovevi sentire
          testo: |
            Al tavolo, con due carovanieri, siede una donna che non dice che
            mestiere fa e tiene le mani sotto il tavolo per tutta la sera. Parlano
            della razzia e di chi ci ha guadagnato, poi abbassano la voce e
            passano a chi, dalla sera del Festival, non si è più fatto vedere. Te
            ne vai con due storie che non avresti dovuto sentire.
          effetti: { informazioni.voce: 2 }
        fallimento:
          titolo: Il prezzo della farina
          testo: |
            Paghi il giro e per un'ora ascolti lamentele sul prezzo della farina.
            Mauro ti dà una pacca sulla spalla così forte che il sidro ti va di
            traverso. «Si parla di tutto, qui, amico mio. Si dice nulla.» Poi
            torna al bancone a contare l'incasso, compreso il tuo giro.
          effetti: { monete: -1 }

  - id: orlo-rottami
    presso: orlo-dei-rottami
    immagine: ambientazione/orlo-dei-rottami
    titolo: Frugare all'Orlo dei Rottami
    sommario: "Quello che i Raschiatori buttano via, qualcun altro lo raccoglie. Conviene arrivare prima di Grusk."
    luogo: Orlo dei Rottami
    area: citta-bassa
    ripetibile: true
    testo: |
      L'Orlo dei Rottami è una lingua di terra fra le ultime baracche e il
      bordo della Cicatrice, dove i Raschiatori scaricano i pezzi precuriani
      e i cristalli sterili che non sono riusciti a vendere.

      Una decina di spazzini autorizzati dalla Gilda smista la roba. Il più
      rumoroso ha tatuaggi fin sulle palpebre e spinge una carriola rossa
      cantando sempre la stessa strofa. Se arrivi prima degli spazzini
      qualcosa si trova, altrimenti trovi Grusk.

      {origine allievo-di-torvessa} All'Accademia un cristallo sterile si
      studia sotto una campana di vetro, e qui ce ne sono a manciate nel
      fango.
    opzioni:
      - testo: "Setacciare i cumuli prima degli spazzini"
        descrizione: "Si fruga a mani nude. All'Orlo conta capire prima degli altri quali pezzi funzionano ancora."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Una scheggia che pulsa
          testo: |
            Sotto una lamiera annerita, in un groviglio di cavi, trovi una scheggia di
            metallo precuriano che pulsa ancora, incisa con segni che sembrano spostarsi
            quando provi a fissarli, e accanto due frammenti di cristallo esausti che hanno
            comunque un compratore. Te li infili sotto la camicia mentre lungo la riva
            cigola una carriola rossa con la solita strofa, ed è ora di andarsene.
          effetti: { cristalli.frammento-esausto: 2, reliquie.scheggia: 1 }
        fallimento:
          titolo: Sapore di metallo
          testo: |
            Scavi per ore a mani nude in un mucchio che puzza di ozono senza
            trovare niente che valga la fatica, e quando ti rialzi hai sotto la
            lingua un sapore di moneta. Alla Cripta dicono che la contaminazione
            comincia così.
          effetti: { contaminazione: 1 }

      - testo: "Leggere il Mana nei cumuli"
        incantesimo: leggere-il-mana
        descrizione: "Passi le dita sui cristalli scartati e senti quali hanno ancora una carica."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Uno ancora vivo
          testo: |
            Quasi tutti i cristalli sono freddi e muti sotto le dita. Uno, in
            fondo a un sacco di scarti della Gilda, ha ancora un battito lento, e
            i Raschiatori lo hanno buttato perché da fuori sembra sterile. Lo
            prendi insieme a due frammenti che valgono poco ma qualcosa.
          effetti: { cristalli.cristallo-sterile: 1, cristalli.frammento-esausto: 2 }
        fallimento:
          titolo: Troppo rumore
          testo: |
            Il campo è pieno di cariche deboli e disordinate, e non riesci a
            distinguerne nessuna, come cercare una voce sola in un mercato. Dopo
            un'ora ti fanno male le tempie e hai le mani sporche di polvere
            grigia.
          effetti: { contaminazione: 1 }

      - testo: "Frugare di notte con la Luce fredda"
        incantesimo: luce-fredda
        descrizione: "Di notte gli spazzini non ci sono. Con una luce che non fa fumo nessuno ti vede dalla riva."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Il turno di notte
          testo: |
            Alla luce bianca del cristallo trovi fra le lamiere due schegge incise
            e una borsa di cuoio persa durante la razzia. Dentro c'è una lettera
            su un debito con la Pignatta, scritta con una grafia che preme tanto
            da bucare la carta.
          effetti: { reliquie.scheggia: 2, informazioni.voce: 1 }
        fallimento:
          titolo: Buio pesto
          testo: |
            La luce trema e si spegne due volte. Alla terza rinunci e te ne vai
            inciampando nei cavi, con le dita intorpidite e uno stinco che
            domani sarà viola.
          effetti: {}

      - testo: "Cercare i cumuli delle squadre che conosci"
        descrizione: "Sui cumuli riconosci i segni a gesso delle squadre con cui hai fatto qualche turno."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Facile }
        successo:
          titolo: I segni a gesso
          testo: |
            Trovi il cumulo della squadra di Dragna dal segno a gesso sulle
            lamiere, una croce con un ricciolo, e sotto una griglia piegata ci
            sono frammenti scaricati con la ferraglia da chi aveva fretta di
            andare a bere. Grusk ti vede passare con la bisaccia piena e canta la
            sua strofa più forte, poi lascia correre, perché la roba dei
            Raschiatori a un Raschiatore non la pesa.
          effetti: { cristalli.frammento-esausto: 2 }
        fallimento:
          titolo: Il gesso sbiadito
          testo: |
            La pioggia ha quasi lavato via il segno che cercavi, e passi mezza
            mattina a rigirare il ferro morto di un'altra squadra. Alla fine
            Grusk, dalla carriola rossa, ti indica con gentilezza il cumulo
            giusto, che gli spazzini hanno già svuotato.

  - id: rissa-pignatta
    presso: pignatta-grassa
    immagine: personaggi/mauro-scrocco
    titolo: Una scommessa dietro la Pignatta
    sommario: "Nel cortile dietro la Pignatta c'è un cerchio di gesso, e dentro un tipo che cerca qualcuno da picchiare."
    luogo: Cortile della Pignatta Grassa
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.pelle < 6]
    testo: |
      Dietro la Pignatta c'è un cortile dove le guardie non vengono mai, con
      un cerchio di gesso e una dozzina di scommettitori intorno. Nel cerchio
      saltella un tipo con le nocche spaccate e l'alito che puzza di sidro, e
      chiunque gli stia davanti gli va bene. Dalla porta sul retro Mauro
      Scrocco segna le puntate col gesso sullo stipite.

      {rissa Facile} Salta troppo, tiene la guardia bassa a sinistra e il
      sidro gli appesantisce i piedi.

      {origine fuggiasco-di-ghoran} Gli scommettitori ti guardano spalle e
      polsi, come a Ghoran prima di farti salire sulla bilancia.
    opzioni:
      - testo: "Entrare nel cerchio"
        descrizione: "Niente lame, e chi esce dal gesso ha perso, anche se la seconda regola la rispettano in pochi."
        combattimento: rissa-pignatta
        vittoria:
          titolo: Posta vinta
          testo: |
            Il tipo va giù al terzo scambio, e al quarto decide di restare a
            terra. Qualcuno ti mette in mano la tua parte della posta, monete
            tiepide passate per molte mani, e qualcun altro ti versa del sidro in
            testa, che da queste parti è un complimento. Dalla porta Mauro alza il
            bicchiere verso di te, e adesso sa chi sei.
          effetti: { monete: 8 }
        sconfitta:
          titolo: Contro il muro
          testo: |
            Ti risvegli con la guancia contro il muro, fuori dal cerchio, senza la
            tua quota e senza un dente, che più tardi ritrovi in tasca, rimesso lì
            da qualcuno con un certo scrupolo. Gli scommettitori sono già passati
            a un'altra coppia, e nessuno ti guarda.
          effetti: { monete: -3 }

  - id: ricucire-gramm
    presso: mercato-dei-nodi
    immagine: personaggi/nestor-gramm
    titolo: Farsi ricucire da Nestor Gramm
    sommario: "Nestor Gramm ricuce le ferite nel retro della sua Dispensa. Si entra dal vicolo."
    luogo: Il vicolo dietro la Dispensa di Gramm
    area: ponti-sospesi
    ripetibile: true
    # Nestor fugge quando colpisci il suo retrobottega (colpo.dispensa) e dopo pista.pelle 4 non torna
    # più (piste/pelle-scuri.yaml); come in citta/nodo.yaml, da lì in poi la Dispensa la tiene il garzone.
    requisiti: [ferite >= 0.5, pista.pelle < 4, colpo.dispensa == 0]
    testo: |
      Alla Dispensa di Gramm si entra dalla porta principale per comprare
      tisane, e dal vicolo per tutto il resto. Nestor Gramm è basso e tozzo,
      con un grembiule grigio pieno di macchie vecchie e uno straccio in tasca
      che non usa mai per pulire. Esamina le tue ferite senza simpatia, come
      un conto da saldare. In giro si dice che assaggi troppo spesso i propri
      preparati, ma le sue mani restano ferme.

      {origine accolito-del-velo} In Cattedrale ti hanno insegnato a lavarti
      le mani prima di toccare una ferita, e a Nestor non l'ha insegnato
      nessuno.
    opzioni:
      - testo: "Pagare Nestor"
        descrizione: "Nestor non fa sconti e non fa domande, e da queste parti è uno scambio onesto."
        requisiti: [monete >= 10]
        esito:
          titolo: Ago e filo
          testo: |
            Seduto su una cassa che odora di zolfo, ti lasci ricucire con ago e
            filo. Poi Nestor spalma un impasto verdastro che brucia fino alle
            lacrime, e borbotta soltanto quando stringi troppo i denti. «Fermo,
            che il dolore è gratis e il filo no.» Alla fine conta le monete due
            volte e le fa sparire sotto il bancone.
          effetti: { monete: -10, ferite: -1 }

  - id: ricucire-dal-garzone
    presso: mercato-dei-nodi
    immagine: ambientazione/dispensa-di-gramm
    titolo: Farsi ricucire alla Dispensa
    sommario: "Nestor Gramm se n'è andato, e nel retro della Dispensa adesso ricuce il suo garzone."
    luogo: Il vicolo dietro la Dispensa di Gramm
    area: ponti-sospesi
    ripetibile: true
    requisiti: [ferite >= 0.5, pista.pelle >= 4]
    testo: |
      Alla Dispensa di Gramm si entra ancora dal vicolo, anche se Nestor non
      c'è più. Ti apre un ragazzo magro con il grembiule grigio del padrone,
      arrotolato due volte in vita, che ha imparato a ricucire guardando e
      ogni tanto si ferma a ricordare il punto successivo muovendo le labbra.

      {empatia Facile} È spaventato quanto te, ma si è lavato le mani due
      volte prima di cominciare.
    opzioni:
      - testo: "Pagare il garzone"
        descrizione: "Il garzone chiede quello che chiedeva Nestor, e i conti li tiene sul muro con un chiodo."
        requisiti: [monete >= 10]
        esito:
          titolo: Ago e filo
          testo: |
            Ti fa sedere sulla stessa cassa che odora di zolfo e ricuce piano, con
            la lingua fra i denti, poi spalma l'impasto verdastro di Nestor, che
            brucia come prima. Ogni tanto ti chiede scusa senza motivo. Alla fine
            conta le monete due volte come faceva il padrone e segna una tacca
            storta sul muro accanto alle altre.
          effetti: { monete: -10, ferite: -1 }

  # Lo stesso garzone quando Nestor è fuggito al colpo del retrobottega, prima di pista.pelle 4.
  - id: ricucire-dal-garzone-dopo-il-colpo
    presso: mercato-dei-nodi
    immagine: ambientazione/dispensa-di-gramm
    titolo: Farsi ricucire alla Dispensa
    sommario: "Nestor Gramm se n'è andato, e nel retro della Dispensa adesso ricuce il suo garzone."
    luogo: Il vicolo dietro la Dispensa di Gramm
    area: ponti-sospesi
    ripetibile: true
    requisiti: [ferite >= 0.5, pista.pelle < 4, colpo.dispensa >= 1]
    testo: |
      Alla Dispensa di Gramm si entra ancora dal vicolo, anche se Nestor non
      c'è più. Ti apre un ragazzo magro con il grembiule grigio del padrone,
      arrotolato due volte in vita, che ha imparato a ricucire guardando e
      ogni tanto si ferma a ricordare il punto successivo muovendo le labbra.

      {empatia Facile} È spaventato quanto te, ma si è lavato le mani due
      volte prima di cominciare.
    opzioni:
      - testo: "Pagare il garzone"
        descrizione: "Il garzone chiede quello che chiedeva Nestor, e i conti li tiene sul muro con un chiodo."
        requisiti: [monete >= 10]
        esito:
          titolo: Ago e filo
          testo: |
            Ti fa sedere sulla stessa cassa che odora di zolfo e ricuce piano, con
            la lingua fra i denti, poi spalma l'impasto verdastro di Nestor, che
            brucia come prima. Ogni tanto ti chiede scusa senza motivo. Alla fine
            conta le monete due volte come faceva il padrone e segna una tacca
            storta sul muro accanto alle altre.
          effetti: { monete: -10, ferite: -1 }

  - id: spalmare-unguento
    immagine: ambientazione/ampolle-e-rimedi
    titolo: Un unguento dal barattolo
    sommario: "Pasta alla resina, dalla ricetta di una nonna che a quanto pare non è morta di niente."
    area: citta-bassa
    ripetibile: true
    requisiti: [unguento >= 1, ferite >= 0.5]
    testo: |
      Il barattolo di terracotta è chiuso con cera e spago, e te l'ha venduto un tizio che
      giurava sulla ricetta di sua nonna. Dentro c'è una pasta color muschio che odora di
      resina e di grasso di pecora. Ti siedi in un angolo dove nessuno ti vede e allenti le
      bende, che si staccano dalle ferite con un rumore che preferiresti non sentire.

      {origine figlio-del-circolo} Dall'odore riconosci resina di pino giovane, di quella che
      al Circolo si lascia agli alberi perché ne hanno ancora bisogno.
    opzioni:
      - testo: "Usare l'unguento"
        descrizione: "Stendi due dita di pasta sulla ferita e speri che la nonna avesse ragione."
        esito:
          titolo: La nonna aveva ragione
          testo: |
            Prima pizzica e poi brucia, finché il bruciore smette di colpo e il
            dolore diventa sordo e lontano. Richiudi il barattolo, più leggero,
            con le dita che sanno di resina.
          effetti: { unguento: -1, ferite: -0.5 }

  - id: cucire-voci
    titolo: Cucire insieme le voci
    sommario: "Hai raccolto cinque voci sulla razzia. Messe a confronto con pazienza, qualcuna potrebbe rivelarsi vera."
    area: citta-bassa
    ripetibile: true
    requisiti: [informazioni.voce >= 5]
    testo: |
      Hai raccolto cinque voci in cinque sere di sidro pagato, e non vanno
      d'accordo. Una dice che gli orchi sono entrati dalla porta nord, un'altra
      dal fiume. Una giura che lo sceriffo sapeva tutto, un'altra che ha
      pianto. Le stendi sul tavolo e cerchi i punti in cui si toccano, con la
      pazienza di un cronista del Velo, finché ti accorgi che muovi le labbra
      come fanno loro.

      {conoscenze-della-strada Media} Le due sullo sceriffo vengono dalla
      stessa osteria, da due tizi che si detestano, e l'una annulla l'altra.
    opzioni:
      - testo: "Confrontarle e tenere solo ciò che regge"
        descrizione: "Scartare è la parte difficile. Ogni voce ha qualcuno che ci ha creduto abbastanza da ripeterla."
        esito:
          titolo: Resta una cosa sola
          testo: |
            A notte fonda hai scartato quattro storie e mezza, e quella che resta
            è piccola e regge da qualunque lato la guardi. A Qir-Azel una cosa
            vera resta in testa a tutti, e alla fine qualcuno la compra. Spegni la
            candela con due dita e ti accorgi di avere il collo rigido come
            un'asse.
          effetti: { informazioni.voce: -5, informazioni.pettegolezzo: 1 }

  # ------------------------------------------------------------ la pista della Dama d'Argento
  - id: parola-orchesca
    immagine: ambientazione/evento-razzia-festival-150
    titolo: Una parola orchesca
    sommario: "Gli orchi la gridavano mentre morivano, e adesso la Città Bassa la ripete sottovoce senza sapere cosa significhi."
    luogo: Città Bassa, nei giorni dopo il Festival
    area: citta-bassa
    requisiti: [pista.dama-argento == 0]
    testo: |
      Dopo la razzia delle Foglie Alate il martello della Città Bassa ha
      ripreso a battere, ma più piano. I morti si seppelliscono in fosse comuni
      benedette in fretta, e le tende strappate si rattoppano con la stoffa
      delle bandiere del Festival. Si contano anche gli orchi uccisi, e quelli
      che, braccati sull'orlo, hanno preferito saltare nella Cicatrice
      piuttosto che farsi prendere.

      Poi c'è la parola, *Mawrak'Thur*, che si sente nelle code alla fontana e
      sulla soglia delle botteghe. Gli orchi la gridavano mentre caricavano e
      mentre morivano, e alcuni anche mentre saltavano. Quando provi a dirla a
      mezza voce, la lingua ti si impiglia sull'apostrofo.

      {accademiche Media} Nelle lingue orchesche l'apostrofo è un colpo di
      gola, e chi lo salta dice un'altra parola. In Città Bassa lo saltano
      tutti.

      {origine fuggiasco-di-ghoran} Questa parola l'avevi già sentita nei
      recinti di Ghoran, dove i sorveglianti la usavano per la Marea Grigia, e
      quando la dice qualcuno in coda alla fontana le spalle ti si curvano da
      sole.

      Una lavandaia giura che il capoguerra sul cinghiale corazzato la cantava
      come una preghiera, mentre per un facchino era una bestemmia, e nessuno
      dei due sa che cosa significhi. Tu vuoi saperlo, e in Città Bassa le
      informazioni si pagano con altre informazioni.
    opzioni:
      - testo: "Scambiare le tue voci con chi ha sentito di più"
        descrizione: "In Città Bassa il cambio corrente è di due storie per una, e nessuno rilascia ricevuta."
        requisiti: [informazioni.voce >= 2]
        esito:
          titolo: La vecchia delle castagne
          testo: |
            All'angolo del lavatoio una vecchia che vende castagne ascolta le tue
            due storie e si china verso di te. «Dama d'Argento, bello mio. Nella
            lingua degli orchi vuol dire così.» Gliel'ha detto una sera un uomo
            giovane con troppo liquore in corpo. «Degli orchi non aveva paura»
            precisa, porgendoti un cartoccio di castagne che non hai chiesto.
            «Aveva paura di quella parola.»
          effetti: { informazioni.voce: -2, pista.dama-argento: 1 }
      - testo: "Fare domande in giro, con discrezione"
        descrizione: "Fai qualche domanda qua e là come per curiosità, e mai due volte alla stessa persona."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Tre volte la stessa
          testo: |
            Te la traduce prima un carovaniere al ponte, poi una tintora con le
            mani blu fino ai gomiti, e infine un ragazzino che si fa pagare in
            anticipo. Nessuno conosce gli altri, eppure tutti dicono a bassa voce
            che *Mawrak'Thur* vuol dire Dama d'Argento. Chi sia la Dama nessuno lo
            sa, e di chi ha detto la parola per primo sanno soltanto che non stava
            ridendo.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Troppe domande
          testo: |
            Fai una domanda di troppo sulla stessa parola e la gente si chiude. La
            tintora smette di sorriderti, e il carovaniere si ricorda di avere
            fretta, anche se il suo carro è fermo da due giorni. Quando giri
            l'angolo senti che qualcuno ti guarda andare via, un po' troppo a
            lungo.
          effetti: { sospetto: 1 }

  - id: lingua-dei-chiodi
    presso: pignatta-grassa
    immagine: fazioni/tribu-nove-chiodi
    titolo: Chi parla la lingua dei Nove Chiodi
    sommario: "La traduzione non basta, serve qualcuno che parli l'orchesco dei Nove Chiodi e che da quella sera ha paura."
    luogo: Pignatta Grassa
    area: citta-bassa
    requisiti: [pista.dama-argento == 1]
    testo: |
      Adesso sai che *Mawrak'Thur* vuol dire Dama d'Argento. Resta da capire
      chi sia questa dama, e in città qualcuno ha capito abbastanza di quello
      che gli orchi gridavano da averne paura.

      L'orchesco lo parlano gli orchi, qualche ranger che li caccia e i pochi
      mercanti che hanno trafficato a lungo col Bosco della Forca, e che dalla
      sera del Festival non se ne vantano più.

      {origine mercante-dei-ponti} Sui Ponti qualche collega ha trattato con
      il Bosco della Forca, e dalla sera del Festival nessuno ricorda più come
      si dice *prezzo* in orchesco.

      Alla Pignatta Grassa, al tavolo dei carovanieri, si beve per dimenticare
      la strada per Laresh. Dietro il bancone Mauro Scrocco lucida un
      bicchiere pulito da un'ora, aspettando che tu gli chieda quello per cui
      sei venuto.
    opzioni:
      - testo: "Chiedere tra i carovanieri"
        descrizione: "Chi fa la strada per Laresh conosce gli orchi meglio di quanto vorrebbe, e sa chi in città li frequentava."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Media }
        successo:
          titolo: Un nome
          testo: |
            Ci vogliono tre giri e una storia vera sulla razzia prima che un
            carovaniere con la barba bruciata da un lato parli. «Dole» dice.
            «Rennick Dole, il responsabile della Segheria. Suo padre commerciava
            pelli col Bosco della Forca, e lui l'orchesco lo parla meglio di
            chiunque in città.» Dalla sera del Festival, aggiunge un altro,
            Rennick non si fa più vedere, e alla Segheria dicono che è partito.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Tutto tranne gli orchi
          testo: |
            I carovanieri parlano volentieri dei dazi dei Custodi e di un cavallo
            zoppo che è costato quanto un matrimonio, e degli orchi non vogliono
            parlare. Quando insisti uno di loro posa il boccale con un colpo secco
            e cambia tavolo, e gli altri lo seguono.
          effetti: { sospetto: 1 }
      - testo: "Pagare Mauro Scrocco perché si ricordi di qualcosa"
        descrizione: "Mauro dice di non vendere informazioni. Presta memoria a interesse, e un anticipo basta a rinfrescargli la memoria."
        immagine: personaggi/mauro-scrocco
        requisiti: [monete >= 10]
        esito:
          titolo: Mauro si ricorda
          testo: |
            Mauro ti abbraccia e fa sparire le tue monete in una tasca color
            zafferano. «Rennick Dole, il responsabile della Segheria» dice
            sottovoce. «Parla la lingua di quelle bestie meglio di loro, e dopo il
            Festival ha smesso di andare in un sacco di posti. Uno che ha paura,
            amico mio, si riconosce da dove non va.» A un tavolo d'angolo qualcuno
            si segna il tuo nome.
          effetti: { monete: -10, pista.dama-argento: 1, rep.scuri: 1 }

  - id: segheria-malgrani
    presso: segheria-e-mulino-malgrani
    immagine: ambientazione/segheria-di-qir-azel
    titolo: La Segheria Malgrani
    sommario: "Alla Segheria si lavora a testa bassa, con uomini in livrea al cancello. Marko Thessel ti riceve."
    luogo: Segheria Malgrani, sul canale del cristallo
    area: citta-bassa
    requisiti: [pista.dama-argento == 2]
    testo: |
      Senti la Segheria prima di vederla, un ronzio basso che a cinquanta passi
      ti entra nei denti. Il canale che la muove è artificiale, alimentato da
      un grosso cristallo conduttore romboidale, e i trucioli coprono il
      cortile come una neve gialla che a nessuno viene in mente di spalare.

      Tutti la chiamano Segheria Malgrani, perché la concessione è della
      famiglia e i Malgrani lo ricordano a tutti. Al cancello stanno quattro
      uomini con le mazze ferrate e giacche di cuoio borchiato, con lo stemma
      di casa Malgrani sulla spalla, un albero trafitto da una lama. Oltre il
      cancello gli operai lavorano a testa bassa e in silenzio, e almeno due di
      loro hanno mani che non hanno mai tenuto una sega.

      Sotto il porticato Marko Thessel scende tre gradini senza fretta. È
      giovane e bello, e lo sa, con una camicia di lino chiara e una matita da
      carpentiere dietro l'orecchio, e ti sorride con la cortesia di un
      commerciante.

      {galateo Media} Tre gradini, e si ferma all'ultimo, abbastanza per
      sembrare cortese e troppo pochi per arrivarti davanti.

      {origine rampollo-dei-quartieri-alti} L'albero trafitto lo conosci dalle
      carrozze dei Malgrani, che nei Quartieri Alti si fermano sempre di
      traverso davanti ai portoni degli altri.

      «A quest'ora la Segheria non riceve visite. Abbiamo commesse pressanti.»
    opzioni:
      - testo: "Chiedere di Rennick Dole"
        descrizione: "Fai una domanda semplice e garbata, poi guarda bene come ti rispondono."
        immagine: personaggi/rennick-dole
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Laresh, dice lui
          testo: |
            Marko allarga le braccia, dispiaciuto. «Rennick? È andato a Laresh a
            trattare con un grossista di legname, e torna fra qualche giorno. Se è
            una questione di forniture posso aiutarti io.» Lo dice troppo bene, e
            intanto la mano destra gli scivola verso l'arma alla cintura. Marko
            Thessel mente, e non si preoccupa che tu te ne accorga. Te ne vai
            chiedendoti per conto di chi stia mentendo.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: A Laresh, per legname
          testo: |
            «A Laresh», dice Marko, «per una trattativa sul legname. Tornerà fra
            qualche giorno.» Ha una voce piacevole e un modo di guardarti che ti
            fa sentire ben vestito, e per ora gli credi. Solo in strada ti accorgi
            che i quattro uomini al cancello non ti hanno mai tolto gli occhi di
            dosso.
          effetti: { sospetto: 1 }
      - testo: "Insistere, davanti ai suoi uomini"
        descrizione: "Marko è abituato a essere l'uomo più importante del cortile. Puoi provare a fargli cambiare abitudine davanti a tutti."
        immagine: personaggi/marko-thessel
        requisiti: [intimidire >= 1]
        combattimento: rissa-segheria
        vittoria:
          titolo: Sangue nella segatura
          testo: |
            Finisce con Marko Thessel in ginocchio nella segatura, la camicia
            chiara sporca di resina e di sangue, mentre gli operai tengono gli
            occhi sui tronchi. Marko sputa e ride. «Maison des Lunes, in Via dei
            Rasoi. È lì dall'alba e non vuole farsi trovare da nessuno, te
            compreso. Ma fai pure, vediamo chi arriva prima.» Te ne vai con le
            nocche spaccate e un nemico con un cognome importante.
          effetti: { pista.dama-argento: 2, rep.malgrani: -2, racconto: 1 }
        sconfitta:
          titolo: Fuori dal cancello
          testo: |
            Sono più di quanti ne avessi contati, e ti ritrovi fuori dal cancello
            con la faccia nella segatura e uno stivale fra le scapole, a un palmo
            dall'albero trafitto dello stemma dei Malgrani. Marko non si è nemmeno
            sporcato la camicia. «Salutami Laresh» dice qualcuno, e ridono tutti
            tranne gli operai.
          effetti: { rep.malgrani: -1 }
      - testo: "Andarsene"
        descrizione: "Non serve forzare questa porta oggi. Puoi tornare quando saprai qualcosa di più."
        costo: 0
        esito:
          titolo: Il rumore delle seghe
          testo: |
            Te ne vai, e Marko ha già ripreso a parlare con uno dei suoi, a voce
            abbastanza alta perché tu senta la parola «curiosi». Il rumore delle
            seghe ti accompagna fino al ponte, poi si confonde con quello della
            Città Bassa.

  - id: sorriso-di-marko
    immagine: personaggi/marko-thessel
    titolo: Il sorriso di Marko
    sommario: "Marko sa che Rennick non è a Laresh, e a fine turno non torna a casa sua."
    luogo: Città Bassa, al calar della sera
    area: citta-bassa
    requisiti: [pista.dama-argento == 3]
    testo: |
      Adesso sai che Rennick non è partito per Laresh, e che Marko ti ha
      mentito sapendolo.

      Al calar della sera, poco dopo il cambio degli uomini al cancello,
      Marko Thessel esce dall'ingresso laterale della Segheria con la camicia
      cambiata e i capelli pettinati, saluta con due dita gli uomini in
      livrea e si incammina. Non va verso casa, e nemmeno verso la Pignatta.
      Scende invece verso il margine dell'Orlo, dove i lastroni di pietra blu
      sono scheggiati e le lanterne illuminano la strada a chiazze, e cammina
      svelto, dal lato in ombra.

      {empatia Media} Si è pettinato per uscire. Così si va da qualcuno a cui
      si tiene, oppure da qualcuno di cui si ha paura.

      Puoi seguirlo, oppure tornare al cancello della Segheria, dove la donna
      che spazza la segatura a fine giornata sa di tutti più di quanto dica.
    opzioni:
      # Chi ha già lavorato alla Maison (rep.maison >= 1) la riconosce: la variante sta in fondo, così gli id del doppiaggio non cambiano.
      - testo: "Seguirlo tra i vicoli"
        descrizione: "Tieni la distanza e cambia spesso lato. Marko è vanitoso e si guarda nelle vetrine più che alle spalle."
        quando: [rep.maison < 1]
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Una luna incisa
          testo: |
            Lo segui su per Via dei Rasoi fino al cristallo spento. Tre porte
            dopo, all'angolo con Via del Salmone, Marko tira la catena di una casa
            con una luna incisa sulla porta. Gli apre una halfling, e quando lui
            indica il primo piano lei scuote la testa, così Marko se ne va senza
            entrare. Al primo piano una tenda si richiude, e capisci che Rennick
            Dole è lì dentro.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Al terzo angolo
          testo: |
            Al terzo angolo Marko si ferma davanti a una vetrina vuota e nel vetro
            scuro incontra i tuoi occhi. Si volta, ti sorride come ai mercanti di
            Laresh quando il prezzo non gli piace, e riprende a camminare verso la
            Pignatta, senza fretta. Domani mezza Segheria saprà che lo stavi
            seguendo.
          effetti: { sospetto: 1.5 }
      - testo: "Fingerti un creditore di Rennick con la portinaia della Segheria"
        descrizione: "Inventa un debito e presentati offeso, con una cifra abbastanza precisa da sembrare vera."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: L'unico posto dove li spende
          testo: |
            La portinaia, una donna larga con un'opinione su tutto, sbuffa prima
            che tu abbia finito la storia del debito. «Rennick con dei debiti?
            Quello conta i chiodi» dice. «Se ti deve dei soldi, chiedili alla
            Maison des Lunes, in Via dei Rasoi. È l'unico posto dove li spende,
            più spesso di quanto dovrebbe uno che si deve sposare.» Poi si morde
            la lingua e riprende a spazzare.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: La bugia non regge
          testo: |
            La storia non la convince. «Rennick non deve soldi a nessuno. È
            l'unico suo difetto che non sia un vizio» dice, e chiama per nome uno
            degli uomini al cancello. Te ne vai prima che arrivi, ma prima di sera
            la tua faccia ha fatto il giro della Segheria.
          effetti: { scandalo: 1 }
      - testo: "Chiedere agli spazzini dell'Orlo"
        descrizione: "All'Orlo dei Rottami si lavora fino a buio, e chi separa gli scarti vede passare tutti."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Facile }
        successo:
          titolo: Un uomo pettinato
          testo: |
            Uno degli spazzini sta legando un fascio di tubi, e mentre lo aiuti a
            stringere il nodo ti racconta che l'uomo pettinato della Segheria
            passa di qui ogni sera. Sale per Via dei Rasoi fino al cristallo
            spento e gira verso la casa con la luna sulla porta, e stasera è
            tornato indietro dopo pochi minuti senza entrare. «Sempre per di là»
            dice, indicando la salita con il mento.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Il peso della domanda
          testo: |
            Gli spazzini ti guardano come la merce che arriva dai Raschiatori, per
            capire quanto pesa. Uno ti chiede chi ti manda, e quando non rispondi
            torna a separare il ferro dal rame, mentre il capo della squadra ti
            segue con lo sguardo finché non esci dall'Orlo.
          effetti: { sospetto: 1 }
      - testo: "Pagare un ragazzino perché lo segua al posto tuo"
        descrizione: "I ragazzini dell'Orlo seguono chiunque per poche monete, e nessuno ci fa caso."
        requisiti: [monete >= 6]
        esito:
          titolo: Il ragazzino col berretto
          testo: |
            Il ragazzino ha un berretto troppo grande e sparisce dietro Marko prima che tu abbia finito di spiegargli cosa vuoi.
            Torna a lanterne accese e racconta tutto senza fermarsi. Marko è salito per Via dei Rasoi, ha tirato la catena di una
            casa con la luna incisa sulla porta e ha parlato con la portinaia senza entrare, e mentre scendeva al primo piano si
            è mossa una tenda.
          effetti: { monete: -6, pista.dama-argento: 1 }
      - testo: "Seguirlo tra i vicoli"
        descrizione: "Tieni la distanza e cambia spesso lato. Marko è vanitoso e si guarda nelle vetrine più che alle spalle."
        quando: [rep.maison >= 1]
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: La catena della porta davanti
          testo: |
            Lo segui su per Via dei Rasoi fino alla Maison des Lunes, dove Marko
            tira la catena dei clienti, che tu hai sentito suonare soltanto dalla
            cucina. Sulla soglia compare Sara Beck, e quando lui indica il primo
            piano lei scuote la testa, così Marko se ne va senza entrare. Una
            tenda del primo piano si richiude, e capisci che Rennick Dole è lì,
            sopra la cucina di Gretchen.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Al terzo angolo
          testo: |
            Al terzo angolo Marko si ferma davanti a una vetrina vuota e nel vetro
            scuro incontra i tuoi occhi. Si volta, ti sorride come ai mercanti di
            Laresh quando il prezzo non gli piace, e riprende a camminare verso la
            Pignatta, senza fretta. Domani mezza Segheria saprà che lo stavi
            seguendo.
          effetti: { sospetto: 1.5 }

  - id: luna-crescente
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: La lanterna accesa
    sommario: "Tre porte dopo il cristallo spento, sopra una porta con la luna incisa, la lanterna è accesa."
    luogo: Via dei Rasoi, angolo Via del Salmone
    area: citta-bassa
    requisiti: [pista.dama-argento == 4]
    testo: |
      Via dei Rasoi fa un gomito attorno a un vecchio cristallo conduttore
      spento. Tre porte dopo, all'angolo con Via del Salmone, c'è una casa di
      legno senza insegna, con una luna crescente incisa sulla porta e accanto
      una catena di bronzo con le parole *Ospiti Benvenuti*.

      Sopra la porta la lanterna è accesa. In Città Bassa tutti sanno, anche chi
      giura di non esserci mai stato, che quando la lanterna è accesa le ragazze
      ricevono e quando è spenta dentro è successo un guaio.

      {origine figlio-della-citta-bassa} La regola l'hai imparata da bambino,
      insieme a quella di non fermarti sotto le finestre a contare chi entra.

      {origine rampollo-dei-quartieri-alti} Nei salotti la Maison des Lunes si
      nomina solo per dire che bisognerebbe chiuderla, e di solito lo dice chi
      conosce il suono di questa catena.

      Se quello che hai scoperto è vero, Rennick Dole è lì dentro.
    opzioni:
      # Chi ha già lavorato alla Maison (rep.maison >= 1) trova Sara che lo conosce: variante subito sotto.
      - testo: "Tirare la catena"
        descrizione: "Oltre le tende suona un campanello, poi si sentono dei passi, e hai l'impressione che qualcuno ti stia contando."
        quando: [rep.maison < 1]
        esito:
          immagine: personaggi/sara-beck
          titolo: Le armi qui dentro
          testo: |
            La porta si apre dopo due secondi su una halfling con un fermaglio
            d'argento nei capelli, e dietro una tenda di velluto si sposta
            un'ombra larga il doppio di una persona. «Sono Sara Beck. La Maison
            non riceve chi non ha appuntamento» dice, poi ti guarda gli stivali
            impolverati. «Però forse sei tu l'appuntamento che qualcuno aspetta.»
            Ti indica l'armadio dietro il bancone curvo, dove si lasciano le armi.
          effetti: { pista.dama-argento: 1, rep.maison: 1, racconto: 1 }
      - testo: "Tirare la catena"
        descrizione: "Non hai mai tirato la catena dei clienti, perché di solito entri dal cortile di Via del Salmone."
        quando: [rep.maison >= 1]
        esito:
          immagine: personaggi/sara-beck
          titolo: Dalla porta davanti
          testo: |
            Dopo due secondi esatti la porta si apre, e Sara Beck ti guarda dal
            basso con la testa inclinata, come un nome scritto nella colonna
            sbagliata della lavagnetta. «Dalla porta davanti, e senza avvisare»
            dice, e smette di sorridere. «Però forse sei tu l'appuntamento che
            qualcuno aspetta.» Ti indica l'armadio dietro il bancone curvo. «Le armi
            qui dentro, anche le tue, perché stasera sei un cliente.»
          effetti: { pista.dama-argento: 1, rep.maison: 1, racconto: 1 }

  # ------------------------------------------------------------ carte
  - id: carta-borseggiatore
    titolo: Una mano leggera
    sommario: "Al mercato del mattino qualcuno ti urta nella calca, e poco dopo la tua borsa è più leggera."
    tipo: carta
    area: citta-bassa
    testo: |
      Il mercato del mattino ti trascina fra carretti di rape e gabbie di galline.
      Qualcuno ti spinge alla schiena e una mano si ritira un momento troppo in fretta, e
      un ragazzo magro con il cappello calcato sulla fronte scivola già fra due banchi,
      senza correre. La borsa è più leggera, e il ragazzo è ancora a portata di mano, ma
      fra poco non lo sarà più.

      {acrobazia Media} Fra te e lui ci sono un carretto di rape e una gabbia di galline.
      Il carretto si scavalca, la gabbia meglio di no.
    opzioni:
      - testo: "Afferrarlo prima che sparisca"
        descrizione: "Scatti e provi a prenderlo per il bavero. Se sbagli, avrai afferrato l'aria davanti a trenta testimoni."
        prova: { attributo: fisico, abilita: [acrobazia, rissa], difficolta: Facile }
        successo:
          titolo: Per il bavero
          testo: |
            Lo prendi per il bavero un attimo prima che sparisca. Ti restituisce
            le monete senza discutere e, dopo un'occhiata alla tua faccia, ne
            aggiunge qualcuna che non era tua. «Per dimenticarti di me» dice, e tu
            lo lasci andare.
          effetti: { monete: 3 }
        fallimento:
          titolo: Stoffa bagnata
          testo: |
            La mano si chiude su un lembo di stoffa che si strappa come carta
            bagnata, e il ragazzo è già sparito con una parte delle tue monete.
            Una donna, con grande gentilezza, ti consiglia di tenere la borsa
            davanti come fanno tutti.
          effetti: { monete: -4 }
      - testo: "Inseguirlo fino in fondo al vicolo"
        descrizione: "Lui conosce le strade meglio di te, ma a volte basta la rabbia."
        combattimento: borseggio
        vittoria:
          titolo: Vicolo cieco
          testo: |
            Il vicolo finisce contro un muro di pietra blu che il ragazzo sperava
            di non trovare. Prova a difendersi con un coltellino da frutta, e
            quando glielo togli si mette a piangere. Dopo che se n'è andato
            zoppicando ti resta in mano un sacchetto unto con le tue monete e
            quelle di mezza piazza, che nessuno verrà a reclamare.
          effetti: { monete: 6 }
        sconfitta:
          titolo: Meno sprovveduto
          testo: |
            Il vicolo lo conosceva meglio di te. Una gomitata e un calcio dove non
            si dovrebbe, e lui è già sul tetto di una stalla, da dove ti fa un
            piccolo inchino mentre ti rialzi con le ginocchia sbucciate e la borsa
            ancora più leggera.
          effetti: { monete: -4 }

      - testo: "Chiamarlo con il fischio dei vicoli"
        descrizione: "Quel passo senza fretta l'hai imparato anche tu, e nei vicoli c'è un fischio che i ragazzi rispettano."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il fischio
          testo: |
            Fischi le due note che nel tuo vicolo volevano dire che uno era della
            casa, e il ragazzo si ferma fra due banchi, poi torna indietro con le
            mani in tasca. Ti rende la borsa con dentro uno spicciolo suo. Ti
            chiede chi te l'ha insegnato, e quando gli dici il nome del tuo
            vecchio capobanda fischia anche lui, piano, prima di sparire nella
            calca.
          effetti: { monete: 2 }

  - id: carta-lanterna
    immagine: ambientazione/ponte-dei-morti
    titolo: Una lanterna che si accende da sola
    sommario: "Sul Ponte dei Morti una lanterna spenta da anni si è riaccesa da sola, e la sua luce pulsa."
    tipo: carta
    area: citta-bassa
    requisiti: [visto.carta-lanterna == 0]
    testo: |
      Dal margine della Città Bassa si vede il Ponte dei Morti, dove i
      Raschiatori appendono una lanterna per ogni compagno disperso nel
      Labirinto.

      Stanotte si è riaccesa da sola una lanterna spenta da anni, che i
      Raschiatori più giovani non sanno di chi fosse, e mentre le altre
      oscillano col vento questa pulsa.

      {magia Media} Il cristallo dentro è esaurito da anni, e il Mana che la
      fa pulsare le arriva da fuori.

      {origine apprendista-raschiatore} Conti i piloni per capire di chi
      fosse, ma era già spenta al tuo primo turno.
    opzioni:
      - testo: "Restare a guardarla finché si spegne"
        descrizione: "Passi la notte all'aperto con gli occhi sulla lanterna. Domani in città qualcuno vorrà sapere cosa hai visto."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Come un cuore
          testo: |
            La guardi per ore, finché ti fa male il collo, contando i battiti.
            All'inizio la lanterna pulsa sessanta o settanta volte al minuto, poi
            sempre più piano, e all'alba si spegne senza che nessuno sul ponte
            l'abbia toccata. In città c'è chi pagherebbe per sapere quante volte
            ha battuto, e il numero ti resta in testa come una filastrocca.
          effetti: { informazioni.pettegolezzo: 1 }
          imposta: { visto.carta-lanterna: 1 }
        fallimento:
          titolo: Dietro le palpebre
          testo: |
            Verso la terza ora ti viene in mente che la lanterna pulsi solo quando
            la guardi, e non riesci più a togliertelo di testa. Rientri e chiudi
            le imposte, ma ogni volta che chiudi gli occhi la vedi pulsare dietro
            le palpebre.
          effetti: { tormento: 1 }
          imposta: { visto.carta-lanterna: 1 }

  - id: carta-favore-scuri
    immagine: personaggi/rozalia-marga
    titolo: Un favore per gli Scuri
    sommario: "Rozalia Marga ha un pacco da far arrivare alla Pignatta, e non vuole domande."
    tipo: carta
    area: citta-bassa
    # Dopo pista.pelle 6 la Pignatta è bruciata e gli Scuri non esistono più come rete.
    requisiti: [rep.scuri >= 1, pista.pelle < 6, fazione.scuri == 0]
    testo: |
      Rozalia Marga ti si affianca all'angolo senza che tu la veda arrivare, il
      che è notevole per una donna con una piuma d'oca dietro l'orecchio. Ha le
      dita macchiate d'inchiostro, e alla Pignatta dicono che nel suo
      retrobottega ci sia l'archivio di firme più ordinato della città, notai
      compresi.

      «Ho un pacco da portare dal Mercato delle Ombre alla Pignatta» dice,
      guardando la strada invece di te. «Senza domande, e senza passare davanti
      alle guardie. Hai una faccia che nessuno ha ancora imparato a
      riconoscere, ed è un pregio che dura poco.»
    opzioni:
      - testo: "Portare il pacco"
        descrizione: "Devi solo consegnare il pacco. Il difficile è non chiederti che cosa contiene."
        esito:
          titolo: Tintinna
          testo: |
            Il pacco è avvolto in tela cerata e quando cammini tintinna con un
            suono piccolo e vetroso, che ti fa rallentare senza averlo deciso. Sul
            ponte una guardia della Caserma ti guarda un attimo più del
            necessario, e tu guardi il fiume con un interesse nuovo per i pesci.
            Alla porta sul retro della Pignatta una mano prende il pacco e ti
            lascia una borsa leggera che nessuno conta.
          effetti: { monete: 6, rep.scuri: 1, rep.caserma: -1, sospetto: 1 }
      - testo: "Rifiutare, guardandola in faccia"
        descrizione: "Le dici di no guardandola negli occhi, perché con gli Scuri anche un rifiuto ha un prezzo."
        esito:
          titolo: Peccato
          testo: |
            Rozalia ti ascolta fino in fondo, come se stesse copiando la tua voce
            per usarla più tardi. «Peccato» dice, sistemandosi la piuma dietro
            l'orecchio. Per tutto il giorno hai la sensazione di aver firmato
            qualcosa senza leggerlo.
          effetti: { rep.scuri: -1 }

  - id: carta-bollettino
    immagine: ambientazione/marea-grigia
    titolo: Il bollettino delle sacche
    sommario: "Il Velo ha affisso i bollettini delle sacche di Marea, e su uno una riga è coperta a carboncino."
    tipo: carta
    area: citta-bassa
    requisiti: [visto.carta-bollettino == 0]
    testo: |
      Ogni autunno, dopo le piogge, la Confraternita del Velo affigge alle
      porte delle cappelle i bollettini delle sacche di Marea Grigia risalite
      in superficie, con il luogo, la data e, quando si può, la profondità.
      Quest'anno la lista è più lunga, e la gente la legge muovendo le labbra
      in cerca della propria strada.

      A metà della lista una riga è stata coperta a carboncino con mano
      ferma, ma di sbieco si vede ancora l'inchiostro sotto il nero.

      {origine accolito-del-velo} Questi bollettini li hai visti scrivere in
      Cattedrale, dai cronisti chini sui tavoli lunghi.
    opzioni:
      - testo: "Ricostruire la riga cancellata"
        descrizione: "Con la luce radente e un po' di pazienza si possono leggere i solchi lasciati dalla penna."
        prova: { attributo: mentale, abilita: [accademiche, natura], difficolta: Facile }
        successo:
          titolo: Una sacca sotto l'Orlo
          testo: |
            Ti ci vuole mezz'ora di lavoro con l'unghia, alla luce di una lanterna
            tenuta di sbieco, perché sotto il carboncino è rimasto il solco della
            penna. La riga parla di una sacca sotto l'Orlo dei Rottami, senza
            profondità, segnalata la settimana scorsa. Qualcuno ha voluto
            nasconderla, e se ne parli nei posti giusti presto la conosceranno
            anche altri.
          effetti: { informazioni.voce: 2 }
          imposta: { visto.carta-bollettino: 1 }
        fallimento:
          titolo: Il carboncino
          testo: |
            Guardi e riguardi, inclinando la testa finché ti fa male il collo, ma
            chi ha usato quel carboncino sapeva il fatto suo, e ti restano solo le
            dita nere.
          effetti: { tormento: 0.5 }
          imposta: { visto.carta-bollettino: 1 }

  # ------------------------------------------------------------ magia

  - id: rimarginare-da-se
    titolo: Una preghiera sulle ferite
    area: citta-bassa
    ripetibile: true
    immagine: fazioni/confraternita-del-velo
    requisiti: [incantesimo.rimarginare >= 1, ferite >= 0.5]
    sommario: "Le mani sulla ferita e la preghiera dei guaritori della Cattedrale."
    testo: |
      Trovi un angolo tranquillo, ti togli la benda e appoggi le mani sulla
      ferita, che sotto i palmi pulsa calda. La preghiera dei guaritori è
      lunga, e va detta tutta senza fermarsi.

      {resilienza Facile} A metà ti verrà voglia di sbirciare se funziona, e
      la preghiera si rompe proprio in quel punto.
    opzioni:
      - testo: "Recitare Rimarginare"
        incantesimo: rimarginare
        descrizione: "Se la preghiera riesce, la ferita si chiude di mezza tacca."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Una riga rosa
          testo: "Sotto le mani la pelle si scalda e la ferita si chiude, lasciando una riga rosa."
          effetti: { ferite: -0.5 }
        fallimento:
          titolo: Parole senza peso
          testo: "Arrivi alla fine della preghiera, ma la ferita resta com'era."
          effetti: {}
  - id: locanda-di-ilka
    titolo: La Locanda di Ilka
    luogo: Locanda di Ilka
    area: citta-bassa
    ripetibile: true
    immagine: ambientazione/locanda-di-ilka
    sommario: "Sidro, patate speziate e, dopo la chiusura, lezioni di magia al tavolo di cucina."
    testo: |
      La Locanda di Ilka è un vecchio edificio a un piano dipinto con i
      motivi dei carri olvari. Ilka Dravec siede vicino al fuoco con gli
      occhi lattiginosi rivolti alla porta, e saluta per nome chi entra,
      azzeccandoci due volte su tre.

      Dietro il banco sua figlia Besk serve sidro e patate speziate. Studia
      magia all'Accademia di Torvessa con Orvald Temmerin, e la sera apre i
      suoi quaderni sul tavolo di cucina, che ha il bordo pieno di
      bruciature.

      {origine allievo-di-torvessa} Besk la conosci dai corridoi
      dell'Accademia, e qui ti saluta con un cenno da collega.
    opzioni:
      - testo: "Una seduta di studio con Besk"
        immagine: personaggi/besk-dravec
        descrizione: "Besk ti mostra come si tiene un cristallo e come si respira mentre lo si ascolta."
        prova: { attributo: mentale, abilita: magia, difficolta: Molto facile }
        successo:
          titolo: Un filo di luce
          testo: |
            Per un momento il cristallo sul tavolo si scalda sotto le tue dita
            e una luce azzurra gli attraversa le venature. Besk annota
            qualcosa sul quaderno mordicchiando la matita e ti dice di tornare.
            Le dita ti formicolano fino a casa.
          effetti: {}
        fallimento:
          titolo: Un sasso sul tavolo
          testo: |
            Il cristallo resta freddo per tutta la sera. Besk giura che le
            prime volte succede a tutti e ti versa un sidro, che almeno quello
            ti scalda.
          effetti: {}

      - testo: "Chiedere a Besk la sua prima formula"
        immagine: personaggi/besk-dravec
        requisiti: [magia >= 1, incantesimo.luce-fredda == 0, monete >= 15]
        costo: 2
        descrizione: "Besk insegna la Luce fredda a chi ha già sentito il cristallo rispondere. Chiede il prezzo dei suoi quaderni."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Luce fredda
          testo: |
            Besk ti fa ripetere la formula finché non la dici senza guardare il
            quaderno. Alla fine il cristallo si accende di una luce bianca che
            non scalda e non fa ombra. Ilka, dal suo angolo, dice che la
            stanza è diventata più fredda.
          effetti: { monete: -15, incantesimo.luce-fredda: 1 }
        fallimento:
          titolo: Domani
          testo: |
            La formula ti si confonde in bocca al terzo verso. Besk chiude il
            quaderno e ti dice di tornare domani, senza farti pagare.
          effetti: {}

      - testo: "Farsi insegnare il Dardo"
        immagine: personaggi/besk-dravec
        requisiti: [magia >= 1, incantesimo.luce-fredda >= 1, incantesimo.dardo == 0, monete >= 25]
        costo: 2
        descrizione: "Il primo incantesimo da combattimento di Orvald, che Besk insegna a prezzo da amico nel cortile sul retro."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Il segno sul muro
          testo: |
            Nel cortile, Besk ha disegnato un cerchio col gesso su un muro
            vecchio. Al decimo tentativo il tuo dardo lascia nel cerchio un
            segno nero che fuma ancora. Besk ti dice di non usarlo mai nella
            locanda, e dal tono si capisce che è già successo.
          effetti: { monete: -25, incantesimo.dardo: 1 }
        fallimento:
          titolo: Il muro è ancora lì
          testo: |
            Il cristallo scalda e poi non fa niente. Ci provate fino a
            mezzanotte, poi Besk chiude il quaderno e va a dormire. Sulla porta
            ti dice, sbadigliando, che il muro resta lì anche domani.
          effetti: {}

      - testo: "Ascoltare le storie di Ilka"
        immagine: personaggi/ilka-dravec
        descrizione: "Ilka racconta i miti di Qir-Azel a chi si siede vicino al fuoco. A volte li confonde."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Facile }
        successo:
          titolo: La Vecchia Luce
          testo: |
            Ilka racconta del falò attorno a cui si fermarono i primi carri, dove
            oggi sorge la città, e di una luce che veniva dalla terra prima che
            qualcuno la chiamasse Mana. A metà dice che forse sta confondendo due
            storie, ma una delle due parla della Cicatrice in un modo che non hai
            mai sentito.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Il sonno di Ilka
          testo: |
            Ilka si addormenta a metà del racconto. Besk le mette una coperta
            sulle gambe e ti fa segno di parlare piano.
          effetti: {}

  - id: carta-cane-del-ricettatore
    titolo: Il cane del ricettatore
    tipo: carta
    area: citta-bassa
    immagine: ambientazione/orlo-dei-rottami
    sommario: "Un magazzino sprangato e un mastino alla catena che non ha ancora deciso cosa fare di te."
    requisiti: [visto.carta-cane-del-ricettatore == 0]
    testo: |
      Dietro la Conceria c'è il magazzino di un ricettatore che dopo la
      razzia non si è più visto. La porta è sprangata, ma dalla finestra
      aperta sul retro si vedono casse con il marchio della Gilda.

      Nel cortile, chiuso da un muro alto un uomo e mezzo, un mastino a pelo
      corto legato a una catena lunga ti guarda senza abbaiare e senza
      muoversi, con il collare teso. La catena, ti accorgi, arriva fino alla
      finestra.

      {origine figlio-del-circolo} Al Circolo ti hanno insegnato ad
      ascoltare una bestia prima di guardarla, e questo è un cane lasciato
      solo da giorni.
    opzioni:
      - testo: "Parlargli con il Richiamo"
        incantesimo: richiamo
        descrizione: "Nella lingua che il Circolo insegna ai bambini, gli spieghi che non sei un ladro. Almeno non oggi."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Un amico per un'ora
          testo: |
            Il mastino abbassa le orecchie e si sdraia. Mentre passi ti annusa
            a lungo la mano e ti lascia entrare con uno sbuffo. Nelle casse ci
            sono schegge precuriane e un registro con nomi che qualcuno
            pagherebbe per leggere.
          effetti: { reliquie.scheggia: 1, oggetto.registro-del-ricettatore: 1 }
          imposta: { visto.carta-cane-del-ricettatore: 1 }
        fallimento:
          titolo: Denti
          testo: |
            Il cane ascolta con la testa inclinata, poi ti salta addosso. Riesci
            a scavalcare il muro con un morso sulla gamba.
          effetti: { ferite: 0.5 }

      - testo: "Affrontarlo"
        combattimento: cane-del-ricettatore
        descrizione: "È grosso, ma è solo un cane."
        vittoria:
          titolo: Il magazzino
          testo: |
            Il mastino scappa guaendo in fondo al cortile. Dentro trovi schegge
            precuriane e un registro con nomi che qualcuno pagherebbe per
            leggere.
          effetti: { reliquie.scheggia: 1, oggetto.registro-del-ricettatore: 1 }
          imposta: { visto.carta-cane-del-ricettatore: 1 }
        sconfitta:
          titolo: Ritirata
          testo: |
            Scavalchi il muro con il cane attaccato alla manica e ti lasci
            dietro metà della giacca, che il mastino si tiene come trofeo.
          effetti: {}

      - testo: "Lasciar perdere"
        costo: 0
        esito:
          testo: "Il mastino ti segue con lo sguardo finché non giri l'angolo."

  # ------------------------------------------------------------ oggetti: reliquie in vendita
  - id: dietro-il-banco-di-irsa
    presso: armeria-di-irsa
    titolo: Dietro il banco di Irsa
    luogo: Armeria di Irsa
    area: citta-bassa
    ripetibile: true
    immagine: personaggi/irsa-valbrun
    sommario: "Le armi migliori Irsa non le espone. Le tiene dietro il banco e le vende a chi sa rispondere."
    testo: |
      Irsa Valbrun non ha una forgia e lavora sui pezzi che le fornisce Bram
      Halgast. I lavori migliori li tiene avvolti nel feltro dietro il banco,
      e prima di farteli vedere ti guarda le mani e come stai in piedi.

      {origine mercante-dei-ponti} Irsa la conosci dalla Casa dei Nodi, dove
      siede nel consiglio interno della Gilda con lo stesso grembiule.

      Sul banco appoggia un arco composito, una balestra con il calcio
      d'avorio e i coltelli da lancio. Su un manichino al centro della
      bottega c'è una cotta di maglia con le spalle a ventaglio.
    opzioni:
      - testo: "L'arco composito: «Mira»"
        costo: 0
        immagine: reliquie/arco-lungo-composito
        requisiti: [oggetto.arco-lungo-composito-mira == 0, oggetto.arco-lungo-composito-forza == 0, monete >= 1600]
        descrizione: "Irsa vende l'arco solo a chi risponde alla sua domanda: «Mira o forza?». Tu rispondi mira."
        esito:
          titolo: Mira
          testo: |
            Irsa gira le ghiere di un quarto di giro e prova la corda con il
            pollice. «Per chi vuole passare le armature» dice, e te lo
            consegna.
          effetti: { monete: -1600, oggetto.arco-lungo-composito-mira: 1 }
      - testo: "L'arco composito: «Forza»"
        costo: 0
        immagine: reliquie/arco-lungo-composito
        requisiti: [oggetto.arco-lungo-composito-mira == 0, oggetto.arco-lungo-composito-forza == 0, monete >= 1600]
        descrizione: "Irsa vende l'arco solo a chi risponde alla sua domanda: «Mira o forza?». Tu rispondi forza."
        esito:
          titolo: Forza
          testo: |
            Irsa stringe le ghiere fino in fondo e l'arco scricchiola. «Per chi
            vuole che la freccia arrivi e resti» dice, e te lo consegna.
          effetti: { monete: -1600, oggetto.arco-lungo-composito-forza: 1 }
      - testo: "La balestra Vansaya"
        costo: 0
        immagine: reliquie/balestra-vansaya
        requisiti: [oggetto.balestra-vansaya == 0, monete >= 2600]
        descrizione: "Caricatore a leva da sei dardi, venduta da un avventuriero diretto alle Rovine dei Precursori e mai tornato."
        esito:
          titolo: Vansaya
          testo: |
            Irsa ti mostra come si arma la leva e come si sblocca il caricatore
            quando si inceppa. Sul nome inciso nel calcio non sa dirti niente.
            «Il ragazzo che me l'ha venduta diceva che non smette di aspettare.»
          effetti: { monete: -2600, oggetto.balestra-vansaya: 1 }
      - testo: "I coltelli da lancio"
        costo: 0
        immagine: icone/thrown-daggers
        requisiti: [oggetto.asce-da-lancio == 0, monete >= 1400]
        descrizione: "Tre coltelli gemelli. Irsa li vende solo tutti insieme."
        esito:
          titolo: Tre coltelli
          testo: |
            Irsa te li infila nella cintura e ti fa lanciare il primo contro il
            ceppo in fondo alla bottega. Dopo il lancio ti ritrovi il coltello
            in mano senza sapere come, e Irsa sorride per la prima volta.
          effetti: { monete: -1400, oggetto.asce-da-lancio: 1 }
      - testo: "La cotta di maglia di Irsa"
        costo: 0
        immagine: reliquie/cotta-di-maglia-irsa
        requisiti: [oggetto.cotta-di-maglia-di-irsa == 0, monete >= 1800]
        descrizione: "Anelli e cuoio sottile, spalle a ventaglio. Regge i colpi meglio di ogni altra cotta, ma pesa la sera."
        esito:
          titolo: Il manichino è vuoto
          testo: |
            Irsa ti aiuta a infilarla e stringe le cinghie sui fianchi.
            «Ti stancherà di più la sera» dice. «Ma ci arriverai, alla sera.»
          effetti: { monete: -1800, oggetto.cotta-di-maglia-di-irsa: 1 }
      - testo: "Il giaco di maglia"
        costo: 0
        immagine: reliquie/giaco-di-maglia-irsa
        requisiti: [oggetto.giaco-di-maglia-di-irsa == 0, monete >= 2100]
        descrizione: "Maglia fitta con il zig-zag di anelli di bronzo, che attutisce il rumore della maglia."
        esito:
          titolo: Il bronzo
          testo: |
            Fai qualche passo nella bottega. La maglia non tintinna e Irsa
            annuisce. Ti fa vedere il nodo a sei passi degli anelli di bronzo,
            che serve a riconoscere i falsi.
          effetti: { monete: -2100, oggetto.giaco-di-maglia-di-irsa: 1 }
      - testo: "Ordinare il cuoio borchiato"
        costo: 0
        immagine: reliquie/armatura-cuoio-borchiato
        requisiti: [oggetto.cuoio-borchiato-di-irsa == 0, attesa.cuoio-borchiato == 0, monete >= 1500]
        vende: cuoio-borchiato-di-irsa
        descrizione: "L'armatura personale di Irsa. Prima di venderla deve adattarla sul tuo corpo, e ci vuole tempo."
        esito:
          titolo: Le misure
          testo: |
            Irsa ti prende le misure con una cordicella annodata e segna tutto
            su un foglio. «Torna quando vuoi. Prima di domani non sarà pronta.»
          effetti: { monete: -1500, attesa.cuoio-borchiato: 1 }
      - testo: "Ritirare il cuoio borchiato"
        costo: 0
        immagine: reliquie/armatura-cuoio-borchiato
        requisiti: [attesa.cuoio-borchiato >= 1]
        descrizione: "Irsa ha finito di adattare l'armatura."
        esito:
          titolo: Su misura
          testo: |
            L'armatura ti calza come se l'avessi sempre portata. La spirale di
            filo cremisi sul petto ha cinque rune, e Irsa te le fa toccare una
            per una prima di lasciarti andare.
          effetti: { attesa.cuoio-borchiato: -1, oggetto.cuoio-borchiato-di-irsa: 1 }

  - id: la-fucina-dei-due-mastini
    presso: fucina-dei-due-mastini
    titolo: La Fucina dei Due Mastini
    luogo: Fucina dei Due Mastini
    area: citta-bassa
    ripetibile: true
    immagine: ambientazione/fucina-dei-due-mastini
    sommario: "Bram Halgast tiene tre pezzi appesi alla parete, e non sono in vendita per chiunque."
    testo: |
      La Fucina dei Due Mastini è calda anche d'inverno. Bram Halgast lavora
      a torso nudo con due cani sdraiati vicino all'incudine, che non alzano
      la testa nemmeno quando il martello cade vicino.

      Sulla parete di fondo sono appesi uno spadone dalla lama scura, un
      martello con il marchio delle incudini e una corazza di piastre
      rifatta più volte. Bram dice che sono in vendita, ma ti guarda come se
      volesse sapere a cosa ti servono.

      {armi-da-mischia Media} Lo spadone ha la guardia ammaccata da colpi
      veri, rimessa in sesto senza cancellare i segni.
    opzioni:
      - testo: "Il Re della Collina"
        costo: 0
        immagine: reliquie/spadone-re-della-collina
        requisiti: [oggetto.re-della-collina == 0, monete >= 1700]
        descrizione: "Uno spadone che colpisce più forte quando sei ferito."
        esito:
          titolo: Un round in più
          testo: |
            Bram lo stacca dalla parete e te lo porge dall'elsa. Ti racconta del
            mercenario che con quella spada è rimasto in piedi un round più del
            dovuto, e del nome che gli hanno dato i clienti dopo.
          effetti: { monete: -1700, oggetto.re-della-collina: 1 }
      - testo: "Il martello dei Due Mastini"
        costo: 0
        immagine: reliquie/martello-due-mastini
        requisiti: [oggetto.martello-dei-due-mastini == 0, monete >= 2100]
        descrizione: "Un vecchio martello da fucina riforgiato per la guerra. Sfonda porte e gusci."
        esito:
          titolo: Il marchio delle incudini
          testo: |
            Bram lo soppesa un'ultima volta prima di dartelo. «Era il martello di
            mio padre» dice. «Tienilo lontano dalle incudini, non gli piace
            tornare indietro.»
          effetti: { monete: -2100, oggetto.martello-dei-due-mastini: 1 }
      - testo: "La corazza ostinata"
        costo: 0
        immagine: reliquie/corazza-ostinata
        requisiti: [oggetto.corazza-ostinata == 0, monete >= 2300]
        descrizione: "Piastre rifatte tre volte. Ti tiene in piedi quando dovresti cadere, e la sera te lo fa pagare."
        esito:
          titolo: Rifatta tre volte
          testo: |
            Bram ti aiuta a indossarla e ti fa vedere i punti in cui è stata
            rifatta, toccandoli uno per uno con il dito sporco di fuliggine. Il pettorale era di un cliente morto, le spalliere di un
            Raschiatore tornato vivo dal Labirinto.
          effetti: { monete: -2300, oggetto.corazza-ostinata: 1 }

  - id: carta-guscio-che-ronza
    titolo: Un guscio che ronza
    tipo: carta
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.iniettore == 0]
    sommario: "Qualcosa fra i rottami emette un ronzio che non viene da nessuna macchina della città."
    testo: |
      All'Orlo dei Rottami un gruppo di ragazzi si è radunato attorno a un
      guscio di metallo grande come un pugno, mezzo sepolto nella terra, che
      ronza mentre una luce azzurra gli passa sotto la superficie. Il più
      piccolo ha un bastone in mano e sta decidendo se colpirlo. I
      Raschiatori dicono che le cose dei Precursori vanno lasciate dove
      sono, e i ricettatori che vanno vendute subito.

      {origine apprendista-raschiatore} La regola la sai anche tu, e intanto
      le mani sono già in tasca a cercare i guanti da lavoro che non ti sei
      portato.
    opzioni:
      - testo: "Comprarlo dai ragazzi"
        requisiti: [monete >= 5]
        descrizione: "Basta qualche spicciolo e i ragazzi se ne vanno contenti."
        esito:
          titolo: Il guscio
          testo: |
            I ragazzi prendono le monete e scappano prima che tu cambi idea.
            Il guscio si apre fra le tue mani come un frutto maturo. Dentro c'è
            un cilindro lungo come un dito, con un ago che esce e rientra.
          effetti: { monete: -5, oggetto.iniettore: 1 }
      - testo: "Mandarli via e prenderlo"
        prova: { attributo: sociale, abilita: [intimidire, conoscenze-della-strada], difficolta: Facile }
        descrizione: "Sono ragazzi, e non hanno voglia di discutere con un adulto."
        successo:
          titolo: Il guscio
          testo: |
            I ragazzi se ne vanno borbottando. Il guscio si apre fra le tue mani
            come un frutto maturo. Dentro c'è un cilindro lungo come un dito,
            con un ago che esce e rientra.
          effetti: { oggetto.iniettore: 1 }
        fallimento:
          titolo: Il bastone
          testo: |
            Il ragazzo col bastone colpisce il guscio prima che tu arrivi. Il
            ronzio si ferma con uno schiocco che ti senti nei denti, e i pezzi
            finiscono nelle tasche di tutti tranne che nelle tue.
          effetti: { sospetto: 0.5 }
      - testo: "Lasciarlo dove sta"
        costo: 0
        esito:
          testo: "Te ne vai, e dopo qualche passo senti il colpo del bastone e poi più niente."
