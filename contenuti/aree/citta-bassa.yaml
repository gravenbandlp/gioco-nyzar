aree:
  - id: citta-bassa
    immagine: ambientazione/citta-bassa
    nome: Città Bassa
    testo: |
      La Città Bassa sta a est, su un altopiano di roccia che al tramonto
      diventa blu come un livido. Dalle fenditure del terreno sale un calore
      che non viene da nessun sole: d'inverno i cani ci dormono sopra, d'estate
      nessuno ci passa scalzo. Case basse di pietra grezza, rattoppate con
      lamiera e con quello che i Raschiatori non sono riusciti a vendere. Il
      fumo delle fucine non si alza mai del tutto. Resta a mezz'aria,
      all'altezza dei tetti, come un pensiero che nessuno ha il coraggio di
      finire.

      Quaggiù il martello batte sempre. Se smette di battere, è perché
      qualcuno è morto.

      Tre giorni fa, al Festival delle Foglie Alate, gli orchi sono scesi sulla
      città. Ne parlano tutti e nessuno a voce alta. Nelle osterie si contano
      i morti, nelle botteghe i danni, alla Pignatta Grassa le scommesse su chi
      sarà il prossimo. A ovest, sopra la Cicatrice, i Ponti Sospesi tremano
      nel vento. Più su ancora suonano le campane dei Quartieri Alti, dove si
      decide cosa resterà scritto di questi giorni e cosa no.

      Tu sei qui. Il lavoro non manca. Le domande nemmeno.
    negozi: [banco-di-grusk, armeria-di-irsa]

storylet:
  # ------------------------------------------------------------ azioni ripetibili
  - id: turno-acciaieria
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Un turno all'Acciaieria
    sommario: "La colata è azzurra, il capoturno ha fretta, e a qualcuno servono braccia che non tremino."
    luogo: Acciaieria dei Tarvelin
    area: citta-bassa
    ripetibile: true
    testo: |
      All'Acciaieria il turno di notte comincia quando la colata diventa
      azzurra. Gli operai portano maschere di cuoio e vetro affumicato, e sotto
      le maschere non parla nessuno: il lyssan, dicono, ascolta. Non si forgia,
      si convince, e chi lo tratta male se lo vede virare di colore nello
      stampo, un grigio da annegato che non vale più niente.

      Tu non tocchi il lyssan. Tu spingi quello che il lyssan si lascia dietro:
      carrelli di scoria ancora calda, su rotaie che qualcuno ha posato storte
      vent'anni fa. Il capoturno ti guarda le mani prima della faccia. Gli
      servono braccia che non tremino. Le tue, per stanotte, possono andare.
    opzioni:
      - testo: "Spingere i carrelli di scoria fino all'alba"
        descrizione: "Non è un lavoro che chieda talento. Chiede spalle, e la volontà di non guardare la colata troppo a lungo."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Spalle in fiamme
          testo: |
            All'alba la sirena del cambio fischia come un animale ferito. Hai
            le spalle in fiamme, le ciglia bruciacchiate e in bocca un sapore di
            ferro che non è sangue, non del tutto.

            Il capoturno ti conta quattro monete nel palmo, una alla volta,
            guardandoti negli occhi a ogni moneta, come se volesse essere sicuro
            che te le ricorderai. Fuori, la Città Bassa ricomincia a battere.
          effetti: { monete: 4 }
        fallimento:
          titolo: Uno schizzo azzurro
          testo: |
            Un carrello s'impunta sulla rotaia storta. Spingi, spingi ancora, e
            il carico si rovescia a metà strada. Uno schizzo di colata ti bacia
            l'avambraccio: un attimo, un sibilo, un odore di carne arrosto che
            prima ti mette fame e poi ribrezzo.

            Il capoturno ti paga lo stesso. Un po' meno. «La scoria per terra
            non la paghiamo.» Poi ti fascia il braccio con uno straccio pulito,
            che a quest'ora e da quest'uomo è quasi tenerezza.
          effetti: { monete: 2, ferite: 0.5 }

  - id: orecchie-pignatta
    immagine: ambientazione/pignatta-grassa
    titolo: Orecchie aperte alla Pignatta Grassa
    sommario: "Qui le notizie arrivano prima dei banditori. Basta offrire da bere, e sapere quando stare zitti."
    luogo: Pignatta Grassa
    area: citta-bassa
    ripetibile: true
    testo: |
      La Pignatta Grassa è la taverna che lo sceriffo sconsiglia ai forestieri,
      ed è per questo che è sempre piena. Il fumo è così denso che le lanterne
      sembrano annegate. Al tavolo verde un mezzelfo magro mescola le carte con
      mani curatissime e perde, ogni tanto, con grande sfortuna.

      Dietro il bancone, Mauro Scrocco: abiti color zafferano, una pancia che
      entra nella stanza prima di lui. Abbraccia chiunque arrivi per la prima
      volta e si ricorda di chiunque arrivi la seconda. Il sidro è torbido, le
      voci no. Qui le notizie arrivano prima dei banditori, e spesso sono
      meglio informate. Basta offrire da bere, e sapere quando stare zitti.
    opzioni:
      - testo: "Offrire da bere e ascoltare"
        descrizione: "Un giro per il tavolo più chiacchierone, e nessuna domanda. Le domande, qui, si pagano a parte."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Cose che non dovevi sentire
          testo: |
            Due carovanieri, un conciatore e una donna che non dice il suo
            mestiere. Parlano della razzia, poi di chi ci ha guadagnato, poi
            abbassano la voce e parlano di chi, da quella sera, non si è più
            fatto vedere. Tu fissi il sidro e conti le bolle.

            Quando te ne vai hai due storie che non dovevi sentire. Le metti via
            con cura, come si mettono via i coltelli.
          effetti: { informazioni.voce: 2 }
        fallimento:
          titolo: Il prezzo della farina
          testo: |
            Paghi il giro. In cambio ricevi un'ora di lamentele sul prezzo della
            farina, sui mulini che bruciano sempre dalla parte sbagliata della
            città, sulla suocera di qualcuno.

            Mauro passa dietro di te e ti batte una mano sulla spalla, forte.
            «Si parla di tutto, qui. Si dice nulla.» Suona come una
            consolazione. Non lo è.
          effetti: { monete: -1 }

  - id: orlo-rottami
    immagine: ambientazione/orlo-dei-rottami
    titolo: Frugare all'Orlo dei Rottami
    sommario: "Quello che i Raschiatori buttano via, qualcun altro lo raccoglie. Meglio arrivare prima di Grusk."
    luogo: Orlo dei Rottami
    area: citta-bassa
    ripetibile: true
    testo: |
      L'Orlo dei Rottami è una lingua di terra battuta sotto il margine ovest
      della Città Bassa, fra l'ultima fila di baracche e il bordo della
      Cicatrice. Qui i Raschiatori scaricano a peso tutto ciò che non sono
      riusciti a vendere: pezzi precuriani sfregiati, cristalli sterili, casse
      di carichi falliti che nessuno reclama.

      Una decina di spazzini autorizzati dalla Gilda separa, etichetta,
      rivende. Il più rumoroso ha una carriola rossa, tatuaggi fin sulle
      palpebre, e canta. Il vento che sale dalla voragine sa di ozono. Se arrivi
      prima degli spazzini, qualcosa si trova. Se arrivi dopo, trovi Grusk.
    opzioni:
      - testo: "Setacciare i cumuli prima degli spazzini"
        descrizione: "Occhi aperti e mani nude. All'Orlo quello che conta è capire, prima degli altri, cosa è ancora vivo."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Qualcosa pulsa ancora
          testo: |
            Sotto una lamiera annerita, in un nido di cavi che sembrano radici,
            qualcosa pulsa. Debole, irregolare, come un cuore che non si è
            accorto di essere morto: una scheggia di metallo precuriano, incisa
            con segni che l'occhio non riesce a tenere fermi. Accanto, due
            frammenti di cristallo esausti, opachi come denti vecchi. Qualcuno
            li compra.

            Avvolgi tutto in uno straccio. Da qualche parte sulla riva, una
            carriola rossa cigola verso di te. È ora di andare.
          effetti: { cristalli.frammento-esausto: 2, reliquie.scheggia: 1 }
        fallimento:
          titolo: Sapore di metallo
          testo: |
            Scavi a mani nude in un mucchio che sa di ferro e di ozono. Per ore
            non trovi niente che valga la fatica di piegarsi.

            Quando ti rialzi, il cielo sopra la Cicatrice ha un colore che non
            ti piace, e sotto la lingua hai un sapore di moneta. Te lo porterai
            dietro fino a sera. Chi sa, alla Cripta, dice che è così che
            comincia.
          effetti: { contaminazione: 0.5 }

  - id: rissa-pignatta
    immagine: personaggi/mauro-scrocco
    titolo: Una scommessa dietro la Pignatta
    sommario: "Un cerchio di gesso, una dozzina di scommettitori, e un tipo che cerca qualcuno da spaccare."
    luogo: Cortile della Pignatta Grassa
    area: citta-bassa
    ripetibile: true
    testo: |
      Dietro la Pignatta c'è un cortile dove la luce arriva di sbieco e le
      guardie non arrivano affatto. Qualcuno ha tracciato un cerchio col gesso;
      qualcun altro l'ha già mezzo cancellato con le suole. Una dozzina di
      scommettitori si passa monete e insulti.

      Nel cerchio, un tipo con le nocche spaccate e l'alito di sidro saltella
      sul posto e cerca qualcuno da spaccare. Non ce l'ha con te: ce l'ha con
      la posta. Dalla porta sul retro Mauro Scrocco osserva con l'aria di chi
      ha già deciso chi vince, e a cui non dispiacerebbe sbagliarsi.
    opzioni:
      - testo: "Entrare nel cerchio"
        descrizione: "Le regole sono due: niente lame, e chi esce dal gesso ha perso. La seconda la rispettano in pochi."
        combattimento: rissa-pignatta
        vittoria:
          titolo: Posta vinta
          testo: |
            Il tipo va giù al terzo scambio, e al quarto decide di restarci. Il
            cortile esplode in un urlo che è metà gioia e metà contabilità.
            Qualcuno ti mette in mano la tua parte della posta, otto monete
            tiepide di mani altrui; qualcun altro ti versa del sidro in testa,
            che da queste parti è un complimento.

            Dalla porta, Mauro alza il bicchiere verso di te. Ti ha notato. Non
            sai ancora se sia una buona notizia.
          effetti: { monete: 8 }
        sconfitta:
          titolo: Contro il muro
          testo: |
            Ti risvegli con la guancia contro il muro, dove il gesso non arriva.
            La tua quota è sparita, e con lei un dente, che più tardi ritrovi in
            tasca: qualcuno, per scrupolo, te l'ha restituito.

            Gli scommettitori sono già passati a un'altra coppia. Nessuno ti
            guarda. Alla Pignatta è la forma di rispetto più comune.
          effetti: { monete: -3 }

  - id: ricucire-gramm
    immagine: personaggi/nestor-gramm
    titolo: Farsi ricucire da Nestor Gramm
    sommario: "Dal vicolo, non dalla porta principale. Nestor Gramm ricuce tutto, tranne il buonumore."
    luogo: Il vicolo dietro la Dispensa di Gramm
    area: citta-bassa
    ripetibile: true
    requisiti: [ferite >= 0.5]
    testo: |
      Alla Dispensa di Gramm si entra dalla porta principale per le tisane, e
      dal vicolo per tutto il resto. Tu entri dal vicolo.

      Nestor Gramm è basso, tozzo, con un grembiule grigio che ha visto troppe
      cose andare storte e uno straccio nella tasca destra che non usa mai per
      pulire. Ti guarda le ferite come si guarda un conto da saldare: con
      attenzione, senza simpatia, calcolando gli interessi. Ogni tanto gli
      occhi gli vanno un po' fuori fuoco, come a chi assaggia troppo dei
      propri preparati. Le mani no. Le mani sono ferme.
    opzioni:
      - testo: "Pagare dieci monete"
        descrizione: "Nestor non fa sconti e non fa domande. È lo scambio più onesto della Città Bassa."
        requisiti: [monete >= 10]
        esito:
          titolo: Ago, filo, un'erba che brucia
          testo: |
            Ti fa sedere su una cassa che odora di zolfo. Ago, filo, un impasto
            verdastro che brucia come una bugia scoperta. Lavora in silenzio e
            borbotta solo quando stringi i denti troppo forte: «Fermo. Il
            dolore è gratis, il filo no.»

            Quando ha finito conta le monete due volte e le fa sparire sotto il
            bancone. Non ringrazi. Lui non se lo aspetta, e sembra quasi
            sollevato.
          effetti: { monete: -10, ferite: -1 }

  - id: spalmare-unguento
    immagine: ambientazione/ampolle-e-rimedi
    titolo: Un unguento dal barattolo
    sommario: "Resina, grasso di pecora e la ricetta di una nonna che, pare, non è morta di niente."
    area: citta-bassa
    ripetibile: true
    requisiti: [unguento >= 1, ferite >= 0.5]
    testo: |
      Il barattolo è di terracotta, chiuso con cera e spago. Te l'ha venduto
      qualcuno che giurava sulla ricetta di sua nonna, e sua nonna, a sentir
      lui, non era morta di niente.

      Dentro c'è una pasta grassa color muschio che odora di resina, di grasso
      di pecora e di qualcosa di più vecchio che non sai nominare. Ti siedi in
      un angolo dove nessuno guarda. Le ferite tirano sotto le bende. Oltre il
      muro, il martello della Città Bassa batte il suo tempo.
    opzioni:
      - testo: "Usare l'unguento"
        descrizione: "Due dita di pasta sulla ferita, e la speranza che la nonna avesse ragione."
        esito:
          titolo: La nonna aveva ragione
          testo: |
            Pizzica, poi brucia, poi smette di colpo, come una lite finita a
            metà frase. La pelle si tende; il dolore si fa lontano e sordo, una
            faccenda che riguarda qualcun altro.

            Richiudi il barattolo con cura. È più leggero di prima.
          effetti: { unguento: -1, ferite: -0.5 }

  - id: cucire-voci
    titolo: Cucire insieme le voci
    sommario: "Cinque voci, cinque bocche. Messe in fila con pazienza, qualcuna smette di essere una voce."
    area: citta-bassa
    ripetibile: true
    requisiti: [informazioni.voce >= 5]
    testo: |
      Cinque voci, cinque bocche diverse, cinque sere di sidro pagato. Una
      dice che gli orchi sono entrati dalla porta nord; un'altra, dal fiume.
      Una giura che lo sceriffo sapeva; un'altra, che lo sceriffo ha pianto.

      Le stendi sul tavolo come un giocatore stende le carte, e cominci a
      guardare dove si toccano. È un lavoro lento, da cronista del Velo. Ma se
      le metti in fila con pazienza, qualcuna smette di essere una voce e
      diventa un fatto. Le altre tornano a essere quello che erano: aria che
      sa di sidro.
    opzioni:
      - testo: "Confrontarle e tenere solo ciò che regge"
        descrizione: "Scartare è la parte difficile. Ogni voce ha qualcuno che ci ha creduto abbastanza da ripeterla."
        esito:
          titolo: Resta una cosa sola
          testo: |
            A notte fonda, dopo aver scartato quattro storie e mezza, resta una
            cosa sola. È piccola, e non particolarmente allegra. Ma regge: la
            guardi da tre lati e non si piega.

            La scrivi su un pezzo di carta, poi ti accorgi che non serve. Una
            cosa vera, a Qir-Azel, non si dimentica. Al massimo si vende.
          effetti: { informazioni.voce: -5, informazioni.pettegolezzo: 1 }

  # ------------------------------------------------------------ la pista della Dama d'Argento
  - id: parola-orchesca
    immagine: ambientazione/evento-razzia-festival-150
    titolo: Una parola orchesca
    sommario: "Gli orchi la gridavano mentre morivano. La Città Bassa la ripete sottovoce, senza sapere cosa voglia dire."
    luogo: Città Bassa, tre giorni dopo il Festival
    area: citta-bassa
    requisiti: [pista.dama-argento == 0, informazioni.voce >= 2]
    testo: |
      Tre giorni dopo la razzia delle Foglie Alate, la Città Bassa ha ripreso a
      battere il martello, ma più piano. Si seppelliscono i morti in fosse
      comuni benedette in fretta. Si rattoppano le tende. Si contano gli orchi
      uccisi, e quelli che, braccati sull'orlo, hanno preferito saltare nella
      Cicatrice piuttosto che farsi prendere. Nessuno sa spiegarlo. Un orco che
      si butta nel vuoto non è una cosa che si racconta ai bambini.

      E poi c'è la parola.

      La ripetono nelle code alla fontana, nei cortili, sulla soglia delle
      botteghe: una parola che nessuno sa pronunciare bene, dura come un sasso
      in bocca. Gli orchi la gridavano mentre caricavano, mentre morivano,
      mentre saltavano. *Mawrak'Thur.*

      Chi la dice abbassa la voce. Chi la sente fa finta di non averla sentita.
      Una lavandaia giura che il capoguerra sul cinghiale corazzato la cantava
      come una preghiera; un facchino giura che era una bestemmia. Nessuno dei
      due sa cosa voglia dire, e nessuno dei due vuole saperlo davvero.

      Tu, invece, sì.
    opzioni:
      - testo: "Scambiare le tue voci con chi ha sentito di più"
        descrizione: "Due storie in cambio di una. In Città Bassa è il cambio corrente, e nessuno rilascia ricevuta."
        requisiti: [informazioni.voce >= 2]
        esito:
          titolo: La vecchia delle castagne
          testo: |
            La trovi all'angolo del lavatoio, dietro un braciere che fuma più di
            quanto scaldi: una vecchia che vende castagne e sa tutto quello che
            si è detto in quella strada negli ultimi quarant'anni. Le cedi le
            tue due storie. Lei le assaggia, le trova di suo gusto, le mette
            via. Poi si china verso di te, e l'odore di castagna bruciata ti
            riempie il naso.

            «Dama d'Argento,» dice. «Nella lingua degli orchi vuol dire così.»

            Non sa chi gliel'ha detto. Un uomo giovane, una sera, con troppo
            liquore in corpo e le mani che non stavano ferme. Non ricorda la
            faccia. Ricorda che aveva paura.

            «Non paura degli orchi,» precisa, e ti porge un cartoccio di
            castagne che non hai chiesto. «Paura di quella parola.»
          effetti: { informazioni.voce: -2, pista.dama-argento: 1 }
      - testo: "Fare domande in giro, con discrezione"
        descrizione: "Una domanda qui, una là, con l'aria di chi chiede per curiosità. Il trucco è non chiedere mai due volte alla stessa persona."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Tre volte la stessa
          testo: |
            Te la ripetono tre volte, in tre posti diversi, da tre bocche che
            non si conoscono: un carovaniere al ponte, una tintora con le mani
            blu fino ai gomiti, un ragazzino che si fa pagare in anticipo. Tre
            volte la stessa traduzione, detta sottovoce e con lo stesso piccolo
            scatto delle spalle, come quando si passa accanto a un cane che
            dorme.

            *Mawrak'Thur.* La Dama d'Argento.

            Nessuno dei tre sa chi sia. Nessuno dei tre sa chi l'abbia tradotta
            per primo. Ma tutti e tre sono sicuri di una cosa: chi l'ha detta la
            prima volta non stava ridendo.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Troppe domande
          testo: |
            Una domanda di troppo sulla stessa parola, e la Città Bassa si
            chiude come una mano. La tintora smette di sorriderti. Il
            carovaniere si ricorda di avere fretta.

            Quando giri l'angolo senti che qualcuno ti guarda andar via, e ti
            guarda un po' troppo a lungo. Da queste parti non è una minaccia. È
            una nota a margine. Ma le note a margine, a Qir-Azel, finiscono
            spesso nei registri sbagliati.
          effetti: { sospetto: 0.5 }

  - id: lingua-dei-chiodi
    immagine: fazioni/tribu-nove-chiodi
    titolo: Chi parla la lingua dei Nove Chiodi
    sommario: "Una traduzione non basta. Qualcuno in città ha capito cosa gridavano gli orchi, e da allora ha paura."
    luogo: Pignatta Grassa
    area: citta-bassa
    requisiti: [pista.dama-argento == 1]
    testo: |
      Una traduzione è una porta socchiusa. Dama d'Argento: ma quale dama, e
      d'argento perché? Le cinque tribù orchesche del circondario non si erano
      mai mosse insieme, a memoria di Qir-Azel. Quella sera qualcuno le ha
      tenute in fila. E qualcuno, in città, ha capito abbastanza di quello che
      gridavano da averne paura.

      L'orchesco non si impara al mercato. Lo parlano gli orchi, qualche ranger
      che li caccia, e quei pochi mercanti che hanno trafficato abbastanza a
      lungo col Bosco della Forca da contare i prezzi nella testa dei Nove
      Chiodi. Gente che non se ne vanta. Da queste parti chi parla orchesco
      viene guardato come chi ha un parente in galera.

      Alla Pignatta Grassa il fumo è basso e le orecchie sono lunghe. Al tavolo
      dei carovanieri si beve per dimenticare la strada per Laresh. Dietro il
      bancone, Mauro Scrocco lucida un bicchiere che è pulito da un'ora, e ti
      guarda come si guarda un cliente che non ha ancora ordinato la cosa per
      cui è venuto.
    opzioni:
      - testo: "Chiedere tra i carovanieri"
        descrizione: "Chi percorre la strada per Laresh conosce gli orchi meglio di quanto vorrebbe. E conosce chi li conosce."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Media }
        successo:
          titolo: Un nome
          testo: |
            Ci vogliono tre giri e una storia vera sulla razzia, raccontata
            bene. Poi un carovaniere con la barba bruciata da un lato si pulisce
            la bocca col dorso della mano.

            «Dole,» dice. «Rennick Dole. Quello della Segheria, il
            responsabile. Suo padre commerciava pelli col Bosco della Forca e se
            lo portava dietro da ragazzino. Il vecchio voleva che il figlio
            imparasse a contare i prezzi nella testa degli orchi. Ha imparato
            anche il resto.»

            Un altro annuisce. Rennick Dole parla l'orchesco meglio di chiunque
            in città. Tirchio, dicono, e arrogante, uno che non offrirebbe da
            bere nemmeno al proprio funerale. Ma dalla sera del Festival non si
            fa vedere in giro. Alla Segheria dicono che è partito. Nessuno sa
            dire quando.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Tutto tranne gli orchi
          testo: |
            I carovanieri parlano volentieri. Di dazi, di ponti, dei Custodi che
            arrotondano, di un cavallo zoppo che è costato quanto un matrimonio.
            Di orchi, no.

            Quando insisti, uno di loro posa il boccale con un colpo secco e
            cambia tavolo. Gli altri lo seguono con lo sguardo, poi guardano te.
            Hai fatto la domanda sbagliata nel posto giusto, che è peggio del
            contrario.
          effetti: { sospetto: 0.5 }
      - testo: "Pagare Mauro Scrocco perché si ricordi di qualcosa"
        descrizione: "Mauro non vende informazioni. Presta memoria, a interesse. Dieci monete sono l'anticipo."
        immagine: personaggi/mauro-scrocco
        requisiti: [monete >= 10]
        esito:
          titolo: Mauro si ricorda
          testo: |
            Mauro fa il giro del bancone per abbracciarti, e il suo alito ti
            arriva un momento prima delle braccia. Poi prende le tue dieci
            monete, le conta due volte e le fa sparire in una tasca color
            zafferano.

            «Rennick Dole,» dice, a voce abbastanza alta perché lo senta mezza
            sala e abbastanza distratta perché nessuno ci faccia caso.
            «Responsabile della Segheria. Parla la lingua di quelle bestie
            meglio di loro. Veniva qui a guardare gli altri perdere a carte. Lui
            non giocava: costa.» Ti batte due colpi sul petto, come per chiudere
            una porta. «Dopo il Festival ha smesso di venire. Ha smesso di
            andare da un sacco di parti. Uno che ha paura, amico mio, si
            riconosce da dove non va.»

            Ti riaccompagna al tavolo come un vecchio parente. Da qualche parte,
            nel fumo, qualcuno ha preso nota del tuo nome.
          effetti: { monete: -10, pista.dama-argento: 1, rep.scuri: 1 }

  - id: segheria-malgrani
    immagine: ambientazione/segheria-di-qir-azel
    titolo: La Segheria Malgrani
    sommario: "Le seghe girano, nessuno canta, e al cancello ci sono uomini in livrea. Marko Thessel sorride."
    luogo: Segheria Malgrani, sul canale del cristallo
    area: citta-bassa
    requisiti: [pista.dama-argento == 2]
    testo: |
      Senti la Segheria prima di vederla: un ronzio basso e regolare che
      comincia a cinquanta passi e ti entra nei denti. Il canale che la muove
      è artificiale, alimentato da un grosso cristallo conduttore romboidale
      che gira l'acqua come si gira un mestolo. Le pale ruotano, le lame
      mordono. L'aria sa di resina, di olio bruciato, di segatura; i trucioli
      coprono il cortile come una neve gialla.

      È la Segheria di Qir-Azel, ma tutti la chiamano Segheria Malgrani: la
      concessione è loro, e loro non lasciano che nessuno lo dimentichi.
      Davanti al cancello ci sono quattro uomini armati. Niente divisa della
      guardia: giacche di cuoio borchiato, mazze ferrate, e sulla spalla
      sinistra lo stemma di casa Malgrani, un albero trafitto da una lama.
      Oltre il cancello gli operai lavorano a testa bassa. Nessuno canta,
      nessuno scherza, nessuno si lamenta, e almeno due di loro hanno mani che
      una sega non l'hanno mai tenuta.

      Sotto il porticato, Marko Thessel scende tre gradini con calma studiata.
      Giovane, bello e perfettamente consapevole di esserlo, camicia di lino
      chiara, una matita da carpentiere dietro l'orecchio. Sorride. Il sorriso
      non gli arriva agli occhi.

      «La Segheria non riceve visite, a quest'ora. Abbiamo commesse
      pressanti.»
    opzioni:
      - testo: "Chiedere di Rennick Dole"
        descrizione: "Una domanda semplice, fatta con garbo. Conta meno la risposta che il modo in cui te la danno."
        immagine: personaggi/rennick-dole
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Laresh, dice lui
          testo: |
            Marko allarga le braccia, dispiaciuto quanto un esattore.

            «Rennick? Non c'è. È andato a Laresh per una trattativa con un
            grossista di legname. Torna fra qualche giorno. Se è una questione
            di forniture, posso aiutarti io.» Una pausa. «Oppure no?»

            Lo dice bene. Lo dice troppo bene, le parole in fila come assi
            appena piallate, e mentre parla la sua mano destra scivola verso la
            cintura, dove un'arma non c'è ancora ma c'è il posto per metterla.
            Alle sue spalle, uno dei due uomini appoggiati al muro sbuffa dal
            naso. Non è una risata. È una conferma.

            Marko Thessel mente. Mente sapendo che te ne accorgi, e non gli
            importa, perché è convinto che tu non possa farci niente. Ringrazi e
            te ne vai con passo tranquillo. Il ronzio del cristallo ti segue
            fino al ponte, e con lui una domanda: per chi sta mentendo, e contro
            chi.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: A Laresh, per legname
          testo: |
            «A Laresh,» dice Marko, «per una trattativa sul legname. Tornerà fra
            qualche giorno.» Ha una voce piacevole, abituata ai mercanti che
            salgono in città due volte l'anno, e un modo di guardarti che ti fa
            sentire ben vestito anche se non lo sei.

            Gli credi. Per ora. Solo quando sei di nuovo in strada ti accorgi
            che i quattro uomini al cancello non ti hanno tolto gli occhi di
            dosso nemmeno per un momento, e che uno di loro, adesso, sa come ti
            chiami.
          effetti: { sospetto: 0.5 }
      - testo: "Insistere, davanti ai suoi uomini"
        descrizione: "Marko è abituato a essere l'uomo più importante del cortile. Puoi provare a fargli cambiare abitudine, davanti a tutti."
        immagine: personaggi/marko-thessel
        requisiti: [intimidire >= 1]
        combattimento: rissa-segheria
        vittoria:
          titolo: Sangue nella segatura
          testo: |
            Finisce con Marko Thessel in ginocchio nella segatura, la camicia
            chiara sporca di resina e di qualcosa di più scuro. Lo sgherro in
            livrea è a terra poco più in là, e non ha fretta di rialzarsi. Gli
            operai non si sono mossi: guardano i tronchi con un'attenzione
            nuova. Laggiù, una sega a nastro continua a girare a vuoto.

            Marko sputa sangue. Poi, sorprendentemente, ride.

            «Maison des Lunes,» dice. «Via dei Rasoi. È lì dall'alba, e non
            vuole essere trovato. Neanche da te.» Si pulisce la bocca col polso,
            e per un istante il sorriso torna al suo posto, storto. «Ma fai
            pure. Vediamo chi arriva prima.»

            Te ne vai lasciandoti alle spalle un cortile silenzioso e un nemico
            con un cognome importante dietro. I Malgrani non dimenticano chi fa
            sanguinare i loro soci. Lo scrivono.
          effetti: { pista.dama-argento: 2, rep.malgrani: -2 }
        sconfitta:
          titolo: Fuori dal cancello
          testo: |
            Sono più di quanti ne avessi contati, e il cortile è loro. Ti
            ritrovi fuori dal cancello con la faccia nella segatura, uno
            stivale piantato fra le scapole e lo stemma dei Malgrani cucito
            proprio all'altezza dei tuoi occhi: l'albero, la lama.

            Il messaggio è chiaro, e non serve saper leggere. Marko non si è
            nemmeno sporcato la camicia. «Salutami Laresh,» dice qualcuno, e
            ridono tutti. Tranne gli operai.
          effetti: { rep.malgrani: -1 }
      - testo: "Andarsene"
        descrizione: "Non tutte le porte vanno forzate il primo giorno. Alcune si aprono da sole, se le guardi abbastanza a lungo."
        costo: 0
        esito:
          titolo: Il rumore delle seghe
          testo: |
            Ti volti e te ne vai. Marko non ti saluta; ha già ripreso a parlare
            con uno dei suoi, a voce abbastanza alta perché tu senta la parola
            «curiosi».

            Il rumore delle seghe ti accompagna fino al ponte, poi si confonde
            con quello della Città Bassa, finché non sai più distinguere il
            legno dal ferro.

  - id: sorriso-di-marko
    immagine: personaggi/marko-thessel
    titolo: Il sorriso di Marko
    sommario: "Rennick non è a Laresh, e Marko lo sa. A fine turno, Marko non prende la strada di casa."
    luogo: Città Bassa, al calar della sera
    area: citta-bassa
    requisiti: [pista.dama-argento == 3]
    testo: |
      Rennick non è a Laresh, e Marko lo sa. Adesso lo sai anche tu, e la
      cosa ti prude sotto la pelle come una scheggia.

      Al calar della sera la Segheria rallenta ma non si ferma: il cristallo
      ronza anche quando le lame tacciono, e i vicini, come ogni sera, si
      lamentano dietro le persiane chiuse. Poco dopo il cambio degli uomini al
      cancello, Marko Thessel esce dall'ingresso laterale. Si è cambiato la
      camicia, lo fa sempre a fine turno. Si è pettinato, anche. Saluta gli
      uomini in livrea con due dita, senza guardarli, e si incammina.

      Non prende la strada di casa. Non prende nemmeno quella della Pignatta,
      dove un uomo come lui andrebbe a farsi vedere. Scende invece verso il
      margine dell'Orlo, dove i lastroni di pietra blu sono scheggiati e la
      luce delle lanterne arriva a chiazze, col passo di chi ha un posto
      preciso dove andare e nessuna voglia di esserci visto.

      Puoi seguirlo. Oppure puoi tornare al cancello della Segheria, dove la
      donna che spazza la segatura a fine giornata sa di tutti più di quanto
      dica, e dove un creditore arrabbiato non sarebbe il primo della
      settimana.
    opzioni:
      - testo: "Seguirlo tra i vicoli"
        descrizione: "Tenere la distanza, cambiare lato della strada, non guardarlo mai in faccia. Marko è vanitoso: guarda le vetrine, non le ombre."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Una luna incisa
          testo: |
            Lo segui per venti minuti, attraverso il margine dell'Orlo e poi su
            per una strada che non taglia mai dritto: Via dei Rasoi, che fa un
            gomito ad angolo retto attorno a un vecchio cristallo conduttore
            spento, una scheggia opaca alta come due uomini.

            Tre porte dopo il cristallo, all'angolo con Via del Salmone, Marko
            si ferma davanti a una casa di legno di tre piani, tende chiuse,
            nessuna insegna. Sulla porta scura, una luna crescente incisa.
            Accanto, una catena di bronzo. Marko la tira. La porta si apre di
            una spanna, e sulla soglia compare una halfling con i capelli
            raccolti. Parlano poco. Lui indica il primo piano con il mento; lei
            scuote la testa una volta sola. Marko se ne va senza entrare, più in
            fretta di come è venuto.

            Alzi gli occhi. Al primo piano, una tenda si richiude.

            Rennick Dole è lì dentro.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Al terzo angolo
          testo: |
            Al terzo angolo Marko si ferma davanti a una vetrina che non ha
            niente da mostrare, e nel vetro scuro incontra i tuoi occhi. Si
            volta. Ti sorride: lo stesso sorriso che riserva ai mercanti di
            Laresh quando il prezzo non gli piace.

            Poi riprende a camminare, ma verso la Pignatta, questa volta, con
            tutta la calma del mondo. Non hai scoperto dove andava. Hai scoperto
            che domani lo saprà mezza Segheria, e l'altra metà dopodomani.
          effetti: { sospetto: 1 }
      - testo: "Fingerti un creditore di Rennick con la portinaia della Segheria"
        descrizione: "Una faccia offesa, un debito inventato, una cifra abbastanza precisa da sembrare vera."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: L'unico posto dove li spende
          testo: |
            La portinaia è una donna larga e stanca, con una scopa di saggina e
            un'opinione su tutto. Le racconti di un debito, undici monete e
            mezza, una cifra che nessuno inventerebbe, e lei sbuffa prima ancora
            che tu finisca.

            «Rennick? Debiti?» Ride, senza allegria. «Quello conta i chiodi. Non
            ha mai offerto un bicchiere in vita sua.» Poi abbassa la voce,
            perché qui anche le scope hanno orecchie. «Se ti deve dei soldi,
            chiedili alla Maison des Lunes, in Via dei Rasoi. È l'unico posto
            dove li spende. E ci va più spesso di quanto dovrebbe uno che si
            deve sposare.»

            Poi si morde la lingua. Letteralmente: la vedi farlo. Riprende a
            spazzare con un vigore nuovo, come se la segatura le avesse fatto un
            torto. Tu ringrazi, e ti allontani prima che si penta del tutto.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: La bugia non regge
          testo: |
            Hai sbagliato cifra, o faccia, o tutte e due. La portinaia ti
            ascolta con la scopa ferma e alla fine dice soltanto: «Rennick non
            deve soldi a nessuno. È l'unico suo difetto che non sia un vizio.»

            Poi chiama per nome uno degli uomini al cancello. Te ne vai prima
            che arrivi, ma la tua faccia, con la storia che ci hai messo sopra,
            gira per la Segheria prima di sera e per la Pignatta prima di notte.
          effetti: { scandalo: 0.5 }

  - id: luna-crescente
    immagine: ambientazione/maison-des-lunes
    titolo: La lanterna accesa
    sommario: "Tre porte dopo il cristallo spento, una luna incisa e una lanterna accesa. Qualcuno, dentro, aspetta."
    luogo: Via dei Rasoi, angolo Via del Salmone
    area: citta-bassa
    requisiti: [pista.dama-argento == 4]
    testo: |
      Via dei Rasoi non taglia mai dritto. Fa un gomito di novanta gradi
      attorno a un vecchio cristallo conduttore esaurito, e la Città Bassa lo
      usa per orientarsi: «tre porte dopo il cristallo spento», si dice, e chi
      deve capire capisce.

      Tre porte dopo il cristallo, all'angolo con Via del Salmone, c'è una
      casa di legno di tre piani con le tende chiuse. Niente insegna. Al
      centro della porta scura, una luna crescente incisa così sottile che si
      vede solo quando la luce la prende di taglio. Accanto, una catena di
      bronzo con due parole incise: *Ospiti Benvenuti*.

      Sopra la porta, una lanterna a olio è accesa. In Città Bassa tutti
      conoscono la regola, anche quelli che giurano di non esserci mai stati:
      lanterna accesa, le ragazze ricevono. Lanterna spenta, dentro è successo
      qualcosa che non doveva succedere.

      Da dietro le tende arriva una conversazione bassa, una risata di donna,
      nessuna musica. Alla Maison des Lunes non si suona mai: si dice che la
      padrona sostenga che la musica copre cose che è meglio sentire.

      Dentro, qualcuno aspetta che qualcun altro lo trovi. Speri di essere tu.
    opzioni:
      - testo: "Tirare la catena"
        descrizione: "Un campanello, da qualche parte oltre le tende. Poi passi, e la sensazione di essere contato."
        esito:
          immagine: personaggi/sara-beck
          titolo: Le armi qui dentro
          testo: |
            Il campanello suona lontano, oltre le tende. Dopo due secondi
            esatti, la porta si apre.

            Sulla soglia c'è una halfling piccola, occhi attenti, capelli
            raccolti con un fermaglio d'argento. Ti squadra una volta dalla
            testa ai piedi, con la cortesia rapida di chi ha già deciso di
            ricordarsi di te per anni. Alle sue spalle, dietro una tenda di
            velluto, un'ombra alta e larga il doppio di una persona si sposta di
            un dito.

            «Buonasera. Sono Sara Beck. La Maison non riceve chi non ha
            appuntamento.» Una pausa. Ti guarda meglio: le mani, le scarpe, la
            segatura che ti porti ancora addosso. «Però. Forse sei tu,
            l'appuntamento che qualcuno aspetta.»

            Si fa da parte. Dietro di lei, un bancone curvo e un armadio chiuso
            a chiave.

            «Le armi qui dentro,» dice, con un sorriso vero quanto basta. «Il
            sorriso lo porti dove ti pare.»

            Qui finisce il prototipo. La storia prosegue come nel Capitolo I.
          effetti: { pista.dama-argento: 1, rep.maison: 1 }

  # ------------------------------------------------------------ carte
  - id: carta-borseggiatore
    titolo: Una mano leggera
    sommario: "Una spinta nella calca, una mano che si ritira troppo in fretta. La tua borsa è più leggera."
    tipo: carta
    area: citta-bassa
    testo: |
      Il mercato del mattino, in Città Bassa, è una corrente: ti prende alla
      fontana e ti deposita, se va bene, dall'altra parte della piazza.
      Carretti di rape, gabbie di galline, un predicatore del Velo che parla
      di foglie e di ali a nessuno in particolare.

      Una spinta alla schiena, di quelle che nella calca non si notano. Una
      mano che si ritira un momento troppo in fretta. Un ragazzo magro,
      cappello calcato, che scivola già fra due banchi senza correre, perché
      chi corre si fa guardare.

      La tua borsa è più leggera. Lo senti prima ancora di toccarla, come si
      sente un dente che manca. Lui è ancora a portata di mano. Per un attimo.
    opzioni:
      - testo: "Afferrarlo prima che sparisca"
        descrizione: "Uno scatto, una presa sul bavero. Se sbagli, avrai afferrato l'aria davanti a trenta testimoni."
        prova: { attributo: fisico, abilita: [acrobazia, rissa], difficolta: Facile }
        successo:
          titolo: Per il bavero
          testo: |
            Lo prendi per il bavero un attimo prima che la folla lo inghiotta.
            È più giovane di quanto pensassi, e più vecchio di quanto dovrebbe
            essere per questo lavoro.

            Ti restituisce le tue monete senza discutere. Poi, dopo un'occhiata
            alla tua faccia, ne aggiunge qualcuna che tua non era. «Per
            dimenticarti di me,» dice. Lo lasci andare. È il genere di affare
            che da queste parti si chiama buon vicinato.
          effetti: { monete: 3 }
        fallimento:
          titolo: Stoffa bagnata
          testo: |
            La tua mano si chiude su un lembo di stoffa che si strappa come
            carta bagnata. Il ragazzo è già altrove, e con lui quattro delle tue
            monete.

            Qualcuno, dietro di te, ride. Qualcun altro ti consiglia con grande
            gentilezza di tenere la borsa davanti, come fanno tutti. Ringrazi.
            Non c'è altro da fare.
          effetti: { monete: -4 }
      - testo: "Inseguirlo fino in fondo al vicolo"
        descrizione: "Lui conosce le strade. Tu conosci la rabbia. A volte basta."
        combattimento: borseggio
        vittoria:
          titolo: Vicolo cieco
          testo: |
            Il vicolo finisce contro un muro di pietra blu che il ragazzo
            sperava di non trovare. Ci prova lo stesso: con i pugni, poi con un
            coltellino da frutta, poi con le lacrime. Nessuna delle tre cose
            funziona.

            Quando lo lasci andare, zoppicante, ti ritrovi in mano un sacchetto
            unto: oltre alle tue monete, quelle di mezza piazza. Non le
            restituirai. Nessuno verrebbe a reclamarle, comunque. Non da te.
          effetti: { monete: 6 }
        sconfitta:
          titolo: Meno sprovveduto
          testo: |
            Era meno sprovveduto di quanto sembrasse, e il vicolo era suo. Una
            gomitata, un calcio dove non si dovrebbe, e lui è già sul tetto di
            una stalla, agile come un gatto pieno di debiti.

            Ti rialzi con le ginocchia sbucciate e la borsa ancora più leggera.
            Da lassù, lui ti fa un piccolo inchino. In Città Bassa anche i ladri
            hanno le buone maniere.
          effetti: { monete: -4 }

  - id: carta-lanterna
    immagine: ambientazione/ponte-dei-morti
    titolo: Una lanterna che si accende da sola
    sommario: "Sul Ponte dei Morti, una lanterna spenta da anni si è accesa da sola. E pulsa."
    tipo: carta
    area: citta-bassa
    testo: |
      Dal margine della Città Bassa, alzando gli occhi verso ovest, si vedono
      i Ponti Sospesi tesi sopra la Cicatrice, e fra tutti il più vecchio: il
      Ponte dei Morti, metallo nero e corde, dove i Raschiatori appendono una
      lanterna per ogni compagno disperso nel Labirinto. Bruciano finché regge
      il cristallo che hanno dentro. Anni, di solito. Poi si spengono, e
      nessuno le tocca più.

      Stanotte, fra le luci fisse e familiari, ce n'è una nuova. Non nuova:
      vecchia. Una di quelle spente da così tanto che i Raschiatori più
      giovani non ricordano nemmeno di chi fosse. Si è accesa da sola. Non
      oscilla col vento come le altre. Pulsa.

      Accanto a te, una donna si fa il segno dell'Albero e rientra in casa
      senza chiudere la porta.
    opzioni:
      - testo: "Restare a guardarla finché si spegne"
        descrizione: "Una notte all'aperto, gli occhi su una luce lontana. Qualcuno, domani, vorrà sapere cosa hai visto."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Come un cuore
          testo: |
            La guardi per ore, finché il collo ti fa male e il calore delle
            fenditure si spegne sotto di te. Conti: non puoi farne a meno. La
            lanterna pulsa sessanta, settanta volte al minuto, poi più piano,
            poi più piano ancora, come un cuore che si addormenta.

            All'alba si spegne. Nessuno sul ponte l'ha toccata; ne sei sicuro,
            per quanto si possa essere sicuri di qualcosa guardato da così
            lontano. Qualcuno, in città, pagherebbe per sapere quante volte ha
            battuto. Tu lo sai.
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Ti guarda
          testo: |
            Verso la terza ora smetti di guardare la lanterna, e ti accorgi che
            è la lanterna a guardare te. È un pensiero stupido. Lo sai che è un
            pensiero stupido.

            Rientri, chiudi le imposte, ti stendi. Non dormi. Ogni volta che
            chiudi gli occhi, dietro le palpebre, qualcosa pulsa.
          effetti: { tormento: 0.5 }

  - id: carta-favore-scuri
    immagine: personaggi/rozalia-marga
    titolo: Un favore per gli Scuri
    sommario: "Rozalia Marga ha un pacco, una strada da fare e nessuna voglia di rispondere a domande."
    tipo: carta
    area: citta-bassa
    requisiti: [rep.scuri >= 1]
    testo: |
      Rozalia Marga ti si affianca all'angolo senza che tu la veda arrivare,
      il che, per una donna con una piuma d'oca dietro l'orecchio, è un
      piccolo prodigio. Snella, mantellina scura, dita macchiate d'inchiostro
      che lava, dicono, una volta a settimana per principio. Alla Pignatta
      dicono anche che nel suo retrobottega ci sia l'archivio di firme più
      ordinato della città, notai compresi. Lei non smentisce. Lei non smentisce
      mai niente: produce documenti.

      «Ho un pacco,» dice, guardando la strada e non te. «Dal Mercato delle
      Ombre alla Pignatta. Niente domande, niente guardie, niente giri
      panoramici. Hai una faccia che nessuno ha ancora imparato a riconoscere.
      È un pregio. Dura poco: approfittane.»
    opzioni:
      - testo: "Portare il pacco"
        descrizione: "Un pacco, due porte, nessuna domanda. Il difficile è non fartela da solo."
        esito:
          titolo: Tintinna
          testo: |
            Il pacco è avvolto in tela cerata e legato con uno spago troppo
            stretto. È pesante, e quando cammini tintinna: un suono piccolo e
            vetroso che preferiresti non aver sentito. Due guardie della Caserma
            ti incrociano sul ponte; una ti guarda un attimo più del necessario.

            Poi c'è la porta sul retro della Pignatta, una mano che prende il
            pacco, sei monete che ti arrivano senza che nessuno le conti.
            Rozalia non ti ringrazia. Ti ha già messo in un registro.
          effetti: { monete: 6, rep.scuri: 1, rep.caserma: -1, sospetto: 0.5 }
      - testo: "Rifiutare, guardandola in faccia"
        descrizione: "Un no detto chiaro, occhi negli occhi. Con gli Scuri anche i rifiuti hanno un prezzo: meglio pagarlo subito."
        esito:
          titolo: Peccato
          testo: |
            Rozalia ti ascolta fino in fondo, con un'attenzione quasi
            professionale, come se stesse copiando la tua voce per usarla più
            tardi.

            «Peccato,» dice. Lo dice come se se lo stesse annotando. Poi si
            sistema la piuma dietro l'orecchio e se ne va, e per tutto il giorno
            hai la sensazione di aver firmato qualcosa.
          effetti: { rep.scuri: -1 }

  - id: carta-bollettino
    immagine: ambientazione/marea-grigia
    titolo: Il bollettino delle sacche
    sommario: "Il Velo ha affisso i bollettini delle sacche di Marea. Qualcuno ha cancellato una riga a carboncino."
    tipo: carta
    area: citta-bassa
    testo: |
      Ogni autunno, dopo le piogge, la Confraternita del Velo affigge i
      bollettini delle sacche di Marea Grigia risalite in superficie:
      pergamene lunghe, inchiodate alle porte delle cappelle e agli angoli dei
      mercati, nella grafia minuta e impassibile dei cronisti. Luoghi, date,
      profondità. In fondo, per i banchi che nessuno ha mai attraversato, una
      parola sola: *oltre*.

      Quest'anno la lista è più lunga. La gente la legge in silenzio, le
      labbra che si muovono, cercando il nome della propria strada e sperando
      di non trovarlo.

      A metà pergamena, una riga è stata cancellata. Non strappata, non
      raschiata: coperta a carboncino, con cura, da qualcuno che aveva tempo e
      mano ferma. Sotto, se guardi di sbieco, il segno dell'inchiostro
      trapela ancora.
    opzioni:
      - testo: "Ricostruire la riga cancellata"
        descrizione: "Luce radente, un po' di pazienza e un'idea di come scrivono i cronisti del Velo. Ogni parola lascia un solco."
        prova: { attributo: mentale, abilita: [accademiche, natura], difficolta: Facile }
        successo:
          titolo: Una sacca sotto l'Orlo
          testo: |
            Ti ci vogliono mezz'ora, un'unghia e una lanterna tenuta di sbieco.
            Il carboncino ha coperto l'inchiostro ma non il solco della penna:
            le lettere affiorano una alla volta, come pesci sotto il ghiaccio.

            Una sacca. Sotto l'Orlo dei Rottami, dove la Città Bassa scarica
            quello che non vuole. Profondità: non indicata. Data: la settimana
            scorsa. Qualcuno non vuole che si sappia. Adesso lo sai tu e, se ne
            parli nei posti giusti, fra poco lo sapranno altri.
          effetti: { informazioni.voce: 2 }
        fallimento:
          titolo: Il carboncino
          testo: |
            Guardi, riguardi, inclini la testa finché ti fa male il collo.
            Niente. Chiunque abbia usato quel carboncino sapeva il fatto suo.

            Il carboncino ha fatto il suo lavoro. Tu no.
          effetti: {}
