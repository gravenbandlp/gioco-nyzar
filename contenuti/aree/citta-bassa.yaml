aree:
  - id: citta-bassa
    immagine: ambientazione/citta-bassa
    nome: Città Bassa
    sommario: "Un altopiano di roccia a est della città, con il terreno che scalda dalle fenditure e il fumo delle fucine fermo all'altezza dei tetti. Il martello batte a ogni ora, e nelle bische si scommette anche di notte."
    testo: |
      La Città Bassa occupa un altopiano di roccia a est di Qir-Azel, che al
      tramonto prende il colore di un livido. Dalle fenditure del terreno sale
      un calore che non viene dal sole. D'inverno i cani ci si stendono sopra a
      dormire, e d'estate nessuno ci cammina scalzo. Le case di pietra grezza
      sono basse e rattoppate con la lamiera, o con gli scarti che i
      Raschiatori non sono riusciti a vendere, e su una porta su tre qualcuno
      ha dipinto il numero civico a mano, sbagliandolo quasi sempre di uno.
      Il fumo delle fucine non sale mai del tutto e ristagna all'altezza dei
      tetti, così che dopo un giorno quaggiù ti ritrovi a tossire nel sonno.

      Quaggiù il martello batte sempre, e quando smette di solito è morto
      qualcuno.

      Della sera del Festival delle Foglie Alate, quando gli orchi sono scesi
      sulla città, si parla ancora ovunque, ma a voce bassa. Nelle osterie si
      contano i morti e nelle botteghe i danni, mentre ai tavoli da gioco si
      scommette su chi sarà il prossimo.

      A ovest, sopra la Cicatrice, i Ponti Sospesi oscillano nel vento. Più in
      alto suonano le campane dei Quartieri Alti, dove si decide che cosa
      resterà scritto di questi giorni e che cosa verrà dimenticato.

      Quaggiù le gambe imparano presto dove il selciato scotta e dove
      conviene allungare il passo. Il lavoro non manca, e dopo la razzia c'è
      anche molto da chiedere.
    negozi: [banco-di-grusk, armeria-di-irsa, fucina-dei-due-mastini, emporio-tamberlo, il-salotto-di-nerissa, la-tua-bottega]

storylet:
  # ------------------------------------------------------------ azioni ripetibili
  - id: turno-acciaieria
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Un turno all'Acciaieria
    sommario: "Il turno di notte all'Acciaieria dei Tarvelin comincia quando la colata diventa azzurra, e il capoturno cerca braccia ferme."
    luogo: Acciaieria dei Tarvelin
    area: citta-bassa
    ripetibile: true
    # Con pista.acciaio da 1 a 7 l'Acciaieria è chiusa, occupata o spenta; dopo riapre solo con
    # acciaieria.futuro >= 1 (citta/minori.yaml), e il turno torna con la variante qui sotto.
    requisiti: [pista.acciaio < 1]
    testo: |
      All'Acciaieria il turno di notte comincia quando la colata diventa
      azzurra. Gli operai portano maschere di cuoio con le lenti di vetro
      affumicato, e sotto le maschere nessuno parla, perché dicono che il
      lyssan ascolta. È un metallo che va assecondato. Chi lo tratta male se lo
      vede virare di colore nello stampo, fino a un grigio da annegato che non
      vale più niente.

      Tu non tocchi il lyssan. Il tuo compito è spingere i carrelli della
      scoria ancora calda lungo rotaie posate storte vent'anni fa e tenute in
      squadra da allora con zeppe di legno, che ogni tanto prendono fuoco. Il
      capoturno ti guarda prima le mani e poi la faccia, perché gli servono
      braccia che non tremino. Tu tieni le dita larghe e ferme finché lui non
      decide che per stanotte le tue vanno bene.
    opzioni:
      - testo: "Spingere i carrelli di scoria fino all'alba"
        descrizione: "Serve forza nelle spalle e l'abitudine di non fissare la colata troppo a lungo."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Spalle in fiamme
          testo: |
            All'alba fischia la sirena del cambio. Hai le spalle in fiamme e le
            ciglia bruciacchiate, e in bocca ti è rimasto un sapore di ferro
            che nemmeno l'acqua della fontana riesce a mandare via.

            Il capoturno ti mette la paga del turno nel palmo una moneta alla volta, e a
            ogni moneta ti guarda negli occhi per essere sicuro che te ne
            ricorderai. Fuori la Città Bassa ha già ripreso a battere.
          effetti: { monete: 4 }
        fallimento:
          titolo: Uno schizzo azzurro
          testo: |
            A metà strada un carrello s'impunta sulla rotaia storta. Spingi più
            forte e il carico si rovescia. Uno schizzo di colata ti prende
            l'avambraccio, e l'odore della carne bruciata prima ti mette fame e
            poi ti dà la nausea.

            Il capoturno ti paga lo stesso, un po' meno del pattuito. «La scoria
            per terra non la paghiamo» dice, senza togliersi la maschera, e la
            voce arriva da dentro il cuoio come da un'altra stanza. Poi ti fascia il braccio con uno
            straccio pulito. Da un uomo come lui, a quell'ora, è quasi una
            gentilezza.
          effetti: { monete: 2, ferite: 0.5 }

  # Il turno dopo che la fornace è stata riaccesa (acciaieria.futuro 1, 2 o 3, citta/minori.yaml).
  - id: turno-acciaieria-riaccesa
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Un turno all'Acciaieria
    sommario: "La fornace dei Tarvelin è di nuovo accesa, e il capoturno di notte cerca braccia ferme per i carrelli della scoria."
    luogo: Acciaieria dei Tarvelin
    area: citta-bassa
    ripetibile: true
    requisiti: [acciaieria.futuro >= 1]
    testo: |
      All'Acciaieria il turno di notte comincia quando la colata diventa
      azzurra. Sulla porta delle consegne la corona di foglie rosse per gli
      otto operai morti è secca e nessuno ha il coraggio di toglierla, e chi
      entra la sfiora con due dita. Gli operai portano maschere di cuoio con
      le lenti di vetro affumicato, e sotto le maschere nessuno parla, perché
      dicono che il lyssan ascolta.

      Tu non tocchi il lyssan. Il tuo compito è spingere i carrelli della
      scoria ancora calda lungo rotaie posate storte vent'anni fa e tenute in
