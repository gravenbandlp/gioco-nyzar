          effetti: { monete: 2, ferite: 0.5 }

  - id: orecchie-pignatta
    presso: pignatta-grassa
    immagine: ambientazione/pignatta-grassa
    titolo: Orecchie aperte alla Pignatta Grassa
    sommario: "Alla Pignatta Grassa le notizie arrivano prima dei banditori, per chi offre da bere e sa stare zitto."
    luogo: Pignatta Grassa
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.pelle < 6]
    testo: |
      La Pignatta Grassa è la taverna che lo sceriffo sconsiglia ai forestieri,
      e per questo è sempre piena. Il fumo è così denso che le lanterne si
      vedono appena, e dopo un'ora ti bruciano gli occhi. Al tavolo verde un mezzelfo magro dalle mani curatissime
      mescola le carte e ogni tanto, con grande sfortuna, perde.

      Dietro il bancone c'è Mauro Scrocco, vestito color zafferano, con una
      pancia che entra nelle stanze prima di lui. Abbraccia chiunque arrivi per
      la prima volta, chiamandolo amico mio prima ancora di sapere come si
      chiama, e si ricorda di chiunque torni, soprattutto di chi ha lasciato un
      conto aperto. Il sidro è torbido, ma le
      voci che girano qui sono spesso più precise di quelle dei banditori, e
      arrivano prima. Per sentirle basta offrire da bere e saper stare zitti.
    opzioni:
      - testo: "Offrire da bere e ascoltare"
        descrizione: "Offri un giro al tavolo più chiacchierone e non fai domande, perché alla Pignatta le domande si pagano a parte."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Cose che non dovevi sentire
          testo: |
            Al tavolo siedono due carovanieri e un conciatore. C'è anche una
            donna che non dice che mestiere fa e tiene le mani sotto il tavolo
            per tutta la sera. Parlano della razzia e di chi ci
            ha guadagnato, poi abbassano la voce e passano a chi, dalla sera del
            Festival, non si è più fatto vedere. Tu tieni gli occhi sul sidro.

            Quando te ne vai hai due storie che non avresti dovuto sentire, e le
            metti via con la cura che si usa per i coltelli.
          effetti: { informazioni.voce: 2 }
        fallimento:
          titolo: Il prezzo della farina
          testo: |
            Paghi il giro, e per un'ora ascolti lamentele sul prezzo della
            farina e sui mulini che bruciano sempre dalla parte sbagliata della
            città.

            Mauro ti passa dietro e ti dà una pacca sulla spalla, così forte che
            il sidro ti va di traverso. «Si parla di tutto, qui, amico mio. Si
            dice nulla.» Poi torna al bancone a contare
            l'incasso della sera, compreso il tuo giro.
          effetti: { monete: -1 }

  - id: orlo-rottami
    presso: orlo-dei-rottami
    immagine: ambientazione/orlo-dei-rottami
    titolo: Frugare all'Orlo dei Rottami
    sommario: "Quello che i Raschiatori buttano via, qualcun altro lo raccoglie. Conviene arrivare prima di Grusk."
    luogo: Orlo dei Rottami
    area: citta-bassa
    ripetibile: true
    testo: |
      L'Orlo dei Rottami è una lingua di terra battuta sotto il margine ovest
      della Città Bassa, fra l'ultima fila di baracche e il bordo della
      Cicatrice. I Raschiatori ci scaricano a peso quello che non sono
      riusciti a vendere, soprattutto pezzi precuriani sfregiati e cristalli
      sterili.

      Una decina di spazzini autorizzati dalla Gilda smista la roba e la
      rivende. Il più rumoroso ha tatuaggi fin sulle palpebre e, mentre spinge
      una carriola rossa, canta sempre la stessa strofa di una canzone da
      osteria, perché il resto non se lo ricorda. Dalla voragine sale un vento
      che sa di ozono e ti fa prudere l'interno del naso.
      Se arrivi prima degli spazzini qualcosa si trova, altrimenti trovi
      Grusk.
    opzioni:
      - testo: "Setacciare i cumuli prima degli spazzini"
        descrizione: "Si fruga a mani nude. All'Orlo conta capire prima degli altri quali pezzi funzionano ancora."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Una scheggia che pulsa
          testo: |
            Sotto una lamiera annerita, in un groviglio di cavi, trovi una
            scheggia di metallo precuriano che pulsa ancora, anche se
            debolmente. È incisa con segni che sembrano spostarsi quando provi a
            fissarli, finché ti lacrimano gli occhi e smetti. Accanto ci sono due frammenti di cristallo esausti, opachi
            come denti vecchi, e anche quelli hanno un compratore.

            Avvolgi tutto in uno straccio. Lungo la riva senti cigolare una
            carriola rossa che si avvicina, riconosci anche la strofa, sempre
            quella, ed è ora di andarsene.
          effetti: { cristalli.frammento-esausto: 2, reliquie.scheggia: 1 }
        fallimento:
          titolo: Sapore di metallo
          testo: |
            Scavi a mani nude in un mucchio di rottami che puzza di ozono. Per
            ore non trovi niente che valga la fatica di piegarsi, e verso la
            terza la schiena comincia a fartelo notare.

            Quando ti rialzi hai sotto la lingua un sapore di moneta che ti
            resterà fino a sera. Alla Cripta, chi se ne intende dice che la
            contaminazione comincia così.
          effetti: { contaminazione: 0.5 }

      - testo: "Leggere il Mana nei cumuli"
        incantesimo: leggere-il-mana
        descrizione: "Passi le dita sui cristalli scartati e senti quali hanno ancora una carica."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Uno ancora vivo
          testo: |
            Molti cristalli sono freddi e muti sotto le dita. Uno, in fondo a un
            sacco di scarti della Gilda, ha ancora un battito lento, e quando
            lo senti il fiato ti si ferma in gola. I
            Raschiatori lo hanno buttato perché dall'esterno sembra sterile, e
            nessuno di loro sa leggere il Mana.

            Lo prendi insieme a due frammenti che valgono poco ma qualcosa.
          effetti: { cristalli.cristallo-sterile: 1, cristalli.frammento-esausto: 2 }
        fallimento:
          titolo: Troppo rumore
          testo: |
            Il campo è pieno di cariche deboli e disordinate, e non riesci a
            distinguerne nessuna. Dopo un'ora ti fanno male le tempie e hai
            le mani sporche di polvere grigia.
          effetti: { contaminazione: 0.5 }

      - testo: "Frugare di notte con la Luce fredda"
        incantesimo: luce-fredda
        descrizione: "Di notte gli spazzini non ci sono. Con una luce che non fa fumo nessuno ti vede dalla riva."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Il turno di notte
          testo: |
            La luce del cristallo è bianca e illumina un paio di passi attorno
            a te. Fra le lamiere trovi due schegge incise e una borsa di cuoio
            che qualcuno ha perso durante la razzia, con dentro una lettera.
            La lettera parla di un debito con la Pignatta, in una grafia che
            preme tanto da bucare la carta.
          effetti: { reliquie.scheggia: 2, informazioni.voce: 1 }
        fallimento:
          titolo: Buio pesto
          testo: |
            La luce trema e si spegne due volte. Alla terza rinunci e te ne vai
            inciampando nei cavi, con le dita intorpidite.
          effetti: {}

      - testo: "Cercare i cumuli delle squadre che conosci"
        descrizione: "Sui cumuli riconosci i segni a gesso delle squadre con cui hai fatto qualche turno. Chi scarica in fretta butta anche quello che si accende ancora."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Facile }
        successo:
          titolo: I segni a gesso
          testo: |
            Trovi il cumulo della squadra di Dragna dal segno a gesso sulle lamiere,
            una croce con un ricciolo, e ci frughi dentro con i guanti da piattaforma.
            Sotto una griglia piegata ci sono frammenti che qualcuno ha scaricato
            insieme alla ferraglia dopo un turno lungo, con la fretta di andare a
            bere. Grusk ti vede passare con la bisaccia piena e canta la sua strofa
            più forte, poi lascia correre, perché la roba dei Raschiatori a un
            Raschiatore non la pesa.
          effetti: { cristalli.frammento-esausto: 2 }
        fallimento:
          titolo: Il gesso sbiadito
          testo: |
            Il segno che cercavi la pioggia l'ha quasi lavato via, e il cumulo che
            apri è quello di una squadra che scarica soltanto ferro morto. Ci passi
            mezza mattina a rigirare griglie e cardini. Grusk ti guarda dalla carriola
            rossa e alla fine ti indica il cumulo giusto, che nel frattempo gli
            spazzini hanno già svuotato.

  - id: rissa-pignatta
    presso: pignatta-grassa
    immagine: personaggi/mauro-scrocco
    titolo: Una scommessa dietro la Pignatta
    sommario: "Nel cortile dietro la Pignatta c'è un cerchio di gesso, e dentro un tipo che cerca qualcuno da picchiare per la posta."
    luogo: Cortile della Pignatta Grassa
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.pelle < 6]
    testo: |
      Dietro la Pignatta c'è un cortile dove la luce arriva di sbieco e le
      guardie non vengono mai. Qualcuno ha tracciato per terra un cerchio di
      gesso, già mezzo cancellato dalle suole. Intorno, una dozzina di
      scommettitori si passa monete e insulti.

      Nel cerchio saltella un tipo con le nocche spaccate e l'alito che puzza
      di sidro, in cerca di qualcuno da picchiare. Vuole solo la posta, e
      chiunque gli stia davanti gli va bene, e le tue spalle si sono già
      alzate da sole. Dalla porta sul retro Mauro Scrocco segue le puntate
      con un bicchiere in mano e le segna col gesso sullo stipite.
    opzioni:
      - testo: "Entrare nel cerchio"
        descrizione: "Le regole sono due. Niente lame, e chi esce dal gesso ha perso, anche se la seconda la rispettano in pochi."
        combattimento: rissa-pignatta
        vittoria:
          titolo: Posta vinta
          testo: |
            Il tipo va giù al terzo scambio, e al quarto decide di restare a
            terra. Il cortile esplode in un urlo. Qualcuno ti mette in mano la
            tua parte della posta, una manciata di monete tiepide passate per molte mani,
            e qualcun altro ti versa del sidro in testa, che da queste parti è
            un complimento.

            Dalla porta, Mauro alza il bicchiere verso di te. Adesso sa chi sei,
            e tu non sai ancora se ti conviene.
          effetti: { monete: 8 }
        sconfitta:
          titolo: Contro il muro
          testo: |
            Ti risvegli con la guancia contro il muro, fuori dal cerchio. La tua
            quota è sparita, e con lei un dente. Più tardi lo ritrovi in tasca,
            rimesso lì da qualcuno con un certo scrupolo.

            Gli scommettitori sono già passati a un'altra coppia e nessuno ti
            guarda, che alla Pignatta è la forma di rispetto più comune.
          effetti: { monete: -3 }

  - id: ricucire-gramm
    presso: mercato-dei-nodi
    immagine: personaggi/nestor-gramm
    titolo: Farsi ricucire da Nestor Gramm
    sommario: "Nestor Gramm ricuce le ferite nel retro della sua Dispensa. Si entra dal vicolo."
    luogo: Il vicolo dietro la Dispensa di Gramm
    area: ponti-sospesi
    ripetibile: true
    # Nestor fugge quando colpisci il suo retrobottega (colpo.dispensa) e dopo pista.pelle 4 non torna
    # più (piste/pelle-scuri.yaml); come in citta/nodo.yaml, da lì in poi la Dispensa la tiene il garzone.
    requisiti: [ferite >= 0.5, pista.pelle < 4, colpo.dispensa == 0]
    testo: |
      Alla Dispensa di Gramm si entra dalla porta principale per comprare
      tisane, e dal vicolo per tutto il resto. Tu entri dal vicolo.

      Nestor Gramm è basso e tozzo. Porta un grembiule grigio pieno di
      macchie vecchie e tiene nella tasca destra uno straccio che non usa mai
      per pulire. Esamina le tue ferite con attenzione e senza simpatia, come
      un conto da saldare. Ogni tanto ha lo sguardo un po' perso, e in giro si
      dice che assaggi troppo spesso i propri preparati, ma le sue mani
      restano ferme.

      *Speriamo che oggi abbia assaggiato poco.* Il tuo stomaco, intanto, si
      è già stretto per conto suo.
    opzioni:
      - testo: "Pagare Nestor"
        descrizione: "Nestor non fa sconti e non fa domande, e da queste parti è uno scambio onesto."
        requisiti: [monete >= 10]
        esito:
          titolo: Ago e filo
          testo: |
            Ti fa sedere su una cassa che odora di zolfo. Ricuce con ago e
            filo, poi spalma un impasto verdastro che brucia parecchio e ti fa
            venire le lacrime agli occhi, anche se ti eri ripromesso di no. Lavora
            in silenzio e borbotta soltanto quando stringi troppo i denti.
            «Fermo. Il dolore è gratis, il filo no.»

            Quando ha finito conta le monete due volte e le fa sparire sotto il
            bancone. Non lo ringrazi, e lui sembra quasi sollevato di non dover
            rispondere.
          effetti: { monete: -10, ferite: -1 }

  - id: ricucire-dal-garzone
    presso: mercato-dei-nodi
    immagine: ambientazione/dispensa-di-gramm
    titolo: Farsi ricucire alla Dispensa
    sommario: "Nestor Gramm se n'è andato. Nel retro della Dispensa adesso ricuce il suo garzone, e si entra ancora dal vicolo."
    luogo: Il vicolo dietro la Dispensa di Gramm
    area: ponti-sospesi
    ripetibile: true
    requisiti: [ferite >= 0.5, pista.pelle >= 4]
    testo: |
      Alla Dispensa di Gramm si entra ancora dal vicolo, anche se Nestor
      Gramm non c'è più. Ti apre un ragazzo magro con il grembiule grigio del
      padrone, troppo lungo per lui e arrotolato due volte in vita, che tiene
      nella tasca destra lo stesso straccio che Nestor non usava mai per
      pulire. Ha imparato a ricucire guardando, e ogni tanto si ferma a
      ricordare il punto successivo con le labbra che si muovono.

      *Speriamo che abbia guardato bene.* Il tuo stomaco, intanto, si è già
      stretto per conto suo.
    opzioni:
      - testo: "Pagare il garzone"
        descrizione: "Il garzone chiede quello che chiedeva Nestor, e i conti li tiene sul muro con un chiodo."
        requisiti: [monete >= 10]
        esito:
          titolo: Ago e filo
          testo: |
            Ti fa sedere sulla stessa cassa che odora di zolfo. Ricuce piano,
            con la lingua fra i denti, poi spalma l'impasto verdastro di Nestor,
            che brucia come prima e ti fa venire le lacrime agli occhi. Ogni
            tanto ti chiede scusa senza un motivo preciso.

            Quando ha finito conta le monete due volte, come faceva il padrone,
            e segna una tacca sul muro accanto alla porta.
          effetti: { monete: -10, ferite: -1 }

  # Lo stesso garzone quando Nestor è fuggito al colpo del retrobottega, prima di pista.pelle 4.
  - id: ricucire-dal-garzone-dopo-il-colpo
    presso: mercato-dei-nodi
    immagine: ambientazione/dispensa-di-gramm
    titolo: Farsi ricucire alla Dispensa
    sommario: "Nestor Gramm se n'è andato. Nel retro della Dispensa adesso ricuce il suo garzone, e si entra ancora dal vicolo."
    luogo: Il vicolo dietro la Dispensa di Gramm
    area: ponti-sospesi
    ripetibile: true
    requisiti: [ferite >= 0.5, pista.pelle < 4, colpo.dispensa >= 1]
    testo: |
      Alla Dispensa di Gramm si entra ancora dal vicolo, anche se Nestor
      Gramm non c'è più. Ti apre un ragazzo magro con il grembiule grigio del
      padrone, troppo lungo per lui e arrotolato due volte in vita, che tiene
      nella tasca destra lo stesso straccio che Nestor non usava mai per
      pulire. Ha imparato a ricucire guardando, e ogni tanto si ferma a
      ricordare il punto successivo con le labbra che si muovono.

      *Speriamo che abbia guardato bene.* Il tuo stomaco, intanto, si è già
      stretto per conto suo.
    opzioni:
      - testo: "Pagare il garzone"
        descrizione: "Il garzone chiede quello che chiedeva Nestor, e i conti li tiene sul muro con un chiodo."
        requisiti: [monete >= 10]
        esito:
          titolo: Ago e filo
          testo: |
            Ti fa sedere sulla stessa cassa che odora di zolfo. Ricuce piano,
            con la lingua fra i denti, poi spalma l'impasto verdastro di Nestor,
            che brucia come prima e ti fa venire le lacrime agli occhi. Ogni
            tanto ti chiede scusa senza un motivo preciso.

            Quando ha finito conta le monete due volte, come faceva il padrone,
            e segna una tacca sul muro accanto alla porta.
          effetti: { monete: -10, ferite: -1 }

  - id: spalmare-unguento
    immagine: ambientazione/ampolle-e-rimedi
    titolo: Un unguento dal barattolo
    sommario: "Una pasta alla resina fatta con la ricetta di una nonna che, a quanto pare, non è morta di niente."
    area: citta-bassa
    ripetibile: true
    requisiti: [unguento >= 1, ferite >= 0.5]
    testo: |
      Il barattolo di terracotta è chiuso con cera e spago. Te l'ha venduto un
      tizio che giurava sulla ricetta di sua nonna, e sua nonna, a sentir lui,
      non era morta di niente.

      Dentro c'è una pasta grassa color muschio che odora di resina e di
      grasso di pecora. Ti siedi in un angolo dove nessuno ti vede e allenti
      le bende, che tirano sulle ferite e si staccano con un rumore che
      preferiresti non sentire. Oltre il muro si sente il martello
      della Città Bassa, che batte come ogni giorno.
    opzioni:
      - testo: "Usare l'unguento"
        descrizione: "Stendi due dita di pasta sulla ferita e speri che la nonna avesse ragione."
        esito:
          titolo: La nonna aveva ragione
          testo: |
            Prima pizzica e poi brucia, finché il bruciore smette di colpo. La
            pelle si tende e il dolore diventa sordo e lontano.

            Richiudi il barattolo, che adesso è più leggero, e ringrazi in
            silenzio la nonna.
          effetti: { unguento: -1, ferite: -0.5 }

  - id: cucire-voci
    titolo: Cucire insieme le voci
    sommario: "Hai raccolto cinque voci sulla razzia. Messe a confronto con pazienza, qualcuna potrebbe rivelarsi vera."
    area: citta-bassa
    ripetibile: true
    requisiti: [informazioni.voce >= 5]
    testo: |
      Hai raccolto cinque voci in cinque sere di sidro pagato, e non vanno
      d'accordo. Una dice che gli orchi sono entrati dalla porta nord, un'altra
      dal fiume. Una giura che lo sceriffo sapeva tutto, un'altra che lo
      sceriffo ha pianto.

      Le stendi sul tavolo e cominci a cercare i punti in cui si toccano. È un
      lavoro lento, da cronista del Velo, e dopo un po' ti accorgi che stai
      muovendo le labbra come fanno loro. Se lo fai con pazienza, qualcuna
      diventa un fatto e le altre restano chiacchiere da osteria, buone al
      massimo per un altro giro di sidro.
    opzioni:
      - testo: "Confrontarle e tenere solo ciò che regge"
        descrizione: "Scartare è la parte difficile. Ogni voce ha qualcuno che ci ha creduto abbastanza da ripeterla."
        esito:
          titolo: Resta una cosa sola
          testo: |
            A notte fonda hai scartato quattro storie e mezza, e ne resta una. È
            piccola e poco allegra, ma regge da qualunque lato la guardi.

            La scrivi su un pezzo di carta, poi ti accorgi che non serve. A
            Qir-Azel una cosa vera resta in testa a tutti, e alla fine qualcuno
            la compra.
          effetti: { informazioni.voce: -5, informazioni.pettegolezzo: 1 }

  # ------------------------------------------------------------ la pista della Dama d'Argento
  - id: parola-orchesca
    immagine: ambientazione/evento-razzia-festival-150
    titolo: Una parola orchesca
    sommario: "Gli orchi la gridavano mentre morivano, e adesso la Città Bassa la ripete sottovoce senza sapere cosa significhi."
    luogo: Città Bassa, nei giorni dopo il Festival
    area: citta-bassa
    requisiti: [pista.dama-argento == 0, informazioni.voce >= 2]
    testo: |
      Dopo la razzia delle Foglie Alate, in Città Bassa il martello ha
      ripreso a battere, ma più piano. I morti si seppelliscono in fosse
      comuni benedette in fretta, e le tende strappate si rattoppano con la
      stoffa delle bandiere del Festival, che è quella che avanza. Si
      contano anche gli orchi uccisi, e quelli che, braccati sull'orlo, hanno
      preferito saltare nella Cicatrice piuttosto che farsi prendere. Perché un
      orco si butti nel vuoto nessuno lo sa spiegare, e ai bambini non lo si
      racconta.

      Poi c'è la parola, *Mawrak'Thur*, che si sente nelle code alla fontana e
      sulla soglia delle botteghe. È dura da pronunciare, e nessuno la dice
      bene. Quando ci provi anche tu, a mezza voce, la lingua ti si impiglia
      sull'apostrofo. Gli orchi la gridavano mentre caricavano e mentre morivano, e
      alcuni anche mentre saltavano.

      La gente la pronuncia a voce bassa e finge di non sentirla quando la
      dicono gli altri. Una lavandaia giura che il capoguerra sul cinghiale
      corazzato la cantava come una preghiera, mentre per un facchino era una
      bestemmia. Tutti e due ignorano che cosa significhi, e preferiscono non
      saperlo.

      Tu invece vuoi saperlo, e in Città Bassa le informazioni si pagano con
      altre informazioni.
    opzioni:
      - testo: "Scambiare le tue voci con chi ha sentito di più"
        descrizione: "In Città Bassa il cambio corrente è di due storie per una, e nessuno rilascia ricevuta."
        requisiti: [informazioni.voce >= 2]
        esito:
          titolo: La vecchia delle castagne
          testo: |
            La trovi all'angolo del lavatoio, dietro un braciere che fa più
            fumo che calore. È una vecchia che vende castagne e conosce tutto
            quello che si è detto in quella strada negli ultimi quarant'anni. Le
            racconti le tue due storie, e lei le ascolta e le trova di suo
            gusto. Poi si china verso di te, con un odore di castagne bruciate
            che ti fa venire fame nonostante tutto.

            «Dama d'Argento, bello mio» dice. «Nella lingua degli orchi vuol
            dire così.»

            Gliel'ha detto un uomo giovane, una sera, con troppo liquore in
            corpo e le mani che non stavano ferme. La faccia l'ha dimenticata, ma
            si ricorda che aveva paura.

            «Degli orchi non aveva paura» precisa, e ti porge un cartoccio di
            castagne che non hai chiesto. «Aveva paura di quella parola.»
          effetti: { informazioni.voce: -2, pista.dama-argento: 1 }
      - testo: "Fare domande in giro, con discrezione"
        descrizione: "Fai qualche domanda qua e là come per curiosità, e mai due volte alla stessa persona."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Tre volte la stessa
          testo: |
            Te la traduce un carovaniere al ponte, poi una tintora con le mani
            blu fino ai gomiti, e infine un ragazzino che si fa pagare in
            anticipo. Nessuno dei tre conosce gli altri, eppure dicono tutti la
            stessa cosa a bassa voce, con lo stesso piccolo scatto
            delle spalle che si fa passando accanto a un cane che dorme.

            *Mawrak'Thur* vuol dire Dama d'Argento.

            Chi sia la Dama, e chi abbia tradotto la parola per primo, non lo sa
            nessuno dei tre. Sono sicuri soltanto che chi l'ha detta la prima
            volta non stava ridendo.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Troppe domande
          testo: |
            Fai una domanda di troppo sulla stessa parola e la gente si chiude.
            La tintora smette di sorriderti, e il carovaniere si ricorda
            all'improvviso di avere fretta.

            Quando giri l'angolo senti che qualcuno ti guarda andare via, un po'
            troppo a lungo. Da queste parti è poco più di una nota a margine, ma
            a Qir-Azel le note a margine finiscono spesso nei registri sbagliati.
          effetti: { sospetto: 0.5 }

  - id: lingua-dei-chiodi
    presso: pignatta-grassa
    immagine: fazioni/tribu-nove-chiodi
    titolo: Chi parla la lingua dei Nove Chiodi
    sommario: "La traduzione non basta. Serve qualcuno in città che parli l'orchesco dei Nove Chiodi, e che da quella sera ha paura."
    luogo: Pignatta Grassa
    area: citta-bassa
    requisiti: [pista.dama-argento == 1]
    testo: |
      Adesso sai che *Mawrak'Thur* vuol dire Dama d'Argento, e da quando lo
      sai la parola ti torna in mente nei momenti meno adatti, perfino mentre
      ti allacci gli stivali. Resta da capire
      chi sia questa dama, e perché la chiamino d'argento. Quella sera gli
      orchi cantavano tutti la stessa litania, come se qualcuno li tenesse in
      fila. In città c'è chi ha capito abbastanza di
      quello che gridavano da averne paura.

      L'orchesco non si impara al mercato. Lo parlano gli orchi e qualche
      ranger che li caccia. In città lo sanno anche i pochi mercanti che hanno
      trafficato col Bosco della Forca abbastanza a lungo da imparare a
      contare i prezzi nella testa dei Nove Chiodi. Chi lo parla tende a non
      vantarsene, perché in Città Bassa la cosa fa nascere sospetti.

      Alla Pignatta Grassa il fumo è basso. Al tavolo dei carovanieri si beve
      per dimenticare la strada per Laresh. Dietro il bancone Mauro Scrocco
      lucida un bicchiere pulito da un'ora e aspetta che tu gli chieda quello
      per cui sei venuto.
    opzioni:
      - testo: "Chiedere tra i carovanieri"
        descrizione: "Chi fa la strada per Laresh conosce gli orchi meglio di quanto vorrebbe, e sa chi in città ci ha avuto a che fare."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Media }
        successo:
          titolo: Un nome
          testo: |
            Ci vogliono tre giri e una storia vera sulla razzia raccontata
            bene, e quando hai finito di raccontarla hai la gola più secca di
            prima. Un carovaniere con la barba bruciata da un lato si pulisce la
            bocca col dorso della mano.

            «Dole», dice, «Rennick Dole. Quello della Segheria, il
            responsabile. Suo padre commerciava pelli col Bosco della Forca e se
            lo portava dietro da ragazzino. Il vecchio voleva che il figlio
            imparasse a contare i prezzi nella testa degli orchi. Ha imparato
            anche il resto.»

            Un altro annuisce e aggiunge che Rennick parla l'orchesco meglio di
            chiunque in città. Dicono che sia tirchio e arrogante, uno che non
            offrirebbe da bere nemmeno al proprio funerale. Dalla sera del
            Festival, però, non si fa più vedere in giro. Alla Segheria dicono
            che è partito, ma nessuno sa dire quando.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Tutto tranne gli orchi
          testo: |
            I carovanieri parlano volentieri dei dazi dei Custodi e di un
            cavallo zoppo che è costato quanto un matrimonio. Degli orchi,
            invece, non vogliono parlare.

            Quando insisti, uno di loro posa il boccale con un colpo secco e
            cambia tavolo. Gli altri lo seguono con lo sguardo e poi guardano
            te, e la conversazione finisce lì.
          effetti: { sospetto: 0.5 }
      - testo: "Pagare Mauro Scrocco perché si ricordi di qualcosa"
        descrizione: "Mauro dice di non vendere informazioni. Presta memoria a interesse, e un anticipo basta a rinfrescargli la memoria."
        immagine: personaggi/mauro-scrocco
        requisiti: [monete >= 10]
        esito:
          titolo: Mauro si ricorda
          testo: |
            Mauro fa il giro del bancone per abbracciarti, e il suo alito ti
            arriva un momento prima delle braccia. Poi conta due volte le tue
            monete e le fa sparire in una tasca color zafferano.

            «Rennick Dole», dice, a voce abbastanza alta perché lo senta mezza
            sala e abbastanza distratta perché nessuno ci faccia caso, «il
            responsabile della Segheria. Parla la lingua di quelle bestie meglio
            di loro. Veniva qui a guardare gli altri perdere a carte, ma lui non
            giocava mai perché giocare costa.»

            Ti batte due colpi sul petto, come per chiudere una porta. «Dopo il
            Festival non è più venuto, e ha smesso di andare in un sacco di
            altri posti. Uno
            che ha paura, amico mio, si riconosce da dove non va.»

            Poi ti riaccompagna al tavolo tenendoti per il braccio. A un tavolo
            d'angolo, nel fumo, qualcuno si segna il tuo nome.
          effetti: { monete: -10, pista.dama-argento: 1, rep.scuri: 1 }

  - id: segheria-malgrani
    presso: segheria-e-mulino-malgrani
    immagine: ambientazione/segheria-di-qir-azel
    titolo: La Segheria Malgrani
    sommario: "Alla Segheria si lavora a testa bassa, con uomini in livrea al cancello. Marko Thessel ti riceve sotto il porticato."
    luogo: Segheria Malgrani, sul canale del cristallo
    area: citta-bassa
    requisiti: [pista.dama-argento == 2]
    testo: |
      Senti la Segheria prima di vederla. A cinquanta passi comincia un ronzio
      basso e regolare che ti entra nei denti. Il canale che la muove è
      artificiale, alimentato da un grosso cristallo conduttore romboidale che
      mette in moto l'acqua. Le pale girano e le lame tagliano. L'aria sa di
      resina, e i trucioli coprono il cortile come una neve gialla che a
      nessuno viene in mente di spalare.

      Il nome ufficiale è Segheria di Qir-Azel, ma tutti la chiamano Segheria
      Malgrani, perché la concessione è della famiglia e i Malgrani lo
      ricordano a tutti. Davanti al cancello stanno quattro uomini armati di
      mazze ferrate. Invece della divisa della guardia portano giacche di cuoio
      borchiato, con lo stemma di casa Malgrani sulla spalla sinistra, un
      albero trafitto da una lama. Oltre il cancello gli operai lavorano a
      testa bassa e in silenzio, e almeno due di loro hanno mani che non hanno
      mai tenuto una sega.

      Sotto il porticato Marko Thessel scende tre gradini senza fretta. È
      giovane e bello, e lo sa. *Scommetto che si specchia in ogni
      vetrina.* Porta una camicia di lino chiara e una matita
      da carpentiere dietro l'orecchio, e ti sorride con la cortesia di un
      commerciante.

      «A quest'ora la Segheria non riceve visite. Abbiamo commesse
      pressanti.»
    opzioni:
      - testo: "Chiedere di Rennick Dole"
        descrizione: "Fai una domanda semplice e garbata, poi guarda bene come ti rispondono."
        immagine: personaggi/rennick-dole
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Laresh, dice lui
          testo: |
            Marko allarga le braccia con aria dispiaciuta.

            «Rennick? È andato a Laresh per trattare con un grossista di
            legname, e torna fra qualche giorno. Se è una questione di
            forniture posso aiutarti io.» Dopo una pausa aggiunge: «Oppure no?»

            Lo dice troppo bene, con le parole in fila come assi appena piallate.
            Mentre parla, la sua mano destra scivola verso la cintura, nel punto
            dove si porta un'arma, anche se adesso non ne ha. Alle sue spalle uno
            degli uomini appoggiati al muro sbuffa dal naso, e quello sbuffo ti
            conferma quello che hai già capito.

            Marko Thessel mente e non si preoccupa che tu te ne accorga, perché
            è convinto che tu non possa farci niente. Ringrazi e te ne vai con
            passo tranquillo. Il ronzio del cristallo ti segue fino al ponte, e
            intanto ti chiedi per conto di chi stia mentendo.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: A Laresh, per legname
          testo: |
            «A Laresh», dice Marko, «per una trattativa sul legname. Tornerà fra
            qualche giorno.» Ha una voce piacevole, abituata ai mercanti che
            salgono in città due volte l'anno, e un modo di guardarti che ti fa
            sentire ben vestito anche se non lo sei.

            Per ora gli credi. Solo quando sei di nuovo in strada ti accorgi che
            i quattro uomini al cancello non ti hanno mai tolto gli occhi di
            dosso, e che uno di loro adesso sa come ti chiami.
          effetti: { sospetto: 0.5 }
      - testo: "Insistere, davanti ai suoi uomini"
        descrizione: "Marko è abituato a essere l'uomo più importante del cortile. Puoi provare a fargli cambiare abitudine davanti a tutti."
        immagine: personaggi/marko-thessel
        requisiti: [intimidire >= 1]
        combattimento: rissa-segheria
        vittoria:
          titolo: Sangue nella segatura
          testo: |
            Finisce con Marko Thessel in ginocchio nella segatura, la camicia
            chiara sporca di resina e di sangue. Lo sgherro in livrea è a terra
            poco più in là e non ha fretta di rialzarsi. Gli operai non si sono
            mossi e tengono gli occhi sui tronchi, mentre in fondo al capannone
            una sega a nastro gira a vuoto.

            Marko sputa sangue, e poi ride.

            «Maison des Lunes», dice, «in Via dei Rasoi. È lì dall'alba e non
            vuole farsi trovare da nessuno, te compreso.» Si pulisce la bocca col polso
            e ritrova il suo sorriso, un po' storto. «Ma fai pure. Vediamo chi
            arriva prima.»

            Te ne vai lasciandoti dietro un cortile silenzioso e un nemico con un
            cognome importante alle spalle. I Malgrani si segnano i nomi di chi
            fa sanguinare i loro soci, e non li dimenticano.
          effetti: { pista.dama-argento: 2, rep.malgrani: -2, racconto: 1 }
        sconfitta:
          titolo: Fuori dal cancello
          testo: |
            Sono più di quanti ne avessi contati, e il cortile è loro. Ti
            ritrovi fuori dal cancello con la faccia nella segatura e uno
            stivale piantato fra le scapole. Lo stemma dei Malgrani, l'albero
            trafitto dalla lama, ti sta a un palmo dagli occhi, e con la
            segatura in bocca hai tutto il tempo di studiarlo.

            Marko non si è nemmeno sporcato la camicia. «Salutami Laresh» dice
            qualcuno, e ridono tutti tranne gli operai.
          effetti: { rep.malgrani: -1 }
      - testo: "Andarsene"
        descrizione: "Non serve forzare questa porta oggi. Puoi tornare quando saprai qualcosa di più."
        costo: 0
        esito:
          titolo: Il rumore delle seghe
          testo: |
            Ti volti e te ne vai. Marko non ti saluta e ha già ripreso a parlare
            con uno dei suoi, a voce abbastanza alta perché tu senta la parola
            «curiosi».

            Il rumore delle seghe ti accompagna fino al ponte, poi si mescola a
            quello della Città Bassa e non distingui più il legno dal ferro.

  - id: sorriso-di-marko
    immagine: personaggi/marko-thessel
    titolo: Il sorriso di Marko
    sommario: "Marko sa che Rennick non è a Laresh. A fine turno esce dalla Segheria e prende una strada che non porta a casa sua."
    luogo: Città Bassa, al calar della sera
    area: citta-bassa
    requisiti: [pista.dama-argento == 3]
    testo: |
      Adesso sai che Rennick non è partito per Laresh, e che Marko ti ha
      mentito sapendolo.

      Al calar della sera la Segheria rallenta ma non si ferma. Il cristallo
      ronza anche quando le lame sono ferme, e i vicini se ne lamentano ogni
      sera dietro le persiane chiuse. Poco dopo il cambio degli uomini al
      cancello, Marko Thessel esce dall'ingresso laterale. Si è cambiato la
      camicia, come fa sempre a fine turno, e si è pettinato. Saluta con due
      dita gli uomini in livrea senza guardarli e si incammina.

      Non va verso casa, e nemmeno verso la Pignatta, dove un uomo come lui
      andrebbe a farsi vedere. Scende invece verso il margine dell'Orlo, dove i
      lastroni di pietra blu sono scheggiati e le lanterne illuminano la
      strada a chiazze. Cammina svelto, da uomo che conosce la strada e
      preferisce non farsi notare, e i tuoi piedi hanno già preso il suo
      passo.

      Puoi seguirlo, oppure tornare al cancello della Segheria. La donna che
      spazza la segatura a fine giornata sa di tutti più di quanto dica, e un
      creditore arrabbiato non sarebbe il primo che vede questa settimana.
    opzioni:
      # Chi ha già lavorato alla Maison (rep.maison >= 1) la riconosce: la variante sta in fondo, così gli id del doppiaggio non cambiano.
      - testo: "Seguirlo tra i vicoli"
        descrizione: "Tieni la distanza e cambia spesso lato della strada. Marko è vanitoso e si guarda nelle vetrine più che alle spalle."
        quando: [rep.maison < 1]
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Una luna incisa
          testo: |
            Lo segui per venti minuti oltre il margine dell'Orlo e poi su per
            Via dei Rasoi, una strada che non va mai dritta. A un certo punto fa
            un gomito ad angolo retto attorno a un vecchio cristallo conduttore
            spento, una scheggia opaca alta come due uomini.

            Tre porte dopo il cristallo, all'angolo con Via del Salmone, Marko
            si ferma davanti a una casa di legno di tre piani con le tende chiuse
            e nessuna insegna. Sulla porta scura è incisa una luna crescente, e
            accanto pende una catena di bronzo. Marko la tira. La porta si apre
            di una spanna e sulla soglia compare una halfling con i capelli
            raccolti. Si parlano poco. Lui indica il primo piano con il mento,
            lei scuote la testa una volta sola, e Marko se ne va senza entrare,
            più in fretta di come è venuto.

            Alzi gli occhi verso il primo piano e vedi una tenda che si richiude.
            Rennick Dole è lì dentro.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Al terzo angolo
          testo: |
            Al terzo angolo Marko si ferma davanti a una vetrina vuota, e nel
            vetro scuro incontra i tuoi occhi, e il sudore ti si raffredda di
            colpo sulla nuca. Si volta e ti sorride, con lo
            stesso sorriso che riserva ai mercanti di Laresh quando il prezzo
            non gli piace.

            Poi riprende a camminare verso la Pignatta, senza fretta. Domani
            mezza Segheria saprà che lo stavi seguendo, e l'altra metà lo saprà
            dopodomani.
          effetti: { sospetto: 1 }
      - testo: "Fingerti un creditore di Rennick con la portinaia della Segheria"
        descrizione: "Inventa un debito e presentati offeso, con una cifra abbastanza precisa da sembrare vera."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: L'unico posto dove li spende
          testo: |
            La portinaia è una donna larga e stanca, con una scopa di saggina e
            un'opinione su tutto. Le racconti di un debito con tanto di
            spiccioli, una cifra che nessuno si inventerebbe, e lei sbuffa prima
            ancora che tu abbia finito.

            Poi ride senza allegria e scuote la testa: «Rennick? Debiti? Quello
            conta i chiodi. Non ha mai offerto un bicchiere in vita sua.» Abbassa
            la voce e si guarda intorno prima di continuare: «Se ti deve dei
            soldi, chiedili alla Maison des Lunes, in Via dei Rasoi. È l'unico
            posto dove li spende. E ci va più spesso di quanto dovrebbe uno che si
            deve sposare.»

            Subito dopo si morde la lingua, e la vedi farlo davvero. Riprende a
            spazzare con forza, come se la segatura le avesse fatto un torto. Tu
            ringrazi e ti allontani prima che si penta del tutto.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: La bugia non regge
          testo: |
            La storia non la convince. Ti ascolta con la scopa ferma e alla fine
            dice soltanto: «Rennick non deve soldi a nessuno. È l'unico suo
            difetto che non sia un vizio.»

            Poi chiama per nome uno degli uomini al cancello. Te ne vai prima che
            arrivi, ma prima di sera la tua faccia e la storia che ci hai messo
            sopra hanno fatto il giro della Segheria, e prima di notte quello
            della Pignatta.
          effetti: { scandalo: 0.5 }
      - testo: "Chiedere agli spazzini dell'Orlo"
        descrizione: "All'Orlo dei Rottami si lavora fino a buio, e chi separa gli scarti vede passare tutti quelli che scendono da quella strada."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Facile }
        successo:
          titolo: Un uomo pettinato
          testo: |
            Uno degli spazzini autorizzati sta legando un fascio di tubi con il
            fil di ferro. Gli dai una mano a stringere il nodo e lui continua a
            lavorare mentre parla. Secondo lui l'uomo pettinato della Segheria
            passa di qui quasi ogni sera e sale per Via dei Rasoi fino al
            cristallo spento, poi gira l'angolo verso la casa con la luna sulla
            porta. Stasera l'ha visto tornare indietro dopo pochi minuti, senza
            essere entrato.

            Lo spazzino sputa nella polvere e indica con il mento la salita di
            Via dei Rasoi. «Per di là, sempre per di là» dice, e torna al suo
            fil di ferro.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Il peso della domanda
          testo: |
            Gli spazzini ti guardano come guardano la merce che arriva dai
            Raschiatori, per capire quanto pesa. Uno ti chiede chi ti manda,
            e quando non gli rispondi torna a separare il ferro dal rame. Il
            capo della squadra ti segue con lo sguardo finché non esci
            dall'Orlo.
          effetti: { sospetto: 0.5 }
      - testo: "Pagare un ragazzino perché lo segua al posto tuo"
        descrizione: "I ragazzini dell'Orlo seguono chiunque per poche monete, e nessuno ci fa caso."
        requisiti: [monete >= 6]
        esito:
          titolo: Il ragazzino col berretto
          testo: |
            Il ragazzino ha le ginocchia sbucciate e un berretto troppo grande.
            Conta le monete due volte, le infila nel berretto e sparisce dietro
            Marko prima che tu abbia finito di spiegargli cosa vuoi.

            Torna quando le lanterne sono già accese e ti racconta tutto
            d'un fiato. Marko è salito per Via dei Rasoi, ha tirato la catena di
            una casa con la luna incisa sulla porta e ha parlato con la
            portinaia senza entrare. Mentre scendeva, al primo piano si è
            mossa una tenda.
          effetti: { monete: -6, pista.dama-argento: 1 }
      - testo: "Seguirlo tra i vicoli"
        descrizione: "Tieni la distanza e cambia spesso lato della strada. Marko è vanitoso e si guarda nelle vetrine più che alle spalle."
        quando: [rep.maison >= 1]
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: La catena della porta davanti
          testo: |
            Lo segui per venti minuti oltre il margine dell'Orlo e poi su per
            Via dei Rasoi, e a metà salita i tuoi piedi hanno capito dove state
            andando prima di te. Marko gira attorno al cristallo spento e conta
            tre porte, fino alla Maison des Lunes. Tira la catena di bronzo
            della porta sulla strada, quella dei clienti. Tu entri sempre dal
            cortile di Via del Salmone, e quel campanello l'hai sentito suonare
            soltanto dalla cucina.

            La porta si apre di una spanna e sulla soglia compare Sara Beck, con
            il fermaglio d'argento nei capelli. Si parlano poco. Lui indica il
            primo piano con il mento, lei scuote la testa una volta sola, e
            Marko se ne va senza entrare, più in fretta di come è venuto. Prima
            di richiudere Sara guarda verso l'angolo dove ti sei fermato, e se
            ti ha riconosciuto non lo dà a vedere.

            Alzi gli occhi verso il primo piano e vedi una tenda che si
            richiude. Rennick Dole è lì dentro, qualche metro sopra la cucina
            dove Gretchen fa i conti la sera.
          effetti: { pista.dama-argento: 1 }
        fallimento:
          titolo: Al terzo angolo
          testo: |
            Al terzo angolo Marko si ferma davanti a una vetrina vuota, e nel
            vetro scuro incontra i tuoi occhi, e il sudore ti si raffredda di
            colpo sulla nuca. Si volta e ti sorride, con lo
            stesso sorriso che riserva ai mercanti di Laresh quando il prezzo
            non gli piace.

            Poi riprende a camminare verso la Pignatta, senza fretta. Domani
            mezza Segheria saprà che lo stavi seguendo, e l'altra metà lo saprà
            dopodomani.
          effetti: { sospetto: 1 }

  - id: luna-crescente
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: La lanterna accesa
    sommario: "Tre porte dopo il cristallo spento c'è una casa con una luna incisa sulla porta. Sopra, la lanterna è accesa."
    luogo: Via dei Rasoi, angolo Via del Salmone
    area: citta-bassa
    requisiti: [pista.dama-argento == 4]
    testo: |
      Via dei Rasoi non va mai dritta. Fa un gomito ad angolo retto attorno a
      un vecchio cristallo conduttore esaurito, e in Città Bassa lo usano per
      orientarsi. Quando qualcuno dice «tre porte dopo il cristallo spento»,
      tutti sanno di quale porta si parla.

      Tre porte dopo il cristallo, all'angolo con Via del Salmone, c'è una
      casa di legno di tre piani con le tende chiuse e nessuna insegna. Al
      centro della porta scura è incisa una luna crescente, così sottile che
      si vede solo quando la luce la prende di taglio. Accanto pende una catena
      di bronzo con due parole incise, *Ospiti Benvenuti*.

      Sopra la porta c'è una lanterna a olio, e stasera è accesa. In Città
      Bassa tutti conoscono la regola, anche quelli che giurano di non esserci
      mai stati. Quando la lanterna è accesa le ragazze ricevono, mentre una
      lanterna spenta vuol dire che dentro è successo un guaio.

      Da dietro le tende arrivano una conversazione a bassa voce e una risata
      di donna, ma nessuna musica. Alla Maison des Lunes non si suona mai. Pare
      che la padrona lo voglia così, perché la musica copre cose che è meglio
      sentire.

      Se quello che hai scoperto è vero, Rennick Dole è lì dentro, e ti
      viene da abbassare la voce anche se non stai parlando con nessuno.
    opzioni:
      # Chi ha già lavorato alla Maison (rep.maison >= 1) trova Sara che lo conosce: variante subito sotto.
      - testo: "Tirare la catena"
        descrizione: "Da qualche parte oltre le tende suona un campanello. Poi si sentono dei passi, e hai l'impressione che qualcuno ti stia contando."
        quando: [rep.maison < 1]
        esito:
          immagine: personaggi/sara-beck
          titolo: Le armi qui dentro
          testo: |
            Il campanello suona lontano oltre le tende. Dopo due secondi esatti
            la porta si apre.

            Sulla soglia c'è una halfling piccola, con gli occhi attenti e i
            capelli raccolti da un fermaglio d'argento. Ti squadra dalla testa ai
            piedi con una cortesia rapida, e la tua schiena si raddrizza da
            sola. Hai l'impressione che non dimenticherà la
            tua faccia. Alle sue spalle, dietro una tenda di velluto, si sposta
            di un dito un'ombra alta e larga il doppio di una persona.

            «Buonasera, sono Sara Beck. La Maison non riceve chi non ha
            appuntamento.» Poi ti guarda meglio, soffermandosi sugli stivali,
            che stasera hanno fatto parecchia strada, e aggiunge: «Però. Forse
            sei tu l'appuntamento che qualcuno aspetta.»

            Si fa da parte e ti lascia entrare. Dietro di lei ci sono un bancone
            curvo e un armadio chiuso a chiave, e lei lo indica con un sorriso
            vero quanto basta: «Le armi qui dentro. Il sorriso lo porti dove ti
            pare.»
          effetti: { pista.dama-argento: 1, rep.maison: 1, racconto: 1 }
      - testo: "Tirare la catena"
        descrizione: "La catena della porta sulla strada non l'hai mai tirata. Di solito entri dal cortile di Via del Salmone, e il campanello lo senti suonare dalla cucina."
        quando: [rep.maison >= 1]
        esito:
          immagine: personaggi/sara-beck
          titolo: Dalla porta davanti
          testo: |
            Il campanello suona lontano oltre le tende. Dopo due secondi esatti
            la porta si apre, e Sara Beck ti guarda dal basso, con il fermaglio
            d'argento nei capelli e la testa un po' inclinata, come davanti a un
            nome scritto nella colonna sbagliata della lavagnetta.

            «Dalla porta davanti, e senza avvisare» dice. Poi guarda meglio gli
            stivali, che stasera hanno fatto parecchia strada, e smette di
            sorridere. «Però. Forse sei tu l'appuntamento che qualcuno aspetta.»

            Dietro la tenda di velluto alle sue spalle si sposta di un dito
            un'ombra grande il doppio di una persona, poi torna ferma. Sara si fa da
            parte e ti lascia entrare. Indica l'armadio chiuso a chiave dietro
            il bancone curvo, quello dove la sera appende il grembiule. «Le armi
            qui dentro, anche le tue. Stasera sei un cliente.»
          effetti: { pista.dama-argento: 1, rep.maison: 1, racconto: 1 }

  # ------------------------------------------------------------ carte
  - id: carta-borseggiatore
    titolo: Una mano leggera
    sommario: "Al mercato del mattino qualcuno ti urta nella calca, e poco dopo la tua borsa è più leggera."
    tipo: carta
    area: citta-bassa
    testo: |
      In Città Bassa il mercato del mattino ti trascina dalla fontana fino
      all'altro lato della piazza, se va bene. Ci sono carretti di rape e
      gabbie di galline, e un predicatore del Velo parla di foglie e di ali a
      nessuno in particolare.

      Qualcuno ti spinge alla schiena, come succede di continuo nella calca, e
      una mano si ritira un momento troppo in fretta. Un ragazzo magro con il
      cappello calcato sulla fronte scivola già fra due banchi, senza correre,
      perché chi corre si fa notare.

      Senti che la borsa è più leggera prima ancora di toccarla, e lo stomaco
      ti scende di un gradino. Il ragazzo è
      ancora a portata di mano, ma fra poco non lo sarà più.
    opzioni:
      - testo: "Afferrarlo prima che sparisca"
        descrizione: "Scatti e provi a prenderlo per il bavero. Se sbagli, avrai afferrato l'aria davanti a trenta testimoni."
        prova: { attributo: fisico, abilita: [acrobazia, rissa], difficolta: Facile }
        successo:
          titolo: Per il bavero
          testo: |
            Lo prendi per il bavero un attimo prima che sparisca nella folla. È
            più giovane di quanto pensassi, ma abbastanza grande da sapere cosa
            rischia.

            Ti restituisce le monete senza discutere e, dopo un'occhiata alla tua
            faccia, ne aggiunge qualcuna che non era tua. «Per dimenticarti di
            me» dice, e tu lo lasci andare. Da queste parti un affare del genere
            si chiama buon vicinato.
          effetti: { monete: 3 }
        fallimento:
          titolo: Stoffa bagnata
          testo: |
            La tua mano si chiude su un lembo di stoffa, che si strappa come
            carta bagnata. Il ragazzo è già sparito, e con lui una parte delle
            tue monete.

            Qualcuno dietro di te ride. Una donna, con grande gentilezza, ti
            consiglia di tenere la borsa davanti come fanno tutti, e tu la
            ringrazi.
          effetti: { monete: -4 }
      - testo: "Inseguirlo fino in fondo al vicolo"
        descrizione: "Lui conosce le strade meglio di te, ma a volte basta la rabbia."
        combattimento: borseggio
        vittoria:
          titolo: Vicolo cieco
          testo: |
            Il vicolo finisce contro un muro di pietra blu che il ragazzo
            sperava di non trovare. Prova a difendersi con un coltellino da
            frutta, e quando glielo togli si mette a piangere.

            Quando lo lasci andare, zoppicante, ti ritrovi in mano un sacchetto
            unto con dentro le tue monete e quelle di mezza piazza. Non le
            restituirai, e comunque nessuno verrebbe a reclamarle da te.
          effetti: { monete: 6 }
        sconfitta:
          titolo: Meno sprovveduto
          testo: |
            Era meno sprovveduto di quanto sembrasse, e il vicolo lo conosceva
            meglio di te. Una gomitata e un calcio dove non si dovrebbe, e lui è
            già sul tetto di una stalla, agile come un gatto pieno di debiti.

            Ti rialzi con le ginocchia sbucciate e la borsa ancora più leggera.
            Da lassù il ragazzo ti fa un piccolo inchino, perché in Città Bassa
            anche i ladri hanno le buone maniere.
          effetti: { monete: -4 }

      - testo: "Chiamarlo con il fischio dei vicoli"
        descrizione: "Quel passo senza fretta l'hai imparato anche tu, alla stessa età. Nei vicoli dove sei cresciuto c'è un fischio che i ragazzi rispettano."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il fischio
          testo: |
            Fischi le due note che nel tuo vicolo volevano dire che uno era della
            casa. Il ragazzo si ferma fra due banchi senza voltarsi, poi torna
            indietro con le mani in tasca e la testa bassa. Ti rende la borsa con
            dentro uno spicciolo suo, perché il segnale vale anche per lui. Ti chiede
            chi te l'ha insegnato, e quando gli dici il nome del tuo vecchio capobanda
            fischia anche lui, piano, prima di sparire di nuovo nella calca.
          effetti: { monete: 2 }

  - id: carta-lanterna
    immagine: ambientazione/ponte-dei-morti
    titolo: Una lanterna che si accende da sola
    sommario: "Sul Ponte dei Morti una lanterna spenta da anni si è riaccesa da sola, e la sua luce pulsa."
    tipo: carta
    area: citta-bassa
    requisiti: [visto.carta-lanterna == 0]
    testo: |
      Dal margine della Città Bassa, guardando a ovest, si vedono i Ponti
      Sospesi tesi sopra la Cicatrice. Il più vecchio è il Ponte dei Morti,
      fatto di metallo nero e corde, dove i Raschiatori appendono una lanterna
      per ogni compagno disperso nel Labirinto. Ogni lanterna brucia finché
      regge il cristallo che ha dentro, di solito per anni. Poi si spegne, e
      nessuno la tocca più, anche se qualcuno continua a legarci accanto un
      nastro nuovo ogni primavera.

      Stanotte fra le luci di sempre ce n'è una in più. È una lanterna
      vecchia, spenta da così tanto tempo che i Raschiatori più giovani non
      sanno nemmeno di chi fosse, e si è riaccesa da sola. Le altre oscillano
      col vento, mentre questa pulsa. A guardarla la pelle delle braccia ti
      si tira come quando entri in acqua fredda.

      Accanto a te una donna si fa il segno dell'Albero e rientra in casa
      senza chiudere la porta.
    opzioni:
      - testo: "Restare a guardarla finché si spegne"
        descrizione: "Passi la notte all'aperto con gli occhi sulla lanterna. Domani in città qualcuno vorrà sapere cosa hai visto."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Come un cuore
          testo: |
            La guardi per ore, finché ti fa male il collo e le fenditure sotto
            di te smettono di scaldare. Conti i battiti senza riuscire a
            smettere. All'inizio la lanterna pulsa sessanta o settanta volte al
            minuto, poi sempre più piano, come un cuore che si addormenta.

            All'alba si spegne. Nessuno sul ponte l'ha toccata, per quanto tu
            possa esserne sicuro da così lontano. In città c'è chi pagherebbe per
            sapere quante volte ha battuto, e tu lo sai.
          effetti: { informazioni.pettegolezzo: 1 }
          imposta: { visto.carta-lanterna: 1 }
        fallimento:
          titolo: Dietro le palpebre
          testo: |
            Verso la terza ora ti viene in mente che la lanterna pulsi solo
            quando la guardi. È un pensiero stupido e lo sai, ma non riesci a
            toglierlo di testa.

            Rientri e chiudi le imposte, ma non riesci a dormire. Ogni volta che
            chiudi gli occhi vedi quella luce pulsare dietro le palpebre.
          effetti: { tormento: 0.5 }
          imposta: { visto.carta-lanterna: 1 }

  - id: carta-favore-scuri
    immagine: personaggi/rozalia-marga
    titolo: Un favore per gli Scuri
    sommario: "Rozalia Marga ha un pacco da far arrivare alla Pignatta, e non vuole domande."
    tipo: carta
    area: citta-bassa
    # Dopo pista.pelle 6 la Pignatta è bruciata e gli Scuri non esistono più come rete.
    requisiti: [rep.scuri >= 1, pista.pelle < 6]
    testo: |
      Rozalia Marga ti si affianca all'angolo senza che tu la veda arrivare, il
      che è notevole per una donna con una piuma d'oca dietro l'orecchio. Porta
      una mantellina scura e ha le dita macchiate d'inchiostro, che a quanto
      si dice lava una volta a settimana, per principio. Alla Pignatta dicono
      anche che nel suo retrobottega ci sia l'archivio di firme più ordinato
      della città, notai compresi. Lei non smentisce mai niente e continua a
      produrre documenti.

      «Ho un pacco da portare dal Mercato delle Ombre alla Pignatta» dice,
      guardando la strada invece di te. «Senza domande, e senza passare
      davanti alle guardie. Hai una faccia che nessuno ha ancora imparato a
      riconoscere, ed è un pregio che dura poco, quindi approfittane.»
    opzioni:
      - testo: "Portare il pacco"
        descrizione: "Devi solo consegnare il pacco. Il difficile è non chiederti che cosa contiene."
        esito:
          titolo: Tintinna
          testo: |
            Il pacco è avvolto in tela cerata e legato con uno spago troppo
            stretto. È pesante, e quando cammini tintinna con un suono piccolo e
            vetroso che preferiresti non aver sentito. Da lì in poi cammini più
            piano, senza averlo deciso. Sul ponte ti incrociano
            due guardie della Caserma, e una ti guarda un attimo più del
            necessario.

            Alla porta sul retro della Pignatta una mano prende il pacco, e ti
            arriva una borsa leggera che nessuno conta. Rozalia non si fa vedere per
            ringraziarti. Il tuo nome, in compenso, è già in un suo registro.
          effetti: { monete: 6, rep.scuri: 1, rep.caserma: -1, sospetto: 0.5 }
      - testo: "Rifiutare, guardandola in faccia"
        descrizione: "Le dici di no guardandola negli occhi. Con gli Scuri anche un rifiuto ha un prezzo, ed è meglio pagarlo subito."
        esito:
          titolo: Peccato
          testo: |
            Rozalia ti ascolta fino in fondo, con un'attenzione quasi
            professionale, come se stesse copiando la tua voce per usarla più
            tardi.

            «Peccato» dice. Poi si sistema la piuma dietro l'orecchio e se ne
            va, e per tutto il giorno hai la sensazione di aver firmato
            qualcosa.
          effetti: { rep.scuri: -1 }

  - id: carta-bollettino
    immagine: ambientazione/marea-grigia
    titolo: Il bollettino delle sacche
    sommario: "Il Velo ha affisso i bollettini delle sacche di Marea, e su uno qualcuno ha coperto una riga a carboncino."
    tipo: carta
    area: citta-bassa
    requisiti: [visto.carta-bollettino == 0]
    testo: |
      Ogni autunno, dopo le piogge, la Confraternita del Velo affigge i
      bollettini delle sacche di Marea Grigia risalite in superficie. Sono
      pergamene lunghe, inchiodate alle porte delle cappelle e agli angoli dei
      mercati, scritte nella grafia minuta dei cronisti. Per ogni sacca
      indicano il luogo e la data della segnalazione, e quando è possibile la
      profondità. In fondo, per i banchi che nessuno ha mai attraversato, c'è
      una parola sola, *oltre*.

      Quest'anno la lista è più lunga. La gente la legge muovendo le labbra in
      silenzio, e cerca il nome della propria strada sperando di non trovarlo.
      Un vecchio segue le righe col dito e, arrivato in fondo senza aver
      trovato la sua strada, lo annuncia ai vicini, che non lo ascoltano.

      A metà pergamena qualcuno ha coperto una riga a carboncino senza fretta
      e con mano ferma. Chi l'ha fatto non l'ha strappata né raschiata, e
      se guardi di sbieco si vede ancora il segno dell'inchiostro sotto il
      nero.
    opzioni:
      - testo: "Ricostruire la riga cancellata"
        descrizione: "Con la luce radente e un po' di pazienza si possono leggere i solchi lasciati dalla penna."
        prova: { attributo: mentale, abilita: [accademiche, natura], difficolta: Facile }
        successo:
          titolo: Una sacca sotto l'Orlo
          testo: |
            Ti ci vuole mezz'ora di lavoro con l'unghia, alla luce di una
            lanterna tenuta di sbieco.
            Il carboncino ha coperto l'inchiostro ma ha lasciato il solco della
            penna, e le lettere affiorano una alla volta, come pesci sotto il
            ghiaccio.

            La riga parla di una sacca sotto l'Orlo dei Rottami, dove la Città
            Bassa scarica quello che non vuole. La profondità non è indicata e
            la data è quella della settimana scorsa. Qualcuno ha voluto
            nasconderla, e adesso la conosci tu. Se ne parli nei posti giusti,
            fra poco la conosceranno anche altri.
          effetti: { informazioni.voce: 2 }
          imposta: { visto.carta-bollettino: 1 }
        fallimento:
          titolo: Il carboncino
          testo: |
            Guardi e riguardi, inclinando la testa finché ti fa male il collo,
            ma non riesci a leggere niente. Chi ha usato quel carboncino sapeva
            il fatto suo.
          effetti: {}
          imposta: { visto.carta-bollettino: 1 }

  # ------------------------------------------------------------ magia

  - id: rimarginare-da-se
    titolo: Una preghiera sulle ferite
    area: citta-bassa
    ripetibile: true
    immagine: fazioni/confraternita-del-velo
    requisiti: [incantesimo.rimarginare >= 1, ferite >= 0.5]
    sommario: "Le mani sulla ferita e la preghiera dei guaritori della Cattedrale."
    testo: |
      Trovi un angolo tranquillo, ti togli la benda e appoggi le mani sulla
      ferita, che sotto i palmi pulsa calda. La preghiera dei guaritori è lunga, e va detta tutta senza
      fermarsi.
    opzioni:
      - testo: "Recitare Rimarginare"
        incantesimo: rimarginare
        descrizione: "Se la preghiera riesce, la ferita si chiude di mezza tacca."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Una riga rosa
          testo: "Sotto le mani la pelle si scalda e la ferita si chiude, lasciando una riga rosa."
          effetti: { ferite: -0.5 }
        fallimento:
          titolo: Parole senza peso
          testo: "Arrivi alla fine della preghiera, ma la ferita resta com'era."
          effetti: {}
  - id: locanda-di-ilka
    titolo: La Locanda di Ilka
    luogo: Locanda di Ilka
    area: citta-bassa
    ripetibile: true
    immagine: ambientazione/locanda-di-ilka
    sommario: "Sidro, patate speziate e, dopo la chiusura, lezioni di magia al tavolo di cucina."
    testo: |
      La Locanda di Ilka è uno degli edifici più vecchi di Qir-Azel. Ha un
      solo piano, dipinto a colori vivaci con i motivi dei carri olvari, e
      sull'insegna c'è la Vecchia Luce fra tende e carri attorno a un falò.
      Sta in una strada appartata e ci vengono quasi solo quelli del
      quartiere.

      Ilka Dravec siede vicino al fuoco con gli occhi lattiginosi rivolti
      alla porta. Saluta per nome chi entra prima ancora che apra bocca, e ci
      azzecca due volte su tre. Dietro il banco sua figlia Besk serve sidro e patate
      speziate. Besk studia magia all'Accademia di Torvessa con Orvald
      Temmerin, e la sera, quando i clienti se ne vanno, apre i suoi
      quaderni sul tavolo di cucina per chi vuole imparare.
    opzioni:
      - testo: "Una seduta di studio con Besk"
        immagine: personaggi/besk-dravec
        descrizione: "Besk ti mostra come si tiene un cristallo e come si respira mentre lo si ascolta."
        prova: { attributo: mentale, abilita: magia, difficolta: Molto facile }
        successo:
          titolo: Un filo di luce
          testo: |
            Per un momento il cristallo sul tavolo si scalda sotto le tue dita
            e una luce azzurra gli attraversa le venature. Besk annota
            qualcosa sul quaderno mordicchiando la matita e ti dice di tornare.
          effetti: {}
        fallimento:
          titolo: Un sasso sul tavolo
          testo: |
            Il cristallo resta freddo per tutta la sera. Besk giura che le
            prime volte succede a tutti e ti versa un sidro.
          effetti: {}

      - testo: "Chiedere a Besk la sua prima formula"
        immagine: personaggi/besk-dravec
        requisiti: [magia >= 1, incantesimo.luce-fredda == 0, monete >= 15]
        costo: 2
        descrizione: "Besk insegna la Luce fredda a chi ha già sentito il cristallo rispondere. Chiede il prezzo dei suoi quaderni."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Luce fredda
          testo: |
            Besk ti fa ripetere la formula finché non la dici senza guardare il
            quaderno. Alla fine il cristallo si accende di una luce bianca che
            non scalda e non fa ombra. Ilka, dal suo angolo, dice che la
            stanza è diventata più fredda.
          effetti: { monete: -15, incantesimo.luce-fredda: 1 }
        fallimento:
          titolo: Domani
          testo: |
            La formula ti si confonde in bocca al terzo verso. Besk chiude il
            quaderno e ti dice di tornare domani, senza farti pagare.
          effetti: {}

      - testo: "Farsi insegnare il Dardo"
        immagine: personaggi/besk-dravec
        requisiti: [magia >= 1, incantesimo.luce-fredda >= 1, incantesimo.dardo == 0, monete >= 25]
        costo: 2
        descrizione: "Il primo incantesimo da combattimento che Orvald insegna ai suoi allievi. Besk lo insegna a un prezzo da amico, nel cortile sul retro."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Il segno sul muro
          testo: |
            Nel cortile, Besk ha disegnato un cerchio col gesso su un muro
            vecchio. Al decimo tentativo il tuo dardo lascia nel cerchio un
            segno nero che fuma ancora. Besk ti dice di non usarlo mai nella
            locanda, e dal tono si capisce che è già successo.
          effetti: { monete: -25, incantesimo.dardo: 1 }
        fallimento:
          titolo: Il muro è ancora lì
          testo: |
            Il cristallo scalda e poi non fa niente. Ci provate fino a
            mezzanotte, poi Besk chiude il quaderno e va a dormire.
          effetti: {}

      - testo: "Ascoltare le storie di Ilka"
        immagine: personaggi/ilka-dravec
        descrizione: "Ilka racconta i miti di Qir-Azel a chi si siede vicino al fuoco. A volte li confonde."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Facile }
        successo:
          titolo: La Vecchia Luce
          testo: |
            Ilka racconta del falò attorno a cui si fermarono i primi carri,
            dove oggi sorge la città, e di una luce che veniva dalla terra
            prima ancora che qualcuno la chiamasse Mana. A metà si ferma e dice
            che forse sta confondendo due storie. Una delle due, però, parla
            della Cicatrice in un modo che non hai mai sentito.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Il sonno di Ilka
          testo: |
            Ilka si addormenta a metà del racconto. Besk le mette una coperta
            sulle gambe e ti fa segno di parlare piano.
          effetti: {}

  - id: carta-cane-del-ricettatore
    titolo: Il cane del ricettatore
    tipo: carta
    area: citta-bassa
    immagine: ambientazione/orlo-dei-rottami
    sommario: "Un magazzino sprangato e un mastino alla catena che non ha ancora deciso cosa fare di te."
    requisiti: [visto.carta-cane-del-ricettatore == 0]
    testo: |
      Dietro la Conceria c'è il magazzino di un ricettatore che dopo la
      razzia non si è più visto. La porta è sprangata, ma la finestra sul
      retro è aperta, e dentro si vedono casse con il marchio della Gilda.

      Nel cortile c'è un mastino a pelo corto legato a una catena lunga. Ti
      guarda senza abbaiare e senza muoversi, con il collare di cuoio teso,
      e le tue gambe hanno già misurato da sole la distanza dal muro. La
      catena, ti accorgi, arriva fino alla finestra.
    opzioni:
      - testo: "Parlargli con il Richiamo"
        incantesimo: richiamo
        descrizione: "Nella lingua che il Circolo insegna ai bambini, gli spieghi che non sei un ladro. Almeno non oggi."
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Un amico per un'ora
          testo: |
            Il mastino abbassa le orecchie e si sdraia. Mentre passi ti annusa
            a lungo la mano e ti lascia entrare con uno sbuffo. Nelle casse ci sono schegge
            precuriane e un registro con nomi che qualcuno pagherebbe per
            leggere.
          effetti: { reliquie.scheggia: 1, oggetto.registro-del-ricettatore: 1 }
          imposta: { visto.carta-cane-del-ricettatore: 1 }
        fallimento:
          titolo: Denti
          testo: |
            Il cane ascolta, poi ti salta addosso. Riesci a scavalcare il muro
            con un morso sulla gamba.
          effetti: { ferite: 0.5 }

      - testo: "Affrontarlo"
        combattimento: cane-del-ricettatore
        descrizione: "È grosso, ma è solo un cane."
        vittoria:
          titolo: Il magazzino
          testo: |
            Il mastino scappa guaendo in fondo al cortile. Dentro trovi schegge
            precuriane e un registro con nomi che qualcuno pagherebbe per
            leggere.
          effetti: { reliquie.scheggia: 1, oggetto.registro-del-ricettatore: 1 }
          imposta: { visto.carta-cane-del-ricettatore: 1 }
        sconfitta:
          titolo: Ritirata
          testo: |
            Scavalchi il muro con il cane attaccato alla manica e ti lasci
            dietro metà della giacca.
          effetti: {}

      - testo: "Lasciar perdere"
        costo: 0
        esito:
          testo: "Il mastino ti segue con lo sguardo finché non giri l'angolo."

  # ------------------------------------------------------------ oggetti: reliquie in vendita
  - id: dietro-il-banco-di-irsa
    presso: armeria-di-irsa
    titolo: Dietro il banco di Irsa
    luogo: Armeria di Irsa
    area: citta-bassa
    ripetibile: true
    immagine: personaggi/irsa-valbrun
    sommario: "Le armi migliori Irsa non le espone. Le tiene dietro il banco e le vende a chi sa rispondere."
    testo: |
      Irsa Valbrun non ha una forgia e lavora sui pezzi che le fornisce
      Bram Halgast. I lavori migliori li tiene avvolti nel feltro dietro il
      banco, e prima di farteli vedere ti guarda le mani e il modo in cui
      stai in piedi. Tu, senza volerlo, sposti il peso sull'altra gamba.

      «Prima ti guardo, poi ti vendo» dice. Sul banco appoggia un arco
      composito con due ghiere a vite sul ventre e una balestra con il
      calcio d'avorio, e accanto un set di tre asce da lancio. Al centro
      della bottega, su un manichino, c'è una cotta di maglia con le spalle a
      ventaglio. Qualcuno ha disegnato a carboncino una faccia sulla testa
      del manichino, con i baffi.
    opzioni:
      - testo: "L'arco composito: «Mira»"
        immagine: reliquie/arco-lungo-composito
        requisiti: [oggetto.arco-lungo-composito-mira == 0, oggetto.arco-lungo-composito-forza == 0, monete >= 1600]
        descrizione: "Irsa vende l'arco solo a chi risponde alla sua domanda: «Mira o forza?». Tu rispondi mira."
        esito:
          titolo: Mira
          testo: |
            Irsa gira le ghiere di un quarto di giro e prova la corda con il pollice.
            «Per chi vuole passare le armature» dice, e te lo consegna.
          effetti: { monete: -1600, oggetto.arco-lungo-composito-mira: 1 }
      - testo: "L'arco composito: «Forza»"
        immagine: reliquie/arco-lungo-composito
        requisiti: [oggetto.arco-lungo-composito-mira == 0, oggetto.arco-lungo-composito-forza == 0, monete >= 1600]
        descrizione: "Irsa vende l'arco solo a chi risponde alla sua domanda: «Mira o forza?». Tu rispondi forza."
        esito:
          titolo: Forza
          testo: |
            Irsa stringe le ghiere fino in fondo e l'arco scricchiola.
            «Per chi vuole che la freccia arrivi e resti» dice, e te lo consegna.
          effetti: { monete: -1600, oggetto.arco-lungo-composito-forza: 1 }
      - testo: "La balestra Vansaya"
        immagine: reliquie/balestra-vansaya
        requisiti: [oggetto.balestra-vansaya == 0, monete >= 2600]
        descrizione: "Caricatore a leva da sei dardi. L'ha venduta un avventuriero diretto alle Rovine dei Precursori, che non è mai tornato."
        esito:
          titolo: Vansaya
          testo: |
            Irsa ti mostra come si arma la leva e come si sblocca il caricatore
            quando si inceppa. Sul nome inciso nel calcio non sa dirti niente.
            «Il ragazzo che me l'ha venduta diceva che non smette di aspettare.»
          effetti: { monete: -2600, oggetto.balestra-vansaya: 1 }
      - testo: "Le asce da lancio"
        immagine: reliquie/asce-da-lancio-set
        requisiti: [oggetto.asce-da-lancio == 0, monete >= 1400]
        descrizione: "Tre asce gemelle. Irsa le vende solo tutte insieme."
        esito:
          titolo: Tre asce
          testo: |
            Irsa te le lega alla cintura e ti fa lanciare la prima contro il
            ceppo in fondo alla bottega. Dopo il lancio ti ritrovi l'ascia in
            mano senza sapere come.
          effetti: { monete: -1400, oggetto.asce-da-lancio: 1 }
      - testo: "La cotta di maglia di Irsa"
        immagine: reliquie/cotta-di-maglia-irsa
        requisiti: [oggetto.cotta-di-maglia-di-irsa == 0, monete >= 1800]
        descrizione: "Anelli e cuoio sottile, spalle a ventaglio. Regge i colpi meglio di qualsiasi cotta in città, ma si fa sentire la sera."
        esito:
          titolo: Il manichino è vuoto
          testo: |
            Irsa ti aiuta a infilarla e stringe le cinghie sui fianchi.
            «Ti stancherà di più la sera» dice. «Ma ci arriverai, alla sera.»
          effetti: { monete: -1800, oggetto.cotta-di-maglia-di-irsa: 1 }
      - testo: "Il giaco di maglia"
        immagine: reliquie/giaco-di-maglia-irsa
        requisiti: [oggetto.giaco-di-maglia-di-irsa == 0, monete >= 2100]
        descrizione: "Maglia fitta con il zig-zag di anelli di bronzo, che attutisce il rumore della maglia."
        esito:
          titolo: Il bronzo
          testo: |
            Fai qualche passo nella bottega. La maglia non tintinna e Irsa
            annuisce. Ti fa vedere il nodo a sei passi degli anelli di bronzo,
            che serve a riconoscere i falsi.
          effetti: { monete: -2100, oggetto.giaco-di-maglia-di-irsa: 1 }
      - testo: "Ordinare il cuoio borchiato"
        immagine: reliquie/armatura-cuoio-borchiato
        requisiti: [oggetto.cuoio-borchiato-di-irsa == 0, attesa.cuoio-borchiato == 0, monete >= 1500]
        descrizione: "L'armatura personale di Irsa. Prima di venderla deve adattarla sul tuo corpo, e ci vuole tempo."
        esito:
          titolo: Le misure
          testo: |
            Irsa ti prende le misure con una cordicella annodata e segna tutto su
            un foglio. «Torna quando vuoi. Prima di domani non sarà pronta.»
          effetti: { monete: -1500, attesa.cuoio-borchiato: 1 }
      - testo: "Ritirare il cuoio borchiato"
        immagine: reliquie/armatura-cuoio-borchiato
        requisiti: [attesa.cuoio-borchiato >= 1]
        descrizione: "Irsa ha finito di adattare l'armatura."
        esito:
          titolo: Su misura
          testo: |
            L'armatura ti calza come se l'avessi sempre portata. La spirale di
            filo cremisi sul petto ha cinque rune, e Irsa te le fa toccare una
            per una prima di lasciarti andare.
          effetti: { attesa.cuoio-borchiato: -1, oggetto.cuoio-borchiato-di-irsa: 1 }

  - id: la-fucina-dei-due-mastini
    presso: fucina-dei-due-mastini
    titolo: La Fucina dei Due Mastini
    luogo: Fucina dei Due Mastini
    area: citta-bassa
    ripetibile: true
    immagine: ambientazione/fucina-dei-due-mastini
    sommario: "Bram Halgast tiene tre pezzi appesi alla parete, e non sono in vendita per chiunque."
    testo: |
      La Fucina dei Due Mastini è calda anche d'inverno. Bram Halgast lavora
      a torso nudo con due cani sdraiati vicino all'incudine, che non alzano
      la testa nemmeno quando il martello cade a un palmo da loro. Firma ogni
      pezzo con un martello di pietra inciso.

      Sulla parete di fondo sono appesi tre lavori che non stanno con gli
      altri. C'è uno spadone con la lama larga e scura, un martello con il
      marchio delle incudini sulla testa e una corazza di piastre
      irregolari, rifatta più volte. Bram dice che sono in vendita, ma ti
      guarda come se volesse sapere a cosa ti servono.
    opzioni:
      - testo: "Il Re della Collina"
        immagine: reliquie/spadone-re-della-collina
        requisiti: [oggetto.re-della-collina == 0, monete >= 1700]
        descrizione: "Uno spadone che colpisce più forte quando sei ferito."
        esito:
          titolo: Un round in più
          testo: |
            Bram lo stacca dalla parete e te lo porge dall'elsa. Ti racconta del
            mercenario che con quella spada è rimasto in piedi un round più del
            dovuto, e del nome che gli hanno dato i clienti dopo.
          effetti: { monete: -1700, oggetto.re-della-collina: 1 }
      - testo: "Il martello dei Due Mastini"
        immagine: reliquie/martello-due-mastini
        requisiti: [oggetto.martello-dei-due-mastini == 0, monete >= 2100]
        descrizione: "Un vecchio martello da fucina riforgiato per la guerra. Sfonda porte e gusci."
        esito:
          titolo: Il marchio delle incudini
          testo: |
            Bram lo soppesa un'ultima volta prima di dartelo. «Era il martello di
            mio padre» dice. «Tienilo lontano dalle incudini, non gli piace
            tornare indietro.»
          effetti: { monete: -2100, oggetto.martello-dei-due-mastini: 1 }
      - testo: "La corazza ostinata"
        immagine: reliquie/corazza-ostinata
        requisiti: [oggetto.corazza-ostinata == 0, monete >= 2300]
        descrizione: "Piastre rifatte tre volte. Ti tiene in piedi quando dovresti cadere, e la sera te lo fa pagare."
        esito:
          titolo: Rifatta tre volte
          testo: |
            Bram ti aiuta a indossarla e ti fa vedere i punti in cui è stata
            rifatta. Il pettorale era di un cliente morto, le spalliere di un
            Raschiatore tornato vivo dal Labirinto.
          effetti: { monete: -2300, oggetto.corazza-ostinata: 1 }

  - id: carta-guscio-che-ronza
    titolo: Un guscio che ronza
    tipo: carta
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.iniettore == 0]
    sommario: "Qualcosa fra i rottami emette un ronzio che non viene da nessuna macchina della città."
    testo: |
      All'Orlo dei Rottami un gruppo di ragazzi si è radunato attorno a un
      guscio di metallo grande come un pugno, mezzo sepolto nella terra.
      Ronza, e ogni tanto una luce azzurra passa sotto la superficie. Il
      ronzio ti fa venire la pelle d'oca sul dorso delle mani. Uno
      dei ragazzi ha un bastone in mano e sta decidendo se colpirlo.

      I Raschiatori dicono che le cose dei Precursori vanno lasciate dove
      sono. I ricettatori dicono che vanno vendute subito.
    opzioni:
      - testo: "Comprarlo dai ragazzi"
        requisiti: [monete >= 5]
        descrizione: "Basta qualche spicciolo e i ragazzi se ne vanno contenti."
        esito:
          titolo: Il guscio
          testo: |
            I ragazzi prendono le monete e scappano prima che tu cambi idea.
            Il guscio si apre fra le tue mani come un frutto maturo. Dentro c'è
            un cilindro lungo come un dito, con un ago che esce e rientra.
          effetti: { monete: -5, oggetto.iniettore: 1 }
      - testo: "Mandarli via e prenderlo"
        prova: { attributo: sociale, abilita: [intimidire, conoscenze-della-strada], difficolta: Facile }
        descrizione: "Sono ragazzi, e non hanno voglia di discutere con un adulto."
        successo:
          titolo: Il guscio
          testo: |
            I ragazzi se ne vanno borbottando. Il guscio si apre fra le tue mani
            come un frutto maturo. Dentro c'è un cilindro lungo come un dito,
            con un ago che esce e rientra.
          effetti: { oggetto.iniettore: 1 }
        fallimento:
          titolo: Il bastone
          testo: |
            Il ragazzo col bastone colpisce il guscio prima che tu arrivi. Il
            ronzio si ferma, e i pezzi finiscono nelle tasche di tutti tranne
            che nelle tue.
          effetti: {}
      - testo: "Lasciarlo dove sta"
        costo: 0
        esito:
          testo: "Te ne vai, e dopo qualche passo senti il colpo del bastone e poi più niente."
