          testo: &rozalia-4 |
            L'ultima lezione Rozalia la dà nel retro di una rivendita di sale. I sacchi di sale grosso sono
            impilati fino al soffitto e l'aria ti secca le labbra. Ti insegna come si sta in una stanza in
            modo che nessuno, dopo, sappia dire se c'eri, e come si risponde a una domanda senza mai dire una
            cosa falsa. Prima di lasciarti andare ride, e ti fa promettere che non lo insegnerai a nessuno.
          effetti: { monete: -800 }
