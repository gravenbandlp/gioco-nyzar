# L'addestramento a pagamento, alla Skyrim (Luca, 12 ottobre 2026): nove maestri, uno per fazione o bottega, e ogni
# abilità ha un maestro solo. Ogni lezione costa un rintocco e del denaro, non ha prova e dà 10 PE all'abilità (e,
# come tutti i PE, un quarto al suo attributo). Nessun tetto al numero di lezioni.
# - Il livello dell'abilità sta in `quando`: si vede solo la lezione del livello a cui sei (2, 3 o 4). Sotto il 2 si
#   impara con l'allenamento di base (`allenamento.yaml`), a 5 non c'è più niente da imparare.
# - Monete e reputazione stanno in `requisiti`: la lezione si vede chiusa finché mancano.
# - Prezzi: 200 al livello 2, 400 al 3, 800 al 4. Reputazione: 4 per i livelli 2 e 3, 8 per il 4 (alla Fucina 3 e 6).
# - Gli esiti non nominano l'abilità e sono scritti una volta per maestro e per livello: le altre abilità dello
#   stesso maestro li riusano con le ancore YAML.
# Maestri e luoghi: Bram Halgast (Fucina dei Due Mastini), Duilio Gasti (Guarnigione), Dragna Gro-Malog (Grifone di
# Ferro), Rozalia Marga e Nerissa Dalvane (Via dei Rasoi), Aelion Farethil (Bosco di Velthar, che si apre con la quest
# del Circolo), Agnese Lunardi (Accademia di Torvessa), Ottilia Sanvel (Cattedrale del Velo), Lira Demos (Casa dei
# Nodi, che si apre con la quest della Gilda).

storylet:
  # ------------------------------------------------------------ Bram Halgast · rep.botteghe
  - id: le-lezioni-di-bram
    presso: fucina-dei-due-mastini
    immagine: personaggi/bram-halgast
    titolo: Le lezioni di Bram
    sommario: "Per un prezzo che non tratta, Bram Halgast insegna a chi sa già tenere un'arma in mano quello che ai garzoni non dice."
    luogo: Fucina dei Due Mastini, dopo la chiusura
    area: citta-bassa
    ripetibile: true
    marchio: addestramento
    testo: |
      Quando l'ultimo cliente se ne va, Bram Halgast abbassa a metà la saracinesca e resta nel cortile con una
      lama spuntata e una bottiglia sul muro a secco. La lama ha il filo arrotondato a colpi di martello e la
      punta tagliata in tondo, e sul piatto porta i segni di tutte le guardie che ha corretto. Dà lezioni a
      chi gli sta simpatico e a chi paga, e i due mastini si sdraiano sulla soglia a fare da pubblico.

      «Chi non sa da che parte si prende una spada va dai garzoni, che fanno meno male» dice. «Se ne sai
      quanto me cercati un altro maestro, ma dubito che lo trovi a Qir-Azel.»

      Si gratta il petto nudo con il pomolo e aspetta la tua borsa. Il pomolo è di ottone e brilla soltanto
      dove il pollice lo tiene da anni. Il prezzo lo dice una volta sola, e cresce con quello che sai già.
    opzioni:
      # armi da mischia
      - testo: "Lezione di Armi da mischia"
        descrizione: &bram-armi "Bram ti corregge la guardia con il piatto della lama, e non sempre sul polso."
        quando: [armi-da-mischia == 2]
        requisiti: [rep.botteghe >= 3, monete >= 200]
        esito:
          titolo: &bram-2t Il cortile dopo la chiusura
          testo: &bram-2 |
            Bram ti fa ripetere lo stesso movimento finché la luce della forgia non si spegne, e ogni volta
            che sbagli ti fa ricominciare da capo senza spiegarti perché. Dopo un'ora la camicia ti si è
            incollata alla schiena, e il calore della forgia ti arriva soltanto sul fianco destro. Verso la
            fine smetti di pensarci, e il corpo fa da sé quello che gli è stato chiesto per tutta la sera. Lui
            annuisce una volta sola e torna alla sua bottiglia.
          effetti: { monete: -200 }
          pe: { armi-da-mischia: 10 }
      - testo: "Lezione di Armi da mischia"
        descrizione: *bram-armi
        quando: [armi-da-mischia == 3]
        requisiti: [rep.botteghe >= 3, monete >= 400]
        esito:
          titolo: &bram-3t La seconda bottiglia
          testo: &bram-3 |
            Stavolta Bram non si siede. Ti gira intorno nel cortile e ti colpisce dove sei scopert{o|a}, e
            dopo ogni colpo ti dice dove hai lasciato il buco, senza alzare la voce. I mastini alzano la testa
            a ogni colpo e la riabbassano sulle zampe quando ti rimetti in piedi. A sera hai i lividi
            dappertutto e il buco, quasi sempre, l'hai chiuso. Bram stappa la seconda bottiglia e te la passa
            per primo.
          effetti: { monete: -400 }
          pe: { armi-da-mischia: 10 }
      - testo: "Lezione di Armi da mischia"
        descrizione: *bram-armi
        quando: [armi-da-mischia == 4]
        requisiti: [rep.botteghe >= 6, monete >= 800]
        esito:
          titolo: &bram-4t Davanti all'incudine
          testo: &bram-4 |
            Bram ti porta dentro la fucina, davanti all'incudine dove firma i suoi pezzi, e per tutta la sera
            ti insegna le cose che ai garzoni non dice. Il piano dell'incudine è consumato a conca nel mezzo
            da anni di martello, e il ferro lì è così liscio che ci vedi riflessa la brace. Parla poco e beve
            meno del solito. Quando te ne vai ti batte forte una mano sulla spalla, e i mastini sulla soglia
            si spostano per lasciarti passare.
          effetti: { monete: -800 }
          pe: { armi-da-mischia: 10 }
      # rissa
      - testo: "Lezione di Rissa"
        descrizione: &bram-rissa "A mani nude nel cortile, contro un fabbro che ha passato la vita a battere il ferro."
        quando: [rissa == 2]
        requisiti: [rep.botteghe >= 3, monete >= 200]
        esito:
          titolo: *bram-2t
          testo: *bram-2
          effetti: { monete: -200 }
          pe: { rissa: 10 }
      - testo: "Lezione di Rissa"
        descrizione: *bram-rissa
        quando: [rissa == 3]
        requisiti: [rep.botteghe >= 3, monete >= 400]
        esito:
          titolo: *bram-3t
          testo: *bram-3
          effetti: { monete: -400 }
          pe: { rissa: 10 }
      - testo: "Lezione di Rissa"
        descrizione: *bram-rissa
        quando: [rissa == 4]
        requisiti: [rep.botteghe >= 6, monete >= 800]
        esito:
          titolo: *bram-4t
          testo: *bram-4
          effetti: { monete: -800 }
          pe: { rissa: 10 }
      # resistenza
      - testo: "Lezione di Resistenza"
        descrizione: &bram-resistenza "Ore al mantice e all'incudine nel caldo della forgia, finché il corpo smette di lamentarsi."
        quando: [resistenza == 2]
        requisiti: [rep.botteghe >= 3, monete >= 200]
        esito:
          titolo: *bram-2t
          testo: *bram-2
          effetti: { monete: -200 }
          pe: { resistenza: 10 }
      - testo: "Lezione di Resistenza"
        descrizione: *bram-resistenza
        quando: [resistenza == 3]
        requisiti: [rep.botteghe >= 3, monete >= 400]
        esito:
          titolo: *bram-3t
          testo: *bram-3
          effetti: { monete: -400 }
          pe: { resistenza: 10 }
      - testo: "Lezione di Resistenza"
        descrizione: *bram-resistenza
        quando: [resistenza == 4]
        requisiti: [rep.botteghe >= 6, monete >= 800]
        esito:
          titolo: *bram-4t
          testo: *bram-4
          effetti: { monete: -800 }
          pe: { resistenza: 10 }

  # ------------------------------------------------------------ Duilio Gasti · rep.caserma
  - id: le-lezioni-di-gasti
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Il cortile di Gasti
    sommario: "Il sergente d'addestramento della Caserma dà lezioni fuori orario a chi la Guardia conosce, e se le fa pagare."
    luogo: Guarnigione di Qir-Azel, il cortile
    area: quartieri-alti
    ripetibile: true
    marchio: addestramento
    testo: |
      Quando le reclute sono tornate in branda, Duilio Gasti resta nel cortile della Guarnigione a raddrizzare
      i manichini. Sono pali piantati nel selciato con un sacco di paglia legato in cima, e i più vecchi
      pendono tutti dallo stesso lato, quello dove le reclute colpiscono di più. Ha la voce di uno che urla da
      vent'anni e conta ad alta voce anche i passi fino alla rastrelliera o le monete che gli metti in mano.

      «Le lezioni fuori orario si pagano, e il furiere non ne sa niente» dice. «Chi non ha mai tenuto in mano
      una balestra vada sotto le Mille Corde dai Custodi, che con i principianti io ho già perso la voce. E
      chi ne sa più di me non mi faccia perdere la serata.»

      Dietro di lui un cavallo della Guardia mastica il fieno. Quando Gasti alza la voce il cavallo smette di
      masticare, e ricomincia appena il sergente tace.
    opzioni:
      # armi da distanza
      - testo: "Lezione di Armi da distanza"
        descrizione: &gasti-distanza "La balestra della Guardia contro i manichini del cortile, con Gasti che conta i colpi."
        quando: [armi-da-distanza == 2]
        requisiti: [rep.caserma >= 4, monete >= 200]
        esito:
          titolo: &gasti-2t Da uno a dodici
          testo: &gasti-2 |
            Gasti conta, e tu ripeti. Ogni volta che sbagli torna a uno senza arrabbiarsi, e intanto la sera
            si allunga sul cortile vuoto. Le ombre dei manichini attraversano il selciato e arrivano fino al
            muro del mastio. Quando finalmente arrivi a dodici il sergente tace per un momento. Poi scrive
            qualcosa su un pezzo di carta con un mozzicone di matita, lo piega in quattro e se lo mette nella
            tasca della giubba.
          effetti: { monete: -200 }
          pe: { armi-da-distanza: 10 }
      - testo: "Lezione di Armi da distanza"
        descrizione: *gasti-distanza
        quando: [armi-da-distanza == 3]
        requisiti: [rep.caserma >= 4, monete >= 400]
        esito:
          titolo: &gasti-3t Fuori orario
          testo: &gasti-3 |
            Il sergente ti fa lavorare con le cose vere della Guardia, che pesano di più e fanno male se le
            tratti male. Il cuoio delle cinghie è rigido e scurito dal sudore di chi le ha usate prima di te.
            Ti urla addosso da vicino finché non smetti di sobbalzare, e poi da lontano finché non smetti di
            aspettare che urli. Quando suona la campana della notte ti congeda con un cenno del mento.
          effetti: { monete: -400 }
          pe: { armi-da-distanza: 10 }
      - testo: "Lezione di Armi da distanza"
        descrizione: *gasti-distanza
        quando: [armi-da-distanza == 4]
        requisiti: [rep.caserma >= 8, monete >= 800]
        esito:
          titolo: &gasti-4t Oltre la porta nord
          testo: &gasti-4 |
            Gasti ti porta fuori dalla porta nord, dove le reclute non vanno, e ti insegna quello che ha
            imparato in trent'anni di Guardia. Per una volta parla piano e devi stargli a un passo per
            sentirlo. Senza le urla la sua voce è roca e stanca. Alla fine ti chiede di non raccontare in giro
            chi te l'ha insegnato, perché poi tutti vorrebbero lo stesso prezzo, e lui di sere libere ne ha
            poche.
          effetti: { monete: -800 }
          pe: { armi-da-distanza: 10 }
      # cavalcare
      - testo: "Lezione di Cavalcare"
        descrizione: &gasti-cavalcare "Un cavallo della Guardia e il giro delle mura al trotto, finché Gasti non è contento."
        quando: [cavalcare == 2]
        requisiti: [rep.caserma >= 4, monete >= 200]
        esito:
          titolo: *gasti-2t
          testo: *gasti-2
          effetti: { monete: -200 }
          pe: { cavalcare: 10 }
      - testo: "Lezione di Cavalcare"
        descrizione: *gasti-cavalcare
        quando: [cavalcare == 3]
        requisiti: [rep.caserma >= 4, monete >= 400]
        esito:
          titolo: *gasti-3t
          testo: *gasti-3
          effetti: { monete: -400 }
          pe: { cavalcare: 10 }
      - testo: "Lezione di Cavalcare"
        descrizione: *gasti-cavalcare
        quando: [cavalcare == 4]
        requisiti: [rep.caserma >= 8, monete >= 800]
        esito:
          titolo: *gasti-4t
          testo: *gasti-4
          effetti: { monete: -800 }
          pe: { cavalcare: 10 }
      # intimidire
      - testo: "Lezione di Intimidire"
        descrizione: &gasti-intimidire "Gasti ti insegna a farti obbedire con la voce, come si fa con le reclute il primo giorno."
        quando: [intimidire == 2]
        requisiti: [rep.caserma >= 4, monete >= 200]
        esito:
          titolo: *gasti-2t
          testo: *gasti-2
          effetti: { monete: -200 }
          pe: { intimidire: 10 }
      - testo: "Lezione di Intimidire"
        descrizione: *gasti-intimidire
        quando: [intimidire == 3]
        requisiti: [rep.caserma >= 4, monete >= 400]
        esito:
          titolo: *gasti-3t
          testo: *gasti-3
          effetti: { monete: -400 }
          pe: { intimidire: 10 }
      - testo: "Lezione di Intimidire"
        descrizione: *gasti-intimidire
        quando: [intimidire == 4]
        requisiti: [rep.caserma >= 8, monete >= 800]
        esito:
          titolo: *gasti-4t
          testo: *gasti-4
          effetti: { monete: -800 }
          pe: { intimidire: 10 }

  # ------------------------------------------------------------ Dragna Gro-Malog · rep.raschiatori
  - id: le-lezioni-di-dragna
    presso: grifone-di-ferro
    immagine: personaggi/dragna-gro-malog
    titolo: Il tavolo del Ferro
    sommario: "Dragna Gro-Malog compila i turni al Grifone di Ferro e, per un prezzo, insegna quello che si impara solo sulle piattaforme."
    luogo: Locanda del Grifone di Ferro, il tavolo di Dragna
    area: ponti-sospesi
    ripetibile: true
    marchio: addestramento
    testo: |
      Al suo tavolo del Grifone di Ferro, sotto la bacheca degli avvisi, Dragna Gro-Malog compila i turni
      davanti a un boccale che non finisce mai. La bacheca è coperta di fogli inchiodati uno sull'altro, e i
      chiodi più vecchi hanno lasciato sul legno aloni di ruggine. Tiene la penna con la sinistra a cui
      mancano due dita e scrive più in fretta di te.

      «Le reclute le addestro in Caserma, e le paga la città» dice senza alzare gli occhi. «Chi vuole lezioni
      fuori dai turni paga di tasca sua, e solo se lo conosco. I ragazzini che non sanno arrampicarsi giocano
      gratis all'Orlo dei Rottami.»

      Per il tuo nome posa la penna e prende un mozzicone di matita, e lo scrive in fondo al foglio. A chi ne
      sa quanto lei, aggiunge, non ha niente da vendere.
    opzioni:
      # atletica
      - testo: "Lezione di Atletica"
        descrizione: &dragna-atletica "Salite e corse sulle piattaforme di servizio, con il vento della Cicatrice di traverso."
        quando: [atletica == 2]
        requisiti: [rep.raschiatori >= 4, monete >= 200]
        esito:
          titolo: &dragna-2t Le piattaforme di servizio
          testo: &dragna-2 |
            Dragna ti fa lavorare con le reclute del mattino, sulle piattaforme di servizio sotto il Grifone,
            e ti corregge davanti a tutti come corregge loro. Le assi sono umide di nebbia e cedono di un dito
            sotto i passi di tutti insieme. Ripeti gli esercizi finché non li fai senza guardarla. Ogni tanto
            ti sposta un braccio con la mano sinistra, e le due dita che mancano le senti lo stesso.
          effetti: { monete: -200 }
          pe: { atletica: 10 }
      - testo: "Lezione di Atletica"
        descrizione: *dragna-atletica
        quando: [atletica == 3]
        requisiti: [rep.raschiatori >= 4, monete >= 400]
        esito:
          titolo: &dragna-3t In fondo alla scala di corda
          testo: &dragna-3 |
            Stavolta Dragna ti porta in fondo a una scala di corda sotto i Ponti, dove la luce delle lanterne
            arriva appena. Ti fa fare le stesse cose al buio, con il vento della Cicatrice che sale dal basso,
            e quando sbagli ti tira su per il colletto senza dire niente. Il vento è più tiepido dell'aria di
            sopra, e ogni tanto si ferma del tutto prima di ricominciare. Risalite che le lanterne del Grifone
            sono già spente.
          effetti: { monete: -400 }
          pe: { atletica: 10 }
      - testo: "Lezione di Atletica"
        descrizione: *dragna-atletica
        quando: [atletica == 4]
        requisiti: [rep.raschiatori >= 8, monete >= 800]
        esito:
          titolo: &dragna-4t Il boccale finito
          testo: &dragna-4 |
            Per tutta la sera Dragna ti racconta uno per uno come sono morti i Raschiatori che conosceva, e
            cosa avrebbero dovuto fare per non morire. Dice ogni nome con la stessa voce piatta con cui legge
            i turni. Poi ti porta sulle piattaforme a farlo. Quando tornate al Grifone finisce il boccale per
            la prima volta da quando la conosci, e ne ordina due.
          effetti: { monete: -800 }
          pe: { atletica: 10 }
      # acrobazia
      - testo: "Lezione di Acrobazia"
        descrizione: &dragna-acrobazia "Passerelle strette e travi sopra il vuoto, dove le reclute imparano a non guardare giù."
        quando: [acrobazia == 2]
        requisiti: [rep.raschiatori >= 4, monete >= 200]
        esito:
          titolo: *dragna-2t
          testo: *dragna-2
          effetti: { monete: -200 }
          pe: { acrobazia: 10 }
      - testo: "Lezione di Acrobazia"
        descrizione: *dragna-acrobazia
        quando: [acrobazia == 3]
        requisiti: [rep.raschiatori >= 4, monete >= 400]
        esito:
          titolo: *dragna-3t
          testo: *dragna-3
          effetti: { monete: -400 }
          pe: { acrobazia: 10 }
      - testo: "Lezione di Acrobazia"
        descrizione: *dragna-acrobazia
        quando: [acrobazia == 4]
        requisiti: [rep.raschiatori >= 8, monete >= 800]
        esito:
          titolo: *dragna-4t
          testo: *dragna-4
          effetti: { monete: -800 }
          pe: { acrobazia: 10 }
      # percezione
      - testo: "Lezione di Percezione"
        descrizione: &dragna-percezione "Dragna ti insegna ad accorgerti di una piattaforma che cede prima che ceda davvero."
        quando: [percezione == 2]
        requisiti: [rep.raschiatori >= 4, monete >= 200]
        esito:
          titolo: *dragna-2t
          testo: *dragna-2
          effetti: { monete: -200 }
          pe: { percezione: 10 }
      - testo: "Lezione di Percezione"
        descrizione: *dragna-percezione
        quando: [percezione == 3]
        requisiti: [rep.raschiatori >= 4, monete >= 400]
        esito:
          titolo: *dragna-3t
          testo: *dragna-3
          effetti: { monete: -400 }
          pe: { percezione: 10 }
      - testo: "Lezione di Percezione"
        descrizione: *dragna-percezione
        quando: [percezione == 4]
        requisiti: [rep.raschiatori >= 8, monete >= 800]
        esito:
          titolo: *dragna-4t
          testo: *dragna-4
          effetti: { monete: -800 }
          pe: { percezione: 10 }
      # conoscenze della strada
      - testo: "Lezione di Conoscenze della strada"
        descrizione: &dragna-strada "Chi comanda davvero sui Ponti e chi conviene evitare, raccontato da chi compila i turni."
        quando: [conoscenze-della-strada == 2]
        requisiti: [rep.raschiatori >= 4, monete >= 200]
        esito:
          titolo: *dragna-2t
          testo: *dragna-2
          effetti: { monete: -200 }
          pe: { conoscenze-della-strada: 10 }
      - testo: "Lezione di Conoscenze della strada"
        descrizione: *dragna-strada
        quando: [conoscenze-della-strada == 3]
        requisiti: [rep.raschiatori >= 4, monete >= 400]
        esito:
          titolo: *dragna-3t
          testo: *dragna-3
          effetti: { monete: -400 }
          pe: { conoscenze-della-strada: 10 }
      - testo: "Lezione di Conoscenze della strada"
        descrizione: *dragna-strada
        quando: [conoscenze-della-strada == 4]
        requisiti: [rep.raschiatori >= 8, monete >= 800]
        esito:
          titolo: *dragna-4t
          testo: *dragna-4
          effetti: { monete: -800 }
          pe: { conoscenze-della-strada: 10 }

  # ------------------------------------------------------------ Rozalia Marga · rep.scuri
  - id: le-lezioni-di-rozalia
    presso: via-dei-rasoi
    immagine: personaggi/rozalia-marga
    titolo: Le lezioni di Rozalia
    sommario: "Al gomito di Via dei Rasoi la falsaria degli Scuri insegna a passare inosservati e a mentire bene, a chi la banda conosce."
    luogo: Via dei Rasoi, il cristallo spento
    area: citta-bassa
    ripetibile: true
    marchio: addestramento
    testo: |
      Al gomito di Via dei Rasoi Rozalia Marga si pulisce le unghie con il coltellino da ufficio, la schiena
      contro il cristallo spento. Dà lezioni qui, di notte. Il cristallo è grigio e opaco, e all'altezza delle
      spalle è diventato lucido per tutte le schiene che ci si sono appoggiate.

      «Gli Scuri mi hanno detto chi sei, sennò non mi avresti vista» dice senza alzare la testa. «Insegno a
      chi sa già sparire e a chi le bugie le dice da sé. Per cominciare ci sono i ragazzini dell'Orlo o il
      vecchio del Mercato dei Nodi con il gioco dei tre nodi.»

      Si sistema la piuma d'oca dietro l'orecchio. Il prezzo è quello di un buon falso, e se ne sai più di lei
      sei venut{o|a} a rubarle il mestiere.
    opzioni:
      # furtività
      - testo: "Lezione di Furtività"
        descrizione: &rozalia-furtivita "Camminare per Via dei Rasoi senza che chi sta alle finestre si accorga di te."
        quando: [furtivita == 2]
        requisiti: [rep.scuri >= 4, monete >= 200]
        esito:
          titolo: &rozalia-2t Il cristallo spento
          testo: &rozalia-2 |
            Rozalia ti fa camminare su e giù per Via dei Rasoi finché la gente alle finestre smette di girarsi
            a guardarti. A ogni passaggio senti cigolare un'imposta in meno. Poi ti fa raccontare una storia
            qualsiasi e la smonta pezzo per pezzo, con il coltellino che le gira fra le dita. «Meglio» dice
            alla fine, e detto da lei è già molto.
          effetti: { monete: -200 }
          pe: { furtivita: 10 }
      - testo: "Lezione di Furtività"
        descrizione: *rozalia-furtivita
        quando: [furtivita == 3]
        requisiti: [rep.scuri >= 4, monete >= 400]
        esito:
          titolo: &rozalia-3t Il fazzoletto
          testo: &rozalia-3 |
            All'alba Rozalia ti porta fra i banchi del mercato e ti indica una donna con la borsa a tracolla.
            Devi arrivarle accanto e farti dire che ore sono, senza che lei si ricordi di te un momento dopo.
            La donna ha le mani rosse di lisciva e ti risponde guardando la merce sul banco. Quando torni al
            cristallo spento Rozalia ti restituisce il fazzoletto che ti aveva sfilato dalla tasca mentre
            parlavi.
