  # ------------------------------------------------------------ Nerissa Dalvane · rep.maison
  - id: le-lezioni-di-nerissa
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: Le lezioni di Nerissa
    sommario: "Nel pomeriggio, prima che la Maison apra, Nerissa Dalvane dà lezioni di buone maniere e di parola a chi la casa conosce."
    luogo: Maison des Lunes, il salone prima dell'apertura
    area: citta-bassa
    ripetibile: true
    marchio: addestramento
    # come i servizi della Maison: la porta chiusa o il libro di Vesh tenuto per sé chiudono anche le lezioni
    requisiti: [maison.chiusa == 0, maison.libro != 5]
    testo: |
      Nel primo pomeriggio la Maison des Lunes è chiusa, e nel salone c'è
      ancora l'odore dei fiori del giorno prima. Nerissa Dalvane siede al suo
      tavolino con una tazza di tè che non beve, e dall'altra parte della sala
      una delle ragazze prova una canzone a mezza voce.

      «Le mie ragazze imparano qui a stare in una sala piena di gente che conta,
      e a farsi ascoltare quando parlano» dice. «Insegno anche a chi viene da
      fuori, se la casa lo conosce e se paga come un cliente. Chi non sa
      nemmeno come si saluta una signora vada prima a fare pratica al banco di
      un mercante sui Ponti.»

      Gira la tazza sul piattino, senza guardarla. Se ne sai quanto lei,
      aggiunge, faresti meglio ad aprire una casa tua.
    opzioni:
      # galateo
      - testo: "Lezione di Galateo"
        descrizione: &nerissa-galateo "Come si entra in una sala dei Quartieri Alti, e come se ne esce senza sgarbi."
        quando: [galateo == 2]
        requisiti: [rep.maison >= 4, monete >= 200]
        esito:
          titolo: &nerissa-2t Il tè freddo
          testo: &nerissa-2 |
            Nerissa ti fa sedere di fronte a lei e per un'ora intera ti corregge
            senza mai alzare la voce. Comincia dal modo in cui tieni la tazza e
            finisce con le pause che non sai fare quando parli. Alla fine il tè è
            freddo, e tu sei più stanc{o|a} che dopo una giornata di fatica.
          effetti: { monete: -200 }
          pe: { galateo: 10 }
      - testo: "Lezione di Galateo"
        descrizione: *nerissa-galateo
        quando: [galateo == 3]
        requisiti: [rep.maison >= 4, monete >= 400]
        esito:
          titolo: &nerissa-3t Il salone pieno
          testo: &nerissa-3 |
            Stavolta Nerissa ti lascia nel salone in un'ora di clienti, con
            l'incarico di farti ricordare bene da un uomo dei Quartieri Alti che
            non ti ha mai visto. Lei ti guarda da lontano. A chiusura ti elenca, in
            ordine, tutte le cose che hai sbagliato, e sono meno di quante temevi.
          effetti: { monete: -400 }
          pe: { galateo: 10 }
      - testo: "Lezione di Galateo"
        descrizione: *nerissa-galateo
        quando: [galateo == 4]
        requisiti: [rep.maison >= 8, monete >= 800]
        esito:
          titolo: &nerissa-4t Il salotto del primo piano
          testo: &nerissa-4 |
            Nerissa chiude la porta del salotto al primo piano e ti parla delle
            persone che contano a Qir-Azel come si parla di un mestiere, di quello
            che vogliono e del modo giusto di chiederglielo. Mentre parla tocca il
            medaglione sotto la stoffa. Prima che tu esca ti versa un bicchiere del
            vino che tiene per i clienti migliori.
          effetti: { monete: -800 }
          pe: { galateo: 10 }
      # persuasione
      - testo: "Lezione di Persuasione"
        descrizione: &nerissa-persuasione "Nerissa ti insegna a chiedere in modo che dirti di no costi più fatica che dirti di sì."
        quando: [persuasione == 2]
        requisiti: [rep.maison >= 4, monete >= 200]
