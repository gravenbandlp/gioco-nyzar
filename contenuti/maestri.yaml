        esito:
          titolo: &ottilia-4t I registri dell'infermeria
          testo: &ottilia-4 |
            Per l'ultima lezione Ottilia ti porta negli archivi minori della Cattedrale e ti fa leggere i
            registri dell'infermeria degli ultimi vent'anni, i casi andati bene e quelli andati male. Nei
            registri più vecchi le pagine sono ingiallite e l'inchiostro è diventato bruno. Te li commenta uno
            per uno, in frasi brevi. Quando chiude l'ultimo registro ti guarda a lungo, e per la prima volta
            usa un superlativo.
          effetti: { monete: -800 }
          pe: { medicina: 10 }
