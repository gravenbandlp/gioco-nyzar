  # ------------------------------------------------------------ Agnese Lunardi · rep.accademia
  - id: le-lezioni-di-agnese
    presso: accademia-di-torvessa
    immagine: ambientazione/accademia-di-torvessa
    titolo: Il laboratorio di Agnese
    sommario: "La maestra di laboratorio dell'Accademia dà lezioni private, la sera, a chi l'Accademia stima e può pagarle."
    luogo: Accademia di Torvessa, il laboratorio, di sera
    area: quartieri-alti
    ripetibile: true
    marchio: addestramento
    testo: |
      La sera, quando gli allievi del terzo anno se ne vanno lasciando sul
      bancone il solito piattino di biscotti, Agnese Lunardi resta in
      laboratorio a sistemare i cristalli nelle loro casse imbottite. Porta i
      guanti di pelle anche adesso, e conta sottovoce mentre parla.

      «Le lezioni private le tengo dopo cena, e le pago io in ore di sonno»
      dice. «Non insegno l'alfabeto dei cristalli a chi non l'ha mai visto.
      Per quello ci sono i corsi del mattino, o il banco di Ambrin Qell sui
      Ponti, dove si impara almeno a guardare un reperto.»

      {origine allievo-di-torvessa} Ai corsi del mattino ti sedevi in fondo,
      e lei se lo ricorda. Ti allunga un biscotto dal piattino degli allievi
      senza smettere di contare.

      Chi ne sa quanto lei, aggiunge, dovrebbe avere una cattedra e lasciarla
      dormire.
    opzioni:
      # accademiche
      - testo: "Lezione di Accademiche"
        descrizione: &agnese-accademiche "I testi antichi della biblioteca dell'Accademia, letti a voce alta con una maestra che conta le righe."
        quando: [accademiche == 2]
        requisiti: [rep.accademia >= 4, monete >= 200]
        esito:
          titolo: &agnese-2t I cristalli piccoli
          testo: &agnese-2 |
            Agnese ti mette davanti una cassa di cristalli piccoli e un quaderno, e
            per tutta la sera ti fa ripetere le stesse cose finché non le dici
            senza guardare. Conta con te, sottovoce. Quando sbagli ricomincia a
            contare da capo, e tu impari presto a non farglielo fare.
          effetti: { monete: -200 }
          pe: { accademiche: 10 }
      - testo: "Lezione di Accademiche"
        descrizione: *agnese-accademiche
        quando: [accademiche == 3]
        requisiti: [rep.accademia >= 4, monete >= 400]
        esito:
          titolo: &agnese-3t Dopo cena
          testo: &agnese-3 |
            Stavolta Agnese ti presta un paio di guanti e ti fa lavorare sulle cose
            che agli allievi del terzo anno non fa toccare. Ogni tanto si ferma a
            guardarti senza dire niente. A fine serata ti indica il piattino dei
            biscotti, e capisci che è il suo modo di dirti che è andata bene.
          effetti: { monete: -400 }
          pe: { accademiche: 10 }
      - testo: "Lezione di Accademiche"
        descrizione: *agnese-accademiche
        quando: [accademiche == 4]
        requisiti: [rep.accademia >= 8, monete >= 800]
        esito:
          titolo: &agnese-4t La cassa con il lucchetto
          testo: &agnese-4 |
            Agnese apre la cassa che tiene in fondo al laboratorio, quella con il
            lucchetto, e ti mostra quello che ha imparato in quarant'anni di
            cristalli e di libri. Parla fino a tardi, senza contare. Quando esci il
            custode sta già chiudendo il portone, e tu hai la testa così piena che
            sbagli strada due volte.
          effetti: { monete: -800 }
          pe: { accademiche: 10 }
      # magia
      - testo: "Lezione di Magia"
        descrizione: &agnese-magia "Caricare un cristallo senza farsi tornare indietro il Mana, come Agnese insegna agli allievi."
        quando: [magia == 2]
        requisiti: [rep.accademia >= 4, monete >= 200]
        esito:
          titolo: *agnese-2t
          testo: *agnese-2
          effetti: { monete: -200 }
          pe: { magia: 10 }
      - testo: "Lezione di Magia"
        descrizione: *agnese-magia
        quando: [magia == 3]
        requisiti: [rep.accademia >= 4, monete >= 400]
        esito:
          titolo: *agnese-3t
          testo: *agnese-3
          effetti: { monete: -400 }
          pe: { magia: 10 }
      - testo: "Lezione di Magia"
        descrizione: *agnese-magia
        quando: [magia == 4]
        requisiti: [rep.accademia >= 8, monete >= 800]
        esito:
          titolo: *agnese-4t
          testo: *agnese-4
          effetti: { monete: -800 }
          pe: { magia: 10 }
      # tecnologia
      - testo: "Lezione di Tecnologia"
        descrizione: &agnese-tecnologia "Congegni e reperti smontati sul bancone del laboratorio, un pezzo alla volta."
        quando: [tecnologia == 2]
        requisiti: [rep.accademia >= 4, monete >= 200]
        esito:
          titolo: *agnese-2t
          testo: *agnese-2
          effetti: { monete: -200 }
          pe: { tecnologia: 10 }
      - testo: "Lezione di Tecnologia"
        descrizione: *agnese-tecnologia
        quando: [tecnologia == 3]
