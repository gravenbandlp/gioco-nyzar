  # ------------------------------------------------------------ Ottilia Sanvel · rep.velo
  - id: le-lezioni-di-ottilia
    presso: cattedrale-del-velo
    immagine: personaggi/ottilia-sanvel
    titolo: Il corridoio dei novizi
    sommario: "All'alba Ottilia Sanvel fa esercitare i novizi, e a chi il Velo conosce insegna le cure e la disciplina, dietro un'offerta."
    luogo: Cattedrale del Velo, il corridoio dei novizi
    area: quartieri-alti
    ripetibile: true
    marchio: addestramento
    testo: |
      All'alba Ottilia Sanvel cammina nel corridoio dei novizi fra due file di ragazzi in ginocchio. Lungo le
      pareti le lastre del pavimento sono consumate in due solchi bassi, dove i novizi si inginocchiano da
      generazioni. Ottilia è bassa e robusta, e con uno sguardo fa raddrizzare la schiena ai novizi. Quando i
      ragazzi vanno alla prima lettura resta sola con te.

      «Il Velo insegna gratis a chi entra nella Confraternita» dice. «Gli altri lasciano un'offerta per
      l'infermeria. Chi non ha mai fasciato una ferita impari prima alla tenda della Città Bassa.»

      {origine accolito-del-velo} Fino a poco fa eri anche tu in ginocchio qui, in uno di quei solchi.
      Passandoti accanto Ottilia ti tocca la spalla con due dita, e la schiena ti si raddrizza da sola.

      Parla in frasi brevi. Chi ne sa quanto lei, dice, dovrebbe essere in infermeria a curare.
    opzioni:
      # medicina
      - testo: "Lezione di Medicina"
        descrizione: &ottilia-medicina "Le febbri e le ferite dei ricoverati, nell'infermeria della navata nord."
        quando: [medicina == 2]
        requisiti: [rep.velo >= 4, monete >= 200]
        esito:
          titolo: &ottilia-2t L'infermeria della navata nord
          testo: &ottilia-2 |
            Ottilia ti porta nell'infermeria della navata nord e ti mette accanto a un monaco che cambia le
            bende ai ricoverati. Le brande sono in fila sotto le finestre alte, e nell'aria c'è l'odore
            dell'aceto e del lino bollito. Per tutta la mattina guardi e fai quello che ti dicono, e quando
            sbagli lei ti ferma la mano senza una parola. Alla fine ti fa lavare le mani due volte.
          effetti: { monete: -200 }
          pe: { medicina: 10 }
      - testo: "Lezione di Medicina"
        descrizione: *ottilia-medicina
        quando: [medicina == 3]
        requisiti: [rep.velo >= 4, monete >= 400]
        esito:
          titolo: &ottilia-3t La veglia
          testo: &ottilia-3 |
            Ottilia ti fa vegliare per una notte intera un ricoverato con la febbre alta, sedut{o|a} sullo
            sgabello accanto al letto, senza dormire. Ogni ora passa a controllare il malato e poi te, con la
            stessa faccia. Nelle ore più fonde il panno bagnato sulla fronte del malato si asciuga prima che
            tu abbia finito di strizzare quello nuovo. All'alba la febbre è scesa, e lei ti dice che puoi
            andare.
          effetti: { monete: -400 }
          pe: { medicina: 10 }
