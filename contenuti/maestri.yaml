  # ------------------------------------------------------------ Aelion Farethil · rep.circolo
  - id: le-lezioni-di-aelion
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Sulla spirale con Aelion
    sommario: "All'alba, sulla spirale del Circolo, Aelion Farethil insegna a leggere il Bosco e le sue creature a chi il Circolo conosce."
    luogo: Il Bosco di Velthar, la spirale all'alba
    area: superficie-fratturata
    ripetibile: true
    marchio: addestramento
    testo: |
      All'alba il vapore della fenditura sale dritto fra le pietre della spirale. Dove il vapore le tocca il
      muschio è folto e bagnato, e sulle pietre più lontane è già secco e chiaro. Aelion Farethil siede sul
      muschio con le mani sulle ginocchia e la corteccia fresca nelle trecce, e parla piano per non far
      scappare le bestie.

      «A quelli del Circolo insegno per niente, a te per un'offerta» dice. «Se non distingui un'erba buona da
      una cattiva, impara prima in città, dove le bestie sono poche.»

      A chi ne sa già quanto lui, aggiunge, non ha più niente da insegnare.
    opzioni:
      # natura
      - testo: "Lezione di Natura"
        descrizione: &aelion-natura "Le piante e le bestie del Bosco, spiegate una per una da chi ci vive da più di un secolo."
        quando: [natura == 2]
        requisiti: [rep.circolo >= 4, monete >= 200]
        esito:
          titolo: &aelion-2t Il muschio
          testo: &aelion-2 |
            Aelion ti fa sedere sul muschio accanto a lui e per tutta la mattina non dice quasi niente. Il
            muschio è freddo di rugiada e in poco tempo ti bagna i calzoni fino alle ginocchia. Ogni tanto
            indica con il mento un ramo spezzato o un uccello, e aspetta che tu gli dica cosa vedi. Quando la
            risposta è giusta chiude gli occhi, e quando è sbagliata indica un'altra cosa.
          effetti: { monete: -200 }
          pe: { natura: 10 }
      - testo: "Lezione di Natura"
        descrizione: *aelion-natura
        quando: [natura == 3]
        requisiti: [rep.circolo >= 4, monete >= 400]
        esito:
          titolo: &aelion-3t Il margine della fenditura
          testo: &aelion-3 |
            Aelion ti porta giù dalla spirale fino al margine della fenditura, dove la terra è tiepida e le
            bestie del Bosco vengono a scaldarsi. Sotto il palmo il calore sale a ondate lente. Quando
            un'ondata passa la terra torna fredda per qualche respiro. Restate fermi fino a mezzogiorno. Una
            cerva si avvicina tanto che potresti toccarla, e Aelion ti fa segno di aspettare, e poi di
            allungare la mano.
          effetti: { monete: -400 }
          pe: { natura: 10 }
      - testo: "Lezione di Natura"
        descrizione: *aelion-natura
        quando: [natura == 4]
        requisiti: [rep.circolo >= 8, monete >= 800]
        esito:
          titolo: &aelion-4t La mattina lunga
          testo: &aelion-4 |
            Per l'ultima lezione Aelion parla per tutta la mattina, ed è la volta in cui lo senti parlare di
            più. Ti racconta il Bosco un tratto alla volta, dove passano i cervi d'inverno, quali radici
            marciscono dopo la Marea, dove fanno il nido i falchi. Parla così piano che i passeri sul muschio
            intorno a voi non smettono di beccare. Tutto questo ti torna in mente la sera, sulla strada del
            ritorno, davanti a un ramo spezzato che la mattina non avresti notato.
          effetti: { monete: -800 }
          pe: { natura: 10 }
      # addestrare animali
      - testo: "Lezione di Addestrare animali"
        descrizione: &aelion-animali "Avvicinare le creature del Bosco senza che scappino, e senza scappare tu."
        quando: [addestrare-animali == 2]
        requisiti: [rep.circolo >= 4, monete >= 200]
        esito:
          titolo: *aelion-2t
          testo: *aelion-2
          effetti: { monete: -200 }
          pe: { addestrare-animali: 10 }
      - testo: "Lezione di Addestrare animali"
        descrizione: *aelion-animali
        quando: [addestrare-animali == 3]
        requisiti: [rep.circolo >= 4, monete >= 400]
        esito:
          titolo: *aelion-3t
          testo: *aelion-3
          effetti: { monete: -400 }
          pe: { addestrare-animali: 10 }
      - testo: "Lezione di Addestrare animali"
        descrizione: *aelion-animali
        quando: [addestrare-animali == 4]
        requisiti: [rep.circolo >= 8, monete >= 800]
        esito:
          titolo: *aelion-4t
          testo: *aelion-4
          effetti: { monete: -800 }
          pe: { addestrare-animali: 10 }
      # empatia
      - testo: "Lezione di Empatia"
        descrizione: &aelion-empatia "Aelion ti insegna ad ascoltare chi hai davanti con la pazienza con cui si ascolta il Bosco."
        quando: [empatia == 2]
        requisiti: [rep.circolo >= 4, monete >= 200]
        esito:
          titolo: *aelion-2t
          testo: *aelion-2
          effetti: { monete: -200 }
          pe: { empatia: 10 }
      - testo: "Lezione di Empatia"
        descrizione: *aelion-empatia
        quando: [empatia == 3]
        requisiti: [rep.circolo >= 4, monete >= 400]
        esito:
          titolo: *aelion-3t
          testo: *aelion-3
          effetti: { monete: -400 }
          pe: { empatia: 10 }
      - testo: "Lezione di Empatia"
        descrizione: *aelion-empatia
        quando: [empatia == 4]
        requisiti: [rep.circolo >= 8, monete >= 800]
        esito:
          titolo: *aelion-4t
          testo: *aelion-4
          effetti: { monete: -800 }
          pe: { empatia: 10 }

  # ------------------------------------------------------------ Agnese Lunardi · rep.accademia
  - id: le-lezioni-di-agnese
    presso: accademia-di-torvessa
    immagine: ambientazione/accademia-di-torvessa
    titolo: Il laboratorio di Agnese
    sommario: "La maestra di laboratorio dell'Accademia dà lezioni private, la sera, a chi l'Accademia stima e può pagarle."
    luogo: Accademia di Torvessa, il laboratorio, di sera
    area: quartieri-alti
    ripetibile: true
    marchio: addestramento
    testo: |
      La sera gli allievi del terzo anno lasciano sul bancone il solito piattino di biscotti, e Agnese Lunardi
      resta in laboratorio a sistemare i cristalli nelle casse imbottite. Le casse sono foderate di feltro
      grigio, con uno scomparto per ogni cristallo e un numero inciso a punta di chiodo sul coperchio. Porta
      anche adesso i guanti di pelle che hanno i polpastrelli consumati fino al lucido, e conta sottovoce
      mentre parla.

      «Le lezioni private le tengo dopo cena, e le pago io in ore di sonno» dice. «Chi non ha mai visto
      l'alfabeto dei cristalli vada ai corsi del mattino, o al banco di Ambrin Qell sui Ponti.»

      {origine allievo-di-torvessa} Ai corsi del mattino ti sedevi in fondo, e lei se lo ricorda. Ti allunga
      un biscotto senza smettere di contare.

      Chi ne sa quanto lei, aggiunge, dovrebbe avere una cattedra e lasciarla dormire.
    opzioni:
      # accademiche
      - testo: "Lezione di Accademiche"
        descrizione: &agnese-accademiche "I testi antichi della biblioteca dell'Accademia, letti a voce alta con una maestra che conta le righe."
        quando: [accademiche == 2]
        requisiti: [rep.accademia >= 4, monete >= 200]
        esito:
          titolo: &agnese-2t I cristalli piccoli
          testo: &agnese-2 |
            Agnese ti mette davanti una cassa di cristalli piccoli e un quaderno, e per tutta la sera ti fa
            ripetere le stesse cose finché non le dici senza guardare. I cristalli non sono più grandi di
            un'unghia, e il quaderno ha gli angoli ammorbiditi da anni di pollici. Conta con te, sottovoce.
            Quando sbagli ricomincia a contare da capo, e tu impari presto a non farglielo fare.
          effetti: { monete: -200 }
          pe: { accademiche: 10 }
      - testo: "Lezione di Accademiche"
        descrizione: *agnese-accademiche
        quando: [accademiche == 3]
        requisiti: [rep.accademia >= 4, monete >= 400]
        esito:
          titolo: &agnese-3t Dopo cena
          testo: &agnese-3 |
            Stavolta Agnese ti presta un paio di guanti e ti fa lavorare sulle cose che agli allievi del terzo
            anno non fa toccare. I guanti sono di una pelle più spessa dei suoi e hanno le dita rinforzate da
            una seconda cucitura. Ogni tanto si ferma a guardarti senza dire niente. A fine serata ti indica
            il piattino dei biscotti, e capisci che è il suo modo di dirti che è andata bene.
          effetti: { monete: -400 }
          pe: { accademiche: 10 }
      - testo: "Lezione di Accademiche"
        descrizione: *agnese-accademiche
        quando: [accademiche == 4]
        requisiti: [rep.accademia >= 8, monete >= 800]
        esito:
          titolo: &agnese-4t La cassa con il lucchetto
          testo: &agnese-4 |
            Agnese apre la cassa che tiene in fondo al laboratorio, quella con il lucchetto, e ti mostra
            quello che ha imparato in quarant'anni di cristalli e di libri. Il coperchio ha i cardini di
            ottone, e dentro il feltro degli scomparti è consumato fino alla trama. Parla fino a tardi, senza
            contare. Quando esci il custode sta già chiudendo il portone, e tu hai la testa così piena che
            sbagli strada due volte.
          effetti: { monete: -800 }
          pe: { accademiche: 10 }
      # magia
      - testo: "Lezione di Magia"
        descrizione: &agnese-magia "Caricare un cristallo senza farsi tornare indietro il Mana, come Agnese insegna agli allievi."
        quando: [magia == 2]
        requisiti: [rep.accademia >= 4, monete >= 200]
        esito:
          titolo: *agnese-2t
          testo: *agnese-2
          effetti: { monete: -200 }
          pe: { magia: 10 }
      - testo: "Lezione di Magia"
        descrizione: *agnese-magia
        quando: [magia == 3]
        requisiti: [rep.accademia >= 4, monete >= 400]
        esito:
          titolo: *agnese-3t
          testo: *agnese-3
          effetti: { monete: -400 }
          pe: { magia: 10 }
      - testo: "Lezione di Magia"
        descrizione: *agnese-magia
        quando: [magia == 4]
        requisiti: [rep.accademia >= 8, monete >= 800]
        esito:
          titolo: *agnese-4t
          testo: *agnese-4
          effetti: { monete: -800 }
          pe: { magia: 10 }
      # tecnologia
      - testo: "Lezione di Tecnologia"
        descrizione: &agnese-tecnologia "Congegni e reperti smontati sul bancone del laboratorio, un pezzo alla volta."
        quando: [tecnologia == 2]
        requisiti: [rep.accademia >= 4, monete >= 200]
        esito:
          titolo: *agnese-2t
          testo: *agnese-2
          effetti: { monete: -200 }
          pe: { tecnologia: 10 }
      - testo: "Lezione di Tecnologia"
        descrizione: *agnese-tecnologia
        quando: [tecnologia == 3]
        requisiti: [rep.accademia >= 4, monete >= 400]
        esito:
          titolo: *agnese-3t
          testo: *agnese-3
