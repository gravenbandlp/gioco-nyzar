  # ------------------------------------------------------------ Ottilia Sanvel · rep.velo
  - id: le-lezioni-di-ottilia
    presso: cattedrale-del-velo
    immagine: personaggi/ottilia-sanvel
    titolo: Il corridoio dei novizi
    sommario: "All'alba Ottilia Sanvel fa esercitare i novizi, e a chi il Velo conosce insegna le cure e la disciplina, dietro un'offerta."
    luogo: Cattedrale del Velo, il corridoio dei novizi
    area: quartieri-alti
    ripetibile: true
    marchio: addestramento
    testo: |
      All'alba, nel corridoio dei novizi, Ottilia Sanvel cammina avanti e
      indietro fra due file di ragazzi in ginocchio sulla pietra fredda. È
      bassa e robusta, e le basta guardare un novizio per fargli raddrizzare la
      schiena. Quando i ragazzi vanno alla prima lettura resta sola con te.

      «Il Velo insegna gratis a chi entra nella Confraternita» dice. «A chi
      resta fuori chiede un'offerta, e la mette nella cassa dell'infermeria.
      Chi non ha mai fasciato una ferita impari prima alla tenda della Città
      Bassa.»

      {origine accolito-del-velo} Fino a poco tempo fa eri anche tu in
      ginocchio in quel corridoio. Passandoti accanto Ottilia ti tocca la
      spalla con due dita, e la schiena ti si raddrizza da sola.

      Parla in frasi brevi, e non usa mai una parola più grande del necessario.
      Chi ne sa quanto lei, dice, dovrebbe essere in infermeria a curare, e
      non qui a farsi insegnare.
    opzioni:
      # medicina
      - testo: "Lezione di Medicina"
        descrizione: &ottilia-medicina "Le febbri e le ferite dei ricoverati, nell'infermeria della navata nord."
        quando: [medicina == 2]
        requisiti: [rep.velo >= 4, monete >= 200]
        esito:
          titolo: &ottilia-2t L'infermeria della navata nord
          testo: &ottilia-2 |
            Ottilia ti porta nell'infermeria della navata nord e ti mette accanto a
            un monaco che cambia le bende ai ricoverati. Per tutta la mattina guardi
            e fai quello che ti dicono, e quando sbagli lei ti ferma la mano senza
            una parola. Alla fine ti fa lavare le mani due volte.
          effetti: { monete: -200 }
          pe: { medicina: 10 }
      - testo: "Lezione di Medicina"
        descrizione: *ottilia-medicina
        quando: [medicina == 3]
        requisiti: [rep.velo >= 4, monete >= 400]
        esito:
          titolo: &ottilia-3t La veglia
          testo: &ottilia-3 |
            Ottilia ti fa vegliare per una notte intera un ricoverato con la febbre
            alta, sedut{o|a} sullo sgabello accanto al letto, senza dormire. Ogni ora
            passa a controllare il malato e poi te, con la stessa faccia. All'alba
            la febbre è scesa, e lei ti dice che puoi andare.
          effetti: { monete: -400 }
          pe: { medicina: 10 }
      - testo: "Lezione di Medicina"
        descrizione: *ottilia-medicina
        quando: [medicina == 4]
        requisiti: [rep.velo >= 8, monete >= 800]
        esito:
          titolo: &ottilia-4t I registri dell'infermeria
          testo: &ottilia-4 |
            Per l'ultima lezione Ottilia ti porta negli archivi minori della
            Cattedrale e ti fa leggere i registri dell'infermeria degli ultimi
            vent'anni, i casi andati bene e quelli andati male. Te li commenta uno
            per uno, in frasi brevi. Quando chiude l'ultimo registro ti guarda a
            lungo, e per la prima volta usa un superlativo.
          effetti: { monete: -800 }
          pe: { medicina: 10 }
      # resilienza
      - testo: "Lezione di Resilienza"
        descrizione: &ottilia-resilienza "La disciplina dei novizi, che insegna a restare fermi anche quando fa male."
        quando: [resilienza == 2]
        requisiti: [rep.velo >= 4, monete >= 200]
        esito:
          titolo: *ottilia-2t
          testo: *ottilia-2
          effetti: { monete: -200 }
          pe: { resilienza: 10 }
      - testo: "Lezione di Resilienza"
        descrizione: *ottilia-resilienza
        quando: [resilienza == 3]
        requisiti: [rep.velo >= 4, monete >= 400]
        esito:
          titolo: *ottilia-3t
          testo: *ottilia-3
          effetti: { monete: -400 }
          pe: { resilienza: 10 }
      - testo: "Lezione di Resilienza"
        descrizione: *ottilia-resilienza
        quando: [resilienza == 4]
        requisiti: [rep.velo >= 8, monete >= 800]
        esito:
