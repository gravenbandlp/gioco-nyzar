          testo: *ottilia-4
          effetti: { monete: -800 }
          pe: { resilienza: 10 }

  # ------------------------------------------------------------ Lira Demos · rep.gilda
  - id: le-lezioni-di-lira
    presso: gilda-casa-dei-nodi
    immagine: personaggi/lira-demos
    titolo: L'archivio dei dazi
    sommario: "Al secondo piano della Casa dei Nodi l'archivista dei dazi insegna a leggere i conti della città a chi la Gilda conosce, a pagamento."
    luogo: Casa dei Nodi, l'archivio dei dazi
    area: quartieri-alti
    ripetibile: true
    marchio: addestramento
    testo: |
      L'archivio dei dazi occupa il secondo piano della Casa dei Nodi, con le
      finestre sulle catene dei ponti e i registri impilati fino al soffitto.
      Lira Demos lavora al tavolo sotto la finestra, con i fili di rame
      intrecciati nei capelli castani e un martelletto accanto al calamaio. Su
      molte costole dei registri c'è un tassello di legno inchiodato, e sono
      quelli che non tornano.

      «Ti insegno a leggere i conti della città, e la Gilda mi lascia fare
      perché ti conosce» dice. «Il prezzo lo paghi in anticipo, e per iscritto
      non ti prometto niente. Chi non sa ancora tenere un registro vada a fare
      pratica al banco di qualche mercante dei Ponti.»

      Chi ne sa quanto lei, aggiunge, di solito siede al terzo piano, e lì non
      ci sale per imparare.
    opzioni:
      - testo: "Lezione di Politica ed economia"
        descrizione: &lira-politica "I registri dei dazi e i conti della città, letti con chi sa dove non tornano."
        quando: [politica-ed-economia == 2]
        requisiti: [rep.gilda >= 4, monete >= 200]
        esito:
          titolo: I tasselli
          testo: |
            Lira ti mette davanti un registro con il tassello sulla costola e ti
            chiede di trovare dove non torna. Ci metti tutta la mattina, con il
            dito che scende lungo le colonne e torna su. Quando glielo indichi
            lei schioda il tassello con il martelletto e te lo mette in mano.
          effetti: { monete: -200 }
          pe: { politica-ed-economia: 10 }
      - testo: "Lezione di Politica ed economia"
        descrizione: *lira-politica
        quando: [politica-ed-economia == 3]
        requisiti: [rep.gilda >= 4, monete >= 400]
        esito:
          titolo: Le catene dei ponti
          testo: |
            Stavolta Lira ti porta alla finestra e ti fa contare i carri che
            passano sulle catene, mentre lei legge ad alta voce quanto hanno
            dichiarato al gabbiotto. A fine giornata i due conti non tornano, e
            Lira ti chiede di dirle chi ci guadagna. Sbagli due volte prima di
            trovare il nome giusto.
          effetti: { monete: -400 }
          pe: { politica-ed-economia: 10 }
      - testo: "Lezione di Politica ed economia"
        descrizione: *lira-politica
        quando: [politica-ed-economia == 4]
        requisiti: [rep.gilda >= 8, monete >= 800]
        esito:
          titolo: I registri vecchi
          testo: |
            Per l'ultima lezione Lira ti fa leggere i registri vecchi della Casa,
            quelli che non escono dall'archivio, e ti spiega chi si è arricchito
            con ogni dazio e perché. Non scrive niente e non ti lascia scrivere.
            Quando hai finito rimette i registri al loro posto e ti fa giurare che
            non li hai mai visti.
          effetti: { monete: -800 }
          pe: { politica-ed-economia: 10 }
