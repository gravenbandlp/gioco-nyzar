  # ------------------------------------------------------------ Nerissa Dalvane · rep.maison
  - id: le-lezioni-di-nerissa
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: Le lezioni di Nerissa
    sommario: "Nel pomeriggio, prima che la Maison apra, Nerissa Dalvane dà lezioni di buone maniere e di parola a chi la casa conosce."
    luogo: Maison des Lunes, il salone prima dell'apertura
    area: citta-bassa
    ripetibile: true
    marchio: addestramento
    # come i servizi della Maison: la porta chiusa o il libro di Vesh tenuto per sé chiudono anche le lezioni
    requisiti: [maison.chiusa == 0, maison.libro != 5]
    testo: |
      Nel primo pomeriggio la Maison des Lunes è chiusa e nel salone resta l'odore dei fiori del giorno prima.
      Le tende sono tirate e la luce passa solo dalle fessure, e sul pavimento restano i cerchi umidi dei vasi
      portati via. Nerissa Dalvane siede al tavolino con una tazza di tè che non beve, di porcellana sottile
      con un filo d'oro sul bordo. In fondo alla sala una ragazza prova una canzone a mezza voce.

      «Qui le mie ragazze imparano a stare in una sala piena di gente che conta» dice. «Insegno anche a chi
      viene da fuori, se la casa lo conosce e paga come un cliente. Chi non sa nemmeno salutare una signora
      faccia pratica al banco di un mercante sui Ponti.»

      Se ne sai quanto lei, aggiunge, faresti meglio ad aprire una casa tua.
    opzioni:
      # galateo
      - testo: "Lezione di Galateo"
        descrizione: &nerissa-galateo "Come si entra in una sala dei Quartieri Alti, e come se ne esce senza sgarbi."
        quando: [galateo == 2]
        requisiti: [rep.maison >= 4, monete >= 200]
        esito:
          titolo: &nerissa-2t Il tè freddo
          testo: &nerissa-2 |
            Nerissa ti fa sedere di fronte a lei e per un'ora intera ti corregge senza mai alzare la voce.
            Comincia dal modo in cui tieni la tazza e finisce con le pause che non sai fare quando parli. La
            tazza è così sottile che contro la luce delle fessure ci vedi l'ombra delle tue dita. Alla fine il
            tè è freddo, e tu sei più stanc{o|a} che dopo una giornata di fatica.
          effetti: { monete: -200 }
          pe: { galateo: 10 }
      - testo: "Lezione di Galateo"
        descrizione: *nerissa-galateo
        quando: [galateo == 3]
        requisiti: [rep.maison >= 4, monete >= 400]
        esito:
          titolo: &nerissa-3t Il salone pieno
          testo: &nerissa-3 |
            Stavolta Nerissa ti lascia nel salone in un'ora di clienti, con l'incarico di farti ricordare bene
            da un uomo dei Quartieri Alti che non ti ha mai visto. L'aria è calda di candele e di profumo, e
            la musica copre le voci a tre passi di distanza. Lei ti guarda da lontano. A chiusura ti elenca,
            in ordine, tutte le cose che hai sbagliato, e sono meno di quante temevi.
          effetti: { monete: -400 }
          pe: { galateo: 10 }
      - testo: "Lezione di Galateo"
        descrizione: *nerissa-galateo
        quando: [galateo == 4]
        requisiti: [rep.maison >= 8, monete >= 800]
        esito:
          titolo: &nerissa-4t Il salotto del primo piano
          testo: &nerissa-4 |
            Nerissa chiude la porta del salotto al primo piano e ti parla delle persone che contano a Qir-Azel
            come si parla di un mestiere, di quello che vogliono e del modo giusto di chiederglielo.
            Attraverso la porta chiusa la musica del salone arriva appena. Mentre parla tocca il medaglione
            sotto la stoffa. Prima che tu esca ti versa un bicchiere del vino che tiene per i clienti
            migliori.
          effetti: { monete: -800 }
          pe: { galateo: 10 }
      # persuasione
      - testo: "Lezione di Persuasione"
        descrizione: &nerissa-persuasione "Nerissa ti insegna a chiedere in modo che dirti di no costi più fatica che dirti di sì."
        quando: [persuasione == 2]
        requisiti: [rep.maison >= 4, monete >= 200]
        esito:
          titolo: *nerissa-2t
          testo: *nerissa-2
          effetti: { monete: -200 }
          pe: { persuasione: 10 }
      - testo: "Lezione di Persuasione"
        descrizione: *nerissa-persuasione
        quando: [persuasione == 3]
        requisiti: [rep.maison >= 4, monete >= 400]
        esito:
          titolo: *nerissa-3t
          testo: *nerissa-3
          effetti: { monete: -400 }
          pe: { persuasione: 10 }
      - testo: "Lezione di Persuasione"
        descrizione: *nerissa-persuasione
        quando: [persuasione == 4]
        requisiti: [rep.maison >= 8, monete >= 800]
        esito:
          titolo: *nerissa-4t
          testo: *nerissa-4
          effetti: { monete: -800 }
          pe: { persuasione: 10 }
      # espressività
      - testo: "Lezione di Espressività"
        descrizione: &nerissa-espressivita "La voce e il modo di stare in piedi davanti a chi ti guarda, come lo imparano le ragazze della casa."
        quando: [espressivita == 2]
