  # ------------------------------------------------------------ Aelion Farethil · rep.circolo
  - id: le-lezioni-di-aelion
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Sulla spirale con Aelion
    sommario: "All'alba, sulla spirale del Circolo, Aelion Farethil insegna a leggere il Bosco e le sue creature a chi il Circolo conosce."
    luogo: Il Bosco di Velthar, la spirale all'alba
    area: superficie-fratturata
    ripetibile: true
    marchio: addestramento
    testo: |
      All'alba, quando il vapore della fenditura sale dritto fra le pietre
      della spirale, Aelion Farethil siede sul muschio con le mani aperte sulle
      ginocchia. Nelle trecce porta strisce di corteccia fresca. Parla a voce
      bassa, per non far scappare le bestie.

      «A quelli del Circolo insegno per niente, a te per un'offerta» dice.
      «Se non sai ancora distinguere un'erba buona da una
      cattiva, impara prima in città, dove le bestie sono poche e mansuete.»

      Un merlo gli si posa sulla spalla e riparte subito verso gli alberi. A
      chi ne sa già quanto lui, dice Aelion, non ha più niente da insegnare.
    opzioni:
      # natura
      - testo: "Lezione di Natura"
        descrizione: &aelion-natura "Le piante e le bestie del Bosco, spiegate una per una da chi ci vive da più di un secolo."
        quando: [natura == 2]
        requisiti: [rep.circolo >= 4, monete >= 200]
        esito:
          titolo: &aelion-2t Il muschio
          testo: &aelion-2 |
            Aelion ti fa sedere sul muschio accanto a lui e per tutta la mattina
            non dice quasi niente. Ogni tanto indica con il mento un ramo spezzato
            o un uccello, e aspetta che tu gli dica cosa vedi. Quando la risposta è
            giusta chiude gli occhi, e quando è sbagliata indica un'altra cosa.
          effetti: { monete: -200 }
          pe: { natura: 10 }
      - testo: "Lezione di Natura"
        descrizione: *aelion-natura
        quando: [natura == 3]
        requisiti: [rep.circolo >= 4, monete >= 400]
        esito:
          titolo: &aelion-3t Il margine della fenditura
          testo: &aelion-3 |
            Aelion ti porta giù dalla spirale fino al margine della fenditura, dove
            la terra è tiepida e le bestie del Bosco vengono a scaldarsi. Restate
            fermi fino a mezzogiorno. Una cerva si avvicina tanto che potresti
            toccarla, e Aelion ti fa segno di aspettare, e poi di allungare la mano.
          effetti: { monete: -400 }
          pe: { natura: 10 }
      - testo: "Lezione di Natura"
        descrizione: *aelion-natura
        quando: [natura == 4]
        requisiti: [rep.circolo >= 8, monete >= 800]
        esito:
          titolo: &aelion-4t La mattina lunga
          testo: &aelion-4 |
            Per l'ultima lezione Aelion parla per tutta la mattina, ed è la volta
            in cui lo senti parlare di più. Ti racconta il Bosco un tratto alla
            volta, dove passano i cervi d'inverno, quali radici marciscono dopo
            la Marea, dove fanno il nido i falchi. Tutto questo ti torna in
            mente la sera, sulla strada del ritorno, davanti a un ramo spezzato
            che la mattina non avresti notato.
          effetti: { monete: -800 }
          pe: { natura: 10 }
      # addestrare animali
      - testo: "Lezione di Addestrare animali"
        descrizione: &aelion-animali "Avvicinare le creature del Bosco senza che scappino, e senza scappare tu."
        quando: [addestrare-animali == 2]
        requisiti: [rep.circolo >= 4, monete >= 200]
        esito:
          titolo: *aelion-2t
          testo: *aelion-2
          effetti: { monete: -200 }
          pe: { addestrare-animali: 10 }
      - testo: "Lezione di Addestrare animali"
        descrizione: *aelion-animali
        quando: [addestrare-animali == 3]
        requisiti: [rep.circolo >= 4, monete >= 400]
        esito:
          titolo: *aelion-3t
          testo: *aelion-3
          effetti: { monete: -400 }
          pe: { addestrare-animali: 10 }
      - testo: "Lezione di Addestrare animali"
        descrizione: *aelion-animali
        quando: [addestrare-animali == 4]
        requisiti: [rep.circolo >= 8, monete >= 800]
        esito:
          titolo: *aelion-4t
          testo: *aelion-4
          effetti: { monete: -800 }
          pe: { addestrare-animali: 10 }
      # empatia
      - testo: "Lezione di Empatia"
        descrizione: &aelion-empatia "Aelion ti insegna ad ascoltare chi hai davanti con la pazienza con cui si ascolta il Bosco."
        quando: [empatia == 2]
        requisiti: [rep.circolo >= 4, monete >= 200]
        esito:
          titolo: *aelion-2t
          testo: *aelion-2
          effetti: { monete: -200 }
          pe: { empatia: 10 }
      - testo: "Lezione di Empatia"
        descrizione: *aelion-empatia
        quando: [empatia == 3]
        requisiti: [rep.circolo >= 4, monete >= 400]
        esito:
          titolo: *aelion-3t
          testo: *aelion-3
          effetti: { monete: -400 }
