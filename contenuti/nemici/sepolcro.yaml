# Il Sepolcro violato: la cripta del cimitero e la Roccia di Wren.
# Tarati con npm run simula: chi combatte vince la cripta con buone probabilità; lo spettro è difficile
# a inizio gioco, e ci sono sempre altre strade (esorcismo, resistere, bruciare la capanna).
nemici:
  - id: wight
    immagine: bestiario/wight
    nome: Wight
    descrizione: "Un morto che ricorda di essere stato vivo. Ha le dita lunghe e grigie, e dove tocca la pelle si raffredda."
    attacco: 3
    difesa: 2
    difesaMentale: 3
    pf: 5
    danno: 1
    iniziativa: 2
    tratti: [non-morto]

  - id: osric-wren-spettrale
    immagine: bestiario/osric-wren-spettrale
    nome: Osric Wren, il Cucitore
    descrizione: "Il fantasma del Cucitore, con gli occhi cuciti e un coltello da intaglio fatto della stessa luce fredda del suo corpo."
    attacco: 3
    difesa: 3
    difesaMentale: 3
    pf: 9
    danno: 1
    riduzione: 1
    iniziativa: 3
    magia: 4
    energia: 3
    incantesimi: [sussurro-di-paura, dardo]
    tratti: [non-morto]

scontri:
  - { id: cripta-dei-sommi, nome: "I morti della cripta", nemici: [wight, wight], feriteSconfitta: 3 }
  - { id: spettro-del-cucitore, nome: "Lo spettro del Cucitore", nemici: [osric-wren-spettrale], feriteSconfitta: 3 }
