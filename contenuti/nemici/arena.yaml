# Blocco 8: l'Arena di Qir-Azel. Si apre dopo il ritorno da Capomozzo, quindi tarati per un personaggio a fine
# capitolo (+1 Fisico, +3 alle abilità d'arma). Le creature della prova a squadre sono echi evocati dai cristalli.
nemici:
  - id: gladiatore
    immagine: ambientazione/cristalli-conduttori
    nome: Gladiatore
    descrizione: "Un mercenario di passaggio che si è iscritto per la borsa. Ha uno scudo dipinto di fresco e la paura di sfigurare davanti alla folla."
    attacco: 3
    difesa: 3
    difesaMentale: 2
    pf: 6
    danno: 1
    iniziativa: 2
    puoFuggire: true

  - id: durgan
    immagine: fazioni/scuri
    nome: Durgan
    descrizione: "Un nano massiccio, con il volto pieno di cicatrici e una grande ascia da battaglia. Combatte a pagamento e non parla mai durante uno scontro."
    attacco: 4
    difesa: 3
    difesaMentale: 2
    pf: 10
    danno: 1
    riduzione: 1
    iniziativa: 1

  - id: eco-del-cinghiale
    immagine: bestiario/cinghiale-mutato-gigante
    nome: L'eco del cinghiale
    descrizione: "Un cinghiale grande come un carro, ricomposto dalla luce del cristallo. Ha le setole grigio-azzurre sempre bagnate e lascia sulla sabbia impronte larghe come scodelle da fucina."
    attacco: 5
    difesa: 3
    difesaMentale: 3
    pf: 14
    danno: 1
    riduzione: 1
    iniziativa: 2
    tratti: [eco]

  - id: toren-galdrick
    immagine: personaggi/toren-galdrick
    nome: Toren Galdrick
    descrizione: "Lo sceriffo in armatura scura. Para con il piatto della lama e aspetta che sia tu a sbagliare."
    attacco: 5
    difesa: 4
    difesaMentale: 3
    pf: 12
    danno: 1
    riduzione: 1
    iniziativa: 3

scontri:
  - { id: una-giornata-all-arena, nome: "Una giornata all'Arena", nemici: [gladiatore, gladiatore], feriteSconfitta: 2 }
  - { id: la-grande-mischia, nome: "La Grande Mischia", nemici: [durgan, gladiatore], feriteSconfitta: 3 }
  - { id: una-leggenda, nome: "Una leggenda", nemici: [eco-del-cinghiale], feriteSconfitta: 4 }
  - { id: lo-scontro-delle-ere, nome: "Lo scontro delle ere", nemici: [toren-galdrick], feriteSconfitta: 4 }
  - { id: il-duello-con-galdrick, nome: "Il duello con lo sceriffo", nemici: [toren-galdrick], feriteSconfitta: 3 }
