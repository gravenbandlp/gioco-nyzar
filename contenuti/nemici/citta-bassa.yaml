# Statistiche tarate con npm run simula: il Figlio della Città Bassa vince
# la rissa alla Pignatta ~85% (Facile) e quella alla Segheria ~55% (Medio).
# Le origini non combattive hanno sempre una strada alternativa.
nemici:
  - id: attaccabrighe
    nome: Attaccabrighe
    descrizione: "Nocche spaccate, alito di sidro. Combatte per la scommessa, non per te."
    attacco: 3
    difesa: 3
    difesaMentale: 2
    pf: 7
    danno: 1
    iniziativa: 2
    puoFuggire: true

  - id: marko-thessel
    nome: Marko Thessel
    descrizione: "Caporeparto della Segheria Malgrani. Il sorriso di chi ha già deciso."
    attacco: 3
    difesa: 3
    difesaMentale: 3
    pf: 8
    danno: 1
    riduzione: 0
    iniziativa: 3

  - id: sgherro-malgrani
    nome: Sgherro dei Malgrani
    descrizione: "Livrea con l'albero trafitto da una lama. Pagato a giornata."
    attacco: 2
    difesa: 2
    difesaMentale: 2
    pf: 4
    danno: 0
    riduzione: 0
    iniziativa: 2
    puoFuggire: true

  - id: borseggiatore
    nome: Borseggiatore
    attacco: 2
    difesa: 2
    difesaMentale: 1
    pf: 4
    danno: 0
    iniziativa: 3
    puoFuggire: true

scontri:
  - { id: rissa-pignatta, nome: "Rissa dietro la Pignatta", nemici: [attaccabrighe], feriteSconfitta: 2 }
  - { id: rissa-segheria, nome: "Rissa alla Segheria", nemici: [marko-thessel, sgherro-malgrani], feriteSconfitta: 3 }
  - { id: borseggio, nome: "Il borseggiatore", nemici: [borseggiatore], feriteSconfitta: 2 }
