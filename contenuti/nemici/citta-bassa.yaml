# Statistiche tarate con npm run simula: il Figlio della Città Bassa vince
# la rissa alla Pignatta ~85% (Facile) e quella alla Segheria ~55% (Medio).
# Le origini non combattive hanno sempre una strada alternativa.
nemici:
  - id: attaccabrighe
    nome: Attaccabrighe
    descrizione: "Ha le nocche spaccate e l'alito che puzza di sidro. Combatte perché qualcuno al tavolo ha scommesso su di lui."
    attacco: 3
    difesa: 3
    difesaMentale: 2
    pf: 7
    danno: 1
    iniziativa: 2
    puoFuggire: true

  - id: marko-thessel
    immagine: personaggi/marko-thessel
    nome: Marko Thessel
    descrizione: "Cofondatore della Segheria e socio di Rennick Dole; è lui a trattare con i mercanti. Bello e arrogante, è abituato a spuntarla."
    attacco: 3
    difesa: 3
    difesaMentale: 3
    pf: 8
    danno: 1
    riduzione: 0
    iniziativa: 3

  - id: sgherro-malgrani
    immagine: fazioni/famiglia-malgrani
    nome: Sgherro dei Malgrani
    descrizione: "Porta la livrea dei Malgrani, con l'albero trafitto da una lama, e lo pagano a giornata."
    attacco: 2
    difesa: 2
    difesaMentale: 2
    pf: 4
    danno: 0
    riduzione: 0
    iniziativa: 2
    puoFuggire: true

  - id: borseggiatore
    nome: Borseggiatore
    attacco: 2
    difesa: 2
    difesaMentale: 1
    pf: 4
    danno: 0
    iniziativa: 3
    puoFuggire: true

scontri:
  - { id: rissa-pignatta, nome: "Rissa dietro la Pignatta", nemici: [attaccabrighe], feriteSconfitta: 2 }
  - { id: rissa-segheria, nome: "Rissa alla Segheria", nemici: [marko-thessel, sgherro-malgrani], feriteSconfitta: 3 }
  - { id: borseggio, nome: "Il borseggiatore", nemici: [borseggiatore], feriteSconfitta: 2 }
