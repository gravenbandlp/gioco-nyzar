# Blocco 8: Sotto la pelle di Qir-Azel. Il Maniero Malgrani, i colpi agli Scuri e l'assalto alla Pignatta.
# Si apre dopo il ritorno da Capomozzo: tarati per un personaggio a fine capitolo (+3 alle abilità d'arma).
nemici:
  - id: guardia-malgrani
    immagine: fazioni/famiglia-malgrani
    nome: Guardia dei Malgrani
    descrizione: "Una guardia del Maniero con la livrea verde e l'alloro dorato sul petto. È pagata meglio degli sgherri di città e lo sa."
    attacco: 3
    difesa: 3
    difesaMentale: 2
    pf: 5
    danno: 1
    iniziativa: 2

  - id: roldan-kael
    immagine: fazioni/famiglia-malgrani
    nome: Roldan Kael
    descrizione: "Il caposquadra delle guardie del Maniero, un veterano con la barba tagliata a filo e un fischietto d'osso al collo. Ogni ora sale a guardare lo studio del padrone."
    attacco: 4
    difesa: 3
    difesaMentale: 3
    pf: 9
    danno: 1
    riduzione: 1
    iniziativa: 3

  - id: guardiano-macchina-vegetale
    immagine: bestiario/salvaguardia-precursori
    nome: Il Guardiano del caveau
    descrizione: "Un costrutto di metallo e resina con le giunture fatte di radici. Cola linfa verde a ogni passo, e qualcuno l'ha messo lì per non far toccare il cristallo."
    attacco: 4
    difesa: 3
    difesaMentale: 5
    pf: 15
    danno: 1
    riduzione: 1
    iniziativa: 1

  - id: scagnozzo-degli-scuri
    immagine: fazioni/scuri
    nome: Scagnozzo degli Scuri
    descrizione: "Un ragazzo della Città Bassa con il cappuccio degli Scuri e un coltello da macellaio. Lo pagano a settimana, e la settimana è quasi finita."
    attacco: 3
    difesa: 2
    difesaMentale: 2
    pf: 5
    danno: 1
    iniziativa: 2
    puoFuggire: true

  - id: nihali-cuzan
    immagine: personaggi/nihali-cuzan
    nome: Nihali Cuzan
    descrizione: "Il baro degli Scuri, un mezzelfo dall'aria malata con una lunga pipa. Fra un colpo di tosse e l'altro ti ha già sfilato qualcosa."
    attacco: 3
    difesa: 3
    difesaMentale: 3
    pf: 6
    danno: 0
    iniziativa: 4
    puoFuggire: true

  - id: nestor-gramm
    immagine: personaggi/nestor-gramm
    nome: Nestor Gramm
    descrizione: "L'erborista del Mercato dei Nodi, con il grembiule bruciato e una boccetta verde in mano. Per gli Scuri prepara quello che non si vende dalla porta principale."
    attacco: 3
    difesa: 2
    difesaMentale: 4
    pf: 6
    danno: 1
    iniziativa: 2
    magia: 4
    energia: 3
    incantesimi: [fiala-di-veleno, fumi-dell-erborista, tonico-verde]
    puoFuggire: true

  - id: borso
    immagine: personaggi/borso
    nome: Borso
    descrizione: "Il carceriere della Caserma, largo come una porta. Picchia con le chiavi delle celle legate al pugno."
    attacco: 4
    difesa: 3
    difesaMentale: 2
    pf: 11
    danno: 1
    riduzione: 1
    iniziativa: 2

  - id: mauro-scrocco
    immagine: personaggi/mauro-scrocco
    nome: Mauro Scrocco
    descrizione: "L'oste della Pignatta Grassa e il braccio destro di Mirko Vesh. Sotto il grasso e la camicia aperta ha braccia come tronchi, e un'ascia da boscaiolo."
    attacco: 5
    difesa: 3
    difesaMentale: 2
    pf: 13
    danno: 2
    iniziativa: 1

scontri:
  - { id: le-guardie-del-maniero, nome: "Le guardie del Maniero", nemici: [guardia-malgrani, guardia-malgrani], feriteSconfitta: 2 }
  - { id: roldan-kael, nome: "Roldan Kael", nemici: [roldan-kael, guardia-malgrani], feriteSconfitta: 3 }
  - { id: il-guardiano-del-caveau, nome: "Il Guardiano del caveau", nemici: [guardiano-macchina-vegetale], feriteSconfitta: 4 }
  - { id: la-bisca-di-nihali, nome: "La bisca di Nihali", nemici: [nihali-cuzan, scagnozzo-degli-scuri], feriteSconfitta: 2 }
  - { id: il-retrobottega-di-gramm, nome: "Il retrobottega di Gramm", nemici: [nestor-gramm, scagnozzo-degli-scuri], feriteSconfitta: 2 }
  - { id: la-cassa-degli-scuri, nome: "La cassa degli Scuri", nemici: [scagnozzo-degli-scuri, scagnozzo-degli-scuri, scagnozzo-degli-scuri], feriteSconfitta: 3 }
  - { id: borso, nome: "Borso", nemici: [borso], feriteSconfitta: 3 }
  - { id: mauro-scrocco, nome: "Mauro Scrocco", nemici: [mauro-scrocco], feriteSconfitta: 3 }
  - { id: i-tenenti-di-vesh, nome: "I tenenti di Vesh", nemici: [mauro-scrocco, scagnozzo-degli-scuri], feriteSconfitta: 4 }
