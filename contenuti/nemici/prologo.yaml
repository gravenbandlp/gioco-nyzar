# Nemici del prologo: la razzia del Festival delle Foglie Alate, vista da ogni origine.
# Tarati con npm run simula perché le origini combattive vincano con buone probabilità.
nemici:
  - id: orco-razziatore
    immagine: fazioni/tribu-nove-chiodi
    nome: Orco razziatore
    descrizione: "Ha gli occhi lucidi di febbre e canta mentre colpisce. Non para i colpi e non sembra curarsi di sopravvivere."
    attacco: 3
    difesa: 2
    difesaMentale: 2
    pf: 6
    danno: 1
    iniziativa: 2

  - id: orco-del-tamburo
    immagine: fazioni/tribu-nove-chiodi
    nome: Orco del tamburo
    descrizione: "Porta un tamburo di pelle legato al petto e batte il tempo della litania con il pomo della mazza."
    attacco: 3
    difesa: 3
    difesaMentale: 3
    pf: 8
    danno: 1
    iniziativa: 1
    magia: 3
    energia: 2
    incantesimi: [litania-del-tamburo]

scontri:
  - { id: razzia-orco, nome: "Un orco della razzia", nemici: [orco-razziatore], feriteSconfitta: 2 }
  - { id: razzia-tamburo, nome: "L'orco del tamburo", nemici: [orco-del-tamburo], feriteSconfitta: 2 }
