# Gli Scuri di Mirko Vesh. Tarati con npm run simula: la rissa in Via dei Rasoi è "Difficile" per un
# Figlio della Città Bassa appena creato; si arriva alla pista 7 con qualche livello in più.
nemici:
  - id: squiggor-ironfist
    immagine: personaggi/squiggor-ironfist
    nome: Squiggor Ironfist
    descrizione: "Picchiatore degli Scuri, con una benda sull'occhio e le nocche fasciate. Combatte a mani nude e ride quando lo colpiscono."
    attacco: 3
    difesa: 3
    difesaMentale: 2
    pf: 8
    danno: 1
    iniziativa: 2

  - id: rozalia-marga
    immagine: personaggi/rozalia-marga
    nome: Rozalia Marga
    descrizione: "La falsaria degli Scuri. Tiene un coltello corto nella manica e una fiala di fumo alla cintura, e preferisce la seconda."
    attacco: 2
    difesa: 2
    difesaMentale: 3
    pf: 5
    danno: 0
    iniziativa: 4
    puoFuggire: true

scontri:
  - { id: rissa-via-dei-rasoi, nome: "Gli Scuri in Via dei Rasoi", nemici: [squiggor-ironfist, rozalia-marga], feriteSconfitta: 3 }
