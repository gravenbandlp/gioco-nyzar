# La caccia di Corin nella Foresta Strisciante. Tarati con npm run simula: gli scontri della foresta sono
# "Medi" per chi combatte a inizio gioco; il cinghiale è difficile, e ogni scontro ha una via che lo evita.
nemici:
  - id: orco-spiumatore
    immagine: bestiario/orco
    nome: Orco spiumatore
    descrizione: "Un orco magro della tribù che vive nelle grotte del Gradone Rosso. Ha piume incollate ai capelli e mangia gli uccelli crudi."
    attacco: 3
    difesa: 2
    difesaMentale: 2
    pf: 5
    danno: 1
    iniziativa: 3
    puoFuggire: true

  - id: verme-carogna
    immagine: bestiario/verme-carogna
    nome: Verme carogna
    descrizione: "Lungo quanto un uomo, pallido, con una corona di tentacoli intorno alla bocca. Dove tocca, i muscoli si irrigidiscono."
    attacco: 3
    difesa: 2
    difesaMentale: 1
    pf: 7
    danno: 0
    iniziativa: 2
    tratti: [animale]

  - id: cinghiale-mutato
    immagine: bestiario/cinghiale-crudele-mutato
    nome: Cinghiale mutato
    descrizione: "Più grande di un cavallo, con le vene d'argento sotto la pelle e un sangue grigio che fuma sulle zanne."
    attacco: 4
    difesa: 3
    difesaMentale: 2
    pf: 10
    danno: 1
    riduzione: 0
    iniziativa: 2
    tratti: [animale]

scontri:
  - { id: spiumatori-al-gradone, nome: "Gli Spiumatori al Gradone Rosso", nemici: [orco-spiumatore, orco-spiumatore], feriteSconfitta: 2 }
  - { id: vermi-carogna, nome: "I vermi carogna", nemici: [verme-carogna, verme-carogna], feriteSconfitta: 2 }
  - { id: cinghiale-della-foresta, nome: "Il cinghiale della Foresta Strisciante", nemici: [cinghiale-mutato], feriteSconfitta: 3 }
