# Blocco 7: Rovolungo, la fortezza di Capomozzo e i suoi sotterranei. Tarati con npm run simula per un personaggio
# a fine capitolo, che arriva qui dopo Acciaio e Ira.
nemici:
  - id: orco-profugo
    immagine: fazioni/tribu-capomozzo
    nome: Orco profugo
    descrizione: "Uno degli Spiumatori scappati dal Gradone Rosso dopo la razzia. Si nasconde fra i rovi di Rovolungo, e ha più paura di quello che c'è oltre il ponte che di te."
    attacco: 3
    difesa: 2
    difesaMentale: 1
    pf: 5
    danno: 1
    iniziativa: 2

  - id: borgoth
    immagine: personaggi/borgoth-il-gigante
    nome: Borgoth
    descrizione: "L'eroe di Fondobosco, figlio di un orco e di una ogre. Quando si arrabbia cresce fino a tre metri e diventa per metà fuoco e per metà sottobosco."
    attacco: 4
    difesa: 3
    difesaMentale: 3
    pf: 10
    danno: 1
    iniziativa: 2
    magia: 4
    energia: 4
    incantesimi: [pelle-di-corteccia, fiamma]
    puoFuggire: true

  - id: cenerascura
    immagine: fazioni/tribu-fondobosco
    nome: Cenerascura
    descrizione: "Il puma di Borgoth, con il pelo color brace e gli occhi arancioni. Salta prima che tu lo veda partire."
    attacco: 3
    difesa: 3
    difesaMentale: 2
    pf: 6
    danno: 1
    iniziativa: 4
    tratti: [animale]

  - id: camminatore
    immagine: bestiario/salvaguardia-precursori
    nome: Camminatore
    descrizione: "Una macchina della Salvaguardia dei Precursori, alta quanto un uomo e senza volto, con la testa girata all'indietro. A Capomozzo fa la guardia accanto agli orchi, e gli orchi le stanno alla larga."
    attacco: 3
    difesa: 3
    difesaMentale: 5
    pf: 7
    danno: 1
    riduzione: 1
    iniziativa: 2

  - id: orco-di-capomozzo
    immagine: fazioni/tribu-capomozzo
    nome: Orco di Capomozzo
    descrizione: "Un guerriero della tribù di Balthog, con lo scudo fatto di assi di nave e la spada orchesca."
    attacco: 3
    difesa: 3
    difesaMentale: 2
    pf: 6
    danno: 1
    iniziativa: 2

  - id: cinghiale-da-guerra
    immagine: bestiario/cinghiale-crudele-mutato
    nome: Cinghiale da guerra
    descrizione: "Un cinghiale addestrato a caricare le file nemiche, con le zanne cerchiate di ferro."
    attacco: 3
    difesa: 2
    difesaMentale: 1
    pf: 7
    danno: 1
    iniziativa: 2
    tratti: [animale]

  - id: balthog
    immagine: personaggi/balthog-il-prescelto
    nome: Balthog il Prescelto
    descrizione: "Il capotribù di Capomozzo. Non ha una cicatrice in faccia e combatte a mani nude, perché finora non gli è mai servito altro."
    attacco: 5
    difesa: 4
    difesaMentale: 3
    pf: 14
    danno: 1
    iniziativa: 3

  - id: ghermitore
    immagine: ambientazione/rovine-dei-precursori
    nome: Ghermitore degli scogli
    descrizione: "Un predatore dei Precursori fatto per metà di carne e per metà di lyssan. Vive nella grotta sotto il Buco Ululante e caccia nell'acqua bassa."
    attacco: 4
    difesa: 3
    difesaMentale: 3
    pf: 10
    danno: 1
    riduzione: 1
    iniziativa: 3

  - id: zagrath
    immagine: personaggi/zagrath
    nome: Zagrath
    descrizione: "Il predone di Rovolungo, figlio di una ogre. Tira con un arco lungo che due uomini non riuscirebbero a tendere."
    attacco: 4
    difesa: 3
    difesaMentale: 2
    pf: 11
    danno: 2
    iniziativa: 2

  - id: pungitore
    immagine: ambientazione/marea-grigia
    nome: Pungitore
    descrizione: "Una creatura dei Precursori a forma di cono, con gli occhi rossi. Il tentacolo più lungo punge e l'altro succhia."
    attacco: 4
    difesa: 3
    difesaMentale: 4
    pf: 9
    danno: 1
    iniziativa: 3

  - id: senzavolto
    immagine: ambientazione/evento-notti-cucite-145
    nome: Senzavolto
    descrizione: "Lo spettro di un cultista morto nella cappella, con la maschera bianca ancora sul viso. Sussurra senza bocca e ti svuota la testa."
    attacco: 3
    difesa: 2
    difesaMentale: 3
    pf: 5
    danno: 1
    iniziativa: 3
    magia: 4
    energia: 3
    incantesimi: [sussurro-che-svuota, sussurro-di-paura]
    tratti: [non-morto]

  - id: garin
    immagine: fazioni/tribu-capomozzo
    nome: Garin
    descrizione: "Un mercenario con l'elmo ammaccato e uno scudo dipinto con un volto che urla. Combatte bene e preferisce arrendersi."
    attacco: 4
    difesa: 4
    difesaMentale: 2
    pf: 9
    danno: 1
    riduzione: 1
    iniziativa: 2
    puoFuggire: true

  - id: kessa
    immagine: ambientazione/mito-occhio-nel-cristallo
    nome: Kessa
    descrizione: "Una maga dalla pelle ambrata con un bastone viola e un gatto bianco che le sta sempre fra i piedi. Il suo fuoco brucia più a lungo di quanto dovrebbe."
    attacco: 4
    difesa: 2
    difesaMentale: 4
    pf: 7
    danno: 2
    iniziativa: 3
    magia: 6
    energia: 7
    incantesimi: [fuoco-che-resta, fiamma, scudo-arcano]
    puoFuggire: true

  - id: aurenne
    immagine: ambientazione/mito-regina-ali-spezzate
    nome: Aurenne
    descrizione: "La figlia adottiva di Padre Idrian Sollen. La mano destra non è più una mano, e il congegno che porta al collo comanda le macchine della Salvaguardia."
    attacco: 4
    difesa: 3
    difesaMentale: 5
    pf: 10
    danno: 1
    iniziativa: 4
    magia: 6
    energia: 7
    incantesimi: [ordine-della-salvaguardia, lancia-di-luce, scudo-arcano]

  - id: quadrupede
    immagine: bestiario/salvaguardia-precursori
    nome: Il felino della Salvaguardia
    descrizione: "Una macchina a quattro zampe grande come un cavallo, con una maschera ovale e senza occhi al posto della testa."
    attacco: 4
    difesa: 3
    difesaMentale: 5
    pf: 7
    danno: 1
    riduzione: 1
    iniziativa: 3

  - id: costruttore-di-capomozzo
    immagine: ambientazione/cicatrice-del-mondo
    nome: Il Costruttore di Capomozzo
    descrizione: "Un colosso dei Precursori alto come una torre, con il torace squarciato e un nucleo rosso che pulsa dentro. Un braccio non si muove più."
    attacco: 4
    difesa: 3
    difesaMentale: 5
    pf: 14
    danno: 2
    riduzione: 1
    iniziativa: 1

scontri:
  - { id: nido-dei-profughi, nome: "Il nido dei profughi", nemici: [orco-profugo, orco-profugo], feriteSconfitta: 2 }
  - { id: borgoth-e-cenerascura, nome: "Borgoth e Cenerascura", nemici: [borgoth, cenerascura], feriteSconfitta: 3 }
  - { id: ghermitore, nome: "Il Ghermitore degli scogli", nemici: [ghermitore], feriteSconfitta: 3 }
  - { id: sala-dei-trofei, nome: "La sala dei trofei", nemici: [orco-di-capomozzo, camminatore], feriteSconfitta: 2 }
  - { id: cortile-dei-cinghiali, nome: "Il cortile dei cinghiali", nemici: [cinghiale-da-guerra, cinghiale-da-guerra], feriteSconfitta: 2 }
  - { id: torre-di-guardia, nome: "La torre di guardia", nemici: [orco-di-capomozzo, orco-di-capomozzo], feriteSconfitta: 2 }
  - { id: balthog, nome: "Balthog il Prescelto", nemici: [balthog], feriteSconfitta: 4 }
  - { id: zagrath, nome: "Zagrath nell'harem", nemici: [zagrath, orco-di-capomozzo], feriteSconfitta: 3 }
  - { id: pungitore, nome: "Il Pungitore", nemici: [pungitore], feriteSconfitta: 3 }
  - { id: senzavolto, nome: "I Senzavolto della cappella", nemici: [senzavolto, senzavolto], feriteSconfitta: 2 }
  - { id: garin-e-kessa, nome: "Garin e Kessa", nemici: [garin, kessa], feriteSconfitta: 3 }
  - { id: aurenne, nome: "Aurenne sul ponte", nemici: [aurenne, quadrupede], feriteSconfitta: 4 }
  - { id: costruttore, nome: "Il Costruttore di Capomozzo", nemici: [costruttore-di-capomozzo], feriteSconfitta: 4 }
