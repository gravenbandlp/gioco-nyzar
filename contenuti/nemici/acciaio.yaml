# Blocco 6: Acciaio e Ira. L'Acciaieria occupata dagli orchi di Isvaro e le Segrete dell'Ira sotto la città.
# Tarati con npm run simula per un personaggio a fine capitolo (vedi docs/piano-capitolo-1.md).
nemici:
  - id: orco-della-fornace
    immagine: bestiario/orco
    nome: Orco della fornace
    descrizione: "Uno degli orchi di Isvaro, nascosto da settimane nell'Acciaieria. Combatte con le pinze del forno e lancia lastre di metallo ancora rosse."
    attacco: 3
    difesa: 2
    difesaMentale: 2
    pf: 6
    danno: 1
    iniziativa: 2

  - id: isvaro-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    nome: Isvaro Tarvelin
    descrizione: "Il figlio mezzelfo di Maerith Tarvelin, cresciuto lontano dalla famiglia. Tira con l'arco meglio di chiunque in città e, se le cose si mettono male, scappa."
    attacco: 4
    difesa: 3
    difesaMentale: 3
    pf: 10
    danno: 1
    iniziativa: 4
    puoFuggire: true

  - id: colata-dell-ira
    immagine: ambientazione/marea-grigia
    nome: Colata dell'Ira
    descrizione: "Un corpo glabro e magro, con le gambe piegate all'indietro e una bocca piena di piccole mani. La vasca triangolare dell'Aula dell'Ira lo distilla dalla rabbia dei morti."
    attacco: 3
    difesa: 2
    difesaMentale: 1
    pf: 6
    danno: 1
    iniziativa: 3
    tratti: [eco]

  - id: testa-alata
    immagine: ambientazione/evento-notti-cucite-145
    nome: Testa alata
    descrizione: "Una testa senza corpo, grande come quella di un cavallo, che vola su ali di pipistrello e trascina tentacoli dal mento. Infesta i luoghi pieni di morti."
    attacco: 3
    difesa: 3
    difesaMentale: 2
    pf: 5
    danno: 1
    iniziativa: 3

  - id: morto-delle-fosse
    immagine: bestiario/wight
    nome: Morto delle fosse
    descrizione: "Uno dei prigionieri che il demone tiene nelle fosse sotto i portelli. Da tempo ha dimenticato il proprio nome e la strada per uscire."
    attacco: 2
    difesa: 1
    difesaMentale: 1
    pf: 5
    danno: 1
    iniziativa: 1
    tratti: [non-morto]

  - id: uzgreth
    immagine: personaggi/uzgreth
    nome: Uzgreth
    descrizione: "L'eroe dei Nove Chiodi, scomparso mesi fa in un nascondiglio sotterraneo. L'acqua dell'altare l'ha gonfiato e storto, e ora fa la guardia per il demone con uno spadone da ogre."
    attacco: 4
    difesa: 3
    difesaMentale: 2
    pf: 11
    danno: 2
    riduzione: 1
    iniziativa: 2

  - id: yoggoth
    immagine: ambientazione/mito-occhio-nel-cristallo
    nome: Yoggoth
    descrizione: "Il demone che custodisce le Segrete dell'Ira da quando i Precursori sono caduti. È alto più di tre metri e le sue braccia superiori finiscono in due chele. Ha perso il senno da molto tempo."
    attacco: 4
    difesa: 3
    difesaMentale: 4
    pf: 13
    danno: 1
    riduzione: 1
    iniziativa: 3
    magia: 5
    energia: 6
    incantesimi: [furia-dell-ira, sussurro-di-paura]

scontri:
  - { id: la-fornace, nome: "Isvaro e gli orchi della fornace", nemici: [isvaro-tarvelin, orco-della-fornace], feriteSconfitta: 3 }
  - { id: orchi-della-fornace, nome: "Gli orchi della fornace", nemici: [orco-della-fornace, orco-della-fornace], feriteSconfitta: 2 }
  - { id: una-colata, nome: "Una Colata dell'Ira", nemici: [colata-dell-ira], feriteSconfitta: 2 }
  - { id: due-colate, nome: "Due Colate dell'Ira", nemici: [colata-dell-ira, colata-dell-ira], feriteSconfitta: 3 }
  - { id: testa-alata, nome: "La testa alata", nemici: [testa-alata], feriteSconfitta: 2 }
  - { id: le-fosse, nome: "Uzgreth e le fosse", nemici: [uzgreth], feriteSconfitta: 3 }
  - { id: l-aula-dell-ira, nome: "Yoggoth nell'Aula dell'Ira", nemici: [yoggoth, colata-dell-ira], feriteSconfitta: 4 }
