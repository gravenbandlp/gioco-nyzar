# Blocco 5: il custode dei ponti notturni e la Palude Acquanera.
# Tarati con npm run simula: chi combatte arriva a questi scontri con qualche livello in più rispetto all'inizio.
nemici:
  - id: maedric-holl
    immagine: personaggi/maedric-holl
    nome: Maedric Holl
    descrizione: "Il custode notturno del Ponte dei Morti. Conosce ogni asse che scricchiola e sa dove il vento spinge chi perde l'equilibrio."
    attacco: 3
    difesa: 3
    difesaMentale: 3
    pf: 8
    danno: 1
    iniziativa: 3
    puoFuggire: true

  - id: balestriere-della-gilda
    immagine: fazioni/gilda-dei-mercanti
    nome: Balestriere della Gilda
    descrizione: "Uno degli uomini di Maedric, con la balestra corta e il mantello dei Custodi rovesciato per non farsi riconoscere."
    attacco: 2
    difesa: 2
    difesaMentale: 2
    pf: 4
    danno: 1
    iniziativa: 2
    puoFuggire: true

  - id: orco-spacca-ossa
    immagine: fazioni/tribu-spacca-ossa
    nome: Orco spacca-ossa
    descrizione: "Un orco della Palude Acquanera, nuotatore eccellente. Aspetta nell'acqua invece di inseguire."
    attacco: 3
    difesa: 2
    difesaMentale: 2
    pf: 6
    danno: 1
    iniziativa: 2

  - id: skarr
    immagine: personaggi/skarr
    nome: Skarr
    descrizione: "L'eroe cannibale degli Spacca-ossa, con un'ascia bipenne più alta di un ragazzo."
    attacco: 4
    difesa: 3
    difesaMentale: 2
    pf: 9
    danno: 1
    iniziativa: 2

  - id: bolgrum
    immagine: personaggi/bolgrum
    nome: Bolgrum
    descrizione: "Il capotribù degli Spacca-ossa. È così grasso che non si alza dal trono di teschi, e combatte con la voce e con i bastoni del suo sciamano."
    attacco: 2
    difesa: 2
    difesaMentale: 4
    pf: 7
    danno: 0
    iniziativa: 1

scontri:
  - { id: maedric-sul-ponte, nome: "Maedric sul Ponte dei Morti", nemici: [maedric-holl, balestriere-della-gilda], feriteSconfitta: 3 }
  - { id: spacca-ossa-nel-fango, nome: "Gli Spacca-ossa nel fango", nemici: [orco-spacca-ossa, orco-spacca-ossa], feriteSconfitta: 2 }
  - { id: la-torre-di-bolgrum, nome: "Bolgrum e Skarr", nemici: [skarr, bolgrum], feriteSconfitta: 4 }
