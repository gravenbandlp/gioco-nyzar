# Blocco 8: le rovine dei Raschiatori (Vhar'Ul, il Laboratorio di Calibrazione, il Sito Mahr-Kel). Spedizioni
# ripetibili per chi è nei turni di scavo; tarate per un personaggio a fine capitolo.
nemici:
  - id: riflesso-distorto
    immagine: ambientazione/rovine-dei-precursori
    nome: Riflesso distorto
    descrizione: "Una copia di te fatta di luce e sabbia metallica, con le giunture al posto sbagliato. Ti imita in ritardo, e a volte in anticipo."
    attacco: 4
    difesa: 3
    difesaMentale: 3
    pf: 10
    danno: 2
    riduzione: 2
    iniziativa: 3
    tratti: [eco]

  - id: residuo-di-vhar-ul
    immagine: ambientazione/rovine-dei-precursori
    nome: Il Residuo di Vhar'Ul
    descrizione: "Un costrutto per metà di metallo e per metà di carne mummificata, con la tuta di un Raschiatore cucita addosso. Quando si muove le sfere sul soffitto girano più forte."
    attacco: 4
    difesa: 3
    difesaMentale: 5
    pf: 23
    danno: 3
    riduzione: 4
    iniziativa: 2

  - id: braccio-meccanico
    immagine: bestiario/salvaguardia-precursori
    nome: Braccio di calibrazione
    descrizione: "Un braccio articolato appeso a un binario del soffitto. Misura le cose colpendole, e se lo colpisci ti considera un errore da correggere."
    attacco: 4
    difesa: 4
    difesaMentale: 5
    pf: 9
    danno: 2
    riduzione: 3
    iniziativa: 2

  - id: drone-alfa-x
    immagine: bestiario/salvaguardia-precursori
    nome: Il drone di calibrazione
    descrizione: "Un cilindro con tre anelli che girano in sensi opposti, sospeso a mezz'aria sopra il nodo principale. I Raschiatori lo chiamano Alfa-X, dalla sigla incisa sul nucleo."
    attacco: 5
    difesa: 4
    difesaMentale: 5
    pf: 17
    danno: 3
    riduzione: 4
    iniziativa: 3

  - id: parassita-di-mahr-kel
    immagine: ambientazione/rovine-dei-precursori
    nome: Parassita di Mahr-Kel
    descrizione: "Una mano senza corpo, lucida di fluido ambrato, che corre sulle dita. Cerca una gola o un polso."
    attacco: 3
    difesa: 3
    difesaMentale: 4
    pf: 7
    danno: 2
    iniziativa: 4

  - id: abominio-incompleto
    immagine: ambientazione/rovine-dei-precursori
    nome: L'abominio incompleto
    descrizione: "Un corpo che la vasca non ha finito di fare, con troppe braccia da una parte. È lento, e quello che afferra non lo lascia più."
    attacco: 4
    difesa: 2
    difesaMentale: 1
    pf: 21
    danno: 4
    riduzione: 3
    iniziativa: 0

  - id: costrutto-biologico
    immagine: ambientazione/rovine-dei-precursori
    nome: Il costrutto biologico
    descrizione: "Più alto di una porta, con placche sulla spina dorsale e il tessuto nervoso che brilla sotto la pelle. Al posto degli occhi ha una placca liscia, eppure si gira sempre verso di te."
    attacco: 5
    difesa: 3
    difesaMentale: 4
    pf: 22
    danno: 3
    riduzione: 4
    iniziativa: 2

scontri:
  - { id: riflesso-distorto, nome: "Il riflesso distorto", nemici: [riflesso-distorto], feriteSconfitta: 2 }
  - { id: residuo-di-vhar-ul, nome: "Il Residuo di Vhar'Ul", nemici: [residuo-di-vhar-ul], feriteSconfitta: 4 }
  - { id: braccio-di-calibrazione, nome: "Il braccio di calibrazione", nemici: [braccio-meccanico], feriteSconfitta: 2 }
  - { id: drone-alfa-x, nome: "Il drone di calibrazione", nemici: [drone-alfa-x], feriteSconfitta: 4 }
  - { id: parassiti-di-mahr-kel, nome: "I parassiti", nemici: [parassita-di-mahr-kel, parassita-di-mahr-kel], feriteSconfitta: 2 }
  - { id: abominio-incompleto, nome: "L'abominio incompleto", nemici: [abominio-incompleto], feriteSconfitta: 3 }
  - { id: costrutto-biologico, nome: "Il costrutto biologico", nemici: [costrutto-biologico], feriteSconfitta: 4 }
