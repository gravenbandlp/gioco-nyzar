# Regolamento, sezione 7. Tutti si lanciano con Mentale + Magia; il livello N richiede Magia ≥ N
# e costa N di Energia in combattimento. Con zero successi c'è la Dissonanza (+½ Tormento).
# Le formule precuriane hanno un prezzo a ogni lancio. Gli incantesimi ignorano l'armatura.
incantesimi:
  # ------------------------------------------------------------ Arte dei cristalli
  - id: dardo
    nome: Dardo
    tradizione: cristalli
    livello: 1
    uso: [combattimento]
    immagine: ambientazione/cristalli-conduttori
    descrizione: "Un ago di luce azzurra che parte dal cristallo e colpisce a distanza. Danno pari al margine più 1."
    tipo: attacco
    difesa: acrobazia
    danno: 1

  - id: scudo-arcano
    nome: Scudo arcano
    tradizione: cristalli
    livello: 1
    uso: [combattimento]
    immagine: ambientazione/cristalli-conduttori
    descrizione: "Una lamina di Mana ti ferma i colpi a un palmo dal corpo. +1 dado in difesa per 3 round."
    tipo: potenziamento
    modifica: { tipo: difesa, valore: 1, round: 3 }

  - id: sussurro-di-paura
    nome: Sussurro di paura
    tradizione: cristalli
    livello: 1
    uso: [combattimento]
    immagine: ambientazione/cristalli-conduttori
    descrizione: "Una voce che il bersaglio sente dentro l'orecchio. −1 dado in attacco per 2 round, se non resiste con Resilienza."
    tipo: indebolimento
    difesa: resilienza
    modifica: { tipo: attacco, valore: -1, round: 2 }

  - id: luce-fredda
    nome: Luce fredda
    tradizione: cristalli
    livello: 1
    uso: [storie]
    immagine: ambientazione/cristalli-conduttori
    descrizione: "Accende il cristallo di una luce senza calore. Serve dove è buio, nei cunicoli come nelle rovine."

  - id: leggere-il-mana
    nome: Leggere il Mana
    tradizione: cristalli
    livello: 2
    uso: [storie]
    immagine: ambientazione/cristalli-conduttori
    descrizione: "Con le dita su un cristallo ne senti la carica. Distingue i cristalli carichi da quelli sterili e da quelli falsi, e avverte i reperti ancora attivi."

  - id: fiamma
    nome: Fiamma
    tradizione: cristalli
    livello: 2
    uso: [combattimento]
    immagine: ambientazione/cristalli-conduttori
    descrizione: "Una lingua di fuoco azzurro. Danno pari al margine più 2."
    tipo: attacco
    difesa: acrobazia
    danno: 2

  - id: rapidita
    nome: Rapidità
    tradizione: cristalli
    livello: 2
    uso: [combattimento]
    immagine: ambientazione/cristalli-conduttori
    descrizione: "Il Mana ti scorre nei muscoli e il mondo rallenta. +1 dado in attacco per 3 round."
    tipo: potenziamento
    modifica: { tipo: attacco, valore: 1, round: 3 }

  - id: sigillo
    nome: Sigillo
    tradizione: cristalli
    livello: 3
    uso: [storie]
    immagine: ambientazione/cristalli-conduttori
    descrizione: "Chiude o apre le serrature di Mana dei Precursori e quelle che il Velo mette sulle porte importanti."

  - id: lancia-di-luce
    nome: Lancia di luce
    tradizione: cristalli
    livello: 3
    uso: [combattimento]
    immagine: ambientazione/cristalli-conduttori
    descrizione: "Un raggio che non si può deviare. Quattro successi fissi contro la difesa, danno pari al margine più 2."
    tipo: automatico
    difesa: acrobazia
    successi: 4
    danno: 2

  - id: folgore
    nome: Folgore
    tradizione: cristalli
    livello: 5
    uso: [combattimento]
    immagine: ambientazione/cristalli-conduttori
    descrizione: "Tutto il Mana del cristallo in un colpo solo. Sei successi fissi contro la difesa, danno pari al margine più 3."
    tipo: automatico
    difesa: acrobazia
    successi: 6
    danno: 3

  # ------------------------------------------------------------ Liturgia dell'Albero
  - id: benedizione
    nome: Benedizione
    tradizione: albero
    livello: 1
    uso: [combattimento]
    immagine: fazioni/confraternita-del-velo
    descrizione: "Una preghiera breve al Grande Albero Rosso. +1 dado a tutti i tuoi tiri per 2 round."
    tipo: potenziamento
    modifica: { tipo: tutti, valore: 1, round: 2 }

  - id: rimarginare
    nome: Rimarginare
    tradizione: albero
    livello: 2
    uso: [combattimento, storie]
    immagine: fazioni/confraternita-del-velo
    descrizione: "Le ferite si chiudono sotto le mani. In combattimento recuperi PF pari ai successi; fuori dal combattimento toglie mezza Ferita."
    tipo: cura

  - id: veglia
    nome: Veglia
    tradizione: albero
    livello: 2
    uso: [storie]
    immagine: fazioni/confraternita-del-velo
    descrizione: "Una notte di preghiera accanto a chi ne ha bisogno, o per te stesso. Riduce il Tormento."

  - id: esorcismo
    nome: Esorcismo
    tradizione: albero
    livello: 3
    uso: [combattimento, storie]
    immagine: fazioni/confraternita-del-velo
    descrizione: "Scaccia ciò che non dovrebbe restare. Danno pari al margine più 2 contro Resilienza, doppio contro non morti ed Echi di Mana. Nelle storie libera i luoghi infestati."
    tipo: attacco
    difesa: resilienza
    danno: 2
    doppioContro: [non-morto, eco]

  # ------------------------------------------------------------ Via del Respiro
  - id: pelle-di-corteccia
    nome: Pelle di corteccia
    tradizione: respiro
    livello: 1
    uso: [combattimento]
    immagine: fazioni/circolo-di-velthar
    descrizione: "La pelle si indurisce come legno vecchio. +1 riduzione per 3 round."
    tipo: potenziamento
    modifica: { tipo: riduzione, valore: 1, round: 3 }

  - id: richiamo
    nome: Richiamo
    tradizione: respiro
    livello: 1
    uso: [combattimento, storie]
    immagine: fazioni/circolo-di-velthar
    descrizione: "Parli alle bestie nella lingua che il Circolo insegna ai bambini. Un animale ostile se ne va se vinci di 2 contro la sua Resilienza. Nelle storie apre opzioni con gli animali."
    tipo: fuga
    difesa: resilienza
    solo: [animale]
    margineFuga: 2

  - id: radici
    nome: Radici
    tradizione: respiro
    livello: 2
    uso: [combattimento]
    immagine: fazioni/circolo-di-velthar
    descrizione: "Il terreno trattiene i piedi del bersaglio. −2 dadi in difesa per 2 round, se non resiste con Resistenza."
    tipo: indebolimento
    difesa: resistenza
    modifica: { tipo: difesa, valore: -2, round: 2 }

  - id: bere-la-marea
    nome: Bere la Marea
    tradizione: respiro
    livello: 3
    uso: [storie]
    immagine: fazioni/circolo-di-velthar
    descrizione: "Tiri fuori la Marea Grigia dal corpo di qualcuno e la prendi su di te, come fanno le piante del Circolo. Toglie 1 Contaminazione al bersaglio e te ne dà mezza."

  - id: veleno-dell-anima
    nome: Veleno dell'anima
    tradizione: respiro
    livello: 3
    uso: [combattimento]
    immagine: fazioni/circolo-di-velthar
    descrizione: "Spore e linfa nera. Danno pari al margine più 1 contro Resistenza, poi 1 danno a round per 2 round."
    tipo: attacco
    difesa: resistenza
    danno: 1
    veleno: { valore: 1, round: 2 }

  - id: tempesta
    nome: Tempesta
    tradizione: respiro
    livello: 4
    uso: [combattimento]
    immagine: fazioni/circolo-di-velthar
    descrizione: "Una tempesta di grandine e rami spezzati su tutti i nemici. Un tiro contro la difesa di ciascuno, danno pari al margine più 1."
    tipo: area
    difesa: acrobazia
    danno: 1

  # ------------------------------------------------------------ Formule precuriane (proibite)
  - id: maledizione
    nome: Maledizione
    tradizione: precuriane
    livello: 3
    uso: [combattimento]
    immagine: ambientazione/rovine-dei-precursori
    descrizione: "Una formula che il bersaglio sente come un peso sul petto. −2 dadi a tutti i suoi tiri per 2 round, se non resiste con Resilienza. Ogni lancio costa mezza tacca di Tormento."
    tipo: indebolimento
    difesa: resilienza
    modifica: { tipo: tutti, valore: -2, round: 2 }
    prezzo: { tormento: 0.5 }

  - id: correzione
    nome: Correzione
    tradizione: precuriane
    livello: 3
    uso: [storie]
    immagine: ambientazione/rovine-dei-precursori
    descrizione: "La formula dei Profeti delle Geometrie, per i quali ciò che si disegna accade. Dopo una prova fallita puoi annullarne l'esito e ripeterla, con una prova Media di Magia e una candela. Ogni lancio costa mezza tacca di Tormento."
    prezzo: { tormento: 0.5 }

  - id: paralisi
    nome: Paralisi
    tradizione: precuriane
    livello: 4
    uso: [combattimento]
    immagine: ambientazione/rovine-dei-precursori
    descrizione: "Il corpo del bersaglio smette di obbedirgli. Salta il prossimo round, se non resiste con Resistenza. Ogni lancio costa mezza tacca di Tormento."
    tipo: indebolimento
    difesa: resistenza
    modifica: { tipo: salta, valore: 0, round: 1 }
    prezzo: { tormento: 0.5 }

  - id: eco
    nome: Eco
    tradizione: precuriane
    livello: 4
    uso: [storie]
    immagine: ambientazione/rovine-dei-precursori
    descrizione: "Leggi la memoria di un luogo o parli con un Eco di Mana. Ogni lancio costa mezza tacca di Tormento."
    prezzo: { tormento: 0.5 }

  - id: comando
    nome: Comando
    tradizione: precuriane
    livello: 5
    uso: [storie]
    immagine: ambientazione/rovine-dei-precursori
    descrizione: "Un ordine nella lingua delle macchine della Salvaguardia. A volte obbediscono. Ogni lancio costa mezza tacca di Contaminazione."
    prezzo: { contaminazione: 0.5 }

  # ------------------------------------------------------------ dei nemici
  # Li lanciano soltanto i nemici che hanno la magia (contenuti/nemici/*.yaml, campo incantesimi): nessuno li
  # insegna. Con `alleati` un potenziamento vale per chi lancia e per tutti i suoi compagni ancora in piedi.
  - id: canto-degli-antenati
    nome: Canto degli antenati
    tradizione: respiro
    livello: 2
    uso: [combattimento]
    soloNemici: true
    immagine: ambientazione/palude-acquanera
    descrizione: "Lo sciamano chiama i morti della tribù a guardare la battaglia. Lui e i suoi hanno +1 dado in attacco per 2 round."
    tipo: potenziamento
    alleati: true
    modifica: { tipo: attacco, valore: 1, round: 2 }

  - id: litania-del-tamburo
    nome: La litania del tamburo
    tradizione: respiro
    livello: 1
    uso: [combattimento]
    soloNemici: true
    descrizione: "Il tamburo batte il tempo della litania degli orchi, e chi la sente non ha più paura. Chi suona e i suoi hanno +1 dado a tutti i tiri per 2 round."
    tipo: potenziamento
    alleati: true
    modifica: { tipo: tutti, valore: 1, round: 2 }

  - id: fuoco-che-resta
    nome: Fuoco che resta
    tradizione: cristalli
    livello: 2
    uso: [combattimento]
    soloNemici: true
    immagine: ambientazione/cristalli-conduttori
    descrizione: "Una fiamma viola che non si spegne quando dovrebbe. Danno pari al margine più 1, poi 1 danno a round per 2 round."
    tipo: attacco
    difesa: acrobazia
    danno: 1
    veleno: { valore: 1, round: 2 }

  - id: ordine-della-salvaguardia
    nome: Ordine della Salvaguardia
    tradizione: precuriane
    livello: 2
    uso: [combattimento]
    soloNemici: true
    immagine: ambientazione/rovine-dei-precursori
    descrizione: "Il congegno al collo manda un ordine alle macchine della Salvaguardia. Chi lo porta e le macchine hanno +1 dado in attacco per 2 round."
    tipo: potenziamento
    alleati: true
    modifica: { tipo: attacco, valore: 1, round: 2 }

  - id: furia-dell-ira
    nome: La furia dell'Ira
    tradizione: precuriane
    livello: 2
    uso: [combattimento]
    soloNemici: true
    descrizione: "Il demone si nutre della propria rabbia, e le chele colpiscono più forte. +2 dadi in attacco per 2 round."
    tipo: potenziamento
    modifica: { tipo: attacco, valore: 2, round: 2 }

  - id: sussurro-che-svuota
    nome: Il sussurro che svuota
    tradizione: precuriane
    livello: 1
    uso: [combattimento]
    soloNemici: true
    descrizione: "Una voce senza bocca che ti porta via i pensieri uno alla volta. Danno pari al margine più 1 contro Resilienza."
    tipo: attacco
    difesa: resilienza
    danno: 1

  # ------------------------------------------------------------ le fiale degli alchimisti
  # Le usano i nemici che non lanciano incantesimi ma preparano intrugli (alchimia: true): il registro dice «usa»,
  # la carta mostra le Fiale al posto dell'Energia, e ogni fiala costa 1. Con zero successi la fiala non fa effetto.
  - id: fiala-di-veleno
    nome: Fiala di veleno
    tradizione: respiro
    livello: 1
    uso: [combattimento]
    soloNemici: true
    alchimia: true
    descrizione: "Una boccetta verde che si rompe sul petto e brucia attraverso i vestiti. Danno pari al margine, poi 1 danno a round per 3 round."
    tipo: attacco
    difesa: resistenza
    veleno: { valore: 1, round: 3 }

  - id: fumi-dell-erborista
    nome: I fumi dell'erborista
    tradizione: respiro
    livello: 1
    uso: [combattimento]
    soloNemici: true
    alchimia: true
    descrizione: "Vapori dolciastri che appesantiscono le braccia e annebbiano gli occhi. −1 dado a tutti i tiri per 2 round, se non resisti con Resistenza."
    tipo: indebolimento
    difesa: resistenza
    modifica: { tipo: tutti, valore: -1, round: 2 }

  - id: tonico-verde
    nome: Il tonico verde
    tradizione: respiro
    livello: 1
    uso: [combattimento]
    soloNemici: true
    alchimia: true
    descrizione: "Un sorso amaro che chiude i tagli e fa tornare il colore. Recupera PF pari ai successi."
    tipo: cura

  - id: cortina-di-fumo
    nome: Cortina di fumo
    tradizione: respiro
    livello: 1
    uso: [combattimento]
    soloNemici: true
    alchimia: true
    descrizione: "La fiala si rompe a terra e il fumo grigio riempie la strada. Chi la usa e i suoi hanno +1 dado in difesa per 2 round."
    tipo: potenziamento
    alleati: true
    modifica: { tipo: difesa, valore: 1, round: 2 }

  - id: polvere-negli-occhi
    nome: Polvere negli occhi
    tradizione: respiro
    livello: 1
    uso: [combattimento]
    soloNemici: true
    alchimia: true
    descrizione: "Un pugno di polvere urticante lanciato in faccia. −2 dadi in attacco per 1 round, se non la schivi con Acrobazia."
    tipo: indebolimento
    difesa: acrobazia
    modifica: { tipo: attacco, valore: -2, round: 1 }
