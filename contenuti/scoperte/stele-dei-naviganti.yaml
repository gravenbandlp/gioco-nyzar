    immagine: icone/spear-feather
    descrizione: "Il braccio del fanalista della settima colonna, un'asta di metallo grigio lunga quanto una lancia e fredda anche al sole. La sua ombra cade sempre verso est, e la punta trova le giunture delle armature come il faro trovava le navi."
    slot: arma
    base: lancia
    grado: 3
    dadi: 1
    proprieta: { affilata: 1, penetrante: 1 }
