# Le Stele dei Naviganti, spedizione dei luoghi neri (docs/piano-superficie.md, «Le nove spedizioni dei luoghi neri»).
# Sette colonne basse di pietra grigia in pianura, due giorni e mezzo a sud-ovest di Qir-Azel oltre la Foresta
# Strisciante (codex sf-stele-dei-naviganti). Di giorno le ombre cadono tutte verso Korith, come nel canone dei
# Raschiatori (`raschiatori-le-ombre-che-indicano`, la campagna della Biblioteca del 142): le Stele sono un faro per
# le navi dei Precursori, e le ombre aspettano ancora una nave che non è mai arrivata. Sotto le colonne ci sono le
# lanterne nere che fanno le ombre, e la sala dei naviganti con le rotte incise nel pavimento. Nella notte di luna
# nuova la settima colonna proietta un'ombra in più, che punta altrove. Il vecchio della carta `carta-voci-stele` ne
# aveva contate otto, e nessuno gli aveva creduto. La base della settima porta i nove segni dell'Anello del
# Camminatore, con le sette righe delle Stele più consumate delle altre.
#
# Ingresso `stele-dei-naviganti-le-sette-colonne` (Superficie, ripetibile, traccia.stele >= 3): due vie con prova
# (chi fallisce torna indietro), il cavallo a costo 0, il sentiero lungo il margine della Foresta a costo 2.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
#   0 le sette ombre, il campo del 142;
#   1 la galleria delle lanterne;
#   1–3 le ombre staccate (combattimento contro due gregari);
#   2 la sala dei naviganti, la lanterna nera;
#   3 il pozzo della settima, l'ombra che ti segue.
# Il cuore a 4 è la notte senza luna (`stele-dei-naviganti-la-notte-senza-luna`, misura.stele == 0): il fanalista
# della settima colonna (boss), oppure il filo teso sull'ombra prima che lui la spenga (Percezione o Tecnologia), il
# Comando, tutte Difficili; per l'Apprendista Raschiatore i paletti e il filo come insegna la squadra (Atletica o
# Tecnologia, Difficile). La vittoria dà misura.stele, l'Asta del fanalista e parti dei Precursori; chi fallisce torna
# in Superficie senza misura.
# Dopo, `stele-dei-naviganti-la-settima-colonna` (ripetibile, misura.stele >= 1) rende meno.
#
# La direzione (la misura delle Stele, per chi scrive la Campana Sepolta): l'ombra in più punta a nord-est. Tirata
# sulla carta passa a nord della città, attraversa il Rovolungo e finisce sulla costa, su una scogliera grigia dove
# la carta della Gilda ha soltanto il segno della costa. La prosa non nomina la Campana.
aree:
  - id: stele-dei-naviganti
    immagine: ambientazione/superficie-fratturata
    nome: Le Stele dei Naviganti
    sommario: "Sette colonne basse in fila nella pianura oltre la Foresta Strisciante, con le ombre fabbricate là sotto."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      La pianura oltre la Foresta Strisciante è piatta e gialla d'erba corta fino all'orizzonte, e le sette colonne ci stanno in fila come paletti
      di un recinto che non c'è più. Sono colonne di pietra grigia alte a stento un uomo, e le loro ombre nere cadono parallele verso est a
      qualunque ora, anche quando il sole è dalla parte sbagliata.

      Le ombre si fabbricano sotto terra e salgono su per le colonne come il fumo su per un camino.

colonna:
  - { contesto: area, id: stele-dei-naviganti, musica: desolate-march, ambiente: forest-night }

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: stele-dei-naviganti-le-sette-colonne
    immagine: ambientazione/foresta-strisciante
    titolo: Le sette colonne
    sommario: "Sette colonne grigie in fila nella pianura a sud-ovest, oltre la Foresta Strisciante, poco prima della luna nuova."
    luogo: Superficie Fratturata, la pianura oltre la Foresta Strisciante
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.stele >= 3]
    testo: |
      L'ultima notte di cammino, alla vigilia della luna nuova, la luna è un'unghia sottile
      sopra la Foresta Strisciante.

      Poi la pianura si apre sulle Stele, sette colonne così allineate che la prima nasconde
      le altre sei. È mezzogiorno, e le ombre sono lunghe come a sera, tutte verso est.
      Intorno alla punta di ogni ombra sono piantati paletti, alcuni marci di licheni, altri
      di legno ancora chiaro.

      {origine apprendista-raschiatore} I paletti chiari li ha piantati una squadra dei
      Raschiatori, con il nodo del turno sulla cordicella in cima.

      Alla base della prima colonna, fra l'erba, c'è una fessura scura.
    opzioni:
      - testo: "Seguire l'ombra della prima colonna fino alla base"
        descrizione: "Le ombre non le fa il sole, e alla base si vede da dove escono."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Da dove escono
          testo: |
            Alla base della prima colonna l'ombra sale dalla terra come l'acqua da
            una sorgente, da una fessura sottile. La allarghi con il coltello e le
            dita, e sotto c'è un gradino di pietra liscia e fredda.
          pe: { percezione: 2 }
          vai: stele-dei-naviganti
        fallimento:
          titolo: La punta dell'ombra
          testo: |
            Segui l'ombra dalla parte sbagliata e cammini fino a sera dietro a una cosa che si allunga quanto cammini tu, e dormi
            nell'erba.
          effetti: { tormento: 0.5 }
      - testo: "Scavare alla base della settima colonna"
        descrizione: "La settima è quella della storia del vecchio rilevatore."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il gradino freddo
          testo: |
            A un braccio di profondità la terra diventa fredda come neve sciolta, e sotto c'è una fila di gradini di
            pietra liscia che scende nel buio.
          pe: { atletica: 2 }
          vai: stele-dei-naviganti
        fallimento:
          titolo: La terra fredda
          testo: |
            La terra diventa così fredda che le mani non reggono più la pala, e ti
            siedi ad aspettare che tornino tue.
          effetti: { ferite: 0.5 }
      - testo: "Arrivare a cavallo e girare intorno alle colonne"
        descrizione: "Un cavallo sente il freddo che sale da sotto prima di te."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il cavallo che sbuffa
          testo: |
            Il cavallo rallenta davanti alla prima colonna e abbassa il muso
            sbuffando, come davanti a un ruscello d'inverno. Lì c'è una fessura, e
            sotto un gradino di pietra liscia che scende.
          vai: stele-dei-naviganti
      - testo: "Prendere il sentiero lungo il margine della Foresta"
        descrizione: "Il sentiero più sicuro corre lungo gli alberi, che ti tengono d'occhio."
        costo: 2
        esito:
          titolo: Il margine degli alberi
          testo: |
            La notte la passi con la schiena contro un sasso e gli alberi a venti
            passi, che al mattino sono a quindici. Alla base della prima colonna
            trovi una fessura fredda e un gradino di pietra liscia.
          effetti: { tormento: 0.5 }
          vai: stele-dei-naviganti

  # ------------------------------------------------------------ 0 · le sette ombre e il campo del 142
  - id: stele-dei-naviganti-le-sette-ombre
    immagine: ambientazione/superficie-fratturata
    titolo: Le sette ombre
    sommario: "Le ombre delle colonne sono fredde, e ognuna scende nella sua fessura."
    luogo: Le Stele dei Naviganti, fra le colonne
    area: stele-dei-naviganti
    ripetibile: true
    requisiti: [profondita.stele-dei-naviganti == 0]
    testo: |
      Fra le colonne le ombre stanno sull'erba nere come inchiostro versato. Metti
      una mano in una, e diventa scura fino al polso e fredda come in un secchio
      d'acqua di pozzo. Ogni colonna ha la sua fessura con un filo d'aria fresca, e
      sotto la più larga, quella della prima, si vede un gradino.
    opzioni:
      - testo: "Scendere lungo l'ombra della prima colonna"
        descrizione: "L'ombra entra nella fessura e scende. Dove scende lei, si scende."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Dentro l'ombra
          testo: |
            Scendi di traverso dentro l'ombra, che ti arriva al collo come acqua
            fredda, fino a un passaggio basso dove l'ombra corre sul soffitto
            verso est.
          pe: { acrobazia: 2 }
          effetti: { profondita.stele-dei-naviganti: 1 }
        fallimento:
          titolo: I gradini freddi
          testo: |
            Il freddo dell'ombra ti intorpidisce le gambe al terzo gradino, e
            risali a massaggiarti i polpacci al sole.
          effetti: { ferite: 0.5 }
      - testo: "Misurare le ombre e trovare quella che conta"
        descrizione: "Se una delle sette ombre è diversa dalle altre, si scende da lì."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: La terza ombra
          testo: |
            La terza ombra è più corta delle altre di un piede, come se qualcosa
            sotto la tenesse, e la sua fessura scende asciutta in un passaggio
            basso.
          pe: { accademiche: 2 }
          effetti: { profondita.stele-dei-naviganti: 1 }
        fallimento:
          titolo: Le ombre che si allungano
          testo: |
            Mentre misuri le ombre si allungano tutte insieme di un passo, e poi
            ancora, finché smetti con la sensazione che giocassero con te.
          effetti: { tormento: 1 }
      - testo: "Aspettare che la fessura si allarghi con il freddo della sera"
        descrizione: "La sera la terra si ritira e le fessure si aprono, ma si aspetta al freddo."
        costo: 2
        esito:
          titolo: La sera
          testo: |
            Al tramonto la fessura si apre di un palmo con un suono di pietra che
            si stira, e scendi con le ossa intirizzite dall'erba gelata.
          effetti: { profondita.stele-dei-naviganti: 1, ferite: 0.5 }

  - id: stele-dei-naviganti-il-campo-del-142
    immagine: ambientazione/superficie-fratturata
    titolo: Il campo del 142
    sommario: "A cento passi dalle colonne, il vecchio campo della Biblioteca e una cassetta sotto i sassi."
    luogo: Le Stele dei Naviganti, il vecchio campo
    area: stele-dei-naviganti
    ripetibile: true
    requisiti: [profondita.stele-dei-naviganti == 0]
    testo: |
      A cento passi dalle colonne l'erba è segnata dai buchi dei pali da tenda della campagna del 142, e
      in mezzo c'è un cerchio di sassi anneriti. Accanto qualcuno ha ammucchiato dei sassi a piramide, con
      cura, come per una tomba piccola, e sotto c'è una cassetta di latta con il sigillo della Biblioteca
      mangiato dalla ruggine. I sassi in cima sono puliti, quelli in basso coperti di licheni.
    opzioni:
      - testo: "Leggere quello che c'è nella cassetta"
        descrizione: "Dentro ci sarà quello che la Biblioteca non ha voluto riportare indietro."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Otto
          testo: |
            Dentro c'è un taccuino incerato con le misure delle ombre ora per ora. L'ultima pagina, in una grafia
            più giovane e storta, dice soltanto *luna nuova, otto ombre, la settima ne ha due*. Ricopi la riga,
            rimetti tutto sotto i sassi e scendi da una fessura lì accanto.
          pe: { accademiche: 2 }
          effetti: { profondita.stele-dei-naviganti: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Le pagine incollate
          testo: |
            Le pagine incollate dall'umidità si sbriciolano fra le dita, e il
            bordo arrugginito della cassetta ti taglia il pollice.
          effetti: { ferite: 0.5 }
      - testo: "Cercare dove andavano a dormire quando faceva freddo"
        descrizione: "In una pianura così, il riparo era sottoterra."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La buca dei rilevatori
          testo: |
            Dietro il cerchio dei sassi una buca coperta di assi marce, dove i
            rilevatori si riparavano dal vento, si apre in fondo su un passaggio
            di pietra liscia verso le colonne.
          pe: { percezione: 2 }
          effetti: { profondita.stele-dei-naviganti: 1 }
        fallimento:
          titolo: Le assi
          testo: |
            Le assi marce cedono sotto di te, e finisci in una buca d'acqua
            piovana fino alla vita.
          effetti: { ferite: 0.5 }
      - testo: "Aggiungere un sasso alla piramide e tornare alle colonne"
        descrizione: "Qualcuno è tornato qui anni dopo a lasciare un sasso."
        costo: 2
        esito:
          titolo: Un sasso
          testo: |
            Posi un sasso piatto in cima alla piramide e resti un momento a capo
            chino, poi scendi dalla fessura della prima colonna dentro l'ombra
            fredda.
          effetti: { profondita.stele-dei-naviganti: 1, tormento: 1 }

  # ------------------------------------------------------------ 1 · la galleria delle lanterne
  - id: stele-dei-naviganti-la-galleria-delle-lanterne
    immagine: ambientazione/rovine-dei-precursori
    titolo: La galleria delle lanterne
    sommario: "Sotto le colonne una galleria con sette lanterne nere che mandano in alto l'ombra."
    luogo: Le Stele dei Naviganti, la galleria sotto le colonne
    area: stele-dei-naviganti
    ripetibile: true
    requisiti: [profondita.stele-dei-naviganti == 1]
    testo: |
      La galleria corre sotto le sette colonne, e sotto ognuna pende una
      lanterna di metallo scuro con un vetro nero che manda in alto, invece
      della luce, un cono di buio fitto. Sotto la prima lanterna la tua
      ombra si allunga verso est e ti tira i piedi come la risacca.

      {tecnologia Media} Sono fari al contrario, e chi le ha fatte voleva
      che le ombre si vedessero di giorno.
    opzioni:
      - testo: "Camminare contro il tiro dell'ombra"
        descrizione: "Si cammina con i piedi piantati, come contro la corrente di un fiume."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Controcorrente
          testo: |
            La tua ombra ti tira indietro a ogni lanterna come un cane al
            guinzaglio, finché sotto la settima il tiro si allenta e la galleria
            piega e scende.
          pe: { resilienza: 2 }
          effetti: { profondita.stele-dei-naviganti: 1 }
        fallimento:
          titolo: Verso est
          testo: |
            L'ombra ti trascina contro la parete di est e ti tiene lì finché
            spegni la lampada, e torni indietro a tentoni.
          effetti: { ferite: 0.5 }
      - testo: "Spegnere la lampada e camminare al buio"
        descrizione: "Spenta la lampada, l'ombra non ha più niente da tirare."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Al buio
          testo: |
            Al buio, con la mano sulla parete, conti le lanterne dal freddo che ne
            scende, e alla settima la galleria piega e scende.
          pe: { furtivita: 2 }
          effetti: { profondita.stele-dei-naviganti: 1 }
        fallimento:
          titolo: Il buio fitto
          testo: |
            Al buio cadi in una canaletta e ti storci la caviglia, e quando
            riaccendi la lampada sei ancora sotto la prima lanterna.
          effetti: { tormento: 1 }
      - testo: "Strisciare lungo la parete, sotto i coni d'ombra"
        descrizione: "Rasoterra, a pancia in giù, i coni d'ombra non arrivano."
        costo: 2
        esito:
          titolo: Rasoterra
          testo: |
            Strisci sotto i coni d'ombra con la lampada coperta, e ti alzi sotto
            la settima con la schiena gelata e i gomiti spellati.
          effetti: { profondita.stele-dei-naviganti: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1–3 · le ombre staccate
  - id: stele-dei-naviganti-le-ombre-staccate
    immagine: ambientazione/marea-grigia
    titolo: Le ombre staccate
    sommario: "Due ombre senza nessuno che le getti si staccano dalla parete, con il bordo che taglia."
    luogo: Le Stele dei Naviganti, un passaggio stretto
    area: stele-dei-naviganti
    ripetibile: true
    requisiti: [profondita.stele-dei-naviganti >= 1, profondita.stele-dei-naviganti <= 3]
    testo: |
      In un passaggio stretto ci sono due ombre sulla parete, alte quanto un uomo, e davanti non c'è niente che le getti. Quando alzi la lampada si
      staccano dal muro con un rumore di carta strappata e girano verso di te il bordo, che luccica.

      {armi-da-mischia Media} Di profilo non ci sono quasi. Si colpiscono di piatto, e una lama le taglia come un lenzuolo steso.
    opzioni:
      - testo: "Tagliare le ombre staccate"
        descrizione: "Sottili come fogli e con il bordo che taglia, si colpiscono di piatto."
        combattimento: stele-dei-naviganti-ombre
        vittoria:
          titolo: Il lenzuolo strappato
          testo: |
            La seconda ombra si strappa in due come una vela che cede e rientra
            nella parete, e dove stava resta una scheggia di vetro nero che prendi
            avvolta in un fazzoletto.
          effetti: { profondita.stele-dei-naviganti: 1, reliquie.scheggia: 1 }
        sconfitta:
          titolo: I tagli sottili
          testo: |
            Ti accorgi dei tagli soltanto quando la camicia comincia ad
            appiccicarsi, e arretri finché le ombre rientrano nel muro.
      - testo: "Mettere la lampada dove le ombre non hanno parete"
        descrizione: "Un'ombra ha bisogno di una parete, e la luce giusta gliela toglie."
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: La luce di fronte
          testo: |
            Posi la lampada in mezzo al passaggio con la luce dritta sulla parete,
            e le ombre si accartocciano come fogli vicino al fuoco e scivolano
            nelle fessure del muro.
          pe: { percezione: 2 }
          effetti: { profondita.stele-dei-naviganti: 1 }
        fallimento:
          titolo: La terza ombra
          testo: |
            Sposti la lampada e le ombre diventano tre, perché la terza è la tua,
            e per un tratto la senti camminare un passo davanti a te.
          effetti: { tormento: 1 }
      - testo: "Tornare indietro e prendere il condotto dell'aria"
        descrizione: "Nel condotto dell'aria accanto al passaggio non ci sono pareti per le ombre."
        costo: 2
        esito:
          titolo: Il condotto freddo
          testo: |
            Percorri il condotto a carponi, con il vento freddo in faccia e la
            lampada fra i denti, ed esci oltre il passaggio con i pugni gelati.
          effetti: { profondita.stele-dei-naviganti: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · la sala dei naviganti e la lanterna nera
  - id: stele-dei-naviganti-la-sala-dei-naviganti
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sala dei naviganti
    sommario: "Una sala con il pavimento inciso di rotte, e una nave ferma a due giorni di strada."
    luogo: Le Stele dei Naviganti, la sala delle rotte
    area: stele-dei-naviganti
    ripetibile: true
    requisiti: [profondita.stele-dei-naviganti == 2]
    testo: |
      La sala è larga e bassa, e il pavimento è una lastra di pietra scura
      incisa di linee sottili che arrivano dai bordi e convergono al centro,
      su un cerchio con sette tacche. Sopra le linee sono incisi piccoli
      fusi, come barche viste dall'alto, e uno è fermo a metà di una linea
      che arriva da est, accanto a un incavo dove batte una luce debole. In
      fondo una scala scende ancora.

      {accademiche Media} Le carte dei porti di Qir-Azel si disegnano così,
      e il fuso fermo è una nave che non è mai arrivata.
    opzioni:
      - testo: "Leggere la carta delle rotte"
        descrizione: "Una carta si legge con pazienza, e questa forse dice dove andavano le navi."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: La nave ferma
          testo: |
            Il fuso fermo sta a due giorni di strada a est della città,
            nell'ultima conca prima del Gradone Rosso, dove le mappe dei
            Raschiatori segnano le Carcasse di Korith. Il faro lo aspetta ancora,
            e le ombre di sopra gli indicano la strada di casa.
          pe: { accademiche: 2 }
          effetti: { profondita.stele-dei-naviganti: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Le linee che si muovono
          testo: |
            Una linea si sposta sotto il tuo dito come una formica, e quando alzi
            la testa il fuso fermo è più vicino al centro di prima.
          effetti: { tormento: 1 }
      - testo: "Toccare la luce accanto alla nave ferma"
        descrizione: "Sulle macchine dei Precursori una luce che batte di solito aspetta una mano."
        prova: { attributo: sociale, abilita: [empatia, percezione], difficolta: Media }
        successo:
          titolo: La luce stanca
          testo: |
            Sotto il dito senti per un battito qualcosa come una domanda ripetuta
            da secoli, e quando lo togli la luce riprende a battere più piano.
          pe: { empatia: 2 }
          effetti: { profondita.stele-dei-naviganti: 1 }
        fallimento:
          titolo: La scossa
          testo: |
            La luce ti dà una scossa fino alla spalla e ti lascia sul polpastrello
            un segno bianco a forma di fuso.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare la sala lungo una rotta"
        descrizione: "Si cammina sopra una linea, un piede davanti all'altro."
        costo: 2
        esito:
          titolo: Sulla rotta
          testo: |
            Cammini sulla linea come sulla fune di un saltimbanco, e arrivi alla
            scala con le gambe rigide, come dopo giorni di strada.
          effetti: { profondita.stele-dei-naviganti: 1, tormento: 1 }

  - id: stele-dei-naviganti-la-lanterna-nera
    immagine: ambientazione/rovine-dei-precursori
    titolo: La lanterna nera
    sommario: "Sotto la terza colonna una lanterna grande come una botte, con un vetro nero che segue qualcosa."
    luogo: Le Stele dei Naviganti, la cella della lanterna
    area: stele-dei-naviganti
    ripetibile: true
    requisiti: [profondita.stele-dei-naviganti == 2]
    testo: |
      Nella cella sotto la terza colonna c'è una lanterna appoggiata a terra,
      grande come una botte, con un vetro nero rotondo che ruota piano nel
      suo anello, come un occhio che segue qualcosa di lontano. Da lì sale il
      cono di buio, e intorno la pietra è coperta di brina. Dietro la
      lanterna una botola scende.

      {magia Media} Il Mana qui è fermo e freddo come uno stagno gelato, e la
      lanterna lo consuma piano, da sempre, per tenere il buio in piedi.
    opzioni:
      - testo: "Capire che cosa segue il vetro"
        descrizione: "Se si capisce cosa segue il vetro, si capisce tutto il faro."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il vetro che segue
          testo: |
            Segni sulla brina la posizione del vetro e dopo un'ora la segni di
            nuovo, e torna sempre verso est come un ago di bussola. Sotto l'anello
            trovi un pezzo di macchina staccato, e lo prendi prima di aprire la
            botola.
          pe: { tecnologia: 2 }
          effetti: { profondita.stele-dei-naviganti: 1, parte.camera-1: 1 }
        fallimento:
          titolo: Lo sguardo del vetro
          testo: |
            Il vetro si gira verso di te e per un momento non vedi più niente, e ti ritrovi seduto
            nella brina fuori dalla cella.
          effetti: { tormento: 1 }
      - testo: "Spostare la lanterna per arrivare alla botola"
        descrizione: "La lanterna sta davanti alla botola. È pesante, e la brina scivola."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Di peso
          testo: |
            Spingi con la spalla mentre la brina ti brucia attraverso la giubba, e
            la lanterna slitta di un palmo, quanto basta per sollevare la botola.
          pe: { atletica: 2 }
          effetti: { profondita.stele-dei-naviganti: 1 }
        fallimento:
          titolo: La brina
          testo: |
            I piedi scivolano sulla brina e sbatti la guancia contro la lanterna,
            che ti lascia un segno bianco sullo zigomo.
          effetti: { ferite: 0.5 }
      - testo: "Raschiare la brina e passare di lato"
        descrizione: "Fra la lanterna e il muro c'è uno spazio stretto coperto di brina."
        costo: 2
        esito:
          titolo: Di fianco
          testo: |
            Raschi la brina finché hai le dita bianche e passi di fianco, e il cono di buio che ti sfiora la faccia ti lascia la
            vista più scura per un pezzo.
          effetti: { profondita.stele-dei-naviganti: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · il pozzo della settima e l'ombra che ti segue
  - id: stele-dei-naviganti-il-pozzo-della-settima
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il pozzo della settima
    sommario: "Sotto la settima colonna un pozzo sale, con due lanterne alla base e una spenta."
    luogo: Le Stele dei Naviganti, il pozzo della settima colonna
    area: stele-dei-naviganti
    ripetibile: true
    requisiti: [profondita.stele-dei-naviganti == 3]
    testo: |
      Sotto la settima colonna un pozzo alto sale verso un quadrato di cielo, con una scala di pioli. Accanto alla
      lanterna che manda il buio verso est ce n'è una spenta, con il vetro rivolto a nord-est, e intorno sono incisi nove
      segni in cerchio, il più consumato fatto di sette righe come i denti di un pettine.

      {accademiche Difficile} Nove segni come le nove pietre nere che i mandriani del nord evitano. Le sette righe sono le
      Stele, e gli altri otto sono altrove.
    opzioni:
      - testo: "Salire i pioli fino alla base della colonna"
        descrizione: "I pioli sono fatti per gambe lunghe, e stanotte in cima non c'è la luna."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: I pioli lunghi
          testo: |
            Sali allungandoti da un piolo all'altro, ed esci da una botola alla
            base della settima colonna sotto un cielo senza luna e pieno di
            stelle.
          pe: { atletica: 2 }
          effetti: { profondita.stele-dei-naviganti: 1 }
        fallimento:
          titolo: Il piolo lontano
          testo: |
            Manchi un piolo più lontano degli altri, e ti fermi tre pioli più giù con un
            ginocchio che si gonfia.
          effetti: { ferite: 0.5 }
      - testo: "Ricopiare i nove segni intorno alla lanterna spenta"
        descrizione: "Nove segni incisi perché restassero, e qualcuno saprà leggerli."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Nove segni
          testo: |
            Ricopi i nove segni nel loro cerchio, e mentre scrivi la lanterna
            spenta ha un guizzo di buio. Poi sali i pioli fino alla base della
            colonna, sotto un cielo senza luna.
          pe: { accademiche: 2 }
          effetti: { profondita.stele-dei-naviganti: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Il segno che manca
          testo: |
            Sul quaderno i segni sono otto e sulla pietra nove, e per quante volte
            li ricopi sul quaderno restano otto.
          effetti: { tormento: 1 }
      - testo: "Arrampicarsi sulla lanterna accesa e uscire di lì"
        descrizione: "Dalla lanterna accesa si arriva ai pioli alti, ma il cono di buio è freddo."
        costo: 2
        esito:
          titolo: Dentro il cono
          testo: |
            Ti alzi dentro il cono di buio, freddo come un fiume in disgelo, e
            afferri i pioli alti. Esci alla base della settima sotto un cielo
            senza luna, con le mani insensibili.
          effetti: { profondita.stele-dei-naviganti: 1, ferite: 0.5 }

  - id: stele-dei-naviganti-l-ombra-che-ti-segue
    immagine: ambientazione/marea-grigia
    titolo: L'ombra che ti segue
    sommario: "In un corridoio senza lanterne la tua ombra cade verso est, e poi cammina per conto suo."
    luogo: Le Stele dei Naviganti, il corridoio senza lanterne
    area: stele-dei-naviganti
    ripetibile: true
    requisiti: [profondita.stele-dei-naviganti == 3]
    testo: |
      Nel corridoio che porta alla settima colonna non ci sono lanterne, eppure la tua ombra cade verso est
      qualunque cosa tu faccia con la lampada, come le ombre delle colonne. Quando riprendi a camminare, fa un
      passo prima di te.

      {resilienza Media fallita} Ti accorgi di aver girato la testa verso est anche tu, e il collo ti fa male
      come se lo tenessi così da ore.
    opzioni:
      - testo: "Riprendersi l'ombra"
        descrizione: "È tua, e si riprende come un cane che scappa, con la voce giusta."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Di nuovo tua
          testo: |
            Chiudi gli occhi e pensi alla tua ombra sul muro di casa, la sera, dalla parte giusta.
            Quando li riapri è ai tuoi piedi, e il corridoio finisce sotto la settima.
          pe: { resilienza: 2 }
          effetti: { profondita.stele-dei-naviganti: 1 }
        fallimento:
          titolo: L'ombra avanti
          testo: |
            La chiami e l'ombra cammina più svelta, e la segui finché sbatti la
            fronte contro una parete.
          effetti: { tormento: 1 }
      - testo: "Spegnere la lampada e seguire l'ombra"
        descrizione: "L'ombra va da qualche parte, e al buio si può seguirla."
        prova: { attributo: mentale, abilita: [magia, percezione], difficolta: Difficile }
        successo:
          titolo: Dove va lei
          testo: |
            Al buio l'ombra si vede lo stesso, più nera del nero, e ti porta per
            un passaggio laterale ai piedi della settima colonna. Dove si ferma e
            ti torna ai piedi, nella polvere, c'è una scheggia di vetro nero.
          pe: { magia: 2 }
          effetti: { profondita.stele-dei-naviganti: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il buio senza ombra
          testo: |
            Al buio l'ombra sparisce, e ci metti molto a ritrovare a tentoni la
            lampada per terra.
          effetti: { tormento: 1.5 }
      - testo: "Camminare all'indietro con la lampada davanti"
        descrizione: "Si cammina verso est all'indietro, con l'ombra sotto gli occhi."
        costo: 2
        esito:
          titolo: All'indietro
          testo: |
            Cammini all'indietro con l'ombra davanti ai piedi come un tappeto,
            inciampando due volte, finché la schiena tocca i pioli della settima.
          effetti: { profondita.stele-dei-naviganti: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · la notte senza luna
  - id: stele-dei-naviganti-la-notte-senza-luna
    immagine: ambientazione/superficie-fratturata
    titolo: La notte senza luna
    sommario: "A mezzanotte, alla settima colonna, si accende la seconda lanterna e il fanalista esce dalla pietra."
    luogo: Le Stele dei Naviganti, la settima colonna, a mezzanotte
    area: stele-dei-naviganti
    requisiti: [profondita.stele-dei-naviganti >= 4, misura.stele == 0]
    testo: |
      La notte di luna nuova la pianura è nera, e le stelle sono così fitte
      che il cielo sembra più chiaro della terra. Le ombre delle colonne si
      vedono lo stesso, sette strisce più nere della notte, e verso
      mezzanotte senti sotto i piedi uno scatto di metallo nel pozzo.

      Dalla settima colonna si stacca una figura alta il doppio di un uomo e
      sottile come un palo, che stava dentro la pietra come un chiodo nel
      legno, con una lanterna spenta al posto della testa e le braccia
      lunghe fino alle ginocchia. Alza un braccio accanto alla colonna, e la
      settima getta un'ombra in più, lunga, che piega verso nord-est. Il
      fanalista la guarda, e comincia a girare la mano per riportarla
      indietro.

      {tecnologia Difficile} L'ombra in più dura finché la lanterna di sotto
      resta accesa, e il fanalista la sta spegnendo. Per sapere dove punta
      bisogna tendere un filo prima che finisca.

      {origine apprendista-raschiatore} Sulle piattaforme le macchine che
      lavorano da sole si lasciano stare, e per la prima volta la regola ti
      sembra sbagliata.

      *Il vecchio del 142 aveva ragione, e non gli ha creduto nessuno.* Il
      fanalista gira la testa vuota verso di te.
    opzioni:
      - testo: "Affrontare il fanalista"
        descrizione: "Se lo fermi, l'ombra resta dove punta."
        combattimento: stele-dei-naviganti-fanalista
        vittoria:
          titolo: La direzione
          testo: |
            Il fanalista crolla contro la colonna, e pianti un paletto alla base dell'ombra in più e uno alla punta. Sulla carta della Gilda il filo traccia una
            linea che attraversa il Rovolungo a nord della città e finisce su una scogliera grigia segnata soltanto come mare.

            Dal fanalista stacchi un braccio, un'asta grigia lunga quanto una lancia, e una camera di cristallo che pulsa ancora.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.stele: 1, oggetto.stele-dei-naviganti-asta: 1, parte.camera-3: 1, reliquie.frammento-inciso: 2, bottino.parti-di-drone: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: L'ombra spenta
          testo: |
            Il fanalista ti tiene lontano con un braccio e con l'altro riporta
            l'ombra fra le altre, poi ti butta nell'erba gelata. All'alba le ombre
            sono sette, e tu hai le costole incrinate e un mese da aspettare.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Tendere il filo sull'ombra prima che lui la spenga"
        descrizione: "Paletti alla base e alla punta, e il filo teso prima che il fanalista finisca."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il filo
          testo: |
            Corri lungo l'ombra nuova e tendi il filo un attimo prima che il fanalista la riporti fra le altre, e lui rientra nella colonna. Sulla carta della Gilda la linea attraversa il Rovolungo a nord della città
            e finisce su una scogliera grigia segnata soltanto come mare.

            Ai piedi della colonna resta un suo braccio, un'asta grigia lunga quanto una lancia, e nella botola una camera di cristallo.
          pe: { percezione: 5 }
          effetti: { misura.stele: 1, oggetto.stele-dei-naviganti-asta: 1, parte.camera-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La punta sbagliata
          testo: |
            Pianti il paletto alla punta sbagliata, e il fanalista ti spinge via con una mano fredda come il ferro d'inverno. All'alba sei
            nell'erba con un braccio che non si alza e un mese da aspettare.
          effetti: { ferite: 2, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ordinargli di indicare la rotta"
        descrizione: "Un fanalista indica le rotte, ed è il suo mestiere."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La rotta
          testo: |
            La formula ti esce in una lingua che non è la tua, e il fanalista tende il braccio verso nord-est fino all'alba sopra il filo che tendi. Sulla carta della Gilda la linea attraversa il
            Rovolungo a nord della città e finisce su una scogliera grigia segnata soltanto come mare.

            Poi ti porge il braccio teso, che si stacca con uno scatto. Nella botola trovi una camera di cristallo.
          pe: { magia: 5 }
          effetti: { misura.stele: 1, oggetto.stele-dei-naviganti-asta: 1, parte.camera-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La mano che gira
          testo: |
            La formula ti si rompe in bocca, e l'ombra in più rientra fra le altre
            mentre la testa vuota del fanalista si accende di buio verso di te. Ti
            risvegli all'alba nell'erba con un mese da aspettare.
          effetti: { tormento: 2, ferite: 0.5 }
          vai: superficie-fratturata
      - testo: "Piantare i paletti come insegna la squadra"
        descrizione: "Sulle piattaforme si misura in due, ma lo hai fatto cento volte anche da solo, di giorno."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [atletica, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il nodo del turno
          testo: |
            Hai il filo già annodato al primo paletto e corri contando come la squadra, e pianti il secondo alla punta un attimo prima che il fanalista riporti l'ombra fra le altre. Sulla carta della Gilda
            la linea attraversa il Rovolungo a nord della città e finisce su una scogliera grigia segnata soltanto come mare.

            Ai piedi della colonna resta un suo braccio, e nella botola una camera di cristallo.
          pe: { atletica: 5 }
          effetti: { misura.stele: 1, oggetto.stele-dei-naviganti-asta: 1, parte.camera-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il nodo sciolto
          testo: |
            Il nodo si scioglie mentre corri, e il fanalista ti spinge via con una mano fredda come il ferro d'inverno.
            All'alba sei nell'erba con un braccio che non si alza e un mese da aspettare.
          effetti: { ferite: 2, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Guardare e basta, da lontano"
        descrizione: "Il fanalista non ti ha chiesto niente. La luna tornerà fra un mese."
        costo: 0
        esito:
          titolo: Fra un mese
          testo: |
            Guardi da cento passi l'ombra in più tornare fra le altre sei e il
            fanalista rientrare nella colonna, e all'alba riprendi il sentiero
            contando i giorni alla prossima luna.
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo · la settima colonna
  - id: stele-dei-naviganti-la-settima-colonna
    immagine: ambientazione/superficie-fratturata
    titolo: La settima colonna
    sommario: "Il fanalista è tornato al suo posto con un braccio solo, e nella botola resta quello che il faro perde."
    luogo: Le Stele dei Naviganti, la settima colonna, di notte
    area: stele-dei-naviganti
    ripetibile: true
    requisiti: [profondita.stele-dei-naviganti >= 4, misura.stele >= 1]
    testo: |
      Il fanalista esce ancora a mezzanotte, con un braccio solo, e riporta
      indietro l'ombra in più più piano dell'altra volta. Nell'erba ci sono
      ancora i buchi dei tuoi paletti.

      {tecnologia Media} Nella botola la seconda lanterna ha il vetro
      incrinato e perde pezzi di macchina, perché il faro si consuma un poco
      ogni volta che accende l'ombra.
    opzioni:
      - testo: "Affrontare il fanalista un'altra volta"
        descrizione: "Ha un braccio solo, ed è sempre alto il doppio di te."
        combattimento: stele-dei-naviganti-fanalista
        vittoria:
          titolo: Quello che il faro perde
          testo: |
            Il fanalista rientra nella pietra, e nella botola raccogli i pezzi
            caduti dall'anello della lanterna e un guscio chiuso che non c'era
            l'altra volta.
          effetti: { parte.camera-2: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Un braccio basta
          testo: |
            Anche con un braccio solo il fanalista ti butta nell'erba gelata.
            All'alba riprendi il sentiero zoppicando.
          effetti: { tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Scendere nella botola mentre lui gira l'ombra"
        descrizione: "Finché il fanalista gira l'ombra, la botola è libera."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Al buio, in fretta
          testo: |
            Raccogli a tentoni nella botola quello che è caduto dall'anello della
            lanterna, e quando esci il fanalista ti guarda con la testa vuota.
          pe: { furtivita: 2 }
          effetti: { parte.involucro-2: 1, reliquie.scheggia: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La botola chiusa
          testo: |
            Il fanalista finisce prima e chiude la botola con un piede, ed esci
            dal pozzo a mani vuote.
          effetti: { ferite: 1 }
          vai: superficie-fratturata
      - testo: "Lasciarlo lavorare e tornare indietro"
        descrizione: "La direzione ce l'hai già. Lui ha ancora il suo faro."
        costo: 0
        esito:
          titolo: Sette ombre
          testo: |
            Guardi il fanalista girare l'ombra con una mano sola, e all'alba
            riprendi il sentiero con le ombre delle Stele che puntano a est alle
            tue spalle.
          vai: superficie-fratturata

nemici:
  - id: stele-dei-naviganti-ombra-staccata
    immagine: ambientazione/marea-grigia
    nome: Ombra staccata
    descrizione: "Un'ombra alta quanto un uomo che si stacca dalla parete senza nessuno che la getti. È piatta come un foglio, e il bordo taglia come il vetro."
    attacco: 4
    difesa: 4
    difesaMentale: 4
    pf: 6
    danno: 3
    riduzione: 1
    iniziativa: 3
    tratti: [eco]

  - id: stele-dei-naviganti-fanalista
