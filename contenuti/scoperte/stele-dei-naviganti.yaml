    nome: Il fanalista della settima colonna
    descrizione: "Una macchina alta il doppio di un uomo e sottile come un palo, con una lanterna spenta al posto della testa e le braccia lunghe fino alle ginocchia. Esce dalla settima colonna nelle notti di luna nuova, e rimette in fila le ombre."
    attacco: 5
    difesa: 4
    difesaMentale: 5
    pf: 12
    danno: 4
    riduzione: 3
    iniziativa: 3

scontri:
