# La Superficie dopo l'Arena (docs/piano-superficie.md): le quality condivise, l'aggancio in città, l'azione che
# scopre i luoghi neri e le nove carte di voci.
# - `gente-di-fuori` (Arena di Qir-Azel, pista.arena >= 5): dopo il torneo quattro persone dei villaggi aspettano il
#   protagonista nell'area dei combattenti. Non apre niente da sola: i villaggi compaiono sulla Superficie con
#   pista.arena >= 5, e la scena li presenta.
# - `battere-la-superficie` (Superficie, ripetibile, pista.arena >= 5): quattro direzioni, e per ogni direzione si
#   vede soltanto il primo luogo non ancora scoperto. Nord: anello, spina. Est: sornione, mara. Sud: costola, tamburi.
#   Ovest: aculeo, forno, stele. Due opzioni per luogo, una con traccia < 2 (le voci) e una con traccia == 2 (il
#   luogo trovato), più due scorciatoie per chi ci è già stato con il Circolo (la Spina) o con i Raschiatori (le
#   Stele). A tre tracce l'ingresso della spedizione compare sulla Superficie (contenuti/scoperte/<luogo>.yaml).
# - `carta-voci-<luogo>`: nove carte del mazzo della Superficie, una per luogo, finché il luogo non è scoperto.
# Nomi nuovi: Vesna (gladiatrice di Ghoran), Tobiolo Mirri (carrettiere di Laresh), Ansgar (carbonaio di Pannion),
# Ilenia (erbatrice di Tuarmir) e i personaggi delle carte, ognuno detto una volta sola.
quality:
  - { id: villaggi.notizie, nome: "Gente di fuori", categoria: stato, nascosta: true, descrizione: "1 quando hai ascoltato la gente dei villaggi che ti aspettava dopo il torneo." }

  # ------------------------------------------------------------ le tracce dei nove luoghi neri (0-3; a 3 il luogo è scoperto)
  - { id: traccia.costola, immagine: icone/footprint, nome: "Tracce: la Costola di Drago", categoria: stato, descrizione: "Quello che sai della costola di metallo nero sulle alture a sud di Ghoran. Con tre tracce sai arrivarci." }
  - { id: traccia.tamburi, immagine: icone/footprint, nome: "Tracce: i Tamburi di Fondo", categoria: stato, descrizione: "Quello che sai del punto della Palude Acquanera dove a mezzanotte qualcuno bussa. Con tre tracce sai arrivarci." }
  - { id: traccia.aculeo, immagine: icone/footprint, nome: "Tracce: la Volta dell'Aculeo", categoria: stato, descrizione: "Quello che sai del foro che fischia nella Conca dei Rovi, a ovest di Laresh. Con tre tracce sai arrivarci." }
  - { id: traccia.anello, immagine: icone/footprint, nome: "Tracce: l'Anello del Camminatore", categoria: stato, descrizione: "Quello che sai delle nove pietre nere ai margini del Rovolungo. Con tre tracce sai arrivarci." }
  - { id: traccia.forno, immagine: icone/footprint, nome: "Tracce: il Forno della Nonna", categoria: stato, descrizione: "Quello che sai della stanza tiepida sulla strada di Tuarmir. Con tre tracce sai arrivarci." }
  - { id: traccia.stele, immagine: icone/footprint, nome: "Tracce: le Stele dei Naviganti", categoria: stato, descrizione: "Quello che sai delle sette colonne oltre la Foresta Strisciante. Con tre tracce sai arrivarci." }
  - { id: traccia.sornione, immagine: icone/footprint, nome: "Tracce: la Lente del Sornione", categoria: stato, descrizione: "Quello che sai del disco di vetro che riflette un altro cielo, oltre l'orlo nord del Gradone Rosso. Con tre tracce sai arrivarci." }
  - { id: traccia.mara, immagine: icone/footprint, nome: "Tracce: la Soglia di Mara", categoria: stato, descrizione: "Quello che sai dell'arco senza muri sul crinale a est della Roccia di Wren. Con tre tracce sai arrivarci." }
  - { id: traccia.spina, immagine: icone/footprint, nome: "Tracce: la Spina dell'Eco", categoria: stato, descrizione: "Quello che sai del pilastro nero sulla pianura del nord, che restituisce le voci. Con tre tracce sai arrivarci." }

  # ------------------------------------------------------------ le misure (il cuore di ogni spedizione vinto una volta)
  - { id: misura.costola, immagine: icone/vibrating-ball, nome: "La nota della Costola", categoria: stato, descrizione: "Hai preso la nota che la Costola di Drago ripete da prima della Caduta." }
  - { id: misura.tamburi, immagine: icone/drum, nome: "Il conto dei Tamburi", categoria: stato, descrizione: "Sai quanti colpi restano al battente sotto la Palude Acquanera." }
  - { id: misura.aculeo, immagine: icone/hourglass, nome: "La data dell'Aculeo", categoria: stato, descrizione: "Sai in che notte fischia la Volta dell'Aculeo, e per quanto." }
  - { id: misura.anello, immagine: icone/circle, nome: "L'ordine dell'Anello", categoria: stato, descrizione: "Sai in che ordine stanno le nove pietre dell'Anello del Camminatore." }
  - { id: misura.forno, immagine: icone/fire-bowl, nome: "Il nome del Forno", categoria: stato, descrizione: "Conosci la parola con cui chi lavorava nel Forno della Nonna si faceva riconoscere." }
  - { id: misura.stele, immagine: icone/sundial, nome: "La direzione delle Stele", categoria: stato, descrizione: "Sai dove punta l'ombra in più della settima Stele." }
  - { id: misura.sornione, immagine: icone/night-sky, nome: "Il cielo del Sornione", categoria: stato, descrizione: "Sai dove stavano le due stelle che il Sornione riflette, e quindi l'ora." }
  - { id: misura.mara, immagine: icone/door, nome: "La porta di Mara", categoria: stato, descrizione: "Sai come si passa dalla Soglia di Mara." }
  - { id: misura.spina, immagine: icone/echo-ripples, nome: "La voce della Spina", categoria: stato, descrizione: "Conosci il richiamo che la Spina dell'Eco restituisce sempre uguale." }

  # ------------------------------------------------------------ i doni dei villaggi (il passo 15 di ogni quest)
  - { id: dono.ghoran, nome: "Il dono di Ghoran", categoria: stato, nascosta: true, descrizione: "1 quando hai finito la quest di Ghoran." }
  - { id: dono.laresh, nome: "Il dono di Laresh", categoria: stato, nascosta: true, descrizione: "1 quando hai finito la quest di Laresh." }
  - { id: dono.tuarmir, nome: "Il dono di Tuarmir", categoria: stato, nascosta: true, descrizione: "1 quando hai finito la quest di Tuarmir." }
  - { id: dono.pannion, nome: "Il dono di Pannion", categoria: stato, nascosta: true, descrizione: "1 quando hai finito la quest di Pannion." }

storylet:
  # ================================================================ l'aggancio, dopo il torneo
  - id: gente-di-fuori
    presso: arena-di-qir-azel
    immagine: ambientazione/arena-di-qir-azel
    titolo: Gente di fuori
    sommario: "Dopo il torneo ti aspettano su una panca quattro persone che non sono di Qir-Azel."
    luogo: Arena di Qir-Azel, l'area dei combattenti
    area: quartieri-alti
    requisiti: [pista.arena >= 5, villaggi.notizie == 0]
    testo: |
      Sulla panca sotto la grata, nell'area dei combattenti, ti aspettano
      quattro persone con gli stivali sporchi di quattro terre diverse, che
      guardano il soffitto dell'Arena come si guarda un cielo che può cadere.
      Una donna con una treccia legata da un filo di rame si alza e ti misura
      dalla testa ai piedi. Accanto a lei un carrettiere tormenta un cappello
      di paglia, un ragazzo ha le mani nere fino ai polsi, e una donna minuta
      tiene in grembo una maschera di stoffa che sa d'erbe.

      {conoscenze-della-strada Media} Il rame nella treccia è il segno di chi
      combatte per un clan di Ghoran, e le mani nere sono di un carbonaio di
      Pannion.

      {origine fuggiasco-di-ghoran} Il filo di rame lo riconosci prima della
      faccia, e le spalle ti salgono da sole verso le orecchie. A Ghoran lo
      porta chi ha diritto di riprenderti.
    opzioni:
      - testo: "Ascoltarli uno alla volta"
        descrizione: "Hanno fatto molta strada per arrivare fin qui."
        costo: 0
        esito:
          titolo: Quattro strade
          testo: |
            Vesna, la donna con la treccia, porta l'invito di Ragh Kor'Nul di Ghoran, che
            vuole pesarti. Tobiolo Mirri parla per la Dama Ryn Velar di Laresh, che cerca
            qualcuno estraneo ai Malgrani e ai Raschiatori. Ansgar dice che a Pannion il
            Vecchio è cresciuto e Darrin Huld vuole uno di fuori. Ilenia di Tuarmir
            riferisce che per Madre Cerya il vento ha cambiato strada.

            Le quattro strade partono dalla Superficie.
          imposta: { villaggi.notizie: 1 }

  # ================================================================ battere la Superficie
  - id: battere-la-superficie
    immagine: ambientazione/superficie-fratturata
    titolo: Battere la Superficie
    sommario: "Sulle mappe della Gilda i posti neri sono croci a matita."
    luogo: Superficie Fratturata, il sentiero dei carri
    area: superficie-fratturata
    ripetibile: true
    requisiti: [pista.arena >= 5]
    testo: |
      Dalle terrazze di basalto la Superficie si apre in quattro direzioni, e
      di ognuna conosci soltanto i sentieri dei carri. Sulla carta della
      Gilda il resto è ghiaia, con qualche croce a matita dove un Raschiatore
      ha visto qualcosa di nero.

      Oda Krell, grattandosi il moncone sopra la gamba di legno, dice che i
      posti neri si trovano chiedendo ai pastori, perché le bestie ci girano
      al largo.

      {natura Facile} Se un gregge gira intorno a un pascolo buono senza
      entrarci, sotto il pascolo c'è qualcosa.
    opzioni:
      # ------------------------------------------------ nord: l'Anello, poi la Spina
      - testo: "Battere il nord, verso il Rovolungo"
        descrizione: "I mandriani del nord parlano di un cerchio dove i cani girano."
        quando: [traccia.anello < 2]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il cane che gira
          testo: |
            La seconda sera un mandriano ti divide il fuoco e, dopo aver guardato
            il suo cane, ti dice di nove pietre nere a mezza giornata dal roveto,
            dove il cane di suo fratello è entrato e ha girato fino a morire.
          pe: { natura: 2 }
          effetti: { traccia.anello: 1 }
        fallimento:
          titolo: Colline uguali
          testo: |
            Le colline del nord si somigliano tutte, e torni con le vesciche ai
            piedi e un solo nome storpiato.
      - testo: "Cercare il cerchio dei cani"
        descrizione: "Bisogna trovare il punto dove l'erba non cresce."
        quando: [traccia.anello == 2]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Nove pietre
          testo: |
            Ai margini del Rovolungo, al tramonto, trovi nove pietre nere alte
            fino al ginocchio, in cerchio intorno a un disco di terra nuda. Resti
            fuori dalla prima pietra e segni il posto sulla carta della Gilda.
          pe: { percezione: 2 }
          effetti: { traccia.anello: 1 }
        fallimento:
          titolo: L'erba alta
          testo: |
            Giri il roveto finché c'è luce, e l'erba è alta dappertutto.
      - testo: "Cercare il pilastro che risponde"
        descrizione: "Fra Velthar e il Rovolungo c'è un pilastro nero che restituisce le voci."
        quando: [traccia.anello >= 3, traccia.spina < 2]
        prova: { attributo: sociale, abilita: [espressivita, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La canzone cambiata
          testo: |
            In una locanda di carrettieri un cantore ambulante, in cambio di un
            bicchiere, ti racconta della Spina, dove ha gridato un nome e gli è
            tornata un'altra parola. Ti spiega la strada contando i guadi sulle
            dita.
          pe: { espressivita: 2 }
          effetti: { traccia.spina: 1 }
        fallimento:
          titolo: Cantori stonati
          testo: |
            Ogni cantore mette la Spina in un posto diverso, e torni con la borsa
            alleggerita dal vino offerto.
      - testo: "Andare a vedere la Spina dell'Eco"
        descrizione: "Si vede da lontano, ma bisogna arrivarci prima del buio."
        quando: [traccia.anello >= 3, traccia.spina == 2]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il dito puntato
          testo: |
            Ci arrivi nel pomeriggio, un'asta nera sulla pianura gialla con alla
            base un segno di pala, lucido, su qualcosa di duro sepolto. Gridi il
            tuo nome, e al nono battito la pianura ti restituisce una parola che
            non hai detto.
          pe: { atletica: 2 }
          effetti: { traccia.spina: 1 }
        fallimento:
          titolo: Sempre più lontana
          testo: |
            Cammini verso di lei fino al tramonto, e al tramonto è grande come a
            mezzogiorno.
      - testo: "Tornare alla Spina dove sei stato con Voren"
        descrizione: "Con il Circolo ci hai già gridato una parola."
        quando: [circolo.parola >= 1, traccia.spina < 3]
        costo: 0
        esito:
          titolo: La strada di Voren
          testo: |
            Ricordi la strada fino al sasso a forma di sella dove Voren si era
            fermato a bere, e la segni sulla carta della Gilda. Stavolta vuoi
            sapere che cosa c'è sotto la Spina.
          imposta: { traccia.spina: 3 }

      # ------------------------------------------------ est: il Sornione, poi la Soglia di Mara
      - testo: "Battere l'est, oltre l'orlo del Gradone"
        descrizione: "I carrettieri di Pannion parlano di un vetro in un campo che sembra ridere."
        quando: [traccia.sornione < 2]
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il vetro che ride
          testo: |
            Un carbonaio diretto a Pannion ti racconta del Sornione, un disco di
            vetro in un campo che riflette un cielo diverso dal nostro, e ti
            lascia al bivio giusto oltre l'orlo nord del Gradone Rosso.
          pe: { percezione: 2 }
          effetti: { traccia.sornione: 1 }
        fallimento:
          titolo: Il bivio sbagliato
          testo: |
            Il bivio che scegli finisce in una cava di argilla abbandonata.
      - testo: "Cercare il cascinale del Sornione"
        descrizione: "I contadini non amano chi viene a vedere il loro vetro."
        quando: [traccia.sornione == 2]
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Il campo vuoto
          testo: |
            Quando si convince che non vuoi comprarle niente, la contadina ti
            porta al margine del campo. Il disco, largo come una stanza e mezzo
            interrato, riflette un cielo di notte in pieno giorno.
          pe: { empatia: 2 }
          effetti: { traccia.sornione: 1 }
        fallimento:
          titolo: Il cane
          testo: |
            La contadina sguinzaglia il cane prima che tu abbia finito di
            salutare, e te ne vai camminando all'indietro.
      - testo: "Battere i crinali a est della Roccia di Wren"
        descrizione: "Chi passa sotto l'arco del crinale al tramonto torna con una storia."
        quando: [traccia.sornione >= 3, traccia.mara < 2]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La vecchia Mara
          testo: |
            In un casolare sopra il Torvessa un vecchio pescatore ti racconta
            della Soglia, l'arco di pietra nera sul crinale a cui una vecchia di
            nome Mara ha dato il nome. Ti indica la strada con il coltello da
            pesce.
          pe: { atletica: 2 }
          effetti: { traccia.mara: 1 }
        fallimento:
          titolo: Crinali
          testo: |
            Ogni crinale ne nasconde un altro, e nel pomeriggio la nebbia del
            Torvessa ti chiude la vista.
      - testo: "Salire al crinale della Soglia"
        descrizione: "L'arco si vede solo da certi punti del crinale."
        quando: [traccia.sornione >= 3, traccia.mara == 2]
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: L'arco a piombo
          testo: |
            L'arco compare dietro una gobba del crinale, alto due volte un uomo e
            senza muri ai lati. Il sole sta calando, e da venti passi senti un
            odore di pioggia salata che il vento del crinale non giustifica.
          pe: { percezione: 2 }
          effetti: { traccia.mara: 1 }
        fallimento:
          titolo: La gobba sbagliata
          testo: |
            Sali sulla gobba sbagliata, e quando trovi quella giusta è già buio.

      # ------------------------------------------------ sud: la Costola, poi i Tamburi
      - testo: "Battere il sud, verso Ghoran"
        descrizione: "I pastori a sud di Ghoran parlano di un metallo che canta."
        quando: [traccia.costola < 2]
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il coltello che canta
          testo: |
            Sulle alture oltre il Gradone un pastore ti racconta della Costola, un
            arco di metallo nero che esce da una collina, e ti mostra il coltello
            che ci ha appoggiato, rimasto storto da quando si è messo a cantare.
          pe: { resistenza: 2 }
          effetti: { traccia.costola: 1 }
        fallimento:
          titolo: La sete
          testo: |
            Sulle alture l'acqua finisce prima del previsto e devi tornare
            indietro.
      - testo: "Cercare la collina della Costola"
        descrizione: "Il metallo vibra così basso che lo sentono solo le bestie e i denti."
        quando: [traccia.costola == 2]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La costola
          testo: |
            Le capre non vogliono salire su una collina sola, e tu sali lì. Dal
            fianco esce un arco di metallo nero lungo quanto tre carri, e a dieci
            passi ti accorgi di stringere i denti senza motivo.
          pe: { natura: 2 }
          effetti: { traccia.costola: 1 }
        fallimento:
          titolo: Colline gialle
          testo: |
            Le colline sono gialle e uguali, e torni con le labbra spaccate dal
            vento.
      - testo: "Chiedere ai cacciatori di anguille della palude"
        descrizione: "Tre paletti rossi segnano un punto della Palude Acquanera da cui a mezzanotte si sta lontani."
        quando: [traccia.costola >= 3, traccia.tamburi < 2]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Tre paletti
          testo: |
            Un cacciatore di anguille, dopo averti fatto pulire le nasse, ti dice
            dei paletti rossi sul guado nord, dove a mezzanotte si bussa sotto
            terra tre volte. Da quando li ha sentiti, a mezzanotte non esce più
            con la barca.
          pe: { conoscenze-della-strada: 2 }
          effetti: { traccia.tamburi: 1 }
        fallimento:
          titolo: Nasse da pulire
          testo: |
            Pulisci nasse tutto il pomeriggio, e ogni volta che nomini il guado i
            cacciatori cambiano discorso.
      - testo: "Aspettare la mezzanotte sul guado nord"
        descrizione: "I paletti si trovano di giorno, i colpi si sentono a mezzanotte."
        quando: [traccia.costola >= 3, traccia.tamburi == 2]
        prova: { attributo: mentale, abilita: [resilienza, natura], difficolta: Media }
        successo:
          titolo: Tre colpi
          testo: |
            I tre paletti rossi stanno a triangolo nel muschio. A mezzanotte,
            sotto i tuoi piedi, qualcuno bussa tre volte con colpi sordi e lenti,
            e il muschio intorno ai paletti si intiepidisce per qualche minuto.
          pe: { resilienza: 2 }
          effetti: { traccia.tamburi: 1 }
        fallimento:
          titolo: Il guado sbagliato
          testo: |
            A mezzanotte non bussa nessuno, e all'alba scopri che i paletti sono
            verdi e il guado nord è un altro.

      # ------------------------------------------------ ovest: l'Aculeo, il Forno, le Stele
      - testo: "Battere l'ovest, verso Laresh"
        descrizione: "A ovest di Laresh c'è una conca di rovi con un foro che fischia."
        quando: [traccia.aculeo < 2]
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il fischio dell'aculeo
          testo: |
            Un'anziana che sgrana fagioli ai margini dei campi di Laresh ti
            racconta del foro nella Conca dei Rovi, dove i sassi non si sentono
            cadere e da cui una notte all'anno esce quello che suo padre chiamava
            il fischio dell'aculeo.
          pe: { empatia: 2 }
          effetti: { traccia.aculeo: 1 }
        fallimento:
          titolo: Fagioli
          testo: |
            Nei campi di Laresh tutti ti chiedono se sei dei Raschiatori, e
            nessuno crede al tuo no.
      - testo: "Scendere nella Conca dei Rovi"
        descrizione: "Il foro sta in mezzo a rovi alti come un uomo."
        quando: [traccia.aculeo == 2]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il bordo di vetro
          testo: |
            Ti apri la strada fra i rovi con il coltello fino al foro, largo
            quanto un braccio teso e con i bordi lisci come vetro. Ci lasci cadere
            un sasso e non lo senti arrivare.
          pe: { atletica: 2 }
          effetti: { traccia.aculeo: 1 }
        fallimento:
          titolo: I rovi
          testo: |
            Esci dalla conca con le maniche a strisce e un graffio sulla guancia,
            senza aver visto il fondo.
      - testo: "Fermarsi coi carbonai sulla strada di Tuarmir"
        descrizione: "I carbonai di passaggio raccontano tutti la stessa storia su una stanza tiepida."
        quando: [traccia.aculeo >= 3, traccia.forno < 2]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Il bambino al tavolo
          testo: |
            Al fuoco dei carbonai il più giovane racconta di aver sognato, nel
            Forno della Nonna, un bambino a un tavolo che ogni notte aveva
            un'altra faccia. Ti dicono dov'è, a patto che tu non ci dorma.
          pe: { conoscenze-della-strada: 2 }
          effetti: { traccia.forno: 1 }
        fallimento:
          titolo: Il fuoco degli altri
          testo: |
            I carbonai tengono il fuoco per sé, e chi te lo divide parla soltanto
            del prezzo del carbone in città.
      - testo: "Cercare la stanza tiepida"
        descrizione: "Dove il sentiero di Tuarmir piega per evitare un dosso, ma i dossi sono tanti."
        quando: [traccia.aculeo >= 3, traccia.forno == 2]
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Le pareti calde
          testo: |
            Dietro il dosso c'è una camera di pietra senza tetto, mezzo interrata,
            con le pareti tiepide come un forno spento da poco. Sul pavimento
            restano le ceneri di cento fuochi, nessuno contro la parete di fondo.
          pe: { percezione: 2 }
          effetti: { traccia.forno: 1 }
        fallimento:
          titolo: Dossi
          testo: |
            Il sentiero di Tuarmir piega ogni mezzo miglio per evitare un dosso, e
            dietro ogni dosso c'è altro sentiero.
      - testo: "Cercare le sette colonne oltre la Foresta Strisciante"
        descrizione: "La Biblioteca ci mandò una campagna di rilevamento nel 142. Le ombre puntano tutte dalla stessa parte."
        quando: [traccia.forno >= 3, traccia.stele < 2]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il rapporto del 142
          testo: |
            Il rapporto della campagna del 142 dava la strada in due giorni e
            mezzo verso sud-ovest, girando largo intorno alla Foresta Strisciante.
            Un boscaiolo te lo conferma e ti prega di non tagliare per la foresta.
          pe: { accademiche: 2 }
          effetti: { traccia.stele: 1 }
        fallimento:
          titolo: Il margine del bosco
          testo: |
            Giri intorno alla Foresta Strisciante dalla parte sbagliata, e a sera
            il margine del bosco ti è più vicino di prima.
      - testo: "Arrivare alle Stele dei Naviganti"
        descrizione: "Sette colonne basse in pianura aperta, che si riconoscono dalle ombre."
        quando: [traccia.forno >= 3, traccia.stele == 2]
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Sette ombre
          testo: |
            Le sette colonne sono allineate così bene che la prima nasconde le
            altre sei. A mezzogiorno le loro ombre sono lunghe come a sera e
            cadono tutte verso est, mentre quella del tuo bastone segue il sole.
          pe: { resistenza: 2 }
          effetti: { traccia.stele: 1 }
        fallimento:
          titolo: La pianura
          testo: |
            Senza segni, la pianura oltre la Foresta ti fa camminare in tondo
            finché l'acqua è a metà.
      - testo: "Tornare alle Stele dove i Raschiatori hanno misurato le ombre"
        descrizione: "Con i Raschiatori le Stele le hai già viste."
        quando: [fazione.raschiatori >= 11, traccia.stele < 3]
        costo: 0
        esito:
          titolo: La strada delle ombre
          testo: |
            Le Stele ce l'hai segnate sulla carta da quando, con i Raschiatori,
            hai misurato le ombre che puntavano a Korith. Adesso vuoi vedere che
            cosa fanno le colonne di notte.
          imposta: { traccia.stele: 3 }

      # ------------------------------------------------ quando non c'è altro da cercare
      - testo: "Girare dove porta il sentiero"
        descrizione: "Senza meta, con gli occhi bassi."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Fra due sassi
          testo: |
            Dove l'ultima pioggia ha aperto la crosta del terreno trovi un guscio
            di metallo scuro grande come una pagnotta, chiuso da tutte le parti.
            Oda Krell saprà che cosa c'è dentro.
          pe: { percezione: 2 }
          effetti: { reperto.sigillato: 1 }
        fallimento:
          titolo: Polvere
          testo: |
            Cammini fino a sera e trovi soltanto polvere, e una suola che
            comincia a staccarsi.

  # ================================================================ le carte: voci sui luoghi neri
  - id: carta-voci-costola
    tipo: carta
    area: superficie-fratturata
    immagine: ambientazione/ghoran
    titolo: Il mercenario con la lama storta
    sommario: "Un mercenario di Ghoran affila al fuoco una lama piegata."
    luogo: Superficie Fratturata, un fuoco sul sentiero del sud
    requisiti: [pista.arena >= 5, traccia.costola < 3]
    testo: |
      Al fuoco sul sentiero del sud un mercenario di Ghoran con una cicatrice
      che gli prende mezzo labbro affila una lama corta piegata a un terzo, e
      dopo un poco te la porge.

      {armi-da-mischia Media} Il ferro non è stato scaldato, è piegato di
      fibra dall'interno, come un ferro che ha vibrato troppo a lungo.

      «Sulle alture dietro Ghoran c'è un osso di ferro nero che esce dalla
      terra, e ci ho appoggiato questa per scommessa» dice, e riprende ad
      affilare.
    opzioni:
      - testo: "Farsi dire dove sta l'osso"
        descrizione: "Un mercenario racconta volentieri una scommessa persa, se non lo prendi in giro."
        prova: { attributo: sociale, abilita: [empatia, intimidire], difficolta: Media }
        successo:
          titolo: La scommessa
          testo: |
            Gli dici che una scommessa persa con stile vale due vinte, e lui ride
            con la metà buona della bocca e ti disegna la strada nella cenere,
            collina per collina.
          effetti: { traccia.costola: 2 }
        fallimento:
          titolo: La risata sbagliata
          testo: |
            Ridi al momento sbagliato, e per tutta la sera lui tiene la punta
            della lama verso di te.
          effetti: { sospetto: 0.5 }
      - testo: "Comprargli la lama storta"
        descrizione: "La lama la vende, e con la lama viene la storia."
        requisiti: [monete >= 3]
        esito:
          titolo: La lama
          testo: |
            Gliela compri per poco e lui ti dà la strada per niente, fino alla
            collina dietro Ghoran dove le capre non salgono.
          effetti: { monete: -3, traccia.costola: 1 }

  - id: carta-voci-tamburi
    tipo: carta
    area: superficie-fratturata
    immagine: ambientazione/palude-acquanera
    titolo: La barca senza remi
    sommario: "In una barca arenata dorme un ragazzo con un paletto rosso in mano."
    luogo: Superficie Fratturata, il margine della Palude Acquanera
    requisiti: [pista.arena >= 5, traccia.tamburi < 3]
    testo: |
      Sul margine della Palude Acquanera, in una barca da anguille arenata e
      senza remi, dorme rannicchiato un ragazzo con in mano un paletto
      verniciato di rosso. Quando lo svegli alza il paletto come una spada e
      ti chiede che ore sono, con gli occhi gonfi di chi è sveglio da
      giorni.
    opzioni:
      - testo: "Calmarlo e farsi raccontare"
        descrizione: "Ha paura di qualcosa che bussa."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il paletto
          testo: |
            Mentre mangia ti racconta che per scommessa ha tolto uno dei tre
            paletti rossi dal guado nord, e da allora i colpi li sente anche sotto
            il letto. Ti spiega dov'è il guado e ti lascia il paletto, che non ha
            il coraggio di rimettere a posto.
          effetti: { traccia.tamburi: 2 }
        fallimento:
          titolo: Il ragazzo scappa
          testo: |
            Una domanda di troppo e lui scappa nel fango con il paletto,
            affondando fino al ginocchio.
          effetti: { tormento: 0.5 }
      - testo: "Riportargli la barca all'acqua"
        descrizione: "Da solo, il ragazzo non ce la fa."
        esito:
          titolo: La spinta
          testo: |
            Spingete finché la barca galleggia, e il ragazzo ti indica con il
            paletto il guado a nord della palude, dove adesso i paletti rossi sono
            due.
          effetti: { traccia.tamburi: 1, ferite: 0.5 }

  - id: carta-voci-aculeo
    tipo: carta
    area: superficie-fratturata
    immagine: ambientazione/laresh
    titolo: I ragazzi coi sassi
    sommario: "Tre ragazzi di Laresh tornano dai campi con le tasche piene di sassi."
    luogo: Superficie Fratturata, la strada dei carri verso Laresh
    requisiti: [pista.arena >= 5, traccia.aculeo < 3]
    testo: |
      Sulla strada dei carri verso Laresh ti superano tre ragazzi con le
      tasche gonfie di sassi tondi, dietro a un capo che porta in vita un
      gomitolo di spago.

      {percezione Facile} I sassi hanno tutti la stessa grandezza, e lo
      spago ha un nodo ogni braccio, come quello dei pozzari per misurare un
      pozzo.

      Quando li saluti il capo, serio come un notaio, ti chiede se sei dei
      Raschiatori.
    opzioni:
      - testo: "Chiedergli che cosa vanno a misurare"
        descrizione: "Un capobanda di dodici anni si convince con il rispetto."
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Media }
        successo:
          titolo: Il foro senza fondo
          testo: |
            Gli dai del voi, e il capo ti spiega con orgoglio che nella Conca dei
            Rovi c'è un foro dove calano lo spago e tirano i sassi, e lo spago non
            basta mai. Ti mostrano la conca dall'alto.
          effetti: { traccia.aculeo: 2 }
        fallimento:
          titolo: I grandi
          testo: |
            Gli parli come a un bambino, e il capo se ne va offeso per i campi con
            gli altri due, che da lontano ti tirano un sasso.
          effetti: { scandalo: 0.5 }
      - testo: "Dargli un pezzo di spago in più"
        descrizione: "Il gomitolo del capo è quasi finito."
        esito:
          titolo: Lo spago
          testo: |
            Il capo accetta lo spago con un cenno da adulto e in cambio ti dice il
            nome del posto, la Conca dei Rovi, a ovest dei campi.
          effetti: { traccia.aculeo: 1 }

  - id: carta-voci-anello
    tipo: carta
    area: superficie-fratturata
    immagine: ambientazione/rovolungo
    titolo: Il cane legato corto
    sommario: "Un mandriano del nord tiene corto un cane che guarda sempre a ovest."
    luogo: Superficie Fratturata, la strada del nord
    requisiti: [pista.arena >= 5, traccia.anello < 3]
    testo: |
      Un mandriano scende dalle colline del nord con le sue pecore magre e
      un cane grigio legato corto alla cintura. Il cane gira la testa verso
      ovest a ogni passo, e quando si accorge di tirare si ferma e si guarda
      le zampe come se non fossero sue. Il mandriano ti vede guardare e
      accorcia la corda di un altro giro.
    opzioni:
      - testo: "Chiedergli del cane"
        descrizione: "Un mandriano parla volentieri del suo cane."
        prova: { attributo: sociale, abilita: [empatia, addestrare-animali], difficolta: Media }
        successo:
          titolo: Il cerchio
          testo: |
            Da cucciolo, racconta, il cane è entrato nel cerchio delle nove pietre
            ai margini del Rovolungo, e lui l'ha tirato fuori per la corda. Ti
            dice dove sono, se prometti di non portarci mai una bestia.
          effetti: { traccia.anello: 2 }
        fallimento:
          titolo: Fatti suoi
          testo: |
            Il mandriano ti risponde che il cane è affar suo, e si porta via le
            pecore in fretta.
          effetti: { sospetto: 0.5 }
      - testo: "Accarezzare il cane"
        descrizione: "Il cane non sembra cattivo. Solo distratto."
        esito:
          titolo: Il muso a ovest
          testo: |
            Il cane si lascia accarezzare con il muso puntato a ovest, dove,
            grugnisce il mandriano, ci sono le pietre nere.
          effetti: { traccia.anello: 1 }

  - id: carta-voci-forno
    tipo: carta
    area: superficie-fratturata
    immagine: ambientazione/tuarmir
    titolo: La carbonaia che non dorme
    sommario: "Una carbonaia di Pannion che non dorme ti chiede se hai mai dormito al caldo."
    luogo: Superficie Fratturata, una carbonaia sulla strada di Tuarmir
    requisiti: [pista.arena >= 5, traccia.forno < 3]
    testo: |
      In una radura fuma una carbonaia coperta di zolle, e da un ceppo la
      sorveglia una donna con le occhiaie scure come il carbone. Quando le
      chiedi la strada per Tuarmir ti offre un sorso d'acqua dalla zucca e
      ti domanda se hai mai dormito al caldo su quella strada.

      {medicina Media} Sono almeno due notti che non dorme, e tiene gli
      occhi spalancati apposta.
    opzioni:
      - testo: "Dirle di no, e chiederle perché"
        descrizione: "Ha voglia di parlarne, ma ha paura di farsi ridere dietro."
        prova: { attributo: sociale, abilita: [empatia, medicina], difficolta: Media }
        successo:
          titolo: La stanza calda
          testo: |
            Ha dormito tre notti nel Forno della Nonna, dove il sentiero piega, e
            ogni notte un bambino a un tavolo la guardava con una faccia diversa,
            l'ultima la sua da piccola. Ti indica il dosso e ti raccomanda una
            coperta.
          effetti: { traccia.forno: 2 }
        fallimento:
          titolo: Lo sguardo
          testo: |
            Le chiedi perché con troppa curiosità, e lei si riprende la zucca e
            non ti guarda più.
          effetti: { tormento: 0.5 }
      - testo: "Farle la guardia mentre dorme un'ora"
        descrizione: "Un'ora di sonno a chi ne ha bisogno."
        costo: 2
        esito:
          titolo: Un'ora
          testo: |
            Dorme un'ora sul ceppo, e per ringraziarti ti dice dov'è la camera
            tiepida in cui lei non tornerà mai più.
          effetti: { traccia.forno: 1 }

  - id: carta-voci-stele
    tipo: carta
    area: superficie-fratturata
    immagine: ambientazione/foresta-strisciante
    titolo: Il rilevatore della Biblioteca
    sommario: "Un vecchio della Biblioteca misura l'ombra di un bastone piantato in mezzo al sentiero."
    luogo: Superficie Fratturata, il sentiero a sud-ovest
    requisiti: [pista.arena >= 5, traccia.stele < 3]
    testo: |
      In mezzo al sentiero a sud-ovest un vecchio inginocchiato accanto a un
      bastone piantato dritto segna con una pietra la punta dell'ombra.
      Porta sulla schiena una cassetta di legno con il sigillo della
      Biblioteca di Qir-Azel e ti fa cenno di non calpestare l'ombra.

      {accademiche Media} Il bastone con le tacche è il metodo vecchio della
      Biblioteca, di prima che l'Accademia comprasse le lenti.
    opzioni:
      - testo: "Aiutarlo con le misure"
        descrizione: "Due mani in più, e il vecchio non ha tempo per spiegare."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: La campagna del 142
          testo: |
            Mentre tieni il bastone ti racconta che da giovane era con la campagna
            del 142 alle Stele dei Naviganti, e che una notte aveva contato otto
            ombre senza che il capo campagna gli credesse. Ti segna la strada sul
            taccuino e ti strappa la pagina.
          effetti: { traccia.stele: 2 }
        fallimento:
          titolo: L'ombra calpestata
          testo: |
            Calpesti la punta dell'ombra mentre lui la segna, e il vecchio
            ricomincia da capo senza più rivolgerti la parola.
          effetti: { scandalo: 0.5 }
      - testo: "Chiedergli dove va"
        descrizione: "Alle Stele, probabilmente. Basta chiedere."
        esito:
          titolo: A sud-ovest
          testo: |
            Va alle Stele dei Naviganti, oltre la Foresta Strisciante, e ci va da
            quarant'anni senza arrivarci. Ti indica la direzione con il bastone.
          effetti: { traccia.stele: 1 }

  - id: carta-voci-sornione
    tipo: carta
    area: superficie-fratturata
    immagine: ambientazione/gradone-rosso
    titolo: Lo stagionale che non guarda in su
    sommario: "Uno stagionale di Velthar cammina con gli occhi sempre a terra, anche quando gli parli."
    luogo: Superficie Fratturata, oltre l'orlo nord del Gradone Rosso
    requisiti: [pista.arena >= 5, traccia.sornione < 3]
    testo: |
      Lungo l'orlo nord del Gradone Rosso uno stagionale con la falce in
      spalla cammina guardandosi i piedi, e quando passa uno stormo di
      storni si copre gli occhi con il braccio.

      {resilienza Media} Chi ha paura del cielo di solito teme quello che
      c'è sopra, e questo ha paura di quello che ci ha visto.

      Ti chiede, guardandoti gli stivali, se la strada per Velthar è quella.
    opzioni:
      - testo: "Fargli guardare il cielo con te"
        descrizione: "Una paura così, a volte, si racconta a chi fa compagnia."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Due stelle
          testo: |
            Seduto con te sull'orlo del Gradone, alza piano gli occhi e racconta
            del disco di vetro di un cascinale, dove a mezzogiorno ha visto un
            cielo di notte con due stelle sconosciute. Ti dice il nome del
            cascinale e quello del campo.
          effetti: { traccia.sornione: 2 }
        fallimento:
          titolo: Gli storni
          testo: |
            Uno stormo passa basso proprio mentre lui alza gli occhi, e lo
            stagionale scappa lungo l'orlo con la falce che sbatte.
          effetti: { tormento: 0.5 }
      - testo: "Lasciarlo andare, e chiedergli da dove viene"
        descrizione: "Da qualche parte è stato, prima di avere paura."
        esito:
          titolo: Il cascinale
          testo: |
            Viene da un cascinale oltre il Gradone, dove ha mietuto un campo che
            non rende, e ti dice il nome dell'uno e dell'altro.
          effetti: { traccia.sornione: 1 }

  - id: carta-voci-mara
    tipo: carta
    area: superficie-fratturata
    immagine: ambientazione/roccia-di-wren
    titolo: Il mercante bagnato
    sommario: "Un mercante di stoffe ha i capelli bagnati in una giornata di sole."
    luogo: Superficie Fratturata, la riva del Torvessa
    requisiti: [pista.arena >= 5, traccia.mara < 3]
    testo: |
      Sulla riva del Torvessa, in una giornata di sole, un mercante di stoffe
      seduto sul carro ha i capelli bagnati e si annusa le maniche,
      aggrottato.

      {percezione Media} L'acqua sui capelli è salata, e sulla fronte gli si
      secca in una crosta bianca fine come farina.

      Ti chiede, molto educatamente, se per caso senti odore di fumo di
      legna.
    opzioni:
      - testo: "Annusare e ascoltare"
        descrizione: "Il mercante è lucido e confuso, e vuole qualcuno che gli creda."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Tre battiti
          testo: |
            Senti anche tu un fumo debole sulle sue maniche. Al tramonto,
            racconta, è passato sotto un arco nero sul crinale della Roccia e per
            tre battiti di cuore ha sentito pioggia salata in faccia e un fuoco di
            legna. Ti indica il crinale con il manico della frusta.
          effetti: { traccia.mara: 2 }
        fallimento:
          titolo: Il pazzo
          testo: |
            Gli dici che non senti niente, e il mercante si scusa e riparte
            lasciando dietro il carro gocce d'acqua che non dovrebbero esserci.
          effetti: { tormento: 0.5 }
      - testo: "Dargli un panno per asciugarsi"
        descrizione: "Un gesto da niente, e dopo le persone parlano."
        esito:
          titolo: Il crinale
          testo: |
            Si asciuga e annusa il panno, poi ti dice che sul crinale a est della
            Roccia c'è un arco sotto cui al tramonto non si passa.
          effetti: { traccia.mara: 1 }

  - id: carta-voci-spina
    tipo: carta
    area: superficie-fratturata
    immagine: ambientazione/superficie-fratturata
    titolo: Il cantore che conta
    sommario: "Un cantore ambulante conta fino a nove sottovoce a ogni fine di strofa."
    luogo: Superficie Fratturata, una locanda di carrettieri sulla strada del nord
    requisiti: [pista.arena >= 5, traccia.spina < 3]
    testo: |
      Nella locanda dei carrettieri sulla strada del nord un cantore
      ambulante, a ogni fine di strofa, conta fino a nove muovendo le labbra
      prima di riprendere.

      {espressivita Media} Sotto le volte della Cattedrale i cantori fanno
      lo stesso, per lasciar finire l'eco.

      Quando passa con il cappello ti chiede se hai mai gridato il tuo nome
      a un sasso.
    opzioni:
      - testo: "Cantare una strofa con lui"
        descrizione: "Una strofa in due, rispettando i nove battiti di pausa."
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Nove battiti
          testo: |
            Nei nove battiti di pausa della vostra strofa la locanda tace. Dopo,
            il cantore ti racconta della Spina dell'Eco, il pilastro nero fra
            Velthar e il Rovolungo che gli ha restituito la voce con una parola
            cambiata, e ti spiega la strada.
          effetti: { traccia.spina: 2 }
        fallimento:
          titolo: Fuori tempo
          testo: |
            Attacchi al settimo battito, e il cantore ti guarda come se gli avessi
            rotto qualcosa.
          effetti: { scandalo: 0.5 }
      - testo: "Mettergli una moneta nel cappello"
        descrizione: "Una moneta a un cantore compra almeno una risposta."
        requisiti: [monete >= 1]
        esito:
          titolo: Il pilastro
          testo: |
            Il cantore guarda la moneta e ti dice che sulla pianura del nord c'è
            un sasso che canta meglio di lui.
          effetti: { monete: -1, traccia.spina: 1 }
