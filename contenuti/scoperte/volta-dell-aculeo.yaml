# La Volta dell'Aculeo, spedizione di un luogo nero (docs/piano-superficie.md, «Le nove spedizioni dei luoghi neri»).
# Nella Conca dei Rovi, a ovest di Laresh, il foro dai bordi vetrificati dove i ragazzi tirano i sassi è la cima
# sfondata della cupola di uno sfiato dei Precursori (codex sf-volta-dell-aculeo). Una notte all'anno lo sfiato
# fischia: è la prova annuale dello strumento. In fondo alla gola dello sfiato c'è la ruota dei giorni, spinta di un
# dente a notte dalla Lancetta; il dente lungo è la notte del fischio, e la colonna di vetro accanto alla valvola ne
# dà la durata. La misura del luogo è la data (misura.aculeo).
# - Ingresso: `volta-dell-aculeo-il-foro` (Superficie, traccia.aculeo >= 3), ripetibile.
# - Stanze in fasce di profondità (una stanza superata non ricompare nella stessa visita):
#   0 appesi nel buio o il letto di polvere; 1 la volta segnata; 1-2 lo stormo della volta (combattimento contro
#   gregari); 2 la gola dello sfiato o le radici dei rovi; 3 le lamelle o il quadrante delle nove lancette.
# - Cuore a 4: `volta-dell-aculeo-la-ruota-dei-giorni` (misura.aculeo == 0), boss o prove Difficili; la vittoria
#   dà la data, l'aculeo della Lancetta e reliquie. Poi `volta-dell-aculeo-la-lancetta-che-torna`
#   (misura.aculeo >= 1), ripetibile, rende parti e reperti.
# Il segno che lega il luogo agli altri: il cerchio di nove incavi con uno più profondo, sul quadrante delle nove
# lancette (tutte puntate sullo stesso incavo) e sulla valvola dello sfiato. Il condotto sotto la valvola scende
# nella roccia verso il resto dello strumento.
aree:
  - id: volta-dell-aculeo
    immagine: ambientazione/laresh
    nome: La Volta dell'Aculeo
    sommario: "Sotto la Conca dei Rovi c'è una cupola di metallo nero con uno sfiato che fischia una notte all'anno."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Sotto il foro della Conca dei Rovi si apre una cupola di metallo nero
      larga come la piazza di un paese. La luce del foro scende su un fondo
      di polvere grigia che ha inghiottito i sassi di generazioni di ragazzi
      di Laresh, e dalle crepe della volta pendono le radici nere dei rovi.
      Al centro si apre la bocca dello sfiato, da cui sale un'aria fredda.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: volta-dell-aculeo-il-foro
    immagine: ambientazione/laresh
    titolo: Il foro nella Conca dei Rovi
    sommario: "A ovest dei campi di Laresh, in mezzo ai rovi, si apre un foro dai bordi lisci come vetro."
    luogo: Superficie Fratturata, la Conca dei Rovi a ovest di Laresh
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.aculeo >= 3]
    testo: |
      La Conca dei Rovi è piena fino all'orlo di rovi alti come un uomo, e i
      cunicoli dei ragazzi portano tutti a un foro largo un braccio, con i
      bordi lisci come vetro. Nel bordo c'è un solco consumato dallo spago dei
      ragazzi, l'unico punto dove una corda non si taglia.

      *Secondo i Raschiatori qui sotto c'è una cupola, e io ci sto sopra.* Il
      sasso che lasci cadere non lo senti arrivare.

      {origine mercante-dei-ponti} Sulle mappe della Gilda la Conca è un
      pascolo magro che nessuno ha mai chiesto in concessione, e ai Ponti
      questo basta a farti sospettare.
    opzioni:
      - testo: "Calarsi con la corda nel solco del vetro"
        descrizione: "La corda nel solco, e giù a forza di braccia."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Nel solco
          testo: |
            Leghi la corda alla radice più grossa, la passi nel solco e ti cali
            fino a restare appeso nel buio di una cupola enorme.
          pe: { atletica: 2 }
          vai: volta-dell-aculeo
        fallimento:
          titolo: Il vetro
          testo: |
            A metà discesa la corda esce dal solco e il vetro la sfrangia. Risali
            di corsa, e sul bordo ti tagli il palmo.
          effetti: { ferite: 0.5 }
      - testo: "Allargare il foro dove il vetro è incrinato"
        descrizione: "Un vetro così ha sempre un punto debole, da battere con il manico del coltello."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il vetro che cede
          testo: |
            Batti una crepa sottile con il manico del coltello finché un pezzo di
            vetro cade nel buio, e il foro ti lascia passare con lo zaino in
            spalla.
          pe: { tecnologia: 2 }
          vai: volta-dell-aculeo
        fallimento:
          titolo: La scheggia
          testo: |
            Una scheggia di vetro ti salta sullo zigomo, e il foro resta com'era.
          effetti: { ferite: 0.5 }
      - testo: "Legare la corda alla sella e farsi calare"
        descrizione: "Il cavallo non entra nei cunicoli, e dall'orlo della conca basta una corda lunga."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il cavallo sull'orlo
          testo: |
            Lasci il cavallo sull'orlo della conca con la corda legata alla sella,
            e lui arretra piano e ti cala nel buio.
          vai: volta-dell-aculeo
      - testo: "Scavare fino alla crepa sul fianco della cupola"
        descrizione: "Con la pala, sul fondo della conca, si arriva al fianco della cupola."
        costo: 2
        esito:
          titolo: Il fianco nero
          testo: |
            Scavi fino al metallo nero e lo segui fino a una crepa larga quanto
            una spalla, da cui entri di fianco sotto la volta della cupola.
          vai: volta-dell-aculeo

  # ------------------------------------------------------------ 0 · appesi nel buio e il letto di polvere
  - id: volta-dell-aculeo-appeso-nel-buio
    immagine: ambientazione/laresh
    titolo: Appeso nel buio
    sommario: "La corda gira su se stessa sotto il foro, e il fondo della cupola è ancora lontano."
    luogo: La Volta dell'Aculeo, sotto il foro
    area: volta-dell-aculeo
    ripetibile: true
    requisiti: [profondita.volta-dell-aculeo == 0]
    testo: |
      Appeso sotto il foro, la corda gira su se stessa e tu con lei, e il
      fondo della cupola, lontano, sembra un letto di farina. Una radice nera
      e robusta passa a un braccio da te e scende fino a metà altezza.

      {acrobazia Media} Una gamba tesa e l'altra piegata intorno alla corda,
      e il giro si ferma, se la testa non si mette in mezzo.
    opzioni:
      - testo: "Fermare il giro e scendere piano"
        descrizione: "Una gamba intorno alla corda, l'altra tesa. Poi giù, una mano alla volta."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Il giro fermo
          testo: |
            Con una gamba intorno alla corda la cupola smette di girare, e scendi
            una mano alla volta fino alla polvere grigia, alta fino alle
            ginocchia.
          pe: { acrobazia: 2 }
          effetti: { profondita.volta-dell-aculeo: 1 }
        fallimento:
          titolo: La corda che brucia
          testo: |
            Il giro ti dà la nausea, e scivoli per un tratto con la corda che ti
            brucia le mani.
          effetti: { ferite: 0.5 }
      - testo: "Afferrare la radice e scendere lungo quella"
        descrizione: "La radice è più ferma della corda, se ci si fida di un rovo."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il rovo
          testo: |
            Afferri la radice al secondo giro e scendi lungo di lei con le mani
            fasciate nelle maniche, poi ti lasci cadere nella polvere morbida.
          pe: { atletica: 2 }
          effetti: { profondita.volta-dell-aculeo: 1 }
        fallimento:
          titolo: Le spine
          testo: |
            La radice ha le spine anche quaggiù, e torni sulla corda a togliertele
            dalle mani con i denti.
          effetti: { ferite: 0.5 }
      - testo: "Scendere a tratti, riposando sui nodi"
        descrizione: "Un nodo ogni tanto per fermarsi, e le braccia pagano lo stesso."
        costo: 2
        esito:
          titolo: I nodi
          testo: |
            Ti fermi sui nodi a riposare, girando piano nella luce, e tocchi la
            polvere con le spalle in fiamme e i palmi pieni di vesciche.
          effetti: { profondita.volta-dell-aculeo: 1, ferite: 0.5 }

  - id: volta-dell-aculeo-il-letto-di-polvere
    immagine: ambientazione/marea-grigia
    titolo: Il letto di polvere
    sommario: "Il fondo della cupola è coperto di polvere grigia, soffice come farina, piena dei sassi dei ragazzi."
    luogo: La Volta dell'Aculeo, il fondo della cupola
    area: volta-dell-aculeo
    ripetibile: true
    requisiti: [profondita.volta-dell-aculeo == 0]
    testo: |
      Il fondo della cupola è un letto di polvere grigia alto fino al
      ginocchio, che ingoia ogni passo senza un rumore. Sotto il foro
      affiorano a centinaia i sassi dei ragazzi, e fra i sassi una trottola
      di legno con lo spago ancora arrotolato. La bocca dello sfiato è al
      centro della cupola, e dove la polvere sembra più bassa è lungo le
      pareti.

      {natura Media} La polvere è quella che la gola soffia fuori la notte
      del fischio, ricaduta anno dopo anno.
    opzioni:
      - testo: "Attraversare la polvere fino alla bocca"
        descrizione: "Polvere fino al ginocchio, da fare come la neve fresca."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Come nella neve
          testo: |
            Cammini alzando le ginocchia come nella neve, e arrivi alla bocca
            dello sfiato con le cosce dure e la polvere negli stivali.
          pe: { atletica: 2 }
          effetti: { profondita.volta-dell-aculeo: 1 }
        fallimento:
          titolo: La buca
          testo: |
            A metà strada affondi fino alla vita in un vuoto sotto la polvere, e
            ne esci tossendo per tornare dove è bassa.
          effetti: { ferite: 0.5 }
      - testo: "Seguire la parete dove la polvere è bassa"
        descrizione: "Lungo le pareti la polvere è bassa e il giro più lungo."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Sul duro
          testo: |
            Lungo la parete la polvere arriva alla caviglia, e facendo il giro
            largo trovi una scheggia staccata dalla volta, che ti metti in tasca.
          pe: { percezione: 2 }
          effetti: { profondita.volta-dell-aculeo: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il giro lungo
          testo: |
            La polvere torna alta all'improvviso, e ti ritrovi sotto il foro con
            gli occhi che bruciano.
          effetti: { tormento: 0.5 }
      - testo: "Coprirsi la bocca e tirare dritto"
        descrizione: "Con un fazzoletto sulla bocca si arriva, tossendo."
        costo: 2
        esito:
          titolo: Il fazzoletto grigio
          testo: |
            Arrivi allo sfiato con il fazzoletto grigio come la polvere, e
            tossisci a lungo piegato sul bordo del pozzo.
          effetti: { profondita.volta-dell-aculeo: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · la volta segnata
  - id: volta-dell-aculeo-la-volta-segnata
    immagine: ambientazione/rovine-dei-precursori
    titolo: La volta segnata
    sommario: "Intorno alla cupola corre un anello di tacche fitte, e la luce del foro ne illumina una sola."
    luogo: La Volta dell'Aculeo, sotto la volta
    area: volta-dell-aculeo
    ripetibile: true
    requisiti: [profondita.volta-dell-aculeo == 1]
    testo: |
      Dal bordo dello sfiato vedi correre intorno alla volta, a mezza
      altezza, un anello di tacche fitte come i denti di un pettine, con
      segni più grandi a intervalli. La luce del foro ne illumina una sola,
      e sotto quella una scala di pioli scende lungo la parete fino alla
      bocca dello sfiato.

      {accademiche Media} Il sole si sposta lungo l'anello con le stagioni,
      e la cupola è una meridiana per sapere che giorno è anche sotto terra.
    opzioni:
      - testo: "Leggere i segni sotto l'anello"
        descrizione: "Contare i segni grandi dice come è fatto l'anno di chi li ha incisi."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: L'anno dei Precursori
          testo: |
            Ricopi i segni grandi e le tacche. Il loro anno è lungo quanto il
            nostro ma diviso in un altro modo, e accanto a uno dei segni c'è una
            tacca più profonda.
          pe: { accademiche: 2 }
          effetti: { profondita.volta-dell-aculeo: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il conto delle tacche
          testo: |
            A metà anello perdi il conto, e la luce intanto si è spostata di un
            dito.
          effetti: { tormento: 0.5 }
      - testo: "Seguire la macchia di luce fino alla scala"
        descrizione: "La luce indica una tacca, e sotto la tacca c'è una scala."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La scala sotto la luce
          testo: |
            Segui la luce fino all'anello e poi giù lungo la parete, dove una
            radice nera nasconde la scala di pioli.
          pe: { percezione: 2 }
          effetti: { profondita.volta-dell-aculeo: 1 }
        fallimento:
          titolo: La luce negli occhi
          testo: |
            Guardi la luce troppo a lungo, e aspetti seduto nella polvere che la
            macchia verde ti sparisca dagli occhi.
          effetti: { tormento: 0.5 }
      - testo: "Scendere nella gola senza scala"
        descrizione: "Con la corda si scende lo stesso, ma il bordo è liscio."
        costo: 2
        esito:
          titolo: Il bordo liscio
          testo: |
            Ti cali con la corda oltre il bordo liscio e sbatti il ginocchio due
            volte prima di trovare i pioli dentro la gola.
          effetti: { profondita.volta-dell-aculeo: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1–2 · lo stormo della volta
  - id: volta-dell-aculeo-lo-stormo
    immagine: ambientazione/marea-grigia
    titolo: Lo stormo della volta
    sommario: "Nella gola dello sfiato dormono appesi pipistrelli grigi grandi come gatti."
    luogo: La Volta dell'Aculeo, la bocca dello sfiato
    area: volta-dell-aculeo
    ripetibile: true
    requisiti: [profondita.volta-dell-aculeo >= 1, profondita.volta-dell-aculeo <= 2]
    testo: |
      Sotto il bordo della gola le pareti sono coperte di pipistrelli grandi
      come gatti, appesi a testa in giù uno stretto all'altro, e i pioli
      sono incrostati di guano. La luce della lampada ne tocca uno, che apre
      gli occhi bianchi, e poi li aprono anche gli altri.

      {armi-da-distanza Media} Volano bene soltanto in tanti, e uno che si
      stacca dal gruppo è un bersaglio lento.
    opzioni:
      - testo: "Affrontare lo stormo"
        descrizione: "Sono tanti e i denti piccoli, e si combatte con la schiena alla parete."
        combattimento: volta-dell-aculeo-stormo
        vittoria:
          titolo: Il guano
          testo: |
            Gli ultimi pipistrelli salgono verso il foro in una nuvola grigia, e
            scendendo trovi fra il guano un frammento di metallo inciso.
          effetti: { profondita.volta-dell-aculeo: 1, reliquie.frammento-inciso: 1 }
        sconfitta:
          titolo: La nuvola grigia
          testo: |
            Lo stormo ti si chiude intorno, e ti lasci cadere sulla polvere con la
            testa coperta finché non torna alle pareti.
      - testo: "Spegnere la lampada e scendere al buio"
        descrizione: "Li ha svegliati la luce, e al buio forse si riaddormentano."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Al buio
          testo: |
            Spegni la lampada e aspetti che i fruscii si calmino, poi scendi a
            tentoni fra i corpi caldi appesi senza che nessuno si muova.
          pe: { furtivita: 2 }
          effetti: { profondita.volta-dell-aculeo: 1 }
        fallimento:
          titolo: Il piolo incrostato
          testo: |
            Al buio il piede scivola sul guano, e lo stormo si stacca tutto
            insieme mentre ti arrampichi fuori.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che escano a caccia"
        descrizione: "Al tramonto i pipistrelli escono dal foro, e basta aspettare."
        costo: 2
        esito:
          titolo: Il tramonto
          testo: |
            Aspetti nella polvere che la luce del foro diventi rossa. Al tramonto
            lo stormo esce con un rumore di stoffa, e la gola è libera.
          effetti: { profondita.volta-dell-aculeo: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · la gola e le radici
  - id: volta-dell-aculeo-la-gola
    immagine: ambientazione/rovine-dei-precursori
    titolo: La gola dello sfiato
    sommario: "La gola scende dritta nella roccia, e ogni tanto tira giù anche te."
    luogo: La Volta dell'Aculeo, la gola dello sfiato
    area: volta-dell-aculeo
    ripetibile: true
    requisiti: [profondita.volta-dell-aculeo == 2]
    testo: |
      La gola è un pozzo di metallo nero che scende dritto nella roccia, con
      i pioli lungo una parete sola. Ogni tanto tira, con un risucchio lungo
      che ti appiccica i vestiti alla schiena e ti spinge verso il basso, e
      da più giù sale un ronzio leggero di metallo.

      {resistenza Media} Il risucchio vale un secondo corpo appeso alla
      cintura, e le braccia non l'avevano messo in conto.
    opzioni:
      - testo: "Scendere tenendosi forte durante i risucchi"
        descrizione: "Durante il risucchio ci si tiene forte, poi si scende."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: Tenere
          testo: |
            Quando la gola tira ti fermi abbracciato a un piolo, e scendi nelle
            pause fino al ronzio, con le braccia che tremano.
          pe: { resistenza: 2 }
          effetti: { profondita.volta-dell-aculeo: 1 }
        fallimento:
          titolo: Il piolo perso
          testo: |
            Il risucchio ti strappa una mano dal piolo, e risali con la spalla che
            urla.
          effetti: { ferite: 0.5 }
      - testo: "Contare i risucchi e scendere nelle pause"
        descrizione: "Irregolari, sembrano. Le cose dei Precursori di irregolare hanno poco."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Il ritmo
          testo: |
            Aggrappato in cima conti i risucchi finché salta fuori il ritmo di due
            lunghi e uno corto, e scendi nelle pause lunghe senza che la gola ti
            tocchi.
          pe: { percezione: 2 }
          effetti: { profondita.volta-dell-aculeo: 1 }
        fallimento:
          titolo: Il ritmo sbagliato
          testo: |
            Il ritmo che hai trovato cambia al quarto risucchio, e torni su per i
            pioli con le dita intorpidite.
          effetti: { tormento: 0.5 }
      - testo: "Legarsi ai pioli con la corda"
        descrizione: "Un giro di corda a ogni tratto, e il risucchio tira la corda al posto tuo."
        costo: 2
        esito:
          titolo: Legato
          testo: |
            Ti leghi ai pioli con un giro di corda a ogni tratto, e arrivi in
            fondo dopo ore con i polsi segnati di rosso.
          effetti: { profondita.volta-dell-aculeo: 1, ferite: 0.5 }

  - id: volta-dell-aculeo-le-radici
    immagine: ambientazione/marea-grigia
    titolo: Le radici dei rovi
    sommario: "Le radici dei rovi sono entrate nella gola da una crepa e la chiudono come una rete."
    luogo: La Volta dell'Aculeo, la crepa nella gola
    area: volta-dell-aculeo
    ripetibile: true
    requisiti: [profondita.volta-dell-aculeo == 2]
    testo: |
      Da una crepa nella parete sono entrate le radici dei rovi, che
      attraversano il pozzo intrecciate come una rete, con spine nere lunghe
      un dito. Dove una spina è spezzata cola una linfa grigia e densa.

      {origine figlio-del-circolo} Il Circolo ti ha insegnato a riconoscere
      dalla linfa le piante che hanno bevuto la Marea, e queste l'hanno
      bevuta a lungo.

      {natura Media} Le radici morte sono più chiare, e le loro spine si
      spezzano senza sanguinare.
    opzioni:
      - testo: "Aprirsi un varco a colpi di lama"
        descrizione: "Colpi netti e dritti, senza lasciare che la linfa schizzi."
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Media }
        successo:
          titolo: Colpi netti
          testo: |
            Tagli le radici con colpi corti dove sono più sottili, e la linfa cola
            lungo la lama senza toccarti. Scendi oltre la rete.
          pe: { armi-da-mischia: 2 }
          effetti: { profondita.volta-dell-aculeo: 1 }
        fallimento:
          titolo: La linfa
          testo: |
            Una radice si spezza storta e ti schizza la linfa grigia sul polso,
            che pizzica finché non lo strofini con la polvere.
          effetti: { contaminazione: 0.5 }
      - testo: "Tagliare soltanto le radici morte"
        descrizione: "Quelle chiare sono morte, e non sanguinano. Il varco viene stretto, ma pulito."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Le radici chiare
          testo: |
            Le radici chiare si spezzano secche come rami d'estate, e nel varco
            stretto passi di fianco senza che una spina ti tocchi.
          pe: { natura: 2 }
          effetti: { profondita.volta-dell-aculeo: 1 }
        fallimento:
          titolo: La radice viva
          testo: |
            Una radice che sembrava chiara è viva sotto la scorza, e la linfa ti
            cola sulle dita.
          effetti: { contaminazione: 0.5 }
      - testo: "Strisciare fra le radici"
        descrizione: "Fra una radice e l'altra passa un corpo magro, ma le spine sono lunghe."
        costo: 2
        esito:
          titolo: Fra le spine
          testo: |
            Ti infili fra le radici con la giubba tirata sulla testa, e ne esci
            con la schiena punteggiata di tagli.
          effetti: { profondita.volta-dell-aculeo: 1, contaminazione: 0.5 }

  # ------------------------------------------------------------ 3 · le lamelle e il quadrante
  - id: volta-dell-aculeo-le-lamelle
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le lamelle
    sommario: "In fondo alla gola lamelle di metallo attraversano il pozzo come i denti di un pettine."
    luogo: La Volta dell'Aculeo, le lamelle
    area: volta-dell-aculeo
    ripetibile: true
    requisiti: [profondita.volta-dell-aculeo == 3]
    testo: |
      In fondo alla gola il pozzo è attraversato da file di lamelle di
      metallo sottili come coltelli, che ronzano piano nell'aria che scende.
      Fra l'una e l'altra passa un corpo di traverso, e più giù c'è una luce
      bianca e ferma. Su una lamella c'è una vecchia macchia scura a forma
      di mano.

      {espressivita Media} Sono le canne del fischio, e toccarne una vuol
      dire farla cantare a un palmo dalle orecchie.
    opzioni:
      - testo: "Passare fra le lamelle senza toccarle"
        descrizione: "Di traverso e piano, con le braccia strette al corpo."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Di traverso
          testo: |
            Scendi di traverso da una fila all'altra con le braccia strette al
            petto, e le lamelle ronzano intorno a te senza cambiare nota fino
            all'ultima.
          pe: { acrobazia: 2 }
          effetti: { profondita.volta-dell-aculeo: 1 }
        fallimento:
          titolo: Il gomito
          testo: |
            Il gomito tocca una lamella, che ti canta un fischio acuto da un
            orecchio all'altro mentre risali alla cieca.
          effetti: { tormento: 0.5 }
      - testo: "Bloccare le lamelle con dei cunei"
        descrizione: "Una lamella ferma non canta, e bastano dei cunei di legno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: I cunei
          testo: |
            Infili cunei di radice secca alla base delle lamelle, che una dopo
            l'altra smettono di ronzare, e scendi in silenzio.
          pe: { tecnologia: 2 }
          effetti: { profondita.volta-dell-aculeo: 1 }
        fallimento:
          titolo: Il cuneo che salta
          testo: |
            Il primo cuneo salta via e la lamella ti vibra contro la mano,
            lasciandoti una riga rossa sul palmo.
          effetti: { ferite: 0.5 }
      - testo: "Passare in fretta e lasciarle cantare"
        descrizione: "Le lamelle canteranno, e tu sarai già sotto."
        costo: 2
        esito:
          titolo: Il canto
          testo: |
            Scendi in fretta sbattendo contro le lamelle, e arrivi in fondo con un
            coro di fischi nella testa che si spegne piano.
          effetti: { profondita.volta-dell-aculeo: 1, tormento: 1 }

  - id: volta-dell-aculeo-le-nove-lancette
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il quadrante delle nove lancette
    sommario: "Nella parete della gola c'è un quadrante con nove lancette, tutte puntate sullo stesso incavo."
    luogo: La Volta dell'Aculeo, il quadrante
    area: volta-dell-aculeo
    ripetibile: true
    requisiti: [profondita.volta-dell-aculeo == 3]
    testo: |
      Dove la gola si allarga, nella parete è incassato un quadrante di
      metallo chiaro grande come una ruota di carro, chiuso da un vetro. Le
      sue nove lancette sono tutte puntate, ferme, sul più profondo dei nove
      incavi del bordo, e sotto il quadrante una lastra si apre su un
      passaggio verso la luce bianca.

      {tecnologia Media} Ogni lancetta ha il suo perno ed è fatta per
      muoversi da sola, e adesso aspettano insieme come una fila davanti a
      una porta.
    opzioni:
      - testo: "Guardare dentro il vetro"
        descrizione: "Dietro il vetro, il meccanismo dice che cosa contano le lancette."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Nove perni
          testo: |
            Dietro il vetro ogni perno ha un filo che sparisce nella roccia in una
            direzione diversa, e uno solo scende verso la luce bianca. Sul fondo
            del telaio prendi un frammento di metallo inciso.
          pe: { tecnologia: 2 }
          effetti: { profondita.volta-dell-aculeo: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il vetro freddo
          testo: |
            Il vetro è così freddo che la lampada si appanna, e quando lo pulisci
            con la manica ci lasci l'impronta della mano.
          effetti: { tormento: 0.5 }
      - testo: "Leggere i segni accanto alle lancette"
        descrizione: "Accanto a ogni lancetta c'è un segno, forse un nome."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Nove nomi
          testo: |
            Ricopi i nove segni sul quaderno. Quello della lancetta più corta
            l'hai già visto sopra la bocca dello sfiato, gli altri otto mai.
          pe: { accademiche: 2 }
          effetti: { profondita.volta-dell-aculeo: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Segni storti
          testo: |
            Il riflesso delle lancette ti confonde, e la pagina che riempi è da
            strappare.
          effetti: { tormento: 0.5 }
      - testo: "Lasciare il quadrante e scendere"
        descrizione: "Le lancette aspettano. Puoi lasciarle aspettare."
        costo: 2
        esito:
          titolo: Verso la luce bianca
          testo: |
            Scendi per il passaggio, e alle tue spalle una lancetta scatta di un
            capello e torna subito ferma.
          effetti: { profondita.volta-dell-aculeo: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · la ruota dei giorni
  - id: volta-dell-aculeo-la-ruota-dei-giorni
    immagine: bestiario/salvaguardia-precursori
    titolo: La ruota dei giorni
    sommario: "In fondo allo sfiato la Lancetta spinge di un dente a notte una ruota grande come un'aia."
    luogo: La Volta dell'Aculeo, la camera della ruota
    area: volta-dell-aculeo
    requisiti: [profondita.volta-dell-aculeo >= 4, misura.aculeo == 0]
    testo: |
      La gola finisce in una camera bassa, illuminata da una luce bianca che
      viene dalle pareti. Quasi tutto il pavimento è occupato da una ruota
      di metallo distesa in piano, grande come l'aia di una cascina, con il
      bordo a denti fitti. Sopra il dente più lungo, sul soffitto, si apre
      la valvola che porta l'aria alle lamelle, segnata dal cerchio dei nove
      incavi, e accanto c'è una colonna di vetro alta quanto un uomo, piena
      per metà di un liquido grigio e segnata da tacche.

      Sul bordo della ruota cammina la Lancetta, sottile come la gamba di un
      compasso e armata di una punta di metallo lucido, e a ogni passo
      spinge un dente. Quando ti sente si ferma, e la punta si gira verso di
      te.

      {origine allievo-di-torvessa} All'Accademia si misura il tempo con il
      cristallo e con l'acqua, e qui li hanno usati tutti e due. Contare i
      denti dalla Lancetta al dente lungo vuol dire sapere quante notti
      mancano.

      {acrobazia Media} Il bordo è stretto, e chi ci sale obbliga la
      Lancetta a fermarsi o a passargli attraverso.
    opzioni:
      - testo: "Affrontare la Lancetta"
        descrizione: "È veloce e la punta passa le armature. Però ha un passo solo, e lo ripete."
        combattimento: volta-dell-aculeo-lancetta
        vittoria:
          titolo: La data
          testo: |
            La Lancetta si piega a metà con un rumore di molla rotta. Conti due
            volte i denti fino al dente lungo e leggi sulla colonna quanto dura il
            fischio, poi stacchi la punta lucida e prendi dalla base della colonna
            una camera di cristallo che pulsa ancora. Quando risali, la Lancetta
            si è già raddrizzata di un poco.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.aculeo: 1, oggetto.volta-dell-aculeo-aculeo-della-lancetta: 1, reliquie.frammento-inciso: 2, parte.camera-3: 1, bottino.parti-di-drone: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: La punta
          testo: |
            La punta ti passa la spalla e la Lancetta ti spinge giù dalla ruota.
            Risali la gola con un braccio solo, ed esci dal foro sotto le stelle.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Contare i denti mentre la Lancetta cammina"
        descrizione: "Contare i denti fino a quello lungo e leggere la colonna, fuori dalla sua strada."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Difficile }
        successo:
          titolo: Il conto delle notti
          testo: |
            Ti tieni sempre dalla parte opposta della ruota e conti i denti finché
            al terzo giro il conto torna. Leggi la colonna da lontano e da una
            nicchia raccogli una punta di ricambio lucida.
          pe: { accademiche: 5 }
          effetti: { misura.aculeo: 1, oggetto.volta-dell-aculeo-aculeo-della-lancetta: 1, reliquie.frammento-inciso: 2, parte.camera-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il conto rotto
          testo: |
            Al secondo giro perdi il conto e la Lancetta è davanti a te. La punta
            ti apre il braccio dal gomito al polso, e risali senza la data.
          effetti: { ferite: 2, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ordinare alla Lancetta di fermarsi"
        descrizione: "La formula del Comando parla alle macchine, e una macchina che conta può fermarsi."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Ferma
          testo: |
            Alla formula la Lancetta si ferma a metà di un passo. Conti con calma
            fino al dente lungo e leggi la colonna, e dalla nicchia sotto la
            valvola ti porti via una punta di ricambio.
          pe: { magia: 5 }
          effetti: { misura.aculeo: 1, oggetto.volta-dell-aculeo-aculeo-della-lancetta: 1, reliquie.frammento-inciso: 2, parte.camera-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La formula a metà
          testo: |
            La formula ti si spezza in bocca e la Lancetta accelera, e sui pioli
            ti accorgi che la punta ti ha tagliato i capelli a metà testa.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Correre sulla ruota davanti alla Lancetta"
        descrizione: "Si contano i denti correndo sul bordo, più veloce di lei, per un giro intero."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Un giro
          testo: |
            Corri sul bordo davanti alla Lancetta contando i denti sotto i piedi
            fino a quello lungo, poi salti giù a leggere la colonna e prendi la
            punta di ricambio dalla nicchia.
          pe: { atletica: 5 }
          effetti: { misura.aculeo: 1, oggetto.volta-dell-aculeo-aculeo-della-lancetta: 1, reliquie.frammento-inciso: 2, parte.camera-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il dente
          testo: |
            Il piede ti si incastra fra due denti e la punta ti entra nel
            polpaccio. Risali la gola con la gamba fasciata alla meglio.
          effetti: { ferite: 2, tormento: 0.5 }
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo la misura · la Lancetta che torna (ripetibile)
  - id: volta-dell-aculeo-la-lancetta-che-torna
    immagine: bestiario/salvaguardia-precursori
    titolo: La Lancetta che torna
    sommario: "La Lancetta cammina di nuovo sul bordo della ruota, e nella camera ci sono pezzi di ricambio."
    luogo: La Volta dell'Aculeo, la camera della ruota
    area: volta-dell-aculeo
    ripetibile: true
    requisiti: [profondita.volta-dell-aculeo >= 4, misura.aculeo >= 1]
    testo: |
      Nella camera la ruota è più avanti di qualche dente. La Lancetta,
      raddrizzata, cammina di nuovo sul bordo con una punta nuova, e quando
      ti sente si ferma e gira la punta verso di te.

      {tecnologia Media} Nelle nicchie sotto la valvola la macchina tiene i
      pezzi per ripararsi, e qualcuno è stato sostituito da poco.
    opzioni:
      - testo: "Affrontare la Lancetta"
        descrizione: "Ha una punta nuova, e lo stesso passo."
        combattimento: volta-dell-aculeo-lancetta
        vittoria:
          titolo: Le nicchie
          testo: |
            La Lancetta si piega a metà e resta ferma sul bordo. Svuoti le
            nicchie sotto la valvola di quello che c'è, e risali prima che si
            raddrizzi.
          effetti: { parte.camera-2: 1, reperto.sigillato: 1, reliquie.scheggia: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Il passo
          testo: |
            La punta nuova taglia come la vecchia. Risali la gola tenendoti il
            fianco, e la Lancetta non ti segue oltre l'ultima lamella.
          vai: superficie-fratturata
      - testo: "Svuotare le nicchie alle sue spalle"
        descrizione: "Dietro la Lancetta, per mezzo giro, le nicchie sono libere."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Difficile }
        successo:
          titolo: Mezzo giro
          testo: |
            Quando la Lancetta ti volta la schiena svuoti le nicchie in mezzo
            giro, e quando torna sei già sui pioli con un reperto nella bisaccia.
          pe: { furtivita: 3 }
          effetti: { reperto.sigillato: 1, reliquie.scheggia: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il giro corto
          testo: |
            La Lancetta torna indietro a metà giro, cosa che l'altra volta non
            faceva, e la punta ti prende la mano nella nicchia.
          effetti: { ferite: 1 }
          vai: superficie-fratturata
      - testo: "Guardare la ruota girare e risalire"
        descrizione: "La data la sai, e la ruota può girare senza di te."
        costo: 0
        esito:
          titolo: Un dente
          testo: |
            Guardi la Lancetta spingere un dente, poi risali. Dalla cupola ti
            arriva il ronzio delle lamelle che aspettano la loro notte.
          vai: superficie-fratturata

