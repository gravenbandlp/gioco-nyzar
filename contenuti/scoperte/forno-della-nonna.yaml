# Il Forno della Nonna, spedizione dei luoghi neri (docs/piano-superficie.md, «Le nove spedizioni dei luoghi neri»).
# Una camera di pietra mezzo interrata sulla strada di Tuarmir, dove il sentiero piega per evitare un dosso (codex
# sf-forno-della-nonna): le pareti restano tiepide d'estate e d'inverno, e i carbonai che ci dormono sognano un
# bambino seduto a un tavolo, ogni notte con una faccia diversa. Sotto c'è la stanza calda di un operatore dei
# Precursori, con uno scambiatore che non si è mai spento. Il bambino è la memoria di chi ci lavorava, corrotta come
# dicono le teorie della Marea (sf-teorie-della-marea): non ha più una faccia sua e prende in prestito quelle dei
# sogni. Sopra lo scambiatore ci sono i nove segni dell'Anello del Camminatore, e solo la mano aperta è consumata
# dalle dita; un tubo parte verso nord-est e porta, lontanissima, una nota bassa.
#
# Ingresso `forno-della-nonna-la-stanza-tiepida` (Superficie, ripetibile, traccia.forno >= 3): due vie con prova (chi
# fallisce resta di sopra), il cavallo a costo 0, la notte nel Forno a costo 2.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
#   0 la parete di fondo, i carbonai al fuoco (Mena, la carbonaia che tiene le regole del riparo);
#   1 la scala tiepida;
#   1–3 gli spazzacamini (combattimento contro due gregari);
#   2 il tubo verso nord-est, la dispensa sigillata;
#   3 la branda dell'operatore, il corridoio delle facce.
# Il cuore a 4 è il tavolo (`forno-della-nonna-il-tavolo`, misura.forno == 0): la memoria dell'operatore che prende
# corpo (boss), oppure sedersi al tavolo e lasciargli la propria faccia (Empatia), il nome sul pannello dello
# scambiatore (Tecnologia), il Comando allo scambiatore, tutte Difficili; per l'Accolito del Velo la veglia dei morti
# (Empatia o Accademiche, Difficile). La vittoria dà misura.forno, la Piastrina della mano aperta e parti dei
# Precursori; chi fallisce torna in Superficie senza misura.
# Dopo, `forno-della-nonna-il-tavolo-apparecchiato` (ripetibile, misura.forno >= 1) rende meno.
#
# Il nome (la misura del Forno, per chi scrive la Campana Sepolta): l'operatore si faceva riconoscere dalle macchine
# con la parola *Nan'Ireth*, tre sillabe. Le prime due somigliano a «nonna», ed è da lì che i carbonai, che la
# sentono nei sogni, hanno preso il nome del posto senza saperlo.
# Nomi nuovi: Mena (carbonaia di Pannion, nel glossario).
aree:
  - id: forno-della-nonna
    immagine: ambientazione/rovine-dei-precursori
    nome: Il Forno della Nonna
    sommario: "Un riparo di carbonai sulla strada di Tuarmir, scaldato da qualcosa che non si spegne mai."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Oltre la parete di fondo la pietra lascia il posto al metallo caldo, in
      corridoi bassi fatti per gente più alta e più magra di te. Sotto i piedi
      corre un ronzio lento come il polso di chi dorme.

      Più si scende più fa caldo, e più fa caldo più viene sonno.

colonna:
  - { contesto: area, id: forno-della-nonna, musica: the-light-that-failed, ambiente: campfire }

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: forno-della-nonna-la-stanza-tiepida
    immagine: ambientazione/tuarmir
    titolo: La stanza tiepida
    sommario: "Una camera di pietra senza tetto dietro un dosso, con le pareti tiepide."
    luogo: Superficie Fratturata, la strada di Tuarmir
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.forno >= 3]
    testo: |
      Dietro un dosso della strada di Tuarmir c'è una camera di pietra senza
      tetto, mezzo interrata. Le ceneri di cento fuochi stanno tutte lontane
      dalla parete di fondo, che sotto il palmo è tiepida come un forno
      spento la sera prima. Su una sporgenza qualcuno ha lasciato un pezzo di
      carbone buono, e in basso, dove la parete tocca terra, la cenere è più
      chiara.

      {origine accolito-del-velo} In Cattedrale i carrettieri delle erbe di
      Tuarmir raccontano di una stanza dove non bisogna dormire, e i novizi
      ridono finché non tocca a loro accompagnare il carro.
    opzioni:
      - testo: "Cercare il punto più caldo della parete"
        descrizione: "Il caldo viene da qualche parte, e lo si segue con le mani."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La pietra calda
          testo: |
            In basso a sinistra una pietra quasi da scottare si sfila dal muro, e
            dietro una scala di metallo scende nel caldo.
          pe: { percezione: 2 }
          vai: forno-della-nonna
        fallimento:
          titolo: Le pareti tutte uguali
          testo: |
            La parete ti sembra calda tutta uguale, e ti svegli al buio con le
            mani nere di fuliggine e il ricordo vago di un tavolo.
          effetti: { tormento: 0.5 }
      - testo: "Smontare la parete di fondo"
        descrizione: "Le pietre sono a secco, e si possono togliere una per una."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Pietra per pietra
          testo: |
            Dietro la terza fila di pietre comincia il metallo, con una fessura
            larga quanto le tue spalle e una scala che scende nel caldo.
          pe: { atletica: 2 }
          vai: forno-della-nonna
        fallimento:
          titolo: La pietra rovente
          testo: |
            La quarta pietra è così calda che ti cade sul piede, e per oggi
            rimetti a posto le altre con le mani fasciate.
          effetti: { ferite: 0.5 }
      - testo: "Guardare dove si sdraia il cavallo"
        descrizione: "Un cavallo stanco si sdraia dove la terra dà più caldo."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il cavallo al caldo
          testo: |
            Il cavallo fa due giri fra le ceneri e si sdraia contro la parete di
            fondo, in basso a sinistra. Sotto il suo fianco una pietra calda si
            sfila dal muro, e dietro scende una scala di metallo.
          vai: forno-della-nonna
      - testo: "Dormirci una notte, come i carbonai"
        descrizione: "I carbonai qui sognano un bambino che forse sa dove si scende."
        costo: 2
        esito:
          titolo: Il bambino indica
          testo: |
            Sogni un tavolo e un bambino con la faccia di un ragazzo sconosciuto,
            che indica il pavimento sotto la tua spalla. All'alba scavi lì, e
            sotto un palmo di cenere trovi una lastra calda e una scala che
            scende.
          effetti: { tormento: 1 }
          vai: forno-della-nonna

  # ------------------------------------------------------------ 0 · la parete di fondo e i carbonai
  - id: forno-della-nonna-la-parete-di-fondo
    immagine: ambientazione/rovine-dei-precursori
    titolo: Dietro la parete di fondo
    sommario: "Una porta bassa che si apre soltanto se la tocchi nel modo giusto."
    luogo: Il Forno della Nonna, il pianerottolo sotto la parete
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna == 0]
    testo: |
      La scala finisce su un pianerottolo di metallo caldo, davanti a una porta
      bassa senza maniglie né serrature. Al centro è incisa una mano aperta con le
      dita lunghe il doppio delle tue, lucida, consumata da molte altre mani. In
      un angolo c'è un mozzicone di candela di sego, lasciato da qualcuno che è
      arrivato fin qui e poi è tornato su.

      {tecnologia Media} La porta si aspetta una mano più grande della tua, o
      almeno una che sappia dove premere.
    opzioni:
      - testo: "Appoggiare la mano dove va appoggiata"
        descrizione: "La mano incisa è più grande della tua. Bisogna capire quali dita contano."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Le dita lunghe
          testo: |
            Allarghi le dita finché i polpastrelli non toccano le cinque punte più
            lucide, e la porta scivola dentro la parete su un corridoio che
            scende.
          pe: { tecnologia: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: La porta che scotta
          testo: |
            La porta si scalda fino a scottare e ti lascia sul palmo il segno
            rosso della mano incisa.
          effetti: { ferite: 0.5 }
      - testo: "Forzare la porta con una leva"
        descrizione: "Con una leva nella fessura si vede quanto vuole restare chiusa."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: La leva
          testo: |
            La porta cede un palmo alla volta con un lamento lungo, finché non ci
            passi di fianco.
          pe: { atletica: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: Il lamento
          testo: |
            La porta si richiude di scatto e ti strappa di mano la leva, con un
            rimbombo che scende per il corridoio finché qualcuno sembra
            rispondere.
          effetti: { tormento: 1 }
      - testo: "Accendere la candela e aspettare"
        descrizione: "Qualcuno ha lasciato una candela, forse aspettando che la porta si aprisse da sola."
        costo: 2
        esito:
          titolo: La candela
          testo: |
            Accendi il mozzicone e il caldo ti chiude le palpebre. Ti svegli con
            la candela consumata e la porta aperta, dopo aver sognato un tavolo.
          effetti: { profondita.forno-della-nonna: 1, tormento: 1 }

  - id: forno-della-nonna-i-carbonai-al-fuoco
    immagine: ambientazione/tuarmir
    titolo: I carbonai al fuoco
    sommario: "Al tramonto arrivano tre carbonai di Pannion a prendere il riparo per la notte."
    luogo: Il Forno della Nonna, la camera di sopra
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna == 0]
    testo: |
      Prima che tu scenda arrivano tre carbonai con le facce nere fino alle
      sopracciglia. La più vecchia è Mena, una donna magra con un fazzoletto
      rosso in testa, che vede la pietra tolta dalla parete e posa il sacco
      piano, come si posa un bambino che dorme.

      «Qui si dorme e basta» ti dice. «La nonna ci tiene caldo, e noi non le
      tocchiamo la casa.» Si siede sul sacco davanti al buco nel muro.

      {conoscenze-della-strada Media} Ci dorme da quarant'anni, e se scendi
      senza il suo permesso sulla strada di Tuarmir lo sapranno tutti prima
      di sera.
    opzioni:
      - testo: "Spiegarle perché devi scendere"
        descrizione: "Mena vuole bene a quel posto, e va rassicurata."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il permesso
          testo: |
            Le racconti del bambino che anche lei ha sognato, e alla fine ti mette
            in mano un pezzo di carbone buono. «Portale questo. E chiedile
            permesso anche tu.»
          pe: { empatia: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: La strada lo sa
          testo: |
            Mena rimette la pietra nel muro con le mani nude, e alla carbonaia
            successiva un ragazzo ti chiede se sei quello che ha disturbato la
            nonna.
          effetti: { tormento: 1 }
      - testo: "Dividere il fuoco e aspettare che dormano"
        descrizione: "Una notte al fuoco con i carbonai stanchi, e quando russano si scende."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, espressivita], difficolta: Media }
        successo:
          titolo: La storia del fuoco
          testo: |
            Dividi con loro il pane e una storia della città, e Mena ride con la
            bocca senza denti. Quando russano ti infili nel buco del muro, e dalla
            soglia vedi che Mena ha gli occhi aperti e ti guarda andare.
          pe: { conoscenze-della-strada: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: Chi dorme prima
          testo: |
            Ti addormenti prima tu, e all'alba i carbonai sono partiti e la pietra
            è rimessa nel muro.
          effetti: { tormento: 1 }
      - testo: "Fare il giro e rientrare dal retro del dosso"
        descrizione: "Fra i rovi dietro il dosso ci sarà un passaggio lontano dagli occhi di Mena."
        costo: 2
        esito:
          titolo: Il retro del dosso
          testo: |
            Dopo un'ora fra i rovi, con le braccia graffiate fino ai gomiti, trovi
            un tubo di metallo che esce dal terreno e scende nel caldo, largo
            abbastanza per strisciarci.
          effetti: { profondita.forno-della-nonna: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · la scala tiepida
  - id: forno-della-nonna-la-scala-tiepida
    immagine: ambientazione/rovine-dei-precursori
    titolo: La scala tiepida
    sommario: "Una scala lunga scende nel caldo, e a ogni gradino viene più sonno."
    luogo: Il Forno della Nonna, la scala lunga
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna == 1]
    testo: |
      Il corridoio diventa una scala lunga, con i gradini alti per gambe più
      lunghe delle tue, e a ogni gradino fa più caldo, di quel caldo buono che
      c'è sotto una coperta d'inverno. Nelle pareti si aprono nicchie basse
      piene di polvere morbida, e dopo una trentina di gradini stai già
      sbadigliando.

      {resistenza Media fallita} Il corpo ha deciso che questo è il posto più
      comodo da settimane, e cerca già una nicchia della sua misura.
    opzioni:
      - testo: "Scendere tenendosi svegli"
        descrizione: "Basta arrivare in fondo con gli occhi aperti, a forza di pizzicotti e canzoni."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Gli occhi aperti
          testo: |
            Scendi cantando una canzone da osteria, anche le strofe che non si
            cantano davanti ai preti, e in fondo il caldo si fa secco e il sonno
            ti lascia.
          pe: { resilienza: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: La nicchia
          testo: |
            Ti siedi in una nicchia per riposare le gambe e ti svegli più in alto,
            con un tavolo negli occhi e senza ricordare di essere risalito.
          effetti: { tormento: 1 }
      - testo: "Scendere in fretta, prima che il caldo vinca"
        descrizione: "Se si corre giù per la scala, il sonno non fa in tempo ad arrivare."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Di corsa
          testo: |
            Scendi saltando i gradini due alla volta, e arrivi in fondo con le
            gambe che tremano e gli occhi bene aperti.
          pe: { atletica: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: Il gradino alto
          testo: |
            Manchi un gradino più alto degli altri e rotoli fino al bordo di una
            nicchia, con un ginocchio che si gonfia a vista d'occhio.
          effetti: { ferite: 0.5 }
      - testo: "Bagnarsi la testa e scendere piano"
        descrizione: "Un fazzoletto bagnato in testa, e giù un gradino alla volta finché dura l'acqua."
        costo: 2
        esito:
          titolo: Il fazzoletto bagnato
          testo: |
            A metà scala il fazzoletto è già asciutto, e arrivi in fondo con la
            pelle del viso che tira come dopo una giornata al sole.
          effetti: { profondita.forno-della-nonna: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1–3 · gli spazzacamini
  - id: forno-della-nonna-gli-spazzacamini
    immagine: bestiario/salvaguardia-precursori
    titolo: Gli spazzacamini
    sommario: "Due macchine con spazzole e raschietti puliscono un condotto, e tu sei coperto di cenere."
    luogo: Il Forno della Nonna, un condotto largo
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna >= 1, profondita.forno-della-nonna <= 3]
    testo: |
      Il passaggio attraversa un condotto basso dalle pareti lucide, dove
      due macchine grandi come cani da pastore lavorano con una spazzola
      rotonda e un raschietto per lato. Dove passano non resta un granello.

      {percezione Media} Hai la cenere del Forno fino ai gomiti, e per una
      macchina che pulisce sei la cosa più sporca entrata qui da molto
      tempo.

      Le spazzole si fermano, e i raschietti si girano verso di te.
    opzioni:
      - testo: "Difendersi dagli spazzacamini"
        descrizione: "Due, con i raschietti affilati come lame, fatte per pulire a fondo."
        combattimento: forno-della-nonna-spazzacamini
        vittoria:
          titolo: Il condotto pulito
          testo: |
            Il secondo spazzacamino si rovescia sul dorso e agita le zampe come
            uno scarafaggio. Smonti dai due quello che si può portare via.
          effetti: { profondita.forno-della-nonna: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: Raschiato
          testo: |
            I raschietti ti tolgono la cenere e un po' di pelle sotto, e arretri
            fino alla bocca del condotto mentre le macchine tornano al lavoro.
      - testo: "Spogliarsi della cenere e passare pulito"
        descrizione: "Senza la cenere addosso, per le spazzole non c'è niente da pulire."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Pulito
          testo: |
            Sbatti la giubba e ti strofini capelli e mani finché sei quasi pulito,
            e gli spazzacamini ti passano accanto senza fermarsi.
          pe: { percezione: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: La cenere nei capelli
          testo: |
            Ti dimentichi la cenere nei capelli, e ne esci con una ciocca in meno
            e un taglio sulla fronte.
          effetti: { ferite: 0.5 }
      - testo: "Strisciare nel tubo di scarico accanto"
        descrizione: "Accanto al condotto corre un tubo di scarico stretto, dove gli spazzacamini non arrivano."
        costo: 2
        esito:
          titolo: Il tubo di scarico
          testo: |
            Ne esci più nero di un carbonaio di Pannion, e ti allontani in fretta
            prima che gli spazzacamini decidano cosa fare di te.
          effetti: { profondita.forno-della-nonna: 1, contaminazione: 0.5 }

  # ------------------------------------------------------------ 2 · il tubo verso nord-est e la dispensa
  - id: forno-della-nonna-il-tubo-verso-nord-est
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il tubo verso nord-est
    sommario: "Un tubo grosso come un uomo sparisce nella roccia verso nord-est, con dentro una nota che non finisce."
    luogo: Il Forno della Nonna, la galleria del tubo
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna == 2]
    testo: |
      In una galleria alta corre un tubo di metallo caldo, grosso come un
      uomo, che esce dalla parete del ronzio e sparisce nella roccia verso
      nord-est. Sopra è incisa la mano aperta della porta, con una fila di
      segni consumati, e in fondo alla galleria il pavimento scende.

      {resilienza Media} Appoggi l'orecchio al tubo, e lontanissima c'è una
      nota bassa che non finisce mai e ti entra nei denti.
    opzioni:
      - testo: "Ascoltare la nota fino in fondo"
        descrizione: "Ascoltando abbastanza, si capisce da quanto lontano arriva."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: La nota lontana
          testo: |
            La nota arriva da molto lontano verso nord-est, più lontano del
            Rovolungo, e scendi verso il ronzio canticchiandola senza volerlo.
          pe: { percezione: 2 }
          effetti: { profondita.forno-della-nonna: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: I denti
          testo: |
            La nota ti fa dolere tutti i denti insieme, come quando si morde il
            ghiaccio, e torni indietro a cercare un posto dove non arrivi.
          effetti: { tormento: 1 }
      - testo: "Seguire il tubo fino al punto da cui esce"
        descrizione: "Dietro la parete c'è quello che scalda il tubo."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Sopra il tubo
          testo: |
            Percorri il tubo a carponi, con le mani nelle maniche, e dove entra
            nel muro trovi un varco da cui la galleria scende.
          pe: { atletica: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: Il tubo caldo
          testo: |
            Il tubo è troppo caldo per le ginocchia, e scivoli giù con una
            scottatura lunga sull'avambraccio.
          effetti: { ferite: 0.5 }
      - testo: "Passare sotto il tubo lungo la galleria"
        descrizione: "Sotto il tubo la galleria continua bassa e piena di vapore."
        costo: 2
        esito:
          titolo: Il vapore
          testo: |
            Esci dal vapore fradicio, con la testa che pulsa al ritmo del ronzio e
            un sapore di ferro in bocca.
          effetti: { profondita.forno-della-nonna: 1, contaminazione: 0.5 }

  - id: forno-della-nonna-la-dispensa
    immagine: ambientazione/rovine-dei-precursori
    titolo: La dispensa sigillata
    sommario: "Una dispensa di contenitori chiusi senza una giuntura."
    luogo: Il Forno della Nonna, la dispensa
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna == 2]
    testo: |
      Nella stanza stretta e lunga ci sono scaffali di metallo fino al soffitto, con contenitori cilindrici grandi come un
      pugno, senza giuntura, allineati per grandezza. Su una mensola bassa c'è una tazza di metallo opaco messa a bocca in
      giù ad asciugare, e accanto la mano aperta incisa, piccola come un sigillo. Oltre la dispensa una porta scende.

      {accademiche Media} I diari dell'Era del Silenzio parlano di dispense come questa, piene di contenitori che i
      superstiti non sapevano aprire.
    opzioni:
      - testo: "Aprire un contenitore come lo apriva lui"
        descrizione: "Il segno della mano sulla mensola dice qualcosa su come si aprivano."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il contenitore
          testo: |
            Sulla mano incisa il coperchio si stacca con uno schiocco, su una
            pasta grigia che sa di noci. Ti porti via l'unico contenitore che non
            si apre, troppo pesante per essere cibo.
          pe: { tecnologia: 2 }
          effetti: { profondita.forno-della-nonna: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: Lo schiocco
          testo: |
            Forzi un contenitore col coltello, e uno sbuffo di polvere grigia ti
            manda fuori a tossire con gli occhi che lacrimano.
          effetti: { contaminazione: 1 }
      - testo: "Guardare la tazza"
        descrizione: "Una tazza messa ad asciugare dice qualcosa di chi la usava."
        prova: { attributo: sociale, abilita: [empatia, percezione], difficolta: Media }
        successo:
          titolo: La tazza
          testo: |
            Sul fondo qualcuno ha graffiato una linea storta per segnare la sua
            tazza, anche se quaggiù non c'era nessun altro. La rimetti a bocca in
            giù e prendi la porta.
          pe: { empatia: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: La tazza calda
          testo: |
            La tazza è calda come appena riempita e ti cade sotto uno scaffale, ma
            quando ti chini è di nuovo sulla mensola.
          effetti: { tormento: 1 }
      - testo: "Passare oltre senza toccare niente"
        descrizione: "È la dispensa di qualcuno, e si attraversa con le mani in tasca."
        costo: 2
        esito:
          titolo: Le mani in tasca
          testo: |
            Sulla porta senti alle spalle un tintinnio leggero, come di una tazza
            rimessa a posto, ma quando ti volti non c'è nessuno.
          effetti: { profondita.forno-della-nonna: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · la branda e il corridoio delle facce
  - id: forno-della-nonna-la-branda
    immagine: ambientazione/rovine-dei-precursori
    titolo: La branda dell'operatore
    sommario: "Una cella con una branda ancora rifatta, dove il sonno arriva subito."
    luogo: Il Forno della Nonna, la cella della branda
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna == 3]
    testo: |
      In una cella bassa c'è una branda lunga il doppio di un letto, con la
      coperta grigia rimboccata. Sulla parete ci sono nove segni incisi in
      fila, e quello della mano aperta è consumato da un dito. Oltre la
      branda una porticina dà su un passaggio che scende.

      {origine allievo-di-torvessa} All'Accademia un professore fa lezione
      sulla Marea come memoria andata a male, e adesso vorresti averlo
      ascoltato invece di dormire in ultima fila.

      {medicina Media} Il sonno che senti arriva da fuori, con il caldo,
      come quello che danno certe erbe di Tuarmir.
    opzioni:
      - testo: "Toccare il segno della mano come faceva lui"
        descrizione: "Chi dormiva qui toccava quel segno ogni sera prima di coricarsi."
        prova: { attributo: sociale, abilita: [empatia, accademiche], difficolta: Media }
        successo:
          titolo: La buonanotte
          testo: |
            Tocchi il segno piano, come la fronte di chi dorme, e il sonno ti
            lascia mentre la porticina si apre. Sotto il cuscino sporge una
            scheggia di metallo scuro, e la prendi.
          pe: { empatia: 2 }
          effetti: { profondita.forno-della-nonna: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Sulla branda
          testo: |
            Ti siedi sulla branda e ti svegli tremando di freddo molto più in
            alto, sulla scala, con un tavolo negli occhi.
          effetti: { tormento: 1 }
      - testo: "Attraversare la cella senza sedersi"
        descrizione: "La branda è lì, e il sonno con lei. Basta non fermarsi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: In piedi
          testo: |
            Tiri dritto fino alla porticina, e dall'altra parte hai le unghie
            piantate nei palmi da quanto stringevi i pugni.
          pe: { resilienza: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: Un momento solo
          testo: |
            Ti appoggi alla branda un momento, e ti svegli sul pavimento accanto
            all'ingresso con la coperta grigia rimboccata addosso.
          effetti: { tormento: 1.5 }
      - testo: "Togliere la coperta e passare sopra la branda"
        descrizione: "La coperta è la cosa più calda della stanza, e il sonno sta lì."
        costo: 2
        esito:
          titolo: La coperta
          testo: |
            La coperta si sbriciola in una nuvola grigia e il sonno se ne va con
            lei, e passi sopra la branda nuda tossendo.
          effetti: { profondita.forno-della-nonna: 1, contaminazione: 1 }

  - id: forno-della-nonna-il-corridoio-delle-facce
    immagine: ambientazione/marea-grigia
    titolo: Il corridoio delle facce
    sommario: "Un corridoio di lastre di vetro scuro, con una faccia addormentata in ognuna."
    luogo: Il Forno della Nonna, il corridoio delle lastre
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna == 3]
    testo: |
      Il corridoio è fatto di lastre di vetro scuro alte quanto un uomo, e in
      ognuna c'è una faccia con gli occhi chiusi e la fuliggine nelle rughe,
      che dorme male. Una ha il fazzoletto in testa come le carbonaie della
      strada di Tuarmir, e muove le labbra. In fondo una luce rossa batte
      piano.

      {natura Difficile} Il vetro non riflette niente. Le facce stanno dentro,
      come pesci sotto il ghiaccio, in una foschia grigia.
    opzioni:
      - testo: "Camminare guardando avanti"
        descrizione: "Se le guardi troppo a lungo, forse si svegliano a cercarti."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La luce rossa
          testo: |
            Cammini con gli occhi sulla luce rossa, e le facce ti scorrono ai lati
            come case viste da un carro. Arrivi in fondo con le mani fredde
            nonostante il caldo.
          pe: { resilienza: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: La tua faccia
          testo: |
            Nella lastra di lato c'è la tua faccia da bambino, con gli occhi
            chiusi, e arretri fino all'imbocco toccandoti la guancia.
          effetti: { tormento: 1.5 }
      - testo: "Svegliare la faccia della carbonaia"
        descrizione: "Muove le labbra, e forse da sveglia sa dove si va."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: La carbonaia
          testo: |
            La chiami come si chiama una vicina, e la faccia apre gli occhi e
            indica col mento la luce in fondo. Quando passi oltre dorme di nuovo,
            e ti piace pensare che stanotte dorma meglio.
          pe: { empatia: 2 }
          effetti: { profondita.forno-della-nonna: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Gli occhi grigi
          testo: |
            La faccia apre gli occhi, grigi da un bordo all'altro, e tutte le
            altre li aprono con lei, e torni indietro di corsa con la foschia alle
            spalle.
          effetti: { tormento: 1, contaminazione: 0.5 }
      - testo: "Coprire le lastre con il mantello mentre passi"
        descrizione: "Si copre una lastra alla volta con il mantello, e si avanza piano."
        costo: 2
        esito:
          titolo: Il mantello
          testo: |
            Ci vuole molto, e alla luce rossa il mantello ha una patina grigia che
            non va più via.
          effetti: { profondita.forno-della-nonna: 1, contaminazione: 0.5 }

  # ------------------------------------------------------------ il cuore · il tavolo
  - id: forno-della-nonna-il-tavolo
    immagine: ambientazione/marea-grigia
    titolo: Il tavolo
    sommario: "Uno scambiatore acceso da prima della Caduta, e davanti al tavolo un bambino con la faccia di qualcun altro."
    luogo: Il Forno della Nonna, la stanza calda
    area: forno-della-nonna
    requisiti: [profondita.forno-della-nonna >= 4, misura.forno == 0]
    testo: |
      La stanza calda è rotonda e bassa. Contro la parete di fondo c'è lo scambiatore, largo come un
      forno da pane, con una grata da cui esce una luce rossa che batte piano e sopra i nove segni
      della branda. Davanti c'è un tavolo lungo con due sedie alte, e su una è seduto un bambino.

      È fatto della foschia grigia del corridoio, ma la faccia è nitida, ed è quella di un carbonaio
      anziano, poi di una ragazza con il fazzoletto in testa, poi la tua da piccolo. Muove le labbra,
      sempre la stessa parola, e a ogni parola la luce batte più forte.

      {magia Media} Il Mana qui ha il colore della Marea e gira intorno al tavolo come il fumo intorno
      a una candela. Se disturbi il bambino, diventerà quello che il Mana ricorda di più.

      *Una memoria che ha perso la faccia e se ne cerca una.* Sulla sedia vuota il metallo è consumato
      dalla forma di qualcuno molto alto.
    opzioni:
      - testo: "Affrontare la memoria quando si alza"
        descrizione: "Se ti avvicini, la foschia prende la forma di chi sedeva qui, alta il doppio di te."
        combattimento: forno-della-nonna-tavolo
        vittoria:
          titolo: Il nome
          testo: |
            La memoria si disfa in fiocchi di foschia, e resta il bambino, che dice la parola
            un'ultima volta, chiara. *Nan'Ireth.* Le prime due sillabe somigliano a come i
            carbonai chiamano questo posto. Lo scambiatore si accende tutto, e il bambino non c'è
            più.

            Sul tavolo resta una piastrina tiepida con la mano aperta, e nella grata un nucleo
            che batte ancora.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.forno: 1, oggetto.forno-della-nonna-piastrina: 1, parte.nucleo-3: 1, reperto.sigillato: 1, reliquie.frammento-inciso: 1, contaminazione: 0.5 }
          vai: superficie-fratturata
        sconfitta:
          titolo: La faccia presa
          testo: |
            La memoria ti mette le mani lunghe sulla faccia, e per un tempo che
            non sai misurare sei un bambino seduto al tavolo. Ti risvegli nella
            camera di sopra con la pelle grigia intorno agli occhi e la parola che
            ti scappa.
          effetti: { tormento: 1, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Sedersi al tavolo e lasciargli la tua faccia"
        descrizione: "Se gli lasci la tua faccia, forse ti dice il suo nome."
        prova: { attributo: sociale, abilita: empatia, difficolta: Difficile }
        successo:
          titolo: Di fronte
          testo: |
            Ti siedi sulla sedia alta e lasci che il bambino prenda la tua faccia.
            Gli chiedi il suo nome piano, come a un bambino perso al mercato, e
            lui dice la parola chiara. *Nan'Ireth.* Lo scambiatore si accende
            tutto e il bambino si sfilaccia nella foschia, contento.

            Sul tavolo resta una piastrina tiepida con la mano aperta, e nella
            grata un nucleo che batte ancora.
          pe: { empatia: 5 }
          effetti: { misura.forno: 1, oggetto.forno-della-nonna-piastrina: 1, parte.nucleo-3: 1, reperto.sigillato: 1, reliquie.frammento-inciso: 1, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Due bambini
          testo: |
            Il bambino prende la tua faccia e tu la sua, e ti risvegli nella
            camera di sopra con la bocca piena di cenere e la paura di guardarti
            in una pozzanghera.
          effetti: { tormento: 2, contaminazione: 0.5 }
          vai: superficie-fratturata
      - testo: "Leggere il nome sul pannello dello scambiatore"
        descrizione: "Sotto la grata rovente la macchina tiene scritto chi la comanda."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il registro
          testo: |
            Sotto la grata c'è un pannello con una fila di segni che si accendono
            a ogni parola del bambino, e li confronti con il suono finché tornano.
            *Nan'Ireth.* Lo dici ad alta voce, e lo scambiatore si accende tutto
            mentre il bambino si sfilaccia.

            Sul tavolo resta una piastrina tiepida con la mano aperta, e sotto il
            pannello stacchi un nucleo che batte ancora.
          pe: { tecnologia: 5 }
          effetti: { misura.forno: 1, oggetto.forno-della-nonna-piastrina: 1, parte.nucleo-3: 1, reperto.sigillato: 1, reliquie.frammento-inciso: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La grata rovente
          testo: |
            La grata ti si incolla alla pelle e la luce rossa ti esplode negli
            occhi, e quando ti stacchi la foschia è alta fino al soffitto. Risali
            di corsa con le mani bruciate, senza il nome.
          effetti: { ferite: 2, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Ordinare allo scambiatore di chiamare il suo operatore"
        descrizione: "Il Comando parla alle macchine nella loro lingua, e lo scambiatore sa per chi lavora."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La chiamata
          testo: |
            Dici la formula e la luce rossa si ferma, poi una voce sale dal
            pavimento e dice una parola sola. *Nan'Ireth.* Il bambino si gira
            verso la voce, come quando una madre chiama dalla finestra, e si
            sfilaccia nella foschia.

            Sul tavolo resta una piastrina tiepida con la mano aperta, e nella
            grata un nucleo che batte ancora.
          pe: { magia: 5 }
          effetti: { misura.forno: 1, oggetto.forno-della-nonna-piastrina: 1, parte.nucleo-3: 1, reperto.sigillato: 1, reliquie.frammento-inciso: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La voce sbagliata
          testo: |
            Lo scambiatore risponde con il tuo nome, e il bambino si gira verso di
            te con la tua faccia. Risali correndo, e per molte notti senti
            chiamare il tuo nome dal fondo del letto.
          effetti: { tormento: 2, ferite: 0.5 }
          vai: superficie-fratturata
      - testo: "Vegliare la memoria come si vegliano i morti"
        descrizione: "Al Velo i morti si vegliano perché sappiano chi erano, e questa memoria l'ha dimenticato."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [empatia, accademiche], difficolta: Difficile }
        successo:
          titolo: La veglia
          testo: |
            Ti inginocchi e dici a voce bassa le parole della veglia della prima
            notte, e quando arrivi al punto in cui si chiede il nome del morto il
            bambino risponde. *Nan'Ireth.* Lo scambiatore si accende tutto, e il
            bambino si sfilaccia con la testa china.

            Sul tavolo resta una piastrina tiepida con la mano aperta, e nella
            grata un nucleo che batte ancora.
          pe: { empatia: 5 }
          effetti: { misura.forno: 1, oggetto.forno-della-nonna-piastrina: 1, parte.nucleo-3: 1, reperto.sigillato: 1, reliquie.frammento-inciso: 1, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La veglia interrotta
          testo: |
            A metà veglia perdi le parole e il bambino le finisce con la tua voce,
            sbagliandole tutte. Risali con la foschia alle spalle e la veglia che
            ti gira in testa al contrario.
          effetti: { tormento: 2, contaminazione: 0.5 }
          vai: superficie-fratturata
      - testo: "Risalire senza disturbarlo"
        descrizione: "Il bambino non ti ha chiesto niente. La scala è alle tue spalle."
        costo: 0
        esito:
          titolo: Il carbone buono
          testo: |
            Risali senza voltarti, e nella camera di sopra lasci un pezzo di
            carbone sulla sporgenza, accanto a quelli dei carbonai.
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo · il tavolo apparecchiato
  - id: forno-della-nonna-il-tavolo-apparecchiato
    immagine: ambientazione/marea-grigia
    titolo: Il tavolo apparecchiato
    sommario: "Il bambino è tornato al tavolo con una faccia nuova, e lo scambiatore batte più piano."
    luogo: Il Forno della Nonna, la stanza calda
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna >= 4, misura.forno >= 1]
    testo: |
      Il bambino è di nuovo al tavolo, con la faccia di un carbonaio che non
      conosci, e la parola gli esce a metà, come se l'avessi presa tu. Sulla
      sedia vuota qualcuno ha lasciato un pezzo di carbone buono.

      {tecnologia Media} Dalla grata cade una polvere di cristallo. Senza il
      nome, la macchina si consuma un poco a ogni battito.
    opzioni:
      - testo: "Affrontare la memoria un'altra volta"
        descrizione: "La memoria si rialza anche senza il nome, e lo scambiatore ha qualcosa da dare."
        combattimento: forno-della-nonna-tavolo
        vittoria:
          titolo: La polvere di cristallo
          testo: |
            La memoria si disfa sul tavolo e raccogli dalla grata quello che lo
            scambiatore ha perso.
          effetti: { parte.nucleo-2: 1, reperto.sigillato: 1, contaminazione: 0.5 }
          vai: superficie-fratturata
        sconfitta:
          titolo: La faccia presa
          testo: |
            La memoria ti mette le mani sulla faccia, e ti risvegli fra le ceneri
            con la pelle grigia intorno agli occhi.
          effetti: { contaminazione: 0.5 }
          vai: superficie-fratturata
      - testo: "Dirgli il suo nome intero"
        descrizione: "Gli restituisci per un momento la mezza parola che manca."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Difficile }
        successo:
          titolo: Il nome restituito
          testo: |
            Il bambino ripete il nome con te, e per il tempo di quella parola lo
            scambiatore si accende e lascia cadere un nucleo che batte.
          pe: { empatia: 2 }
          effetti: { parte.nucleo-2: 1, tormento: 0.5 }
          vai: superficie-fratturata
        fallimento:
          titolo: La parola che non torna
          testo: |
            Il bambino ripete il nome con la tua voce e poi ti chiede il tuo, e te
            ne vai prima di rispondere.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Lasciargli il carbone e risalire"
        descrizione: "Hai già il suo nome. Lui ha ancora il suo tavolo."
        costo: 0
        esito:
          titolo: Il carbone sulla sedia
          testo: |
            Posi un pezzo di carbone accanto a quello sulla sedia vuota e risali
            verso le pareti tiepide della camera di sopra.
          vai: superficie-fratturata

nemici:
  - id: forno-della-nonna-spazzacamino
    immagine: bestiario/salvaguardia-precursori
    nome: Spazzacamino del Forno
    descrizione: "Una macchina bassa come un cane da pastore, con una spazzola rotonda davanti e un raschietto affilato per lato. Pulisce i condotti dello scambiatore da prima della Caduta, e per lei la cenere va tolta, anche quando ci sta sotto qualcuno."
    attacco: 4
    difesa: 3
    difesaMentale: 5
    pf: 6
    danno: 3
    riduzione: 2
    iniziativa: 2

  - id: forno-della-nonna-memoria
    immagine: ambientazione/marea-grigia
    nome: La memoria dell'operatore
    descrizione: "La foschia del tavolo che si alza e prende la forma di chi lavorava allo scambiatore, alta il doppio di un uomo, senza faccia. Ricorda soltanto il suo lavoro, e chi le si avvicina diventa parte del lavoro."
    attacco: 5
    difesa: 5
    difesaMentale: 4
    pf: 13
    danno: 3
    riduzione: 3
    iniziativa: 3
