glossario:
  - id: forno-della-nonna-mena
    nome: Mena
    tipo: personaggio
    sottotitolo: "Carbonaia di Pannion, sulla strada di Tuarmir"
    testo: "Carbonaia di Pannion, magra, con un fazzoletto rosso in testa e quasi nessun dente. Dorme al Forno della Nonna da quarant'anni, ci lascia il carbone buono come offerta e ne fa rispettare le regole a chiunque ci passi la notte. La prima regola è che lì si dorme e basta."
    requisiti: []
