# Il Forno della Nonna, spedizione dei luoghi neri (docs/piano-superficie.md, «Le nove spedizioni dei luoghi neri»).
# Una camera di pietra mezzo interrata sulla strada di Tuarmir, dove il sentiero piega per evitare un dosso (codex
# sf-forno-della-nonna): le pareti restano tiepide d'estate e d'inverno, e i carbonai che ci dormono sognano un
# bambino seduto a un tavolo, ogni notte con una faccia diversa. Sotto c'è la stanza calda di un operatore dei
# Precursori, con uno scambiatore che non si è mai spento. Il bambino è la memoria di chi ci lavorava, corrotta come
# dicono le teorie della Marea (sf-teorie-della-marea): non ha più una faccia sua e prende in prestito quelle dei
# sogni. Sopra lo scambiatore ci sono i nove segni dell'Anello del Camminatore, e solo la mano aperta è consumata
# dalle dita; un tubo parte verso nord-est e porta, lontanissima, una nota bassa.
#
# Ingresso `forno-della-nonna-la-stanza-tiepida` (Superficie, ripetibile, traccia.forno >= 3): due vie con prova (chi
# fallisce resta di sopra), il cavallo a costo 0, la notte nel Forno a costo 2.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
#   0 la parete di fondo, i carbonai al fuoco (Mena, la carbonaia che tiene le regole del riparo);
#   1 la scala tiepida;
#   1–3 gli spazzacamini (combattimento contro due gregari);
#   2 il tubo verso nord-est, la dispensa sigillata;
#   3 la branda dell'operatore, il corridoio delle facce.
# Il cuore a 4 è il tavolo (`forno-della-nonna-il-tavolo`, misura.forno == 0): la memoria dell'operatore che prende
# corpo (boss), oppure sedersi al tavolo e lasciargli la propria faccia (Empatia), il nome sul pannello dello
# scambiatore (Tecnologia), il Comando allo scambiatore, tutte Difficili; per l'Accolito del Velo la veglia dei morti
# (Empatia o Accademiche, Difficile). La vittoria dà misura.forno, la Piastrina della mano aperta e parti dei
# Precursori; chi fallisce torna in Superficie senza misura.
# Dopo, `forno-della-nonna-il-tavolo-apparecchiato` (ripetibile, misura.forno >= 1) rende meno.
#
# Il nome (la misura del Forno, per chi scrive la Campana Sepolta): l'operatore si faceva riconoscere dalle macchine
# con la parola *Nan'Ireth*, tre sillabe. Le prime due somigliano a «nonna», ed è da lì che i carbonai, che la
# sentono nei sogni, hanno preso il nome del posto senza saperlo.
# Nomi nuovi: Mena (carbonaia di Pannion, nel glossario).
aree:
  - id: forno-della-nonna
    immagine: ambientazione/rovine-dei-precursori
    nome: Il Forno della Nonna
    sommario: "Una camera di pietra tiepida sulla strada di Tuarmir, dove i carbonai si riparano nelle notti di vento. Sotto la parete di fondo c'è una stanza dove qualcosa non si è mai spento."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Sotto la parete di fondo del Forno la pietra lascia il posto al metallo,
      e il metallo è caldo come il fianco di una mucca. I corridoi scendono
      bassi e stretti, fatti per gente più alta e più magra di te, che
      camminava piegata. Dappertutto c'è odore di polvere scaldata, quello
      delle stufe accese per la prima volta dopo l'estate, e sotto i piedi
      corre un ronzio sordo e regolare, lento come il polso di chi dorme.

      Più si scende più fa caldo, e più fa caldo più viene sonno.

colonna:
  - { contesto: area, id: forno-della-nonna, musica: the-light-that-failed, ambiente: campfire }

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: forno-della-nonna-la-stanza-tiepida
    immagine: ambientazione/tuarmir
    titolo: La stanza tiepida
    sommario: "Dove il sentiero di Tuarmir piega per evitare un dosso ci sono le pareti di una camera di pietra senza tetto. Sono tiepide, e nessuno accende il fuoco contro quella di fondo."
    luogo: Superficie Fratturata, la strada di Tuarmir
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.forno >= 3]
    testo: |
      La strada di Tuarmir corre verso ovest fra colline di erica e massi
      scuri, e in un punto piega di colpo per girare intorno a un dosso.
      Dietro il dosso, mezzo interrata, c'è una camera di pietra senza tetto,
      con le pareti alte fino al petto. Sul pavimento ci sono le ceneri di
      cento fuochi, ognuno nel suo cerchio di sassi, e tutti stanno lontani
      dalla parete di fondo. Appoggi il palmo sulla pietra, ed è tiepida come
      un forno spento la sera prima.

      Su una sporgenza della parete di fondo qualcuno ha lasciato un pezzo di
      carbone buono, di quelli che si vendono in città, e accanto un altro
      più vecchio, mezzo sbriciolato.

      {empatia Media} Sono offerte. I carbonai non sprecano il carbone buono,
      e se lo lasciano lì è per qualcuno a cui vogliono stare simpatici.

      {origine accolito-del-velo} I carri del Velo passano su questa strada
      due volte al mese, carichi di erbe di Tuarmir. In Cattedrale i
      carrettieri raccontano di una stanza dove non bisogna dormire, e i
      novizi ridono, finché non tocca a loro accompagnare il carro.

      *Una casa senza tetto che tiene il caldo meglio della mia.* In basso,
      dove la parete di fondo tocca terra, la cenere è più chiara, come se
      qualcosa la scaldasse da sotto.
    opzioni:
      - testo: "Cercare il punto più caldo della parete"
        descrizione: "Il caldo viene da qualche parte. Basta seguirlo con le mani, palmo per palmo."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La pietra calda
          testo: |
            Passi le mani sulla parete di fondo palmo per palmo, come si cerca
            una febbre, e in basso a sinistra trovi una pietra più calda delle
            altre, quasi da scottare. Si sfila dal muro tirandola verso di te.
            Dietro c'è un'apertura stretta e una scala di metallo che scende,
            e dal buio sale un'aria calda che sa di polvere scaldata.
          pe: { percezione: 2 }
          vai: forno-della-nonna
        fallimento:
          titolo: Le pareti tutte uguali
          testo: |
            Tutta la parete ti sembra calda allo stesso modo, e dopo un'ora di
            palpate hai soltanto le mani nere di fuliggine. Ti siedi su una
            pietra a riposare, e ti svegli che è buio, con la testa
            appoggiata al muro e il ricordo vago di un tavolo.
          effetti: { tormento: 0.5 }
      - testo: "Smontare la parete di fondo"
        descrizione: "Le pietre sono a secco. Se il caldo viene da dietro, si tolgono finché non si vede da dove."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Pietra per pietra
          testo: |
            Togli le pietre della parete di fondo una alla volta e le posi in
            fila sull'erba, come i carbonai posano le zolle. Dietro la terza
            fila la pietra finisce e comincia il metallo, con una fessura
            larga quanto le tue spalle e una scala che scende nel caldo.
          pe: { atletica: 2 }
          vai: forno-della-nonna
        fallimento:
          titolo: La pietra rovente
          testo: |
            La quarta pietra è così calda che ti si attacca alle dita, e la
            lasci cadere sul piede. Rimetti a posto le altre con le mani
            fasciate, e per quel giorno smetti.
          effetti: { ferite: 0.5 }
      - testo: "Guardare dove si sdraia il cavallo"
        descrizione: "Un cavallo stanco cerca il caldo, e si sdraia dove la terra ne dà di più. Tanto vale lasciarlo scegliere."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il cavallo al caldo
          testo: |
            Togli la sella al cavallo e lo lasci libero dentro la camera. Fa
            due giri annusando le ceneri e poi si sdraia contro la parete di
            fondo, in basso a sinistra, con un sospiro lungo. Lo sposti con
            fatica, e sotto il suo fianco c'è una pietra più calda delle altre
            che si sfila dal muro. Dietro, una scala di metallo scende nel
            caldo.
          vai: forno-della-nonna
      - testo: "Dormirci una notte, come i carbonai"
        descrizione: "I carbonai dormono qui e sognano un bambino. Forse il bambino sa dove si scende. Il sonno qui però si paga."
        costo: 2
        esito:
          titolo: Il bambino indica
          testo: |
            Ti stendi con la schiena contro la parete di fondo e ti addormenti
            prima di quanto vorresti. Sogni un tavolo e un bambino seduto, che
            ti guarda con la faccia di un ragazzo che non conosci. Indica il
            pavimento sotto la tua spalla, senza dire niente. Ti svegli
            all'alba fradicio di sudore e scavi dove indicava. Sotto un palmo
            di cenere trovi una lastra di metallo calda e una scala che
            scende.
          effetti: { tormento: 1 }
          vai: forno-della-nonna

  # ------------------------------------------------------------ 0 · la parete di fondo e i carbonai
  - id: forno-della-nonna-la-parete-di-fondo
    immagine: ambientazione/rovine-dei-precursori
    titolo: Dietro la parete di fondo
    sommario: "Dietro la parete del Forno c'è un pianerottolo di metallo, e una porta bassa che si apre soltanto se la tocchi nel modo giusto."
    luogo: Il Forno della Nonna, il pianerottolo sotto la parete
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna == 0]
    testo: |
      La scala finisce su un pianerottolo di metallo caldo, poco più largo di
      un letto. Di fronte c'è una porta bassa e liscia, che non ha
      maniglie né serrature. Al centro della porta è incisa una mano aperta, con le
      dita lunghe il doppio delle tue. Il metallo della mano è più lucido del
      resto, consumato da molte altre mani.

      {tecnologia Media} Quella mano è il posto dove va appoggiato il
      palmo, e la porta si aspetta una mano più grande, o almeno una mano
      che sappia dove premere.

      Sul pianerottolo, in un angolo, c'è un mozzicone di candela di sego,
      lasciato da qualcuno che è arrivato fin qui e poi è tornato su.
    opzioni:
      - testo: "Appoggiare la mano dove va appoggiata"
        descrizione: "La mano incisa è più grande della tua. Bisogna capire quali dita contano."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Le dita lunghe
          testo: |
            Appoggi il palmo al centro della mano incisa e allarghi le dita
            fino in fondo, finché i polpastrelli non toccano le cinque punte
            più lucide. La porta si scalda sotto la tua mano e scivola dentro
            la parete. Oltre c'è un corridoio basso che scende.
          pe: { tecnologia: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: La porta che scotta
          testo: |
            Appoggi la mano, e la porta si scalda fino a scottare prima che
            tu riesca a toglierla. Ti resta sul palmo il segno rosso della
            mano incisa, più grande della tua.
          effetti: { ferite: 0.5 }
      - testo: "Forzare la porta con una leva"
        descrizione: "È una porta, e le porte scorrono. Con una leva infilata nella fessura si vede quanto vuole restare chiusa."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: La leva
          testo: |
            Infili la leva nella fessura e spingi con il piede contro la
            parete, e la porta cede di un palmo alla volta, con un lamento
            lungo. Quando è aperta abbastanza ci passi di fianco, e il caldo
            dall'altra parte ti asciuga il sudore sulla fronte.
          pe: { atletica: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: Il lamento
          testo: |
            La porta cede di un dito e si richiude di scatto sulla leva,
            strappandotela di mano. Il rumore rimbomba giù per il corridoio
            per molto tempo, e alla fine ti sembra che qualcuno risponda.
          effetti: { tormento: 1 }
      - testo: "Accendere la candela e aspettare"
        descrizione: "Qualcuno ha lasciato una candela. Forse aspettava che la porta si aprisse da sola. Si aspetta con lui, al caldo."
        costo: 2
        esito:
          titolo: La candela
          testo: |
            Accendi il mozzicone e ti siedi con la schiena al muro, e il caldo
            ti fa calare le palpebre. Ti svegli con la candela consumata e la
            porta aperta, e non sai quale delle due cose sia successa prima.
            Nel sonno hai sognato un tavolo.
          effetti: { profondita.forno-della-nonna: 1, tormento: 1 }

  - id: forno-della-nonna-i-carbonai-al-fuoco
    immagine: ambientazione/tuarmir
    titolo: I carbonai al fuoco
    sommario: "Al tramonto arrivano tre carbonai di Pannion a prendere il riparo per la notte. La più vecchia vede la pietra tolta dal muro e non è contenta."
    luogo: Il Forno della Nonna, la camera di sopra
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna == 0]
    testo: |
      Prima che tu scenda arrivano i carbonai, tre, con i sacchi in spalla e
      le facce nere fino alle sopracciglia. La più vecchia è una donna magra
      con un fazzoletto rosso in testa, e si chiama Mena. Vede la pietra
      tolta dalla parete di fondo e posa il sacco per terra piano, come si
      posa un bambino che dorme.

      «Qui si dorme e basta» ti dice. «La nonna ci tiene caldo, e noi non le
      tocchiamo la casa. È la regola da quando c'era mia madre.» Gli altri
      due si mettono a fare il fuoco lontano dalla parete, senza guardarti.

      {conoscenze-della-strada Media} Le regole dei ripari le fa chi ci dorme
      più spesso, e lei ci dorme da quarant'anni. Se scendi senza il suo
      permesso, sulla strada di Tuarmir lo sapranno tutti prima di sera.

      Mena si siede sul suo sacco, davanti al buco nel muro.
    opzioni:
      - testo: "Spiegarle perché devi scendere"
        descrizione: "Una donna che lascia carbone buono alla nonna vuole bene a quel posto. Bisogna farle capire che non vuoi fargli del male."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il permesso
          testo: |
            Le racconti delle pietre nere, e del bambino che anche lei ha
            sognato, e lei ascolta tormentandosi il fazzoletto. Alla fine si
            alza e ti fa passare. «Portale questo» ti dice, e ti mette in mano
            un pezzo di carbone buono. «E chiedile permesso anche tu.»
          pe: { empatia: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: La strada lo sa
          testo: |
            Mena ti ascolta con le braccia incrociate e poi rimette la pietra
            nel muro con le sue mani, che si scottano senza che lei faccia una
            smorfia. Te ne vai, e alla carbonaia successiva un ragazzo ti
            chiede se sei quello che ha disturbato la nonna.
          effetti: { tormento: 1 }
      - testo: "Dividere il fuoco e aspettare che dormano"
        descrizione: "I carbonai sono stanchi. Una notte al fuoco con loro, un po' di vino, e poi si scende quando russano."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, espressivita], difficolta: Media }
        successo:
          titolo: La storia del fuoco
          testo: |
            Dividi con loro il pane e una storia della città, quella del
            mercante che vendeva acqua del Torvessa per acqua santa, e Mena
            ride con la bocca senza denti. Dormono presto. Quando russano tutti
            e tre ti infili nel buco del muro, e sulla soglia ti accorgi che
            Mena ha gli occhi aperti e ti guarda andare.
          pe: { conoscenze-della-strada: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: Chi dorme prima
          testo: |
            Dormi prima tu. Sogni il tavolo e il bambino, che ha la faccia di
            Mena da giovane, e ti svegli all'alba con i carbonai già partiti
            e la pietra rimessa nel muro.
          effetti: { tormento: 1 }
      - testo: "Fare il giro e rientrare dal retro del dosso"
        descrizione: "Il caldo esce anche dal dosso. Dietro, fra i rovi, ci sarà un altro passaggio scomodo, lontano dagli occhi di Mena."
        costo: 2
        esito:
          titolo: Il retro del dosso
          testo: |
            Giri intorno al dosso nel buio e cerchi a tentoni fra i rovi il
            punto dove la terra fuma appena. Lo trovi dopo un'ora, con le
            braccia graffiate fino ai gomiti. È un tubo di metallo che esce
            dal terreno, largo abbastanza per passarci strisciando, e scende
            nel caldo.
          effetti: { profondita.forno-della-nonna: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · la scala tiepida
  - id: forno-della-nonna-la-scala-tiepida
    immagine: ambientazione/rovine-dei-precursori
    titolo: La scala tiepida
    sommario: "Una scala lunga scende nel caldo. A ogni gradino fa un poco più caldo, e le palpebre pesano un poco di più."
    luogo: Il Forno della Nonna, la scala lunga
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna == 1]
    testo: |
      Il corridoio diventa una scala lunga e dritta, con i gradini alti per
      gambe più lunghe delle tue. A ogni gradino fa un poco più caldo, e il
      caldo è di quelli buoni, come sotto una coperta di lana in una mattina
      d'inverno. Dopo una trentina di gradini ti accorgi che stai sbadigliando.
      Sulle pareti ci sono nicchie basse, profonde quanto un braccio, con
      dentro uno strato di polvere morbida.

      {resistenza Media fallita} Il corpo ha deciso che questo è il posto
      più comodo che ha trovato da settimane, e comincia a cercare una
      nicchia della sua misura.
    opzioni:
      - testo: "Scendere tenendosi svegli"
        descrizione: "Un pizzicotto, l'acqua fredda in faccia, una canzone a mezza voce. Basta arrivare in fondo con gli occhi aperti."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Gli occhi aperti
          testo: |
            Scendi canticchiando una canzone da osteria con tutte le strofe,
            anche quelle che non si cantano davanti ai preti, e ogni volta che
            le palpebre calano ti mordi l'interno della guancia. In fondo alla
            scala il caldo si fa secco, e il sonno ti lascia di colpo.
          pe: { resilienza: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: La nicchia
          testo: |
            Ti siedi un momento in una nicchia, soltanto per riposare le
            gambe. Ti svegli con la guancia nella polvere morbida e un tavolo
            negli occhi, e risali la scala senza ricordarti di aver deciso di
            farlo.
          effetti: { tormento: 1 }
      - testo: "Scendere in fretta, prima che il caldo vinca"
        descrizione: "I gradini sono alti e la scala è lunga. Se si corre, il sonno non fa in tempo ad arrivare."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Di corsa
          testo: |
            Scendi saltando i gradini due alla volta, con le braccia larghe
            per tenerti in equilibrio, e il cuore che batte forte ti tiene
            sveglio meglio di un secchio d'acqua. In fondo hai le gambe che
            tremano e gli occhi bene aperti.
          pe: { atletica: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: Il gradino alto
          testo: |
            Un gradino è più alto degli altri, e lo manchi. Rotoli per un
            tratto e ti fermi contro il bordo di una nicchia, con un
            ginocchio che si gonfia a vista d'occhio.
          effetti: { ferite: 0.5 }
      - testo: "Bagnarsi la testa e scendere piano"
        descrizione: "Un fazzoletto bagnato sulla testa e uno sulla bocca. Si scende un gradino alla volta, e l'acqua finisce presto."
        costo: 2
        esito:
          titolo: Il fazzoletto bagnato
          testo: |
            Bagni il fazzoletto con l'acqua della borraccia e te lo leghi in
            testa, e scendi un gradino alla volta. A metà scala il fazzoletto
            è già asciutto e caldo. In fondo arrivi con la pelle del viso che
            tira come dopo una giornata al sole.
          effetti: { profondita.forno-della-nonna: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1–3 · gli spazzacamini
  - id: forno-della-nonna-gli-spazzacamini
    immagine: bestiario/salvaguardia-precursori
    titolo: Gli spazzacamini
    sommario: "Due macchine basse con spazzole e raschietti puliscono un condotto. Tu sei coperto di cenere, e per loro la cenere va tolta."
    luogo: Il Forno della Nonna, un condotto largo
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna >= 1, profondita.forno-della-nonna <= 3]
    testo: |
      Il passaggio attraversa un condotto largo e basso, con le pareti
      lucide come una pentola appena strofinata. Dentro lavorano due
      macchine grandi come cani da pastore, basse sulle zampe, con una
      spazzola rotonda davanti e un raschietto per ogni lato. Puliscono il
      metallo con un fruscio paziente, e dove passano non resta un granello.

      {percezione Media} Tu hai la cenere del Forno fino ai gomiti e
      perfino nei capelli. Per una macchina che pulisce, sei la cosa più
      sporca che sia entrata qui da molto tempo.

      Le due spazzole si fermano, e i raschietti si girano verso di te.
    opzioni:
      - testo: "Difendersi dagli spazzacamini"
        descrizione: "Due, con i raschietti affilati come lame. Sono fatte per pulire, e pulire a fondo."
        combattimento: forno-della-nonna-spazzacamini
        vittoria:
          titolo: Il condotto pulito
          testo: |
            Il secondo spazzacamino si rovescia sul dorso e muove le zampe
            nell'aria per un pezzo, come uno scarafaggio. Smonti dai due
            quello che si può portare, e il condotto resta pulito, a parte
            le tue impronte.
          effetti: { profondita.forno-della-nonna: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: Raschiato
          testo: |
            I raschietti ti tolgono la cenere e un po' di pelle sotto, a
            strisce. Arretri fino alla bocca del condotto, e le due macchine
            tornano al loro lavoro come se tu non ci fossi mai stato.
      - testo: "Spogliarsi della cenere e passare pulito"
        descrizione: "Se puliscono la cenere, senza la cenere non c'è niente da pulire. Bisogna scrollarsela di dosso tutta, in fretta."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Pulito
          testo: |
            Ti levi la giubba e la sbatti fuori dal condotto, poi ti strofini
            i capelli e le mani contro il metallo lucido finché non sono quasi
            puliti. Rientri piano. Gli spazzacamini ti passano accanto con le
            spazzole alzate e non si fermano.
          pe: { percezione: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: La cenere nei capelli
          testo: |
            Ti scrolli la giubba, ma la cenere nei capelli te la sei
            dimenticata. Uno spazzacamino ti si arrampica fino alla testa con
            la spazzola, e ne esci con una ciocca in meno e un taglio sulla
            fronte.
          effetti: { ferite: 0.5 }
      - testo: "Strisciare nel tubo di scarico accanto"
        descrizione: "Accanto al condotto corre un tubo più stretto, sporco di fuliggine. Gli spazzacamini non ci arrivano."
        costo: 2
        esito:
          titolo: Il tubo di scarico
          testo: |
            Strisci nel tubo di scarico con i gomiti, nella fuliggine fino ai
            polsi, e ne esci più nero di un carbonaio di Pannion. Dall'altra
            parte del condotto gli spazzacamini si girano tutti e due verso di
            te, e tu ti allontani in fretta prima che decidano.
          effetti: { profondita.forno-della-nonna: 1, contaminazione: 0.5 }

  # ------------------------------------------------------------ 2 · il tubo verso nord-est e la dispensa
  - id: forno-della-nonna-il-tubo-verso-nord-est
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il tubo verso nord-est
    sommario: "Un tubo grosso come un uomo esce dalla parete e si perde nella roccia verso nord-est. Appoggiandoci l'orecchio si sente una nota bassa che non finisce."
    luogo: Il Forno della Nonna, la galleria del tubo
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna == 2]
    testo: |
      In una galleria più alta delle altre corre un tubo di metallo grosso
      come un uomo, caldo al tatto. Esce dalla parete da cui arriva il
      ronzio e attraversa tutta la galleria, poi sparisce dritto nella roccia
      dall'altra parte, verso nord-est. Sul tubo, all'altezza degli occhi, è
      incisa la mano aperta della porta, e sotto la mano una fila di altri
      segni più piccoli, consumati.

      {resilienza Media} Appoggi l'orecchio al tubo, e dentro, lontanissima,
      c'è una nota bassa e lunga che non finisce mai. Ti entra nei denti e
      ci resta anche quando stacchi la testa.

      In fondo alla galleria il pavimento scende verso il ronzio.
    opzioni:
      - testo: "Ascoltare la nota fino in fondo"
        descrizione: "Una nota sola, da lontano. Se si ascolta abbastanza, si capisce da quanto lontano arriva."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: La nota lontana
          testo: |
            Tieni l'orecchio sul tubo finché la nota non diventa un posto
            dove stare, invece di un rumore. Arriva da molto lontano verso
            nord-est, più lontano del Rovolungo. Quando ti stacchi ce l'hai
            ancora nella mascella, e scendi verso il ronzio canticchiandola
            senza volerlo.
          pe: { percezione: 2 }
          effetti: { profondita.forno-della-nonna: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: I denti
          testo: |
            La nota ti entra nei denti e comincia a farli dolere tutti
            insieme, come quando si morde il ghiaccio. Ti stacchi dal tubo
            con la bocca piena di saliva e torni indietro, a cercare un posto
            dove la nota non arrivi.
          effetti: { tormento: 1 }
      - testo: "Seguire il tubo fino al punto da cui esce"
        descrizione: "Il tubo esce da una parete. Dietro la parete c'è quello che lo scalda."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Sopra il tubo
          testo: |
            Ti arrampichi sul tubo e lo percorri a carponi fino alla parete,
            dove il metallo è così caldo che devi avvolgerti le mani nelle
            maniche. Nel punto in cui il tubo entra nel muro c'è un varco
            largo quanto il tubo stesso. Ci scivoli sotto, e dall'altra parte
            la galleria scende.
          pe: { atletica: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: Il tubo caldo
          testo: |
            A metà strada il tubo è troppo caldo per le ginocchia, e scivoli
            giù dalla parte sbagliata. Atterri sul fianco, con una scottatura
            lunga sull'avambraccio che hai usato per frenare.
          effetti: { ferite: 0.5 }
      - testo: "Passare sotto il tubo lungo la galleria"
        descrizione: "Sotto il tubo la galleria continua bassa e piena di vapore. Si passa piegati, sudando."
        costo: 2
        esito:
          titolo: Il vapore
          testo: |
            Passi sotto il tubo piegato in due, nel vapore che sale da una
            griglia del pavimento. Esci dall'altra parte con i vestiti
            fradici e la testa che pulsa al ritmo del ronzio, e per tutta la
            discesa ti senti in bocca un sapore di ferro.
          effetti: { profondita.forno-della-nonna: 1, contaminazione: 0.5 }

  - id: forno-della-nonna-la-dispensa
    immagine: ambientazione/rovine-dei-precursori
    titolo: La dispensa sigillata
    sommario: "Una stanza stretta piena di scaffali, e sugli scaffali contenitori chiusi senza una giuntura. Qualcuno mangiava qui."
    luogo: Il Forno della Nonna, la dispensa
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna == 2]
    testo: |
      La stanza è stretta e lunga, con scaffali di metallo dal pavimento al
      soffitto. Sugli scaffali ci sono contenitori cilindrici grandi come
      un pugno, chiusi senza una giuntura, allineati per grandezza. In fondo
      c'è una mensola più bassa delle altre con sopra una tazza di metallo
      opaco, appoggiata a bocca in giù, come la si mette ad asciugare.

      {accademiche Media} I diari dell'Era del Silenzio parlano di dispense
      come questa, dove i superstiti trovavano da mangiare in contenitori
      che i superstiti non sapevano aprire. Qualcuno, a quanto pare, ci riusciva.

      {conoscenze-della-strada Media fallita} Ti chiedi quanto pagherebbe un
      ricettatore del Mercato dei Nodi per una tazza dei Precursori, e ti
      rispondi da solo con un prezzo che nessun ricettatore ha mai pagato.
      
      Accanto alla tazza c'è la mano aperta incisa nel metallo, piccola come un sigillo. Oltre la dispensa una porta scende.
    opzioni:
      - testo: "Aprire un contenitore come lo apriva lui"
        descrizione: "Chi ci mangiava sapeva aprirli. Il segno della mano sulla mensola dice qualcosa sul come."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il contenitore
          testo: |
            Appoggi un contenitore sulla mano incisa, e il coperchio si stacca
            con un piccolo schiocco. Dentro c'è una pasta grigia che sa
            vagamente di noci. Gli altri contenitori li lasci dove sono, tranne
            uno che non si apre e pesa troppo per essere cibo, e te lo metti
            nella bisaccia prima di prendere la porta.
          pe: { tecnologia: 2 }
          effetti: { profondita.forno-della-nonna: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: Lo schiocco
          testo: |
            Provi a forzare un contenitore con il coltello, e si apre di colpo
            con uno sbuffo di polvere grigia che ti prende in faccia. Tossisci
            fuori dalla dispensa, con gli occhi che lacrimano e un sapore di
            muffa vecchia in gola.
          effetti: { contaminazione: 1 }
      - testo: "Guardare la tazza"
        descrizione: "Una tazza sola, messa ad asciugare. Una tazza dice di chi la usava più di tutti gli scaffali."
        prova: { attributo: sociale, abilita: [empatia, percezione], difficolta: Media }
        successo:
          titolo: La tazza
          testo: |
            La giri, e sul fondo c'è un graffio fatto con una punta, cioè
            una linea storta che somiglia a un ramo o a una lettera. Qualcuno ha
            segnato la sua tazza perché nessun altro la usasse, e qui sotto
            non c'era nessun altro. La rimetti a bocca in giù come l'hai
            trovata e prendi la porta.
          pe: { empatia: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: La tazza calda
          testo: |
            Prendi la tazza, ed è calda come se l'avessero appena riempita.
            Ti cade di mano e rotola sotto uno scaffale, e quando ti chini a
            riprenderla è di nuovo sulla mensola, a bocca in giù.
          effetti: { tormento: 1 }
      - testo: "Passare oltre senza toccare niente"
        descrizione: "È la dispensa di qualcuno. Si attraversa con le mani in tasca."
        costo: 2
        esito:
          titolo: Le mani in tasca
          testo: |
            Attraversi la dispensa con le mani in tasca, attento a non urtare
            gli scaffali. Quando sei sulla porta senti alle tue spalle un
            tintinnio leggero di metallo su metallo, come di una tazza che
            qualcuno rimette a posto. Ti volti, e non c'è nessuno.
          effetti: { profondita.forno-della-nonna: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · la branda e il corridoio delle facce
  - id: forno-della-nonna-la-branda
    immagine: ambientazione/rovine-dei-precursori
    titolo: La branda dell'operatore
    sommario: "Una cella con una branda lunga e stretta, ancora rifatta. Sulla branda il caldo è perfetto, e il sonno arriva subito."
    luogo: Il Forno della Nonna, la cella della branda
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna == 3]
    testo: |
      In una cella bassa c'è una branda lunga il doppio di un letto e
      stretta come una panca, con una coperta grigia tirata e rimboccata
      sotto il materasso. Sulla parete, dalla parte della testa, ci sono
      nove piccoli segni incisi in fila. Su quello della mano aperta il
      metallo è consumato da un dito, come una moneta lisciata in tasca.
      Il caldo qui è perfetto, quello giusto per dormire.

      {origine allievo-di-torvessa} All'Accademia c'è un professore che
      fa lezione sulla Marea come memoria andata a male, e gli studenti
      dormono in ultima fila. Ti torna in mente adesso la sua voce, e
      vorresti essere stato più attento.

      {medicina Media} Il sonno che senti non è stanchezza. Arriva da fuori,
      con il caldo, come quello che danno certe erbe di Tuarmir.

      Oltre la branda una porticina dà su un passaggio che scende.
    opzioni:
      - testo: "Toccare il segno della mano come faceva lui"
        descrizione: "Chi dormiva qui toccava quel segno ogni sera prima di coricarsi."
        prova: { attributo: sociale, abilita: [empatia, accademiche], difficolta: Media }
        successo:
          titolo: La buonanotte
          testo: |
            Tocchi il segno della mano con l'indice, piano, come si tocca la
            fronte di qualcuno che dorme. Il sonno ti lascia di colpo, e la
            porticina oltre la branda si apre da sola. Sotto il cuscino
            sporge una scheggia di metallo scuro, e la prendi.
          pe: { empatia: 2 }
          effetti: { profondita.forno-della-nonna: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Sulla branda
          testo: |
            Tocchi il segno, e ti ritrovi seduto sulla branda senza ricordare
            di esserti seduto. Poi sdraiato. Ti svegli tremando di freddo
            molto più in alto, sulla scala, con un tavolo negli occhi e una
            faccia che non era la tua.
          effetti: { tormento: 1 }
      - testo: "Attraversare la cella senza sedersi"
        descrizione: "La branda è lì, e il sonno con lei. Basta non fermarsi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: In piedi
          testo: |
            Attraversi la cella con lo sguardo sulla porticina, e il caldo ti
            accarezza la nuca per convincerti, e tu tiri dritto. Dall'altra parte
            l'aria è più secca, e ti accorgi di avere i pugni chiusi così
            stretti che le unghie ti hanno segnato i palmi.
          pe: { resilienza: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: Un momento solo
          testo: |
            A metà cella ti appoggi alla branda per un momento solo, e il
            momento dura ore. Ti svegli sul pavimento, accanto alla porta
            da cui eri entrato, con la coperta grigia rimboccata addosso.
          effetti: { tormento: 1.5 }
      - testo: "Togliere la coperta e passare sopra la branda"
        descrizione: "La coperta è la cosa più calda della stanza. Se la togli, il sonno se ne va un po' con lei, ma ci vuole coraggio a toccarla."
        costo: 2
        esito:
          titolo: La coperta
          testo: |
            Tiri via la coperta in un colpo, e si sbriciola in una nuvola
            grigia che ti si posa addosso. Il sonno se ne va con lei, e passi
            sopra la branda nuda fino alla porticina, tossendo per tutto il
            tempo.
          effetti: { profondita.forno-della-nonna: 1, contaminazione: 1 }

  - id: forno-della-nonna-il-corridoio-delle-facce
    immagine: ambientazione/marea-grigia
    titolo: Il corridoio delle facce
    sommario: "Le pareti del corridoio sono lastre di vetro scuro, e in ogni lastra c'è una faccia addormentata. Sono facce di carbonai."
    luogo: Il Forno della Nonna, il corridoio delle lastre
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna == 3]
    testo: |
      Il corridoio è fatto di lastre di vetro scuro alte quanto un uomo, messe
      una dopo l'altra. In ogni lastra c'è una faccia con gli occhi chiusi.
      Sono facce di gente qualunque con la fuliggine nelle rughe, qualcuna
      giovane con i baffi appena nati, e tutte dormono male. Una ha il
      fazzoletto in testa e le occhiaie scure delle carbonaie che si
      incontrano sulla strada di Tuarmir, e muove le labbra nel sonno.

      {natura Difficile} Il vetro non riflette niente. Le facce stanno
      dentro, come pesci sotto il ghiaccio, e c'è una foschia grigia che si
      muove fra l'una e l'altra.

      In fondo al corridoio una luce rossa e calda batte piano.
    opzioni:
      - testo: "Camminare guardando avanti"
        descrizione: "Le facce dormono. Se le guardi troppo a lungo, forse si svegliano a cercarti."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La luce rossa
          testo: |
            Cammini con gli occhi fissi sulla luce in fondo, e le facce ti
            scorrono ai lati come case viste da un carro. Una, verso la fine,
            apre la bocca come per dire qualcosa, ma tu sei già passato.
            Arrivi alla luce rossa con le mani fredde nonostante il caldo.
          pe: { resilienza: 2 }
          effetti: { profondita.forno-della-nonna: 1 }
        fallimento:
          titolo: La tua faccia
          testo: |
            Guardi di lato una volta sola, e nella lastra c'è la tua faccia, da
            bambino, con gli occhi chiusi. Arretri fino all'imbocco del
            corridoio, e ci metti molto a smettere di toccarti la guancia per
            controllare che sia ancora tua.
          effetti: { tormento: 1.5 }
      - testo: "Svegliare la faccia della carbonaia"
        descrizione: "Muove le labbra, come se volesse dire qualcosa. Se si sveglia, forse sa dove si va."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: La carbonaia
          testo: |
            Bussi piano sul vetro e la chiami come si chiama una vicina, e
            la faccia apre gli occhi. Ti guarda, e poi guarda in fondo al
            corridoio, verso la luce, con un cenno del mento. Quando passi
            oltre la lastra ha di nuovo gli occhi chiusi. Fuori, sulla strada
            di Tuarmir, ti piace pensare che stanotte dorma meglio.
          pe: { empatia: 2 }
          effetti: { profondita.forno-della-nonna: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Gli occhi grigi
          testo: |
            La faccia apre gli occhi, e sono grigi da un bordo all'altro, senza
            pupilla. Tutte le altre facce del corridoio li aprono insieme a
            lei. Torni indietro di corsa, e la foschia grigia ti viene dietro
            per un tratto.
          effetti: { tormento: 1, contaminazione: 0.5 }
      - testo: "Coprire le lastre con il mantello mentre passi"
        descrizione: "Le facce che non vedi non ti vedono. Si copre una lastra alla volta, e si avanza piano."
        costo: 2
        esito:
          titolo: Il mantello
          testo: |
            Tieni il mantello aperto davanti a ogni lastra mentre ci passi
            accanto, come si copre una gabbia di uccelli per farli tacere. Ci
            vuole molto. Quando arrivi alla luce rossa il mantello ha una
            patina grigia che non va via a sbatterlo.
          effetti: { profondita.forno-della-nonna: 1, contaminazione: 0.5 }

  # ------------------------------------------------------------ il cuore · il tavolo
  - id: forno-della-nonna-il-tavolo
    immagine: ambientazione/marea-grigia
    titolo: Il tavolo
    sommario: "Nella stanza calda in fondo al Forno c'è uno scambiatore acceso da prima della Caduta, e davanti un tavolo. Al tavolo è seduto un bambino con la faccia di qualcun altro."
    luogo: Il Forno della Nonna, la stanza calda
    area: forno-della-nonna
    requisiti: [profondita.forno-della-nonna >= 4, misura.forno == 0]
    testo: |
      La stanza calda è rotonda e bassa. Contro la parete di fondo c'è lo
      scambiatore, un corpo di metallo largo come un forno da pane, con una
      grata da cui esce una luce rossa che batte piano, lenta come il polso
      di chi dorme. Sopra lo scambiatore sono incisi i nove segni della
      branda, e la mano aperta è lucida. Davanti c'è un tavolo lungo e
      stretto con due sedie alte, e su una delle due è seduto un bambino.

      È fatto della stessa foschia grigia del corridoio, con i contorni che
      si sfilacciano. La faccia invece è nitida. È quella di un carbonaio
      anziano, poi di una ragazza con il fazzoletto in testa, e poi la tua,
      da piccolo, come non la vedevi da anni. Ti guarda e muove le labbra, sempre la stessa parola, e a
      ogni parola la luce dello scambiatore batte un poco più forte.

      {magia Media} Il Mana qui ha il colore della Marea, e gira intorno al
      tavolo come il fumo intorno a una candela. Il bambino ne è fatto, e
      se lo disturbi diventerà quello che il Mana ricorda di più.

      *Una memoria che ha perso la faccia e se ne cerca una.* Sull'altra
      sedia, quella vuota, il metallo è consumato dalla forma di qualcuno
      molto alto.
    opzioni:
      - testo: "Affrontare la memoria quando si alza"
        descrizione: "Se ti avvicini al tavolo, la foschia si alza e prende la forma di chi sedeva qui. È alta il doppio di te, e ricorda soltanto il suo lavoro."
        combattimento: forno-della-nonna-tavolo
        vittoria:
          titolo: Il nome
          testo: |
            La memoria si disfa sotto i tuoi colpi in fiocchi di foschia che
            ricadono sul tavolo, e per ultimo resta il bambino, piccolo, con
            una faccia che finalmente non è di nessuno. Dice la parola
            un'ultima volta, chiara come una campanella, e la luce dello
            scambiatore si accende tutta. *Nan'Ireth.* Ha tre sillabe, e le prime due somigliano a
            come i carbonai chiamano questo posto. Poi il bambino non c'è più.

            Sul tavolo, dove sedeva lui, c'è una piastrina di metallo tiepida
            con la mano aperta incisa sopra. Nella grata dello scambiatore
            trovi un nucleo che batte ancora, e lo prendi con le maniche
            tirate sulle mani.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.forno: 1, oggetto.forno-della-nonna-piastrina: 1, parte.nucleo-3: 1, reperto.sigillato: 1, reliquie.frammento-inciso: 1, contaminazione: 0.5 }
          vai: superficie-fratturata
        sconfitta:
          titolo: La faccia presa
          testo: |
            La memoria ti mette le mani lunghe sulla faccia, e per un tempo
            che non sai misurare sei seduto al tavolo, piccolo, a guardare
            qualcuno che lavora allo scambiatore. Ti risvegli nella camera di
            sopra, fra le ceneri dei carbonai, con la pelle grigia intorno
            agli occhi e la parola che ti scappa via ogni volta che provi a
            ricordarla.
          effetti: { tormento: 1, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Sedersi al tavolo e lasciargli la tua faccia"
        descrizione: "Il bambino cerca una faccia. Se gliela dai tu, e ti siedi di fronte a lui, forse ti dice il suo nome. Bisogna restare se stessi mentre lui ti guarda con i tuoi occhi."
        prova: { attributo: sociale, abilita: empatia, difficolta: Difficile }
        successo:
          titolo: Di fronte
          testo: |
            Ti siedi sulla sedia alta, con i piedi che non toccano terra, e
            lasci che il bambino ti guardi. Prende la tua faccia da piccolo e
            la tiene. Gli chiedi come si chiama, piano, come si chiede a un
            bambino che si è perso al mercato. Lui ci pensa, e poi dice la
            parola chiara. *Nan'Ireth.* La luce dello scambiatore si accende
            tutta, e il bambino si sfilaccia nella foschia, contento.

            Sul tavolo resta una piastrina di metallo tiepida con la mano
            aperta incisa sopra. Nella grata dello scambiatore trovi un nucleo
            che batte ancora.
          pe: { empatia: 5 }
          effetti: { misura.forno: 1, oggetto.forno-della-nonna-piastrina: 1, parte.nucleo-3: 1, reperto.sigillato: 1, reliquie.frammento-inciso: 1, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Due bambini
          testo: |
            Ti siedi, e il bambino prende la tua faccia, e poi tu prendi la
            sua. Per un tempo lungo siete due bambini senza nome a un tavolo,
            e nessuno dei due si ricorda chi era seduto prima. Ti risvegli
            nella camera di sopra con la bocca piena di cenere e la paura di
            guardarti in una pozzanghera.
          effetti: { tormento: 2, contaminazione: 0.5 }
          vai: superficie-fratturata
      - testo: "Leggere il nome sul pannello dello scambiatore"
        descrizione: "Lo scambiatore si accende quando il bambino dice la parola. Da qualche parte, sotto la grata, la macchina tiene scritto chi la comanda. Bisogna metterci le mani mentre è rovente."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il registro
          testo: |
            Sollevi la grata con le maniche tirate sulle mani, e sotto c'è un
            pannello di vetro con una fila di segni che si accendono a ogni
            parola del bambino. Li confronti con il suono finché non tornano.
            *Nan'Ireth.* Lo dici ad alta voce, e lo scambiatore risponde
            accendendosi tutto, mentre il bambino si gira stupito verso di te
            con la tua faccia e si sfilaccia.

            Sul tavolo resta una piastrina tiepida con la mano aperta. Sotto
            il pannello c'è un nucleo che batte ancora, e lo stacchi.
          pe: { tecnologia: 5 }
          effetti: { misura.forno: 1, oggetto.forno-della-nonna-piastrina: 1, parte.nucleo-3: 1, reperto.sigillato: 1, reliquie.frammento-inciso: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La grata rovente
          testo: |
            La grata ti si incolla alle maniche e poi alla pelle sotto, e la
            luce rossa ti esplode negli occhi. Quando riesci a staccarti la
            foschia si è alzata dal tavolo, alta fino al soffitto. Scappi su
            per la scala con le mani bruciate e risali nella camera di sopra
            senza il nome.
          effetti: { ferite: 2, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Ordinare allo scambiatore di chiamare il suo operatore"
        descrizione: "Il Comando parla alle macchine nella loro lingua. Lo scambiatore lavora da sempre per qualcuno, e se glielo si ordina lo chiama per nome."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La chiamata
          testo: |
            Dici la formula rivolto allo scambiatore, e la luce rossa si
            ferma. Poi la macchina parla, con una voce che sale dal pavimento
            e ti passa nelle ossa, e dice una parola sola. *Nan'Ireth.* Il
            bambino si alza dalla sedia e si gira verso la voce, come quando
            una madre chiama dalla finestra, e si sfilaccia nella foschia.

            Sul tavolo resta una piastrina tiepida con la mano aperta. Nella
            grata trovi un nucleo che batte ancora.
          pe: { magia: 5 }
          effetti: { misura.forno: 1, oggetto.forno-della-nonna-piastrina: 1, parte.nucleo-3: 1, reperto.sigillato: 1, reliquie.frammento-inciso: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La voce sbagliata
          testo: |
            La formula ti si rompe in gola, e lo scambiatore risponde con il
            tuo nome invece del suo. Il bambino si gira verso di te con la
            tua faccia e sorride. Risali la scala correndo, e per molte notti
            senti chiamare il tuo nome dal fondo del letto.
          effetti: { tormento: 2, ferite: 0.5 }
          vai: superficie-fratturata
      - testo: "Vegliare la memoria come si vegliano i morti"
        descrizione: "Al Velo i morti si vegliano con le parole della veglia, perché sappiano chi erano prima di andarsene. Questa memoria l'ha dimenticato."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [empatia, accademiche], difficolta: Difficile }
        successo:
          titolo: La veglia
          testo: |
            Ti inginocchi accanto al tavolo e dici le parole della veglia,
            quelle che in Cattedrale si dicono la prima notte, a voce bassa.
            Quando arrivi al punto in cui si chiede il nome del morto, il
            bambino risponde. *Nan'Ireth.* La luce dello scambiatore si
            accende tutta, e il bambino si sfilaccia nella foschia con la
            testa china, come alla fine di una preghiera.

            Sul tavolo resta una piastrina tiepida con la mano aperta. Nella
            grata trovi un nucleo che batte ancora.
          pe: { empatia: 5 }
          effetti: { misura.forno: 1, oggetto.forno-della-nonna-piastrina: 1, parte.nucleo-3: 1, reperto.sigillato: 1, reliquie.frammento-inciso: 1, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La veglia interrotta
          testo: |
            A metà veglia perdi le parole, e il bambino le finisce al posto
            tuo, con la tua voce, sbagliandole tutte. La foschia si alza dal
            tavolo. Risali nella camera di sopra con le ginocchia sbucciate e
            la veglia che ti gira in testa al contrario.
          effetti: { tormento: 2, contaminazione: 0.5 }
          vai: superficie-fratturata
      - testo: "Risalire senza disturbarlo"
        descrizione: "Il bambino non ti ha chiesto niente. La scala è alle tue spalle."
        costo: 0
        esito:
          titolo: Il carbone buono
          testo: |
            Lasci il bambino al suo tavolo e risali tutta la scala senza
            voltarti. Nella camera di sopra appoggi un pezzo di carbone sulla
            sporgenza della parete di fondo, accanto a quelli dei carbonai.
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo · il tavolo apparecchiato
  - id: forno-della-nonna-il-tavolo-apparecchiato
    immagine: ambientazione/marea-grigia
    titolo: Il tavolo apparecchiato
    sommario: "Il bambino è tornato al tavolo, con una faccia nuova. Lo scambiatore batte più piano, e nella grata si è raccolto quello che la macchina perde."
    luogo: Il Forno della Nonna, la stanza calda
    area: forno-della-nonna
    ripetibile: true
    requisiti: [profondita.forno-della-nonna >= 4, misura.forno >= 1]
    testo: |
      Il bambino è di nuovo al tavolo, fatto di foschia, con la faccia di un
      carbonaio che non conosci. Quando entri alza gli occhi e muove le
      labbra, ma la parola adesso gli esce a metà, come se l'avessi presa tu
      e gliene fosse rimasto soltanto un pezzo. Sulla sedia vuota qualcuno ha
      lasciato un pezzo di carbone buono.

      {tecnologia Media} Lo scambiatore batte più piano dell'altra volta, e
      dalla grata cade una polvere di cristallo che si ammucchia sul
      pavimento. Senza il nome, la macchina si consuma un poco a ogni
      battito.
    opzioni:
      - testo: "Affrontare la memoria un'altra volta"
        descrizione: "Si alza ancora, anche senza il nome. È più debole, e lo scambiatore ha qualcosa da dare."
        combattimento: forno-della-nonna-tavolo
        vittoria:
          titolo: La polvere di cristallo
          testo: |
            La memoria si disfa sul tavolo, e il bambino resta con la faccia
            vuota a guardarti. Raccogli dalla grata quello che lo scambiatore
            ha perso, e quando sei sulla scala lo senti ricominciare a dire
            mezza parola.
          effetti: { parte.nucleo-2: 1, reperto.sigillato: 1, contaminazione: 0.5 }
          vai: superficie-fratturata
        sconfitta:
          titolo: La faccia presa
          testo: |
            La memoria ti mette le mani sulla faccia, e ti risvegli nella
            camera di sopra fra le ceneri, con la pelle grigia intorno agli
            occhi.
          effetti: { contaminazione: 0.5 }
          vai: superficie-fratturata
      - testo: "Dirgli il suo nome intero"
        descrizione: "Gli manca mezza parola, e tu ce l'hai. Gliela restituisci per un momento, e intanto prendi quello che la grata lascia cadere."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Difficile }
        successo:
          titolo: Il nome restituito
          testo: |
            Gli dici piano il nome intero, e il bambino lo ripete con te. Per
            il tempo di quella parola lo scambiatore si accende tutto, e dalla
            grata cade un nucleo che batte. Lo prendi, e quando ti volti il
            bambino ha di nuovo mezza parola sulle labbra.
          pe: { empatia: 2 }
          effetti: { parte.nucleo-2: 1, tormento: 0.5 }
          vai: superficie-fratturata
        fallimento:
          titolo: La parola che non torna
          testo: |
            Gli dici il nome, e il bambino lo ripete con la tua voce e poi ti
            chiede il tuo. Te ne vai prima di rispondere, e risali con la
            lingua che cerca una parola che non sai più.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Lasciargli il carbone e risalire"
        descrizione: "Hai già il suo nome. Lui ha ancora il suo tavolo."
        costo: 0
        esito:
          titolo: Il carbone sulla sedia
          testo: |
            Posi un pezzo di carbone accanto a quello sulla sedia vuota e
            risali. Nella camera di sopra le pareti sono tiepide come sempre.
          vai: superficie-fratturata

