# L'Anello del Camminatore, spedizione dei luoghi neri (docs/piano-superficie.md, «Le nove spedizioni dei luoghi
# neri»). Nove pietre nere ai margini del Rovolungo, tre giorni a nord-ovest di Qir-Azel (codex sf-anello-del-camminatore):
# dentro il cerchio l'erba non cresce e gli animali girano. Sotto c'è il quadrante, un disco di metallo grande come
# una piazza che gira da prima della Caduta, e il Camminatore, la macchina che lo spinge camminandoci sopra.
# Le nove pietre sono nove tasti, e ognuna porta il segno di uno dei nove luoghi neri. Nessun testo lo spiega: chi
# gioca vede i segni, e qualcuno lo riconosce (le sette righe delle Stele, i tre punti dei Tamburi).
#
# Ingresso `anello-del-camminatore-il-cerchio` (Superficie, ripetibile, traccia.anello >= 3): due vie con prova
# (chi fallisce resta fuori dal cerchio), il cavallo a costo 0, la corda del mandriano a costo 2.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
#   0 le nove pietre, il cane che gira;
#   1 la scala che gira;
#   1–3 le trottole (combattimento contro due gregari);
#   2 i pozzi dei tasti, il corridoio che torna;
#   3 le ossa in tondo, l'orlo del quadrante.
# Il cuore a 4 è il quadrante (`anello-del-camminatore-il-quadrante`, misura.anello == 0): il Camminatore (boss),
# oppure la sbarra fra i denti (Tecnologia), il Comando, il passo accanto a lui (Resilienza o Percezione), tutte
# Difficili; per il Figlio del Circolo il passo si conta come quello del cervo (Natura, Difficile). La vittoria dà
# misura.anello, il Perno del quadrante e parti dei Precursori; chi fallisce torna in Superficie senza misura.
# Dopo, `anello-del-camminatore-il-quadrante-riparte` (ripetibile, misura.anello >= 1) rende meno.
#
# L'ordine delle nove pietre, cioè la misura dell'Anello (per chi scrive la Campana Sepolta). Ogni pietra ha il
# segno di un luogo, e il quadrante le accende una dopo l'altra in quest'ordine:
#   1 il cerchio (l'Anello stesso), 2 la porta (Soglia di Mara), 3 la mano aperta (Forno della Nonna),
#   4 la riga fra due onde (Spina dell'Eco), 5 l'occhio (Lente del Sornione), 6 la punta (Volta dell'Aculeo),
#   7 i tre punti (Tamburi di Fondo), 8 le sette righe (Stele dei Naviganti), 9 l'arco curvo (Costola di Drago).
# Si comincia da qui, si entra, ci si fa riconoscere, si chiama, si danno l'ora, la data, il conto e la direzione,
# e per ultima si batte la nota. Nella prosa l'ordine si legge per segni, senza dire a che cosa servono.
aree:
  - id: anello-del-camminatore
    immagine: ambientazione/rovine-dei-precursori
    nome: L'Anello del Camminatore
    sommario: "Nove pietre nere ai margini del Rovolungo, e sotto un disco di metallo che gira da prima della Caduta."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      La roccia sotto il disco è scavata a cerchi concentrici, con pareti di
      metallo caldo che corrono tutte in curva. Dal centro arriva un rumore
      di metallo su metallo, lento come il passo di una bestia da soma, e
      quando ti fermi il corpo continua a girare per conto suo verso destra.

colonna:
  - { contesto: area, id: anello-del-camminatore, musica: unsettling-paths, ambiente: cave }

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: anello-del-camminatore-il-cerchio
    immagine: ambientazione/rovolungo
    titolo: Il cerchio dei cani
    sommario: "Ai margini del Rovolungo nove pietre nere circondano un disco di terra dove l'erba non cresce."
    luogo: Superficie Fratturata, ai margini del Rovolungo
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.anello >= 3]
    testo: |
      Il terzo giorno di marcia verso nord-ovest, sul bordo della macchia
      scura del Rovolungo, trovi nove pietre nere alte fino al ginocchio,
      piantate in un cerchio largo quanto un'aia intorno a un disco di terra
      nuda. In cima a ogni pietra è inciso un segno, un arco come una costola
      o tre punti in fila.

      {natura Media} Intorno ci passano le lepri, e nessuna traccia entra nel
      disco.

      {origine figlio-del-circolo} Al Circolo i bambini imparano presto a
      riconoscere i posti dove le bestie non entrano, e qui i piedi ti si
      fermano da soli.
    opzioni:
      - testo: "Attraversare il cerchio contando i passi"
        descrizione: "Dal bordo al centro sono dieci passi, e il cane del mandriano ha perso il conto."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Dieci passi
          testo: |
            Conti a mezza voce, e dal quarto passo il corpo comincia a tirarti
            verso destra. Correggi contando più forte, e al decimo sei nel mezzo,
            dove sotto un palmo di polvere c'è una lastra di metallo che si
            abbassa appena ci metti il peso.
          pe: { resilienza: 2 }
          vai: anello-del-camminatore
        fallimento:
          titolo: Il giro largo
          testo: |
            Al sesto passo perdi il conto, e quando lo ritrovi sei di nuovo sul
            bordo, con le gambe che hanno fatto un giro intero senza chiederti il
            permesso.
          effetti: { tormento: 0.5 }
      - testo: "Scavare sotto la pietra più annerita"
        descrizione: "Una pietra è più nera delle altre, come se ci avessero acceso il fuoco contro."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il cunicolo
          testo: |
            Accanto alla pietra più nera, a un braccio di profondità, trovi una
            parete di metallo, e scavando di lato un'apertura stretta come una
            tana di tasso. Dall'altra parte un corridoio scende curvando.
          pe: { atletica: 2 }
          vai: anello-del-camminatore
        fallimento:
          titolo: La pala che gira
          testo: |
            Il manico della pala ti ruota fra le mani come una vite e alla fine ti
            sfugge, battendoti sullo zigomo. Sotto la pietra c'è soltanto terra.
          effetti: { ferite: 0.5 }
      - testo: "Guardare dove si ferma il cavallo"
        descrizione: "Un cavallo si ferma prima di entrare dove le bestie girano, e sa dove fermarsi."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il cavallo puntato
          testo: |
            Portato intorno al cerchio, il cavallo si ferma da solo davanti alla
            pietra del cerchio e guarda il centro a muso basso. Vai dove guardava
            lui, e sotto un palmo di polvere trovi una lastra di metallo che si
            abbassa appena ci sali sopra.
          vai: anello-del-camminatore
      - testo: "Legarsi una corda in vita, come il mandriano"
        descrizione: "Una corda legata a un rovo fuori dal cerchio ti riporta indietro se cominci a girare."
        costo: 2
        esito:
          titolo: La corda
          testo: |
            Leghi la corda a un rovo e alla cintura. Tre volte la corda ti riporta
            al bordo, finché impari a tenerla tesa e arrivi al centro, dove una
            lastra di metallo si abbassa sotto i tuoi piedi.
          effetti: { tormento: 0.5 }
          vai: anello-del-camminatore

  # ------------------------------------------------------------ 0 · le nove pietre e il cane
  - id: anello-del-camminatore-le-nove-pietre
    immagine: ambientazione/rovine-dei-precursori
    titolo: Sotto le nove pietre
    sommario: "Sotto il cerchio c'è una sala rotonda, e dal soffitto scendono le radici delle nove pietre."
    luogo: L'Anello del Camminatore, la sala sotto il cerchio
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore == 0]
    testo: |
      La lastra si ferma in una sala rotonda, dove dal soffitto scendono
      nove cilindri di pietra nera, uno sotto ogni pietra del prato e con lo
      stesso segno. La grata che chiude la discesa ha sopra il cerchio, e il
      cilindro del cerchio è più basso degli altri di un dito, con il
      pavimento sotto consumato a forma di piede.

      {tecnologia Media} Sono tasti, che si premono dall'alto quando
      qualcuno cammina sul prato.
    opzioni:
      - testo: "Premere il cilindro del cerchio"
        descrizione: "È più basso degli altri, e qualcuno ci ha messo i piedi sotto molte volte."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La grata
          testo: |
            Ti metti dove il pavimento è consumato e spingi il cilindro verso
            l'alto. Sale di un dito con uno scatto, e la grata scorre dentro la
            parete, aprendo il corridoio che scende.
          pe: { tecnologia: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: Il cilindro sbagliato
          testo: |
            Spingi il cilindro del cerchio e si muove quello accanto. La sala fa
            mezzo giro su se stessa con un ronzio basso, e quando si ferma la
            grata è dalla parte opposta.
          effetti: { tormento: 1 }
      - testo: "Forzare la grata con il coltello"
        descrizione: "Le grate si forzano, ma questa ha le sbarre fitte."
        prova: { attributo: fisico, abilita: [atletica, armi-da-mischia], difficolta: Media }
        successo:
          titolo: Il bordo
          testo: |
            Fai leva con la lama fra la grata e lo stipite, e alla terza spinta la
            grata cede di un palmo con un sospiro d'aria calda. Ti ci infili di
            fianco, verso il corridoio che scende.
          pe: { atletica: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: La lama storta
          testo: |
            La grata non si muove, e la lama si piega con un rumore secco. Il
            contraccolpo ti apre il palmo sulla base del pollice.
          effetti: { ferite: 0.5 }
      - testo: "Passare dalla fessura sopra la grata"
        descrizione: "Fra la grata e il soffitto passa un corpo magro, se si arrampica su un cilindro."
        costo: 2
        esito:
          titolo: La fessura
          testo: |
            Ti arrampichi sul cilindro più vicino come su un palo della cuccagna,
            passi di spalle dalla fessura sopra la grata e atterri male su una
            caviglia. Il corridoio scende da lì.
          effetti: { profondita.anello-del-camminatore: 1, ferite: 0.5 }

  - id: anello-del-camminatore-il-cane-che-gira
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il cane che gira
    sommario: "In una sala bassa un cane magro gira in tondo sullo stesso cerchio, e non si ferma quando lo chiami."
    luogo: L'Anello del Camminatore, una sala bassa
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore == 0]
    testo: |
      Nella sala accanto un bastardo grigio pelle e ossa gira sempre sullo
      stesso cerchio, e nella polvere ha già scavato un solco profondo un
      dito. Oltre il suo cerchio una rampa scende.

      {addestrare-animali Media} Ha paura di fermarsi. Lo fermerebbe la voce
      del suo padrone, e da come ti guarda potresti esserlo anche tu.
    opzioni:
      - testo: "Fermarlo con la voce e con le mani"
        descrizione: "Un cane che gira da giorni aspetta qualcuno che gli dica di smettere."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: Seduto
          testo: |
            Ti accucci sul bordo del suo cerchio e lo chiami basso, come se avessi
            in tasca un pezzo di formaggio. Al quarto giro ti viene a sedere contro
            il ginocchio, tremando. Ti segue fino alla rampa e lì si sdraia.
          pe: { addestrare-animali: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: Il morso
          testo: |
            Allunghi la mano per prenderlo, e lui ti morde senza nemmeno guardarti
            e riprende il giro. Ti restano sul dorso della mano i segni di quattro
            denti.
          effetti: { ferite: 0.5 }
      - testo: "Sollevarlo di peso e portarlo via"
        descrizione: "È pelle e ossa, e lo si porta via in braccio."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il peso morto
          testo: |
            Lo prendi al volo mentre passa, e lui scalcia per tutta la sala con
            una forza che un cane così magro non dovrebbe avere. In cima alla
            rampa smette di colpo e ti lecca il mento.
          pe: { atletica: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: Il giro con lui
          testo: |
            Appena entri nel suo cerchio cominci a girare anche tu, e fai tre giri
            con il cane stretto al petto prima di buttarti fuori su un fianco.
          effetti: { tormento: 1 }
      - testo: "Lasciarlo girare e prendere la rampa"
        descrizione: "Non puoi salvare tutto quello che trovi qui sotto. La rampa è libera."
        costo: 2
        esito:
          titolo: Il rumore delle zampe
          testo: |
            Prendi la rampa rasente al muro senza voltarti, e anche quando non
            senti più le sue zampe continui a contarle.
          effetti: { profondita.anello-del-camminatore: 1, tormento: 1 }

  # ------------------------------------------------------------ 1 · la scala che gira
  - id: anello-del-camminatore-la-scala-che-gira
    immagine: ambientazione/rovine-dei-precursori
    titolo: La scala che gira
    sommario: "Una scala a chiocciola scende intorno a un pozzo, con i gradini che ruotano piano sotto i piedi."
    luogo: L'Anello del Camminatore, la scala a chiocciola
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore == 1]
    testo: |
      Il corridoio finisce su un pozzo, e intorno scende una scala a
      chiocciola senza ringhiera, con ogni gradino che gira lento su se
      stesso a una velocità diversa.

      {acrobazia Media} Se scendi contro il loro giro, i piedi trovano
      l'appoggio da soli.
    opzioni:
      - testo: "Scendere a passi corti, contro il giro"
        descrizione: "Un piede alla volta, sempre contro il verso dei gradini. Ci vuole equilibrio."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Contro il giro
          testo: |
            Scendi un gradino alla volta, con la mano sulla parete e i piedi che
            si oppongono al giro come su una barca che rolla, e a metà ti accorgi
            che canticchi per tenere il tempo.
          pe: { acrobazia: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: Il gradino veloce
          testo: |
            Un gradino più svelto degli altri ti porta via il piede, e scivoli sul
            fianco per cinque o sei gradini. Risali al corridoio con il gomito
            sbucciato.
          effetti: { ferite: 0.5 }
      - testo: "Scendere a occhi chiusi, contando"
        descrizione: "La testa la fanno girare gli occhi, e a occhi chiusi restano i piedi a contare."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Al buio
          testo: |
            Chiudi gli occhi e scendi contando, con la parete sotto il palmo, e
            senza vederli i gradini sono soltanto un pavimento che si muove un
            poco. Al centoventesimo il piede trova il fondo.
          pe: { resilienza: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: Gli occhi aperti
          testo: |
            A metà apri gli occhi, e il pozzo ti gira intorno come l'acqua in un
            imbuto. Risali a gattoni finché il corridoio non è di nuovo dritto.
          effetti: { tormento: 1 }
      - testo: "Calarsi con la corda nel pozzo"
        descrizione: "La scala gira, mentre il pozzo è fermo."
        costo: 2
        esito:
          titolo: La corda nel pozzo
          testo: |
            Leghi la corda all'ultimo gradino fermo e ti cali nel vuoto centrale.
            La corda finisce prima del fondo, e l'ultimo tratto lo fai saltando
            nel buio.
          effetti: { profondita.anello-del-camminatore: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1–3 · le trottole
  - id: anello-del-camminatore-le-trottole
    immagine: bestiario/salvaguardia-precursori
    titolo: Le trottole
    sommario: "In un corridoio largo due trottole di metallo girano sulla punta, e quando passi si muovono."
    luogo: L'Anello del Camminatore, un corridoio largo
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore >= 1, profondita.anello-del-camminatore <= 3]
    testo: |
      In mezzo al corridoio girano due trottole di metallo grandi come la testa di
      un cane, in equilibrio sulla punta, con una corona di lame sul bordo. Quando
      fai un passo avanti, si spostano insieme di un passo verso di te.

      {armi-da-mischia Media} Girano verso destra, e il punto debole è la punta.
      Si colpiscono da sinistra, contro il filo delle lame.
    opzioni:
      - testo: "Abbattere le trottole"
        descrizione: "Due, con le lame sul bordo. Si colpiscono da sinistra, alla punta."
        combattimento: anello-del-camminatore-trottole
        vittoria:
          titolo: Le punte
          testo: |
            La seconda trottola si inclina e rotola sul fianco, e gira ancora un
            poco per terra, come una moneta.
          effetti: { profondita.anello-del-camminatore: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: I graffi in tondo
          testo: |
            Le trottole ti tagliano le gambe a strisce finché non arretri fino
            alla curva del corridoio, poi tornano al loro posto a girare sulla
            punta.
      - testo: "Passare quando girano lontano"
        descrizione: "Si spostano insieme. Se una va da una parte, anche l'altra ci va."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il passo laterale
          testo: |
            Fai qualche passo a destra e le trottole ti seguono fino alla parete.
            Allora scatti a sinistra, e quando si girano sei già oltre la curva.
          pe: { furtivita: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: La lama sullo stinco
          testo: |
            Scatti troppo presto, e una delle due ti taglia la strada aprendoti lo stivale e la pelle
            sotto. Torni indietro zoppicando fino alla curva.
          effetti: { ferite: 0.5 }
      - testo: "Prendere il condotto basso sotto il corridoio"
        descrizione: "Sotto il pavimento c'è un condotto stretto e caldo, dove le trottole non arrivano."
        costo: 2
        esito:
          titolo: Il condotto caldo
          testo: |
            Sollevi una piastra del pavimento e strisci nel condotto, caldo come
            una stalla d'inverno, mentre sopra di te il ronzio delle trottole
            passa e ripassa.
          effetti: { profondita.anello-del-camminatore: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · i pozzi dei tasti e il corridoio che torna
  - id: anello-del-camminatore-i-pozzi-dei-tasti
    immagine: ambientazione/rovine-dei-precursori
    titolo: I pozzi dei tasti
    sommario: "Nove pozzi verticali in fila curva, ognuno con un pistone e un segno."
    luogo: L'Anello del Camminatore, la galleria dei pozzi
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore == 2]
    testo: |
      Lungo la galleria si aprono nove pozzi verticali, e in ognuno scende un
      pistone di metallo nero con un segno sulla testa. Riconosci il cerchio
      e i tre punti delle pietre di sopra, più avanti una punta e un occhio,
      e su un pistone sette righe in fila. Dal fondo di ogni pozzo un'asta va
      verso il centro.

      {accademiche Difficile} Sette colonne in fila oltre la Foresta
      Strisciante, e tre colpi sotto il guado nord della Palude Acquanera. Ti
      tornano in mente i nomi neri dei registri della Biblioteca, e il conto
      torna fin troppo.
    opzioni:
      - testo: "Seguire le aste fino a dove vanno"
        descrizione: "Le nove aste vanno tutte nello stesso posto, e basta seguirne una."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Le nove aste
          testo: |
            Segui l'asta del cerchio lungo un condotto basso, e una per una le
            altre otto la raggiungono come affluenti di un fiume, fino a un giunto
            grosso come un barile oltre il quale c'è una rampa.
          pe: { tecnologia: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: Il pistone che scende
          testo: |
            Ti infili in un pozzo, e il pistone sopra la tua testa scende di colpo
            di un braccio, perché qualcuno sul prato ha calpestato una pietra.
            Esci con la giubba strappata sulla spalla.
          effetti: { ferite: 0.5 }
      - testo: "Ricopiare i nove segni"
        descrizione: "Qualcuno alla Biblioteca saprà che farne, se li porti fuori interi."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Nove segni
          testo: |
            Ricopi i segni uno per pozzo, e al settimo ti accorgi che l'ordine dei
            pozzi non è quello delle pietre di sopra. Lo scrivi a margine e prendi
            la rampa.
          pe: { accademiche: 2 }
          effetti: { profondita.anello-del-camminatore: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: I segni che girano
          testo: |
            Ricopi i segni, e quando rileggi il quaderno sono capovolti, tutti
            tranne il cerchio. Ci riprovi, e si capovolgono di nuovo.
          effetti: { tormento: 1 }
      - testo: "Strisciare sotto le aste fino in fondo"
        descrizione: "Ci si passa sotto, piano, sperando che sul prato non passi nessuno."
        costo: 2
        esito:
          titolo: Sotto le aste
          testo: |
            Strisci sotto le aste lungo tutta la galleria, con la faccia sul
            metallo tiepido. A metà un'asta scende di un dito sopra la tua schiena
            e risale, e in fondo trovi la rampa.
          effetti: { profondita.anello-del-camminatore: 1, tormento: 1 }

  - id: anello-del-camminatore-il-corridoio-che-torna
    immagine: ambientazione/marea-grigia
    titolo: Il corridoio che torna
    sommario: "Un corridoio curvo scende verso il centro, e dopo un giro ti ritrovi davanti alla stessa macchia."
    luogo: L'Anello del Camminatore, il corridoio a spirale
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore == 2]
    testo: |
      Il corridoio scende in spirale verso destra. All'altezza della spalla
      c'è una macchia scura, come l'impronta di una mano unta, e dopo un
      giro intero la macchia è di nuovo lì e combacia con la tua mano.

      {percezione Media fallita} Ti sembra di scendere, ma le ginocchia
      dicono di no, e sulle discese di solito non mentono.
    opzioni:
      - testo: "Cercare la pendenza vera"
        descrizione: "Da qualche parte il corridoio scende davvero, e il pavimento lo sa."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La biglia
          testo: |
            Posi a terra un sasso rotondo, che rotola contro la spirale fino a una
            giuntura nella parete esterna. La spingi, e dietro c'è una scala
            dritta che scende davvero.
          pe: { percezione: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: La terza volta
          testo: |
            Alla terza volta che trovi la macchia ti accorgi che il segno della
            tua mano adesso è fresco, e torni indietro di corsa fino all'inizio
            del corridoio.
          effetti: { tormento: 1 }
      - testo: "Correre contro il verso della spirale"
        descrizione: "Se il corridoio ti riporta indietro, si va nel verso opposto, e in fretta."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Controcorrente
          testo: |
            Corri contro la curva, e il corridoio si fa pesante come una salita
            dopo pranzo, finché la parete si apre su un passaggio dritto in
            discesa.
          pe: { atletica: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: Il fiato corto
          testo: |
            Corri finché le gambe ti reggono, e quando ti fermi la macchia è
            davanti a te, all'altezza della spalla. Torni indietro con un crampo
            che ti morde il polpaccio.
          effetti: { ferite: 0.5 }
      - testo: "Segnare la parete con il gesso a ogni passo"
        descrizione: "Una riga di gesso ogni dieci passi, e se torni su una riga lo sai subito."
        costo: 2
        esito:
          titolo: Il gesso
          testo: |
            Tracci e numeri una riga di gesso ogni dieci passi. Le righe tornano
            con un numero sempre più alto, come se qualcuno le ricopiasse avanti a
            te, e alla trentesima trovi una giuntura con dietro una scala dritta.
          effetti: { profondita.anello-del-camminatore: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · le ossa in tondo e l'orlo del quadrante
  - id: anello-del-camminatore-le-ossa-in-tondo
    immagine: ambientazione/marea-grigia
    titolo: Le ossa in tondo
    sommario: "Su un pianerottolo le ossa di molte bestie stanno in fila lungo un cerchio, e in mezzo c'è un uomo."
    luogo: L'Anello del Camminatore, il pianerottolo delle ossa
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore == 3]
    testo: |
      Lungo un cerchio tracciato nel metallo ci sono le ossa di molte bestie,
      perfino due capre con le corna, tutte in fila con il muso nello stesso
      verso, come se fossero cadute camminando. In mezzo c'è anche un uomo
      con una bisaccia a tracolla. Oltre il cerchio una rampa scende.

      {empatia Media} Era un mandriano, e ha seguito le sue bestie fin qui.
      Il cane gli sta ai piedi, dove stanno i cani buoni.
    opzioni:
      - testo: "Capire da dove passa il cerchio"
        descrizione: "Le bestie sono morte sulla stessa linea, e bisogna vederla per non calpestarla."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: La linea
          testo: |
            Da come sono cadute le bestie la linea viene fuori da sola, un graffio
            più chiaro nel metallo, e la scavalchi con un passo lungo. Nella
            bisaccia del mandriano c'è un frammento di metallo inciso, e lo prendi
            chiedendogli scusa.
          pe: { natura: 2 }
          effetti: { profondita.anello-del-camminatore: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il passo storto
          testo: |
            Metti il piede sulla linea senza vederla, e le gambe cominciano a
            portarti lungo il cerchio dietro alle capre. Ti butti di lato e
            finisci sulle ossa, che si rompono sotto di te.
          effetti: { tormento: 1 }
      - testo: "Attraversare in fretta tenendo la testa ferma"
        descrizione: "Si attraversa guardando un punto solo, senza pensare alle bestie."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Un punto solo
          testo: |
            Fissi l'imbocco della rampa e ci vai dritto contando i passi. Sulla
            linea le gambe tirano piano verso destra, e le lasci tirare senza
            ascoltarle.
          pe: { resilienza: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: La fila
          testo: |
            A metà ti scappa lo sguardo sulle capre, e i piedi ti portano in fila
            con loro per mezzo giro prima che tu riesca a sederti e a tornare
            fuori strisciando.
          effetti: { tormento: 1 }
      - testo: "Fare il giro largo lungo la parete"
        descrizione: "Lontano dalle ossa, rasente al muro rovente."
        costo: 2
        esito:
          titolo: Il muro rovente
          testo: |
            Fai il giro con la schiena contro la parete, calda come un forno di
            pane, e alla rampa arrivi con una scottatura sulle scapole.
          effetti: { profondita.anello-del-camminatore: 1, ferite: 0.5 }

  - id: anello-del-camminatore-l-orlo-del-quadrante
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'orlo del quadrante
    sommario: "La rampa finisce sul bordo di un disco di metallo grande come una piazza, che gira lento."
    luogo: L'Anello del Camminatore, l'orlo del quadrante
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore == 3]
    testo: |
      La rampa finisce su una cengia, e un braccio più in basso gira il
      quadrante, un disco di metallo grande come una piazza, con un rumore
      di macina. Lungo il bordo passano nove placche alte quanto un uomo,
      ognuna con il segno di una pietra, e al centro qualcosa di alto si
      muove in tondo.

      {atletica Media} Il bordo va più svelto del centro, e chi salta giù
      deve correre nel suo verso, come si scende da un carro in movimento.
    opzioni:
      - testo: "Saltare sul disco e correre con lui"
        descrizione: "Si atterra correndo su un pavimento che gira, nel suo verso."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il salto
          testo: |
            Salti dietro una placca e atterri correndo finché non trovi il passo,
            poi cammini verso il centro lungo una delle linee incise.
          pe: { atletica: 2 }
          effetti: { profondita.anello-del-camminatore: 1 }
        fallimento:
          titolo: La placca
          testo: |
            Salti nel momento sbagliato, e la placca che arriva ti butta contro la
            cengia, lasciandoti il braccio che non si alza oltre la testa.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare la placca giusta e salirci sopra"
        descrizione: "Una delle placche ha una sporgenza dove sta un piede, e il tempo per salirci è poco."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il gradino del cerchio
          testo: |
            Al terzo giro vedi che la placca del cerchio ha sul retro un gradino
            consumato. Ci metti il piede quando passa, e una fila di appigli ti
            cala sul disco dalla parte del centro.
          pe: { percezione: 2 }
          effetti: { profondita.anello-del-camminatore: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il gradino sbagliato
          testo: |
            Metti il piede sulla placca sbagliata e scivoli giù lungo il metallo
            fino al disco, sbattendo il mento. Risali sulla cengia con il sapore
            del sangue in bocca.
          effetti: { ferite: 0.5 }
      - testo: "Calarsi sul disco con la corda e lasciarsi trascinare"
        descrizione: "Una corda dalla cengia, e il disco ti trascina finché non molli."
        costo: 2
        esito:
          titolo: Trascinato
          testo: |
            Ti cali con la corda e lasci che il disco ti trascini. Quando molli
            rotoli su una linea che va verso il centro, e la segui carponi con la
            testa che gira.
          effetti: { profondita.anello-del-camminatore: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · il quadrante
  - id: anello-del-camminatore-il-quadrante
    immagine: bestiario/salvaguardia-precursori
    titolo: Il quadrante
    sommario: "Al centro del disco una macchina alta il doppio di un uomo spinge il quadrante con i suoi passi."
    luogo: L'Anello del Camminatore, il centro del quadrante
    area: anello-del-camminatore
    requisiti: [profondita.anello-del-camminatore >= 4, misura.anello == 0]
    testo: |
      Al centro del quadrante, intorno a un mozzo largo quanto un'aia,
      cammina il Camminatore, una macchina alta il doppio di un uomo che su
      tre gambe, in un solco profondo fino al polpaccio, spinge una sbarra
      infilata nel mozzo. Sul mozzo ci sono i nove segni delle pietre, ognuno
      con una lastra di vetro scuro che si scalda quando lui ci passa
      davanti, in un ordine diverso da quello del giro.

      {tecnologia Difficile} Se il Camminatore si ferma, le lastre restano
      accese nell'ordine giusto.

      Il Camminatore gira la testa verso di te senza fermarsi.
    opzioni:
      - testo: "Fermare il Camminatore"
        descrizione: "Ha camminato tutta la vita, e non ha mai dovuto difendersi."
        combattimento: anello-del-camminatore-quadrante
        vittoria:
          titolo: L'ordine delle pietre
          testo: |
            Il Camminatore cade su un ginocchio come una campana incrinata, e il
            quadrante si ferma. Prima si accende il cerchio. Seguono la porta e la
            mano aperta, poi la riga fra due onde. Poi l'occhio e la punta, e
            infine i tre punti e le sette righe. L'ultima è l'arco curvo come una
            costola. Ricopi l'ordine sul quaderno e prendi il perno del ginocchio
            con quel che resta dei pannelli.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.anello: 1, oggetto.anello-del-camminatore-perno: 1, parte.impugnatura-3: 1, reliquie.frammento-inciso: 2, bottino.parti-di-drone: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Nel solco
          testo: |
            Il Camminatore ti spinge nel solco con un braccio, e la gamba che
            viene dopo ti passa sopra. Per due giorni, quando chiudi gli occhi, il
            letto ti gira verso destra.
          effetti: { tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Infilare la sbarra fra i denti del mozzo"
        descrizione: "Se una sbarra blocca i denti del mozzo fra un passo e l'altro, il Camminatore si ferma."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La sbarra
          testo: |
            Fra un passo e l'altro infili la sbarra fra due denti del mozzo, e il
            quadrante si blocca. Prima si accende il cerchio. Seguono la porta e
            la mano aperta, poi la riga fra due onde. Poi l'occhio e la punta, e
            infine i tre punti e le sette righe. L'ultima è l'arco curvo come una
            costola. Ricopi l'ordine sul quaderno e raccogli il perno, saltato dal
            ginocchio nel contraccolpo.
          pe: { tecnologia: 5 }
          effetti: { misura.anello: 1, oggetto.anello-del-camminatore-perno: 1, parte.impugnatura-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La sbarra che salta
          testo: |
            Infili la sbarra un passo troppo tardi, e il mozzo te la strappa di
            mano e te la scaglia sul petto. Il Camminatore non si ferma nemmeno, e
            risali al prato senza aver visto l'ordine.
          effetti: { ferite: 2, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ordinargli di fermarsi"
        descrizione: "Il Comando parla alle macchine dei Precursori, e a questa nessuno ha mai detto di smettere."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Fermo
          testo: |
            Dici la formula, e il Camminatore finisce il passo e si ferma come un
            mulo al richiamo. Prima si accende il cerchio. Seguono la porta e la
            mano aperta, poi la riga fra due onde. Poi l'occhio e la punta, e
            infine i tre punti e le sette righe. L'ultima è l'arco curvo come una
            costola. Poi si piega a porgerti il perno del ginocchio e si siede nel
            solco.
          pe: { magia: 5 }
          effetti: { misura.anello: 1, oggetto.anello-del-camminatore-perno: 1, parte.impugnatura-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La parola che gira
          testo: |
            La formula ti si avvita in bocca e ne esce rovesciata. Il Camminatore
            allunga il passo e il quadrante accelera fino a buttarti giù, e risali
            al prato con una parola sulla lingua che non sai dire.
          effetti: { tormento: 2, ferite: 1 }
          vai: superficie-fratturata
      - testo: "Camminargli accanto per un giro intero"
        descrizione: "Al suo passo, nel solco, le lastre si leggono una per volta."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Difficile }
        successo:
          titolo: Un giro intero
          testo: |
            Entri nel solco e cammini al suo passo, leggendo le lastre mentre si
            scaldano. Prima si scalda il cerchio. Seguono la porta e la mano
            aperta, poi la riga fra due onde. Poi l'occhio e la punta, e infine i
            tre punti e le sette righe. L'ultima è l'arco curvo come una costola.
            Quando esci il Camminatore ti lascia sul bordo il perno del ginocchio
            e riprende zoppicando.
          pe: { resilienza: 5 }
          effetti: { misura.anello: 1, oggetto.anello-del-camminatore-perno: 1, parte.impugnatura-3: 1, reliquie.frammento-inciso: 2, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il passo perso
          testo: |
            Al terzo segno perdi il passo e il solco ti prende, finché inciampi fuori molti
            giri dopo, senza l'ordine. Per giorni ti svegli in piedi accanto al letto.
          effetti: { tormento: 2 }
          vai: superficie-fratturata
      - testo: "Contare il suo passo come quello del cervo"
        descrizione: "Al Circolo si segue un cervo contando i suoi passi finché non sono anche i tuoi."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, resilienza], difficolta: Difficile }
        successo:
          titolo: Il passo del cervo
          testo: |
            Conti i suoi passi come nel Bosco, e al centesimo gli entri accanto
            nel solco. Prima si scalda il cerchio. Seguono la porta e la mano
            aperta, poi la riga fra due onde. Poi l'occhio e la punta, e infine i
            tre punti e le sette righe. L'ultima è l'arco curvo come una costola.
            Quando esci ti lascia il perno del ginocchio e riprende zoppicando.
          pe: { natura: 5 }
          effetti: { misura.anello: 1, oggetto.anello-del-camminatore-perno: 1, parte.impugnatura-3: 1, reliquie.frammento-inciso: 2, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il cervo che ti porta
          testo: |
            Conti, e a un certo punto ti accorgi che stai contando i tuoi passi,
            dentro il solco, dietro di lui. Ne esci cadendo molti giri dopo e
            senza l'ordine. Per giorni ti svegli in piedi accanto al letto.
          effetti: { tormento: 2 }
          vai: superficie-fratturata
      - testo: "Risalire senza toccare niente"
        descrizione: "Il Camminatore non ti ha chiesto niente. Il prato è in cima alla rampa."
        costo: 0
        esito:
          titolo: Il prato
          testo: |
            Torni verso l'orlo mentre il Camminatore continua il suo giro, e sul
            prato è sera. Le lepri arrivano al bordo del cerchio e girano.
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo · il quadrante che riparte
  - id: anello-del-camminatore-il-quadrante-riparte
    immagine: bestiario/salvaguardia-precursori
    titolo: Il quadrante che riparte
    sommario: "Il Camminatore zoppica di nuovo, e nel solco si ammucchia quello che il disco perde."
    luogo: L'Anello del Camminatore, il centro del quadrante
    area: anello-del-camminatore
    ripetibile: true
    requisiti: [profondita.anello-del-camminatore >= 4, misura.anello >= 1]
    testo: |
      Il Camminatore gira di nuovo intorno al mozzo, zoppo dalla gamba senza
      perno, e il quadrante va a scatti. A ogni scatto cadono pezzi di
      metallo che si ammucchiano nel solco, e le lastre si scaldano ancora
      nell'ordine che hai sul quaderno.
    opzioni:
      - testo: "Fermarlo un'altra volta"
        descrizione: "È zoppo, e nel solco c'è quello che il disco ha perso."
        combattimento: anello-del-camminatore-quadrante
        vittoria:
          titolo: Lo spazzino
          testo: |
            Il Camminatore si siede nel solco e il quadrante si ferma con un
            lamento lungo. Raccogli dal mucchio quello che si può portare via, e
            dalla rampa lo senti riprendere a zoppicare.
          effetti: { parte.impugnatura-2: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Nel solco
          testo: |
            Ti butta nel solco con un braccio, e il mucchio di metallo ti
            rotola addosso. Ne esci tagliato in dieci punti e risali al prato
            a mani vuote.
          effetti: { tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Raccogliere dal solco fra un passo e l'altro"
        descrizione: "Si prende dal mucchio quello che si può mentre la gamba è alzata."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Difficile }
        successo:
          titolo: Fra un passo e l'altro
          testo: |
            Aspetti che alzi la gamba zoppa, ti butti nel solco a prendere a piene
            mani e ne esci prima che la gamba torni giù. Lo fai tre volte, e lui
            non si volta nemmeno.
          pe: { acrobazia: 2 }
          effetti: { parte.involucro-2: 1, reliquie.scheggia: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La gamba che scende
          testo: |
            La gamba zoppa scende prima del previsto e ti pesta il piede. Ti
            liberi tirando, e risali al prato zoppo quanto lui.
          effetti: { ferite: 1 }
          vai: superficie-fratturata
      - testo: "Lasciarlo camminare e risalire"
        descrizione: "Hai già quello che ti serviva. Lui ha ancora il suo lavoro."
        costo: 0
        esito:
          titolo: Il lavoro
          testo: |
            Lo guardi fare un giro intero, con il quadrante che scatta a ogni
            passo zoppo, e poi risali al prato.
          vai: superficie-fratturata

nemici:
  - id: anello-del-camminatore-trottola
    immagine: bestiario/salvaguardia-precursori
    nome: Trottola del quadrante
    descrizione: "Una trottola di metallo grande come la testa di un cane, con una corona di lame sul bordo. Gira sulla punta senza mai cadere, e si sposta insieme alla sua compagna."
    attacco: 4
    difesa: 4
    difesaMentale: 5
    pf: 6
    danno: 3
    riduzione: 2
    iniziativa: 3

  - id: anello-del-camminatore-camminatore
    immagine: bestiario/salvaguardia-precursori
    nome: Il Camminatore
    descrizione: "Una macchina alta il doppio di un uomo, con tre gambe lunghe e un corpo stretto come una botte. Spinge il quadrante camminandoci sopra da prima della Caduta, e non ha mai dovuto fermarsi."
    attacco: 5
    difesa: 4
    difesaMentale: 5
    pf: 13
    danno: 4
    riduzione: 3
    iniziativa: 2

scontri:
  - { id: anello-del-camminatore-trottole, nome: "Le trottole del corridoio", nemici: [anello-del-camminatore-trottola, anello-del-camminatore-trottola], feriteSconfitta: 2 }
  - { id: anello-del-camminatore-quadrante, nome: "Il Camminatore", nemici: [anello-del-camminatore-camminatore], feriteSconfitta: 4 }

oggetti:
  - id: anello-del-camminatore-perno
    nome: Perno del quadrante
    immagine: icone/spinning-top
    descrizione: "Un cilindro di metallo grande come un pugno, preso dal ginocchio del Camminatore. Intorno a lui tutto può girare, e lui resta fermo. Chi lo tiene in tasca ritrova sempre il verso delle cose, e la testa gli gira meno."
    slot: accessorio
    grado: 3
    proprieta: { lucida: true, talento: { acrobazia: 1 } }
