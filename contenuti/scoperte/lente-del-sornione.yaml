# La Lente del Sornione (docs/piano-superficie.md, «Le nove spedizioni dei luoghi neri»). Un disco di vetro dei
# Precursori largo quattro metri, mezzo interrato in un campo oltre l'orlo nord del Gradone Rosso, accanto a un
# cascinale (codex sf-lente-del-sornione). Il disco è il tappo di una canna verticale larga come una torre: sotto
# c'è un occhio rivolto in alto che mostra il cielo com'era la notte del suono, con due stelle che oggi non ci sono.
# Ci si entra da `lente-del-sornione-il-campo` (Superficie, ripetibile, traccia.sornione >= 3).
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 la rampa sotto il vetro o la paratia brinata, 1 gli specchi o la stanza delle lastre, 2 gli occhi di guardia
# (scontro) o la stanza del turno, 3 il cerchio dei nove incavi o la ruota del ticchettio; il cielo sotto i
# piedi vale da 1 a 3.
# Il cuore a 4 è l'occhio (`lente-del-sornione-l-occhio`, misura.sornione == 0): il compasso che misura il cielo
# (boss), oppure copiare le stelle senza fare ombra (Difficile), il Comando, e per l'Allievo di Torvessa il conto
# delle ore sul quadrante. La vittoria dà misura.sornione, il Vetro delle due stelle (grado 3) e parti dei
# Precursori. Dopo, `lente-del-sornione-l-occhio-che-resta` (ripetibile, misura.sornione >= 1) rende meno.
# La misura, per chi scrive la Campana: nell'occhio la stella più grande è bianca e sta bassa sopra il nord-est,
# a un palmo dall'orlo; la più piccola, rossa, le sta sopra di due dita sulla stessa verticale. Sul quadrante
# intorno all'occhio le due stelle cadono sulla tacca dell'ultima ora prima dell'alba: è l'ora del suono.
# Il segno che lega i luoghi neri (fissato con le altre spedizioni): un cerchio di nove incavi con un incavo inciso
# più a fondo, e in quell'incavo il segno proprio del luogo, qui un occhio (lo stesso della quinta pietra
# dell'Anello). Dal centro parte un condotto verso nord-est, dove sta la Campana, che vibra con una nota bassa.
# Lo stesso cerchio è sotto la Soglia di Mara (la porta) e sotto la Spina dell'Eco (la riga fra due onde).
aree:
  - id: lente-del-sornione
    immagine: ambientazione/rovine-dei-precursori
    nome: La Lente del Sornione
    sommario: "Sotto il disco di vetro del campo c'è una canna di metallo larga come una torre, e una rampa che scende a spirale verso un occhio rivolto in alto."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Sotto il Sornione la terra è vuota. Il disco di vetro chiude in alto
      una canna di metallo grigio larga come una torre e profonda più di
      quanto la luce arrivi, e da sopra manda giù il chiarore azzurro di
      una notte di luna anche quando fuori è mezzogiorno. Sulle pareti si
      muovono piano le ombre di stelle che nel cielo vero non ci sono.

      Una rampa senza parapetto scende a spirale lungo la parete. Fa
      freddo, un freddo asciutto da cantina d'inverno, e dal fondo sale un
      ticchettio lento e regolare che non cambia mai passo.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: lente-del-sornione-il-campo
    immagine: ambientazione/gradone-rosso
    titolo: Il campo del Sornione
    sommario: "Oltre l'orlo nord del Gradone Rosso, dietro un cascinale, un disco di vetro mezzo affondato nel campo riflette un cielo di notte in pieno giorno."
    luogo: Superficie Fratturata, il cascinale oltre l'orlo nord del Gradone Rosso
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.sornione >= 3]
    testo: |
      Il cascinale sta su una gobba di terra rossa oltre l'orlo nord del
      Gradone Rosso, con il fienile appoggiato alla casa e un noce davanti
      all'aia. Dalla parte del campo le finestre sono murate, tutte, con
      mattoni più chiari del resto del muro. Il campo è lasciato a stoppie,
      e in mezzo c'è il Sornione.

      È un disco di vetro largo quattro metri, affondato per metà nella
      terra e inclinato verso nord, liscio come l'acqua di un catino. Il
      sole di mezzogiorno ci batte sopra e dentro il vetro è notte, una
      notte fitta di stelle che ti guarda dal basso.

      {percezione Media} Le stelle nel vetro non stanno dove le conosci.
      Due, vicine all'orlo dalla parte di nord-est, non le hai mai viste in
      nessun cielo, e brillano più delle altre.

      {origine allievo-di-torvessa} Orvald Temmerin tiene sul tavolo una
      lente dei Precursori grande come un'unghia e non lascia che nessuno
      la tocchi. Questa è larga come la sua aula, e nessuno l'ha mai
      chiusa a chiave.

      La contadina ti guarda dall'aia con il cane fra le ginocchia e non si
      avvicina. Lungo il bordo del disco, dove il vetro entra nella terra,
      la brina resiste al sole come se fosse gennaio.

      {empatia Media} La contadina non ha paura del vetro. Ha paura che tu
      sia venuto a portarglielo via, e un poco anche che tu non lo faccia.

      {resilienza Facile fallita} Guardi il vetro troppo a lungo, e per un
      momento non sai più da che parte sta il cielo vero. Ti tocca
      abbassare gli occhi sulle stoppie per ritrovarlo.
    opzioni:
      - testo: "Scavare lungo il bordo del vetro"
        descrizione: "Il vetro continua sotto terra. Da qualche parte il bordo diventa una parete, e una parete fatta da qualcuno ha una porta."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Il portello
          testo: |
            Scavi lungo il bordo con la pala del cascinale, e a due braccia
            di profondità il vetro diventa metallo grigio, così freddo che
            le mani ti si intorpidiscono sul manico. Più giù la pala batte su
            un portello stretto e alto, con una maniglia fatta per dita più
            lunghe delle tue. Si apre verso l'interno, e da sotto sale
            un'aria gelata che sa di neve.
          pe: { atletica: 2 }
          vai: lente-del-sornione
        fallimento:
          titolo: La terra rossa
          testo: |
            La terra del campo è dura come un mattone cotto e a ogni palata
            frana un poco nella buca. A sera hai le mani piene di vesciche e
            una buca che il cane della contadina annusa con disprezzo. Lasci
            la pala appoggiata al noce e rimandi lo scavo a un altro giorno.
          effetti: { ferite: 0.5 }
      - testo: "Farsi portare in cantina dalla contadina"
        descrizione: "Chi costruisce una casa accanto a una cosa del genere scava anche una cantina. Bisogna sapere che cosa ci ha trovato."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Il vino buono
          testo: |
            La contadina ti squadra a lungo, poi prende la lanterna e ti porta
            giù per una scala di pietra. La cantina è fresca, con le botti in
            fila contro una parete di metallo grigio. Suo nonno ci ha trovato
            una porta, ti dice. Ci ha messo davanti le botti del vino buono,
            perché lì il vino non va mai a male. Sposta due botti con te e ti
            lascia la lanterna.
          pe: { empatia: 2 }
          vai: lente-del-sornione
        fallimento:
          titolo: Il cane
          testo: |
            La contadina ti ascolta finché nomini la cantina, poi chiama il
            cane con un fischio. Il cane ti accompagna fino alla strada a
            mezzo passo da te, e ogni volta che rallenti ti appoggia i denti
            sul polpaccio senza stringere.
          effetti: { sospetto: 0.5 }
      - testo: "Arrivare a cavallo e lasciar scegliere il cavallo"
        descrizione: "Le bestie girano al largo dei posti neri. Un cavallo sente dove il campo è vuoto sotto gli zoccoli."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Gli zoccoli piantati
          testo: |
            Giri intorno al campo al passo, con le redini lente. Il cavallo
            non vuole avvicinarsi al vetro, e a un punto preciso del margine
            pianta gli zoccoli e sbuffa dal naso. Lì, sotto un palmo di
            terra, la pala trova un portello di metallo grigio, e il portello
            si apre verso l'interno appena lo liberi.
          vai: lente-del-sornione
      - testo: "Aspettare la notte sulle stoppie"
        descrizione: "Di notte il vetro mostra un cielo di giorno, dice la contadina. Forse di notte mostra anche da dove si entra."
        costo: 2
        esito:
          titolo: La riga di luce
          testo: |
            Aspetti il buio seduto sulle stoppie, con la giubba chiusa fino
            al mento. A mezzanotte il disco si accende dell'azzurro di una
            mattina presto, e lungo il bordo, sotto la terra, una riga di
            luce disegna la sagoma di un portello. Scavi al buio con le dita
            intirizzite, e il portello si apre verso l'interno.
          effetti: { ferite: 0.5 }
          vai: lente-del-sornione
      - testo: "Misurare l'inclinazione come all'Accademia"
        descrizione: "Orvald dice che una lente si capisce dall'angolo. Questa pende verso nord, e il suo occhio sta dove l'angolo porta."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: L'angolo
          testo: |
            Pianti due bastoni sull'orlo del disco e tendi uno spago fra le
            punte, come avete fatto cento volte nel cortile dell'Accademia con
            le lenti piccole. Prolunghi la linea sotto terra con la pala, e a
            tre braccia trovi un portello di metallo grigio, nel punto esatto
            che lo spago indicava. Il portello si apre verso l'interno appena
            lo tocchi.
          pe: { tecnologia: 2 }
          vai: lente-del-sornione
        fallimento:
          titolo: Il vetro gelato
          testo: |
            Per tenere fermo lo spago appoggi il palmo sul vetro, e il gelo ti
            morde la pelle come un ferro rovente. Quando stacchi la mano ti
            resta sul vetro un pezzetto di pelle, e la linea sotto terra non
            la prolunghi più per oggi.
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ 0 · la rampa e la paratia
  - id: lente-del-sornione-la-rampa
    immagine: ambientazione/rovine-dei-precursori
    titolo: La rampa sotto il vetro
    sommario: "Una rampa senza parapetto scende a spirale lungo la parete della canna, coperta da una brina dura come lo zucchero."
    luogo: La Lente del Sornione, sotto il vetro
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 0]
    testo: |
      Dal portello esci su una rampa larga due passi che gira lungo la
      parete della canna, senza parapetto. Sopra la tua testa il Sornione
      manda giù la sua luce da notte di luna, e sotto i piedi la rampa è
      coperta di brina dura come lo zucchero sulle torte di festa. Lungo la
      parete corre una fila di borchie grandi come un pugno, all'altezza
      di una spalla molto più alta della tua.

      {acrobazia Media} Sul lato del vuoto la brina pende verso il basso e
      i piedi ci scivolano sopra. Contro la parete la presa è migliore, e la
      parete non ha fretta di buttarti giù.

      {galateo Facile fallita} Ti viene da chiedere permesso prima di
      scendere, come in casa d'altri, e lo chiedi a mezza voce al buio.

      Dal fondo della canna sale il ticchettio, lento come un orologio di
      campagna.
    opzioni:
      - testo: "Scendere con la spalla contro la parete"
        descrizione: "I piedi di traverso, la spalla sul metallo gelato, un giro dopo l'altro."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La spalla alla parete
          testo: |
            Scendi con la spalla contro il metallo e i piedi di traverso, un
            giro dopo l'altro, e ogni tanto la giubba ti resta incollata al
            gelo per un momento. Al terzo giro la brina finisce e la rampa
            diventa asciutta, e il ticchettio sotto di te si fa più chiaro.
          pe: { acrobazia: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Lo scivolone
          testo: |
            Al primo giro il piede ti parte verso il vuoto. Ti salvi
            aggrappandoti all'orlo della rampa con tutte e due le mani, e
            risali in ginocchio fino al portello con le dita spellate dal
            gelo.
          effetti: { ferite: 0.5 }
      - testo: "Seguire le borchie della parete"
        descrizione: "Qualcuno scendeva qui con la mano sulle borchie. Dove teneva la mano, forse, metteva anche i piedi."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: I tondi asciutti
          testo: |
            Le borchie sono appena tiepide, e ogni tanto una è più calda
            delle altre. Sotto la borchia calda la brina della rampa si è
            sciolta in un tondo asciutto, e tu metti i piedi lì, di tondo in
            tondo, fino in fondo alla prima spirale.
          pe: { percezione: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: La borchia che gira
          testo: |
            Una borchia ti gira sotto la mano con uno scatto, e per tutta la
            canna corre un suono acuto di vetro toccato con l'unghia. Ti
            siedi sulla rampa ad aspettare che smetta, senza sapere che cosa
            hai messo in moto.
          effetti: { tormento: 1 }
      - testo: "Calare la corda e scendere appeso"
        descrizione: "Una corda legata al maniglione del portello e giù lungo la parete. Basta che la corda sia abbastanza lunga."
        costo: 2
        esito:
          titolo: La corda corta
          testo: |
            Leghi la corda al maniglione del portello e ti cali lungo la
            parete, con i piedi che cercano la rampa del giro di sotto. La
            corda finisce prima della rampa. L'ultimo tratto lo fai
            saltando, e la caviglia te lo fa pagare per il resto della discesa.
          effetti: { profondita.lente-del-sornione: 1, ferite: 0.5 }

  - id: lente-del-sornione-la-paratia-brinata
    immagine: ambientazione/rovine-dei-precursori
    titolo: La paratia brinata
    sommario: "Al primo giro la rampa entra nella parete sotto un arco basso, chiuso da una paratia coperta di brina spessa un dito."
    luogo: La Lente del Sornione, il primo giro della rampa
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 0]
    testo: |
      Al primo giro la rampa entra nella parete sotto un arco basso, e
      l'arco è chiuso da una paratia di metallo coperta di brina spessa un
      dito. Il freddo qui ti entra nelle ossa delle mani e ti si posa sulle
      ciglia, e quando sbatti le palpebre senti la brina scricchiolare. Al
      centro della paratia c'è una ruota da girare, incrostata di ghiaccio
      fino al mozzo.

      {resistenza Media fallita} Le dita ti dicono che fra poco smetteranno
      di obbedirti, e te lo dicono con una certa soddisfazione.

      {tecnologia Media} La brina non è uguale dappertutto. Lungo il bordo
      sinistro è più sottile, e sotto deve passare qualcosa di tiepido.
    opzioni:
      - testo: "Girare la ruota a forza"
        descrizione: "Il ghiaccio cede prima delle mani, se le mani tengono abbastanza."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: La ruota
          testo: |
            Ti avvolgi le mani nelle maniche e tiri la ruota con tutto il
            peso. Il ghiaccio si spacca intorno al mozzo con un colpo secco e
            la ruota gira. La paratia scivola di lato con un soffio di aria
            più calda, e dall'altra parte la rampa riprende a scendere.
          pe: { resistenza: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Le dita bianche
          testo: |
            Tiri finché le dita diventano bianche e insensibili, e la ruota
            resta dov'è. Torni al portello a scaldarti le mani sotto le
            ascelle, e per un'ora le dita ti pungono come se ci fossero dentro
            mille spilli.
          effetti: { ferite: 0.5 }
      - testo: "Cercare quello che passa sotto la brina sottile"
        descrizione: "Lungo il bordo sinistro passa qualcosa di tiepido. Le paratie dei Precursori hanno sempre un meccanismo, e un meccanismo scalda."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il canale tiepido
          testo: |
            Gratti la brina sottile con la lama e scopri un canale nel
            metallo, con dentro una barra che si muove appena. La spingi con
            il pollice dove è più calda, e la paratia scivola di lato senza
            che tu tocchi la ruota.
          pe: { tecnologia: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: La lama incollata
          testo: |
            Gratti la brina, e la lama si incolla al metallo gelato e ci resta
            attaccata. La stacchi tirando con tutte e due le mani, e il
            contraccolpo ti manda a sbattere contro la parete dell'arco.
          effetti: { ferite: 0.5 }
      - testo: "Sciogliere il ghiaccio con l'olio della lanterna"
        descrizione: "Un filo d'olio acceso intorno al mozzo. Si brucia l'olio, e un poco anche le mani."
        costo: 2
        esito:
          titolo: L'olio acceso
          testo: |
            Versi un filo d'olio intorno al mozzo e ci dai fuoco. Il ghiaccio
            si scioglie lento e gocciola nella fiamma. Quando la ruota
            finalmente gira hai una scottatura sul dorso della mano e la
            lanterna mezza vuota per il resto della discesa.
          effetti: { profondita.lente-del-sornione: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · gli specchi e le lastre
  - id: lente-del-sornione-gli-specchi
    immagine: ambientazione/rovine-dei-precursori
    titolo: Gli specchi della canna
    sommario: "Più in basso la luce del vetro scende di specchio in specchio lungo la parete. Uno è storto, e sotto di lui la rampa è buia."
    luogo: La Lente del Sornione, la canna degli specchi
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 1]
    testo: |
      Più in basso la luce del Sornione da sola non arriva, e la canna se la
      passa da uno specchio all'altro. Sono dischi lucidi grandi come scudi e
      stanno incassati di sbieco nella parete. Ognuno raccoglie la luce del
      precedente e la manda un giro più giù. Uno è storto di un palmo e manda
      la sua luce contro il metallo nudo. Da lì in giù la rampa sparisce nel
      buio.

      {tecnologia Media} Lo specchio storto ha un perno sul retro, e il
      perno ha una tacca. Qualcuno l'ha girato apposta, o il freddo l'ha
      fatto saltare.

      {furtivita Facile} Al buio i rumori arrivano prima di quello che li
      fa. Il ticchettio, intanto, è più vicino.
    opzioni:
      - testo: "Raddrizzare lo specchio"
        descrizione: "Lo specchio ha un perno con una tacca, e sta sospeso sopra il vuoto."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La luce che torna
          testo: |
            Ti sporgi sul vuoto con una mano sulla borchia più vicina e
            giri il perno fino alla tacca. Lo specchio si raddrizza con uno
            scatto, e la luce azzurra scende di nuovo giro dopo giro,
            accendendo la rampa fin dove arriva lo sguardo.
          pe: { tecnologia: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il lampo
          testo: |
            Giri il perno dalla parte sbagliata, e lo specchio ti manda in
            faccia tutta la luce della canna in un colpo solo. Resti a lungo
            seduto sulla rampa con le mani sugli occhi, e quando li riapri ci
            vedi dentro due stelle che non se ne vanno.
          effetti: { tormento: 1 }
      - testo: "Scendere al buio con la mano sulle borchie"
        descrizione: "Al buio ci si muove a memoria. La memoria qui è quella delle borchie."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: A memoria
          testo: |
            Scendi al buio contando le borchie sotto le dita, tre passi fra
            una e l'altra, e non pensi a quanto sia profondo il vuoto alla tua
            destra. Al quarto giro la luce dello specchio successivo ti viene
            incontro dal basso.
          pe: { resilienza: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il vuoto a destra
          testo: |
            A metà giro perdi il conto delle borchie, e il vuoto alla tua
            destra comincia a sembrarti più vicino a ogni passo. Torni su
            camminando all'indietro, con la schiena contro la parete, fino
            alla luce.
          effetti: { tormento: 1 }
      - testo: "Accendere la lanterna e scendere piano"
        descrizione: "Una lanterna fa luce. Negli specchi, però, la luce di una lanterna non resta ferma."
        costo: 2
        esito:
          titolo: Cento lanterne
          testo: |
            Accendi la lanterna, e gli specchi della canna la raccolgono tutti
            insieme e te la rimandano da cento parti. Scendi in mezzo a cento
            lanterne che si muovono con te, e quando arrivi in basso hai un
            mal di testa che ti batte dietro gli occhi.
          effetti: { profondita.lente-del-sornione: 1, tormento: 1 }

  - id: lente-del-sornione-le-lastre
    immagine: ambientazione/rovine-dei-precursori
    titolo: La stanza delle lastre
    sommario: "Una stanza lunga nella parete della canna, con scaffali pieni di lastre di vetro sottili come fogli. Su ognuna c'è un cielo."
    luogo: La Lente del Sornione, la stanza delle lastre
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 1]
    testo: |
      Una porta nella parete della canna dà su una stanza lunga e stretta,
      con scaffali di metallo dal pavimento al soffitto. Sugli scaffali
      sono infilate lastre di vetro sottili come fogli, migliaia, ognuna in
      una scanalatura sua. Ne sollevi una contro la luce, e dentro c'è un
      cielo di notte inciso a punti minuscoli, con le stelle che conosci e
      quelle che non conosci.

      {accademiche Media} Il Velo conserva i registri delle nascite in
      scaffali come questi, un foglio per giorno. Qui ogni foglio sembra
      una notte.

      {origine allievo-di-torvessa} All'Accademia una lastra incisa dei
      Precursori si studia per un anno intero, chiusa in una teca con il
      lucchetto. Qui ce ne sono migliaia, e nessuno le ha mai contate.

      In fondo alla stanza un'altra porta riporta sulla rampa, più in
      basso.
    opzioni:
      - testo: "Cercare dove finiscono le lastre"
        descrizione: "Se ogni lastra è una notte, l'ultima lastra è l'ultima notte che qualcuno ha guardato."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La fila a metà
          testo: |
            Segui l'ordine delle scanalature da uno scaffale all'altro, e
            l'ordine ti porta fino in fondo alla stanza. L'ultima fila è
            piena solo a metà. Dopo l'ultima lastra ci sono scanalature
            vuote, con la polvere dentro, per tutti gli scaffali che restano.
          pe: { accademiche: 2 }
          effetti: { profondita.lente-del-sornione: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Mille cieli
          testo: |
            Sollevi una lastra dopo l'altra finché i cieli cominciano a
            somigliarsi tutti, e poi a muoversi. Esci dalla porta da cui sei
            entrato con le stelle ancora attaccate agli occhi.
          effetti: { tormento: 1 }
      - testo: "Sfilare una lastra senza far cadere la fila"
        descrizione: "Una lastra di vetro dei Precursori vale qualcosa anche sui Ponti. Sono sottili, e stanno strette."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Una notte in tasca
          testo: |
            Sfili piano una lastra dalla sua scanalatura con due dita, e le
            vicine restano ferme. La avvolgi nel fazzoletto e te la metti
            contro il petto, sotto la giubba. Il vetro è freddo e non si
            scalda, e lo senti per tutta la discesa.
          pe: { acrobazia: 2 }
          effetti: { profondita.lente-del-sornione: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il domino
          testo: |
            La lastra si incastra a metà e tu tiri più forte, e la fila intera
            si piega come un mazzo di carte. Ne prendi al volo due e le altre
            si spaccano sul pavimento, e una scheggia ti apre il dorso della
            mano.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare la stanza senza toccare niente"
        descrizione: "Le lastre restano dove sono. La porta in fondo riporta sulla rampa."
        costo: 2
        esito:
          titolo: Fra gli scaffali
          testo: |
            Attraversi la stanza con le mani in tasca, girando di fianco fra
            gli scaffali dove il passaggio si stringe. Quando esci dalla porta
            in fondo ti accorgi di aver contato le file sottovoce per tutto il
            tempo, e il numero non ti esce più dalla testa.
          effetti: { profondita.lente-del-sornione: 1, tormento: 1 }

  # ------------------------------------------------------------ 1–3 · il cielo sotto i piedi
  - id: lente-del-sornione-il-cielo-sotto-i-piedi
    immagine: ambientazione/marea-grigia
    titolo: Il cielo sotto i piedi
    sommario: "Per un tratto la rampa è di vetro, e attraverso il vetro, sotto i tuoi piedi, si vedono le stelle."
    luogo: La Lente del Sornione, la rampa di vetro
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione >= 1, profondita.lente-del-sornione <= 3]
    testo: |
      Per un giro intero la rampa smette di essere metallo e diventa un vetro
      spesso e trasparente come quello di sopra. Attraverso il vetro, sotto i
      tuoi piedi, ci sono le stelle. Sono le stesse del Sornione, con le due
      che non conosci vicino all'orlo, e stanno così in basso che il corpo si
      convince di camminare sul soffitto del mondo.

      {resilienza Media} Le gambe vogliono piegarsi e le mani cercano qualcosa
      a cui tenersi. Il pavimento regge, e alla testa tocca soltanto crederci.

      {atletica Facile fallita} Le ginocchia ti fanno sapere che preferiscono
      il metallo, e che se insisti cammineranno da sole, ma all'indietro.
    opzioni:
      - testo: "Camminare guardando le stelle"
        descrizione: "Le stelle stanno ferme, e il vetro regge. Se la testa accetta tutte e due le cose, il resto viene da sé."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Sul soffitto del mondo
          testo: |
            Cammini sul vetro con gli occhi aperti e le stelle sotto i piedi,
            e dopo una decina di passi il corpo smette di protestare. A metà
            giro ti fermi addirittura a guardare le due stelle sconosciute, e
            ti sembrano più vicine del resto, come lanterne appese più in
            basso.
          pe: { resilienza: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: La caduta che non viene
          testo: |
            A metà giro il corpo decide che stai cadendo e ti butta a terra a
            braccia aperte. Resti sdraiato sul vetro con la guancia contro il
            freddo finché la testa non torna al suo posto, e poi risali
            gattonando dove c'è il metallo.
          effetti: { tormento: 1 }
      - testo: "Correre fino al metallo"
        descrizione: "Un giro di vetro si fa di corsa, con gli occhi sulla parete e il fiato corto."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Di corsa
          testo: |
            Corri lungo il vetro con gli occhi sulla parete, e le stelle
            sotto di te diventano una striscia chiara che non guardi. Arrivi
            al metallo con il cuore in gola e le ginocchia che tremano, ma
            dall'altra parte.
          pe: { atletica: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il piede sul vuoto
          testo: |
            A metà corsa guardi giù senza volerlo, e il piede ti si pianta da
            solo come davanti a un precipizio. Cadi in avanti sulle mani e
            scivoli sul vetro per due passi, e torni indietro con i palmi
            sbucciati.
          effetti: { ferite: 0.5 }
      - testo: "Passare strisciando con gli occhi chiusi"
        descrizione: "A occhi chiusi il vetro è soltanto un pavimento freddo. Lungo, e freddo."
        costo: 2
        esito:
          titolo: Il pavimento freddo
          testo: |
            Chiudi gli occhi e passi strisciando, con la pancia sul vetro e
            le mani avanti a cercare il metallo. Ci vuole molto, e il freddo
            ti entra nelle ossa del petto. Quando riapri gli occhi sei
            dall'altra parte, e le stelle te le senti ancora sotto la pelle.
          effetti: { profondita.lente-del-sornione: 1, tormento: 1 }

  # ------------------------------------------------------------ 2 · gli occhi di guardia e la stanza del turno
  - id: lente-del-sornione-gli-occhi-di-guardia
    immagine: bestiario/salvaguardia-precursori
    titolo: Gli occhi di guardia
    sommario: "Due dischi di vetro cerchiati di metallo galleggiano nella canna. Raccolgono la luce del Sornione e la stringono in un punto che brucia."
    luogo: La Lente del Sornione, la canna a metà
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 2]
    testo: |
      A metà della canna galleggiano due dischi di vetro grandi come
      piatti, cerchiati di metallo, immobili sopra il vuoto. Quando entri
      nella loro luce si girano verso di te tutti e due insieme. La luce
      azzurra del Sornione si stringe dentro il vetro in un punto bianco,
      e sul gradino davanti ai tuoi piedi la brina sfrigola e fuma.

      {armi-da-distanza Media} Ruotano su un anello, e l'anello ha bisogno di
      un momento per girarsi. Fra un colpo e l'altro sono lenti, come una
      balestra da ricaricare.

      Dove la parete fa ombra, sul lato della rampa, la luce non li
      raggiunge.
    opzioni:
      - testo: "Rompere gli occhi di guardia"
        descrizione: "Sono due, e fra un colpo e l'altro sono lenti. Il vetro si rompe, se lo colpisci prima che lui colpisca te."
        combattimento: lente-del-sornione-occhi-di-guardia
        vittoria:
          titolo: I cocci
          testo: |
            Il secondo disco si spacca a mezz'aria e cade nella canna con un
            tintinnio lungo, giro dopo giro, finché non lo senti più. Il
            primo è caduto sulla rampa. Gli stacchi l'anello di metallo e
            quello che resta del suo meccanismo, e te li metti nel sacco.
          effetti: { profondita.lente-del-sornione: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: Il punto bianco
          testo: |
            Il punto bianco ti trova prima sulla spalla e poi sul braccio, e
            la giubba ti prende fuoco in due posti. Risali la rampa di corsa
            fino all'ombra, e spegni la giubba battendola contro la parete.
      - testo: "Passare nell'ombra della parete"
        descrizione: "Dove la parete fa ombra la luce non arriva, e senza luce gli occhi di guardia sono soltanto vetro."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Nell'ombra
          testo: |
            Scendi con la schiena contro la parete, dentro la striscia
            d'ombra, un passo alla volta. I due dischi girano piano cercandoti
            nella luce, e tu passi sotto di loro senza che il punto bianco
            si accenda.
          pe: { furtivita: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il gomito nella luce
          testo: |
            Ti esce un gomito dall'ombra, e un attimo dopo la manica ti
            fuma. Ti butti indietro contro la parete e risali piano, con il
            braccio stretto al petto e l'odore di stoffa bruciata nel naso.
          effetti: { ferite: 0.5 }
      - testo: "Coprirsi con la giubba e correre"
        descrizione: "Una giubba sulla testa e una corsa lungo la rampa. La giubba brucerà."
        costo: 2
        esito:
          titolo: La giubba bruciata
          testo: |
            Ti tiri la giubba sulla testa e corri giù per la rampa. Il punto
            bianco ti segue e la stoffa ti fuma sulle spalle, e quando arrivi
            fuori dalla loro luce ti tocca strapparti la giubba di dosso e
            pestarla con i piedi.
          effetti: { profondita.lente-del-sornione: 1, ferite: 0.5 }

  - id: lente-del-sornione-la-stanza-del-turno
    immagine: ambientazione/rovine-dei-precursori
    titolo: La stanza del turno
    sommario: "Una stanza tonda con una sedia alta il doppio di una sedia, rivolta verso una finestrella che guarda dentro la canna."
    luogo: La Lente del Sornione, la stanza del turno
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 2]
    testo: |
      Una porta bassa nella parete dà su una stanza tonda, e nella stanza c'è
      soltanto una sedia di metallo alta il doppio di una sedia, rivolta verso
      una finestrella che guarda dentro la canna. Sul bracciolo destro il
      metallo è consumato in quattro solchi lisci, uno per ogni dito che ci ha
      tamburellato sopra per anni. Ai piedi della sedia c'è una ciotola con
      dentro una manciata di semi neri, secchi da prima della Caduta.

      {empatia Media} Chi stava qui faceva un turno lungo e noioso, e
      mangiava semi per tenersi sveglio. Non ti aspettavi di riconoscerti
      in un Precursore.

      Dalla finestrella si vede il fondo della canna, e laggiù qualcosa
      riflette le stelle.
    opzioni:
      - testo: "Guardare dalla finestrella"
        descrizione: "Lui guardava sempre lo stesso punto. Bisogna salire sulla sedia per vedere quello che vedeva."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Quello che guardava
          testo: |
            Ti arrampichi sulla sedia e appoggi la fronte alla finestrella. In
            fondo alla canna c'è una conca di vetro nero piena di stelle e
            rivolta verso l'alto. Intorno all'orlo cammina piano una cosa con
            le gambe lunghe. Prendi a mente la strada più corta per arrivarci,
            e scendi dalla sedia con le gambe che penzolano.
          pe: { percezione: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: La sedia alta
          testo: |
            Ti arrampichi sulla sedia e il metallo liscio ti scivola sotto le
            ginocchia. Cadi di schiena sul pavimento e la ciotola dei semi si
            rovescia, e mentre li raccogli ti senti uno che ha rotto qualcosa
            in casa d'altri.
          effetti: { ferite: 0.5 }
      - testo: "Sederti al suo posto e aspettare"
        descrizione: "Una stanza fatta per aspettare insegna qualcosa a chi aspetta. Anche quello che si aspettava."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Il turno
          testo: |
            Ti siedi sul bordo della sedia e tamburelli con le dita nei solchi
            del bracciolo, che sono troppo distanti per la tua mano. Dopo un
            poco ti accorgi che la finestrella è montata su una cerniera. La
            apri, e dietro c'è una scaletta di servizio che scende dritta
            verso il fondo.
          pe: { empatia: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il sonno
          testo: |
            Ti siedi ad aspettare e il freddo ti addormenta. Ti svegli di
            soprassalto con la bocca impastata e la sensazione di aver mancato
            il cambio del turno, e per un pezzo non ricordi da che parte sei
            venuto.
          effetti: { tormento: 1 }
      - testo: "Tornare sulla rampa e proseguire"
        descrizione: "La sedia resta a chi l'ha consumata. La rampa scende comunque."
        costo: 2
        esito:
          titolo: I semi
          testo: |
            Esci dalla stanza e riprendi la rampa, che qui si fa stretta e
            ripida. Ti accorgi soltanto più in basso di avere in tasca uno
            dei semi neri, e di non ricordare di averlo preso. Lo getti nel
            vuoto, e non lo senti arrivare in fondo.
          effetti: { profondita.lente-del-sornione: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · il cerchio delle nove tacche e la ruota
  - id: lente-del-sornione-il-cerchio-dei-nove
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il cerchio dei nove incavi
    sommario: "Sul pavimento di un pianerottolo è inciso un cerchio di nove incavi. Uno è più profondo degli altri, e dentro c'è un occhio."
    luogo: La Lente del Sornione, il pianerottolo del cerchio
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 3]
    testo: |
      Dove la rampa fa un pianerottolo, sul pavimento è inciso un cerchio
      largo quanto un tavolo da osteria, con nove incavi lungo il bordo,
      ognuno grande come una mano. Otto sono lisci e poco profondi. Il nono è
      inciso più a fondo, e sul fondo c'è un segno, un occhio aperto, che
      manda la stessa luce azzurra del Sornione. Dal centro del cerchio parte
      un condotto di metallo spesso come un braccio, che attraversa il
      pianerottolo e sparisce sotto la parete, verso nord-est.

      {accademiche Difficile} All'Anello del Camminatore, dicono i mandriani,
      le pietre nere sono nove anche loro. Forse un incavo per ogni posto, e
      questo posto ha il segno dell'occhio.

      {magia Media fallita} Il Mana qui non fa niente di strano, e la cosa
      ti delude più di quanto dovrebbe.
    opzioni:
      - testo: "Ricopiare il cerchio sul quaderno"
        descrizione: "Nove incavi con un occhio in quello profondo, e un condotto che va da qualche parte. Qualcuno alla Biblioteca saprà che farsene."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: Il disegno
          testo: |
            Ricopi il cerchio sul quaderno incavo per incavo, con la lampada
            appoggiata al pavimento, e disegni l'occhio dentro quello
            profondo. Il condotto lo ricopi due volte, perché la prima ti è
            venuto storto. Poi riprendi la rampa con il quaderno sotto il
            braccio.
          pe: { accademiche: 2 }
          effetti: { profondita.lente-del-sornione: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: L'occhio acceso
          testo: |
            Mentre disegni appoggi il palmo sull'incavo dell'occhio, e la luce
            ti sale nel braccio fino alla spalla, fredda. Per un'ora la mano
            ti trema troppo per tenere la matita, e il disegno resta a metà.
          effetti: { tormento: 1 }
      - testo: "Seguire il condotto con la lanterna"
        descrizione: "Il condotto va sotto la parete. Quello che i Precursori hanno posato con tanta cura porta sempre da qualche parte."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La nota nel condotto
          testo: |
            Segui il condotto fino alla parete, e sotto la parete trovi una
            fessura stretta da cui esce un filo d'aria. Il condotto ci entra e
            vibra piano, con una nota bassa che ti arriva nei denti prima che
            nelle orecchie.
            Accanto alla fessura una porticina riporta sulla rampa, più giù.
          pe: { percezione: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: La fessura
          testo: |
            Infili le dita nella fessura sotto la parete per sentire dove va
            il condotto, e il filo d'aria che ne esce è così freddo che ti
            lascia le punte delle dita bianche e insensibili per tutto il
            pomeriggio.
          effetti: { ferite: 0.5 }
      - testo: "Cercare l'incavo che riconosci"
        descrizione: "Hai già visto questo cerchio sotto la Spina dell'Eco. Laggiù l'incavo profondo aveva una riga fra due onde."
        quando: [misura.spina >= 1]
        esito:
          titolo: Due segni
          testo: |
            Trovi sul cerchio l'incavo dove sotto la Spina c'era la riga fra
            due onde. Qui è liscio e poco profondo, e sotto le dita resta
            freddo. Ricopi tutto sul quaderno senza fretta, i due segni uno
            accanto all'altro, e riprendi la rampa.
          effetti: { profondita.lente-del-sornione: 1, informazioni.segreto: 1 }
      - testo: "Girare intorno al cerchio senza calpestarlo"
        descrizione: "Il cerchio resta dov'è. Il pianerottolo è stretto, e il bordo è sul vuoto."
        costo: 2
        esito:
          titolo: Sul bordo
          testo: |
            Giri intorno al cerchio sul filo del pianerottolo, con i talloni
            sul vuoto e la schiena dritta come un soldato. Una volta dall'altra
            parte ti accorgi che le gambe ti tremano, e lasci che tremino
            prima di riprendere la discesa.
          effetti: { profondita.lente-del-sornione: 1, ferite: 0.5 }

  - id: lente-del-sornione-la-ruota-del-ticchettio
    immagine: ambientazione/rovine-dei-precursori
    titolo: La ruota del ticchettio
    sommario: "Il ticchettio viene da una ruota dentata grande come una macina, che chiude la rampa e gira di un dente a ogni colpo."
    luogo: La Lente del Sornione, la ruota
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 3]
    testo: |
      Il ticchettio viene da qui. Una ruota dentata grande come una macina
      chiude la rampa da parete a vuoto, e gira di un dente a ogni colpo, con
      un rumore secco che rimbalza su per tutta la canna. Fra un dente e
      l'altro ci sta un corpo di traverso, il tempo di un colpo. Dall'altra
      parte della ruota la rampa scende verso una luce che non è più azzurra.

      {atletica Media} Un colpo ogni due battiti di cuore. Si entra al
      primo, si esce al secondo, e in mezzo non si inciampa.

      {tecnologia Difficile} La ruota fa girare piano l'occhio di sotto,
      perché segua le stelle di dentro, e fermarla vuol dire fermare anche
      l'occhio.
    opzioni:
      - testo: "Passare fra i denti al tempo giusto"
        descrizione: "Un dente, un battito, un passo. Bisogna contare con il corpo, perché la testa arriva tardi."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Fra i denti
          testo: |
            Conti due colpi a voce bassa, e al terzo ti infili fra due denti
            di traverso. La ruota gira con te dentro, e il metallo ti passa a
            un dito dal naso. Al colpo dopo esci dall'altra parte e ti trovi
            sulla rampa, con le ginocchia molli e la giubba intera.
          pe: { atletica: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il dente
          testo: |
            Entri un momento in ritardo, e il dente successivo ti prende la
            spalla e ti spinge fuori dalla ruota come una mano impaziente.
            Finisci sulla rampa dalla parte da cui eri venuto, con il braccio
            che ti formicola fino alle dita.
          effetti: { ferite: 0.5 }
      - testo: "Bloccare la ruota con un cuneo"
        descrizione: "Un cuneo di ferro fra due denti, e la ruota si ferma. Fermarla però vuol dire fermare quello che gira sotto."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il cuneo
          testo: |
            Trovi il punto dove i denti si toccano con l'asse e ci infili il
            cuneo al momento giusto. La ruota si ferma con un gemito lungo, e
            per la prima volta da quando sei sceso la canna è in silenzio.
            Passi dall'altra parte con calma, e prima di andare togli il cuneo.
            Il ticchettio riprende dietro di te.
          pe: { tecnologia: 2 }
          effetti: { profondita.lente-del-sornione: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il cuneo che salta
          testo: |
            Il cuneo resiste un colpo solo e poi schizza via, e ti passa
            accanto all'orecchio prima di sparire nella canna. La ruota
            riprende a girare come se niente fosse, e a te resta un ronzio
            nell'orecchio sinistro.
          effetti: { tormento: 1 }
      - testo: "Aspettare il dente rotto"
        descrizione: "Su una ruota così vecchia c'è sempre un dente scheggiato, e dove manca un dente c'è più spazio. Basta aspettare che passi."
        costo: 2
        esito:
          titolo: Il giro lungo
          testo: |
            Ti siedi davanti alla ruota e la guardi girare finché passa un
            dente scheggiato a metà. Ci vuole un giro intero della ruota,
            lunghissimo. Quando il dente rotto torna ti infili nel suo spazio
            e passi, ma il freddo dell'attesa ti è rimasto nelle ginocchia.
          effetti: { profondita.lente-del-sornione: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · l'occhio
  - id: lente-del-sornione-l-occhio
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'occhio
    sommario: "In fondo alla canna c'è una conca di vetro nero rivolta verso l'alto, piena del cielo di una notte. Intorno all'orlo cammina il compasso."
    luogo: La Lente del Sornione, il fondo della canna
    area: lente-del-sornione
    requisiti: [profondita.lente-del-sornione >= 4, misura.sornione == 0]
    testo: |
      In fondo alla canna la rampa finisce su un anello di metallo largo
      come una piazza di paese, e nel mezzo dell'anello c'è l'occhio. È una
      conca di vetro nero rivolta verso l'alto, profonda come una vasca da
      lavare i panni, e dentro c'è un cielo di notte fermo, con ogni stella
      al suo posto. Le due che non conosci stanno basse, dalla parte di
      nord-est, una sopra l'altra.

      Intorno all'orlo corre un quadrante inciso con tacche fitte, e sul
      quadrante cammina il compasso. Ha due gambe di metallo lunghe come
      lance, unite in alto da un corpo piccolo come una cassa, e si sposta
      sulle punte, una gamba dopo l'altra, chinandosi ogni tanto sul vetro
      a misurare la distanza fra due stelle. Quando la tua ombra tocca
      l'orlo, il corpo si gira verso di te.

      {accademiche Media} Il quadrante segna le ore. Le stelle dentro
      l'occhio sono un orologio fermo, e chi sa leggere il quadrante sa a
      che ora si è fermato.

      {furtivita Difficile} L'occhio prende luce soltanto dall'alto. Chi si
      tiene basso dietro l'orlo non fa ombra sul vetro, e il compasso misura
      soltanto le ombre.

      {origine accolito-del-velo} In cripta si conservano le deposizioni
      dei superstiti della Caduta, e parlano tutte del suono. Nessuna dice
      com'era il cielo quella notte, perché nessuno pensava a guardarlo.

      *È il cielo di quella notte, e qualcuno l'ha tenuto da parte.* Sulla
      parete in fondo, accanto a una rastrelliera di lenti piccole, il
      condotto del cerchio dei nove incavi finisce dentro il muro, verso
      nord-est.
    opzioni:
      - testo: "Affrontare il compasso"
        descrizione: "Due gambe lunghe come lance e una punta che misura quello che tocca. Il corpo sta lassù fra le gambe, lontano dalla tua lama."
        combattimento: lente-del-sornione-il-compasso
        vittoria:
          titolo: Il cielo di quella notte
          testo: |
            Il compasso si piega su una gamba e cade di traverso sull'orlo, e
            la punta graffia il vetro con un suono lungo. Quando ti chini
            sull'occhio le stelle sono ferme come prima. La stella più grande
            è bianca e sta bassa sopra il nord-est, a un palmo dall'orlo, e la
            più piccola, rossa, le sta sopra di due dita. Sul quadrante cadono
            tutte e due sulla tacca dell'ultima ora prima dell'alba. Ricopi
            sul quaderno il quadrante con la sua tacca e le due stelle, e
            prima di andare sviti dalla testa del compasso la lente con cui
            misurava, ancora fredda.

            {accademiche Media} Le cronache dicono che il suono venne poche
            ore prima della frattura, e adesso sai anche a che ora.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.sornione: 1, oggetto.lente-del-sornione-vetro-delle-due-stelle: 1, parte.camera-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Misurato
          testo: |
            La punta del compasso ti trova al fianco e ti misura due volte, e
            ogni volta lascia un taglio. Risali la rampa piegato su te stesso,
            con il ticchettio che ti insegue giro dopo giro, e quando esci dal
            portello sulle stoppie è già notte e nel vetro c'è il sole.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Copiare il cielo senza fare ombra"
        descrizione: "Chi sta basso dietro l'orlo non fa ombra sul vetro. Bisogna restare basso a lungo, e il compasso passa vicino."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Dietro l'orlo
          testo: |
            Ti muovi carponi dietro l'orlo, sotto il filo della luce, e il
            compasso ti passa sopra la testa con una gamba e poi con l'altra.
            La stella più grande è bianca e sta bassa sopra il nord-est, a un
            palmo dall'orlo, e la più piccola, rossa, le sta sopra di due
            dita. Sul quadrante cadono tutte e due sulla tacca dell'ultima ora
            prima dell'alba. Ricopi tutto, e strisciando via prendi dalla
            rastrelliera una lente piccola e una camera di cristallo che le
            sta accanto.
          pe: { furtivita: 5 }
          effetti: { misura.sornione: 1, oggetto.lente-del-sornione-vetro-delle-due-stelle: 1, parte.camera-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'ombra sul vetro
          testo: |
            Alzi la testa di un dito per vedere meglio, e la tua ombra cade
            sull'occhio. Il compasso si gira, e la punta ti apre la schiena
            dalla spalla al fianco prima che tu riesca a buttarti sulla
            rampa. Risali senza aver copiato niente, con le stelle negli occhi.
          effetti: { ferite: 2, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ordinare al compasso di fermarsi"
        descrizione: "La formula del Comando parla alle macchine dei Precursori. Questa misura da prima della Caduta, e forse aspetta qualcuno che le dica di smettere."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Ferma
          testo: |
            Dici la formula, e la parola ti esce in una lingua che non è la
            tua. Il compasso si ferma con una gamba sollevata e resta così,
            come un airone in uno stagno. La stella più grande è bianca e sta
            bassa sopra il nord-est, a un palmo dall'orlo, e la più piccola,
            rossa, le sta sopra di due dita. Sul quadrante cadono sulla tacca
            dell'ultima ora prima dell'alba. Ricopi tutto con calma, e dalla
            rastrelliera prendi una lente piccola e una camera di cristallo.
          pe: { magia: 5 }
          effetti: { misura.sornione: 1, oggetto.lente-del-sornione-vetro-delle-due-stelle: 1, parte.camera-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La formula spezzata
          testo: |
            La formula ti si spezza in bocca, e il compasso sente soltanto la
            prima metà. Si gira verso di te e si mette a misurarti, con calma,
            dalla testa ai piedi, e alla seconda misura la punta ti entra
            nella coscia. Risali la canna trascinando la gamba, senza le
            stelle.
          effetti: { ferite: 1.5, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Leggere l'ora sul quadrante come all'Accademia"
        descrizione: "Un quadrante è un quadrante. All'Accademia te ne hanno fatti leggere a centinaia, e il compasso misura le stelle, non chi conta le tacche."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il conto delle tacche
          testo: |
            Resti fermo sulla rampa fuori dall'orlo e conti le tacche del
            quadrante a distanza, come ti ha insegnato Orvald con le lenti del
            cortile. La stella più grande è bianca e sta bassa sopra il
            nord-est, a un palmo dall'orlo, e la più piccola, rossa, le sta
            sopra di due dita. Cadono tutte e due sulla tacca dell'ultima ora
            prima dell'alba. Quando il compasso è dall'altra parte dell'occhio
            prendi dalla rastrelliera una lente piccola e una camera di
            cristallo, e risali.
          pe: { accademiche: 5 }
          effetti: { misura.sornione: 1, oggetto.lente-del-sornione-vetro-delle-due-stelle: 1, parte.camera-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Conti le tacche due volte e ti tornano due ore diverse, e per
            contarle la terza volta fai un passo di troppo. La tua ombra tocca
            l'orlo, e il compasso ti è addosso prima che tu abbia finito il
            conto. Risali la canna con un taglio sul braccio e due ore
            sbagliate in testa.
          effetti: { ferite: 1.5, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Tornare su senza toccare niente"
        descrizione: "L'occhio resta dov'è, e il compasso pure. La rampa riporta al campo."
        costo: 0
        esito:
          titolo: La lunga salita
          testo: |
            Guardi l'occhio un'ultima volta dalla rampa, con il compasso che
            gira piano sull'orlo, e cominci a risalire. La salita è più lunga
            della discesa. Quando esci dal portello sulle stoppie, la
            contadina è sull'aia e ti guarda arrivare.
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo · l'occhio, le altre volte
  - id: lente-del-sornione-l-occhio-che-resta
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'occhio, di nuovo
    sommario: "Il compasso si è rimesso in piedi e cammina di nuovo intorno all'occhio. Il cielo di quella notte è sempre lì."
    luogo: La Lente del Sornione, il fondo della canna
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione >= 4, misura.sornione >= 1]
    testo: |
      In fondo alla canna l'occhio è come lo hai lasciato, con le due stelle
      basse sopra il nord-est e il quadrante che non si muove. Il compasso
      si è rimesso in piedi. Una gamba è più corta dell'altra, raddrizzata
      alla meglio da qualcosa che lavora mentre nessuno guarda, e cammina
      sull'orlo zoppicando appena. La rastrelliera delle lenti accanto al
      muro si è riempita a metà.

      {tecnologia Media} Qualcosa qui sotto ripara quello che rompi. Lo fa
      piano, e con meno pezzi di prima.
    opzioni:
      - testo: "Abbattere di nuovo il compasso"
        descrizione: "Zoppica, e il corpo è sempre piccolo e lontano. Dentro, forse, c'è ancora qualcosa da prendere."
        combattimento: lente-del-sornione-il-compasso
        vittoria:
          titolo: La gamba corta
          testo: |
            Il compasso cade sulla gamba corta e non si rialza. Nel corpo
            trovi una camera di cristallo più piccola di quella dell'altra
            volta e un guscio chiuso, e li prendi prima che qualcosa venga a
            ripararlo.
          effetti: { parte.camera-2: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: La punta
          testo: |
            Anche zoppo, il compasso misura bene. La punta ti trova due volte,
            e risali la canna premendoti la mano sul fianco.
          effetti: { tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Svuotare la rastrelliera strisciando dietro l'orlo"
        descrizione: "Le lenti nuove sono lì, accanto al muro. Bisogna restare bassi, come la prima volta."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Le lenti nuove
          testo: |
            Strisci dietro l'orlo con il compasso che zoppica sopra di te, e
            arrivi alla rastrelliera. Le lenti nuove sono ancora tiepide di
            lavorazione. Ne prendi due e un guscio chiuso che sta sul ripiano
            più basso, e risali senza fare ombra.
          pe: { furtivita: 2 }
          effetti: { reliquie.frammento-inciso: 2, reperto.sigillato: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'ombra
          testo: |
            Il compasso zoppica proprio dove non te lo aspetti, e la tua ombra
            gli finisce sotto la punta. Ti graffia la spalla, e risali a mani
            vuote.
          effetti: { ferite: 1 }
          vai: superficie-fratturata
      - testo: "Guardare le stelle e risalire"
        descrizione: "Il cielo di quella notte lo conosci già. A volte basta guardarlo."
        costo: 0
        esito:
          titolo: Due stelle
          testo: |
            Resti sulla rampa a guardare le due stelle per un tempo che non
            misuri, e poi risali giro dopo giro fino al campo. Fuori è sera,
            e nel cielo vero le due stelle non ci sono.
          vai: superficie-fratturata

