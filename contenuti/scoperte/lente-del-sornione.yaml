# La Lente del Sornione (docs/piano-superficie.md, «Le nove spedizioni dei luoghi neri»). Un disco di vetro dei
# Precursori largo quattro metri, mezzo interrato in un campo oltre l'orlo nord del Gradone Rosso, accanto a un
# cascinale (codex sf-lente-del-sornione). Il disco è il tappo di una canna verticale larga come una torre: sotto
# c'è un occhio rivolto in alto che mostra il cielo com'era la notte del suono, con due stelle che oggi non ci sono.
# Ci si entra da `lente-del-sornione-il-campo` (Superficie, ripetibile, traccia.sornione >= 3).
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 la rampa sotto il vetro o la paratia brinata, 1 gli specchi o la stanza delle lastre, 2 gli occhi di guardia
# (scontro) o la stanza del turno, 3 il cerchio dei nove incavi o la ruota del ticchettio; il cielo sotto i
# piedi vale da 1 a 3.
# Il cuore a 4 è l'occhio (`lente-del-sornione-l-occhio`, misura.sornione == 0): il compasso che misura il cielo
# (boss), oppure copiare le stelle senza fare ombra (Difficile), il Comando, e per l'Allievo di Torvessa il conto
# delle ore sul quadrante. La vittoria dà misura.sornione, il Vetro delle due stelle (grado 3) e parti dei
# Precursori. Dopo, `lente-del-sornione-l-occhio-che-resta` (ripetibile, misura.sornione >= 1) rende meno.
# La misura, per chi scrive la Campana: nell'occhio la stella più grande è bianca e sta bassa sopra il nord-est,
# a un palmo dall'orlo; la più piccola, rossa, le sta sopra di due dita sulla stessa verticale. Sul quadrante
# intorno all'occhio le due stelle cadono sulla tacca dell'ultima ora prima dell'alba: è l'ora del suono.
# Il segno che lega i luoghi neri (fissato con le altre spedizioni): un cerchio di nove incavi con un incavo inciso
# più a fondo, e in quell'incavo il segno proprio del luogo, qui un occhio (lo stesso della quinta pietra
# dell'Anello). Dal centro parte un condotto verso nord-est, dove sta la Campana, che vibra con una nota bassa.
# Lo stesso cerchio è sotto la Soglia di Mara (la porta) e sotto la Spina dell'Eco (la riga fra due onde).
aree:
  - id: lente-del-sornione
    immagine: ambientazione/rovine-dei-precursori
    nome: La Lente del Sornione
    sommario: "Una canna di metallo larga come una torre scende sotto il disco di vetro, verso un occhio rivolto in alto."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Sotto il Sornione la terra è vuota. Il disco di vetro chiude in alto
      una canna di metallo grigio larga come una torre, e manda giù il
      chiarore azzurro di una notte di luna anche a mezzogiorno.

      Una rampa senza parapetto scende a spirale lungo la parete, nel freddo
      asciutto di una cantina d'inverno, e dal fondo sale un ticchettio
      lento che non cambia mai passo.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: lente-del-sornione-il-campo
    immagine: ambientazione/gradone-rosso
    titolo: Il campo del Sornione
    sommario: "Dietro un cascinale oltre il Gradone Rosso, un disco di vetro nel campo riflette un cielo di notte in pieno giorno."
    luogo: Superficie Fratturata, il cascinale oltre l'orlo nord del Gradone Rosso
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.sornione >= 3]
    testo: |
      Oltre l'orlo nord del Gradone Rosso c'è un cascinale con le finestre
      murate dalla parte del campo. In mezzo alle stoppie c'è il Sornione,
      un disco di vetro largo quattro metri, mezzo affondato nella terra e
      inclinato verso nord, e dentro, sotto il sole di mezzogiorno, è notte
      fitta di stelle. Due, vicine all'orlo verso nord-est, non le hai mai
      viste in nessun cielo. La contadina ti guarda dall'aia con il cane fra
      le ginocchia.

      {origine allievo-di-torvessa} Orvald Temmerin tiene sul tavolo una
      lente dei Precursori grande come un'unghia, e questa è larga come la
      sua aula.
    opzioni:
      - testo: "Scavare lungo il bordo del vetro"
        descrizione: "Il vetro continua sotto terra, e da qualche parte il bordo diventerà una parete con una porta."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Il portello
          testo: |
            A due braccia sotto terra il vetro diventa metallo gelato, e più giù
            la pala trova un portello stretto che si apre verso l'interno, su
            un'aria che sa di neve.
          pe: { atletica: 2 }
          vai: lente-del-sornione
        fallimento:
          titolo: La terra rossa
          testo: |
            La terra del campo è dura come un mattone cotto, e a sera hai le mani
            piene di vesciche e una buca che il cane della contadina annusa con
            disprezzo.
          effetti: { ferite: 0.5 }
      - testo: "Farsi portare in cantina dalla contadina"
        descrizione: "Chi costruisce una casa accanto a una cosa del genere scava anche una cantina."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Il vino buono
          testo: |
            La contadina ti squadra a lungo, poi ti porta in cantina con la
            lanterna. Le botti del vino buono stanno contro una parete di metallo
            grigio dove suo nonno aveva trovato una porta, e ne sposta due con te
            prima di lasciarti la lanterna.
          pe: { empatia: 2 }
          vai: lente-del-sornione
        fallimento:
          titolo: Il cane
          testo: |
            Appena nomini la cantina la contadina chiama il cane, che ti
            accompagna fino alla strada appoggiandoti i denti sul polpaccio ogni
            volta che rallenti.
          effetti: { sospetto: 0.5 }
      - testo: "Arrivare a cavallo e lasciar scegliere il cavallo"
        descrizione: "Un cavallo sente dove il campo è vuoto sotto gli zoccoli."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Gli zoccoli piantati
          testo: |
            Il cavallo pianta gli zoccoli e sbuffa in un punto preciso del
            margine, e lì, sotto un palmo di terra, la pala trova un portello di
            metallo grigio.
          vai: lente-del-sornione
      - testo: "Aspettare la notte sulle stoppie"
        descrizione: "Di notte il vetro mostra un cielo di giorno, e forse anche da dove si entra."
        costo: 2
        esito:
          titolo: La riga di luce
          testo: |
            A mezzanotte una riga di luce disegna sotto la terra la sagoma di un
            portello, e lo liberi scavando con le dita intirizzite.
          effetti: { ferite: 0.5 }
          vai: lente-del-sornione
      - testo: "Misurare l'inclinazione come all'Accademia"
        descrizione: "Orvald dice che una lente si capisce dall'angolo, e questa pende verso nord."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: L'angolo
          testo: |
            Tendi uno spago fra due bastoni sull'orlo, come nel cortile
            dell'Accademia, e prolunghi la linea sotto terra con la pala. A tre
            braccia trovi un portello di metallo grigio che si apre verso
            l'interno.
          pe: { tecnologia: 2 }
          vai: lente-del-sornione
        fallimento:
          titolo: Il vetro gelato
          testo: |
            Per tenere fermo lo spago appoggi il palmo sul vetro, e il gelo ti
            porta via un pezzetto di pelle e la voglia di continuare per oggi.
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ 0 · la rampa e la paratia
  - id: lente-del-sornione-la-rampa
    immagine: ambientazione/rovine-dei-precursori
    titolo: La rampa sotto il vetro
    sommario: "Una rampa senza parapetto scende a spirale lungo la canna, coperta di brina dura come lo zucchero."
    luogo: La Lente del Sornione, sotto il vetro
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 0]
    testo: |
      Dal portello esci su una rampa larga due passi, senza parapetto, che
      gira lungo la parete della canna. La brina è dura come lo zucchero
      sulle torte di festa, e lungo la parete corre una fila di borchie
      grandi come un pugno, all'altezza di una spalla molto più alta della
      tua.

      {acrobazia Media} Sul lato del vuoto la brina pende verso il basso e i
      piedi ci scivolano sopra. Contro la parete la presa è migliore.
    opzioni:
      - testo: "Scendere con la spalla contro la parete"
        descrizione: "I piedi di traverso, la spalla sul metallo gelato, un giro dopo l'altro."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La spalla alla parete
          testo: |
            Scendi con la spalla contro il metallo, un giro dopo l'altro, e al
            terzo giro la brina finisce e il ticchettio si fa più chiaro.
          pe: { acrobazia: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Lo scivolone
          testo: |
            Al primo giro il piede ti parte verso il vuoto, e risali in ginocchio
            fino al portello con le dita spellate dal gelo.
          effetti: { ferite: 0.5 }
      - testo: "Seguire le borchie della parete"
        descrizione: "Qualcuno scendeva qui con la mano sulle borchie, e forse sapeva dove mettere i piedi."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: I tondi asciutti
          testo: |
            Sotto le borchie più calde la brina si è sciolta in tondi asciutti, e
            scendi di tondo in tondo fino in fondo alla prima spirale.
          pe: { percezione: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: La borchia che gira
          testo: |
            Una borchia ti gira sotto la mano con uno scatto, e per tutta la canna
            corre un suono acuto di vetro, senza che tu sappia che cosa hai messo
            in moto.
          effetti: { tormento: 1 }
      - testo: "Calare la corda e scendere appeso"
        descrizione: "Una corda legata al maniglione del portello, se è abbastanza lunga."
        costo: 2
        esito:
          titolo: La corda corta
          testo: |
            La corda finisce prima della rampa del giro di sotto, e l'ultimo
            tratto lo fai saltando. La caviglia te lo fa pagare per il resto della
            discesa.
          effetti: { profondita.lente-del-sornione: 1, ferite: 0.5 }

  - id: lente-del-sornione-la-paratia-brinata
    immagine: ambientazione/rovine-dei-precursori
    titolo: La paratia brinata
    sommario: "Al primo giro una paratia coperta di brina chiude un arco basso nella parete."
    luogo: La Lente del Sornione, il primo giro della rampa
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 0]
    testo: |
      Al primo giro la rampa entra nella parete sotto un arco basso, chiuso
      da una paratia di metallo con la brina spessa un dito. Il freddo ti si
      posa sulle ciglia e scricchiola quando sbatti le palpebre. Al centro
      della paratia c'è una ruota incrostata di ghiaccio fino al mozzo, e
      lungo il bordo sinistro la brina è più sottile.
    opzioni:
      - testo: "Girare la ruota a forza"
        descrizione: "Il ghiaccio cede prima delle mani, se le mani tengono abbastanza."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: La ruota
          testo: |
            Con le mani avvolte nelle maniche tiri la ruota con tutto il peso,
            finché il ghiaccio si spacca intorno al mozzo e la paratia scivola di
            lato con un soffio d'aria più calda.
          pe: { resistenza: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Le dita bianche
          testo: |
            La ruota resta dov'è, e per un'ora le dita bianche ti pungono come se
            ci fossero dentro mille spilli.
          effetti: { ferite: 0.5 }
      - testo: "Cercare quello che passa sotto la brina sottile"
        descrizione: "Le paratie dei Precursori hanno sempre un meccanismo, e un meccanismo scalda."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il canale tiepido
          testo: |
            Sotto la brina sottile c'è un canale con una barra che si muove
            appena. La spingi col pollice dove è più calda, e la paratia scivola
            di lato.
          pe: { tecnologia: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: La lama incollata
          testo: |
            La lama si incolla al metallo gelato, e quando la strappi via il
            contraccolpo ti manda contro la parete dell'arco.
          effetti: { ferite: 0.5 }
      - testo: "Sciogliere il ghiaccio con l'olio della lanterna"
        descrizione: "Un filo d'olio acceso intorno al mozzo brucia l'olio, e un poco anche le mani."
        costo: 2
        esito:
          titolo: L'olio acceso
          testo: |
            Il ghiaccio si scioglie lento nella fiamma, e quando la ruota gira hai
            una scottatura sul dorso della mano e la lanterna mezza vuota.
          effetti: { profondita.lente-del-sornione: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · gli specchi e le lastre
  - id: lente-del-sornione-gli-specchi
    immagine: ambientazione/rovine-dei-precursori
    titolo: Gli specchi della canna
    sommario: "Più in basso la luce scende di specchio in specchio, e sotto uno storto la rampa è buia."
    luogo: La Lente del Sornione, la canna degli specchi
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 1]
    testo: |
      Più in basso la canna si passa la luce del Sornione da uno specchio
      all'altro, dischi lucidi grandi come scudi incassati di sbieco nella
      parete. Uno è storto di un palmo e manda la sua luce contro il metallo
      nudo, e da lì in giù la rampa sparisce nel buio. Sul retro dello
      specchio storto c'è un perno con una tacca.
    opzioni:
      - testo: "Raddrizzare lo specchio"
        descrizione: "Il perno ha una tacca, e lo specchio sta sopra il vuoto."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La luce che torna
          testo: |
            Ti sporgi sul vuoto e giri il perno fino alla tacca, e la luce azzurra
            scende di nuovo giro dopo giro, accendendo la rampa.
          pe: { tecnologia: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il lampo
          testo: |
            Giri il perno dalla parte sbagliata e lo specchio ti manda in faccia
            tutta la luce della canna, e per un pezzo ci vedi dentro due stelle
            che non se ne vanno.
          effetti: { tormento: 1 }
      - testo: "Scendere al buio con la mano sulle borchie"
        descrizione: "Al buio ci si muove a memoria, e qui la memoria sono le borchie."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: A memoria
          testo: |
            Scendi contando le borchie sotto le dita, tre passi fra una e l'altra,
            finché al quarto giro la luce dello specchio successivo ti viene
            incontro dal basso.
          pe: { resilienza: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il vuoto a destra
          testo: |
            A metà giro perdi il conto, e torni su all'indietro con la schiena
            contro la parete fino alla luce.
          effetti: { tormento: 1 }
      - testo: "Accendere la lanterna e scendere piano"
        descrizione: "Negli specchi la luce di una lanterna non resta ferma."
        costo: 2
        esito:
          titolo: Cento lanterne
          testo: |
            Gli specchi ti rimandano la lanterna da cento parti, e arrivi in basso
            con un mal di testa che ti batte dietro gli occhi.
          effetti: { profondita.lente-del-sornione: 1, tormento: 1 }

  - id: lente-del-sornione-le-lastre
    immagine: ambientazione/rovine-dei-precursori
    titolo: La stanza delle lastre
    sommario: "Una stanza nella parete piena di lastre di vetro sottili come fogli, con un cielo su ognuna."
    luogo: La Lente del Sornione, la stanza delle lastre
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 1]
    testo: |
      Una porta nella parete dà su una stanza lunga e stretta, con scaffali
      di metallo fino al soffitto e migliaia di lastre di vetro sottili come
      fogli, ognuna nella sua scanalatura. Ne sollevi una contro la luce, e
      dentro c'è un cielo di notte inciso a punti minuscoli. In fondo alla
      stanza un'altra porta riporta sulla rampa, più in basso.

      {origine allievo-di-torvessa} All'Accademia una lastra incisa dei
      Precursori si studia per un anno intero, chiusa in una teca. Qui ce ne
      sono migliaia, e nessuno le ha mai contate.
    opzioni:
      - testo: "Cercare dove finiscono le lastre"
        descrizione: "Se ogni lastra è una notte, l'ultima è l'ultima notte che qualcuno ha guardato."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La fila a metà
          testo: |
            Segui l'ordine delle scanalature fino in fondo alla stanza. L'ultima
            fila è piena solo a metà, e dopo l'ultima lastra ci sono scanalature
            vuote, con la polvere dentro, per tutti gli scaffali che restano.
          pe: { accademiche: 2 }
          effetti: { profondita.lente-del-sornione: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Mille cieli
          testo: |
            I cieli cominciano a somigliarsi tutti, e poi a muoversi, ed esci con
            le stelle ancora attaccate agli occhi.
          effetti: { tormento: 1 }
      - testo: "Sfilare una lastra senza far cadere la fila"
        descrizione: "Una lastra dei Precursori vale qualcosa anche sui Ponti, ma stanno strette."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Una notte in tasca
          testo: |
            Sfili piano una lastra con due dita senza muovere le vicine, e te la
            metti sotto la giubba avvolta nel fazzoletto, fredda per tutta la
            discesa.
          pe: { acrobazia: 2 }
          effetti: { profondita.lente-del-sornione: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Il domino
          testo: |
            La lastra si incastra e la fila intera si piega come un mazzo di
            carte. Ne salvi due, e una scheggia ti apre il dorso della mano.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare la stanza senza toccare niente"
        descrizione: "Le lastre restano dove sono. La porta in fondo riporta sulla rampa."
        costo: 2
        esito:
          titolo: Fra gli scaffali
          testo: |
            Attraversi la stanza con le mani in tasca, e uscendo ti accorgi di
            aver contato le file sottovoce, con il numero che non ti esce più
            dalla testa.
          effetti: { profondita.lente-del-sornione: 1, tormento: 1 }

  # ------------------------------------------------------------ 1–3 · il cielo sotto i piedi
  - id: lente-del-sornione-il-cielo-sotto-i-piedi
    immagine: ambientazione/marea-grigia
    titolo: Il cielo sotto i piedi
    sommario: "Per un giro la rampa è di vetro, e sotto i piedi si vedono le stelle."
    luogo: La Lente del Sornione, la rampa di vetro
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione >= 1, profondita.lente-del-sornione <= 3]
    testo: |
      Per un giro intero la rampa diventa di vetro spesso e trasparente, e
      sotto i tuoi piedi ci sono le stelle del Sornione, con le due che non
      conosci vicino all'orlo. Stanno così in basso che il corpo si convince
      di camminare sul soffitto del mondo.

      {atletica Facile fallita} Le ginocchia ti fanno sapere che preferiscono
      il metallo, e che se insisti cammineranno da sole, ma all'indietro.
    opzioni:
      - testo: "Camminare guardando le stelle"
        descrizione: "Le stelle stanno ferme e il vetro regge, se la testa accetta tutte e due le cose."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Sul soffitto del mondo
          testo: |
            Dopo una decina di passi il corpo smette di protestare, e a metà giro
            ti fermi a guardare le due stelle sconosciute, più vicine del resto,
            come lanterne appese più in basso.
          pe: { resilienza: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: La caduta che non viene
          testo: |
            A metà giro il corpo decide che stai cadendo e ti butta a terra a
            braccia aperte, e torni gattonando dove c'è il metallo.
          effetti: { tormento: 1 }
      - testo: "Correre fino al metallo"
        descrizione: "Un giro di vetro si fa di corsa, con gli occhi sulla parete."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Di corsa
          testo: |
            Corri con gli occhi sulla parete, e le stelle sotto di te diventano
            una striscia chiara che non guardi fino al metallo.
          pe: { atletica: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il piede sul vuoto
          testo: |
            A metà corsa guardi giù senza volerlo, e cadi in avanti sbucciandoti i
            palmi sul vetro.
          effetti: { ferite: 0.5 }
      - testo: "Passare strisciando con gli occhi chiusi"
        descrizione: "A occhi chiusi il vetro è soltanto un pavimento freddo e lungo."
        costo: 2
        esito:
          titolo: Il pavimento freddo
          testo: |
            Passi strisciando con la pancia sul vetro e le mani avanti a cercare
            il metallo, e il freddo ti entra nelle ossa del petto.
          effetti: { profondita.lente-del-sornione: 1, tormento: 1 }

  # ------------------------------------------------------------ 2 · gli occhi di guardia e la stanza del turno
  - id: lente-del-sornione-gli-occhi-di-guardia
    immagine: bestiario/salvaguardia-precursori
    titolo: Gli occhi di guardia
    sommario: "Due dischi di vetro galleggiano nella canna e stringono la luce del Sornione in un punto che brucia."
    luogo: La Lente del Sornione, la canna a metà
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 2]
    testo: |
      A metà della canna galleggiano sopra il vuoto due dischi di vetro
      cerchiati di metallo, che si girano insieme verso di te quando entri
      nella loro luce. La luce azzurra si stringe in un punto bianco, e sul
      gradino davanti ai tuoi piedi la brina fuma. Dove la parete fa ombra
      la luce non li raggiunge.

      {armi-da-distanza Media} Ruotano su un anello che ha bisogno di un
      momento per girarsi, come una balestra da ricaricare.
    opzioni:
      - testo: "Rompere gli occhi di guardia"
        descrizione: "Sono due e fra un colpo e l'altro sono lenti, e il vetro si rompe."
        combattimento: lente-del-sornione-occhi-di-guardia
        vittoria:
          titolo: I cocci
          testo: |
            Il secondo disco si spacca e cade tintinnando giù per la canna, e dal
            primo stacchi l'anello e quello che resta del meccanismo.
          effetti: { profondita.lente-del-sornione: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: Il punto bianco
          testo: |
            Il punto bianco ti trova la spalla e il braccio, e risali fino
            all'ombra a spegnere la giubba battendola contro la parete.
      - testo: "Passare nell'ombra della parete"
        descrizione: "Senza luce gli occhi di guardia sono soltanto vetro."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Nell'ombra
          testo: |
            Scendi con la schiena contro la parete, dentro la striscia d'ombra, e
            i dischi girano cercandoti nella luce mentre passi sotto di loro.
          pe: { furtivita: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il gomito nella luce
          testo: |
            Ti esce un gomito dall'ombra e la manica ti fuma, e risali con il
            braccio stretto al petto.
          effetti: { ferite: 0.5 }
      - testo: "Coprirsi con la giubba e correre"
        descrizione: "Una giubba sulla testa e una corsa lungo la rampa, a spese della giubba."
        costo: 2
        esito:
          titolo: La giubba bruciata
          testo: |
            Corri giù con la giubba sulla testa e la stoffa che ti fuma sulle
            spalle, e fuori dalla loro luce te la strappi di dosso e la pesti con
            i piedi.
          effetti: { profondita.lente-del-sornione: 1, ferite: 0.5 }

  - id: lente-del-sornione-la-stanza-del-turno
    immagine: ambientazione/rovine-dei-precursori
    titolo: La stanza del turno
    sommario: "Una stanza tonda con una sedia alta il doppio del normale, rivolta verso una finestrella sulla canna."
    luogo: La Lente del Sornione, la stanza del turno
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 2]
    testo: |
      Una porta bassa dà su una stanza tonda con una sola sedia di metallo,
      alta il doppio di una sedia, rivolta verso una finestrella sulla canna.
      Sul bracciolo destro il metallo è consumato in quattro solchi dalle dita
      che ci hanno tamburellato per anni, e ai piedi c'è una ciotola di semi
      neri secchi da prima della Caduta.

      {empatia Media} Chi stava qui faceva un turno lungo e noioso, e mangiava
      semi per tenersi sveglio. Non ti aspettavi di riconoscerti in un
      Precursore.
    opzioni:
      - testo: "Guardare dalla finestrella"
        descrizione: "Bisogna salire sulla sedia per vedere quello che vedeva lui."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Quello che guardava
          testo: |
            In fondo alla canna c'è una conca di vetro nero piena di stelle, e
            intorno all'orlo cammina piano una cosa con le gambe lunghe. Prendi a
            mente la strada più corta per arrivarci.
          pe: { percezione: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: La sedia alta
          testo: |
            Il metallo liscio ti scivola sotto le ginocchia e cadi di schiena
            sulla ciotola, e ti tocca raccogliere i semi uno per uno dal
            pavimento.
          effetti: { ferite: 0.5 }
      - testo: "Sederti al suo posto e aspettare"
        descrizione: "Una stanza fatta per aspettare insegna qualcosa a chi aspetta."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Il turno
          testo: |
            Tamburelli nei solchi del bracciolo, troppo distanti per la tua mano,
            finché ti accorgi che la finestrella ha una cerniera e dietro una
            scaletta di servizio che scende al fondo.
          pe: { empatia: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il sonno
          testo: |
            Il freddo ti addormenta, e ti svegli di soprassalto con la sensazione
            di aver mancato il cambio del turno.
          effetti: { tormento: 1 }
      - testo: "Tornare sulla rampa e proseguire"
        descrizione: "La sedia resta a chi l'ha consumata. La rampa scende comunque."
        costo: 2
        esito:
          titolo: I semi
          testo: |
            Più in basso trovi in tasca uno dei semi neri senza ricordare di
            averlo preso, e lo getti nel vuoto senza sentirlo arrivare.
          effetti: { profondita.lente-del-sornione: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · il cerchio delle nove tacche e la ruota
  - id: lente-del-sornione-il-cerchio-dei-nove
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il cerchio dei nove incavi
    sommario: "Sul pavimento di un pianerottolo, un cerchio di nove incavi con un occhio in quello più profondo."
    luogo: La Lente del Sornione, il pianerottolo del cerchio
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 3]
    testo: |
      Sul pavimento del pianerottolo è inciso un cerchio largo quanto un
      tavolo da osteria, con nove incavi grandi come una mano. Il nono è più
      fondo degli altri, e sul fondo ha un occhio aperto che manda la luce
      azzurra del Sornione. Dal centro parte un condotto spesso come un
      braccio, che sparisce sotto la parete verso nord-est.

      {accademiche Difficile} All'Anello del Camminatore, dicono i mandriani,
      le pietre nere sono nove anche loro. Forse un incavo per ogni posto, e
      questo ha il segno dell'occhio.
    opzioni:
      - testo: "Ricopiare il cerchio sul quaderno"
        descrizione: "Qualcuno alla Biblioteca saprà che farsene del cerchio e del condotto."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: Il disegno
          testo: |
            Ricopi il cerchio incavo per incavo, con l'occhio dentro quello
            profondo, e il condotto due volte perché la prima ti è venuto storto.
          pe: { accademiche: 2 }
          effetti: { profondita.lente-del-sornione: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: L'occhio acceso
          testo: |
            Appoggi il palmo sull'incavo dell'occhio e una luce fredda ti sale
            fino alla spalla, e il disegno resta a metà perché la mano trema
            troppo.
          effetti: { tormento: 1 }
      - testo: "Seguire il condotto con la lanterna"
        descrizione: "Quello che i Precursori hanno posato con tanta cura porta sempre da qualche parte."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La nota nel condotto
          testo: |
            Sotto la parete il condotto entra in una fessura da cui esce un filo
            d'aria, e vibra con una nota bassa che ti arriva nei denti. Accanto,
            una porticina riporta sulla rampa più giù.
          pe: { percezione: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: La fessura
          testo: |
            Il filo d'aria che esce dalla fessura ti lascia le punte delle dita
            bianche e insensibili per tutto il pomeriggio.
          effetti: { ferite: 0.5 }
      - testo: "Cercare l'incavo che riconosci"
        descrizione: "Hai già visto questo cerchio sotto la Spina dell'Eco, con la riga fra due onde nell'incavo profondo."
        quando: [misura.spina >= 1]
        esito:
          titolo: Due segni
          testo: |
            Qui l'incavo che sotto la Spina aveva la riga fra due onde è liscio e
            freddo. Ricopi i due segni uno accanto all'altro e riprendi la rampa.
          effetti: { profondita.lente-del-sornione: 1, informazioni.segreto: 1 }
      - testo: "Girare intorno al cerchio senza calpestarlo"
        descrizione: "Il pianerottolo è stretto, e il bordo è sul vuoto."
        costo: 2
        esito:
          titolo: Sul bordo
          testo: |
            Giri intorno al cerchio con i talloni sul vuoto, e dall'altra parte
            lasci tremare le gambe prima di riprendere la discesa.
          effetti: { profondita.lente-del-sornione: 1, ferite: 0.5 }

  - id: lente-del-sornione-la-ruota-del-ticchettio
    immagine: ambientazione/rovine-dei-precursori
    titolo: La ruota del ticchettio
    sommario: "Il ticchettio viene da una ruota dentata grande come una macina, che chiude la rampa."
    luogo: La Lente del Sornione, la ruota
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione == 3]
    testo: |
      Una ruota dentata grande come una macina chiude la rampa da parete a
      vuoto e gira di un dente a ogni colpo, e fra un dente e l'altro ci sta
      un corpo di traverso. Dall'altra parte la rampa scende verso una luce
      che non è più azzurra.

      {tecnologia Difficile} La ruota fa girare piano l'occhio di sotto,
      perché segua le stelle di dentro, e fermarla vuol dire fermare anche
      l'occhio.
    opzioni:
      - testo: "Passare fra i denti al tempo giusto"
        descrizione: "Bisogna contare con il corpo, perché la testa arriva tardi."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Fra i denti
          testo: |
            Al terzo colpo ti infili di traverso fra due denti, e il metallo ti
            passa a un dito dal naso. Al colpo dopo sei sulla rampa dall'altra
            parte, con le ginocchia molli.
          pe: { atletica: 2 }
          effetti: { profondita.lente-del-sornione: 1 }
        fallimento:
          titolo: Il dente
          testo: |
            Entri in ritardo, e il dente successivo ti spinge fuori come una mano
            impaziente, con il braccio che formicola fino alle dita.
          effetti: { ferite: 0.5 }
      - testo: "Bloccare la ruota con un cuneo"
        descrizione: "Un cuneo di ferro fra due denti ferma la ruota, e con lei quello che gira sotto."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il cuneo
          testo: |
            Infili il cuneo dove i denti toccano l'asse, e per la prima volta la
            canna è in silenzio. Passi con calma e togli il cuneo, e il ticchettio
            riprende dietro di te.
          pe: { tecnologia: 2 }
          effetti: { profondita.lente-del-sornione: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il cuneo che salta
          testo: |
            Il cuneo regge un colpo solo e poi schizza via accanto al tuo
            orecchio, lasciandoti un ronzio a sinistra.
          effetti: { tormento: 1 }
      - testo: "Aspettare il dente rotto"
        descrizione: "Su una ruota così vecchia c'è sempre un dente scheggiato, e lì c'è più spazio."
        costo: 2
        esito:
          titolo: Il giro lungo
          testo: |
            Il dente scheggiato torna dopo un giro intero della ruota, e passi nel
            suo spazio con il freddo dell'attesa nelle ginocchia.
          effetti: { profondita.lente-del-sornione: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · l'occhio
  - id: lente-del-sornione-l-occhio
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'occhio
    sommario: "In fondo alla canna, una conca di vetro nero piena del cielo di una notte, e il compasso che le cammina intorno."
    luogo: La Lente del Sornione, il fondo della canna
    area: lente-del-sornione
    requisiti: [profondita.lente-del-sornione >= 4, misura.sornione == 0]
    testo: |
      In fondo alla canna la rampa finisce su un anello di metallo largo
      come una piazza di paese, e nel mezzo c'è l'occhio, una conca di vetro
      nero rivolta verso l'alto. Dentro c'è un cielo di notte fermo, con
      ogni stella al suo posto, e le due che non conosci stanno basse dalla
      parte di nord-est, una sopra l'altra.

      Intorno all'orlo corre un quadrante a tacche fitte, e sul quadrante
      cammina il compasso, due gambe di metallo lunghe come lance unite in
      alto da un corpo piccolo come una cassa, che ogni tanto si china sul
      vetro a misurare la distanza fra due stelle. Quando la tua ombra tocca
      l'orlo, il corpo si gira verso di te.

      {furtivita Difficile} L'occhio prende luce soltanto dall'alto. Chi si
      tiene basso dietro l'orlo non fa ombra sul vetro, e il compasso misura
      soltanto le ombre.

      {origine accolito-del-velo} Le deposizioni dei superstiti della
      Caduta, in cripta, parlano tutte del suono, e nessuna dice com'era il
      cielo quella notte.

      *È il cielo di quella notte, e qualcuno l'ha tenuto da parte.* Sulla
      parete in fondo, accanto a una rastrelliera di lenti piccole, il
      condotto dei nove incavi entra nel muro verso nord-est.
    opzioni:
      - testo: "Affrontare il compasso"
        descrizione: "Il corpo sta lassù fra due gambe lunghe come lance, lontano dalla tua lama."
        combattimento: lente-del-sornione-il-compasso
        vittoria:
          titolo: Il cielo di quella notte
          testo: |
            Il compasso cade di traverso sull'orlo. Nell'occhio la stella bianca,
            la più grande, sta bassa sopra il nord-est a un palmo dall'orlo, con
            la rossa due dita più su, e sul quadrante cadono entrambe sulla tacca
            dell'ultima ora prima dell'alba. Ricopi tutto e sviti dal compasso la
            sua lente.

            {accademiche Media} Le cronache dicono che il suono venne poche ore
            prima della frattura, e adesso sai a che ora.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.sornione: 1, oggetto.lente-del-sornione-vetro-delle-due-stelle: 1, parte.camera-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Misurato
          testo: |
            La punta del compasso ti misura il fianco due volte, lasciando due
            tagli. Esci dal portello sulle stoppie che è già notte, e nel vetro
            c'è il sole.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Copiare il cielo senza fare ombra"
        descrizione: "Basso dietro l'orlo non fai ombra, e il compasso ti passerà vicino."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Dietro l'orlo
          testo: |
            Ti muovi carponi dietro l'orlo, e il compasso ti scavalca con una
            gamba e poi con l'altra. La stella bianca, la più grande, sta bassa
            sopra il nord-est a un palmo dall'orlo, con la rossa due dita più su,
            e sul quadrante cadono tutte e due sulla tacca dell'ultima ora prima
            dell'alba. Ricopi tutto, e strisciando via prendi dalla rastrelliera
            una lente piccola e una camera di cristallo.
          pe: { furtivita: 5 }
          effetti: { misura.sornione: 1, oggetto.lente-del-sornione-vetro-delle-due-stelle: 1, parte.camera-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'ombra sul vetro
          testo: |
            Alzi la testa di un dito e la tua ombra cade sull'occhio, e risali con
            la schiena aperta dalla punta del compasso, senza aver copiato niente.
          effetti: { ferite: 2, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ordinare al compasso di fermarsi"
        descrizione: "Il compasso misura da prima della Caduta, e forse aspetta qualcuno che gli dica di smettere."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Ferma
          testo: |
            La formula ti esce in una lingua che non è la tua, e il compasso si
            ferma con una gamba sollevata, come un airone. La stella bianca, la
            più grande, sta bassa sopra il nord-est a un palmo dall'orlo, con la
            rossa due dita più su, e cadono sulla tacca dell'ultima ora prima
            dell'alba. Ricopi tutto e prendi dalla rastrelliera una lente piccola
            e una camera di cristallo.
          pe: { magia: 5 }
          effetti: { misura.sornione: 1, oggetto.lente-del-sornione-vetro-delle-due-stelle: 1, parte.camera-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La formula spezzata
          testo: |
            La formula ti si spezza in bocca, e il compasso si mette a misurarti
            dalla testa ai piedi finché la punta ti entra nella coscia. Risali
            trascinando la gamba, senza le stelle.
          effetti: { ferite: 1.5, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Leggere l'ora sul quadrante come all'Accademia"
        descrizione: "All'Accademia hai letto quadranti a centinaia, e fuori dall'orlo il compasso non ti vede."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il conto delle tacche
          testo: |
            Conti le tacche a distanza, fermo sulla rampa, come ti ha insegnato
            Orvald. La stella bianca, la più grande, sta bassa sopra il nord-est a
            un palmo dall'orlo, con la rossa due dita più su, e cadono sulla tacca
            dell'ultima ora prima dell'alba. Quando il compasso è dall'altra parte
            prendi dalla rastrelliera una lente piccola e una camera di cristallo,
            e risali.
          pe: { accademiche: 5 }
          effetti: { misura.sornione: 1, oggetto.lente-del-sornione-vetro-delle-due-stelle: 1, parte.camera-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Le tacche ti danno due ore diverse, e mentre conti la terza volta la
            tua ombra tocca l'orlo. Risali con un taglio sul braccio e due ore
            sbagliate in testa.
          effetti: { ferite: 1.5, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Tornare su senza toccare niente"
        descrizione: "L'occhio resta dov'è, e il compasso pure. La rampa riporta al campo."
        costo: 0
        esito:
          titolo: La lunga salita
          testo: |
            Guardi l'occhio un'ultima volta e risali, e quando esci dal portello
            sulle stoppie la contadina è sull'aia e ti guarda arrivare.
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo · l'occhio, le altre volte
  - id: lente-del-sornione-l-occhio-che-resta
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'occhio, di nuovo
    sommario: "Il compasso si è rimesso in piedi intorno all'occhio, e il cielo di quella notte è sempre lì."
    luogo: La Lente del Sornione, il fondo della canna
    area: lente-del-sornione
    ripetibile: true
    requisiti: [profondita.lente-del-sornione >= 4, misura.sornione >= 1]
    testo: |
      L'occhio è come lo hai lasciato, con le due stelle basse sopra il
      nord-est. Il compasso si è rimesso in piedi, con una gamba raddrizzata
      alla meglio e più corta dell'altra, e cammina sull'orlo zoppicando
      appena. La rastrelliera delle lenti si è riempita a metà.

      {tecnologia Media} Qualcosa qui sotto ripara quello che rompi, con
      meno pezzi di prima.
    opzioni:
      - testo: "Abbattere di nuovo il compasso"
        descrizione: "Zoppica, e dentro forse c'è ancora qualcosa da prendere."
        combattimento: lente-del-sornione-il-compasso
        vittoria:
          titolo: La gamba corta
          testo: |
            Il compasso cade sulla gamba corta e non si rialza, e nel corpo trovi
            una camera di cristallo più piccola dell'altra volta e un guscio
            chiuso.
          effetti: { parte.camera-2: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: La punta
          testo: |
            Anche zoppo, il compasso misura bene. La punta ti trova due volte,
            e risali la canna premendoti la mano sul fianco.
          effetti: { tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Svuotare la rastrelliera strisciando dietro l'orlo"
        descrizione: "Le lenti nuove sono accanto al muro, e bisogna restare bassi come la prima volta."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Le lenti nuove
          testo: |
            Strisci dietro l'orlo fino alla rastrelliera e prendi due lenti,
            ancora tiepide di lavorazione, e un guscio chiuso dal ripiano più
            basso.
          pe: { furtivita: 2 }
          effetti: { reliquie.frammento-inciso: 2, reperto.sigillato: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'ombra
          testo: |
            La tua ombra finisce sotto la punta del compasso, che ti graffia la
