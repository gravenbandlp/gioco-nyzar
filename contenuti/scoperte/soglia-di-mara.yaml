    testo: "Arco di pietra nera senza muri ai lati, su un crinale senza strade. Il nome viene da una vecchia, Mara, per un motivo perso. Chi ci passa sotto al tramonto racconta di tre battiti di pioggia salata e di un fuoco di legna."

