glossario:
  - id: soglia-di-mara
    nome: Soglia di Mara
    tipo: luogo
    sottotitolo: Un luogo nero sul crinale a est della Roccia di Wren
    testo: "Un arco di pietra nera alto quattro metri e dritto come un filo a piombo, senza muri ai lati, su un crinale dove non è mai passata una strada. Il nome viene da una vecchia di nome Mara, e il motivo si è perso. Chi ci passa sotto al tramonto racconta di tre battiti di pioggia salata e di un fuoco di legna."

