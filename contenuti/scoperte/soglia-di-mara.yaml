# La Soglia di Mara (docs/piano-superficie.md, «Le nove spedizioni dei luoghi neri»). Un arco di pietra nera alto
# quattro metri, a piombo e senza muri, sul crinale di una collina a est della Roccia di Wren (codex
# sf-soglia-di-mara). È una porta di servizio: chi ci passa sotto al tramonto è per tre battiti dentro la Campana,
# sotto una scogliera della costa grigia a nord-est (la pioggia salata, il fuoco di legna). La spedizione scende nel
# crinale cavo, sotto la soglia, fino a un secondo arco uguale al primo, e non arriva mai alla Campana: la vede per
# tre battiti, e non si dice che cos'è.
# Ci si entra da `soglia-di-mara-il-crinale` (Superficie, ripetibile, traccia.mara >= 3).
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 la scala dai gradini lunghi o l'acqua di mare sul pianerottolo, 1 gli armadi stretti o lo sgabello della
# vecchia, 2 i granchi del sale (scontro) o le pompe, 3 il cerchio dei nove incavi o il fumo di legna; i tre
# battiti nel corridoio valgono da 1 a 3.
# Il cuore a 4 è la soglia di sotto (`soglia-di-mara-la-soglia-di-sotto`, misura.mara == 0): il portinaio con la
# cerata grigia (boss), oppure rifare il suo gesto, il Comando, o presentarsi come uno del turno (Difficili). La
# vittoria dà misura.mara, la Cerata del portinaio (grado 2) e parti dei Precursori. Dopo,
# `soglia-di-mara-tre-battiti-di-la` (ripetibile, misura.mara >= 1) rende meno: si passa di nuovo e si afferra
# quello che si trova nei tre battiti.
# La misura, per chi scrive la Campana: la chiave del passaggio è un gesto. Al tramonto si appoggia il palmo
# sinistro aperto sul pilastro di sinistra, all'altezza della spalla, e si passa sotto l'arco a occhi chiusi,
# contando i tre battiti. Chi lo fa resta dall'altra parte per tutto il tempo che tiene gli occhi chiusi (nel
# gioco, qui, non li tiene chiusi più di tre battiti). Di là si sono visti una parete di pietra nera bagnata, la
# pioggia salata che cade da una fessura in alto, il mare vicinissimo, un fuoco di legna di mare acceso in un
# braciere di ferro senza nessuno intorno, e nel pavimento un fascio di condotti che arrivano da sud-ovest.
# Lo sgabello, la pipa e lo scialle nella stanza della vecchia lasciano intendere che Mara scendeva qui. Non si dice.
# Il segno che lega i luoghi neri: il cerchio di nove incavi con uno inciso più a fondo (vedi lente-del-sornione.yaml),
# qui con dentro il segno della porta (la seconda pietra dell'Anello), e il condotto che va a nord-est.
aree:
  - id: soglia-di-mara
    immagine: ambientazione/roccia-di-wren
    nome: La Soglia di Mara
    sommario: "Sotto l'arco il crinale è cavo, e una scala scende in una collina che sa di mare."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Sotto la Soglia di Mara la collina è cava. Una scala con gradini
      lunghi il doppio di un passo scende nel crinale, fra pareti di pietra
      nera che trasudano sale, e più in basso l'aria sa di mare, anche se il
      mare è a giorni di cammino.

      Ogni tanto, nel buio, arriva un soffio di vento bagnato con l'odore di
      un fuoco di legna, e dopo tre battiti la collina torna asciutta.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: soglia-di-mara-il-crinale
    immagine: ambientazione/roccia-di-wren
    titolo: L'arco sul crinale
    sommario: "Sul crinale a est della Roccia di Wren, un arco di pietra nera senza muri e senza strada."
    luogo: Superficie Fratturata, il crinale a est della Roccia di Wren
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.mara >= 3]
    testo: |
      Verso ovest, oltre il Torvessa, la Roccia di Wren esce nera
      dall'acqua. Sulla gobba del crinale c'è l'arco, una pietra nera alta
      due volte un uomo, senza muri ai lati né una strada che ci arrivi. Al
      pilastro di sinistra sono annodati decine di stracci, e la soglia è
      consumata nel mezzo come i gradini di una chiesa vecchia.

      {origine figlio-della-citta-bassa} In Città Bassa le madri spaventano
      i bambini con la Roccia e con il Cucitore, e da quassù sembra soltanto
      un dito nero.

      Il sole cala dietro la Roccia, e la tua ombra attraversa la soglia.
    opzioni:
      - testo: "Passare sotto l'arco al tramonto"
        descrizione: "Dicono che siano tre battiti di pioggia salata, e dopo bisogna guardare dove si mettono i piedi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Tre battiti
          testo: |
            Per tre battiti di cuore sei al buio sotto una pioggia salata, con il
            mare dappertutto, e poi di nuovo sul crinale. Dietro di te la pietra
            della soglia si è sollevata di un palmo su una scala che scende nella
            collina.
          pe: { resilienza: 2 }
          vai: soglia-di-mara
        fallimento:
          titolo: In ginocchio
          testo: |
            La pioggia salata ti entra negli occhi e in bocca, e torni in
            ginocchio sull'erba, fradicio, con il sole tramontato e la soglia
            chiusa.
          effetti: { tormento: 0.5 }
      - testo: "Cercare la giuntura ai piedi dei pilastri"
        descrizione: "Una pietra consumata nel mezzo è stata calpestata da molti piedi diretti da qualche parte."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La pietra che si alza
          testo: |
            A quattro zampe trovi la fessura sottile lungo il bordo della pietra
            consumata, e con la lama la sollevi come un coperchio su una scala che
            scende nella collina.
          pe: { percezione: 2 }
          vai: soglia-di-mara
        fallimento:
          titolo: La lama spezzata
          testo: |
            La punta della lama si spezza con uno schiocco e ti apre il pollice, e
            lasci il crinale con il pollice in bocca.
          effetti: { ferite: 0.5 }
      - testo: "Salire a cavallo e lasciar fare il cavallo"
        descrizione: "Le bestie non passano sotto l'arco. Dove il cavallo si ferma, sotto c'è il vuoto."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il cavallo che non passa
          testo: |
            A dieci passi dall'arco il cavallo si pianta e batte lo zoccolo sempre
            nello stesso punto, dove la terra suona vuota. Scavi lì, e la pietra
            della soglia si solleva su una scala che scende.
          vai: soglia-di-mara
      - testo: "Scavare sotto la soglia con la pala"
        descrizione: "Sotto una pietra c'è terra, e ci vuole tutta la sera."
        costo: 2
        esito:
          titolo: La pala sotto la soglia
          testo: |
            Scavi accanto alla soglia fino a sera, con le mani piene di vesciche,
            finché la pietra si solleva da sola di un palmo su una scala che
            scende nella collina.
          effetti: { ferite: 0.5 }
          vai: soglia-di-mara

  # ------------------------------------------------------------ 0 · la scala e l'acqua di mare
  - id: soglia-di-mara-la-scala-lunga
    immagine: ambientazione/rovine-dei-precursori
    titolo: La scala dai gradini lunghi
    sommario: "Una scala nel crinale con gradini lunghi il doppio di un passo."
    luogo: La Soglia di Mara, la scala nel crinale
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 0]
    testo: |
      La scala scende dritta nella pietra nera, con gradini fatti per gambe
      più lunghe delle tue, lunghi il doppio di un passo e bassi la metà di
      un ginocchio, e il piede non sa mai se fare un passo o due. Sui bordi
      la pietra è lucida di umido, nel mezzo consumata come quella della
      soglia, e dal basso sale un'aria che sa di alga.

      {atletica Media} Due passi corti per gradino, e il corpo trova il
      ritmo da solo.
    opzioni:
      - testo: "Trovare il passo della scala"
        descrizione: "La scala ha un ritmo, e bisogna prenderlo con le gambe."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Due passi per gradino
          testo: |
            Due passi corti per ogni gradino, e dopo una ventina le gambe vanno da
            sole fino al pianerottolo in fondo.
          pe: { atletica: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il gradino umido
          testo: |
            Sbagli il passo su un bordo lucido e scendi tre gradini sul
            fondoschiena, con la lanterna alta per salvarla.
          effetti: { ferite: 0.5 }
      - testo: "Scendere nel mezzo, dove la pietra è consumata"
        descrizione: "Dove sono passati tutti, la pietra è più ruvida e il piede tiene."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Le impronte nella pietra
          testo: |
            Metti gli stivali nelle due conche consumate in mezzo ai gradini e
            allunghi il passo fino in fondo senza scivolare una volta.
          pe: { percezione: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il passo degli altri
          testo: |
            Le conche sono troppo distanti per le tue gambe, e ti ritrovi a gambe
            larghe su due gradini, ridicolo anche se non ti guarda nessuno.
          effetti: { tormento: 1 }
      - testo: "Scendere seduti, un gradino alla volta"
        descrizione: "Un gradino alla volta, e i pantaloni ne usciranno peggio di te."
        costo: 2
        esito:
          titolo: Seduto
          testo: |
            Scendi seduto con la lanterna fra le ginocchia, e in fondo ti alzi
            rigido, con l'umido nelle ossa e un dolore alla schiena che durerà un
            pezzo.
          effetti: { profondita.soglia-di-mara: 1, ferite: 0.5 }

  - id: soglia-di-mara-l-acqua-di-mare
    immagine: ambientazione/marea-grigia
    titolo: L'acqua di mare
    sommario: "Un pianerottolo allagato di acqua salata, con un granchio morto sul fondo."
    luogo: La Soglia di Mara, il pianerottolo allagato
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 0]
    testo: |
      A metà della scala c'è un pianerottolo allagato fino alla caviglia,
      con una crosta bianca sul fondo che scricchiola sotto gli stivali. In
      un angolo, a pancia all'aria, c'è un granchio rosso grande come un
      palmo. L'acqua esce da una fessura nella parete in fondo, accanto a
      una porta bassa con il bordo incrostato di sale.

      {natura Facile} È un granchio di mare, di quelli che i pescatori della
      costa vendono a cesti, ed è morto da poco.
    opzioni:
      - testo: "Seguire l'acqua fino alla fessura"
        descrizione: "L'acqua di mare non nasce in una collina. Dove entra, c'è un passaggio."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La fessura
          testo: |
            Dalla fessura l'acqua esce a gruppi di tre sbuffi, ognuno più freddo
            del precedente. Gratti via il sale dal bordo della porta bassa, e si
            apre su un corridoio asciutto.
          pe: { natura: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il granchio
          testo: |
            Ti chini sul granchio e una zampa si muove, e fai un salto indietro
            finendo seduto nell'acqua gelata. Quando ti rialzi è fermo come prima.
          effetti: { tormento: 1 }
      - testo: "Attraversare l'acqua e forzare la porta"
        descrizione: "Acqua gelata alle caviglie e una porta incrostata di sale."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il sale che cede
          testo: |
            Dai una spallata alla porta bassa con il gelo fino alle ginocchia, e
            il sale del bordo si spacca come zucchero cotto su un corridoio
            asciutto.
          pe: { resistenza: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: I piedi gelati
          testo: |
            Tre spallate e la porta non si muove, e risali la scala a scaldarti le
            dita dei piedi che non senti più.
          effetti: { ferite: 0.5 }
      - testo: "Svuotare il pianerottolo con l'elmo"
        descrizione: "Si butta l'acqua giù per la scala, mentre la fessura continua a dare."
        costo: 2
        esito:
          titolo: Il secchio
          testo: |
            Svuoti il pianerottolo con la scodella da campo finché resta soltanto
            bagnato, e la porta bassa si apre con una spinta. Hai le mani
            screpolate dal sale.
          effetti: { profondita.soglia-di-mara: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · gli armadi e lo sgabello
  - id: soglia-di-mara-gli-armadi
    immagine: ambientazione/rovine-dei-precursori
    titolo: Gli armadi stretti
    sommario: "Un corridoio di armadi alti e stretti, tutti aperti tranne uno."
    luogo: La Soglia di Mara, il corridoio degli armadi
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 1]
    testo: |
      Il corridoio ha su un lato una fila di armadi di metallo alti il
      doppio di un uomo e stretti quanto una spalla, vuoti, con un gancio in
      alto e una mensola per gli stivali. Sono tutti aperti tranne l'ultimo,
      che ha sullo sportello una placca tiepida con una mano aperta incisa.

      {origine apprendista-raschiatore} Al Ponte dei Morti le squadre
      lasciano la roba nelle cassette prima di scendere e la ritrovano al
      ritorno. Qui non l'ha ripresa più nessuno.
    opzioni:
      - testo: "Appoggiare la mano sulla placca"
        descrizione: "Una mano incisa chiede una mano, e forse la tua basta."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Lo sportello
          testo: |
            La placca si scalda sotto il palmo finché lo sportello scatta. Sulla
            mensola c'è un guscio di metallo chiuso accanto a un paio di stivali
            lunghi come il tuo braccio, e prendi soltanto il guscio.
          pe: { tecnologia: 2 }
          effetti: { profondita.soglia-di-mara: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La scossa
          testo: |
            La placca ti morde il palmo con una scossa fino al gomito, e per un
            po' le dita si aprono e chiudono per conto loro.
          effetti: { ferite: 0.5 }
      - testo: "Frugare negli armadi aperti"
        descrizione: "Negli armadi lasciati in fretta qualcosa resta sempre in fondo alla mensola."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: In fondo alla mensola
          testo: |
            In fondo alla settima mensola trovi una scheggia di metallo lucido,
            rotonda come una moneta e bucata nel mezzo, e prosegui con la scheggia
            in tasca.
          pe: { percezione: 2 }
          effetti: { profondita.soglia-di-mara: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Lo sportello che sbatte
          testo: |
            Uno sportello ti si richiude sulle dita con un colpo che rimbomba per
            tutto il corridoio, e aspetti che qualcuno venga a vedere.
          effetti: { ferite: 0.5 }
      - testo: "Passare oltre senza toccare niente"
        descrizione: "Gli armadi sono di qualcuno. Il corridoio va avanti lo stesso."
        costo: 2
        esito:
          titolo: La fila degli armadi
          testo: |
            Passi davanti agli armadi senza toccarli e ne conti trentasei. Dopo
            l'ultimo ti sembra di sentire alle spalle uno sportello che si apre
            piano.
          effetti: { profondita.soglia-di-mara: 1, tormento: 1 }

  - id: soglia-di-mara-lo-sgabello
    immagine: ambientazione/roccia-di-wren
    titolo: Lo sgabello della vecchia
    sommario: "Nella nicchia di un corridoio, le cose vecchie di qualcuno della gente di sopra."
    luogo: La Soglia di Mara, la nicchia dello sgabello
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 1]
    testo: |
      In una nicchia del corridoio c'è uno sgabello da mungitura di legno,
      rivolto verso il basso, e accanto una pipa di coccio annerita e uno
      scialle di lana mangiato dalle tarme. Sulla parete, all'altezza di chi
      sta seduto, ci sono file di tacche graffiate con un chiodo, a gruppi
      di sette.

      {empatia Media} Chi si sedeva qui veniva spesso e restava a lungo, e
      si portava lo scialle perché sapeva che avrebbe preso freddo.
    opzioni:
      - testo: "Sedersi sullo sgabello e guardare dove guardava lei"
        descrizione: "Lo sgabello guarda in una direzione precisa."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La vista dallo sgabello
          testo: |
            Dallo sgabello si vede in fondo al corridoio una lama di luce
            arancione che scende da una fessura del soffitto, il tramonto di
            sopra. Chi sedeva qui contava i tramonti, e tu scendi verso la luce.
          pe: { empatia: 2 }
          effetti: { profondita.soglia-di-mara: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Lo sgabello che cede
          testo: |
            Una gamba dello sgabello si spezza e finisci per terra con lo scialle
            in testa e un odore di tabacco vecchio nel naso.
          effetti: { tormento: 1 }
      - testo: "Guardare nel fornello della pipa"
        descrizione: "Una pipa lasciata a metà ha ancora dentro quello che si fumava, e a volte altro."
        prova: { attributo: mentale, abilita: [percezione, medicina], difficolta: Media }
        successo:
          titolo: La conchiglia
          testo: |
            Sotto la cenere secca c'è una conchiglia bianca avvolta in un pezzo di
            carta da tabacco, a giorni di cammino da qualsiasi mare. La rimetti
            nella pipa.
          pe: { percezione: 2 }
          effetti: { profondita.soglia-di-mara: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La cenere
          testo: |
            Soffi nel fornello e ti arriva in faccia la cenere vecchia, e mentre
            tossisci la pipa ti scivola di mano e si scheggia.
          effetti: { tormento: 1 }
      - testo: "Lasciare le sue cose e proseguire"
        descrizione: "Chi le ha lasciate non tornerà a prenderle."
        costo: 2
        esito:
          titolo: Le tacche
          testo: |
            Per scrupolo conti le tacche sulla parete, e sono così tante che a
            metà perdi il conto e prosegui con la testa piena di gruppi di sette.
          effetti: { profondita.soglia-di-mara: 1, tormento: 1 }

  # ------------------------------------------------------------ 1–3 · i tre battiti nel corridoio
  - id: soglia-di-mara-i-tre-battiti
    immagine: ambientazione/marea-grigia
    titolo: I tre battiti
    sommario: "Nel corridoio, ogni tanto, per tre battiti arrivano il vento bagnato e il mare."
    luogo: La Soglia di Mara, il corridoio lungo
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara >= 1, profondita.soglia-di-mara <= 3]
    testo: |
      Il corridoio scende piano e a lungo, e a metà arriva il primo soffio.
      Per tre battiti sei in un vento bagnato che ti tira i vestiti, con la
      pioggia salata in faccia e il rumore del mare vicino, poi di nuovo nel
      corridoio asciutto con i capelli che gocciolano. Dopo un poco arriva il
      secondo, più lungo.

      {resilienza Media} Il corridoio è sempre lo stesso, ed è il resto che
      si sposta.
    opzioni:
      - testo: "Continuare a camminare durante i soffi"
        descrizione: "Il corridoio resta sotto i piedi, anche quando la testa dice di no."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Dritto
          testo: |
            A ogni soffio tieni gli occhi sulla lanterna e cammini un passo per
            battito fino in fondo, dove arrivi con la giubba fradicia e la testa
            sgombra.
          pe: { resilienza: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il mare in testa
          testo: |
            Al quarto soffio ti fermi, e quando il corridoio torna cammini nella
            direzione sbagliata finché ritrovi le tue impronte bagnate.
          effetti: { tormento: 1 }
      - testo: "Correre fra un soffio e l'altro"
        descrizione: "Fra un soffio e l'altro il corridoio è asciutto, e si può correre."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Fra i soffi
          testo: |
            Corri fra un soffio e l'altro e ti fermi contro la parete quando
            arrivano, e al quinto scatto sei in fondo, con le mani sulle
            ginocchia.
          pe: { atletica: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il soffio a metà corsa
          testo: |
            Un soffio ti prende a metà corsa, e quando torni inciampi nel
            pavimento vero, più in basso di un dito, e cadi lungo.
          effetti: { ferite: 0.5 }
      - testo: "Sedersi e lasciar passare i soffi"
        descrizione: "Seduti contro la parete i soffi passano sopra, ma si perde tempo."
        costo: 2
        esito:
          titolo: Contro la parete
          testo: |
            Ne conti undici con gli occhi chiusi, e ti rialzi con la giubba
            incrostata di sale e un rumore di risacca nella testa.
          effetti: { profondita.soglia-di-mara: 1, tormento: 1 }

  # ------------------------------------------------------------ 2 · i granchi del sale e le pompe
  - id: soglia-di-mara-i-granchi-del-sale
    immagine: bestiario/salvaguardia-precursori
    titolo: I granchi del sale
    sommario: "In una sala bassa due gusci di metallo raschiano il sale del pavimento con le pinze."
    luogo: La Soglia di Mara, la sala bassa
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 2]
    testo: |
      La sala è bassa e larga, con il pavimento coperto di sale come una
      salina, e due gusci di metallo grandi come tamburelli lo raschiano con
      le pinze e lo ammucchiano contro le pareti, alto fino al petto lungo
      quella di destra. Quando entra la tua lanterna si fermano, con le pinze
      alzate.

      {rissa Media} Sono bassi, con la pancia a un palmo da terra. Un calcio
      da sotto li rovescia, e un guscio rovesciato non si raddrizza in
      fretta.
    opzioni:
      - testo: "Affrontare i granchi"
        descrizione: "Due gusci bassi e due pinze ciascuno. Da sotto si rovesciano."
        combattimento: soglia-di-mara-granchi-del-sale
        vittoria:
          titolo: A pancia all'aria
          testo: |
            Il secondo granchio resta a pancia all'aria nel sale, e gli stacchi le
            pinze e il pezzo di macchina che porta sulla schiena.
          effetti: { profondita.soglia-di-mara: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: Le pinze
          testo: |
            Le pinze ti stringono il polpaccio finché non lasci la lanterna, e i
            granchi tornano a raschiare mentre te ne vai zoppicando.
      - testo: "Passare dietro i cumuli di sale"
        descrizione: "Chi si tiene basso dietro i cumuli lungo la parete non si vede."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Dietro il sale
          testo: |
            Passi chinato dietro i cumuli con la lanterna coperta dalla mano,
            sentendo le pinze grattare dall'altra parte, e prendi la porta in
            fondo senza rumore.
          pe: { furtivita: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il cumulo che frana
          testo: |
            Sfiori un cumulo e il sale ti frana addosso, e scappi dalla porta da
            cui sei entrato con un taglio sul polso.
          effetti: { ferite: 0.5 }
      - testo: "Gettare il sale in mezzo alla sala e passare"
        descrizione: "Se trovano altro sale in mezzo alla sala, forse hanno da fare."
        costo: 2
        esito:
          titolo: Il lavoro dei granchi
          testo: |
            Spargi il sale a manciate in mezzo alla sala e i granchi ci si buttano
            sopra, e passi lungo la parete con un solo pizzico alla caviglia.
          effetti: { profondita.soglia-di-mara: 1, ferite: 0.5 }

  - id: soglia-di-mara-le-pompe
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le pompe
    sommario: "Quattro pistoni rimandano su l'acqua salata, ma uno è fermo e l'acqua sale."
    luogo: La Soglia di Mara, la sala delle pompe
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 2]
    testo: |
      Nella sala quattro pistoni grandi come tronchi si alzano e si abbassano
      lenti, rimandando l'acqua salata su per un condotto nel soffitto. Uno è
      fermo a metà corsa, e lì l'acqua arriva alla vita e la porta dall'altra
      parte è mezza sommersa.

      {tecnologia Media} Il pistone fermo ha la leva di sblocco sul fianco,
      sott'acqua. Qualcuno l'ha fermato, oppure il sale l'ha incastrato.
    opzioni:
      - testo: "Sbloccare il pistone fermo"
        descrizione: "La leva è sott'acqua sul fianco del pistone, e va trovata al tatto."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il quarto pistone
          testo: |
            Trovi la leva al tatto e la tiri verso di te, e il pistone riparte con
            un colpo che ti scuote le ossa mentre l'acqua cala fino alle
            ginocchia.
          pe: { tecnologia: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: La leva sbagliata
          testo: |
            Tiri la leva dalla parte sbagliata e si ferma un altro pistone, e
            torni alla scala fradicio fino al collo.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare a nuoto fino alla porta"
        descrizione: "Alla porta l'acqua è più alta, e si passa sotto a bracciate nel freddo."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: Sotto la porta
          testo: |
            Ti immergi con gli occhi aperti nel sale che brucia e passi sotto
            l'architrave a bracciate, e riemergi in un corridoio con l'acqua alle
            caviglie, a sputare sale.
          pe: { atletica: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: L'architrave
          testo: |
            Sott'acqua batti la testa contro l'architrave e riemergi dalla parte
            sbagliata con un bernoccolo e la bocca piena di sale.
          effetti: { ferite: 1 }
      - testo: "Aspettare che le pompe abbassino l'acqua"
        descrizione: "Tre pistoni su quattro lavorano ancora e prima o poi l'acqua scende."
        costo: 2
        esito:
          titolo: L'attesa nell'acqua
          testo: |
            L'acqua scende un dito alla volta, tanto piano che ti sorprendi a
            battere il tempo col piede, e quando la porta è libera hai le gambe
            intirizzite.
          effetti: { profondita.soglia-di-mara: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · il cerchio delle nove tacche e il fumo
  - id: soglia-di-mara-il-cerchio-dei-nove
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il cerchio sotto la fessura
    sommario: "Un cerchio di nove incavi sotto una fessura del soffitto, e in quello profondo una porta."
    luogo: La Soglia di Mara, la sala del cerchio
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 3]
    testo: |
      In una sala tonda una lama di luce scende da una fessura del soffitto e
      si posa su un cerchio inciso nel pavimento, largo quanto un tavolo da
      osteria, con nove incavi lungo il bordo. Il nono è più fondo degli
      altri, con dentro il segno di una porta, un arco su due pilastri che
      manda una luce arancione sua. Dal centro parte un condotto di metallo
      grosso come un braccio, che entra sotto la parete di nord-est.

      {percezione Media} La lama di luce scivola sul pavimento. Fra poco
      arriverà sull'incavo della porta, e lassù sarà il tramonto.
    opzioni:
      - testo: "Ricopiare il cerchio sul quaderno"
        descrizione: "Qualcuno alla Biblioteca saprà leggere gli incavi e il condotto verso nord-est."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: Il disegno
          testo: |
            Ricopi il cerchio con la porta nell'incavo profondo e il condotto
            segnato da una freccia, e quando la luce arriva sulla porta senti per
            tre battiti il mare lontano sotto il pavimento.
          pe: { accademiche: 2 }
          effetti: { profondita.soglia-di-mara: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: La luce sulla mano
          testo: |
            La lama di luce ti passa sulla mano, e la ritiri bagnata e gelata fino
            al polso, troppo intirizzita per tenere la matita.
          effetti: { tormento: 1 }
      - testo: "Seguire il condotto fino alla parete"
        descrizione: "Dove va il condotto va qualcosa, e forse anche la strada."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La nota nel condotto
          testo: |
            Il condotto entra in una fessura della parete e vibra con una nota che
            senti nei denti, e accanto un passaggio stretto scende verso un'aria
            che sa di fumo.
          pe: { percezione: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il freddo della fessura
          testo: |
            Il filo d'aria della fessura ti lascia le dita bianche e insensibili,
            e torni indietro a scaldartele sotto le ascelle.
          effetti: { ferite: 0.5 }
      - testo: "Cercare l'incavo che riconosci"
        descrizione: "Lo hai già visto sotto il Sornione, con un occhio nell'incavo profondo."
        quando: [misura.sornione >= 1]
        esito:
          titolo: Due segni
          testo: |
            L'incavo che sotto il Sornione aveva l'occhio qui è liscio e freddo.
            Ricopi i due segni uno accanto all'altro e prosegui.
          effetti: { profondita.soglia-di-mara: 1, informazioni.segreto: 1 }
      - testo: "Aspettare che la luce passi e proseguire"
        descrizione: "Quando la luce è passata, la sala è soltanto una sala."
        costo: 2
        esito:
          titolo: Il tramonto di sotto
          testo: |
            Quando la lama di luce passa sull'incavo della porta ti arriva addosso
            un soffio di pioggia salata da nessuna parte, e prosegui con la giubba
            che gocciola.
          effetti: { profondita.soglia-di-mara: 1, ferite: 0.5 }

  - id: soglia-di-mara-il-fumo
    immagine: ambientazione/roccia-di-wren
    titolo: Il fumo di legna
    sommario: "Più giù il passaggio sa di fuoco di legna, e il fumo esce da una grata a sbuffi di tre."
    luogo: La Soglia di Mara, il passaggio del fumo
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 3]
    testo: |
      Il passaggio si stringe e l'aria sa di fuoco di legna. Il fumo esce
      caldo da una grata nel muro, a sbuffi di tre, con un pizzico di
      salsedine che ti resta sulle labbra, ma oltre la grata non si vede
      nessun fuoco, e il passaggio prosegue dentro il fumo.

      {natura Media} È legno di mare, quello che le onde portano a riva
      sbiancato e salato, e fuma più del legno di bosco.
    opzioni:
      - testo: "Attraversare il fumo con un panno sulla bocca"
        descrizione: "Un panno bagnato sulla bocca e gli occhi socchiusi, per un passaggio lungo."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Difficile }
        successo:
          titolo: Nel fumo
          testo: |
            Con il fazzoletto bagnato sulla bocca cammini nel fumo contando i
            passi finché si dirada davanti a una porta alta, su una sala grande.
          pe: { resistenza: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: La tosse
          testo: |
            A metà la tosse ti piega in due, e torni indietro a tentoni a sputare
            grigio.
          effetti: { ferite: 0.5 }
      - testo: "Seguire gli sbuffi e passare negli intervalli"
        descrizione: "Fra un gruppo di sbuffi e l'altro l'aria si schiarisce, e si va di corsa."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Gli intervalli
          testo: |
            Ogni tre sbuffi c'è una pausa lunga, e in quattro pause di corsa
            arrivi davanti a una porta alta che dà su una sala grande.
          pe: { percezione: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il conto del fumo
          testo: |
            Sbagli il conto e lo sbuffo ti prende in faccia, e torni indietro con
            gli occhi pieni di lacrime ad aspettare che passi.
          effetti: { tormento: 1 }
      - testo: "Aspettare che il fumo si diradi"
        descrizione: "Prima o poi il fuoco si abbassa, e intanto il fumo si attacca ai vestiti."
        costo: 2
        esito:
          titolo: L'odore addosso
          testo: |
            Quando gli sbuffi si fanno radi passi fino a una porta alta, con i
            vestiti che puzzeranno di legna di mare per giorni.
          effetti: { profondita.soglia-di-mara: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · la soglia di sotto
  - id: soglia-di-mara-la-soglia-di-sotto
    immagine: bestiario/salvaguardia-precursori
    titolo: La soglia di sotto
    sommario: "In fondo al crinale c'è un secondo arco di pietra nera, e accanto il portinaio con il suo bastone."
    luogo: La Soglia di Mara, la sala dell'arco
    area: soglia-di-mara
    requisiti: [profondita.soglia-di-mara >= 4, misura.mara == 0]
    testo: |
      La sala è alta come una navata, e in mezzo c'è un arco di pietra nera
      uguale a quello del crinale, senza muri ai lati e con la parete di
      fondo dietro. Da una fessura del soffitto la luce arancione del
      tramonto di sopra scivola sul pavimento verso la soglia.

      Accanto al pilastro di sinistra c'è il portinaio, alto il doppio di te
      e sottile come un palo, chiuso in una cerata grigia fino ai piedi e
      appoggiato a un bastone lungo quanto lui. Quando la luce tocca la
      soglia appoggia il palmo sinistro sul pilastro all'altezza della
      spalla e abbassa la testa. Per tre battiti l'arco si riempie di
      pioggia salata, poi è di nuovo pietra, e il portinaio alza la testa e
      si gira verso di te.

      {origine accolito-del-velo} Al Velo il verbale del mercante che passò
      sotto l'arco è archiviato fra le deposizioni senza seguito, e nessuno
      è mai venuto quaggiù a vedere.

      {percezione Media} Quando abbassa la testa il portinaio chiude le
      fessure della maschera, e passa la soglia a occhi chiusi.
    opzioni:
      - testo: "Affrontare il portinaio"
        descrizione: "È alto il doppio di te e il bastone arriva lontano, ma sotto la cerata è sottile come un palo."
        combattimento: soglia-di-mara-il-portinaio
        vittoria:
          titolo: La porta di Mara
          testo: |
            Il portinaio scivola lungo il pilastro e gli sfili la cerata. Al
            tramonto rifai il suo gesto, il palmo sinistro sul pilastro
            all'altezza della spalla, e passi a occhi chiusi nella pioggia salata.
            Al terzo battito socchiudi gli occhi su un braciere di legna di mare
            acceso senza nessuno intorno e su un fascio di condotti che arrivano
            da sud-ovest, e poi sei sotto l'arco di sotto, fradicio.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.mara: 1, oggetto.soglia-di-mara-cerata-del-portinaio: 1, parte.involucro-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Il bastone
          testo: |
            Il bastone arriva da lontano, e al terzo colpo il portinaio ti spinge
            fuori dalla sala con la punta, come si spazza la soglia di casa.
            Risali con le costole che fanno male a ogni gradino.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Rifare il suo gesto accanto a lui"
        descrizione: "Il palmo sul pilastro e gli occhi chiusi, e bisogna farlo uguale a lui."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Difficile }
        successo:
          titolo: Uno del turno
          testo: |
            Al tramonto, accanto al portinaio, appoggi come lui il palmo sinistro
            sul pilastro all'altezza della spalla e passi a occhi chiusi nella
            pioggia salata. Al terzo battito socchiudi gli occhi su un braciere di
            legna di mare acceso senza nessuno intorno e su un fascio di condotti
            che arrivano da sud-ovest. Sotto l'arco di sotto il portinaio ti porge
            una cerata grigia, come a uno del turno che torna.
          pe: { percezione: 5 }
          effetti: { misura.mara: 1, oggetto.soglia-di-mara-cerata-del-portinaio: 1, parte.involucro-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il gesto sbagliato
          testo: |
            Appoggi la mano troppo in basso, e il bastone ti prende sotto le
            costole e ti butta contro la parete. Esci dalla sala strisciando.
          effetti: { ferite: 2, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ordinare al portinaio di farsi da parte"
        descrizione: "Un portinaio obbedisce a chi ha il diritto di dargli ordini."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Da parte
          testo: |
            Alla formula il portinaio si fa da parte e ti mostra il gesto, piano.
            Appoggi il palmo sinistro sul pilastro e passi a occhi chiusi nella
            pioggia salata, con il mare vicinissimo. Al terzo battito socchiudi
            gli occhi su un braciere di legna di mare acceso senza nessuno intorno
            e su un fascio di condotti che arrivano da sud-ovest. Sotto l'arco di
            sotto il portinaio ti porge una cerata grigia.
          pe: { magia: 5 }
          effetti: { misura.mara: 1, oggetto.soglia-di-mara-cerata-del-portinaio: 1, parte.involucro-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'ordine a metà
          testo: |
            La formula si spezza a metà, e il portinaio ti spinge fuori a colpi
            secchi sulle spalle, senza fretta.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Presentarti al portinaio come uno del turno"
        descrizione: "Bisogna presentarsi come uno che ha il diritto di passare, senza esitare."
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Difficile }
        successo:
          titolo: Il cambio del turno
          testo: |
            Fai al portinaio un cenno breve da collega, e lui risponde allo stesso
            modo e ti mostra il gesto. Lo rifai e passi a occhi chiusi nella
            pioggia salata. Al terzo battito socchiudi gli occhi su un braciere di
            legna di mare acceso senza nessuno intorno e su un fascio di condotti
            che arrivano da sud-ovest. Sotto l'arco di sotto il portinaio ti porge
            una cerata grigia.
          pe: { galateo: 5 }
          effetti: { misura.mara: 1, oggetto.soglia-di-mara-cerata-del-portinaio: 1, parte.involucro-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'estraneo
          testo: |
            Ti tremano le mani, e il portinaio lo vede. Con la punta del bastone
            sul petto ti spinge fuori dalla sala, e risali con un livido tondo
            sullo sterno.
          effetti: { ferite: 1, scandalo: 1 }
          vai: superficie-fratturata
      - testo: "Tornare su senza passare"
        descrizione: "L'arco resta dov'è, e il portinaio pure. La scala riporta al crinale."
        costo: 0
        esito:
          titolo: Il crinale di sera
          testo: |
            Guardi la luce scivolare sulla soglia un'ultima volta e risali, e sul
            crinale è sera e gli stracci si muovono nel vento del fiume.
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo · tre battiti di là
  - id: soglia-di-mara-tre-battiti-di-la
    immagine: bestiario/salvaguardia-precursori
    titolo: Tre battiti di là
    sommario: "Il portinaio è di nuovo al suo posto, e di là ci sono tre battiti per prendere qualcosa."
    luogo: La Soglia di Mara, la sala dell'arco
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara >= 4, misura.mara >= 1]
    testo: |
      Il portinaio è di nuovo accanto al pilastro, con una cerata grigia
      nuova, e quando entri ti guarda le mani. La luce del tramonto scivola
      verso la soglia, e sul gancio accanto all'arco pende un'altra cerata,
      ripiegata con cura.

      {percezione Media} Di là, nei tre battiti, la mano arriva a un passo di
      distanza, e accanto al braciere c'erano cose posate per terra.
    opzioni:
      - testo: "Passare e afferrare quello che c'è"
        descrizione: "Di là hai tre battiti, e gli occhi chiusi per i primi due."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Quello che hai preso
          testo: |
            Al terzo battito allunghi la mano verso il braciere, e torni fradicio
            con un guscio di metallo incrostato di sale e un pezzo di cassa
            grigia. Il portinaio non dice niente.
          pe: { acrobazia: 2 }
          effetti: { reperto.sigillato: 1, parte.involucro-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La mano vuota
          testo: |
            Apri gli occhi un battito troppo presto e il mare ti entra in bocca, e
            torni a mani vuote con le dita scottate dal braciere.
          effetti: { ferite: 1 }
          vai: superficie-fratturata
      - testo: "Abbattere di nuovo il portinaio"
        descrizione: "Sotto la cerata nuova c'è lo stesso corpo sottile, e qualcosa da smontare."
        combattimento: soglia-di-mara-il-portinaio
        vittoria:
          titolo: La cerata nuova
          testo: |
            Il portinaio scivola giù lungo il pilastro come l'altra volta, e gli
            sfili dal petto un pezzo di macchina intero.
          effetti: { parte.involucro-2: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Spazzato via
          testo: |
            Il bastone ti spinge fuori dalla sala come la prima volta, senza
            fretta. Risali il crinale con le costole doloranti.
          effetti: { tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Passare per tre battiti e tornare"
        descrizione: "Il mare di là vale la fatica di guardarlo."
        costo: 0
        esito:
          titolo: Il mare
          testo: |
            Per tre battiti stai sotto la pioggia salata con il mare che batte
            vicino, e risali il crinale con il sale sulle labbra.
          vai: superficie-fratturata

nemici:
  - id: soglia-di-mara-granchio-del-sale
    immagine: bestiario/salvaguardia-precursori
    nome: Granchio del sale
