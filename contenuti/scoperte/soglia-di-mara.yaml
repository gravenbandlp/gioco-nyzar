# La Soglia di Mara (docs/piano-superficie.md, «Le nove spedizioni dei luoghi neri»). Un arco di pietra nera alto
# quattro metri, a piombo e senza muri, sul crinale di una collina a est della Roccia di Wren (codex
# sf-soglia-di-mara). È una porta di servizio: chi ci passa sotto al tramonto è per tre battiti dentro la Campana,
# sotto una scogliera della costa grigia a nord-est (la pioggia salata, il fuoco di legna). La spedizione scende nel
# crinale cavo, sotto la soglia, fino a un secondo arco uguale al primo, e non arriva mai alla Campana: la vede per
# tre battiti, e non si dice che cos'è.
# Ci si entra da `soglia-di-mara-il-crinale` (Superficie, ripetibile, traccia.mara >= 3).
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 la scala dai gradini lunghi o l'acqua di mare sul pianerottolo, 1 gli armadi stretti o lo sgabello della
# vecchia, 2 i granchi del sale (scontro) o le pompe, 3 il cerchio dei nove incavi o il fumo di legna; i tre
# battiti nel corridoio valgono da 1 a 3.
# Il cuore a 4 è la soglia di sotto (`soglia-di-mara-la-soglia-di-sotto`, misura.mara == 0): il portinaio con la
# cerata grigia (boss), oppure rifare il suo gesto, il Comando, o presentarsi come uno del turno (Difficili). La
# vittoria dà misura.mara, la Cerata del portinaio (grado 2) e parti dei Precursori. Dopo,
# `soglia-di-mara-tre-battiti-di-la` (ripetibile, misura.mara >= 1) rende meno: si passa di nuovo e si afferra
# quello che si trova nei tre battiti.
# La misura, per chi scrive la Campana: la chiave del passaggio è un gesto. Al tramonto si appoggia il palmo
# sinistro aperto sul pilastro di sinistra, all'altezza della spalla, e si passa sotto l'arco a occhi chiusi,
# contando i tre battiti. Chi lo fa resta dall'altra parte per tutto il tempo che tiene gli occhi chiusi (nel
# gioco, qui, non li tiene chiusi più di tre battiti). Di là si sono visti una parete di pietra nera bagnata, la
# pioggia salata che cade da una fessura in alto, il mare vicinissimo, un fuoco di legna di mare acceso in un
# braciere di ferro senza nessuno intorno, e nel pavimento un fascio di condotti che arrivano da sud-ovest.
# Lo sgabello, la pipa e lo scialle nella stanza della vecchia lasciano intendere che Mara scendeva qui. Non si dice.
# Il segno che lega i luoghi neri: il cerchio di nove incavi con uno inciso più a fondo (vedi lente-del-sornione.yaml),
# qui con dentro il segno della porta (la seconda pietra dell'Anello), e il condotto che va a nord-est.
aree:
  - id: soglia-di-mara
    immagine: ambientazione/roccia-di-wren
    nome: La Soglia di Mara
    sommario: "Sotto l'arco senza muri il crinale è cavo. Una scala scende nella collina, e più si scende più l'aria sa di mare."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Sotto la Soglia di Mara la collina è cava. Una scala scende dentro
      il crinale con gradini lunghi il doppio di un passo, e dalle pareti
      di pietra nera trasuda un'acqua che lascia croste bianche dove si
      asciuga. Più in basso l'aria si fa umida e sa di mare, anche se il
      mare è a giorni di cammino.

      A intervalli che non riesci a prevedere, da qualche parte nel buio,
      arriva un soffio di vento bagnato e l'odore di un fuoco di legna.
      Dura tre battiti, e poi la collina torna asciutta.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: soglia-di-mara-il-crinale
    immagine: ambientazione/roccia-di-wren
    titolo: L'arco sul crinale
    sommario: "Sul crinale a est della Roccia di Wren un arco di pietra nera sta dritto come un filo a piombo, senza muri ai lati e senza strada."
    luogo: Superficie Fratturata, il crinale a est della Roccia di Wren
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.mara >= 3]
    testo: |
      Il crinale corre sopra il Torvessa, e da lassù si vede la Roccia di
      Wren, una lingua di pietra nera che esce dall'acqua melmosa verso
      ovest. L'arco sta sulla cima della gobba più alta. È di pietra nera,
      alto due volte un uomo e dritto come un filo a piombo, e ai lati non
      ha muri né resti di muri. Ci passa intorno l'erba del crinale e
      nient'altro, e nessuna strada ci arriva.

      Al pilastro di sinistra sono annodati stracci colorati, decine, quasi
      tutti sbiaditi dal sole. La pietra della soglia, sotto l'arco, è
      consumata nel mezzo come i gradini di una chiesa vecchia.

      {natura Media} Il vento viene da ovest e sa di fiume. Sotto l'arco,
      però, l'erba è coperta di una polvere bianca che sulla lingua sa di
      sale.

      {origine figlio-della-citta-bassa} In Città Bassa le madri spaventano
      i bambini con la Roccia di Wren e con il Cucitore, che ci viveva. Da
      quassù la Roccia sembra un dito nero, e meno spaventosa di come la
      raccontavano.

      Il sole sta calando dietro la Roccia. *Fra poco è il tramonto.* La
      tua ombra arriva fino alla soglia e la attraversa.
    opzioni:
      - testo: "Passare sotto l'arco al tramonto"
        descrizione: "Tre battiti di pioggia salata, dicono. Bisogna reggerli e tenere gli occhi aperti, perché dopo si deve guardare dove si mettono i piedi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Tre battiti
          testo: |
            Passi sotto l'arco con l'ultimo sole negli occhi, e per tre
            battiti di cuore sei al buio sotto una pioggia salata, con il
            rumore del mare dappertutto. Poi sei di nuovo sul crinale. Dietro
            di te la pietra della soglia si è sollevata di un palmo da una
            parte, e sotto c'è una scala che scende nella collina.
          pe: { resilienza: 2 }
          vai: soglia-di-mara
        fallimento:
          titolo: In ginocchio
          testo: |
            Per tre battiti la pioggia salata ti entra negli occhi e in bocca,
            e quando torni sul crinale sei in ginocchio sull'erba, con i
            capelli fradici e il cuore che non trova il passo. Il sole è
            tramontato, e la soglia è una pietra come un'altra.
          effetti: { tormento: 0.5 }
      - testo: "Cercare la giuntura ai piedi dei pilastri"
        descrizione: "Una pietra consumata nel mezzo è stata calpestata da molti piedi. Chi passava di qui andava da qualche parte, e forse andava sotto."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La pietra che si alza
          testo: |
            Giri intorno alla soglia a quattro zampe, con la guancia sull'erba,
            finché vedi la fessura sottile che corre lungo il bordo della
            pietra consumata. Ci infili la lama e fai leva, e la pietra si
            solleva da una parte, leggera come un coperchio. Sotto c'è una
            scala che scende nella collina.
          pe: { percezione: 2 }
          vai: soglia-di-mara
        fallimento:
          titolo: La lama spezzata
          testo: |
            Infili la lama nella prima fessura che trovi e fai leva con tutto
            il peso. La punta si spezza con uno schiocco, e ti apri il pollice
            sul filo. Lasci il crinale con il pollice in bocca e la soglia
            chiusa come prima.
          effetti: { ferite: 0.5 }
      - testo: "Salire a cavallo e lasciar fare il cavallo"
        descrizione: "Le bestie non passano sotto l'arco. Dove il cavallo si ferma, sotto c'è il vuoto."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il cavallo che non passa
          testo: |
            Sali il crinale a cavallo, e a dieci passi dall'arco il cavallo
            si pianta e non c'è verso di farlo andare avanti. Batte uno zoccolo
            sulla terra, sempre nello stesso punto, e la terra suona vuota.
            Scavi lì, e la pala trova il bordo della pietra della soglia, che
            si solleva su una scala che scende nella collina.
          vai: soglia-di-mara
      - testo: "Scavare sotto la soglia con la pala"
        descrizione: "Sotto una pietra c'è terra, e sotto la terra si vedrà. Ci vuole tutta la sera."
        costo: 2
        esito:
          titolo: La pala sotto la soglia
          testo: |
            Scavi accanto alla pietra della soglia fino a sera, con le mani
            che si riempiono di vesciche. Quando ci passi sotto con la pala,
            la pietra si solleva da sola di un palmo, e sotto c'è una scala
            che scende nella collina. Ti siedi un momento sul bordo a guardarti
            le mani, prima di scendere.
          effetti: { ferite: 0.5 }
          vai: soglia-di-mara

  # ------------------------------------------------------------ 0 · la scala e l'acqua di mare
  - id: soglia-di-mara-la-scala-lunga
    immagine: ambientazione/rovine-dei-precursori
    titolo: La scala dai gradini lunghi
    sommario: "La scala scende nel crinale con gradini alti la metà del tuo ginocchio e lunghi il doppio di un passo."
    luogo: La Soglia di Mara, la scala nel crinale
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 0]
    testo: |
      La scala scende dritta dentro il crinale, scavata nella pietra nera,
      e i gradini sono fatti per gambe più lunghe delle tue. Ognuno è
      lungo il doppio di un passo e basso la metà di un ginocchio, e il
      piede non sa mai se fare un passo o due. Sui bordi la pietra è
      lucida di umido, e nel mezzo è consumata come quella della soglia.

      {atletica Media} Due passi corti per ogni gradino, e il corpo trova il
      ritmo da solo. Tre volte uno e il ginocchio ti tradisce.

      Dal basso sale un'aria fresca che sa di alga.
    opzioni:
      - testo: "Trovare il passo della scala"
        descrizione: "La scala ha un ritmo, e chi la scendeva lo teneva a memoria. Bisogna prenderlo con le gambe."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Due passi per gradino
          testo: |
            Due passi corti per ogni gradino, e dopo una ventina di gradini
            le gambe vanno da sole, con il tonfo regolare degli stivali che
            torna su dalle pareti. In fondo la scala si allarga in un
            pianerottolo.
          pe: { atletica: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il gradino umido
          testo: |
            Sbagli il passo su un bordo lucido e scendi tre gradini sul
            fondoschiena, con la lanterna alta per non romperla. Ti rialzi
            con un fianco che pulsa, e risali a sederti in cima.
          effetti: { ferite: 0.5 }
      - testo: "Scendere nel mezzo, dove la pietra è consumata"
        descrizione: "Dove sono passati tutti, la pietra è più ruvida e il piede tiene. Basta mettere i piedi dove li mettevano loro."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Le impronte nella pietra
          testo: |
            Nel mezzo dei gradini la pietra è consumata in due conche lunghe,
            e tu metti gli stivali lì dentro, uno per conca. Sono troppo
            lontane fra loro e ti tocca allungare il passo, ma il piede tiene,
            e arrivi in fondo senza scivolare una volta.
          pe: { percezione: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il passo degli altri
          testo: |
            Le conche consumate sono troppo distanti per le tue gambe, e a
            forza di allungarti ti ritrovi a gambe larghe su due gradini con
            la lanterna che dondola. Risali piano con la sensazione di essere
            ridicolo, anche se non ti guarda nessuno.
          effetti: { tormento: 1 }
      - testo: "Scendere seduti, un gradino alla volta"
        descrizione: "Un gradino, una spinta, un altro gradino. Lento, e i pantaloni ne usciranno peggio di te."
        costo: 2
        esito:
          titolo: Seduto
          testo: |
            Scendi la scala seduto, un gradino alla volta, con la lanterna
            fra le ginocchia. Ci vuole molto, e l'umido della pietra ti passa
            nei pantaloni e poi nelle ossa. In fondo ti alzi tutto rigido, con
            un dolore alla schiena che ti accompagnerà per un pezzo.
          effetti: { profondita.soglia-di-mara: 1, ferite: 0.5 }

  - id: soglia-di-mara-l-acqua-di-mare
    immagine: ambientazione/marea-grigia
    titolo: L'acqua di mare
    sommario: "Il pianerottolo è allagato fino alla caviglia, e l'acqua è salata. Sul fondo, fra le croste di sale, c'è un granchio morto."
    luogo: La Soglia di Mara, il pianerottolo allagato
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 0]
    testo: |
      A metà della scala c'è un pianerottolo, e il pianerottolo è allagato
      fino alla caviglia. L'acqua è fredda e limpida, e sul fondo di pietra
      si è depositata una crosta bianca che scricchiola sotto gli stivali.
      In un angolo, a pancia all'aria, c'è un granchio morto grande come un
      palmo, con il guscio rosso e le zampe raccolte.

      {natura Facile} Un granchio di mare, di quelli che i pescatori della
      costa vendono a cesti. Il mare più vicino è a giorni di cammino da
      qui, e il granchio è morto da poco.

      L'acqua esce da una fessura nella parete in fondo, e accanto alla
      fessura c'è una porta bassa con il bordo incrostato di sale.
    opzioni:
      - testo: "Seguire l'acqua fino alla fessura"
        descrizione: "L'acqua di mare non nasce in una collina. Dove entra, c'è un passaggio."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La fessura
          testo: |
            Guadi fino alla fessura e ci passi le dita sopra. L'acqua esce a
            gruppi di tre piccoli sbuffi, e ogni sbuffo è più freddo di quello
            prima. Accanto alla fessura gratti via il sale dal bordo della
            porta bassa, e la porta si apre su un corridoio asciutto.
          pe: { natura: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il granchio
          testo: |
            Ti chini per guardare il granchio da vicino, e una zampa si muove.
            Fai un salto all'indietro e finisci seduto nell'acqua gelata, e
            quando ti rialzi il granchio è fermo come prima, a pancia
            all'aria.
          effetti: { tormento: 1 }
      - testo: "Attraversare l'acqua e forzare la porta"
        descrizione: "Acqua gelata alle caviglie e una porta incrostata di sale. Il freddo passa, la porta si vedrà."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il sale che cede
          testo: |
            Attraversi l'acqua a passo deciso, con il gelo che ti sale dalle
            caviglie alle ginocchia, e dai una spallata alla porta bassa. Il
            sale del bordo si spacca come zucchero cotto, e la porta si apre
            su un corridoio asciutto.
          pe: { resistenza: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: I piedi gelati
          testo: |
            Dai tre spallate alla porta con i piedi nell'acqua gelata, e la
            porta non si muove. Quando ti arrendi non senti più le dita dei
            piedi, e risali la scala a scaldarle con le mani.
          effetti: { ferite: 0.5 }
      - testo: "Svuotare il pianerottolo con l'elmo"
        descrizione: "Un elmo, una scodella, qualsiasi cosa tenga l'acqua. Si butta giù per la scala, e intanto la fessura continua a dare."
        costo: 2
        esito:
          titolo: Il secchio
          testo: |
            Butti l'acqua giù per la scala con la scodella da campo finché
            il pianerottolo resta bagnato e basta. Hai le maniche fradice e
            le mani screpolate dal sale. La porta bassa, senza l'acqua
            davanti, si apre con una spinta.
          effetti: { profondita.soglia-di-mara: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · gli armadi e lo sgabello
  - id: soglia-di-mara-gli-armadi
    immagine: ambientazione/rovine-dei-precursori
    titolo: Gli armadi stretti
    sommario: "Lungo un corridoio c'è una fila di armadi di metallo alti e stretti, ognuno con il suo gancio dentro. Uno solo è chiuso."
    luogo: La Soglia di Mara, il corridoio degli armadi
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 1]
    testo: |
      Il corridoio ha su un lato una fila di armadi di metallo, alti il
      doppio di un uomo e stretti quanto una spalla. Gli sportelli sono
      quasi tutti aperti, e dentro ognuno c'è un gancio in alto e una
      mensola in basso, per gli stivali. Sono vuoti. L'ultimo della fila è
      chiuso, e sullo sportello c'è una placca con una mano incisa, il
      palmo aperto.

      {origine apprendista-raschiatore} Al Ponte dei Morti le squadre
      lasciano la roba nelle cassette prima di scendere, e la ritrovano al
      ritorno. Qui la roba non l'ha ripresa più nessuno.

      {conoscenze-della-strada Facile fallita} Ti chiedi quanto darebbero al
      Mercato dei Nodi per un armadio così. Poi pensi alla scala dai gradini
      lunghi, e lasci perdere il conto.

      {tecnologia Media} La placca è tiepida. Aspetta una mano, e forse una
      mano qualunque.
    opzioni:
      - testo: "Appoggiare la mano sulla placca"
        descrizione: "Una mano incisa chiede una mano. La tua è più piccola, e forse basta."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Lo sportello
          testo: |
            Appoggi il palmo sulla mano incisa, e la placca si scalda sotto
            la pelle finché lo sportello scatta. Dentro, sulla mensola, c'è un
            guscio di metallo chiuso e un paio di stivali lunghi come il tuo
            braccio, grigi di sale. Prendi il guscio e lasci gli stivali al
            loro padrone.
          pe: { tecnologia: 2 }
          effetti: { profondita.soglia-di-mara: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La scossa
          testo: |
            La placca ti morde il palmo con una scossa che ti sale fino al
            gomito. Ritiri la mano e per un po' le dita ti si aprono e
            chiudono per conto loro.
          effetti: { ferite: 0.5 }
      - testo: "Frugare negli armadi aperti"
        descrizione: "Vuoti, a prima vista. Negli armadi lasciati in fretta qualcosa resta sempre in fondo alla mensola."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: In fondo alla mensola
          testo: |
            Passi la mano al buio su una mensola dopo l'altra, e in fondo alla
            settima trovi una scheggia di metallo lucido, rotonda come una
            moneta e bucata nel mezzo. In fondo al corridoio c'è un passaggio
            che prosegue, e lo prendi con la scheggia in tasca.
          pe: { percezione: 2 }
          effetti: { profondita.soglia-di-mara: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Lo sportello che sbatte
          testo: |
            Uno sportello ti si richiude sulle dita con un colpo che rimbomba
            per tutto il corridoio. Aspetti con la mano stretta sotto
            l'ascella che il rimbombo finisca, e ti accorgi che stai
            aspettando anche che qualcuno venga a vedere.
          effetti: { ferite: 0.5 }
      - testo: "Passare oltre senza toccare niente"
        descrizione: "Gli armadi sono di qualcuno. Il corridoio va avanti lo stesso."
        costo: 2
        esito:
          titolo: La fila degli armadi
          testo: |
            Passi davanti agli armadi uno dopo l'altro senza toccarli, e ti
            accorgi di contarli. Sono trentasei. Dopo l'ultimo il corridoio
            gira, e per un tratto ti sembra di sentire alle spalle il rumore
            di uno sportello che si apre piano.
          effetti: { profondita.soglia-di-mara: 1, tormento: 1 }

  - id: soglia-di-mara-lo-sgabello
    immagine: ambientazione/roccia-di-wren
    titolo: Lo sgabello della vecchia
    sommario: "In una nicchia del corridoio c'è uno sgabello di legno, una pipa di coccio e uno scialle piegato. Sono cose di qui sopra, e sono vecchie."
    luogo: La Soglia di Mara, la nicchia dello sgabello
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 1]
    testo: |
      In una nicchia del corridoio, rivolto verso il basso, c'è uno
      sgabello da mungitura a tre gambe, di legno. Accanto c'è una pipa di
      coccio con il fornello annerito e uno scialle di lana piegato in
      quattro, mangiato dalle tarme agli angoli. Sono cose della gente di
      sopra, e sono qui da molto. Sulla parete, all'altezza di chi sta
      seduto, ci sono file di tacche graffiate con un chiodo, a gruppi di
      sette.

      {empatia Media} Chi si sedeva qui veniva spesso e restava a lungo, e
      si portava lo scialle perché sapeva che avrebbe preso freddo.

      {conoscenze-della-strada Facile fallita} Ti chiedi se la pipa valga
      qualcosa. Poi ti vergogni di avertelo chiesto.
    opzioni:
      - testo: "Sedersi sullo sgabello e guardare dove guardava lei"
        descrizione: "Lo sgabello guarda in una direzione precisa. Chi lo ha messo lì voleva vedere qualcosa."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La vista dallo sgabello
          testo: |
            Ti siedi sullo sgabello, che scricchiola sotto il tuo peso ma
            regge, e guardi giù per il corridoio. Da qui, in fondo, si vede
            una lama di luce arancione che scende da una fessura del soffitto
            e si posa sul pavimento, la luce del tramonto di sopra. Chi sedeva
            qui contava i tramonti. Lasci lo scialle piegato com'era e scendi
            verso la luce.
          pe: { empatia: 2 }
          effetti: { profondita.soglia-di-mara: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Lo sgabello che cede
          testo: |
            Ti siedi, e una gamba dello sgabello si spezza sotto di te. Finisci
            per terra con lo scialle in testa e un odore di tabacco vecchio nel
            naso, e ci metti un po' a rimettere tutto com'era.
          effetti: { tormento: 1 }
      - testo: "Guardare nel fornello della pipa"
        descrizione: "Una pipa lasciata a metà ha ancora dentro quello che si fumava. A volte anche altro."
        prova: { attributo: mentale, abilita: [percezione, medicina], difficolta: Media }
        successo:
          titolo: La conchiglia
          testo: |
            Nel fornello, sotto la cenere secca, c'è una conchiglia piccola e
            bianca, avvolta in un pezzo di carta da tabacco. Sulla Superficie
            non c'è mare per giorni di cammino. La rimetti nella pipa, e con la
            pipa lasci lì anche la voglia di sapere chi l'aveva raccolta.
          pe: { percezione: 2 }
          effetti: { profondita.soglia-di-mara: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La cenere
          testo: |
            Soffi nel fornello per pulirlo e ti arriva in faccia una nuvola di
            cenere vecchia. Tossisci a lungo piegato in due, e la pipa ti
            scivola di mano e si scheggia sul pavimento.
          effetti: { tormento: 1 }
      - testo: "Lasciare le sue cose e proseguire"
        descrizione: "Sono le cose di qualcuno che non tornerà a prenderle. Il corridoio scende ancora."
        costo: 2
        esito:
          titolo: Le tacche
          testo: |
            Passi davanti alla nicchia senza toccare niente, e per scrupolo
            conti le tacche sulla parete. Sono così tante che a metà perdi il
            conto e ricominci, e quando ti decidi a proseguire hai la testa
            piena di gruppi di sette.
          effetti: { profondita.soglia-di-mara: 1, tormento: 1 }

  # ------------------------------------------------------------ 1–3 · i tre battiti nel corridoio
  - id: soglia-di-mara-i-tre-battiti
    immagine: ambientazione/marea-grigia
    titolo: I tre battiti
    sommario: "Nel corridoio, a intervalli, il buio cambia odore. Per tre battiti c'è il vento bagnato e il mare, e poi la collina torna asciutta."
    luogo: La Soglia di Mara, il corridoio lungo
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara >= 1, profondita.soglia-di-mara <= 3]
    testo: |
      Il corridoio scende piano e a lungo, e a metà arriva il primo soffio.
      Per tre battiti ti trovi in un vento bagnato che ti tira i vestiti,
      con la pioggia salata sulla faccia e un rumore di mare grande e vicino.
      Poi sei di nuovo nel corridoio asciutto, con i capelli gocciolanti e
      la lanterna che sfrigola. Dopo un poco arriva il secondo, più lungo
      del primo.

      {resilienza Media} Il corridoio è sempre lo stesso. È il resto che si
      sposta, e tu devi soltanto continuare a camminare dritto.

      {acrobazia Media fallita} Al terzo soffio i piedi si dimenticano per
      un momento dove sta il pavimento, e te lo fanno sapere.
    opzioni:
      - testo: "Continuare a camminare durante i soffi"
        descrizione: "Tre battiti si reggono. Il corridoio sotto i piedi resta, anche quando la testa dice di no."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Dritto
          testo: |
            Al soffio successivo tieni gli occhi sulla lanterna e cammini,
            un passo per battito, e quando il corridoio torna sei tre passi più
            avanti. Lo rifai a ogni soffio. In fondo al corridoio arrivi con la
            giubba fradicia e la testa sgombra.
          pe: { resilienza: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il mare in testa
          testo: |
            Al quarto soffio ti fermi, e quando il corridoio torna non sai più
            da che parte stavi andando. Il rumore del mare ti resta nelle
            orecchie, e cammini nella direzione sbagliata finché non ritrovi
            le tue impronte bagnate.
          effetti: { tormento: 1 }
      - testo: "Correre fra un soffio e l'altro"
        descrizione: "I soffi arrivano a intervalli. Nel mezzo il corridoio è asciutto, e si può correre."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Fra i soffi
          testo: |
            Aspetti la fine di un soffio e corri, e quando arriva il successivo
            ti fermi contro la parete con la testa bassa. Riparti appena
            finisce. Al quinto scatto il corridoio finisce, e ti appoggi a uno
            stipite con le mani sulle ginocchia.
          pe: { atletica: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il soffio a metà corsa
          testo: |
            Un soffio ti prende a metà corsa, e per tre battiti corri su una
            pietra bagnata che non è quella del corridoio. Quando torni inciampi
            nel pavimento vero, che è più in basso di un dito, e cadi lungo.
          effetti: { ferite: 0.5 }
      - testo: "Sedersi e lasciar passare i soffi"
        descrizione: "Seduti contro la parete, con la lanterna fra le ginocchia, i soffi passano sopra. Si perde tempo."
        costo: 2
        esito:
          titolo: Contro la parete
          testo: |
            Ti siedi contro la parete e lasci passare i soffi uno dopo l'altro,
            con gli occhi chiusi e la lanterna fra le ginocchia. Ne conti
            undici. Quando ti rialzi hai la giubba incrostata di sale e un
            rumore di risacca che ti resta nella testa per il resto della
            discesa.
          effetti: { profondita.soglia-di-mara: 1, tormento: 1 }

  # ------------------------------------------------------------ 2 · i granchi del sale e le pompe
  - id: soglia-di-mara-i-granchi-del-sale
    immagine: bestiario/salvaguardia-precursori
    titolo: I granchi del sale
    sommario: "In una sala bassa due gusci di metallo incrostati di sale raschiano il pavimento con le pinze. Quando ti sentono, smettono."
    luogo: La Soglia di Mara, la sala bassa
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 2]
    testo: |
      La sala è bassa e larga, e il pavimento è coperto di sale come una
      salina. Due gusci di metallo grandi come tamburelli ci camminano sopra
      su sei zampe e raschiano il sale con le pinze avanti e indietro, poi lo
      ammucchiano contro le pareti in cumuli ordinati. Quando la tua lanterna
      entra nella sala si fermano tutti e due, con le pinze alzate.

      {rissa Media} Sono bassi, e la pancia sta a un palmo da terra. Un
      calcio da sotto li rovescia, e un guscio rovesciato non si raddrizza
      in fretta.

      Lungo la parete di destra i cumuli di sale fanno una specie di
      corridoio, alto fino al petto.
    opzioni:
      - testo: "Affrontare i granchi"
        descrizione: "Due gusci bassi e due pinze ciascuno. Da sotto si rovesciano."
        combattimento: soglia-di-mara-granchi-del-sale
        vittoria:
          titolo: A pancia all'aria
          testo: |
            Il secondo granchio resta a pancia all'aria in mezzo al sale,
            con le zampe che si muovono sempre più piano. Gli stacchi le pinze
            e il pezzo di macchina che porta sulla schiena, e attraversi la
            sala fra i cumuli bianchi.
          effetti: { profondita.soglia-di-mara: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: Le pinze
          testo: |
            Le pinze ti trovano le caviglie, e una ti stringe il polpaccio
            finché non lasci la lanterna. Torni indietro zoppicando, e i
            granchi riprendono a raschiare il sale come se non fossi mai
            entrato.
      - testo: "Passare dietro i cumuli di sale"
        descrizione: "I cumuli lungo la parete sono alti fino al petto. Chi si tiene basso dietro il sale non si vede."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Dietro il sale
          testo: |
            Passi chinato dietro i cumuli, con la lanterna coperta dalla mano,
            e i granchi riprendono a raschiare dopo un poco. Senti le pinze
            grattare dall'altra parte del sale per tutto il tragitto. In
            fondo alla sala c'è una porta, e la passi senza fare rumore.
          pe: { furtivita: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il cumulo che frana
          testo: |
            Sfiori un cumulo con la spalla, e il sale ti frana addosso con un
            fruscio lungo. I granchi ti sono sopra in un momento, e scappi
            dalla porta da cui sei entrato con un taglio sul polso.
          effetti: { ferite: 0.5 }
      - testo: "Gettare il sale in mezzo alla sala e passare"
        descrizione: "Raschiano il sale e lo ammucchiano. Se ne trovano dell'altro in mezzo alla sala, forse hanno da fare."
        costo: 2
        esito:
          titolo: Il lavoro dei granchi
          testo: |
            Prendi il sale da un cumulo a manciate e lo spargi in mezzo alla
            sala. I granchi si buttano sul sale nuovo e si mettono a
            raschiarlo, e tu passi lungo la parete. Di passaggio uno ti
            pizzica la caviglia per scrupolo e torna al lavoro.
          effetti: { profondita.soglia-di-mara: 1, ferite: 0.5 }

  - id: soglia-di-mara-le-pompe
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le pompe
    sommario: "In una sala allagata quattro pistoni di metallo battono lenti e rimandano l'acqua salata su per un condotto. Uno è fermo, e l'acqua sale."
    luogo: La Soglia di Mara, la sala delle pompe
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 2]
    testo: |
      Nella sala delle pompe quattro pistoni grandi come tronchi d'albero si
      alzano e si abbassano lenti, e a ogni colpo rimandano l'acqua salata su
      per un condotto nel soffitto. Uno dei quattro è fermo a metà corsa. Dove
      dovrebbe pompare, l'acqua è salita fino alla vita, e la porta dall'altra
      parte della sala è mezza sommersa.

      {tecnologia Media} Il pistone fermo ha la leva di sblocco sul fianco,
      sott'acqua. Qualcuno l'ha fermato, oppure il sale l'ha incastrato.

      {resistenza Media fallita} L'acqua è fredda come quella di un pozzo
      d'inverno, e le gambe te lo dicono prima ancora di entrarci.
    opzioni:
      - testo: "Sbloccare il pistone fermo"
        descrizione: "La leva è sott'acqua, sul fianco del pistone. Bisogna trovarla al tatto, e sapere da che parte tirarla."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il quarto pistone
          testo: |
            Trovi la leva al tatto, con la faccia a un dito dall'acqua, e la
            tiri verso di te. Il pistone riparte con un colpo che ti scuote le
            ossa, e in poco l'acqua cala fino alle ginocchia. Attraversi la sala
            fino alla porta.
          pe: { tecnologia: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: La leva sbagliata
          testo: |
            Tiri la leva dalla parte sbagliata, e un altro pistone si ferma.
            L'acqua sale di un palmo mentre torni indietro, e arrivi alla
            scala fradicio fino al collo e con i denti che battono.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare a nuoto fino alla porta"
        descrizione: "L'acqua arriva alla vita, e alla porta di più. Si passa sotto con l'aria nei polmoni, e il freddo non aiuta."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: Sotto la porta
          testo: |
            Guadi fino alla porta e ti immergi, con gli occhi aperti nel sale
            che brucia, e passi sotto l'architrave a bracciate. Dall'altra
            parte riemergi in un corridoio dove l'acqua arriva alle caviglie,
            e resti a lungo appoggiato al muro a sputare acqua salata.
          pe: { atletica: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: L'architrave
          testo: |
            Sott'acqua sbagli la misura e batti la testa contro l'architrave.
            Riemergi dalla parte da cui eri partito, con un bernoccolo che
            cresce e la bocca piena di sale, e torni alla scala a tossire.
          effetti: { ferite: 1 }
      - testo: "Aspettare che le pompe abbassino l'acqua"
        descrizione: "Tre pistoni su quattro lavorano ancora. Prima o poi l'acqua scende, e intanto si aspetta al freddo."
        costo: 2
        esito:
          titolo: L'attesa nell'acqua
          testo: |
            Aspetti sulla scala con l'acqua alle caviglie, e i tre pistoni che
            lavorano abbassano l'acqua di un dito alla volta. Ci vuole tanto
            che a un certo punto ti accorgi di battere il tempo con il piede.
            Quando la porta è libera hai le gambe intirizzite fino all'anca.
          effetti: { profondita.soglia-di-mara: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · il cerchio delle nove tacche e il fumo
  - id: soglia-di-mara-il-cerchio-dei-nove
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il cerchio sotto la fessura
    sommario: "Sotto una fessura del soffitto, sul pavimento, è inciso un cerchio di nove incavi. In quello più profondo c'è una porta, e la luce del tramonto ci cade sopra."
    luogo: La Soglia di Mara, la sala del cerchio
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 3]
    testo: |
      In una sala tonda la luce scende da una fessura stretta del soffitto,
      dritta come una lama, e si posa su un cerchio inciso nel pavimento. Il
      cerchio è largo quanto un tavolo da osteria e ha nove incavi lungo il
      bordo. Otto sono lisci e poco profondi. Il nono è inciso più a fondo,
      con dentro il segno di una porta, un arco su due pilastri, che manda una
      luce arancione che non viene dalla fessura. Dal centro del cerchio parte
      un condotto di metallo grosso come un braccio, che attraversa la sala ed
      entra sotto la parete di nord-est.

      {percezione Media} La lama di luce scivola sul pavimento mentre la
      guardi. Fra poco arriverà sull'incavo della porta, e lassù sarà il
      tramonto.

      {accademiche Difficile} Nove incavi, e uno solo inciso a fondo. Se gli
      altri otto sono altri posti, questo cerchio è una mappa senza nomi.
    opzioni:
      - testo: "Ricopiare il cerchio sul quaderno"
        descrizione: "Nove incavi con una porta in quello profondo, e un condotto che va verso nord-est. Alla Biblioteca qualcuno saprà leggerli."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: Il disegno
          testo: |
            Ricopi il cerchio incavo per incavo, disegni la porta dentro
            quello profondo e segni il condotto con una freccia. Mentre
            finisci, la lama di luce arriva sull'incavo della porta, e da
            sotto il pavimento ti arriva per tre battiti il rumore lontano del
            mare.
          pe: { accademiche: 2 }
          effetti: { profondita.soglia-di-mara: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: La luce sulla mano
          testo: |
            Mentre disegni, la lama di luce ti passa sulla mano, e per tre
            battiti la mano non è più nella sala. La ritiri bagnata e gelata
            fino al polso, e per un'ora non riesci a tenere la matita.
          effetti: { tormento: 1 }
      - testo: "Seguire il condotto fino alla parete"
        descrizione: "Il condotto va sotto la parete di nord-est. Dove va lui va qualcosa, e forse anche la strada."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La nota nel condotto
          testo: |
            Segui il condotto fino alla parete, dove entra in una fessura e
            vibra piano, con una nota bassa che senti nei denti.
            Accanto alla fessura un passaggio stretto prosegue verso il basso,
            e l'aria che ne esce sa di fumo.
          pe: { percezione: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il freddo della fessura
          testo: |
            Infili le dita nella fessura sotto la parete, e il filo d'aria che
            ne esce è così freddo che te le lascia bianche e insensibili.
            Torni indietro a scaldartele sotto le ascelle.
          effetti: { ferite: 0.5 }
      - testo: "Cercare l'incavo che riconosci"
        descrizione: "Questo cerchio l'hai già visto sotto il Sornione. Laggiù l'incavo profondo aveva un occhio."
        quando: [misura.sornione >= 1]
        esito:
          titolo: Due segni
          testo: |
            Trovi sul cerchio l'incavo dove sotto il Sornione c'era l'occhio.
            Qui è liscio e poco profondo, e sotto le dita resta freddo. Ricopi
            tutto sul quaderno, i due segni uno accanto all'altro, e prosegui.
          effetti: { profondita.soglia-di-mara: 1, informazioni.segreto: 1 }
      - testo: "Aspettare che la luce passi e proseguire"
        descrizione: "La luce scivola sul pavimento. Quando è passata la sala è soltanto una sala."
        costo: 2
        esito:
          titolo: Il tramonto di sotto
          testo: |
            Aspetti contro la parete che la lama di luce passi sull'incavo
            della porta e vada oltre. Quando ci passa sopra ti arriva addosso
            un soffio di pioggia salata da nessuna parte, e ti lascia
            fradicio. Poi la sala si spegne, e prosegui con la giubba che
            gocciola.
          effetti: { profondita.soglia-di-mara: 1, ferite: 0.5 }

  - id: soglia-di-mara-il-fumo
    immagine: ambientazione/roccia-di-wren
    titolo: Il fumo di legna
    sommario: "Più giù l'aria sa di un fuoco di legna acceso da qualche parte. Il fumo esce da una grata nel muro, a sbuffi di tre."
    luogo: La Soglia di Mara, il passaggio del fumo
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara == 3]
    testo: |
      Il passaggio si stringe, e l'aria comincia a sapere di un fuoco di
      legna. Esce caldo e grigio da una grata nel muro, a sbuffi di tre, e
      ogni sbuffo porta con sé un pizzico di salsedine che ti resta sulle
      labbra. Oltre la grata c'è il buio, e nel buio non si vede nessun fuoco.
      Il passaggio prosegue nel fumo, e il fumo si fa più fitto.

      {natura Media} È legno di mare, quello che le onde portano a riva
      sbiancato e salato. Brucia con una fiamma azzurra in fondo, e fuma
      più del legno di bosco.

      {resistenza Difficile} Per un tratto il fumo si sopporta. Poi gli occhi
      cominciano a lacrimare e la gola a chiudersi, e conviene sapere dove si
      va.
    opzioni:
      - testo: "Attraversare il fumo con un panno sulla bocca"
        descrizione: "Un panno bagnato sulla bocca e gli occhi socchiusi. Il fumo è fitto, e il passaggio è lungo."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Difficile }
        successo:
          titolo: Nel fumo
          testo: |
            Bagni il fazzoletto nell'acqua della borraccia e te lo leghi sulla
            bocca, e cammini nel fumo con una mano sulla parete. Gli occhi ti
            bruciano a ogni sbuffo, e tu continui a contare i passi. Quando
            il fumo si dirada sei davanti a una porta alta, e dietro la porta
            c'è una sala grande.
          pe: { resistenza: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: La tosse
          testo: |
            A metà passaggio la tosse ti piega in due, e torni indietro a
            tentoni con gli occhi chiusi e la mano sulla parete. Fuori dal fumo
            sputi grigio per un pezzo.
          effetti: { ferite: 0.5 }
      - testo: "Seguire gli sbuffi e passare negli intervalli"
        descrizione: "Il fumo arriva a sbuffi di tre. Fra un gruppo e l'altro l'aria si schiarisce, e si va avanti di corsa."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Gli intervalli
          testo: |
            Conti gli sbuffi alla grata finché ne prendi il tempo. Ogni tre
            sbuffi c'è una pausa lunga. Nella pausa corri, nel fumo ti fermi
            con la faccia contro il muro. In quattro pause arrivi davanti a
            una porta alta, e dietro la porta c'è una sala grande.
          pe: { percezione: 2 }
          effetti: { profondita.soglia-di-mara: 1 }
        fallimento:
          titolo: Il conto del fumo
          testo: |
            Sbagli il conto, e lo sbuffo ti prende in faccia a metà corsa. Torni
            indietro con gli occhi pieni di lacrime e il sapore della salsedine
            in gola, e aspetti che passi.
          effetti: { tormento: 1 }
      - testo: "Aspettare che il fumo si diradi"
        descrizione: "Prima o poi anche questo fuoco si abbassa. Si aspetta, e il fumo intanto si attacca ai vestiti."
        costo: 2
        esito:
          titolo: L'odore addosso
          testo: |
            Aspetti seduto fuori dal fumo finché gli sbuffi si fanno radi e
            leggeri, e passi. Dall'altra parte c'è una porta alta. I vestiti
            ti puzzano di legna di mare, e l'odore resterà per giorni anche
            lavandoli.
          effetti: { profondita.soglia-di-mara: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · la soglia di sotto
  - id: soglia-di-mara-la-soglia-di-sotto
    immagine: bestiario/salvaguardia-precursori
    titolo: La soglia di sotto
    sommario: "In fondo al crinale c'è un secondo arco di pietra nera, uguale a quello di sopra. Accanto all'arco, appoggiato a un bastone, aspetta il portinaio."
    luogo: La Soglia di Mara, la sala dell'arco
    area: soglia-di-mara
    requisiti: [profondita.soglia-di-mara >= 4, misura.mara == 0]
    testo: |
      La sala è alta come una navata, e in mezzo c'è un arco di pietra
      nera uguale a quello del crinale, alto due volte un uomo e dritto a
      piombo, senza muri ai lati. Dietro l'arco c'è soltanto la parete di
      fondo. Dal soffitto una fessura manda giù la luce arancione del
      tramonto di sopra, che scivola sul pavimento verso la soglia.

      Accanto al pilastro di sinistra c'è il portinaio. È alto il doppio di
      te e sottile come un palo, chiuso in una cerata grigia che gli
      arriva ai piedi, e si appoggia a un bastone lungo quanto lui. Quando
      la luce tocca la soglia appoggia il palmo sinistro sul pilastro, alla
      altezza della spalla, e abbassa la testa. Per tre battiti l'arco si
      riempie di pioggia salata, e poi è di nuovo pietra. Il portinaio
      alza la testa e si gira verso di te.

      {origine accolito-del-velo} Al Velo il verbale del mercante che passò
      sotto l'arco è archiviato fra le deposizioni senza seguito. Nessuno è
      mai venuto quaggiù a vedere che cosa c'era sotto la deposizione.

      {percezione Media} Quando abbassa la testa il portinaio chiude le
      fessure della maschera. Passa la soglia a occhi chiusi.

      {intimidire Media fallita} Ti chiedi se un bastone così lungo faccia
      male quanto sembra. Il resto di te ha già deciso di sì.
    opzioni:
      - testo: "Affrontare il portinaio"
        descrizione: "È alto il doppio di te, e il bastone arriva lontano. Sotto la cerata, però, è sottile come un palo."
        combattimento: soglia-di-mara-il-portinaio
        vittoria:
          titolo: La porta di Mara
          testo: |
            Il portinaio si piega sul bastone e scivola giù lungo il pilastro,
            e la cerata grigia gli si affloscia addosso. Gliela sfili. Quando
            la luce torna sulla soglia appoggi il palmo sinistro sul pilastro
            di sinistra all'altezza della spalla. Poi passi sotto l'arco a
            occhi chiusi, contando i battiti.

            Al primo battito c'è la pioggia salata, che cade da una fessura in
            alto. Al secondo senti il mare vicinissimo, e sotto le mani c'è
            una parete di pietra nera bagnata. Al terzo apri gli occhi di un
            filo, e vedi un braciere di ferro con dentro un fuoco di legna di
            mare, acceso senza nessuno intorno, e nel pavimento bagnato un
            fascio di condotti che arrivano da sud-ovest. Poi sei sotto l'arco
            di sotto, fradicio, con la cerata in mano.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.mara: 1, oggetto.soglia-di-mara-cerata-del-portinaio: 1, parte.involucro-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Il bastone
          testo: |
            Il bastone del portinaio arriva da lontano, e arriva sempre. Al
            terzo colpo sei per terra davanti alla soglia, e lui ti spinge
            fuori dalla sala con la punta, piano, come si spazza la soglia di
            casa. Risali il crinale con le costole che ti fanno male a ogni
            gradino lungo.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Rifare il suo gesto accanto a lui"
        descrizione: "Il palmo sul pilastro, la testa bassa, gli occhi chiusi. Chi lo fa come lui forse passa come lui, e bisogna farlo uguale."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Difficile }
        successo:
          titolo: Uno del turno
          testo: |
            Aspetti il tramonto accanto al portinaio, e quando la luce tocca
            la soglia appoggi come lui il palmo sinistro sul pilastro
            all'altezza della spalla, e chiudi gli occhi. Lui non si muove, e
            tu passi sotto l'arco contando i battiti.

            Al primo battito c'è la pioggia salata, che cade da una fessura in
            alto. Al secondo senti il mare vicinissimo, e sotto le mani c'è
            una parete di pietra nera bagnata. Al terzo apri gli occhi di un
            filo, e vedi un braciere di ferro con dentro un fuoco di legna di
            mare, acceso senza nessuno intorno, e nel pavimento bagnato un
            fascio di condotti che arrivano da sud-ovest. Poi sei sotto l'arco
            di sotto, fradicio. Il portinaio ti porge una cerata grigia presa
            da un gancio sulla parete, come si fa con uno del turno che torna.
          pe: { percezione: 5 }
          effetti: { misura.mara: 1, oggetto.soglia-di-mara-cerata-del-portinaio: 1, parte.involucro-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il gesto sbagliato
          testo: |
            Appoggi la mano sul pilastro troppo in basso, e il portinaio se ne
            accorge prima di te. Il bastone ti prende sotto le costole e ti
            butta contro la parete, e lui resta lì a guardarti finché non
            esci dalla sala strisciando. Risali il crinale senza la porta.
          effetti: { ferite: 2, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ordinare al portinaio di farsi da parte"
        descrizione: "La formula del Comando parla alle macchine dei Precursori. Un portinaio obbedisce a chi ha il diritto di dargli ordini."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Da parte
          testo: |
            Dici la formula, e il portinaio si fa da parte di un passo e china
            la testa. Quando la luce tocca la soglia ti mostra il gesto,
            piano, perché tu lo veda bene. Appoggi il palmo sinistro sul
            pilastro all'altezza della spalla e passi a occhi chiusi.

            Al primo battito c'è la pioggia salata, che cade da una fessura in
            alto. Al secondo senti il mare vicinissimo, e sotto le mani c'è
            una parete di pietra nera bagnata. Al terzo apri gli occhi di un
            filo, e vedi un braciere di ferro con dentro un fuoco di legna di
            mare, acceso senza nessuno intorno, e nel pavimento bagnato un
            fascio di condotti che arrivano da sud-ovest. Poi sei sotto l'arco
            di sotto, e il portinaio ti porge una cerata grigia presa da un
            gancio.
          pe: { magia: 5 }
          effetti: { misura.mara: 1, oggetto.soglia-di-mara-cerata-del-portinaio: 1, parte.involucro-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'ordine a metà
          testo: |
            La formula ti si spezza a metà, e il portinaio sente soltanto
            l'inizio di un ordine. Alza il bastone e ti spinge fuori dalla sala
            a colpi secchi sulle spalle, senza fretta. Risali il crinale con
            la testa che ti pulsa e le spalle livide.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Presentarti al portinaio come uno del turno"
        descrizione: "Un portinaio fa passare chi ha il diritto di passare. Bisogna presentarsi come uno che quel diritto ce l'ha, senza esitare."
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Difficile }
        successo:
          titolo: Il cambio del turno
          testo: |
            Ti fermi davanti al portinaio a due passi giusti, con la schiena
            dritta, e gli fai un cenno breve con la testa, da collega. Lui ti
            guarda a lungo e poi risponde allo stesso modo. Quando la luce
            tocca la soglia ti mostra il gesto, e tu lo rifai uguale, con il
            palmo sinistro sul pilastro e gli occhi chiusi.

            Al primo battito c'è la pioggia salata, che cade da una fessura in
            alto. Al secondo senti il mare vicinissimo, e sotto le mani c'è
            una parete di pietra nera bagnata. Al terzo apri gli occhi di un
            filo, e vedi un braciere di ferro con dentro un fuoco di legna di
            mare, acceso senza nessuno intorno, e nel pavimento bagnato un
            fascio di condotti che arrivano da sud-ovest. Poi sei sotto l'arco
            di sotto, e il portinaio ti porge una cerata grigia presa da un
            gancio.
          pe: { galateo: 5 }
          effetti: { misura.mara: 1, oggetto.soglia-di-mara-cerata-del-portinaio: 1, parte.involucro-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'estraneo
          testo: |
            Al secondo passo ti tremano le mani, e il portinaio lo vede. Ti
            mette la punta del bastone sul petto e ti spinge indietro senza
            fretta e senza fermarsi, fino alla porta della sala e oltre.
            Risali il crinale con un livido tondo sullo sterno e la sensazione
            di essere stato cacciato da casa d'altri.
          effetti: { ferite: 1, scandalo: 1 }
          vai: superficie-fratturata
      - testo: "Tornare su senza passare"
        descrizione: "L'arco resta dov'è, e il portinaio pure. La scala riporta al crinale."
        costo: 0
        esito:
          titolo: Il crinale di sera
          testo: |
            Guardi la luce scivolare sulla soglia un'ultima volta e torni
            indietro per il corridoio dei soffi, la sala del sale e la scala
            lunga. Quando esci sul crinale è sera, e gli stracci sul pilastro
            di sinistra si muovono in un vento che viene dal fiume.
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo · tre battiti di là
  - id: soglia-di-mara-tre-battiti-di-la
    immagine: bestiario/salvaguardia-precursori
    titolo: Tre battiti di là
    sommario: "Il portinaio è di nuovo al suo posto, con una cerata nuova. La porta la conosci, e di là ci sono tre battiti per prendere qualcosa."
    luogo: La Soglia di Mara, la sala dell'arco
    area: soglia-di-mara
    ripetibile: true
    requisiti: [profondita.soglia-di-mara >= 4, misura.mara >= 1]
    testo: |
      Il portinaio è di nuovo accanto al pilastro di sinistra, con una cerata
      grigia nuova e il bastone appoggiato alla spalla. Quando entri gira la
      testa verso di te e ti guarda le mani. La luce del tramonto scivola sul
      pavimento verso la soglia. Sul gancio accanto all'arco pende un'altra
      cerata, ripiegata con la cura che si mette nelle cose di tutti i giorni.

      {percezione Media} Di là, nei tre battiti, la mano arriva a un passo
      di distanza, non di più. Accanto al braciere c'erano cose posate per
      terra.
    opzioni:
      - testo: "Passare e afferrare quello che c'è"
        descrizione: "Il gesto lo conosci. Di là hai tre battiti, e devi tenere gli occhi chiusi per i primi due."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Quello che hai preso
          testo: |
            Fai il gesto e passi a occhi chiusi, e al terzo battito allunghi
            la mano verso il braciere. Torni sotto l'arco di sotto fradicio,
            con un guscio di metallo incrostato di sale in una mano e
            nell'altra un pezzo di cassa grigia. Il portinaio ti guarda e non
            dice niente.
          pe: { acrobazia: 2 }
          effetti: { reperto.sigillato: 1, parte.involucro-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La mano vuota
          testo: |
            Apri gli occhi un battito troppo presto, e il mare ti entra in
            bocca. Torni sotto l'arco tossendo, a mani vuote, con le dita
            scottate dal ferro del braciere.
          effetti: { ferite: 1 }
          vai: superficie-fratturata
      - testo: "Abbattere di nuovo il portinaio"
        descrizione: "Sotto la cerata nuova c'è lo stesso corpo sottile. Dentro, qualcosa si può smontare."
        combattimento: soglia-di-mara-il-portinaio
        vittoria:
          titolo: La cerata nuova
          testo: |
            Il portinaio scivola giù lungo il pilastro come l'altra volta. Gli
            sfili dal petto un pezzo di macchina che si stacca intero, e lo
            lasci lì sdraiato sotto l'arco, nella luce che passa.
          effetti: { parte.involucro-2: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Spazzato via
          testo: |
            Il bastone ti spinge fuori dalla sala come la prima volta, senza
            fretta. Risali il crinale con le costole doloranti.
          effetti: { tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Passare per tre battiti e tornare"
        descrizione: "Il gesto lo conosci, e il mare di là vale la fatica di guardarlo."
        costo: 0
        esito:
          titolo: Il mare
          testo: |
            Fai il gesto e passi, e per tre battiti stai sotto la pioggia
            salata, con il mare che batte vicino. Poi torni, e risali il
            crinale con i capelli fradici e il sale sulle labbra.
          vai: superficie-fratturata

