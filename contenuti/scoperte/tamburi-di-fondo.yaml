# I Tamburi di Fondo, spedizione di un luogo nero (docs/piano-superficie.md, «Le nove spedizioni dei luoghi neri»).
# Sul guado nord della Palude Acquanera, dentro il triangolo dei tre paletti rossi dei cacciatori di anguille, una
# lastra chiude un pozzetto che scende in una fila di camere allagate (codex sf-tamburi-di-fondo). In fondo c'è il
# battente, un braccio di metallo appeso alla volta che a mezzanotte bussa tre volte sulla testa di un pilastro, e
# sul pilastro una piastra che a ogni colpo scala di uno: un contatore. La misura del luogo è il conto
# (misura.tamburi), cioè quanti colpi restano.
# - Ingresso: `tamburi-di-fondo-i-tre-paletti` (Superficie, traccia.tamburi >= 3), ripetibile.
# - Stanze in fasce di profondità (una stanza superata non ricompare nella stessa visita):
#   0 il pozzetto o gli amuleti degli Spacca-ossa; 1 la scala sommersa o la pellicola grigia;
#   1-2 le anguille di fondo (combattimento contro gregari); 2 il cacciatore che contava o le piastre nuove;
#   3 il corridoio dei colpi o il cerchio sulla porta.
# - Cuore a 4: `tamburi-di-fondo-il-battente` (misura.tamburi == 0), a mezzanotte, boss o prove Difficili; la
#   vittoria dà il conto, la rotella del conto e reliquie. Il battente non si distrugge: la notte dopo bussa di
#   nuovo. Poi `tamburi-di-fondo-un-altra-mezzanotte` (misura.tamburi >= 1), ripetibile, rende parti e reperti.
# Il segno che lega il luogo agli altri: il cerchio di nove incavi con uno più profondo, sulla porta della camera e
# sulla testa del pilastro. Sotto i tre colpi c'è la stessa nota bassa della Costola di Drago.
# Gli Spacca-ossa qui compaiono solo come vecchi amuleti, perché la loro storia la decide pista.tribu.
aree:
  - id: tamburi-di-fondo
    immagine: ambientazione/palude-acquanera
    nome: I Tamburi di Fondo
    sommario: "Sotto il muschio del guado nord, nel triangolo dei paletti rossi, un pozzetto scende verso qualcosa che a mezzanotte bussa."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Sotto la lastra un pozzetto scende nell'acqua nera e si apre in una
      fila di camere allagate fino alla vita, con le pareti di un metallo
      scuro che la palude non ha intaccato. Sull'acqua ferma e gelata
      galleggia una pellicola grigia che si rompe quando ci passi e si
      richiude piano dietro di te.

      Le camere scendono verso nord sotto il guado, e dalle pareti arriva
      ogni tanto un rumore sordo, come il ricordo di un colpo.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: tamburi-di-fondo-i-tre-paletti
    immagine: ambientazione/palude-acquanera
    titolo: I tre paletti rossi
    sommario: "Sul guado nord della Palude Acquanera, tre paletti rossi a triangolo nel muschio e una lastra con un anello."
    luogo: Superficie Fratturata, il guado nord della Palude Acquanera
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.tamburi >= 3]
    testo: |
      Sull'orlo nord della Palude Acquanera il guado è una lingua di muschio
      fra due canali, e i tre paletti rossi stanno piantati a triangolo, due
      scrostati dagli anni e il terzo lucido e storto, messo da qualcuno che
      aveva fretta. Dentro il triangolo il muschio galleggia, e sotto, a un
      braccio nell'acqua nera, c'è una lastra di pietra con un anello di
      metallo.

      {origine fuggiasco-di-ghoran} Dal carro di Ghoran guardavi questa palude
      di notte anche se i sorveglianti lo vietavano, perché era l'unica cosa
      che non apparteneva a nessuno.
    opzioni:
      - testo: "Immergersi e sollevare la lastra"
        descrizione: "L'acqua è fredda e la lastra pesa."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: L'anello
          testo: |
            Ti cali nell'acqua fino alle spalle e tiri l'anello puntando i piedi
            sui sassi, e la lastra si solleva con un risucchio su un pozzetto con
            i pioli e un'aria più tiepida.
          pe: { atletica: 2 }
          vai: tamburi-di-fondo
        fallimento:
          titolo: Il freddo nelle mani
          testo: |
            L'acqua è così fredda che le mani non tirano, e ti serve un fuoco di
            canne prima di sentire di nuovo le dita.
          effetti: { ferite: 0.5 }
      - testo: "Cercare dove il muschio è tiepido"
        descrizione: "I cacciatori dicono che dopo i colpi il muschio resta tiepido."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Lo sfiatatoio
          testo: |
            Vicino al paletto nuovo il muschio è tiepido, e sotto c'è una grata
            coperta di radici con una scaletta asciutta che scende accanto al
            pozzetto.
          pe: { percezione: 2 }
          vai: tamburi-di-fondo
        fallimento:
          titolo: Muschio freddo
          testo: |
            Il muschio è freddo dappertutto, e dopo un'ora di carponi hai una
            sanguisuga attaccata al polso.
          effetti: { ferite: 0.5 }
      - testo: "Far tirare la lastra al cavallo"
        descrizione: "Il cavallo tira meglio di qualunque cacciatore di anguille."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il cavallo tira
          testo: |
            Il cavallo tira con gli zoccoli piantati sui sassi, e la lastra viene
            su con un risucchio e si rovescia nel muschio, sopra il pozzetto con i
            pioli.
          vai: tamburi-di-fondo
      - testo: "Aspettare l'acqua bassa dell'alba"
        descrizione: "All'alba i canali calano di un palmo, se si passa la notte sul guado."
        costo: 2
        esito:
          titolo: L'acqua bassa
          testo: |
            Passi la notte su un sasso a venti passi dai paletti, e a mezzanotte
            la terra bussa tre volte sotto di te. All'alba l'acqua è calata e la
            lastra si solleva con una leva di legno.
          vai: tamburi-di-fondo

  # ------------------------------------------------------------ 0 · il pozzetto e gli amuleti
  - id: tamburi-di-fondo-il-pozzetto
    immagine: ambientazione/palude-acquanera
    titolo: Il pozzetto
    sommario: "I pioli scendono in un'acqua nera che arriva al petto, fredda come la neve."
    luogo: I Tamburi di Fondo, il pozzetto
    area: tamburi-di-fondo
    ripetibile: true
    requisiti: [profondita.tamburi-di-fondo == 0]
    testo: |
      I pioli del pozzetto scendono in un'acqua che in fondo ti arriva al
      petto e ti sale addosso come un vestito bagnato. Davanti si apre una
      camera bassa con un'apertura scura in fondo, e sulla parete opposta
      una seconda fila di pioli sale a una sporgenza.

      {resistenza Media} Il freddo morde e poi smette, ed è allora che
      bisogna preoccuparsi.
    opzioni:
      - testo: "Attraversare la camera nell'acqua"
        descrizione: "Venti passi d'acqua gelata, da fare prima che le gambe smettano di rispondere."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: Venti passi
          testo: |
            Attraversi a passi lunghi con i denti che battono, e all'apertura
            scura il pavimento sale e l'acqua ti scende alla vita.
          pe: { resistenza: 2 }
          effetti: { profondita.tamburi-di-fondo: 1 }
        fallimento:
          titolo: Le gambe di legno
          testo: |
            A metà camera le gambe smettono di rispondere, e torni ai pioli
            trascinandoti con le braccia.
          effetti: { ferite: 0.5 }
      - testo: "Salire sulla sporgenza e passare all'asciutto"
        descrizione: "La seconda fila di pioli porta a una sporgenza stretta."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La sporgenza
          testo: |
            La sporgenza continua lungo la parete, stretta quanto una mano ma
            asciutta, e la percorri con la pancia contro il metallo fino
            all'apertura scura.
          pe: { percezione: 2 }
          effetti: { profondita.tamburi-di-fondo: 1 }
        fallimento:
          titolo: La sporgenza che finisce
          testo: |
            La sporgenza finisce a metà parete e cadi nell'acqua di schiena, e la
            lampada si spegne con un sibilo.
          effetti: { ferite: 0.5 }
      - testo: "Scendere piano e lasciare che il freddo passi"
        descrizione: "Il corpo si abitua a tutto, se gli si lascia il tempo."
        costo: 2
        esito:
          titolo: Abituarsi
          testo: |
            Scendi fermandoti a ogni piolo finché il freddo è soltanto freddo, e
            attraversi la camera con la pelle blu fino al petto.
          effetti: { profondita.tamburi-di-fondo: 1, ferite: 0.5 }

  - id: tamburi-di-fondo-gli-amuleti
    immagine: fazioni/tribu-spacca-ossa
    titolo: Gli amuleti degli orchi
    sommario: "Un corridoio attraversato da fili di lische e ossa appesi dagli Spacca-ossa."
    luogo: I Tamburi di Fondo, il corridoio degli amuleti
    area: tamburi-di-fondo
    ripetibile: true
    requisiti: [profondita.tamburi-di-fondo == 0]
    testo: |
      Dalla prima camera parte un corridoio attraversato da fili di canna a
      un palmo l'uno dall'altro, da cui pendono lische di pesce e ossicini
      anneriti. Sulle pareti è dipinta con il fango rosso dei canali una
      mano aperta, con il palmo verso il fondo.

      {conoscenze-della-strada Media} Sono amuleti vecchi degli Spacca-ossa,
      e la mano dice a quello che sta laggiù di restarci.
    opzioni:
      - testo: "Passare fra i fili senza toccarli"
        descrizione: "Un palmo fra un filo e l'altro, e un corpo che sa piegarsi."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Fra le lische
          testo: |
            Passi di fianco sotto un filo e sopra l'altro, con le lische che ti
            dondolano davanti agli occhi, e dall'altra parte ti accorgi di aver
            tenuto le labbra strette per tutto il tempo.
          pe: { furtivita: 2 }
          effetti: { profondita.tamburi-di-fondo: 1 }
        fallimento:
          titolo: Il filo spezzato
          testo: |
            Un filo ti si impiglia nella fibbia e le lische cadono nell'acqua come
            pioggia, e torni indietro senza un motivo che sapresti spiegare.
          effetti: { tormento: 0.5 }
      - testo: "Leggere i nodi"
        descrizione: "Gli orchi della palude non sprecano un nodo."
        prova: { attributo: mentale, abilita: [natura, accademiche], difficolta: Media }
        successo:
          titolo: Il nodo aperto
          testo: |
            Su ogni filo c'è un nodo più largo, sempre vicino alla parete di
            destra, che chi li ha annodati lasciava per sé. Passi lungo la parete
            sciogliendo ogni nodo largo e rifacendolo dietro di te.
          pe: { natura: 2 }
          effetti: { profondita.tamburi-di-fondo: 1 }
        fallimento:
          titolo: Nodi stretti
          testo: |
            Più guardi i nodi più ti sembrano tutti diversi, e quando ne sciogli
            uno il filo ti cade addosso.
          effetti: { tormento: 0.5 }
      - testo: "Tagliare i fili e passare"
        descrizione: "Si tagliano con un colpo, ma gli orchi che li hanno appesi sapevano perché."
        costo: 2
        esito:
          titolo: Il corridoio aperto
          testo: |
            Le lische tagliate galleggiano un momento e affondano, e mentre scendi
            senti le spalle pesanti, come quando entri in una casa senza bussare e
            c'è qualcuno.
          effetti: { profondita.tamburi-di-fondo: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 1 · la scala sommersa e la pellicola grigia
  - id: tamburi-di-fondo-la-scala-sommersa
    immagine: ambientazione/palude-acquanera
    titolo: La scala sommersa
    sommario: "Una scala scende nell'acqua e sparisce. Dall'altra parte, dicono i gradini, c'è aria."
    luogo: I Tamburi di Fondo, la scala sommersa
    area: tamburi-di-fondo
    ripetibile: true
    requisiti: [profondita.tamburi-di-fondo == 1]
    testo: |
      Il pavimento finisce contro una scala larga che scende nell'acqua nera,
      e il soffitto scende con lei fino alla superficie. Sul primo gradino
      una corda annodata è legata a un anello e sparisce tesa nell'acqua.

      {atletica Media} Fino a dove il soffitto risale ci saranno dieci
      bracciate, e altre dieci per tornare se di là non c'è aria.
    opzioni:
      - testo: "Nuotare lungo la scala"
        descrizione: "Dieci bracciate nell'acqua nera, seguendo i gradini con la mano."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Dieci bracciate
          testo: |
            All'ottava bracciata la mano trova un pavimento che risale, ed esci in
            una camera piena d'aria che sa di ferro, tossendo finché i polmoni
            smettono di bruciare.
          pe: { atletica: 2 }
          effetti: { profondita.tamburi-di-fondo: 1 }
        fallimento:
          titolo: Il soffitto
          testo: |
            A metà strada sbatti la testa contro il soffitto e perdi la scala, e
            riemergi dove eri partito sputando acqua nera.
          effetti: { ferite: 0.5 }
      - testo: "Seguire la corda di chi è passato"
        descrizione: "Una corda tesa porta da qualche parte, se ci si fida di chi l'ha legata."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: La corda
          testo: |
            Ti tiri lungo la corda a occhi chiusi, una mano dopo l'altra, e dopo
            due svolte sbuchi in una camera piena d'aria con la mano ancora
            stretta sui nodi.
          pe: { resilienza: 2 }
          effetti: { profondita.tamburi-di-fondo: 1 }
        fallimento:
          titolo: Il capo della corda
          testo: |
            La corda finisce a metà strada, legata a un piolo, e torni indietro
            tirandoti sui nodi con i polmoni che bruciano.
          effetti: { tormento: 0.5 }
      - testo: "Legare una corda tua e tirarsi a forza di braccia"
        descrizione: "Una corda nuova si porta avanti a tratti, ma l'acqua è fredda."
        costo: 2
        esito:
          titolo: La corda nuova
          testo: |
            Porti avanti la tua corda a tratti, tornando ogni volta a prendere
            aria, e quando arrivi dall'altra parte hai le mani spaccate e le
            labbra viola.
          effetti: { profondita.tamburi-di-fondo: 1, ferite: 0.5 }

  - id: tamburi-di-fondo-la-pellicola-grigia
    immagine: ambientazione/marea-grigia
    titolo: La pellicola grigia
    sommario: "In una camera la pellicola sull'acqua è spessa come una pelle, e l'aria sa di ferro."
    luogo: I Tamburi di Fondo, la camera grigia
    area: tamburi-di-fondo
    ripetibile: true
    requisiti: [profondita.tamburi-di-fondo == 1]
    testo: |
      Qui la pellicola è spessa come la pelle del latte bollito, e invece di
      rompersi ti si piega intorno alle gambe e sale sui calzoni. Si muove
      piano a strisce sull'acqua, e in fondo alla camera, nell'aria che odora
      di ferro, c'è una porta bassa socchiusa.

      {medicina Media} La pelle formicola dove l'ha toccata. Tienila lontana
      dalla bocca e da qualsiasi taglio.
    opzioni:
      - testo: "Coprirsi naso e bocca e passare in fretta"
        descrizione: "Quello che non entra non fa danno."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: Il panno bagnato
          testo: |
            Con il fazzoletto bagnato sulla faccia e i polsini chiusi con lo spago
            attraversi a passi lunghi, e alla porta raschi la pellicola dai
            calzoni con il dorso del coltello.
          pe: { medicina: 2 }
          effetti: { profondita.tamburi-di-fondo: 1 }
        fallimento:
          titolo: Il taglio
          testo: |
            La pellicola trova un taglio sul dorso della tua mano, e torni
            indietro a strofinarlo nell'acqua del pozzetto finché la pelle è
            rossa.
          effetti: { contaminazione: 0.5 }
      - testo: "Seguire le strisce dove l'acqua è pulita"
        descrizione: "Fra una striscia e l'altra l'acqua è scura e pulita."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Fra le strisce
          testo: |
            Passi nell'acqua scura fra le strisce, cambiando strada quando si
            chiudono, e arrivi alla porta bassa con i calzoni puliti.
          pe: { natura: 2 }
          effetti: { profondita.tamburi-di-fondo: 1 }
        fallimento:
          titolo: La striscia che si chiude
          testo: |
            La striscia pulita si chiude mentre ci sei in mezzo, e torni indietro
            con la pellicola fino alla cintura.
          effetti: { contaminazione: 0.5 }
      - testo: "Attraversare e pulirsi dopo"
        descrizione: "Dall'altra parte ci si pulisce come si può."
        costo: 2
        esito:
          titolo: La pelle grigia
          testo: |
            Alla porta bassa ti raschi la pellicola dalle gambe, ma una parte è
            già entrata nella stoffa, e la pelle dei polpacci ti tira come dopo
            una scottatura.
          effetti: { profondita.tamburi-di-fondo: 1, contaminazione: 0.5 }

  # ------------------------------------------------------------ 1–2 · le anguille di fondo
  - id: tamburi-di-fondo-le-anguille
    immagine: ambientazione/palude-acquanera
    titolo: Le anguille di fondo
    sommario: "Qualcosa di lungo e cieco ti sfiora le gambe nell'acqua."
    luogo: I Tamburi di Fondo, la camera delle anguille
    area: tamburi-di-fondo
    ripetibile: true
    requisiti: [profondita.tamburi-di-fondo >= 1, profondita.tamburi-di-fondo <= 2]
    testo: |
      Nell'acqua alla vita qualcosa di lungo e liscio ti sfiora i polpacci, e
      alla luce della lampada si inarca una schiena grigia lunga quanto un
      uomo, con una testa senza occhi e denti fini come aghi. Le schiene ti
      girano intorno sempre più strette.

      {natura Media} Queste anguille vivono al buio da generazioni e sentono
      soltanto il movimento dell'acqua.
    opzioni:
      - testo: "Combattere nell'acqua"
        descrizione: "Sono due, e l'acqua è la loro. Però sono cieche."
        combattimento: tamburi-di-fondo-anguille
        vittoria:
          titolo: Le schiene ferme
          testo: |
            L'ultima anguilla resta a galla con la pancia bianca, e nello stomaco
            di una trovi un anello di metallo inciso, ingoiato chissà quando.
          effetti: { profondita.tamburi-di-fondo: 1, reliquie.scheggia: 1 }
        sconfitta:
          titolo: I denti fini
          testo: |
            I denti fini ti lasciano sulle gambe file di buchi che bruciano, e
            torni scalciando fino al primo gradino asciutto.
      - testo: "Restare immobili finché se ne vanno"
        descrizione: "Sentono il movimento. Una cosa ferma, per un'anguilla cieca, è un sasso."
        prova: { attributo: fisico, abilita: [furtivita, resistenza], difficolta: Media }
        successo:
          titolo: Un sasso nell'acqua
          testo: |
            Resti fermo con la lampada alzata, senza muovere le dita dei piedi,
            finché le anguille si allargano e spariscono in un canale laterale.
          pe: { furtivita: 2 }
          effetti: { profondita.tamburi-di-fondo: 1 }
        fallimento:
          titolo: Il piede che scivola
          testo: |
            Il piede scivola su qualcosa di molle e l'acqua si muove, e
            un'anguilla ti morde il polpaccio prima che tu torni al gradino.
          effetti: { ferite: 0.5 }
      - testo: "Tornare indietro e prendere il canale stretto"
        descrizione: "Il canale laterale è troppo basso per le anguille, e per te ci vuole pazienza."
        costo: 2
        esito:
          titolo: Il canale stretto
          testo: |
            Fai il canale sdraiato nell'acqua con la faccia di lato, e ne esci in
            una camera più avanti con i gomiti scorticati.
          effetti: { profondita.tamburi-di-fondo: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · il cacciatore e le piastre nuove
  - id: tamburi-di-fondo-il-cacciatore
    immagine: ambientazione/palude-acquanera
    titolo: Il cacciatore che contava
    sommario: "Su una sporgenza asciutta un cacciatore morto da anni tiene in grembo una tavoletta di tacche."
    luogo: I Tamburi di Fondo, la sporgenza
    area: tamburi-di-fondo
    ripetibile: true
    requisiti: [profondita.tamburi-di-fondo == 2]
    testo: |
      Su una sporgenza asciutta è seduto con la schiena al muro un cacciatore
      di anguille morto da molti anni, seccato dal freddo, con la giubba
      cerata e accanto un paletto dalla vernice rossa quasi andata. In grembo
      tiene una tavoletta coperta di tacche, tre per fila, con un pesce
      inciso in un angolo, e l'ultima fila ha due tacche sole.

      {origine accolito-del-velo} Le parole per chi è morto senza veglia ti
      escono a mezza voce prima che tu decida di dirle.
    opzioni:
      - testo: "Guardare come è morto"
        descrizione: "Un cacciatore di anguille non muore sott'acqua per caso."
        prova: { attributo: mentale, abilita: [medicina, percezione], difficolta: Media }
        successo:
          titolo: L'attesa
          testo: |
            Non è annegato. Ha la cintura stretta di tre buchi oltre il segno
            vecchio, morto di fame aspettando con gli occhi sulla parete di
            fronte, dove sotto la muffa scende un passaggio con tre tacche sullo
            stipite.
          pe: { medicina: 2 }
          effetti: { profondita.tamburi-di-fondo: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La mano che cade
          testo: |
            Gli sollevi il polso e la mano si stacca con un rumore di legno secco,
            e la rimetti con cura sulla tavoletta.
          effetti: { tormento: 0.5 }
      - testo: "Contare le tacche della tavoletta"
        descrizione: "Tre per fila, una notte dopo l'altra."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le notti
          testo: |
            Quasi tre mesi di notti da tre colpi, e l'ultima ne ha sentiti due.
            Sul retro ha inciso una porta rotonda con un cerchio sopra e una
            freccia verso la parete di fronte, e la segui.
          pe: { accademiche: 2 }
          effetti: { profondita.tamburi-di-fondo: 1 }
        fallimento:
          titolo: Il conto che non torna
          testo: |
            Conti le file tre volte e ti escono tre numeri diversi, e ti accorgi
            di averlo chiamato con un nome qualsiasi mentre contavi.
          effetti: { tormento: 0.5 }
      - testo: "Coprirlo con la sua giubba e passare oltre"
        descrizione: "Qui non si può seppellire nessuno. Si può almeno coprirgli la faccia."
        costo: 2
        esito:
          titolo: La giubba
          testo: |
            Gli tiri la giubba cerata sopra la testa e cerchi un'altra strada
            lungo la parete, e per l'ora che ci metti lo senti alle spalle, seduto
            ad aspettare.
          effetti: { profondita.tamburi-di-fondo: 1, tormento: 0.5 }

  - id: tamburi-di-fondo-le-piastre-nuove
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le piastre nuove
    sommario: "In una nicchia asciutta, piastre di metallo chiaro mai incise, impilate fino al soffitto."
    luogo: I Tamburi di Fondo, la nicchia delle piastre
    area: tamburi-di-fondo
    ripetibile: true
    requisiti: [profondita.tamburi-di-fondo == 2]
    testo: |
      In una nicchia asciutta ci sono piastre di metallo chiaro impilate fino
      al soffitto, grandi come la pietra di un focolare, con lo spigolo che
      taglia come una lama nuova. Accanto, in un telaio, un braccio con una
      punta di diamante è fermo sopra una piastra incisa per metà, e in cima
      alla pila si vede un passaggio basso.
    opzioni:
      - testo: "Guardare la piastra incisa a metà"
        descrizione: "Quello che il braccio ha inciso dice che cosa incide."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il lavoro a metà
          testo: |
            La piastra ha file di numeri dei Precursori uguali tranne l'ultima
            cifra, e quando si consuma il braccio ne prende una nuova dalla pila.
            Dietro il telaio raccogli una scheggia caduta dal braccio.
          pe: { tecnologia: 2 }
          effetti: { profondita.tamburi-di-fondo: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: La punta
          testo: |
            Il braccio si sposta di un dito verso la tua mano e ti lascia un
            graffio sottile sulle nocche.
          effetti: { ferite: 0.5 }
      - testo: "Arrampicarsi sulla pila"
        descrizione: "Gli spigoli tagliano, e bisogna tenersi soltanto alle facce."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Sulle facce
          testo: |
            Sali con i palmi aperti sulle facce lisce, senza toccare gli spigoli,
            e in cima strisci nel passaggio finché senti di nuovo l'acqua sotto le
            mani.
          pe: { atletica: 2 }
          effetti: { profondita.tamburi-di-fondo: 1 }
        fallimento:
          titolo: Lo spigolo
          testo: |
            A metà pila la mano si stringe da sola sullo spigolo, e scendi a
            fasciare un taglio dritto che sanguina più di quanto vorresti.
          effetti: { ferite: 0.5 }
      - testo: "Spostare le piastre e farsi una scala"
        descrizione: "Una piastra alla volta, con le mani fasciate, e ci vuole il pomeriggio."
        costo: 2
        esito:
          titolo: La scala di piastre
          testo: |
            Sposti le piastre fino a farti una scala storta, e nonostante le
            maniche sulle mani arrivi in cima con due tagli sottili su ogni palmo.
          effetti: { profondita.tamburi-di-fondo: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · il corridoio dei colpi e il cerchio sulla porta
  - id: tamburi-di-fondo-il-corridoio-dei-colpi
    immagine: ambientazione/palude-acquanera
    titolo: Il corridoio dei colpi
    sommario: "Un corridoio con le pareti ammaccate a tre colpi alla volta, e cerchi sull'acqua ferma."
    luogo: I Tamburi di Fondo, il corridoio dei colpi
    area: tamburi-di-fondo
    ripetibile: true
    requisiti: [profondita.tamburi-di-fondo == 3]
    testo: |
      Il corridoio corre dritto verso nord con l'acqua alle ginocchia, e le
      pareti sono segnate da ammaccature tonde a tre a tre, come se un pugno
      grande quanto una botte avesse bussato su tutta la lunghezza.
      Sull'acqua ferma si aprono ogni tanto tre cerchi, e lungo la parete
      sinistra corre una sporgenza stretta quanto un piede.
    opzioni:
      - testo: "Camminare nell'acqua contando i cerchi"
        descrizione: "I cerchi vengono a tre a tre, e contandoli sai quando arriva il prossimo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Tre cerchi
          testo: |
            Ti fermi a ogni gruppo di cerchi e li lasci passare intorno alle
            ginocchia, fino a una porta rotonda, e ci metti un po' ad aprire le
            dita contratte a pugno.
          pe: { resilienza: 2 }
          effetti: { profondita.tamburi-di-fondo: 1 }
        fallimento:
          titolo: Il conto nelle orecchie
          testo: |
            Dopo il ventesimo gruppo senti i tre colpi anche quando non ci sono, e
            poi nei denti, e torni indietro ad aspettare che passino.
          effetti: { tormento: 0.5 }
      - testo: "Camminare sulla sporgenza"
        descrizione: "Sopra l'acqua, dove i cerchi non arrivano."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Sopra l'acqua
          testo: |
            Cammini di fianco sulla sporgenza con la schiena al muro, mentre
            l'acqua sotto si increspa per conto suo, fino a una porta rotonda.
          pe: { acrobazia: 2 }
          effetti: { profondita.tamburi-di-fondo: 1 }
        fallimento:
          titolo: La sporgenza bagnata
          testo: |
            La sporgenza è viscida e cadi nell'acqua battendo il gomito, e torni
            all'inizio con il braccio che non vuole piegarsi.
          effetti: { ferite: 0.5 }
      - testo: "Tirare dritto nell'acqua senza badare ai cerchi"
        descrizione: "Sono cerchi d'acqua. Si cammina, e basta."
        costo: 2
        esito:
          titolo: I colpi nelle gambe
          testo: |
            A ogni gruppo di cerchi senti il colpo nelle ossa delle gambe fino al
            bacino, e arrivi alla porta rotonda zoppicando come un vecchio.
          effetti: { profondita.tamburi-di-fondo: 1, tormento: 1 }

  - id: tamburi-di-fondo-il-cerchio-sulla-porta
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il cerchio sulla porta
    sommario: "Una porta rotonda con un cerchio di nove incavi, uno più profondo degli altri."
    luogo: I Tamburi di Fondo, la porta rotonda
    area: tamburi-di-fondo
    ripetibile: true
    requisiti: [profondita.tamburi-di-fondo == 3]
    testo: |
      In fondo al corridoio c'è una porta rotonda di metallo scuro alta il
      doppio di un uomo. Al posto della maniglia ha al centro nove incavi in
      cerchio, uno più profondo degli altri, e intorno lo stesso segno dei
      Precursori ripetuto nove volte. Con l'orecchio al metallo senti un
      ticchettio fino, come di una pendola.

      {accademiche Media} Chi ha fatto la porta contava fino a nove, e uno
      dei nove era questo posto.
    opzioni:
      - testo: "Premere l'incavo più profondo"
        descrizione: "Una porta senza maniglie si apre da qualche parte."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: L'incavo
          testo: |
            Premi il pollice nell'incavo profondo e il cerchio gira di un nono, e
            la porta si apre verso l'interno senza un rumore, sul ticchettio più
            forte.
          pe: { tecnologia: 2 }
          effetti: { profondita.tamburi-di-fondo: 1 }
        fallimento:
          titolo: Il cerchio che non gira
          testo: |
            Il cerchio non si muove, e quando batti il palmo sulla porta per la
            stizza dalla camera ti risponde un colpo solo e debole. Ti allontani
            senza voltarti.
          effetti: { tormento: 0.5 }
      - testo: "Leggere i segni intorno al cerchio"
        descrizione: "Se uno dei nove segni è questo posto, gli altri otto sono altrove."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Nove volte
          testo: |
            Ricopiando il segno ti accorgi che cambia di un tratto a ogni
            ripetizione, come un numero che sale. Tocchi quello accanto all'incavo
            profondo, che ha un tratto in più, e la porta si apre.
          pe: { accademiche: 2 }
          effetti: { profondita.tamburi-di-fondo: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il segno che scivola
          testo: |
            Il segno torna diverso a ogni sguardo, e chiudi il quaderno con un po'
            di nausea, appoggiato alla parete che ticchetta.
          effetti: { tormento: 0.5 }
      - testo: "Aspettare che la porta si apra da sola"
        descrizione: "A mezzanotte la porta si apre, perché il battente deve pur bussare su qualcosa."
        costo: 2
        esito:
          titolo: Il freddo della porta
          testo: |
            Aspetti sulla sporgenza con le ginocchia al petto e il freddo nelle
            ossa, e quando la porta si apre con un sospiro lungo non sai da quanto
            sei lì.
          effetti: { profondita.tamburi-di-fondo: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · il battente
  - id: tamburi-di-fondo-il-battente
    immagine: bestiario/salvaguardia-precursori
    titolo: Il battente
    sommario: "Un pilastro con una piastra di numeri, e sopra un braccio di metallo grosso come un tronco che a mezzanotte bussa."
    luogo: I Tamburi di Fondo, la camera del battente
    area: tamburi-di-fondo
    requisiti: [profondita.tamburi-di-fondo >= 4, misura.tamburi == 0]
    testo: |
      La camera è rotonda e alta, con l'acqua nera fino alla vita. Al centro
      esce dall'acqua un pilastro di metallo chiaro largo come un pozzo, con
      la testa ammaccata e in cima un cerchio di nove incavi. Sulla faccia
      rivolta verso di te c'è una piastra coperta di numeri dei Precursori,
      e accanto aspetta un braccio sottile con una punta di diamante.

      Sopra il pilastro, appeso alla volta con un'articolazione grande come
      una ruota di mulino, c'è il battente, un braccio di metallo nero
      grosso come un tronco e piegato al gomito, che finisce in una massa
      tonda. Il ticchettio della volta sta accelerando.

      {origine allievo-di-torvessa} All'Accademia i numeri dei Precursori si
      copiano il primo anno, e capisci che l'ultima riga della piastra è un
      numero solo, molto lungo.

      Il gomito si apre piano, e la massa tonda si solleva verso la volta
      per prendere lo slancio.
    opzioni:
      - testo: "Salire sul pilastro e tenere testa al battente"
        descrizione: "Il battente bussa sul pilastro, e chi ci sta sopra prende tre colpi per leggere il conto."
        combattimento: tamburi-di-fondo-battente
        vittoria:
          titolo: Il conto
          testo: |
            Al terzo colpo il battente cede e si ritira, mentre la punta incide e
            l'ultima riga scala di tre. La ricopi con le mani che tremano e
            ripeschi una rotella dentata caduta dal gomito e due frammenti della
            piastra vecchia. Domani a mezzanotte busserà di nuovo.

            {espressivita Media} Nell'acqua è rimasta una nota bassa, quella che i
            mercenari di Ghoran raccontano sulle alture, che fa cantare i
            coltelli.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.tamburi: 1, oggetto.tamburi-di-fondo-rotella-del-conto: 1, reliquie.frammento-inciso: 2, parte.involucro-3: 1, bottino.parti-di-drone: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Il secondo colpo
          testo: |
            Il secondo colpo ti butta giù dal pilastro nell'acqua nera, e il terzo
            lo senti nel petto. Riemergi senza lampada e risali a tentoni fino al
            pozzetto, senza aver letto niente.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Leggere il conto dall'acqua tra un colpo e l'altro"
        descrizione: "Fra un colpo e l'altro c'è il tempo di leggere una riga, se la lampada sta ferma."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Difficile }
        successo:
          titolo: Tre righe
          testo: |
            Dall'acqua, a cinque passi dal pilastro, leggi la riga fra un colpo e
            l'altro finché sei sicuro, e quando il battente si ritira ripeschi una
            rotella dentata caduta dal gomito e un frammento di piastra.
          pe: { percezione: 5 }
          effetti: { misura.tamburi: 1, oggetto.tamburi-di-fondo-rotella-del-conto: 1, reliquie.frammento-inciso: 2, parte.involucro-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'onda
          testo: |
            Al primo colpo l'onda ti spegne la lampada e al secondo ti sbatte
            contro la parete, e risali con le prime cifre del conto e una spalla
            che non si alza più.
          effetti: { ferite: 1.5, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ordinare al battente di fermarsi a metà"
        descrizione: "Un braccio che bussa da secoli forse accetta di aspettare un momento."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: A mezz'aria
          testo: |
            Alla formula la massa tonda si ferma a mezz'aria e ricopi con calma
            l'ultima riga. Poi il battente bussa tre volte, e raccogli una rotella
            dentata saltata dal gomito e un frammento della piastra.
          pe: { magia: 5 }
          effetti: { misura.tamburi: 1, oggetto.tamburi-di-fondo-rotella-del-conto: 1, reliquie.frammento-inciso: 2, parte.involucro-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La formula nell'acqua
          testo: |
            La formula ti esce a metà e il battente non si ferma, e l'onda del
            colpo ti riempie la bocca di acqua grigia. La tosse ti dura fino alla
            Superficie.
          effetti: { contaminazione: 1, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Aspettare i colpi sott'acqua, accanto al pilastro"
        descrizione: "Sott'acqua, accanto al pilastro, si aspetta che finisca e si risale a leggere."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Difficile }
        successo:
          titolo: Sotto l'acqua nera
          testo: |
            Aggrappato alla base del pilastro senti i tre colpi nel petto come
            pugni, e risali a leggere l'ultima riga con una rotella dentata e un
            frammento di piastra trovati sul fondo.
          pe: { resistenza: 5 }
          effetti: { misura.tamburi: 1, oggetto.tamburi-di-fondo-rotella-del-conto: 1, reliquie.frammento-inciso: 2, parte.involucro-2: 1, contaminazione: 0.5 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il terzo colpo
          testo: |
            Al secondo colpo risali troppo presto e il terzo ti prende sulla
            schiena, e riemergi lontano dal pilastro, con la bocca piena d'acqua
            grigia e senza il conto.
          effetti: { ferite: 1, contaminazione: 1, tormento: 1 }
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo la misura · un'altra mezzanotte (ripetibile)
  - id: tamburi-di-fondo-un-altra-mezzanotte
    immagine: bestiario/salvaguardia-precursori
    titolo: Un'altra mezzanotte
    sommario: "Il battente bussa ancora, con uno scatto storto nel gomito, e il conto scende."
    luogo: I Tamburi di Fondo, la camera del battente
    area: tamburi-di-fondo
    ripetibile: true
    requisiti: [profondita.tamburi-di-fondo >= 4, misura.tamburi >= 1]
    testo: |
      Il ticchettio accelera come l'altra volta, e il gomito del battente,
      senza la rotella, si solleva con uno scatto storto. Sulla piastra
      l'ultima riga è più corta di tre colpi per ogni notte passata.

      {tecnologia Media} Sott'acqua, intorno al pilastro, luccicano i pezzi
      che il battente perde a ogni colpo storto.
    opzioni:
      - testo: "Tenere testa al battente un'altra volta"
        descrizione: "Lo stesso braccio e la stessa forza, ma il conto lo sai già."
        combattimento: tamburi-di-fondo-battente
        vittoria:
          titolo: I pezzi persi
          testo: |
            Dopo il terzo colpo il battente si ritira trascinando le catene, e sul
            fondo raccogli un guscio chiuso e qualche pezzo di congegno che ha
            perso.
          effetti: { parte.involucro-2: 1, reperto.sigillato: 1, reliquie.scheggia: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Tre colpi
          testo: |
            Il battente ti butta giù dal pilastro al primo colpo, e gli altri
            due li senti da sotto l'acqua. Risali le camere a tentoni.
          vai: superficie-fratturata
      - testo: "Raccogliere i pezzi sott'acqua mentre bussa"
        descrizione: "Mentre il battente bussa, alla base del pilastro non guarda nessuno."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Sul fondo
          testo: |
            Raccogli a tentoni sul fondo mentre i colpi ti arrivano nel petto, e
            risali dopo il terzo con le mani piene.
          pe: { resistenza: 3 }
          effetti: { reperto.sigillato: 1, reliquie.scheggia: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'acqua grigia
          testo: |
            Risali troppo presto, e il secondo colpo ti rimanda giù con la
            bocca aperta. Esci dalla camera tossendo acqua grigia, a mani
            vuote.
          effetti: { contaminazione: 0.5 }
          vai: superficie-fratturata
      - testo: "Ascoltare i colpi e risalire"
        descrizione: "Il conto lo sai già. Si può anche soltanto ascoltare."
        costo: 0
        esito:
          titolo: Tre colpi e una nota
          testo: |
            Ascolti dalla soglia i tre colpi e la nota che resta nell'acqua, e
            quando esci il muschio del guado è tiepido sotto i piedi.
          vai: superficie-fratturata

nemici:
  - id: tamburi-di-fondo-anguilla
    immagine: ambientazione/palude-acquanera
    nome: Anguilla di fondo
    descrizione: "Un'anguilla grigia lunga quanto un uomo, senza occhi, con la bocca piena di denti fini come aghi. Vive nelle camere allagate sotto il guado nord da generazioni, e sente nell'acqua ogni movimento."
    attacco: 4
    difesa: 4
    difesaMentale: 3
    pf: 5
    danno: 3
    riduzione: 1
    iniziativa: 4
    tratti: [animale]

  - id: tamburi-di-fondo-battente
