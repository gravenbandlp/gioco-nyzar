    nome: Rotella del conto
    immagine: icone/gears
    descrizione: "Una rotella dentata di metallo nero, caduta dal gomito del battente dei Tamburi di Fondo. Tenuta al collo con una cordicella, scatta di un dente a ogni colpo che prendi, e all'ultimo dente si blocca e ti tiene in piedi."
    slot: accessorio
    grado: 3
    proprieta: { ultimoRespiro: true, talento: { resistenza: 1 } }

colonna:
