    nome: Il battente
    descrizione: "Un braccio di metallo nero grosso come un tronco, appeso alla volta di una camera allagata con un'articolazione grande come una ruota di mulino. Bussa tre volte ogni mezzanotte sul pilastro del conto, e chi ci sta sopra prende i colpi."
    attacco: 5
    difesa: 3
    difesaMentale: 6
    pf: 14
    danno: 4
    riduzione: 4
    iniziativa: 1

scontri:
  - { id: tamburi-di-fondo-anguille, nome: "Le anguille di fondo", nemici: [tamburi-di-fondo-anguilla, tamburi-di-fondo-anguilla], feriteSconfitta: 2 }
