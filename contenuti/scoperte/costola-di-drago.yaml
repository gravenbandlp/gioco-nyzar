# La Costola di Drago, spedizione di un luogo nero (docs/piano-superficie.md, «Le nove spedizioni dei luoghi neri»).
# Sulle alture aride a sud di Ghoran l'arco di metallo nero che esce dal fianco di una collina è la punta di una
# canna di risonanza lunga quanto la collina, che vibra giorno e notte sulla stessa nota bassa (codex
# sf-costola-di-drago). In fondo alla canna l'accordatore, una macchina con le braccia a martello, la batte per
# tenerla sulla nota. La misura del luogo è la nota (misura.costola): il diapason di metallo nero che l'accordatore
# tiene nella culla e che, battuto, la ripete.
# - Ingresso: `costola-di-drago-la-collina` (Superficie, traccia.costola >= 3), ripetibile.
# - Stanze in fasce di profondità (una stanza superata non ricompare nella stessa visita):
#   0 la crepa sotto l'arco o il cerchio di ossa; 1 la galleria degli scavatori o la volta che piove;
#   1-2 gli scrostatori (combattimento contro gregari); 2 il portello nella canna o la sala dei contrappesi;
#   3 dentro la canna o la piastra dei nove incavi.
# - Cuore a 4: `costola-di-drago-l-accordatore` (misura.costola == 0), boss o prove Difficili; la vittoria dà la
#   nota, il martello d'accordatura e reliquie. Poi `costola-di-drago-la-culla-vuota` (misura.costola >= 1),
#   ripetibile, rende parti e reperti.
# Il segno che lega il luogo agli altri: un cerchio di nove incavi con uno inciso più a fondo, sulla piastra del
# corridoio e sulla culla del diapason. Il condotto sigillato che esce dalla camera dell'accordatore porta la nota
# altrove, sotto la Superficie. I Tamburi di Fondo bussano sulla stessa nota.
aree:
  - id: costola-di-drago
    immagine: ambientazione/rovine-dei-precursori
    nome: La Costola di Drago
    sommario: "La collina è cava, e dentro una canna di metallo vibra sempre sulla stessa nota."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      La costola che si vede da fuori è la punta di una canna larga come la
      navata di una chiesa, che scende nella collina cava e sparisce nel
      buio. Vibra giorno e notte su una nota troppo bassa per l'orecchio,
      che senti nei denti, e la polvere sul metallo si dispone in linee che
      si spostano piano.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: costola-di-drago-la-collina
    immagine: ambientazione/ghoran
    titolo: La collina dove le capre non salgono
    sommario: "A sud di Ghoran un arco di metallo nero esce da una collina dove le capre non salgono."
    luogo: Superficie Fratturata, le alture aride a sud di Ghoran
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.costola >= 3]
    testo: |
      Sulle alture gialle a sud di Ghoran le capre pascolano ovunque tranne
      su una collina, dal cui fianco esce un arco di metallo nero curvo come
      la costola di una bestia sepolta. Alla base si apre una crepa, e sul
      bordo c'è una lattina con due palline di cera gialla.

      {resistenza Media} A venti passi dall'arco i denti ti si stringono.

      {origine fuggiasco-di-ghoran} Dai recinti queste alture si vedevano,
      ma nessuno scappava da questa parte, dove non c'è acqua.

      *Cera per le orecchie, lasciata a chi viene dopo.* Appoggi il palmo
      sull'arco, e il metallo ti ronza fino al gomito.
    opzioni:
      - testo: "Calarsi nella crepa"
        descrizione: "La crepa scende ripida lungo il metallo, e chi tocca la canna se ne pente."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Lungo il metallo
          testo: |
            Scendi con la schiena contro la terra e i piedi sulle radici secche,
            senza mai toccare il metallo, finché la crepa si apre sul buio della
            collina cava.
          pe: { atletica: 2 }
          vai: costola-di-drago
        fallimento:
          titolo: La mano sul metallo
          testo: |
            A metà discesa la terra cede e ti aggrappi all'arco, e la vibrazione
            ti sale fino alla spalla. Risali e resti seduto sull'erba finché la
            mano smette di formicolare.
          effetti: { ferite: 0.5 }
      - testo: "Cercare dove la terra è smossa"
        descrizione: "La cera l'ha lasciata uno che è sceso, e chi scende lascia una strada."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: I gradini scavati
          testo: |
            Sul lato in ombra dell'arco trovi una fila di gradini scavati con la
            punta di una pala, mezzi coperti dall'erba, che scendono accanto al
            metallo senza toccarlo.
          pe: { percezione: 2 }
          vai: costola-di-drago
        fallimento:
          titolo: Terra uguale
          testo: |
            Dopo un'ora di giri intorno all'arco non hai trovato niente, e ti
            accorgi di aver stretto i denti per tutto il tempo.
          effetti: { tormento: 0.5 }
      - testo: "Legare il cavallo all'arco e scendere con la corda"
        descrizione: "Il cavallo resta lontano dal metallo, e tiene una corda meglio di un uomo."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: La corda tesa
          testo: |
            Il cavallo si ferma a trenta passi dall'arco e non va più avanti.
            Leghi la corda alla sella e ti cali nella crepa fino al buio della
            collina cava.
          vai: costola-di-drago
      - testo: "Allargare la crepa con la pala"
        descrizione: "La terra secca viene via facile, e ci vuole il pomeriggio."
        costo: 2
        esito:
          titolo: Il pomeriggio di pala
          testo: |
            Scavi fino al tramonto, con la cera nelle orecchie e un fazzoletto
            sulla bocca, finché la crepa è larga abbastanza per scendere in piedi.
          vai: costola-di-drago

  # ------------------------------------------------------------ 0 · la crepa e il cerchio di ossa
  - id: costola-di-drago-la-crepa
    immagine: ambientazione/rovine-dei-precursori
    titolo: La crepa sotto l'arco
    sommario: "In fondo alla crepa si striscia con la canna a un palmo dalla faccia."
    luogo: La Costola di Drago, il fondo della crepa
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago == 0]
    testo: |
      In fondo alla crepa la terra fa un gomito, e si va avanti strisciando
      in un cunicolo basso quanto un forno, con la canna a un palmo dalla
      faccia. Per terra c'è il segno di chi è passato prima di te, una
      striscia liscia larga quanto una schiena.

      {acrobazia Media} Sui gomiti e sulle punte dei piedi si passa senza
      toccare niente, tenendo basso il sedere, che è la parte più difficile.
    opzioni:
      - testo: "Strisciare senza toccare la canna"
        descrizione: "Fra la terra e il metallo c'è un palmo di spazio."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Sui gomiti
          testo: |
            Strisci sui gomiti con la guancia contro la terra, e il metallo ti
            passa accanto all'orecchio senza sfiorarti fino a una cavità più
            larga.
          pe: { acrobazia: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: La spalla sul metallo
          testo: |
            A metà la spalla tocca la canna, e la nota ti entra nelle ossa fino
            alla mascella. Torni indietro di schiena, con la spalla che ronza.
          effetti: { ferite: 0.5 }
      - testo: "Seguire la striscia di chi è passato"
        descrizione: "Dove una schiena è già passata, ci si passa."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La strada di un altro
          testo: |
            La striscia gira larga dove il cunicolo si stringe e passa sotto una
            radice, lontano dal metallo, fino all'altra parte del gomito.
          pe: { percezione: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: La striscia che torna
          testo: |
            La striscia gira su se stessa e torna verso l'uscita, e te ne accorgi
            quando hai già la luce del giorno sulla faccia.
          effetti: { tormento: 0.5 }
      - testo: "Scavare il gomito e allargarlo"
        descrizione: "Con la pala e le mani il gomito si allarga, piano."
        costo: 2
        esito:
          titolo: La terra che trema
          testo: |
            Scavi steso su un fianco, e ogni manciata di terra ti trema in mano
            come un pugno di api. Alla fine hai le dita intorpidite.
          effetti: { profondita.costola-di-drago: 1, ferite: 0.5 }

  - id: costola-di-drago-il-cerchio-di-ossa
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il cerchio di ossa
    sommario: "In una cavità le ossa di capra stanno in cerchi perfetti."
    luogo: La Costola di Drago, la prima cavità
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago == 0]
    testo: |
      Nella prima cavità, larga come un'aia, le ossa di capra lisce come
      sapone sono disposte in cerchi concentrici intorno al punto dove la
      canna scende più vicino al suolo, con la terra pulita fra un cerchio e
      l'altro. In mezzo c'è un collare con un campanaccio di latta.

      {natura Media} Le capre entrano dove trovano ombra, e la vibrazione ha
      fatto il resto con la pazienza di un setaccio.
    opzioni:
      - testo: "Camminare sulle linee pulite"
        descrizione: "Fra un cerchio e l'altro la terra è ferma, perché la nota lì non arriva."
        prova: { attributo: mentale, abilita: [tecnologia, natura], difficolta: Media }
        successo:
          titolo: Dove la terra è ferma
          testo: |
            Cammini sulle linee pulite fra un cerchio e l'altro, e dall'altra
            parte i denti ti si sciolgono per la prima volta da quando sei sceso.
          pe: { tecnologia: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: Il cerchio che si sposta
          testo: |
            La linea pulita si sposta sotto i tuoi piedi, e torni al bordo con le
            caviglie che ronzano.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare le ossa a occhi bassi"
        descrizione: "Sono ossa di capra, e basta non pensarci."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Le ossa che tintinnano
          testo: |
            Attraversi le ossa guardandoti gli stivali, e le senti
            tintinnare piano a ogni passo, come stoviglie in una cassa.
            Dall'altra
            parte non ti volti. Il campanaccio di latta resta dov'era.
          pe: { resilienza: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: Il campanaccio
          testo: |
            A metà strada calpesti il campanaccio, e il suo suono sottile e storto
            si alza sopra la nota per la prima volta da chissà quanti anni. Torni
            indietro di corsa.
          effetti: { tormento: 0.5 }
      - testo: "Girare largo lungo la parete"
        descrizione: "La parete è lontana dalla canna, e il giro è lungo."
        costo: 2
        esito:
          titolo: Lungo la parete
          testo: |
            Giri con la spalla contro la parete, e la terra che si sbriciola ti
            riempie il colletto per tutto il resto della discesa.
          effetti: { profondita.costola-di-drago: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · la galleria e la volta che piove
  - id: costola-di-drago-la-galleria
    immagine: ambientazione/rovine-dei-precursori
    titolo: La galleria degli scavatori
    sommario: "Lungo la canna corre una galleria puntellata che qualcuno ha lasciato a metà."
    luogo: La Costola di Drago, la galleria lungo la canna
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago == 1]
    testo: |
      Lungo la canna corre una galleria scavata a mano, puntellata con travi
      di ginepro che perdono polvere a ogni sussulto. I solchi di una
      carriola si fermano davanti a una frana, oltre la quale resta un
      braccio di buio sotto il soffitto.

      {tecnologia Media} Le travi le ha messe uno che sapeva il mestiere, ma
      per un terreno fermo, e qui i cunei si sono allentati tutti nello
      stesso verso.
    opzioni:
      - testo: "Rimettere in sesto i puntelli e passare"
        descrizione: "I cunei si sono allentati tutti nello stesso verso. Basta ribatterli all'incontrario."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: I cunei ribattuti
          testo: |
            Ribatti i cunei all'incontrario con il manico del coltello, e le travi
            smettono di perdere polvere. Sposti la terra della frana quanto basta
            per passare.
          pe: { tecnologia: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: La trave che scende
          testo: |
            Ribatti il primo cuneo, e la trave scende di un dito con un gemito di
            legno. Ti tiri indietro mentre una lingua di terra ti copre gli
            stivali.
          effetti: { ferite: 0.5 }
      - testo: "Strisciare sopra la frana"
        descrizione: "Un braccio di buio basta, se non ci si ferma."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Sopra la frana
          testo: |
            Strisci fra la frana e il soffitto con la lampada spinta avanti a
            mano, e dall'altra parte scivoli giù sul sedere fino ai solchi della
            carriola.
          pe: { atletica: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: La terra in bocca
          testo: |
            A metà la terra sotto la pancia scivola indietro e ti porta con sé, e
            ti ritrovi ai piedi del mucchio a sputare terra.
          effetti: { ferite: 0.5 }
      - testo: "Scavare la frana come avrebbero fatto loro"
        descrizione: "Gli scavatori hanno lasciato il lavoro a metà, e la carriola è ancora lì."
        costo: 2
        esito:
          titolo: Il lavoro a metà
          testo: |
            Riempi e svuoti la carriola finché la frana non è un mucchio basso, e
            sul fondo trovi una pala spezzata e un sacchetto con un pezzo di pane
            diventato pietra.
          effetti: { profondita.costola-di-drago: 1, tormento: 0.5 }

  - id: costola-di-drago-la-volta-che-piove
    immagine: ambientazione/rovine-dei-precursori
    titolo: La volta che piove
    sommario: "In una sala bassa i sassi cadono dal soffitto, a tempo."
    luogo: La Costola di Drago, la sala della ghiaia
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago == 1]
    testo: |
      La sala è bassa e lunga, con la canna che la attraversa come una trave
      di casa. Dal soffitto piove ghiaia che la vibrazione stacca, e
      dall'altra parte si vede un'apertura nera.

      {percezione Media} I sassi cadono a gruppi di tre, con una pausa lunga
      quanto un passo fra un gruppo e l'altro.
    opzioni:
      - testo: "Passare nelle pause"
        descrizione: "Tre sassi e una pausa, e un passo per ogni pausa."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Un passo per pausa
          testo: |
            Conti i sassi e fai un passo in ogni pausa, come in un ballo di paese
            con il musicista sordo, e arrivi all'apertura con un solo livido sul
            polso.
          pe: { percezione: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Al quarto passo sbagli il conto, e tre sassi ti arrivano in testa uno
            dopo l'altro. Torni indietro con un bernoccolo sotto il cappuccio.
          effetti: { ferite: 0.5 }
      - testo: "Correre a testa bassa"
        descrizione: "Sono sassolini. Fanno male, ma la sala è lunga soltanto trenta passi."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Trenta passi
          testo: |
            Corri con le braccia sopra la testa, e all'apertura nera conti quattro
            sassi presi sui gomiti e uno sulla nuca.
          pe: { atletica: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: La ghiaia sotto i piedi
          testo: |
            La ghiaia ti scivola sotto gli stivali al terzo passo, e cadi in
            ginocchio sotto la pioggia di sassi. Torni indietro a carponi con
            le braccia sulla testa.
          effetti: { ferite: 0.5 }
      - testo: "Passare sotto la canna, dove i sassi rimbalzano lontano"
        descrizione: "Sotto la canna i sassi rimbalzano via, e il metallo è a un palmo dalla testa."
        costo: 2
        esito:
          titolo: Sotto la trave
          testo: |
            Cammini curvo sotto la canna, dove i sassi rimbalzano più in là, con
            la nota che ti preme sulla nuca come una mano.
          effetti: { profondita.costola-di-drago: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 1–2 · gli scrostatori
  - id: costola-di-drago-gli-scrostatori
    immagine: bestiario/salvaguardia-precursori
    titolo: Gli scrostatori
    sommario: "Due macchine piatte grattano la polvere dalla canna, e ti scambiano per una crosta."
    luogo: La Costola di Drago, il dorso della canna
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago >= 1, profondita.costola-di-drago <= 2]
    testo: |
      Sul dorso della canna camminano due macchine piatte come scudi, con
      sei zampe sottili e una fila di lame sotto la pancia, che grattano il
      metallo lasciando una striscia lucida. Quando passi sotto, la prima
      scende verso di te.

      {armi-da-mischia Media} La pancia la mostrano soltanto quando si
      alzano sulle zampe, ed è lì che si colpiscono.
    opzioni:
      - testo: "Affrontare gli scrostatori"
        descrizione: "Sono due, e mostrano la pancia quando si alzano per colpire."
        combattimento: costola-di-drago-scrostatori
        vittoria:
          titolo: Le zampe ferme
          testo: |
            Il secondo scrostatore cade sulla schiena con le zampe che grattano
            l'aria. Sotto una delle sue lame si stacca con un clic un pezzo di
            macchina.
          effetti: { profondita.costola-di-drago: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: Grattato via
          testo: |
            Gli scrostatori ti salgono addosso e ti grattano come la canna, con la
            stessa pazienza. Rotoli via e ti allontani strisciando, con la giubba
            a brandelli.
      - testo: "Restare fermi contro la terra"
        descrizione: "Puliscono il metallo e lasciano stare la terra."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Non una crosta
          testo: |
            Ti appiattisci contro la terra con la lampada coperta. Lo scrostatore
            ti tasta la manica e torna sulla canna, e passi oltre.
          pe: { furtivita: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: La manica
          testo: |
            Lo scrostatore ti tasta la manica, e la manica si muove. Le lame ti
            aprono la stoffa e un po' di pelle, e torni indietro di corsa.
          effetti: { ferite: 0.5 }
      - testo: "Tirare un sasso sulla canna più avanti"
        descrizione: "Un sasso incastrato sul metallo è una crosta nuova da pulire."
        costo: 2
        esito:
          titolo: La crosta nuova
          testo: |
            Tiri sassi sulla canna finché uno ci resta incastrato e gli
            scrostatori ci corrono sopra. Passi mentre grattano, e solo dopo ti
            accorgi del sangue che ti cola in un occhio.
          effetti: { profondita.costola-di-drago: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · il portello e i contrappesi
  - id: costola-di-drago-il-portello
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il portello nella canna
    sommario: "Sul fianco della canna c'è un portello rotondo che batte insieme alla nota."
    luogo: La Costola di Drago, il portello
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago == 2]
    testo: |
      La galleria finisce contro un portello rotondo nel fianco della canna,
      largo quanto una botte, che trema nel telaio con un colpo sordo a
      intervalli lunghi. Sulla maniglia ad anello c'è un nodo di corda
      vecchia, tagliato di netto.

      {espressivita Media} Il portello batte mezzo battito in ritardo sulla
      canna, come un cantore stonato in un coro di paese.
    opzioni:
      - testo: "Aprirlo quando il colpo si ferma"
        descrizione: "Fra un colpo e l'altro il portello è fermo."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: Fuori tempo
          testo: |
            Batti il tempo con il piede e tiri la maniglia nella pausa. Il
            portello si apre, e la nota ti viene incontro come un vento caldo.
          pe: { espressivita: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: Il colpo nel polso
          testo: |
            Tiri nel momento sbagliato, e il portello ti restituisce il colpo
            nella maniglia piegandoti il polso all'indietro.
          effetti: { ferite: 0.5 }
      - testo: "Cercare il fermo del telaio"
        descrizione: "Un portello che trema ha un fermo allentato."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il fermo
          testo: |
            Sotto il bordo del telaio spingi dentro con il palmo un perno che
            sporge di un dito, e il portello smette di battere e si apre da solo,
            piano.
          pe: { tecnologia: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: Il perno caldo
          testo: |
            Il perno sotto il bordo è caldo come una pentola sul fuoco, e lo lasci
            andare con un urlo.
          effetti: { ferite: 0.5 }
      - testo: "Legare la maniglia e tirare da lontano"
        descrizione: "Chi è venuto prima ha fatto così, e la corda l'ha dovuta tagliare."
        costo: 2
        esito:
          titolo: La corda tagliata
          testo: |
            Leghi una corda alla maniglia accanto al nodo vecchio e tiri da dieci
            passi. Il portello si apre di colpo e la nota ti butta a sedere.
            Quando ti rialzi tagli la corda anche tu.
          effetti: { profondita.costola-di-drago: 1, tormento: 1 }

  - id: costola-di-drago-i-contrappesi
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sala dei contrappesi
    sommario: "Pesi di metallo grandi come campane tengono ferma la canna."
    luogo: La Costola di Drago, la sala dei contrappesi
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago == 2]
    testo: |
      Qui la canna passa sotto una fila di pesi di metallo grandi come
      campane, appesi a catene, che oscillano appena nello stesso verso. Il
      pavimento è lontano e coperto di schegge, e l'unico passaggio è il
      dorso della canna, sotto un peso più basso degli altri.

      {accademiche Difficile} Nei mulini di Laresh le macine hanno pesi
      simili, per non ballare quando gira il vento. Questi tengono la canna
      sulla sua nota.
    opzioni:
      - testo: "Camminare sul dorso della canna fra i pesi"
        descrizione: "Il dorso è largo quanto una trave, con i pesi che oscillano a un palmo."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: La trave che canta
          testo: |
            Cammini sul dorso della canna con le braccia larghe e le ginocchia
            molli, chinandoti sotto ogni peso quando si sposta, e scendi
            dall'altra parte con le cosce che tremano.
          pe: { acrobazia: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: Il peso basso
          testo: |
            Il peso basso ti prende alla spalla mentre ti chini e ti spinge giù, e
            torni su a fatica dalla parte da cui eri partito.
          effetti: { ferite: 0.5 }
      - testo: "Capire il giro dei pesi"
        descrizione: "Oscillano tutti con lo stesso ritmo, e chi lo conosce passa senza chinarsi."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il giro
          testo: |
            I pesi si spostano uno dopo l'altro come una fila di danzatori.
            Cammini dietro l'onda, nel varco che hanno appena lasciato, senza
            chinare la testa una volta.
          pe: { tecnologia: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: Fuori dal giro
          testo: |
            Parti con l'onda e la perdi al terzo peso, che ti passa davanti al
            naso con un soffio d'aria fredda, e torni indietro di corsa.
          effetti: { tormento: 0.5 }
      - testo: "Calarsi sul pavimento e risalire dall'altra parte"
        descrizione: "Sotto ci sono le schegge, e una corda lunga."
        costo: 2
        esito:
          titolo: Le schegge
          testo: |
            Ti cali con la corda fra le schegge, affilate come vetro rotto, e
            attraversi la sala dal basso, tagliandoti i palmi due volte per
            risalire dall'altra parte.
          effetti: { profondita.costola-di-drago: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · dentro la canna e la piastra dei nove incavi
  - id: costola-di-drago-dentro-la-canna
    immagine: ambientazione/rovine-dei-precursori
    titolo: Dentro la canna
    sommario: "Dentro la canna la nota riempie tutto, e le parole scivolano via."
    luogo: La Costola di Drago, dentro la canna
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago == 3]
    testo: |
      Dentro, la canna è un tunnel di metallo nero, liscio come l'interno di
      un corno, e la nota ti riempie la testa finché le parole ti scivolano
      via. Cerchi il nome della lampada che hai in mano e non lo trovi,
      mentre in fondo pulsa una luce rossiccia.

      {resilienza Media} Le parole tornano se le dici forte.
    opzioni:
      - testo: "Dire forte i nomi delle cose"
        descrizione: "Lampada, corda, coltello. Se la testa li perde, la voce li tiene."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: I nomi
          testo: |
            Cammini dicendo a voce alta il nome di tutto quello che porti, e alla
            fine anche il tuo, e la testa si rimette in fila.
          pe: { resilienza: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: La parola persa
          testo: |
            A metà tunnel non trovi più la parola per la cosa che ti pende dalla
            cintura, e torni indietro fino al portello, dove la parola ti torna in
            bocca.
          effetti: { tormento: 1 }
      - testo: "Correre fino in fondo prima di perdersi"
        descrizione: "Più si resta dentro, più si perde. Allora si resta dentro poco."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Fino alla luce
          testo: |
            Corri giù per la pendenza con le braccia larghe, e la nota ti insegue
            senza raggiungerti. Arrivi alla luce rossiccia con tutte le parole al
            loro posto, o quasi.
          pe: { resistenza: 3 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: La pendenza
          testo: |
            A metà corsa i piedi ti partono sul metallo liscio, e quando ti fermi
            non sai più da che parte sei venuto. Ti trascini fuori a tentoni.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Tapparsi le orecchie con la cera e camminare piano"
        descrizione: "La cera ferma tutto tranne la nota, e la testa ha meno da perdere."
        costo: 2
        esito:
          titolo: La cera
          testo: |
            Con la cera nelle orecchie senti soltanto il sangue nelle tempie e la
            nota sotto, e alla luce rossiccia arrivi senza ricordare come.
          effetti: { profondita.costola-di-drago: 1, tormento: 1 }

  - id: costola-di-drago-i-nove-incavi
    immagine: ambientazione/rovine-dei-precursori
    titolo: La piastra dei nove incavi
    sommario: "Sul fianco della canna, una piastra con nove incavi in cerchio."
    luogo: La Costola di Drago, la piastra
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago == 3]
    testo: |
      Dove la canna si allarga è fissata una piastra di metallo più chiaro,
      grande come una porta, con nove incavi in cerchio e uno inciso più a
      fondo. Intorno corre una fila di segni minuti dei Precursori, e dal
      centro una linea incisa scende lungo la canna.

      {percezione Media} Lo stesso cerchio c'è sulla testa di ogni bullone,
      sempre con lo stesso incavo più profondo.
    opzioni:
      - testo: "Leggere i segni intorno al cerchio"
        descrizione: "I segni dei Precursori si ripetono, e le parole che tornano si riconoscono."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La parola che torna
          testo: |
            Copi i segni sul quaderno e li conti. Uno torna nove volte, una per
            incavo. Un altro compare una volta sola, accanto all'incavo più
            profondo, e lungo la linea incisa trovi un frammento staccato dalla
            piastra.
          pe: { accademiche: 2 }
          effetti: { profondita.costola-di-drago: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Segni fitti
          testo: |
            I segni sono così fitti che ti si confondono davanti agli occhi, e la
            nota ti entra nelle tempie. Lasci il quaderno mezzo vuoto.
          effetti: { tormento: 0.5 }
      - testo: "Seguire la linea incisa"
        descrizione: "La linea parte dal centro del cerchio e scende lungo la canna."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La linea
          testo: |
            Segui la linea con il dito finché sparisce sotto una lastra che si
            solleva con una spinta. Sotto c'è una scala a pioli che scende verso
            la luce rossiccia.
          pe: { percezione: 2 }
          effetti: { profondita.costola-di-drago: 1 }
        fallimento:
          titolo: Il dito che trema
          testo: |
            La linea ti trema sotto il dito come una corda pizzicata, e alla fine
            ti ritrovi davanti alla piastra, dove eri partito.
          effetti: { tormento: 0.5 }
      - testo: "Lasciar perdere la piastra e scendere lungo la canna"
        descrizione: "La strada verso il fondo è lunga, e la nota cresce."
        costo: 2
        esito:
          titolo: Verso il fondo
          testo: |
            Scendi lungo la canna, e la nota cresce finché la senti anche nelle
            unghie. In fondo pulsa una luce rossiccia.
          effetti: { profondita.costola-di-drago: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · l'accordatore
  - id: costola-di-drago-l-accordatore
    immagine: bestiario/salvaguardia-precursori
    titolo: L'accordatore
    sommario: "In fondo alla canna una macchina batte il metallo accanto a un diapason nero."
    luogo: La Costola di Drago, la camera in fondo alla canna
    area: costola-di-drago
    requisiti: [profondita.costola-di-drago >= 4, misura.costola == 0]
    testo: |
      La canna finisce in una camera rotonda dove una macchina alta tre
      volte un uomo la batte con sei braccia sottili, che finiscono in
      martelli fasciati di feltro grigio, con una pazienza da campanaro.

      Al centro, in una culla di metallo chiaro con il cerchio dei nove
      incavi, un diapason nero lungo un avambraccio risponde a ogni colpo
      con la stessa nota, più chiara.

      {tecnologia Difficile} La macchina ascolta il diapason per accordare
      la canna, e se il diapason esce dalla culla cercherà il motivo.

      Dietro la macchina un condotto sigillato, largo quanto un pozzo, esce
      dalla camera.
    opzioni:
      - testo: "Prendere il diapason e affrontare l'accordatore"
        descrizione: "Fuori dalla culla il diapason si porta dietro i sei martelli."
        combattimento: costola-di-drago-accordatore
        vittoria:
          titolo: La nota in mano
          testo: |
            L'ultimo braccio cade, e la macchina si piega su se stessa come un
            ombrello chiuso, mentre la canna sbanda. Il diapason ripete la nota
            pulita nel tuo palmo. Stacchi un martello dal braccio caduto e
            raccogli dalla culla i frammenti della piastra di fondo.

            {accademiche Media} Una macchina che accorda non ha bisogno di un
            condotto, a meno che la nota non serva a qualcosa più in là.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.costola: 1, oggetto.costola-di-drago-martello-d-accordatura: 1, reliquie.frammento-inciso: 2, parte.impugnatura-3: 1, bottino.parti-di-drone: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Il colpo di feltro
          testo: |
            Un martello ti prende al fianco, e il feltro non attutisce niente. La
            macchina rimette il diapason nella culla con una delicatezza che ti fa
            più male del colpo.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Sfilare il diapason fra un colpo e l'altro"
        descrizione: "Fra due colpi c'è un momento in cui la macchina non ascolta niente."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Fra due colpi
          testo: |
            Fra due colpi sfili il diapason e ci metti al posto suo il manico del
            coltello, e la macchina continua a battere un po' più piano,
            ingannata. Esci con il diapason, un frammento della culla e un vecchio
            martello rotto trovato sotto il piedistallo.
          pe: { tecnologia: 5 }
          effetti: { misura.costola: 1, oggetto.costola-di-drago-martello-d-accordatura: 1, reliquie.frammento-inciso: 2, parte.impugnatura-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il colpo sbagliato
          testo: |
            Sfili il diapason un colpo troppo tardi, e un martello ti prende sulla
            spalla. Il diapason ti cade di mano e torna nella culla come un cane
            dal padrone.
          effetti: { ferite: 2, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Cantare la nota al posto del diapason"
        descrizione: "La macchina ascolta una nota sola, e forse le basta la tua gola."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: La gola che vibra
          testo: |
            Cerchi la nota in fondo al petto finché il diapason non ti risponde, e
            lo prendi senza smettere di cantare. Esci camminando all'indietro con
            la gola in fiamme, e sulla soglia raccogli un martello caduto e un
            frammento della culla.
          pe: { espressivita: 5 }
          effetti: { misura.costola: 1, oggetto.costola-di-drago-martello-d-accordatura: 1, reliquie.frammento-inciso: 2, parte.impugnatura-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La voce che si rompe
          testo: |
            La voce ti si rompe a metà della nota, e il primo martello ti prende
            sotto le costole. Per due giorni parli soltanto a gesti.
          effetti: { ferite: 1.5, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ordinargli di continuare senza il diapason"
        descrizione: "Questa macchina ha un lavoro solo, e forse accetta di farlo a memoria."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: A memoria
          testo: |
            Dici la formula, in una lingua che ti graffia il palato, e la macchina
            riprende a battere senza guardare la culla. Prendi il diapason, un
            martello di ricambio e un frammento della culla.
          pe: { magia: 5 }
          effetti: { misura.costola: 1, oggetto.costola-di-drago-martello-d-accordatura: 1, reliquie.frammento-inciso: 2, parte.impugnatura-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La formula stonata
          testo: |
            La formula ti si spezza a metà, e le braccia della macchina si alzano
            tutte insieme. Scappi, inseguito dal rumore dei martelli sul
            pavimento.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo la misura · la culla vuota (ripetibile)
  - id: costola-di-drago-la-culla-vuota
    immagine: bestiario/salvaguardia-precursori
    titolo: La culla vuota
    sommario: "L'accordatore batte ancora la canna a orecchio, accanto alla culla vuota."
    luogo: La Costola di Drago, la camera in fondo alla canna
    area: costola-di-drago
    ripetibile: true
    requisiti: [profondita.costola-di-drago >= 4, misura.costola >= 1]
    testo: |
      L'accordatore batte ancora la canna a orecchio, con un braccio più
      corto rifatto dagli scrostatori, e la nota sbanda prima di tornare al
      suo posto. Intorno al piedistallo i ricambi stanno in file ordinate, e
      il diapason nella tua bisaccia risponde piano a ogni colpo.
    opzioni:
      - testo: "Affrontare di nuovo l'accordatore"
        descrizione: "Ha un braccio rifatto alla meglio. Gli altri martelli sono quelli di sempre."
        combattimento: costola-di-drago-accordatore
        vittoria:
          titolo: I pezzi di ricambio
          testo: |
            La macchina cade sul fianco con il braccio corto che batte ancora.
            Riempi la bisaccia di ricambi prima che gli scrostatori vengano a
            rimetterla in piedi.
          effetti: { parte.impugnatura-2: 1, reperto.sigillato: 1, reliquie.scheggia: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: A orecchio
          testo: |
            Anche a orecchio i martelli sanno dove sei. Risali la canna a
            carponi, e la nota ti accompagna fino all'erba gialla della
            collina.
          vai: superficie-fratturata
      - testo: "Prendere i ricambi mentre batte"
        descrizione: "La macchina guarda la canna, e ai suoi piedi non guarda."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Ai suoi piedi
          testo: |
            Strisci fra le braccia della macchina mentre batte e raccogli dalle
            file più vicine un reperto chiuso e qualche scheggia, senza che perda
            un colpo.
          pe: { furtivita: 3 }
          effetti: { reperto.sigillato: 1, reliquie.scheggia: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il braccio corto
          testo: |
            Il braccio corto è più svelto degli altri, e ti prende sul dorso
            della mano. Lasci cadere tutto e risali la canna con la mano
            stretta sotto l'ascella.
          effetti: { ferite: 1 }
          vai: superficie-fratturata
      - testo: "Lasciarla lavorare e risalire"
        descrizione: "La nota è già tua. La camera può restare com'è."
        costo: 0
        esito:
          titolo: Il lavoro degli altri
          testo: |
            Guardi la macchina battere, con il braccio corto che arriva sempre un
            momento dopo, e risali mentre la nota sbanda e torna al suo posto.
          vai: superficie-fratturata

nemici:
  - id: costola-di-drago-scrostatore
    immagine: bestiario/salvaguardia-precursori
    nome: Scrostatore
    descrizione: "Una macchina piatta e larga come uno scudo, con sei zampe sottili e una fila di lame corte sotto la pancia. Gratta la canna della Costola un palmo alla volta, e tratta da crosta tutto quello che ci trova sopra."
    attacco: 4
    difesa: 4
    difesaMentale: 5
    pf: 6
    danno: 3
    riduzione: 2
    iniziativa: 3

  - id: costola-di-drago-accordatore
    immagine: bestiario/salvaguardia-precursori
    nome: L'accordatore
    descrizione: "Una macchina alta tre volte un uomo, con il corpo stretto e sei braccia sottili che finiscono in martelli fasciati di feltro grigio. Batte la canna della Costola da prima della Caduta, e quando perde la nota cerca chi l'ha presa."
    attacco: 5
    difesa: 4
    difesaMentale: 5
    pf: 11
    danno: 4
    riduzione: 4
    iniziativa: 2

scontri:
  - { id: costola-di-drago-scrostatori, nome: "Gli scrostatori", nemici: [costola-di-drago-scrostatore, costola-di-drago-scrostatore], feriteSconfitta: 2 }
  - { id: costola-di-drago-accordatore, nome: "L'accordatore", nemici: [costola-di-drago-accordatore], feriteSconfitta: 4 }

oggetti:
  - id: costola-di-drago-martello-d-accordatura
    nome: Martello d'accordatura
    immagine: icone/warhammer
    descrizione: "Uno dei martelli dell'accordatore della Costola di Drago, con la testa fasciata di un feltro grigio che non si consuma e il manico rifatto per una mano umana. Quando batte, il colpo passa nelle armature come la nota passa nella roccia."
    slot: arma
    base: martello-da-guerra
    grado: 3
    dadi: 1
    proprieta: { affilata: 1, penetrante: 1 }

colonna:
  - { contesto: area, id: costola-di-drago, musica: the-light-that-failed, ambiente: cave }
