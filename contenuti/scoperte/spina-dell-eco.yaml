# La Spina dell'Eco (docs/piano-superficie.md, «Le nove spedizioni dei luoghi neri»). Un pilastro di pietra nera
# alto sei metri sulla pianura fra il Bosco di Velthar e il Rovolungo, che restituisce le voci dopo nove battiti con
# un'altra parola (codex sf-spina-dell-eco). In superficie resta canone la scena del Circolo con Voren
# (`circolo-la-spina-dell-eco`, la parola di quattro sillabe, circolo.parola): il pilastro è vuoto come un camino e
# scende più giù di quanto sia alto, e la spedizione scende lì dentro. Sotto c'è la voce dello strumento: un cantore
# di ferro che riceve le voci dal camino e le ricanta su, e che quando nessuno grida canta il richiamo dentro una
# bocca di metallo rivolta a nord-est. Da laggiù, molto tempo dopo, risponde una nota bassa.
# Ci si entra da `spina-dell-eco-la-pianura` (Superficie, ripetibile, traccia.spina >= 3); chi ha la parola del
# Circolo (circolo.parola >= 1) può dirla alla Spina, e la riconosce sulla parete dei nomi e davanti al cantore.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 il camino dei pioli o le voci vecchie, 1 le canne o la parete dei nomi, 2 i ripetitori (scontro) o la stanza
# muta, 3 il cerchio dei nove incavi o la membrana; il soffio dei nove battiti vale da 1 a 3.
# Il cuore a 4 è la voce (`spina-dell-eco-la-voce`, misura.spina == 0): il cantore di ferro (boss), oppure cantare il
# richiamo con lui, l'Eco, o dire la parola del Circolo (Difficili). La vittoria dà misura.spina, la Canna della
# voce (grado 2) e parti dei Precursori. Dopo, `spina-dell-eco-la-voce-che-resta` (ripetibile, misura.spina >= 1)
# rende meno.
# La misura, per chi scrive la Campana: il richiamo è un canto di tre note che scendono, senza parole, con l'ultima
# tenuta per nove battiti. Cantato nella bocca rivolta a nord-est, dopo un'attesa lunga torna da laggiù una nota
# bassa che si sente nei denti più che nelle orecchie. Il «ritardo di nove battiti» della Spina è il tempo che la
# voce impiega a scendere fino al cantore e a tornare su.
# Il segno che lega i luoghi neri: il cerchio di nove incavi con uno inciso più a fondo (vedi lente-del-sornione.yaml),
# qui con dentro la riga fra due onde (la quarta pietra dell'Anello); il condotto che va a nord-est è una canna di
# metallo che vibra. La nota bassa che torna dalla bocca di nord-est è la stessa della Costola.
aree:
  - id: spina-dell-eco
    immagine: ambientazione/superficie-fratturata
    nome: La Spina dell'Eco
    sommario: "Il pilastro nero della pianura è vuoto come un camino, e scende sotto terra molto più di quanto sia alto. Laggiù le voci arrivano, e qualcosa le ricanta."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Dentro la Spina dell'Eco la pietra nera è liscia come l'interno di
      una conchiglia, e il pilastro continua sotto la pianura in un pozzo
      dritto, con i pioli di metallo piantati nella parete. In fondo al
      pozzo partono gallerie basse dove corrono canne di metallo di ogni
      grossezza, dal dito alla botte.

      Ogni parola che dici qui sotto prima o poi torna indietro. A volte torna
      dopo nove battiti con un'altra parola dentro, e a volte torna da una
      galleria dove non sei ancora stato.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: spina-dell-eco-la-pianura
    immagine: ambientazione/superficie-fratturata
    titolo: Il pilastro sulla pianura
    sommario: "Sulla pianura del nord la Spina dell'Eco sta ritta come un dito puntato. Ai suoi piedi la terra è smossa, e sotto un palmo c'è qualcosa di duro."
    luogo: Superficie Fratturata, la pianura fra il Bosco di Velthar e il Rovolungo
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.spina >= 3]
    testo: |
      La pianura è gialla d'erba secca fino all'orizzonte, e da una parte
      la chiude la riga scura del Bosco di Velthar. In mezzo, lontana da
      tutto, sta la Spina, un pilastro di pietra nera alto quanto tre
      uomini, dritto come un dito puntato verso il cielo. Ai suoi piedi la
      terra è smossa da vecchi scavi, e in una buca larga un palmo si vede
      il lucido di qualcosa di duro.

      Accanto alla buca c'è un cerchio di sassi anneriti, dove qualcuno ha
      acceso il fuoco per passare la notte, e fra la cenere un plettro di
      corno spezzato in due.

      {espressivita Media} Il plettro è di un cantore di strada, e l'ha
      spezzato lui, con le dita. Chi suona per mestiere non rompe un
      plettro per sbaglio.

      {origine figlio-del-circolo} Il Circolo insegna ad ascoltare prima di
      parlare. Qui il Bosco è soltanto una riga lontana, e la pianura è
      così zitta che senti il sangue scorrerti nelle orecchie.

      {percezione Difficile} Il vento passa intorno al pilastro e non fa
      nessun rumore. Da sotto la buca, invece, sale un sussurro regolare,
      come di una pentola che bolle piano.
    opzioni:
      - testo: "Scavare la buca fino a quello che è duro"
        descrizione: "Sotto un palmo di terra c'è qualcosa che la pala non sposta. Chi ci ha provato si è fermato lì, e si va avanti da lì."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: L'anello
          testo: |
            Allarghi la buca intorno alla cosa dura, e la pala scopre un
            coperchio di pietra nera grande come una ruota di carro, con un
            anello di metallo incassato. Ci infili la leva e tiri finché il
            coperchio si sposta di lato con un rumore di macina. Sotto c'è il
            buio dentro il pilastro, e una fila di pioli che scende.
          pe: { atletica: 2 }
          vai: spina-dell-eco
        fallimento:
          titolo: La terra che torna
          testo: |
            Scavi fino a sera, e la terra secca della pianura ti frana nella
            buca a ogni palata. Quando smetti hai le spalle a pezzi e la buca è
            larga come prima, e torni indietro con la pala sulla spalla.
          effetti: { ferite: 0.5 }
      - testo: "Gridare e ascoltare da dove torna la voce"
        descrizione: "La voce torna dopo nove battiti. Se torna da sotto, da qualche parte c'è un passaggio per il suono, e forse anche per un corpo."
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: Il nono battito
          testo: |
            Gridi il tuo nome e conti con l'orecchio a terra. Al nono battito
            la voce torna con un'altra parola, e torna da sotto la buca, da un
            punto preciso dove la terra suona vuota. Scavi lì, e trovi il
            bordo di un coperchio di pietra nera con un anello incassato.
            Quando lo sposti, sotto c'è una fila di pioli che scende.
          pe: { percezione: 2 }
          vai: spina-dell-eco
        fallimento:
          titolo: La parola sbagliata
          testo: |
            Gridi il tuo nome, e al nono battito ti torna con la tua voce il
            nome di un altro. Lo senti ripetere nella testa per tutta la
            strada del ritorno, e a sera ti volti due volte quando qualcuno lo
            dice in una locanda.
          effetti: { tormento: 0.5 }
      - testo: "Arrivare a cavallo e cercare dove il cavallo non va"
        descrizione: "Sulla pianura un cavallo si vede da lontano e vede lontano. Dove sotto è vuoto, gli zoccoli lo sentono."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Lo zoccolo
          testo: |
            Giri intorno al pilastro al passo, e il cavallo si rifiuta di
            mettere gli zoccoli sulla terra smossa. Batte lo zoccolo sempre
            nello stesso punto, e la terra suona vuota. Scavi lì, e sotto un
            palmo trovi un coperchio di pietra nera con un anello incassato.
            Quando lo sposti, sotto c'è una fila di pioli che scende.
          vai: spina-dell-eco
      - testo: "Passare la notte alla Spina e aspettare"
        descrizione: "Di notte la pianura tace, e il sussurro da sotto si sente meglio. Il freddo della notte, però, non lo ferma nessuno."
        costo: 2
        esito:
          titolo: Il sussurro di notte
          testo: |
            Accendi il fuoco nel cerchio di sassi e aspetti. A notte fonda il
            sussurro da sotto la buca si fa chiaro, e ti porta fino al punto
            dove la terra copre un coperchio di pietra nera con un anello.
            All'alba lo hai liberato, e hai le mani e i piedi gelati.
          effetti: { ferite: 0.5 }
          vai: spina-dell-eco
      - testo: "Dire alla Spina la parola di quattro sillabe"
        descrizione: "Con Voren la Spina ti ha restituito il nome di una città. Se lo dici tu per primo, forse la Spina risponde in un altro modo."
        quando: [circolo.parola >= 1]
        esito:
          titolo: La risposta subito
          testo: |
            Dici le quattro sillabe a voce alta, con la cadenza lenta che ti
            ha insegnato la Spina. Stavolta la risposta arriva senza aspettare
            i nove battiti, e arriva da sotto i piedi. La terra intorno alla
            buca trema e si apre in un cerchio largo come una ruota di carro,
            su un coperchio di pietra nera che si sposta da solo. Sotto c'è
            una fila di pioli che scende nel buio.
          vai: spina-dell-eco

  # ------------------------------------------------------------ 0 · il camino e le voci vecchie
  - id: spina-dell-eco-il-camino
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il camino dei pioli
    sommario: "Dentro il pilastro una fila di pioli di metallo scende dritta nel buio. Le voci passano su e giù per il camino."
    luogo: La Spina dell'Eco, dentro il pilastro
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 0]
    testo: |
      Dentro il pilastro c'è un camino largo quanto un pozzo da cortile, e
      i pioli di metallo scendono lungo la parete a una distanza fatta per
      gambe più lunghe delle tue. Sopra di te il cerchio di cielo si
      rimpicciolisce a ogni piolo. Il camino è pieno di voci. Salgono da
      sotto e scendono dall'alto, mezze parole che ti passano accanto alla
      faccia come uccelli in un fienile.

      {atletica Media} I pioli sono lontani fra loro e reggono bene, perché
      sono asciutti. Scendi con le braccia e lascia riposare le gambe.

      {resilienza Media fallita} Una delle mezze parole somiglia al tuo nome.
      Ti fermi ad ascoltare, e il piolo ti scivola fra le dita.
    opzioni:
      - testo: "Scendere a braccia, piolo dopo piolo"
        descrizione: "Pioli lontani e buio sotto. Le braccia fanno il lavoro, e la testa conta i pioli."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: In fondo al camino
          testo: |
            Scendi a braccia, con i piedi che cercano il piolo dopo e lo
            trovano sempre un poco più in basso del previsto. Conti
            sessantadue pioli. In fondo il camino si allarga in una stanza
            tonda, e le voci si fanno più chiare.
          pe: { atletica: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il piolo mancato
          testo: |
            Al trentesimo piolo il piede trova il vuoto, e resti appeso per
            le mani con il cuore in gola. Risali piolo per piolo fino al
            cerchio di cielo, e ti siedi sull'erba a guardarti le mani.
          effetti: { ferite: 0.5 }
      - testo: "Scendere ascoltando da dove vengono le voci"
        descrizione: "Le voci salgono da sotto. Dove sono più forti, il camino si apre."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La finestra nel camino
          testo: |
            Scendi piano con l'orecchio teso, e a metà camino le voci da sotto
            si fanno più forti da un lato solo. Lì la parete ha una finestra
            stretta, e la finestra dà su una galleria che scende in pendenza,
            con le canne di metallo lungo il soffitto.
          pe: { percezione: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Le voci di sopra
          testo: |
            Segui le voci, e a metà camino ti accorgi che stai seguendo quelle
            che scendono dall'alto. Risali senza volerlo verso il cerchio di
            cielo, e quando te ne accorgi hai le braccia di legno.
          effetti: { tormento: 1 }
      - testo: "Calare la corda nel camino e scendere appesi"
        descrizione: "Una corda legata al primo piolo, e giù. Lunga come deve essere, si spera."
        costo: 2
        esito:
          titolo: La corda nel camino
          testo: |
            Leghi la corda al primo piolo e ti cali nel camino, con la lanterna
            appesa alla cintura che sbatte contro la pietra. La corda basta per
            un pezzo, e il resto lo fai sui pioli con le braccia già stanche.
            In fondo ti siedi per terra prima di guardarti intorno.
          effetti: { profondita.spina-dell-eco: 1, ferite: 0.5 }

  - id: spina-dell-eco-le-voci-vecchie
    immagine: ambientazione/marea-grigia
    titolo: Le voci vecchie
    sommario: "In fondo al camino c'è una stanza tonda dove le voci di chi ha gridato alla Spina girano ancora, una sull'altra."
    luogo: La Spina dell'Eco, la stanza in fondo al camino
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 0]
    testo: |
      In fondo al camino c'è una stanza tonda con le pareti a spirale, e
      dentro la stanza girano le voci. Sono quelle di chi ha gridato alla
      Spina negli anni. Un bambino chiama la madre e un uomo bestemmia,
      e una donna dice il nome di qualcuno tre volte, sempre più piano. Le
      voci girano lungo la spirale e si consumano, e ogni tanto ne arriva
      una nuova dal camino.

      {empatia Media} La donna dei tre nomi salutava qualcuno che non avrebbe
      rivisto, e lo sapeva mentre lo gridava.

      Dall'altra parte della stanza la spirale finisce su un'apertura
      bassa.
    opzioni:
      - testo: "Attraversare la stanza senza ascoltare"
        descrizione: "Sono voci di altri. Si passa in mezzo e si guarda l'apertura in fondo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: In mezzo alle voci
          testo: |
            Attraversi la stanza con gli occhi sull'apertura, e le voci ti
            girano intorno come la gente in un mercato. Il bambino passa e
            ripassa. Arrivi all'apertura bassa e la passi chinato, e dall'altra
            parte le voci restano indietro.
          pe: { resilienza: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il bambino
          testo: |
            A metà stanza il bambino chiama la madre proprio accanto al tuo
            orecchio, e ti volti a cercarlo. Quando ti riscuoti sei di nuovo
            sotto il camino, e non ricordi di essere tornato indietro.
          effetti: { tormento: 1 }
      - testo: "Rispondere alla donna dei tre nomi"
        descrizione: "Una voce che saluta aspetta un saluto. Se qualcuno risponde, forse la voce smette di girare."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Media }
        successo:
          titolo: Il saluto
          testo: |
            Quando la voce della donna ti passa accanto rispondi al saluto,
            piano, con il nome che lei dice. La voce si ferma nel mezzo della
            stanza e si spegne, e le altre girano più larghe, lasciandoti una
            strada fino all'apertura bassa.
          pe: { empatia: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il nome nella spirale
          testo: |
            Rispondi con il nome che lei dice, e la stanza se lo prende.
            Adesso in mezzo alle altre gira anche la tua voce, e la senti
            passare ogni volta che fai un passo. Torni sotto il camino a
            tapparti le orecchie.
          effetti: { tormento: 1 }
      - testo: "Strisciare lungo il bordo della spirale"
        descrizione: "Lungo il bordo le voci sono più deboli. Il bordo è basso, e si passa sui gomiti."
        costo: 2
        esito:
          titolo: Sui gomiti
          testo: |
            Strisci lungo il bordo della spirale con la faccia contro la pietra,
            dove le voci arrivano spente. Ci metti molto, e i gomiti te li
            sbucci tutti e due. All'apertura bassa ti tiri su con le orecchie
            che fischiano.
          effetti: { profondita.spina-dell-eco: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · le canne e la parete dei nomi
  - id: spina-dell-eco-le-canne
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le canne
    sommario: "Una galleria piena di canne di metallo di ogni grossezza. Le voci ci corrono dentro, e ogni canna va in un posto diverso."
    luogo: La Spina dell'Eco, la galleria delle canne
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 1]
    testo: |
      La galleria è piena di canne di metallo grosse come un dito o come una
      botte, che corrono lungo le pareti e sul soffitto. Le voci ci corrono
      dentro, e se appoggi l'orecchio a una canna senti passare una parola che
      va da qualche parte. Le canne si dividono a ogni bivio, e a ogni bivio
      la galleria si divide con loro.

      {tecnologia Media} Le canne grosse portano lontano e le sottili
      portano vicino. La galleria giusta è quella dove le canne grosse
      vanno in giù.

      {natura Media fallita} Ti viene da pensare alle radici di un albero
      vecchio. Il pensiero non ti aiuta a scegliere il bivio.
    opzioni:
      - testo: "Seguire le canne più grosse"
        descrizione: "Le canne grosse vanno lontano. Dove vanno tutte insieme, c'è il centro."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Le canne grosse
          testo: |
            Al primo bivio segui le canne grosse, e al secondo pure, finché la
            galleria scende in una sala dove le canne grosse si infilano tutte
            nel pavimento. Accanto c'è una scala a chiocciola.
          pe: { tecnologia: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il bivio cieco
          testo: |
            Segui una canna che ti sembrava grossa, e la galleria finisce
            contro un muro dove la canna si infila e sparisce. Torni indietro
            contando i bivii, e ne conti uno in più di quelli che avevi fatto.
          effetti: { tormento: 1 }
      - testo: "Ascoltare le canne e seguire le voci che scendono"
        descrizione: "Le voci della Spina vanno giù. Se ne segui una con l'orecchio, ti porta dove va lei."
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: Una parola che scende
          testo: |
            Appoggi l'orecchio a una canna a ogni bivio, e segui una parola che
            corre verso il basso, sempre la stessa. Al quarto bivio la parola
            si infila nel pavimento con tutte le altre, accanto a una scala a
            chiocciola.
          pe: { percezione: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: L'orecchio
          testo: |
            Appoggi l'orecchio a una canna proprio mentre ci passa un grido, e
            il grido ti entra nella testa come un chiodo. Per un'ora senti
            tutto da una parte sola.
          effetti: { ferite: 0.5 }
      - testo: "Segnare i bivii con il gesso e provarli tutti"
        descrizione: "Un bivio alla volta, e il gesso sul muro. Lento, ma il gesso non sbaglia."
        costo: 2
        esito:
          titolo: Il gesso
          testo: |
            Segni ogni bivio con il gesso e li provi uno dopo l'altro. Quando
            trovi la scala a chiocciola hai consumato il gesso fino alle dita,
            e i muri della galleria sono pieni delle tue frecce.
          effetti: { profondita.spina-dell-eco: 1, tormento: 1 }

  - id: spina-dell-eco-la-parete-dei-nomi
    immagine: ambientazione/rovine-dei-precursori
    titolo: La parete dei nomi
    sommario: "Una parete lunga è coperta di segni incisi a gruppi, come parole. Ogni tanto un gruppo si accende, e da una canna passa una voce."
    luogo: La Spina dell'Eco, la parete dei nomi
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 1]
    testo: |
      Una galleria dritta ha su un lato una parete lunga, coperta di segni
      incisi a gruppi di tre, di quattro, di cinque, come parole scritte in
      una lingua che non conosci. Sotto ogni gruppo esce dal muro una canna
      sottile. Ogni tanto un gruppo si accende di una luce fioca, e dalla sua
      canna passa una voce che dice qualcosa, sempre la stessa cosa.

      {accademiche Media} Sono nomi, o almeno sono usati come nomi. La
      stessa scrittura sta sulle porte dei Precursori, sopra gli ingressi.

      In fondo alla galleria c'è una porta senza maniglia.

      {furtivita Facile} Accanto alla porta un fascio di canne fa un'ombra
      fitta, e nell'ombra il muro ha un buco largo quanto un corpo di
      traverso.
    opzioni:
      - testo: "Leggere i gruppi di segni"
        descrizione: "Se sono nomi, uno sarà il nome di questo posto. E la porta in fondo forse lo vuole sentire."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Il gruppo accanto alla porta
          testo: |
            Il gruppo di segni accanto alla porta si accende più spesso degli
            altri. Lo guardi a lungo, e la canna sotto ripete tre sillabe
            senza senso. Le ripeti tu ad alta voce, e la porta in fondo alla
            galleria si apre di lato.
          pe: { accademiche: 2 }
          effetti: { profondita.spina-dell-eco: 1, informazioni.voce: 1 }
        fallimento:
          titolo: I segni che si accendono
          testo: |
            Segui i gruppi uno dopo l'altro, e a un certo punto si accendono
            tutti insieme e tutte le canne parlano. Ti ritrovi seduto per terra
            con le mani sulle orecchie, e la porta in fondo resta chiusa.
          effetti: { tormento: 1 }
      - testo: "Trovare un'altra strada intorno alla porta"
        descrizione: "Le porte dei Precursori hanno sempre accanto un passaggio stretto e scomodo per chi le ripara."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Il passaggio di servizio
          testo: |
            Accanto alla porta, dietro un fascio di canne, c'è un buco nel muro
            largo quanto un corpo di traverso. Ti ci infili e strisci fra le
            canne che vibrano, e sbuchi dall'altra parte della porta.
          pe: { acrobazia: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Fra le canne
          testo: |
            Ti infili fra le canne, e una ti passa una voce dritta nell'orecchio
            proprio mentre resti incastrato con la spalla. Ci metti un pezzo a
            liberarti, e lasci un pezzo di manica fra le canne.
          effetti: { ferite: 0.5 }
      - testo: "Riconoscere la parola di Voren"
        descrizione: "Quattro sillabe, la parola della Spina. Sulla parete c'è un gruppo di quattro segni che hai già visto, sulla porta della fenditura o nella tua testa."
        quando: [circolo.parola >= 1]
        esito:
          titolo: Quattro segni
          testo: |
            Fra tutti i gruppi ce n'è uno di quattro segni, e quando si accende
            la sua canna dice le quattro sillabe che la Spina ha detto a te e a
            Voren. Lo tocchi con due dita, e la porta in fondo alla galleria
            si apre senza un suono. Il nome di quella città qui è scritto
            accanto agli altri, come un indirizzo fra tanti.
          effetti: { profondita.spina-dell-eco: 1, informazioni.voce: 1 }
      - testo: "Aspettare che la porta si apra per qualcun altro"
        descrizione: "Le voci passano. Prima o poi una passa dalla porta, e la porta la lascia passare."
        costo: 2
        esito:
          titolo: La voce che passa
          testo: |
            Aspetti seduto davanti alla porta finché un gruppo di segni
            accanto a lei si accende, e la porta si apre per lasciar passare
            una voce. Ci passi anche tu di corsa, e la porta si richiude a un
            dito dalla tua schiena.
          effetti: { profondita.spina-dell-eco: 1, tormento: 1 }

  # ------------------------------------------------------------ 1–3 · il soffio dei nove battiti
  - id: spina-dell-eco-il-soffio
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il soffio dei nove battiti
    sommario: "In una galleria lunga, ogni nove battiti, arriva da sotto un soffio d'aria che ti spinge indietro."
    luogo: La Spina dell'Eco, la galleria lunga
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco >= 1, profondita.spina-dell-eco <= 3]
    testo: |
      La galleria scende lunga e dritta, e ogni nove battiti da sotto arriva
      un soffio d'aria che ti spinge indietro di un passo. Ogni volta porta
      con sé una sola parola gridata, sempre diversa. Fra un soffio e l'altro
      l'aria è ferma e la galleria è zitta, e i nove battiti passano in
      fretta.

      {resistenza Media} Contro il soffio si sta piegati, con un piede
      avanti e il peso sul piede davanti. Basta non farsi trovare dritti.

      {espressivita Facile} Nove battiti sono una strofa corta. I cantori ci
      contano sopra senza pensarci.
    opzioni:
      - testo: "Avanzare piegati contro il soffio"
        descrizione: "Con un piede avanti e il peso giusto, il soffio passa sopra la schiena. Lungo, e faticoso."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Piegato
          testo: |
            Avanzi piegato, e a ogni soffio pianti il piede e lasci che ti
            passi sulla schiena. Fra un soffio e l'altro fai otto passi. In
            fondo alla galleria ti raddrizzi con la schiena che scricchiola.
          pe: { resistenza: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il soffio in faccia
          testo: |
            Un soffio ti prende dritto, e ti butta indietro di tre passi fino
            a sederti per terra. Ci riprovi due volte, e alla terza torni
            indietro con le orecchie che fischiano.
          effetti: { ferite: 0.5 }
      - testo: "Contare i battiti e correre fra un soffio e l'altro"
        descrizione: "Nove battiti sono abbastanza per un tratto di corsa, se si parte al momento giusto."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: La strofa
          testo: |
            Conti a mezza voce come il cantore della locanda, e al primo
            battito parti di corsa. All'ottavo ti fermi contro la parete, e il
            soffio ti passa accanto. In sei strofe arrivi in fondo alla
            galleria.
          pe: { espressivita: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Fuori tempo
          testo: |
            Perdi il conto al sesto battito, e il soffio ti trova in piena
            corsa. Finisci contro la parete con la spalla, e torni al punto da
            cui eri partito a massaggiartela.
          effetti: { ferite: 0.5 }
      - testo: "Avanzare a carponi lungo il pavimento"
        descrizione: "Rasente al pavimento il soffio passa più alto. Si va piano, e le ginocchia ne fanno le spese."
        costo: 2
        esito:
          titolo: A carponi
          testo: |
            Avanzi a carponi, e i soffi ti passano sopra la testa uno dopo
            l'altro, ognuno con la sua parola. In fondo alla galleria hai le
            ginocchia sbucciate e una ventina di parole che non sai togliere
            dalla testa.
          effetti: { profondita.spina-dell-eco: 1, tormento: 1 }

  # ------------------------------------------------------------ 2 · i ripetitori e la stanza muta
  - id: spina-dell-eco-i-ripetitori
    immagine: bestiario/salvaguardia-precursori
    titolo: I ripetitori
    sommario: "Dalle canne di una sala pendono due macchine lunghe come braccia, di bronzo. Quando parli ti rispondono con la tua voce, e poi si muovono."
    luogo: La Spina dell'Eco, la sala dei ripetitori
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 2]
    testo: |
      Nella sala le canne scendono dal soffitto come stalattiti, e da due
      canne pendono due macchine di bronzo lunghe come un braccio e segmentate
      come lamprede. Hanno una bocca tonda in punta, piena di denti di metallo
      disposti in cerchio. Quando entri non si muovono. Ti scappa un colpo di
      tosse, e le due macchine tossiscono con la tua tosse. Poi si staccano
      dalle canne.

      {furtivita Media} Sentono, e non vedono. In silenzio, contro la parete,
      sei soltanto un pezzo di muro.
    opzioni:
      - testo: "Affrontare i ripetitori"
        descrizione: "Due lamprede di bronzo con la bocca piena di denti. Sono sottili, e un colpo pieno le spezza."
        combattimento: spina-dell-eco-ripetitori
        vittoria:
          titolo: Il bronzo spezzato
          testo: |
            L'ultimo ripetitore si spezza in due sul pavimento e dice ancora
            una parola con la tua voce, sempre più piano. Gli stacchi la bocca
            di metallo e il pezzo che vibrava dietro, e attraversi la sala.
          effetti: { profondita.spina-dell-eco: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: La tua voce
          testo: |
            I denti ti trovano il braccio e la spalla, e intanto i ripetitori
            gridano con la tua voce. Esci dalla sala camminando all'indietro,
            e loro tornano ad appendersi alle canne.
      - testo: "Passare contro la parete senza un suono"
        descrizione: "Sentono e non vedono. Bisogna passare senza toccare niente, e senza tossire."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Un pezzo di muro
          testo: |
            Ti togli gli stivali e passi contro la parete sulle calze, con la
            bocca chiusa e la lanterna spenta. I ripetitori girano la testa
            verso ogni goccia che cade, e a te non la girano mai.
          pe: { furtivita: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il ginocchio
          testo: |
            Il ginocchio ti scricchiola a metà sala, e i due ripetitori lo
            ripetono insieme, più forte. Ti saltano addosso, e scappi dalla
            parte da cui sei venuto con un morso sul polpaccio.
          effetti: { ferite: 0.5 }
      - testo: "Gettare un sasso nell'angolo e passare dall'altra parte"
        descrizione: "Sentono. Un sasso che rotola in un angolo fa un rumore, e loro vanno a ripeterlo."
        costo: 2
        esito:
          titolo: Il sasso
          testo: |
            Getti un sasso nell'angolo, e i ripetitori ci si buttano sopra
            ripetendo il rumore del sasso. Passi dall'altra parte di corsa, e
            uno torna indietro in tempo per morderti la mano che tiene la
            lanterna.
          effetti: { profondita.spina-dell-eco: 1, ferite: 0.5 }

  - id: spina-dell-eco-la-stanza-muta
    immagine: ambientazione/rovine-dei-precursori
    titolo: La stanza muta
    sommario: "In una stanza foderata di feltro grigio non c'è nessun suono, nemmeno quello dei tuoi passi."
    luogo: La Spina dell'Eco, la stanza muta
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 2]
    testo: |
      La stanza è foderata di un feltro grigio spesso un palmo, dal
      pavimento al soffitto, e dentro non c'è nessun suono. I tuoi passi non
      fanno rumore, e quando batti le mani non senti niente. Dopo un poco
      cominci a sentire il sangue che ti scorre nelle orecchie, e poi un
      fischio sottile che viene da dentro la testa. In fondo alla stanza,
      appena visibile nel feltro, c'è una porta.

      {resilienza Media} Il silenzio non ti fa niente. È la testa che
      riempie il vuoto, e la testa la puoi zittire.

      {medicina Facile} Il fischio è tuo, e passa. Lo fanno le orecchie
      quando non hanno niente da sentire.
    opzioni:
      - testo: "Attraversare il silenzio senza fermarsi"
        descrizione: "È soltanto silenzio. Si attraversa contando i passi, che non si sentono."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il fischio
          testo: |
            Cammini verso la porta contando i passi a mente, e lasci che il
            fischio fischi. A metà stanza ti sembra di sentire qualcuno che
            ti chiama da dietro, e non ti volti. La porta si apre su una scala
            che scende, e sulla scala il primo rumore che senti è il tuo
            piede.
          pe: { resilienza: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il nome nel silenzio
          testo: |
            A metà stanza ti senti chiamare da dietro e ti volti, e dietro di
            te c'è soltanto il feltro grigio. Ti volti tante volte che perdi
            la porta, e torni fuori dalla parte da cui eri entrato con il
            cuore che batte forte.
          effetti: { tormento: 1 }
      - testo: "Seguire il filo d'aria fino alla porta"
        descrizione: "Senza suoni restano le altre cose. Un filo d'aria sulla pelle, per esempio, che va dalla porta a te."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il filo d'aria
          testo: |
            Ti bagni un dito e lo tieni alto, e senti un filo d'aria fresca
            che viene dal fondo della stanza. Lo segui a occhi chiusi fino
            alla porta, che si apre su una scala che scende.
          pe: { percezione: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il feltro
          testo: |
            Segui il filo d'aria, e ti porta contro la parete di feltro, dove
            il feltro si apre su un buco che non va da nessuna parte. Torni
            indietro con la polvere grigia nei capelli e le orecchie piene di
            fischi.
          effetti: { tormento: 1 }
      - testo: "Cantare forte per tutto il tragitto"
        descrizione: "Se il silenzio si mangia il suono, bisogna fare più suono di quanto ne mangi. Arrivi in fondo senza voce."
        costo: 2
        esito:
          titolo: Senza voce
          testo: |
            Canti a squarciagola la prima canzone che ti viene in mente, e non
            senti una nota. Arrivi alla porta con la gola in fiamme, e per il
            resto della discesa parli con un filo di voce.
          effetti: { profondita.spina-dell-eco: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · il cerchio delle nove tacche e la membrana
  - id: spina-dell-eco-il-cerchio-dei-nove
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il cerchio delle canne
    sommario: "In una sala tonda un cerchio di nove incavi è inciso nel pavimento. In quello più profondo c'è una riga fra due onde, e dal centro parte una canna grossa verso nord-est."
    luogo: La Spina dell'Eco, la sala del cerchio
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 3]
    testo: |
      Al centro di una sala tonda il pavimento ha un cerchio inciso, largo
      quanto un tavolo da osteria, con nove incavi lungo il bordo. Otto sono
      lisci e poco profondi. Il nono è inciso più a fondo, e dentro ha una
      riga dritta fra due onde, che manda una luce bianca a tempo con le voci
      delle canne. Dal centro del cerchio esce dal pavimento una canna di
      metallo grossa come un braccio. Corre bassa sul pavimento, attraversa la
      sala ed entra nella parete di nord-est.

      {percezione Media} La canna grossa vibra. Dentro ci passa una nota lunga
      e senza parole, che non finisce mai.

      {tecnologia Media fallita} Ti chiedi dove si apre la canna per vedere
      come è fatta dentro. La canna è chiusa da cima a fondo, e tu ci provi lo
      stesso.
    opzioni:
      - testo: "Ricopiare il cerchio sul quaderno"
        descrizione: "Nove incavi, una riga fra due onde e una canna che va verso nord-est. Alla Biblioteca qualcuno saprà leggerli."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: Il disegno
          testo: |
            Ricopi il cerchio incavo per incavo, con la riga fra le due onde
            dentro quello profondo e una freccia lunga per la canna. Mentre
            disegni il segno pulsa piano, e alla fine ti accorgi che la matita
            ha seguito il suo tempo senza che tu lo decidessi.
          pe: { accademiche: 2 }
          effetti: { profondita.spina-dell-eco: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: La luce bianca
          testo: |
            Appoggi la mano sull'incavo profondo per tenere fermo il foglio, e
            la luce bianca ti sale nel braccio con una nota che senti nei
            denti. Per un'ora la mano ti trema troppo per scrivere.
          effetti: { tormento: 1 }
      - testo: "Seguire la canna grossa fino alla parete"
        descrizione: "La canna va a nord-est. Accanto a lei, dove entra nella parete, ci sarà un passaggio per chi la ripara."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La nota lunga
          testo: |
            Segui la canna fino alla parete con una mano sopra, e la nota che
            vibra dentro ti sale fino alla spalla. Dove la canna entra nel
            muro c'è una porticina bassa, e dietro la porticina una scala
            scende ancora.
          pe: { percezione: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: La vibrazione
          testo: |
            Tieni la mano sulla canna troppo a lungo, e la vibrazione ti entra
            nelle ossa del braccio fino a farti battere i denti. Torni indietro
            con il braccio intorpidito e senza aver visto la porticina.
          effetti: { ferite: 0.5 }
      - testo: "Cercare l'incavo che riconosci"
        descrizione: "Questo cerchio l'hai già visto sotto la Soglia di Mara. Laggiù l'incavo profondo aveva una porta."
        quando: [misura.mara >= 1]
        esito:
          titolo: Due segni
          testo: |
            Trovi sul cerchio l'incavo dove sotto la Soglia c'era la porta.
            Qui è liscio e poco profondo, e sotto le dita resta freddo. Ricopi
            tutto sul quaderno, i due segni uno accanto all'altro, e prosegui.
          effetti: { profondita.spina-dell-eco: 1, informazioni.segreto: 1 }
      - testo: "Passare oltre il cerchio senza toccarlo"
        descrizione: "Il cerchio resta dov'è. Per scavalcare la canna bisogna passarle sopra, e vibra."
        costo: 2
        esito:
          titolo: La canna sotto i piedi
          testo: |
            Scavalchi la canna grossa con un salto, e quando atterri la
            vibrazione ti sale dalle suole fino alle ginocchia. Prosegui con
            una nota nei denti che non ti lascia fino in fondo alla discesa.
          effetti: { profondita.spina-dell-eco: 1, tormento: 1 }

  - id: spina-dell-eco-la-membrana
    immagine: ambientazione/rovine-dei-precursori
    titolo: La membrana
    sommario: "Una lamina di metallo sottile e larga come una vela chiude la galleria. Ogni nove battiti vibra, e il pavimento con lei."
    luogo: La Spina dell'Eco, la membrana
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 3]
    testo: |
      La galleria è chiusa da una lamina di metallo sottile come la carta e
      larga come una vela, tesa da parete a parete su un telaio. Ogni nove
      battiti vibra tutta insieme con un rombo basso, e il pavimento vibra
      con lei. Fra la lamina e la parete di destra c'è uno spiraglio largo
      quanto un piede, e oltre lo spiraglio si vede una luce.

      {tecnologia Difficile} La lamina è un orecchio, o una bocca. Se la si
      ferma con la mano, si ferma tutto quello che passa da qui, per il
      tempo di un battito.

      {acrobazia Media} Lo spiraglio è stretto. Di fianco, con le braccia
      sopra la testa, ci si passa.
    opzioni:
      - testo: "Passare di fianco nello spiraglio"
        descrizione: "Di fianco e con le braccia alzate, nel tempo fra un rombo e l'altro. Se arriva il rombo mentre sei dentro, lo senti tutto."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Lo spiraglio
          testo: |
            Aspetti il rombo e ti infili subito dopo, di fianco, con le braccia
            sopra la testa e la guancia contro la parete. Esci dall'altra parte
            al settimo battito, e la lamina vibra alle tue spalle mentre ti
            allontani.
          pe: { acrobazia: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il rombo addosso
          testo: |
            Resti incastrato a metà spiraglio, e il rombo ti arriva addosso
            con la lamina a un dito dal petto. Ti esce sangue dal naso. Torni
            indietro di fianco, piano, con le orecchie che ronzano.
          effetti: { ferite: 0.5 }
      - testo: "Fermare la lamina con il palmo e passarle sotto"
        descrizione: "Una mano sulla lamina, e per un battito tace. Il telaio in basso lascia lo spazio per un corpo, se si è svelti."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il palmo sulla lamina
          testo: |
            Appoggi il palmo sulla lamina proprio quando comincia a vibrare, e
            il rombo muore sotto la mano. Per un battito la galleria è zitta, e
            tu ti butti sotto il telaio e rotoli dall'altra parte prima che la
            lamina riparta. Sul telaio, dove l'hai toccata, la lamina ha
            lasciato cadere una scheggia lucida.
          pe: { tecnologia: 2 }
          effetti: { profondita.spina-dell-eco: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: La mano che vibra
          testo: |
            Appoggi il palmo sulla lamina, e la vibrazione invece di fermarsi
            ti entra nel braccio fino ai denti. Ti stacchi con la mano che
            trema e la testa che rimbomba, e la lamina continua come prima.
          effetti: { tormento: 1 }
      - testo: "Allentare il telaio e aspettare"
        descrizione: "Il telaio ha delle viti. Lento, e ogni nove battiti la lamina ti rimbomba nelle mani."
        costo: 2
        esito:
          titolo: Le viti
          testo: |
            Allenti le viti del telaio una alla volta, e a ogni rombo devi
            togliere le mani. Quando la lamina si affloscia abbastanza da
            passarle sotto, hai le dita gonfie e i polsi che ti dolgono.
          effetti: { profondita.spina-dell-eco: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · la voce
  - id: spina-dell-eco-la-voce
    immagine: bestiario/salvaguardia-precursori
    titolo: La voce
    sommario: "In fondo alla Spina un cantore di ferro riceve le voci dal camino e le ricanta su. Quando nessuno grida, canta qualcosa dentro una bocca di metallo rivolta a nord-est."
    luogo: La Spina dell'Eco, la sala della voce
    area: spina-dell-eco
    requisiti: [profondita.spina-dell-eco >= 4, misura.spina == 0]
    testo: |
      La sala è una cupola, e dall'alto scende la bocca del camino della
      Spina. Sulla parete di nord-est si apre una bocca di metallo larga come
      un portone, fatta a imbuto, che si stringe fino a sparire nella roccia.
      In mezzo alla sala sta il cantore di ferro. È alto il doppio di te, e il
      corpo è coperto di grate tonde dalle spalle alle ginocchia, decine di
      piccole bocche.

      Una voce scende dal camino, il nome di qualcuno gridato lassù. Il
      cantore la prende con le grate, e per qualche battito la tiene. Poi la
      ricanta su per il camino con la cadenza lenta della Spina e un'altra
      parola dentro. Fra la voce che scende e quella che risale conti nove
      battiti in tutto. Quando il camino tace si gira verso la bocca di
      nord-est e canta tre note che scendono, senza parole, con l'ultima
      tenuta a lungo.

      {origine figlio-del-circolo} Al Circolo i vecchi distinguono una voce
      dall'altra anche nel vento, e ti hanno insegnato a farlo. Questa
      cadenza, adesso, la riconosceresti fra mille.

      {origine accolito-del-velo} In cripta le testimonianze della Notte
      dei Sussurri dicono che le voci del suolo cantavano con una cadenza
      lenta. Era questa.

      {espressivita Media} Tre note e l'ultima tenuta per nove battiti. È un
      richiamo, e un richiamo si fa per sentire una risposta.

      Il cantore finisce il richiamo e resta fermo davanti alla bocca. Poi
      si volta verso di te, e tutte le grate si aprono.
    opzioni:
      - testo: "Affrontare il cantore di ferro"
        descrizione: "Decine di bocche e una voce sola, che fa male. Il corpo dietro le grate è fatto per stare fermo, non per battersi."
        combattimento: spina-dell-eco-il-cantore-di-ferro
        vittoria:
          titolo: Il richiamo
          testo: |
            Il cantore cade in ginocchio e le grate gli si chiudono una dopo
            l'altra, con un rumore di imposte. Prima che l'ultima si chiuda ne
            esce il richiamo, tre note che scendono, e l'ultima la tiene per
            nove battiti. Le canti anche tu, piano, finché ti restano. Poi le
            canti dentro la bocca di nord-est.

            Aspetti, e aspetti ancora, finché dalla bocca torna una nota
            bassa, così lontana che la senti nei denti più che nelle orecchie.
            Dal petto del cantore stacchi un nucleo che ti mormora fra le dita
            e una canna sottile che vibra ancora.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.spina: 1, oggetto.spina-dell-eco-canna-della-voce: 1, parte.nucleo-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: La voce che fa male
          testo: |
            Il cantore apre tutte le grate insieme e ti canta addosso il tuo
            nome, con la tua voce, così forte che ti cade la lama. Risali il
            camino sui pioli con le orecchie che sanguinano e il tuo nome che
            ti rimbalza in testa, e sulla pianura non senti più niente fino a
            sera.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Cantare il richiamo insieme a lui"
        descrizione: "Tre note che scendono, e l'ultima tenuta per nove battiti. Se lo canti giusto, forse il cantore ti sente come uno dei suoi."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: Due voci
          testo: |
            Quando il cantore riprende il richiamo attacchi con lui la prima
            nota, e poi la seconda, e la terza la tieni per nove battiti senza
            che la voce ti tremi. Il cantore chiude le grate e si sposta di
            lato. Canti di nuovo, da solo, dentro la bocca di nord-est.

            Aspetti, e aspetti ancora, finché dalla bocca torna una nota
            bassa, così lontana che la senti nei denti più che nelle orecchie.
            Il cantore apre una grata sul petto e ti lascia prendere un nucleo
            che mormora e una canna sottile che vibra ancora.
          pe: { espressivita: 5 }
          effetti: { misura.spina: 1, oggetto.spina-dell-eco-canna-della-voce: 1, parte.nucleo-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La nota stonata
          testo: |
            Alla terza nota la voce ti si spezza, e il cantore ti rimanda la
            nota stonata con decine di bocche insieme. Ti ritrovi sui pioli del
            camino senza ricordare di esserci salito, con il sangue che ti
            cola da un orecchio e il richiamo storpiato in testa.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Leggere la memoria della sala con l'Eco"
        descrizione: "La formula dell'Eco legge la memoria di un luogo. Questa sala non ha fatto altro che ricordare voci."
        incantesimo: eco
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La prima volta
          testo: |
            Dici la formula, e la sala ti mostra la prima volta che il cantore
            ha cantato il richiamo, con la sala nuova e la bocca lucida.
            Impari le tre note da lì, e l'ultima la tieni nove battiti come
            allora. Il cantore si gira verso di te e chiude le grate.

            Aspetti, e aspetti ancora, finché dalla bocca torna una nota
            bassa, così lontana che la senti nei denti più che nelle orecchie.
            Prima di risalire prendi da una nicchia accanto alla bocca un
            nucleo che mormora e una canna sottile che vibra ancora.
          pe: { magia: 5 }
          effetti: { misura.spina: 1, oggetto.spina-dell-eco-canna-della-voce: 1, parte.nucleo-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Tutte le voci
          testo: |
            La formula ti apre la memoria della sala tutta in una volta, e ti
            arrivano addosso tutte le voci che sono passate di qui, una
            sull'altra. Ti ritrovi sulla pianura sdraiato sull'erba, con le
            mani sulle orecchie e la gola secca.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Dire la parola di quattro sillabe al cantore"
        descrizione: "La Spina l'ha restituita a te e a Voren, e il cantore l'ha cantata su per il camino. Detta qui sotto, è una parola che lui conosce."
        quando: [circolo.parola >= 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Difficile }
        successo:
          titolo: Il nome della città
          testo: |
            Dici le quattro sillabe con la cadenza lenta della Spina, e il
            cantore si ferma con le grate aperte. Le ripete con decine di
            bocche, piano. Poi canta il richiamo, e stavolta lo canta verso di
            te, tre note che scendono e l'ultima tenuta per nove battiti,
            finché lo hai imparato. Lo canti tu dentro la bocca di nord-est.

            Aspetti, e aspetti ancora, finché dalla bocca torna una nota
            bassa, così lontana che la senti nei denti più che nelle orecchie.
            Il cantore apre una grata sul petto e ti lascia prendere un nucleo
            che mormora e una canna sottile che vibra ancora.
          pe: { espressivita: 5 }
          effetti: { misura.spina: 1, oggetto.spina-dell-eco-canna-della-voce: 1, parte.nucleo-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La parola nel posto sbagliato
          testo: |
            Sbagli la cadenza, e il cantore ti restituisce le quattro sillabe
            con la tua voce, storpiate, da tutte le bocche insieme. Risali il
            camino con quel nome storto in testa, e sulla pianura ti sembra di
            sentirlo anche nel vento.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Tornare su senza farsi sentire"
        descrizione: "Il cantore resta dov'è, e il camino riporta alla pianura."
        costo: 0
        esito:
          titolo: I pioli
          testo: |
            Esci dalla sala camminando all'indietro senza dire una parola, e
            risali il camino piolo dopo piolo. Mentre sali senti scendere una
            voce gridata dalla pianura, e dopo un poco risalire con un'altra
            parola dentro.
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo · la voce, le altre volte
  - id: spina-dell-eco-la-voce-che-resta
    immagine: bestiario/salvaguardia-precursori
    titolo: La voce, di nuovo
    sommario: "Il cantore di ferro è di nuovo in piedi davanti alla bocca di nord-est. Il richiamo lo sai, e la bocca risponde ancora."
    luogo: La Spina dell'Eco, la sala della voce
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco >= 4, misura.spina >= 1]
    testo: |
      Il cantore di ferro è di nuovo in piedi in mezzo alla sala, con
      qualche grata in meno sul petto e le altre rimesse in fila alla
      meglio. Prende le voci dal camino e le ricanta su come prima, e
      quando il camino tace canta il richiamo verso la bocca di nord-est.
      Ti accorgi di cantarlo con lui, a bocca chiusa.

      {percezione Media} Accanto alla bocca, nella nicchia, ci sono di nuovo
      pezzi lucidi. Qualcosa li porta lì mentre nessuno guarda.
    opzioni:
      - testo: "Abbattere di nuovo il cantore"
        descrizione: "Ha meno grate dell'altra volta. Dentro ci sarà meno da prendere, ma qualcosa c'è."
        combattimento: spina-dell-eco-il-cantore-di-ferro
        vittoria:
          titolo: Le grate in meno
          testo: |
            Il cantore cade in ginocchio con il richiamo a metà. Dal petto
            stacchi un nucleo più piccolo di quello dell'altra volta e un
            guscio chiuso, e risali il camino prima che le grate ricomincino a
            muoversi.
          effetti: { parte.nucleo-2: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Il tuo nome
          testo: |
            Il cantore ti canta addosso il tuo nome con tutte le bocche, e
            risali il camino con le orecchie che fischiano.
          effetti: { tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Cantare il richiamo e prendere dalla nicchia"
        descrizione: "Mentre il cantore canta verso la bocca non guarda la nicchia. Bisogna cantare con lui, e allungare la mano al momento giusto."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: La nicchia
          testo: |
            Canti il richiamo con il cantore, e sulla nota lunga allunghi la
            mano alla nicchia. Prendi due pezzi lucidi e un guscio chiuso, e
            quando la nota finisce sei già sui pioli.
          pe: { espressivita: 2 }
          effetti: { reliquie.frammento-inciso: 2, reperto.sigillato: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La nota corta
          testo: |
            Tieni la nota lunga un battito di meno, e il cantore si volta verso
            di te con le grate aperte. Risali a mani vuote, con un ronzio in
            testa.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ascoltare la risposta e risalire"
        descrizione: "La bocca di nord-est risponde ancora. Basta aspettare."
        costo: 0
        esito:
          titolo: La nota bassa
          testo: |
            Ti siedi contro la parete e aspetti con il cantore. Finito il
            richiamo, e passata un'attesa lunga, la nota bassa torna dalla
            bocca di nord-est, e te la senti nei denti mentre risali il
            camino.
          vai: superficie-fratturata

