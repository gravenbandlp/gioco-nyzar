    slot: accessorio
    grado: 2
    proprieta: { talento: { espressivita: 1, intimidire: 1 } }

glossario:
  - id: spina-dell-eco
    nome: Spina dell'Eco
    alias: [Spina]
    tipo: luogo
    sottotitolo: Un luogo nero sulla pianura fra il Bosco di Velthar e il Rovolungo
    testo: "Un pilastro di pietra nera alto sei metri, ritto come un dito puntato in mezzo alla pianura. Le frecce ci rimbalzano sopra. Restituisce le voci dopo nove battiti, con un'altra parola dentro, e i cantori di strada ci vanno a gridare e poi non ne parlano volentieri."

