# La Spina dell'Eco (docs/piano-superficie.md, «Le nove spedizioni dei luoghi neri»). Un pilastro di pietra nera
# alto sei metri sulla pianura fra il Bosco di Velthar e il Rovolungo, che restituisce le voci dopo nove battiti con
# un'altra parola (codex sf-spina-dell-eco). In superficie resta canone la scena del Circolo con Voren
# (`circolo-la-spina-dell-eco`, la parola di quattro sillabe, circolo.parola): il pilastro è vuoto come un camino e
# scende più giù di quanto sia alto, e la spedizione scende lì dentro. Sotto c'è la voce dello strumento: un cantore
# di ferro che riceve le voci dal camino e le ricanta su, e che quando nessuno grida canta il richiamo dentro una
# bocca di metallo rivolta a nord-est. Da laggiù, molto tempo dopo, risponde una nota bassa.
# Ci si entra da `spina-dell-eco-la-pianura` (Superficie, ripetibile, traccia.spina >= 3); chi ha la parola del
# Circolo (circolo.parola >= 1) può dirla alla Spina, e la riconosce sulla parete dei nomi e davanti al cantore.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 il camino dei pioli o le voci vecchie, 1 le canne o la parete dei nomi, 2 i ripetitori (scontro) o la stanza
# muta, 3 il cerchio dei nove incavi o la membrana; il soffio dei nove battiti vale da 1 a 3.
# Il cuore a 4 è la voce (`spina-dell-eco-la-voce`, misura.spina == 0): il cantore di ferro (boss), oppure cantare il
# richiamo con lui, l'Eco, o dire la parola del Circolo (Difficili). La vittoria dà misura.spina, la Canna della
# voce (grado 2) e parti dei Precursori. Dopo, `spina-dell-eco-la-voce-che-resta` (ripetibile, misura.spina >= 1)
# rende meno.
# La misura, per chi scrive la Campana: il richiamo è un canto di tre note che scendono, senza parole, con l'ultima
# tenuta per nove battiti. Cantato nella bocca rivolta a nord-est, dopo un'attesa lunga torna da laggiù una nota
# bassa che si sente nei denti più che nelle orecchie. Il «ritardo di nove battiti» della Spina è il tempo che la
# voce impiega a scendere fino al cantore e a tornare su.
# Il segno che lega i luoghi neri: il cerchio di nove incavi con uno inciso più a fondo (vedi lente-del-sornione.yaml),
# qui con dentro la riga fra due onde (la quarta pietra dell'Anello); il condotto che va a nord-est è una canna di
# metallo che vibra. La nota bassa che torna dalla bocca di nord-est è la stessa della Costola.
aree:
  - id: spina-dell-eco
    immagine: ambientazione/superficie-fratturata
    nome: La Spina dell'Eco
    sommario: "Il pilastro nero è vuoto come un camino e scende sotto la pianura, dove qualcosa ricanta le voci."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Dentro la Spina dell'Eco il pilastro continua sotto la pianura in un
      pozzo dritto, con i pioli piantati nella pietra nera, e in fondo partono
      gallerie basse percorse da canne di metallo di ogni grossezza.

      Ogni parola che dici qui sotto torna indietro, spesso dopo nove battiti
      e con un'altra parola dentro.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: spina-dell-eco-la-pianura
    immagine: ambientazione/superficie-fratturata
    titolo: Il pilastro sulla pianura
    sommario: "Sulla pianura del nord la Spina sta ritta come un dito puntato, con qualcosa di duro sotto la terra smossa."
    luogo: Superficie Fratturata, la pianura fra il Bosco di Velthar e il Rovolungo
    area: superficie-fratturata
    ripetibile: true
    requisiti: [traccia.spina >= 3]
    testo: |
      La pianura è gialla d'erba secca fino alla riga scura del Bosco di
      Velthar, e in mezzo sta la Spina, un pilastro di pietra nera alto
      quanto tre uomini. Ai suoi piedi la terra è smossa da vecchi scavi, e
      in una buca luccica qualcosa di duro. Accanto, in un cerchio di sassi
      anneriti, c'è un plettro di corno spezzato in due.

      {origine figlio-del-circolo} Il Circolo insegna ad ascoltare prima di
      parlare, e qui la pianura è così zitta che senti il sangue nelle
      orecchie.
    opzioni:
      - testo: "Scavare la buca fino a quello che è duro"
        descrizione: "Chi ha scavato prima di te si è fermato su qualcosa che la pala non sposta."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: L'anello
          testo: |
            La pala scopre un coperchio di pietra nera grande come una ruota di
            carro, e con la leva nell'anello lo sposti di lato su una fila di
            pioli che scende nel buio.
          pe: { atletica: 2 }
          vai: spina-dell-eco
        fallimento:
          titolo: La terra che torna
          testo: |
            La terra secca ti frana nella buca a ogni palata, e a sera hai le
            spalle a pezzi e la buca larga come prima.
          effetti: { ferite: 0.5 }
      - testo: "Gridare e ascoltare da dove torna la voce"
        descrizione: "Se la voce torna da sotto, c'è un passaggio per il suono e forse per un corpo."
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: Il nono battito
          testo: |
            Con l'orecchio a terra senti il tuo nome tornare al nono battito da un
            punto dove la terra suona vuota, e lì trovi un coperchio di pietra
            nera con un anello e sotto una fila di pioli.
          pe: { percezione: 2 }
          vai: spina-dell-eco
        fallimento:
          titolo: La parola sbagliata
          testo: |
            Al nono battito ti torna con la tua voce il nome di un altro, e a sera
            ti volti due volte quando qualcuno lo dice in una locanda.
          effetti: { tormento: 0.5 }
      - testo: "Arrivare a cavallo e cercare dove il cavallo non va"
        descrizione: "Dove sotto è vuoto, gli zoccoli lo sentono."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Lo zoccolo
          testo: |
            Il cavallo batte lo zoccolo dove la terra suona vuota, e sotto un
            palmo trovi un coperchio di pietra nera con un anello e una fila di
            pioli che scende.
          vai: spina-dell-eco
      - testo: "Passare la notte alla Spina e aspettare"
        descrizione: "Di notte la pianura tace e il sussurro da sotto si sente meglio, ma fa freddo."
        costo: 2
        esito:
          titolo: Il sussurro di notte
          testo: |
            A notte fonda il sussurro da sotto la buca si fa chiaro e ti porta
            fino a un coperchio di pietra nera con un anello, che liberi all'alba
            con le mani gelate.
          effetti: { ferite: 0.5 }
          vai: spina-dell-eco
      - testo: "Dire alla Spina la parola di quattro sillabe"
        descrizione: "Con Voren la Spina ti ha restituito il nome di una città, e forse lo riconosce."
        quando: [circolo.parola >= 1]
        esito:
          titolo: La risposta subito
          testo: |
            Dici le quattro sillabe con la cadenza della Spina, e la risposta
            arriva subito, da sotto i piedi. La terra intorno alla buca si apre e
            un coperchio di pietra nera si sposta da solo su una fila di pioli che
            scende.
          vai: spina-dell-eco

  # ------------------------------------------------------------ 0 · il camino e le voci vecchie
  - id: spina-dell-eco-il-camino
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il camino dei pioli
    sommario: "Dentro il pilastro una fila di pioli scende dritta nel buio, fra voci che salgono e scendono."
    luogo: La Spina dell'Eco, dentro il pilastro
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 0]
    testo: |
      Dentro il pilastro un camino largo quanto un pozzo da cortile scende
      con pioli piantati per gambe più lunghe delle tue, pieno di mezze
      parole che salgono e scendono e ti passano accanto alla faccia come
      uccelli in un fienile.

      {resilienza Media fallita} Una delle mezze parole somiglia al tuo nome,
      e mentre ti fermi ad ascoltare il piolo ti scivola fra le dita.
    opzioni:
      - testo: "Scendere a braccia, piolo dopo piolo"
        descrizione: "Pioli lontani e buio sotto, e le braccia fanno il lavoro."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: In fondo al camino
          testo: |
            Dopo sessantadue pioli scesi a braccia il camino si allarga in una
            stanza tonda.
          pe: { atletica: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il piolo mancato
          testo: |
            Al trentesimo piolo il piede trova il vuoto, e risali appeso per le
            mani fino al cerchio di cielo.
          effetti: { ferite: 0.5 }
      - testo: "Scendere ascoltando da dove vengono le voci"
        descrizione: "Dove le voci da sotto sono più forti, il camino si apre."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La finestra nel camino
          testo: |
            A metà camino, dal lato dove le voci sono più forti, una finestra
            stretta dà su una galleria in pendenza.
          pe: { percezione: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Le voci di sopra
          testo: |
            Ti accorgi tardi che stai seguendo le voci che scendono dall'alto, e
            ti ritrovi verso il cerchio di cielo con le braccia di legno.
          effetti: { tormento: 1 }
      - testo: "Calare la corda nel camino e scendere appesi"
        descrizione: "Una corda legata al primo piolo, e giù, se è lunga abbastanza."
        costo: 2
        esito:
          titolo: La corda nel camino
          testo: |
            La corda basta per un pezzo, e il resto lo fai sui pioli con le
            braccia già stanche, fino a sederti per terra in fondo.
          effetti: { profondita.spina-dell-eco: 1, ferite: 0.5 }

  - id: spina-dell-eco-le-voci-vecchie
    immagine: ambientazione/marea-grigia
    titolo: Le voci vecchie
    sommario: "In fondo al camino una stanza tonda dove girano ancora le voci di chi ha gridato alla Spina."
    luogo: La Spina dell'Eco, la stanza in fondo al camino
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 0]
    testo: |
      In fondo al camino c'è una stanza tonda con le pareti a spirale, dove
      girano fino a consumarsi le voci di chi ha gridato alla Spina. Un
      bambino chiama la madre, e una donna dice il nome di qualcuno tre
      volte, sempre più piano. Dall'altra parte c'è un'apertura bassa.

      {empatia Media} La donna dei tre nomi salutava qualcuno sapendo che non
      l'avrebbe rivisto più.
    opzioni:
      - testo: "Attraversare la stanza senza ascoltare"
        descrizione: "Sono voci di altri, e si passa in mezzo guardando l'apertura in fondo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: In mezzo alle voci
          testo: |
            Attraversi la stanza con gli occhi sull'apertura, mentre le voci ti
            girano intorno come la gente in un mercato, e dall'altra parte restano
            indietro.
          pe: { resilienza: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il bambino
          testo: |
            Il bambino chiama la madre accanto al tuo orecchio e ti volti a
            cercarlo, e ti ritrovi sotto il camino senza ricordare di essere
            tornato.
          effetti: { tormento: 1 }
      - testo: "Rispondere alla donna dei tre nomi"
        descrizione: "Una voce che saluta aspetta un saluto, e forse dopo smette di girare."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Media }
        successo:
          titolo: Il saluto
          testo: |
            Rispondi piano al saluto con il nome che lei dice, e la sua voce si
            spegne mentre le altre ti lasciano la strada.
          pe: { empatia: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il nome nella spirale
          testo: |
            La stanza si prende la tua risposta, e adesso fra le voci gira anche
            la tua. Torni sotto il camino a tapparti le orecchie.
          effetti: { tormento: 1 }
      - testo: "Strisciare lungo il bordo della spirale"
        descrizione: "Lungo il bordo basso le voci sono più deboli, e si passa sui gomiti."
        costo: 2
        esito:
          titolo: Sui gomiti
          testo: |
            Strisci lungo il bordo dove le voci arrivano spente, e all'apertura
            bassa ti tiri su con i gomiti sbucciati e le orecchie che fischiano.
          effetti: { profondita.spina-dell-eco: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · le canne e la parete dei nomi
  - id: spina-dell-eco-le-canne
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le canne
    sommario: "Una galleria di canne di metallo che portano le voci, ognuna in un posto diverso."
    luogo: La Spina dell'Eco, la galleria delle canne
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 1]
    testo: |
      La galleria è piena di canne di metallo grosse come un dito o come una
      botte, e appoggiando l'orecchio a una senti passare una parola che va
      da qualche parte. A ogni bivio le canne si dividono, e la galleria con
      loro.
    opzioni:
      - testo: "Seguire le canne più grosse"
        descrizione: "Dove le canne grosse vanno tutte insieme, c'è il centro."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Le canne grosse
          testo: |
            Bivio dopo bivio segui le canne grosse, finché in una sala si infilano
            tutte nel pavimento accanto a una scala a chiocciola.
          pe: { tecnologia: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il bivio cieco
          testo: |
            La canna che seguivi sparisce in un muro cieco, e tornando indietro
            conti un bivio in più di quelli che avevi fatto.
          effetti: { tormento: 1 }
      - testo: "Ascoltare le canne e seguire le voci che scendono"
        descrizione: "Le voci della Spina vanno giù, e una ti porta dove va lei."
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: Una parola che scende
          testo: |
            Segui con l'orecchio sulle canne una parola che corre in basso, fino a
            una scala a chiocciola.
          pe: { percezione: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: L'orecchio
          testo: |
            Ci passa un grido proprio mentre hai l'orecchio sulla canna, e per
            un'ora senti tutto da una parte sola.
          effetti: { ferite: 0.5 }
      - testo: "Segnare i bivii con il gesso e provarli tutti"
        descrizione: "Un bivio alla volta con il gesso, lento ma sicuro."
        costo: 2
        esito:
          titolo: Il gesso
          testo: |
            Quando trovi la scala a chiocciola hai consumato il gesso fino alle
            dita, e i muri sono pieni delle tue frecce.
          effetti: { profondita.spina-dell-eco: 1, tormento: 1 }

  - id: spina-dell-eco-la-parete-dei-nomi
    immagine: ambientazione/rovine-dei-precursori
    titolo: La parete dei nomi
    sommario: "Una parete coperta di segni incisi a gruppi, che ogni tanto si accendono mentre una canna parla."
    luogo: La Spina dell'Eco, la parete dei nomi
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 1]
    testo: |
      Una galleria dritta ha su un lato una parete lunga coperta di gruppi
      di segni incisi, e sotto ogni gruppo esce dal muro una canna sottile.
      Ogni tanto un gruppo si accende, e dalla sua canna passa una voce che
      dice sempre la stessa cosa. In fondo c'è una porta senza maniglia,
      accanto a un fascio di canne.

      {accademiche Media} Sono nomi, scritti con la stessa scrittura che sta
      sopra gli ingressi dei Precursori.
    opzioni:
      - testo: "Leggere i gruppi di segni"
        descrizione: "Se sono nomi, uno sarà il nome di questo posto, e la porta forse lo vuole sentire."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Il gruppo accanto alla porta
          testo: |
            Il gruppo accanto alla porta si accende più spesso degli altri, e la
            sua canna ripete tre sillabe. Le ripeti tu ad alta voce, e la porta si
            apre di lato.
          pe: { accademiche: 2 }
          effetti: { profondita.spina-dell-eco: 1, informazioni.voce: 1 }
        fallimento:
          titolo: I segni che si accendono
          testo: |
            A un certo punto i gruppi si accendono tutti insieme e tutte le canne
            parlano, e ti ritrovi per terra con le mani sulle orecchie.
          effetti: { tormento: 1 }
      - testo: "Trovare un'altra strada intorno alla porta"
        descrizione: "Le porte dei Precursori hanno sempre accanto un passaggio scomodo per chi le ripara."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Il passaggio di servizio
          testo: |
            Dietro il fascio di canne c'è un buco nel muro largo quanto un corpo
            di traverso, che porta oltre la porta.
          pe: { acrobazia: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Fra le canne
          testo: |
            Resti incastrato con la spalla mentre una canna ti passa una voce
            dritta nell'orecchio, e ti liberi lasciando un pezzo di manica.
          effetti: { ferite: 0.5 }
      - testo: "Riconoscere la parola di Voren"
        descrizione: "Sulla parete c'è un gruppo di quattro segni, come le sillabe della Spina."
        quando: [circolo.parola >= 1]
        esito:
          titolo: Quattro segni
          testo: |
            Il gruppo di quattro segni si accende e la sua canna dice le sillabe
            che la Spina ha detto a te e a Voren. Lo tocchi con due dita e la
            porta si apre, e il nome di quella città resta scritto fra gli altri
            come un indirizzo.
          effetti: { profondita.spina-dell-eco: 1, informazioni.voce: 1 }
      - testo: "Aspettare che la porta si apra per qualcun altro"
        descrizione: "Prima o poi una voce passa dalla porta, e la porta la lascia passare."
        costo: 2
        esito:
          titolo: La voce che passa
          testo: |
            Quando la porta si apre per lasciar passare una voce, ci passi di
            corsa e si richiude a un dito dalla tua schiena.
          effetti: { profondita.spina-dell-eco: 1, tormento: 1 }

  # ------------------------------------------------------------ 1–3 · il soffio dei nove battiti
  - id: spina-dell-eco-il-soffio
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il soffio dei nove battiti
    sommario: "In una galleria lunga, ogni nove battiti, arriva da sotto un soffio d'aria che ti spinge indietro."
    luogo: La Spina dell'Eco, la galleria lunga
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco >= 1, profondita.spina-dell-eco <= 3]
    testo: |
      La galleria scende lunga e dritta, e ogni nove battiti da sotto arriva
      un soffio che ti spinge indietro di un passo con una sola parola
      gridata dentro.

      {espressivita Facile} Nove battiti sono una strofa corta, e i cantori
      ci contano sopra senza pensarci.
    opzioni:
      - testo: "Avanzare piegati contro il soffio"
        descrizione: "Con un piede avanti e il peso giusto, il soffio passa sopra la schiena."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Piegato
          testo: |
            A ogni soffio pianti il piede e lasci che ti passi sulla schiena, e
            fra un soffio e l'altro fai otto passi fino in fondo.
          pe: { resistenza: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il soffio in faccia
          testo: |
            Un soffio ti prende dritto e ti mette a sedere tre passi indietro, e
            alla terza volta rinunci.
          effetti: { ferite: 0.5 }
      - testo: "Contare i battiti e correre fra un soffio e l'altro"
        descrizione: "Nove battiti sono abbastanza per un tratto di corsa, se si parte al momento giusto."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: La strofa
          testo: |
            Conti a mezza voce come il cantore della locanda, e correndo fra un
            soffio e l'altro arrivi in fondo in sei strofe.
          pe: { espressivita: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Fuori tempo
          testo: |
            Perdi il conto al sesto battito e il soffio ti sbatte contro la parete
            con la spalla.
          effetti: { ferite: 0.5 }
      - testo: "Avanzare a carponi lungo il pavimento"
        descrizione: "Rasente al pavimento il soffio passa più alto, a spese delle ginocchia."
        costo: 2
        esito:
          titolo: A carponi
          testo: |
            I soffi ti passano sopra la testa, e arrivi in fondo con le ginocchia
            sbucciate e una ventina di parole in testa.
          effetti: { profondita.spina-dell-eco: 1, tormento: 1 }

  # ------------------------------------------------------------ 2 · i ripetitori e la stanza muta
  - id: spina-dell-eco-i-ripetitori
    immagine: bestiario/salvaguardia-precursori
    titolo: I ripetitori
    sommario: "Due macchine di bronzo pendono dalle canne di una sala, e ti rispondono con la tua voce."
    luogo: La Spina dell'Eco, la sala dei ripetitori
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 2]
    testo: |
      Dal soffitto pendono due macchine di bronzo lunghe come un braccio e
      segmentate come lamprede, con una bocca tonda piena di denti di
      metallo. Ti scappa un colpo di tosse, e le due macchine tossiscono con
      la tua tosse e si staccano dalle canne.

      {furtivita Media} Sentono, e non vedono. In silenzio, contro la parete,
      sei soltanto un pezzo di muro.
    opzioni:
      - testo: "Affrontare i ripetitori"
        descrizione: "Due lamprede di bronzo, sottili, che un colpo pieno spezza."
        combattimento: spina-dell-eco-ripetitori
        vittoria:
          titolo: Il bronzo spezzato
          testo: |
            L'ultimo ripetitore si spezza sul pavimento ripetendo una parola con
            la tua voce, sempre più piano. Gli stacchi la bocca di metallo e il
            pezzo che vibrava dietro.
          effetti: { profondita.spina-dell-eco: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: La tua voce
          testo: |
            I denti ti trovano il braccio e la spalla mentre i ripetitori gridano
            con la tua voce, ed esci dalla sala camminando all'indietro.
      - testo: "Passare contro la parete senza un suono"
        descrizione: "Sentono e non vedono, e bisogna passare senza un suono."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Un pezzo di muro
          testo: |
            Ti togli gli stivali e passi contro la parete sulle calze, con la
            lanterna spenta, mentre i ripetitori girano la testa verso ogni goccia
            che cade.
          pe: { furtivita: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il ginocchio
          testo: |
            Il ginocchio ti scricchiola a metà sala e i ripetitori lo ripetono più
            forte, e scappi con un morso sul polpaccio.
          effetti: { ferite: 0.5 }
      - testo: "Gettare un sasso nell'angolo e passare dall'altra parte"
        descrizione: "Un sasso che rotola in un angolo fa un rumore, e loro vanno a ripeterlo."
        costo: 2
        esito:
          titolo: Il sasso
          testo: |
            I ripetitori si buttano sul sasso ripetendone il rumore, e passi di
            corsa, ma uno torna in tempo per morderti la mano della lanterna.
          effetti: { profondita.spina-dell-eco: 1, ferite: 0.5 }

  - id: spina-dell-eco-la-stanza-muta
    immagine: ambientazione/rovine-dei-precursori
    titolo: La stanza muta
    sommario: "In una stanza foderata di feltro grigio non c'è nessun suono, nemmeno quello dei tuoi passi."
    luogo: La Spina dell'Eco, la stanza muta
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 2]
    testo: |
      La stanza è foderata di feltro grigio spesso un palmo, e dentro i tuoi
      passi non fanno rumore. Dopo un poco senti il sangue nelle orecchie, e
      poi un fischio sottile da dentro la testa. In fondo, appena visibile
      nel feltro, c'è una porta.
    opzioni:
      - testo: "Attraversare il silenzio senza fermarsi"
        descrizione: "Si attraversa contando i passi, che non si sentono."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il fischio
          testo: |
            Cammini contando i passi, e quando a metà stanza qualcuno ti chiama da
            dietro non ti volti. Oltre la porta, sulla scala, il primo rumore che
            senti è il tuo piede.
          pe: { resilienza: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il nome nel silenzio
          testo: |
            Ti senti chiamare da dietro e ti volti, tante volte che perdi la porta
            e torni fuori dalla parte da cui eri entrato.
          effetti: { tormento: 1 }
      - testo: "Seguire il filo d'aria fino alla porta"
        descrizione: "Senza suoni resta la pelle, e un filo d'aria che viene dalla porta."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il filo d'aria
          testo: |
            Con un dito bagnato alzato senti un filo d'aria dal fondo, e lo segui
            a occhi chiusi fino alla porta.
          pe: { percezione: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il feltro
          testo: |
            Il filo d'aria ti porta a un buco nel feltro che non va da nessuna
            parte, e torni indietro con la polvere grigia nei capelli.
          effetti: { tormento: 1 }
      - testo: "Cantare forte per tutto il tragitto"
        descrizione: "Se il silenzio si mangia il suono, bisogna farne di più."
        costo: 2
        esito:
          titolo: Senza voce
          testo: |
            Canti a squarciagola senza sentire una nota, e arrivi alla porta con
            la gola in fiamme e un filo di voce per il resto della discesa.
          effetti: { profondita.spina-dell-eco: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · il cerchio delle nove tacche e la membrana
  - id: spina-dell-eco-il-cerchio-dei-nove
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il cerchio delle canne
    sommario: "Un cerchio di nove incavi con una riga fra due onde in quello profondo, e una canna grossa verso nord-est."
    luogo: La Spina dell'Eco, la sala del cerchio
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 3]
    testo: |
      Al centro di una sala tonda c'è un cerchio inciso, largo quanto un
      tavolo da osteria, con nove incavi. Il nono è più fondo e ha dentro
      una riga dritta fra due onde, che manda una luce bianca a tempo con le
      voci. Dal centro esce una canna grossa come un braccio, che vibra di
      una nota lunga ed entra nella parete di nord-est.
    opzioni:
      - testo: "Ricopiare il cerchio sul quaderno"
        descrizione: "Qualcuno alla Biblioteca saprà leggere gli incavi e la canna verso nord-est."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: Il disegno
          testo: |
            Ricopi il cerchio con la riga fra le due onde e una freccia per la
            canna, e la matita segue il tempo del segno senza che tu lo decida.
          pe: { accademiche: 2 }
          effetti: { profondita.spina-dell-eco: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: La luce bianca
          testo: |
            La luce bianca dell'incavo ti sale nel braccio con una nota che senti
            nei denti, e per un'ora la mano trema troppo per scrivere.
          effetti: { tormento: 1 }
      - testo: "Seguire la canna grossa fino alla parete"
        descrizione: "Dove la canna entra nella parete ci sarà un passaggio per chi la ripara."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La nota lunga
          testo: |
            Dove la canna entra nel muro c'è una porticina bassa, e dietro una
            scala che scende ancora.
          pe: { percezione: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: La vibrazione
          testo: |
            La vibrazione della canna ti entra nelle ossa del braccio, e torni
            indietro intorpidito senza aver visto la porticina.
          effetti: { ferite: 0.5 }
      - testo: "Cercare l'incavo che riconosci"
        descrizione: "Lo hai già visto sotto la Soglia di Mara, con una porta nell'incavo profondo."
        quando: [misura.mara >= 1]
        esito:
          titolo: Due segni
          testo: |
            L'incavo che sotto la Soglia aveva la porta qui è liscio e freddo.
            Ricopi i due segni uno accanto all'altro e prosegui.
          effetti: { profondita.spina-dell-eco: 1, informazioni.segreto: 1 }
      - testo: "Passare oltre il cerchio senza toccarlo"
        descrizione: "Per proseguire bisogna scavalcare la canna, e vibra."
        costo: 2
        esito:
          titolo: La canna sotto i piedi
          testo: |
            Scavalchi la canna con un salto, e la vibrazione ti sale dalle suole
            alle ginocchia e ti lascia una nota nei denti fino in fondo alla
            discesa.
          effetti: { profondita.spina-dell-eco: 1, tormento: 1 }

  - id: spina-dell-eco-la-membrana
    immagine: ambientazione/rovine-dei-precursori
    titolo: La membrana
    sommario: "Una lamina larga come una vela chiude la galleria e vibra ogni nove battiti."
    luogo: La Spina dell'Eco, la membrana
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco == 3]
    testo: |
      La galleria è chiusa da una lamina di metallo sottile come la carta e
      larga come una vela, tesa su un telaio, che ogni nove battiti vibra
      con un rombo basso. Fra la lamina e la parete di destra c'è uno
      spiraglio largo quanto un piede, e oltre si vede una luce.

      {tecnologia Difficile} La lamina ascolta come un orecchio, e una mano
      basta a zittirla per un battito.
    opzioni:
      - testo: "Passare di fianco nello spiraglio"
        descrizione: "Si passa di fianco nel tempo fra un rombo e l'altro."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Lo spiraglio
          testo: |
            Ti infili subito dopo il rombo, di fianco, con la guancia contro la
            parete, ed esci al settimo battito mentre la lamina vibra alle tue
            spalle.
          pe: { acrobazia: 2 }
          effetti: { profondita.spina-dell-eco: 1 }
        fallimento:
          titolo: Il rombo addosso
          testo: |
            Resti incastrato e il rombo ti arriva addosso con la lamina a un dito
            dal petto, e torni indietro con il sangue dal naso.
          effetti: { ferite: 0.5 }
      - testo: "Fermare la lamina con il palmo e passarle sotto"
        descrizione: "Una mano sulla lamina la fa tacere per un battito, e sotto il telaio c'è spazio per un corpo."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il palmo sulla lamina
          testo: |
            Nel battito di silenzio rotoli sotto il telaio, e trovi la scheggia
            lucida che la lamina ha lasciato cadere.
          pe: { tecnologia: 2 }
          effetti: { profondita.spina-dell-eco: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: La mano che vibra
          testo: |
            La vibrazione invece di fermarsi ti entra nel braccio fino ai denti, e
            la lamina continua come prima.
          effetti: { tormento: 1 }
      - testo: "Allentare il telaio e aspettare"
        descrizione: "Il telaio ha delle viti, e la lamina ti rimbomba nelle mani ogni nove battiti."
        costo: 2
        esito:
          titolo: Le viti
          testo: |
            Allenti le viti una alla volta, togliendo le mani a ogni rombo, e
            quando la lamina si affloscia hai le dita gonfie.
          effetti: { profondita.spina-dell-eco: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · la voce
  - id: spina-dell-eco-la-voce
    immagine: bestiario/salvaguardia-precursori
    titolo: La voce
    sommario: "In fondo alla Spina un cantore di ferro ricanta su le voci, e canta verso una bocca di metallo a nord-est."
    luogo: La Spina dell'Eco, la sala della voce
    area: spina-dell-eco
    requisiti: [profondita.spina-dell-eco >= 4, misura.spina == 0]
    testo: |
      La sala è una cupola, e dall'alto scende la bocca del camino. Sulla
      parete di nord-est si apre una bocca di metallo a imbuto, larga come un
      portone, che si stringe fino a sparire nella roccia. In mezzo sta il
      cantore di ferro, alto il doppio di te e coperto di grate tonde dalle
      spalle alle ginocchia come di decine di piccole bocche.

      Prende con le grate la voce che scende dal camino, il nome di qualcuno
      gridato lassù, e nove battiti dopo la ricanta su con la cadenza lenta
      della Spina e un'altra parola dentro. Quando il camino tace si gira
      verso la bocca di nord-est e canta tre note che scendono, con l'ultima
      tenuta a lungo, come un richiamo.

      {origine figlio-del-circolo} Al Circolo i vecchi distinguono una voce
      dall'altra anche nel vento, e questa cadenza la riconosceresti fra
      mille.

      {origine accolito-del-velo} In cripta le testimonianze della Notte dei
      Sussurri dicono che le voci del suolo cantavano con una cadenza lenta,
      ed era questa.

      Poi il cantore si volta verso di te, e tutte le grate si aprono.
    opzioni:
      - testo: "Affrontare il cantore di ferro"
        descrizione: "Decine di bocche e una voce sola che fa male, in un corpo fatto per stare fermo."
        combattimento: spina-dell-eco-il-cantore-di-ferro
        vittoria:
          titolo: Il richiamo
          testo: |
            Il cantore cade in ginocchio e le grate si chiudono con un rumore di
            imposte, ma prima esce il richiamo, tre note che scendono e l'ultima
            tenuta nove battiti. Lo canti dentro la bocca di nord-est, e dopo una
            lunga attesa torna una nota bassa che senti nei denti. Dal petto del
            cantore stacchi un nucleo che mormora e una canna sottile che vibra.
          pe: { armi-da-mischia: 5 }
          effetti: { misura.spina: 1, oggetto.spina-dell-eco-canna-della-voce: 1, parte.nucleo-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: La voce che fa male
          testo: |
            Il cantore ti canta addosso il tuo nome con la tua voce, così forte
            che ti cade la lama. Risali con le orecchie che sanguinano, e sulla
            pianura non senti più niente fino a sera.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Cantare il richiamo insieme a lui"
        descrizione: "Se lo canti giusto, forse il cantore ti sente come uno dei suoi."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: Due voci
          testo: |
            Tieni con il cantore la terza nota del richiamo per nove battiti senza
            tremare, e lui chiude le grate e si sposta. Lo canti da solo dentro la
            bocca di nord-est, e dopo una lunga attesa torna una nota bassa che
            senti nei denti. Il cantore ti lascia prendere dal suo petto un nucleo
            che mormora e una canna sottile che vibra.
          pe: { espressivita: 5 }
          effetti: { misura.spina: 1, oggetto.spina-dell-eco-canna-della-voce: 1, parte.nucleo-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La nota stonata
          testo: |
            Alla terza nota la voce ti si spezza, e il cantore te la rimanda
            stonata da decine di bocche. Ti ritrovi sui pioli del camino con il
            sangue che cola da un orecchio.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Leggere la memoria della sala con l'Eco"
        descrizione: "La formula dell'Eco legge la memoria di un luogo, e questa sala ha ricordato soltanto voci."
        incantesimo: eco
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La prima volta
          testo: |
            La sala ti mostra la prima volta che il cantore ha cantato il
            richiamo, e lo impari da lì. Lo canti dentro la bocca di nord-est, e
            dopo una lunga attesa torna una nota bassa che senti nei denti. Da una
            nicchia accanto alla bocca prendi un nucleo che mormora e una canna
            sottile che vibra.
          pe: { magia: 5 }
          effetti: { misura.spina: 1, oggetto.spina-dell-eco-canna-della-voce: 1, parte.nucleo-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Tutte le voci
          testo: |
            La memoria della sala ti arriva tutta insieme, con tutte le voci
            passate di qui, e ti ritrovi sdraiato sull'erba della pianura con le
            mani sulle orecchie.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Dire la parola di quattro sillabe al cantore"
        descrizione: "La Spina l'ha restituita a te e a Voren, e il cantore la conosce."
        quando: [circolo.parola >= 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Difficile }
        successo:
          titolo: Il nome della città
          testo: |
            Dici le quattro sillabe con la cadenza della Spina, e il cantore le
            ripete con decine di bocche e poi ti canta il richiamo finché lo
            impari. Lo canti dentro la bocca di nord-est, e dopo una lunga attesa
            torna una nota bassa che senti nei denti. Il cantore ti lascia
            prendere dal suo petto un nucleo che mormora e una canna sottile che
            vibra.
          pe: { espressivita: 5 }
          effetti: { misura.spina: 1, oggetto.spina-dell-eco-canna-della-voce: 1, parte.nucleo-3: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La parola nel posto sbagliato
          testo: |
            Sbagli la cadenza, e il cantore ti restituisce le quattro sillabe
            storpiate con la tua voce. Sulla pianura ti sembra di sentirle anche
            nel vento.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Tornare su senza farsi sentire"
        descrizione: "Il cantore resta dov'è, e il camino riporta alla pianura."
        costo: 0
        esito:
          titolo: I pioli
          testo: |
            Esci all'indietro senza una parola, e mentre risali senti scendere una
            voce gridata dalla pianura e poi tornare su con un'altra parola
            dentro.
          vai: superficie-fratturata

  # ------------------------------------------------------------ dopo · la voce, le altre volte
  - id: spina-dell-eco-la-voce-che-resta
    immagine: bestiario/salvaguardia-precursori
    titolo: La voce, di nuovo
    sommario: "Il cantore di ferro è di nuovo in piedi, e la bocca di nord-est risponde ancora."
    luogo: La Spina dell'Eco, la sala della voce
    area: spina-dell-eco
    ripetibile: true
    requisiti: [profondita.spina-dell-eco >= 4, misura.spina >= 1]
    testo: |
      Il cantore di ferro è di nuovo in piedi, con qualche grata in meno e
      le altre rimesse in fila alla meglio. Ricanta le voci come prima, e
      quando il camino tace canta il richiamo verso la bocca di nord-est
      mentre tu lo canti con lui a bocca chiusa. Nella nicchia accanto alla
      bocca ci sono di nuovo pezzi lucidi.
    opzioni:
      - testo: "Abbattere di nuovo il cantore"
        descrizione: "Ha meno grate, e dentro ci sarà meno da prendere."
        combattimento: spina-dell-eco-il-cantore-di-ferro
        vittoria:
          titolo: Le grate in meno
          testo: |
            Il cantore cade in ginocchio con il richiamo a metà, e dal petto
            stacchi un nucleo più piccolo dell'altra volta e un guscio chiuso.
          effetti: { parte.nucleo-2: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Il tuo nome
          testo: |
            Il cantore ti canta addosso il tuo nome con tutte le bocche, e
            risali il camino con le orecchie che fischiano.
          effetti: { tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Cantare il richiamo e prendere dalla nicchia"
        descrizione: "Mentre canta verso la bocca il cantore non guarda la nicchia."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: La nicchia
          testo: |
            Sulla nota lunga allunghi la mano alla nicchia, e quando il richiamo
            finisce sei già sui pioli con due pezzi lucidi e un guscio chiuso.
          pe: { espressivita: 2 }
          effetti: { reliquie.frammento-inciso: 2, reperto.sigillato: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La nota corta
          testo: |
            Tieni la nota lunga un battito di meno, e il cantore si volta con le
            grate aperte. Risali a mani vuote.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ascoltare la risposta e risalire"
        descrizione: "La bocca di nord-est risponde ancora. Basta aspettare."
        costo: 0
        esito:
          titolo: La nota bassa
          testo: |
            Aspetti con il cantore, e dopo il richiamo e un'attesa lunga la nota
            bassa torna dalla bocca di nord-est, e te la senti nei denti mentre
            risali.
          vai: superficie-fratturata

nemici:
  - id: spina-dell-eco-ripetitore
    immagine: bestiario/salvaguardia-precursori
    nome: Ripetitore
    descrizione: "Una macchina di bronzo lunga come un braccio e segmentata come una lampreda, che sta appesa alle canne sotto la Spina dell'Eco. Ripete con la tua voce ogni rumore che fai, e morde quello che lo ha fatto."
    attacco: 4
    difesa: 4
    difesaMentale: 4
    pf: 6
    danno: 3
    riduzione: 1
    iniziativa: 4

  - id: spina-dell-eco-il-cantore-di-ferro
    immagine: bestiario/salvaguardia-precursori
    nome: Il cantore di ferro
    descrizione: "Una macchina alta il doppio di un uomo, coperta di grate tonde dalle spalle alle ginocchia. Sta in fondo alla Spina dell'Eco e ricanta su per il camino le voci che scendono, e chi la disturba se la sente cantare addosso."
    attacco: 5
    difesa: 4
    difesaMentale: 6
    pf: 14
    danno: 3
    riduzione: 4
    iniziativa: 2

scontri:
  - { id: spina-dell-eco-ripetitori, nome: "I ripetitori", nemici: [spina-dell-eco-ripetitore, spina-dell-eco-ripetitore], feriteSconfitta: 2 }
  - { id: spina-dell-eco-il-cantore-di-ferro, nome: "Il cantore di ferro", nemici: [spina-dell-eco-il-cantore-di-ferro], feriteSconfitta: 4 }

oggetti:
  - id: spina-dell-eco-canna-della-voce
    nome: Canna della voce
    immagine: icone/pan-flute
    descrizione: "Una canna di metallo lunga un palmo, staccata dal petto del cantore di ferro sotto la Spina dell'Eco. Appesa al collo vibra quando parli, e la tua voce arriva più lontano e resta più a lungo nelle orecchie di chi ascolta."
    slot: accessorio
    grado: 2
    proprieta: { talento: { espressivita: 1, intimidire: 1 } }

glossario:
  - id: spina-dell-eco
    nome: Spina dell'Eco
    alias: [Spina]
    tipo: luogo
    sottotitolo: Un luogo nero sulla pianura fra il Bosco di Velthar e il Rovolungo
    testo: "Pilastro di pietra nera alto sei metri, ritto in mezzo alla pianura, su cui le frecce rimbalzano. Restituisce le voci dopo nove battiti con un'altra parola dentro, e i cantori di strada ci vanno a gridare e poi non ne parlano volentieri."

colonna:
  - { contesto: area, id: spina-dell-eco, musica: unsettling-paths, ambiente: cave }
