# Regolamento v0.4, 3.3 e 9.6. Build preimpostate per il prototipo:
# attributi 1 + 2 punti (max 3), abilità 8 punti (max 2), poi +1 a due abilità dell'origine.
# Dopo il prologo (prologo/*.yaml, tre-giorni-dopo) ogni origine riparte dal suo quartiere.
# Magia: Accolito e Circolo partono con Magia 1 e un incantesimo; l'Allievo di Torvessa è l'origine del mago.
origini:
  - id: figlio-della-citta-bassa
    immagine: ambientazione/citta-bassa
    nome: Figlio della Città Bassa
    testo: "Sei cresciuto in Città Bassa, tra il fumo delle fucine. Conosci i vicoli a memoria e sai quali facce è meglio dimenticare."
    attributi: { fisico: 2, sociale: 2, mentale: 1 }
    abilita: { rissa: 3, conoscenze-della-strada: 3, acrobazia: 1, armi-da-mischia: 1, empatia: 1, intimidire: 1 }
    quality: { monete: 15, contatto-ombra: 1, rep.scuri: 2, bende: 1 }
    arma: tirapugni
    armatura: nessuna

  - id: apprendista-raschiatore
    immagine: fazioni/raschiatori
    nome: Apprendista Raschiatore
    testo: "Hai già fatto qualche turno sulle piattaforme della Cicatrice e sai per chi si accendono le lanterne del Ponte dei Morti."
    attributi: { fisico: 2, sociale: 1, mentale: 2 }
    abilita: { atletica: 3, tecnologia: 3, percezione: 2, armi-da-mischia: 1, resistenza: 1 }
    quality: { monete: 15, raschiatore: 1, rep.raschiatori: 2, bende: 1 }
    arma: pugnale
    armatura: giaco-imbottito

  - id: accolito-del-velo
    immagine: fazioni/confraternita-del-velo
    nome: Accolito del Velo
    testo: "Hai imparato a parlare a bassa voce e a non chiedere cosa c'è sotto l'altare."
    attributi: { fisico: 1, sociale: 2, mentale: 2 }
    abilita: { accademiche: 3, medicina: 3, empatia: 2, resilienza: 1, magia: 1 }
    quality: { monete: 20, rep.velo: 2, tonico: 1, incantesimo.benedizione: 1 }
    arma: mani-nude
    armatura: nessuna

  - id: rampollo-dei-quartieri-alti
    immagine: ambientazione/quartieri-alti
    nome: Rampollo dei Quartieri Alti
    testo: "Sei nato nei Quartieri Alti, tra la pietra chiara e i tetti di rame. Sai quale forchetta usare e a quale nemico sorridere."
    attributi: { fisico: 1, sociale: 3, mentale: 1 }
    abilita: { galateo: 3, politica-ed-economia: 3, persuasione: 2, ingannare: 1, armi-da-mischia: 1 }
    quality: { monete: 60, invito: 1, rep.castaldi: 2 }
    arma: spada-corta
    armatura: nessuna

  - id: mercante-dei-ponti
    immagine: fazioni/gilda-dei-mercanti
    nome: Mercante dei Ponti
    testo: "Quasi ogni affare della città passa per i Ponti, e tu hai la licenza della Gilda per trattarli."
    attributi: { fisico: 1, sociale: 2, mentale: 2 }
    abilita: { persuasione: 3, percezione: 3, politica-ed-economia: 2, ingannare: 1, empatia: 1 }
    quality: { monete: 40, licenza-gilda: 1, rep.gilda: 2 }
    arma: pugnale
    armatura: nessuna

  - id: figlio-del-circolo
    immagine: fazioni/circolo-di-velthar
    nome: Figlio del Circolo
    testo: "Il Circolo ti ha insegnato ad ascoltare il Bosco di Velthar. In città c'è più rumore, e bisogna ascoltare con più attenzione."
    attributi: { fisico: 2, sociale: 1, mentale: 2 }
    abilita: { natura: 3, addestrare-animali: 3, percezione: 2, magia: 1, armi-da-distanza: 1 }
    quality: { monete: 10, rep.circolo: 2, unguento: 1, incantesimo.richiamo: 1 }
    arma: arco-corto
    armatura: nessuna

  - id: fuggiasco-di-ghoran
    immagine: ambientazione/ghoran
    nome: Fuggiasco di Ghoran
    testo: "A Ghoran gli schiavi si vendono a peso. Sei già salito una volta su quella bilancia, e sei scappato per non salirci più."
    attributi: { fisico: 3, sociale: 1, mentale: 1 }
    abilita: { resistenza: 3, intimidire: 3, rissa: 2, atletica: 1, armi-da-mischia: 1 }
    quality: { monete: 5 }
    arma: mani-nude
    armatura: nessuna

  - id: allievo-di-torvessa
    nome: Allievo di Torvessa
    immagine: ambientazione/accademia-di-torvessa
    testo: "Studi all'Accademia con Orvald Temmerin, che raramente risponde due volte alla stessa domanda. Conosci le prime formule dei cristalli e sai quanto poco se ne capisce ancora."
    attributi: { fisico: 1, sociale: 1, mentale: 3 }
    abilita: { magia: 3, accademiche: 3, percezione: 2, tecnologia: 1, resilienza: 1 }
    quality: { monete: 15, invito: 1, incantesimo.dardo: 1, incantesimo.luce-fredda: 1 }
    arma: mani-nude
    armatura: nessuna
