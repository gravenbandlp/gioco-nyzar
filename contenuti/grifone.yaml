storylet:
  - id: grifone-liaren
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Il Grifone di Ferro dopo la razzia
    sommario: "La locanda più antica di Qir-Azel ha ancora le finestre inchiodate. Liaren Tarvelin si ricorda di chi era in piazza."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    requisiti: [prologo == 0, conosci.liaren == 0]
    testo: |
      Il Grifone di Ferro sta a metà del Ponte delle Mille Corde, su una
      piattaforma larga quanto una piazza. È la locanda più antica di
      Qir-Azel, e sul tetto c'è ancora il grifone arrugginito che un tempo
      faceva anche da parafulmine. Tre giorni fa gli orchi sono arrivati fin
      qui. Due finestre della facciata sono chiuse con assi inchiodate di
      traverso, e sulla soglia c'è una bruciatura nera che nessuno ha ancora
      raschiato via. Dentro manca metà dei tavoli, perché quelli spaccati
      sono finiti a pezzi accanto al camino.

      Liaren Tarvelin ti vede entrare e posa il boccale che stava asciugando.
      È una donna giovane dalla pelle scura, con i tatuaggi sulle braccia e i
      capelli raccolti in alto. Anni fa ha lasciato il Casato Tarvelin per
      andare all'avventura, e al ritorno si è comprata questa locanda con il
      bottino. Suo padre non gliel'ha mai perdonato.

      «Tu c'eri» dice, e ti dà del tu come fa con tutti. «Quando sono
      arrivati gli orchi eri là in mezzo, me l'hanno detto in tre. Qui chi ha
      difeso la città non dorme per strada.» Ti indica le scale. «E tieni a mente la regola della casa.
      A chi mi racconta una bella storia d'avventura faccio lo sconto sulla
      stanza, e la prima pinta la offro io.»

      Brunella Fennick, una halfling anziana con il grembiule, ti mette
      davanti una scodella di zuppa senza chiederti niente, e al primo
      odore lo stomaco ti si stringe tanto da farti capire che non ricordi
      l'ultima volta che hai mangiato seduto. «Mangia» dice. «Poi parla.»
    opzioni:
      - testo: "Accettare la branda"
        descrizione: "Liaren ti offre un letto per una settimana e non chiede niente in cambio."
        esito:
          titolo: Una branda sotto il tetto
          testo: |
            Brunella ti accompagna al piano di sopra, in una stanza stretta con
            due brande e un catino. La finestra dà sul vuoto della Cicatrice e
            il vento fa battere le imposte tutta la notte. Sul cuscino trovi una
            coperta di lana piegata con cura, e quando ti ci stendi sopra le
            gambe ti presentano in una volta sola il conto degli ultimi giorni.

            Dormi fino a tardi. Quando scendi, Liaren sta discutendo con un
            fornitore sul prezzo delle botti e ti saluta con un cenno del mento
            senza interrompersi. Sul registro, accanto al tuo nome, sono
            segnate sette notti.
          imposta: { conosci.liaren: 1 }
      - testo: "Dare una mano a rimettere in piedi la sala"
        descrizione: "Le assi alle finestre vanno fissate meglio, e i tavoli rotti vanno sostituiti con quelli del magazzino."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Tavoli nuovi
          testo: |
            Passi la mattina con un martello in mano e i chiodi fra le labbra.
            Con due Raschiatori nel loro giorno di riposo raddrizzi le assi alle
            finestre, poi trascini su dal magazzino i tavoli vecchi che Liaren
            teneva per l'inverno. A mezzogiorno la sala ha di nuovo l'aria di
            una locanda.

            Liaren passa lo straccio su un tavolo e ci batte sopra le nocche.
            «Una notte in più sul registro, e la zuppa di Brunella quando vuoi» dice. Mentre
            rimettete a posto le sedie, uno dei Raschiatori ti racconta a bassa
            voce che la mattina del Festival, poche ore prima degli orchi,
            Liaren ha rovesciato un pentolone di stufato in testa a suo padre.
          imposta: { conosci.liaren: 1 }
          effetti: { alloggio.grifone: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il pollice
          testo: |
            La prima asse la inchiodi storta. La seconda ti scivola di mano e
            finisce giù nella Cicatrice, e alla terza ti prendi il pollice sotto
            il martello. Brunella ti toglie l'attrezzo e ti fa sedere su uno
            sgabello, poi ti fascia il dito stringendo forte. «Il martello si
            tiene dal fondo del manico» dice, e stringe ancora un giro.

            Liaren ride dal bancone e ti manda di sopra a riposare, mentre
            Brunella rimette il martello nella cassetta degli attrezzi.
          imposta: { conosci.liaren: 1 }
          effetti: { ferite: 0.5 }

  - id: una-notte-al-grifone
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Una notte al Grifone
    sommario: "Una branda al piano di sopra, il vento fra le corde e il samisen di Liaren che arriva dalla sala."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    ripetibile: true
    requisiti: [conosci.liaren >= 1]
    testo: |
      La sera il Grifone si riempie di Raschiatori che tornano dal turno e di
      mercanti che hanno chiuso i banchi sul Mercato dei Nodi. Brunella gira
      fra i tavoli con la zuppa, e dalle finestre inchiodate passa uno
      spiffero che fa tremare le lanterne. In fondo alla sala Liaren accorda
      il samisen.

      Al piano di sopra le stanze sono strette e hanno il pavimento di assi,
      ma le coperte sono pulite, e su ogni porta qualcuno ha scritto a gesso
      il nome di un animale al posto del numero. Dalla finestra si sente il vento che passa fra le corde del
      ponte.
    opzioni:
      - testo: "Salire nella stanza già pagata"
        descrizione: "Hai ancora una notte sul registro di Liaren. Ti basta salire le scale."
        requisiti: [alloggio.grifone >= 1]
        esito:
          titolo: Il samisen dal piano di sotto
          testo: |
            Ti addormenti mentre Liaren suona ancora, e la musica arriva
            attutita dalle assi del pavimento. Ti svegli a giorno fatto.
            Qualcuno ha lasciato sul catino un pezzo di pane e una mela.
            Scendendo le scale ti accorgi che le ferite tirano meno e che hai la
            testa più sgombra di ieri.
          effetti: { alloggio.grifone: -1, ferite: -1, tormento: -0.5 }
      - testo: "Pagare la stanza"
        descrizione: "Sette monete per una branda e la colazione. Nestor Gramm ricuce in un'ora e costa di più, qui ci vuole una notte intera."
        requisiti: [alloggio.grifone == 0, monete >= 7]
        esito:
          titolo: Sette monete
          testo: |
            Brunella conta le monete sul palmo e ti porge la chiave. Nella
            stanza accanto dorme una squadra di Raschiatori che russano a turno,
            e fino a mezzanotte fatichi a prendere sonno. Poi dormi di un sonno
            pesante fino all'alba. A colazione Brunella ti mette davanti le uova
            prima che tu le chieda.
          effetti: { monete: -7, ferite: -1, tormento: -0.5 }

  - id: storie-per-liaren
    presso: grifone-di-ferro
    immagine: personaggi/liaren-tarvelin
    titolo: Una storia per Liaren
    sommario: "Al Grifone chi racconta bene una storia dorme a spese della casa, e la sala dice la sua ad alta voce."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    ripetibile: true
    requisiti: [racconto >= 1, conosci.liaren >= 1]
    testo: |
      A tarda sera, quando la sala è piena e il fuoco è basso, Liaren si
      appoggia il samisen sulle ginocchia e batte due colpi sul bancone con
      il mestolo. «Allora, chi ha una storia? Una vera, o almeno una bella»
      chiede.

      Qualche Raschiatore si gira sulla sedia per vederti meglio, e al suo
      tavolo anche Dragna posa la penna, cosa che ti secca la bocca più di
      tutti gli altri sguardi messi insieme. Hai in mente qualcosa che hai visto
      o fatto nei giorni scorsi, e secondo te vale una pinta. Chi si
      impappina qui se lo sente ricordare fino alla chiusura. A chi racconta
      bene Liaren offre la pinta e fa lo sconto sulla stanza.
    opzioni:
      - testo: "Raccontare quello che hai vissuto"
        descrizione: "Racconti com'è andata, e se serve la migliori un poco. Al Grifone nessuno va a controllare."
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: Una pinta offerta
          testo: |
            Cominci piano, con una voce che all'inizio esce più sottile di come
            la ricordavi, e la sala si zittisce prima di quanto speravi. Al
            momento giusto Liaren pizzica una corda del samisen, e più avanti
            un'altra. Quando arrivi alla fine un Raschiatore batte il boccale
            sul tavolo, e dopo di lui lo fanno tutti.

            Liaren ti spinge davanti una pinta e segna due notti sul registro.
            Per il resto della sera senti la tua storia passare di tavolo in
            tavolo, e a ogni passaggio qualcuno ci aggiunge un dettaglio.
          effetti: { racconto: -1, alloggio.grifone: 2 }
        fallimento:
          titolo: La sala ride
          testo: |
            Perdi il filo a metà e lo ritrovi troppo tardi, quando hai già
            svelato la fine. Da un tavolo in fondo qualcuno ti chiede se sai
            anche come comincia, e la sala scoppia a ridere. Liaren si copre la
            bocca con la mano.

            Ti versa mezza pinta lo stesso. «La storia era buona» dice. «Un'altra
            sera la racconti dall'inizio.» Sul registro ti segna una notte.
          effetti: { racconto: -1, alloggio.grifone: 1 }

  - id: il-tavolo-d-angolo
    presso: grifone-di-ferro
    immagine: personaggi/gaia-acari
    titolo: Il tavolo d'angolo
    sommario: "Una ragazzina col cappuccio blu scuro siede ogni sera vicino alla cucina e guarda chi entra."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    requisiti: [conosci.liaren >= 1, gaia == 0]
    testo: |
      Da qualche sera, al tavolo d'angolo vicino alla porta della cucina,
      siede una ragazzina con un cappuccio blu scuro calato su metà del viso.
      Ha le lentiggini e una tunica troppo larga, e davanti un boccale di
      latte caldo che Brunella le porta senza farle pagare. Lo lascia
      raffreddare e lo beve a piccoli sorsi. Intanto guarda chi entra e chi
      esce, e quando incroci il suo sguardo lo regge.

      Brunella ti dice che si chiama Gaia Acari e che viene dalla Città
      Bassa. «Ha fame più spesso di quanto dica» aggiunge, e torna ai
      fornelli. Liaren è meno tenera. Secondo lei Gaia corre fra i tavoli
      della Pignatta Grassa per conto di gente con cui è meglio evitare i
      debiti, e al Grifone la lascia sedere perché fuori fa freddo.

      Stasera Gaia tiene i piedi appoggiati sulla sedia di fronte. Sul
      tavolo, accanto al boccale, c'è un foglio piegato in quattro che ogni
      tanto tocca con la punta delle dita. Quando passi vicino al suo tavolo
      ti chiama per nome, anche se tu non gliel'hai mai detto. *Gliel'avrà
      detto Brunella.* La nuca però ti formicola lo stesso, e ti fermi.
    opzioni:
      - testo: "Sederti al suo tavolo e parlarle"
        descrizione: "Le chiedi chi sta aspettando. Gaia ha la lingua svelta e si diverte a usarla sugli adulti."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Due chiacchiere
          testo: |
            Gaia ti lascia sedere solo dopo averti squadrato dalla testa ai
            piedi. Ti prende in giro per le scarpe e per l'accento, e quando
            capisci che è il suo modo di fare conversazione comincia a parlare
            sul serio. Sa quanti Raschiatori sono scesi stamattina e quanti
            sono risaliti, e chi al Mercato dei Nodi ha alzato i prezzi dopo la
            razzia.

            Te lo dice come si fa un regalo, e ti fa capire che se ne ricorderà.
            Intanto il foglio piegato è sparito dentro la tunica.
          imposta: { gaia: 1 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Presa in giro
          testo: |
            Gaia ti ascolta con la testa inclinata, poi ripete la tua domanda ad
            alta voce imitando il tuo tono così bene che il tavolo accanto
            scoppia a ridere. «Chi aspetto? Di sicuro non te» dice. Si alza,
            lascia il latte a metà ed esce senza voltarsi.

            Un Raschiatore ti consiglia di stare attento a quello che domani
            sera si racconterà di te alla Pignatta.
          imposta: { gaia: 1 }
          effetti: { sospetto: 0.5 }
      - testo: "Fingere di non averla notata e tenerla d'occhio"
        descrizione: "Ti siedi al bancone di spalle a lei e aspetti che sia lei a distrarsi."
        prova: { attributo: mentale, abilita: percezione, difficolta: Difficile }
        successo:
          titolo: Il foglio piegato
          testo: |
            La guardi nello specchio appannato dietro le bottiglie. Per un'ora
            Gaia si limita a bere il suo latte. Poi un Raschiatore urta il suo
            tavolo passando, e il foglio scivola a terra e si apre per metà
            prima che lei lo raccolga.

            Fai in tempo a vedere un sigillo di cera rossa spezzato, con lo
            stemma della Caserma. Sul bordo della carta c'è il cerchio
            giallastro lasciato da un boccale di sidro torbido, e quel sidro lo
            hai sentito servire soltanto alla Pignatta Grassa. Gaia rimette il
            foglio nella tunica e per il resto della sera guarda solo il suo
            boccale.
          imposta: { gaia: 2 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Chi guarda chi
          testo: |
            La guardi una volta di troppo. Gaia alza il boccale verso di te in
            un brindisi, poi si punta due dita sotto gli occhi e le gira verso
            di te, in modo che tutta la sala capisca. Qualcuno ride. Per il
            resto della sera sei tu quello tenuto d'occhio, e ogni volta che
            alzi la testa la trovi a guardarti.
          imposta: { gaia: 1 }
          effetti: { sospetto: 0.5 }
      - testo: "Farla parlare con un inganno"
        descrizione: "Le dici che alla Pignatta ti hanno mandato a ritirare il suo foglio, e guardi cosa fa."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Difficile }
        successo:
          titolo: La mano sulla tunica
          testo: |
            Gaia ti fissa un momento prima di ridere. «Alla Pignatta
            mandano me a ritirare le cose» dice. Intanto però la sua mano è
            corsa alla tunica, e nel gesto il foglio è uscito per metà. Sopra
            c'è il sigillo di cera della Caserma, e sul bordo il cerchio
            giallastro di un boccale di sidro torbido, quello della Pignatta
            Grassa.

            Gaia se ne accorge e lo rimette a posto. Poi, per farti capire che
            di te non ha paura, ti racconta quello che si dice di te alla
            Pignatta, e anche un paio di cose che si dicono di altri.
          imposta: { gaia: 2 }
          effetti: { informazioni.pettegolezzo: 2, sospetto: 0.5 }
        fallimento:
          titolo: Una bugia di troppo
          testo: |
            Gaia ti lascia finire la frase, poi chiama Brunella ad alta voce e
            le chiede se alla Pignatta Grassa hanno mai mandato qualcuno a
            ritirare qualcosa da lei. Brunella sospira e torna ai fornelli.

            La sala ride e Gaia esce con il suo foglio. Prima di mezzanotte la
            storia della tua bugia, con il tuo nome, è già arrivata alla
            Pignatta Grassa.
          imposta: { gaia: 1 }
          effetti: { scandalo: 0.5, sospetto: 0.5 }

  - id: brunella-in-cucina
    presso: grifone-di-ferro
    immagine: personaggi/brunella-fennick
    titolo: In cucina con Brunella
    sommario: "Brunella Fennick lavora dall'alba al tramonto e accetta volentieri due mani in più."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    ripetibile: true
    requisiti: [conosci.liaren >= 1]
    testo: |
      La cucina del Grifone è una stanza bassa alle spalle del bancone, e
      appena ti affacci il caldo ti si appiccica alla faccia e alle ciglia. Ci
      sono due fornelli e un pentolone che bolle dall'alba. Da quando gli orchi hanno
      bruciato la tettoia sul retro la legna si tiene qui dentro, e lo spazio
      per muoversi si è dimezzato.

      Brunella Fennick ci lavora con i capelli bianchi raccolti in un nodo
      basso e il grembiule sempre pulito. Si muove svelta fra i fornelli e il
      tavolo, e prende le cose senza guardare dove le ha messe. Quando ti affacci alla porta ti porge un coltello dalla
      parte del manico e ti indica un cesto di cipolle. Poi, con il mento, ti
      indica anche i piatti pronti da portare in sala.
    opzioni:
      - testo: "Restare ai fornelli"
        descrizione: "Cipolle da tagliare e un pentolone da girare, nel caldo della cucina."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Facile }
        successo:
          titolo: Una scodella a fine turno
          testo: |
            Tagli cipolle finché ti lacrimano gli occhi e poi continui.
            Brunella ti corregge la presa del coltello spostandoti le dita con
            le sue. «Nocche in fuori, se alle dita ci tieni» dice, senza
            smettere di girare il pentolone. A fine servizio ti fa sedere su una cassa e ti mette in mano
            una scodella di stufato speziato, con due monete sul bordo. Mentre
            mangi ti ripete quello che ha sentito ai tavoli, perché Brunella
            ascolta tutto e si ricorda ogni faccia.
          effetti: { monete: 2, informazioni.voce: 1 }
        fallimento:
          titolo: Il fondo bruciato
          testo: |
            Lasci attaccare il fondo del pentolone e la cucina si riempie di
            fumo. Brunella ti toglie il mestolo di mano e apre la finestrella
            per far uscire il fumo. Poi salva quello che si può salvare e ti fa
            mangiare lo stesso, seduto su una cassa accanto alla porta.
          effetti: {}
      - testo: "Portare i piatti in sala"
        descrizione: "Scodelle calde da portare ai tavoli giusti, e orecchie aperte fra una sedia e l'altra."
        prova: { attributo: sociale, abilita: [galateo, espressivita], difficolta: Facile }
        successo:
          titolo: Il giro dei tavoli
          testo: |
            Porti fuori le scodelle due alla volta e ti fermi a ogni tavolo il
            tempo che basta. Un mercante ti lascia una moneta di mancia, e un
            Raschiatore te ne lascia un'altra perché l'hai servito prima del suo
            caposquadra. A fine sera Brunella ti fa mangiare in cucina, e fra un
            boccone e l'altro metti in fila quello che hai sentito passando fra
            le sedie.
          effetti: { monete: 2, informazioni.voce: 1 }
        fallimento:
          titolo: Il piatto sbagliato
          testo: |
            Scambi due ordinazioni, e un Raschiatore si trova davanti la zuppa
            di verdure al posto della carne. «Ho la faccia di uno che mangia
            verdure?» chiede alla sala, che dopo averlo guardato decide di no.
            Brunella sistema tutto con un sorriso e una porzione più abbondante,
            e a te la cena la serve in cucina senza commenti.
          effetti: {}
