storylet:
  - id: grifone-liaren
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Il Grifone di Ferro dopo la razzia
    sommario: "La locanda più antica di Qir-Azel ha ancora le finestre inchiodate, e Liaren Tarvelin si ricorda di chi ha difeso la città."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    # Liaren è sparita con pista.acciaio da 1 a 4 e a letto ferita a 5 (piste/acciaio-*.yaml).
    requisiti: [prologo == 0, conosci.liaren == 0, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      Il Grifone di Ferro sta a metà del Ponte delle Mille Corde, su una
      piattaforma larga quanto una piazza. La sera della razzia gli orchi sono
      arrivati fin qui, e due finestre sono ancora sbarrate con assi di
      traverso; i tavoli spaccati bruciano nel camino.

      Liaren Tarvelin ti vede entrare e posa il boccale. È giovane, con la
      pelle scura e i tatuaggi sulle braccia; anni fa ha lasciato il Casato
      Tarvelin per andare all'avventura e con il bottino si è comprata questa
      locanda, cosa che suo padre non le ha mai perdonato.

      {origine rampollo-dei-quartieri-alti} Nei salotti dei Quartieri Alti si
      parla di Liaren a bassa voce, come di una parente caduta in disgrazia;
      da vicino sembra la persona più contenta della sala.

      «Tu c'eri» dice, e ti dà del tu come a tutti. «Quando sono arrivati gli
      orchi eri là in mezzo, me l'hanno detto in tre. Qui chi ha difeso la
      città non dorme per strada, e a chi mi racconta una bella storia faccio
      lo sconto sulla stanza.»

      {origine fuggiasco-di-ghoran} A Ghoran un letto offerto gratis voleva
      dire che il prezzo arrivava dopo, e cerchi con gli occhi chi verrà a
      riscuoterlo.

      Brunella Fennick, una halfling anziana col grembiule, ti mette davanti
      una scodella di zuppa e non se ne va finché non prendi il cucchiaio.
    opzioni:
      - testo: "Accettare la branda"
        descrizione: "Liaren ti offre un letto per una settimana e non chiede niente in cambio."
        esito:
          titolo: Una branda sotto il tetto
          testo: |
            Brunella ti accompagna in una stanza stretta con una finestra sul
            vuoto della Cicatrice, e appena ti stendi le gambe ti presentano il
            conto degli ultimi giorni. Sul registro, accanto al tuo nome, sono
            segnate sette notti. A colazione Brunella ti racconta, senza nessun
            dispiacere, che la mattina del Festival Liaren ha rovesciato un
            pentolone di stufato in testa a suo padre.
          imposta: { conosci.liaren: 1 }
      - testo: "Dare una mano a rimettere in piedi la sala"
        descrizione: "Le assi alle finestre vanno fissate meglio, e i tavoli rotti vanno sostituiti con quelli del magazzino."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Tavoli nuovi
          testo: |
            Passi la mattina con i chiodi fra le labbra a raddrizzare le assi
            insieme a due Raschiatori a riposo, e a mezzogiorno la sala ha di
            nuovo l'aria di una locanda.

            «Una notte in più sul registro, e la zuppa di Brunella quando vuoi»
            dice Liaren. Un Raschiatore ti racconta che la mattina del Festival
            Liaren ha rovesciato un pentolone di stufato in testa a suo padre.
          imposta: { conosci.liaren: 1 }
          effetti: { alloggio.grifone: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il pollice
          testo: |
            Inchiodi storta la prima asse, la seconda finisce nella Cicatrice e
            con la terza ti prendi il pollice sotto il martello. Brunella ti
            toglie l'attrezzo e ti fascia il dito. «Il martello si tiene dal fondo
            del manico» dice, mentre Liaren ride dal bancone.

            Un Raschiatore ti consola raccontandoti che la mattina del Festival la
            padrona ha rovesciato un pentolone di stufato in testa a suo padre.
          imposta: { conosci.liaren: 1 }
          effetti: { ferite: 0.5 }

  - id: una-notte-al-grifone
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Una notte al Grifone
    sommario: "Una branda al piano di sopra, il vento fra le corde e il samisen di Liaren che arriva dalla sala."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    ripetibile: true
    requisiti: [conosci.liaren >= 1, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      La sera il Grifone si riempie di Raschiatori di ritorno dal turno e di
      mercanti del Mercato dei Nodi, e in fondo alla sala Liaren accorda il
      samisen una corda alla volta. Al piano di sopra, su ogni porta c'è il
      nome di un animale al posto del numero; sulla tua c'è un tasso.

      {origine figlio-del-circolo} Il vento fra le corde del ponte lo ascolti
      come ascoltavi il Bosco di Velthar, e ti addormenti prima di capire che
      cosa dice.

      {espressivita Facile} Accorda più a lungo del necessario, e intanto la
      sala abbassa la voce da sola.
    opzioni:
      - testo: "Salire nella stanza già pagata"
        descrizione: "Hai ancora una notte sul registro di Liaren. Ti basta salire le scale."
        requisiti: [alloggio.grifone >= 1]
        esito:
          titolo: Il samisen dal piano di sotto
          testo: |
            Ti addormenti mentre Liaren suona ancora, con la musica attutita dalle
            assi del pavimento, e ti svegli a giorno fatto. Qualcuno ha lasciato
            sul catino un pezzo di pane e una mela. Scendendo ti accorgi che le
            ferite tirano meno e che hai la testa più sgombra di ieri.
          effetti: { alloggio.grifone: -1, ferite: -1, tormento: -0.5 }
      - testo: "Pagare la stanza"
        descrizione: "Una branda e la colazione a poco prezzo; alla Dispensa di Gramm costa di più, ma basta un'ora."
        requisiti: [alloggio.grifone == 0, monete >= 7]
        esito:
          titolo: La chiave di Brunella
          testo: |
            Brunella conta le monete sul palmo e ti porge la chiave. Nella stanza
            accanto una squadra di Raschiatori russa a turno fino a mezzanotte,
            poi dormi di un sonno pesante fino all'alba. A colazione Brunella ti
            mette davanti le uova prima che tu le chieda.
          effetti: { monete: -7, ferite: -1, tormento: -0.5 }

  # La stessa notte mentre Liaren non c'è (pista.acciaio da 1 a 4) o è a letto ferita (5).
  - id: una-notte-al-grifone-senza-liaren
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Una notte al Grifone
    sommario: "Una branda al piano di sopra e il vento fra le corde, mentre il samisen di Liaren resta appeso al muro."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    ripetibile: true
    requisiti: [conosci.liaren >= 1, pista.acciaio >= 1, pista.acciaio <= 5]
    testo: |
      La sera il Grifone si riempie di Raschiatori e di mercanti del Mercato
      dei Nodi. Il bancone lo tiene Brunella da sola, e il samisen di Liaren è
      appeso al suo chiodo dietro le bottiglie. Nessuno lo nomina, ma più di
      un Raschiatore lo guarda sopra il boccale.

      {origine mercante-dei-ponti} Metà dei mercanti li conosci di vista, e
      stasera nessuno parla di prezzi, che fra mercanti è il modo educato di
      parlare d'altro.

      {percezione Facile} Qualcuno ha spolverato il samisen da poco, mentre il
      chiodo intorno è grigio di polvere.
    opzioni:
      - testo: "Salire nella stanza già pagata"
        descrizione: "Hai ancora una notte sul registro del Grifone, e ti basta salire le scale."
        requisiti: [alloggio.grifone >= 1]
        esito:
          titolo: Il vento fra le corde
          testo: |
            Ti addormenti con il vento che fa cantare le corde del ponte e ti
            svegli a giorno fatto. Sul catino qualcuno ha lasciato un pezzo di
            pane e una mela lucidata sul grembiule. Scendendo ti accorgi che le
            ferite tirano meno e che hai la testa più sgombra di ieri.
          effetti: { alloggio.grifone: -1, ferite: -1, tormento: -0.5 }
      - testo: "Pagare la stanza"
        descrizione: "Una branda e la colazione a poco prezzo; Nestor Gramm costa di più, ma ricuce in un'ora."
        requisiti: [alloggio.grifone == 0, monete >= 7]
        esito:
          titolo: La chiave di Brunella
          testo: |
            Brunella conta le monete sul palmo e ti porge la chiave. Nella stanza
            accanto una squadra di Raschiatori russa a turno fino a mezzanotte,
            poi dormi di un sonno pesante fino all'alba. A colazione Brunella ti
            mette davanti le uova e intanto guarda la porta ogni volta che si
            apre.
          effetti: { monete: -7, ferite: -1, tormento: -0.5 }

  - id: storie-per-liaren
    presso: grifone-di-ferro
    immagine: personaggi/liaren-tarvelin
    titolo: Una storia per Liaren
    sommario: "Al Grifone chi racconta bene una storia dorme a spese della casa, e la sala dice la sua ad alta voce."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    ripetibile: true
    requisiti: [racconto >= 1, conosci.liaren >= 1, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      A tarda sera Liaren batte due colpi sul bancone con il mestolo, il
      samisen già sulle ginocchia. «Allora, chi ha una storia? Una vera, o
      almeno una bella» chiede. Qualche Raschiatore si gira sulla sedia, e al
      suo tavolo anche Dragna posa la penna. A chi racconta bene Liaren offre
      la pinta e lo sconto sulla stanza.

      {origine apprendista-raschiatore} Le reclute sanno che Dragna rimanda al
      lavoro chi racconta storie lunghe, e tu tagli la tua di un terzo.

      {espressivita Media} Comincia dal punto in cui avevi paura; questa sala
      la paura la conosce di persona.
    opzioni:
      - testo: "Raccontare quello che hai vissuto"
        descrizione: "Racconti com'è andata, e se serve la migliori un poco. Al Grifone nessuno va a controllare."
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: Una pinta offerta
          testo: |
            Cominci piano, e la sala si zittisce prima di quanto speravi. Al
            momento giusto Liaren pizzica una corda del samisen, e alla fine un
            Raschiatore batte il boccale sul tavolo e dopo di lui lo fanno tutti.
            Liaren ti spinge davanti una pinta e segna due notti sul registro.
            Verso mezzanotte, a sentirla dal bancone, i nemici erano il doppio e
            tu li hai affrontati a mani nude.
          effetti: { racconto: -1, alloggio.grifone: 2 }
        fallimento:
          titolo: La sala ride
          testo: |
            Perdi il filo a metà e lo ritrovi quando hai già svelato la fine, e da
            un tavolo in fondo qualcuno ti chiede se sai anche come comincia. La
            sala scoppia a ridere, e Liaren si copre la bocca con la mano. Ti
            versa mezza pinta lo stesso. «La storia era buona» dice. «Un'altra
            sera la racconti dall'inizio.» Sul registro ti segna una notte.
          effetti: { racconto: -1, alloggio.grifone: 1 }

  - id: il-tavolo-d-angolo
    presso: grifone-di-ferro
    immagine: personaggi/gaia-acari
    titolo: Il tavolo d'angolo
    sommario: "Una ragazzina col cappuccio blu scuro siede ogni sera vicino alla cucina e guarda chi entra."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    # Gaia lavora per la Pignatta, che brucia a pista.pelle 6; Liaren ne parla di persona.
    requisiti: [conosci.liaren >= 1, gaia == 0, pista.pelle < 6, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      Da qualche sera, al tavolo d'angolo vicino alla cucina, una ragazzina
      col cappuccio blu scuro fa durare a piccoli sorsi il latte caldo che
      Brunella le porta gratis.

      Brunella dice che si chiama Gaia Acari, viene dalla Città Bassa e ha
      fame più spesso di quanto dica; secondo Liaren corre fra i tavoli
      della Pignatta Grassa per gente con cui è meglio non avere debiti.

      {origine figlio-della-citta-bassa} Ragazzine così correvano fra i
      tavoli della Città Bassa per tutta la tua infanzia, e hai imparato
      presto a non chiedere per chi.

      Accanto al boccale c'è un foglio piegato in quattro che ogni tanto
      tocca con un dito. Quando le passi vicino ti chiama per nome, che tu
      non le hai mai detto.

      {conoscenze-della-strada Media} Si è seduta con la schiena al muro,
      dove vede insieme la porta e la cucina, al tavolo di chi lavora.
    opzioni:
      - testo: "Sederti al suo tavolo e parlarle"
        descrizione: "Le chiedi chi sta aspettando. Gaia ha la lingua svelta e si diverte a usarla sugli adulti."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Due chiacchiere
          testo: |
            Gaia ti lascia sedere solo dopo averti squadrato e preso in giro per
            le scarpe e per l'accento, poi comincia a parlare sul serio. Sa quanti
            Raschiatori sono scesi stamattina e quanti sono risaliti, e chi al
            Mercato dei Nodi ha alzato i prezzi dopo la razzia. Te lo dice come si
            fa un regalo, e intanto il foglio piegato è sparito dentro la tunica.
          imposta: { gaia: 1 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Presa in giro
          testo: |
            Gaia ripete la tua domanda ad alta voce imitando il tuo tono così bene
            che il tavolo accanto scoppia a ridere. «Chi aspetto? Di sicuro non
            te» dice, e se ne va lasciando il latte a metà. Un Raschiatore ti
            consiglia di stare attento a quello che domani sera si racconterà di
            te alla Pignatta.
          imposta: { gaia: 1 }
          effetti: { sospetto: 1 }
      - testo: "Fingere di non averla notata e tenerla d'occhio"
        descrizione: "Ti siedi al bancone di spalle a lei e aspetti che sia lei a distrarsi."
        prova: { attributo: mentale, abilita: percezione, difficolta: Difficile }
        successo:
          titolo: Il foglio piegato
          testo: |
            La guardi nello specchio dietro le bottiglie. Dopo un'ora un
            Raschiatore urta il suo tavolo e il foglio cade aperto a metà, e prima
            che lei lo raccolga vedi il sigillo di cera della Caserma e sul bordo
            il cerchio giallastro di un boccale di sidro torbido, quello della
            Pignatta Grassa.

            {politica-ed-economia Difficile} Fra la Caserma e la Pignatta, la
            ragazzina sta nel mezzo.
          imposta: { gaia: 2 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Chi guarda chi
          testo: |
            La guardi una volta di troppo. Gaia si punta due dita sotto gli occhi
            e le gira verso di te, in modo che tutta la sala capisca, e per il
            resto della sera sei tu quello tenuto d'occhio.
          imposta: { gaia: 1 }
          effetti: { sospetto: 1 }
      - testo: "Farla parlare con un inganno"
        descrizione: "Le dici che alla Pignatta ti hanno mandato a ritirare il suo foglio, e guardi cosa fa."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Difficile }
        successo:
          titolo: La mano sulla tunica
          testo: |
            «Alla Pignatta mandano me a ritirare le cose» ride Gaia, ma la sua
            mano è già corsa alla tunica e il foglio ne è uscito per metà, con il
            sigillo di cera della Caserma e sul bordo il cerchio giallastro di un
            boccale di sidro torbido della Pignatta Grassa. Lo rimette via, poi ti
            racconta cosa si dice di te alla Pignatta.
          imposta: { gaia: 2 }
          effetti: { informazioni.pettegolezzo: 2, sospetto: 1 }
        fallimento:
          titolo: Una bugia di troppo
          testo: |
            Gaia ti lascia finire, poi chiama Brunella ad alta voce e le chiede se
            alla Pignatta Grassa hanno mai mandato qualcuno a ritirare qualcosa da
            lei. La sala ride e Gaia esce con il suo foglio. Prima di mezzanotte
            la storia della tua bugia, con il tuo nome, è già arrivata alla
            Pignatta.
          imposta: { gaia: 1 }
          effetti: { scandalo: 1, sospetto: 1 }

  - id: brunella-in-cucina
    presso: grifone-di-ferro
    immagine: personaggi/brunella-fennick
    titolo: In cucina con Brunella
    sommario: "Brunella Fennick lavora dall'alba al tramonto e accetta volentieri due mani in più."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    ripetibile: true
    requisiti: [conosci.liaren >= 1]
    testo: |
      La cucina del Grifone è una stanza bassa dietro il bancone, dove un
      pentolone bolle dall'alba e, da quando gli orchi hanno bruciato la
      tettoia sul retro, si tiene anche la legna.

      Brunella Fennick, con i capelli bianchi raccolti in un nodo basso,
      prende le cose senza guardare dove le ha messe. Quando ti affacci ti
      porge un coltello e ti indica un cesto di cipolle e i piatti da portare
      in sala.

      {armi-da-mischia Facile} Lo porge con la lama verso di sé, come fra
      gente che di coltelli se ne intende.
    opzioni:
      - testo: "Restare ai fornelli"
        descrizione: "Cipolle da tagliare e un pentolone da girare, nel caldo della cucina."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Facile }
        successo:
          titolo: Una scodella a fine turno
          testo: |
            Tagli cipolle finché ti lacrimano gli occhi. Brunella ti corregge la
            presa spostandoti le dita con le sue. «Nocche in fuori, se alle dita
            ci tieni» dice. A fine servizio ti mette in mano una scodella di
            stufato speziato con qualche moneta sul bordo, e mentre mangi ti
            ripete quello che ha sentito ai tavoli, perché Brunella ascolta tutto
            e si ricorda ogni faccia.
          effetti: { monete: 2, informazioni.voce: 1 }
        fallimento:
          titolo: Il fondo bruciato
          testo: |
            Lasci attaccare il fondo del pentolone e la cucina si riempie di fumo.
            Brunella ti toglie il mestolo e apre la finestrella agitando un
            canovaccio, poi salva quello che si può e ti fa mangiare lo stesso,
            seduto su una cassa. Il fondo bruciato lo mangia lei, perché dice che
            le piace.
          effetti: {}
      - testo: "Portare i piatti in sala"
        descrizione: "Scodelle calde da portare ai tavoli giusti, e orecchie aperte fra una sedia e l'altra."
        prova: { attributo: sociale, abilita: [galateo, espressivita], difficolta: Facile }
        successo:
          titolo: Il giro dei tavoli
          testo: |
            Porti fuori le scodelle due alla volta e ti fermi a ogni tavolo il
            tempo che basta. Un mercante ti lascia una mancia, e un Raschiatore
            un'altra perché l'hai servito prima del suo caposquadra. A fine sera
            Brunella ti fa mangiare in cucina, e intanto metti in fila quello che
            hai sentito passando fra le sedie.
          effetti: { monete: 2, informazioni.voce: 1 }
        fallimento:
          titolo: Il piatto sbagliato
          testo: |
            Scambi due ordinazioni, e un Raschiatore si trova davanti la zuppa di
            verdure al posto della carne. «Ho la faccia di uno che mangia
            verdure?» chiede alla sala. Brunella sistema tutto con una porzione
            più abbondante, e le verdure avanzate finiscono nel tuo piatto.
          effetti: {}
