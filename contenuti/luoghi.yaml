# Luoghi: i mini-hub dei quartieri. Ogni luogo raccoglie le storie che vi accadono (campo `presso` negli
# storylet) e le botteghe che vi si aprono. Le storie senza luogo restano "in giro per il quartiere".
# I testi presentano il posto com'è sempre: niente fatti recenti, che invecchiano.

luoghi:
  # ------------------------------------------------------------ Città Bassa
  - id: pignatta-grassa
    area: citta-bassa
    nome: La Pignatta Grassa
    immagine: ambientazione/pignatta-grassa
    sommario: "La taverna degli Scuri, con i tavoli da gioco e il cortile delle risse."
    requisiti: [pista.pelle < 6]
    testo: |
      La Pignatta Grassa ha i tavoli più unti della Città Bassa e le carte più fortunate, almeno per chi le
      distribuisce. Mauro Scrocco serve da dietro il bancone e ricorda i debiti di tutti senza mai scriverli,
      e sul retro c'è il cortile delle risse.

  - id: macerie-della-pignatta
    area: citta-bassa
    nome: Le macerie della Pignatta
    immagine: ambientazione/pignatta-grassa
    sommario: "Dove c'era la taverna degli Scuri resta un cortile di travi annerite che la Città Bassa non sa che farne."
    requisiti: [pista.pelle >= 6]
    testo: |
      Della Pignatta Grassa restano i muri di pietra anneriti e il bancone di quercia, troppo grosso per
      bruciare del tutto. Nel cortile delle risse, sotto la cenere bagnata, si vede ancora il cerchio di gesso.
      Di giorno ci giocano i bambini, e la Guardia ci passa due volte per notte.

  - id: via-dei-rasoi
    area: citta-bassa
    nome: Via dei Rasoi
    immagine: ambientazione/maison-des-lunes
    negozi: [il-salotto-di-nerissa]
    sommario: "La strada della Maison des Lunes, dove di notte si incontra chi non vuole farsi vedere."
    testo: |
      Via dei Rasoi scende storta fra case di legno a tre piani. All'angolo con Via del Salmone c'è la Maison
      des Lunes, senza insegna, con una catena di bronzo sulla porta, e di notte il cristallo spento al
      gomito della via diventa il posto dove aspettare qualcuno.

  - id: fucina-dei-due-mastini
    area: citta-bassa
    nome: Fucina dei Due Mastini
    immagine: ambientazione/fucina-dei-due-mastini
    sommario: "La forgia di Bram Halgast, con le armi migliori della città e i prezzi più alti."
    negozi: [fucina-dei-due-mastini]
    testo: |
      La Fucina dei Due Mastini è un edificio di pietra annerita, con due mastini sdraiati davanti alla porta
      che non abbaiano mai. Bram Halgast parla quasi solo di metallo. Nel cortile c'è lavoro per chi ha
      braccia buone, se i cani ti lasciano entrare.

  - id: armeria-di-irsa
    area: citta-bassa
    nome: Armeria di Irsa
    immagine: ambientazione/armeria-di-irsa
    sommario: "Armature e balestre a prezzi da Città Bassa, anche a rate."
    negozi: [armeria-di-irsa]
    testo: |
      L'Armeria di Irsa è un edificio di legno senza forgia, dove Irsa Valbrun rifinisce i pezzi grezzi di
      Bram Halgast e il cuoio della conceria Kasselt. I suoi prezzi un lavoratore li paga a rate, segnate
      sul registro con una calligrafia da notaio.

  - id: scuderie-della-zanna-rotta
    area: citta-bassa
    nome: Scuderie della Zanna Rotta
    immagine: ambientazione/scuderie-della-zanna-rotta
    sommario: "I cavalli di Dolovan Stroud, che degli orchi parla soltanto male."
    negozi: [stalla-di-dolovan]
    testo: |
      Le Scuderie della Zanna Rotta stanno al margine della Città Bassa, verso i boschi. Dolovan Stroud,
      cacciatore per metà della vita, affitta cavalli a chi può pagarli e cerca garzoni che sappiano tenere
      una striglia. Sopra la porta della stalla ha inchiodato una zanna d'orco spezzata.

  - id: orlo-dei-rottami
    area: citta-bassa
    nome: Orlo dei Rottami
    immagine: ambientazione/orlo-dei-rottami
    sommario: "La spiaggia degli scarti, la baracca di Grusk e i ragazzi che frugano."
    negozi: [banco-di-grusk]
    testo: |
      L'Orlo dei Rottami è il bordo dell'altopiano, una spiaggia di scarti dove finisce quello che i
      Raschiatori buttano. Grusk, lo spazzino ufficiale, ha la sua baracca in cima alla discesa, e fra
      le lamiere frugano ragazzini scalzi che sanno dove si taglia.

  - id: cimitero-di-qir-azel
    area: citta-bassa
    nome: Cimitero di Qir-Azel
    immagine: ambientazione/cimitero-di-qir-azel
    sommario: "Le tombe della città, con la cripta del vecchio cappellano."
    testo: |
      Il cimitero di Qir-Azel sta contro il muro di cinta, all'ombra di cipressi storti, con le cappelle di
      pietra dei ricchi e le tavolette di legno degli altri. In fondo c'è la cripta del vecchio cappellano, e
      il garzone delle fosse rastrella la ghiaia ogni mattina.

  - id: segheria-e-mulino-malgrani
    area: citta-bassa
    nome: Segheria e Mulino Malgrani
    immagine: ambientazione/mulino-malgrani
    sommario: "Le concessioni dei Malgrani sul canale del cristallo."
    testo: |
      Lungo il canale del cristallo ci sono la segheria e il mulino che la Gilda diede in concessione ai
      Malgrani, e che portano ancora il loro nome. La segheria copre di polvere chiara i davanzali vicini. Il
      mulino di Anselmo Brey è l'unico in funzione; gli altri sono gusci anneriti.

  - id: acciaieria-tarvelin
    area: citta-bassa
    nome: Acciaieria dei Tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    sommario: "L'unica raffineria di lyssan per cento leghe, con la ciminiera più alta della città."
    testo: |
      L'Acciaieria dei Tarvelin è un grande edificio di pietra con una ciminiera che si vede da tutta la Città
      Bassa. Davanti i clienti guardano lame e attrezzi; dietro, nella fornace alimentata da cristalli
      conduttori, gli operai lavorano sotto maschere di cuoio e il lyssan cola azzurro.

  - id: emporio-tamberlo
    area: citta-bassa
    nome: L'Emporio Tamberlo
    immagine: ambientazione/emporio-generale
    sommario: "La bottega più antica della Città Bassa, dove si trova di tutto e Oddo Tamberlo conta il resto due volte."
    negozi: [emporio-tamberlo]
    requisiti: [topi < 2]
    testo: |
      L'Emporio sta sulla strada che sale verso i Ponti, con le zappe appese fuori come un festone, e dentro
      c'è quasi tutto. Oddo Tamberlo lavora al bancone con le due figlie, la moglie Berta sforna nella cucina
      sul retro, e sotto il pavimento c'è una cantina.

  # ------------------------------------------------------------ Ponti Sospesi
  - id: grifone-di-ferro
    area: ponti-sospesi
    nome: Locanda del Grifone di Ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    sommario: "La locanda di Liaren Tarvelin, dove i Raschiatori cercano incarichi."
    testo: |
      La Locanda del Grifone di Ferro è il punto fermo dei Raschiatori sui Ponti, con i tavoli lunghi e una bacheca
      coperta di avvisi. Liaren Tarvelin la manda avanti con la cuoca Brunella, e sopra il bancone c'è la sua regola
      contro gli schiavi al seguito. Le stanze si pagano in anticipo.

  - id: mercato-dei-nodi
    area: ponti-sospesi
    nome: Mercato dei Nodi
    immagine: ambientazione/mercato-dei-nodi
    sommario: "Il bazar sulle piattaforme del Ponte delle Mille Corde."
    negozi: [nodo-d-ossidiana, dispensa-di-gramm]
    testo: |
      Il Mercato dei Nodi occupa le piattaforme del Ponte delle Mille Corde, e per molti forestieri è l'unica
      Qir-Azel che conoscono. Sotto le lanterne di mana le stoffe stanno accanto ai pezzi dei Precursori, e i
      Custodi di Passaggio prendono la loro parte a ogni vendita.

  - id: ponte-dei-morti
    area: ponti-sospesi
    nome: Ponte dei Morti
    immagine: ambientazione/ponte-dei-morti
    sommario: "Il vecchio ponte di metallo, con le lanterne dei Raschiatori dispersi."
    testo: |
      Il Ponte dei Morti è uno dei primi ponti della città, tutto di metallo. I Raschiatori ci appendono una
      lanterna per ogni compagno disperso nel Labirinto, con un piccolo Cristallo Conduttore che brucia
      finché regge, e ogni squadra cura le sue.

  - id: ponte-delle-mille-corde
    area: ponti-sospesi
    nome: Ponte delle Mille Corde
    immagine: ambientazione/ponti-sospesi
    sommario: "La via principale della città e i Custodi di Passaggio che ne riscuotono le gabelle."
    testo: |
      Il Ponte delle Mille Corde è la via principale fra i livelli della città, una campata di legno e catene
      che vibra sotto i carri. All'imbocco i Custodi di Passaggio riscuotono le gabelle per la Gilda, e sotto
      le assi si allenano al tiro contro sacchi di paglia.

  # ------------------------------------------------------------ Quartieri Alti
  - id: cattedrale-del-velo
    area: quartieri-alti
    nome: Cattedrale del Velo
    immagine: ambientazione/cattedrale-del-velo
    sommario: "La cattedrale nuova, con il chiostro dei novizi e la cripta di purificazione."
    testo: |
      La Cattedrale del Velo sorge sulle ceneri del vecchio santuario, bruciato nel 145, e sull'altare pulsa
      un cristallo rosso. Le guardie del Velo girano in coppia. Nel chiostro i novizi ripetono le letture, e
      nella cripta i chierici purificano chi lo chiede, dietro un'offerta.

  - id: accademia-di-torvessa
    area: quartieri-alti
    nome: Accademia di Torvessa
    immagine: ambientazione/accademia-di-torvessa
    negozi: [la-collezione-di-orvald]
    sommario: "La scuola della città, con il museo del preside nel seminterrato."
    testo: |
      L'Accademia di Torvessa è la scuola della città al piano di sopra e un museo al piano di sotto, dove
      il preside Orvald Temmerin tiene i trofei di trent'anni di scavi. Il suo corvo, Pett, segue dallo
      stipite dell'ufficio chiunque passi.

  - id: biblioteca-di-qir-azel
    area: quartieri-alti
    nome: Biblioteca di Qir-Azel
    immagine: ambientazione/biblioteca-di-qir-azel
    sommario: "L'archivio della città, in un edificio dei Precursori senza più il tetto originale."
    testo: |
      La Biblioteca di Qir-Azel sta in un edificio precuriano che ha perso il tetto in due incendi. L'archivio
      pubblico occupa i piani bassi, e più su gli scaffali sono sigillati. Il bibliotecario Ulric Stanne
      ignora con cortesia chi non sa un po' di storia, e all'ingresso espone i cristalli spenti dall'Eclisse.

  - id: guarnigione-di-qir-azel
    area: quartieri-alti
    nome: Guarnigione di Qir-Azel
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "La Caserma, sede dello sceriffo Galdrick e delle celle cittadine."
    testo: |
      La Guarnigione, che in città chiamano la Caserma, è la sede dello sceriffo Toren Galdrick, con le celle
      al piano di sotto e un cortile dove la Guardia e i Raschiatori si addestrano insieme. Alla porta, delle
      due guardie bardate, una ha sempre l'aria di aver appena mangiato.

  - id: teatro-delle-meraviglie
    area: quartieri-alti
    nome: Teatro delle Meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    sommario: "La sala di Orazio Belcanto, con il sipario rosso e i cartelloni più eccentrici della città."
    testo: |
      Il Teatro delle Meraviglie appartiene a Orazio Belcanto, che sul suo palco recita anche le parti principali, sotto
      cartelloni che promettono sempre qualcosa di mai visto. Dentro c'è un sipario rosso e un loggione per chi non siede in
      platea. Belcanto cerca di continuo bardi e comparse.

  - id: arena-di-qir-azel
    area: quartieri-alti
    nome: L'Arena di Qir-Azel
    immagine: ambientazione/arena-di-qir-azel
    sommario: "Le mura più vecchie della città, al limitare nord-ovest dei Quartieri Alti, riaperte per il torneo."
    requisiti: [pista.capomozzo >= 7]
    testo: |
      L'Arena è più antica dei Quartieri Alti che le sono cresciuti intorno, con le mura rinforzate da archi
      di metallo strappati alle rovine dei Precursori e una luce azzurrina che scorre fra i blocchi. Sotto le
      gradinate, nel settore dei combattenti, Orvald Temmerin tiene il banco delle iscrizioni.

  - id: municipio
    area: quartieri-alti
    nome: Municipio
    immagine: ambientazione/quartieri-alti
    sommario: "Gli uffici della Rappresentante Julia Castaldi e del consiglio cittadino."
    testo: |
      Il Municipio ospita gli uffici della Rappresentante Julia Castaldi e la sala del consiglio cittadino.
      Chi aspetta di essere ricevuto siede su una panca consumata, sotto un ritratto della Rappresentante
      dipinto con più ottimismo che somiglianza.
