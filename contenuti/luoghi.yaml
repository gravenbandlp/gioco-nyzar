# Luoghi: i mini-hub dei quartieri. Ogni luogo raccoglie le storie che vi accadono (campo `presso` negli
# storylet) e le botteghe che vi si aprono. Le storie senza luogo restano "in giro per il quartiere".
# I testi presentano il posto com'è sempre: niente fatti recenti, che invecchiano.

luoghi:
  # ------------------------------------------------------------ Città Bassa
  - id: pignatta-grassa
    area: citta-bassa
    nome: La Pignatta Grassa
    immagine: ambientazione/pignatta-grassa
    sommario: "La taverna degli Scuri, con i tavoli da gioco e il cortile delle risse."
    requisiti: [pista.pelle < 6]
    testo: |
      La Pignatta Grassa ha i tavoli più unti della Città Bassa e le carte più fortunate, almeno per chi le
      distribuisce. Il legno dei tavoli è diventato scuro e lucido di grasso, e il pollice ci scivola sopra
      come su una cotenna. Le carte hanno gli angoli smussati e il dorso gonfio di umido, e chi le conosce
      bene le riconosce anche coperte. Mauro Scrocco serve da dietro il bancone e ricorda i debiti di tutti
      senza scriverli. Sopra la porta un cartello dice che il locale è sotto la protezione dello sceriffo, e
      qualcuno ha grattato via mezza parola *sceriffo* con un coltello. I segni della lama sono profondi e
      paralleli, fatti con calma.

  - id: macerie-della-pignatta
    area: citta-bassa
    nome: Le macerie della Pignatta
    immagine: ambientazione/pignatta-grassa
    sommario: "Dove c'era la taverna degli Scuri resta un cortile di travi annerite, e la Città Bassa non sa ancora che farne."
    requisiti: [pista.pelle >= 6]
    testo: |
      Della Pignatta Grassa sono rimasti i muri di pietra anneriti e il bancone di quercia, troppo grosso per
      bruciare del tutto. La fuliggine dei muri viene via con un dito, e sotto la pietra ha preso dal fuoco un
      colore rosato. Il piano del bancone è carbonizzato per lo spessore di un pollice, e sotto il nero il
      legno è ancora chiaro e duro. Il cortile delle risse è pieno di cenere bagnata che sa di legno fradicio,
      e sotto si vede ancora il cerchio di gesso. Di giorno ci giocano i bambini e di sera ci si siede chi non
      ha un altro posto. La Guardia ci passa due volte per notte.

  - id: via-dei-rasoi
    area: citta-bassa
    nome: Via dei Rasoi
    immagine: ambientazione/maison-des-lunes
    negozi: [il-salotto-di-nerissa]
    sommario: "La strada della Maison des Lunes, dove di notte si incontra chi non vuole farsi vedere."
    testo: |
      Via dei Rasoi scende storta fra case di legno, con le assi grigie di pioggia e i piani alti che sporgono
      sulla strada più di quelli bassi. All'angolo con Via del Salmone la Maison des Lunes non ha insegna,
      soltanto una catena di bronzo sulla porta e la scritta *Ospiti Benvenuti*. Il bronzo è scuro dappertutto
      tranne negli anelli più bassi, che le mani hanno tenuto lucidi. Di giorno ci si stendono i panni da una
      finestra all'altra, e di notte i panni restano su mentre il cristallo spento al gomito della via diventa
      il posto dove aspettare qualcuno. Il palo del cristallo è consumato all'altezza di una spalla da chi ci
      si appoggia.

  - id: fucina-dei-due-mastini
    area: citta-bassa
    nome: Fucina dei Due Mastini
    immagine: ambientazione/fucina-dei-due-mastini
    sommario: "La forgia di Bram Halgast, con le armi migliori della città e i prezzi più alti."
    negozi: [fucina-dei-due-mastini]
    testo: |
      La Fucina dei Due Mastini è un edificio di pietra annerita dal fumo, con un mastino di ferro battuto
      sull'insegna. Davanti alla porta sono sdraiati due mastini veri che non abbaiano mai. Seguono con gli
      occhi chi si avvicina e non alzano la testa dalle zampe. Dentro il martello batte a colpi regolari, e
      fra un colpo e l'altro si sente il soffio del mantice. Bram Halgast lavora con le maniche arrotolate e
      parla poco, quasi sempre di metallo. Nel cortile c'è lavoro per chi ha braccia buone se i cani decidono
      che puoi entrare.

  - id: armeria-di-irsa
    area: citta-bassa
    nome: Armeria di Irsa
    immagine: ambientazione/armeria-di-irsa
    sommario: "Armature e balestre a prezzi da Città Bassa, anche a rate."
    negozi: [armeria-di-irsa]
    testo: |
      L'Armeria di Irsa è un edificio di legno a due piani senza forgia, e dentro c'è odore di cuoio conciato
      e di olio per le fibbie. Irsa Valbrun compra i pezzi grezzi da Bram Halgast e il cuoio dalla conceria
      Kasselt, poi nel retro li monta e li rifinisce. Dalla porta del retro arriva il colpo secco della pinza
      che chiude i rivetti. Fa prezzi che un lavoratore può pagare a rate, e sul bancone tiene il registro
      delle rate, scritto con una calligrafia da notaio. Le pagine più vecchie sono gonfie e scure negli
      angoli che le dita hanno girato.

  - id: scuderie-della-zanna-rotta
    area: citta-bassa
    nome: Scuderie della Zanna Rotta
    immagine: ambientazione/scuderie-della-zanna-rotta
    sommario: "I cavalli di Dolovan Stroud, che degli orchi parla soltanto male."
    testo: |
      Le Scuderie della Zanna Rotta stanno al margine della Città Bassa, dove le strade escono verso i boschi
      e il selciato finisce nella terra battuta. La stalla è lunga e bassa, e l'odore di fieno e di cavallo
      arriva fino alla strada. Dolovan Stroud è stato cacciatore per metà della vita e adesso affitta cavalli
      a chi può pagarli e dà lavoro a chi sa tenere una striglia. Sopra la porta della stalla ha inchiodato
      una zanna d'orco spezzata che mostra volentieri a chi chiede del nome. La zanna è lunga quanto una mano
      aperta e gialla come un'unghia vecchia, e il chiodo che la tiene è l'unica cosa lucida sopra la porta.

  - id: orlo-dei-rottami
    area: citta-bassa
    nome: Orlo dei Rottami
    immagine: ambientazione/orlo-dei-rottami
    sommario: "La spiaggia degli scarti, la baracca di Grusk e i ragazzi che frugano."
    negozi: [banco-di-grusk]
    testo: |
      L'Orlo dei Rottami è il bordo dell'altopiano, una spiaggia di scarti dove finisce quello che i
      Raschiatori buttano e che nessuno ha voluto comprare. Il pendio è fatto di lamiere contorte e di ferri
      piegati, e scende a gradoni oltre il bordo. Lo spazzino ufficiale Grusk ha la baracca in cima alla
      discesa e una carriola rossa. Fra le lamiere lavorano ragazzini scalzi che sanno dove si taglia e dove
      si scivola. Hanno le piante dei piedi dure come cuoio e passano sugli spigoli arrugginiti senza guardare
      in basso.

  - id: cimitero-di-qir-azel
    area: citta-bassa
    nome: Cimitero di Qir-Azel
    immagine: ambientazione/cimitero-di-qir-azel
    sommario: "Le tombe della città, con la cripta del vecchio cappellano."
    testo: |
      Il cimitero di Qir-Azel sta contro il muro di cinta all'ombra di cipressi storti e piegati tutti dalla
      stessa parte. Sui rami stanno i corvi che nei vialetti non scendono mai. Sulle lapidi più vecchie il
      vento ha cancellato i nomi, e il calcare è diventato poroso e liscio sotto le dita. Le famiglie ricche
      hanno cappelle con i simboli del Grande Albero scolpiti sugli architravi, le altre una tavoletta di
      legno che dopo qualche inverno si spacca lungo la venatura. Il garzone delle fosse rastrella la ghiaia
      ogni mattina, anche nei vialetti deserti.

  - id: segheria-e-mulino-malgrani
    area: citta-bassa
    nome: Segheria e Mulino Malgrani
    immagine: ambientazione/mulino-malgrani
    sommario: "Le concessioni dei Malgrani sul canale del cristallo."
    testo: |
      Lungo il canale del cristallo ci sono la segheria e il mulino che la Gilda diede ai Malgrani e che
      portano ancora il loro nome. Il canale lo spinge un grosso cristallo conduttore, e il suo ronzio basso
      ti entra nei denti già dal ponte. La segheria imbianca di polvere i davanzali vicini. Il mulino di
      Anselmo Brey è un edificio di pietra blu ed è l'unico in funzione, con la ruota che gira nel canale con
      un rumore di pioggia. Gli altri sono gusci anneriti, e sopra ogni finestra il fumo ha lasciato una
      striscia nera che sale verso il tetto.

  - id: acciaieria-tarvelin
    area: citta-bassa
    nome: Acciaieria dei Tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    sommario: "L'unica raffineria di lyssan per cento leghe, con la ciminiera più alta della città."
    testo: |
      L'Acciaieria dei Tarvelin è un edificio di pietra con una ciminiera di mattoni che si vede da tutta la
      Città Bassa. Dietro la sala dei clienti c'è la fornace, alimentata da cristalli conduttori murati nelle
      fondamenta. Quando è accesa il pavimento della sala è tiepido sotto le suole, e i vetri delle finestre
      vibrano appena nei telai. Gli operai portano maschere di cuoio, e il lyssan colato ha un azzurro che non
      somiglia a nessun fuoco.

  - id: emporio-tamberlo
    area: citta-bassa
    nome: L'Emporio Tamberlo
    immagine: ambientazione/emporio-generale
    sommario: "La bottega più antica della Città Bassa, dove si trova di tutto e Oddo Tamberlo conta il resto due volte."
    negozi: [emporio-tamberlo]
    requisiti: [topi < 2]
    testo: |
      L'Emporio sta sulla strada che sale verso i Ponti, con le zappe appese fuori dalla porta come un
      festone. I manici sono di frassino e le lame hanno ancora il grasso di bottega, e quando passa un carro
      battono una contro l'altra. Dentro si vende quasi tutto, e quello che manca Oddo Tamberlo lo fa
      arrivare. Gli scaffali salgono fino al soffitto e le assi si incurvano al centro sotto il peso della
      merce. Al bancone ci sono lui e le due figlie, mentre la moglie Berta sforna sul retro e l'odore del
      pane copre quello del ferro. Sotto il pavimento c'è una cantina.

  - id: locanda-di-ilka
    area: citta-bassa
    nome: La Locanda di Ilka
    immagine: ambientazione/locanda-di-ilka
    sommario: "Sidro, patate speziate e, dopo la chiusura, lezioni di magia al tavolo di cucina."
    testo: |
      La Locanda di Ilka è uno degli edifici più vecchi di Qir-Azel. Sta in una strada appartata della Città
      Bassa e ci vengono quasi solo quelli del quartiere. Ha un solo piano dipinto a colori vivaci con i
      motivi dei carri olvari, che corrono in una fascia sotto la grondaia. Sulle travi più basse il colore è
      stato ripassato tante volte che sotto il pollice si sentono gli strati. Sull'insegna c'è la Vecchia Luce
      fra tende e carri attorno a un falò, e dalla porta esce odore di sidro e di patate speziate.

  # ------------------------------------------------------------ Ponti Sospesi
  - id: grifone-di-ferro
    area: ponti-sospesi
    nome: Locanda del Grifone di Ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    sommario: "La locanda di Liaren Tarvelin, dove i Raschiatori cercano incarichi."
    testo: |
      La Locanda del Grifone di Ferro è il ritrovo dei Raschiatori sui Ponti, e il pavimento di tavole si
      muove appena quando il ponte prende il vento. Fra i tavoli lunghi c'è una bacheca coperta di avvisi
      inchiodati uno sopra l'altro, e il legno sotto è così bucato che i chiodi nuovi ci tengono a fatica.
      Liaren Tarvelin la manda avanti con la cuoca Brunella, e sopra il bancone ha appeso la sua regola che
      vieta di portare schiavi al seguito. Le stanze di sopra si pagano in anticipo e le notti si segnano su
      un registro.

  - id: mercato-dei-nodi
    area: ponti-sospesi
    nome: Mercato dei Nodi
    immagine: ambientazione/mercato-dei-nodi
    sommario: "Il bazar sulle piattaforme del Ponte delle Mille Corde."
    negozi: [nodo-d-ossidiana, dispensa-di-gramm]
    testo: |
      Il Mercato dei Nodi occupa le piattaforme del Ponte delle Mille Corde, e molti forestieri non conoscono
      altro di Qir-Azel. Le piattaforme sono legate fra loro da nodi grossi come una testa, con la canapa
      scurita dal catrame e sfilacciata dove la gente ci si aggrappa. Le stoffe della conceria Kasselt stanno
      accanto ai pezzi dei Precursori, e i Custodi di Passaggio prendono la loro parte a ogni vendita. Sui
      banchi le stoffe sono sbiadite dove prendono la luce, e i pezzi dei Precursori hanno ancora gli spigoli
      netti. Il ponte vibra sempre e le bilance stanno lontano dal bordo.

  - id: ponte-dei-morti
    area: ponti-sospesi
    nome: Ponte dei Morti
    immagine: ambientazione/ponte-dei-morti
    sommario: "Il vecchio ponte di metallo, con le lanterne dei Raschiatori dispersi."
    testo: |
      Il Ponte dei Morti è uno dei primi della città, tutto di metallo. Le lastre del piano sono tenute
      insieme da chiodi a testa larga, e ogni passo ci rimbomba sotto fino all'altra sponda. Per ogni compagno
      disperso nel Labirinto i Raschiatori ci appendono una lanterna con un Cristallo Conduttore, che brucia
      finché il cristallo regge. Le lanterne pendono dal parapetto a pochi palmi l'una dall'altra, e quando il
      vento della Cicatrice le fa dondolare la luce dei cristalli non trema. Ogni squadra cura le sue e su
      alcune c'è un nome sul vetro. Qualcuno passa ogni tanto a togliere la fuliggine, anche dai vetri delle
      lanterne che si sono spente.

  - id: ponte-delle-mille-corde
    area: ponti-sospesi
    nome: Ponte delle Mille Corde
    immagine: ambientazione/ponti-sospesi
    sommario: "La via principale della città e i Custodi di Passaggio che ne riscuotono le gabelle."
    testo: |
      Il Ponte delle Mille Corde è la via principale fra i livelli della città, una campata di legno e catene
      che vibra sotto i carri. Le assi sono scavate da due solchi paralleli dove passano le ruote, e le catene
      che le reggono sono spesse quanto un polso e lucide di grasso agli anelli. All'imbocco i Custodi di
      Passaggio controllano i carichi e riscuotono le gabelle per la Gilda. Sotto le assi si allenano al tiro
      contro sacchi di paglia con una faccia a carbone, e su alcuni sacchi la faccia è stata ridisegnata più
      volte sopra i buchi dei dardi.

  # ------------------------------------------------------------ Quartieri Alti
  - id: cattedrale-del-velo
    area: quartieri-alti
    nome: Cattedrale del Velo
    immagine: ambientazione/cattedrale-del-velo
    sommario: "La cattedrale nuova, con il chiostro dei novizi e la cripta di purificazione."
    testo: |
      La Cattedrale del Velo sorge sulle ceneri del vecchio santuario, bruciato nel 145. Le pareti mescolano
      pietra chiara e segmenti precuriani. La pietra chiara è squadrata e legata con la malta, e ai piedi
      delle colonne è già consumata dalle ginocchia dei fedeli. I segmenti precuriani sono più scuri e
      combaciano fra loro senza malta, e sulla loro superficie non c'è un graffio. Sull'altare pulsa un
      cristallo rosso, con un ritmo regolare e più lento di un battito. Le guardie del Velo girano in coppia.
      Nel chiostro i novizi ripetono le letture, e nella cripta i chierici purificano chi porta un'offerta.

  - id: accademia-di-torvessa
    area: quartieri-alti
    nome: Accademia di Torvessa
    immagine: ambientazione/accademia-di-torvessa
    negozi: [la-collezione-di-orvald]
    sommario: "La scuola della città, con il museo del preside nel seminterrato."
    testo: |
      L'Accademia di Torvessa è una scuola al piano di sopra e un museo al piano di sotto. Dalle aule scende
      lo stridio del gesso sulle lavagne, e dalla scala del seminterrato sale l'odore di polvere e di carta
      vecchia delle vetrine. Il preside Orvald Temmerin ha passato trent'anni negli scavi e mostra i trofei
      del seminterrato solo a chi lo tratta con rispetto. Il suo corvo Pett sta sullo stipite dell'ufficio e
      segue con la testa chi passa, girandola a piccoli scatti finché l'ultimo passo non si è allontanato.

  - id: biblioteca-di-qir-azel
    area: quartieri-alti
    nome: Biblioteca di Qir-Azel
    immagine: ambientazione/biblioteca-di-qir-azel
    sommario: "L'archivio della città, in un edificio dei Precursori senza più il tetto originale."
    testo: |
      La Biblioteca di Qir-Azel sta in un edificio precuriano che ha perso il tetto in due incendi. Le travi
      del tetto nuovo sono ancora chiare di resina, e sulle mura di sotto non c'è il segno nero di nessuno dei
      due fuochi. L'archivio pubblico occupa i piani bassi, e più su gli scaffali sono sigillati con cera nera
      e nastro rosso. Il bibliotecario Ulric Stanne ignora con cortesia chi non sa la storia e tiene
      all'ingresso i cristalli spenti dall'Eclisse, in fila su una mensola e grigi come pietre di fiume.

  - id: guarnigione-di-qir-azel
    area: quartieri-alti
    nome: Guarnigione di Qir-Azel
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "La Caserma, sede dello sceriffo Galdrick e delle celle cittadine."
    testo: |
      La Guarnigione, che in città chiamano la Caserma, è la sede dello sceriffo Toren Galdrick. Il mastio è
      di blocchi grigi squadrati a mano, e il selciato del cortile è consumato in cerchi davanti ai manichini
      dove le reclute ripetono gli stessi passi. Nel cortile la Guardia e i Raschiatori si addestrano insieme
      per un accordo vecchio quanto il mastio, e sotto ci sono le celle. Due guardie bardate presidiano la
      porta giorno e notte, e una delle due ha sempre l'aria di aver appena mangiato.

  - id: teatro-delle-meraviglie
    area: quartieri-alti
    nome: Teatro delle Meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    sommario: "La sala di Orazio Belcanto, con il sipario rosso e i cartelloni più eccentrici della città."
    testo: |
      Il Teatro delle Meraviglie è di Orazio Belcanto, che recita anche le parti principali. I cartelloni
      promettono sempre qualcosa di mai visto. Dentro c'è un sipario di velluto rosso. Il velluto è lucido sul
      davanti e liso sul bordo dove le mani lo scostano a ogni entrata. Sotto c'è una platea di poltrone
      imbottite per l'élite dei Quartieri Alti, e in alto un loggione di panche senza schienale per gli altri.
      Belcanto cerca sempre bardi e comparse, e paga bene chi resiste.

  - id: arena-di-qir-azel
    area: quartieri-alti
    nome: L'Arena di Qir-Azel
    immagine: ambientazione/arena-di-qir-azel
    sommario: "Le mura più vecchie della città, al limitare nord-ovest dei Quartieri Alti, riaperte per il torneo."
    requisiti: [pista.capomozzo >= 7]
    testo: |
      L'Arena è più antica dei Quartieri Alti che le sono cresciuti intorno. Le mura sono rinforzate con
      nervature di metallo strappate alle rovine dei Precursori. I perni di ferro che le tengono ai blocchi
      sono rossi di ruggine e gonfi, e le nervature sotto i perni sono lisce come il giorno in cui le hanno
      staccate. Fra i blocchi scorre una luce azzurrina, che di giorno si vede appena e di notte arriva fino
      alla strada. Sotto le gradinate c'è il settore dei combattenti, dove Orvald Temmerin tiene il banco
      delle iscrizioni.

  - id: municipio
    area: quartieri-alti
    nome: Municipio
    immagine: ambientazione/quartieri-alti
    sommario: "Gli uffici della Rappresentante Julia Castaldi e del consiglio cittadino."
    testo: |
      Il Municipio ospita gli uffici della Rappresentante Julia Castaldi e la sala del consiglio cittadino.
      Gli impiegati ricevono di mattina, uno alla volta, da dietro uno sportello con la grata di ferro. Chi
      aspetta siede su una panca di legno consumata nel mezzo, sotto un ritratto della Rappresentante dipinto
      con più ottimismo che somiglianza. La cornice è dorata e si scrosta agli angoli, e sotto l'oro si vede
      il legno grezzo.
