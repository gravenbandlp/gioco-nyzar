# Luoghi: i mini-hub dei quartieri. Ogni luogo raccoglie le storie che vi accadono (campo `presso` negli
# storylet) e le botteghe che vi si aprono. Le storie senza luogo restano "in giro per il quartiere".
# I testi presentano il posto com'è sempre: niente fatti recenti, che invecchiano.

luoghi:
  # ------------------------------------------------------------ Città Bassa
  - id: pignatta-grassa
    area: citta-bassa
    nome: La Pignatta Grassa
    immagine: ambientazione/pignatta-grassa
    sommario: "La taverna degli Scuri, con i tavoli da gioco e il cortile delle risse."
    requisiti: [pista.pelle < 6]
    testo: |
      La Pignatta Grassa ha i tavoli più unti della Città Bassa e le carte più fortunate, almeno per chi le
      distribuisce. Mauro Scrocco serve da dietro il bancone e ricorda i debiti di tutti senza mai scriverli.
      Sopra la porta un cartello dice che il locale è sotto la protezione dello sceriffo, e qualcuno ha
      grattato via mezza parola *sceriffo* con la punta di un coltello senza che nessuno si prendesse la briga
      di ridipingerla.

  - id: macerie-della-pignatta
    area: citta-bassa
    nome: Le macerie della Pignatta
    immagine: ambientazione/pignatta-grassa
    sommario: "Dove c'era la taverna degli Scuri resta un cortile di travi annerite, e la Città Bassa non sa ancora che farne."
    requisiti: [pista.pelle >= 6]
    testo: |
      Della Pignatta Grassa sono rimasti i muri di pietra, anneriti fino al tetto che non c'è più, e il bancone
      di quercia, troppo grosso per bruciare del tutto. Il cortile delle risse è pieno di cenere bagnata, e il
      cerchio di gesso si vede ancora sotto. Di giorno ci giocano i bambini, di sera ci si siede chi non ha un
      altro posto dove andare, e la Guardia ci passa due volte per notte.

  - id: via-dei-rasoi
    area: citta-bassa
    nome: Via dei Rasoi
    immagine: ambientazione/maison-des-lunes
    negozi: [il-salotto-di-nerissa]
    sommario: "La strada della Maison des Lunes, dove di notte si incontra chi non vuole farsi vedere."
    testo: |
      Via dei Rasoi scende storta fra case di legno a tre piani. All'angolo con Via del Salmone c'è la Maison
      des Lunes, senza insegna, con una catena di bronzo sulla porta e la scritta *Ospiti Benvenuti*. Di
      giorno la strada è di chi lavora e stende i panni da una finestra all'altra. Di notte i panni restano
      su, le finestre restano socchiuse, e il cristallo spento al gomito della via diventa il posto dove
      aspettare qualcuno.

  - id: fucina-dei-due-mastini
    area: citta-bassa
    nome: Fucina dei Due Mastini
    immagine: ambientazione/fucina-dei-due-mastini
    sommario: "La forgia di Bram Halgast, con le armi migliori della città e i prezzi più alti."
    negozi: [fucina-dei-due-mastini]
    testo: |
      La Fucina dei Due Mastini è un edificio di pietra annerita, con un mastino di ferro che ringhia
      sull'insegna e due mastini veri sdraiati davanti alla porta, che non abbaiano mai. Bram Halgast lavora
      con le maniche arrotolate fino alla spalla e parla poco, quasi sempre di metallo. Nel cortile c'è lavoro
      per chi ha braccia buone, se i cani decidono che puoi entrare.

  - id: armeria-di-irsa
    area: citta-bassa
    nome: Armeria di Irsa
    immagine: ambientazione/armeria-di-irsa
    sommario: "Armature e balestre a prezzi da Città Bassa, anche a rate."
    negozi: [armeria-di-irsa]
    testo: |
      L'Armeria di Irsa è un edificio di legno a due piani senza forgia. Irsa Valbrun compra i pezzi grezzi da
      Bram Halgast e il cuoio dalla conceria Kasselt, poi nel retro li monta e li rifinisce. Fa prezzi che un
      lavoratore può pagare a rate, e sul bancone tiene il registro delle rate, scritto con una calligrafia da
      notaio.

  - id: scuderie-della-zanna-rotta
    area: citta-bassa
    nome: Scuderie della Zanna Rotta
    immagine: ambientazione/scuderie-della-zanna-rotta
    sommario: "I cavalli di Dolovan Stroud, che degli orchi parla soltanto male."
    testo: |
      Le Scuderie della Zanna Rotta stanno al margine della Città Bassa, dove le strade escono verso i boschi.
      Dolovan Stroud, che è stato cacciatore per metà della vita, affitta cavalli a chi può pagarli e dà
      lavoro a chi sa tenere in mano una striglia. Sopra la porta della stalla ha inchiodato una zanna d'orco
      spezzata a metà, e la indica volentieri a chi gli chiede da dove venga il nome.

  - id: orlo-dei-rottami
    area: citta-bassa
    nome: Orlo dei Rottami
    immagine: ambientazione/orlo-dei-rottami
    sommario: "La spiaggia degli scarti, la baracca di Grusk e i ragazzi che frugano."
    negozi: [banco-di-grusk]
    testo: |
      L'Orlo dei Rottami è il bordo dell'altopiano, una spiaggia di scarti dove finisce quello che i
      Raschiatori buttano e quello che nessuno ha voluto comprare. Grusk, lo spazzino ufficiale, ha la sua
      baracca in cima alla discesa e una carriola rossa che si vede da lontano. Fra le lamiere lavorano dei
      ragazzini scalzi e svelti, che sanno dove si taglia e dove si scivola.

  - id: cimitero-di-qir-azel
    area: citta-bassa
    nome: Cimitero di Qir-Azel
    immagine: ambientazione/cimitero-di-qir-azel
    sommario: "Le tombe della città, con la cripta del vecchio cappellano."
    testo: |
      Il cimitero di Qir-Azel sta contro il muro di cinta, all'ombra di cipressi storti, e le lapidi più
      vecchie il vento le ha lisciate fino a cancellare i nomi. Le famiglie ricche hanno cappelle di pietra
      con i simboli del Grande Albero; le altre hanno una tavoletta di legno con il nome inciso a coltello. Il
      garzone delle fosse passa il rastrello sulla ghiaia ogni mattina, anche nei vialetti dove non va più
      nessuno.

  - id: segheria-e-mulino-malgrani
    area: citta-bassa
    nome: Segheria e Mulino Malgrani
    immagine: ambientazione/mulino-malgrani
    sommario: "Le concessioni dei Malgrani sul canale del cristallo."
    testo: |
      Lungo il canale del cristallo ci sono la segheria e il mulino che la Gilda diede in concessione ai
      Malgrani, e che in città portano ancora il loro nome. La segheria lavora dall'alba e copre di polvere
      chiara i davanzali delle case vicine. Il mulino di Anselmo Brey è l'unico ancora in funzione; gli altri
      sono gusci anneriti che nessuno ha mai fatto abbattere.

  - id: acciaieria-tarvelin
    area: citta-bassa
    nome: Acciaieria dei Tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    sommario: "L'unica raffineria di lyssan per cento leghe, con la ciminiera più alta della città."
    testo: |
      L'Acciaieria dei Tarvelin è un grande edificio di pietra con la ciminiera che si vede da ogni punto della
      Città Bassa. Davanti c'è la sala dove i clienti guardano lame e attrezzi, dietro la fornace, alimentata da
      cristalli conduttori murati nelle fondamenta. Quando è accesa gli operai lavorano con il viso coperto da
      maschere di cuoio, e il lyssan colato ha un colore azzurro che non somiglia a nessun fuoco.

  - id: emporio-tamberlo
    area: citta-bassa
    nome: L'Emporio Tamberlo
    immagine: ambientazione/emporio-generale
    sommario: "La bottega più antica della Città Bassa, dove si trova di tutto e Oddo Tamberlo conta il resto due volte."
    negozi: [emporio-tamberlo]
    requisiti: [topi < 2]
    testo: |
      L'Emporio sta sulla strada che sale verso i Ponti, con le zappe appese fuori dalla porta come un festone.
      Dentro si vende quasi tutto, dalle cinghie per i muli ai chiodi a peso, e quello che manca Oddo Tamberlo
      lo fa arrivare. Al bancone lavora con le due figlie, mentre la moglie Berta sforna nella cucina sul retro,
      e sotto il pavimento c'è una cantina.

  # ------------------------------------------------------------ Ponti Sospesi
  - id: grifone-di-ferro
    area: ponti-sospesi
    nome: Locanda del Grifone di Ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    sommario: "La locanda di Liaren Tarvelin, dove i Raschiatori cercano incarichi."
    testo: |
      La Locanda del Grifone di Ferro è il punto fermo dei Raschiatori sui Ponti, con i tavoli lunghi, un
      camino che tira male e una bacheca di sughero coperta di avvisi. Liaren Tarvelin la manda avanti insieme
      alla cuoca Brunella, e sopra il bancone ha appeso la sua regola, che vieta di portare schiavi al
      seguito. Le stanze al piano di sopra si pagano in anticipo, e le notti si segnano su un registro dietro il bancone.

  - id: mercato-dei-nodi
    area: ponti-sospesi
    nome: Mercato dei Nodi
    immagine: ambientazione/mercato-dei-nodi
    sommario: "Il bazar sulle piattaforme del Ponte delle Mille Corde."
    negozi: [nodo-d-ossidiana, dispensa-di-gramm]
    testo: |
      Il Mercato dei Nodi occupa le piattaforme del Ponte delle Mille Corde, e per molti forestieri è l'unica
      Qir-Azel che conoscono. Sotto le lanterne di mana le stoffe della conceria Kasselt stanno accanto ai
      pezzi dei Precursori, e i Custodi di Passaggio prendono la loro parte a ogni vendita. Il ponte vibra
      sempre un poco, e i mercanti hanno imparato a non appoggiare le bilance sul bordo.

  - id: ponte-dei-morti
    area: ponti-sospesi
    nome: Ponte dei Morti
    immagine: ambientazione/ponte-dei-morti
    sommario: "Il vecchio ponte di metallo, con le lanterne dei Raschiatori dispersi."
    testo: |
      Il Ponte dei Morti è uno dei primi ponti della città, tutto di metallo. I Raschiatori ci appendono una
      lanterna per ogni compagno disperso nel Labirinto, con un piccolo Cristallo Conduttore dentro, e la
      lanterna brucia finché il cristallo regge, a volte per anni. Ogni squadra cura le sue. Alcune hanno un
      nome scritto sul vetro, e qualcuno passa ogni tanto a togliere la fuliggine.

  - id: ponte-delle-mille-corde
    area: ponti-sospesi
    nome: Ponte delle Mille Corde
    immagine: ambientazione/ponti-sospesi
    sommario: "La via principale della città e i Custodi di Passaggio che ne riscuotono le gabelle."
    testo: |
      Il Ponte delle Mille Corde è la via principale fra i livelli della città, una campata di legno e catene
      che vibra di continuo sotto i carri. All'imbocco i Custodi di Passaggio controllano i carichi e
      riscuotono le gabelle per conto della Gilda. Sotto le assi, su una piattaforma di servizio, si allenano
      al tiro, e i loro bersagli sono sacchi di paglia con una faccia disegnata a carbone.

  # ------------------------------------------------------------ Quartieri Alti
  - id: cattedrale-del-velo
    area: quartieri-alti
    nome: Cattedrale del Velo
    immagine: ambientazione/cattedrale-del-velo
    sommario: "La cattedrale nuova, con il chiostro dei novizi e la cripta di purificazione."
    testo: |
      La Cattedrale del Velo sorge sulle ceneri del vecchio santuario, bruciato nel 145. Le pareti mescolano
      pietra chiara e segmenti precuriani fusi nel muro, e sull'altare pulsa un cristallo rosso. Le guardie
      del Velo girano sempre in coppia. Nel chiostro i novizi ripetono le letture ad alta voce, e nella cripta
      i chierici accolgono chi viene a farsi purificare, dietro un'offerta.

  - id: accademia-di-torvessa
    area: quartieri-alti
    nome: Accademia di Torvessa
    immagine: ambientazione/accademia-di-torvessa
    negozi: [la-collezione-di-orvald]
    sommario: "La scuola della città, con il museo del preside nel seminterrato."
    testo: |
      L'Accademia di Torvessa è la scuola della città al piano di sopra e un museo al piano di sotto. Il
      preside Orvald Temmerin ha passato trent'anni negli scavi e tiene nel seminterrato i trofei di quegli
      anni, che mostra solo a chi lo tratta con rispetto. Il suo corvo, Pett, sta appollaiato sullo stipite
      dell'ufficio e segue con la testa chiunque passi.

  - id: biblioteca-di-qir-azel
    area: quartieri-alti
    nome: Biblioteca di Qir-Azel
    immagine: ambientazione/biblioteca-di-qir-azel
    sommario: "L'archivio della città, in un edificio dei Precursori senza più il tetto originale."
    testo: |
      La Biblioteca di Qir-Azel sta in un edificio precuriano che ha perso il tetto in due incendi e ne ha
      avuti altrettanti nuovi. L'archivio pubblico occupa i piani bassi; più su gli scaffali sono sigillati
      con cera nera e nastro rosso. Ulric Stanne, il bibliotecario, ignora con cortesia chiunque non sappia un
      po' di storia, e nelle vetrine dell'ingresso tiene i cristalli spenti dall'Eclisse.

  - id: guarnigione-di-qir-azel
    area: quartieri-alti
    nome: Guarnigione di Qir-Azel
    immagine: ambientazione/guarnigione-di-qir-azel
    sommario: "La Caserma, sede dello sceriffo Galdrick e delle celle cittadine."
    testo: |
      La Guarnigione, che in città chiamano la Caserma, è la sede dello sceriffo Toren Galdrick. Nel cortile
      la Guardia e i Raschiatori si addestrano insieme per un accordo vecchio quanto il mastio, e sotto ci
      sono le celle. Due guardie bardate presidiano la porta giorno e notte, e una delle due ha sempre l'aria
      di aver appena mangiato.

  - id: teatro-delle-meraviglie
    area: quartieri-alti
    nome: Teatro delle Meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    sommario: "La sala di Orazio Belcanto, con il sipario rosso e i cartelloni più eccentrici della città."
    testo: |
      Il Teatro delle Meraviglie appartiene a Orazio Belcanto, che sul suo palco recita anche le
      parti principali. I cartelloni all'ingresso cambiano spesso e promettono sempre qualcosa che non si è
      mai visto. Dentro c'è un sipario rosso, una platea per l'élite dei Quartieri Alti e un loggione per tutti gli altri. Belcanto
      cerca bardi e comparse di continuo, e paga bene chi resiste.

  - id: arena-di-qir-azel
    area: quartieri-alti
    nome: L'Arena di Qir-Azel
    immagine: ambientazione/arena-di-qir-azel
    sommario: "Le mura più vecchie della città, al limitare nord-ovest dei Quartieri Alti, riaperte per il torneo."
    requisiti: [pista.capomozzo >= 7]
    testo: |
      L'Arena è più antica dei Quartieri Alti che le sono cresciuti intorno. Le mura di pietra sono rinforzate
      con archi e nervature di metallo strappate alle rovine dei Precursori, e nei canali fra un blocco e
      l'altro scorre una luce azzurrina che non si spegne mai. Sotto le gradinate c'è il settore dei
      combattenti, dove Orvald Temmerin tiene il banco delle iscrizioni.

  - id: municipio
    area: quartieri-alti
    nome: Municipio
    immagine: ambientazione/quartieri-alti
    sommario: "Gli uffici della Rappresentante Julia Castaldi e del consiglio cittadino."
    testo: |
      Il Municipio ospita gli uffici della Rappresentante Julia Castaldi e la sala del consiglio cittadino.
      Gli impiegati ricevono di mattina, uno alla volta. Chi aspetta siede su una panca di legno consumata nel
      mezzo, sotto un ritratto della Rappresentante dipinto con più ottimismo che somiglianza.
