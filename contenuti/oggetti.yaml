    grado: 2
    proprieta: { talento: { magia: 1, medicina: 1 } }

  - id: registro-dei-malgrani
    nome: Registro dei pagamenti
    immagine: icone/book-cover
    descrizione: "Il registro dei pagamenti di Ottone Malgrani, rilegato in pelle con l'alloro impresso. Nove anni di somme versate agli Scuri e a chi doveva chiudere un occhio."
    slot: nessuno
    usa: leggere-il-registro-dei-malgrani

  # ------------------------------------------------------------ oggetti usabili
  - id: diario-di-isvaro
    nome: Diario di Isvaro
    immagine: icone/black-book
    descrizione: "Un libretto rilegato in pelle, pieno di mappe di Qir-Azel e di ritratti di una donna. Tre pagine sono scritte fitte."
    slot: nessuno
    usa: leggere-il-diario-di-isvaro

  - id: registratore-olografico
    nome: Cilindro di lyssan
    immagine: icone/film-projector
    descrizione: "Un cilindro di lyssan inciso, ammaccato, con un rotolo di pergamena dentro. Si apre, si chiude e, se gli dai la parola giusta, ronza."
    slot: nessuno
    usa: il-cilindro-di-lyssan

  - id: registro-del-ricettatore
    nome: Registro del ricettatore
    immagine: icone/notebook
    descrizione: "Un quaderno di conti pieno di nomi. Qualcuno pagherebbe per leggerlo, e qualcun altro per farlo sparire."
    slot: nessuno
    usa: usare-registro
