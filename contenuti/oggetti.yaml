    grado: 3
    proprieta: { lucida: true, talento: { magia: 2 } }
    difetti: [legata]

  - id: maschera-della-natura
    nome: Maschera della Natura
    immagine: icone/tree-branch
    descrizione: "Corteccia nera e muschio, con vene di metallo e linfa. Lega la carne alla macchina."
    slot: accessorio
    grado: 3
    proprieta: { schermata: true, talento: { natura: 2 } }
    difetti: [legata]

  - id: diario-di-aurenne
    nome: Diario di Aurenne
    immagine: icone/spell-book
    descrizione: "Un quaderno dalla copertina di stoffa, scritto in una grafia che cambia negli anni. Comincia in un'estate di nove anni fa."
    slot: nessuno
    usa: leggere-il-diario-di-aurenne

  # ------------------------------------------------------------ blocco 8: Arena, Maniero Malgrani, rovine
  - id: fermaglio-di-orvald
    nome: Fermaglio di Orvald
    immagine: icone/gem-pendant
    descrizione: "Filo d'argento intrecciato in figure geometriche, dalla collezione personale di Orvald Temmerin. Si scalda quando qualcuno vicino a te sta per lanciare un incantesimo."
    slot: accessorio
    grado: 2
    proprieta: { riserva: 1, talento: { magia: 1 } }

  - id: cintura-del-campione
    nome: Cintura del campione
    immagine: icone/belt-buckles
    descrizione: "Cuoio rosso con una fibbia di bronzo a forma di alloro, consumata dalle mani di chi l'ha portata prima di te. In Città Bassa la riconoscono da lontano."
    slot: accessorio
    grado: 2
    proprieta: { ostinata: true, talento: { intimidire: 1 } }

  - id: cristallo-della-visione-del-vero
    nome: Cristallo della visione del vero
    immagine: icone/crystal-eye
    descrizione: "Un cristallo grande come un uovo, tolto dal piedistallo del caveau dei Malgrani. Fa vedere quello che le persone nascondono, e la notte non ti lascia dormire."
    slot: accessorio
    grado: 3
    proprieta: { talento: { percezione: 2, empatia: 2 } }
    difetti: [inquieta]

  - id: fonte-di-energia
    nome: Fonte di energia
    immagine: icone/energy-tank
    descrizione: "Una sfera concentrica staccata dal reattore di Vhar'Ul. Ronza contro lo sterno e tiene caldo come un gatto addormentato."
    slot: accessorio
    grado: 2
    proprieta: { riserva: 2 }

  - id: modulo-di-isolamento
    nome: Modulo di isolamento acustico
    immagine: icone/silenced
    descrizione: "Una piastra dei Precursori grande come un palmo, presa dal magazzino del Laboratorio di Calibrazione. Appoggiata sul petto, mangia il rumore dei tuoi passi."
    slot: accessorio
    grado: 2
    proprieta: { silenziosa: true, talento: { furtivita: 1 } }

  - id: matrice-di-levigazione
    nome: Matrice di levigazione
    immagine: icone/dna2
    descrizione: "Un reticolo di vetro e filamenti dai depositi di Mahr-Kel. Serviva a ricucire i corpi, e nelle mani giuste ricuce anche gli incantesimi."
