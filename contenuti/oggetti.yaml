    grado: 0
    proprieta: { chiave: [stella] }

  - id: congegno-di-controllo
    nome: Congegno di controllo
    immagine: icone/circuitry
    descrizione: "Un disco dei Precursori grande come un palmo, con una corona di cristalli e una conca per il pollice. Aurenne lo portava al collo, e con questo teneva a bada le macchine della Salvaguardia."
    slot: nessuno
    proprieta: { talento: { tecnologia: 1 } }
    reperto: { tipo: passivo, cariche: 0, decifra: decifrare-congegno }

  - id: maschera-della-forza
    nome: Maschera della Forza
    immagine: icone/iron-mask
    descrizione: "Ferro brunito, un volto di donna impassibile, una nebbia rossa negli occhi. È la volontà di restare in piedi."
