# Oggetti magici, reliquie del Codex, reperti dei Precursori e oggetti usabili.
# Regolamento v0.4, 8.7–8.9, e docs/regolamento-oggetti.md. Grado = punti da spendere in dadi
# e proprietà; ogni difetto dà un punto in più. Accessori fino a +3, senza dadi.
oggetti:
  # ------------------------------------------------------------ reliquie dell'Armeria di Irsa
  - id: arco-lungo-composito-mira
    nome: Arco lungo composito (teso per la mira)
    immagine: icone/high-shot
    descrizione: "Tasso e corno scuro, con due ghiere a vite per regolare la tensione. Irsa l'ha tarato per chi ha risposto «mira»."
    slot: arma
    base: arco-lungo
    grado: 2
    dadi: 1
    proprieta: { penetrante: 1 }
    prezzo: 1600

  - id: arco-lungo-composito-forza
    nome: Arco lungo composito (teso per la forza)
    immagine: icone/high-shot
    descrizione: "Tasso e corno scuro, con due ghiere a vite per regolare la tensione. Irsa l'ha tarato per chi ha risposto «forza»."
    slot: arma
    base: arco-lungo
    grado: 2
    dadi: 1
    proprieta: { affilata: 1 }
    prezzo: 1600

  - id: balestra-vansaya
    nome: Balestra Vansaya
    immagine: icone/crossbow
    descrizione: "Calcio di legno scuro e avorio, caricatore a leva da sei dardi. Sul calcio c'è inciso «VANSAYA», in una lingua che nessuno in città riconosce."
    slot: arma
    base: balestra-pesante
    grado: 2
    dadi: 1
    proprieta: { caricatore: true, rapida: 1 }
    difetti: [inceppamento]
    prezzo: 2600

  - id: asce-da-lancio
    nome: Asce da lancio (set di tre)
    immagine: icone/crossed-axes
    descrizione: "Tre asce gemelle con il manico di frassino. Le lame sono di Bram Halgast, le piccole rune di richiamo sul dorso sono di Irsa."
    slot: arma
    base: coltelli-da-lancio
    grado: 1
    dadi: 1
    prezzo: 1400

  - id: cotta-di-maglia-di-irsa
    nome: Cotta di maglia di Irsa
    immagine: icone/chain-mail
    descrizione: "Strati di anelli e cuoio sottile della Conceria Kasselt, con le spalle rinforzate a ventaglio. Irsa avverte che la sera ti stancherà di più."
    slot: armatura
    base: cotta-di-maglia
    grado: 2
    dadi: 1
    proprieta: { robusta: 1 }
    difetti: [stancante]
    prezzo: 1800

  - id: giaco-di-maglia-di-irsa
    nome: Giaco di maglia di Irsa
    immagine: icone/armor-vest
    descrizione: "Maglia fitta con un motivo a zig-zag di anelli di bronzo, la firma di Irsa. Il bronzo assorbe il tintinnio degli anelli."
    slot: armatura
    base: cotta-di-maglia
    grado: 2
    dadi: 1
    proprieta: { silenziosa: true }
    prezzo: 2100

  - id: cuoio-borchiato-di-irsa
    nome: Cuoio borchiato di Irsa
    immagine: icone/leather-armor
    descrizione: "L'armatura personale di Irsa, in cuoio grigio con borchie a stella e una spirale di filo cremisi con cinque rune che scaricano l'urto dei colpi."
    slot: armatura
    base: cuoio-rinforzato
    grado: 1
    dadi: 1
    prezzo: 1500

  # ------------------------------------------------------------ reliquie della Fucina dei Due Mastini
  - id: re-della-collina
    nome: Re della Collina
    immagine: icone/piercing-sword
    descrizione: "Spadone dalla lama larga e scura, volutamente non del tutto dritta. Il nome glielo hanno dato i clienti, dopo un mercenario rimasto in piedi un round più del dovuto."
    slot: arma
    base: spadone
    grado: 2
    dadi: 1
    proprieta: { ostinata: true }
    prezzo: 1700

  - id: martello-dei-due-mastini
    nome: Martello dei Due Mastini
    immagine: icone/thor-hammer
    descrizione: "Un vecchio martello da fucina riforgiato, con il marchio delle incudini di Halgast sulla testa. Sfonda le porte e i gusci delle macchine."
    slot: arma
    base: martello-da-guerra
    grado: 2
    dadi: 1
    proprieta: { penetrante: 1, chiave: [sfondare] }
    prezzo: 2100

  - id: corazza-ostinata
    nome: Corazza ostinata
    immagine: icone/chest-armor
    descrizione: "Piastre irregolari e rivetti spessi. È stata rifatta tre volte, e una volta per un Raschiatore tornato vivo dal Labirinto."
    slot: armatura
    base: armatura-a-piastre
    grado: 3
    dadi: 1
    proprieta: { ultimoRespiro: true }
    difetti: [stancante]
    prezzo: 2300

  # ------------------------------------------------------------ reliquie del Nodo d'Ossidiana
  - id: anello-del-respiro-misurato
    nome: Anello del respiro misurato
    immagine: icone/big-diamond-ring
    descrizione: "Anello d'argento con rune minuscole che si leggono solo con la lente. Il corvo del bancone lo guarda come se lo riconoscesse."
    slot: accessorio
    grado: 2
    proprieta: { ultimoRespiro: true }
    prezzo: 1200

  - id: mantello-delle-correnti-laterali
    nome: Mantello delle correnti laterali
    immagine: icone/cloak
    descrizione: "Color petrolio con riflessi verdi. Vibra di lato anche quando l'aria è ferma, e ti sposta di lato quando serve."
    slot: accessorio
    grado: 2
    proprieta: { talento: { acrobazia: 1 }, chiave: [sottrarsi] }
    prezzo: 1800

  - id: amuleto-del-corvo-vigile
    nome: Amuleto del corvo vigile
    immagine: icone/raven
    descrizione: "Una piuma nera su un gancio di bronzo annerito. È tiepida anche d'inverno e gracchia prima di un'imboscata."
    slot: accessorio
    grado: 2
    proprieta: { talento: { percezione: 1 }, rapida: 1, chiave: [imboscate] }
    prezzo: 1300

  # ------------------------------------------------------------ cavalcature (docs/piano-capitolo-1.md)
  # Indossate come accessorio danno +1 a Cavalcare e la chiave "cavalcatura": l'ingresso nelle spedizioni
  # ha un'opzione a cavallo che costa un rintocco in meno.
  - id: cavallo-da-guerra
    nome: Cavallo da guerra
    immagine: icone/horse-head
    descrizione: "Un baio dal petto largo, con i finimenti completi e una cicatrice sulla spalla che non ricorda di essersi fatto. Corin l'ha pagato alle Scuderie della Zanna Rotta e non ha voluto sapere quanto."
    slot: accessorio
    grado: 1
    proprieta: { talento: { cavalcare: 1 }, chiave: [cavalcatura] }
    prezzo: 600

  - id: specchio-della-seconda-scelta
    nome: Specchio della seconda scelta
    immagine: icone/mirror-mirror
    descrizione: "Uno specchio ovale grande come un palmo, con il riflesso in ritardo. Sull'etichetta del cofanetto Ambrin ha scritto un'avvertenza."
    slot: accessorio
    grado: 3
    proprieta: { secondaScelta: true }
    prezzo: 1500

  # ------------------------------------------------------------ bottino di Via dei Rasoi (arco di Squiggor)
  - id: anello-del-pugno-saldo
    nome: Anello del pugno saldo
    immagine: icone/diamond-ring
    descrizione: "Ferro grezzo annerito, con un frammento di cristallo conduttore quasi esaurito al posto della pietra. Aiuta a non mollare la presa."
    slot: accessorio
    grado: 1
    proprieta: { talento: { atletica: 1 } }

  - id: mazza-ferrata-di-squiggor
    nome: Mazza ferrata di Squiggor
    immagine: icone/spiked-mace
    descrizione: "Ferro nero con quattro borchie quadrate e il manico di cuoio impregnato di sudore. Serve un braccio forte."
    slot: arma
    base: mazza
    grado: 2
    dadi: 1
    proprieta: { affilata: 1 }
    difetti: [pesante]

  - id: giacca-rinforzata-di-squiggor
    nome: Giacca rinforzata di Squiggor
    immagine: icone/layered-armor
    descrizione: "Brigantina di taglio degli Scuri, fatta per muoversi nei vicoli. Chi conosce gli Scuri la riconosce."
    slot: armatura
    base: cuoio-rinforzato
    grado: 1
    dadi: 1
    difetti: [riconoscibile]

  - id: spadone-runico-di-capomozzo
    nome: Spadone runico di Capomozzo
    immagine: icone/rune-sword
    descrizione: "Spadone orchesco con la lama corrosa e le rune di Capomozzo. Quando ferisce manda un vapore tiepido."
    slot: arma
    base: spadone
    grado: 2
    proprieta: { affilata: 2 }
    difetti: [legata, inquieta]

  # ------------------------------------------------------------ reperti dei Precursori (8.8)
  - id: arma-a-impulsi
    nome: Arma a impulsi
    immagine: icone/ray-gun
    descrizione: "Un tubo di metallo precuriano con un'impugnatura che non è fatta per mani umane. Si usa con Mentale + Tecnologia."
    slot: nessuno
    reperto: { tipo: attacco, cariche: 3, danno: 4, ignora: 2, decifra: decifrare-arma-a-impulsi }

  - id: respiratore
    nome: Respiratore
    immagine: icone/gas-mask
    descrizione: "Una maschera di lega grigia che si stringe al viso da sola. Dimezza la Contaminazione; insieme a un oggetto Schermato la azzera."
    slot: nessuno
    proprieta: { schermata: true }
    reperto: { tipo: passivo, cariche: 0, decifra: decifrare-respiratore }

  - id: campo-di-forza
    nome: Campo di forza
    immagine: icone/energy-shield
    descrizione: "Un disco da portare sul petto. Acceso, ti avvolge in una luce che devia i colpi e ti dà +2 dadi in difesa per 3 round."
    slot: nessuno
    reperto: { tipo: difesa, cariche: 2, modifica: { tipo: difesa, valore: 2, round: 3 }, decifra: decifrare-campo-di-forza }

  - id: visore
    nome: Visore
    immagine: icone/cyber-eye
    descrizione: "Una lente di cristallo montata su un archetto di metallo. Mostra le cose un attimo prima che si muovano e dà +2 dadi a Percezione."
    slot: nessuno
    proprieta: { talento: { percezione: 2 } }
    reperto: { tipo: passivo, cariche: 0, decifra: decifrare-visore }

  - id: iniettore
    nome: Iniettore
    immagine: icone/syringe
    descrizione: "Un cilindro che si appoggia al braccio e punge. In combattimento fa recuperare 5 PF; fuori dal combattimento toglie una Ferita."
    slot: nessuno
    usa: usare-iniettore
    reperto: { tipo: cura, cariche: 2, cura: 5, decifra: decifrare-iniettore }

  - id: bacchetta-della-stretta-folgorante
    nome: Bacchetta della stretta folgorante
    immagine: icone/crystal-wand
    descrizione: "Una bacchetta di ferro contorto che finisce con una punta biforcuta. Puntata contro qualcuno, lo afferra con una scarica nera. Si usa con Mentale + Tecnologia."
    slot: nessuno
    reperto: { tipo: attacco, cariche: 4, danno: 3, ignora: 1, decifra: decifrare-bacchetta }

  # ------------------------------------------------------------ armi del blocco 6
  - id: spadone-di-uzgreth
    nome: Spadone di Uzgreth
    immagine: icone/two-handed-sword
    descrizione: "Uno spadone forgiato per un ogre e preso in battaglia dall'eroe dei Nove Chiodi. Pesa quanto un bambino e taglia come se avesse fretta."
    slot: arma
    base: spadone
    grado: 2
    proprieta: { affilata: 3 }
    difetti: [pesante]
    prezzo: 300

  - id: arco-di-isvaro
    nome: Arco di Isvaro
    immagine: icone/high-shot
    descrizione: "Un arco lungo di legno chiaro, di fattura elfica, con la corda di budello trattato. Il suo padrone tirava prima di chiunque altro."
    slot: arma
    base: arco-lungo
    grado: 1
    proprieta: { rapida: 1 }
    prezzo: 200

  # ------------------------------------------------------------ blocco 7: Capomozzo
  - id: ombrafosca
    nome: Ombrafosca
    immagine: icone/horse-head
    descrizione: "Uno stallone nero dai riflessi iridescenti, con gli occhi color argento e le narici che fumano d'inverno. Gli orchi l'avevano chiuso in gabbia e lui ne ha uccisi due."
    slot: accessorio
    grado: 2
    proprieta: { talento: { cavalcare: 2 }, chiave: [cavalcatura] }

  - id: pugnale-dell-arpia
    nome: Pugnale dell'arpia
    immagine: icone/curvy-knife
    descrizione: "Un pugnale con l'impugnatura di madreperla, uno dei sette inchiodati nelle ali d'arpia della sala dei trofei."
