    prezzo: 160

  - id: giaco-di-balthog
    nome: Giaco di maglia di Balthog
    immagine: icone/chain-mail
    descrizione: "Un giaco di maglia fine, troppo bello per un orco. Era nel forziere di Balthog, piegato sotto la tunica di seta."
    slot: armatura
    base: cotta-di-maglia
    grado: 2
    proprieta: { robusta: 1 }
    prezzo: 400

  - id: cristalli-anti-marea
    nome: Cristalli anti-Marea
    immagine: icone/crystal-earrings
    descrizione: "Quattro cristalli legati a un cordino, che Aurenne portava al collo per attraversare la Marea Grigia. Dimezzano la Contaminazione."
