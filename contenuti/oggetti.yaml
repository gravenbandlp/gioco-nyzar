    grado: 3
    proprieta: { secondaScelta: true, talento: { empatia: 1 } }
    difetti: [legata]

  - id: maschera-della-distorsione
    nome: Maschera della Distorsione
    immagine: icone/cracked-mask
    descrizione: "Vetro incrinato, con ombre che sembrano mani giunte. Dietro ci sono convinzioni che forse non sono tue."
