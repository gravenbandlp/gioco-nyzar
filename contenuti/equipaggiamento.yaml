# Regolamento v0.4, 8.3–8.5. Ogni voce è anche un oggetto comune con lo stesso id
# (lo genera il build); le versioni magiche e le reliquie stanno in oggetti.yaml.
# Ribilanciate il 23 ottobre 2026 (docs/regolamento-oggetti.md): ogni famiglia ha il suo vantaggio, le spade
# Bilanciate, le asce Spietate, mazze e martelli Contundenti, lance e archi a Portata, le balestre Perforanti con
# Ricarica. I prezzi seguono la probabilità media di vittoria su un campione di scontri.
armi:
  # --- mischia
  - { id: mani-nude, immagine: icone/fist, nome: A mani nude, abilita: rissa, danno: 0 }
  - { id: tirapugni, immagine: icone/brass-knuckles, nome: Tirapugni, abilita: rissa, danno: 1, proprieta: [Occultabile], prezzo: 5 }
  - { id: pugnale, immagine: icone/plain-dagger, nome: Pugnale, abilita: armi-da-mischia, danno: 1, proprieta: [Leggera, Occultabile], prezzo: 10 }
  - { id: spada-corta, immagine: icone/gladius, nome: Spada corta, abilita: armi-da-mischia, danno: 1, proprieta: [Leggera, Bilanciata], prezzo: 35 }
  - { id: lancia, immagine: icone/spear-hook, nome: Lancia, abilita: armi-da-mischia, danno: 1, proprieta: [Portata], prezzo: 30 }
  - { id: mazza, immagine: icone/flanged-mace, nome: Mazza, abilita: armi-da-mischia, danno: 2, proprieta: [Contundente], prezzo: 60 }
  - { id: ascia-da-battaglia, immagine: icone/battle-axe, nome: Ascia da battaglia, abilita: armi-da-mischia, danno: 2, proprieta: [Spietata], prezzo: 50 }
  - { id: spada-lunga, immagine: icone/broadsword, nome: Spada lunga, abilita: armi-da-mischia, danno: 2, proprieta: [Bilanciata], prezzo: 60 }
  - { id: ascia-bipenne, immagine: icone/sharp-axe, nome: Ascia bipenne, abilita: armi-da-mischia, danno: 3, proprieta: [Due mani, Spietata], prezzo: 90 }
  - { id: martello-da-guerra, immagine: icone/warhammer, nome: Martello da guerra, abilita: armi-da-mischia, danno: 3, proprieta: [Due mani, Contundente], prezzo: 115 }
  - { id: spadone, immagine: icone/relic-blade, nome: Spadone, abilita: armi-da-mischia, danno: 4, proprieta: [Due mani], prezzo: 120 }
  # --- distanza
  - { id: fionda, immagine: icone/sling, nome: Fionda, abilita: armi-da-distanza, danno: 0, proprieta: [Occultabile], prezzo: 2 }
  - { id: coltelli-da-lancio, immagine: icone/thrown-daggers, nome: Coltelli da lancio, abilita: armi-da-distanza, danno: 1, proprieta: [Leggera, Occultabile], prezzo: 15 }
  - { id: arco-corto, immagine: icone/bow-arrow, nome: Arco corto, abilita: armi-da-distanza, danno: 1, proprieta: [Due mani, Portata], prezzo: 35 }
  - { id: balestra-leggera, immagine: icone/crossbow, nome: Balestra leggera, abilita: armi-da-distanza, danno: 4, proprieta: [Due mani, Perforante, Ricarica], prezzo: 70 }
  - { id: arco-lungo, immagine: icone/bow-string, nome: Arco lungo, abilita: armi-da-distanza, danno: 2, proprieta: [Due mani, Portata], prezzo: 75 }
  - { id: balestra-pesante, immagine: icone/pocket-bow, nome: Balestra pesante, abilita: armi-da-distanza, danno: 5, proprieta: [Due mani, Perforante, Ricarica], prezzo: 130 }

armature:
  - { id: nessuna, immagine: icone/shirt, nome: Abiti da strada, riduzione: 0 }
  - { id: giaco-imbottito, immagine: icone/leather-vest, nome: Giaco imbottito, riduzione: 1, prezzo: 15 }
  - { id: cuoio-rinforzato, immagine: icone/leather-armor, nome: Cuoio rinforzato, riduzione: 2, penalita: { furtivita: -1 }, prezzo: 50 }
  - { id: cotta-di-maglia, immagine: icone/chain-mail, nome: Cotta di maglia, riduzione: 3, penalita: { acrobazia: -1, furtivita: -1 }, prezzo: 150 }
  - { id: armatura-a-piastre, immagine: icone/breastplate, nome: Armatura a piastre, riduzione: 4, penalita: { acrobazia: -2, furtivita: -2, atletica: -1 }, prezzo: 400 }

scudi:
  - { id: scudo, immagine: icone/round-shield, nome: Scudo, dadi: 1, prezzo: 20 }
