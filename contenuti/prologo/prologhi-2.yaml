# Prologhi: il giorno del Festival delle Foglie Alate, visto da quattro origini.
# Mercante dei Ponti, Figlio del Circolo, Fuggiasco di Ghoran, Allievo di Torvessa.
# Ogni esito porta a tre-giorni-dopo, che azzera la quality prologo.
storylet:
  # ------------------------------------------------------------ Mercante dei Ponti
  - id: prologo-mercante-dei-ponti
    immagine: personaggi/corin-ashdale
    titolo: Il banco vicino alla porta nord
    sommario: "Al mercato del Festival un cinghiale corazzato risale la strada della porta nord con un orco in sella."
    luogo: Mercato del Festival, verso la porta nord
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.mercante-dei-ponti >= 1]
    testo: |
      È il primo giorno d'autunno, e il Festival delle Foglie Alate è
      cominciato stamattina. Hai piazzato il banco in fondo al mercato, dove la
      strada piega verso la porta nord. Vendi castagne secche in sacchi di
      tela, e a mezzogiorno, mentre Padre Vantes liberava le farfalle
      foglia-rossa, ne avevi già vendute metà.

      Al tramonto dalla piazza arrivano le prime grida. Poco dopo dal fondo
      della strada sbuca un cinghiale alto al garrese quanto un uomo, con la
      pelle nera e un sibilo di vapore che gli esce dal muso. In sella c'è un
      orco enorme, e dietro di lui vengono tre gregari che cantano.

      Davanti al cinghiale corre un uomo con un mantello di velluto. Il suo
      cane da caccia si volta ad affrontare la bestia e resiste poco, e l'uomo
      inciampa a due passi dal tuo banco. L'occhio ti va per abitudine alla
      fibbia d'argento del mantello prima che alla faccia.

      {atletica Media} Fra il banco e l'uomo ci sono due passi e mezzo. Le
      gambe li hanno già contati, e aspettano soltanto che il cinghiale abbassi
      la testa.

      {politica-ed-economia Media} Argento lavorato a sbalzo. Un uomo che si
      veste così ha qualcuno che domani chiederà chi l'ha aiutato.

      *Uno così, se lo salvi, se lo ricorda.* Sotto il bancone tieni la cassa
      con l'incasso della giornata.
    opzioni:
      - testo: "Tirare l'uomo dietro il banco"
        descrizione: "Bisogna cogliere il momento in cui il cinghiale abbassa la testa, e poi tirare forte."
        costo: 0
        prova: { attributo: mentale, abilita: [percezione, atletica], difficolta: Media }
        successo:
          titolo: Una faccia da ricordare
          testo: |
            Aspetti che il cinghiale abbassi il muso sul cane, e allora afferri
            l'uomo e lo trascini sotto il bancone. La bestia passa così vicino che
            il vapore ti bagna la nuca, finché arrivano le guardie e l'orco
            richiama i suoi.

            L'uomo ti stringe il polso e ti guarda in faccia. «Sono Corin Ashdale,
            della Gilda» dice, «e alloggio al Grifone di Ferro finché non riparto
            per Laresh.»
          effetti: { racconto: 1, rep.gilda: 0.5 }
          imposta: { prologo: 2, corin.salvato: 1 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Il fianco del cinghiale
          testo: |
            Esci da dietro il banco nel momento sbagliato. Il cinghiale scarta e
            ti prende di striscio con il fianco corazzato, caldo come una stufa, e
            finisci contro il palo della tenda. L'uomo ben vestito si trascina da
            solo dietro un barile senza vederti, e il livido sul fianco ti dura
            una settimana.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Rovesciare le castagne in mezzo alla strada"
        descrizione: "Il cinghiale tiene il muso basso, e le castagne le ha fiutate da venti passi."
        costo: 0
        prova: { attributo: mentale, abilita: [percezione, addestrare-animali], difficolta: Facile }
        successo:
          titolo: Castagne sul selciato
          testo: |
            Squarci due sacchi con il pugnale e li rovesci davanti al banco. Il
            cinghiale frena e affonda il muso nelle castagne, e per quanto l'orco
            lo prenda a calci non vuole più andare avanti. L'uomo ben vestito
            striscia dietro un barile senza vedere chi l'ha aiutato, e tu da
            dietro il banco ti sorprendi a calcolare a prezzo di festa quanto ti
            costa ogni boccone.
          effetti: { racconto: 1, monete: -2 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Il muso nel banco
          testo: |
            Fai in tempo a squarciare un sacco solo. Il cinghiale fiuta le
            castagne ancora nel banco e ci si butta con tutto il peso, e la tenda
            ti crolla addosso con il palo in testa. Quando esci dalla tela l'uomo
            ben vestito è sparito, e del banco restano due assi e un sacco
            calpestato con l'impronta intera di uno zoccolo.
          effetti: { ferite: 0.5, monete: -2 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Mettere al sicuro la cassa"
        descrizione: "Sotto il bancone c'è l'incasso di tutta la giornata, e l'uomo ben vestito è uno sconosciuto."
        costo: 0
        esito:
          titolo: L'incasso della giornata
          testo: |
            Ti butti a terra con la cassa stretta al petto e resti fra i sacchi
            mentre il cinghiale ti passa accanto. Da sotto il bancone vedi i
            gregari circondare l'uomo ben vestito, poi le guardie della porta che
            arrivano di corsa, e per ultime tre figure di metallo che calano dai
            tetti vicini, lente come ragni. Dentro la cassa c'è l'incasso intero,
            e nessuno ti ha visto.
          effetti: { racconto: 1, monete: 4 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ Figlio del Circolo
  - id: prologo-figlio-del-circolo
    immagine: bestiario/dorbak
    titolo: La bestia della porta nord
    sommario: "Al tramonto del Festival un cinghiale mutato dalla Marea entra dalla porta nord, e soffre."
    luogo: Porta nord, al tramonto del Festival
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.figlio-del-circolo >= 1]
    testo: |
      Sei sceso in città per il Festival delle Foglie Alate, perché volevi
      vedere le farfalle foglia-rossa che nel Bosco di Velthar si raccontano ai
      bambini. A mezzogiorno Padre Vantes le ha liberate davanti alla
      cattedrale nuova. Al tramonto sei vicino alla porta nord, dove i
      carrettieri legano i cavalli, quando dalla piazza arrivano le urla.

      Il cinghiale entra dalla strada del Daino Zoppo con un orco in sella. È
      alto al garrese quanto un uomo, con la pelle nera e vene color acciaio
      che pulsano sotto la cotenna, e ha il respiro spezzato. L'odore di ferro
      caldo e pelo bruciato ti arriva prima del resto, lo stesso della volpe
      toccata dalla Marea che da bambino hai visto abbattere nel Bosco.

      {natura Facile} Al Circolo ti hanno insegnato ad ascoltare una bestia
      prima di guardarla. Questa scuote la testa per scrollarsi di dosso un
      bruciore che ha dentro, dove il metallo le corre nelle vene.

      *Non vuole essere qui più di te.* L'orco la sprona con i talloni proprio
      dove le vene affiorano. Dietro di lui un gregario ti ha già visto e ti
      viene incontro con l'ascia alzata, e alle tue spalle i cavalli dei
      carrettieri tirano le corde, mentre la folla che fugge dalla piazza passa
      in mezzo a loro.
    opzioni:
      - testo: "Affrontare il gregario"
        descrizione: "Canta mentre carica e non para. Da vicino il tuo arco serve poco."
        costo: 0
        combattimento: razzia-orco
        vittoria:
          titolo: Uno di meno
          testo: |
            Il gregario cade sul selciato e continua a cantare finché ha fiato, e
            le tue dita non vogliono lasciare l'arco. Il cinghiale è già in fondo
            alla strada, verso la porta. Una delle guardie rimaste indietro ti
            chiede come ti chiami, lo ripete due volte storpiandolo, poi una terza
            giusta, e ti batte la mano sulla spalla per fissarlo lì.
          effetti: { racconto: 1, rep.caserma: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        sconfitta:
          titolo: L'ascia di piatto
          testo: |
            Il gregario ti prende con il piatto dell'ascia e ti manda a terra fra
            le zampe dei cavalli, dove uno zoccolo ferrato si posa a un palmo
            dalla tua mano e poi, con molto giudizio, si sposta. Ti rialzi quando
            le guardie lo abbattono. Del cinghiale ti resta il sibilo che si
            allontana verso la porta, e il pensiero ostinato che fra voi due
            quello messo peggio sia lui.
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Calmare i cavalli e ascoltare la bestia"
        descrizione: "Al Circolo si parla agli animali con la voce bassa e le mani ferme."
        costo: 0
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Facile }
        successo:
          titolo: Quello che dice il cinghiale
          testo: |
            Ti metti fra i cavalli e parli piano, con la voce che al Circolo si
            usa per i puledri, e uno alla volta smettono di tirare le corde, così
            la gente in fuga passa senza finire sotto gli zoccoli. Poi guardi il
            cinghiale, che carica ogni volta che i talloni dell'orco premono sulle
            vene di metallo, e capisci che chi l'ha mutata la guida con il dolore.
          effetti: { racconto: 1, rep.circolo: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Uno zoccolo
          testo: |
            I cavalli sentono l'odore del cinghiale più forte della tua voce, e un
            baio spezza la corda e ti prende alla spalla con lo zoccolo. Quando ti
            rialzi il cinghiale è già lontano e la strada è piena di gente che
            zoppica. Il baio trema contro il muro della porta, e ti avvicini piano
            parlandogli a bassa voce, con il braccio che ti penzola, finché si
            lascia toccare.
          effetti: { ferite: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Tirare con l'arco da dietro un carro"
        descrizione: "Da dietro un carro rovesciato il gregario è a trenta passi, e l'orco in sella poco più in là."
        costo: 0
        prova: { attributo: fisico, abilita: [armi-da-distanza], difficolta: Facile }
        successo:
          titolo: Una freccia nella spalla
          testo: |
            Ti butti dietro il carro e incocchi, con le dita che tremano solo
            finché la corda non è tesa. La prima freccia prende il gregario alla
            spalla, la seconda lo ferma a metà strada, e le guardie della porta
            fanno il resto. Tiri anche all'orco in sella, e la freccia rimbalza
            sulla corazza del cinghiale con un tintinnio da pentola. Dopo la
            battaglia una guardia ti chiede dove hai imparato.
          effetti: { racconto: 1, rep.caserma: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Troppo vicino
          testo: |
            Le frecce vanno larghe, perché la gente in fuga ti passa davanti e tu
            alzi la punta ogni volta per non prendere nessuno. Il gregario ti
            raggiunge dietro il carro, la corda si spezza sulla parata e l'ascia
            ti apre il braccio. Ti salva una guardia della porta, che lo trafigge
            con la lancia e prosegue senza nemmeno sapere di averti salvato.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ Fuggiasco di Ghoran
  - id: prologo-fuggiasco-di-ghoran
    immagine: bestiario/orco-sacerdote-guerriero
    titolo: Il tamburo in piazza
    sommario: "In piazza un orco batte un tamburo con un ritmo che hai già sentito a Ghoran."
    luogo: Piazza dei Quartieri Alti, davanti alla cattedrale nuova
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.fuggiasco-di-ghoran >= 1]
    testo: |
      Sei in piazza davanti alla cattedrale nuova, in mezzo alla gente che
      aspetta la preghiera del tramonto. A pranzo hai mangiato due volte
      cambiando fila, e ti sei messo in tasca un pezzo di pane per dopo.
      Quando Padre Vantes sale sul palco una donna grida, e da sud si alza il
      fumo del carro del combustibile per il falò.

      Gli orchi entrano in piazza correndo, e dietro di loro arriva quello col
      tamburo, che batte il tempo con il pomo della mazza mentre gli altri
      cantano. A Ghoran gli orchi dei recinti cantavano così prima delle
      punizioni, con un verso lungo e uno corto, e la schiena se lo ricorda
      prima di te e si curva da sola. Della litania capisci soltanto una
      parola, quella che a Ghoran i sorveglianti usavano per la Marea Grigia,
      e che questi orchi gridano come un invito.

      Padre Vantes è sceso dal palco e si china su un ferito senza badare agli
      orchi. Tre dei più giovani, poco più che ragazzi, girano attorno al
      tamburo in attesa di un ordine.

      {intimidire Media} Cantano mezzo verso in ritardo, e chi canta in
      ritardo ha paura di sbagliare davanti al capo.

      *Un ordine lo sai dare anche tu, se ti ricordi come si grida.* Ti
      stringi il pane in tasca fino a sbriciolarlo.
    opzioni:
      - testo: "Andare dritto al tamburo"
        descrizione: "Senza il tamburo gli altri perdono il tempo, e il pomo della sua mazza è di ferro."
        costo: 0
        combattimento: razzia-tamburo
        vittoria:
          titolo: Il tamburo sfondato
          testo: |
            L'orco cade in ginocchio sopra il suo tamburo e lo sfonda con il
            proprio peso. Canta finché può, e da vicino senti la litania intera.
            Intorno a te gli orchi più giovani perdono il ritmo e si sbandano. Un
            sergente della guardia ti guarda le mani sporche e non ti chiede da
            dove vieni, e tu gli sei grato più di quanto sapresti dire.
          effetti: { racconto: 1, informazioni.voce: 1, rep.caserma: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        sconfitta:
          titolo: Il pomo della mazza
          testo: |
            Il pomo della mazza ti prende alla tempia e ti ritrovi con la guancia
            sulle pietre della piazza, ancora tiepide del sole di mezzogiorno.
            Resti giù ad ascoltare, e la litania ti entra in testa verso dopo
            verso. Quando le guardie abbattono l'orco la sai quasi a memoria, e
            sai anche che a Ghoran quel ritmo non l'hai mai sentito cantare in
            piazza.
          effetti: { informazioni.voce: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Fare da muro davanti a Padre Vantes"
        descrizione: "Il prete non si sposta dal suo ferito. Qualcuno deve restare in piedi fra lui e gli orchi."
        costo: 0
        prova: { attributo: fisico, abilita: [resistenza], difficolta: Media }
        successo:
          titolo: In piedi
          testo: |
            Ti pianti davanti al prete a gambe larghe. Il primo orco ti arriva
            addosso con la spalla e rimbalza, il secondo ti apre un taglio
            sull'avambraccio, e tu resti dove sei finché le guardie non li
            prendono alle spalle. Quando alza gli occhi dal suo ferito, Padre
            Vantes ti ringrazia con il tuo nome, che gli hai detto tu a metà
            battaglia senza accorgertene.
          effetti: { racconto: 1, informazioni.voce: 1, rep.velo: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Travolto
          testo: |
            Il primo orco ti travolge e Padre Vantes ti trascina dietro il palco
            per le ascelle, con una forza che da un uomo in tonaca non ti
            aspettavi. Resti lì fino alla fine, con la testa che gira, mentre
            dall'altra parte la litania continua a tornare sulla parola della
            Marea. Ogni tanto cade dall'alto una farfalla foglia-rossa stordita
            dal fumo.
          effetti: { ferite: 1, informazioni.voce: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Gridare ai più giovani nella lingua dei recinti"
        descrizione: "A Ghoran hai imparato come gridano i sorveglianti orchi. Quei ragazzi aspettano un ordine, e potresti darglielo tu."
        costo: 0
        prova: { attributo: sociale, abilita: [intimidire], difficolta: Facile }
        successo:
          titolo: L'ordine sbagliato
          testo: |
            Riempi il petto e gridi le poche parole che ricordi dei sorveglianti
            di Ghoran, quelle per mandare via i cani. I tre ragazzi si voltano
            verso di te, poi verso il tamburo, e scappano verso il crinale a testa
            bassa. Più tardi senti dire che alcuni orchi, braccati sull'orlo, si
            sono buttati dalla rupe, e il dubbio che fossero loro ti tiene sveglio
            più della litania.
          effetti: { racconto: 1, informazioni.voce: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: La voce che si rompe
          testo: |
            La voce ti si rompe sulla seconda parola, e ne esce un suono alto e
            stonato. I ragazzi riconoscono in te uno scappato dai recinti e ridono, e
            il più grosso ti colpisce al fianco con il manico dell'ascia prima di
            tornare a cantare con gli altri. Dal selciato ascolti la litania fino alla
            fine, e la parola della Marea ti resta addosso per tutta la notte.
          effetti: { ferite: 0.5, informazioni.voce: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ Allievo di Torvessa
  - id: prologo-allievo-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: I cristalli del banco
    sommario: "Al banco dell'Accademia di Torvessa, poco prima che le macchine scendano dai tetti, i cristalli vibrano tutti insieme."
    luogo: Fiera del Festival, al banco dell'Accademia di Torvessa
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.allievo-di-torvessa >= 1]
    testo: |
      L'Accademia ha montato il suo banco sul lato della piazza che guarda la
      cattedrale nuova, sotto una tenda grigia con il sigillo del cerchio
      incompleto. Sul panno sono allineati sei cristalli conduttori su
      supporti di ottone. Orvald Temmerin legge su uno sgabello, girando le
      pagine con la punta di un coltello da frutta che nessuno gli ha mai
      visto usare per la frutta, e sul palo della tenda il suo corvo, Pett, si
      liscia le penne.

      Al tramonto dalla piazza arrivano le urla, e gli orchi entrano correndo
      da sud. Temmerin chiude il libro con il coltello dentro e ti dice di
      restare dietro il banco, nel tono che usa in aula per chiedere silenzio.
      Due studenti del primo anno si sono infilati sotto il tavolo.

      Poi i cristalli vibrano tutti insieme, una nota breve che senti nei
      denti prima che nelle orecchie. Sono stati tagliati in anni diversi da
      mani diverse, e niente dovrebbe farli rispondere nello stesso momento.

      {magia Media} Il Mana nei sei cristalli si è orientato tutto dalla
      stessa parte, verso nord.

      Sopra i tetti che scendono alla porta nord, tre sagome di metallo calano
      dalle grondaie lente come ragni e spariscono dietro i comignoli. Intanto
      un orco col viso dipinto sta già correndo verso il vostro banco.
    opzioni:
      - testo: "Fermare l'orco che punta al banco"
        descrizione: "È uno solo e non si cura dei colpi. Il Dardo lo colpisce prima che ti arrivi addosso."
        costo: 0
        combattimento: razzia-orco
        vittoria:
          titolo: Il Dardo
          testo: |
            L'orco crolla davanti al banco, e il panno si sporca di sangue proprio
            sotto i cristalli. Pett gli gira intorno due volte come un assistente
            che controlla un compito. «Il secondo Dardo era più preciso del primo»
            dice Temmerin, e si volta verso i tetti della porta nord, dove sono
            sparite le macchine. È il complimento più lungo che ti abbia mai
            fatto.
          effetti: { racconto: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        sconfitta:
          titolo: Il tavolo rovesciato
          testo: |
            Il Dardo lo prende di striscio e l'orco ti arriva addosso ridendo.
            Finisci a terra con il banco rovesciato sulle gambe, fra i cristalli
            sparsi sul selciato. Quando riapri gli occhi l'orco è morto e Temmerin
            raccoglie i cristalli contandoli ad alta voce, e arrivato a quattro
            ricomincia da capo, come se il numero potesse cambiare. Gli altri due
            non li ritrovate più.
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Capire il segnale dei cristalli"
        descrizione: "La nota si ripete sempre uguale. Se riesci a contarla prima che finisca, forse capisci da dove viene."
        costo: 0
        prova: { attributo: mentale, abilita: [magia, tecnologia], difficolta: Media }
        successo:
          immagine: bestiario/salvaguardia-precursori
          titolo: Tre impulsi
          testo: |
            Metti due dita sul cristallo più vicino e conti due impulsi brevi e uno
            lungo, tre volte. È un segnale fra cristalli, e quelli del banco l'hanno
            raccolto per caso.

            {tecnologia Difficile} Un segnale così forte non lo manda un cristallo
            tagliato a Torvessa.

            Temmerin scrive la sequenza sul retro di un listino. «Per adesso tienilo per
            te» dice. A nord le macchine si sono già messe in cammino.
          effetti: { racconto: 1, informazioni.voce: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Una crepa
          testo: |
            Stringi il cristallo più vicino per sentire meglio la vibrazione, e
            quello si incrina fra le tue dita aprendoti il palmo. Temmerin ti
            fascia la mano con il fazzoletto senza dire niente. Il segnale è già
            finito e le macchine sono sparite verso la porta nord, e del cristallo
            incrinato resta un moncone opaco che il preside si mette in tasca.
          effetti: { ferite: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Mettere al sicuro gli strumenti e i ragazzi"
        descrizione: "I due del primo anno sono sotto il tavolo, e i cristalli valgono più di tutto quello che possiedi."
        costo: 0
        esito:
          titolo: Sotto il portico
          testo: |
            Avvolgi i cristalli nel panno e li chiudi nella cassa, poi porti i due ragazzi
            di corsa sotto il portico della cattedrale, dove un diacono tiene aperta una
            porta laterale. Da lì vedi Temmerin rimasto al banco con Pett sulla spalla.
            Quando un orco si avvicina alza appena una mano, con il gesto con cui a lezione
            ti fa segno di sederti, e l'orco cade.
          effetti: { racconto: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
