# Prologhi: il giorno del Festival delle Foglie Alate, visto da quattro origini.
# Mercante dei Ponti, Figlio del Circolo, Fuggiasco di Ghoran, Allievo di Torvessa.
# Ogni esito porta a tre-giorni-dopo, che azzera la quality prologo.
storylet:
  # ------------------------------------------------------------ Mercante dei Ponti
  - id: prologo-mercante-dei-ponti
    immagine: personaggi/corin-ashdale
    titolo: Il banco vicino alla porta nord
    sommario: "Il primo giorno d'autunno, al mercato del Festival. Un cinghiale corazzato risale la strada della porta nord con un orco in sella."
    luogo: Mercato del Festival, verso la porta nord
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.mercante-dei-ponti >= 1]
    testo: |
      È il primo giorno d'autunno e il Festival delle Foglie Alate è cominciato stamattina. Hai piazzato il
      banco in fondo al mercato, dove la strada piega verso la porta nord e la locanda del Daino Zoppo. Vendi
      castagne secche in sacchi di tela, e a mezzogiorno ne avevi già vendute metà. Le pesi su una bilancia a
      piatti di ottone, e i pesi di ferro li tieni in fila sul bancone dal più grande al più piccolo.

      Al tramonto dalla piazza arrivano le prime grida. Poco dopo dal fondo della strada sbuca un cinghiale
      dalla pelle nera e lucida, con vene color acciaio sotto la cotenna e il muso che sibila vapore. Tiene il
      muso così basso che quasi sfiora il selciato, e le narici gli si allargano verso i tuoi sacchi. In sella
      c'è un orco più grosso di tutti quelli che hai mai visto, e dietro di lui vengono tre gregari che
      cantano.

      Davanti al cinghiale corre un uomo ben vestito con un cane da caccia alle calcagna. Il cane si volta ad
      affrontare la bestia e resiste poco. L'uomo inciampa a due passi dal tuo banco, e per abitudine l'occhio
      ti va alla fibbia d'argento del suo mantello prima che alla faccia. È argento buono lavorato a sbalzo, e
      da solo vale più di tutto il tuo banco.

      {atletica Media} Fra il banco e l'uomo ci sono due passi e mezzo, e le gambe aspettano soltanto che il
      cinghiale abbassi la testa.

      *Uno così, se lo salvi, se lo ricorda.* Sotto il bancone tieni la cassa con l'incasso della giornata.
    opzioni:
      - testo: "Tirare l'uomo dietro il banco"
        descrizione: "Bisogna cogliere il momento in cui il cinghiale abbassa la testa, e poi tirare forte."
        costo: 0
        prova: { attributo: mentale, abilita: [percezione, atletica], difficolta: Media }
        successo:
          titolo: Una faccia da ricordare
          testo: |
            Aspetti che il cinghiale abbassi il muso sul cane, poi afferri l'uomo per il bavero e lo trascini
            sotto il bancone, fra i sacchi. La bestia passa così vicino che il vapore ti bagna la nuca, e lo
            senti raffreddarsi sulla pelle mentre i gregari frugano la strada. Ha l'odore del ferro lasciato a
            scaldare sulla brace.

            L'uomo ti stringe il polso con tutte e due le mani. «Corin Ashdale, della Gilda» dice. «Alloggio
            al Grifone di Ferro finché non riparto per Laresh.» Poi ti guarda a lungo in faccia prima di
            lasciarti il polso.
          effetti: { racconto: 1, rep.gilda: 0.5 }
          imposta: { prologo: 2, corin.salvato: 1 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Il fianco del cinghiale
          testo: |
            Esci da dietro il banco nel momento sbagliato. Il cinghiale scarta di lato e ti prende di striscio
            con il fianco corazzato, caldo come una stufa, e finisci contro il palo della tenda con le
            orecchie che fischiano. Dove ti ha toccato la camicia è strinata e sa di pelo bruciato.

            Quando riesci a rialzarti le guardie della porta sono già addosso ai gregari. L'uomo ben vestito
            si è trascinato da solo dietro un barile di scolo senza vederti, e il livido sul fianco ti dura
            una settimana.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Rovesciare le castagne in mezzo alla strada"
        descrizione: "La Marea lo ha mutato, ma il cinghiale tiene il muso basso e le castagne le ha fiutate da venti passi."
        costo: 0
        prova: { attributo: mentale, abilita: [percezione, addestrare-animali], difficolta: Facile }
        successo:
          titolo: Castagne sul selciato
          testo: |
            Squarci due sacchi con il pugnale e li rovesci davanti al banco. Il cinghiale frena sugli zoccoli
            e affonda il muso nelle castagne, e per quanto l'orco lo prenda a calci nei fianchi non vuole più
            saperne di andare avanti. Le mastica con tutto il guscio, e lo scricchiolio arriva fin dietro il
            banco.

            L'uomo ben vestito ne approfitta per strisciare dietro un barile di scolo, senza vedere chi l'ha
            aiutato. Da dietro il banco ti sorprendi a calcolare a prezzo di festa quanto ti costa ogni
            boccone.
          effetti: { racconto: 1, monete: -2 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Il muso nel banco
          testo: |
            Fai in tempo a squarciare un sacco solo. Il cinghiale fiuta le castagne ancora dentro il banco e
            ci si butta con tutto il peso. Il bancone si rovescia e la tenda ti crolla addosso con il palo in
            testa, e per un po' il mondo è tela a righe e odore di bestia.

            Quando esci dalla tela le guardie della porta hanno già circondato i gregari, e l'uomo ben vestito
            è sparito. Dei tuoi sacchi restano la tela strappata e una manciata di gusci rosicchiati.
          effetti: { ferite: 0.5, monete: -2 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Mettere al sicuro la cassa"
        descrizione: "Sotto il bancone c'è l'incasso di tutta la giornata, e l'uomo ben vestito è uno sconosciuto."
        costo: 0
        esito:
          titolo: L'incasso della giornata
          testo: |
            Ti butti a terra con la cassa stretta al petto e resti lì, fra i sacchi, mentre il cinghiale ti
            passa accanto. Da sotto il bancone vedi i gregari che circondano l'uomo ben vestito, e poi le
            guardie della porta che arrivano di corsa con le lance basse.

            Per ultime vedi tre figure di metallo che calano dai tetti vicini, lente come ragni. Non fanno
            nessun rumore, e il cane che abbaiava da un cortile vicino smette di colpo.

            Dentro la cassa c'è l'incasso intero, e nessuno ti ha visto.
          effetti: { racconto: 1, monete: 4 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ Figlio del Circolo
  - id: prologo-figlio-del-circolo
    immagine: bestiario/dorbak
    titolo: La bestia della porta nord
    sommario: "Al tramonto del Festival, un cinghiale mutato dalla Marea entra dalla porta nord. Chi viene dal Circolo sente che soffre."
    luogo: Porta nord, al tramonto del Festival
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.figlio-del-circolo >= 1]
    testo: |
      Sei sces{o|a} in città per il Festival delle Foglie Alate, perché volevi vedere le farfalle foglia-rossa
      che nel Bosco di Velthar si raccontano ai bambini. A mezzogiorno Padre Vantes le ha liberate davanti
      alla cattedrale nuova, e per un'ora ti sei dimenticat{o|a} del bosco. Da vicino hanno le ali venate come
      una foglia secca, e quando si posano sui coppi non le distingui più. Al tramonto sei vicin{o|a} alla
      porta nord, dove i carrettieri legano i cavalli per la notte, quando dalla piazza arrivano le urla.

      Il cinghiale entra dalla strada del Daino Zoppo con un orco in sella. Ha la pelle nera e lucida, e sotto
      la cotenna gli pulsano vene color acciaio. Corrono lungo il collo e dietro le spalle dove corrono in
      ogni cinghiale, e soltanto il colore è sbagliato. Hai già visto animali toccati dalla Marea Grigia, e
      l'odore di ferro caldo e pelo bruciato è lo stesso della volpe che da bambin{o|a} hai visto abbattere
      nel Bosco di Velthar. La bestia ha il respiro spezzato, e a ogni passo scuote la testa.

      {natura Facile} Al Circolo ti hanno insegnato ad ascoltare una bestia prima di guardarla. Questa scuote
      la testa per scrollarsi di dosso il bruciore del metallo che le corre nelle vene.

      *Non vuole essere qui più di te.* L'orco la sprona con i talloni proprio dove le vene affiorano. Dietro
      di lui un gregario ti ha già visto e ti viene incontro con l'ascia alzata. Alle tue spalle i cavalli dei
      carrettieri tirano le corde legate agli anelli del muro, e gli anelli cigolano nella pietra. La folla
      che fugge dalla piazza passa proprio in mezzo a loro.
    opzioni:
      - testo: "Affrontare il gregario"
        descrizione: "Canta mentre carica e non para i colpi. Il tuo arco da vicino serve poco, ma non hai tempo di allontanarti."
        costo: 0
        combattimento: razzia-orco
        vittoria:
          titolo: Uno di meno
          testo: |
            Il gregario cade sul selciato e continua a cantare finché ha fiato. Le ultime parole gli escono
            senza voce, e le labbra tengono il tempo anche dopo. Quando ti volti il cinghiale è già in fondo
            alla strada, e carica verso la porta. Le guardie che sono rimaste indietro ti squadrano a lungo
            prima di abbassare le lance.

            Uno di loro ti batte una mano sulla spalla e ti chiede come ti chiami. Glielo dici, e lui lo
            ripete due volte storpiandolo, poi una terza giusta, e ribatte sulla spalla per fissarlo lì.
          effetti: { racconto: 1, rep.caserma: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        sconfitta:
          titolo: L'ascia di piatto
          testo: |
            Il gregario ti prende con il piatto dell'ascia e ti manda a terra fra le zampe dei cavalli. Da
            laggiù vedi i ferri degli zoccoli battere a un palmo dalla tua faccia. Ti rialzi solo quando le
            guardie della porta lo abbattono con le lance.

            L'ultima cosa che ricordi di quella sera è il sibilo del cinghiale che si allontana verso la
            porta, con il respiro spezzato, e il pensiero ostinato che fra voi due quello messo peggio sia
            lui.
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Calmare i cavalli e ascoltare la bestia"
        descrizione: "Al Circolo si parla agli animali con la voce bassa e le mani ferme. Il cinghiale, forse, ha qualcosa da dirti."
        costo: 0
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Facile }
        successo:
          titolo: Quello che dice il cinghiale
          testo: |
            Ti metti fra i cavalli e parli piano, con la voce che al Circolo si usa per i puledri. Uno alla
            volta smettono di tirare le corde, e la gente in fuga passa senza finire sotto gli zoccoli.

            Poi guardi il cinghiale, e ti è chiaro che la bestia è sana di mente e soffre. Ogni volta che i
            talloni dell'orco toccano le vene la bestia sterza, e sterza sempre dalla parte lontana dal colpo.
            Chi l'ha mutata ha trovato il modo di guidarla con il dolore, e tu non l'hai mai visto fare a
            nessuno.
          effetti: { racconto: 1, rep.circolo: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Uno zoccolo
          testo: |
            I cavalli sentono l'odore del cinghiale più forte della tua voce. Un baio spezza la corda e si
            impenna, e il suo zoccolo ti prende alla spalla con un rumore sordo che ti arriva nei denti.

            Il baio si è fermato contro il muro della porta e trema, con la corda spezzata che gli pende dal
            collo e il sudore che gli fa schiuma sul petto. Ti avvicini piano parlandogli a bassa voce, con il
            braccio che ti penzola, e questa volta si lascia toccare.
          effetti: { ferite: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Tirare con l'arco da dietro un carro"
        descrizione: "Un carro rovesciato fa da riparo. Da lì il gregario è a trenta passi, e l'orco in sella poco più in là."
        costo: 0
        prova: { attributo: fisico, abilita: [armi-da-distanza], difficolta: Facile }
        successo:
          titolo: Una freccia nella spalla
          testo: |
            Ti butti dietro il carro e incocchi, con le dita che tremano solo finché la corda non è tesa. Il
            fondo del carro è ancora tiepido di sole e sa di fieno. La prima freccia prende il gregario alla
            spalla, e la seconda lo raggiunge mentre cerca di strapparsi la prima. Si ferma a metà strada, e
            le guardie della porta fanno il resto.

            Le guardie ti hanno visto tirare, e dopo la battaglia una di loro viene a chiederti dove hai
            imparato, tenendosi il cappello in mano per educazione o per stanchezza.
          effetti: { racconto: 1, rep.caserma: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Troppo vicino
          testo: |
            Le frecce vanno larghe, perché la gente in fuga ti passa davanti a ogni tiro e tu alzi la punta
            ogni volta per non prendere nessuno. Una si pianta in un'imposta del primo piano e resta lì a
            vibrare. Il gregario ti raggiunge dietro il carro e fai appena in tempo a parare con l'arco. La
            corda si spezza, e l'ascia ti apre il braccio.

            Ti salva una guardia della porta, che lo trafigge con la lancia e prosegue verso la strada senza
            fermarsi, e nemmeno sa di averti salvato.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ Fuggiasco di Ghoran
  - id: prologo-fuggiasco-di-ghoran
    immagine: bestiario/orco-sacerdote-guerriero
    titolo: Il tamburo in piazza
    sommario: "In piazza, al tramonto del Festival, un orco batte un tamburo e gli altri cantano. Quel modo di cantare lo hai già sentito a Ghoran."
    luogo: Piazza dei Quartieri Alti, davanti alla cattedrale nuova
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.fuggiasco-di-ghoran >= 1]
    testo: |
      Sei in piazza davanti alla cattedrale nuova del Velo, in mezzo alla gente che aspetta la preghiera del
      tramonto. A pranzo hai mangiato due volte cambiando fila, e un pezzo di pane te lo sei mess{o|a} in
      tasca per dopo. È pane bianco con la crosta lucida, e sotto le dita la mollica è ancora morbida. Quando
      Padre Vantes sale sul palco la folla si zittisce. Poi una donna grida, e da sud si alza il fumo del
      carro del combustibile per il falò. È un fumo nero che arriva in piazza con l'odore della pece.

      Gli orchi entrano in piazza correndo, e dietro di loro arriva quello col tamburo che batte il tempo con
      il pomo della mazza. Il tamburo gli pende legato al petto, e il colpo ti arriva dalle pietre della
      piazza fino alle ginocchia. A Ghoran gli orchi dei recinti cantavano così prima delle punizioni. La
      schiena ci arriva prima di te, e ti ritrovi con le spalle curve e gli occhi bassi come quando passavano
      i sorveglianti.

      {resilienza Facile} Adesso sei a Qir-Azel, dove nessuno ti tiene in un recinto, e la schiena si
      raddrizza una vertebra alla volta.

      Tiri su la testa e guardi il tamburo. Della litania capisci poco, ma una parola la conosci perché a
      Ghoran i sorveglianti la usavano per la Marea Grigia, e questi orchi la gridano come un invito.

      {intimidire Media} I tre più giovani cantano mezzo verso in ritardo, e chi canta in ritardo ha paura di
      sbagliare davanti al capo.

      Intorno a te la gente scappa verso i vicoli. Padre Vantes è sceso dal palco e si china su un ferito
      senza badare agli orchi. I tre più giovani, poco più che ragazzi, girano attorno al tamburo in attesa di
      un ordine e tengono le asce con tutte e due le mani. *Un ordine lo sai dare anche tu, se ti ricordi come
      si grida.* Ti stringi il pane in tasca fino a sbriciolarlo.
    opzioni:
      - testo: "Andare dritto al tamburo"
        descrizione: "Senza il tamburo gli altri perdono il tempo. Lui però è grosso, e il pomo della sua mazza è di ferro."
        costo: 0
        combattimento: razzia-tamburo
        vittoria:
          titolo: Il tamburo sfondato
          testo: |
            L'orco cade in ginocchio sopra il suo tamburo e lo sfonda con il proprio peso. La pelle si
            squarcia con un colpo secco, e il cerchio di legno gli resta intorno alle ginocchia. Continua a
            cantare finché può, e da vicino senti la litania intera, con la parola della Marea che torna a
            ogni verso.

            Intorno a te gli orchi più giovani perdono il ritmo e si sbandano. Un sergente della guardia ti
            guarda le mani sporche e non ti chiede da dove vieni, e tu gli sei grat{o|a} più di quanto
            sapresti dire.
          effetti: { racconto: 1, informazioni.voce: 1, rep.caserma: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        sconfitta:
          titolo: Il pomo della mazza
          testo: |
            Il pomo della mazza ti prende alla tempia e ti ritrovi a terra, con la guancia sulle pietre della
            piazza, che sono ancora tiepide del sole di mezzogiorno. L'orco ti scavalca senza guardarti e
            riprende a battere, e ogni colpo del tamburo ti arriva attraverso la pietra fino all'osso della
            guancia.

            Resti giù ad ascoltare, perché non riesci a fare altro, e la litania ti entra in testa verso dopo
            verso. Quando le guardie lo abbattono la sai quasi a memoria, e sai anche che a Ghoran quel ritmo
            non l'hai mai sentito cantare in piazza.
          effetti: { informazioni.voce: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Fare da muro davanti a Padre Vantes"
        descrizione: "Il prete non si sposta dal suo ferito. Qualcuno deve restare in piedi fra lui e gli orchi."
        costo: 0
        prova: { attributo: fisico, abilita: [resistenza], difficolta: Media }
        successo:
          titolo: In piedi
          testo: |
            Ti pianti davanti al prete a gambe larghe. Il primo orco ti arriva addosso con la spalla e
            rimbalza. Il secondo ti apre un taglio sull'avambraccio, e tu resti dove sei finché le guardie non
            li prendono alle spalle. Il sangue ti cola fino alle dita e lo senti caldo fra le nocche.

            Padre Vantes non ha smesso un momento di curare il suo ferito. Quando alza gli occhi ti ringrazia
            con il tuo nome, che gli hai detto tu a metà battaglia senza accorgertene. Intanto la litania ti è
            rimasta nelle orecchie.
          effetti: { racconto: 1, informazioni.voce: 1, rep.velo: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: "Travolt{o|a}"
          testo: |
            Il primo orco ti travolge e ti ritrovi a terra accanto al ferito del prete. Padre Vantes ti
            afferra sotto le ascelle e ti trascina dietro il palco, con una forza che da un uomo in tonaca non
            ti aspettavi.

            Resti lì fino alla fine, con la testa che gira e l'odore di resina delle assi nel naso, mentre
            dall'altra parte la litania continua a tornare sulla parola della Marea. Sopra di te passano i
            piedi di chi corre sul palco, e a ogni passo dalle fessure ti cade addosso un filo di segatura. Da
            sopra, ogni tanto, cade una farfalla foglia-rossa stordita dal fumo.
          effetti: { ferite: 1, informazioni.voce: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Gridare ai più giovani nella lingua dei recinti"
        descrizione: "A Ghoran hai imparato come gridano i sorveglianti orchi. Quei ragazzi aspettano un ordine, e potresti darglielo tu."
        costo: 0
        prova: { attributo: sociale, abilita: [intimidire], difficolta: Facile }
        successo:
          titolo: L'ordine sbagliato
          testo: |
            Riempi il petto e gridi le poche parole che ricordi dai recinti di Ghoran, quelle che i
            sorveglianti usavano per mandare via i cani. La voce ti esce più bassa di quanto ricordavi,
            raschiata in fondo alla gola come la loro. I tre ragazzi si voltano verso di te, poi verso il
            tamburo, e alla fine scappano verso il crinale.

            Più tardi senti dire che alcuni orchi, braccati sull'orlo, si sono buttati dalla rupe. Ti chiedi
            se fossero loro, e la domanda ti tiene svegli{o|a} più della litania, che intanto ti ricordi quasi
            tutta.
          effetti: { racconto: 1, informazioni.voce: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: La voce che si rompe
          testo: |
            La voce ti si rompe sulla seconda parola, e ne esce un suono alto e stonato che non riconosci
            nemmeno tu. I ragazzi ti riconoscono per quello che sei, uno scappato dai recinti, e ridono. Il
            più grosso ti colpisce al fianco con il manico dell'ascia e torna a cantare con gli altri. Il
            manico è di legno scuro e lisciato dalle mani.

            Dal selciato ascolti la litania fino alla fine, con il fianco che ti manda una fitta a ogni
            respiro, e la parola della Marea ti resta addosso per tutta la notte.
          effetti: { ferite: 0.5, informazioni.voce: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ Allievo di Torvessa
  - id: prologo-allievo-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: I cristalli del banco
    sommario: "Al banco dell'Accademia di Torvessa, durante il Festival. Poco prima che le macchine scendano dai tetti, i cristalli vibrano tutti insieme."
    luogo: Fiera del Festival, al banco dell'Accademia di Torvessa
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.allievo-di-torvessa >= 1]
    testo: |
      L'Accademia ha montato il suo banco davanti alla cattedrale nuova, sotto una tenda grigia con il sigillo
      del cerchio incompleto. Sul panno sono allineati sei cristalli conduttori su supporti di ottone, e tu
      hai passato la giornata a spiegare ai curiosi come si accendono. Orvald Temmerin legge su uno sgabello e
      gira le pagine con la punta di un coltello da frutta. Sul palo della tenda il suo corvo, Pett, si liscia
      le penne.

      Al tramonto dalla piazza arrivano le urla, e gli orchi entrano correndo da sud. Temmerin chiude il libro
      con il coltello dentro per non perdere il segno, e ti dice di restare dietro il banco con il tono che
      usa in aula per chiedere silenzio. Due studenti del primo anno si sono infilati sotto il tavolo.

      Poi i cristalli vibrano tutti insieme, e li senti nei denti prima che nelle orecchie come una nota breve
      che si ripete. Sono stati tagliati in anni diversi da mani diverse, e non ce ne sono due con le stesse
      facce. Niente dovrebbe farli rispondere nello stesso momento. I supporti di ottone tintinnano piano sul
      legno del tavolo. Temmerin li fissa con la fronte aggrottata.

      {magia Media} Il Mana nei sei cristalli si è orientato tutto verso nord, e lo senti tirare nei
      polpastrelli.

      Un attimo dopo, sopra i tetti che scendono alla porta nord, si muove qualcosa di metallo. Sono tre
      sagome che calano dalle grondaie lente come ragni e spariscono dietro i comignoli nello stesso momento.
      Sul palo Pett ha smesso di lisciarsi le penne e tiene il becco puntato da quella parte. Intanto un orco
      col viso dipinto sta già correndo verso il vostro banco.

      {rissa Facile} Corre con il peso tutto in avanti e la guardia bassa. Uno così, se lo fermi, cade lungo.
    opzioni:
      - testo: "Fermare l'orco che punta al banco"
        descrizione: "È uno solo e non si cura dei colpi. Il Dardo lo colpisce prima che ti arrivi addosso."
        costo: 0
        combattimento: razzia-orco
        vittoria:
          titolo: Il Dardo
          testo: |
            L'orco crolla davanti al banco, e il panno si sporca di sangue proprio sotto i cristalli. Pett
            scende dal palo, gli gira intorno due volte come un assistente che controlla un compito, e torna
            su. I cristalli hanno smesso di vibrare, e l'ottone dei supporti è freddo sotto le dita.

            Temmerin ti guarda le mani, che ancora formicolano per il Dardo. «Il secondo era più preciso del
            primo» dice, e si volta verso i tetti della porta nord, dove sono sparite le macchine. È il
            complimento più lungo che ti abbia mai fatto.
          effetti: { racconto: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        sconfitta:
          titolo: Il tavolo rovesciato
          testo: |
            Il Dardo lo prende di striscio e l'orco ti arriva addosso ridendo. Ti schiaccia contro il bordo
            del banco, e il tavolo si rovescia con tutto quello che c'è sopra.

            Quando riapri gli occhi l'orco è morto e Temmerin sta raccogliendo i cristalli uno per uno,
            contandoli ad alta voce, e quando arriva a quattro ricomincia da capo, come se il numero potesse
            cambiare. Ne mancano due.

            Li cerchi fra le gambe della gente in fuga, con Pett che saltella sul selciato accanto a te, e non
            li ritrovate.
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Capire il segnale dei cristalli"
        descrizione: "La nota si ripete sempre uguale. Se riesci a contarla prima che finisca, forse capisci da dove viene."
        costo: 0
        prova: { attributo: mentale, abilita: [magia, tecnologia], difficolta: Media }
        successo:
          immagine: bestiario/salvaguardia-precursori
          titolo: Tre impulsi
          testo: |
            Metti due dita sul cristallo più vicino e conti. Sono due impulsi brevi e uno lungo, ripetuti tre
            volte, sempre uguali. Sull'impulso lungo il cristallo si scalda appena sotto i polpastrelli. È un
            segnale mandato da un cristallo agli altri, come quelli con cui i Raschiatori si chiamano da una
            piattaforma all'altra, soltanto molto più forte.

            {tecnologia Difficile} Un segnale così forte non lo manda un cristallo tagliato a Torvessa.

            Lo dici a Temmerin, e lui scrive la sequenza sul retro di un listino, proprio dietro la riga
            *cristallo piccolo, dimostrazione gratuita*. «Per adesso tienilo per te» dice.
          effetti: { racconto: 1, informazioni.voce: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Una crepa
          testo: |
            Stringi il cristallo più vicino per sentire meglio la vibrazione, e quello si incrina fra le tue
            dita. La crepa corre dalla base alla punta lungo una faccia del taglio, e la scheggia ti apre il
            palmo.

            Temmerin ti fascia la mano con il fazzoletto senza dire niente. Il segnale è già finito, e le
            macchine sono sparite verso la porta nord. Del cristallo incrinato resta un moncone opaco sul
            supporto di ottone, che il preside mette in tasca prima di guardare i tetti.
          effetti: { ferite: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Mettere al sicuro gli strumenti e i ragazzi"
        descrizione: "I due del primo anno sono sotto il tavolo, e i cristalli valgono più di tutto quello che possiedi."
        costo: 0
        esito:
          titolo: Sotto il portico
          testo: |
            Avvolgi i cristalli nel panno e li chiudi nella cassa, e attraverso il legno li senti ancora
            vibrare contro il petto. Poi tiri fuori i due ragazzi da sotto il tavolo e li porti di corsa sotto
            il portico della cattedrale, dove un diacono tiene aperta una porta laterale.

            Da lì guardi la piazza. Temmerin è rimasto al banco con Pett sulla spalla, e quando un orco si
            avvicina alza appena una mano, con lo stesso gesto con cui a lezione ti fa segno di sederti.
            L'orco cade, e il preside torna a guardare i tetti.
          effetti: { racconto: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
