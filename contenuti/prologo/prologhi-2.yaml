# Prologhi: il giorno del Festival delle Foglie Alate, visto da quattro origini.
# Mercante dei Ponti, Figlio del Circolo, Fuggiasco di Ghoran, Allievo di Torvessa.
# Ogni esito porta a tre-giorni-dopo, che azzera la quality prologo.
storylet:
  # ------------------------------------------------------------ Mercante dei Ponti
  - id: prologo-mercante-dei-ponti
    immagine: personaggi/corin-ashdale
    titolo: Il banco vicino alla porta nord
    sommario: "Il primo giorno d'autunno, al mercato del Festival. Un cinghiale corazzato risale la strada della porta nord con un orco in sella."
    luogo: Mercato del Festival, verso la porta nord
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.mercante-dei-ponti >= 1]
    testo: |
      È il primo giorno d'autunno, e il Festival delle Foglie Alate è
      cominciato stamattina. Hai piazzato il banco in fondo al mercato, dove la
      strada piega verso la porta nord e la locanda del Daino Zoppo, perché chi
      entra in città passa di qui prima di arrivare in piazza. Vendi castagne
      secche in sacchi di tela, con il prezzo scritto a carbone su un'asse.
      A mezzogiorno, mentre Padre Vantes liberava le farfalle foglia-rossa,
      ne hai vendute metà.

      {conoscenze-della-strada Molto facile} La gente con il naso all'aria
      paga senza contrattare. Lo sai da quando avevi l'età per reggere un
      sacco, e oggi tutta la città guarda in su.

      Al tramonto dalla piazza arrivano le prime grida. Poco dopo dal fondo
      della strada sbuca un cinghiale alto al garrese quanto un uomo, con la
      pelle nera e lucida. Sotto la cotenna gli pulsano vene color acciaio, e
      dal muso esce un sibilo di vapore. In sella c'è un orco più grosso di
      tutti quelli che hai mai visto, e dietro di lui vengono tre gregari a
      piedi che cantano.

      Davanti al cinghiale corre un uomo ben vestito, con un mantello di
      velluto e un cane da caccia alle calcagna. Il cane si volta e affronta la
      bestia, ma resiste poco. I gregari gridano di gioia quando smette di
      muoversi, e l'uomo inciampa a due passi dal tuo banco. L'occhio ti va
      per abitudine alla fibbia d'argento del suo mantello prima che alla
      faccia, e subito dopo ti si chiude lo stomaco.

      {atletica Media} Fra il banco e l'uomo ci sono due passi e mezzo. Le
      gambe li hanno già contati, e aspettano soltanto che il cinghiale
      abbassi la testa.

      {politica-ed-economia Media} Argento lavorato a sbalzo. Un uomo che si
      veste così ha qualcuno che domani chiederà chi l'ha aiutato.

      *Uno così, se lo salvi, se lo ricorda.* Sotto il bancone tieni la cassa
      con l'incasso della giornata.
    opzioni:
      - testo: "Tirare l'uomo dietro il banco"
        descrizione: "Bisogna cogliere il momento in cui il cinghiale abbassa la testa, e poi tirare forte."
        costo: 0
        prova: { attributo: mentale, abilita: [percezione, atletica], difficolta: Media }
        successo:
          titolo: Una faccia da ricordare
          testo: |
            Aspetti che il cinghiale abbassi il muso sul cane, poi afferri
            l'uomo per il bavero e lo trascini sotto il bancone, fra i sacchi.
            La bestia passa così vicino che il vapore ti bagna la nuca, e lo
            senti raffreddarsi sulla pelle mentre i gregari frugano la strada.
            Continuano finché le guardie della porta arrivano di corsa e l'orco
            li richiama con un grido.

            L'uomo ti stringe il polso con tutte e due le mani. «Corin Ashdale,
            della Gilda» dice. «Alloggio al Grifone di Ferro finché non riparto
            per Laresh.» Poi ti guarda a lungo in faccia prima di lasciarti il
            polso.

            {empatia Facile} Ti sta imparando a memoria, con la cura che si
            mette in un conto da saldare. Le mani gli tremano ancora, la
            memoria invece è ferma.
          effetti: { racconto: 1, rep.gilda: 0.5 }
          imposta: { prologo: 2, corin.salvato: 1 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Il fianco del cinghiale
          testo: |
            Esci da dietro il banco nel momento sbagliato. Il cinghiale scarta
            di lato e ti prende di striscio con il fianco corazzato, caldo come
            una stufa, e finisci contro il palo della tenda con tutto il fiato
            che ti esce in una volta.

            Quando riesci a rialzarti le guardie della porta sono già addosso ai
            gregari. L'uomo ben vestito si è trascinato da solo dietro un barile
            di scolo senza vederti, e il livido sul fianco ti dura una
            settimana. Ogni mattina te lo guardi cambiare colore.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Rovesciare le castagne in mezzo alla strada"
        descrizione: "La Marea lo ha mutato, ma il cinghiale tiene il muso basso e le castagne le ha fiutate da venti passi."
        costo: 0
        prova: { attributo: mentale, abilita: [percezione, addestrare-animali], difficolta: Facile }
        successo:
          titolo: Castagne sul selciato
          testo: |
            Squarci due sacchi con il pugnale e li rovesci davanti al banco. Il
            cinghiale frena sugli zoccoli e affonda il muso nelle castagne, e
            per quanto l'orco lo prenda a calci nei fianchi non vuole più
            saperne di andare avanti. Masticando fa un rumore di sassi in un
            secchio.

            L'uomo ben vestito ne approfitta per strisciare dietro un barile di
            scolo, senza vedere chi l'ha aiutato. L'orco bestemmia nella sua
            lingua, e la bestia continua a mangiare finché dei due sacchi non
            resta niente. Da dietro il banco ti sorprendi a calcolare a
            prezzo di festa quanto ti costa ogni boccone.

            {natura Facile} Mangia come un animale che non vede cibo da giorni,
            o che non ha mai avuto il permesso di fermarsi a mangiare.
          effetti: { racconto: 1, monete: -2 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Il muso nel banco
          testo: |
            Fai in tempo a squarciare un sacco solo. Il cinghiale fiuta le
            castagne ancora dentro il banco e ci si butta con tutto il peso. Il
            bancone si rovescia e la tenda ti crolla addosso, con il palo in
            testa, e per un po' il mondo è tela a righe e odore di bestia.

            Quando esci dalla tela le guardie della porta hanno già circondato i
            gregari, e l'uomo ben vestito è sparito. Del banco restano due
            assi e un sacco calpestato, e sull'asse del prezzo c'è l'impronta
            intera di uno zoccolo.
          effetti: { ferite: 0.5, monete: -2 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Mettere al sicuro la cassa"
        descrizione: "Sotto il bancone c'è l'incasso di tutta la giornata, e l'uomo ben vestito è uno sconosciuto."
        costo: 0
        esito:
          titolo: L'incasso della giornata
          testo: |
            Ti butti a terra con la cassa stretta al petto e resti lì, fra i
            sacchi, mentre il cinghiale ti passa accanto. Da sotto il bancone
            vedi i gregari che circondano l'uomo ben vestito, e poi le guardie
            della porta che arrivano di corsa con le lance basse.

            Per ultime vedi tre figure di metallo che calano dai tetti vicini,
            lente come ragni. Stringi la cassa finché gli spigoli non ti
            entrano nelle costole, e aspetti che tutto finisca.

            {resilienza Media fallita} Ti dici che hai fatto la cosa giusta.
            Te lo ripeti una seconda volta per sicurezza, e suona peggio della
            prima.

            Dentro la cassa c'è l'incasso intero, e nessuno ti ha visto.
          effetti: { racconto: 1, monete: 4 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ Figlio del Circolo
  - id: prologo-figlio-del-circolo
    immagine: bestiario/dorbak
    titolo: La bestia della porta nord
    sommario: "Al tramonto del Festival, un cinghiale mutato dalla Marea entra dalla porta nord. Chi viene dal Circolo sente che soffre."
    luogo: Porta nord, al tramonto del Festival
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.figlio-del-circolo >= 1]
    testo: |
      Sei sceso in città per il Festival delle Foglie Alate, perché volevi
      vedere le farfalle foglia-rossa che nel Bosco di Velthar si raccontano
      ai bambini. A mezzogiorno Padre Vantes le ha liberate davanti alla
      cattedrale nuova, e per un'ora ti sei dimenticato di essere lontano dal
      bosco. Una ti si è posata sulla manica e ci è rimasta finché un bambino
      non l'ha spaventata per prenderla. Al tramonto sei vicino alla porta
      nord, dove i carrettieri legano i cavalli per la notte, quando dalla
      piazza arrivano le urla.

      Il cinghiale entra dalla strada del Daino Zoppo con un orco in sella. È
      alto al garrese quanto un uomo e ha la pelle nera e lucida. Sotto la
      cotenna gli pulsano vene color acciaio, e dal muso esce un sibilo di
      vapore. Hai già visto animali toccati dalla Marea Grigia, ma mai così da
      vicino, e l'odore di ferro caldo e pelo bruciato ti arriva prima del
      resto, lo stesso della volpe che da bambino hai visto abbattere nel
      Bosco di Velthar. La bestia ha il respiro spezzato, e a ogni passo
      scuote la testa.

      {natura Facile} Al Circolo ti hanno insegnato ad ascoltare una bestia
      prima di guardarla. Questa scuote la testa per scrollarsi di dosso un
      bruciore che ha dentro, dove il metallo le corre nelle vene.

      *Non vuole essere qui più di te.* L'orco la sprona con i talloni proprio
      dove le vene affiorano, e a ogni colpo ti mordi l'interno della guancia.
      Dietro di lui un gregario ti ha già visto e ti viene incontro con l'ascia
      alzata. Alle tue spalle i cavalli dei carrettieri tirano le corde e
      nitriscono, e la folla che fugge dalla piazza passa proprio in mezzo a
      loro.

      {armi-da-distanza Media fallita} Conti i passi fra te e il gregario per
      sapere se c'è spazio per un tiro. Arrivi a dodici, poi lui ne fa tre in
      un colpo solo e devi ricominciare da capo.
    opzioni:
      - testo: "Affrontare il gregario"
        descrizione: "Canta mentre carica e non para i colpi. Il tuo arco da vicino serve poco, ma non hai tempo di allontanarti."
        costo: 0
        combattimento: razzia-orco
        vittoria:
          titolo: Uno di meno
          testo: |
            Il gregario cade sul selciato e continua a cantare finché ha fiato.
            Ti accorgi solo adesso che hai il fiato corto anche tu, e che le
            dita non vogliono lasciare l'arco. Quando ti volti il cinghiale è
            già in fondo alla strada, e carica verso la porta. Le guardie che
            sono rimaste indietro ti squadrano a lungo prima di abbassare le
            lance.

            Uno di loro ti batte una mano sulla spalla e ti chiede come ti
            chiami. Glielo dici, e lui lo ripete due volte storpiandolo, poi
            una terza giusta, e ribatte sulla spalla per fissarlo lì.
          effetti: { racconto: 1, rep.caserma: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        sconfitta:
          titolo: L'ascia di piatto
          testo: |
            Il gregario ti prende con il piatto dell'ascia e ti manda a terra
            fra le zampe dei cavalli. Resti lì a lungo, con il sapore del sangue
            in bocca e uno zoccolo ferrato che si posa a un palmo dalla tua
            mano e poi, con molto giudizio, si sposta. Ti rialzi solo quando le
            guardie della porta lo abbattono con le lance.

            L'ultima cosa che ricordi di quella sera è il sibilo del cinghiale
            che si allontana verso la porta, con il respiro spezzato, e il
            pensiero ostinato che fra voi due quello messo peggio sia lui.
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Calmare i cavalli e ascoltare la bestia"
        descrizione: "Al Circolo si parla agli animali con la voce bassa e le mani ferme. Il cinghiale, forse, ha qualcosa da dirti."
        costo: 0
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Facile }
        successo:
          titolo: Quello che dice il cinghiale
          testo: |
            Ti metti fra i cavalli e parli piano, con la voce che al Circolo si
            usa per i puledri. Uno alla volta smettono di tirare le corde, e la
            gente in fuga passa senza finire sotto gli zoccoli.

            Poi guardi il cinghiale, e ti è chiaro che la bestia è sana di
            mente e soffre. Ogni volta che i talloni dell'orco premono sulle
            vene di metallo, lei carica. Chi l'ha mutata ha trovato il modo di
            guidarla con il dolore, e tu non l'hai mai visto fare a nessuno.

            {addestrare-animali Media} Funziona come un morso, soltanto che
            gliel'hanno messo nella carne invece che in bocca.
          effetti: { racconto: 1, rep.circolo: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Uno zoccolo
          testo: |
            I cavalli sentono l'odore del cinghiale più forte della tua voce. Un
            baio spezza la corda e si impenna, e il suo zoccolo ti prende alla
            spalla con un rumore sordo che ti arriva nei denti.

            Quando ti rialzi il cinghiale è già lontano, verso le lance della
            porta, e la strada è piena di gente che zoppica. Il baio si è
            fermato contro il muro della porta e trema, con la corda spezzata
            che gli pende dal collo. Ti avvicini piano parlandogli a bassa
            voce, con il braccio che ti penzola, e questa volta si lascia
            toccare.
          effetti: { ferite: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Tirare con l'arco da dietro un carro"
        descrizione: "Un carro rovesciato fa da riparo. Da lì il gregario è a trenta passi, e l'orco in sella poco più in là."
        costo: 0
        prova: { attributo: fisico, abilita: [armi-da-distanza], difficolta: Facile }
        successo:
          titolo: Una freccia nella spalla
          testo: |
            Ti butti dietro il carro e incocchi, con le dita che tremano solo
            finché la corda non è tesa. La prima freccia prende il
            gregario alla spalla, e la seconda lo raggiunge mentre cerca di
            strapparsi la prima. Si ferma a metà strada, e le guardie della
            porta fanno il resto.

            Provi un tiro anche sull'orco in sella, e la freccia rimbalza sulla
            corazza del cinghiale con un tintinnio da pentola. Le guardie ti
            hanno visto tirare, e dopo la battaglia una di loro viene a
            chiederti dove hai imparato, tenendosi il cappello in mano per
            educazione o per stanchezza.
          effetti: { racconto: 1, rep.caserma: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Troppo vicino
          testo: |
            Le frecce vanno larghe, perché la gente in fuga ti passa davanti a
            ogni tiro e tu alzi la punta ogni volta, per non prendere nessuno.
            Il gregario ti raggiunge dietro il carro e fai appena in tempo a
            parare con l'arco. La corda si spezza, e l'ascia ti apre il
            braccio.

            Ti salva una guardia della porta, che lo trafigge con la lancia e
            prosegue verso la strada senza fermarsi, e nemmeno sa di averti
            salvato.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ Fuggiasco di Ghoran
  - id: prologo-fuggiasco-di-ghoran
    immagine: bestiario/orco-sacerdote-guerriero
    titolo: Il tamburo in piazza
    sommario: "In piazza, al tramonto del Festival, un orco batte un tamburo e gli altri cantano. Quel modo di cantare lo hai già sentito a Ghoran."
    luogo: Piazza dei Quartieri Alti, davanti alla cattedrale nuova
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.fuggiasco-di-ghoran >= 1]
    testo: |
      Sei in piazza davanti alla cattedrale nuova del Velo, in mezzo alla
      gente che aspetta la preghiera del tramonto. Il pranzo l'hanno offerto
      le taverne, e tu hai mangiato due volte cambiando fila. Un pezzo di
      pane te lo sei messo in tasca per dopo, e ogni tanto lo tocchi per
      sentire che c'è ancora. Quando Padre Vantes sale sul palco la folla si
      zittisce. Poi una donna grida, e da sud si alza il fumo del carro del
      combustibile per il falò, che qualcuno ha dato alle fiamme.

      Gli orchi entrano in piazza correndo, e dietro di loro arriva quello col
      tamburo. Ha una pelle di bestia tesa sul petto e batte il tempo con il
      pomo della mazza, mentre gli altri cantano. A Ghoran gli orchi dei
      recinti cantavano così prima delle punizioni, con un verso lungo e uno
      corto, e tu avevi imparato presto a riconoscere quel ritmo. La schiena
      ci arriva prima di te, e ti ritrovi con le spalle curve e gli occhi
      bassi come quando passavano i sorveglianti.

      {resilienza Facile} Adesso sei a Qir-Azel, dove nessuno ti tiene in
      un recinto. La schiena ci mette un momento a crederci, poi si raddrizza
      una vertebra alla volta.

      Tiri su la testa a fatica, e guardi il tamburo. Della litania capisci
      poco. Una parola però la conosci, perché a Ghoran i sorveglianti la
      usavano per la Marea Grigia, e questi orchi la gridano come un invito.

      {intimidire Media} Il tamburo comanda, gli altri obbediscono al tempo.
      I tre più giovani cantano mezzo verso in ritardo, e chi canta in
      ritardo ha paura di sbagliare davanti al capo.

      Intorno a te la gente scappa verso i vicoli. Padre Vantes è sceso dal
      palco e si china su un ferito senza badare agli orchi. Tre dei più
      giovani, poco più che ragazzi, girano attorno al tamburo in attesa di un
      ordine. *Un ordine lo sai dare anche tu, se ti ricordi come si grida.*
      Ti stringi il pane in tasca fino a sbriciolarlo.
    opzioni:
      - testo: "Andare dritto al tamburo"
        descrizione: "Senza il tamburo gli altri perdono il tempo. Lui però è grosso, e il pomo della sua mazza è di ferro."
        costo: 0
        combattimento: razzia-tamburo
        vittoria:
          titolo: Il tamburo sfondato
          testo: |
            L'orco cade in ginocchio sopra il suo tamburo e lo sfonda con il
            proprio peso. Finché ha fiato continua a cantare, e da vicino senti
            la litania intera, con la parola della Marea che torna a ogni verso.

            Intorno a te gli orchi più giovani perdono il ritmo e si sbandano.
            Un sergente della guardia ti guarda le mani sporche e non ti chiede
            da dove vieni, e tu gli sei grato più di quanto sapresti dire.
          effetti: { racconto: 1, informazioni.voce: 1, rep.caserma: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        sconfitta:
          titolo: Il pomo della mazza
          testo: |
            Il pomo della mazza ti prende alla tempia e ti ritrovi a terra, con
            la guancia sulle pietre della piazza, che sono ancora tiepide del
            sole di mezzogiorno. L'orco ti scavalca senza guardarti e riprende
            a battere.

            Resti giù ad ascoltare, perché non riesci a fare altro, e la
            litania ti entra in testa verso dopo verso. Quando le guardie lo
            abbattono la sai quasi a memoria, e sai anche che a Ghoran quel
            ritmo non l'hai mai sentito cantare in piazza.
          effetti: { informazioni.voce: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Fare da muro davanti a Padre Vantes"
        descrizione: "Il prete non si sposta dal suo ferito. Qualcuno deve restare in piedi fra lui e gli orchi."
        costo: 0
        prova: { attributo: fisico, abilita: [resistenza], difficolta: Media }
        successo:
          titolo: In piedi
          testo: |
            Ti pianti davanti al prete a gambe larghe. Il primo orco ti arriva
            addosso con la spalla e rimbalza. Il secondo ti apre un taglio
            sull'avambraccio, e tu resti dove sei finché le guardie non li
            prendono alle spalle.

            {resistenza Media} Il taglio è lungo e poco profondo, e brucerà
            stanotte più di adesso. Le ginocchia invece tengono, che è quello
            che serviva.

            Padre Vantes non ha smesso un momento di curare il suo ferito.
            Quando alza gli occhi ti ringrazia con il tuo nome, che gli hai
            detto tu a metà battaglia senza accorgertene. Intanto la litania ti
            è rimasta nelle orecchie.
          effetti: { racconto: 1, informazioni.voce: 1, rep.velo: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Travolto
          testo: |
            Il primo orco ti travolge e ti ritrovi a terra accanto al ferito
            del prete. Padre Vantes ti afferra sotto le ascelle e ti trascina
            dietro il palco, con una forza che da un uomo in tonaca non ti
            aspettavi.

            Resti lì fino alla fine, con la testa che gira e l'odore di resina
            delle assi nel naso, mentre dall'altra parte la litania continua a
            tornare sulla parola della Marea. Da sopra, ogni tanto, cade una
            farfalla foglia-rossa stordita dal fumo.
          effetti: { ferite: 1, informazioni.voce: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Gridare ai più giovani nella lingua dei recinti"
        descrizione: "A Ghoran hai imparato come gridano i sorveglianti orchi. Quei ragazzi aspettano un ordine, e potresti darglielo tu."
        costo: 0
        prova: { attributo: sociale, abilita: [intimidire], difficolta: Facile }
        successo:
          titolo: L'ordine sbagliato
          testo: |
            Riempi il petto e gridi le poche parole che ricordi dai recinti di
            Ghoran, quelle che i sorveglianti usavano per mandare via i cani.
            I tre ragazzi si voltano verso di te, poi verso il
            tamburo, e alla fine scappano verso il crinale.

            Più tardi senti dire che alcuni orchi, braccati sull'orlo, si sono
            buttati dalla rupe. Ti chiedi se fossero loro, e la domanda ti
            tiene sveglio più della litania, che intanto ti ricordi quasi
            tutta.

            {empatia Media} Correvano a testa bassa, con le spalle curve, e
            quella postura la conosci perché fino a stamattina era la tua.
          effetti: { racconto: 1, informazioni.voce: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: La voce che si rompe
          testo: |
            La voce ti si rompe sulla seconda parola, e ne esce un suono alto
            e stonato che non riconosci nemmeno tu. I ragazzi ti riconoscono per quello
            che sei, uno scappato dai recinti, e ridono. Il più grosso ti
            colpisce al fianco con il manico dell'ascia e torna a cantare con
            gli altri.

            Dal selciato ascolti la litania fino alla fine, con il fianco che ti
            manda una fitta a ogni respiro, e la parola della Marea ti resta
            addosso per tutta la notte.
          effetti: { ferite: 0.5, informazioni.voce: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ Allievo di Torvessa
  - id: prologo-allievo-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: I cristalli del banco
    sommario: "Al banco dell'Accademia di Torvessa, durante il Festival. Poco prima che le macchine scendano dai tetti, i cristalli vibrano tutti insieme."
    luogo: Fiera del Festival, al banco dell'Accademia di Torvessa
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.allievo-di-torvessa >= 1]
    testo: |
      L'Accademia ha montato il suo banco sul lato della piazza che guarda la
      cattedrale nuova, sotto una tenda grigia con il sigillo del cerchio
      incompleto. Sul panno sono allineati sei cristalli conduttori, ognuno
      sul suo supporto di ottone, e tu hai passato la giornata a spiegare ai
      curiosi come si accendono. Orvald Temmerin siede su uno sgabello a
      leggere, e gira le pagine con la punta di un coltello da frutta che
      nessuno gli ha mai visto usare per la frutta. Sul palo della tenda il
      suo corvo, Pett, si liscia le penne senza badare ai curiosi.

      Al tramonto dalla piazza arrivano le urla, e gli orchi entrano correndo
      da sud. Temmerin chiude il libro con il coltello dentro, per non perdere
      il segno, e ti dice di restare dietro il banco nel tono che usa in aula
      per chiedere silenzio. Due studenti del primo anno, che ti hanno
      aiutato a portare le casse, si sono infilati sotto il tavolo.

      {resilienza Molto facile} Il tono dell'aula funziona anche qui. Ti
      accorgi di aver smesso di tremare perché te l'ha detto lui, e ti
      vergogni un poco di quanto è stato facile.

      Poi i cristalli vibrano tutti insieme. Li senti nei denti prima che
      nelle orecchie, una nota breve che si ripete. Sono stati tagliati in
      anni diversi da mani diverse, e niente dovrebbe farli rispondere nello
      stesso momento. *Qualcuno li sta chiamando tutti e sei insieme.*
      Temmerin li fissa con la fronte aggrottata.

      {magia Media} Il Mana nei sei cristalli si è orientato tutto dalla
      stessa parte, verso nord. Lo senti tirare nei polpastrelli, con la
      pazienza di una corrente che non ha fretta.

      Un attimo dopo, verso nord, sopra i tetti che scendono alla porta, si
      muove qualcosa di metallo. Sono tre sagome che calano dalle grondaie
      lente come ragni, troppo lontane per distinguerle bene, e spariscono
      dietro i comignoli tutte e tre nello stesso momento. Intanto un orco
      col viso dipinto sta già correndo verso il vostro banco.

      {rissa Facile} Corre con tutto il peso sbilanciato in avanti e la
      guardia bassa. Uno così, se lo fermi, cade lungo.
    opzioni:
      - testo: "Fermare l'orco che punta al banco"
        descrizione: "È uno solo e non si cura dei colpi. Il Dardo lo colpisce prima che ti arrivi addosso."
        costo: 0
        combattimento: razzia-orco
        vittoria:
          titolo: Il Dardo
          testo: |
            L'orco crolla davanti al banco, e il panno si sporca di sangue
            proprio sotto i cristalli. Pett scende dal palo, gli gira intorno
            due volte come un assistente che controlla un compito, e torna su.

            Temmerin ti guarda le mani, che ancora formicolano per il Dardo. «Il
            secondo era più preciso del primo» dice, e si volta verso i tetti
            della porta nord, dove sono sparite le macchine. È il complimento
            più lungo che ti abbia mai fatto.
          effetti: { racconto: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        sconfitta:
          titolo: Il tavolo rovesciato
          testo: |
            Il Dardo lo prende di striscio e l'orco ti arriva addosso ridendo.
            Finisci a terra con il banco rovesciato sopra le gambe, fra i
            cristalli sparsi sul selciato, e il primo pensiero chiaro che hai
            riguarda le ginocchia.

            Quando riapri gli occhi l'orco è morto e Temmerin sta raccogliendo
            i cristalli uno per uno, contandoli ad alta voce, e quando arriva a
            quattro ricomincia da capo, come se il numero potesse cambiare. Ne
            mancano due.

            Li cerchi fra le gambe della gente in fuga, con Pett che saltella
            sul selciato accanto a te, e non li ritrovate.
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Capire il segnale dei cristalli"
        descrizione: "La nota si ripete sempre uguale. Se riesci a contarla prima che finisca, forse capisci da dove viene."
        costo: 0
        prova: { attributo: mentale, abilita: [magia, tecnologia], difficolta: Media }
        successo:
          immagine: bestiario/salvaguardia-precursori
          titolo: Tre impulsi
          testo: |
            Metti due dita sul cristallo più vicino e conti. Sono due impulsi brevi e uno
            lungo, ripetuti tre volte, sempre uguali. È un segnale mandato da un
            cristallo agli altri, come quelli con cui i Raschiatori si chiamano
            da una piattaforma all'altra, soltanto molto più forte. I cristalli
            del banco l'hanno raccolto per caso.

            {tecnologia Difficile} Un segnale così forte non lo manda un
            cristallo tagliato a Torvessa. Chi l'ha costruito lavorava con
            una precisione che l'Accademia insegna solo sui libri.

            Lo dici a Temmerin, e lui scrive la sequenza sul retro di un
            listino, proprio dietro la riga *cristallo piccolo, dimostrazione
            gratuita*. «Per adesso tienilo per te» dice. Verso nord, oltre i
            tetti, le macchine si sono già messe in cammino.
          effetti: { racconto: 1, informazioni.voce: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Una crepa
          testo: |
            Stringi il cristallo più vicino per sentire meglio la vibrazione, e
            quello si incrina fra le tue dita. La scheggia ti apre il palmo.

            {medicina Facile fallita} Il sangue esce con calma, e tu lo guardi
            con interesse per un po' troppo prima di ricordarti che è tuo.

            Temmerin ti fascia la mano con il fazzoletto senza dire niente. Il
            segnale è già finito, e le macchine sono sparite verso la porta
            nord. Del cristallo incrinato resta un moncone opaco sul supporto di
            ottone, che il preside mette in tasca prima di guardare i tetti.
          effetti: { ferite: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
      - testo: "Mettere al sicuro gli strumenti e i ragazzi"
        descrizione: "I due del primo anno sono sotto il tavolo, e i cristalli valgono più di tutto quello che possiedi."
        costo: 0
        esito:
          titolo: Sotto il portico
          testo: |
            Avvolgi i cristalli nel panno e li chiudi nella cassa, poi tiri
            fuori i due ragazzi da sotto il tavolo e li porti di corsa sotto il
            portico della cattedrale, dove un diacono tiene aperta una porta
            laterale.

            Da lì guardi la piazza. I due ragazzi ti tengono stretto per le
            maniche, uno da ogni lato, senza mollarle. Temmerin è rimasto al banco con Pett
            sulla spalla, e quando un orco si avvicina alza appena una mano,
            con lo stesso gesto con cui a lezione ti fa segno di sederti. L'orco
            cade, e il preside torna a guardare i tetti.
          effetti: { racconto: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
