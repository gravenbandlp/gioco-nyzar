# Prologo, prima metà: la razzia del Festival delle Foglie Alate vista da quattro origini
# (Città Bassa, Raschiatore, Velo, Quartieri Alti), più il seguito comune "tre-giorni-dopo".
# Ogni prologo si apre da solo a inizio partita (prologo == 1) e ogni esito porta a tre-giorni-dopo,
# che è l'unico storylet ad azzerare "prologo".
storylet:
  # ------------------------------------------------------------ Figlio della Città Bassa
  - id: prologo-figlio-della-citta-bassa
    immagine: ambientazione/evento-razzia-festival-150
    titolo: Il carro del falò
    sommario: "Il giorno del Festival, a sud della piazza, gli orchi danno fuoco al carro del combustibile."
    luogo: A sud della piazza della Cattedrale, il giorno del Festival
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.figlio-della-citta-bassa >= 1]
    testo: |
      È il primo giorno d'autunno e Qir-Azel festeggia le Foglie Alate davanti alla cattedrale nuova del Velo.
      Ti hanno pagato mezza giornata per scaricare legna e botti di pece dal carro del combustibile, fermo in
      una strada a sud della piazza. Le botti sono di castagno cerchiato di ferro, e la pece trasuda dalle
      doghe e ti incolla le dita a ogni presa. Il falò va acceso al tramonto, che ormai è arrivato. Il
      carrettiere è un vecchio con le mani nere di resina che chiama «ragazzo mio» chiunque abbia meno di
      cinquant'anni, e ti ha promesso anche un boccale. Sopra i tetti volano ancora le farfalle foglia-rossa
      che Padre Vantes ha liberato a mezzogiorno.

      Il primo grido viene dalla piazza, e subito dopo si alza un canto rauco in orchesco in cui torna a ogni
      verso una parola, *Mawrak'Thur*. Il cavallo del carro mette le orecchie all'indietro prima che tu
      capisca da dove arriva. Gli orchi sbucano dal vicolo con le torce in mano e gli occhi lucidi di febbre.
      Uno lancia la torcia sul carro e la pece prende fuoco con una fiammata bassa e un fumo nero che sa di
      resina bruciata. Il cavallo s'impenna e il carro scivola giù verso la gente che scappa dalla piazza, con
      il carrettiere aggrappato alle redini.

      Dietro gli altri avanza un orco con un tamburo legato al petto, che batte il tempo della litania con il
      pomo della mazza. Inciampa su un ciottolo sconnesso e il colpo arriva lo stesso, preciso come gli altri.

      {rissa Media} È lui quello da mettere giù, perché senza il suo tempo gli altri non sapranno più cosa
      fare delle mani.

      *Quel vecchio ti deve ancora un boccale.* Le gambe vorrebbero andare con la folla, ma in tasca le dita
      hanno già trovato i tirapugni.
    opzioni:
      - testo: "Affrontare l'orco del tamburo"
        immagine: bestiario/orco-sacerdote-guerriero
        descrizione: "Finché lui batte il tempo gli altri continuano a cantare e a colpire. Hai i tirapugni in tasca."
        costo: 0
        combattimento: razzia-tamburo
        vittoria:
          titolo: Il tamburo tace
          testo: |
            L'orco del tamburo non para e non indietreggia. Quando va giù continua a battere il ritmo sulla
            pelle con due dita, finché la mano non si ferma. Il braccio che gli tieni a terra scotta di
            febbre. Senza il suo tempo gli altri perdono il filo della litania, si guardano intorno spaesati e
            si sparpagliano nelle strade laterali.

            Due guardie della Caserma arrivano di corsa e guardano prima le tue nocche spaccate e poi te.

            Le parole del canto ti restano in testa per tutta la notte, e il giorno dopo ti accorgi di saperle
            a memoria.
          effetti: { racconto: 1, informazioni.voce: 1, rep.caserma: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        sconfitta:
          titolo: Fumo e pece
          testo: |
            La mazza ti prende alla spalla e poi alla tempia, e ti ritrovi a terra fra i cocci di una botte,
            con il naso pieno di pece. Sopra di te il tamburo continua a battere, e il canto si allontana
            insieme a lui.

            Il carro è finito contro un muro senza travolgere nessuno, per quel che vedi da lì sotto, cioè
            soprattutto scarpe. Il carrettiere ti sta tirando per il colletto, lontano dalla pece che cola in
            fiamme lungo il selciato, e intanto ti chiama «{ragazzo mio|ragazza mia}».
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

      - testo: "Fermare il carro prima che arrivi alla folla"
        descrizione: "Saltare a cassetta, strappare le redini al vecchio e voltare il cavallo. Conosci queste strade meglio di lui."
        costo: 0
        prova: { attributo: fisico, abilita: [conoscenze-della-strada, acrobazia], difficolta: Media }
        successo:
          titolo: Il cortile del bottaio
          testo: |
            Salti sul predellino mentre il carro prende velocità e strappi le redini al vecchio, che le molla
            senza discutere. A dieci passi c'è il cortile di un bottaio con il portone aperto, lo sai da
            quando eri bambin{o|a} e ci andavi a rubare i cerchi di ferro per farli rotolare giù per la
            discesa. Tiri il cavallo da quella parte e il carro ci entra in fiamme, lontano dalla gente, con
            il mozzo di una ruota che gratta lo stipite.

            Il carrettiere piange senza vergognarsene mentre il carro brucia nel cortile fino a notte.
          effetti: { racconto: 1, rep.scuri: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Botti in fiamme
          testo: |
            Il cavallo ti vede arrivare e scarta. Il carro sbanda e si rovescia su un fianco, a pochi passi
            dalla gente, e le botti di pece rotolano accese sul selciato, saltando sui ciottoli. Dove si
            fermano la pece cola nelle fessure e continua a bruciare lì dentro.

            Riesci a tirare fuori il carrettiere da sotto una ruota, e lui ti ringrazia chiamandoti «{ragazzo
            mio|ragazza mia}» con la faccia nella polvere. Mentre lo trascini via una botte ti passa sulla
            gamba e ti lascia una bruciatura lunga una spanna, che per giorni ti ricorderà l'odore della
            resina.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ Apprendista Raschiatore
  - id: prologo-apprendista-raschiatore
    immagine: bestiario/salvaguardia-precursori
    titolo: Davanti alla porta nord
    sommario: "Il giorno del Festival, presso la porta nord, dai tetti calano le macchine della Salvaguardia."
    luogo: Presso la porta nord e il Daino Zoppo, il giorno del Festival
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.apprendista-raschiatore >= 1]
    testo: |
      È il primo giorno d'autunno e la città festeggia le Foglie Alate davanti alla cattedrale nuova del Velo.
      Tu hai lasciato presto la piazza perché la Cicatrice ti ha insegnato a diffidare delle folle. Al
      tramonto sei sedut{o|a} fuori dal Daino Zoppo, vicino alla porta nord, con un boccale di birra
      annacquata. Sopra i tetti girano ancora le farfalle foglia-rossa liberate a mezzogiorno.

      Il primo grido arriva dalla piazza. Poco dopo un orco più grosso degli altri sbuca da una strada
      laterale in sella a un cinghiale corazzato dalla pelle nera e lucida. Le piastre della corazza sono
      legate fra loro con il fil di ferro e hanno i bordi limati di fresco. Sotto la cotenna gli pulsano vene
      color acciaio, e sulle piattaforme hai visto abbastanza carcasse per riconoscere la mano della Marea
      Grigia. Il cinghiale travolge un mercante vestito di velluto, che si rannicchia dietro un barile di
      scolo mentre il suo cane gli si mette davanti e abbaia.

      Il capo degli orchi alza la testa verso i tetti e grida una frase in cui torna due volte la stessa
      parola, *Mawrak'Thur*. Il cane smette di abbaiare e si schiaccia contro il barile. Poi sui tetti
      scricchiolano i coppi, e dalle grondaie calano tre macchine della Salvaguardia dei Precursori. La più
      vicina ha quattro braccia che finiscono in innesti di metallo, e dietro scende una figura sottile con la
      testa ruotata all'indietro. Le loro giunture sono lucide e senza un punto di ruggine, mentre la grondaia
      di rame verde a cui si aggrappano si piega sotto il peso.

      {tecnologia Media fallita} Dovresti sapere perché sono fuori dalle rovine, ma quando sulle piattaforme
      se ne parlava tu pensavi al pranzo.

      Nelle rovine un Raschiatore che se le trova davanti torna alla scala e risale. Ti ritrovi in piedi con
      il boccale in mano a cercare una scala che in superficie non c'è, e intorno hai soltanto la porta nord e
      l'ingresso della locanda.
    opzioni:
      - testo: "Portare via la gente dalla porta nord"
        descrizione: "La regola dei Raschiatori vale anche in superficie. Prima si esce, e chi resta indietro si trascina."
        costo: 0
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Oltre l'arco
          testo: |
            Prendi per un braccio una serva del Daino Zoppo e la spingi dentro, poi torni fuori per due
            ragazzi rimasti impietriti contro il muro. Li porti oltre la porta nord correndo curv{o|a} come si
            fa sulle piattaforme quando cede un'impalcatura, e da lì fai segno agli altri di seguirti. La
            volta dell'arco è spessa quattro passi di pietra, e là sotto le grida della strada si sentono
            appena.

            Quando arrivano le guardie dall'altra parte dell'arco c'è una ventina di persone vive, e la serva
            ha ancora in mano lo strofinaccio. Nei giorni seguenti alcune di loro chiederanno il tuo nome ai
            Raschiatori.
          effetti: { racconto: 1, rep.raschiatori: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: La corazza del cinghiale
          testo: |
            Uno dei ragazzi si divincola e torna indietro a cercare la madre. Lo insegui, e il cinghiale ti
            passa così vicino che ti arriva addosso il suo odore di ferro caldo e di pelo bruciato. Una
            piastra della corazza ti apre il fianco come una lama, e il dolore arriva con calma, tre passi
            dopo.

            Riesci a trascinarlo oltre l'arco della porta, e lì resti sedut{o|a} contro il muro finché una
            guardia non ti preme uno straccio sulla ferita. Quando ti fanno alzare il sangue ha lasciato sulla
            pietra una striscia scura lunga quanto la tua schiena. Il ragazzo è già corso dalla madre,
            dall'altra parte della strada e senza nemmeno un graffio.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

      - testo: "Affrontare uno degli orchi"
        immagine: fazioni/tribu-capomozzo
        descrizione: "Uno dei gregari del capo ti ha visto e viene verso di te cantando. Hai il pugnale e il giaco imbottito."
        costo: 0
        combattimento: razzia-orco
        vittoria:
          titolo: Sotto il portico
          testo: |
            L'orco non para e non si ritira, e continua a cantare anche quando il pugnale gli entra sotto
            l'ascella. Smette solo quando è a terra, e sul selciato le labbra gli si muovono ancora un poco.
            Il tuo giaco imbottito ha un taglio lungo un palmo sulle costole, e la stoppa ne esce a ciuffi.

            Quando alzi gli occhi le macchine non sono più nel vicolo. Il capo degli orchi è a terra in mezzo
            alle guardie della porta e a qualche passante armato, e il cinghiale scalcia ancora legato alla
            sella. Ti resta in testa la parola che ha gridato prima che le macchine scendessero dai tetti.
          effetti: { racconto: 1, informazioni.voce: 1, rep.raschiatori: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        sconfitta:
          titolo: Il cielo sopra i tetti
          testo: |
            L'orco ti colpisce con il manico dell'ascia e ti ritrovi a terra sotto il portico del Daino Zoppo,
            con la bocca piena di sangue e un dente che dondola. Per un po' guardi il cielo senza riuscire ad
            alzarti, e conti le farfalle foglia-rossa che ci girano ancora sopra, l'unica cosa che ti riesce.

            Quando qualcuno ti rimette in piedi gli orchi se ne sono andati. Delle macchine restano soltanto i
            segni degli artigli sulle grondaie sopra il portico. Sono quattro graffi lucidi nel rame verde,
            tutti alla stessa distanza.
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

      - testo: "Osservare le macchine da vicino"
        descrizione: "È proprio quello che un Raschiatore non deve fare. Però non capita spesso di vederle fuori dalle rovine."
        costo: 0
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Un ordine
          testo: |
            Ti acquatti dietro un carro rovesciato e le guardi lavorare. Si muovono insieme e ogni tanto si
            fermano tutte e tre nello stesso momento con la testa inclinata, come cani che sentono un fischio.
            Dietro il barile anche il cane del mercante alza le orecchie, e ogni volta lo fa un attimo prima
            di loro.

            Nelle rovine le hai sempre viste difendere un posto. Qui sembrano eseguire un ordine, e l'unico ad
            averle chiamate è il capo degli orchi.

            {politica-ed-economia Difficile} Un orco che comanda le macchine dei Precursori vale più di
            qualsiasi razzia, per chi gliel'ha insegnato.
          effetti: { racconto: 1, informazioni.voce: 1, rep.raschiatori: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Il braccio sottile
          testo: |
            La macchina con la testa rovesciata si gira verso di te camminando all'indietro, e un braccio
            sottile ti passa sulla faccia prima che tu capisca da dove è arrivato. La ferita è così netta che
            all'inizio non sanguina.

            Ti butti in un fosso di scolo e resti lì sotto, con la guancia aperta e l'acqua sporca che ti
            entra nel taglio, finché sopra di te i passi di metallo non risalgono sui coppi. Il taglio si
            chiude in una cicatrice sottile dallo zigomo al mento, di quelle che ai Raschiatori piace
            confrontare a tavola.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ Accolito del Velo
  - id: prologo-accolito-del-velo
    immagine: personaggi/padre-vantes
    titolo: La tenda dei feriti
    sommario: "Il giorno del Festival, sotto il palco, gli orchi arrivano alla tenda dove Padre Vantes cura i feriti."
    luogo: Sotto il palco della Cattedrale, il giorno del Festival
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.accolito-del-velo >= 1]
    testo: |
      È il primo giorno d'autunno e davanti alla cattedrale nuova si festeggiano le Foglie Alate. A
      mezzogiorno hai aiutato Padre Vantes a liberare le farfalle foglia-rossa. Al tramonto sei ancora con lui
      nella tenda che il Velo ha montato sotto il palco per chi ha preso troppo sole o si è storto una
      caviglia al Guanto di Sfida. È un telo di canapa cerata tirato su quattro pali, e dentro si sente
      l'aceto delle garze e il vapore del lino messo a bollire.

      Il vecchio sale a recitare la preghiera della sera quando dalla piazza arrivano le grida. Sopra la tua
      testa le assi del palco tremano sotto i passi di chi scappa. In pochi minuti la tenda si riempie di
      gente con tagli d'ascia e costole rotte, e le tue mani vanno alle bende da sole.

      Padre Vantes torna giù e comincia a imporre le mani, e a ogni ferita che si chiude il suo viso si fa più
      grigio.

      {magia Media} Il calore che gli esce dai palmi è sempre lo stesso, ma ogni volta gli costa di più
      tirarlo fuori. Fra una ferita e l'altra il Mana gli torna nelle mani sempre più lento, come acqua da un
      pozzo quasi vuoto.

      A un certo punto il telo d'ingresso si strappa. Fuori ci sono due orchi con gli occhi lucidi che cantano
      una litania in cui torna sempre la stessa parola, *Mawrak'Thur*. Nessuno dei due prende fiato quando lo
      prende l'altro, e il canto non ha un buco. Una guardia della Caserma si mette in mezzo con la lancia, e
      un ragazzo del coro raccoglie un bastone tenendolo al contrario.

      Vantes non alza la testa dal suo ferito. «Tu pensa a loro» ti dice, e indica le brande.
    opzioni:
      - testo: "Curare i feriti mentre fuori si combatte"
        descrizione: "Hai lacci e garze a sufficienza. Il tuo lavoro è tenerli vivi finché qualcuno non ferma gli orchi."
        costo: 0
        prova: { attributo: mentale, abilita: medicina, difficolta: Facile }
        successo:
          titolo: Mani sporche fino ai polsi
          testo: |
            Stringi un laccio sopra un taglio e premi le garze sul fianco di una donna finché il sangue non
            rallenta, e lei intanto ti chiede scusa per il disturbo. Fuori il clangore dura poco, e quando la
            guardia rientra zoppicando il peggio è passato.

            Vantes ti guarda le mani, rosse fino ai polsi, e poi il ferito, e annuisce piano, perché ormai
            anche muovere la testa gli costa fatica. Nei giorni seguenti qualcuno di quelli che hai tenuto in
            vita quella sera viene in Cattedrale a chiedere di te.
          effetti: { racconto: 1, rep.velo: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Un taglio cucito a metà
          testo: |
            Stai cucendo un taglio sulla fronte di un ragazzo quando la guardia cade all'indietro dentro la
            tenda e un orco entra dietro di lei. Ti butti sul ragazzo per coprirlo, con l'ago ancora fra le
            dita, e la mazza ti prende sulla schiena.

            L'orco rovescia una branda ed esce dall'altro lato inseguendo qualcuno. Canta ancora, e il canto
            non cambia tempo nemmeno mentre corre. Quando riesci a rialzarti il ragazzo respira ancora, e il
            taglio sulla sua fronte è rimasto cucito a metà.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

      - testo: "Pregare ad alta voce su chi difende la tenda"
        immagine: fazioni/confraternita-del-velo
        descrizione: "Una preghiera breve al Grande Albero Rosso, detta a voce alta sulla guardia e sul ragazzo con il bastone."
        costo: 0
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Il calore nel palmo
          testo: |
            Alzi la mano sulla guardia e sul ragazzo e dici le parole della Benedizione in fretta, come te le
            ha insegnate Vantes, saltando soltanto l'inchino. Il calore ti parte dal centro del palmo, più
            debole di quello del vecchio.

            La lancia prende il primo orco sotto le costole e lo inchioda al palo della tenda. Il secondo si
            ritira quando il ragazzo gli rompe il bastone sul muso. Solo più tardi Vantes ti fa sapere di aver
            sentito la preghiera. «Un po' in fretta» dice, lisciandosi la manica sporca. «Ma detta bene.»
          effetti: { racconto: 1, rep.velo: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Parole impastate
          testo: |
            Le parole ti si impastano in bocca e perdi il filo della preghiera a metà, proprio dove Vantes ti
            aveva detto di fare la pausa. La guardia regge da sola il primo orco, e il secondo la scavalca ed
            entra nella tenda.

            Ti trovi sulla sua strada. La mazza ti prende alla spalla prima che il ragazzo del coro gli
            spacchi il bastone sulla testa e lo faccia voltare verso l'uscita. Per tutta la sera la spalla ti
            pulsa sullo stesso tempo della litania.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

      - testo: "Portare via i feriti dal retro della tenda"
        descrizione: "Quelli che camminano possono uscire da dietro, se qualcuno li guida con calma lungo il fianco della cattedrale."
        costo: 0
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: La porta dei sagrestani
          testo: |
            Tagli il telo sul retro con le forbici delle bende e fai uscire per primi quelli che camminano. Li
            guidi lungo il fianco della cattedrale fino alla porta dei sagrestani, e bussi con il pugno sulla
            quercia chiodata finché non ti apre un sagrestano ancora con il tovagliolo del pranzo al collo.

            Quando torni a prendere Vantes la tenda è vuota e la guardia è ancora in piedi. Il vecchio ti
            stringe il polso e da quel giorno, in Cattedrale, ti salutano con un altro rispetto.
          effetti: { racconto: 1, rep.velo: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Il polso slogato
          testo: |
            Nella fretta un uomo con la gamba steccata ti cade addosso e ti trascina giù con sé, scusandosi a
            voce altissima. Fra le brande si sparge il panico, e una branda rovesciata si pianta di traverso
            nel passaggio. Ci vuole troppo tempo per rimettere tutti in piedi.

            Quando finalmente arrivate alla porta dei sagrestani hai il polso slogato, e due dei feriti sono
            tornati indietro nella tenda per la paura. Li ritrovi più tardi, vivi, sotto le brande.
          effetti: { ferite: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ Rampollo dei Quartieri Alti
  - id: prologo-rampollo-dei-quartieri-alti
    immagine: personaggi/julia-castaldi
    titolo: I tavoli del Consiglio
    sommario: "Il giorno del Festival, ai tavoli del pranzo accanto a Julia Castaldi, gli orchi caricano la piazza."
    luogo: Piazza della Cattedrale, ai tavoli del Consiglio
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.rampollo-dei-quartieri-alti >= 1]
    testo: |
      È il primo giorno d'autunno e la piazza davanti alla cattedrale nuova del Velo è piena come non la
      vedevi da anni. Sulle tovaglie di lino si vedono ancora le pieghe della stiratura, e ogni famiglia ha
      portato da casa la sua argenteria. La tua siede ai tavoli del Consiglio due sedie più in là della
      Rappresentante Julia Castaldi, e per tutto il pranzo hai sentito gli ospiti di fuori lodare con sorpresa
      il salmone speziato di Liaren Tarvelin. Al tramonto Julia ride di qualcosa che le ha detto un mercante
      di Laresh, e sul palco Padre Vantes si schiarisce la voce per la preghiera della sera.

      {galateo Facile} La risata arriva un tempo dopo la battuta, quanto basta perché lui si senta spiritoso e
      gli altri capiscano che non lo è. Te l'hanno insegnato a dodici anni, e a lei viene meglio.

      Il grido arriva dall'angolo nord della piazza, seguito da un canto rauco in orchesco in cui torna a ogni
      verso una parola, *Mawrak'Thur*. Le voci vanno a tempo fra loro senza sbagliare una sillaba, e sotto il
      canto batte un colpo sordo e regolare. Tre orchi attraversano di corsa la piazza e puntano sui tavoli.
      La gente si spinge verso le scale della cattedrale, dove le porte sono chiuse per la cerimonia, e
      qualcuno è già caduto sotto i piedi degli altri. Le porte sono di quercia con le borchie di ferro, e la
      prima fila ci batte sopra con i palmi aperti. Ti accorgi di essere in piedi anche tu con la forchetta in
      mano.

      {atletica Facile} Dall'altra parte della piazza il portico del Municipio è vuoto e le sue colonne sono
      già in ombra. Nessuno ci guarda, perché tutti guardano le porte della cattedrale.

      Quintus Vael, il comandante della guardia dei Castaldi, ha sguainato la spada ed è rimasto con due
      uomini soli. Julia è in piedi e non accenna a muoversi. Al fianco porti la spada corta che ti hanno
      regalato per i diciott'anni, una lama da cerimonia con l'elsa dorata che finora è servita soprattutto a
      impigliarsi nelle sedie. Per abitudine posi la forchetta accanto al piatto con i rebbi in giù, come si
      fa a fine pasto, e metti la mano sull'elsa.
    opzioni:
      - testo: "Guidare la folla lontano dalle porte chiuse"
        descrizione: "Le porte della cattedrale non si apriranno. Il portico del Municipio, dall'altra parte della piazza, è aperto."
        costo: 0
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: La voce dei saloni
          testo: |
            Sali su una panca e alzi la voce come ti hanno insegnato a fare nei saloni, senza strillare.
            Chiami per nome le famiglie che conosci e dici loro di andare verso il Municipio, con il tono che
            si usa per annunciare che la cena è servita, e gli altri le seguono. Sotto il portico la folla si
            stringe fra le colonne, e da lì il canto arriva più debole.

            Nei giorni seguenti due vedove dei Quartieri Alti raccontano in giro che sei stat{o|a} tu a
            sgomberare le porte della cattedrale, e a ogni salotto la folla che hai salvato diventa un po' più
            numerosa. Julia Castaldi se lo sente ripetere più di una volta.
          effetti: { racconto: 1, rep.castaldi: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Fra le gambe di chi scappa
          testo: |
            Sali su una panca e provi a farti sentire. La panca si rovescia sotto la spinta della folla e tu
            finisci per terra, fra le gambe di chi scappa. Da laggiù vedi soltanto scarpe e orli di vesti, e
            un bicchiere che rotola sul selciato senza rompersi.

            Qualcuno ti pesta una mano e qualcun altro ti inciampa addosso, chiedendoti scusa per riflesso.
            Quando riesci a rialzarti hai due dita gonfie e la giacca buona strappata su una spalla. La calca
            intanto si è sciolta da sola verso le strade laterali.
          effetti: { ferite: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

      - testo: "Mettere Julia Castaldi al riparo"
        descrizione: "Lei vuole restare con la sua gente. Bisogna trovare le parole che una Rappresentante non può ignorare."
        costo: 0
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Dietro il colonnato
          testo: |
            Ti avvicini e le parli a bassa voce, con la formula che si usa nei giorni di consiglio. Le ricordi
            che se cade lei, domani in Municipio parleranno soltanto i Malgrani. Julia ti guarda un momento,
            poi fa un cenno a Quintus Vael.

            La porti dietro il colonnato con due guardie alle spalle, e lì aspettate che le campane della
            Guarnigione suonino l'adunata. Fra le colonne l'eco rimanda il canto da due lati, e per un po' non
            capisci da quale parte della piazza arrivi. Prima di tornare in piazza Julia ti chiede il nome
            della tua famiglia, e lo ripete per ricordarlo.
          effetti: { racconto: 1, rep.castaldi: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: La sua gente
          testo: |
            Julia ti ascolta per metà frase e poi si volta verso la piazza. «Allora. La mia gente è in questa
            piazza, e io resto con loro» dice, senza alzare la voce, e si liscia il colletto come a un pranzo
            qualunque.

            Resta dov'è, e tu resti con lei perché andartene adesso sarebbe peggio, e lo saprebbero tutti
            entro sera. Un orco arriva fino ai tavoli prima che Quintus Vael lo abbatta. Da vicino ha gli
            occhi lucidi di febbre e continua a cantare anche mentre cade. Nel parapiglia uno sgabello
            lanciato ti prende al ginocchio, e per giorni cammini zoppicando.
          effetti: { ferite: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

      - testo: "Attirare un orco lontano dai tavoli"
        descrizione: "Un orco in quello stato insegue quello che si muove e fa rumore. Con la spada in mano potresti sembrare un capitano della guardia."
        costo: 0
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Il vicolo del colonnato
          testo: |
            Sguaini la spada corta, sali su un tavolo fra i piatti e gridi ordini a una squadra di guardie che
            non esiste. Le chiami per nome con i nomi che ti inventi mentre li gridi, e tre sono quelli dei
            tuoi cugini. Uno degli orchi si gira verso di te, e tu scappi verso il vicolo del colonnato con
            lui alle calcagna. Alle spalle senti il suo fiato e il canto che non smette nemmeno mentre corre.

            In fondo al vicolo ti aspettano due uomini di Quintus Vael, che hanno capito il gioco. L'orco vede
            le lance solo quando ci è sopra.
          effetti: { racconto: 1, rep.castaldi: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: La spada piegata
          testo: |
            L'orco ti vede e ti raggiunge prima del vicolo. La spada corta ti vola via dalla mano al primo
            colpo, e il secondo ti apre la spalla. Ti salva una guardia dei Castaldi che lo prende di fianco
            con la lancia.

            Resti sedut{o|a} sui gradini della cattedrale con la mano sulla ferita, e il sangue ti macchia i
            polsini ricamati. Alle tue spalle le porte sono ancora chiuse. La spada la ritrovi l'indomani
            sotto un tavolo, piegata a metà della lama. Ti dispiace più per lei che per la spalla.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ seguito comune
  - id: tre-giorni-dopo
    immagine: ambientazione/qir-azel
    titolo: Tre giorni dopo
    sommario: "La città conta i morti della razzia, e al Grifone di Ferro c'è una branda pagata per chi l'ha difesa."
    luogo: Qir-Azel, tre giorni dopo il Festival
    area: citta-bassa
    tipo: prologo
    requisiti: [prologo == 2]
    testo: |
      Sono passati tre giorni dalla razzia e Qir-Azel ha finito di seppellire i suoi morti, che secondo il
      Velo sono una cinquantina fra guardie e civili. Il Festival è sospeso e sulla piazza della cattedrale
      nuova i tavoli del pranzo sono ancora rovesciati, e fra le colonne ristagna l'odore di bruciato.

      Lo sceriffo Toren Galdrick ha passato due notti nelle celle della Caserma con gli orchi presi vivi.
      Molti altri si sono gettati dal crinale nella Cicatrice pur di non farsi prendere. I prigionieri
      ripetono la litania e poco altro, ma si dice che un paio abbiano parlato e che il loro capo non fosse un
      orco. Alla Pignatta Grassa aggiungono che dovevano andare al cimitero, e scommettono su cosa ci
      cercassero. Le tre macchine dei Precursori le hanno trovate spente sulle grondaie il mattino dopo. Chi è
      salito sui tetti a guardarle racconta che sotto di loro le tegole erano spaccate e che il loro metallo
      non aveva un graffio.

      Anche la Locanda del Grifone di Ferro sui Ponti Sospesi ha avuto la sua parte, perché gli orchi in fuga
      le hanno sfondato le finestre e dato fuoco alla tettoia. Liaren Tarvelin, la proprietaria, ha fatto
      sapere che chi ha difeso la città ha una settimana di alloggio pagata e che in cambio basta raccontarle
      com'è andata.

      Tre giorni fa c'eri anche tu, e da allora ti svegli ogni notte con il canto degli orchi nelle orecchie.
      Il ritmo torna esatto verso per verso, anche se delle parole ne ricordi una sola.

      {origine figlio-della-citta-bassa} Insieme al canto ti torna l'odore della resina del carro, e al buio
      ti annusi le dita anche se le hai lavate tre volte.

      {origine apprendista-raschiatore} Quando ti svegli gli occhi cercano ancora una scala come davanti alla
      porta nord, e ci metti un po' a ricordarti che in superficie non serve.

      {origine accolito-del-velo} Ti svegli con le dita chiuse come su un laccio e resti ferm{o|a} ad
      ascoltare se dalla branda accanto arriva il respiro di un ferito.

      {origine rampollo-dei-quartieri-alti} In famiglia della razzia non si parla a tavola. A te però capita
      di posare la forchetta accanto al piatto e di restare a guardarla.

      {origine mercante-dei-ponti} Di notte ti torna in mente la fibbia d'argento di quel mantello che hai
      visto prima della faccia di chi lo portava, e ti mette a disagio più del canto.

      {origine figlio-del-circolo} Più del canto ti torna il rantolo della bestia della porta nord con il suo
      odore di ferro caldo e di pelo bruciato.

      {origine fuggiasco-di-ghoran} Quando il canto ti sveglia hai già la schiena curva come nei recinti di
      Ghoran, e prima di alzarti la raddrizzi una vertebra alla volta.

      {origine allievo-di-torvessa} A volte senti ancora nei denti la nota breve dei sei cristalli del banco,
      e conti le travi del soffitto finché smette.

      {resilienza Media fallita} La parola del canto ti torna in bocca mentre ti lavi la faccia e hai paura di
      dirla ad alta voce. Ti senti stupid{o|a}, ma la bocca la tieni chiusa.

      Adesso devi decidere da dove ricominciare.
    opzioni:
      - testo: "Tornare nei vicoli della Città Bassa"
        requisiti: [origine.figlio-della-citta-bassa >= 1]
        costo: 0
        esito:
          titolo: Le fucine battono
          testo: |
            Le fucine hanno ripreso a battere il giorno dopo la razzia, e i fabbri pagano a giornata come
            prima, quando si ricordano. Sul selciato la fuliggine delle forge si è posata sopra la cenere del
            Festival, e sotto le scarpe non distingui più l'una dall'altra. Nei vicoli qualcuno ti riconosce e
            ti offre da bere, e qualcun altro ti chiede se è vero quello che si racconta.

            Al Grifone di Ferro, sui Ponti, ti aspetta una branda pagata per sette notti. Di giorno però torni
            nei vicoli dove sei cresciut{o|a}.
          imposta: { prologo: 0 }
          effetti: { alloggio.grifone: 7 }
          vai: citta-bassa

      - testo: "Tornare sui Ponti, dove i Raschiatori contano i loro"
        requisiti: [origine.apprendista-raschiatore >= 1]
        costo: 0
        esito:
          titolo: Una branda sotto la bacheca
          testo: |
            I Raschiatori hanno contato i loro morti prima degli altri e sono già tornati al lavoro. Al
            Grifone di Ferro Liaren ha fatto rattoppare le finestre con assi di scarto, che da un lato sono
            ancora nere di fuliggine. Nella camerata, sotto la bacheca, c'è una branda pagata per una
            settimana con il tuo nome scritto col gesso e sbagliato di una lettera.

            Dicono che Dragna Gro-Malog voglia sapere da tutti cosa hanno visto alla porta nord, e che chi le
            racconta storie lunghe lo rimandi a lavorare prima della fine.
          imposta: { prologo: 0 }
          effetti: { alloggio.grifone: 7 }
          vai: ponti-sospesi

      - testo: "Scendere nella Città Bassa, dove il Velo ti manda"
        requisiti: [origine.accolito-del-velo >= 1]
        costo: 0
        esito:
          titolo: Una borsa di bende
          testo: |
            Ottilia Sanvel, che ha la responsabilità dei monaci, ti manda nella Città Bassa con una borsa di
            bende e l'ordine di tornare quando le avrai finite. Laggiù molti feriti della razzia non hanno
            ancora visto un guaritore. Mentre scendi le mani contano al tatto i rotoli nella borsa come
            monete. Il lino bollito odora ancora di liscivia.

            Per la notte non devi risalire in Cattedrale. Liaren Tarvelin ha fatto sapere al Velo che al
            Grifone di Ferro c'è una branda pagata anche per te.
          imposta: { prologo: 0 }
          effetti: { alloggio.grifone: 7 }
          vai: citta-bassa

      - testo: "Tornare ai salotti dei Quartieri Alti"
        requisiti: [origine.rampollo-dei-quartieri-alti >= 1]
        costo: 0
        esito:
          titolo: Il tuo nome nei salotti
          testo: |
            Nei Quartieri Alti i salotti hanno riaperto prima delle botteghe. Ogni sera, fra le tazze di
            porcellana e le tende tirate a metà, si discute di chi ha fatto cosa durante la razzia.

            In famiglia storcono la bocca quando sentono della branda che Liaren Tarvelin ti ha offerto al
            Grifone di Ferro sui Ponti, e ne parlano a bassa voce come di una parente caduta in disgrazia. Tu
            l'hai accettata lo stesso.
          imposta: { prologo: 0 }
          effetti: { alloggio.grifone: 7 }
          vai: quartieri-alti

      - testo: "Riaprire il banco sui Ponti"
        requisiti: [origine.mercante-dei-ponti >= 1]
        costo: 0
        esito:
          titolo: Prezzi in salita
          testo: |
            Il tuo banco sui Ponti è rimasto chiuso per tutto il Festival e non ha un graffio. L'esattore che
            passa a controllarlo sembra quasi deluso di non trovarci niente da scrivere. Sui banchi vicini i
            cartellini dei prezzi sono stati riscritti col gesso sopra i vecchi, e i numeri nuovi sono tutti
            più alti.

            Liaren Tarvelin ti ha fatto dire che al Grifone di Ferro c'è una branda pagata per una settimana,
            e la sera stessa ci hai portato le tue cose.
          imposta: { prologo: 0 }
          effetti: { alloggio.grifone: 7 }
          vai: ponti-sospesi

      - testo: "Salire sui Ponti, lontano dal fumo"
        requisiti: [origine.figlio-del-circolo >= 1]
        costo: 0
        esito:
          titolo: Ghirlande rosse
          testo: |
            Sui Ponti Sospesi il vento porta via l'odore di bruciato che ristagna ancora sulla piazza. Dalle
            corde pendono le ghirlande di foglie rosse del Festival, che nessuno ha pensato a togliere, e in
            tre giorni le foglie si sono seccate e arricciate sul filo.

            Al Grifone di Ferro Liaren ti ha lasciato una branda vicino alla finestra, pagata per sette notti.
            Da lì senti il vento che sale dalla Cicatrice e fa sbattere l'imposta rattoppata, che qualcuno ha
            fermato con un cuneo di sughero.
          imposta: { prologo: 0 }
          effetti: { alloggio.grifone: 7 }
          vai: ponti-sospesi

      - testo: "Tornare nella Città Bassa, dove si lavora a giornata"
        requisiti: [origine.fuggiasco-di-ghoran >= 1]
        costo: 0
        esito:
          titolo: Un letto pagato
          testo: |
            Nella Città Bassa nessuno ti chiede da dove vieni, e dopo la razzia la gente ha altro a cui
            pensare. Da Grusk cercano braccia per sgomberare le macerie, e alla Pignatta Grassa si scommette
            anche sui forestieri.

            Per la prima volta da quando sei scappat{o|a} da Ghoran qualcuno ti ha pagato un letto. È una
            branda al Grifone di Ferro sui Ponti Sospesi, e ti aspetta per sette notti. La prima sera la tasti
            piano con il palmo prima di fidarti a stenderti, e il pagliericcio scricchiola di paglia nuova.
          imposta: { prologo: 0 }
          effetti: { alloggio.grifone: 7 }
          vai: citta-bassa

      - testo: "Tornare all'Accademia di Torvessa"
        requisiti: [origine.allievo-di-torvessa >= 1]
        costo: 0
        esito:
          titolo: Lezioni a metà
          testo: |
            Orvald Temmerin non parla della razzia a lezione. Se qualcuno ci prova volta pagina con la punta
            del coltello da frutta e un rumore secco, e ricomincia dalla riga di prima come se la domanda
            fosse stata un colpo di tosse.

            Liaren Tarvelin ti ha fatto sapere che al Grifone di Ferro, sui Ponti, c'è una branda pagata per
            te per una settimana. In cambio chiede solo che una sera tu le racconti com'è andata al Festival.
          imposta: { prologo: 0 }
          effetti: { alloggio.grifone: 7 }
          vai: quartieri-alti
