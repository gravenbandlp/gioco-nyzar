# Prologo, prima metà: la razzia del Festival delle Foglie Alate vista da quattro origini
# (Città Bassa, Raschiatore, Velo, Quartieri Alti), più il seguito comune "tre-giorni-dopo".
# Ogni prologo si apre da solo a inizio partita (prologo == 1) e ogni esito porta a tre-giorni-dopo,
# che è l'unico storylet ad azzerare "prologo".
storylet:
  # ------------------------------------------------------------ Figlio della Città Bassa
  - id: prologo-figlio-della-citta-bassa
    immagine: ambientazione/evento-razzia-festival-150
    titolo: Il carro del falò
    sommario: "Il giorno del Festival, a sud della piazza, gli orchi danno fuoco al carro del combustibile."
    luogo: A sud della piazza della Cattedrale, il giorno del Festival
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.figlio-della-citta-bassa >= 1]
    testo: |
      È il primo giorno d'autunno e Qir-Azel festeggia le Foglie Alate davanti
      alla cattedrale nuova del Velo. Ti hanno pagato mezza giornata per
      scaricare legna e botti di pece dal carro del combustibile. Il
      carrettiere è un vecchio con le mani nere di resina, che chiama «ragazzo
      mio» chiunque abbia meno di cinquant'anni e ti ha promesso anche un
      boccale.

      Il primo grido viene dalla piazza, e subito dopo si alza un canto rauco
      in orchesco, di cui capisci soltanto una parola, *Mawrak'Thur*. Gli
      orchi sbucano dal vicolo con le torce e gli occhi lucidi come per la
      febbre. Uno lancia la torcia sul carro e la pece prende fuoco con un
      soffio caldo. Il cavallo s'impenna, e il carro scivola giù per la strada
      verso la gente che scappa, con il carrettiere aggrappato alle redini.

      Dietro gli altri avanza un orco con un tamburo di pelle legato al petto,
      che batte il tempo della litania con il pomo della mazza.

      {rissa Media} È lui quello da mettere giù. Gli altri cantano sul suo
      tempo, e senza il tempo non sapranno più cosa fare delle mani.

      *Quel vecchio ti deve ancora un boccale.* In tasca le dita hanno già
      trovato i tirapugni, e il ferro è l'unica cosa fresca in tutta la
      strada.
    opzioni:
      - testo: "Affrontare l'orco del tamburo"
        immagine: bestiario/orco-sacerdote-guerriero
        descrizione: "Finché lui batte il tempo gli altri continuano a cantare e a colpire. Hai i tirapugni in tasca."
        costo: 0
        combattimento: razzia-tamburo
        vittoria:
          titolo: Il tamburo tace
          testo: |
            L'orco del tamburo non para e non indietreggia, e quando va giù
            continua a battere il ritmo con due dita, finché la mano si ferma.
            Senza il suo tempo gli altri si sparpagliano nei vicoli.

            Due guardie della Caserma ti guardano le nocche spaccate e non hanno
            deciso se ringraziarti o portarti dentro. Il canto ti resta in testa
            tutta la notte, e il giorno dopo lo sai a memoria.
          effetti: { racconto: 1, informazioni.voce: 1, rep.caserma: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        sconfitta:
          titolo: Fumo e pece
          testo: |
            La mazza ti prende alla spalla e poi alla tempia, e ti ritrovi a terra
            fra i cocci di una botte, con il naso pieno di pece. Il carro è finito
            contro un muro senza travolgere nessuno, per quel che vedi da lì
            sotto, cioè soprattutto scarpe. Il carrettiere ti trascina via per il
            colletto, chiamandoti «ragazzo mio».
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

      - testo: "Fermare il carro prima che arrivi alla folla"
        descrizione: "Saltare a cassetta, strappare le redini al vecchio e voltare il cavallo. Conosci queste strade meglio di lui."
        costo: 0
        prova: { attributo: fisico, abilita: [conoscenze-della-strada, acrobazia], difficolta: Media }
        successo:
          titolo: Il cortile del bottaio
          testo: |
            Salti sul predellino e strappi le redini al vecchio, che le molla
            senza discutere. A dieci passi c'è il cortile di un bottaio con il
            portone aperto, dove da bambino andavi a rubare i cerchi di ferro, e
            il carro ci entra in fiamme. Il bottaio ti maledice per le botti,
            precisando ogni tanto «di rovere, erano», e il carrettiere piange
            mentre il carro brucia fino a notte.
          effetti: { racconto: 1, rep.scuri: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Botti in fiamme
          testo: |
            Il cavallo ti vede arrivare e scarta, e il carro si rovescia a pochi
            passi dalla gente, con le botti di pece che rotolano accese sul
            selciato. Tiri fuori il carrettiere da sotto una ruota, e lui ti
            ringrazia chiamandoti «ragazzo mio» con la faccia nella polvere.
            Mentre lo trascini via una botte ti lascia sulla gamba una bruciatura
            lunga una spanna.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ Apprendista Raschiatore
  - id: prologo-apprendista-raschiatore
    immagine: bestiario/salvaguardia-precursori
    titolo: Davanti alla porta nord
    sommario: "Il giorno del Festival, presso la porta nord, dai tetti calano le macchine della Salvaguardia."
    luogo: Presso la porta nord e il Daino Zoppo, il giorno del Festival
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.apprendista-raschiatore >= 1]
    testo: |
      È il primo giorno d'autunno e la città festeggia le Foglie Alate
      davanti alla cattedrale nuova del Velo. Tu hai lasciato la piazza
      presto, perché la Cicatrice ti ha insegnato a diffidare delle folle, e
      al tramonto sei seduto fuori dal Daino Zoppo, vicino alla porta nord,
      con un boccale che l'oste ha annacquato.

      Dalla piazza arriva un grido, e poco dopo sbuca un orco in sella a un
      cinghiale corazzato dalla pelle nera, con vene color acciaio che
      pulsano sotto la cotenna. Hai visto abbastanza carcasse sulle
      piattaforme per riconoscere la mano della Marea Grigia. Il cinghiale
      travolge un mercante, che si rannicchia dietro un barile mentre il suo
      cane gli si mette davanti.

      Il capo degli orchi alza la testa verso i tetti e grida una frase nella
      sua lingua, con dentro due volte la stessa parola, *Mawrak'Thur*. Dalle
      grondaie calano tre macchine della Salvaguardia dei Precursori. La più
      vicina ha quattro braccia che finiscono in innesti di metallo, e dietro
      di lei scende una figura sottile con la testa ruotata all'indietro.

      Nelle rovine un Raschiatore che se le trova davanti torna alla scala e
      risale, e ti ritrovi in piedi con il boccale in mano a cercare una
      scala che in superficie non c'è. Qui hai soltanto la porta nord e
      l'ingresso della locanda.
    opzioni:
      - testo: "Portare via la gente dalla porta nord"
        descrizione: "La regola dei Raschiatori vale anche in superficie. Prima si esce, e chi resta indietro si trascina."
        costo: 0
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Oltre l'arco
          testo: |
            Spingi dentro la locanda una serva del Daino Zoppo, poi torni fuori
            per due ragazzi rimasti impietriti contro il muro e li porti oltre la
            porta nord correndo curvo, come sulle piattaforme quando cede
            un'impalcatura. Gli altri ti seguono. Quando arrivano le guardie,
            dall'altra parte dell'arco c'è una ventina di persone vive, e alcune,
            nei giorni seguenti, chiederanno il tuo nome ai Raschiatori.
          effetti: { racconto: 1, rep.raschiatori: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: La corazza del cinghiale
          testo: |
            Uno dei ragazzi si divincola e torna indietro a cercare la madre. Lo
            insegui, e il cinghiale ti passa così vicino che una piastra della
            corazza ti apre il fianco. Riesci a trascinarlo oltre l'arco, e lì
            resti seduto contro la pietra mentre una guardia ti preme uno straccio
            sulla ferita, ripetendo «Tieni qui». Il ragazzo è già corso dalla
            madre, senza un graffio.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

      - testo: "Affrontare uno degli orchi"
        immagine: fazioni/tribu-capomozzo
        descrizione: "Uno dei gregari del capo viene verso di te cantando. Hai il pugnale e il giaco imbottito."
        costo: 0
        combattimento: razzia-orco
        vittoria:
          titolo: Sotto il portico
          testo: |
            L'orco non para e non si ritira, e continua a cantare anche quando il
            pugnale gli entra sotto l'ascella. Lo lasci seduto contro il muro del
            Daino Zoppo, con la bocca ancora aperta sull'ultima sillaba.

            Quando alzi gli occhi le macchine non sono più nel vicolo, e il capo
            degli orchi è a terra fra le guardie della porta. Ti resta in testa la
            parola che ha gridato ai tetti.
          effetti: { racconto: 1, informazioni.voce: 1, rep.raschiatori: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        sconfitta:
          titolo: Il cielo sopra i tetti
          testo: |
            L'orco ti colpisce con il manico dell'ascia e ti ritrovi a terra sotto
            il portico del Daino Zoppo, con la bocca piena di sangue e un dente
            che dondola. Per un po' guardi il cielo e conti le farfalle
            foglia-rossa che ci girano sopra, e quando qualcuno ti rimette in
            piedi gli orchi se ne sono andati. Delle macchine restano solo i segni
            degli artigli sulle grondaie.
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

      - testo: "Osservare le macchine da vicino"
        descrizione: "È proprio quello che un Raschiatore non deve fare. Però non capita spesso di vederle fuori dalle rovine."
        costo: 0
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Un ordine
          testo: |
            Dietro un carro rovesciato le guardi lavorare. Le macchine lasciano
            stare orchi e passanti. Si muovono insieme, e ogni tanto si fermano
            con la testa inclinata, come cani che sentono un fischio. Nelle rovine
            le hai sempre viste difendere un posto, qui eseguono un ordine del
            capo degli orchi.

            {politica-ed-economia Difficile} Un orco che comanda le macchine dei
            Precursori vale più di qualsiasi razzia, per chi gliel'ha insegnato.
          effetti: { racconto: 1, informazioni.voce: 1, rep.raschiatori: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Il braccio sottile
          testo: |
            Ti avvicini di quei tre passi che sulle piattaforme ti avrebbero fatto
            sgridare. La macchina con la testa rovesciata si gira, e un braccio
            sottile ti passa sulla faccia. Ti butti in un fosso di scolo finché i
            passi di metallo non si allontanano, e il taglio si chiude in una
            cicatrice dallo zigomo al mento, di quelle che ai Raschiatori piace
            confrontare a tavola.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ Accolito del Velo
  - id: prologo-accolito-del-velo
    immagine: personaggi/padre-vantes
    titolo: La tenda dei feriti
    sommario: "Il giorno del Festival, sotto il palco, gli orchi arrivano alla tenda dove Padre Vantes cura i feriti."
    luogo: Sotto il palco della Cattedrale, il giorno del Festival
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.accolito-del-velo >= 1]
    testo: |
      È il primo giorno d'autunno e davanti alla cattedrale nuova si
      festeggiano le Foglie Alate. Al tramonto sei con Padre Vantes sotto il
      palco, nella tenda del Velo per chi ha preso troppo sole o si è storto
      una caviglia. Finora il caso più grave era un mercante seduto su un'ape,
      convinto che gliel'avessero mandata i concorrenti.

      Il vecchio sale a recitare la preghiera della sera, e dalla piazza
      arrivano le grida. In pochi minuti la tenda si riempie di feriti, e le
      mani vanno alle bende da sole, perché le conoscono meglio delle
      preghiere. Padre Vantes torna giù senza una parola e comincia a imporre
      le mani, e ogni volta che una ferita si chiude il suo viso si fa più
      grigio.

      {magia Media} Il calore che gli esce dai palmi è sempre lo stesso, ma
      ogni volta gli costa di più tirarlo fuori.

      A un certo punto il telo d'ingresso si strappa. Fuori ci sono due orchi
      con gli occhi lucidi che cantano in orchesco una litania in cui torna
      sempre la stessa parola, *Mawrak'Thur*. Una guardia della Caserma si
      mette in mezzo con la lancia, e un ragazzo del coro raccoglie un bastone
      da terra, tenendolo al contrario.

      Vantes non alza la testa dal ferito. «Tu pensa a loro» ti dice, e indica
      le brande.
    opzioni:
      - testo: "Curare i feriti mentre fuori si combatte"
        descrizione: "Hai lacci e garze a sufficienza. Il tuo lavoro è tenerli vivi finché qualcuno non ferma gli orchi."
        costo: 0
        prova: { attributo: mentale, abilita: medicina, difficolta: Facile }
        successo:
          titolo: Mani sporche fino ai polsi
          testo: |
            Lavori con le mani sporche fino ai polsi. Stringi un laccio sopra un
            taglio e premi le garze sul fianco di una donna, che intanto ti chiede
            scusa per il disturbo. Quando la guardia rientra zoppicando il peggio
            è passato, e Vantes ti guarda le mani e annuisce piano. Nei giorni
            seguenti qualcuno di quelli che hai tenuto in vita viene in Cattedrale
            a chiedere di te.
          effetti: { racconto: 1, rep.velo: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Un taglio cucito a metà
          testo: |
            Stai cucendo un taglio sulla fronte di un ragazzo quando la guardia
            cade all'indietro dentro la tenda e un orco entra dietro di lei. Ti
            butti sul ragazzo per coprirlo, e la mazza ti prende sulla schiena.
            L'orco esce dall'altro lato inseguendo qualcuno. Quando riesci a
            rialzarti il ragazzo respira ancora, con il taglio cucito a metà.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

      - testo: "Pregare ad alta voce su chi difende la tenda"
        immagine: fazioni/confraternita-del-velo
        descrizione: "Una preghiera breve al Grande Albero Rosso, detta a voce alta sulla guardia e sul ragazzo con il bastone."
        costo: 0
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Il calore nel palmo
          testo: |
            Alzi la mano sulla guardia e sul ragazzo e dici in fretta le parole
            della Benedizione. Il calore ti scende dal palmo nel braccio della
            guardia, e la lancia prende il primo orco sotto le costole. Il secondo
            si ritira quando il ragazzo gli rompe il bastone sul muso. Più tardi
            Vantes ti dice che ha sentito, lisciandosi la manica sporca. «Un po'
            in fretta, ma detta bene.»
          effetti: { racconto: 1, rep.velo: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Parole impastate
          testo: |
            Le parole ti si impastano in bocca e perdi il filo della preghiera
            proprio dove Vantes ti aveva detto di fare la pausa. Il secondo orco
            scavalca la guardia ed entra nella tenda, e la sua mazza ti prende alla
            spalla prima che il ragazzo del coro gli spacchi il bastone sulla
            testa.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

      - testo: "Portare via i feriti dal retro della tenda"
        descrizione: "Quelli che camminano possono uscire da dietro, se qualcuno li guida con calma lungo il fianco della cattedrale."
        costo: 0
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: La porta dei sagrestani
          testo: |
            Tagli il telo sul retro con le forbici delle bende e fai uscire per
            primi quelli che camminano. Li guidi lungo il fianco della cattedrale
            fino alla porta dei sagrestani, e bussi finché non ti apre un
            sagrestano con il tovagliolo del pranzo ancora al collo. Quando torni
            a prenderlo, Vantes ti stringe il polso, e da quel giorno in
            Cattedrale ti salutano con un altro rispetto.
          effetti: { racconto: 1, rep.velo: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Il polso slogato
          testo: |
            Nella fretta un uomo con la gamba steccata ti cade addosso e ti trascina giù, scusandosi a voce
            altissima, e fra le brande si sparge il panico. Quando arrivate alla porta dei sagrestani hai
            il polso slogato, e due feriti sono tornati indietro per la paura. Li ritrovi più tardi, vivi,
            sotto le brande.
          effetti: { ferite: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ Rampollo dei Quartieri Alti
  - id: prologo-rampollo-dei-quartieri-alti
    immagine: personaggi/julia-castaldi
    titolo: I tavoli del Consiglio
    sommario: "Il giorno del Festival, ai tavoli del pranzo accanto a Julia Castaldi, gli orchi caricano la piazza."
    luogo: Piazza della Cattedrale, ai tavoli del Consiglio
    area: quartieri-alti
    tipo: prologo
    requisiti: [prologo == 1, origine.rampollo-dei-quartieri-alti >= 1]
    testo: |
      È il primo giorno d'autunno e la città festeggia le Foglie Alate davanti
      alla cattedrale nuova. La tua famiglia ha un posto ai tavoli del Consiglio,
      due sedie più in là della Rappresentante Julia Castaldi, e gli ospiti di
      fuori hanno lodato il salmone speziato di Liaren Tarvelin come se nessuno
      li avesse avvertiti che a Qir-Azel si mangia. Al tramonto Julia ride di
      qualcosa che le ha detto un mercante di Laresh.

      {galateo Facile} La risata arriva un tempo dopo la battuta e un tono sotto,
      quanto basta perché lui si senta spiritoso e gli altri capiscano che non lo
      è.

      Dall'angolo nord della piazza arriva un grido, e dietro il grido un canto
      rauco in orchesco, di cui riconosci soltanto una parola, *Mawrak'Thur*. Tre
      orchi attraversano la piazza di corsa e puntano sui tavoli, e la gente si
      spinge verso le scale della cattedrale, dove le porte sono chiuse per la
      cerimonia.

      Quintus Vael, il comandante della guardia dei Castaldi, ha sguainato la
      spada ed è rimasto con due uomini soli. Julia è in piedi e non accenna a
      muoversi. Al fianco porti una spada corta da cerimonia, che finora è
      servita soprattutto a impigliarsi nelle sedie. Per abitudine posi la
      forchetta accanto al piatto, poi metti la mano sull'elsa.
    opzioni:
      - testo: "Guidare la folla lontano dalle porte chiuse"
        descrizione: "Le porte della cattedrale non si apriranno. Il portico del Municipio, dall'altra parte della piazza, è aperto."
        costo: 0
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: La voce dei saloni
          testo: |
            Sali su una panca e alzi la voce senza strillare. Chiami per nome le
            famiglie che conosci e le mandi verso il portico del Municipio, con il
            tono che si usa per annunciare che la cena è servita, e gli altri le
            seguono. Nei giorni seguenti due vedove dei Quartieri Alti raccontano
            in giro che sei stato tu a sgomberare le porte della cattedrale,
            finché lo sente anche Julia Castaldi.
          effetti: { racconto: 1, rep.castaldi: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: Fra le gambe di chi scappa
          testo: |
            Sali su una panca, che si rovescia sotto la spinta della folla, e
            finisci per terra fra le gambe di chi scappa. Quando riesci a
            rialzarti hai due dita gonfie e la giacca buona strappata su una
            spalla, e la calca si è sciolta da sola verso le strade laterali.
          effetti: { ferite: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

      - testo: "Mettere Julia Castaldi al riparo"
        descrizione: "Lei vuole restare con la sua gente. Bisogna trovare le parole che una Rappresentante non può ignorare."
        costo: 0
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Dietro il colonnato
          testo: |
            Ti avvicini e le parli a bassa voce, con la formula dei giorni di
            consiglio. Le ricordi che se cade lei, domani in Municipio parleranno
            soltanto i Malgrani. Julia ti guarda un momento, poi fa un cenno a
            Quintus Vael. Dietro il colonnato aspettate che le campane della
            Guarnigione suonino l'adunata, e prima di tornare in piazza Julia ti
            chiede il nome della tua famiglia, e lo ripete per ricordarlo.
          effetti: { racconto: 1, rep.castaldi: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: La sua gente
          testo: |
            Julia ti ascolta per metà frase e poi si volta verso la piazza. «La
            mia gente è qui» dice, lisciandosi il colletto come a un pranzo
            qualunque. Resti con lei, perché se te ne andassi adesso lo saprebbero
            tutti entro sera. Un orco arriva fino ai tavoli prima che Quintus Vael
            lo abbatta, e nel parapiglia uno sgabello lanciato ti prende al
            ginocchio.
          effetti: { ferite: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

      - testo: "Attirare un orco lontano dai tavoli"
        descrizione: "Un orco in quello stato insegue chi fa rumore, e con la spada in mano sembri un capitano."
        costo: 0
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Il vicolo del colonnato
          testo: |
            Sguaini la spada corta, sali su un tavolo e gridi ordini a una squadra
            di guardie che non esiste, con nomi inventati sul momento, tre dei
            quali sono cugini tuoi. Un orco ti insegue fino al vicolo del
            colonnato, dove lo aspettano con le lance due uomini di Quintus Vael
            che hanno capito il gioco. La sera stessa Quintus racconta la scena a
            Julia Castaldi.
          effetti: { racconto: 1, rep.castaldi: 0.5 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo
        fallimento:
          titolo: La spada piegata
          testo: |
            L'orco ti raggiunge prima del vicolo. La spada corta ti vola via dalla
            mano al primo colpo, e il secondo ti apre la spalla, finché una
            guardia dei Castaldi lo prende di fianco con la lancia. La spada la
            ritrovi piegata l'indomani sotto un tavolo, e ti dispiace più per lei
            che per la spalla.
          effetti: { ferite: 1 }
          imposta: { prologo: 2 }
          segue: tre-giorni-dopo

  # ------------------------------------------------------------ seguito comune
  - id: tre-giorni-dopo
    immagine: ambientazione/qir-azel
    titolo: Tre giorni dopo
    sommario: "La città conta i morti, e al Grifone di Ferro c'è una branda pagata per chi l'ha difesa."
    luogo: Qir-Azel, tre giorni dopo il Festival
    area: citta-bassa
    tipo: prologo
    requisiti: [prologo == 2]
    testo: |
      Tre giorni dopo la razzia Qir-Azel ha seppellito i suoi morti, una
      cinquantina secondo il Velo, e le osterie li contano ancora. Lo
      sceriffo Toren Galdrick ha interrogato gli orchi presi vivi, e si dice
      che il loro capo non fosse un orco e che cercassero qualcosa al
      cimitero.

      Liaren Tarvelin, la proprietaria del Grifone di Ferro sui Ponti, offre
      una settimana di alloggio a chi ha difeso la città, in cambio del
      racconto. Ogni notte ti svegli con il canto degli orchi nelle
      orecchie.

      {origine figlio-della-citta-bassa} Con il canto ti torna l'odore della
      resina del carro, e al buio ti annusi le dita.

      {origine apprendista-raschiatore} Quando ti svegli gli occhi cercano
      ancora una scala, come davanti alla porta nord.

      {origine accolito-del-velo} Ti svegli con le dita chiuse come su un
      laccio da stringere.

      {origine rampollo-dei-quartieri-alti} A tavola ti capita di posare la
      forchetta e di restare a guardarla.

      {origine mercante-dei-ponti} Di notte ti torna in mente la fibbia
      d'argento di quel mantello, vista prima della faccia.

      {origine figlio-del-circolo} Più del canto ti torna il rantolo della
      bestia della porta nord.

      {origine fuggiasco-di-ghoran} Il canto ti sveglia con la schiena già
      curva, come nei recinti di Ghoran.

      {origine allievo-di-torvessa} A volte senti ancora nei denti la nota
      breve dei sei cristalli del banco.

      Adesso devi decidere da dove ricominciare.
    opzioni:
      - testo: "Tornare nei vicoli della Città Bassa"
        requisiti: [origine.figlio-della-citta-bassa >= 1]
        costo: 0
        esito:
          titolo: Le fucine battono
          testo: |
            Le fucine hanno ripreso a battere il giorno dopo la razzia, e i fabbri
            pagano a giornata come prima, quando si ricordano. Nei vicoli qualcuno
            ti offre da bere e ti chiede se è vero quello che si racconta, e
            capisci che in tre giorni la storia è cresciuta parecchio. Di notte ti
            aspetta la branda al Grifone di Ferro, ma di giorno torni nei vicoli
            dove sei cresciuto.
          imposta: { prologo: 0 }
          effetti: { alloggio.grifone: 7 }
          vai: citta-bassa

      - testo: "Tornare sui Ponti, dove i Raschiatori contano i loro"
        requisiti: [origine.apprendista-raschiatore >= 1]
        costo: 0
        esito:
          titolo: Una branda sotto la bacheca
          testo: |
            I Raschiatori hanno contato i loro morti prima degli altri e sono già
            tornati al lavoro. Al Grifone di Ferro c'è una branda con il tuo nome
            scritto col gesso, sbagliato di una lettera. Dicono che Dragna
            Gro-Malog voglia sapere da tutti cosa hanno visto alla porta nord, e
            che chi le racconta storie lunghe lo rimandi a lavorare prima della
            fine.
          imposta: { prologo: 0 }
          effetti: { alloggio.grifone: 7 }
          vai: ponti-sospesi

      - testo: "Scendere nella Città Bassa, dove il Velo ti manda"
        requisiti: [origine.accolito-del-velo >= 1]
        costo: 0
        esito:
          titolo: Una borsa di bende
          testo: |
            Ottilia Sanvel, che ha la responsabilità dei monaci, ti manda nella
            Città Bassa con una borsa di bende e l'ordine di tornare quando le
            avrai finite, perché laggiù molti feriti non hanno ancora visto un
            guaritore. Le mani contano i rotoli al tatto, come monete. Per la
            notte non devi risalire in Cattedrale, perché al Grifone di Ferro c'è
            una branda pagata anche per te.
          imposta: { prologo: 0 }
          effetti: { alloggio.grifone: 7 }
          vai: citta-bassa

      - testo: "Tornare ai salotti dei Quartieri Alti"
        requisiti: [origine.rampollo-dei-quartieri-alti >= 1]
        costo: 0
        esito:
          titolo: Il tuo nome nei salotti
          testo: |
            Nei Quartieri Alti i salotti hanno riaperto prima delle botteghe, e
            ogni sera si discute di chi ha fatto cosa durante la razzia. Due
            famiglie ti hanno già mandato un invito a cena su carta pesante. In
            famiglia storcono la bocca per la branda al Grifone di Ferro che
            Liaren Tarvelin ti ha offerto e che tu hai accettato lo stesso.
          imposta: { prologo: 0 }
          effetti: { alloggio.grifone: 7 }
          vai: quartieri-alti

      - testo: "Riaprire il banco sui Ponti"
        requisiti: [origine.mercante-dei-ponti >= 1]
        costo: 0
        esito:
          titolo: Prezzi in salita
          testo: |
            Al Mercato dei Nodi i prezzi sono saliti il giorno stesso della
            razzia, e la Gilda ha già mandato i suoi esattori a contare le
            perdite. Il tuo banco sui Ponti non ha un graffio, e l'esattore sembra
            quasi deluso di non trovarci niente da scrivere. La sera stessa porti
            le tue cose al Grifone di Ferro, dove Liaren Tarvelin ti ha fatto
            trovare una branda pagata.
          imposta: { prologo: 0 }
          effetti: { alloggio.grifone: 7 }
          vai: ponti-sospesi

      - testo: "Salire sui Ponti, lontano dal fumo"
        requisiti: [origine.figlio-del-circolo >= 1]
        costo: 0
        esito:
          titolo: Ghirlande rosse
          testo: |
            Sui Ponti Sospesi il vento porta via l'odore di bruciato che ristagna
            ancora sulla piazza, e dalle corde pendono le ghirlande di foglie
            rosse del Festival. Al Grifone di Ferro Liaren ti ha lasciato una
            branda vicino alla finestra, pagata per sette notti, e da lì senti il
            vento della Cicatrice sbattere l'imposta rattoppata.
          imposta: { prologo: 0 }
          effetti: { alloggio.grifone: 7 }
          vai: ponti-sospesi

      - testo: "Tornare nella Città Bassa, dove si lavora a giornata"
        requisiti: [origine.fuggiasco-di-ghoran >= 1]
        costo: 0
        esito:
          titolo: Un letto pagato
          testo: |
            Nella Città Bassa nessuno ti chiede da dove vieni, e da Grusk cercano
            braccia per le macerie.

            {furtivita Facile} Ti siedi con la schiena al muro e la porta in
            vista, come a Ghoran, anche dove non serve.

            Per la prima volta da quando sei scappato qualcuno ti paga un letto,
            una branda al Grifone per sette notti, e la prima sera la tasti prima
            di stenderti.
          imposta: { prologo: 0 }
          effetti: { alloggio.grifone: 7 }
          vai: citta-bassa

      - testo: "Tornare all'Accademia di Torvessa"
        requisiti: [origine.allievo-di-torvessa >= 1]
        costo: 0
        esito:
          titolo: Lezioni a metà
          testo: |
            All'Accademia le lezioni sono riprese a metà, perché molti allievi
            sono ancora a casa. Orvald Temmerin non parla della razzia, e se
            qualcuno ci prova volta pagina con un rumore secco e ricomincia dalla
            riga di prima. Al Grifone di Ferro, sui Ponti, ti aspetta una branda
            pagata per una settimana, in cambio del racconto di com'è andata al
            Festival.
          imposta: { prologo: 0 }
          effetti: { alloggio.grifone: 7 }
          vai: quartieri-alti
